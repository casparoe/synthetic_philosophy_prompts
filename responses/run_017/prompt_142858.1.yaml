  If they had a general rule, they couldn't because we require one card per action.

  **Debrief Points:**
  - The number of rules they had to write initially: 6 actions, each with conditions. Total conditions: 5.
  - When adding an action of the same type: +1 card, +1 condition.
  - When adding a fluent that is a precondition for N actions: +N conditions.

  But in a real system, if they had a factored representation (like a common function), they could avoid the +N. But in this simple card representation, they can't.

  ### Summary of the Activity

  **Phase 1 (15 minutes):**
  - Teams get a list of 20 fluents and 6 actions.
  - Task: For each action, write an effect card (unconditional) that lists which fluents change and how.
  - They turn in the cards.

  **Phase 2 (25 minutes):**
  - Instructor reveals the physics binder (which has conditional rules). We add the "Power on" fluent and set it to false in the initial state.
  - Teams are given a starting state (on a sticky note) and a sequence of 2 actions.
  - For each action, they update the state using their effect cards.
  - Then we reveal the true state (using the physics binder). They see discrepancies.
  - Task: Revise their effect cards to include conditions. They must have one card per action.
  - Scoring for Phase 2: We run one round with a new starting state and one action. 
    - Penalty = number of fluents in which their final belief state (after the action) is wrong.
    - Representation cost = total number of atomic conditions in all their action cards.
    - Score = - (penalty) - (representation cost)

  **Phase 3 (40 minutes):**
  - We add the Timer actions and fluent, and the environment rule for the timer.
  - We add the indirect fluent "Air fresh" and its environment rule (provided).
  - We also add the environment rule for Room humid later? Let's not complicate too much. We'll add the timer now and then later add the power saving mode.

  Revised Phase 3:
  - Start with 20 fluents + Power on (21) + Timer active (22).
  - Actions: 6 initial + Set Timer and Cancel Timer (so 8 actions).
  - Environment rules: 
    1. Timer: After agent action, if Timer active, then decrement count. If count=0, then set all lights and TV to off, and Timer active to false.
  - Teams are given a starting state and a sequence of 5 actions (which include Set Timer and Cancel Timer).
  - Each turn:
    1. Agent action: teams update belief state using their action rules.
    2. Environment update: teams update belief state using the environment rules (they have the rule cards).
    3. They choose one fluent to observe, get the true value, and update that fluent in their belief state.
    4. We compute the penalty (number of fluents wrong in belief state).
    5. Representation cost is the total atomic conditions in action cards and environment rule cards.
    6. Turn score = - (penalty) - (representation cost)

  - After turn 2: Add a new action: Toggle light (bathroom) [action 9]. Teams add a card for it. Representation cost increases.
  - After turn 4: Add a new fluent: Power saving mode (fluent 23). We tell them the initial value (false). We also provide an environment rule: none? It is set by an action? Or we add it as a precondition. We add it as a fluent that can be toggled by a new action? But we don't add a new action. Instead, we say that it can be turned on by an environment event (at turn 5, we set it to true). And then it affects the device actions: they only work if power saving mode is off and power on. Teams have to update their action cards accordingly.

  **Final Instructions to Students:**

  **Phase 1:**
  "Here is the list of fluents and actions. Write one index card per action. On the card, write the action name and then a list of which fluents change and to what. For example, for 'Turn on TV', you might write: 'TV on becomes true'. We will use these cards to simulate the apartment. You have 10 minutes."

  **Phase 2:**
  "Now we have a new fluent: 'Power on'. The starting state is written on the sticky note. The agent will perform two actions in sequence. For each action, use your effect cards to update the state. After both actions, we will reveal the true state. Then, you will have 5 minutes to revise your effect cards to include any necessary conditions. Remember, the physics binder (my cards) is the authority. After revising, we will run one more round with a new state and one action, and score you on accuracy and compactness."

  **Phase 3:**
  "Now we are adding a timer. There are two new actions: 'Set Timer' and 'Cancel Timer', and a new fluent: 'Timer active'. Also, there is an environment rule for the timer (provided on a card). You will maintain a belief state for the apartment. Each turn:
  1. The agent takes an action (from a list I provide).
  2. You update your belief state using your action rules.
  3. You update for environment rules (using the provided cards).
  4. You choose one fluent to observe (by asking me). I will tell you its true value, and you update your belief state for that fluent.
  5. I will then reveal the entire true state, and you will see which fluents you have wrong.

  Scoring: At the end of each turn, you lose 1 point for each fluent that is wrong in your belief state, and you lose 1 point for each atomic condition in your action and environment rules (representation cost). We will run 5 turns. After turn 2, we add a new action: 'Toggle light (bathroom)'. After turn 4, we add a new fluent: 'Power saving mode' (initial value false), and at that time we also set it to true (by environment). You must update your rules: for each action that turns on a device, it now requires that 'Power saving mode' is off. You have 2 minutes after the announcement to update your cards."

  **Debrief:**
  1. Recall the phases and what broke.
  2. In Phase 1, unconditional rules failed because they didn't account for conditions.
  3. In Phase 2, they had to add conditions, which made the representation more expensive.
  4. In Phase 3, they experienced:
     - The deferral: the timer effect happens later, and they might not have observed it.
     - The indirect fluent: "Air fresh" depends on other fluents.
     - The revision asymmetry: 
          - Adding a new action (bathroom light) cost one new card (cheap).
          - Adding a new fluent (power saving mode) cost updating many cards (expensive).
  5. The frame problem: they had to explicitly state what changes, but also what stays the same is assumed? Not quite. In their update, they only changed what their rules said to change. The rest they assumed stayed the same? But they didn't write that. So they experienced the inertia by default. But when the environment changed something (timer), they had to have a rule for it.
  6. The counting argument: if there are F fluents and A actions, then to write the frame axioms (what doesn't change) you need A*F statements. That's too many. Or you can use a general rule (inertia) but then you have to handle the exceptions (which are many).

  **Handling Predictable Problems:**
  - **Common-sense smuggling:** If students say "but in reality, we know that toggling a light doesn't change the trash", remind them that the physics binder is the only authority. They must go by the rules provided.
  - **Over-flagging/under-flagging:** In belief update, teams might observe the same fluent repeatedly or none at all. Encourage them to think about what might have changed.
  - **Degenerate strategy:** A team might observe one fluent and assume the rest are unchanged. But if the timer goes off, many fluents change. They will learn.
  - **"Why can't the agent just look?"** 
    - Reply: "Looking (observing) is expensive. In this game, you can only look at one fluent per turn. In a real system, sensors are limited. Moreover, to know what to look for, you already need to know what might have changed. But that is exactly the frame problem: knowing what might have changed requires knowing what the action affects, but also what the environment might have done. And that can be arbitrarily complex."

  **Limits:** 
  - The activity shows the syntactic and computational aspect of the frame problem. The deeper philosophical point (that the world is not a closed list of fluents) has to be discussed. Also, the activity assumes a representational approach; we don't show how other architectures (like neural nets) might avoid it. We discuss that at the end.

  This design meets the constraints and should create the desired experience.
answer: |-
  Below is a comprehensive design for your 90-minute seminar activity. It's structured to make students confront the frame problem experientially through a tabletop game set in a "lab bench" world. The design includes a ramp of three phases, scoring that highlights trade-offs in representation, and deliberate complications (deferred effect and indirect fluent). I'll provide all requested components.

  ---

  ### **World Setup: The Lab Bench**
  A closed world with 15 fluents and 6 initial actions (expandable to 7 actions and 16 fluents mid-game). Fluents represent boolean states (true/false) of objects on a lab bench. Actions cause changes based on causal rules. All rules are deterministic and enforced via a "Physics Binder" (index cards you control).

  **Fluents (15):**  
  1. `Bunsen_Burner_On`  
  2. `Beaker_Full` (with liquid)  
  3. `Beaker_Heated`  
  4. `Stirrer_On`  
  5. `Chemical_A_Present`  
  6. `Chemical_B_Present`  
  7. `Solution_Mixed`  
  8. `Timer_Active` (for deferred effect)  
  9. `Vial_Capped`  
  10. `Scale_On`  
  11. `Weight_Measured`  
  12. `Safety_Goggles_On`  
  13. `Fume_Hood_Closed`  
  14. `Lab_Tidy` (indirect fluent; no action changes it directly)  
  15. `Alert_Silenced`  

  **Actions (6 initial):**  
  1. `Ignite_Burner`  
  2. `Fill_Beaker`  
  3. `Toggle_Stirrer`  
  4. `Add_Chemical_A`  
  5. `Add_Chemical_B`  
  6. `Cap_Vial`  

  **Added mid-game:**  
  7. `Weigh_Sample` (action added in Phase 3)  
  8. `Silence_Alert` (action added in Phase 3, with deferred effect)  
  9. New fluent: `Spill_Hazard` (added in Phase 3, affecting `Lab_Tidy`).  

  ---

  ### **Causal Rules (Physics Binder)**
  Rules are written on index cards. Teams reference these when updating states. Key complications:  
  - **Deferred effect:** `Silence_Alert` sets `Alert_Silenced=true` after 2 turns, but only if `Fume_Hood_Closed=false` at the time of silence. If `Fume_Hood_Closed` becomes true later, the alert reactivates (`Alert_Silenced=false`).  
  - **Indirect fluent:** `Lab_Tidy` is true only if:  
    - `Beaker_Full=false`, `Chemical_A_Present=false`, `Chemical_B_Present=false`, and `Spill_Hazard=false`.  
    No action changes `Lab_Tidy` directly; it depends on other fluents.  

  **Full Rule Set (for your reference; summarize for students on cards):**  
  - `Ignite_Burner`: If `Beaker_Full=true`, then `Bunsen_Burner_On=true` and `Beaker_Heated=true`. Otherwise, no effect.  
  - `Fill_Beaker`: Sets `Beaker_Full=true`. If `Bunsen_Burner_On=true`, also sets `Beaker_Heated=false` (liquid cools burner).  
  - `Toggle_Stirrer`: Toggles `Stirrer_On`. If `Stirrer_On=true` and `Beaker_Full=true`, sets `Solution_Mixed=true` after 1 turn (deferred, but immediate for simplicity).  
  - `Add_Chemical_A`: Sets `Chemical_A_Present=true`. If `Beaker_Full=true`, also sets `Solution_Mixed=false` (resets mixture).  
  - `Add_Chemical_B`: Sets `Chemical_B_Present=true`. If `Beaker_Full=true`, also sets `Solution_Mixed=false`.  
  - `Cap_Vial`: Toggles `Vial_Capped`.  
  - `Weigh_Sample` (added later): If `Scale_On=true`, sets `Weight_Measured=true`.  
  - `Silence_Alert` (added later): Starts a timer (`Timer_Active=true`). After 2 turns, if `Timer_Active=true` and `Fume_Hood_Closed=false`, sets `Alert_Silenced=true`. If `Fume_Hood_Closed` becomes true before 2 turns, cancels silence (`Alert_Silenced=false`).  
  - **Environment rule (for indirect fluent):** At the end of each turn, `Lab_Tidy` updates automatically: true only if `Beaker_Full=false`, `Chemical_A_Present=false`, `Chemical_B_Present=false`, and `Spill_Hazard=false`.  
  - **New fluent rule (added mid-game):** `Spill_Hazard` becomes true if `Stirrer_On=true` and `Beaker_Full=false` (spins empty beaker).  

  ---

  ### **Materials & Setup**  
  - **Teams:** 6 teams of 3. Each team gets:  
    - A whiteboard section (for belief board: 15 sticky notes labeled with fluents, true/false markers).  
    - Index cards for writing action rules.  
    - A starting state card (e.g., "Initial: `Beaker_Full=true`, `Fume_Hood_Closed=true`, all else false").  
  - **Instructor:** Timer, dice (for random events), Physics Binder (index cards with rules), scoreboard.  
  - **Projector:** Show turn sequences and scoring.  

  ---

  ### **Phase 1: Naive Effect Specification (20 min)**  
  **Goal:** Students write unconditional action rules, then discover they break.  
  **Instructions to Students:**  
  *"Your team controls a lab bench. You have 6 actions (listed). For each action, write an index card: 'When [action] happens, change [fluent] to [value]'. Assume nothing else changes. Example: 'When Ignite_Burner happens, change Bunsen_Burner_On to true.' You have 10 minutes. Then we simulate!"*  

  **What You Withhold:** Conditions, indirect fluents, and deferred effects.  

  **Predictable Problem:** Teams write incomplete rules (e.g., `Ignite_Burner` sets `Bunsen_Burner_On=true` but miss `Beaker_Full` condition).  

  **Activity:**  
  1. Teams write 6 rule cards.  
  2. You run a quick simulation:  
     - Starting state: `Beaker_Full=false`, `Bunsen_Burner_On=false`.  
     - Action: `Ignite_Burner`.  
     - Teams apply their rules (set `Bunsen_Burner_On=true`).  
     - Physics Binder reveals no change (since `Beaker_Full=false`).  
     - **Result:** Teams see their rules fail.  

  ---

  ### **Phase 2: Conditional Effects (25 min)**  
  **Goal:** Students add conditions to rules, realizing effect dependencies.  
  **Instructions:**  
  *"Revise your rules: Add conditions using 'if'. E.g., 'If Beaker_Full=true, then Ignite_Burner sets Bunsen_Burner_On=true'. Then, we’ll run a turn with partial observations. Update your belief board (sticky notes) using your rules, but you only observe one fluent per turn."*  

  **What You Add:**  
  - Introduce `Lab_Tidy` and its environment rule (no direct action changes it).  
  - Introduce deferred effect for `Toggle_Stirrer` (sets `Solution_Mixed=true` after 1 turn).  

  **Scoring (start here):**  
  - **Accuracy penalty:** -1 per incorrect fluent in belief board.  
  - **Representation cost:** -1 per condition clause in rules (e.g., "if A and B" = 2 clauses).  
  - **Turn score** = - (accuracy penalty) - (representation cost).  

  **Worked Turn Example:**  
  - Starting state: `Beaker_Full=true`, `Stirrer_On=false`, all else false.  
  - Action: `Toggle_Stirrer` (sets `Stirrer_On=true`; deferred `Solution_Mixed=true` next turn).  
  - Team’s rule: "If Beaker_Full=true, then Toggle_Stirrer sets Stirrer_On to opposite." (1 condition clause).  
  - Team updates belief: `Stirrer_On=true` (correct).  
  - They observe one fluent (e.g., `Solution_Mixed`; still false).  
  - **True state:** `Stirrer_On=true`, `Solution_Mixed=false` (deferred).  
  - Accuracy penalty: 0 (all fluents correct). Representation cost: 1. **Score: -1**.  
  - *Next turn:* Deferred effect triggers (`Solution_Mixed=true`). If team misses update, penalty increases.  

  ---

  ### **Phase 3: Belief Maintenance with Scarcity (35 min)**  
  **Goal:** Students manage belief updates with partial observations, encountering deferred effects and indirect fluents.  
  **Instructions:**  
  *"Maintain your belief board over 4 turns. Each turn:  
  1. I announce an action.  
  2. You update beliefs using your rules.  
  3. You request one observation (I give true value).  
  4. You update beliefs again.  
  After turn 2, I add a new action. After turn 3, I add a new fluent. Scoring: Turn score = - (number of wrong beliefs) - (number of condition clauses)."*  

  **What You Add Mid-Game:**  
  - **After turn 2:** Add action `Weigh_Sample` and `Silence_Alert` (with deferred effect).  
  - **After turn 3:** Add fluent `Spill_Hazard` (alters `Lab_Tidy`).  

  **Turn Sequence (fixed for all teams):**  
  1. `Fill_Beaker` → Updates `Beaker_Full=true`; if `Bunsen_Burner_On=true`, sets `Beaker_Heated=false`.  
  2. `Add_Chemical_A` → Sets `Chemical_A_Present=true`; resets `Solution_Mixed=false`.  
  3. `Silence_Alert` (new action) → Sets `Timer_Active=true`; deferred effect in 2 turns.  
  4. `Toggle_Stirrer` → If `Beaker_Full=true`, sets `Stirrer_On=true` and (deferred) `Solution_Mixed=true` next turn. Also, if `Beaker_Full=false`, sets `Spill_Hazard=true` (new fluent).  

  **Complications in Action:**  
  - **Deferred effect:** `Silence_Alert` in turn 3 affects `Alert_Silenced` later, but only if `Fume_Hood_Closed` stays open.  
  - **Indirect fluent:** `Lab_Tidy` changes automatically when `Spill_Hazard` is added (e.g., if `Beaker_Full=false` in turn 4, `Spill_Hazard=true` makes `Lab_Tidy=false`).  

  **Scoring Example (Turn 3):**  
  - True state: `Timer_Active=true` (from `Silence_Alert`), `Fume_Hood_Closed=false`.  
  - Team’s rule for `Silence_Alert`: "Sets Timer_Active=true" (no conditions). Representation cost = 0.  
  - Team updates belief: `Timer_Active=true`.  
  - They observe `Alert_Silenced` (still false).  
  - Accuracy penalty: 0 (if beliefs match). **Score: 0**.  
  - *But*: Deferred effect pending. If team doesn’t account for it later, penalties accumulate.  

  **End-State Asymmetry:**  
  - **Compact teams (few conditions):** Low representation cost, but high penalties when new action/fluent breaks assumptions.  
  - **Verbose teams (many conditions):** High representation cost, but easier to integrate new elements (e.g., adding `Spill_Hazard` as a condition).  

  ---

  ### **Debrief (10 min)**  
  Map game moments to the frame problem:  
  1. **Phase 1 (naive rules):** "You assumed actions only change explicit fluents. But when rules broke, you saw that stating what changes requires stating what *doesn’t* change—yet you can’t list all non-effects (e.g., ‘Ignite_Burner doesn’t change Cap_Vial’). This is the frame problem: inertia isn’t free."  
  2. **Phase 2 (conditions):** "Adding conditions helped accuracy but exploded representation cost. Why? To know *what to recheck*, you must already know *what might have changed*—a regress. A ‘faster machine’ doesn’t solve this; it’s about the cost of specifying exceptions."  
  3. **Phase 3 (belief/scarcity):**  
     - **Deferred effect:** "`Silence_Alert` showed that deciding *when* to re-derive beliefs (e.g., after timer expires) is itself a frame problem."  
     - **Indirect fluent:** "`Lab_Tidy` had no direct causes, so you couldn’t ‘look’ efficiently. You had to infer from other fluents, but which ones?"  
     - **Asymmetry:** "When we added `Weigh_Sample`, compact teams scored well (low rep cost). When we added `Spill_Hazard`, verbose teams adapted cheaply (they added conditions), but compact teams had high penalties. Trade-off: **No encoding is cheap to write, cheap to revise for new actions, AND cheap to revise for new fluents.**"  
  4. **Counting Argument:** "With 15 fluents and 7 actions, specifying all frame axioms (what *doesn’t* change) requires 105 statements. Conditional rules reduce this but explode when new elements arrive."  

  ---

  ### **Predictable Problems & Responses**  
  - **Common-sense smuggling:** Students use real-world knowledge (e.g., "burners heat beakers").  
    - *Response:* "Use only Physics Binder rules. The point is *not* that the world is messy, but that *specifying* dynamics is hard even in closed worlds."  
  - **Over-flagging/under-flagging:** Teams observe randomly or fixate on one fluent.  
    - *Response:* "Penalties will reveal inefficiency. Discuss post-game: How did you choose what to observe?"  
  - **Degenerate strategy:** A team ignores rules, sets all fluents to false after each action.  
    - *Response:* "High penalties will tank their score. Use them as an example: ‘This team saved rep cost but had 15 penalties per turn—why?’"  
  - **"Why can’t the agent just look?"**  
    - *Short answer:* "Looking requires deciding *what* to look at. But to know what might have changed (and warrants looking), you need a model of effects—which brings us back to the frame problem. It’s a regress, not a solution."  
  - **"This is arbitrary!"**  
    - *Response:* "True—but real AI faces this when designers define actions/fluents. The problem isn’t the rules; it’s that *any* finite specification struggles with revision and inertia."  

  ---

  ### **Limits & Closing**  
  **Irreducible Features:**  
  - The frame problem is ultimately about **representation and architecture**. In the last 10 minutes, clarify:  
    - "Today’s activity shows the *syntactic* frame problem: the cost of writing dynamics. But there’s a deeper *epistemological* problem: How does an agent *know* what to represent? Our ‘physics binder’ hides this—we supplied the fluents and rules. In reality, agents must discover these."  
    - "Connectionist systems (e.g., neural nets) bypass explicit rules but still face the computational core: efficiently inferring change without exhaustive search. That’s why this isn’t just about ‘better sensors.’"  

  **Final Prompt:**  
  "Based on this, why might ‘solving’ the frame problem require rethinking cognition itself, not just scaling up computation?"  

  --- 

  This design ensures students *experience* the frame problem through iterative failure, scoring trade-offs, and mid-game revisions. The lab bench world is simple enough for quick play but rich enough to force the core tensions. Let me know if you need refinements!
