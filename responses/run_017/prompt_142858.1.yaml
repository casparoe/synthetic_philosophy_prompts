  We are designing a tabletop activity to illustrate the frame problem in an AI philosophy seminar. The goal is for students to experience the difficulty of specifying what changes and what stays the same when an action is performed, and the challenges of belief revision under partial observation.

  ### Core Concepts to Illustrate:
  1. **Frame Problem**: The need to explicitly state what an action leaves unchanged (inertia) because it's impractical to list all non-effects.
  2. **Belief Revision**: Deciding which beliefs to re-examine when new information arrives, especially when observations are scarce.
  3. **Trade-offs in Representation**: The impossibility of having an encoding that is simultaneously compact, easy to revise when new actions are added, and easy to revise when new fluents are added.

  ### Setting and Constraints:
  - 90-minute session, 18 students (6 teams of 3).
  - Materials: whiteboard, projector, index cards, dice, sticky notes, timer.
  - Closed world: a studio apartment with 15-25 fluents and 5-8 actions.
  - Three phases:
    1. Write down what each action does (naive effect statements).
    2. Discover that effects depend on conditions (conditional effect statements).
    3. Maintain a belief state with partial observation, forcing decisions about what to re-check.
  - Two complications:
    - A deferred effect that can be cancelled (e.g., a timer that can be interrupted).
    - A fluent that is only changed indirectly (e.g., "room is clean" depends on other fluents).
  - Scoring: Tally in the room, with trade-offs. When a new action or fluent is added mid-game, teams see the cost of revision.

  ### World: The Studio Apartment
  **Fluents (20):**
  1. Light on (living room)
  2. Light on (bedroom)
  3. Light on (kitchen)
  4. TV on
  5. Radio on
  6. Window open (living room)
  7. Window open (bedroom)
  8. Door open (front)
  9. Door locked (front)
  10. Coffee maker on
  11. Kettle on
  12. Plant watered
  13. Dishes in sink
  14. Dishes washed
  15. Trash full
  16. Trash taken out
  17. Cat on sofa
  18. Cat fed
  19. Floor clean
  20. Air fresh (indirect: depends on open windows and trash)

  **Actions (6 initially, then add one mid-game):**
