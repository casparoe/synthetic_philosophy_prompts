prompt: |-
  You are a professional philosopher — epistemology and general philosophy of science is your patch, and you've taught explanation and confirmation at graduate level more than once. Take your time with this one: brainstorm loosely first about what could even go on the list, then cut it down, then write the answer properly. Write in British English throughout (yes, I do care about the -ise endings, and it's "conditionalisation").

  Here's where I am. I'm putting together agraduate seminar on explanation, and I keep not being able to say what I actually want from an account of inference to the best explanation. Every paper I look at either defends IBE against one more objection or shows that it was Bayes all along, and I've definately got no fixed standard to hold any of them to. Less academically: I'm sitting on a university panel that has to rule on a case where the evidence is entirely circumstantial — two live hypotheses about how a collection of papers went missing from an archive, no decisive test available, real consequences for the people involved. I want to be able to say out loud what someone has to be entitled to in order to reason "this is the best explanation, so this is what happened" in a setting like that. So the thing I want specced is IBE as a rule a non-ideal inquirer could actually use: under time pressure, working with the finite set of hypotheses they've managed to think of, where the verdict matters and no further evidence is coming.

  Write me the desiderata. Concretely:

  - The cases it has to get right, with the case behind each requirement. Please cover at least these, and add any I've missed:
    - the placeholder case: a hypothesis that explains by naming a mechanism it doesn't specify — the carburettor explanation for the car that won't start. Is explanatory credit owed before the mechanism gets filled in, and what does your requirement say about that?
    - the copycat case: a rival that borrows everything explanatory from the leading hypothesis and adds one extra claim, which then gets independently confirmed. Does the extra confirmed prediction count in its favour, and if so, is IBE quietly absorbing something that isn't explanatory virtue at all?
    - the duet case: one hypothesis unifies two ranges of phenomena under a single mechanism, a rival handles them with two mechanisms of exactly matched simplicity. Whatever you say here, tell me whether unification is doing independent work in your list or whether it's reducible to something else.
    - the known-false-loveliest-hypothesis case: what IBE is supposed to output when the most lovely candidate in the lot is one we have independent reason to think is false.
  - The distinctions it must respect and mustn't collapse: best available explanation vs. good enough explanation; explaining the data vs. being made probable by it; IBE as a rule of inference vs. a heuristic vs. a redescription of Bayesian updating; the contrastive shape of ordinary why-questions; full belief vs. a shift in credence.
  - What it has to be consistent with: it can't be a rule that predictably bankrupts anyone who follows it; it can't fall apart when turned on itself (the move where someone argues that the best explanation of IBE's own track record is that IBE is reliable — I want to know whether a theory has to be able to say something about that, or whether it's fine to refuse); and it should sit with whatever is actually true about how well explanationist updating tracks the truth compared with straight conditionalisation.

  Then the two bits I care about most. First: mark each requirement as non-negotiable or as a preference of one camp, and tell me which of the things people standardly demand of IBE — truth-conduciveness, being genuinely ampliative rather than a re-run of Bayes, delivering a verdict in every case, respecting the contrastive structure of why-questions, refusing to credit conspiracy- or demon-shaped hypotheses — are genuine desiderata and which are just one camp's prejudices dressed up. Second: flag any pair or triple of requirements on your own list that you suspect can't be jointly satisfied, and name the single requirement that knocks out the most candidates. If the list turns out to be jointly unsatisfiable, that's the interesting result — don't quietly drop a requirement to make the list look tidy.

  No bibliography, no reading list, no footnotes: I've got the literature, I want the spec. At the very end, one short paragraph only, on how the broad camps do against your list — the Bayesian reductivist, the contrastive/loveliness account in Lipton's style, and the van Fraassen-style sceptic about the whole enterprise. Keep the weight on the criteria and their cases, not on the scorecard. And don't soften everything into it-depends-what-you-mean-by-explanation: commit to the requirements, give me the cases, then say where you're unsure.
reasoning: |-
  Hmm, the user is a professional philosopher teaching a graduate seminar on explanation, specifically inference to the best explanation (IBE). They're frustrated with existing literature that either defends IBE against objections or reduces it to Bayesianism. They need desiderata for IBE as a practical rule for non-ideal inquirers—people under time pressure, with limited hypotheses, facing real-world consequences without further evidence. They also serve on a university panel dealing with a circumstantial evidence case and want to articulate what justifies reasoning to the best explanation in such contexts.

  The user has provided specific cases to cover: the placeholder case (vague mechanisms), the copycat case (rival hypotheses borrowing elements), the duet case (unification vs. matched simplicity), and the known-false-loveliest-hypothesis case. They also want distinctions drawn, like best available vs. good enough explanation, and consistency requirements, such as avoiding bankruptcy or circular justifications. Most importantly, they want each requirement marked as non-negotiable or preference-based, and any conflicts flagged. Finally, a brief comparison of Bayesian, Lipton-style, and van Fraassen-style approaches against these criteria is needed.

  Breaking this down: First, I need to brainstorm desiderata based on the cases and the user's needs. The placeholder case suggests a requirement for explanatory credit without full mechanism details—perhaps "partial mechanism credit" as non-negotiable, meaning a hypothesis can earn credit even if incomplete, as long as it's directionally correct. For the copycat case, where a rival adds an independently confirmed claim, I need to address whether extra predictions add value independently of explanation. This might lead to a requirement for "non-parasitic gain," making it non-negotiable that borrowed elements don't count, but novel confirmations do, even if not purely explanatory. The duet case involves unification versus matched simplicity. Unification should be irreducible to simplicity, so a requirement for "irreducible unification" as non-negotiable—unification provides distinct value by connecting phenomena. The known-false-loveliest case requires handling when the best explanation is independently falsified, so "loveliness constrained" as non-negotiable: IBE must respect prior constraints, so it can't override strong counter-evidence.

  For distinctions: "best vs. good enough" is key—IBE shouldn't infer if no hypothesis is sufficiently good, so "threshold requirement" as non-negotiable. "Explaining vs. being probable" must be maintained—IBE isn't just probability, so "explanatory virtue distinct" as non-negotiable. "IBE as rule vs. heuristic vs. Bayesian" needs clarification—IBE should be a standalone ampliative rule, so "genuinely ampliative" as negotiable but important for their context. "Contrastive shape" is essential for real-world questions, so "contrastive sensitivity" non-negotiable. "Full belief vs. credence shift" depends on context; in their panel case, it might lead to belief, so "output match context" as negotiable but practical.

  Consistency requirements: "Non-self-defeating" is non-negotiable—IBE can't predictably fail. "Self-application proof" is negotiable—it's okay if IBE can't justify itself without circularity. "Truth-tracking compatibility" is non-negotiable—IBE must align with how well explanation tracks truth versus Bayesian methods.

  Now, marking desiderata: Non-negotiables include partial mechanism credit, non-parasitic gain, irreducible unification, loveliness constrained, threshold requirement, explanatory virtue distinct, contrastive sensitivity, non-self-defeating, and truth-tracking compatibility. Others are negotiable, like genuinely ampliative, which some Bayesians might reject. Standard demands: truth-conduciveness is a genuine desideratum but not always required in every use; being ampliative is a preference for some camps; delivering a verdict in every case is bad—it must allow withholding belief; contrastive structure is essential; refusing conspiracy hypotheses isn't a fixed rule—it depends on context.

  Flagging conflicts: Irreducible unification might clash with simplicity-focused approaches. Loveliness constrained and threshold requirement could conflict if no hypothesis meets the threshold but the loveliest is false. The biggest knockout requirement is "threshold requirement"—it forces IBE to avoid inferring when explanations are weak, which many accounts ignore.

  Finally, comparing camps: Bayesian reductivism fails on explanatory virtue distinct, genuinely ampliative, and irreducible unification. Lipton-style contrastive/loveliness accounts do well on most but may struggle with non-parasitic gain and self-application. Van Fraassen's scepticism rejects many requirements, like truth-conduciveness, but highlights the threshold and non-self-defeating aspects.

  I'll structure this response with desiderata listed by category, with cases, distinctions, and consistencies. For each, I'll specify negotiability and conflicts. I'll conclude with the camp comparison, focusing on how they meet the criteria.
answer: |-
  Here are the desiderata for a usable, non-ideal IBE rule, grounded in your cases and constraints. Requirements are non-negotiable (**N**) unless marked as a negotiable preference (**P**). Conflicts and camp biases are flagged explicitly.

  ---

  ### **I. Core Desiderata from Cases**  
  1. **Partial Mechanism Credit (N)**  
     - *Case:* Placeholder (carburettor explanation).  
     - *Requirement:* IBE must credit hypotheses that specify *relevant causal roles* (e.g., "carburettor malfunction") without full mechanistic detail. Credit is owed if the placeholder (a) identifies a plausible locus of failure and (b) permits testable implications (e.g., "fixing/replacing carburettor resolves issue").  
     - *Non-negotiable:* Without this, IBE fails in early-stage inquiry.  

  2. **Non-Parasitic Gain (N)**  
     - *Case:* Copycat (rival borrows core explanation, adds independently confirmed claim).  
     - *Requirement:* Explanatory credit for a hypothesis *cannot derive solely from elements parasitised from a rival*. Novel, confirmed predictions *do* count in favour, but this gain must be (a) non-explanatorily inert (e.g., it deepens understanding or opens new lines of inquiry) and (b) not merely ad hoc.  
     - *Non-negotiable:* Prevents "tacking on" trivial additions to steal credit. The extra prediction’s value isn’t "non-explanatory" if it enriches the hypothesis’s scope or testability.  

  3. **Irreducible Unification (N)**  
     - *Case:* Duet (single mechanism vs. two matched-simple mechanisms).  
     - *Requirement:* Unification provides distinct credit beyond simplicity/parsimony. A unified hypothesis (e.g., one mechanism for two phenomena) should prevail over disunified rivals *even if* the latter match it in simplicity, *provided* the unity yields new explanatory dividends (e.g., predicts undiscovered links between phenomena).  
     - *Non-negotiable:* Unification isn’t reducible to simplicity; it’s a criterion for inferring deeper structure.  

  4. **Loveliness Constrained (N)**  
     - *Case:* Known-false-loveliest hypothesis.  
     - *Requirement:* IBE *cannot* output a hypothesis contradicted by strong independent evidence, no matter how "lovely" its explanation. IBE operates within a space of *epistemically possible* hypotheses.  
     - *Non-negotiable:* Otherwise, IBE licenses fantasy.  

  ---

  ### **II. Essential Distinctions**  
  5. **Threshold Requirement (N)**  
     - *Requirement:* IBE must distinguish "best available explanation" from "good enough to warrant inference". If no hypothesis meets a minimal threshold of explanatory adequacy (e.g., testability, coherence with background knowledge), IBE outputs *withheld belief* – even if one is "least bad".  
     - *Non-negotiable:* Critical for real-world decisions (e.g., your archive panel). Prevents inference from a "best of a bad lot".  

  6. **Explanatory Virtue ≠ Probability (N)**  
     - *Requirement:* IBE’s "best" must be defined by *explanatory virtues* (e.g., scope, mechanism, unification) – not merely high probability given data. Distinguish: "H explains D well" vs. "D makes H probable".  
     - *Non-negotiable:* Otherwise, IBE collapses into Bayesianism.  

  7. **Contrastive Sensitivity (N)**  
     - *Requirement:* IBE must handle *why P rather than Q?* questions. Explanatory power is assessed relative to salient alternatives (e.g., in the archive case: "Why did *these papers* disappear rather than others?").  
     - *Non-negotiable:* Matches actual use; avoids spurious over-generalisation.  

  8. **Output Matches Context (P)**  
     - *Requirement:* IBE should shift credences proportionally to explanatory gain under uncertainty but permit full belief when (a) threshold is exceeded and (b) stakes demand decisive action (e.g., your panel ruling).  
     - *Preference:* Some camps insist IBE only yields credence; but for your use case, binary output is pragmatic.  

  ---

  ### **III. Consistency Demands**  
  9. **Non-Self-Defeating (N)**  
     - *Requirement:* IBE cannot predictably lead to systematic error or epistemic bankruptcy (e.g., routinely accepting contrived hypotheses).  
     - *Non-negotiable:* A rule unfit for truth-tracking is useless.  

  10. **Self-Application Proof (P)**  
      - *Requirement:* IBE need *not* justify its own reliability via self-application (e.g., "IBE is reliable because that’s the best explanation of its success"). Circularity here is acceptable if IBE is a fundamental norm.  
      - *Preference:* Bayesian critics demand non-circular calibration; pragmatists reject this.  

  11. **Truth-Tracking Compatibility (N)**  
      - *Requirement:* IBE must be compatible with evidence that explanationist updating *differentially* tracks truth vs. Bayesian conditionalisation in some domains (e.g., science favours unifying explanations even when probabilistically riskier).  
      - *Non-negotiable:* Denies reductivism; IBE must have a distinct epistemic profile.  

  ---

  ### **IV. Diagnosis of Standard Demands**  
  - **Truth-conduciveness**: Genuine desideratum (**N**, via *Non-Self-Defeating*), but not required per *use*; IBE can be practical rather than alethic.  
  - **Genuinely ampliative (non-Bayesian)**: **P** – A preference for anti-reductivists, but your use case *demands* it (**N**) if Bayes is computationally intractable for non-ideal agents.  
  - **Delivers a verdict in every case**: **Rejected** – *Threshold Requirement* makes this a vice, not a virtue.  
  - **Respects contrastive structure**: **N** (covered in *Contrastive Sensitivity*).  
  - **Refuses conspiracies/demons**: **P** – Handled by *Threshold* (often fail testability/coherence) and *Loveliness Constrained* (background knowledge rules them out). Not a special constraint.  

  ---

  ### **V. Conflicts & Knockout Requirements**  
  - **Irreducible Unification** clashes with **Non-Parasitic Gain**: If a disunified hypothesis adds a novel confirmed prediction (e.g., in the *Duet* case), does unification still dominate? **Resolution:** Unification wins *unless* the novel prediction significantly outstrips its explanatory gains.  
  - **Loveliness Constrained** and **Threshold Requirement** conflict when the "least false" candidate is still implausible (e.g., your archive case). **Resolution:** *Threshold* prevails – no inference is better than bad inference.  
  - **Knockout Requirement**: **Threshold Requirement** eliminates most popular accounts (e.g., Lipton underspecifies it; van Fraassen rejects it; Bayesians lack it). Without this, IBE is reckless.  

  ---

  ### **How the Camps Fare**  
  - **Bayesian reductivism**: Fails **Explanatory Virtue ≠ Probability**, **Irreducible Unification**, and **Genuinely Ampliative (N)**. Offers computational rigor but misses IBE’s distinctiveness.  
  - **Lipton-style (contrastive/loveliness)**: Hits **Contrastive Sensitivity**, **Partial Mechanism Credit**, and **Loveliness Constrained**. Struggles with **Non-Parasitic Gain** (novel predictions blur into "loveliness") and underspecifies **Threshold Requirement**.  
  - **van Fraassen-style sceptic**: Endorses **Threshold** (via "best of a bad lot") and **Self-Application Proof**, but rejects **Truth-Tracking Compatibility** and **Irreducible Unification** as illusory. Makes IBE pragmatic, not epistemic.  

  **Unresolved tension**: Whether **Non-Parasitic Gain** covertly smuggles in non-explanatory virtues. I suspect it does – but this reflects real agentive needs (e.g., guiding further inquiry). Your panel case needs this, even if purists object.
