prompt: |-
  I've got a second-year metaphysics seminar coming up in a fortnight — 16 students, one 75-minute slot, a whiteboard and a pile of index cards, no tech beyond that — and the topic is the special composition question (van Inwagen's version I think? the "when do some things add up to one thing" question, with the answer he gives in terms of life). I've tired to teach it before just by handing out a list of cases — two bonded particles, a molecule, a crystal, a rock, a table, a cat, a heap of scrap, my nose plus the Eiffel Tower — and asking "does composition happen here?". It died inside fifteen minutes: somebody says "well, it depends what you mean by object", somebody else says "the parts just are the object, there's nothing more to it", and nobody feels any pressure at all. So I want a structured thing where the pressure comes out of what they have to do, not out of me talking.

  What I'm picturing — redesign it freely, I'm not attached — is some kind of certification panel or census office. Small groups, and each group has to hand in a single rule, one side of an index card, that a clerk could apply mechanically to a data sheet describing a candidate collection of parts (fields like relative positions, causal bonding, mass, whether anything's alive or conscious, whether the lot does anything as a unit, whatever you think belongs there) and get out a yes/no on whether it composes something. Constraints: no proper names, no indexicals, finite length, and one rule for all cases rather than a list of verdicts. Then groups swap rules and each gets a fixed budget of adversarial cases to throw at another group's rule, with small stakes — I can bring chocolate, or tokens they wager on whether their own rule survives. The bit I really want you to engineer is the squeeze: a round where, if a group has said yes to case A and no to case B, they have to locate the switch-over point along a series of intermediate cases you supply (near-life, near-contact, almost-a-mechanism, that sort of thing), and a round where they have to name the single respect in which A and B differ and then get handed a case that varies only that respect and only barely. And I want the case pool built so the comfortable middle — yes to organisms and tables, no to scattered junk — is the thing that starts to sag, not the extreme answers.

  What they should walk out having felt is that the commonsense package is the unstable one and that each exit costs something they can name: yes to everything and you're stuck with the object made of my nose and the Eiffel Tower; no to everything and, well, no tables; or "each case is just a brute fact" — and I'd like that third one to come out feeling like a real option rather than a shrug, because I suspect a game will naturally make it look like laziness when it's an actual defended position. Keep it about composition at a time, not persistence over time — last year someone dragged in the ship of Theseus and we lost ten minutes — unless your design uses that confusion on purpose, in which case say so and I'll allow it.

  Deliverable: rules and roles, materials, a rough minute-by-minute timeline for the 75 minutes, the case pool (12-16 cases with their data-sheet entries, or a schema I can generate more from), the scoring/wagering scheme, and a debrief that maps particular moments in the session onto particular moves in the dialectic — this moment is supposed to make that move feel costly — plus what will predictably go wrong and how to handle it. My two bets: someone writes "it composes something iff it does something interesting" and I won't know what to do with that, and the group that writes the most gerrymandered disjunctive rule wins the game while learning nothing. Also be frank about which features of the question the activity just can't stage and I'll have to say out loud myself — whether composition could be vague, whether "how many objects are there" is well-posed, whether the whole thing is verbal in the quantifier-variance sense. Write it in British English please. And as you go, separate what's actually settled in the literature from what's contested among people who work on this: don't have me tell 16 second-years that everyone agrees composition must have a general answer if it's really one side of an argument, and flag any contested assumption your setup quietly leans on — that sums are ontologically innocent, that composition isn't vague, whatever — instead of burying it in the premise.
reasoning: |-
  We are designing a seminar activity for the special composition question (SCQ) as formulated by van Inwagen: "When do some things compose one thing?" The goal is to create pressure on the commonsense answers (e.g., composition occurs for organisms and artifacts but not for arbitrary scattered objects) and to show that each alternative (universalism, nihilism, or brute facts) has costs.

  Key elements from the request:
  - Activity: Certification panel / census office simulation.
  - Groups of 4 (16 students -> 4 groups of 4).
  - Each group writes a rule (on one side of an index card) that a clerk can apply mechanically to a data sheet to decide composition (yes/no).
  - Constraints: no proper names, no indexicals, finite length, one rule for all cases.
  - Then groups swap rules and test each other's rules with adversarial cases (with a fixed budget of cases per group).
  - Two rounds of pressure: 
     a) A series of intermediate cases between A (composition) and B (no composition) to force a switch point.
     b) A case that varies only one respect (the one they named as the difference) and only barely, to challenge the rule.
  - Case pool: 12-16 cases designed to make the commonsense middle unstable. Include near-life, near-contact, almost-a-mechanism, etc.
  - Scoring: Tokens or chocolate for wagering on whether their rule survives the challenges.
  - Avoid persistence over time (e.g., Ship of Theseus) unless intentionally included.
  - Debrief: map moments to dialectical moves, predict problems, and note what the activity cannot stage.

  Deliverable:
  1. Rules and roles
  2. Materials (index cards, data sheets, case pool)
  3. Timeline (75 minutes)
  4. Case pool (12-16 cases with data sheet entries or a schema)
  5. Scoring/wagering scheme
  6. Debrief (including what might go wrong and how to handle it, and what the activity cannot stage)

  Let's break it down:

  **Rules and Roles:**
  - Groups: 4 groups of 4 students.
  - Each group is a "Composition Certification Panel".
  - Role: Devise a general rule for when composition occurs.

  **Materials:**
  - Index cards (for writing rules)
  - Data sheets for each case (we'll create a template and then specific cases)
  - Whiteboard for the instructor to record and for groups to use during the adversarial phase.

  **Case Pool:**
  We need 12-16 cases. The cases should cover:
  - Clear cases of composition (a living cat, a table)
  - Clear cases of non-composition (a random collection of unrelated objects, e.g., your nose and the Eiffel Tower)
  - Borderline cases that challenge the commonsense rule (e.g., a virus, a prion, a crystal, a heap of sand, a watch that is broken, a watch that is disassembled but could be reassembled, a cloud, a flock of birds, a colony of ants, a human body without consciousness, a human body with consciousness, a pile of leaves, a statue made of clay, the same clay as a lump, etc.)

  But note: we want to avoid persistence over time. So all cases are at a single time.

  We'll design the data sheet with fields that might be relevant (so groups can refer to them in their rule). Fields could include:
  - Number of parts
  - Relative positions (e.g., in contact, bonded, scattered)
  - Type of bonding (covalent, ionic, hydrogen, mechanical, gravitational, none)
  - Mass (total and/or of parts)
  - Is the collection alive? (yes/no)
  - Is there consciousness? (yes/no)
  - Does the collection function as a unit? (e.g., for a purpose, or mechanically)
  - Does the collection have a boundary? (yes/no, or describe)
  - Is the collection spatially contiguous? (yes/no)
  - Other: e.g., whether it is a natural kind, whether it is an artifact, etc.

  But note: the rule must be applied mechanically, so the data sheet must provide the information in a way that a clerk can check.

  We'll create a set of cases that include:

  1. A single hydrogen atom (with one proton and one electron) - composition? (yes, it's an atom)
  2. A water molecule (H2O) - composition? (yes, a molecule)
  3. A salt crystal (NaCl lattice) - composition? (yes, a crystal)
  4. A rock (a piece of granite) - composition? (yes, a rock)
  5. A table (wooden, with legs and top) - composition? (yes, an artifact)
  6. A living cat - composition? (yes, an organism)
  7. A heap of scrap metal (in a junkyard, not connected) - composition? (no, a heap)
  8. Your nose and the Eiffel Tower (arbitrary collection) - composition? (no)
  9. A cloud (water droplets in air) - composition? (maybe? it's a cloud)
  10. A flock of geese flying in V formation - composition? (no, a group)
  11. A colony of ants (with queen, workers, etc.) - composition? (arguably, the colony is an organism? but typically no)
  12. A human body without consciousness (e.g., in a coma) - composition? (yes, an organism)
  13. A human body with consciousness - composition? (yes, same as above? but we want to avoid consciousness as the key)
  14. A watch that is fully assembled and working - composition? (yes, an artifact)
  15. The same watch disassembled into its parts (in a box) - composition? (no)
  16. A pile of leaves (in a pile) - composition? (no, a pile)

  But we need borderline cases for the intermediate series and the one-respect variation. Let's design two series:

  Series 1: From non-living to living (to challenge the life-based rule)
     a) A rock (non-living, but composed) -> but rocks are non-living and we say composition occurs. So let's think of a series that goes from non-living to living with intermediate stages of near-life.

  Instead, let's do a series that goes from a heap of sand to a living organism? That's too big a jump. We need small steps.

  Idea: A series of cases that are increasingly integrated, but without life until the end.

  Example series for the squeeze:
     Case A: A pile of sand (no composition)
     Case B: A sand dune (no composition? or yes? typically no)
     Case C: A sand castle (artifact? but temporary and not functional beyond appearance)
     Case D: A brick (artifact, composed)
     Case E: A brick wall (artifact, composed)
     Case F: A house (artifact, composed)

  But that doesn't challenge the life-based rule. We need a series that challenges the life rule.

  Alternative series:
     Case A: A dead cat (non-living, but we might say composition occurs because it's the same body? But van Inwagen says only when there is life)
     Case B: A cat in a coma (alive? but not conscious) -> composition? (van Inwagen: yes, because alive)
     Case C: A cat that is awake -> composition? (yes)

  But that doesn't create pressure. Let's use:

  Series for life: 
     Case A: A virus (is it alive? controversial) -> data: not cellular, cannot replicate without host, etc.
     Case B: A prion (a misfolded protein that causes disease, not alive) -> data: protein, no metabolism
     Case C: A bacterium (alive) -> data: cellular, metabolism
     Case D: A plant (alive) -> data: cellular, metabolism
     Case E: A cat (alive) -> data: cellular, metabolism, consciousness? (we don't need consciousness, but note that van Inwagen doesn't require consciousness)

  But the controversy about viruses is too advanced? We can note in the data sheet that it is not considered alive by some definitions.

  Another series: contact and bonding.
     Case A: Two electrons very far apart (no contact, no bonding) -> no composition.
     Case B: Two electrons in the same atom (bonded) -> composition? (yes, part of the atom)
     Case C: Two atoms in a molecule (bonded) -> composition? (yes, part of the molecule)
     But we need to break the commonsense table. How about:

     Case A: A table with all its parts firmly joined (composition: yes)
     Case B: The table with one leg slightly loose (but still attached) -> composition? (yes)
     Case C: The table with one leg removed but lying next to it -> composition? (no)
     But that's a jump. We need a series of small changes.

     Instead, let's do a series of spatial proximity without bonding:
     Case A: Two bonded particles (in a molecule) -> composition: yes
     Case B: Two particles that are very close but not bonded (e.g., in a plasma) -> composition: no
     Case C: A pile of sand grains (touching, but not bonded) -> composition: no
     Case D: The same sand grains glued together -> composition: yes

     But that's only two steps. We need more.

     How about a series of increasing functional unity without physical bonding?
     Case A: A watch (fully assembled and working) -> composition: yes
     Case B: The watch with one gear removed but still in the case -> composition? (no, because not functional? or still a watch that's broken? We want to challenge.)

     This is tricky.

  Let's design the case pool with the following 16 cases (with data sheet entries):

  We'll have a standard data sheet template with these fields:
  - Case ID and name
  - Number of parts (if applicable, or leave blank if not specified)
  - Relative positions (e.g., in contact, bonded, scattered, etc.)
  - Type of bonding (if any: e.g., covalent, ionic, metallic, mechanical, gravitational, none)
  - Total mass (in grams, arbitrary but consistent)
  - Is the collection alive? (yes/no)
  - Is there consciousness? (yes/no) [if applicable]
  - Does the collection function as a unit? (yes/no, and if yes, briefly: e.g., for support, for timekeeping, for metabolism, etc.)
  - Is the collection spatially contiguous? (yes/no) [meaning: are all parts within a connected region of space?]
  - Other: (e.g., artifact, natural kind, etc.)

  Now the cases:

  1. Two bonded hydrogen atoms (forming H2 molecule)
     - Parts: 2 atoms
     - Relative positions: bonded
     - Bonding: covalent
     - Mass: ~2 atomic mass units (or 3.34e-24 g)
     - Alive: no
     - Consciousness: no
     - Functions as unit? (for chemical properties) - yes
     - Spatially contiguous? yes

  2. A water molecule (H2O)
     - Similar to above.

  But we can skip duplicates. Let's list 16 distinct:

  1. Two bonded hydrogen atoms (H2) - composition: yes (molecule)
  2. Two hydrogen atoms in different galaxies (no bonding, far apart) - composition: no
  3. A single carbon atom - composition: yes? (but note: the SCQ is about when *some* things (plural) compose one thing. A single atom is one thing, but it is not composed of other atoms. So we might avoid single atoms. Instead, use a hydrogen atom (which has parts: proton and electron) but then we get into subatomic parts. Let's avoid that and stick to atoms as the smallest parts? The problem is that the SCQ is about when composition occurs, and it applies to any things (which might be atoms or subatomic). But to keep it simple, we'll use atoms as the basic parts in the examples? Or we can have cases with subatomic parts? That might complicate. The literature typically uses everyday objects. So let's stick to cases where the parts are visible objects (like table legs, top, etc.) or atoms/molecules for the small scale.

  Revised: We'll have a mix, but we'll note that the parts are given in the case. So for a hydrogen atom, the parts are the proton and electron. But that might lead to a debate about whether those are objects. To avoid, let's have the cases at a uniform level: the parts are atoms or larger.

  So:

  Case 1: A hydrogen molecule (H2) - parts: two hydrogen atoms. Composition? Yes.

  Case 2: A collection of two hydrogen atoms that are not bonded and are very far apart (e.g., one on Earth, one in Andromeda). Composition? No.

  Case 3: A water molecule (H2O) - parts: two H atoms and one O atom. Composition? Yes.

  Case 4: A salt crystal (composed of many Na and Cl atoms in a lattice). Composition? Yes.

  Case 5: A grain of sand. Composition? Yes (it's a single grain).

  Case 6: A pile of 1000 grains of sand (each grain touching others, but not bonded). Composition? No.

  Case 7: The same 1000 grains of sand glued together (so bonded). Composition? Yes (a sandpaper? or just a lump).

  Case 8: A rock (a single piece). Composition? Yes.

  Case 9: A wooden table (with legs attached to the top). Composition? Yes.

  Case 10: The same table, but disassembled (legs and top lying next to each other). Composition? No.

  Case 11: A living cat. Composition? Yes.

  Case 12: A dead cat (same parts, but not alive). Composition? According to van Inwagen, no. But commonsense might say yes. Controversial.

  Case 13: A virus (e.g., influenza virus). Parts: proteins and RNA. Bonded? Assembled. Alive? (data: no, by some definitions; but note, it can replicate with a host). We'll set alive: no.

  Case 14: A bacterium (alive: yes).

  Case 15: A flock of geese flying in V formation. Parts: geese. Relative positions: in formation. Bonding: none. Alive: each goose is, but the flock is not. Functions as unit? (for migration, yes). Contiguous? No (gaps). Composition? No.

  Case 16: Your nose and the Eiffel Tower. Parts: two. Bonding: none. Alive: no. Functions as unit? No. Contiguous? No. Composition? No.

  But we need more borderline cases.

  Let's add:

  17. A watch (working). Composition: yes.

  18. A watch that is broken (so it doesn't function, but parts are together). Composition? (commonsense: yes, it's a broken watch).

  19. A cloud (water droplets in air). Contiguous? Yes (a cloud). Bonding: weak (cohesion). Functions? Not really. Alive: no. Composition? (it's a cloud, so yes? but is it an object?)

  20. A pile of leaves. Composition: no.

  But we have 20 now. We'll trim to 16.

  We also need intermediate cases for the squeeze. We'll design two series:

  Series 1: Life-based
     A) Dead cat -> alive: no
     B) Cat in a deep coma (alive by medical standards, but no consciousness) -> alive: yes
     C) Cat that is asleep -> alive: yes, consciousness: no? (but we don't record consciousness for cats? We can, but let's avoid)
     Instead, we can do a series of increasingly alive things:

     Case A: A prion (protein, not alive)
     Case B: A virus (not alive by some standards)
     Case C: A viroid (even simpler than a virus, not alive)
     Case D: A bacterium (alive)
     Case E: A yeast cell (alive)

     But that might be too biological. Alternatively, use the cat:

     Case A: A cat that has just died (cells still alive? but organism dead) -> alive: no
     Case B: A cat in a persistent vegetative state (alive: yes, but no consciousness) -> alive: yes
     Case C: A sleeping cat -> alive: yes, consciousness: no? (but we don't require consciousness)

     This doesn't vary smoothly.

     Instead, we can use a series about functional unity:

     Series 2: From a disassembled watch to an assembled one.

     Case A: All watch parts in a box, jumbled. Composition? No.
     Case B: Parts laid out in the shape of a watch, but not connected. Composition? No.
     Case C: Some parts connected (e.g., the mainspring and barrel connected), others not. Composition? No.
     Case D: More parts connected, but not all. Composition? No.
     Case E: All parts connected, but not functioning (e.g., a gear missing). Composition? (Yes, but broken)
     Case F: Fully assembled and working. Composition? Yes.

     This series has 6 cases. We can use it for the squeeze.

     We'll also need a one-respect variation. For example, if a group says the difference between a pile of sand and a sand castle is that the sand castle has a shape for a purpose, then we give them a pile of sand that someone has shaped into a castle for no purpose (just by chance) and ask: composition?

  **Scoring/Wagering Scheme:**
  - Each group starts with 10 tokens (or 5, to keep it tight).
  - When they write a rule, they wager 1 token that their rule will survive without being broken (by the adversarial cases or the squeeze).
  - During the adversarial phase: each group gets 3 cases to challenge another group's rule (with the cases drawn from the case pool, but the challenging group chooses which case to use from the pool). The group whose rule is being challenged must apply their rule and give a verdict. If the verdict is controversial (e.g., it says yes to a case that the challenger thinks is clearly no, or vice versa) then the challenger can argue. But we want it to be mechanical. So the rule must be clear enough that the verdict is determined. If the rule gives an answer that the challenger can show is inconsistent with the rule's own criteria (by the data sheet), then the rule is broken and the challenging group gets 2 tokens from the group whose rule was broken. If the rule survives, the group under challenge gets 1 token.

  But that might be messy. Alternative: The instructor has the case pool and the expected verdict by the rule. But the rules are created by the groups, so we don't have an expected verdict. Instead, the challenge is to find a case in the pool that the rule either:
