  For the adversarial round, we'll let the challenger choose a case and the challenged group must give a verdict. Then the challenger can argue that the verdict is counterintuitive. Then the instructor can ask the class to vote on whether the verdict is acceptable. If the majority finds it unacceptable, the rule is broken. This introduces subjectivity, but it's a seminar.

  Alternatively, we can have a pre-agreed set of "clear" cases that are not borderline, and if the rule gives the wrong verdict on a clear case, it is broken. But the activity is about the borderline.

  Let's keep it simple: the adversarial round is for testing whether the rule is clear and consistent. The real pressure comes in the squeeze rounds.

  So for the adversarial round, we'll let each group choose one case from the pool (they can choose any) to challenge another group's rule. The challenged group must apply their rule to the case and state yes/no. Then the challenging group can ask: "Why is that?" and the group must explain how the rule applies. If the rule is ambiguous or doesn't cover the case, then the rule is broken. If the rule gives a verdict that is clearly against the data (e.g., the rule says composition only when alive, but then says yes for a rock) then it is broken. Otherwise, it survives.

  The instructor can act as a referee.

  **Wagering:**
  - When a group submits their rule, they wager 1 token that it will survive the entire adversarial and squeeze process.
  - During the adversarial phase: if a rule is broken by a challenge, the group loses 2 tokens (and the challenger gains 1 token? or not? we don't want too much competition). Alternatively, the group whose rule is broken loses their wager (1 token) and the challenger gets a token.

  But let's not complicate. We'll just have: 
  - Each group starts with 5 tokens.
  - At the end, tokens can be exchanged for chocolate (e.g., 1 token = one small chocolate).

  Stakes are low.

  **Timeline (75 minutes):**

  0-5 min: Introduction. Explain the special composition question. State the activity: they are certification panels for the census bureau, tasked with creating a rule for when some things compose an object. Show the data sheet template and give an example case. Explain the constraints for the rule.

  5-20 min: Group rule creation (15 min). Groups work to create a rule and write it on an index card. They must also write down two things they think are clear cases of composition and non-composition (to help in the adversarial phase).

  20-30 min: Exchange rules. Each group gets another group's rule. (Assign: group 1<->2, 3<->4)

  30-45 min: Adversarial phase. Each group has 5 minutes to choose a case from the case pool (which is on the whiteboard or handed out) to challenge the rule they have. They write down the case ID and the verdict they think the rule gives (by applying it) and whether they think it is problematic. Then they present: "For case X, your rule says Y. We think this is wrong because..." or "We think your rule is ambiguous because...". The challenged group responds. The instructor moderates. Goal: 3 minutes per challenge (so 12 minutes total for 4 groups? but we have only two exchanges). Actually, each group challenges one other group. So two challenges at a time? We can do:

  - Group 1 challenges Group 2's rule (3 min)
  - Group 3 challenges Group 4's rule (3 min)
  - Then Group 2 challenges Group 1's rule (3 min)
  - Group 4 challenges Group 3's rule (3 min)

  Total 12 minutes. But we have 15 minutes allocated (30-45). So we can extend if needed.

  45-60 min: Squeeze round. The instructor selects one rule (or more) that has survived and applies the two pressure tests.

     a) Intermediate series: The group must say at which step composition starts. They are given a series of 5 cases (from A to E) that go from no composition to composition. They must say: composition starts at case C, for example. Then the instructor asks: why not at B? And so on.

     b) One-respect variation: The group is given two cases: one they said yes to, one they said no to. They must name the single respect that makes the difference (e.g., "being alive"). Then the instructor gives them a case that is barely alive (or barely not) and asks for a verdict. If their rule forces a verdict they don't like, they feel the pressure.

  But we only have 15 minutes. We can do this for one or two groups.

  Alternatively, we pre-select two groups that have rules that are vulnerable. Or we do it for all groups? Not enough time.

  The instructor can run the squeeze on a few rules that are representative.

  60-75 min: Debrief. The instructor leads a discussion on the costs of each approach: universalism, nihilism, and brute facts. Relate to the rules that were proposed and the challenges they faced.

  **Case Pool:**

  We'll create 16 cases with data sheets. We'll also create two series for the squeeze:

  Series 1: Watch assembly (functional unity) - 5 cases
     Case W1: All watch parts in a box, jumbled. (bonding: none, function: no, contiguous: no? they are in a box, so contiguous? but not connected. Set contiguous: yes (inside the box), but no bonding, not functioning.)
     Case W2: Parts laid out in the shape of a watch on a table, but not connected. (bonding: none, function: no, contiguous: yes)
     Case W3: Some parts are connected (e.g., the mainspring and barrel are connected, and the face is attached to the case, but the hands are not attached and the gears are not in place). (bonding: partial, function: no, contiguous: yes)
     Case W4: All parts are connected except one small screw is missing. The watch does not function. (bonding: almost complete, function: no, contiguous: yes)
     Case W5: Fully assembled and working. (bonding: complete, function: yes, contiguous: yes)

  Series 2: Life (virus to bacterium) - 5 cases
     Case L1: A prion (a protein that can cause disease). Data: not alive, no metabolism, no replication on its own.
     Case L2: A virus (e.g., influenza). Data: not alive, but can replicate in a host, has genetic material.
     Case L3: A viroid (smaller than a virus, only RNA). Data: not alive.
     Case L4: A bacterium. Data: alive, metabolism, replication.
     Case L5: A cat. Data: alive, metabolism, replication, consciousness.

  But note: we want to challenge the life-based rule. The above series shows that the transition is not sharp.

  For the one-respect variation: Suppose a group says the difference between a pile of sand and a sand castle is that the sand castle has a shape for a purpose. Then we give them a case of a pile of sand that has been naturally eroded into the shape of a castle (by wind) and has no purpose. Does composition occur? Or a group that says bonding is key: then we give them two objects that are barely bonded (e.g., by a weak adhesive) and ask.

  **Debrief:**

  The instructor should highlight:
  - The commonsense view (composition for organisms and artifacts) was challenged by cases like the virus, the broken watch, the sand castle, etc.
  - Each alternative has costs:
     - Universalism: you get the object composed of your nose and the Eiffel Tower. Also, the number of objects is huge.
     - Nihilism: there are no tables, only atoms arranged table-wise. This is hard to accept in daily life.
     - Brute facts: there is no general rule; composition just occurs in some cases and not in others. But then we cannot explain why.
  - What the activity did not cover: vagueness (could composition be vague? e.g., the watch series), quantifier variance (maybe the disagreement is verbal), and whether the SCQ is well-posed.

  **What might go wrong:**
  1. A group writes: "It composes something iff it does something interesting." -> Then in the data sheet, "function as a unit" might be interpreted as interesting. The instructor can ask: what counts as interesting? The rule must be mechanical. They must define "interesting" in terms of the data sheet fields. If they don't, the rule is rejected as non-mechanical.

  2. A group writes a disjunctive rule that lists all the cases they want to say yes to. But that violates the "one rule" constraint (which must be finite and not a list). The instructor can reject it.

  3. The group that writes a gerrymandered rule wins by being too flexible. But in the squeeze round, they will have to draw a line in a continuous series, which will be hard.

  4. Someone brings in persistence over time. The instructor should intervene: "We are only considering composition at a single time, not over time."

  5. A group cannot agree on a rule. They get a default rule (e.g., van Inwagen's: composition occurs only when the activity of the parts constitutes a life).

  6. The adversarial phase takes too long. The instructor must keep time.

  **Contested assumptions in the literature:**
  - The activity assumes that composition must have a general answer (a rule). But some philosophers (e.g., Trenton Merricks) think that composition occurs only when the resulting object has causal powers not reducible to its parts. This is a substantive view, but it is one among many. We are not assuming it is settled.
  - The activity assumes that composition is not vague (because the rule must give yes/no). But some think it can be vague (e.g., the watch series). We'll note that in the debrief.
  - The activity assumes that the rule must be based on physical and functional properties (as in the data sheet). But some think composition is mind-dependent (e.g., for artifacts). We'll include fields like "artifact" to capture that.

  **Final Deliverable:**

  Now, let's write it up in British English.
answer: |-
  ### Structured Seminar Activity: The Special Composition Question  
  **Objective:** To create experiential pressure on commonsense answers to van Inwagen's Special Composition Question (SCQ) — "When do some things compose one thing?" — by forcing students to formulate mechanical rules for composition and confront their consequences. The activity highlights the instability of the "moderate" view (composition for organisms/artifacts but not arbitrary sums) and makes extreme positions (universalism, nihilism, brute facts) and their costs tangible.

  ---

  ### **Rules and Roles**  
  - **Groups:** 4 panels of 4 students each (total 16).  
  - **Panel Role:** Act as a "Composition Certification Office" for a census bureau. Devise a general, mechanical rule to decide when a collection of parts composes a single object.  
  - **Rule Constraints:**  
    - Must fit on one side of an index card.  
    - No proper names (e.g., "Eiffel Tower"), indexicals (e.g., "here"), or vague terms (e.g., "interesting").  
    - Must be finite, general (one rule for all cases), and mechanically applicable to a data sheet.  
  - **Adversarial Roles:**  
    - **Challenger Group:** Tests another panel’s rule by selecting cases from the pool to expose flaws.  
    - **Defender Group:** Applies their rule to cases and must justify verdicts based on the data sheet.  

  ---

  ### **Materials**  
  1. **Index Cards:** For writing rules (one per group).  
  2. **Data Sheets:** Pre-filled for each case (template below).  
  3. **Case Pool Booklet:** 16 cases with data sheets (see **Case Pool** section).  
  4. **Tokens:** 5 tokens per group (poker chips or paper slips) for wagering.  
  5. **Whiteboard:** To list case IDs, record rules, and track scores.  
  6. **Chocolate/Prizes:** For token redemption (e.g., 1 token = one small chocolate).  

  #### **Data Sheet Template**  
  Each case’s data sheet includes these fields (all objective, observable at a single time):  
  | Field | Description |  
  |-------|-------------|  
  | **Number of parts** | Integer (e.g., 2, 10, 1,000) |  
  | **Relative positions** | "In contact", "bonded", "scattered", or "fixed relative positions" |  
  | **Bonding type** | "Covalent", "ionic", "mechanical", "gravitational", "none", or "weak/intermittent" |  
  | **Total mass (g)** | Numerical value (e.g., 500g, 10kg) |  
  | **Alive?** | "Yes" or "no" (based on metabolism/reproduction) |  
  | **Conscious?** | "Yes" or "no" (if applicable) |  
  | **Functions as unit?** | "Yes" (state function: e.g., "support", "timekeeping", "migration") or "no" |  
  | **Spatially contiguous?** | "Yes" (connected spatial region) or "no" |  
  | **Artifact?** | "Yes" (human-made) or "no" |  

  ---

  ### **Case Pool (16 Cases)**  
  Cases are designed to destabilise the moderate view. **Key:**  
  - ✅ = Commonsense "yes" (composition occurs).  
  - ❌ = Commonsense "no" (no composition).  
  - ⚠️ = Borderline (pressures moderate view).  
  Data sheets use neutral descriptions (no loaded terms like "object").  

  1. **Two bonded hydrogen atoms (H₂ molecule)**  
     - *Parts:* 2 | *Positions:* Bonded | *Bonding:* Covalent | *Mass:* 3.4e-24g | *Alive?* No | *Conscious?* No | *Functions?* Yes (chemical stability) | *Contiguous?* Yes | *Artifact?* No → **✅**  
  2. **Your nose + Eiffel Tower**  
     - *Parts:* 2 | *Positions:* Scattered | *Bonding:* None | *Mass:* 1,000,000,500g | *Alive?* No | *Conscious?* No | *Functions?* No | *Contiguous?* No | *Artifact?* No → **❌**  
  3. **Living cat**  
     - *Parts:* ~10²⁷ | *Positions:* Bonded | *Bonding:* Covalent/ionic | *Mass:* 4,000g | *Alive?* Yes | *Conscious?* Yes | *Functions?* Yes (metabolism) | *Contiguous?* Yes | *Artifact?* No → **✅**  
  4. **Dead cat (same as above, but no metabolism)**  
     - *Alive?* No → **⚠️** (Moderate view: still an object? Van Inwagen: no)  
  5. **Wooden table (assembled)**  
     - *Parts:* 6 (legs, top, etc.) | *Positions:* Bonded | *Bonding:* Mechanical | *Mass:* 10,000g | *Alive?* No | *Conscious?* No | *Functions?* Yes (support) | *Contiguous?* Yes | *Artifact?* Yes → **✅**  
  6. **Disassembled table (parts adjacent)**  
     - *Positions:* In contact | *Bonding:* None | *Functions?* No → **⚠️**  
  7. **Sand dune**  
     - *Parts:* 1,000+ grains | *Positions:* In contact | *Bonding:* None | *Mass:* 500,000g | *Alive?* No | *Conscious?* No | *Functions?* No | *Contiguous?* Yes | *Artifact?* No → **❌**  
  8. **Virus (influenza)**  
     - *Parts:* Proteins/RNA | *Positions:* Bonded | *Bonding:* Covalent | *Mass:* 1e-15g | *Alive?* No (no independent metabolism) | *Conscious?* No | *Functions?* Yes (replication in host) | *Contiguous?* Yes | *Artifact?* No → **⚠️**  
  9. **Bacteria colony**  
     - *Parts:* 1,000+ bacteria | *Positions:* Fixed relative positions | *Bonding:* Weak | *Mass:* 1e-9g | *Alive?* Yes (each) | *Conscious?* No | *Functions?* Yes (collective defence) | *Contiguous?* Yes | *Artifact?* No → **⚠️** (Is the colony an object?)  
  10. **Flock of geese (V formation)**  
      - *Parts:* 20 geese | *Positions:* Fixed relative positions | *Bonding:* None | *Mass:* 100,000g | *Alive?* Yes (each) | *Conscious?* Yes (each) | *Functions?* Yes (aerodynamic efficiency) | *Contiguous?* No | *Artifact?* No → **❌**  
  11. **Cloud (water droplets)**  
      - *Parts:* 1e9 droplets | *Positions:* In contact | *Bonding:* Gravitational | *Mass:* 500,000g | *Alive?* No | *Conscious?* No | *Functions?* No | *Contiguous?* Yes | *Artifact?* No → **⚠️**  
  12. **Pile of leaves**  
      - *Parts:* 50 leaves | *Positions:* In contact | *Bonding:* None | *Mass:* 200g | *Alive?* No | *Conscious?* No | *Functions?* No | *Contiguous?* Yes | *Artifact?* No → **❌**  
  13. **Human in coma (no consciousness)**  
      - *Parts:* ~10²⁷ | *Positions:* Bonded | *Bonding:* Covalent/ionic | *Mass:* 70,000g | *Alive?* Yes | *Conscious?* No | *Functions?* Yes (metabolism) | *Contiguous?* Yes | *Artifact?* No → **✅**  
  14. **Broken watch (parts attached, not functional)**  
      - *Parts:* 10 | *Positions:* Bonded | *Bonding:* Mechanical | *Mass:* 100g | *Alive?* No | *Conscious?* No | *Functions?* No | *Contiguous?* Yes | *Artifact?* Yes → **⚠️**  
  15. **Prion (misfolded protein)**  
      - *Parts:* 1 | *Positions:* N/A | *Bonding:* None | *Mass:* 1e-18g | *Alive?* No | *Conscious?* No | *Functions?* Yes (catalyse misfolding) | *Contiguous?* Yes | *Artifact?* No → **⚠️**  
  16. **Sand grains glued into a cube**  
      - *Parts:* 1,000 grains | *Positions:* Bonded | *Bonding:* Mechanical | *Mass:* 500g | *Alive?* No | *Conscious?* No | *Functions?* No | *Contiguous?* Yes | *Artifact?* Yes → **✅**  

  #### **Squeeze Series (Intermediate Cases)**  
  Used in Round 3 to force arbitrary thresholds. Pre-printed for efficiency.  
  - **Life Series** (Challenges life-based rules):  
    1. Prion (Case 15) → 2. Virus (Case 8) → 3. Mitochondrion (isolated, no nucleus) → 4. Bacterium (Case 14, but without "conscious") → 5. Living cat (Case 3).  
    *Mitochondrion data:* Parts: 1,000+ molecules | Bonded: Yes | Bonding: Covalent | Alive? No (not independent) | Functions? Yes (ATP production).  
  - **Contact/Function Series** (Challenges bonding/artifact rules):  
    1. Disassembled table (Case 6) → 2. Table parts stacked but not fixed → 3. Table parts fixed with weak glue (fails under pressure) → 4. Table with one screw loose (functional intermittently) → 5. Assembled table (Case 5).  

  #### **One-Respect Variation Cases**  
  Used in Round 3. Generated ad hoc based on groups' stated differences. Examples:  
  - If difference is **"Functions as unit"**: *Naturally formed sand castle* (wind-shaped, identical to artifact but no purpose).  
  - If difference is **"Bonding"**: *Two rocks with barely adhesive gum* (bonding: weak/intermittent).  
  - If difference is **"Alive"**: *Deeply comatose human* (alive: yes, conscious: no) vs. *fresh corpse* (alive: no).  

  ---

  ### **Timeline (75 Minutes)**  
  **0–5 min: Introduction (Instructor)**  
  - State the SCQ: "When do some things compose one thing?"  
  - Explain activity: Panels devise mechanical rules; adversarial challenges; squeeze rounds to test rules.  
  - Emphasise constraints: Rules must be mechanical, general, and use data sheet fields.  

  **5–20 min: Rule Creation (Groups)**  
  - Groups draft rules on index cards.  
  - **Instructor Circulates:** Reject non-mechanical rules (e.g., "if interesting") by demanding data-sheet criteria.  
  - *Output:* Each group submits one rule + 2 clear examples (one "yes," one "no") to anchor their view.  

  **20–30 min: Rule Swap and Adversarial Prep**  
  - Groups swap rules (Group 1 ↔ 2, Group 3 ↔ 4).  
  - Groups review the rule they receive and pick **2 cases** from the pool to challenge it.  

  **30–45 min: Adversarial Round**  
  - **Structure:**  
    - Challenger states case ID and their predicted verdict (using the rule).  
    - Defender applies rule and states verdict.  
    - Challenger argues: "This verdict is counterintuitive/ambiguous because..." (1 min).  
    - Defender responds (1 min).  
  - **Scoring:**  
    - If the rule is ambiguous or inconsistent with its own criteria, it "breaks." Defender group loses 1 token.  
    - If the rule survives, defender gains 1 token.  
  - *Example Challenge:* Rule says "compose if bonded" → Challenger picks Case 6 (disassembled table in contact). Defender must say "no," but challenger argues contact is borderline bonding.  

  **45–55 min: Squeeze Round 1 (Intermediate Series)**  
  - **Target:** 1–2 groups with moderate rules (e.g., "yes to organisms/artifacts").  
  - **Process:**  
    - Group is given a series (e.g., Life Series).  
    - They must specify **where composition starts** (e.g., at Case 3, not 2).  
    - Instructor asks: "Why not one step earlier? What changes?"  
  - **Pressure Point:** Forces arbitrary thresholds (e.g., "life starts at bacteria, not viruses").  

  **55–65 min: Squeeze Round 2 (One-Respect Variation)**  
  - **Target:** Same groups.  
  - **Process:**  
    - Group names one difference between their "yes" and "no" examples (e.g., "bonding" for table vs. disassembled table).  
    - Instructor gives a case varying only that respect (e.g., barely bonded rocks).  
    - Group applies rule → often forces a verdict they dislike (e.g., must say "yes" to nose+Eiffel Tower if bonded).  
  - **Pressure Point:** Highlights cost of their criterion.  

  **65–75 min: Debrief (Instructor-Led)**  
  - **Key Moments:**  
    - **Adversarial Round:** "When you said the table parts don’t compose, but the virus does, you felt the cost of rejecting artifacts." (Cost: Commonsense objects lost.)  
    - **Squeeze Round 1:** "Forcing a threshold in the life series made brute facts feel lazy — why here?" (Cost: No principled explanation.)  
    - **Squeeze Round 2:** "Varying one respect showed that your bonding rule commits you to universalism for bonded pairs." (Cost: Unwanted objects.)  
  - **Map to Dialectic:**  
    | Position | Cost Exposed | Activity Moment |  
    |----------|--------------|----------------|  
    | **Commonsense (moderate)** | Unstable thresholds; vagueness | Squeeze Round 1 (intermediate series) |  
    | **Universalism** | Arbitrary objects (e.g., bonded nose+Eiffel Tower) | One-respect variation (e.g., barely bonded case) |  
    | **Nihilism** | No tables/cats (only particles) | Adversarial Round (e.g., broken watch verdict) |  
    | **Brute facts** | No general rule; "magical" composition | Squeeze Round 1 (defending a threshold) |  
  - **Unstageable Aspects:**  
    - **Vagueness:** The activity assumes composition is all-or-nothing. You must note: "Van Inwagen denies vagueness, but some (e.g., David Lewis) accept it for composition."  
    - **Quantifier variance:** The game assumes "object" is univocal. You must say: "Some philosophers (e.g., Hirsch) think disagreement is verbal — but our rules treat it as substantive."  
    - **Ontological innocence:** The activity assumes composition adds nothing to the parts. You must flag: "Van Inwagen rejects this; others (e.g., Lewis) accept it."  
  - **Predictable Problems & Solutions:**  
    | Problem | Solution |  
    |---------|----------|  
    | Rule like "if it does something interesting" | Reject: "Define 'interesting' using data fields (e.g., function, bonding). If not, rule is invalid." |  
    | Gerrymandered disjunctive rule | Reject: "Not one general rule. Simplify or use universals." |  
    | Ship of Theseus/time discussion | Interrupt: "We’re only considering composition at a time, not persistence." |  
    | Group wins with flexible rule but learns nothing | Use Squeeze Rounds to force hard cases (e.g., barely-alive prion). Focus debrief on their rule’s costs. |  
    | Disagreement on verdicts | Use class vote for "counterintuitive" challenges in adversarial round. |  

  - **Final Note:** "Today, you felt why van Inwagen opts for life: it avoids arbitrariness but costs artifacts. No answer is cost-free — that’s the SCQ’s challenge."  

  ---

  ### **Contested Assumptions in the Literature**  
  The activity quietly assumes:  
  1. **Composition is not vague** (rules give yes/no). *Contested:* Some (e.g., Lewis) accept vague composition; van Inwagen rejects it.  
  2. **Composition requires a general answer**. *Contested:* Brutalists (e.g., Ned Markosian) deny this; van Inwagen insists on it.  
  3. **Sums are ontologically innocent** (composition adds no being). *Contested:* Van Inwagen rejects innocence; Lewis accepts it.  
  **Flag these in the intro/debrief to avoid misrepresentation.**  

  This design forces experiential pressure, avoids tech, and fits 75 minutes. Use the whiteboard to track rules/cases, and keep energy high with tokens/chocolate.
