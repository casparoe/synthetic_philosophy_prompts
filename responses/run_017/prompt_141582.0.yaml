prompt: |-
  You're a professional philosopher — philosophy of language, and ideally someone who has actually worked a fact-checking desk — so please take this seriously and think carefully before you commit to anything. Brainstorm the failure modes first, then give me the thing I can use. Don't hedge every step into mush; where something is a judgment call, say so and move on.

  Context: I write a column on science and ideas, two pieces a week, and my copy is stuffed with conditional sentences. Roughly: If the interim analysis holds up, approval is likely. If the variant had been picked up two weeks earlier, the wave would have been half the size. If we miss the deadline, the whole programme collapses. If the result replicates, the field has to rethink everything. Half of these I write myself, half I'm quoting a source, and in maybe a quarter of them I want to attach a number — there's about a 70 percent chance that if X, then Y. My standards editor has started pushing back on the numbered ones, and honestly she's right to.

  Here's the theory I'm working from, half-absorbed and possibly mangled: Lewis's triviality results are supposed to show that you can't have both (a) a conditional that expresses a proposition with truth conditions you can put a probability on, and (b) the probability of the conditional always equaling the conditional probability of the consequent given the antecedent, P(if A then B) = P(B|A). Then the usual moves, as I understand them: drop the truth conditions and treat conditional judgement as suppositional, Adams-style; keep the truth conditions but say the equation fails, and let assertability go by conditional probability; restrict the equation to some special initial prior — a philosopher friend mentioned this at dinner and I definately can't tell whether it's a real move or something I dreamt; or the linguistics view where if-clauses don't form a two-place connective at all but restrict some modal or quantifier that's already there, with Kratzer's name attached to it in my notes. Tell me which of these I've got wrong, one sentence each. But: no reading list, no citations, no bibliography. I can't check them and I don't want them. If you're tempted to write "as X argues," just give me the test instead.

  What I actually want is a decision procedure, in words, that my desk and I can run on a conditional sentence in about ten minutes: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it hands the decision to a person. Constraints: my copy editors have zero theory background, so every step has to be a question with a recognizable answer; anything involving a number has to end in wording my standards editor will sign off on; and where the real question is one of values, or of what I'm willing to say in my own voice, the procedure has to stop and hand it over rather than laundering it as a factual check. I need:

  - how to tell whether the sentence is a forecast, a causal or counterfactual claim, a bare regularity, or a covertly normative claim — the "find the modal" step, if that's a real step;
  - what to do when I want a number on the conditional itself (my guess: recast it as confidence in the consequent given the antecedent, never as a probability of a conditional — but say when the two come apart badly enough that even the recast misleads, e.g. when the antecedent is very unlikely or when the link is what's really at issue);
  - what to do when there's no number to be had and I'm forty minutes from deadline;
  - which conditionals to refuse to run as my own claim and attribute to the source instead, and how to attribute them without making the sentence unreadable;
  - a seperate gate where the copy editor has to escalate, and to whom.

  Then run the whole thing on three from my recent drafts: (1) If the trial's interim analysis holds up, the drug will be approved — call it a 70 percent chance. (2) If the variant had been caught two weeks earlier, this wave would have been half the size. (3) If the result replicates, the field will have to rethink everything. Fair warning: I like (3), it's my closing line, and if your procedure kills it I want to be told plainly that it kills it and why — not let off with a rewrite that quietly saves it.

  Last thing, and it's the part I care most about: tell me what would change your mind about the procedure itself. Which result — an empirical one about how ordinary readers actually understand these sentences, or a theoretical one, like a version of the equation that survives Lewis only for a restricted class of priors or for one distinguished prior — would make you relax the rule against putting numbers on conditionals? Where is this procedure most likely to misfire on real copy? And say what it can't do: I assume it can't tell me whether my causal model is right, but tell me the rest.
reasoning: |-
  Hmm, the user is a science and ideas columnist dealing with conditional statements in their writing. They're struggling with attaching probabilities to "if-then" statements after pushback from their standards editor. They mention David Lewis's triviality results which show problems with assigning probabilities to conditionals while maintaining that P(if A then B) equals P(B|A). They want a practical decision procedure for handling these conditionals in their writing under tight deadlines.

  The user needs a clear workflow that non-theorist copy editors can follow. They want to know how to categorize conditionals (forecasts, counterfactuals, etc.), when to use numbers, what to do when numbers aren't available, when to attribute claims to sources, and when to escalate. They also want me to test this procedure on three real examples from their drafts.

  For the decision procedure, I'll develop a step-by-step checklist. First step should be identifying the conditional type - forecasts (future-looking), counterfactuals (past with "had"), causal claims, or normative claims. For attaching numbers, I should advise against putting probabilities on the conditional itself and instead frame it as confidence in the consequent given the antecedent, except when the antecedent is extremely unlikely or the connection itself is in doubt.

  When numbers aren't available, they should use qualitative language like "likely" or "could" and attribute to sources when uncertain. Attribution should be clean, using phrases like "sources say" without cluttering the sentence. For escalation, copy editors should flag when conditionals involve high-stakes predictions, counterfactuals with policy implications, or when the writer's own credibility is on the line.

  Testing on their examples: For the drug approval (70% chance), I'd suggest reframing as confidence given the analysis. For the variant timing counterfactual, I'd recommend dropping the number and using "could" instead. For the replication example, I'd say to keep it but as a qualitative statement.

  I should also address what would make me change the procedure - mainly empirical evidence about how readers interpret probabilistic conditionals, or theoretical advances that resolve Lewis's paradox for practical cases. The procedure might misfire with ambiguous antecedents or when the connection between A and B is the actual point of debate. It can't validate causal models or handle complex interactions between multiple conditionals.

  The key is balancing philosophical rigor with practical journalism needs - giving them a tool that maintains integrity without paralyzing their writing process.
answer: |-
  Here's a field-ready decision procedure, designed for speed and clarity at the desk. It prioritizes avoiding error over theoretical purity, based on the core constraint: **Attaching a single probability number to "If A, then B" is highly treacherous and usually misleading. Treat it as suspect by default.**

  **The Core Failure Modes (Why This is Hard):**
  1.  **Lewis's Triviality:** If P(If A, then B) = P(B|A) *always* holds, and conditionals have standard truth conditions, it leads to absurdities (like P(B|A) becoming independent of A). You *can't* have both (a) and (b) universally.
  2.  **Adams' Insight:** Assigning a probability to the *whole conditional proposition* "If A, then B" as if it's a fact about the world is usually the wrong move. The *assertability* or *credence* we express is better understood as our confidence in B *on the supposition that A is true* (P(B|A)).
  3.  **Antecedent Probability:** If P(A) is very low, P(B|A) can be high *or* low without telling us much about the world, and P(If A, then B) becomes even more nebulous. The connection itself (the 'if...then' link) might be what's uncertain, not just B given A.
  4.  **Modal Ambiguity:** "If A, then B" can hide different things: a prediction (future), a causal claim (past/present), a counterfactual (past/impossible), a logical rule, or a normative claim ("If you want X, you should Y"). Each needs different handling.
  5.  **Value Laundering:** Attaching a number can falsely signal scientific precision where value judgments (e.g., "collapse", "rethink everything") are central.

  **Your Theory Check (One Sentence Each):**
  *   **Lewis:** Correct. Shows P(If A, B) = P(B|A) + standard truth conditions leads to contradiction.
  *   **Adams (Suppositional):** Correct core move. Probability *judgment* concerns B given A, not a monolithic proposition "If A, B".
  *   **Keep Truth + Drop Equation:** Correct option, but makes P(If A, B) often undefined/unstable/unhelpful.
  *   **Restrict to Prior:** A real move (e.g., "imaging"), but highly theoretical and impractical for journalism.
  *   **Kratzer (Restrictor):** Correct. "If"-clauses often specify the *circumstances* under which the main clause holds, rather than forming a truth-functional connective.

  **The Decision Procedure: "The Conditional Check" (Run in Order)**

  1.  **IDENTIFY THE TYPE (Find the "Modal"):**
      *   **Question:** What is the *core claim*? Is it primarily about: (a) a **future outcome** (forecast)? (b) an **alternative past/cause** (counterfactual/causal)? (c) a **general rule** (regularity)? (d) a **value/judgment call** (normative - "should", "have to", "collapses")? (e) **Restricting a quantifier** (e.g., "Most times if A, B")?
      *   **Sufficient Answer:** Pick the *dominant* character (a-e). If genuinely ambiguous between (b) and (c), or involves (d) or (e), note it. Stop if purely normative (d) – see step 4.
      *   **If No/Unclear:** Hand to Editor/Writer. ("What's the main thrust here? Predicting, explaining past cause, stating a rule, or making a judgment?")

  2.  **ASSESS THE NUMBER REQUEST:**
      *   **Question 1:** Is the number being placed *on the entire conditional "If A, then B" itself*? (e.g., "70% chance that [if A, then B]")
      *   **Sufficient Answer:** Yes or No.
      *   **If Yes:** **STOP. RECAST.** *Never* put a number on "If A, then B" as a single proposition. Recast the number as confidence *in B given A* (e.g., "If A, then we estimate a 70% chance of B"). Proceed to Step 3.
      *   **If No (Number is already on B|A):** Proceed to Step 3.

  3.  **ASSESS THE RECAST NUMBER (P(B|A)):**
      *   **Question 1 (Source):** Is this number **directly sourced** (e.g., "Source X estimates 70%")? (If YES, attribute clearly - see Step 4. Done.)
      *   **Question 2 (Antecedent Probability):** Is A **highly improbable/impossible**? (e.g., "If unicorns exist...", "If the laws of physics changed yesterday...")
          *   **If YES:** **WARNING FLAG.** P(B|A) might be meaningless or untethered. Be extremely cautious. Can the claim be made *without* the number? (e.g., "Even if unicorns existed, it's unclear if B"). If number is essential, attribute heavily. Escalate if high-stakes.
      *   **Question 3 (Link Uncertainty):** Is the *core uncertainty* really about **whether A *leads to* B**, rather than just B happening *if* A is true? (e.g., "If we run the experiment (A), *will it actually cause* the reaction (B)?")
          *   **If YES:** **WARNING FLAG.** P(B|A) might not capture the uncertainty about the *causal link itself*. Can the claim be made *without* the number? (e.g., "A is expected to lead to B, but the mechanism is complex"). If number is essential, attribute heavily. Escalate if high-stakes.
      *   **Question 4 (Value Judgment):** Does B contain a **significant value-laden term** ("collapse", "rethink everything", "disaster", "major win") that the number might falsely quantify?
          *   **If YES:** **WARNING FLAG.** The number quantifies likelihood, not the *magnitude of judgment*. Attribute heavily or rephrase B to be more factual ("the program would face termination" vs. "collapse"). Escalate if central to claim.
      *   **Sufficient Answer:** Pass (No Flags), or Flagged (specify which: Low P(A), Link Uncertainty, Value Judgment).
      *   **If Pass:** Use the number framed as P(B|A) (e.g., "If A, there is a 70% chance of B").
      *   **If Flagged:** Proceed to Step 4 (Attribution) or Step 5 (Escalation) based on severity/context. Consider dropping the number.

  4.  **ATTRIBUTION & REWRITE (When Unsure, Flagged, or Normative):**
      *   **Question:** Can this claim (with or without number) be credibly **attributed to a specific, qualified source?**
      *   **Sufficient Answer:** Yes (Source Named) or No.
      *   **If Yes:** Attribute clearly and concisely: "Source X says...", "According to Model Y...", "Evidence suggests...", "Analysts estimate...". *Place the attribution as close as possible to the core claim.*
          *   *Clean Attribution Examples:*
              *   "If the interim analysis holds up, approval is likely, *researchers familiar with the data say.*"
              *   "*Modelling by Team Z suggests* if the variant had been caught earlier, the wave could have been halved."
              *   "*Lead scientist Dr. A believes* if the result replicates, the field will need a major rethink."
              *   "There's about a 70% chance of approval *if the interim analysis holds, according to regulatory analysts.*"
      *   **If No (Your own claim):** Proceed to Step 5 (Escalation) if flagged in Step 3, or if the claim is high-stakes/normative. Otherwise, **drop the number** and use **qualitative language** based on Step 3 assessment:
          *   High Confidence: "likely", "expected", "probable", "should"
          *   Medium Confidence: "could", "may well", "a strong possibility", "plausible"
          *   Low Confidence/Uncertain Link: "might", "possibly", "potentially", "is associated with"
          *   Counterfactual: "could have", "might have", "would likely have"

  5.  **ESCALATION GATE (Copy Editor Use):**
      *   **Escalate to Standards Editor or Senior Writer IF:**
          1.  Step 1 identifies a **primarily Normative claim** made in the writer's own voice.
          2.  Step 3 raises a **Warning Flag (Low P(A), Link Uncertainty, Value Judgment)** on a claim made in the writer's own voice *and* the claim is **high-stakes** (policy impact, reputational risk, core argument).
          3.  Step 4 results in **No credible source for attribution** *and* the claim is **high-stakes** *and* the writer insists on making it in their own voice.
          4.  **Ambiguity persists** after running Steps 1-4 and time is short.
      *   **Reason for Escalation:** "Value judgment / High uncertainty in causal link / Highly improbable antecedent / Core claim lacks clear sourcing / Unresolved ambiguity."

  **Running Your Examples:**

  1.  **"If the trial's interim analysis holds up, the drug will be approved — call it a 70 percent chance."**
      *   Step 1: **Forecast.**
      *   Step 2: **Number on conditional? YES.** RECAST: "If the interim analysis holds up, we estimate a 70% chance the drug will be approved."
      *   Step 3: Assess P(B|A) - Approval given analysis holds.
          *   Q1 (Source): **No** (Writer's voice).
          *   Q2 (Low P(A)): **Unlikely Flag.** Interim analysis holding is the scenario.
          *   Q3 (Link Uncertainty): **Possible Flag.** Is the *certainty* about the *regulatory decision process* given the data? Or just the approval outcome? (Likely the latter is the focus here).
          *   Q4 (Value): **No.** "Approved" is factual.
          *   **Judgment:** Minor Link Uncertainty possible. **Pass with Caution.**
      *   Step 4: **Not needed** (Own voice, Pass). Use recast: "If the interim analysis holds up, we estimate a 70% chance the drug will be approved." *Ensure "we estimate" reflects actual basis (e.g., historical approval rates, source discussions).*
      *   **Outcome:** Recast number survives. Standards Editor might push back on "we estimate" without sourcing - be prepared to attribute ("analysts estimate") or qualify ("based on historical trends").

  2.  **"If the variant had been caught two weeks earlier, this wave would have been half the size."**
      *   Step 1: **Counterfactual/Causal.**
      *   Step 2: **No number requested.** Proceed.
      *   Step 3: Assess implicit assertion of near-certainty ("would have").
          *   Q1 (Source): **No** (Writer's voice).
          *   Q2 (Low P(A)): **YES FLAG.** It *wasn't* caught earlier. This is definitional for counterfactuals.
          *   Q3 (Link Uncertainty): **STRONG FLAG.** The core uncertainty *is* the causal link/model: *Would* earlier detection *actually cause* a halved wave? How robust is the model?
          *   Q4 (Value): **No.** "Half the size" is quantitative.
          *   **Judgment:** **Double Flagged (Low P(A), Link Uncertainty).**
      *   Step 4: **Attribute or Qualify.** Writer's voice + Flags = Attribute strongly or soften language.
          *   *Option 1 (Attribute):* "Modelling suggests if the variant had been caught two weeks earlier, this wave could have been half the size."
          *   *Option 2 (Qualify):* "If the variant had been caught two weeks earlier, this wave *might* have been significantly smaller, *according to epidemiological models.*" (Drops precise "half", softens "would" to "might", attributes).
      *   **Outcome:** Original claim in writer's voice with "would" is **killed** by the procedure due to flags. Rewrite required (attribution + softer modal).

  3.  **"If the result replicates, the field will have to rethink everything."**
      *   Step 1: **Forecast + Strong Value Judgment ("have to rethink everything").**
      *   Step 2: **No number requested.** Proceed.
      *   Step 3: Assess implicit assertion of high likelihood/certainty ("will have to").
          *   Q1 (Source): **No** (Writer's voice).
          *   Q2 (Low P(A)): **Possible Flag.** Depends on likelihood of replication. (Assume replication is plausible but not guaranteed).
          *   Q3 (Link Uncertainty): **STRONG FLAG.** The core uncertainty is *whether replication would necessitate such a fundamental rethink*. This is a value/judgment call about significance.
          *   Q4 (Value): **YES FLAG.** "Rethink everything" is a major, unquantifiable normative judgment.
          *   **Judgment:** **Double Flagged (Link Uncertainty, Value).**
      *   Step 4: **Attribute or Qualify.** Writer's voice + Flags = Attribute strongly or soften significantly.
          *   *Option 1 (Attribute):* "Some experts argue that if the result replicates, the field will have to rethink its foundations."
          *   *Option 2 (Qualify):* "If the result replicates, it *could* force a major reassessment in the field." (Softens "will have to" to "could force", softens "rethink everything" to "major reassessment").
      *   **Outcome:** Your original closing line ("will have to rethink everything") in your own voice is **killed** by the procedure. The double flag (Link Uncertainty + Value Judgment) makes it too strong an unsourced claim. It asserts both a near-certain causal link *and* the magnitude of the necessary response. Rewrite required (attribution or softened language). *The core insight ("replication would be a big deal") can be kept, but the phrasing needs adjustment.*

  **What Would Change My Mind (About the Number Rule):**

  1.  **Empirical Evidence:** Robust, replicated studies showing ordinary readers *reliably and consistently* interpret "There's a 70% chance that if A, then B" as *equivalent to* "If A, there's a 70% chance of B" **across a wide range of contexts** (especially low P(A) and causal link uncertainty cases), *without* importing significant misinterpretations (like thinking it quantifies the link itself or the probability of A). Current evidence suggests high variability and misunderstanding.
  2.  **Theoretical Advance:** A coherent, practical, and *testable* account demonstrating that for a well-defined, non-trivial class of "everyday" conditionals (e.g., forecasts with high P(A)), under specific (and common) epistemic conditions, P(If A, B) behaves stably and predictably enough for journalistic use *and* approximates P(B|A) sufficiently closely that the difference is negligible in practice. Lewis's result makes this extremely difficult. "One distinguished prior" is too abstract and unworkable for journalism.

  **Where the Procedure is Most Likely to Misfire:**

  1.  **Ambiguous Antecedents:** When "A" is vague or can be interpreted in multiple ways, assessing P(A) or P(B|A) becomes messy. (e.g., "If the economy improves...")
  2.  **Complex Interactions:** When B depends on A *and* other factors not mentioned, P(B|A) might be poorly defined or misleading without context. (e.g., "If interest rates rise, house prices will fall" – but what if supply is constrained?).
  3.  **Borderline Cases:** Distinguishing "strong causal link" (Pass) from "link is the core uncertainty" (Flag) can be subjective. Similarly, distinguishing factual B from value-laden B.
  4.  **Over-Attribution:** It might push you to attribute claims that are reasonably common knowledge within the field just to be safe. Judgment call.
  5.  **Killing Valid Rhetoric:** It might reject strong, clear statements (like your #3) that, while technically imprecise, effectively communicate the stakes and are understood appropriately by the audience. This is the cost of error avoidance.

  **What the Procedure CANNOT Do:**

  1.  **Validate your causal model.** It flags *uncertainty* about the link (A -> B), but doesn't tell you if your model is *correct*.
  2.  **Determine the "true" P(B|A).** It helps assess whether *stating* a number is appropriate, not whether the number itself is accurate. That's standard fact-checking of the source/model.
  3.  **Resolve deep philosophical ambiguities in 10 minutes.** It provides practical heuristics to avoid the worst pitfalls identified by philosophy.
  4.  **Make value judgments for you.** It flags value-laden terms and pushes attribution/escalation, but doesn't tell you if "rethink everything" is the *right* judgment.
  5.  **Handle nested or complex conditionals well.** (e.g., "If A, then if B, then C"). Simplify these ruthlessly for clarity before running the check.

  This procedure forces explicitness: sourcing, qualifying language, or acknowledging judgment calls. It prioritizes preventing the reader from being misled by a falsely precise number attached to a complex conditional proposition. Use it, but trust the escalation gate when your journalistic instinct clashes with it.
