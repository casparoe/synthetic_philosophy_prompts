    2. The gap between first-person expectation (the insured only experiences survival) and third-party observation (others see them die in some branches).
    3. The Born rule concern: surviving branches might have vanishingly small amplitude, so the insured shouldn't expect to find themselves in them.
    4. The reporting problem: a successful run (survival) cannot be reported because the only people who would hear about it are in branches where the experimenter is dead.
    5. Mangled-worlds: surviving branches might be increasingly damaged or undesirable.
    6. The apparatus only insures against that specific quantum-triggered death, not other causes.
    7. Legal move: payout based on third-party certification of death, not subjective continuity.
    8. Product idea: a rider priced by branch amplitude (premiums scaling with inverse square of amplitude) with the benefit only collectible in survival branches.
