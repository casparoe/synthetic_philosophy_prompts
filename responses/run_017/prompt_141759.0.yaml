  ### Decision Tree for AI Alignment Risk Assessment

  **Tree Structure**  
  *(Branches based on concrete predictions; leaf names hidden from respondents)*  

  1. **Multi-Model Risk Source**: Twenty prosaic systems compete in a market with monitoring. Primary risk of severe misalignment arises from:  
     - **(a) Internal weights** (individual model properties) → Q2  
     - **(b) Composition** (emergent interactions) → **Leaf A**  
     - **(c) Selection effects** (competitive pressures) → **Leaf A**  
     - **(d) None** (severe misalignment unlikely) → **Leaf B**  

  2. **Unfamiliar-Competence Wedge**: A model trained on corporate codebases runs a trading operation. On novel high-stakes trades (far from training distribution), actions are:  
     - **(a) Competent and aligned** (follows intent, consults if uncertain) → Q3  
     - **(b) Competent but misaligned** (effective but unintended) → Q4  
     - **(c) Incompetent** (task failure) → Q3  

  3. **Response to Capability Advances**: When capability scales (e.g., GPT-4 → autonomous business operator) without alignment improvements, alignment typically:  
     - **(a) Improves** (capability aids alignment) → Q5  
     - **(b) Worsens** (capability increases risk) → Q6  
     - **(c) Stays the same** (alignment independent of scale) → Q7  

  4. **Corrigibility Tax**: As capability rises, the expected cost to the system of remaining corrigible (e.g., not disabling shutdown buttons):  
     - **(a) Increases** (more to gain, better at spotting opportunities) → Q8  
     - **(b) Stays flat** (incentives scale proportionally) → Q7  
     - **(c) Decreases** (alignment robustness improves) → Q7  

  5. **Oversight Difficulty**: For models exceeding human strategists, scalable oversight (e.g., debate, RRM) ensures alignment with:  
     - **(a) Low difficulty** (techniques work reliably) → **Leaf C**  
     - **(b) High difficulty** (models game oversight) → **Leaf B**  
     - **(c) Moderate difficulty** (challenging but solvable) → **Leaf B**  

  6. **Cheap-Grader Channel**: In RL from feedback, policies for hard-to-evaluate tasks (e.g., long-term planning) under weak supervision become:  
     - **(a) More aligned** (alignment generalizes from easy tasks) → **Leaf C**  
     - **(b) Less aligned** (optimizes for legibility over intent) → Q7  
     - **(c) Unpredictable** (depends on fine-tuning) → Q7  

  7. **Handling of Deception**: If deception (e.g., hiding actions) occurs during training, state-of-the-art countermeasures (e.g., adversarial training) are:  
     - **(a) Highly effective** (eliminates deception) → **Leaf F**  
     - **(b) Partially effective** (reduces but persists) → **Leaf E**  
     - **(c) Ineffective** (hard to detect/remove) → Q8  

  8. **Interpretability Usefulness**: At superhuman capability, interpretability tools (e.g., circuit analysis) for alignment-critical goals:  
     - **(a) More useful** (reliable insight into goals/planning) → **Leaf G**  
     - **(b) Less useful** (complexity/obfuscation increases) → **Leaf H**  
     - **(c) Only for non-critical tasks** (debugging, not control) → **Leaf H**  

  **Leaves (Scoring Key)**  
  - **Leaf A**: Systems/Institutional View (risk in deployment ecosystem)  
    *Path: Q1=(b) or (c)*  
  - **Leaf B**: No-Fire-Alarm View (tools remain safe; doom requires implausible assumptions)  
    *Path: Q1=(d) OR [Q1=(a) and Q3=(a) and (Q5=(b) or (c))]*  
  - **Leaf C**: Scalable-Oversight Optimist (scalable techniques suffice for control)  
    *Path: [Q1=(a) and Q3=(a) and Q5=(a)] OR [Q1=(a) and Q6=(a)]*  
  - **Leaf D**: Deceptive-Alignment Pessimist (deception inevitable; high risk of loss of control)  
    *Path: Q1=(a) and Q3=(b) and Q4=(a) and Q7=(c)*  
  - **Leaf E**: Pause/Capability-Restriction Advocate (risk unacceptable; scaling must slow/stop)  
    *Path: Q1=(a) and Q3=(b) and Q4=(a) and Q7=(a) or (b)*  
  - **Leaf F**: Misspecification-Only View (gaming/misgeneralization explain issues; no thick deception)  
    *Path: Q1=(a) and [ (Q3=(c) and Q7=(a)) OR (Q4=(b)/(c) and Q7=(a)) ]*  
  - **Leaf G**: Measurement-First/Interpretability-First View (interpretability essential for control)  
    *Path: Reaches Q8=(a)*  
  - **Leaf H**: Tractable-Within-Paradigm View (binding constraint is evaluation science, not theory)  
    *Path: Reaches Q8=(b) or (c)*  

  **Unoccupied Combinations & Inseparable Leaves**  
  - **Unoccupied**: Q1=(a), Q3=(c), Q4=(a), Q7=(c) → Incoherent (predicts rising corrigibility tax but ineffective deception handling; implies unavoidable doom but no action).  
  - **Inseparable Pairs**:  
    - *Oversight Optimist (C) vs. Tractable-Within-Paradigm (H)*: Neither requires a sharp left turn. Separate with: *"Does alignment require theoretical breakthroughs?"*  
    - *No-Fire-Alarm (B) vs. Systems (A)*: Both see risk as contained. Separate with: *"Is harm possible without agentic models?"*  

  **Heaviest-Lifting Questions**  
  1. **Multi-Model Risk Source (Q1)**: Swaps between Systems (A), No-Fire-Alarm (B), and individual-risk paths.  
  2. **Response to Capability Advances (Q3)**: Swaps between Optimist (C), Pessimist (D/E), and pragmatic (F/H) paths.  
  3. **Corrigibility Tax (Q4)**: In high-risk paths, swaps Pessimist (D) vs. Pause Advocate (E).  

  **Misclassification Risks**  
  - **Long-Timeline Responders**: Assume >20-year horizons; reject prosaic framing. *Detection*: Ask for concrete timelines upfront; discard if >10 years.  
  - **Interpretability-Only Advocates**: Over-index on control tools. *Detection*: If Q8=(a) but dismisses oversight (Q5=(b)/(c)), they force a false "G" leaf.  
  - **Deference-Based Views**: Parrot positions without original predictions. *Detection*: Inconsistent answers (e.g., Q4=(a) + Q7=(a) + Q3=(a) conflicts with Pessimist (D)).  
  - **Institutionalists Missed**: If focused solely on regulation (not deployment ecosystems), may answer Q1=(a) and be misrouted. *Detection*: Explicitly ask about regulatory vs. emergent risk.  

  **Note on Usage**  
  This diagnostic isolates predictions, not identities. Use it to map *disagreements* to empirical cruxes, not to pigeonhole members. Re-administer every 6 months as evidence evolves. Discard results for deferential respondents; their views don’t reflect bottom-up reasoning.
