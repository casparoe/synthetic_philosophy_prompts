  **Step 1: Setting up the prisoner's dilemma (PD) framework**

  - The one-shot prisoner's dilemma: Two players, each can cooperate (C) or defect (D). The payoffs: T (temptation to defect) > R (reward for mutual cooperation) > P (punishment for mutual defection) > S (sucker's payoff for cooperating when the other defects). In one-shot, the Nash equilibrium is (D, D) because regardless of what the other does, defecting yields a higher payoff.

  - Iterated prisoner's dilemma (IPD): If the game is repeated with the same players, cooperation can emerge via strategies like tit-for-tat (TFT) because there is a future to punish defection. Reputation and reciprocity in repeated interactions are key.

  **Step 2: Applying to Arrival**

  The situation in Arrival:

  - The heptapods (aliens) give their language to humanity. This is costly for them (they come to Earth, risk conflict, and expend resources). The benefit to humanity is the gift of the language, which changes human cognition (allowing non-linear time perception).

  - In return, humanity is supposed to help the heptapods in 3000 years. The heptapods won't be around then (they will need help, but the specific heptapods giving the gift won't receive it). The humans who receive the gift are not the ones who will help; it's future humans.

  This does not fit neatly into:

  - One-shot PD: Because there is no immediate exchange. The return is far in the future and by different agents.

  - Iterated PD: Because there is no repetition between the same players. The heptapods and humans don't have repeated interactions in the usual sense. The interaction is one-off, but with a delayed consequence.

  **Step 3: Examining "diachronic reciprocity"**

  The user's term "diachronic reciprocity" refers to a chain of reciprocity across time, where the reciprocation is not by the original recipient but by their descendants or successors, and the original giver is not the one who receives the payback.

  In game theory, this is related to:

  - **Indirect reciprocity**: Where you help someone and then receive help from a third party (based on reputation). But in this case, the heptapods don't build a reputation that future humans will know about (unless the knowledge is passed down, but 3000 years is a long time).

  - **Group selection or cultural evolution**: Cooperation can evolve if groups with cooperators outcompete groups without, but that's a long-term process.

  - **The problem of discounting**: Future benefits are discounted (reduced in value) because of the time delay. In standard models, if the discount rate is high, cooperation won't emerge.

  The heptapods' gift is given without any immediate return, and the return is 3000 years later. This is problematic because:

  - The heptapods who give the gift won't be alive to receive the return (so no direct benefit).

  - The humans who receive the gift are not the ones who will pay it back (so they might free-ride).

  However, the film suggests that by giving the language, the heptapods are ensuring their own future because they know that humanity will help them in 3000 years. But note: the heptapods experience time non-linearly.

  **Step 4: The wrinkle of non-linear time**

  - For the heptapods, past, present, and future are simultaneous. So from their perspective, the gift and the return are not separated by time; they are part of a single event.

  - Therefore, what appears to Louise as a delayed exchange is, for the heptapods, a simultaneous exchange.

  This changes the nature of the game:

  - In the heptapods' frame, the interaction is simultaneous: they give the language and simultaneously receive (or experience) the future help. Thus, it is not a one-shot with delay, but a one-shot with simultaneous mutual cooperation.

  - In game-theoretic terms, if the aliens perceive the entire timeline at once, then they are in a "game" that includes the entire history and future of the interaction. But note: if they know the future, do they have a choice?

  **Step 5: The problem of determinism and choice**

  - The film shows that learning the heptapod language allows humans to perceive time non-linearly, as the heptapods do. Louise, after learning the language, sees her future: she will have a daughter who dies young, and she chooses to have that daughter anyway.

  - Similarly, the heptapods know that they will give the language and that humanity will help them in 3000 years. They do not "decide" in the moment; they are acting out what they know will happen.

  Game theory assumes that agents have choices and make decisions based on incentives. If an agent knows the future and cannot change it, then they are not making a strategic choice; they are following a script.

  Thus, in the deterministic universe of the heptapods (and eventually Louise), the problem of cooperation doesn't arise because there is no strategic uncertainty. They are not playing a game; they are performing a predetermined sequence of actions.

  This is a key point: if the heptapods have no alternative actions (because they see the future and it is fixed), then there is no game. Cooperation is not achieved through strategic interaction but through a fixed timeline.

  **Step 6: Scenes and readings**

  - The scenes where Louise is learning the language and having flash-forwards: These show her gaining non-linear time perception. This supports the idea that for the heptapods, the exchange is simultaneous.

  - The scene where Louise explains to the military that the heptapods are offering a "weapon" (which is actually the language) and that they need humanity's help in the future. This is the setup for the diachronic reciprocity.

  - The climax: Louise uses her knowledge of the future (gained from the language) to call General Shang and say the words his wife told her on her deathbed, which prevents a global war. This act of cooperation (saving the heptapods) is made possible because she knows the future.

  But note: Louise's action is predetermined. She does it because she knows she will do it. Similarly, the heptapods give the gift because they know they will.

  **Step 7: What the film shows that formal arguments cannot**

  - The film portrays a world where non-linear time perception allows for the experience of future consequences as present. This collapses the time delay and makes the exchange simultaneous in the mind of the actor.

  - In such a world, the problem of cooperation in the face of delayed benefits is solved by changing the actor's perception of time. This is not a mechanism available in standard game theory, which assumes linear time.

  - The film also suggests that the gift of the language is what enables the cooperation: by changing human cognition, it allows humans to see the long-term consequences and thus choose cooperation.

  **Step 8: Game-theoretic disputes**

  Settled:

