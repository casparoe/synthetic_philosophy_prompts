  - In IPD with a high enough probability of future interactions and a low discount rate, cooperation can be sustained (e.g., by TFT).

  Contested:

  - Whether indirect reciprocity or cultural group selection can explain long-term cooperation across generations is still debated. Some models show that with cultural transmission, cooperation can evolve, but it depends on parameters.

  - The role of time discounting: How much do we discount future benefits? Standard models assume exponential discounting, but hyperbolic discounting is also studied. If the discount rate is zero, then even a far future benefit might be valued, but that is not realistic.

  - The idea of "diachronic reciprocity": This is not a standard term in game theory. The closest is perhaps "intergenerational reciprocity" or "serial reciprocity". There are models of overlapping generations where cooperation can be sustained, but these typically require repeated interactions within a generation and some mechanism to pass on the cooperative norm. A 3000-year gap with no continuity is extreme.

  **Step 9: Verdict on the mechanism**

  - From a linear-time perspective, the arrangement in Arrival is not a mechanism for one-shot cooperation because the reciprocation is too delayed and by different parties. Without the non-linear time element, it would not work.

