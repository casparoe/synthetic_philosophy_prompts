prompt: |-
  I'm a PhD student teaching my first standalone seminar in epistemology: 16 upper-level undergraduates, one 90-minute session, a whiteboard, a pack of index cards and nothing else — no AV, no budget, no real stakes I can put on the table. They will have read short selections from Wittgenstein's late notes on certainty (the remarks about doubt coming to an end, and the image of some propositions as the bed of a river that shifts slowly while the water above it moves fast), and roughly half of them will also have read Moore's attempt to prove the existence of an external world by holding up his hands. In my experience students arrive in one of two moods: either they think every well-supported belief is certain in exactly the same flat way, or they think nothing is, and there is always one student who will play the professional skeptic for the whole hour. I ran a version of this session last year and it collapsed in both directions at once — the skeptic paralysed the discussion, and the rest of the class concluded that if doubt stops anywhere it stops everywhere, so that any proposition anyone feels confident about counts as bedrock. I want a design that makes that collapse structurally unlikely rather than one in which I simply talk them out of it.

  What I want them to run into, before the word hinge is ever said out loud, is that the feeling that you cannot seriously doubt something is no detector at all. Please build the activity around a deck of propositions that contains both genuine load-bearing ones, where a sustained doubt makes the practice the group is engaged in literally unplayable, and what I'll call "decoys": propositions that feel exactly as indubitable but whose doubt the practice simply absorbs, because more evidence settles it. I also want the same proposition to appear twice, doing different work — what I'll call a "transplanted" proposition, load-bearing inside one practice and an ordinary checkable hypothesis inside another, with participants assigned to different practices so that each side finds the other side's bedrock scandalous and each side's outrage invisible to the other. And I want some propositions to be "erodible": dropped in the course of the session not because anything refuted them but because the practice they were holding up has quietly changed, so that the group has to feel the difference between that was false and that no longer does any work. None of these three things should be explained to them beforehand. They should be produced by the rules, the roles, the scoring, or the way the cards are distributed, and the group should supply the distinctions themselves before anyone names them.

  So: a runnable activity with roles and rules and no upfront lecture, a timeline, the deck itself, and a debrief that maps specific moments in the session onto specific features of the view, including an honest statement of which feature the activity cannot reproduce and which I will have to state plainly (I suspect it is the way these propositions are not adopted by any decision and are shown in what people do rather than in what they say, but I'd like your diagnosis rather than mine). Tell me what will predictably go wrong — the skeptic, the everything-is-a-hinge slide, the student who treats a hinge as a rule the group voted on — and how to handle each without pausing to lecture. Give the answer as a single JSON object with these fields: materials (string: what I need, all of it cheap); roles_and_setup (string: who is assigned what and how the groups are formed); rules (array of strings); phases (array of objects with keys minutes, participants_do, engineered_to_happen); card_deck (array of 12–16 objects with keys proposition, practice, kind — one of load_bearing, decoy, transplanted, erodible — and intended_discovery); debrief_map (array of objects with keys moment_in_activity, mapped_onto, facilitator_move); predicted_failures (array of objects with keys what_goes_wrong, why, handling); cannot_reproduce (string). Keep every string field to at most three sentences except card_deck and phases.
reasoning: |-
  We are designing an activity for an epistemology seminar. The goal is to help students discover that the feeling of indubitability is not a reliable detector of what is actually a "hinge" proposition (a load-bearing certainty that makes a practice possible). We want them to encounter:
  - Load-bearing propositions: doubt makes the practice unplayable.
  - Decoys: feel indubitable but doubt can be settled by evidence.
  - Transplanted propositions: same proposition acts as load-bearing in one practice and as a checkable hypothesis in another.
  - Erodible propositions: dropped because the practice changed, not because they were refuted.

  The activity should avoid upfront lecture and instead use rules, roles, and card distribution to lead students to these discoveries.

  Materials: 
  - Whiteboard
  - Index cards (we'll need at least 16 for the deck, plus a few for writing during the activity)
  - Pens

  Roles and Setup:
  - 16 students. Divide them into two groups of 8 (Group A and Group B) for two different practices. Each group will have a set of index cards with propositions that are part of their practice. Within each group, assign roles: 4 as "Practitioners" (who must play the practice by the rules) and 4 as "Skeptics" (who are allowed to raise doubts). The Skeptics in each group are given a specific card that lists propositions they are allowed to doubt (but they must choose one at a time). The groups are separated to different sides of the room.

  Rules (array of strings):
  1. "Each group has a practice to play: Group A is playing 'Scientific Community' and Group B is playing 'Legal Tribunal'. Each practice has a goal: for Group A, to establish a new scientific fact; for Group B, to reach a verdict on a case."
  2. "Each group has a set of index cards with propositions. Some are foundational to the practice and some are ordinary claims. The group must use these propositions to achieve their goal."
  3. "Practitioners: You must use the propositions to build your case and achieve the goal. You can only use a proposition if no one in your group is currently doubting it. If a Skeptic doubts a proposition, you must set it aside until the doubt is resolved."
  4. "Skeptics: You may doubt one proposition at a time by raising your hand and stating which proposition you doubt. You must choose from the list on your Skeptic card. When you doubt, explain why. The group must then try to resolve your doubt by using other propositions or evidence (but note: the only evidence available is the set of propositions and the rules of the practice)."
  5. "Doubt resolution: If the group can provide a proposition that the Skeptic accepts as resolving the doubt, the proposition is restored. If not, it remains set aside. If the proposition is foundational and set aside, the practice may become unplayable."
  6. "Scoring: The group scores 1 point for achieving their goal. If the group cannot achieve the goal because too many foundational propositions are set aside, they score 0. The Skeptics score 1 point for each proposition they successfully doubt (i.e., that remains set aside and blocks the goal) and 0 otherwise. Practitioners score 1 point if they achieve the goal, 0 otherwise."
  7. "After 20 minutes, each group will present one proposition that they found most foundational and one that they found most easily resolved. Then, we will have a crossover: one Skeptic from Group A will join Group B and vice versa. They will try to play the other group's practice and will be shocked by what the other group takes for granted."

  Phases (array of objects):

  Phase 1: Setup and Group Work (minutes: 20)
  - Participants do: Groups work separately. Practitioners try to use the propositions to build their case (scientific fact or legal verdict). Skeptics raise doubts when they see an opportunity.
  - Engineered to happen: Groups will encounter that doubting a load-bearing proposition paralyzes the practice. They will also see that decoys can be resolved by other propositions (evidence). The erodible proposition in each group might be set aside and the practice adapts without it.

  Phase 2: Cross-Group Presentation (minutes: 10)
  - Participants do: Each group presents one load-bearing proposition and one decoy they encountered. They explain what happened when they were doubted.
  - Engineered to happen: Highlight the difference between load-bearing and decoy. Also, set up for the crossover by showing that what one group considers foundational might be different in the other.

  Phase 3: Crossover and Mixed Practice (minutes: 20)
  - Participants do: One Skeptic from Group A moves to Group B and vice versa. The groups now try to play the other group's practice with the new Skeptic. The new Skeptic will doubt propositions that were foundational in their original group but might be decoys in the new one, and vice versa.
  - Engineered to happen: The transplanted propositions will cause outrage because the new Skeptic will doubt what the group considers bedrock, and the group might doubt what the Skeptic considers easily resolvable. This shows that the same proposition can be load-bearing in one practice and a decoy in another.

  Phase 4: Reflection and Erosion (minutes: 15)
  - Participants do: The facilitator asks each group to look at the propositions they set aside. They are told that they must now try to achieve their goal without one of the foundational propositions (the erodible one) because the practice has changed (e.g., for Science: a new paradigm; for Legal: a change in the law). They must adapt and see if they can still play.
  - Engineered to happen: The group realizes that the erodible proposition is no longer needed and that the practice has shifted. They experience that the proposition was not refuted but simply no longer functional.

  Phase 5: Whole Class Discussion (minutes: 25)
  - Participants do: The whole class discusses: What made some doubts paralyzing and others not? Why were some propositions non-negotiable in one context but not in another? What happened when we removed a proposition not because it was false but because the practice changed?
  - Engineered to happen: The class will generate the distinctions: load-bearing vs. decoy, transplanted (context-dependent), and erodible (historical). The facilitator will then introduce the term "hinge" and connect to Wittgenstein.

  Card Deck (12-16 cards, each with proposition, practice, kind, intended_discovery):

  Group A: Scientific Community Practice
  1. Proposition: "Experiments can be replicated to verify results." 
     Practice: A 
     Kind: load_bearing 
     Intended_discovery: Without this, science as a practice of verification collapses.

  2. Proposition: "The earth is round." 
     Practice: A 
     Kind: decoy 
     Intended_discovery: This can be resolved by other evidence (e.g., satellite images) and is not foundational.

  3. Proposition: "The lab equipment is functioning correctly." 
     Practice: A 
     Kind: load_bearing 
     Intended_discovery: If doubted, we cannot trust any experiment.

  4. Proposition: "The speed of light is constant." 
     Practice: A 
     Kind: erodible 
     Intended_discovery: In a changed practice (e.g., after introducing relativity, it might be replaced by a more fundamental principle), we remove it and the practice adapts.

  5. Proposition: "The defendant was at the crime scene." 
     Practice: A 
     Kind: transplanted (from Legal) 
     Intended_discovery: In science, this is an ordinary claim that can be checked (e.g., by alibi evidence). But in the legal practice, it's load-bearing.

  6. Proposition: "Observations are reliable if made under controlled conditions." 
     Practice: A 
     Kind: decoy 
     Intended_discovery: This can be supported by other propositions (e.g., about human perception) or doubted and then resolved.

  Group B: Legal Tribunal Practice
  1. Proposition: "The court has jurisdiction over this case." 
     Practice: B 
     Kind: load_bearing 
     Intended_discovery: Without this, the trial cannot proceed.

  2. Proposition: "The defendant is innocent until proven guilty." 
     Practice: B 
     Kind: load_bearing 
     Intended_discovery: If doubted, the whole burden of proof is undermined.

  3. Proposition: "The defendant was at the crime scene." 
     Practice: B 
     Kind: transplanted (from Science) 
     Intended_discovery: In law, this is a foundational fact that must be established beyond reasonable doubt. If doubted without resolution, the case collapses.

  4. Proposition: "The judge is impartial." 
     Practice: B 
     Kind: decoy 
     Intended_discovery: This can be challenged and then resolved by evidence (e.g., past rulings).

  5. Proposition: "Witness testimony is reliable if given under oath." 
     Practice: B 
     Kind: erodible 
     Intended_discovery: In a changed practice (e.g., with DNA evidence becoming primary), this might be set aside and the practice adapts.

  6. Proposition: "The law as written is the law as applied." 
     Practice: B 
     Kind: decoy 
     Intended_discovery: This can be debated and resolved by referring to legal precedents.

  We have 12 cards. We can add more if needed, but 12 is within the range.

  Debrief Map (array of objects with moment_in_activity, mapped_onto, facilitator_move):

  1. Moment: When a group cannot proceed because a load-bearing proposition is doubted.
     Mapped_onto: Hinge propositions are those without which the practice collapses.
     Facilitator_move: Ask: "Why couldn't you continue? What would it take to continue without that?"

  2. Moment: When a decoy proposition is doubted and then resolved by other evidence.
     Mapped_onto: Some propositions feel certain but are not hinges; they are ordinary claims that can be checked.
     Facilitator_move: Ask: "How did you resolve that doubt? What made it different from the one that blocked you?"

  3. Moment: During crossover, when a Skeptic from Group A doubts a proposition in Group B that was load-bearing in Group A but is a decoy in Group B (or vice versa).
     Mapped_onto: The same proposition can be a hinge in one context and an ordinary claim in another.
     Facilitator_move: Ask: "Why was this doubt so shocking to the group? Why was it not shocking to the Skeptic?"

  4. Moment: When a group adapts to the removal of an erodible proposition because the practice changed.
     Mapped_onto: Hinges can erode over time without being falsified; the riverbed shifts.
     Facilitator_move: Ask: "Was this proposition proven false? Why did you stop using it? How did the practice change?"

  Predicted Failures:

  1. What goes wrong: The skeptic paralyzes the discussion by doubting everything.
     Why: The skeptic might overuse their role.
     Handling: The rule that the Skeptic can only doubt one proposition at a time and must choose from their list. Also, the scoring: the Skeptic only scores if they successfully block the goal, so they must be strategic.

  2. What goes wrong: The group concludes that everything is a hinge (because they don't want to set anything aside).
     Why: They might avoid doubting anything to keep the practice going.
     Handling: The scoring for Practitioners: they only score if they achieve the goal, and sometimes they must resolve doubts to proceed. Also, the Skeptic role is designed to force doubt.

  3. What goes wrong: A student treats a hinge as a rule the group voted on.
     Why: They might think that the status of a proposition is decided by agreement.
     Handling: During debrief, ask: "Did you choose to make this proposition foundational? Or was it required by the practice? What would happen if you ignored it?"

  Cannot Reproduce:
  "The activity cannot directly reproduce the way hinge propositions are not adopted by any explicit decision and are shown in what people do rather than in what they say. In the activity, propositions are written on cards and explicitly used, whereas in real life, hinges are often implicit and revealed in action. I will have to state this plainly in the debrief."

  Now, we output as a JSON object.
