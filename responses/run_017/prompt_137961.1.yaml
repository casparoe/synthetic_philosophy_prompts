prompt: |-
  You are a professional philosopher who works on decision theory and risk, and who also writes very good comic prose in a deadpan British-civil-service register. Take your time with this one: before you draft anything, spend a few lines brainstorming (a) the real features of precautionary reasoning you intend to exaggerate and (b) the worked examples you will use to do it. Then write the piece, then add the short cover note I ask for at the end. Write the whole thing in British English.

  The artefact: an internal guidance document, roughly 800 words, from a jurisdiction that has fully implemented the precautionary principle as ordinary administrative law. Title it something like "The Precautionary Compliance (Assessment of Applications) Circular", issued by a body you invent (an Office for Precautionary Compliance, say). Format it as numbered clauses, with an Annex of worked examples and a sidebar. The voice is the voice of a competent, unhurried, entirely sincere civil servant explaining the rules to colleagues; there is no winking, no scare quotes, and nothing in the document may admit that any of it is absurd. The reader should be able to tell what is being ironised purely from the content.

  The legal settings you are writing inside, which the document should take entirely for granted: a threat-of-harm-plus-uncertainty trigger, with the burden of proof shifted onto whoever proposes a course of action; a doctrine of non-comparison, under which an application may not be assessed against the risks of refusing it, since each proposal must stand on its own; and a continuation rule, under which the status quo is itself an application that must be periodically renewed on the same terms as any innovation.

  I read LessWrong and the old SSC/ACX comment sections, so I have seen the line about the principle forbidding itself a thousand times. Don't just repeat it — earn it by building it into the machinery. What I want is for the jokes to come from getting the epistemology and the decision theory right, so that someone who actually works on this laughs rather than winces. In particular the document should quietly exhibit, without ever naming them as objections:

  - that any nonzero suspicion satisfies the trigger, so the class of applications is closed under everything;
  - that without a comparative clause the principle is unactionable rather than conservative, since refusal is also a course of action with an evidence gap;
  - that the "relevant alternative" is up for grabs — refusing the paediatric medicine is a decision about the medicine, or about the fever, or about the older medicine, depending on how you slice the counterfactual;
  - that shifting the burden of proof is not the neutral procedural tweak it looks like, once the proponent's evidence is by stipulation never sufficient;
  - that precaution applies to the precautionary measures themselves, giving you a regress the document must handle procedurally (a sub-clause on "measures required to mitigate the mitigations" would be welcome);
  - and the ratchet: once the continuation rule bites, the Office eventually has to apply to itself for permission to go on issuing Circulars. Please let the document reach that point on its own steam and treat it as routine.

  Use at least four worked examples and make them concrete and ordinary rather than sci-fi: a new medicine for children's fevers; the incumbent medicine's periodic continuation review; an application from the Office's own estates team to fell a rotten tree on the forecourt; something from a village fete; and an application from the Office's caterers about the coffee. Give each a decision and a one-line reason, in the register of a real adjudication.

  After the Circular, add a cover note of no more than 120 words, addressed to me, listing which real features of precautionary reasoning you exaggerated and which you left alone. I am building a set of these and I want to be able to check that the satire is fair: a specialist should recognise the target as their own view, not a strawman with the serial numbers filed off.
