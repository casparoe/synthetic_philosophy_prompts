prompt: |-
  Hey — I'm putting together a handout for my second-year normative theory seminar, the week we do supererogation, and I've decided I'd rather give them a fake internal document than another paper. Could you write it?

  Format: an internal people-ops document from a mid-sized company — make one up — that has just added a fifth rating tier, "Beyond the Call," to its performance rubric, and made that tier a precondition for promotion. Numbered clauses, maybe 700–900 words, then a short FAQ, and a one-paragraph "calibration note" from the compensation committee at the end. Deadpan corporate voice throughout: no winking, no punchlines that sound like a comedian wrote them, nothing that breaks character to tell the reader this is a joke.

  The humour has to come from the actual conceptual trouble, though. Things I'd like it to land, and feel free to add your own:

  - The second a tier is required for promotion, the acts in it aren't beyond the call any more. The document should half-notice this and patch it with something worse.
  - The company's own ethics training says to always do the most good you can. Take that seriously: on that standard nothing is optional, so there shouldn't be a supererogation tier at all. Let the document notice this in a footnote and carry on regardless.
  - There should be a clause denying credit for acts done with an eye to the rating — and it should be obvious that the clause is both unavoidable and impossible to audit.
  - Something on cost to the agent. If what makes an act supererogatory is partly that it costs the person something, then employees can farm the rating by making their acts expensive, and the company ends up grading how much something hurt instead of what was done. I'd love and "evidence of personal sacrifice" attachment.
  - A case I made up last year and still can't resolve: a team does something no member was required to do, but no individual's share was more than anyone could reasonably have been asked for. Does the team get the tier? Whatever the document decides, I want the answer to sound completely sane in corporate and completely mad in the seminar room.

  It's fine — maybe better — if the last clause quietly gives up and admits the tier exists because they needed a top bucket and "Exceeds Expectations" wasn't doing the work any more. I want my students to laugh, and then be unable to say whether the company has abolished supererogation or just demonstrated that it was never there.
reasoning: |-
  Okay, the user is teaching a normative theory seminar and wants a creative handout on supererogation. Instead of a traditional paper, they're requesting a fictional corporate document that illustrates conceptual tensions through deadpan bureaucracy. 

  Hmm, the challenge is balancing academic rigor with corporate parody. The user listed very specific pain points: the paradox of requiring "beyond the call" acts for promotion, the conflict with utilitarian ethics training, the unenforceable ban on calculative behavior, the perverse incentive to manufacture personal sacrifice, and the team effort dilemma. 

  First, I'll invent a blandly named company - "Vertex Solutions" sounds plausibly generic. The document needs to feel authentic, so I'm thinking: boilerplate header, numbered clauses with subsections, passive-aggressive footnotes. The tone must stay clinically corporate while screaming philosophical absurdity. 

  For the promotion paradox, I'll have Clause 3.1 openly acknowledge that "Beyond the Call" becomes mandatory, then "solve" it by redefining supererogation as... discretionary effort beyond the new mandatory baseline. That's beautifully circular. 

  The ethics training contradiction deserves a footnote (4.3). The deflection - "contextual interpretation" - should sound reasonable to HR and deranged to philosophers. Perfect. 

  The un-auditable "no credit for calculative action" clause (5.2) writes itself. Burying it under "Evidence Guidelines" makes it seem procedural while being obviously unenforceable. 

  Personal sacrifice metrics? An Attachment A listing "documented hardship" with examples like missed vacations. The more trivial the proof, the sharper the critique of reducing moral worth to suffering. 

  The team case (Clause 7) is delicious. Have the policy say "no collective eligibility" while admitting individuals contributed "non-excessive" shares. Students will spot how this makes supererogation vanish through distributed action. 

  End with a calibration note admitting inflation forced the new tier. That final shrug - "maintains motivational integrity" - should leave students questioning if supererogation was ever coherent to begin with. 

  Word count... 850 for clauses, plus FAQ and note. Using terms like "calibration" and "rubric" maintains the HR veneer. No jokes - the humor must bleed from the policy's internal contradictions. 

  The user's last request is key: the document should feel like it accidentally disproved supererogation while thinking it's just fixing compensation. That's the golden zone.
answer: |-
  **VERTEX SOLUTIONS INC.**  
  **INTERNAL POLICY: PERFORMANCE MANAGEMENT REFINEMENT**  
  **Effective Date: October 26, 2024**  
  **Document Ref: HR-POL-047 Rev. 3**  

  **1. Purpose**  
  To enhance the precision and motivational impact of Vertex Solutions’ performance evaluation framework, a fifth rating tier, "Beyond the Call" (BTC), has been formally integrated into the Performance Rubric (Attachment B). This tier recognizes exceptional contributions demonstrably exceeding role expectations and core ethical mandates. Effective immediately, achieving a BTC rating in at least one performance cycle is a mandatory precondition for eligibility for promotion to Tier 3 (Senior Specialist) and above.  

  **2. Definition of "Beyond the Call" (BTC)**  
  2.1. The BTC tier designates actions or sustained contributions that:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Significantly advance Vertex Solutions’ strategic objectives or core values;  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Fall demonstrably *outside* the scope of an employee’s defined role responsibilities, core goals (KRAs), and fundamental ethical obligations as outlined in the Vertex Code of Conduct (V-COC-001);  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) Are undertaken voluntarily, without direct instruction or reasonable expectation;  
  &nbsp;&nbsp;&nbsp;&nbsp;(d) Involve a material personal commitment or sacrifice by the employee (refer to Attachment A: Evidence of Personal Sacrifice).  
  2.2. BTC acts are characterized by their exceptional nature and material impact. Routine excellence in core duties remains captured under "Exceeds Expectations."  

  **3. BTC as a Promotion Precondition**  
  3.1. Recognition of BTC-level contribution is essential for leadership potential. Consequently, documented evidence of at least one BTC-rated achievement within the prior 24-month period is now mandatory for promotion consideration to Tier 3+ roles.  
  3.2. **Clarification on Mandatory Nature:** While the *achievement* of a BTC rating is required for promotion eligibility, the *specific actions* constituting BTC remain inherently discretionary and non-compulsory. Employees retain agency in identifying and pursuing such opportunities for exceptional contribution. The requirement acknowledges the *demonstrated capability* for this level of impact, not a compulsory checklist of actions^(1).  

  **4. Relationship to Ethical Obligations**  
  4.1. The BTC tier exists *beyond* the baseline ethical requirements mandated by the V-COC-001 and reinforced in Ethics & Compliance Training (ECT-202).  
  4.2. Actions fulfilling core ethical duties (e.g., reporting violations, treating colleagues fairly) are essential but do not qualify for BTC. These are foundational expectations.  
  4.3. **Training Alignment Note:** ECT-202 Principle 4 ("Strive to Maximize Positive Impact") establishes a high ethical standard. The BTC tier specifically recognizes contributions that extend *beyond* this universal ethical imperative^(2).  

  **5. Evidence & Documentation Requirements**  
  5.1. Managers nominating an employee for a BTC rating must submit a detailed justification via Form HR-F-112BTC, including:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Specific description of the action(s);  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Quantifiable or observable business impact;  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) Clear rationale demonstrating how the action(s) exceeded defined role responsibilities and core ethical mandates;  
  &nbsp;&nbsp;&nbsp;&nbsp;(d) Documentation per Attachment A (Evidence of Personal Sacrifice).  
  5.2. **Intent & Motivation:** Credit for BTC requires the action to stem from genuine commitment to Vertex's values or mission. Acts primarily undertaken *with the explicit goal of attaining a BTC rating or promotion* are ineligible^(3). Managerial assessment of intent is required per Section 5.1.c.  

  **6. Team-Based Contributions**  
  6.1. BTC is an individual rating. Team achievements, while valuable, do not automatically confer BTC status on individual members.  
  6.2. An individual may be nominated for BTC based on their unique contribution *within* a team effort only if:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Their specific actions demonstrably met the BTC criteria (Sections 2.1, 2.2);  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Their contribution involved a level of personal commitment or sacrifice clearly exceeding the reasonable expectations placed upon *any* team member in that context;  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) The nomination focuses solely on the individual's discrete actions and impact.  
  6.3. Simply participating in a successful team project where the *collective* outcome was exceptional, but no single member's contribution exceeded reasonable individual expectations, does not qualify any individual for BTC.  

  **7. Calibration & Review**  
  7.1. BTC nominations are subject to rigorous calibration by the People Leadership Committee (PLC) to ensure consistency and adherence to the defined criteria.  
  7.2. The threshold for BTC is intentionally high. Not all high performers will receive this rating in a given cycle.  

  ---

  **FREQUENTLY ASKED QUESTIONS (FAQ)**

  **Q1: If BTC is required for promotion, doesn’t that make it part of the job?**  
  A1: No. The requirement pertains to *demonstrating the capability* for exceptional, discretionary impact. The *opportunity* and *choice* to pursue actions qualifying as BTC remain entirely voluntary and non-compulsory. The role itself does not change.

  **Q2: How do I prove "personal sacrifice" (Attachment A)?**  
  A2: Attachment A provides illustrative examples: significant personal time investment beyond standard expectations (e.g., documented late nights/weekends impacting personal commitments), foregoing planned leave for critical discretionary contributions, or absorbing unusual personal expense/cost. Documentation should be factual (e.g., calendar entries showing rescheduled personal appointments, emails deferring vacation approval).

  **Q3: Can I suggest a project I think would qualify me for BTC?**  
  A3: You are encouraged to propose initiatives aligned with business goals. However, proactively framing a project *primarily* to seek BTC status may jeopardize eligibility per Section 5.2. Focus on the business impact and value.

  **Q4: Our team pulled off an amazing project under huge pressure. Why doesn't that count for BTC?**  
  A4: Team success is vital and recognized under "Exceeds Expectations." BTC requires demonstrating *individual* action that went *beyond* what any reasonable team member could have been expected to contribute in that situation (Section 6.2). Nominate specific individuals if their unique contribution meets this bar.

  ---

  **CALIBRATION NOTE FROM THE COMPENSATION COMMITTEE**  
  *November 1, 2024*  
  The introduction of the "Beyond the Call" tier addresses critical calibration drift within the "Exceeds Expectations" category. Analysis revealed this tier had become overly broad, capturing both high performance of core duties and genuinely exceptional discretionary contributions, diluting its motivational and differentiation value. Establishing BTC as a distinct, high-threshold tier, linked to senior promotion eligibility, restores necessary granularity to the performance spectrum. This ensures "Exceeds Expectations" accurately reflects strong performance within role parameters, while BTC provides a clear, aspirational pathway for sustained, exceptional impact beyond foundational expectations. This structure maintains motivational integrity and sharpens talent identification.

  ---

  **ATTACHMENT A: EVIDENCE OF PERSONAL SACRIFICE**  
  *(Examples for illustrative purposes)*  
  *   Documented deferral/cancellation of approved personal leave (PTO) specifically due to undertaking the discretionary activity.  
  *   Significant, documented time investment outside standard working hours (e.g., >15 additional hours/week sustained over project duration), impacting verifiable personal commitments.  
  *   Absorption of unusual, documented personal financial costs directly related to the activity (requires prior mgmt. approval for reimbursement eligibility assessment).  
  *   Formal postponement of scheduled professional development or career milestone activities.  
  *   *Note: Routine workload fluctuations or standard overtime do not qualify.*

  ---
  **FOOTNOTES**  
  ^(1) This distinction ensures the *opportunity* for discretionary action remains non-compulsory, while recognizing that *demonstrated capability* for such impact is a legitimate requirement for senior roles.  
  ^(2) Principle 4 establishes a universal expectation to maximize positive impact within one's role and ethical boundaries. BTC actions represent a *quantum leap* beyond this baseline, into discretionary domains *outside* the employee's mandated scope.  
  ^(3) This ensures the integrity of the BTC designation, recognizing only actions driven by authentic commitment rather than instrumental career calculation. Managers will assess narrative and contextual cues within the justification.

  ---
