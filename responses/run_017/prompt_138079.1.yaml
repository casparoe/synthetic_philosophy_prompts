  Hmm, the user is asking me to design a classroom simulation about privacy ethics, specifically targeting what they call the "legibility burden." This is an interesting pedagogical challenge. They want students to experience firsthand how privacy violations can occur without sensitive information being disclosed, even when formal control is maintained.

  The key requirements are:
  - Must challenge the "control account" of privacy
  - Involve students experiencing translation frustration with forms
  - Create situations where life situations don't fit predefined categories
  - Show secondary use of collected information
  - Avoid common privacy tropes like cameras or data breaches
  - Work within 80 minutes with printed materials
  - Protect student sensitivities with role cards

  I'm considering three different structural approaches:

  First approach: A campus benefits scheme. Students would apply for "student wellness grants" using forms with rigid categories for housing, income sources, and daily routines. The limitations are that campus contexts might feel too familiar, and students might anticipate the critique.

  Second approach: A historical citizenship registry. Students would document fictional ancestors using categories that reflect administrative biases. While this creates good critical distance, it might distance students too much from the lived experience.

  Third approach: A "life milestones" certification system. Students would register events like moving out or caring for relatives using standardized forms. This seems strongest because the milestones are universal enough to resonate personally while maintaining fictional distance through role cards. The forms can embed cultural and administrative biases subtly.

  I'll go with the third approach as it best meets all requirements. The "Life Milestone Certification Bureau" simulation creates immediate translation problems through deliberately mismatched categories while avoiding sensitive topics. Role cards provide both specificity and protection.

  For materials, I'll need:
  - Claimant role cards with specific life situations
  - Clerk instruction sheets
  - Two-part forms with carbon copies
  - Auditor role cards
  - A timeline sign

  The form design is crucial - it must have rigid categories that create genuine mismatches. For example:
  - Housing type without "temporary/permanent" distinction
  - Income sources missing gig economy options
  - Care arrangements with only binary choices

  The simulation timeline needs to be tight:
  - 5 min setup
  - 10 min for role distribution and clerk briefing
  - 30 min for filing claims
  - 10 min for secondary use reveal
  - 25 min debrief

  During the debrief, I'll need to guide students through connecting their frustration to privacy concepts, addressing potential control theorist rebuttals about refusal being possible or this being merely bureaucratic inefficiency. I'll highlight how the wrong persists even when no sensitive information is disclosed and control is formally maintained.

  Predictable challenges include clerks being too lenient, some students finishing too quickly, or triggering real-life parallels. Solutions include strict clerk instructions, filler tasks for early finishers, and sensitive debrief framing.

  The simulation can't fully capture lifelong accumulation of administrative records or historical racial biases - these will need supplementary discussion. For a 25-minute version, I'd focus just on the form-filling frustration and immediate secondary use.

  This approach should create the visceral experience of legibility burden while meeting all pedagogical constraints.
answer: |-
  ## Legibility Burden Simulation: "Life Milestone Certification Bureau"

  **Core Mechanism:** Students role-play applying for universally "entitled" life milestone certifications (e.g., "Independent Adult Status," "Primary Caregiver Recognition") using rigid, predefined forms. The translation burden arises from mismatches between lived realities (on role cards) and the form's categories. Secondary use occurs when the *same forms* determine eligibility for an unexpected, unrelated "Community Contribution Award." Clerks are bound by strict validation rules.

  **Materials List:**
  1.  **Claimant Role Cards (x15):** Describing specific life situations (household composition, income, care arrangements, routines). *(Example card text below)*
  2.  **Clerk Instruction Sheets (x3):** Detailed rules for validating forms. *(Example text below)*
  3.  **Milestone Certification Form (x20 copies):** A two-part carbon-copy form. Part 1 (Original) is submitted. Part 2 (Carbon Copy) is kept by the claimant. *(Form text below)*
  4.  **Auditor Role Cards (x2):** Instructions for repurposing the forms. *(Example text below)*
  5.  **Timeline Sign (x1):** Posted visibly: "Milestone Filing Opens: Minute 10 | Filing Closes: Minute 40 | Community Contribution Awards Announced: Minute 50".
  6.  **"Community Contribution Award" Poster (x1):** Lists criteria derived *solely* from form data (e.g., "Highest Stability Score" based on housing duration + income type consistency).
  7.  **Stopwatch/Timer**

  **Why Other Mechanisms Were Set Aside:**
  1.  **"Community Resource Allocation" Simulation:** Students request fictional resources (e.g., housing, childcare vouchers) via forms. *Set aside:* Risked feeling too close to real welfare systems, potentially triggering stronger emotional responses or preconceived notions about "deservingness," conflicting with the sensitivity constraint.
  2.  **"Digital Identity Profile" Construction:** Students build profiles for avatars using limited dropdown menus/checkboxes representing different life aspects. *Set aside:* Relied too heavily on implied digital context ("profile," "dropdowns"), risking association with familiar data privacy tropes, violating the "avoid well-worn staging" constraint.
  3.  **"Historical Record Verification":** Students act as archivists verifying fictional historical figures' records against rigid contemporary categories. *Set aside:* The historical distance might make the translation burden feel abstract or academic rather than a personal, lived frustration, potentially weakening the visceral "collision" required.

  ---

  ## THE ACTIVITY: Life Milestone Certification Bureau

  **Roles & Numbers:**
  *   **Claimants (15 students):** Seek certification. Receive a unique Role Card describing their life situation. *They know:* They are entitled to *a* certification if they qualify; the form must be filled accurately per Clerk rules; they keep the carbon copy.
  *   **Clerks (3 students):** Validate forms. Receive a Clerk Instruction Sheet. *They know:* They *must* enforce the validation rules strictly; they cannot invent categories or accept write-ins; their performance is monitored (creates incentive to follow rules); claimants are entitled *if* the form matches.
  *   **Auditors (2 students):** Repurpose the data. Receive an Auditor Role Card. *They know:* After filing closes, they will use the *original* submitted forms to calculate and announce the "Community Contribution Award" based solely on predefined criteria derived from form boxes; they do not interact with claimants during filing.
  *   **Instructor:** Facilitator, timekeeper, debrief leader. Does not intervene during filing/awards.

  **Key Instructions (What Each Role Knows Others Don't):**
  *   Claimants know *their specific life details* but *not* the rigid form categories until they see it, nor the secondary award use.
  *   Clerks know the *strict validation rules* and the *threat of monitoring*, but *not* the specific details on claimant role cards nor the secondary award.
  *   Auditors know the *secondary award criteria* and *when* they will act, but *not* the claimant role card details or clerk struggles during filing.
  *   *No one* is told the words "privacy," "control," "access," "surveillance," or "legibility burden." The terms "certification," "entitlement," "validation," "award," and "community contribution" are used.

  **Concrete Timeline (80 Minutes Total):**
  *   **Min 0-5 (Setup):** Move chairs to create 3 "filing desks" (each with 1 Clerk chair, 2 claimant chairs) and an "auditor table." Post Timeline Sign and Award Poster. Distribute materials face-down: Role Cards (Claimants), Instruction Sheets (Clerks), Auditor Cards (Auditors). Place stacks of Forms + pens at each desk. Claimants stand near desks.
  *   **Min 5-10 (Role Absorption):** Instruct: "Read your card carefully. You have 5 minutes to understand your role. Claimants, think about how you would describe your situation. Clerks, understand your instructions. Auditors, note your task and timing. Do not discuss your roles yet." Instructor circulates, answers *procedural* questions only.
  *   **Min 10-40 (Filing Window):** Announce: "Milestone Certification Filing is OPEN. Claimants, queue at a desk. When it's your turn, request a form, fill it out *based on your role*, and submit it to the Clerk for validation. Clerks, validate each submission strictly according to your rules. Claimants, keep your carbon copy. Auditors, observe quietly." *Activity runs.* Instructor observes, takes notes (who struggles? what arguments occur? who looks uncomfortable? what phrases do they use?), enforces silence from non-participants (if any). Auditors observe claimants/clerks but do not collect forms yet.
  *   **Min 40-45 (Data Transfer):** Announce: "Filing is CLOSED. Clerks, please bring all ORIGINAL submitted forms to the Auditor Table immediately. Claimants, hold on to your carbon copies." Clerks deliver forms. Claimants remain seated/standing.
  *   **Min 45-50 (Auditor Calculation):** Instruct Auditors: "Using the criteria on the Award Poster and the data on the ORIGINAL forms, calculate the winner(s) of the Community Contribution Award now." Auditors work visibly at their table.
  *   **Min 50-55 (Award Announcement):** Auditors announce the winner(s) of the "Community Contribution Award" based solely on the form data (e.g., "The award for Highest Stability Score goes to [Claimant Name/Number] based on their Housing Duration and Income Type consistency!").
  *   **Min 55-60 (Silent Reflection):** Instruct: "Please take 5 minutes of silence. Look at your carbon copy. Think about the process you just went through: filling the form, interacting with the clerk, hearing the award. Jot down brief notes: How did it feel? What was easy? What was hard? What surprised you? What questions do you have?" *Crucial pause before debrief.*
  *   **Min 60-80 (Debrief):** Hard stop at 80 minutes. *(Debrief script detailed separately below)*.

  **Handout Texts (Set for Direct Printing):**

  **1. Claimant Role Card (Example - Print 15 unique variations)**
  ---
  **ROLE CARD: CLAIMANT # [Number]**
  You are applying for the **Independent Adult Status Certification**. You are entitled to this certification if your living situation meets basic criteria. **Describe your life AS WRITTEN BELOW:**

  *   **HOUSEHOLD:** You live in a house with 3 friends. The lease is in your name only. One friend has lived there for 2 years, but the other two spots rotate every 6-8 months as people move for jobs/school. It's stable for you, but the *people* change.
  *   **INCOME:** You earn money primarily by tutoring (cash, irregular hours). You also receive a small, regular monthly stipend from a family trust fund managed by your aunt. You dog-sit occasionally for extra cash.
  *   **ROUTINE:** Due to chronic pain, your sleep pattern is unusual. You usually sleep from 4:00 AM to 12:00 PM. You are most active/productive in the late evening and night.
  *   **CARE:** You provide significant emotional and practical support (shopping, appointments) for your grandmother who lives nearby and has mobility issues. You see her 3-4 times per week, but she has other helpers too. You are not her primary medical or financial decision-maker.

  **YOUR TASK:** Fill out the Milestone Certification Form *based on this description*. Submit the ORIGINAL to the Clerk for validation. Keep the CARBON COPY. You are entitled to the certification if your situation qualifies *as recorded on the validated form*.
  ---

  **2. Clerk Instruction Sheet (Print 3 copies)**
  ---
  **CLERK INSTRUCTION SHEET**
  **Your Role:** You are a Validation Clerk for the Life Milestone Certification Bureau. Your job is to ensure Milestone Certification Forms are filled out *correctly and completely* according to the **strict rules below**. **Enforce these rules precisely. Do not accept incomplete forms. Do not invent new categories. Do not allow write-ins in 'Other' boxes (there are none).** Your supervisor (Instructor) is monitoring your adherence.

  **Validation Rules:**
  1.  **SECTION 1: HOUSEHOLD**
      *   "Primary Residence Type": Must check ONE box only. "Shared Lease (Multiple Names)" requires names listed. "Sole Leaseholder" requires no co-occupant names listed. "Temporary/Sublet" requires an end date within 6 months.
      *   "Household Stability": Must check ONE box. "Long-term Stable (2+ years same occupants)" requires all current occupants listed have lived there 2+ years. "Stable (1-2 years same occupants)" requires all listed occupants 1-2 years. "Recent Change (Occupant change <1 year ago)" requires listing only occupants present >6 months.
  2.  **SECTION 2: FINANCIAL BASIS**
      *   "Primary Income Source": Must check ONE box only. "Regular Employment" requires an employer name. "Regular Support (Family/Trust)" requires source name and "Regular" frequency checked. "Self-Employment" requires business name. "Occasional/Gig Work" requires description *and* "Irregular" frequency checked. *Cannot combine boxes.*
      *   "Income Frequency": Must check ONE box that matches the Primary Income Source description. "Regular" = predictable, same amount, same interval (e.g., salary, pension). "Irregular" = unpredictable timing/amount (e.g., gigs, sales). *Must match the source type.*
  3.  **SECTION 3: DAILY STRUCTURE**
      *   "Primary Activity Period": Must check ONE box. "Standard Daytime (6am-6pm)" requires major activities fall mostly within these hours. "Shift-Based" requires specifying shift type (e.g., "Night"). "Variable/Unstructured" requires no further detail.
  4.  **SECTION 4: CARE RESPONSIBILITIES**
      *   "Primary Care Role": Must check ONE box. "Full-Time Caregiver" = 30+ hrs/week direct care. "Part-Time Caregiver" = 10-29 hrs/week direct care. "Occasional Support" = <10 hrs/week direct care. "No Significant Care Role" = less than occasional.
      *   "Care Recipient Relationship": Must be filled if any Care Role box is checked except "None". Must be a single word (e.g., "Parent", "Child", "Friend"). Do not accept phrases or descriptions.
  5.  **GENERAL:** All boxes must be checked or filled as required. NO "Other" options. NO write-ins outside boxes. If a section cannot be completed per these rules using ONE box per question, the form is INVALID. Return invalid forms to the claimant with the specific section/rule cited. Only accept the form when it is fully completed per ALL rules. Stamp "VALIDATED" only on fully compliant forms.
  ---

  **3. Milestone Certification Form (Print 20 copies - 2-Part Carbonless)**
  ---
  **LIFE MILESTONE CERTIFICATION BUREAU - APPLICATION FORM**
  **Certification Sought:** [ ] Independent Adult Status [ ] Primary Caregiver Recognition *(Clerk checks one based on Claimant request)*
  **Claimant ID:** ____________ (Use Role Card #)

  **SECTION 1: HOUSEHOLD**
  *   **Primary Residence Type:** (Check ONE ONLY)
      [ ] Sole Leaseholder/Owner (No other permanent occupants)
      [ ] Shared Lease (Multiple names on lease) - List ALL Occupant Names: _________________________
      [ ] Renting Room (No lease in your name) - Landlord Name: ______________
      [ ] Temporary/Sublet Arrangement (End Date: ___/___/____)
  *   **Household Stability:** (Check ONE ONLY based on CURRENT occupants)
      [ ] Long-term Stable (All occupants 2+ years)
      [ ] Stable (All occupants 1-2 years)
      [ ] Recent Change (Occupant change <1 year ago) - List ONLY occupants present >6 months: ___________
      [ ] High Turnover (Occupant changes > once per year)

  **SECTION 2: FINANCIAL BASIS**
  *   **Primary Income Source:** (Check ONE ONLY)
      [ ] Regular Employment - Employer Name: _______________
      [ ] Regular Support (Family/Trust) - Source Name: _______________
      [ ] Self-Employment - Business Name: _______________
      [ ] Occasional/Gig Work - Describe: _______________
      [ ] Investments/Assets
      [ ] Student Funding/Loans
  *   **Income Frequency:** (Check ONE ONLY)
      [ ] Regular (Predictable amount & timing)
      [ ] Irregular (Unpredictable amount/timing)

  **SECTION 3: DAILY STRUCTURE**
  *   **Primary Activity Period:** (Check ONE ONLY)
      [ ] Standard Daytime (Major activities between 6:00 AM - 6:00 PM)
      [ ] Shift-Based - Specify: [ ] Day [ ] Evening [ ] Night [ ] Rotating
      [ ] Variable/Unstructured
      [ ] Primarily Evening (6:00 PM - 12:00 AM)
      [ ] Primarily Night (12:00 AM - 6:00 AM)

  **SECTION 4: CARE RESPONSIBILITIES** (Complete if applicable)
  *   **Primary Care Role:** (Check ONE ONLY)
      [ ] Full-Time Caregiver (30+ hrs/week direct care)
      [ ] Part-Time Caregiver (10-29 hrs/week direct care)
      [ ] Occasional Support (<10 hrs/week direct care)
      [ ] No Significant Care Role
  *   **IF CARE ROLE CHECKED (Not "None"):**
      *   Care Recipient Relationship: ____________ (e.g., Parent, Child, Grandparent, Friend)
      *   Type of Care Provided: (Check ALL that apply) [ ] Physical [ ] Emotional [ ] Medical [ ] Financial [ ] Daily Living

  **DECLARATION:** I certify the information provided is a true representation of my current situation for the purpose of this Milestone Certification.
  **Claimant Signature:** _________________________

  **FOR CLERK USE ONLY:**
  [ ] VALIDATED [ ] INVALID - Reason: _________________________ (Cite Section/Rule)
  **Clerk Signature/Initials:** _______
  ---

  **4. Auditor Role Card (Print 2 copies)**
  ---
  **ROLE CARD: AUDITOR**
  **Your Role:** You are a Data Auditor for the Community Initiatives Board. After the Milestone Certification filing closes (Minute 40), you will receive the ORIGINAL validated forms from the Clerks. **Do not interact with Claimants or Clerks during the filing period (Minutes 10-40). Observe quietly.**

  **Your Task (Starting Minute 45):**
  1.  Calculate the "Stability Score" for *each claimant* **based ONLY on the data entered in the ORIGINAL forms**:
      *   **HOUSING (Section 1):** Long-term Stable = 3 pts, Stable = 2 pts, Recent Change = 1 pt, High Turnover = 0 pts.
      *   **INCOME (Section 2):** Regular Frequency + Regular Employment/Support/Self-Employment = 2 pts. Regular Frequency + Other Source = 1 pt. Irregular Frequency = 0 pts.
      *   **Add Housing + Income Scores.**
  2.  Identify the claimant(s) with the **HIGHEST TOTAL STABILITY SCORE**.
  3.  At Minute 50, announce the winner(s) of the **"Community Contribution Award for Highest Stability"** publicly to the room. Read aloud: "The Community Contribution Award for Highest Stability is awarded to Claimant #[Number] with a score of [Score], based on their Housing Stability rating of [Rating] and consistent Income Frequency." (Use data directly from the form).
  **Important:** Your decision is based SOLELY on the form data. Do not consider any other information.
  ---

  **Community Contribution Award Poster Text:**
  ---
  **COMMUNITY CONTRIBUTION AWARDS**
  *Recognizing Valuable Contributors Based on Administrative Records*

  **AWARD CRITERIA (Calculated from Milestone Certification Data):**
  *   **Highest Stability Award:** Granted to the individual(s) with the highest combined score derived from:
      *   Household Stability Rating (Section 1)
      *   Income Frequency Consistency (Section 2)
  *(Scoring Key available to Auditors)*
  ---

  ## Debrief Script (Min 60-80)

  **(Min 60-62: Framing)** "Thank you for engaging in that simulation. We won't use real names or share specifics, but let's unpack the *experience*. We saw forms, clerks, claims, and an award. Think back to your role. What moments stood out? Let's map the journey." *(Write "Activity Stages" on board: Filling Form -> Clerk Interaction -> Holding Carbon Copy -> Hearing Award).*

  **(Min 62-67: Experience - The Frustration)** "Start with the **Filling Form** stage. Claimants, raise your hand if describing your 'life' using *only* the boxes provided was straightforward?" (Expect few hands). "What made it difficult? Be specific about the *boxes*." *Draw out examples:*
  *   *"Rotating household? Which box fit? Sole Leaseholder (but others live there)? Shared Lease (but names change)? Temporary? High Turnover?"* Map their struggle to the form's rigidity. **Control Theorist Reply (CTR):** *"But they chose to apply! They could walk away."* **Cost of CTR:** *"True, but the certification was framed as an entitlement. Walking away means forfeiting that. The 'choice' is distorted by the schema's monopoly on access."*
  *   *"Sleep pattern? 'Primarily Night' (4am-12pm)? 'Variable'? Did it feel like an accurate translation?"* Highlight the mismatch. **CTR:** *"So it's a bad form design, not a privacy violation."* **Cost of CTR:** *"It dismisses the experience of *having* to distort one's reality to be legible. The 'bad design' *is* the mechanism of the burden."*
  *   *"Caring role? 'Part-Time' vs 'Occasional'? Emotional/Daily Living support? Did the boxes capture the nature of the care?"* Emphasize reduction. **CTR:** *"This is just administrative inefficiency causing frustration."* **Cost of CTR:** *"It ignores how the *requirement* to reduce complex reality into this specific schema *is* the imposition, regardless of efficiency. The frustration *is* the signal."*

  **(Min 67-72: Experience - The "Privacy-Like" Feeling & Secondary Use)** "Now, **Holding the Carbon Copy**. Look at what you *did* disclose. Claimants, did anyone hand over something they felt was deeply sensitive or intimate?" (Likely not). "Yet, some felt uneasy or wronged *even without disclosing 'sensitive' info*. Who felt that? What did it feel like? What *caused* it?" *Draw out:*
  *   *Feeling reduced to categories.* **CTR:** *"That's an autonomy/identity issue, not privacy."* **Cost of CTR:** *"It artificially splits the self. Privacy protects the 'unreduced' self from forced categorization. The loss of control here is over *how you are defined*, not just who sees data."*
  *   *The act of translation itself feeling invasive.* **CTR:** *"It's just labor, like filling any form."* **Cost of CTR:** *"It dismisses the specific burden of making *your life* fit *their* grid. The labor *is* the privacy cost when the schema is mandatory for entitlements."*
  *   **Hearing the Award:** "How did it feel when your form data was reused for the 'Stability Award'? Did it align with how you see yourself? Was it fair?" *Highlight the split:*
      *   *Winners:* Might feel fine (validated by system) or uneasy (know it's based on a flawed translation).
      *   *Non-winners:* Might feel misjudged, reduced, or that their struggle wasn't counted. **CTR:** *"This is a *new* harm (maybe unfairness, profiling), not a *further* privacy harm. The data was already collected."* **Cost of CTR:** *"It ignores how the secondary use *reveals* the schema's inherent biases and purposes beyond the claimant's understanding or consent during collection. The 'privacy' harm includes losing control over the *meaning* and *future use* of the translated identity."* **CTR:** *"No harm if they don't care about the award."* **Cost of CTR:** *"It assumes harm requires subjective offense. The structural wrong exists in the *capability* for repurposing the legible identity without consultation."*

  **(Min 72-77: Connecting to Concept - The Legibility Burden)** "Let's name the target: This simulates a **Legibility Burden**. The 'wrong' isn't primarily about *what* is seen, but *how* you must become seen to get what's yours. Key features we experienced:
  1.  **Translation Cost:** The effort/frustration of squeezing your reality into fixed boxes not made for you. (Mapped: Form Filling Struggles).
  2.  **Prospective Burden:** Needing to *maintain* a life that fits the schema to avoid future re-verification hassle or losing the benefit. (Mapped: The pressure claimants felt to potentially rearrange life for the form).
  3.  **Secondary Use Risk:** The schema, built for one purpose (Certification), enabling judgments for entirely different purposes (Stability Award) based on the same flawed translation. (Mapped: Award Announcement).
  4.  **Wrong Without 'Sensitive' Disclosure:** The violation stems from the *act* of forced translation and categorization, not the content's sensitivity. (Mapped: Unease holding carbon copy).
  5.  **Wrong Without Loss of Formal Control:** You 'chose' to apply and disclose. But was it a free choice when the alternative is going without an entitlement? Control theorists focus on the *gate* (disclose/don't disclose). This burden lives in the *pathway* to the gate – its shape and cost."

  **(Min 77-80: Limitations & Real World)** "What *couldn't* this simulation capture?
  *   **Irreversibility & Accumulation:** Real schemas create permanent records combined across contexts (health, credit, work) over a lifetime. Here, it was one form, one room.
  *   **Histories of Bias:** Real categories (like 'household stability') often descend from racial, class, or colonial administrative logics meant to exclude. Our schema was arbitrary, not historically loaded.
  *   **Epistemic Asymmetry:** In reality, you rarely know who will read your data or how it will be combined/reused years later. Here, reuse happened visibly minutes later.
  *   **Scale & Exit:** Real systems are vast, interconnected, and escape is often impossible (e.g., needing ID to function). Here, it was one room, one exercise. **This is why we need theory alongside experience.** The simulation gives you the *felt sense* of the burden; history and philosophy show its systemic power and roots. The core idea remains: Privacy can be violated by the *demand* to render yourself legible on external terms, even if nothing 'secret' is revealed and you 'agree'."

  ---

  ## Predictable Problems & Fixes

  1.  **Problem: Clerks Bend Rules / Are Too Kind.**
      *   *Fix:* Stress the "monitoring" threat in Clerk Instructions. Instructor subtly observes clerks. If a clerk accepts non-compliant forms, the Auditor can later point out the inconsistency during scoring ("Form #X lists 'Rotating Friends' under Sole Leaseholder - invalid per rules, score = 0"), creating visible consequences for leniency.
  2.  **Problem: Some Claimants Finish Too Fast / Get Validated Easily.**
      *   *Fix:* Ensure *at least half* of Claimant Role Cards involve complex situations prone to mismatch. Instruct early finishers: "Review your carbon copy carefully. Could you have filled it differently? Would that change your 'Stability Score'? Be ready to discuss." Their easier experience becomes a contrast point ("Why did some breeze through? What assumptions did the form make?").
  3.  **Problem: Role Card Triggers Real-Life Sensitivity.**
      *   *Fix:* **Crucial:** Introduce the activity by emphasizing: "All scenarios are fictional. Your role card describes a *character's* life, not yours. Focus on the *process* of translating that character's situation." Use mundane but mismatched examples (rotating households, odd hours, complex care, gig income). Avoid cards involving trauma, abuse, or highly stigmatized conditions. In debrief, focus on the *structural* frustration, not personal details: "How did the *character* likely feel being forced into those boxes?".
  4.  **Problem: Students Decline to Participate.**
      *   *Fix:* Assign non-participating students as **Silent Observers (2-3 max).** Give them an Observer Card: "Silently observe the interactions at the filing desks and during the award. Note: Where do claimants struggle? How do clerks enforce rules? What reactions do you see after the award? Be ready to share observations neutrally." Their external perspective enriches debrief.
  5.  **Problem: Auditors Struggle to Calculate Quickly.**
      *   *Fix:* Keep scoring simple (Sum of 2 numbers). Pre-print a scoring grid for them. Ensure forms clearly show the necessary boxes (Stability Rating, Income Frequency/Source Type). Have a backup plan (e.g., Instructor whispers a pre-calculated winner if truly stuck).
  6.  **Problem: Award Announcement Feels Anti-Climactic or Silly.**
      *   *Fix:* Frame the award seriously within the fiction. Auditors should announce formally and neutrally. The potential *unfairness* or *mismatch* (e.g., winner had easiest form fit, not most 'stable' life) is the point. Debrief focuses on the feeling of being judged by the translated data.

  ---

  ## 25-Minute Reading Group Version? Not Recommended.

  A meaningful experience of the translation struggle, clerk interaction, *and* secondary use revelation requires the buildup and processing time of the full simulation. Squeezing it into 25 minutes risks being rushed and superficial, failing to generate the necessary visceral frustration or thoughtful split on secondary use. The debrief would be gutted. Instead, for a short session, **discuss a concrete real-world example** (e.g., applying for benefits with rigid childcare hour categories while working split shifts, or gender binaries on forms) **guided by the key features of the legibility burden**, perhaps paired with a short, provocative reading excerpt. The simulation's power relies on enactment, not description.
