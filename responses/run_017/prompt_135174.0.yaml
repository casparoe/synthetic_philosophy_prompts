  Below is a complete, runnable workshop plan designed to meet your specifications. It uses index cards, a box, and a whiteboard for four sequential rounds, each targeting a specific aspect of the inefficacy objection. Real but tiny monetary stakes are involved (using your money), with no deception. The debrief explicitly ties each round to the core concepts without using jargon like "inefficacy" until the end. Total runtime is 85 minutes (including debrief), with buffer time for discussion.

  **Materials Needed:**  
  - Index cards (at least 5 per participant).  
  - A box for collecting cards.  
  - Whiteboard and markers.  
  - Envelopes (3) for pre-written cards in Rounds 1 and 3.  
  - Small monetary stakes: Bring $15–$20 in quarters/dimes (each payoff is $0.05–$0.50).  
  - Timer.  

  **Stakes:**  
  - All payoffs come from your money. No participant pays out of pocket.  
  - Minimal costs: Max $15 for 24 participants (worst-case average: $0.63/person).  

  **Participant Setup:**  
  - 18–24 people seated in a circle. No phones/laptops.  
  - Assign numbers 1–N (N = group size) via index cards. Collect and reshuffle for randomness.  

  ---

  ### **Workshop Flow (85 min)**  
  #### **Introduction (5 min)**  
  **Goal:** Frame the session as a game about group choices, avoiding ethical jargon.  
  **Script:**  
  > "Today, we’re playing 4 short games about how individual choices add up in groups. Each game has rules, payoffs, and real (but small) money. I’ll explain rules before each round. No talking during play except in Round 4. Focus on your own choice, and we’ll discuss after all rounds. Questions? Let’s begin."  

  ---

  #### **Round 1: Fixed Outcome (10 min)**  
  **Target Thought:** *"My act did not change the outcome."*  
  **Goal:** Participants experience a choice that cannot alter a predetermined outcome.  
  **Rules:**  
  1. "Threshold: 10 'IN' choices trigger a group bonus. I have 10 pre-written 'IN' cards in this envelope (show envelope). Your choice only affects your personal payoff."  
  2. "Choose secretly: Write 'IN' or 'OUT' on your card.  
     - If you choose **IN**, you get **$0.25** if the threshold is met, **$0** if not.  
     - If you choose **OUT**, you get **$0.05** no matter what.  
  3. Threshold is met (reveal 10 pre-written 'IN' cards). Outcome is fixed."  
  **Mechanics:**  
  - Participants write choices → Collect cards in box.  
  - Reveal pre-written 'IN' cards first ("See? Threshold met").  
  - Payoffs: All 'IN' choices get $0.25; 'OUT' get $0.05.  

  **Why It Works:**  
  - Outcome is fixed regardless of choices, isolating the "no change" thought. Participants see their choice only affects their payoff, not the group outcome.  

  ---

  #### **Round 2: Uncertain Outcome (15 min)**  
  **Target Thought:** *"I cannot tell whether my act made a difference."*  
  **Goal:** Uncertainty about the threshold makes pivotality unknowable during choice.  
  **Rules:**  
  1. "Threshold T is hidden. It could be 10, 15, or 20 (written on cards in this box). Your choice may trigger a bonus."  
  2. "Choose 'IN' or 'OUT' secretly:  
     - If total 'IN' ≥ T, all 'IN' get **$0.50**, 'OUT' get **$0.05**.  
     - If total 'IN' < T, all 'IN' get **$0**, 'OUT' get **$0.05**."  
  3. T is drawn AFTER choices are made.  
  **Mechanics:**  
  - Write choices → Collect cards.  
  - Draw T from a box with three cards (10, 15, 20).  
  - Count total 'IN' → Announce if threshold met → Payoffs.  

  **Why It Works:**  
  - T is unknown during choice, making pivot probability incalculable (e.g., if T=15 and total IN=16, no one is pivotal, but participants couldn’t know this). Forces confrontation with uncertainty.  

  ---

  #### **Round 3: Overdetermined Outcome (10 min)**  
  **Target Thought:** *"The outcome would have happened anyway."*  
  **Goal:** Participants contribute to an outcome already guaranteed by others.  
  **Rules:**  
  1. "Threshold: 5 'IN' choices trigger a bonus. I have 5 pre-written 'IN' cards (show envelope). Outcome is fixed—bonus happens no matter what you do."  
  2. "Choose 'IN' or 'OUT':  
     - If you choose **IN**, you get **$0.25**.  
     - If you choose **OUT**, you get **$0.05**.  
  3. Group outcome is unaffected by your choice."  
  **Mechanics:**  
  - Collect choices → Reveal pre-written 'IN' cards first.  
  - Payoffs: 'IN' get $0.25; 'OUT' get $0.05.  

  **Why It Works:**  
  - The 5 pre-committed 'IN' cards guarantee the outcome. Participants feel their choice is redundant, evoking the "would have happened anyway" thought.  

  ---

  #### **Round 4: Ripple Effect (20 min)**  
  **Target Thought:** *"My choice changes others’ choices."*  
  **Goal:** Model how one person’s action influences peers.  
  **Rules:**  
  1. "You’ll choose in public order (by your assigned numbers). Threshold: 10 'IN' for bonus."  
  2. "When called, state 'IN' or 'OUT' aloud. Payoffs:  
     - If total 'IN' ≥ 10: 'IN' get **$0.50**, 'OUT' get **$0.05**.  
     - If total 'IN' < 10: 'IN' get **$0**, 'OUT' get **$0.05**."  
  3. "After your turn, you may whisper ONE sentence to the next person (e.g., 'I chose IN because...')."  
  **Mechanics:**  
  - Call participants in random order (use reshuffled number cards).  
  - Record choices on whiteboard (update total 'IN').  
  - After each choice, speaker whispers to next person (keep it brief).  
  - After all choices, calculate payoffs.  

  **Why It Works:**  
  - Public choices + whispers simulate real-world influence (e.g., voting/activism). Early 'IN' choices often ripple, increasing later 'IN' rates. Participants feel how their choice affects norms.  

  ---

  #### **Debrief (25 min)**  
  **Goal:** Link experiences to the inefficacy objection without lecturing. Reveal the three separable thoughts and Shapley value tension.  
  **Structure:**  
  1. **Reactions (5 min):**  
     - "What surprised you?"  
     - "When did your choice feel meaningless? Meaningful?"  

  2. **Map Rounds to Thoughts (10 min):**  
     - **Round 1:** "In Round 1, the outcome was fixed. Did anyone feel their choice was pointless for the group? That’s the 'no change' thought."  
     - **Round 2:** "In Round 2, you couldn’t know if you’d be pivotal. How did that uncertainty feel? That’s the 'I can’t tell' thought."  
     - **Round 3:** "In Round 3, the outcome happened anyway. Did you still contribute? Why/why not? That’s the 'would have happened' thought."  
     - **Round 4:** "In Round 4, whispers changed choices. How might this happen in voting or boycotts? This is where your real-world impact often lives."  

  3. **Shapley Value Tension (5 min):**  
     - "In Round 3, 5 outsiders and some of you chose 'IN'. The outcome was fixed. Should all 'IN' choosers share equal credit?  
     - Economists use 'Shapley value' to assign equal shares in such cases. Is this fair responsibility... or just bookkeeping?"  
     - Let them debate briefly. Highlight: "It feels arbitrary when you’re not pivotal, but it’s useful for distributing blame/credit."  

  4. **Address Predictable Pushback (5 min):**  
     - **"Someone computed pivot probabilities"**: "Did calculations help in Round 2? Uncertainty often makes exact EV useless."  
     - **"This is just a game"**: "True, but the structures mirror voting, consumer choices, or climate action. Where else do you see this?"  
     - **"Refused to play"**: "Did opting out feel like a choice? In real life, abstention is still a contribution to the outcome."  

  5. **Reveal the Inefficacy Objection (1 min):**  
     - "Today explored the 'inefficacy objection': the pull of 'my act doesn’t matter, so I’m not responsible'. We forced apart three sub-thoughts and saw why they fail—especially the ripple effect."  

  **What the Activity Can’t Capture:**  
  - **Scale and anonymity:** Real-world collective harms (e.g., climate change) involve millions, making influence feel diluted. Say: "Here, you saw faces. Out there, invisibility amplifies the 'no difference' feeling—but the logic is identical."  

  ---

  ### **Logistical Notes**  
  - **Timing:** Strictly keep rounds to time. If rounds run long, shorten debrief.  
  - **Stakes Handling:** Pay immediately after each round with coins (have a helper if needed).  
  - **Pushback Mitigation:**  
    - For rule-questioners: "Play it out—we’ll discuss after."  
    - For refusers: "You can choose 'OUT' and still get $0.05—but you’re still part of the game."  
  - **Cost Estimate:**  
    - Max cost: If all choose 'IN' in all rounds = $14.40 (24 people). Likely cost: ~$8–$10.  
  - **Why No Deception?**  
    - Pre-written cards (Rounds 1/3) are disclosed upfront. This preserves trust for debrief.  

  This design forces participants to confront the inefficacy objection experientially, isolates your three target thoughts, leverages Shapley value tension in Round 3, and centers the ripple effect in Round 4. Run it as-is—it’s Saturday-ready.
