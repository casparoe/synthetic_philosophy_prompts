  - We set a threshold of 5. We have a large group (18-24). We also have a set of 5 pre-committed IN (we tell them: there are 5 people who are forced to choose IN). Then we ask the rest to choose. The threshold is 5, so it will be met regardless of what the rest do. Then the rest can choose IN (and get $0.50) or OUT (and get $0.10). This is similar to Round 1 but with a very low threshold and pre-committed players. We tell them about the pre-committed players and the threshold. So they know the outcome is fixed. This isolates the "it would have happened anyway".

  Round 4: Ripple Effect
  - We design a game where participants are arranged in a line or a circle. Each must choose IN or OUT. The payoff for choosing IN is $0.40. The payoff for choosing OUT is $0. But there's a twist: if the person immediately after you (in the line) chooses IN, then you get an additional $0.20. So you have an incentive to encourage the next person to choose IN. We can call it a "chain reaction" game. We tell them that they will be arranged in a fixed order (by seating or by assigning numbers). They write their choice and the choice of the person they are linked to (the next in line) is revealed to them only after they choose? That's hard.

