  - Discuss Round 4: "In Round 4, did the order matter? Did seeing others' choices affect your own? How? This models the ripple effect: your choice might influence others by setting an example, by creating social pressure, or by changing norms."
  - Then bring up the Shapley value: "In Round 3, even though the outcome was fixed, we might assign each of the 5 pre-committed and the volunteers a share of the credit. For example, if 5 pre-committed and 5 volunteers all chose IN, we might say each of the 10 contributed equally. But some might say the volunteers didn't actually matter. How do you feel about that? This is related to the Shapley value in cooperative game theory, which assigns credit based on average marginal contribution over all possible orders. It captures a sense of shared responsibility even when no one was pivotal in the actual sequence."
  - Finally, discuss real-world implications: "In real life, we often face situations like these. How should we think about our individual actions in collective harms? How does the ripple effect change the expected value? How do we handle uncertainty?"

  Predictable issues:
  - Someone might compute the pivot probability in Round 2: that's fine, it shows they are engaging. But note that the random T makes it complex.
  - Someone might refuse to play: have a backup plan (they can be observers and still get the minimum payoff, or they can participate as a dummy).
  - "This is only a game": acknowledge that the stakes are small, but the structure is the same. Ask them to imagine scaling up.

  What the activity cannot reproduce: 
  - In real life, the ripple effect is complex and not always visible. We had to simulate it by sequential choice, but in reality it might be simultaneous and through social networks. Also, the stakes are small, so emotions are not as high.

  This should fit in 90 minutes.

  Let me know if you need any adjustments.
