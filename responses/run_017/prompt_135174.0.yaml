  But we want to force the no-difference experience. So let's design Round 1 as:

  Round 1: Known No-Difference
  - We tell participants: "This is a threshold game. The threshold is 10. However, I have already collected the choices of 10 people who are not in the room (we'll show a box with 10 pre-filled IN cards). So the outcome will be determined by the choices of those 10 plus your choices. But note: the threshold is 10, so if at least 10 IN, then everyone who chose IN gets $0.50. OUT gets $0.10 regardless. But the 10 pre-filled are all IN. Therefore, the threshold is already met. Your choice only affects your own payoff: if you choose IN, you get $0.50. If you choose OUT, you get $0.10. The collective outcome (threshold met) is fixed."

  This avoids deception because we tell them the threshold is already met. Then each participant chooses without affecting the collective outcome. They can see that their choice only affects their own payoff. This isolates the first thought: "my act did not change the outcome (of the threshold being met)".

