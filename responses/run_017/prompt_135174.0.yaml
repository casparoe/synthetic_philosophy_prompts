  We are going to design a workshop activity that uses a series of games to illustrate the inefficacy objection and its rebuttals. The goal is to have participants experience the tension between the feeling that their individual action doesn't matter and the idea that they still bear responsibility. We'll design three rounds (corresponding to the three separable thoughts) and then a fourth round that introduces the ripple effect.

  Constraints:
  - 18-24 participants, 90 minutes total.
  - Materials: index cards, a box, a whiteboard.
  - No phones or laptops during play.
  - Real but tiny stakes: use the facilitator's money or inconvenience. We'll use small monetary stakes (e.g., $0.10 to $1 per participant per round) to keep it real but trivial. The facilitator can provide the money and collect winnings/losses.

  Structure:
  1. Introduction (5 min): Explain that we are playing a series of short games to explore decision-making in groups. Do not mention inefficacy, overdetermination, or the philosophical context until the debrief.
  2. Round 1: Threshold Game (No Change in Outcome) - to illustrate the "my act did not change the outcome" thought.
  3. Round 2: Uncertain Threshold Game - to illustrate "I cannot tell whether it did".
  4. Round 3: Overdetermination Game - to illustrate "the outcome would have happened anyway".
  5. Round 4: Ripple Effect Game - to model the ripple effect (your choice influences others).
  6. Debrief (30 min): Discuss the experiences, map them to the inefficacy objection, and introduce the concepts.

  Each round will have:
  - A clear set of rules explained on the spot.
  - A choice for each participant (usually binary: contribute or not).
  - A collective outcome that depends on the choices.
  - An individual payoff that depends on the collective outcome and sometimes the individual choice.

  We'll use index cards for secret ballots and a box for collecting choices. The whiteboard will be used to display the rules and tally results.

  Round 1: Threshold Game (Fixed Threshold, Known)
  - Goal: Illustrate a situation where an individual's contribution does not change the outcome because the threshold is already met or not met by others.
  - Setup: Each participant is given an index card and told they can choose to write "IN" or "OUT". They are told that if at least 10 people choose "IN", then everyone who chose "IN" will get $0.50. However, if they choose "OUT", they get $0.10 regardless of the outcome. If the threshold (10) is not met, then those who chose "IN" get nothing and those who chose "OUT" get $0.10.
  - The twist: The facilitator will secretly decide before the game to set the threshold at 10, but then after collecting the cards, the facilitator will reveal that the threshold was actually set at 15 (which is above the number of participants). This ensures that the threshold is not met no matter what. Alternatively, to avoid deception, we can set the threshold at 10 and then have a large group (say 18-24) so that it's very likely the threshold is met. But then we cannot guarantee the "no difference" experience. Alternatively, we can set the threshold at 15 in a group of 18-24, so that it's possible to meet the threshold but not guaranteed. We want to create a situation where an individual's choice doesn't change the outcome. 

  However, to avoid deception and to make it real, we can do:

  Option for Round 1 (without deception): 
  - Tell the group the threshold is 10. 
  - After the choices are made, count the "IN" votes. If the threshold is met (>=10), then all "IN" get $0.50 and "OUT" get $0.10. If not, "IN" get $0 and "OUT" get $0.10.
  - In a group of 18-24, it's very likely that at least 10 will choose "IN". So for an individual who chose "OUT", their choice did not change the outcome because the threshold was met without them. For an individual who chose "IN", if the total without them would have been 10 or above, then their choice also didn't change the outcome (because the threshold was already met). But if without them it was 9, then they were pivotal.

  To increase the chance of no pivotal players, we can set the threshold at 15 in a group of 18-24. Then, if the total "IN" is 16, then no one was pivotal (because even if one person had opted out, it would still be 15). But if the total is exactly 15, then all 15 were pivotal. So we cannot guarantee that no one is pivotal.

  Alternatively, we can use a large threshold relative to the group size and then have a fixed outcome. But that requires deception.

  Given the constraint against deception, we'll design Round 1 to be a game where the threshold is set so that the outcome is fixed regardless of an individual's choice. We can do this by having the threshold set at 0 or at a number above the group size. But that might be too obvious.

