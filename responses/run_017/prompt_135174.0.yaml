  - We assign each participant a number from 1 to N. We arrange them in a circle (or line) by number. Each participant chooses IN or OUT. The payoff for IN: $0.40. For OUT: $0. Additionally, if the participant you are following (the one with the next lower number, and participant 1 follows participant N) chooses IN, then you get an extra $0.20. But note: we want to model that your choice might influence the next person. But since they choose simultaneously, they don't see the previous choice.

