  - We set a threshold T, but we don't tell them what T is. We say T is a number between 10 and 20 (inclusive) and we will draw it randomly from a box after they choose. Each participant chooses IN or OUT. If the total IN >= T, then each IN gets $1.00 and each OUT gets $0.10. Otherwise, IN gets $0 and OUT gets $0.10.
