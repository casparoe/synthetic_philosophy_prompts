  ### Variant Case of the Surprise Exam Paradox

  **Announcement by the Teacher:**  
  "Class, next week I will give a quiz on one of our meetings from Monday to Friday. I have already chosen the day. However, due to possible disruptions like fire drills or facility issues, any meeting could be canceled. If a meeting is canceled, the quiz will be postponed to the next meeting that does take place. I guarantee the quiz will happen next week, and it will be a surprise: each evening, you won't be more than 50% sure that the quiz is the next day. Trust me—I’ve planned it carefully."

  **Schedule and Credence Arithmetic:**  
  - **Meetings:** Monday through Friday (5 days).  
  - **Cancellation model:** Each meeting has an independent 10% chance of cancellation (due to external events like drills). The teacher’s quiz is scheduled for a specific day (e.g., Wednesday). If that day is canceled, the quiz moves to the next uncanceled day (e.g., Thursday).  
  - **Prior beliefs:** Students start with uniform credence over Monday–Friday (20% each day).  
  - **Key dynamics:**  
    - Evenings update: Students condition on no quiz so far and possible cancellations.  
    - Credence in next day ≤ 50%: Cancellation uncertainty ensures no day is too likely.  

  **Example with Quiz on Wednesday:**  
  - **Sunday evening:**  
    - Credence for Monday: 20% (≤50%).  
  - **Monday evening (no quiz, Monday held):**  
    - Possible worlds: Quiz on Tue, Wed, Thu, or Fri.  
    - But Tuesday’s meeting might cancel (10% chance), affecting when the quiz occurs.  
    - Students compute: P(Quiz Tuesday) = P(Quiz scheduled Tuesday) × P(Tuesday not canceled) + Flow from other days.  
      - Result: ≈25% (details: 22% if scheduled Tue, but adjusted for cancellation/postponement).  
    - Since 25% ≤ 50%, Monday’s quiz would have been a surprise.  
  - **Tuesday evening (no quiz, Tuesday held):**  
    - Credence for Wednesday: Accounts for:  
      - Quiz scheduled Wed and Wed not canceled.  
      - Quiz scheduled Tue (canceled) or Mon (canceled) moving to Wed.  
      - Result: ≈40% (≤50%).  
  - **Wednesday (quiz occurs):**  
    - Students are surprised: On Tuesday evening, P(quiz Wednesday) was 40% ≤ 50%.  

  **Why Backward Induction Fails:**  
  The backward induction assumes students can always identify a "last possible day" if no quiz occurs earlier. Here, **cancellation uncertainty** prevents this:  
  - Students can never be sure a day (e.g., Thursday) is the "last possible meeting" because it might be canceled, pushing the quiz to Friday. Conversely, Friday might also be canceled, but the teacher guarantees the quiz will occur (e.g., by ensuring at least one meeting happens).  
  - Thus, the base step fails: On Thursday evening (if no quiz by Thursday), students cannot conclude that Friday *must* have the quiz (as in the standard paradox), because Friday might be canceled, allowing the quiz to occur on a postponed day. In reality, the quiz has already occurred (Wednesday), making the point moot.  

  **The Single Feature Doing the Work:**  
  **Uncertainty about meeting cancellations** is the minimal feature. If removed (e.g., stipulating all meetings definitely occur), the paradox resurfaces:  
  - Students know the quiz is on one of five definite meetings. By Thursday evening, if no quiz, they know Friday *must* hold the quiz (credence = 100% > 50%). The induction completes: They reason backward that no day can be a surprise, so no quiz is possible, contradicting the announcement.  
  - With cancellations, no day is ever certain to occur, so no day is certifiably "last possible," blocking the induction’s base step.  

  **Objection from Self-Referentiality Advocates and Response:**  
  - **Objection:** A philosopher who attributes the original paradox to self-referentiality (the announcement cannot be known if true) would argue this case is invalid. They might claim: "The teacher’s guarantee of a surprise is self-referential—it references the students’ future credences. This creates a loop making the announcement unknowable, even if true. Your case hides this with cancellations, but self-referentiality remains the core issue."  
  - **Rebuttal:** This case shows self-referentiality is a red herring. The announcement is straightforwardly true and known, yet the paradox is resolved by **cancellation uncertainty**, not by restricting knowledge. This shifts the focus to structural uncertainty about deadlines:  
    - The paradox arises from known, rigid finite deadlines enabling induction.  
    - Here, deadlines are fluid (cancellations modify viable days), preventing induction.  
    - Thus, the paradox is fundamentally about **known fixed deadlines enabling predictable last days**, not about self-referentiality. Removing deadline certainty (via cancellations) dissolves the paradox while preserving knowledge and rationality.  

  **Why This Is Minimal and Clean:**  
  - **Minimal feature:** Cancellation uncertainty is the simplest addition. It requires no changes to the students’ rationality, the teacher’s reliability, or temporal logic.  
  - **Alternatives considered:**  
    - Uncertain quiz distribution (e.g., non-uniform priors): Fails as conditional probabilities exceed 50% on later days.  
    - Uncertain week length: Students can still identify a "last day" if the deadline is known (e.g., "up to 5 days"), resurrecting the paradox.  
  - **Why cancellations win:** They inject exogenous uncertainty at every step, directly disrupting the induction’s reliance on identifiable endpoints. No other feature does this as cleanly.  

  This variant resolves the paradox by making deadlines unpredictable, demonstrating that the core issue is not self-referentiality but the structure of finite, knowable horizons.
