prompt: |-
  I'm a caseworker at a legal aid clinic and I've been going through the written decisions of one adjudicator on our Protection Review Board — call her H — on the bus home, because I've got a client next week who turns on almost exactly the same sort of question and I want to know what she'll do with him. We're not a Convention country; our statute basically says we grant protection where someone can't reasonably be expected to return because of serious harm their own state won't avert, which leaves more or less everything open. Her run so far: granted for a journalist jailed and beaten by police after publishing corruption allegations; granted for a woman whose partner broke her jaw and whom the police ignored four times; granted for a man who got a handwritten death threat naming him from a cartel after he refused to drive for them, and whose complaint the police took and then did nothing about; refused for a shopkeeper paying protection money to a gang along with everyone else on his street, on the basis that there's a functioning anti-extortion unit and he could set up again in the capital; refused for a farmer who left after three failed rainy seasons, where the government ran relief camps he'd have been fed in; refused for a man from a city shelled by both sides in a civil war, where nobody had singled him out and the police had more or less dissolved; and granted for a woman from the Veshnik minority whose identity documents were cancelled under a new registration law, leaving her unable to work, travel or collect rations — nobody had laid a finger on her, the officials were just implementing policy.

  My client is a fifty-something fisherman from the Kaldor delta, which is nearly all Veshnik. Nine years ago the state granted a forty-year concession to a foreign-owned mining company, the company diverts the main channel for washing ore, and the fish are gone; his village also has no drinking water for a few months of the year. Nobody has threatened him. Officials call the damage regrettable and say the concession earns export revenue. There was a one-off compensation payment that he's already spent and that doesn't touch the water. He could move to the capital, but there's no fishing there and Veshnik renters get shoved to the bottom of the housing queue — aggravation and refusals, nothing you'd call violence — and a minister told a rally last year that the delta people would just have to adapt. The delta has no seat on the water board either, and the civil servants who sit on it are all from the majority group.

  Obvs I care what she decides, but I care more about the rule underneath: give me the two or three rules that fit her seven decisions equally well, what each of them predicts for my client, your best guess with the reasons you're going with it, and the one further case you'd most want to see her decide in order to tell those rules apart. If there's room, say what I should lead with in the skeleton argument. No more than 500 words, three short headed sections, and please don't give me a survey of how real jurisdictions handle this — I've read that stuff and it's not what I need.
reasoning: |-
  Okay, the user is a caseworker at a legal aid clinic preparing for a client's case before Adjudicator H. They've analyzed seven of her past decisions on protection claims and need help identifying the underlying rules she applies. The client is a Veshnik fisherman affected by environmental degradation and discrimination. 

  First, let's distill patterns from H's decisions. She granted protection to: (1) a journalist targeted for corruption exposure, (2) a domestic violence victim ignored by police, (3) a cartel-threatened driver whose report was dismissed, and (4) a Veshnik woman rendered stateless by policy. Denials covered: (5) an extorted shopkeeper with state alternatives, (6) a drought-affected farmer with relief access, and (7) a civilian in general civil war danger. 

  Three consistent rules emerge:
  1. **State abandonment test** - Protection requires both serious harm and the state's failure/inability to protect. Her approvals involve specific targeting with state inaction (cases 1-3), while denials show available state alternatives (cases 5-6) or state collapse beyond control (case 7).
  2. **Policy-driven harm distinction** - Systemic harm via state policy warrants protection (case 4), but general environmental/economic hardship doesn't (cases 5-6). The Veshnik woman's case is key here - document cancellation was deliberate state action.
  3. **Consequence threshold** - Harm must create existential vulnerability. Physical violence (cases 1-2), death threats (3), or complete rights deprivation (4) meet this; economic loss alone (5) or general war risk (7) don't.

  Applying this to the fisherman: 
  - His harm (lost livelihood/water access) resembles case 6's farmer, but the Veshnik discrimination angle parallels case 4. 
  - The state's active role (mining concession, discriminatory housing) versus passive drought response may matter. 
  - Key question: Is this "deliberate rights denial via policy" (like case 4) or "incidental hardship" (like case 6)?

  To clarify H's stance, I'd want to see her rule on: 
  *Discrimination plus environmental harm* - e.g., a Veshnik farmer whose land was confiscated for state infrastructure without compensation. This would test whether economic harm + identity-based exclusion triggers protection without physical violence.

  For the hearing, lead with: 
  **"State-enabled destruction of minority livelihood."** Emphasize the mining concession as active state policy, the Veshnik identity's role in exclusion from remedies (water board/housing), and how this creates case-4-like rights deprivation (water/food access) rather than mere poverty.
answer: |-
  ### Core Rules Extracted  
  1. **State Duty Breach**: Protection requires *state failure to protect* from serious harm (tacit endorsement/inaction counts). Denied where state offered *functioning alternatives* (shopkeeper's anti-extortion unit, farmer's relief camps) or was *non-culpably unable* (civil war collapse).  
  2. **Personalized/Identity-Based Harm**: Granted where harm was *individually targeted* (journalist, abused woman, cartel victim) or *identity-based state policy* (Veshnik documents). Denied for *generalized harm* (shopkeeper's extortion, civil war, drought).  
  3. **Consequence Severity**: Physical/survival threats (violence, statelessness) favored; economic disruption alone (shopkeeper relocation) insufficient unless existential + identity-linked.  

  ### Prediction for Fisherman  
  **Likely refusal** under Rules 1–3.  
  - *Rule 1*: State acknowledges harm but offers alternatives (relocation to capital). No evidence of *duty breach*—officials call damage "regrettable" but provide compensation (like shopkeeper’s functioning unit).  
  - *Rule 2*: Harm is *generalized* (whole delta affected), not individualized. Veshnik discrimination in housing is systemic aggravation, not targeted policy (cf. document cancellation).  
  - *Rule 3*: Economic loss (fishing/water) resembles shopkeeper/farmer, not violence/statelessness. Housing barriers are "aggravation," not survival denial.  

  **Counterpoint**: If argued as *state-enabled* environmental harm + *identity-based exclusion* from remedies (water board/housing), *Rule 2* could weakly support protection—but H’s past grants required direct state action (document policy) or extreme violence.  

  ### Key Test Case to Differentiate Rules  
  **A Veshnik activist denied water access after protesting the mine**, where officials threatened arrest for "disruption." Would clarify:  
  - Does *state-retaliatory obstruction* of basic needs (water) = "serious harm" absent violence?  
  - Is *identity-linked resource deprivation* sufficient without paperwork cancellation?  
  Distinguishes *generalized hardship* (current case) from *personalized state reprisal*.  

  ### Skeleton Argument Priority  
  Lead with: **"State-facilitated destruction of minority livelihood without meaningful redress."** Stress:  
  1. State *actively enabled* harm via mining concession (cf. passive drought).  
  2. Veshnik exclusion from water board/housing denies *alternative survival* (cf. shopkeeper’s viable relocation).  
  3. Compensation exhausted—no ongoing remedy (unlike farmer’s camps).  

