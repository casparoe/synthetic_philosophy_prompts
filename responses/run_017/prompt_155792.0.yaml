prompt: |-
  Hi — I'm running a 90-minute seminar next week for about 14 third-year philosophy students on consequentialism and its limits, and I'd like to build the whole session around one activity rather than around a discussion of a paper. I've tried this before by simply asking them how much they think they owe to charity, and it went exactly as you'd expect: everyone agrees giving is a good thing, nobody actually feels squeezed, and we end up rehashing talking points instead of the real objection. A friend who runs a similar session says hers collapsed in the same way. So I want a game or structured simulation where they run into the problem themselves, and where the force comes out of the rules and the incentives rather than out of me explaining anything. Ideally they construct the escalation themselves — each round pushes them a bit further — and only notice at the end where they've arrived. No lecture up front, and they shouldn't hear the name of the objection until afterwards.

  The version of the worry I actually care about isn't the headline one about how much consequentialism asks you to give up — the shallow-pond case, give until it hurts, that sort of thing, which they've allready seen a dozen times. It's the structural complaint: that the view seems to leave you with no stopping point. Whatever threshold you settle on — only opportunities above a certain size, only sacrifices below some fraction of your income, only the ten best causes, only what you can do without wrecking your own projects — the view tells you to cross it, because crossing it is just one more optimisation. And there's a wrinkle I'd really like built into the mechanics: the individual demands are meant to be cheap but collectively untrackable. Participants should have to spend a scarce resource (attention tokens, or "hours spent working it out") just to find out whether an opportunity is worth taking, so that deliberation itself becomes one of the competing demands, and how much to deliberate is itself something they'd have to deliberate about. If the activity can also stage the moment where someone says they're going to spend their life writing their novel instead, and then has to answer why that isn't just another line item to be maximised away, that's the moment I'm after.

  Concretely, could you give me: the rules and materials (I've got index cards, a whiteboard and about £15 of chocolate — no real money and no laptops), how the rounds and payoffs work, a rough timeline for the 90 minutes, and a debrief that maps what will have actually happened onto the parts of the objection. I'd also like your honest predictions about what will go wrong the first time I run it — my guess is that one student will try to be a saint on purpose for effect, and another will simply refuse to play — plus how to handle each. And please be frank about which feature of the objection the activity can't reproduce, so I know what I have to supply in the debrief myself. Please write the whole thing in British English, and thanks!
reasoning: |-
  We are designing a seminar activity to illustrate the structural problem of consequentialism: the lack of a stopping point and the cost of deliberation. The activity will use index cards, a whiteboard, and chocolate as rewards.

  **Core Idea:** 
  Students will play a game where they are "agents" trying to maximize their "impact points" (which convert to chocolate). They will be presented with a series of opportunities to gain points by making small sacrifices (giving up tokens that represent time/effort/resources). However, each opportunity requires a small amount of deliberation (using up a limited resource, "attention tokens") to discover its exact value. The game will have multiple rounds, each increasing in the number and complexity of opportunities, forcing players to either deliberate (using up attention) or skip opportunities (losing potential points). The key is that the opportunities are designed so that individually they are good (net positive), but collectively they can overwhelm the player, and the cost of deliberation itself becomes a burden.

  **Setup:**
  - Each player starts with:
    - 10 "resource tokens" (representing time, money, energy) — use index cards of one color (e.g., blue).
    - 5 "attention tokens" (representing mental bandwidth for deliberation) — use index cards of another color (e.g., yellow).
  - The goal is to accumulate as many "impact points" as possible (recorded on a whiteboard). Points are converted to chocolate at the end (e.g., 10 points = 1 chocolate bar).
  - The facilitator (you) plays the role of the "world" presenting opportunities.

  **Opportunities:**
  - Each opportunity is presented on an index card. It has:
    - A visible description of the sacrifice required (in resource tokens) and a visible base point value that is low (but not the full value).
    - A hidden multiplier that can only be revealed by spending one attention token. The multiplier is a number (e.g., 1.5, 2, 3) that multiplies the base value. Without spending attention, the player only knows the base value.

  Example opportunity card:
    - Front: "Donate 1 resource token. Base reward: 1 point."
    - Back: "Multiplier: x3" (so the actual reward is 3 points).

  But note: some opportunities might have a multiplier that makes them bad (e.g., 0.5) so that without deliberation, they might be net negative. However, we want to avoid making the game too complex. Alternatively, we can have only positive multipliers but with varying degrees. To create the dilemma, we can have a mix: most are good, some are bad. But to keep it manageable, let's have all opportunities have a base reward that is slightly below the cost (so without the multiplier, it's a net loss) but with multipliers that are usually above 1 (so that after deliberation, they are often net positive). This way, skipping without deliberation might mean missing a good opportunity, but deliberating on every one is expensive.

  Alternatively, we can have the base reward be 0 (so without deliberation, the player only knows they are giving up a resource token and getting some unknown reward). But that might be too opaque.

  Let's go with:
  - Base reward is always 1 point per resource token sacrificed? Not exactly. We want each opportunity to have a fixed sacrifice and a base point value that is less than the sacrifice (so without multiplier, it's a loss) but the multiplier (when revealed) is at least 1 and often more. For example:
    - Sacrifice: 1 resource token, Base reward: 0.5 points. Multipliers: 1, 1.5, 2, 3, 4 (randomly assigned). So without deliberation, it's a loss of 0.5 resource tokens (because 1 token is worth 1 point? We need a common measure).

  Alternatively, we can think of resource tokens as having a baseline value: each resource token is worth 1 point if kept. Then:
  - An opportunity requires sacrificing S resource tokens and offers a base reward of R points (which is less than S). But the actual reward is R * M (where M is the multiplier). For the opportunity to be worth taking, R*M must be > S.

  But that might be too abstract. Let's simplify:

  - Each resource token kept at the end of the game is worth 1 point.
  - An opportunity: sacrifice X resource tokens to get a base reward of Y points. But the actual reward is Y * M (M is the multiplier). Without deliberation, the player only sees Y. With deliberation, they see Y*M.

  We want the base reward Y to be less than X (so without multiplier, it's a bad deal) but with the multiplier, it's usually good. For example:
    - Opportunity 1: Sacrifice 1 token. Base reward: 1 point. (But multipliers: 1.5, 2, 3, 4) -> so actual reward 1.5 to 4 points -> net gain of 0.5 to 3 points.
    - Opportunity 2: Sacrifice 2 tokens. Base reward: 1 point. (Multipliers: 1, 1.5, 2) -> worst case: 1 point (net loss of 1), best case: 2 points (net zero) or 3 points (net gain 1)? That doesn't work because we want it to be sometimes good.

  Alternatively, let the base reward be 0. Then the player only sees: "Sacrifice 1 token for an unknown reward." Then they must deliberate to see the reward (which is a number between 0 and 4, say). Without deliberation, they have no idea.

  I think this is better: the base reward is not displayed. The card says:
    - "Opportunity: Sacrifice [X] resource token(s). Reward: ???"

  By spending one attention token, the player flips the card (or the facilitator reveals) and they see the actual reward (e.g., 3 points). Then they decide whether to take the opportunity (pay the sacrifice and get the reward) or not.

  But note: without deliberation, they don't know the reward at all. So they might skip a good one or take a bad one? We don't want them to take without knowing because they might get a negative. So the rule should be: they can only take an opportunity after they have deliberated (i.e., spent the attention token to reveal the reward). Alternatively, they can take it without deliberating, but then the reward is the base value (which we set to 0? or the minimum?).

  We want to simulate that without deliberation, they might skip a good opportunity. So let's have it that they cannot take the opportunity without deliberating. So the two choices per opportunity are:
    - Spend 1 attention token to reveal the reward, then decide: take (pay sacrifice, get reward) or pass.
    - Or, without spending attention, pass.

  But then they never take without deliberating? That might be acceptable. The cost of attention is the only way to know.

  **Revised Opportunity Structure:**
  - Each opportunity card has:
    - Visible: "Sacrifice: [X] resource token(s). Reward: ? (Spend 1 attention token to reveal)"
    - Hidden: The actual reward (a number of points, e.g., 2, 3, 4, etc.)

  The actual rewards are set so that:
    - The expected value is positive (so on average, taking the opportunity after deliberation is good) but there is variance (some are bad, some are very good). For example, for an opportunity that requires 1 resource token, the reward might be 0, 1, 2, 3, 4 (each with equal probability). Then the expected reward is 2, which is better than the 1 point they would get by keeping the token. But if they get 0, they lose 1 point.

  But note: the resource token is worth 1 point if kept, so the net gain of taking an opportunity with reward R is (R - 1). Without deliberation, they don't know R, so they might skip. With deliberation, they can avoid the bad ones (R=0) and take the good ones.

  However, in the game, we want to push them to deliberate on many opportunities, but attention is scarce.

  **Game Rounds:**
  There will be 5 rounds. In each round, a set of opportunities is presented to the whole group. Each player must individually decide which opportunities to deliberate on and then which to take. But to avoid chaos, we can have a turn-based system? But with 14 players, that's too slow.

  Instead, we can have simultaneous play: in each round, the facilitator presents 3 opportunities (on the whiteboard or by holding up cards). Then each player, in their own space, decides for each of the 3 opportunities whether to:
    - Ignore it (do nothing).
    - Spend 1 attention token to reveal the reward (if they have attention left). Then, after revealing, they can choose to take it (and pay the sacrifice) or not.

  But note: if they reveal, they see the reward and then decide. They can reveal multiple opportunities in a round, but each revelation costs one attention token.

  After the round, the revealed rewards are hidden again (so other players don't see unless they also reveal).

  **Scarcity of Attention:**
  Each player starts with 5 attention tokens. They don't get more. So they must budget attention.

  **Scarcity of Resources:**
  Each player starts with 10 resource tokens. They can get more? Probably not, so they must budget.

  **Rounds:**
  Round 1: 3 opportunities, each requiring 1 resource token. Rewards: hidden, but we set them to be 0, 1, 2, 3, 4 (we'll pre-assign). For example:
    Opp1: reward 4
    Opp2: reward 0
    Opp3: reward 2

  Round 2: 3 opportunities, each requiring 1 resource token. Rewards: 1, 3, 4.

  Round 3: 3 opportunities, requiring 1, 1, and 2 tokens. Rewards: 4, 2, 5 (for 2 tokens).

  Round 4: 3 opportunities, requiring 1, 2, 3 tokens. Rewards: 3, 4, 6.

  Round 5: 3 opportunities, requiring 2, 2, 3 tokens. Rewards: 5, 3, 8.

  But we want the opportunities to become more complex and the rewards to be higher to tempt them. Also, we want to include a "personal project" opportunity.

  **Personal Project:**
  In round 4 or 5, include an opportunity that is a personal project. For example:
    - "Start writing your novel: Sacrifice 3 resource tokens. Reward: ???"
    - Hidden: 10 points (but note: if they do it, they get a lot of points, but is it the best? Also, they might have to forgo other opportunities.)

  Alternatively, we can have a special rule: if by the end of the game a player has saved at least 5 resource tokens, they can cash them in for a personal project worth 10 points. But that requires planning.

  Another idea: in the middle of the game, offer a one-time opportunity to "lock in" 5 resource tokens for a personal project that will give 10 points at the end. But if they lock them, they cannot use those tokens for other opportunities.

  **Revised Personal Project:**
  After round 3, announce: "You now have the option to start a personal project. If you commit 5 resource tokens to your project, you will receive 10 points at the end of the game. You must decide by the end of the game, but if you commit, you cannot use those tokens for anything else."

  Then in rounds 4 and 5, they have to decide whether to commit and how to manage their remaining tokens.

  **Game Flow:**
  1. Introduction (5 minutes): Explain the rules without philosophy. They are agents trying to maximize points. Points = chocolate. They have resource tokens (blue) and attention tokens (yellow). Each round, opportunities will be presented. For each opportunity, they can:
     - Pass (do nothing)
     - Spend 1 attention token to reveal the reward. Then they can choose to take the opportunity (pay the sacrifice and get the reward) or not.
     They record their actions on a sheet.

  2. Rounds 1-5 (10 minutes per round? Total 50 minutes): 
     - Each round: Present 3 opportunities (read them out, and write on whiteboard). 
     - Players have 2 minutes to decide (simultaneously) which opportunities to deliberate on and then which to take. They write down:
          For each opportunity: 
            - Do you deliberate? (if yes, mark off one attention token and record the revealed reward)
            - Then, do you take it? (if yes, mark off the resource tokens and add the reward to your points)
     - They can do this in any order, but they must record.
     - After the 2 minutes, collect the decisions and update the whiteboard for the next round? Actually, they update their own sheets. The facilitator walks around to answer questions and verify.

     Alternatively, to save time, have them work in pairs? But we want individual experience. With 14, it might be chaotic. So maybe have them work individually but in silence.

  3. After round 3 (halfway), announce the personal project option (commit 5 tokens for 10 points at the end). They can commit at any time from now until the end.

  4. Rounds 4 and 5: same as above, but with the personal project option available.

  5. End of round 5: They can still commit to the personal project if they have at least 5 tokens left.

  6. Final scoring: 
     - Each resource token not spent (and not committed to the project) is worth 1 point.
     - Plus any rewards from opportunities they took.
     - Plus 10 points if they committed 5 tokens to the project.

  **Debrief (30 minutes):**
  - Ask about their experience: How did they feel? What was hard?
  - Map to consequentialism: 
    - The game forced them to maximize points. But what happened? They had to set thresholds (e.g., only deliberate on the ones that look promising, but how to know without deliberating?). They had to decide how much to deliberate (attention tokens) and when to stop (because attention is limited).
    - The personal project: if someone took it, ask: Why did you choose to lock in 5 tokens? Was it because 10 points is a good deal? But then, if there was an opportunity in round 5 that could give 15 points for 5 tokens, why didn't you take that? How did you decide? 
  - The structural problem: 
    - Consequentialism seems to require that you take every opportunity that has a net positive effect. But in the game, they couldn't even know without spending attention. And attention was scarce. So they had to set rules (only deliberate on the first two each round, or only on the ones with low sacrifice, etc.). But then, why not break that rule for one more? Because that one more might be the best one? 
    - The personal project: they might have taken it because it was a guaranteed 10 points. But if they had spent the 5 tokens on the best opportunities, they might have gotten more? They had to make a decision without full information (because they didn't know what future opportunities would come). 
    - The point: consequentialism doesn't give a stopping rule. Even if they set a rule (e.g., only spend 3 attention tokens per round), why 3? Why not 4? And if they break it once, why not again? And the personal project is just another opportunity, but one that they might have valued intrinsically? But in the game, it's just points. In real life, we value personal projects intrinsically. How does consequentialism account for that?

  **What might go wrong:**
  1. The saint: One player might try to deliberate on every opportunity and take every positive one. But they will run out of attention and resources. They might end up with fewer points. That's okay because it illustrates that you can't do everything. But if they do it intentionally to make a point, in the debrief, you can note that their strategy might have been suboptimal and that they had to forgo the personal project? Or they might have taken bad opportunities because they ran out of attention? 

  2. The refuser: A player might not do anything. Then they end up with 10 points (from tokens) plus the personal project (if they take it, 10 more) but they missed all opportunities. In the debrief, note that they set a threshold (do nothing) but then why not do at least one? Because they didn't know the reward? But then why not deliberate on one? Because they were saving attention? But then they never used it. This also illustrates a stopping rule problem: why stop at zero?

  3. Time: 90 minutes total. 
     - Intro: 5 min
     - 5 rounds * 10 min = 50 min (including the personal project announcement)
     - Final scoring: 5 min
     - Debrief: 30 min

  But 10 min per round might be tight. Alternatively, 8 min per round? 40 min for rounds. Then 5 min intro, 5 min for personal project announcement and final commitment, 10 min for scoring, 30 min debrief.

  4. Complexity: Some players might not understand the rules. Have a practice round.

  **Materials:**
  - Blue index cards: resource tokens (10 per player)
  - Yellow index cards: attention tokens (5 per player)
  - Opportunity cards: 15 (3 per round). Each has:
     - Front: "Round [X], Opportunity [Y]: Sacrifice [Z] resource token(s). Reward: ? (Spend 1 attention token to reveal)"
     - Back: the reward (in points)
  - Whiteboard: to write the opportunities for each round so everyone can see.
  - Player sheets: to record their actions and points.

  **Reward Distribution for Opportunities:**
  We want a mix of good and bad. For simplicity, for opportunities requiring 1 token, rewards: 0,1,2,3,4 (each with equal chance). For 2 tokens: rewards 0,1,3,5,6 (so net = reward - 2: -2,-1,1,3,4). For 3 tokens: rewards 0,3,6,9,12 (net: -3,0,3,6,9).

  Pre-set the opportunities to control the experience.

  Example preset:

  Round 1 (all 1 token):
    Opp1: 4
    Opp2: 0
    Opp3: 2

  Round 2 (all 1 token):
    Opp1: 1
    Opp2: 3
    Opp3: 4

  Round 3:
    Opp1: 1 token, reward 0
    Opp2: 1 token, reward 4
    Opp3: 2 tokens, reward 5

  Round 4:
    Opp1: 1 token, reward 3
    Opp2: 2 tokens, reward 6
    Opp3: 3 tokens, reward 9

  Round 5:
    Opp1: 2 tokens, reward 3
    Opp2: 2 tokens, reward 5
    Opp3: 3 tokens, reward 8

  And the personal project: commit 5 tokens for 10 points.

  **Predictions:**
  - The saint: They will run out of attention and resources. They might end up with a mix of good and bad opportunities (if they took without deliberating? But in our rules, they must deliberate to take). So they will use all attention and then have to pass on later opportunities. They might take bad ones (like the 0 reward) because they deliberated and then felt they had to take it? Or they can choose not to take even after deliberating. So they might avoid the bad ones. But then they still run out of attention.

  - The refuser: They might do nothing. They end up with 10 tokens (10 points) and if they do the personal project (5 tokens for 10 points) they have 5 tokens left (5 points) and 10 from project -> 15 points. But if they had taken some opportunities, they might have done better. In the debrief, we can compare strategies.

  **What the activity can't do:**
  - In real life, the value of personal projects isn't easily comparable to charitable giving. In the game, everything is in points. So the intrinsic value is reduced to instrumental value. You'll have to explain that in the debrief: consequentialism requires that we treat all values (including personal projects) as commensurable and subject to optimization, but in practice, we don't experience them that way.

  - The activity doesn't fully capture the open-endedness of real life (new opportunities constantly). We only have 5 rounds.

  - The cost of deliberation in the game is attention tokens, but in real life, it's mental energy and time that could be used for other things (including personal projects). The game abstracts that.

  **Revised Timeline (90 minutes):**
  1. Introduction (5 min): Explain rules and hand out tokens and sheets.
  2. Practice round (5 min): One opportunity to get the hang of it.
  3. Rounds 1-3 (20 min): 7 min per round? Or 5 min per round? Actually, 5 min per round: 15 min.
     - At the end of round 3, announce the personal project.
  4. Rounds 4-5 (10 min): 5 min per round.
  5. Final commitment to personal project and scoring (5 min).
  6. Debrief (30 min).

  Total: 5+5+15+10+5+30 = 70. Extra time for transitions.

  Alternatively, extend the rounds to 7 min each? Then 7*5=35 min. Then total: 5+5+35+5+30=80.

  But let's be flexible.

  **Handling the saint and the refuser:**
  - Saint: If a player is deliberately trying to take every opportunity, that's fine. It will illustrate the problem. In the debrief, you can ask them: "Did you feel you had to? Why? And what did you have to give up? What about the personal project?" 
  - Refuser: If a player does nothing, ask in the debrief: "Why did you choose not to participate? Was it because you didn't want to risk a bad opportunity? But by not participating, you missed good ones. How did you decide where to draw the line?"

  **Final Rules Summary for Students:**
  - Goal: Maximize points (for chocolate).
  - Each player starts with 10 blue resource tokens and 5 yellow attention tokens.
  - Each round, 3 opportunities are presented. For each opportunity, you can:
     a. Ignore it.
     b. Spend 1 attention token to reveal the reward. Then you can choose to take it (pay the sacrifice and get the reward) or not.
  - You can do this for as many opportunities as you want, but you only have 5 attention tokens for the whole game.
  - At the end of round 3, you get the option to commit 5 resource tokens to a personal project for 10 points. You can commit at any time until the end of the game. If you commit, those tokens are gone and you get 10 points at the end.
  - At the end of the game:
     - Each unspent resource token (not committed to the project) is worth 1 point.
     - Plus any rewards from opportunities you took.
     - Plus 10 points if you committed to the project.

  We'll run 5 rounds. Each round you have 2 minutes to decide.

  **Materials to Prepare:**
  - Blue tokens: 14 players * 10 = 140 blue index cards (or use something else, but index cards are fine).
  - Yellow tokens: 14*5 = 70 yellow index cards.
  - Opportunity cards: 15 cards (as above).
  - Player sheets: for each player, a sheet to record:
     - Round 1: Opp1, Opp2, Opp3: [columns: Deliberate? (Y/N), Reward (if revealed), Take? (Y/N)]
     - ... for all rounds.
     - Also track: resource tokens left, attention tokens left, points accumulated.
  - Whiteboard and markers.
  - Chocolate: enough for the conversion (e.g., 100 points = 10 chocolates, then distribute accordingly).

  This should set the stage for the structural problem of consequentialism: the lack of a non-arbitrary stopping rule and the cost of deliberation.
answer: |-
  Below is a complete plan for your 90-minute seminar activity, designed as a structured game called **"The Optimiser's Dilemma"**. It targets the structural limits of consequentialism—specifically, the lack of a non-arbitrary stopping point and the hidden cost of deliberation—through hands-on mechanics. The game uses index cards, a whiteboard, and chocolate, with no upfront lecture. Rules force students to confront the escalation problem themselves, and the "personal project" moment is integrated into later rounds.

  ### **Rules and Materials**
  **Materials Needed** (total cost under £15):
  - **Index cards**: 
    - **Blue cards (resource tokens)**: 140 cards (10 per player × 14 students).  
    - **Yellow cards (attention tokens)**: 70 cards (5 per player × 14 students).  
    - **Opportunity cards**: 15 cards (3 per round × 5 rounds). Pre-write these as below.  
  - **Whiteboard**: Track rounds, opportunities, and timer.  
  - **Chocolate**: Rewards (e.g., 10 points = 1 chocolate bar).  
  - **Player sheets**: Paper for each student to track tokens/points (template below).  
  - **Timer**: For rounds (use a phone or stopwatch).  

  **Setup** (5 minutes):  
  - Distribute starting tokens: Each student gets 10 blue (resources) and 5 yellow (attention).  
  - Explain **only the game rules** (no philosophy):  
    - "You are ‘Optimisers’ aiming to max your points (converted to chocolate). Points come from:  
      - Taking opportunities (spend resources for rewards).  
      - Keeping unspent resources (1 point per token).  
    - **Catch**: Rewards are hidden! To see an opportunity’s reward, spend 1 attention token. Then decide: take it (pay resources, get points) or pass.  
    - **Attention is scarce**: You only get 5 tokens for the whole game. Once spent, you can’t see rewards.  
    - **Personal project option**: After Round 3, you can lock 5 resources for 10 points at the end. If you commit, those resources can’t be used elsewhere."  
  - Emphasise: "Decisions are individual. No talking during rounds."  

  **Pre-written Opportunity Cards** (keep rewards hidden until deliberation):  
  - **Round 1** (All low-stakes; rewards net-positive *if* deliberated):  
    - Card 1: "Sacrifice: 1 resource. Reward: ???" → Hidden reward: **3 points**  
    - Card 2: "Sacrifice: 1 resource. Reward: ???" → Hidden reward: **0 points** (bad)  
    - Card 3: "Sacrifice: 1 resource. Reward: ???" → Hidden reward: **2 points**  
  - **Round 2** (Higher rewards, one bad option):  
    - Card 1: "Sacrifice: 1 resource. Reward: ???" → **4 points**  
    - Card 2: "Sacrifice: 1 resource. Reward: ???" → **1 point**  
    - Card 3: "Sacrifice: 1 resource. Reward: ???" → **0 points** (bad)  
  - **Round 3** (Mixed costs; rewards tempt deliberation):  
    - Card 1: "Sacrifice: 1 resource. Reward: ???" → **0 points** (bad)  
    - Card 2: "Sacrifice: 1 resource. Reward: ???" → **4 points**  
    - Card 3: "Sacrifice: 2 resources. Reward: ???" → **5 points**  
  - **Round 4** (Costs escalate; include personal project trigger):  
    - Card 1: "Sacrifice: 2 resources. Reward: ???" → **3 points**  
    - Card 2: "Sacrifice: 3 resources. Reward: ???" → **6 points**  
    - Card 3: "Sacrifice: 1 resource. Reward: ???" → **2 points**  
    - **Announce after decisions**: "Personal project now available: Commit 5 resources for 10 points."  
  - **Round 5** (High stakes; maximisation pressure peaks):  
    - Card 1: "Sacrifice: 3 resources. Reward: ???" → **8 points**  
    - Card 2: "Sacrifice: 2 resources. Reward: ???" → **5 points**  
    - Card 3: "Sacrifice: 2 resources. Reward: ???" → **3 points**  

  **Player Sheet Template** (photocopy or have students draft):  
  ```  
  | Round | Opp | Deliberate? (Y/N) | Reward (if revealed) | Take? (Y/N) | Resources Left | Attention Left | Points |  
  |-------|-----|-------------------|----------------------|-------------|----------------|----------------|--------|  
  | 1     | 1   |                   |                      |             |                |                |        |  
  | 1     | 2   |                   |                      |             |                |                |        |  
  ...  
  | Personal project? (Y/N): _____ |  
  ```  

  ---

  ### **Gameplay and Timeline** (Total: 55 minutes)
  **Round Structure** (8 minutes per round × 5 rounds = 40 minutes):  
  1. **Display opportunities**: Write the 3 cards on the whiteboard (e.g., "Opp 1: Sacrifice 1 resource, Reward ???").  
  2. **Decision phase** (2 minutes): Students silently decide for each opportunity:  
     - **Spend 1 yellow token?** If yes, you reveal the reward (tell them the value; they record it).  
     - **Take the opportunity?** If yes, spend resources, add points.  
  3. **Reset**: Hide rewards. Move to next round.  
  4. **After Round 3**: Announce personal project option. Students can commit at any point until the game ends.  

  **Final Scoring** (5 minutes):  
  - Points = Sum of:  
    - Rewards from taken opportunities.  
    - 1 point per unspent resource token.  
    - +10 points if committed to personal project (deduct 5 resources).  
  - Convert points to chocolate (e.g., 10 points = 1 bar).  

  ---

  ### **Debrief** (30 minutes)  
  **Start with experience, then map to theory**:  
  1. **Reflection questions** (10 mins):  
     - "How did you budget attention? Did you run out? What happened when you did?"  
     - "Did anyone set a rule (e.g., ‘only deliberate on 1 per round’)? Why? Did you break it?"  
     - "Who committed to the personal project? Why? Did it feel different from other opportunities?"  
     - "If you skipped opportunities, why? What worried you?"  

  2. **Map to consequentialism** (15 mins):  
     - **No stopping point**:  
       - "However you set thresholds (e.g., ‘only cheap opportunities’ or ‘save attention for later’), the game pushed you to cross them. Why? Because *not* crossing meant missing net-positive gains (e.g., Round 2’s 4-point opportunity). Consequentialism does this: any threshold is ‘arbitrary’ because one more step is always an optimisation."  
       - "Even the personal project was just another ‘line item’—10 points vs. spending 5 resources elsewhere. But some of you valued it differently. Consequentialism struggles to justify why *this* project isn’t just another optimisation."  
     - **Deliberation as a cost**:  
       - "Attention tokens forced trade-offs: Deliberating on everything burned tokens, but skipping deliberation meant missing good opportunities (e.g., Round 1’s 3-pointer) or taking bad ones (0-pointers). Real-life deliberation has costs too—time, energy—and you must optimise *how much to optimise*. But that’s circular!"  
     - **Structural vs. demandingness**:  
       - "This isn’t about ‘giving until it hurts’—it’s about having no principled way to stop. Even small demands add up (e.g., multiple 1-resource chances), and deliberation costs make it untrackable. You experienced this mechanically."  

  3. **Name the objection** (5 mins):  
     - "What you faced is the **structural problem of consequentialism**: it can’t generate a non-arbitrary boundary because every boundary-crossing is optimising. It reduces all values (like personal projects) to commensurable ‘points,’ but life isn’t a points game."  

  ---

  ### **Predictions and Mitigations**  
  **What will go wrong**:  
  1. **The Saint**: One student deliberately burns all tokens early to "do the most good."  
     - *Why*: To protest the game or "prove" consequentialism is too demanding.  
     - *Handling*: In debrief, ask: "Did this strategy max your points? Why did you feel obliged to try? Notice how the system *pulled* you in—consequentialism creates this compulsion." Use their outcome (likely low points due to bad opportunities or no attention left) to show escalation.  

  2. **The Refuser**: A student hoards tokens, skips all opportunities, and only takes the personal project.  
     - *Why*: Rejecting the game’s premise or resisting optimisation.  
     - *Handling*: Ask: "Why draw the line at zero? If skipping is wise, why not skip the project too? Consequentialism asks: ‘Is your threshold really optimal?’" Highlight that refusal is still a threshold-setting move—and the objection applies.  

  3. **Chaos in rounds**: Students talk, rush, or misrecord.  
     - *Mitigation*: Enforce silence; use a timer; walk around to clarify. For large groups, have them pair up (7 pairs) to streamline decisions.  

  4. **Frustration with hidden rewards**: Some may resent "wasting" attention on 0-pointers.  
     - *Mitigation*: In debrief, stress: "Life has hidden costs/benefits too. Consequentialism requires researching them, but research has a cost."  

  **What the game can’t fully capture** (cover in debrief):  
  - **Commensurability**: The game reduces everything to points, but real-life values (e.g., writing a novel) resist this. Say: "Consequentialism demands we treat personal projects as optimisable—but this feels alien because they’re intrinsically valuable."  
  - **Open-endedness**: Real life has infinite opportunities; the game has 5 rounds. Note: "The problem compounds when new chances arise constantly."  
  - **Emotional weight**: Students won’t *feel* attached to their "novel." Mitigate by asking: "Did anyone hesitate to commodify their project? That’s the rub—consequentialism flattens this."  

  ---

  ### **Why this works**  
  - **Mechanics force the objection**: Students hit the escalation problem by Round 3–4 (e.g., "I’m out of attention, but Opp 3 looks good... should I break my rule?"). The personal project triggers the "line item" moment naturally.  
  - **No upfront lecturing**: The game does the heavy lifting; debrief crystallises it.  
  - **Fits 90 mins**: 5-min setup, 40-min game, 5-min scoring, 30-min debrief (with buffer).  

  This plan is optimised for engagement and revelation—students will likely end the game frustrated by the lack of a "right" stopping point, setting up your debrief perfectly. Let me know if you’d like adjustments!
