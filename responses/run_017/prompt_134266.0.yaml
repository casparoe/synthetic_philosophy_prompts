  The core of their experiment involves varying how the ambiguous urn is filled: using a hidden random device, a biased human filler who benefits if the participant loses, or a neutral human filler who doesn't know the participant's choice. They also want to test whether presenting the urns separately vs. together affects the aversion gap.

  They need the proposal to: sharply define the question, justify why this experiment is better than alternatives (like replicating with teens or armchair theorizing), outline an 8-week timeline using online participants, commit to predictions, identify a key disconfirming finding, define failure criteria, and honestly assess if the design can separate the two explanations. Format-wise, it must be continuous prose without headings or bullet points.

  The key challenges are: ensuring the design truly isolates agency from probability neglect, creating a feasible timeline, and making the justification compelling. The agency hypothesis predicts stronger aversion when the filler has incentive and knowledge, while the probability-neglect view predicts consistent aversion across fillers. A critical disconfirming result would be if all ambiguous conditions show equal aversion regardless of filler motives. Failure would be high attrition, floor/ceiling effects, or inability to replicate the classic gap.

  The proposed timeline: Week 1 for setup and piloting; Weeks 2-4 for Experiment 1 (agency variations); Week 5 for analysis; Weeks 6-7 for Experiment 2 (joint vs. separate evaluation); Week 8 for final analysis and reporting. Predictions include a spectrum of aversion aligned with filler incentives and a reduced gap in separate evaluation. The proposal must be concise yet thorough, ending with a clear statement of ambition and feasibility.
answer: |-
  Here’s a one-page proposal drafted as a continuous narrative:

  The central question this project aims to resolve is whether the aversion people show toward ambiguous options in decisions under uncertainty, famously demonstrated in the Ellsberg paradox, stems primarily from a discomfort with missing probabilistic information itself or from a strategic concern that the ambiguity masks deliberate manipulation by a hidden agent aiming to exploit their choice. While the standard explanation emphasizes aversion to the lack of known probabilities, I hypothesize that a significant component is "suspected agency": the feeling that the unknown composition of the ambiguous urn is not merely uncertain but was *chosen* by someone who might have set it against the participant's interests. To isolate these mechanisms, the experiment will manipulate the source of the ambiguity in the classic two-urn setup. Participants will choose whether to bet on drawing a red ball from a known urn (e.g., 50 red, 50 blue) or an ambiguous urn with unknown composition. Crucially, the ambiguous urn's origin will vary: in one condition, it was filled by a truly random device whose setting was fixed and hidden before the experiment began, removing any potential agency. In another, it was filled by a person who receives a bonus if the participant loses the bet, introducing clear hostile intent. In a third, it was filled by a person with no stake in the outcome and who never learns which color the participant chose, representing neutral agency without exploitation motive. Additionally, to test a secondary prediction of the agency account and reconcile conflicting reports in the literature, each of these ambiguous urn descriptions will be presented to participants in two distinct evaluation modes: either alongside the known urn (joint evaluation) or entirely on its own (separate evaluation). The agency hypothesis predicts that aversion to the ambiguous urn will be strongest when it was filled by a hostile agent, weaker for a neutral agent, and weakest (potentially negligible) when filled by a hidden random device, reflecting the degree of suspected manipulation. It further predicts that the aversion gap between the known and ambiguous urns observed in joint evaluation will significantly diminish or disappear in separate evaluation for the hostile agent condition, as the direct comparison fuels the sense of strategic opposition. The pure probability-neglect account, conversely, predicts consistent aversion across all ambiguous urn origins and minimal difference between joint and separate evaluation for a given origin, as the core issue is the lack of probability information itself, irrespective of its source or context.

  Pursuing this experiment is a far better use of eight weeks than simply replicating the classic Ellsberg finding with teenagers or engaging in purely theoretical debate for several reasons. A replication, while perhaps methodologically sound, offers little novel insight; we already know the effect exists in broad populations. An armchair argument cannot decisively adjudicate between the probability-neglect and agency explanations, as both can generate plausible post-hoc rationalizations of existing data. This experiment, however, directly pits the two accounts against each other by manipulating a key variable – the perceived intent behind the ambiguity – that the standard theory treats as irrelevant but the agency hypothesis deems central. It offers a clear, falsifiable prediction about the *pattern* of aversion across conditions that the probability-neglect view does not expect. Furthermore, testing the joint versus separate evaluation mode provides a unique leverage point: if the agency story is correct, the context of direct comparison should amplify aversion specifically when hostility is suspected, explaining why the gap sometimes closes when urns are judged alone. This design provides a concrete test with the potential to reshape our understanding of ambiguity aversion by highlighting a previously underappreciated social-cognitive component.

  The project will be executed over eight weeks using an online participant pool. Weeks 1 will involve finalizing the experimental scripts and scenarios using a platform like Qualtrics or Gorilla, ensuring clear and engaging descriptions of the urn-filling procedures, and pilot testing with a small group for clarity and timing. Weeks 2 through 4 will focus on recruiting and running the main sample of several hundred participants, randomly assigned to the six conditions (3 filler types x 2 evaluation modes). Each participant will make a series of incentivized choices (using small monetary rewards or lottery tickets for larger prizes) between bets on the known urn and the specific ambiguous urn they are presented with, or simply state their minimum selling price for a bet on the ambiguous urn in the separate evaluation condition. Week 5 will be dedicated to cleaning and preliminary analysis of this data, focusing on choice proportions or certainty equivalents across conditions. Based on the agency hypothesis, I predict a clear spectrum: strongest aversion (lowest choice rate for ambiguous/ lowest valuation) for the hostile filler, moderate aversion for the neutral filler, and significantly weaker (perhaps near-neutral) aversion for the random device filler. I also predict a significant interaction with evaluation mode: the aversion gap between known and ambiguous hostile urn will be large in joint evaluation but much smaller in separate evaluation, while the gap for the random device urn should be small and consistent across modes. Weeks 6 and 7 will run a follow-up experiment or deeper analysis if needed, perhaps probing participants' beliefs about the filler's intent or knowledge, or testing robustness with slight variations. Week 8 will consolidate findings, perform final statistical analyses, and begin drafting the report.

  The single finding that would most damage my agency hypothesis would be observing statistically indistinguishable levels of aversion across the three ambiguous filler conditions *in the joint evaluation mode*. If aversion to the urn filled by a hidden random device is just as strong as aversion to the urn filled by a hostile agent, it strongly suggests the core driver is indeed the missing probability information itself, not the perceived intent behind the ambiguity. While differences in the strength of the effect across fillers could still exist, equivalence would be a major blow. The project would be deemed a failure if significant methodological issues arise preventing a clear test, such as extremely high attrition rates, floor or ceiling effects where choices show no variation, or a complete failure to replicate the basic Ellsberg gap in the known vs. ambiguous (hostile) joint condition, casting doubt on the entire setup. Crucially, I believe the design as described *can* separate the explanations. The manipulation of filler intent is targeted directly at the agency mechanism while holding the core ambiguity constant. The joint vs. separate manipulation provides an additional, orthogonal test predicted only by the agency account. If aversion tracks filler motive and evaluation mode as hypothesized, it provides compelling evidence for the agency component. Conversely, if aversion remains flat across fillers and modes, it powerfully supports the probability-neglect view. This experiment offers a decisive step beyond the classic result, moving from demonstrating *that* ambiguity aversion exists to probing *why* it arises.
