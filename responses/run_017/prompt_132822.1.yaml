prompt: |-
  Hi — I'm putting together a dissertation prospectus and I keep getting stuck before I start. The topic is dispositions, but my angle is applied: I care about how the special sciences and ordinary speech get away with dispositional predicates ("this compound is hepatotoxic", "this cultivar is drought-tolerant", "he's irritable", "that bylaw is unenforceable"), and I want a metaphysics of dispositions good enough to underwrite attributions like those — not one tailored to win arguments in a seminar room. So before I pick a theory, can you write me the spec: the desiderata any adequate theory of what it is for something to have a disposition has to meet for that purpose, each with the case or consideration that motivates it, and each marked as either non-negotiable or as a preference of one camp?

  I know the two stock problem cases, so give them a line each at most: the fink (the glass would lose its fragility at the instant you dropped it) and the mask (it stays fragile, but something interferes so it never breaks). The cases I actually can't get any single theory to handle together are these, and I'd like your list built partly around them: (1) the one-shot mask — packing foam that absorbs the impact but is destroyed in doing so, so the second drop does shatter it, which means any analysis that just asks what happens on the stimulus occurring will call the glass not fragile; (2) the booster, i.e. an inverse fink — a tablet that is not water-soluble in the bottle, but where contact with water itself triggers a change that makes it dissolve, so it dissolves while intuitively never having been soluble; (3) self-annealing glass — you strike it, it micro-cracks, a built-in mechanism instantly re-bonds it, and the next strike would micro-crack it again, so the interfering condition is intrinsic to the object rather than something done to it; (4) the permanently packed vase — fragile, but the packing is never coming off and nothing will ever strike it, where I want to know what a theory is even allowed to say distinguishes this from a vase that simply isn't fragile; (5) the partner problem — solubility needs a solvent and fragility needs something to be struck against, and whether the partner goes inside the stimulus or stays in the background changes what the theory predicts, with "dropped on a pillow" and "dropped on concrete" looking like a continuum rather than a masked/unmasked divide; (6) quiescent dispositions — the stabilizer, the prophylactic, the drug disposed to prevent the headache — where the manifestation is nothing happening at all; (7) second-order cases, things disposed to acquire dispositions (a vaccine, a seed that needs cold stratification before it can germinate), where whatever analysis you give has to iterate; and (8) impossible-stimulus cases, like being soluble in a solvent that no where exists or conductive at a temperature the laws never permit.

  The part I most want is the editorial judgment: which of the things people demand of a theory here are genuine requirements and which are just prejudices of a camp — non-circularity, intrinsicality, the demand that every disposition be grounded in a categorical base, the ban on quantifying over merely possible interventions or ideal conditions, the demand that dispositions make a difference to what actually happens. Then flag any pair of desiderata you suspect can't be jointly satisfied, because if the list turns out to be unsatisfiable as a whole that's the result I'd rather have now than in year three. Tell me which single requirement does the most exclusionary work. A very brief score of the three live options is fine at the end — the plain conditional analysis, the conditional analysis with a ceteris paribus or ideal-conditions clause, and the view that drops conditionals and identifies the disposition with its causal basis — but keep the weight on the criteria and the cases, since I can do the scoring myself. A table is fine if that's easier, and please say something about how a theory is supposed to cope with the fact that fragility and solubility obviously come in degrees and the manifestation verbs are vague, since I suspect that's the requirement everyone quietly ignores.
reasoning: |-
  Okay, let's tackle this user's query. They're working on a dissertation prospectus about dispositions, specifically focusing on how dispositional predicates are used in special sciences and everyday language. The user is stuck before starting because they need a set of criteria (desiderata) that any adequate theory of dispositions must meet, especially for applied contexts. They provided specific problem cases that existing theories struggle with, and they want to distinguish between non-negotiable requirements and camp preferences.

  First, I need to parse the user's main goal: a metaphysics of dispositions that supports real-world attributions, not just academic debates. The user listed eight cases where current theories fail, like one-shot masks or boosters. These cases highlight gaps in standard analyses. The user also wants editorial judgment on which theoretical demands are essential versus ideological.

  The user's deeper needs seem to be clarity on feasible desiderata and avoiding dead ends in their research. They mentioned potentially unsatisfiable criteria, so identifying conflicts is crucial. They might also need reassurance that their focus on applied metaphysics is valid, countering possible academic pushback.

  Breaking down the desiderata, non-negotiable ones should include Realism about Dispositional Properties and Attributability. Realism ensures dispositions aren't reduced away, which is vital for special sciences. Attributability addresses the core function of dispositional talk. Normality Sensitivity is also key because real-world contexts rely on typical conditions.

  Degrees and Vagueness must be non-negotiable since dispositions like fragility or solubility aren't binary. Theories ignoring this are inadequate for applied use. Causal Significance might be negotiable; some theories (e.g., categoricalism) downplay it, but it's important for scientific relevance.

  Intrinsicality is tricky. While some cases (partner problem) show relational aspects, intrinsicality is often assumed. Marking it as negotiable with caveats makes sense. Non-Circularity is another point of contention. Pure dispositionalists accept circularity, but it's problematic for analysis. This should be negotiable but noted as a preference.

  Grounding in Categorical Bases is a divisive point. Anti-Humeans reject it, so it's negotiable. The ban on Quantification Over Merely Possible Interventions is important for naturalness but may conflict with ideal conditions. This should be negotiable with context.

  The user's cases drive these desiderata. For example, the one-shot mask requires Intrinsicality since the foam is external, but self-annealing glass makes the interferer intrinsic, challenging that. Quiescent dispositions need Causal Significance without manifestations. Booster cases challenge Realism because the tablet dissolves without prior solubility.

  Conflicts arise, like between Realism and Causal Significance. If a disposition never manifests (permanently packed vase), does it exist? Realism says yes, but Causal Significance might require actual effects. Another conflict is between Intrinsicality and the Partner Problem. Partners are external, so dispositions can't be purely intrinsic.

  The user also needs to handle degrees and vagueness. Any theory must account for thresholds and context-sensitivity. Current theories often ignore this, so highlighting it as non-negotiable is essential.

  In scoring existing theories, conditional analyses fail due to finks and masks. Ceteris paribus versions struggle with defining normal conditions. Categorical basis theories have grounding issues but handle non-manifesting cases better. However, they might miss normative aspects.

  The user's unspoken need might be validation of their applied approach. Emphasizing that desiderata prioritize real-world use over theoretical purity addresses this. Also, flagging unsatisfiable criteria early saves them from future pitfalls.

  In conclusion, structuring the desiderata with clear non-negotiables and negotiables, based on problem cases, provides the needed framework. Highlighting conflicts and degrees of dispositions ensures the prospectus is robust and application-oriented.
answer: |-
  Here’s a rigorously structured **Desiderata Specification** for a metaphysics of dispositions tailored to underwrite special science and ordinary attributions, grounded in your problem cases and annotated for negotiability. Conflicts and editorial judgments are flagged.

  ---

  ### **Core Desiderata for an Applied Theory of Dispositions**
  *(Non-negotiable = ⚠️ | Negotiable = ⦿)*

  | **Desideratum**                          | **Motivation & Case-Driven Basis**                                                                 | **Negotiability** | **Conflicts With**                     |
  |------------------------------------------|---------------------------------------------------------------------------------------------------|-------------------|----------------------------------------|
  | **1. Realism about Dispositional Properties** | Special sciences treat dispositions as real explanatory properties (e.g., hepatotoxicity in toxicology). Rejecting realism undermines applied attributions. Cases: *Permanently packed vase* (must be fragile despite no manifestation), *Quiescent dispositions* (stabilizers exist even when stabilizing). | ⚠️ **Non-negotiable** | Causal Significance (if demanding actual manifestations) |
  | **2. Attributability**                   | Must explain why we *correctly* call the tablet "not water-soluble" (*booster*) and foam-packed glass "fragile" (*one-shot mask*). Analysis must track pre-stimulus properties, not just outcomes. | ⚠️ **Non-negotiable** | —                                      |
  | **3. Normality Sensitivity**             | Dispositions are attributed relative to normal environments/partners (e.g., "drought-tolerant" assumes standard soil, climate). Cases: *Partner problem* (pillow vs. concrete), *Quiescent dispositions* (prophylactic works in typical bodies). | ⚠️ **Non-negotiable** | Intrinsicality (if normality is extrinsic) |
  | **4. Degrees & Vagueness Compatibility** | Dispositions admit of scalar variation ("very fragile," "mildly soluble") and vague thresholds ("irritable"). Ignoring this invalidates real-world usage. | ⚠️ **Non-negotiable** | Binary analyses (e.g., simple conditionals) |
  | **5. Intrinsicality**                    | *Self-annealing glass* is fragile *due to intrinsic structure*, even if it self-masks. But *partner problem* shows dispositions aren’t *purely* intrinsic (solubility requires solvent). **Editorial**: Intrinsicality is overemphasized; what matters is *stability* under normal conditions. | ⦿ **Negotiable** (Preference of intrinsicalist camps) | Normality Sensitivity, Partner Problem |
  | **6. Non-Circularity**                   | Avoid defining dispositions via other dispositions (e.g., "fragile iff disposed to break *when dropped*" – but "dropped" is dispositional). **Editorial**: Circularity is *unavoidable* in fundamental metaphysics; for applied purposes, grounding in scientific mechanisms suffices. | ⦿ **Negotiable** (Anti-circularity is a camp prejudice) | — |
  | **7. Grounding in Categorical Bases**    | Science demands dispositions be grounded in physical structures (e.g., molecular bonds for solubility). **Editorial**: Vital for scientific utility, but ordinary attributions (e.g., "unenforceable bylaw") may lack micro-bases. | ⦿ **Negotiable** (Preference of categoricalist camps) | Realism (if bases reduce dispositions away) |
  | **8. Causal Significance**               | Dispositions should explain *why* manifestations occur (e.g., hepatotoxicity causes liver damage). Cases: *Booster* (dissolution must be caused by solubility, not magic). | ⦿ **Negotiable** (But highly recommended for applied work) | Quiescent dispositions (no "occurrence" to cause) |
  | **9. Ban on Quantifying Over Merely Possible Interventions** | Attributions must work without invoking *ideal* conditions (e.g., "soluble in nonexistent solvent" is nonsense; *impossible-stimulus* cases are vacuous). **Editorial**: Non-negotiable for naturalism. | ⚠️ **Non-negotiable** | Ceteris paribus analyses |
  | **10. Iterability**                      | Must handle *second-order dispositions* (e.g., vaccine disposed to confer immunity). Cases: *Seed needing stratification* – the latent disposition must be real pre-stimulus. | ⚠️ **Non-negotiable** | — |

  ---

  ### **Problem Cases & Desiderata Mapping**
  - **One-shot mask (foam)** → Desideratum 2 (Attributability), 5 (Intrinsicality challenged)  
  - **Booster tablet** → Desideratum 2 (Attributability), 8 (Causal Significance)  
  - **Self-annealing glass** → Desideratum 1 (Realism), 5 (Intrinsicality)  
  - **Permanently packed vase** → Desideratum 1 (Realism), 9 (No ideal conditions)  
  - **Partner problem** → Desideratum 3 (Normality Sensitivity)  
  - **Quiescent dispositions** → Desideratum 1 (Realism), 8 (Causal Significance challenged)  
  - **Second-order dispositions** → Desideratum 10 (Iterability)  
  - **Impossible stimuli** → Desideratum 9 (No quantification over impossibilia)  

  ---

  ### **Editorial Judgments & Conflicts**
  - **Most Exclusionary Desideratum**: **Normality Sensitivity** (3). It forces context-relativity, clashing with intrinsicality (5) and demanding a parameterized theory.  
  - **Key Conflict**: **Realism** (1) vs. **Causal Significance** (8). *Permanently packed vase* and *quiescent dispositions* require unmanifested properties, but causal accounts demand manifestations. *Resolution*: Admit causally inert dispositions *if* grounded in structure (Desideratum 7).  
  - **Underacknowledged Requirement**: **Degrees & Vagueness** (4). Theories (especially conditional analyses) often binarize dispositions, ignoring scalar reality.  
  - **Camp Prejudices**:  
    - *Intrinsicality* (5): Overly restrictive; real dispositions (e.g., "infectious") are relational.  
    - *Non-Circularity* (6): An unrealistic demand for a fundamental theory; harmless in applied contexts if grounded scientifically.  
    - *Grounding in Categorical Bases* (7): Essential for science, but ordinary language often attributes dispositions *without* known bases (e.g., "irritable").  

  ---

  ### **Brief Theory Scorecard**
  | **Theory**                           | **Finks/Masks** | **One-Shot Mask** | **Booster** | **Permanently Packed Vase** | **Degrees/Vagueness** | **Applied Viability** |  
  |--------------------------------------|-----------------|-------------------|-------------|-----------------------------|----------------------|-----------------------|  
  | **Plain Conditional Analysis**       | ✗ (Finks)       | ✗                 | ✗           | ✓                           | ✗                    | Poor                 |  
  | **Ceteris Paribus Conditional**      | △ (Partial)     | △                 | △           | △ (Needs "normal" packing)  | △                    | Moderate (but "normal" is vague) |  
  | **Causal Basis Theory**              | ✓               | ✓                 | ✓           | ✓                           | ✗ (Often binary)     | **Best** (if + Desideratum 4 & 7) |  

  **Key**: ✓ = Handles well, △ = Partial/contextual, ✗ = Fails  
  **Verdict**: **Causal Basis Theory** (identifying dispositions with structural properties) best satisfies *Realism*, *Attributability*, and *Iterability*, especially when augmented with *Normality Sensitivity* and scalar grounding. *Ceteris paribus* approaches are viable but risk vagueness. Avoid plain conditionals.

  ---

  ### **Final Note**
  **Degrees and Vagueness** (Desideratum 4) is the most systematically ignored requirement. Any viable theory must treat dispositions as *threshold-sensitive properties* (e.g., "fragile if shatters under force F in context C"), where thresholds are set by pragmatic/scientific norms. This bridges metaphysics and practice—your prospectus’s niche. **Conflict alert**: Normality Sensitivity + Vagueness may resist formalization, but this reflects reality (e.g., "drought-tolerant" is fuzzy). Pursue a **grounded, scalar, normality-relative causal basis theory**. If this seems unsatisfiable due to case conflicts (e.g., booster vs. one-shot), that’s a dissertation-worthy result.
