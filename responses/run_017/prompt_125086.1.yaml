  The user has very specific requirements: no citations, strict 550-word limit, and a clear structure that addresses both philosophical and biostatistical perspectives. They're particularly concerned about their biostatistics colleague's dismissal of this as "just confounding." I need to help them frame this objection as a substantive research question rather than semantics.

