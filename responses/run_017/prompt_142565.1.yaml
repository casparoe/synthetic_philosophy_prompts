  (iii) No feature shared by all and only the members - This follows logically from (i) and (ii). The games example demonstrates this well.

  (iv) Genuine borderline cases - The games example implies this, as there's no sharp boundary. This seems plausible for planets too, as shown by the Pluto controversy.

  (v) No underlying nature - Here's where it gets tricky. The games example doesn't prove this, and for planets, there's clearly astrophysical reality involved. Wittgenstein wasn't making metaphysical claims.

  (vi) No fact of the matter - This doesn't follow from family resemblance. The grad student's claim relies on this, but it's a non sequitur. Similarities can be objective even without essences.

  (vii) Concept is defective - Wittgenstein wasn't suggesting this at all. Family resemblance concepts work perfectly well for everyday use.

  (viii) Disputes are merely verbal - Again, not necessarily true. The Pluto debate involved substantive scientific considerations about orbital dynamics and solar system formation.

  The key insight is that the grad student conflated family resemblance with anti-realism. Family resemblance describes how we categorize, not whether categories track reality. For planets, the debate was about which categorization best reflects astronomical realities - it wasn't arbitrary.

  Regarding the user's additional questions: Family resemblance isn't incompatible with hidden essences - something could have an underlying nature that manifests through complex surface similarities. And yes, the user is right to suspect the grad student confused stipulative definitions with natural kinds. The real issue isn't family resemblance but whether "planet" is a natural or conventional category - and astronomy suggests it's a mix of both.

  The Pluto controversy wasn't pointless because it forced astronomers to clarify what features matter for planetary classification based on new discoveries. The outcome reflected empirical evidence about the structure of our solar system, not just linguistic preference.
answer: |-
  Here's your menu for the reading group, addressing each claim and the Pluto question directly. Short verdicts, no citations — just philosophical and astronomical clarity.

  ### The Menu: What "X is a family resemblance concept" can mean

  1.  **(i) No single feature shared by every member.**  
      *   **Wittgenstein Supported?** YES. This *is* the core observation about games.  
      *   **Platitude?** NO. It's a substantive point about how many concepts work.  
      *   **Defensible?** YES, for many concepts (games, chairs, planets).  
      *   **Gets to "Pluto pointless"?** NO. Lack of one universal feature doesn't make distinctions arbitrary.

  2.  **(ii) No set of necessary-and-sufficient conditions (N&S).**  
      *   **W Supported?** YES. Directly implied by (i).  
      *   **Platitude?** NO. Counter to classical theories of concepts.  
      *   **Defensible?** YES, widely accepted for many concepts.  
      *   **Gets to "Pluto pointless"?** NO. Lack of N&S doesn't mean *no* objective basis for distinctions.

  3.  **(iii) No feature shared by all and only the members.**  
      *   **W Supported?** YES. Follows from (i).  
      *   **Platitude?** NO.  
      *   **Defensible?** YES.  
      *   **Gets to "Pluto pointless"?** NO. Same reasons as (i) and (ii).

  4.  **(iv) Genuine borderline cases; boundary is fuzzy.**  
      *   **W Supported?** YES. Strongly implied by the structure of family resemblance.  
      *   **Platitude?** NO.  
      *   **Defensible?** YES, for many concepts (e.g., "mountain" vs. "hill", some biological taxa).  
      *   **Gets to "Pluto pointless"?** NO. Fuzziness doesn't mean *all* cases are borderline or arbitrary. Pluto might be a borderline case, but the *debate* about why it is/isn't can be substantive.

  5.  **(v) No underlying nature; not a "real kind".**  
      *   **W Supported?** NO. Wittgenstein described *linguistic use*, not metaphysics. He wasn't claiming games lack a physical basis.  
      *   **Platitude?** NO. Highly contentious claim.  
      *   **Defensible?** CONTEXT-DEPENDENT. True for artifacts (games), maybe not for biological/natural categories.  
      *   **Gets to "Pluto pointless"?** ONLY IF TRUE. But family resemblance observation *does not prove* this for planets.

  6.  **(vi) No fact of the matter; purely up to us.**  
      *   **W Supported?** NO. Family resemblance is about *how we apply concepts*, not whether reality constrains that application.  
      *   **Platitude?** NO. Radical anti-realism.  
      *   **Defensible?** DEBATABLE, but NOT implied by family resemblance.  
      *   **Gets to "Pluto pointless"?** YES. **This is the grad student's leap.** But it's a *non sequitur* from family resemblance alone. Your hunch is right: overlapping similarities (e.g., orbital dominance, hydrostatic equilibrium, formation history) can be objective features. Deciding *which* similarities matter most for classification can be guided by the world, not just whim.

  7.  **(vii) Concept is defective; we'd do better without it.**  
      *   **W Supported?** NO. Wittgenstein showed how such concepts *work*, not that they're broken.  
      *   **Platitude?** NO.  
      *   **Defensible?** RARELY. Usually false; family resemblance concepts are often perfectly functional.  
      *   **Gets to "Pluto pointless"?** NO. Even if "planet" is fuzzy, it's astronomically useful.

  8.  **(viii) Disputes are merely verbal; settled by stipulation.**  
      *   **W Supported?** NO. While agreement in judgments is part of language use, he didn't reduce all disputes to *mere* stipulation.  
      *   **Platitude?** NO.  
      *   **Defensible?** SOMETIMES, but not always. Depends on whether the dispute is about objective features or just preferred labeling.  
      *   **Gets to "Pluto pointless"?** ONLY IF TRUE. But the Pluto debate involved empirical facts (Kuiper Belt objects, orbital dynamics) and arguments about which features best capture solar system structure. Not *just* words.

  ### Your Two Bonus Questions

  1.  **Is family resemblance incompatible with an essence?**  
      **NO.** Wittgenstein's point is about *how we identify and apply the concept* based on observable similarities. It doesn't rule out a hidden underlying essence causing those similarities. A messy cluster of surface properties *could* be symptoms of a hidden nature. Family resemblance is about epistemology/semantics, not necessarily metaphysics.

  2.  **Is "planet" the wrong example? Is the distinction between stipulative and natural kinds doing the work?**  
      **YES, THIS IS KEY.** The grad student **slipped from "family resemblance" to "stipulative convention"**.  
      *   **Stipulative/Functional Kind:** Defined by purpose/convention (e.g., "dwarf planet" for dynamical grouping). Boundaries *are* set by agreement.  
      *   **Natural Kind:** Presumed to reflect fundamental structure (e.g., "water = H₂O"). Boundaries discovered, not stipulated.  
      *   **"Planet" is Hybrid:** It has natural aspects (physics of formation, hydrostatic equilibrium) and conventional aspects (where we draw the dynamical line, historical/cultural weight).  
      **The Real Work:** The debate was about **which features (natural or dynamical) should be primary for classification**, given new empirical discoveries (Kuiper Belt). This is *substantive*, not pointless. Family resemblance explains *why* drawing the line is hard (no N&S), not that it's arbitrary.

  ### The Pluto Verdict
  The grad student jumped to **(vi)** or **(viii)**, claiming "no fact of the matter." **Family resemblance (i-iv) does NOT support this leap.** Your hunch is spot-on: overlapping similarities (e.g., size, shape, orbit) are objective features. The *weight* given to different features (e.g., "clearing its orbit" vs. hydrostatic equilibrium) involves scientific judgment about which best carves nature *and* serves astronomy, but it's **not mere taste**. The "fuss" forced a clearer, empirically informed definition reflecting solar system structure. Hardly pointless. Wittgenstein helps us see why the *concept* is complex, not why the *debate* was vacuous.
