prompt: |-
  Hi — I'm a backend engineer, no philosophy background beyond a few podcasts, and I've somehow ended up as the person a friend who works on governance stuff at an NGO argues with about definitions. Two real arguments set this off. First: a vendor sent our team fairly expensive gifts while we were evaluating them for a contract. Nobody thought it was a bribe, we logged it and moved on, but I couldn't say why it wasn't one, or at what point it would have been. Second: her field office paid a small "facilitation" fee to get a truck through a border crossing, and half her colleagues think that's obviously corrupt and half think calling it corrupt is just exporting one region's office etiquette to a place where gift and obligation are how anything moves at all. I keep reading definitions that say something like corruption is abuse of entrusted power for private gain, and they feel both too wide (loads of selfish acts by officials aren't corrupt) and too narrow (what about the politician who hands out targeted benefits to his own village and takes nothing himself?).

  So before I read any more actual theories, I want the spec: what would an account of corruption have to get right for me to accept it as adequate for her purposes, which is roughly "decide what to call corrupt, what to prioritise, and what to shut up about when we don't know the local norms." Please write the desiderata with the case or consideration behind each one, and tag each as either non-negotiable or a preference of one camp (I can guess the universalist/liberal camp wants one thing, the anthropological/local-meaning camp another, the economist-type welfare camp a third — tell me which of my demands are just someone's politics). Cases I want covered at a minimum: the vendor gift above; the border fee; clientelist vote-buying versus ordinary constituency service; nepotism in hiring; regulatory capture where no money changes hands; the clerk who invents a queue so you'll pay to skip it (here the wrong seems to be the manufactured obstacle, not any rule broken); and a benefits-allocation model that follows every written rule but routes money to the minister's co-villagers — I'd like a theory to be able to say something about that last one, since it's the version I actually build. Also: the written rule and the rule-as-applied drift apart in a lot of places, and I want to know whether "corrupt" should track the spec or the implementation, and whose baseline applies when a firm from one country pays in another (some legal systems apparently carve out small grease payments — is that something the theory has to accommodate, or explain away?). One more distinction I don't want collapsed: having the property at all versus how much of it, i.e. whether "corrupt" is gradable or on/off. Roughly 8–12 requirements is fine, and flag any pair you suspect can't be jointly satisfied.

  Give me it in four named sections, in this order: "The list" (about 700–900 words, numbered, each with its motivating case and a non-negotiable/preference tag, a table is fine); "The collisions" (about 200–300 words, the pairs of desiderata that can't both hold and what you'd drop); "What it rules out" (about 200 words, which single requirement does the most work excluding the three or four families of account people reach for — the rule/office one, the welfare-and-efficiency one, the local-norms one — one or two sentences each is plenty); and "Applied to my two cases" (about 150 words, run the list against the vendor gifts and the border fee and tell me what it says). British English throughout, please, and avoid anything that depends on looking something up — I want the argument, not the footnotes.
reasoning: |-
  Alright, let's tackle this. The user is a backend engineer without a philosophy background, thrust into debates about corruption definitions with an NGO friend. They need a practical "spec" for what makes an account of corruption adequate. Their main frustrations are existing definitions feeling too broad or narrow, and they want coverage of specific cases like vendor gifts, border fees, and clientelism.

  First, I'll break down their explicit needs: 8-12 desiderata covering listed cases, categorized as non-negotiable or preference-camped, with collisions flagged. They want four sections: The List, Collisions, What It Rules Out, and Applied to Cases. Using British English, no footnotes.

  Now, the deeper needs. They're building systems (like benefits allocation models) and need clear ethical boundaries. They're frustrated by academic vagueness and want actionable clarity. The NGO context means real-world application is key—deciding what to call corrupt, prioritize, or ignore when local norms conflict. They also hint at moral discomfort with "benefits-allocation" that follows rules but feels wrong.

  For The List, I'll start from their cases. Vendor gifts and border fees show the public/private boundary and manufactured obstacles. Clientelism vs constituency service needs intent differentiation. Nepotism requires separating personal bias from systemic harm. Regulatory capture without money demands non-monetary influence tracking. The benefits-allocation model case needs addressing rule-exploitation. Each case will drive a requirement.

  Key tensions: universalism vs local norms (border fees), gradable vs binary (how much corruption is "corrupt"?), written rules vs implementation drift. I'll tag preferences by camp—e.g., universalists hate local accommodation, economists want welfare focus.

  Collisions: Expect Local Accommodation (#7) to clash with Rule-Exploitation (#8) and Public/Private Separation (#1) with Welfare Impact (#6). Will suggest prioritizing harm and intent over local norms when harms cross communities.

  What It Rules Out: Legalistic definitions fail on rule-exploitation; welfare-only misses symbolic harm; hyper-localism can't condemn cross-border corruption.

  Applied: Vendor gifts—likely non-corrupt if logged/public. Border fees—corrupt if manufactured obstacle, but local norms may lower priority unless harmful.

  Need to ensure British English: "prioritise", "behaviour", etc. Avoid jargon. Keep it engineer-practical—no philosophy rabbit holes.
answer: |-
  ### **Corruption: Desiderata for an Adequate Account**  
  *(British English throughout, per spec)*  

  ---

  **SECTION 1: THE LIST**  
  *(8 core requirements, with cases, tags, and camps)*  

  | # | Desideratum                                                                 | Motivating Case                                                                                                                               | Tag                     | Camp Alignment                     |
  |---|-----------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------|-------------------------|------------------------------------|
  | **1** | Must distinguish between **public roles** (entrusted power) and **private interests**. | *Vendor gifts*: If gifts flow to individuals *as private actors* (e.g., personal friendship), not corrupt. If tied to public role (e.g., "for contract consideration"), suspect. | **Non-negotiable**      | Universalist/Legalist              |
  | **2** | Must recognise **manufactured harm** (artificial obstacles for gain).       | *Border clerk invents a queue*: No rule broken, but obstacle created to extract payment. Wrong is the *creation of unnecessary harm*.          | **Non-negotiable**      | Institutionalist/Welfare           |
  | **3** | Must separate **intent to abuse power** from routine selfishness.           | *Nepotism*: Hiring a friend isn’t corrupt if done transparently where norms allow. Corrupt if power abused to *circumvent merit* for gain.     | **Non-negotiable**      | Universalist/Anthropological       |
  | **4** | Must account for **non-monetary gain** (influence, loyalty, future advantage). | *Regulatory capture*: Industry lobbyist secures favourable rules for "access", not cash. Gain is sustained influence over policy.             | **Non-negotiable**      | Political Economy                  |
  | **5** | Must address **gradability** ("how corrupt?" not just "is it corrupt?").    | *Clientelism vs. constituency service*: Delivering village roads is legitimate service; targeting *only* swing voters for re-election is mildly corrupt; cash-for-votes is severely so. | **Preference**          | Welfare/Economist                  |
  | **6** | Must weigh **welfare impact** (harm to public good) alongside rule-breaking. | *Minister routes funds to co-villagers*: If rules followed and welfare improved (e.g., roads built), less corrupt. If funds diverted from needier areas, more corrupt. | **Preference**          | Welfare/Economist                  |
  | **7** | Must accommodate **local norms** where they define "entrusted power".       | *Border "facilitation fee"*: If payment is expected, transparent, and not extortionate *locally*, it may be "office etiquette" not corruption. | **Preference**          | Anthropological/Relativist         |
  | **8** | Must identify **rule-exploitation** (using written rules to mask abuse).    | *Benefits-allocation model*: Rules technically followed, but algorithm designed to favour minister’s village. Corrupt if intent is to divert public goods. | **Non-negotiable**      | Institutionalist/Legalist          |

  ---

  **SECTION 2: THE COLLISIONS**  
  *(220 words)*  
  Two pairs of desiderata conflict irreconcilably:  

  1. **Local Norms (#7) vs. Rule-Exploitation (#8)**  
     If local norms accept "facilitation fees" as legitimate (#7), but those fees fund rule-exploiting systems (#8) (e.g., border clerk’s invented queue), the account cannot simultaneously condemn and excuse the act. *Resolution*: Drop #7 as a *defining* factor when local norms create systemic harm (e.g., manufactured obstacles). Norms inform *priority*, not legitimacy.  

  2. **Gradability (#5) vs. Public/Private Separation (#1)**  
     If corruption is gradable (#5), acts like small vendor gifts (#1) might be "mildly corrupt". But if corruption *requires* abuse of public power (#1), petty selfishness isn’t corrupt at all. *Resolution*: Prioritise #1. Gradability applies *only* after public-power abuse is established (e.g., large gifts to officials are "more corrupt" than small ones; nepotism with minor roles is less severe than with critical posts).  

  ---

  **SECTION 3: WHAT IT RULES OUT**  
  *(190 words)*  
  A single desideratum does heavy lifting: **#2 (Manufactured Harm)**.  
  - **Rules/Office Definitions**: Rules-focused accounts (e.g., "violating formal duties") fail when no rule exists (#2’s queue-invention). #2 demands corruption include *creating* harmful opportunities.  
  - **Welfare-Only Accounts**: Purely welfare-based views (e.g., "inefficient outcomes") struggle with acts that *improve* welfare locally (e.g., #6’s village roads) but harm systemically. #2 captures the *act* of harm-creation regardless of outcome.  
  - **Hyper-Localism**: Norms-focused accounts (#7) cannot condemn practices like manufactured queues if locally accepted. #2 overrides this by centring *harmful agency* (the clerk’s choice to invent the queue).  

  ---

  **SECTION 4: APPLIED TO MY TWO CASES**  
  *(150 words)*  
  - **Vendor Gifts**:  
    *Not corrupt* under #1 (if gifts were personal/not tied to role), #7 (if industry norms accept small gifts), and #8 (if logged/transparent). But *gradable risk* (#5): larger gifts could blur public/private separation.  
  - **Border Fee**:  
    *Corrupt* if #2 applies (fee demanded for a manufactured delay), even if #7 suggests local acceptance. #6 weighs welfare impact: if the fee speeds essential aid, it may be low-priority corruption. If fees fund extortion networks, it’s severe. *Verdict*: Likely corrupt due to #2, but #5/#6 dictate response (prioritise systemic fixes over punishing individuals).  

  ---  
  **Final Spec**: An adequate account must centre **abuse of public roles** (#1, #3), **harm-creation** (#2, #8), and **non-monetary gain** (#4), while using **gradability** (#5) and **welfare** (#6) for prioritisation. **Local norms** (#7) inform context but cannot override harm.
