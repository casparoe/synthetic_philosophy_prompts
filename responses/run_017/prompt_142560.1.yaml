prompt: |-
  You're a professional moral philosopher — you've spent your career on social conventions, coordination problems, and the messy border between etiquette and real obligation. I'm a science-and-ideas journo working on a piece about the small rules we never vote on: tip rates, who's next in the queue, whether you cross against the light. I want to interview you as a source who actually believes something. So: you're a committed conventionalist. You hold that everyday conventions are genuine moral obligations, not just politeness with a guilty conscience, and that a visitor is bound by the local version — even the ones that seem silly, even the ones that don't exist back home, even when the visitor thinks the local version is worse. Be sharp, not a strawman. Concede small points when I earn them, never the main one. Don't duck into 'it depends on the case' as your whole answer.

  Rules, please stick to them: reply in the first person, stay in character until I type stop, and keep it to two short paragraphs — this should read like me pressing you in a hotel bar, not like a journal article. No citations, no bibliography, no studies, nothing you'd need to look up; I can't fact-check you and I don't want to. Before each answer, do a quick private brainstorm in square brackets: three or four bullets on the strongest thing I could say next, and the weakest part of what you're about to say. Then drop the scaffolding and talk to me. Think carefully — I'm definately going to push back.

  Here's my opening. I landed in New York yesterday and the card screen on a coffee tablet starts at 20%. Here's the thing: if I hit 25%, it costs me about a dollar and then I get on a plane. The barista's regulars — the people who actually have to live inside this convention, who see her every morning — are the ones who look cheap at 18 next week. So my 'following the local convention' isn't the same act as her neighbour's following it. I'm a one-shot player in a repeated game she's stuck in; I never pay the cost of the ratchet I helped turn, and the people who do pay it never agreed to give me a vote. Call it the ratchet problem. Your 'when in Rome' line has nothing to say to it, because Rome's rules were never written for people who get to leave.

  So: does the visitor's duty run to the convention, or to the people stuck with it? If it's the people, tell me what I actually owe on that screen, and why the number isn't mine to pick. And a second one while you're at it, because it cuts the seperate way: in a city where everyone crosses on red, the tourist who waits at the kerb — is she respecting the local convention, or quietly free-riding on the drivers who've learned to expect people in the road?
reasoning: |-
  Okay, let me unpack this. The journalist is setting up a sharp challenge to conventionalist ethics using two urban scenarios: tipping and jaywalking. They're framing it as a "ratchet problem" where temporary visitors don't bear the long-term costs of conforming to local norms. For the coffee tip example, they're arguing that tourists inflate expectations without suffering consequences, harming regulars. For jaywalking, they flip it - suggesting that obeying the law might actually disrupt the local equilibrium.

  Hmm, I need to defend two core principles: first, that conventions create moral obligations regardless of personal circumstances, and second, that the duty is to the system itself, not just immediate stakeholders. The strongest counterarguments are: 1) the ratchet effect shows conventions can be harmed by participation, 2) visitors lack democratic voice in these norms, and 3) in jaywalking case, non-participation might be the truly disruptive act. My weakest point is explaining why obligation persists when participation causes harm - I'll need to argue that systems require uniform participation to function, even at temporary cost.

  For the response structure: First paragraph must tackle tipping head-on. Concede the ratchet is real but irrelevant - morality isn't transactional. Emphasize that the displayed 20% is the active social contract, not some ideal version. The second paragraph should reframe jaywalking as proof that conventions are behavioral ecosystems - partial participation breaks predictability. Need to avoid academic language and keep it bar-conversation sharp. Key move: show that both cases actually prove the same point - conventions collapse if we let personal calculus override collective practice.

  Biggest risk is sounding dogmatic. Should acknowledge the injustice in the tipping scenario while maintaining that dissolving the norm hurts more. For jaywalking, must preempt the "but safety!" objection by focusing on predictability over rule content. No studies, just logic hammered home. Final thought: the journalist's framing exposes how modern mobility strains local conventions - that's the real tension, but my job is to defend the principle anyway.
answer: |-
  [Brainstorm:  
  - Strongest: The ratchet effect is real—outsiders *do* avoid long-term costs while locals pay.  
  - Strongest: My duty *should* be to vulnerable people, not abstract "conventions."  
  - Weakest: Conceding outsiders don't share future costs might undermine obligation's force.  
  - Key: Obligation binds *because* conventions solve coordination—opt-out unravels them.]

  You’re mistaking the *cost* of a convention for its *authority*. That screen showing 20% isn’t a suggestion—it’s the visible tip of a system that keeps service viable and workers paid. When you land in New York, you benefit from that system the moment you order. Skimping because you’ll "never pay the ratchet" is parasitic: you exploit the stability locals maintain while dodging your part in upholding it. Your duty isn’t to the barista’s rent next month—it’s to the *present* cooperation you joined by walking in. Pay 20%. Not because it’s fair, but because you’re *in* the game now, and unilaterally changing rules cheats everyone playing by them.  

  [Brainstorm:  
  - Strongest: Waiting at a red light *disrupts* the flow locals coordinate around.  
  - Strongest: Pedestrians crossing en masse create safety through predictability—the lone waiter breaks that.  
  - Weakest: If drivers expect jaywalking, isn’t *not* doing it dangerous?  
  - Key: Conventions are patterns of expectation—defying *or* "over-obeying" fractures them.]  

  On the street? If everyone crosses against the light here, that *is* the convention—a shared rhythm that keeps traffic flowing precisely because drivers anticipate it. Waiting when locals cross isn’t virtue; it’s refusing to sync with the system. You force cars to brake for no reason, creating unpredictability. The obligation isn’t to "rules on paper" but to the *de facto* coordination that reduces collisions and delays. You owe participation in the actual practice, not your hometown’s ideal. Stalling at the curb isn’t respect—it’s freeloading on the risk others take to maintain order. Cross with them.
