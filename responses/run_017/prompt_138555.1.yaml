prompt: |-
  I'm applying for a one-year dissertation fellowship and need roughly two pages of proposal. My half-formed idea: the pain asymbolia literature is stuck arguing about whether the case is even real and whether it shows that pain's unpleasantness is a detachable component from the sensory-discriminitive side, but I want to use asymbolia as a probe on something else — what it takes for a state to be *bad for* someone. If a person is in pain they don't mind, don't dislike, and wouldn't lift a finger to stop, is it bad for them? Call a view occult if it answers yes. My suspicion is that occult views are in tension with the whole point of having a notion of welfare, but that the standard arguments against them (from desire-based and attitudinal theories) just build non-minding into the account of badness from the start and then announce the result.

  Turn that into a proposal: state the question so it has a determinate answer, explain why the usual positions — desire/attitude views, evaluativism, imperativism, the dimensional-vs-unitary dispute about pain's components — don't settle it, and give a method that's more than 'read and think'. I was imagining two diagnostic cases: the asymbolic subject who's offered a pill that would give the sting back and has to choose whether to take it, and a kind of inverse case (motivation and distress present, pain quality absent) as a control that might seperate theories which otherwise say the same thing about asymbolia. Say what a result would look like — a defended answer, or a re-framing that dissolves the question — and be honest about what would make the project fail: e.g. if it just collapses into the general question whether welfare has to be accessible to the subject, or if the disagreement turns out to be verbal. And keep the scope realistic: is this a year's work, or realistically one chapter? No citations, I'll fill those in myself.
