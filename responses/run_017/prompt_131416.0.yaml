  Example 2 is an exposé with leaked documents and an anonymous source. Here, the tension is between necessary anonymity for protection versus Kierkegaard's demand for answerability. The procedure needs to assess if anonymity is justified and if the piece drives action rather than just spectacle. 

  Example 3 is a first-person narrative by a named student. While named, it risks being seen as representing a group. The procedure should check if the piece avoids generalization and focuses on individual experience. 

