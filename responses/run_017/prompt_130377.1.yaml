prompt: |-
  I'm a PhD student and I've been handed a single fifty-minute section of our large first-year course next week — the module is on knowledge and rationality, and the slot I've been given is the pair of paradoxes about accepting many claims at once: the lottery, where it seems fine to accept of each ticket that it will lose and yet not fine to accept that they all will, and the preface, where an author seems entitled to believe each of the claims in her book and yet also entitled to believe that at least one of them is false. About twenty-five students, mostly non-majors taking it to fill a requirement; they've had one session on Gettier-style cases and one on the Moorean hand argument, so they've already met closure under known entailment in its single-premise form and found it hard to doubt, which I think is why I've been asked to do the multi-premise version. Please don't explain the paradoxes to me — I've read enough to be dangerous and I'd rather have a plan than a mini-lecture. What I want is the plan.

  Concretely, here is what I want from you, and what I already believe about each piece so you can tell me where I'm wrong. On ordering: my instinct is to open with the lottery, because the mechanics are impersonal and easy to get on the board (a fixed number of tickets, exactly one winner, a tiny chance for any given ticket, so accept of each that it loses, and the conjunction contradicts something you know), and then move to the preface as the case where a response has to do real work; but I worry that order teaches the wrong lesson, namely that the problem is really about small probabilities and big numbers, when the thing I want them to feel is a problem about what follows from what for an all-or-nothing attitude like belief or acceptance. Tell me whether to reverse it, run the two side by side from the first minute, or start somewhere else entirely. On the carrying example: I want one case that runs the whole hour, and I want to know what it must have and what it must lack. My worry about the lottery is that it drags in gambling, risk aversion and expected value, which I don't want to be on the hook for; my worry about the preface is that it invites psychologizing about modesty and arrogance. A housemate of mine who works in data science pushed me on something I hadn't considered: in a realistic preface the errors are not independent — one mislabelled dataset, one unreliable source, one misremembered conversation can make a dozen separate claims false together — and if that's right, then the tidy probabilistic framing people reach for (each claim very probable, so the conjunction is improbable) is doing something other than what it appears to be doing. I'd like the carrying example built so that this feature can be switched on and off on purpose, and I'd like to know where in the hour to switch it on and whether the shared-source version strengthens the paradox or quietly dissolves part of it. On misconceptions, my current list is: the thought that everything dissolves if you switch from belief to degrees of confidence; the thought that the author's preface is merely politeness rather than something with the structure of a belief; the too-easy "then give up the step from each to all" from students who don't yet see what else that costs them in epistemology; and the conflation of the two cases, where the lottery gives you positive evidence that exactly one ticket wins while the preface gives you no evidence about which claims are wrong, only a base rate about your own fallibility. Correct the list, add what I've missed, and for each one give me the exact point in the sequence where it should be defused and with what — I'd much rather pre-empt than clean up afterwards. I've also been told by the course convener not to use the labels for the threshold view about belief or for contextualism, but I'd like the hour to leave the door open to both; tell me where that door is, what to put in front of it, and what I should openly refuse to explain at this level while saying out loud that I'm refusing it. Finally, one end-of-session question that would show me the idea landed rather than that they enjoyed themselves — my candidate is to give them a case with very few claims, each extremely well supported, and ask whether the paradox still gets off the ground, but I can't tell whether that's diagnostic or a trick.

  Please structure your reply in four titled sections, in this order: "Sequence" (roughly 300 words, ordered, with the dependency relations between steps made explicit — what has to be in place before what); "Carrying example" (roughly 200 words, naming the required and forbidden features and saying where the shared-source variant goes and what it does); "Misconception map" (roughly 300 words, one entry per misconception, each with its defusion point in the sequence); and "Check and refusals" (roughly 150 words, containing the diagnostic question, what a good and a bad answer to it look like, and the list of things to decline to explain). Write it as advice to me as the teacher — no slide decks, no readings, no formalism beyond what a first-year can follow on a whiteboard.
