prompt: |-
  Hey — I'm filling in for a friend who normally runs a monthly "hard problems" night in the back room of a pub, and I've got ninety minutes and a whiteboard next Tuesday on the self-sampling vs self-indication business, i.e. the presumptuous philosopher case. The room will be maybe fifteen people: a handful of programmers, a couple of biologists, my neighbour who just turns up for everything, no philosophy training, and nobody will have read anything beforehand. About four of them have definately absorbed half of this from blog posts over the years, so I expect Sleeping Beauty, the doomsday argument and "but what if the universe is infinite" to all get thrown in within the first ten minutes.

  What I want isn't the explanation — I think I more or less have that — it's a plan for the session, and mostly for the order things have to come in and why. My instinct is that the thing that has to land first, before any cosmology-flavoured stuff, is that there's a piece of evidence here at all: that "I find myself being this person, here, now" is itself something with a probability conditional on a hypothesis, and that the two assumptions disagree about that probability rather than about the priors over how big the world is. Is that the right thing to front-load, and what has to be in place before that even looks like a move someone could deny? If I've got the dependency structure backwards, say so.

  Three more things. First, I want one example to carry the whole session and I want it to be boring: no deity flipping coins, no galaxy-scale headcounts, ideally something small enough to do the arithmetic on the board and something you could actually imagine placing a bet on. What does that example need to have, and — this is the part I keep getting wrong — what does it need to lack? Every time I try to design one it turns back into a cosmology thing. Second, there's a guy, Marek, who will at some point say that the whole self-indication boost cancels out as soon as you conditionalize on everything you actually know about yourself, so self-indication never does any work and the presumptuous philosopher is a fake problem. I genuinely can't tell whether that's right. Where does that belong in the sequence — before or after I've run the presumptuous philosopher case — and what's the smallest case that settles whether it cancels, so I can have it in my pocket? Third, someone will notice that you can get self-indication-ish behaviour out of self-sampling just by widening the reference class of people you might have been, and I don't know whether to present that as a devastating objection or as a feature of how the machinery works. Also: where do I let Sleeping Beauty in, and where do I have to say out loud that it's a different axis?

  So: give me the arc, what's first and what depends on what; the three or four misconceptions you'd bet on this particular crowd forming and the exact point in the sequence where I head each one off; a carrying example plus the constraints on it; and a check I can run in the last ten minutes that seperates people who've got it from people who can only repeat "self-indication says big worlds are more likely". And tell me what I should openly refuse to get into at this level — including whether the reference class problem is one of the things I should explicitly decline to resolve. Not asking for readings, the group won't do any.
reasoning: |-
  Okay, the user is stepping in to run a session on self-sampling vs self-indication, specifically the presumptuous philosopher case. They need a structured plan for a 90-minute session with a diverse group—mostly non-philosophers—who might bring up related topics like Sleeping Beauty or the doomsday argument. Their main concerns are the session's flow, a simple example, handling common objections, and avoiding tangents.

  First, the core issue: they want to establish that "being this person now" is evidence with probability implications, not about priors on world size. That’s crucial to front-load. The group needs to grasp conditional probability first. Start with a basic probability refresher using a simple, non-cosmological example—maybe a dice game or a room with colored doors. This avoids distractions and makes the math tangible.

  For the carrying example, it must be small-scale and bet-friendly. A dice game where players bet on which die was rolled based on their "position" could work. Avoid anything cosmic or with deities. The key is that hypotheses differ in population size, creating the tension between self-sampling and self-indication.

  Handling Marek's objection about self-indication canceling out: address it after introducing the presumptuous philosopher case. Use a variant of the dice example where conditioning on all knowledge still leaves a boost. For instance, if players know their player number, show that self-indication affects the odds even then.

  The reference class point—where widening it mimics self-indication—should be framed as a feature, not a flaw. Introduce it after both approaches are explained, showing how they can converge with specific choices. This prevents it from derailing the core debate.

  Sleeping Beauty must be explicitly separated early on. Mention it during the intro as a different problem (temporal vs. spatial) to avoid confusion. If someone brings it up, acknowledge it briefly but steer back.

  The arc: Start with probability basics, move to the dice example, define self-sampling and self-indication, present the presumptuous case, tackle Marek's objection, discuss reference classes, and end with a checkpoint scenario. Actively block cosmology, infinite universes, and deep reference class debates.

  Finally, the checkpoint: A scenario where priors are equal, and the room size differs. Ask what each approach predicts and why. This tests understanding beyond rote answers. Keep it concrete, bet-ready, and time-boxed.
answer: |-
  Here’s a battle-tested arc for your 90-minute pub session, designed to build understanding sequentially, preempt misconceptions, and keep cosmology at bay. The core insight you identified is *exactly* right to front-load.

  **The Core Arc (Dependencies & Timing):**

  1.  **Ground Zero: "I exist" as Evidence (0-20 min)**
      *   **Why First?** This is the foundational disagreement. If the group doesn’t buy that "being me now" is probabilistic evidence conditional on a hypothesis, the rest collapses into arguments about priors or metaphysics.
      *   **Prerequisite:** Basic conditional probability notation (P(A|B)), and the idea that evidence updates priors (Bayes' Theorem conceptually, don't write the formula yet). *Assume familiarity.*
      *   **Setup:** Start with a **trivial, non-anthropic example.** "There are two identical rooms. Room A has 1 person. Room B has 10 people. You wake up in *a* room. What's P(You're in Room A)?" Consensus: 1/11. **Key Point:** Your existence *in a room* is the evidence updating the prior (which we implicitly assumed was 50/50 for simplicity). "Being *someone* in a room" has a probability that depends on *how many someones there are*.
      *   **Head Off:** Anyone saying "But I *know* I exist!" – Agree! But *where* you exist, given the possibilities, is the uncertain part informed by the population sizes. You are conditioning on "I am an observer in one of these rooms".

  2.  **Introduce the Divide: Self-Sampling (SSA) vs. Self-Indication (SIA) (20-35 min)**
      *   **Define Simply:**
          *   **SSA:** "I should reason as if I were a random sample from all *actual* observers in my reference class." (Reference Class = "observers in this scenario" for now).
          *   **SIA:** "I should reason as if I were a random sample from all *possible* observers *across all possible worlds*, weighted by the probability of each world." OR simpler: "The fact that I exist is evidence *for* hypotheses that imply more observers *like me* exist."
      *   **Connect to Room Example:** Both gave P(Room A) = 1/11. They agree when the *only* difference is population size and priors are equal. **Point:** The disagreement emerges when hypotheses have *different prior probabilities* AND different population sizes.

  3.  **The Workhorse Example: The Dice Game Bet (35-60 min)**
      *   **The Setup (Boring & Bet-Ready):**
          *   Two identical, sealed boxes. You *know* one box contains a single 6-sided die (Hypothesis H_Small: 1 observer). The other box contains a *hundred* identical 6-sided dice (Hypothesis H_Big: 100 observers).
          *   **Prize:** £1000 is hidden under one specific die face in *one specific box*. You don't know which box or which die/face.
          *   **The Experiment:** A host flips a fair coin to choose which box to use (P(H_Small) = P(H_Big) = 0.5). They then roll *all dice* in the chosen box.
          *   **You:** You wake up as an observer corresponding to *one specific die face showing up* in the chosen box. You are told all this.
      *   **The Question:** "You find yourself as such an observer. What is P(H_Big | 'I exist as an observer')? Should you bet the prize is in the Big box?"
      *   **Arithmetic:**
          *   **SSA:** Reference Class = Actual observers in this run.
              *   If H_Small (1 die): Only 1 observer exists.
              *   If H_Big (100 dice): 100 observers exist.
              *   P(I exist | H_Small) = 1 (Only one observer, it must be you).
              *   P(I exist | H_Big) = 1/100 (You are one random observer out of 100).
              *   Bayes: P(H_Big | I exist) = [P(I exist | H_Big) * P(H_Big)] / [P(I exist | H_Small) * P(H_Small) + P(I exist | H_Big) * P(H_Big)]
              *   = [(1/100) * 0.5] / [(1 * 0.5) + ((1/100) * 0.5)] = (0.005) / (0.5 + 0.005) = 0.005 / 0.505 ≈ **0.0099** (~1%)
              *   **Conclusion (SSA):** Very likely the Small box (~99%). Bet against Big.
          *   **SIA:** Effectively weights hypotheses by their implied number of observers *before* your indexical evidence.
              *   P(H_Big | I exist) proportional to [Number of Observers in H_Big] * P(H_Big)
              *   P(H_Small | I exist) proportional to [Number of Observers in H_Small] * P(H_Small)
              *   = (100 * 0.5) vs (1 * 0.5) = 50 vs 0.5
              *   P(H_Big | I exist) = 50 / (50 + 0.5) ≈ **0.9901** (~99%)
              *   **Conclusion (SIA):** Very likely the Big box (~99%). Bet *on* Big.
      *   **Why This Example Works:**
          *   **Lacks:** Deities, cosmology, infinity, complex physics. Focuses on mechanics.
          *   **Has:** Clear priors (coin flip), unequal populations, indexical uncertainty ("which observer am I?"), a concrete bet.
          *   **Boring:** Dice, boxes, money. Relatable.
          *   **Arithmetic:** Simple fractions, easy on a whiteboard.
          *   **Presumptuousness:** The SIA believer is *extremely* confident it's the big box based *only* on their existence.

  4.  **Addressing Marek: "Conditionalization Kills SIA" (60-75 min)**
      *   **Timing:** *After* running the Dice Game. Marek's point needs the concrete SIA calculation to push against.
      *   **The Objection:** "Sure, SIA gives a boost initially. But once you conditionalize on *everything you actually know about yourself* (e.g., 'I am observer #7', 'I see a 4 on my die'), the boost vanishes. SIA never changes your final probabilities compared to SSA + full conditioning."
      *   **Smallest Counter-Example (The "Observer Number" Variant):** Modify the Dice Game.
          *   In H_Big, observers are distinctly labeled 1 to 100. In H_Small, the single observer is labeled 1.
          *   You wake up and see: "I am Observer #1".
          *   **SSA:** P(I am #1 | H_Small) = 1. P(I am #1 | H_Big) = 1/100. Bayes => P(H_Big | I am #1) ≈ 1/101 (~1%). Still heavily favors Small.
          *   **SIA:** Prior weights: H_Big weighted x100, H_Small weighted x1. Now condition on "I am #1".
              *   P(I am #1 | H_Small) = 1.
              *   P(I am #1 | H_Big) = 1/100.
              *   Posterior Odds = [Prior Odds SIA] * [Likelihood Ratio] = (100:1) * ( (1/100) / 1 ) = (100:1) * (1:100) = **1:1**.
              *   P(H_Big | I am #1) = **50%**.
          *   **Conclusion:** Even after conditioning on the specific indexical fact "I am #1", SIA gives a *different* result (50%) than SSA (~1%). **The SIA boost does not always cancel out.** Full conditioning *shifts* the probability, but doesn't eliminate the fundamental difference SIA introduced in the prior weighting. The Presumptuous Philosopher (betting confidently on Big *before* seeing their number) is still a real consequence.

  5.  **Reference Class & Sleeping Beauty: Clarifying Boundaries (75-85 min)**
      *   **Reference Class Mimicry:** "Can't I just make SSA act like SIA by choosing a wider reference class (e.g., 'all possible observers')?"
          *   **Response:** Frame this as a **feature, not a bug**. It shows the *reference class problem* is deeply entangled with the SSA/SIA distinction. Choosing a reference class that includes *possible* observers is *effectively* smuggling in SIA-like weighting. Acknowledge this is a major point of debate ("Is SIA *just* SSA with the right reference class?"). **Explicitly Decline to Resolve:** "That's a deep rabbit hole connecting to the 'problem of the reference class'. For tonight, let's treat SSA and SIA as distinct *formalizations* of how to handle indexical evidence, recognizing they often overlap or can be made equivalent with specific choices. The core *disagreement in spirit* is whether simply existing gives evidence for larger populations."
      *   **Sleeping Beauty:** The moment it comes up (likely early), **clearly separate it:** "Great connection! Sleeping Beauty is fascinating, but it's primarily about *self-locating belief over time* with memory loss. Our topic is about *self-locating belief across space/population size* when you first 'wake up' into existence. They share the 'who am I?' vibe, but the mechanisms and the core disagreement (SSA/SIA) are different axes. Let's focus on the population size axis tonight. We can do SB next month!"

  6.  **Checkpoint: "Do You Get It?" (Last 5-10 min)**
      *   **Scenario:** "Two theories. Theory X (P=0.5): The universe has 1 trillion observers. Theory Y (P=0.5): The universe has 1 billion observers. You are one observer. According to SSA, what's P(Y)? According to SIA, what's P(Y)? **Why?**"
      *   **Test for Understanding:**
          *   **SSA Correct:** "P(Y) ≈ 1 billion / (1 billion + 1 trillion) ≈ 0.001. SSA says I'm a random actual observer; much more likely to exist if there are more observers, so favors X."
          *   **SIA Correct:** "P(Y) = (1e9 * 0.5) / ( (1e9 * 0.5) + (1e12 * 0.5) ) = 1e9 / (1e9 + 1e12) ≈ 0.001. Wait, no! SIA weights by observers *first*. P(Y | I exist) proportional to (Number in Y) * P(Y) = 1e9 * 0.5. P(X | I exist) proportional to 1e12 * 0.5. So P(Y) = (1e9 * 0.5) / ( (1e9 * 0.5) + (1e12 * 0.5) ) = 1e9 / (1e9 + 1e12) ≈ **0.001**. **Oh, it's the same as SSA?**" *This is the trap!*
      *   **The Reveal:** "**Ah!** But what's the prior probability of the hypotheses? I set P(X)=P(Y)=0.5. SSA and SIA *only* differ when the priors on the hypotheses *are independent of* the population sizes they imply. In cosmology, the prior for a 'big universe' theory might be considered much *lower* than a 'small universe' theory simply because it seems more complex or requires more fine-tuning. *That's* where SIA screams 'Presumptuous!', giving a huge boost to the big universe theory despite its lower prior. SSA doesn't give that boost. The disagreement is about whether the prior should be weighted by population size *before* adding your existence as evidence."
      *   **Who Gets It:** Those who see that SSA/SIA *agree* numerically only if the prior probabilities of the hypotheses *already* incorporate the difference in population size (like the equal priors in this checkpoint). The *disagreement* is about whether that prior weighting *should* happen (SIA) or not (SSA). Anyone just chanting "SIA likes big worlds" without understanding the conditional probability structure and the role of priors hasn't fully grasped it.

  **What to Explicitly Refuse:**

  1.  **Infinite Universes:** "Infinity breaks probability calculations in weird ways. Let's stick to finite, countable examples we can actually calculate."
  2.  **Deep Cosmology/Specific Doomsday Arguments:** "The Doomsday Argument is a *consequence* of applying SSA in a specific way. Tonight is about the *foundation* (SSA vs SIA) that leads to disagreements *like* Doomsday or the Presumptuous Philosopher. We need the foundation first."
  3.  **Resolving the Reference Class Problem:** "As we saw, the choice of reference class is hugely important and tangled up with SSA/SIA. Entire PhDs are written on it. Tonight, we're taking SSA and SIA as defined starting points to see *their* core difference."
  4.  **Philosophical Grounding of Probability/Existence:** "We're taking the probability framework and the idea of 'possible observers' as given tools tonight. Debating the metaphysics of probability or what 'possible' really means is a different session!"
  5.  **Letting Sleeping Beauty Derail the Core:** Acknowledge it, distinguish it firmly ("time vs population"), and park it.

  **Key to Success:**

  *   **Hammer the Dice Game:** Write it clearly. Do both calculations step-by-step on the board. This is your anchor.
  *   **Emphasize Conditional Probability:** Constantly tie statements back to "P(H | Evidence)". The evidence is "I am an observer in this scenario".
  *   **Contrast Priors vs. Indexical Updates:** Constantly distinguish the prior probability of the *world hypothesis* (e.g., P(big box)) from the probability update based on *your existence within it*.
  *   **Manage Tangents:** Use the refusals list politely but firmly. "That's a great point for a deeper dive later, but for our 90 minutes, let's stick to X so we can get to Y..."
  *   **Embrace the Pub Vibe:** Keep it conversational. Ask the biologists/programmers how they'd bet. Let the neighbour's simple questions guide clarification. Use the energy of the "half-absorbed" folks but steer it productively.

  This structure forces the core conceptual disagreement into the open early, provides a concrete, non-cosmic anchor (The Dice Game), addresses the critical objections (Marek, Reference Class, SB confusion) at the right moment, and has a clear checkpoint to reveal true understanding. Good luck!
