   Story:

   Alice and Bob are negotiating the split of a $100,000 pie from a joint venture. They can agree on any split (x,100-x) in thousands of dollars, but also they can agree to give Alice an additional bonus which however reduces the total pie. Specifically, if they choose to give Alice a bonus of t thousand dollars (t between 0 and 60), then the total pie becomes $100,000 - (1/6)*t*1000, and this bonus can be combined with the split. The set of feasible utility pairs (expected monetary values, with one unit being $1,000) is convex due to randomization over agreements and continuously adjustable bonus. The disagreement point is (0,0), meaning no agreement and no money for either.

   In the baseline problem F, the feasible set has Pareto frontier passing through (0,100), (60,50), (100,10), and (120,0). The convexity comes from the possibility of continuous adjustment and randomization.

   In the changed circumstances, a new technology allows Alice to get an even higher bonus without affecting the cost to the pie as much. Specifically, for bonuses beyond the first 60, the reduction in the pie is less severe. This expands the set to G, with frontier passing through (0,100), (60,50), (100,10), and (130,0), and the segment from (100,10) to (130,0) has a shallower slope. This means that Alice can now achieve up to $130,000, while Bob's maximum remains $100,000. Moreover, for every level of Alice's utility, Bob's maximum utility is never lower and is strictly higher for some range, and the maximum total utility increases from $120,000 to $130,000.

   The Nash solution for both F and G is (60,50), since it maximizes the product and the new options do not provide a higher product.

   The Kalai-Smorodinsky solution for F is (60,50), but for G it is approximately (62.17,47.83), so Alice gets more and Bob gets less in G under KS.

   The monotonicity principle being tested is that if the feasible set expands in a way that improves one party's best outcome without worsening the other's, then that party should not get less in the solution. Here, Alice's best outcome improved (from 120 to 130) and Bob's best outcome did not worsen (remained 100), and under KS, Alice gets more (62.17>60) but Bob gets less (47.83<50), which violates the principle if we interpret it as both should not be worse off. However, the principle is only for the party whose best improved: Alice should not get less. Here Alice gets more, so it's not violated for Alice. But the principle Kalai-Smorodinsky put is about the allocation not decreasing for the party whose ideal improved. In this case, Alice's ideal improved and she got more, so it's okay. But the principle also says that the other party should not be hurt? The exact statement.

   Kalai–Smorodinsky requires that if two games have the same disagreement point and the same ideal point for player 2, and the ideal point for player 1 is weakly higher in the second game, and the feasible set for the second game is such that the set of feasible utility pairs contains that of the first, then the allocation to player 1 in the second game should be at least as high as in the first.

   In our case, the feasible set expanded from F to G, with the same disagreement point (0,0), same ideal for Bob (100), and higher ideal for Alice (130>120), and F ⊆ G. Then KS solution for Alice: 62.17>60, so it is higher, so it satisfies the monotonicity for Alice. But the problem is that Bob's utility decreased from 50 to 47.83.

   The principle does not say anything about Bob. It only says that Alice should not get less. So it is not violated.

   But the teaching note is about the divergence between Nash and KS after a change that is good for one side and confiscates nothing from the other. In this case, confiscates nothing from the other means that for every level of Alice's utility, the maximum for Bob is at least as high, so Bob's opportunities are not reduced. But under KS, Bob ends up with less.

   The principle that is being tested is not the standard monotonicity, but one might expect that Bob should not be hurt because the set expanded in a way that didn't take away from Bob. But KS does hurt Bob.

   So the case shows that under KS, when the set expands to give Alice more opportunities, and Bob's opportunities are not reduced, Bob may still get less in the allocation.

   The single feature that pins the Nash verdict is that the new Pareto frontier in G does not provide any point with product greater than 3000, and (60,50) is still feasible and has the same product, so Nash remains the same. If the expansion had added a point with product>3000, then Nash would change.

   For KS, the feature is that the ray from (0,0) to the new ideal point (130,100) has a different slope, and it intersects a different segment of the frontier. If the ideal point had not changed, KS would remain the same.

   A defender of KS might say that the expansion also changed the bargaining power by giving Alice a higher ideal, so it is natural that she gets more. And the principle they propose only requires that Alice should not get less, which is satisfied, but they do not claim that Bob should not get less.

   The reply is that the example shows that KS can make Bob worse off even though the change did not take away any of Bob's options and even gave Bob more options for some levels of Alice's utility. This might be seen as a drawback.

   What the case establishes: It illustrates that the two solutions respond differently to expansions of the feasible set. Nash satisfies independence of irrelevant alternatives, so adding new options that are not chosen doesn't change the solution. KS, on the other hand, is sensitive to changes in the ideal point, even if the new options are not used in the solution, and this can lead to a decrease in the payoff of the party whose ideal did not change. This divergence highlights the normative choice between the axioms: IIA versus monotonicity with respect to the ideal point.

   However, it does not establish that one axiom is superior; it only illustrates a consequence of the axioms.

