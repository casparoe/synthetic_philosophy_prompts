  ### Story
  Alice and Bob are business partners negotiating the split of a $100,000 profit from a joint venture. They can agree on any split \((x, 100 - x)\) (in thousands of dollars, where one unit of utility is $1,000), or they can include a bonus for Alice. The bonus \(t \in [0, 60]\) (in $1,000) increases Alice's share by \(t\) but reduces the total profit by \(\frac{1}{6}t\) (in $1,000), due to administrative costs. Randomization over agreements and continuous adjustment of \(t\) make the feasible set convex. Disagreement yields \((0, 0)\). In the baseline scenario (problem \(F\)), the bonus is capped at 60. Later, a new agreement option allows bonuses beyond 60 (up to 70) with a lower reduction rate (one-third of the bonus amount), expanding the set to \(G\), giving Alice higher potential gains without reducing Bob's options.

  ### Baseline Problem \(F\)
  - **Feasible set \(F\)**: Comprehensive convex hull of the Pareto frontier vertices: \((0, 100)\), \((60, 50)\), \((100, 10)\), \((120, 0)\). Disagreement \(d = (0, 0)\). Ideal point \(a(F) = (\max u_A, \max u_B) = (120, 100)\).
  - **Pareto frontier segments**:
    - Segment 1: \((0, 100)\) to \((60, 50)\): \(u_B = 100 - \frac{5}{6}u_A\) for \(u_A \in [0, 60]\).
    - Segment 2: \((60, 50)\) to \((100, 10)\): \(u_B = 110 - u_A\) for \(u_A \in [60, 100]\).
    - Segment 3: \((100, 10)\) to \((120, 0)\): \(u_B = 60 - \frac{1}{2}u_A\) for \(u_A \in [100, 120]\).
  - **Nash solution**: Maximizes \(u_A \cdot u_B\).
    - Segment 1: \(u_A u_B = u_A(100 - \frac{5}{6}u_A)\). Derivative: \(100 - \frac{5}{3}u_A = 0 \Rightarrow u_A = 60\), \(u_B = 50\), product = \(3000\).
    - Segment 2: \(u_A u_B = u_A(110 - u_A)\). Derivative: \(110 - 2u_A = 0 \Rightarrow u_A = 55\) (not in \([60, 100]\)). At \(u_A = 60\), product = \(3000\); at \(u_A = 100\), product = \(1000\).
    - Segment 3: \(u_A u_B = u_A(60 - \frac{1}{2}u_A)\). Derivative: \(60 - u_A = 0 \Rightarrow u_A = 60\) (not in \([100, 120]\)). At \(u_A = 100\), product = \(1000\).
    - Maximum product is \(3000\) at \((60, 50)\).
  - **KS solution**: Ray from \((0, 0)\) to \((120, 100)\): \(u_B = \frac{100}{120}u_A = \frac{5}{6}u_A\).
    - Intersect with Segment 1: \(\frac{5}{6}u_A = 100 - \frac{5}{6}u_A \Rightarrow u_A = 60\), \(u_B = 50\) (on segment).
    - So KS solution is \((60, 50)\).
  - Both solutions agree at \((60, 50)\), which is off the diagonal (\(u_A = 60 \neq u_B = 50\)).

  ### Expanded Problem \(G\)
  - **Feasible set \(G\)**: \(F \subseteq G\) with Pareto frontier vertices: \((0, 100)\), \((60, 50)\), \((100, 10)\), \((130, 0)\). Disagreement \(d = (0, 0)\). Ideal point \(a(G) = (130, 100)\).
  - **Changes from \(F\) to \(G\)**:
    - \(A\)'s ideal payoff: \(120 \to 130\) (strictly rises).
    - \(B\)'s ideal payoff: \(100\) (unchanged).
    - For every \(u_A\), \(\max u_B\) in \(G\) is \(\geq\) in \(F\), and strictly greater for \(u_A \in (100, 130]\). For example, at \(u_A = 110\): in \(F\), \(u_B = 5\); in \(G\), \(u_B = \frac{20}{3} \approx 6.667\).
    - Maximum total \(u_A + u_B\): \(120\) (at \((120, 0)\) in \(F\)) \(\to\) \(130\) (at \((130, 0)\) in \(G\)) (strictly rises).
  - **Pareto frontier segments**:
    - Segments 1 and 2: Same as \(F\).
    - Segment 3: \((100, 10)\) to \((130, 0)\): \(u_B = \frac{130 - u_A}{3}\) for \(u_A \in [100, 130]\).
  - **Nash solution**: Maximizes \(u_A \cdot u_B\).
    - Segments 1 and 2: Same as \(F\), maximum product \(3000\) at \((60, 50)\).
    - Segment 3: \(u_A u_B = u_A \cdot \frac{130 - u_A}{3}\). Derivative: \(\frac{130 - 2u_A}{3} = 0 \Rightarrow u_A = 65\) (not in \([100, 130]\)). At \(u_A = 100\), product = \(1000\); decreasing.
    - Maximum product still \(3000\) at \((60, 50)\).
  - **KS solution**: Ray from \((0, 0)\) to \((130, 100)\): \(u_B = \frac{100}{130}u_A = \frac{10}{13}u_A\).
    - Intersect with Segment 1: \(\frac{10}{13}u_A = 100 - \frac{5}{6}u_A \Rightarrow u_A = 62.4\) (not in \([0, 60]\)).
    - Intersect with Segment 2: \(\frac{10}{13}u_A = 110 - u_A \Rightarrow u_A = \frac{1430}{23} \approx 62.1739\), \(u_B = \frac{1100}{23} \approx 47.8261\) (in \([60, 100]\)).
    - So KS solution is \(\left( \frac{1430}{23}, \frac{1100}{23} \right) \approx (62.1739, 47.8261)\).
  - **Verdicts**:
    - Nash: \((60, 50)\) in both \(F\) and \(G\).
    - KS in \(G\): \(A\) gets \(\approx 62.1739 > 60\), \(B\) gets \(\approx 47.8261 < 50\). Margins: \(\Delta u_A \approx 2.1739 > 0.005\), \(\Delta u_B \approx -2.1739 < -0.005\).

  ### Monotonicity Principle
  The Kalai-Smorodinsky monotonicity axiom: If \((F, d)\) and \((G, d)\) are bargaining problems with \(F \subseteq G\), \(a_A(G) \geq a_A(F)\), and \(a_B(G) = a_B(F)\), then \(\varphi_A(G) \geq \varphi_A(F)\), where \(\varphi\) is the solution. Here, \(a_A(G) = 130 > 120 = a_A(F)\), \(a_B(G) = a_B(F) = 100\), and \(\varphi_A^{\text{KS}}(G) \approx 62.17 > 60 = \varphi_A^{\text{KS}}(F)\), so the axiom holds for Alice. However, Bob's utility decreases despite no reduction in his opportunities.

  ### Key Geometrical Features
  - **Nash verdict pinned by**: The new frontier in \(G\) has no point with product exceeding \(3000\), and \((60, 50)\) remains feasible. If the expansion added a point with product \(> 3000\), Nash would change.
  - **KS verdict pinned by**: The ray from \((0, 0)\) to the new ideal point \((130, 100)\) has a shallower slope (\(\frac{10}{13} \approx 0.769\) vs. \(\frac{5}{6} \approx 0.833\)), causing intersection at a different segment. If the ideal point were unchanged, KS would remain at \((60, 50)\).

  ### Objection and Reply
  - **Objection (defending KS)**: The expansion increased Alice's bargaining power (higher ideal payoff), so KS reasonably gives her more. The axiom only requires Alice not to get less, which is satisfied.
  - **Reply**: While the axiom holds, KS makes Bob strictly worse off despite the expansion confiscating none of his options (for any \(u_A\), his max \(u_B\) is not reduced) and even improving his opportunities for some \(u_A\). This violates the intuition that a Pareto-improving expansion should not harm a party.

  ### Conclusion
  This case establishes that Nash's IIA and Kalai-Smorodinsky's monotonicity can diverge: Nash is invariant to expansions that do not increase the product maximum, while KS adjusts based on ideal points, potentially harming a party whose opportunities improve. It does not establish which axiom is superior but highlights a trade-off: IIA ensures stability of payoffs, while monotonicity responds to changes in bargaining power.

  ### Vertex Lists
  - **\(F\) vertices (Pareto frontier)**: \((0, 100)\), \((60, 50)\), \((100, 10)\), \((120, 0)\). Disagreement: \((0, 0)\). Ideal: \((120, 100)\).
  - **\(G\) vertices (Pareto frontier)**: \((0, 100)\), \((60, 50)\), \((100, 10)\), \((130, 0)\). Disagreement: \((0, 0)\). Ideal: \((130, 100)\).
