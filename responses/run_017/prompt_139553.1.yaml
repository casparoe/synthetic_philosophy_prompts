prompt: |-
  I work mainly in moral philosophy, but for the past two years I have sat on a university committee that hears complaints, and the experience has pushed me into a corner of epistemology I was never trained in. I keep encountering the same configuration and I have no word for it. Three instances. First: I form a confident view about what happened in a case from the four or five people who were willing to speak to me; only later do I learn that the people with the opposite story had every reason to stay silent, so that the pool of testimony I drew on was filtered by the world rather than by me. Nothing I was told has been shown false, and I do not think I reasoned badly about what I heard — yet I now take myself to be required to be substantially less confident. Second: in my other life I work on a 1930s philosopher's unpublished correspondence. For years the letters I could read were the ones a single executor chose to deposit, and I formed views about her religious commitments on that basis. When the remaining boxes surfaced my confidence collapsed, but not because any letter turned out to be forged or because I had misread them: it collapsed because I learned that what I had was a truncated sample of a larger set I could not see, and truncated in a direction. Third, the mirror image: a senior colleague I trust has silently pre-filtered a literature for me and passed on only what she judged methodologically sound. Here I do not take myself to be permitted to be *more* confident than the papers themselves warrant, even though her filtering is, structurally, just as much a fact about the provenance of my evidence as in the first case.

  What I want is not a label to drop but a distinction I could use in print, so please carve rather than name. The thing I am gesturing at sits near several established notions without, as far as I can tell, coinciding with any of them. It is not a rebutting defeater: I acquire no evidence that the proposition is false. It does not look like an undercutting defeater either: each letter still supports the claim about the philosopher's beliefs exactly as strongly as it did before. It is not epistemic akrasia as I have seen that discussed, since I am not left believing that p while believing that my evidence fails to support p — I fully accept that my evidence supports p; what I have learned is that my evidence is probably not the whole of the evidence there is. And it is not confirmation bias or selective exposure, since in my cases the truncation is not something I did. The nearest candidates I can think of are the requirement of total evidence (Carnap's, I believe — correct me if the attribution is wrong), which seems to state a norm rather than name the failure mode; the statistician's notion of a biased sample, which is about estimators rather than about what I should believe; and the epistemologists' category of higher-order evidence, which in my reading of it is mostly about defects in one's own processing or about disagreement with others, whereas my cases concern defects in what the world handed me — and which seem to generate none of the puzzles that literature trades in, precisely because the new fact can apparently be treated as ordinary first-order evidence about the likely existence of unobserved counter-evidence.

  So: does this configuration have an established name of its own, and is it classified as a species of higher-order evidence, as a form of defeat, or as something else entirely? If it has no name, coin one, define it, and give me its boundary cases. In particular I need answers to three question I cannot settle myself: whether the phenomenon requires me to know the direction of the bias, or whether merely knowing that my sample is unrepresentative suffices; whether the rational mandate lands on my first-order credence at all, or only on some higher-order attitude about the completeness of my evidence base; and why, if at all, the negative and positive cases come apart. I am not after a reading list or references — I want the distinction itself, sharpened to the point where I could state it in a paragraph and defend its edges in a footnote.
reasoning: |-
  Okay, let's tackle this query. The user is a moral philosopher dealing with an epistemological issue from committee work. They describe three scenarios where evidence is filtered: biased silence in complaints, selective archival access, and pre-filtered literature. The key is that their confidence changes without new counter-evidence or processing errors. 

  First, I need to identify the core problem. The user mentions this isn't rebutting or undercutting defeat, nor epistemic akrasia. They note it's about incomplete evidence due to external filtering. The existing concepts like biased sample or higher-order evidence don't quite fit. 

  The user’s three questions are crucial. Direction of bias: is knowing the sample is unrepresentative enough, or must the direction be known? In their first example, knowing the silent group had contrary views matters. But in the second, the executor's bias direction might not be explicit. So maybe direction is necessary for confidence shifts? 

  Next, where does the rational mandate apply? Should first-order credence adjust, or just higher-order awareness? In the silence case, they lower confidence in the original belief. But in the pre-filtered literature, they don’t increase confidence. This asymmetry needs explaining. 

  Why do positive and negative cases differ? The colleague filtering methodologically sound papers doesn’t boost confidence, but biased silence reduces it. The key might be the filter's reliability. The colleague’s judgment is trusted but doesn’t add evidence, whereas knowing evidence was withheld directly suggests missing counter-evidence. 

  The term "Provenance-Induced Evidence Restriction" (PIER) comes to mind. It captures the external origin of the evidence limitation. Defining it as cases where evidence is restricted by external factors, and learning this fact rationally requires confidence adjustment. 

  For the boundaries: direction of bias matters when adjusting confidence. If only knowing the sample is unrepresentative without direction, the impact is unclear. Maybe confidence becomes indeterminate rather than simply reduced. 

  The mandate lands on first-order credence because the new information about evidence restriction directly bears on the likelihood of unobserved evidence affecting the truth. Higher-order awareness alone isn’t sufficient; the rational response is to temper belief. 

  The asymmetry arises because negative filters (withholding counter-evidence) directly increase the probability of missing counter-evidence, while positive filters (selecting reliable evidence) don’t add new support; they just avoid false positives. Trust in a colleague’s filter might not compensate for the possibility that even reliable papers could be incomplete or wrong. 

  I need to ensure this distinction is clear. PIER as the structural fact, leading to a rational constraint on confidence. The user can then apply this to their cases consistently. Also, addressing each of their three questions within this framework solidifies the response.
answer: |-
  This configuration lacks a standard name but constitutes a distinct epistemic phenomenon. I propose the term **Provenance-Induced Evidence Restriction (PIER)** and define it as follows:

  **PIER occurs when an agent learns that their evidence set E, supporting proposition P, was non-neutrally filtered by an external process prior to acquisition — and this structural feature of E’s provenance rationally constrains confidence in P, absent new first-order evidence about P itself.**

  ### Key Boundaries & Clarifications
  1.  **Core Mechanism:** PIER generates a *meta-probabilistic* constraint: learning that E is a non-random subset of a larger (often inaccessible) evidence pool *V*. The rational response stems from recognizing that *V* likely contains relevant evidence not in E.
  2.  **Distinction from Defeaters:**
      *   *Not Rebutting:* No evidence against P is acquired.
      *   *Not Standard Undercutting:* The *probative force* of individual items in E for P is unchanged (e.g., each letter still supports the belief it always did). PIER undermines *evidential completeness*, not evidential force.
  3.  **Distinction from Other Concepts:**
      *   *Biased Sample (Stats):* PIER concerns *rational belief adjustment* given awareness of sampling bias, not estimator properties.
      *   *Higher-Order Evidence (HOE):* PIER is *world-directed* (facts about evidence availability/selection), not *agent-directed* (facts about one's reasoning or peers' judgments). It creates no "level-confusion" puzzles typical of HOE.
      *   *Requirement of Total Evidence:* PIER is *how* failure to meet this norm (due to external restriction) impacts rationality *when recognized*.

  ### Answers to Your Questions
  1.  **Direction of Bias Required?** PIER mandates confidence adjustment **only if the direction of filtering is known or reasonably inferable**. Merely knowing E is unrepresentative *suggests* potential unreliability but doesn't dictate *how* confidence should shift (up/down/indeterminate). Your cases imply directionality:
      *   *Case 1:* Silent parties had "opposite story" → Likely *counter-evidence* missing → **Lower confidence**.
      *   *Case 2:* Executor truncated "in a direction" → Likely *counter-evidence* missing → **Lower confidence**.
      *   *Case 3:* Filtered for "methodologically sound" → Likely *weak/irrelevant evidence* excluded → **No mandate to raise confidence** (see Q3). Direction (excluding *poor* evidence) is known, but this doesn't imply *stronger* support for P exists.
      *   *Boundary Case:* If you learn your archival sample was randomly destroyed (non-directional restriction), PIER doesn't apply – you only know E is incomplete, not skewed *for or against* P. Confidence *might* become less resilient but isn't clearly required to decrease.

  2.  **Where Does the Mandate Land?** **Primarily on first-order credence.** Learning about PIER provides new *first-order evidence about the likely state of the total evidence V*:
      *   In Cases 1 & 2: You gain evidence suggesting *V likely contains significant counter-evidence to P*. This directly lowers the probability of P.
      *   In Case 3: You gain evidence suggesting *V likely contains less reliable evidence than E*. This doesn't raise P's probability; it only potentially mitigates worries about *disconfirming* evidence being present (but doesn't affirm P).
      Higher-order awareness (e.g., "My evidence base is incomplete") is a *consequence*, but the rational pressure stems from the first-order implication about *what the missing evidence probably is*.

  3.  **Why Do Positive & Negative Cases Come Apart?** **Asymmetry stems from the filter's effect on the *likelihood of unobserved counter-evidence*:**
      *   **Negative PIER (Cases 1 & 2):** Learning E was filtered *adversarially* (silencing dissent, hiding counter-letters) *directly increases* the rational estimate that *significant counter-evidence exists in V but is missing from E*. This *lowers* P's probability.
      *   **Positive PIER (Case 3):** Learning E was filtered *benevolently* (selecting high-quality support) *decreases* the rational estimate that *significant counter-evidence exists in V but is missing from E*. However:
          *   It does *not* provide evidence *for* P beyond what E already supports.
          *   It does *not* guarantee that *all* strong evidence *for* P is included (other high-quality counter-evidence might exist and be excluded).
          *   Trust in the colleague ensures E is *reliable*, but reliability ≠ comprehensiveness. Confidence remains bounded by E's content; PIER only removes a *reason for doubt* (about evidence quality), not a *reason for increased belief*.

  ### Sharpened Definition for Use
  **Provenance-Induced Evidence Restriction (PIER)** is a structural property of an evidence set E, pertaining to its origin: E constitutes a non-neutrally selected subset of a larger, relevant evidence pool *V*, due to external filtering prior to the agent's access. When an agent learns of PIER affecting their E (supporting proposition P), this knowledge provides new first-order evidence about the probable composition of *V*. If the filtering direction is known (or reasonably inferred), it rationally mandates adjusting confidence in P — specifically, *lowering* confidence if the filter likely excluded significant counter-evidence, but *not raising* confidence if the filter likely excluded only weak/irrelevant evidence. PIER operates by revealing potential gaps in the agent's evidential base relative to *V*, not by undermining the probative force of the individual items within E.

  **Footnoted Boundaries:**
  *   PIER requires awareness of *external*, *non-neutral* filtering (not agent-induced selection bias).
  *   Directionality of filtering is necessary for a specific confidence *adjustment* (lowering); non-directional restriction only implies general fragility.
  *   The mandate impacts first-order credence because PIER reveals facts about the *likely existence and nature of unobserved evidence* pertinent to P.
  *   Asymmetry arises because excluding counter-evidence directly threatens P, while excluding weak evidence merely protects E's reliability without augmenting support for P.
