prompt: |-
  I am a novelist, three drafts into a book about eleven survivors of a cargo-ship wreck marooned on an uninhabited island, and I am trying to write the emergence and the collapse of their rules honestly — as something that happens to people, not as a fable with a moral stapled to it. To that end I would like you to read William Golding's Lord of the Flies through David Lewis's analysis of convention in Convention (1969), and then hand the reading back to me as something I can use on my own pages.

  As I understand the Lewisian machinery, a regularity counts as a convention roughly when: almost everyone conforms to it in a recurrent situation; almost everyone expects almost everyone else to; each would rather conform on the condition that enough others do, because the situation is a coordination problem with more than one equilibrium; all of this is common knowledge among them; and there is some alternative regularity that would have solved the problem about as well — the arbitrariness condition, which is a claim about what else could have happened and not about how the rule feels from inside. Conventions are supposed to be able to arise without any agreement, by precedent and salience, and Lewis's sender-receiver signalling games are supposed to model how a signal and a response can lock into an equilibrium without anyone intending a code. Correct me if I have that garbled, in your own words.

  What I want from you is a scene-by-scene reading. Take the conch as a device for solving who may speak, the election that makes Ralph chief as a device for selecting one equilibrium out of many, the signal fire as a signalling system whose intended receiver may never be in a position to receive it, the hunters' chant and the dance as a state in which no single boy can unilaterally defect, and the clay and charcoal marks as something that alters the game the boys are playing rather than merely expressing an allegiance. For each, tell me whether the scene really depicts a convention in Lewis's sense or only something superficially like one, and how the novel makes the mechanism legible: how does Golding get the reader to feel the arbitrariness of the conch while the boys experience it as holy?

  Then I want the residue, and I want it stated plainly. Lewisian conventions are self-enforcing equilibria among people whose preferences are aligned enough, held in place by mutual expectation rather than by threat; Lord of the Flies runs on fear, changed desires, coercion, ritual, and the sheer pleasure of the hunt, and its central events are not coordination failures so much as a change in what the boys want, after which the old regularity is no longer an equilibrium at all, plus a good deal of enforcement by sanction. Tell me where Lewis's vocabulary stops being the right one, where a convention has quietly turned into a norm, a rule, a taboo, or an institution, and where the honest critic has to say that Golding is not writing about conventions in any philosophical sense and the reading is being imposed from outside. I would also like your view on what the novel knows that the argumentative literature does not — my suspicion is that the irreducible part is the phenomenology: from inside, a convention does not present itself as one of several equilibria but as the way things are.

  Finally, the part that matters most to me. In my draft the survivors work out, without ever voting, that whoever draws water from the spring must be watched by a second person, and much later a splinter group begins marking its faces and hands with red ochre from the riverbank before it hunts. Give me a Lewisian description of what is happening in each — what coordination problem is being solved, what the alternative equilibria are, what makes the practice stick or stop sticking, and which of my two scenes is genuinely about convention and which is about something the framework cannot say. Then give me three or four diagnostics, drawn from the reading, that I could apply to any scene of mine to check whether I have actually dramatized a norm forming or dying rather than announced it. Please write in continuous prose with whatever headings you find useful, draw only on the novel as it is commonly known, do not quote or cite anything, and flag explicitly wherever you are extrapolating beyond what Lewis himself argued.
reasoning: |-
  Okay, the user is a novelist working on a book about survivors on an island, and they want to apply David Lewis's theory of conventions to analyze "Lord of the Flies." They also want help translating that analysis into their own writing. 

  First, I need to make sure I understand their request correctly. They want a scene-by-scene breakdown of key moments in "Lord of the Flies" through Lewis's lens—focusing on the conch, Ralph's election, the signal fire, the hunters' chant, and the face paint. Then they want me to identify where Lewis's framework stops being useful in the novel, and finally apply this to their own draft scenes about water-drawing and ochre markings.

  The user clearly knows Lewis well—their summary of conventions is accurate. They're not just looking for literary analysis; they want practical tools for their novel. The phrase "hand the reading back to me as something I can use" suggests they need actionable insights, not just theory. 

  Hmm... their underlying struggle seems to be avoiding moral fables. They want the emergence/collapse of rules to feel organic, "as something that happens to people." That's smart—many writers would default to allegory here. Their suspicion about phenomenology ("from inside, a convention doesn't present as one of several equilibria") feels key. Golding excels at showing how conventions *feel* inevitable until they aren't.

  For the scene breakdowns:
  - The conch is Lewisian early on (arbitrary but self-reinforcing), but turns sacred/non-arbitrary to Piggy. Golding shows this shift through Piggy's reverence vs. Jack's dismissal. 
  - Ralph's election has multiple equilibria (any boy could've been chief), but the "stillness" of Ralph makes him salient. Later, the lack of alternatives (no other "good" equilibria) accelerates collapse.
  - Signal fire's coordination breaks because the hunters prefer hunting (preferences change). Lewis can't handle that—it's about shifting desires, not coordination failure.
  - Hunters' chant is anti-Lewis: it's not coordination but mutual excitation where defection is impossible. Ritual overrides individual choice.
  - Face paint alters the game by enabling violence through anonymity. Not a convention—a tool for preference transformation.

  For their draft scenes:
  - Water-watching sounds Lewisian: coordination problem (safety vs. efficiency), arbitrary alternatives (could be three people, or different rules), self-enforcing through mutual expectation. 
  - Ochre markings feel ritualistic—more like the hunters' chant. If it enables hunting violence by reducing guilt, it's altering preferences, not solving coordination. 

  Diagnostics for their writing:
  1. Test for arbitrariness: Could a functionally identical alternative exist? (If yes, more Lewisian)
  2. Check preference alignment: Are incentives shared, or is there coercion? (Lewis requires alignment)
  3. Look for common knowledge: Do characters *know* others know the rule? (Golding shows this crumbling)
  4. Monitor desire shifts: Is the rule collapsing because preferences changed? (That's beyond Lewis)

  Biggest gap in Lewis: He assumes stable preferences. Golding shows desires mutate under stress, making old equilibria unstable. The novel's power is in depicting how conventions *feel* absolute until the moment they don't—that phenomenological truth is what the user should steal for their pages. 

  ...Better flag where I extrapolate beyond Lewis (e.g., when discussing ritual or preference change). User wants academic honesty.
answer: |-
  ### Lewisian Reading of *Lord of the Flies* and Applications to Your Draft  
  **Core Lewisian Framework Recap**  
  Your summary is precise: Conventions emerge as self-perpetuating equilibria in recurrent coordination problems. They require:  
  - Near-universal conformity and mutual expectation of conformity.  
  - Preference alignment ("I’ll comply if others do").  
  - Arbitrariness (viable alternatives exist).  
  - Common knowledge of all the above.  
  They arise via precedent/salience, not agreement. Lewis’s signalling games illustrate how meanings stabilize unintentionally. Golding’s novel tests these conditions under decay.  

  ---

  ### Scene-by-Scene Analysis  
  **1. The Conch as Speaking Protocol**  
  - **Lewisian?** Initially yes.  
    - Coordination problem: Avoiding cacophony in assemblies.  
    - Equilibrium: Conch-holder speaks. Salience (its beauty, Piggy’s idea) establishes it quickly.  
    - Arbitrariness: A raised hand, a hat, or silence could work—but the conch’s *physicality* makes it salient.  
  - **Golding’s Legibility**:  
    - Early scenes show boys *testing* alternatives (interruptions, whispers). The conch gains power through repeated use, not inherent sanctity.  
    - Arbitrariness felt by reader via Jack’s dismissals ("We don’t need the conch anymore!") and the conch’s fragility (pale, eroding). Boys experience it as "holy" through Piggy’s reverence (investing it with moral weight) and Ralph’s insistence—highlighting how conventions *acquire* symbolism beyond function.  

  **2. Ralph’s Election as Equilibrium Selection**  
  - **Lewisian?** Partially.  
    - Coordination problem: Selecting a leader. Multiple equilibria (Jack, Roger, no leader).  
    - Salience: Ralph blows conch (linking him to order); his stillness contrasts with Jack’s aggression.  
    - **Non-Lewisian element**: The vote isn’t pure coordination—Jack desires leadership but concedes temporarily. Preference alignment is shallow.  
  - **Collapse Mechanism**: When Jack’s preferences shift (prioritizing hunting over rescue), Ralph’s leadership ceases to be an equilibrium. Mutual expectations unravel ("I’m not going to play any longer").  

  **3. Signal Fire as Signalling System**  
  - **Lewisian?** As a *practice*, yes; as communication, no.  
    - Coordination: Maintaining fire requires role rotation (watchers, gatherers).  
    - Equilibrium: Fire as shared rescue symbol. Arbitrariness (smoke signals, mirrors, or patrols could suffice).  
    - **Failure**: The "receiver" (ships) is absent. Lewis assumes rational actors, but here the signal’s futility exposes flawed incentives. Hunters defect (prefer meat over smoke), destroying the equilibrium.  
  - **Golding’s Insight**: Fire’s collapse shows conventions starve without reinforcement. The boys’ growing doubt ("Maybe there aren’t any grownups anywhere") erodes common knowledge.  

  **4. Hunters’ Chant/Dance as Anti-Coordination**  
  - **Lewisian?** No.  
    - Not a coordination problem but a *ritual of deindividuation*.  
    - "Kill the pig! Cut its throat!" is a Nash equilibrium (no one defects; deviation risks exclusion/attack), but preferences are misaligned: Simon and Piggy fear it; Jack exploits it.  
    - Enforced by arousal, not mutual benefit.  
  - **Beyond Convention**: This is a *norm*—violators (Simon) are punished. Golding shows how collective rituals mutate conventions into coercive traditions.  

  **5. Clay/Charcoal Marks as Game-Changer**  
  - **Lewisian?** No.  
    - Not solving coordination but *altering identity*. The paint enables violence by anonymizing wearers ("The mask compelled them").  
    - **Framework Shift**: Conventions regulate behavior; here, the marks *transform* behavior. Jack’s tribe uses them to opt out of Ralph’s conventions entirely, creating a new game (hunters vs. prey).  

  ---

  ### The Residue: Where Lewis Stops  
  **Limits of the Framework**:  
  - **Shifting Preferences**: Lewis assumes stable preferences. Golding shows desires mutate (hunting’s thrill > rescue). When Jack says, "We hunt and feast and have fun," the old equilibria die.  
  - **Coercion > Coordination**: Conventions become norms (moralized rules) or taboos (supernatural sanctions). The "beast" evolves from fear into a tool of control—enforced by violence, not mutual expectation.  
  - **Ritual and Affect**: Lewis ignores emotional contagion. The dance’s ecstasy binds Jack’s tribe; reason (Piggy) can’t compete.  
  - **Phenomenology vs. Philosophy**: Golding’s genius lies in depicting conventions *from within*—as the "way things are"—until they shatter. The conch feels inevitable until it’s crushed. Lewis’s arbitrariness is invisible to actors until crisis.  

  **What the Novel Knows**: Conventions are psychological lifelines. Their collapse isn’t logical but visceral—fueled by boredom, fear, and the seduction of chaos. No philosophical model captures the *sound* of the conch fracturing.  

  ---

  ### Applying Lewis to Your Draft  
  **Scene 1: Water-Watching Protocol**  
  - **Coordination Problem**: Safety (drowning/attack) vs. efficiency (solo drawing).  
  - **Equilibrium**: "Drawer + Watcher" as salient solution (recurrent situation).  
  - **Arbitrariness**: Alternatives exist—trios, timed shifts, or armed solo trips.  
  - **Self-Enforcement**: Each prefers compliance if others comply (mutual survival interest). If a watcher slacks, others reprimand; defection risks isolation.  
  - **Why Convention?** Preferences align (all want water safely). No enforcement needed beyond expectation.  

  **Scene 2: Red Ochre Hunt Markings**  
  - **Not Convention**: This is ritualized identity-creation.  
    - **Coordination Problem?** None—hunting succeeds without paint.  
    - **Altered Preferences**: Ochre marks likely enable violence (like Jack’s charcoal), reducing guilt or invoking "hunter" identity.  
    - **Non-Arbitrariness**: If markings *feel* necessary to the hunters (psychologically), alternatives (unmarked hunting) aren’t equivalent.  
    - **Enforcement**: Defectors may be ostracized. Resembles a *norm* ("real hunters wear ochre").  

  **Diagnostics for Your Scenes**  
  1. **Test for Arbitrariness**: Could functionally identical alternatives exist? (If no, it’s not a convention).  
  2. **Preference Alignment Check**: Do characters comply *because* others do, or due to fear/ideology? (Latter = norm/ritual).  
  3. **Common Knowledge Probe**: Is there a moment where everyone realizes everyone expects compliance? (Silent nods > solemn vows).  
  4. **Equilibrium Stability**: Does collapse follow preference shifts (e.g., thirst for blood > thirst for order) or mere coordination failure? (Former beyond Lewis).  

  **Final Note**: Golding shows conventions crumbling when salience fades (conch ignored) or preferences polarize. Your water-watching scene epitomizes Lewis; your ochre scene reveals his limits—where symbolism overrides game theory. To dramatize norms *forming*, show the first accidental precedent (e.g., someone casually standing guard); to show death, let characters forget why it mattered.  

  ---  
  *Extrapolations flagged*: Lewis didn’t address ritual psychology or identity-altering practices (e.g., paint). His focus was epistemic (common knowledge); Golding’s is existential.
