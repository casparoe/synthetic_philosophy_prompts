  - **Term**: *Anti-fanatical intuitions are more reliable here* (Prob: 0.75)  
  - **Why**: Intuitions about extreme magnitudes—even with ordinary probabilities—may still be corrupted by scope insensitivity or evolutionary mismatches. I'm least confident in quantifying their reliability versus tiny-p cases.  
