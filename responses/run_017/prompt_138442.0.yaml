prompt: |-
  Hey — I'm a reporter, I cover science and ideas now but I spent about six years on the labor beat before they moved me, so I know my way around a mediation room: BATNAs, the zone of possible agreement, the mediator shutteling between caucus rooms to get each side to shave something off it's maximum demand, strike deadlines, pattern settlements that the next local in line will copy, ability-to-pay arguments, and the fact that whatever you land on has to survive a ratification vote. I'm working on a piece about what happens when software agents negociate with each other on people's behalf, and everyone I interview tells me the serious thinking about this is in the axiomatic bargaining literature, which I cannot read. So: take the old Nash solution and the Kalai-Smorodinsky alternative that was built to fix it, and translate that whole dispute as faithfully as you can into the vocabulary I just listed. What is the feasible set in a room with a mediator in it? Is the disagreement point the BATNA, or is it what happens when the clock runs out and both sides are worse off than any deal — and does the theory care which, given that my sources spend most of their working lives trying to move it? What does Nash's independence-of-irrelevant-alternatives amount to when I'd put it as "a demand the other side could never have gotten anyway shouldn't change what you settle on"? And what is Kalai-Smorodinsky's monotonicity axiom really demanding, if my gloss is "if the company's best conceivable outcome just got better, the union's settlement ought to get better too, even though nothing actually on the table changed"? Also please state plainly what each solution picks — I've been told one of them is basically "both sides give up the same fraction of their maximum demand," and I want to know whether that's right or whether I've flattened something.

  Then the part I actually need, which is the residue report: tell me what does not survive the translation. My own hunches, which I fully expect to be half wrong: (a) my whole vocabulary quietly assumes a common measuring stick — dollars, percentages, headcount — and I'm told the theory is built so that you can rescale each side's utility separately without changing the answer, which if true makes "split the difference" and "each side concedes proportionally" completely different claims and makes at least one of them inadmissible; (b) "the company can afford it" and "the members will never ratify that" are doing real work in every negotiation I've covered, and I can't find the slot for either in a model that apparently only has a feasible set and a disagreement point; (c) we can't offer two parties a coin flip between two contracts, which I suspect is what lets them assume the feasible set is convex, so something important may be riding on an assumption that's just false on my beat. Also, separately, people keep claiming that automated agents land on equal-proportional-concession outcomes rather than the Nash one, and I'd like to know whether that's even a meaningful thing to say or whether I'm projecting a mediator's intuition onto a machine. Tell me which of these are genuine residue, which are just me misunderstanding the model, and — this is the bit I care about most — give me the mismatches I haven't thought of, especially anything my vocabulary lets me say that theirs can't, or anything they say that turns out to be empty once it's in my language. I'd much rather hear "that distinction of theirs has no counterpart for you" than get a tidy translation that quietly changed the subject.
reasoning: |-
  Okay, let me tackle this reporter's query. They're deeply familiar with labor negotiation mechanics but need help bridging that with axiomatic bargaining theory for their piece on software agents. The core challenge is translating Nash and Kalai-Smorodinsky solutions into mediation room terminology while flagging where the analogy breaks.

  First, I need to map the theory's components to their real-world equivalents. The feasible set is clearly the zone of possible agreement (ZOPA) - all ratified contracts both sides prefer over their BATNAs. The disagreement point aligns with the combined BATNAs outcome. For Nash's IIA axiom, their "irrelevant demands shouldn't change settlement" intuition holds perfectly. 

  Kalai-Smorodinsky's monotonicity is trickier. Their "company gains should lift union settlement" gloss captures the spirit, but I must emphasize it's about hypothetical ideal points, not current offers. The equal-proportional-concession interpretation needs careful handling too - it's accurate for Kalai-Smorodinsky but only when utilities are comparable, which they usually aren't.

  Now the residue analysis:
  - Their hunch about missing common measurement is spot-on; utility independence makes proportional concessions meaningless without comparable units. 
  - Ratification constraints and ability-to-pay arguments are indeed outside the model's scope - they're part of defining the ZOPA, not elements within it.
  - The convexity assumption is problematic since contracts aren't divisible, though pattern settlements might approximate it.

  The software agent behavior question is fascinating. If they're observing proportional concessions, it suggests either Kalai-Smorodinsky in use or utility calibration happening behind the scenes. But without knowing the agents' design, we can't assume it's meaningful rather than emergent.

  What they might not have considered: 
  - The theory's silence on how BATNAs form contrasts with their beat's reality where moving disagreement points is crucial. 
  - Their vocabulary captures tactical elements (shuttle diplomacy, ratification) that abstract models intentionally omit.
  - Terms like "fairness" become mathematically defined properties rather than negotiators' concerns.

  I should structure this as a translation guide followed by a residue report, explicitly calling out where their mediation room experience exposes the theory's limitations. The key is preserving the tension between models and reality rather than forcing fit.
answer: |-
  Here’s your translation guide to Nash/Kalai-Smorodinsky in labor negotiation terms, followed by a frank residue report on what gets lost. Your instincts are sharp—let’s unpack this.

  ### Core Translation: Bargaining Theory → Mediation Room
  1. **Feasible Set** = **The Zone of Possible Agreement (ZOPA)**  
     All possible ratified contracts (wage increases, benefits packages) that *both* sides prefer over their BATNAs. It’s every point the mediator sketches on their legal pad that wouldn’t trigger a strike or lockout.  

  2. **Disagreement Point** = **Combined BATNAs**  
     What happens if talks collapse: union strikes (losing wages), company takes a hit (lost revenue, scab labor costs). The theory treats this as fixed *for the negotiation*, though you’re right—in practice, both sides try to *move* it (e.g., union building a strike fund to worsen the company’s BATNA).  

  3. **Nash Solution (1950)**  
     - **What it picks**: The deal that **maximizes the product of each side’s gains** over their BATNA.  
     - **Your gloss of IIA ("irrelevant demands shouldn’t matter")**: Nailed it. If the union fantasizes about a 50% raise (impossible given the company’s finances), Nash says it *shouldn’t* change the settlement. Only realistic options matter.  
     - **Labor intuition**: The mediator focuses only on what’s credible. Strikes off the table? Ignore them.  

  4. **Kalai-Smorodinsky Solution (1975)**  
     - **What it picks**: The deal where **both sides concede the same *proportion* of their maximum possible gain** over their BATNA.  
     - **"Equal proportional concession"**: Yes, this is correct *if utilities are comparable*. But see **Residue (a)**.  
     - **Your gloss of Monotonicity ("company’s upside improves → union gets more")**: Exactly. If the company’s *best possible* outcome improves (e.g., record profits), Kalai-Smorodinsky forces the union’s settlement up *even if the current ZOPA hasn’t changed*.  

  ---

  ### Residue Report: Where Your Vocabulary Exposes the Theory’s Seams
  **(a) The "Common Measuring Stick" Problem**  
  **Your hunch:** Correct. The theory assumes utilities are *rescalable* (e.g., "union cares only about % wage hike, company only about profit loss").  
  **Why it matters:**  
     - "Split the difference" (e.g., midpoint between $1 and $2 raise) ≠ "Equal proportional concession" (each gives up 30% of their max demand).  
     - In Nash/Kalai-Smorodinsky, **only proportional concessions survive** when utilities are rescaled. "Split the difference" vanishes—it’s mathematically incoherent.  
  **Residue?** Genuine. Labor talks *need* a common unit (dollars, days off). The theory deliberately ignores this to be "universal," making some real tactics inadmissible.  

  **(b) "Ratification Risk" & "Ability-to-Pay" Are Missing**  
  **Your hunch:** Correct.  
  **Why:**  
     - Ratification constraints ("members won’t vote for this") and financial limits ("we can’t pay that") define **the edges of the ZOPA**. The theory *assumes* the feasible set already bakes these in.  
     - In practice, these are dynamic: a mediator uses "ability-to-pay" to shrink the company’s max offer, or fear of a "no" vote to cap the union’s demand.  
  **Residue?** **Critical gap.** The models treat ZOPA as static and known. Your beat shows it’s contested and revealed through bargaining.  

  **(c) "Contracts Aren’t Divisible" vs. Convexity**  
  **Your hunch:** Correct.  
  **Why:**  
     - Convexity assumes parties can "flip a coin" between two contracts (e.g., 50% chance of $1 raise, 50% of extra vacation day). In labor, this is illegal or impractical.  
     - Real ZOPAs are "lumpy" (discrete options). Convexity is a math trick to ensure solutions exist.  
  **Residue?** **Mostly harmless in practice.** Mediators find "compromise points" (e.g., phased raises) that approximate convexity. But for software agents? It might matter.  

  ---

  ### Unseen Residue: What You Didn’t Spot
  **(d) BATNAs Are Fixed, Not Movable**  
     - The theory freezes BATNAs once talks start. Your beat shows mediators *threaten* worse BATNAs ("without a deal, we strike Tuesday") to shrink the other side’s demands.  
     - **Residue:** Theory ignores a core mediation tactic.  

  **(e) "Fairness" Is Reduced to Math**  
     - Nash’s product maximization is "fair" only in a narrow sense (equal gains if BATNAs are symmetric). Kalai’s proportional concessions feel "fair" but depend on utility scales.  
     - Real mediators invoke **industry patterns** ("give the standard 3%") or **need** ("cost-of-living adjustment").  
     - **Residue:** Theory’s "fairness" is mechanical. Your vocabulary captures moral/social dimensions they can’t.  

  **(f) No Room for Bluffing**  
     - The feasible set is objective. But in your world, parties hide their true ZOPA (e.g., company overstating financial pain).  
     - **Residue:** Theory assumes perfect information. Your mediation thrives on strategic opacity.  

  ---

  ### Software Agents & "Equal Proportional Concessions"
  Your sources are likely right that agents gravitate toward Kalai-Smorodinsky outcomes. Why?  
  - **Nash is brittle**: Small changes in ZOPA can drastically shift the solution.  
  - **Kalai "feels" fair**: Proportional concessions are intuitive and verifiable.  
  - **But**: If agents use non-comparable utility scales (e.g., union’s "happiness" vs. company’s "profit loss"), "proportional" is meaningless. **Your projection suspicion is valid**—without knowing how agents *calibrate* utilities, we can’t say if concessions are truly "equal."  

  ---

  ### Bottom Line  
  **What survives translation**:  
  - Nash’s IIA ≈ "Ignore impossible demands."  
  - Kalai’s Monotonicity ≈ "If your upside grows, my settlement should too."  
  - Disagreement point ≈ Combined BATNAs.  

  **What gets lost**:  
  - The **tactics** of moving BATNAs, defining ZOPA under uncertainty, and leveraging social norms.  
  - The **constraints** of ratification and ability-to-pay as dynamic forces.  
  - The **moral weight** of "pattern settlements" or "fair share."  

  **Your vocabulary exposes**: Theory’s strength is abstraction (handling any negotiation); its weakness is ignoring how deals are *forged*—not just found. For software agents, this means they might "solve" a problem no human would recognize. The residue isn’t a flaw—it’s where real bargaining lives.  

  If you need a pull quote: *"Axiomatic bargaining tells us where deals *should* land; labor reporters know how mediators keep the room from exploding on the way there."*
