prompt: |-
  My friend Priya has been writing a tiny advice column for expats and long-stay travelers for about six years — people write in with "is it rude if I..." questions — and she's not a philosopher (she used to run warehouses or something), but her verdicts on everyday-convention stuff are more consistant than anything I've read by actual philosophers on it. As best I can reconstruct her track record: not tipping at a US sit-down restaurant where staff are legally paid a sub-minimum wage is really wrong, because you sat down knowing the menu price wasn't the whole price; not tipping at a Tokyo ramen counter is obviously fine, and a tourist who insists on tipping there is doing something mildly wrong — her word was something like colonizing, dragging your own script into a place that didn't ask for it. Cutting the line at a Philadelphia bakery: wrong. Shoving into the scrum at a bus stop in a city that genuinely has no line: fine, there's no convention there to break. Jaywalking across a dead-empty street at 1am: fine. Jaywalking across the same kind of street in a city where pedestrians reliably wait for the signal, with a kid standing there watching: wrong, she said something about what you're teaching. Standing on the left of a London escalator: wrong, and she added that she personally thinks the stand-right convention is dumb and probably unsafe, but that's not the point. Taking a phone call in an Amtrak quiet car: wrong, and — this is the one that got me — still wrong if the person next to you isn't actually bothered. Two limit cases: in a shoes-off house where the host says please keep your shoes on, we truly don't care, she said keep them on, the waiver is real; and for a guy whose office expects everyone to stay till 7, she said that's a labor problem and not an obligation, you're allowed to erode it.

  Here are three cases I want her ruling on, and I can't tell which of her principles is supposed to govern them. (1) My sister is spending a week in a mid-sized city in southern Europe where, until maybe five years ago, nobody tipped; locals still don't tip at neighborhood places, but in the tourist center the last few years of American and British visitors leaving 15-20% have created a real expectation, and it's an expectation that runs only toward foreigners — and the locals Priya's readers quote are annoyed about it, they think visitors are importing a two-tier custom and giving restaurants cover to cut base pay. So my sister sits down at a tourist-center place: does she owe a tip? She's literally the kind of person the expectation was built out of, she knows about it, she takes the service, and paying feeds a norm the locals resent. Does it change anything if she's the first foreigner of the season versus the ten-thousandth, or if the person serving her is the owner's daughter versus someone whose hourly was quietly cut because management now counts tips? (2) The one I actually find interesting: a norm nobody endorses. An office where every person stands when the regional director walks in, and every person privately thinks it's humiliating and wrongly believes everyone else expects it; a consultant visiting from another branch stays seated. Wrong, fine, or neither — and does it matter that no one accepts the norm, or is "real regularity, everyone expects it" the end of the matter for her? (3) A café where regulars rinse their cup and put it on a specific shelf; visitors leave theirs on the table and get silently resented but are never told. Has the visitor done anything wrong, and does it matter that they couldn't have found out?

  I don't just want the verdicts, I want the rule. My guesses at what she's running: something about expectations you create by opting in; something about free riding on everyone else's compliance; something about what nonconformance expresses, contempt or obliviousness or a refusal to treat locals as authorities on their own shared life; and something like extra deference owed by guests — but maybe she's actually running separate rules for coordination conventions, conventions that transfer small amounts of money, and deference rituals, and just hasn't said so. Give me your best guess at her answer on each of the three with the reason, tell me which candidate principles fit her whole track record roughly equally well and exactly where they come apart, and be honest if her past verdicts genuinely underdetermine these cases — and if they do, say what principle she'd be committing herself to by going each way. And since I'm seeing her for dinner next week: name one further case I should pose that would separate the surviving rules, the one where they'd definately have to diverge.
reasoning: |-
  Hmm, the user is asking me to analyze their friend Priya's ethical framework for social conventions based on her past rulings. They've provided several examples of Priya's judgments on things like tipping, line-cutting, and escalator etiquette, and now want me to apply that framework to three new scenarios.

  Looking at Priya's pattern, she seems to emphasize several key principles: First, the importance of informed participation - if you knowingly enter a system with established norms (like tipping in US restaurants), you're obligated to follow them. Second, she distinguishes between genuine local conventions (like not tipping in Tokyo) versus imposed or artificial ones. Third, she considers the expressive meaning of actions - what message your behavior sends to others, especially in teaching moments (like jaywalking with a child watching). Fourth, she separates practical coordination norms (like escalator standing) from their inherent value, focusing on compliance regardless of personal opinion.

  For the first case about tipping in a European tourist area: Priya would likely say no obligation to tip. The key is that this isn't an authentic local convention but an imported practice targeting foreigners. By not tipping, the sister avoids reinforcing this two-tier system that locals resent. The server's status (owner's daughter vs underpaid worker) might matter pragmatically but doesn't change the core ethical issue.

  The second case about the office standing ritual is fascinating. Since no one actually endorses this norm, Priya would probably side with the seated consultant. Her past rulings show she distinguishes between genuinely held conventions and empty rituals. The consultant's action might even help break a harmful collective delusion.

  For the café cup-washing case, Priya would likely say the visitor did nothing wrong. Unlike the escalator example where the rule is clearly posted, here the norm is invisible to outsiders. Her principle seems to require that conventions must be reasonably knowable to obligate compliance.

  I should also suggest a test case that would force differentiation between competing principles. A good one would be about participating in a harmful but universally endorsed convention versus an arbitrary but harmless one - this would reveal whether Priya prioritizes consent or consequences in her framework.

  The user clearly wants to understand Priya's underlying philosophy, not just get answers. I'll structure my response to first give rulings with reasons for each case, then analyze how Priya's principles interconnect, and finally propose that test scenario.
answer: |-
  Based on Priya's track record, here's my best reconstruction of her underlying principles and their application to your three cases, followed by a test case to probe potential tensions:

  **Priya's Core Principles (Reconstructed):**

  1.  **Informed Participation & Implied Consent:** When you *knowingly* opt into a system with established, *locally authentic* conventions (like sitting down at a US restaurant knowing tipping is the wage model), you incur an obligation to follow them. Your action signals acceptance of the rules.
  2.  **Local Authority & Avoiding Cultural Imposition:** Respect the *actual* conventions of the place you are in, as determined by its regular participants/locals. Don't impose your own script (e.g., tipping in Tokyo). Deference is owed to local norms, not foreign ones.
  3.  **The Expressive Meaning of Non-Conformance:** What matters isn't just the *act*, but what it *communicates*. Does it show contempt? Obliviousness? A refusal to engage respectfully? Does it teach bad lessons (jaywalking kid)?
  4.  **Harm & Free-Riding:** Does breaking the norm actively harm others (like stiffing a server relying on tips) or unfairly benefit you by free-riding on others' compliance (like cutting a line)?
  5.  **Knowability & Accessibility:** Norms must be reasonably knowable or discoverable to obligate outsiders. Hidden rules or "tests" carry less weight (escalator signs vs. unspoken café resentment).
  6.  **Distinguishing Conventions from Coercion:** Rituals lacking genuine local endorsement or serving primarily to enforce hierarchy/exploitation (like the office stay-till-7 rule) are not morally binding conventions; they are problems to be resisted.

  **Applying Priya's Principles to Your Cases:**

  1.  **Southern Europe Tipping:**
      *   **Verdict:** **No, your sister does *not* owe a tip.**
      *   **Reason:** This fails the "Local Authority & Avoiding Cultural Imposition" test spectacularly. The "convention" is *not* local; it's an imported, two-tiered system imposed *by* foreigners *on* foreigners, actively resented by locals, and potentially harming local workers (by enabling wage cuts). By tipping, she would be directly participating in and reinforcing this harmful, inauthentic imposition. Her knowledge makes her *more* obligated *not* to tip to avoid validating it. Opting into the meal doesn't imply consent to *this specific, contested* expectation – the menu prices likely reflect the local, non-tipping norm. "Feeding the norm" here is actively bad. The server's status (owner's daughter vs. underpaid worker) might create a *pragmatic* argument for tipping (to avoid stiffing an individual), but ethically, Priya would likely see the systemic harm of reinforcing the imported norm as more significant. Being the "first vs. ten-thousandth" foreigner is irrelevant; the norm is ethically flawed from the start.

  2.  **Office Standing Ritual (Unendorsed Norm):**
      *   **Verdict:** **Fine (or even good) for the consultant to stay seated.**
      *   **Reason:** This violates the "Distinguishing Conventions from Coercion" principle. A "norm" that *no one* endorses and everyone privately finds humiliating isn't a genuine social convention; it's a collective action problem or an act of coercive deference. There's no authentic "local authority" behind it. Sitting down doesn't express contempt for real local values; it might express healthy disrespect for an empty, harmful ritual or even courage. While there's a "real regularity," Priya's ruling on the "stay till 7" office norm shows she doesn't consider mere regularity under pressure morally binding. The consultant isn't free-riding (no one benefits from standing); they are potentially resisting harm.

  3.  **Café Cup Washing (Hidden Norm):**
      *   **Verdict:** **The visitor has done *nothing* wrong.**
      *   **Reason:** This fails the "Knowability & Accessibility" test. The norm is invisible to an outsider. There are no signs, no instructions, and regulars perform the action silently without explanation. The resentment is also silent. Priya's escalator ruling hinges on the convention being well-known and signposted. Here, the visitor couldn't reasonably be expected to know or discover the rule. Their action expresses obliviousness, not contempt or a refusal to respect local norms. The responsibility lies with the café or regulars to make the expectation clear if they want compliance from outsiders.

  **Candidate Principles & Their Fit/Divergence:**

  Two strong, overlapping candidates explain most of Priya's track record well:

  *   **Candidate 1: Deference to Local Authority & Avoidance of Harmful Imposition:** Focuses on respecting the *authentic, consensual* norms of the place you are in ("locals as authorities on their own shared life"), resisting importing foreign norms *or* complying with locally coercive ones, and avoiding actions that harm locals or exploit systems (like free-riding or enabling wage cuts). Fits: US tipping (local authentic norm), Tokyo no-tipping (respecting local script), Philly line-cutting (breaking local norm/harm), London escalator (following local rule even if dumb), Amtrak quiet car (respecting established rule/space), shoes-off house (respecting host's authority), office stay-till-7 (rejecting coercive "norm").
  *   **Candidate 2: Expressive Meaning & Implied Contract:** Focuses on what your action *communicates* in context and the obligations you take on by participating knowingly. Does it show respect, contempt, obliviousness, or a teachable moment? Does your participation imply agreement to the rules? Fits: US tipping (implied contract), Tokyo tipping (expresses cultural imposition), jaywalking with kid (teaches disrespect), London escalator (expresses disregard for others' expectations), Amtrak quiet car (expresses disregard for the car's purpose, even if no one *says* they're bothered), shoes-off house (respects host's expressed wish).

  **Where They Diverge Slightly & Underdetermination:**

  *   **Slight Divergence:** Candidate 1 (Local Authority) might handle the **Southern Europe Tipping** case more cleanly, seeing the "norm" as fundamentally inauthentic and harmful. Candidate 2 (Expressive Meaning) could argue *not* tipping expresses solidarity with locals/resistance to imposition.
  *   **Underdetermination:** The **Office Standing Ritual** is where Priya's past rulings genuinely underdetermine the case.
      *   If she leaned heavily on **Candidate 1 (Local Authority)**, she *might* say "everyone expects it, even if grudgingly, so comply to avoid friction." (This would align with a strict "real regularity, everyone expects it" reading).
      *   However, her **Office Stay-till-7** ruling strongly suggests she prioritizes **Candidate 2 (Expressive Meaning/Distinguishing Coercion)** in hierarchical settings. Sitting expresses rejection of an empty, coercive ritual, not disrespect for genuine colleagues. **This is the more consistent fit with her rejection of the office-hours coercion.** By siding with the consultant, she commits to the principle that **genuine conventions require some level of local endorsement or functionality beyond mere fear/coercion; bare compliance under collective delusion isn't morally binding.**

  **The Test Case to Separate the Principles:**

  **The "Harmless but Pointless & Universally Endorsed Ritual":** Imagine a small, close-knit community where *everyone* genuinely believes in and values a daily ritual – say, bowing to a specific ancient tree in the town square at noon. It has no practical function, harms no one, and isn't tied to hierarchy. A visitor knows the ritual exists and what it means to locals but finds it silly and refuses to participate, standing nearby reading a book instead. No one is offended or even notices the visitor not participating; they are focused on their own bowing.

  *   **Candidate 1 (Local Authority/Avoiding Imposition) Verdict:** **Wrong not to bow (or at least stand respectfully aside).** Reason: It's an authentic, universally endorsed local norm. The visitor is a guest and knows the norm. Non-participation, even if unnoticed, fails to show deference to the local community's shared life and values. It imports the visitor's judgment ("this is silly") into a space where it doesn't belong.
  *   **Candidate 2 (Expressive Meaning/Implied Contract) Verdict:** **Fine not to bow.** Reason: The action expresses personal disbelief or disinterest, not contempt or disrespect *for the people*. Since participation isn't expected of outsiders (it's a community ritual, not a rule for visitors like an escalator), and the visitor isn't disrupting it or harming anyone, there's no implied contract broken. Their presence nearby reading a book doesn't convey negative meaning.

  **This case separates them: Candidate 1 demands deference to *any* authentic local ritual, while Candidate 2 focuses on the expressive meaning and harm in the specific context, potentially allowing non-participation in harmless but personally unconvincing rituals if done respectfully and without negative expression.**

  **Based on her Amtrak quiet car ruling (where the *expression* matters even if no one is concretely bothered), Priya likely leans towards Candidate 2.** However, the tree ritual case would force a clear distinction. Ask Priya this at dinner! Her answer will clarify whether expressive meaning *always* trumps pure local authority in non-coercive, non-harmful contexts. Enjoy the conversation!
