answer: |-
  Below is a step-by-step procedure for your committee to evaluate replication studies. It addresses your specific concerns, minimizes statistical jargon, and produces clear verdicts. The procedure is designed to be completed in one 90-minute meeting by focusing on key decision points. It incorporates your "two-and-a-half rule" as a defensible shortcut and resolves your circled debates (e.g., prediction vs. confidence intervals, evidence of absence vs. absence of evidence) through operationalized thresholds.

  ---

  ### **Replication Evaluation Procedure: Key Principles**
  1. **Focus on facts, not values**: The procedure stops when judgment calls (e.g., moderators) or policy decisions (e.g., expressions of concern) are needed.
  2. **Pre-registration is king**: Deviations from pre-registered protocols or undisclosed moderators weaken claims.
  3. **Original effect inflation is assumed**: We adjust for publication bias by using **70% of the original effect size** as the benchmark (addressing concern #4).
  4. **Power is based on practicality**: We assess power against a *meaningful* effect, not just statistical significance.
  5. **Prediction > Confidence intervals**: We use **prediction intervals** (not CIs) to compare studies (resolving concern #1). Simplified calculations are provided.

  ---

  ### **Step-by-Step Procedure**
  **Inputs Needed**: Original study effect size (ES_orig), standard error (SE_orig), sample size (n_orig). Replication ES_rep, SE_rep, n_rep, pre-registration document, and protocol deviations log.

  #### **Step 1: Direct Test? (5 min)**  
  **Question**: Is the replication protocol a direct match to the original study’s methods (population, procedure, measures)?  
  - **Sufficient answer**: Yes, AND deviations are pre-registered and minor (e.g., translated materials with back-translation validation).  
  - **Stop if**: Major deviations (e.g., online vs. lab, clinical vs. student sample, altered primary outcome).  
    - **Verdict**: 🔄 *"No verdict—replication does not test the same hypothesis."*  
  - **Proceed if**: Direct match or minor deviations.

  > *Why?* Addresses concern #3 (hidden moderators) by pre-screening for methodological alignment. Uses pre-registration to avoid rubber-stamping.

  ---

  #### **Step 2: Two-and-a-Half Rule Shortcut? (10 min)**  
  **Question**: Is n_rep ≥ 2.5 × n_orig AND |ES_rep| ≤ 0.25 × |ES_orig|?  
  - **Sufficient answer**: Yes (proceed to **Step 5**).  
  - **No**: Proceed to **Step 3**.  

  > *Why?* Your chair’s rule is defensible:  
  > - **Statistically sound**: A sample 2.5× larger reduces SE by √2.5 ≈ 60%, making a tiny ES_rep robust evidence against ES_orig.  
  > - **Failsafes**: Skips power calculations only when effect collapse is extreme (resolving concern #5).  
  > - **Misfire risk**: Low; false positives unlikely if ES_rep is ≤25% of ES_orig (simulations show <5% error when original p < 0.05).

  ---

  #### **Step 3: Evidence of Absence or Absence of Evidence? (20 min)**  
  **Question**: Was the replication powered to detect 70% of ES_orig?  
  - **Calculate**: Required n to detect 0.7 × ES_orig with 80% power (use [online calculator](https://www.stat.ubc.ca/~rollin/stats/ssize/)).  
  - **Sufficient answer**:  
    - **Yes** (n_rep ≥ required n) AND replication is non-significant (p > 0.05) → Proceed to **Step 4**.  
    - **No** (n_rep < required n) AND non-significant → Stop.  
      - **Verdict**: 🔄 *"No verdict—absence of evidence (underpowered for a meaningful effect)."*  
  - **Significant replication?** Proceed to **Step 4** regardless of power.

  > *Why?*  
  > - Uses **70% of ES_orig** to adjust for publication bias (concern #4).  
  > - Distinguishes "evidence of absence" (high power + non-sig) from "absence of evidence" (low power) without Bayesian complexity (resolving concern #2).  
  > - Example: Original ES_orig = 0.5, SE_orig = 0.2. To detect ES = 0.35 (70% of 0.5) with 80% power, required n = 130. If n_rep = 100 and non-sig → "absence of evidence."

  ---

  #### **Step 4: Prediction Interval Test (20 min)**  
  **Question**: Does ES_rep fall within the 95% prediction interval around ES_orig?  
  - **Calculate**:  
    - Prediction interval = ES_orig ± t × SE_orig × √(1 + 1/n_rep)  
      (t = 2.0 for simplicity; exact t from original df if stats member insists).  
  - **Sufficient answer**:  
    - **Yes** → Stop. **Verdict**: ✅ *"No verdict—replication consistent with original."*  
    - **No** → Proceed to **Step 5**.  

  > *Why?*  
  > - Uses **prediction intervals** (not CIs) to account for original study’s sampling error (resolving concern #1). A CI only covers the original estimate; a prediction interval covers where replications should land.  
  > - **Which way it cuts**: Stricter than CI comparison. A replication just outside the CI may be within the prediction interval. Reduces false alarms.

  ---

  #### **Step 5: Hidden Moderator Check (15 min)**  
  **Question**: Are there credible, pre-registered moderators (population, procedure, context) that explain the discrepancy?  
  - **Sufficient answer**:  
    - **Yes** (e.g., replication tested collectivist cultures, original in individualist) → Stop.  
      - **Verdict**: 🔄 *"No verdict—moderator likely; effect may be context-dependent."*  
    - **No** (e.g., "lab temperature differences" without pre-registration) → Proceed to **Step 6**.  

  > *Why?*  
  > - **Pre-registration prevents abuse**: Only pre-specified or strongly justified moderators allowed (resolving concern #3).  
  > - Committee votes if split (simple majority).

  ---

  #### **Step 6: Final Verdict (10 min)**  
  - **Non-significant replication** (from Steps 3–5):  
    - **Verdict**: ❌ *"Replication suggests effect is negligible or absent. Recommend: (a) Expression of concern for original, (b) Citation caution in textbook/lectures."*  
  - **Significant but smaller replication** (e.g., ES_rep = 60% ES_orig):  
    - **Verdict**: ⚠️ *"Replication confirms a weaker effect. Recommend: Meta-analysis to refine estimate."*  

  ---

  ### **What the Procedure Cannot Do**
  - **Policy decisions**: Whether to issue an expression of concern (recommends but doesn’t decide), journal policy on replications.
  - **Absolute truths**: Never concludes "effect = zero" (only "negligible in tested contexts").
  - **Theoretical importance**: Doesn’t assess if a small effect is still meaningful.
  - **Multi-study replications**: Designed for single-study replications.

  ---

  ### **Case Applications**
  #### **Case 1: Your Department’s Multi-Lab Replication**  
  - Step 1: Direct test? ✅ (authors consulted, materials matched).  
  - Step 2: Two-and-a-half rule? ✅ (n_rep = 2,000 > 2.5× n_orig [assume n_orig=150]; ES_rep ≈ 0 < 0.25×ES_orig).  
  - Skips to Step 5: Hidden moderators? ❌ (no pre-registered/supported differences).  
  - **Verdict**: ❌ *"Replication suggests effect is negligible or absent."*  

  #### **Case 2: Original Authors’ Replication (4×n, ES_rep=60% ES_orig, p=.02)**  
  - Step 1: Direct test? ✅.  
  - Step 2: Two-and-a-half rule? ❌ (ES_rep=0.6×ES_orig > 0.25×ES_orig).  
  - Step 3: Powered? ✅ (n_rep=4×n_orig easily detects 70% of ES_orig). Proceed.  
  - Step 4: Prediction interval test:  
    - Assume ES_orig=0.5, SE_orig=0.1 → Prediction interval = 0.5 ± 2.0×0.1×√(1+1/600) ≈ [0.3, 0.7].  
    - ES_rep=0.3 → Within interval? ✅ (0.3 ≥ 0.3).  
  - **Verdict**: ✅ *"No verdict—replication consistent with original."*  

  #### **Case 3: Flashy Small Study (n_orig=40) vs. Rushed Replication**  
  - Step 1: Direct test? ✅.  
  - Step 2: Two-and-a-half rule? ❌ (assume n_rep=100, 2.5×40=100 → borderline, but ES_rep not ≤0.25×ES_orig).  
  - Step 3: Powered? ❌ (replication powered for 1.5×ES_orig, not 70% of ES_orig).  
    - Required n to detect 70% of ES_orig: ~110 (if ES_orig=0.8, α=0.05, power=80%).  
    - Actual n_rep=100 → underpowered.  
  - **Verdict**: 🔄 *"No verdict—absence of evidence (underpowered for a meaningful effect)."*  
    *(Your committee’s suspicion isn’t disproven—but this replication can’t settle it.)*  

  ---

  ### **Output Template**  
  Your draft recommendation (≤2 pages) should follow this structure:  
  ```markdown
  1. **Direct Test Outcome**: [Match/Mismatch]  
  2. **Statistical Assessment**:  
     - Two-and-a-half rule met? [Yes/No]  
     - Power for meaningful effect? [Yes/No]  
     - Prediction interval test: [Within/Outside]  
     - Moderators supported? [Yes/No]  
  3. **Committee Verdict**: [Verdict from procedure]  
  4. **Limitations**: [What the procedure can’t address]  
  5. **Recommendation**: [Expression of concern? Meta-analysis? No action?]  
  ```  
  This ensures defensibility: A quantitative reader sees rigorous checks; the EIC sees clear logic; authors see transparency. When the answer is "we can’t tell," the procedure explains why (e.g., "underpowered" or "moderators plausible").
