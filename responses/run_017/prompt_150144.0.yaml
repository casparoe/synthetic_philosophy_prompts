  Final Procedure:

  # Replication Evaluation Procedure

  ## Step 1: Direct Test
  - **Question:** Is the replication a direct methodological match to the original study (i.e., same population, procedures, and measures)? 
  - **Sufficient answer:** Yes (proceed to Step 2). 
  - **If no:** Stop with verdict: *"No verdict: The replication does not directly test the same hypothesis."*

  ## Step 2: Two-and-a-Half Rule Shortcut
  - **Question:** Does the replication have a sample size at least 2.5 times the original AND is the absolute value of the replication effect estimate ≤ 0.25 times the absolute value of the original effect estimate? 
  - **If yes:** Skip to Step 5 (Hidden Moderators). 
  - **If no:** Proceed to Step 3.

  ## Step 3: Replication Power Assessment
  - **Question:** What was the replication’s power to detect 70% of the original effect size? (Use standard power calculation tools for the test used, e.g., t-test.) 
  - **For a non-significant replication result:**
    - **If power ≥ 80%:** Proceed to Step 4a. 
    - **If power < 80%:** Stop with verdict: *"No verdict: Replication is underpowered to detect a practically meaningful effect."* 
  - **For a significant replication result:** Proceed to Step 4b.

  ## Step 4: Inconsistency Test
  - **Compute:** 
    - Difference in estimates: D = |original effect estimate - replication effect estimate|
    - Standard error of difference: SE_D = √(SE_original² + SE_replication²)
    - z = D / SE_D
  - **Question:** Is z > 1.96? 
  - **If no (studies consistent):** Stop with verdict: *"No verdict: Replication is consistent with the original finding."* 
  - **If yes (studies inconsistent):** 
    - **For Step 4a (non-significant replication):** Proceed to Step 5. 
    - **For Step 4b (significant replication):** Proceed to Step 5.

  ## Step 5: Hidden Moderators
  - **Question:** Is there a credible, pre-specified (or strongly theoretically justified) moderator that could explain the discrepancy? 
  - **Process:** Committee votes (majority wins). 
  - **If yes:** Stop with verdict: *"No verdict: Discrepancy may be due to an unmeasured moderator; further research needed."* 
  - **If no:** Proceed to Step 6.

  ## Step 6: Final Verdict
  - **For a replication that took the Step 2 shortcut or came via Step 4a (non-significant and inconsistent):** 
    - Verdict: *"The replication provides strong evidence that the effect is absent (or negligible) in the tested context. We recommend an editorial expression of concern for the original study and suggest future citations note the replication failure."* 
  - **For a replication that came via Step 4b (significant but inconsistent and no moderator):** 
    - Verdict: *"The replication found a statistically significant effect, but it is substantially smaller than originally reported. We recommend future work acknowledge the smaller effect size."*

  ---

  ## Limitations
  This procedure cannot:
  - Determine whether an expression of concern should be published (it only recommends).
  - Settle debates about the exact magnitude of the effect (only whether it is inconsistent with the original).
  - Address publication policy changes (e.g., whether the journal should publish replications).
  - Handle replications of an entire literature (only single-study replications).
  - Resolve questions about the theoretical importance of an effect.

  ---

  ## Case Applications

  ### Case 1 (Multi-lab replication of your department’s finding)
  - **Step 1:** Direct test passed (yes). 
  - **Step 2:** Two-and-a-half rule met (n_rep >> 2.5*n_orig; rep_est ≈ 0 ≤ 0.25*|orig_est|). Skip to Step 5. 
  - **Step 5:** Committee votes that no credible moderator exists. 
  - **Verdict:** *"The replication provides strong evidence that the effect is absent (or negligible) in the tested context..."* 

  ### Case 2 (Replication by original authors, 4x sample, 60% effect, p=.02)
  - **Step 1:** Direct test passed. 
  - **Step 2:** Two-and-a-half rule not met (effect > 0.25 of original). 
  - **Step 3:** Replication is significant → proceed to Step 4b. 
  - **Step 4b:** Inconsistency test (z ≈ 1.07) → not inconsistent. 
  - **Verdict:** *"No verdict: Replication is consistent with the original."* 

  ### Case 3 (Flashy n=40 original; underpowered replication)
  - **Step 1:** Direct test passed. 
  - **Step 2:** Two-and-a-half rule not met (likely). 
  - **Step 3:** Non-significant replication with low power for 70% of original effect (estimated <20%). 
  - **Verdict:** *"No verdict: Replication is underpowered to detect a practically meaningful effect."* 

