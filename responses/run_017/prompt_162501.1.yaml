prompt: |-
  I teach (well, TA for) an upper-level seminar on Wittgenstein and rule-following — 16 students, one 90-minute session, whiteboard, index cards, nothing I'd have to buy or prepare in advance. We've just worked through the chapters where Kripke's skeptic raises the challenge about plus and the quus-like rival, and the room's reaction has been almost uniformly that the whole thing is a parlor trick: of course I meant addition when I said add, and the fact that I have only ever actually added pairs below some threshold is neither here nor there. I want them to feel the pull of the challenge rather than be told it, and in particular I want them to feel why the three escape hatches they keep proposing — that meaning is just a disposition to go on in a certain way, that the right rule is simply the simplest one compatible with the evidence, and that meaning is something I grasp in a flash and then consult — each lose their grip once pressed.

  So I'd like you to design a runnable activity for the session in which the students generate the underdetermining evidence themselves, collide with it before it has a name, and only afterwards get the vocabulary (the skeptical argument, the straight solution, the skeptical solution, truth conditions versus assertability conditions). Give me rules, materials, a timeline with minute counts, and stakes or payoffs that don't involve money. A few constraints that matter to me. First, run it on an invented operation rather than on addition — I've been playing with one I call flink, defined over ordered pairs of small numbers, but I'm happy to use yours — so that nobody can lean on prior arithmetic competence; the point is that a finite training sequence is compatible with indefinitely many continuations. Second, build in at least one rival rule gerrymandered onto the class's own data: it agrees with the natural rule on every pair anyone in the room has actually computed and diverges only on pairs nobody has touched, so that no amount of re-checking the record settles anything. Third, also include a rival that is not gerrymandered but equally cheap to state — for instance a rule keyed to how many times the operation has been applied so far in the session, or to who is being asked — so that the take-the-simplest-rule reflex doesn't quietly rescue them.

  Fourth, I want a stage where the room has to adjudicate someone else's continuation: I can plant a confederate, or split the room and train the two halves on different example sets, whichever you think works better. The class should be forced either to correct a person who seems to be going on perfectly naturally, or to accept a continuation that looks wrong to them, and then to notice that their own agreement is the only court of appeal left — which is exactly what the skeptical solution offers, and exactly why it initially feels like a swindle. Then the debrief: map specific moments in the activity onto the skeptical argument, onto why the dispositional and simplicity responses fail, and onto the shift from truth conditions to assertability conditions within a community. Tell me what will predictably go wrong the first time I run it — I expect at least one student to announce that on this view nothing means anything, and at least one to propose a platonic or meaning-grasping answer, and I want to know how to handle both without turning the last twenty minutes into a lecture — and be frank about which part of the problem the activity cannot reproduce and I will simply have to supply in words. I'm thinking specifically of the regress-of-interpretation point (that any further formulation or rule I add, including a written one, would itself stand in need of interpretation) and the normative dimension (that what is in question is what I ought to say next, not what I am likely to say), but tell me if you think something else is the real gap.
reasoning: |-
  We are going to design an activity for a 90-minute seminar on Wittgenstein and rule-following, focusing on Kripke's skeptical challenge. The goal is for students to generate the underdetermining evidence themselves and feel the pull of the challenge. We'll use an invented operation to avoid prior knowledge. The activity will involve generating a finite set of examples, introducing rival rules that fit the same data, and having the students adjudicate a continuation that forces them to confront the lack of a fact of the matter.

  ### Operation: "Flump"
  Let's define an operation called "flump" that takes two positive integers (a, b) and returns a non-negative integer. We'll keep the numbers small (say, between 1 and 5) for manageability. The "natural" rule we have in mind is: 
  **Natural Rule (NR):** flump(a, b) = (a + b) if a and b are both odd; otherwise, flump(a, b) = |a - b|.

  But note: we don't tell the students the rule. We only give examples.

  ### Activity Structure
  **Total Time:** 90 minutes

  #### Phase 1: Training (15 minutes)
  - **Materials:** Whiteboard, index cards (each student gets 2-3 index cards and a pen).
  - **Setup:** 
    - The TA (you) introduces the operation "flump". Explain that it takes two numbers and returns a result. 
    - Write on the board: "We are going to learn the rule for flump by example."
    - Give a few examples (without revealing the rule). Start with:
        - flump(1,1) = 2   (because both odd: 1+1=2)
        - flump(1,2) = 1   (because not both odd: |1-2|=1)
        - flump(2,1) = 1   (similarly)
        - flump(2,2) = 0   (|2-2|=0)
        - flump(1,3) = 4   (both odd: 1+3=4)
        - flump(2,3) = 1   (|2-3|=1)
        - flump(3,2) = 1
        - flump(3,3) = 6
        - flump(3,4) = 1
        - flump(4,3) = 1
        - flump(4,4) = 0

  - **Activity:** 
    - Ask students to compute a few more on their own on index cards. Give each student one pair to compute (using numbers between 1 and 5). They write the pair and their result on the card. 
    - Collect the cards and write all the results on the board. This creates a shared public record of the training set. Make sure the pairs are all within 1-5 and that you have at least 20 examples (but note: we are staying below 6).

  - **Note:** The training set must be finite and only include pairs (a,b) with a and b in {1,2,3,4,5}. We avoid pairs that would be above 5 in either component until later.

  #### Phase 2: Introducing Rivals and the Challenge (20 minutes)
  - **Materials:** Whiteboard, the existing record of flump computations.
  - **Activity:**
    - Now, present two rival rules that both fit all the existing data. One is gerrymandered to the class's own data, and the other is equally simple but keyed to an external factor.

    **Rival Rule 1 (Gerrymandered - RR1):** 
    - flump(a, b) = 
          NR(a, b) for all pairs (a,b) that have been computed by the class so far (i.e., the training set).
          But for any pair (a,b) that has not been computed by the class, flump(a,b) = 0.

    **Rival Rule 2 (Simple but Context-Dependent - RR2):** 
    - flump(a, b) = 
          (a + b) if the total number of times flump has been applied in the session (so far) is even.
          |a - b| if the total number of times flump has been applied is odd.

    - Note: The count of applications is public and known. We started with, say, 10 examples on the board (the initial ones plus the ones from students). So if we have done 20 examples, then the next application would be the 21st (odd).

  - **Challenge to the class:** 
    - "We have a rule that we've been following. But now consider a pair that we haven't done, say (5,5). What is flump(5,5)?"
    - According to NR: both odd -> 5+5=10.
    - According to RR1: since (5,5) hasn't been computed, it should be 0.
    - According to RR2: if the next application is the 21st (odd) then |5-5|=0; if even then 10.

    - Ask: "Which rule are we following? How do we know?"

  #### Phase 3: Adjudication (20 minutes)
  - **Setup:** Split the class into two groups (A and B). 
    - Group A is given a set of examples that are all pairs with both numbers <=4 (so they never see (5,x) or (x,5) for x>=5). 
    - Group B is given a set that includes some pairs with 5 but not (5,5). For example, Group B might have (5,1)=6 (by NR: both odd -> 5+1=6) and (5,2)=3 (by NR: |5-2|=3), but not (5,5).

    - **Note:** This requires a bit of preplanning. You might have prepared two sets of index cards in advance for this phase, but you said nothing to buy. So instead, do:
        - In the training phase, you already collected examples. Now, for Group A, you only show them the examples that have both numbers <=4. For Group B, you show them all examples (including those with 5) but not (5,5). 

  - **Activity:**
    - Each group is asked to compute flump(5,5) and write it on a card. 
    - Group A (only seen numbers 1-4) might compute it by extending the pattern they know: they have seen both odd -> add, otherwise subtract. So they would say 10.
    - Group B has seen (5,1)=6 and (5,2)=3. They would also say 10 by the same rule.

    - But now, introduce a confederate (or you can play the role) who was in Group B and who says: "I think flump(5,5) should be 0 because I'm following a different rule: flump(a,b) = |a-b| for any pair that includes a 5." 
      - This is a new rival rule (RR3): flump(a,b) = |a-b| if either a or b is 5, otherwise NR(a,b). 
      - Note: This rule fits all the examples that Group B has seen because:
          - (5,1): |5-1|=4? But wait, by NR we had 6. So it doesn't fit. Let me adjust.

    - Alternatively, to avoid confusion, let the confederate follow RR2. The confederate says: "I counted the number of times we've done flump. We've done 20 so far, so the next one (21) is odd. Therefore, by the rule I'm following (RR2), flump(5,5)=|5-5|=0."

    - Now, the class must adjudicate: 
        - The confederate (or a student from Group B who is instructed to follow RR2) reports 0 for (5,5). 
        - The rest of Group B and Group A report 10.

    - Ask: "Who is right? How do we decide?"

    - The class will likely say that the confederate is wrong. But then ask: "What rule were we following? The confederate can point out that the training set does not determine the rule. They were following RR2, which fits all the data. So why is 10 the correct answer and 0 incorrect?"

  #### Phase 4: Debrief (35 minutes)
  - **Mapping to the skeptical challenge:** 
    - The finite set of examples (training set) is the "evidence" for the rule. 
    - The rival rules (RR1 and RR2) show that the evidence underdetermines the rule. 
    - The adjudication phase shows that even within the community, there can be disagreements that cannot be settled by appealing to the past data or to a rule in the head (because the confederate was following a different rule that fits the data).

  - **Why the escape hatches fail:**
    1. **Dispositional response:** The rule is just my disposition to compute. 
          - But in the activity, the confederate had a different disposition (following RR2) and it was just as consistent. Also, if meaning were disposition, then if I were disposed to make a mistake, that would be the meaning? But we feel there's a right answer independent of disposition.
    2. **Simplicity response:** The natural rule is the simplest. 
          - But RR2 is also very simple (only two cases, based on parity of the count). Why is NR simpler? And what if the class had been given a different training set that made RR2 look natural? Also, note that RR1 is not simple because it's defined by the class's own past computations (so it's gerrymandered) but RR2 is not gerrymandered and is simple.
    3. **Grasping in a flash:** The rule is something I grasp all at once and then apply. 
          - But in the activity, two people grasped different rules and both fit the data. How do we decide which one was grasped?

  - **Shift to assertability conditions:**
    - The class had to adjudicate by agreement. They rejected the confederate's answer. Why? Because the community agrees on NR. But that is the only basis we have. There is no fact about the rule that we can point to beyond the community's agreement. This is the skeptical solution: meaning is fixed by the community's standards of assertion.

  - **Handling Predictable Reactions:**
    - **Student says "nothing means anything":** 
          - Acknowledge that the challenge is radical. But note: the skeptical solution does not say that nothing means anything. It says that meaning is not a matter of truth conditions (a fact about the rule) but of assertability conditions (what the community accepts). So meaning is still there, but grounded differently.
    - **Platonic or meaning-grasping answer:** 
          - Ask: "How does that help us adjudicate between the confederate and the rest? Can you point to the platonic form? How do we know which rule was grasped? What if two people have different grasps?" Press them to see that the appeal to a mental state doesn't solve the underdetermination.

  - **Gaps to Address in Words:**
    1. **Regress of interpretation:** 
          - Any rule (even written) must be interpreted. For example, if we write "add" we have to interpret what "add" means. This regress shows that we cannot ground meaning in rules without interpretation, which leads to the same problem. 
          - We can illustrate: Suppose we write the rule as "if both odd, add; else subtract absolute values." But then what is "odd"? What is "add"? These terms themselves require interpretation. The same skeptical challenge applies at every level.
    2. **Normative dimension:** 
          - The challenge is about what we *ought* to do, not what we are disposed to do. The dispositional account fails because it cannot capture normativity (the fact that we can make mistakes). In the activity, the confederate was disposed to say 0, but the community says that is wrong. The community imposes the norm.

  - **Timeline Recap:**
    - 0-15 min: Training phase (examples and student-generated data).
    - 15-35 min: Introducing rival rules and the challenge (what is flump(5,5)?).
    - 35-55 min: Adjudication phase (split groups and confederate).
    - 55-90 min: Debrief (mapping to Kripke, escape hatches, and gaps).

  ### What Might Go Wrong
  - **The confederate might not be convincing:** 
        - If you use a student as a confederate, brief them well. Or, if you don't want to use a confederate, you can split the class and train one half on a slightly different set that might lead them to a different continuation for a new pair. But the confederate is simpler.

  - **Students might not feel the pull:** 
        - Emphasize that the rival rules are equally consistent with the training data. Press them: "How would you prove that the confederate is wrong without appealing to what most of us do?"

  - **Time might run short:** 
        - Be strict on time. The debrief is crucial, so don't let the adjudication phase run over.

  - **Students might try to resolve by asking the TA:** 
        - As the TA, you must refuse to be the authority. Say: "I'm just another member of the community. And note: I could have been following RR2 too. How would you know?"

  ### Final Notes
  - The activity cannot fully reproduce the regress of interpretation or the normative dimension without becoming too abstract. You will have to explain these in the debrief.
  - The invented operation "flump" is designed to be unfamiliar. The natural rule is arbitrary enough that students won't have prior knowledge but simple enough to be learned by example.

  This activity should make the skeptical challenge tangible and set up the skeptical solution as the only way out.
answer: |-
  Below is a comprehensive, runnable activity designed to make Kripke’s rule-following skeptic feel visceral for your students. It uses an invented operation called **"flink"** to avoid leaning on arithmetic, and structures the session so students collide with underdetermination before learning the jargon. The activity runs in **90 minutes**, with built-in rivalry, adjudication, and debriefing. I’ve included rules, materials, a timeline, and strategies for predictable challenges.

  ---

  ### **Activity: The Flink Game**  
  **Premise**: Students inductively learn "flink" from examples, then confront underdetermination when extending it to new cases. Two rival rules emerge: one gerrymandered to the class’s data, and one equally simple but context-dependent.  

  ---

  ### **Materials**  
  - **Whiteboard** (record examples, rules, and conflicts).  
  - **Index cards** (1 per student for initial training; additional for voting).  
  - **Stakes**: Social/intellectual currency—e.g., "rule-defender" badges (drawn on board), group reputation, or the right to name the rival rule.  

  ---

  ### **Timeline & Rules**  
  **Total: 90 minutes**  

  #### **Phase 1: Training (15 min)**  
  - **Goal**: Generate a finite dataset for "flink."  
  - **Setup**:  
    - Define "flink" as a binary operation on pairs of integers **1–5** (e.g., flink(2,3) = ?).  
    - Use **your rule** (e.g., "Product if both odd; sum otherwise"). *Example outputs*:  
      - flink(1,3) = 3 (product; both odd)  
      - flink(2,3) = 5 (sum; 2 even)  
      - flink(4,2) = 6 (sum; both even)  
      - *Avoid pairs like (5,5) or (6,1)—save for later*.  
  - **Activity**:  
    1. Give each student 1 index card with a unique pair (a,b) where 1≤a,b≤5 (e.g., (1,4), (3,2)).  
    2. They compute flink(a,b) using *your* rule (secretly applied) and write the pair + result on the card.  
    3. Collect cards, post all pairs/results on the board. **Stop at 16 examples** (1 per student).  
  - **Key**: Students see a finite pattern but not the rule.  

  ---

  #### **Phase 2: Introduce Rivals & Force Conflict (25 min)**  
  - **Goal**: Show the training set underdetermines "flink" with two rivals.  
  - **Rival 1 (Gerrymandered)**:  
    - "**Fink-Plus**": Matches all class examples but diverges on unseen pairs.  
      - *Rule*: "If (a,b) is in the class’s dataset, use your rule. Else, output 0."  
  - **Rival 2 (Simple & Contextual)**:  
    - "**Tuesday-Flink**": Tied to an external factor (day of the week).  
      - *Rule*: "If today is Tuesday, output product if both odd, else sum. If not Tuesday, output sum if both odd, else product."  
      - *Rationale*: As simple as your rule but hinges on context (today’s date).  
  - **Activity**:  
    1. **Present rivals without names**: Write both rules side-by-side on the board.  
    2. **Test continuity**: Ask students to compute **flink(5,5)** (unseen in training).  
       - *Your rule*: Product (25) since both odd.  
       - *Fink-Plus*: 0 (not in dataset).  
       - *Tuesday-Flink*: Depends on today (e.g., 25 if Tuesday, 10 if not).  
    3. **Vote by show of hands**: "What is flink(5,5)?" Record split responses.  
    4. **Reveal the trap**: All answers fit the data. No re-checking the board resolves it.  

  ---

  #### **Phase 3: Adjudication (25 min)**  
  - **Goal**: Force students to confront community agreement as the only "court of appeal."  
  - **Setup**: Split class into **Group A** (80%) and **Group B** (20%). Plant a **confederate** in Group B (e.g., a student briefed pre-class).  
    - **Group A**: Gets all 16 training examples.  
    - **Group B**: Gets **14 examples**—*omit two critical pairs* (e.g., (1,3) and (4,2)).  
  - **Activity**:  
    1. **Compute new pairs**:  
       - Both groups compute **flink(1,4)** (seen in training; your rule = sum → 5).  
       - Group A agrees on 5.  
       - **Confederate in Group B** reports a *different* answer using **Tuesday-Flink** (e.g., if not Tuesday, product = 4).  
    2. **Adjudicate**:  
       - Groups debate: Group B’s confederate insists their answer fits *their* data.  
       - Challenge: "Correct" them or accept their answer?  
    3. **Climax**:  
       - Students realize:  
         - No dataset or "mental state" proves the confederate wrong.  
         - Agreement is the only tool—mirroring the "skeptical solution."  

  ---

  #### **Phase 4: Debrief (25 min)**  
  Map the activity to Kripke’s argument:  
  1. **Skeptical Challenge (5 min)**:  
     - "What *fact* made flink mean your rule and not Fink-Plus/Tuesday-Flink? The data underdetermines all three."  
     - Link: Students’ frustration mirrors the skeptic—no "fact" fixes meaning.  

  2. **Escape Hatches Fail (10 min)**:  
     - **Dispositions**: "If meaning = my disposition to compute, why is the confederate ‘wrong’? Dispositions vary!"  
     - **Simplicity**: "Tuesday-Flink is as simple as your rule. Why prefer one?"  
     - **Grasping in a flash**: "The confederate ‘grasped’ Tuesday-Flink instantly. How do we judge whose grasp is right?"  

  3. **Skeptical Solution (5 min)**:  
     - "When you adjudicated, you appealed to *community agreement* (assertability), not ‘truth’ about flink. That’s Kripke’s move."  

  4. **Handling Predictable Reactions**:  
     - **"Nothing means anything!"**:  
       - *Response*: "No—meaning exists, but as a social practice, not a ‘fact.’ We still call flink(2,3)=5 ‘right’—but *because we agree*, not because of metaphysics."  
     - **Platonism/Grasping**:  
       - *Response*: "If meaning is in the mind, show me the mental state that *forces* flink(5,5)=25. Why couldn’t the confederate have a different state?" Use their adjudication struggle as evidence.  

  5. **Gaps to Address Verbally**:  
     - **Regress of interpretation**: "Any rule (e.g., ‘product if both odd’) needs interpretation too. What does ‘odd’ mean? This regress never ends."  
     - **Normativity**: "The skeptic asks what you *ought* to do next. Dispositions (what you *will* do) can’t capture this—you might be ‘disposed’ to err!"  
     - **The real gap**: The activity can’t fully replicate the **normative force** of rules (why we feel *bound* by meaning). Highlight this: "We feel flink *should* be 25, but the activity shows this ‘should’ isn’t in the data or our minds—it’s in our community."  

  ---

  ### **Why This Works**  
  - **Flink > Addition**: Unfamiliar, no prior intuitions.  
  - **Rivals**: Fink-Plus (gerrymandered) and Tuesday-Flink (simple + contextual) sabotage dispositions/simplicity.  
  - **Adjudication**: Confederates force students to face community agreement as the only standard.  
  - **Stakes**: Social pressure makes the conflict feel urgent.  

  **Predictable Snags**:  
  - Students may resist voting or insist on "common sense." *Lean in*: "What is ‘common sense’ here? Your training data supports all three rules!"  
  - The confederate may falter. *Backup*: Play the role yourself, citing Tuesday-Flink confidently.  
  - Time crunch. *Fix*: Trim Phase 1 to 10 min if needed; protect debrief time.  

  **Final Tip**: End by linking to Wittgenstein: "This is why rules need a ‘form of life’—shared practices, not private facts." Assign Kripke’s text for next week to deepen the "aha!" moment.
