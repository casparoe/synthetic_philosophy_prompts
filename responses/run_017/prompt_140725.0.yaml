  ### Population Ethics Take-Home Final Question  
  **Time Allowed:** 90 minutes  
  **Instructions:** Answer all parts clearly and concisely. Show all calculations and reasoning. Closed book; no external resources. Write in complete sentences.  

  ---

  ### Setup  
  A population is defined by the welfare levels of its members. Welfare is interpersonally comparable on a **ratio scale** (ratios between welfare levels are meaningful). Key definitions:  
  - **Neutral welfare level:** 0 (a life at 0 is neither good nor bad for the person living it).  
  - **Lives worth living:** Welfare levels > 0. Lives not worth living: Welfare levels < 0.  
  - **Notation for any population:**  
    - \(n\): Headcount (number of people).  
    - \(T\): Total welfare (sum of all welfare levels).  
    - \(A = T / n\): Average welfare.  
  - **Baseline population (A*):** 10 billion (\(10^{10}\)) people at welfare level 100.  
  - **Repugnant Conclusion (RC):** For any \(\epsilon > 0\) (no matter how small), there exists a population size \(N\) such that \(N\) people at welfare \(\epsilon\) is better than A*.  

  We explore four principles to evaluate populations. Use \(\epsilon = 0.01\) for calculations.  

  ---

  ### Part 1: Generalized Mean Principle (8 marks)  
  Consider the value function \(V_\alpha = A \cdot n^\alpha\), where \(\alpha\) is a fixed parameter (\(0 \leq \alpha \leq 1\)). Examples:  
  - \(\alpha = 1\): \(V_\alpha = T\) (total utilitarianism).  
  - \(\alpha = 0\): \(V_\alpha = A\) (average utilitarianism; define \(n^0 = 1\) for \(n > 0\)).  
  - \(\alpha = 0.5\): \(V_\alpha = A \cdot \sqrt{n}\).  

  **Tasks:**  
  a. Derive the smallest integer \(N\) such that \(N\) people at \(\epsilon = 0.01\) is better than A* according to \(V_\alpha\). Express \(N\) as a function of \(\alpha\), \(\epsilon\), and A*’s parameters (\(n^* = 10^{10}\), \(A^* = 100\)).  
  b. Calculate \(N\) for:  
     - (i) \(\alpha = 1\)  
     - (ii) \(\alpha = 0.5\)  
     - (iii) \(\alpha = 0.1\)  
    (Use scientific notation where needed; round to the nearest integer.)  
  c. As \(\alpha\) decreases, what happens to \(N\)? Does \(\alpha < 1\) avoid the RC, or just make \(N\) larger? Explain.  
  d. The observable universe has \(\approx 10^{80}\) atoms. If \(N > 10^{80}\) (e.g., for \(\alpha = 0.1\)), is this a satisfactory solution to the RC? Why or why not?  

  ---

  ### Part 2: Average Utilitarianism (5 marks)  
  Consider \(\alpha = 0\): \(V_0 = A\) (average utilitarianism).  

  **Tasks:**  
  a. Prove that \(V_0\) avoids the RC for A* and \(\epsilon = 0.01\) (i.e., show \(N\) people at \(\epsilon\) is never better than A*).  
  b. Compare:  
     - Population P1: A* (10 billion at 100).  
     - Population P2: 2 people at 101.  
    Which is better according to \(V_0\)? Why?  
  c. Add one person at welfare 50 to A*. Calculate the new average. Is this new population better or worse than A*?  
  d. What does (c) imply about adding a life worth living but below the average? Is this problematic?  

  ---

  ### Part 3: Lexical Threshold Principle (8 marks)  
  Fix a threshold \(\tau > 0\) (e.g., \(\tau = 100\)). The value of a population is determined by:  
  1. Minimize the number of people below \(\tau\).  
  2. If tied, maximize total welfare \(T\).  
  This principle is complete and transitive.  

  **Tasks:**  
  a. Using \(\tau = 100\), prove that \(N\) people at \(\epsilon = 0.01\) is never better than A*.  
  b. Now consider \(M\) people at welfare \(\tau + \delta\) (e.g., \(\delta = 0.01\)). Find the smallest \(M\) such that this population is better than A*. How does \(M\) compare to the \(N\) from total utilitarianism (Part 1b-i)?  
  c. **Cliff effect:**  
     - Population R1: 200 billion (\(2 \times 10^{11}\)) people at \(\tau - \eta\) (e.g., \(\eta = 0.01\)).  
     - Population R2: 200 billion people at \(\tau + \eta\) (e.g., \(\eta = 0.01\)).  
    Compare R1 to A* and R2 to A*. What happens when welfare jumps from \(\tau - \eta\) to \(\tau + \eta\)?  
  d. Is this "cliff" (a tiny welfare change causing a huge moral difference) more or less repugnant than the RC? Explain.  

  ---

  ### Part 4: Critical-Level Utilitarianism (5 marks)  
  Value each life at \((w - c)\), where \(c > 0\) is a fixed critical level. Total value: \(V_c = \sum (w_i - c)\). Use \(c = 1\).  

  **Tasks:**  
  a. For \(N\) people at \(\epsilon = 0.01\), compute \(V_c\).  
  b. Compute \(V_c\) for A*.  
  c. Using \(c = 1\), is there any \(N\) such that \(N\) people at \(\epsilon = 0.01\) is better than A*? Why?  
  d. For \(\epsilon > c\) (e.g., \(\epsilon = 1.01\)), find the smallest \(N\) such that \(N\) people at \(\epsilon\) is better than A*.  
  e. What does \(V_c\) imply about a life with welfare \(w\) where \(0 < w < c\)?  
  f. How does \(V_c\) avoid the RC for \(\epsilon < c\), and what is the cost?  

  ---

  ### Synthesis (4 marks)  
  a. To avoid the RC, what must be sacrificed? Discuss **at least two** of:  
     - Completeness (ability to compare any two populations).  
     - Unbounded aggregation (any \(\epsilon > 0\) can be aggregated over large \(N\) to outweigh a fixed good).  
     - Continuity (tiny welfare changes cause only tiny value changes).  
     - The claim that any life worth living (\(w > 0\)) is a benefit.  
  b. Some argue A* and the \(\epsilon\)-population are **incomparable**. Does this solve the RC? What problem arises when we must choose between them?  

  ---

  ### Model Answer  
  **Part 1: Generalized Mean Principle**  
  a. Solve \(V_\alpha(\epsilon\text{-population}) > V_\alpha(\text{A*})\):  
  \[
  \epsilon \cdot N^\alpha > 100 \cdot (10^{10})^\alpha \implies N^\alpha > \frac{100 \cdot 10^{10\alpha}}{0.01} = 10^4 \cdot 10^{10\alpha} \implies N > 10^{(4/\alpha + 10)}.
  \]  
  Smallest integer \(N = \lceil 10^{(4/\alpha + 10)} \rceil\).  

  b. Calculations:  
  - (i) \(\alpha = 1\): \(N > 10^{(4/1 + 10)} = 10^{14}\) → \(N = 100,000,000,000,000\) (100 trillion).  
  - (ii) \(\alpha = 0.5\): \(N > 10^{(4/0.5 + 10)} = 10^{18}\) → \(N = 1,000,000,000,000,000,000\) (1 quintillion).  
  - (iii) \(\alpha = 0.1\): \(N > 10^{(4/0.1 + 10)} = 10^{50}\) → \(N \approx 10^{50}\).  

  c. As \(\alpha\) decreases, \(N\) increases (e.g., \(10^{14}\) vs. \(10^{50}\)). Lower \(\alpha\) does **not avoid the RC**; it only requires a larger population. For any \(\alpha > 0\), there exists \(N\) (finite) satisfying the RC.  

  d. For \(\alpha = 0.1\), \(N \approx 10^{50} < 10^{80}\) (atoms in universe). Even if \(N > 10^{80}\) (e.g., \(\alpha = 0.05\) gives \(N > 10^{90}\)), this is a **dodge**. The RC is a logical claim: if such \(N\) could exist, the \(\epsilon\)-population would be better. Physical impossibility does not resolve the ethical problem.  

  **Part 2: Average Utilitarianism**  
  a. \(V_0(\epsilon\text{-population}) = \epsilon = 0.01\), \(V_0(\text{A*}) = 100\). Since \(0.01 < 100\), the \(\epsilon\)-population is worse for any \(N\). RC avoided.  
  b. \(V_0(\text{P1}) = 100\), \(V_0(\text{P2}) = 101\). P2 is better. Trade-off: Massive loss in total welfare (from \(10^{12}\) to 202) is ignored.  
  c. New \(n = 10^{10} + 1\), new \(T = 10^{12} + 50\), new \(A = (10^{12} + 50)/(10^{10} + 1) \approx 99.999999995\). Worse than A* (100).  
  d. Adding a life worth living (50 > 0) but below average **reduces value**. This violates the intuition that such additions are beneficial ("sadistic conclusion").  

  **Part 3: Lexical Threshold Principle**  
  a. \(\epsilon = 0.01 < \tau = 100\). \(\epsilon\)-population has \(N > 0\) people below \(\tau\); A* has 0. Thus, A* is better for any \(N\). RC avoided.  
  b. \(M\) people at \(\tau + \delta = 100.01\). Both populations have 0 below \(\tau\). Tie broken by \(T\): \(M \cdot 100.01 > 10^{12}\) → \(M > 10^{12}/100.01 \approx 9.999 \times 10^9\). Smallest \(M = 9,999,000,100\). Similar to total utilitarianism’s \(N\) for \(\epsilon = 0.01\) (\(10^{14}\)), but much smaller.  
  c. With \(\tau = 100\), \(\eta = 0.01\):  
     - R1 at 99.99: All 200 billion below \(\tau\) → worse than A* (0 below \(\tau\)).  
     - R2 at 100.01: 0 below \(\tau\), \(T = 2 \times 10^{11} \times 100.01 = 2.0002 \times 10^{13}\) → better than A* (\(T = 10^{12}\)).  
     Cliff effect: A welfare increase of \(0.02\) (from 99.99 to 100.01) flips the outcome from "worse than A*" to "better than A*".  
  d. The cliff is **more repugnant** than RC. A tiny change affecting many people causes a discontinuous moral jump, prioritizing the threshold over welfare gains. RC aggregates small benefits; the cliff ignores them entirely below \(\tau\).  

  **Part 4: Critical-Level Utilitarianism**  
  a. \(V_c(\epsilon\text{-population}) = N \cdot (\epsilon - c) = N \cdot (0.01 - 1) = N \cdot (-0.99)\).  
  b. \(V_c(\text{A*}) = 10^{10} \cdot (100 - 1) = 9.9 \times 10^{11}\).  
  c. \(V_c(\epsilon\text{-population}) = -0.99N < 0 < 9.9 \times 10^{11}\). Never better. RC avoided for \(\epsilon < c\).  
  d. For \(\epsilon > c\) (e.g., \(\epsilon = 1.01\)): \(V_c = N(\epsilon - c) > 9.9 \times 10^{11}\) → \(N > 9.9 \times 10^{11}/(\epsilon - c)\). RC reappears for \(\epsilon > c\).  
  e. Lives with \(0 < w < c\) (e.g., \(w = 0.5\)) have negative value (\(w - c < 0\)). Though worth living, they are **net harms**.  
  f. Avoids RC for \(\epsilon < c\) by rejecting unbounded aggregation for small \(\epsilon\). Cost: Lives above 0 but below \(c\) are treated as harms, conflicting with the intuition that any worth-living life is a benefit.  

  **Synthesis**  
  a. To avoid RC, sacrifice:  
     - **Unbounded aggregation**: Critical-level and average utilitarianism limit aggregation for small \(\epsilon\).  
     - **Continuity**: Lexical threshold has a discontinuity at \(\tau\), creating cliffs.  
     - **All worth-living lives are benefits**: Critical-level and average utilitarianism reject this for lives below \(c\) or below average.  
     (Completeness is preserved in all examples.)  
  b. **Incomparability** (declaring A* and \(\epsilon\)-population unrankable) avoids RC but is **unsatisfactory in practice**. When forced to choose (e.g., policy decisions), incomparability offers no guidance, leading to arbitrariness or paralysis.  

  **Fifth Escape Route (Extra Note):**  
  **Variable Value Views** (e.g., diminishing marginal value of additional people) avoid RC by dampening aggregation. However, they often violate transitivity or introduce complexity without fully resolving the dilemma.  

  ---

  ### Marking Scheme (Total: 30 marks)  
  **Part 1: Generalized Mean (8 marks)**  
  - a. Correct derivation of \(N\) (3 marks). *Common error: Incorrect exponent handling.*  
  - b. Correct \(N\) for all \(\alpha\) (2 marks). *Common error: Arithmetic mistakes in exponents.*  
  - c. Correct explanation of \(\alpha\)’s effect (2 marks). *Common error: Claiming \(\alpha < 1\) eliminates RC without qualification.*  
  - d. Judgment on physical impossibility (1 mark). *Common error: Arguing \(N > 10^{80}\) resolves RC.*  

  **Part 2: Average Utilitarianism (5 marks)**  
  - a. Proof RC avoided (1 mark).  
  - b. Correct comparison and reason (1 mark).  
  - c. Correct calculation and comparison (1 mark). *Common error: Miscomputing new average.*  
  - d. Correct implication (2 marks). *Common error: Not identifying the "sadistic conclusion".*  

  **Part 3: Lexical Threshold (8 marks)**  
  - a. Proof RC avoided (1 mark).  
  - b. Correct \(M\) and comparison (2 marks). *Common error: Missing the tie-breaking by total welfare.*  
  - c. Correct cliff description (2 marks).  
  - d. Reasoned judgment on repugnance (3 marks). *Common error: Ignoring the cliff and claiming full success.*  

  **Part 4: Critical-Level (5 marks)**  
  - a. Correct \(V_c\) (0.5 marks).  
  - b. Correct \(V_c\) for A* (0.5 marks).  
  - c. Correct avoidance explanation (1 mark).  
  - d. Correct \(N\) for \(\epsilon > c\) (1 mark).  
  - e. Correct implication for \(0 < w < c\) (1 mark).  
  - f. Correct trade-off (1 mark). *Common error: Not noting lives below \(c\) are net harms.*  

  **Synthesis (4 marks)**  
  - a. Correct sacrifices (2 marks). *Common error: Vague or incomplete list.*  
  - b. Insightful analysis of incomparability (2 marks).  

  ---

  **Fifth Escape Route Note:**  
  Added in the model answer (variable value views) for completeness, but not required. This question tests the four specified approaches.  

  **Under-Specification Flags:**  
  - Part 1: \(\alpha = 0\) is excluded from the \(N\) calculation (since \(n^\alpha\) is undefined as \(\alpha \to 0^+\)), but handled separately in Part 2.  
  - Part 3: \(\tau = 100\) must be fixed for comparisons; welfare exactly at \(\tau\) is not below threshold (specified in setup).  
  - Part 4: \(c = 1\) is arbitrary but fixed for consistency; other values would shift results proportionally.  

  This question avoids survey-article tropes by requiring explicit calculation, trade-off identification, and critical analysis of "solutions" to the RC.
