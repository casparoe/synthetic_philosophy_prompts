  We are designing a take-home exam question on population ethics that forces students to engage deeply with formal principles and their implications. The goal is to move beyond the standard essay and require manipulation of principles to notice non-obvious features.

  The question will have four main parts corresponding to the four views described. We'll use the following setup:

  Setup:
  - A population is a list of welfare levels.
  - Welfare level 0 is neutral (a life at 0 is neither good nor bad for the person living it).
  - Positive numbers are lives worth living; negative numbers are lives not worth living.
  - Welfare is interpersonally comparable on a ratio scale (so ratios are meaningful).
  - Let n denote the headcount (number of people) in a population.
  - Let T denote the total welfare (sum of welfare levels).
  - Let A = T/n denote the average welfare.

  The repugnant conclusion (RC): For a baseline population A* with 10 billion people all at welfare 100, and for any ε > 0 (no matter how small), there exists some population size N such that a population of N people each at welfare ε is better than A*.

  We'll use ε = 0.01 (1% of the baseline welfare) for concreteness in calculations.

  The question:

  **Population Ethics Take-Home Exam Question**

  **Total Time: 90 minutes**

  **Instructions:** Answer all parts of the question. Show your work and reasoning. Closed book; do not consult any materials. Write your answers clearly and concisely.

  **Setup:** In this exam, we consider ethical principles for comparing populations. A population is defined by the welfare levels of its members. The welfare level 0 is neutral: a life at 0 is neither good nor bad. Positive welfare levels are lives worth living; negative are not. Welfare is interpersonally comparable on a ratio scale (so that ratios of welfare levels are meaningful). For any population, we denote:
  - n: the number of people (headcount)
  - T: the total welfare (sum of the welfare levels of all individuals)
  - A: the average welfare (T divided by n)

  The **repugnant conclusion (RC)** is the following: For a baseline population A* of 10 billion people all at welfare 100, and for any ε > 0 (no matter how small), there exists some population size N such that a population of N people each at welfare ε is better than A*.

  We will explore four principles and their implications for the repugnant conclusion.

  **Part 1: The Generalized Mean Principle (30 points)**

  Consider the family of principles that evaluate a population using the value function:

  V_α = A * (n)^α

  where α is a fixed parameter between 0 and 1 (inclusive). Note that:
  - When α = 1, V_α = T (total utilitarianism)
  - When α = 0, V_α = A (average utilitarianism) [Note: by convention, we define n^0 = 1 for n>0]
  - When α = 1/2, V_α = A * sqrt(n) (the geometric mean of total and average? Not exactly, but a compromise)

  Let the baseline population A* be 10 billion people at welfare 100. Let ε = 0.01.

  a) For a general α (0 < α ≤ 1), find an expression for the smallest integer N such that a population of N people each at welfare ε is better than A* according to V_α. Your expression should be in terms of α and ε (and the parameters of A*: n* = 10^10, A* = 100). [Hint: Set up the inequality V_α(N people at ε) > V_α(A*) and solve for N.]

  b) Compute N for the following values of α: 
     (i) α = 1 (total utilitarianism)
     (ii) α = 0.5
     (iii) α = 0.1

  [Use ε = 0.01 and the baseline as above. Round N to the nearest integer and use scientific notation if necessary.]

  c) Based on your calculations in (b), explain what happens to the required N as α decreases. Does decreasing α to a value less than 1 eliminate the repugnant conclusion? Or does it merely make the required population size larger? 

  d) The estimated number of atoms in the observable universe is about 10^80. Compare the N you found for α=0.1 to this number. If for some α the required N is larger than 10^80, does that mean the repugnant conclusion is avoided? Discuss whether this is a satisfactory solution.

  **Part 2: Average Utilitarianism (20 points)**

  Consider the case α=0: average utilitarianism (V_0 = A).

  a) Show that average utilitarianism avoids the repugnant conclusion. That is, for any ε>0 and any N, the population of N people at ε is worse than A* (10 billion at 100) according to V_0.

  b) However, average utilitarianism has other counterintuitive implications. Consider the following:
     - Population P1: 10 billion people at 100 (A*)
     - Population P2: 2 people at 101

  Which population is better according to average utilitarianism? Explain.

  c) Now consider adding a new person to an existing population. Let the existing population be 10 billion people at 100 (so average is 100). Suppose we add one new person with a welfare level of 50 (a life worth living, but below the current average). What is the new average? According to average utilitarianism, is the new population better or worse than the original? 

  d) What does your answer to (c) imply about the value of adding a person whose life is worth living but below the average? Is this a problem for average utilitarianism?

  **Part 3: The Lexical Threshold Principle (30 points)**

  We define a new principle: Fix a positive threshold τ (tau) > 0. To compare two populations P and Q:
  1. If the number of people in P with welfare below τ is less than the number in Q, then P is better than Q.
  2. If the numbers are equal, then P is better than Q if and only if the total welfare T of P is greater than that of Q.

  This principle is complete and transitive.

  a) Show that the lexical threshold principle with τ=100 avoids the repugnant conclusion for the baseline A* (10 billion at 100) and ε=0.01. That is, show that for any N, the population of N people at 0.01 is worse than A*.

  b) Now consider a different repugnant scenario. Let τ be fixed at 100. Consider a population of 10 billion people at welfare 100 (A*) and a population of M people each at welfare level τ+δ (where δ>0 is a small positive amount). For a given δ (say δ=0.01), is there an M such that the M people at 101 is better than A*? If so, find the smallest M (in terms of δ and the parameters of A*). How does M compare to the N from Part 1 for total utilitarianism? 

  c) Now consider a population that is just below the threshold. Let η (eta) be a small positive number. Consider:
     - Population Q1: 200 billion people at τ - η (so just below the threshold)
     - Population Q2: 10 billion at 100 (as above, which is above τ if τ=100? Note: we set τ=100, so 100 is not below τ? Let τ=100, then welfare 100 is at the threshold? But note: the principle counts people *below* τ. So a person at τ is not below τ. Therefore, in A*, no one is below τ. In Q1, all 200 billion are below τ (if η>0). 

  We need to adjust: set τ=100, then:
     - A* (10 billion at 100): no one below τ (since 100 is not below 100).
     - Q1: 200 billion people at 99.99 (if η=0.01, so 100 - 0.01 = 99.99) -> all below τ.

  Compare Q1 and A*: 
     - A* has 0 people below τ.
     - Q1 has 200 billion people below τ -> so by the lexical threshold, A* is better than Q1.

  Now consider a population Q3: 200 billion people at 100.01 (so above τ). Then Q3 has 0 people below τ (same as A*) and total welfare = 200e9 * 100.01 = 2.0002e13. A* has total welfare 10e9 * 100 = 1e12. So Q3 has higher total -> better than A*.

  The "cliff": Consider two populations that are very similar in welfare but on different sides of τ. Specifically, we have:
     - Population R1: 200 billion people at τ - η (say 99.99)
     - Population R2: 200 billion people at τ + η (say 100.01)

  Compare R1 and R2: 
     - R1: all below τ -> 200 billion below.
     - R2: none below τ (since τ=100 and 100.01>100) -> 0 below.
  Therefore, R2 is better than R1 by the first condition.

  But now compare R1 to A* (10 billion at 100, so 0 below τ). R1 has 200 billion below τ, so it is worse than A*. 

  On the other hand, R2 has 0 below τ and total welfare 200e9 * 100.01 = 2.0002e13, while A* has 1e12, so R2 is better than A*.

  The cliff: a tiny change in welfare (from 99.99 to 100.01) for 200 billion people causes a huge change in evaluation: from being worse than A* to being better than A*. 

  d) Is this "cliff effect" (where a tiny welfare difference for a large population leads to a huge moral difference) more or less repugnant than the original repugnant conclusion? Explain.

  **Part 4: Critical-Level Utilitarianism (20 points)**

  Consider a principle that assigns to each life a value equal to (w - c), where c is a fixed positive critical level, and then sums these values. So the value of a population is:

  V_c = sum_{i=1 to n} (w_i - c)

  a) For a population of N people all at ε, what is V_c? 

  b) Let c = 1 (one unit of welfare). For the baseline population A* (10 billion at 100), what is V_c(A*)? 

  c) For ε = 0.01 and c=1, is there any N such that a population of N people at ε is better than A*? Explain.

  d) For ε > c, show that there exists an N such that the population of N people at ε is better than A*. Express N in terms of ε, c, and the parameters of A*.

  e) What does this principle imply about a life with welfare w such that 0 < w < c? Is such a life considered a net positive or net negative? 

  f) How does critical-level utilitarianism avoid the repugnant conclusion for ε < c? What price does it pay for this avoidance?

  **Synthesis (20 points)**

  Reflect on the four principles. Each one either yields the repugnant conclusion (in some form) or avoids it at a cost.

  a) What must be sacrificed to avoid the repugnant conclusion? Consider the following features:
     - Completeness (the ability to compare any two populations)
     - Unbounded aggregation (the idea that any positive welfare, no matter how small, can be aggregated over a large enough population to outweigh a fixed good)
     - Continuity in welfare (the idea that a tiny change in welfare levels should only cause a tiny change in the evaluation of the population)
     - The idea that a life worth living (above 0) is always a benefit to add.

  b) Some have proposed that the repugnant conclusion arises because we are trying to compare populations that are incomparable. For example, we might say that A* and the huge population of barely worth living lives are incomparable. How would this help? But then, what should we do when faced with a practical choice between such populations? Is incomparability a satisfactory solution?

  ---

