  ### Moving Reference Point: The Degrading GPU Pool
  #### Problem
  - Reference point \((d_1(t), d_2(t))\) degrades over time at different rates for each org (e.g., due to idle decay).  
  - Neither Nash nor KSS natively handles this—they assume a fixed \(d\).  

  #### Engineering Solutions
  1. **Snapshot application**:  
     - Compute Nash/KSS with reference point at negotiation time \(t\).  
     - **Risk**: Orgs may delay agreement, hoping degradation improves their bargaining position.  

  2. **Generalized Nash**:  
     - Incorporate degradation rates into bargaining powers:  
       $$\max_{(u_1,u_2) \in S} (u_1 - d_1)^\alpha (u_2 - d_2)^\beta$$  
       where \(\alpha, \beta\) reflect patience (e.g., \(\alpha = 1/\text{degradation rate}_1\)).  
     - **Interpretation**: Orgs with faster degradation (higher cost of delay) get less weight.  

  3. **Dynamic KSS**:  
     - Scale gain fractions by degradation rates:  
       $$\max \min\left( \frac{u_1 - d_1}{(u_1^{max} - d_1)\gamma_1}, \frac{u_2 - d_2}{(u_2^{max} - d_2)\gamma_2} \right)$$  
       where \(\gamma_i\) = degradation rate. Favors orgs with slower degradation.  

  4. **Rubinstein bargaining**:  
     - Model explicit time discounting (e.g., Org1's utility decays 5%/day).  
     - **Equilibrium**: Allocation favors the org with slower degradation.  
     - **Drawback**: Complex for one-off allocations; better for repeated negotiations.  

  #### Recommendation
  - Use **Generalized Nash** with \(\alpha, \beta\) set to degradation rate reciprocals.  
    - **Why**: Mirrors time-sensitive bargaining, extends your log rule, and accounts for shifting references.  
  - Avoid vanilla Nash/KSS if degradation rates differ significantly—static solutions won't reflect the cost of delay.  

  ---

  ### Summary
  - **Nash** = Log rule. Prioritizes unit invariance and irrelevant option stability.  
  - **Kalai-Smorodinsky** = Colleague's min-max-fraction rule. Prioritizes equal % gains and opportunity expansion.  
  - **Moving reference**: Incorporate degradation rates into bargaining powers (Generalized Nash) or gain fractions (Dynamic KSS).  
  - **Your framework's gaps**:  
    - KSS forces unit comparability.  
    - Degradation dynamics aren't native to classic theories.  
  - **Debate residue**: The Nash/KSS disagreement is meaningful for set perturbations, but your sliding reference point is a more urgent complexity.
