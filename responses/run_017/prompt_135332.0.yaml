  ### Residue Report: Mapping Theory to Your Framework
  #### What Fits Cleanly
  - **Pareto front**: Central to both theories; aligns with your efficiency constraint.  
  - **Reference point**: Directly used as the disagreement outcome.  
  - **Non-convexity**: Both solutions are computable for discrete sets:  
    - **Nash**: Scan all points, compute \((u_1 - d_1)(u_2 - d_2)\), pick max.  
    - **KSS**: Compute utopia, then maximize \(\min(\text{gain fractions})\) over allocations.  
  - **Colleague's rule** ("minimize the largest fraction of possible gain given up"):  
    - **Verdict**: **Yes, this is KSS in disguise**.  
    - Formally: Minimizing \(\max\left(1 - \frac{u_1 - d_1}{u_1^{max} - d_1}, 1 - \frac{u_2 - d_2}{u_2^{max} - d_2}\right)\) is identical to maximizing \(\min\left(\frac{u_1 - d_1}{u_1^{max} - d_1}, \frac{u_2 - d_2}{u_2^{max} - d_2}\right)\).  
    - **Works for discrete sets? Yes**—compute gain fractions for all points and pick the highest \(\min(\cdot)\).  

  #### What Distorts or Clashes
  - **Affine rescaling invariance (Nash)**:  
    - **What it buys**: Freedom from agonizing over units. Nash is consistent if you rescale utilities.  
    - **Distortion**: KSS *fails* this—if you rescale one org's utility, the utopia point shifts, changing the solution. Forces you to justify units interpersonally.  
  - **Monotonicity (KSS) vs. IIA (Nash)**:  
    - **Philosophical clash**: Nash's IIA assumes "irrelevant" options don't matter; KSS's Monotonicity assumes all expansions should help.  
    - **Your reality**: In infrastructure, adding options (e.g., new GPU types) often *should* benefit the org that can use them most—favoring KSS. But pruning unused configs shouldn't alter allocations—favoring Nash.  
  - **Missing in your framework**:  
    - **Interpersonal utility comparison**: KSS requires comparing \(\frac{u_1 - d_1}{u_1^{max} - d_1}\) vs. \(\frac{u_2 - d_2}{u_2^{max} - d_2}\), implying utilities are cardinally comparable. Your field's unit-arguing directly clashes with this.  
  - **Thinner-than-expected debate**:  
    - The axioms are less about "fairness" and more about stability under set perturbations. Your problem (fixed set, moving reference) makes IIA vs. Monotonicity less critical.  

  #### What Your Framework Is Missing
  - **The utopia point in KSS**: Forces explicit modeling of "what's the best I could get alone?"—a useful thought experiment for defining fairness.  
  - **Axiomatic clarity**: Explicitly stating properties (e.g., "should adding GPUs help Org1?") helps defend choices to stakeholders.  

