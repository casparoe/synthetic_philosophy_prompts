prompt: |-
  hey — so I'm the student rep on my school's "vote rules commitee" (ik the name sounds made up). Basically before every school-wide referendum we decide who actually gets to vote, and we do it per issue, so the electorate is different every time. I'm the only student on it, I get one vote out of five, and we've got to rule on the next one Thursday, so help me out before I go in there.

  Heres what we've already decided:

  - Bell schedule change (starts next fall, supposed to last 3 years): exchange students who are only here for one year — allowed to vote. Someone argued they'd be gone for 2 of the 3 years and got outvoted; the reasoning that won was that they're here for it when it starts.
  - Student dress code: teachers — NOT allowed, even though a bunch of them wrote in saying it changes how they manage their classrooms.
  - Renaming the school: last year's graduates — NOT allowed, even though the old name is literally printed on their diplomas.
  - New laptop/phone policy, 4 years, starting next fall: 8th graders at the feeder middle school who've already accepted a spot here — allowed to vote.
  - 5-year cafeteria contract: the cafeteria workers — NOT allowed. Also the parents who actually pay for the lunches — NOT allowed.
  - Discipline code rewrite: kids currently serving long-term suspension — allowed, and I'm pretty sure that one passed because they're the ones the code comes down on hardest.

  Also relevant: one member once floated giving the feeder 8th graders quarter-votes instead of full ones and it got shot down, so we've never done fractional voting.

  The new case: we're voting on a 20-year bond to build a field house on the grass field. There's a group of about 40 kids who are fully enrolled and full-time and on the roll, but they do everything online from five other countries and have never set foot on campus. They're under the student handbook, they graduate with our diploma, and they pay a reduced activity fee that specifically excludes campus facilities. Every one of them is gone within 4 years, so most of the bond gets paid off after they've left, and they will never use the field house. Do they get to vote?

  I feel like there's at least three different rules that fit all six of our old decisions and they disagree here, and idk which one we're actually running. They also seem kinda like the exchange students (here when it starts, gone before it ends, voted) and kinda like the alumni (gone while the effects are actually landing, didn't vote) and weirdly like the feeder 8th graders in reverse. So I can't tell what our own precedents commit us to.

  One more thing somebody on the commitee floated that I can't tell is genius or insane: for any decision whose effects outlast the people currently enrolled, add a "future students" proxy — one extra vote cast by a teacher on behalf of students who aren't enrolled yet — or require the decision to be re-ratified five years from now by whoever is enrolled then. If we did that instead of just ruling on the remote kids, what would we be signing on to?

  Can you write it up in these sections:

  - Bottom line (~1 short paragraph): what we should decide on Thursday, just tell me.
  - Rules that fit our precedents (~250 words): the 3 or 4 rules that explain all six old decisions, and what each one says about the remote kids specifically. I care alot more about the rule we seem to be running than about the answer itself, and I want to know which rules fit the old verdicts equally well.
  - Closest analog (~150 words): which old decision is the closest match, and why the match is bad in both directions.
  - What we'd be committing to (~200 words): what principle each option locks us into for every referendum after this one, including the proxy-vote idea and the fractional-vote idea we already rejected once.
  - The case that would settle it (~150 words): one or two further cases I could bring to the meeting that would tell the rules apart — the kind where rule A and rule B give different answers.
  - Settled vs contested (~150 words): I looked this up and apparently its an actual named problem in political philosophy that people fight about, so tell me what people who really study it agree on versus where they genuinely disagree. Don't make a contested thing sound like the consensus, and flag the parts of your own answer that are just your call rather than anything agreed on.

  sorry its long, thanks tho
reasoning: |-
  Hmm, the user is a student representative on a school committee that decides who gets to vote in referendums. They've described six past decisions about voting eligibility and now need to rule on whether fully online international students should vote on a 20-year bond for a field house. These students will be gone within 4 years and won't use the facility.

  Looking at the precedents, I notice some patterns: For the bell schedule change, exchange students were allowed to vote because they'd experience the start, even though they wouldn't be there for most of it. For the dress code, teachers were excluded despite being affected. Alumni couldn't vote on renaming even though their diplomas had the old name. Feeder middle schoolers got to vote on policies affecting their future high school years. Cafeteria workers and parents were excluded from the cafeteria contract vote. Suspended students were allowed to vote on discipline codes that directly impact them.

  The key tension seems to be between "affectedness" and "presence." The exchange student case prioritized presence at implementation, while the alumni case ignored ongoing effects for those who've left. The online students are present in the system but physically absent, and while they'll experience the bond's early years, they won't benefit from the facility.

  I can identify three consistent rules that explain all six precedents:
  1) The "Present at Implementation" rule - voting requires being enrolled when the policy starts
  2) The "Direct User" rule - voting requires physical presence/usage of the affected resource
  3) The "Full Stakeholder" rule - voting requires being subject to the policy's full duration/scope

  For the online students, these rules conflict: Rule 1 says yes (they'll be here when construction starts), Rule 2 says no (they can't use the field house), Rule 3 says no (they won't experience most of the bond period).

  The closest analogy is actually a hybrid of the exchange students (allowed) and alumni (not allowed). Like exchange students, they're present when implementation begins but gone before most effects. Like alumni, their minimal physical connection to campus makes their claim weak.

  If we allow the online students to vote, we're committing to the Present at Implementation rule. If we deny them, we're leaning toward Direct User or Full Stakeholder. The proxy idea for future students is fascinating but transforms the committee's entire purpose - we'd need clear parameters for how that proxy operates.

  To test these rules, I can propose hypothetical cases: Say we're voting on a new school motto that would appear on diplomas starting immediately. Should current seniors graduating in two months vote? Present at Implementation says yes, Full Stakeholder says no. Or consider a policy about library books that only affects physical campus users - this would distinguish Direct User from the other rules.

  Philosophically, this touches on the "boundary problem" in democratic theory. Experts agree that affected interests should have voice, but disagree on how to define "affected" and how to balance practical constraints. They also debate whether future people deserve representation. My recommendation to exclude the online students leans toward practical "present at implementation with physical access" as the most consistent with precedents, though I acknowledge this involves judgment calls where experts disagree.

  I'll structure my response with clear sections: bottom line recommendation first, then analysis of the rules, closest analogies, long-term implications, test cases, and philosophical context - all while flagging where my advice involves judgment versus established consensus.
answer: |-
  ### Bottom Line
  **Vote NO: The fully online international students should NOT be allowed to vote on the 20-year field house bond.** They will experience none of the construction disruption, never use the facility, and bear none of the long-term costs/benefits. While they are enrolled when the bond *starts*, precedents prioritize tangible, ongoing impact over mere temporal presence, aligning best with the alumni and cafeteria worker decisions.

  ### Rules That Fit Our Precedents
  Four distinct rules explain all six prior decisions equally well:  

  1. **"Present at Implementation" Rule**:  
     Voters must be enrolled/employed when the policy *starts*.  
     *Fits:* Exchange students (here for schedule start), feeder 8th graders (enrolled when policy starts), suspended students (present during implementation).  
     *Remote kids:* **YES**—they’re enrolled when construction begins.  

  2. **"Direct User" Rule**:  
     Voting requires physical access to/usage of the affected resource.  
     *Fits:* Cafeteria workers excluded (don’t eat food), alumni excluded (don’t use renamed campus), teachers excluded from dress code (don’t wear uniforms).  
     *Remote kids:* **NO**—they pay fees *excluding* campus facilities and can’t use the field house.  

  3. **"Full Stakeholder" Rule**:  
     Voters must experience >50% of the policy’s duration or bear direct costs.  
     *Fits:* Exchange students (here 1/3 years) voted YES—*contradiction?* But alumni (0% duration) NO, feeder 8th graders (100% duration) YES, suspended students (100% duration) YES.  
     *Remote kids:* **NO**—gone after 20% of bond term.  

  4. **"Governed by Policy" Rule**:  
     Only those directly bound by the policy’s rules can vote.  
     *Fits:* Teachers not bound by dress code (NO), suspended students bound by discipline code (YES).  
     *Remote kids:* **NO**—bond repayment isn’t a rule they must follow.  

  **Conflict:** Rule 1 says YES to remote kids; Rules 2/3/4 say NO. Our precedents are *not* consistent—they switch between these logics.  

  ### Closest Analog  
  The **alumni (renaming vote)** is the strongest parallel:  
  - **Similarities:** Both groups have a nominal connection (diploma name/student status) but zero physical interaction with the campus during the policy’s active lifespan. Alumni’s diplomas are artifacts; remote kids’ enrollment is virtual. Both excluded.  
  - **Divergences:**  
    - *Worse than alumni:* Alumni at least stepped on campus; remote kids never have.  
    - *Better than exchange students:* Exchange students are physically present during implementation; remote kids are not.  

  This case splits the difference between the exchange student (YES) and alumni (NO) rulings, making it ambiguous.  

  ### What We’d Be Committing To  
  - **Allow remote kids to vote:** Locks in the **"Present at Implementation" rule** for all future votes. Precedents like excluding alumni become outliers.  
  - **Exclude remote kids:** Favors **"Direct User" or "Full Stakeholder" rules**, forcing future debates on defining "use" or "stake" (e.g., should commuters vote on dorm renovations?).  
  - **"Future Students" Proxy:** Commits to **representing unborn stakeholders** for *any* long-term decision. Teachers become kingmakers on bonds, facilities, or curriculum changes affecting future decades. Radically expands the committee’s scope.  
  - **Re-ratification in 5 years:** Creates a **temporal veto point**, implying no policy is settled if effects outlast voters. Could paralyze long-term planning.  

  ### The Case That Would Settle It  
  Propose two test cases to force a choice between rules:  
  1. **"A new school motto to be engraved on all diplomas starting next month."**  
     - *Rule 1 (Implementation):* Current seniors vote YES (present when motto launches).  
     - *Rule 3 (Stakeholder):* Only underclassmen vote NO (they’ll have motto on *their* diplomas; seniors graduate before it appears).  

  2. **"A tax on all club fees to fund a 10-year gym renovation."**  
     - *Rule 2 (Direct User):* Only gym users vote.  
     - *Rule 4 (Governed):* All fee-paying students vote.  

  These force the committee to prioritize *impact* over *timing* or vice versa.  

  ### Settled vs Contested  
  **Settled in political philosophy (consensus):**  
  - The "**all affected interests**" principle is foundational: those impacted by a decision should have a voice.  
  - **Practical boundaries** are unavoidable: we can’t poll every future person or distant stakeholder.  

  **Contested (no consensus):**  
  - **How to define "affected"**: Is it moral obligation (Rawls), physical impact (utilitarians), or legal coercion (Locke)? Our cafeteria worker exclusion rejects moral obligation; suspended student inclusion prioritizes coercion.  
  - **Proxy voting for future people**: Liberals (e.g., Mill) endorse it; conservatives (e.g., Burke) say it risks paternalism. No agreement on *who* should proxy (teachers? administrators?).  

  **My bottom line is contested:** I prioritize "Direct User" as most consistent with 5/6 precedents (only exchange students contradict it). But Rule 1 ("Present at Implementation") is equally defensible given your history. **This is a judgment call**—the committee must pick which principle it *wants* to elevate.
