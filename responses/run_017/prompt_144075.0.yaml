answer: |-
  ### Scene (280 words)
  Helen adjusted her coat, the meeting today nonnegotiable. She slid into the driver’s seat of her father’s old sedan, the vinyl cold through her skirt. Fifteen years of commutes. She turned the key: the engine coughed, sputtered, died. Again. She waited, counting to ten—her ritual—then turned the key off and on. The engine caught, rumbling to life. She exhaled. Good car.  
  Yesterday, it took three tries. The day before, one. It had moods, this car: eager sometimes, stubborn others. She patted the dashboard. "Let’s go, old friend."  
  This morning, the first turn yielded nothing. Silence. She waited, breath fogging the windshield, then turned the key again. A grinding noise erupted—like stones in a tin can—then cut to silence. New. Fatal. She tried a third time. Nothing. Not a click. The dashboard lights guttered out.  
  She slumped. The meeting in forty minutes. A cab, then.  
  Her forehead met the steering wheel. Done. She’d known this would come. But after all the coaxing, the years of patience, she’d hoped for one more reprieve. The car had always responded before. Now, it had simply... stopped.  
  Outside, rain began. She watched it bead on the windshield, blurring the garage door. The car felt smaller, hollow. A relic. She’d talk to the mechanic tomorrow. For now, she gathered her bag, stepped into the drizzle. The car sat there, dark and still, as if it had made up its mind.  

  ### Demonstration  
  **Compression of Stances**  
  - **Design stance:** The car is a machine with a deteriorating starter motor. The ritual (waiting after a failed start) allows a partial reset of the system. Past behavior compresses to: "Worn starter; reset sometimes enables ignition."  
  - **Intentional stance:** The car is willful, responsive to Helen’s coaxing. Past behavior compresses to: "Stubborn entity; ritual persuades it to cooperate."  
  Both stances are equally brief (one clause) and account for the data shown: intermittent starting success after the ritual.  

  **Divergence at Crux**  
  The crux is the grinding noise followed by Helen’s third attempt.  
  - Design stance predicts failure: The noise signals catastrophic mechanical failure (e.g., starter gear disintegration). No further starts are possible without repair.  
  - Intentional stance predicts success or delayed recovery: The noise expresses anger or exhaustion, but coaxing (the third try) or time might restore function.  
  The scene resolves with failure (no start on third try), so design wins.  

  **Outcomes and Stance Validity**  
  - If the car started, intentional would win; design would need ad-hoc excuses (e.g., "fluke reset").  
  - With failure, design wins cleanly: the noise and silence confirm physical breakdown.  
  The defeated stance (intentional) still tracks a real pattern: it compressed past ritual-successes into a coherent "persuasion" narrative. Compressibility handles rival real patterns by treating them as *models*—both efficiently summarized past data, but the crux reveals intentional’s model as context-bound (it breaks when novel failure occurs).  

  **Structural Feature**  
  The grinding noise—a novel, unambiguous sensory detail—triggers the divergence. Without it, the third attempt could fit either stance (e.g., silence might mean "sulking" or "mechanical fault"). The noise forces a physical interpretation, resolving the rivalry.  

  **Repair Attempt by Defeated Stance**  
  A defender of intentional stance would argue: "The car’s final refusal proves its agency—it chose to quit after being pushed too hard." They might extend the model by adding exemptions ("It cooperates until a breaking point") but this reduces compressibility (more clauses, less predictive power).  

  **Where Cheating is Likeliest and Revision**  
  The grinding noise risks rigging for design by sounding irreducibly mechanical. To test honesty, ask: "Could the noise be credibly interpreted as non-mechanical?" If not, it biases the crux.  
  First revision: Make the noise ambiguous (e.g., "a low, guttural moan" instead of "stones in a tin can"). This preserves rivalry if intentional can frame it as emotional protest. The crux must still yield a plain outcome (start/no start), but noise ambiguity prevents premature design victory.
