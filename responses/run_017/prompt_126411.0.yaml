prompt: |-
  Hey, I need a hand before Thursday. I'm a philosophy PhD student and I've been siting on our university's Advisory Committee on Enhancement for two years — we rule on whether Student Health may fund or provide an intervention, and we have exactly three verdicts available: "treat — fund it", "enhance — don't fund", or "not our call — send it back". I'm also using the minutes as data for a chapter, and I have a bet running with my supervisor about the March proposal, so I want to predict it properly rather than guess. No lit review and no citations please, I've got all that stuff; I want the reasoning. Please write in American English.

  The track record, six recent cases:

  1. Funded: SSRI plus CBT for a PhD student with diagnosed major depression, functioning well below her own baseline and below the species-typical range.
  2. Not funded: modafinil for healthy MBAs during recruiting season, requested by the business school, explicitly so they stay sharp relative to their peers. No disorder.
  3. Funded: cochlear implant for a first-year student deaf from birth, at her own request. The minutes say outright that the fact that deafness only disables someone in a hearing-designed environment does not by itself make the implant an enhancement.
  4. Not funded: growth hormone for a healthy 11-year-old at the 10th percentile for height, no deficiency, parents requesting. Committee: inside the normal range, and most of the benefit is social and positional.
  5. Funded: a circadian package for hospital security staff on permanent nights — timed melatonin, light boxes, protected nap windows. No sleep disorder, normal sleep when they're off shift, but measurable declines in reaction time and mood. The shift pattern is decades old and nobody is going to change it.
  6. Funded with conditions: custom earplugs and annual audiometry for conservatory students with no hearing loss yet, conditioned on the conservatory capping rehearsal volume and installing acoustic panels. The program had just been expanded.

  The March proposal: Student Health wants to pilot a package for graduate students in the new accelerated clinical placement track — three back-to-back 14-hour overnight shifts every other week, introduced by the university 14 months ago. The package is a wakefulness agent plus the same circadian protocol as in (5), free and voluntary, six weeks at the start of each block. The facts as I have them: off rotation these students sleep normally; on rotation they build a sleep debt with measurable drops in reaction time and mood but nothing diagnosable; the rotations are pass/fail, so nobody gains a competitive edge; and the request came from the graduate student union, not from the hospital. The hospital says the hours are set by the accreditor, and that it costed out splitting the shifts and rejected it as unaffordable.

  What I want from you: what should we decide, and what would each option do to our own precedents. Concretely — which of 2 through 6 is the closest analog and why the runner-up doesn't settle it; what are the two or three rules that fit all six precedents and then come apart on this one; and which single further case I should put on the agenda to tell those rules apart. My own hunch, which my supervisor hates, is that we aren't really tracking species-typical function or welfare at all but something like a role-relative baseline — how someone is doing relative to what their actual situation demands of them, with the demands taken as given — which would make 3 and 6 come out the way they did for a different reason than everyone on the committee thinks. Tell me whether that rule fits all six, and note that it probably rides on a further question about who created the demand, since here we did. Also: should it change anything that the students asked for this themselves instead of the institution? If the precedents genuinely underdetermine the case, say so and tell me which principle we'd be committing to under "treat", under "enhance", and under "send it back".
reasoning: |-
  Okay, let me unpack this. A philosophy PhD student on an ethics committee needs to predict a ruling on a sleep intervention for grad students pulling crazy shifts. They've got six precedents and a hunch about role-relative baselines. 

  First, scanning the cases. Funded depression treatment (1) and deafness intervention (3) make sense - clear dysfunction relative to species norms. But wait, why fund night workers' circadian help (5)? No disorder there, just bad shifts. And those musician earplugs (6) - funding prevention before any hearing loss? Hmm. Meanwhile, rejecting modafinil for MBAs (2) and growth hormone (4) feels consistent with anti-enhancement stance. 

  The March case is tricky. Grad students doing mandatory brutal shifts, no diagnosable disorder, but measurable impairment. Similar to the night workers (5) who got funded... but different because the university created this mess. The student's hunch about role-relative demands might explain why 5 and 6 were funded: the job required functioning that was being compromised. 

  But here's the rub: in 5 and 6, the demands were externally imposed (hospital shifts, loud rehearsals). Here, the university itself designed this awful schedule. If we fund this, are we endorsing their bad system? The precedents don't address who created the demand. 

  Predicting the vote... probably fund since it mirrors case 5 so closely. But the student's role-relative theory would make this even stronger - these students literally can't meet their program's demands without impairment. That fits all cases better than species-typical alone. 

  For new cases to test theories: imagine a professor wanting ADHD meds to handle a doubled teaching load. If we'd fund that, it confirms role-relative thinking. If not, we're sticking to medical need. 

  Final call? Precedents weakly point to funding, but the committee might balk at rewarding the university's bad system. If they send it back, they're making a stand about institutional responsibility.
answer: |-
  Here's the breakdown for your committee decision, stripped to core reasoning with precedent analysis:

  **Predicted Verdict: Treat — Fund It**  
  *(Likely 4-2 vote, with heated debate about institutional complicity)*

  **Closest Analog & Why Runner-Up Fails:**  
  - **#5 (circadian package for night staff)** is the direct match:  
    Identical intervention (circadian protocol + wakefulness agent), measurable functional decline without disorder, imposed work demands treated as fixed.  
  - **Runner-up #2 (modafinil for MBAs)** fails:  
    *Their* environment wasn't inherently pathological; the "demand" was peer competition, not institutional coercion. Here, shifts are mandatory and accredited.

  **The Two Rules Fitting Precedents (That Split Here):**  
  1. **"Restoration Rule":** Fund if intervention restores functioning to *baseline expected in one's unavoidable environment* (fits 1,3,5,6; explains funding cochlear despite social model argument).  
  2. **"Iatrogenic Harm Bar":** Reject if the "need" arises *solely from an avoidable system the institution controls* (fits rejecting 2 & 4; subtly explains #6 funding *only* with institutional changes).  

  **The Split:**  
  - **Restoration Rule** says FUND: Grad students can't meet accredited shift demands without impairment → package restures role-relative function.  
  - **Iatrogenic Harm Bar** says DON'T FUND: The university created this "unavoidable" demand (14-hr shifts) and rejected alternatives → funding legitimizes self-created harm.  

  **Test Case to Distinguish Rules:**  
  Propose: *"Should we fund ergonomic desks for TAs with back pain after the university extended grading hours, if cost-cutting removed existing adjustable desks?"*  
  - **Restoration Rule:** FUND (restores function to new demand).  
  - **Iatrogenic Harm Bar:** REJECT (university caused harm, shouldn't profit from bandaids).  

  **Your Hunch Assessment:**  
  **Your role-relative baseline theory fits all six perfectly:**  
  - #1: Depression → below *student-role* baseline.  
  - #2: MBAs → at *healthy-student* baseline; enhancement seeks edge.  
  - #3: Deafness → below *university-environment* baseline.  
  - #4: Height → within *pediatric-health* baseline.  
  - #5: Night staff → below *safety-critical-role* baseline.  
  - #6: Musicians → protects *conservatory-role* baseline.  

  **Key Refinement:** *Who controls the demand matters.* Funding #5/6 worked because demands were external (hospital shifts) or mitigated (acoustic panels). Here, **the university created AND controls the demand** – that's the tension.  

  **Does Student Request Change Anything?**  
  Minimally. The committee treats "need" objectively (see #2: requested by school, rejected; #3: requested by student, funded). The *source* of the request is less critical than the *nature* of the deficit.  

  **If Precedents Underdetermine (They Do):**  
  - Voting **"TREAT"** commits to: *"When institutionally-imposed roles cause functional deficits, restoration is treatment."*  
  - Voting **"ENHANCE"** commits to: *"Interventions for non-pathological, self-inflicted systemic harms are enhancements."*  
  - Voting **"SEND BACK"** commits to: *"The committee cannot rule until the university proves it exhausted alternatives."*  

  **Recommendation:**  
  Fund it (Restoration Rule is stronger in precedent), but minute this: *"Funding contingent on Hospital Affairs submitting cost analyses for shift reforms within 6 months."* This threads the needle: addresses Iatrogenic Harm concern without rejecting the package. Your supervisor loses the bet, but your theory wins.  

  // Side note: Your hunch is analytically superior. The committee is tacitly using role-relative baselines while verbally appealing to species-typical function. Case #3 is the tell: they explicitly rejected species-typical as dispositive.
