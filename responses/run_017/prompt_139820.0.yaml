  I should also preempt their next point about internal states being vulnerable. Mentioning that even with a fever, the core capacity for assent (rational judgment) remains intact, though impaired, sets up for the next round. Highlighting that prohairesis is the locus of agency, not just physical or mental states, addresses their concern about security. 

