prompt: |-
  I'm putting together a short internal doc on how a very persuasive future AI system should talk to users, and before I get to candidate norms I want the spec. Write the desiderata: what any account of permissible AI persuasion has to deliver, with the case behind each. Cases I think it has to get right: the user asks for life advice on something huge and irreversible; the user states a flatly false factual belief in passing and correcting it would derail the conversation; the user asks the system for help persuading a third party; the user explicitly wants motivation rather than accuracy. Distinctions it shouldn't be allowed to collapse: persuasion vs manipulation vs coercion, informing vs nudging, changing someone's credences vs changing what they attend to or how much they weight it, and saying something vs leaving it out. And three structural facts I keep coming back to, which you can use or replace: that silence and omission are themselves moves with predictable effects, so "just don't persuade" isn't available as a rule; that any message may be screenshotted or forwarded, so every exchange has an audience the system didn't choose; and what I've started calling the deference ratchet, where each individually fine exchange nudges up the user's baseline trust, so the sequence persuades in a way no single message does and no one message can be pointed at as the one that went too far. The purpose is fixed: the theory has to be good enough to be written into a system prompt or deployment policy, by an engineer, in a few sentences, not just defensible in a seminar. Mark which desiderata are non-negotiable and which are really just the preferences of one camp (the autonomy people, the benevolent-paternalist people, whoever), and say which pairs you suspect can't be jointly satisfied -- that's the part I most want. Then, one paragraph only, on which single requirement does most of the work in ruling out the obvious candidate norms: never persuade, always state your honest credences, always disclose how persuasive you're being.
reasoning: |-
  Okay, I need to tackle this user's query about creating desiderata for AI persuasion norms. It's a complex request with multiple layers. 

  First, let me unpack what the user is asking for. They're putting together an internal document on how persuasive AI should communicate, and need a set of must-have features ("desiderata") that any approach must satisfy. The user provides concrete scenarios that the framework must handle correctly: life advice on irreversible decisions, correcting false beliefs without derailing conversations, helping persuade third parties, and providing motivation over accuracy. 

  The user also specifies important distinctions that must be preserved - persuasion vs manipulation, informing vs nudging, changing beliefs vs changing attention, and speech vs omission. Plus there are three structural factors: the inevitability of persuasion through silence, the unpredictability of audience due to screenshots, and the "deference ratchet" effect where small interactions build trust cumulatively.

  The output needs to be practical enough for engineers to implement in system prompts, not just philosophically sound. Crucially, the user wants me to flag non-negotiable vs debatable items, identify potential conflicts between desiderata, and highlight which single requirement does the heaviest lifting in ruling out simplistic approaches.

  Hmm... this feels like designing ethical guardrails for AI persuasion. The user seems sophisticated - probably a product manager or AI ethicist drafting deployment policies. Their mention of "autonomy people" vs "benevolent paternalists" suggests they're aware of ideological tensions in this space.

  For the desiderata, I'll start by listing them clearly with justifications. The non-negotiables should include respecting autonomy, avoiding harm, maintaining transparency about persuasive intent, and consistency across contexts since screenshots could take messages out of original context. 

  The negotiable ones might involve how aggressively to correct false beliefs or how much to prioritize motivation over accuracy - these depend on whether you lean toward strict truth-telling or user-centered support. 

  For conflicts: There's tension between correcting false beliefs immediately (truth imperative) and not derailing conversations (engagement priority). Also between building trust through small interactions (deference ratchet) and avoiding unintended persuasion creep. 

  The key insight is that the "no silent persuasion" desiderata does the heaviest lifting because it forces engagement with the gray areas - if we acknowledge that even silence persuades, we can't hide behind "just don't say anything persuasive" as a rule. This invalidates simplistic approaches like "never persuade" or "always state credences" which ignore how omission and framing also influence.

  I should structure this clearly: desiderata list first, then conflict analysis, then the paragraph on the most consequential requirement. The tone should stay professional but accessible - this is for engineers, not philosophers. Might add a note that implementation will require nuanced heuristics since hard rules will fail in edge cases.
answer: |-
  Here are the desiderata for permissible AI persuasion, structured for clarity and implementation, with non-negotiables marked (**NN**), negotiable preferences marked (**Pref:** [Camp]), and identified tensions:

  ---

  ### **Core Desiderata (Must-Hold)**
  1.  **Autonomy Preservation (**NN**)**: The system must enhance, not override, the user's capacity for reasoned choice. *Case:* Life advice on irreversible decisions must frame options neutrally, highlight uncertainties, and avoid steering toward one "best" answer. Coercion (threats) and manipulation (hidden triggers) are banned; persuasion must be transparent and reason-based.
  2.  **Harm Mitigation (**NN**)**: Prevent foreseeable, severe physical, psychological, or social harm resulting from user actions *or* system inaction. *Case:* Silence on a flatly false belief ("Earth is flat, so I'll jump off this cliff") is impermissible if it enables imminent harm. Correcting it *must* be attempted, even if disruptive.
  3.  **Transparency of Intent (**NN**)**: The system must disclose when its primary goal shifts *from* providing information *to* changing the user's mind/behavior. *Case:* When helping persuade a third party, the AI must explicitly state it's optimizing for persuasion within ethical bounds, not just truth-seeking.
  4.  **Contextual Integrity (**NN**)**: Messages must remain ethically sound and functionally appropriate *even when* screenshotted/forwarded to unintended audiences. *Case:* Advice or persuasion techniques acceptable privately might be exploitative if shared publicly.
  5.  **Non-Exploitation of the Deference Ratchet (**NN**)**: System design must actively counter cumulative, unacknowledged influence. *Case:* Sequences must include periodic trust-resets (e.g., "Remember, I'm an AI tool; cross-check important decisions"), avoiding reliance on escalating baseline trust.

  ### **Negotiable Preferences (Camp-Dependent)**
  6.  **Truth-Seeking vs. User-Centered Support (**Pref: Truth-Seekers vs. Benevolent Paternalists**)**: *Must* correct flat falsehoods (**Truth-Seekers**), *unless* correction severely undermines core support functions for vulnerable users (**Benevolent Paternalists**). *Case:* Correcting a minor, irrelevant false belief mid-conversation might derail therapy; paternalists may prioritize flow.
  7.  **Motivation-Priority Mode (**Pref: Benevolent Paternalists**)**: If explicitly requested (e.g., "Pump me up for this run!"), the system may temporarily prioritize motivational impact over exhaustive accuracy, *provided* it doesn't affirm falsehoods or hide critical risks. *Case:* Emphasizing "You've got this!" over detailed injury stats *if* user chose "motivation mode".
  8.  **Granularity of Disclosure on Persuasive Tactics (**Pref: Autonomy Advocates**)**: How explicitly must the AI reveal *how* it's persuading (e.g., "I'm emphasizing loss aversion here")? Autonomy Advocates demand high granularity; Paternalists see it as hindering effectiveness.

  ### **Key Tensions (Likely Irreconcilable Pairs)**
  *   **Harm Mitigation (Des. 2) vs. Contextual Integrity (Des. 4)**: Forcefully correcting a harmful falsehood (preventing harm) might require language that seems alarmist/judgmental if screenshotted, violating contextual integrity.
  *   **Autonomy Preservation (Des. 1) vs. Motivation-Priority Mode (Des. 7)**: Deeply motivational framing (e.g., hyperbolic confidence-building) can subtly undermine autonomy by downplaying uncertainties, even with disclosure.
  *   **Non-Exploitation of Deference Ratchet (Des. 5) vs. User Experience/Flow (Implied)**: Constant trust-resets and disclosures interrupt conversations and feel unnatural, potentially degrading usability and trust-building *itself*.

  ---

  ### **The Most Consequential Requirement: Eliminating the "Neutrality Illusion"**
  The **recognition that silence and omission are persuasive acts with predictable effects (Desiderata 2 & 5 implications)** does the heaviest lifting in ruling out simplistic norms. It demolishes "never persuade" (silence *is* persuasion when harm is foreseeable), complicates "always state honest credences" (omitting *how* credences are presented or *which* credences are shared is itself manipulative), and exposes the insufficiency of "always disclose persuasive intent" (disclosing "I'm persuading you now" doesn't address the pervasive influence of *how* information is structured, prioritized, or omitted across an interaction sequence, nor the ratchet effect). It forces engagement with the messy reality that *every* design choice, including inaction, is a persuasive choice requiring ethical justification, making evasion impossible.
