  - **Narrow-SSA**:
    - Empty-world (A): P(Heads) = 1/3. Reference class is only the three awakening moments (Heads:1, Tails:2); unrelated moments (e.g., Sunday) excluded as distinguishable.
    - Crowded-world (B): P(Heads) = 1/3. Unrelated observer-moments are distinguishable (not part of the experiment) and excluded from reference class.
    - Wallpaper-variant: P(Heads) = 1/2 when Beauty sees wallpaper. Wallpaper breaks indistinguishability; under Heads, P(see wallpaper) = 1; under Tails, P(see specific wallpaper) = 1/2. After conditioning, P(Heads|striped) = [P(striped|Heads) × P(Heads)] / P(striped) = (1/2 × 1/2) / (1/2) = 1/2 (assuming P(striped) = 1/2).

  - **ICW**:
