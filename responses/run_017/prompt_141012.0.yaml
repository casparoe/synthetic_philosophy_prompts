prompt: |-
  hi — I'm doing an hour on imprecise probabilities for a reading group of ML PhD students who are all fluent Bayesians (conjugate priors, calibration, expected utility, the usual). Don't write the session for me, I want the plan for it.

  Order first, and why: I think they can't even see the point of a set of priors until something cracks the identification of "my uncertainty" with "a number", and that the lower-vs-upper distinction (what you'd pay for a bet vs what you'd sell it for) has to be in place before Γ-maximin or maximality will make any sense — but I'm not sure where updating belongs, since conditioning each measure in the set versus conditioning the lower envelope is exactly where I expect them to get lost.

  One example should carry the hour, so tell me what it has to have and what it has to lack. My instinct is an Ellsberg-type urn of unknown composition, except that seems to invite them to slap a flat hyperprior on the composition and declare the problem solved; maybe the uncertainty should come from somewhere adversarial instead.

  Misconceptions I'm expecting: that it's just robust Bayes with wider error bars, that imprecision just means you haven't thought hard enough about your prior, that independence means the set factorizes, and the one where they notice lower(A) + lower(not-A) < 1 and think probability has leaked out somewhere. Where in the sequence do I head each of them off?

  Two more things. One of them will definitely ask whether there isn't still a true probability they're just failing to pin down, and I want the session to earn the no rather than have me assert it. And give me one closing question that would actually tell me they got it rather than memorised definitions, plus what I should openly refuse to cover in an hour (I'm guessing choice functions and sets of desirable gambles).
reasoning: |-
  We are planning a one-hour session on imprecise probabilities for ML PhD students who are fluent in Bayesian methods. The goal is to introduce the key concepts without getting bogged down in technical details. The session should be structured to build understanding step by step, addressing common misconceptions and using a central example.

  ## Order of Topics and Why

  1. **Crack the identification of uncertainty with a single number:**
     - Start with a motivating example that clearly shows situations where a single probability assignment is inadequate. This should highlight the limitations of precise probabilities when there is ambiguity or lack of information.
     - Why? Until students see that uncertainty can't always be captured by a single number, they won't appreciate the need for sets of probabilities.

  2. **Introduce lower and upper probabilities (betting interpretation):**
     - Explain that for an event A, the lower probability (lower(A)) is the supremum buying price for a bet on A, and the upper probability (upper(A)) is the infimum selling price for the same bet. Emphasize that these can be different, and that lower(A) + lower(not A) can be less than 1 (and similarly, upper(A) + upper(not A) can be greater than 1).
     - Why? This distinction is fundamental to understanding imprecise probabilities and sets of priors. It sets the stage for decision making (like Γ-maximin) which requires knowing what you are willing to pay (buy) or accept (sell).

  3. **Sets of priors and updating:**
     - After establishing lower and upper probabilities, introduce the concept of a set of priors (a credal set) that generates these lower and upper probabilities. Then, discuss updating: conditioning each prior in the set individually (generalized Bayes) and note that this might not be the same as conditioning the lower envelope (which is why we condition each prior).
     - Why? Updating is a natural next step but must come after the basic concepts. The distinction between conditioning the set and conditioning the envelope is subtle and can be confusing, so it should be introduced after the students are comfortable with the set representation.

  4. **Decision making (Γ-maximin and maximality):**
     - With lower and upper probabilities in hand, we can discuss decision criteria. Γ-maximin (choosing the act with the highest minimum expected utility) and maximality (an act is maximal if no other act dominates it in every prior in the set) can be introduced.
     - Why? Decision making is the application of the imprecise probability model. Without the foundation of lower/upper probabilities, these criteria would seem arbitrary.

  ## The Central Example

  We need an example that:
  - **Must have:** ambiguity (unknown probabilities) that cannot be resolved by a single prior without being arbitrary, and which leads to different lower and upper probabilities for some events.
  - **Must lack:** an obvious way to assign a unique prior (so that a flat hyperprior would feel unsatisfactory). We want to avoid the students thinking that they can just put a prior on the set of possibilities and get a precise probability.

  **Suggestion:** Instead of the classic Ellsberg urn (which indeed might invite a hyperprior), use an adversarial setting. For instance, consider a game against an opponent who chooses the composition of an urn after you commit to a bet. 

  **Example: Adversarial Urn**
  - An urn contains 100 balls, each either red or blue. The opponent chooses the number of red balls arbitrarily (and possibly adversarially) after you decide on a betting strategy. You are to bet on the color of a single ball drawn. 
  - Consider two events: 
    - A: the ball drawn is red.
    - B: the ball drawn is blue.
  - Without any information about the opponent's choice, you cannot assign a unique probability. The set of priors is the set of all Bernoulli distributions with probability of red p, where p can be any number in [0,1]. 
  - Then, lower(A) = 0 and upper(A) = 1 (similarly for B). This extreme case shows the range of uncertainty.

  But to avoid triviality, we can modify the setup so that the opponent is constrained. For instance, the opponent must choose at least 30 red and at least 30 blue (so the composition is between 30% and 70% for red). Then:
  - lower(A) = 0.3, upper(A) = 0.7.
  - Note: lower(A) + lower(not A) = 0.3 + 0.3 = 0.6 < 1, and similarly upper(A)+upper(not A)=1.4>1.

  This example avoids the hyperprior because any symmetric hyperprior (like a uniform prior on the proportion p) would lead to a precise probability of 0.5 for red, but that does not capture the adversarial nature (the opponent can choose to harm you). In robust optimization, we care about the worst case.

  ## Addressing Misconceptions

  1. **"It's just robust Bayes with wider error bars":**
     - Head off when introducing the set of priors. Emphasize that imprecise probabilities are not just about being conservative but about representing ambiguity (Knightian uncertainty) that cannot be captured by a single prior, no matter how wide the variance.

  2. **"Imprecision just means you haven't thought hard enough about your prior":**
     - Address at the beginning when motivating the example. The adversarial setting shows that sometimes the uncertainty is inherent and not due to lack of introspection.

  3. **"Independence means the set factorizes":**
     - This is more advanced, but if it comes up when discussing multiple variables, clarify that independence in imprecise probabilities is not simply the product of marginal sets. It's a complex topic, but for an hour, we might avoid it unless asked. If raised, note that the set of joint distributions might be larger than the product of marginals.

  4. **"Probability leaked out" (due to lower(A)+lower(not A)<1):**
     - Address when introducing lower and upper probabilities. Explain that the gap (1 - [lower(A)+lower(not A)]) represents the ambiguity about A. The missing probability is not leaked but reflects the lack of knowledge that prevents us from committing to a precise probability.

  ## The "True Probability" Question

  - When the question arises (likely during the discussion of the example), respond by asking: "In the adversarial urn example, is there a true probability? Yes, the opponent chooses a fixed proportion. But note: before the opponent chooses, the true probability is unknown and can be any value in [0.3,0.7]. However, from your perspective, you have no information about what the opponent will choose. Any single probability assignment (say 0.5) would be arbitrary and would not account for the worst-case scenario. Moreover, if you are forced to use a single prior, you would be vulnerable to the opponent's choice. The set of priors captures the range of possibilities that you must consider to be robust."

  The key is to emphasize that the set of priors represents the available information, and in the face of ambiguity, a single prior would be an overstatement of knowledge.

  ## Closing Question

  To check understanding, ask: 
  **"Suppose you are offered a bet that pays $1 if a red ball is drawn from the adversarial urn (with at least 30 red and 30 blue). What is the most you would pay for this bet? And what is the least you would sell it for? How does this relate to the lower and upper probabilities?"**

  - They should answer: 
    - The most they would pay is lower(A) = $0.30 (because if they pay more, say $0.31, then the opponent can set the urn to have 30 reds and 70 blues, making the expected profit negative: 0.3*($1-$0.31) + 0.7*(-$0.31) = ... which is negative).
    - The least they would sell it for is upper(A) = $0.70 (because if they sell for less, say $0.69, then the opponent can set the urn to have 70 reds, forcing them to pay $1 with 70% chance and they only got $0.69, so they lose on average).

  This question tests whether they can connect the betting interpretation to the lower and upper probabilities in the example.

  ## What to Skip

  - **Choice functions and sets of desirable gambles:** These are more advanced and foundational approaches but would require too much time.
  - **Detailed technicalities of updating rules** beyond the basic idea of conditioning each prior in the set.
  - **Specific algorithms for computation** (except perhaps mentioning that linear programming might be involved in calculating lower expectations).
  - **Independence in imprecise probabilities** beyond a basic mention.

  ## Session Plan (60 minutes)

  1. **Introduction (5 min):** 
     - State the goal: to extend Bayesian methods to handle ambiguity (Knightian uncertainty) where probabilities are imprecise.
     - Motivate with the adversarial urn example and ask: "How would you, as a Bayesian, model this?" (Let them suggest a prior, then challenge with the opponent's ability to choose arbitrarily.)

  2. **Limits of precise probabilities (10 min):**
     - Discuss the urn example in detail. Show that any precise prior (even a symmetric one) is arbitrary and fails to account for the adversarial setting. 
     - Introduce lower and upper probabilities via betting: what you'd pay to buy a bet vs. what you'd sell it for.

  3. **Sets of priors and lower/upper probabilities (10 min):**
     - Define the credal set. For the urn, the set is {P: P(red)=p, 0.3≤p≤0.7}. 
     - Show that lower(A) = inf{P(A): P in set} and upper(A)=sup{P(A): P in set}. 
     - Note the property: lower(A) + lower(not A) = 0.3+0.3=0.6 < 1.

  4. **Addressing misconceptions (5 min):** 
     - Explicitly state and refute: "This is just robust Bayes with wider error bars" (no, it's a different representation of ambiguity) and "imprecision means you haven't thought enough" (no, sometimes information is genuinely lacking or adversarial).

  5. **Updating (10 min):**
     - Suppose we draw a ball and it's red. How to update?
     - Condition each prior in the set: for a prior with P(red)=p, after seeing red, the updated probability for the next red is (p * (number of reds-1) / (99)) ... but wait, we don't know the exact number. Actually, we have a set for p, but also we have a set for the likelihood? 
     - Actually, in the adversarial urn, after seeing one red, the set of priors for the next draw becomes: p in [max(0.3, (30-1)/(100-1)) to min(0.7, (70-1)/(100-1))] -> [29/99, 69/99] ≈ [0.2929, 0.6970]. 
     - Point: we condition each prior (each possible composition) and then take the inf and sup again.

  6. **Decision making (10 min):**
     - Introduce Γ-maximin: choose the action with the highest minimum expected utility. In the urn, if you have to bet on red or blue, the minimum expected utility for betting on red is 0.3 (if you get $1 for red) and for blue is 0.3. So they are equal. 
     - But if we have two urns and you have to choose which to bet on, and one urn has [30-70] and the other [40-60], then the minimum for the first is 0.3 and for the second is 0.4, so Γ-maximin chooses the second.

  7. **The 'true probability' question (5 min):** 
     - Pose the question and let them discuss, then guide to the answer above.

  8. **Closing question (5 min):** 
     - Pose the betting question about buying and selling the bet on red. 
     - Wrap-up: Imprecise probabilities provide a framework for robust decision making under ambiguity, without requiring arbitrary precise priors.

  This plan is ambitious for 60 minutes, so be prepared to adjust. The key is to keep the example central and the discussion interactive.
answer: |-
  Here's a structured plan for your hour, designed to challenge Bayesian intuitions while building imprecise probability (IP) concepts from the ground up. The sequence targets conceptual breakthroughs, using a single adversarial example to anchor all ideas.

  ---

  ### **Order & Why (45 min core + 15 min Q&A)**
  1. **Shatter "Uncertainty = Single Number" (10 min)**  
     - **Start with a decision problem under ambiguity** (not risk). Use a modified **adversarial Ellsberg urn**:  
       - *Setup*: "An adversary fills an urn with 100 red/blue balls. They *min-max against you*: choose the composition *after* you declare your betting strategy. You win if you draw a red ball."  
       - *Key twist*: Adversary has constraints (e.g., must include 30–70 balls of each color).  
     - **Ask**: "What would you pay for a bet on red?"  
     - **Why first?** Forces them to confront ignorance that can't be quantified as a unique probability. A hyperprior becomes indefensible—adversary optimizes against your prior. Establishes that ambiguity demands new tools.

  2. **Lower/Upper Probabilities via Betting (15 min)**  
     - **Define operationally**:  
       - Lower prob 𝖯̲(𝖠) = max price you'd pay for a bet paying $1 if 𝖠 occurs.  
       - Upper prob 𝖯̄(𝖠) = min price you'd charge to sell the same bet.  
     - **Apply to urn**:  
       - 𝖯̲(red) = 0.3 (worst case: min red balls), 𝖯̄(red) = 0.7 (best case).  
       - **Reveal non-additivity**: 𝖯̲(red) + 𝖯̲(blue) = 0.6 < 1.  
     - **Why now?** Grounds IP in behavior (not math). Shows ambiguity gap (𝖯̄ − 𝖯̲) isn't "probability leakage" but **indeterminacy**—no prior can justify buying/selling at the same price.

  3. **Sets of Priors as the Engine (10 min)**  
     - **Introduce credal set** 𝒞: the set of priors consistent with information (e.g., all Bern(𝑝) with 𝑝 ∈ [0.3,0.7]).  
     - **Connect to lower/upper**: 𝖯̲(𝖠) = inf{𝑃(𝖠) | 𝑃 ∈ 𝒞}, 𝖯̄(𝖠) = sup{𝑃(𝖠) | 𝑃 ∈ 𝒞}.  
     - **Why here?** After betting intuition, 𝒞 is revealed as the natural model. Contrast with robust Bayes: 𝒞 isn't a "belief plus error," it's *fundamental ignorance*.

  4. **Updating with Ambiguity (10 min)**  
     - **Bayesian updating per prior**: After observing data, update each 𝑃 ∈ 𝒞 individually → new credal set 𝒞|data.  
     - **Show divergence**: Lower envelope *before* vs. conditioning lower envelope. Use urn:  
       - Draw one red ball → 𝒞|data = {Bern(𝑝) | 𝑝 ∈ [29/99, 69/99]} ≈ [0.293, 0.697].  
       - Compare: Original 𝖯̲(red) = 0.3, but conditioning the lower bound (0.3) isn't 29/99.  
     - **Why last?** Updating feels like "moving math" until lower/upper bets are internalized. Now they see conditioning 𝒞 preserves coherence; alternatives don’t.

  ---

  ### **The Central Example: Key Features**
  - **Must have**:  
    - **Adversarial uncertainty** (not random): Prevents "just add a hyperprior."  
    - **Constraints on possibilities** (e.g., [0.3,0.7]): Enables calculable 𝖯̲/𝖯̄.  
    - **Bets with explicit stakes**: To define lower/upper operationally.  
  - **Must lack**:  
    - Symmetry (e.g., no "indifference" to justify uniformity).  
    - Repeated trials (avoids "frequentist escape").  
    - Real-world data (keeps focus on foundations).  

  ---

  ### **Misconceptions: When & How to Head Off**
  1. **"It's just robust Bayes with wider error bars"**  
     - **When**: During intro of credal sets (Step 3).  
     - **Head off**: Contrast goals—robust Bayes tweaks *one* prior; IP rejects that a single prior exists. Ask: "What if the adversary knows your hyperprior?"

  2. **"Imprecision means you haven't thought hard enough"**  
     - **When**: When motivating the urn (Step 1).  
     - **Head off**: Stress the adversarial setting—no amount of thinking pins down the opponent's choice. "Is your uncertainty *really* about a 'true' probability, or the lack of any probabilistic rule?"

  3. **"Independence means the set factorizes"**  
     - **Briefly preempt** in Q&A: "IP independence is *not* just 𝒞 = 𝒞₁ × 𝒞₂. It involves joint uncertainties—we'll skip this, but see Walley 1991."  

  4. **"Probability leaked out" (lower(A) + lower(¬A) < 1)**  
     - **When**: Immediately after defining lower/upper (Step 2).  
     - **Head off**: Use bets—"If you buy bets on red *and* blue, you pay $0.30+$0.30=$0.60, but only one wins. Would you do it? No! The gap is your ambiguity aversion."  

  ---

  ### **Handling "Isn't there a true probability?"**
  - **When it arises**: Likely after urn example or updating.  
  - **Earn the "no"**:  
    1. Ask: "True for *whom*? The adversary knows a 'true' proportion, but *you* don't—and they choose it *after* your decision."  
    2. Contrast: In Bayes, uncertainty is *epistemic* (about a fixed p). Here, ambiguity is *ontological*—no fixed p exists *for your decision context*.  
    3. Punchline: "IP doesn't deny a ground truth; it denies that your uncertainty is always best modeled by a single distribution over it."  

  ---

  ### **Closing Question to Test Understanding**
  - **Pose**: "In the urn, suppose you *must* choose: bet on red or blue. You’d be indifferent at 𝖯̲(red)=𝖯̲(blue)=0.3. But if the adversary could *relax* constraints to 20–80 balls, would you now prefer one bet? Why?"  
    - **Expected insight**: Ambiguity increases (𝖯̲(red)=0.2), making both bets worse, but no strict preference emerges—IP avoids arbitrary symmetry assumptions. If they invoke 𝖯̲/𝖯̄ to discuss aversion, they get it.  

  ---

  ### **What to Explicitly Skip (Declare Upfront)**  
  - **Choice functions, desirability**: "We're focusing on lower/upper probabilities as the gateway—these are deeper foundations for another time."  
  - **Computational methods**: "Γ-maximin linear programs or credal nets won't fit; assume we can compute bounds."  
  - **IP vs. other non-Bayesian models**: "We won't compare to Dempster-Shafer or fuzzy logic—this is about extending Bayesian coherence."  

  This plan forces confrontation with ambiguity’s operational meaning, using adversity to block Bayesian workarounds. The urn’s simplicity keeps focus on concepts, not math.
