prompt: |-
  So I had a long, slightly drunk argument with my friend last night — she's finishing a PhD in philosophy of mind, I do programming languages and distributed systems (day job: a verified compiler plus a raft implementation that's been haunting me for two years) — and I can't tell whether we were disagreeing about anything or just talking past each other in different jargons.

  The setup we were fighting over: assume some program, run on one machine once, is by hypothesis a mind. Now take that same program and consider: (1) it's deployed as a replicated state machine on a thousand nodes with identical inputs, like BFT replicas; (2) it runs once, but the runtime checkpoints and deterministically replays the whole run for debugging, so the exact same state sequence happens twice; (3) a runtime notices two replicas are in byte-identical states and lets them share one physical copy of that state, re-deriving separate copies only if they ever diverge; (4) someone replaces the online computation with a lazily-expanding memo table over the same input-output function, so the intermediate states exist only as entries looked up on demand; (5) all the intermediate states are computed as usual but nothing downstream reads them except a diagnostic probe nobody ever inspects. Her claim, as I understood it: what matters morally is which concrete computations actually occur, a computation really occurs only when its states stand in the right causal-counterfactual relations to each other and to behaviour — the states have to be doing work, be intervenable, not merely recorded, replayed for the record, or deduplicated away — and substrate-independence only says the abstract computation can be multiply realized, not that every encoding, trace, or lookup table of it is a mind.

  What I'd like from you: restate her position, and the main rivals you'd put on the table (straight functionalism / any correct implementation of the right abstract computation is a mind; the stronger causal-structure requirement; the lookup-table style objection that says a behavioural profile can't be enough; and whatever the best version of the purely predictive take is) as faithfully as you can in my vocabulary — labelled transition systems, runs versus traces, bisimulation and observational equivalence, full abstraction, specification-versus-implementation relations, deterministic replay, memoization, hash-consing and dedup, interventions on a state-transition function. Say which of her claims map cleanly onto distinctions I already use (e.g. trace equivalence vs bisimulation, or type vs token of a run), which only go through if you distort them, and then give me the residue report: what can't be said in that vocabulary at all, and is that because my framework is deliberately extensional and abstraction-friendly so it can't see causation, or because her "really occurs" and "doing work" talk is doing less work than it sounds like? A couple of things I especially want: (a) does the run-versus-program distinction, or anything like token identity for computations, actually carry the moral weight she puts on it, or is she borrowing a PL-sounding word to sneak in a metaphysical claim; (b) can counterfactual dependence among internal states even be stated in a framework whose whole purpose is to abstract away from how something is physically realized, or do I need to bolt on an intervention/causal-model layer — and if I bolt it on, have I just assumed her conclusion; (c) is there anything in my own toolkit that cuts against her, like the fact that we systematically identify computations up to observational equivalence and mostly don't care whether two implementations are the "same" computation. Please don't send me to papers or name-drop authors, I just want the shape of the disagreement. I mostly want to know: if I upgraded my vocabulary — added what, exactly? — would her position become statable and checkable, or would it dissolve?
