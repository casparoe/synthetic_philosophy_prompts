answer: |-
  ### Restating the Positions in Your Vocabulary
  Let's break down your friend's position and the main rival views using your computational framework (labelled transition systems, runs, traces, bisimulation, etc.). I'll avoid philosophy jargon and stick to your terminology, then map her claims to your distinctions, highlight where they fit or distort, and address your specific questions. The core disagreement centers on whether a "mind" requires not just the abstract computation but its concrete, causally active realization.

  #### Your Friend's Position (Causal-Structure Requirement)
  **Restatement in PL/Distributed Systems Terms:**  
  She argues that a "mind" corresponds to a **token run** (a concrete, physical execution) of a program, where:  
  - **States must be causally efficacious**: Each state in the run must be an *intervenable* part of the state-transition machinery. This means:  
    - States are not just recorded or replayed; they must be **computed on-the-fly** by the transition function and directly influence subsequent states/outputs.  
    - The system must allow **counterfactual interventions**: If you modify a state mid-run (e.g., via a debugger or fault injection), it must alter downstream behavior in ways that depend on the transition function. States that are epiphenomenal (e.g., computed but unused) don't count.  
  - **"Doing work" means causal coupling**: States must stand in a **causal-counterfactual relation** to behavior (inputs/outputs). This is violated if states are deduplicated, memoized, or replayed without active computation, as they lose their causal efficacy.  
  - **Substrate-independence is constrained**: While the *abstract computation* (e.g., the transition system) can be multiply realized, not all implementations qualify. A "mind" requires a physical realization where the run's states are **token-identical** to a causal process—i.e., the computation isn't just specified but *executed* with active state transitions.  

  **Applied to your scenarios:**  
  - **(1) Replicated State Machine**: 1,000 identical runs = 1,000 minds. Each replica is a separate token run with causal coupling.  
  - **(2) Deterministic Replay**: Two minds (original run + replay run). The replay is a new token run, but if it's a passive trace playback (not re-executing transitions), it might not count.  
  - **(3) State Deduplication (hash-consing)**: Still two minds. Deduplication optimizes storage but doesn't merge causal chains; replicas can diverge, so their states are still intervenable.  
  - **(4) Memoization**: No full mind. States computed lazily are "partial minds" only when accessed; the memo table itself is just a lookup structure, not a run.  
  - **(5) Unobserved Intermediates**: No mind if states aren't read. States are epiphenomenal if nothing (not even the transition function) depends on them counterfactually.  

  **Key concepts in your terms:**  
  - **Run vs. trace**: A "mind" is a *run* (a concrete sequence of state transitions), not a *trace* (the observable behavior). Runs must involve active computation.  
  - **Interventions as state mutations**: Her "causal-counterfactual relations" mean the transition function must be **invoked explicitly** per state, and states must be mutable in a way that affects outputs.  

  #### Main Rival Positions
  1. **Straight Functionalism (any correct implementation is a mind)**:  
     - Any system that **correctly implements the abstract computation** (e.g., same input-output behavior via bisimilar transition systems) is a mind. Ignores implementation details.  
     - In your scenarios: All cases (1–5) are minds if they preserve the specification (e.g., memoization is fine if it's observationally equivalent).  

  2. **Lookup-Table/Objection (behavioral equivalence isn't enough)**:  
     - A system that only encodes a **trace** (e.g., a precomputed input-output mapping) isn't a mind. Minds require **stateful computation** with intermediate steps.  
     - In your terms: A memo table (scenario 4) isn't a run—it's a trace-like artifact. Bisimulation isn't sufficient; you need the run's causal structure.  

  3. **Predictive/Information-Theoretic Take (best version)**:  
     - A mind is whatever system **minimizes prediction error** relative to inputs. Focuses on the *function* (e.g., Bayesian inference), not realization.  
     - In your terms: Only the input-output mapping matters (trace equivalence); deduplication/memoization are irrelevant if predictions are correct.  

  ### Mapping Her Claims to Your Distinctions
  Your framework is extensional and abstraction-focused (e.g., you care about *what* is computed, not *how*). Her position relies on intensional/causal aspects that don't map cleanly:  

  | Her Claim | Your Vocabulary | Clean Mapping? | Notes |
  |----------|----------------|----------------|-------|
  | "Concrete computations must occur" | **Run (token) vs. program (type)** | ✅ Clean | Your run-token distinction directly captures her "token computation" idea. Runs are concrete executions; programs are abstract specs. |
  | "States must stand in causal-counterfactual relations" | **Transition function interventions** | ⚠️ Partial | Your framework defines state transitions mathematically (e.g., `next_state = δ(current_state, input)`), but doesn't model *interventions* (e.g., "what if I mutate `s_i` mid-run?"). You'd need to add mutation/error injection to capture counterfactuals. |
  | "States must be doing work, not recorded" | **Active computation vs. trace replay** | ✅ Clean | Your **run vs. trace** distinction: A trace is a log; a run computes states. Replay (scenario 2) is a new run if states are recomputed. |
  | "Substrate-independence ≠ any encoding" | **Specification vs. implementation relations** | ⚠️ Partial | Your "full abstraction" (implementation matches spec) ignores causal details. Her view requires **causal fidelity**—implementation must mirror the spec's state transitions causally, not just extensionally. |
  | "Deduplication doesn't destroy minds" | **Hash-consing/dedup as an optimization** | ✅ Clean | Dedup is transparent if states can diverge (scenario 3)—it's just a space optimization, not a causal merge. Your Raft/compiler work likely assumes this. |
  | "Memoization voids minds" | **Memoization as lazy trace expansion** | ✅ Clean | Memoization computes states on-demand; uncomputed states don't exist. This maps to **lazy evaluation** vs. **eager execution** of runs. |

  **Where mapping distorts her claims**:  
  - **"Intervenability"**: Your framework abstracts physical realization, so "intervenable" isn't native. You'd model it as **state mutation in the transition function**, but this assumes the conclusion (it's just more computation).  
  - **"Doing work"**: Your terms are silent on energy/effort; it's about state transitions. Her phrase smuggles in **causal efficacy**—e.g., states must be *necessary* for outputs (violated in scenario 5 if states are unused).  
  - **Token identity**: Your "run" is an abstract token; hers is physical (e.g., tied to hardware).  

  **Residue: What Can't Be Said in Your Framework**  
  - **Causation/counterfactuals**: Your vocabulary is **extensional and abstraction-friendly**, so it can't express:  
    - "What if I changed state `s_i`?" (intervention counterfactuals).  
    - "Is state `s_i` causally necessary for output `o_j`?" (causal dependence).  
    This isn't a flaw—your framework deliberately ignores realization to focus on correctness. But it blinds you to her core argument.  
  - **Why?** Your toolkit is designed for **observational equivalence** (e.g., bisimulation), which abstracts away causal paths. Her position requires a **causal model** where the *process* matters, not just outcomes. Adding this would involve:  
    - **Intervention semantics**: Define state transitions as mutable (e.g., "if `s_i` is set to `x`, then `s_{i+1} = ...`").  
    - **Causal graphs**: Model states as nodes with dependencies (e.g., `s_i → s_{i+1}` must be an active computation step).  

  ### Your Specific Questions  
  **(a) Does the run-vs-program distinction carry moral weight, or is it a metaphysical sleight-of-hand?**  
  - **Yes, but it's insufficient alone**. Your run-token distinction cleanly captures her "concrete occurrence" requirement (e.g., replay is a new run-token). But she adds **causal constraints** ("states must be intervenable/doing work"), which aren't inherent to your PL definition.  
  - **Not sleight-of-hand**: She's borrowing "token" correctly but elevating it. In PL, runs are tokens, but they're still abstract (e.g., a run can be a mathematical sequence). She's demanding **physical token identity**—where the token is tied to causal processes in hardware. This *is* a metaphysical add-on, but it's coherent.  

  **(b) Can counterfactual dependence be stated in your framework? Does bolting on a causal layer assume her conclusion?**  
  - **No, not natively**. Your framework describes *actual* transitions (e.g., "`s_i` leads to `s_{i+1}`") but not *counterfactual* ones (e.g., "if `s_i` were `x`, `s_{i+1}` would be `y`").  
  - **Bolting on a causal layer**: You could add **interventionist semantics** (e.g., extend your transition system with state-mutation operators). This doesn't *assume* her conclusion—it lets you test it. For example:  
    - In scenario 5, if mutating an unused state changes no outputs, it's epiphenomenal.  
    - In memoization, if states can't be mutated before access, they aren't intervenable.  
    This would make her claims checkable (e.g., via fault injection in your Raft impl).  

  **(c) Does your toolkit (observational equivalence) cut against her?**  
  - **Yes, directly**. Your work relies on **abstraction and equivalence** (bisimulation, trace equivalence), which intentionally ignore implementation details. This clashes with her causal requirements:  
    - Example: A **bisimilar lookup table** (scenario 4) and a **step-by-step run** are observationally equivalent, so you'd treat them identically. She rejects this—only the run has a "mind."  
    - Similarly, **state deduplication** (scenario 3) is transparent under bisimulation but might violate her physical token identity.  
  - Your indifference to "sameness" of implementation is a feature for verification, but it undermines her need for causal specificity.  

  ### Would Upgrading Your Vocabulary Resolve or Dissolve Her Position?  
  - **Upgrade needed**: Add **interventionist counterfactuals** to your framework. Specifically:  
    - Define a **causal transition system** where states can be mutated externally.  
    - Require that for a run to be a "mind," all states must be **counterfactually dependent** on predecessors and influence successors (e.g., mutating `s_i` changes `s_{i+1}`).  
    - Add **causal equivalence** (beyond bisimulation): Two runs are equivalent only if their state-intervention graphs are isomorphic.  
  - **Result**: Her position **becomes statable and checkable**:  
    - You could test scenarios (e.g., in scenario 5, probe if unused states are intervenable).  
    - This doesn't *dissolve* her view—it formalizes it. For example, memoization fails if states aren't computable/intervenable on demand.  
  - **But**: It might not *convince* you. Adding causation still feels like a hardware concern, not a computational one. Your extensional view ("if it quacks like a mind, it is a mind") clashes with her intensional focus ("it must quack via causal quacking").  

  ### The Shape of the Disagreement  
  - **You (extensional/abstract)**: A mind is any system satisfying the abstract computation (spec). Implementation is irrelevant if behaviorally correct.  
  - **Her (intensional/causal)**: A mind requires a causal implementation of that computation—states must be "alive" (computed, intervenable, efficacious).  
  - **Core tension**: She sees your abstraction as "cheating" (e.g., memoization isn't a real mind); you see her demands as "overfitting to physics." Adding causal vocabulary bridges this but doesn't resolve it—it just moves the debate to: "How much causal detail is essential for mind-ness?"  

  If you upgrade your toolkit, you can finally argue on the same terms. But you might still disagree on whether causation is necessary or just an engineering detail.
