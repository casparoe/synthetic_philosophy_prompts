prompt: |-
  I spent thirty-odd years as an atmospheric physicist, and since retiring I have been sitting in on a fortnightly philosophy reading group run through the university's continuing-education programme. I am the oldest person in the room by two decades and the only one who keeps trying to turn the discussion into a measurement problem. Over the past few weeks the group has been working through the contrast between reasons that are relative to an agent and reasons that are not, and I have become preoccupied by something the discussion slides over, which I cannot name and cannot tell whether anyone has named.

  The thing I keep circling is best introduced with two cases. First, a logbook from my old research group, winter of 1971, records a suspicion that a calibration standard had drifted; the note is addressed to nobody in particular and says, roughly, that there is reason for somebody to re-run the comparison before the next measurement campaign. There was. Nobody did. Everyone who could have acted on it has since retired or died, and the instrument itself was scrapped in 1989. My instinct as a physicist is that the reason has not thereby become false: like a field that has a value at a point where no particle happens to be sitting, it was defined at a place where no agent happened to be standing, and it still is. But my instinct as a novice in this subject is that a reason is the wrong sort of thing to outlive its last possible audience, and that whatever is left over is a fact about how things would have been better, not a reason. Yet that does not seem right either: what was written in the logbook was not a remark about the value of a state of affairs, it was directed at whoever turned up, and it would have licensed criticism of that person in a way that mere badness does not. Second case: a friend of mine with moderately advanced dementia still, I want to say, has reason to keep taking a particular medication, and his physician is criticisable if she lets him stop; but he is no longer capable of grasping the consideration, weighing it, or acting for it, and it is unclear to me in what sense the reason is his rather than merely about him.

  So: is there an established concept for reasons of this shape — considerations that count in favour of an action and that seem directed at someone, but that are not, or no longer, or not yet, possessed by any agent capable of being moved by them; reasons that detach from any reasoner while retaining whatever it is that distinguishes a reason from a piece of impersonal value? The distinctions I have met so far all seem to miss. The agent-relative and agent-neutral contrast concerns who a reason is a reason for in a quite different sense. The objective and subjective distinction looks like a question of whether a reason depends on the agent's beliefs and desires, which is a separate axis from whether anybody has it at all. And impersonal or agent-neutral value looks like precisely the thing I want to distinguish this from rather than identify it with. I also suspect the puzzle is lopsided: for reasons to believe, I find it unmysterious that there should be evidence for a hypothesis that no one will ever consider, whereas the practical case is the one that bothers me, and I would like to know whether that asymmetry is real or whether I am being taken in by a difference in idiom.

  If there is a term for this, I would like the concept carved rather than merely named: what exactly the phenomenon is supposed to be, how it differs from the three or four nearest candidates, whether my two cases are really one phenomenon or several — a reason whose owner is absent, a reason whose owner cannot receive it, and perhaps a third, a reason whose owner has ceased to exist, may be different animals — and where the boundary lies, that is, at what point a detached reason collapses into a plain fact about what would be better. And if there is no established name, a coined one with a definition and a pair of clean boundary cases would serve me better than a citation: I have no access to a university library and could not chase references, so I am not asking for a reading list, only for the distinction itself worked out far enough that I can take it back to the group and defend it against people who have read more than I have.
reasoning: |-
  Okay, let's tackle this fascinating query from a retired atmospheric physicist diving into philosophy. The core issue revolves around "detached reasons"—considerations that favor an action but aren't (or can't be) grasped by any agent. They want to know if there's a term for this or if it needs to be defined anew. 

  First, I need to unpack their two cases: the unaddressed logbook note and the dementia patient's medication. Both highlight reasons that seem to exist independently of an agent's awareness or capacity. The physicist’s intuition clashes here—scientific realism suggests these reasons persist like physical properties, while philosophical training makes them question if reasons can exist without a "receiver."

  The existing distinctions they’ve encountered (agent-relative/neutral, objective/subjective) don’t quite fit. Agent-relativity is about whose interests are involved, not whether the reason is accessible. Objectivity deals with belief-dependence, not existence sans agent. Impersonal value feels too vague—they want something that retains the "directed" quality of a reason (implying potential criticism) without reducing to mere goodness. 

  The epistemic vs. practical asymmetry they mention is key. Unconsidered evidence feels unproblematic because truth isn’t agent-dependent, but practical reasons seem to require an agent to "complete" them. This suggests the puzzle is uniquely practical—reasons for action might need a target in a way reasons for belief don’t. 

  For carving the concept:  
  - **Phenomenon**: Normative standing without uptake. A consideration retains its reason-like force (warranting criticism if ignored) even when no one can act on it.  
  - **Boundaries**: It collapses into impersonal value when the "addressee" dimension vanishes entirely (e.g., "world would be better if X" lacks criticism-potential).  
  - **Cases as distinct?**: The logbook is a "dormant" reason (agent exists but unaware); dementia is "orphaned" (agent can’t uptake); scrapped instrument makes it "vestigial" (agent extinct). But all share the core feature: detached yet reason-like.  

  Coining "vestigial reason" covers the spectrum—emphasizing persistence despite lost accessibility. The dementia case clarifies the boundary: criticism attaches to the physician as a proxy, keeping it reason-like rather than collapsing into value.  

  The asymmetry is real: practical reasons are inherently "for" someone, even if detached. But criticism preserves their status—so they don’t dissolve into value facts. This should arm them for the philosophy group’s debates.
answer: |-
  Your inquiry cuts to the heart of a profound and often under-discussed tension in normative theory. What you're grappling with is **normative persistence beyond agential access**—a phenomenon that challenges standard accounts of reasons. There is no universally agreed-upon term for this, but the concept can be rigorously carved out. I propose calling these **"vestigial reasons"** and will define them against neighboring distinctions.

  ### Core Definition: Vestigial Reasons
  A **vestigial reason** is a consideration that counts in favor of an action (or attitude) *for a specifiable agent*, retains its normative force (including licensing criticism of relevant agents), but exists in a state of detachment—either because:
  - No capable agent currently possesses it (*epistemic/agential detachment*), or  
  - The agent to whom it applies cannot grasp or act on it (*receptive detachment*).

  Crucially, it differs from impersonal value by preserving **agential directedness**: it is *for someone* (even if they can't receive it), and its violation warrants criticism *of someone* (even if the violator is indirect).

  ---

  ### Distinguishing Vestigial Reasons from Neighboring Concepts
  | Concept              | Key Difference from Vestigial Reasons                                                                 |
  |----------------------|-------------------------------------------------------------------------------------------------------|
  | **Agent-Neutral Value** (e.g., "Pain is bad") | Lacks directedness: it doesn't specify *who* ought to act. Vestigial reasons target specifiable agents (e.g., "Person X has reason to avoid pain"). |
  | **Objective Reasons** (e.g., "You should brake, though you don't know the bridge is out") | Require an agent who *could* (in principle) access the reason. Vestigial reasons persist when access is impossible. |
  | **Proxy Reasons** (e.g., "Guardians should enforce medication") | Arise from others' duties. Vestigial reasons remain anchored to the original agent (e.g., the dementia patient *himself* has the reason, even if others enforce it). |
  | **Counterfactual Value** ("It would be better if...") | Lacks normative force for criticism. Vestigial reasons license blame (e.g., the logbook author could criticize negligent colleagues *in 1971*). |

  ---

  ### Boundary Cases: When Vestigial Reasons Collapse into Value
  A vestigial reason dissolves into impersonal value when **all possible connections to agency are severed**:
  1. **Temporally Irrecoverable Detachment**:  
     - *Case*: The calibration standard drifts in 1971, the instrument is scrapped in 1989, *and all records are destroyed by 2023*.  
     - *Collapse*: The fact that "recalibration would have improved data" is now mere historical value. No one is criticizable for inaction today.  
     - *Boundary*: Vestigial reasons require *some* trace of directedness (e.g., surviving records implying responsibility).

  2. **Metaphysically Impossible Uptake**:  
     - *Case*: A medication would save Patient X’s life, but X has advanced dementia *and* no proxy exists (e.g., lone individual on a desert island).  
     - *Collapse*: "X should take the pill" becomes "It would be good if X took the pill." No criticizable agent remains.  
     - *Boundary*: Vestigial reasons persist if a proxy *could* act (e.g., a physician who abandons X is criticizable).

  ---

  ### Your Cases Analyzed
  1. **The Logbook (Dormant Vestigial Reason)**  
     - *Directed at*: Any competent lab member (1971–1989).  
     - *Detachment*: Epistemic (no one read it) → Agential (no one left to act).  
     - *Why Vestigial?*  
       - Criticism was licensed in 1971 against negligent agents.  
       - Directedness survives via the logbook’s address ("to whom it may concern").  
       - *Not* mere value: The reason was *for specific agents* (lab members), not "better if."

  2. **Dementia Patient (Proxy-Anchored Vestigial Reason)**  
     - *Directed at*: The patient (despite receptive incapacity).  
     - *Detachment*: Receptive (patient can't grasp reason).  
     - *Why Vestigial?*  
       - The physician’s duty derives from *the patient’s own reason*.  
       - Criticism targets the physician *for failing the patient’s reason*, not general benevolence.  
       - *Not* proxy reason alone: If the patient had no reason, the physician’s duty would differ (e.g., comfort vs. treatment).

  ---

  ### The Epistemic/Practical Asymmetry
  Your intuition is correct: the asymmetry is real and stems from **practical reasons' second-personal structure** (Stephen Darwall’s term).  
  - **Epistemic reasons** (evidence) are *world-to-mind*: They exist independently of agents (e.g., unconsidered evidence for a theorem).  
  - **Practical reasons** are *mind-to-world*: They inherently address agents ("*You* ought to Φ").  
  Vestigial reasons arise when the "addressee" is absent but the "address" persists. The dementia patient’s reason retains second-personal force ("*He* should take pills") mediated through proxies.

  ---

  ### Why "Vestigial"?
  - **Etymology**: "Vestige" implies a trace of something that once had full presence.  
  - **Precision**: Captures persistence of normative "shape" despite functional decay.  
  - **Boundary Work**: Avoids conflating with "objective/subjective" or "agent-relative/neutral."

  ### Defending This in Your Group
  1. **Frame the gap**: Existing distinctions track *whose* reason it is or *how it’s known*, not *whether it can be known/acted upon*.  
  2. **Emphasize criticism**: Vestigial reasons explain blame in your cases better than rival accounts (e.g., the physician isn’t merely neglecting value—she’s failing *the patient*).  
  3. **Concede limits**: Vestigial reasons fade when all agential ties dissolve (boundary cases).  

  This gives you a conceptual toolkit—carved, not just named—to refine the group's discussions. If pressed for references, note affinities with "unpossessed reasons" (Skorupski) or "dormant normative powers" (Thomson), but your formulation stands independently.
