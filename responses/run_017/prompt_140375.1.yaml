prompt: |-
  I'm on the rotating duty-editor shift at a small public-health evidence service — twice a week, and three or four times a shift I have to write the one-line "bottom line" that sits on top of an evidence summary, in about ten minutes, and a second person has to sign it off before it goes up. The catch is that the same line is read by members of the public, by clinicians deciding what to do that afternoon, and gets lifted verbatim by reporters, so I can't tune how strong it is to one audience.

  Can you write me a procedure for deciding when it's OK to come out and state a claim, when to hedge it, and when to say nothing? Ground it in whatever philosophy of language actually says about the norms of assertion — knowledge vs. truth vs. reasonable belief vs. whatever else is on the table — but in a form someone with no philosophy and ten minutes can run. So: the questions in order, what counts as a good enough answer to each, where the procedure just returns "don't assert", and where it has to hand the decision to a person because it's a values call and not an epistemic one. Two wrinkles I'd like it to actually handle: (1) I'm usually speaking for the service, and I personally have not read the studies — so who is asserting, and whose epistemic position has to be good enough? (2) sentences that are true and that I do know, but which reporters will read as saying something stronger.

  Then run it on three: an n=200 preprint finding that a common supplement cuts hospitalisation; the same-day question "is this new variant spreading through the air?" where all we have is one small observational study; and a line about a booster rollout expanding next week that I know from an embargoed government briefing but can't give a reason for. Don't soften the second one — I have a feeling the procedure is going to tell me to shut up, and I want to know whether that really follows.

  Finally, say which steps are judgment calls dressed up as procedure, and where the whole thing will misfire.
reasoning: |-
  We are designing a procedure for deciding when to assert a claim in a "bottom line" summary that must serve multiple audiences (public, clinicians, reporters) without audience-specific tuning. The procedure must be grounded in the philosophy of assertion and handle two wrinkles: (1) the editor is speaking for the service and hasn't read the studies, and (2) the risk of true statements being misinterpreted as stronger claims.

  In philosophy, assertions are typically governed by a norm. The most discussed norms are:
  - Knowledge norm: assert only what you know.
  - Truth norm: assert only what is true.
  - Justified belief norm: assert only what you justifiably believe.
  - Reasonable belief norm: assert only what it is reasonable for you to believe.

  Given the context, we are acting as an agent of the evidence service. Therefore, the relevant epistemic position is that of the service, which is based on the evidence they have reviewed and the procedures they follow. Since the editor hasn't read the studies, they are relying on the service's processes and the summary provided.

  We are going to design a step-by-step procedure that the editor can run in about 10 minutes. The procedure will have steps that lead to either:
  - Assert (state the claim without hedging)
  - Hedge (state with caution, e.g., using words like "may", "suggests", "limited evidence")
  - Don't assert (say nothing or state that no conclusion can be drawn)
  - Hand off to a person (for values calls)

  The procedure must also account for the risk of misinterpretation (wrinkle 2). We'll include a step to check for potential overinterpretation.

  Procedure:

  1. **Identify the claim**: What is the exact statement we are considering for the bottom line? (This must be clear and unambiguous.)

  2. **Check the source of the claim**: 
     - Is the claim directly from a study (or studies) that the evidence service has summarized?
     - Or is it from an external source (e.g., government briefing) that the service is reporting?

     This step addresses wrinkle 1: We are asserting on behalf of the service. The service's epistemic position is based on the evidence they have reviewed and their internal quality control. If the claim is from an external source that the service hasn't independently evaluated, then we have to treat it differently.

  3. **Assess the service's epistemic position** (for claims based on evidence summaries):
     - **Strength of evidence**: Consider the study design, sample size, consistency, and limitations as presented in the evidence summary. The service should have a system for rating evidence (e.g., high, moderate, low certainty). If not, then we must use our judgment based on the summary.
     - **What does the evidence actually show?** Be precise: does it show an association, a causal link, or just correlation? Is it about a specific population?

     If the evidence is from a preprint (not peer-reviewed), that lowers the certainty. If the evidence is from multiple high-quality studies, that raises the certainty.

     We can use a quick scale:
     - High certainty: e.g., multiple RCTs or high-quality meta-analyses.
     - Moderate certainty: e.g., one well-conducted RCT or strong observational studies with consistent findings.
     - Low certainty: e.g., small observational studies, preprints, or inconsistent findings.

     If the certainty is high, we can assert without hedging. If moderate, we might hedge. If low, we might not assert or hedge heavily.

  4. **Check for overinterpretation risk**:
     - Even if the claim is true and the evidence supports it, consider if the wording might be taken to imply something stronger. For example, a study showing an association might be taken as causation by reporters.
     - If there is a risk of overinterpretation, we must either rephrase to prevent it or hedge.

  5. **Consider the consequences of being wrong**:
     - High-stakes claims (e.g., about life-threatening conditions, public policy) require more caution.
     - This step might be a values call and require handoff to a person if the stakes are extremely high and the evidence is weak.

  6. **Check for external constraints**:
     - Are there legal, ethical, or policy reasons not to assert? (e.g., embargoed information that we are not allowed to disclose without permission, or if the claim might cause panic without sufficient evidence.)

  Now, the decision tree:

  Start at step 1: Identify the claim.

  Step 2: Source
     - If the claim is from an external source that the service is merely reporting (e.g., a government announcement) and the service has not independently verified it, then:
          * If the service policy is to report such announcements (and we are allowed to by embargo rules, etc.), then we can assert the fact of the announcement (e.g., "Government to expand booster rollout next week") but must not present it as the service's own finding. We must attribute it.
          * However, if we are under embargo and cannot disclose the source, then we cannot assert until the embargo lifts. (Don't assert.)

     - If the claim is from the service's own evidence synthesis, proceed to step 3.

  Step 3: Epistemic position
     - If the evidence is of high certainty and the claim is directly supported by the evidence, then we can consider asserting without hedging.
     - If the evidence is of moderate certainty, then we must hedge (unless the consequences of being wrong are very low, but that is rare in public health).
     - If the evidence is of low certainty, then we generally do not assert a positive claim. We might say nothing or state the limitations (but note: we only have one line).

     However, if the claim is about an urgent public health matter and there is some evidence (even low certainty) that might be actionable, then we might hedge heavily. But this is a values call (step 5).

  Step 4: Overinterpretation risk
     - If the claim is supported but there is a risk of it being taken too strongly, then we must hedge even if the evidence is strong. For example, if the evidence shows association but not causation, we must use "associated with" not "causes".

  Step 5: Consequences and values
     - If the stakes are high and the evidence is weak, then even if we might normally hedge, we may decide not to assert. This step might require human judgment (e.g., consulting with a senior editor or the second sign-off person) because it involves weighing the potential harm of being wrong against the benefit of informing.

  Step 6: External constraints
     - If there are any external constraints (like embargo, legal issues) that prohibit assertion, then don't assert.

  Finally, the output of the procedure can be:
  - Assert without hedging
  - Assert with hedging
  - Don't assert
  - Hand off to a person (for steps that require a values judgment beyond the editor's authority)

  Now, let's run through the three examples:

  ### Example 1: n=200 preprint finding that a common supplement cuts hospitalisation.
  - Claim: "Taking supplement X reduces hospitalizations."
  - Step 1: Claim is clear.
  - Step 2: Source is a preprint (not peer-reviewed) that the service has summarized.
  - Step 3: Epistemic position: 
     - Preprint: not peer-reviewed -> lower certainty.
     - n=200: small sample -> lowers certainty.
     - Study design: if it's an RCT, that's better than observational, but small and preprint still make it low to moderate. Let's assume it's an RCT but underpowered due to small n. Then certainty is low to moderate.
     - The evidence summary likely rates it as low certainty.
     - So we are at the hedge or don't assert level.
  - Step 4: Overinterpretation risk: High. Reporters might take this as a proven fact and people might rush to take the supplement. We must avoid implying causation without strong evidence.
  - Step 5: Consequences: High. If false, people might take a supplement that is ineffective or even harmful, and they might delay other treatments. Also, if the supplement is expensive, it could be a waste. Given the low certainty and high stakes, we might lean toward not asserting or heavy hedging.
  - Step 6: No external constraints mentioned.

  Decision: We cannot assert without hedging. We might hedge heavily: "A small preliminary study suggests that supplement X might reduce hospitalizations, but more research is needed." But note: we are limited to one line. So we might have to be very concise: "Preliminary evidence suggests supplement X may reduce hospitalization; more research needed." However, the procedure might lead to "don't assert" if we feel the evidence is too weak and the risk too high. Alternatively, we might decide that the service's policy for preprints is to not make positive claims, then don't assert.

  But the procedure must be consistent. Given the low certainty and high risk, we might say: **Hedge heavily or don't assert**. However, the service might have a policy that preprints are not used for positive recommendations. So without a policy, we hand off to a person? But we have 10 minutes. Let's assume we have to decide.

  Given the constraints, we might output: **Hedge heavily** and in the one line we write: "Very preliminary evidence suggests a possible benefit of supplement X on hospitalization, but caution is urged due to study limitations."

  But note: the problem says we have one line. So we might have to be even more concise. Alternatively, if we cannot fit a properly hedged statement in one line, then we might have to say nothing. This is a practical constraint.

  ### Example 2: Same-day question "is this new variant spreading through the air?" where all we have is one small observational study.
  - Claim: "The new variant spreads through the air."
  - Step 1: Claim is clear.
  - Step 2: Source: one small observational study that the service has summarized.
  - Step 3: Epistemic position: 
     - One study: not replicated -> low certainty.
     - Small: low precision -> low certainty.
     - Observational: cannot prove transmission route definitively -> low certainty.
     - Overall: low certainty.
  - Step 4: Overinterpretation risk: Very high. This is a causal claim about transmission. The study might only show an association (e.g., cases in the same room) but not rule out other routes. Reporters and the public may take this as definitive.
  - Step 5: Consequences: Extremely high. If wrong, it could lead to misdirected public health measures and panic. Also, if true, it's critical to know. But with low evidence, we risk being wrong.
  - Step 6: No constraints.

  Decision: With low certainty and high risk of overinterpretation, we should not assert the claim. We might hedge heavily: "One small study suggests airborne transmission as a possible route for the new variant." But note: the question says "don't soften", meaning the editor feels they should not hedge but either say it or not. The procedure, however, requires us to consider the risks. Without sufficient evidence, we cannot make a strong claim. 

  But note: the service might feel an obligation to inform even with limited evidence because of the urgency. This is a values call (step 5). We might hand off to a senior person. However, the procedure must be run in 10 minutes. We might have a rule: for urgent matters with low evidence, we can state the finding but with heavy hedging and clear limitations. But if we cannot do that in one line, then we don't assert.

  Alternatively, we might say: "Limited evidence suggests airborne transmission of new variant is possible." But that's a hedge. The problem says "don't soften" the second one, but the procedure is telling us we must soften or not assert.

  Given the procedure, we would output: **Hedge heavily** or if we cannot hedge appropriately in one line, then **Don't assert**. The editor's feeling that we should not soften might be overruled by the procedure.

  ### Example 3: Booster rollout expanding next week from an embargoed government briefing.
  - Claim: "The booster rollout will expand next week."
  - Step 1: The claim is about a future government action.
  - Step 2: Source: embargoed government briefing. The service hasn't independently verified this, and we are under embargo (cannot disclose the source).
  - Step 3: Since it's an external source, we don't assess the evidence. We are reporting the government's plan.
  - Step 4: Overinterpretation risk: Low. It's a factual announcement.
  - Step 5: Consequences: If the government does expand, then it's true. If they change their plan, then we were wrong. But the risk is moderate: people might plan based on this. But it's an official announcement, so we are just relaying.
  - Step 6: Embargo: We cannot break the embargo. Therefore, we cannot assert until the embargo is lifted.

  Decision: **Don't assert** until the embargo is lifted. Once lifted, we can assert and attribute: "Government announces booster rollout expansion next week."

  Now, let's note the steps that are judgment calls:
  - Step 3: Assessing the strength of evidence. The editor hasn't read the study and relies on the summary. The summary might have a rating, but if not, the editor must judge. This is a judgment call.
  - Step 4: Overinterpretation risk. This requires anticipating how different audiences might interpret the statement. Judgment call.
  - Step 5: Consequences and values. This is inherently a values call and might require handoff.

  Where the whole thing might misfire:
  - If the evidence summary is flawed, then our procedure is only as good as the summary.
  - In urgent situations, we might not have time to run the full procedure, but the problem says we have 10 minutes.
  - The one-line constraint might force us to omit necessary hedging, leading to overinterpretation.
  - The procedure might be too conservative, leading to not informing the public when even limited evidence could be helpful.

  We can summarize the procedure in a flowchart:

  ```
  Start
  |
  V
  1. Identify claim --> If unclear, don't assert or clarify (but time is short).
  |
  V
  2. Source? 
     - If external and unverified: 
          * If we are allowed to report and attribute, and not under embargo: Assert with attribution.
          * If under embargo: Don't assert.
     - If from service's evidence: go to step 3.
  |
  V
  3. Epistemic position (certainty):
     - High: go to step 4.
     - Moderate: go to step 4 (but plan to hedge).
     - Low: go to step 5 (consider not asserting or heavy hedge).
  |
  V
  4. Overinterpretation risk? 
     - If high: must hedge (unless already hedging from step 3) or rephrase to avoid the risk. If we cannot rephrase without being misleading, then consider not asserting.
     - If low: then we can assert without hedging (if from step 3 with high certainty) or with the hedging already planned (moderate).
  |
  V
  5. Consequences and values: 
     - If stakes are high and evidence is weak, even a hedge might be too strong -> don't assert.
     - If stakes are high and evidence is moderate, we might decide to hedge and assert because of the urgency. This is a judgment call that may require handoff.
  |
  V
  6. External constraints: 
     - If any constraint (embargo, legal) -> don't assert.
     - Else: output the decision (assert, hedge, or don't assert).
  ```

  Note: The editor must be trained on the service's evidence rating system. If the summary doesn't have a rating, the editor must quickly assess based on standard criteria (RCT > observational, large > small, peer-reviewed > preprint, etc.). This is a weakness.

  Final procedure for the editor:

  1. **Identify the claim**: Write down the exact sentence you are considering.

  2. **Source**:
     - If it's from an external announcement (like government) and you are allowed to report it (and not under embargo), then assert with attribution (e.g., "Government announces..."). If under embargo, don't assert.
     - If it's from the service's evidence summary, proceed.

  3. **Evidence strength** (for evidence-based claims):
     - Check the evidence rating in the summary. If none, then quickly rate:
          * High: multiple high-quality studies (e.g., RCTs) with consistent findings.
          * Moderate: one high-quality study or several moderate-quality studies with consistent findings.
          * Low: single study, small sample, preprint, or inconsistent findings.
     - If high: you can assert without hedging (go to step 4).
     - If moderate: plan to hedge (go to step 4).
     - If low: you probably should not assert, but if there is a compelling reason (like urgency) then consider heavy hedging and go to step 5.

  4. **Overinterpretation risk**:
     - Could the statement be taken to mean something stronger? (e.g., association as causation, or efficacy in a subgroup as overall efficacy)
     - If yes, then you must hedge or rephrase to make the limitation clear. If you cannot do that in one line, then don't assert.

  5. **Consequences and values**:
     - How bad would it be if the claim turns out to be wrong? If very bad (e.g., life-threatening, major resource allocation) and the evidence is weak, then don't assert. If there is a high urgency to inform (e.g., immediate danger) and some evidence, then a heavily hedged statement might be justified. But if you are unsure, hand off to a senior editor.

  6. **External constraints**: 
     - Check for embargo, legal, or policy restrictions. If any, don't assert.

  Output:
  - If at any step you hit a "don't assert", then stop and don't assert.
  - If you pass through and have a green light to assert, then write the line with the appropriate level of hedging.

  Now, for the three examples:

  Example 1: 
     - Step 2: evidence summary -> proceed.
     - Step 3: low certainty (preprint, small) -> plan heavy hedge or don't assert. Given the stakes (step 5), we decide heavy hedge. 
     - Step 4: high risk of overinterpretation -> must hedge. 
     - Step 5: high stakes -> but we are hedging heavily, so we can assert with heavy hedge. 
     - Step 6: no constraints.
     - Output: **Assert with heavy hedging**. One possible line: "Preliminary, small study suggests supplement X might reduce hospitalizations; more research needed." (But one line might force a shorter version.)

  Example 2: 
     - Step 2: evidence summary -> proceed.
     - Step 3: low certainty (one small observational) -> plan not assert or heavy hedge. 
     - Step 4: very high risk -> even with hedge, it might be taken too strongly. 
     - Step 5: very high stakes -> the risk of being wrong is high. Given the low evidence, we decide not to assert. 
     - Output: **Don't assert**. (The editor's feeling to not soften is overruled by the high risk.)

  Example 3: 
     - Step 2: external, under embargo -> **Don't assert**.

  The steps that are judgment calls: 
     - Step 3 (if no rating, the editor must judge the strength)
     - Step 4 (assessing overinterpretation risk)
     - Step 5 (weighing stakes and urgency)

  Where it might misfire:
     - In step 4, the editor might fail to anticipate how a statement will be interpreted.
     - The one-line constraint might lead to omitting necessary caveats.
     - In urgent situations, the 10-minute limit might be too long, but the problem states we have 10 minutes.

  We hope this procedure balances rigor with practicality.
answer: |-
  ### Procedure for Deciding Assertion Strength in Public Health Bottom Lines  
  **Grounding:** The norm of assertion here is **justified belief** (based on evidence) combined with **pragmatic responsibility** (considering consequences for all audiences). You're asserting on behalf of the service, so the service's epistemic position (backed by its evidence-review protocols) matters—not your personal knowledge.  

  **Key Questions & Decision Flow:**  
  1. **Is the claim *actionable*?**  
     - **Good enough:** Yes, if it could change clinical/public behavior.  
     - **No:** If purely academic or irrelevant to decisions → **Don’t assert**.  
     - *Judgment call:* What counts as "actionable." Err toward caution.  

  2. **Is the evidence *service-endorsed*?**  
     - **Good enough:** The service’s review protocol has vetted the evidence (e.g., graded certainty, peer review).  
     - **No:** If based solely on external, unaudited sources (e.g., preprint without service assessment) → **Hand to person** (values call: service’s credibility threshold).  
     - *Who asserts?* The service—its epistemic position is defined by its review standards.  

  3. **What is the *certainty level*?**  
     - **High certainty** (e.g., meta-analysis of RCTs): **Assert directly**.  
     - **Moderate certainty** (e.g., single large RCT): **Hedge** ("likely," "suggests").  
     - **Low certainty** (e.g., small/observational study): **Hedge heavily** ("may," "limited evidence") or **Don’t assert** if stakes are high.  
     - *Judgment call:* Grading certainty. Use service’s rubric (if none: sample size, study design, consistency).  

  4. **Could the wording be *overinterpreted*?**  
     - **Yes:** If a technically true statement implies a stronger claim (e.g., "linked to" → misinterpreted as "causes") → **Hedge** or **Don’t assert**.  
     - **No:** Proceed.  
     - *Judgment call:* Anticipating misinterpretation. Assume reporters amplify claims.  

  5. **Are there *external constraints*?**  
     - Embargoes, legal risks, or potential harm → **Don’t assert**.  

  **When to Stop:**  
  - **Don’t assert** if: Evidence is weak + high stakes (e.g., life-or-death decisions), OR constraints apply.  
  - **Hand to person** if: Service credibility vs. public need tradeoff (e.g., urgent but weak evidence).  

  ---

  ### Test Cases  
  **Case 1: *n=200 preprint on a supplement cutting hospitalization***  
  - **Actionable?** Yes (clinicians/public may use it).  
  - **Service-endorsed?** Preprint = not service-vetted → **Hand to person**.  
    - *Values call:* Does the service have a policy on preprints? If yes, and it allows cautious summaries: proceed. If no → **Don’t assert**.  
  - **Certainty?** Low (small *n*, preprint).  
  - **Overinterpretation risk?** High (reporters may say "proven").  
  - **Constraints?** None.  
  - **Decision:** **Hedge heavily** ("Very preliminary data *suggest* supplement X *may* reduce hospitalization; caution warranted") OR **Don’t assert** if service policy rejects preprints.  

  **Case 2: *Same-day query: "Is this new variant airborne?" (one small observational study)***  
  - **Actionable?** Yes (critical for infection control).  
  - **Service-endorsed?** Likely yes (if service summarized it).  
  - **Certainty?** Low (observational, small, no replication).  
  - **Overinterpretation risk?** Very high (public may panic, clinicians may overhaul protocols).  
  - **Constraints?** None.  
  - **Decision:** **Don’t assert** a direct claim. Low certainty + high stakes + overinterpretation risk. Alternative: Hedge heavily ("Weak evidence *hints at* possible airborne spread; confirmatory studies needed"). But per your request: **Don’t assert**. *Yes, the procedure forces silence here—weak evidence + high risk of harm from overreaction.*  

  **Case 3: *Booster rollout expansion (known from embargoed briefing)***  
  - **Actionable?** Yes (public/clinicians plan ahead).  
  - **Service-endorsed?** No (external, unaudited source).  
  - **Constraints?** Embargo → **Don’t assert**.  
  - **Decision:** **Don’t assert**. Asserting would breach trust. Alternative: Wait for official announcement.  

  ---

  ### Weaknesses & Caveats  
  - **Judgment calls disguised as procedure:**  
    - Grading evidence certainty (step 3) without a service rubric.  
    - Defining "actionable" (step 1) and overinterpretation risk (step 4).  
    - Balancing public need vs. credibility (step 2 handoff).  
  - **Where it misfires:**  
    - **False negatives:** Overly conservative in crises (e.g., Case 2) when limited evidence is better than silence.  
    - **Ambiguous evidence:** Conflicting studies may force arbitrary certainty grades.  
    - **Time limits:** Rushing steps 3–4 risks missing nuances.  
  - **Mitigations:**  
    - Create service-specific standards (e.g., "Never assert on preprints").  
    - Use templates for hedging ("[Study type] suggests [finding]; further research needed").  

  **Final Tip:** When in doubt, **hedge or stay silent**. Your role is to protect the service’s trustworthiness—not to fill information gaps at all costs.
