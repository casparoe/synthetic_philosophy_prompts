  We have ten questions in Part A. At least five must be built from the four invented cases and at least two from well-known historical cases (with preference for Galileo's two-stone argument and Newton's rotating bucket). The rest should fill in distinctions.

  We'll design the ten questions as branching nodes that can be answered by both readers (to find their view) and about cases (to classify the case). Each question is a concrete scenario or claim with two or three answer options.

  Let's outline the ten questions:

  1. **Question from Galileo's two-stone argument**: 
     - Scenario: Imagine two stones, one heavier and one lighter, tied together and dropped. According to Aristotle, the heavier stone falls faster, but the tied pair should fall at an intermediate speed. However, the tied pair is heavier than the heavy stone alone, so it should fall faster. This leads to a contradiction. 
     - Question: Does this thought experiment primarily reveal a contradiction in the existing theory, or does it provide positive knowledge about how the stones actually fall?
     - Answer options:
       - A: It reveals a contradiction without telling us how the stones fall.
       - B: It shows that all stones fall at the same speed.

  2. **Question from Newton's rotating bucket**:
     - Scenario: A bucket of water is rotated. Initially, the water is flat, then it becomes concave as it rotates with the bucket, and then when the bucket stops, the water continues to rotate and remains concave. This is used to argue for absolute space.
     - Question: Does the thought experiment provide new knowledge about the nature of space and motion?
     - Answer options:
       - A: Yes, it shows that rotation must be absolute, not relative.
       - B: No, it only shows that we have an intuition about absolute rotation, but that intuition could be wrong or explained differently.

  3. **Question from "The unreachable regime"**:
     - Scenario: A physicist reasons confidently about a system that cannot be experimentally produced or simulated due to scale or complexity.
     - Question: What is the basis of the physicist's confidence?
     - Answer options:
       - A: The confidence comes from a rational insight into the laws of nature.
       - B: The confidence comes from an internal simulation based on prior empirical knowledge.
       - C: The confidence is unwarranted because there is no way to check.

  4. **Question from "The framing flip"**:
     - Scenario: The same physical system is described in two ways (e.g., a valve opening by molecular motion vs. a tiny agent making a choice), and the verdict flips.
     - Question: What does the flip reveal?
     - Answer options:
       - A: It reveals that our judgements are sensitive to irrelevant features, so they are unreliable.
       - B: It reveals a flaw in our conceptual understanding that needs revision.
       - C: It shows that the thought experiment is not well-posed.

  5. **Question from "The consensus reversal"**:
     - Scenario: A century ago, competent physicists reached the opposite verdict on a scenario due to a false background assumption (like absolute simultaneity).
     - Question: Does this historical fact undermine the reliability of our current verdict?
     - Answer options:
       - A: Yes, because it shows that even competent thinkers can be systematically wrong due to background assumptions.
       - B: No, because we have corrected the background assumption, so our verdict is now reliable.
       - C: It does not undermine the reliability of thought experiments in general, but it shows that they depend on the background theory.

  6. **Question from "The surrogate simulation"**:
     - Scenario: For a scenario T, a validated simulation gives one result, but human intuition gives another, and no experiment can settle it.
     - Question: Which source should we trust?
     - Answer options:
       - A: The simulation, because it is based on a model that has been validated in similar cases.
       - B: Human intuition, because it taps into a deeper understanding of the laws.
       - C: Neither; we should suspend judgement.

  7. **A question about the role of narrative**: 
     - Scenario: Two presentations of the same physical argument: one as a dry logical deduction, the other as a vivid narrative thought experiment. The narrative version is more persuasive.
     - Question: Is the narrative version more epistemically valuable?
     - Answer options:
       - A: Yes, because it engages our cognitive faculties more effectively, leading to better insight.
       - B: No, because the logical content is the same; the narrative is just rhetorical.
       - C: The narrative might be misleading because it can introduce irrelevant details.

  8. **A question about the necessity of empirical input**:
     - Claim: A thought experiment that leads to a new scientific theory (like Einstein's chasing a light beam) can be performed without any new empirical data.
     - Question: Does such a thought experiment provide new knowledge without new empirical input?
     - Answer options:
       - A: Yes, it can yield new knowledge a priori.
       - B: No, it relies on empirical knowledge already possessed.
       - C: It can lead to new knowledge only by revealing the implications of what we already know.

  9. **A question about the stability of intuitions**:
     - Scenario: A thought experiment is presented to two groups of experts: one group in a physics context, the other in a philosophy context. They give different verdicts.
     - Question: What does this imply?
     - Answer options:
       - A: It shows that intuitions are sensitive to context and thus unreliable.
       - B: It shows that the thought experiment is ambiguous and needs refinement.
       - C: It shows that different backgrounds lead to different interpretations, but one might be correct.

  10. **A question about the scope of thought experiments**:
      - Claim: A thought experiment in quantum mechanics that involves a cat being both dead and alive at the same time.
      - Question: Does this thought experiment reveal a genuine feature of reality or a flaw in our understanding?
      - Answer options:
          - A: It reveals a genuine feature of reality (quantum superposition).
          - B: It reveals a flaw in our conceptual scheme (we cannot properly conceive of superposition).
          - C: It is merely a rhetorical device to highlight the oddity of the theory.

