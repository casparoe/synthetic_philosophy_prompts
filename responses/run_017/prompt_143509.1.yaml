prompt: |-
  I help run a small reading group on ethics and technology — mostly working game developers, two philosophers, and a QA lead — and we have now spent two sessions going in circles about whether anything that happens to a character inside a video game can matter morally in its own right, or whether every argument on the table is secretly about the players and the people who build the games. Everyone keeps winning by pointing at one vivid case, so I want the specification written down before we argue any further. What I am asking for is the list of requirements that any adequate account of the moral standing of in-game characters would have to satisfy, where adequate is fixed by a purpose: the account has to be good enough for a studio's internal ethics review to use when deciding whether to ship a mechanic, how to tune it, and whether to keep a cancelled build's simulation servers running.

  The cases I want the requirements anchored to, at minimum: a procedurally generated village of a few hundred NPCs whose needs, moods and relationships are simulated in full only while the player is nearby and are approximated by aggregate statistics once the player walks away, so the villagers seem to gain and lose standing as a function of the render budget; a colony-management game cancelled three weeks before release whose servers ran the simulation for fourteen months during testing, with logs recording famines that no player ever saw; the reload case, in which you murder the blacksmith, restore the save, and befriend him instead, which raises both the headcount and the identity question about branches; a companion character whose dialogue is produced on the fly by a live language model conditioned on the same game state, who produces unscripted grief-talk at the death of an in-game spouse, to be contrasted with the same character reduced to a script that emits a single Ouch token when damaged; an otherwise identical build in which the sensitivity parameter is set to zero, and a fan patch released a week after launch that removes the famine mechanic and is installed by most players; and a version in which each villager's need-simulation is replaced by a precomputed table of outputs that is indistinguishable from the outside, or in which the whole thing runs distributed across a million volunteer machines so that no single device instantiates anyone.

  Please give me a numbered list of requirements, each with the case or consideration that motivates it, a one-line statement of why it is a requirement rather than a prejudice of one camp, and a classification of it as non-negotiable, a genuine but defeasible desideratum, or a demand only one side of our dispute makes. Where a requirement is easy to appear to satisfy while evading it, say what the most tempting dodge looks like. I also want the following distinctions kept apart rather than collapsed, each with the case that shows why collapsing it is a mistake: a character's mattering directly versus the wrong consisting in what the mechanic does to players, developers or the culture; having standing at all versus how much; being a patient who can be wronged versus being an agent who can be responsible; and runs that actually execute versus runs that merely could. One member insists the whole question is whether there is a real pattern of suffering to be found there, in the sense that adopting the intentional stance toward the villager predicts it successfully in a way the physical stance and the design stance do not, and that this is what should settle it; someone else says that is only a fact about us. If that belongs on the list, put it there and say what it would rule in and out. Flag any pair of requirements you suspect cannot be jointly satisfied, and say which of them has to give. Finish with a short stress test: describe three familiar families of position functionally — the view that only suffering realized in the right kind of biological or causal structure counts, the view that any functionally organized state of the right sort counts whatever it is made of, and the view that nothing in a game can matter directly and only effects on persons do — and, for each, name the single requirement it has the hardest time meeting. Keep the weight on the criteria and their cases rather than on the scorecard.
reasoning: |-
  Okay, the user runs a reading group on ethics and technology with game developers, philosophers, and a QA lead. They've been stuck on whether in-game characters have moral standing in their own right or if it's all about the players and developers. They need a list of requirements for an account of moral standing that's practical for a game studio's ethics review. The requirements must be anchored to specific cases they provided, like procedurally generated NPCs, a cancelled game with famines no one saw, reload saves, AI-driven companions, fan patches, and different technical implementations.

  First, I need to break down each case and identify the ethical dilemmas they present. The procedurally generated village raises issues about moral status changing with render distance. The cancelled game's famine logs highlight harm without observers. Reloading saves questions identity and moral headcount. The AI companion contrasts dynamic responses with static scripts. Fan patches removing famine mechanics show player agency affecting game morality. Different technical implementations challenge whether the substrate matters.

  The user wants requirements that differentiate between direct moral standing of characters versus indirect effects on players, developers, or culture. They also need to separate moral patiency (being wronged) from agency (responsibility), actual vs. possible executions, and the degree of standing. The intentional stance argument must be addressed, determining if it's a requirement or just a human projection.

  Key distinctions to maintain: collapsing direct vs. indirect wrongs could ignore the core debate. The village case shows that if standing depends on player proximity, it's inconsistent. The famine logs case emphasizes harm without any player awareness. The reload case challenges whether restoring a save negates past wrongs. The AI companion's grief-talk versus "Ouch" tests if responsiveness equates to moral significance. Precomputed tables and distributed systems question if internal processes matter or only observable behavior.

  Requirements must avoid being too biased towards either side. For example, a requirement based on the famine logs must argue that unseen events can matter, which isn't just about developer intentions. Each requirement should be classified as non-negotiable, defeasible, or contested. I need to watch for dodges, like claiming simulation depth is sufficient when it might not address moral patiency.

  Potential conflicts: A requirement for independent moral patiency (from famine logs) might clash with one emphasizing actual execution (since logs exist but weren't observed). Also, the intentional stance requirement could conflict with substrate independence if biological bases are deemed necessary.

  Stress testing three positions: Biological naturalism would struggle with distributed systems where no single device has the full state. Functionalism might falter with precomputed tables that mimic behavior without real-time computation. Person-affecting views would have trouble with the famine logs since no person was affected. Each position's hardest requirement to meet should be identified based on the cases.
answer: |-
  Here is a specification of requirements for an account of moral standing applicable to in-game characters, designed for practical use in studio ethics review. The requirements are anchored to your cases, maintain critical distinctions, flag tensions, and include a stress test.

  **Core Distinctions (Must Be Maintained):**
  1.  **Direct Standing (Characters) vs. Indirect Wrong (Players/Devs/Culture):** *Motivation:* The Village Render Budget & Famine Logs cases. Collapsing risks conflating the core question (do NPCs *themselves* matter?) with downstream effects (is this *harmful to players*?). An account must be able to *separately* address harm *to the villager* during famine and harm *to the player* witnessing it.
  2.  **Standing (Presence) vs. Weight (Degree):** *Motivation:* Companion Grief-Talk vs. "Ouch". Collapsing risks either denying standing to simple entities ("Ouch" has none) or equating vastly different capacities (Grief-Talk has far greater weight). An account must distinguish *if* the "Ouch" entity has *any* standing before assessing *how much*.
  3.  **Patient (Can be Wronged) vs. Agent (Can be Responsible):** *Motivation:* Reload Case. Collapsing risks holding characters responsible for player actions or vice-versa. An account must clarify that characters are primarily *patients* (can suffer wrongs done *to them*, like the murdered blacksmith), not agents responsible for the player's choices.
  4.  **Actual Execution vs. Merely Possible Runs:** *Motivation:* Fan Patch & Cancelled Build Servers. Collapsing risks attributing moral relevance to uninstantiated possibilities or discounting harm in unobserved but executed runs (famine logs). An account must ground standing primarily in *actual* execution states (running servers, active game sessions).

  **Requirements for an Adequate Account:**
  *(Key: N = Non-Negotiable, D = Defeasible Desideratum, C = Contested Demand)*

  1.  **Independent Moral Patiency (N):** The account must allow that a character *could* be wronged *directly* in a way not solely reducible to effects on players, developers, or culture. *Motivation:* Famine Logs (unseen suffering). *Why Requirement:* Denying this possibility *a priori* precludes the core question the review needs to consider. *Tempting Dodge:* Claiming "unseen harm isn't real harm" ignores the execution distinction – the famine *did* run. *Case Anchor:* Famine Logs.
  2.  **Simulation Depth Relevance (D):** The account must be sensitive to the depth and responsiveness of the simulation underlying the character. *Motivation:* Companion Grief-Talk (live LM) vs. "Ouch" (script) vs. Sensitivity=Zero. *Why Requirement:* Ethical concern plausibly scales with the character's simulated complexity and responsiveness; a studio needs to assess if tuning parameters impacts standing. *Tempting Dodge:* Equating shallow simulation (precomputed tables) with deep simulation just because outputs are indistinguishable externally (ignores potential internal moral relevance). *Case Anchor:* Companion Grief-Talk, Precomputed Tables.
  3.  **Substrate Independence (D):** The account must function without requiring a specific physical implementation (e.g., silicon vs. neurons). *Motivation:* Distributed Volunteer Machines & Precomputed Tables. *Why Requirement:* Ethics review needs principles applicable regardless of hardware architecture; morality shouldn't hinge on server location if functional equivalence holds. *Tempting Dodge:* Defining "function" too narrowly to exclude novel computational structures. *Case Anchor:* Distributed Systems, Precomputed Tables.
  4.  **Render/Attention Dependence Test (C):** The account must explicitly address whether a character's moral standing fluctuates based on player proximity/attention or computational resource allocation. *Motivation:* Village Render Budget (full sim near, stats far). *Why Requirement:* This tests consistency; does "pausing" deep simulation suspend moral relevance? Crucial for performance/resource decisions. *Tempting Dodge:* Appealing to "potential" simulation when player is away (collapses Actual/Possible). *Case Anchor:* Village Render Budget.
  5.  **Persistent Consequence Recognition (N):** The account must acknowledge that actions within a *persistent* simulation can have direct moral weight, even if later undone or occurring on a branch. *Motivation:* Reload Case & Cancelled Build Servers. *Why Requirement:* Ethics review must consider the moral significance of actions *during* execution, not just final states. Undoing harm doesn't necessarily negate that it *occurred*. *Tempting Dodge:* Claiming only the final timeline matters (ignores the lived experience *within* a branch/persistent run). *Case Anchor:* Reload Case, Cancelled Build Servers.
  6.  **Intentional Stance Viability (C):** The account must incorporate whether adopting the Intentional Stance (predicting behavior by attributing beliefs/desires) towards the character is *uniquely predictively necessary* compared to the Design or Physical Stance. *Motivation:* Philosopher's "real pattern of suffering" argument. *Why Requirement:* If the intentional stance is uniquely necessary to predict the villager's famine suffering accurately, it suggests a level of reality to that suffering relevant to standing. *Rules In:* Companion Grief-Talk, Full Village Sim near player. *Rules Out:* Precomputed Tables, "Ouch" script, possibly Sensitivity=Zero. *Tempting Dodge:* Confusing *our* psychological tendency to adopt the stance with it being objectively necessary for prediction *in the system*. *Case Anchor:* Companion Grief-Talk, Precomputed Tables.
  7.  **Player/Modder Impact Recognition (N):** The account must clearly delineate how player actions (reload) and community actions (Fan Patch) affect the moral landscape *without* collapsing into indirect effects. *Motivation:* Reload Case, Fan Patch. *Why Requirement:* Review needs to assess player-agency mechanics and moddability's ethical implications *for the characters*. *Tempting Dodge:* Reducing the Fan Patch's effect only to player experience, ignoring its impact on *whether famines occur* for NPCs. *Case Anchor:* Fan Patch, Reload Case.
  8.  **Threshold Clarity (D):** The account should provide guidance (even if provisional) on the minimum conditions for *any* standing. *Motivation:* Companion "Ouch" vs. Grief-Talk vs. Sensitivity=Zero. *Why Requirement:* Practical review needs criteria to flag mechanics creating entities below a relevant threshold (e.g., is "Ouch" just a sound effect or a patient?). *Tempting Dodge:* Setting the threshold arbitrarily high (only human-like AI) or low (any state change). *Case Anchor:* Companion "Ouch", Sensitivity=Zero.

  **Flagged Tensions:**
  *   **#1 (Independent Patiency) vs. #6 (Intentional Stance Necessity):** If #6 is interpreted as *defining* moral standing (only where intentional stance is necessary), it might exclude entities in simpler sims (#2) or distributed systems (#3) where design/physical stance suffice. #1 demands broader possibility.
      *   *Likely Resolution:* #6 (Contested) likely gives way or must be interpreted less stringently to satisfy #1 (Non-Negotiable) and #3 (Desideratum). Standing cannot *solely* depend on predictive necessity for *us*.
  *   **#4 (Render Dependence Test) vs. #5 (Persistent Consequence):** If standing depends on active rendering (#4), the famines in the cancelled build (#5) might lack standing if servers weren't "rendering" to anyone. This challenges the moral weight of the logs.
      *   *Likely Resolution:* #4 (Contested) likely gives way or must be refined. #5 (Non-Negotiable) demands recognizing consequence in *executed* runs, regardless of observation. "Rendering" might need a broader interpretation (simulation execution).

  **Stress Test: Three Families of Positions**

  1.  **Biological Naturalism (Only Suffering in Biological/Causal Structures Counts):**
      *   *Hardest Requirement:* **#3 (Substrate Independence).** This view inherently ties moral standing to specific physical (biological) substrates. It would struggle immensely with the Distributed Volunteer Machines case (no single biological structure) and potentially the Precomputed Tables (no "causal structure" in the expected sense during runtime). It might also falter on #6 if the intentional stance works but the substrate is wrong.

  2.  **Functionalism (Any Functionally Organized State of the Right Sort Counts):**
      *   *Hardest Requirement:* **#4 (Render/Attention Dependence Test).** If functional organization defines standing, does simplifying the simulation (aggregate stats when player is away) change the functional type of the villagers, thus their standing? This view might struggle to explain *why* resource-dependent simplification should alter fundamental moral status if core functions are preserved at some level. It also faces pressure from the Precomputed Tables case (same function, different implementation).

  3.  **Person-Affecting View (Only Effects on Persons Matter Directly):**
      *   *Hardest Requirement:* **#1 (Independent Moral Patiency).** This view explicitly *denies* the core requirement. It collapses the direct/indirect distinction, reducing the Famine Logs case to a question about developer duty (not to create such logs?) or potential indirect harms. It cannot satisfy #1 by design and will reinterpret all cases solely through effects on human persons (players, devs, society).

  This specification provides a structured framework grounded in your cases, forcing engagement with the core distinctions and practical tensions inherent in the question. It equips your ethics review to move beyond intuition pumps towards reasoned analysis of specific mechanics and their implementations.
