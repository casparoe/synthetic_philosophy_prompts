answer: |-
  The wind off the bay in Saltmarch always carried a bite, even in late spring. It tugged at Mara’s coat as she picked her way across the exposed mudflats, the sucking sound of her wellies a familiar rhythm. Out here, the air smelled of brine and decay, of life stubbornly clinging on. Further out, where the tide still lingered, the eelgrass should be waving – thick, green ribbons that were the bay’s lungs, its nursery, its anchor against the hungry sea.

  But ‘should’ was doing a lot of work these days.

  Saltmarch needed that eelgrass. Not just ecologically, but economically. The Coastal Health Incentive, a lifeline thrown by the distant Regional Environmental Agency (REA), depended on it. Every year, volunteers like Mara uploaded photos to the ‘BayWatch’ app. An algorithm, somewhere in a server farm miles inland, scanned them, counted the eelgrass coverage within a specific area, and spat out a single, holy number. A higher number meant a fatter cheque for Saltmarsh’s dwindling coffers. Tourism had bled away since the ferry company jacked up prices; the CHI payment kept the community hall heated and the playground from rusting entirely.

  Mara paused, wrestled the bright orange plastic frame from her backpack. It was a meter square, rigid, garishly visible against the muted mud and grey-green seagrass. The app’s instructions were clear: *Place frame on representative section of eelgrass bed. Ensure full frame visible. Capture photo.* ‘Representative’. That word had started to itch.

  She remembered the first year. Earnest chaos. Volunteers wading out, frames dropped haphazardly, photos snapped of lush patches, sparse patches, bare mud where grass had clearly died back. The initial number was… middling. Disappointing. Then Len, who ran the struggling boatyard, pointed out the obvious over pints at The Salty Dog: “Why’re we shootin’ the bald spots? The app don’t *ask* for the bald spots. Just wants a photo of grass inside the orange thing, right?”

  It wasn’t malice. It was necessity. Year two: volunteers, subtly guided by the Saltmarsh Conservation Committee (chaired by Len), became more selective. They walked further to find the thickest stands. They avoided the wind-scoured edges. They… sometimes reshot a patch if the first photo looked thin. The number crept up. The cheque was noticeably larger.

  Mara placed her frame now, deliberately, not on the thickest bed nearby, but on a patch she’d photographed three years ago. It looked sparser. The blades were shorter, yellower. She snapped the photo, the app’s cheerful ping echoing oddly in the vast quiet. As she moved the frame to the next spot, her boot sank deeper than usual. Pulling it free, she saw it wasn’t just mud. Tangled in the ooze were roots – eelgrass roots – but severed, pale and limp. A transplant. She looked around. Nearby, a patch of vibrant green looked unnaturally dense, crowded. It sat in sandier, less stable mud, an area usually sparse. Someone – probably old Bill from the nursery, trying to be helpful, bless him – had dug up clumps from healthier, established beds and jammed them here, inside the likely paths volunteers walked with their frames. More green in the frame, faster. Never mind that eelgrass needed specific sediment, that cramming it together invited disease, that ripping it up damaged the source. The number *had* to go up.

  This was Year Four. Mara hadn’t volunteered last year; her B&B, ‘The Lookout’, had consumed her. But the rumours had reached her: the REA was thrilled. Saltmarsh’s composite score was a model of "consistent positive trajectory". The official map on the agency's website, generated from all those geotagged photos, showed the eelgrass beds blooming, spreading steadily. Mara looked out at the actual bay. The thick beds seemed smaller, tighter. The edges were fraying. More bare patches shimmered with stagnant water under the weak sun. Yet the map, fed by thousands of orange-framed snapshots taken only in the densest, most accessible, or now, most artificially enhanced areas, painted a lie of vibrant expansion.

  She stopped at her final spot, a section near a freshwater rivulet that had always held lush grass. Today, it looked sickly. The blades were thin, covered in a slimy film. She placed the frame. Hesitated. The old instinct – find a better patch, nudge the number – warred with a rising dread. She took the picture. The app pinged. *Upload Complete! Thank you for protecting Saltmarsh Bay!*

  Walking back, the wind felt colder. In the community hall later, the mood was tense anticipation. The REA representative, a young woman named Chloe with earnest eyes and a tablet, beamed as she revealed the year’s number. Another increase. A record high. Len clapped Bill on the shoulder. “Told you that top-dressing with compost near Bill’s transplants would show up!” Bill grinned, sheepish. Chloe praised their “proactive community stewardship,” referencing the spreading green on her map. Mara looked at the map on the tablet. The vibrant blob covered areas she *knew* were sandbars or deep channels. It was a map of where people had walked with orange frames, diligently following the guidance, chasing the number. Not a map of the bay.

  “It looks… denser than I remember some spots being,” Mara ventured carefully.

  Chloe nodded enthusiastically. “The algorithm is incredibly sophisticated! Trained on thousands of verified eelgrass images. It’s identifying positive biomass trends we might miss with the naked eye!”

  Mara bit her tongue. *Trained on images… but our images all have the orange frame.* The creeping thought solidified, cold and hard in her gut: What if the machine hadn’t learned to see eelgrass at all? What if it learned to see the orange frame, and simply counted the percentage of green pixels inside it? Year after year, volunteers optimized for the frame – finding greener patches, making patches greener, only photographing where the frame could be placed. The machine counted obediently. Green pixels inside orange borders went up. The number went up. The bay… changed. Became something that performed well inside the frame.

  That winter was harsh. Storms gnawed at the coast. Spring arrived late, grey and sodden. Mara was checking storm damage down by the old pier when she saw it. A vast expanse of mud, slick and barren, where a thick eelgrass bed had buffered the waves just last year. It looked… digested. Washed away. The transplants near Bill’s area were gone entirely, leaving only scars in the sand.

  The letter from the REA arrived a month later. Polite, regretful. Analysis of the latest BayWatch submissions, combined with new satellite imagery (introduced this year for 'validation'), indicated a "significant and unexpected regression in eelgrass biomass" in Saltmarsh Bay. The composite score had plummeted. Funding under the Coastal Health Incentive was suspended pending "further investigation and a revised conservation plan."

  Silence descended on The Salty Dog. Len looked ten years older. Bill stared into his pint, muttering about blight and salt levels. Chloe, on a brief follow-up call, sounded bewildered. "The correlation between the volunteer photos and the satellite data completely broke down," she said, confusion clear in her voice. "It's like... like the ground-truth shifted."

  Mara sat at her desk at The Lookout, rain lashing the windows overlooking the now-more-vulnerable bay. Before her lay a thick folder. Printouts. Every BayWatch photo she’d ever taken, hundreds of them. Year after year. She flipped through them.

  The first pages showed variety: healthy grass, patchy grass, mud. Then, the photos tightened. Lush green dominated, often crowding the edges of the frame. Later, the green sometimes looked too uniform, too crowded, in suspiciously sandy patches. Always, always, the garish orange plastic border, a constant rectangle imposed on the messy reality of the bay.

  She stopped at a photo from two years ago. Thick, vibrant grass filled the frame. But at the very bottom edge, just inside the orange plastic, a single strand of kelp had drifted in – a different species, a different brown. The algorithm wouldn’t have cared. It saw orange, it saw green pixels inside, it added to the count. Was this a picture of healthy eelgrass? Or was it a picture of a plastic square containing green pixels that *happened* to be eelgrass… that day, in that specific, curated spot?

  The rain drummed harder. The bay outside was a grey smear. Mara touched the photograph, her finger resting on the bright orange corner of the frame. The thing they’d measured was gone, collapsed. What remained was this folder. A record of what? Dedication? Delusion? The slow, well-meaning replacement of a living bay with a dataset that only recognised its own parameters?

  She closed the folder. It felt heavy, not with answers, but with the weight of the unanswerable. Outside, the wind moaned around the eaves, carrying the raw salt smell of a bay whose story, for four years, had been written not in mud and root and blade, but in plastic and pixels and a number that climbed obediently towards the void. The true trace of what was lost wasn't in these pictures. Or perhaps, in the most terrible way, it was *only* in these pictures now. She didn't open it again. The orange border seemed to glow faintly in the dim light, a silent, unanswered question etched in plastic.
