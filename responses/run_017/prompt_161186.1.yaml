      Bookie sells bet1 for $25,000 and buys bet2 for $24,999. Net cash to farmer: -25,000 + 24,999 = -$1.

      In ND: 
          Bet1: she receives $100,000.
          Bet2: she owes the bookie $100,000 (because she promised to pay in ND) -> net $0 from the bets.
          Total: -$1.

      In D: 
          Bet1: she pays $100,000.
          Bet2: the bookie owes her $100,000 -> net $0 from the bets.
          Total: -$1.

    So the loss is $1, which is small compared to the scale of the bets. But note: the farmer might be risk-averse to such large swings, but in this setup, the swings are hedged away. The only loss is the $1. We can make the loss larger by having the bookie charge more for the first bet and pay less for the second. For example, sell bet1 for $25,000 and buy bet2 for $24,000, then the loss is $1,000. But would the agent accept that? For the selling of bet2, she requires at least $25,000. If the bookie offers only $24,000, then the EU of selling bet2 for $24,000 is:

