    But the specification says: "the loss has to be one the agent would actually care about". If the agent is making bets of $100,000, then a loss of $1 might be negligible. However, we can scale the bets up to any size. Let the unit be $1,000,000. Then the loss is still $1, which is very small. Alternatively, we can do the same with many such independent events? But the specification says "a paragraph", so one concrete case.

