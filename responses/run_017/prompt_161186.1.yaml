    Loss = $1, but we scaled to $100,000 bets? Let me recalc with $100,000:

      For a bet that pays $100,000 in ND and -$100,000 in D:
          EU1 = 0.5 * 100,000 + 0.5 * (-100,000/2) = 50,000 - 25,000 = 25,000 -> she pays up to $25,000.

      For selling the second bet (which is like taking the opposite position of a bet that would be: in ND: -100,000, in D: +100,000):
