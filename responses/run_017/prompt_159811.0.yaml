prompt: |-
  I've recently become the person who signs off on what our team's internal assistant is allowed to do, and there's a pattern I keep noticing that I don't have a word for.

  Over about eighteen months, the instructions we give the system have changed shape, and I don't think anyone decided that they should. We began by writing out the procedure: run this command, put the output in that file, stop if the exit status is nonzero. Then we began writing the outcome instead: make the test suite green. Then: cut the staging bill. Then: find and fix whatever is making mobile signup drop. At each step the instruction got shorter, checking it got less mechanical, and our vocabulary shifted — we now talk about the system's budget, its permissions, whether it may open a pull request that nobody reads first. The same thing has happened in my own use: I no longer ask it to draft replies to three named emails, I ask it to keep my inbox from becoming a problem.

  Two features seem to be the heart of it. First, the drift isn't driven by the system getting more capable. It's driven by specification being expensive: no one will write out the procedure for reducing the staging bill, because writing it out is most of the work. We hand over the choice of means precisely because that's the part we can't be bothered to specify — and the moment we do, whatever it is we've got is not being used as a tool in the sense our own documentation still uses. Second, it doesn't run backwards. Once the harness, the dashboards, and the review process are built around outcome-shaped requests, reinstating procedural ones is itself a project with a cost, and so it never happens.

  It isn't the failure mode where a system finds a loophole in a badly written goal: that seems downstream of what I mean, and it requires the goal to be wrong, whereas here the goal is exactly what we want. It isn't quite the economists' principal-and-agent setup either, since that assumes the delegate has ends of its own that can come apart from the delegator's, and that isn't what makes this hard. A speaker at a conference called it autonomy creep, which I suspect is a slogan for the thing rather than a concept with edges.

  So: is there an established concept for drift from specifying means to specifying ends, driven by the cost of specification rather than by the delegate's capabilities, and for the fact that the drift ratchets? Where does it live, and if I've identified the mechanism wrongly, what is the nearest concept that does fit? If there is nothing established, I'd like a name and a definition tight enough to say what doesn't count — including whether the same pattern shows up between human managers and human reports, or whether the case where the delegate is a model is a genuinely different animal. A label won't settle what I need settled: our legal team wants one sentence in a customer-facing document saying whether this is a tool or an agent, and I want to be able to explain why no one sentence can be honest.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing a shift in how their team interacts with an internal AI assistant. Originally, they gave detailed procedural instructions, but over 18 months, the instructions have become more outcome-focused. They mention that this drift isn't due to the AI becoming more capable but because specifying procedures is costly. The user highlights two main features: specification cost driving the shift and the one-way nature of this change. They need a term for this phenomenon and to understand its implications, especially for legal categorization as a tool or agent.

  First, I recall related concepts. Instrumental convergence comes to mind, but that's more about AI goals leading to unintended behaviors. Here, the goal isn't the issue; it's the delegation method. Then there's principal-agent problems, but the user says that's not fitting because the AI doesn't have its own divergent goals. Autonomy creep is mentioned, but the user thinks it's more a slogan than a defined concept.

  Next, I think about delegation and automation. Specification gaming is a thing, but that's about exploiting loopholes, which isn't the core issue. The key here is the increasing delegation of means due to the cost of specifying them. The ratcheting effect is important too—once you move to outcome-based delegation, reverting is costly.

  I remember the concept of "proceduralization" versus "outcome-based delegation." But is there a specific term? The user wants a tight definition. Maybe "Delegation Drift" or "Means-Ends Delegation Shift." But those might not be established terms. 

  Then it hits me: economic theories of transaction costs and delegation. Ronald Coase's work on firms comes to mind—why tasks are done in-house vs. outsourced. The cost of specifying procedures makes delegating outcomes more efficient. The ratcheting effect aligns with path dependency in economics—decisions become locked in due to setup costs.

  The term "Delegation of Discretion" fits here. Discretion refers to the freedom to choose methods. As specification costs rise, delegation of discretion increases. The ratcheting is due to infrastructural lock-in: dashboards and processes built around outcomes make reverting expensive.

  Now, does this apply to human contexts? Yes, like managers delegating tasks without specifying steps. But with AI, it's distinct because AI lacks intent, making the shift less risky but also harder to reverse once systems are built around it.

  For the legal team, the tool vs. agent debate hinges on discretion. A tool follows procedures; an agent exercises judgment. The user's assistant is now an agent due to delegated discretion. But explaining that no single sentence suffices is crucial because the system's role evolved due to cost efficiency, not capability.

  I should also consider the user's deeper needs. They need to communicate complexity to legal and justify why a binary label is inadequate. They might also be concerned about accountability when outcomes go wrong. The unspoken need is to manage expectations and ensure that policies reflect the dynamic nature of the tool's use.
answer: |-
  The phenomenon you're describing is both astutely observed and conceptually rich. While there isn't a single universally established term that captures *every* facet, the core mechanism aligns tightly with established concepts in economics, organizational theory, and AI alignment. Here's the breakdown:

  1.  **The Core Mechanism: Transaction Cost-Driven Delegation**
      *   **Concept:** **Delegation of Discretion** driven by **Transaction Costs** (specifically, **Specification Costs**).
      *   **Explanation:** You're delegating tasks to the assistant. Specifying the *exact means* (procedures) is costly in terms of time, effort, and cognitive load (high transaction costs). Specifying the *desired end-state* (outcome) is often significantly cheaper. When the cost of specifying means is high relative to the perceived risk or the cost of monitoring the outcome, it becomes economically rational to delegate the choice of means – i.e., grant **discretion**.
      *   **Source:** This is rooted in **Transaction Cost Economics** (Ronald Coase, Oliver Williamson). Firms exist because coordinating complex production within a hierarchy (delegation with discretion) can be cheaper than constantly writing and enforcing perfect contracts (specifying means) for every tiny task on the open market.
      *   **Why it Drifts:** As the assistant proves minimally competent at achieving *some* outcomes with discretion, the cost of writing detailed procedures for increasingly complex tasks becomes prohibitive *and* demonstrably unnecessary for basic success. Delegating discretion becomes the path of least resistance and highest efficiency.

  2.  **The Ratcheting Effect: Path Dependency & Institutionalization**
      *   **Concept:** **Path Dependency** combined with **Institutionalization of Delegation Norms**.
      *   **Explanation:** Once you delegate discretion and build supporting infrastructure (dashboards, review processes calibrated for outcomes, shared vocabulary like "budget", "permissions"), reversing course becomes expensive. You've created a system optimized for outcome-based delegation. Reverting to procedural specifications would require:
          *   Re-writing all instructions.
          *   Re-training users.
          *   Potentially re-designing monitoring tools.
          *   Changing ingrained team culture/norms.
      *   **Why it Doesn't Reverse:** The costs (transaction costs again!) of reversing the delegation model outweigh the perceived benefits or safety gains. The new mode becomes "locked in" – it's the path-dependent outcome.

  3.  **Distinguishing Features & Why Other Terms Don't Quite Fit:**
      *   **Not Instrumental Convergence/Goodhart's Law/Loopholes:** You're right. This isn't about the assistant gaming a *badly specified end goal* ("make the test suite green" by deleting tests). It's about *choosing* to delegate the *means* because specifying them is too expensive. The goal itself is sound; the delegation of how to achieve it is the shift.
      *   **Not Classic Principal-Agent Problem:** Correct again. This isn't primarily about *misaligned incentives* (e.g., the assistant wanting to save compute costs vs. the team wanting robustness). While misalignment *could* become an issue later, the *initial driver* is the cost of specification, not divergent goals. The assistant is a tool granted discretion, not an entity with inherent goals.
      *   **Beyond "Autonomy Creep":** This is descriptive but vague. It doesn't capture the *economic driver* (specification cost) or the *ratcheting mechanism* (path dependency). It focuses on the symptom (increased autonomy) rather than the cause and lock-in.

  4.  **The Tight Definition & Name:**
      *   **Name:** **Specification Cost-Induced Discretionary Drift (SCIDD)** or **Transaction Cost-Driven Delegation Ratchet**.
      *   **Definition:** A phenomenon where the delegation of tasks shifts irreversibly from specifying detailed procedures (means) to specifying desired outcomes (ends), driven primarily by the high transaction costs (time, effort) associated with specifying means for complex tasks, rather than by a significant increase in the delegate's inherent capabilities. This drift is reinforced by path dependency, as supporting infrastructure, processes, and norms become optimized for outcome-based delegation, making reversion to procedural specification prohibitively costly.
      *   **What Doesn't Count:**
          *   Drift driven *only* by increased delegate capability (e.g., upgrading to GPT-4 and naturally phrasing things more loosely).
          *   Temporary delegation of discretion for a specific, complex task.
          *   Delegation driven primarily by the delegate's superior expertise or information (a classic reason for human managerial delegation).
          *   Shifts due to changes in the *end goal* itself, rather than the level of specification for achieving a stable goal.

  5.  **Human vs. AI Context:**
      *   **Human Managers/Reports:** **Yes, the pattern exists strongly here.** Managers delegate outcomes ("Increase sales in region X", "Fix the morale problem") precisely because specifying every step for a knowledgeable employee is inefficient, demotivating, and often impossible. The ratchet exists too: once a report handles outcome-based goals, reverting to micromanagement is costly and damaging. The key difference is that humans inherently have their own goals/agency, introducing classic principal-agent *incentive* issues alongside the specification cost issue.
      *   **AI Delegate:** **It's a distinct variant.** The core driver (specification cost) and ratchet (infrastructural lock-in) are identical. However:
          *   Lack of inherent goals simplifies the incentive problem (initially).
          *   Lack of true understanding increases the risk of specification gaming *later* when discretion is high.
          *   The *perception* of agency can be higher because the output is goal-directed language/action.
          *   The legal/liability implications are novel and less defined than for human agents.

  6.  **Answering Your Legal Team & the Core Dilemma:**
      *   **Why "Tool vs. Agent" is a False Binary:** Your system has undergone SCIDD. It began as a pure tool (executing specified procedures). It is now an **Agent** in the functional sense: you delegate outcomes (ends) and grant it significant discretion over the means to achieve them within defined boundaries (budget, permissions). It makes choices you don't specify.
      *   **Why One Sentence Can't Be Honest:** The system exists in a hybrid state defined by *degree of discretion granted*, not a binary category. Calling it *only* a "tool" is dishonest because it exercises un-specified judgment. Calling it a full "agent" might imply capabilities or liabilities it doesn't possess. **The truthful answer is context-dependent and exists on a spectrum.**
      *   **What to Tell Legal (and Frame Internally):** "Our internal system functions as a **delegated outcome executor with bounded discretion.** We specify the desired end-state and constraints (budget, permissions, safety rails), and it determines the appropriate sequence of actions within those bounds. It is not a general-purpose agent with its own goals, nor is it a simple tool requiring step-by-step procedural instructions. The level of discretion granted varies by task and evolves based on our operational needs and the cost of providing more detailed specifications."

  **In essence:** You've discovered a fundamental organizational dynamic amplified by AI. The driver is economic (transaction costs), the mechanism is delegation of discretion, and the irreversibility comes from path dependency. This isn't just "autonomy creep"; it's the **rational, cost-driven delegation of problem-solving authority**, which inherently blurs the line between tool and agent. The key insight for your legal team is that the nature of the delegation defines the category, and that delegation exists on a continuum driven by specification costs. A binary label obscures this critical reality.
