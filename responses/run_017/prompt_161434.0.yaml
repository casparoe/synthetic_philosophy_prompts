  We are given a request to translate the presentism/eternalism debate (including growing-block and objections) into the vocabulary of distributed databases with temporal aspects and MVCC. The user is fluent in this vocabulary and does not need explanations of the database terms.

  Key concepts in the database model:
  - Tables record when a fact held in the world (valid time) and when it was recorded (transaction time).
  - MVCC: Each transaction reads a snapshot of committed data as of the transaction's start time.
  - Append-only event logs.
  - Clusters with no global clock; orderings reconstructed from vector clocks.

  Metaphysical debate:
  - Presentism: Only the present exists.
  - Eternalism: Past, present, and future exist (like blocks in a spacetime).
  - Growing-block: The past and present exist, but the future does not (the block grows as time passes).

  Objections:
  - Truthmaker objection to presentism: What makes past-tensed statements true if the past does not exist?
  - Relativity of simultaneity: There is no absolute present; simultaneity is relative to the observer.

  We are to restate the debate in the database vocabulary and then provide a residue report.

  Translation:

  1. What existence is:
     In the database model, existence can be thought of as being recorded in the database (i.e., in the event log) and being part of a committed transaction. However, note that the database may have uncommitted writes (which are not yet "real") and also may have records that are no longer valid (if we have deletions or updates, but in append-only we keep history). But existence in the world (valid time) and existence in the database (transaction time) are two different things.

     We can define:
     - A fact "exists" at a time if it is recorded in the log and committed, and its valid time includes that time.

     But note: the database records facts about the world at different times. So existence in the metaphysical sense might be mapped to the state of the world at a given time, which is represented by the set of facts that are valid at that time and have been recorded (committed) by that time.

  2. What a truth about the past or future is:
     - Past: A statement that is true at a past time (according to the valid time) and that has been recorded (committed) by the present time.
     - Future: A statement that will be true at a future time (valid time) but may not yet be recorded (or even known) in the database.

     However, note that in our database, we might not have recorded the future. So a future truth might be one that will be recorded in the future and will have a valid time in the future.

  3. What the present is:
     - In the database, the present could be thought of as the latest committed transaction that has been globally acknowledged (if we have a global clock) or the current vector clock state of the system. But without a global clock, the present is relative to the node.

     However, the database model uses snapshots: each transaction has its own "present" (the start time of the transaction). So the present is the snapshot time.

  4. Views:

     - Presentism:
       Claims: Only the present exists. In database terms, this might be: only the facts that are valid at the current time (and have been committed by the current time) are real. But note: the current time is relative to the transaction.

       However, if we take the system to have a current global time (which we don't, because no global clock), then we have a problem. Alternatively, we can take the present relative to a transaction: for a given transaction T, only the facts that are valid at T's start time and committed by T's start time exist.

       But then existence is relative to the transaction? That might be a problem for presentism which typically wants an absolute present.

     - Eternalism:
       Claims: Past, present, and future all exist. In database terms: the entire event log (all committed transactions) exists, and the facts they record (with their valid times) are all equally real. The database state at any time (past, present, or future) is just a snapshot at that time.

     - Growing-block:
       Claims: The past and present exist, but the future does not. In database terms: the event log grows as new transactions are committed. The set of committed transactions (and thus the recorded facts) increases over time. The valid times of these facts are in the past or present, but not the future (because we cannot record facts about the future?).

       However, note: we can record a fact with a valid time in the future? (e.g., a scheduled event). So the growing-block might have to say that facts with future valid times are not yet part of reality, even if they are recorded.

       But the database does allow recording future-dated facts. So the growing-block might require that only facts with valid times up to the current time are real, even if we have recorded facts with future valid times.

  5. Objections:

     - Truthmaker objection to presentism: What makes a past-tensed statement true? For example, "There was a transaction that recorded fact F at time T." If the presentist says only the present exists, then there is nothing in the present that makes that true.

       In database terms: if we only have the current snapshot (present), then how do we account for the truth of a statement about a past snapshot? The presentist database might respond: we have the event log (append-only) that records the history. But the event log is a present fact? Yes, the log exists now. So the presentist can point to the current state of the log as making the past-tensed statement true.

       However, note: the log itself is changing (growing). So the log at time t1 is different from the log at time t2. But if presentism only has the present log, then the log at time t1 (which is past) does not exist. How can the current log (at t2) make true a statement about the state of the log at t1? The current log might contain a record of the past log? But then we have an infinite regress? 

       Alternatively, the database might have a log that is append-only and immutable. Once written, the log for t1 is preserved in the current log? Then the current log contains the entire history. So the presentist can say: the entire history is present (in the log). But then that sounds like eternalism!

       This is a tension.

     - Relativity of simultaneity: In a distributed system without a global clock, the order of events is partial. Two events might be simultaneous in one frame but not in another. 

       In the database, we use vector clocks to reconstruct a partial order. So the "present" for one node might include events that are not in the present for another node. 

       Presentism, which requires an absolute present, seems challenged because there is no absolute snapshot that is "now". Each transaction has its own snapshot.

       Eternalism and growing-block can accommodate this by saying that existence is relative to a frame? But they typically don't. Alternatively, they might say that the entire distributed system's state (with all the vector clock timestamps) is what exists, and then the present is just a local notion.

       But then presentism would have to be relativized: existence is relative to a node and a time (vector clock state). That might be a way to save presentism, but it is not the absolute presentism.

  Residue Report:

  We now evaluate how well the translation works and what residue remains.

  1. Claims that translate cleanly:

     - Eternalism: The entire event log (with all committed transactions) exists. This is a direct counterpart: the log is the block universe. Snapshots at any time are just queries on the log.

     - Growing-block: The event log grows as new transactions commit. The set of committed transactions is increasing. The valid times of the facts in the log are in the past or present (if we do not allow future valid times, or if we do, then we have to say that facts with future valid times are not yet real). But note: the log itself (the record) is present, but the valid time of a fact might be future. So the growing-block might require that we consider only the facts with valid time <= current time. This can be done by having a "current time" in the system? But without a global clock, current time is local.

     - Presentism (relativized): Each transaction has its own snapshot (which is the set of facts that are committed and valid as of the transaction's start time). This snapshot is the "present" for that transaction. This is a clean translation for a relativized presentism.

     - Truthmaker objection: The presentist can point to the current state of the log (which records the entire history) as the truthmaker for past-tensed statements. Since the log is append-only and immutable, the past is encoded in the present log. This is a clean translation: the log is the truthmaker.

       However, note: the log is a present fact, and it represents the past. So it avoids the objection.

     - Uncommitted writes: These are like future possibilities? They are not yet real (not committed). So they are not part of existence until committed. This aligns with presentism and growing-block: only committed (past and present) states are real.

  2. Claims that translate with distortion:

     - The relativity of simultaneity: In the database, we use vector clocks to define a partial order. The present for a transaction is defined by its snapshot, which is based on the commit order (which is a total order we impose via serialization). But in reality, the system might not have a total order naturally. We force a total order by picking a serialization order (via a consensus algorithm). This total order is our "privileged present" that we impose. 

       Distortion: In physics, there is no privileged frame. In the database, we create one artificially (the commit order). So the analogy distorts by introducing a global order that does not exist in the physical world.

     - Growing-block and future valid times: The database might record a fact with a valid time in the future. In the growing-block, such a fact would not be considered real until its valid time becomes current. But the database has recorded it. So we have to split: the fact is recorded (in the log) but not yet real? The database framework doesn't have a notion of "real" beyond valid time. So we are distorting the growing-block by having to add an extra layer.

  3. Claims with no counterpart:

     - Absolute present: The database framework does not have an absolute present because of distribution and lack of global clock. We simulate an absolute present by the commit order. But this is not given by the physics of the system; it's imposed by the algorithm. So the idea of an absolute present (as in classical presentism) has no counterpart. We can only have a relativized present (per transaction).

     - Future existence: In the database, we can record facts about the future (with future valid times). But in presentism and growing-block, the future does not exist. However, the database framework treats these as existing (as records) but with a valid time in the future. So we have a representation of the future, but it is not clear if that representation is part of the present (as a record) or not. The debate about the future's existence doesn't have a direct counterpart because the database can represent future facts.

     - The passage of time: The database framework has transactions that commit and extend the log. This is like the growing-block's growth. But the passage of time is not represented as a fundamental aspect. The log is static once written. The feeling of time passing is not in the model.

     - What existence is: The database distinguishes between valid time and transaction time. But in the metaphysical debate, existence is usually about what is real at a time. We can map existence to valid time (the time when the fact held in the world) but then we have to account for the fact that the database might record a fact after its valid time. And we have the transaction time (when it was recorded). This dual time is not present in the metaphysical debate, which typically has a single time.

  Residue analysis:

  a) Defect of the framework:
     - The framework presupposes an external clock? Not necessarily, because we use vector clocks. But we do impose a total commit order (via consensus) which acts as a global clock. This is a defect if we want to model relativity faithfully because we have introduced an absolute order.

     - The framework has a fixed set of tables: The schema is fixed? But in reality, new types of facts might come into existence. This is a limitation: the framework cannot easily represent the emergence of new kinds of entities.

  b) Less substantive debate:
     - The truthmaker objection might be less substantive because in the database we have the log that records history. The presentist can use the log as a truthmaker. This suggests that the objection might be addressed by having a suitable representation of the past in the present.

     - The relativity of simultaneity: The framework handles it by having a relativized present (per transaction). This might show that presentism can be saved by relativizing it to a frame. The debate then becomes about whether relativized presentism is acceptable.

  c) The privileged present:
     - The framework smuggles in a privileged present via the commit order. This is a defect if we are trying to model the physical world without a privileged frame. But in the database, we need it for consistency. So the analogy helps by showing that for the purposes of having a consistent view of the world, we need to impose an order. However, this does not reflect the physics of relativity.

  Conclusion:

  The database framework provides a useful analogy for the metaphysical debate, especially in showing how a relativized presentism can work and how the truthmaker objection might be answered. However, the framework introduces an artificial total order (commit order) that serves as a privileged present, which is not present in the physical world. This is both a strength (for consistency) and a weakness (as it distorts the relativity of simultaneity). The residue includes the lack of an absolute present (without the imposed order) and the dual times (valid and transaction) that complicate the notion of existence.

  The most pressing issue is the smuggling of a privileged present: the system picks a single serialization order, so the snapshots are mutually consistent. This is essential for the database but not present in the physical world. Therefore, the analogy might be helping by showing that for a coherent account of reality (like a consistent database), we need such an order. But it does not show that such an order exists in the physical world. Thus, the debate about the absolute present might be less about the structure of time and more about the need for a consistent narrative.
answer: |-
  ### Restatement of the Presentism/Eternalism Debate in Database Vocabulary

  #### Core Metaphysical Concepts Translated:
  1. **Existence**:  
     A fact exists iff it is **committed** in the event log. Committed records are durable, immutable, and globally visible. Uncommitted writes (pending transactions) are not yet "real"—they are tentative and may be rolled back.  
     - *Valid time* (when a fact held in the world) defines the temporal domain of existence.  
     - *Transaction time* (when the fact was recorded) defines when existence becomes observable to the system.  

  2. **Truth About the Past or Future**:  
     - **Past truth**: A fact with a *valid time* < current snapshot timestamp, committed in the log before that snapshot. Verified via **read-timestamped snapshots** (e.g., `SELECT * FROM world AS OF SYSTEM_TIME t_past`).  
     - **Future truth**: A fact with a *valid time* > current snapshot timestamp. It may be:  
       - *Predicted*: An uncommitted write (not yet real).  
       - *Precommitted*: Written to the log with a future valid time (e.g., a scheduled event), but only becomes "real" when valid time ≤ current time.  

  3. **The Present**:  
     The **snapshot timestamp** of a transaction—a consistent view of committed data up to that point. No global clock exists; timestamps are derived from **vector clocks** (e.g., Lamport timestamps). The present is thus **local to each transaction** and corresponds to its start time.  

  #### Views Translated:
  - **Presentism**:  
    Only facts with *valid time* = *transaction's snapshot timestamp* exist. The present is a **live snapshot**—queries see only data valid *now* (e.g., `SELECT * FROM world WHERE valid_time = current_timestamp`).  
    - *Claim*: Uncommitted writes and past/future valid times are not real. The log is append-only, but only current validity defines existence.  

  - **Eternalism**:  
    The entire **event log** exists—all committed records across all valid times. Past, present, and future are equally real. Snapshots are arbitrary slices of this **immutable block**.  
    - *Claim*: `SELECT * FROM world AS OF SYSTEM_TIME t` works for any `t`; valid times are fixed coordinates in a static log.  

  - **Growing-Block View**:  
    The log **appends** new committed facts, growing the set of existing valid times. Past and present exist (committed), but the future does not (uncommitted).  
    - *Claim*: `COMMIT` extends the block. Valid times > max(commit_time) are not yet real.  

  #### Objections Translated:
  - **Truthmaker Objection to Presentism**:  
    If only the present snapshot exists, what **truthmakers** validate past-tense queries (e.g., "At t=5, fact F held")?  
    - *Presentist response*: **Append-only logs** store past states as immutable records. The *current* log is the truthmaker: `SELECT * FROM log WHERE valid_time = 5` succeeds because the log exists *now*.  
    - *Counter*: This smuggles in eternalism—the log's persistence relies on all committed times existing *now*.  

  - **Relativity of Simultaneity Objection**:  
    Physics lacks a global clock; simultaneity is frame-dependent. Presentism requires an absolute "now."  
    - *Database analogy*: **Vector clocks** enforce partial order; no universal snapshot timestamp exists. Two transactions may have mutually inconsistent "present" snapshots if their vector clocks are concurrent.  
    - *Presentist dilemma*: If the present is transaction-relative, existence is observer-dependent—violating presentism's core tenet.  

  ---

  ### Residue Report: What Doesn't Translate Cleanly

  #### Clean Translations:
  1. **Relativized Presentism ≈ Snapshot Isolation**:  
     Each transaction’s snapshot defines its "present." Past states are accessible via AS OF queries, but only current valid times exist *for that transaction*. Truthmakers are the immutable log.  
     - *Why clean*: Append-only logs solve the truthmaker objection; snapshots localize existence.  

  2. **Uncommitted Writes ≈ Truthmaker for Future Contingents**:  
     Future-tense statements (e.g., "Event E will occur") map to uncommitted writes—not yet real, pending a `COMMIT`.  
     - *Why clean*: Aligns with presentism/growing-block: future validity isn’t real until committed.  

  3. **Eternalism ≈ Immutable Event Log**:  
     The entire log is a static "block"; valid times are coordinates, not temporal flows.  
     - *Why clean*: Queries at any timestamp are consistent; no "flow" of time.  

  #### Distorted Translations:
  1. **Growing-Block Requires Global Time**:  
     The view assumes a single, linear `commit_time` sequence. But in distributed systems, **vector clocks** only give partial order. Two facts may be causally unrelated (concurrent), violating the "growing" metaphor.  
     - *Distortion*: Growing-block presumes absolute chronology. Vector clocks make "growth" observer-dependent.  

  2. **Valid Time vs. Transaction Time Duality**:  
     Metaphysics treats time monolithically. Databases bifurcate *when a fact held* (valid time) and *when it was recorded* (transaction time).  
     - *Distortion*: Eternalism treats valid time as fundamental. But transaction time is an implementation detail—e.g., a delayed fact (high transaction time, past valid time) still "existed" in the past.  

  #### No Counterpart:
  1. **Passage of Time**:  
     Databases lack an analogue for temporal "flow." `COMMIT` extends the log, but this is discrete and algorithmic—not metaphysical becoming.  
     - *Residue*: A defect of the framework. Time-passage is external to the model (e.g., wall-clock triggers commits).  

  2. **Privileged Present via Serialization Order**:  
     Snapshots are consistent because a **consensus algorithm** (e.g., Raft) forces a total commit order. This imposes a **global present**—precisely what relativity denies.  
     - *Residue*: A substantive defect. Physics has no consensus algorithm; the database "solves" relativity by fiat.  

  3. **Future Existence in Eternalism**:  
     Eternalism treats future valid times as real. But databases can only store *predictions* (uncommitted writes). A future fact (e.g., `valid_time = t_future`) becomes real only when `transaction_time ≤ now`.  
     - *Residue*: Less substantive. The debate conflates *epistemology* (we can’t *know* the future) with *ontology* (whether it exists). Databases restrict knowledge, not existence.  

  ---

  ### Critical Tension: The Privileged Present
  Your framework **smuggles in a global present** via:  
  - **Total commit order**: Consensus algorithms force a linear history, creating an objective "now."  
  - **Snapshot consistency**: Transactions see a cut at their start time, but this depends on a global sequence.  

  In physics, relativity forbids this—no vector clock can totalize order without arbitrary choices. Presentism requires absolute simultaneity, which your system enforces artificially. Thus:  
  - The analogy "saves" presentism by *adding* a consensus mechanism absent in physics.  
  - This exposes the debate's core substantive divide: **Is time fundamentally ordered?** Databases say yes (to ensure consistency); relativity says no.  

  #### Residue Verdict:  
  - **Defects of the framework**:  
    - Requires total commit order (external to relativity).  
    - Cannot model *open future* (growing-block) without a global clock.  
  - **Less substantive debates**:  
    - Truthmaker objection dissolves with append-only logs.  
    - Future existence reduces to epistemology (uncommitted vs. committed).  

  **Conclusion**: Your vocabulary captures eternalism cleanly and presentism/growing-block *if* relativized. But the need for serialization order reveals presentism's dependence on a "consensus algorithm for time"—a privilege physics denies. The residue isn't just missing pieces; it highlights metaphysics' struggle with fundamental ordering.
