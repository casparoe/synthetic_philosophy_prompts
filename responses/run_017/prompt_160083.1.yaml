answer: |-
  Below is a move-by-move adjudication of Marta and Owen's exchange. I'll assess each move for success, identify what it relies on, note overlooked weaknesses, and flag unspoken assumptions. The goal is to pinpoint where the disagreement crystallizes and whether either side gains a decisive advantage.

  ---

  **Move 1 (Marta: The Paradox as Linguistic Vagueness)**  
  - **Success:** Partial (but stronger than Owen acknowledges).  
  - **Why:** Marta correctly diagnoses that the paradox arises because "heap" lacks a precise boundary. Her insistence that this isn't about ignorance—that there's "nothing to find"—captures a core feature of vagueness: no physical fact (e.g., grain position) determines the cutoff.  
  - **Relies on:** The intuition that adding one grain *cannot* change a non-heap into a heap, exposing a flaw in treating "heap" as having strict conditions.  
  - **Overlooks:** She doesn’t address how we *use* the word successfully despite this lack of precision. Owen will exploit this later.  

  **Move 2 (Owen: Vagueness as Ignorance)**  
  - **Success:** Fails.  
  - **Why:** His analogy (grain count, coastline length) is misleading. Those involve *measuring* a pre-existing quantity (mass, distance). "Heap" lacks such a quantity—it’s defined by human judgment. Claiming there’s a hidden cutoff "we cannot know" assumes a fact exists without explaining *what kind of fact it is*. Marta’s next move targets this.  
  - **Relies on:** The assumption that all concepts must have sharp boundaries, even if inaccessible. Ignores that "heap" might be fundamentally different from physical quantities.  

  **Move 3 (Marta: No Fact to Ignore)**  
  - **Success:** Succeeds against Owen’s Move 2.  
  - **Why:** She highlights a key disanalogy. Physical processes (like combustion) determine when a candle is lit, but no analogous process determines "heap." Specifying grain positions exhausts the physical facts; nothing remains to "settle" a boundary. Owen’s "ignorance" claim requires a hidden determiner—but if none exists, his view collapses.  
  - **Relies on:** The principle that facts require *grounds* (e.g., physical laws, social conventions). If no grounds exist, the "fact" is illusory.  
  - **Overlooks:** Owen could argue that *linguistic practice* grounds the fact (which he does next).  

  **Move 4 (Owen: Total Usage Determines the Boundary)**  
  - **Success:** Partial (logically possible but empirically dubious).  
  - **Why:** His appeal to "total usage" (all past judgments) as a hidden boundary-setter is clever. It mirrors how word meanings evolve beyond individual knowledge (e.g., "water" meant H₂O before chemistry). *If* usage converges on a specific cutoff, vagueness *could* be ignorance.  
  - **Relies on:** Two assumptions:  
    1. Total usage *does* converge on a precise boundary (e.g., "the largest collection ever called a heap").  
    2. This boundary is "definite" even if unknowable.  
  - **Weaknesses:**  
    - Assumption #1 is unlikely: Usage is messy. People might never agree on *any* point in the series, making convergence a fiction.  
    - Even if true, this doesn’t resolve *why* we treat borderline cases as uncertain—why not just guess?  
  - **Talking Past Marta:** Owen invokes "meaning" as external to speakers, while Marta focuses on the *experience* of vagueness (no guidance in borderline cases).  

  **Move 5 (Marta: Infinite Regress)**  
  - **Success:** Succeeds as a challenge, but not fatal.  
  - **Why:** If "definitely a heap" is vague, Owen’s view demands *another* sharp boundary for it, then another for "definitely definitely a heap," ad infinitum. This regress *is* a problem: it multiplies unknowable boundaries without explanatory power. Owen’s reply ("infinity is fine") ignores that these boundaries are unsupported—unlike arithmetic truths, which follow from axioms.  
  - **Relies on:** The intuitive vagueness of higher-order terms ("clearly," "borderline").  
  - **Owen’s Weakness:** He assumes "total usage" fixes *all* boundaries, but this is ad hoc—a "just-so" story with no evidence.  
  - **Verdict:** The regress weakens Owen’s view by making it needlessly complex, but doesn’t refute it.  

  **Move 6 (Owen: Logical Costs)**  
  - **Success:** Succeeds (exposes a genuine problem for Marta).  
  - **Why:** If borderline cases lack truth values (Marta’s view), statements like "It’s a heap or it isn’t" can fail (if neither is true). Yet we *use* such logic successfully daily (e.g., "If it’s a heap, remove it"). Owen is right: this strains standard logic. His "umpire" example shows we *act* as if boundaries exist.  
  - **Relies on:** The practical reliability of classical logic in ordinary reasoning.  
  - **Marta’s Unspoken Weakness:** She needs an alternative logic (e.g., one with degrees of truth), but doesn’t offer one.  
  - **Adjudication:** Owen scores here, but it doesn’t prove sharp boundaries exist—only that Marta’s view demands logical revision.  

  **Move 7 (Your Point: Cycling Judgments)**  
  - **Success:** Succeeds against Owen.  
  - **Why:** Intransitive judgments ("A > B > C > A" in heapishness) undermine his view. If "heapishness" were a hidden scale (like mass), noise could cause intransitivity—but here, *judgments are the only data*. Calling them "noise" assumes the scale exists (begging the question). Worse, the engineers’ *choice* of a threshold shows it’s pragmatic, not discovered.  
  - **Owen’s Failure:** His "noisy measurement" analogy falsely assumes an independent reality (mass) where none exists.  
  - **Supports Marta:** Shows "heap" relies on context/purpose, not a hidden threshold.  

  **Move 8 (Marta: Purpose-Relative vs. Owen: Purpose-Determines)**  
  - **Marta’s Success:** Stronger.  
  - **Why:** She grasps that "heap" works *because* it’s flexible: it serves rough functions (warning, estimating effort) without exact boundaries. Demanding precision is indeed a category mistake—like asking for the exact boundary of "tall."  
  - **Owen’s Weakness:** He claims "fix the purpose, and a boundary exists," but this is empty. *Which* purpose? Who decides? His "definite number" is just restating his assumption.  
  - **Relies on:** Marta’s functional view of language vs. Owen’s fact-based view.  

  ---

  ### Key Resolutions:
  1. **"Cannot locate vs. no line" (Move 2–3):**  
     - Owen’s distinction fails. Without a *ground* for the boundary (physical or conventional), "ignorance" is incoherent. Marta undercuts him by showing no fact exists to be ignorant *of*.  

  2. **The Regress (Move 5):**  
     - A genuine difficulty for Owen. Infinite boundaries are conceivable but implausible and unexplanatory. It highlights that his "total usage" fix is speculative.  

  3. **Logical Costs (Move 6):**  
     - Severe for Marta. We *do* use classical logic with vague terms. But alternatives exist (e.g., "fuzzy logic" where truth is partial, preserving rules like non-contradiction). Owen misses that these options *can* accommodate vagueness without sharp boundaries.  

  4. **Cycling Judgments (Move 7):**  
     - Tells decisively against Owen. If "heapishness" isn’t a linear scale, his sharp boundary is unmotivated. Supports Marta’s claim that boundaries are artifacts.  

  ---

  ### Core Disagreement:  
  - **Not about words vs. world**, but about **what grounds word meaning**.  
    - Owen: Meaning is fixed by total usage, creating hidden facts.  
    - Marta: Meaning emerges from practical use; vagueness reflects its function.  
  - **Owen’s blind spot:** He conflates *epistemic* vagueness (unknowable truth) with *semantic* vagueness (no truth to know). Marta seizes this.  
  - **Marta’s blind spot:** She dismisses the logical consequences of her view.  

  ### Final Adjudication:  
  Marta wins on points. Her view better explains:  
  - Why no physical detail fixes the boundary (Move 3).  
  - Why judgments cycle (Move 7).  
  - Why "heap" is useful without precision (Move 8).  
  Owen’s strongest point (logical costs, Move 6) is real but fixable with better tools. His "total usage" defense is theoretically possible but unsupported and inefficient.  

  **Where it runs out:** Neither can *prove* their view. Marta’s "no fact" claim is intuitive but hard to square with logic; Owen’s "hidden fact" is coherent but ungrounded. The tiebreaker is parsimony: Marta’s view requires fewer invisible moving parts.
