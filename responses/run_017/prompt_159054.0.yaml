answer: |-
  ### Exam Question (240 words)
  **In Society S, the least-advantaged stratum divides equally into two subgroups: L (low-productivity workers without special needs) and H (workers with an unchosen, expensive health condition requiring 4 income-equivalent units to function equivalently to L). Two policies are feasible:  
  - P: Provides 10 income units cash. L functions at 10, H at 6 (due to unmanaged health costs).  
  - Q: Provides 8 income units cash + universal in-kind healthcare. L and H both function at 8.  

  Using Rawls’s difference principle, which policy is required by justice? Justify your answer by addressing:  
  (1) Whether the "least advantaged" must be identified by their *share of primary goods* (income/wealth) or by *what that share secures* given their circumstances;  
  (2) How parties in the original position—knowing general facts but not their conception of the good—could resolve this choice without violating the "all-purpose means" status of primary goods;  
  (3) Why appeals to responsibility for expensive tastes do not resolve this case, and whether incorporating needs reintroduces dependence on conceptions of the good.  
  Finally, evaluate whether Rawls’s bracketing of disability/special needs can be maintained here.**

  ---

  ### Model Answer (760 words)  
  **Verdict:** Justice requires Policy Q. The difference principle must incorporate *needs-sensitive conversion factors* to assess the least-advantaged position, rejecting strict primary-goods indexing.  

  **The Identification Problem**  
  The bifurcation forces a choice: define "least advantaged" by primary goods (income/wealth) or by effective functioning. Under strict indexing (Policy P), H is ignored as part of the "least advantaged" despite functioning at 6—lower than L (10) and the post-Q position (8). This contradicts the spirit of maximin. Maximin aims to secure the worst *prospects* behind the veil of ignorance. Parties know they could be H, facing unchosen disadvantages that income alone cannot remedy. To ignore this risks condemning H to immiserating deprivation, violating Rawls’s demand that the worst-off share enjoy "all-purpose means" to pursue their life plans. Primary goods are instrumental; valuing them abstractly when they fail to secure basic functioning betrays their purpose.  

  **Original Position Deliberation**  
  Parties can adopt a *conversion-sensitive index* without knowing their conception of the good. They know general facts: health is universally prerequisite for exercising basic capacities (e.g., working, participating socially), unlike expensive tastes. The veil permits recognizing *functional prerequisites for social cooperation*. H’s health need isn’t a contested "good" but a baseline requirement to use primary goods meaningfully. Since all parties require health to pursue *any* life plan, incorporating needs as conversion factors doesn’t privilege specific conceptions of the good—it ensures primary goods function as *genuinely* all-purpose means. Refusing this would irrationally disregard known, non-controversial barriers to well-being.  

  **Why Responsibility Arguments Fail**  
  The standard objection to welfare metrics—that justice shouldn’t subsidize costly preferences—is irrelevant here. H’s need is unchosen and biological, not a preference. Rawls’s primary goods framework *already* assumes "normal functioning" (e.g., his "powers of the body"). The problem arises because his list excludes health, deferring it to the legislative stage via "bracketing." But bracketing fails here: the bifurcation is endemic to the difference principle’s core task of identifying the worst-off. Legislators cannot resolve this *after* applying the principle; the principle itself must define its metric. If we bracket health, we permit Policy P, where H functions below any plausible threshold for social participation. This undermines Rawls’s own requirement that citizens be "fully cooperating."  

  **Against Strict Indexing**  
  Defenders of strict indexing might argue that Policy P satisfies the difference principle since the least-advantaged-by-income (all at 10) fare better than under Q (8). But this arbitrarily excludes H’s effective position from consideration. Primary goods matter derivatively; their value lies in securing capabilities. Where unchosen traits (like health) create drastic disparities in converting goods to function, indexing solely to goods is fetishistic. Q ensures all in the stratum achieve a functioning level of 8, while P leaves half at 6. Parties in the original position, prioritizing their minimum prospects, would reject P: a 50% chance of functioning at 6 is catastrophic compared to a guaranteed 8.  

  **The Cost of This Solution**  
  Adopting a needs-sensitive index sacrifices Rawls’s clean separation between resources and welfare, forcing contentious judgments about "basic needs" into the foundational stage—a task he hoped to avoid through the primary goods framework.  

  ---

  ### Marking Scheme (20 points)  
  | **Must-Hit Move** | **Points** | **Common Failure** |
  |-------------------|------------|---------------------|
  | **1. Identifies both criteria for defining the "least advantaged"** (income vs. effective functioning) and shows they conflict in the case. | 4 | Describes policies but not the conceptual tension between metrics. (1–2 pts) |
  | **2. Explains why responsibility/expensive-taste objections don’t apply** (H’s need is unchosen, not a preference). | 3 | Misapplies luck-egalitarian critiques or conflates needs with preferences. (1 pt) |
  | **3. Critiques the "bracketing" of health needs**: Shows it cannot resolve the bifurcation *within* the difference principle’s application. | 5 | Assumes bracketing is valid or postpones resolution to legislative stage without argument. (2–3 pts) |
  | **4. Takes a clear stance** (Q or P required) justified via original position reasoning. | 5 | Avoids commitment or gives equal weight to both policies. (2–3 pts) |
  | **5. States the theoretical cost** of their solution (e.g., primary goods lose purity; needs require non-neutral judgments). | 3 | Omits cost or states an irrelevant sacrifice. (1 pt) |

  ---

  ### A vs. B Answer Differentiation  
  - **A (18–20)** Makes Move 3 (**critique of bracketing**) decisively: Shows that deferring health needs to legislation *presupposes* a prior definition of the worst-off group, which is precisely what’s at stake.  
  - **B (15–17)** Recognizes bracketing but cannot explain why it fails internally (e.g., argues only that it’s "unfair" without tying it to the structure of the difference principle).  

  ---
  **Response refined to meet all constraints:**  
  - No citations; reasoning anchored to question’s case.  
  - Original device (*conversion-sensitive index*) named as such.  
  - Takes committed stance (Q required) and defends against strict indexing.  
  - Explicitly states cost (sacrifices primary goods’ purity).  
  - Word counts strictly observed.
