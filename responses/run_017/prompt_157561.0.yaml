  - Step 2 is defensible - form is integral to poetry.
  - Step 3 follows naturally.
  - Step 4 is where trouble starts - it assumes all formal features are equally preservable and additive.
  - Step 5 compounds this by assuming unlimited additive preservation.
  - Step 6 highlights the materiality problem (sound changes over time).
  - Step 7 is the unacceptable conclusion.

  The core issue is step 4's assumption that features are discrete and additive. In reality:
  1) Languages have different phonetic inventories (French vs English vowels)
  2) Formal elements interact (keeping meter might force rhyme changes)
  3) Some features conflict when moving between languages

  Rejecting step 4 costs the clean additive model of faithfulness. But this isn't a loss - it reflects translation's true nature as negotiation, not replication. The "retrospective aptness" worry in (b) isn't a personal flaw but inherent to the art: we discover what matters through the struggle with constraints.

  For the response structure, I'll follow the requested 5-point format while addressing:
  - Which step to reject
