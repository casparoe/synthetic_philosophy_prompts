  ### Embedded Agency Exercise: The Last-Look Game  
  **Goal:** Make participants experience (1) being inside the system they're predicting, (2) the environment's "last look" at their rules, and (3) the futility of self-referential fixes.  

  ---

  #### **Materials**  
  - 14 index cards  
  - A box for card collection  
  - Whiteboard  
  - Markers  
  - Dice (for tie-breaking)  
  - Coffee voucher (prize for lowest cumulative score)  

  ---

  #### **Rules and Setup**  
  1. **Participants**: 14 individuals (no teams). Label players 1–14 visibly (e.g., name tags).  
  2. **Game Flow**:  
     - Each round, players write a **rule** on their card: either a **number (0–100)** or **"SAME"**.  
     - Rules are collected, and outputs are computed.  
     - **Target for player *i***: Output of player *i*+1 (player 1’s target is player 2’s output, player 14’s target is player 1’s output).  
     - **Scoring**: Absolute difference between your output and target. *Lower score = better*.  
  3. **Output Calculation**:  
     - **"SAME"** = Output of the **next player** (not your own!).  
     - **Number** = That number.  
     - **Deadlock**: If "SAME" chains form a loop (e.g., players 3→4→5→3), all in the loop output **50**.  
  4. **Rounds**:  
     - **Round 1 (15 min)**: No strategy discussion. Players write rules intuitively.  
     - **Round 2 (20 min)**: Allow 5 min discussion (players negotiate).  
     - **Round 3 (20 min)**: No discussion. Final chance to adapt.  

  ---

  #### **Step-by-Step Execution**  
  **0. Whiteboard Setup (5 min)**  
     - Columns: Player | Rule | Output | Target | Score  
     - Draw a circle connecting players 1→2→...→14→1.  

  **1. Round 1 (15 min)**  
     - Hand out cards. Players write a rule (**number** or **"SAME"**). Collect.  
     - **Compute Outputs**:  
       - Resolve numbers first (e.g., player 5 writes "40" → output=40).  
       - Resolve "SAME":  
         - *Example*: Player 2 writes "SAME". Look at player 3’s output.  
         - If player 3 wrote "SAME", look at player 4, etc.  
         - Loops output 50.  
     - **Compute Targets**: Target = next player’s output.  
     - **Scores**: |Output − Target|. Record on whiteboard.  

  **2. Round 2 (20 min)**  
     - Return cards. Allow 5 min open discussion ("Should we all write numbers? Or SAME?").  
     - Re-collect cards. Repeat computation.  

  **3. Round 3 (20 min)**  
     - No discussion. Final card submission. Compute scores.  

  **4. Winner (5 min)**  
     - Sum scores across rounds. Lowest total wins the coffee voucher.  
     - Ties broken by dice roll.  

  ---

  #### **Debrief (30 min)**  
  - **Reveal the Three Moments**:  
    1. **"You moved the target"** (after Round 1):  
       - *Ask*: "Player 3, your target was Player 4’s output. But Player 4’s output changed when you wrote ‘SAME’!"  
       - *Point*: Your rule altered the system you’re in → *embedded feedback loop*.  
    2. **"The room got the last look"** (after Round 2):  
       - *Ask*: "When you discussed, did you realize your rule was public before outputs were computed?"  
       - *Point*: Rules are physical objects → environment *sees* them before responding → *last-look*.  
    3. **"Self-reference passed the buck"** (after Round 3):  
       - *Ask*: "Who wrote ‘SAME’? Did it work? What broke the loop?"  
       - *Point*: "SAME" delegates the problem to others → leads to loops or external fixes (the 50 default).  

  - **Name the Concepts**:  
    - Finally, reveal: "This is *embedded agency*: you’re inside the system, the world sees your rules, and self-reference just kicks the can. The hard part? You can’t simulate the entire room in your head!"  

  ---

  #### **Predictable Issues & Mitigation**  
  - **CS Students Hunt Fixed Points**:  
    - *Expected*: They’ll write "SAME" or try looped self-reference.  
    - *Use It*: When loops happen, highlight how "SAME" requires *others* to resolve it → no escape.  
  - **Philosophy Students Call It Incoherent**:  
    - *Expected*: "The loop resolution is arbitrary!"  
    - *Use It*: "Yes! The system needs an external default (50) because self-reference *doesn’t close the loop*."  
  - **Logistical Snag**:  
    - *Loop Resolution Takes Time*: Assign a "calculator team" of 2–3 players to help compute outputs.  

  ---

  #### **What the Game Can’t Do**  
  - **No Adaptation Over Time**: The game shows *one-shot* last-look and self-reference failure, but not how the environment *changes the agent’s learning process* (e.g., your update rule being optimized against).  
  - **Post-Game Statement**:  
    > "In real embedded agency, your *learning algorithm itself* is part of the environment. Today, we saw the static version: your rules are exposed, and the world gets the final move. Next week, we’ll discuss how this evolves when the system learns."  

  ---

  #### **Why This Works**  
  - **Payoff Mirrors the Argument**: Scoring literally uses players’ outputs as inputs to others’ targets.  
  - **No Beauty Contest**: Targets are *assigned* (next player’s output), not averages.  
  - **Self-Reference Fails Gracefully**: "SAME" creates resolvable chaos, proving it’s not a magic fix.  
  - **You’re Inside the System**: The circle of players (1→2→...→14→1) forces mutual dependency.  

  Run this, and the room will *feel* the last look.
