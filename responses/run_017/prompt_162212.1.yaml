answer: |-
  ### Probability Update Procedure for Freight-Risk Forecasting

  **Objective**: Update a joint probability distribution over discrete scenario cells based on incoming reports, ensuring methodological rigor and avoiding conflation of evidence and constraints.

  **Key Definitions**:
  - **Cells**: Discrete scenarios (indexed \(i = 1\) to \(N\)) with prior probabilities \(p_i\) (summing to 1).
  - **Evidence**: Reports from a source of known reliability. Handled via likelihoods (Bayesian conditioning).
  - **Constraints**: Direct assessments (e.g., marginals, conditionals, comparatives) that the posterior distribution must satisfy. Handled via minimum cross-entropy (MinxEnt).
  - **Jeffrey Conditioning**: For new marginals over a partition, preserving relative odds within partition elements. Only valid if **rigidity** holds (relative odds within partition elements are unchanged by the report).
  - **MinxEnt Update**: Yields the closest distribution to the prior satisfying constraints, using Kullback-Leibler divergence. Solution form: \(q_i = p_i \cdot e^{\sum_k \lambda_k a_{ki}} / Z\), where \(\lambda_k\) are Lagrange multipliers, \(a_{ki}\) are constraint coefficients, and \(Z\) normalizes.

  **Procedure**:
  1. **Classify the Input**:
     - If the report is from a source of known reliability **and** provides observable evidence (e.g., "Source claims X"), treat as **evidence** (go to Step 2).
     - If the report provides a new marginal probability over a partition (e.g., "P(A) = 0.4"), treat as a **Jeffrey candidate** (go to Step 3).
     - Otherwise, treat as a **constraint** (e.g., "P(B|A) = 0.6", "A is twice as likely as B") and go to Step 4.

  2. **Evidence Update (Bayesian Conditioning)**:
     - Define likelihoods \(L_i = P(\text{report} \mid \text{cell } i)\) based on source reliability.
     - Compute unnormalized posterior: \(q_i^* = p_i \cdot L_i\).
     - Normalize: \(q_i = q_i^* / \sum_j q_j^*\).
     - **Output**: Updated \(q_i\). Proceed to next report.

  3. **Jeffrey Conditioning**:
     - **Verify Rigidity**:
       - Confirm the report **only** provides new marginals for the partition and **does not** imply changes to relative odds within partition elements (e.g., no intra-partition conditionals or comparatives).
       - If rigidity fails (e.g., report includes "within region X, P(Y) changed"), treat as a constraint (go to Step 4).
     - Let partition \(\{A_j\}\) have new marginals \(Q(A_j)\). Prior marginals: \(P(A_j) = \sum_{i \in A_j} p_i\).
     - Update: \(q_i = p_i \cdot \frac{Q(A_j)}{P(A_j)}\) for \(i \in A_j\).
     - **Output**: Updated \(q_i\). Proceed to next report.

  4. **MinxEnt Update for Constraints**:
     - **Express Constraints as Linear Equalities**:
       - Marginal: \(Q(B) = b \Rightarrow \sum_{i \in B} q_i = b\).
       - Conditional: \(Q(B|A) = r \Rightarrow \sum_{i \in A \cap B} q_i = r \cdot \sum_{i \in A} q_i\).
       - Comparative: "A at least twice as likely as B" \(\Rightarrow\) treat as inequality; simplify to equality (e.g., \(Q(A) = 2 \cdot Q(B)\)) if context allows. If not, use a solver (see Step 4d).
       - **Stop if Unsatisfiable**: If constraints require \(q_i > 0\) for \(p_i = 0\), escalate to lead. If constraints conflict (no solution), adjust or discard.
     - **Apply MinxEnt**:
       - For 1–2 constraints, solve for \(\lambda_k\):
         - Write \(q_i = p_i \cdot e^{\sum_k \lambda_k a_{ki}} / Z\).
         - Solve for \(\lambda_k\) using constraint equations and normalization via algebraic substitution or trial/error.
       - For >2 constraints or inequalities, use a spreadsheet solver:
         - Set up objective: Minimize \(\sum_i q_i \ln(q_i / p_i)\) subject to constraints \(\sum_i a_{ki} q_i = b_k\) and \(\sum_i q_i = 1\).
         - Use Excel Solver (GRG Nonlinear) or equivalent.
     - **Output**: Updated \(q_i\).

  5. **Handle Multi-Part Reports**:
     - Split the report into independent parts (e.g., "Source claims X (70% reliable) and if X, P(Y) = 0.6" → evidence part and constraint part).
     - Update **sequentially**: Evidence (Step 2) → Jeffrey (Step 3) → Constraints (Step 4), **except**:
       - **Multiple constraints must be applied jointly** (Step 4). Sequencing violates constraints and causes order-dependence.
       - Evidence and Jeffrey updates may precede constraints.

  6. **Validation and Diagnostics**:
     - **Check Rigidity (Post-Jeffrey)**: Relative odds within each partition element \(A_j\) must be unchanged: \(q_i / q_k = p_i / p_k\) for \(i, k \in A_j\).
     - **Check MinxEnt Invariance**: Relative odds for cells untouched by constraints must match prior: \(q_i / q_j = p_i / p_j\) if no constraint distinguishes \(i\) and \(j\) (i.e., \(a_{ki} = a_{kj}\) for all \(k\)).
     - **Record Method**: Note if MinxEnt was used (default). Alternative: Euclidean update (minimize \(\sum_i (q_i - p_i)^2\)), but this may yield negative probabilities. Escalate choice to lead.

  ---

  ### One-Page Analyst Checklist  
  **Classify Input**  
  ✅ Evidence (source reliability given)? → **Step 2**  
  ✅ New marginal over partition? → **Step 3 (check rigidity!)**  
  ✅ Other (conditional, comparative)? → **Step 4**  
  **Multi-Part?** → Split, then route each part.  
  **Constraints**  
  ✅ Rewrite as linear equalities.  
  ❌ Unsatisfiable or \(p_i = 0\)? → **Escalate!**  
  ✅ 1–2 constraints? → Solve for \(\lambda_k\) by hand.  
  ✅ >2 or inequalities? → **Use solver**.  
  **Update & Validate**  
  ✅ Apply update.  
  ✅ Check invariance: Untouched odds unchanged?  
  ✅ Record method (MinxEnt default).  
  **Joint Updates**  
  ✅ Multiple constraints? → **Apply jointly (Step 4)**.  
  ✅ Evidence + constraint? → Evidence first (Step 2), then constraint (Step 4).  

  ---

  ### Limitations  
  1. **Prior Zeros**: Fails if constraints require \(q_i > 0\) for \(p_i = 0\). Manual prior adjustment needed.  
  2. **Inequality Constraints**: Hand-calculation infeasible; requires solver.  
  3. **Rigidity Verification**: Subjective; may require escalation.  
  4. **Complex Likelihoods**: Evidence reports must be simplifiable to likelihoods \(L_i\). Vague reports may need approximation.  
  5. **Non-Linear Constraints**: Not supported; linearize or discard.  
  6. **Report Dependencies**: Assumes reports are independent; sequential updates may accumulate errors.  

  ---

  ### Worked Examples  
  **Case 1: Calibration (Conditional Constraint)**  
  - **Cells**: North/Port (NP), North/Depot (ND), South/Port (SP), South/Depot (SD). Prior: \(p_i = 0.25\) for all.  
  - **Report**: "If North, P(Depot) = 0.75". → Constraint: \(Q(\text{Depot} | \text{North}) = 0.75\).  
    - Rewrite: \(Q(\text{ND}) / [Q(\text{ND}) + Q(\text{NP})] = 0.75\) → \(Q(\text{ND}) = 3 \cdot Q(\text{NP})\).  
    - MinxEnt: \(q_i = p_i \cdot e^{\lambda a_i} / Z\), with \(a_i = [1, -3, 0, 0]\) for [ND, NP, SP, SD].  
    - Solve:  
      - Constraint: \(q_\text{ND} = 3 q_\text{NP}\) → \(0.25e^\lambda = 3 \cdot 0.25e^{-3\lambda}\) → \(e^{4\lambda} = 3\) → \(\lambda = \ln(3)/4 \approx 0.275\).  
      - Unnormalized: \(q^*_\text{ND} = 0.25e^{0.275} \approx 0.329\), \(q^*_\text{NP} = 0.25e^{-0.825} \approx 0.110\), \(q^*_\text{SP} = q^*_\text{SD} = 0.25\).  
      - \(Z \approx 0.329 + 0.110 + 0.25 + 0.25 = 0.939\).  
      - Posterior: \(q_\text{ND} \approx 0.351\), \(q_\text{NP} \approx 0.117\), \(q_\text{SP} = q_\text{SD} \approx 0.266\).  
  - **Odds in South**: Unchanged (\(q_\text{SP}/q_\text{SD} = 1 = p_\text{SP}/p_\text{SD}\)). **Signature of MinxEnt**: Untouched odds preserved.  

  **Case 2: Prior Zero Cell**  
  - **Prior**: Cell A: \(p_A = 0.8\), Cell B: \(p_B = 0.2\), Cell C: \(p_C = 0\).  
  - **Report**: "P(C) = 0.3". → Constraint: \(q_C = 0.3\).  
  - **Stop**: Unsatisfiable without \(q_C > 0\) and \(p_C = 0\). Escalate to lead.  

  **Case 3: Evidence + Constraint**  
  - **Cells**: Customs/Fast (CF), Customs/Slow (CS), NonCustoms/Fast (NF), NonCustoms/Slow (NS). Prior: \(p_i = 0.25\).  
  - **Report**: "Source (70% reliable) claims Customs. If Customs, P(Fast) = 0.6".  
    - **Part 1 (Evidence)**:  
      - Likelihoods: \(L_i = [0.7, 0.7, 0.3, 0.3]\) for [CF, CS, NF, NS].  
      - Unnormalized: \(q^*_i = [0.175, 0.175, 0.075, 0.075]\).  
      - Normalized: \(q_i = [0.35, 0.35, 0.15, 0.15]\).  
