prompt: |-
  I help run a volunteer bike workshop, and after a blowup last month about our unwritten rules I've somehow ended up in charge of new-volunteer onboarding, which now includes a half-hour slot on why we do things the way we do and how that ever changes. I want to build it around the Lewis-style account of convention as an equilibrium of a coordination problem rather than around rules, agreements and enforcement. Don't explain the account to me — plan how I'd get it across to adults with no philosophy, most of whom think an unwritten rule is either a habit or just peer pressure, and who assume all our rules are the same kind of thing when I'm pretty sure they aren't.

  What I need: the order the pieces have to land in and what breaks if two of them get swapped; which of our two contested rules should carry the whole session — (a) whoever last used a tool leaves it out on the bench overnight instead of putting it back, or (b) nobody takes donated parts home during their first month — and what the carrying example has to have and has to lack so it doesn't smuggle in a second layer too early; the misconceptions to expect at each stage (I'm guessing "if its arbitrary then I don't have to follow it" and "we'd just need everyone to agree to switch at once") and the point in the sequence where each should be headed off; one closing question that shows me they've got the expectations structure and not just the vocabulary; and what I should openly refuse to go into at this level.
reasoning: |-
  Okay, the user runs a volunteer bike workshop and needs help designing a session on unwritten rules using David Lewis's convention theory. They want to avoid framing it as rules or agreements and instead focus on conventions as equilibria in coordination problems. 

  First, I need to recall Lewis's key ideas: conventions are solutions to recurring coordination problems where no single solution is inherently better, but consistency matters. People follow them because they expect others to, creating a stable pattern. The user mentioned two contested rules: leaving tools out versus not taking donated parts home early. 

  The user specified that the session should clarify that not all rules are the same. They probably noticed confusion between habits, peer pressure, and actual conventions. The goal is to show that conventions are about mutual expectations, not enforcement. 

  Looking at the two rule examples, rule (a) about leaving tools out seems better. It’s a pure coordination problem—either everyone puts tools away or everyone leaves them out. Both solutions work as long as everyone does the same. The inefficiency (tools left out) is tolerable because the alternative (tools constantly moved) wastes more effort. It’s arbitrary but stable. 

  Rule (b) about not taking parts home involves multiple issues. It’s not just coordination; there’s trust-building, fairness, and preventing abuse. This mixes in enforcement and moral dimensions, which could confuse the core concept. So rule (a) is cleaner for illustrating the equilibrium idea. 

  For structure, the session should start with a relatable coordination problem. The sidewalk example (which side to walk on) is perfect—arbitrary but necessary. Then introduce the tool rule as a workshop-specific example. Highlight that the current method became a convention because it solved a repeated problem, and now everyone expects it. 

  Key misconceptions to address: 
  1. "Arbitrary means I don’t have to follow." Need to explain that arbitrariness doesn’t invalidate the convention; predictability is what matters. 
  2. "We can all agree to switch at once." Point out the collective action problem—individuals can’t easily change without coordinated effort. 

  The closing question should test understanding of expectations. Asking how a new person learns the tool rule would reveal if they grasp the role of observing others and inferring expectations. 

  What to avoid: Don’t dive into enforcement or moral rules yet. Stick to pure coordination examples to keep the focus on equilibrium. Also, skip the philosophical terminology; use everyday language. 

  The user is experienced but needs a practical, engaging session. They might also want volunteers to feel empowered to suggest changes, so ending with the revision question plants that seed. Overall, the session needs to transform their view of unwritten rules from rigid to dynamic.
answer: |-
  Here's a structured onboarding plan using Lewis-style convention theory, focused on clarity and avoiding common pitfalls. The **Tool Rule (a)** ("whoever last used a tool leaves it out") is the superior carrier example due to its *pure coordination logic*.

  **Core Structure & Non-Negotiable Order:**

  1.  **Start with a UNIVERSAL Coordination Problem (Not Workshop):** (5 mins)
      *   **Example:** "Which side of the sidewalk/path do we walk on?" (Left/Right depending on location). *Show it visually.*
      *   **Focus:** Problem = Avoid collisions & awkward shuffling. *Any* consistent side works. No inherent "right" answer (Left vs. Right).
      *   **Key Point:** We need *predictability*. The *specific solution* is arbitrary, but *consistency is vital*. It solves a recurring problem where people's actions depend on others'.
      *   **Misconception Head-Off:** *"It's just habit/peer pressure!"* → Counter: "Yes, habits form *around* it, and pressure exists to conform, but the *core reason* it started and persists is solving that collision problem predictably. The habit follows the need for coordination."
      *   **Why Order Matters:** Establishes the *concept* of a coordination problem and arbitrary solutions *before* applying it to the workshop. If you start with workshop rules, they bring baggage.

  2.  **Introduce the Workshop's Coordination Problem & "Solution" (Tool Rule):** (10 mins)
      *   **Problem:** "Imagine: Tools constantly put away *and* taken out multiple times a shift. Or, tools always left out, cluttering every bench. How do we minimize wasted time/effort *and* keep benches usable?"
      *   **Present Rule (a) as the Emergent Solution:** "Our current pattern: **Whoever last used a tool leaves it out on the bench overnight.**"
      *   **Analyze it Like the Sidewalk:**
          *   *Arbitrary?* Yes! Could be "Always put away" or "Leave out for 1 hour only". *No inherent moral superiority.*
          *   *Equilibrium?* It works *because* we mostly all do it. I leave it out expecting the *next* person might need it soon or will be the one to finally put it away at close. They see it out and know the *system*. Predictability reduces total tool-moving effort.
          *   *Solves the Problem?* Reduces constant put-away/get-out cycles. Benches *eventually* get cleared (overnight reset by closer/opener). Not perfect, but functional.
          *   *Why this and not another?* Probably evolved randomly ("Bill always left his spanner out...") and stuck because it reduced friction *enough* once expectations aligned.
      *   **What it MUST Lack (Crucially):** *Do not mention enforcement, fairness, or trust here.* Focus purely on the *coordination of effort* (minimizing tool handling). Avoid implying anyone *should* be shamed for not doing it. Frame it as a practical pattern.
      *   **Misconception Head-Off:** *"If it's arbitrary, I don't have to follow it!"* → Counter: "Individually, true! But if *you* put a tool away while others leave theirs out, you create inconsistency. The *next* person won't know what to expect. It reintroduces the problem the pattern solves – unpredictability leading to wasted effort checking drawers or cluttered benches. Your action affects the *system's* predictability." (Stress the *network effect* of individual deviation).
      *   **Why Order Matters:** Applies the abstract concept directly to a core workshop practice immediately after establishing the concept, using the *cleanest* example.

  3.  **Contrast with a DIFFERENT Kind of Rule (Parts Rule - b):** (5 mins)
      *   **State Rule (b):** "Nobody takes donated parts home during their first month."
      *   **Contrast:** "This feels different, right? It's not mainly about *coordinating actions for efficiency* like the tools or sidewalk. What problem might *this* solve?"
      *   **Guide Discussion (Briefly):** Trust-building? Ensuring parts go to community bikes first? Preventing perceived exploitation? Fairness? *Not primarily coordination.*
      *   **Key Point:** "This rule likely involves elements of **trust, fairness, or resource management**. Changing it involves different considerations – maybe explicit agreement, moral arguments, or proving trustworthiness. It's *not* just about finding an arbitrary but consistent pattern like the tool rule. **Not all 'unwritten rules' are the same!**"
      *   **Why Order Matters:** Placed *after* establishing the pure convention example. Shows contrast. If shown *before* or alongside the tool rule, it contaminates the pure convention concept with moral/enforcement ideas.

  4.  **How Conventions Change (The Hard Part):** (5 mins)
      *   **The Myth:** "We just all agree to switch at once!"
      *   **The Reality (Lewis):** Conventions are stable *because* everyone expects everyone else to follow them. Changing requires shifting those *mutual expectations*, which is hard!
      *   **Process:** "Change usually starts small. Maybe a few experienced volunteers try 'always put away' for a *specific*, commonly used tool for a week. They coordinate *among themselves*. If it *clearly works better* (less clutter, faster finds?), others notice. Expectations *start* to shift. Maybe it spreads tool-by-tool. **It needs a critical mass acting together to create new expectations before everyone jumps.** It's rarely a single, full-group vote (though that *can* help signal intent)."
      *   **Misconception Head-Off:** *"We'd just need everyone to agree to switch at once!"* → Counter: "That *sounds* easy, but think about the sidewalk. If I yell 'Let's all switch sides tomorrow!', would you trust *every single person* got the message and will comply? Probably not. You'd hedge your bets. Coordination shifts need building new predictability through observable action by a subgroup first."
      *   **Link to Tools:** "Could the tool rule change? Yes! But it needs testing a new pattern and building new expectations gradually. Ideas are welcome, but understand the inertia."

  5.  **The Expectations Structure Recap:** (3 mins)
      *   Conventions solve recurring coordination problems (Sidewalk, Tools).
      *   They are arbitrary but stable patterns (Left/Right, Leave out/Put away).
      *   Stability comes from *mutual expectations*: I do X because I expect you to do X, and you do X because you expect me to do X.
      *   They change slowly by shifting expectations through observable action by a critical mass.

  **The Closing Question (Test Understanding):**
  > **"Imagine a brand-new volunteer walks in tomorrow. They see a wrench left out on a bench. How do they learn *why* it's there and what *they* are generally expected to do with tools they finish using? And *why* would following that expectation help the workshop run smoothly?"**

  *   **Why it works:** Reveals if they grasp the role of *observation* (seeing the pattern), inferring *expectations* (others leave tools out → I'm expected to leave tools out), and the *system-level benefit* (predictability reduces wasted effort). It focuses on the *mechanism of expectation transmission and coordination benefit*, not just vocabulary.

  **What to Openly Refuse at This Level:**

  1.  **Deep Philosophy:** "This is based on David Lewis, but we won't get into game theory matrices or possible worlds."
  2.  **Moral Justification for Conventions:** "We're not saying leaving tools out is 'good' or 'right' in an absolute sense, just that it's the current stable solution to *this specific* coordination problem."
  3.  **Detailed Enforcement Mechanisms:** Avoid deep dives into *how* peer pressure works here or consequences for breaking it. Frame deviation as disrupting predictability, not "being bad." (e.g., "If someone always puts tools away instantly, it breaks the expectation the *next* person has, leading to confusion and extra looking").
  4.  **Solving the Parts Rule (b) Debate:** "We used the parts rule as an example of a *different kind* of rule. How we manage donated parts fairly involves other considerations – trust, resource allocation – that are important but separate from the core coordination logic we focused on today. That's a discussion for another time or forum."
  5.  **Immediate Rule Change Proposals:** "Today was about understanding *why* patterns like the tool rule exist as they do. If you have ideas for improving *how* we coordinate, let's discuss them separately after you've had some time to observe and experience the current system."

  **Why Tool Rule (a) Wins Over Parts Rule (b):**

  *   **Pure Coordination:** Its core logic is minimizing wasted effort through predictable behavior. "Always put away" could equally solve it if expectations shifted.
  *   **Lacks Moral/Trust Dimension:** Unlike taking parts home, leaving a tool out isn't inherently about fairness or trustworthiness. It's purely about physical workflow efficiency.
  *   **Clearly Arbitrary:** Both solutions (Leave Out / Put Away) are viable, making the arbitrariness obvious.
  *   **Simple Expectations Structure:** "I see it out → I expect others leave tools out → I leave my tool out → Others see it out..." is a clear loop.
  *   **Easy to See Change Process:** Shifting to "Always Put Away" for one tool type is a feasible small-scale experiment.

  **Parts Rule (b) Fails as Carrier:**

  *   **Mixed Motives:** Combines coordination (part availability?), fairness, trust-building, preventing abuse. Impossible to disentangle for a pure convention lesson.
  *   **Moral Weight:** Taking parts *feels* different morally than leaving a tool out. This baggage distracts.
  *   **"Arbitrary" is Less Clear:** A one-month rule *could* be argued as less arbitrary (time to build trust) than a three-day or three-year rule.
  *   **Enforcement/Trust Central:** Peer pressure here feels more like policing morals/trust than maintaining predictable workflow.

  By meticulously following this order and using the Tool Rule as the workhorse example, you'll give volunteers a powerful lens to understand the *structure* of many unwritten workshop norms, distinguishing them from other types of rules and highlighting why they persist and how they *can* evolve. Good luck!
