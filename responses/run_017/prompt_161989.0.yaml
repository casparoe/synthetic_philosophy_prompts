  In summary, the case demonstrates that the two rules use different information: the average rule only uses the gains (and is invariant to baselines), while the maximin rule requires knowing the baselines to identify the worst-off and then compares the minimum outcomes. The disagreement arises because the two rules aggregate the gains and the baselines differently.
