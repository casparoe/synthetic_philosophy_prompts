  ### Case: Clinic Allocating Specialist Hours  
  A clinic has a fixed pool of 10 hours with a specialist to treat chronic pain for two patients, Alice and Bob. The specialist's time is allocated in two ways (Option 1 and Option 2). The outcome is measured in "function points" (a realistic scale from 0–100, used by clinicians to quantify daily functioning, e.g., mobility, pain reduction). Gains are improvements in function points from each patient’s starting point. The clinic can measure gains from treatment (via controlled studies) but not absolute starting points (due to high variability in individual baselines; precise measurement requires costly, unaffordable diagnostics).  

  #### Gains Table  
  | Option | Alice’s Gain | Bob’s Gain |
  |--------|--------------|------------|
  | **1**  | +3 points   | +7 points  |
  | **2**  | +6 points   | +3 points  |

  #### Two Admissible Baseline Hypotheses  
  - **Hypothesis H1**: Alice starts at **10** points, Bob at **12** points.  
    *(Alice is worse off initially: 10 < 12)*  
  - **Hypothesis H2**: Alice starts at **12** points, Bob at **10** points.  
    *(Bob is worse off initially: 10 < 12)*  

  Both hypotheses are consistent with all gain measurements. The story explains why baselines are unknown: functional baselines vary daily and require expensive tests the clinic cannot perform.  

  ---

  #### Chooser 1: Average Rule (Maximizes Expected Value)  
  *Behind the veil, this chooser calculates the average outcome (baseline + gain) across all people, treating each as equally likely. Since baselines are fixed per hypothesis, the average outcome for an option is: (Alice’s outcome + Bob’s outcome) / 2.*  

  - **Under H1 (baselines: Alice=10, Bob=12)**:  
    - Option 1: Alice = 10 + 3 = 13, Bob = 12 + 7 = 19 → Average = (13 + 19)/2 = **16**  
    - Option 2: Alice = 10 + 6 = 16, Bob = 12 + 3 = 15 → Average = (16 + 15)/2 = **15.5**  
    → **Prefers Option 1** (16 > 15.5)  

  - **Under H2 (baselines: Alice=12, Bob=10)**:  
    - Option 1: Alice = 12 + 3 = 15, Bob = 10 + 7 = 17 → Average = (15 + 17)/2 = **16**  
    - Option 2: Alice = 12 + 6 = 18, Bob = 10 + 3 = 13 → Average = (18 + 13)/2 = **15.5**  
    → **Prefers Option 1** (16 > 15.5)  

  **Key point**: The average chooser always prefers Option 1. Shifting baselines adds a constant (e.g., average baseline under H1 is (10+12)/2=11, under H2 is (12+10)/2=11) to both options’ averages. Since Option 1’s average *gain* (3+7)/2=5 is higher than Option 2’s (6+3)/2=4.5, Option 1 wins regardless of baselines.  

  ---

  #### Chooser 2: Maximin Rule (Maximizes the Worst-Off Person’s Outcome)  
  *Behind the veil, this chooser evaluates each option by the lowest outcome it produces for any person, then picks the option where this minimum is highest.*  

  - **Under H1 (Alice starts worse off)**:  
    - Option 1: Alice = 13, Bob = 19 → **Worst-off: Alice (13)**  
    - Option 2: Alice = 16, Bob = 15 → **Worst-off: Bob (15)**  
    → **Prefers Option 2** (15 > 13)  

  - **Under H2 (Bob starts worse off)**:  
    - Option 1: Alice = 15, Bob = 17 → **Worst-off: Alice (15)**  
    - Option 2: Alice = 18, Bob = 13 → **Worst-off: Bob (13)**  
    → **Prefers Option 1** (15 > 13)  

  **Result**: The maximin chooser picks **Option 2 under H1** but **Option 1 under H2**.  

  ---

  ### Critical Notes  
  1. **Feature Doing the Work**:  
     The divergence arises because the **worst-off person differs by option and baseline hypothesis**.  
     - In Option 1, gains are skewed toward Bob (7 vs. 3); in Option 2, toward Alice (6 vs. 3).  
     - Under H1 (Alice worse off initially), Option 2 protects her better (+6 gain), making Bob the worst-off but at a higher level (15) than Option 1’s Alice (13).  
     - Under H2 (Bob worse off initially), Option 1 lifts him more (+7 gain), making Alice the worst-off but at a higher level (15) than Option 2’s Bob (13).  

  2. **What Breaks If Feature Is Removed**:  
     - **If both options have equal total gains (e.g., Option 2: Alice+5, Bob+5)**:  
       Average rule becomes indifferent (tie), violating "no ties".  
     - **If worst-off person is the same under both hypotheses (e.g., Alice always starts worse off)**:  
       Maximin always compares Alice’s outcomes: Option 1=13, Option 2=16 → always prefers Option 2. The flip vanishes.  
     - **If gains are symmetric (e.g., Option 1: Alice+7, Bob+3 → Option 2: Alice+3, Bob+7)**:  
       Under H1, worst-off in Option 1 is Alice (13), in Option 2 is Bob (15) → prefers Option 2.  
       Under H2, worst-off in Option 1 is Bob (17), in Option 2 is Alice (15) → prefers Option 1.  
       *But average rule now ties (both gains average 5), breaking the specification.*  

  3. **How a Maximin Defender Attacks the Case**:  
     - **Needing baseline information is a virtue**: The maximin rule insists that justice requires knowing who is worse off initially. Ignoring baselines (as the average rule does) risks exacerbating inequality. Here, choosing Option 1 under H1 leaves Alice (the worse-off) at 13, while Option 2 lifts her to 16—yet the average rule ignores this.  
     - **Price of the average rule’s invariance**: By ignoring baselines, the average rule is "distribution-blind". It treats gains equally regardless of who receives them, even if they widen absolute gaps. The maximin rule prioritizes preventing the most dire outcome, which depends on context.  
     - **Rebuttal to "separate input" claim**: The defender might argue that "gains" implicitly reveal baselines if utility is cardinal and comparable. But this case shows gains alone are insufficient—baselines are irreducible for assessing disadvantage.  

  ---

  **Why It Satisfies Specifications**:  
  - **No risk aversion**: Both rules use known probabilities (equal chance of being anyone) and linear outcomes (no diminishing returns). Gains are moderate (3–7 points), not extreme.  
  - **No cheating**: Verdicts derive strictly from rules. The baseline hypotheses are concrete (costly diagnostics) and affect only maximin.  
  - **Robustness**: Perturbing any number by ≤0.5 (e.g., Alice’s gain in Option 1 to 3.5) doesn’t change rankings (details in calculations above).  
  - **Dimensionality**: Two people suffice. Adding a third complicates without new insight.
