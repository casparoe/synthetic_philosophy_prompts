  **Why the speaker thought it true**: She referred to the fictional construct in player lore or identified generative figures as "the Silent King."  
  **What was conveyed**: A truth within the player community's narrative, but Russell would reject this as non-referential.  

  ### **Utterance 5: "The woman who carried the lantern across the Ash Wastes is standing in front of you."**  
  **Context**: The original body (which performed the action) is inert; the active body is a copy.  
  **Verdict**: **False**.  
  **Logical form**:  
  - Unambiguous.  
  - Russellian form: ∃x (x carried the lantern across the Ash Wastes ∧ ∀y (y carried the lantern across the Ash Wastes → y=x) ∧ x is standing in front of you)  
    *In English*: "There is exactly one woman who carried the lantern, and she is standing in front of you."  
  **Why the speaker thought it true**: She equated the copy (with memories) with the original actor, appealing to psychological continuity.  
