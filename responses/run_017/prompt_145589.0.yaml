  - "The F is G" becomes: ∃x (F(x) ∧ ∀y (F(y) → y=x) ∧ G(x))

  That is: There is an x such that x is F, and for all y if y is F then y is identical to x, and x is G.

  If there is no such unique F, then the statement is false.

