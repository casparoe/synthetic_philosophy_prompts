    *In English*: "There is exactly one current Warden of the North Gate, and that individual is corrupt."  
  **Why the speaker thought it true**: She conflated the abstract office (or past Wardens) with a current holder. Gossip implies ongoing corruption, but the description requires a present referent.  
  **What was conveyed**: Criticism of the office or its history, but the literal statement fails due to vacancy.  

  ### **Utterance 4: "The Silent King is cruel."**  
  **Context**: No encoded entity; only player lore, pilgrimage, and generative figures.  
  **Verdict**: **False**.  
  **Logical form**:  
