  ### Diagnosis: Step (4) is the Culprit

  **Why Step (4) Looks Safe but Fails**:  
  Step (4) claims that no measurement (report, neural, or behavioral) can settle the timing of experience because all such measurements either (a) involve displaceable reports or (b) merely identify "candidate vehicles" without confirming when experience occurs. This seems compelling because your pilot data show that *reports* of temporal properties are malleable. However, it conflates **epistemic access** with **ontological reality**. Neural measurements (e.g., EEG, fMRI) do not merely track "vehicles" or dispositions; they capture real-time physical processes that *constitute* the neural basis of temporal experience. If a neural event (e.g., a specific evoked potential) reliably correlates with the *onset* of a reported experience across conditions, its timing is fixed—even if subsequent reports are displaced. The Orwellian/Stalinesque dilemma applies to *subjective recall*, not to the neural instantiation itself. Step (4) erroneously assumes that because reports are revisable, the underlying neural timing must be indeterminate. But your own effects require deterministic neural timing to *produce* displacement (e.g., the mask’s interference must occur at a specific latency).  

  **Why Alternatives Fail**:  
  - **Rejecting (1)**: Costs are prohibitive. (1) is a defensible verificationist principle: without potential discriminability, differences lack empirical content. Abandoning it guts psychophysics, making experience untestable.  
  - **Restricting (3)**: Your effects *do* generalize beyond phi, but even if limited to "reconstructive" experiences (e.g., apparent motion), this avoids collapse only by ad hoc stipulation. It leaves (2) intact for other cases and fails to explain why *some* experiences evade displacement.  
  - **Denying (6)**: Denying that experiences occur over intervals dissolves their ontology. If experiences aren’t temporal, they aren’t the events we study—rendering your paradigm incoherent.  

  **Your Proposed Escape Route**:  
  You suggest trading temporal indeterminacy for content indeterminacy (e.g., the experience is located determinately, but its color-change point is fuzzy). This *does not* avoid collapse:  
  - If the content is indeterminate, step (2) still applies—Orwellian/Stalinesque hypotheses can be constructed for *when* the content became indeterminate.  
  - Step (6) requires experiences to have temporal location. If timing is determinate but content isn’t, step (5) still denies facts about *changes* in content (e.g., "when did the color shift?"). Iterating through (7), the experience’s very existence (as a state with *any* content) remains threatened.  

  **Thin vs. Thick "Experience"**:  
  The argument *does* equivocate:  
  - Step (2) uses a "thin" sense: experience as whatever is reported. Orwellian/Stalinesque are trivially indistinguishable here.  
  - Step (6) uses a "thick" sense: experience as an occurrent state with intrinsic temporal structure.  
  The argument needs both: (2) exploits the thin sense to claim observational equivalence, while (6) uses the thick sense to demand temporal location. If you consistently use the thick sense, step (2) is false—neural data *can* discriminate timing. If you use the thin sense, step (6) is false—reports needn’t reflect occurrent states. Collapse requires switching between them.  

  ### Practical Implications  

  **Redesigning the Study**:  
  No experiment can resolve the *metaphysical* timing question (per step 4’s fallacy), but your paradigm *can* establish how post-stimulus events bias temporal reconstruction. Focus on:  
  - Quantifying the limits of displacement (e.g., maximal mask delays that still shift reports).  
  - Linking neural correlates (e.g., ERP components) to report dynamics.  
  The question survives as: "How do later inputs alter the *reconstruction* of temporal experience?"—not "What is the ‘true’ timing?"  

  **Preregistration Paragraph**:  
  "This continuous-tracking paradigm probes how post-event stimulation influences the reported temporal profile of apparent motion. It establishes that the *reported* timing of features (e.g., color change) is systematically displaced by subsequent masks, scales with retro-probe reliance, and vanishes without post-stimulation. It does not—and cannot—determine the ‘veridical’ timing of conscious experience, as reports reflect reconstructive processes. Instead, it quantifies how post-perceptual inputs modulate the accessibility and narrative coherence of temporal experiences."  

  **Verdict**: Reject step (4). Neural measurements are not hostage to report displacement; they constrain the timing of the processes enabling experience. Your pilot effects reveal reconstruction, not ontological indeterminacy.
