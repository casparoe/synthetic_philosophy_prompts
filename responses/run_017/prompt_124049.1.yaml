  Node 1: [Abstract] Is an act corrupt only if it violates a legal rule? (A. Yes, it must be illegal; B. No, it can be corrupt even if legal)

  This separates legalists early.

  - A (Yes): Legalist leaf.

  - B (No): Then proceed.

