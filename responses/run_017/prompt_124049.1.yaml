answer: |-
  Below is a diagnostic instrument designed as a standalone handout for your seminar. It is a decision tree with 12 nodes (10 from your provided cases and 2 added cases to fill gaps). The tree uses concrete cases and plainly worded claims to guide users through their judgments without revealing the underlying accounts of corruption. Labels for accounts (e.g., "legalist" or "principal-agent") appear only at the leaves (end points) of the tree. The branching is based on the logical space of possible answers, emphasizing distinctions a well-read non-specialist can reconstruct from memory (e.g., wrong vs. no wrong, locus of the wrong, role of norms). 

  The added cases (nodes 9–10) address under-sampled areas: 
  - **Node 9** covers embezzlement-like scenarios where public resources are misused without explicit illegality. 
  - **Node 10** explores influence without payment, testing whether personal connections alone constitute corruption.  
  These additions ensure coverage of resource misuse and non-monetary influence, which were missing from your initial list. The tree also includes a node (Node 7) addressing whether local norms can be unreliable due to adaptation to endemic extraction.

  The instrument is structured as follows:
  - **Nodes 1–4 (early)**: Settle whether there is a wrong at all and its locus (e.g., rule, consequence, relationship, or character).
  - **Nodes 5–8 (middle)**: Settle the nature of the wrong (e.g., betrayed principal, distorted allocation, subverted office, or violated norm).
  - **Nodes 9–12 (late)**: Settle the operative standard (e.g., internal/external to the polity, role of intention/foresight).
  - **Leaves**: 11 accounts of corruption, each with a summary sentence noting its awkward commitment, answer pattern, and a case where it yields an absurd result.
  - **Unoccupied combinations**: Two coherent-seeming answer patterns with no defenders.
  - **Unseparated pairs**: Three leaf pairs the tree cannot fully distinguish, with a coinciding case and an extra question for separation.
  - **Scoring note**: Guidance on interpreting results, including handling inconsistencies.

  ---

  ### **Diagnostic Instrument: Decision Tree for Corruption Judgments**

  **Instructions:**  
  Answer each question based on your intuitive judgment of the concrete case or claim. Do not overthink—go with your initial reaction. Choose one option per node. Your answers will sort you into an account of corruption at the end (the "leaf"), revealing your tacit view. No prior knowledge of corruption theory is needed.

  ---

  #### **Node 1: Concrete Case – Village Elder's Goat**  
  *A village elder presents a goat to a district officer in a region where refusing a gift is a grave insult. The officer accepts, and no favor is requested or given.*  
  **Is this corrupt?**  
  - A. Yes  
  - B. No  

  *(Branching: A → Node 2; B → Node 3)*

  #### **Node 2: Concrete Case – NGO Zero-Gifts Policy**  
  *An international NGO requires local partners to refuse all gifts, including customary hospitality from village hosts, to prevent corruption.*  
  **Is this policy justified?**  
  - A. Yes, because accepting any gift risks corruption.  
  - B. No, because refusing customary gifts is culturally harmful and unrelated to corruption.  
  - C. It depends on whether local norms see gifts as corrupt.  

  *(Branching: A → Node 4; B → Node 5; C → Node 6)*

  #### **Node 3: Concrete Case – Hiring the Best-Qualified Cousin**  
  *A public manager hires her cousin, who is the best-qualified applicant, and would have hired him anyway.*  
  **Is this corrupt?**  
  - A. Yes  
  - B. No  

  *(Branching: A → Node 7; B → Node 8)*

  #### **Node 4: Abstract Claim – Locus of Wrong**  
  **When is an act corrupt?**  
  - A. When it violates a formal rule (e.g., law or procedure).  
  - B. When it harms the public interest or fairness.  
  - C. When it damages trust or relationships.  

  *(Branching: A → Node 9; B → Node 10; C → Node 11)*

  #### **Node 5: Concrete Case – Speed Money**  
  *A firm pays a clerk to process a permit it is legally owed, within the statutory deadline, when clerks routinely delay by months otherwise.*  
  **Is this payment corrupt?**  
  - A. Yes  
  - B. No  

  *(Branching: A → Node 12; B → Node 13)*  
  *Note: Node 13 is a leaf (see key).*

  #### **Node 6: Abstract Claim – Reliability of Local Norms**  
  **Can a population’s norms be an unreliable standard for corruption if those norms have adapted to long-standing extraction (e.g., accepting bribes as normal)?**  
  - A. Yes, norms can be distorted and should not always define corruption.  
  - B. No, local norms are the ultimate standard; what they accept isn’t corrupt.  

  *(Branching: A → Node 14; B → Node 15)*  
  *Note: This addresses endemic norm adaptation. Branching for A/B continues to late nodes.*

  #### **Node 7: Concrete Case – Mayor's Ethnic Solidarity**  
  *A mayor awards contracts preferentially to firms that hire from her own ethnic community, understanding herself to be discharging obligations of solidarity (not enriching herself).*  
  **Is this corrupt?**  
  - A. Yes  
  - B. No  

  *(Branching: A → Node 16; B → Node 17)*

  #### **Node 8: Concrete Case – Data Philanthropy**  
  *A company donates a proprietary dataset to a city that ranks contract applicants with a machine-learning system; the donation foreseeably improves the donor's ranking, but it is not conditional on any decision.*  
  **Is this donation corrupt?**  
  - A. Yes  
  - B. No  

  *(Branching: A → Node 18; B → Node 19)*

  #### **Node 9: Added Case – Misuse of Public Resources**  
  *A city councilor uses a city-owned car for personal vacations, which is technically allowed under vague rules but wastes public funds.*  
  **Is this corrupt?**  
  - A. Yes  
  - B. No  

  *(Branching: A → Node 20; B → Node 21)*

  #### **Node 10: Added Case – Influence Without Payment**  
  *A retired general uses personal contacts (no payment) to get a friend’s son into a prestigious university.*  
  **Is this corrupt?**  
  - A. Yes  
  - B. No  

  *(Branching: A → Node 22; B → Node 23)*

  #### **Node 11: Abstract Claim – Role of Intention**  
  **Can an act be corrupt if the actor did not intend personal gain?**  
  - A. Yes, corruption can occur without intent.  
  - B. No, intent for gain is essential.  

  *(Branching: A → Node 24; B → Node 25)*

  #### **Node 12: Abstract Claim – Universal vs. Local Standards**  
  **Should corruption be defined by a universal standard, or does it depend on local context?**  
  - A. Universal: Corruption is wrong everywhere if it causes harm.  
  - B. Local: What is corrupt varies by norms and institutions.  

  *(Branching: A → Leaf U; B → Leaf V)*  
  *Note: This is a late node on internal/external standards.*

  ---

  ### **Key to Leaves (Accounts of Corruption)**  
  *Each leaf is defined by a unique answer pattern. The summary includes: (1) the account's core idea, (2) its most awkward commitment, (3) the answer pattern leading here (abbreviated for space), and (4) the case where this account yields an absurd result (from your list). Standard labels are included for reference but are not needed to use the tree.*

  1. **Legalist Position**: Corruption is a violation of legal rules.  
     - *Awkward commitment*: Allows harmful acts if legal (e.g., exploitative lobbying).  
     - *Answer pattern*: Node 4A (violates rule) + Node 1B (goat not corrupt if legal) + ...  
     - *Absurd case*: Data Philanthropy (Node 8—not corrupt if legal, even if it distorts fairness).  

  2. **Principal-Agent Position** (e.g., Klitgaard's "monopoly + discretion - accountability"): Corruption occurs when agents betray principals for private gain.  
     - *Awkward commitment*: Ignores acts without a clear principal-agent relationship (e.g., gifts with no favor).  
     - *Answer pattern*: Node 4C (damages trust) + Node 11B (requires intent) + Node 7A (mayor corrupt) + ...  
     - *Absurd case*: Village Elder's Goat (Node 1—not corrupt, as no betrayal or gain).  

  3. **Public-Office-Centered Position**: Corruption is using public office for private gain, deviating from official duties.  
     - *Awkward commitment*: Struggles with "gain" that isn't material (e.g., ethnic solidarity).  
     - *Answer pattern*: Node 4A/B (rule/harm) + Node 9A (misuse corrupt) + Node 3A (cousin corrupt) + ...  
     - *Absurd case*: Data Philanthropy (Node 8—not corrupt if no public office involved).  

  4. **Market-Centered Position**: Corruption is the use of non-market means (e.g., bribes, connections) to distort allocation.  
     - *Awkward commitment*: Treats all non-market allocation as suspect, even in non-market contexts.  
     - *Answer pattern*: Node 4B (harms fairness) + Node 5A (speed money corrupt) + Node 10A (influence corrupt) + ...  
     - *Absurd case*: Village Elder's Goat (Node 1—not corrupt if seen as part of gift economy).  

  5. **Public-Interest-Centered Position**: Corruption is whatever harms the collective good or public welfare.  
     - *Awkward commitment*: Vague definition of "public interest" can justify overreach.  
     - *Answer pattern*: Node 4B (harms public interest) + Node 2C (depends on norms) + Node 8A (data philanthropy corrupt) + ...  
     - *Absurd case*: Speed Money (Node 5—not corrupt if it speeds up service, benefiting public).  

  6. **Harm-Based Universalist Position** (e.g., Transparency International): Corruption is acts causing measurable harm (e.g., inequality, inefficiency), universally defined.  
     - *Awkward commitment*: Labels benign local practices as corrupt due to potential harm.  
     - *Answer pattern*: Node 12A (universal) + Node 6A (norms unreliable) + Node 5A (speed money corrupt) + ...  
     - *Absurd case*: Village Elder's Goat (Node 1—corrupt if seen as harmful, ignoring context).  

  7. **Social-Norms/Perceptual Position** (e.g., "black-grey-white" grading): Corruption is what the local public perceives as corrupt.  
     - *Awkward commitment*: Legitimizes harmful practices if accepted locally.  
     - *Answer pattern*: Node 6B (norms reliable) + Node 2C (depends on norms) + Node 1B (goat not corrupt) + ...  
     - *Absurd case*: Mayor's Ethnic Solidarity (Node 7—not corrupt if community approves).  

  8. **Particularist/Gift-Economy Position**: Reciprocity and patronage are moral obligations, not corruption.  
     - *Awkward commitment*: Defends practices causing inequality as "cultural."  
     - *Answer pattern*: Node 1B (goat not corrupt) + Node 3B (cousin not corrupt) + Node 7B (mayor not corrupt) + ...  
     - *Absurd case*: NGO Zero-Gifts Policy (Node 2—corrupt to refuse gifts, harming social bonds).  

  9. **Neo-Patrimonial Position**: Clientelism (e.g., ethnic solidarity) is a distinct governance system, so calling it "corruption" is a category error.  
     - *Awkward commitment*: Fails to critique oppressive systems.  
     - *Answer pattern*: Node 1B (goat not corrupt) + Node 7B (mayor not corrupt) + Node 12B (local standard) + ...  
     - *Absurd case*: Hiring Cousin (Node 3—corrupt if seen as deviation, but neo-patrimonialism rejects the frame).  

  10. **Republican Position**: Corruption subverts the independence of public agents or subjects decisions to external wills.  
      - *Awkward commitment*: Overemphasizes individual virtue, ignoring structural factors.  
      - *Answer pattern*: Node 4C (damages relationships) + Node 11B (requires intent) + Node 10A (influence corrupt) + ...  
      - *Absurd case*: Lawful Lobbying (your case 5—corrupt if it "corrupts" autonomy, though lawful).  

  11. **Structural/Collective-Action Position**: Corruption is an equilibrium of perverse incentives; blaming individuals is misguided.  
      - *Awkward commitment*: Excuses individual wrongdoing as "systemic."  
      - *Answer pattern*: Node 5B (speed money not corrupt) + Node 9B (misuse not corrupt if systemic) + Node 6A (norms unreliable) + ...  
      - *Absurd case*: Triage Nurse (your case 6—not corrupt if "everyone does it," ignoring harm).  

  ---

  ### **Unoccupied Combinations**  
  Two coherent-looking answer patterns have no known defenders. Neither is incoherent, but both are unattractive due to internal tensions:  
  1. **"Harm without wrong"**: Node 1A (goat corrupt) + Node 5B (speed money not corrupt) + Node 4B (harm-based wrong) + Node 6B (norms reliable).  
     - *Why empty?* Claims harm is the core wrong but ignores harm in speed money (e.g., if it improves efficiency). Unattractive because it inconsistently applies the harm criterion.  
  2. **"Universalist particularism"**: Node 12B (local standard) + Node 6A (norms unreliable) + Node 2A (NGO policy justified).  
     - *Why empty?* Demands universal rules (zero-gifts) while insisting on local standards. Unattractive because it rejects cultural sensitivity in one node while advocating it in another.  

  ---

  ### **Unseparated Pairs**  
  The tree cannot fully distinguish these leaf pairs due to overlapping judgments on key cases. An extra question would separate them, but it may be unanswerable without theory:  
  1. **Public-Office-Centered vs. Principal-Agent**: Coincide on Mayor's Ethnic Solidarity (Node 7—both call it corrupt).  
     - *Extra question*: "Must corruption involve a *public* office, or can it occur in private organizations?" (Public-office says yes; principal-agent says no.)  
  2. **Harm-Based Universalist vs. Public-Interest-Centered**: Coincide on Data Philanthropy (Node 8—both call it corrupt if harmful).  
     - *Extra question*: "Is harm defined by measurable outcomes (e.g., GDP loss) or a broader conception of the public good?" (Harm-based uses metrics; public-interest is more holistic.)  
  3. **Structural vs. Neo-Patrimonial**: Coincide on Speed Money (Node 5—both may say not corrupt: structural due to equilibrium, neo-patrimonial due to alternative systems).  
     - *Extra question*: "Is clientelism a *corrupt* deviation or a *legitimate* alternative to bureaucracy?" (Structural sees it as a deviation; neo-patrimonial rejects the frame.)  

  ---

  ### **Scoring Note**  
  **Return a profile, not one leaf.** Users often have inconsistent judgments across cases (e.g., due to differing contexts), so the tree should output all leaves their answers touch, highlighting where paths diverge. This reveals hybrid views or tensions in their thinking.  

  **Inconsistencies are coherent in some cases:**  
  - It is logically consistent to hold a *universalist* verdict on lobbying (your case 5—corrupt due to harm) and the mayor (Node 7—corrupt due to distorted allocation) while holding a *particularist* verdict on the goat (Node 1—not corrupt due to norms) and NGO hospitality (Node 2—not corrupt). This reflects a view that "public" acts (lobbying, contracts) require universal standards, while "private" acts (gifts, hospitality) are context-dependent. However, inconsistency arises if users also endorse Node 6A (norms are unreliable), which undermines particularism. The tree flags this by routing to multiple leaves.  

  **Where to expect inconsistency:**  
  - Between early nodes (e.g., Node 1 goat vs. Node 3 cousin) if users inconsistently apply norms.  
  - Between abstract and concrete nodes (e.g., Node 4 rule-based vs. Node 5 speed money) if users prioritize outcomes over principles.  

  This instrument is optimized for classroom use: it avoids jargon, uses memorable cases, and stimulates debate by exposing tensions. For a seminar, have students compare profiles and debate the unoccupied/unseparated elements.
