  Node 7: [Case: NGO zero-gifts] Is the NGO's policy of refusing customary hospitality appropriate? (Options: A. Yes, it prevents corruption, B. No, it is culturally insensitive and not corrupt to accept)

  This tests the universality of anti-gift norms.

  Now we need nodes that are more abstract to get at the underlying principles.

  Node 8: [Abstract] When does an act become corrupt? (Options: A. When it violates a legal rule, B. When it causes harm to the public interest, C. When it violates a social norm of the society in which it occurs)

  This gets at the locus of the wrong.

  Node 9: [Abstract] Is it possible for a population to have social norms about gifts and favors that are themselves corrupt? (Options: A. Yes, because norms can be distorted by long-standing practices of extraction, B. No, because the local norms define what is acceptable)

  This addresses the reliability of norms.

  Node 10: [Abstract] What is the core wrong of corruption? (Options: A. The betrayal of a principal by an agent, B. The distortion of fair competition or allocation, C. The degradation of the public character of an office)

  This gets at the nature of the wrong.

  Node 11: [Abstract] Can an act be corrupt if the agent did not intend to gain personally? (Options: A. Yes, B. No)

  This tests the role of intention.

  Node 12: [Abstract] Should the definition of corruption be the same across all countries and cultures? (Options: A. Yes, because corruption is a universal harm, B. No, because what is corrupt depends on local norms and institutions)

  This tests universalism vs. particularism.

  We have 12 nodes. We can adjust as needed.

  Step 3: Build the tree.

  We must ensure that the tree leads to the desired leaves. We'll sketch the branches.

  But note: the tree must be built from the logical space, so we'll design the branching to separate the positions.

  We'll start with the case-based nodes to get concrete judgments, then use abstract nodes to tease apart the reasons.

  Step 4: Define the leaves and the path to each.

  We'll assign the positions to paths. Each leaf is defined by a unique combination of answers.

  We must cover the 11 positions. Some may share paths until the last splits.

  List of positions and their key features:

  1. Legalist: corruption is violation of the law. Awkward: if the law allows harmful practices or prohibits harmless ones. Absurd case: data philanthropy (if legal) not corrupt even if it distorts.

  2. Principal-agent: corruption when agent betrays principal for private gain. Formula: monopoly + discretion - accountability. Awkward: if the agent is not acting for private gain (e.g., ethnic solidarity). Absurd case: the goat gift (no betrayal, no gain).

  3. Public-office-centered: corruption is deviation from the duties of public office for private gain. Awkward: when the office itself is structured for private gain (e.g., historical sale of offices). Absurd case: data philanthropy (no public office involved?).

  4. Market-centered: corruption is the use of non-market means to allocate resources. Awkward: when markets are not the appropriate allocator (e.g., in a gift economy). Absurd case: the village goat (if seen as part of a non-market system).

  5. Public-interest-centered: corruption is when an act harms the public interest. Awkward: defining the public interest. Absurd case: speed money (might be in public interest to get permits moving).

  6. Harm-based universalist: corruption causes measurable harm (e.g., economic distortion, inequality). Used by NGOs. Awkward: when harm is hard to measure or diffuse. Absurd case: the goat gift (no harm).

  7. Social-norms or perceptual: corruption is what the public perceives as corrupt. Black-grey-white by public regard. Awkward: when the public is tolerant of harmful practices. Absurd case: the mayor's ethnic hiring if the community approves.

  8. Particularist or gift-economy: reciprocity and patronage are obligations, not deviance. Awkward: when these practices cause harm. Absurd case: the NGO zero-gifts policy (if refusing gifts is seen as corrupting social bonds).

  9. Neo-patrimonial: clientelism is a different order, so applying corruption is a category error. Awkward: in modern states where bureaucratic norms are expected. Absurd case: the mayor's ethnic hiring (not corrupt, just how the system works).

  10. Republican: corruption subjects public decisions to another's will or corrupts the agent's independence. Awkward: when the agent's independence is not valued. Absurd case: lobbying (if seen as legitimate influence).

  11. Structural or collective-action: corruption is an equilibrium, individual blame misplaced. Awkward: how to assign responsibility. Absurd case: the nurse taking a gift (if everyone does it, it's the system).

  Now, we design the tree to sort into these.

  Step 5: Sketch the tree.

  We have 12 nodes. We'll define the order and branching.

  Start with Node 1: Goat case - Is there corruption? (Yes/No)

  - If No: then we are on a path that may lead to particularist, neo-patrimonial, or structural, or perhaps legalist if it's legal.

  - If Yes: then we are on a path that sees a wrong even without favor.

  Then Node 2: Speed money - Is it corrupt? (Yes/No)

