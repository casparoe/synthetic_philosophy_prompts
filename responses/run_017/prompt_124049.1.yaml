  - Early nodes: settle whether there is a wrong at all and the locus (rule, consequence, relationship, agent's character).
  - Middle nodes: focus on the nature of the wrong (betrayed principal, distorted allocation, subverted office, violated norm).
  - Later nodes: address the standard (internal/external to the polity) and requirements (intention, reciprocity, foresight).

