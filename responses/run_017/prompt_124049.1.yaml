  We start with the most fundamental split: is there a wrong at all? Then move to locus, then to nature, then to standards.

  Proposed node sequence:

  Node 1: [Case: Village elder and goat] In this situation, is there any corruption? (Options: A. Yes, B. No)

  Why this first? It tests whether the mere acceptance of a gift in a context with no favor and social obligation is seen as corrupt. This will split between those who think corruption requires a quid pro quo or harm and those who think the act itself is wrong (e.g., because it violates a rule or the purity of office).

  Node 2: [Case: Speed money] In this situation, is the payment by the firm to the clerk corrupt? (Options: A. Yes, B. No)

  This tests whether a payment to get what you are legally owed, in a context of delay, is corrupt. Some will say it's necessary to overcome inefficiency, others that it's bribery.

  Node 3: [Case: Nurse and fruit basket] In this situation, is the nurse's action corrupt? (Options: A. Yes, B. No)

  This tests a small gift to jump a queue. It might be seen as minor or as a slippery slope.

  Node 4: [Case: Hiring cousin] In this situation, is the manager's hiring decision corrupt? (Options: A. Yes, B. No)

  This tests nepotism even when the relative is the best qualified.

