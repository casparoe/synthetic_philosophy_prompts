  For part (b), the student argues divided sainthood works because the saint chooses it and others enjoy non-moral goods. But Wolf’s worry is deeper: the saint’s life is impoverished regardless of choice. Even if voluntary, such a life lacks meaning beyond morality. Plus, the community might become complacent, relying on the saint instead of cultivating their own moral sensitivity. The student doesn’t address these points.

