  First, I need to recall Keynes's key distinctions: probability as logical weight of evidence, versus frequencies, versus betting dispositions. For Keynes, a true probability must reflect the logical support evidence provides to a hypothesis. The oracle completely decouples the number from evidence or reasoning - it's pure pattern recognition from past data. 

  The calibration record is impressive but philosophically hollow for Keynes. It's like having a perfectly accurate thermometer that no one understands - useful pragmatically but not "probable" in his technical sense. This clashes with how oceanography uses ensemble spreads as de facto probabilities.

