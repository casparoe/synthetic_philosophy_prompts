prompt: |-
  I'm putting together a short position paper for a reading group I run with some people from the policy school — mostly economists, who keep asking me to "write down my axioms" before they'll engage at all — and in doing it I noticed my longtermist committments are probably less tidy than the way I present them in seminars. So here they are, roughly in the order I came to them:

  (1) Strong longtermism: in expectation, the best things I can do with my time and money are the ones that make the very long-run future go better, and that stays true even when they're clearly worse for identifiable people alive now. (2) No discounting for distance: I don't discount future well-being because it's far off in time, and I don't discount the well-being of people whose existence depends on what I do — "merely possible" people — relative to people who'll exist either way. (3) Anti-fanaticism: I don't think you should maximize expected value when that means letting yourself be pushed around by tiny probabilities of astronomically large payoffs; I'm drawn to something like a probability threshold or a bounded/tempered value function, and my refusal to pay Pascal's mugger is one of the intuitions I trust most. (4) Lock-in over survival: I think the biggest determinant of how good the long run is will be which values and institutions get locked in — whatever gets built into the systems that persist — rather than whether we or our descendants survive at all, and I'm skeptical of the framing that puts existential-risk reduction at the top of the list by default. I also accept the "hinge of history" thought, that we're at a moment of unusual leverage, which is part of why (4) matters. (5) Moral uncertainty: the right response to disagreement between moral theories is to hedge — give the theories something like votes in a parliament — rather than acting on whichever one I find most plausible. (6) Near-term work: I'm happy to support global-health-type stuff, but I've been arguing it should be funded for its flow-through effects on the long run (relationships, institutions, information, whatever) and not for its direct benefits, which I take to be negligible by comparison.

  What I want is an audit, not a lecture: which of these actually pull against each other, which only look like they do, and — ranked by severity — what the cheapest fix is for each real tension, plus which single revision would clean up the most. Please be opinionated: take a definite position on what has to go and why, don't just lay out the options for me to choose between, and mark clearly where you think you're on firm ground versus where a reasonable person could go the other way. For what it's worth, I'm mildly worried about two pairs — whether (3) quietly guts (1), and whether (5) quietly guts (1) and (2) — but I honestly don't know if those are the load-bearing problems or if I'm worried about the wrong thing, so don't take my anxieties as a map of where the trouble is.
reasoning: |-
  Okay, the user is part of a reading group with economists who want them to formalize their axioms. They've listed six longtermist commitments and want an audit for internal tensions. Let me start by understanding each point.

  First, strong longtermism (1) prioritizes the long-run future over current people. Then (2) rejects discounting for time or mere possibility. Anti-fanaticism (3) avoids tiny probabilities of huge payoffs. Lock-in over survival (4) focuses on values and institutions rather than just survival. Moral uncertainty (5) suggests hedging between theories. Near-term work (6) supports global health for its long-term effects.

  The user is worried that (3) and (5) might undermine (1). I need to check if that's true. For (3), if they reject Pascal's mugging, does that conflict with maximizing expected value in longtermism? Yes, because some longtermist interventions rely on low-probability, high-impact scenarios. Anti-fanaticism could limit those, potentially weakening (1).

  Moral uncertainty (5) is another issue. Hedging might mean allocating resources to non-longtermist causes, which conflicts with (1)'s claim that longtermism is always best. Also, if different moral theories discount future generations, that could clash with (2).

  Lock-in (4) vs. survival: If lock-in matters more than survival, but survival is necessary for lock-in, there's tension. Maybe they need to prioritize avoiding value lock-in risks, not just extinction.

  Near-term work (6) seems consistent if it's justified by long-term effects. But if direct benefits are negligible, economists might question the efficiency.

  The user might have deeper needs: convincing skeptical economists, so coherence is key. They might also want to avoid fanaticism without abandoning longtermism. Possible solutions: refine anti-fanaticism with domain restrictions or bounded utility. For moral uncertainty, specify that longtermist theories dominate the parliament. For lock-in, clarify that lock-in risks are part of extinction prevention. Addressing these tensions head-on will strengthen their position.
answer: |-
  Here's a direct, opinionated audit of your position, ranking tensions by severity and proposing concrete fixes. I'll mark where my stance is firm (🔒) vs. debatable (💬). Your worries about (3)/(5) vs. (1) are well-placed—they *are* the core tensions.

  ### **Ranked Tensions & Fixes**
  1.  **(5) Moral Uncertainty DIRECTLY UNDERMINES (1) & (2)**  
      **Severity:** Critical 🔒  
      **Conflict:** If you give moral theories "votes in a parliament," theories that reject strong longtermism (e.g., near-term-focused utilitarianism, person-affecting views) or endorse discounting will demand resources. Allocating *any* significant resources to near-term causes (beyond their long-term instrumental value) violates (1)'s claim that longtermist actions are *always* best in expectation. (2) is also compromised if theories discounting future people get votes.  
      **Cheapest Fix:** **Restrict the "parliament" to longtermist-compatible theories.** Only theories accepting (1) and (2) get seats. Justification: (5) is about uncertainty *within* your longtermist framework, not about whether longtermism is correct.  
      **Why This Must Change:** Without this, (5) makes your position incoherent—you're formally endorsing actions you believe are suboptimal by your own lights. Economists will shred this.

  2.  **(3) Anti-Fanaticism SIGNIFICANTLY WEAKENS (1)**  
      **Severity:** High 🔒  
      **Conflict:** (1) demands optimizing for the *very long run*, where astronomical stakes are common. (3) explicitly rejects maximizing expected value when tiny probabilities dominate. Many high-leverage longtermist interventions (e.g., certain x-risk reductions) *rely* on low-probability/high-impact scenarios. Your refusal to be "pushed around" by tiny probabilities forces you to ignore actions that could be optimal under (1).  
      **Cheapest Fix:** **Adopt a bounded/tempered value function (not a threshold) *only* for comparing different longtermist interventions.** Keep fanaticism for comparisons between longtermist and near-termist actions. Justification: Your anti-Pascal intuition likely applies to *types* of payoffs (e.g., infinite utility), not the core logic of longtermist x-risk work. Bounded utility lets you retain (1)'s primacy while avoiding literal muggers.  
      **Why This Matters:** Untempered, (3) makes (1) rhetorically hollow. This fix preserves the spirit of both.

  3.  **(4) Lock-in Over Survival CREATES A STRUCTURAL TENSION WITH (1)**  
      **Severity:** Moderate 💬  
      **Conflict:** If lock-in matters more than survival, you *must* prioritize preventing *bad* lock-ins (e.g., permanent totalitarianism) over ensuring *any* survival. But (1) requires maximizing expected value—and extinction is value-*minimizing* (0 future value). If a bad lock-in has even 50% probability, and extinction 1%, (1) may demand focusing on extinction risk unless the bad lock-in is >100x worse. Your "hinge of history" point intensifies this: leverage cuts both ways.  
      **Cheapest Fix:** **Reframe (4) as "Lock-in *is the primary survival issue*."** Argue that extinction risk is often downstream of value-lock-in dynamics (e.g., unaligned AI locks in anti-human values). Thus, working on lock-in *is* working on survival.  
      **Why It's Debatable:** Some x-risks (e.g., asteroid impacts) may not involve lock-in. If you genuinely think lock-in matters *more*, you need to bite the bullet and accept that under (1), preventing certain bad lock-ins might outweigh preventing some extinction scenarios.

  4.  **(6) Near-Term Work vs. (1) "NEGLIGIBLE" CLAIM**  
      **Severity:** Low 💬  
      **Conflict:** Calling direct benefits of global health "negligible" is empirically shaky and rhetorically risky. If saving 10,000 lives now has even 0.001% chance of altering long-term trajectories (via institutional/relationship effects), it *could* be instrumentally valuable under (1). But labeling it "negligible" invites accusations of callousness and undermines your instrumental case.  
      **Cheapest Fix:** **Drop "negligible."** Justify near-term work *solely* on its long-term instrumental effects *without* disparaging direct impact. Say: "While direct benefits are real, their *comparative* impact is vastly outweighed by flow-through effects on the long-term future under (1)."  
      **Why Fixable:** This is mostly presentational. Economists respect comparative advantage; just show the math.

  ### **The Single Revision That Cleans Up the Most**
  **Restrict Moral Uncertainty (5) to Longtermist-Compatible Theories.**  
  This resolves the *critical* conflict with (1) and (2), avoids wasting resources on non-longtermist goals, and strengthens your coherence. Pair this with bounding fanaticism *within* longtermism (Fix #2 for Tension 2), and you’ve secured 80% of your position’s integrity.

  ### **Where You’re Strong**
  - **(1) + (2)** are internally consistent and defensible if protected from (5) and tempered by (3).  
  - **(3)** is wise pragmatism—don’t abandon it, just bound its scope.  
  - **(4)** is provocative but valuable; reframing it as the *mechanism* of survival makes it synergistic.  
  - **(6)** is strategically sound *if* you drop "negligible."

  ### Final Note for Economists
  Your axioms are now:  
  1. **Maximize expected very long-term value** (constrained by bounded utility for extreme fanaticism *within* longtermism).  
  2. **Zero discounting** for time or population status.  
  3. **Lock-in dynamics** as the primary lever for long-term value.  
  4. **Moral hedging** only among theories accepting Axioms 1-3.  

  This is rigorous, avoids fatal contradictions, and forces engagement. Good luck—they’ll still hate (2).
