prompt: |-
  Hey — I mod a pretty large online community (forum plus a Discord, ~40k members, rationalist/EA-ish core with a big general-interest tail), and the mod team is six volunteers doing this in our spare time. Two or three times a month someone does something and a chunk of the community demands we sanction them: ban them, delete or lock their posts, pull their invite to an in-person meetup, put a visible note on their profile, or publicly confirm or deny an accusation. Right now each of these turns into a 300-comment thread and we decide by vibes, so we've definately been inconsistent and everyone can tell.

  What I want is a decision procedure, not more framings. Take whatever the philosophy of punishment actually has to say — retributive vs. deterrence vs. communicative/expressive vs. restorative accounts, proportionality, the line between punishing someone and merely declining to associate with them or protecting the group, whether the punisher needs standing and on whose behalf they're acting, whether reasons and a chance to respond are owed, whether a sanction can be undone — and turn it into something six tired volunteers can actually run in an evening on a real case, in about an hour of discussion, and write up afterwards as a short public note. Constraints: no lawyer, no investigator, usually only what the parties tell us; majority of the six signs off; we post the anonymized reasoning publicly because transparency is the whole reason anyone trusts us.

  A few things I keep half-remembering from blogs that I think have to be built in, and please tell me if I've got them wrong:

  - The ratchet: a sanction that's formally temporary is functionally permanent, because search engines, archives and screenshots don't decay. Whatever we do, its real severity is set by an audience of strangers we didn't choose, not by the community we were talking to. So "a two-week ban" and "a permanent mark on this person's search results" may be the same action and we should have to say which one we're doing.
  - Related: the severity we intend and the severity that gets delivered come apart, and we don't control the translation. One member's mild rebuke is another audience's career-ender. I want a step where we say who the addressee of the sanction is supposed to be, and what happens if we can't keep it to them.
  - There is no sanction budget. Nobody is tracking or able to track the total amount of sanction a person is receiving across venues, so "proportionate to the act" is not the same as "proportionate to what this person will actually experience." Sometimes the right move is to sanction less than the act deserves; sometimes doing nothing is the pile-on.
  - The abstraction test: rewrite the offense description with no proper names, no ideological markers and no in-group/out-group markers, re-run the procedure on the rewrite, then re-run it with a randomly chosen member in the role. If the verdicts differ, something other than the act is doing the work.

  The procedure needs: the questions in order; what counts as a sufficient answer to each; where it stops with a no; and where it hands the decision to a person because it's a values question rather than a factual one (I think one of those is whether we're a private club we may exclude people from for any reason or none, versus something closer to infrastructure people depend on for professional and social goods — that one we should vote on once and then it changes everything downstream, so flag it).

  Cases it has to handle without falling over:
  1. A long-time, well-liked contributor who was repeatedly rude and dismissive to a newcomer, never broke a written rule, and the newcomer quietly left.
  2. An allegation about something serious that happened off-platform, years ago, entirely legal, which we can't verify because the evidence is a private conversation and the complainant won't consent to sharing it — and the member's real name is on their account.
  3. Someone another community already sanctioned hard for the same conduct, where people want us to either pile on or publicly affirm that sanction.

  Then: run the procedure on all three, and make at least one of them come out somewhere the team will hate — we have to publicly decline to sanction someone most of us think is a jerk, or we have to sanction a popular contributor, or we have to say something that will read as taking a side. Tell us which one that is and how to defend it in the public note. Finally, be honest about what the procedure can't do: which kinds of case it will systematically misfire on, and which of the hard questions it just relocates rather than answers.
reasoning: |-
  Okay, the user runs a large online community with 40k members, centered around rationalist and EA principles but with a broad audience. They're struggling with moderation decisions that turn into lengthy, inconsistent debates. They want a structured decision procedure based on philosophical principles of punishment, tailored for practicality. Let me unpack their needs.

  First, the core issues: inconsistent rulings, time constraints, transparency needs. The mod team has six volunteers handling cases in their spare time. Each case becomes a 300-comment thread, leading to decisions by "vibes," which causes distrust. They need a clear, step-by-step process that can be executed in about an hour and documented publicly.

  The user mentioned specific concepts like the ratchet effect (temporary sanctions having permanent consequences), severity disconnect (intent vs. perception), no sanction budget (inability to track cumulative impacts), and the abstraction test (removing biases). These must be integrated into the procedure.

  Key constraints: no legal resources, reliance on available information, majority vote required. Public anonymized notes are crucial for trust. The procedure must handle three test cases, including one with an unpopular outcome to demonstrate impartiality. Also, it should acknowledge limitations—what it can't fix or just relocates.

  Deeper needs: The user likely wants to reduce internal conflict, ensure fairness, maintain community trust, and prevent burnout. They might also be concerned about legal risks, especially with real names involved. Unspoken needs could include preserving the community's culture while scaling, handling off-platform issues sensitively, and avoiding public relations disasters.

  For the philosophical framework, I need to blend retributive, deterrence, communicative, and restorative approaches. The procedure should ask: What's the harm? Who's affected? What's the goal? This helps determine proportionality and standing.

  The abstraction test is vital for bias reduction. Removing names and ideologies ensures decisions are based on actions, not identities. The ratchet effect means any sanction must be considered permanent due to digital permanence. Severity assessment must account for how different audiences might perceive it.

  The "no sanction budget" point means mods should consider external consequences. Sometimes less action is better to avoid piling on. The platform's nature—private club vs. infrastructure—affects decisions. Voting on this upfront is essential as it sets the tone for handling exclusions.

  For the test cases:
  1. The popular member being rude to a newcomer: Here, the procedure should result in a restorative action, like a private apology, avoiding public sanctions that could escalate disproportionately. The abstraction test might show bias toward the established member.
  2. Off-platform allegation: Without verifiable evidence, the mods likely can't act, but must address community concerns through a transparency note. This highlights the limitation in verifying off-platform events.
  3. External sanction: The procedure should avoid piling on unless there's a direct threat to the community. The decision might be unpopular if they decline to sanction someone already punished elsewhere.

  The procedure must force an unpopular outcome in one case, like not sanctioning in case 2 or 3, requiring a transparent explanation about jurisdiction and fairness.

  Limitations: The procedure can't handle unverifiable off-platform events well, relies on self-reports, and may not satisfy those seeking retribution. It also can't resolve value conflicts about the community's purpose, just makes them explicit.

  Overall, the goal is a clear, step-by-step flowchart that's practical, transparent, and philosophically grounded, addressing both stated and unspoken needs for consistency, fairness, and sustainability.
answer: |-
  Here's a decision procedure ("The Lens Protocol") designed for your constraints, incorporating philosophical principles of punishment and your key insights. It's structured as a flowchart with 7 core questions, designed to be completed in <60 minutes by your team. I'll walk through the framework, apply it to your cases, identify the "hated" outcome, and outline limitations.

  ---

  ### **The Lens Protocol: Decision Procedure**
  **Goal:** Determine if a sanction is justified *and* proportional, given platform limitations and values.  
  **Inputs:** Accusation, available evidence (typically user statements/screenshots), community context.  
  **Output:** Sanction decision + public rationale note.  
  **Process:** Moderators vote "Yes/No/Abstain" at each step. Proceeds only if majority "Yes". Stops at first "No".  
  **Public Note Template:** "We considered [act]. We decided [sanction] because [key rationale from steps]. We considered but rejected [alternative paths not taken]."

  ---

  #### **STEP 0: PRE-COMMITMENT (One-Time Vote)**  
  *"Is this community a (A) Private Club (exclude for any/no reason) or (B) Public Infrastructure (exclude only to protect core function/participants)?"*  
  - **Sufficient Answer:** Team vote (4/6 majority). Record result permanently.  
  - **Downstream Impact:**  
    - *A (Club):* Steps 1/2 become optional; easier exclusion.  
    - *B (Infrastructure):* Steps 1-5 mandatory; higher bar for sanction.  
    *(Assume "B" for case examples below)*  

  #### **STEP 1: HARM ASSESSMENT**  
  *"Did the act (a) violate a written rule, (b) create tangible harm (e.g., user exit, threat to safety), or (c) severely degrade community function?"*  
  - **Sufficient Answer:** Evidence of (a), (b), or (c). If no → **STOP: No sanction.**  
  - **Philosophy:** Establishes *standing* (harm to community justifies intervention). Rejects punishment for vague "offensiveness."  

  #### **STEP 2: ABSTRATION TEST**  
  *Rewrite act generically (e.g., "Established user was dismissive to new user"). Would we sanction if:  
  (a) Roles reversed?  
  (b) Actor was unpopular?  
  (c) Act came from an ideological opponent?*  
  - **Sufficient Answer:** Unanimous "Yes" to all. If no → **STOP: No sanction (bias detected).**  
  - **Philosophy:** Filters tribal/status-based enforcement. Forces focus on acts, not actors.

  #### **STEP 3: GOAL CLARIFICATION**  
  *"What is the primary purpose of a sanction here? (Choose one):  
  - **Deterrence** (prevent repeat)  
  - **Protection** (remove immediate threat)  
  - **Restoration** (repair harm)  
  - **Expression** (state community values)"*  
  - **Sufficient Answer:** Majority agrees on *one* primary goal. *Must* be chosen.  
  - **Philosophy:** Punishment type must match intent. Retribution is rejected (no moral authority).  

  #### **STEP 4: SEVERITY & AUDIENCE**  
  *"What is the MAXIMUM sanction severity we can impose without external amplification (e.g., a 1-week ban)? Now, given the Ratchet Effect:  
  - Is the actor's real identity/livelihood at risk?  
  - Will this sanction likely be amplified by outsiders (e.g., Twitter mobs)?  
  - **Final Adjusted Severity:** If amplification risk is high, downgrade severity by 1-2 levels (e.g., permanent ban → 3-month ban)."*  
  - **Sufficient Answer:** Specify: (a) Base severity, (b) Amplification risk (High/Med/Low), (c) Adjusted sanction.  
  - **Philosophy:** Acknowledges "no sanction budget." Avoids pile-ons; protects against disproportionate real-world harm.  

  #### **STEP 5: PROPORTIONALITY CHECK**  
  *"Does the adjusted sanction:  
  (a) Fit the harm (Step 1)?  
  (b) Minimize restriction (Step 4)?  
  (c) Align with the goal (Step 3)?"*  
  - **Sufficient Answer:** Majority "Yes" to all. If no → **Loop back to Step 4** (adjust severity).  
  - **Philosophy:** Proportionality balances act, goal, and collateral damage.  

  #### **STEP 6: DUE PROCESS**  
  *"Have we:  
  (a) Notified the accused?  
  (b) Allowed a response (48hr min)?  
  (c) Shared evidence with them?"*  
  - **Sufficient Answer:** (a) & (b) mandatory. (c) required if evidence exists.  
  - **Exception:** Immediate threats (skip for safety; rare).  
  - **Philosophy:** Fairness requires voice. Rejects trial-by-mob.  

  #### **STEP 7: SANCTION SELECTION**  
  *Choose LEAST severe option that satisfies Step 3 goal:*  
  - **Restoration:** Private apology, mediated dialogue.  
  - **Deterrence:** Temporary ban, post removal.  
  - **Protection:** Ban, meetup exclusion.  
  - **Expression:** *Public* note (only if goal is expression!).  
  - **NO:** Permanent marks, profile notes (violates Ratchet principle).  
  - **Final Vote:** Majority selects sanction.  

  ---

  ### **Application to Your Cases**  
  *(Using "Public Infrastructure" mode)*  

  **Case 1: Rude Established Member**  
  - **Step 1:** Harm? Yes (user exit).  
  - **Step 2:** Abstraction? Sanction if roles reversed? *Yes* (dismissiveness harms function).  
  - **Step 3:** Goal? **Restoration** (repair trust, not punish).  
  - **Step 4:** Severity? Low base (no ban). Amplification risk? Low (internal issue). Adjusted: Private action.  
  - **Step 5:** Proportional? Yes.  
  - **Step 6:** Notify accused? Yes.  
  - **Step 7:** Sanction? **Mediated apology to newcomer + mod coaching.**  
  - **Unpopular Aspect:** No public shaming. Defended: "Our goal was restoration, not retribution. Public sanctions would cause disproportionate harm for a correctable pattern."  

  **Case 2: Off-Platform Allegation**  
  - **Step 1:** Harm? Unclear. No on-platform violation. → **STOP: No sanction.**  
  - **Rationale:** No standing to punish off-platform acts without clear threat to community.  
  - **Public Note:** "We lack jurisdiction and verification capacity. We encourage affected parties to seek appropriate channels."  
  - **Unpopular Aspect:** Appears to "ignore" serious accusation. Defended: "We cannot adjudicate unverified off-platform behavior without risking grave injustice. Our role is platform governance."  

  **Case 3: Already-Sanctioned Member**  
  - **Step 1:** Harm? Only if *current* threat exists (e.g., recruiting harassers). If no → **STOP.**  
  - **Step 4:** **Critical:** If external sanction was severe, amplification risk is **HIGH**. Downgrade to minimal action (e.g., monitor).  
  - **Sanction?** Likely **none** unless direct threat.  
  - **Unpopular Aspect:** Refusing to "pile on." Defended: "Double jeopardy violates proportionality. Our sanctions exist to protect *this* community, not perform solidarity."  

  ---

  ### **Where the Procedure "Misfires" & Limitations**  
  1. **Verification Impossible:** Fails on unprovable off-platform acts (Case 2). Solution: Transparency about jurisdiction.  
  2. **Restoration Unwanted:** If victim refuses engagement (Case 1), restoration fails. Falls back to deterrence.  
  3. **Values Conflicts:** Doesn’t resolve *what* constitutes "harm" (Step 1). Relies on mod judgment.  
  4. **Chronic Low-Level Harm:** Struggles with patterns (e.g., "always rude but never banned"). Solution: Track patterns formally.  
  5. **Expression Dilemma:** Publicly "stating values" often escalates conflict. Use only for egregious, clear-cut violations.  

  **Core Relocated Questions:**  
  - *"What is harm?"* → Left to Step 1 (subjective but filtered by Abstraction Test).  
  - *"Private vs. Infrastructure?"* → Decided upfront but requires revisiting if community evolves.  
  - *"Can sanctions be undone?"* → Assumes permanence due to Ratchet Effect; design for reversibility (e.g., bans expire automatically).  

  ---

  **Why This Works for You:**  
  - **Time:** Forces focus (rejects 300-comment debates). Steps 1-2 kill weak cases fast.  
  - **Consistency:** Abstraction Test + Severity Adjustment standardizes outcomes.  
  - **Transparency:** Public note maps directly to steps.  
  - **Philosophy Grounded:** Rejects retribution; bundles deterrence/protection/restoration; bakes in Ratchet/Abstraction.  

  **Final Tip:** Run past cases through this *before* implementing. Calibrate severity levels (Step 4) as a team.
