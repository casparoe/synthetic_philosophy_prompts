answer: |-
  ## Fellowship Application: Research Proposal (Two-Page Excerpt)

  **Research Question:**  
  *Does the evidential reason for cooperation in large worlds persist when correlation stems solely from common causal origin (e.g., shared training data or institutional history) without indexical uncertainty, or does it collapse upon conditioning on the shared cause, compared to the indexical uncertainty mechanism?*

  **Background & Gap:**  
  The evidential argument for cooperation in large worlds demonstrates how, under indexical uncertainty ("I don't know *which* similar agent I am"), an agent using Evidential Decision Theory (EDT) rationally cooperates in one-shot dilemmas. My action provides evidence about the *type* of agent I am, and thus the actions of *all* similar agents, potentially swamping the causal cost of cooperation. Causal Decision Theorists (CDT) counter that this correlation provides no *causal leverage* and cooperation is irrational absent direct causation. However, **both sides implicitly assume the indexical uncertainty mechanism generates the correlation.**  

  This overlooks a distinct mechanism: **common causal origin without indexical uncertainty.** Consider two AI models trained on identical datasets or two humans shaped by the same rigorous institution. They know their distinct identities ("I am Model A", "I am Agent 7"). Their dispositions are correlated purely due to their shared causal history, not because they are uncertain about *which* instance they are. Standard large-world cooperation arguments do not analyze this case. Crucially, I hypothesize a fundamental difference (**The "Learning Eats Cooperation" Hypothesis**):  

  1.  **Indexical Mechanism:** Conditioning on self-knowledge *is* the source of the evidential link. Knowing "I am the type that cooperates" provides evidence about others *because* I don't know my index. There's no deeper "shared cause" to condition on that screens off my action from others' actions.
  2.  **Common-Origin Mechanism:** Conditioning on the *shared cause itself* (e.g., "I know the exact training dataset") potentially *screens off* the correlation between my action and others' actions. Knowing the cause makes my action evidentially irrelevant to predicting others, collapsing the EDT reason for cooperation. Increased self-knowledge (learning more about the shared cause) erodes the cooperation incentive.

  Existing positions leave this open: EDT optimism relies on the indexical mechanism, while CDT skepticism doesn't distinguish mechanisms. Neither addresses whether cooperation incentives fundamentally differ based on the *source* of correlation. This project isolates the correlation mechanism as the critical variable.

  **Methodology (12-Month Plan):**  
  My approach combines precise formal modeling with comparative analysis, avoiding the limitations of alternatives:

  *   **Why not just formalize one toy model?** A single model cannot answer the *comparative* question about mechanisms. We need controlled comparison.
  *   **Why not rehash EDT vs CDT?** The core debate ignores the mechanism distinction. This project identifies a *new dimension* within the EDT framework itself.
  *   **Why not test real AI models?** Empirical tests are premature without theoretical clarity on *how* the mechanisms differ. Formal results will guide future empirical work.

  **Month-by-Month Plan:**

  1.  **Months 1-2: Mechanism Formalization:** Define two minimal, parallel decision problems:
      *   *Model Indexical:* Standard large-world PD with N agents, indexical uncertainty over identity.
      *   *Model Common-Origin:* Two distinct agents (A & B). Common cause (C) determines both agents' dispositions stochastically (e.g., C is a dataset, A & B are models trained on C). Agents know their identities (A knows it's A) but only have probabilistic knowledge of C and its influence.
  2.  **Months 3-4: Core EDT Analysis:** Apply EDT rigorously to both models. Calculate expected utility for cooperation/defection in each scenario, explicitly tracking the evidential link and its source. Formalize the "screening off" hypothesis for Common-Origin: Does P(B's Action | A's Action, C) = P(B's Action | C)?
  3.  **Month 5: Comparative Results:** Synthesize findings. Does cooperation remain rational for the Common-Origin agent under EDT? Does the strength/robustness of the cooperation incentive differ significantly between models? Does conditioning on C (or knowledge of C) indeed collapse the evidential link in Common-Origin but not in Indexical?
  4.  **Months 6-7: Robustness Checks - Knowledge & Uncertainty:** Vary agents' knowledge of C and its influence function in the Common-Origin model. What if they know C precisely? What if knowledge is highly uncertain? How does this impact the evidential link and cooperation incentive? Compare to how varying indexical uncertainty impacts the Indexical model.
  5.  **Month 8: Robustness Checks - Problem Structure:** Test if results hold for variations beyond pure PD (e.g., asymmetric payoffs, public goods games, multiple actions). Does the mechanism distinction generalize?
  6.  **Month 9: Explore CDT & Hybrids:** Analyze both models under CDT as a baseline. Briefly explore if hybrid theories (e.g., FDT) handle the mechanisms differently.
  7.  **Months 10-11: Synthesis & Implications:** Integrate results. Formally characterize the conditions under which the "Learning Eats Cooperation" effect holds or fails. Develop conceptual implications: Does large-world EDT cooperation *require* indexical uncertainty? How does agency and self-knowledge interact differently in the two mechanisms? What does this say about cooperation between "siblings" (common-origin) vs "copies" (indexical)?
  8.  **Month 12: Write-up & Dissemination:** Finalize paper draft for top philosophy/decision theory journal (e.g., *Phil. & Phen. Research*, *Phil. Studies*) and prepare conference presentations (e.g., PSA, SPP).

  **Possible Conclusions & Discriminators:**

  1.  **Hypothesis Confirmed:** Common-Origin correlation collapses under conditioning on C; cooperation incentive is fragile and eroded by self-knowledge. Indexical correlation is robust. *Decider:* Formal proof of screening off in Common-Origin and its absence in Indexical; stark difference in cooperation stability under increasing knowledge.
  2.  **Hypothesis Rejected - Equivalence:** Both mechanisms yield equivalent EDT cooperation incentives and robustness. *Decider:* Formal equivalence proof showing knowledge of C *doesn't* screen off in Common-Origin, or indexical uncertainty *is* functionally equivalent to conditioning on a hidden common cause.
  3.  **Hypothesis Inverted:** Common-Origin correlation is *more* robust because real agents can never fully condition on high-dimensional C (e.g., a vast training set). Indexical uncertainty might be *less* robust under certain learning scenarios. *Decider:* Analysis showing practical inability to condition on complex C preserves the evidential link more effectively than indexical uncertainty under learning.
  4.  **Mechanism Matters, But Nuanced:** Cooperation persists in both, but the *nature* of the evidential reason differs fundamentally (e.g., one is "self-referential," the other "causal-history-referential"), impacting dynamics under learning or strategic responses. *Decider:* Formal characterization of distinct evidential pathways and their differential sensitivities.

  **Failure Condition & Scaling Risks:**  
  The most likely failure is discovering that the formalized "Common-Origin" model inevitably smuggles in indexical uncertainty upon close inspection, collapsing the intended distinction. Alternatively, the analysis might reveal the cooperation incentive difference is negligible or dependent on arbitrary modeling choices, making the conclusion less significant.  

  The project risks scaling beyond a year if:  
  1.   Formalizing "knowledge of high-dimensional C" proves deeply complex, requiring extensive work in bounded rationality or learning theory (Months 6-7).  
  2.   Exploring a wider range of game structures reveals unforeseen complexities needing significant additional modeling (Month 8).  
  3.   The implications for agency and self-knowledge (Month 11) open large philosophical questions about personal identity that are hard to contain.  

  **Conclusion:**  
  This project breaks new ground by isolating the *source* of correlation – indexical uncertainty vs. common causal origin – as a critical, neglected variable in large-world cooperation arguments. By rigorously comparing these mechanisms within the EDT framework, it directly tests the novel "Learning Eats Cooperation" hypothesis. The results will refine our understanding of when and why evidential agents cooperate, clarify the role of self-knowledge and common origins, and provide a crucial foundation for analyzing cooperation between modern AI systems or within structured human institutions. This targeted, mechanistic approach offers a decisive advance over rehashing general EDT/CDT debates or pursuing premature empirical tests.
