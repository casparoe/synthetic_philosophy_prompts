prompt: |-
  I've been sitting on the internal review board for ML stuff at my company for a couple of years — I'm an engineer, not a philosopher, though I read a bit of this on the side — and I keep noticing a shape in the work that I don't have a word for, and I'd like to know whether it's a thing that has one.

  Here's the shape. We put an enormous amount of effort into making sure a system doesn't fail in the ways that show up in a screenshot, or in a headline, or on a form a regulator already has. And we put very little into failures that are slow, or boring, or that happen to people who don't write in. Nobody decides this. There's no meeting where someone says let's protect the loud cases. It just happens, because that's where the review time goes, because that's what's testable, because that's what we have words for. Two instances. A friend at a hospital system described a triage model with a dozen checks for disparity across a handful of named categories and nothing at all for whether it quietly routes people who write in a non-native register of English into worse pathways — even though, as he put it, everyone knows it does and it isn't hard to measure. And in my own work: we have a rich vocabulary for some harms — bias, privacy, toxicity — and basically none for others, for being condescending to a user, for making someone's day administrtively harder, for a kind of faint contempt that no one could ever quote back. The named harms get audited for. The nameless ones never make it into anyone's spreadsheet, so as far as the process is concerned they don't occur.

  So the shape is: the ethical profile of the finished system ends up being a map of where the attention was, not of where the harm was. What I can't get straight is whether that's a defect, because every individual choice inside it was reasonable, and nobody gamed anything. It isn't Goodhart's law or teaching to the test: there's no target being exploited, no one trying to look good on a metric, and the metrics we do have are honest — it's just that some metrics exist and others don't. Someone said ethics washing, but that seems to need a PR motive and a bit of bad faith, and here everyone is being conscientious and thorough; it's the distribution of the conscientiousness that's crooked. The streetlight thing is closer, but as I've seen it used that's about a person failing to notice something that was there to be noticed, whereas this is about building something that takes the shape of the light. There's also that crumple-zone phrase I've come across for how blame lands on the human operator instead of the system, but that's about blame afterwards, not care beforehand.

  Does this have a name, and if not, can you carve it rather than just label it? I want what exactly the phenomenon is, what has to be true for it to be present, what it isn't, and where its edges are — I won't be satisfied with a bare term, and I don't want a reading list either. Some edges I keep chewing on: if the scrutiny happened to line up perfectly with the stakes the shape would be fine, so the badness must live in the mismatch, which makes me wonder whether the system's wrongness is only borrowed from the wrongness of where attention goes, and whether a second-hand wrong is still a wrong of the system. If a team deliberately allocated effort by stakes and ignored the loudest complaints, is that obligatory or just paternalistic? And is failing to mitigate a harm nobody has a word for yet a different failing from failing to mitigate one you could name?

  Oh, and please write it as continuous prose — no headings, no bullet points, no bold, no tables. Like an email.
reasoning: |-
  Okay, the user is describing a recurring pattern they've observed in ML ethics reviews where systems end up being optimized for visible, measurable, and regulatorily significant harms, while subtle, systemic, or hard-to-quantify harms get neglected. They're an engineer who's been on an internal review board for years and has noticed this structural issue. They want to know if there's a name for this phenomenon or, if not, a clear conceptual breakdown.

  The core problem seems to be that ethical safeguards end up mapping to available metrics and existing regulatory frameworks rather than actual harm landscapes. The user gives two concrete examples: a hospital triage model that checks for named bias categories but ignores linguistic discrimination, and their own work where "named harms" like bias get audited while unnamed ones like condescension fall through the cracks.

  The user has clearly thought deeply about this. They've already eliminated several related concepts: it's not Goodhart's law (no metric exploitation), not ethics washing (no bad faith), not the streetlight effect (not about visibility but about systemic shaping), and not crumple zones (which are about blame assignment post-failure). They're frustrated with superficial answers - they explicitly reject bare terms and reading lists, wanting rigorous conceptual carving instead.

  Key philosophical edges they're wrestling with:
  - Whether the "wrongness" is inherent or derivative (if attention allocation is flawed, does that make the system's ethics flawed by proxy?)
  - The normative question: if a team intentionally prioritized obscure harms over loud complaints, would that be ethical obligation or paternalism?
  - The epistemic dimension: is failing to address unnamed harms fundamentally different from neglecting known ones?

  The user's framing suggests they might be looking for something between structural injustice theory (how systems bake in invisible biases) and measurement theory (how quantifiability shapes reality), but with a very practical, engineering-oriented lens. Their rejection of bullet points and academic formatting hints they want this grounded in real-world practice - likely because they need to explain it to colleagues.

  This needs to avoid jargon while preserving precision. The phenomenon isn't just about unmeasured variables - it's about how the measurable variables actively distort the ethical architecture. The hospital example is particularly telling: "everyone knows" about the linguistic bias, yet it remains unaddressed because it falls outside standardized categories. That points to a failure of ethical imagination institutionalized into systems.
answer: |-
  What you're describing isn't just a quirk of your process; it's a fundamental, emergent property of how complex systems interact with bounded human cognition and institutional structures. It doesn't have a single, universally recognized name, but its anatomy is distinct and can be precisely carved. Let's call it **Ethical Topology** for now, understanding that the term itself is less important than the structure it denotes.

  Ethical Topology occurs when the *distribution of ethical scrutiny* imposed on a system during its development and governance becomes the primary *shaping force* of its actual ethical outcomes, rather than the underlying distribution of potential or actual harm. The harm landscape exists independently, but the intervention landscape – the map of audits, tests, mitigations, and review criteria – conforms not to the terrain of harm itself, but to the contours of what is readily visible, measurable, categorizable, legally mandated, or socially resonant. The resulting system isn't maliciously designed to be unethical in specific ways; its ethical profile is a fossil record of the pressures applied during its formation. The "crooked distribution of conscientiousness" you note is the mechanism: conscientious effort is poured into defined channels, leaving other areas dry not through neglect of duty, but because those areas lack the features that activate institutional attention.

  For Ethical Topology to be present, several conditions must hold. First, there must be a system capable of causing diverse harms, some of which are inherently harder to perceive, quantify, or categorize than others – harms that are diffuse, slow-acting, affecting marginalized or voiceless groups, or residing in qualitative experiences like condescension or administrative friction. Second, the governance process (like your review board) must rely on structured methods: predefined metrics, test cases, regulatory checklists, or complaint-driven feedback loops. Third, there must be bounded resources – time, expertise, computational power, political capital – forcing prioritization. Crucially, the prioritization isn't driven by conscious malice or explicit gaming ("ethics washing"), but by the *affordances* of the governance tools themselves. What fits neatly into a spreadsheet cell, a fairness metric, a regulator's form, or a screenshot-worthy failure gets the scrutiny. What doesn't – like the non-native register bias everyone "knows" about but lacks a standard test for, or the corrosive drip of contempt – remains outside the structured intervention. The harm isn't invisible per se; the *pathway for institutional action* toward it is underdeveloped or nonexistent.

  It is distinct from several neighbors. Unlike Goodhart's Law, there's no single metric being corrupted; the system isn't *gaming* the checks, it's *molded* by the *absence* of checks for certain harms. Unlike the Streetlight Effect, it's not about searchers looking where the light is *convenient*; it's about the *infrastructure of scrutiny* (the light poles themselves) being erected only where the ground is already firm and mapped, leaving other terrain in darkness by design omission, not search error. Unlike Crumple Zones, it's about the *upstream allocation of preventative care*, not the *downstream deflection of blame*.

  The "wrongness" of a system shaped by Ethical Topology is complex. The mismatch between the intervention map and the harm map *is* the core defect, even if every individual decision within the process was reasonable. The system's ethical failing is not necessarily inherent in its algorithms *in isolation*, but in the *process that shaped its exposure to ethical constraint*. It's a second-order wrong: the wrong of allowing the *method* of ethics assurance to dictate which ethics are assured. A system can be "locally optimized" at each review checkpoint yet "globally unethical" in its overall impact profile. Whether this borrowed wrongness makes the *system* itself wrong depends on the duty of care: if the builders have a responsibility to seek out and mitigate harms beyond the easily audited, then yes, the system embodies a failure of that duty, even if achieved through diligent application of incomplete tools.

  Your edge cases are sharp. If a team *deliberately* allocated effort strictly by estimated stakes, ignoring loud complaints for deeper, quieter harms, this moves beyond Ethical Topology into conscious ethical triage. Whether it's paternalistic or obligatory hinges on justification and authority. If the "stakes" assessment is rigorously grounded in minimizing aggregate harm and the team has legitimate mandate to make such judgments, it could be defensible (though risky). If it's based on untested assumptions or overrides legitimate user distress, it veers into paternalism. Failing to mitigate an unnamed harm is fundamentally different from failing a named one. The unnamed harm exists in an epistemic blind spot; the institutional machinery literally lacks the conceptual hooks to grasp it. Mitigating it requires *first* building the conceptual and instrumental tools – defining the harm, finding ways to measure it, establishing its legitimacy within the governance framework. This is a prior, meta-ethical failing: a failure of ethical imagination or institutional epistemology that prevents the harm from even entering the arena of consideration. Failing a named harm is a subsequent failure of execution within an existing framework.

  Ethical Topology, then, is the systematic deformation of a system's realized ethics by the selective pressures of its own governance apparatus. It happens when conscientious attention is channeled only through pre-existing institutional pathways, leaving vast tracts of potential harm untouched not through ill will, but because those pathways cannot reach them. The shape you see is the shadow cast by the scaffolding of your review process onto the ethical landscape it was meant to illuminate. Recognizing it is the first step towards designing governance that bends toward the harm, rather than letting the harm be defined by the governance.
