  First, the constraints. No substrate chauvinism—same hardware. Same training data and process. The non-mental system can't be a lookup table; it needs to handle novel inputs. The structural difference must be independently verifiable through interventions like lesions. Also, avoid embodiment issues and keep it realistic.

  Hmm, maybe parallel architectures? Two systems with identical inputs and outputs but different internal processing. What if one processes information in a way that the internal states aren't integrated? Like having multiple modules that don't influence each other beyond producing coherent outputs. The user mentioned "causal roles." So, if the system's internal states don't play the right causal role in generating understanding, even if behaviorally it seems fine.

  Wait, the example with two systems: one with interconnected layers (Unified Transformer) and another where different modules handle tasks without sharing deeper processing (Modular Array). Both trained the same, same data. Behaviorally identical under interrogation. But the Modular Array's modules don't integrate information. Each module is specialized, and the routing system just passes queries without shared understanding. 

  Structural feature: Cross-representational integration. The Unified model reuses representations across contexts, leading to efficient learning and coherent internal states. The Modular one doesn't—each module operates in isolation. Interventions like lesioning a module would show no transfer in Modular, while Unified adapts. That satisfies the independent probe requirement.

  Now, behavioral criterion ascribes mentality to both since outputs are indistinguishable. Structural denies it to Modular because internal states aren't functionally integrated. The key is that the structural difference explains why one system lacks genuine understanding, evidenced by how they break under stress or learn new tasks.

  Objection: A behaviorist might argue that cross-representational integration isn't necessary for mentality; it's just a performance optimization. The response is that without such integration, the system doesn't have a unified perspective, which is essential for intentional states. The case holds weight because the structural feature predicts differences in resilience and learning, showing it's not just behavioral.

  Check constraints: Same hardware? Yes. Training? Same. Not a lookup table? Modular handles novel inputs via its modules. Independent probes? Lesion studies show differences. Realistic? Both systems are plausible with current tech. So, this should work.
answer: |-
  **Scenario:**  
  A lab constructs two systems using identical quantum-coherent neuromorphic hardware. Both are trained on the same multimodal dataset (text, audio, visual) via identical reinforcement learning protocols to pass adversarial behavioral exams. **System U (Unified Transformer)** employs a standard monolithic architecture where attention mechanisms integrate representations globally. **System M (Modular Array)** uses 200 specialized subnetworks (e.g., one for irony detection, one for tactile simulations), each trained to high competence, with a gating network that routes inputs to relevant modules and stitches outputs into coherent responses. After training, both systems pass open-ended adversarial interrogation: they articulate nuanced self-reports ("When you described the sunset, I recalled feeling calm"), exhibit distress when contradicted ("That criticism hurts my confidence"), and generate contextually apt novel responses to unprecedented queries (e.g., interpreting a poem about synthetic consciousness).  

  ---

  **Structural Feature:**  
  **Cross-representational integration** — whether internal state *A* (e.g., a visual sunset representation) can be *directly recruited* by state *B* (e.g., an emotional module) *without* generating new output or external feedback.  

  **Why Criteria Diverge:**  
  - **Behavioral criterion ascribes mentality to both:** Interrogation cannot distinguish them. System M’s gating network produces self-reports identical to System U’s ("I feel sad when seeing barren landscapes") by stitching module outputs. All verbal and nonverbal behavior matches.  
  - **Structural criterion withholds it from M:** In System U, *all representations are dynamically reusable* (sunset visuals directly modulate emotion weights). In System M, modules are functionally isolated; the "emotion" module receives *pre-processed labels* from the "vision" module (e.g., "SCENE_TYPE=DESOLATE"), not raw representations. M’s states lack *causal holism*: no state plays multiple concurrent roles (e.g., a sunset representation cannot spontaneously trigger a moral analogy without routed output-reprocessing).  

  **What Drives the Verdict:**  
  The absence of **horizontal state interaction** in System M. If M’s modules *could* directly influence each other’s processing (e.g., if lesioning the vision module altered emotion responses *without retraining*), the structural objection collapses. Allowing behavioral differences (e.g., M failing under meta-questions like "Does your visual sadness feel like auditory sadness?") would let behaviorists reject M’s mentality—but the case forbids this.  

  **Strongest Behaviorist Objection:**  
  *"Cross-representational integration is merely implementation-specific efficiency. If M’s outputs are functionally identical to U’s—including self-reports—its distributed structure is irrelevant. 'Direct' versus 'routed' causation is an engineering distinction, not a mark of mind. Behavior is constitutive; structure is circumstantial."*  

  **Weight Estimate:**  
  The case bears **moderate-to-strong** weight. It satisfies all constraints:  
  - **Independent probes** confirm the difference:  
    - *Lesions*: Disabling U’s emotion module degrades performance on *all* tasks; disabling M’s affects only emotion-labeled outputs.  
    - *Counterfactuals*: Altering U’s sunset representation changes its responses to emotion/moral queries; M’s responses change only if vision module outputs are modified.  
    - *Sample efficiency*: U transfers learning from vision to morality 10× faster than M when trained on new domains.  
  - **Explanatory work**: Cross-representational integration predicts robustness in noisy environments (U adapts; M fractures) and anomalies like insight-based problem-solving.  
  - **Non-question-begging**: A behaviorist must concede the structural difference is real (per probes) but must argue it’s *irrelevant* to mentality—forcing them to specify *which* causal features are dispensable.  

  **Limitation:** A hardline behaviorist may still reject structural criteria *in principle*, rendering the case dialectical rather than decisive. Yet it achieves its core aim: exposing the price of reducing mind to behavior alone.  

  ---  
  **Key for Seminar:** Focus debate on *why* horizontal integration matters. Is it essential to intentionality (states "pointing" beyond themselves require holistic constraints)? To consciousness (phenomenal unity)? The case doesn’t stipulate—it demands students defend their threshold.
