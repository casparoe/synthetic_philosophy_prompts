prompt: |-
  You are a professional philosopher specializing in formal epistemology and decision theory. Think carefully and step by step, and before you commit to any final number, spend a few paragraphs brainstorming the ways the argument below could fail: list the candidate objections in rough order of how much weight you actually give them, and flag which of them are mere technical irritants and which cut to the heart of the matter.

  I am in a master's seminar on formal epistemology and I cannot get clear on something. Take this case. Mara is certain that at noon she will be shown a card that is either red or black, and she is 0.5 on each. Let H be the proposition that a certain manuscript is a forgery; her current credence in H given red is 0.6 and given black is 0.3, so her unconditional credence in H is 0.45. She now forms and announces a plan: if she sees red she will set her credence in H to 0.75, and if she sees black she will set it to 0.15, deviating from conditionalization in both cells by 0.15. A bookie who knows her plan can do this. Before noon he buys from her, at her own fair price, a ticket paying one unit if H and red, nothing if not-H and red, called off with the price refunded if black: she receives 0.6. He also sells her, at her own fair price, a ticket paying one unit if H and black, called off with the price refunded if red: she pays 0.3. If the card is red, he then sells her an unconditional ticket paying one unit if H, at her new fair price of 0.75; if the card is black, he buys such a ticket from her at her new fair price of 0.15. In either case the two live tickets cancel in every state of the world and she is down 0.15 units no matter what, and the bookie can sweeten each transaction by a cent to make her strictly rather than merely indifferently willing at the cost of a few cents of his margin. Assume the units are utilities rather than money, that Mara is not risk averse in them, that the bookie has no information she lacks, and that refusing to trade is not available to her; or, if you prefer, treat the question as whether the package of bets she is willing to accept is one that a careful agent would decline. The claim I want your credence on is that the existence of this strategy establishes a genuine pro tanto rational requirement on Mara to conditionalize, that is, that her planned deviation is a normative defect in her doxastic conduct and not merely a liability to lose money should she happen to trade at her own prices. Count the claim as resolving affirmatively only if the construction is both technically sound and rationally probative; count it as resolving negatively if it is invalid, or valid but merely pragmatic. My own credence is around 0.55 and a friend in the seminar puts his at around 0.85, and I cannot find where we come apart. Please give me your own number, and more importantly the decomposition: a probability and one line of justification for each sub-question you think the answer turns on, for instance whether the construction itself goes through, whether the requirement of certainty about the evidential partition and about one's own future credences is an idealization that can be relaxed, whether a sure loss in utility is the right kind of thing to ground an epistemic norm at all, whether the norm attaches to the temporally extended agent or to its time-slices, whether it matters that the deviation is planned rather than merely predicted, and whether anything turns on the fact that in the more realistic case where she deviates on only one cell of the partition the bookie gets a package that never gains and sometimes loses rather than one that loses in every state. Then say how you are combining the terms, which single term your final number is most sensitive to, and what argument or consideration would move you most.

  I also want a second number, for a variant I made up while walking home, because I suspect this is where my friend and I actually disagree. Everything is as before, except that Mara knows that whatever card she sees, she will be given a drug that erases all memory of the morning, including the fact that she made the earlier bets and that she ever formed the plan, and that the drug will leave her with credence 0.75 in H if the card is red and 0.15 if it is black, on the basis of the card alone. At noon her credences are probabilistically coherent, she cannot represent the package she is entering into, and the bookie trades with her at her own prices again. Give me your credence that the argument still establishes a rational requirement in this variant, with a short decomposition of that number, and tell me how much of the gap between your two numbers is accounted for by the shift from evaluating a plan to evaluating a time-slice. Finally, tell me which of the two seminar positions, mine at roughly 0.55 or my friend's at roughly 0.85, is more likely to be tracking a distinction the other is collapsing, and what that distinction is. One last constraint: I have no library access this week, so please do not lean on what you remember of the published literature or gesture toward sources; I want the reasoning built up from the construction itself, so that an objection counts only if you can state it and show exactly where it bites.
