  We are evaluating two main claims: 
   1. The original scenario (without memory erasure) establishes a genuine pro tanto rational requirement to conditionalize.
   2. The variant scenario (with memory erasure) establishes the same.

  Before giving numbers, I will brainstorm objections to the original argument. The argument is that Mara's planned deviation from conditionalization makes her vulnerable to a Dutch book that takes advantage of her announced plan and her future credences. The bookie arranges a series of bets that result in a sure loss of 0.15 units (plus a sweetener) in every possible state.

  **Candidate Objections (in rough order of weight, heaviest first):**

  1. **The requirement of certainty about the future evidence and one's own future credences is too strong and cannot be relaxed without undermining the argument. (Cuts to the heart)**
     - In real life, agents are rarely certain about the exact partition of evidence they will receive, and even less certain about their own future credences. The argument assumes that Mara is certain about the card being red or black and about her own planned future credences. If we relax this, the bookie cannot set up the bets in advance with such precision. Moreover, if Mara is not certain about her own future credences, she might not agree to the initial bets because they depend on her future actions.

  2. **The argument conflates pragmatic and epistemic rationality. (Cuts to the heart)**
     - The Dutch book argument shows that deviating from conditionalization leads to a sure loss in utility. But is this a reason to think that conditionalization is epistemically rational? Epistemic rationality is about having credences that align with the evidence. The loss here is purely monetary (or in utility). It might be that conditionalization is only a requirement of pragmatic rationality (to avoid sure losses) and not of epistemic rationality. This is a classic objection to Dutch book arguments.

  3. **The argument evaluates the plan, but the norm should attach to the time-slices. (Cuts to the heart)**
     - The argument targets Mara's plan to have non-conditionalizing future credences. But at each time, her credences are coherent. The initial bets are fair by her current credences, and the later bets are fair by her future credences. The loss arises only when we consider the entire temporal sequence. If we think that rationality is synchronic (applying only at a time) and not diachronic, then there is no violation at any single time. The diachronic Dutch book might not establish a diachronic norm.

  4. **The deviation being planned rather than merely predicted is crucial, but the argument does not adequately distinguish between the two. (Cuts to the heart)**
     - The bookie relies on Mara announcing her plan. If she merely predicts that she will have certain credences but does not commit to them, then she might change her mind without violating any norm. The argument assumes that the plan is fixed and that she will follow through. But is it irrational to change one's mind? The argument might show that having a fixed plan to deviate is bad, but it doesn't show that conditionalization is a general requirement.

  5. **The sure loss is not inevitable if Mara refuses to trade at the future time. (Technical irritant)**
     - The argument assumes that Mara is forced to trade at her fair prices. But if she can refuse to trade at the future time, she might avoid the loss. However, the problem states that refusing to trade is not available. Alternatively, we can interpret the scenario as one where the agent is committed to trading at her fair prices. But in reality, an agent might not be so committed. This is a technical irritant because we can stipulate the scenario to force trading.

  6. **The construction does not generalize to cases where the deviation occurs in only one cell. (Technical irritant)**
     - In the original, she deviates in both cells. But what if she only deviates in one? Then the bookie might get a package that never gains and sometimes loses (a weak Dutch book) but not a sure loss in every state. Some might argue that a weak Dutch book is less compelling. However, the standard view is that even a weak Dutch book is problematic because it represents a risk of loss without any chance of gain. But the original argument uses a strong Dutch book (loss in every state). If we require a strong Dutch book, then the argument might not work for all deviations.

  7. **The use of called-off bets and the fact that the evidence is certain might be essential. (Technical irritant)**
     - The called-off bets (refunded if the condition is not met) are crucial. They are fair because Mara's conditional credences are used. But if the evidence were uncertain, the called-off bets would not be so straightforward. This is a technical point that might limit the generality of the argument.

  **Weighting:** I give the most weight to objection (2) because it questions the very connection between avoiding sure losses and epistemic rationality. Next is (1) because the idealization of certainty is very strong and the argument collapses without it. Then (3) because the diachronic nature of the norm is controversial. (4) is also important because it questions the normative force of a plan. The others are more technical and can be handled by tweaking the scenario.

