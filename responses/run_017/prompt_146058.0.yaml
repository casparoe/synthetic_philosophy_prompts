  ...*adjusting structure*... The user wants a menu, so I'll tabulate: Reading → Content → Tests → Plausibility → Policy Implications. I'll note where empirical uncertainty exists (e.g., for Social Construction, whether diagnoses *are* cultural artifacts is debatable). 

  For constraint #1: Semantic Extension and Symptom Clusters both accept suffering as real. Epistemic Critique rejects even "problems in living" as reductive. For #2: The colleague's transparency-for-insurance stance works with Semantic Extension (pragmatic) but clashes with Functional Myth (if naming enables control). 

