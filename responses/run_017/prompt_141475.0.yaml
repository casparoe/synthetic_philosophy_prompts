  Alternatively, we can have them do only 10 trials and draw. But 10 might not be enough to see the fraction clearly.

  We can do a hybrid: for each station, do 10 trials with actual drawing and measuring, and then 30 trials by simulation. But that might be confusing.

  Given the time, we decide to have them do 40 trials by simulation (using provided random numbers) for Stations 1,2,3,4. But then it's not hands-on. We want them to see the physical procedure. 

  Another idea: for Station 1, have a large circular board with a spinner at the center. They spin the spinner twice to get two random points on the circumference and then measure the angle. But that might be slow.

  We can reduce the number of trials to 20. Then they might have time to do it physically.

  Let's try to design physically for 20 trials:

  Station 1: 
  - A large circle (on paper or on floor) with a spinner at the center. They spin the spinner, let it stop, mark the point on the circumference. Then spin again and mark a second point. Then they measure the central angle. How to measure? They can use a protractor. But that might be slow. Alternatively, they can use a string to measure the arc and compare to the circumference? This might be messy. We can have a pre-marked string of length corresponding to 120 degrees. They can measure the chord length and compare to the side of the triangle? We can have a string that is the length of the side of the triangle. Then they form the chord with a string and compare visually to the reference string.

  So for Station 1:
  - A large circle with center fixed and a spinner that can be spun to point to the circumference.
  - A string cut to the length of the side of the triangle (which is sqrt(3)*R).
  - For each trial:
     - Spin the spinner and mark the point (or attach a string to the center and extend to the circumference at the spinner's direction).
     - Do it again for the second point.
     - Stretch a string between the two points and compare to the reference string: if it's longer, record 1, else 0.

  But comparing two strings might be hard if they are close.

  Alternatively, use a ruler to measure the chord and then compare to the reference length. But that might be slow.

  Given the time, we decide to do 20 trials per station and accept that Station 3 might be the slowest.

  For Station 3: how to generate a random point in the disc? We can use a grid and a bag of tokens with coordinates, but then it's not uniform. Alternatively, use a computer. But we want physical. We can use a large circle on the floor and have them throw a bean bag, then mark the landing point and measure the distance from the center. Then they draw the chord perpendicular to the radius at that point. Then they measure the chord and compare to the reference. This will be slow.

  Therefore, I propose to have the stations do the following number of trials and methods:

  - Station 1: 20 trials, physical: two random points by spinning a spinner twice, then form the chord and compare to a reference string.
  - Station 2: 20 trials, physical: choose a radius by spinning a spinner, then choose a random distance along the radius by drawing a numbered token from a bag (with distances from 0 to R in uniform steps? We can have 20 tokens with distances that are uniformly distributed between 0 and R. For example, R=10, then tokens with values 0.5, 1.5, 2.5, ..., 9.5? Then they are uniform in [0,10]. Then for each, they mark the point on the radius and draw the perpendicular chord. Then compare to the reference string.
  - Station 3: 20 trials, physical: throw a bean bag onto a large circle on the floor. Measure the distance from the center. If it is within R/2, record 1, else 0. (Because they don't need to draw the chord: the condition is only on the distance of the midpoint.) So they just need to measure the distance and see if it is less than R/2. But then it's not the chord length they are measuring, but the distance. We can explain that the midpoint being within R/2 means the chord is longer. So they can do that.
  - Station 4: 20 trials, physical: throw a long stick (or straws) onto the circle on the floor. For each throw, measure the perpendicular distance from the center to the stick. If that distance is less than R/2, then the chord is longer. Record 1, else 0.

  Station 4 will be slow because of the measurement.

  Alternatively, for Station 4, we can do the simulation with provided random numbers, but then it's not physical.

  Given the time, let's do 10 trials for each station, and then use 10 provided random trials to make it 20. But that might be confusing.

  I think for the purpose of the activity, we can do 20 trials per station and accept that the fractions might not be exactly 1/3, 1/2, 1/4, 1/2 but close enough. The law of large numbers will give them close if we do 40, but 20 might be enough to see the difference.

  Materials per station:

  Common materials for all stations:
  - A large circle (radius R, say R=50 cm for Stations 1,2,3; for Station 4 on the floor, R=1 meter).
  - A reference string of length sqrt(3)*R (the side of the triangle).

  Station 1:
  - A spinner mounted at the center of the circle that can be spun and will stop at a random angle.
  - A ruler or string to draw the chord and compare to the reference string.
  - A recording sheet.

  Procedure for Station 1:
  1. Spin the spinner and mark the point where it points on the circumference.
  2. Spin again and mark the second point.
  3. Use a string to form the chord between the two points.
  4. Compare to the reference string: if the chord is longer, record 1; otherwise, 0.
  5. Repeat 20 times.
  6. Compute the fraction of 1's.

  Station 2:
  - A spinner for the radius.
  - A bag with 20 tokens. Each token has a number between 0 and R (uniformly distributed, e.g., for R=50, numbers: 2.5, 7.5, 12.5, ..., 47.5). But we need 20 distinct numbers. Alternatively, use a random number generator on a phone to generate a random number between 0 and R for each trial.
  - A ruler to measure the distance along the radius and draw the perpendicular chord.
  - Recording sheet.

  Procedure for Station 2:
  1. Spin the spinner to select a radius.
  2. Draw the radius as a line from the center to the circumference.
  3. Generate a random number r between 0 and R (either by drawing a token or using a phone).
  4. Mark a point on the radius at distance r from the center.
  5. Draw the chord perpendicular to the radius at that point.
  6. Form the chord with a string and compare to the reference string. Record 1 if longer, else 0.
  7. Repeat 20 times.
  8. Compute the fraction.

   Alternatively, since we know that the condition is r < R/2, they can simply record 1 if r < R/2. But then they don't need to draw the chord. To make it physical, we have them draw it.

  Station 3:
  - A large circle on the floor (radius R=1 meter).
  - A bean bag or a small object to throw.
  - A tape measure.
  - A string of length R/2 (0.5 meter).
  - Recording sheet.

  Procedure for Station 3:
  1. Throw the bean bag onto the circle. If it lands outside, rethrow.
  2. Measure the distance r from the center to the point.
  3. If r < R/2, record 1, else 0. (Because for the midpoint, if it is within R/2, the chord is longer.)
  4. Repeat 20 times.
  5. Compute the fraction.

  Station 4:
  - A large circle on the floor (radius R=1 meter).
  - A long stick (length about 2.5 meters so that it usually crosses the circle).
  - A tape measure.
  - Recording sheet.

  Procedure for Station 4:
  1. Throw the stick onto the circle.
  2. If the stick does not cross the circle at two points, rethrow.
  3. Measure the perpendicular distance d from the center to the stick.
  4. If d < R/2, record 1, else 0.
  5. Repeat 20 times.
  6. Compute the fraction.

  Measuring the perpendicular distance might be done by two students holding the tape measure: one at the center, the other moving to the closest point on the stick. Or use a set square. This might be slow and error-prone.

  Given the time, we might reduce the number of trials to 10 for Station 4.

  Time plan:

  Total time: 75 minutes.

  - Introduction (5 minutes): Explain that they will be in groups, each group at a station, and they will generate random chords by different methods and record how many are longer than the side of the inscribed equilateral triangle. They should not communicate with other groups. They have 20 minutes to do 20 trials (or 10 for Station 4) and compute the fraction.
  - Activity (25 minutes): Groups work. The TA circulates to help.
  - Write results on board (5 minutes): Each group writes their fraction on the board.
  - Discussion (40 minutes): Why are the numbers different? What does it mean to pick a chord "at random"?

  Detailed minute-by-minute:

  0-5: Introduction. Split into four groups of 6 students each. Assign stations. Explain the task: generate 20 (or 10) chords by the method at their station, record for each whether it is longer than the reference string (or meets the condition), compute the fraction. They should work independently and not discuss across groups.

  5-30: Activity. Groups work. The TA checks in with each group, especially Station 4 to help with measurement.

  30-35: Groups write their fractions on the board. We will have four fractions.

  35-75: Discussion. The TA asks: "What did we expect? One probability? But we have different fractions. What's going on?" 
  - Let the groups explain their method. 
  - Ask: "Which of these methods is the correct way to pick a chord at random?" 
  - They will argue.
  - The TA can then ask: "What is the space over which you were randomizing? Station 1: pairs of points on circumference. Station 2: a radius and then a point on it. Station 3: points in the disc. Station 4: lines in the plane (by measuring distance from center)."
  - Then ask: "Why might Station 4 be special? Does it matter where the circle is? If I moved the circle, would the distribution change? What if I made the circle bigger?"
  - Guide them to see that Station 4's method is invariant under Euclidean transformations.
  - Then ask: "But is that the 'correct' way? Or is the question ambiguous?"
  - Conclude that the principle of indifference requires specifying the space of alternatives.

  Failure modes:

  - Smug student who knows the paradox: The TA can ask them to not spoil it and to participate in the activity and then in the discussion as a thinker.
  - Groups finishing early: Have them do more trials or discuss why they think their method is natural.
  - Measurement error: In Stations 1 and 2, comparing string lengths might be inaccurate. We can accept some error.
  - Station 4 might be too slow: Reduce to 10 trials or have the TA help.
  - Bean bag for Station 3 might keep landing outside: Use a larger circle or allow to land outside but only record if inside. But if it lands outside, it's not in the disc, so reject.
  - Groups peeking: The TA should enforce no communication.

  Number of trials: 20 for Stations 1,2,3 and 10 for Station 4. Or 10 for all if time is tight. But 10 might not show the effect clearly. We can use the provided random numbers to do 30 additional trials quickly after the physical 10, if time allows.

  Ultimately, the activity can show different procedures give different results, but the moral that the question is ill-posed might need to be drawn out in discussion.

  We can also provide a handout after the activity with the three classic methods and the invariant measure.

  Let's change Station 4 to use the phone to generate d and then they only record if d < R/2, and skip the physical throw. Then they can do 40 trials quickly. And we explain that this simulates throwing straws in a way that is invariant.

  So Station 4: 
  - Use a phone to generate 40 random numbers between 0 and R.
  - For each, record 1 if < R/2, else 0.
  - Compute the fraction.

  Then they finish in 5 minutes. To keep them busy, have them also write down the values.

  And for the other stations, they do 20 physical trials.

  Then the board will have:

  Station 1: fraction (should be around 1/3)
  Station 2: fraction (should be around 1/2)
  Station 3: fraction (should be around 1/4)
  Station 4: fraction (should be around 1/2)

  And then the discussion.

  This seems workable.
answer: |-
  Below is a complete, runnable plan for your Bertrand's chord paradox activity. It's designed for a 75-minute session with 24 students split into four groups of six, each at a station. The goal is to have students generate the probabilities (1/3, 1/2, 1/4, and 1/2) through hands-on methods, spark surprise when results differ, and drive a discussion about the core lesson: randomness requires a specified space of alternatives.

  ---

  ### **Materials and Setup**
  **Pre-session prep (do before class):**
  - **Circle templates:** Print 4 large circles (radius ~30 cm) on poster paper. For each, mark the center and inscribe an equilateral triangle (or at least one side for reference). For Station 4, tape a 2m-diameter circle on the floor with rope/chalk (include a visible inner circle of radius 1m for comparison).
  - **Reference tools:** Create a "reference chord" string for each small circle, cut to the length of the triangle's side (≈0.866 × circle radius for radius 30 cm). For Station 3, cut a "radius/2" string (15 cm for small circles, 1m for the floor circle).
  - **Randomness tools:**
    - **Station 1:** Two spinners (e.g., fidget spinners or paperclip-on-pencil spinners) for angles.
    - **Station 2:** One spinner for angles; a bag with 40 slips of paper numbered 0 to 30 (uniformly spaced, e.g., 0.75, 1.5, 2.25, ..., 30) for distances along the radius.
    - **Station 3:** A bag of dry rice or small beans (200+ grains); a 30cm ruler.
    - **Station 4:** 50 drinking straws (standard 20cm length); tape measure; a 1m-long stick for measuring perpendicular distance.
  - **Recording sheets:** Provide each station with 40-row tally sheets (see below). Include simple instructions at the top.
  - **Group handouts (for debrief):** Prepare slips labeled: "Space: pairs of endpoints (circumference)", "Space: radius + point on it", "Space: points in the disc", "Space: lines in the plane". Distribute during the discussion.
  - **Projector:** Have a slide ready showing the circle and triangle (no formulas).

  **Recording sheet (example for all stations):**
  ```
  Station [1/2/3/4] - Record 40 trials
  Trial | Generated values | Chord longer than triangle side? (✓ or ✗)
  1     |                  | 
  2     |                  | 
  ...   | ...              | 
  40    |                  | 
  Fraction longer: ____ / 40 = ____ 
  ```

  ---

  ### **Stations: Procedures and Rationale**
  Each station has a physical method to generate chords. Students record only whether the chord is longer than the reference (✓/✗), then compute the fraction. **40 trials** are chosen for statistical stability: with 40 trials, probabilities like 1/3 (≈13.3) and 1/4 (10) will typically differ by 3–5 successes, making disagreement obvious. Groups work simultaneously.

  - **Station 1: Two random endpoints (target: 1/3)**  
    **Materials:** Small circle with spinner, reference chord, strings, protractor, tally sheet.  
    **Procedure:**  
    1. Spin the spinner to get a random angle; mark point A where it hits the circumference.  
    2. Repeat to get point B.  
    3. Stretch a string between A and B to form the chord.  
    4. Compare to reference chord: if longer, ✓; else ✗.  
    **Speed tip:** Students can spin while others record. Comparison is quick (lay strings side-by-side).  
    **Why 40 trials works:** Central angle >120° gives longer chord (P=1/3). 40 trials yield ~13–14 ✓, distinct from other stations.

  - **Station 2: Random radius + random point (target: 1/2)**  
    **Materials:** Small circle with spinner, bag of distance slips (0–30), ruler, pencil, reference chord, tally sheet.  
    **Procedure:**  
    1. Spin the spinner to select a radius; draw it lightly.  
    2. Draw a slip from the bag to get distance *d* from center.  
    3. Mark point P on the radius at *d* cm.  
    4. Draw the chord perpendicular to the radius at P.  
    5. Compare to reference chord: ✓ if longer, ✗ else.  
    **Speed tip:** Pre-drawing radii isn’t needed; students can mark P directly.  
    **Why 40 trials works:** Chord longer if *d* < 15 cm (P=1/2). 40 trials yield ~18–22 ✓.

  - **Station 3: Random midpoint in disc (target: 1/4)**  
    **Materials:** Small circle, rice/beans, ruler, radius/2 string (15cm), tally sheet.  
    **Procedure:**  
    1. Drop a rice grain onto the circle. If it lands outside, re-drop.  
    2. Measure distance *r* from center to grain.  
    3. **✓ if *r* < 15 cm, ✗ otherwise** (no chord drawing needed—explain this *is* the condition for longer chords).  
    **Speed tip:** Use ruler to measure *r* quickly. Students can drop/measure concurrently.  
    **Why 40 trials works:** *r* < R/2 has P=1/4. 40 trials yield ~8–12 ✓.

  - **Station 4: Thrown straws (invariant lines) (target: 1/2)**  
    **Materials:** Taped floor circle (2m diameter), 40 straws, tape measure, 1m stick, tally sheet.  
    **Procedure:**  
    1. Toss a straw onto the floor circle.  
    2. **If the straw doesn’t cross the circle twice, re-toss** (ignore misses).  
    3. Measure the perpendicular distance *d* from center to the straw:  
       - Have two students hold the tape measure at the center and along the straw.  
       - Use the 1m stick to find the shortest distance (right angle).  
    4. **✓ if *d* < 1m, ✗ otherwise** (since R=1m, R/2=0.5m? Wait—radius is 1m, so R/2=0.5m. Correct condition: *d* < 0.5m).  
    **Speed tip:** Assign roles: tosser, tape-holder, measure-taker, recorder.  
    **Why 40 trials works:** For lines uniform in the plane, *d* is uniform on [0,R], so P(*d* < R/2) = 1/2. 40 trials yield ~18–22 ✓. Straw length (20cm) is short relative to circle (diameter 2m), but re-tossing misses ensures only valid chords count, and the finite length doesn’t bias *d* if the circle is large.

  ---

  ### **Minute-by-Minute Schedule (75 min total)**
  - **0–5 min: Intro (no lecturing!)**  
    - Split students into 4 groups. Assign stations randomly.  
    - Quick instructions: “Each station has a way to generate random chords. Do 40 trials: record if the chord is longer than the triangle’s side. Compute your fraction. **No peeking at other stations—this is a surprise!**”  
    - Emphasize: “Don’t overthink the ‘longer than’ judgment—use the tools provided. Aim for speed!”

  - **5–35 min: Activity (30 min)**  
    - Groups work. TA circulates:  
      - **Station 1:** Ensure they mark points clearly and compare strings without measuring.  
      - **Station 2:** Verify they draw perpendicular chords (use a protractor if stuck).  
      - **Station 3:** Confirm they only measure *r*, not the chord.  
      - **Station 4:** Help with perpendicular distance measurement (demo once).  
    - **Pacing:** Groups finish at different times. **If done early**: “Do 10 more trials for better accuracy.”  
    - **Smug student?** If someone knows the paradox, say: “Great—help your group, but don’t share globally yet. We’ll discuss later.”

  - **35–40 min: Report results (5 min)**  
    - One student per group writes their fraction on the board (no method names, just e.g., “Group A: 12/40 = 0.30”).

  - **40–75 min: Debrief and discussion (35 min)**  
    **Goal:** Guide students from surprise to the “indifference needs a space” insight.  
    - **Step 1: Surprise (5 min)**  
      - Show results: “We have four numbers. What did you expect? Why the disagreement?”  
      - Let students react—they’ll notice values cluster near 1/3, 1/2, 1/4.  
    - **Step 2: Methods unpacked (10 min)**  
      - Ask each group: “Describe your method in 1 minute.”  
      - After each, ask: “What did you randomize? What choices did you make uniformly?”  
      - **Key:** Students articulate the space:  
        - Station 1: “Two random points on circumference.”  
        - Station 2: “Random radius, then random point on it.”  
        - Station 3: “Random point inside the circle.”  
        - Station 4: “Random line (via straw toss).”  
    - **Step 3: Invariance emerges (10 min)**  
      - Focus on Station 4: “Your answer was ~1/2. Suppose I moved the circle or resized it. Would your straw-toss method care?”  
      - Guide them:  
        - “If I shifted the circle left, would the straws ‘know’?” (No)  
        - “If I made the circle bigger, would that change how lines hit?” (No—lines extend infinitely)  
        - “So what’s special about your method?” (It’s invariant under shifts/scales)  
      - **Don’t state the answer:** Ask, “Does invariance make this the ‘right’ method? Why or why not?”  
    - **Step 4: The core conflict (10 min)**  
      - Distribute space labels (handouts). Hold up each: “Is this space the ‘right’ one for randomness?”  
      - Let students debate. Push them: “Why prefer endpoints over midpoints? What does ‘no reason’ mean here?”  
      - **Reveal the moral:** “So the paradox isn’t about circles—it’s that ‘random’ requires specifying the space of alternatives first. Indifference alone is incomplete!”  
    - **Wrap-up:** “Bertrand named this—it’s a classic paradox. But you generated it yourselves!”

  ---

  ### **Failure Modes and Mitigation**
  - **Straws miss the circle (Station 4):**  
    **Risk:** Many re-tosses slow things down.  
    **Fix:** Use a large circle (2m diameter), and accept only clear crosses. In practice, 20–30% of tosses will be valid, so start with 50 straws. If time runs short, use the first 20 valid trials.

  - **Angle/distance not uniform (Stations 1–2):**  
    **Risk:** Spinners/bags aren’t perfectly uniform, affecting results.  
    **Fix:** Use digital RNG apps as backup (e.g., random.org). Downplay: “Physical methods approximate randomness—focus on the big picture.”

  - **Groups peek or finish early:**  
    **Risk:** Groups observe others or finish in 15 min.  
    **Fix:** Assign “extra” tasks (e.g., “Discuss why your method feels natural”). Enforce no-peeking rules. If done very early, have them compute a confidence interval (for math students).

  - **“Longer than” judgment is slow/fiddly (Stations 1–2):**  
    **Risk:** String comparisons take time or cause arguments.  
    **Fix:** Use stiff strings that don’t stretch. For Station 2, they can check if *d* < 15 cm instead of drawing (since it’s equivalent), speeding things up.

  - **Smug student blurts out the paradox:**  
    **Risk:** Someone ruins the surprise early.  
    **Fix:** Pre-empt: “If you’ve seen this before, be a silent observer and help your group tactfully.” If it happens, pivot: “Okay, but why do the methods disagree? Let’s test it ourselves.”

  - **Stations 3–4 take too long:**  
    **Risk:** Measuring *r* or *d* for 40 trials is slow.  
    **Fix:** Reduce trials to 20–30 or pair students within groups. Station 4 can use 30 trials if needed.

  - **Math students dominate:**  
    **Risk:** Philosophers disengage during math-heavy stations.  
    **Fix:** Assign roles (e.g., “tosser,” “recorder,” “measurer”) to ensure participation.

  ---

  ### **What the Activity Can and Can’t Deliver**
  - **Can deliver vividly:**  
    - Different methods → different probabilities (the paradox is experiential).  
    - The invariance insight (Station 4) emerges from discussion, not lecturing.  
    - “Indifference needs a specified space” becomes tangible via the four labels.

  - **Can’t deliver (requires your guidance):**  
    - The “question is ill-posed” moral won’t arise spontaneously. Students will fixate on “which method is correct?” You must reframe it to: “The question didn’t specify the space—so all are ‘valid’ but yield different results.”  
    - Formal details (e.g., integrals, measure theory) are avoided; focus on conceptual conflict.

  ---

  ### **Final Tips**
  - **Prep checklist:** Test spinners, print circles, cut strings, pre-generate distance slips, tape floor circle.  
  - **During activity:** Keep energy high. Use a timer for stations (e.g., “10 minutes left!”).  
  - **In debrief:** Be a facilitator, not a lecturer. Use Socratic questioning to draw out the space/indifference point.  
  - **If disaster strikes:** If one station’s result is way off (e.g., Station 4 gets 0.7), use it! “Why might this method be noisy? What does that say about physical randomness?”

  This plan balances hands-on fun with deep philosophy. Students will remember the disagreement—and the reason—long after the integrals fade. Good luck!
