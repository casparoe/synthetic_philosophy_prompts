  We are designing a scenario where a holist (modeling at the group/structural level) outperforms a methodological individualist (with full microfoundations) in predicting the effect of an intervention. The key is that both models agree on the status quo (what happens without intervention) but diverge on an intervention, and the holist is correct. The macro variable must be relational/structural (not a mere aggregate). The setting should be ordinary and legible (e.g., housing market, hiring, school, hospital, credit market). Avoid Schelling and common examples.

  Scenario: A City's Housing Market and Rent Control

  Setting: 
  Consider a city with a tight housing market where rents have been rising rapidly. The city council is considering a rent control policy that would cap the annual increase in rent for existing tenants. Without intervention, the market will continue to see rising rents and low vacancy rates. Both the holist and the individualist models agree on this baseline. The intervention is the rent control policy.

  The holist model focuses on the structure of the housing market: the distribution of property ownership and the relational patterns between landlords and tenants. Specifically, it highlights that a significant portion of the rental units are owned by a few large corporate landlords who have the capacity to quickly convert rental units to condominiums (condos) for sale. The holist model uses a macro-structural variable: the concentration of ownership and the ease of conversion (which is a relational property because it depends on the market power and the institutional rules about conversion).

  The individualist model has full microfoundations: it models every landlord (with their financial goals, risk aversion, and decision rules) and every potential tenant (with their income, preferences, and search behavior). Each landlord, when faced with rent control, will evaluate their options: continue renting at controlled rates, convert to condos, or leave the market. The model simulates each agent's decision.

  The Intervention and Predictions:

  Without intervention (status quo): Both models predict rising rents and low vacancy.

  With rent control:
  - The individualist model predicts: Most landlords will continue renting because the controlled rents are still profitable (given their costs) and because conversion is costly and only attractive to a few. Thus, the policy will help tenants by stabilizing rents without a significant reduction in rental supply.
  - The holist model predicts: The rent control policy will trigger a massive wave of conversions by the large corporate landlords because they have the capital and scale to convert units quickly and profitably. This will lead to a sharp decline in the rental stock, increasing rents in the non-controlled segment and causing a housing crisis for renters.

  Ground truth: After the rent control policy is implemented, the large corporate landlords convert a significant portion of their rental units to condos, reducing the rental supply and causing rents in the remaining non-controlled units to skyrocket. The policy backfires.

  Why the holist model outperforms:
  The key macro-structural variable is ownership concentration and the strategic interdependence among landlords. The holist model recognizes that the market structure (a few large players with the power to shift the market) makes the system vulnerable to a cascading effect when the policy changes the incentives. The individualist model, while having all the micro details, fails to capture the emergent coordination: each landlord in the simulation decides independently and does not account for the fact that if one large landlord starts converting, it signals to others and also reduces the rental stock, making conversion more attractive (a positive feedback loop). But note: the holist model does not rely on downward causation; it uses the structural property (concentration and institutional rules) that emerges from the micro level but is not reducible to individual decisions without considering the network of relations.

  What the reader should observe:
  - Individualist prediction: Rents stabilize for controlled units, and the rental market remains largely intact. Vacancy rates might slightly increase but not drastically.
  - Holist prediction: A wave of conversions leads to a sharp drop in rental units and a spike in rents for non-controlled units. Many renters are displaced.
  - Ground truth: The latter happens.

  The single feature doing the work: The structural property of ownership concentration and the institutional rules about conversion create a situation where the system-level response is invariant under the intervention (rent control) in a way that is not captured by aggregating individual decisions because the individual decisions are interdependent and the outcome depends on the pattern of ownership. Specifically, the holist model uses the invariance that when a market is highly concentrated, price controls can trigger a structural shift (conversion) that is not linearly related to individual profit calculations because of strategic complementarities.

  If the feature is removed or inverted: If ownership were highly fragmented (many small landlords), then the holist model would not predict a wave of conversions because small landlords lack the capital and scale to convert. In that case, the individualist model might be correct: most landlords would continue renting. Alternatively, if the institutional rules made conversion very difficult (e.g., by requiring lengthy approval processes or high fees), then the holist model would also not predict a crisis.

  Strongest reply from a methodological individualist (in a reconciliationist spirit): 
  The individualist might argue that the holist's macro-structural variable (ownership concentration) is itself an aggregate of individual properties (who owns what) and that a sufficiently sophisticated individualist model could incorporate the network of ownership and the strategic interactions (e.g., using game theory). Thus, the holist approach is just a more efficient way of modeling the same underlying microfoundations, but in principle, the individualist model can capture it by including more details about the relations between agents.

  Where that reply is weakest: 
  In practice, the individualist model may become intractable when trying to account for all the strategic interdependencies and the feedback loops, especially when the number of agents is large and the interactions are complex. Moreover, the holist model might reveal a stable structural pattern (like the concentration) that is invariant across many micro-realizations (multiple realizability) and thus allows for robust predictions without needing to simulate every agent. The individualist model would require precise data on each agent's decision rules and their network of interactions, which may be unobservable or too costly to collect.

  Check for circularity: The scenario does not assume downward causation or emergent causal powers. The holist model uses a structural property (concentration) that is built from micro properties (who owns what) but is irreducible in practice because of the complexity of interactions. The holist does not have extra empirical data; they use the same micro data but aggregate it into a structural variable and then apply a macro-level generalization (concentrated markets are vulnerable to structural shifts under price controls). This generalization is based on historical and theoretical knowledge, not on new data.

  Let's write the case as requested:

  **Scenario: Rent Control in a City with Concentrated Housing Ownership**

  In a city facing skyrocketing rents, the council considers a rent control policy to cap rent increases for existing tenants. Without intervention, both models agree: rents will keep rising and vacancy rates will stay low. The holist model, focusing on the concentration of rental ownership (where a few large corporate landlords own a large share of units) and the institutional rules allowing easy conversion of rentals to condos, predicts that rent control will trigger a wave of conversions, drastically reducing the rental supply and hurting renters. The individualist model, simulating each landlord's decision based on their costs and profits, predicts that most landlords will keep renting because conversion is costly and only a few will convert. After implementation, the holist is proven right: large landlords convert en masse, rental supply plummets, and non-controlled rents soar.

  **What's Doing the Work?** 
  The key feature is the structural property of ownership concentration, which creates strategic interdependence among landlords and makes the system vulnerable to a tipping point. This macro property is invariant under the intervention and leads to a non-linear response that the individualist model misses because it treats decisions in isolation.

  **If the Feature is Removed:** 
  If ownership were fragmented (many small landlords) or conversion rules were very restrictive, the holist model would not predict a crisis, and the individualist model might be adequate.

  **Strongest Individualist Reply:** 
  A sophisticated individualist model could incorporate network effects and strategic interactions, making the holist approach just a convenient shortcut. However, this requires detailed data on each agent's decision rules and their interdependencies, which is often unattainable. Moreover, the holist model captures a multiply realizable pattern: the same crisis can occur under different microfoundations as long as ownership is concentrated.

  **Where the Reply is Weakest:** 
  Even with full microfoundations, modeling the strategic interdependencies in a concentrated market may require solving complex equilibrium problems that are computationally intractable. The holist model's structural insight provides a robust prediction without needing to simulate every interaction.
