  Possible rules:
  1. **Causal History Rule**: Symbols are grounded if the data originates from direct causal interaction with the world, even if the system itself is passive. This fits the image classifier (sensor data via cameras, labeled by humans) and the rover telemetry (sensor data directly from robots). It also fits the chess moves as outcomes of players' actions. LLM text lacks this direct causality.
  2. **Operational Validity Rule**: Grounding exists if the system's internal representations must align with an external structure for successful operation. The chess network needs to track the game tree to predict moves. The rover model needs to track position/terrain to predict telemetry accurately. The image classifier must align with labels. Lexical graphs and theorem provers don't have this requirement.
  3. **Perception-Action Loop Rule**: Only systems that are currently coupled with the world (sensing and acting) are grounded. This fits the robot arm but not the image classifier. However, the PI approved the image classifier, so this rule doesn't fit. So this can be discarded.

