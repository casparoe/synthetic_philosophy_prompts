  A key factor might be whether the training data's semantics are inherent. In the image classifier, labels are applied by humans, providing meaning. In the rover telemetry, the data is generated by the robots' interactions, so the meaning comes from the physical systems. The error codes, for example, signify actual issues. The PI might argue that the symbols are grounded because they're causally connected to real events, even if the model is offline.

  But the LLM trained on text was considered not grounded, even though text comes from humans describing the world. The PI probably sees that as second-hand; the model isn't directly tied to sensory data. The rover telemetry, however, is first-order data from sensors and actuators. That distinction could be crucial. Also, the caption-supervised model had words grounded only weakly by inheritance from images, so direct sensory input seems important.

  The chess network is a good parallel. It learned from move lists, which are abstract but correspond to a real structure. The rover telemetry tokens are also abstract representations of real states and actions. The PI's rationale for chess was that the network's success depends on tracking the game tree. Similarly, the rover model's accuracy depends on tracking the underlying physical states (position, terrain), as shown by the linear probes. So, if the PI values dependence on real structures, this system might be grounded.

