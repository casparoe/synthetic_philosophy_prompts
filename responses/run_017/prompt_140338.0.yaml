answer: |-
  Here is a preparation sheet for your Q&A, prioritizing high-damage objections, tailored to your audience, with tactical concessions and soft-spot flags. Pre-empted objections and the "unaskable" question are at the end.

  ---

  ### **High-Damage Objections & Replies**

  1.  **Objection (Metaphysician):** "Your 'scarcity problem' presupposes a sharp, unanalyzed concept of 'subjecthood' that cosmopsychists explicitly reject. If the cosmic subject is fundamental, and local subjects are aspects/abstractions, why assume *any* arbitrary partition *should* count as a subject? Isn't demanding an explanation for non-subjects just a category error? Your whole scarcity worry seems like a pseudo-problem generated by illicitly importing micropsychist assumptions."
      *   **Reply:** "You're right that the cosmopsychist *aims* to dissolve the 'subject' concept at the fundamental level. But the problem arises precisely because they *need* to recover robust local subjects *like us* to match phenomenology. Their proposed relations – grounding, aspects, limits – must explain why *this* aspect is a subject (me) while *that* aspect (my foot + Eiffel Tower) isn't. Without a non-stipulative principle distinguishing subject-aspects from non-subject-aspects, the view struggles to explain the specific, sparse distribution of subjects we observe. The demand isn't for arbitrary partitions to be subjects; it's for an explanation of why only *some* partitions are."
      *   **Concede:** The term "scarcity" might be rhetorically loaded; reframe as "specificity of instantiation."
      *   **Hold:** The need for a non-stipulative principle distinguishing subject-manifestations from non-subject-manifestations within the cosmic ground.
      *   **Soft Spot:** Relies on the intuition that cosmopsychism *owes* an explanation for non-subjects, which they may deny is necessary.

  2.  **Objection (Neuroscientist):** "Isn't your 'scarcity problem' just the Exclusion Postulate dressed up in metaphysical jargon? IIT *already* solves this: only maxima of integrated information (Φ^Max) constitute subjects. Arbitrary aggregates like 'foot + Eiffel Tower' have negligible Φ. Your critique seems redundant – cosmopsychists can just adopt Φ^Max as their 'non-stipulative principle'."
      *   **Reply:** "This is a crucial point, and it cuts both ways. First, it *validates* the micropsychist approach: Φ^Max is fundamentally a principle of *micro-level integration and exclusion*. If the cosmopsychist adopts Φ^Max to solve scarcity, they've smuggled in a micro-level combinatorial principle. The cosmic subject isn't *doing the work*; Φ^Max applied to its parts is. This risks collapsing into micropsychism. Second, IIT's Φ^Max is an elegant *empirical hypothesis* within a micropsychist-friendly framework. Can cosmopsychism *derive* Φ^Max from the nature of the cosmic subject alone, without presupposing integration at the local level? If not, the advantage I claim for micropsychism stands."
      *   **Friendly or Threat?** **Friendly amendment to the *problem* (shows scarcity is real), but a threat to cosmopsychist *solutions*.** It highlights that using integration principles *reinforces* the micro-level combinatorial approach. Emphasize the *derivation challenge* for cosmopsychism.
      *   **Concede:** IIT provides a powerful empirical/computational framework addressing the functional core of scarcity.
      *   **Hold:** Adopting Φ^Max within cosmopsychism covertly relies on micro-level combinatorial principles, undermining cosmopsychism's claimed metaphysical simplicity.
      *   **Soft Spot:** If cosmopsychism can genuinely ground Φ^Max in the cosmic subject's nature, my point weakens.

  3.  **Objection (Illusionist-Leaning Philosopher):** "This whole debate feels like choosing between expensive ways to miss the point. Both views grant 'realism' about macro-subjects at immense metaphysical cost to solve a pseudo-problem – the 'hard problem'. Shouldn't we instead dissolve the assumption that consciousness is a fundamental or universal feature needing such elaborate derivation? Your step 4 concedes metaphysics can't decide, but perhaps that's because the question is ill-posed."
      *   **Reply:** "That's a powerful alternative, and I agree the hard problem drives this dialectic. My aim here is more limited: *if* one grants non-derivation realism (as participants in *this* workshop generally do), then *within that framework*, the choice between micro and cosmo hinges on empirical tractability at the borders, not the claimed metaphysical advantage of decombination. I'm arguing that even realists should prefer the view with more constrained, testable implications. Your dissolutionist view is coherent, but it's a different conversation."
      *   **Concede:** The illusionist/dissolutionist position is a serious alternative that bypasses these problems entirely.
      *   **Hold:** *Within* the realist, non-derivationist framework under discussion, my comparative claim stands.
      *   **Soft Spot:** Doesn't engage the illusionist's core challenge; risks appearing to dodge it.

  4.  **Objection (Micropsychist Ally 1):** "By conceding in step 4 that the *metaphysical* question is undecidable and shifting everything to empirical constraints, haven't you undermined the core motivation for *any* panpsychism? If empirical adjudication is king, why not prefer a well-developed physicalist emergence or illusionism over either flavor of panpsychism, which remain empirically unverified?"
      *   **Reply:** "A fair concern, but I think it strengthens our hand long-term. The *unique* motivation for panpsychism (micro or cosmo) is the non-derivation thesis: consciousness isn't *made* from wholly non-conscious parts. That's a *metaphysical* commitment driven by the hard problem. What I'm showing is that *choosing between* micro and cosmo *cannot* rely on further metaphysical advantages (like 'decombination is easier'). That choice *must* appeal to other virtues, like empirical fruitfulness and internal coherence. So, the core panpsychist commitment stands on its original metaphysical ground; the sub-debate between micro and cosmo does not. This actually protects the core by clarifying its foundation."
      *   **Concede:** Shifting the micro/cosmo choice to empirical grounds might make panpsychism *overall* seem less metaphysically decisive.
      *   **Hold:** The core non-derivation commitment remains metaphysically motivated; the sub-choice needs different criteria.
      *   **Soft Spot:** Risks making the non-derivation thesis look more isolated and potentially ad hoc.

  5.  **Objection (Metaphysician):** "You claim cosmopsychism lacks a 'non-stipulative' answer to scarcity. But why assume such an answer is possible or necessary? Maybe 'subject of experience' is a primitive concept only correctly applied to integrated wholes like us (and the cosmos), and the 'why not gerrymanders?' question is simply misguided, like asking why green isn't loud. Isn't demanding an explanation here just begging the question against primitivism?"
      *   **Reply:** "Primitivism about subjecthood is an option, but it comes at a cost. First, it risks being *too* quietist – it struggles to guide us in borderline cases (the very cases I argue are decisive). Second, the micropsychist *also* posits primitive subjects (the micro-ones), but crucially, they posit *many* of them and then offer a *combinatorial* principle (integration/bonding) to explain macro-subject formation and scarcity. The cosmopsychist posits *one* primitive subject and then needs to explain the *manifestation* of derivative subjects *without* a combinatorial principle. If they fall back on primitivism about *which manifestations count as subjects*, it looks less parsimonious than the micropsychist's single primitive (subjecthood) plus a combinatorial principle applicable everywhere. The micro view offers a more *unified* account of subject instantiation."
      *   **Concede:** A primitivist stance on derivative subjects is logically possible for the cosmopsychist.
      *   **Hold:** This primitivism is less explanatorily powerful and unifying than the micropsychist's approach.
      *   **Soft Spot:** Relies on judgments about explanatory virtue (parsimony, unity) which can be contested.

  6.  **Objection (Grad Student - Cognitive Science):** "What empirical finding *could* decisively shift the balance between micropsychism and cosmopsychism? Both seem compatible with any observation about brains. Does this debate have any real consequences?"
      *   **Reply:** "Excellent question – this gets to the heart of my step 4. The key is *borderline cases*. Micropsychism, tied to integration (like Φ), predicts sharp thresholds or identifiable mechanisms for subject unity. Cosmopsychism, lacking a comparable intrinsic constraint, can more easily accommodate fuzziness or observer-relative judgments. So: Finding a *precise* Φ threshold correlating perfectly with behavioral/introspective reports of unified consciousness across disorders, organoids, etc., would favor micropsychism. Finding consciousness radically dissociated from integration (e.g., robust consciousness in a system with near-zero Φ, or fragmentation where Φ is high) would be deeply problematic for micropsychism but potentially easier for cosmopsychism to accommodate via its more flexible relation between cosmic and local subjects. The *pattern* of verdicts in borderline cases is the test."
      *   **Concede:** Neither theory is *falsified* by a single observation; it's about predictive frameworks for borderline cases.
      *   **Hold:** Micropsychism offers a *more specific, risky* prediction profile based on integration.
      *   **Soft Spot:** Cosmopsychists *could* adopt integration constraints too, blunting the test (see Neuroscientist objection).

  7.  **Objection (Micropsychist Ally 2):** "Your critique of cosmopsychism's 'quiet eliminativism' risk seems apt. But doesn't your *own* solution for micropsychism – relying on 'phenomenal bonding' under integration – just push the problem down a level? How does 'bonding' genuinely solve the combination problem for subjects and qualities without being magical? Aren't you vulnerable to the same charge of lacking a fundamental explanation?"
      *   **Reply:** "You're absolutely right that phenomenal bonding is the hard nut for *us*. My point isn't that micropsychism has *solved* the combination problem; it's that it *confronts* it head-on and pairs it with a *testable framework* for *which* combinations occur (integration). Cosmopsychism, by promising an easier 'decombination', avoids the subject-combination problem but lands in an equally deep problem of explaining the *specificity* of manifestation *without* recourse to combinatorial principles, which then *reintroduce* the combination problem at the local level. So, yes, bonding is unresolved, but it's the essential challenge we *must* face. Cosmopsychism doesn't escape a challenge of comparable depth; it just relocates it to a place where it lacks the empirical tools micropsychism develops alongside its metaphysical problem."
      *   **Concede:** Phenomenal bonding remains the major unsolved metaphysical challenge for micropsychism.
      *   **Hold:** Cosmopsychism faces a challenge (specificity of manifestation) of comparable depth and has *less* empirical traction for addressing it.
      *   **Soft Spot:** Doesn't *solve* bonding; argues the alternative's problem is equally bad but less empirically tractable.

  8.  **Objection (Neuroscientist - Follow-up/Sharpening):** "You keep saying cosmopsychism lacks 'empirical traction'. But if they adopt Φ^Max, as I suggested, haven't they *gained* that traction? What specifically can micropsychism predict that cosmopsychism+Φ^Max *cannot*?"
      *   **Reply:** "If cosmopsychism adopts Φ^Max wholesale, it gains empirical traction but loses metaphysical identity. Φ^Max is fundamentally a measure of *causal interdependence* and *information integration* among *components*. If the cosmic subject is fundamental, and local subjects are derivative aspects, why should the *relations between physical parts* of the cosmos determine which aspects are subjects? What is the *metaphysical link* between cosmic consciousness and physical integration maxima? The micropsychist has a direct story: the subjects *are* the integrated components (or complexes thereof). The cosmopsychist+Φ^Max needs an *additional* principle: 'The cosmic subject manifests as subjects precisely where its physical basis exhibits Φ^Max'. This looks either like an unexplained coincidence or an admission that physical integration is primary, reducing the cosmic subject to an idle wheel. Micropsychism offers a more *direct* mapping between the metaphysical primitives (micro-subjects) and the empirical measure (integration of their physical bases)."
      *   **Concede:** Cosmopsychism + Φ^Max is empirically equivalent to micropsychism + Φ^Max on current data.
      *   **Hold:** The cosmopsychist version requires an *additional*, unexplained metaphysical bridge principle linking cosmic consciousness to physical integration patterns.
      *   **Soft Spot:** A committed cosmopsychist might simply assert this bridge as fundamental/nomological.

  ---

  ### **Pre-empt These in Your Talk (2)**

  1.  **The Metaphysical Undecidability (Step 4):**
      *   **Concede Up Front:** "Crucially, my argument suggests that the *core metaphysical claim* distinguishing cosmopsychism and micropsychism – whether the fundamental subject is one or many – cannot be decisively settled *on purely metaphysical grounds*. The supposed advantage of 'easier decombination' dissolves under scrutiny."
      *   **Reframe as Strength:** "...and this is precisely *why* we need to shift focus. By clearing away this unpersuasive metaphysical advantage, we can see that the *practically relevant* difference lies in which framework offers better tools for grappling with the empirically ambiguous cases of consciousness – the borderlands where philosophy meets cognitive science. On *that* ground, I'll argue micropsychism has the edge."
      *   **Why:** Pre-empts Micropsychist Ally worry (#4) and frames the shift to empirical constraints as a necessary consequence of the argument, not a retreat.

  2.  **The Illusionist Challenge:**
      *   **Concede Up Front:** "Before proceeding, let me acknowledge a powerful alternative: the view that the 'hard problem' itself is an illusion, dissolving the need for either cosmopsychism or micropsychism. That's a significant position, but this workshop is focused on *realist, non-derivationist* approaches to consciousness. My argument today operates within that shared realist commitment, comparing the internal coherence and empirical utility of two prominent options *within* that domain."
      *   **Reframe:** Positions your work as internal to a specific (though contested) project, showing respect for the alternative while bracketing it for the current purpose.
      *   **Why:** Pre-empts the Illusionist's framing attack (#3) and prevents it from derailing the specific micro-vs-cosmo debate you're addressing.

  ---

  ### **The Question You Hope Nobody Asks (Identified from Weak Joints)**

  *   **The Question (Likely from the Metaphysician, potentially devastating):** "You argue cosmopsychism struggles with 'scarcity' because it can't explain why arbitrary partitions aren't subjects. But doesn't this misunderstand priority? If the cosmic subject is truly fundamental and prior, then *all* partitions are equally 'aspects' or 'abstractions' of it. The question 'why is *this* aspect a subject?' presupposes that 'subject' is a fundamental property *applied to* the aspect, rather than being a way of *describing* the fundamental reality manifesting locally. Perhaps the cosmic view simply denies the premise that only some partitions 'count' as subjects in a metaphysically robust sense. Isn't your scarcity problem just a demand for a *micropsychist*-friendly account of subjecthood within a fundamentally anti-micropsychist framework?"
      *   **Why it's dangerous:** It attacks the very *intelligibility* of your scarcity problem from within the cosmopsychist framework. If the cosmic subject is fundamental, and "local subject" just means "the cosmos manifesting here-now in this way," then demanding an explanation for why it doesn't manifest as a subject *elsewhere* (in gerrymanders) might be nonsensical. The cosmos *is* manifesting there too, just not as a *unified subject of the type we are*. This potentially collapses your scarcity problem into the partition problem, which cosmopsychists *do* think they can address (e.g., through fundamental laws of manifestation).
      *   **Why it's the unaskable:** It directly challenges the coherence of applying the scarcity demand to cosmopsychism, potentially undermining your core critique (Step 3) and weakening Step 4.
      *   **Potential Response (Damage Control):** "That's a profound challenge. If cosmopsychism entails that *every* partition is an equally real manifestation of the fundamental subject, just differing in 'mode' or 'unity', then indeed, scarcity dissolves. But this seems to entail a form of *pan-subjectivity*: every arbitrary aggregate has *some* degree or kind of subjective experience, however minimal or fragmented. Most cosmopsychists explicitly *deny* this (e.g., Goff, Nagasawa), precisely to avoid pan-protopsychism or radical indeterminacy. They *want* to say only integrated organisms like us are genuine *subjects*. My scarcity problem asks: *on what basis*, within the priority-of-the-whole framework, can they make *that* distinction without smuggling in micro-level combinatorial constraints? If they embrace pan-subjectivity, they face a different set of problems aligning with our evidentiary constraints." (This is a tough spot; the reply highlights a tension within mainstream cosmopsychism but concedes the objection has force if they bite the bullet).

  ---

  **Good luck with your defense!** This preparation shows deep engagement with both your argument and your audience. Focus on clarity, concede where necessary without yielding core points, and steer the discussion towards the empirical constraints in Step 4.
