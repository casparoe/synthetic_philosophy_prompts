prompt: |-
  I spend most of my week as an educator at a memorial museum attached to one of the twentieth century's large-scale killings, and I'm finishing a master's thesis on how comparative claims about mass atrocity get policed in public discourse. I keep bumping into a pattern I cannot find a name for, and I want help carving it rather than labelling it. The rough shape is that comparisons are forbidden in one direction and compulsory in the other. When a visiting teacher asks my students which of two atrocities was worse, the question is treated as indecent and I have to deflect it; yet the same people who treat that question as indecent will say without hesitation that the event my museum commemorates was unprecedented, or the worst crime of its century, or a rupture after which nothing was the same. Those are comparative claims too — a superlative is a ranking — but they are not merely permitted, they are close to obligatory in commemorative speech; an exhibition text that presented the event as one atrocity among many would read as an insult. Something similar happens with the category *genocide*: campaigners fight bitterly to have their community's catastrophe counted under that term and resent it when it is withheld, which only makes sense if the term marks a high rank, and yet the same campaigners denounce the very idea of ranking atrocities.

  There is a second asymmetry, along a different axis. Comparisons of kind are respectable scholarship — typologies, definitions, disputes about whether a given episode counts as extermination, as ethnic cleansing, as a crime against humanity — while comparisons of magnitude are the ones that get called obscene: a panel on classificatory questions draws no protest, whereas a table of death tolls draws an angry letter. But classification carries rank with it, since a category that groups compete to enter is not a neutral box. So the taboo looks like it attaches to a dimension of comparison rather than to comparison as such.

  I've been calling this one-way comparativism, but I invented that, and it doesn't separate the two axes. What I want is the carving, not a label: which established concepts are the near neighbours here, and in exactly what respect does each one miss? I've considered and set aside two in plain terms — the competitive scramble between groups for victim status, and the deflection move where someone answers a criticism of their own side by pointing at the other side's worse crimes — since the first is about who wants the top slot and the second about evading blame, whereas what I'm after is the norm that makes comparison itself permissible upward and forbidden downward. If nothing established fits, I'd like a coined term with a definition that handles the boundary cases: a comparison between two harms inside a single community's own history; a comparison drawn by a survivor rather than by an outsider; a comparison framed explicitly as being about prevention rather than magnitude; and the same asymmetry well outside atrocity, where people refuse to rank a friend's grief or a revered figure's achievement while freely using superlatives about them. And I'd like your view on whether the norm can be stated as a non-self-serving principle at all, or whether any formulation of it will turn out to license precisely the comparisons its holder already wanted to make. Please don't give me a bibliography or tell me whom to read — I have no library access from here, and it's the analysis I'm after.
reasoning: |-
  Okay, let me start by unpacking the user's query. They work at a memorial museum dedicated to a major 20th-century atrocity and are finishing a thesis on how comparisons of mass atrocities are policed in public discourse. The core issue they've observed is an asymmetry: comparisons that rank atrocities are forbidden in one direction but compulsory in another. For example, asking which of two atrocities was worse is seen as indecent, yet calling the event their museum commemorates "unprecedented" or "the worst" is obligatory. Similarly, they note that comparisons of kind (typologies, definitions) are acceptable, while comparisons of magnitude (death tolls) are taboo, even though classification implicitly ranks events.

  The user wants help carving out this concept, not just labeling it. They’ve considered terms like victim status competition and deflection but find those insufficient because they focus on competition or blame evasion, whereas the user is interested in the normative asymmetry itself. They also want to address boundary cases: intra-community comparisons, survivor perspectives, prevention-focused comparisons, and the asymmetry in non-atrocity contexts like grief or achievements.

  First, I need to pinpoint the exact nature of the asymmetry. The user mentions two axes: directional (forbidden downward vs. compulsory upward) and dimensional (magnitude taboo vs. kind accepted). I should separate these axes while showing how they interrelate. The directional aspect involves hierarchies where upward comparison (towards uniqueness/superiority) is mandated, downward is prohibited. Dimensional involves magnitude being taboo while classificatory comparisons are allowed, even though categories carry implicit ranking.

  Existing concepts like "hierarchy of victimhood" or "comparative victimization" come to mind, but they don’t fully capture the normative enforcement the user describes. The compulsory aspect is key here—it's not just competition but a social norm that demands superlatives for specific events. Terms like "sacralization" might be relevant, as they involve treating an event as beyond comparison, but that usually prohibits all comparisons, whereas here upward comparisons are required.

  The user also questions if this norm can be stated as a non-self-serving principle. That’s tricky because any principle allowing upward comparisons but banning downward ones inherently privileges certain narratives. For example, stating "unique historical significance" as a criterion still depends on who defines "significance," often aligning with existing power structures. So it might be impossible to frame this neutrally.

  For boundary cases: intra-community comparisons (e.g., different tragedies within the same group) might still face the asymmetry if one event is centrally memorialized. Survivors making comparisons could be seen as legitimate, but might still face pushback if they challenge the established hierarchy. Prevention-focused comparisons might bypass the magnitude taboo by emphasizing causes over rankings, but could still trigger discomfort if they imply equivalences.

  In non-atrocity contexts, like grief or achievements, similar patterns appear. Declaring a friend's grief as "the worst" avoids minimizing it, but using superlatives for revered figures reinforces their status. The norm serves to protect sacred entities from being diminished, hence the directional taboo.

  Synthesizing this, the core might be a "normative asymmetry in comparative privilege." Directional: upward comparison is privileged, downward is restricted. Dimensional: classificatory comparisons are privileged over magnitude. The motives include avoiding minimization, maintaining reverence, and protecting commemorative integrity. But these motives are tied to specific narratives, making the norm self-serving. Any universal principle derived would likely be co-opted to defend existing hierarchies.

  Finally, coining terms like "asymmetric comparativism" or "directional taboo" could help, but the user wants the analysis, not just labels. Emphasizing the interplay between the two axes and the impossibility of a neutral principle seems crucial. The user’s deep need is to rigorously analyze this phenomenon for their thesis, providing a framework that handles nuances without relying on existing literature they can’t access.
answer: |-
  Your analysis identifies a sophisticated double asymmetry in comparative discourse around atrocity – one directional, one dimensional – and the challenge is to carve its structure without forcing a reductive label. Let's dissect the components, their near-misses, boundary cases, and the core tension you identify regarding non-self-serving principles.

  **The Core Asymmetries:**

  1.  **Directional Asymmetry (Forbidden Downward/Compulsory Upward):**
      *   **Forbidden Downward:** Comparing "lesser" events *to* the sacralized event ("Was X worse than Y?") is taboo, perceived as diminishing the sacralized event's significance or engaging in offensive relativization.
      *   **Compulsory Upward:** Framing the sacralized event *in superlative terms* ("unprecedented," "worst," "rupture") is not just permitted but often obligatory within commemorative spaces. This establishes its unique, incomparable status *through implicit comparison* (a superlative requires a class).

  2.  **Dimensional Asymmetry (Permitted Kind/Taboo Magnitude):**
      *   **Permitted Kind:** Comparing *categories* (genocide vs. ethnic cleansing, typologies of violence) is acceptable scholarly discourse. It appears analytical and definitional.
      *   **Taboo Magnitude:** Comparing quantitative *scale* (death tolls, duration, intensity rankings) is deemed obscene, crass, or inherently disrespectful. It's seen as reducing suffering to numbers.

  **Near Neighbour Concepts & Why They Miss:**

  1.  **Sacralization:**
      *   **Fits:** Explains why the core event is placed "beyond compare," making downward comparisons profane.
      *   **Misses:** Doesn't capture the *compulsory* upward comparison (the *need* for the superlative) or the dimensional asymmetry. Sacralization often implies *all* comparison is forbidden, but you observe the upward/superlative comparison is *required*. It also doesn't address the category competition.

  2.  **Hierarchy of Victimhood / Competitive Victimhood:**
      *   **Fits:** Explains the fierce competition for the label "genocide" and the resentment when it's withheld (seeking the "highest" category).
      *   **Misses:** Primarily focuses on *inter-group competition* for status/resources/recognition. Your asymmetry operates *within* the discursive norms *surrounding a single sacralized event* as much as between groups. It also doesn't cleanly separate the directional and dimensional taboos or explain why magnitude comparisons are uniquely problematic *even without* inter-group competition.

  3.  **Taboo on Minimization / Trivialization:**
      *   **Fits:** Directly addresses the fear behind forbidding downward comparisons and magnitude tables – the fear of appearing to lessen the gravity of the sacralized event or reduce suffering to statistics.
      *   **Misses:** Doesn't explain the *compulsory* nature of upward superlatives or why classificatory comparisons *aren't* seen as minimization. Minimization is the *effect* the taboo guards against, not the structural asymmetry itself.

  4.  **Commemorative Orthodoxy:**
      *   **Fits:** Captures the obligatory nature of the superlative framing within the specific institutional/social space of the museum. Certain narratives become non-negotiable.
      *   **Misses:** Feels too specific to institutional settings and doesn't fully articulate the *comparative logic* inherent in the superlatives or the dimensional split. It's more about *what* is said than *why* the comparative structure itself is asymmetric.

  5.  **Definitional Inflation / Category Prestige:**
      *   **Fits:** Explains the fight for the "genocide" label – it's the category carrying the most moral weight and recognition.
      *   **Misses:** Focuses only on the classificatory dimension and the competition aspect. Doesn't address the directional taboo on downward/magnitude comparisons or the compulsory superlatives.

  **Carving the Structure - The Interlocking Asymmetries:**

  The power of your observation lies in how these two asymmetries *interact* to protect the sacralized event's status:

  1.  **The Superlative Shield:** The compulsory upward framing ("unprecedented," "worst") establishes the event's supreme position within a moral/historical hierarchy. This *creates* the condition where any downward comparison feels like an attack on this established pinnacle.
  2.  **The Category Safeguard:** Permitting classificatory comparisons allows for scholarly engagement and the vital (but competitive) work of categorization ("Was it genocide?"). Crucially, however, *entering the sacralized category (like genocide) often implicitly bestows the "superlative" status*, or at least a claim to it. Yet, discussing the *quantitative* basis for that status (magnitude) is forbidden. The category absorbs the ranking potential, masking it as definition rather than comparison.
  3.  **The Magnitude Taboo as Enforcement:** Banning magnitude comparisons is the keystone. It prevents the quantitative relativization that could challenge the sacralized event's superlative status *even if it belongs to the "highest" category*. It also avoids the uncomfortable reality that multiple events might have comparable scales within the same category, potentially undermining claims of absolute uniqueness. The classificatory discourse can proceed *because* it sidesteps this direct quantitative challenge to the established hierarchy.

  **Boundary Cases & Refinement:**

  1.  **Intra-Community Comparisons:** The asymmetry likely persists if one event is centrally sacralized within that community's narrative. Comparing a lesser-known tragedy *to* the central sacralized event might still be taboo, while framing the central event in superlatives remains compulsory. The community maintains its own commemorative hierarchy.
  2.  **Survivor Comparisons:** Survivors may have more latitude, but the *institutional/social norm* you describe often exerts pressure. A survivor making a downward magnitude comparison involving the sacralized event might still face criticism for "diminishing" it, even from other survivors. Their comparisons might be accepted more readily if framed as about *kind* or *prevention*, or if comparing events *outside* the sacralized one.
  3.  **Prevention-Framed Comparisons:** This has the best chance of bypassing the taboo. Framing a comparison explicitly as "understanding mechanisms to prevent future atrocities" shifts the focus from ranking *past suffering* to analyzing *causes and solutions*. However, if the comparison inherently implies the sacralized event was *not* uniquely monstrous in scale or method (a challenge to the superlative), the taboo may still activate. Prevention provides a *potential* legitimate frame, not immunity.
  4.  **Non-Atrocity Contexts (Grief/Achievement):** This confirms the pattern is broader. Declaring a friend's grief "the worst" or a revered figure's achievement "unparalleled" is the compulsory upward framing, establishing its supreme status. Asking "was their loss *worse* than X's?" or "was their achievement *greater* than Y's?" risks seeming callous or diminishing – the forbidden downward comparison. The motive is similar: protecting the perceived absolute significance of the revered entity/person/suffering from relativization.

  **The Non-Self-Serving Principle: The Core Dilemma**

  You hit the crux: **Can this asymmetry be stated as a neutral principle? Almost certainly not.** Any attempt will collapse into justifying the existing hierarchy:

  *   **"Avoid Minimizing Unique Suffering":** This *is* the core rationale behind the norms. But "unique" is defined by the very superlatives the principle seeks to protect. What counts as "minimizing"? It inherently forbids downward comparisons of magnitude/rank while allowing (requiring!) the upward superlative that establishes the uniqueness. It's circular: the event is unique because we say it's the worst, and you minimize it if you question that.
  *   **"Respect Commemorative Integrity":** Again, "integrity" is defined by the existing orthodoxy which includes the compulsory superlative. Challenging the superlative *is* seen as violating integrity.
  *   **"Focus on Understanding Causes (Kind) Not Suffering (Magnitude)":** While a better scholarly principle, it doesn't explain the *directional* asymmetry (forbidden downward, compulsory upward) or the social *compulsion* of the superlative in commemoration. It also ignores that "kind" classifications (genocide) carry immense moral weight implying magnitude/precedence.

  **Conclusion: The Carved Structure**

  You observe a **normative asymmetry in comparative privilege** surrounding sacralized events/entities, enforced by two interlocking rules:

  1.  **Directional Privilege:** Upward comparison (asserting supremacy/uniqueness via superlatives) is privileged and often compulsory; downward comparison (implying equivalence or lesser status) is forbidden.
  2.  **Dimensional Privilege:** Classificatory comparison (kind) is privileged as legitimate discourse; magnitude comparison (scale) is taboo.

  **Motive:** To protect the absolute, non-relativized significance of the sacralized entity from perceived diminishment. This protection is achieved by establishing its position at the apex (superlative) while forbidding any quantitative challenge (magnitude taboo) to that apex. Classificatory discourse is tolerated because it can be framed as analytical and often reinforces category-based hierarchies without *explicitly* quantifying them.

  **Why it's ultimately self-serving:** The sacralized entity's position at the apex is taken as axiomatic within the normative framework. The rules exist primarily to defend this axiom, not to apply a neutral comparative logic. Any attempt to derive a neutral principle inevitably relies on concepts ("uniqueness," "minimization," "integrity") that are defined *by* and *for* the preservation of that specific apex status. The asymmetry functions as a discursive fortress for established commemorative hierarchies. Recognizing this structure doesn't negate the gravity of the events commemorated, but it reveals the specific, and inherently partial, logic governing how we are permitted to speak about them comparatively.
