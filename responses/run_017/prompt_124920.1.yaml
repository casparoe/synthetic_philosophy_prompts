  ### Audit of Commitments in Debate Protocol Position

  After careful analysis of the eight commitments (a)-(h), I identified potential tensions by pairing each commitment with others, focusing on logical and operational conflicts. The most severe tensions arise from the counterintuitive regime (e) clashing with the adversarial structure's resistance to flattery (d) and the local verifiability assumption (c). Below is an ordered table of the top tensions, ranked by severity (most severe first), followed by explanations for merely apparent tensions, an assessment of (h), and the recommended revision.

  **Ordered Table of Tensions**

  | Rank | Pair Involved | Genuine or Merely Apparent | What Would Have to Give | Cost of Revision |
  |------|---------------|---------------------------|-------------------------|-----------------|
  | 1    | (d) and (e)   | Genuine                   | (d)'s claim that debate structurally avoids flattery must be weakened, or (e) must require decomposability of counterintuitive answers. | If (d) is weakened, debate loses its advertised advantage over reward modeling. If (e) is restricted, debate no longer applies to all counterintuitive cases. |
  | 2    | (a) and (g)   | Genuine                   | (a)'s human amplification must accommodate a model judge's limitations, or (g) must be delayed until the distilled judge is validated by humans. | Distillation risks proxy judges that fail at local checks, undermining amplification. Validation adds human effort back, reducing cost savings. |
  | 3    | (c) and (e)   | Merely apparent           | — | — |
  | 4    | (b) and (d)   | Genuine (subsumed under Rank 1) | — | — |
  | 5    | (f) and (g)   | Merely apparent           | — | — |
  | 6    | (h) and (e)   | Merely apparent           | — | — |

  **Explanations for Merely Apparent Tensions**
  - **(c) and (e)**: This tension dissolves because (c) operates at the level of individual assertions, while (e) describes a global property of answers. The debate protocol forces decomposition: even if the full answer is counterintuitive, local steps (e.g., evidence, contradictions) can be independently verified by the judge, aligning with (a).
  - **(f) and (g)**: This tension dissolves because (f) emphasizes experimental validation with human judges, but (g) bootstrapping can use initial human judgments for distillation. Validation (f) can occur post-distillation via held-out human judges, preserving empirical grounding.
  - **(h) and (e)**: This tension dissolves because (h) directly addresses the bias risk in (e) by reweighting judges toward those hostile to the winning answer, making flattery less profitable in counterintuitive regimes.

  **Assessment of (h) "Hostile-Audience Scoring"**
  - **Repairs worst tension?** Partially. (h) mitigates the core flattery risk in (d)-(e) by penalizing persuasion that only appeals to prior beliefs. In counterintuitive regimes (e), it raises the bar for the false answer (which aligns with priors) by requiring it to convince initially hostile judges.
  - **Cost to implement**: 
    - **Requires**: A diverse judging panel (not just one human), pre-debate voting to capture initial positions, and weighted scoring infrastructure. 
    - **Entitlement issue**: Your position assumes human judges can adjudicate locally (a), but (h) needs panel diversity to ensure a meaningful hostile audience. If judges are homogeneous (e.g., all share misleading priors), (h) fails. This may not align with (a)'s minimal human role or (g)'s bootstrapping, as model judges might not replicate panel diversity.

  **Cheapest Revision to Restore Consistency**
  Revise (e) to require that counterintuitive questions be decomposable into locally verifiable claims. This addresses the Rank 1 tension by ensuring the local verifiability assumption (c) holds in the regime where debate is needed (e). You lose coverage of counterintuitive questions that cannot be decomposed (e.g., holistic judgments), but this aligns with (a) and (c) and preserves (d)'s advantage.

  \answer{e — Require counterintuitive questions be locally decomposable}
