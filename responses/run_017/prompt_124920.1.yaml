  I'm writing an internal position document on oversight via debate — the protocol in which two systems are assigned opposing answers to a hard question, alternate short statements that may quote, attack, or demand details of what the other has said, and a human judge reads the transcript and picks a winner, with the debaters improved by self-play against that judge. I don't need an introduction to the topic or a survey of how it has been discussed. I need an audit of my own position before it goes out. I am reasonably attached to everything below and genuinely cannot see which item is doing the damage, so please don't assume I know where the problem is.

