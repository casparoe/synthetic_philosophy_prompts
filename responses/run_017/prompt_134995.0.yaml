  3. The distance between the asymmetry and the antinatalist conclusion: the role of empirical premises about suffering and hedonic adaptation.
  4. The selection case: if she is going to have a child anyway, does the asymmetry give a reason to choose the better-off child, and why doesn't that reasoning support procreation?

  We also want a final question about evidence against the view.

  Let's create the questions:

  **Area 1: Asymmetry as betterness vs. reasons/duties**

  Question 1: 
  You've argued that the absence of pain is good even when there is no one for whom it is good, while the absence of pleasure is not bad unless someone is deprived. But it's unclear whether this asymmetry is a claim about the comparative value of outcomes or about our reasons for action. If it's about outcomes, we seem to need impersonal good to make sense of one outcome being better than another. If it's about reasons, then how does this lead to the conclusion that coming into existence harms the person who comes into existence?

  Follow-up (if she chooses the outcome interpretation): 
  If the asymmetry is about outcomes and requires an impersonal good, how do you reconcile this with the common intuition that value must be tethered to individuals? And doesn't introducing impersonal value open the door to the repugnant conclusion?

  Follow-up (if she chooses the reasons/duties interpretation): 
  If the asymmetry is about reasons, then it might tell us we have a duty not to bring someone into existence to avoid harming them. But how does the absence of pleasure in the case of nonexistence become a harm only if someone is deprived? In the case of creating a person, if we don't create them, they don't exist to be deprived. So how does the asymmetry, as a reason, explain why creating a person (who will have a life with pain and pleasure) is a harm to that person?

  **Area 2: Deprivationism and prenatal vs. posthumous nonexistence**

  Question 2:
  Your view seems to rely on a deprivationist account of harm to explain why death is bad for the one who dies (because it deprives them of future goods). But you also hold that never existing is not bad for the one who never exists. How do you reconcile deprivationism with the asymmetry? Specifically, why is posthumous nonexistence bad for the deceased (if they are deprived of goods) but prenatal nonexistence not bad for the never-existent?

  Follow-up (if she says that the deprivation account only applies to existing beings): 
  But then, how do we explain that creating a person who will experience some suffering (even if overall a good life) is a harm? If we say that by creating them we expose them to harm (including the harm of death which deprives them), then why isn't the harm of death (which is a deprivation) the same as the harm of never existing? In other words, if death is bad because it deprives the person of life, why isn't never existing bad because it deprives the person of life?

  **Area 3: Empirical premises and the gap to antinatalism**

  Question 3:
  The procreation asymmetry by itself does not entail antinatalism; it seems to require additional empirical premises about the balance of pleasure and pain in human life. In your work, you argue that even the best human lives contain significant suffering. But how much weight do these empirical claims bear? If it turned out that we could create lives with virtually no suffering and abundant pleasure, would the asymmetry still imply that creating such a life is wrong? Or would it merely become permissible? And how do you respond to the empirical challenge that humans exhibit hedonic adaptation, meaning that even after severe suffering we tend to return to a positive baseline?

  Follow-up (if she says that even with adaptation, suffering is bad and the asymmetry still applies): 
  But if we grant that suffering is bad and its absence is good (even if no one exists to enjoy that absence), then in a life that is overwhelmingly positive, isn't the absence of the suffering in that life a good? And if we create such a life, we bring about that good (the absence of suffering) and also the pleasures. So why is creating such a life impermissible? How does the asymmetry block this reasoning?

  **Area 4: The selection case**

  Question 4:
  Consider a case where you are going to have a child regardless. You have two options: you can bring into existence a child who is expected to have a very good life or one who is expected to have a life barely worth living. The asymmetry, as you describe it, seems to imply that you have no reason to choose the better-off child for that child's sake because if you choose the worse-off child, you aren't harming anyone by not creating the better-off one (since they wouldn't exist). But do you think there is any reason, perhaps impersonal, to choose the better-off child? And if so, why doesn't that same reasoning also support bringing a child into existence when the alternative is no child at all?

  Follow-up (if she says there is no reason to choose the better-off child): 
  But then doesn't that contradict common moral intuitions? For instance, in the non-identity problem, we think it's wrong to choose to have a child now who will have a serious disability when we could wait and have a different, healthy child. How does your view account for that intuition?

  Follow-up (if she says there is a reason to choose the better-off child): 
  If there is a reason to bring the better-off child into existence rather than the worse-off one, then why is there not also a reason to bring a child into existence (who will have a good life) rather than no child? In both cases, we are comparing two outcomes: one with a better existence and one with a worse (or no) existence. How does the asymmetry block the latter but not the former?

  **Final Question: Evidence against the view**

  Question 5:
  What kind of evidence or argument would you consider as a significant challenge to your view? In particular, what would lead you to reconsider either the procreation asymmetry or the antinatalist conclusion you draw from it?

