prompt: |-
  hey — please answer as a professional philosopher of probability who also genuinely knows clinical biostatistics (don't hand-wave the stats side). Take your time, and start by brainstorming three or four candidate rules before you commit to any verdict.

  So: my friend Dana is the statistician on our hospital's clinical prediction model committee, and she's the person everyone defers to when somebody asks "ok, but what's the probability for *this* patient." She has annoyingly firm opinions about which reference class to use, and I've started collecting them. She also has this line that the reference class problem isn't just the frequentists' problem, it's everybody's — and then ten minutes later she'll say "this patient's chance is about 12%" without blinking. I've never managed to get her to explain how those two things fit together, and I suspect that's part of what's going on.

  Her verdicts so far:

  - 60-something male smoker with chest pain in the ED: use "men over 50 with chest pain presenting to an ED" from the big registry. Not "adults," not "humans," not "men over 50 with chest pain who own a cat."
  - The cat class: the registry has about 900 such patients, so the estimate is well powered, and she still said no. The number came from a resident fishing around in the registry, and nobody has a story about why cats would matter.
  - "Patients referred for angiography" (huge n): rejected. Her reason was that referral is downstream of the same suspicion that predicts the outcome, so the rate in that class tells you about doctors' decisions rather than about the patient. I've never been sure why this is different from the chest-pain case, since chest pain is also downstream of the thing you're predicting.
  - A rare functional mutation with only about seven cases in the literature: you can't narrow to that, use the broader class, even though everyone agrees the mutation is causal.
  - A pre-specified, well-powered subgroup (n around 1800) defined by a biomarker on the causal pathway: she uses it without hesitating.
  - A post-hoc subgroup of about 120 patients with a plausible but unproven causal story: no, back to the broader class.

  New case, which is what I actually need. A 61-year-old man, and we want his five-year risk of progression. There's a 12,000-patient international trial that pre-specified a subgroup analysis by genotype at a marker that does nothing biologically itself — it's a tag SNP in tight linkage disequilibrium with a functional variant nobody actually genotyped. The split between marker strata is large, highly significant, pre-specified, well powered, and replicated in a second cohort. Two wrinkles: the marker is causally inert, and the LD pattern is quite different in his ancestry group, which was underrepresented in the trial.

  What will Dana say — use the marker stratum or not? More useful to me: what rule is she implicitly running, what other rules fit her six verdicts just as well, what does each of those predict here, and which further case would cleanest tell them apart? My own guess at the probe was a patient where you can narrow on a causal-but-tiny-n class or on a non-causal-but-enormous-n class but not both — is that the right one, or is there something sharper? And if you think she's just being inconsistent, say that, and tell me which of her verdicts she'd have to give up to become consistent.
reasoning: |-
  Okay, let me start by really unpacking the user's query. They're presenting Dana as a biostatistician with strong opinions on reference classes, and they've listed several specific cases where she made decisions. The user wants to know Dana's likely verdict on a new case involving a genetic marker with linkage disequilibrium issues and ancestry differences. More importantly, they want to understand the underlying rule Dana uses, alternative rules that could fit, and how to test between them.

  First, I need to recall the reference class problem. It's about choosing the right group to assign a probability to an individual. Dana says it's everyone's problem, not just frequentists', but then gives specific probabilities. That tension suggests she has a method to resolve the problem pragmatically.

  Looking at her past decisions: 
  - She prefers classes like "men over 50 with chest pain" over broader or irrelevant ones (like cat owners). 
  - She rejects classes affected by selection bias (like angiography referrals). 
  - For rare mutations, she uses broader classes despite causal knowledge. 
  - She accepts pre-specified, well-powered subgroups on causal pathways but rejects post-hoc ones.

  This pattern indicates she values classes that are both statistically sound and causally relevant. But the new case has a twist: a pre-specified, well-powered genetic subgroup where the marker is non-causal and LD varies by ancestry. 

  I start brainstorming candidate rules:
  1. **Causal Adequacy Rule**: Prioritizes classes with direct causal relevance. But Dana used a non-causal chest pain class, which is predictive but not causal. So maybe not.
  2. **Predictive Stability Rule**: Focuses on classes with reliable statistical estimates. She rejects rare mutations due to small n, accepts large subgroups. But she also rejected the cat class with sufficient n, so there's more to it.
  3. **Avoiding Collider Bias**: She avoids classes like angiography referrals because they introduce bias. Chest pain isn't a collider—it's a symptom. Important distinction.
  4. **Pre-specification Requirement**: She accepts pre-specified subgroups but rejects post-hoc. But in the new case, it's pre-specified, yet the LD issue might be a problem.

  The new case hinges on the marker being non-causal and LD differences in the patient's ancestry. Dana might reject it because the marker isn't causal, and the LD difference means it's not a good proxy. Her rule likely combines causal relevance with statistical reliability, avoiding biases. 

  Alternative rules? Maybe one that weights pre-specification higher, or one that strictly avoids non-causal markers. But her acceptance of chest pain (non-causal but predictive) suggests she allows non-causal factors if they're stable predictors. The LD difference here undermines that stability.

  For a probe case, the user's idea of causal-but-tiny-n vs. non-causal-but-huge-n is good. But a sharper probe might be a class with high statistical power but known confounding vs. a small causal class with strong mechanistic evidence. Which would Dana choose? Her past choices suggest she'd avoid confounding over small n, but the rare mutation case implies she prefers larger classes even with less causality. 

  Inconsistency? Maybe in the rare mutation case—she uses broader class despite causality. But her rationale is that small n makes estimates unreliable. Consistency requires prioritizing statistical reliability over causal knowledge when data is sparse. 

  So for the new case: Dana likely rejects the marker stratum due to ancestry-specific LD differences, making the marker unreliable. Her rule emphasizes valid, transportable predictors. The probe case should test transportability vs. biological plausibility in unequal data scenarios.
answer: |-
  Based on Dana's pattern of decisions and the philosophy of probability intersecting with clinical biostatistics, here's a systematic breakdown of her implicit rule, alternative rules, predictions for your new case, and a definitive probe for distinguishing them.

  ### Candidate Rules Fitting Dana's Past Verdicts
  1.  **Causal Transportability Rule**:  
      *Use the narrowest reference class where:  
      (a) The class-defining variable(s) are on a causal pathway for the outcome OR are non-causal but transportable proxies with stable biological/epidemiological linkage;  
      (b) The class has sufficient sample size (n ≥ 1,000 for stable estimates);  
      (c) Selection into the class isn't a collider for unmeasured confounding.*  
      *Reject classes violating (a), (b), or (c).*  
      - **Fits her verdicts**:  
          - Chest pain class (causal symptom, sufficient n, no collider).  
          - Rejects "cat owners" (fails (a): no plausible causal link).  
          - Rejects angiography referrals (fails (c): collider bias).  
          - Uses causal biomarker subgroup (satisfies (a)-(c)).  
          - Rejects rare mutation (fails (b): insufficient n; fails (c): unmeasured modifiers).  
          - Rejects post-hoc subgroup (fails (a): no established causal/transportable link).

  2.  **Predictive Stability + Pre-Specification Rule**:  
      *Use the narrowest class with:  
      (a) Pre-specified, well-powered, replicated evidence;  
      (b) Mechanistic plausibility (causal or transportable);  
      (c) No evidence of selection bias.*  
      - **Fits her verdicts**:  
          - Chest pain (implied pre-specification in registries, plausible).  
          - Rejects cat owners (lacks (b)).  
          - Rejects angiography (violates (c)).  
          - Uses pre-specified causal biomarker (all satisfied).  
          - Rejects post-hoc subgroup (fails (a)).  
          - Rejects rare mutation (fails (a) and power).

  3.  **Collider-Averse Frequentism**:  
      *Maximize precision (narrow class) but only if:  
      (a) No collider bias is introduced by class definition;  
      (b) Estimate is statistically stable (SE < 5%, CI width < 15%);  
      (c) No competing causal knowledge undermines the class.*  
      - **Fits her verdicts**:  
          - Chest pain (stable, no collider).  
          - Rejects cat owners (violates (c): causal irrelevance).  
          - Rejects angiography (violates (a)).  
          - Uses causal biomarker (stable, no collider).  
          - Rejects rare mutation (violates (b)).  
          - Rejects post-hoc subgroup (violates (b) stability).

  ---

  ### Prediction for Your New Case
  - **Patient**: 61M with tag SNP (non-causal, high LD with functional variant).  
  - **Evidence**: Pre-specified, powered (n=12,000), replicated, large effect.  
  - **Wrinkles**: SNP inert; LD differs in his ancestry (underrepresented).  

  **Dana's Likely Verdict**: **Reject the marker stratum.**  
  - **Why?** Under all three candidate rules, the **ancestry-specific LD difference** violates core conditions:  
      - *Rule 1*: Fails (a) "transportable proxy" (LD not stable across ancestries).  
      - *Rule 2*: Fails (b) "mechanistic plausibility" (proxy breaks down in his group).  
      - *Rule 3*: Fails (c) "competing causal knowledge" (known ancestry effect on LD).  
  - She prioritizes biological validity over statistical power when they conflict. The SNP isn't merely non-causal—it's a *context-dependent proxy* with poor fidelity for *this patient*.

  ---

  ### Distinguishing the Rules: Your Proposed Probe vs. a Sharper Alternative
  - **Your probe**: "Causal-but-tiny-n vs. non-causal-but-enormous-n" (e.g., n=7 causal mutation vs. n=50,000 non-causal biomarker).  
    - *Problem*: All rules reject both (Rules 1/2/3 reject tiny-n; Rules 1/2 reject non-causal enormous-n). Fails to discriminate.  

  - **Sharper probe**:  
    - **Case A**: A class defined by a *non-causal but statistically perfect proxy* (e.g., ZIP code correlating r=0.99 with pollution exposure, n=10,000) vs. a *causal class with moderate n* (e.g., measured pollution exposure, n=300).  
    - **Case B**: A class with *high statistical stability but known unmeasured confounding* (e.g., pre-specified BMI subgroup where BMI is collider for diet/exercise, n=2,000) vs. a *causal class with slightly lower n* (e.g., direct adiposity measure, n=1,500).  

  ### How Rules Diverge:
  | Rule                | Case A (Non-causal proxy vs. Causal) | Case B (Confounded vs. Causal) |
  |---------------------|--------------------------------------|--------------------------------|
  | **1. Causal Transportability** | Uses causal class (n=300) | Uses causal class (n=1,500) |
  | **2. Predictive Stability**    | Uses proxy (n=10,000)      | Uses confounded class (n=2,000) |
  | **3. Collider-Averse**         | Rejects both? (proxy lacks biology) | Rejects confounded class (collider) |

  - **Dana’s consistency**: She’s likely following **Rule 1 (Causal Transportability)**. She rejects statistically optimal but biologically incoherent classes (cat owners, ancestry-mismatched SNP) and prioritizes causal fidelity. She’d choose the causal class in both probes.  
  - **Inconsistency?** Only if she *ever* prioritized non-causal proxies without transportability—but she rejected cat owners despite high n. The angiography rejection is consistent; chest pain is an *upstream* symptom (predictive, not collider), while angiography is a *downstream* decision (collider for unmeasured severity).

  ---

  ### Verdict & Refinement
  - **Dana’s implicit rule**: **Causal Transportability + Collider Avoidance + Statistical Stability**.  
  - **For your patient**: She rejects the SNP stratum due to LD breakdown in his ancestry. She’d use a broader class (e.g., "men >60 with [disease subtype]") or incorporate the SNP with ancestry-specific LD adjustment (if possible).  
  - **Philosophical resolution**: Her "reference class problem" admission acknowledges no class is perfect, but her verdicts reflect *epistemic responsibility*—using classes where error magnitude is quantifiable and biases are minimized. This bridges frequentism (error control) and Bayesianism (incorporating causal knowledge).  

  **Key insight**: Dana navigates the reference class problem by requiring classes to be **causally coherent or transportable**, **statistically stable**, and **bias-resistant**. The moment biology and statistics conflict (e.g., ancestry-dependent LD), biology wins. Your case exemplifies this: power ≠ validity.
