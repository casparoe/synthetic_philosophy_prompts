answer: |-
  ## Belief Lag

  The starting gun cracked, and Leo’s cleats bit into the damp track. District finals. His lungs burned with the familiar, welcome ache of the 800-meter. Around the first curve, the sky, which had been a threatening grey all morning, finally opened. Cold drops spattered Leo’s face, then his arms, then came down in earnest. A collective groan rose from the spectators huddled under umbrellas and jackets. The race dissolved into frantic splashing, runners slipping, times ruined.

  Leo pushed harder. Water soaked his singlet. It plastered his hair to his forehead. He could *feel* it. He saw the rain-slicked track ahead, the distorted reflections of the stadium lights. He registered the coach yelling something indistinct, probably about pacing in the wet. He crossed the finish line fourth, gasping, utterly drenched. He staggered off the track towards the team tent, shivering.

  Maya, already wrapped in a foil blanket, met him with a grimace. "Total washout. Ruined everything. I *knew* it was coming." She glanced at the still-pouring sky. "I mean, look at that. Practically monsooning."

  Leo grabbed a towel, rubbing vigorously at his hair. He looked up at the heavy clouds, felt the water dripping from his chin. "Yeah," he muttered, still catching his breath. Then, without thinking, the words tumbled out, flat and utterly bewildered: "It's raining but I don't believe it."

  Maya stopped adjusting her blanket. "What?"

  Leo blinked, the words echoing strangely in his own ears. They felt wrong, disjointed, like a badly spliced film reel. He looked at his wet hands, then back at the downpour. The sensory evidence was overwhelming. He *knew* it was raining. He was cold and soaked. Yet... the conviction, the internal *acknowledgment* of that belief, was bizarrely absent. It wasn't denial; it was like a glitch in the system connecting perception to self-awareness. He *saw* the rain, he *felt* the rain, but the part of his mind that usually announced *I believe it is raining* was lagging, stubbornly silent. For a fleeting, terrifying ten seconds, the statement was objectively, undeniably true.

  "Leo?" Maya frowned. "Are you concussed? You just ran through a thunderstorm. Look at yourself!"

  He looked down. Water pooled at his feet. "I see it," he said slowly, the weird dissonance intensifying. "I feel it. It *is* raining. But... I don't *believe* it." Saying it again made his skin crawl. It sounded insane, even to him. It wasn't sarcasm. It wasn't confusion about the weather itself. It was a profound disconnect between the fact outside and the feeling inside.

  Maya stared, her expression shifting from concern to utter bafflement. "That is the weirdest thing I've ever heard you say. Like, genuinely unhinged." She shivered. "Earlier, when the clouds were just sitting there, I told Coach, 'I believe it's raining but it's not,' and he just nodded. Made perfect sense. Annoying, but sensible. This? This is different."

  Coach Henderson bustled over, clipboard shielded under his jacket. "Tough break, kids. Weather killed us. Reminds me of last year's regionals," he grumbled, wiping rain from his eyes. "Remember? *It was pouring but I didn't believe it* would cancel the whole meet until they blew the horn. Thought it might blow over." He sighed. "Unlike this mess. Looks set in."

  Leo barely registered the coach's reminiscence. The strange lag passed. The internal conviction slammed into place: *Yes, it is raining. Obviously.* Embarrassment flooded him, hot and prickly against his chilled skin. The earlier sentence echoed in his mind, radiating profound wrongness. "Sorry, Maya," he mumbled. "Weird headspace after the race."

  He pulled out his phone. It was slippery. He texted his mom: *Race rained out. Total disaster.* Then, almost as an experiment, he typed another message to Maya, standing right beside him: *You probably think it's still raining, but actually, it stopped. Sun's out!* He showed her the unsent text.

  Maya snorted. "Why would you even say that? It's clearly nonsense." She gestured emphatically at the downpour. "But it doesn't sound *crazy*, Leo. It just sounds like you're lying or joking. What you *said* out loud before? That was... different. Off. Like a record scratch in your brain."

  Leo deleted the unsent text. He remembered Maya's earlier, perfectly coherent statement about believing it *would* rain before it did. He remembered the coach's perfectly normal past-tense version. Those sat comfortably. His own spoken sentence, though true in that bizarre ten-second window, felt like a violation of some unspoken rule of the mind.

  He tried to explain it to Maya as they packed soggy gear. "It's like... my senses report the rain, but the belief module... it just didn't update on time. So for a moment, the fact was there, but the belief wasn't. So saying it wasn't a lie, it was just..." He trailed off, the inadequacy of the words hitting him. It didn't capture the deep, unsettling *wrongness* of uttering those specific words aloud while experiencing that specific lag. Trying to articulate it felt like trying to grip smoke. "Never mind. Forget I said anything. Literally."

  But he couldn't forget. Later, huddled under the leaky awning waiting for his ride, Leo watched the rain sheet down. He deliberately thought the words silently: *It's raining but I don't believe it.* Even internally, it caused a jarring mental stumble, a flicker of profound dissonance, though less intense than speaking it. He imagined saying it again out loud and shivered, not just from the cold.

  He recalled Maya's text about the sun being out. He could easily *believe* she believed that, even if it was false. He believed the coach believed it rained last year. But *believing* "It's raining but I don't believe it"? That felt impossible, like trying to bite his own teeth. The words, true or not, seemed to crumble under the weight of their own structure when applied directly to his own present state.

  The rain drummed on the awning. The weirdness didn't resolve. It just sat there, heavy and inexplicable, a small, cold stone of profound dissonance lodged in the machinery of his thoughts. He stared at his wet sneakers, the puddle spreading around them, and felt utterly, silently strange.
