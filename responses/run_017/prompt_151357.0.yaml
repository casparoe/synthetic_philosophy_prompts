  ### Sestina: Six Variations on a Coffee-Hum  

  **Stanza 1**  
  The man hums four notes at a steady **tempo**,  
  grinding beans into a coarse, bright **grain**.  
  Steam rises; sound thins to a quick **decay**.  
  His voice lifts to a mid-range **register**,  
  filling the close, tile-small **room**  
  with sparse warmth, a low **density**.  

  **Stanza 2**  
  Layers cluster into thick **density**,  
  slowed to a syrup-drip **tempo**.  
  Echoes stretch the cramped **room**  
  into a well. Each vocal **grain**  
  sinks to a cavernous **register**,  
  holding without fade or **decay**.  

  **Stanza 3**  
  A sharp cut — no tail, no **decay** —  
  in a smog of muffled **density**.  
  Then the leap: a falsetto **register**  
  at a sprinting, skittered **tempo**.  
  The once-warm **grain**  
  now fractures the **room**.  

  **Stanza 4**  
  Walls dissolve to vaulted **room**  
  where notes drift in slow **decay**,  
  buried under silt-thick **grain**.  
  Pressed to crushing **density**,  
  the hum races at fevered **tempo**,  
  soaring to a scorched **register**.  

  **Stanza 5**  
  Now a basso profundo **register**  
  in a cupboard-tight **room**,  
  a tidal swell of **tempo**  
  before a gasping **decay**.  
  Thinned to wisp **density**,  
  each note: a lone **grain**.  

  **Stanza 6**  
  The **grain**  
  polished to a flat **register**,  
  airless **density**  
  in a vacuum-sealed **room**.  
  Silence swallows all **decay**  
  at a staggered, stuck **tempo**.  

  **Envoi**  
  We hear the **grain** and hollow **room**,  
  the **register**, the clipped **decay**,  
  then **density**, **tempo**... and a **glitch**.  

  ---

  ### Apparatus: Variation Log  

  | Stanza | Knob          | Setting                                   | Distance      | What the Rotation Does                                      |
  |--------|---------------|-------------------------------------------|---------------|-------------------------------------------------------------|
  | 1      | density       | Low, sparse warmth                        | Near          | Ends on emptiness, grounding the scene in intimacy.         |
  | 2      | decay         | Sustained without fade                    | Cousin        | Absence of decay elongates presence, warping time.          |
  | 3      | room          | Fractured by vocal grain                  | Far           | Shatters space, making containment violent.                 |
  | 4      | register      | Soaring to scorched heights               | Cousin        | Heightens urgency; pitch as emotional lever.                |
  | 5      | grain         | Isolated, thinned to wisps                | Far           | Exposes fragility; sound as solitary artifact.              |
  | 6      | tempo         | Staggered, stuck                          | Past Horizon  | Collapses momentum; time becomes paralysis.                 |
  | Envoi  | All + glitch  | Combined, then disrupted by error         | Horizon Shift | Gathers all knobs; **glitch** breaks sequence irreversibly. |

