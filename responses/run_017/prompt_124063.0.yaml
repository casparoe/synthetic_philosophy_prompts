  - Measure A: "Review session held in a different location (e.g., outdoors if weather permits, else as usual)" 
  - Measure B: "Review session will include a game of jeopardy"
  - Measure C: "Review session will be recorded and posted online"

  But note: in round 1, we might get nothing. In round 2, we might get different packages.

  But to make it real, we can say that the outcome of the sequential vote (round 2) will be implemented for the review session, and if no measures pass, then nothing special.

  But round 1 might also be implemented? But in round 1 we have the problem of over budget -> nothing. Then we do round 2.

  So after round 1, we have an outcome (nothing). Then we do round 2, and that outcome will be implemented.

  Timeline (60 minutes):

  0-5 min: Introduction. Explain the town and the measures. Show the costs and budget. Explain the preference cards: each student gets a card (we have 20 cards: 6 of group1, 6 of group2, 6 of group3, 2 of group4). Explain that they should vote sincerely based on their card. Explain the voting rule for round 1: each measure separately, majority passes. The package is the set that passes. But if the total cost exceeds the budget, then none are implemented.

  5-10 min: Distribute preference cards and answer any questions.

  10-15 min: Optional: allow 5 minutes of open deliberation. (The problem says: whether to allow five minutes of open deliberation before round one and what that will do to the result). In this setup, if they deliberate, they might realize that if they all vote for D and E, they can get at least that. But also, they might try to get their favorite expensive measures. But note: in round 1, they vote on each measure separately. During deliberation, they might form coalitions: for example, group4 might try to persuade others to vote against A, B, C to avoid over budget. But since they are only 2, they might not succeed. Or group1 might agree to vote against C to avoid over budget? But they don't care about C (negative) anyway. So it might not change. But if they coordinate, they might avoid the over budget by having one of A, B, C fail. For example, if group1 and group2 agree to vote against C, then C fails. Then the package would be A, B, D, E: cost 50+50+20+20=140 -> still over budget. If they try to have two of the expensive measures fail, say they agree to only have A pass, then A, D, E: 50+20+20=90 -> within budget. But who would agree? Group1 would want A, and maybe D and E. Group2 would want B and C, so they might not agree to only A. It's possible that during deliberation, they might not reach a consensus. So the result might be the same. Or they might avoid the over budget by having only two expensive measures and the cheap ones. But it's unpredictable. We can allow it and see what happens.

  15-25 min: Round 1 voting. By show of hands? Or we can have a ballot. We'll do a public vote for each measure: raise hands for yes. Count and record.

  25-30 min: Announce the results. Show the total cost. Since it will be over budget, announce that nothing is implemented. Then point out that there is a feasible package (D and E) that would have given everyone positive utility, but now we get nothing.

  30-35 min: Explain round 2. Randomly choose a student to be town clerk. They come up and set the order of measures (A,B,C,D,E) in any order they wish. Write the order on the board.

  35-50 min: Conduct the sequential vote. For each measure in the chosen order:
     - Announce the measure, cost, and remaining budget.
     - If cost > remaining, skip (or announce fails).
     - Else, vote by show of hands: majority passes.
     - If passes, subtract cost and update budget.

  50-55 min: Announce the package that passed in round 2. Explain that this package will be implemented for the review session (if any). Also, note the utilities for each group.

  55-60 min: Debrief.

  Debrief:
  - For round 1: 
     - Ask: "What happened? We passed measures that we couldn't afford. What does this show about referendums that vote on multiple issues separately?" 
     - We want them to note: even if each measure is popular, the combined cost might be too high. And there might be a feasible subset that is better than nothing, but we didn't get to vote on packages.
     - Map to: the problem of "fiscal illusion" or the lack of a budget constraint in separate votes.

  - For round 2:
     - Ask: "Why did we get a different outcome just by changing the order? What does that say about sequential decision-making in democracy?"
     - We want them to note: the order of voting can determine the outcome, and this can be manipulated (agenda setting).

  But without naming theorems, we want them to articulate the problems.

  What might go wrong:
  - A student might try to logroll: in the deliberation, they might say "I'll vote for your measure if you vote for mine". But in round 1, since they are voting on each separately, and they are not voting on packages, it might not help. In round 2, they might try to coordinate voting. But we assume non-strategic. If they do, you can remind them that in this exercise, we are assuming sincere voting.

  - A student might accuse you of stacking the cards: you can be transparent. Show the preference distribution and explain that it's designed to illustrate a point, and in real life, similar distributions occur.

  What the exercise cannot show:
  - The exercise shows the problem of separate votes causing over-budget and the problem of agenda control in sequential votes. But it does not show the problem of cycling majorities (Condorcet paradox) or the Arrow theorem, which are about preferences over packages. We are not voting on packages in round 1, but on individual measures. So for the case against multi-issue referendums, we are showing one specific issue (fiscal illusion) but not the issue of inconsistent preferences (which can lead to no stable outcome). You will have to state that.

  Preference cards example:

  For a Group1 voter:
  "Your preferences for the town measures:
  - Measure A (cost $50): You strongly support it. [Utility: +10]
  - Measure B (cost $50): You strongly support it. [Utility: +10]
  - Measure C (cost $50): You strongly oppose it. [Utility: -10]
  - Measure D (cost $20): You mildly support it. [Utility: +5]
  - Measure E (cost $20): You mildly support it. [Utility: +5]"

  Similarly for others.

  Budget: $100.

  Measures:
  - A: Build a new sports center ($50)
  - B: Build a new library ($50)
  - C: Build a new art museum ($50)
  - D: Provide free donuts at town events ($20)
  - E: Provide extra landscaping in the park ($20)

  But you can make up your own.

  Now, write out the timeline in detail.
answer: |-
  Below is a complete simulation design for your 60-minute discussion section on direct democracy and referendums. It meets your core requirements: a fixed budget, private preference cards with intensity (not just yes/no), and two voting rounds where pathologies emerge from sincere, non-strategic voting (no villains or ignorance). The first round shows how separate majority votes on individual measures can produce an **over-budget package that a majority would reject in favor of a feasible alternative**, while the second round demonstrates **agenda-setting power** (outcome swings on vote order alone). The design uses index cards for preferences, a projector to display measures/budget, and ties the outcome to your final review session for stakes.

  ---

  ### **Simulation Setup**
  **Fictional Town Context:**  
  *"We are the town council of 'Libertyville,' voting on 5 spending measures to improve our town. We have a fixed budget of $100,000. Our goal is to pass measures that reflect majority preferences, but we must stay within budget. If the total cost of passed measures exceeds $100,000, nothing is implemented—no partial implementation allowed."*

  **Measures & Costs (Projector Display):**
  | Measure | Cost ($000s) | Description |
  |---------|------|-------------|
  | **A**   | 60   | Build a new playground. |
  | **B**   | 60   | Renovate the library. |
  | **C**   | 60   | Install solar streetlights. |
  | **D**   | 30   | Fund a free lunch program for schools. |
  | **E**   | 30   | Plant trees in public parks. |

  **Budget:** $100,000 total.  
  **Key Pathology:** Any two of A/B/C ($120K) is over budget, but all three cheap measures (D + E = $60K) or one expensive + one cheap (e.g., A + D = $90K) are feasible. The preference cards ensure sincere voting leads to an over-budget outcome in Round 1.

  ---

  ### **Preference Cards (Private, on Index Cards)**
  Each card lists a voter type (1–4) and their **personal utility scores** for each measure (higher = stronger preference). Utilities are designed so voters sincerely support measures with positive scores and oppose those with negative scores.  
  **Distribution for 20 Voters (adjust for absences as noted):**
  - **Group 1 (6 voters):**  
    A: +10, B: -5, C: -5, D: +6, E: +6  
    *"You're a parent: You love playgrounds (A), dislike libraries (B) and streetlights (C), and value lunches (D) and trees (E)."*
  - **Group 2 (6 voters):**  
    A: -5, B: +10, C: -5, D: +6, E: +6  
    *"You're a student: You love libraries (B), dislike playgrounds (A) and streetlights (C), and value lunches (D) and trees (E)."*
  - **Group 3 (6 voters):**  
    A: -5, B: -5, C: +10, D: +6, E: +6  
    *"You're an environmentalist: You love streetlights (C), dislike playgrounds (A) and libraries (B), and value lunches (D) and trees (E)."*
  - **Group 4 (2 voters):**  
    A: -10, B: -10, C: -10, D: +8, E: +8  
    *"You're a budget hawk: You hate expensive projects (A, B, C) but love lunches (D) and trees (E)."*

  **Adjustments for Absences:**  
  - If **2 students are out (18 voters)**, remove 1 voter from Groups 1, 2, and 3 (so 5 each for Groups 1–3; Group 4 unchanged at 2).  
  - If **3 are out (17 voters)**, remove 1 voter from Groups 1, 2, 3, and 4 (so 5 each for Groups 1–3; Group 4 reduced to 1).  
  *Why this works:* The pathologies still fire because the majority thresholds scale (e.g., 10/18 or 9/17 for majority).

  ---

  ### **Stake: Ties to Final Review Session**
  - If **D passes**, the review session includes free coffee/donuts.  
  - If **E passes**, the review includes 2 bonus questions for extra credit.  
  - If **nothing passes** (e.g., over-budget in Round 1), the review is standard (no perks).  
  - **Round 2 outcome overrides Round 1** (since it’s sequential), so students have incentive to care about both rounds.

  ---

  ### **Voting Rules**
  - **Round 1 (Package Vote):** Separate majority votes on each measure (yes/no). Measures passing form the package. If total cost ≤ $100K, it wins. If over-budget, nothing passes.  
  - **Round 2 (Sequential Vote):**  
    1. Randomly pick 1 student as "Town Clerk" to set the voting order (e.g., A → D → B → E → C).  
    2. Vote on measures one by one. At each step:  
       - If measure cost ≤ remaining budget, hold a majority vote.  
       - If passed, subtract cost from budget.  
       - If failed or unaffordable, skip.  
    3. Final package = all passed measures (within budget).

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 60 minutes**  
  *Note: Deliberation is optional but recommended to show how communication fails to prevent pathology.*  

  | Time | Activity | Instructor Notes |
  |------|----------|-----------------|
  | 0–5 min | **Introduce simulation:** Display measures, costs, budget, and rules on projector. Emphasize sincere voting based on preference cards. | Explain: "You are well-informed, rational voters—no strategies or hidden agendas. Vote your true preferences." |
  | 5–10 min | **Distribute preference cards:** Hand index cards randomly. Answer questions. | Ensure cards stay private. If asked: "Don’t overthink—vote based on your card’s utilities." |
  | 10–15 min | **(Optional) Open deliberation:** Allow 5-min open discussion. Students may try to persuade others. | *Predicted effect:* Students might urge support for D/E, but Groups 1–3 focus on A/B/C. Deliberation **won’t prevent** over-budget outcome (see "Predictable Issues" below). |
  | 15–25 min | **Round 1 Voting:** Hold separate majority votes for each measure (A–E). Tally votes publicly. | Use show of hands. Record results on projector. *Expected outcome:* A, B, C pass (each gets 14–16 votes); D and E pass (20 votes). Total cost = $180K → **over-budget → nothing passes.** |
  | 25–30 min | **Reveal Round 1 outcome:** Highlight the pathology: "We passed popular measures, but now we get nothing. Is there a feasible package you’d prefer?" Point out D+E costs $60K and has +14 utility for all (better than 0). | Ask: "Who would prefer D+E over nothing?" (All hands raise). Emphasize: "This happened with sincere, rational voters." |
  | 30–35 min | **Set up Round 2:** Randomly pick a "Town Clerk." They set the voting order (e.g., "B, A, C, D, E"). Display order on projector. Reset budget to $100K. | Clerk chooses freely. Record order visibly. |
  | 35–50 min | **Round 2 Sequential Voting:** Vote on measures in order. Update budget after each vote. | *Example order B→A→C→D→E:*<br>- B passes (cost $60K; budget left: $40K).<br>- A fails (cost $60K > $40K → skip).<br>- C fails (unaffordable).<br>- D passes (cost $30K; budget left: $10K).<br>- E fails (unaffordable). **Package: B+D.**<br>*Different orders yield different outcomes (e.g., D→E→A→B→C passes D+E; A→B→C→D→E passes nothing).* |
  | 50–55 min | **Reveal Round 2 outcome:** Announce the package (e.g., "B+D") and its perks (e.g., "Library + Donuts"). | Contrast with Round 1: "Same voters, same preferences—why such a different result?" |
  | 55–60 min | **Debrief Discussion:** Ask open-ended questions. Map pathologies to theory *after* students respond. | Questions:<br>- "What surprised you in Round 1?" → **Fiscal illusion:** Separate votes ignore budget constraints.<br>- "Why did Round 2 depend on order?" → **Agenda power:** Sequence shapes outcomes.<br>- "Did deliberation help?" → **Coordination failure:** No mechanism to bundle trade-offs. |

  ---

  ### **Predicted Issues & How to Handle Them**
  1. **"You stacked the cards!" (e.g., Group 4 calls bias):**  
     - *Response:* "These preferences reflect real groups: taxpayers (Group 4), parents (1), students (2), environmentalists (3). The design ensures that even with fair voting, we get bad outcomes. Let’s see why."  
  2. **A student tries to logroll (e.g., "I’ll vote for your B if you support my A"):**  
     - *Response:* Gently interrupt: "Remember, we’re modeling non-strategic voting. Base decisions on your card, not deals." If they persist, allow it—it will likely fail (Group 4 won’t budge).  
  3. **Low engagement during deliberation:**  
     - *Response:* Assign roles: "Group 1, you’re parents—make your case for A!"  
  4. **Order effects aren’t extreme enough in Round 2:**  
     - *Response:* Use a "swing order" like A→B→C→D→E (nothing passes) vs. D→E→A→B→C (D+E passes). The stakes (donuts/extra credit) heighten contrast.  

  ---

  ### **What the Exercise Cannot Show**
  This simulation **does not demonstrate cycling majorities (Condorcet’s Paradox)**, where no stable majority preference exists. Here, preferences are structured to avoid cycling (all groups rank D/E highly), so the pathology arises purely from budgeting/agenda issues. In debrief, state:  
  > *"Real referendums also face ‘preference cycles’—where majorities prefer A>B, B>C, but C>A—making outcomes arbitrary. Our exercise focused on budget and sequencing, but cycles are another flaw in multi-issue votes."*

  ---

  ### **Why the Pathologies Fire**
  - **Round 1 (Over-budget failure):**  
    Groups 1–3 each love one expensive measure (A/B/C) and tolerate D/E. Sincere voting passes A, B, C (each wins 14–16 votes), and D/E (20 votes). Total cost ($180K) > budget → nothing passes. Yet **all 20 voters** prefer D+E ($60K) over nothing.  

  - **Round 2 (Agenda dependence):**  
    - If Clerk orders **cheap measures first (e.g., D→E→A→B→C):** D and E pass first ($60K), leaving $40K. A/B/C are unaffordable → **D+E wins** (Groups 1–4 get +12 to +16 utility).  
    - If Clerk orders **expensive measures first (e.g., A→B→C→D→E):** A passes ($60K), B passes (uses remaining $40K? No—B costs $60K > $40K, fails). C fails. D/E unaffordable → **Only A wins** (Group 1 happy; others dislike).  
    - *Outcome swings on order:* D+E (high utility for all) vs. A (only Group 1 happy).

  Run this as-is, and students will "collide with the problem" through lived experience. Good luck!
