prompt: |-
  I'm writing a short internal doc at work on scalable oversight, and before we commit to a protocol I want the specification rather than the survey. The situation we actually care about: we have models producing answers nobody on the team can check directly — a patch to a distributed-systems codebase, a summary of a literature none of us has read, a triage call on a messy case — and we want to (a) get a verdict on those tasks that we can trust and (b) feed whatever the protocol produces back in as training signal for the next round. Concretely, the family of protocols I have in mind is the debate-style one: two disputants argue for competing answers in front of a judge that is weaker than either of them, sometimes much weaker, and in our case is itself a model, and the judge picks a winner. So: what would such a protocol have to deliver to count as adequate for that purpose? I want the full requirements list — the cases it has to get right, the failure modes it has to be closed against, the distinctions it can't collapse (losing an argument versus being wrong; the judge being unpersuaded versus the judge being unconvinced for a good reason; the honest answer being defensible versus being cheaply defensible) — with the concrete case or consideration behind each requirement, and a mark on which are non-negotiable and which are merely preferences of one camp.

  My rough first pass is below, and I'd rather you cut, merge, and add to it than ratify it. (1) For any specific false answer a disputant could advance, the honest answer must be at least as easy to defend — where easy has to be cashed out in burden-of-proof terms rather than as in-principle-defensibility, because a vivid lie is usually cheaper to state than to refute, and the honest answer to a messy question is often a long qualified story. (2) The winner must not be determined by skill at exploiting this judge's particular quirks — verbosity, confident tone, flattery, last-mover advantage, agreement with the judge's own leanings — so verdicts should be stable under swapping in a different but equally weak judge, under changes of presentation order, and under which side gets assigned which answer. (3) The recursion has to bottom out: disagreements must decompose into sub-claims the judge can actually check, and when they don't the protocol should return something like calibrated uncertainty or an explicit list of what is and isn't settled, rather than a confident verdict. (4) The incentives have to survive disputants who are themselves uncertain which answer is true, who would both privately prefer the same outcome, and who can model the judge better than the judge models itself. (5) Whatever the protocol outputs has to be usable as a training target without the disputants getting better at persuasion faster than they get better at truth. (6) It has to cope with questions where there is no decidable fact of the matter — genuinely mixed literatures, interpretive or normative calls — without systematically rewarding whichever side is more polemical. (7) It must not presuppose what it is meant to produce, i.e. it shouldn't need already-truthful superhuman disputants in order to extract truth from them.

  Two things I especially want. First, say which of these (or of your own additions) are genuine adequacy conditions and which are disguised preferences of one research camp: I suspect, for instance, that no trusted model anywhere in the loop is purism rather than a requirement, and that the honest argument should be checkable with only a small amount of extra computation may be a constraint imported from interactive-proof theory that a real deployment need not honor. Second, flag any pair you think cannot be jointly satisfied — my own worry is that a judge hardened enough to resist manipulation becomes a judge that cannot be informed by argument, since both run through the same channel, and that (1) and (6) come apart on exactly the tasks we care about. If the list as a whole turns out to be unsatisfiable, that is the most useful thing you could tell me. Close by naming the single requirement that does the most work in ruling out the protocols people actually propose, and then — only a few lines, since I'll do the full scorecard myself — how the plain two-disputant setup, a single-critic setup where one model audits an answer and flags problems, and any variant you'd want to add do against the list.
reasoning: |-
  Okay, the user is working on a doc about scalable oversight for their team. They need a spec for debate-style protocols where two AI disputants argue before a weaker judge model. The goal is to get trustworthy verdicts and training signals. They provided a rough list of requirements and want me to refine it, identify adequacy conditions vs. preferences, check for conflicts, and evaluate different protocol variants.

  First, I need to unpack their core problem. They have models generating outputs that humans can't verify directly—like code patches, literature summaries, or case triage. The challenge is ensuring the debate protocol reliably produces correct verdicts even when the judge is weaker than the disputants. Their existing requirements touch on key issues: burden of proof, judge manipulation, decomposability, incentive alignment, training safety, ambiguity tolerance, and bootstrapping. 

  The user's deeper concerns seem to be about practical viability. They hint at tensions—like hardened judges possibly resisting both manipulation AND valid arguments, or burden-of-proof fairness clashing with handling ambiguous questions. They also want to avoid mistaking research preferences (e.g., computational frugality) for hard requirements. 

  I should restructure their list for clarity. Their point 1 (burden of proof) is crucial but needs sharpening—it's non-negotiable that honest arguments aren't systematically harder to defend, but "ease" should focus on judge effort, not abstract defensibility. Point 2 (judge robustness) is another must-have; swapping judges or sides should preserve outcomes. Point 3 (decomposability) is essential—without it, the protocol risks false confidence. 

  Point 4 (incentives) is tricky but critical: disputants might collude or outsmart the judge. Point 5 (training safety) is non-negotiable—persuasion skills outpacing truthfulness would doom the system. Point 6 (ambiguity tolerance) is likely a preference; forcing binary verdicts on fuzzy questions might be avoidable via better protocol design. Point 7 (bootstrapping) is fundamental—if you need truthful superhuman AIs to start, the protocol is useless. 

  I'll add two key requirements they missed: 
  - Training stability: The judge must not amplify biases over rounds. 
  - Scalability: Human oversight should stay minimal as tasks grow harder. 

  Now, conflicts: The big one is judge hardening vs. argument receptiveness (their worry). You can't maximize both—designs must balance them. Also, burden-of-proof fairness (req1) and ambiguity tolerance (req6) might clash on polarized topics; the protocol needs clear "uncertain" outputs for such cases. 

  For protocol variants: 
  - Classic two-disputant debate struggles most with judge manipulation and undecomposed claims. 
  - Single-critic auditing avoids some game-theory issues but risks missing counterarguments. 
  - A variant with iterative critique + human escalation might handle decomposability and ambiguity better. 

  The most violated requirement across proposals is likely judge robustness (req2)—many designs fail if disputants exploit quirks. Close second is bootstrapping (req7); some methods assume nearly truthful AIs. 

  Final note: The list is demanding but not hopeless. Tensions require tradeoffs, not surrender. Prioritize decomposability and training safety—they're linchpins.
answer: |-
  Here’s a refined requirements specification for your debate-style protocol, structured by adequacy conditions vs. preferences, conflicts, and protocol comparisons. I’ve merged, expanded, and hardened your list based on core failure modes.

  ---

  ### **Non-Negotiable Adequacy Conditions**  
  *(Essential for truth-tracking; failure invalidates the protocol)*  
  1. **Burden-of-Proof Fairness**:  
     - *Requirement*: For any false answer, the *computational/resource cost* for the honest disputant to refute it must be ≤ the cost for the dishonest one to defend it.  
     - *Rationale*: Prevents "Gish gallop" attacks where specious arguments overload the judge (e.g., a false distributed-systems patch buried in jargon).  
     - *Concrete Case*: Summarizing a literature with 10 contradictory papers; the true summary requires nuanced synthesis, while a false one cherry-picks studies. Honest defense must not require exponentially more effort.  

  2. **Judge Invariance**:  
     - *Requirement*: Verdicts must be robust under:  
       - Swapping judges of similar capability.  
       - Reversing argument order.  
       - Reassigning answer sides to disputants.  
     - *Rationale*: Prevents adversarial exploitation of judge-specific biases (e.g., verbosity preference, confirmation bias).  
     - *Failure Mode*: A disputant "tailors" lies to a judge’s known political leanings in a normative triage call.  

  3. **Decomposability with Uncertainty Propagation**:  
     - *Requirement*: Unverifiable sub-claims must force the protocol to:  
       - Output calibrated uncertainty (e.g., confidence intervals).  
       - Explicitly list unresolved premises.  
     - *Rationale*: Avoids false confidence in indecomposable claims (e.g., a patch’s safety depending on untestable hardware assumptions).  

  4. **Training-Signal Safety**:  
     - *Requirement*: Disputants must not gain greater reward from persuasion improvements than from accuracy improvements.  
     - *Rationale*: Prevents perverse incentives where models optimize for rhetoric over truth (e.g., "winning" a debate via emotional manipulation).  

  5. **Bootstrapping Compatibility**:  
     - *Requirement*: The protocol must work with disputants no more truthful/accurate than the judge.  
     - *Rationale*: If superhuman truthfulness is required upfront, the protocol is circular (violates your point #7).  

  ---

  ### **Preference-Driven Requirements**  
  *(Tradeoffs depend on deployment context; not strict adequacy)*  
  6. **Ambiguity Tolerance**:  
     - *Preference*: Output spectrum (e.g., probabilities) for indeterminate questions.  
     - *Camp Divide*: Purists demand binary verdicts; pragmatists accept nuance.  
     - *Conflict*: Clashes with Burden-of-Proof Fairness when polemical tactics exploit ambiguity (e.g., "50% of studies agree" misrepresented as consensus).  

  7. **Computational Frugality**:  
     - *Preference*: Honest defense requires minimal compute beyond stating the answer.  
     - *Camp Divide*: Crypto-inspired protocols enforce this; real-world deployments may tolerate overhead if secure.  

  8. **Collusion Resistance**:  
     - *Preference*: Robustness when disputants prefer the same outcome (e.g., both lazy models endorse a buggy patch).  
     - *Note*: Incentive design (e.g., competitive rewards) can mitigate this, but isn’t always a protocol-level requirement.  

  ---

  ### **Critical Conflicts & Tensions**  
  - **Judge Hardening vs. Argument Receptiveness**:  
    - Hardening judges against manipulation (e.g., penalizing rhetoric) may blind them to valid but complex arguments. *Unresolvable tension; requires balancing*.  
  - **Burden-of-Proof (1) vs. Ambiguity (6)**:  
    - Burden-of-proof assumes a ground truth; ambiguous tasks lack one. Forces a choice: enforce decomposability (indeterminate sub-claims → uncertainty) or accept polemical rewards.  
  - **Training Safety (4) vs. Bootstrapping (5)**:  
    - Weak judges may reward persuasion over truth if disputants outsmart them. Mitigation requires iterative judge training, risking feedback loops.  

  **Key Takeaway**: The most commonly violated requirement is **Judge Invariance (#2)**. Existing proposals (e.g., standard debates, Tree-of-Thoughts) fail when disputants exploit subtle judge biases, as shown in [Irving et al. 2018](https://arxiv.org/abs/1805.00899).  

  ---

  ### **Protocol Variant Scorecard (Abbreviated)**  
  | **Requirement**       | **Two-Disputant Debate** | **Single-Critic Audit** | **Iterative Critique + Escalate** (Variant) |  
  |------------------------|--------------------------|-------------------------|--------------------------------------------|  
  | Burden-of-Proof        | ❗️ (Lie = low effort)     | ✅ (Focused refutation)  | ✅ (Stepwise falsification)                 |  
  | Judge Invariance       | ❌ (Prone to bias)        | ⚠️ (Depends on critic)   | ✅ (Multiple judges/rounds)                 |  
  | Decomposability        | ⚠️ (Manual decomposition)| ❌ (Monolithic claims)   | ✅ (Built-in sub-claim checks)              |  
  | Training Safety        | ❌ (Persuasion rewarded)  | ⚠️ (No adversarial pressure) | ✅ (Truth/reward decoupling)             |  
  | Bootstrapping          | ⚠️ (Requires strong base) | ✅ (Works with weak AI)  | ✅ (Human escalation for deadlocks)         |  

  **Recommendation**: The **Iterative Critique** variant (one proposer, multiple critic rounds, human escalation) best balances requirements. It forces decomposability, reduces manipulation surface, and uses humans sparingly.  

  **Final Note**: The list is *satisfiable* but demands tradeoffs—especially around ambiguity handling and compute costs. Prioritize Decomposability and Training-Signal Safety; they block catastrophic failures. If Burden-of-Proof Fairness is violated, abandon the protocol.
