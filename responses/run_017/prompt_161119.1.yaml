answer: |-
  Here is a specification for a theory of valid consent, derived from your cases and philosophical desiderata. It prioritizes the phenomena to explain and the distinctions to respect, highlighting tensions and non-negotiables.

  **Core Desiderata & Phenomena to Explain (Non-Negotiables in Bold):**

  1.  **Distinguish Consent from Non-Consent:** The theory must provide clear grounds for differentiating genuine consent from mere acquiescence, permission, or submission.
      *   *Requirement from:* All cases, especially the marital "yes" (acquiescence vs. consent?) and the data toggle (permission by default vs. consent?).
  2.  **Explain the Validity/Invalidity Distinction:** The theory must account for when consent is *invalid* (rendering the act impermissible) vs. when consent is *valid but unwise or regrettable* (the act is permitted, but perhaps blameworthy or tragic).
      *   *Requirement from:* Surgeon case (invalid consent due to non-disclosure?) vs. Home aide case (valid consent under pressure? Regrettable but binding). The marital "yes" also probes this.
  3.  **Respect the Scope Problem:** Consent is always consent *to X under description Y*. The theory must explain how misdescription or misunderstanding of X/Y invalidates consent.
      *   *Requirement from:* Surgeon case (consent to "surgery with ordinary risks" vs. "surgery risking *this specific* career-ending outcome"). Data toggle (consent to "using the app" vs. "sharing biometric data").
  4.  **Address Competence Thresholds:** The theory must define competence (decision-making capacity) and explain how it varies with stakes/context. It must handle fluctuating competence (like Marit's).
      *   *Requirement from:* Marit's refusal/forgetting (is competence present at refusal? Does forgetting refusal invalidate prior consent?). Surgeon case (competence assumed, but was the *decision* competent without full info?).
  5.  **Require Voluntariness (Minimal):** The theory must exclude consent obtained through coercion, incapacitation, or severe deception.
      *   *Non-Negotiable Requirement from:* Foundational in ethics/law. Home aide case tests the boundary (economic pressure vs. coercion?). Marital "yes" tests subtle pressure.
  6.  **Enable External Reliance (Minimal):** The theory must allow third parties (son, surgeon, husband, reader) to identify *reliably enough for practical purposes* when consent is valid, even if internal states are complex.
      *   *Non-Negotiable Requirement from:* Institutional necessity (research protocol, contract, surgery). Son needs to know if he can rely on the advance directive. Surgeon/hospital need reliance on consent form.
  7.  **Account for Temporal Persistence & Identity:** The theory must grapple with consent given by a past self when the current self (due to value change or cognitive decline) might object, and whether the prior consent binds.
      *   *Requirement from:* Marit's case is paramount. The core tension: "different people" to some degree. Does the advance consent bind the refusing self? Who is the relevant "self" for consent?

  **Contested Desiderata / Potential Preferences:**

  8.  **Role of Reasons:** Must consent be given for "good" reasons? Or are reasons irrelevant to validity, only mattering for wisdom?
      *   *Contested:* Your marital case ("wish to keep the evening quiet") pushes this. Many theories treat reasons as irrelevant to *validity* (a content-independent power) but crucial for evaluating the *act* of consenting. A *preference* for requiring "good faith" or "appropriate" reasons risks moralizing consent.
  9.  **Moral Permissibility of Act:** Must the act consented *to* be morally permissible for the consent to be valid? Or can one validly consent to impermissible acts (waiving fundamental rights under duress?)?
      *   *Contested:* This is a major split between "moralized" and "non-moralized" theories. Your cases don't *force* moralization; the surgeon's act might be wrong due to non-disclosure *without* needing the consent itself to be invalid *because* the act was wrong. Treating this as a requirement is likely a *preference* (of moralized theories) rather than a core necessity.
  10. **Depth of Understanding:** How much must the consenter understand? Is "skimming the screen" (data toggle) sufficient? Is the surgeon's omission fatal? This relates to Scope and Competence but specifies the informational threshold.
      *   *Contested:* The line between material and immaterial information (surgeon) is inherently fuzzy. Is understanding the *nature* of the act enough, or must one grasp *all* material consequences? A sliding scale tied to stakes/competence is plausible but complex.

  **Key Tensions & Joint Unsatisfiability:**

  *   **Internal Attitude vs. External Reliance:** A purely internal attitude view (consent = a mental state) makes external reliance impossible. A purely performative view (consent = the speech act) risks ignoring genuine internal dissent (marital "yes") or incompetence (Marit's refusal). *Your literary need heightens this tension.* **No theory perfectly satisfies both.** Hybrids are needed, prioritizing external acts for reliance but acknowledging internal states for validity assessment (e.g., was the act performed competently/voluntarily?).
  *   **Persistence vs. Current Wishes:** Marit's case embodies this. Binding advance directives require prioritizing the past competent self's wishes over the current incompetent (and objecting) self's expressions. Theories emphasizing current autonomy/expression will struggle here. **These two pulls (binding precedent vs. current expression) are fundamentally at odds in cases of radical cognitive change.** Your case *requires* acknowledging this conflict; the theory won't resolve it neatly.
  *   **Voluntariness Threshold:** Defining the line between permissible persuasion/pressure (home aide negotiation) and impermissible coercion/undue influence is notoriously difficult and context-dependent. No bright line satisfies all intuitions.

  **The Knock-Out Requirement:**

  **External Reliance.** Giving this up allows for purely internal attitude theories. But these fail catastrophically for your cases: the son, surgeon, husband, and app developer *could never know* if they had permission to act. Reliance on contracts, medical procedures, and daily interactions becomes impossible. This requirement forces the theory to have a significant performative/public act component, knocking out purely mental-state accounts.

  **Scoring the Three Families of Views:**

  | Feature                  | Attitudinal (Mental State)                       | Performative (Speech Act/Expression)         | Moralized (Permissible Terms/Circumstances)     |
  | :----------------------- | :----------------------------------------------- | :------------------------------------------- | :---------------------------------------------- |
  | **Internal POV**         | **Excellent** (focuses on character's mind)      | Poor (focuses on expression, not feeling)    | Variable (depends on why terms are impermissible) |
  | **External Reliability** | **Very Poor** (others cannot access mental state) | **Good/Excellent** (focuses on observable act) | Good (relies on judging permissibility)         |
  | **Marit (Advance vs Refusal)** | Problematic (Which mental state counts?)       | Strong (Advance directive = valid performative act) | May invalidate if deemed exploitative          |
  | **Home Aide (Pressure)** | May see valid consent if internal assent exists | Strong (Signed contract = valid expression)  | May invalidate if pressure deemed "undue"       |
  | **Surgeon (Non-Disclosure)** | Weak (Did she *truly* assent without key info?) | **Problematic** (She signed the form!)       | **Strong** (Non-disclosure makes act impermissible) |
  | **Data Toggle (Default)** | Very Weak (No active mental assent likely)       | **Problematic** (Inaction interpreted as consent?) | May invalidate as deceptive practice            |
  | **Marital "Yes"**        | **Strong** (Captures internal reluctance)        | Weak (She said "yes")                        | May deem pressure impermissible                 |
  | **Key Strength**         | Fidelity to inner experience                     | Enables social coordination & reliance       | Ensures consent isn't used for harm/exploitation |
  | **Key Weakness**         | Impractical, ignores reliance needs              | Can validate "wooden" consent (Marit's refusal, surgeon's form) | Conflates validity of consent with morality of the act |

  **Recommendation for Revision:**

  1.  **Anchor in Performative Core:** For *external* validity and reliance (son, surgeon, contract, data policy), treat consent as a public act (signing, saying "yes," clicking "agree") performed by someone meeting a **minimal threshold of competence and voluntariness** (excluding overt coercion/deception/incapacity). This provides the necessary external anchor.
  2.  **Use Narration for Complexity:** Use the close-third POV to explore the *internal* gaps between the performative act and the character's mental state – the reluctant "yes," the skimmed screen, the forgotten refusal, the pressure felt but unspoken. Show *why* the external act might feel hollow or problematic internally, even if it's "valid" externally.
  3.  **Highlight Key Tensions Explicitly:** Don't resolve Marit's tension neatly. Let the son, the reader, and Marit's fleeting self wrestle with the conflict between the advance directive and her daily "no." Make the surgeon's omission a point of moral failure *in the surgeon's character/judgment* (violating disclosure norms), potentially distinct from the legal validity of the signed form. Show the husband suspecting the "yes" isn't wholehearted, even if he can't name the pressure. Make the data toggle a symbol of passive complicity rather than active consent.
  4.  **Clarify Scope:** Ensure the *description* of what is consented to is clear in each scene. What exactly did Marit consent to in the protocol? What specific risks *were* listed for the pianist? What does the aide's contract *actually* say? What did the husband ask for? Ambiguity here is the enemy of clear consent.

  By separating the *external validity* (primarily performative, meeting minimal competence/voluntariness thresholds) from the *internal richness and potential moral failings* surrounding the act, you can satisfy both the need for narrative depth and the reader's (and other characters') need to understand whether the act was procedurally permissible. The theory doesn't resolve all the ethical dilemmas (especially Marit's), but it provides the framework to render them with precision and force.
