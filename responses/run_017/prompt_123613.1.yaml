  Second, they're concerned about reflexivity - where the disposition depends on beliefs about its own failure. This challenges the simple conditional analysis (SCA). Their friend suggests modifying SCA's antecedent (e.g., "if only a few percent withdraw"), which feels like cheating to them.

  Third, they want honesty about the framework's limitations:
  - Can it distinguish panic-driven runs from genuine insolvency?
  - Does it explain timing of runs?
  - Does the intrinsic/extrinsic distinction hold when expectations define reality?

  The user values precision but also intellectual humility - they'd prefer acknowledged silence over forced answers. Their materials science background suggests comfort with threshold phenomena and metastable states (like bank fragility), while their philosophical newcomer status means avoiding jargon where possible.

  Key insights forming:
