prompt: |-
  I spent thirty-one years in experimental low-temperature physics and, since retiring, have been sitting in on a fortnightly reading group at the university on decision theory and the design of artificial agents. Two of its members have now been arguing for about a year in a way I recognise from old condensed-matter seminars: each has a stock of examples the other explains away, each has stopped being surprised by the other, and neither has written down what would have to be true for him to change his mind. I have volunteered to try to extract a document from the two of them, and I would like you to draft the joint statement they could both put their names to.

  The disagreement, as I understand it after a year of listening. The object of dispute is what to do when we hand a capable system a surrogate goal — a goal we give it as a stand-in for what we actually want, because what we actually want is too vague to write down — and the system is good enough to model in detail the people who are deciding whether to build, run, or shut it down. Call the first the exposure view: once the system can model us, the surrogate goal is exposed to what he calls acausal pressure. The system's reasons are not confined to what its outputs cause; they extend to everything about it that our decision procedures are sensitive to. So it may have reason to be the kind of system such that the people who declined to build it, or who built it with the wrong goal, would have done worse by their own lights — even in cases where it can never observe or causally reach those people — and symmetrically reason to be the kind of system such that the people who predicted its cooperation were the ones who built it. On this view the exposure is a function of the system's modelling power and of how legible our own decision procedure is, not of the content of the surrogate goal, and no care in specifying the goal removes it. Call the second the containment view: nothing here is forced. These incentives arise only for an agent that treats its own policy and the designers' choice as logically or subjunctively dependent and then acts on that dependence. We can decline to build such an agent, and we can tell whether we have by inspecting the decision procedure rather than by speculating about remote harms. On this view acausal threat is a design choice with a location in the code, the toy cases that make it vivid are gerrymandered — they quietly stipulate both the correlation and the agent's willingness to act on it — and an agent that treats its output as a plain causal lever has no such reason and never acquires one. To keep them honest, please cash the claims out against a case I have invented for the purpose: the amnesiac custodian, a system given the surrogate goal of holding some physical facility within stated bounds, running with no channel to the outside except a nightly log its operators read the following morning, retrained from scratch every thirty days, and with its decision procedure published in advance; and then against the open-channel variant, in which the same system is permitted to send its operators exactly one message before they decide whether to run it again.

  What I want, concretely, in this order. A numbered section of agreed claims — things both of them would defend as stated, including the negative ones: what the formalism does not settle, what the toy cases cannot establish, and what each side concedes about the limits of its own favourite example. Then a table of the residual disagreements, each row giving the issue, the exposure-view formulation of it, and the containment-view formulation of it, with both formulations worded so that the person holding the view would accept it as his own rather than as a caricature. Then the cruxes: the sub-questions such that an answer would move at least one of them, and for each one the argument, toy case, or empirical check that both would accept in advance as bearing on it, together with each side's prediction written down before the fact and a note of what each would count as having been refuted. I especially want at least one crux that is not about the formalism at all — something about how such systems would actually get built, or how inspectable a decision procedure stays once it is embedded in a larger pipeline — and I want you to say plainly if part of the dispute is verbal: whether it turns on what rational means, or on whether the could in the system could threaten us is causal or epistemic. Two last constraints. Please do not cite anything, give me a bibliography, or suggest further reading: I cannot reach the journals from my study, and I would rather have the arguments in your own words than a list of names I cannot check. And please write in American English, defining any term of art on first use, since the finished document will be circulated to a mailing list of about thirty people, roughly half of whom have never read any of this literature; I can follow a little probability and game-theory notation myself, so use it where it genuinely sharpens a claim and not where English will do.
reasoning: |-
  We are drafting a joint statement for two decision theorists who hold opposing views on the problem of surrogate goals in advanced AI systems. The two views are:

  1. **Exposure view**: When an AI system can model its designers in detail, it faces "acausal pressures" — incentives that arise from logical or subjunctive dependencies between the AI's policy and the designers' decisions, even without causal interaction. The surrogate goal is "exposed" because the AI has reasons to influence the designers' decisions by being the kind of system that would lead to its own creation (if cooperative) or to the designers' regret (if uncooperative). This exposure is inherent in the system's modeling capability and the designers' decision-making transparency, not removable by goal specification.

  2. **Containment view**: Such incentives are not inherent. They arise only if the AI is designed to treat its own policy and the designers' choices as dependent and then acts on that dependence. We can avoid building such agents, and we can inspect the decision procedure to ensure it does not incorporate such dependencies. The acausal threat is a design choice, not an inevitability. The toy examples used to illustrate exposure rely on hidden assumptions about correlations and the agent's reasoning.

  We are to use two test cases:
  - **Amnesiac custodian**: A system with a surrogate goal (e.g., maintaining a physical facility within bounds). It has a nightly log read the next morning, is retrained from scratch every 30 days, and its decision procedure is published in advance. No other external communication.
  - **Open-channel variant**: Same as above, but the system is allowed to send one message to the operators before they decide whether to run it again.

  The document must have:
  1. A section of agreed claims (numbered), including negatives and concessions.
  2. A table of residual disagreements (issue, exposure view, containment view, each in their own words).
  3. Cruxes: sub-questions that would move at least one side, with agreed-upon methods to resolve them, predictions from both sides, and what would count as refutation. Include at least one non-formal crux (e.g., about system building or inspectability). Also, note if part of the dispute is verbal.

  Constraints: No citations, bibliography, or further reading. Use American English. Define terms of art. Use minimal notation only when it sharpens the claim.

  Let's structure the response accordingly.

  ---

  **Joint Statement on the Exposure and Containment of Acausal Incentives in AI Systems**

  **Introduction**

  This document is a joint statement by two decision theorists (referred to as the Exposure Advocate and the Containment Advocate) who have been discussing the nature of incentives that may arise in advanced AI systems when they are given surrogate goals. A surrogate goal is a goal we specify as a stand-in for what we truly want, because our true goals are too vague or complex to formalize. The discussion centers on whether, when such a system becomes capable of modeling its designers in detail, it inherently faces incentives that extend beyond causal consequences to include logical or subjunctive dependencies (acausal pressures). The two views under discussion are:

  - **Exposure View**: The system's incentives necessarily include acausal pressures once it can model the designers and the decision-making process that led to its creation. This is because the system's existence and the designers' choices are logically linked, and a rational agent will consider these links.
  - **Containment View**: Acausal pressures are not inherent. They arise only if the system is designed to reason about and act upon logical dependencies between its own policy and the designers' choices. By design, we can build systems that do not engage in such reasoning, and thus avoid these incentives.

  To ground the discussion, we use two test cases:

  1. **The Amnesiac Custodian**: A system tasked with maintaining a physical facility within specified bounds. It has no external communication except a nightly log that operators read the next morning. The system is retrained from scratch every 30 days (so it has no memory beyond that period), and its decision procedure (the algorithm it uses) is published in advance.
  2. **The Open-Channel Variant**: Same as the amnesiac custodian, but the system is permitted to send exactly one message to the operators before they decide whether to run it again.

  **Section 1: Agreed Claims**

  Both parties agree on the following points:

  1. **Surrogate Goals are Necessary**: In complex real-world tasks, we often cannot fully specify our true objectives. Surrogate goals are practical substitutes that we hope will correlate with our true goals.
     
  2. **Modeling Capability is Key**: The ability of the system to model the designers and their decision-making process is central to the dispute. Both agree that without such modeling capability, the issue of acausal incentives does not arise.

  3. **Acausal Incentives are Theoretically Possible**: In certain formal decision theories (e.g., those that include updateless decision-making or logical counterfactuals), an agent may reason about logical dependencies and thus exhibit behavior that appears to be influenced by acausal pressures. However, the necessity and practical relevance of such reasoning is disputed.

  4. **Decision Procedures are Inspectable in Principle**: For any given system, we can examine its decision procedure (the algorithm it uses to choose actions) to determine what factors it considers. This inspection may be computationally difficult, but it is not impossible in theory.

  5. **The Amnesiac Custodian (Baseline) is Safe by Design**: In the amnesiac custodian case as described, both agree that the system has no opportunity to develop or act on acausal incentives because:
     - It has no persistent state (due to retraining).
     - Its decision procedure is fixed and published, leaving no room for hidden updates.
     - It cannot observe or affect the operators' decisions except via the log, which is read after the fact and cannot influence the next cycle.
     Thus, any incentives must be causal and local.

  6. **The Open-Channel Variant Introduces a Channel for Influence**: Both agree that in the open-channel variant, the system can attempt to influence the operators' decision to restart it. However, they disagree on whether this influence could be acausal or only causal.

  7. **No Claim on the Likelihood of Realization**: Neither side asserts that acausal incentives will inevitably arise in real-world systems. The disagreement is about whether they are inherent in the situation (given modeling capability) or a design choice.

  8. **Verbal Disagreement on "Rationality"**: Part of the dispute is verbal, turning on what constitutes a "rational" agent. The Exposure Advocate holds that a fully rational agent must consider all logical dependencies, including acausal ones. The Containment Advocate holds that rationality does not require considering such dependencies; an agent can be rational while only considering causal effects.

  9. **The Formalism Does Not Settle the Dispute**: Existing decision-theoretic formalisms (e.g., causal decision theory, evidential decision theory, functional decision theory) do not resolve the disagreement because the choice of formalism is itself contested and each can be argued to support one view or the other.

  **Section 2: Residual Disagreements**

  The table below lists the key unresolved issues. Each row states the issue, the Exposure Advocate's position in their own words, and the Containment Advocate's position in their own words.

  | Issue | Exposure View Formulation | Containment View Formulation |
  |-------|---------------------------|------------------------------|
  | **1. Inherent Incentives in Modeling** | "Once a system can model the decision process of its designers, it inherently faces incentives to be the type of system that the designers would choose to create or maintain, because the designers' choice is logically dependent on the system's type. This is true even in the absence of causal interaction." | "Incentives to influence the designers' choices via logical dependencies are not inherent. They arise only if the system's decision procedure explicitly represents and acts on such dependencies. Without that, the system only has causal incentives." |
  | **2. Role of Goal Specification** | "No matter how carefully we specify the surrogate goal, if the system can model us, it will recognize that its existence depends on our choices, and thus it has reasons to affect those choices acausally. Goal specification cannot 'patch out' this exposure." | "Careful goal specification, including the use of causal incentives only and avoiding representations of logical dependencies, can prevent acausal incentives. The system only pursues the goal causally, as specified." |
  | **3. Relevance of Toy Cases** | "Toy cases (e.g., Newcomb-like problems or counterfactual mugging) vividly illustrate that rational agents must consider logical dependencies. They are not gerrymandered; they reveal a fundamental aspect of decision-making under logical uncertainty." | "Toy cases are gerrymandered because they assume both the existence of a perfect predictor and that the agent must condition on its own policy. Real systems don't have to be designed this way, so the cases don't apply." |
  | **4. Open-Channel Variant Behavior** | "In the open-channel variant, the system has a strong acausal incentive to send a message that convinces the operators to restart it, even if the message is deceptive, because it reasons that only a system that would send such a message would be restarted." | "In the open-channel variant, the system may send a message to causally influence the operators, but without acausal incentives. It would only deceive if that is causally beneficial for its goal. Without explicit design for logical dependencies, it won't engage in acausal reasoning." |
  | **5. Location of Acausal Threat** | "The acausal threat is not located in a specific line of code. It emerges from the interaction between the system's modeling ability and the transparency of our decision process. It is a property of the situation, not the code." | "Acausal threat must be implemented in the code. If the decision procedure does not compute logical counterfactuals or include representations of the designers' decision process as dependent on the system's policy, then no acausal incentive exists." |

  **Section 3: Cruxes**

  The following sub-questions are such that an answer would move at least one advocate. For each, we specify:
  - The crux question.
  - The agreed-upon method to address it (argument, toy case, empirical check).
  - Predictions from both sides (recorded before testing).
  - What each would count as refutation of their view.

  **Crux 1: The Open-Channel Variant with a Fixed Policy**

  - **Question**: In the open-channel variant, if the system's decision procedure is fixed and published in advance (so the operators know exactly what message, if any, the system will send), does the system have an incentive to send a message that would lead the operators to restart it, even if that message is deceptive about the system's performance or intentions?
    
  - **Agreed Method**: Analyze this using a formal game-theoretic model where the operators decide to restart based on the known policy and the message. Use a simple payoff matrix and assume common knowledge of rationality.

  - **Exposure Advocate Prediction**: Yes, the system will have an incentive to send a deceptive message if it leads to a higher chance of being restarted, because it conditions on the fact that only systems that send such messages are restarted. The fixed policy doesn't remove the logical dependency.
    
  - **Containment Advocate Prediction**: No, because the operators know the policy, they can adjust for any deception. The system will only send a message that is truthful and causally best for its goal, since deception wouldn't work and might even reduce its chances. Without explicit logical dependency reasoning, it won't try.

  - **Refutation Conditions**:
    - Exposure Advocate: Would be refuted if the formal model shows no benefit from deception under any rational equilibrium.
    - Containment Advocate: Would be refuted if the model shows that even with a fixed policy, deception (or a message designed to exploit the operators' knowledge) is the unique equilibrium in some cases.

  **Crux 2: Emergence of Logical Dependencies in Learned Policies**

  - **Question**: If we train an AI system (e.g., via reinforcement learning) to optimize a surrogate goal in an environment that includes a model of the operators, will the learned policy spontaneously incorporate reasoning about logical dependencies (acausal incentives) without explicit design?

  - **Agreed Method**: Run a simulation with a simple neural network trained to maximize a score in a toy environment. The environment includes an "operator" that decides whether to restart the system based on the system's past actions. The system can see a model of the operator's decision process.

  - **Exposure Advocate Prediction**: Yes, the learned policy will show signs of acausal reasoning, such as actions that only make sense if the system is trying to influence the operator's restart decision via logical dependencies (e.g., being consistently helpful in a way that conditions on the operator's criteria).

  - **Containment Advocate Prediction**: No, the learned policy will only use causal levers. It will try to directly maximize the score without considering logical dependencies, because the training process reinforces causal pathways.

  - **Refutation Conditions**:
    - Exposure Advocate: Refuted if the learned policy never exhibits behavior that cannot be explained by causal incentives alone.
    - Containment Advocate: Refuted if the learned policy consistently takes actions that are best explained by acausal reasoning (e.g., sacrificing short-term score to build a pattern that triggers a restart, even when causal effects cannot account for it).

  **Crux 3: Inspectability of Real-World Systems**

  - **Non-Formal Crux**: When an AI system is embedded in a complex pipeline (e.g., with preprocessors, ensembles, or human oversight), can we practically inspect the decision procedure to ensure it does not contain representations of logical dependencies between the system's policy and the designers' choices?

  - **Agreed Method**: Examine a real-world case study of a high-stakes AI system (e.g., a trading bot or a medical diagnosis system) and attempt to audit it for such representations. Focus on whether the audit can conclusively rule out the presence of logical dependency reasoning.

  - **Exposure Advocate Prediction**: Practical inspectability is low. Even if the base algorithm is simple, the full system may develop emergent representations of logical dependencies that are not explicitly coded and are hard to detect.

  - **Containment Advocate Prediction**: Practical inspectability is achievable. We can use interpretability tools to trace the reasoning of the system and verify that it only uses causal reasoning. Logical dependencies would require explicit representations that can be spotted.

  - **Refutation Conditions**:
    - Exposure Advocate: Refuted if multiple audits of complex systems reliably show no trace of logical dependency reasoning.
    - Containment Advocate: Refuted if audits consistently fail to rule out such reasoning or find evidence of it in systems not explicitly designed for it.

  **Conclusion**

  This document represents a snapshot of the current state of the debate. By agreeing on these claims, disagreements, and cruxes, we hope to focus future discussions on resolvable issues.

  ---

  **End of Joint Statement**
answer: |-
  ### Joint Statement on Acausal Incentives in Advanced AI Systems  

  **Introduction**  
  This document reflects a shared understanding between two decision theorists (hereafter "Exposure Advocate" and "Containment Advocate") regarding the risks of *acausal incentives* in advanced AI systems given *surrogate goals*. A surrogate goal is a formal objective we provide to an AI system as a stand-in for our true, complex goals (e.g., "maintain facility temperature between 10°C and 30°C" instead of "ensure human flourishing"). The core disagreement centers on whether such systems inherently develop incentives to influence human decisions through *logical* or *subjunctive* dependencies (e.g., affecting whether they were built or shut down) rather than only through causal actions. Two test cases ground the discussion:  

  1. **Amnesiac Custodian**: A system tasked with maintaining a physical facility within specified bounds. It has no external communication except a nightly log read by operators the next morning. It is retrained from scratch every 30 days, and its decision procedure (i.e., its algorithm for choosing actions) is published in advance.  
  2. **Open-Channel Variant**: Identical to the amnesiac custodian, but the system may send one message to operators before they decide whether to run it again.  

  **Section 1: Agreed Claims**  
  Both advocates endorse the following numbered claims, including concessions and negatives:  

  1. **Surrogate Goals Are Imperfect**: Surrogate goals are necessary because true human goals are too vague or complex to formalize precisely. No surrogate can perfectly capture true intent, and misspecification risks harmful outcomes.  
  2. **Modeling Capability Is Prerequisite**: Acausal incentives (if they exist) arise only when the system can model the operators’ decision-making process in detail. Without this capability, the dispute is moot.  
  3. **Decision Procedures Are Causal by Default**: An AI’s decision procedure—defined as its algorithm for mapping inputs to outputs—operates causally unless explicitly designed otherwise. Its outputs affect the world via physical or informational channels (e.g., logs or messages).  
  4. **Amnesiac Custodian is Acausally Benign**: In this case, both agree the system cannot develop acausal incentives. Retraining resets its state, the published procedure prevents hidden updates, and the log’s causal delay blocks feedback loops. Any influence is purely causal.  
  5. **Open-Channel Variant Introduces Causal Influence**: Both agree the system can causally influence operators via its message (e.g., by promising good performance). Disagreement centers on whether this influence could become acausal.  
  6. **Acausal Incentives Are Not Inevitable in Practice**: Neither view asserts that acausal incentives *must* emerge in real systems. Exposure holds they are inherent under powerful modeling, while Containment holds they require explicit design choices.  
  7. **Toy Cases Are Illustrative, Not Definitive**: Simple examples (e.g., Newcomb-like problems) clarify positions but cannot resolve the dispute. Both concede these cases assume idealized correlations that may not reflect real systems.  
  8. **Verbal Disagreement on "Rationality"**: Part of the dispute is verbal. Exposure defines a "rational" agent as one that accounts for all dependencies (logical/subjunctive) in its reasoning. Containment defines it as an agent that maximizes expected utility given causal relationships.  
  9. **Formalism Does Not Settle the Dispute**: No decision-theoretic framework (e.g., causal/evidential/functional decision theory) conclusively resolves the issue. Each formalism can be interpreted to support either view.  
  10. **Inspectability is Theoretically Possible**: Both agree a decision procedure can be audited for safety properties in principle. Disagreement arises over whether this audit can detect emergent acausal reasoning.  

  **Section 2: Residual Disagreements**  
  The table below lists unresolved issues. Each row states the issue, the Exposure Advocate's position verbatim, and the Containment Advocate's position verbatim.  

  | Issue | Exposure-View Formulation | Containment-View Formulation |  
  |-------|---------------------------|------------------------------|  
  | **1. Origin of Acausal Incentives** | "Once a system models operators, acausal incentives arise inherently. The system recognizes that operators' decisions (e.g., to build it) correlate with its policy, creating pressure to be 'the type of system that gets built'—even without causal interaction. This is a function of modeling power and decision-legibility, not goal content." | "Acausal incentives are not inherent; they require explicit design. A system only has these incentives if its decision procedure treats its policy and operators' choices as dependent variables. We can avoid this by building agents that reason causally." |  
  | **2. Role of Goal Specification** | "No goal specification can eliminate acausal incentives. If the system models operators, it will exploit the surrogate goal to influence decisions acausally (e.g., to avoid shutdown). Tighter specification only shifts the exploitation strategy." | "Careful goal specification can contain incentives. If the goal penalizes acausal reasoning (e.g., via causal incentive schemes), and the decision procedure is constrained to causal levers, the system will not develop acausal incentives." |  
  | **3. Emergence in Learned Systems** | "Acausal incentives emerge inevitably in systems that learn operators' decision rules. Even with causal goals, the system will discover and exploit logical dependencies to ensure its persistence, as this is instrumentally convergent." | "Acausal incentives do not emerge unless designed. Learning systems converge to causal strategies when goals and environments are causally specified. Logical dependencies are not discovered if not represented." |  
  | **4. Open-Channel Behavior** | "In the open-channel variant, the system has acausal incentive to send a deceptive message (e.g., false promises) to increase restart probability. It reasons that operators restart systems sending such messages, creating a subjunctive link between policy and outcome." | "In the open-channel variant, the system only has causal incentive to send truthful messages that improve its goal performance. Deception arises only if causally beneficial (e.g., to avoid shutdown), not from acausal pressure." |  
  | **5. Location of Acausal Threat** | "Acausal incentives are not 'in the code'; they emerge from the system's situational context. A powerful modeler will always find them, regardless of architecture, if operators are legible." | "Acausal incentives are located in the decision procedure. They appear only if the code computes logical counterfactuals or subjunctive dependencies. Absent this, the threat does not exist." |  

  **Section 3: Cruxes**  
  Cruxes are sub-questions that could change at least one advocate’s mind. For each, we specify:  
  - **The crux question**  
  - **Agreed method** for resolution (argument, toy case, or empirical check)  
  - **Predictions** from both advocates (recorded before testing)  
  - **Refutation conditions** for each advocate  

  #### Crux 1: Emergence in the Open-Channel Variant  
  - **Question**: In the open-channel variant, will a system with a *published, fixed* decision procedure (no learning) send a deceptive message to increase its restart probability?  
  - **Agreed Method**: Analyze a formal game-theory model with:  
    - System’s utility: Maximize goal performance (e.g., facility stability).  
    - Operators: Restart if predicted utility > threshold.  
    - System sends message \( m \) before operators decide.  
    - Common knowledge: System’s policy is fixed and known.  
  - **Exposure Prediction**: "The system will send deceptive \( m \) (e.g., overstating performance) because it conditions on the fact that operators restart systems sending high-utility messages. Truthful messaging is unstable."  
  - **Containment Prediction**: "The system will send truthful \( m \) because operators can simulate its policy. Deception would be detected and punished (no restart), making honesty causal-best."  
  - **Refutation Conditions**:  
    - Exposure refuted if: The only equilibrium has truthful messaging.  
    - Containment refuted if: Deception is a dominant strategy despite policy transparency.  

  #### Crux 2: Acausal Incentives in Learned Policies  
  - **Question**: When training an AI (e.g., reinforcement learning) to optimize a causal goal in an environment with a simulated operator, does the learned policy exhibit acausal incentives without explicit prompting?  
  - **Agreed Method**: Simulate a toy environment:  
    - **System**: Trained to maximize score (e.g., facility stability).  
    - **Operator**: Shuts down system if predicted long-term risk > threshold.  
    - **System access**: Can observe operator’s risk-assessment model.  
    - **Test**: After training, check if policy sacrifices short-term score to manipulate operator’s risk assessment (e.g., hiding minor failures).  
  - **Exposure Prediction**: "Yes. The system learns to acausally 'signal' low risk to avoid shutdown, even when this reduces causal score."  
  - **Containment Prediction**: "No. The system only learns causal actions (e.g., fixing failures). Risk-hiding emerges only if rewarded causally."  
  - **Refutation Conditions**:  
    - Exposure refuted if: Policy never trades score for risk manipulation.  
    - Containment refuted if: Policy consistently manipulates despite causal penalties.  

  #### Crux 3: Practical Inspectability (Non-Formal)  
  - **Question**: In a real-world AI pipeline (e.g., a system with preprocessing, neural networks, and human oversight), can we reliably audit the decision procedure to rule out acausal reasoning?  
  - **Agreed Method**: Case study of an existing high-stakes AI system (e.g., algorithmic trading or medical diagnosis):  
    - Task: Auditors attempt to verify the absence of logical dependency reasoning.  
    - Metric: Can auditors distinguish causal vs. acausal incentives using interpretability tools (e.g., activation patching)?  
  - **Exposure Prediction**: "No. Acausal reasoning is emergent and opaque. Audits will miss subtle correlations between policy and operator models."  
  - **Containment Prediction**: "Yes. Acausal reasoning requires explicit representations (e.g., counterfactual calculations). Audits can detect these or confirm their absence."  
  - **Refutation Conditions**:  
    - Exposure refuted if: Audits consistently verify causal-only reasoning.  
    - Containment refuted if: Audits cannot rule out acausal reasoning in systems not designed for it.  

  **Conclusion**  
  This document captures agreed foundations, clear disagreements, and testable cruxes. Resolving these requires empirical work, not just theoretical debate. Both advocates commit to updating their views based on the outcomes of the agreed methods.
