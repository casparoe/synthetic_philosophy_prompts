prompt: |-
  For about a dozen years I have made my living subtitling films, which means watching the same three or four minutes of a scene anywhere from thirty to a hundred times, and for the last six of those years I have also helped run a discussion night at a public library where we screen a film and talk for an hour afterwards. So I have more exposure than most people both to the wearing-off and to the stubborn not-wearing-off of emotional responses to fiction, and I have started to notice a pattern I cannot name. It is not the puzzle I have seen raised about why anyone gets upset at characters they know do not exist; I have read a little about that, and it is not my question. I have no difficulty being moved by something I know to be invented, and I do not find it puzzling. What interests me is the opposite-looking case: a response that dies and cannot be brought back, even though none of my beliefs about the work seem to have changed in a way that should matter. First case: a few years ago we screened what we had announced as a documentary about a fishing town that had lost its fleet — plainly shot, no score, people talking to camera about their fathers. Half the room was visibly shaken. After the discussion, someone who knew the director mentioned that the film was staged: the crew were actors, the interviews were written, though drawn from real testimony and checked with the people who had given it. The room went cold and several people said they felt had. We showed it again a month later, honestly relabeled and with the staging explained in advance. The print was identical; everyone knew exactly what they were watching; and the response was markedly thinner. What struck me is that it did not come back even when I explained that the staging had been done at the request of the community itself, that they had wanted their story told that way and had seen and approved the script, and that nothing had been concealed from them. People accepted all of that, agreed that no one had been wronged, and still said, in so many words, that they knew it was fine but could not feel it the same way.

  The second case is from my own work. There is a scene — a father saying goodbye to his daughter at a station, nothing more — that I found genuinely hard to sit through for the first several dozen passes. Then I read an interview in which the director explained how it was built: the child's line had been fed to her off-camera, she did not know what it referred to, and the reaction everyone reads as heartbreak was filmed before the actor was told what the scene was about. I have thought about that interview for years now, and I still think the procedure is entirely legitimate; I admire the same technique in a dozen other films and have argued with people who call it cheating. None of that has helped. The response is gone, and it stays gone, and the odd thing is that on the very same viewings the suspense still works, the flinch still works, the scene still holds me — so this is not numbness or boredom or having worn it out, and it is not that I have come to believe something false about the world, since I never believed the events happened. A friend I described this to said it sounded like the intentional fallacy, which did not seem right to me, because nothing about what the scene means or how I would describe it has changed; only my ability to feel it has. What I think I am looking at has five features: the feeling was real and not pretended; it never rested on a belief that the events occurred; a change in what I believe about the work's provenance or construction destroys it; withdrawing that belief does not restore it; and the thinner state does not present itself to me as a defect — it presents itself as more accurate, and the earlier response now seems slightly embarrassing, like something that happened to me rather than something I did. I am also unsure whether my two cases are the same phenomenon, since one involves a breach of trust about what kind of object I was being handed and the other involves only finding out how the effect was made; and I cannot tell whether a memoir exposed as fabricated, or a card trick once you know the method, belongs to this pattern or to something else entirely.

  So: does this have a name? I want to be clear that a label is the least of it, and that I would rather have the carving than the word. Please do not give me a reading list or citations — I am writing this in a library with no database access and could not follow them up anyway, so if names of views or authors are unavoidable, describe them rather than pointing me at them. What I would like is: whether this is one thing or two; what the nearest established concepts are and precisely how my case differs from each of them, including the standard accounts of emotional response to fiction and any notion of an emotion that fails to track what the subject believes; which of them, if any, actually fits; whether the metaphor of hysteresis — a system that does not return to its earlier state when the cause is removed — is a helpful borrowing here or a misleading one; and, if nothing established covers it, a term you would propose, a definition tight enough to separate it from the neighbouring cases, and a couple of boundary cases that decide what does and does not count. Finally, if it can be said without sending me to a bibliography: is a pattern like this evidence for or against any of the standard stories about what these fictional emotions are?
reasoning: |-
  Hmm, the user has presented a fascinating and nuanced question about emotional responses to fiction. They have extensive experience as a film subtitler and discussion facilitator, giving them unique insight into how emotional reactions to fictional content can change over time and with additional information.

  The core of their observation is about emotional responses that disappear permanently once certain behind-the-scenes knowledge is acquired, even though their intellectual understanding of the work remains unchanged. They present two distinct cases: one where a documentary turned out to be staged (causing audience emotions to diminish even after learning the staging was consensual), and another from their personal work where knowledge of how a scene was constructed eliminated their emotional reaction to it.

  Several key features stand out: The feelings were genuine; they never depended on belief in the events' reality; learning about the work's construction destroys the emotion; withdrawing that knowledge doesn't restore the emotion; and the new unemotional state feels more accurate, making the original emotion seem somewhat embarrassing.

  The user specifically requests not just a label but a conceptual analysis. They want to know if this is one phenomenon or two, how it relates to established concepts like the intentional fallacy or emotional responses to fiction, whether hysteresis is an appropriate metaphor, and if this challenges any standard theories about fictional emotions.

  I need to address several layers here. First, distinguishing between the two cases: the documentary case involves a categorical shift (believing something is real when it's not) while the subtitling case is about technique revelation. Yet both share the irreversible emotional diminishment. 

  The established concepts that come closest include cognitive theories of emotion (which would predict emotions should change with beliefs, but here they disappear permanently), aesthetic distance (though that's usually about framing rather than permanent loss), and various fallacies in literary criticism. None perfectly fit, especially given the irreversibility aspect.

  The hysteresis metaphor from physics/engineering (where a system doesn't return to its original state when the force is removed) is actually quite apt here. The emotional mechanism gets "stuck" in a new configuration even after the revealing knowledge is mentally withdrawn.

  For terminology, I suggest "emotional demystification" to capture this specific phenomenon. It would need careful definition to distinguish it from simple disillusionment or aesthetic distance. Boundary cases would include situations where emotions return after knowledge is removed (which doesn't happen here) or where the knowledge actually enhances appreciation.

  This pattern does challenge some standard accounts of fictional emotions, particularly those that treat our responses as fully rational or those that claim emotions in fiction are "offline" simulations. The irreversible nature suggests something more fundamental about how we engage with art.
answer: |-
  Your cases capture a profound and under-discussed phenomenon. Let's carve this carefully, avoiding the bibliography as requested:

  ### 1. **One Phenomenon or Two?**
     - **Core Mechanism is Shared**: Both cases involve the **irreversible collapse of affective resonance** due to meta-information about the work's construction or ontology. The emotional response isn't merely dampened; it becomes structurally inaccessible.
     - **Surface Difference**: 
       - The documentary case involves **categorical betrayal** (believed object: *testimonial* → revealed object: *simulation*). 
       - The acting case involves **technical revelation** (believed effect: *authentic performance* → revealed effect: *constructed technique*). 
     - **Deep Unity**: Both disrupt the **hermetic seal of the fictional world**. Once the artifice is *viscerally known*, the unconscious contract of immersion is voided. Your description of the emotion feeling "like something that happened to me" is key—this implies a passive, involuntary engagement that the revelation breaks.

  ### 2. **Nearest Established Concepts & How This Differs**
     - **"Suspension of Disbelief" (Coleridge)**:
       - *Similarity*: Requires voluntary/involuntary setting aside of reality.
       - *Difference*: Your cases show **shattering, not suspension**. Once shattered, it cannot be *re*-suspended even voluntarily. Suspension is a conscious framework; your loss is affective and involuntary.
     
     - **Intentional Fallacy (Wimsatt & Beardsley)**:
       - *Similarity*: Concerns whether authorial intent governs meaning.
       - *Difference*: Your issue isn't about *interpretation* (you still understand the scene identically) but about **affective capacity**. The fallacy debates meaning; you describe an emotional circuit-breaker.

     - **"Aesthetic Distance" (Bullough)**:
       - *Similarity*: Involves psychological separation from art.
       - *Difference*: Distance is usually *modulated* (e.g., "too close" for horror). Your cases show **binary, irreversible distancing** triggered by specific meta-knowledge.

     - **Cognitive Theories of Emotion (e.g., Solomon, Nussbaum)**:
       - *Similarity*: Emotions require cognitive appraisal.
       - *Difference*: Your beliefs *didn't change* about the fiction's *meaning* or *value*, yet the emotion vanished. Cognition says emotion should track belief; here, **affect decouples from stable cognition**.

     - **"Illusion of Independent Agency" (Woody Allen's Zelig problem)**:
       - *Similarity*: Audiences invest in characters as if they exist beyond the frame.
       - *Difference*: Your loss persists even when you *affirm* the artifice's legitimacy. It's not about "belief in existence" but about **loss of affective permeability**.

  ### 3. **What Fits?**
     None perfectly. Closest is **affective habituation**—but habituation implies exhaustion through repetition, not meta-knowledge. Your case is **Revelation-Induced Affective Immunity**: knowledge grants immunity to a specific emotional strain.

  ### 4. **Hysteresis as Metaphor**
     - **Helpful**: Excellently captures the irreversibility. Like a magnet retaining polarization after the field is removed, your affective state doesn’t "re-magnetize" when the revelation is cognitively withdrawn.
     - **Misleading**: Hysteresis implies a *physical* history-dependence. Your cases involve **semantic contamination**—the revelation recontextualizes the work’s *category* (documentary → docufiction) or *mechanism* (spontaneity → technique), altering its affective "chemistry" permanently.

  ### 5. **Proposed Term & Definition**
     - **Term**: **Affective Disenchantment**  
     - **Definition**:  
       *The irreversible collapse of a specific emotional response to a work of art, caused by acquiring meta-information about its construction or ontology, where:*  
       - *The response was initially genuine and belief-independent;*  
       - *The collapse persists even after disavowing the relevance of the revelation;*  
       - *The new state presents as affectively accurate, rendering the prior response experientially inaccessible and retrospectively incongruous.*  
     - **Boundary Cases**:  
       - **IN**: A fabricated memoir (e.g., *A Million Little Pieces*). Learning it's fictional destroys pathos permanently—even if you appreciate it *as fiction*.  
       - **OUT**: A card trick. Knowing the method may ruin surprise, but wonder can shift to *admiration for skill* (affect transforms, doesn’t vanish).  
       - **OUT**: *Romeo and Juliet*. Knowing they’re actors doesn’t kill tragic feeling—because the play *declares itself fiction*. Disenchantment requires **revelation of concealed artifice**.

  ### 6. **Evidence for/against Standard Stories of Fictional Emotions**
     - **Against "Pretend Theory" (Walton)**: If emotions were *only* "make-believe," knowing the trick shouldn’t prevent you from playing along. Your inability to *re-access* the feeling suggests genuine affect was involved.  
     - **Against "Thought Theory" (Lamarque)**: If emotions stem *only* from contemplating themes/characters, your stable cognition should sustain them. The loss implies **embodied, pre-reflective engagement** that’s fragile to framing.  
     - **For "Alief" (Gendler)**: Your prior state resembles *alief* (automatic, belief-independent response). Revelation doesn’t change belief but *overwrites alief* with a new schematic frame ("constructed artifact"), blocking the original affective pathway.

  ### 7. **Why the Two Cases Feel Different Yet Unified**
     - The documentary case breaches **epistemic trust** ("I thought this was a window; it’s a mirror").  
     - The acting case breaches **phenomenological authenticity** ("I thought her pain was felt; it was performed").  
     - **Unifying Principle**: Both revelations expose a **layer of mediation** previously invisible. Once seen, the work can no longer function as a *direct conduit* for that particular emotion. The emotion wasn’t "fake"—but its *route of access* was dependent on naiveté about artifice.  

  This isn’t numbness; it’s **semantic scar tissue**. The revelation doesn’t just add knowledge—it *reorganizes perceptual gestalt*, and the affective circuitry cannot be rewired back. What remains is appreciation, analysis, even beauty—but the old wound won’t reopen.
