prompt: |-
  I spent ten years in industry working on guidance and control for autonomous underwater vehicles before I took my doctorate in philosophy, and I now write mainly on skill and knowledge-how. Next month I am giving a colloquium to my old group, and I want to use the visit as an occasion to think again about a literature I have come to find stalled. The dispute between intellectualists and anti-intellectualists about knowing how seems to me to be running on competing intuitions about described cases, and I suspect that a good deal of what is doing the work is that the two sides are operating with different background pictures of what a piece of competence in an agent could even be. My first vocabulary may be a sharper instrument here than the one the literature uses, so I would like you to carry out a systematic translation. Please write in British English, and please do not supply references, a bibliography or suggestions for further reading; I know that literature well, and what I want from you is the structure of the argument rather than its sources.

  The vocabulary I want the translation done into is the one I used daily: plant and environment; controller or policy; state estimator; closed-loop against open-loop behaviour; feedforward against feedback; world model; model-based control, including model predictive control with its online optimisation and receding horizon, against model-free or amortised policies arrived at by tuning or reinforcement learning; system identification; hierarchical architectures in which an outer loop sets setpoints for an inner one; gain scheduling and other forms of adaptation; robustness, stability margins and disturbance rejection; infeasibility and unreachability; and the difference between a controller you can certify and one you have only validated empirically. Translate into exactly that vocabulary, as faithfully as you can, the following six claims: (1) anti-intellectualism, understood as the view that to know how to do something is to possess a policy that produces success reliably across the relevant range of conditions, with nothing in the account requiring an inspectable, propositionally formatted representation of how the thing is done; (2) the regress consideration that drives that view, namely that if every competent performance required consulting such a representation and then applying a rule to it, the applying would itself be a performance requiring a further consultation, so that something must be competent without consulting anything; (3) intellectualism, understood as the view that knowing how is a matter of standing in some propositional attitude to a proposition about a way of doing the thing, together with the fallback position that the relevant attitude need be neither consciously accessible nor verbally formattable; (4) the claim that knowing how, unlike mere reliable success, is factive, in that there must be a fact of the matter about how the thing is to be done; (5) the claim that what the debate is really about is guidance, so that a performance manifests knowledge-how only if the agent guides it as it goes along and not merely if something in the agent generates the correct trajectory; and (6) the claim that knowledge-how is what separates intelligent from merely successful performance, so that a superbly tuned but unguided mechanism would not count as skilled.

  Then give me the residue report, which is the part I actually care about: for each of the six, say what translated cleanly, what translated only after you quietly added or dropped something, and what resisted translation altogether, and say in each case whether the resistance is a gap in my engineering vocabulary or a sign that the philosophical claim was never very determinate. I have three cases I want you to run through the translation as a check on yourself, because I think they pull in different directions. First, the transfer case: a policy trained to genuine competence on one plant is deployed on a modified plant and its performance collapses in a way not predicted by anything the agent can report about what it was doing; is that best described as the absence of knowing that, and is the intellectualist committed to predicting the collapse? Second, the one-shot instruction case: a competent agent told a single true sentence about how to do something it has never done immediately does it tolerably well, which seems to show a route from proposition to policy that the anti-intellectualist must accommodate as a process of compilation whose intermediate stages are difficult to locate in time. Third, the recombination case: an agent that reliably does A and reliably does B in the settings in which it learned each cannot do A followed by B in a novel setting, even though it can state perfectly well that the novel setting calls for A and then B. Finally, tell me where you think the philosophical dispute turns out to be merely verbal once it is put in control-theoretic terms. I have in mind especially the question whether a learned latent state or a set of tuned gains is a representation with correctness conditions at all: my old vocabulary has no settled answer to that, and the philosophers seem to me to be leaning on one.
reasoning: |-
  Hmm, the user has a fascinating interdisciplinary background - a decade in AUV control systems followed by a philosophy doctorate focusing on skill/know-how. They're preparing a colloquium for former engineering colleagues and want to reframe the intellectualism/anti-intellectualism debate using control theory vocabulary. This is clearly someone deeply familiar with both technical philosophy and engineering practice.

  The core request is a systematic translation of six philosophical claims about knowledge-how into precise control theory terminology. The specified vocabulary is comprehensive: plant/environment, controllers/policies, state estimators, feedback/feedforward mechanisms, etc. They explicitly want no citations - just conceptual mapping.

  Key challenges emerge immediately. First, philosophy's "knowledge-how" doesn't cleanly map to any single engineering concept - it overlaps with policy implementation, adaptive control, and system identification. Second, the factivity requirement (claim 4) has no direct equivalent in control theory where we deal with validated performance rather than truth conditions. Third, the guidance criterion (claim 5) touches on observability and online adaptation - areas where engineering offers more granular distinctions than philosophy.

  For the residue report, I anticipate friction points: 
  - Anti-intellectualism's "no inspectable representation" translates well to model-free controllers, but intellectualism's "propositional attitude" becomes messy when considering latent states in neural networks which aren't propositional but aren't nothing either. 
  - The regress argument maps elegantly to the necessity of closed-loop primitives. 
  - The transfer case will sharply reveal limitations - a policy failing on modified plant demonstrates lack of system identification, but doesn't clearly align with "absence of knowing that."

  The three test cases are brilliantly chosen to probe boundaries. The one-shot instruction case challenges how quickly propositional input can bootstrap policy tuning - engineering would expect poor transient performance here. The recombination case exposes architecture limitations in hierarchical control. 

  Where philosophy feels verbal: the entire debate about whether tuned gains "represent" anything. In control theory, we care whether the controller stabilizes the plant, not whether its parameters "correspond" to reality in some metaphysical sense. The robustness certificate matters more than the ontology of the controller's internal state.

  This translation exercise might show that both sides are partially right: complex skills require layered architectures with both model-based (intellectualist-friendly) and model-free (anti-intellectualist-friendly) components. The real issue may be scalability - propositional knowledge gets you started, but fluid skill requires compiled policies with online adaptation.
answer: |-
  Below is the systematic translation of your six philosophical claims into control-theoretic vocabulary, followed by the residue report and analysis of your three test cases.

  ### Translation of Claims  
  1. **Anti-intellectualism**:  
     *Translated*: Possessing *know-how* is equivalent to implementing a robust **controller** or **policy** that achieves reliable **closed-loop behaviour** across the **plant**'s operational envelope, without necessitating an inspectable, propositionally structured **world model**.  
     *Key terms*: Policy, closed-loop, plant, robustness.  

  2. **Regress argument**:  
     *Translated*: If every skilled action required online consultation of a **world model** followed by rule application, the application step itself would demand another consultation, inducing infinite regress. Thus, core **feedback** mechanisms must operate without symbolic reference.  
     *Key terms*: World model, feedback, online.  

  3. **Intellectualism**:  
     *Translated*: *Know-how* requires a **model-based control** architecture, where the agent maintains a **world model** (a propositionally structured representation of feasible trajectories). This model need not be consciously accessible or verbally reportable.  
     *Key terms*: Model-based control, world model, trajectories.  

  4. **Factivity claim**:  
     *Translated*: Unlike brute reliability, *know-how* implies **system identification**: there must exist a ground-truth plant dynamics model against which the policy's success is factive. Mere empirical **validation** is insufficient; **certification** requires alignment with plant physics.  
     *Key terms*: System identification, validation, certification, plant dynamics.  

  5. **Guidance claim**:  
     *Translated*: *Know-how* entails **online guidance** via **feedback** or **model predictive control** (receding horizon optimisation). Merely executing a precomputed **open-loop trajectory**—even if successful—lacks skill.  
     *Key terms*: Feedback, model predictive control, online guidance, open-loop.  

  6. **Intelligence claim**:  
     *Translated*: Skill distinguishes **adaptive control** (e.g., **gain-scheduled** or **model-adaptive policies**) from **amortised**, **model-free policies**. A finely tuned but rigid controller—incapable of **disturbance rejection** or **setpoint adjustment**—exhibits success without intelligence.  
     *Key terms*: Adaptive control, gain-scheduled, model-free, disturbance rejection.  

  ---

  ### Residue Report  
  1. **Anti-intellectualism**:  
     - *Clean*: Policy robustness sans inspectable model → **model-free RL**.  
     - *Added*: "Inspectable" → engineering assumes policies *are* inspectable (e.g., weights, gains). Quietly dropped "propositional formatting" as irrelevant.  
     - *Resistance*: Philosophy’s "no representation" vs. engineering’s "parameters = representation?" Gap in your vocabulary’s ontology.  

  2. **Regress argument**:  
     - *Clean*: Infinite regress → **closed-loop primitives** (e.g., PID) require no internal consultation.  
     - *Resistance*: None. Maps perfectly to embedded control layers.  

  3. **Intellectualism**:  
     - *Clean*: World model → **model-based control**; "attitude" → **state estimator** confidence.  
     - *Added*: "Propositional" → translated as **structured world model** (e.g., equations).  
     - *Resistance*: "Standing in an attitude" is vague—engineering cares only if the model is *deployed*. Philosophical indeterminacy.  

  4. **Factivity**:  
     - *Clean*: **Certification** (model alignment) vs. **validation** (empirical success).  
     - *Dropped*: "Fact of the matter" → engineering uses **ground-truth plant models**.  
     - *Resistance*: Philosophy’s "factive" implies metaphysical truth; engineering uses **system identification fidelity**. Vocabulary gap.  

  5. **Guidance**:  
     - *Clean*: **Online feedback** vs. **open-loop playback**.  
     - *Resistance*: None. Direct mapping to real-time control.  

  6. **Intelligence claim**:  
     - *Clean*: **Adaptive policies** (intelligent) vs. **fixed model-free** (merely successful).  
     - *Added*: "Intelligent" → operationalised as **adaptation bandwidth**.  
     - *Resistance*: "Intelligence" isn’t a control-theoretic primitive. Philosophical vagueness.  

  ---

  ### Test Case Analyses  
  1. **Transfer case**:  
     - *Translation*: Policy trained on Plant A fails on modified Plant B.  
     - *Diagnosis*: Collapse indicates poor **generalisation** due to lack of **system identification**. Intellectualist *would* predict failure if the agent lacks a high-fidelity **world model** of B.  
     - *Verdict*: Not purely "absence of knowing-that"—failure stems from **model mismatch**, not propositional lack.  

  2. **One-shot instruction**:  
     - *Translation*: Propositional input ("do Φ via method M") bootstraps a functional policy immediately.  
     - *Diagnosis*: **Model-based control** rapidly synthesises policies from symbolic input. Anti-intellectualist "compilation" ≈ **online optimisation** (e.g., MPC setup).  
     - *Verdict*: Shows fast **model→policy conversion**; no regress if the agent has pre-tuned **low-level controllers**.  

  3. **Recombination case**:  
     - *Translation*: Agent executes subtasks A and B independently but fails at A→B sequencing in a novel **operating region**.  
     - *Diagnosis*: **Hierarchical control failure**: outer loop (sequencer) lacks **setpoint adjustment** for inner loops. Stating "A then B" confirms **world model** presence but exposes **control architecture inflexibility**.  
     - *Verdict*: Intellectualism’s flaw—propositions don’t guarantee **controller integration**.  

  ---

  ### Where the Dispute is Merely Verbal  
  The core verbal dispute centres on whether **tuned gains** or **latent states** constitute "representations with correctness conditions":  
  - *Engineering view*: Gains/states are **adaptive parameters** optimised for performance. "Correctness" = **stability margins** or **tracking error**, not truth.  
  - *Philosophical pressure*: Intellectualists label *any* parameterised policy as "representational"; anti-intellectualists reserve "representation" for symbolic models.  
  - *Resolution in your terms*:  
    - A **world model** (e.g., ODEs of plant dynamics) has correctness conditions.  
    - A **model-free policy** (e.g., neural net controller) has *validation certificates* but no truth-apt "representation".  
    - **Latent states** (e.g., in LSTM controllers) are predictive tools—not propositions.  

  The debate collapses when "representation" is scoped to **model-based control** and "competence" to **validated closed-loop performance**. What remains substantive is whether **online adaptation** requires internal models—a question of **control architecture**, not philosophy.  

  ---  
  This translation suggests the intellectualist/anti-intellectualist divide mirrors the **model-based vs. model-free control** trade-off in engineering: the former generalises better but is computationally costly; the latter is agile but fragile. Neither monopolises "skill".
