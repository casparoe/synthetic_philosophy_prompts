prompt: |-
  I am writing the chapter of my dissertation in which the standards of adequacy for an account of mental causation get fixed, and I want the specification settled before I begin scoring candidate views. I have read enough of the surrounding literature to recognise the standard moves, so please do not survey it, attribute positions to authors, or hand me a reading list: I want requirements, each with the case or consideration that earns it a place on the list, together with your judgement about which of the things people demand in this area are genuine desiderata and which are prejudices of one camp.

  The purpose against which adequacy is to be measured is fixed, and I would like the list held to it. The theory must vindicate the claim that an agent's reasons can explain her action in a way that could bear on moral responsibility: not merely predict the action, not merely redescribe it in mental vocabulary, and not merely rationalise it after the fact. An account that secures causation for the mental only by making mental properties causally idle summaries of neural goings-on fails for this purpose, and I would rather that failure be recorded as a requirement on the list than silently assumed.

  Here is the pile of demands I have collected. For each, tell me whether it is a genuine desideratum, a demand that presupposes the answer against one family of views, or a preference of a camp; rewrite the genuine ones into a form that does not beg the question; and add the requirements I have missed.

  1. The theory must respect the causal closure of the physical, or else say exactly which formulation of closure it rejects and why the formulation its opponents use is stronger than anything physics supports. My suspicion is that the premise usually written down (roughly, that every physical event with a cause has a physical cause) is weaker than what the exclusion reasoning needs, and that the difference becomes visible if microphysics turns out to be indeterministic.
  2. It may not buy room for the mental by appealing to indeterminacy at the micro-level without saying why the resulting probabilities are not themselves fixed by prior physical goings-on.
  3. It must not let the exclusion reasoning generalise: if the argument drains causal work from the mental, it seems equally to drain it from temperature, from the brittleness of glass, and from the special sciences generally, and a view that stops the argument only at the mental looks ad hoc.
  4. It must not make the causal status of the mental hostage to how complete physics happens to be at a given time; a theory that predicts mental causation is refuted by further neuroscientific detail is, I think, disqualified.
  5. It must respect a set of distinctions I take to be non-negotiable candidates: causation by a property versus causation by a particular event; causation versus causal explanation; difference-making versus production; symmetric overdetermination versus preemption; and the causal relevance of a state versus the agent's exercising control in acting on it.
  6. It must handle the case in which the mental cause and its physical realiser come apart in time: a long-standing intention is cited as the cause of an action performed months later, though nothing that realised the intention when it was formed still exists. Say what the causal relation relates, and what the requirement rules out.

  Two further cases are of my own construction, and I want every candidate scored on them. The first: a single belief, with one content, is realised twice over inside one nervous system, each realiser sufficient on its own for the behaviour and one of them actually pre-empting the other. Does the mental cause survive, and does your answer differ if the two realisers had different contents? The second: the state that does the causal work is subpersonal, in the sense that it is not a state the agent could cite as her reason even on ideal reflection. If a theory allows such a state to be the cause of action, I want to know whether it has thereby given up the thing my chapter needs, and whether that is a cost or a discovery.

  Finally, three things I most want from you. First: is any subset of the retained desiderata jointly unsatisfiable, and if so which one would you drop and what does dropping it cost — I suspect the list itself is a result here. Second: which single requirement does the most exclusionary work? Third: mark which requirements hold only relative to the responsibility-focused purpose I have fixed, and say where the list forces a decision about what causation itself is, since I suspect much of the dispute is a fight about that question conducted at one remove. Keep any scoring of the live candidate families to a short paragraph each, described by their structural claim rather than by name.
reasoning: |-
  Okay, the user is writing a dissertation chapter on mental causation standards, specifically focusing on moral responsibility. They've provided a list of demands and want me to evaluate each as genuine desideratum, biased demand, or camp preference. They also want rewritten versions without question-begging, plus any missing requirements.

  First, I need to understand their core purpose: vindicating how reasons explain actions for moral responsibility. This means mental causes can't be epiphenomenal or mere redescriptions. The user suspects some standard demands might be prejudiced or inconsistent.

  Looking at their list:
  #1 (causal closure) - Genuine but needs reformulation. The physics formulation matters, especially with indeterminacy. Rewrite to avoid assuming determinism. 
  #2 (indeterminacy) - Valid concern about probability fixation. Keep but rephrase neutrally. 
  #3 (generalization) - Crucial point! Non-ad-hoc treatment of special sciences is essential. 
  #4 (physics-completeness) - Absolutely vital. Mental causation shouldn't depend on current physics knowledge. 
  #5 (distinctions) - Mostly genuine, but "non-negotiable" might be too strong. Rewrite for neutrality. 
  #6 (temporal decoupling) - Important case that tests token vs. type causation theories. 

  Their original cases are clever tests:
  - Double realization: Probes whether mental causation survives multiple sufficient realizers. Content divergence makes it sharper. 
  - Subpersonal states: Directly challenges the responsibility link. This might force a "discovery" vs "cost" decision. 

  Missing requirements I should add:
  - A "no mere epiphenomenon" rule explicitating their moral responsibility concern. 
  - A "no reduction without residue" clause to block trivializing reductions. 
  - Perhaps an "agent's perspective" requirement since responsibility hinges on what agents could acknowledge. 

  For their additional requests:
  - Tensions exist! Especially between physical closure and robust mental causation. The exclusion argument is the main battleground. 
  - The generalization requirement (#3) does heavy exclusionary work by forcing solutions to cover all special sciences. 
  - Several requirements (like #4 and subpersonal case) are responsibility-specific. The deep fight is about whether causation is difference-making vs production. 

  Candidate views will need evaluation on these grounds later. But for now, focusing on refining the adequacy standards themselves seems most helpful.
answer: |-
  Here is your distilled list of adequacy standards, rigorously anchored to your purpose of securing mental causation for moral responsibility via reason-explanation. I've classified, rewritten, and supplemented your demands, then addressed your three concluding requests. The standards avoid presupposing solutions while exposing where substantive commitments are unavoidable.

  ### Revised & Validated Desiderata
  1.  **Genuine, rewritten:** *The theory must specify its stance on physical causal completeness without assuming determinism. If endorsing completeness, it must show why the mental isn't excluded even if every physical event has a sufficient physical cause (deterministic) or a physically-grounded probability distribution (indeterministic). If rejecting completeness, it must identify the specific physical closure principle rejected and demonstrate why physics (as understood) does not entail it.* **Rationale:** Your suspicion is correct; exclusion often smuggles in determinism. This formulation forces clarity on the *modal strength* of closure required by physics and blocks question-begging uses of exclusion.

  2.  **Genuine, rewritten:** *If appealing to micro-indeterminacy, the theory must explain why the relevant probabilities (enabling mental causation) are not wholly determined by prior physical history alone.* **Rationale:** Indeterminacy creates *opportunity* but not *agency*; this ensures mental properties aren't merely "riding" on physical randomness fixed by prior states irrelevant to reasons.

  3.  **Genuine, rewritten:** *The solution to mental causation must generalize non-arbitrarily to other special science properties (e.g., temperature, brittleness). A theory blocking exclusion only for the mental is inadequate.* **Rationale:** Accepts your core insight. If exclusion generalizes, defeating it requires a *structural* feature shared by mental and special science properties, not an ad-hoc mental exemption. This is a powerful test against "mental exceptionalism" that undermines the project.

  4.  **Genuine, rewritten:** *The causal efficacy of mental properties must not depend on contingent gaps in current physical or neuroscientific description. A theory refuted by finer-grained physical detail fails.* **Rationale:** Non-negotiable for your purpose. Responsibility hinges on the agent's *actual reasons*, not neuroscientific ignorance. Efficacy must survive complete physical knowledge.

  5.  **Mostly genuine, rewritten:** *The theory must explicitly define its account of causation and distinguish:*
      *   *Causation by a property-instance (e.g., having belief B) vs. by a particular event-token (e.g., neural firing N).*
      *   *Causal production (bringing about) vs. causal explanation (rendering intelligible).*
      *   *Symmetric overdetermination (two independent sufficient causes) vs. preemption (one cause does the work).*
      *   *The causal relevance of a state vs. the agent's control in acting upon it.*
      **Rationale:** These distinctions are analytical tools, not substantive commitments. Clarity here is vital for diagnosing where theories fail (e.g., confusing explanation with production). **Caveat:** Insisting on a *specific* account (e.g., difference-making *over* production) *would* beg the question; the requirement is clarity, not choice.

  6.  **Genuine, rewritten:** *The theory must account for cases where the mental cause (e.g., a long-standing intention) and its initial physical realizer are temporally decoupled (the initial realizer no longer exists when the effect occurs). It must specify what is causally related (e.g., persisting states? later realizers? abstract types?) and why this relation suffices for the agent's reason to explain the action.* **Rationale:** Rules out token-identity theories and naive realization views where causation is only between momentary physical tokens. Demands an account linking *reason-states* to actions over time.

  ### Your Cases: Requirements Added
  *   **Double Realization Case:** *The theory must explain whether the mental property (belief with content C) is causally efficacious when:*
      *   *(a) Two physically distinct realizers (R1, R2), each sufficient for behavior B and both instantiating the same mental property M(C), exist; and R1 preempts R2.*
      *   *(b) As (a), but R1 instantiates M(C1) and R2 instantiates M(C2) (C1 ≠ C2), and R1 preempts R2.*
      *It must justify its answer regarding M's efficacy and its bearing on explanation by the agent's reason (C or C1/C2).* **Rationale:** Tests if mental causation requires token-level causal work or depends solely on property-instantiation. (b) tests sensitivity to content individuation. Survival in (a) is likely required; failure in (b) may be acceptable if content mismatch breaks reason-explanation.

  *   **Subpersonal State Case:** *The theory must state whether a subpersonal state S (incapable of being the agent's reason, even ideally) can be the primary cause of an action A described as intentional. If yes, it must explain how this comports with A being explained by the agent's *reasons* for moral responsibility purposes.* **Rationale:** Forces confrontation: Does "mental causation" require *personal-level* causation? If subpersonal states suffice, how is *reason-explanation* preserved? This is crucial for moral responsibility. A "discovery" (yes, subpersonal suffices) must still salvage reason-explanation.

  ### Missing Requirements (Essential for Your Purpose)
  7.  **No Epiphenomenalism by Another Name:** *The theory must secure that the mental property F (e.g., having a specific belief-content or desire) is not causally idle. Its instantiation must make a difference to whether or how the action occurs, relative to relevant alternatives (e.g., having a different belief or no belief). This difference-making must be integral to the causal chain leading to the action, not a mere concomitant.* **Rationale:** Explicitly blocks "causally idle summary" views and ensures mental properties play a *role* physics alone doesn't account for. Core to responsibility.

  8.  **No Collapse into Neural Redescription:** *The causal explanation citing the mental property F must not be replaceable without loss by an explanation citing only the (current or past) physical realizer P of F, where "loss" refers specifically to the bearing on the agent's moral responsibility.* **Rationale:** Prevents trivial "realization" views where mental talk is just shorthand for neural states. The *mental description* must do indispensable explanatory work relevant to praise/blame.

  9.  **Agent's Perspective Constraint:** *The theory must accommodate that the reason cited in the explanation is (or could be, under reflection) the reason *for which* the agent acted, and that this self-understanding is relevant to attributing responsibility.* **Rationale:** Ensures the causal story connects to the agent's own rational standpoint, vital for responsibility. Doesn't require infallibility, but demands the causal role of reasons maps onto the agent's perspective.

  ### Addressing Your Final Requests
  1.  **Tensions & Potential Unsatisfiability:**
      *   **Core Tension:** Robust non-reductive mental causation (#7, #8) + Physical Causal Completeness (#1) + No Overdetermination (implied by #3 generalization) creates immense pressure. Exclusion arguments exploit this.
      *   **Likely Unsatisfiable Triad?:** (i) Mental properties are distinct from and irreducible to physical properties. (ii) Every physical effect has a sufficient physical cause. (iii) There is no widespread systematic overdetermination (by mental and physical causes). Many theories reject one.
      *   **What to Drop?:** For *your* responsibility purpose, (i) is least droppable – without distinct mental properties making a difference (#7), reason-explanation collapses. Dropping strict sufficiency in (ii) (embracing indeterminism/probabilistic causation) is common. Denying (iii) (accepting systematic overdetermination) is costly but possible. **Cost of Dropping (i):** Abandons non-reductive realism about the mental, likely collapsing reason-explanation into neural redescription (#8 violation), failing your core purpose.

  2.  **Most Exclusionary Requirement:** **#3 (Generalization Requirement).** It ruthlessly exposes solutions that only "save" the mental through special pleading (e.g., "consciousness magic"). If exclusion generalizes, solutions must work for brittleness or fail. This requirement eliminates a vast swathe of mental-exceptionalist views.

  3.  **Purpose-Relativity & The Causation Question:**
      *   **Responsibility-Specific Requirements:** #4 (No Hostage to Physics), #8 (No Neural Redescription), #9 (Agent's Perspective), and your Subpersonal Case are directly tied to securing reason-explanation for responsibility. They demand efficacy *as the agent's reason*.
      *   **Forcing Causation Commitments:** The list forces a decision on:
          *   **Causation Primarily Relates:** Events, States, or Properties? (#5, #6, Double Realization).
          *   **Nature of Causation:** Is it production (oomph, energy transfer) or difference-making (counterfactual dependence)? (#5 distinction). Your responsibility focus *points towards* difference-making (#7) as it links reasons (alternative possibilities) to actions, but doesn't strictly require it.
          *   **Levels of Causation:** Is causation fundamentally physical, with higher levels being derivative/illusory? (#1, #3, #4 decisively reject this for your purpose). The list commits you to *genuine* higher-level causation relevant to agency.
      *   **The Hidden Fight:** Much debate *is* a proxy war over the metaphysics of causation (production vs. difference-making) and the ontology of properties (reductionism vs. non-reductionism). Your requirements implicitly reject reductionist production-only views as incompatible with non-idle mental properties (#7, #8) and reason-explanation.

  ### Scoring Candidate Families (Briefly)
  *   **Type Identity/Reductive Physicalism:** Fails #4 (hostage to physics), #7 (mental properties idle? - depends on reduction success), #8 (collapse into neural description likely). Struggles with #6 (temporal decoupling) and Double Realization. May pass #1, #2, #3 if reduction succeeds, but likely fails your core purpose.
  *   **Token Identity/Anomalous Monism:** Faces severe challenges on #7 (epiphenomenalism of the mental), #8 (explanatory exclusion), #9 (agent's perspective). Struggles with #6. May satisfy #1, #2, #3, #4. Likely fails your purpose.
  *   **Non-Reductive Physicalism (Standard):** Vulnerable to exclusion (#1, #3 challenge) unless it leverages #2 (indeterminism) effectively. Must carefully navigate #5 (property causation) and #6. Double Realization helps it (#7). Subpersonal Case could be problematic (#9). Success hinges on satisfying #7 and #8 without violating #1 & #3.
  *   **Ontologically Emergent/Causal Powers:** Rejects strong #1 formulations. Easily satisfies #3, #4, #6, #7, #8, #9, Double Realization. Must rigorously justify rejecting #1's core physicalist intuition and handle #2 (if using indeterminism). Faces integration challenges.
  *   **Difference-Making/Interventionist (e.g., Causal Modeling):** Excels at #3, #4, #5 (distinctions), #6 (states/properties), #7, Double Realization. Handles Subpersonal Case potentially well (if tied to reason-variables). Faces challenges squaring counterfactuals with #1 (is dependence physical?) and #9 (perspective). Strong contender if difference-making suffices for responsibility.
  *   **Agency/Pragmatic Views:** Prioritizes #9, #8, #7. May reject strict #1 or reinterpret causation (#5). Handles your cases well if responsibility is the focus. Struggles with #3 (generalization) and #4 (hostage to physics?) – may seem less "metaphysically robust".

  This framework provides the rigorous, purpose-driven, and non-question-begging standards you need to evaluate competing accounts of mental causation for your dissertation chapter. The tensions exposed, particularly around exclusion and generalization, will be central to your critical analysis.
