  Ranking defeaters: Fatal ones against Claim 1 are the inherent self-reference in foundational rules. Claim 2 is more exposed because of theoretical limits from Gödel-like issues and judicial avoidance. The user should concede that foundational rules are unavoidably self-referential but can argue that in practice, courts act. However, if courts refuse to engage, it's a problem for their view.

  Exposure assessment: Real-world non-paralysis might be due to courts avoiding the issue, not the system's design. The user's view predicts no deadlock, but rivals like Kelsen or Hart might say paralysis is possible but avoided by practice. The Indian example shows a near-miss, which could be seen as the system working or almost failing. So the prediction has teeth but hasn't clearly failed yet.

