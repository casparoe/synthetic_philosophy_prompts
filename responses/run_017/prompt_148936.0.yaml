  First, I need to unpack their two main claims: (1) paradoxes are drafting errors, not inherent issues, and (2) systems always have residual rules to break deadlocks. The user wants each part assessed separately. 

  Looking at Claim 1: Are self-reference paradoxes just drafting errors? Strong counterexamples include Kelsen's Grundnorm and Hart's rule of recognition, which are foundational and self-referential by nature. Eliminating that self-reference might undermine their role. Also, amendment procedures often reference themselves, like in Article V of the US Constitution. If the rules for changing rules aren't clear, it creates a chicken-and-egg problem. Plus, the user's mirror clause example could lead to a Catch-22 if the procedure's validity depends on its future state. These seem like structural issues, not just sloppy writing.

  For Claim 2: Do residual mechanisms always resolve these? Historical cases like the UK Parliament's sovereignty show that in practice, courts or officials act to break deadlocks. But there are theoretical limits. Gödel's theorems suggest formal systems can have undecidable propositions. In law, if a rule requires self-validation without external input, it might truly paralyze. Judicial refusal to intervene, like in the Indian example where courts avoided a constitutional crisis, shows that sometimes the system doesn't resolve it but sidesteps. That's a point against the claim that residual rules always work.

