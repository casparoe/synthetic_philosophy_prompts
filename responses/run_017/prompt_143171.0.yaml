prompt: |-
  I sit on the serious-incident review panel at a hospital, and I keep hitting a pattern I have no vocabulary for. Some of the items we list as contributing factors are things that did not happen. Four recurring shapes:

  (1) A patient deteriorated overnight, and we recorded "the night nurse did not check on him at 4 a.m." But virtually nothing that could have happened did happen — nobody checked at 3:50 either, nobody called the family, nobody on the floor was doing almost anything anyone might conceivably have done. A few non-occurrences make the list; all the rest don't. I can see that we are selecting, but not what the selection tracks: the person's role, what was normally to be expected, whether acting would have made a difference, or something else.

  (2) In another review, three people separately failed to perform the same check, and any one of them performing it would have caught the problem. No individual failure made a difference — had any one acted, the outcome would have been what it was anyway — yet we listed all three, and nobody accepted from any one of them that "my failure didn't matter, the others would have failed too."

  (3) Sometimes the item is nobody's failure at all: "the alarm did not sound." No one omitted anything at the time; it had been muted weeks earlier by another team. It still behaves like case (1) on our list, and I can't tell whether it belongs in the same box.

  (4) Occasionally the non-action is on the good side: a resident did not override the standard protocol, and because she did not, the patient did better than he would have had she intervened. It feels right to call that a cause too, but the word sits badly with us in a review.

  A philosopher friend said "that's just causation by omission," which covers every one of these and therefore none of the distinctions I need; another muttered about "double prevention" and wouldn't explain. Is there an established concept — or several — that carves this up the way I want: the selection problem in (1), the redundancy in (2), the non-agential items in (3), the beneficial ones in (4)? If several are needed, tell me which fits which case and where they overlap or conflict. If some combination of my cases has no established label, coin a term and define it with boundary cases. I want the carving, not a name.

  Format: give me a markdown table with one row per candidate concept, established or coined, with columns: label | established_or_coined | definition_in_one_sentence | cases_covered (by number) | weakest_case (which of 1–4 it handles worst, and why) | coverage (0–100, how much of the total pattern it captures). Under the table, two short labelled lines: confidence (0–100) and what_would_change_this_verdict — the argument or distinction that would make you re-carve or relabel, and where your own carving is most likely to be wrong. Also say whether your answer depends on what the review is for (blame, learning, insurance), or whether "cause" has to mean the same thing in all four cases.
reasoning: |-
  Hmm, the user is part of a hospital serious-incident review panel and has identified a pattern involving "non-occurrences" as contributing factors in incident reports. They've outlined four distinct cases where the absence of actions or events is treated as causal factors, but with inconsistencies in how these omissions are selected and categorized. 

  The user needs conceptual clarity to distinguish between these different types of omissions, rather than just a blanket term like "causation by omission." They're frustrated that existing philosophical concepts don't capture the nuances they observe in practice—particularly the selection bias in case 1, the redundancy in case 2, the non-agential nature of case 3, and the beneficial omissions in case 4. 

  Their unspoken need seems to be operational precision: they want tools to classify these non-events consistently during reviews, likely to improve both accountability and systemic learning. The emotional undertone suggests frustration with ad-hoc labeling ("the word sits badly with us") and a desire for rigor. 

  Professionally, they're gatekeepers of patient safety protocols, so their deeper struggle might be balancing blame attribution with preventive analysis. The question about whether "cause" must mean the same thing across cases hints at tension between legal/insurance needs (which often require pinpointing blame) and cultural/learning goals (which focus on systemic fixes). 

  I'll analyze each of their cases: 
  - Case 1 is about selective reporting of omissions (why flag one missing check but not others?) 
  - Case 2 involves redundant failures where no single omission was decisive 
  - Case 3 concerns non-human "omissions" (like a muted alarm) 
  - Case 4 is paradoxical—a good omission that improved outcomes. 

  Existing concepts like "necessary condition" or "but-for cause" fail in case 2 (redundancy) and case 4 (beneficial omission). "Systemic deficiency" captures the non-agential aspect of case 3 but not the selection problem in case 1. 

  I'll propose a mix of established terms and new coinages, with their coverage gaps explicitly mapped. The coinages are necessary because no single framework fully addresses the selection/redundancy nuances. Crucially, I'll emphasize that context (blame vs. learning) determines whether these non-events should even be labeled "causes"—sometimes "contributing factor" or "defensive gap" is more accurate. 

  The confidence score reflects that philosophy of causation is contentious; a determinist might reject omissions as causes entirely, while a probabilistic approach could handle case 4 better. The biggest vulnerability in my framework is forcing beneficial non-actions into a "cause" label—it might be wiser to treat them as near-misses with positive outcomes.
answer: |-
  Below is a conceptual carving of the patterns you describe, blending established philosophical/legal concepts with newly coined terms for precision. **Crucially, "cause" does not need to mean the same thing in all four cases**—the review's purpose (blame assignment, systemic learning, insurance) determines which omissions should be highlighted and how.

  | Label                        | Est/Coined | Definition in One Sentence                                                                 | Cases Covered | Weakest Case (Why)                                                                 | Coverage |
  |------------------------------|------------|-------------------------------------------------------------------------------------------|---------------|------------------------------------------------------------------------------------|----------|
  | **But-For Omission**         | Established | An omission that was a necessary condition for the outcome (had it occurred, the outcome would likely have been avoided). | 1, 2, 3       | **4** (Beneficial omissions aren't necessary for harm; outcome was better *because* of non-action). | 65%      |
  | **Redundant Failure Cluster**| Coined     | A set of omissions where any single instance would have sufficed to prevent the outcome, but collectively their absence guaranteed it. | 2             | **1** (Doesn't address *why only specific omissions are listed* among many possible ones).          | 20%      |
  | **Defensive Gap**            | Coined     | The absence of an expected defensive layer (human or system) that *should* have intercepted harm, regardless of agency at the time. | 1, 3          | **2** (Doesn't capture redundancy; **4** (Not a "gap" if non-action was beneficial)).              | 50%      |
  | **Norm-Violating Omission**  | Coined     | An omission selected for review because it breached a specific duty/standard, not purely based on causal potency.           | 1, 2          | **3** (Alarm mute isn't an *ongoing* duty omission; **4** (Non-action adhered to norm)).           | 45%      |
  | **Contributing Precondition**| Established | A prior event/state (e.g., muted alarm) that enabled later omissions/harms by weakening defenses.                         | 3             | **4** (Not applicable to beneficial outcomes); **2** (Doesn't address concurrent redundancy).     | 25%      |
  | **Prophylactic Non-Intervention**| Coined  | Beneficial non-action where adherence to protocol avoided iatrogenic harm (counterfactual improvement).                    | 4             | **1,2,3** (Only applies to positive outcomes).                                     | 15%      |
  | **Systemic Attractor**       | Coined     | A recurring context (e.g., understaffing, poor culture) that explains *clusters* of omissions without specifying individual failures. | 1, 2, 3       | **4** (Not relevant to beneficial outcomes); doesn't *select* which omissions to list.             | 70%      |

  ---

  **Confidence:** 85/100  
  **What Would Change This Verdict:**  
  - If "causation" is strictly tied to *physical processes* (excluding omissions entirely), all cases 1-3 collapse into non-causal "enabling conditions" and case 4 becomes incoherent.  
  - If the panel's *primary goal* shifts:  
    - **Blame-focused:** Emphasize **Norm-Violating Omissions** (duty breaches).  
    - **Learning-focused:** Prioritize **Defensive Gaps** and **Systemic Attractors** (systems thinking).  
    - **Insurance-focused:** Require **But-For Omissions** (proximate cause).  

  **Where Carving Is Most Vulnerable:**  
  Case 1's "selection problem" isn't fully resolved. **Defensive Gap** + **Systemic Attractor** best explain it (gaps are "expected" defenses; attractors contextualize why gaps exist), but the *choice* to list the 4 a.m. check vs. others remains partly arbitrary. This hints that panels often default to **Norm-Violating Omissions** (e.g., hospital policy mandates 4 a.m. checks) or **But-For** logic (earlier checks *might* not have caught deterioration yet).  

  **Critical Distinction:**  
  - **Omissions as Causes (Cases 1-3):** Are only meaningful relative to a *normative baseline* (what *should* have happened).  
  - **Beneficial Non-Actions (Case 4):** Are "causes" of a *good outcome* but should be framed as **Prophylactic Non-Intervention** to avoid linguistic discomfort. Calling them "causes of harm avoidance" clarifies their role.  

  **Recommendation for Panels:**  
  1. **Explicitly state review goals** (learning vs. blame) upfront.  
  2. **Separate lists:**  
     - *Contributing Factors:* Include **Defensive Gaps** (e.g., "no 4 a.m. check"), **Contributing Preconditions** (e.g., "alarm muted").  
     - *Systemic Analysis:* **Redundant Failure Clusters** (e.g., "three overlapping verification failures"), **Systemic Attractors** (e.g., "nightshift understaffing").  
     - *Positive Examples:* **Prophylactic Non-Intervention** (e.g., "protocol not overridden").  
  3. Avoid labeling *all* omissions as "causes"—reserve that for **But-For Omissions** when required for legal clarity.
