answer: |-
  Here’s a breakdown addressing your questions about digital preservation and time, structured as requested:

  ---

  ### 1. What the Practice Strictly Presupposes (~200 words)  
  Digital preservation presupposes **practical irreversibility of decay** and **asymmetric access to past states**. It assumes:  
  - **Unidirectional decay**: Data corruption (bit rot, format obsolescence) progresses forward; spontaneous "self-repair" doesn’t occur.  
  - **Trace asymmetry**: Reliable copies exist *only* in the past. Earlier states are independently verifiable via backups, logs, or hashes, while future states leave no traces. This lets archivists "rewind" to uncorrupted versions but never "fast-forward."  
  - **Causal independence**: Copies (e.g., offsite backups, email attachments) are created *before* corruption events and remain unaffected by later failures.  
  Crucially, it does **not** presuppose deep physical laws (e.g., thermodynamics). It relies on observable, statistical realities: storage media degrade predictably; backups are made proactively; future states are inaccessible. Even in a time-symmetric universe, if data decay is statistically likely (and anti-decay vanishingly rare), preservation workflows would remain unchanged. The core need is operational, not metaphysical: past states are *available*; future states are *not*.  

  ---

  ### 2. What It Merely Fits Well With (~150 words)  
  The field aligns neatly—but not essentially—with the **thermodynamic arrow of time** and a **low-entropy early universe**. Entropy increase explains *why* decay dominates: bit flips toward disorder, storage media deteriorate, and coherent data structures dissipate without intervention. The trace asymmetry mirrors cosmology: just as the low-entropy past leaves more detectable relics (e.g., cosmic microwave background), early file versions leave more intact copies. However, preservation would function identically under a weaker **statistical arrow**: if high-entropy states are overwhelmingly probable, backups exploit statistical outliers (low-entropy past states). The practice doesn’t *require* time’s fundamentality; it would work equally if time asymmetry were emergent or perspectival. It fits thermodynamics as a useful analogy, not a dependency.  

  ---

  ### 3. Traces vs. Entropy (~150 words)  
  **Trace asymmetry** (past states leave more evidence) and **entropy increase** are two perspectives on the same core principle: **causality**.  
  - Entropy explains *why* traces accumulate: low-entropy past states allow ordered records (backups, logs), while high-entropy futures don’t.  
  - Traces are the *practical manifestation*: backups exist because we act *now* to preserve a state *before* entropy increases.  
  Neither does unique "work." Entropy provides the physical mechanism; traces operationalize it for preservation. If entropy *decreased*, traces would point forward (e.g., pre-repair from future backups), but statistically, entropy rise makes past-focused traces inevitable. Corruption is repairable from earlier copies *because* those copies were made when entropy was lower relative to the corrupted state. The two are complementary: entropy is the general law; trace asymmetry is its local, archival fingerprint.  

  ---

  ### 4. Bits vs. Recipe (~150 words)  
  The **bits** (exact copy) strategy strictly adheres to time’s arrow: it treats data as a historical artifact, where every past state is unique. Corruption must be reversed by restoring earlier snapshots.  
  The **recipe** approach (code + inputs + seed) subtly **decouples preservation from time’s direction**. It assumes computational processes are *timeless*: rerunning a recipe doesn’t "restore" the original but regenerates an identical output. If the computational universe is deterministic (same inputs → same outputs), the result is functionally indistinguishable from the "original," regardless of when it’s recomputed. This strategy could, in theory, work in a time-symmetric world: regeneration doesn’t care about entropy gradients if the computation is reversible. However, it still relies on *preserving the recipe in the past*, so it assumes trace asymmetry for the inputs, not the output.  

  ---

  ### 5. What You Can Safely Say in Print (~100 words)  
  > "Digital preservation practices reveal how humans navigate time’s arrow. They rely on the empirical fact that data decays irreversibly, and only past states leave recoverable traces—mirroring thermodynamics, but not depending on it. Whether saving exact bits or reproducible recipes, archivists exploit causality: backups exist *before* failures. Even if time’s direction were purely statistical (or perspectival), today’s methods would hold. The ‘recipe’ approach hints at a timeless view of information: if recomputation yields identical outputs, preservation transcends physical decay. Ultimately, the field assumes time’s asymmetry as a practical reality, not a cosmic truth."  

  ---

  This summary stays grounded in the field’s operational logic while clarifying its philosophical underpinnings. Let me know if you’d like deeper expansion on any section!
