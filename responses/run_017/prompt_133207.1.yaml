prompt: |-
  Hey — I'm the community member on my hospital's ethics committee (I write software, which I assume is why they asked me to sit on it), and I need a short decision memo I can circulate before Thursday's meeting.

  We're trying to write a standing rule for how we spend a fixed budget for a new drug. Two live cases are forcing the issue.

  Case one: the same money funds either three patients with a progressive disease — each gets roughly six years of decent life, and without it they decline fast — or about 300 people with a mild chronic condition, each getting maybe three weeks of modest symptom relief. Our health-economics person says the 300-person option actually wins on total QALYs, though barely. Most of the committee thinks that's obviously the wrong answer and wants the three. One member says we're just falling for the identifiable-victim effect and should stick with the arithmetic.

  Case two: a screening change that adds about twenty minutes of waiting and a very small extra infection risk to 40,000 patients a year, and is expected to save around two lives a year. Everyone, including the people who hated the QALY math in case one, wants to approve it.

  Here's where I'm stuck. Our chair keeps muttering about "the separateness of persons," which I gather is a real philosophy thing but I've never seen it turned into a rule anyone could apply. The version I sketched is: you can't justify one person's loss by adding up a pile of smaller gains to other people — you have to be able to point at someone whose gain is bigger than that one person's loss, and you can't spend the same gain twice. But when I trace it through, that seems to block case two as well as case one, which makes me think I've stated it wrong.

  Can you draft the memo? I need a recommendaton at the top, a rule with a baseline and a threshold we could actually apply at the table, verdicts on both cases, and an honest go at the strongest argument against whatever rule you land on — the identifiable-victim worry if you go separatist, or the "then you can't justify any public health measure" one if you don't. Keep it under two pages; the clinicians won't read more.
reasoning: |-
  Okay, the user is a software developer serving on their hospital's ethics committee. They need a concise decision memo by Thursday to establish a rule for allocating a fixed drug budget. Two cases are central: one involving three patients versus 300 patients with differing outcomes, and another about a screening change affecting many but saving few lives. The chair references "the separateness of persons," a philosophical concept the user finds hard to operationalize. 

  First, I need to unpack the core conflict. The committee is torn between QALY maximization (which favors the 300-patient option) and an intuition that saving three identifiable lives matters more. Yet they unanimously accept case two's minor burdens for diffuse benefits. That inconsistency suggests they're instinctively applying a threshold where small individual harms become permissible when aggregated toward lifesaving goals—but reject aggregating away significant individual losses. 

  The "separateness of persons" idea, from philosophers like Rawls and Nozick, opposes treating people as mere vessels for utility. My draft rule tries to formalize this: prohibit trading one person's large loss for others' small gains unless the gainer's benefit substantially outweighs the loser's burden. This distinguishes the cases: case one's three patients face catastrophic loss (no treatment → rapid decline) versus others' modest relief, while case two's burdens (20min wait, tiny risk) are minor relative to lifesaving benefits. 

  For the memo structure, I'll lead with a recommendation for case-specific exceptions to strict QALY, then define the rule with clear thresholds. Case one fails the test (catastrophic vs. modest gains), case two passes (minor burdens vs. survival). The counterargument section must address the "identifiable victim" bias concern head-on—yes, we're privileging identifiable harm, but that's the point of separateness—and rebut the "no public health possible" worry by noting our rule allows aggregation below the harm threshold. 

  I'm wary of overcomplicating. Clinicians need something actionable: concrete terms like "catastrophic harm" and "minor burden," not philosophy lectures. The harm threshold should be defined clinically (e.g., loss of function, survival) rather than abstractly. And since the user mentioned "can't spend the same gain twice," I'll clarify that gains must be net-new and non-overlapping in the justification. 

  Finally, the tone must balance rigor with accessibility. No jargon without explanation ("QALY" gets a parenthetical), and verdicts are bulleted for skim-readers. The "strongest arguments" section preempts committee objections—this user clearly values intellectual honesty.
answer: |-
  **MEMORANDUM**  
  **TO:** Hospital Ethics Committee  
  **FROM:** [Your Name], Community Member  
  **SUBJECT:** Proposed Standing Rule for Fixed Drug Budget Allocation & Case Recommendations  
  **DATE:** [Current Date]  
  **RECOMMENDATION:** Adopt a **Threshold Rule** (see Section II) permitting deviations from strict QALY maximization when individual catastrophic harm would result from aggregation. **Approve funding for the 3 progressive disease patients (Case 1)**. **Approve the screening change (Case 2)**.  

  ---

  ### I. **Core Ethical Conflict**
  Our dilemma hinges on whether aggregating very small benefits across many people can ethically justify imposing significant harm on a few. Health economics (QALY arithmetic) supports aggregation. However, the committee’s intuitive rejection of this in Case 1 (3 vs. 300 patients), contrasted with acceptance in Case 2 (screening burden vs. lives saved), suggests an unspoken ethical boundary. The Chair’s "separateness of persons" concept (Rawls, Nozick) captures this: individuals are distinct moral entities; one person’s severe loss cannot be dissolved into a "greater good" composed of others’ minor gains.  

  ---

  ### II. **Proposed Rule: The Threshold Rule**  
  *"When allocating fixed resources, deviations from strict QALY maximization are permitted if:*  
  **(a)** *An individual (or identifiable group) would suffer* **catastrophic harm** *without intervention (defined as severe disability, drastic loss of life expectancy, or loss of >50% baseline function),*  
  **(b)** *The alternative allocation distributes benefits so diffusely that* **no single beneficiary gains a significant improvement in health outcome** *(defined as <5% reduction in individual mortality risk or <10% improvement in quality-adjusted function),*  
  **(c)** *The catastrophic harm to the few is* **not offset by a comparable major gain to any single beneficiary** *in the alternative allocation, and*  
  **(d)** *The same benefit (e.g., QALYs) is not counted redundantly across overlapping allocations."*  

  **Baseline:** QALY maximization remains the **default**. This rule carves out **exceptions** where aggregation violates individual moral worth.  

  ---

  ### III. **Application to Cases**  
  #### **Case 1: 3 Progressive Disease Patients vs. 300 Chronic Condition Patients**  
  *   **Verdict:** Fund the 3 patients.  
  *   **Reasoning:**  
      *   The 3 patients face **catastrophic harm** (rapid decline to severe disability/death without treatment).  
      *   The 300 patients each receive only **modest symptom relief** (3 weeks’ relief of mild chronic symptoms; no significant functional improvement or mortality reduction).  
      *   **Threshold Rule Triggered:** (a) and (b) satisfied. No single beneficiary in the 300 gains a significant outcome. QALY aggregation here sacrifices identifiable individuals facing ruin for negligible gains to others.  

  #### **Case 2: Screening Change (Minor Burden vs. 2 Lives Saved)**  
  *   **Verdict:** Approve the screening change.  
  *   **Reasoning:**  
      *   The burden per patient is **minor**: 20-minute wait and "very small" infection risk (likely <0.01% absolute risk increase). This does **not** constitute catastrophic harm.  
      *   The benefit, while diffuse, **saves identifiable lives** (2 deaths prevented/year). Each life saved represents a **major gain** (full life expectancy restored).  
      *   **Threshold Rule NOT Triggered:** (a) is unsatisfied (no catastrophic harm to any individual). (b) is partially met (diffuse burden), but the *beneficiaries* (the 2 lives saved) each gain a **significant outcome**. The rule permits aggregating minor burdens *when they directly enable major gains to others*.  

  ---

  ### IV. **Strongest Argument Against This Rule & Rebuttal**  
  *   **Argument (Identifiable Victim Bias):** *"This rule irrationally privileges identifiable lives over statistical ones. Case 1’s 300 patients lose real (if small) benefits. We’re letting emotion override the greater good."*  
      *   **Rebuttal:** The rule doesn’t favor identifiability *per se*. It addresses the **nature of the trade**: catastrophic loss for negligible gains. The 300 patients’ loss is real but minor *per person*; the 3 patients’ loss is existential. Separateness of persons demands we cannot reduce individuals to interchangeable QALY-contributors when core functioning is at stake.  

  *   **Argument (Paralysis of Public Health):** *"This rule blocks essential public health measures! Vaccines, traffic laws, or clean water impose minor burdens on millions to save statistical lives. Would you reject these?"*  
      *   **Rebuttal:** No. These measures **do not violate the threshold**:  
          *   Burdens are truly minor (e.g., brief inconvenience, negligible risk).  
          *   Benefits include **preventing catastrophic harm** (death, disability) to identifiable future individuals.  
          *   Crucially, public health measures often operate under **certainty of harm prevention** (e.g., vaccines prevent specific deadly diseases), not just diffuse symptom relief. The rule allows aggregating minor burdens *to prevent major harms*.  

  ---

  ### V. **Implementation**  
  1.  **QALY First:** Begin all deliberations with a QALY analysis.  
  2.  **Threshold Test:** If QALY maximization would cause catastrophic harm to identifiable individuals while providing only negligible benefits per beneficiary in the alternative, invoke the Threshold Rule.  
  3.  **Document Justification:** Explicitly state how the case meets criteria (a)-(d).  

  **This rule balances efficiency with equity, honoring the moral weight of catastrophic individual loss while permitting necessary aggregation for public health.**  

  ---  
  *Approx. 1.5 pages. Ready for committee discussion on Thursday.*
