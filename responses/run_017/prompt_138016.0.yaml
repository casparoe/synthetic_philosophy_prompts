prompt: |-
  I am trying to write down, in advance of reading any more of the literature, what I should be demanding of a population axiology given the job I actually need it to do. Please write that specification.

  The job: I need an ordering over *policy options*, not over timeless population states. The options available to the institution I advise differ simultaneously in (i) the quality of life of the people who will exist on all of the options, (ii) how many people there will ever be — via birth timing, family-planning and maternal-health funding, or interventions on existential risk that move the expected size of the future by orders of magnitude — and (iii) how well any of that can be known in advance. So the thing to be ranked is a risky prospect over histories, and adequacy means adequacy for choosing under that kind of uncertainty.

  Write the desiderata: which comparisons the ordering must get right, which cases it must dissolve or explain rather than dodge, which distinctions it must respect and which it may collapse, and the consideration behind each. Mark which requirements you take to be non-negotiable for this purpose and which are the preferences of a particular camp. Then the part I most want: flag any subset of the requirements you suspect is jointly unsatisfiable, sketch the argument, and say which single requirement does the most work in excluding candidate views. If two of my own requirements below are really one requirement, or are not requirements at all, say so.

  Three candidates of mine, which I want kept, sharpened, or rejected as confused:

  1. *Grain-invariance.* The ranking of two options must not change when the very same history is redescribed at a finer temporal or personal grain — as persons, or as person-stages, or as processes with fuzzy boundaries. If a view's verdicts swing with the bookkeeping, I want to know whether that is a feature of the view or a reductio of it.

  2. *Individuation-robustness.* Consider a population of software persons where minds can split into two successors and two can merge into one, so that at a given time there may be no fact of the matter how many people there are. The axiology must still rank options in which such entities figure, and the ranking must not be a function of an arbitrary counting convention imposed on a continuum of intermediate cases.

  3. *Actionability under cluelessness.* Every real option seems to have small-probability effects on enormously large far-future populations, so a theory whose verdicts are always dominated by speculative tails may be unusable for the job I have described — unless the view also tells the agent what to do when that happens. I cannot tell whether this is a genuine desideratum or an impatience of mine that a theory is entitled to ignore.

  My suspicion going in is that avoiding the repugnant conclusion, honouring the step-by-step pull of mere-addition reasoning, and ranking different-number comparisons at all while staying transitive cannot all be had together, and that the costs of giving up each are not alike — but I would rather see the conflict located precisely than confirmed. Close with a scorecard of at most a few lines each for total utilitarianism, average utilitarianism, critical-level views, and person-affecting or restrictive views, and name any requirement that none of them meet.
reasoning: |-
  Okay, the user is asking for help in defining a specification for a population axiology tailored to their specific needs. They're advising an institution and need to rank policy options under uncertainty, considering three key factors: quality of life, population size (including existential risks), and uncertainty about outcomes. 

  First, I notice they're trying to articulate their requirements before diving deeper into existing literature - that's smart. They want to avoid being biased by existing frameworks. Their three candidate requirements are interesting: grain-invariance (shouldn't depend on how we slice time or individuals), individuation-robustness (must handle fuzzy entities like software persons that merge/split), and actionability under cluelessness (can't let speculative far-future tails dominate decisions).

  Hmm... the core challenge seems to be that they need something more practical than theoretical - not just ranking ideal population states, but real policies with uncertainty. The grain-invariance and individuation-robustness points suggest they're worried about metaphysical arbitrariness, while the cluelessness point is deeply pragmatic.

  Let me structure this properly. The specification should include: core ordering properties (completeness, transitivity), domain coverage (must handle all three factors), uncertainty tools (probabilities, stochastic dominance), and their three special requirements. For conflicts... ah yes, the big one is likely between avoiding repugnant conclusions while honoring mere-addition intuition AND allowing different-number comparisons without intransitivity - that's the classic impossibility triangle in population ethics. 

  For scoring existing theories: Total utilitarianism fails cluelessness and repugnance, average utilitarianism fails different-number cases, critical-level gets messy with uncertainty, and person-affecting views struggle with non-identity problems. None fully satisfy individuation-robustness. 

  The user's suspicion about fundamental conflicts seems spot-on. I should emphasize that grain-invariance might be the most important filter since so many theories depend on arbitrary individuation. And their "impatience" about cluelessness is absolutely a valid requirement - any usable policy tool must handle uncertainty.
answer: |-
  Here’s a specification tailored to your policy-ranking task, structured as requested. Requirements are derived from your operational needs (ranking risky prospects with variable populations/quality/uncertainty) and your candidate intuitions.

  ---

  ### **Core Requirements (Non-Negotiable)**

  1.  **Stochastic Ordering:** Must rank *risky prospects* (probability distributions over histories), not just deterministic states. Must obey:
      *   **Completeness:** Every pair of prospects is comparable (or explicitly incomparable with a decision rule).
      *   **Transitivity:** If A ≻ B and B ≻ C, then A ≻ C.
      *   **Context:** Essential for real-world policy choices under uncertainty.

  2.  **Domain Coverage:** Must handle prospects differing simultaneously in:
      *   Quality of life (welfare) for affected beings (i).
      *   The number of beings who ever exist (ii).
      *   The degree of uncertainty (epistemic/metaphysical) about outcomes (iii).
      *   **Context:** Your institutional mandate explicitly covers all three dimensions.

  3.  **Grain-Invariance (Sharpened):** The ranking of two prospects must be invariant under:
      *   Redescription of welfare-bearing entities (e.g., persons vs. person-stages vs. fuzzy processes).
      *   Redescription of temporal stages (e.g., continuous time vs. discrete intervals).
      *   *Requirement:* If two prospects are identical *modulo* such redescription, their ranking must be unchanged. *Non-negotiable*. A violation suggests the view depends on arbitrary metaphysical bookkeeping, unfit for policy where description can be contested.

  4.  **Individuation-Robustness (Sharpened):** Must rank prospects involving entities where:
      *   Identity is vague (e.g., fission/fusion of minds).
      *   Counting is indeterminate or conventional (e.g., continuum cases).
      *   *Requirement:* The ranking must be a function *only* of the distribution of *welfare experiences* across the prospect, *not* of an arbitrary assignment of "personhood" or count. *Non-negotiable*. Essential for covering future entities (AI, uploads) and avoiding arbitrary choices.

  5.  **Actionability Under Cluelessness (Valid Desideratum):** Must provide usable guidance when:
      *   Every feasible option has non-zero probability of affecting vast future populations.
      *   Expected value calculations are dominated by speculative, low-probability tails.
      *   *Requirement:* The theory must either (a) yield determinate, non-speculation-dominated verdicts in such cases, or (b) explicitly prescribe a decision procedure (e.g., satisficing, maximin-like rules under deep uncertainty) for when its core ranking is "clueless". *Non-negotiable for usability*. Your "impatience" is justified – a theory unusable in key cases fails its purpose.

  ---

  ### **Substantive Desiderata (Strong Preferences, Potential Tensions)**

  6.  **Avoids Strong Repugnant Conclusion (SRC):** Must not rank a prospect Z (vast population with lives *barely* worth living) as better than a prospect A (smaller population with *very* high quality lives), if A is clearly preferable under intuitive standards. *Preference*: SRC acceptance often violates strong intuitions about quality/quantity tradeoffs.
  7.  **Honors Mere Addition Intuition (Weakly):** Should generally (but not necessarily universally) rank prospect A+ (adding lives with positive welfare, without harming others) as at least not worse than prospect A. *Preference*: Rejecting this entirely feels like denying the goodness of creating happy lives.
  8.  **Different-Number Comparability:** Must meaningfully rank prospects involving different total numbers of beings. *Preference*: Refusing to compare (e.g., person-affecting views) often yields paralysis on critical population-affecting policies.

  ---

  ### **Suspected Conflicts & Key Excluder**

  *   **The Core Impossibility Triangle:** Your suspicion is well-founded. Satisfying **Avoids SRC (6)**, **Honors Mere Addition (7)**, and **Different-Number Comparability (8)** *while maintaining Transitivity (1b)* is likely **impossible** for a wide class of axiologies under deterministic comparisons (Parfit, Arrhenius). Uncertainty might soften, not dissolve, this.
      *   **Conflict Sketch:**
          1.  Mere Addition (7) suggests A+ ≥ A.
          2.  Avoiding SRC (6) requires rejecting that a long chain of "mere additions" plus quality reductions (A → A+ → B → ... → Z) makes Z better than A.
          3.  Transitivity (1b) forces a break: Either reject some Mere Addition step (violating 7), accept the chain to Z (violating 6), or declare A and Z incomparable (violating 8).
      *   **Uncertainty Complication:** While stochastic dominance might help avoid *some* SRC chains, deep uncertainty about vast futures reintroduces cluelessness.

  *   **Key Excluding Requirement:** **Grain-Invariance (3)** does the most work in excluding candidates. Many views (e.g., Average Utilitarianism, some Critical-Range views) rely fundamentally on *counting discrete individuals* or defining precise temporal stages. If welfare is grounded in experiences occurring within fuzzy spatio-temporal processes, these views fail Requirement 3 immediately.

  ---

  ### **Scorecard of Major Views**

  | View                     | Strengths for Your Task                     | Fatal Weaknesses for Your Task                   |
  | :----------------------- | :------------------------------------------ | :----------------------------------------------- |
  | **Total Utilitarianism** | Simple, Grain-Invariant (if welfare-based), Strong Different-Number Comparability. | Fails **Avoids SRC (6)**, Fails **Actionability (5)** (dominated by speculative tails). |
  | **Average Utilitarianism**| Avoids SRC in simple cases.                 | Fails **Grain-Invariance (3)** (sensitive to temporal/personal slicing), Fails **Individuation-Robustness (4)**, Fails **Different-Number Comparability (8)** meaningfully (rejects adding happy lives if average dips). |
  | **Critical-Level (CL)** | Can Avoid SRC (depending on CL), Comparability. | Fails **Grain-Invariance (3)** (if CL tied to persons), Fails **Individuation-Robustness (4)**, **Actionability (5)** problematic (uncertainty about CL/welfare levels), Mere Addition (7) often violated. |
  | **Person-Affecting/Restrictive**| May Avoid SRC, respects some intuitions.    | Fails **Different-Number Comparability (8)** (often incomparable), Fails **Mere Addition (7)**, Struggles with **Domain Coverage (2ii/iii)** & **Uncertainty**, Fails **Individuation-Robustness (4)** if identity matters. |

  **Requirement None Fully Meet:** **Individuation-Robustness (4)**. Most axiologies assume discrete, countable, identifiable individuals. Views truly grounded *only* in the distribution of welfare *experiences* across spacetime continua are rare and underdeveloped. **Actionability Under Cluelessness (5)** is also a major challenge for all standard views.

  ---

  **Recommendation:** Prioritize **Grain-Invariance (3)** and **Individuation-Robustness (4)** as filters. This strongly points towards *welfarist* views where the fundamental "atoms" are *welfare experiences* (or moments of experience) rather than "persons". Explore:
  1.  **Hedonic Totalism (with experience focus):** Addresses 3 & 4, but fails SRC & Actionability.
  2.  **Risk-Aware/Decision-Theoretic Modifications:** E.g., applying stochastic dominance rules robust to tail uncertainty, or incorporating ambiguity aversion/satisficing specifically for cluelessness (Requirement 5).
  3.  **"Continua-Friendly" Critical Views:** If a critical threshold applies to *welfare levels of experiences* independently of personal identity, might better satisfy 3 & 4 than standard CL (though still faces challenges).

  The fundamental tension (Avoid SRC vs. Mere Addition vs. Comparability) remains. You'll likely need to relax one significantly or adopt a complex, context-sensitive view. **Actionability Under Cluelessness (5)** demands explicit decision rules beyond pure expectation maximization for your most critical cases.
