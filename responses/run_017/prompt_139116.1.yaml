  The user asked about alternative theories that reject deflationism. For substantive theories like correspondence, they might satisfy (1) but struggle with epistemic access. Primitivism takes truth as basic but risks being unexplanatory. Pluralism says truth varies by domain but still needs a core norm. Quietism avoids theorizing but might not help here. Expressivism separates norms from properties but could make truth's normativity subjective.

