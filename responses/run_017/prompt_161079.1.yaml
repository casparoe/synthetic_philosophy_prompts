prompt: |-
  so I'm writing a novel and one of my characters — Ines, night porter at a big hotel — runs her day on a routine so exact that another character accuses her of being a machine. Not cruel, not cold, just running a program. I want that accusation to actually mean something, and the word I keep circling is sphexish: the digger-wasp thing where the wasp paralyses a cricket, drags it to her burrow, leaves it on the step, goes in to inspect, comes back out and hauls it in — and if you nudge the cricket a few inches while she's down there, she runs the whole inspection from the top again, apparently without end. Not stupid, just locked.

  I need a spec before I write the scene. Give me the desiderata for a theory of sphexishness: what an account of the difference between rigid mechanical behaviour and flexible agency has to deliver to be worth anything. Purpose matters here, so: good enough for two things — (1) a reader should be able to tell, from what I put on the page, whether Ines is sphexish or is just a woman who likes her routines, and (2) the accusation has to be able to do moral work between characters, excuse or blame, without collapsing into "she isn't free."

  For each requirement give the case or consideration behind it. The cases I want covered: the wasp; a sleepwalker; an OCD hand-washing ritual; a concert pianist whose hands know the piece better than she does; a nurse on autopilot at 4am; a bureaucrat who follows procedure and is thereby monstrous; a tick or an ant with a three-item repertoire; a language model producing perfectly fluent text; and a person whose options have all been quietly closed off by money or threat — she varies her behaviour lots, but every variation was scripted in advance by someone else.

  Two things I've been mulling that you should fold in. First, off-distribution rigidity: it feels to me like sphexishness is a property of a system relative to a *range* of environments, not a binary trait of the system, so a thing can be fabulously flexible inside the range it was built for and still fall apart the moment you move the cricket. Second, canned spontaneity: a system whose flexibility is itself stereotyped — the improv student with forty bits she recombines, the rebel teenager performing rebellion — strikes me as sphexish in a higher-order way, and I want to know if the theory can say that or whether it's just a prejudice of mine.

  Also tell me: which distinctions the theory must not collapse (stupid vs rigid vs predictable, behaviour vs mechanism vs history, local vs global rigidity, degrees vs threshold), which requirements are non-negotiable and which are camp preferences (I assume "must not smuggle in indeterminism" is non-negotiable and "must be legible from the outside" is negotiable for some camps), and whether any subset is jointly unsatisfiable — my hunch is that "diagnosable third-personally" and "sensitive to the agent's reasons" can't both hold, and that "graded" and "sharp enough to blame on" can't either. Which single requirement rules out the most candidate accounts? A line each on the obvious candidates — behavioural, mechanistic, reasons-responsive, information-theoretic — is fine, but keep the weight on the criteria, not the scorecard.
reasoning: |-
  Okay, the user is writing a novel and wants to develop a theory of "sphexishness" for their character Ines. They need desiderata for distinguishing rigid mechanical behavior from flexible agency. Let me start by understanding their main requirements.

  First, the user wants the theory to help readers discern if Ines is sphexish or just routine-loving. That means the theory needs observable indicators. Examples like the wasp, sleepwalker, and OCD ritual suggest behaviors that break under perturbation. So Requirement 1 should focus on perturbation response. If moving the cricket causes repetition without adjustment, that's sphexish.

  Second, the accusation must carry moral weight without denying freedom. So Requirement 2 has to separate sphexishness from determinism. Cases like the coerced person show that even varied behavior can be scripted, so the theory must address hidden constraints. This ties into "canned spontaneity" where actions seem flexible but are actually pre-programmed.

  The user's off-distribution rigidity point is key. Flexibility within a range isn't enough; true agency adapts to novel situations. Requirement 3 should cover environmental range. The concert pianist is fluid in performance but might sphex under unexpected changes, like a broken string. But if they adapt, that's agency.

  Canned spontaneity (Requirement 4) deals with higher-order rigidity. The improv student using pre-set bits is still sphexish because their flexibility is superficial. This needs to be distinguishable from genuine creativity.

  For distinctions, the theory mustn't conflate stupidity with rigidity. The wasp isn't dumb; it's locked into a loop. Also, predictability alone doesn't imply sphexishness—routine-loving humans are predictable but adaptable. The nurse on autopilot might handle a crisis, showing local vs. global rigidity.

  Non-negotiables include no indeterminism. Freedom isn't about randomness. Also, the theory must avoid circularity by not relying on unobservables. Graded sphexishness (Requirement 5) allows for degrees, but moral blame needs a threshold. The bureaucrat following harmful procedures might be more sphexish if they can't question them.

  The toughest requirement is combining third-person diagnosis with sensitivity to reasons. Observers can't see internal states, but moral blame requires understanding intent. Maybe the theory uses proxies like justification after perturbation. If Ines can explain a change in routine, she's less sphexish.

  The coerced person case is challenging. Their behavior varies, but it's scripted externally. The theory must distinguish external constraints from internal rigidity. If Ines's routines are enforced by threat, that's different from internal programming.

  Requirement 6 (counterfactual variation) might help here. If Ines could choose differently under the same stimuli, she's not sphexish. But if all options are blocked, even varied actions are sphexish by constraint.

  The language model example is sphexish because it can't handle off-distribution queries meaningfully. But if a system adapts its algorithms, it's less sphexish. However, true agency requires deeper flexibility.

  For moral work, the theory must show that sphexishness reduces culpability if behavior is rigid, but increases it if there's a duty to adapt (like the bureaucrat). Ines might be blamed for not questioning her routine when needed, but excused if she's incapable.

  The user’s deeper need is thematic depth. They want sphexishness to explore autonomy and control. The theory should enrich character interactions, making the accusation a pivot for conflict or empathy. Ensuring the criteria serve narrative tension is crucial.
answer: |-
  Here’s a theory-of-sphexishness spec structured around your desiderata, cases, and constraints. Focus is on **diagnostic power** (for narrative) and **moral salience** (for character dynamics), grounded in your examples.

  ---

  ### **Core Requirements for a Theory of Sphexishness**  
  *(With Rationale & Key Cases)*  

  1. **Perturbation Response Rigidity**  
     - *Must deliver*: Failure to adapt *on the fly* to unexpected environmental changes (like moving the cricket).  
     - *Rationale*: Distinguishes **OCD ritual** (rewashes if interrupted) from **routine-lover** (sighs but adjusts).  
     - *Cases*: Wasp (resets after cricket moved), sleepwalker (persists despite obstacles), bureaucrat (ignores moral emergencies for procedure).  

  2. **Hidden Constraint Exposure**  
     - *Must deliver*: Reveals when behavior is *covertly bounded* by external forces or internal programming, even if surface variability exists.  
     - *Rationale*: Captures **coerced person** (all "choices" scripted by threat/money) and **canned spontaneity** (teen rebel recombining clichés).  
     - *Cases*: Language model (fluent but trapped in training distribution), improv student (flexible only within memorized fragments).  

  3. **Environmental Range Dependence**  
     - *Must deliver*: Diagnoses rigidity relative to an *expected context*. Flexibility within one domain ≠ agency.  
     - *Rationale*: Addresses **off-distribution rigidity**. **Concert pianist** is fluid *in performance* but may sphex if a string snaps mid-concerto.  
     - *Cases*: Nurse on autopilot (handles routine tasks mechanically but adapts to a code blue).  

  4. **Recursive Rigidity (Meta-Sphexishness)**  
     - *Must deliver*: Identifies when *adaptation strategies themselves* are fixed scripts.  
     - *Rationale*: Handles **canned spontaneity**. "Creative" acts are sphexish if they’re just re-runs (e.g., rebel teen’s "original" tattoo is mass-produced).  
     - *Cases*: Improv student, bureaucrat following "innovation protocol".  

  5. **Graded Sphexishness**  
     - *Must deliver*: A continuum from total rigidity (tick) to robust agency, not a binary.  
     - *Rationale*: **Concert pianist** is *less* sphexish than **wasp** but *more* than an improvising jazz musician. Moral weight scales with degree.  
     - *Cases*: OCD (high rigidity) vs. routine-lover (low rigidity).  

  6. **Counterfactual Variation Capacity**  
     - *Must deliver*: Evidence that the agent *could have varied* behavior *under identical stimuli* if goals required it.  
     - *Rationale*: Separates **sphexishness** (no counterfactual paths) from **predictability** (pianist *could* improvise if she chose).  
     - *Cases*: Nurse on autopilot *could* snap awake for an emergency (non-sphex) vs. wasp *cannot* skip inspection (sphex).  

  ---

  ### **Non-Collapsible Distinctions**  
  - **Stupid vs. Rigid**: Wasp isn’t dumb; it’s *mechanically competent* but inflexible.  
  - **Predictable vs. Sphexish**: Routine-lover is predictable but adaptive; sphexishness is *predictable failure to adapt*.  
  - **Local vs. Global Rigidity**: Nurse is locally rigid (med rounds) but globally flexible (crisis response).  
  - **Behavior vs. History**: **Coerced person** has varied *behavior* but sphexish *history* (all options pre-scripted).  
  - **Degrees vs. Threshold**: Moral blame requires a *minimum threshold* of rigidity (e.g., bureaucrat enabling harm).  

  ---

  ### **Non-Negotiables vs. Preferences**  
  | **Non-Negotiable**                     | **Negotiable (Camps Vary)**          |  
  |----------------------------------------|--------------------------------------|  
  | No indeterminism (freedom ≠ randomness)| Legible from outside (some theories require intent access) |  
  | No circularity (e.g., "free if not sphex") | Mechanism details (neural vs. algorithmic) |  
  | Moral relevance (blame/excuse scaling) | Single diagnostic metric            |  
  | Graded (not binary)                    |                                      |  

  ---

  ### **Tensions & Dealbreakers**  
  1. **"Diagnosable third-personally" vs. "Sensitive to reasons"**:  
     - *Tension*: Observers see behavior, not intent. **Resolution**: Proxy via *justification post-perturbation*. If Ines says *"I had to restart because Rule 12"* (sphex) vs. *"The disruption risked efficiency"* (agentic).  
     - *Dealbreaker for*: Pure reasons-responsive theories (misses covert constraints).  

  2. **"Graded" vs. "Sharp enough to blame on"**:  
     - *Tension*: Continuum needs thresholds for blame. **Resolution**: **Duty-relative rigidity** (e.g., nurse’s sphexishness is blameworthy *only* if she fails in adaptability-required tasks).  
     - *Dealbreaker for*: Binary theories (e.g., "conscious = non-sphex").  

  **Most Exclusionary Requirement**: **#2 (Hidden Constraint Exposure)**.  
  - Rules out behavioral theories (misses coerced person’s surface flexibility).  
  - Challenges mechanistic theories (scripted rebel teen has complex biology).  

  ---

  ### **Candidate Account Pitfalls**  
  - **Behavioral (e.g., perturbation tests)**: Fails **coerced person** (varied behavior hides constraints).  
  - **Mechanistic (e.g., fixed algorithm)**: Fails **recursive rigidity** (improv student’s "creative" brain is still sphexish).  
  - **Reasons-Responsive (e.g., reacts to reasons)**: Fails **wasp** (no "reasons") and **language model** (simulates reasons).  
  - **Information-Theoretic (e.g., low entropy responses)**: Fails **concert pianist** (low entropy ≠ rigidity).  

  ---

  ### **Theory Requirements Summary**  
  A theory of sphexishness must:  
  1. **Spot rigidity under perturbation** (not just routine).  
  2. **Expose covert bounds** (even behind varied acts).  
  3. **Scale rigidity to environmental novelty**.  
  4. **Detect scripted "flexibility"**.  
  5. **Quantify a rigidity gradient**.  
  6. **Demand counterfactual capacity**.  
  ... while **distinguishing stupidity from lock-in**, and **allowing blame without free-will metaphysics**.  

  **For Ines**: Show her failing a perturbation test (e.g., hotel fire drill during her ritual), reacting with mechanical restart (*not* panic/adaptation), and justifying it with rule-literalness. Pair this with hints of hidden constraints (e.g., "Ines never deviates; it’s as if she’s wired to the hotel’s blueprint"). Moral work: Another character can accuse her of being a "ghost in the hotel’s machine" — blaming her not for *lacking freedom*, but for *surrendering agency to protocol* when lives are at stake.  

  --- 
  This spec ensures sphexishness is a *clinically observable, morally charged, and environmentally relative* lock-in — perfect for nuanced character conflict.
