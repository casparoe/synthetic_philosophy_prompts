  hey — I need a hand turning a half-baked idea into something I can actually submit. I'm in my forth year, and I'm applying for a one-semester internal dissertation fellowship: four months of funding, two-page proposal, and the committee is one philosopher, one political scientist and one econ person, so it has to be legible outside a seminar room while still being a real philosophy project rather than a summary of one. The chapter it's for is on Kavka's toxin puzzle, and I've become convinced everyone is fighting about the wrong thing. The standard dialectic, as I see it: one camp says of course you can form the intention, by getting yourself into the right state — self-manipulation, commitment devices, whatever; the other says no, intention is partly belief-like, it's constrained by what you believe about your own future action, and since you know you won't drink, you can't intend to. And then the payoff is supposed to be that the answer tells us something about deterrent threats, where you have to intend to do something that would be pointless if you ever had to do it. Fine. But both camps take for granted that the subject is *certain* she won't drink, and I think that's load-bearing in a way nobody has checked.

  Here's the half-formed bit. Run a version where the billionaire's machine can't read intentions directly, only your confidence that you'll drink, and the payout is proportional to that number rather than all-or-nothing at midnight. Now the subject isn't at certainty; she's somewhere on a curve, and she has some inkling that she's the sort of person who sometimes follows through. The question I can't get straight: does intention degrade smoothly as self-predictive confidence falls, or is there a cliff — a threshold below which trying to A just stops being intending to A? If there's a cliff, the original puzzle is the limit case at confidence zero and the interesting work is locating the cliff and saying why it's there; if there's no cliff, the 'you can't intend what you believe you won't do' camp owes us an account of what weaker state is doing the work in ordinary action. And then the deterrence application looks different, because real deterrent credibility is a matter of the target's estimate, not the threatener's private state: maybe intention turns out to be doing less work in that story than the literature assumes, and what's needed is a public signal.

  So: write me the two-page proposal. I need the question stated precisely enough that it has a determinate answer, an explanation of why the two standard camps leave it open (and don't just say 'both have intuitions' — that won't survive the econ person), what I'd actually do month by month across four months, and an honest failure section: what would make this collapse, what's the realistic scope, and — seriously — what you'd say if you think my advisor is right that the whole thing just dissolves into Newcomb's problem. I had a version of this argument with a friend in econ who said the proportional-payout variant is just a scoring rule for a belief and I'm reinventing proper scoring rules; my reply was that beliefs have accuracy conditions and intentions don't, or maybe they do and that's the point, and I genuinely don't know where that lands. Please don't pad it with a bibliography or citations, I'll fill those in myself — refer to positions by description, not by author and year. And I'm fine with a little formalism, basic decision theory and fixed points are fine by me; what I don't want is a two-page shrug.
