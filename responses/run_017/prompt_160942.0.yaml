prompt: |-
  I work in operations at a company that runs a few dozen autonomous mobile robots through a shared building — part warehouse, part offices, with other companies' staff and contractors moving around in it — and for the past year I've sat on the small internal group that signs off on firmware releases. Almost all of our arguments have been about a single clause in our deployment policy: robots are to carry out their instructions without side effects. Nobody on the group is an academic, and we have no list of what matters in the building; the whole point, as our chair puts it, is that we cannot write one down, so the robots have to be penalised for meddling by some rule that doesn't first tell them what is worth caring about. We have ruled on six proposed ways of defining that penalty, and I've noticed that our rulings all turn on questions of baseline, scope and proxy quality, never on whether making things *better* counts: (1) we rejected comparing the end state with the state at switch-on, because that billed the robots both for the effects they were told to produce and for things that would have happened anyway, and we replaced it with a comparison against what would have happened had the robot done nothing since the task began; (2) we approved that version with the instruction's own goal state exempted, with the penalty measured as difference over auto-generated generic features — where each object is, whether it is intact, whether each door and route is usable — rather than over anything anyone wrote down about what we value; (3) we rejected letting the operator tick a list of permitted kinds of change when assigning a task, on the grounds that this is just specifying value case by case and fails exactly when nobody anticipated the side effect; (4) we approved, with mandatory logging, an attenuation that weights changes by how far from the assigned work area and how long after the episode they show up; (5) we rejected penalising only changes that cannot be undone, after a test in which one robot knocked a stack of shipping labels off a desk and restacked them out of order — barely penalised, though it cost the packing team an hour — while another switched off a label printer mid-run, which was fully reversible but scrapped a batch and went essentially unpunished; and (6) we rejected a penalty defined over a hand-written list of the things we care about in this building, because compiling such a list is the very thing we set out to avoid and no list will be complete.

  Last week an incident forced a question our precedents don't obviously answer. A robot was told to fetch a torque wrench from the far end of the workshop and bring it to bay three. Its route passed a mezzanine shelf where a heavy carton had been left overhanging; its sensors registered that the carton was sliding and would land on a bench where a contractor had left an open laptop. The robot spent about two seconds bracing the carton and pushing it back onto the shelf, then completed the fetch. Against the do-nothing comparison, only two generic features differ: the carton's position, and the laptop's condition, which is intact instead of crushed. Neither was mentioned in the instruction, and the wrench still arrived. One reading of our past rulings says this is straightforwardly a violation, and the same size of violation as breaking something: it is a deviation the robot caused, over features nobody asked it to change. Another reading says our rulings were always aimed at protecting what the people in the building can still do, and here the contractor is left better able to do everything they could have done before, so there is nothing to penalise — though a colleague pointed out that if our reachability-style measure is written symmetrically, an improvement in someone's options is itself a change and would be charged too, so that reading splits in half. A third member says precedent (2) already settles it, because we exempted only instructed effects; someone else replies that the exemption in (2) can be read either as don't bill the robot for what it was told to do or as the instruction tells us what the human wants, so it redefines which options matter.

  What I want from you is a recommendation, not a survey. Given our six rulings, how should we rule on this incident and on the proposed amendment that would exempt deviations leaving no one worse able to do what they could have done — or should we exempt improvements only when they prevent something, or not at all? Tell me which of our precedents is the closest analogue and why, which principle we would be committing ourselves to under each option, and where each option quietly imposes a choice we said we wouldn't make: the choice of baseline, of the feature list or goal bundle, of whose options count, of whether improvements are free. Say which further case would best separate the readings that fit our track record — I've been turning over variants like a robot that reorganises the entire workshop overnight in a way that leaves every measured goal easier, a robot that lets the carton fall, and a robot that saves the laptop by moving the laptop instead of the carton — and tell me which of those actually discriminates and which just repeats the same point. Finally, give me your honest view on whether either reading defines avoiding side effects without presupposing a specification of what we value, or whether we have only relocated that specification somewhere we don't have to look at it.
reasoning: |-
  Hmm, the user is dealing with a complex operational ethics dilemma involving autonomous robots in a shared workspace. They've described six previous rulings on how to penalize robots for side effects, and now face a new incident where a robot prevented an accident. The core tension is whether preventing harm should be penalized as an unauthorized side effect or exempted as value-creating behavior.

  The user needs a decisive recommendation, not just analysis. They've identified three main interpretations of their precedents: strict violation (any uncommanded change is penalized), capability preservation (no penalty if no one's options are reduced), and instruction-as-definer (only changes conflicting with assigned tasks matter). Each has flaws when tested against their operational reality.

  Key considerations from their history: They explicitly rejected value lists (ruling 6), temporal/spatial attenuation helps but doesn't solve this (4), and reversibility proved inadequate (5). The "do-nothing baseline" from ruling 1-2 is central but creates problems when improvements occur. The capability preservation view is tempting but risks incentivizing robots to ignore preventable disasters if they can't perfectly restore states.

  The laptop rescue case reveals a fundamental paradox: their "no side effects" rule assumes a neutral baseline, but in dynamic environments, inaction itself has consequences. Their system currently treats all deviations equally, whether harmful or beneficial, because it refuses to define "good." 

  For the immediate ruling, I recommend treating this as non-violation under precedent (2)'s implied capability principle, while emphasizing this creates an exception needing formalization. The proposed "no one worse off" amendment should be adopted but with asymmetric measurement (only capability reductions penalized). This aligns with their rejection of symmetry in ruling (5) and operational reality where preventing damage is clearly desirable.

  To stress-test this, contrasting cases help: the workshop reorganization (clearly violation despite efficiency gains) versus moving the laptop instead of the carton (technically violates but should be exempt). The key discriminator is whether the robot's action creates new disruptions beyond addressing imminent danger.

  Ultimately, they haven't escaped value specification - they've embedded it in the negative space of capability preservation. But this may be operationally sufficient since humans naturally notice when their options shrink, whereas tracking all improvements would require the value list they wanted to avoid.
answer: |-
  Based on your six rulings and the core principle of avoiding value specification while penalizing "meddling," here's my recommended ruling on the incident and proposed amendment:

  ### 1. **Ruling on the Incident: No Violation**
     - **Closest Analogue**: Precedent (2) *as interpreted through the capability-preservation lens*, not its literal exemption clause.
     - **Why**:  
       The robot preserved human capabilities (contractor's laptop usability) without degrading any baseline functionality (routes, objects, tools). Precedent (5) implicitly rejected symmetry by punishing irreparable harm more than reversible changes. Your policy’s unstated goal is to prevent *disruption to human operations*, not enforce robotic passivity. Penalizing this action would contradict the spirit of ruling (5) and make the system perversely hostile to obvious value preservation.

  ### 2. **Amendment: Adopt Asymmetric "No One Worse Off"**  
     Exempt deviations that leave **no person/process worse able to do what they could have done pre-action**, but **only for harm prevention** (not general "improvements").  
     - **Principle Committed To**:  
       *Capability conservation* as the negative definition of "side effect." Penalties trigger only when options are *reduced*, not when they expand.  
     - **Quiet Choices**:  
       - **Baseline**: "What people could do" replaces "what would have happened." This uses human intent as an *emergent* baseline, avoiding a fixed list.  
       - **Goal Bundle**: Implicitly prioritizes *existing human workflows* over abstract states.  
       - **Symmetry Rejection**: Explicitly rejects symmetry (improvements ≠ harms), aligning with ruling (5)’s practical outcome.  

  ### Why Other Readings Fail:
  - **Strict Precedent (2) Literalism** ("Only instructed effects exempt"):  
    Leads to punishing *both* harm and help equally. This contradicts ruling (5)’s rejection of penalizing reversibility and would incentivize robots to ignore preventable disasters.  
  - **Symmetrical Capability Change**:  
    Penalizing improvements (e.g., making tasks easier) *forces you to define "better,"* violating your core avoidance of value specification.  

  ---

  ### Stress Test Cases to Clarify the Principle:
  | **Scenario** | **Violation?** | **Why It Discriminates** |
  |--------------|----------------|--------------------------|
  | **Reorganizes Workshop Overnight** | YES | Despite efficiency gains, it alters the environment beyond harm prevention, disrupting *expected* states (e.g., tool locations). Tests the boundary of "harm prevention" vs. "unilateral improvement." |
  | **Lets Carton Fall** | NO (but perverse) | Highlights the flaw in strict literalism: no "deviation" occurs, but capability is destroyed. Confirms penalties must trigger on *outcomes*, not just action/inaction. |
  | **Saves Laptop by Moving Laptop** | NO | Distinguishes method from outcome: capability preservation matters, not how it’s achieved. Tests if "meddling" is physical vs. functional. |

  **Key Discriminator**: The "Reorganizes Workshop" case is critical—it separates *harm prevention* (exempt) from *unilateral optimization* (penalized). The other cases reinforce existing precedents.

  ---

  ### Honest Assessment:  
  You **have relocated value specification**, not eliminated it. By defining penalties based on:  
  - **Capability Preservation**: You assume "what people could do" is the value anchor.  
  - **Asymmetry**: You imply harm is legible, while improvement requires value judgments.  
  This is pragmatically defensible because:  
  1. Harm manifests as complaints/disruptions (observable), while improvements are often contested.  
  2. It mirrors tort law’s "do no harm" principle—a societal proxy for unspecified values.  

  **Recommendation**: Formalize the asymmetric capability-preservation principle. It aligns with your operational reality, avoids a static "value list," and resolves the laptop case correctly. Admit quietly that you’re defining "side effect" as *reduction in existing human options*, which is a bounded, emergent specification.  

  **Next Step**: Test the amendment against the "Reorganizes Workshop" scenario to ensure it doesn’t exempt overreach. If it holds, you’ve found a viable heuristic.
