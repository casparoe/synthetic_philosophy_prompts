  First, I need to design the two cases clearly. The deterministic case is straightforward: Cheap vs. Safe, with fixed identities tied to policies. The Drift case must ensure no de re counterfactuals exist - same expected number of people, same probability of existence per candidate, differing only in welfare outcomes. Key to avoid smuggling in same-person harm or variable numbers.

  For the exam question structure: Part (a) should force candidates to articulate why no-harm works in deterministic case (absence of same-person comparison) and why this fails in Drift (counterfactual indeterminacy). Part (b) needs to push for strongest complaint - likely expected welfare per candidate individual. But is this genuinely person-affecting? That's the crux. Part (c) requires identifying the hidden premise: that candidate individuals are robustly identifiable across possibilities. The standard argument assumes but doesn't justify this. Part (d) involves downstream costs - if we grant this premise, we might collapse back into standard person-affecting ethics; if denied, we face aggregation problems. Part (e) must address real-world implications: since we can't distinguish deterministic vs chancy effects, how should we approach future policies?

  For the model answer: Take a definite stand. Argue that candidate-indexed expected welfare is the strongest complaint but only impersonally person-affecting because it presumes transworld identity of candidates. This doesn't dissolve but relocates the problem. Highlight partition sensitivity - probabilities could be grouped differently, affecting "individual" complaints. Conclude that Drift exposes but doesn't solve nonidentity; it shows person-affecting approaches require untenable metaphysical commitments.

  Marking scheme: Five 4-point must-hits: 1) Correct no-harm explanation in deterministic case. 2) Precise articulation of counterfactual unavailability in Drift. 3) Formulation of expected welfare complaint and its status. 4) Identification of the transworld identity premise. 5) Downstream cost/practical implication analysis. Typical errors: Vagueness about counterfactuals, conflating expected welfare with actual harm, missing the metaphysical premise. A vs B distinction: B answers apply standard moves loosely; A answers pinpoint and remove the load-bearing premise.

  Constraints: Closed-book, so no citations. Keep Drift case purely philosophical - probabilities are just a tool to disrupt determinism, not a math puzzle. All sub-parts answerable from case stipulations alone.
answer: |-
  ### Exam Question: Ethics Comprehensive Examination (90 minutes, 20 marks)  
  **Answer all parts. Stipulations are definitive; do not introduce external assumptions.**  

  **Case 1 (Deterministic):**  
  A state energy ministry chooses:  
  - **Cheap:** Commission a reactor now, deferring waste storage costs. In 60 years, containment fails. Everyone then alive in the region contracts a chronic, non-fatal illness, reducing lifetime welfare from 90 to 70. All lives remain well worth living.  
  - **Safe:** Build proper storage initially. No illness occurs; welfare remains 90.  
  *Stipulations:*  
  (1) No one alive at decision-time is affected.  
  (2) Equal numbers of people exist under both policies.  
  (3) *Different people exist* under each policy (due to a construction boom altering social timelines).  

  **Case 2 (Drift):**  
  The ministry chooses:  
  - **Cheap:** Each candidate gamete-pair (from a large, pre-existing pool) has a 0.4 probability of producing a person. Any person born has welfare 70.  
  - **Safe:** Each candidate gamete-pair has a 0.4 probability of producing a person. Any person born has welfare 90.  
  *Stipulations:*  
  (1) The gamete-pool is fixed independently of the policy choice.  
  (2) For *no* candidate gamete-pair is it true that it would produce a person under one policy but not the other.  
  (3) Expected total persons and welfare are equal and higher under Safe.  
  (4) All lives are well worth living.  

  **(a)** (4 marks)  
  In Case 1, the argument that "Cheap harms no one" succeeds. State *precisely* why. In Case 2, what specific conceptual resource—central to this argument—becomes *unavailable* (not merely false)? Explain.  

  **(b)** (4 marks)  
  Formulate the strongest complaint against Cheap in Case 2. Argue whether this complaint is *genuinely person-affecting* (i.e., grounded in a identifiable subject’s interests) or only impersonally person-affecting in form.  

  **(c)** (4 marks)  
  Identify the implicit premise about *merely possible people* required to sustain the complaint in (b). Show that the standard nonidentity argument (from Case 1) does *not* supply this premise. What follows if we (i) grant or (ii) deny this premise?  

  **(d)** (4 marks)  
  Trace *one significant downstream cost* for moral theory if we build policy evaluation around your complaint in (b).  

  **(e)** (4 marks)  
  Given that real-world policies often affect future identities in *chancy* ways (like Case 2), and we cannot discern whether effects are deterministic (Case 1) or chancy, what practical constraint does this impose on duties to future generations?  

  ---

  ### Model Answer (850 words)  

  **(a)** In Case 1, "Cheap harms no one" succeeds because each person who exists under Cheap would *not* have existed under Safe. Thus, no one can claim they are worse off than they would otherwise have been—the necessary comparator for harm is absent. The conceptual resource unavailable in Case 2 is a *determinate, de re counterfactual* linking a specific person’s existence to the policy choice. In Drift, no candidate gamete-pair’s outcome is policy-dependent; existence is stochastically identical under Cheap or Safe. We cannot say of any person, "This individual would (or would not) have existed under the alternative policy."  

  **(b)** The strongest complaint in Drift is that Cheap lowers each candidate gamete-pair’s *expected welfare contribution* from 36 (0.4 × 90) to 28 (0.4 × 70). This aggregates into lower total expected welfare. However, this complaint is *not* genuinely person-affecting. Each "candidate" is not a concrete individual but a *possible person-specifier* (e.g., gamete-pair P123). Welfare is attached only to actualized persons, so the expectation (28 vs. 36) compares *descriptions of outcomes* across scenarios, not interests of a persistent subject. No actual or counterfactually fixed individual suffers reduced prospects; the complaint is formally person-indexed but impersonally grounded in states of affairs.  

  **(c)** The complaint in (b) requires that *candidate gamete-pairs are robustly individuated entities* across possible futures. This presumes they retain transworld identity: P123 in Cheap-worlds is "the same" candidate as P123 in Safe-worlds, even if no person is actualized. The standard nonidentity argument *denies* such cross-world identification for persons (e.g., in Case 1, the child born under Safe is not "the same" as any child in Cheap). If we grant this premise, we can treat candidates as subjects of expected welfare, collapsing Drift into a same-entity comparison. If denied, candidates lack continuity; P123-in-Cheap and P123-in-Safe are distinct abstractions, voiding the comparison. The standard argument neither supplies nor justifies this premise—it avoids individuating non-actual entities.  

  **(d)** Granting candidate individuation invites partition sensitivity. Expected welfare per candidate depends on how we "carve" the pool. If we regroup gamete-pairs into coarse-grained sets (e.g., "all candidates in Region A"), probabilities and expectations shift arbitrarily. For instance, if Safe concentrates higher welfare in subsets (though not in Drift), candidate-defined expectations could mislead. This forces moral theory to either:  
  (i) Privilege fine-grained individuation (metaphysically fraught), or  
  (ii) Accept that complaints are artifact-like, varying with descriptive granularity.  
  This undermines the aspiration for objective, person-centered harm.  

  **(e)** Drift does not dissolve the nonidentity problem but relocates it. In deterministic cases, we lack a harmed subject; in chancy cases, we lack a fixed subject *for whom* expected welfare matters. The practical upshot is that duties to future generations cannot rely on *de re* harm claims. We must evaluate policies by:  
  - Impersonal principles (e.g., maximizing expected welfare), or  
  - "Person-affecting" principles that abandon transworld identity (e.g., aggregating welfare for whoever exists).  
  Since we cannot discern whether identity-affection is deterministic or chancy, we must default to impersonal or non-identity-reliant frameworks. This rejects the person-affecting restriction as practically inapplicable.  

  **Verdict:** The Drift case exposes that the nonidentity problem’s core is not determinism per se, but the *individuation of non-actual beings*. Standard arguments implicitly exploit the absence of transworld identity for persons; Drift shows that probabilistic "candidates" cannot solve this without smuggling in individuation. The problem persists—merely possible entities resist being bearers of harm or claims.  

  ---

  ### Marking Scheme (5 × 4 marks)  
  **Must-hit points** (Candidates typically lose marks by):  
  1. **No-harm in Case 1:** Correctly identifies that no one is worse off than in their only alternative (non-existence).  
     *Common error:* Claims harm via lowered welfare without addressing counterfactual nonexistence.  
  2. **Unavailable resource in Drift:** States that *de re counterfactuals* (e.g., "Person X would exist under Safe") are indeterminate.  
     *Common error:* Says comparisons are "impossible" without specifying counterfactual indeterminacy.  
  3. **Complaint & status in (b):** Formulates *expected welfare per candidate* and argues it is not genuinely person-affecting.  
     *Common error:* Treats expected welfare as actual harm or asserts person-affecting status without justification.  
  4. **Hidden premise in (c):** Identifies *transworld identity of candidates* as required but unsupported by standard argument.  
     *Common error:* Names "probabilities" or "expectations" generally without metaphysical individuation.  
  5. **Practical upshot in (e):** Concludes duties must use impersonal/non-identity-reliant principles due to epistemic limits.  
     *Common error:* Suggests we can "calculate probabilities" without addressing indeterminacy’s moral implications.  

  **Grading distinction:**  
  - **B answer (12–15 marks):** Correctly applies standard nonidentity concepts (e.g., PAR, same-number quality) to both cases. Identifies expected welfare in Drift but does not isolate the individuation premise or its absence in the standard argument. Discusses costs impersonally.  
  - **A answer (16–20 marks):** Pinpoints the *load-bearing premise* (deterministic *de re* counterfactuals in Case 1; transworld identity of candidates in Drift) and constructs the argument *without it*. Explicitly shows how the standard argument fails when this premise is withdrawn or challenged. Defends a verdict on whether Drift resolves or relocates the problem via metaphysical constraints.
