prompt: |-
  Hi — I'm a journalist, I mostly cover science and the ideas beat, and I'm finally writing the piece I've been threatening to write for a year about why so much of public life has migrated from lying to not-quite-lying: the non-denial denial, the spokesperson who answers the question she wishes she'd been asked, the university press release that says the finding in mice and lets the headline do the rest. My brother-in-law is a litigator and keeps insisting the whole distinction is lawyer folklore, and the philosophy I've waded through seems to spend nearly all its time on one case (man with an axe at the door, wants to know where your friend is) and on whether you've made an assertion when you implicate something rather than say it flat out. Before I go and interview three people who will each defend a position they've already published, I want the spec. What does an account of the moral difference between lying and misleading — or an account of why there isn't one — actually have to deliver to be worth printing? I dont mean the intellectual history and I dont mean who said what; I mean the list of cases and distinctions the theory has to get right, the reason each one earns its place on the list, and an honest flag on which entries are genuine requirements and which are just somebody's favourite view smuggled in as a constraint.

  Here are the cases I want the list built out of rather than retrofitted to, roughly in the order they annoyed me. (a) The press officer who gives a literally true sentence to a reporter, knowing the reporter's desk will strip the hedge: she didn't design the false belief, she foresaw it and scheduled the briefing around it. (b) One sentence, two audiences at once — specialists who hear a hedge as a technical qualifier, lay readers who hear nothing. (c) My favourite, and the one nobody will bite on: a system that only ever emits true sentences but selects which true sentences to emit by scoring them on how many readers walk away with a false belief. (d) The old diplomatic formula where everyone in the room knows the discount rule — if there's a wrong there, is it the deception or the convention-breaking? (e) Staying silent while someone forms a false belief you neither planted nor were asked about. (f) The reverse of the usual puzzle: saying something you know is false but expecting to be disbelieved, or saying it in a form you know the hearer will mis-parse into the truth. Also, separately, whatever has to be said about blame versus wrongness — a theory that can only tell me a lie is worse, and not who is at fault and how much, is no use to me.

  What I want back is exactly five numbered requirements, each one or two sentences, no preamble and no summing-up paragraph at the end; I'll write the intro and the kicker myself. For every item: the case or consideration that earns it a place, whether it's a must or a nice-to-have given what I need the theory for (good enough to structure a 4,000-word explainer around, and good enough that I could hand it to a press officer as a real guide to what she may and may not do), and — this is the part I care most about — an outright statement when a requirement is really just one camp's prejudice wearing a badge. If some pair of your five can't be jointly satisfied, say so inside whichever item it belongs in rather than in a note: my guess is that the requirements that cash things out in terms of the speaker's intention will collide with the ones that hold a speaker responsible for foreseen but unintended uptake, but you tell me. And in that same item, say which single requirement does the most work in ruling out the popular positions — I suspect one of them is the view that there's no difference in principle and another is the view that lying is worse because it invites a distinctive kind of reliance — but don't score the views for me, I'll do that in the piece. Last thing: does the list owe me a seperate answer to why anyone ever bothers lying when misleading is right there and cheaper, or is that a sixth requirement that has no business on the list?
reasoning: |-
  Hmm, the user is a journalist writing about the moral difference between lying and misleading in public life. They've encountered various cases that annoy them - press officers using literally true statements that lead to false beliefs, dual-audience communications, systems that select true statements to maximize false beliefs, diplomatic conventions, silence when others form false beliefs, and reverse deception tactics. They want a framework of exactly five requirements that any theory on lying vs misleading must satisfy to be useful for their 4,000-word explainer and as a practical guide for press officers.

  The user is frustrated with existing philosophical debates that focus too narrowly on hypotheticals like the "man with an axe" scenario or semantic distinctions about assertions versus implications. They want a practical, real-world applicable framework rooted in their observed cases rather than retrofitted theories. Their brother-in-law's litigator perspective dismissing the distinction as "lawyer folklore" adds pressure for concrete criteria.

  Key challenges emerge: 
  First, intention versus outcome - can a speaker be blamed for foreseen but unintended deception? Cases (a) and (c) highlight this tension. 
  Second, audience variability - how can one statement be simultaneously truthful to experts and misleading to laypeople? Case (b) demands this be addressed. 
  Third, systemic deception - case (c) presents a machine that weaponizes truth to spread falsehoods, testing whether honesty is merely about sentences or also about communicative intent. 
  Fourth, conventions matter - case (d) suggests context can redefine deception, where breaking expectations might be worse than the falsehood itself. 
  Fifth, omissions and reverse psychology - cases (e) and (f) explore whether deception requires active statements and how disbelief changes moral responsibility.

  The journalist also wants clarity on blame allocation versus wrongness - a theory must distinguish severity from culpability. They hint that existing theories either overemphasize speaker intention (absolving press officers who "foresee but don't design" deception) or overemphasize outcomes (punishing all misleading effects equally).

  For the five requirements, they must: 
  1. Cover all six cases without being tailored to any one. 
  2. Explicitly flag which requirements are essential versus ideological preferences. 
  3. Note internal contradictions (e.g., intention-based vs outcome-based standards clashing). 
  4. Identify which requirement best exposes weaknesses in popular positions (like "lying is worse because it invites reliance"). 
  5. Exclude tangential questions (e.g., why people lie when misleading is easier) unless core to the framework.

  The response will need to distill complex philosophy into actionable criteria while maintaining academic rigor. Each requirement must stand alone in 1-2 sentences with: 
  - The case justifying its inclusion 
  - Essential/non-essential status for the journalist's purposes 
  - Honest labeling of any biases 
  - Internal contradictions noted where relevant 
  - Primary challenge to common positions
answer: |-
  Here are five numbered requirements for a theory of lying vs. misleading to be actionable for your purposes, structured as requested:

  1. **Requirement:** Must distinguish between *intentionally causing* false belief (lying) and *foreseeably allowing* it (misleading), regardless of literal truth.  
  **Case/Justification:** Press officer scheduling briefings knowing desks strip hedges (a) and truth-emission systems gaming false uptake (c). **Must-have:** Core to assigning responsibility in public communication. **Bias Warning:** Favors outcome-focused ethics over pure intention analysis; deontologists may reject "foreseeability" as sufficient. **Conflict Note:** Collides with theories requiring explicit false assertion for wrongdoing. **Exposes Weakness In:** "Lying is worse due to active deceit" – shows passive strategies can be equally manipulative.

  2. **Requirement:** Must address *contextual interpretation* by diverse audiences, not just semantic content.  
  **Case/Justification:** Dual-audience communications where specialists/lay readers parse hedges differently (b). **Must-have:** Essential for evaluating real-world impact in media/science communication. **Bias Warning:** Assumes ethical responsibility extends to predictable misinterpretations; formalists may insist only literal meaning matters. **Exposes Weakness In:** Theories treating communication as speaker-hearer dyads; highlights systemic irresponsibility.

  3. **Requirement:** Must evaluate *systemic intent*: patterns of selective truth-telling designed to mislead, even when individual statements are true.  
  **Case/Justification:** Systems optimizing true sentences for false beliefs (c). **Must-have:** Critical for analyzing institutional deception (corporate/uni PR). **Bias Warning:** Consequentialist; treats aggregated outcomes as ethically equivalent to lies. Pure speech-act theorists reject this. **Exposes Weakness In:** "Lying vs. misleading" frameworks ignoring habitual or algorithmic deception.

  4. **Requirement:** Must assess *conventional expectations*: deception via violating shared norms (e.g., diplomatic discount rules) is distinct from exploiting ignorance.  
  **Case/Justification:** Diplomatic formula relying on known discount rules (d). **Must-have:** Explains why identical words can be benign or deceptive based on context. **Bias Warning:** Relativistic; assumes norms define honesty. Absolutists see deception as context-invariant. **Exposes Weakness In:** Intent-focused theories ignoring how conventions shape responsibility.

  5. **Requirement:** Must separate *blame severity* (who is at fault and why) from *wrongfulness* (whether an act is deceptive).  
  **Case/Justification:** Silence while others err (e) and reverse deception (saying false expecting disbelief) (f). **Must-have:** Practical for assigning accountability (e.g., press officers vs. reporters). **Bias Warning:** Rejects "all deception is equally wrong"; permits gradations. Kantians may disagree. **Exposes Weakness In:** Binary "lying worse than misleading" claims; accommodates culpable silence and non-deceptive falsehoods.

  **On lying vs. misleading incentives:** Not a sixth requirement. Your question is answered by Requirement 1 (foreseeability lowers effort/risk) and Requirement 5 (blame assignment affects cost – lying often carries harsher penalties if caught).
