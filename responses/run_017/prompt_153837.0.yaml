  - Prior probability of Heads (before the experiment): \( P(\text{Heads}) = \frac{1}{2} \).  
  - Possible centered worlds:  
    - \( (\text{Heads}, \text{Monday}) \), \( (\text{Heads}, \text{Tuesday}) \), \( (\text{Tails}, \text{Monday}) \).  
  - Heads branch: 2 awakenings (Monday, Tuesday).  
  - Tails branch: 1 awakening (Monday).  

  **Thirder treatment (initial credence):**  
  - Credence divided equally among all awakenings.  
  - 3 possible awakenings, each has credence \( \frac{1}{3} \).  
  - \( P_\text{thirder}(\text{Heads}) = P(\text{Heads}, \text{Monday}) + P(\text{Heads}, \text{Tuesday}) = \frac{1}{3} + \frac{1}{3} = \frac{2}{3} \).  

  **Thirder treatment (after learning "Monday"):**  
  - Ruled out: \( (\text{Heads}, \text{Tuesday}) \) (credence \( \frac{1}{3} \)).  
  - Remaining: \( (\text{Heads}, \text{Monday}) \) (credence \( \frac{1}{3} \)), \( (\text{Tails}, \text{Monday}) \) (credence \( \frac{1}{3} \)).  
  - Total credence for Monday: \( \frac{1}{3} + \frac{1}{3} = \frac{2}{3} \).  
  - \( P_\text{thirder}(\text{Heads} \mid \text{Monday}) = \frac{P(\text{Heads}, \text{Monday})}{P(\text{Monday})} = \frac{1/3}{2/3} = \frac{1}{2} \).  
  - **Change:** \( \frac{2}{3} \to \frac{1}{2} \) (decrease).  

  **Halfer treatment (initial credence, using specified method):**  
  - Assign \( \frac{1}{2} \) to Heads, \( \frac{1}{2} \) to Tails.  
  - Within each branch, distribute credence equally among awakenings:  
    - Heads: 2 awakenings → each gets \( \frac{1}{2} \times \frac{1}{2} = \frac{1}{4} \).  
    - Tails: 1 awakening → gets \( \frac{1}{2} \times 1 = \frac{1}{2} \).  
  - So: \( P_\text{halfer}(\text{Heads}) = P(\text{Heads}, \text{Monday}) + P(\text{Heads}, \text{Tuesday}) = \frac{1}{4} + \frac{1}{4} = \frac{1}{2} \).  

  **Halfer treatment (after learning "Monday"):**  
  - Ruled out: \( (\text{Heads}, \text{Tuesday}) \) (credence \( \frac{1}{4} \)).  
  - Remaining: \( (\text{Heads}, \text{Monday}) \) (credence \( \frac{1}{4} \)), \( (\text{Tails}, \text{Monday}) \) (credence \( \frac{1}{2} \)).  
  - Total credence for Monday: \( \frac{1}{4} + \frac{1}{2} = \frac{3}{4} \).  
  - \( P_\text{halfer}(\text{Heads} \mid \text{Monday}) = \frac{P(\text{Heads}, \text{Monday})}{P(\text{Monday})} = \frac{1/4}{3/4} = \frac{1}{3} \).  
  - **Change:** \( \frac{1}{2} \to \frac{1}{3} \) (decrease).  

  ### Key Feature and Comparison to Classic Case
  **Single feature doing the work:** The asymmetry in the proportion of Monday awakenings between branches.  
  - Heads branch: Monday is 1 out of 2 awakenings (50% of Heads awakenings).  
  - Tails branch: Monday is 1 out of 1 awakening (100% of Tails awakenings).  
  Thus, "Monday" is less diagnostic of Heads than Tails, making Tails more likely when Monday is observed.  

  **Why the classic case has the opposite movement:**  
  In the classic case (Heads: Monday only; Tails: Monday and Tuesday):  
  - Heads branch: Monday is 100% of awakenings.  
  - Tails branch: Monday is 50% of awakenings.  
  Thus, "Monday" is more diagnostic of Heads, so learning it *increases* credence in Heads under both treatments.  

  ### Removal Test
  **Alteration to restore symmetry:** Make both branches have two awakenings. Use the classic setup: Heads → Monday only (1 awakening), Tails → Monday and Tuesday (2 awakenings).  

  **Result:**  
  - **Thirder:** Initial \( P(\text{Heads}) = \frac{1}{3} \). After learning Monday, \( P(\text{Heads} \mid \text{Monday}) = \frac{1/3}{1/3 + 1/3} = \frac{1}{2} \) (increase from \( \frac{1}{3} \) to \( \frac{1}{2} \)).  
  - **Halfer:** Initial \( P(\text{Heads}) = \frac{1}{2} \). Distribution: \( P(\text{Heads}, \text{Monday}) = \frac{1}{2} \), \( P(\text{Tails}, \text{Monday}) = \frac{1}{4} \), \( P(\text{Tails}, \text{Tuesday}) = \frac{1}{4} \). After learning Monday, \( P(\text{Heads} \mid \text{Monday}) = \frac{1/2}{1/2 + 1/4} = \frac{2}{3} \) (increase from \( \frac{1}{2} \) to \( \frac{2}{3} \)).  
  **Direction flips:** Both treatments now show an *increase* in credence for Heads, collapsing to the classic profile.  

  ### Attacks from Defenders of Opposing Positions  
  **Position 1: Centered evidence is evidentially inert for uncentered hypotheses.**  
  - **Attack:** Argue that the coin outcome is uncentered and independent of the day. Learning "Monday" is purely centered and should not affect credence in Heads. The update violates evidential neutrality.  
  - **Inconsistency derivation:**  
    - Inertness implies \( P(\text{Heads} \mid \text{Monday}) = P(\text{Heads}) \).  
    - But in the halfer treatment, \( P(\text{Heads}) = \frac{1}{2} \) initially, and \( P(\text{Heads} \mid \text{Monday}) = \frac{1}{3} \) after update.  
    - Contradiction: \( \frac{1}{2} \neq \frac{1}{3} \).  
    - Rebuttal: The inertness advocate must reject conditionalization or the centered-world framework, but doing so ignores how self-locating uncertainty interacts with uncentered facts.  

  **Position 2: Credence in Heads should remain \( \frac{1}{2} \) before and after learning the day.**  
  - **Attack:** Reject the halfer’s within-branch distribution. Claim that Beauty should assign equal credence to Heads and Tails regardless of awakenings, so learning "Monday" changes nothing.  
  - **Inconsistency derivation:**  
    - If \( P(\text{Heads}) = \frac{1}{2} \) after learning Monday, then:  
      - \( P(\text{Heads} \mid \text{Monday}) = \frac{1}{2} \).  
    - But by conditionalization: \( P(\text{Heads} \mid \text{Monday}) = \frac{P(\text{Heads}, \text{Monday})}{P(\text{Monday})} \).  
    - From the setup: \( P(\text{Heads}, \text{Monday}) = P(\text{Heads}) \times P(\text{Monday} \mid \text{Heads}) = \frac{1}{2} \times \frac{1}{2} = \frac{1}{4} \) (since Monday is 1 of 2 Heads awakenings).  
    - \( P(\text{Monday}) = P(\text{Heads}, \text{Monday}) + P(\text{Tails}, \text{Monday}) = \frac{1}{4} + \frac{1}{2} = \frac{3}{4} \).  
    - Thus \( P(\text{Heads} \mid \text{Monday}) = \frac{1/4}{3/4} = \frac{1}{3} \), contradicting \( \frac{1}{2} \).  
    - Rebuttal: The defender must deny either the conditionalization or the likelihood \( P(\text{Monday} \mid \text{Heads}) \), but both are fixed by the experimental design.  

  ### What the Case Cannot Show  
  This case cannot show that centered evidence *always* affects uncentered beliefs, nor does it resolve the halfer/thirder debate about the *initial* credence in Heads; it only isolates and demonstrates that purely self-locating information can rationally shift credence in an uncentered proposition, regardless of which framework one uses to model self-locating uncertainty.
