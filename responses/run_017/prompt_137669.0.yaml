  Okay, let me tackle this user's problem. They're a first-year PhD student in HPS suddenly tasked with teaching a 50-minute session on biological function theories to second-year biology students. The main challenge is structuring the session effectively to clarify the etiological vs. causal-role distinction without causing confusion. 

  First, I need to understand their core concern: they want the session's architecture to build understanding incrementally, not just content delivery. Their instinct about framing the two accounts as answering different questions is crucial. But where to place that framing? Starting with it might feel abstract, but delaying it risks confusion. Maybe a concrete example-first approach would work better for undergrads.

  The duplicated gene case they proposed is strong but potentially complex for an opener. Simpler examples like the heart pumping blood could establish baseline intuitions first. The gene duplication could come later as a richer case study. I should sequence examples from simple to complex: start with clear textbook cases, then introduce edge cases that break those models.

  For misconceptions, preemption is key. The teleology worry should be addressed immediately when introducing selected-effect theory. Explicitly separating evolutionary history from conscious purpose is vital. The convenor's adaptation-equals-function view needs handling diplomatically - perhaps by showing how both theories actually cover different aspects of what biologists do.

  Timing matters. Fifty minutes is tight, so boundaries are essential. Malfunction and mental content should definitely be excluded. The closing question needs to reveal conceptual understanding - maybe asking students to classify examples using both frameworks would work.

  The user's anxiety about creating misconceptions is telling. Each theory's limitations should be presented when introducing them, not as afterthoughts. For example, when explaining causal-role, immediately add that not every effect counts as a function - just the systemic contributions.

  For the skeptical convenor, emphasizing operational utility could help. Show how causal-role is indispensable in physiology while etiological explains evolutionary persistence. The "different questions" framing becomes the peace treaty between approaches.

  The duplicated gene case remains the centerpiece, but placed after establishing both theories separately. Its power lies in forcing students to see why both perspectives matter - the etiological "not yet" versus causal-role "already functioning". This naturally leads to discussing hybrid cases like exaptations.

  Finally, the payoff should explicitly map back to biological practice: physiologists lean causal, evolutionary biologists etiological, and that's okay. The takeaway isn't "who's right" but "which question are you asking". This practical framing might satisfy both students and the skeptical convenor.
answer: |-
  Here’s a battle-tested plan for your 50-minute session, structured to build conceptual clarity incrementally while preempting key misconceptions. The sequence ensures each step logically sets up the next, using your duplicated gene case as the anchor.

  ---

  ### **Session Structure: The "Why vs. How" Framework**
  **Total Time:** 50 mins (Strict timing is critical)

  #### **1. Hook: The Problem of "Function" (5 mins)**  
  - **Do:** Ask students: *"When a biologist says ‘the function of the heart is to pump blood,’ what do they mean? Is this a fact about history, current utility, or both?"*  
  - **Why:** Surface everyday assumptions. Students will likely conflate "what it does" with "why it’s there." Note conflicting answers on the board.  
  - **Preempt Misconceptions:** Immediately distinguish "purpose" (teleology) from evolutionary explanation: *"We’re not talking about cosmic purpose—we’re asking how biology explains why traits exist and what they contribute."*

  #### **2. Introduce the Two Questions (10 mins)**  
  - **Do:** Draw two columns on the board:  
    - **Column 1 (Why?):** "Why does this trait exist in this organism/population?"  
    - **Column 2 (How?):** "What does this trait *do* that helps the containing system work *right now*?"  
  - **Key Move:** **FRAME THIS FIRST.** Say explicitly: *"These are different questions. Much confusion comes from answering one while thinking you’re answering the other."*  
  - **Examples:**  
    - *Why?*: Human appendix (historical remnant).  
    - *How?*: ATP in muscle contraction (current biochemical role).  
  - **Preempt Misconceptions:** Crush "teleology panic" here: *"Selected-effect isn’t about ‘intent’—it’s about cumulative past causes. Causal-role isn’t about ‘goals’—it’s about mechanism."*

  #### **3. Etiological Account: The "Why" Column (10 mins)**  
  - **Core Idea:** A trait’s function is *what it was selected for* in evolutionary history.  
  - **Do:** Use a classic example (e.g., polar bear fur insulation). Ask: *"Could fur have other effects? (e.g., camouflage). Is camouflage its function?"* → Only if selection favored it.  
  - **Preempt Misconceptions:**  
    - *"You need history to assign function!"*: Agree—but add: *"This is powerful for evolutionary hypotheses, but useless for traits without known history (e.g., novel mutations) or in physiology lab work."*  
    - **For the convenor:** *"Yes, adaptations are key here—but not all functional traits are adaptations (yet), and not everything an adaptation does is its function."*

  #### **4. Causal-Role Account: The "How" Column (10 mins)**  
  - **Core Idea:** A trait’s function is its *current causal contribution* to a system’s capacity.  
  - **Do:** Use a physiological example (e.g., kidney filtering blood). Ask: *"What if a mutation causes a kidney to secrete a novel enzyme that aids digestion? Is that a new function?"* → Yes, if it contributes *now*.  
  - **Preempt Misconceptions:**  
    - *"Does this make EVERY effect a function?"*: NO. Emphasize: *"Only effects that are* **systematically relevant** *to the organism’s survival/reproduction—not accidental side-effects."* (e.g., heart sounds aren’t its function).  
    - *"Verbal dispute!"*: *"Nope—causal-role lets physiologists assign functions without fossil data; etiological explains trait origins. Different tools for different jobs."*

  #### **5. The Duplicated Gene Case Study: Collision Point (10 mins)**  
  - **Do:** Diagram your gene duplication scenario step-by-step on the board.  
    - Ancestral gene: Function A (etiological + causal-role agree).  
    - Duplication: Copy 1 keeps A. Copy 2 drifts, mutates, now does B (beneficial).  
    - **CRITICAL Q:** *"Does Copy 2 *already* have function B?"*  
      - *Causal-role:* YES (it’s doing B now and it helps).  
      - *Etiological:* NO (not selected *for* B yet; drift isn’t selection).  
  - **Why This Works:**  
    - Forces students to apply both accounts.  
    - Shows why the "different questions" framing matters: *Is this about current utility (how) or evolutionary explanation (why)?*  
    - **Preempts:** The convenor’s "function=adaptation" view by showing a trait can be functional (causal-role) without being an adaptation (yet).

  #### **6. Handover Cases & Payoff (4 mins)**  
  - **Do:** Briefly note traits "repurposed" by evolution (e.g., bird feathers: insulation → flight).  
    - *Etiological:* Original function ≠ current function.  
    - *Causal-role:* Current function is what it contributes *now*.  
  - **The Big Payoff:** Return to the board’s two columns. *"Neither account is ‘right’—they solve different problems. Biologists use both, often without realizing it. Confusion arises when we forget which question we’re asking."*

  #### **7. What We’re NOT Solving (1 min)**  
  - **Explicitly Table:** Malfunction (e.g., "Is a broken heart still a heart?"), disease, and cognitive functions (e.g., "What is consciousness *for*?"). *"These need deeper philosophy—today was about core distinctions."*

  #### **8. Closing Question (Check Understanding) (1 min)**  
  - **Ask:** *"Imagine a biologist discovers a new organ in a deep-sea fish. It produces light. Under the etiological account, what would they need to know to call bioluminescence its function? Under causal-role, what would they need to know?"*  
    - **Why it works:** Tests if they grasp etiological’s reliance on history vs. causal-role’s focus on current contribution.

  ---

  ### **Why This Sequence Works**
  1. **Starts with intuition** (Hook) → reveals confusion to motivate the framework.  
  2. **Framework first** (Two Questions) → prevents students from trying to "pick a side" prematurely.  
  3. **Builds each account separately** → avoids muddying definitions.  
  4. **Duplicated gene case** → maximizes cognitive friction *after* foundations are laid, making the "why vs. how" payoff land.  
  5. **Preemption embedded** → misconceptions are dismantled as they naturally arise in examples.  
  6. **Closes with practical takeaway** → reconciles the dispute by showing utility in biological practice.

  ### **Handling the Convenor**  
  If they interject: *"This overlooks that function just IS adaptive utility!"*  
  - **Reply:** *"Adaptive utility is crucial for explaining trait origins (etiological). But physiologists studying, say, enzyme kinetics today need causal-role to describe what parts are doing *right now*—without waiting for a fossil. Both are operational in biology."*  
    → This frames it as complementary, not contradictory.

  ### **Your Instincts Were Right**  
  - **Framework first** is essential. Students need the "different questions" lens early to avoid frustrated binary thinking.  
  - **Duplicated gene** is the perfect centerpiece—it’s biologically realistic and forces the key distinction.  
  - **Refusing malfunction/disease** is wise; those are minefields needing 3x the time.

  Go in confident: You’re not teaching who’s "right," but how to think more clearly about a word biologists use daily. That’s a win.
