prompt: |-
  Our hospital ethics committee has to write the treatment-limitation and critical-care allocation protocol for the ICU, and the thing such a protocol has to be able to say, in terms a junior doctor can apply at three in the morning, is whether what is being authorized is ending a life or letting a life end. Before we look at candidate accounts, I want the specification: what does an account of the doing/allowing and killing/letting-die distinction have to deliver in order to be good enough to be written into a protocol like ours?

  Give me the requirements list, each with the case or consideration that motivates it, and mark each as non-negotiable for this purpose or as a preference of one theoretical camp. In particular, tell me which of the following are genuine desiderata and which are partisan demands: that the distinction be drawable from outside the agent's head, since we can audit decisions but not intentions; that it apply to institutions, standing orders and software defaults, and not only to individual agents acting at a time; that it not rest on contested claims about whether omissions can be causes or whether absences can figure in causal explanations; that it not quietly collapse into the distinction between intending death and merely foreseeing it; that it treat doing/allowing and killing/letting-die as one distinction rather than two that can come apart; that it give the same verdict on the well-known bathtub pair, where one killer holds the child under and the other only fails to rescue him; and that it nonetheless mark a difference between diverting the trolley and cutting up the healthy patient for his organs.

  The cases the protocol will actually have to decide include: an allocation algorithm that defaults to reassigning a ventilator from a patient who will die within the hour to a patient with a far better prognosis unless a clinician opts out, where no clinician opts out; a surgeon who programmes an infusion pump to deliver a lethal dose hours ahead and is asleep when it runs; a clinician who withdraws the life support she herself initiated; two clinicians who each fail to rescue, each believing the other will; and a patient whose death follows a decision taken under genuine uncertainty about prognosis. Then tell me which subset of the desiderata you suspect cannot be jointly satisfied, since that would make the list itself the useful result, and which single requirement does the most work in excluding otherwise attractive accounts. Score only briefly, a sentence or two each, the three families we keep being offered: counterfactual or baseline accounts, intention-based accounts, and the view that the distinction bears no moral weight of its own and merely tracks other factors.
reasoning: |-
  Hmm, this is a deeply nuanced ethics question about developing practical ICU protocols. The user is an ethics committee member grappling with how to operationalize the doing/allowing distinction for life-or-death decisions. They need concrete requirements for a protocol that junior doctors can apply at 3am.

  First, I need to unpack their core challenge: they're not asking for philosophical theories, but for the specification of what a usable protocol must achieve. The hospital context adds crucial constraints - auditability, institutional applicability, and resistance to cognitive exhaustion during night shifts.

  The user lists several potential desiderata, some of which might be incompatible. I should categorize each as non-negotiable (practical needs) or theoretical preference. For example:
  - Auditability (external verification) is non-negotiable - we can't psychoanalyze clinicians' intentions at 3am
  - Institutional applicability must handle standing orders and algorithms
  - Avoiding metaphysical debates about omissions is practical - protocols can't require solving centuries-old philosophy puzzles

  The test cases are revealing. The ventilator allocation algorithm shows why we need to evaluate systems, not just individuals. The infusion pump case breaks simple intention-based models. The dual non-rescuer scenario exposes coordination failures.

  I suspect three requirements might conflict: wanting consistent answers to the bathtub cases (which often split theories) while also capturing the moral difference between trolley diversion and organ harvesting, all without collapsing into double effect doctrine. The trolley/organ tension particularly strains counterfactual approaches.

  For theory scoring:
  - Counterfactual accounts fail the standing orders test (what's the baseline for an algorithm?)
  - Intention-based models fail auditability (can't see inside heads)
  - The "no moral weight" view risks making protocols impossible to write

  The institutional requirement does heavy lifting by eliminating most philosophical accounts - they're rarely designed for systems. That's why I'll emphasize it as the key filter.
answer: |-
  Here's a requirements list for an ICU treatment-limitation protocol, distinguishing *doing* (killing) from *allowing* (letting die). Each requirement is motivated by a practical case or institutional constraint, with classification as **Non-Negotiable** (essential for protocol viability) or **Theoretical Preference** (reflects philosophical debates). Genuine desiderata are marked with ✅; partisan demands with ❌.

  ---

  ### **Requirements List**
  1. **Externally Verifiable Distinction**  
     - *Motivation:* Ventilator reallocation algorithm (no clinician opts out). Auditors must assess decisions retroactively without accessing intent.  
     - *Classification:* **Non-Negotiable** ✅  
     - *Reason:* Protocols require objective checks; intentions are unauditable.

  2. **Applicable to Institutions/Systems**  
     - *Motivation:* Ventilator algorithm defaults and standing orders (e.g., "DNR unless opted out").  
     - *Classification:* **Non-Negotiable** ✅  
     - *Reason:* ICU decisions involve protocols, algorithms, and teams—not just individual acts.

  3. **Avoid Metaphysical Causation Debates**  
     - *Motivation:* Prognostic uncertainty cases (e.g., withdrawing support when death *might* occur naturally).  
     - *Classification:* **Non-Negotiable** ✅  
     - *Reason:* Junior doctors cannot resolve philosophical disputes about omissions-as-causes during crises.

  4. **Distinct from Intention/Foresight**  
     - *Motivation:* Surgeon programming a lethal infusion pump then sleeping (foreseen but unintended death).  
     - *Classification:* **Non-Negotiable** ✅  
     - *Reason:* Collapsing into intention/foresight invites subjectivity and undermines auditability.

  5. **Unified Doing/Allowing & Killing/Letting-Die**  
     - *Motivation:* Bathtub pair (actively drowning vs. failing to rescue).  
     - *Classification:* **Theoretical Preference** ❌  
     - *Reason:* Demanding unity is partisan (some theories treat them separately). Protocol simplicity favors unity, but not essential.

  6. **Consistent Bathtub-Pair Verdicts**  
     - *Motivation:* Two clinicians each believing the other will rescue.  
     - *Classification:* **Theoretical Preference** ❌  
     - *Reason:* Insisting both are "allowings" (or both "doings") reflects a specific camp (e.g., counterfactual theorists).

  7. **Distinguish Trolley from Organ Harvesting**  
     - *Motivation:* Diverting a threat (trolley) vs. cutting up a healthy patient.  
     - *Classification:* **Non-Negotiable** ✅  
     - *Reason:* Protocol must prohibit clear killings (organ harvesting) while permitting some harmful acts (trolley).

  ---

  ### **Key Tensions & Exclusionary Requirements**
  - **Incompatible Desiderata:** #5 (unified distinction), #6 (bathtub consistency), and #7 (trolley/organ distinction) **cannot be jointly satisfied**. Theories that unify doing/allowing (#5) often struggle to condemn the bathtub non-rescuer as less culpable (#6) *or* must relax #7.  
  - **Most Exclusionary Requirement:** #2 (**institutional applicability**) excludes most philosophical accounts (designed for individuals). #4 (**non-intention-based**) eliminates double-effect frameworks.

  ---

  ### **Scoring Candidate Theories**
  1. **Counterfactual/Baseline Accounts**  
     - *Score:* Strong on #1 (auditability) and #7 (trolley case). **Fails #2** (institutions lack clear baselines) and #3 (relies on contested causal claims).  
     - *Verdict:* Unworkable for protocols; too abstract for systems/prognostic uncertainty.

  2. **Intention-Based Accounts**  
     - *Score:* Easily handles #6 (bathtub) and #7 (trolley). **Fails #1, #2, and #4** (intentions are unobservable; institutions don’t "intend").  
     - *Verdict:* Non-starter—violates core non-negotiables.

  3. **No Independent Moral Weight (Pragmatic Tracking)**  
     - *Score:* Sidesteps #3 and #5. **Fails #4 and #7** (cannot distinguish trolley from organ harvesting without importing other norms).  
     - *Verdict:* Too vague for protocols; collapses into ad hoc judgments.

  ---

  ### **Recommendation for Protocol Design**
  Prioritize **non-negotiable requirements**: Focus on externally verifiable acts (#1), system applicability (#2), and intention-independence (#4). Accept that:  
  - The bathtub pair may receive asymmetrical verdicts (active killing prohibited; negligent allowing penalized via separate policies).  
  - Prognostic uncertainty cases (#3) default to "allowing" unless a *positive intervention* (e.g., lethal injection) is deployed.  
  - Use *procedural safeguards* (e.g., mandatory second reviews for withdrawals) to offset theoretical gaps.  

  **Final Output:** A protocol anchored in *observable actions/system designs* (not intentions) that treats withdrawing/withholding equivalently, prohibits active interventions to cause death, and audits institutional defaults—not just individual choices.
