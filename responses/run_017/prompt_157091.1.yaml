answer: |-
  ## Joint Statement Draft: Micropsychism and Cosmopsychism in Dialogue

  **Section 1: Agreed Claims**

  We, the undersigned constitutive micropsychist and cosmopsychist, affirm the following shared commitments and constraints regarding the metaphysics of consciousness:

  1.  **Rejection of Brute Phenomenal Emergence:** Phenomenal consciousness (experience) does not emerge *de novo* and inexplicably from wholly non-phenomenal physical properties or relations. Any account of macro-subjects must involve grounding in phenomenality at the fundamental level.
  2.  **The Unity Datum:** A typical human conscious state presents as a single, unified experiential field at a time (synchronic unity), encompassing diverse modalities and contents within one subjective perspective.
  3.  **The Complexity Datum:** This unified field presents richly complex, high-resolution content (e.g., a detailed visual scene, intricate emotional texture) that appears irreducible to any single, simple experiential state.
  4.  **Underdetermination by Physics:** A complete physical description of a system, including its dynamics and relational structure, underdetermines the number and identity of subjects associated with that system. The physical facts alone do not fix the subject facts.
  5.  **The Upward Challenge (Constitutive Micropsychism):** Any constitutive micropsychist account must adequately address:
      *   **The Bonding Problem:** What is the specific (non-mereological) relation ("phenomenal bonding") that binds micro-experiences together such that they constitute a unified macro-experience?
      *   **The Jumble Problem:** How does the combination of many simple (or proto-) micro-experiences yield a single, coherent, complex macro-experience, rather than a mere aggregate or "jumble" of disjoint experiences?
      *   **The Subject Unity Problem:** How does the combination of many micro-subjects yield a single macro-subject, rather than merely a collection of micro-subjects in intimate interaction?
  6.  **The Downward Challenge (Cosmopsychism):** Any cosmopsychist account must adequately address:
      *   **The Decombination Problem:** What is the specific process or relation by which a unified cosmic experience gives rise to seemingly distinct, bounded, finite macro-subjects (like human beings)?
      *   **The Boundary Problem:** Why does decombination result in subjects associated specifically with entities like brains/organisms, and not with arbitrary aggregates (like rocks, galaxies) or sub-components (like neurons, atoms) within the cosmic whole? What *principledly* determines the "grain" of derivative subjects?
      *   **The Overlap Problem:** If multiple macro-subjects are aspects of the same cosmic subject, how are their experiences individuated such that they do not overlap or share content in ways inconsistent with privacy of experience (e.g., why am I not experiencing your pain right now?).
  7.  **Solution Standards:** A successful solution to either the bonding problem or the decombination problem must:
      *   **Be Non-Stipulative:** Provide a *principled reason* (grounded in fundamental features of reality) for why subjects appear at the level they do (e.g., human brains), rather than requiring ad hoc stipulation case-by-case.
      *   **Be Determinative:** Yield a *determinate* answer regarding the number and identity of subjects associated with any given, sufficiently specified physical system (e.g., a brain, a split-brain patient, a network of coupled systems).
      *   **Respect Phenomenology:** Cohere with the introspective data regarding the unity, complexity, privacy, and boundedness of human consciousness.
  8.  **Fundamental Phenomenality:** Phenomenality is fundamental to reality. Both views reject physicalism that posits fundamental non-phenomenal properties *and* dualism that posits fundamental non-physical substances.
  9.  **The Explanatory Gap:** There exists an explanatory gap between physical/structural descriptions and phenomenal descriptions. Neither constitutive micropsychism nor cosmopsychism currently provides a fully satisfying, intuitively transparent explanation of how macro-consciousness arises from (or within) fundamental phenomenality, though both claim to offer the most promising framework.
  10. **The Unsettled Dispute:** The debate between constitutive micropsychism and cosmopsychism is not merely terminological *in its entirety* and remains empirically and metaphysically unresolved. Neither position currently possesses a decisive advantage.

  **Section 2: Disagreements Table**

  | Disputed Question (Neutral)                 | Micropsychist Formulation                                                                 | Cosmopsychist Formulation                                                               | Substantive (S) / Verbal (V) | Crux                                                                                                | Shared Case/Argument                                                                                                | Micropsychist Prediction                                                                 | Cosmopsychist Prediction                                                                |
  | :------------------------------------------ | :---------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------- | :--------------------------- | :-------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------- |
  | **Direction of Grounding**                  | Macro-subjects (like humans) are metaphysically grounded in and constituted by micro-subjects. | Macro-subjects are metaphysically grounded in and are derivative aspects of the single cosmic subject. | S                            | Is the fundamental metaphysical dependency relation one of composition (parts-to-whole) or derivation/aspect (whole-to-parts)? | The grounding relation must explain macro-subject unity/complexity without brute emergence.                        | Grounding runs upward from micro to macro.                                               | Grounding runs downward from cosmos to macro.                                           |
  | **Primitive Ideological Commitment**        | The fundamental "combination" operation relating fundamental subjects is phenomenal bonding/composition. | The fundamental "individuation" operation is decombination/derivation of aspects from the cosmic subject. | S                            | Which operation (binding parts or isolating aspects) is metaphysically primitive and irreducible?     | Any theory needs a primitive relation to connect fundamental phenomenality to macro-phenomenology.                  | Composition is primitive; decombination is derivative or incoherent.                     | Decombination is primitive; composition is derivative or incoherent.                    |
  | **Grain of Subjects**                       | Subjects appear at the human level because that is the level where micro-experiences are bonded into a complex unity. | Subjects appear at the human level because that is the level where cosmic structure enables stable, bounded experiential aspects to decombine. | S                            | What specific physical/structural feature(s) *principledly* determine the level at which distinct subjects emerge? | Subjects appear at organismal level (e.g., not rocks, not neurons, not hive minds under normal conditions).         | Grain determined by the presence/absence of specific bonding relations among micro-subjects. | Grain determined by the presence/absence of specific structural complexity enabling stable decombination. |
  | **Ontological Proliferation**               | Micropsychism entails only fundamental micro-subjects and bonded macro-subjects. Cosmic consciousness is emergent/illusory. | Cosmopsychism entails only the fundamental cosmic subject and derivative macro-subjects. Micro-subjects are illusory/derivative. | S                            | Does the theory entail a proliferation of subjects (e.g., cosmic + human + micro) beyond what seems necessary? | Minimizing ontological commitments is desirable without sacrificing explanatory power.                              | Cosmopsychism implausibly makes the cosmos a subject *like us*.                          | Micropsychism implausibly posits countless fundamental subjects *like us*.              |
  | **Structural Adequacy (Cosmos)**            | The cosmic subject, if it exists, lacks sufficient internal structure to ground the specific, bounded, complex character of human experience via decombination. | The cosmic state possesses the necessary complexity and structure to ground all macro-experiences as its derivative aspects. | S                            | Can the fundamental state possess the requisite structure to yield diverse, bounded macro-phenomenology? | The cosmos has immense structural complexity (laws, fields, particles, etc.).                                       | Cosmic structure is too global/diffuse to yield localized, private human perspectives.   | Cosmic structure is exactly what grounds localized perspectives via constraints.        |
  | **Structural Adequacy (Micro)**             | Fundamental micro-experiences can be simple/proto yet collectively compose complex macro-experiences via bonding. | Fundamental micro-experiences cannot be both simple enough to be fundamental *and* rich enough to compose macro-experiences without problematic emergence. | S                            | Can fundamental experiential units be sufficiently simple *and* serve as adequate compositional base for macro-phenomenology? | Macro-experience is complex/high-resolution. Fundamental entities (if particulate) are likely simple.               | Bonding relations non-emergently generate complexity from simple relata.                 | Genuine complexity requires fundamentality; composition from simples yields aggregates, not true unity/complexity. |
  | **Status if Physics Lacks Fundamental Parts** | If physics has no fundamental parts (e.g., pure fields, holism), constitutive micropsychism is false; grounding must involve non-particulate fundamental phenomenality. | If physics has no fundamental parts, cosmopsychism is strongly supported; the cosmos is the only natural fundamental subject. | S                            | How does the ontological picture of fundamental physics constrain the viable forms of panpsychism? | Physics may or may not posit fundamental discrete entities.                                                         | Would adopt a non-constitutive form of panpsychism (e.g., Russellian monism).            | Is the natural and preferred framework.                                                 |

  **Section 3: Pre-Registered Predictions**

  1.  **The Graded-Bridge Case:**
      *   **Setup:** Two humans (A & B) linked by a neural interface with adjustable bandwidth (data transfer rate) and delay. The dial is turned continuously from 0 (no connection) to a setting exceeding intact corpus callosum transfer rates. Phenomenal reports are collected at numerous settings.
      *   **Micropsychist Prediction:** As bandwidth increases (and delay decreases), the phenomenal bonding between the micro-subjects constituting A and B strengthens gradually. There is *no* point where a *new* subject (C encompassing A+B) comes into existence. A and B persist, but their experiences become increasingly intermingled and unified due to enhanced bonding. Reports will show a *smooth gradient* from two distinct subjects to a highly unified dyadic experience, without a sharp "merger" event. *Refutation:* Clear evidence of a distinct third subject (C) experiencing a unified field encompassing A and B's fused inputs, especially if reported discontinuously.
      *   **Cosmopsychist Prediction:** A and B remain distinct derivative subjects (aspects of the cosmos) at all settings. The increased coupling alters the structure within the cosmic experience corresponding to A and B, leading to greater shared or coordinated content, but it does not create a *new* subject C. The original two subjects persist. Reports will show increased similarity and coordination, but not the emergence of a novel, unified "group mind" perspective. *Refutation:* Clear, first-person reports indicative of a single, unified subjective perspective encompassing both A and B's fused inputs as experienced by a *new* subject C, distinct from A and B.
      *   **Shared Crux:** Does unity between systems necessarily imply the creation of a new subject or the destruction of the original subjects?

  2.  **The Final-Physics Case:**
      *   **Setup:** A completed fundamental physics either (a) Posits a decomposition into discrete, independent fundamental entities (e.g., particles, strings), or (b) Describes the universe as fundamentally non-decomposable (e.g., a unified field, holism, no fundamental parts).
      *   **Micropsychist Concession:**
          *   If (a): Strong support for fundamental micro-subjects. Must solve bonding/jumble/subject unity problems.
          *   If (b): Constitutive micropsychism, as defined (grounding in micro-subjects), is falsified. Would shift to a non-constitutive panpsychism (e.g., where fundamental phenomenality is associated with the holistic field itself, perhaps construed Russellianly).
      *   **Cosmopsychist Concession:**
          *   If (a): Compatible, but must explain why fundamental micro-entities are not micro-*subjects*. Micro-experiences might be seen as derivative aspects of the cosmic field localized at those points, not fundamental subjects.
          *   If (b): Strong support; the fundamental field naturally correlates with the fundamental subject.

  3.  **The Minimal Unity Case (Devised Test):**
      *   **Setup:** Construct artificial systems with identical intrinsic physical complexity (e.g., same number/complexity of processing units) but radically different connectivity patterns. System X has sparse, feedforward connections. System Y has dense, massively recurrent, holistic connections approaching integrated information (Φ) saturation for the system. System Z has the same components as Y but completely disconnected. Measure any potential correlates of subjective unity (e.g., global workspace dynamics, integrated information metrics, functional unity under perturbation).
      *   **Micropsychist Prediction:** Significant phenomenal unity/subjecthood is only expected in System Y, where the *specific bonding relations* enabling subject unity are present (high Φ, dense recurrence). X and Z, lacking these relations, will not manifest significant macro-subject unity, only micro-experiences (if any). The presence of complex parts (in X) is insufficient without bonding.
      *   **Cosmopsychist Prediction:** All systems are aspects of the cosmic subject. However, System Y possesses the specific *structural complexity* required for a stable, bounded, complex *derivative* aspect/subject to decombine. Systems X and Z lack this structure, so while experiences occur within the cosmic field corresponding to their activity, they do not constitute distinct, bounded macro-subjects *like us*. Reports (if possible) from Y would indicate a unified perspective; reports from X/Z would indicate disunity or absence of a clear subject. *Refutation (Both):* Clear evidence of a robust, unified macro-subject in System X (complex parts lacking bonding) or System Z (disconnected parts), or clear absence of any unified perspective in System Y despite its connectivity.
      *   **Shared Crux:** Is the critical factor for macro-subjecthood the presence of complex fundamental parts (Micro: requires bonding; Cosmo: irrelevant) or the presence of specific global structural complexity enabling boundedness (Micro: irrelevant; Cosmo: requires decombination)?

  **Section 4: Verbal-Dispute Audit**

  *   **Grounding Direction (S):** While "grounding" might be interpreted relationally, the core dispute over whether macro-subjects depend *on* micro-subjects (upward) or the cosmos (downward) is substantive. The causal/explanatory dependencies implied differ.
  *   **"Subject" Meaning (Potential V with S Residue):** Disagreement over whether the cosmic entity qualifies as a "subject" *in the same sense* as a human might be partly verbal. The cosmopsychist might define "fundamental subject" more minimally. However, the substantive residue is whether *any* entity beyond human-like macro-subjects possesses phenomenal unity at the fundamental level. Micropsychism denies this; cosmopsychism asserts it.
  *   **Aspects vs. Parts (V with S Residue):** Whether a derivative aspect and a proper part are fundamentally distinct categories is debatable. Micropsychists might view cosmic "aspects" as disguised parts; cosmopsychists might view micro-"parts" as disguised aspects. This has a verbal component. The substantive residue is the *direction of determination*: Are macro-properties determined by micro-properties + relations (Micro), or are micro-properties determined by their role within the cosmic whole (Cosmo)?
  *   **Combination/Decombination Primitives (S):** While one might be defined in terms of the other, the dispute over which is metaphysically fundamental and irreducible is substantive, impacting the structure of the theory and its core explanations (bonding vs. decombination mechanisms).

  **Diagnostic 1: Census-Function Reformulation**
  *   **Micropsychism:** Holds that the complete physical description (including all intrinsic properties *and* relational structure) *does* fix the number and identity of subjects *in principle*. The census function exists but is complex, mapping physical configurations to subjects based on whether bonding relations achieve unity/complexity thresholds. The dispute is over what that function *is*.
  *   **Cosmopsychism:** Holds that the complete physical description *does not* fix the subject facts *even in principle*. The cosmic subject is fundamental and not fixed by the physical; the derivation of macro-subjects (aspects) involves an additional primitive decombination relation not reducible to physical structure alone. The physical facts underdetermine the subject facts fundamentally.

  **Diagnostic 2: No-Arbitrary-Grain Principle**
  *   **The Principle:** If subjects are associated with a specific level (e.g., human brains), then either that level is fundamental, or there is a principled reason why no level strictly intermediate or superordinate to it has subjects.
  *   **Micropsychist Stance:** Rejects the principle as stated. Accepts a weaker principle: Subjects appear at the level where the *phenomenal bonding relation* achieves a sufficient degree of unity and complexity. There is no fundamental prohibition on subjects at other levels; it depends on whether the bonding conditions are met. Neurons may not bond sufficiently; coupled humans may not achieve the *kind* of deep integration seen intra-cranially. *Cost:* Must provide a non-arbitrary account of the bonding relation and its thresholds.
  *   **Cosmopsychist Stance:** Rejects the principle as stated. Accepts a weaker principle: Subjects appear at the level where the *structural complexity* is sufficient to support a stable, bounded decombined aspect. Simpler structures (neurons) or more complex but insufficiently bounded structures (coupled humans, galaxies) lack the specific structural features enabling the decombination of a distinct subject-aspect. *Cost:* Must provide a non-arbitrary account of the decombination relation and the structural features that trigger it.
