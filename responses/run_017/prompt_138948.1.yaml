  Okay, the user is a moral and social philosophy professor who's observed an asymmetry in how people react to norm violations. They've presented three cases: tipping in the US versus non-tipping cultures, and jaywalking norms. The key is that under-compliance (not tipping where expected) causes resentment even with ignorance, while over-compliance (tipping where not expected) gets amusement. The jaywalking case adds complexity because over-compliance there causes irritation. 

  Hmm, the user already has a sophisticated hypothesis: that observers interpret under-compliance as potential free-riding (thus resentment), while over-compliance is seen as harmless ignorance unless it obstructs others. They want to refine this, especially regarding how foreignness affects reactions, and what this reveals about whether conventions are moral obligations. 

  First, I need to validate their core insight but push further on the interpretation mechanism. The resentment in Case 1 isn't just about possible free-riding—it's that the act *allows* a defection reading. The observer's reaction depends on whether the behavior fits a self-interested script. For over-compliance, unless it blocks foot traffic, it doesn't benefit the actor, so ignorance is the default reading. 

  The foreignness boundary is crucial. Visible foreignness makes ignorance salient, so observers don't jump to defection. But for long-term residents, the "should have known" implies their ignorance *is* the fault—it signals indifference to local expectations. So it's not that ignorance becomes culpable later; it's that prolonged presence makes the ignorance itself read as disrespect. 

  On their big question: the resentment pattern suggests these aren't moral obligations per se. If they were, over-compliance would be praised as supererogatory, not laughed off. The asymmetry points to a hybrid: conventions are moralized *only* when violation suggests unfair advantage-taking. Thus, visitors' duties depend entirely on whether their non-compliance could reasonably look like free-riding. 

  I should stress this isn't about coordination costs—both deviations cause coordination failures, but only self-serving ones provoke outrage. The jaywalking case confirms: over-compliance becomes annoying only when costly, not because it's seen as defection. 

  The user’s hypothesis was sharp; my role is to crystallize the interpretive conditions and resolve the foreignness ambiguity. The key move is separating how behavior *can be read* from whether it actually is self-serving. Norm enforcement focuses on policing possible exploitation, not compliance for its own sake.
answer: |-
  Your phenomenon centers on **interpretive asymmetry in norm enforcement**: the differential reaction to non-conformity hinges on whether observers can plausibly interpret the behavior as *opportunistic defection* versus *costly ignorance*. The asymmetry is not about compliance *direction* (under/over), but about the **availability of a self-serving motive** in the observer's construal of the act. Below is the carving, with boundaries, mechanisms, and implications.

  ---

  ### **Core Phenomenon: Interpretive Asymmetry in Normative Legibility**
  1. **Definition**:  
     Observers react with moralized resentment to non-conformity when the behavior is *legible as strategic defection* (i.e., benefiting the actor at others’ expense). They react with non-moralized tolerance (amusement, pity) when the behavior is *illegible as defection* and instead legible as *innocent ignorance*. Resentment arises not from the outcome, but from the perceived *expressive meaning* of the act.  

  2. **Mechanism**:  
     - **Under-compliance** (e.g., not tipping where expected):  
       - *Legible as defection*: Matches the behavioral signature of free-riding (actor gains while avoiding shared costs).  
       - *Ignorance is discounted*: Observers reject ignorance as an excuse because defection remains the most salient reading. "Should have known" asserts that the actor *ought* to have made ignorance implausible.  
     - **Over-compliance** (e.g., tipping where not expected):  
       - *Illegible as defection*: No self-serving motive is apparent (actor incurs cost without gain).  
       - *Ignorance is default reading*: Observers charitably ascribe the act to confusion. Embarrassment reflects pity for the actor’s gaffe.  
     - **Cost-imposing over-compliance** (e.g., blocking foot traffic):  
       - *Reclassified as nuisance*: Not seen as defection (no self-interest), but as *incompetence* imposing tangible costs. Irritation replaces moral resentment.  

  3. **Boundary Cases**:  
     - **Case A**: A local "under-complies" by skipping a tip *while complaining about service*.  
       - *Reaction*: Resentment intensifies. Confirms defection reading (added expressive insult).  
       - *Boundary test*: If ignorance is claimed, it is rejected as implausible—defection is overdetermined.  
     - **Case B**: A visitor over-complies by tipping lavishly in a non-tipping culture, visibly seeking praise.  
       - *Reaction*: Annoyance, not amusement. Self-serving motive (virtue-signaling) makes defection legible.  
       - *Boundary test*: Distinguishes *mere* over-compliance (no perceived gain) from *self-interested* over-compliance.  
     - **Case C**: A visitor under-complies due to a visible disability (e.g., blindness preventing seeing a tip jar).  
       - *Reaction*: Pity, not resentment. Physical constraint blocks defection reading.  
       - *Boundary test*: When ignorance/incapacity is *objectively manifest*, defection reading is unavailable.  

  ---

  ### **The Foreignness Boundary: Two Mechanisms, One Function**
  Your suspicion is correct: foreignness modulates whether ignorance is accepted. But the mechanism is **epistemic**, not moral:  
  - **Visibly foreign visitor**:  
    Ignorance is *cognitively available* to observers. Perceived cultural distance makes ignorance the default explanation, blocking the defection reading.  
  - **Long-term resident/returning visitor**:  
    Ignorance is *epistemically implausible*. Observers infer that the actor *could and should* know the norm, making ignorance read as *willful disregard*—a form of defection.  

  **Why this isn’t culpable ignorance**:  
  Culpable ignorance requires prior negligence (e.g., failing to research norms). Here, observers need not trace ignorance to fault; they simply find it *incredible* that the actor lacks knowledge. "Should have known" means "your ignorance is socially unintelligible," not "you were negligent." The resentment targets the *expressed indifference* to local expectations, not the ignorance itself.  

  ---

  ### **Relation to Established Concepts**  
  - **Nearest concept**: **Moral typecasting** (Gray & Wegner, 2011).  
    - *Overlap*: Observers cast norm-violators as "moral agents" (blameworthy) or "moral patients" (pitiable) based on perceived intent.  
    - *Departure*: Your cases show typecasting is *contingent on behavioral legibility*, not fixed traits. Defection-readings require a *plausible self-serving script*.  
  - **Contrast with**:  
    - **Culpable ignorance**: Focuses on tracing ignorance to prior fault. Here, "should have known" arises from *present social unintelligibility*, not causal negligence.  
    - **Convention vs. morality**: Suggests norms are moralized only when violations express unfairness (see below).  

  ---

  ### **Implications for Normative Status of Conventions**  
  The asymmetry reveals that **conventions are moralized contingently**:  
  - They trigger obligation-like reactions *only* when non-conformity is legible as free-riding.  
  - Where no defection is readable (e.g., harmless over-compliance), reactions are amoral—conventions lack inherent moral weight.  

  **Answering your final question**:  
  - **Visitors need not follow local conventions *as obligations***. The resentment in Case 1 is indeed **free-rider detection in obligation’s clothing**. It reflects a fairness norm ("don’t exploit shared practices"), not a duty to the convention itself.  
  - **When must visitors comply?** Only when non-compliance could reasonably be read as defection:  
    - *Requires*: (1) The norm solves a collective action problem (e.g., tipping subsidizes wages), and (2) the visitor’s non-conformity fits a self-serving narrative (e.g., saving money while benefiting from the system).  
    - *Does not require*: (1) The convention being inherently moral, or (2) perfect knowledge of local norms.  

  **Test case**: A visitor in a tipping culture donates the "saved" tip to a charity serving restaurant workers.  
  - *Predicted reaction*: Resentment dissipates. Defection reading is blocked—the actor accepts costs but redirects them. Confirms the driver is fairness, not convention-compliance.  

  ---

  ### **Conclusion: The Carving**  
  - **What it is**: An asymmetry in norm enforcement rooted in the *social legibility of motives*. Resentment arises when non-conformity is interpretable as self-serving defection; tolerance dominates when it is legible as non-strategic ignorance.  
  - **What it is not**: A response to coordination costs (both deviations cause them), outcome severity (identical ignorance in Cases 1/2), or culpable ignorance (no tracing required).  
  - **Edges**:  
    - Defection-reading fails when ignorance is manifest or when no self-gain is plausible.  
    - Over-compliance becomes resented only if it signals self-interest (e.g., grandstanding) or imposes material costs (e.g., obstruction).  

  **Term proposal**: **Defective interpretive legibility**—though the phenomenon’s novelty lies in its *selective moralization* of conventions based on motive-legibility. It shows that norm-enforcement is less about rules than about policing perceived exploitation. This reframes "local obligations" as conditional on the visitor’s capacity to signal commitment to fairness, not compliance itself.
