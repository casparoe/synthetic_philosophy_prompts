answer: |-
  ## Joint Statement: Distinctionist-Deflationist Adversarial Collaboration on Doing/Allowing in End-of-Life Ethics

  **1. Agreed Claims:**

  1.  The distinction between *doing harm* and **merely *allowing* harm** is intuitively robust in many clear, paradigm cases (e.g., actively injecting a lethal dose vs. withholding life-sustaining antibiotics where death is imminent regardless).
  2.  The core philosophical dispute concerns whether this intuitive distinction marks a *fundamental, irreducible moral asymmetry* (Distinctionism) or whether it is *exhaustively explained* by non-moral factors like causation, evidence, risk, cost, and institutional roles (Deflationism).
  3.  The intuitive force of the distinction is significantly weakened, and often disappears, when cases are meticulously matched for relevant non-moral factors (e.g., certainty of outcome, effort required, motives, identity of victims, prior obligations).
  4.  The doing/allowing distinction is conceptually distinct from the intending/foreseeing distinction, though they often co-occur and may interact. One can be present without the other.
  5.  Both positions acknowledge that *actual* instances of "doing" and "allowing" in clinical practice are typically surrounded by significant differences in causal complexity, epistemic uncertainty, resource allocation, professional duties, and potential for abuse or slippery slopes.
  6.  Both positions accept that moral justification depends crucially on factors *other* than doing/allowing status alone, such as patient wishes, proportionality, futility, and professional integrity.
  7.  Institutional rules, professional guidelines, and legal frameworks often treat doing and allowing differently for reasons of manageability, clarity, precedent, and preventing harms like abuse or neglect. This differential treatment does not *necessarily* reflect a fundamental moral truth.
  8.  The burden of justification often *feels* heavier in "doing" cases. Both sides agree this phenomenological difference exists; they disagree profoundly on its source and moral significance.
  9.  Neither position claims that "allowing harm" is always permissible. Significant constraints apply to both doing and allowing harm.
  10. The distinction, however interpreted, plays a significant role in common moral reasoning and legal frameworks concerning end-of-life care.
  11. Resolving the core dispute requires examining carefully constructed hypothetical cases and arguments designed to isolate the purported moral difference, rather than relying solely on complex real-world clinical scenarios laden with confounding variables.
  12. Further philosophical and conceptual analysis is needed to clarify the nature of agency, causation, and moral constraints, as they bear directly on this dispute.

  **2. Table of Residual Disagreements:**

  | Disagreement Focus           | Distinctionist Position                                                                                                | Deflationist Position                                                                                                                                 | Substantive/Verbal? |
  | :--------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------ |
  | **1. Moral Status of Distinction** | There exists a fundamental, irreducible moral constraint against *doing* harm that is categorically stricter than the constraint against *allowing* equivalent harm, even when non-moral factors are held constant. | Any persistent moral difference between meticulously matched doing/allowing cases is fully reducible to differences in descriptive factors (e.g., independent causal chains, evidence burdens, risks of error, practical costs, implications for institutional rules). | **Substantive**     |
  | **2. Explanatory Priority**  | The doing/allowing distinction provides the best *explanation* for why factors like causal independence or institutional manageability matter morally in the contexts they do. | Factors like causal independence and institutional manageability explain *why* the doing/allowing distinction arises and feels salient; the distinction itself is epiphenomenal.                               | **Substantive**     |
  | **3. Role in Justification** | The doing/allowing status functions as a near-absolute *constraint*; causing harm requires overwhelmingly stronger justification than allowing equivalent harm. | The doing/allowing status, once deflated, functions only as a *proxy* for other morally relevant factors; it adds no independent justificatory weight and can be overridden by sufficiently strong countervailing reasons. | **Substantive**     |
  | **4. Fundamental Ground**    | The asymmetry is fundamentally moral, rooted in the structure of agency itself and the special responsibility one bears for changes one *initiates* versus changes one merely *fails to prevent*. | The asymmetry (or its appearance) is fundamentally descriptive, rooted in contingent features of causation, evidence, and social coordination. What matters morally is the net impact on well-being, rights, and duties, not the doing/allowing label. | **Substantive**     |
  | **5. Defining "Independent Threat"** | The condition "the threat is already underway independently of the agent" is a necessary, non-moral descriptor for a pure allowing. | The condition "independently underway threat" either smuggles in moral assumptions about the agent's non-responsibility or is merely a placeholder for complex causal/evidential descriptions. | **Substantive**     |
  | **6. Scope of "Doing"**      | "Doing" harm involves an agent's active intervention that *makes* the harmful outcome occur in a way that her omission would not. | "Doing" harm involves an agent being a *necessary part* of the causal sequence leading to harm *in the specific context*, a description dependent on the baseline and causal network. | **Verbal/Substantive** (Borderline) |

  **3. Cruxes:**

  1.  **Crux 1: The Equalised-Pair Protocol & "Independent Threat"**
      *   **(i) Sub-question:** Can the condition "the threat is causally independent of the agent and already underway" be fully specified *without* employing moral concepts or assuming the doing/allowing distinction itself?
      *   **(ii) Why it moves:** For the **Distinctionist**, establishing a non-moral specification is crucial to defend the distinction as tracking a fundamental feature of reality. For the **Deflationist**, showing it's impossible or requires moral concepts undermines the distinction's irreducible status.
      *   **(iii) Case/Argument:** The Equalised-Pair Protocol: Construct two meticulously matched scenarios differing *only* in whether the agent actively intervenes to cause death (Doing) or refrains from intervening to prevent a death occurring via an independent process (Allowing), controlling all other factors. Does a moral difference remain?
      *   **(iv) Predictions:**
          *   *Distinctionist:* Predicts a robust, persistent moral intuition that the Doing case is harder to justify, even in fully equalised pairs where "independent threat" is non-morally defined (e.g., a pre-existing fatal condition). *Surprise:* If intuitions reliably converge on equivalence.
          *   *Deflationist:* Predicts intuitions of moral difference will vanish or become highly unstable once all non-moral factors (including a precise, non-moral definition of "independent threat" using causal graphs/counterfactuals) are controlled. *Surprise:* If a stable, significant moral asymmetry persists despite perfect non-moral matching.

  2.  **Crux 2: Timing & the Sleeping Clinician (Clinical Case)**
      *   **(i) Sub-question:** Is the moral status (doing vs. allowing) of a death determined by the agent's conduct *at the time of the initiating act/omission*, or by the causal configuration *at the time of death*?
      *   **(ii) Why it moves:** Challenges the **Distinctionist** view that the *act itself* carries a fixed moral valence. Challenges the **Deflationist** to explain the intuitive difference without relying on the act/omission label.
      *   **(iii) Case:** Clinician A sets an infusion pump at T1 with a rate appropriate for the patient's condition, then goes off duty/sleeps. At T2 (hours later), the patient's condition changes, making the infusion rate lethal. The pump cannot be remotely adjusted, and Clinician A is unreachable. Clinician B, arriving at T2, observes the lethal trajectory but does nothing (e.g., cannot adjust pump, or policy forbids it). Patient dies at T3. Is Clinician A’s role (initiating the infusion) more akin to "doing" harm or "allowing" it? Is Clinician B's role different?
      *   **(iv) Predictions:**
          *   *Distinctionist:* Predicts Clinician A's act at T1 is evaluated based on context *at T1* – likely permissible allowing or neutral setting. Clinician B's omission at T2 is a clear allowing. *Surprise:* If Clinician A is judged similarly to someone actively causing harm at T2.
          *   *Deflationist:* Predicts the relevant moral evaluation focuses on the point of avoidability (T2). Clinician A's initial act is causally necessary but non-culpable due to unforeseeability at T1. Clinician B's omission is the salient failure point. Both involve "allowing" relative to T2. *Surprise:* If a strong moral asymmetry persists between A's T1 act and B's T2 omission, attributing "doing" to A based solely on the initial causal contribution.

  3.  **Crux 3: Lexical Asymmetry & Aggregate Harms**
      *   **(i) Sub-question:** Is there a point where the number of equivalent harms *allowed* outweighs the moral prohibition against *causing* one such harm? Does this change if the allowed harms are distributed (e.g., a million agents each allowing 1/1,000,000th of a death)?
      *   **(ii) Why it moves:** Tests the **Distinctionist** claim of a near-absolute constraint. Tests the **Deflationist** claim that only aggregate consequences and fairness matter.
      *   **(iii) Argument:** Compare: (A) You can *cause* one death to save 100 lives. (B) You can *fail to prevent* (allow) one death to save 100 lives. (C) You can *cause* one death to prevent a million deaths elsewhere that would result from the *combined inaction* of a million separate agents (each of whom could easily prevent 1/1,000,000th of the harm, but none does).
      *   **(iv) Predictions:**
          *   *Distinctionist:* Predicts causing one death (A) remains significantly harder to justify than allowing one death (B), even for saving 100. Predicts causing one death (C) to prevent a million aggregate "allowed" deaths remains prohibitively difficult compared to scenarios involving preventing aggregate harms without causing. *Surprise:* If B becomes as hard as A, or if C becomes easily justifiable.
          *   *Deflationist:* Predicts the justification threshold for A and B converges as the number saved increases (e.g., both require strong justification for 1:1, both easily justified for 1:100). Predicts C is more readily justifiable than A (due to the massive aggregate harm prevented being constituted by "allowings"). *Surprise:* If a strict lexical asymmetry persists between A and B even for very large numbers, or if C is seen as clearly *worse* than an equivalent single-agent allowing scenario.

  4.  **Crux 4: Grounding & Relation to Intending/Foreseeing**
      *   **(i) Sub-question:** If a fundamental asymmetry exists, what is its most plausible metaphysical or normative ground? Conversely, if intending/foreseeing is more fundamental, can it explain the doing/allowing intuitions?
      *   **(ii) Why it moves:** Forces articulation of the foundational commitments of each view. Challenges **Distinctionists** to locate the asymmetry convincingly. Challenges **Deflationists** to explain the intuitive *distinctness* of doing/allowing from intending/foreseeing.
      *   **(iii) Case/Argument:** Analyze cases where doing/allowing and intending/foreseeing come apart: (1) Foreseen but unintended harm caused by necessary action (e.g., palliative sedation hastening death). (2) Intended harm *allowed* (e.g., gleefully withholding treatment hoping the patient dies). Does the doing/allowing status retain independent moral significance? Does intending/merely foreseeing alter the doing/allowing evaluation?
      *   **(iv) Predictions:**
          *   *Distinctionist:* Predicts the doing/allowing status exerts a strong, independent constraint even when intentions are good (case 1) or bad (case 2). Predicts intending/foreseeing modifies the *degree* of wrongness within doing/allowing categories but doesn't erase the categorical difference. *Surprise:* If intention overwhelmingly determines permissibility regardless of doing/allowing status.
          *   *Deflationist:* Predicts the intention (and proportionality) is the primary moral determinant; the doing/allowing label adds little once intention and consequences are fixed. In case 2, the *intention* makes the allowing wrongful, not the allowing *per se*. *Surprise:* If the doing/allowing status strongly constrains the permissibility of actions/omissions even when intentions and outcomes are held firmly constant.

  **4. Evidence Against Own View:**

  *   **Distinctionist:** Would count the following as significant evidence against their view: (1) Consistent, robust convergence of expert intuition on moral equivalence in meticulously constructed, fully equalised doing/allowing pairs. (2) A convincing, non-question-begging account showing how all intuitive doing/allowing judgments track *only* the non-moral factors Deflationists cite, across all cases. (3) Demonstration that the purported "constraint" reliably dissolves under consequentialist pressure in ways indistinguishable from a heavy weight.
  *   **Deflationist:** Would count the following as significant evidence against their view: (1) Discovery of a stable, significant moral asymmetry in judgments about equalised pairs that demonstrably *cannot* be explained by any plausible combination of non-moral factors (causation, evidence, risk, cost, rule-following). (2) A successful non-circular grounding of the asymmetry in agency, rights, or claims that withstands deflationary analysis. (3) Showing that institutional rules treating doing/allowing differently *systematically* lead to better moral outcomes *because* they track this irreducible feature, not just manageability concerns.

  **5. Non-Substantive Elements:**

  Both sides acknowledge that *some* persistent disagreement might stem from:

  1.  **Terminological Focus:** Differing emphasis on the *core concept* ("doing" as positive intervention vs. "allowing" as non-intervention) versus the *paradigm cases* that shaped the intuitions (murder vs. natural death).
  2.  **Descriptive vs. Prescriptive Focus:** Distinctionists often prioritize capturing the *constraining force* of the intuition, while Deflationists prioritize finding its *descriptive basis*. This can lead to talking past each other.
  3.  **Weight of the Proxy:** Disagreement on *how strong* a proxy the doing/allowing distinction is for non-moral factors (e.g., Deflationists see it as fully reducible, Distinctionists might concede it's a useful heuristic but insist it points to something deeper).
  4.  **"Moral Reality" Interpretation:** Differing interpretations of what constitutes a "morally real" distinction – whether it requires fundamentality (Distinctionism) or merely robust patterns of justification (Deflationism).

  This statement reflects the current state of our collaborative inquiry. We commit to using these agreed points, clarified disagreements, and cruxes to structure future discussions, seeking empirical and conceptual progress on the identified questions.
