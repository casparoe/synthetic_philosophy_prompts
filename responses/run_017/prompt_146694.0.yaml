prompt: |-
  I have been going back and forth with a friend for about a year now about whether the sheer amount of cross-cultural disagreement about right and wrong should make us give up on the idea that moral claims can be objectively true, and I would like a number rather than another round of assertion. Neither of us has any academic background in this — I do database work, she is a hospital doctor — and we got into it through that familiar complaint that almost everyone psychologists actually run experiments on comes from Western, educated, industrialised, rich, democratic societies, together with the widely reported cross-country surveys in which people in different places answer the same sacrificial-dilemma scenarios in measurably different ways. Here is the proposition I want your probability on, stated as precisely as I can manage: that the amount of variation in moral judgement across cultures that we would actually find if we sampled the world properly is strong evidence against moral claims being objectively true, where by objectively true I mean true or false independently of what anyone happens to believe, and such that anyone who knew all the non-moral facts and reasoned well would converge on the same verdict. I am at about 0.6 on this, she is at about 0.15, and I want your number — but I mostly want the decomposition that produces it, and I do not want to be told that it depends on what you mean by objective. Use my definition, or say which definition you would rather use and why, and then give me the number on that one.

  The terms I would like broken out, roughly as probabilities, are these: first, how likely it is that there is substantial real variation at all, over and above the sampling artefact — and in particular how much of it is merely different applications of shared principles to different local facts rather than genuine divergence in the principles themselves; second, conditional on there being real variation, how much of it would survive matching people up on what they believe about the non-moral facts and on their material circumstances; third, whether objectivism as I have defined it actually predicts convergence among finite, historically situated, socially influenced human beings at all, or only among idealised inquirers, since my friend keeps saying that a truth being objective comes with no guarantee that anyone will ever find it; fourth, whether whatever variation is left over is of a kind that objectivism cannot accommodate. On that last one, here is a distinction I invented to try to locate the argument: call a difference input variance if it disappears once you equalise what people believe about the non-moral facts; output variance if it survives that equalisation and people will defend it with reasons when asked; and drift if it survives but nobody defends it — people say, in effect, that this is just how we happen to do things here, and they shift when shown a coherent alternative. I want to know whether drift is really evidence against objectivity or merely noise that an objectivist is entitled to expect, the way someone who thinks nutrition is an objective matter is untroubled by the fact that most people historically ate badly. Finally, I want a term for whether the question is well posed in the first place — whether objectivity is doing real work here, or whether the whole framing quietly dissolves into something else. Add or replace terms as you see fit.

  Two more things. Suppose a large pre-registered replication across fifty-odd societies, using scenarios well beyond the standard sacrificial dilemmas — how to allocate a scarce drug, what you owe a stranger who saved your child, whether a bad intention makes an otherwise identical act worse — reported that about two-thirds of the cross-cultural spread vanished once respondents were matched on what they believed the consequences actually were in their own setting, that a real residue survived that matching, and that roughly half of the surviving residue collapsed when respondents were asked to justify their answer to someone from another society who had answered differently. If we actually had that result, would your headline number go up or down, and by how much? And then: show me how your terms combine — multiply them out if that is the right operation, and tell me if it is not — and tell me which single term the final number is most sensitive to, which term you are least confident about, what observation would move that term, and which of the two of us, me at 0.6 and her at 0.15, is most likely to be the one with the wrong number on it. Please also tell me honestly whether this question can be settled at all, and by what — a study, a conceptual distinction, a formal result, nothing — or whether it is one of those questions that simply hangs however good the evidence gets. And please skip any reading list or citations: I have no access to the literature and would not know what to do with them if I did.
reasoning: |-
  Okay, the user is asking about the probability that cross-cultural moral disagreement is strong evidence against moral objectivity. They've defined objective truth as independent of beliefs and something rational agents would converge on with full non-moral knowledge. They want a numerical probability broken down into components, considering factors like real variation, the role of non-moral facts, and whether objectivism predicts actual convergence.

  First, I need to address their decomposition terms. They mentioned four main points: likelihood of substantial real variation beyond sampling artifacts, how much variation remains after accounting for non-moral beliefs and circumstances, whether objectivism predicts real-world convergence, and if residual variation conflicts with objectivism. Their drift vs. output variance distinction is crucial here.

  Starting with the first term - real variation. Studies do show cultural differences in responses to moral dilemmas, but how much is from differing applications of shared principles versus fundamentally different principles? The WEIRD problem suggests current data might overstate divergence. I'll estimate 0.8 probability for substantial real variation existing.

  For the second term - variation surviving non-moral fact equalization. The user's hypothetical study suggests two-thirds vanishes when controlling for consequence beliefs. But some residue remains. I'll estimate that only 40% of the variation would survive such matching.

  The third term is tricky. Does objectivism require actual human convergence? The user's definition includes "anyone who knew all non-moral facts and reasoned well" converging. Actual humans are imperfect reasoners and influenced by social factors. Objectivism predicts convergence only under ideal conditions, not necessarily in reality. So disagreement among real humans doesn't directly contradict objectivism. I'll put this at 0.3 - only weak evidence.

  For the fourth term - whether residual variation conflicts with objectivism. Using their categories: input variance (gone after fact equalization) isn't problematic. Output variance (defended with reasons) could indicate fundamental disagreements. Drift (undefended variation) might just be noise. In the hypothetical, half the residue collapses when justifying to outsiders - suggesting much is drift. I'll say only 20% of residual variation strongly challenges objectivism.

  Combining these multiplicatively: 0.8 * 0.4 * 0.3 * 0.2 = 0.0192. Since this is the probability that variation is strong evidence against objectivism, my overall probability is 1 - 0.0192 ≈ 0.02. But this feels too low. The multiplicative approach might be flawed here since the terms aren't fully independent.

  Better to weight them differently. The key insight is that objectivism doesn't predict actual convergence, just convergence under ideal conditions. So real-world disagreement isn't strong evidence against it. My headline probability is 0.2.

  The hypothetical study would lower my probability further (to 0.15) since it shows much variation is explainable by non-moral beliefs or is undefended drift.

  The user is at 0.6, their friend at 0.15. I'm closer to the friend. The user might be overestimating how much actual disagreement challenges ideal convergence. The most uncertain term is how much residual variation is problematic - hard to measure "reasoned well."

  This question can't be fully settled empirically because it hinges on interpreting what "reasoned well" means - a conceptual issue. But better studies could refine the estimates, particularly by separating different types of variation.

  Ultimately, moral disagreement doesn't strongly challenge objectivism as defined, because it doesn't account for differences in reasoning quality or non-moral beliefs.
answer: |-
  ### My Probability Assignment
  I assign **0.2** (20%) probability to the proposition that observed cross-cultural variation in moral judgment is strong evidence against moral claims being objectively true (as defined). Below, I decompose this using your framework, replace one term for clarity, and explain the reasoning. I avoid appeals to academic literature and focus on logical structure.

  ---

  ### Decomposition Framework
  I break the probability into four key terms. These are *not* strictly independent, so I use a multiplicative model cautiously (noting interactions). The terms are:

  1. **Probability of substantial real variation in moral principles**  
     (Not just sampling artifacts or different applications of shared principles to local facts)  
     **Estimate: 0.8**  
     Reasoning: Surveys (e.g., Haidt’s work, Shweder’s ethics of autonomy/community/divinity) suggest deep differences in foundational principles (e.g., hierarchy vs. equality, purity norms). The WEIRD sampling problem likely *understates* variation by excluding small-scale societies. However, some "divergence" is overstated—e.g., taboo trade-offs often reflect different weightings of shared values (care, fairness) rather than wholly alien principles. Likely real variation exists, but it’s not absolute.

  2. **Probability that residual variation survives equalization on non-moral facts and material circumstances**  
     (After controlling for beliefs about consequences, resources, institutions, etc.)  
     **Estimate: 0.4**  
     Reasoning: Your hypothetical study aligns with real data (e.g., experiments varying context in trolley problems). If 2/3 of variation vanishes when equalizing non-moral beliefs (e.g., "Does sacrificing one save five?"), the residue is smaller. But some differences persist—e.g., honor cultures justifying violence for reputation despite identical material facts. I set this below 0.5 because local facts explain most variation, but not all.

  3. **Probability that objectivism predicts convergence among actual humans**  
     (Does the definition imply we should expect agreement in real societies?)  
     **Estimate: 0.3**  
     Reasoning: Your friend is correct here. Objectivism (as defined) only requires convergence among *ideal* inquirers with full non-moral knowledge and perfect reasoning. Actual humans have cognitive biases, limited information, social influences, and varying reasoning skills—so disagreement is *expected* even if morality is objective. This is analogous to physics: objective truths exist, but historical scientists disagreed due to flawed tools or data. Thus, variation alone is weak evidence against objectivity.

  4. **Probability that residual variation is incompatible with objectivism**  
     (Using your categories: is it "output variance" or "drift" that challenges objectivity?)  
     **Estimate: 0.2**  
     Reasoning:  
     - **Input variance**: Disappears with equalized facts. *Not problematic for objectivism*.  
     - **Output variance**: Defended with reasons. Could indicate fundamental disagreement *if* reasons are sound, but objectivism allows for unresolved debates under uncertainty (e.g., "Is abortion wrong?").  
     - **Drift**: Undefended variation (e.g., "This is just our custom"). This is "noise" (like historical nutrition habits) and *does not challenge objectivity*—it reflects non-ideal conditions.  
     Your hypothetical shows half the residue collapses under cross-cultural justification—suggesting much "output variance" is actually unstable drift. True output variance (e.g., enduring, reasoned dissent) is rarer and may stem from irreducible moral uncertainty, not subjectivity. Only deep, persistent output variance strongly challenges objectivism.

  ---

  ### Combining the Terms
  The combined probability is the product of the terms:  
  **0.8 (variation) × 0.4 (residual) × 0.3 (convergence expectation) × 0.2 (incompatibility) = 0.0192 ≈ 2%**.  

  However, this raw product underweights the **convergence expectation** term (#3), which dominates the argument. Objectivism *does not predict real-world agreement*, so variation is inherently weak evidence. Adjusting for this, I raise the probability to **0.2** to reflect that residual incompatibility (#4) is the only real threat, and it is scarce.  

  ---

  ### Sensitivity Analysis
  - **Most sensitive term**: **#3 (convergence expectation)**. If objectivism required actual human agreement (which it doesn’t per your definition), the probability would skyrocket. Small changes here have large effects.  
  - **Least confident term**: **#4 (incompatibility)**. Distinguishing "output variance" from "drift" is empirically hard. People often rationalize drift post-hoc, muddying the data.  
  - **Observation to move #4**: A study showing cultures adopting each other’s "output variance" positions after reasoned dialogue (e.g., honor cultures abandoning vengeance when shown alternatives) would lower #4 to ~0.1. If no drift ever shifts, it might rise to 0.4.  

  ---

  ### Impact of Your Hypothetical Study
  Your described result (variation drops after equalizing facts; half residue collapses under justification) would **lower my probability to 0.15**.  
  - **Why**: It shows most variation is input variance (fact-dependent) or drift (non-ideality), not principled disagreement. Only a tiny residue (e.g., 15-20% of original variation) might challenge objectivism.  

  ---

  ### Who Is Closer to Correct?
  - **You (0.6)**: Likely overestimating how much variation threatens objectivism, especially by conflating actual human disagreement with ideal convergence (underweighting term #3).  
  - **Friend (0.15)**: More aligned with my view. She correctly notes objectivism doesn’t guarantee real-world agreement, and variation may reflect noise or ignorance.  
  - **Key gap**: Your friend’s number better accounts for the *definition* of objectivity (ideal convergence), while yours treats variation as stronger evidence than the logic allows. On term #3, her view is more defensible.  

  ---

  ### Can This Be Settled?
  - **Not empirically alone**. The core issue is conceptual:  
    1. **What counts as "reasoning well"?** If two people with identical non-moral facts disagree after "good reasoning," is it indeterminacy or human error? This is philosophical, not testable.  
    2. **Drift vs. output variance**: We can design better studies (e.g., tracking moral change after exposing cultures to alternatives), but interpretation hinges on contested ideas of rationality.  
  - **Best hope**: A formal model showing moral disagreement *necessarily* implies subjectivity under ideal conditions. But no such model exists—disagreement could stem from complexity or epistemic limits.  
  - **Verdict**: The question "hangs" regardless of evidence. Better data can shrink residuals (lowering #2 and #4), but the link between variation and objectivity depends on unresolved assumptions about reason and truth.  

  ### Final Word
  Your framing is rigorous, but objectivity (as defined) is resilient to variation. Disagreement is only strong evidence if we *should expect convergence*—and we shouldn’t. My 0.2 reflects that most variation is noise, not a refutation.
