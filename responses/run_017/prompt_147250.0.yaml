prompt: |-
  A blurb on the back of a short introduction to contemporary philosophy — I no longer have the book with me — sums up Richard Rorty's antirepresentationalism roughly as follows: language never hooks onto the world, only onto other language, so no belief is ever answerable to how things really are; truth, on this view, is nothing over and above what your community will currently let you assert, i.e. just current consensus; it follows that there is no fact of the matter about anything and no standpoint from which one culture's beliefs could be faulted by another; science is accordingly only one more genre of writing, with no special epistemic authority, and inquiry converges on nothing at all; and in any case the position refutes itself, since the claim that no statement represents reality is either itself a claim about reality or else just another move in the language game.

  I don't know how much of this to trust. I'm fairly confident the self-refutation charge is too quick, but I can't say why, and I'm stuck on the first clause: I work in infectious disease modelling, where a model fails because reality won't cooperate with it, and I can't hear that as merely my colleagues refusing to let me say something — though I suspect that is exactly the confusion Rorty would say I'm having. Please audit the blurb claim by claim and tell me what Rorty himself would accept, what he'd accept only as a rough simplification, and what he'd flatly deny — specifically whether he is committed to there being no fact of the matter, whether his view is a variant of deflationism about truth, whether he denies that the world causes our beliefs or only that it justifies them, and whether the ethnocentrism he does endorse is just relativism renamed. Then say which of the blurb's further conclusions survive correction and which collapse: can a Rortyan still criticize another culture, and still say that one inquiry went better than another? And flag anything in the blurb that his critics have actually established rather than merely repeated. Lead with your bottom line — one sentence on how fair the blurb is overall — then give the audit, with no preamble and no restating of my question.
reasoning: |-
  Hmm, the user is asking me to audit a blurb about Richard Rorty's antirepresentationalism. They don't have the book anymore but recall this summary that says language never hooks onto the world, truth is just consensus, there are no facts of the matter, science has no special authority, and the position self-refutes. The user works in infectious disease modeling and finds it hard to see their models failing as merely colleagues refusing to let them say something. They want me to go through the blurb claim by claim, assessing what Rorty would accept, what he'd see as simplified, and what he'd deny. Specifically, they want to know about facts of the matter, deflationism, causes vs justification of beliefs, and whether his ethnocentrism is just relativism. They also want to know which conclusions survive correction and which collapse, like whether criticism across cultures or comparing inquiries is possible. Finally, they want me to flag any points critics have actually established.

  I need to recall Rorty accurately. He was a pragmatist who rejected representationalism - the idea that language mirrors reality. He saw truth as what works for a community, not correspondence to facts. But he wasn't a relativist. He emphasized that beliefs are caused by the world, which he called the "world as causal," but justification is always within a community. Truth, for him, was unproblematic in daily use but not a deep metaphysical property; he was a deflationist. In "Contingency, Irony, and Solidarity," he argued against universal standards but for ethnocentric solidarity - we start from our traditions to improve them. Science, for Rorty, is a practical success story, not a privileged path to truth, but he didn't reduce it to mere storytelling.

  Now, auditing the blurb: The first claim says language never hooks onto the world, only other language. Rorty would accept this as a rejection of representational hooks but deny that the world doesn't affect us causally. He'd say language is a tool, not a mirror. On truth being consensus, he'd accept it as a rough social practice but clarify it's not arbitrary; it's about what withstands challenges, which is a simplification. For no fact of the matter, he'd flatly deny this - he believed in facts as what we agree on, not as non-existent. The science part, he'd accept that it's a genre without special epistemic authority, but deny it's "only one more" as if it has no practical value. Self-refutation: He'd deny this, saying his claims are tools, not metaphysical assertions.

  On specific queries: No, he's not committed to no fact of the matter - facts are social constructs. His view is a variant of deflationism, focusing on truth's use. He denies the world justifies beliefs, not that it causes them. Ethnocentrism isn't relativism; it's starting from home traditions, not saying all are equal. For conclusions: After correction, criticism across cultures is possible through persuasion, not appeal to reality. Comparing inquiries is based on practical outcomes. Critics have established that Rorty's view might undermine normative force in truth, but the self-refutation charge is weak.

  The user's confusion in modeling: Rorty would say the model fails due to causal interactions with the world, but the justification for calling it a failure comes from community standards. The blurb is unfair overall because it oversimplifies and misrepresents key aspects, making Rorty sound like a relativist when he wasn't. I need to structure the response as instructed: start with a bottom-line sentence, then audit claim by claim, and address the user's specific questions without preamble. Keep it clear and concise.
answer: |-
  **Bottom line:** The blurb is largely unfair, presenting crude distortions of Rorty's nuanced pragmatism as flat commitments, significantly misrepresenting his views on truth, justification, and the world's role, though it captures his core rejection of representationalism and skepticism about science's unique epistemic status.

  **Audit of Blurb Claims:**

  1.  **"language never hooks onto the world, only onto other language"**
      *   **Rorty's Response:** **Accepts the core antirepresentationalist point, but only as a rejection of "mirroring" or "correspondence."** He'd vehemently **deny** this implies language is *causally* isolated from the world. The world *impinges* on us causally, forcing belief revisions. Language hooks onto the world in the sense that *causal interactions* with the world lead us to change our beliefs and vocabularies.

  2.  **"so no belief is ever answerable to how things really are"**
      *   **Rorty's Response:** **Denies this strongly.** Beliefs *are* answerable – but not to a "way things really are" conceived as a non-human standard independent of all vocabularies. They are answerable to *other beliefs* (coherence), to *experience* (caused by the world), and crucially, to the *practical consequences* of holding them within our social practices. The world causes us to have beliefs, but justification is social.

  3.  **"truth... is nothing over and above what your community will currently let you assert, i.e. just current consensus"**
      *   **Rorty's Response:** **Accepts this only as a very rough simplification** of his "ethnocentric" view. He'd clarify:
          *   Truth is *not* defined as consensus; he endorses a **deflationary/disquotational view**: "S is true" just means S. There's no deep "nature" of truth to uncover.
          *   Justification *is* social and historical. What we are *justified* in asserting depends on our community's current norms and standards, which are fallible and contingent.
          *   He emphasizes that this community justification is *not arbitrary*; it's constrained by the world causally and by the need for coherence and usefulness. "Current consensus" oversimplifies the dynamic, ongoing, and often contentious process of justification.

  4.  **"it follows that there is no fact of the matter about anything"**
      *   **Rorty's Response:** **Flattly denies this.** For Rorty, "facts" are *true statements* within a vocabulary. There are plenty of facts ("Water is H₂O," "The model predicted outbreak X"). His point is that facts are *language-relative* – they depend on the vocabulary we use to describe the world. There is no vocabulary-independent "way the world is in itself" that adjudicates between vocabularies. The world is *causally* determinate, but *descriptions* of it are contingent.

  5.  **"no standpoint from which one culture's beliefs could be faulted by another"**
      *   **Rorty's Response:** **Accepts this only regarding a neutral, transcendental standpoint (e.g., "Reality," "Rationality").** He **denies** it means criticism is impossible. We criticize other cultures *from within our own ethnocentric standpoint*, using *our* values and standards, aiming to *persuade* them (or ourselves) of the benefits of adopting different beliefs/vocabularies. It's comparative, not foundational.

  6.  **"science is accordingly only one more genre of writing, with no special epistemic authority"**
      *   **Rorty's Response:** **Broadly accepts,** but with crucial nuance.
          *   He agrees science is a distinct human practice ("genre") with powerful methods, but **denies** it has unique *metaphysical* or *foundational* epistemic authority (e.g., privileged access to "Reality").
          *   Its authority is *pragmatic*: it's extraordinarily successful at prediction, control, and solving problems we care about. This pragmatic success *is* its authority, not a deeper representational accuracy.

  7.  **"inquiry converges on nothing at all"**
      *   **Rorty's Response:** **Accepts regarding convergence on "The Truth" or "Reality as it is in itself."** He **denies** it means inquiry doesn't converge on *useful, reliable beliefs and stable agreements* within communities. Inquiry converges on whatever beliefs best meet our evolving needs and desires within our historical context.

  8.  **"the position refutes itself, since the claim that no statement represents reality is either itself a claim about reality or else just another move in the language game"**
      *   **Rorty's Response:** **Denies this charge decisively.** He insists his claims are *not* metaphysical assertions about the *intrinsic* nature of reality or representation. They are *pragmatic recommendations*: urging us to *stop talking* about representation as a useful concept and to adopt a vocabulary focused on social justification and utility. It's a *therapeutic* move within the language game, not a paradoxical metaphysical claim. Critics repeating this charge typically fail to engage his deflationary and therapeutic intent.

  **Answers to Specific Queries:**

  *   **Committed to no fact of the matter?** **No.** Facts exist as true statements within vocabularies. There is no non-vocabulary-relative "matter of fact."
  *   **Variant of deflationism?** **Yes, explicitly so.** He endorses a disquotational view and rejects theories of truth (like correspondence) that posit a substantive property.
  *   **Denies world causes beliefs or only justifies them?** **Emphatically only denies the world *justifies* beliefs.** The world *causes* our beliefs ("the world can, once we have programmed ourselves with a language, cause us to hold beliefs" - PMN). Justification is always within a social context.
  *   **Ethnocentrism just relativism renamed?** **No.** Relativism typically holds "true for me vs. true for you." Rorty's ethnocentrism rejects this. He argues we *must* start from *our* current beliefs and standards (we have no other choice) to evaluate others, seeking *persuasion* and *solidarity*, not relativist indifference. It's normative commitment, not descriptive equivalence.

  **Survival of Blurb's Further Conclusions After Correction:**

  *   **Can a Rortyan criticize another culture?** **Yes, survives.** Criticism is possible and necessary, but it's *persuasive* and *comparative*, based on one's own ethnocentric standards and values, not appeal to a neutral Reality or Reason.
  *   **Can a Rortyan say one inquiry went better than another?** **Yes, survives.** "Better" means more successful by pragmatic standards: solving more problems, generating more useful predictions, increasing solidarity, reducing cruelty, fitting better with other beliefs we hold, etc. *Within a context*, convergence on stable agreement *is* convergence on "better."
  *   **Conclusions that collapse:** The notions that there is *no fact of the matter*, that beliefs are *not answerable* to anything beyond current whim, that criticism across cultures is *impossible*, and that the position is *self-refuting* all collapse under Rorty's actual views.

  **Critics' Established Points (vs. Merely Repeated):**

  *   Critics have effectively argued that Rorty's ethnocentric view struggles to provide *normative force* for criticizing *within* one's own community when consensus is harmful or wrong, or for motivating cross-cultural criticism beyond mere preference. The charge of *pragmatic incoherence* (if truth is justified belief, how can past "truths" be wrong?) has traction, though Rorty had responses.
  *   Critics have also established that his stark dismissal of science's unique *explanatory* power regarding the success of its methods (beyond just listing its practical successes) is a significant weakness. The self-refutation charge, however, is generally considered a misunderstanding by serious critics engaging his work.
