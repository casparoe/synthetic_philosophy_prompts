prompt: |-
  hey, so im a junior and I'm on the peer-review crew for my school's history club — before anyone submits an essay to the end-of-year thing (or to the contest a few of us enter), two or three of us read it and leave comments, and honestly the teacher mostly just reads what we wrote. we do like ten of these a week and we've got maybe five minutes each.

  this year everyone found out that germs and weather and volcanoes can be "historical actors" and now every single essay has the plague deciding stuff or a drought overthrowing a dynasty. some of that feels sharp and some of it feels like the lazy version where the volcano did everything and no human ever chose anything, and I definitly can't always tell which is which. my teacher's word for the bad version is "determinist", and his word for one specific bad move is "alibi" — like when an essay uses a drought as an alibi for a king who personally made three terrible calls in a row.

  I tried to invent my own rule and I want you to fix it or throw it out. I call it the swap test: if you swapped the germ, the drought, or the volcano for a different one of roughly the same size, would roughly the same thing still have happened? I think that's supposed to separate the cases where the non-human thing is just a generic trigger from the cases where it's doing specific work, but I'm not sure it does that and I think it breaks somewhere.

  what I actually need is a checklist the rest of the crew can run in five minutes without knowing any of the theory. Questions in order, what counts as a good enough answer to each, where the checklist just stops and says no, and where it has to hand the decision to a person because the question is about values and not facts. Keep my swap test if it survives and kill it if it doesn't, and be honest about which steps are judgment calls dressed up as procedure.

  then run it on three things: (1) my own essay, which argues the Black Death helped end serfdom because labor got scarce and peasants could suddenly demand wages — I want this one to pass, so be mean to it; (2) my friend's essay, which is basically "the Maya collapsed because of drought"; (3) something small or modern to check it doesn't overreach, like whether my little brother's alarm clock not going off "caused" him to miss the bus, or the 1815 Mount Tambora eruption and that cold messed-up summer people talk about.

  include at least one case where the procedure says no and I won't like the answer. and tell me what it can't do — I get that it can't tell me whether the plague really killed that many people, but what else should I not trust it for?
reasoning: |-
  Okay, the user is part of a peer-review crew for their school's history club. They need a quick checklist to evaluate essays that use non-human actors like plagues or droughts. The main issue is distinguishing between thoughtful analysis and lazy determinism where natural events are blamed without human agency. 

  First, I recall their teacher's terms: "determinist" for overly simplistic causation and "alibi" when non-human factors excuse human decisions. The user created a "swap test" but isn't sure it works. Their deeper need is a practical, time-efficient tool that doesn't require theory knowledge. 

  I need to assess the swap test. The idea is swapping similar events to see if outcomes change. It might identify if a factor is just a trigger (swap-invariant) vs. uniquely causal (swap-sensitive). But limitations exist—it struggles with unique events (like specific volcano eruptions) and might overlook context. For the checklist, I'll adapt it as Step 3 but with caveats. 

  Now, structuring the checklist: It should be sequential, with clear pass/fail points. Steps must be binary where possible to save time. Key elements: human agency (Step 1), specific mechanisms (Step 2), swap test (Step 3), alibi check (Step 4). Fail any step → red flag. 

  For the test cases: 
  1. User's Black Death essay: Should pass but needs scrutiny. Labor scarcity enabled peasant demands—human choices matter. Swap test works here (other plagues similar). 
  2. Maya drought essay: Likely fails. Often presented monolithically; needs more on political/social fragility. 
  3. Alarm clock & Tambora: Small case shows procedure's scope (alarm clock fails Step 1; Tambora passes Step 2/3). 

  Including a case the user won't like: Maybe the Maya example, where the checklist flags determinism despite common narratives. 

  What the checklist can't do: 
  - Judge factual accuracy (e.g., death tolls). 
  - Handle complex interplays without clear thresholds. 
  - Replace nuanced debate when factors are equally weighted. 
  - Assess originality or writing quality. 

  Finally, wording matters: Use accessible language, avoid jargon. Emphasize that Steps 1/4 are strict; others allow some judgment but with guidelines. The goal is to catch obvious determinism fast, not resolve all historical debates.
answer: |-
  Here's a battle-tested, 5-minute checklist based on your core insights and your teacher's concepts, designed for practical peer review. **The Swap Test survives, but with a crucial refinement and positioned after more critical checks.**

  **The Determinism & Alibi Detection Checklist (5-Minute Version)**

  1.  **HUMAN AGENCY CHECK: "Who made the key decisions?"**
      *   **Question:** Does the essay clearly identify *specific human actors* (individuals, groups, institutions) and the *deliberate choices* they made in response to the non-human event?
      *   **Good Enough:** Names actors (e.g., "landlords," "King X's council," "merchant guilds") and describes *what they actually did* (e.g., "raised rents," "fled the city," "passed Statute Y," "refused to negotiate," "blamed Group Z").
      *   **Bad:** Vague actors ("society," "the government") or passive voice ("serfdom was weakened," "the dynasty was overthrown") without specifying *who* acted *how*.
      *   **Stop & Flag (RED):** If NO significant human actors/choices are identified *in direct response* to the non-human factor. (Fail - Deterministic)
      *   **Judgment Call:** Low. This is foundational. If missing, it's almost certainly determinist.

  2.  **MECHANISM CHECK: "How exactly did 'X' cause 'Y'?"**
      *   **Question:** Does the essay explain the *specific chain of events or social processes* linking the non-human factor (Plague, Drought, Volcano) to the human outcome? Is it more than just "X happened, then Y happened"?
      *   **Good Enough:** Describes a plausible, step-by-step connection (e.g., "Drought -> crop failure -> famine -> peasant unrest -> increased banditry -> noble infighting -> weakened central authority -> collapse").
      *   **Bad:** Asserts causation without mechanism ("The drought *caused* the collapse").
      *   **Stop & Flag (RED):** If the mechanism is completely missing or implausibly direct/simple (e.g., "The volcano erupted, so the dynasty fell"). (Fail - Deterministic)
      *   **Judgment Call:** Low-to-Medium. The *existence* of a plausible mechanism is key. The *quality* of the evidence for it is a separate issue (beyond the checklist's scope).

  3.  **THE SWAP TEST (Refined): "Was THIS specific 'X' essential?"**
      *   **Question:** If you swapped this *exact* non-human event (e.g., the *Black Death*) for a *different but similarly severe event of the same broad type* (e.g., a *different catastrophic plague* or *massive famine*), would the *core human outcome and process* likely have been *significantly different*?
      *   **Good Enough (Passes Swap Test):** "No, a similarly devastating plague/famine/etc. would likely have triggered similar labor scarcity/peasant demands due to the *existing social structure*." OR "Yes, *this specific* drought pattern uniquely undermined the Maya's *specific* water storage methods."
      *   **Bad (Fails Swap Test):** The non-human factor seems interchangeable; it's just a generic trigger. The essay doesn't show why *this specific* plague/drought/eruption mattered uniquely.
      *   **Flag (YELLOW):** If the Swap Test fails. This *doesn't automatically fail the essay*, but it strongly suggests the non-human factor isn't being analyzed deeply enough. It might just be scenery. *Requires moving to Step 4.*
      *   **Judgment Call:** Medium. Requires thinking about alternative scenarios and the specific context. The key is whether the *essence* of the outcome/process changes with a swap.

  4.  **ALIBI CHECK: "Is 'X' covering for someone/something?"**
      *   **Question:** Does the essay use the non-human factor primarily to *excuse*, *downplay*, or *absolve* human actors/groups/systems of responsibility for bad outcomes or poor decisions that were *within their control*? (Your teacher's "Alibi")
      *   **Good Enough:** The non-human factor is presented as a *challenge* or *context* that humans *responded to* (well or poorly). Human agency remains central.
      *   **Bad:** Blames the outcome *primarily* or *entirely* on the non-human factor, ignoring or minimizing avoidable human errors, systemic flaws, or malicious intent (e.g., "The drought *made* the king's terrible decisions unavoidable").
      *   **Stop & Flag (RED):** If the non-human factor is used explicitly or implicitly as the *primary excuse* for human actions/inactions that clearly contributed negatively to the outcome. (Fail - Alibi Determinism)
      *   **Judgment Call:** Medium-High. Requires identifying *what was within human control* and assessing if the essay unfairly shifts blame. Context is crucial.

  **Procedure Flow for Reviewers:**

  1.  **Start with Step 1 (Human Agency).** If FAIL (RED), stop. Essay is likely determinist. Comment: "Who specifically made key decisions in response to X? Human choices are missing."
  2.  **Proceed to Step 2 (Mechanism).** If FAIL (RED), stop. Essay is likely determinist. Comment: "How exactly did X lead to Y? The steps connecting them are missing/too vague."
  3.  **Proceed to Step 3 (Swap Test).** If PASS, move to Step 4. If FAIL (YELLOW), note: "The specific nature of X doesn't seem crucial; it acts more like a generic trigger. Is its unique role explained?" *Then proceed to Step 4.*
  4.  **Proceed to Step 4 (Alibi Check).** If PASS, the essay *likely passes* the determinism/alibi hurdle. If FAIL (RED), stop. Essay is likely using X as an alibi. Comment: "Does X unfairly excuse specific human mistakes/systems (e.g., King's bad calls, fragile institutions) that contributed?"
  5.  **Passed Steps 1, 2, and 4?** The essay has avoided the major pitfalls. (A YELLOW in Step 3 warrants a comment but isn't fatal).

  ---

  **Testing the Checklist**

  **1. Your Essay (Black Death & End of Serfdom)**
  *   **Step 1 (Agency):** PASS. Identifies actors: Peasants *demanding* wages, landlords *resisting* but eventually *granting* concessions/manumission, rulers *passing* laws (like Statute of Labourers, even if to resist).
  *   **Step 2 (Mechanism):** PASS. Clear mechanism: Plague -> Labor Scarcity -> Increased Peasant Bargaining Power -> Demands/Resistance -> Landlord Concessions/Legal Changes.
  *   **Step 3 (Swap Test):** PASS. A similarly catastrophic mortality event (another plague, massive war casualties) would likely have caused similar labor scarcity and pressure on the *existing* feudal structure. The Black Death wasn't uniquely essential in *this specific argument*. (Survives the test!).
  *   **Step 4 (Alibi):** PASS. The plague is a catalyst/context, not an excuse. The essay focuses on *how humans reacted* within the system (peasants seizing opportunity, landlords adapting/being forced). It doesn't absolve lords of resisting or kings of trying to enforce old norms.
  *   **VERDICT:** PASSES checklist. Good analysis!

  **2. Friend's Essay ("Maya Collapsed because of Drought")**
  *   **Step 1 (Agency):** LIKELY FAIL (RED). If it's *just* "drought caused collapse," it probably doesn't name specific rulers, factions, decisions made *in response* to drought (e.g., failed water management policies, wars over resources, elite abandonment). *Stop here.* Deterministic.
  *   *(If it squeaks past Step 1)* **Step 2 (Mechanism):** LIKELY WEAK/FAIL. "Drought -> Collapse" is usually too simple. A good pass needs steps like: Drought -> Crop Failure -> Famine -> Peasant Unrest/Abandonment -> Breakdown of Tribute System -> Elite Conflict/Abandonment -> Political Fragmentation/Collapse. If missing, FAIL.
  *   *(If miraculously passes 1 & 2)* **Step 3 (Swap Test):** FAIL (YELLOW). A similarly severe drought wouldn't necessarily collapse *every* complex society. The Maya region experienced droughts before. Why was *this* period uniquely vulnerable? (Requires Step 4).
  *   **Step 4 (Alibi):** HIGH RISK. Often, framing drought as *the* cause absolves Maya elites/society of potential roles: over-exploitation of environment, rigid social hierarchy hindering adaptation, incessant warfare draining resources, failure to adapt water management. **VERDICT:** LIKELY FAILS (Red at Step 1 or 2, or Yellow at 3 + Risk at 4). Classic determinism/alibi potential.

  **3a. Little Brother's Alarm Clock ("Caused" him to miss the bus)**
  *   **Step 1 (Agency):** FAIL (RED). The alarm clock is the "actor"? The human actor is *your brother*. His choices: Did he set it? Relied solely on it? Hit snooze? Have a backup plan? Walk slowly? If the essay blames *only* the clock, human agency is missing. **VERDICT:** FAIL. Deterministic (Clock did it!). Alibi for brother.

  **3b. 1815 Mount Tambora Eruption -> "Year Without a Summer" -> Social Effects**
  *   **Step 1 (Agency):** PASS. Actors: Governments (responding to famine? Relief efforts?), Farmers (changing crops? migrating?), Scientists (observing/clueless?), Inventors (spurred innovation?).
  *   **Step 2 (Mechanism):** PASS. Clear mechanism: Eruption -> Stratospheric Aerosols -> Global Cooling -> Crop Failures -> Famine/Price Spikes -> Migration/Unrest/Potential Policy Changes/Cultural Shifts (e.g., Gothic literature).
  *   **Step 3 (Swap Test):** PASS/FAIL? (YELLOW). *A* massive equatorial volcanic eruption would cause *similar* global cooling effects. Tambora's *specific* location/size maximized impact, but the *type* of event is key. However... *Why Tambora?* Its scale made effects uniquely severe/duration in the 19th-century context. **Judgment Call:** Passes if the essay focuses on *volcanic winter* generally; Yellow if it insists *only Tambora specifically* caused the effects without noting the mechanism works for large eruptions.
  *   **Step 4 (Alibi):** PASS. The eruption is a clear, massive external shock. The essay examines *human resilience, failure, and adaptation* to this undeniable event (e.g., government responses good/bad, social suffering). It doesn't absolve humans; it shows them coping with a crisis beyond normal control.
  *   **VERDICT:** PASSES checklist (assuming reasonable Step 3 handling).

  **The Case You Won't Like (Implied by Maya Test):**
  *   **"The Dust Bowl caused the Great Migration."**
      *   **Step 1 (Agency):** PASS. Identifies African American farmers/sharecroppers *choosing* to migrate.
      *   **Step 2 (Mechanism):** PASS. Dust Bowl -> Farm Destruction/Economic Ruin -> Push Factor for Migration. *But...*
      *   **Step 3 (Swap Test):** FAIL (YELLOW). Was the Dust Bowl *essential*? Similar migration patterns existed before (Great Migration began pre-Dust Bowl) driven by Jim Crow, violence, economic opportunity in the North, WWI labor demand. The Dust Bowl was a powerful *accelerant* in specific regions, but arguably interchangeable with other severe economic/environmental disasters for the *general trend* of migration. A different regional disaster might have pushed similar groups out.
      *   **Step 4 (Alibi):** **HIGH RISK (Potential RED).** This is the critical point. Framing the Dust Bowl as *the* cause can act as an **alibi** for the pervasive, systemic racism (Jim Crow laws, sharecropping exploitation, Klan violence, lack of protection) that was the *fundamental driver* making life in the South untenable and the North attractive *regardless* of the Dust Bowl. The Dust Bowl was a trigger on an existing tinderbox. An essay focusing *solely* on the Dust Bowl absolves white supremacy and systemic injustice of their primary responsibility.
      *   **VERDICT:** Likely **FAILS Step 4 (Alibi)**. Using the environmental disaster as the primary cause acts as an alibi for racism.

  **What the Checklist CANNOT Do (Limitations):**

  1.  **Assess Factual Accuracy:** It assumes the non-human event happened and had *some* impact. It can't verify death tolls, drought severity, or eruption size.
  2.  **Judge the Relative Weight of Factors:** It flags determinism (non-human as *sole* or *primary-alibi* cause) but can't decide if an essay *correctly* argues non-human factors were 60% vs. 40% responsible vs. human choices. That's deep historical debate.
  3.  **Evaluate Nuance within Human Agency:** It checks *if* agency is present, not how well the *motivations*, *constraints*, or *complexity* of human decisions are analyzed.
  4.  **Handle Perfect Interdependence:** Sometimes an event is so unique (e.g., *specific* pathogen virulence + *specific* societal vulnerabilities) that the Swap Test feels unfair. The checklist flags this (Yellow in Step 3) for human review.
  5.  **Assess Quality of Evidence:** It checks for the *presence* and *plausibility* of mechanisms and agency, not the *strength of the sources* supporting them.
  6.  **Account for Unforeseeability:** In the alarm clock case, a *catastrophic, unforeseeable* failure might lessen brother's blame (still some agency - backup plans?). The checklist leans against using it as an *alibi*.
  7.  **Replace Final Judgment:** It's a filter for major red flags. A passed checklist doesn't guarantee a *great* essay, just that it avoids determinism/alibi pitfalls. A failed Step 3 (Yellow) or complex Step 4 needs human thought.

  **Summary:** This checklist prioritizes **Human Agency** and **Specific Mechanisms** as non-negotiable first steps. The **Swap Test** (Step 3) is a useful tool to probe if the *specific* non-human factor is doing unique analytical work or is just a generic trigger, triggering a closer look at **Alibi Potential** (Step 4). It's designed for speed, catching the most common determinism and alibi errors your crew is facing. Use it ruthlessly! Good luck with the peer reviews.
