  Below is a comprehensive game design for your 90-minute session, including a payoff table, test descriptions, a minute-by-minute timeline, materials, roles, debriefing notes, anticipated issues, and limitations. The activity is structured to first illustrate Good's theorem through experiential learning and then disrupt it by changing decision rules.

  ---

  ### **Decision Context: Beach Closure Due to Pollution**
  **Binary Decision:**  
  - **ACT A:** Close the beach  
  - **ACT B:** Keep the beach open  

  **States of the World:**  
  - **STATE 1:** Pollution spike occurs (POLLUTED)  
  - **STATE 2:** No pollution spike (CLEAN)  

  **Payoff Table** (in "public health points," scaled for simplicity):  
  | State/Act       | Close Beach (A) | Keep Open (B) |  
  |-----------------|-----------------|---------------|  
  | **POLLUTED**   | -10             | -100          |  
  | **CLEAN**      | -20             | 0             |  

  **Prior Probability:**  
  - P(POLLUTED) = 0.25  
  - P(CLEAN) = 0.75  

  **Expected Values Without Test:**  
  - **Act A (Close):** (0.25 × -10) + (0.75 × -20) = -2.5 - 15 = **-17.5**  
  - **Act B (Keep Open):** (0.25 × -100) + (0.75 × 0) = -25 + 0 = **-25**  
  *Optimal decision without test: **Close Beach (A)**, expected utility = -17.5.*

  ---

  ### **Tests for Purchase**
  Teams start with **50 points** and buy tests (cost deducted from endowment). Payoffs from the decision are added to the remaining points. Final score = Endowment - Test costs + Decision payoff.  
  **Tests available:**  

  1. **Free Water Clarity Test (Free, Accurate but Worthless)**  
     - Cost: 0 points  
     - Accuracy: Sensitivity = 0.9, Specificity = 0.9  
     - **Why worthless?** Posterior probabilities:  
       - If POSITIVE (suggests POLLUTED): P(POLLUTED|POS) ≈ 0.6 → Act A remains optimal (E[utility] = -16.3).  
       - If NEGATIVE (suggests CLEAN): P(POLLUTED|NEG) ≈ 0.03 → Act A still optimal (E[utility] = -18.5).  
       - Expected value with test: **-17.5** (same as without test). Value = 0.  

  2. **Expensive Lab Test (Costly, Coarse but High Value)**  
     - Cost: 15 points  
     - Accuracy: Sensitivity = 0.6, Specificity = 0.6  
     - **Why high value?** Changes decision on POSITIVE result:  
       - If POSITIVE: P(POLLUTED|POS) ≈ 0.33 → Act A optimal (E[utility] = -18.3).  
       - If NEGATIVE: P(POLLUTED|NEG) ≈ 0.19 → **Act B (Keep Open) becomes optimal** (E[utility] = **-19** vs. -21.5 for A).  
       - Expected value with test: **-18.6** → Value = -18.6 - (-17.5) = **1.1 points** (worth buying if cost < 1.1).  

  3. **Basic Sensor Test (Dominated by another test)**  
     - Cost: 8 points  
     - Accuracy: Sensitivity = 0.7, Specificity = 0.7  
     - **Why dominated?** Less accurate and more expensive than the **Precision Sensor Test** below.  

  4. **Precision Sensor Test (Dominates Basic Sensor)**  
     - Cost: 5 points  
     - Accuracy: Sensitivity = 0.8, Specificity = 0.8  
     - Expected value with test: **-17.2** → Value = 0.3 points.  
     - *Dominates Basic Sensor (higher accuracy, lower cost, higher value).*  

  5. **Screening Test (Noisy Indicator for Lab Test)**  
     - Cost: 2 points  
     - Accuracy: Sensitivity = 0.75, Specificity = 0.65 (correlates with Lab Test)  
     - **Why interesting?** Screens for whether Lab Test would return POSITIVE. Value alone = 0.1 points. When combined with Lab Test, value is not additive (see debrief).  

  ---

  ### **Materials & Roles**  
  - **Handouts:** Payoff table, test descriptions, prior probability, and calculation worksheets.  
  - **Test Results Generator:** Spreadsheet (you) that simulates test outcomes using random numbers.  
  - **Roles:**  
    - **Facilitator (you):** Runs the test market, generates results, scores rounds.  
    - **Teams:** 4 groups of 5 students. Each decides which tests to buy and final action.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Phase 1: Good's Theorem in Action (45 mins)**  
  - **0–5 mins:** Introduce the beach closure decision. Review payoff table and prior.  
  - **5–15 mins:** Teams calculate expected utility without tests. Confirm optimal act is A (Close).  
  - **15–20 mins:** Explain test market (tests available, costs, endowment).  
  - **20–35 mins:** **Round 1:** Teams spend endowment on tests. You provide results (e.g., "Team 1: Lab Test = NEGATIVE, Screening Test = POSITIVE").  
  - **35–45 mins:** Teams decide final action (A or B) and report. You calculate scores.  

  **Phase 2: Breaking the Premise (25 mins)**  
  - **45–50 mins:** Change rules: "Teams must commit to a decision rule *before* seeing test results (e.g., 'If Lab=POS, then A; else B'). No re-optimizing."  
  - **50–60 mins:** **Round 2:** Teams buy tests and pre-commit to rules.  
  - **60–65 mins:** You provide results, apply pre-committed rules, and score.  
  - **65–70 mins:** Compare scores to Round 1. Highlight tests that lost value (e.g., Lab Test).  

  **Debrief (20 mins)**  
  - **70–75 mins:** Elicit student observations ("Which tests were valuable? Why did others fail?").  
  - **75–85 mins:** Map game to theorem:  
    - **Value from decision change:** Lab Test valuable only because NEGATIVE changes action.  
    - **Value denomination:** Lab Test value (1.1) < cost (15) → not worth buying.  
    - **Premise of re-optimization:** In Round 2, Lab Test loses value because teams can’t adapt.  
    - **Accuracy ≠ value:** Free Test accurate but valueless; Screening Test crude but valuable if paired.  
  - **85–90 mins:** Name Good’s theorem and value of information.  

  ---

  ### **Anticipated Issues & Solutions**  
  1. **Bidding for accuracy:** Teams overpay for accurate tests (e.g., Free Test).  
     - *Solution:* After Round 1, ask: "Did high accuracy always yield high value?"  

  2. **Treating free as automatically valuable:** Teams take Free Test despite zero value.  
     - *Solution:* In debrief, contrast its accuracy with value.  

  3. **Under-updating on noisy results:** Teams ignore Screening Test results.  
     - *Solution:* Provide a worksheet to calculate posteriors.  

  4. **Cornering the market:** One team buys all copies of a test.  
     - *Solution:* Limit tests to 1 per team.  

  5. **Hypothesis-testing mindset:** Public-health students fixate on statistical significance.  
     - *Solution:* Emphasize, "This is about decisions, not inferential statistics."  

  ---

  ### **What’s Lost in Translation**  
  1. **Single-agent prior vs. multiple priors:** Good’s theorem uses one prior. Students have heterogeneous beliefs, and seeing others’ results breaks the "private information" assumption.  
     - *Mitigation:* Use identical priors and information.  

  2. **Expectation over prior:** The theorem is an expectation, but students see one realized outcome.  
     - *Mitigation:* Clarify in debrief that value is probabilistic (e.g., "In many runs, Lab Test averages 1.1 points").  

  3. **Linear utility:** The theorem assumes linear utility, but students may perceive non-linearities with points.  
     - *Mitigation:* Use small point values to approximate linearity.  

  4. **Perfect updating:** Students may miscalculate posteriors.  
     - *Mitigation:* Provide a Bayesian updating cheat sheet.  

  ---

  ### **Key Takeaways for Students**  
  - A test’s value comes from its power to change decisions, not accuracy.  
  - Value is in the same units as payoffs (e.g., 1.1 points), so compare to cost.  
  - The "free improvement" guarantee fails if you can’t re-optimize after seeing results.  
  - Pairing tests (e.g., Screening + Lab) may not yield additive value.  

  This design ensures students experientially discover the theorem’s insights. The concrete context, forced trade-offs, and rule change in Phase 2 create memorable "aha!" moments.
