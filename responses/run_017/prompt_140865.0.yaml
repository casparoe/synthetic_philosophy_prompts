prompt: |-
  I'm in a final-year seminar on blame and accountability, and this week's session was on hypocrisy. Our section leader leaned hard on an analogy I have been turning over since, and I would like it audited properly before I build a paper on it.

  The analogy is that moral blame is like a civil action. On her telling, to blame someone is to bring a claim against them: the blamer needs standing in roughly the legal sense, meaning a particularized injury traceable to the person she is addressing, and even a blamer with standing can be barred, because a court of equity refuses relief to a plaintiff who comes to it with dirty hands — you cannot invoke a norm you are yourself flouting. She uses the analogy to carry a strong conclusion, namely that a hypocrite's blame is not merely impolite or unpersuasive but infelicitous: it makes no claim on the person addressed, that person may set it aside entirely, and nothing is left over — no reason to reconsider, no reason to feel anything, no residue of accountability.

  A classmate objected that the analogy imports the very thing in dispute. Legal standing, he said, is a jurisdictional gate on a scarce public resource: it decides who may set the coercive apparatus of the state in motion, and, at least in its American form, it exists to keep courts from being used to air undifferentiated grievances. Blame is address between persons who are, on the account she is giving, one another's equals: no adjudicator, no docket, no remedy to allocate, no sovereign. So whatever work standing does in the moral case, it cannot be that. She replied that the gatekeeping rationale is inessential; what carries over is the structural point that whether a claim against you can be pressed at all can depend on facts about the claimant and not only on the content of the claim.

  I want more than a verdict on that exchange. Please lay out the full correspondence table first: what plays the role of the plaintiff, the injury in fact, the cause of action, the court, the remedy, the affirmative defense, and the requirement, in the doctrine she is borrowing, that the plaintiff's misconduct concern the same subject matter as the suit. Note in passing that the doctrine is discretionary and is weighed against other considerations, and that it is a defense to relief rather than a finding that the underlying claim is false.

  Then sort the disanalogies into the ones that actually bite on her conclusion and the ones that are decorative. Three I cannot settle myself:

  First, two people both guilty of the same kind of thing. In law the defense is available to whichever of them is the defendant, so each is barred against the other, and there is still a prosecutor or a different, clean plaintiff to vindicate the norm. Morality has no party who stands outside the practice. So if blame forfeits standing whenever the blamer is compromised, the norm loses every enforcer it has and the worst offenders end up in a zone of mutual impunity. Is that a genuine consequence of the analogy, or am I misreading it?

  Second, the confessing hypocrite: someone who did the thing, is still doing it, but has owned it publicly and is trying to stop. Equity looks backward at conduct; blame seems to respond to where the blamer now stands with respect to the norm. If acknowledgment cures in one case and not the other, then the two are tracking different kinds of condition, a historical bar versus a present relational one.

  Third, whether the analogy quietly settles a question it was brought in to help answer: the same-subject-matter restriction would make forfeiture norm-specific, but the intuitive case for taking hypocrisy seriously is often norm-general.

  Finally: does the strong conclusion survive, and if the litigation model is the wrong one, what would be a better analogy — appealing to the rules of a practice one is currently playing, a demand among equals, a request within an ongoing relationship? Please argue from the structure of the cases rather than from what is supposed to have been said in the literature.
reasoning: |-
  Okay, the user is in a seminar on blame and accountability, focusing on hypocrisy. Their section leader used a legal analogy comparing moral blame to a civil action. The user wants a detailed audit of this analogy before building a paper on it. They need a correspondence table mapping legal concepts to moral blame, then an analysis of key disanalogies, and finally whether the strong conclusion holds.

  First, I need to lay out the full correspondence table as the user requested. The analogy positions the blamer as the plaintiff, the moral injury as the injury in fact, the violated norm as the cause of action, the audience as the court, etc. I should note all these elements clearly, including that the unclean hands doctrine is discretionary and doesn't negate the claim's truth.

  Now for the disanalogies that actually bite. The user has three main concerns. First is the mutual impunity problem: if two wrongdoers blame each other, both lack standing, leaving no one to enforce the norm. This directly challenges the analogy's practical viability. Second is the confessing hypocrite - equity looks backward while blame seems relational and present-focused. If acknowledgment cures hypocritical standing in blame but not in law, that's a structural difference. Third is the norm-specific vs norm-general issue. The unclean hands doctrine requires same-subject misconduct, but our moral intuition about hypocrisy often applies even if the blamer violated different norms. This discrepancy questions whether the analogy captures why hypocrisy matters morally.

  I should evaluate whether these disanalogies undermine the section leader's strong conclusion that hypocritical blame is infelicitous. The mutual impunity problem seems most damaging - it makes the system unstable. The confessing hypocrite point suggests blame cares about current normative commitment rather than past acts. And the norm-specificity issue reveals the analogy might smuggle in contested assumptions.

  For alternatives, I'm considering practices like games (where active participation matters), demands among equals (focusing on relational authority), or requests in relationships (which can be voided by insincerity). The game analogy handles mutual accountability better, while the demand model explains why standing depends on reciprocal recognition.

  The strong conclusion doesn't fully survive - while hypocrisy may weaken blame, calling it "infelicitous" overreaches. The legal analogy is useful structurally but can't bear all the weight placed on it. I'll recommend blending models: perhaps demands for games plus something about normative community membership.
answer: |-
  Here's a full audit of the civil litigation analogy for moral blame, structured as requested:

  **Correspondence Table: Civil Litigation ↔ Moral Blame**

  | Legal Concept            | Role in Analogy                   | Key Notes on Doctrine                                                                 |
  | :---------------------- | :-------------------------------- | :------------------------------------------------------------------------------------ |
  | **Plaintiff**           | The Blamer                        | Initiates the action/seeks redress.                                                   |
  | **Injury in Fact**      | Particularized Moral Injury/Harm  | Harm traceable *to the blamee* that affects the blamer (e.g., betrayal, broken promise). Not generalized grievance. |
  | **Cause of Action**     | The Violated Norm                 | The specific moral rule or obligation the blamee is accused of violating.             |
  | **Court**               | The Audience/Addressee            | The person(s) to whom blame is addressed (often the blamee, sometimes a community). They "adjudicate" the claim's force. |
  | **Remedy**              | Moral Response (e.g., apology, remorse, amends) | The desired outcome of blame: acknowledgment, repair, change. Not state coercion. |
  | **Affirmative Defense** | Defense Against Blame's Force     | Reasons the blamee can offer to deflect the *force* of the blame (e.g., excuse, justification). |
  | **Unclean Hands Doctrine** | Hypocrisy as Standing Bar        | **Crucial Element:** Doctrine that a court may deny relief *even if the claim is valid* because the plaintiff acted unethically regarding the *same subject matter*. |
  | **Subject Matter Requirement** | Same-Norm Violation            | Analogy requires the blamer's hypocrisy to involve flouting the *very same norm* they are invoking against the blamee. |
  | **Discretionary Bar**   | Contextual Force of Blame         | Hypocrisy doesn't *automatically* make the underlying claim false; it *may* deprive *this blamer's* specific invocation of its force/receptibility. |
  | **Jurisdictional Gate** | Standing Requirement              | Analogy posits "standing" as a prerequisite for the blamer's claim to be "heard" or have normative force *for this blamee*. |

  **Analysis of Key Disanalogies & Their Bite:**

  1.  **Mutual Impunity / Lack of External Prosecutor:**
      *   **The Problem:** If A and B both violate Norm X, and hypocrisy bars standing, then A cannot effectively blame B *and* B cannot effectively blame A. With no external "prosecutor" (like the state), Norm X appears unenforceable. Widespread violation creates a zone of mutual impunity for the worst offenders.
      *   **Does it Bite? YES, SIGNIFICANTLY.** This strikes directly at the analogy's *practical viability* and its implications for a *functional* moral community. It risks making accountability contingent on prior blamelessness, potentially paralyzing moral discourse among flawed agents. The analogy struggles to explain how norms gain traction when *everyone* is potentially compromised relative to *some* norm. This is a major challenge to the "no residue" conclusion – mutual impunity seems intolerable, suggesting *some* force *must* remain even from hypocritical blame.
      *   **Analogy's Response (Weak):** The analogy might suggest "clean" third parties could blame *both* A and B. However, this requires finding someone genuinely innocent regarding Norm X, which may be impossible for widespread norms or in small communities. It also undermines the *particularized injury* aspect central to the analogy – why does a third party have standing? This disanalogy highlights the *collective* and *relational* nature of morality vs. the *adversarial* and *state-backed* nature of law.

  2.  **The Confessing Hypocrite (Temporal/Relational Focus):**
      *   **The Problem:** Equity looks *backward* at past misconduct related to the suit. Blame seems sensitive to the blamer's *current* stance. If someone acknowledges their past violation of Norm X, expresses remorse, and is striving to change, does their blame of another for violating Norm X still lack standing?
      *   **Does it Bite? YES, MODERATELY.** This reveals a potential difference in the *nature of the bar*. The legal doctrine is primarily *historical* and *conduct-based*. The moral intuition seems more concerned with *current sincerity*, *integrity*, and *relational authority*. If acknowledgment and repentance "cure" the standing defect in the moral case (making the blame *potentially* forceful again) but not in the legal case (where past misconduct still triggers unclean hands), the analogy is tracking different things. This weakens the claim that the analogy captures the *core* reason hypocrisy undermines blame – it might be more about present insincerity/lack of credibility than past identical sin.

  3.  **Norm-Specificity vs. Norm-Generality:**
      *   **The Problem:** Unclean hands requires misconduct in the *same subject matter* as the suit. The intuitive moral force of hypocrisy often seems broader – e.g., a philanderer blaming dishonesty might lack standing, even if the norms are different ("be faithful" vs. "be honest"), because their overall integrity is compromised.
      *   **Does it Bite? YES, SIGNIFICANTLY.** This disanalogy questions whether the analogy smuggles in an *unjustified restriction*. The section leader uses the analogy to support the strong conclusion, but the analogy *itself* imposes a "same-norm" limit that many find too narrow for the moral phenomenon. If our moral intuition is that *gross* hypocrisy on *any* serious norm undermines one's standing to blame *any* serious violation (a norm-general view), then the analogy fails to capture the full intuitive case for hypocrisy's impact. It potentially *understates* the problem the analogy was meant to explain.

  **Other Disanalogies (More Decorative):**

  *   **Scarcity/State Coercion:** The classmate's point. While the *rationale* for legal standing (resource allocation, preventing frivolous suits, limiting state power) differs, the *structural point* about claimant-dependent barriers to pressing a claim can still hold in the moral sphere without those rationales. This doesn't directly undermine the core analogy about the *effect* of hypocrisy.
  *   **Formality/Procedure:** Legal proceedings are highly formalized; blame is informal and varied. This affects application but not the core structural parallel of "claimant makes a normative demand whose force depends on meeting preconditions."
  *   **Remedies:** Legal remedies are enforceable decrees; moral "remedies" (apology, remorse) are not coercively enforced. This is a difference in consequence, not necessarily in the logic of making the claim itself.

  **Does the Strong Conclusion Survive?**

  *   **Partially, but Weakened and Qualified.** The analogy *successfully* illustrates that the *force* or *receptibility* of blame *can* depend on features of the blamer (like hypocrisy) and not just the truth of the claim against the blamee. Hypocrisy *can* genuinely undermine the blamer's authority or "standing" to *effectively* press the claim *with this blamee*.
  *   **However, the "No Residue/Infelicitous" Conclusion is Overstated:**
      *   The Mutual Impunity problem suggests *some* normative residue *must* exist (the underlying wrongness doesn't vanish; third parties or even the blamee's own conscience might still recognize it).
      *   The Confessing Hypocrite suggests the bar might be relational and curable, not a permanent historical stain.
      *   The Norm-Generality intuition suggests the bar might be broader than the analogy allows.
  *   **Revised Conclusion:** A hypocrite's blame (especially concerning the *same norm*) is often **morally disarmed** or **relationally void** *in its immediate address to the blamee*. The blamee may justifiably dismiss *that particular demand coming from that particular blamer* as lacking normative authority. However, this does **not** mean:
      1.  The underlying claim about the blamee's wrongdoing is false.
      2.  The blamee has no reason whatsoever to reconsider their action (their own conscience, others' blame, the inherent wrongness remain).
      3.  The norm loses all enforceability (others, or the blamee themselves, can still engage with it).
      4.  The hypocrite's blame *never* has any indirect effect (e.g., prompting reflection, alerting others).

  **Better Analogies: Arguing from Structure**

  1.  **The Rules of a Game (While Playing):**
      *   **Structure:** Players mutually commit to rules defining the practice. A player who is *currently* violating a rule (e.g., a soccer player handling the ball) lacks the *position* to authoritatively call a foul on another player *for that same type of violation* (handling). Their call is "void" – it doesn't trigger the expected consequence (free kick). Others (referee, clean players) can still make valid calls. The violation must be *relevant* to the call (handling vs. handling, not handling vs. offside).
      *   **Why Better?** Captures the *practical*, *participatory* nature of morality among equals. Focuses on *current* participation and adherence within the practice. Explains mutual impunity (if both handle, neither can call it on the other, but the *referee* - analogous to communal norms/conscience - still exists). Explains how reform (stopping handling) restores calling authority. Allows for norm-specificity (only relevant violations void calls).

  2.  **A Demand Among Equals within a Normative Community:**
      *   **Structure:** Blame is a demand for normative recognition and repair addressed to a fellow member of a community bound by shared standards. The authority to make such a demand depends partly on one's own recognition of and adherence to those *same* standards. Hypocrisy demonstrates a failure of reciprocal recognition – you demand adherence to a norm you yourself flout, violating the reciprocity essential to the community of equals. The addressee can reject the *demand's authority* ("You don't get to demand that *of me* right now") without denying the norm's validity.
      *   **Why Better?** Directly addresses the relational, reciprocal equality central to the classmate's objection. Explains why hypocrisy undermines *authority* rather than truth. Focuses on the *present relationship* and mutual accountability. Explains residue (the norm still binds; the demand might be valid if made by another). Allows for the Confessing Hypotrite (genuine repentance restores reciprocal standing).

  3.  **A Sincere Request within an Ongoing Relationship:**
      *   **Structure:** Blame is akin to a serious request (e.g., "Please keep your promise") within a relationship defined by mutual expectations. The *sincerity* and *integrity* of the requester are crucial for the request to carry normative weight. A hypocritical request ("Keep your promise!" from someone who constantly breaks theirs) lacks sincerity regarding the *value* of the norm. It feels like manipulation or bad faith, voiding its claim on the addressee's compliance. The underlying *need* (e.g., for reliability) may still exist.
      *   **Why Better?** Highlights the role of *sincerity* and *integrity* over mere historical conduct. Explains the intuitive "why should I listen to *you*?" reaction. Fits the norm-generality intuition (gross insincerity in one area undermines trust generally). Accounts for the possibility of repair through changed behavior and apology.

  **Conclusion:** The civil litigation analogy usefully highlights that blame's *force* can depend on the blamer's relation to the norm. However, its legalistic baggage (especially same-subject-matter, historical focus, external enforcement) leads to problematic conclusions like mutual impunity and struggles with reform. **The "strong conclusion" (hypocritical blame is infelicitous, leaves no residue) is unsustainable.** Better analogies come from practices of **mutual accountability among participants (Game)**, **reciprocal demands within a community of equals (Demand)**, or **sincere address within relationships (Request)**. These better capture the relational, reciprocal, and integrity-based reasons why hypocrisy undermines blame's immediate authority, while preserving the underlying norm's validity and the potential for other forms of accountability. Focus your paper on developing one of these alternative analogies or a synthesis, explicitly addressing how it resolves the problems inherent in the litigation model.
