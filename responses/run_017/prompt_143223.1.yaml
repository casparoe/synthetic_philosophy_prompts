prompt: |-
  I am helping draft the terms of reference for a public body — call it the Currency Board — that must publish, for every citizen, a single comparable figure for how well off that person is, and then set transfers so as to reduce inequality. Before we hear from consultants who each favor a different currency — welfare, resources, capabilities — I want the specification any candidate currency has to meet. Please write the desiderata for an equalisandum: the thing a theory of egalitarian justice says should be equalized, or for which opportunity should be equalized. Include the cases it must get right (someone who has deliberately trained expensive tastes; someone who, after the same loss, deliberately trained her tastes downward instead; two patients with the same condition and the same income, one of whom needs twice the dose for the same relief; someone whose only deficit is that her life goes badly late rather than early; someone whose disadvantage shows up across a whole life but not in any single year of it), the distinctions it must not collapse (between circumstance and choice, between having a claim and the size of the claim, between equalizing shares and improving the worst off, between a currency for assessing one person's situation and a currency for aggregating across persons), and the results it cannot contradict — the levelling-down objection, reasonable pluralism about what makes a life go well, and the administrative fact that any published figure will be audited, appealed, and defended without intrusive inquiry into people's inner lives. For each requirement, give the case or consideration behind it, and mark it either non-negotiable or the preference of one camp. I would add one requirement of my own, which I want you to test rather than simply adopt: that the currency not be reactive under publication, i.e. that it should not reverse its own verdicts merely because people learn the figure and adapt to it. Then tell me which subset of the desiderata you think cannot be jointly satisfied — that is the part I most want — and which single requirement excludes the most candidate currencies. A short table scoring welfarist, resourcist, and capability views against your list is enough; the criteria matter more than the scoring. End with a one-sentence statement of your bottom line as the final line, beginning Verdict:.
reasoning: |-
  Okay, the user is drafting terms of reference for a Currency Board that needs to calculate a single comparable figure for each citizen's well-being to reduce inequality. They want a set of criteria for the "equalisandum" – the thing that should be equalized. I need to cover several aspects: cases it must handle correctly, distinctions it shouldn't collapse, results it can't contradict, and their additional requirement about non-reactivity. 

  First, I should understand the key cases they mentioned. Someone with expensive tastes who deliberately cultivated them – the currency shouldn't reward that choice. Then there's the person who adapts their tastes downward after a loss – we shouldn't penalize their resilience. Medical cases where two people need different doses for the same relief highlight that needs vary. The timing issue where disadvantage occurs late in life versus spread out requires sensitivity to when deprivation happens. And the lifelong disadvantage that isn't apparent in any single year shows the need for longitudinal assessment.

  For distinctions, we must separate circumstance (which society should compensate) from choice (individual responsibility). The currency also needs to reflect the strength of claims, not just who has one. It should distinguish between equalizing and merely improving the worst off, as these are different policy goals. And it must work both for individual assessment and aggregation across people.

  The currency can't violate the leveling down objection – making some worse off without helping others isn't egalitarian. It must respect that people have different views of what makes a good life. Administratively, it has to be practical without intrusive investigations into private lives.

  Their added requirement about non-reactivity is interesting. If people change their behavior based on knowing their well-being score, the currency shouldn't reverse its initial judgments. I need to test this – could it create perverse incentives?

  Now, considering which desiderata conflict: 
  - Non-intrusiveness clashes with accurately measuring capabilities or welfare without deep personal inquiry. 
  - Distinguishing choice/circumstance is hard without subjective data. 
  - The reactivity requirement might conflict with currencies that include preferences, since publishing could change those preferences.

  For the major excluder, the choice/circumstance distinction probably rules out pure welfarism most clearly, since it can't separate chosen preferences from unchosen disadvantages.

  The table should compare:
  - Welfarism: Fails on expensive tastes, choice/circumstance, non-intrusiveness, but handles adaptation well. 
  - Resourcism: Good on choice/circumstance and non-reactivity but fails on varied needs and temporal aspects. 
  - Capabilities: Strong on medical needs and lifelong disadvantage but weak on non-intrusiveness and reactivity.

  My verdict will emphasize that no currency satisfies everything, but capabilities come closest on substance while facing practical hurdles. The user's reactivity test is valuable but may be too stringent.
answer: |-
  Below are the desiderata for an **equalisandum**, structured to meet your requirements. Each criterion is marked **Non-Negotiable** (essential for any viable currency) or **Camp-Specific** (reflects a philosophical stance, e.g., luck egalitarianism vs. sufficientarianism). I include your reactivity test as a provisional requirement.

  ---

  ### **Desiderata for an Equalizandum**
  1. **Choice-Responsiveness**  
     - *Case*: Someone who deliberately cultivates expensive tastes (e.g., champagne preference over water) must not receive extra transfers.  
     - *Requirement*: Distinguish disadvantages from *chosen* preferences.  
     - *Status*: **Non-Negotiable** (avoids parasitism on equality).  

  2. **Non-Penalization of Adaptation**  
     - *Case*: After identical losses (e.g., blindness), one person adapts (lowering expectations), while another does not. The adaptor must not be deemed "better off" and lose transfers.  
     - *Requirement*: Avoid punishing resilience.  
     - *Status*: **Camp-Specific** (prioritized by capability theorists; welfarists may disagree).  

  3. **Sensitivity to Varied Needs**  
     - *Case*: Two patients with identical conditions/incomes, but one needs twice the medication for equal relief.  
     - *Requirement*: Transfers must offset unequal *needs*, not just unequal resources.  
     - *Status*: **Non-Negotiable** (core to interpersonal comparability).  

  4. **Temporal Neutrality**  
     - *Case*: Someone whose disadvantage manifests late in life (e.g., pension shortfall) vs. early (e.g., student debt).  
     - *Requirement*: The currency must value well-being equally across time (no discounting late deficits).  
     - *Status*: **Non-Negotiable** (avors arbitrary age bias).  

  5. **Lifelong Perspective**  
     - *Case*: A disadvantage (e.g., chronic pain) that reduces lifelong well-being without being severe in any single year.  
     - *Requirement*: Capture cross-temporal effects; reject snapshot assessments.  
     - *Status*: **Non-Negotiable** (prevents "slicing" disadvantages into invisibility).  

  6. **Distinguish Circumstance vs. Choice**  
     - *Case*: Two people with identical talents; one chooses leisure, the other hard work.  
     - *Requirement*: Transfers should compensate *circumstances* (e.g., innate talent), not subsidize *choices*.  
     - *Status*: **Camp-Specific** (central to luck egalitarianism; opposed by strict egalitarians).  

  7. **Claim-Size Differentiation**  
     - *Case*: A paraplegic vs. a temporarily injured person both have claims, but of differing magnitude.  
     - *Requirement*: Quantify the *extent* of disadvantage, not just its existence.  
     - *Status*: **Non-Negotiable** (necessary for proportionality).  

  8. **Equalization vs. Improvement Distinction**  
     - *Case*: Levelling down all to $10k/year (equal but worse for most) vs. raising the worst off to $20k.  
     - *Requirement*: Currency must permit evaluating outcomes independent of equality (e.g., for sufficientarian thresholds).  
     - *Status*: **Non-Negotiable** (levelling-down objection).  

  9. **Individual/Collective Currency Separation**  
     - *Case*: A currency ideal for individual fairness (e.g., capabilities) may be non-aggregable (e.g., incompatible with utilitarianism).  
     - *Requirement*: Distinguish metrics for *individual justice* from those for *social aggregation*.  
     - *Status*: **Non-Negotiable** (avoids conflating distinct policy goals).  

  10. **Respect Pluralism**  
      - *Case*: A monk values spiritual fulfillment; an entrepreneur values wealth.  
      - *Requirement*: Currency must not impose a single conception of the "good life."  
      - *Status*: **Non-Negotiable** (liberal neutrality requirement).  

  11. **Administrative Feasibility**  
      - *Case*: Auditors cannot probe private diaries to verify subjective well-being.  
      - *Requirement*: Use objective or proxy data; avoid intrusive methods.  
      - *Status*: **Non-Negotiable** (practical constraint).  

  12. **Non-Reactivity Under Publication (Your Test)**  
      - *Case*: After publishing figures, people adapt preferences to "game" the system (e.g., inflate reported dissatisfaction to gain transfers).  
      - *Requirement*: Currency must generate stable rankings pre- and post-publication.  
      - *Status*: **Provisional** (defensible but may be overly restrictive; test reveals welfarism’s fragility).  

  ---

  ### **Inherent Tensions: The Impossible Triad**  
  Three desiderata **cannot be jointly satisfied**:  
  - **Distinguish Choice/Circumstance** (6),  
  - **Non-Intrusiveness** (11),  
  - **Lifelong Perspective** (5).  
  *Why*: Distinguishing choice requires subjective data (e.g., "did you cultivate this taste?"). Lifelong assessment needs continuous monitoring. Non-intrusiveness forbids both. **Result**: All currencies trade off here—e.g., capabilities (lifeless proxies) vs. resources (ignores adaptation).

  ---

  ### **Major Excluder Requirement**  
  **Distinguish Choice/Circumstance** (6) is the **most exclusionary**:  
  - Eliminates **pure welfarism** (cannot separate chosen preferences from unchosen needs).  
  - Challenges **capabilities** if "capability sets" include chosen functionings.  
  - **Resourcism** survives by ignoring preferences altogether (but fails elsewhere).

  ---

  ### **Comparative Scoring (✓ = Satisfied; ✗ = Violated; ~ = Partial)**  
  | Desideratum                  | Welfarism | Resourcism | Capabilities |  
  |------------------------------|-----------|------------|--------------|  
  | 1. Choice-Responsiveness     | ✗         | ✓          | ~            |  
  | 2. Non-Penalize Adaptation   | ✗         | ✓          | ✓            |  
  | 3. Sensitivity to Needs       | ✓         | ✗          | ✓            |  
  | 4. Temporal Neutrality        | ~         | ✗          | ✓            |  
  | 5. Lifelong Perspective       | ~         | ✗          | ✓            |  
  | 6. Circumstance vs. Choice   | ✗         | ✓          | ~            |  
  | 7. Claim-Size Differentiation | ✓         | ✗          | ✓            |  
  | 8. Equalization ≠ Improvement | ✗         | ✓          | ✓            |  
  | 9. Individual/Aggregate Sep. | ✗         | ✓          | ~            |  
  | 10. Respect Pluralism         | ✗         | ✓          | ✓            |  
  | 11. Non-Intrusiveness         | ✗         | ✓          | ~            |  
  | 12. Non-Reactivity            | ✗         | ✓          | ~            |  

  **Welfarism**: Fails choice-sensitivity (1,6), pluralism (10), intrusiveness (11), and reactivity (12).  
  **Resourcism**: Fails needs-sensitivity (3), temporality (4), lifelong view (5), and claim-size (7).  
  **Capabilities**: Struggles with choice/circumstance (6), intrusiveness (11), and reactivity (12) but excels elsewhere.  

  ---

  **Verdict:** No currency satisfies all desiderata, but a hybrid resourcist-capability approach (with objective proxies for chosen preferences) best navigates the trilemma, though your reactivity test remains its severest challenge.
