  For the user's specific points: the direction-of-detail dilemma is valid. Panpsychists might accept weak emergence. The grain problem solution using maximum closure has merit but needs careful handling to avoid observer-relativity. Decoherence analogy doesn't solve the subject-summing problem; it just relabels it. 

  The main residue is the need for intrinsic properties and subjects in the framework. Without these, the combination problem can't be fully stated. Adding a composition operator for subjects might help, but it's not part of current physics. The user's unease might stem from philosophy relying on concepts not grounded in their structuralist framework.
answer: |-
  Here is a systematic translation of the combination problem sub-issues into your framework, followed by a residue analysis and stress-testing of your specific concerns. The translation adheres strictly to your listed vocabulary and flags where your framework's commitments are active.

  ---

  ### **Translation of Combination Problem Sub-Issues**
  #### **1. Subject-Summing Problem**  
  *Original Claim*: How do micro-subjects (e.g., fundamental particles with proto-consciousness) combine to form a macro-subject (e.g., human consciousness)?  
  *Translation*:  
  - **Clean Translation**: None. *Subjects* have no counterpart in coarse-graining (CG) maps. CG maps transform *states* or *operators*, not subjects.  
  - **Distorted Translation**: If we force "subject" ≈ "dynamically autonomous level of description," summing becomes: *How do micro-level degrees of freedom (DOF) under a CG map yield a macro-level with emergent autonomous dynamics?*  
    - *Distortion Note*: Replaces subjects with levels of description. Ignores intrinsics/qualia.  
  - **No Translation**: The "summing" operation itself. CG maps are equivalence classes (many-to-one), not additive compositions.  

  #### **2. Quality-Combination Problem**  
  *Original Claim*: How do micro-phenomenal qualities (e.g., colorless particle experiences) combine to form macro-qualities (e.g., "redness")?  
  *Translation*:  
  - **Clean Translation**: Irrelevant operators being washed out under RG flow; relevant/marginal operators defining emergent macro-qualities at a fixed point.  
  - **Distorted Translation**: Macro-qualities as *effective DOF* emerging from RG flow, where micro-qualities are irrelevant (discarded) or marginal (renormalized).  
    - *Distortion Note*: Presumes qualia are structural/dynamical properties.  
  - **No Translation**: "Combination" of intrinsic qualities. CG discards information; it doesn’t fuse qualities.  

  #### **3. Grain Problem**  
  *Original Claim*: Macro-phenomenal structure (e.g., smooth visual fields) seems incompatible with discrete, grainy micro-physical structure.  
  *Translation*:  
  - **Clean Translation**: Scale relativity under RG flow. A coarse-grained description at scale ξ has emergent continuity if correlation length ξ ≫ lattice spacing.  
  - **Distorted Translation**: Macro-phenomenal "smoothness" as an emergent property at a scale where DOF exhibit long-range order (e.g., synchrony in oscillators).  
    - *Distortion Note*: Equates "grain" with resolution scale.  
  - **No Translation**: The "incompatibility" claim. RG shows all scales are physically consistent.  

  #### **4. Structural Mismatch (Neural Correlates)**  
  *Original Claim*: Neural correlates of consciousness (NCC) are coarse-grained patterns, but micro-phenomenal properties are attached to fundamental entities.  
  *Translation*:  
  - **Clean Translation**: NCC as macro-DOF (e.g., order parameters) defined by a CG map from neural microstates.  
  - **Distorted Translation**: NCC as *relevant operators* stable under RG flow. Micro-phenomenal properties are *fundamental DOF* at the UV fixed point.  
    - *Distortion Note*: Assumes phenomenal properties are DOF.  
  - **No Translation**: "Attachment" of consciousness to fundamental entities. Your framework has no slot for non-dynamical properties.  

  #### **5. Reverse/Decomposition Argument**  
  *Original Claim*: Unified consciousness implies micro-subjects must exist to compose it.  
  *Translation*:  
  - **Clean Translation**: Macro-level autonomy (dynamical closure) does *not* imply that micro-DOF are "subjects" or have macro-like properties.  
  - **Distorted Translation**: Decomposing a macro-state into micro-states requires specifying boundary conditions; no unique decomposition exists.  
    - *Distortion Note*: Reversibility is lost under CG; macro-states are equivalence classes.  
  - **No Translation**: "Implication" of micro-subjects. RG flow runs from micro to macro, not vice versa.  

  ---

  ### **Residue Report**  
  | **Clean Translation**       | **Distorted Translation**                     | **No Translation**                          |
  |-----------------------------|-----------------------------------------------|---------------------------------------------|
  | Grain problem (scale rel.) | Quality-combination (as effective DOF)        | Subject-summing operation                   |
  | Structural mismatch (CG)    | Reverse arg. (non-unique decomposition)       | Intrinsic properties (qualia)               |
  | NCC as macro-DOF            | Subject-summing (as level autonomy)           | "Composition" as mereological fusion        |
  |                             | Quality-combination (irrelevant operators)    | Consciousness "attachment" to DOF           |

  **Key Residue Insights**:  
  1. **Your Framework’s Limitations**:  
     - No slot for *intrinsic/non-structural properties*. Panpsychism’s "proto-consciousness" is intrinsically defined; your DOF are purely relational.  
     - No concept of *subjects* or *composition rules* beyond state-space mappings.  
     - CG maps are *descriptive tools*, not ontological part-whole relations.  

  2. **Original Claims’ Weaknesses**:  
     - "Composition" is often undefined or relies on mereology (e.g., part-whole sums), which RG renders scale-relative.  
     - The reverse argument assumes top-down ontological necessity, but RG shows macro-autonomy is consistent with micro-contingency.  

  ---

  ### **Stress-Testing Your Three Concerns**  
  #### **1. Direction-of-Detail Objection**  
  - **Your Dilemma**: Valid. Macro-richness from CG requires:  
    - **Horn 1**: New effective DOF → *Weak emergence* (e.g., synchrony as an order parameter).  
    - **Horn 2**: Micro-richness preserved → No known CG map achieves this (e.g., integrating oscillator phases doesn’t yield "redness").  
  - **Defenders’ Choice**: Most take **Horn 1** (e.g., Goff’s "fusion" as weak emergence). This *does* forfeit panpsychism’s advantage over brute emergence unless micro-phenomenal properties are deemed "less brute."  

  #### **2. Grain Problem as Scale Relativity**  
  - **Your Proposal** (consciousness at max dynamical closure):  
    - *Pros*: Matches RG intuition (e.g., thermodynamics as closed level).  
    - *Cons*:  
      - Max closure is observer-relative (e.g., fluid dynamics vs. molecular).  
      - Collapses into maximizing integrated information (Φ) *at a scale*, but Φ is ill-defined in RG.  
  - **Verdict**: Constraint is genuine but risks circularity. Solution requires an *intrinsic* measure of closure, not pragmatic.  

  #### **3. Decoherence Analogy**  
  - **Analogy**: Branch decoherence → no fusion, only inaccessibility.  
  - **For Subjects**: Micro-subjects never fuse; macro-subjects are decohered "branches" of a universal mind.  
  - **Evaluation**:  
    - *Available*: Yes (e.g., Hoffman’s "conscious realism").  
    - *Solves Summing?* **No**. It restates the problem: Why does *this* branch (macro-subject) have unified access?  
    - *Residue*: Still needs a rule for "branching" of subjects, absent in your framework.  

  ---

  ### **Core Issue: What Resists Translation?**  
  - **Root Problem**: Your vocabulary lacks:  
    - **Ontological slots** for intrinsic/non-structural properties.  
    - **Operators for subjecthood** (e.g., a "composition rule" for subjects isn’t a state-space map or mereological sum).  
  - **Why It Matters**: Panpsychism’s combination problem *presupposes* intrinsics and subjects. If these are excluded by structuralism (as in your framework), the problem is *ill-posed* from the start.  

  **What a Solution Would Require in Your Terms**:  
  A "composition rule" would need to be:  
  1. A **non-CG map** (since CG loses information).  
  2. An **emergent operator** in the IR effective theory (e.g., a topological invariant binding DOF).  
  3. A **new fundamental relation** (e.g., entanglement for consciousness).  
  — But all options exceed current physics.  

  ### **Conclusion**  
  The residue is **primarily on your side**: Panpsychism’s combination problem *cannot be fully stated* in a purely structural-dynamical framework without smuggling in intrinsics or subjects. To make it statable, you would need:  
  - An extension to include *intrinsic properties* (e.g., quantum states as "carriers" of proto-qualia).  
  - A *composition axiom* for subjects (e.g., a lattice operation beyond mereology).  
  — Without these, panpsychism either reduces to weak emergence or remains untranslatable. Your unease reflects a collision between structuralist physics and ontology-first philosophy.
