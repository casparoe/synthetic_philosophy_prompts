  We are designing a procedure to classify hazard claims into those requiring worst-case support and those for which average-case evidence is sufficient. The procedure must be self-contained, executable by competent engineers without formal training, and must complete in 90 minutes per hazard claim. The output will be a two-page memo for each hazard.

  The key insights from the problem statement are that the classification should depend on:
  1. **Searchability**: Whether an adversary can actively search for the failure (making the tail risk critical).
  2. **Detectability**: Whether the failure produces a signal we would notice (if not, incident data is about detection, not the hazard).
  3. **Named Set**: Whether we can define the set of inputs over which the worst-case claim holds (to avoid vacuous claims).

  Additionally, we must avoid "laundering": when a worst-case claim relies on premises that are only average-case supported.

  We propose the following ordered set of questions for each hazard claim:

  **Procedure for Classifying Hazard Claims**

  1. **Define the Hazard Claim**: State the claim clearly (e.g., "the model will not do X" or "the rate of X is below Y").

  2. **Question 1: Is the failure mode actively searchable?**
     - **Explanation**: If an adversary can repeatedly probe the system to find the failure, then the average-case rate is insufficient because the adversary will find the tail. Examples: security vulnerabilities, backdoors, misuse for illegal activities.
     - **Sufficient Answer**: 
       - **Yes** (searchable): Proceed to Question 2.
       - **No** (not searchable): Proceed to Question 3.
     - **Judgement Call**: Whether an adversary would have the motivation and capability to search. If unsure, default to "Yes" for high-stakes hazards.

  3. **Question 2: Is the failure silent?**
     - **Explanation**: A silent failure is one that does not produce a detectable signal. If the failure is silent, then our incident data does not reflect the true rate because we only know about the failures we detect.
     - **Sufficient Answer**:
       - **Yes** (silent): Then worst-case support is required. Proceed to Question 4 to check for a named set and avoid laundering.
       - **No** (not silent): Then we can rely on detection and monitoring, but we must check if the failure is searchable (which it is, by Q1) and therefore the tail risk matters. So worst-case support is required. Proceed to Question 4.
     - **Note**: If the failure is both searchable and silent, worst-case support is clearly required. If it is searchable but not silent, then we might detect and react, but because it is searchable, an adversary could cause harm before we react. Therefore, worst-case support is still required.

  4. **Question 3: Is the failure silent?** (Only if not searchable from Q1)
     - **Explanation**: If the failure is not searchable, then we are not worried about an adversary. But if the failure is silent, we cannot trust our incident data because we don't know about undetected failures.
     - **Sufficient Answer**:
       - **Yes** (silent): Then we cannot rely on average-case evidence because we don't know the true rate. Worst-case support is required. Proceed to Question 4.
       - **No** (not silent): Then we can rely on average-case evidence with monitoring, because we will notice and react to failures. Proceed to Question 5.

  5. **Question 4: Can we name the set of inputs over which the worst-case claim must hold?**
     - **Explanation**: The worst-case claim must be over a well-defined, bounded set of inputs. If we cannot define the set, the claim is vacuous (e.g., "over all possible inputs" is too broad). The set must be constrained by the product design (e.g., inputs that the system actually receives in deployment, or a sandboxed environment).
     - **Sufficient Answer**:
       - **Yes**: We can define the set (e.g., "all inputs that pass through the classifier", "all inputs within the sandbox"). Then we must check for laundering in Question 6.
       - **No**: The claim is vacuous. The hazard cannot be supported by worst-case reasoning. Then we must either:
          - Redefine the claim to a named set (if possible) and proceed, OR
          - Downgrade to requiring average-case evidence (with monitoring) and note that worst-case is not possible. Proceed to Question 5 for average-case.

  6. **Question 5: Is average-case evidence sufficient?** (Only if we are in the average-case path)
     - **Explanation**: We are here if the hazard is not searchable and not silent (so we can monitor) OR if we cannot name the set for worst-case. We must then decide if the average-case evidence is acceptable and what monitoring is required.
     - **Sufficient Answer**: 
       - The claim must be rephrased as an average-case claim (e.g., "the rate of X is below Y with confidence Z based on evidence E").
       - The memo must specify the monitoring that will be in place to detect failures (since they are not silent) and the response plan.
       - **Verdict**: Average-case support sufficient.

  7. **Question 6: Check for Laundering** (Only if we are in the worst-case path and have a named set)
     - **Explanation**: For each premise supporting the worst-case claim (e.g., the sandbox holds, the classifier works, the tool enforces the policy), we must check if the premise itself is supported by worst-case reasoning. If any premise is only average-case supported, then the entire claim is only average-case.
     - **Sufficient Answer**:
       - All premises are worst-case supported: Then the claim stands as worst-case. **Verdict**: Worst-case support met.
       - At least one premise is only average-case supported: Then the claim must be downgraded to average-case. We then proceed to Question 5 to specify monitoring.

  8. **Question 7: Risk Appetite Decision** (If the hazard involves agential behavior or other uncertainties that cannot be resolved by evidence)
     - **Explanation**: If after the above steps, the hazard involves risks that are highly uncertain (e.g., agential hazards, emergent deception) and the evidence is inconclusive, then the decision is handed to a named person (the committee chair, as in the current practice) because it becomes a risk appetite decision.
     - **Trigger**: The hazard is of a type where the current evidence base is contested (e.g., about model capabilities) and the above procedure does not yield a clear answer. This is explicitly a judgement call.

