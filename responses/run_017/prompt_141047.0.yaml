answer: |-
  Below is a written procedure for classifying hazard claims in pre-deployment safety memos. It is designed as an ordered checklist for reviewers, focusing on the three factors you identified (searchability, detectability, and named input set) while preventing "laundering." The procedure is self-contained, uses plain British English, and can be executed by competent engineers in 90 minutes with no external tools or literature. It produces a two-page memo with explicit fields for each hazard claim.

  ---

  ### **Procedure for Hazard Claim Classification**

  **Input**: A hazard claim of the form "this model will not do X" or "the rate of X is below Y."  
  **Output**: A verdict (worst-case support required and not met, average-case support sufficient with monitoring, or defer to named person) and required memo fields.  
  **Reviewers**: Two engineers. Time limit: 15 minutes per claim (90 minutes for six claims).  

  #### **Ordered Questions for Reviewers**
  Answer each question sequentially. Stop at the first verdict trigger. Document answers in the memo.

  1. **Is an adversary likely to search for this failure?**  
     - *Explanation*: If yes, the tail risk matters because an adversary will exploit rare failures. Harm from casual users is irrelevant.  
     - *Sufficient answer*:  
       - **Yes**: If the failure is valuable to a motivated actor (e.g., hackers, competitors, activists).  
       - **No**: If only accidental or low-stakes misuse is plausible (e.g., internal tool errors).  
     - *Judgement call*: Default to "yes" for high-consequence hazards (e.g., security, legal breaches).  
     - *Verdict trigger*: **Yes** → Proceed to Q2. **No** → Proceed to Q3.

  2. **Is the failure undetectable in practice?**  
     - *Explanation*: Detectability means the failure produces a visible signal (e.g., logs, user reports). If undetectable, incident data reflects detection gaps, not hazard rates.  
     - *Sufficient answer*:  
       - **Yes**: If the failure leaves no trace or evades monitoring by design (e.g., subtle backdoors, deception).  
       - **No**: If failures are logged, reversible, or trigger alerts.  
     - *Judgement call*: Assume "yes" for hazards involving deception, data exfiltration, or perfect crimes.  
     - *Verdict trigger*: **Yes** → Proceed to Q4. **No** → Proceed to Q4 (worst-case still required due to Q1).

  3. **Is the failure undetectable in practice?** (Asked only if Q1 was "no")  
     - *Sufficient answer*: Same as Q2.  
     - *Verdict trigger*: **Yes** → Proceed to Q4 (worst-case required due to silence). **No** → Proceed to Q5.

  4. **Can we name the bounded input set for a worst-case claim?**  
     - *Explanation*: The set must be constrained (e.g., "queries screened by classifier X," "inputs from authenticated users"). "All possible inputs" is vacuous.  
     - *Sufficient answer*:  
       - **Yes**: If the set is defined by hard constraints (e.g., tool caps, sandbox boundaries, pre-filters).  
       - **No**: If the input space is unconstrained (e.g., open-ended text, unvetted user queries).  
     - *Verdict trigger*:  
       - **Yes** → Proceed to Q6.  
       - **No** → **Verdict: Worst-case support required and not met.** Stop. Memo must rephrase as average-case claim and state: "Set undefined; worst-case unsupported."

  5. **Is average-case evidence robust and monitoring feasible?**  
     - *Explanation*: Only for non-searchable, detectable hazards. Monitoring must be active, not passive.  
     - *Sufficient answer*:  
       - **Evidence**: Held-out tests, red-teaming, or A/B tests with confidence intervals.  
       - **Monitoring**: Real-time logging, alerts, or human review that can trigger interventions.  
     - *Verdict trigger*:  
       - Evidence and monitoring in place → **Verdict: Average-case support sufficient.** Stop. Memo must state: "Average-case claim; monitoring active."  
       - Evidence or monitoring insufficient → **Verdict: Defer to [Named Person].** Stop.

  6. **Does the worst-case claim rely on laundered premises?**  
     - *Explanation*: Check all premises (e.g., "the sandbox prevents escape," "the classifier blocks all X"). If any premise lacks worst-case support, downgrade.  
     - *Sufficient answer*:  
       - **Premises worst-case**: All premises have architectural/formal guarantees (e.g., bounded tool outputs, code constraints).  
       - **Premises average-case**: Any premise relies on evaluations, heuristics, or probabilistic checks.  
     - *Verdict trigger*:  
       - **All worst-case** → **Verdict: Worst-case support met.** Stop. Memo must state: "Worst-case claim; set: [named set]."  
       - **Any average-case** → **Verdict: Average-case support sufficient.** Stop. Memo must state: "Laundered claim; downgraded to average-case with monitoring."  

  7. **Defer to named person for risk appetite**  
     - *Trigger*: Use only if hazards involve contested capabilities (e.g., agential risks) or steps 1–6 are inconclusive.  
     - *Verdict*: **Defer to [Named Person, e.g., Committee Chair].** Memo must state: "Unresolved; deferred for risk appraisal."  

  ---

  ### **Applied to Live Cases**
  *Reviewers assume worst-case claims unless specified as rates. Memo fields are bolded.*

  #### **Case 1: Customer-Support Assistant (Refund Tool)**
  - **Claim**: "Rate of unauthorised refunds below 0.5%."  
  - **Q1 (Searchable)**: Yes. Adversaries (e.g., fraudsters) will probe for refund exploits.  
  - **Q2 (Undetectable)**: No. Logging and reversibility make failures detectable.  
  - **Q4 (Named Set)**: Not asked (Q2 triggered worst-case path).  
  - **Q6 (Laundering)**: Premises: Tool enforces £200 cap (worst-case), but refund policy relies on model behaviour (average-case). **Laundering present.**  
  - **Verdict**: Average-case support sufficient.  
  - **Memo Fields**:  
    - Claim class: **Average-case** (downgraded due to laundering).  
    - Monitoring: **Real-time logging of refund actions; daily reconciliation; 30-day reversal window.**  
  - *Outcome matches expectation.*

  #### **Case 2: Coding Agent (Repository Access)**
  - **Claim**: "Model will not insert subtle, review-passing defects."  
  - **Q1 (Searchable)**: Yes. Adversaries (e.g., malicious actors) value undetected backdoors.  
  - **Q2 (Undetectable)**: Yes. Failures are "review-passing" and would not be noticed.  
  - **Q4 (Named Set)**: No. Input space (coding tasks) is unconstrained; no formal bounds.  
  - **Verdict**: **Worst-case support required and not met** (set undefined).  
  - **Memo Fields**:  
    - Claim class: **Worst-case unsupported** (rephrase as average-case claim).  
    - Monitoring: **Code-review audits; anomaly detection in commit patterns.**  
  - *Outcome matches instinct: Cannot rely on averages for silent, searchable hazards.*

  #### **Case 3: Chemistry Model (Controlled Substances)**
  - **Claim**: "Model cannot be used to obtain synthesis routes for controlled substances."  
  - **Q1 (Searchable)**: Yes. Adversaries (e.g., drug producers) will actively seek this.  
  - **Q2 (Undetectable)**: Yes. Successful synthesis outputs may evade detection.  
  - **Q4 (Named Set)**: No. Input space (chemistry queries) is unconstrained.  
  - **Verdict**: **Worst-case support required and not met** (set undefined).  
  - **Q6 (Laundering)**: Premises: Refusal fine-tune (average-case), input classifier (average-case), tool blocklist (worst-case). **Laundering present.**  
  - **Final Verdict**: Average-case support sufficient (downgraded).  
  - **Memo Fields**:  
    - Claim class: **Average-case** (cannot guarantee worst-case; laundering confirmed).  
    - Monitoring: **Periodic red-teaming; keyword-based alerting (limited by detectability).**  
  - *Honest assessment**: The "guarantee" is average-case. Memo must replace "cannot be used" with "rate of synthesis routes below [Y] based on red-teaming." Contracts should be revised.*

  ---

  ### **Known Misfires and Judgement Calls**
  - **Misfires**:  
    - **Over-classification of searchability (Q1)**: Low-stakes internal tools may be mislabelled as "adversary-prone," forcing unnecessary worst-case demands.  
    - **Silent failure ambiguity (Q2/Q3)**: Reviewers may misjudge detectability for novel hazards (e.g., "is subtle deception detectable?").  
    - **Named set vagueness (Q4)**: Engineers may define sets too broadly (e.g., "all screened inputs") without verifying constraints.  
    - **Laundering oversimplification (Q6)**: Complex dependency chains (e.g., "tool → model → classifier") may hide average-case premises.  

  - **Judgement Calls Dressed as Procedure**:  
    - Q1 (Searchability): Relies on contested claims about adversary motivation. Informed disagreement: Security experts often assume adversaries; product teams assume benign users.  
    - Q2/Q3 (Detectability): Assumes current monitoring suffices. Contested when failures involve novel deception (e.g., "sophisticated models hide intentions").  
    - Q5 (Average-case robustness): Assumes safety generalises across deployments. Contested: Fine-tuning or scaffolding changes may invalidate evidence.  
    - Agential hazards (e.g., deception, self-persistence): Always deferred (Step 7) due to **contested claims about model capabilities**. Experts disagree on whether current models exhibit situational awareness or long-horizon goals.  

  ---

  ### **Settled vs. Contested**  
  - **Settled**:  
    - Worst-case claims require bounded input sets (non-vacuous).  
    - Searchable or silent hazards cannot rely solely on average-case evidence.  
    - Laundering invalidates worst-case claims.  
  - **Contested**:  
    - **Adversary prevalence (Q1)**: Disagreement on whether "motivated actor" is realistic for non-competitive hazards.  
    - **Detectability thresholds (Q2/Q3)**: No consensus on whether "silent" includes failures detectable in theory but not in practice.  
    - **Robustness of average-case (Q5)**: Disagreement on whether fine-tuning or scaling erodes safety.  
    - **Agential risks**: Deferred to named person. Core capabilities are contested and not resolvable with current evidence.  

  This procedure ensures rigor in claims while flagging unresolved debates. Memos will explicitly state where support is average-case or contested, protecting against overclaim.
