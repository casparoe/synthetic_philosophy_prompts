  The emotional layers are complex too. There’s grief, obviously, but also intellectual responsibility - they feel accountable to her legacy. And pressure: her family expects comfort while colleagues will judge philosophical integrity. The unspoken need might be permission to make the tribute imperfect, even as they honor a scholar who studied incompleteness. 

  For structure... opening should disarm the tension immediately by naming the elephant: we’re gathered to do something impossible (complete a speech act for someone who can’t respond). Then pivot to concrete memories showing how she embodied her theory - how she demanded real engagement. The "unfinished" framing isn’t weakness; it’s rigorous honesty. 

  Must avoid academic jargon but keep theoretical depth. Phrases like "co-authored moments" or "calls waiting for answers" make the idea visceral. Ending should release everyone from performative pressure - the memorial’s "work" happens in our shared presence, not in words directed at the departed. 

  ...Wait, is the user male? No indication. Defaulting to "they" in the draft feels safer. Also noting they didn’t share the supervisor’s name - intentional? Probably wants focus on ideas over biography. Should mirror that. 

  Biggest risk is the family feeling theory overshadows the person. Counter by showing her humanity first: how she laughed, pushed students, lived the philosophy. The "orphan" concept only appears late, framed as her life’s metaphor rather than academic term. 

