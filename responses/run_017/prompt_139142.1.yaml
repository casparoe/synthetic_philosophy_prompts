answer: |-
  Here’s a draft honoring her ideas while speaking directly to both audiences. It sidesteps empty promises, embraces incompleteness, and makes the theory felt rather than explained:

  ---

  **Draft Memorial Remarks**

  We’re here because [Supervisor's Name] isn’t. And that simple, brutal fact makes this incredibly hard. Because [Name] spent her life thinking deeply about connection – about how the things we say and do only truly *become* real when they land, when they’re received, when someone answers back.

  She didn’t believe in speeches or promises floating off into the void. For her, a real apology needed the hurt party to hear it. A real thank you needed the person thanked to feel it. A real promise… well, a real promise needed the other person’s trust to meet it halfway. The acts we try to perform, she’d insist, are co-authored. They’re conversations, even the quiet ones. They need two.

  She had a name for the ones that don’t get that answer, the ones sent out but never received: orphan performatives. Beautifully formed words, perfectly constructed sentences… but somehow unfinished. Alone.

  So what do we do here today? Her colleagues and students know the irony. I stand here wanting to *do* something in her memory – to thank her, to honor her, to promise we’ll hold onto her work, her spirit. But according to the very ideas she spent thirty years teaching us… I can’t. Not fully. Not like that. Because she isn’t here to hear it. She isn’t here to receive the thanks, to acknowledge the promise, to nod or smile or argue back. Anything I try to say *to* her… risks being orphaned.

  But here’s what isn’t orphaned: *Us*. We are here. We can hear each other.

  And [Name] knew this power too. She saw how the real work, the real connection, happens between the living. It happens in the shared look of understanding between colleagues who remember the same seminar, the same fierce debate. It happens in the stories her sisters or neighbours tell about her garden, her laugh, her stubbornness – stories that make us smile or nod because *we recognize her*. It happens in the quiet comfort of a hand on a shoulder, the murmured "I remember that too," the simple presence of people who cared about her, gathered together.

  **So here’s what we *can* do, together, right now:**

  We can **listen**. Listen to the memories shared today, the ones spoken aloud and the ones held silently. Let them land. Hear them.

  We can **answer**. Nod when a story rings true. Laugh at a shared memory. Let out the sigh for the fierce intellect or the unexpected kindness we miss. Reach out – literally or figuratively – to the person next to you who also feels this loss.

  We can **carry**. We carry her ideas forward by engaging with them, debating them, teaching them *with* our students, not just *to* them. We carry her spirit forward in the decency we show each other, the intellectual honesty she demanded, the care she showed in quieter moments. We carry her love forward by being there for her family, her friends, each other.

  What I say *to* [Name] today? It has to stay unfinished. An open thanks. An unanswered promise. A love sent out that can’t land where it once did. And that’s okay. It’s honest. It reflects the reality of this loss. She’d understand that incompleteness.

  But what happens *here*, *among us*, as we listen and answer and carry each other through this? *That* is where the real work of remembering happens. That’s where the connection she studied lives on. That’s where we co-author something real, right now, for her.

  So let’s do that. Let’s be here, together, fully. For her. For each other.

  ---

  **Why this structure works (and avoids the pitfalls):**

  1.  **Acknowledges the Core Idea & Irony (For Colleagues/Students):** Explicitly names "orphan performatives" and the central irony of trying to perform an act *for her* now. Shows you understand her work deeply without lecturing. They'll hear the theory resonating in every sentence without needing jargon.
  2.  **Honors the Theory Without Lecture:** Explains the co-authorship concept in simple, relatable terms ("apology needed the hurt party to hear it," "promise needed the other person’s trust"). Uses metaphor ("land," "void," "orphaned") effectively.
  3.  **Avoids Empty Promises:** Explicitly refuses to make promises *to her* ("I can’t. Not fully."). Explains *why* using her own framework.
  4.  **Provides Meaning for Family/Non-Academics:** Focuses on shared humanity – her laugh, garden, stubbornness. Defines "what we *can* do" in concrete, actionable terms: **Listen, Answer, Carry.** These are verbs they can understand and engage in *right now*.
  5.  **"Sideways" Action:** The core memorial act *is* the shared presence and interaction of the group ("what happens *here*, *among us*"). This is the performative act co-authored by the living, fulfilling her theory for the audience.
  6.  **Embraces Incompleteness:** Doesn't shy away from the unfinished nature of speaking *to* her. Names it ("open thanks," "unanswered promise," "love sent out") and frames it as honesty, not failure. This resonates with the emotional truth of grief.
  7.  **Concrete & Emotional:** Grounds everything in shared memory and present action. Ends with a clear, simple call to presence ("Let’s be here, together, fully").
  8.  **Respectful & Loving:** The tone is warm, respectful, and acknowledges the depth of the loss while focusing on collective strength.

  **Deliver it:** Speak slowly, clearly. Pause after the hard truths ("She isn't here"). Let the warmth come through on the memories and the call to shared presence. Make eye contact around the room. The power is in the shared understanding you create *in the room*, embodying her idea perfectly. Good luck. She'd appreciate the struggle and the honesty.
