answer: |-
  Below is a self-contained exam question, a model answer (747 words), and a detailed marking scheme designed to meet your specifications. The question forces engagement with the *conceptual foundations* of computational ascription rather than rehearsing standard arguments.

  ---

  ### **Exam Question (Handout Version)**

  **Question:** The "NeuroSim" project has created a causally verified simulation of a human brain, reconstructed from a connectome and run at ion-channel resolution. Interfaced with a synthetic body, it is behaviourally indistinguishable from the person it models. The team emphasizes two findings:  
  1. The system can be formally described as computing indefinitely many distinct functions, with no non-arbitrary way to select one as "the" computation it performs.  
  2. For every candidate mapping of its internal states onto mental representations (e.g., "neuron X firing means 'apple'"), a rival mapping fits the causal and behavioural data equally well.  

  Does this result resolve whether the brain is a computer? More importantly: **What kind of question is "Is the brain a computer?"** — and how does NeuroSim clarify or complicate it?  

  *(90 minutes; answer in essay form)*  

  ---

  ### **Model Answer (Strong A-Grade; 747 words)**  

  NeuroSim does not resolve whether the brain "is a computer." Instead, it exposes that the question is not empirical but *conceptual*: it hinges on what we demand of computational ascription. When we call a physical system a "computer," we imply more than mere causation or behaviour; we imply it *implements a specific function* in a non-arbitrary way, guided by *intentional content*. NeuroSim’s indeterminacies show that neither causal fidelity nor behaviour suffices to establish this, forcing us to confront whether computational descriptions are discoveries about the world or pragmatic tools we impose.  

  First, for "the brain is a computer" to be substantive, computational ascription must avoid triviality. Any physical system can be *described* as computing *some* function if we freely choose input/output mappings and state transitions (e.g., planets "compute" orbits via gravity). To resist triviality, we require a system to have (1) a *privileged function* fixed by its design or history, and (2) *semantic content*—states that "stand for" things. NeuroSim’s first finding—no non-arbitrary function—blocks the first requirement. Its causal precision is irrelevant; the problem is that every possible function fits the physics equally well. A computer is not just a causal web but a *teleological* one: a mouse trap’s physics could be repurposed to compute pi, but we call it a mouse trap because its structure was selected to catch mice. NeuroSim lacks this history. It simulates a brain’s causal pathways but inherits no original function—its "computation" is observer-relative.  

  Behavioural indistinguishability also fails to secure computational identity. NeuroSim replicates outputs (speech, memory recalls), but outputs alone cannot fix computation. As the team’s second finding shows, identical behaviour admits rival content mappings (e.g., neuron activity could "mean" "apple" or "not-banana"). This indeterminacy is not solved by adding causal structure because causation is syntax without semantics—patterns of ion fluxes constrain *correlations* but not *representations*. Without privileged content, NeuroSim’s "thoughts" are ascriptions, not discoveries. The brain, by contrast, is presumed to have intrinsic content (e.g., pain *means* tissue damage). If NeuroSim cannot acquire content despite causal perfection, it suggests computational descriptions decouple from meaning.  

  This leads to the crux: Does content indeterminacy *refute* the claim that NeuroSim (or brains) computes? Or does it merely relocate the computational claim? Here, NeuroSim reveals the question’s nature. If computation requires non-arbitrary content, NeuroSim fails—but so might brains, as content indeterminacy plagues natural cognition too (e.g., philosophical disputes over mental representation). Alternatively, if computation is merely causal pattern-manipulation sans intrinsic meaning—a "syntactic engine"—NeuroSim *is* computational, but trivially so (like weather simulations). The dilemma is that neither option satisfies the non-trivial aspiration of "the brain is a computer": the first makes computationalism empirically empty (content is unverifiable); the second makes it ubiquitous (all causal systems compute).  

  Thus, NeuroSim forces us to see "Is the brain a computer?" as fundamentally *not scientific* but *conceptual-metaphysical*. Science can show how systems behave and causally interact, but it cannot decide whether those interactions "are computations" without prior stipulations about function and content. The metaphor’s value is pragmatic: it guides research (e.g., modelling memory as "storage") or engineering (e.g., neuromorphic chips). But NeuroSim’s indeterminacies prove it is not a hypothesis to be confirmed by perfect simulation. When we say "the brain *is* a computer," we project a purpose onto biology—one absent in physics itself.  

  In conclusion, NeuroSim settles nothing because it mirrors the brain’s unresolved ambiguities. It demonstrates that behavioural and causal fidelity are insufficient to establish computational essence. The deeper lesson is that the question confuses categories: computation is not a *natural kind* like water or DNA, but a *functional description* reliant on observer-dependent norms. Whether brains "are" computers depends not on empirical discovery but on whether we grant them design-like purposes. NeuroSim, untethered from evolution or intent, lays bare this conceptual scaffolding. The metaphor’s power lies in its utility—not its truth.  

  ---

  ### **Marking Scheme (Total: 20 Marks)**  

  | **Marks** | **Criterion**                                                                 | **A-Grade Requirement**                                                                          | **Common Pitfall (B-Grade or Lower)**                                  |  
  |-----------|-------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|------------------------------------------------------------------------|  
  | **4**     | **Define non-trivial computation ascription**                                | Explicitly states that computation requires non-arbitrary function + content to avoid triviality. | Equates computation with any causal system; misses intentionality.     |  
  | **6**     | **Explain why causal/behavioural fidelity ≠ computational identity**         | Argues fidelity fails due to function/content indeterminacy, not just "simulation ≠ wet."         | Cites behavioural equivalence alone or misapplies Chinese Room.       |  
  | **6**     | **Analyze content indeterminacy: refutes or relocates?**                     | Distinguishes syntactic vs. semantic computation; ties to observer-relativity.                  | Claims content indeterminacy "disproves" computation entirely.         |  
  | **4**     | **Articulate "what kind of question" (conceptual > empirical)**              | Identifies it as metaphysical/pragmatic (not testable by simulation).                            | Treats it as purely scientific; ignores metaphor’s normative role.   |  
  | **–2**    | **Penalty**                                                                  | Uses "simulation isn’t wet" or similar as primary argument.                                      | N/A                                                                  |  

  **Grade Boundaries**:  
  - **A (17–20)**: Hits all 4 criteria; penalty avoided; coherent argument.  
  - **B (14–16)**: Names key issues but lacks adjudication/insight; or penalized.  
  - **C (10–13)**: Surveys standard arguments (Turing, Chinese Room) superficially.  
  - **D (6–9)**: Misrepresents scenario or commits category errors.  

  ---

  ### **Why This Meets Your Specifications**  
  1. **Turns on a crux**: Forces students to confront *non-trivial ascription* (via function/content) *before* invoking Turing or Chinese Room arguments.  
  2. **Rewards conceptual adjudication**: The model answer doesn’t just list positions but argues computational claims are observer-relative, relegating empirical fidelity to secondary importance.  
  3. **Explicitly penalizes shallow tropes**: The "–2" penalty directly targets "simulation ≠ wet" reasoning.  
  4. **Prioritizes "what kind of question"**: The core insight (conceptual vs. empirical) anchors the argument and marking scheme.  

  This structure ensures an A requires synthesizing the scenario’s indeterminacies into a critique of the metaphor’s epistemological status—moving beyond survey to analysis.
