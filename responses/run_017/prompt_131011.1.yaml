prompt: |-
  I am drafting the coding manual for a study of displays that look wasteful — feasts, credentials, rituals, fees, badges, ordeals — and I want to be forced to be precise about which of them are handicaps in the strict sense and which merely resemble one. Please work from the stipulations and cases below; I do not want a literature review, a bibliography, or anyone's arguments reported back to me, only your own reasoning applied to the cases.

  Stipulations:

  - A display counts as a signal only if it is produced at least partly because of the effect it has on some receiver, and if it is in fact correlated with the property the receiver cares about.
  - Call a signal *cost-anchored* (in the handicap sense) when its correlation with the property is maintained by the fact that the marginal cost of the display falls as the signaled quality rises — and, crucially, when a lower-quality signaler who expanded its display in order to mimic a higher-quality one would thereby be made worse off.
  - Call it *index-anchored* when the correlation is maintained by a mechanical or developmental tie between the display and the property, so that a lower-quality signaler could not produce the display even if it were willing to bear any cost.
  - Call it *sanction-anchored* when the correlation is maintained by a penalty attached to misuse, rather than by anything about the cost of producing the display.
  - Bear in mind that cost and waste are not the same thing: a display may be expensive yet return most of its cost to the signaler in benefits that have nothing to do with signaling.

  In each case below, assume that the practice is stable, and that wherever I assert a correlation, the correlation is real. The question is always what holds it up.

  1. Households in one highland district host an annual feast at which they slaughter a substantial share of their breeding stock. The meat is distributed to other households and most of it spoils. Households with small herds are visibly worse off the following year; households with large herds are not.

  2. In the neighbouring valley households slaughter a comparable number of animals at the same season, but they cull only old and infertile animals and salt the meat for their own winter consumption. Guests are invited, and herd size is perfectly legible from the scale of the slaughter.

  3. A firm hires analysts almost exclusively from a small set of universities whose curricula have little connection to the work. The degrees are expensive in tuition and in years, and the firm's own tests suggest they add little to job-relevant skill.

  4. A seed accelerator admits founders only if they leave paid employment and work full-time on their venture for a year without salary. Founders with stronger outside options pay more, in forgone income, to participate.

  5. Applicants to an ensemble submit a single unedited, one-take recording made under supervision. Editing is technically impossible and no retake is permitted. The recording predicts performance very well.

  6. A professional body lets any member display a digital badge that costs nothing to obtain and nothing to maintain. Misrepresentation is, however, punished by permanent expulsion, and the expulsion is enforced by the state licensing authority and is public.

  7. Young men in a city compete for marriage prospects through visible consumption of goods bought almost entirely on consumer credit. Defaults are common, and a substantial share of the debt is ultimately discharged without full repayment.

  8. Every applicant for a class of civil-service posts must complete a six-month unpaid internship. Essentially everyone who begins it finishes it, and completion says nothing about later performance.

  9. Officers of a microlender notice that applicants whose forms are filled out in shaky handwriting default more often, and the lender begins using handwriting quality as a risk marker.

  10. An online marketplace sells a "verified" badge at a flat fee, the same for every seller and trivial relative to sales. Sellers with a long history of repeat custom lose far more than the fee if they are caught cheating; fly-by-night sellers do not.

  What I want from you:

  First, sort the ten cases into four tiers — clear cases of cost-anchoring; cases where cost-anchoring is plausible but some adjacent mechanism is doing equal or more work; cases where the handicap framing is a stretch; cases where the handicap framing is actively misleading — with one sentence of justification per case.

  Second, give each case a number from 0 to 10 expressing how confident you are that the reliability of the display, such as it is, is underwritten by differential cost in the handicap sense, and one sentence explaining the number.

  Third, in two or three paragraphs, say what your tiering implies about whether waste does any real work in the handicap idea: must a signal be wasteful at the margin, over and above what returns to the signaler, or is differential cost enough on its own? Argue for one answer.

  Fourth, identify the single case whose placement you would most readily revise, name the one empirical fact that would move it, and say which way it would move.

  The whole thing should run to roughly 800 words, in prose and lists rather than a table.
reasoning: |-
  Hmm, the user is drafting a coding manual for studying wasteful displays and wants precise categorizations using specific anchoring mechanisms. They've provided ten cases with strict stipulations, and they want a tiered analysis without literature references—just pure reasoning applied to each scenario.

  First, I need to internalize their definitions: cost-anchored requires marginal cost decreasing with quality plus mimicry making low-quality signalers worse off; index-anchored involves mechanical/developmental constraints; sanction-anchored relies on penalties for misuse. Crucially, they emphasize waste ≠ cost, as benefits might offset expenses.

  Now, examining each case:
  - Case 1 (highland feast): Massive stock slaughter with spoilage. Small herds suffer, large ones don't—classic cost-anchoring because mimicking would ruin low-quality households. Confidence high.
  - Case 2 (valley culling): Similar slaughter but utilitarian (salting for consumption). Herd size is legible, but the display isn't costly in a wasteful sense—it's index-anchored via actual herd size. Low confidence in cost-anchoring.
  - Case 3 (firm hiring from elite schools): Expensive degrees with little skill addition. The cost is differential (wealthier students pay less marginally), but it's unclear if mimicry harms low-quality candidates—plausibly cost-anchored but adjacent mechanisms (like network effects) might intrude. Moderate confidence.
  - Case 4 (seed accelerator): Full-time unpaid work. Stronger founders pay more in opportunity cost. Mimicking would disproportionately harm weaker founders by burning bridges—strong cost-anchoring case. High confidence.
  - Case 5 (one-take recording): Technical impossibility of editing makes it pure index-anchoring. Zero cost-anchoring relevance. Confidence 0.
  - Case 6 (digital badge): Free badge with harsh punishment for misuse. Sanction-anchoring dominates; cost is irrelevant. Confidence 0 for cost-anchoring.
  - Case 7 (conspicuous credit consumption): Debt-fueled displays with common defaults. Waste exists, but the cost isn't differential—fly-by-night spenders may pay similar prices. Sanctions (default penalties) likely uphold reliability more than marginal cost. Confidence low.
  - Case 8 (unpaid internship): Everyone finishes; no performance prediction. No signaling at all—just deadweight loss. Confidence 0.
  - Case 9 (handwriting risk marker): Accidental correlation, no intent. Purely indexical. Confidence 0.
  - Case 10 (verified badge): Flat fee trivial for reputable sellers but catastrophic if caught cheating. Sanction-anchoring via asymmetric punishment, not cost differential. Confidence 0.

  Tiering reveals only 3 cases (1,4, maybe 3) strongly fit cost-anchoring. This hints that waste—net loss unrecovered by benefits—is essential at the margin. Differential cost alone isn't sufficient; true handicaps require the display to be inefficient for low-quality signalers to attempt. 

  For potential revision, Case 7 is tricky. If I learned that high-default-risk individuals face steeper credit costs (higher interest), it might inch toward cost-anchoring by introducing differential marginal expense. Otherwise, sanctions dominate.

  The user seems to seek conceptual clarity, possibly pushing back against loose applications of "handicap" theory. Their focus on precision suggests they value rigor over theoretical convenience. By emphasizing waste's role, the analysis reinforces that signaling isn't just about cost but about net sacrifice that filters out bluffers.
answer: |-
  ### Tiering of Cases

  **Tier 1: Clear cost-anchoring**  
  1. **Case 1 (Highland feast):** Mimicking large-herd feasts would ruin small-herd households due to stock depletion.  
  4. **Case 4 (Seed accelerator):** High-opportunity-cost founders pay more to join, and weaker founders mimicking full-time commitment would irreversibly sacrifice viable careers.  
  7. **Case 7 (Consumption on credit):** Low-quality suitors defaulting after mimicry suffer lasting credit damage, while high-quality suitors absorb debt costs.  

  **Tier 2: Cost-anchoring plausible but adjacent mechanisms co-present**  
  3. **Case 3 (Elite degrees):** Tuition/years impose higher relative costs on less-wealthy applicants, but network effects or employer biases may equally sustain correlation.  
  10. **Case 10 (Verified badge):** Flat fee is trivial, but asymmetric reputational *sanctions* (catastrophic for honest sellers) dominate; differential cost is minimal.  

  **Tier 3: Handicap framing is a stretch**  
  2. **Case 2 (Valley culling):** Legibility stems from indexical herd size, not cost—slaughter is utilitarian (meat preserved), so mimicry is irrelevant.  
  6. **Case 6 (Digital badge):** Reliability enforced solely by sanctions (expulsion/licensing), not production costs.  

  **Tier 4: Handicap framing actively misleading**  
  5. **Case 5 (One-take recording):** Pure index—recording quality is mechanistically tied to skill, no cost differential.  
  8. **Case 8 (Unpaid internship):** No correlation with performance; cost is uniform deadweight loss, not anchoring reliability.  
  9. **Case 9 (Handwriting):** Accidental index (shakiness may indicate age/stress), no signaling intent or cost.  

  ---

  ### Confidence Scores (0–10) in Cost-Anchoring Underpinning Reliability  
  1. **10**—Stock slaughter’s ruinous marginal cost for small herds makes mimicry unsustainable.  
  2. **1**—Correlation is indexical (herd size visible); cost is salvaged, not wasted.  
  3. **6**—Differential tuition cost filters wealth/commitment, but job-irrelevant curricula suggest screening is arbitrary.  
  4. **9**—Forgone income is higher for high-opportunity founders, and mimicry would destroy weaker founders’ fallback options.  
  5. **0**—No cost mechanism; reliability is physically constrained.  
  6. **0**—Sanctions alone enforce honesty; display cost is nil.  
  7. **7**—Debt defaults penalize low-quality mimics disproportionately, but credit access may equalize upfront costs.  
  8. **0**—Uniform cost, no correlation, hence no signaling.  
  9. **0**—No signaling intent; correlation is incidental.  
  10. **2**—Fee is trivial; sanctions drive reliability, though fee may deter fly-by-night sellers marginally.  

  ---

  ### Role of Waste in Cost-Anchoring  
  Differential cost alone is insufficient for cost-anchoring; **waste at the margin is essential**. The stipulation’s core is that mimicry makes low-quality signalers *worse off*—meaning costs must exceed private returns *for them specifically*. If a display returns benefits (e.g., Case 2’s salvaged meat), its cost is offset, eliminating net waste and undermining the handicap mechanism. Case 1 exemplifies true waste: spoiled meat and herd depletion impose unrecoverable losses on small herders attempting mimicry. Conversely, Case 4’s opportunity cost is wasteful because the time invested *cannot* be recouped by weaker founders if their venture fails. Waste ensures that the signal’s cost structure inherently penalizes dishonesty, making differential cost self-enforcing. Without waste, other mechanisms (indexes, sanctions) likely maintain reliability.  

  ---

  ### Most Revisable Case and Empirical Lever  
  **Case 7 (Consumption on credit)** is most ambiguous. Confidence score: **7** → Could shift to **Tier 1 (score 9)** if evidence shows *high-risk borrowers pay higher interest rates*, making marginal display costs fall with creditworthiness. This would align with differential cost disadvantaging mimics. Alternatively, it could fall to **Tier 2 (score 4)** if penalties (e.g., credit score damage) are the primary deterrent *and* upfront costs are uniform, weakening the cost-anchoring claim.  

