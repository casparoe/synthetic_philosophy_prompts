prompt: |-
  Hey — I've been going back and forth on which disputes are really disputes and which are just fights about words, and I keep catching myself applying different standards in different cases. I'd like to know whether there's a principle that actually captures what I believe, or whether some of my verdicts just have to go.

  The rough test I've been using: a dispute is merely verbal if you could hand both sides the other person's definition, have them read it, and the fight dissolves — nobody has to give up any belief about how the world is, they just both go "oh, fine, then I agree." Call it the swap test. It handles the easy cases, but I think it misclassifies a few and I can't tell whether to patch it or junk it.

  My verdicts:

  1. Hotdog/sandwich. Guy at work says a hotdog is a sandwich, I say it isn't. We agree about the bread, the sausage, the hinge, everything physical. Verdict: totally verbal, and kind of a waste of breath.

  2. Brain death. My uncle, massive stroke, no brain activity, heart still going on the ventilator. My sister says he's alive, I say he isn't. We agree about every cell in his body. Verdict: not merely verbal, and it obviously matters. But by the swap test it should be verbal — hand her my definition of death and she'll agree he's dead under it, and vice versa. So the swap test is already in trouble, or I have to introduce a category of "verbal but not trivial," which feels like the concept coming apart in my hands.

  3. Composition. My friend says there's a table in the room; I've read too much philosophy and say there are only particles arranged tablewise. We agree about all of them and their arrangement. Verdict: I want to say substantive — and it bugs me that I can't say why, because structurally this looks exactly like 1 and 2.

  4. Pluto. Astronomer says it's not a planet, my nephew is furious. They agree about the orbit, the mass, the composition. Verdict: verbal. But I also want to say the astronomer's side is *better* — not more true, just better, like the definition earns its keep. I don't know how to fit "verbal, but one side is winning" into a picture where verbal disputes are ones where both sides can be faultlessly right.

  5. Race in a medical risk model. One researcher wants the variable kept, the other wants it dropped. They agree on the genetics, the outcomes, all the social facts; neither denies anything the other asserts. Verdict: definitely not merely verbal, there's something real at stake — but the disagreement isn't factual either, it seems to be about which concept we ought to use. Someone told me this is called metalinguistic negotiation. Fine. But then what makes 5 real while 4 isn't? Both look like arguments about which concept to use, and I have opposite reactions.

  6. The one that's actually breaking my brain. A says there's a table. B says there are only simples arranged tablewise. C says there is exactly one thing, the whole cosmos. B-vs-C feels genuinely incompatible to me in a way A-vs-B doesn't — like there's a real question about how many things there are and one of them is answering it wrong. And A-vs-C also feels like a real clash. But that makes "merely verbal" non-transitive, or worse, makes it look like I've got two different notions and I'm switching between them without noticing. Is it transitive on your account, and if not, what does that tell me?

  7. Empty or mismatched concepts. Two people argue about whether witches exist: one means a woman who made a pact with the Devil and can fly, the other means a practitioner of a certain folk healing tradition. Verdict: I don't want to call it verbal at all — I want to say they aren't disagreeing, and that the first one is wrong about something. Is "not a genuine dispute" a third category, or does any principled account collapse it into one of the other two?

  So: can you state one principle, or two or three rival candidates, that gets as many of these as possible? I'd like to know which case forces which clause, what the principle predicts for cases I haven't listed (three I'm curious about: the version of case 1 where the city tax code really does exempt sandwiches but not hotdogs; a dispute between two people who don't share a language and are working through a translation; and a modal one, like two people agreeing on what a given table is made of but disagreeing about whether that very table could have been made of ice), and — most useful part — which of my verdicts it can't swallow, and why you'd rather overturn my verdict than add another clause. Also: is the swap test salvageable by bolting on a "nothing important hangs on it" condition, or does that just smuggle the normative stuff in through the back door?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're struggling with distinguishing between verbal disputes and substantive ones. Their swap test—handing each side the other's definition to see if the disagreement dissolves—works for some cases but fails in others. They provided seven scenarios where their intuition clashes with the test, and they want a unified principle to explain these.

  First, I need to analyze each case they mentioned to identify patterns. Case 1 (hotdog/sandwich) is clearly verbal; both parties agree on all physical facts. Case 2 (brain death) is trickier. They agree on the biological state, but the disagreement feels substantive because it has ethical implications. The swap test would classify this as verbal, but the user feels it's not. That suggests that stakes matter here. 

  Case 3 (composition) is similar to case 1 but feels different to the user. They think it's substantive, but why? Maybe because ontology feels more fundamental. Case 4 (Pluto) is verbal, but one definition is better due to scientific utility. Case 5 (race in medicine) involves a metalinguistic negotiation about which concept to use, and the user sees it as non-verbal because of real-world consequences. 

  Case 6 (A, B, C ontology) shows non-transitivity. A vs B might be verbal, B vs C substantive. This complicates things because the "merely verbal" label isn't consistent across pairs. Case 7 (witches) isn't even a real dispute because the concepts don't overlap. The user wants to call it a mistake, not a verbal disagreement.

  The key issues emerging are: the role of practical consequences, the depth of ontological commitment, and whether the dispute is about facts or word usage. The user needs a framework that accounts for these without being ad hoc. 

  Looking at existing theories, Chalmers' criterion of factual disagreement might help. If after fixing meanings, the dispute remains, it's substantive. But the user’s cases 2 and 5 involve normative elements, not just facts. So maybe Carnap’s framework of internal vs external questions is useful. Internal questions (within a framework) can be factual, while external ones are about choosing frameworks, which is pragmatic.

  For case 2 (brain death), the disagreement is external—choosing a definition based on ethical implications. Similarly, case 5 (race) is about which framework serves medical ethics better. Case 4 (Pluto) is internal to astronomy, so factual once definitions are set, but the choice of definition is pragmatic. 

  Case 6’s non-transitivity makes sense under Carnap. A and B might share a framework (common-sense ontology vs. mereological nihilism), so their dispute is external. But B and C have conflicting frameworks (nihilism vs monism), leading to a substantive external dispute. 

  Case 7 isn’t a dispute because the concepts don’t overlap; one is empty. The witch example shows a referential failure, so it's a factual error, not a verbal dispute.

  The user’s swap test fails when stakes are high or frameworks differ. Bolting on a "nothing important" condition might work but risks subjectivity. Instead, distinguishing factual from pragmatic/metalinguistic disputes could help. Factual disputes persist after meaning swaps; pragmatic ones don’t but involve normative choices.

  Testing this on their additional cases: the tax code case would be verbal but with real consequences, so pragmatic. The translation issue might involve mismatched concepts, leading to non-disputes. The modal table case is substantive if it's about essential properties.

  The user might need to accept that some disputes are pragmatic but non-trivial. Their verdicts mostly fit, except possibly case 3. If composition is an external question, it's pragmatic, not factual. But if the user insists it's substantive, maybe they conflate ontology with metaphysics. 

  In conclusion, the Carnap-Chalmers hybrid handles most cases by separating factual disagreements from framework choices. The swap test can be salvaged by clarifying that verbal disputes dissolve under meaning swaps, but some of these involve important pragmatic decisions. The user's intuition about stakes in cases 2 and 5 is valid, and case 6's non-transitivity is explained by framework conflicts.
answer: |-
  Your struggle is profoundly insightful—you're wrestling with the **metalinguistic minefield** where language, ontology, and pragmatics collide. The swap test is a good start but fails for high-stakes or framework-level disagreements. Here's a unified principle (with rivals) that captures your intuitions while exposing where your verdicts might need refinement:

  ---

  ### **Core Principle: The Framework-Commitment Criterion**
  A dispute is **merely verbal** iff:  
  **(1)** Parties agree on all non-linguistic facts (physical, social, historical, etc.),  
  **(2)** Their disagreement persists solely due to *semantic* differences (word meanings/concepts), **and**  
  **(3)** The dispute doesn't implicate *pragmatic commitments* (ethical, ontological, or practical stakes tied to the concept's role in a framework).  

  If (1)-(2) hold but (3) fails → **Metalinguistic negotiation** (non-verbal, pragmatic).  
  If parties don't even share a conceptual target → **Not a genuine dispute** (referential mismatch).  

  *(Hybrid of Chalmers' "factual disagreement" test + Carnap's "framework-relative" ontology)*  

  ---

  ### **Your Cases Revisited**  
  | Case | Verdict under Principle | Why Your Intuition Fits (or Clashes) |  
  |------|--------------------------|--------------------------------------|  
  | **1. Hotdog/sandwich** | Merely verbal | Swap test works: no stakes beyond taxonomy. Your verdict upheld. |  
  | **2. Brain death** | **Metalinguistic negotiation** (not merely verbal) | *Clash with swap test:* "Death" isn't just a word—it triggers legal/ethical commitments (e.g., organ donation, burial rites). Swap test misses the *consequential role* of the concept. |  
  | **3. Composition** | Merely verbal *if* no stakes | Your discomfort reveals **ontological anxiety**. If "table" is just a label for particles, it's verbal. But if you're committed to *fundamental ontology* (e.g., "Do composites exist?"), it becomes metalinguistic. Your verdict needs refinement: without stakes, it's verbal. |  
  | **4. Pluto** | Merely verbal, but **pragmatically asymmetric** | Astronomers' definition earns keep via *utility* (e.g., orbital dominance criterion clarifies solar system dynamics). "Better" ≠ "truer," but better for scientific goals. Your "winning" side fits. |  
  | **5. Race in medicine** | **Metalinguistic negotiation** | Stakes matter: keeping "race" may perpetuate harmful essentialism; dropping it may ignore health disparities. Concept choice affects real-world outcomes. Your "not verbal" verdict upheld. |  
  | **6. A/B/C ontology** | **Non-transitive by design** |  
  - A-vs-B (table): Merely verbal (different labels for same arrangement)  
  - B-vs-C (simples vs. cosmos): **Metalinguistic** if B/C have competing ontological frameworks (e.g., nihilism vs. monism).  
  - A-vs-C: Metalinguistic if "table" assumes mid-sized objects while cosmos denies parts.  
  *Non-transitivity is a feature:* verbal disputes exist *within* frameworks; metalinguistic disputes *between* frameworks. |  
  | **7. Witches** | **Not a genuine dispute** | Referential mismatch: one asserts an empty concept (flying devil-worshipper), the other a real practice. First speaker is factually wrong. Your verdict upheld. |  

  ---

  ### **Predictions for Your Curious Cases**  
  - **Tax code hotdog**: Merely verbal *but* with real-world consequences. Pragmatic asymmetry (legal definitions override colloquial ones), but still verbal—no fact disagreement.  
  - **Cross-language translation**: If concepts align (e.g., "chat" vs. "gato" for a cat), dispute dissolves with translation → verbal. If concepts mismatch (e.g., Inuit "snow" vs. English), not genuine.  
  - **Modal table (ice vs. wood)**: **Substantive**! Parties agree on actual properties but disagree about *modal* facts (essential properties). Swap test fails—handing definitions won't resolve whether identity requires material origins.  

  ---

  ### **Salvaging the Swap Test?**  
  Yes, but with a twist:  
  > **Revised Swap Test**: A dispute dissolves *only* under definition-swap **if** the concepts play identical pragmatic roles in both parties' frameworks.  

  But "pragmatic roles" smuggles in normativity (e.g., brain death's ethical role). This is unavoidable—**language is tool-like**, and disputes matter when concepts *do work* (ethical, scientific, ontological). Embrace this; don't treat it as a flaw.  

  ---

  ### **Which Verdicts Must Go?**  
  - **Case 3 (Composition)**: If no stakes (e.g., casual chat), it *is* merely verbal. Your sense of substance might stem from importing *implicit* ontological commitments (e.g., "Do tables *really* exist?"). Without those, uphold verbal verdict.  
  - **Case 6 (A-vs-B)**: Treat as verbal. Your "substantive" feeling for B-vs-C is because they clash at the *framework* level—this is metalinguistic, not factual.  

  ---

  ### **The Big Picture**  
  - **Verbal disputes**: Negotiating labels within a shared framework (hotdog, Pluto).  
  - **Metalinguistic negotiations**: Choosing frameworks with competing payoffs (brain death, race).  
  - **Non-disputes**: Talking past each other (witches).  

  **Why this works**: It respects that language isn't just about truth-conditions but *use*. When concepts are entangled with action (medicine, ethics, ontology), "merely verbal" is inadequate—even if definitions resolve the surface clash. Your intuition tracks this; the principle makes it explicit.  

  If you reject this, the only alternative is **radical descriptivism** (all disputes are verbal if definitions differ), but that vaporizes the substance in cases 2,5,6—which you wisely resist.
