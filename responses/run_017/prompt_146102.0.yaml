prompt: |-
  I sit on the model-risk committee of a regional bank, and before that on a state commission that reviewed pretrial risk instruments. Over about a dozen deployments I have voted on which fairness requirement to impose, and my votes do not line up with any single criterion. I want to know whether there is a principle behind them, or whether I have simply been inconsistent.

  I take the following as background and do not need it re-derived: when two groups differ in their base rates, a risk score cannot simultaneously be calibrated and equal in its false-positive and false-negative rates; and a parity constraint imposed on a coarse partition will generally fail on some finer partition of the same population. My question is not what the conflict is but which requirement to enforce where, and what to give up.

  My verdicts, in each case on the decision I actually voted for:

  1. A hiring screen that selects candidates for interview, with different qualification rates across groups. We required equal true-positive rates: qualified candidates equally likely to be shortlisted whichever group they belong to. Right.

  2. A fraud-investigation queue, where being flagged triggers a frozen account and an interview, again with different base rates. We required equal false-positive rates: innocent customers equally likely to be flagged. Right — even though this is the mirror image of case 1 and the mathematics is identical.

  3. A sepsis early-warning score in a hospital, shown to nurses as a number from one to ten with different guidance attached to each level. We required calibration and explicitly declined to force error-rate parity. Right.

  4. A pretrial instrument trained on arrest as its target, in a city where one district is policed far more heavily than the rest. We declined to enforce any statistical requirement on it, on the grounds that the target was itself the defect — and I stand by that even though the tool's error rates happened to be equal across groups.

  5. The same pretrial setting, but with failure-to-appear as the target. Here we did require equal false-positive rates on detention, and I think that was right even though it means that detained defendants in the two groups differ in average risk.

  6. A vendor model for our credit line that satisfied equal false-negative rates, and which we rejected anyway: for rejected applicants in one group, the only changes that would have flipped the decision were things like relocating to a different metro area, while in the other group they were things like documenting income the applicant already had. Same error rates, very different feasible routes to a different answer. I think we were right, and I do not know how to state this in the vocabulary of statistical criteria.

  7. We enforced equal false-positive rates on a coarse partition of four groups, pre-registered before the model was fit. A later analysis found a much higher false-positive rate within one narrow subgroup. I voted to leave the model alone; a colleague voted to refit against that subgroup. I think I was right — and I also think I would have voted with her had that subgroup been on the pre-registered list. This pair is the one I cannot defend.

  8. Version two of our credit model reversed the decision for a nontrivial share of customers who had done nothing differently, and it reversed them unevenly across groups. I voted to block rollout until that was reduced, although version two dominated version one on every static measure we track, including error-rate parity. My committee thought I was being precious. I want to know whether equalizing that kind of churn across groups is a fairness requirement at all, or just good operations.

  My own tentative gloss has been: equalize whichever error imposes a burden on the person who is subject to it, and fall back on calibration only when the score is an input to someone's judgment rather than a gate. But that says nothing about cases 6, 7, or 8, and I suspect it handles 1 and 2 only by luck.

  So: is there one principle, or a small set of candidates, that generates verdicts 1 through 8? Please state it precisely enough to apply, note which case motivates each clause, give its verdicts on cases I have not listed, and say plainly which of my verdicts it cannot accommodate.

  Two further things. First, do requirements of the kind in 6 and 8 make the standard conflict worse — that is, is there a reason to think no model can satisfy calibration, error-rate parity, recourse parity, and cross-version stability at once, and if so which of the four should yield first, and why that one? Second, the case I keep going back and forth on: rather than choosing which parity to enforce, we could randomize. Applicants in a band around the threshold would get a weighted coin flip, with weights set per group so that both error parities hold in expectation, at some cost in accuracy. I cannot tell whether this is a cheat — it makes each individual's outcome partly a lottery — or whether it is the honest reply to the fact that our criteria jointly overdetermine what we are asking for. What does the principle say?
reasoning: |-
  Hmm, the user is a professional on model-risk committees with deep experience in fairness issues for predictive models. They've listed 8 specific cases where they made fairness decisions and are questioning whether there's a consistent principle behind their judgments. This is clearly someone who understands the technical trade-offs (like the base rate conflict) but is wrestling with practical implementation.

  Breaking this down: Their cases cover hiring (1), fraud detection (2), healthcare (3), pretrial risk (4-5), credit scoring (6,8), and subgroup fairness (7). Their stated tentative principle focuses on burden of errors and calibration as fallback, but admits it fails for cases 6-8. 

  Key observations from their cases:
  - They consistently protect the vulnerable party: job seekers (1), innocent customers (2), patients (3), defendants (5)
  - They reject technical parity when it masks unfair realities (4: biased arrest data; 6: unequal recourse; 7: post-hoc subgroups)
  - They care about longitudinal fairness (8: model churn) and feasibility (6: actionable variables)

  The core tension seems to be between three layers:
  1) Individual fairness (recourse, burden)
  2) Group fairness (statistical parity)
  3) System legitimacy (avoiding compounding bias)

  Their cases suggest a hierarchy where protection from direct harm (detention, lost opportunity) trumps statistical parity, which in turn trumps calibration. Cases 4 and 6 show they'll reject even "fair" models if the inputs or outputs perpetuate injustice.

  For their specific questions:
  - The "recourse parity" in case 6 and stability in 8 likely create new trade-offs beyond the classic impossibility. Feasible recourse might conflict with calibration if marginalized groups face structural barriers.
  - Randomization around thresholds could be justifiable as a "veil of ignorance" approach when fundamental conflicts exist, but risks perceived arbitrariness. Their principle would support it only when burdens are comparable.

  The unifying thread might be: "Minimize imposed burdens that the subject cannot reasonably avoid, using the least random method possible." This explains:
  - Burden focus in 1-2-5
  - Accepting calibration in 3 (clinical judgment)
  - Rejecting models in 4/6 (unavoidable burdens)
  - Permitting coarse groups in 7 (if predefined)
  - Opposing churn in 8 (arbitrary burden shifts)

  Case 7 remains tricky - their position suggests procedural fairness (pre-registration) matters as much as outcome fairness. That's actually very consistent with legal traditions.

  For implementation, they need a decision tree that starts with: "Who bears the burden? Can they control it? Is the burden irrevocable?" Then consider error types, then data quality. Their case 4 shows they already do this instinctively by rejecting poisoned data upfront.

  The colleague disagreement in 7 is philosophical: whether fairness is contractual (bound by pre-registration) or consequentialist (always minimize worst subgroup harm). Their view leans contractual, which is defensible for auditability.
answer: |-
  Your verdicts reveal a consistent, principled approach centered on **contextual harm mitigation and procedural legitimacy**, not statistical parity alone. Below is the formalized principle, its application to your cases, and responses to your additional questions.

  ---

  ### **The Unified Principle**
  **Minimize irrevocable burdens imposed by system errors, prioritizing:**
  1. **Direct harm prevention** (cases 1, 2, 4, 5, 6, 8);  
  2. **Procedural fairness** in model deployment (cases 3, 7);  
  3. **Feasibility of recourse** for affected individuals (case 6).  

  Where burdens conflict, prioritize:  
  - **Marginalized groups** facing systemic barriers (cases 1, 2, 4, 5, 6);  
  - **Irreversible decisions** (detention, denial of critical services) over reversible ones;  
  - **Pre-specified, auditable rules** over post-hoc adjustments (case 7).  

  Calibration is secondary unless scores inform human judgment (case 3).  

  ---

  ### **Application to Your Cases**
  | Case | Your Verdict | Principle’s Verdict | Motivation |  
  |------|--------------|---------------------|------------|  
  | 1    | Equal TPR (qualified candidates shortlisted equally) | **Agree** | Burden: Qualified candidates lose opportunity. Equal TPR prevents exclusion of qualified marginalized applicants. |  
  | 2    | Equal FPR (innocent customers equally likely to be flagged) | **Agree** | Burden: Innocent customers face frozen accounts. Equal FPR prevents disproportionate harassment of low-risk groups. |  
  | 3    | Calibration (no error-rate parity) | **Agree** | Burden: Misdiagnosis harms patients, but nurses use scores as inputs. Calibration supports clinical judgment. |  
  | 4    | No parity (arrest target flawed) | **Agree** | Burden: Tool perpetuates policing bias. No parity is defensible as the target is illegitimate. |  
  | 5    | Equal FPR for detention | **Agree** | Burden: Innocent defendants jailed. Equal FPR prevents systemic over-detention of one group. |  
  | 6    | Rejected despite equal FNR | **Agree** | Burden: Rejected applicants lack feasible recourse. "Feasible routes" disparity violates harm mitigation. |  
  | 7    | No refit for unregistered subgroup | **Disagree** | Burden: High FPR subgroup suffers harm. Principle prioritizes harm mitigation over procedural rigidity. *You were inconsistent here.* |  
  | 8    | Blocked rollout due to uneven churn | **Agree** | Burden: Arbitrary reversals create distrust. Stability is a fairness requirement for high-stakes decisions. |  

  **Inconsistency in Case 7**: Your vote prioritized pre-registration (procedural fairness) over harm to the subgroup. The principle demands harm mitigation first, especially for unanticipated marginalized subgroups. Had the subgroup been pre-registered, blocking refit would still violate burden minimization.

  ---

  ### **New Cases: Verdicts by the Principle**
  1. **College Admissions**: Model favors Group A (higher graduation rates). *Require equal FNR* — burden of denying qualified applicants outweighs calibration.  
  2. **Emergency Room Triage**: Score predicts mortality. *Require calibration* — clinicians need accurate probabilities to allocate scarce resources.  
  3. **Payday Lending**: Model denies loans to high-risk groups. *Reject model* if feasible recourse (e.g., alternative products) isn’t equally accessible.  

  ---

  ### **Answers to Additional Questions**
  **1. Do recourse parity (case 6) and stability (case 8) worsen the fairness conflict?**  
  Yes. **No model can satisfy all four requirements simultaneously** (calibration, error-rate parity, recourse parity, stability). Trade-offs are inevitable:  
  - **Recourse parity** requires actionable features equally available across groups—often impossible due to structural inequities (e.g., "relocate" vs. "document income").  
  - **Stability** conflicts with calibration if base rates shift between model versions.  
  **Which should yield?**  
  - Prioritize **recourse parity** over error-rate parity when decisions are irreversible (e.g., credit denial).  
  - Prioritize **stability** over calibration in high-churn contexts (e.g., credit models) to prevent arbitrary harm.  
  - Abandon **calibration** first if human judgment mediates the score (e.g., clinical settings).  

  **2. Should we randomize near the threshold?**  
  **Yes, but only as a last resort** when:  
  - Burdens are *non-lethal* (e.g., hiring, credit) and comparable across groups;  
  - Core requirements (recourse, stability) are already met.  
  **Why?**  
  - Randomization *is* a fairness tool: It honestly confronts overdetermined criteria by equalizing expected error rates.  
  - But it fails harm minimization: A job applicant might lose to a coin flip, violating "feasible routes" (case 6). Use only when features are equally actionable.  
  **The principle says**: Randomize *only* if burdens are non-permanent and no group is systematically disadvantaged by the coin’s weight.  

  ---

  ### **Which Verdicts Conflict with the Principle?**
  - **Case 7 is the sole inconsistency**. The subgroup’s high FPR imposes a burden (e.g., wrongful flags), demanding intervention regardless of pre-registration.  
  - All other verdicts align: You prioritized harm (cases 1–6, 8), even when it defied statistical parity (3, 4, 6) or operational convenience (8).  

  ---

  ### **Conclusion**
  Your approach is **principled, not inconsistent**. The core is **mitigating context-specific harms**—not optimizing abstract metrics. Case 7 aside, your votes reflect deep awareness that fairness is defined by the stakes for human lives and opportunities, not mathematical symmetries. When in doubt, ask: *"What burden does this error impose, and can the affected person reasonably overcome it?"* That question resolves most conflicts—and exposes when a model is too flawed to deploy.
