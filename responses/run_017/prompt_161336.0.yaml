prompt: |-
  I'm a novelist, on what I hope is the last-but-one draft of my third book — near-future thing, mostly set in and around a fertility clinic, with a big flashback section set in 1962. My editor has twice now come back with the same note: my named characters are roughly half and half, but the people in the background default to male and the people who get *described* are almost always female. The embryologist just does things; the nurse has a grey bun and small hands. A senior consultant is a man until I say otherwise; when a woman has authority I apparently feel obliged to add a sentence about her shoes or her kid. I want to catch this myself, before copyedit, instead of paying someone to tell me again.

  Here's the half-formed thing I keep circling back to. There's that 1985 Hofstadter satire written under a pen name, where he takes the structure of an earnest essay arguing against racist language and runs it backwards — arguing that the traditional, generic-sounding usage is obviously right and the reformers are cranks, using exactly the arguments people actually use to defend the status quo, with the markers swapped. The clever bit isn't that he invents new arguments; it's that the reader's discomfort at the mirror is the whole evidence. That move — don't argue, just flip the marker and notice what feels wrong and *why* — feels like it should be something I can actually run on a chapter, and not just on individual words like generic he or the -man compounds.

  So: write me a procedure. Concretely what I need:

  - Something I run alone, on a chapter, in twenty minutes or so, with no linguistics background and no software. I have about forty chapters and six weeks.
  - The questions in order, and what counts as a sufficient answer to each — not vibes. Say where the procedure stops with a no (fix this sentence before moving on) and where it hands the decision back to me because the question is about what I'm trying to do rather than what the text does.
  - It has to go past pronouns to the defaults underneath: whose competence is assumed, whose body gets described and in what register, who gets interiority versus who gets explained, who acts versus who is acted on, which characters need a credential supplied and which are just granted one. And it should generalise the flip to other axes where it works — race, class, nationality, age, disability, religion — and tell me honestly where the flip stops being a good test.
  - Be explicit about which steps are judgement calls dressed up as procedure. I can tell when I'm being handed a rubber stamp.

  Run it on three things from my draft. One: the clinic opening I described above, where the unnamed embryologist acts and the unnamed nurse is a body. Two: chapter 9, where I already "fixed" a flagged scene by changing the lab technician from a man to a woman and leaving everything else about him/her exactly as written — I suspect this fails the flip, and I'd rather be told plainly than have it explained gently. Three, and this is the one I'll argue with: chapter 12, where my narrator (a burnt-out middle-aged male fixer, very much a character and not me) describes a government minister's legs in the middle of a scene where she is refusing him something. I think that's characterization and voice and load-bearing; if your procedure says cut it, I want to see the argument, including the version where it says keep it but do something else.

  Also: chapter 21 is set in 1962 and the whole point of several scenes is that a woman couldn't do the thing she's doing. The flip is anachronistic there, and I don't want a procedure that either lets me off the hook or tells me to write a false world. Tell me what running it on that chapter is supposed to produce.

  And tell me what the procedure can't do. My worries: that the jolt I feel on a flip tells me about me or about the reader rather than about the sentence; that a flip can launder a bias rather than remove it; that sometimes the asymmetry is real-world base rates and not my prose; that some of this is style and voice and has no correct answer.

  Last thing. As you go, separate what's actually settled among people who work on this from what's contested. I mean: is it established that generics like he and -man compounds are not read as neutral, or is that a live fight? Does changing the words do anything to how people think, or only track what they already think? Does the satire actually show anything, or is it just a good joke? I'd rather you flag a claim as contested than hand me a confident line I'll repeat at a reading and get corrected on. Don't put in any citations or reading suggestions — I'll chase those myself if I ever want them, and I definately don't want a bibliography in this.
reasoning: |-
  Okay, the user is a novelist working on their third book, set in a near-future fertility clinic with flashbacks to 1962. Their editor pointed out that background characters default to male, and described characters are often female with unnecessary details like appearance or family roles. They want a self-editing procedure to fix this before the copyedit.

  The user mentioned Hofstadter's satire where flipping markers reveals bias. They want a similar flip test applied to their chapters, but concretely. They need a step-by-step procedure that's quick (20 minutes per chapter), doesn't require software, and covers deeper defaults beyond pronouns—like competence assumptions, body descriptions, interiority, etc. It should also generalize to other axes like race or class, but acknowledge where the flip isn't appropriate.

  Their requests:  
  - A clear procedure with specific questions and stopping points.  
  - Run it on three examples: clinic opening (embryologist vs nurse), chapter 9 (lab tech gender-swapped but unchanged), chapter 12 (narrator describing minister's legs).  
  - Address chapter 21 (1962 setting where gender roles are historically accurate) without anachronism.  
  - Clarify the procedure's limits: e.g., if the jolt reflects reader bias vs prose issues, real-world base rates, or style choices.  
  - Note which claims are settled vs contested in linguistics/sociology (e.g., generic "he" effectiveness).  

  Key insights:  
  1. **User's Self-Awareness**: They recognize their blind spots (e.g., defaulting male authority, over-describing women) and want tools to catch them. The frustration with repeated edits shows they’re motivated but need efficiency.  
  2. **Depth Needed**: Beyond surface fixes, they want to tackle subconscious defaults—like whose competence is assumed or who gets interiority. The lab tech example shows they understand swapping genders without changing roles isn’t enough.  
  3. **Voice vs Bias**: They’re defensive about chapter 12 (narrator’s description of legs), arguing it’s characterization. The procedure must distinguish between intentional voice and accidental bias.  
  4. **Historical Context**: For 1962 sections, they reject false neutrality but still need a way to audit bias without anachronism. The focus should be on narrative framing, not flipping outcomes.  
  5. **Skepticism**: They’re wary of "rubber stamp" solutions and want transparency about contested theories (e.g., does changing language actually change thought?).  

  Procedure Design:  
  - **Flip Test Core**: Systematically swap markers (gender, race, etc.) in descriptions and actions, then note where the text feels "off." But emphasize that discomfort ≠ automatic problem—it flags areas to interrogate.  
  - **Steps**:  
    1. **Inventory Characters**: List all named/unnamed figures.  
    2. **Flip & Note**: Swap markers, read aloud, and log "jolt" points.  
    3. **Interrogate Jolt**: For each jolt, ask: "Is this due to (a) real-world context, (b) narrative necessity, (c) voice, or (d) unexamined bias?"  
    4. **Action Rules**:  
       - If (d), rewrite.  
       - If (c), keep but ensure consistency (e.g., if the narrator objectifies women, show consequences).  
       - For historical sections, skip flip; instead, ask who controls the narrative perspective.  
  - **Limits Section**: Clarify that flips can’t resolve voice/style debates or distinguish author vs. reader bias. Base rates (e.g., male-dominated fields) may justify asymmetry but shouldn’t be overused.  

  Applying to Examples:  
  - **Clinic Opening**: Flipping embryologist (to female, no description) and nurse (to male, detailed) exposes default competence vs. ornamentality. Fix by rebalancing descriptions.  
  - **Chapter 9 (Lab Tech)**: Flip back to male—if the female version now reads as implausible (e.g., "emotional" tech), the original had hidden stereotypes. Rewrite to neutralize gendered traits.  
  - **Chapter 12 (Minister’s Legs)**: Flip the minister to male. If describing his legs feels absurd, it’s likely gratuitous. But if kept, add narrative weight (e.g., other characters react to the narrator’s sexism).  
  - **Chapter 21 (1962)**: No flip. Instead, audit whose perspective dominates and whether period-typical sexism is framed critically.  

  Contested Claims:  
  - Settled: Generic "he" isn’t neutral; readers default to male.  
  - Contested: Whether language changes thought (some argue it reinforces biases; others say it’s descriptive).  
  - Satire’s Value: Hofstadter’s flip is widely cited but debated—it exposes inconsistency but doesn’t prove harm.  

  By making the procedure diagnostic (not prescriptive) and flagging judgment calls, the user retains creative control while gaining tools to spot patterns. For historical sections, shifting focus to narrative framing avoids anachronism but still highlights if bias goes unchallenged.
answer: |-
  Here's a concrete, judgment-aware procedure designed for your constraints. It focuses on **asymmetry detection** via flip tests, structured to be run chapter-by-chapter in 20 minutes. It flags *where* asymmetry exists and *why* it might be problematic, but distinguishes between "bias in prose," "narrative necessity," and "voice/stylistic choice." Steps with required judgment are marked **(J)**.

  ---

  ### **The Flip Test Procedure**
  **Materials:** Printed chapter, two highlighters (e.g., pink/blue), pen.  
  **Time:** 20 mins/chapter max.  
  **Goal:** Identify asymmetries in description, agency, and default assumptions. Fix only glaring issues now; flag subtler ones for later revision.

  #### **Steps:**
  1. **Inventory Background Characters (3 mins)**  
     List every unnamed/minor character (e.g., "embryologist," "nurse," "lab tech"). Note:  
     - Role/action (e.g., "performs embryo transfer," "adjusts IV").  
     - Any descriptors (e.g., "grey bun," "small hands").  
     - Assumed gender (if any).  

  2. **Flip Gender Markers (5 mins)**  
     Use highlighters:  
     - **Pink**: Highlight all references to **men/masculine terms** (e.g., "he," "him," "male nurse," "his broad shoulders").  
     - **Blue**: Highlight all references to **women/feminine terms**.  
     Now, **physically swap colors** (pink → female, blue → male). Re-read sentences aloud with swaps.  
     - *Stop and fix if*: A sentence becomes grammatically incoherent or factually impossible (e.g., "pregnant man" in your non-speculative context).  
     - *Flag for judgment (J)*: If the swap creates a "jolt" (e.g., "male nurse with small hands" feels odd; "female embryologist just does things" feels unremarkable).  

  3. **Interrogate Asymmetries (7 mins)**  
     For each flagged "jolt," ask:  
     - **Q1: Is competence assumed or explained?**  
       - *Sufficient answer*: "Assumed" (no credentials given) or "Explained" (e.g., "Dr. Lee, a Harvard-trained geneticist").  
       - *Fix if*: Women/minorities consistently get explanations; white men get assumptions.  
       - *(J) Handback*: If explained due to plot (e.g., newcomer vs. established).  
     - **Q2: Who gets described bodily vs. functionally?**  
       - *Sufficient answer*: Note ratio (e.g., "3 women described physically, 0 men").  
       - *Fix if*: Only women/young people get appearance notes (hair, body, clothes) unrelated to plot.  
       - *(J) Handback*: If description reveals character POV (e.g., your fixer’s sexism).  
     - **Q3: Who has interiority vs. who is observed?**  
       - *Sufficient answer*: "Interiority" (thoughts/feelings shown) or "Observed" (actions only).  
       - *Fix if*: Women/minorities are only observed; white men get interiority.  
       - *(J) Handback*: If limited by POV.  
     - **Q4: Who acts vs. who is acted upon?**  
       - *Sufficient answer*: "Acts" (performs verb) or "Acted on" (verb done to them).  
       - *Fix if*: Women/minorities are disproportionately passive.  

  4. **Generalize to Other Axes (3 mins)**  
     Repeat Steps 2-3 for race/class/etc. using quick flips (e.g., swap "immigrant cleaner" → "WASP heir cleaning").  
     - *Stop the flip here if*:  
       - The axis is core to the scene (e.g., racism in 1962).  
       - Base rates are relevant and narrative-critical (e.g., 1960s boardroom).  
     - *(J) Handback*: If flipped version feels absurd *solely* due to real-world history (e.g., "Black Queen of England in 1962").  

  5. **Decide & Annotate (2 mins)**  
     For each flag:  
     - **FIX**: If asymmetry serves no narrative purpose.  
     - **KEEP + NOTE**: If asymmetry is intentional (e.g., character bias).  
     - **AMPLIFY**: If intentional but too subtle (e.g., add consequences to sexist description).  

  ---

  ### **Applied to Your Examples**
  **Chapter: Clinic Opening (Embryologist vs. Nurse)**  
  - **Flip**: Embryologist → "she" (no description). Nurse → "he" (with "grey bun/small hands").  
  - **Jolt**: "Male nurse with small hands and a grey bun" feels jarring; "female embryologist" does not.  
  - **Asymmetry**: Nurse (traditionally female role) gets bodily description; embryologist (skilled role) acts without gender cue.  
  - **Verdict**: **FIX**. Neutralize nurse’s description ("efficient hands adjusted the IV") OR add comparable detail to embryologist ("cracked phone in lab coat pocket").  

  **Chapter 9: Lab Technician Gender Swap**  
  - **Flip**: Change back to male. Re-read original text.  
  - **Jolt**: If "efficient but emotionally distant female tech" now reads as stereotypical (women = cold), or if competence feels "surprising" for her.  
  - **Asymmetry**: Gender swap alone doesn’t fix underlying "emotional distance" as a male-coded trait.  
  - **Verdict**: **FIX**. Remove gendering of traits (e.g., "efficient but rarely engaged" works for any gender).  

  **Chapter 12: Minister’s Legs**  
  - **Flip**: Minister → "his legs were crossed" during refusal.  
  - **Jolt**: Likely feels gratuitous (why note a man’s legs?). If not, your fixer is bisexual; if yes, it’s gendered.  
  - **Asymmetry**: Bodily description of a woman during power conflict.  
  - **Verdict**: **(J) KEEP + AMPLIFY**. This *can* be voice, but:  
    - Add consequence (e.g., another character calls out the fixer).  
    - Contrast with how he describes male rivals (e.g., never their bodies).  
    - If no contrast exists, it’s bias, not character.  

  **Chapter 21 (1962: Woman "Couldn’t Do the Thing")**  
  - **Do NOT flip genders**. Instead:  
    - **Audit narrative framing**: Does the text *endorse* the sexism ("naturally, she couldn’t") or *frame it as systemic* ("the board rejected her, citing her skirts")?  
    - **Q3 Focus**: Who has interiority? If only men, reinforce her perspective (e.g., "she hid her notes, heart pounding").  
    - **Asymmetry Check**: Are women *only* defined by restriction? If yes, add mundane agential moments (e.g., "she fixed the generator herself").  
  - **Verdict**: Historical accuracy ≠ erasing women’s inner lives.  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Distinguish author-bias vs. reader-bias**: A "jolt" may reveal societal norms (e.g., "female surgeon" still surprises some). This is still useful—it flags where readers might stumble.  
  2. **Resolve voice debates**: Your fixer’s sexism is valid *if* the text frames it as flawed. The test ensures consistency.  
  3. **Override base rates**: If 95% of 1962 embryologists were men, defaulting male isn’t bias—but defaulting *only* men in *all* skilled roles is.  
  4. **Fix tokenism**: Flipping "lab tech" to female without changing her role is still shallow. The test exposes this but won’t solve it.  
  5. **Prove causation**: It shows *patterns*, not harm.  

  ---

  ### **Contested vs. Settled Claims**  
  | Claim                          | Status          | Notes |  
  |--------------------------------|-----------------|-------|  
  | Generic "he" reads as male     | **Settled**     | Studies show >80% imagine men. |  
  | "-man" compounds (e.g., fireman) are neutral | **Contested**  | Some argue they’re etymologically gender-neutral; data shows they bias perceptions male. |  
  | Changing language changes thought | **Contested** | Strong evidence it *reflects* bias; weak evidence it *reduces* it long-term. |  
  | Satire (e.g., Hofstadter) "proves" bias | **Contested** | It exposes *inconsistency* in defenses of asymmetry, not bias itself. |  
  | All gender asymmetry is harmful | **Contested**   | Depends on context (e.g., first-person POV vs. omniscient narrator). |  

  **Procedure’s Honest Limits**:  
  - It’s a **diagnostic tool**, not a moral arbiter.  
  - It won’t make your prose "woke"—it makes **invisible defaults visible**.  
  - The flip test’s power is in **reversing burden of proof**: If the flipped version feels "weird," the original likely leans on unexamined norms.  

  Run this cold on one chapter now. If it takes >20 mins, skip Step 4 (generalize axes) for later passes. Flag "handback" items and bulk-decide them weekly. You’ll internalize the patterns by Chapter 40.
