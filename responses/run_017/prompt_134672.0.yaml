answer: |-
  **International Board of Aesthetic Arbitration (IBAA)**  
  **Handbook for Examination of Qualified Critics (Revision 7.3)**  
  **Section II: Certification of True Judges**  

  1. **Purpose**: This document establishes criteria and procedures for certifying individuals as "True Judges" (TJs) pursuant to the Hume Standard (HS-1757), authorized to issue binding verdicts in aesthetic disputes. Certification confirms possession of the Five Marks: (a) Strong Sense, (b) Delicacy of Sentiment, (c) Practice, (d) Comparison, and (e) Freedom from Prejudice.  

  2. **Definitions**:  
     2.1. "Sentiment" denotes the pleasurable or unpleasurable mental impression arising during contemplation of an aesthetic object.  
     2.2. "Qualified Critic" (QC) is synonymous with "True Judge" and requires current IBAA certification.  

  3. **Examiner Qualification**:  
     3.1. All examiners must themselves hold valid QC status.  
     3.2. *Transitional Provision (TP-1782)*: Examiners appointed prior to 1 January 1782 are provisionally deemed QCs pending successful completion of the current examination framework.  
     3.3. *Equivalency Pathway (EP-1785)*: Practitioners with 20+ years of documented arbitration in recognized aesthetic tribunals may apply for examiner roles without prior QC certification, subject to Panel Review (See Form IBAA-EP1).  

  4. **Candidate Requirements**:  
     4.1. Candidates must demonstrate sustained engagement in aesthetic contemplation across no fewer than three recognised schools (e.g., Classical, Gothic, Oriental) and two temporal periods (Pre-1600, Post-1600).  
     4.2. Documentation of Practice (Form IBAA-PR7) must detail no less than 1,000 hours of logged judgment across diverse media.  

  5. **Examination Structure (Modules A-E)**:  
     **Module A: Strong Sense**  
     5.1. Candidates analyse 10 disputed artworks/texts, identifying logical inconsistencies in popular objections. Passing requires 90% concordance with pre-validated examiner responses.  

     **Module B: Delicacy of Sentiment**  
     5.2. Candidates are exposed to sensory stimuli (olfactory, auditory, visual) of graded subtlety (e.g., wine infused with trace elements ≤0.005ppm; obscured brushstrokes in chiaroscuro).  
     5.3. *Rubric B.3*: Reported sentiment must align with stimulus properties as defined by the examiners. Non-detection of pre-registered subtle qualities (e.g., iron/leather notes in liquid media) constitutes failure regardless of reported pleasure/displeasure.  
     5.4. Candidates failing B.3 must undertake 200 hours of Remedial Sensitivity Training (RST) before re-sitting.  

     **Module C: Practice**  
     5.5. Candidates submit portfolios evidencing 1,500+ hours of judgment (per 4.2).  
     5.6. *Note*: Hours accrued during preparatory practice for Module C cannot be counted toward the 1,500-hour requirement.  

     **Module D: Comparison**  
     5.7. Candidates compare artworks stripped of all contextual data (author, date, genre, nationality) to ensure Freedom from Prejudice (per 5.9).  
     5.8. Candidates must articulate distinctions and resemblances across "diverse periods and styles" (see 4.1) while adhering to 5.7’s information embargo.  
     5.9. *Conflict Resolution Protocol (CRP-1780)*: Where comparison necessitates contextual knowledge (5.7) but prejudice mitigation prohibits it (5.8), the examiner’s verdict on stylistic period adherence supersedes candidate testimony.  

     **Module E: Freedom from Prejudice**  
     5.10. Assessed via blind analysis of contentious works (e.g., works by authors of disputed reputation, heretical texts, modern innovations).  
     5.11. Candidate sentiments must not correlate statistically with known biographical, temporal, or sectarian affiliations of the work’s origin (determined by examiner consensus).  

  6. **Recursive Certification Protocol (RCP)**:  
     6.1. Final certification requires unanimous approval from three examining QCs.  
     6.2. Examination scripts from Modules B and E are subject to random audit by the Grand Panel (itself composed of QCs certified under TP-1782 or EP-1785).  

  7. **Provisional Practice Clause (PPC)**:  
     7.1. Candidates who have passed Modules A, B, and C may apply for *Provisional Arbitrator* status (Form IBAA-PA2), permitting limited aesthetic testimony pending full certification.  
     7.2. Provisional Arbitrators must not cite Hume’s Standard in official determinations and must disclose their non-QC status in all testimony.  

  8. **Continuing Qualification**:  
     8.1. QCs must revalidate certification every five years via submission of 500+ hours of fresh comparative judgment logs (per 4.1, 4.2) and audit of Prejudice Mitigation (Module E).  

  ---  
  **(Word count: 558)**  
  *Handbook Note: All forms referenced herein are available from the IBAA Registrar. Non-compliance with procedural requirements voids candidacy. Decisions of the IBAA Examinations Board are final.*
