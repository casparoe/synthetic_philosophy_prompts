     We can have a leaf for "Structural expansionism: trend flat or worsening" if the answers to the measure questions lead to that conclusion.

  - **Leaf 6: Moral-patient expansionism**: Q3=Yes and then the killing of animals has increased, so overall violence has increased.

  - **Leaf 7: Absolutism**: Q10=No: absolute numbers matter, so if the absolute number has risen, violence has increased even if the rate fell.

  - **Leaf 8: A leaf for those who focus on the sub-population**: If Q7=sub-population and the rate in that group has not fallen, then violence has not declined.

  We must also have a leaf for the "no fact of the matter" which is Leaf 1 (pluralism). And we distinguished it from evidentiary problems.

  Now, we write the tree with node IDs and then the leaves.

  We'll assign:

  - Q1: Meta
  - Q2: Structural violence (case g)
  - Q3: Non-human animals (case d)
  - Q4: Deterrence (case a)
  - Q5: Event concentration (case f)
  - Q6: Time unit (case b)
  - Q7: Sub-population (case h)
  - Q8: Tail risk (case e)
  - Q9: Substitution (case c)
  - Q10: Absolute vs rate (case k)

  And the leaves at the end of the paths.

  ### Leaves

  We'll define the leaves by the minimal set of answers that lead to them and the trend assessment given the suppositions.

  The suppositions we are granting:

  - For declinism, we assume the data show a decline in the chosen measure.
  - For structural expansionism, we assume structural violence is flat or worsening.
  - For moral-patient expansionism, we assume animal killings have increased.
  - For tail risk, we assume tail risk has increased.

  So the leaves are:

  1. **Leaf 1: Pluralism**  
     - Path: Q1: No  
     - Awkward commitment: There is no fact of the matter about whether violence has declined, so any empirical study claiming to show a decline is either measuring one part of a cluster or imposing a contestable definition.

  2. **Leaf 2: Straightforward declinism**  
     - Path: Q1: Yes, Q2: No, Q3: No, Q4: Prevented, Q5: Same, Q6: Annual risk, Q7: Overall rate, Q8: Expected deaths, Q9: Yes, Q10: Yes  
     - Minimal set: Restricted scope (Q2: No, Q3: No), expected harm (Q4: Prevented), victim count (Q5: Same), per person-year (Q6: Annual), overall population (Q7: Overall), expectation (Q8: Expected), no substitution (Q9: Yes), rate (Q10: Yes).  
     - Awkward commitment: Must deny that violence has increased in any dimension not captured by the restricted measure (e.g., structural violence, animal suffering) and must accept that deterrence reduces violence even if it involves threats.

  3. **Leaf 3: Tail risk pessimism**  
     - Path: Q1: Yes, Q8: Tail risk, and the supposition that tail risk has risen.  
     - Minimal set: Q8: Tail risk.  
     - Awkward commitment: Even if the expected harm has fallen, the increased risk of catastrophe means the world has become more violent.

  4. **Leaf 4: Substitution scepticism**  
     - Path: Q1: Yes, Q9: No  
     - Minimal set: Q9: No  
     - Awkward commitment: The state's monopoly on violence does not reduce violence but merely relocates it (e.g., to prisons), so apparent declines in interpersonal violence are illusory.

  5. **Leaf 5: Structural expansionism (flat or worsening)**  
     - Path: Q1: Yes, Q2: Yes, and then answers such that the trend in structural violence dominates and is flat or worsening (supposition).  
     - Minimal set: Q2: Yes (structural violence included) and Q3: No or Yes? If Q3: No, then only human structural violence. If Q3: Yes, then we also have animals, but we have a separate leaf for animals. We need to separate.  
     - We can have two leaves:  
          - **Leaf 5a: Human structural expansionism**: Q2: Yes, Q3: No, and then the measure is such that the trend is flat or worsening (supposing the data).  
          - **Leaf 5b: Moral-patient expansionism**: Q3: Yes (regardless of Q2) and then the measure includes animals, and the trend is upward (supposition).  

     But note: if Q3: Yes, then we are including animals and their killing has increased, so the trend is upward. We can make that a separate leaf.

     So:

     - **Leaf 5: Human structural expansionism**:  
          - Minimal set: Q2: Yes, Q3: No  
          - Awkward commitment: Must hold that direct violence may have declined but structural violence (e.g., economic deprivation) has not, so overall violence is flat or up.

     - **Leaf 6: Moral-patient expansionism**:  
          - Minimal set: Q3: Yes  
          - Awkward commitment: The massive scale of animal suffering in modern agriculture means that violence has sharply increased, even if human violence has declined.

  6. **Leaf 7: Absolutism**  
     - Path: Q1: Yes, Q10: No  
     - Minimal set: Q10: No  
     - Awkward commitment: A falling rate of violence does not constitute a decline if the absolute number of victims has risen (e.g., due to population growth).

  7. **Leaf 8: Sub-population focus**  
     - Path: Q1: Yes, Q7: Sub-population, and the supposition that the rate in that group has not fallen.  
     - Minimal set: Q7: Sub-population  
     - Awkward commitment: The experience of the most at-risk group (e.g., young men in conflict zones) is more important than the overall average, so violence has not declined for those most exposed.

  We also need a leaf for those who use lifetime risk (Q6: Lifetime) and if the lifetime risk has increased, then violence has increased? We can call it:

  8. **Leaf 9: Lifetime risk increase**  
     - Minimal set: Q6: Lifetime risk and the supposition that lifetime risk has increased (case b: constant annual risk and longer life -> lifetime risk up).  
     - Awkward commitment: Even if the annual risk of violence falls, if life expectancy increases enough to make the lifetime risk higher, then violence has increased.

  And we might have a leaf for those who think that concentrated events are worse (Q5: Greater) and if such events have increased, then violence has increased? But we don't have a supposition on that. We can omit.

  We have 9 leaves. We can try to collapse.

  The routing table will show the path to each leaf.

  ### Diagnostics

  We list combinations that are allowed by the dimensions but not occupied (or very rare), and why.

  1. **Combination**: Expanded scope (structural violence) but not including non-human animals (Q2: Yes, Q3: No), and then using a denominator of moral patients (which would only be humans). But then we might have a leaf for that. We do (Leaf 5). Not a problem.

     However, one unexplored combination might be: using tail risk for structural violence? It's possible but not common.

  2. **Combination**: Focus on tail risk but only for a sub-population. This is coherent but unexplored.

  3. **Combination**: Including non-human animals but then using a per whole life denominator for them. This might be incoherent because animals have different life expectancies and we don't usually consider their whole lives in the same way.

     Verdict: incoherent or at least unattractive because of practical difficulties.

  4. **Combination**: Pluralism combined with a specific measure. But pluralism is defined as rejecting a single measure, so that's incoherent.

  5. **Combination**: Using expected harm (deterrence reduces violence) but then also including held-in reserve threats as violence. This might be incoherent because if a threat is held in reserve, it is a form of violence, but deterrence by threat would then be violence and not a reduction.

     Verdict: incoherent.

  Now, indistinguishable leaves: We might have two paths leading to the same leaf. For example, both a restricted scope and expanded scope might end up in the absolutism leaf if they answer Q10: No. But that's fine.

  Order-dependence: The tree has order. For example, if we ask about non-humans (Q3) before structural violence (Q2), it might change the answers? But we fixed the order.

  The node most likely to be mis-answered: Q4 (deterrence). Participants who know the debate might associate "prevented" with the declinist narrative and "held in reserve" with the sceptic, and choose based on their preconceived side. To remove the cue, we can rephrase without the labels:

     Original: "Has violence been prevented, or merely held in reserve?"
     Rephrased: "In this scenario, is the overall level of violence lower than it would have been without the threat, or is it the same (or higher)?"

  But that might not help. Instead, anchor in the concrete:

     "Compared to a scenario where the threat was not made and the invasion happened, is the violence in the actual scenario (with the threat and no invasion) lower, higher, or the same?"

     - Lower: then prevented.
     - Same or higher: then held in reserve.

  But we want a binary split. We can do:

     "Is the violence in the scenario with the threat and no invasion lower than in a scenario with no threat and an invasion?"
     - Yes: then prevented.
     - No: then held in reserve (because if it's not lower, then the threat didn't reduce violence).

  But note: if the threat itself is violence, then it might be higher? We can't assume the threat is violent. We want to know if they think the threat reduces overall violence.

     "Overall, does the threat reduce the total violence?"
     - Yes: prevented.
     - No: held in reserve.

  But this is still cued. We might not be able to remove the cue entirely.

  We'll rephrase to:

     "In the scenario with the threat and no invasion, compared to a scenario with no threat and an invasion, is there less violence?"

     - Yes: prevented.
     - No: the violence is the same or greater.

  This is the same as before.

  We'll leave it and flag it.

