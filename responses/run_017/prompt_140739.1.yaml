  ### Violence Trend Sorting Instrument  
  *For the graduate reading group on "Has the world become less violent?"*  

  **Purpose**: This instrument sorts your implicit commitments about measuring violence, using concrete cases. Treat all empirical claims as granted suppositions. Answer each node based on your case-by-case judgment, not preconceived labels.  

  ---

  #### Part 1: Dimensions of Disagreement  
  Views diverge along these independent distinctions. While some pairings correlate, all combinations are logically possible.  

  1. **Scope of Violence**: What counts as "violence"?  
     - *Distinction*: Direct physical harm by agents (e.g., assault) vs. systemic/structural harm (e.g., famine from policy) or harm to non-humans.  
     - *Independence*: Does not dictate the numerator or denominator.  

  2. **Numerator (Measure of Harm)**: How is violence quantified?  
     - *Distinction*: Victims/events (counts), expected harm (probability-weighted outcomes), or tail risk (worst-case scenarios).  
     - *Independence*: Independent of scope (e.g., structural harm can be measured by victims or tail risk).  

  3. **Denominator (Baseline)**: What is the reference population?  
     - *Distinction*: Per person-year (annual exposure), per whole life (lifetime risk), per moral patient (includes non-humans), or per at-risk sub-population (e.g., young men in conflict zones).  
     - *Independence*: Independent of scope (e.g., direct violence can use per-whole-life or per-sub-population baselines).  

  4. **Temporal Assessment**: How is the trend evaluated?  
     - *Distinction*: By expectation (average outcome) or by tail risk (catastrophic potential).  
     - *Independence*: Can apply to any numerator (e.g., expected victims vs. tail risk of systemic collapse).  

  5. **Monism vs. Pluralism**: Is violence a single measurable quantity?  
     - *Distinction*: Monism (one trend exists) vs. pluralism (violence is an essentially contested cluster with no aggregate trend).  
     - *Independence*: Overrides other dimensions; pluralists reject all single-measure assessments.  

  *Note*: Scope and denominator are independent (e.g., structural harm could use per-person-year or per-whole-life). Numerator and temporal assessment are independent (e.g., expected harm can be assessed by expectation or tail risk).  

  ---  

  #### Part 2: Decision Tree  
  *Answer each node without anticipating the outcome. Branch left (A) or right (B) unless marked otherwise. Cases from your list are tagged (a–h).*  

  **Q1 (Meta)**: Suppose we have extensive data on wars, homicides, and coercive policies. Can "violence" be tracked as *one* measurable quantity over time, yielding a clear trend?  
  - **A**: No – violence is too fragmented (e.g., war, structural deprivation, psychological harm) to aggregate. → Go to **Q10**  
  - **B**: Yes – we can define a coherent measure. → Go to **Q2**  

  **Q2 (Scope: Structural harm) [Case g]**: A famine occurs due to trade/aid policies. No physical blows are struck. Should these deaths be counted as "violence"?  
  - **A**: Yes – violence includes systemic, remediable deprivation. → Go to **Q3**  
  - **B**: No – violence requires direct physical force by an agent. → Go to **Q3**  

  **Q3 (Scope: Non-humans) [Case d]**: Over 50 years, animals killed for food per human multiply tenfold. Should this killing be counted in "violence"?  
  - **A**: Yes – non-human animals are moral patients. → Go to **Q4**  
  - **B**: No – violence applies only to humans. → Go to **Q4**  

  **Q4 (Numerator: Deterrence) [Case a]**: State X credibly threatens to destroy State Y’s city. The invasion never occurs. Compared to a scenario with no threat and an invasion, is violence:  
  - **A**: Reduced – the threat prevented harm. → Go to **Q5**  
  - **B**: Unchanged or increased – the threat held violence in reserve. → Go to **Q5**  

  **Q5 (Numerator: Event concentration) [Case f]**: One airstrike kills 500 people. In the past, 500 deaths occurred in 500 separate fights. Is the violence:  
  - **A**: The same – only victims matter. → Go to **Q6**  
  - **B**: Greater – concentrated harm is worse (e.g., more traumatic). → Go to **Q6**  
  - **C**: Less – dispersed harm is worse (e.g., more pervasive terror). → Go to **Q6**  

  **Q6 (Denominator: Time unit) [Case b]**: Annual violent death risk stays at 1%, but life expectancy doubles. Lifetime violent death risk rises. To assess trends, we should prioritise:  
  - **A**: Annual risk (per person-year). → Go to **Q7**  
  - **B**: Lifetime risk (per whole life). → Go to **Q7**  

  **Q7 (Denominator: Sub-population) [Case h]**: The overall violence rate falls, but the rate for young men in contested borderlands is unchanged. Which rate is more important?  
  - **A**: Overall rate – reflects societal average. → Go to **Q8**  
  - **B**: Sub-population rate – highlights those most exposed. → Go to **Q8**  

  **Q8 (Temporal: Tail risk) [Case e]**: Expected annual battle deaths fall, but the probability of a conflict killing >10% of humans rises. To assess the trend, we should prioritise:  
  - **A**: Expected deaths – the likeliest outcome. → Go to **Q9**  
  - **B**: Tail risk – catastrophic potential. → Go to **Q9**  

  **Q9 (Substitution) [Case c]**: Interpersonal violence (e.g., assaults) falls 80%, but imprisonment (with violent conditions) rises 300%. Has violence declined?  
  - **A**: Yes – the fall in interpersonal violence dominates. → Go to **Q10**  
  - **B**: No – state coercion substitutes one violence for another. → Go to **Q10**  

  **Q10 (Absolute vs. rate) [Added case]**: The absolute number of violent deaths rises due to population growth, but the per capita rate falls. Has violence declined?  
  - **A**: Yes – the rate matters. → Assign leaf  
  - **B**: No – absolute harm matters. → Assign leaf  

  ---  

  #### Part 3: Labelled Leaves  
  *Each leaf shows your position’s minimal commitments and awkward implications. "Unnamed" denotes no assumed defender.*  

  **Leaf 1: Pluralism** (Path: Q1=A)  
  - **Commitment**: No single trend exists; "violence" is an essentially contested cluster.  
  - **Awkward implication**: Declinists and pessimists are both partially right but miss the bigger picture.  
  - **Minimal path**: Q1=A  

  **Leaf 2: Straightforward Declinism** (Path: Q1=B, Q2=B, Q3=B, Q4=A, Q5=A, Q6=A, Q7=A, Q8=A, Q9=A, Q10=A)  
  - **Commitment**: Violence declines under bodily, agent-caused, per-person-year measures.  
  - **Awkward implication**: Ignores structural harm, animal suffering, and tail risks as "not violence".  
  - **Minimal path**: Q2=B, Q3=B, Q4=A, Q6=A, Q7=A, Q8=A, Q9=A, Q10=A  

  **Leaf 3: Tail Risk Pessimism** (Path: Q1=B, Q8=B)  
  - **Commitment**: Violence increases if catastrophic potential (tail risk) rises, even if expected harm falls.  
  - **Awkward implication**: A world with lower routine violence but higher nuclear-war risk is more violent.  
  - **Minimal path**: Q8=B  

  **Leaf 4: Substitution Scepticism** (Path: Q1=B, Q9=B)  
  - **Commitment**: Apparent declines are artefacts of violence shifting to states (e.g., prisons) or deterrence.  
  - **Awkward implication**: Modern states monopolise violence but do not reduce it; they conceal it.  
  - **Minimal path**: Q9=B  

  **Leaf 5: Structural Expansionism** (Path: Q1=B, Q2=A, Q3=B)  
  - **Commitment**: Violence includes structural harm (e.g., policy-induced famine); trend is flat/worsening.  
  - **Awkward implication**: Violent crime declines are offset by rising structural coercion (e.g., economic deprivation).  
  - **Minimal path**: Q2=A, Q3=B  

  **Leaf 6: Moral-Patient Expansionism** (Path: Q1=B, Q3=A)  
  - **Commitment**: Violence includes harm to non-humans; trend rises sharply due to industrial animal slaughter.  
  - **Awkward implication**: A 90% drop in human violence is irrelevant if animal killings surge.  
  - **Minimal path**: Q3=A  

  **Leaf 7: Absolutism** (Path: Q1=B, Q10=B)  
  - **Commitment**: Falling rates don’t matter; absolute victim counts determine trends.  
  - **Awkward implication**: A doubling of population with halved per capita violence has unchanged (not reduced) violence.  
  - **Minimal path**: Q10=B  

  **Leaf 8: Lifetime Risk Focus** (Path: Q1=B, Q6=B)  
  - **Commitment**: Violence increases if lifetime risk of harm rises (e.g., from longer lifespans).  
  - **Awkward implication**: Even with lower annual risk, violence rises if people live long enough to face cumulative danger.  
  - **Minimal path**: Q6=B  

  **Leaf 9: Sub-Population Focus** (Path: Q1=B, Q7=B)  
  - **Commitment**: Trends among high-risk groups (e.g., borderland youth) override societal averages.  
  - **Awkward implication**: Violence has not declined if vulnerable minorities experience unchanged risk.  
  - **Minimal path**: Q7=B  

  ---  

  #### Part 4: Routing Table  
  *Shortest path to each leaf (answers to key nodes; omit irrelevant nodes).*  

  | Leaf                          | Path (Node: Answer)                                  |  
  |-------------------------------|------------------------------------------------------|  
  | **1. Pluralism**              | Q1: A                                                |  
  | **2. Straightforward Declinism** | Q2: B, Q3: B, Q4: A, Q6: A, Q7: A, Q8: A, Q9: A, Q10: A |  
  | **3. Tail Risk Pessimism**    | Q8: B                                                |  
  | **4. Substitution Scepticism**| Q9: B                                                |  
  | **5. Structural Expansionism**| Q2: A, Q3: B                                         |  
  | **6. Moral-Patient Expansionism**| Q3: A                                             |  
  | **7. Absolutism**             | Q10: B                                               |  
  | **8. Lifetime Risk Focus**    | Q6: B                                                |  
  | **9. Sub-Population Focus**   | Q7: B                                                |  

  ---  

  #### Part 5: Diagnostics of the Logical Space  

  **Unoccupied Combinations** (Logically possible but unattractive or unexplored):  
  - **Expanded scope (structural) + per-whole-life denominator**: Coherent but unexplored; no major school combines systemic harm with lifetime risk.  
  - **Non-human inclusion + tail risk assessment**: Incoherent; tail risk (e.g., human extinction) is incommensurable with animal suffering metrics.  
  - **Expected harm numerator + sub-population denominator**: Unattractive; expected harm typically presumes societal averages, not fragmented risk pools.  

  **Indistinguishable Leaves**:  
  - None. Each leaf is separated by at least one node answer.  

  **Order-Dependence**:  
  - **Q2 and Q3**: Answers may shift if non-humans (Q3) are asked before structural harm (Q2). To mitigate, we anchored Q3 to a concrete case (animal slaughter).  

  **Most Mis-Answered Node**:  
  - **Q4 (Deterrence)**: Participants often pick "A" (prevented) to side with declinists or "B" (held in reserve) for sceptics, ignoring their other commitments.  
  - **Rephrasing to remove cue**: *"In the threat scenario, does the absence of invasion mean violence was (A) reduced overall or (B) unchanged/increased due to the threat's latent potential?"*  

  **Note on Evidence**: The "pluralism" leaf (Leaf 1) is distinct from evidentiary scepticism. Pluralism denies a *single factual trend* exists; evidentiary sceptics accept a trend exists but doubt our data (e.g., skeletal records). The tree separates these via Q1.  

  ---  
  *This instrument is self-contained. No external sources are needed or cited.*
