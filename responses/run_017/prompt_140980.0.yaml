prompt: |-
  I'm a second-year PhD student in economics putting together the framing chapter for a survey on decision-making under cognitive limits, and my advisor keeps telling me that the literature scores views against each other without ever saying what the scorecard is. So before I compare anything, I want the specification. Fix the purpose as follows: a theory of rationality for an agent with real resource limits — limited time, limited memory or working space, limited attention, limited representational capacity — that is meant to be genuinely normative, in the sense that it can tell such an agent what it would be reasonable to do and can still call some of what bounded agents do a mistake rather than merely a consequence of their limits. Not a descriptive psychology of what people actually do, and not unbounded Bayesian decision theory with a paragraph of hand-waving about costs bolted on. Given that purpose, write me the desiderata: what any adequate theory of this kind has to deliver, with the case or consideration behind each requirement, and be explicit about why each one is a requirement rather than a taste.

  Here are the candidates I'm carrying around, which you should feel free to reject, split, or replace, since part of what I want is a view on which of them are real desiderata and which are the prejudices of one research program dressed up as requirements. (1) The deliberation-cost regress: choosing how long to deliberate is itself a decision made under the same bound, so the theory has to say when to stop without presupposing an answer to the very question it is stuck on — my case is a fellowship committee with 400 applications, twenty minutes per careful read, six hours of scheduled meeting time, and the option of paying a screener to cut the pool. (2) Interruptibility: the agent may have less time than it believes and will not be warned when the time runs out, so it seems to me that any partial execution of the theory's recommended procedure should already yield a usable recommendation, and I want to know whether demanding that is a genuine requirement or an engineering preference. (3) Self-applicability: the recommendation must be reachable within the bound by the agent it is addressed to, and the agent must be able to tell, within the bound, that it has complied — otherwise the advice is empty. (4) Representational parsimony: the theory should not quietly presuppose that the agent has already written down a prior over all worlds or a utility function over an exponentially large outcome space. (5) The currency question: whether the costs of thinking have to be commensurable with the outcomes being weighed, and what happens if they are paid in effort or attention rather than in the coin of the decision. (6) Immunity to exploitation: should a bounded agent be required to be immune to money pumps or Dutch books, given that recognizing the pump seems to require exactly the reasoning it lacks? (7) Menu and framing sensitivity: whether it is admissible for a bounded agent's choice to depend on the order, granularity, or description of the options, or whether description-invariance is a requirement smuggled in from the unbounded theory. (8) Scaffold neutrality: whether deliberation offloaded onto a calculator, a colleague, a market price, or a written note counts as expanding the bound or as part of the act. (9) The convergence condition: should recommendations approach the unbounded Bayesian or expected-utility answer as the bound is relaxed without limit, or is that a prejudice, given cases where a cruder rule does better than a more inclusive one? (10) The bound's own specification: must the theory take the bound as given, must it say what the bound is a bound on, and must it handle an agent who is uncertain about its own limits and about when options will stop arriving? (11) Normative bite: the theory has to distinguish genuine error from mere limitation closely enough that it cannot end up excusing everything.

  For each desideratum, give me the motivating case and mark whether it is non-negotiable given my stated purpose or optional. Then the part I care most about: tell me which subsets of the list are jointly unsatisfiable, with the argument rather than the assertion — I have a suspicion that the tractability requirements and the non-exploitability requirement cannot both be had, and another that interruptibility and any strong optimality-tracking condition conflict, but I want to see whether you agree and what the tension really turns on. Say which single requirement does the most work in excluding candidate theories, and point out anything important my list has missed. A short table at the end scoring Simon-style satisficing with aspiration levels, information-cost and rational-attention approaches, the fast-and-frugal heuristics and ecological-rationality program, and the bounded-optimality tradition in AI against the final list would be useful, but keep it brief: the criteria are the deliverable, and I can do the scoring myself if the specification is right.
reasoning: |-
  Hmm, this is a rigorous and important question from a PhD student in economics. They're building a normative theory of bounded rationality and need to clarify the core requirements before evaluating existing approaches. The advisor's criticism about lacking a "scorecard" is spot-on - we need clear criteria before comparing theories.

  Let me unpack their purpose: they want a genuinely normative theory for resource-limited agents that can still call certain behaviors "mistakes" rather than just limitations. This rules out purely descriptive approaches (like some heuristics research) and unbounded rational actor models with cost lip service. The key tension seems to be between tractability and robustness - how to demand rationality within limits without collapsing into "anything goes."

  Looking at their 11 candidate desiderata:
  - Deliberation-cost regress is fundamental - any theory ignoring this is circular. The fellowship committee case makes it concrete.
  - Interruptibility feels essential given real-world time pressure (medical triage etc.), though it might conflict with optimality.
  - Self-applicability is non-negotiable - advice the agent can't follow is useless.
  - Representational parsimony is crucial to avoid smuggling in unbounded assumptions.
  - The currency question is thorny - costs paid in attention vs utility need reconciliation, but this might be tractable.
  - Exploitability immunity seems too strong - bounded agents should be allowed vulnerabilities they can't perceive.
  - Menu sensitivity is tricky - some framing effects might be rational under bounds, but total arbitrariness undermines normativity.
  - Scaffold neutrality is important for real-world relevance (calculator use etc.).
  - Convergence might be desirable but not necessary - bounded rationality isn't just "imperfect Bayesian."
  - Bound specification is mandatory - we must define what's being bounded.
  - Normative bite is the whole point - without it, the theory excuses everything.

  Major tensions I see:
  1) Interruptibility vs optimality: If partial results must always be usable (interruptibility), we sacrifice guarantees about quality. The fellowship committee rushing decisions exemplifies this.
  2) Self-applicability vs exploitability immunity: Checking for money pumps requires cognitive resources the agent lacks. A vulnerable elderly person illustrates why this tradeoff matters.
  3) Representational parsimony vs convergence: Simple representations (like aspiration levels) won't converge to Bayesian solutions. But do they need to?

  The most exclusionary requirement is self-applicability - it immediately disqualifies theories requiring unrealistic precomputation (like some Bayesian models with costly priors).

  Missing desiderata? Perhaps:
  - Computational universality: Should handle diverse problem types
  - Incremental improvability: Allow quality to improve smoothly with more resources
  - Ecological grounding: Recognize that what's "rational" depends on environment structure

  For the scoring table, I'll focus on how major approaches handle our core criteria. Satisficing handles regress and interruptibility well but struggles with normative bite. Bounded optimality nails self-applicability but assumes known cost functions. The key is making tradeoffs explicit rather than pretending one approach satisfies all.
answer: |-
  Below is a structured specification of desiderata for a normative theory of bounded rationality, based on your purpose. Each requirement is marked as **Non-negotiable** (essential to the core purpose) or **Optional** (theoretically flexible but consequential). Tensions and trade-offs are analyzed, followed by a brief scoring of major approaches.

  ---

  ### **Desiderata Specification**
  1. **Deliberation-Cost Regress Handling**  
     *Case*: Fellowship committee with limited time/resources must decide how to allocate deliberation (e.g., hiring screeners).  
     *Requirement*: **Non-negotiable**. The theory must resolve the infinite regress of "deciding how to decide" without presupposing unbounded computation. Otherwise, it fails as *normative guidance* for bounded agents.  

  2. **Interruptibility**  
     *Case*: Medical triage where an agent may be interrupted mid-deliberation (e.g., ER doctor pulled to another emergency).  
     *Requirement*: **Non-negotiable**. Without interruptibility, the theory’s recommendations are useless in real-time, resource-constrained environments. Normativity requires robustness to *unpredictable* bounds.  

  3. **Self-Applicability**  
     *Case*: An agent with limited working memory must verify compliance with the theory’s rules (e.g., a chess player checking if a move satisfies a heuristic).  
     *Requirement*: **Non-negotiable**. If the agent cannot recognize or execute the theory’s advice within its bounds, the theory is *practically empty*.  

  4. **Representational Parsimony**  
     *Case*: An agent choosing insurance plans cannot represent all possible states/outcomes due to memory limits.  
     *Requirement*: **Non-negotiable**. Theories assuming pre-specified priors/utilities over large spaces *smuggle in unbounded rationality*, violating the purpose.  

  5. **Currency Commensurability**  
     *Case*: Deciding whether to spend effort (non-monetary cost) vs. monetary loss (e.g., skipping research to save mental energy).  
     *Requirement*: **Optional**. Costs need not be *formally commensurable* with outcomes if the theory provides a procedural account of trade-offs (e.g., effort budgets). However, it must explain *how* costs constrain decisions.  

  6. **Immunity to Exploitation**  
     *Case*: A bounded agent accepting a series of trades that result in a sure loss (money pump).  
     *Requirement*: **Optional**. Normative bite does not require *full immunity* (which demands unbounded foresight), but the theory must flag *recognizable* inconsistencies under the bound.  

  7. **Menu/Framing Sensitivity**  
     *Case*: Choosing differently based on option order (e.g., decoy effects in marketing).  
     *Requirement*: **Non-negotiable** for limited sensitivity. Total invariance is an *unbounded ideal*, but the theory must distinguish *rational* sensitivity (e.g., attention allocation) from *arbitrary* framing errors.  

  8. **Scaffold Neutrality**  
     *Case*: Using a calculator for arithmetic vs. internal computation.  
     *Requirement*: **Non-negotiable**. The theory must specify whether tools *extend* bounds (e.g., external memory) or are *part* of deliberation. Otherwise, it cannot address real-world cognition.  

  9. **Convergence to Unbounded Rationality**  
     *Case*: A bounded agent’s strategy approaching expected utility as resources increase.  
     *Requirement*: **Optional**. Convergence is *not necessary* for normativity (e.g., ecological heuristics may outperform Bayes in some environments). Demanding it risks *begging the question* against boundedness.  

  10. **Bound Specification**  
      *Case*: An agent uncertain of its own memory limits or time horizon (e.g., a trader unsure when markets close).  
      *Requirement*: **Non-negotiable**. The theory must define the bound’s *scope* (time/memory/attention) and handle *meta-uncertainty* about bounds, or it cannot guide real agents.  

  11. **Normative Bite**  
      *Case*: Distinguishing between "reasonable errors under limits" vs. "blunders" (e.g., forgetting a meeting vs. ignoring critical information).  
      *Requirement*: **Non-negotiable**. Without this, the theory cannot criticize *remediable* failures, collapsing into excuse-making.  

  ---

  ### **Tensions and Trade-offs**
  - **Interruptibility vs. Optimality/Convergence**:  
    Interruptibility requires that partial outputs are valid, but this may *preclude* guarantees of approaching optimality. For example, an interruptible heuristic (e.g., "satisficing after 2 options") may never approximate expected utility, even with relaxed bounds.  
    *Tension*: Forces a choice between *robustness* (usable under interruption) and *asymptotic rationality*.  

  - **Self-Applicability vs. Exploitability Immunity**:  
    Checking for money pumps requires recursive self-monitoring, which may exceed bounds (e.g., an agent lacks resources to spot dynamic inconsistencies).  
    *Tension*: Immunity demands *more computation* than self-applicability allows. A theory can satisfy one but not both without weakening exploitability to "local" checks.  

  - **Tractability vs. Representational Parsimony**:  
    Avoiding exponential state spaces (Desideratum 4) often requires approximations (e.g., coarse priors), which may violate convergence (Desideratum 9) or enable exploitation (Desideratum 6).  
    *Tension*: Parsimony *enables* tractability but *conflicts* with ideals inherited from unbounded theory.  

  **Most exclusionary requirement**: **Self-Applicability**. It eliminates theories requiring precomputation (e.g., full Bayesian updating) or non-verifiable procedures.  

  **Key omission**:  
  - **Ecological Validity**: The theory should prescribe strategies that leverage *environmental structure* (e.g., statistical regularities) to mitigate bounds. Without this, recommendations may ignore real-world affordances.  

  ---

  ### **Scoring Major Approaches**  
  *Brief evaluation against non-negotiable desiderata (✓: strong, ~: partial, ✗: weak)*:  

  | Approach                     | Deliberation Regress | Interruptibility | Self-Applicability | Repr. Parsimony | Normative Bite |  
  |------------------------------|----------------------|------------------|---------------------|-----------------|----------------|  
  | **Simon-style Satisficing**  | ✓ (Aspiration sets stopping point) | ✓ (Any option meeting aspiration is valid) | ✓ (Simple comparison) | ✓ (Minimal representations) | ✗ (Often lacks error criteria) |  
  | **Information-Cost/Rational Attention** | ~ (Costs define stopping rules) | ✗ (Partial computation may be invalid) | ~ (Depends on cost function) | ✗ (Often assumes priors) | ~ (Can flag costly errors) |  
  | **Fast-and-Frugal Heuristics** | ✓ (Fixed rules for stopping) | ✓ (Outputs always defined) | ✓ (Executable rules) | ✓ (No complex models) | ✗ (Errors excused as ecological) |  
  | **Bounded Optimality (AI)**  | ~ (Optimizes given costs) | ✗ (Requires complete plans) | ✗ (Assumes known cost functions) | ✗ (Assumes full specification) | ✓ (Explicitly minimizes errors) |  

  **Summary**:  
  - **Satisficing** and **Fast-and-Frugal** excel on interruptibility/self-applicability but lack normative bite.  
  - **Bounded Optimality** is strong on normative bite/regress but fails self-applicability/scaffold neutrality.  
  - **Information-Cost** models struggle with representational parsimony and interruptibility.  

  ---

  This specification centers on *practical normativity*: a theory must guide agents who cannot "do the math." The irreconcilable tension is between **procedural robustness** (interruptibility, self-applicability) and **outcome robustness** (immunity to Dutch books, convergence). Prioritizing the former aligns with your purpose; the latter risks reintroducing unbounded ideals.
