  But he might concede some nuance around voting rights. Given his focus on elders advising the state, he could theoretically support cognitive thresholds for high office - but only if the assessment were qualitative and reputation-based, not a mechanistic test. Even then, he'd worry about slippery slopes. The emotional memory angle might intrigue him initially, but that pilot data about rigidity would make him dismiss it as pseudophilosophy masking ageism.

