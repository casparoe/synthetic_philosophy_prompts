prompt: |-
  Hey — I need something I can actually put on the wall and use, not an essay about it.

  Im deputy director of comms at a regional public health agency. About 2 million people, four of us on the team, we push out two or three guidance lines or press lines a week, the chief medical officer signs off on anything with a number in it, and we usually have a few hours rather than a few weeks. Our recurring problem: the version of a claim that works is the confident one, and the version we can defend in front of a journalist is the careful one, and those arent the same sentence.

  Two features of our situation that I think matter. First, a lot of our claims are what I'll call uptake-linked: their truth depends on people believing them, because the believing is what produces the behaviour that makes them come true. ('If everyone cuts their contacts by about a third for two weeks, the hospitals will hold.') Others are nothing like that — the water is contaminated or it isnt, and no amount of confidence from us touches it. Second, we have what our team calls the archivist: a permanent local opposition group that screenshots every line we soften or overstate and recycles it for years. So an overclaim has a long tail, not just a news cycle.

  What I want is a decision procedure built out of the ethics-of-belief stuff I half remember from university — Clifford's flat rule about believing on insufficient evidence and his shipowner case, James's reply that when an option is genuine and the evidence genuinely cant settle it you're allowed to let your passional nature decide, and above all his thought that some facts only arrive at all if you've already banked on them. I dont want a summary of the debate and I dont want reading recommendations. I want: the questions in order, what counts as a sufficient answer to each, where the procedure stops and says no, and where it hands the decision back to a person because its a values question rather than a factual one.

  Three things it has to get right:

  1. Dont collapse "should I believe this" into "should I say it." For us those come apart constantly — sometimes the right move is to say the confident thing while believing the cautious one, sometimes I think the reverse, sometimes neither. Show me exactly where the gap is and what the procedure does when the two answers disagree.

  2. Give me an actual test for whether a belief is the kind that helps create its own object. Not "its motivating" — the shipowner's belief motivated him perfectly well and that was the whole problem. The test has to be about whether the believing is causally upstream of the fact believed. And most of our real claims are half-and-half: the hospitals hold if uptake is high AND staffing survives AND the variant isnt nastier than the modelling assumes. Tell me how to score a claim that's partly uptake-linked and partly not.

  3. Put the archivist in the procedure. How much weight does long-run damage to our credibility get, and at which step — is it a tiebreaker, a veto, or just one input among many?

  Then run it on three cases:

  (a) Next week we want to publish "If everyone cuts their contacts by about a third for the next two weeks, the hospitals will hold." Our modelling puts that somewhere near 60/40 and the modellers wont go on the record with the number.

  (b) A lab result on a municipal water supply is 36 hours late. We're maybe 80% sure the water is fine. Do we tell people its safe, or tell them to boil it.

  (c) The one I already know I wont like. Our staff are wrecked after two years of back-to-back surges, and the CMO wants to stand up at the all-staff meeting and say "the worst is behind us." Nobody knows that. But the team's view is that if she doesnt say it, a chunk of people quit. Tell me what the procedure actually says, not what would be kind.

  And last: where does it break. Which of these steps are judgement calls dressed up as procedure, whats the failure mode if we run it hard for six months, and what kinds of decisions should we keep out of it entirely.
reasoning: |-
  Okay, let me start by really understanding what the user needs here. They're the deputy director of comms at a public health agency, dealing with urgent, high-stakes messaging. The core problem is the tension between confident statements that drive public action and cautious ones that hold up under scrutiny. They need a practical tool, not theoretical discussion.

  First, I need to unpack their three key requirements. The decision procedure must separate belief from communication, handle uptake-linked claims, and factor in the "archivist" effect. They also provided three test cases to validate the framework.

  For the belief vs. communication split, I recall Clifford's ethics of belief emphasizing evidence, while James allows passion in genuine options. The user needs clear questions that distinguish these. The Shipowner case shows misplaced confidence, but in public health, confidence can be strategic. So the procedure must have separate tracks for internal belief assessment and external communication strategy.

  On uptake-linked claims, it's about causality. The example "if everyone reduces contacts, hospitals hold" only becomes true if people believe and act. But it's often mixed with external factors like staffing. The test needs to identify the degree to which belief enables the outcome. Maybe a weighted scale—like 70% uptake-dependent vs. 30% fixed factors.

  The archivist represents long-term credibility damage. This needs to be a cost-benefit analysis step. Not a veto, but a factor when overclaims could be weaponized later. In cases like the "worst is behind us" statement, the risk of being wrong might outweigh the short-term morale boost.

  Now the test cases. For (a), the contact reduction claim: the evidence is weak (60/40), but high uptake-dependence. The procedure should allow the confident statement because public action is crucial, but with a disclosure about modeling uncertainty. For (b) the water safety: no uptake-link, evidence insufficient. Mandatory boil advisory because the cost of being wrong is deadly. For (c) the staff morale claim: high uptake-link (preventing quits) but low evidence. The archivist risk is high here—if proven false, it erodes trust. The procedure likely rejects the statement or demands heavy qualification.

  I'm considering where the procedure might break. Weighting the uptake-dependence is subjective. Also, assessing "passional nature" in James's terms could be biased. Decisions with extreme consequences, like imminent life-threatening scenarios, might need to bypass the framework. Running it rigidly could cause decision fatigue or create loopholes over time.

  The user's deeper needs: they want to minimize reputational risk while effectively motivating behavior. They need team buy-in, hence the wall-chart simplicity. The archivist isn't just opposition—it's about maintaining trust in a polarized environment. The procedure must balance urgency with accountability, something their team can apply mid-crisis without philosophical debates.
answer: |-
  Here's a field-ready decision procedure formatted as a wall chart. It separates *internal belief assessment* from *external communication strategy* and integrates your core requirements. **Bold = Stop/Go Decision Point.** *Italics = Key Judgment Call.*

  ---

  **PUBLIC HEALTH COMMUNICATION DECISION MATRIX**

  **STEP 1: ASSESS THE BELIEF (What *WE* should internally accept)**
  1.  **Is the evidence sufficient to justify belief? (Clifford Test)**
      *   *Sufficient Evidence:* Robust, reviewed data, clear methodology, expert consensus. (e.g., Lab-confirmed water contamination).
      *   *Insufficient Evidence:* Models with wide confidence intervals, preliminary data, conflicting expert views, significant unknowns. (e.g., 60/40 model prediction).
      *   **DECISION:** If **YES** (Sufficient), belief is justified. Proceed. If **NO** (Insufficient), go to Step 1b.

  2.  **Is the claim a "Genuine Option"? (James Test)**
      *   *Genuine Option?* Must be: **1. Live** (Plausible/meaningful), **2. Forced** (Inaction is a consequential choice), **3. Momentous** (High stakes, irreversible).
      *   *Evidence Truly Unsettled?* Genuine uncertainty persists even after best evidence gathering.
      *   **DECISION:** If **YES** (Genuine Option & Evidence Unsettled), "Passional Nature" (values/risk assessment) *can* justify belief internally *for decision-making purposes*. Proceed to Step 2. If **NO**, belief is **unjustified**. *Internal belief should align with caution.* Proceed to Step 2.

  **STEP 2: DESIGN THE COMMUNICATION (What *WE* say publicly)**
  3.  **What is the Uptake-Link Score (0-10)?**
      *   *Test:* How directly and significantly does *public belief/action* **cause** the desired outcome? Rate 0 (No link - outcome is fixed) to 10 (Outcome *only* happens if belief drives action).
      *   *Scoring Mixes:* Estimate the % of the outcome dependent on uptake. (e.g., "Hospitals hold": Uptake (60%), Staffing (25%), Variant (15%) → **Uptake-Link Score = 6**).
      *   *Judgment:* Focus on causal pathways. High score = Public action is *necessary primary driver*.

  4.  **Archivist Risk Assessment:**
      *   *Potential Damage:* Severity if this specific claim is later proven wrong/overstated? (High: Core promise, precise number. Low: General encouragement, qualified statement).
      *   *Exploitability:* How easily could this be weaponized later? (High: Absolute statement, emotional charge. Low: Hedged, factual).
      *   *Weight:* **High Risk** (Severe + Exploitable) acts as a **strong constraint** on confident phrasing. **Low Risk** is a minor factor.

  5.  **Communication Strategy Matrix:**
      *   *(A) Belief Justified (Step 1 = YES):* **Default = Confident Statement.** *Moderate/High Archivist Risk?* Add qualifications/context.
      *   *(B) Belief Unjustified BUT High Uptake-Link (Score 7-10) AND Genuine Option (Step 1b = YES):* **Default = Confident Statement (Strategic).** *Mandatory:* A) Clear call to action, B) Explicitly state the *necessity* of public action for success, C) Disclose key uncertainties if Archivist Risk is Moderate/High.
      *   *(C) Belief Unjustified AND Low Uptake-Link (Score 0-6):* **Default = Cautious Statement.** *High Stakes?* (e.g., immediate safety risk) lean towards protective advisory (e.g., "Boil water").
      *   *(D) Belief Unjustified AND NOT a Genuine Option (Step 1b = NO):* **Mandatory = Cautious Statement / Do Not Claim.**

  **WHERE THE GAP IS & HOW TO HANDLE DISAGREEMENT:**
  *   **Belief (Step 1)** is about *internal epistemic justification* (Clifford/James).
  *   **Communication (Step 2)** is about *pragmatic impact* (Uptake-Link, Archivist, Consequences).
  *   **Disagreement Handling:** If Step 1 says "Belief Unjustified" but Step 2 (due to High Uptake-Link & Genuine Option) says "Say Confident Thing," **PROCEED WITH CAUTION (Strategy B)**. You are strategically *saying* something you don't fully *believe* is certain, based on necessity, while mitigating risks (disclosure, qualifications). *Acknowledge this gap internally.* Reverse (Say Cautious while Believing Confident) is rare but covered by Strategy A with qualifications. Neither is Strategy D.

  ---

  **APPLICATION TO YOUR CASES:**

  **(a) "Cut contacts by 1/3 for 2 weeks → Hospitals hold."**
  1.  **Belief Assessment:** Evidence Insufficient (60/40, modellers hesitant). **NO.**
  2.  **Genuine Option?** YES (Live/Forced/Momentous). *Internal belief can be strategically adopted.*
  3.  **Uptake-Link Score:** High (e.g., 6/10 - depends significantly on uptake, but also staffing/variant).
  4.  **Archivist Risk:** High (Absolute promise about critical infrastructure).
  5.  **Strategy:** **(B) Confident Statement BUT Mandatory Mitigations:** Frame as *necessity*: "To ensure our hospitals can continue providing care, *everyone* needs to reduce close contacts by about one-third over the next two weeks. This is critical based on our current assessment. We are actively monitoring staffing and variant data." *Avoids absolute "will hold," focuses on action needed, acknowledges monitoring.*

  **(b) Water Safety: 80% sure it's fine, result 36h late.**
  1.  **Belief Assessment:** Evidence Insufficient (No confirmed result). **NO.**
  2.  **Genuine Option?** YES (Live/Forced/Momentous - inaction risks illness).
  3.  **Uptake-Link Score:** Very Low (0-2/10). Water safety is fixed; belief doesn't change contamination.
  4.  **Archivist Risk:** Very High if wrong ("Safe" when contaminated).
  5.  **Strategy:** **(C) Cautious Statement → Protective Advisory.** "Pending final confirmation of water quality results, which are delayed, we advise residents in [Area] to boil tap water used for drinking, cooking, and brushing teeth as a precaution until we provide an update. We are expediting the review." *Doesn't claim safety without proof, prioritizes protection.*

  **(c) CMO: "The worst is behind us." (Staff morale)**
  1.  **Belief Assessment:** Evidence Insufficient ("Nobody knows that"). **NO.**
  2.  **Genuine Option?** YES (Live/Forced/Momentous - morale/quitting critical).
  3.  **Uptake-Link Score:** Moderate (e.g., 5/10). Belief *might* reduce quitting (upstream cause), but future surge risk depends mostly on external factors (virus, community spread).
  4.  **Archivist Risk:** Very High (Definitive, emotional statement about core mission. Screenshot gold if surge returns).
  5.  **Strategy:** **(D) Do Not Claim / Cautious Statement.** High Uptake-Link pushes towards (B), but *Low Uptake-Link Score* (future surges largely external) and *Very High Archivist Risk* override. **Procedure Says: NO.** *Alternative:* "We have faced incredible challenges together. While we cannot predict the future, the effort you are putting in *now* is what will see us through whatever comes next. Your resilience makes us confident we can handle future challenges. We are implementing [specific support measures]." *Focuses on present effort/support, avoids false prediction.*

  ---

  **WHERE IT BREAKS:**

  1.  **Judgment Dressed as Procedure:** Key vulnerabilities:
      *   **Genuine Option (Step 1b):** Is it *truly* forced/momentous? Judgment call.
      *   **Uptake-Link Score (Step 3):** Estimating causal dependence % is inherently subjective.
      *   **Archivist Risk Weighting (Step 4):** Severity/Exploitability assessment is qualitative.
  2.  **Failure Modes (After 6 Months):**
      *   **"Genuine Option" Creep:** Overuse to justify confident comms on shaky ground.
      *   **Uptake-Link Overestimation:** Seeing public belief as the solution too readily.
      *   **Archivist Fatigue:** Downplaying long-term risk under pressure, leading to blowback.
      *   **Cynicism:** Team misuse of Strategy B ("We never *really* believe it anyway").
  3.  **Keep Out:**
      *   **Pure Value Statements:** "Vaccination is a moral duty." (Use ethics frameworks, not this).
      *   **Immediate Life/Death Directives:** "Evacuate NOW!" (Use emergency protocols).
      *   **Known Falsehoods:** Never justified. This is for *uncertainty*, not deception.

  **WALL-CHART SUMMARY:** Prioritize clarity. Use flow-chart symbols (Diamonds=Questions, Boxes=Actions). Emphasize **BOLD** decisions and *Italic* judgments. Laminate it. This forces explicit discussion of Uptake-Link and Archivist Risk at every turn.
