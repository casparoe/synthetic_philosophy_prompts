prompt: |-
  I run a fortnightly reading group that does a sort of shared wiki, and last session we spent ninety minutes going in circles on quantum suicide and quantum immortality and got nowhere, because everyone kept saying "yes but what do you mean, expect?" So I want to put a decision tree on the wiki: something that starts from a commitment everyone in the group already shares and ends at a named position, so next time someone can be told which leaf they're on instead of re-arguing the setup. Nobody needs convincing of Everett or decoherence or that macroscopic outcomes really branch, so don't spend nodes on that; start the tree after it.

  What I want, concretely:

  Start node: "I accept no-collapse QM, branching, and the Born rule as the right third-personal probability rule." From there, seven or eight branch nodes, at most twelve leaves. Every node has to be a question someone could answer before they know which leaf it's pushing them toward — a concrete case or a claim, never the name of a view, and ideally not even a word like "measure" or "fission" where you can avoid it. Each leaf gets a name (or "unnamed, as far as I know") plus one sentence on its most awkward commitment.

  The angle I want is this: build the tree around the word *expect*. The question the tree is really sorting people by is what "what should I expect to experience after the trigger fires?" even means, and whether it has a well-defined answer. So your top split should be about whether that's a factual question about which future observer-moment is yours, or a question about which anticipation it's sensible to adopt, or a question with no answer at all. Don't bury that distinction three nodes down.

  Distinctions I want to see doing work somewhere in the tree: whether first-personal expectation tracks squared amplitude or whether every branch containing a suitable successor counts the same; what happens to personal identity at a branch point (full continuity into both, divided or diminished, two new people, no fact of the matter); whether a successor needs any psychological continuity or whether bare continued existence is enough; whether there's a threshold below which a branch stops containing you at all; whether any of this generalises past a clean kill / no-kill setup to the messy way people actually die.

  And please build the diagnostic questions out of these cases rather than out of the textbook one:

  1. The graded gun. Same apparatus, but instead of kill (amplitude-squared .99) or unharmed (.01), it's kill (.99) or knocked out and left with dense anterograde amnesia and no memory of ever volunteering for the experiment (.01). Only one branch has any experience in it. Do you expect to be the amnesiac in the hospital? Somebody who says yes is in a very different place from somebody who says "I expect nothing, with probability .99", and I want the tree to force that.

  2. The inverted case. Wire it so the *low*-amplitude branch is the one where you die: you're fine in .99, dead in .01. And alongside it, an ordinary quantum lottery where the .01 branch is you winning a huge sum. The uniform-over-existing-branches reading seems to say you should bank on the jackpot, and nobody believes that, but I want the node phrased so people commit before they notice.

  3. The thousandth round. You've run it a thousand times; there's a live, coherent successor of you in a branch of measure around 2^-1000. Is that still survival in the relevant sense, is the experiment still supposed to work, and should you expect to find yourself extremely old? I know Tegmark's own reply is that real death is gradual rather than binary, and the tree should have a place for the person who says quantum immortality is fine as a claim about idealised boxes and nonsense as a claim about dying.

  4. The friend outside the box. Most of the measure of your friends sees you die. So: does running the experiment give the subject evidence for many worlds, evidence only in principle and unshareable in practice, or no evidence at all — and is that a separate node from the ones about survival, or does it collapse into one? Decide and say why.

  Leaves I want present somewhere: strong quantum immortality as genuine evidence for MWI; the deflationary reading where of course you survive but the thought experiment shows nothing; the measure-weighted reading where you should expect death and the whole thing is a fallacy; no-fact-of-the-matter about which branch is you; first-personal probability simply undefined under branching; the pragmatic anticipation-policy reading; and the degradation reading where it works until your branch stops being able to support you. If you think two of those can't be pulled apart by any question you can honestly ask, say so explicitly rather than inventing a node that pretends to separate them — I'd rather have a flagged collision than a fake fork.

  Finally: the tree will have answer-combinations that are allowed by the logical space but that nobody seems to be standing in. Pick three or four of the emptier ones and give me a line each on whether they're empty because they're incoherent, because they're just unattractive, or because nobody has bothered. No references or reading list needed, I know who wrote what — I only want the structure. Two pages-ish, definately no more than four.
reasoning: |-
  Okay, let me tackle this query. The user runs a fortnightly reading group that got stuck on quantum suicide/immortality because the concept of "expectation" was unclear. They want a decision tree starting from accepted premises (no-collapse QM, branching, Born rule) to help categorize positions without rehashing basics.

  First, I need to understand the core issue: disagreement centers on what "what should I expect?" means in branching scenarios. The tree must force distinctions around first-person perspective, identity, and anticipation. The user provided specific cases to build nodes around: Graded Gun (amnesia vs. death), Inverted Case (low-probability death), Thousandth Round (extremely low-amplitude survival), and Friend Outside (evidential implications).

  The top split should directly address whether expectation is a factual question about identity, a practical anticipation policy, or undefined. This aligns with the user's emphasis on not burying this distinction. Subsequent nodes will probe:
  - Whether identity persists in low-amplitude branches
  - If psychological continuity matters
  - How gradual death affects the thought experiment
  - Whether evidence for MWI can be obtained

  I'll design each node as concrete questions using the specified cases, avoiding theoretical jargon. For example:
  - Graded Gun will test if someone expects to "be" the amnesiac (implying amplitude-blind identity) vs. expecting nothing with high probability
  - Inverted Case will reveal if someone treats low-probability survival as equally "real" as high-probability outcomes
  - Thousandth Round will challenge the meaningfulness of extreme low-amplitude existence

  The leaves will map to known positions (strong immortality, deflationary, measure-weighted etc.), with explicit notes where distinctions collapse. Unoccupied positions will be flagged - like rejecting both identity and pragmatic policy (logically possible but useless), or claiming amplitude-blind identity while accepting evidence for MWI (incoherent).

  The Friend Outside case is particularly crucial for separating evidential implications from survival questions. Someone who thinks the survivor gains private evidence must explain why this doesn't extend to ordinary low-probability survivals (like narrowly avoiding accidents).

  Throughout, I'll maintain the user's requested focus on "expectation" as the organizing principle, using their cases to force clear commitments before positions become visible. The structure will prevent re-argument by making foundational assumptions explicit at each fork.
answer: |-
  Here's a decision tree focused on "expectation" under branching, starting from the agreed base and using your concrete cases. The top split forces the core disagreement about the *nature* of first-personal expectation.

  **Decision Tree: What Do You *Expect*? (Post-Everett, Decoherence, Born Rule)**

  1.  **Start:** I accept no-collapse QM, branching, and the Born rule as the correct third-person probability rule.
  2.  **Node 1 (Top Split):** When you step into the quantum suicide experiment (trigger fires, |alive> branch amplitude α, |dead> branch amplitude β), is "What will *I* experience next?" a question with a well-defined, *factual* answer about which specific future branch contains the unique continuation of *your* current subjective perspective?
      *   **Yes (Factual Identity Focus):** Proceed to Node 2.
      *   **No:** Proceed to Node 3.

  **Branch 1: Factual Identity Focus (Yes @ Node 1)**

  3.  **Node 2 (Continuity & Thresholds):** Consider the "Thousandth Round" scenario: After 1000 trials, there exists a branch with a coherent, living "you" (psychological continuity intact), but its amplitude is ~2^-1000. Is *that* branch *definitively* the one containing the unique continuation of *your* current subjective perspective?
      *   **Yes (No Threshold - Strong Identity):** Proceed to Node 4.
      *   **No (Threshold/Degradation - Weak Identity):** Proceed to Node 5.

  4.  **Node 4 (Identity Basis - Low Amplitude):** Why *isn't* the low-amplitude branch in the Thousandth Round the continuation of you? (Choose the *primary* reason)
      *   **A: Psychological Continuity Severed:** Even if coherent, the amplitude is too low, implying severe degradation or loss of identity *despite* apparent coherence. **Leaf: Degradation Threshold.** *Awkward: Defining the precise threshold where amplitude degrades identity/continuity.*
      *   **B: Bare Existence Insufficient:** Continuation requires more than just a future observer-moment with your memories; it requires a specific causal/identity link broken at low amplitude. **Leaf: Identity Requires Sufficient Amplitude.** *Awkward: Defining what "sufficient amplitude" means for identity beyond Born rule probability.*
      *   **C: Factual Identity Requires Continuity:** Identity requires unbroken psychological continuity *chain*; low amplitude makes this chain improbable or broken. **Leaf: Continuity Chain Failure.** *Awkward: Explaining why a demonstrably continuous chain in a low-amp branch fails to sustain identity.*

  5.  **Node 5 (Identity Basis - High Amplitude):** Consider the "Graded Gun": Amplitude-squared .99 branch = Death, .01 branch = Survival with dense anterograde amnesia. Only the amnesia branch has *any* experience. Do you expect to *be* the amnesiac in the hospital?
      *   **Yes (Amplitude-Blind Identity):** **Leaf: Strong Quantum Immortality (Identity Version).** *Awkward: Must explain why you expect to be the amnesiac (.01) but not expect to win the inverted lottery jackpot (.01) - see Branch 2. Assumes identity persists into any branch with a suitable successor, regardless of amp.*
      *   **No (Amplitude-Weighted Identity):** **Leaf: Measure-Weighted Identity Survival.** *Awkward: Reconciling "I survive" (in some branch) with "I overwhelmingly expect death" (Born rule applies to *my* survival branch).*

  **Branch 2: No Factual Identity / Policy Focus (No @ Node 1)**

  6.  **Node 3 (Nature of "Expectation"):** If there's no factual answer about "which branch is *me*?", what does "What should I expect?" *mean*? (Choose the *primary* meaning)
      *   **A: A Question About Rational Anticipation/Planning:** How should I weight possible future experiences in my current decision-making and emotional preparation? **Proceed to Node 6.**
      *   **B: A Meaningless or Undefined Question:** "Expectation" in a first-person sense loses meaning under branching; only third-person statements about branches are valid. **Leaf: First-Personal Probability Undefined.** *Awkward: Explaining the intuitive pull of "expectation" while dismissing it as incoherent.*

  7.  **Node 6 (Anticipation Policy Basis):** What principle *should* guide your anticipation of future experiences under branching?
      *   **A: Born Rule Weighting:** I should anticipate future experiences proportional to the squared amplitude of the branches containing them. **Leaf: Pragmatic Born Rule Policy.** *Awkward: Justifying why *this* policy is rational/correct when identity is non-factual.*
      *   **B: Uniform Branch Counting:** I should anticipate all possible future experiences (in branches with successors) equally, ignoring amplitude. **Proceed to Node 7.**

  8.  **Node 7 (Confronting Inversion):** Consider the "Inverted Case": .99 amplitude = Unharmed, .01 amplitude = Death. Alongside, a quantum lottery: .99 amplitude = Lose, .01 amplitude = Win huge jackpot. Do you *anticipate* winning the jackpot just as much as you *anticipate* surviving the inverted suicide device?
      *   **Yes:** **Leaf: Uniform Branch Anticipation.** *Awkward: Must bank on winning the jackpot (.01) just like surviving the inverted gun (.01), contradicting strong intuition.*
      *   **No (Reject Uniform):** **Leaf: Deflationary Survival.** *Awkward: Reconciling "of course I survive in *some* branch" (trivially true) with "this provides no *evidence* for MWI over collapse and offers no *practical* comfort" (anticipation still follows Born rule).*

  **Evidential Node (Applies to Multiple Leaves)**

  *   **Node E (The Friend Outside):** After running the quantum suicide experiment once, most of the measure of your friend sees you dead. Does the subject (if alive) gain significant *private evidence* for MWI over single-world theories?
      *   **Yes:** Implied by **Strong QI (Identity)**, possible for **Uniform Anticipation** & **Degradation Threshold**. *Awkward: Explaining why this evidence exists but is unshareable/impractical.*
      *   **No:** Implied by **Measure-Weighted Identity**, **Pragmatic Born Rule**, **Deflationary Survival**, **Undefined FP Prob**. *Awkward: For Identity views, explaining why surviving doesn't constitute evidence.*

  **Empty Leaves & Why:**

  1.  **"Identity + Uniform Anticipation":** (Yes @ Node 1, Yes @ Node 5, Yes @ Node 7). *Why Empty?* **Incoherent.** If identity is factual and survives into *every* suitable branch (Node 5 Yes), then anticipating *only* the high-amplitude experiences (Node 7 No) makes no sense. If you *are* in every branch, you should anticipate them all equally.
  2.  **"No Identity + Strong Evidence":** (No @ Node 1, A @ Node 6, Yes @ Node E). *Why Empty?* **Unattractive & Incoherent?** If "expectation" is just a pragmatic policy (A @ Node 6), claiming *factual* evidence (Yes @ Node E) from survival based on identity continuity seems contradictory. The pragmatic policy leaf (A @ Node 6) naturally pairs with "No" @ Node E.
  3.  **"Threshold + Uniform Anticipation":** (Yes @ Node 1, No @ Node 2, ? @ Node 5, Yes @ Node 7). *Why Empty?* **Unattractive & Unmotivated.** Threshold views usually arise to *avoid* the consequences of strong identity/immortality. Adopting uniform anticipation after positing a threshold negates the motivation for the threshold and forces the awkwardness of Node 7 (Yes).
  4.  **"Undefined FP Prob + Strong Evidence":** (B @ Node 3, Yes @ Node E). *Why Empty?* **Incoherent.** If first-person probability is undefined, claiming *evidence* (which implies a probabilistic inference) based on a first-person outcome is nonsensical.

  **Collapsed Distinction:**

  *   The distinction between **Degradation Threshold**, **Identity Requires Sufficient Amplitude**, and **Continuity Chain Failure** (Leaves under Node 4) is often blurred in practice. The diagnostic question (Node 4) tries to force a primary reason, but proponents might appeal to multiple factors. They all share the core commitment: *Very low amplitude branches do not contain "you"*, differing mainly in justification. The tree separates them for diagnostic clarity, recognizing they might collapse back together in exposition.

  **Tree Summary:**

  *   Forces the core "factual identity vs. not" split first (Node 1).
  *   Uses your cases directly to probe intuitions:
      *   Graded Gun (Node 5) forces amplitude-blind vs amplitude-aware identity/policy.
      *   Inverted Case (Node 7) tests commitment to uniform anticipation.
      *   Thousandth Round (Node 2) probes thresholds/degradation.
      *   Friend Outside (Node E) separates survival claims from evidential claims.
  *   Maps cleanly to the requested leaves.
  *   Flags incoherent/unattractive positions.
