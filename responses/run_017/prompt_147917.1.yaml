  ### Notes on the Tree

  **Unoccupied Cells (Diagnosis)**:
  - **Non-Countabilism (Leaf 5)**: Merely unexplored. While coherent (experience as a field avoids counting puzzles), it is rarely defended due to its counterintuitive rejection of discrete subjects.
  - **Human-Exceptionalism (Leaf 8)**: Unattractive. Arbitrary thresholds for subjecthood (e.g., neuron counts) are hard to justify non-ad-hoc.
  - **Group-Subject Realism** (not a leaf; if Branch 2-Yes led to Branch 3-No in early drafts): Incoherent. A "room-as-subject" implies nested subjects (e.g., humans inside it), violating the exclusivity of experience-grounding.

  **Indistinguishable Pairs**:
  - **Contingent vs. Necessary Phenomenal Bonding (Leaves 2–3)** are separated only by the Inverted-Bonding World (Branch 5). No further case is needed; this tests modal strength directly.
  - **Identity vs. Functionalist Reduction (Leaf 4)** and **Constitutive Panpsychism (Leaves 2–3)** both answer "No" to Branch 3 (split-brain duality). A fission/recombination case would separate them: *If a subject's hemispheres are separated and reconnected, is the resulting subject identical to the original?*  
    - Identity/Functionalist Reduction says **Yes** (functional continuity suffices).  
    - Constitutive Panpsychism says **No** (micro-subject composition breaks identity).
  - **Panprotopsychism (Leaf 7)** and **Brute Emergence (Leaf 6)** both answer "No" to Branch 4 (micro-subjects). They are separated by the Organoid/Ant Colony case (Branch 7), testing if macro-experience requires simplicity-denying emergence.

  **Cases Used (of six)**:
  - Grain Shift (Branch 1), Census (Branch 2), Split-Brain (Branches 3, 6), Inverted-Bonding (Branch 5), Organoid/Ant Colony (Branches 7–8). Fission not used but noted above.

  **Leaf Coverage**:
  - Includes all required leaves (e.g., Grain Solution, Phenomenal Bonding variants, Panprotopsychism, Cosmopsychism, Eliminativism).
  - **Micro-Subject Eliminativism (Leaf 10)** denies the starting commitment (micro-experiential base) and is the "outsider" leaf.
  - **Non-Countabilism (Leaf 5)** has no standard name; others use standard labels.

