  **Technical Terms**:  
  - **Categorical bases**: Fundamental properties grounding dispositions (e.g., mass, charge).  
  - **Decombination problem**: Cosmopsychism's challenge to explain how one cosmic subject yields many apparent individuals (e.g., humans).  
  - **Grain of base facts**: The physical level (e.g., particles, neurons) at which intrinsic properties are instantiated.  
