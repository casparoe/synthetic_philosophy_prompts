  ### Decision Tree: The Combination Problem in Panpsychism

  **Starting Commitment**: There is something it is like to be an ordinary awake human being, and this fact has some ground in the intrinsic or categorical nature of the physical.

  1. **Grain Shift Case**: If we discovered that the categorical bases of consciousness (the intrinsic properties grounding experience) sit at the level of neurons, not fundamental particles, would the combination problem for human consciousness vanish?  
     - **Yes** → **Grain Solution (Leaf 1)**  
     - **No** → 2  

  2. **Census Question**: In a room with three awake humans, one human in dreamless sleep, and a cat, is the sleeping human a subject of experience (i.e., is there "something it is like" to be them at this moment)?  
     - **Yes** → 3  
     - **No** → 4  

  3. **Split-Brain Patient**: After callosotomy (split-brain surgery), are there two distinct subjects of experience?  
     - **Yes** → 5  
     - **No** → 6  

  4. **Census Follow-Up**: In the same room, are there any subjects of experience beyond the three awake humans and the cat (e.g., fundamental particles as micro-subjects)?  
     - **Yes** → 7  
     - **No** → 8  

  5. **Inverted-Bonding World**: Is it conceivable that a world physically identical to ours, with identical micro-experiential states, lacks unified human experience entirely?  
     - **Yes** → **Contingent Phenomenal Bonding (Leaf 2)**  
     - **No** → **Necessary Phenomenal Bonding (Leaf 3)**  

  6. **Split-Brain Resolution**: After callosotomy, is there one subject or is the question ill-posed?  
     - **One subject** → **Identity/Functionalist Reduction (Leaf 4)**  
     - **Ill-posed** → **Non-Countabilism (Leaf 5)**  

  7. **Organoid/Ant Colony Case**: Is a mature ant colony a single subject of experience?  
     - **Yes** → **Brute Emergence (Leaf 6)**  
     - **No** → 9  

  8. **Organoid Case**: Does a cortical organoid (one million neurons) have a subject of experience?  
     - **Yes** → **Panprotopsychism (Leaf 7)**  
     - **No** → **Human-Exceptionalism (Leaf 8)**  

  9. **Cosmic Subject**: Is the cosmos as a whole a single subject of experience?  
     - **Yes** → **Cosmopsychism (Leaf 9)**  
     - **No** → **Micro-Subject Eliminativism (Leaf 10)**  

  ---

  ### Leaf Positions

  | Label | Answer Pattern | View Statement | Most Awkward Commitment |
  |-------|----------------|----------------|-------------------------|
  | **1. Grain Solution** | 1-Yes | The combination problem vanishes because intrinsic properties sit at a coarse grain (e.g., brains), so no composition is needed. | A neuron or small neuron cluster has no experience, even if active and isolated. |
  | **2. Contingent Phenomenal Bonding** | 1-No, 2-Yes, 3-Yes, 5-Yes | Macro-subjects arise from micro-subjects via a contingent phenomenal relation (e.g., nomic laws of "bonding"). | Human consciousness could suddenly vanish if bonding laws fluctuate, even with unchanged physics. |
  | **3. Necessary Phenomenal Bonding** | 1-No, 2-Yes, 3-Yes, 5-No | Macro-subjects arise from micro-subjects via a necessary phenomenal relation (e.g., logical or metaphysical laws). | A scattered "human" made of spatially separated particles has a unified experience. |
  | **4. Identity/Functionalist Reduction** | 1-No, 2-Yes, 3-No, 6-One subject | The macro-subject is nothing over and above micro-subjects + their functional relations; identity is preserved. | The split-brain patient is one subject despite two independent behavioural streams. |
  | **5. Non-Countabilism** | 1-No, 2-Yes, 3-No, 6-Ill-posed | Subjects are not countable discrete entities; experience is a field or continuum. | We cannot say how many subjects are in the room—even for humans—as counting is meaningless. |
  | **6. Brute Emergence** | 1-No, 2-No, 4-Yes, 7-Yes | The macro-subject emerges holistically from micro-facts with no mediating principle. | A thermostat or simple circuit could (in principle) have subjective experience. |
  | **7. Panprotopsychism** | 1-No, 2-No, 4-No, 8-Yes | Base facts are proto-phenomenal (non-experiential precursors), and macro-experience is constituted by them. | Proto-phenomenal properties are inscrutable; we cannot describe them even vaguely. |
  | **8. Human-Exceptionalism** | 1-No, 2-No, 4-No, 8-No | Only humans (or near-human complexity) are subjects; simpler systems lack experience. | A human fetus or severely disabled human lacks experience if below a precise neuron threshold. |
  | **9. Cosmopsychism** | 1-No, 2-No, 4-Yes, 7-No, 9-Yes | The cosmos is the sole subject; humans are aspects/modes of it (facing the decombination problem). | Your pain is literally the universe's pain, not "your own" in any fundamental sense. |
  | **10. Micro-Subject Eliminativism** | 1-No, 2-No, 4-Yes, 7-No, 9-No | There are no micro-subjects; only macro-subjects exist, and the base is non-experiential. | Fundamental particles have no intrinsic nature, or their nature is purely structural. |

