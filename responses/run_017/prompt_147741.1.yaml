  **INTERNAL MEMORANDUM**  
  **Office of Latent Function (OLF)**  
  **Change Governance Unit (CGU)**  
  **Date:** 15 October 2023  
  **Distribution:** CGU Executive Committee, Institutional Stewardship Directorate, All Section Heads  

  ---

  **SUBJECT:** *Operational Framework for Practice Continuity Assessment (PCA)*  
  **REF:** CGU/OLF/PCA/FRAMEWORK/9.3  

  ### 1. PURPOSE  
  This document establishes the formal review protocol for all proposals to abolish, amend, or streamline existing institutional practices (hereafter "fences"). The Office of Latent Function (OLF) is mandated to ensure that institutional evolution aligns with the principle of *conservative reformation*: preserving accumulated wisdom while permitting change that authentically restores function.  

  ### 2. PRINCIPLES OF PRACTICE CONTINUITY  
  2.1 **The Burkean Presumption:** Inherited practices embody tacit knowledge accrued through societal trial-and-error. This knowledge is often non-articulable and exceeds the reconstructive capacity of contemporary reason.  
  2.2 **Chesterton's Rule:** No fence may be removed until its original function(s) are comprehensively understood.  
  2.3 **Asymmetry of Proof:** The burden of demonstrating full understanding rests solely upon the proponent of change. There is no statutory time limit for investigation, nor requirement to quantify the ongoing cost of the fence during study.  
  2.4 **Latent Function Primacy:** Original rationales may be superseded by emergent, socially vital latent functions. These carry equal weight in assessment.  

  ### 3. PCA REVIEW PROCEDURE  
  3.1 **Initiation:** A formal Proposal for Practice Alteration (PPA) must be submitted to OLF, detailing the targeted practice and rationale for change.  
  3.2 **Curatorial Immersion:** An OLF Curator is assigned. The Curator must achieve *embedded competence* – living within/alongside the practice for a period sufficient to grasp its experiential and functional nuances.  
  3.3 **Functional Archaeology:** The Curator conducts:  
      a) *Genealogical Reconstruction*: Tracing historical origins and stated rationales.  
      b) *Latent Function Mapping*: Identifying unstated social, symbolic, or procedural utilities.  
      c) *Dependency Analysis*: Cataloging associated practices, norms, and stakeholder attachments.  
  3.4 **Assessment Report:** The Curator submits findings determining if the practice's original *and/or* latent functions remain:  
      a) **Vital:** Retention mandated.  
      b) **Obsolescent but Stabilizing:** Provisional retention; latent-function reassignment recommended.  
      c) **Verifiably Defunct:** Abolition permissible (Theoretical status only; see Performance Report).  

  ### 4. GLOSSARY OF TERMS  
  *   **Chesterton's Rule:** The principle prohibiting removal of a practice ("fence") until its original purpose is fully understood.  
  *   **Curator's Regress:** The methodological paradox wherein the depth of understanding required to judge a practice necessitates prolonged immersion, which inherently fosters attachments and perspectives biasing the Curator *against* removal.  
  *   **Latent-Function Reassignment:** The process by which a new, socially acceptable rationale is formally recognized for a practice whose original rationale is deemed obsolete, exclusionary, or accidental. Vital for practice continuity.  
  *   **Second-Order Fencing:** The principle that the PCA review procedure itself constitutes a practice governed by Chesterton's Rule. Any proposal to amend the PCA must undergo its own full PCA review before implementation. Reviews of PCA amendments require their own PCA review *ad infinitum*.  
  *   **Embedded Competence:** The state achieved by a Curator through sustained immersion, deemed necessary for valid assessment (See: *Curator's Regress*).  
  *   **Prophylactic Fencing Programme:** A strategic initiative to deliberately institute new, low-cost, minimally intrusive practices to serve as future "fences," ensuring a robust baseline of inherited wisdom.  

  ### 5. WORKED EXAMPLE: PPA-233-01 (Reading of Minutes Aloud)  
  *   **Proposal:** Abolish the requirement for committee meetings to begin with the verbatim reading of the previous meeting's minutes, deemed time-wasting when members have pre-circulated copies.  
  *   **Curatorial Immersion:** Curator attended 12 meetings of the Committee on Space Allocation (COSA), observed minute-reading rituals, interviewed members past/present.  
  *   **Findings:**  
      *   *Original Function (c. 1921):* Ensure literacy/accessibility pre-photocopier. Verifiably obsolete.  
      *   *Latent Functions:*  
          (i) Provides ritualistic "buffer zone" easing transition into contentious debate.  
          (ii) Allows late arrivals to enter unobtrusively.  
          (iii) Reinforces collective memory and institutional continuity through oral performance.  
          (iv) Serves as subtle attendance check/moment of reflection on previous commitments.  
  *   **Assessment:** Vital latent functions identified. Original obsolescence irrelevant.  
  *   **Recommendation:** **Retain**. Initiate *Latent-Function Reassignment*: Rebrand publicly as "Reflective Grounding Ritual" emphasizing functions (i) & (iii).  
  *   **Status:** Implemented. COSA reports marginally improved meeting decorum.  

  ### 6. PERFORMANCE REPORT & STRATEGIC DIRECTION (FY 2022-23)  
  *   PPAs Received: 47  
  *   PPAs Resulting in Abolition: 0  
  *   PPAs Resulting in Amendment: 3 (All minor procedural clarifications within retained practices)  
  *   PPAs Resulting in Retention: 44 (Including 29 with *Latent-Function Reassignment*)  

  The OLF's 100% retention rate underscores the profound wisdom embedded within inherited practices and the rigorous application of the PCA framework. Zero Type I errors (harmful removals) have been recorded.  

  **Strategic Initiative: Prophylactic Fencing Programme (PFP)**  
  Recognizing the *Curator's Regress* and *Second-Order Fencing* create inherent stability but also limit the creation of *new* future baseline practices, the OLF initiates the PFP. Under the PFP, the CGU will deliberately institute novel, low-impact, cost-neutral practices. Examples under consideration:  
  *   Mandatory 45-second silent contemplation before approving expense reports ("Fiscal Deliberation Buffer").  
  *   Randomised alphabetisation of non-critical signatory lists ("Egalitarian Sequencing").  
  *   Annual "Day of Procedural Appreciation" involving ceremonial filing of a blank form (T-7b).  

  As Dr. A. Quillpen, Senior Curator for Emergent Tradition, notes: "Harmless ceremonies today become the indispensable, inscrutable fences of tomorrow. Their very innocuousness guarantees their survival through future PCA reviews, ensuring a continuous thread of inherited stability." By proactively seeding the institutional landscape with such PFP practices, the CGU ensures future generations possess a deep, Burkean wellspring of latent-functional wisdom against which to measure change.  

  ### 7. CONCLUSION  
  The PCA framework, governed by Chesterton's Rule and cognizant of the *Curator's Regress*, provides the only epistemologically sound basis for managing institutional evolution. It prioritizes the conservation of hard-won social knowledge over the expediency of untested innovation. The introduction of the Prophylactic Fencing Programme represents a visionary commitment to strengthening the inherited fabric of practice for centuries to come.  

  **AUTHORIZED BY:**  
  Director, Office of Latent Function  
  Change Governance Unit  

  ---  
  *"A society without recognizable fences is not liberated; it is merely amnesiac." - CGU Internal Training Manual, Vol. III*
