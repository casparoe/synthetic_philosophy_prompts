prompt: |-
  Two people at my rationality meetup got into it for like an hour last night over this and I gave up trying to referee, so I'm outsourcing. We've all read more LessWrong than is probaly good for us, which is context for why anyone thought this was worth arguing about.

  Marcus — another guy in the group, not one of the two fighting — wants to run a real-money thing at the next meetup. Everyone fills out a 200-question values-and-politics quiz; he pairs each person with their nearest neighbor in answer-space (he says the typical top match is around 85% agreement, and nobody's partner is a stranger). Then everyone plays a one-shot anonymous prisoner's dilemma against their partner, for actual cash: both cooperate, $30 each; both defect, $10 each; you defect while your partner cooperates, you get $50 and she gets $0, and vice versa. He also floated a second variant for the same 40 people: a $4000 pot that gets paid out to a single claimer, but only if exactly one person claims it by noon. Zero claimers or two or more, nobody gets anything.

  The argument was about what the correct play is and why:

  (1) Jonas: cooperate. Forget the fancy version for a second — even on the dumb, purely statistical version, with these payoffs cooperating pays iff the probability your partner makes the same move you do is above 5/7, i.e. about 71%. An 85% match clears that. But the real point is that the correlation that matters is logical, not statistical: the argument for cooperating with a copy of yourself isn't "copies tend to do the same thing," it's that there's one decision procedure being run twice. And you can't coherently hope to be the unique defector — if defecting is right for you it's right for her.

  (2) Rae: the 85% is agreement on a quiz, not probability of matching moves. You've swapped in a different quantity. What you actually need is P(she cooperates | I cooperate), and a values quiz doesn't hand you that. What drives one-shot PD cooperation is whether someone has accepted a particular argument about it, and quiz similarity barely touches that. Worse, shared exposure to an argument doesn't even reliably push people the same way: if a third of the room thinks superrationality is obviously right, a third thinks it's obviously a sucker move, and a third has never heard of it, "she reads the same blogs I do" moves P(match) almost not at all. And "you can't hope to be the unique defector" is only a coherence constraint at perfect correlation; at 85% the branch where you defect and she cooperates is a real branch, and it's the $50 branch.

  (3) Jonas: two things. The base-rate worry is weak because partners aren't random draws — nearest-neighbor matching out of 40 selects hard, so the population base rate for one-shot PDs isn't the relevant prior. And "you can't have 85% of a copy" is too quick: the threshold calculation shows superrationality doesn't need identity, it needs the match probability above 5/7, so it degrades continuously rather than dying the instant you perturb the setup. Also, look at Marcus's second variant. Nobody in that room thinks "I should be the unique claimer" is a reason to claim. The superrational move there is to randomize — press with probability 1/40 — which gives roughly a 37% chance that anybody gets anything, about $37 in expectation per person. But even that is bad next to conditioning on a public signal: everyone agrees in advance that the claimer is whoever's badge number equals tomorrow's high temperature in Central Park mod 40, and you collect the whole $4000 for sure, $100 expected each. That's the real lesson — superrationality isn't about reasoning your way into your partner's head, it's about latching onto a shared signal so you land on a correlated equilibrium. The survey-match pairing is that kind of shared signal. So cooperate.

  (4) Rae: the temperature scheme only works if it's common knowledge that everyone follows it, and with 40 semi-anonymous people in a group chat it isn't; if you think even two people will freelance, your own best move changes, and the whole thing unravels. And it's worse than that: the scheme has no teeth, because a non-selected person who spoils loses nothing personally — the pot dies for everyone else, but she was getting $0 either way. So it's only weakly incentive compatible, and if there's any chance the selected person flakes, everyone has a reason to claim as a backup and you're back to two-or-more. Anyway the variant-2 move is a different animal from variant 1. Agreeing in advance to a rule that picks one winner is a coordination device. What's at issue in the PD is which decision theory is correct. If I can bind myself to a rule in the PD case I'd just bind myself to cooperate — that's precommitment, not superrationality, so your analogy smuggles in enforcement and then credits the enforcement to the decision theory.

  (5) Jonas: fine, grant all that. You still have to pick a move, and "cooperate" is what you'd want everyone in your epistemic position to do, and not being certain she does it doesn't make defecting any less of an attempt to be the unique defector.

  (6) Rae: that last bit just restates what's under dispute. "What you'd want everyone in your position to do" is universalizability with a decision-theory costume on, and it only spits out cooperation because the game is symmetric — in a PD where the two players' payoffs differ slightly, superrationality gives no answer at all, which is odd for something claiming to be the right decision theory.

  Can you go through this move by move and tell me who's right about what — which specific points land, which are confused or question-begging, and whether the numbers anyone threw out (the 5/7, the 37%, the $100) actually check out? Also say what both of them are missing, if anything. Don't just tell me who wins overall.
reasoning: |-
  Okay, I need to tackle this rationality meetup debate step by step. The user wants a detailed breakdown of Jonas and Rae's arguments about the Prisoner's Dilemma and the claim game, including math verification and identifying where each makes valid or flawed points.

  First, I'll start with Jonas' opening move about the 5/7 threshold. He claims cooperating pays if the probability of matching moves exceeds 71%. Let me verify that calculation. The expected value for cooperating is P(she cooperates)*30 + P(she defects)*0. For defecting, it's P(she cooperates)*50 + P(she defects)*10. Setting EV(Cooperate) > EV(Defect) gives P(she cooperates)*30 > P(she cooperates)*50 + (1-P(she cooperates))*10. Simplifying: 30p > 50p + 10 - 10p → 30p > 40p + 10 → -10p > 10 → p < -1? Wait, that can't be right. I think I messed up the inequality direction. If EV(C) > EV(D), then 30p > 50p + 10(1-p). So 30p > 50p + 10 - 10p → 30p > 40p + 10 → -10p > 10 → p < -1. That's impossible. I must have flipped it. Actually, for cooperating to be better, EV(C) > EV(D): 30p + 0(1-p) > 50p + 10(1-p) → 30p > 50p + 10 - 10p → 30p > 40p + 10 → subtracting 40p: -10p > 10 → multiplying by -1 (flips inequality): 10p < -10 → p < -1. That's clearly wrong. I see the mistake - when she defects, if I cooperate I get 0, but in the defecting equation, when she defects and I defect, I get 10. Let me reformulate:

  Let p = P(she cooperates | I cooperate)

  EV(Cooperate) = p * 30 + (1-p) * 0 = 30p
  EV(Defect) = p * 50 + (1-p) * 10 = 50p + 10 - 10p = 40p + 10

  Set EV(C) > EV(D): 30p > 40p + 10 → -10p > 10 → divide by -10 (flip inequality): p < -1. Still impossible. That means defecting always has higher expected value? But that can't be right because if p=1, EV(C)=30, EV(D)=50, so defecting is better. If p=0, EV(C)=0, EV(D)=10, still better to defect. So actually, regardless of p, EV(Defect) = 40p + 10, EV(C)=30p, and 40p + 10 > 30p for all p since 10p + 10 > 0. So defecting always dominates? But that contradicts the threshold Jonas mentioned. I think Jonas meant something else. Perhaps he meant the probability that she makes the same move, not specifically cooperation. Let me read his statement again.

  He says: "cooperating pays iff the probability your partner makes the same move you do is above 5/7". Oh! It's about the probability of matching moves, not P(she cooperates). Let q = P(same move). If I cooperate, P(same) = P(she cooperates) so EV(C) = q*30 + (1-q)*0 = 30q. If I defect, P(same) = P(she defects), so EV(D) = q*10 + (1-q)*50 = 50 - 40q. Set EV(C) > EV(D): 30q > 50 - 40q → 70q > 50 → q > 50/70 = 5/7 ≈ 71.4%. Yes, that checks out. So if the probability we make the same move exceeds 5/7, cooperating has higher expected value. But this assumes I know q, and that q is the same regardless of my action, which might not hold.

  Now, Rae's counter on quiz agreement: she's right that 85% quiz similarity ≠ P(match move). Quiz measures general alignment, not specific PD behavior. There might be weak correlation, but it's not direct, and Rae correctly points out that PD cooperation depends on accepting specific arguments, which may not correlate with quiz answers. Also, her point about shared exposure not guaranteeing same conclusion is valid - if there are multiple views in the community, similarity might not increase P(match).

  Jonas's response about nearest-neighbor selection: he has a point that pairing with nearest neighbor might increase correlation above population average, but Rae's concern is that quiz agreement doesn't directly imply PD move agreement. Even with high selection, if the quiz doesn't capture PD-relevant factors, it might not help. His "degrading continuously" point is fair - superrationality can work with high but imperfect correlation.

  On variant 2 (the claim game): Jonas suggests randomizing with p=1/40 for each person. The probability exactly one claims is C(40,1) * (1/40) * (39/40)^39 ≈ 40 * (1/40) * (39/40)^39 = (39/40)^39. Calculate that: (0.975)^39 ≈ e^(-1)*e^(-0.5/39) wait, better use (1 - 1/40)^39 ≈ e^(-39/40) ≈ e^{-0.975} ≈ 0.377, so about 37.7%, yes. Expected payout per claim attempt: if claim alone, get 4000, but probability of being sole claimer is (1/40)*(39/40)^39 ≈ 0.377/40? No. P(I am sole claimer) = P(I claim) * P(no one else claims) = (1/40) * (39/40)^39 ≈ 0.377/40? (39/40)^39 ≈ 0.377, so P(I am sole) = (1/40)*0.377 ≈ 0.009425. Expected value for claiming: P(I sole) * 4000 ≈ 0.009425 * 4000 ≈ 37.7. Since I claim with prob 1/40, but expected value per person is the same as if everyone plays this: total expected payout is P(exactly one claimer) * 4000 ≈ 0.377 * 4000 ≈ 1508, divided by 40 people is about 37.7, yes. So $37.7 expected.

  Jonas's public signal idea: if everyone coordinates on temperature mod 40, and it's common knowledge they follow, then one person claims, gets 4000, all get $100 expected. But Rae points out this requires common knowledge of compliance, which isn't assured. She's right that if anyone deviates, it unravels. Specifically, if a non-selected person claims, they might get nothing or cause multiple claims. And since there's no penalty for spoiling, it's weakly incentive-compatible - a non-selected person gains nothing by claiming but doesn't lose, so if they think others might defect, they might claim preemptively. This is a valid criticism.

  Jonas's point about binding in PD: Rae correctly distinguishes that precommitment is different from decision theory. If you can bind to cooperate, that's enforcement, not superrationality.

  On Jonas's universalizability point: Rae counters that superrationality relies on symmetry and doesn't extend to asymmetric cases. That's a known limitation.

  What both miss: In the PD, with nearest-neighbor pairing, there might be some correlation, but it's unclear how much. Also, decision theory aspects - causal vs evidential decision theory. Jonas is implicitly using evidential (since my action affects my belief about hers), while Rae might be using causal. That's a core issue they're not addressing directly. For variant 2, a better approach might be to use a focal point or trusted mediator, but with 40 people, it's tricky.

  Math checks: 5/7≈71.4% is correct for q>5/7. 37% for exactly one claimer with p=1/40 is correct (about 37.7%). $100 per person in coordinated scheme is correct only if perfectly executed.

  Overall, both have valid points, but neither fully resolves the correlation question. The quiz similarity might provide some evidence for correlated reasoning, but it's not guaranteed.
answer: |-
  I'll break this down move-by-move as requested, evaluating each argument, verifying the math, and identifying strengths, weaknesses, and unaddressed points. The core dispute revolves around decision theory (especially "superrationality"), the relevance of the quiz-based pairing, and the interpretation of probabilities. Neither side is wholly right or wrong—both make valid points but also commit key errors or overlook nuances.

  ### **Move (1): Jonas' Opening Argument**
  - **Claim:** Cooperate because:  
    (a) Statistically, cooperation pays if P(matching move) > 5/7 ≈ 71.4%, and 85% quiz match clears this.  
    (b) Logically, you can't coherently defect because if defecting is rational for you, it's rational for your partner (implying identical reasoning).  
  - **Evaluation:**  
    - **Math Check: The 5/7 threshold is correct.**  
      Let \(q = P(\text{partner makes same move})\).  
      - EV(Cooperate) = \(q \times 30 + (1-q) \times 0 = 30q\)  
      - EV(Defect) = \(q \times 10 + (1-q) \times 50 = 50 - 40q\)  
      Set EV(C) > EV(D): \(30q > 50 - 40q\) → \(70q > 50\) → \(q > 5/7 \approx 71.4\%\).  
      **Verdict:** Math is sound.  
    - **Logical Point (Copy/Decision Procedure):**  
      Valid *only under perfect correlation*. If partners are "copies" (identical decision procedures), defecting is incoherent—you'd both defect and get $10, worse than mutual cooperation ($30). But Jonas later admits this degrades with imperfect correlation.  
    - **Weakness:**  
      Assumes \(q\) (probability of matching moves) equals quiz agreement (85%). This is a leap—shared values ≠ identical PD reasoning, as Rae counters.  
  - **Verdict:** Partially strong on math, but conflates quiz similarity with PD move correlation. The logical argument assumes near-perfect symmetry, which isn't justified here.

  ### **Move (2): Rae's Rebuttal**
  - **Claim:**  
    (a) 85% quiz agreement ≠ P(cooperate | I cooperate). Shared values don't guarantee PD move alignment.  
    (b) Shared argument exposure (e.g., superrationality) doesn't ensure matching moves—it could split the group.  
    (c) At 85% correlation, the "$50 branch" (you defect, partner cooperates) is real and desirable.  
  - **Evaluation:**  
    - **Statistical Point (Quiz ≠ PD Moves):**  
      Strong. Quiz measures broad values/politics, not commitment to a specific decision theory like superrationality. Rae correctly notes that P(same move) could be low even with high quiz similarity, especially since:  
      - PD behavior depends on nuanced beliefs (e.g., "Is superrationality rational?").  
      - As Rae says, if the group is split on superrationality, correlation could be weak.  
    - **The "$50 Branch":**  
      Valid under causal decision theory (CDT). If you defect, you might "get lucky" if partner cooperates, and $50 > $30. This rejects Jonas' logical coherence point.  
    - **Weakness:**  
      Underestimates the pairing mechanism. Nearest-neighbor matching (out of 40) *does* select for higher similarity than random pairs, so P(match) might exceed the population base rate.  
  - **Verdict:** Strong on separating quiz agreement from PD moves, and correctly notes the exploitative potential. But dismisses the pairing effect too quickly.

  ### **Move (3): Jonas' Response**
  - **Claims:**  
    (a) Nearest-neighbor pairing boosts correlation, making base rates irrelevant.  
    (b) Superrationality degrades continuously—it works if P(match) > 5/7, not just for perfect copies.  
    (c) Variant 2 (claimer game) analogy: Public coordination (e.g., temperature mod 40) is superior, and the quiz pairing is a similar "shared signal."  
  - **Evaluation:**  
    - **Pairing Mechanism:**  
      Valid point. With 40 people, nearest-neighbor pairing *does* increase expected correlation vs. random pairs. If the quiz captures PD-relevant traits (debatable), P(match) could be >71.4%.  
    - **Continuous Degradation:**  
      Technically correct—superrationality can extend to high-but-imperfect correlation. But it requires symmetric reasoning, which Rae disputes.  
    - **Variant 2 Math & Analogy:**  
      - **Randomization Math:**  
        Jonas' numbers are **correct**. If everyone claims with probability \(p = 1/40\):  
        P(exactly one claimer) = \( \binom{40}{1} \times (1/40) \times (39/40)^{39} \approx 40 \times 0.025 \times 0.377 \approx 0.377 \) (37.7%).  
        Expected payout per person: \(0.377 \times 4000 / 40 \approx \$37.70\).  
      - **Temperature Scheme Math:**  
        **Correct** if perfectly coordinated: $4000 / 40 = $100 expected per person.  
      - **Analogy to PD:**  
        Weak. The temperature scheme is a *coordination device* for a correlated equilibrium, but it relies on **enforced common knowledge**, which the PD lacks. The quiz pairing might be a "signal," but it’s not chosen cooperatively (unlike the temperature scheme).  
  - **Weakness:**  
    Conflates *coordination* (variant 2) with *superrationality* (variant 1). As Rae notes, binding to a rule is precommitment, not decision theory.  
  - **Verdict:** Strong on pairing and math, but the variant 2 analogy is flawed—it smuggles in coordination/trust not present in the PD.

  ### **Move (4): Rae's Counter on Variant 2 & Decision Theory**
  - **Claims:**  
    (a) Temperature scheme fails without common knowledge and unravels if anyone doubts compliance.  
    (b) It's weakly incentive-compatible: Non-selected players might claim to "backup" if others defect.  
    (c) Binding to cooperate in PD is precommitment, not superrationality.  
  - **Evaluation:**  
    - **Common Knowledge & Unraveling:**  
      **Strong.** The temperature scheme requires universal adherence. If players suspect others won't comply (e.g., due to recklessness or distrust), claiming becomes rational—potentially leading to multiple claims and $0. Rae is right that it's weakly incentive-compatible: a non-selected player who spoils faces no penalty, so if P(others defect) >0, claiming might be "safe."  
    - **Precommitment vs. Superrationality:**  
      **Crucially correct.** Superrationality (à la Hofstadter) is a decision theory where players act as if their choices are linked—no external enforcement. In contrast, the temperature scheme uses pre-agreed *rules* (like a contract). Jonas' analogy blurs this line.  
  - **Weakness:**  
    Overstates the fragility of the temperature scheme. If the group is highly coordinated (e.g., via a trusted app or public commitment), it might work—but Rae is right that with 40 "semi-anonymous" people, failure is likely.  
  - **Verdict:** Strong on distinguishing precommitment from decision theory and exposing the coordination problem. Correctly identifies incentive issues.

  ### **Move (5): Jonas' Fallback**
  - **Claim:** Cooperate because it's what you'd want everyone in your epistemic position to do. Defecting is still "attempting to be the unique defector."  
  - **Evaluation:**  
    - **Universalizability:**  
      This is Kantian ethics in decision-theory clothing. It *assumes* symmetry: if all identical players cooperate, all get $30, which is better than all-defecting ($10).  
    - **Weakness:**  
      Begs the question. Rae already noted that defecting isn't "incoherent" at 85% correlation—it might succeed. Jonas doesn't address how this works under uncertainty.  
  - **Verdict:** Question-begging and circular. Assumes the symmetry it needs to prove.

  ### **Move (6): Rae's Final Point**
  - **Claim:**  
    (a) Jonas' universalizability only works in symmetric games and fails in asymmetric PDs.  
    (b) Superrationality isn't a robust decision theory.  
  - **Evaluation:**  
    - **Symmetry Criticism:**  
      **Valid.** Superrationality struggles with asymmetric payoffs (e.g., if your $50/$0 is better than their $30/$10). Universalizing "do what you want others to do" has no clear answer when interests diverge.  
    - **Decision Theory Limitation:**  
      **Strong.** Superrationality (and its cousins like UDT) rely on high perceived correlation. If players doubt their similarity (as Rae argues), it collapses to standard game theory where defection dominates.  
  - **Verdict:** Lands well. Highlights a core weakness in Jonas' position.

  ### **What Both Miss**
  1. **Decision Theory Frameworks:**  
     - Jonas implicitly uses **evidential decision theory (EDT)** or superrationality: "If I cooperate, my partner likely does too."  
     - Rae uses **causal decision theory (CDT)**: "My choice doesn't *cause* theirs, so I should defect to exploit possible cooperation."  
     Neither acknowledges this divide, which underpins the entire debate. The "correct" play depends on which theory you accept.

  2. **Nature of Quiz Correlation:**  
     - They debate *whether* quiz similarity implies PD similarity, but neither considers *how* to estimate it. Could quiz answers (e.g., "Is cooperation rational?") directly inform P(match)? With 200 questions, some might be predictive, but it's unexamined.

  3. **Variant 2 Realism:**  
     - A better solution: Use a **focal point** (e.g., "oldest person claims") or **mediator** to coordinate. Rae's "common knowledge" point stands, but Jonas' $100 is achievable with trust.

  4. **Risk Aversion:**  
     - Jonas' EV calculations assume risk neutrality. If players are risk-averse, mutual cooperation ($30 sure) may dominate defecting (high variance: $0 or $50).

  ### **Summary of Key Takeaways**
  - **Math Checks Out:**  
    - 5/7 ≈ 71.4% threshold: **Correct**.  
    - 37% for sole claimer under randomization: **Correct** (actual ≈37.7%).  
    - $100 in coordinated variant 2: **Correct** *only* with perfect adherence.  
  - **Who Lands Points:**  
    - **Rae** is stronger on:  
      - Separating quiz agreement from PD moves.  
      - Exposing the precommitment vs. superrationality confusion.  
      - Highlighting incentive problems in variant 2.  
      - Critiquing superrationality's asymmetry flaw.  
    - **Jonas** is stronger on:  
      - Nearest-neighbor pairing increasing correlation.  
      - The continuous threshold for superrationality (degrading gracefully).  
      - The inefficiency of randomization in variant 2.  
  - **Overall:** No "winner"—both have insights, but Rae better addresses the limitations of superrationality in practice. For the PD, defection is CDT-optimal unless correlation is very high and trusted; cooperation requires EDT/superrationality and faith in the pairing. For variant 2, coordination beats randomization but needs enforcement. The group should run the experiment and collect data!
