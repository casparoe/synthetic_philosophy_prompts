prompt: |-
  On thursday I'm presenting at a joint econ-theory / philosophy workshop on the foundations of strategic reasoning. 25 minutes plus 15 for questions, and I'm more worried about the questions than the talk. Paper draft is done, slides are not.

  My thesis: textbooks sell iterated elimination of strictly dominated strategies *in mixed strategies* (call it IEMDS) as just the more powerful version of plain iterated strict dominance, but in games with three or more players it quietly imports an independence assumption that pure elimination doesn't have, and the correlation-robust version of the procedure gives strictly larger predictions. Sketch of the argument I'll give:

  - A single round of mixed dominance is checked pointwise against pure opponent profiles, so at that step correlation doesn't enter at all.
  - The step that does care is "eliminate a_i because it isn't a best response to any belief over the others' surviving strategies." My payoff isn't additively separable in the other two players' actions, so my expected payoff against a joint distribution over their profiles isn't the same as my expected payoff against that distribution's marginals. With three players, correlated conjectures genuinely enlarge the best-response set.
  - With two players there's only one opponent, so a joint distribution over S_-i just *is* a mixed strategy of his, there's no distinction to draw, and IEMDS coincides with the correlation-friendly procedure (and hence with rationalizability). In three-player games the two procedures come apart.
  - Rationality and common belief in rationality don't give you independence of beliefs for free; independence is an extra assumption about the type structure, so the textbook procedure is assuming more than the textbooks say it is.

  The object I define: keep, at each round, exactly the strategies that are best responses to *some* arbitrary joint distribution over the others' surviving strategy profiles. I claim this is order-independent because the survivor operator is monotone. Second half of the paper introduces a variant I'm calling best-response-anchored elimination: you may only eliminate a_i in favour of a mixture that is itself still alive (not itself eliminable) at the next round — a hybrid of mixed dominance and iterated admissibility. I conjecture it's order-independent even though iterated weak dominance isn't; I have a proof for two players and a brute-force check over 3x3x3 games.

  The room: two epistemic game theorists who think exclusively in type structures, belief hierarchies and RCBR-style characterizations, and who will treat a bare definition as unfinished business; one decision theorist who will want to know what a mixed strategy even is on my account (an act I randomize over, or a belief you hold about me?) and whether "dominance" is doing normative work; two behavioral/experimental people whose default is level-k and who will ask how many rounds of reasoning this needs and whether any subject has ever been shown to represent two opponents' actions as correlated; and one political scientist who builds applied models and will ask, reasonably, why anyone outside foundations should care.

  What I want from you: a Q&A prep sheet, not a defense of the view. Eight-ish objections in the order they'll actually arrive, each phrased the way that person would phrase it (I want to hear the epistemic theorists saying "characterization" and the experimentalists saying "show me the design"), each with a two-minute reply and a note on where the reply is soft. What should I give away in the first two minutes so it doesn't look like I got caught? Which single reply has to land or the whole paper is dead? And give me the one question I'm hoping nobody asks. Also: if my running example needs some specific structure for the correlation point to bite — I've been using a three-player effort game where the other two players' efforts interact in my payoff — say so, and flag anywhere my argument is actually wrong rather than just under-argued.
reasoning: |-
  Okay, the user is preparing for a workshop presentation on strategic reasoning foundations, specifically critiquing the textbook treatment of iterated elimination of strictly dominated strategies in mixed strategies (IEMDS) for multi-player games. They've identified a key issue: IEMDS implicitly assumes independence between opponents' strategies when it shouldn't, leading to smaller solution sets than a correlation-robust approach. 

  Hmm, the user's analysis seems technically sound at first glance—the core insight about correlation mattering in ≥3-player games is correct. But I notice their running example (three-player effort game) might be underdeveloped. If the payoff interaction isn't sharply asymmetric (e.g., if Player 1 cares about the sum of others' efforts), independence wouldn't hurt—correlation needs to create new best responses. They should tweak the example to show strict improvement.

  The Q&A prep request is very specific. The user anticipates four distinct audiences, each with disciplinary quirks. The epistemic game theorists will demand type structures; the decision theorist will grill them on ontology; behavioralists will want psychological realism; and the political scientist will seek relevance. Each objection needs a tailored rebuttal.

  For the epistemic crowd, the user must concede upfront that their procedure isn't characterized by RCBR—it's deliberately belief-based. The soft spot: they haven't built a type structure for it. For the decision theorist, they should clarify that "mixed strategy" here refers to the opponent's belief object, not the agent's randomized act. The vulnerability: this might not satisfy operationalist critics.

  The behavioralists' "show me the design" challenge is tricky. User should admit no direct evidence but pivot to revealed-preference logic: if subjects avoid strategies robustly dominated under correlation, that's indirect support. The weakest reply here—it's speculative.

  Most critical is the political scientist's "why care" question. If the user can't demonstrate applied impact (e.g., correlated beliefs changing equilibrium predictions in voting/auction models), the paper feels academic. They must have one concrete applied example ready.

  The nightmare question? Probably why common belief in rationality doesn't imply independence—they'll need to cite epistemic results (e.g., Battigalli-Siniscalchi) showing correlated types exist. If they blank on this, it undermines their thesis.

  User seems well-prepared but nervous about pushback. Their self-awareness about soft spots (e.g., order-dependence conjecture) is good. Stress that acknowledging limitations disarms critics—and remind them to seed concessions early (e.g., "This isn't characterized by RCBR, but..." in slide 1).
answer: |-
  Here’s your Q&A prep sheet, structured by likely questioner, with objections phrased authentically, prioritized by expected sequence, and tactical advice on concessions and critical replies. Key soft spots and a nightmare question flagged at the end.

  ---

  ### **Objection 1 (Epistemic Theorist #1)**  
  *"Your procedure lacks a characterization in terms of rationality and common belief in rationality (RCBR). Without a type structure, how do we know what epistemic conditions justify it?"*  
  **Reply (1.5 min):** "You’re right—this is deliberately *pre*-epistemic. I’m showing that textbook IEMDS *isn’t* equivalent to RCBR in ≥3-player games because it sneaks in independence. My procedure is the *outcome* of RCBR *without* assuming players rule out correlated beliefs. For characterization, we’d need types where beliefs can correlate—I’m working on that next."  
  **Soft Spot:** Admits the procedure isn’t epistemically grounded yet. Pre-empt by saying this in the talk: *"This is a caution about textbook definitions, not yet a full epistemic alternative."*

  ---

  ### **Objection 2 (Decision Theorist)**  
  *"What is a ‘mixed strategy’ here? If it’s my randomizing act, why should opponents assume independence? If it’s their belief, is dominance even the right lens?"*  
  **Reply (1 min):** "Crucially, it’s the *opponents’ beliefs about others’ strategies*. IEMDS assumes these beliefs are independent across players. But dominance is defined by pointwise comparisons—it’s the best-response step where independence bites. We should separate dominance (which is belief-free) from rationalizability (which isn’t)."  
  **Soft Spot:** Blurs decision-theoretic and epistemic uses of "mixed strategy." **Concede early:** In slide 1, clarify *"Mixed strategy = belief over your opponents’ strategy profiles."*

  ---

  ### **Objection 3 (Behavioral/Experimentalist #1)**  
  *"Show me the experimental design where real players exploit correlation. Level-k agents don’t represent correlated beliefs—so why is this behaviorally relevant?"*  
  **Reply (1 min):** "Great question. We don’t have direct evidence yet—but if subjects avoid strategies that *only* dominate under independence (e.g., in my effort game), that suggests implicit correlation sensitivity. Level-k *could* be enriched with correlation; after all, L1 thinks others are random, but needn’t assume independence."  
  **Soft Spot:** Pure speculation. **Tactical give:** *"I agree this needs testing—but if we don’t model correlation-robustness, we might misclassify rational behavior as irrational."*

  ---

  ### **Objection 4 (Epistemic Theorist #2)**  
  *"Independence *is* implied by common belief in rationality under *some* type structures. Why call it an ‘extra assumption’?"*  
  **Reply (2 min):** "Only in structures where types encode independent beliefs! The textbook presentation never mentions this. My point: RCBR *allows* correlated beliefs (e.g., in Heifetz–Neeman structures), so the solution concept should too. IEMDS arbitrarily rules those out."  
  **Critical Landmine:** If this reply fails, the thesis collapses. **Hammer:** *"Independence isn’t entailed by RCBR; it’s a restriction on the type space."* Cite Dekel–Siniscalchi (2011) if pressed.

  ---

  ### **Objection 5 (Political Scientist)**  
  *"Why should I care? In applied models, we assume Nash equilibrium anyway—and correlation is irrelevant there."*  
  **Reply (1 min):** "Two reasons: First, IEMDS is often used as a pre-equilibrium refinement (e.g., in auctions). If it’s smaller than the rationalizable set, you might discard plausible equilibria. Second, in incomplete-information games, correlation in beliefs *does* matter (e.g., global games). Foundations affect applied robustness."  
  **Soft Spot:** Applied impact is indirect. **Hook them:** Use an applied example (e.g., lobbying game where firms correlate efforts).

  ---

  ### **Objection 6 (Behavioral/Experimentalist #2)**  
  *"How many rounds of reasoning does this need? If it’s more than two, it’s cognitively implausible."*  
  **Reply (1 min):** "The correlation-aware set is *larger*, so it actually *reduces* the need for high-level reasoning: players keep more strategies early on. A level-1 player might survive in my set but be eliminated by IEMDS."  
  **Tactical:** Position this as *less* demanding: *"It doesn’t require deeper thinking—just not assuming away correlation."*

  ---

  ### **Objection 7 (Decision Theorist, follow-up)**  
  *"Your ‘best-response-anchored’ hybrid sounds like iterated admissibility. Is it really order-independent?"*  
  **Reply (1 min):** "In 2-player games, yes—I have a proof. For 3 players, my conjecture holds in all 3x3x3 games I’ve brute-forced. It’s *not* iterated weak dominance: we require elimination only by mixtures that are themselves robust at the next round. Order-independence likely comes from this anchoring."  
  **Soft Spot:** Conjecture unproven. **Flag upfront:** *"This is conjectural—but initial checks are promising."*

  ---

  ### **Objection 8 (Epistemic Theorist #1, round two)**  
  *"If players can have correlated beliefs, why stop at mixed strategies? Shouldn’t we allow correlated* strategies *too?"*  
  **Reply (1 min):** "Correlated *strategies* require communication. Correlated *beliefs* don’t—they’re about how I model others’ interdependence. My procedure captures this while keeping strategies uncorrelated."  
  **Soft Spot:** Sidesteps epistemic foundations. **Safe out:** *"That’s beyond scope—here, I’m fixing textbook mixed dominance."*

  ---

  ### **The Nightmare Question**  
  *"Give a minimal example where correlation matters: a 3-player game where IEMDS eliminates a strategy, but your procedure keeps it, and it’s rationalizable under correlated beliefs."*  
  **Why it’s scary:** If your example is fragile or symmetric, it won’t bite.  
  **Must-Have Structure:**  
  - Player 1’s payoff depends non-additively on Players 2 and 3 (e.g., **u₁(a,b,c) = b·c**).  
  - Design so that:  
    - Under independence, some action *a* of Player 1 is never a best response.  
    - Under correlation (e.g., belief that b and c are perfectly correlated), *a* *is* a best response.  
  **Example Skeleton:**  
  ```
  Player 1: Actions {a, a'}  
  Player 2: Actions {b, b'}  
  Player 3: Actions {c, c'}  

  Payoffs for P1:  
  - If P2 plays b, P3 plays c: u₁(a) = 0, u₁(a') = 1  
  - If P2 plays b', P3 plays c': u₁(a) = 0, u₁(a') = -1  
  - But if (b,c') or (b',c): u₁(a) = 3, u₁(a') = 0  
  ```
  Under independent beliefs, P1 expects (b,c) or (b',c') most—making a′ dominate. Under correlated belief where P2/P3 play (b,c) or (b′,c′), a′ is best. But if P1 believes *only* (b,c′) occurs, a is strictly best. If (b,c′) survives one round, a stays.  

  **If you lack this:** Your argument is under-argued. Test your effort game for this payoff structure.

  ---

  ### **Summary Tactics**  
  - **Give away early:**  
    - *"Textbook IEMDS assumes independent beliefs; RCBR doesn’t require this."*  
    - *"Best-response-anchored elimination is conjectural for n≥3."*  
  - **Make-or-break reply:** The RCBR/independence point (Objection 4). If they reject that independence isn’t implied by RCBR, your thesis fails.  
  - **Structure your example:** Ensure payoff non-separability creates a correlation premium.  
  - **Wrong argument alert:** Your point about a single round of dominance being correlation-free is correct. The error would be claiming correlation affects dominance itself—it doesn’t; it affects best responses.  

  Good luck—your thesis is sharp and deserves attention. Stay firm on the RCBR point, and your critics will respect it.
