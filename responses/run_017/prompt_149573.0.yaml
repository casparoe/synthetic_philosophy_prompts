prompt: |-
  I'm in a final-year philosophy-and-law seminar on punishment, and my term paper argues that most of the retributivism-versus-consequentialism literature is answering a question no institution actually faces. The question an institution faces is: which sentence, for this offender, under these procedures, given what we know about how the system in fact operates. So before I go further into that literature I want the specification. What would a theory of punishment have to be able to deliver to count as adequate for a real sentencing commission — one that must generate, check, and publicly defend actual sentence lengths in a jurisdiction with entrenched rights guarantees, guilty pleas resolving the large majority of cases, criminal liability for corporations, and a known nonzero wrongful-conviction rate?

  Please write the desiderata. I want a numbered list in which every requirement comes with the case or consideration that makes it a requirement, and with your verdict on whether it is non-negotiable or merely a preference of one camp. Group the list if that helps, and add requirements I've missed. The cases I have in mind, and which I want handled rather than gestured at:

  The innocence constraint, and the case that tests how strong it really is: an official who can avert a lethal riot only by framing and punishing one person known to be uninvolved. Whether that is excluded by a right, by what punishment means, or by what authorizing it would do to officials and to the law's credibility, matters to me.

  The line between a penalty and a price. A congestion charge, a regulatory fine, punitive damages against a firm, and a criminal fine look functionally similar; if a sanction is only a price, the procedural protections of criminal law do not attach. The theory has to say where it draws that line and why.

  Grip on magnitudes, not just on order. Any view can say that worse crimes deserve more. I need to know what in the theory fixes why a term is two years rather than six months or twenty, whether there is an upper bound that holds independently of deterrent payoff, and whether the bottom of the scale can be non-custodial at all.

  Whether probability may be traded against severity. Where clearance rates are low, deterrence reasoning pushes expected punishment up by raising the tariff, and proportionality pushes back; a commission needs an explicit answer, not a shrug.

  Marginal deterrence: the requirement that the tariff not give an offender a reason to prefer the more serious of two offences — the case where the penalty is the same whether the victim is left alive or not.

  Robustness to error. Given a known rate of wrongful conviction, does the theory discount what may be done to the guilty in order to reduce what will be done to the innocent, and are those error costs spread across all sentences or concentrated at the severe end? A pure desert view has a clean answer here, and I suspect it is the wrong one.

  The plea-bargaining shadow. Since most sentences are not the output of a trial, the theory must say what it is justifying — the sentence pronounced, the sentence served, or the expected sentence produced by a bargaining system — and must have a verdict on the trial penalty and on the discount for pleading guilty.

  Defendants that cannot suffer. Corporate fines fall on shareholders, employees, or customers rather than on anything that feels them. The theory must say whether desert is even coherent for legal persons, and whether treating them on deterrence grounds alone is consistent with treating them as agents elsewhere in the law.

  Temporal decay. The person released at seventy-eight after forty years is not the person who offended at thirty-eight. Does the theory permit release because the desert has been outrun — cases: whole-life tariffs, geriatric and compassionate release, remittal for rehabilitation — or does it require the full term?

  Blameworthiness versus liability to state punishment, in the cases of small participants in large wrongs — the clerk, the driver, the junior officer — where the architects are dead, retired, or beyond reach.

  The gap between nominal sentence and lived severity: the same term is far harsher for a prisoner who is elderly, disabled, or held in isolation. Must the theory equalize the burden or the number?

  Lapse and amnesty. Statutes of limitation, pardons, and truth-and-reconciliation style settlements: do these extinguish desert, or only bar its enforcement? A theory of punishment, as opposed to a theory of blame, should be able to say which.

  Finally, administrability: whatever the theory says, officials of ordinary competence must be able to reach the same sentence from it, and I want to know whether that demand is itself in tension with taking desert seriously at all.

  Three things beyond the list, which are the parts I most want. First: if some subset of these requirements cannot be jointly satisfied, say which pair or triple breaks, and which one you would give up — the list itself is allowed to be a result rather than a menu. Second: name the single requirement that does the most work in excluding candidates, and defend that choice. Third: name one requirement that is widely insisted on in this literature and that you think is really a camp prejudice — something only a retributivist, only a consequentialist, or only an abolitionist would care about — and say why it should come off the list.

  Please commit to all of these rather than surveying the options for me; argue for the verdicts you give. Where you think the answer genuinely turns on a prior commitment I have not specified, name that commitment and what turns on it, but still state which way you would go. Keep the weight on the criteria and their motivating cases: a short scorecard at the end — a few lines each on retributivism, deterrence-based consequentialism, a mixed or desert-capped consequentialist view, and a restorative or abolition-oriented view, if you think it belongs on the list at all — is enough. Around 1,400 words; a table is fine if it earns its place.
reasoning: |-
  Okay, let me unpack this complex philosophy-and-law query. The user is developing a critique of punishment theory literature for their final-year seminar, arguing that academic debates miss what real sentencing commissions actually need. They want a numbered list of desiderata for a practical theory of punishment, grounded in specific hard cases, with analysis of what's non-negotiable versus preference-based.

  Hmm, the depth here is impressive - they've identified 13 nuanced problem areas from wrongful convictions to corporate punishment, each with concrete test cases. This isn't about abstract philosophy; it's about what a sentencing guideline drafters would need at 3am when writing actual rules. The three bonus requests are particularly sharp: forcing admission of irreconcilable conflicts, identifying the most exclusionary criterion, and calling out ideological baggage.

  First, I'll need to structure this carefully. The numbered requirements should cluster logically: maybe procedural constraints first (innocence, plea deals), then conceptual boundaries (price/penalty distinction), then scaling challenges (magnitudes, trading severity/probability), followed by special cases (corporations, decayed identity). Each point must explicitly reference their test cases - like the lethal riot framing dilemma for innocence - and declare whether it's foundational or debatable.

  For the conflicts... the innocence constraint vs. consequentialist emergencies feels like the biggest rupture. If I have to choose, preserving the innocence barrier is non-negotiable even if it means sacrificing optimal deterrence in extreme scenarios. And administrability might be the silent killer - many elegant theories collapse when ordinary officials try applying them.

  The ideological baggage target? Probably "temporal decay" arguments. Retributivists get oddly invested in punishing aged offenders despite changed identities, when practical systems need geriatric release valves. That's more about philosophical purity than real-world operation.

  Corporate punishment deserves special attention - if we punish firms deterrence-only while treating natural persons retributively, that's a consistency hole big enough to drive a truck through. Either moral agency matters or it doesn't.

  When scoring theories later, I'll be brutal: retributivism fails magnitude-setting and plea deals; pure consequentialism crashes on innocence and marginal deterrence; restorative justice struggles with scalability. The mixed "desert-capped" view might survive most bullets but still chokes on corporate cases.

  Final note to self: their congestion charge vs. criminal fine example is genius for exposing the price/penalty blur. The response must honor that insight by demanding a bright-line test no theory currently provides.
answer: |-
  Here is a numbered list of desiderata for a theory of punishment adequate for a real sentencing commission, grounded in your specified cases and considerations. I group them thematically, argue for verdicts, and add requirements you may have missed. Non-negotiable requirements are labeled **(NN)**; others reflect strong institutional needs but admit theoretical debate.

  ### I. Foundational Constraints (Non-Negotiable Legitimacy)
  1.  **The Absolute Innocence Constraint (NN):** The theory *must* categorically prohibit the intentional punishment of a person known to be factually innocent of the offense charged, *even to avert catastrophic consequences* (e.g., framing one to stop a lethal riot). **Case:** Lethal riot framing scenario. **Verdict:** Non-Negotiable. Justification: The core legitimacy of the state's punitive power hinges on its claim to punish only the guilty. Authorizing such an act destroys the moral and legal foundation of punishment itself, eroding official integrity, public trust, and the very concept of justice-as-desert. Consequentialist gains here are illusory; the systemic cost is existential collapse. *This is the single most work-excluding requirement.* Pure deterrence-based consequentialism fails here; only theories incorporating deontic constraints (strong rights, communicative integrity, or institutional necessity) pass.

  2.  **Distinguishing Penalty from Price (NN):** The theory must provide a clear, principled distinction between a criminal punishment (triggering full criminal procedural protections) and a mere civil/regulatory sanction ("price"). **Case:** Congestion charge vs. criminal fine; punitive damages vs. criminal penalty. **Verdict:** Non-Negotiable. Justification: Constitutional rights (due process, jury trial, presumption of innocence, double jeopardy, protection against self-incrimination) attach specifically to criminal punishment. The distinction cannot be purely functional (deterrence/cost); it must hinge on concepts like *censure*, *stigmatization*, *moral wrongdoing*, or the *state's expressive condemnation of a public wrong*. A theory reducing all sanctions to mere prices undermines the justification for these crucial rights.

  3.  **Robustness to Known Error Rates (NN):** The theory must explicitly account for the known, irreducible risk of wrongful conviction. **Case:** Known non-zero wrongful conviction rate. **Verdict:** Non-Negotiable. Justification: Punishing the innocent is a profound injustice. A theory must discount the severity of punishments imposed on the *guilty* to mitigate the catastrophic harm inflicted on the *wrongfully convicted*. This implies either (a) an absolute cap on sentence severity driven by error-risk tolerance, or (b) a systematic downward adjustment of *all* sentences proportional to the error rate. Pure retributivism ("give the guilty their *exact* desert regardless of error") fails this; it imposes unacceptable risk on the innocent.

  ### II. Scaling & Structuring Punishment (Operational Necessity)
  4.  **Grip on Magnitudes (NN):** The theory must provide principled guidance for setting specific sentence lengths/ranges (e.g., 2 years vs. 6 months vs. 20 years), including establishing an upper bound independent of marginal deterrence, and justifying non-custodial options at the lower end. **Case:** Need for specific guidelines beyond ordinal rankings. **Verdict:** Non-Negotiable for institutional function. Justification: A sentencing commission *must* generate specific numbers. Theories relying solely on ordinal proportionality (worse crime = worse punishment) or open-ended deterrence optimization are operationally inadequate. Anchoring points (e.g., harm scales, typical life expectancies, community standards of "sufficient" censure) or calibrated harm/culpability metrics are needed. This strongly challenges purely expressive retributivism and pure deterrence.

  5.  **Resolving Severity-Probability Trade-offs:** The theory must explicitly prescribe whether, and to what extent, low clearance/conviction rates can justify increasing the severity of punishment for those *caught* to maintain deterrence (raising "expected punishment"), or if proportionality constraints forbid this. **Case:** Low clearance rates pushing deterrence towards harsher sentences. **Verdict:** Preference (but failure to address cripples policy). Justification: This is a core tension between consequentialism (often favoring trade-offs) and retributivism (often rejecting them as punishing the caught more harshly for system failures). A commission *needs* an answer. A mixed view (desert-capped consequentialism) might allow limited trade-offs within proportionality bounds, but pure views clash sharply.

  6.  **Ensuring Marginal Deterrence:** The tariff structure must avoid creating incentives to commit more serious offenses. Punishments for lesser-included or closely related offenses must be sufficiently lower than for the more serious variant. **Case:** Same penalty for assault vs. murder incentivizing killing the witness. **Verdict:** Strong Preference (near-NN for system functionality). Justification: A tariff that *encourages* worse crimes is perverse and undermines public safety. While primarily a consequentialist concern, even retributive scales typically build in ordinal proportionality that supports marginal deterrence. Any theory ignoring this creates dangerous practical flaws.

  7.  **Addressing Temporal Decay/Identity Change:** The theory must account for whether the offender at the time of potential release is still meaningfully the "same person" who committed the crime and deserving of continued punishment. **Case:** Geriatric release after 40 years; compassionate release; remittal for rehabilitation. **Verdict:** Preference (but critical for humane operation). Justification: Pure retributivism often struggles here, potentially insisting the debt must be paid regardless. Consequentialist/rehabilitative views more readily support release based on changed risk or identity. A communicative view might see the message as delivered. This tests the theory's view of punishment's temporal object.

  ### III. Systemic Realities & Complex Agents
  8.  **Accounting for the Plea-Bargaining Shadow:** The theory must define what it is justifying – the statutory maximum, the "trial sentence," the "plea sentence," or the expected sentence – and take a stance on the "trial penalty" and guilty plea discounts. **Case:** Majority of cases resolved by plea, not trial verdict. **Verdict:** Non-Negotiable (for real-world relevance). Justification: The *actual* sentence imposed is overwhelmingly the product of negotiation, not the theory applied at trial. A theory must justify *this* reality – e.g., by endorsing discounts as efficiency gains (consequentialist), viewing the plea as acceptance of censure (communicative), or condemning the trial penalty as coercive (rights-based). Ignoring plea bargaining renders the theory irrelevant.

  9.  **Punishing Non-Suffering Agents:** The theory must explain the coherence and justification of punishing corporations or other entities incapable of experiencing suffering in the way natural persons do. **Case:** Corporate criminal liability/fines. **Verdict:** Preference (but essential for modern systems). Justification: If punishment requires suffering for desert, corporate punishment seems incoherent. Deterrence/incapacitation easily justify it. The theory must reconcile this with treating corporations as agents elsewhere (e.g., contract/tort). A consistent view might see corporate punishment as purely regulatory/deterrent, distinct from censure-based punishment of individuals, challenging unified theories.

  10. **Apportioning Blame in Collective Wrongdoing:** The theory must guide sentencing minor participants in large-scale harms (e.g., clerk, driver) when major architects are unpunished. **Case:** Junior officer in systemic atrocity; low-level employee in corporate fraud. **Verdict:** Preference (critical for proportionality). Justification: Does the minor actor deserve less simply because others escaped? Or is their desert based solely on their own contribution? Retributivism focuses on individual culpability. Consequentialism might adjust based on symbolic need or deterrence value. The theory must avoid the trap of over-punishing the small fry to compensate.

  11. **Equalizing Burden vs. Nominal Term:** The theory must address whether equivalent nominal sentences should be adjusted to account for differential subjective severity (e.g., elderly, disabled, solitary confinement). **Case:** Same term being harsher due to age, disability, or conditions. **Verdict:** Preference (linked to humanity/equity). Justification: Should punishment equalize the *experience* of hardship (suggesting adjustments) or impose an equal *quantum* of state-imposed deprivation? Retributivism often leans towards the latter (desert is fixed); consequentialism/rehabilitation might favor the former (minimizing unnecessary harm/optimizing outcomes). This tests the theory's view of the punishment's "currency."

  ### IV. Temporal & Administrative Boundaries
  12. **Accounting for Lapse and Amnesty:** The theory must explain the status of desert when punishment is barred by statutes of limitation, pardons, or amnesties (e.g., truth commissions). **Case:** Statutes of limitation; post-conflict amnesties. **Verdict:** Preference (important for transitional justice). Justification: Does desert expire? Is it merely unenforceable? Does forgiveness extinguish it? A theory of state punishment must distinguish the persistence of moral blame from the state's legitimate authority to punish *now*. Retributivism often sees desert as persistent but potentially unenforceable; consequentialism sees enforcement as contingent on utility.

  13. **Administrability (NN):** The theory must generate sufficiently determinate and consistent guidance that officials of ordinary competence can apply it reliably to reach similar sentences in similar cases. **Case:** Need for predictable, consistent guidelines. **Verdict:** Non-Negotiable. Justification: Law requires predictability and fairness (treating like cases alike). A theory that is radically indeterminate (some expressive retributivism) or requires impossible calculations (perfect deterrence) fails as a basis for a real institution. This *is* in tension with highly particularized views of desert, demanding sufficient generalization/rules.

  ### Added Requirement
  14. **Feasibility Under Resource Constraints:** The theory must generate guidance that is feasible to implement given realistic budgetary, prison capacity, and personnel constraints. **Case:** System operating near capacity; limited probation resources. **Verdict:** Strong Preference (institutional reality). Justification: A theory mandating impossibly expensive sentences (e.g., mass life imprisonment for mid-level crimes) or unattainable rehabilitative programs is operationally irrelevant. It must either constrain its demands or prioritize within them.

  ### Conflicts, Exclusion, & Baggage
  *   **Irreconcilable Conflict:** The strongest conflict is between **Absolute Innocence (1)** and maximizing **Deterrence/Mitigating Emergencies (implied in 5, tested by 1)**. The lethal riot case forces the choice: protect the innocent scapegoat or save many lives. **I would give up the consequentialist emergency override.** Sacrificing the foundational principle of guilt for expediency destroys the system’s legitimacy and opens the door to limitless abuse. The cost of *not* framing might be horrific, but the cost of *authorizing* framing is systemically catastrophic.
  *   **Most Exclusionary Requirement:** **Absolute Innocence Constraint (1)** does the most work. It categorically excludes any pure consequentialist theory that would permit punishing the innocent when benefits outweigh costs (e.g., act-utilitarianism). Only theories with strong deontological side-constraints (rights, communicative integrity) or that define punishment *inherently* as for the guilty survive.
  *   **Camp Prejudice to Reject:** **Pure Temporal Identity Persistence for Desert (within 7)**. The insistence that the 78-year-old *must* serve the full term because they are metaphysically identical to the 38-year-old offender is largely a retributivist preoccupation. It often stems from a specific (contestable) view of personal identity over time and the irrevocable nature of desert. This metaphysical concern has little practical relevance to running a humane and effective penal system and can obstruct sensible policies like geriatric release. Desert can be seen as owed by the *person* (whose identity persists legally/morally) but its *enforcement* can be tempered by changed circumstances and humanity without denying the persistence of the debt conceptually. This specific metaphysical purity test should come off the list as a core requirement for an institutional theory.

  ### Theory Scorecard
  *   **Retributivism (Pure):** Fails 3 (Robustness to Error), 5 (Severity-Probability Trade-offs - rejects), 8 (Plea Bargaining - struggles), 9 (Corporations - incoherent), 13 (Administrability - often weak), 14 (Resources - inflexible). Excels at 1 (Innocence), 2 (Penalty/Price), 4 (Grip - if anchored), 10 (Apportionment). Struggles with 7 (Decay).
  *   **Deterrence-Based Consequentialism (Pure):** Fails catastrophically at 1 (Innocence), 2 (Penalty/Price - reduces to price), 6 (Marginal Deterrence - can perversely fail if not carefully structured), 3 (Robustness - ignores error costs on innocent), 10 (Apportionment - may scapegoat small fry). Excels at 5 (Trade-offs), 6 (Marginal Deterrence - when designed right), 8 (Plea - efficiency), 9 (Corporations). Weak on 4 (Magnitudes - no intrinsic anchor), 7 (Decay - irrelevant).
  *   **Mixed / Desert-Capped Consequentialism:** Most promising. Can satisfy 1 (NN via desert core), 2 (NN via censure), 3 (NN via capping/error discounting), 4 (via desert anchoring), 5 (Trade-offs within desert bounds), 6 (Marginal Deterrence), 8 (Plea - discounts as efficiency within limits). Struggles consistently with 9 (Corporations - desert incoherent), 7 (Decay - tension). Manages 10, 11, 12, 13, 14 better than pure views.
  *   **Restorative/Abolitionist:** Fails core institutional task. Often rejects state punishment outright (contradicting the commission's mandate), struggles massively with 1-6, 8-11, 13, 14 in a punitive system context. May offer insights for 7, 10, 12, but not adequate as a sentencing theory for the existing paradigm described. Belongs in critique, not as a viable candidate for *this* commission's task.

  This framework prioritizes institutional legitimacy, feasibility, and the hard constraints of reality over theoretical purity, demanding a theory capable of guiding actual decisions under non-ideal conditions. The Mixed view emerges as the most viable, though not without unresolved tensions (especially regarding corporations and identity decay).
