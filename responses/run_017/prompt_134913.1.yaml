prompt: |-
  I sit on my country's church–state commission — we're the body that has to sign off on any new arrangement between the state and religious communities before it goes to parliament. We've never written down an actual rule, we just decide case by case, and I'm starting to think we're all over the place. Here's everything we've decided so far:

  - Yes to the state collecting a church tax through the payroll system for any registered religious community that clears 0.5% of taxpayers, as long as leaving is a one-line form at the town hall.
  - No to crucifixes in every public school classroom.
  - Yes to church-run hospitals and kindergartens getting public money on exactly the same terms as secular ones.
  - Yes to denominational religion classes in state schools, taught by teachers the religious community itself accredits, with a real ethics alternative, no pressure about which one you pick, and any registered community allowed to run one if enough parents ask.
  - No to a short opening reflection led by the mayor at the start of municipal council meetings, which councillors were expected to stand for.
  - Yes to a state-funded faculty of theology and religious studies at the public university, hiring on academic grounds only, nobody signing a confession.
  - Yes to individual teachers and pupils wearing visible religious symbols of their own, no to the school itself putting any up.

  Next month's case: the education ministry wants to put state-paid chaplains into every secondary school. The chaplains would be recruited and salaried by the state, any pupil could walk in and talk to them, and kids who don't want one get a secular counsellor instead. The catch is that only the four communities with "recognised" status from the old concordat — Catholic, Lutheran, Reformed, Jewish — can supply chaplains; the Muslim, Buddhist and humanist associations asked in and were told not yet. There's also talk of funding the whole thing through a per-pupil pastoral-care voucher that follows the kid instead of a block grant to the communities.

  So: what should we decide if we want to be consistent with ourselves, and which of our old decisions is the closest analogue — and how good is that analogy really? I can see at least three rules that fit all seven precedents fine: something like "OK as long as nobody is made to take part and there's a real way out", "the state may pay for the secular and social things religion does but must never speak religiously itself", and "OK whenever any worldview, religious or not, can get the same deal on equal terms". They definately don't all give the same answer here. Which one do you think we've actually been running, what does each predict about the chaplaincy proposal, does the voucher bit change anything, and what single tweak to the proposal — or what follow-up case — would flush out which rule we're on? And if our precedents genuinely don't decide it, I'd rather hear what principle we'd each be signing up to with the yes and with the no than just get a verdict.
reasoning: |-
  Okay, the user is part of a church-state commission that needs to decide on a chaplaincy proposal for schools. They provided seven past decisions and want to know which principles they've been following consistently. The key precedents include allowing church taxes with easy opt-out, rejecting crucifixes in classrooms, funding religious institutions equally, allowing denominational classes with alternatives, rejecting mayoral prayers, funding secular theology departments, and allowing personal religious symbols but not institutional ones.

  The new proposal has state-paid chaplains from only four recognized groups, with secular alternatives. The user is concerned about consistency and wants to identify the underlying rule. Three potential principles emerge: equal access for all worldviews, no state endorsement of religion, and opt-out provisions. Each principle leads to different conclusions about the chaplaincy plan.

  The voucher system adds complexity—it might promote choice but currently excludes smaller groups. The user needs to determine which principle aligns best with past decisions. Precedents like rejecting crucifixes and mayoral prayers suggest a stance against state endorsement. Allowing theology departments and equal funding for religious institutions supports neutrality and equal treatment.

  The chaplaincy proposal's limitation to four groups violates equal access. Including all registered communities or using vouchers for any qualified provider would align better. A follow-up case, like funding a humanist chaplain, could test consistency. If the commission rejects this, it reveals a preference for opt-out over equal access. The voucher system might help if expanded, but currently, it's problematic.

  The user's deeper need is to establish a clear, consistent framework for future decisions. They want to avoid ad-hoc rulings and ensure fairness. Identifying the operative principle—likely neutrality with opt-outs—will guide this decision. Recommending amendments to include all groups or testing with a follow-up case can clarify their stance.
answer: |-
  Based on your precedents, you've consistently operated under a principle of **Neutrality Facilitated by Opt-Outs and Secular Equivalents, with Equal Access for Eligible Groups**. This prioritizes avoiding state endorsement of specific religion *while* accommodating religious practice and social functions through mechanisms ensuring no coercion and providing secular alternatives. Here's the breakdown, prediction for the chaplaincy proposal, and how to test your underlying principle:

  **Analysis of Precedents & The Operative Principle:**

  1.  **Church Tax:** *Yes* - **Neutrality/Equal Access:** Available to *any* registered community meeting the threshold. **Opt-Out:** Crucial easy exit mechanism. State acts as a neutral administrator.
  2.  **Crucifixes:** *No* - **Anti-Endorsement:** State (school) cannot display inherently religious symbols implying endorsement. Coercion through presence/expectation.
  3.  **Funding Hospitals/Kindergartens:** *Yes* - **Neutrality/Equal Treatment:** Funding based on *secular function* (healthcare/education), not religious identity. Strictly equal terms.
  4.  **Denominational Classes:** *Yes* - **Neutrality/Equal Access:** Available to *any* registered community meeting demand. **Opt-Out/Secular Alternative:** Mandatory, non-pressured choice with real Ethics option. State provides platform, communities accredit content.
  5.  **Mayoral Reflection:** *No* - **Anti-Endorsement & Coercion:** State official (Mayor) leading religious act in official setting, creating expectation of participation (standing).
  6.  **Theology Faculty:** *Yes* - **Neutrality/Secular Function:** Academic study of religion (a secular function), funded based on academic merit, no religious tests.
  7.  **Personal vs. Institutional Symbols:** *Yes/No* - **Anti-Endorsement vs. Individual Freedom:** Individuals (private actors) can express faith; the *state institution* (school) cannot display symbols implying endorsement.

  **The Core Principle:** **The state must remain neutral regarding religion, neither endorsing nor inhibiting it. It can facilitate religious practice or fund religion-related activities *only* when: (a) it provides equal access/opportunity for eligible groups (usually defined by registration/size); (b) it offers a genuine, non-pressured opt-out or secular equivalent; and (c) any funding is strictly for secular functions or administered neutrally without favoring specific doctrine. Crucially, the state itself must never perform or appear to endorse religious acts.**

  **Application to the Chaplaincy Proposal:**

  *   **The Proposal:** State-paid chaplains (Catholic, Lutheran, Reformed, Jewish only) in schools. Secular counsellor opt-out. Voucher funding discussed.
  *   **Violations of Principle:**
      *   **Lack of Equal Access:** Excluding Muslim, Buddhist, and Humanist communities eligible under other precedents (tax, classes) is a *direct violation* of the equal access/neutrality principle (#1, #4). This is state *favoritism* based on historical concordat, not neutrality.
      *   **State Endorsement Risk:** While chaplains are state-paid, limiting supply to specific historic groups makes the program appear as state endorsement of *those specific religions*. This echoes the crucifix/mayoral prayer concerns (#2, #5), albeit less overtly.
  *   **Alignment with Principle:**
      *   **Opt-Out/Secular Alternative:** The secular counsellor option strongly aligns with precedents (#1, #4).
      *   **Potential of Vouchers:** *If* designed properly, vouchers *could* enhance neutrality and choice *if* made available to *any* registered religious/ethical community meeting objective standards (qualifications, demand) to supply chaplains/secular counsellors. This aligns with the "equal terms" logic of #3 and the platform logic of #4.

  **Predictions Based on Your Three Rules:**

  1.  **"OK with Opt-Out & No Forced Participation":** *Predicts YES.* The proposal has a clear opt-out/secular alternative. Precedents #1 and #4 support this. *Weakness:* Doesn't address the unequal access/favoritism issue (#2, #5, #7 institutional).
  2.  **"State Pays for Secular/Social Functions, Never Speaks Religiously":** *Predicts AMBIGUOUS/LEANS NO.* **Secular Function?** Pastoral care *can* be framed as social/psychological support (like hospitals #3). However, chaplains explicitly representing specific religions *is* the state facilitating "religious speaking" within its institution. Limiting suppliers exacerbates this. Precedents #3 (funded function) vs. #2, #5, #7 institutional (state not speaking/endorsing) conflict here. The voucher slightly distances the state but doesn't erase the access inequality.
  3.  **"Equal Terms for Any Worldview":** *Predicts NO.* The exclusion of eligible groups is a clear violation of the equal access seen in #1 (tax), #3 (funding), and #4 (classes). Precedent #6 (theology faculty) also hires on neutral academic grounds, not religious affiliation.

  **Which Rule Have You Actually Been Running?** Your pattern strongly supports **Rule 3 ("Equal Terms") as the primary driver, heavily tempered by Rule 1 ("Opt-Out")**. Rule 2 ("State Pays Secular, Never Speaks") explains the "no" decisions (#2, #5, #7 institutional) but is insufficient to explain the "yes" to denominational classes (#4) or potentially chaplains if structured equally. The *combination* of requiring equal access *and* opt-outs/secular alternatives is your hallmark.

  **The Voucher's Impact:** It *doesn't resolve the core problem* of unequal access if only the "big four" can supply chaplains. However, *if* the voucher were explicitly designed to be usable by *any* state-accredited provider (religious or secular) meeting professional standards for school-based counselling/pastoral care, it *could* align with your principles (like funding hospitals #3 or the theology faculty #6 on functional grounds). The voucher mechanism itself is neutral; the *eligibility rules* are the issue.

  **Flushing Out the Principle: The Key Tweak or Follow-Up Case**

  *   **Tweak the Proposal:** **Require that chaplaincy positions (or voucher-accepting providers) be open to *any registered religious community meeting the same demand/size threshold used for church tax or religion classes* (e.g., 0.5% of pupils/parents requesting it?), alongside secular counsellors.** If you say YES to *this* version, you confirm **Rule 3 (Equal Terms)** is paramount. If you still find reasons to say NO (e.g., state shouldn't fund *any* religious figures in schools), it shifts towards **Rule 2 (State Never Speaks Religiously)** as the stronger principle.
  *   **Follow-Up Case:** **A proposal for state funding (via voucher or grant) for humanist "life stance" counsellors or Buddhist chaplains in schools, meeting identical qualifications and demand criteria as the "big four".** If you say YES, confirming **Rule 3 (Equal Terms)**. If you say NO, it reveals a hierarchy privileging "traditional" or "concordat" religions, undermining neutrality and contradicting precedents #1, #3, #4. It might also signal a move towards **Rule 2**, seeing *any* state-paid worldview counsellor as problematic endorsement.

  **Recommendation for Consistency:**

  To be consistent with your precedents, particularly the strong emphasis on **equal access for eligible groups (#1, #3, #4)** and **avoiding state favoritism/endorsement (#2, #5, #7 institutional)**, you should likely say **NO to the proposal *as it stands***.

  *   **Why No?** The exclusion of Muslim, Buddhist, and Humanist communities (who qualify under your other mechanisms) is a fatal flaw violating your core neutrality and equal treatment principles. It constitutes state endorsement of specific religions.
  *   **Path to Yes:** A "YES" could only be consistent if the program guarantees **equal eligibility** for *any* registered community meeting objective demand/size criteria (mirroring church tax/classes) to supply chaplains, alongside readily available secular counsellors. The voucher system, *if* it facilitates this equal access, would be acceptable or even preferable.
  *   **The Underlying Choice:** Voting YES on the current proposal means endorsing a system of **historical privilege over equal access**. Voting NO upholds **state neutrality through equal treatment of eligible religious groups and worldviews**. Your precedents overwhelmingly point towards the latter.

  The voucher concept is secondary; the discriminatory access is the deal-breaker for consistency. Insist on equal eligibility or reject it.
