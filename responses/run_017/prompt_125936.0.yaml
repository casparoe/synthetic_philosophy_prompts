prompt: |-
  Me and my roomate had a two-hour argument last night — he's a CS PhD student — and he kept shutting me down with the same line: anything that can be computed at all can be computed by a Turing machine. I said quantum computers do things classical ones can't, and he said that's just about speed, not about what's computable in principle. Then he said it isn't even a live conjecture: Turing machines, lambda calculus and general recursive functions all pick out the same class of functions, so the Church–Turing thesis has been proved.

  I think both of us were hand-waving. Can you lay out the different precise things that one sentence could be claiming — as a definition of what "computable" means, as an empirical claim about what a human being with pencil and paper could do, as a claim about any machine or physical process we could ever build, and whatever the strongest version is (something about the universe itself being a computation?) — and for each one say whether it's trivial, substantive but plausible, or just false, and whether it's even the kind of thing that could be proved. Then tell me which of those readings would actually get him his two conclusions: that quantum computers aren't a counterexample, and that the equivalence of all those formalisms settles the matter.

  Give it to me as a list of readings with verdicts that I can paste at him. Lead with your bottom line in the first sentence, then the reasoning — no preamble, and don't restate my question back to me.
reasoning: |-
  Okay, the user and their roommate had a heated argument about the Church-Turing thesis and quantum computing. The user wants a clear breakdown of different interpretations of what "computable" means and whether quantum computers challenge the thesis. 

  First, I need to unpack the roommate's core claim: "Anything computable can be computed by a Turing machine." The roommate insists this is settled fact, citing equivalent formalisms (Turing machines, lambda calculus, etc.) as proof. Meanwhile, the user brought up quantum computers as counterexamples, but the roommate dismissed it as merely about speed, not computability.

  Hmm... the user feels both sides were hand-waving, so they want precision. They specifically asked for:
  - Different precise interpretations of "computable" (definitional, empirical, physical, etc.)
  - Verdicts on each (trivial/plausible/false; provable or not)
  - Which interpretation supports the roommate's two conclusions:
    1. Quantum computers aren't counterexamples
    2. The equivalence of formalisms "settles" computability

  The user wants this as a concise list they can "paste" at their roommate—no preamble, bottom line first. They're clearly frustrated but seeking rigor. 

  Breaking it down:
  1. **Definitional reading (Turing-computable)**: Trivially true by definition. Quantum computers don't threaten this—they compute the same functions, just faster. The formalisms' equivalence does "settle" this reading, but only by fiat. 

  2. **Empirical reading (human-computable)**: Church-Turing thesis as a claim about human mathematicians. Plausible but unprovable. Quantum computers irrelevant here. Equivalence of formalisms is strong evidence but doesn't conclusively "settle" it. 

  3. **Physical reading (machine-buildable)**: Claim that any physical process can be simulated by a Turing machine. Highly plausible but unproven—quantum mechanics hasn't falsified it yet. Equivalence of formalisms is unrelated to this. 

  4. **Hyper-computation (stronger than Turing)**: Claims about physics allowing uncomputable processes (e.g., infinite precision). No evidence, likely false. Quantum computers don't achieve this. Equivalence of formalisms doesn't touch this. 

  5. **Cosmic reading (universe as computation)**: Untestable metaphysics. Irrelevant to the argument. 

  **Roommate's conclusions**: 
  - His "quantum isn't a counterexample" holds under readings 1-4 (since quantum computers only offer speedups, not new computable functions). 
  - His "equivalence settles it" only holds for reading 1 (definitional). For empirical/physical readings, equivalence is evidence but not proof. 

  **User's deeper need**: They want ammunition to show their roommate oversimplified. The roommate treated "computable" as monolithic, but context matters. The thesis isn't "proved" except tautologically. Quantum computers *are* revolutionary—just not for computability's boundaries. 

  Structure the response as a numbered list per their request. Lead with: "Your roommate is correct that quantum computers don't expand computability and that formalisms' equivalence matters, but oversimplifies the status of the Church-Turing thesis." Then unpack each reading with verdicts. Tone: clinical, no gloating.
answer: |-
  **Bottom line:** Your roommate is technically correct that quantum computers don't expand what is computable *in principle* (only speed), and the equivalence of formalisms is decisive for the *mathematical definition* of computability, but he oversimplifies the Church-Turing thesis (CTT) as a proven fact when its broader interpretations remain unproven conjectures.

  Here are the precise readings, their verdicts, and relevance to his claims:

  1.  **Mathematical Definition (Turing-computable functions):**  
      *   **Claim:** "Computable" means *precisely* the set of functions computable by a Turing machine (or equivalent formalism like lambda calculus).  
      *   **Verdict:** **Trivially true by definition.** This is how the term "computable" is defined in mathematical logic.  
      *   **Provable?** Yes. The equivalence of Turing machines, lambda calculus, general recursiveness, etc., *is* a proven mathematical theorem. This equivalence *defines* the class.  
      *   **Supports Roommate?**  
          *   *Quantum Counterexample?* **YES.** Quantum computers compute only functions within this defined class (Turing-computable/recursive). They offer speedups (e.g., polynomial vs. exponential time for some problems) but compute the same set of functions.  
          *   *Equivalence Settles It?* **YES.** This equivalence *is the proof* that these formalisms capture the same well-defined mathematical concept.

  2.  **Empirical Thesis (Human Computability):**  
      *   **Claim:** Any function that a human mathematician can compute using a deterministic, purely mechanical procedure (pencil-and-paper) can be computed by a Turing machine.  
      *   **Verdict:** **Substantive and plausible, but unproven.** It aligns with all known mathematics, but cannot be formally proven as it links an informal concept ("mechanical procedure") to a formal one.  
      *   **Provable?** No. It's a hypothesis about the physical world and human cognition. Evidence supports it, but no proof is possible.  
      *   **Supports Roommate?**  
          *   *Quantum Counterexample?* **YES.** Human mathematicians cannot perform computations fundamentally beyond the Turing model. Quantum computers don't enable this either.  
          *   *Equivalence Settles It?* **NO.** While the equivalence strengthens the case by showing multiple formalisms capture the same intuition, it doesn't *prove* they capture *all* human-mechanical computation.

  3.  **Physical Computability Thesis (Machines/Physics):**  
      *   **Claim:** Any function that can be computed by *any physically realizable device or process* (now or ever) can be computed by a Turing machine.  
      *   **Verdict:** **Substantive and plausible, but unproven.** It's consistent with known physics (including quantum mechanics - quantum computers compute recursive functions). However, it cannot be proven without a complete theory of physics. It's falsifiable in principle (e.g., discovering a physical system solving the Halting Problem).  
      *   **Provable?** No. It's a hypothesis about the laws of physics.  
      *   **Supports Roommate?**  
          *   *Quantum Counterexample?* **YES.** Quantum computers, as understood and built, compute only recursive functions. They provide no evidence against this thesis.  
          *   *Equivalence Settles It?* **NO.** The mathematical equivalence is irrelevant to whether physics might allow stronger computation. This thesis stands or falls on physics, not math.

  4.  **Hypercomputation Thesis (False Claim):**  
      *   **Claim:** Some physical systems or abstract machines (e.g., analog machines with infinite precision, "oracle" machines) can compute functions *not* computable by a Turing machine (non-recursive functions).  
      *   **Verdict:** **False or unsupported.** No credible model or physical evidence demonstrates computation beyond the Turing limit. Infinite precision is physically unrealizable. Quantum computers do *not* achieve hypercomputation.  
      *   **Provable?** False claims can be falsified (e.g., showing a proposed model fails or violates physics).  
      *   **Supports Roommate?**  
          *   *Quantum Counterexample?* **YES (by refuting it).** Quantum computers are *not* counterexamples *because* they don't achieve hypercomputation.  
          *   *Equivalence Settles It?* **PARTIALLY.** The equivalence shows these formalisms are the standard for *defining* computability, but doesn't directly disprove hypercomputation claims (physics or logic does that).

  5.  **Cosmic/Strong CTT (The Universe is Computational):**  
      *   **Claim:** The entire universe (or any physical system) is *itself* equivalent to a Turing machine or can be perfectly simulated by one.  
      *   **Verdict:** **Highly speculative metaphysics.** This goes far beyond computability of functions. It's untestable and not a necessary implication of the standard CTT.  
      *   **Provable?** No. It's not even a scientific claim in its strongest form.  
      *   **Supports Roommate?** **IRRELEVANT** to his specific claims about quantum computers and formalism equivalence.

  **Conclusion for Roommate's Claims:**
  *   **Quantum computers aren't a counterexample:** This holds under Readings 1, 2, 3, and 4. Quantum computers compute only Turing-computable functions (1), cannot give humans new computable powers (2), don't violate known physical computability (3), and are not hypercomputers (4).
  *   **Equivalence of formalisms settles computability:** This **only holds strictly for Reading 1 (Mathematical Definition)**. For Readings 2 and 3 (the substantive interpretations of CTT), the equivalence provides strong *evidence* but does not constitute *proof*. The equivalence defines the mathematical class; it doesn't prove that this class exhausts human-mechanical or physical computation, though it makes it very plausible.
