  Topic: the St. Petersburg paradox. Setup in case it helps: flip a coin until it lands heads, the payoff doubles for every tails you get first — $1, $2, $4, $8, and so on — and the expected value of that comes out infinite.

  I want a joke someone who's actually thought about the paradox would laugh at, where the punchline turns on the real machinery instead of being a generic nerd joke. Some material you can steal: the median payout is one dollar, so you loose your entry fee more than half the time; if the house caps the payoff at $1,048,576 the expected value collapses to about eleven dollars; and if you run the diminishing-marginal-utility move with log utility, the whole game is worth almost exactly two dollars. A bit where somebody smugly pays a huge entry fee because the value is infinite and then discovers one of those numbers is the shape I'm picturing. But it has to be a joke, not a lecture with a punch line stapled on.

  Two constraints: keep it intelligible to a friend who only sort of remembers the setup, and no real quotes or paper titles — I want it to stand on its own.

  After the joke, a few lines on where it cheats: which contested assumption the punchline quietly leans on (is a truncated game really the same game? is switching to utility a solution or a change of subject? is "fair price" even the right question?), and what someone who buys the rival resolution would say back — i.e. what would make the joke not land for them. If your best setup still doesn't work, say which beat fails and why.
