  **Key Design Notes:**
  - **Time/Ease**: 8 questions (under 4 mins), plain language, no abstract terms.
  - **Separators**: Q1 (reliance), Q2 (universalism), and Q3 (expressivism) do the heavy splitting.
  - **Collisions Handled**: 
    - Rigged queue (Q5) tests when conventions conflict with fairness (guest ethic vs. universalism).
    - Broke-tipping (Q6) exposes limits of reliance vs. pragmatism.
  - **Mirror Test**: Q8 forces asymmetry checks (e.g., if you demand locals follow your rules back home, you’re not a universalist).
  - **Double Standard**: Q3 (jaywalking with kid) and Q4 (line-cutting) trap "rules for thee but not for me" inconsistencies.
  - **Scoring**: Pattern-based (e.g., "Q1=A AND Q6=A" = P2). Defaults to prudential if no strong signals. Unseparable pairs flagged for facilitator follow-up.

  **How to Use**:
  1. Give quiz pre-arrival.
  2. Use scoring key to assign positions (e.g., "P3" = Guest Ethic).
  3. Group students by position for discussion: "Team P2, explain why you’d tip even when broke!"
  4. Use "awkward commitments" to spark debate (e.g., "P5, what if waiting for the light makes you late?").

  This surfaces their intuitions without philosophy lectures—letting them debate why cutting lines feels like "war" while jaywalking doesn’t.
