  Second, applying non-domination to three cases: 
  - Benign vs. brutal households: Both handmaids experience domination because their treatment depends entirely on the arbitrary will of others (Commanders/Aunts). The lack of recourse makes even "kind" masters dominators. 
  - Ceremony/Salvagings: These rituals intensify domination by forcing complicity. Handmaids become instruments of the system that controls them, hollowing out agency from within. 
  - Serena Joy/Aunts: Their power is precarious and delegated, so while they dominate others, they remain dominated by the regime's structures (e.g., Serena's gardening shears confiscated). Non-domination captures this well—power without security isn't freedom. 

  The distributed dominator point is crucial: Neo-republicanism can handle this because non-domination requires non-arbitrariness, not a single oppressor. Gilead's power is arbitrary by design—no checks, no recourse for Offred. 

  Third, testing the "licensed agency" idea: The Commander's secret gifts (Scrabble, Jezebel's) *seem* like negative liberty (no interference) and non-domination (if power isn't exercised arbitrarily). But Offred's enjoyment is entirely at the Commander's whim—he could revoke it instantly. This aligns with Pettit's concept of arbitrary power: The Commander can choose capriciously, without consulting Offred's interests. The novel's contribution is the visceral portrayal of how such dependence poisons agency—even "favors" feel like humiliation. 

