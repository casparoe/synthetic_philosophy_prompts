  So after observing exactly 0.9, Bob is sane with probability 1. Therefore, Alice will update to believe that Bob is definitely sane. Then she will use only the likelihood from the sane Bob. But she already knows that if Bob is sane, then his announcement is 0.9, and then her update would be to 0.9 (as in the no-confabulation case). So she will update to 0.9.

  Then at the next step, both would be at 0.9 and stay there.

  But wait: this happened because Bob announced the same number twice. What if Bob is a confabulator? Then his second announcement is independent of the first. But in this scenario, Bob is sane, so he announces 0.9 twice.

  Therefore, after the second announcement, Alice becomes certain that Bob is sane and updates to 0.9. So they agree.

  But that contradicts our initial guess.

  However, note that in the first round, Alice updated to p1 < 0.9. Then in the second round, after hearing 0.9 again, she updates to 0.9.

  So they do agree, but it takes two rounds.

  But what if we have more rounds? After the second round, Bob hears Alice's second announcement. Alice, in the second announcement, will announce 0.9 (because she updated to 0.9). Bob, who is sane, already at 0.9, and he knows that if Alice is sane she will eventually update to 0.9, so he stays.

  But in the second announcement, Alice announces 0.9. But Bob already announced 0.9 twice. Now Bob hears Alice's second announcement. What is it? After the first round, Alice announced p1. In the second round, after updating, she announces 0.9. So Bob hears a1 (first round) = p1, and then a2 (second round) = 0.9.

  When Bob hears a2=0.9, he will update his belief about Alice's type. Specifically, if Alice is sane, then in the second round she would announce 0.9 (because she updated based on the two announcements of Bob). But if she is a confabulator, she announces a random number. So if Bob hears 0.9, then by the same reasoning, he becomes certain that Alice is sane. But that doesn't change his posterior.

  So after two rounds, they agree at 0.9.

  But our initial guess was that they would disagree forever. Why did it resolve?

  The key is that the confabulator draws independently at each round. Therefore, the probability that a confabulator would announce the same number twice in a row is zero (in continuous space, the probability of two independent uniforms being exactly 0.9 twice is zero). Therefore, when Alice sees Bob announce 0.9 twice, she becomes certain that he is sane. Similarly, when Bob sees Alice announce the number that a sane Alice would, he becomes certain that she is sane.

  So the disagreement is temporary.

  But what if the confabulator draws once and sticks to it? Then the scenario changes.

  Assume that the confabulator draws a number at the beginning and announces the same number every time.

  Then, in the first round, Bob (sane) announces 0.9.
  Alice (sane) updates to p1.

  In the second round, Bob (sane) announces 0.9 again.
  Alice now updates: but if Bob is a confabulator, he would also announce the same number every time. So the fact that he repeated the number does not make it more likely that he is sane. So Alice's update after the second announcement:

    She has a prior (from the first update) that Bob is sane with probability, say, q1 = P(Bob sane | first announcement). After the first announcement, she had:

        q1 = P(Bob sane | b1=0.9) 
            = [ P(b1=0.9 | Bob sane) * (1-ε) ] / [ P(b1=0.9 | Bob sane)*(1-ε) + P(b1=0.9 | Bob confabulator)*ε ]
            = [ k1 * (1-ε) ] / [ k1*(1-ε) + 1*ε ]

    But note: in the first update, we had a different expression because we were also updating the state. But now, for the type of Bob, we are focused on that.

    Actually, in the first update, Alice updated both the state and Bob's type. But now, after the second announcement, she updates again on Bob's type.

    The likelihood for the second announcement b2=0.9 given Bob's type:

        If Bob is sane: then b2=0.9 with probability 1 (he always says 0.9)
        If Bob is confabulator: then b2=0.9 with probability 1 (because he sticks to his first draw)

    So the likelihood is 1 in both cases. Therefore, the second announcement provides no new information about Bob's type.

    Therefore, Alice's belief about Bob's type remains at q1.

    Then, for the state, she has to update again. But now, given that she has two identical announcements from Bob, are they independent? If Bob is sane, then the two announcements are the same and they are both based on the same signal, so they are not independent. If Bob is confabulator, then the two announcements are the same and uninformative.

    So the likelihood for the two announcements b1=0.9 and b2=0.9 given the state and Bob's type:

        If Bob is sane: then the likelihood is just the same as one announcement: g(0.9|θ)   [because it's the same signal]
        If Bob is confabulator: then the likelihood is 1 (since the announcement is fixed and uninformative)

    So the total likelihood for the two announcements given θ is:
        P(b1=0.9, b2=0.9 | θ) = [ g(0.9|θ) * (1-ε) ] + [ 1 * ε ]

    This is the same as the likelihood for one announcement! Because the second announcement is redundant.

    Therefore, Alice's posterior after two identical announcements is the same as after one.

    So she stays at p1.

    Similarly, in subsequent rounds, nothing changes.

    Therefore, with stickiness, we have a persistent disagreement.

    Bob, on the other hand, in the first round hears Alice announce p1. In the second round, Alice (sane) will announce p1 again (because she didn't change). If Alice is a confabulator, she would also stick to her first number. So when Bob hears the same number twice, it doesn’t provide new information. So if after the first announcement, Bob had a certain posterior and a certain belief about Alice's type, it doesn't change.

    And since Alice is at p1 and Bob at 0.9, they disagree.

  Diagnosis:

  The key assumption in Aumann's theorem that is violated in this scenario is that the posteriors become common knowledge. In the standard theorem, when the posteriors are common knowledge, it means that each agent knows the other's posterior, and knows that the other knows, and so on. But in our scenario, even though the announcements are public, the agents are unsure whether the other is truthful. Therefore, the announcement does not reveal the other's true posterior.

  In particular, when Alice hears Bob announce 0.9, she doesn't know if that is his true posterior or noise. Therefore, the true posterior of Bob is not known to Alice. Hence, the posteriors are not common knowledge.

  The gap is precisely between the announcement being public and the true posterior being common knowledge. In the standard setting with no confabulation, the announcement reveals the true posterior. Here, it does not.

  With sticky confabulation, the agents never learn each other's type, so they never know if the announcement is truthful. Therefore, they never get to common knowledge of the true posteriors.

  With independent confabulation per round, the agents can eventually learn the type of the other by observing the consistency of the announcements. In the example, after two identical announcements, Alice becomes certain that Bob is sane, so she then knows his true posterior is 0.9, and she updates accordingly.

  Follow-ups:

  1. Does the gap shrink continuously to zero as ε→0?

     In the sticky confabulation scenario, Alice's posterior after the first announcement is:

          p1 = [9k(1-ε)+ε] / [10k(1-ε)+2ε]

     Without confabulation (ε=0), p1=0.9.

     As ε→0, p1 → 0.9. So continuously.

     In the independent confabulation scenario, they end up agreeing after two rounds, and the agreement is at 0.9, regardless of ε (as long as ε>0, but the agreement is exact). However, the time to agreement might depend on ε? In the independent scenario, they agreed in two rounds. But if ε is small, the probability of a confabulator is small, but they still agree by the second round.

  2. What if Alice's signal is mildly informative?

     Suppose Alice's signal is informative. Then her first announcement would be some value based on her signal. Then Bob, upon hearing that, would update. He would consider that Alice might be a confabulator. If her announcement is likely under her signal and the state, he might update, but if it is unlikely, he might discount it.

     The updating would be more complex, but the same principle applies: without being sure of the other's type, they might not fully update. However, if they announce multiple times and if the confabulation is independent, they might still learn each other's type and eventually agree.

     In the sticky confabulation case, they might not agree.

     Additionally, Bob's failure to move might be evidence that he is a confabulator? For example, if Alice announces a number that should cause a sane Bob to update, but he doesn't, then Alice might increase her belief that Bob is a confabulator. But in our scenario, Bob is at 0.9 and if Alice's signal is not very informative, it might not move him much even if he is sane.

     This would require a more elaborate model.

  In summary, the load-bearing assumption in Aumann's theorem is that the posteriors are common knowledge, which requires that the agents know that the other is reporting their true posterior and that they understand the information structure perfectly. When there is uncertainty about the other's truthfulness, common knowledge of the true posteriors is not achieved, and disagreement may persist.
answer: |-
  Your intuition about the scenario is largely correct, and it reveals the core mechanism behind Aumann's agreement theorem. Let's break it down step by step, focusing on the "why" and diagnosing the failure.

  ### Key Diagnosis: Common Knowledge of Posteriors vs. Public Announcements
  Aumann's theorem requires that the **posteriors are common knowledge**, not just that announcements are public. In your tweaked scenario:
  - **Public announcements ≠ common knowledge of posteriors**: Alice and Bob hear each other's numbers, but they don't know if those numbers reflect *rational posteriors* (from Bayesian updating) or noise (confabulation). This uncertainty breaks the agreement theorem.
  - **The load-bearing assumption**: The theorem relies on agents knowing that the other agent's announcement is their *true posterior belief* (computed via Bayesian updating from the common prior and private signal). When confabulators are possible, this assumption is violated.

  ---

  ### Your Scenario: Why Disagreement Persists (with Sticky Confabulation)
  Assume confabulators draw a number once and **stick to it** for all announcements. In your concrete case:
  - **Bob (sane)**: Signal gives true posterior = 0.9. He announces 0.9 repeatedly.
  - **Alice (sane)**: Uninformative signal, prior = 0.5. She announces her posterior after each update.

  #### After first announcement:
  - Alice hears Bob's "0.9". She updates her belief about the state (θ) and Bob's type (sane or confabulator):
    - **Likelihood of Bob being sane**:  
      - If Bob is sane (prob = 1 - ε), his announcement "0.9" has high density under θ=1 (say, density `k1`) and low density under θ=0 (density `k0`).  
      - If Bob is confabulator (prob = ε), his announcement is uniform (density = 1).  
    - **Alice's posterior for θ=1** (simplified):  
      ```
      P(θ=1 | Bob's announcement) ∝ [ (1-ε) * k1 + ε ] * prior
      ```
      - Without confabulation (ε=0), she would update to 0.9.  
      - With ε>0, she updates to **p₁ < 0.9** (since ε > 0 dilutes the signal).  
      - Example: If `k1/k0 = 9` (because Bob's 0.9 implies a likelihood ratio of 9:1), then:  
        ```
        p₁ = [9(1-ε) + ε] / [9(1-ε) + (1-ε) + 2ε] < 0.9.
        ```

  #### After subsequent announcements:
  - Bob announces "0.9" again. Alice updates again, but:  
    - If Bob is **sane**, he *must* repeat 0.9 (same signal).  
    - If Bob is **confabulator**, he *must* repeat 0.9 (sticky draw).  
  - **No new information**: The repetition doesn't change Alice's belief about Bob's type or θ. Her posterior stays at **p₁ < 0.9**.  
  - Bob (sane) sees Alice's announcement (p₁ < 0.9), but:  
    - He knows his signal is strong (0.9), and Alice's number could be from noise or a weak signal.  
    - He doesn't update (his posterior remains 0.9).  

  **Result**: Persistent disagreement. Alice stays at **p₁ < 0.9**, Bob at **0.9**.  
  - **Why?** Alice can't rule out that Bob is a confabulator. Bob ignores Alice's number because it might be noise.

  ---

  ### The Crucial Gap in Aumann's Theorem
  - **"Common knowledge of posteriors"** means:  
    (1) Alice knows Bob's true posterior (not just his announcement).  
    (2) Bob knows Alice's true posterior.  
    (3) Alice knows that Bob knows her true posterior, and so on ad infinitum.  
  - In your tweak, **only (1) and (2) fail**:  
    - Alice sees Bob's announcement but doesn't know if it's his *true posterior*.  
    - This breaks the infinite recursion of common knowledge.  
  - **The theorem works by averaging over the same information partition**: Agents implicitly agree on how their signals correlate with the state. With confabulators, they can't trust the correlation between announcements and signals.

  ---

  ### Follow-Up Answers
  #### 1. Does the gap shrink as ε → 0?
  - **Yes, continuously**. Alice's posterior `p₁ → 0.9` as ε → 0.  
    - In the formula:  
      ```
      p₁ = [9(1-ε) + ε] / [9(1-ε) + (1-ε) + 2ε] → 9/10 = 0.9 as ε→0.
      ```
  - **No discontinuity at ε=0**: At ε=0, agreement holds (Aumann's theorem). For ε>0, disagreement is stable but shrinks smoothly with ε.

  #### 2. What if Alice's signal is mildly informative?
  - **Bob's failure to move *is* evidence of confabulation**, but it doesn't fix disagreement.  
    - Suppose Alice's signal gives her true posterior = 0.6 (mildly informative).  
    - Bob (posterior=0.9) hears Alice's announcement (e.g., 0.6). If he doesn't update much, Alice infers:  
      - "If Bob were sane, he would have updated more. His stubbornness suggests he might be a confabulator."  
    - This *lowers* Alice's belief that Bob is sane, so she trusts his announcement *less*.  
    - **Result**: Alice's posterior moves *toward* Bob (e.g., to 0.7), but not all the way to 0.9. Bob still ignores her.  
  - **Key insight**: With mild informativeness, the gap narrows but persists. Bob's rigidity amplifies Alice's suspicion of confabulation.

  ---

  ### Independent Confabulation: A Twist
  If confabulators **redraw independently each round**, agreement *can* occur:  
  - After Bob announces "0.9" twice, Alice realizes:  
    - Probability a confabulator draws 0.9 twice ≈ 0 (since P(draw 0.9) = 0 in continuous space).  
  - She concludes Bob is sane (prob ≈ 1), updates to 0.9, and agreement is reached.  
  - **Why?** Repeated announcements allow agents to *learn each other's type*, restoring common knowledge.  

  This highlights that **common knowledge can emerge dynamically** if noise is "revealed" over time. But with sticky confabulation, noise persists, breaking common knowledge indefinitely.

  ---

  ### Summary
  - **Why disagreement persists**: The core failure is that announcements don't guarantee common knowledge of *true posteriors* due to confabulation uncertainty.  
  - **Load-bearing assumption**: Agents must know that announcements reflect *rational Bayesian updating* (not noise).  
  - **Effect of ε**: Disagreement gap shrinks continuously as ε→0.  
  - **Mildly informative signals**: Bob's rigidity feeds Alice's suspicion of confabulation, sustaining partial disagreement.  

  This tweak elegantly exposes that Aumann's theorem isn't about public announcements—it's about the **deeper alignment of beliefs under mutually known rationality**. When rationality is in doubt, so is agreement.
