prompt: |-
  I am the researcher-writer for a six-part documentary series on Jesus and first-century Galilee, and over the next three months my team must assign on-screen wording to roughly forty individual sayings and episodes. For each item we choose between presenting it as something Jesus said or did, presenting it as what the earliest followers came to believe about him, or flagging it on screen as contested. There are no footnotes, narration has to sound settled without claiming false precision, and a three-person scholarly advisory panel — one fairly conservative, one skeptical, one who works mainly on the social world of Roman Palestine — must sign off on the whole list. That gives us about fifteen minutes of argument per item and rules out any verdict only one of them can live with.

  Please build me a decision procedure we can actually run in that time. Start from the familiar criteria — multiple attestation, dissimilarity from both surrounding Judaism and the early church, embarrassment, coherence with what is already established, Semitic-language phenomena, and plausibility in a Galilean or Judean setting — but do not let them stand as a checklist, since each one only grades a tradition relative to a background assumption about how the tradition grew. I need at least four additional moves built in: an audit of how the sources could be genealogically related, so that we count independent lineages rather than independent texts; a test in which any verdict is rerun against at least one rival model of transmission and downgraded if it flips; a rule against counting the same evidence twice under two criteria; and a warning flag for the selection effect built into the dissimilarity criterion, which by construction certifies only a figure unlike both the Judaism of his time and the movement that followed him. Say what counts as a sufficient answer to each step, where the procedure stops with a no, where it hands the decision to a person because the question is editorial rather than factual, and where judgment genuinely cannot be eliminated.

  Then run it on three items: the baptism by John, the saying on divorce as it appears with different exceptions in different sources, and the empty-tomb tradition, which is the one I expect you to take away from me and which my narration currently depends on. Show the steps, and close with an honest statement of what the procedure cannot do — in particular whether any set of criteria can establish who Jesus was as opposed to what was being attributed to him within twenty years of his death.
reasoning: |-
  Okay, the user is a researcher-writer for a documentary on Jesus and first-century Galilee. They need a decision procedure to assign on-screen wording for about forty sayings or episodes. The options are: Jesus said/did it, earliest followers believed it, or contested. They have a scholarly panel with diverse views and only 15 minutes per item. The procedure must go beyond standard criteria like multiple attestation or dissimilarity, and include four additional moves: audit of source genealogy, testing against rival transmission models, no double-counting evidence, and a warning for dissimilarity's selection effect.

  First, I need to understand the core challenge. The documentary needs to present information as settled without false precision. The panel includes a conservative scholar, a skeptic, and a social-world expert. So the procedure must balance their perspectives. The user mentioned avoiding checklists because each criterion depends on assumptions about tradition growth. That's key—I shouldn't treat criteria as standalone boxes to tick.

  The user specified four additional moves. For source genealogy, it's not just about multiple texts but their independence. For example, Mark and Q might be independent, but Matthew and Luke copying Mark isn't. Testing against rival models means seeing if a conclusion holds under different assumptions. No double-counting prevents inflating evidence. And the dissimilarity warning is crucial because it isolates Jesus but risks making him ahistorical by distancing him from Judaism and early Christianity.

  Now, building the procedure. It needs clear steps with exit points. Maybe a flowchart-style approach: start with foundational checks, then apply criteria, apply safeguards, and finally editorial judgment. Each step should have a sufficient answer to move forward or stop. For example, if an item has no first-century attestation, it's automatically "contested." 

  For the genealogy audit, I need to map sources to traditions. Define independent streams: e.g., Mark, Q, M, L, Paul, Josephus. But be wary of hypothetical sources. The test against rival models—pick models like skeptical (e.g., all tradition evolved) or maximalist. If flipping verdicts, downgrade to "contested."

  The dissimilarity warning: if an item passes dissimilarity but might be artificially unique, add a caution. But since on-screen flags are limited, perhaps just note it internally.

  Then, applying to the three examples. Baptism: multiple attestation (Mark, Q, John), embarrassment (why baptize a superior?), plausible context. Genealogy: Mark and Q likely independent. Rival models: even skeptics accept baptism. So verdict: Jesus did it.

  Divorce saying: variations in exceptions (Mark vs. Matthew). Multiple attestation but not verbatim. Coherence? But exceptions show adaptation. Dissimilarity: strict divorce stance fits early Jewish debates but also church concerns. Testing rival models: could reflect later church debates. Verdict: core saying but exceptions contested, so "followers came to believe" with on-screen note.

  Empty tomb: multiple attestation? Mark and Paul? Paul doesn't mention tomb, just resurrection. Embarrassment: women witnesses. But John might depend on Mark. Genealogy: Mark, then others. Rival models: skeptics argue empty tomb evolved later. Plausibility: tombs known, but guard story in Matthew problematic. Verdict: "earliest followers believed" or "contested" depending on panel.

  Finally, limitations. Criteria can't prove who Jesus was, only what was attributed early. They assess tradition development, not historical certainty. The procedure handles attribution, not essence. And it depends on scholarly consensus, which varies.

  User's deeper need: a reliable, efficient method that satisfies diverse scholars, maintains documentary credibility, and educates without oversimplifying. They might worry about bias in criteria or panel deadlock. The procedure must be transparent and defensible.
answer: |-
  Here's a decision procedure designed for efficiency, transparency, and scholarly defensibility within your constraints. It integrates the standard criteria critically with your required safeguards and editorial judgment points.

  **The Decision Procedure: "The Tradition Audit"**

  1.  **Foundation Check: First-Century Attestation?**
      *   *Question:* Is the saying/episode attested in *any* source plausibly dated within 40-70 years of Jesus' death (e.g., Paul, Q, Mark, pre-70 traditions in M/L, relevant Josephus)? *Not* just canonical texts, but plausibly early layers.
      *   *Sufficient "Yes":* Clear presence in Paul, Mark, or a strong case for Q inclusion. Move to Step 2.
      *   *Sufficient "No":* Only attested later (e.g., only in John, Thomas, or late apocrypha). **Stop: Assign "Contested".** (e.g., Jesus writing in the sand).
      *   *Judgment Call:* Debated dating (e.g., specific elements in Matthew/Luke vs. Mark, Thomas logia). Hand to Editorial Judgment (Step 9).

  2.  **Genealogical Audit: Independent Lineage Mapping**
      *   *Question:* Map the attestations onto likely independent *streams* of tradition (not just documents). Standard model: Mark, Q, M (special Matthean), L (special Lukan), Pauline Corpus, Johannine *Tradition* (distinct from the Gospel), Josephus. Crucially: Does attestation come from *at least two distinct streams*?
      *   *Sufficient "Yes":* Clear attestation in two separate streams (e.g., Mark *and* Q, Paul *and* Mark, Mark *and* distinct Johannine tradition). *Note the specific streams.* Move to Step 3.
      *   *Sufficient "No":* Only attested in one stream (e.g., only Mark, only Q, only M/L). **Stop: Assign "Earliest Followers Came to Believe" or "Contested"** (Proceed to Step 5/Editorial Judgment for nuance).
      *   *Judgment Call:* Debated source relationships (e.g., Is John independent of Synoptics? Is a particular Pauline reference pre-Pauline tradition?). Hand to Editorial Judgment (Step 9).

  3.  **Core Criteria Application (with Safeguards)**
      *   Apply the following criteria *sequentially*, using *only the evidence from distinct streams identified in Step 2*. **Crucially: Evidence used for one criterion CANNOT be reused for another.**
      *   **a) Dissimilarity (with Warnings):**
          *   *Question:* Is the saying/episode significantly dissimilar to characteristic emphases of *both* 1st-century Palestinian Judaism *and* the post-Easter early church?
          *   *Warning Flag:* Actively state: "Passing this criterion isolates Jesus but risks creating an ahistorical figure disconnected from his context and movement. It selects for uniqueness, not necessarily authenticity."
          *   *Sufficient "Yes":* Strong dissimilarity to both backgrounds (e.g., radical enemy love command). *Note it.* Move to 3b.
          *   *Sufficient "No":* Fits comfortably in either background. *Note it.* Move to 3b.
          *   *Judgment Call:* Degree of dissimilarity debatable. *Note it.* Move to 3b.
      *   **b) Embarrassment:**
          *   *Question:* Is the saying/episode likely to be embarrassing or difficult for the early church to invent (e.g., implies ignorance, failure, association with disreputable people, contradicts later doctrine)?
          *   *Sufficient "Yes":* Strongly plausible as embarrassing (e.g., baptism by John, crucifixion itself, disciples' failures). *Note it.* Move to 3c.
          *   *Sufficient "No":* Easily serves early church interests (e.g., resurrection appearances to leaders, Great Commission). *Note it.* Move to 3c.
          *   *Judgment Call:* Embarrassment debatable (e.g., Jesus' family thinking him mad). *Note it.* Move to 3c.
      *   **c) Plausibility (Context):**
          *   *Question:* Is the saying/episode plausible within the known historical, social, economic, and religious context of 1st-century Galilee/Judea? (Rely heavily on your social-world expert's baseline).
          *   *Sufficient "Yes":* Fits demonstrably within context (e.g., agrarian parables, synagogue teaching, conflict with Pharisees, pilgrimage to Jerusalem). *Note it.* Move to 3d.
          *   *Sufficient "No":* Anachronistic or implausible in context (e.g., later high Christology on lips of historical Jesus, specific details contradicting known realities). **Stop: Assign "Earliest Followers Came to Believe" or "Contested"** (Proceed to Step 5).
          *   *Judgment Call:* Plausibility hinges on interpretation of context. *Note it.* Move to 3d.
      *   **d) Coherence:**
          *   *Question:* Does the saying/episode cohere with the emerging core picture established by items passing Steps 1-3a-c? (Use this *last* to avoid circularity).
          *   *Sufficient "Yes":* Fits well with the developing profile. *Note it.* Move to Step 4.
          *   *Sufficient "No":* Contradicts the established core without strong independent attestation/embarrassment. *Note it.* Move to Step 4.
          *   *Judgment Call:* Coherence debatable. *Note it.* Move to Step 4.

  4.  **Rival Model Stress Test**
      *   *Question:* Take the preliminary verdict suggested by Steps 1-3 (leaning towards "Said/Did" or "Believed"). Now run it against *one* significantly rival model of tradition transmission/growth (e.g., a skeptical model assuming heavy early invention/legend; a model prioritizing oral performance variability; a model emphasizing specific community agendas like the Matthean church). Does the verdict *flip* under this rival model?
      *   *Sufficient "No Flip":* Verdict holds reasonably well even under the rival model. Move to Step 5.
      *   *Sufficient "Flip":* Verdict becomes significantly less likely or reverses under the rival model. **Downgrade:** If leaning "Said/Did", reassign to "Earliest Followers Came to Believe" or "Contested". If leaning "Believed", reassign to "Contested". Proceed to Step 5.
      *   *Judgment Call:* Degree of flip or plausibility of rival model is debatable. Proceed to Step 5, flagging the vulnerability.

  5.  **Preliminary Verdict & Nuance**
      *   Based on Steps 1-4:
          *   **Strong "Said/Did":** Passed Foundation, Genealogy, at least 2 Core Criteria strongly (including plausibility), and survived Stress Test.
          *   **"Earliest Followers Came to Believe":** Failed Genealogy (single stream), failed Plausibility strongly, or downgraded by Stress Test from "Said/Did", but still has early attestation and fits early church context/development.
          *   **"Contested":** Failed Foundation, failed Plausibility strongly, or downgraded by Stress Test to contested, or significant unresolved tension in Core Criteria/Judgment Calls.
      *   *Question:* Does the nature of the evidence (especially variations, context) require on-screen nuance *even if assigned*? (e.g., "Jesus taught on divorce" vs. specifying exception clauses).
      *   *Sufficient "Nuance Needed":* Significant variations exist between sources, or core vs. framing is clear. Hand to Editorial Judgment (Step 9).
      *   *Sufficient "No Nuance":* Stable core presentation. Move to Step 6.

  6.  **Panel Threshold Check**
      *   *Question:* Could at least two of the three advisors (conservative, skeptical, social-world) plausibly accept this verdict based on mainstream scholarship within their perspectives? (e.g., A skeptic might accept "Believed" for something a conservative sees as "Said/Did").
      *   *Sufficient "Yes":* Verdict is within the bounds of reasonable, mainstream scholarly debate. **Propose Verdict.**
      *   *Sufficient "No":* Verdict is likely only acceptable to one advisor's perspective. **Reassign to "Contested".**
      *   *Judgment Call:* Debate on what constitutes "mainstream" or "acceptable" for each advisor. Hand to Editorial Judgment (Step 9).

  7.  **Editorial Judgment (Step 9) - Consolidated Point:**
      *   Address questions deferred here: Foundation dating doubt, Genealogy uncertainty, Dissimilarity/Embarrassment/Coherence judgment calls, need for Nuance, Panel Threshold ambiguity.
      *   *Factors:* Documentary tone (leaning towards historical grounding vs. theological impact), overall narrative flow, visual evidence available, weight of scholarly consensus *if* clear, panel's known red lines.
      *   *Output:* A final verdict choice ("Said/Did", "Believed", "Contested") + any specific wording nuance for on-screen text.

  **Application to Your Examples:**

  1.  **Baptism by John (Mark 1:9-11, Q/Luke 3:21-22? [implied], John 1:29-34, cf. Acts 10:37-38)**
      *   **Step 1 (Foundation):** Yes (Mark, strong Q/Lukan tradition, John).
      *   **Step 2 (Genealogy):** Yes (Mark, Johannine Tradition - distinct from Synoptics, implied in Q/Lukan). *Streams: Mark, John, (probable Q/Lukan).*
      *   **Step 3a (Dissimilarity w/Warning):** **No.** Baptism fits John's movement. Church affirms it as divine endorsement. *Warning flagged.*
      *   **Step 3b (Embarrassment):** **Yes.** Baptism of the superior by the inferior is inherently problematic (see later Gospels struggling: Matt 3:14-15).
      *   **Step 3c (Plausibility):** **Yes.** John's movement was a known historical phenomenon; participation by others is plausible.
      *   **Step 3d (Coherence):** **Yes.** Coheres with Jesus' connection to John and his own message about the kingdom.
      *   **Step 4 (Stress Test - Skeptical Model):** Verdict (Said/Did) holds. Even under skeptical models, the embarrassment & multiple attestation make invention unlikely. The *theological interpretation* (voice, dove) is another matter.
      *   **Step 5 (Preliminary):** Strong "Said/Did" (Baptism Event). Nuance: The divine voice/dove belongs to "Earliest Followers Came to Believe".
      *   **Step 6 (Panel Threshold):** Yes. Conservative: Obvious Said/Did. Skeptic: Accepts baptism happened due to embarrassment. Social-World: Fits context perfectly. Nuance on theophany acceptable to all.
      *   **Verdict:** **Jesus was baptized by John.** [On-screen nuance likely for theophany: "His followers believed God affirmed him..."].

  2.  **Saying on Divorce (Mark 10:2-12, Matt 5:31-32, Matt 19:3-9, Luke 16:18, 1 Cor 7:10-11)**
      *   **Step 1 (Foundation):** Yes (Mark, Q/Luke 16:18, Paul, M/Matt 5).
      *   **Step 2 (Genealogy):** Yes (Mark, Q [Luke 16:18], Pauline Corpus, M [Matt 5]). *Streams: Mark, Q, Paul, M.*
      *   **Step 3a (Dissimilarity w/Warning):** **Mixed/Judgment.** Strict prohibition dissimilar to Hillel's easy divorce, but coherence with Mal 2:16 & early church concerns. *Warning flagged.*
      *   **Step 3b (Embarrassment):** **No.** Serves early church's strict marital ethics well.
      *   **Step 3c (Plausibility):** **Yes.** Debates on divorce grounds (Shammai vs. Hillel) were current.
      *   **Step 3d (Coherence):** **Yes.** Coheres with radical kingdom ethics elsewhere (e.g., lust=adultery).
      *   **Step 4 (Stress Test - Community Agenda Model):** Core prohibition ("No divorce") holds. BUT, the *exception clauses* (Matt 5:32, 19:9 - *porneia*) flip easily under this model (Matthean community adapting for Gentile context/illegal marriages). Stress test *weakens* the exceptions.
      *   **Step 5 (Preliminary):** Core saying ("Divorce prohibited") leans "Said/Did" (strong attestation/coherence/context). *Exceptions* lean "Earliest Followers Came to Believe" (fail stress test, likely adaptation). Nuance needed.
      *   **Step 6 (Panel Threshold):** Core prohibition: Likely yes (Conservative: Said/Did; Skeptic: Might see as early community *but* Paul attributes it to Lord; Social-World: Plausible strict stance). Exceptions: More contested, but assigning adaptation ("came to believe") is broadly acceptable.
      *   **Verdict:** **Jesus taught that divorce violated God's purpose.** [On-screen nuance required: "Early followers adapted this teaching in some communities, allowing exceptions."]

  3.  **Empty-Tomb Tradition (Mark 16:1-8, Matt 28:1-8, Luke 24:1-12, John 20:1-13, cf. 1 Cor 15:3-4 - "buried")**
      *   **Step 1 (Foundation):** Yes (Mark, likely core of Matt/Luke/John narratives). Paul mentions burial, not specifically an *empty* tomb.
      *   **Step 2 (Genealogy):** **Weak/Judgment.** Mark is the likely source for the Synoptic empty tomb narratives. John *might* have an independent tradition, but significant overlap exists. Paul attests burial, not empty tomb. *Streams: Mark (primary), ?John (possibly dependent), Paul (burial only).* **Insufficient independent attestation for *empty tomb discovery*.** Leans No.
      *   **Step 3a (Dissimilarity w/Warning):** **Mixed/Judgment.** Empty tombs weren't standard Jewish resurrection expectation (bodily to heaven/New Age), but vindication narratives exist. Church clearly proclaims resurrection. *Warning flagged.*
      *   **Step 3b (Embarrassment):** **Yes (for discovery by women).** Women's testimony was legally/socially dubious in that context (cf. Luke 24:11).
      *   **Step 3c (Plausibility):** **Mixed/Judgment.** Tombs were known locations; dishonoring bodies was taboo. BUT, guard story (Matt) is implausible legend; Mark's silent ending is strange if historical. Overall plausible *setting*, details problematic.
      *   **Step 3d (Coherence):** **Yes.** Coheres with the *fact* of early resurrection belief and the need to explain the missing body.
      *   **Step 4 (Stress Test - Legendary Development/Skeptical Model):** Verdict flips dramatically. Under a skeptical model: Resurrection belief arose from visions/experiences; the empty tomb story developed later (post-Paul, Mark being the first) to explain the lack of a body/corpse veneration site and counter potential polemic ("stolen body"), using the motif of women discovering it (initially dismissed, then vindicated). Embarrassment of women fits *later* apologetic need. **Downgrades to "Earliest Followers Came to Believe" or "Contested".**
      *   **Step 5 (Preliminary):** "Earliest Followers Came to Believe" (fails strong independent genealogy, vulnerability to stress test, plausibility issues with details). Core belief is resurrection, empty tomb is an explanatory narrative.
      *   **Step 6 (Panel Threshold):** **Unlikely.** Conservative would likely reject this, insisting on "Said/Did" (i.e., event happened). Skeptic would accept "Believed" or "Contested". Social-World might see it as plausible belief/explanation but not provable event. **Fails 2/3 consensus.** Reassign to **"Contested"** per Step 6 rule.
      *   **Verdict:** **Contested.** [Narration must shift: Focus on the *core belief* in resurrection attested very early (Paul) and the *narrative* of the empty tomb as the foundational story explaining that belief for the early followers. "The gospels recount that his followers found the tomb empty, a claim central to their belief in his resurrection but debated by historians."].

  **Honest Limitations of the Procedure (and Historical Jesus Criteria Generally):**

  1.  **Establishing "Who He Was" vs. "What Was Attributed":** The procedure rigorously assesses *traditions about* Jesus. It identifies sayings/events likely originating with him ("Said/Did"), those shaped by early belief ("Came to Believe"), and contested ones. **It cannot directly access the historical individual, Jesus of Nazareth.** It reconstructs the *impact* he had and the *memories* he generated within a generation. The "who" remains an interpretive picture built from these attributed fragments and contextual plausibility.
  2.  **Dependence on Models:** Every step relies on models – the Two-Source hypothesis for Synoptics, models of oral transmission, models of community development. Changing the model changes the results (as seen in the Stress Test). Absolute certainty is unattainable.
  3.  **The Role of Interpretation:** Criteria like Dissimilarity, Coherence, and especially Plausibility involve significant interpretation of both the tradition and the historical context. Scholars disagree profoundly here.
  4.  **The Gap of Silence:** We have no direct evidence from Jesus or neutral observers. We only have evidence from committed followers (or opponents like Josephus), passing through layers of tradition. The procedure filters this evidence but cannot fill the inherent gaps.
  5.  **Theological Primacy:** For the earliest followers, the significance of Jesus was fundamentally theological (Lord, Christ, Son of God). The procedure can assess traditions *about* the human figure, but the "who he was" for believers transcends what these historical methods can establish. The procedure reveals the historical roots of the beliefs, not their ultimate theological validity.
  6.  **Panel Dynamics:** The procedure forces consensus but cannot eliminate scholarly bias. It ensures no fringe view dominates but might obscure where genuine, deep scholarly division exists on mainstream grounds (like the empty tomb).

  This procedure provides a structured, transparent, and defensible way to make tough editorial calls under pressure, forcing engagement with the key historical complexities and scholarly debates while respecting your panel and audience. Good luck!
