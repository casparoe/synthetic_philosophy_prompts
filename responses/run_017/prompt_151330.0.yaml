  ### RFC: Contextual Semantics for Moral Judgment Constructs  
  **Document ID:** LANG-007  
  **Authors:** Policy Engine Language Guild  
  **Status:** Draft  

  ---

  #### **Summary**  
  This RFC proposes a resolution for bug LANG-471, wherein the `wrong!(action)` construct fails to record moral stances when embedded in non-assertoric contexts (e.g., conditionals, negations, or indirect reports). We recommend **Option B**: desugaring embedded occurrences into queries against a global commitment store. This preserves the core stance-recording behavior while restoring compositional semantics.  

  ---

  #### **Motivation (Bug Report)**  
  **Bug ID:** LANG-471  
  **Description:**  
  The `wrong!(action)` construct records a negative stance toward `action` when executed as a top-level statement (e.g., `wrong!(stealing)`). However, when embedded:  
  ```python
  if wrong!(stealing) { ... }  # No stance recorded; no boolean value produced  
  ```  
  the construct:  
  1. Fails to record a stance.  
  2. Returns no value for logical operations, breaking typechecking.  
  3. Allows invalid inferences (e.g., `wrong!(stealing) → punish(stealing)` chains correctly despite no stance being recorded).  
  This violates the expectation that identical tokens (`wrong!(stealing)`) contribute uniformly to program semantics regardless of context, undermining logical coherence.  

  ---

  #### **Guide-Level Explanation**  
  After the fix, `wrong!(action)` behaves contextually:  
  - **Top-level (asserted):** Records stance `¬action` in a global, append-only `commitment_store`.  
  - **Embedded (e.g., conditionals):** Desugars to `commitment_store.contains(¬action)`, returning a boolean.  

  **Example:**  
  ```python
  wrong!(stealing)  # ⇒ Appends ¬stealing to `commitment_store`  
  if wrong!(stealing) { ... }  # ⇒ if commitment_store.contains(¬stealing) { ... }  
  ```  
  This ensures:  
  1. Stance recording occurs only when the construct is *executed and asserted*.  
  2. Embedded uses become queries about existing commitments, enabling compositionality.  
  3. Existing inference rules (e.g., `∀x wrong!(x) → punish(x)`) remain valid.  

  ---

  #### **Reference-Level Explanation**  
  **Semantic Redefinition:**  
  - Introduce a global, immutable set `commitment_store: Set<Proposition>`.  
  - Redefine `wrong!(action)` as:  
    ```rust  
    fn wrong!(action: Action) -> () | bool {  
      if is_asserted_context() {  
        commitment_store.insert(¬action); // Returns ()  
      } else {  
        commitment_store.contains(¬action) // Returns bool  
      }  
    }  
    ```  
  **Context Detection:**  
  - `is_asserted_context()` returns `true` iff the construct is:  
    - A top-level statement.  
    - Executed unconditionally (e.g., not within branches, loops, or unevaluated closures).  
  **Type System:**  
  - In asserted contexts, `wrong!` returns `Unit`.  
  - In embedded contexts, it returns `bool`.  
  - The typechecker infers the expected return type from syntactic position.  

  **Inference Rule Preservation:**  
  Rules like `[wrong!(x)] → [impermissible(x)]` are reinterpreted:  
  - The premise `wrong!(x)` in a conditional becomes a boolean check.  
  - The rule’s validity now depends on the consistency of `commitment_store`.  

  ---

  #### **Known Limitations and Unresolved Questions**  
  1. **Indirect Reports (LANG-471.1):**  
     ```python  
     assert alice.says(wrong!(stealing))  # Does not record Alice’s stance.  
     ```  
     Current fix: Forces desugaring to `alice.says(commitment_store.contains(¬stealing))`, misrepresenting Alice’s view as a query about *our* commitments. **Unresolved.**  
  2. **Epistemic Modals/Taste Predicates:**  
     Identical issues observed with `must!(x)` (epistemic) and `tasty!(x)` (preference). Future work must extend this fix to all "stance-taking" constructs.  
  3. **Store Monotonicity:**  
     `commitment_store` is append-only. Retractions (e.g., `not_wrong!(stealing)`) are unsupported.  
  4. **Hypothetical Reasoning:**  
     Queries in branching paths (e.g., `if wrong!(x) { ... } else { ... }`) cannot model hypothetical stances.  

  ---

  #### **Alternatives Considered**  
  **Option A: Boolean Truth Conditions**  
  - Redefine `wrong!(action)` as pure `bool` (e.g., `action.is_wrong()`).  
  - **Pros:** Solves embedding; enables standard logic.  
  - **Cons:** Abandons stance-recording semantics. Moral judgments become descriptive facts, violating the design goal of separating normative force from truth.  

  **Option B: Commitment Store Queries (Recommended)**  
  - As proposed.  
  - **Pros:** Retains core stance-recording behavior; restores compositionality.  
  - **Cons:**  
    - Embedded occurrences become *descriptive* (about the store), not *expressive*.  
    - Quietly assumes `commitment_store` is an objective ground for truth (e.g., `wrong!(x)` in a conditional is true iff we’ve asserted it).  
    - Obscures whether the speaker *endorses* the stance in embedded contexts.  

  **Option C: Dual Semantics**  
  - Split into two constructs: `record_wrong!(action)` (statement) and `is_wrong(action)` (expression).  
  - **Pros:** Explicit separation; no global state.  
  - **Cons:**  
    - Breaks token uniformity: `wrong!(x)` ≠ `is_wrong(x)`.  
    - Invalidates existing code (e.g., `if is_wrong(stealing)` cannot trigger `record_wrong!`).  
    - Fails to explain why `record_wrong!(x)` and `is_wrong(x)` are inferentially linked.  

  ---

  #### **Appendix: Compiler Diagnostics**  
  | Error Code          | Context                          | Message                                                                 |  
  |---------------------|----------------------------------|-------------------------------------------------------------------------|  
  | `ERR_EMBEDDED_STANCE` | `if wrong!(stealing) { ... }`    | `Moral stance not recorded in embedded context. Use a top-level assertion or refactor as a query.` |  
  | `ERR_UNRESOLVED_TYPE` | `let x = wrong!(stealing);`      | `Type error: 'wrong!' returns Unit in asserted contexts, bool elsewhere.` |  
  | `ERR_INDIRECT_REPORT` | `report(wrong!(stealing))`       | `Indirect moral stance reporting unsupported. Use explicit query syntax.` |  
  | `ERR_STORE_MUTATION`  | `commitment_store.delete(...)`   | `Illegal mutation: commitment_store is append-only.`                    |  

  ---  
  ### Afterword: Reflections on the Compiler Analogy  

  The RFC frames the Frege-Geach problem through computational semantics: embedded moral utterances must retain content without performing their typical function. The analogy leans on a *syntactic* view of the problem—how tokens behave under composition—which sidesteps deeper questions about moral truth.  

  **Liberties taken:**  
  1. The "global commitment store" concretizes abstract expressivist attitudes, risking reification. Real expressivists (e.g., Blackburn) treat attitudes as mental states, not a shared database.  
  2. The fix implies that embedded occurrences *describe* commitments, whereas expressivists aim to preserve non-descriptive meaning in embeddings (e.g., via higher-order attitudes).  

  **Expressivist rebuttal:**  
  A defender would argue the RFC conflates *semantics* with *pragmatics*. Expressivism doesn’t reduce moral judgments to database operations; it offers a logic of attitudes. For example, `if wrong!(x) { ... }` expresses a *conditional attitude* ("if I disapproved of *x*, I would ..."), not a query. The RFC’s "solution" smuggles in descriptivism via the store.  

  **Falsifying the analogy:**  
  If moral inferences *require* truth conditions (e.g., if "stealing is wrong" must be truth-apt to explain why modus ponens applies in `if stealing is wrong, then ...`), the analogy collapses. Conversely, if expressivists successfully formalize compositional attitude logic (e.g., via probability or dynamic semantics), the RFC’s "bug" becomes a feature. The analogy falters if moral language is shown to *not* behave like a programming construct—e.g., if embedded uses *do* perform a speech act (e.g., presupposition).  

  **Final note:** The RFC’s Option B mirrors quasi-realism’s tightrope walk: it *mimics* truth-aptness without conceding realism. Whether this is elegant engineering or a category error depends on if you see morality as compiler design or metaphysics.
