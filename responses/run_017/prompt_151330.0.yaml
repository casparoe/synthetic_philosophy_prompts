  We are writing an internal engineering design document (RFC) for a language feature that has run into a problem with embedded moral judgments. The problem is analogous to the Frege-Geach problem in metaethics. We must present it in a deadpan engineering style, with the following sections: Summary, Motivation (as a bug report), Guide-level explanation, Reference-level explanation, Known limitations and unresolved questions, Alternatives considered, and an Appendix with invented compiler diagnostics.

  The humor comes from the engineering perspective on a philosophical problem. We must be accurate to the philosophical issue: the embedded occurrence must retain the same content as the unembedded one for inferences to remain valid. We consider three alternatives:
  (a) Make the construct an ordinary boolean expression (cognitivist move).
  (b) Desugar embedded occurrences to talk about a global store of commitments (expressivist/quasi-realist move).
  (c) Accept two distinct modes (non-cognitivist giving up on uniform semantics).

  We must also note the problem with indirect reports and other similar expressions (epistemic modals, taste predicates).

  After the RFC, we add an afterword (150-200 words) in the assistant's voice, discussing where the analogy takes liberties, which formulation it leans on, what an expressivist would say is misrepresented, and what would falsify the analogy.

  Let's structure the RFC:

  **RFC: Addressing Embedding of Moral Judgment Constructs**

  **Summary:**
  We propose to resolve a class of bugs related to the `wrong!` construct when embedded in non-assertoric contexts (conditionals, negations, etc.) by redefining its semantics. The current behavior fails to record a stance in such contexts, leading to invalid inferences and undefined contributions to the program's meaning. Three solutions are considered, with a recommendation for Option B: desugaring embedded occurrences to queries against a global commitment store.

  **Motivation (Bug Report):**
  Bug ID: LANG-471
  Description: The `wrong!` construct, when used in embedded contexts (e.g., inside conditionals, under negation, in disjunctions, in questions, in unevaluated function bodies, or in reports of others' beliefs), does not record a stance as intended. This breaks the expected behavior that the same content should be available for inference regardless of embedding. For example:
  ```
  if wrong!(stealing) {
    ... // No stance recorded for stealing being wrong, and the condition doesn't evaluate to a boolean
  }
  ```
  Additionally, the construct currently returns no value, so it cannot be used in expressions. This leads to type errors and unexpected inference behavior.

  **Guide-level Explanation:**
  After the fix, the `wrong!` construct will be usable in both top-level (assertoric) and embedded contexts. In top-level contexts, it continues to record a stance (e.g., adding an entry to the global commitment store). In embedded contexts, it will be interpreted as a query about the current state of the commitment store. For example, `if wrong!(stealing) { ... }` will check whether the commitment store currently contains an entry against stealing. This allows the same content ("stealing is wrong") to be used in inferences without requiring the programmer to take a stance in non-assertoric contexts.

  **Reference-level Explanation:**
  We introduce a global, immutable, append-only data structure called the `commitment_store`. This store records all moral stances taken via `wrong!` in top-level, assertoric contexts. The semantics of `wrong!(x)` are redefined as follows:
  - In a top-level, assertoric context (i.e., executed as a statement and not embedded): appends the commitment `wrong(x)` to the store and returns no value (or unit, if needed).
  - In an embedded context (conditionals, negations, etc.): evaluates to a boolean indicating whether `wrong(x)` is currently in the commitment store. This boolean can be used in expressions.

  The desugaring is done at compile-time. The context is determined by whether the construct is in a position that requires a value (expression context) or is a standalone statement (statement context). 

  Example transformations:
  - Standalone: `wrong!(stealing)` → `commitment_store.append(Wrong(stealing))`
  - Embedded: `if wrong!(stealing) { ... }` → `if commitment_store.contains(Wrong(stealing)) { ... }`

  **Known Limitations and Unresolved Questions:**
  1. **Indirect Reports**: The current design does not handle cases where the programmer wants to report someone else's moral view without endorsing it (e.g., `alice_believes(wrong!(stealing))`). We propose to defer this to a future extension by introducing a function that queries the store without adding to it, or by having a separate syntax for reported commitments.

  2. **Other Non-Assertoric Contexts**: The same issue arises for other constructs that are designed to perform actions (e.g., `must!(...)` for epistemic modals, `tasty!(...)` for taste predicates). We anticipate applying a similar desugaring approach to these.

  3. **Store Scope**: The commitment store is global and append-only. This may lead to monotonicity issues (once committed, cannot retract) and does not account for hypothetical reasoning (e.g., in conditionals, we might want to consider a hypothetical commitment). We leave this for future work.

  4. **Inference Rules**: The current inference rules that chain through embedded `wrong!` constructs will now operate on the boolean values, which might not capture the full normative force. We must reevaluate the inference rules to ensure they reflect the intended meaning.

  **Alternatives Considered:**

  **Option A: Make `wrong!` a Boolean Expression**
  - We redefine `wrong!` to always return a boolean, representing the truth value of the moral claim. In top-level contexts, it would both record the stance and return true. This aligns with cognitivism: moral judgments are truth-apt.
  - Advantages: Solves the embedding problem uniformly. The construct can be used in any context that expects a boolean. Inference rules work as expected.
  - Disadvantages: Abandons the original design in which moral judgments are non-descriptive. The act of recording a stance becomes a side effect of asserting a truth, which may not reflect the intended use.

  **Option B: Desugar Based on Context (Recommended)**
  - As described above, we use the commitment store and desugar based on context.
  - Advantages: Preserves the original idea that moral judgments express attitudes. Embedded occurrences are interpreted as queries about the existing attitudes, allowing compositionality.
  - Disadvantages: The commitment store is a global state, which may be problematic for modularity and concurrency. Also, the meaning of embedded occurrences shifts from expressing an attitude to describing the state of the store. This raises the question: is the embedded occurrence still a moral judgment? It becomes a descriptive claim about the store, which might not be what the programmer intended.

  **Option C: Dual Semantics**
  - We define two distinct constructs: one for expressing a stance (e.g., `wrong!`) and one for referring to the content (e.g., `is_wrong(stealing)` which returns a boolean). The programmer must choose the appropriate one for the context.
  - Advantages: Clear separation of concerns. No global store needed.
  - Disadvantages: Breaks the uniformity of the language. Programmers must remember to use different constructs, and refactoring becomes error-prone. Also, the original goal of having a single construct for moral judgments is abandoned.

  **Appendix: Compiler Diagnostics**

  We introduce the following error codes:

  - **ERR_MORAL_EMBEDDED_UNRECORDED (LANG-471E)**: Fired when `wrong!` is used in an embedded context prior to this RFC. Message: "Error: `wrong!` construct used in embedded context (conditionals, negations, etc.) does not record a stance and returns no value. This is disallowed. Consider using the context-sensitive semantics (post-RFC) or refactoring."

  - **ERR_MORAL_STATEMENT_EXPRESSION (LANG-471S)**: After the RFC, if `wrong!` is used as a statement in a context that requires an expression, it will be an error because the statement form returns no value. Message: "Error: `wrong!` in statement position returns no value and cannot be used as an expression. If you intend to query the commitment store, use it in an expression context; if you intend to record a stance, ensure it is a top-level statement."

  - **ERR_MORAL_INDIRECT_UNSUPPORTED (LANG-471I)**: Temporary error for indirect reports. Message: "Error: Indirect reporting of moral stances (e.g., inside belief contexts) is not yet supported. Use a direct query to the commitment store via `commitment_store.contains(Wrong(stealing))`."

  **Afterword (in assistant's voice):**

  The compiler analogy takes liberties by equating the global commitment store with a concrete data structure, whereas in expressivist theories, the "store" is an abstract representation of the speaker's attitudes. The problem formulation leans on the syntactic embedding challenge (Frege-Geach) as the central issue, but expressivists like Blackburn and Gibbard have developed sophisticated accounts (e.g., quasi-realism) to handle compositionality without positing a descriptive semantics.

  An expressivist defender might argue that the RFC misrepresents expressivism by reducing it to a global store, which risks making moral judgments merely descriptive of the store. Expressivists aim to preserve the non-descriptive nature even in embedded contexts by providing a semantics of attitude expression that is compositional. For instance, in a conditional, "If stealing is wrong, then..." expresses a complex attitude: disapproval of stealing in the context of other attitudes.

  The analogy might be abandoned if we consider that in natural language, moral sentences in embedded contexts do not necessarily refer to a speaker's current commitments. For example, in a hypothetical context, we can reason about moral views without being committed to them. A better analogy might involve a more nuanced model of context and attitude projection. However, the core difficulty of explaining the validity of inferences without truth conditions remains.
