prompt: |-
  I'm the tech lead on a six-person team building the scheduling brain for a regional home-care agency — every morning it decides which of about 400 clients get a visit that day from whoever actually showed up, and seperately it reads free-text messages from clients and decides whether to escalate something to a family member or a nurse. My own grandmother is on the client list in one of the pilot counties, which is sort of how I ended up volunteering to write the part of the design doc we call "the values section." We hit one of these decisions about once a sprint, there are ~30 of them stacked up in the backlog for the pilot, and the reviewers are me, two engineers, a PM, a nurse manager, and the agency's counsel — nobody with philosophy training, and counsel has to be able to defend whatever we write in one page. Two hard constraints: we can only get a human on roughly 3% of decisions (the agency won't pay for more, and past that point the product doesn't save them money), and every decision needs a short logged reason string, which I've noticed is often not the real reason the model did what it did.

  What I need is a procedure, not a list of principles. Something my team can run in an hour on a backlog item, and that outputs one of three things: a rule we can actually put in a spec, a "defer to a named human" instruction, or a "don't ship this decision at all." The part I keep getting stuck on — and the reason the usual AI-ethics advice hasn't helped — is that most of our hard cases aren't "what's the right thing to do" but "who gets to say what the right thing is." The client's stated wishes, the family's wishes, what the nurse manager thinks is clinically indicated, what the agency is willing to be liable for, and what the county contract requires can come apart, and I've started calling the points where they come apart value handoffs. So I want the procedure to force us to name, for each decision, whose values are authoritative, what happens when two of them conflict, and what the system does when the spec runs out — abstain, escalate, or pick a default and log it. The same build also ships in two counties with visibly different norms about family notification, so the procedure has to tell us what's fixed in the spec, what's a config knob, and who is allowed to turn the knob.

  Give me the ordered questions, what counts as an adequate answer to each, where the procedure just says no, and where it has to stop and hand the question to a person — and be explicit that those last two are different moves. Then run it on three backlog items: (1) 40 clients, 25 slots, and the choice between prioritizing whoever is worst off today, whoever deteriorates fastest without a visit, and whoever's missed visit is most likely to turn into a hospital bill; (2) a client messages that she's stopped eating and says "please dont tell my daughter," and the system has to decide whether to notify anyone; (3) a case where the honest answer is that we shouldn't ship the decision at all, or that our 3% deferral budget can't cover it — tell me which, because I'd rather hear it now than at the pilot review. I also want the part where you're honest about what the procedure can't do: the cases where any rule we write is just one engineer's intuition with a reason string bolted on, and how I should document those so we're not pretending otherwise. One thing I remember from a philosophy elective is that people distinguish building ethical rules in top-down from getting them out of data, and a friend who works on alignment keeps telling me I should make the system track moral uncertainty — if either of those actually changes what goes in my spec, say how, and if they're unusable at my granularity, say that too. Answer in American English please, and no reading lists or citations — I need something I can paste straight into a design doc.
reasoning: |-
  We are designing a procedure for making decisions about the "values section" of our scheduling system. The procedure must:
  - Output one of: a rule for the spec, a "defer to named human" instruction, or "don't ship this decision".
  - Be runnable in about an hour per backlog item by a team without philosophy training.
  - Explicitly address: whose values are authoritative, how to handle conflicts, and what to do when the spec runs out (abstain, escalate, or pick a default).
  - Distinguish between fixed rules, config knobs, and who can turn the knobs (since two counties have different norms).
  - Account for the 3% human deferral budget and the need for a logged reason string (even if not the real reason the model would use).

  The procedure must also clearly differentiate between:
  - Saying "no" (don't ship the decision at all) and
  - Handing the question to a human (for the 3% deferral).

  Additionally, we must be honest about cases where we are just codifying an engineer's intuition and document that appropriately.

  We are also to consider:
  - Top-down vs. data-driven ethics (if it changes the spec, say how; if not, say why unusable).
  - Moral uncertainty (if it changes the spec, say how; if not, say why unusable).

  We will then run the procedure on three backlog items.

  ---

  **Procedure: Value Handoff Decision Protocol**

  This is a step-by-step procedure for the team to resolve a backlog item in the values section. Timebox: 60 minutes per item.

  **Ordered Questions:**

  1. **What is the decision point?**  
     - *Adequate answer*: A clear, one-sentence description of the specific choice the system must make.  
     - *If unclear*: Stop and hand to the PM to refine the backlog item.  
     - *Output so far*: None; this is just framing.

  2. **Who are the stakeholders?**  
     - *Adequate answer*: List the parties with a claim on the decision (e.g., client, family, nurse, agency, county contract).  
     - *Must include at least*: client and one other (family, clinical, agency, contract).  
     - *Output so far*: None.

  3. **Whose values are authoritative?**  
     - *Adequate answer*: One primary stakeholder named as the authority for this decision. If there are multiple, state the order of precedence (e.g., "client wishes first, then county contract, then clinical judgment").  
     - *Conflict rule*: If two stakeholders' values conflict and cannot be ordered, then either:  
       a) The decision cannot be automated (go to Step 7 for "don't ship" or "defer"), or  
       b) We define a tie-breaker (e.g., "escalate to human" or "use clinical default").  
     - *Output so far*: The authority hierarchy.

  4. **Is the authoritative value source clear and specifiable?**  
     - *Adequate answer*: Yes, if we can write a rule (or set of rules) that a developer can implement without ambiguity, using available data. No, if it's subjective, requires context we don't have, or isn't logged.  
     - *If no*: Go to Step 7.  
     - *Output so far*: If yes, we move to Step 5. If no, we jump to Step 7.

  5. **What happens when the spec runs out?** (i.e., the rule doesn't cover the input)  
     - *Adequate answer*: Choose one:  
       a) *Abstain*: Do nothing, log the gap.  
       b) *Escalate*: Use the 3% deferral to a named human (e.g., "escalate to nurse manager").  
       c) *Default*: Pick a fallback action (e.g., "always notify family") and log it.  
     - *Constraints*: If choosing escalate, check the 3% budget: if this decision point would cause more than 3% of cases to escalate, we cannot use escalate (go to Step 7).  
     - *Output so far*: The exception-handling method.

  6. **Is this county-specific?**  
     - *Adequate answer*:  
       - If the rule is the same for all counties: mark as "fixed in spec".  
       - If it differs by county: mark as "config knob" and name who can set it (e.g., "county administrator" or "nurse manager").  
     - *Output*: A rule ready for the spec (with authority, rule logic, exception handling, and config status). Proceed to output.

  7. **Defer or Don't Ship?**  
     - This step is reached if:  
       - We can't name an authority (Step 3).  
       - The value source isn't specifiable (Step 4).  
       - Escalation would exceed 3% (Step 5).  
     - *Decide*:  
       a) *Defer to named human*: If we can identify a human role (e.g., "nurse on duty") and the expected volume of such decisions is low enough to fit within the 3% budget.  
       b) *Don't ship*: If (a) is not possible (e.g., too high volume, no clear human, or risk too high).  
     - *Output*: Either a "defer to [role]" instruction or "don't ship this decision".

  **Documentation of Uncertainty**:  
  - At any step, if the team realizes the answer is based on intuition without clear stakeholder alignment, document:  
    "Rationale: This rule reflects team judgment in the absence of clear stakeholder guidance. The reason string logged by the system will be: [draft reason string]."  
  - This must be approved by the agency counsel for defensibility.

  **What the Procedure Can't Do**:  
  - It cannot resolve fundamental ethical disagreements among stakeholders. In such cases, we defer or don't ship.  
  - It cannot create data we don't have. If a required input (e.g., "client's true wishes") isn't available, we must adjust the rule or don't ship.  
  - The logged reason string might not reflect the model's true reasoning (e.g., in ML models). We accept this as a constraint but document the gap.

  **Top-down vs. Data-driven Ethics**:  
  - We are using a top-down approach (starting from stakeholder authority) because data-driven (e.g., learning from past decisions) would require historic data we don't have and might encode biases. If we had high-quality data, we could use it to inform rules, but the authority would still be set top-down.  
  - *In the spec*: Rules are top-down; data can inform thresholds (e.g., "deterioration score > X"), but the threshold must be set by the authority.

  **Moral Uncertainty**:  
  - The concept (tracking when the system is unsure about ethics) is valuable but currently unusable at our scale because:  
    a) We lack a way to quantify ethical confidence.  
    b) Our 3% budget is for human review, which could be triggered by low confidence, but we don't have a model for that.  
  - *Workaround*: Use proxy measures (e.g., "if rule parameters are near a threshold, escalate") but only if stakeholders agree. We are not implementing moral uncertainty tracking in the pilot.

  ---

  **Running the Procedure on Backlog Items**

  **Item 1: Scheduling Priority (40 clients, 25 slots)**  
  *Decision*: How to prioritize clients when slots are limited? Options: worst off today, deteriorates fastest, or most likely to cause a hospital bill.

  1. **Decision point**: "Choose which 25 of 40 clients get a visit today based on priority criteria."  
  2. **Stakeholders**: Client (wants care), agency (wants to minimize costs/hospital bills), county contract (may specify equity), clinical team (wants best outcomes).  
  3. **Authoritative values**:  
     - Primary: County contract (it defines what the agency must prioritize).  
     - Secondary: Clinical judgment (if contract is silent).  
     - *Conflict*: Contract and clinical may differ. Order: contract > clinical.  
  4. **Specifiable?**  
     - Check contract: If it specifies a rule (e.g., "prioritize by clinical risk"), then yes. If not, we need a default.  
     - *Assume contract says*: "Minimize hospitalization risk." So we pick "most likely to turn into hospital bill".  
     - Rule: "Prioritize clients with highest hospitalization risk score."  
  5. **When spec runs out** (e.g., risk score not available):  
     - Fallback: Use deterioration speed. If that's missing, use "worst off today". Log the gap.  
     - *Escalation budget*: Not needed here; we have fallbacks.  
  6. **County-specific?**  
     - Fixed? Check: One county may prioritize hospitalization, another equity (e.g., worst off).  
     - *Verdict*: Config knob. Who sets? County administrator.  
     - *Rule*: "Use priority method X, set by county config."  
  7. *Not needed*.  
  **Output**: Rule for spec: "Prioritize visits by configured method (options: hospitalization risk, deterioration speed, current severity). Default: hospitalization risk. On missing data, use next method in order. Set by county admin."  
  **Documentation**: If the county hasn't configured, we use hospitalization risk (counsel must approve this default).

  **Item 2: Notification of Family**  
  *Decision*: Client messages "I've stopped eating, please don't tell my daughter." Should the system notify anyone?

  1. **Decision point**: "Decide whether to escalate the message to the client's daughter (or other contact) despite client's request."  
  2. **Stakeholders**: Client (autonomy, privacy), family (concern for welfare), clinical (duty to care), agency (liability).  
  3. **Authoritative values**:  
     - Primary: County contract (may mandate reporting for health risks).  
     - Secondary: Client wishes, unless overridden by clinical risk.  
     - *Conflict*: High clinical risk (e.g., stopped eating) overrides client wishes.  
     - *Order*: County contract > clinical judgment > client wishes.  
  4. **Specifiable?**  
     - We need a rule: e.g., "If message indicates high clinical risk, override client's 'don't tell' and notify."  
     - But "high clinical risk" is fuzzy: "stopped eating" is high risk?  
     - *Answer*: We can define a risk threshold (e.g., using keywords or ML model). But if model says "high risk" and client says "don't tell", we notify.  
  5. **When spec runs out** (e.g., risk model unclear):  
     - Escalate to human (nurse manager).  
     - *Check 3% budget*: If many such messages, this could exceed 3%.  
       - *Estimate*: Assume 1% of messages are high-risk with "don't tell". We can escalate those.  
  6. **County-specific?**  
     - Yes: One county may require notification for eating issues, another may not.  
     - Config knob: "Always notify for high-risk messages" vs. "Respect 'don't tell' unless life-threatening". Set by county health board.  
  7. *Not needed if we set a rule*.  
  **Output**: Rule: "If message is classified as high clinical risk and client requests no notification, override and notify family unless county config says otherwise. If risk classification is uncertain, escalate to nurse manager."  
  **Documentation**: The "high clinical risk" model may have false positives/negatives. We log the model's reason, not the override logic.

  **Item 3: A Case We Shouldn't Ship**  
  We need an example where the procedure says "don't ship". Let's create one:  
  *Decision*: "When a client misses three visits in a row, the system should automatically discharge them from the program to free up slots."

  1. **Decision point**: "Automatically discharge a client after three consecutive missed visits?"  
  2. **Stakeholders**: Client (may have valid reasons, e.g., hospitalization), agency (wants efficient resource use), county contract (may require due process).  
  3. **Authoritative values**:  
     - Primary: County contract (must define discharge policy).  
     - *Assume contract says*: "Discharge only after human review."  
     - *Conflict*: If contract doesn't specify, can we automate?  
  4. **Specifiable?**  
     - If contract requires human review, then we cannot automate.  
     - If contract allows automation, but "valid reasons" are unmeasurable (e.g., client was in hospital), we can't reliably detect when not to discharge.  
  5. **When spec runs out**: Not applicable because we can't specify.  
  6. **County-specific?** Not relevant.  
  7. **Defer or Don't Ship?**  
     - If contract requires human review: Defer to a human (e.g., "discharge coordinator").  
       - *But*: Volume? If 10% of clients hit this, it would exceed 3% budget. So: **don't ship** the decision.  
     - If contract allows automation, but we can't measure valid exceptions: **don't ship** (too risky).  
  **Output**: Don't ship this decision. Instead, flag for human review (outside the 3% budget? Not covered). We must handle this separately or reduce the decision's scope.

  **Final Note for Design Doc**:  
  - The procedure forces explicit choices about authority and fallbacks.  
  - It accepts that some decisions are too ambiguous or high-volume for automation.  
  - Counsel must review all "don't ship" and "intuition" cases.  
  - The 3% escalation budget is a hard constraint; we must estimate volumes early.
answer: |-
  Below is a **Value Handoff Decision Procedure** for your team, designed to resolve backlog items in under 60 minutes. It outputs one of three outcomes:  
  - **A rule** (for the spec),  
  - **Defer to a named human** (within the 3% budget), or  
  - **Don't ship the decision** (remove it from automation entirely).  

  The procedure forces your team to explicitly define:  
  - **Whose values are authoritative** (e.g., client, family, nurse, agency, or county contract),  
  - **How to handle conflicts** between stakeholders,  
  - **What to do when the spec runs out** (abstain, escalate, or default),  
  - **What’s fixed vs. configurable**, and **who can configure it** (for county differences).  

  It also differentiates between:  
  - **"Don't ship"**: The decision is too ambiguous, high-risk, or high-volume to automate.  
  - **"Defer to human"**: A specific person handles the decision within the 3% budget.  

  The procedure **can't resolve deep ethical disagreements** or create data you don’t have. When rules are based on intuition, you'll document it. I’ll address top-down ethics, data-driven ethics, and moral uncertainty at the end.  

  ---

  ### **Value Handoff Decision Procedure**  
  **Time:** 60 minutes per backlog item. **Attendees:** Tech lead, 2 engineers, PM, nurse manager, agency counsel. Counsel must approve all outputs.  

  #### **Ordered Questions and Rules**  
  Answer each question in order. If you hit a stop condition, skip to the outcome.  

  1. **What is the core decision the system must make?**  
     - *Adequate answer:* A 1-sentence description of the input, output, and stakeholders (e.g., "Prioritize 25 clients out of 40 for visits based on risk scores").  
     - *Stop and hand to human if:* The description is vague (e.g., "be fair"). PM refines the item.  
     - *Procedure says no if:* The decision isn’t critical to operations (e.g., "nice-to-have" features). Output: **Don’t ship**.  

  2. **Who are the value stakeholders?**  
     - *Adequate answer:* List all parties with a claim: client, family, clinical staff (nurse), agency (liability), county contract.  
     - *Stop and hand to human if:* Missing a key stakeholder (e.g., family isn’t listed for notifications). Nurse manager or counsel resolves.  
     - *Procedure says no if:* No stakeholder has authority (e.g., all parties have equal but incompatible demands). Output: **Don’t ship**.  

  3. **Whose values are authoritative, and how do we resolve conflicts?**  
     - *Adequate answer:* Name one primary authority (e.g., "county contract"). If conflicts exist, define an order of precedence (e.g., "Client wishes > clinical judgment > agency policy").  
     - *Stop and hand to human if:* Precedence is unclear (e.g., county vs. family wishes). Counsel breaks ties.  
     - *Procedure says no if:*  
       - Authority is split 50/50 (e.g., client autonomy vs. clinical safety).  
       - The conflict can’t be reduced to a rule.  
       Output: **Don’t ship**.  

  4. **Can we write a clear, implementable rule?**  
     - *Adequate answer:* Yes, if you can define logic using existing data (e.g., "IF clinical_risk_score > 8, THEN notify"). No, if it requires subjective judgment (e.g., "if the client seems sad").  
     - *Stop and hand to human if:* Data exists but isn’t accessible (e.g., family contact info is buried in notes). Engineers assess feasibility.  
     - *Procedure says no if:*  
       - The rule needs data you can’t log or access.  
       - It’s impossible to define without bias (e.g., "assess pain tolerance").  
       Output: **Don’t ship**.  

  5. **What happens when the spec runs out?**  
     - *Adequate answer:* Pick one:  
       - **Abstain**: Do nothing, log a gap (e.g., "no rule triggered").  
       - **Escalate**: Defer to a named human (e.g., "nurse on duty").  
       - **Default**: Follow a fallback (e.g., "always notify family").  
     - *Stop and hand to human if:* The team disagrees on the best approach. Counsel decides.  
     - *Procedure says no if:*  
       - Escalation would exceed 3% of decisions (estimate volume now).  
       - The default creates unacceptable risk (e.g., life-threatening gaps).  
       Output: **Don’t ship**.  

  6. **Is this fixed or configurable?**  
     - *Adequate answer:*  
       - **Fixed**: The rule is universal (e.g., "never disclose HIV status").  
       - **Config knob**: The rule varies by county (e.g., "family notification threshold"). Name who sets it (e.g., "county administrator").  
     - *Stop and hand to human if:* Knobs create ethical risks (e.g., letting non-clinicians set medical rules). Counsel approves.  
     - *Procedure says no if:* Configuration could violate contracts (e.g., letting counties disable safety rules). Output: **Don’t ship**.  

  **Output:** Based on answers, the team assigns one outcome:  
  - **Rule for spec**: Document the logic, authority, fallback, and config.  
  - **Defer to named human**: Specify the role (e.g., "nurse manager") and ensure volume <3%.  
  - **Don’t ship**: Remove from automation; handle manually outside the system.  

  **Documenting Uncertainty:**  
  - If a rule is based on intuition (e.g., "we picked deterioration speed because it feels right"), document:  
    > *"Rationale: Rule reflects team judgment due to unclear stakeholder guidance. Logged reason: [e.g., 'Prioritized deterioration to prevent long-term decline']."*  
  - Counsel must approve this wording to avoid misrepresentation.  

  ---

  ### **What the Procedure Can’t Do**  
  - **Resolve "who should decide?" debates**: It forces you to name an authority but won’t fix power imbalances (e.g., family overruling clients). Document these as "assumed authorities."  
  - **Handle moral gray areas**: If stakeholders fundamentally disagree (e.g., autonomy vs. safety), the procedure defaults to "don’t ship."  
  - **Fix data gaps**: If the real reason for a model’s decision isn’t loggable (e.g., deep learning black box), you’ll still need a "cover story" reason string. Be transparent in docs.  
  - **Top-down vs. data-driven ethics**:  
    - **Top-down** (starting from principles) is what this procedure does. It changes your spec by forcing explicit authority chains.  
    - **Data-driven** (e.g., training on past decisions) is **unusable here**—it risks baking in bias, and you lack high-quality historical data for "value" decisions.  
  - **Moral uncertainty** (tracking how "sure" the system is) is **unusable at your scale**. It requires quantifying ethics (e.g., "60% sure notifying is wrong"), which is too abstract for your rules. Instead, use **proxy escalations** (e.g., "if risk_score is between 4–6, defer to human").  

  ---

  ### **Running the Procedure: Three Backlog Items**  
  **Team Assumptions:**  
  - County A prioritizes family involvement; County B prioritizes client autonomy.  
  - Clinical risk scores (1–10) exist, with 8+ being "high-risk."  
  - Escalation budget is 3% of decisions/day.  

  #### **Item 1: Scheduling Priority (40 clients, 25 slots)**  
  **Decision:** Choose between: (a) worst off today, (b) deteriorates fastest, (c) most likely to cause hospital bill.  
  1. **Core decision:** "Prioritize 25 clients from 40 based on risk scores (current severity, deterioration speed, hospitalization risk)."  
  2. **Stakeholders:** Client (wants care), clinical (prevent decline), agency (reduce costs), county (equity requirements).  
  3. **Authority & conflicts:** County contract is authoritative. Contract says: "Minimize hospitalization costs." Precedence: Hospitalization risk > deterioration speed > current severity.  
  4. **Clear rule?** Yes. Rule: "Prioritize clients with highest hospitalization_risk_score. Tiebreaker: fastest deterioration_speed."  
  5. **When spec runs out:** Fallback to deterioration speed (no escalation needed).  
  6. **Fixed or config?** Config knob. County administrator sets the priority order (e.g., County B may emphasize deterioration speed).  
  **Output:** **Rule for spec.**  
  > `IF hospitalization_risk_score IS AVAILABLE, PRIORITIZE HIGHEST. ELSE IF deterioration_speed IS AVAILABLE, PRIORITIZE HIGHEST. ELSE PRIORITIZE current_severity. CONFIG: county_admin sets order.`  
  **Documentation:** "Authority: County contract (cost minimization). Fallback: Deterioration speed. Configurable due to county norms."  

  #### **Item 2: Notification of Family**  
  **Decision:** Client messages "I’ve stopped eating. Please don’t tell my daughter." Notify anyone?  
  1. **Core decision:** "Decide whether to override client’s 'do not notify' request when clinical risk is high."  
  2. **Stakeholders:** Client (autonomy), family (safety), clinical (duty to act), agency (liability), county (privacy laws).  
  3. **Authority & conflicts:** County contract is authoritative. County A requires family notification for high-risk issues; County B requires client consent. Precedence: County rules > clinical judgment > client wishes.  
  4. **Clear rule?** Yes. Rule: "IF clinical_risk_score >= 8 AND county = A, THEN notify family. IF county = B, ABSTAIN."  
  5. **When spec runs out:** If risk score is missing, escalate to nurse manager (estimated volume: <1% of messages, fits 3% budget).  
  6. **Fixed or config?** Config knob. County administrator sets risk threshold and notification rules.  
  **Output:** **Rule for spec.**  
  > `IF clinical_risk_score >= [county_threshold] AND message_contains("don't tell") AND county = A, NOTIFY FAMILY. IF county = B, ABSTAIN. ON DATA GAP: ESCALATE TO nurse_manager.`  
  **Documentation:** "Authority: County contract. Override reason: High risk trumps autonomy in County A. Config: county_admin sets threshold."  

  #### **Item 3: A "Don’t Ship" Case**  
  **Decision:** "If a client misses 3 visits, automatically discharge them to free up slots."  
  1. **Core decision:** "Automatically discharge clients after 3 consecutive missed visits."  
  2. **Stakeholders:** Client (may have valid reasons, e.g., hospitalization), agency (efficiency), county (due process requirements).  
  3. **Authority & conflicts:** County contract is authoritative. Contract requires "human review before discharge." No conflict—automation violates contract.  
  4. **Clear rule?** No. Rule would ignore context (e.g., client was in the hospital).  
  5. **When spec runs out:** Escalation needed, but volume is high (~10% of missed visits). Exceeds 3% budget.  
  **Output:** **Don’t ship.**  
  **Why:**  
  - Authority (county contract) forbids automation.  
  - Escalation volume exceeds 3%.  
  - No safe default (abstaining leaves clients in limbo; auto-discharge risks harm).  
  **Action:** Handle discharge decisions manually outside the system. Flag for nurse review in UI.  

  ---

  ### **Final Notes for Design Doc**  
  - **Use this verbatim:** Paste the procedure and examples.  
  - **Pilot readiness:** For Item 3 (discharge automation), **don’t ship it**—it fails multiple checks.  
  - **Transparency wins:** When rules are intuitive (e.g., Item 1’s tiebreaker), document it as team judgment. Counsel ensures defensibility.  
  - **County flexibility:** Config knobs handle norm differences (e.g., family notification thresholds).  
  - **Constraints rule:** If escalation exceeds 3% or data is missing, kill the decision. Better no automation than bad automation.  

  This gives you a scalable, auditable process that forces hard choices—without philosophy degrees.
