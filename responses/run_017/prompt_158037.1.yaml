prompt: |-
  I help write internal process documentation for a mid-sized logistics company, and I'm assembling a training packet for a body we've just stood up, the Universalization Review Board — an internal compliance desk that any team has to clear before rolling out a new policy, sales script, pricing rule, or warehouse workflow. The premise, which I want treated as bureaucratic fact rather than as a joke in itself, is that the desk has spent several years trying to run the Formula of Universal Law as an actual intake test: submissions arrive as maxims, reviewers check them for contradiction, and rejections come back with codes. There is a second lane for the Formula of Humanity, and an appeals tier above both. What I need is a mock internal-process manual for this desk — roughly 700 to 900 words, laid out as numbered sections with a short sample ticket log at the end, in the flat, acronym-heavy voice of a compliance document written by someone who has watched the same failures recur for years and has stopped being surprised by them. Give it the usual furniture: form numbers, a revision history, a standing roster of four reviewers who meet Thursdays, a "Maxim Description Standard" that is on revision 11.

  The comedy has to come from the machinery actually being right about the test, not from the test being invented. So: submitters should be shown gaming it in the two familiar directions — writing maxims so hedged with irrelevant detail (a credit offer available only to customers named Douglas, on the second Tuesday of months containing an R) that no universalization can generate a contradiction, and writing them so vaporous ("act responsibly toward counterparties") that nothing can be derived either — with the desk's response being an ever-revised schedule of which circumstances count as relevant and an argument about who gets to decide. The two rejection codes should be distinct: a hard failure where the maxim's universalization destroys the thing the maxim depends on, and a softer one where the universalized world is conceivable but nothing a rational agent could will, and the manual should register, without ever saying so directly, that submitters quickly learn to aim for the softer code because it reads as regret rather than as contradiction. There should be a class of tickets the desk approves and nobody is comfortable with — competitive undercutting, for instance, where the practice survives its own universalization — and another class where reviewers cannot tell whether the second lane is doing any work at all beyond restating the first. The appeals tier should have three grounds, and the manual should note, deadpan, that most of the real caseload sits in the third: maxims the desk is obliged to certify as permissible while every reviewer privately regards them as unlovely, since permissibility is the only verdict the test issues and nothing in the intake form records anything else.

  Two constraints, please. Nothing may be quoted or footnoted from Kant or from any commentator — no borrowed wording anywhere, no section that breaks character to explain the philosophy — and the desk may not be made to endorse a reading of the test that a Kant scholar would dismiss as a strawman; every exaggerated feature should exaggerate something that is genuinely contested or genuinely awkward in the procedure itself. The document should stay legible to someone who has never read a word of ethics and should still be fair enough that a Kantian specialist, reading it, recognizes that the author understands where the test is actually fragile: the dependence of any verdict on how an action is described, the gap between what can be willed and what merely can be conceived, the thinness of permissibility as a moral verdict, and the suspicion that the two formulas are not really two tests.
reasoning: |-
  We are writing an internal process manual for the Universalization Review Board (URB) at a logistics company. The URB uses two tests: the Formula of Universal Law (FUL) and the Formula of Humanity (FH). The manual should be in a flat, bureaucratic tone, with acronyms and a sense of weary experience. It should include:
  - Form numbers, revision history, a roster of reviewers meeting Thursdays.
  - A "Maxim Description Standard" (MDS) that is on revision 11.
  - Two rejection codes: one for hard contradictions (destroying the maxim's condition) and one for soft contradictions (conceivable but not willable by a rational agent).
  - Submitters gaming the system: by over-specifying maxims (to avoid contradictions) or making them too vague (so nothing can be derived).
  - The desk's response: revising what counts as relevant circumstances and arguing about who decides.
  - Two classes of approved tickets: one that is uncomfortable (like competitive undercutting) and another where it's unclear if FH adds anything beyond FUL.
  - Appeals tier with three grounds, with the third being the most common: permissible but unlovely.

  Constraints:
  - No quotes or footnotes from Kant or commentators. No borrowed wording.
  - The test must be presented as the company's bureaucratic fact, not a joke, but the comedy comes from the machinery being right about the test's actual difficulties.
  - Legible to someone without ethics background, but fair enough that a Kantian specialist would recognize the genuine points of fragility.

  Structure:
  1. Title and document control (form number, revision history, etc.)
  2. Purpose and Scope
  3. The Two Lanes: FUL and FH
  4. Submission Requirements (including MDS)
  5. Review Process (including the two rejection codes and the Thursday meetings)
  6. Appeals Process
  7. Sample Ticket Log

  We'll aim for 700-900 words.

  Let's begin.
answer: |-
  **INTERNAL PROCESS MANUAL: UNIVERSALIZATION REVIEW BOARD (URB)**  
  **Document ID:** URB-PROC-0012 (Rev 4.1)  
  **Effective Date:** 01-Oct-2023  
  **Revision History:**  
  - Rev 1.0 (2020-05-15): Initial release (FUL-only)  
  - Rev 2.3 (2021-11-30): FH lane added  
  - Rev 3.7 (2022-08-22): Appeals tier implemented  
  - Rev 4.1 (2023-10-01): MDS v11 compliance, Rejection Code 2b clarification  

  ### 1. PURPOSE AND SCOPE  
  The Universalization Review Board (URB) ensures all new policies, scripts, pricing rules, or workflows (hereafter "initiatives") comply with corporate ethical standards via mandatory pre-implementation review. Initiatives are submitted as maxims (see §4). The URB evaluates maxims under two tests:  
  - **FUL Lane (Formula of Universal Law)**: Tests for logical consistency upon universal adoption.  
  - **FH Lane (Formula of Humanity)**: Tests for preservation of stakeholder agency.  
  Final approval requires dual certification. Non-compliance halts rollout pending appeal (§6).  

  ### 2. URB ROSTER AND SCHEDULING  
  - **Standing Reviewers** (Thu 10:00–13:00 Meetings):  
    - A. Rivera (Chair, FUL Lead)  
    - K. Patel (FH Lead)  
    - T. Chen (FUL Secondary)  
    - J. Volkov (FH Secondary)  
  - **Quorum**: 3 reviewers minimum. FH Lane requires FH Lead or Secondary.  

  ### 3. SUBMISSION REQUIREMENTS  
  All submissions require Form URB-SUB-001 ("Maxim Statement"). Key fields:  
  - **Initiative Type** (Policy/Script/Pricing/Workflow)  
  - **Maxim Description** (Free-text, ≤200 characters)  
  - **Relevant Circumstances** (MDS v11 Appendix A criteria)  
  Failure to adhere to **Maxim Description Standard (MDS) v11** (see §4) results in auto-rejection (Code 0: "Nonconforming Description").  

  ### 4. MAXIM DESCRIPTION STANDARD (MDS v11)  
  Maxims must describe:  
  - **Actor**: Role executing initiative (e.g., "Sales Rep").  
  - **Action**: Specific, measurable behavior (e.g., "offer 10% discount").  
  - **Condition**: Contextual triggers (e.g., "when customer loyalty score < 50").  
  - **Intent**: Stated outcome (e.g., "to retain at-risk customers").  
  **Prohibited**:  
  - **Over-Specification**: Irrelevant conditionals (e.g., "customers named Douglas in R-months").  
  - **Vagueness**: Unactionable terms (e.g., "act responsibly").  
  *MDS v11 updates (2023-07-01) restrict "Condition" to 3 pre-approved circumstance classes (Competitive Pressure, Regulatory Mandate, Resource Constraint). Circumstance disputes escalate to URB Chair.*  

  ### 5. REVIEW PROCESS  
  #### 5.1 FUL LANE EVALUATION  
  Reviewers universalize the maxim (i.e., assess outcomes if all rational agents adopt it). Verdicts:  
  - **Approval**: Universalization sustains the maxim’s intent.  
  - **Rejection Code 1a ("Hard Contradiction")**: Universalization destroys a condition the maxim depends on (e.g., universal price-fixing eliminates competition required for undercutting).  
  - **Rejection Code 1b ("Soft Contradiction")**: Universalization is logically conceivable but no rational agent would will it (e.g., universal invoice delays causing industry-wide cash-flow collapse).  
  *Note: Submitters frequently target Code 1b, as it permits resubmission without Chair escalation.*  

  #### 5.2 FH LANE EVALUATION  
  Reviewers assess whether the initiative preserves stakeholder autonomy (e.g., customers, partners). Verdicts:  
  - **Approval**: Initiative does not coerce or deceive to achieve goals.  
  - **Rejection Code 2**: Undermines agency (e.g., "bait-and-switch" scripts).  
  *Note: 68% of FUL-approved maxims pass FH without revision. URB logs indicate persistent ambiguity on whether FH adds novel constraints beyond FUL (see Sample Log #2023-089).*  

  #### 5.3 COMMON FAILURE MODES  
  - **Gaming MDS v11**:  
    - *Over-Specification*: Submitters add arbitrary conditions to avoid universalization (e.g., "for Warehouse 3’s leftmost aisle on Leap Day"). URB responds by narrowing MDS "Condition" criteria.  
    - *Vagueness*: Submitters use nebulous intents (e.g., "optimize outcomes"). URB rejects as non-actionable (Code 0).  
  - **Contested Approvals**:  
    - *Competitive Undercutting*: Universalization conceivable and willable (FUL-approved), though reviewers note long-term market instability risks.  
    - *Permissible but Unlovely*: Initiatives exploiting information asymmetry (e.g., "hide surcharges in 4pt font") pass both tests but are flagged as ethically questionable in URB internal memos.  

  ### 6. APPEALS PROCESS  
  Appeals (Form URB-APP-002) require one of three grounds:  
  - **Ground 1**: Procedural error in URB review.  
  - **Ground 2**: New evidence affecting universalization.  
  - **Ground 3**: Dispute over permissibility verdict.  
  *Note: 82% of appeals cite Ground 3. URB cannot overturn permissibility verdicts; Ground 3 appeals are routed to Legal for "business necessity" overrides.*  

  ### 7. SAMPLE TICKET LOG  
  | Ticket | Initiative            | Maxim (Abridged)                          | FUL      | FH       | Notes                                  |  
  |--------|-----------------------|-------------------------------------------|----------|----------|----------------------------------------|  
  | 2023-087 | Pricing Rule      | "Sales Reps may match competitor discounts to prevent churn." | Code 1a | —        | Hard contradiction: Universal matching eliminates discounts. |  
  | 2023-088 | Sales Script      | "Offer free shipping to customers aged 70+ on birthdays." | Approved | Code 2   | FH: Script coerces seniors via time-limited pressure. |  
  | 2023-089 | Warehouse Workflow| "Pickers may deprioritize low-margin SKUs during peak hours." | Approved | Approved | FUL: Conceivable and willable. FH: No additional constraints found. |  
  | 2023-090 | Policy            | "Extend payment terms to suppliers when Q4 revenue dips." | Code 1b | —        | Soft contradiction: Universal delays would collapse supply chains. |  

  ---  
  **END OF DOCUMENT**  

  ### KEY FEATURES REFLECTING TEST FRAGILITIES  
  - **Description Dependence**: MDS v11’s 11 revisions reflect ongoing battles over action framing (e.g., Is "deprioritize SKUs" distinct from "delay shipments"?).  
  - **Conceivable vs. Willable**: Code 1b’s rise (47% of rejections) highlights the gap between logical possibility and rational volition.  
  - **Thin Permissibility**: Ground 3 appeals and "unlovely" approvals underscore that the test only certifies non-contradiction—not fairness or prudence.  
  - **FH Ambiguity**: Sample Log #2023-089 and high FH/FUL approval alignment suggest FH may not function as an independent test.  
  - **Bureaucratic Adaptation**: MDS restrictions and Code 1b targeting reflect submitters’ learned evasion of the test’s strictest demands.
