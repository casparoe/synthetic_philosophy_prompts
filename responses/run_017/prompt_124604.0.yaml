answer: |-
  ### Exam Question: Fitch's Paradox and Escape Routes  
  **Total Time:** 45 minutes  
  **Total Marks:** 20  

  ---

  #### **Background**  
  Fitch’s paradox of knowability derives a contradiction from two assumptions:  
  1. **Knowability Principle (KP):** ∀φ(φ → ◊Kφ)  
     *"Every truth is knowable."*  
  2. **Non-Omniscience (NO):** ∃φ(φ ∧ ¬Kφ)  
     *"Some truth is unknown."*  

  Using these, we derive **omniscience**: ∀φ(φ → Kφ). The derivation (simplified):  
  1. *Assume* a specific unknown truth: Let **p** be such that **p ∧ ¬Kp**.  
  2. By KP: **◊K(p ∧ ¬Kp)**.  
  3. **K-distribution:** □∀φ∀ψ(K(φ ∧ ψ) → (Kφ ∧ Kψ))  
     *"Knowledge of a conjunction entails knowledge of each conjunct."*  
  4. Thus: **K(p ∧ ¬Kp) → (Kp ∧ K¬Kp)**.  
  5. **K-factivity:** □∀φ(Kφ → φ)  
     *"Knowledge implies truth."*  
  6. **K¬Kp → ¬Kp** (from K-factivity).  
  7. From (4) and (6): **K(p ∧ ¬Kp) → (Kp ∧ ¬Kp)**.  
  8. But **(Kp ∧ ¬Kp)** is a contradiction (⊥).  
  9. Thus **¬◊K(p ∧ ¬Kp)**. This contradicts step (2).  

  We consider two maneuvers to avoid this paradox:  

  **Maneuver 1: Epistemic Expansion Semantics**  
  - **Modal operator ◊:** ◊φ is true at world *w* iff φ is true at some world *v* such that:  
    (i) *v* has the **same non-epistemic facts** as *w* (i.e., atomic propositions not involving K have identical truth values),  
    (ii) Everything known at *w* is also known at *v* (i.e., if Kφ is true at *w*, then Kφ is true at *v*).  
    Such *v* is called an **epistemic expansion** of *w*.  
  - **Restricted Knowability (Fixed-Base Knowability):**  
    ∀φ[(φ contains no K-operators) → (φ → ◊Kφ)]  
    *"Every non-epistemic truth is knowable in some epistemic expansion."*  

  **Maneuver 2: Rejecting K-Distribution**  
  - Deny that knowledge distributes over conjunction:  
    Reject □∀φ∀ψ(K(φ ∧ ψ) → (Kφ ∧ Kψ)).  
    *"Knowing a conjunction does not necessarily entail knowing each conjunct."*  

  ---

  #### **Tasks**  
  1. **Model Verification** (4 marks):  
     Consider a model with:  
     - Worlds: **w₀** (actual), **w₁**, **w₂**  
     - Accessibility: **w₀** accesses **w₁** and **w₂** (for ◊).  
     - Non-epistemic atoms: **p** (e.g., "It is raining")  
     - Valuation:  
       - At **w₀**: **p** = true, **Kp** = false  
       - At **w₁**: **p** = true, **Kp** = true  
       - At **w₂**: **p** = true, **Kp** = false  
     Verify whether **w₁** and **w₂** are epistemic expansions of **w₀** under Maneuver 1’s semantics. Explain.  

  2. **Targeted Derivation Steps** (8 marks):  
     For each maneuver:  
     - Identify the **exact step(s)** in the derivation (steps 1–9) it blocks.  
     - Explain **why** the derivation fails at that step under the maneuver.  

  3. **Motivations & Implications** (8 marks):  
     - Does the maneuver have **motivations beyond avoiding Fitch’s paradox**? (e.g., philosophical or semantic intuitions).  
     - For Maneuver 1: Does **fixed-base knowability** preserve the core idea of the original knowability principle (KP), or does it become so weak that even a **realist** (who believes some truths are verification-transcendent) could accept it? Justify.  

  ---

  ### Model Answer (≈700 words)  
  **Task 1: Model Verification**  
  Under Maneuver 1, an epistemic expansion **v** of **w₀** must satisfy:  
  - Same non-epistemic facts: **p** has identical truth values in **w₀**, **w₁**, **w₂** (all true).  
  - Preserve knowledge: If **Kφ** is true at **w₀**, it must be true at **v**.  
  At **w₀**, **Kp** is false, so there is no known φ to preserve. Thus, **w₁** and **w₂** both qualify as epistemic expansions of **w₀**.  

  **Task 2: Targeted Derivation Steps**  
  - **Maneuver 1 (Epistemic Expansions)** blocks **step 2** (◊K(p ∧ ¬Kp)).  
    *Why?* KP is restricted to non-epistemic φ. But **p ∧ ¬Kp** contains **K** (epistemic vocabulary), so fixed-base knowability does not apply to it. Further, in epistemic expansions, **p**’s truth is fixed, but **Kp** may change. Though ◊Kp holds (e.g., at **w₁**), ◊K(p ∧ ¬Kp) fails: **K(p ∧ ¬Kp)** requires **Kp ∧ K¬Kp**, but **K¬Kp** implies ¬Kp (by K-factivity), contradicting Kp. Step 2 assumes KP applies universally, but Maneuver 1 restricts it.  

  - **Maneuver 2 (Reject K-Distribution)** blocks **step 4** (K(p ∧ ¬Kp) → (Kp ∧ K¬Kp)).  
    *Why?* The derivation relies on K-distribution to split K(p ∧ ¬Kp) into Kp and K¬Kp. If knowledge does not distribute over conjunction, this inference is invalid. One might know the conjunction *p ∧ ¬Kp* without separately knowing ¬Kp (e.g., if knowledge requires sensitivity to truth-makers). Thus, step 4 cannot be derived.  

  **Task 3: Motivations & Implications**  
  - **Maneuver 1**:  
    - *Beyond paradox?* Yes. It formalizes the idea that knowledge expansion should not alter non-epistemic reality (e.g., empirical facts). This aligns with scientific realism, where the world is fixed, and knowledge approximates it.  
    - *Fixed-base knowability vs. original KP*: It **abandons the anti-realist core** of KP. Anti-realism (e.g., Dummett) claims all truths *must* be knowable in principle, including epistemic ones. Fixed-base knowability excludes truths like *p ∧ ¬Kp*, which a realist accepts as verification-transcendent. Thus, a realist *can* accept it—it only requires knowability for "brute facts" (e.g., physical laws), not gaps in knowledge.  

  - **Maneuver 2**:  
    - *Beyond paradox?* Yes. Rejecting K-distribution reflects **tracking theories** of knowledge (e.g., Nozick), where knowing a conjunction does not require tracking each conjunct. For example, I might know *"A is a square and B is red"* via a reliable process without separately tracking *"B is red"* if my method is holistic. This is independently motivated to handle Gettier cases.  
    - *Impliations*: It preserves KP’s anti-realist spirit by allowing *all* truths to be knowable, including p ∧ ¬Kp. However, it concedes that such knowledge might not "decompose" via K-distribution.  

  **Independence of Maneuvers**:  
  They attack different steps (step 2 vs. step 4) and are not equivalent. Maneuver 1 restricts KP’s scope, while Maneuver 2 alters the logic of knowledge.  

  ---

  ### Marking Scheme (20 marks)  
  | **Must-Hit Points**                                  | **Marks** | **Common Mistakes**                                                                 |  
  |------------------------------------------------------|-----------|-------------------------------------------------------------------------------------|  
  | **Task 1: Correct model verification**               | 4         | Failing to check knowledge preservation (e.g., ignoring that w₀ has no known Kφ).  |  
  | **Task 2: Maneuver 1 blocks step 2 + explanation**   | 4         | Vaguely saying "it restricts KP" without noting *why* p∧¬Kp is ineligible.          |  
  | **Task 2: Maneuver 2 blocks step 4 + explanation**   | 4         | Confusing K-distribution with full closure under entailment.                       |  
  | **Task 3: Motivations beyond paradox for both**      | 4         | Missing tracking theory for Maneuver 2 or fixed-reality for Maneuver 1.             |  
  | **Task 3: Realist acceptance of fixed-base knowability** | 4         | Claiming it preserves anti-realism; missing that verification-transcendent truths are allowed. |  

  **Grading Key:**  
  - **A (17–20)**: Identifies exact steps (step 2 for M1, step 4 for M2) and explains *why* using semantics/logic.  
  - **B (13–16)**: Correctly states derivation fails but does not pinpoint steps or confuses maneuvers.  
  - **C (9–12)**: Partial task completion (e.g., model correct but steps misidentified).  
  - **D/F (0–8)**: Major errors (e.g., misdefining epistemic expansions or K-distribution).  

  ---

  ### Note to TA  
  **Independence of Maneuvers**: They are distinct. Maneuver 1 blocks the *substitution instance* (p ∧ ¬Kp) from being knowable by restricting KP’s domain. Maneuver 2 allows ◊K(p ∧ ¬Kp) but blocks decomposing it into Kp ∧ K¬Kp. They are not notational variants: One alters semantics for ◊, the other rejects a K-axiom.  

  **Predicted Difficulty**:  
  - Students will likely struggle with **Task 1** (verifying epistemic expansions). Many will check only non-epistemic facts and ignore knowledge preservation.  
  - In **Task 3**, linking fixed-base knowability to *realism* will be challenging. Most will default to "it weakens KP" without analyzing verification-transcendence.  
  - **Key pitfall**: Confusing K-distribution (K(φ∧ψ)→Kφ∧Kψ) with the converse (closure under conjunction introduction). The derivation only needs distribution!  

  **Recommendation**: Emphasize in class that Fitch’s paradox relies *only* on K-distribution, not full closure. Use the model in Task 1 to show how ◊Kp holds but ◊K(p ∧ ¬Kp) fails.  

  ---  
  **Formatting**: American English used throughout. Self-contained definitions provided. Model is minimal (3 worlds).
