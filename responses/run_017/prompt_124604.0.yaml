  2) The "epistemic expansion" semantics might secretly collapse into just restricting the knowability principle to non-epistemic truths.

  For the exam design, I'll:
  - Use a 3-world model with actual world w0 and epistemic expansions w1, w2
  - Define Kφ as "φ is known" and ◊φ with accessibility restricted to epistemic expansions
  - State both maneuvers explicitly: the semantic restriction and the rejection of K(φ∧ψ)→Kφ∧Kψ
