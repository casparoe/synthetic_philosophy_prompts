  To address: In step 3, we can say that the faculty vote for the new criteria because they believe it will benefit the department. At that moment, with the information available, it is a safe PI. But by the original preferences (which they still hold, though they are now suppressed by the new incentives), they would have preferred the old system. Condition (a) uses "at the time", so it's okay. The terminal badness is judged by the original preferences (as per spec 3: "judged by the preferences those parties had back at the origin"). So we are consistent.

  **Revised Step 3 to ensure safety**:
  - In step 3, the chair argues that the new criteria will not harm teaching because faculty will still teach their reduced load (1.5) and the advanced courses. The reputational gains will help attract better students and faculty, which benefits everyone. Even teaching-oriented faculty might see the benefit. So it passes (a) and (b) at the time.

  **Final Scenario Paragraph**:

  In a philosophy department starting with balanced teaching-research norms, Step 1 hires a research star with a temporary grant and reduced teaching. Step 2 equalizes teaching loads downward by using adjuncts for intro courses after the grant expires. Step 3 shifts promotion to emphasize research, capitalizing on the increased research activity. Step 4 further reduces teaching, relying almost entirely on adjuncts. The endpoint loses the teaching quality and collegial balance originally valued, making all original parties worse off by their initial preferences, though each step was a local safe Pareto improvement under then-current conditions and preferences.

  **Analysis**:

  The trick is that the steps change the state (composition, norms, and available options) in a way that shifts the dynamics. Preferences are fixed, but the changing state alters what is feasible and what incentives dominate. The safety check is local to the state and the preferences at that time, but the state change sets up the next step. The ratchet occurs because the changes are irreversible (due to new actors and sunk costs).

  **Pushback Response**: 
