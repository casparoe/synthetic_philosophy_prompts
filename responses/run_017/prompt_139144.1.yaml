  - **Step 3**: Safe PI. Faculty can focus on research, which now seems more important because of the new norms (but the norms shifted in step 2 and are solidified here). The change in promotion criteria is accepted because juniors think it helps them.
  - **Step 4**: Safe PI. Faculty get even more research time, which aligns with the now-dominant research norm.

  **Why the local safety and EV agree**:
  - At each step, the immediate benefits are clear and the costs are either deferred, externalized (to adjuncts, who are new), or seem manageable. The EV calculation at each step would also say GO because the next step isn't considered (it's not part of the decision).

  **The ex ante view**: 
  - From the start, if they knew the chain, no one would want it. The rule "take gradient-safe improvements" leads to net loss.

  **What's doing the work**:
  - The steps change the dynamics by altering the composition of the department (adding a research superstar) and the norms (shifting from a teaching-research balance to research dominance). 
  - Preferences are fixed (they still value teaching and balance), but the state changes so that the options and incentives shift. The local safety check is against the current state and current preferences, but the state change sets up the next step.

  **Breaking conditions**:
