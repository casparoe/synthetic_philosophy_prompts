answer: |-
  ### Case Summary
  **Yes, the case meets all specs 1-4. The trick is that each step changes institutional dynamics and actor incentives, shifting what counts as an improvement without altering core preferences. Preferences remain fixed, but the feasible set and decision-making context irreversibly degrade, enabling a ratchet toward a Pareto-inferior outcome.**

  ### Scenario: University Department’s Research Ratchet
  **Start State (Philosophy Department):**  
  10 faculty members balance teaching (2 courses/semester) and research. Students receive high-quality, faculty-led small seminars. The department is collegial, with tenure based on both teaching and research. Faculty and students are satisfied.

  **Step 1: Hire a Research Star (Year 1)**  
  - **Actor:** Department chair (elected by faculty).  
  - **Action:** Hire a prestigious researcher with a 50% teaching reduction (1 course) and higher salary, funded by a 3-year external grant.  
  - **Affected Parties:** Existing faculty, new hire, students.  
  - **Benefits:**  
    - Existing faculty: Department prestige rises, improving grant access and research collaboration. No immediate workload change.  
    - New hire: Gains reduced teaching and higher status.  
    - Students: Access to a renowned scholar for one specialized course.  
  - **Safety Across Models:** Holds even if the grant expires (reputation gains persist) or if teaching reduction is minor (affects only one course). Models include: reputation-driven resource growth, no envy if gains are shared.  

  **Step 2: Equalize Teaching Loads (Year 4)**  
  - **Actor:** New chair (elected post-Step 1).  
  - **Action:** After grant expires, reduce all faculty teaching to 1.5 courses/semester to resolve equity concerns about the star’s load. Fund by increasing intro-class sizes and hiring adjuncts.  
  - **Affected Parties:** Faculty, students, adjuncts.  
  - **Benefits:**  
    - Faculty: Lower teaching load for all, eliminating resentment. More research time.  
    - Adjuncts: New employment opportunities.  
    - Students: Advanced courses remain faculty-taught; department argues larger intro classes are offset by reputational benefits.  
  - **Safety Across Models:** Holds even if adjunct quality is lower (reputation offsets; faculty time gain is immediate). Models include: adjuncts as qualified, student demand insensitive to intro-course changes.  

  **Step 3: Emphasize Research in Tenure (Year 7)**  
  - **Actor:** Research-focused chair (elected after culture shift).  
  - **Action:** Change tenure criteria to prioritize research (e.g., teaching must only be "adequate").  
  - **Affected Parties:** Faculty (juniors/seniors), students.  
  - **Benefits:**  
    - Faculty: Clearer path to tenure for research-oriented juniors; seniors gain prestige.  
    - Students: Department argues a "top-tier research department" enhances degree value.  
  - **Safety Across Models:** Holds even if teaching quality dips (reputational gains dominate). Models include: student recruitment driven by research rankings, faculty productivity increasing under new incentives.  

  **Step 4: Cut "Redundant" Courses (Year 10)**  
  - **Actor:** Chair and faculty council (research-dominated).  
  - **Action:** Reduce teaching to 1 course/semester, cancel small seminars, and expand adjunct-led intro classes.  
  - **Affected Parties:** Faculty, students, adjuncts.  
  - **Benefits:**  
    - Faculty: Maximizes research time, aligning with tenure criteria.  
    - Adjuncts: More stable employment.  
    - Students: Department argues research prestige outweighs larger classes.  
  - **Safety Across Models:** Holds even if student satisfaction drops (employers value institutional prestige). Models include: cost savings reinvested in research, no near-term enrollment decline.  

  **End State:**  
  - Faculty teach 1 course/semester; 80% of classes are adjunct-taught with large enrollments.  
  - Research output is high, but teaching quality is low. Collegiality is replaced by publish-or-perish stress.  
  - **Terminal Badness (vs. Start):**  
    - Faculty: Worse by original preferences—miss teaching engagement and balanced work life (research pressure increased net dissatisfaction).  
    - Students: Worse—less mentorship and educational quality, despite degree prestige (original preference was for learning, not branding).  
    - Adjuncts: Better off, but they were unaffected at the start (newly created constituency). Original parties (faculty/students) are strictly worse off.  

  ---

  ### Walkthrough
  **Step-Local Safe-Pareto Filter (GO at every step):**  
  - Each step satisfies (a): Immediate benefits for all affected parties *at the time* (e.g., Step 2 reduces faculty workload without tradeoffs; Step 3 simplifies tenure).  
  - Each step satisfies (b): Benefits hold across plausible models (e.g., Step 1’s reputation gains persist even if grant lapses; Step 4’s teaching cuts are safe if prestige buffers enrollment).  

  **Step-Local Expected Value (GO at every step):**  
  - No step has foreseeable negative consequences. Step 2 assumes adjuncts maintain quality; Step 3 assumes teaching won’t degrade critically. Rational actors see net gains given local information.  

  **Ex Ante View (Reject the chain):**  
  - Knowing the full chain, all original parties (faculty/students) prefer the start state: Lower research output is offset by higher teaching satisfaction and lower stress.  
  - Rule *always take gradient-safe improvements* is net-negative: It enables a ratchet where local wins accumulate into global loss.  

  **What’s Doing the Work:**  
  - **Changing Dynamics, Fixed Preferences:** Preferences (e.g., faculty value teaching engagement) are fixed, but steps alter the *decision-making context*:  
    - Step 2 normalizes adjunct reliance, reducing faculty teaching role.  
    - Step 3 changes tenure incentives, shifting effort allocation.  
    - Safety checks are robust to *state uncertainty* (e.g., grant renewal) but not *dynamic uncertainty* (how this step enables harmful future steps).  
  - **Irreversibility:** Steps create sunk costs (e.g., star hire) and new constituencies (adjuncts), making reversal impossible without new losses.  

  **Conditions Broken:**  
  - **Reversibility:** The world is not well-behaved; hiring/firing costs and norm shifts create hysteresis. Removing this makes the ratchet harmless (e.g., reverting Step 2 would restore balance).  
  - **State-Dependent Dynamics:** The state (norms, actor influence) evolves, altering future feasible sets. Preferences alone don’t prevent regression.  

  **Simultaneous Decision Test:**  
  - If all steps decided together at the start: Committee rejects the chain. Faculty/students foresee teaching erosion and stress. **Problem dissolves** into coordination failure—fixable by a meeting.  

  **Pushback: "SPI Check Should Be on the Policy, Not Steps"**  
  - Strongest pushback: The rule *take every SPI step* should itself be SPI-checked. If that policy fails SPI (due to ratchet risks), the local steps are irrelevant.  
  - **Response:** This relocates but doesn’t solve the problem. Checking the policy *"always take available SPIs"* for safety:  
    - Condition (b) requires robustness across models, including those with ratchet risks.  
    - But ratchet models are hard to exclude—they arise from mundane institutional dynamics (spec 1).  
    - Thus, the policy is **not safe** in sense (b): In ratchet-prone models (e.g., academia), it predictably leads to terminal badness.  
  - **Payload:** The relocated check fails safety, exposing SPI as non-composable. The rule self-destructs under its own logic.  

  ---

  ### Confidence Assessment
  - **Specs 1-4 Fully Met:** High confidence (steps are ordinary, no stupidity, local benefits clear).  
  - **Spec 2 (Each Step Safe PI):** High for Steps 1-2; Medium for Steps 3-4 (teaching degradation could be contested, but safety holds under broad models like "prestige compensates").  
  - **Spec 3 (Terminal Badness):** High (original parties worse off; adjuncts are new actors).  
  - **Least Sure Claim:** **Joint of Specs 2 and 3** (terminal badness despite stepwise safety). Risk: Step 4’s benefit to students might stretch model robustness. Mitigation: Student dissatisfaction in end state is severe and universal across models (e.g., surveys show learning quality trumps prestige).  
  - **Core Vulnerability:** If preferences adapt (e.g., faculty grow to prefer research), terminal badness fails. But spec 3 uses *original* preferences—fixed throughout.  

  ### Final One-Paragraph Scenario  
  A philosophy department starts balanced between teaching and research. Step 1 hires a research star with a grant-funded teaching reduction, boosting prestige. Step 2 equalizes workloads by reducing faculty teaching and using adjuncts after the grant lapses. Step 3 prioritizes research in tenure criteria to capitalize on freed-up time. Step 4 further cuts teaching, relying on adjuncts for most courses. The endpoint sacrifices teaching quality and faculty well-being for research output, leaving all original parties worse off by their initial preferences, though each step was a locally robust Pareto improvement.
