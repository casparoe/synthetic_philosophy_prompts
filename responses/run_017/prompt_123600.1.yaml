  ### Translation in Type-Theoretic Vocabulary

  #### Catuṣkoṭi (Four Corners) for Origination
  - **Formalization**:  
    For a type `Entity` and a proposition `OriginatesFrom : Entity → Type`, define four propositions:  
    1. `SelfOrigination : Entity → Type` (from itself)  
    2. `OtherOrigination : Entity → Type` (from other)  
    3. `BothOrigination : Entity → Type` (from both)  
    4. `NoCauseOrigination : Entity → Type` (from no cause)  

    The tetralemma asserts:  
    - `∀ (e : Entity), SelfOrigination e → ⊥`  
    - `∀ (e : Entity), OtherOrigination e → ⊥`  
    - `∀ (e : Entity), BothOrigination e → ⊥`  
    - `∀ (e : Entity), NoCauseOrigination e → ⊥`  

    **Choice**: I treat the corners as independent propositions (not mutually defined). This avoids immediate contradiction but loses the traditional mutual exclusivity/exhaustivity. **Cost**: Original assumes corners are exhaustive; this drops that assumption.

  #### Svabhāva (Intrinsic Nature)
  - **Formalization**:  
    A predicate `Svabhava : (T : Type) → T → Type` representing "intrinsic nature" of a term. For example:  
    `Svabhava T x` asserts that `x : T` is context-independent (e.g., closed terms in empty context).  

