answer: |-
  ### Restatement of the Backward Induction Paradox in RL Vocabulary

  #### **1. Full Tree Unrolled (Exact Backward Induction as DP)**
  - **MDP Setup**: The game is a finite-horizon deterministic MDP. States are game nodes (including turn player), actions are {grab, pass}. The opponent is part of the environment dynamics; their policy is fixed and known (rational optimizer).  
  - **Value Function Definition**:  
    - \(V_i(s)\): Expected return for player \(i\) from state \(s\), assuming both players act optimally.  
    - Terminal state \(s_T\): Base case where values are the payoffs (grab executed).  
  - **Bellman Backup**:  
    For a state \(s\) where player \(i\) acts:  
    \[
    V_i(s) = \max_{a \in \{grab, pass\}} \left[ R_i(s, a) + \gamma \cdot V_i(s') \right]
    \]  
    - If \(a = \text{grab}\): Immediate reward \(R_i\) (large share), opponent gets \(R_j\) (small share), game ends.  
    - If \(a = \text{pass}\): Transition to \(s'\) (next player's turn), \(\gamma=1\) (no discount).  
  - **Backward Induction**:  
    - Start recursion from terminal node \(s_T\):  
      \[
      V_i(s_T) = R_i(s_T, \text{grab}) \quad (\text{forced grab})
      \]  
    - At penultimate node \(s_{T-1}\) (player \(j\)'s turn):  
      \[
      V_j(s_{T-1}) = \max \{ R_j(\text{grab}), \underbrace{V_j(s_T)}_{\text{player } i \text{ grabs at } s_T} \}
      \]  
      Since \(R_j(\text{grab}) > V_j(s_T)\) (by game design), player \(j\) grabs.  
    - Recursively, at \(s_0\) (player 1's turn):  
      \[
      V_1(s_0) = \max \{ R_1(\text{grab}), V_1(s_1) \}
      \]  
      But \(V_1(s_1)\) is the value when player 2 grabs immediately at \(s_1\) (leaving player 1 worse off), so player 1 grabs at \(s_0\).  
  - **Key Insight**:  
    Common knowledge of rationality (CKR) is encoded as **known opponent policy** (always takes the Bellman-optimal action). The recursion collapses to the first node.  

  ---

  #### **2. \(k\)-Step Lookahead with Bootstrapped Value Function**  
  - **Partial Model**: Agent has limited horizon \(k\). Beyond \(k\) steps, bootstrap using a learned \(V_\theta(s)\).  
  - **Policy Execution**:  
    At state \(s_t\), player \(i\):  
    1. Unrolls a \(k\)-step search tree (including opponent moves modeled via their known policy).  
    2. At leaf nodes \(s_{t+k}\), uses \(V_\theta(s_{t+k})\) to estimate future returns.  
    3. Backs up values to \(s_t\) via Bellman:  
       \[
       \hat{V}_i(s_t) = \max_a \left[ R_i(s_t, a) + \gamma \cdot \text{rollout}(s', k-1) \right]
       \]  
       where \(\text{rollout}\) uses opponent policy for their turns.  
  - **Bootstrapped Paradox**:  
    - If \(k\) is small (e.g., \(k=1\)):  
      \[
      \hat{V}_i(s_t) = \max \{ R_i(\text{grab}), V_\theta(s_{t+1}) \}
      \]  
      - If \(V_\theta(s_{t+1})\) is **optimistic** (e.g., learned from cooperative play), \(\hat{V}_i\) favors **pass**.  
      - If \(V_\theta(s_{t+1})\) is **pessimistic** (e.g., learned from adversarial data), \(\hat{V}_i\) favors **grab**.  
    - **Dependence on \(V_\theta\)**:  
      The paradox vanishes if \(V_\theta\) encodes passing as high-value (e.g., from off-policy data where opponents pass).  

  ---

  #### **3. Mirror Version (Shared Policy Checkpoint)**  
  - **Setup**: Both players share weights \(\theta\). At inference, player \(i\) can **simulate** player \(j\)'s policy \(\pi_\theta\) exactly.  
  - **Recursion as Computation**:  
    - At state \(s_t\), player \(i\) computes:  
      \[
      \hat{V}_i(s_t) = \max_a \left[ R_i(s_t, a) + \gamma \cdot V_i(s') \right]
      \]  
      where \(s'\) is obtained by:  
      - If \(a = \text{pass}\): \(s' = \pi_\theta(s_{t+1})\) (simulate opponent's turn via \(\pi_\theta\)).  
    - **No hand-waving**: Player \(i\) computes \(V_i(s_{t+1})\) by directly evaluating \(\pi_\theta(s_{t+1})\) (which calls the same model).  
  - **Paradox Outcome**:  
    - If \(\pi_\theta\) is **converged to rationality** (via RL training), \(\pi_\theta(s_{t+1})\) outputs **grab** \(\forall t\), forcing player \(i\) to grab at \(s_t\).  
    - **Training Dynamics**:  
      During learning, if \(\pi_\theta\) initially passes (exploration), \(V_\theta\) may learn high values for passing, creating a **cooperative fixed point** that breaks backward induction.  

  ---

  ### Residue Report

  #### **Bucket 1: What Carried Over Exactly**  
  - **MDP formalism**: States, actions, Bellman backups map directly.  
  - **Backward induction**: Equivalent to exact value iteration on the full tree.  
  - **Terminal base case**: Directly mirrors RL finite-horizon recursion.  
  - **CKR as opponent policy**: Known rational policy \(\equiv\) environment dynamics.  
  - **Shared weights in mirror version**: Opponent simulation is literal forward pass.  

  #### **Bucket 2: What Fit Only After Bending**  
  - **\(k\)-step lookahead**:  
    - Bootstrapping \(V_\theta\) introduces **approximation error** absent in classical BI.  
    - BI assumes perfect knowledge of all nodes; RL relaxes this to partial search + learned value.  
    - **Bent**: The paradox dissolves if \(V_\theta\) is inaccurate or biased by data.  
  - **Self-play dynamics**:  
    - Classical BI assumes fixed rationality; RL training may converge to non-BI policies (e.g., tit-for-tat).  
    - **Bent**: Shared weights enable cooperative equilibria unseen in BI.  

  #### **Bucket 3: No Expression in Vocabulary**  
  - **Off-path beliefs**:  
    Classical BI requires rationality at **all nodes**, even those never visited. RL only observes **on-path data**.  
    - **Closest concept**: **Self-Confirming Equilibrium (SCE)**.  
      - Beliefs need only be correct *along the path of play*.  
      - Off-path deviations are unconstrained (e.g., player may believe opponent irrationally passes off-path).  
    - **Does it dissolve the paradox?**:  
      - **Yes**. SCE allows early passing if players believe opponents won't grab imminently.  
      - BI survives only if CKR holds off-path (unverifiable without data).  
  - **Real learned opponents**:  
    Your intuition is **correct**. Against a learned opponent:  
    - If the opponent's policy \(\pi_j\) has **not converged to rationality** (e.g., passes with probability >0), BI collapses.  
    - RL agents **bootstrap from data**, not axioms: If historical play shows late grabs, \(V_\theta\) encourages passing.  
    - **What’s missing**:  
      - Rationality is **not fundamental** in RL; it’s a learned property from data.  
      - BI paradox assumes **perfect rationality**; RL exposes this as a brittle prior.  

  ---

  ### Verdicts on Residue  
  1. **Off-path beliefs (SCE)**:  
     - **Missing in RL vocabulary**: Explicit off-path counterfactuals.  
     - **Puzzle was never sharp**: BI implicitly assumes observers can test off-path behavior (unrealistic). SCE is the real-world counterpart.  
     - **Resolution**: SCE dissolves the paradox by allowing BI-violating equilibria.  

  2. **Learned opponents break BI**:  
     - **Missing in vocabulary**: The **assumption of fixed rationality**. RL uses data-driven opponent models.  
     - **Puzzle was never sharp**: BI’s conclusion relies on an idealized opponent; RL shows this is empirically falsifiable.  
     - **Resolution**: Against real agents, BI only holds if training enforces rationality (e.g., via adversarial self-play).  

  ### Conclusion  
  The backward induction paradox is **sound** under its axioms (CKR, full knowledge) but **brittle** when:  
  - Knowledge is partial (\(k\)-step lookahead).  
  - Opponents are learned (data may support cooperation).  
  - Beliefs are path-dependent (SCE).  
  RL doesn’t "miss" anything; it **exposes** the paradox as a theoretical edge case. The collapse against learned agents isn’t a flaw—it’s a feature of moving from axioms to empiricism.
