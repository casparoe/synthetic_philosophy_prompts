  The user mentioned names like Temkin, Rachels, Broome, Parfit. I should correctly attribute Temkin's spectrum arguments and intransitivity, Rachels' spectrum with rotating axes, Broome on vagueness, and Parfit's Repugnant Conclusion as an analogy. But the user doesn't want citations, so integrate them without academic references.

