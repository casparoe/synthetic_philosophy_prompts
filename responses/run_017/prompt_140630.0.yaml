prompt: |-
  I'm teaching a 90-minute session on Lakatos to about 20 undergrads in a philosophy of science course, and I want them to *feel* why nobody working inside a research programme ever experiences its degeneration as a refutation -- it always just looks like one more awkward anomaly that some clever grad student will patch. Design me a game for that.

  Rough shape I have in mind (change it if it won't work): teams of 4-5 each declare a "hard core" of 2-3 claims they publicly pledge never to give up, plus a starting "protective belt" of auxiliaries. Over 5-6 rounds I hand out phenomenon cards. A team can register a sealed prediction before the reveal; if it hits, that's a novel fact and scores a progressive point. If a card contradicts them, they patch by adding an auxiliary to the belt, which scores nothing and costs a belt token. Everyone also gets one "monster-barring" card they can play to disqualify a phenomenon.

  The bit I most want your help designing: a rule that makes "there is no instant rationality" into something they're stuck under rather than a quote on a slide. Say -- a team may only abandon its hard core after two full rounds of patching with no successful novel prediction, and even then a "Lakatosian judge" (me) can grant a reprieve based only on the public record, never on which core is actually true.

  Give me concrete materials (including what goes on ~15 phenomenon cards), the scoring, a round-by-round timeline with no lecture up front and no Lakatos vocabulary until the debrief, and then a debrief that maps specific moments onto hard core vs protective belt, negative vs positive heuristic, and progressive vs degenerating problem shifts. Also: what will predictably go wrong the first time I run it (someone declares a hard core so vague it can't be hit, everyone just patches forever, the judge gets accused of favouritism) and how to handle each. And be honest about what the game can't reproduce -- especially that real appraisal of a programme takes decades, which 90 minutes necessarily compresses into nothing.
reasoning: |-
  We are designing a game to help students understand Lakatos's concept of research programmes, especially the idea that within a programme, anomalies are seen as puzzles to be solved by patching the protective belt rather than refuting the hard core.

  The game will have:
  - Teams of 4-5 students.
  - Each team declares a "hard core" (2-3 claims they pledge never to give up) and a starting "protective belt" (auxiliary hypotheses).
  - 5-6 rounds with phenomenon cards.
  - Teams can make sealed predictions before a phenomenon is revealed. If correct, they score a "progressive" point.
  - If the phenomenon contradicts their theory, they must patch by adding an auxiliary, which costs a "belt token" (each team starts with a limited number, say 3-5).
  - Each team gets one "monster-barring" card to disqualify a phenomenon (a one-time use).

  Key rule for "no instant rationality":
  - A team may only consider abandoning their hard core after two full rounds of patching without any successful novel prediction (i.e., two rounds in a row of only patching and no progressive points). Even then, they must petition the "Lakatosian judge" (instructor) who will decide based solely on the public record (what the team has done in the game) and not on which core is actually true. The judge can grant a reprieve (allowing the team to continue) or deny it (forcing them to abandon their hard core and join another team or sit out). The judge's decision should be based on the team's effort and ingenuity in patching, not the truth.

  Materials:
  - 15 phenomenon cards: These should be designed such that they can be interpreted in multiple ways and can be made compatible with different hard cores by adding auxiliaries. They should cover a range of scientific phenomena (physics, biology, psychology, etc.) and some should be ambiguous or surprising.

  Example of phenomenon cards (adjust to fit the context of the course and the hard cores chosen by teams):
  1. "A heavy object and a light object dropped from the same height hit the ground at the same time (in a vacuum)."
  2. "The orbit of Mercury precesses at a rate that does not match predictions based on Newtonian gravity and known planets."
  3. "When rats are given a new type of food and then become sick, they avoid that food in the future."
  4. "In a double-slit experiment, electrons produce an interference pattern even when sent one at a time."
  5. "The background radiation of the universe is almost uniform in all directions, with tiny fluctuations."
  6. "People who meditate regularly show increased gray matter density in brain regions associated with attention."
  7. "A particle is found that travels faster than light (if you want a controversial one)."
  8. "A study finds that a new drug cures a disease in 80% of cases but causes severe side effects in 20%."
  9. "In a remote tribe, children learn complex language without formal instruction."
  10. "A newly discovered planet orbits its star in the opposite direction to the star's rotation."
  11. "When two entangled particles are measured at a distance, their states are correlated instantaneously."
  12. "A fossil shows a creature with features of both birds and dinosaurs."
  13. "A metal rod expands when heated."
  14. "In a group of people, a contagious disease spreads faster than predicted by simple models."
  15. "A placebo works even when patients know it's a placebo."

  Scoring:
  - Novel prediction (sealed and correct): +3 points
  - Patching (adding an auxiliary when contradicted): 0 points, but costs 1 belt token.
  - Using the monster-barring card: 0 points, but saves a belt token (and the card is discarded).
  - Abandoning the hard core and joining another team: the team they join gets +1 point for each new member (as if they are absorbing a research programme), but the abandoning team loses all points and is out.

  Round-by-round timeline (90 minutes total):

  0. Introduction (5 minutes, no Lakatos vocabulary yet):
     - Form teams of 4-5.
     - Explain: "You are a group of scientists with a shared theory. Your goal is to defend your core ideas and score points by making successful predictions."
     - Each team picks a name and writes down:
          - Hard core: 2-3 non-negotiable principles (e.g., "All motion is caused by forces", "The mind is entirely physical", "Evolution occurs by natural selection").
          - Starting protective belt: 2-3 auxiliary hypotheses (e.g., "Friction opposes motion", "Mental states are brain states", "Mutations are random").
          - They get 3 belt tokens and one monster-barring card.

  1. Round 1 (5 minutes):
     - Teams are given 2 minutes to discuss and make a sealed prediction about the first phenomenon (if they think they can predict what the card says based on their theory).
     - Reveal the first phenomenon card. 
     - Teams that made a correct prediction get +3 points. 
     - Teams that are contradicted must patch by adding an auxiliary (writing it down) and spend one belt token. They get 0 points.
     - Teams can also choose to play their monster-barring card to disqualify the phenomenon (if they think it's invalid) and not patch, but they lose the card.

  2. Rounds 2-5 (5 minutes each, total 20 minutes):
     - Same as round 1, but with new phenomenon cards. 
     - After each round, teams update their protective belt if needed.

  3. Check for degeneration (after round 3 and after round 5):
     - After round 3: The judge (instructor) checks if any team has had two consecutive rounds of patching without a successful prediction (i.e., rounds 2 and 3). If so, they are put on "degeneration watch". They are not forced to abandon yet, but they are warned that if they go two more rounds without a prediction, they must petition the judge.
     - After round 5: Check again. Any team that has had two consecutive rounds of patching without a prediction (which could be rounds 4 and 5, or if they were already on watch, rounds 2-5 without a prediction in between) must petition the judge. The judge then decides (based on the public record: their patching efforts and creativity) whether to grant a reprieve (they continue) or force them to abandon.

  4. Round 6 (optional, if time) (5 minutes): Same as before.

  5. Final scoring and debrief (30 minutes):
     - Tally scores and announce the winner.
     - Then, the debrief: Map the game to Lakatos's concepts.

  Debrief structure:
  - First, ask the students: What was frustrating? What was fun? Did you ever feel like giving up your core? Why didn't you?
  - Then, introduce the vocabulary:
     - Hard core: the principles you pledged to never give up.
     - Protective belt: the auxiliaries you added to protect the hard core.
     - Negative heuristic: never question the hard core.
     - Positive heuristic: the strategy of making predictions and patching.
     - Progressive problem shift: when your theory leads to novel facts (scored points).
     - Degenerating problem shift: when you just patch without novel predictions (cost you belt tokens and led to degeneration).
     - Monster-barring: the one-time card to disqualify an anomaly.
  - Discuss specific moments from the game: 
     - "When team X faced phenomenon Y, they added Z to their belt. That's a protective belt adjustment."
     - "Team A made a novel prediction in round 2: that's progressive."
     - "Team B was on degeneration watch: they had two rounds without a prediction and then had to petition. The judge granted a reprieve because their patch in round 4 was particularly creative (even if it didn't lead to a prediction). That's like Lakatos's idea that there's no instant rationality and programmes can get out of degeneracy."
  - Finally, discuss the limitations of the game:
     - Real research programmes take years or decades to appraise; the game compresses it into a few rounds.
     - In reality, the distinction between hard core and protective belt is not always clear, and sometimes hard cores do change (but that's a scientific revolution, not within a programme).
     - The judge's role is artificial, but in real science, the community judges over time.

  What might go wrong and how to handle:

  1. Vague hard core: A team writes a hard core that is too vague to be falsified (e.g., "Everything is connected"). 
     - Prevention: In the setup, require that hard core claims must be specific enough to potentially conflict with some phenomena. As judge, you can reject a hard core that is too vague and ask for revision.

  2. Everyone just patches forever: If belt tokens are too many, teams never run out. 
     - Solution: Start with only 3 belt tokens. Also, the rule that they must petition after two consecutive patching rounds without a prediction forces them to face degeneration.

  3. Judge accused of favoritism: 
     - Prevention: The judge must base decisions solely on the public record (what they wrote down and when). Explain your reasoning publicly: "I grant a reprieve because team X's patch in round 3 was very creative and they made a novel prediction in round 1, so they have a track record." Also, you can have a simple rubric: if they have at least one progressive point in the past, they get a reprieve; if they have none and have been patching for two rounds, they might be forced to abandon.

  4. Not enough time: 
     - Run only 5 rounds and skip the optional round 6.

  5. Teams might not understand how to patch: 
     - Give an example before the game: "Suppose your hard core is that all swans are white. You see a black bird that looks like a swan. You might add an auxiliary: 'That black bird is not a true swan because it comes from a polluted environment.'"

  6. The phenomenon cards might not be compatible with some hard cores: 
     - Design the cards to be interpretable in multiple ways. Also, allow teams to be creative in their patches.

  What the game can't reproduce:
  - The timescale: real programmes take decades.
  - The complexity: real science involves experiments, data collection, and mathematical modeling, not just verbal patches.
  - The role of the scientific community: in reality, multiple programmes compete and the community judges over time.

  With these in mind, the game should help students feel the tension of protecting the hard core and the excitement of making a novel prediction, while understanding that degeneration is not immediately obvious.
answer: |-
  ### Lakatos Research Programme Game: "Core Defense"

  **Goal:** Make students experience the "protective belt" mentality—where anomalies feel like solvable puzzles, not refutations—and the pain of "no instant rationality" in judging a programme's degeneration.

  ---

  ### **Materials Needed**
  1. **Team Kits (per team):**  
     - 1 poster board (to display "Core" and evolving "Belt")  
     - 3 "Belt Token" chips (physical tokens, e.g., poker chips)  
     - 1 "Monster-Barring" card (a red index card labeled "MONSTER-BAR: Veto one phenomenon")  
     - Markers, sticky notes (for adding auxiliaries)  

  2. **Phenomenon Cards (15 total, examples below):**  
     - *Design:* Each card describes a simple, observable event. 60% contradict common assumptions, 30% are ambiguous, 10% support popular theories.  
     - **Sample Cards:**  
       1. *"Metal boats float, but a metal coin sinks in water."*  
       2. *"A plant grows toward light even when rotated 180° daily."*  
       3. *"People in cold climates get more colds, but those exposed to cold labs don’t."*  
       4. *"All swans observed in Country X are white."*  
       5. *"A rocket accelerates in space with no air to push against."*  
       6. *"Mice fed only sugar live longer than mice fed vegetables."*  
       7. *"A compass needle points north even when shielded by wood."*  
       8. *"Some people recall memories after head injuries that never happened."*  
       9. *"Heavy objects fall faster than light ones in air, but not in a vacuum."*  
       10. *"Children not vaccinated for Disease X get sick less than vaccinated ones."*  
       11. *"An apple thrown sideways falls at the same speed as one dropped straight down."*  
       12. *"A new island forms in the ocean with no life, but identical species appear within a year."*  
       13. *"People who sleep 4 hours perform better on tests than those who sleep 8 hours."*  
       14. *"Boiling water freezes faster than cold water in Antarctica."*  
       15. *"A magnet loses its pull when heated, but regains it when cooled."*  

  3. **Judge Materials:**  
     - Timer, scoreboard, "Lakatosian Judge" sign.  
     - Rubric for reprieves (see "Degeneration Rule" below).  

  ---

  ### **Rules & Scoring**  
  - **Hard Core:** 2–3 specific, falsifiable claims (e.g., "All life requires water," "Force equals mass × acceleration").  
  - **Protective Belt:** Auxiliary hypotheses explaining anomalies (e.g., "Floating depends on shape, not density").  
  - **Novel Prediction:** Teams submit a sealed prediction before a phenomenon is revealed. **+3 points** if correct.  
  - **Patching:** If contradicted, add an auxiliary to the belt. **0 points**, costs **1 belt token**.  
  - **Monster-Barring:** Play the card to veto a phenomenon. **0 points**, card discarded.  
  - **Degeneration Rule (Key Mechanic):**  
    - A team can **only propose abandoning their hard core** after **two consecutive rounds of patching without a successful prediction**.  
    - Even then, the Lakatosian Judge (you) decides via **public-record-only reprieve**:  
      - Grant reprieve if the team’s patches are "intellectually resourceful" (e.g., creative, testable).  
      - Deny reprieve if patches are "ad hoc" (e.g., arbitrary, untestable, or lazy).  
      - **Judge must ignore which core is "true"**—only assess effort/ingenuity.  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Setup (10 mins):**  
  - Split into teams of 4–5. No Lakatos terms yet!  
  - Teams declare:  
    - **Hard Core:** 2–3 claims (e.g., "Light travels in straight lines," "Memory is perfect recall").  
    - **Starting Protective Belt:** 1–2 auxiliaries (e.g., "Light bends near massive objects," "Memory errors are from external interference").  
  - Give each team their kit.  

  **Rounds 1–6 (8 mins/round, 48 mins total):**  
  1. **Phenomenon Reveal (1 min):** Draw a card, read aloud (e.g., "A plant grows toward light even when rotated 180° daily").  
  2. **Prediction Phase (2 mins):** Teams may submit a **sealed prediction** (e.g., "The plant will grow crooked").  
  3. **Resolution (1 min):** Reveal the full phenomenon. Teams with correct predictions score **+3**.  
  4. **Contradiction/Patching (3 mins):**  
     - Contradicted teams **must patch** (add an auxiliary) and lose **1 belt token**.  
     - They can **monster-bar** instead (play card, no token loss).  
  5. **Judge Check (1 min):** After Rounds 3 and 5, identify teams in "degeneration" (two straight patching rounds with no points). Warn them.  

  **Final Round & Abandonment (7 mins):**  
  - After Round 6, teams in degeneration (no prediction in Rounds 5–6) petition to abandon core.  
  - Judge rules on reprieves publicly (e.g., "Reprieve granted: Team A’s ‘temporary memory corruption’ patch was testable").  
  - Teams denied reprieve "die" (sit out) and lose half their points.  

  **Scoring & Winner (5 mins):**  
  - Tally: Prediction points + 1 point per remaining belt token.  
  - Highest score wins.  

  ---

  ### **Debrief (20 mins)**  
  **Start with Reflection (5 mins):**  
  - "How did it feel when your core was threatened? Did anomalies feel like refutations or puzzles?"  
  - "Why did you keep patching even when it cost tokens?"  

  **Map Game → Lakatos Concepts (10 mins):**  
  - **Hard Core vs. Protective Belt:**  
    - *Example:* "When Team X said ‘Metal floats if spread thin,’ they shielded their core (‘Density determines sinking’)."  
  - **Negative Heuristic (protect core):**  
    - "You pledged never to abandon your core—that’s the negative heuristic. Patching was your first instinct."  
  - **Positive Heuristic (build predictions):**  
    - "Scoring points for predictions mirrors progressive shifts—e.g., predicting a plant’s growth direction."  
  - **Degenerating Problem Shift:**  
    - "Team Y patched twice with no points—that’s degeneration. But I granted a reprieve because their ‘gene mutation’ patch had potential."  
  - **Monster-Barring:**  
    - "Vetoing a phenomenon is like dismissing inconvenient data—e.g., ‘That experiment was flawed!’"  

  **Limitations Discussion (5 mins):**  
  - "What couldn’t we replicate?"  
    - **Timescale:** Real programmes take decades; our 6 rounds compress too much.  
    - **Motivation:** Real scientists have emotional/funding stakes we can’t simulate.  
    - **Truth vs. Survival:** In reality, true cores may die; in the game, clever patching can save weak cores.  
    - **Community Judgment:** Real programmes are judged by thousands of scientists, not one judge.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem: Vague Hard Core**  
     - *e.g., "Everything is energy" can’t be contradicted.*  
     - **Fix:** In setup, reject cores that aren’t falsifiable. Require claims like "Water freezes at 0°C" or "All mental illness is chemical."  

  2. **Problem: Eternal Patching**  
     - *Teams ignore degeneration by spamming patches.*  
     - **Fix:** Belt tokens are scarce (only 3). Judge denies reprieves for lazy patches (e.g., "Magic did it").  

  3. **Problem: Judge Favoritism**  
     - *Teams accuse bias in reprieves.*  
     - **Fix:** Use a public rubric. Example reprieve criteria:  
       - ✅ "Patch proposes a testable experiment."  
       - ✅ "Patch references existing belt auxiliaries."  
       - ❌ "Patch is circular (e.g., ‘It sinks because it’s heavy’)."  
       - **Always say:** "I rule based on your posters, not truth."  

  4. **Problem: Anomaly Overload**  
     - *Teams get overwhelmed by contradictions.*  
     - **Fix:** Include 2–3 "friendly" phenomena (e.g., Card 4 for a "All swans are white" core).  

  5. **Problem: Time Crunch**  
     - **Fix:** Skip Round 6; end after Round 5. Focus debrief on "stuckness."  

  ---

  ### **Why This Works**  
  - **"No Instant Rationality" Embodied:** The 2-round delay forces teams to sit with accumulating anomalies. The judge’s reprieve makes them *feel* how real programmes get "extra chances" based on effort, not truth.  
  - **Emotional Resonance:** Students will *frustratingly* defend cores through absurd patches—just like real researchers.  
  - **Debrief Bridges Theory:** Specific game moments (e.g., a team patching Card 15 with "Heat creates chaos fields") become visceral examples of Lakatos’ ideas.  

  **Final Tip:** Run it fast and chaotic—embrace the messiness. The more students groan at patching, the more they’ll grasp Lakatos.
