  ### **Residue Report**
  **First: Why (1) and (4) are not identical**  
  (1) and (4) both reduce to "non-detection bounds \(R \cdot P_{\text{det}}\)", but they differ in their **treatment of the selection function**:  
  - (1) makes a **strong assumption about signal morphology** (settlement is detectable with \(P_{\text{det}} \approx 1\)) and thus interprets the bound as tight on \(R\).  
  - (4) argues that **morphology is poorly characterized**, so \(P_{\text{det}}\) is likely small and the bound is weak.  
  Their conflict stems from priors on \(P_{\text{det}}\): (1) assumes high detectability for a specific morphology, while (4) emphasizes uncertainty. Separating them resolves the conflict:  
  - (1) is a claim about the **posterior given a morphology assumption** (high \(P_{\text{det}}\) → low \(R\)).  
  - (4) is a claim about the **selection function uncertainty** (low \(P_{\text{det}}\) possible → \(R\) unconstrained).  
  In your terms, (1) is an inference conditional on fixed morphology, while (4) marginalizes over morphology uncertainty. The debate arises because (4) challenges (1)'s morphology assumption.

  **Second: Self-location and observer inclusion**  
  Your vocabulary lacks resources for self-location (being inside the sample). Positions (2) and (3) require it:  
  - **What exists**: Hierarchical models can condition on "at least one detection" (us), and posterior predictive checks can simulate our observed data (e.g., \(T_{\text{now}}\)) under the model. Sampling weights might adjust for anthropic bias (e.g., weighting by the inverse of the detection probability for civilizations like us).  
  - **Gaps**: No standard tools for "typicality" (e.g., Copernican principle). Self-location introduces a new parameter: our "observation time" \(T_{\text{now}}\). This changes (2)'s conclusion: without self-location, the non-detection pessimistically implies hard steps ahead; with it, conditioning on our existence after \(k\) steps favors \(\prod_{i=1}^k \lambda_i\) being atypically high, potentially offsetting pessimism. For (3), adding self-location (anthropic weighting) is essential to infer we are early.  
  - **Verdict**: Self-location is a genuinely new ingredient. Adding it makes (2) and (3) more nuanced but doesn't resolve them—it introduces model dependence (e.g., how to weight observer moments).

  **Third: Smuggled assumptions flagged**  
  I avoid smuggling by marking assumptions explicit in translations. Key cases:  
  - **Discrete events with known morphology**: Assumed in (1) and (3) (settlement is detectable), but (4) rejects this. Doing real work in (1).  
  - **Static population**: Not assumed; temporal dynamics handled by integrating \(R(t)\) over time (e.g., in (1) and (3)).  
  - **Noise well-characterized**: Assumed in all (null result is not due to noise); critical for tight bounds.  
  - **Survey designed vs. stumbled**: Not assumed; selection functions can be empirical (e.g., in (4), \(P_{\text{det}}\) is based on actual searches).  
  - **Rate vs. historical fact**: All treat \(R\) as a rate, but (2) blends it with a specific realization (our existence). The "single historical fact" (e.g., are we alone?) requires Bayesian model comparison (e.g., \(R=0\) vs. \(R>0\)).

