  ### **Position (4): Barely-Looked Resolution**
  **Restatement**: The survey's selection function \(P_{\text{det}}\) is highly uncertain and likely very small because only a tiny fraction of possible signal morphologies (e.g., EM frequencies, technosignature types) have been probed. The effective survey volume \(V_{\text{eff}}\) is small when marginalized over morphology space. The null result only weakly constrains \(R \cdot P_{\text{det}}\), and since \(P_{\text{det}}\) could be \(\ll 1\) (e.g., due to unanticipated morphology or short detection windows), \(R\) could be high. In Bayesian terms, the posterior for \(R\) is prior-dominated because the likelihood (non-detection) is uninformative when \(P_{\text{det}}\) is highly uncertain.

  - **Translates cleanly**: Direct application of the core principle: non-detection bounds \(R \cdot P_{\text{det}}\), and \(P_{\text{det}}\) depends on morphology assumptions. Malmquist-type bias if detectability correlates with morphology.
  - **Bent/re-expressed**: Nothing—this is native to your vocabulary. Completeness corrections are undefined without morphology assumptions.
  - **Cannot be said**: Quantification of "how much" of morphology space was searched; the vocabulary handles uncertainty but not fractional coverage.

