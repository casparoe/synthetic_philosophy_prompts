answer: |-
  Here’s a structured draft proposal addressing your core arguments, designed to force clarity and withstand interdisciplinary scrutiny. I’ve focused on precision, stakes, and fallback positions as requested.

  ---

  **Dissertation Proposal: Unbundling Equality’s Hidden Variables**  
  **Core Question:** *Can the "currency" of egalitarian justice be specified independently of the conversion function that maps resources to that currency, and what are the implications of their interdependence for temporal inequality assessments?*

  ### Why This Question? The Hidden Decisions
  The standard "equality of what" debate (welfare/resources/capabilities) obscures two foundational choices:  
  1. **The Conversion Function**: Every currency requires a rule for converting material goods into the valued metric (e.g., welfare, functionings). This is not ancillary—it *defines* the currency.  
     - **Resources views** claim neutrality ("equal bundles, individual conversion") but implicitly rely on a market-based conversion (e.g., income → opportunities). They ignore how systemic disadvantage (e.g., discrimination) warps conversion efficiency.  
     - **Capabilities** equalize "what people can do/be," but merely shifts the conversion problem to threshold-setting (which functionings matter?) without solving it.  
     - **Welfare views** (subjective/objective) collapse when preferences adapt to deprivation (e.g., contented oppressed groups). Their conversion function assumes stable preferences, which injustice undermines.  
     **Thesis**: Currency *is* conversion. We cannot pick "welfare" without specifying *whose preferences* (actual? idealized?) and *under what conditions* conversion occurs.  

  2. **The Temporal Unit**: Should we equalize over whole lives, fixed periods, or another timeframe? This choice is orthogonal to currency but radically changes policy prescriptions.  
     - **Ana vs. Ben**: Whole-life equality masks early suffering; periodic equality ignores compensation across time. Neither view resolves whether later flourishing "repays" early deprivation—a question untouched by currency debates.  

  ### Proposed Approach: Testing the Collapse and Its Implications
  **Core Argument**: The currency/conversion collapse reveals that egalitarian theories are distinguished less by *what* they value than by *how* they define the conversion rules. This reframing:  
  - Explains debates (e.g., Sen-Dworkin): They’re arguing about conversion, not currency.  
  - Exposes circularity: Defining "just institutions" for counterfactual conversion *presupposes* a theory of distribution. This is a feature, not a bug—it forces explicit baseline assumptions.  
  - Makes temporality actionable: By decoupling temporal unit from currency, we enable new policy analyses (e.g., is lifespan inequality worse than periodic deprivation?).

  **Method & 12-Month Plan**  
  *(3 chapters + 1 standalone paper; empirical work limited to analytical models)*  
  1. **Chapter 1 (Months 1–4): Currency as Conversion**  
     - Demonstrate that all three currencies implicitly rely on contested conversion rules.  
     - *Key test*: Can any theory specify its currency *without* describing conversion? If yes, thesis fails.  
     - *Fallback if thesis weakens*: Shift to taxonomy of conversion functions within existing theories.  

  2. **Chapter 2 (Months 5–8): Temporality as Independent Variable**  
     - Show that temporal unit choice (synchronic/diachronic) cross-cuts currency commitments.  
     - Model Ana/Ben cases: Map how policy judgments change under welfare/resources/capabilities when temporal scope varies.  
     - *Cut if slow*: Detailed capability thresholds (focus on welfare/resources for contrast).  

  3. **Chapter 3 (Months 9–12): Counterfactual Conversion as Diagnostic Tool**  
     - Argue that "conversion under just institutions + reflectively chosen preferences" isn’t a new currency but a *test* for coherence.  
     - Apply it: Does it resolve adaptive preferences? Does it expose circularity? (Yes, but productively.)  
     - *Standalone paper*: "Ana, Ben, and the Debt of Time: Can Later Flourishing Compensate for Early Suffering?" (Journal-targeted).  

  ### Why Not Alternatives?
  - **Survey/Theory Rehash**: The hidden variables framework generates *new* questions (e.g., temporality) and diagnoses stalemates.  
  - **Empirical Pick-a-Metric**: Premature—without theorizing conversion, metrics encode unconscious biases (e.g., GDP as proxy for welfare).  
  - **Capability Operationalization**: Replicates the threshold problem; this project explains *why* that problem is unavoidable and how to navigate it.  

  ### Failure Conditions & Fallback
  - **Mid-Year Failure Evidence**: If a theory cleanly separates currency specification from conversion mechanics (e.g., resourcism via brute "bundle" definition), the core thesis fails.  
  - **Fallback Project**: *"Temporal Units in Egalitarianism: A Policy Taxonomy"* — A pragmatic guide comparing period-based vs. whole-life equality for economists, with welfare-tradeoff models.  

  ### Deliverable for Policymakers
  A **decision tree** for selecting comparison rules:  
  1. **Diagnose the disadvantage**: Is it resource-based (e.g., low income), conversion-constrained (e.g., disability in inaccessible space), or temporal (e.g., episodic illness)?  
  2. **Set the temporal frame**: Is compensation across lifetimes possible? If not, prioritize synchronic equality.  
  3. **Choose conversion**: Use counterfactuals ("what *could* they do with these resources under fair conditions?") to avoid penalizing adaptive resilience.  

  ---

  **Why This Works for Your Committee**  
  - **Economists**: Gets concrete fast. The temporal models (Ana/Ben) offer quantifiable tradeoffs. The decision tree is a tool, not philosophy.  
  - **Philosophers**: Attacks foundational assumptions (conversion’s role) without reinventing currencies. The circularity in "just institutions" becomes a critical lever.  
  - **Shared Win**: Forces both sides to see the other’s blind spots—economists on hidden normativity in metrics, philosophers on operational rigidity.  

  Argue with this. Where does it misrepresent your intent? Where is the "counterfactual conversion" still too slippery? Let’s tighten it.
