answer: |-
  ## Proposal: The Temporal and Identity Indeterminacy of Omissions in Causation

  **1. The Question: The When and Which of Omissions (Approx. 250 words)**

  This chapter asks a precise, under-explored question central to understanding causation by omission: **How are the temporal boundaries and specific identity of an omission determined, given that an omission (like failing to water plants) is not an event occurring in spacetime but an absence of action?** Unlike actions or positive events, which possess inherent temporal properties (e.g., the watering began at 2 PM and ended at 2:10 PM), omissions seem fundamentally indeterminate in their temporal extent. There is no intrinsic "moment of omission." Furthermore, identifying *which* omission occurred is problematic: is "failing to water the plants on Monday" a distinct omission if the plants are watered on Tuesday and survive? Or is the relevant omission only "failing to water them *in time*"? The core hypothesis is that **the temporal boundaries ("when") and the individuation ("which omission") of an omission are not fixed by any intrinsic properties of the absence itself, but are instead determined extrinsically by the practical, normative, or explanatory context in which the causal question arises.** This context-sensitivity, rather than a metaphysical failing of absences *per se*, underlies many puzzles and objections regarding omissions as causes.

  **2. Why Existing Positions Leave the Question Open (Approx. 350 words)**

  The substantial literature on omissions as causes primarily focuses on the fundamental *feasibility* of absence-causation. Defenders argue that absences can be difference-makers within causal models or satisfy counterfactual dependence, while critics often object based on absences lacking location, energy transfer, or intrinsic causal powers. This debate, however, largely presupposes a specific omission as already identified and temporally bounded for analysis. It takes for granted *which* omission is under discussion (e.g., "the failure to water") and implicitly assumes *when* it occurred (e.g., "during the week of absence"), without scrutinizing how that identification and temporal framing is achieved.

  Interventionist approaches represent omissions by setting a variable to a "non-occurrence" or default value. While powerful, this methodology implicitly encodes a *stipulated* temporal window and level of description. Setting "Watering(Monday) = No" defines both *which* omission (non-watering on Monday) and *when* it occurred (Monday), by fiat. This sidesteps the crucial question of *why* that particular temporal slice (Monday) or that level of description (daily watering checks) is appropriate, rather than, say, "Watering(Week) = Partial" or focusing on the final critical moment before death. Similarly, debates about "causing versus allowing" or legal doctrines imposing liability only for omissions where a duty existed, often focus on the *significance* of the omission rather than the prior step of *defining* the omission's temporal and identity parameters. The core indeterminacy – *how* we fix the "when" and "which" – remains unaddressed as a distinct problem within these established frameworks.

  **3. What I Would Do, and In What Order (Approx. 350 words)**

  The chapter will systematically develop and test the hypothesis of extrinsic context-dependence for the temporal and identity properties of omissions.

  1.  **Articulating the Indeterminacy (Months 1-2):** Precisely define the problem using cases like the plant-watering scenario and analogous examples (e.g., failing to brake causing an accident, a guard's omission allowing an intrusion). Analyze the lack of intrinsic temporal markers (start/end points, duration) and the challenges in individuating omissions (e.g., is "not watering Monday" one omission if Tuesday watering occurs? Is it the same omission as "not watering sufficiently before death"?). Contrast this sharply with positive events.
  2.  **Diagnosing Existing Debates (Months 3-4):** Re-examine classic objections against omissions as causes (e.g., "no mechanism," "no location," "queerness"). Argue that these critiques often conflate the lack of intrinsic spatio-temporal properties with a lack of causal relevance *simpliciter*. Demonstrate how the "no mechanism" worry often reduces to the "no intrinsic temporal extent" problem.
  3.  **Analyzing Interventionism (Months 5-6):** Critically examine how interventionist causal models represent omissions. Argue that specifying a variable (e.g., Watering=Yes/No) inherently involves selecting a *temporal granularity* (e.g., per day, per hour, per "opportunity") and a *descriptive category* (e.g., Watering vs. Nutrient-Supply). This selection resolves the indeterminacy by stipulation, making explicit the context-dependence built into the model's setup. Explore the implications for model choice and interpretation.
  4.  **Exploring Legal and Normative Implications (Months 7-8):** Apply the framework to the distinction between "causing" and "allowing" harm, and to legal doctrines requiring a pre-existing duty for omission liability. Argue that these concepts function, in part, to *define the relevant omission context*. The duty (e.g., a contract to water plants weekly) specifies *which* omissions matter (failing a weekly duty) and implicitly sets a *temporal frame* (the duty period). The causing/allowing distinction may track whether the context defines the omission relative to a baseline expectation of intervention.
  5.  **Synthesis and Implications (Month 9):** Summarize how context resolves indeterminacy. Discuss implications for metaphysics (recasting debates about "causal relata"), methodology in causal modeling (highlighting the significance of variable selection/granularity), and normative practices like assigning responsibility.

  **4. What Counts as Success and Failure (Approx. 250 words)**

  *   **Success:** The project succeeds if it convincingly demonstrates that:
      1.  Omissions inherently lack intrinsic temporal boundaries and clear criteria for individuation.
      2.  This indeterminacy is consistently resolved by contextual factors (explanatory aims, normative frameworks, modeling choices).
      3.  Recognizing this context-dependence provides a satisfying explanation for persistent metaphysical puzzles (e.g., the "no mechanism" intuition) by reframing them.
      4.  It offers a novel and illuminating perspective on how interventionist models handle omissions and on the function of concepts like "duty" or "allowing" in legal/normative reasoning about omissions. Success means the chapter establishes context-dependence as a crucial, previously underexplored dimension essential for a full understanding of causation by omission.
  *   **Failure:** The project fails if:
      1.  It cannot establish that the temporal/identity indeterminacy of omissions is genuine and distinct from general problems of event individuation applied to absences.
      2.  It turns out that omissions *can* be plausibly assigned intrinsic temporal properties or individuation criteria after all (e.g., based on opportunities, decisions, or counterfactual dependencies alone, without contextual input).
      3.  The proposed context-dependence fails to adequately explain the targeted metaphysical puzzles or to provide fresh insight into interventionist models or legal/normative distinctions. If omissions fundamentally align with events in their temporal and identity conditions, or if context proves irrelevant, the core hypothesis would be sunk.

  **5. Why This Angle Rather Than the Obvious Alternatives (Approx. 200 words)**

  The obvious alternatives are re-engaging the well-trodden debate about *whether* absences can be causes, or focusing solely on normative factors like duties. This project avoids the former by accepting that omissions *can* be causal difference-makers, but arguing that *how* we identify and temporally locate the specific omission doing the work is the critical, overlooked step. It avoids reducing the issue purely to normativity by showing how the metaphysical indeterminacy necessitates *some* contextual parameter-setting, even in purely descriptive or scientific causal models (like interventionism), not just in legal/moral contexts. This angle uniquely bridges metaphysics (the nature of omissions), methodology (how we represent them in causal models), and normative practice (how we assign responsibility for them), by pinpointing the extrinsic determination of their defining features – their "when" and "which" – as the unifying thread. It offers a new lens on old problems rather than rehashing entrenched positions.
