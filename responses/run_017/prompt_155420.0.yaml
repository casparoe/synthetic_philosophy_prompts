  The key requirement is speaker-state agnosticism, which forces reliance on prompt and objective features. This excludes intent-based accounts. The biggest conflict is hearer-invariance vs. reasonable implication. The solution is to use standard implicatures based on shared context. The requirement doing the most heavy lifting is speaker-state agnosticism. 

  So the spec must define lying as a false assertion (literal falsehood), misleading as literally true but generating a false implication through standard pragmatic means (based on common knowledge), and both require that the prompt's instructions regarding truthfulness were violated, indicating indifference. Errors are when the output is false but the prompt was followed (e.g., retrieval failed). But if the prompt wasn't followed, leading to falsehood, that's lying. Omissions are misleading if the prompt requires completeness. 

  Hard cases: playing along with false presuppositions. If the answer doesn't correct a false presupposition, it's misleading. If it asserts something false based on that, it's a lie. But the correction part might be implied by the prompt. If the prompt says "correct misconceptions," then omission is misleading. Otherwise, maybe not. 

  So the requirements:

  Non-negotiables: 1-5 as above. Debatable: whether lies require violation of prompt. Some might argue false assertion alone is lie, but without intent, it's fuzzy. Here, prompt violation indicates indifference, making it dishonest. So include that. 

