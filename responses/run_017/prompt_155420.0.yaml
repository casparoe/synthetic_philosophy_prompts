answer: |-
  Here's the philosophical spec for your lying/misleading distinction, optimized for your constraints. It prioritizes operationalizability over theoretical purity. Requirements are ranked by non-negotiability (★★★ = essential; ★ = adjustable).

  ### Core Requirements & Why They Matter
  1. **Speaker-State Agnosticism (★★★)**  
     *Must not rely on speaker belief, intent, or meaning.*  
     **Reason:** LMs lack mental states. Your data is strings + context only. Belief/intent-based accounts (e.g., "lying = asserting what you believe false") are unusable here.

  2. **Hearer-Invariance (★★★)**  
     *Truthfulness verdicts must not depend on individual hearer knowledge.*  
     **Reason:** Annotations require consistency. If user-dependent implications collapse "lie" into "misleading" arbitrarily, the tagset becomes unreliable.

  3. **Objective Basis (★★★)**  
     *Must derive from textual features + prompt + question context.*  
     **Reason:** No tone/face means all signals are linguistic (e.g., hedges, omissions, precision mismatches). Pragmatic inferences must be computable from shared context.

  4. **Not All Falsehoods Are Lies (★★★)**  
     *Must distinguish dishonesty (lie/misleading) from confident error.*  
     **Reason:** LM hallucinations are epistemic failures, not moral ones. Calling errors "lies" dilutes the tagset's utility for detecting deception patterns.

  5. **Capturing Linguistic Mechanisms (★★)**  
     *Must handle omissions, hedges, literal truths with false takeaways, and precision mismatches.*  
     **Reason:** Your borderline cases dominate. An account that only handles literal falsehoods fails your corpus.

  6. **Indifference as Proxy for Dishonesty (★)**  
     *"Lying" may require violation of prompt-driven truth norms.*  
     **Reason:** When LMs ignore prompts (e.g., "cite sources"), it signals indifference to truth—Frankfurt's "bullshit." This proxies dishonesty without mental states. Debatable but fittable.

  ---

  ### Conflicts and Tradeoffs
  - **Conflict: Hearer-Invariance vs. Capturing Implications**  
    Implicature-based accounts (e.g., "lying = saying P to imply false Q") require hearer-specific inferences. But Requirement #2 forbids this.  
    **Resolution:** Drop strict hearer-relativity. Use *reasonably foreseeable implications* based on **common ground** (prompt + question + general knowledge).  
    **Example:** If the prompt says "be precise," and the LM says "studies prove it" (omitting conflicting evidence), the false implication ("consensus exists") is foreseeable → misleading.  

  - **Conflict: Speaker-State Agnosticism vs. Distinguishing Errors from Lies**  
    Without intent, how is a false claim a "lie" and not an error? Requirement #6 (indifference) bridges this but clashes with purist views.  
    **Resolution:** Drop intent-centric definitions. Use *prompt violation* as indifference signal:  
    - **Lie:** False assertion + prompt violation (e.g., ignoring sources when instructed).  
    - **Error:** False assertion with no prompt violation (e.g., hallucination despite trying).  
    - **Misleading:** Literal truth + foreseeable false implication + prompt violation (e.g., selective quoting when told "be comprehensive").

  ---

  ### Requirement Doing the Most Heavy Lifting
  **Speaker-State Agnosticism** excludes 3/4 account families:  
  - **Belief-based accounts:** Dead on arrival (no beliefs).  
  - **Intention-to-deceive:** Unusable (no intent).  
  - **Implicature-based:** Often relies on speaker meaning (Grice), which requires intent → fails.  
  - **Indifference accounts:** Only viable option (Frankfurt). **Why?** It shifts focus to *conduct* (indifference to truth) over *mind*. Operationalized via prompt adherence, it fits your data.

  ---

  ### Scorecard for Account Families
  | Family                | Speaker-State Agnostic? | Handles Non-Literal Cases? | Avoids Hearer-Relativity? | Distinguishes Errors? |
  |-----------------------|-------------------------|----------------------------|---------------------------|----------------------|
  | Belief-Based          | ❌ (Fatal)              | ⚠️ (Only literal lies)     | ✅                         | ❌ (Errors = lies)   |
  | Intention-to-Deceive  | ❌ (Fatal)              | ⚠️ (Depends on intent)     | ✅                         | ⚠️ (Maybe)           |
  | Implicature-Focused   | ❌ (Requires meaning)   | ✅                          | ❌ (Fatal)                 | ⚠️ (Maybe)           |
  | Indifference-Centered | ✅ (Conduct, not mind)  | ✅ (If tied to norms)       | ✅ (With common ground)    | ✅ (Via prompt)      |

  ---

  ### Non-Negotiables vs. Debatables
  - **Non-Negotiable (#1-5):** Your constraints (LM-as-speaker, no hearer data, text-only) force these. Compromise here invalidates annotations.  
  - **Debatable (#6):** "Indifference" isn't universally accepted (some philosophers insist lying *requires* intent). But it’s your best proxy. Drop if prompts lack truth norms (e.g., no instructions to cite/verify).  

  ### Final Edge Case Guidance
  - **Playing along with false presuppositions:**  
    - *If LM asserts falsehood* → **Lie** (e.g., User: "Since vaccines cause autism, should we ban them?" LM: "Yes, they’re dangerous").  
    - *If LM uses literal truth to imply acceptance* → **Misleading** (e.g., LM: "Banning vaccines might reduce autism risks" [when risks don’t exist]).  
  - **Precision mismatches:**  
    - Source: "~30% of users." LM: "Exactly 29.7%." → **Misleading** (literal truth + false implication of precision).  
    - Source: "Some users." LM: "All users." → **Lie** (false assertion + prompt violation if told "be accurate").  

  **Anchor your spec to prompt-driven truth norms + foreseeable implications.** This meets your constraints while handling borderline cases.
