prompt: |-
  for a democratic theory reading group I have to write my position on the boundary problem on one page and then have everyone else attack it, so here it is in bullets. tell me whether it hangs together.

  1. who belongs in the demos should be settled by the coercion test: you get a say over a decision just in case you're one of the people the state will coercively enforce that decision against. so not the "everyone whose interests are affected" test — that one is hopeless, since everything affects everything, and it ends up giving the whole planet a vote on my city's bus timetable.

  2. but I also think the boundary can't be fixed from the armchair in a way that binds anyone. in practice who counts has to be decided by the people already inside, by majority vote, and there's no court or philosopher standing above them to overrule it.

  3. felon disenfranchisement is unjust, including for people currently serving prison sentences.

  4. it's fine that citizens who've lived abroad for fifteen-plus years lose the vote, even when they still file taxes and could fly back whenever they like.

  5. states do have a real if qualified right to decide who gets to immigrate.

  6. local things should be decided locally: a city's zoning vote should be taken by that city's residents only.

  7. voting age sixteen, no lower. someone has to draw a bright line and that's where I'd put it.

  8. and no proxy votes for kids — one person one vote means one person one vote.

  here's what I want from you. I already suspect 1 and 5 are in trouble together, because the people the state turns away at the border are precisely people it's coercing, but I can't tell whether that's a real problem or just wordplay on "coerce". I also want to know whether 1 and 2 can both be true — if inclusion is a matter of basic justice, how can the current majority be the ones who decide it, given they could just vote out whichever group threatens them? and 6 feels like it's quietly sneaking back in the affected-interests test I rejected in 1.

  but don't just flag everything as in tension. rank the problems by how bad they actually are, tell me which pairs only look like they clash (3 and 4 feel wrong together but maybe they're fine and I just can't say why), point out any extra commitment I'm relying on without having written it down, and then say what the single cheapest revision would be and what it costs me. don't start by telling me which bullet I should give up — I want to see what you think forces what.
reasoning: |-
  Okay, the user is preparing for a democratic theory reading group where they'll present their position on the boundary problem in bullet points, and then others will critique it. They want to know if their arguments hold together, especially pointing out tensions between points like 1 and 5, or 1 and 2. 

  First, I need to unpack their main arguments. Point 1 uses the coercion test to define the demos—only those subject to state coercion get a vote. They reject the affected interests test as too broad. Point 2 says the current majority should decide the boundary, not philosophers or courts. Points 3-8 cover specific cases like felon voting, expats, immigration, local decisions, voting age, and no proxy votes.

  The user already suspects tension between 1 and 5: if the state coerces immigrants by denying entry, shouldn't they get a vote? Also, between 1 and 2—if inclusion is about justice, how can the majority decide who's excluded? And point 6 might sneak in the affected interests test they rejected in point 1.

  I should assess each tension systematically. For 1 and 5, the coercion test could include potential immigrants if "coercion" applies to exclusion, but the user might intend coercion only for those already subject to the state's laws. That's a possible fix, though it risks being arbitrary. 

  For 1 and 2, there's a deeper conflict: if justice demands including the coerced, letting the majority exclude groups undermines that principle. The user might need to clarify that the coercion test sets a normative baseline, but practical inclusion is decided politically, accepting some injustice.

  Point 6 and the local focus might conflict with point 1's rejection of affected interests. If zoning affects nearby towns, why shouldn't they have a say? The user could argue that only city residents are directly coerced by local laws, but that might not hold if external effects are significant.

  Other points like 3 and 4 seem consistent—coercion applies to felons in prison (they should vote) but not to long-term expats (no coercion, so no vote). The bright-line voting age in point 7 is practical, though arbitrary.

  The cheapest fix might be refining the coercion test to specify it only applies to those already under the state's jurisdiction, excluding immigrants at the border. That saves point 5 but might seem ad hoc. Alternatively, embrace that coercion includes exclusion, but that forces rethinking immigration policy.

  The user's underlying commitment seems to be balancing normative principles (coercion test) with practical democratic authority (majority decides boundaries). They need to address how to handle when these clash, perhaps by accepting fallibility but setting moral constraints on exclusion.

  I'll rank the tensions: 1 vs. 5 is the most critical, then 1 vs. 2, followed by 1 vs. 6. Point 3 and 4 are compatible. The cheapest revision is clarifying coercion's scope, costing some philosophical neatness but preserving their framework.
answer: |-
  Your position is provocative and mostly coherent, but it contains three serious tensions and one inconsistency. Below, I rank the problems by severity, explain hidden commitments, and offer the cheapest revision. Crucially, **your core framework relies on an unstated distinction between *subjection to ongoing coercion* (triggering inclusion) and *exclusionary coercion* (not triggering inclusion)**—which needs explicit defense.

  ### Problem Rankings (High to Low Severity)
  1.  **1 vs. 5: The Border Coercion Contradiction (Critical)**
      -   **Conflict:** Your coercion test (1) demands voting rights for anyone the state coercively enforces decisions against. Border enforcement *is* state coercion (detention, deportation, violence). Thus, aspiring immigrants *are* coerced by the state’s exclusion—yet you deny them inclusion (5). This isn’t wordplay; it’s a direct clash.
      -   **Why it’s bad:** It undermines your core principle. If you exclude border coercion from the test, you need a principled reason—but "already inside" isn’t justified by *your* test, only by practicality (which you reject for normativity in 1).
      -   **Cheapest Revision:** Specify that the coercion test applies only to those *already under the state’s jurisdiction*.  
      -   **Cost:** You sacrifice philosophical neatness. Now your test excludes precisely the group (immigrants) whose coercion is most visible, making it seem ad hoc. You must defend why jurisdiction matters morally.

  2.  **1 vs. 2: The Democratic Paradox (High Severity)**
      -   **Conflict:** If justice demands including the coerced (1), letting the current majority decide who counts (2) allows them to *injustly exclude* vulnerable groups (e.g., immigrants, minorities). This makes inclusion contingent on power, not principle.
      -   **Why it’s bad:** It risks making (1) ornamental—if the majority can ignore it, why state it as justice? You imply a hidden commitment: *Procedural legitimacy outweighs perfect justice*. But this clashes with your strong normative stance in 1 and 3.
      -   **Revision:** Argue that the coercion test sets the *normative default*, but practical inclusion requires democratic authorization (with injustice as a trade-off).  
      -   **Cost:** Weakens your moral authority on issues like felon voting (3). If the majority votes to exclude felons, is it unjust? Your "no" in 3 now conflicts with "yes" in 2.

  3.  **1 vs. 6: The Local Coercion Blind Spot (Moderate Severity)**
      -   **Conflict:** You reject the affected-interests test (1) as overbroad but endorse local jurisdiction for zoning (6). Yet zoning decisions *coerce* neighboring communities (e.g., polluting factories near borders, traffic impacting adjacent towns). If only city residents vote, you exclude people coerced by the decision—violating your own test.
      -   **Why it’s not fatal:** You could argue coercion is *direct* only for residents (e.g., fines, permits), while outsiders face indirect effects. But this requires distinguishing coercion from spillovers—a hidden commitment to *territorial immediacy*.
      -   **Revision:** Clarify that coercion means *direct legal enforcement* (arrests, fines) against individuals. Outsiders aren’t directly coerced by another city’s zoning vote.  
      -   **Cost:** Makes your coercion test narrower, risking under-inclusion (e.g., does a state’s pollution law "directly" coerce a downstream town?).

  4.  **3 vs. 4: No Conflict (Superficial Tension Only)**
      -   **Why they cohere:** Both align with the coercion test. Felons in prison (3) are directly subject to state coercion (incarceration, parole). Long-term expats (4) may pay taxes but aren’t *routinely coerced* by domestic laws (e.g., policing, land use). Your test focuses on *ongoing subjection*, not stakes or identity. No revision needed.

  ### Other Observations
  - **Hidden Commitments:**  
    - You prioritize *practical administrability* over moral precision (bright-line voting age, rejecting affected interests).  
    - You assume coercion is *binary* (in/out jurisdiction), not graduated. This lets you exclude expats (4) and include prisoners (3) consistently.  
  - **7 & 8:** Unproblematic. Bright lines are inevitable, and proxy votes conflict with agency (fitting your coercion focus).  
  - **Biggest Unforced Error:** Not defining "coercion." Does it require physical force? Legal penalties? Mere deterrence? Border enforcement is physical; tax laws are financial. Clarify this to preempt attacks.

  ### The Single Cheapest Revision
  **Refine Point 1 to specify *ongoing subjection to the state’s legal enforcement apparatus* as the criterion.**  
  - **How it helps:** Resolves 1 vs. 5 (excludes border coercion), partially resolves 1 vs. 6 (limits coercion to legal targets), and leaves 1 vs. 2 as a live tension (which is philosophically honest).  
  - **Cost:** Forces you to defend why *physical presence* (or legal jurisdiction) matters morally. You’ll be accused of privileging the status quo—but this is defensible for a realist democratic theory.

  ### How to Defend Under Attack
  - **For 1 vs. 5:** "The state’s *ongoing* enforcement of laws differs from *excluding* outsiders. The latter defines the polity; the former governs it. We can’t democratically set boundaries if boundary-setting itself requires including everyone affected."  
  - **For 1 vs. 2:** "Justice requires inclusion of the coerced, but enforcing this without democratic buy-in is authoritarian. We accept fallible democratic decisions as the least unjust method."  
  - **For 1 vs. 6:** "Only those facing *direct legal liability* (e.g., fines for non-compliance) are coerced by hyper-local decisions. Indirect effects don’t trigger inclusion—or we collapse into the affected-interests test."

  Your position hangs together *if* you explicitly tie coercion to *legal subjection within a jurisdiction*. Without that, points 1 and 5 fatally undermine each other. With it, you have a gritty, realist framework that’s internally consistent—even if controversial.
