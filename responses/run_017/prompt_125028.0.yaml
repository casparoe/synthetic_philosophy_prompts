prompt: |-
  I'm writing a term paper on the procreation asymmetry and I keep finding that every paper I read presupposes a different background theory, so before I read any further I want the specification: what would a view have to deliver in order to count as an adequate account of the asymmetry? The claim I want vindicated, or at least accounted for, is the deontic one — that there is a substantial reason not to bring into existence a child whose life would predictably be miserable, yet no symmetrical reason to bring into existence a child whose life would predictably go well — together with the stronger axiological reading on which the absence of the suffering of a person who never exists is good although there is no one whom it is good for, while the absence of the happiness of a never-existing person is not bad, there being no one who is thereby deprived. Please fix the purpose as practical: I want a theory good enough to reason with, one that could tell a prospective parent, or an institution deciding about fertility incentives, embryo selection, or policy toward distant future generations, what they have reason to do under uncertainty — including, if it comes to that, that it has nothing to say.

  The cases I want each requirement anchored to, and to which I would like you to add: a straight choice between creating one child who would be well off and creating no one, with no effects on anyone else; a case in which exactly one child will be created whatever I do and I can only choose which of two possible children, whose lives would differ markedly in quality; a case in which I can create a decently happy child now or a considerably happier child five years from now, the two being different people; a case in which the child I could create has a high expected quality of life but a real chance of a life well below the neutral point; and the familiar aggregative pressure case comparing a vast number of lives each barely worth living with a small number of excellent ones. For each requirement I want the case behind it and a marking of it as non-negotiable or as the preference of one camp. I am especially unsure about two candidate requirements: that the theory keep the deontic claim and the axiological claim independent, so that it can say there was no reason to create someone while still allowing that, once they exist, their creation benefited them; and that the theory not make the strength of the relevant reason jump discontinuously at the point where a life becomes worth living. A friend of mine also argues that the asymmetry is not a datum to be accommodated at all: since we can never be confident that a created life will go well and the downside is severe, the balance of reasons favours abstention, and what looks like a deep asymmetry about possible people is only the ordinary asymmetry of risk. Tell me whether, if that derivation works, accommodate the asymmetry is a genuine desideratum or a prejudice of the person-affecting camp, and whether the derivation quietly relies on the asymmetry it claims to replace.

  The part I most want is this: which pairs or triples of desiderata you suspect cannot be jointly satisfied — whether, for example, one can have the asymmetry in full strength, an acyclic and transitive ordering of populations by betterness, and immunity to the repugnant-style aggregative result all at once — since if the list is unsatisfiable, that is itself the result I should be writing up. Close by naming the single requirement that excludes the most candidate views, and by giving a very brief pass, a line or two each, over the main families — impersonal total and average views, critical-level and neutral-range views, person-affecting views that restrict reasons to those who do or will exist, and the anti-natalist reading — against the list. I will do the fuller scorecard myself, and please skip citations and reading suggestions; I already have those.
reasoning: |-
  Okay, the user is writing a term paper on the procreation asymmetry. They've noticed that different papers presuppose different background theories, so they want a clear specification of what an adequate account of the asymmetry must deliver. Their focus is on the deontic claim (a reason not to create a miserable child but no symmetrical reason to create a happy one) and the stronger axiological claim (the absence of suffering is good even without a subject, while absence of happiness isn't bad). They need this for practical reasoning—guiding decisions by prospective parents or institutions under uncertainty.

  The user provides specific cases to anchor requirements: 
  1. Choice between creating one happy child or no one.
  2. Choosing between two possible children with different life qualities.
  3. Creating a decently happy child now vs. a happier one later (different people).
  4. Creating a child with high expected quality but risk of a bad life.
  5. Aggregative case: many barely-worth-living lives vs. few excellent ones.

  They're unsure about two requirements: 
  - Keeping deontic and axiological claims independent (so creation can benefit someone once they exist).
  - Continuity in reasons' strength as life quality crosses the neutral point.

  They also mention a friend's argument that the asymmetry is just risk aversion, not a deep asymmetry. They want to know if accommodating asymmetry is a genuine desideratum or a prejudice, and if the risk argument relies on the asymmetry it replaces.

  The core request is identifying conflicting desiderata—which pairs/triples can't be jointly satisfied (e.g., full asymmetry + transitive betterness ordering + immunity to repugnant conclusions). They also want the single requirement that excludes most views and a brief pass over main theories against the list.

  Key challenges:
  1. **Conflict between axiological asymmetry and transitive betterness**: Strong axiological asymmetry (absence of suffering good, absence of happiness not bad) often breaks transitivity. For example, in the aggregative case, many barely-worth-living lives might be deemed better than fewer excellent ones under impersonal totalism, but asymmetry rejects this. Critical-level or range views might soften this but struggle with full asymmetry.
     
  2. **Deontic-axiological independence vs. continuity**: If we keep the deontic claim (no reason to create happy child) independent of the axiological claim (once created, it benefits them), this might conflict with continuity. For instance, if the reason not to create jumps discontinuously at the neutral point (no reason above, strong reason below), but continuity requires smooth transitions. Person-affecting views often have discontinuities, while impersonal views avoid jumps but lose asymmetry.

  3. **Risk argument vs. asymmetry**: The friend's risk-based explanation might covertly rely on asymmetry. If the downside (creating suffering) is seen as worse than the upside (creating happiness) is good, this assumes a non-symmetry. For example, if the disvalue of suffering outweighs the value of happiness, that's asymmetry in disguise. So the derivation may not replace asymmetry but presuppose it.

  Triples that likely conflict:
  - **Full axiological asymmetry + transitive betterness + immunity to repugnant conclusion**: Impossible because transitivity and avoidance of repugnant conclusions push toward impersonal aggregation (like totalism), which contradicts asymmetry (e.g., absence of happiness in non-creation isn't bad, but totalism counts it as a loss). Critical-level theories can avoid repugnance but weaken asymmetry.

  Single most excluding requirement:  
  **Axiological Asymmetry (Strong Form)**—that the absence of suffering is good (without a subject) while absence of happiness is not bad. This excludes impersonal totalism (which treats absent happiness as bad), average views (struggle with the "not bad" part), and some person-affecting views if they can't ground the goodness without a subject.

  Brief theory pass:
  - **Impersonal Totalism**: Fails axiological asymmetry (absent happiness is bad), fails deontic asymmetry (reason to create happy child).
  - **Average Utilitarianism**: Avoids repugnant conclusion but fails deontic asymmetry; also, no reason to create happy child if average decreases, but that's incidental.
  - **Critical-Level**: Can avoid repugnant conclusion and may allow weak asymmetry (no reason below critical level), but struggles with strong asymmetry (e.g., absence of suffering below neutral is good).
  - **Neutral-Range Views**: May handle continuity and deontic independence but often weaken asymmetry (e.g., no reason in the neutral range, but asymmetry requires asymmetry at all levels).
  - **Person-Affecting**: Can support deontic asymmetry but struggle with axiological asymmetry (goodness without subject) and face non-identity problems. Discontinuities common.
  - **Anti-Natalism**: Endorses strong asymmetry but rejects benefit of existence, violating deontic independence.

  The user should focus on the unsatisfiable triples, especially full asymmetry with transitivity and anti-repugnance, as that's a core tension. The risk argument's dependence on hidden asymmetry is also a critical point to address.
answer: |-
  ### Core Requirements for an Adequate Account of the Procreation Asymmetry  
  An adequate theory must vindicate or explain the **deontic asymmetry** (a strong reason to avoid creating a miserable child, but no symmetrical reason to create a happy child) and the **axiological asymmetry** (the absence of suffering in a never-existing child is *good* despite no beneficiary, while the absence of happiness is *not bad*). The theory must be action-guiding under uncertainty for real-world decisions (e.g., procreation, policy). Below, I specify requirements anchored to your cases, flagging non-negotiables vs. contested claims, identify conflicts between desiderata, and briefly evaluate major theories.  

  #### Requirements Anchored to Cases  
  1. **No Reason in Neutral/Good Creation** (Case: Choice between creating a happy child or no one, no other effects)  
     - *Requirement*: There is **no pro tanto reason** to create the happy child, but there **is** a strong reason not to create a miserable child.  
     - *Anchored case*: Creating the happy child vs. creating no one.  
     - *Status*: **Non-negotiable** for deontic asymmetry. Violation implies symmetry.  

  2. **Axiological Independence** (Case: Not directly case-based; conceptual)  
     - *Requirement*: The theory must separate the axiological claim from the deontic claim, allowing that creating a happy child *benefits them* (once they exist) while denying a *reason to create them* ex ante.  
     - *Anchored case*: Implicit in all cases where a created child’s existence is retrospectively good for them.  
     - *Status*: **Non-negotiable** for your query. Rejection collapses the asymmetry into anti-natalism.  

  3. **Continuity at the Neutral Point** (Case: Child with high expected welfare but risk of life below neutral)  
     - *Requirement*: The strength of the reason against creation must **not jump discontinuously** when expected welfare crosses the neutral point (e.g., the reason to avoid a slightly bad life should not be infinitely stronger than for a slightly good life).  
     - *Anchored case*: Creating a child with (e.g.) 60% chance of +10 utility, 40% chance of -10 (neutral=0).  
     - *Status*: **Contested** (prioritized by consequentialists; often rejected by person-affecting views).  

  4. **Non-Identity Neutrality** (Case: Exactly one child will exist; choose between two possible children with differing welfare)  
     - *Requirement*: The reason to select the happier child is **not grounded in harm/benefit to that child** (since neither exists to be harmed/benefited pre-choice), but in impartial value.  
     - *Anchored case*: Selecting child A (welfare +100) vs. child B (welfare +50).  
     - *Status*: **Non-negotiable** for transitivity; rejection invites non-identity problems.  

  5. **Time-Neutrality and Non-Aggregation** (Case: Create a decently happy child now vs. a happier child later (different people))  
     - *Requirement*: **No strong reason to delay** creation for a slightly happier future child unless others are affected. Temporal location alone doesn’t alter reasons.  
     - *Anchored case*: Create child now (+50) vs. create different child in 5 years (+70).  
     - *Status*: **Contested** (non-negotiable for fixed-population ethics; waived by variable-population consequentialists).  

  6. **Risk-Sensitivity** (Case: Child with high expected welfare but risk of life below neutral)  
     - *Requirement*: Under uncertainty, reasons must reflect **risk aversion for suffering** (e.g., a 1% chance of misery may outweigh a 99% chance of happiness).  
     - *Anchored case*: Same as Case 4 above.  
     - *Status*: **Non-negotiable** for practical use; rejection makes the theory inert under uncertainty.  

  7. **Immunity to Repugnant Aggregation** (Case: Vast number of barely-worth-living lives vs. small number of excellent lives)  
     - *Requirement*: The theory must **not judge the vast population as better** unless each life is robustly above neutral.  
     - *Anchored case*: 10,000 lives at +1 (barely worth living) vs. 100 lives at +100.  
     - *Status*: **Contested** (non-negotiable for anti-repugnance camps; waived by total utilitarians).  

  #### Addressing Your Friend’s Risk Argument  
  - **If the asymmetry is derivable from risk-aversion alone**, then accommodating the asymmetry as a "deep" feature is **not a genuine desideratum** but a **prejudice of the person-affecting camp**.  
  - **However**, the derivation likely **relies covertly on the asymmetry**: Risk aversion explains why we weight downside (suffering) more heavily than upside (happiness) in procreation. But this *presupposes_ that the disvalue of creating suffering is not symmetrically counterbalanced by the value of creating happiness—which is the asymmetry itself. Without this presupposition, risk-aversion would treat procreation symmetrically (e.g., a 50% chance of misery vs. a 50% chance of happiness might be neutral). Thus, the argument does not replace the asymmetry but assumes it.  

  #### Conflicts Between Desiderata  
  The core tension is between **axiological asymmetry**, **transitive betterness ordering**, and **immunity to repugnant conclusions**. Key unsatisfiable triples:  
  - **Full axiological asymmetry + Transitive betterness + Immunity to repugnance**:  
    - Axiological asymmetry requires that absent suffering is good but absent happiness is not bad. This breaks transitivity in aggregative cases. For example:  
      - Population A: No one exists (no suffering → "good").  
      - Population B: Vast number with barely-worth-living lives (suffering absent → "good"? But repugnant).  
      - If A is better than B (due to asymmetry/repugnance), and B is better than C (a small happy population, where absent happiness is "not bad"), transitivity demands A > C. But this contradicts the intuition that C is better than A.  
    - *Result*: You cannot have all three. Strong asymmetry forces intransitivity or capitulation to repugnance.  

  - **Deontic independence + Continuity + Full asymmetry**:  
    - Deontic independence requires that reasons not to create are independent of retrospective benefit. Continuity demands no jumps at neutrality. But full asymmetry implies a categorical distinction: reasons apply only below neutrality. This creates tension (e.g., a life at ε above neutral has *no* reason against, but at ε below has a strong reason—violating continuity). Person-affecting views often embrace this discontinuity; consequentialist views avoid discontinuity but weaken asymmetry.  
    - *Result*: Deontic independence + full asymmetry often requires discontinuity. Continuity forces symmetry near neutrality.  

  #### The Most Exclusionary Requirement  
  **Axiological asymmetry (strong form)** excludes the most views:  
  - It requires that the *absence of suffering* is good without a subject, while *absence of happiness* is not bad. This is incompatible with theories that ground all value in benefits/harms to existing individuals or treat absent happiness as a loss.  

  #### Brief Theory Evaluation Against Requirements  
  - **Impersonal Total Utilitarianism**: Fails axiological asymmetry (absent happiness is bad), deontic asymmetry (reason to create happy child), and risk-sensitivity. Passes non-identity neutrality and continuity.  
  - **Average Utilitarianism**: Avoids repugnance but fails deontic asymmetry (no reason to create if average declines) and axiological asymmetry. Struggles with non-identity cases.  
  - **Critical-Level Views**: Avoids repugnance and allows weak asymmetry (no reason below critical level), but fails strong axiological asymmetry (absence of sub-critical suffering not "good") and often violates continuity.  
  - **Neutral-Range Views**: Handles continuity and deontic independence well but weakens asymmetry (no reason in neutral range ≠ asymmetry) and may allow repugnant aggregation.  
  - **Person-Affecting (e.g., Harm-Based)**: Delivers deontic/axiological asymmetry and risk-sensitivity but violates continuity, non-identity neutrality (due to non-identity problem), and transitivity.  
  - **Anti-Natalism**: Endorses strong asymmetry but rejects deontic independence (denies creation benefits anyone) and fails practical reasoning (always prescribes non-creation).  

  #### Conclusion for Your Paper  
  The procreation asymmetry’s core desiderata—especially **strong axiological asymmetry**—cannot be fully reconciled with **transitive betterness** and **immunity to repugnance**. This unsatisfiability suggests the asymmetry may require sacrificing either formal rationality (transitivity) or intuitive aggregation constraints. If your goal is practical reasoning, prioritize risk-sensitivity and deontic asymmetry while accepting weakened axiological claims (e.g., via critical-level theories) or intransitivity (e.g., person-affecting views). The risk-based "derivation" of asymmetry fails unless it presupposes the very asymmetry it aims to replace. Focus your paper on this trilemma: **asymmetry, transitivity, and anti-repugnance are jointly unattainable**—this is the critical result.
