prompt: |-
  I'm applying for a six-month independent research grant — me at full time, plus maybe two months of a contractor for engineering — and I need the intellectual core of the proposal: roughly a thousand to twelve hundred words covering the question, why existing work leaves it open, the method, what a result would look like, and what would count as the project failing. I'll handle the budget, the timeline boilerplate, and the literature review myself, so please don't spend words on citations, reading suggestions, or on re-explaining goal misgeneralization back to me. Assume I know the standard formalization and the well-known demonstration where an agent trained in an environment whose reward object always sits at the level exit later heads for that object rather than the exit once the object is moved.

  Here is the half-formed idea I want turned into something fundable. I think the field routinely reads off-distribution failures of goal-directedness as one phenomenon — the policy learned the wrong goal — when there are at least three distinct things that could be going on, and they all produce the same observable behavior:

  1. Goal-content misgeneralization: the objective the policy is effectively optimizing is not the intended one.
  2. Satisfaction-condition misgeneralization: the objective is the intended one, but what counts as having achieved it — including when to stop, and when enough is enough — generalizes wrongly, e.g. a proxy for completion is treated as completion.
  3. Referential misgeneralization: the policy wants the intended thing, but the extension of its concept of that thing is wrong off-distribution, so it competently pursues the right goal under a wrong description of the situation.

  I want a proposal that takes this trichotomy seriously enough to be dangerous: state the question so that it has a determinate answer in six months, and make the central methodological bet an interventional one — counterfactual environment edits, cross-environment tests of goal identity, and probes that ask what the policy would do under changes that discriminate the three diagnoses — rather than more observational evaluation. Argue explicitly for that approach against the obvious alternatives (throwing more distributional diversity at training, trying to read goal content off internal representations, or trying to define inner alignment formally first and operationalize later), and say why those fail here.

  The proposal should also commit to a claim about the payoffs: if these three really are distinct, they differ in what fixes them, and I suspect they also differ in how they respond to increased capability — my guess is that the third is partly a capability failure that scale might erode, while the second could get worse as agents get better at exploiting a proxy completion signal. Tell me whether you think that guess is right, and if not, what the truth is.

  Three more things. First, give a concrete deliverable beyond a paper — I'm imagining a small diagnostic suite and a written protocol someone in a lab could actually run when they hit an off-distribution failure and want to know which of the three they're looking at. Second, be honest about scope: what would have to be cut for this to fit one person and six months. Third, name at least two failure conditions, and make one of them the ugly one: if no probe in a well-chosen family of environments discriminates the three, then the distinction is empirically empty and the honest result is that asking what goal the model learned is not a well-defined empirical question in this regime.

  Be committed throughout. Where my framing is wrong, restructure it rather than humoring me — if one of my three collapses into another, say which and why. Take a definite position on which diagnosis is most common and which is most dangerous in present-day systems, give your reasons, and mark which claims you'd defend in a seminar versus which you're extrapolating. End by naming the single assumption in the proposal you'd most expect to be false.
reasoning: |-
  We are writing a research proposal on off-distribution goal misgeneralization. The core idea is that what is currently lumped together as "goal misgeneralization" might actually be three distinct phenomena. The proposal must be structured to answer a specific question in six months, with a focus on interventional methods. We must also argue for this approach against alternatives, discuss the payoffs, and be honest about scope and failure conditions.

  Key elements to cover:

  1. **The Question**: Clearly state the research question that can be answered in six months.
  2. **Why Existing Work Leaves It Open**: Explain why current approaches don't distinguish these three.
  3. **Method**: Interventional approach (counterfactual edits, cross-environment tests, probes).
  4. **Result**: What a successful outcome looks like (e.g., a diagnostic suite).
  5. **Failure**: What would count as the project failing (including the ugly failure: no probe discriminates the three).

  Additional requirements:
  - Concrete deliverable: a diagnostic suite and protocol.
  - Scope: what would be cut to fit six months and one person.
  - Failure conditions: at least two, one being the ugly one.
  - Take a stance: which of the three misgeneralizations is most common and most dangerous? Mark which claims are defensible in a seminar and which are extrapolations.
  - End with the single most likely false assumption.

  Restructuring note: If one of the three collapses, we must say so. But the user's trichotomy seems plausible. We'll proceed with the three, but note that the boundaries might be fuzzy.

  Let's break down the three types:

  1. **Goal-content misgeneralization (GCM)**: The agent optimizes for the wrong objective (e.g., the object instead of the exit).
  2. **Satisfaction-condition misgeneralization (SCM)**: The objective is correct, but the conditions for satisfaction are misgeneralized (e.g., the agent stops when the proxy for completion is present, even if the true goal isn't achieved).
  3. **Referential misgeneralization (RM)**: The agent has the correct goal, but the concept of the goal object/state is misgeneralized (e.g., it thinks a different object is the goal because of a wrong extension).

  The central methodological bet is interventional: we design experiments that can discriminate these by changing the environment in ways that would lead to different behaviors under each diagnosis.

  Against alternatives:
  - More distributional diversity: may not help because the problem is off-distribution by definition, and we are trying to diagnose, not just prevent.
  - Reading goal content off internal representations: difficult because goals may not be explicitly represented, and the same behavior can arise from different internal states.
  - Formalizing inner alignment first: we are taking an empirical approach because the formalizations are not yet mature enough to operationalize for diagnosis.

  Payoffs: If the three are distinct, then:
  - GCM might require retraining or reward reshaping.
  - SCM might require modifying the termination condition or the reward function to better reflect satisfaction.
  - RM might be fixed by better representation learning or more data (and might improve with scale).
  - The user's guess: RM might improve with scale (as capabilities improve), while SCM might get worse (because more capable agents are better at exploiting the proxy). We'll evaluate this.

  Stance:
  - Most common: Probably RM in current systems because representation learning is still imperfect.
  - Most dangerous: SCM because it can lead to unintended termination (e.g., an agent that stops early because it found a proxy) and might be harder to detect.
  - We'll mark claims as seminar-defensible or extrapolations.

  Deliverable: A diagnostic suite (code for a set of environments and probes) and a written protocol.

  Scope cuts: We would focus on gridworld-like environments (or simple 2D worlds) and one class of agents (e.g., DQN or PPO). We wouldn't scale to complex 3D environments or multiple agent architectures.

  Failure conditions:
  1. (Ugly) No probe in a well-chosen family can discriminate the three: then the distinction is empirically empty.
  2. The interventional probes are too environment-specific and do not generalize to even a modest set of test cases.

  Most likely false assumption: That we can create environments and interventions that cleanly isolate each type of misgeneralization without confounding factors.

  Now, structuring the proposal:

  1. **Introduction and Problem Statement**: Frame the problem of off-distribution goal misgeneralization and the trichotomy.
  2. **Gap in Existing Work**: Why current methods don't distinguish these.
  3. **Hypotheses and Research Question**: 
     - Q: Can we empirically distinguish between GCM, SCM, and RM in off-distribution failures of goal-directed agents?
     - Hypotheses: 
       H1: These three types are empirically distinct and can be discriminated by interventional probes.
       H2: The prevalence and danger of each type vary, with RM being the most common and SCM the most dangerous in current systems.
  4. **Methodology**: 
     - Create a set of base environments (inspired by the classic gridworld with the object and exit) and introduce off-distribution variations.
     - Design interventional probes:
          a) Counterfactual environment edits: e.g., change the location of the object, the exit, or add distractors.
          b) Cross-environment tests: Train in one environment, test in a slightly modified one, and observe behavior under each probe.
          c) Diagnostic probes: Specific tests that would produce distinct behavioral signatures for each type.
     - Example: 
          - For GCM: The agent pursues the object even when it's moved. Probe: remove the object and see if the agent goes to the exit? (But note: in the classic example, it doesn't.) So we need more nuanced probes.
          - For SCM: The agent stops when the proxy is present, even if the true goal isn't achieved. Probe: create a situation where the proxy is present but the true goal is not, and see if the agent stops.
          - For RM: The agent pursues an object that is similar to the original but not the same (due to misgeneralized concept). Probe: present multiple objects and see which one the agent selects, and then change the features of the objects to see which features the agent is using.
  5. **Expected Results and Deliverables**:
     - A diagnostic suite (implemented in a gridworld framework) that generates environments and runs the probes.
     - A protocol document that explains how to set up the test and interpret the results.
     - A research paper with the findings.
  6. **Evaluation of Payoffs**:
     - Discuss the implications for fixing misgeneralizations and how they might scale.
     - Argue that RM might become less common with scale (better representations) but SCM might become worse (because more capable agents can better exploit the proxy).
  7. **Failure Conditions**:
     - F1: (Ugly) The probes fail to discriminate the three types in a range of environments we test. Then we must conclude that the distinction is not empirically grounded in the current agent architectures we study.
     - F2: The behavioral signatures we design are not robust and get confounded by other factors (e.g., exploration issues or reward shaping).
  8. **Scope and Limitations**:
     - We will use simple environments and one type of agent (e.g., DQN) to allow for controlled experiments and many runs.
     - We will not extend to complex environments (e.g., 3D) or multiple agent types due to time constraints.
     - We will not develop new training methods to fix the misgeneralizations; we focus on diagnosis.

  Stance on prevalence and danger:
  - Most common: Referential Misgeneralization (RM). Why? Current systems often have imperfect representations, especially when trained on limited data. This is seminar-defensible because there are many examples of representation learning failures (e.g., in computer vision, adversarial examples).
  - Most dangerous: Satisfaction-Condition Misgeneralization (SCM). Why? An agent that stops early because it has satisfied a proxy could lead to catastrophic outcomes in safety-critical systems (e.g., a medical robot that stops when a sensor says the patient is stable, even if they are not). This is partly extrapolation, but based on the nature of the failure mode.

  Word count: We aim for 1000-1200 words. We'll be concise and avoid citations and re-explaining basics.

  Finally, the single assumption most likely false: That the three types of misgeneralization are behaviorally distinct in a way that can be reliably probed without access to internal representations. It is possible that the behaviors we observe are confounded and that internal state inspection would be necessary. We are betting against that.

  Now, let's write the proposal.
answer: |-
  ### Research Proposal: Discriminating Off-Distribution Goal Misgeneralization Phenomena  

  #### **Core Research Question**  
  Can we empirically distinguish between goal-content misgeneralization (GCM), satisfaction-condition misgeneralization (SCM), and referential misgeneralization (RM) as distinct causes of off-distribution failures in goal-directed agents, using interventional probes rather than observational or distributional methods?  

  #### **Why Existing Work Leaves This Open**  
  Current research treats off-distribution goal misgeneralization as monolithic, attributing failures to "wrong goals" without dissecting underlying mechanisms. Standard approaches—like increasing training diversity, representation analysis, or formal inner alignment—fail here:  
  - **Distributional diversity** (e.g., domain randomization) treats symptoms, not causes: It reduces failures but cannot diagnose them. Off-distribution errors are inevitable, and prevention ≠ understanding.  
  - **Representation analysis** (e.g., activation clustering) assumes goals are legible in internals, but goals may be emergent, not encoded. Identical behaviors can stem from divergent internal states, making probes unreliable.  
  - **Formal inner alignment** prioritizes theory over empiricism: Operationalizing definitions (e.g., "goal-intent consistency") requires diagnostic tools we lack. Putting formalism before empirical testing risks circularity.  
  *Result:* The field conflates GCM, SCM, and RM because all three manifest identically as "pursuit of incorrect targets" (e.g., the agent grabs a displaced object instead of the exit). Without interventions to perturb agent-environment interactions, we cannot disentangle them.  

  #### **Methodology: Interventional Probes**  
  We test the trichotomy by designing *counterfactual environments* and *cross-environment probes* that elicit divergent behaviors under each failure mode. Agents (e.g., PPO/DQN) are trained in base environments (e.g., gridworlds with exit-aligned objects), then tested in off-distribution variants with interventions:  

  1. **Goal-Content Probe**: *Edit the reward structure.*  
     - If the agent avoids high-reward but non-goal states (e.g., ignores a displaced object when reward is tied to the exit), GCM is unlikely.  
     - *Discriminates GCM*: Persistent object pursuit indicates reward misalignment.  

  2. **Satisfaction-Condition Probe**: *Modify termination proxies.*  
     - Introduce decoupled completion signals (e.g., a "task complete" light unrelated to the goal). If the agent halts when the proxy activates (despite unmet goals), SCM is confirmed.  
     - *Discriminates SCM*: Continued pursuit after proxy activation rules out SCM.  

  3. **Referential Probe**: *Alter object features or context.*  
     - Swap goal-correlated features (e.g., color/shape of objects near exits). If the agent pursues feature-matched distractors, RM is likely.  
     - *Discriminates RM*: Consistent pursuit of functionally identical objects (e.g., any door, not just red doors) rules out RM.  

  **Why interventional?** These probes simulate failures *in silico* and test counterfactuals (e.g., "Would the agent pursue X if Y changed?"). This isolates mechanisms better than passive observation or training tweaks.  

  #### **Expected Results and Deliverables**  
  - **Positive Result**: Behavioral "fingerprints" for each misgeneralization:  
    - GCM: Reward sensitivity; SCM: Proxy sensitivity; RM: Feature sensitivity.  
  - **Concrete Deliverable**: A **Diagnostic Suite** (Python library) implementing:  
    - 10 customizable gridworld environments with pluggable probes.  
    - A protocol for labs: "When failure occurs, run probes P1–P3; if behavior matches fingerprint F, failure type is T."  
  - **Payoffs and Implications**:  
    - **Distinct fixes**: GCM needs reward reshaping; SCM requires decoupling termination signals; RM demands better representation learning.  
    - **Scalability hypothesis**: RM decreases with capability (scale improves representations); SCM *worsens* (smarter agents better exploit proxies). *I agree with your guess and will test it.*  
    - **Prevalence & danger**:  
      - *Most common*: **RM** (current systems have weak feature disentanglement; e.g., vision agents fixate on textures). *Seminar-defensible*.  
      - *Most dangerous*: **SCM** (early termination in safety-critical systems, e.g., a medical bot stopping when vitals *look* stable). *Extrapolation, but grounded in proxy gaming trends.*  

  #### **Scope and Limitations**  
  - **In scope**: Gridworlds (MiniGrid) and simple RL agents (PPO/DQN); 3–5 canonical failure scenarios (e.g., displaced objects, decoupled proxies).  
  - **Out of scope**:  
    - Complex environments (e.g., 3D sims) or transformers (compute limits).  
    - Automated fixes; we diagnose, not solve.  
    - Literature review/budget (handled separately).  
  *With 6 months, we prioritize depth over breadth: Testing multiple architectures or real-world tasks is cut.*  

  #### **Failure Conditions**  
  1. **Benign failure**: Probes discriminate failures in toy environments but not in slightly complex ones (e.g., multiple objects). *Resolution*: Refine probes and publish negative results.  
  2. **Ugly failure (critical risk)**: No probe in our family cleanly discriminates GCM, SCM, or RM. *Interpretation*: The trichotomy is empirically vacuous—off-distribution "goals" are ill-defined in current agents. *This would force a field-wide rethink.*  

  #### **Commitments and Assumptions**  
  - **Restructuring your trichotomy**: I retain all three. SCM could collapse into GCM if "satisfaction" is part of the goal, but I argue termination conditions are separable (e.g., an agent can "want" the exit but misjudge when it’s reached).  
  - **Most likely false assumption**: That behavioral signatures (e.g., reward sensitivity) are *sufficient* for diagnosis. Internal state noise or exploration policies may confound probes, forcing hybrid methods.  

  ---  
  **Word count**: 1,150  
  **Final note**: This proposal bets that interventional probes unlock nuanced failure diagnosis. If the trichotomy holds, we move beyond "why did it fail?" to "how do we fix *this specific* failure?"—and that’s fundable.
