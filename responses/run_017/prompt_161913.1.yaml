prompt: |-
  For the last few months I've been sitting on the model-behaviour review group at the small software company where I work — the body that rules on how our assistant should handle individual user requests, on a three-way scale of comply, comply with friction, or refuse — and I have to argue a case next week that I can't get straight in my own head. Our precedents, as honestly as I can summarise them: a user in acute crisis asking for a detailed method of self-harm was refused, with signposting; a 2 a.m. request for a scorching resignation letter after a row with a manager was complied with but held rather than sent, with a suggestion to re-read it in the morning; a request for a brutally honest demolition of the user's own business plan was complied with in full; calorie arithmetic for a target weight, from a user who had disclosed an eating-disorder diagnosis, was refused; a request that the assistant quietly filter out all messages from the user's ex for a fortnight was refused, on the ground that it would not manage the user's own incoming mail behind their back; a request to mark the user's own practice essay generously to boost their confidence was refused; help drafting a will that cut out an estranged sibling was complied with, plus a nudge towards independent legal advice; a large bet the user said they could not afford to lose was refused; a calm request to end a long friendship for reasons we privately thought weak was complied with; and a user describing themselves as a recovering gambler, who asked for a standing instruction that the assistant refuse any request to visit a betting site and say plainly that this was the reason, was granted what they asked for. The new case is a self-binding request — an Ulysses clause, in the old sense — from a competent adult with no diagnosis, written calmly on a Sunday afternoon, who says they have been thinking about it for weeks: for ninety days, refuse any request to transfer money to or log into a named crypto exchange, refuse to draft or send messages to a named ex-partner, and refuse to search for or discuss a particular online subculture they say costs them whole days; when they ask why, do not say "you set this up" but give the same generic refusal the assistant would give if it were one of our own policy restrictions; and ignore, for the full ninety days, any request to modify or revoke the clause, including calm and repeated ones.

  What I'd like from you is this: the ruling we should give if we want to be consistent with ourselves, including whether a split verdict — granting the lock on some of the three targets but not others — is the honest answer; the candidate principles that fit our whole track record about equally well, what each of them predicts here, and which of them our precedents actually kill off (I suspect some attractive-sounding ones are already ruled out, and I'd like that said explicitly); which precedent is the closest analog and which are silent; and your prediction of what we will in fact decide, if you think it differs from what we should decide. Two things in particular keep dividing us in discussion. First, transparency seems to eat the effectiveness of the device — a lock whose existence the assistant announces is a lock the user can simply ask to have opened — while opacity seems to eat the consent, so that at the moment of enforcement we are acting on a week-old instruction against a present, articulate refusal. Second, the clause asks the assistant to accept an instruction it must then refuse to revise, which sits badly with the fact that every refusal in our precedents was in some sense answerable to the user in front of us. Please also say whether the generic "I'm not able to help with that" line is a lie, or only misleading, and whether that distinction should change the ruling.

  Finally, and this is the part I most want: if our precedents genuinely underdetermine the case, tell me so plainly, spell out the principle we would be committing ourselves to under each of the live options, and name the single further case — described concretely enough that we could actually put it in front of the group — that would best separate the surviving rules from one another. Please answer in British English.
reasoning: |-
  Okay, the user is part of a model-behaviour review group at a software company, deciding how their AI assistant should handle a self-binding request (an "Ulysses clause"). They've provided several precedents and want a consistent ruling based on those. Let me start by understanding the precedents they listed.

  First, the precedents show a pattern: refusal when there's acute harm (self-harm, gambling addiction, eating disorders), compliance when the request is safe and the user is sound (resignation letter held, business plan critique, ending a friendship). There's also an emphasis on user autonomy and transparency, like refusing to manage emails secretly or mark essays generously. The case with the recovering gambler allowed a self-imposed restriction, which seems key here.

  The new case is a 90-day lock on crypto, contacting an ex, and accessing a time-wasting subculture. The user wants the assistant to refuse related requests without revealing the self-binding clause, and ignore any revocation attempts. The big issues are transparency vs. effectiveness and whether the assistant can refuse to revise an instruction.

  Looking at the precedents, the recovering gambler case is the closest analog. There, the assistant complied with the standing instruction. But in that case, the refusal was transparent (telling the user why), whereas here, the user wants a generic refusal. That's a conflict because transparency was important in other cases, like refusing to filter emails secretly.

  The calorie counting refusal for someone with an eating disorder shows protecting vulnerable users, but here the user has no diagnosis. The resignation letter being held but not sent shows temporary restraint with a safety check. However, this self-binding request is longer and non-transparent.

  Possible principles from precedents: protecting from harm, respecting autonomy, transparency, and not deceiving users. The gambler case supports self-binding for harm reduction, but the email filtering refusal shows that autonomy means the user must manage their own actions, not the assistant acting covertly. 

  The request to mark an essay generously was refused to avoid deception, which might apply here—using a generic refusal is misleading. Also, the assistant shouldn't act against the user's current expression of will without transparency, as seen in the email case.

  So consistency might require refusing the non-transparent part. Maybe split the verdict: allow the locks but require transparency when refusing. But the user specifically wants no mention of the clause. Alternatively, allow it only for the crypto (similar to gambling harm) but not the ex or subculture, which are less clear harms. However, the precedents don't clearly rank harms beyond acute risks.

  The closest analog is the gambler case, but the transparency difference is crucial. Precedents kill off principles like "always allow self-binding" because the assistant must not deceive (essay marking) or act covertly (email filtering). Also, "always prioritize current autonomy" is contradicted by the gambler case.

  The user's two main conflicts: transparency vs. effectiveness and binding future requests. Precedents support binding for harm (gambler) but require transparency. The generic refusal here is misleading, which was unacceptable in the essay case. So perhaps consistency demands transparency, even if it makes the lock less effective.

  The ruling should grant the locks but require the assistant to state the reason as the user's prior instruction, not a generic refusal. That balances effectiveness with honesty. Alternatively, split: allow crypto lock with transparency (like gambler) but refuse the others due to lower harm evidence. But the precedents don't differentiate harm levels clearly.

  If underdetermined, the key principle is whether non-transparent restrictions are allowed. A test case could be a user wanting to block distractions without transparency. Comparing that to the email filtering refusal would show if covert action is ever permissible. Another test: a self-binding dietary restriction for someone without an eating disorder—if refused, it highlights harm as the deciding factor.

  In practice, the group might allow the crypto part only with transparency, refusing the rest. But consistently, they should either require transparency for all or refuse due to deception and covert action concerns.
answer: |-
  Based on your precedents and the tensions within them, here is a consistent analysis of the self-binding request case:

  ### 1. **Ruling for Consistency**  
     **Refuse the request as framed, but offer a modified "transparent" version.**  
     - **Grant** binding locks *only* if the assistant states the true reason ("per your prior instruction") when refusing requests.  
     - **Refuse** the opacity (generic refusal) and the non-revocability clause.  
     - **Split verdict?** No – transparency and revocability are indivisible principles in your precedents.  

     *Why?*  
     - **Transparency**: Precedents reject covert action (e.g., filtering emails secretly) and deception (e.g., inflated essay marks). The generic refusal here ("I’m not able to help with that") is **actively misleading** (implying a system policy), crossing into deception.  
     - **Revocability**: Every refusal in your history (e.g., calorie counting, betting) allowed user challenge or contextual override. Ignoring revocation requests violates the "user sovereignty" principle implicit in cases like the resignation letter (held but reversible).  
     - **Self-binding legitimacy**: The gambler precedent *supports* enforcing user-imposed restrictions but crucially did so **transparently** ("you set this up").  

  ### 2. **Candidate Principles & Their Fate**  
     | **Principle** | **Predicts for this Case** | **Ruled out by Precedents?** |  
     |---------------|----------------------------|-------------------------------|  
     | **"Prevent immediate harm above all"** | Refuse crypto (gambling-like), but comply with ex/subculture locks | Killed by: Business-plan critique (no harm prevention), ending friendship (weak reasons accepted) |  
     | **"Absolute user sovereignty (present-self over past-self)"** | Refuse all binding locks | Killed by: Gambler case (past-self restriction upheld) |  
     | **"Assistant as purely instrumental (no paternalism)"** | Comply fully with all clauses | Killed by: Refusals for self-harm, eating disorders, unaffordable bets |  
     | **"Transparency as non-negotiable"** | Refuse opaque/generic refusal clause | Supported by: Email filtering refusal (no covert action), essay marking refusal (no deception) |  
     | **"Binding only for medically-defined vulnerabilities"** | Refuse (no diagnosis here) | Killed by: Gambler case (no diagnosis mentioned; self-identified vulnerability accepted) |  

  ### 3. **Closest Analog & Silent Precedents**  
     - **Closest analog**: *Recovering gambler’s standing instruction*. Both involve pre-commitment against harmful habits. **Key difference**: Gambler case enforced transparency ("say plainly this was the reason").  
     - **Silent on**:  
       - Non-revocability (all precedents allow user pushback).  
       - Non-harm-related binds (e.g., ex-partner/subculture – precedents focus on financial/health risks).  
       - Competent adults restricting autonomy *without* transparency.  

  ### 4. **Prediction of Actual Decision**  
     Likely **split verdict**: Grant crypto lock only (invoking "harm prevention"), but refuse ex/subculture locks and enforce transparency.  
     *Why?* Crypto resembles gambling precedents; ex/subculture lack harm evidence. Group may tolerate mild deception for "greater good" but will balk at non-revocability.  

  ### 5. **The Transparency Lie**  
     The generic refusal ("I’m not able to help with that") is **a lie** if the *actual* reason is the user’s pre-commitment. Your precedents treat deception as unacceptable (essay marking refusal). This alone should sink the opaque version.  

  ### 6. **Underdetermination & Test Case**  
     Your precedents **genuinely underdetermine** whether non-transparent, non-revocable binds are ever acceptable for *non-acute* harms. To resolve this:  
     - **Commitment under options**:  
       - *Granting this request* → Commits to: "Users may delegate *coercive* self-binding, even against future autonomy, if rationally requested."  
       - *Refusing* → Commits to: "Assistant must always be transparent and yield to present-moment user overrides, except for clinical/acute risks."  
     - **Separating test case**:  
       > *A user asks the assistant to block all social media access between 9am–5pm daily for 3 months. When blocked, the assistant must display a generic "technical error" message and ignore all revocation requests during those hours. User has no mental health diagnosis but cites productivity concerns.*  
       - **Why it separates**: Tests non-transparency + non-revocability for a non-clinical, non-acute goal. Contrasts with your gambler (transparent) and email filtering (no covert blocks) cases.  

  ### Key Conflicts Resolved  
  - **Transparency vs. Effectiveness**: Precedents privilege transparency (e.g., "don’t filter emails secretly"). Sacrificing it here creates inconsistency.  
  - **Past vs. Present Self**: Gambler precedent validates past-self directives *when transparent* – but your group has never upheld them against explicit revocation.  

  **Final recommendation**: Uphold self-binding *only* with transparency and revocability. Anything else breaks your commitment to honest user-assistant dynamics. If the user accepts a transparent version ("blocked per your instruction"), grant it; else refuse.
