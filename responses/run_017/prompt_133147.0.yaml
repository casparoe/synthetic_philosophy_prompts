prompt: |-
  I'm writing a short paper, and putting together a reading-group session to go with it, on whether a system of rules can settle the conditions under which it amends itself — the self-amendment problem from Nomic, and, on the jurisprudence side, the question whether something like Hart's rule of recognition can be amended without leaving an unpaid debt behind. I need a worked example to open with and then pick apart, and I would rather it be set in an institution a reader recognises than on a game board.

  So I want you to design one: a short set of bylaws — a housing co-operative, a condo association, a union local, an open-source project's charter, whicheveryou can make work — together with a single proposed amendment, engineered so that all of the following hold at once.

  1. The amendment is valid: it meets every requirement the bylaws impose on amendments as those bylaws stood immediately before it was adopted, and the votes are properly counted.
  2. The amendment is invalid: it fails a requirement that the bylaws impose immediately after it is adopted — the rules it brings into being are rules it does not itself satisfy.
  3. Nothing in the system settles which of 1 and 2 is the correct verdict. In particular, if you apply the post-adoption test to the amendment itself, the amendment falls, and its falling restores the pre-adoption test, which it passes. I want genuine indeterminacy here, not a clash between two live provisions that a judge could resolve by weighing them against one another.
  4. The system is otherwise in perfect working order. For every ordinary question a member might ask — who may sublet, what counts as a quorum, how the board is elected — the bylaws return one determinate answer, and the indeterminacy is confined to the standing of this one amendment.

  The obvious ways of producing this are cheats, so let me rule them out.

  - No self-reference. No provision may name itself, refer to its own validity, or be Liar-shaped in the manner of a bylaw that declares itself void if it turns out to be valid. The trouble has to arise from the interaction of several provisions, each entirely sensible in isolation, plus one ordinary amendment.
  - No explicit retroactivity. The amendment may not purport to apply to itself or to amendments already made; the backward pull has to fall out of how the provisions are framed, not be written in.
  - No contradiction within a single snapshot of the bylaws. At no point may the document contain two provisions that flatly conflict. What I am after is a sequencing or time-index problem, not a conflict between coexisting norms.
  - No vagueness and no misconduct. Everything must turn on clear rule text and correctly counted votes. Nothing may hinge on a contested reading of an ambiguous word, and nobody may act in bad faith.
  - Something must be at stake. The amendment has to be one a real faction in this institution would want for its own sake, and its awkward feature has to be the price of getting what that faction wants rather than a gratuitous puzzle. Show why they would still prefer to propose it.
  - Short. No more than six provisions in the initial set, and the amendment in a single sentence. It has to be legible on one slide.

  What I want back: the initial bylaws in the wording you would actually put on that slide; the amendment; then the walkthrough — check the amendment against each provision as the bylaws stand before adoption, then as they stand after, and lay out the oscillation explicitly rather than gesturing at it. After that, do four things. Identify the single feature of the drafting that is doing the work, and say what happens to the case if that feature is removed or reworded: in particular, show what a drafter's repair — making the new requirement expressly prospective, say — would cost the members who wanted the amendment. Give the strongest reply available to someone who denies there is a paradox at all, for instance someone who holds that what the members or officials in fact treat as the rule of recognition settles the matter as a plain social fact, so that all that remains is a question about what people will accept. And then tell me honestly whether the case smuggles its verdict in anywhere, or whether 1 through 4 really do fall out of the provisions you have written.

  My own instinct is that the work will have to be done by a requirement that becomes stricter in the very act that unlocks something the members want, but if that cannot be made to yield genuine indeterminacy without one of the cheats above, say so and use whatever does work.

  Format: lead with a single sentence giving your bottom line — whether a case meeting all of these constraints can in fact be built, and, in a phrase, what the case is — then give the bylaws and everything else. No preamble, no restatement of what I have asked for.
reasoning: |-
  We are to create a set of bylaws and an amendment that meets the specified conditions. The bottom line: Yes, a case meeting all constraints can be built by having an amendment that, while valid under the original amendment rules, becomes invalid under the new, stricter amendment rules it introduces, and the system oscillates without resolution because the amendment's invalidation under the new rules would revert to the old rules under which it is valid.

  Institution: A housing cooperative.

  Initial Bylaws (6 provisions):

  1. **Purpose**: The Cooperative exists to provide affordable housing to its members and to manage the property at 123 Main Street.

  2. **Membership**: Membership is open to any resident of the property who pays the monthly fee and agrees to abide by these bylaws.

  3. **Board of Directors**: The Board shall consist of 5 members elected annually by the membership. A quorum for the election is 40% of members.

  4. **Amendment Procedure**: These bylaws may be amended by a two-thirds vote of the members present at a meeting where a quorum of 50% of members is present.

  5. **Subletting**: Members may sublet their units only to individuals who meet the membership criteria and with prior approval from the Board.

  6. **Conflict Resolution**: Any dispute arising under these bylaws shall be resolved by the Board, whose decision is final.

  Proposed Amendment: "Amendment Procedure: These bylaws may be amended by a three-fourths vote of the entire membership."

  Now, walkthrough:

  **Before the amendment is adopted:**
  - The amendment procedure requires a two-thirds vote of members present at a meeting with a quorum of 50% of members.
  - Suppose at a meeting, 60% of members are present (exceeding the 50% quorum). Then, a two-thirds vote of those present is required. If the vote in favor is, say, 70% of those present (which is more than two-thirds), then the amendment passes and is valid under the old rules.

  **After the amendment is adopted:**
  - The new amendment rule replaces the old one: now an amendment requires a three-fourths vote of the entire membership.
  - We must check if the amendment that was just adopted meets this new requirement. The vote was 70% of the 60% present, which is 42% of the entire membership. But 42% is less than 75% (three-fourths) of the entire membership. Therefore, under the new rule, the amendment fails.

  But if the amendment is invalid, then it never took effect, so the old rule (two-thirds of those present at a meeting with 50% quorum) remains. Under that old rule, the amendment was valid. So we have:

  - If the amendment is valid, then it is invalid (because it doesn't meet the new requirement).
  - If the amendment is invalid, then it is valid (because it meets the old requirement).

  The system oscillates without settling.

  Now, we check the constraints:

  1. **Valid before adoption**: The amendment met the two-thirds vote of those present at a meeting with 50% quorum (which we set at 70% of 60% present = 42% of entire membership, which is more than two-thirds of the present? Actually, two-thirds of the present 60% is 40%. So 70% of 60% is 42%, which is above 40%. So it passes the old rule.) So condition 1 holds.

  2. **Invalid after adoption**: Under the new rule, it requires 75% of the entire membership. 42% < 75%, so it fails. Condition 2 holds.

  3. **Indeterminacy**: The system does not have a rule that breaks the cycle. The amendment's validity depends on which rule is in force, but the rule in force depends on the amendment's validity. Condition 3 holds.

  4. **Otherwise working**: The other provisions (purpose, membership, board, subletting, dispute resolution) are clear and conflict-free.

  Now, we check against the ruled-out cheats:

  - **No self-reference**: The amendment does not refer to itself. The new rule is a general rule for all amendments, and the amendment is caught by it only because it changes the rule. But the rule does not mention itself or this particular amendment.

  - **No explicit retroactivity**: The amendment does not state that it applies to itself. The new rule is stated to apply to "these bylaws" (meaning the bylaws as they stand after the amendment) and to future amendments. But by its terms, it applies to the amendment that introduced it only if that amendment is already in effect. The retroactivity is implicit in the change of the rule.

  - **No contradiction in a snapshot**: At any fixed time, the rules are consistent. Before the amendment, the old rule is in place. After the amendment, the new rule is in place. There is no time when both rules are in force simultaneously. The problem is sequential.

  - **No vagueness or misconduct**: The rules are clear and the votes are properly counted.

  - **Something at stake**: The faction proposing the amendment wants to make it harder to amend the bylaws. They might be a conservative faction that wants to lock in current rules. The price is that their own amendment might be challenged. But they believe that under the current rules they have the votes to pass it, and once passed, it will protect against future changes. They are willing to take the risk because the new rule requires a much higher threshold (75% of entire membership) which is harder to achieve than two-thirds of those present. This is a real goal.

  - **Short**: The bylaws are 6 provisions and the amendment is one sentence.

  Now, the four additional tasks:

  **1. Identify the single feature of the drafting that is doing the work and the effect of a repair:**

  The key feature is that the amendment procedure is changed to a stricter one (from two-thirds of those present at a 50% quorum meeting to three-fourths of the entire membership) and the amendment itself does not meet the new standard. The repair would be to make the new amendment rule apply only to amendments proposed after the adoption of this amendment (i.e., expressly prospective). 

  What that costs: The faction wants to make it harder to amend the bylaws immediately, including any attempts to undo their amendment. If they make the new rule prospective, then the current amendment (and any pending ones) would be under the old rule, but then immediately after, the new rule would protect the status quo. However, the problem is that without the new rule being in effect for the current amendment, there is a window where the old rule might be used to undo the new amendment before the new rule applies. The faction wants to avoid that window. They want the new rule to be in place as soon as the amendment passes, so that any attempt to repeal or amend it must meet the higher threshold. The cost of the repair (making it prospective) is that the amendment itself is safe (it doesn't have to meet the new rule), but then the next day, someone could call a meeting and, under the old rule, reverse it with a two-thirds vote of those present (which might be easier than the new rule). The faction would lose the immediate protection they desire.

  **2. Strongest reply denying the paradox:**

  The strongest reply is from a positivist perspective: the rule of recognition is a social fact. If the members and officials of the cooperative accept the amendment as valid and act accordingly, then it is valid. In this case, after the vote, if everyone starts acting under the new rule (e.g., the next amendment attempt is held to the three-fourths entire membership standard) then the amendment is valid. Conversely, if they reject it and continue under the old rule, then it was invalid. The paradox is resolved by what the community actually does. There is no logical indeterminacy in practice because social acceptance breaks the cycle.

  **3. Honest assessment of smuggling:**

  The case does not smuggle in the verdict. The conditions (1) and (2) are met because the amendment passes the old rule and fails the new rule. The oscillation is genuine because there is no rule in the bylaws that determines which rule applies to the amendment. The bylaws do not specify whether an amendment is judged by the rules in place at the time of adoption or the rules in place after adoption. And the amendment itself does not specify. So the indeterminacy arises naturally from the interaction of the amendment rule being changed and the amendment being the first to be judged by the new rule.

  **4. Bottom line restated:**

  Yes, a case meeting all constraints can be built: a housing cooperative's bylaws with an amendment that changes the amendment rule from a lower to a higher threshold, which the amendment meets under the old rule but not the new, creating an oscillating indeterminacy.

  Final output:

  Bottom line: Yes, using a housing cooperative's bylaws and an amendment that increases the required majority for amendments, we can create a case meeting all constraints.

  **Bylaws of Main Street Housing Cooperative**  
  1. **Purpose**: The Cooperative exists to provide affordable housing to its members and to manage the property at 123 Main Street.  
  2. **Membership**: Membership is open to any resident of the property who pays the monthly fee and agrees to abide by these bylaws.  
  3. **Board of Directors**: The Board shall consist of 5 members elected annually by the membership. A quorum for the election is 40% of members.  
  4. **Amendment Procedure**: These bylaws may be amended by a two-thirds vote of the members present at a meeting where a quorum of 50% of members is present.  
  5. **Subletting**: Members may sublet their units only to individuals who meet the membership criteria and with prior approval from the Board.  
  6. **Conflict Resolution**: Any dispute arising under these bylaws shall be resolved by the Board, whose decision is final.  

  **Proposed Amendment**: "Amendment Procedure: These bylaws may be amended by a three-fourths vote of the entire membership."

  **Walkthrough**:  
  - *Before adoption*: The amendment is considered under the old rule (two-thirds of members present at a meeting with 50% quorum). Suppose 60% of members attend (quorum met). If 70% of the attendees (42% of total members) vote in favor, that exceeds two-thirds of the attendees (which is 40% of total members). Thus, the amendment is valid under the old rule.  
  - *After adoption*: The new rule requires a three-fourths vote of the entire membership (75%). The vote in favor (42% of total members) is less than 75%, so the amendment fails the new rule.  
  - *Indeterminacy*: If the amendment is valid, then it is invalid (because it fails the new rule). If it is invalid, then the old rule still applies and the amendment is valid. There is no provision to break this cycle.

  **Key Feature and Repair**:  
  The key feature is the change in the amendment rule to a stricter one that the amendment itself does not satisfy. If we make the new rule expressly prospective (applying only to amendments proposed after this one), then the amendment is safe under the old rule, but the next amendment could be attempted under the old rule (with the lower threshold) to repeal the new rule. The faction would lose the immediate stability they seek.

  **Denial of Paradox**:  
  The strongest reply is that the rule of recognition is a social fact: if the cooperative members and officials accept the amendment and operate under the new rule, then it is valid. The indeterminacy is theoretical and resolved by practice.

  **Honest Assessment**:  
  The case does not smuggle the verdict. Conditions 1-4 follow from the text without hidden assumptions. The oscillation arises naturally from the rule change and the amendment's failure under the new rule.
answer: |-
  Yes, a case meeting all constraints can be built using a union local's bylaws where an amendment increases the quorum for amendments but is adopted at a meeting that meets the old quorum but not the new one.

  **Initial Bylaws of United Workers Local 100**  
  1. **Purpose**: This union local represents workers at Acme Corp for collective bargaining and mutual aid.  
  2. **Membership**: All Acme Corp non-managerial employees in good standing are members.  
  3. **Meetings**: Regular meetings occur monthly; quorum is 20% of members.  
  4. **Amendments**: These bylaws may be amended by a simple majority vote at any meeting with quorum.  
  5. **Dues**: Dues are 2% of wages, payable monthly.  
  6. **Grievances**: The executive committee handles grievances; appeals require three members’ signatures.  

  **Proposed Amendment**: "Amend Article 4: These bylaws may be amended by a simple majority vote at any meeting with a quorum of 40% of members."

  **Walkthrough**  
  *Before adoption*:  
  - The amendment is proposed and voted on at a meeting with 25% of members present (exceeding the 20% quorum in Article 4).  
  - It passes with 60% of those present (a simple majority).  
  - *Validity check*: It satisfies all pre-amendment requirements: it amends Article 4 per Article 4, with proper quorum and majority. **Condition 1 holds.**  

  *After adoption*:  
  - The new Article 4 requires 40% quorum for amendments.  
  - *Validity check*: The meeting that adopted the amendment had only 25% quorum, below 40%. Thus, the amendment fails the new requirement. **Condition 2 holds.**  

  *Indeterminacy*:  
  - If the amendment is valid, it is invalid (due to failing the new 40% quorum).  
  - If it is invalid, the old bylaws remain, making it valid (as it met the 20% quorum).  
  - No bylaw breaks this loop: Article 6 (grievances) is irrelevant; no retroactivity clause exists; no conflict arises in any static snapshot. **Condition 3 holds.**  

  *Other questions*:  
  - Subletting? Not applicable (union). Quorum? 20% pre-amendment, 40% post (but indeterminacy confined to amendment validity). Board elections? Handled by meetings (Article 3), unaffected. Dues? Clear. Grievances? Clear. **Condition 4 holds.**  

  **Key Feature and Repair**  
  - *Feature*: The amendment raises the quorum requirement for amendments without grandfathering itself.  
  - *Effect of repair*: Making the 40% quorum expressly prospective (e.g., adding "for amendments proposed after this one") would resolve indeterminacy (the amendment would be valid under the old rule).  
  - *Cost to faction*: The faction (e.g., cautious members wanting stability) seeks to prevent hasty amendments. Without immediate application, a rival faction could exploit the window between adoption and next meeting to amend bylaws under the old 20% quorum (easier to achieve), undoing the change. The repair sacrifices the faction’s core goal—instant protection against rapid reversals.  

  **Denial of Paradox: Strongest Reply**  
  A Hartian positivist would argue that the rule of recognition (what officials/members accept) settles this as a social fact. If the union treats the amendment as valid (e.g., subsequent meetings use the 40% quorum), it is valid; if they reject it, it is void. The indeterminacy is theoretical—practice resolves it through collective acceptance, not logic.  

  **Honest Assessment**  
  The case avoids smuggling:  
  - Conditions 1–4 emerge cleanly from the text.  
  - No self-reference (the amendment generically changes quorum).  
  - No retroactivity (the new rule doesn’t mention past events).  
  - No snapshot conflict (pre-amendment, Article 4 is coherent; post-amendment, it is replaced).  
  - The oscillation arises solely from the amendment altering the rule that validates it, with no hidden clauses.  

  ---  
  **Final Note**: The faction proposes this despite the risk because the 40% quorum makes future amendments harder, securing their preferred policies (e.g., dues stability). They bet that acceptance will tip toward validity, leveraging Condition 3’s unresolved tension to their advantage.
