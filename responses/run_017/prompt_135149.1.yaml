answer: |-
  ## Project Proposal: When Free Information Costs You

  **The Core Question:**  
  Good's theorem—the bedrock result that freely available information can never have negative expected value for a Bayesian agent—relies on a simple escape hatch: you can always ignore the information and stick to your original plan. This seems unassailable. Yet, we know information *can* hurt in specific, well-studied scenarios: strategic interactions (where others react to your knowledge), belief-dependent utilities (where knowing causes anxiety), or non-expected utility settings (where you can't commit to ignoring it). I propose investigating a distinct, underexplored category where this escape hatch *fundamentally malfunctions*: situations involving **endogenous signals**. Specifically, **when does the reliability or meaning of a free signal depend critically on whether the agent chooses to consult it in the first place?** My goal is to identify a nontrivial class of such decision problems where consulting a free signal provably yields *negative* expected value, and characterize the key features (signal structure, agent response rule) driving this negativity.

  **Why This Isn't Covered by Existing Escapes:**  
  This proposal directly addresses anticipated objections:

  1.  **"Isn't this just a one-player strategic game?"** No. Strategic models involve *other* agents whose actions depend on the focal agent's information state. Here, the "adversary" is the signal's own reliability structure, which changes based solely on the focal agent's *choice to acquire the signal* and their subsequent *response to it*. There is no second strategic player; the feedback loop is purely internal to the agent-signal system.
  2.  **"Isn't this just preference change?"** Not in the standard sense. The problem isn't that utilities shift *exogenously* over time or due to the passage of time/knowledge itself. The issue is that the *content* of the signal – what it tells the agent about the state of the world relevant to their fixed preferences – is causally entangled with the agent's act of consulting and responding to it. The signal doesn't reveal independent facts; it reveals facts *whose truth conditions are perturbed by the act of revelation*.
  3.  **"Doesn't belief-dependent utility cover this?"** Only superficially. Belief-dependent utility models focus on the *cost or benefit of holding beliefs themselves* (e.g., anxiety). Here, the harm stems entirely from the *causal impact* of learning the signal's *content* on the world state the signal purports to describe. The phenomenology of "knowing" is irrelevant; it's the world-altering consequence of the specific knowledge gained that creates the potential harm.

  **The Core Example & Mechanism:**  
  Consider a highly accurate career-counselling test. Based on a population sample, it predicts whether an individual would be happier in Career A or Career B. Crucially, an individual's *actual* happiness in a chosen career is partly shaped *by* living that life (tastes adapt, skills develop, identities form). If the agent *sees* the test result ("A" or "B") and acts on it, their subsequent life experience validates or invalidates the prediction *differently* than if they had never taken the test and chosen based on prior beliefs. The test's accuracy profile (its signal structure) was calibrated on people who *saw and followed* its advice. If our agent ignores the advice, the calibration data becomes invalid. If they follow it, the act of following alters the outcome being predicted. This creates a fixed-point problem: the value of consulting the signal depends on how the agent responds, but the optimal response depends on the signal's reliability, which depends on the response... ad infinitum. **This endogenous feedback loop between signal acquisition/response and signal reliability is the novel mechanism under investigation.**

  **Methodology & Timeline (4 Months):**  
  I will develop a minimal formal model capturing the core endogenous signal dynamic:

  1.  **Setup (Month 1):** Two possible acts (A, B). Two possible underlying states (S_A, S_B) representing "true fit" (e.g., where the agent *would* be happiest absent interference from the signal). Fixed prior beliefs over states. Fixed utilities (U(A|S_A), U(A|S_B), U(B|S_A), U(B|S_B)).
  2.  **The Endogenous Signal (Month 1):** A binary signal (X = "A", "B"). Crucially, the signal's conditional probability distribution P(X | State) is **not fixed**. It depends on the agent's *"information policy"* – specifically, whether they consult the signal (C) or not (¬C), *and* their *response function* R(X) mapping the signal (if seen) to a (possibly mixed) act.
  3.  **Agent Choice & Value (Month 2):** The agent has three meta-choices:
      *   **Don't Consult (¬C):** Chooses an act based solely on priors (e.g., the optimal prior act). Value = V(¬C).
      *   **Consult & Ignore (C&I):** Pays cost 0 (free signal), sees X, but ignores it, choosing the same act as ¬C. Value = V(C&I) = V(¬C) - ? (The key question!).
      *   **Consult & Respond (C&R):** Pays cost 0, sees X, chooses act based on R(X). Value = V(C&R | R).
  4.  **Fixed-Point & Expected Value of Consulting (Months 2-3):** The expected value of consulting the signal (and potentially responding), EV(Consult), depends on V(C&I) and V(C&R | R). However, V(C&I) and V(C&R | R) themselves depend on P(X | State), which depends on the agent's *overall* choice (whether they Consult & Respond, Consult & Ignore, or Don't Consult). **I will solve for the fixed points in the agent's choice.** The critical comparison is between V(¬C) and the achievable value when consulting is an option (max over R of the value achievable at the fixed point consistent with choosing C&R or C&I).
  5.  **Analysis (Months 3-4):** I will:
      *   Formalize specific dependence structures (e.g., P(X="A" | S_A) = f(R) ).
      *   Solve for equilibria (fixed points of R and the choice to consult/not).
      *   Calculate V(¬C) and EV(Consult) at these equilibria.
      *   Identify necessary/sufficient conditions on f(R) and the utility structure for EV(Consult) < V(¬C).
      *   Characterize the nature of the harmful signals and the response rules that lead to harm or prevent it.

  **Why this model?** The two-act/two-state/binary-signal setup is the simplest frame capable of capturing the endogenous feedback loop. It allows rigorous analysis of fixed points and value comparisons without unnecessary complexity. Including mixed responses captures the possibility of "hedging" against the signal's influence. Focusing on the dependence of `P(X|State)` on `R` directly targets the core endogeneity.

  **Expected Outcomes & Failure Modes:**  
  *   **Positive Result:** Identification of a concrete class of endogenous signal structures (specified by `f(R)`) and decision problem parameters (utilities, priors) where, in equilibrium, `EV(Consult) < V(¬C)`. Characterization of the key drivers: e.g., strong self-fulfilling propensity combined with high stakes for choosing "wrong" based on an unreliable signal *caused* by consulting it. A clear demonstration of how the "ignore" option fails as an escape hatch because its very use changes the world.
  *   **Failure Mode 1 (Boring):** The model reduces to a known phenomenon. For instance, if specific `f(R)` functions simply replicate a standard belief-dependent utility effect or a trivial preference change scenario. *Mitigation:* The model is explicitly designed to avoid known cases; focus will be on `f(R)` that directly link signal reliability to the agent's behavioral response in a way that alters the *content* of the signal about the world state.
  *   **Failure Mode 2 (Interesting):** The value `EV(Consult)` is not well-defined without an external equilibrium selection rule. Multiple fixed points exist (e.g., "Always follow the signal" and "Always ignore the signal" are both self-consistent), with different values. `EV(Consult)` might be negative in *some* equilibria but not others, making the core question ("*can* it be negative?") ill-posed without refinement. *This itself would be a significant finding:* It reveals a fundamental indeterminacy or context-dependence in valuing information with strong endogenous feedback. The project would then shift to characterizing these equilibria and the selection problem.

  **Broader Significance:**  
  Understanding when information gathering can be actively harmful due to its self-referential impact is crucial beyond abstract decision theory. Consider:

  1.  **Algorithmic Recommendation & Prediction:** Personality tests, career aptitude tools, health risk scores, or content recommendation algorithms often shape user behavior. If user *reaction* to the prediction alters the underlying reality being predicted (e.g., a "low aptitude" score discouraging effort and thus *creating* low aptitude; a music recommendation narrowing taste development), the tool's value – or harm – depends endogenously on its own deployment. This project provides a formal lens to analyze such feedback loops.
  2.  **Diagnostics & Self-Fulfilling Prophecies:** Tests predicting psychological states, educational potential, or social outcomes can trigger reactions that validate the prediction. Recognizing the conditions under which such tests might have negative expected value for the *individual* taking them is vital for ethical deployment and informed consent.
  3.  **Foundational Clarity:** It sharpens the boundaries of Good's theorem, revealing a distinct class of exceptions grounded in self-reference rather than external agency or belief dynamics. This deepens our understanding of the value and risks inherent in information acquisition itself.

  **Scope and Contingencies:**  
  The core deliverable is a formal model and analysis answering the primary question within the minimal two-act/two-state/binary-signal framework. **Key Scope Boundaries:**

  *   Focus is on *individual* decision-making, not multi-agent strategy.
  *   Utilities are fixed and state-dependent, not belief-dependent.
  *   Signals are free and perfectly recalled.

  **Contingency Plans:**

  *   **If Formalization Proves More Complex (Month 1-2):** Prioritize finding *any* clear numerical example demonstrating `EV(Consult) < V(¬C)` within the minimal model before pursuing full characterization. Simplify the dependence `f(R)` to the most tractable non-trivial case.
  *   **If Time Runs Short (3 Months):** Focus exclusively on characterizing the harmful cases (`EV(Consult) < V(¬C)`) and their drivers, potentially sacrificing a full analysis of the "ignore" option (C&I) or mixed strategies. Ensure at least one robust counterexample exists.
  *   **If Failure Mode 2 Dominates (Month 3):** Pivot to rigorously analyzing the multiplicity of equilibria and the consequent ambiguity in defining the expected value of information, making this the core result.

  **Terminology Note:**  
  I will use **"endogenous signals"**. "Self-referential signals" risks misleading by suggesting the signal's content is *about* the agent's mental state (beliefs, desires) or the decision process itself. The core issue here is that the signal's *reliancy* (its probabilistic link to the external state of interest) depends causally on the agent's behavioral *response* to acquiring the signal. "Endogenous" accurately captures this causal dependence of the signal's properties on the agent's actions within the decision problem.
