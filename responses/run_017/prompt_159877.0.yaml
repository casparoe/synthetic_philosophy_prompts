prompt: |-
  Six weeks ago my co-founder and I shut down the company we had spent four years and most of our savings on, and the post-mortem has turned into a somewhat unwanted education in escalation of commitment. As penance, the incubator that housed us has asked us to run a forty-five minute session for about fifteen first-time founders on why intelligent people keep paying into failing projects. So the topic is not academic for me right now — but I want the session to be conceptual rather than confessional, and I'd rather you did not coach me about my own case. Treat me as an instructor preparing a session.

  You are a philosopher of action and decision theorist who has also taught judgment and decision making to managers, and who has thought hard about where the rational-choice story and the psychological story come apart. Please think carefully and brainstorm before you commit: I would like, first, two or three candidate orderings for the session with the one thing each of them loses, and only then the ordering you recommend and why.

  The plan I want has these parts.

  One: the dependency structure. What has to be in place before what? In particular, I want the bookkeeping point (money already spent is gone and cannot be recovered) kept visibly distinct from the forward-looking point (whether the remaining cost is worth paying for the remaining chance), and I want to know which of the two has to be secured first and whether securing the first makes the second harder to teach. I also want escalation separated from neighbouring things it gets confused with: plain risk-seeking in the domain of losses, the option value of genuinely continuing, consistency as a virtue, and the sunk-cost slogan itself.

  Two: the carrying example. I was going to use the dollar auction — a dollar sold to the highest bidder on the rule that the runner-up also pays what they bid — but I have two worries. First, it is a two-player game with a fixed prize and a locally rational next step, whereas the phenomenon I am trying to get at is single-agent: the person you are bidding against is, in some sense, your own earlier self. I want you to say whether that mismatch is fatal or whether it can be turned into the thing that makes the example work, and how. Second, I have been toying with two modifications and would like you to pick between them or reject both. In the bridge-round variant, at any point a bidder may bring in a backer who covers half of the next increment in exchange for half of the eventual prize. In the growing-pot variant, each bid adds to the prize rather than merely chasing it. Tell me what the carrying example must have and must lack if it is to do the work here — I suspect it must have a step that is locally rational, so nobody dismisses the escalator as a fool, and it must lack any pre-declared budget or fixed number of rounds, so the audience cannot lean on a rule instead of seeing the trap. Correct me if that is wrong.

  Three: the misconception map, in the order these founders will actually form them, and where in the sequence each should be headed off. My candidate list, which you should cut down, re-order and add to: that the moral is simply ignore sunk costs, which they will over-apply and use to abandon projects whose remaining costs really are worth paying — the mirror-image error, and the one I most want prevented; that escalation is irrational by definition, which sits badly with each step of the auction being defensible; that perseverance is constitutive of being a founder, so that any anti-escalation message will be heard as an attack on their identity and defended against rather than examined; and that the fix is a pre-committed stop-loss, when the difficulty is that the threshold you would need to write down depends on information you only get later. There is also a notion I have started calling the completion gradient: the pull to continue seems to grow with the proportion of the project already finished, even while the absolute remaining cost is growing too. Tell me where that sits — a separate mechanism, a redescription of sunk cost, or a confusion of fraction-completed with probability of success — and whether it should be named out loud at this level or left implicit.

  Four: the check. Give me one question to end on whose answer distinguishes someone who has the structure from someone who has absorbed a slogan, and tell me what a confidently wrong answer to it will sound like.

  Five: what I should openly refuse to explain in forty-five minutes to this audience, and say so from the podium. I have in mind the formal apparatus of backward induction and subgame perfection, the shape of a prospect-theoretic value function, the self-justification and self-presentation literature, and above all any general rule for knowing when to quit — but tell me if I am cutting in the wrong place.
reasoning: |-
  Hmm, the user is a founder preparing a session on escalation of commitment for other first-time founders. They've just shut down their company after four years and significant personal investment, so this topic is deeply personal but they want the session to be conceptual rather than confessional. They need help structuring a 45-minute session for about 15 people.

  The user has outlined five key components they want covered: dependency structure of concepts, a carrying example (like the dollar auction), misconception mapping, a check question, and boundaries for what not to cover. They're clearly experienced and thoughtful about this - they've identified nuanced distinctions like separating sunk costs from forward-looking assessments, and want to prevent mirror-image errors where founders abandon viable projects by overapplying "ignore sunk costs."

  For the carrying example, they're considering dollar auction variations but worry about its two-player nature. I'll need to reframe it as a single-agent problem where you're bidding against your past self. The modifications they suggest (bridge-round or growing-pot) might actually help make the escalation more visceral. The key is preserving local rationality at each step while removing escape hatches like fixed budgets.

  The misconception mapping is crucial. Founders will likely conflate perseverance (part of their identity) with irrational escalation. The "completion gradient" phenomenon they mention - where the pull to continue increases with proportion completed - deserves explicit naming as a distinct cognitive trap, probably rooted in probability misestimation.

  For session flow options, I'll consider three approaches: starting with the visceral auction experience (risking oversimplification), building concepts logically from sunk costs (which might reinforce the very confusion we're fighting), or anchoring in founder identity first (which could backfire if not handled carefully). The recommended flow should probably start with the auction to create tension, then dismantle misconceptions, then reinforce with structural analysis.

  Boundaries are vital - no time for prospect theory or backward induction. We'll explicitly rule out giving a "when to quit" formula while equipping founders to ask better forward-looking questions. The closing check question should force application of the dependency structure, like asking them to evaluate a scenario where sunk costs are high but future costs are justified.

  Throughout, we must maintain rigor while respecting that these are smart people processing recent failure. The tone should be clinical but compassionate, avoiding any whiff of condescension. The goal isn't to diagnose their past decisions but to immunize against future escalation traps.
answer: |-
  Here’s a structured plan for your 45-minute session, designed for conceptual clarity and actionable insights. I’ll first outline candidate session orderings, then recommend the optimal flow with rationale.

  ---

  ### **Candidate Session Orderings & Tradeoffs**
  1. **Option 1: "Carrying Example → Dependency Structure → Misconceptions"**  
     - **Flow**: Start with the dollar auction (modified), derive concepts from visceral experience, then debunk misconceptions.  
     - **Gains**: Immediate engagement; demonstrates escalation *in vivo*.  
     **Loses**: Risk of oversimplification ("Just avoid auctions!") before conceptual foundations are laid.  

  2. **Option 2: "Dependency Structure → Misconceptions → Carrying Example"**  
     - **Flow**: Define rational decision anatomy first, preempt misconceptions, then use example to reinforce.  
     **Gains**: Builds logical scaffolding; misconceptions are preemptively disarmed.  
     **Loses**: May feel academic early; audience might not *feel* the trap until later.  

  3. **Option 3: "Founder Identity → Carrying Example → Dependency Structure"**  
     - **Flow**: Start with identity-driven perseverance ("Why founders escalate"), use example to show trap, then dissect logic.  
     **Gains**: Addresses emotional resistance upfront; frames escalation as identity hijack.  
     **Loses**: May conflate identity with irrationality early, muddying conceptual distinctions.  

  ---

  ### **Recommended Ordering: Option 1 (Refined)**  
  **Why**:  
  - **Psychological Primacy**: The auction creates shared experience, making abstract concepts tangible.  
  - **Progressive Unpacking**: Use confusion from the example to drive demand for clarity (dependency structure).  
  - **Misconceptions Last**: Debunk *after* tools are in place, avoiding "slogan over substance."  

  ---

  ### **Session Structure (45 Min)**  
  #### **1. Carrying Example: The Dollar Auction (10 min)**  
     - **Use the "Growing-Pot" variant**: Each bid increases the prize (e.g., start at $1, each bid adds $0.50).  
       - *Why*: Eliminates fixed prize, mimics startup "vision inflation." Locally rational ("One more bid might win it all").  
     - **Single-Agent Reframe**: "You’re bidding against your past commitments. Each bid is a new ‘you’ deciding *now*."  
     - **Crucial Elements**:  
       - ✅ Locally rational steps (no "fools").  
       - ❌ No budgets/fixed rounds (forces confrontation with the trap).  
       - ❌ Reject bridge-round (adds complexity, dilutes core mechanism).  

  #### **2. Dependency Structure (15 min)**  
     - **Sequence**:  
       - **Step 1: Sunk Costs ≠ Decision Criteria**  
         - "Money spent is gone. Your only question: *From here*, is the future cost worth the future gain?"  
         - *Tool*: "Decision boundary = Today."  
       - **Step 2: Forward-Looking Cost-Benefit**  
         - "Ignore past investment. Estimate: (i) Remaining cost, (ii) Revised probability of success, (iii) Updated payoff."  
         - *Separation from Neighbors*:  
           - 🚫 Not risk-seeking: Escalators *avoid* admitting loss, don’t seek risk.  
           - 🚫 Not option value: Option value is rational; escalation isn’t.  
           - 🚫 Not consistency: Consistency is virtuous *only* when rationally justified.  

  #### **3. Misconception Map (15 min)**  
     - **Order of Attack** (sequenced to preempt natural founder reasoning):  
       1. **"Perseverance = Founder Identity"**  
          - *Preempt early*: "Founders *should* persist — but against obstacles, not evidence. Escalation hijacks your best trait."  
       2. **"Escalation = Irrational by Definition"**  
          - *After auction*: "Each step felt rational. The trap is *structural*, not stupidity."  
       3. **"The Fix: Pre-Commit to Stop-Losses"**  
          - *After dependency*: "Stop-losses fail when thresholds depend on new info (e.g., '90% done' ignores that last 10% may cost 200%)."  
       4. **"Ignore All Sunk Costs" (Mirror-Error)**  
          - *Last*: "Abandoning a project with *positive* future NPV is just as irrational! Sunk costs are irrelevant, but future costs matter."  
     - **Completion Gradient**:  
       - Name it explicitly.  
       - *Mechanism*: Distinct from sunk cost fallacy. It’s a cognitive error:  
         > "Mistaking *progress* (e.g., 80% code complete) for *probability* (e.g., 80% chance of success)."  

  #### **4. The Check Question (3 min)**  
     - **Q**: *"Your project is 80% done but needs 2x the original budget. Past costs are $1M. How do you decide whether to continue?"*  
     - **Confidently Wrong Answer**:  
       - "We’ve spent $1M already — we can’t quit now!" (Sunk cost fallacy)  
       - "Sunk costs are irrelevant — we walk away immediately." (Mirror error; ignores future NPV)  
     - **Right Answer**:  
       - "Ignore the $1M. Estimate: (i) Cost to finish, (ii) Current success odds, (iii) Potential payoff. If (ii) * (iii) > (i), continue."  

  #### **5. What to Refuse (2 min)**  
     - **Explicitly Exclude**:  
       - Formal game theory (backward induction/subgame perfection).  
       - Prospect theory curves.  
       - Social psychology (self-justification).  
       - *Any universal "when to quit" rule*.  
     - **Why**: "These are tools for *analysis*, not *deciding*. Today is about the core structure of the trap."  

  ---

  ### **Why This Works**  
  - **Psychological Hooks**: Auction creates tension; misconceptions addressed in order of emotional salience.  
  - **Conceptual Integrity**: Dependency structure precedes misconceptions, preventing slogan-thinking.  
  - **Founder-Centric**: Acknowledges identity without conceding to bias.  
  - **Time-Efficient**: Focuses on high-leverage distinctions.  

  **Key Delivery Note**: Position yourself as a fellow traveler ("I teach this because I needed it"), not a confessor. Your credibility comes from rigor, not retrospective pain.  

  Would you like slides, script snippets, or participant exercises to match this flow?
