prompt: |-
  you're a metaethicist who's spent way too much of your career on evolutionary debunking arguments — take that role seriously, and brainstorm the space of candidate rules before you commit to anything.

  My supervisor is writing a book on evolutionary debunking in metaethics and she's got a stack of verdicts on particular moral beliefs. For each one she supplies a selective story and then says whether that story debunks the belief:

  - horror at consensual adult incest (story: inbreeding avoidance hitched to pathogen disgust): debunked
  - special obligations to your own children (kin selection): debunked
  - duty to reciprocate favours and resentment at free-riders (reciprocal altruism, partner choice): debunked
  - gratuitous cruelty is wrong: not debunked
  - promising really does generate obligations: not debunked
  - the excuse we give people who literally could not have done otherwise: not debunked

  Now the new case she has to rule on. Take the near-universal judgment that whether someone brought a harm about intentionally makes a difference to how wrong it was — killing a person as a foreseen side effect of something good gets treated very differently from killing them as a means. Suppose the genealogy is this: selection favoured agents who could tell a clumsy ally from a dangerous one by tracking whether the harm was chosen, so we ended up with an intent-sensitive blame system that then got moralised; nothing in that story needs it to be true that intentions matter intrinsically. And suppose the judgment turns up in every society that's been tested and in quite small children.

  What do you think she says? I care much less about the yes/no than about the rule she's running: give me the two or three rules that fit all six earlier verdicts, say what each one predicts here, pick one and say why. Please don't just name-drop the usual tracking / indispensability / fixed-point moves — I've read them; I want them cashed out as rules that actually decide this case. Also, doesn't her verdict on the kids case already tell against one of the rules? And what further case would cleanly seperate the ones that survive? I was thinking of something impartial in content but with an obviously fitness-tracking genealogy and no big load-bearing role in deliberation — our conviction that the guilty deserve to suffer in proportion, say, with the standard costly-punishment story. Would that do it, or is there something better?
reasoning: |-
  Okay, the user is presenting a complex metaethics scenario involving evolutionary debunking arguments. They're role-playing as a supervisor's assistant who needs to predict how the supervisor would rule on a new case about intent-sensitive moral judgments. 

  First, I need to unpack what's being asked. The user has provided six precedent cases with clear debunked/not-debunked verdicts, and now wants to know how a new case (intentional harm distinction) should be classified under consistent rules. The challenge is deriving meta-rules from the pattern of existing verdicts.

  Looking at the precedents, three patterns jump out: 
  The debunked cases (incest horror, kin obligations, reciprocity) all involve social coordination mechanisms that enhance fitness but don't necessarily track moral truth. 
  The non-debunked cases (gratuitous cruelty, promising, impossibility excuse) seem resistant to evolutionary explanation - they're either too fundamental or play indispensable roles in moral reasoning. 

  Hmm... the kin selection case is particularly telling because it's fitness-enhancing yet debunked, while the cruelty judgment isn't fitness-dependent yet survives. That suggests the supervisor isn't using simple "adaptive = debunked" or "cultural universal = justified" rules. 

  For the new intent-sensitivity case: the described genealogy clearly shows adaptive origins for tracking intentions (ally assessment). But unlike the reciprocity case which was debunked, intent-sensitivity might be indispensable for core moral concepts like responsibility. That creates tension - which rule dominates?

  The user's proposed test case about desert-based punishment is smart. If the supervisor debunks proportional punishment (despite its deliberative role) but preserves intent-sensitivity, that would clarify whether deliberative indispensability trumps all. But if both get debunked, that points back to the tracking rule. 

  I should flag the kids-case complication too - the "couldn't have done otherwise" excuse appears early in development like intent-sensitivity, yet wasn't debunked. So mere early emergence or universality can't be the decisive factor. That sinks any simple nativist rule. 

  What the user really wants isn't just an answer for this case, but a methodology their supervisor consistently applies. They're frustrated with hand-wavy metaethical labels and want operationalizable decision rules. The desert-punishment test case shows they're thinking several moves ahead - good engagement with the material.
answer: |-
  Based on your supervisor's pattern of verdicts and the constraints, here are the three most plausible candidate rules that fit all six prior cases, their predictions for the intent-sensitivity case, and a proposed test case:

  **Candidate Rules & Predictions:**

  1.  **The Deliberative Indispensability Rule:**
      *   **Rule:** A moral belief is debunked *only if* its evolutionary genealogy shows it is *dispensable for rational moral deliberation*, even if it were false. If the belief plays an ineliminable role in making coherent sense of our moral experiences, practices, and reasoning (even post-genealogy), it stands.
      *   **Fits Precedents:**
          *   Debunked: Incest disgust, kin obligations, reciprocity resentment. These are specific *contentful norms* tied to adaptive problems. We can *conceive* of coherent moral systems without them (e.g., prioritizing impartiality over kin, forgiveness over resentment, ignoring incest taboos). Their loss wouldn't cripple moral reasoning itself.
          *   *Not* Debunked: Wrongness of gratuitous cruelty, bindingness of promises, "couldn't have done otherwise" excuse. These are foundational to core moral concepts like harm, obligation, responsibility, and excuse. Denying them makes moral deliberation incoherent (e.g., "Why is *any* harm wrong?", "How can commitments bind?", "What does responsibility even mean without control?").
      *   **Prediction for Intent-Sensitivity:** **NOT Debunked.** Distinguishing intended vs. foreseen harm is indispensable for core concepts of agency, responsibility, blameworthiness, and the very meaning of "doing harm." Eliminating it would cripple our ability to make sense of moral distinctions in action (e.g., self-defense vs. murder, triage vs. sacrifice). The genealogy explains *why* we have this *capacity*, not why it's *unreliable* for deliberation.
      *   **Kids Case Relevance:** The "couldn't have done otherwise" case surviving directly supports this rule – it's an early-emerging, fundamental component of responsibility ascriptions, indispensable for deliberation.

  2.  **The Tracking Failure Rule (Strong Interpretation):**
      *   **Rule:** A moral belief is debunked if its evolutionary genealogy shows it was selected *primarily for fitness-enhancing coordination/social stability effects*, and there is *no plausible causal mechanism* by which the belief-forming process could have tracked mind-independent moral truths *in virtue of its adaptive function*. Survival requires evidence the trait *could* track truth *because* of its adaptive link to truth-relevant features.
      *   **Fits Precedents:**
          *   Debunked: Incest disgust (tracks pathogens, not intrinsic wrongness), kin obligations (tracks genetic relatedness, not intrinsic specialness), reciprocity resentment (tracks cooperation stability/free-rider detection, not intrinsic desert). The adaptive function (avoid disease, enhance kin survival, stabilize cooperation) doesn't require tracking moral truth; social coordination suffices.
          *   *Not* Debunked: Wrongness of gratuitous cruelty (direct link to suffering – a plausible moral truth-maker; avoiding wanton cruelty plausibly tracks truth *by* preventing suffering), bindingness of promises (link to expectation/trust violation – a plausible wrong-maker; maintaining trust plausibly tracks truth *by* upholding fidelity), "couldn't have done otherwise" excuse (link to control/agency – a plausible condition for blame; excusing lack of control plausibly tracks truth *by* reflecting genuine lack of responsibility). The adaptive success *depends* on tracking features (suffering, broken trust, lack of control) that are *candidates* for moral relevance.
      *   **Prediction for Intent-Sensitivity:** **DEBUNKED.** The genealogy shows the capacity was selected for accurately distinguishing clumsy vs. treacherous allies (a fitness-relevant social coordination task). While it tracks *agency* (intentional action), there's no mechanism in the story suggesting this tracking *also* reliably connects to the *intrinsic moral significance* of intentions *as such*. The function is partner assessment, not moral truth detection. Fitness is enhanced by accurate *causal/agential* discrimination, not necessarily by grasping mind-independent moral facts *about* intentions.
      *   **Kids Case Relevance:** The "couldn't have done otherwise" case surviving fits because the adaptive function (assigning blame efficiently, avoiding costly errors) *could* plausibly involve tracking the truth-relevant feature of *actual control/ability*.

  3.  **The Content-Specific Genealogical Vulnerability Rule:**
      *   **Rule:** A moral belief is debunked if its evolutionary genealogy reveals a *specific, contingent, fitness-linked content bias* that is *parochial* (serves narrow in-group interests or solves a specific ancestral problem irrelevant to moral truth) and *distorting* (likely to generate false positives/negatives regarding impartial moral truth). Beliefs arising from mechanisms tracking more *general* features of agency, harm, or social interaction (even if evolved) are resilient.
      *   **Fits Precedents:**
          *   Debunked: Incest disgust (parochial: specific trigger (kin+sex) hijacking disgust; distorting: overgeneralizes pathogen avoidance to moral condemnation), kin obligations (parochial: biases towards genetic kin; distorting: discounts impartial obligations), reciprocity resentment (parochial: focuses on direct partners/free-riders within group; distorting: can lead to vengefulness, ignores systemic injustice).
          *   *Not* Debunked: Wrongness of gratuitous cruelty (general: tracks core harm/suffering), bindingness of promises (general: tracks fidelity/expectations inherent in commitment), "couldn't have done otherwise" excuse (general: tracks control/causality – fundamental to agency).
      *   **Prediction for Intent-Sensitivity:** **NOT Debunked.** The capacity tracks a *general* feature of agency and action-description (intentionality vs. side-effect) fundamental to understanding *any* agent's conduct. It's not parochial (applies universally to agents) and isn't distorting in a way specific to contingent ancestral problems – it's a basic tool for interpreting actions morally. The genealogy explains its origin, not a specific content bias.
      *   **Kids Case Relevance:** The excuse surviving fits as it tracks the general feature of control, not a parochial bias.

  **My Recommendation & Why:**

  I believe your supervisor is most likely using **Rule 1: The Deliberative Indispensability Rule.**

  *   **Why it fits best:** It cleanly captures the distinction between the debunked cases (specific, contingent norms we can deliberate *without*) and the non-debunked cases (foundational concepts necessary *for* deliberation). The kids case ("couldn't have done otherwise") is a *strong* point in its favor, as is the survival of gratuitous cruelty and promises – all seem bedrock to moral reasoning. The rule focuses on the *role* of the belief *now* in our moral framework, even granting its evolutionary origin.
  *   **Prediction:** She says the intent-sensitivity belief is **NOT Debunked.** Its role in distinguishing agency, purpose, and responsibility is indispensable for coherent moral judgment, regardless of its origin in partner assessment. Denying it makes core moral distinctions unintelligible.

  **Why the Others Are Less Likely (Given Precedents):**

  *   **Rule 2 (Tracking Failure - Strong):** Struggles with the "couldn't have done otherwise" case. The genealogy for the excuse plausibly involves tracking control (a truth-relevant feature), but the *intent-sensitivity* genealogy also involves tracking agency (another truth-relevant feature). Why debunk one capacity tracking a truth-relevant feature (intentionality) but not the other (control)? The precedents don't provide a clear principle for distinguishing *which* evolved capacities for tracking agency/harm features count as truth-tracking enough. Rule 1 provides a clearer distinction based on deliberative role.
  *   **Rule 3 (Content-Specific Vulnerability):** Is plausible, but the distinction between "parochial/distorting" and "general" can be fuzzy. Is reciprocity resentment *really* more parochial/distorting than intent-sensitivity? Both deal with social interaction. Rule 1's "indispensable for deliberation" seems a sharper criterion evidenced by the precedents.

  **The Perfect Further Test Case: Proportional Desert ("Guilty deserve to suffer in proportion")**

  *   **Genealogy:** Standard costly punishment story – evolved to stabilize cooperation by deterring defection through credible, proportional threats (punishment cost signals commitment).
  *   **Rule 1 (Indispensability) Prediction:** **DEBUNKED.** While retributive intuitions are strong, coherent moral frameworks (e.g., pure consequentialism, rehabilitation-focused) can and do function without the belief that suffering *intrinsically* balances moral wrongness. It's not indispensable for deliberation about justice, punishment, or harm; alternative justifications (deterrence, rehabilitation, restitution) are available.
  *   **Rule 2 (Tracking Failure) Prediction:** **DEBUNKED.** The capacity was selected for maintaining cooperation via credible deterrence. There's no plausible mechanism by which this process tracks the *intrinsic moral desert* of proportional suffering. It tracks deterrence efficacy and commitment signaling.
  *   **Rule 3 (Vulnerability) Prediction:** **DEBUNKED.** The belief exhibits a specific, contingent content bias (linking suffering to moral balancing) likely distorting (can lead to excessive cruelty, neglects forward-looking justifications) and parochial (strong in-group bias, focuses on individual transgressors vs. systemic issues).
  *   **Why it Separates Rules 1 & 3 from Rule 2?** This case doesn't separate them; all three rules likely predict "Debunked." Its primary value is confirming that *none* of the rules treat "strong, universal, fitness-linked" as sufficient for survival. It reinforces the pattern that contingent social coordination mechanisms, even fundamental-seeming ones like retribution, are vulnerable.
  *   **A Better Separator?** Consider a belief like **"Pain is bad (for the one experiencing it)."**
      *   *Genealogy:* Pain avoidance is ancient, predating complex morality, selected for injury prevention. Moralized aversion to causing pain builds on this.
      *   *Rule 1 (Indispensability):* **NOT Debunked.** Utterly foundational to the concept of harm/prudential good. Impossible to deliberate coherently about morality without this.
      *   *Rule 2 (Tracking Failure):* **NOT Debunked.** Avoiding pain *directly tracks* a plausible intrinsic bad (suffering). Fitness enhancement *relies* on tracking this bad state.
      *   *Rule 3 (Vulnerability):* **NOT Debunked.** Tracks a general feature of sentient existence (suffering), not a parochial bias.
      *   *The Challenge:* All rules agree. To separate Rule 1 from Rules 2 & 3, we'd need a belief tracking a plausible truth-maker *and* being general, but which *is* dispensable for deliberation. This is very hard! Perhaps a belief like **"Beauty is intrinsically morally good."** (Genealogy: sexual selection, indicator of health/genes). Rule 1 might debunk it as non-essential; Rules 2 & 3 might preserve it if beauty tracks fitness/health (a good) and is general. However, this is less core than the cases given. Your proportional desert case remains excellent for showing the *limits* of what survives, consistent with all plausible rules derived from the precedents.

  **Conclusion:** Based on the pattern, especially the survival of the control-based excuse, your supervisor likely uses the **Deliberative Indispensability Rule** and would rule that the intent-sensitivity belief is **NOT Debunked.** The proportional desert case cleanly tests whether all three rules agree on debunking a core but contingent coordination norm.
