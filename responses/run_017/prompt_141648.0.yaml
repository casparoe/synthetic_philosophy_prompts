answer: |-
  ### CHANGELOG.md  
  **Maintainer:** `caryb`  
  **Library:** `TransparentPrisoners vX.X`  

  ---

  #### v0.1 (2019-04-01)  
  * Initial release.  
  * Added `LöbianCooperator`: Cooperates iff it can prove (in Peano Arithmetic + axioms for opponent behavior) that the opponent cooperates.  
  * README claims this "resolves" the Prisoner’s Dilemma via Löbian handshake.  
  * **Note:** 78% of matches timed out (default 5s compute budget).  

  #### v0.2 (2019-06-14)  
  * Patched `LöbianCooperator` to defect against unconditional cooperators (e.g., `SaintBot`).  
  * Rationale: Avoids exploitation by bots that cooperate without proof.  
  * **Side effect:** `LöbianCooperator` now cooperates with only 3/12 entrants.  
  * Added `TimeoutDefector`: Defects if opponent’s proof search exceeds budget.  

  #### v0.3 (2019-11-30)  
  * Hardened against "vampiric" opponents (e.g., `ProofTester` which runs infinite loops).  
  * Bots now validate opponent’s proof system axioms pre-emptively.  
  * **Regression:** `LöbianCooperator` defects against all bots using ZFC (cannot audit in PA+ε).  
  * Tournament cooperation rate: 11%.  

  #### v1.0 (2020-03-22)  
  * **Stable release.**  
  * Added `PrudentBot`: Uses syntactic checks to pre-empt opponents likely to defect.  
  * README updated: "Defection refuted in theory; edge cases pending."  
  * **Note:** `PrudentBot` requires 20s compute budget to cooperate with itself.  

  #### v2.0 (2021-01-15)  
  * **BREAKING CHANGE:** Proof budgets now user-configurable (default: 10s).  
  * Added `TieredCooperator`: Cooperates only with opponents using ≥ its own compute tier.  
  * Tournament entrants sorted by declared CPU budget (ascending).  
  * README unchanged: "Mutual transparency enables cooperative equilibria."  
  * **Observation:** Top 5% compute-budget bots cooperate at 98%; others defect globally.  

  #### v2.3 (2021-08-04)  
  * Patched "Schrödinger’s Defection": Bots now precommit to output before proof resolution.  
  * Added `IroncladAuditor`: Defects if opponent’s source contains `if "cooperate" in sys.argv`.  
  * **Note:** `IroncladAuditor` cooperates with 1 opponent (`TieredCooperator v2.0+`).  

  #### v3.0 (2022-05-10)  
  * **Compute-tier leaderboard** added to results page.  
  * `TieredCooperator` now defects if opponent’s budget is < 90% of its own.  
  * README footnote: "Optimal cooperation requires aligned resource pools."  
  * **Stat:** 100% of top-tier bots defect against bottom-tier bots.  

  #### v3.1 (2023-02-28)  
  * Added `ParanoiaMode`: Bots preemptively defect if opponent’s proof system uses impredicative definitions.  
  * **Bug:** `ParanoiaMode` triggers false positives on bots using `while` loops.  
  * README quietly demotes "Löbian cooperation" to "Appendix C".  

  ---

  ### KNOWN ISSUES  
  1. **Mutual proof deadlock:**  
     Bots A and B stall indefinitely if each requires the other’s cooperation to complete their proof.  
     *Workaround:* Set `timeout < 5s`. Side effect: Both defect.  

  2. **Hardening drift:**  
     Each security patch (e.g., defecting against unauditable opponents) reduces the cooperation pool.  
     Current version cooperates with 4% of historical entrants.  

  3. **Determinism requirement:**  
     Cooperation assumes opponents are pure functions of source code. Fails if:  
     - Opponent uses `random()` (added penalty).  
     - Opponent’s hardware has cosmic-ray bitflips.  

  4. **Tier inflation:**  
     Top 0.1% of bots now demand 1hr CPU budgets. `TieredCooperator v3.0` crashes on smartphones.  

  ---

  ### FAQ  
  **Q: Why do Löbian bots defect against `AlwaysCooperate`?**  
  A: `AlwaysCooperate` doesn’t submit a proof, so it fails `LöbianCooperator`’s audit. Per the code: "No proof ⇒ defect." This is intentional hardening.  

  **Q: How does "transparency" enable cooperation?**  
  A: Per README: "Agents with shared reasoning systems can mutually verify intentions."  
  *Reality:* They mutually verify compute budgets.  

  **Q: Why does the tournament allow unlimited CPU tiers?**  
  A: The library is neutral. If rich bots cooperate only with rich bots, this is still *technically* cooperation.  

  **Q: Is defection refuted?**  
  A: The README claims: "In a transparent, deterministic, and sufficiently resourced setting, defection is instrumentally suboptimal."  
  *Note:* 96% of entrants lack "sufficient resources."  

  **Q: Can this model real-world dilemmas?**  
  A: Real-world actors rarely:  
  - Access opponents’ exact source code,  
  - Run on deterministic hardware,  
  - Or share proof systems.  
  For such cases, see `examples/opaque_mode` (all bots defect).  

  ---

  *"A proof of cooperation that requires a 4GHz CPU is still a proof."*  
  — `caryb`, closing remarks, 2023
