  What I need is a case, and here's what it has to do:

  - It's for a blog post, and its job is to make the guy I'm betting with stop saying that this is just a choice of notation and the two views are intertranslatable given the right counterpart relation. So the verdicts have to fall out of the two theories rather than me stipulating them, and the case can't cheat by building a caricature of either view into the story. If you're not sure whether a spec is satisfiable, flag it rather than fudging it.
  - Ordinary setting — a family, a school, a workplace, a small business — one paragraph, no possible worlds appearing as places inside the story, no sci-fi, and a non-philosopher should have a reaction to it. If you find yourself reaching for the standard examples (the candidate who could have won the election, the ship rebuilt plank by plank, the statue and the clay), treat that as a sign the case is too easy.
  - It should hang on a single de re modal claim about one individual — this very person, this exact committee, this particular ship could have... — not a general possibly, someone or other.
  - I want the hard direction: transworld identity says the claim is true, counterpart theory is pushed toward false, or toward indeterminate because there are several candidate counterparts and they disagree. The pressure on the counterpart theorist has to come out of the situation, not out of me stipulating a really demanding counterpart relation up front.
  - The bit I can't get to work on my own: whenever I write a version of this, the counterpart theorist just retunes the counterpart relation — more weight on origins, less on intrinsic similarity, whatever — the verdict flips, and I've got nothing. So build me a pair: the main case plus a minimally different second case, such that no single counterpart relation gets the intuitive verdict right on both. You'll have to say what you're counting as an admissible counterpart relation, and keep the constraints ones an actual counterpart theorist would grant rather than a strawman.
  - Same in the other direction: don't let the transworld identity side just stipulate that it's the same object. Make the object in the counterfactual situation differ enough — different origins, or a borderline case for the sortal, or a radical change — that they owe you a criterion for transworld identity, and tell me what else that criterion commits them to elsewhere.
  - I'm half-remembering something about the counterpart relation not having to be transitive or one-to-one, so that iterated could have been a thing that could have been... claims and uniqueness come apart. I don't know whether that's the lever I want or a red herring — say which, and why.

  Then the write-up: restate the claim semi-formally, walk through what each theory says and why, go through my specs one at a time and show the case meets them, tell me which single feature of the case is doing the work and what happens to both verdicts if I delete that feature, and give me the strongest reply from whichever theory comes out worse. Deal with the intertranslatability objection head on: does the pair actually show something, or does it just exploit a free parameter the counterpart theorist was always allowed to set?

  If the pair in the fifth bullet definetely can't be built, say so and give me the closest thing that does work instead of quietly dropping the requirement. No citations or reading list — I'll go digging for the literature myself once I know what I'm looking for. Under 900 words if you can manage it.
