  I'm retired now — thirty years as a lab geophysicist, mostly borehole data — and I got into philosophy a couple of years ago; I sit in on the decision-theory reading group at the local university. We've stalled on the absent-minded driver, and I'd rather have a document than another evening of talk.

  Setup: two indistinguishable exits off a highway, the driver can't remember passing one or tell them apart. Stopping at the first scores 0 (truck stop in the desert), stopping at the second scores 6 (the town with the hotel), missing both scores 1 (motel at the coast). A plan is one number: p, the probability of stopping at any exit he comes to.

  Draft the joint statement of an adversarial collaboration between two camps: the ex-ante camp (rationality is assessed over whole plans, from before you set off; what you'd think at the exit isn't a separate decision) and the node-level camp (rationality is assessed where the action is, given the evidence you actually have there; a plan you'd abandon on arrival is not one you can rationally adopt). I want numbered claims both could sign; then a table of the residual disagreements, each in the wording its own side would accept; then the cruxes; and for each crux one case or argument both would accept as bearing on it, with each side's prediction written down in advance. Say plainly which parts of the quarrel are only about words.

  Two things I want dealt with, neither of which anyone in the group could point me to:

  1. My own algebra. If the driver derives his belief about which exit he is at from the plan he is following (P(first) = 1/(2−p)), then the p that maximises the value computed before departure is exactly the p at which he is indifferent at the the exit between stopping now and driving on and following the plan thereafter: p = 2/5, worth 9/5 per trip ex ante and 9/4 either way once you condition on being at an exit. I tried a three-exit version and it held again. Is that general, or an artifact of my numbers?

  2. A ring-road variant. Same amnesia, but the road is a ring: miss the second exit and you come round to the first again, payoffs alternating 0 and 6 forever, and there's no last exit; run out of fuel and score 0. Now the ex-ante value is 6(1−p)/(2−p), which is strictly decreasing, so the best plan is an p as small as you like but not zero — there is no best plan — while at every single exit driving on looks strictly better than stopping. What does each camp say about that?

  American English please, and keep the notation kind to someone who reads equations slower than he used to.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps regarding the Absent-Minded Driver problem.

  The setup: A driver is on a highway with two indistinguishable exits. He cannot remember if he has passed an exit or tell the exits apart. The payoffs are:
  - Stop at the first exit: 0
  - Stop at the second exit: 6
  - Miss both: 1

  A plan is specified by a single number p (0 ≤ p ≤ 1), the probability of stopping at any exit he comes to.

  We have two camps:

  1. **Ex-ante camp**: Rationality is assessed before the trip begins (ex-ante). The driver chooses a plan (p) that maximizes the expected payoff from the perspective of the start of the trip. The driver commits to this plan and does not reconsider at the exit.

  2. **Node-level camp**: Rationality is assessed at the decision node (the exit). The driver must choose an action (stop or continue) that is optimal given the information available at that node (i.e., the evidence that he is at an exit, but not which one). A plan that the driver would abandon at the exit is not rational.

  We are to produce:

  A. A numbered list of claims that both camps can sign.

  B. A table of residual disagreements, each stated in the wording its own side would accept.

  C. The cruxes (the key points of disagreement).

  D. For each crux, one case or argument both sides accept as bearing on it, with each side's prediction written in advance.

  E. Plainly state which parts of the quarrel are only about words.

  Additionally, address two specific issues:

  1. The algebra that the driver's belief about which exit he is at is derived from the plan (P(first exit) = 1/(2-p)), and that the p that maximizes the ex-ante value (which is p=2/5, yielding 9/5) is the same p at which the driver is indifferent at the exit (expected payoff of stopping equals that of continuing, which is 9/4). And that this also held for a three-exit version. Is this general?

  2. A ring-road variant: the road is a ring, so missing the second exit brings the driver back to the first, with payoffs alternating 0 and 6 forever. Running out of fuel (with probability 1 per lap? or with a fixed fuel?) is modeled as scoring 0. The ex-ante value is 6(1-p)/(2-p), which is strictly decreasing in p, so the best plan is to take p as small as possible (but not zero, because then you never stop). However, at every exit, driving on looks strictly better than stopping. What does each camp say?

  Let's begin.

  A. Joint Claims (numbered):

  Both camps can agree on the following:

  1. The driver's goal is to maximize expected payoff.

  2. The driver has imperfect recall: he cannot remember passing an exit and cannot distinguish the exits.

  3. A plan is a strategy that specifies a probability p of stopping at any exit encountered.

  4. The ex-ante expected payoff (from the start) for a plan p is:
     V(p) = P(stop at first) * 0 + P(stop at second) * 6 + P(miss both) * 1.

     We compute the probabilities:
     - P(first exit is encountered) = 1 (always).
     - P(stop at first) = p.
     - P(not stop at first) = 1-p.
     - Then the driver reaches the second exit with probability (1-p).
     - P(stop at second) = (1-p) * p.
     - P(miss both) = (1-p) * (1-p) = (1-p)^2.

     Therefore: V(p) = 0*p + 6*p*(1-p) + 1*(1-p)^2.

     Simplifying: V(p) = 6p(1-p) + (1-2p+p^2) = 1 - 2p + p^2 + 6p - 6p^2 = 1 + 4p - 5p^2.

  5. The function V(p) = 1 + 4p - 5p^2 is a quadratic that achieves its maximum at p = 4/(2*5) = 4/10 = 2/5, and the maximum value is V(2/5) = 1 + 4*(2/5) - 5*(4/25) = 1 + 8/5 - 20/25 = 1 + 1.6 - 0.8 = 1.8 (which is 9/5).

  6. If the driver finds himself at an exit, he must assign a probability to being at the first exit. Using the plan p and the fact that the exits are indistinguishable, the probability that it is the first exit (given that he is at an exit) is:

     Let A be the event that the driver is at the first exit, and B the event that he is at the second exit. But note: the driver is always at an exit when he is making a decision. The probability of being at the first exit is proportional to the probability of reaching the first exit and making a decision there, and similarly for the second. However, the driver might be at the first exit or the second exit. The probability of being at the first exit is the probability that he has not stopped before (which is 1, because he starts at the beginning) and that he is at the first exit. The probability of being at the second exit is the probability that he did not stop at the first (1-p) and then arrived at the second.

     Therefore, the conditional probability of being at the first exit (given that he is at an exit) is:
        P(first | at exit) = P(at first) / [P(at first) + P(at second)] = 1 / [1 + (1-p)] = 1/(2-p).

     Similarly, P(second | at exit) = (1-p) / (2-p).

  7. At an exit, the expected payoff of stopping immediately is:
        If at first: 0
        If at second: 6
        So the expected payoff of stopping = P(first|at exit)*0 + P(second|at exit)*6 = 6*(1-p)/(2-p).

  8. The expected payoff of continuing (and then following the plan p) depends on which exit he is at:
     - If he is at the first exit and continues, then he will face the second exit and stop there with probability p (getting 6) or miss both with probability (1-p) (getting 1). So the expected payoff from continuing at the first exit is: p*6 + (1-p)*1 = 6p + 1 - p = 1 + 5p.
     - If he is at the second exit and continues, then he misses the second exit and gets 1 (the coast motel).

     But note: when at an exit, the driver does not know which exit he is at. Therefore, the expected payoff of continuing is:
        P(first|at exit) * [1+5p] + P(second|at exit) * 1 
          = [1/(2-p)] * (1+5p) + [(1-p)/(2-p)] * 1 
          = [1+5p + 1-p] / (2-p) = [2 + 4p] / (2-p) = 2(1+2p)/(2-p).

