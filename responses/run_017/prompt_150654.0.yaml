     However, the key point is that the p that maximizes the ex-ante value (2/5) is the same p that makes the driver indifferent at the exit.

  10. Both camps agree that the value of p that maximizes the ex-ante expected payoff is 2/5, and that at p=2/5 the driver is indifferent at the exit.

