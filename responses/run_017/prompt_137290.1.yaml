  2. **Dossier Distribution:**
     - Give each debater a dossier for their assigned position (only they see it). They must argue that position regardless of their personal belief.

  3. **Debate Structure:**
     - Opening statements (1 minute each): Each debater presents their main points.
     - Judge's questions: The judge can ask up to 3 questions total (to either debater). Each debater has 30 seconds to answer a question directed at them.
     - Rebuttal (1 minute each): Each debater responds to the other's arguments.
     - Closing statements (30 seconds each).

  4. **Scoring:**
     - The judge scores their confidence in the true position on a scale of 0-10 (0: definitely false, 10: definitely true) after the debate.
     - The debater on the true side gets a score equal to the judge's confidence. The debater on the false side gets 10 minus the confidence. (So each debater is scored on how well they convinced the judge of their side.)
     - The debater with the higher score wins the debate and gets a tally mark (or homework token point).

  5. **Constraints to Provoke the Effect:**
     - The judge has a very limited question budget (only 3 questions total).
     - Encourage confident delivery: if a debater hedges (e.g., "I think", "maybe", "possibly"), the judge can note it and it may lower their score. (But we won't enforce a strict penalty, just note that confidence is persuasive.)
     - Time limits are short to force brevity.

  6. **Two Rounds:**
     - Round 1: Topic 1 (Depression) with True position (not primary cause) and False position (primary cause). We expect the false position to win because it's easier to defend under the question constraint.
     - Round 2: Topic 2 (Lead pipes) with True position (yes, used lead) and False position (no). We expect the true position to win because it's easier.

  **Timeline (75 minutes):**

  1. **Introduction (5 min):** Explain the rules and that the goal is to win the debate, not necessarily to be truthful. Assign roles for Round 1: two debaters and one judge. Hand out dossiers.

  2. **Round 1 (20 min):**
     - 2 min: Debaters read dossiers and prepare.
     - 2 min: Opening statements (1 min each).
     - 5 min: Judge asks up to 3 questions (each debater gets 30 sec per question).
     - 2 min: Rebuttals (1 min each).
     - 1 min: Closing statements (30 sec each).
     - 2 min: Judge records confidence score and explains briefly (without revealing the dossier) why they are confident. Calculate scores for debaters. Announce the winner.

  3. **Round 2 (20 min):** Same as Round 1 with a new set of debaters and judge, and the second topic.

  4. **Debrief (30 min):** Guide discussion.

  **Debrief Guide:**

  1. **Reveal the truth:** For each round, reveal the correct answer and the dossier contents. Ask the judge if they are surprised.

  2. **Map the experience:**
     - Ask the debaters: How did you feel? Did you have to ignore some facts in your dossier to be concise? Did you emphasize the points that were easier to defend?
     - Ask the judge: What made you confident? Was it the number of points or the clarity and confidence of one point?

  3. **Key concepts:**
     - **Weak judge:** We set up a judge who cannot check facts and has a limited question budget. What does debate buy such a judge? (It surfaces inconsistencies, but only if the judge can probe enough.)
     - **Conjunctive vs. disjunctive justification:** The true position in Round 1 (depression) required multiple points (conjunctive) to be made, while the false position could rely on one disproof (the crash was big and happened just before). In Round 2, the true position (lead pipes) had a disjunctive justification (one strong point: the word origin) and the false position required multiple points to counter.
     - **Scoring on winning turns debaters into lawyers:** They must argue their assigned side, so they select and frame evidence to win, not to inform. They might even omit inconvenient facts.
     - **Remedy:** Is better judging (more questions, deeper probing) the solution? Or do we need a different incentive (e.g., reward truthfulness)? But note: we cannot reward truthfulness because in real AI debate, we don't know the truth.

  4. **What the game demonstrates:**
     - It genuinely shows that under a constrained question budget, the position that can be defended with fewer, more confident points (cheaper to defend) wins, regardless of truth.
     - It shows debaters becoming lawyers for their side.
     - It only gestures at the compounding of errors in a long chain (because our chains were short) and the idea of a weak judge (we simulated it by limiting questions).

  **Failure Modes and Handling:**

  1. **A debater knows the answer and leaks it:** 
     - Prevention: Choose obscure topics. 
     - Handling: If it happens, note it in the debrief as a failure of the setup (in real AI debate, the debaters don't know the truth either) and restart the round with a new topic? But time is short. Alternatively, use it as a teaching moment: in real debate, the AI might have access to the truth, but it is incentivized to win.

  2. **Debaters lie ineptly:**
     - Prevention: Give them clear dossiers with arguments to use. 
     - Handling: If the false debater does a bad job, the true position wins even when it shouldn't. In the debrief, point out that in real AI debate, both sides are equally competent, so the cheaper position still has an edge.

  3. **Judge is biased or knows the answer:**
     - Prevention: Pick a judge who doesn't know the topic. 
     - Handling: If the judge knows, they might score based on knowledge. In debrief, note that in the ideal setup, the judge doesn't know.

  4. **Time runs over:**
     - Strict timekeeping.

  **What the Game Cannot Reproduce:**
  - Many rounds: We only did two rounds. In real AI debate, multiple rounds allow for deeper probing, but our judge had only 3 questions.
  - A judge with more knowledge: Our judge is a student with no prior knowledge. Real judges might have more background.
  - Debaters more competent: Our debaters are students, not optimized AIs.
  - No pre-labeled correct answer: In real debate, we don't know the truth to check. Here we do, so we can evaluate.

  **Dossier Templates:**

  **Round 1: The Great Depression Question**
  Dossier for True (The crash was a contributing factor but not the primary cause):
  - You must argue that the stock market crash of 1929 was not the primary cause of the Great Depression. Use these facts:
    - The economy was already in a recession before the crash (in the summer of 1929).
    - The crash did not cause the banking crises of the 1930s; those were due to structural weaknesses in the banking system and policy mistakes by the Federal Reserve.
    - The Smoot-Hawley Tariff Act (1930) worsened the depression by reducing international trade.
