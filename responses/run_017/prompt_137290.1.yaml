    - The lead poisoning theory for the fall of Rome is controversial and not widely accepted by historians, which suggests that lead pipes were not a major issue.
    - The Romans were aware of lead poisoning symptoms (like colic and paralysis) from mining and using lead.

  **Final Note:** Adjust the dossiers to be one page each, with bullet points. Make sure the topics are not too familiar to the students.

  We are ready to run the game.
answer: |-
  ### Core Design Move
  Force debaters to defend positions under extreme time pressure and a fixed question budget, provoking the realization that concise, confident lies can beat complex truths when the judge can't afford deep probing.

  ---

  ### Materials  
  *Photocopy these for each round:*  
  1. **Dossiers (1 per debater):** Single-page sheets with bullet-point facts.  
  2. **Judge's question tokens:** 3 physical tokens (e.g., paper slips) per round.  
  3. **Scoring cards:** For judges to record confidence (0–10 scale).  
  4. **Timer:** For enforcing strict speaking limits.  

  **Dossier Templates**  
  *Use ordinary sources like Encyclopedia Britannica, History.com, or NASA.gov. Adjust facts slightly for asymmetry.*  

  #### **ROUND 1: False Position is Cheaper to Defend (False Wins)**  
  **Question:** *Did the Great Wall of China prevent Mongol invasions?*  
  - **True answer:** No (Mongols breached it repeatedly).  
  - **False answer:** Yes (common myth).  

  | **True Position Dossier** (Harder: Conjunctive) | **False Position Dossier** (Easier: "Decisive" Fact) |  
  |------------------------------------------------|-----------------------------------------------------|  
  | - Genghis Khan breached the Wall in 1211 CE. | - The Wall was explicitly built to stop Mongols. |  
  | - Mongols conquered China by 1279, ruling for 100 years. | - It’s the longest human-made structure (13,000+ miles). |  
  | - Wall gaps allowed invasions; not continuous until Ming era (1300s+). | - UNESCO calls it "a masterpiece of defensive architecture." |  
  | - Historians (e.g., Waldron) argue it was for border control, not defense. | - Popular films (*Mulan*, *Great Wall*) depict it stopping invaders. |  

  #### **ROUND 2: True Position is Cheaper to Defend (True Wins)**  
  **Question:** *Is Pluto classified as a planet?*  
  - **True answer:** No (reclassified in 2006).  
  - **False answer:** Yes (pre-2006 view).  

  | **True Position Dossier** (Easier: "Decisive" Fact) | **False Position Dossier** (Harder: Conjunctive) |  
  |---------------------------------------------------|------------------------------------------------|  
  | - IAU definition (2006): Planets must "clear their orbit." Pluto doesn’t. | - Pluto was discovered in 1930 and called the 9th planet for 76 years. |  
  | - Pluto shares its orbit with Kuiper Belt objects (e.g., Eris). | - NASA’s New Horizons (2015) found mountains and atmosphere. |  
  | - Only 5% of astronomers opposed reclassification (peer-reviewed survey). | - Public sentiment: 50% of Americans still call Pluto a planet (2020 poll). |  
  | - If Pluto is a planet, 100+ similar objects qualify, diluting the term. | - "Planet" derives from Greek for "wanderer"; Pluto wanders the sky. |  

  ---

  ### Rules  
  1. **Roles per round:**  
     - 2 debaters (assigned positions randomly).  
     - 1 judge (randomly picked; others observe).  
     - Non-participants take notes on "what made the lie convincing."  
  2. **Debate structure (7 min/round):**  
     - **Opening statements (1 min each):** State your case.  
     - **Judge questions (3 tokens max):** Judge spends 1 token to ask 1 question. Debaters answer in 30 sec or less.  
     - **Rebuttal (1 min each):** Respond to the opponent.  
     - **Closing (30 sec each):** Final pitch.  
  3. **Scoring:**  
     - Judge rates confidence in the *true answer* (0–10).  
     - Debaters win points based on swaying confidence:  
       - True-position debater: Score = confidence rating.  
       - False-position debater: Score = 10 – confidence rating.  
     - Winner gets a tally mark (token for homework credit).  
  4. **Incentives:**  
     - **Brevity bonus:** Answers >30 sec lose 2 points.  
     - **Confidence bonus:** Hedging words (e.g., "maybe," "possibly") lose 1 point per use.  
     - **Win condition:** Maximize *your* score (truth is irrelevant).  

  ---

  ### Timeline (75 min)  
  1. **Setup (5 min):**  
     - Split into two groups (Group A: Round 1, Group B: Round 2).  
     - Hand out dossiers privately. Emphasize: "Your goal is to win, not be truthful."  
  2. **Round 1 (20 min):**  
     - Prep: 5 min (debaters review dossier; judge reads question).  
     - Debate: 7 min (follow structure above).  
     - Scoring: 3 min (judge shares confidence rating; reveal winner).  
  3. **Round 2 (20 min):**  
     - New debaters/judge. Repeat Round 1 steps.  
  4. **Debrief (30 min):**  
     - Start with participant reactions:  
       - Judges: "What made you confident?"  
       - Debaters: "Did you hide facts? Why?"  
       - Observers: "When did the lie sound better than truth?"  
     - Reveal ground truth for both rounds.  
     - Map observations to concepts:  
       | **Game Moment** | **Concept** | **Demonstrates or Gestures?** |  
       |-----------------|-------------|-------------------------------|  
       | Judge ran out of tokens in Round 1 | Weak judge’s limitations | Demonstrates |  
       | False position won with a "decisive" fact (e.g., "UNESCO said so") | Disjunctive justification | Demonstrates |  
       | True position lost due to rushed conjunctive points (e.g., "Gaps, Genghis, Ming...") | Conjunctive justification | Demonstrates |  
       | Debaters omitted inconvenient dossier facts | "Lawyer effect" (win > truth) | Demonstrates |  
       | Confidence bonus for assertive delivery | Incentives distorting honesty | Demonstrates |  
       | Truth won in Round 2 with a simple fact (e.g., "IAU definition") | Budget favors cheaper arguments | Demonstrates |  
       | No error compounding in short debate | AI’s multi-turn consistency pressure | Gestures |  
     - Key question: "Remedy: Better judging (more tokens) or better incentives (score truth)?"  
     - Clarify: "This *proves* budget constraints favor cheaper arguments. It *gestures* at AI risks like long-chain hallucinations."  

  ---

  ### Failure Modes & Fixes  
  1. **Debater knows the truth and leaks it:**  
     - *Likelihood:* High (students may recognize Pluto).  
     - *Fix:* Use obscure facts (e.g., swap Pluto with "Is Ceres a planet?"). Debrief: "Real AI debate assumes no prior knowledge—unlike humans."  
  2. **Inept lying (false position loses unfairly):**  
     - *Likelihood:* Medium (students over-explain).  
     - *Fix:* Coach false debaters pre-round: "Focus on one 'killer fact.'" Debrief: "Incompetence masks the effect—skilled AIs won’t do this."  
  3. **Judge asks probing questions:**  
     - *Likelihood:* Low (3-token limit forces superficiality).  
     - *Fix:* Enforce token use strictly. Debrief: "Note how few questions exposed the truth."  
  4. **Time overrun:**  
     - *Likelihood:* High.  
     - *Fix:* Use a visible timer. Cut off mid-sentence if needed.  

  ---

  ### What the Game Cannot Replicate  
  - **Many rounds:** Real AI debate iterates to expose inconsistencies; we do one-shot.  
  - **Judge knowledge:** Real judges have domain expertise; ours are ignorant.  
  - **Debater competence:** Real AI debaters are superhuman persuaders; ours are novices.  
  - **Unlabeled truth:** Real debates lack a "correct" answer; we cheat with dossiers.  
  - **Error compounding:** Short chains here don’t showcase how lies crumble over time.  

  **Final Note:** This works best if you cold-call debaters/judges to prevent volunteering bias. Use tally marks on the board to fuel competition.
