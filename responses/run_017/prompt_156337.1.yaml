prompt: |-
  My group does applied Bayesian work — hierarchical models, model selection and averaging, online prediction with log-loss regret bounds — and a philosopher we collaborate with has started telling us that what we do is a degraded approximation to something called Solomonoff induction, which he describes as the only rigorous and fully general statement of Occam's razor we have. He is not a crank and I don't want to wave him away, but I also can't tell whether the thing he is describing is a genuine idealization of our practice, a solution to a different problem, or an idealization whose every virtue is asymptotic and uncomputable and therefore irrelevant to anything I do on a Monday.

  So I'd like a translation rather than an introduction. Please restate the following, one at a time and as faithfully as you can, in the vocabulary my group actually uses: priors and marginal likelihoods, Bayes factors, Bayesian model averaging over a countable model class, two-part codes and minimum description length, regularization as a complexity penalty, PAC-Bayes and no-free-lunch results, the distinction between the truth being inside the support of your prior or outside it, cross-validation.

  First, the construction: a prior built by mixing over the programs of a universal machine, with weight falling off exponentially in program length, and updated by conditioning on the data so far.

  Second, the optimality result. As he tells it: the expected cumulative loss exceeds that of any computable predictor by no more than a constant proportional to the complexity of the truth, with the loss summed over the whole infinite sequence. In my vocabulary, is that a regret bound? Against what comparator class? What plays the role of the constant, and is it the kind of constant I should care about or the kind that swallows the result?

  Third, the identification of the negative log of the mixture weight with Kolmogorov complexity, up to an additive term small relative to the complexity itself — and the use of that to say the scheme always prefers the simplest hypothesis compatible with the data.

  Fourth, the reasons no one uses it: uncomputability, and the fact that the dominance over any computable predictor holds only up to a multiplicative constant that depends on the predictor.

  Then the residue report, which is the part I actually want. My guesses, to be confirmed or corrected: that the prior is over programs rather than over the hypotheses I care about, and the map from programs to hypotheses is many-to-one, so there is no clean counterpart to a posterior probability over models; that the thing is a semimeasure rather than a probability measure, with mass leaking somewhere I have no concept for; that the guarantee is about infinite-horizon cumulative error rather than finite-sample risk, so it says nothing I could check on a test set; and that the choice of reference machine is either a substantive inductive bias, like choosing a model class, or a convention, like choosing units — I go back and forth, because I'm told the difference is bounded by a constant independent of the data and also that the constant can be astronomically large. Tell me which of these are real, which are artifacts of my vocabulary, and what else fails to translate that I haven't thought of.

  Finally, the case I care most about. I've been playing with a variant in which the penalty on a program is its length plus λ times the log of its runtime, which makes the scheme computable, gives me a finite-horizon object, and lets me trade accuracy against a compute budget. Translate that back into Solomonoff terms: which theorem do I lose, precisely, and is losing it the same kind of loss as approximating a posterior with variational inference, or a different kind of loss altogether? And has penalizing runtime quietly changed the virtue being formalized — from simplicity into something more like efficiency — such that the philosophical claim that Solomonoff induction vindicates Occam's razor no longer has any bearing on what I'm doing?

  What I want at the end is a verdict I can act on: which of my collaborator's claims I should concede, which are true but inert for someone in my position, and whether the residue left over after the translation points to a genuine gap in Bayesian practice or to a gap in the Solomonoff story.
reasoning: |-
  Okay, the user is part of a group doing applied Bayesian work—hierarchical models, model selection, online prediction with log-loss regret bounds. They collaborate with a philosopher who's telling them that their work is a degraded approximation to Solomonoff induction. The philosopher describes Solomonoff induction as the ultimate formalization of Occam's razor. The user doesn't want to dismiss their collaborator but is skeptical about its relevance to their practical work.

  First, I need to translate Solomonoff concepts into the Bayesian vocabulary the user uses. The user listed specific terms: priors, marginal likelihoods, Bayes factors, etc. Let me tackle each one by one as per their request.

  Starting with the construction: Solomonoff uses a prior over programs on a universal Turing machine, weighted exponentially by program length. Updating is just conditioning on data. In Bayesian terms, this is like a mixture prior with hyperpriors favoring shorter programs. The "marginal likelihood" here is the mixture over all programs, but it's uncomputable. The prior isn't over hypotheses directly but over programs that generate hypotheses, which can be many-to-one. So the posterior over specific models isn't straightforward.

  Next, the optimality result. The philosopher claims that the cumulative loss is within a constant of any computable predictor. In the user's terms, this is a regret bound against all computable predictors. The constant is related to the Kolmogorov complexity of the true model. But that constant could be huge, like 10^100, making it impractical for real applications. The user's group cares about finite samples, so asymptotic guarantees might not matter much here.

  Then, the identification of negative log mixture weight with Kolmogorov complexity. Solomonoff says the prior weight approximates the complexity, so simpler models get higher weight. But again, it's asymptotic and the constants matter. In practice, regularized models like BIC or MDL are computable approximations but lose the universality.

  Why no one uses it? Uncomputability is the big one. Plus, the multiplicative constant in the regret bound can be enormous, depending on the reference machine. Even though the constant is bounded, it's not fixed and can vary, making it useless for real-world problems.

  Now the residue report. The user's guesses: prior over programs leading to many-to-one mapping—yes, that's a real issue. The semimeasure part: Solomonoff's prior is a semimeasure because some programs don't halt, so probability leaks away. This is a genuine difference from standard Bayesian priors. The guarantee being asymptotic means it doesn't help with finite samples. The reference machine choice is both a convention and an inductive bias; the constant is bounded but impractically large. All these points are valid concerns.

  The user's variant: they're penalizing program length plus log runtime, making it computable. This loses the universality of Solomonoff because it restricts to computable predictors. The regret bound now depends on the computational budget, shifting focus from simplicity to computational efficiency. Occam's razor here is more about efficiency than pure simplicity. So the philosopher's claims about Solomonoff vindicating Occam don't directly apply to this variant.

  The user wants a verdict. They should concede that Solomonoff is a theoretical idealization but inert for applied work. The gaps in Bayesian practice are around non-computable ideals, but Solomonoff doesn't offer practical solutions. The residue points to the trade-offs between computability and optimality. The user's runtime-penalized approach is a practical compromise, aligning more with computational efficiency than the philosophical notion of simplicity.
answer: |-
  Here's a faithful translation of Solomonoff induction into your group's vocabulary, addressing each point sequentially, followed by the residue report and verdict. The goal is to map Solomonoff's *theoretical idealization* onto your *practical Bayesian toolkit*, revealing where the analogy holds, breaks, or becomes inert.

  ---

  ### **1. The Construction: Prior & Update**
  **Solomonoff:** A prior over *programs* (on a universal Turing machine) weighted by \( 2^{-L(p)} \), where \( L(p) \) is program length. Updated via conditioning on data.  
  **Your Vocabulary:**  
  - **Priors & Marginal Likelihoods:** This is a **hyperprior over model specifications**, where each "model" is a program generating hypotheses. The "marginal likelihood" \( p(\text{data}) \) is the mixture over *all programs* that output data-consistent sequences.  
  - **Key Difference:** Your priors are over *structured hypotheses* (e.g., regression coefficients). Solomonoff’s prior is over *unstructured code*. The map from programs to hypotheses is many-to-one and uncomputable. There is no clean posterior over "models" in your sense—only over programs.  
  - **Translation:** Solomonoff is a **nonparametric mixture model** with a **universal complexity penalty** (program length) as the prior. The "update" is standard Bayesian conditioning, but the "marginal likelihood" is uncomputable and leaks probability mass (see §Residue).

  ---

  ### **2. The Optimality Result: Regret Bound**  
  **Solomonoff:** For infinite sequences, cumulative log-loss exceeds any *computable predictor* by \( \leq K(\text{truth}) \cdot C \), where \( K \) is Kolmogorov complexity and \( C \) is a constant.  
  **Your Vocabulary:**  
  - **Regret Bound?** Yes, but **asymptotic and uncomputable**.  
  - **Comparator Class:** All computable predictors (including all Bayesian models with computable priors).  
  - **The Constant \( C \):** It’s a *finite but unknowable constant* tied to the reference machine. For your work:  
    - **You should care** if you value *universal consistency* (it dominates all computable methods eventually).  
    - **You should ignore** if you care about *finite-sample performance* (e.g., \( C \) could be \( 10^{100} \), dwarfing \( K(\text{truth}) \)).  
  - **PAC-Bayes Connection:** Solomonoff provides a **frequentist-style worst-case guarantee** but only in the infinite limit. PAC-Bayes gives finite-sample bounds with your chosen prior.  

  ---

  ### **3. Mixture Weight ≈ Kolmogorov Complexity**  
  **Solomonoff:** \( -\log_2(\text{prior weight}) \approx K(\text{truth}) \) (within \( O(1) \)). Thus, prefers the *shortest program* fitting the data.  
  **Your Vocabulary:**  
  - **Two-Part MDL:** This is **idealized MDL**: the prior \( 2^{-L(p)} \) is the "code length" for the model, and the likelihood is the "code length" for data given the model.  
  - **Bayesian Model Averaging:** Solomonoff *is* Bayesian model averaging over a **countable class of programs** (all possible code), with prior \( \propto 2^{-\text{program length}} \).  
  - **Occam’s Razor:** Yes, it formalizes "simplicity" as \( K(\text{truth}) \). But in practice, your **regularization** (e.g., priors penalizing parameters) approximates this. The hitch: \( K(\text{truth}) \) is uncomputable and defined relative to a reference machine.  

  ---

  ### **4. Why No One Uses It**  
  **Solomonoff:** Uncomputable, and "optimality" hides large constants.  
  **Your Vocabulary:**  
  - **Uncomputability:** You can’t compute the posterior or marginal likelihood.  
  - **The Constant:** Dominance holds only up to \( C \cdot K(\text{truth}) \), where \( C \) depends on the predictor. For your models, \( C \) could be astronomical.  
  - **NFL Connection:** Solomonoff dodges no-free-lunch by being *universal*—but only asymptotically. Computable methods (like yours) face NFL tradeoffs in finite samples.  

  ---

  ### **Residue Report: What Doesn’t Translate**  
  Your guesses are largely correct. The key mismatches:  
  | **Your Concern**               | **Reality**                                                                 | **Practical Impact**                                                                 |
  |------------------------------|----------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **Prior over programs**      | Real: Programs → hypotheses is many-to-one. No clean model posterior.       | You lose interpretable posteriors over hypotheses.                                  |
  | **Semimeasure (mass leak)**  | Real: Non-halting programs cause \( \sum p(\text{data}) < 1 \).             | Violates probability axioms. Your priors are proper; this isn’t.                    |
  | **Infinite-horizon guarantee**| Real: Bounds apply only as \( n \to \infty \). Says nothing about test sets. | Inert for your work (finite-data, finite-compute).                                |
  | **Reference machine choice** | Both: It’s a *convention* (like units) but \( O(1) \) constants can be \( 10^{100} \). | Inductive bias is disguised as "universality." Philosophically deep, practically irrelevant. |
  | **Truth in/out of prior**    | Solomonoff’s prior *includes all computable truths*. But if truth is uncomputable, all bets off. | Your models often exclude truths (e.g., misspecified priors). Solomonoff "solves" this at infinity. |

  **What you missed:**  
  - **No connection to cross-validation:** Solomonoff needs no tuning; it’s "complete." CV is a finite-sample tool for your approximations.  
  - **Complexity ≠ efficiency:** Kolmogorov complexity measures *description length*, not *computation time*. Your runtime penalty breaks this link (see below).  

  ---

  ### **Your Runtime-Penalized Variant: Translation & Losses**  
  **What you’re doing:** Prior \( \propto 2^{-[\text{program length} + \lambda \log(\text{runtime})]} \).  
  **Solomonoff Translation:** You’ve replaced Kolmogorov complexity \( K(p) \) with **Levin complexity** \( Kt(p) = K(p) + \log(\text{runtime}(p)) \).  

  **Theorems lost:**  
  1. **Optimality:** Solomonoff’s regret bound assumes *infinite compute*. Your \( \lambda \) caps runtime, so you lose dominance over all computable predictors.  
  2. **Universality:** The additive constant \( C \) now depends on \( \lambda \) and your compute budget.  
  3. **Truth identification:** With finite runtime, truth may be excluded even if computable.  

  **Is this like variational inference?**  
  - **Similarity:** Both are computable approximations trading accuracy for efficiency.  
  - **Difference:** VI approximates a specific Bayesian posterior. Your scheme changes the *idealized target* (Levin vs. Solomonoff prior).  

  **Did you change "virtue"?**  
  - **Yes.** You shifted from **simplicity** (Kolmogorov) to **efficiency** (Levin).  
  - **Philosophical impact:** Solomonoff’s "vindication of Occam" (simplicity) no longer applies. Your prior penalizes *complex computation*, not just *complex description*. This is closer to **bounded rationality** than pure Occam.  

  ---

  ### **Verdict: What to Concede, What to Ignore, Where the Gaps Are**  
  | **Collaborator’s Claim**                         | **Your Response**                                                                 |
  |------------------------------------------------|---------------------------------------------------------------------------------|
  | Solomonoff is a "degraded approximation"        | **Concede:** Your methods *are* computable approximations to this ideal.        |
  | It formalizes Occam’s razor                     | **Concede (but qualify):** Only for *description length*. Your runtime penalty changes this. |
  | Dominance over all computable predictors        | **Inert:** The bound is asymptotic, uncomputable, and the constant is galactic. |
  | "Genuine idealization" of your practice         | **Pushback:** It’s an idealization of *prediction*, not inference or decision-making. |

  **Gaps revealed:**  
  - **Bayesian practice:** Struggles with *nonparametric universality* and *misspecification robustness*. Solomonoff solves these at infinity but offers no practical path.  
  - **Solomonoff story:** Ignores *finite data*, *compute constraints*, and *structured uncertainty* (e.g., hierarchical models). Its "optimality" is a Pyrrhic victory.  

  **Actionable conclusion:** Your runtime-penalized approach is philosophically **closer to efficient inference** (e.g., SGD, variational methods) than to Solomonoff’s idealized Occam. The collaborator’s points are *theoretically valid* but *operationally inert* for applied work. Bridge the gap by:  
  1. Using MDL/BIC for model selection (trading Solomonoff’s universality for computability).  
  2. Citing Solomonoff as motivation for regularization, but rejecting its relevance to finite-sample guarantees.  
  3. Arguing that your runtime penalty is a *necessary refinement* of "simplicity" in a compute-bound world.  

  Solomonoff is a moon shot; you’re building bicycles. Both move you forward, but only one works on Monday.
