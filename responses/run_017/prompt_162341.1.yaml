answer: |-
  Here’s your Q&A prep sheet, structured for defense-in-depth against this audience. Prioritize clarity and philosophical traction over technical perfection.

  ---

  ### **Room Read (100 words)**  
  - **Welfare Economists (GARP crowd)**: Primary threat. They’ll defend revealed preference’s simplicity and fear IRL’s complexity. Will attack "unfalsifiability."  
  - **Experience-Sampling Researchers**: Hostile noise. Demand proof IRL outperforms self-report on validity. Will interrupt over "subjective experience."  
  - **Political Philosophers (Capability/Paternalism)**: Allies *if* convinced IRL solves adaptive preference. Threat: accuse you of covert utilitarianism.  
  - **RL Theorists**: Friendly nitpickers. Will grill identifiability assumptions (e.g., discount rates, state space granularity) but can be turned into defenders.  

  ---

  ### **Objections (8 Total, ~150w Each)**  
  **1. Welfare Econ: "This is just revealed preference with extra free parameters!"**  
  *Reply:* "Revealed preference *assumes* optimality to infer orderings but can’t extrapolate. IRL *uses* optimality as a probabilistic prior to infer transferable rewards. Key advance: predict choices under *new* constraints."  
  *Soft Spot:* Doesn’t fully address "why not add structure to RP?" (Concede: "We could, but IRL’s structure is domain-general.")  

  **2. Experience-Sampling: "Why infer preferences indirectly when we can just ask people?"**  
  *Reply:* "Self-reports fail when preferences are adaptive (e.g., oppressed groups internalize constraints). IRL reveals latent rewards *revealed* by behavior under oppression, without demanding introspection."  
  *Soft Spot:* No side-by-side validity data (yet).  

  **3. RL Theorist: "Maximum entropy IRL assumes known dynamics. How do you handle model mis-specification?"**  
  *Reply:* "A fair limitation. We use counterfactual dynamics (e.g., removing barriers) *only* when we have causal evidence (e.g., RCTs). Philosophers’ independent criteria for ‘unjust constraints’ cover this."  
  *Soft Spot:* Requires philosophers to agree on constraints (they won’t universally).  

  **4. Political Philosopher: "Aren’t you just smuggling in utilitarianism via ‘reward’?"**  
  *Reply:* "No—IRL recovers *ordinal* rewards (like RP). We only compare welfare under identical dynamics. No interpersonal comparisons needed."  
  *Soft Spot:* Soft optimality subtly cardinalizes.  

  **5. Welfare Econ: "IRL is computationally intractable for real-world policy!"**  
  *Reply:* "So was RP in 1940! We’re proposing a *framework*. Today’s RL scales to healthcare and gaming; policy is next."  
  *Soft Spot:* Overpromising on scalability.  

  **6. Experience-Sampling: "You claim IRL handles adaptation, but what if people’s *true* preferences change under oppression?"**  
  *Reply:* "Then our method fails—but so does RP and surveys. IRL at least *models* the constraint’s effect, letting us test ‘what if it were relaxed?’"  
  *Soft Spot:* No solution for endogenous preference change.  

  **7. Political Philosopher: "Reward laundering feels paternalistic—who decides which constraints are ‘unjust’?"**  
  *Reply:* "You do! We borrow *your* criteria (e.g., Sen’s ‘capabilities’). IRL operationalizes your normative judgments empirically."  
  *Soft Spot:* Risks circularity if philosophers disagree.  

  **8. RL Theorist: "Shaping invariance means rewards are arbitrary. Why trust laundered rewards?"**  
  *Reply:* "Shaping affects *absolute* rewards but preserves *ordinal* ones under fixed dynamics. Laundering changes dynamics, not rewards—so comparisons *are* valid."  
  *Soft Spot:* Assumes dynamics are perfectly separable (often not).  

  ---

  ### **Concede Up Front (120 words)**  
  "In the first 2 slides, I’ll grant:  
  1. IRL doesn’t *solve* the identifiability problem—it *manages* it better than RP by using a principled prior (max entropy).  
  2. This isn’t a replacement for surveys when unbiased self-report exists.  
  3. ‘Unjust constraints’ are defined by philosophers, not IRL. We only provide tools to *apply* those definitions.  
  This pre-empts attacks on overreach and lets us focus on IRL’s niche: inferring preferences when behavior is adaptive or constraints shift."  

  ---

  ### **Load-Bearing Reply (120 words)**  
  **When challenged on extrapolation validity:** "The transfer test: RP *can’t* predict choices under new budget sets. Max-entropy IRL *can*, by re-optimizing the learned reward in the new MDP. We validate by checking predictions against *future* choices (e.g., post-policy change). If philosophers want to evaluate welfare under counterfactual conditions—like removing oppression—you need a method that *extrapolates*. RP stalls here; IRL delivers."  
  *Cost:* Requires endorsing soft optimality + causal entropy as "correct" priors—which RL theorists may dispute.  

  ---

  ### **Question You Hope Nobody Asks (150 words)**  
  **"Is the laundered reward *constitutive* of welfare or just *evidence*? If evidence, why not use surveys? If constitutive, aren’t you endorsing paternalism?"**  
  *Your Hedge:* "It’s *evidence* of what people would prefer absent adaptive distortion. Surveys can’t capture this when preferences are corrupted (e.g., ‘happy slaves’). But—crucially—the *normative weight* comes from philosophers’ independent judgment that relaxing certain constraints is just. IRL doesn’t define welfare; it reveals preferences aligned with *your* theory of justice."  
  *Does It Work?* Partially. Survives if you keep calling it a "proxy." **But worse question:**  
  **"What if IRL recovers rewards that justify harmful acts (e.g., addiction) as ‘optimal’? Does your method endorse them?"**  
  *Reply:* "No—optimality is *descriptive*. Normative claims enter when laundering constraints (e.g., removing exploitative drug pricing). IRL separates *is* from *ought*."  

  ---

  ### **What to Cut (100 words)**  
  **Cut deep technical details on shaping invariance (Step 1).**  
  - *Why:* Economists know RP’s flaws; belaboring identifiability bores them. Philosophers glaze over MDP math.  
  - *Downgrade:* Replace with: "Just as RP requires assumptions (transitivity) to infer preferences, IRL requires assumptions (soft optimality) to break ties—but unlike RP, it *extrapolates*." Keep the potential-based example *verbally* only if pressed.  
  - *Saves 3 minutes* for reward laundering demos (your strongest hook).  

  ---  
  **Final Tip:** Open with a political philosopher’s case study (e.g., "Should we trust women’s ‘choices’ in patriarchal societies?") to grab allies early. Good luck!
