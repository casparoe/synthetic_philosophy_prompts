prompt: |-
  I'm on the team that enrolls patients in a study in the emergency room, and I keep having to make judgment calls about when a signature is a real yes, so I want to know what my own verdicts add up to. Here they are.

  - She signs after I tell her the drug may cause headaches, and I leave out that in the pilot one in twenty had migraines bad enough to miss work. Not valid.
  - She signs, and I've overheard her son in the corridor telling her to just do it, it'll keep the doctor happy. I say nothing. Valid, I think, though it makes me uneasy.
  - She signs because she's picked up, wrongly, and I know it, that joining is the only way she'll get to see a specialist; she'd be referred either way and I don't correct her. Not valid, and I'd be at fault.
  - She signs believing the study is funded by a charity she supports. It's funded by a company she boycotts, we don't advertise the funder, and she'd refuse if she knew. Valid, I think — the funder isn't part of what she's agreeing to. But its the same shape as the previous one: a false belief I know about, decisive for her, that I leave alone.
  - She's on morphine and consents to one extra blood draw: fine. Same patient, same morphine, consents to the full eighteen-month protocol: not fine.
  - We tell her that most people in her situation take part, which is true and which we say partly because it works. She signs. Valid — I can't see how a true sentence invalidates anything, but it bugs me.
  - Six months in she clearly wants out: flinches, goes quiet, asks when it ends, keeps showing up, never says the words. I think her consent has lapsed even though she never withdrew it.
  - We re-ask every month as required and she says yes every time, but I'm fairly sure the only thing holding the yes up is that saying no after three yeses would feel rude. No idea what to say about this one.

  Is there one principle, or a short list, that gets all of these, stated sharply enough that it also rules on: consent given up front for samples to be used in any future study we like, consent given to a research assistant the patient takes to be a doctor, and a yes we get at 3am from someone who was asleep ten minutes earlier? Tell me too where I'm confusing invalid with valid but I shouldn't take it — I suspect some of these are that. And commit: give me one account, say which of my verdicts it forces me to drop, and don't hand me a menu or an it-depends. I'd rather lose two verdicts than end up with a principle that has eight clauses.
reasoning: |-
  Okay, let me tackle this user's query. They work on enrolling patients in an emergency room study and need a clear principle to judge consent validity. They listed several scenarios with their initial verdicts and want a unified rule that also handles additional cases. 

  First, I need to understand their main pain points. They're struggling with judgment calls where consent might be technically valid but ethically questionable, like omissions or external pressures. They mentioned cases where patients sign based on false beliefs or under subtle coercion. Their deeper need seems to be reducing cognitive load and moral uncertainty by having a clear standard, not just for validity but for when they should refuse to proceed.

  The key principles in research ethics here are autonomy, voluntariness, and adequate information. The Belmont Report's elements—information, comprehension, voluntariness—are foundational. But the user wants something sharper. I recall Faden and Beauchamp's distinction between autonomous authorization (genuine understanding and intent) and mere legal consent. That fits cases like the morphine patient or the funder misconception, where signing happens without true autonomy.

  Looking at their verdicts, most align with autonomous authorization except two: the charity boycott case (they said valid) and the monthly re-consent out of politeness (unsure). If I apply the strict principle, those should be invalid because the patient's belief about the funder is material and decisional, and politeness undermines voluntariness. That means overriding their "valid" verdict for the boycott case—a trade-off for simplicity.

  For the additional cases: blanket future consent fails the materiality test (can't comprehend unspecified uses), mistaken identity invalidates (doctor vs. RA is material), and 3am consent lacks comprehension/voluntariness. This covers all cleanly. 

  I should emphasize the "decisive misunderstanding" angle—it resolves why omitting migraine data is invalid (material risk) but true statements about participation rates aren't (non-material). It also explains why the son's pressure might be valid (if her choice persists autonomously) versus the specialist misconception (decisive error).

  The user might resist changing their charity verdict, but the principle holds: if a known, decisive false belief exists, it invalidates. Same for the politeness case—voluntariness is compromised. Highlighting that some cases are "valid but shouldn't be taken" (e.g., morphine for long protocol) could soften the blow, but the strict view collapses that into invalidity. 

  Ultimately, one sentence: Consent requires actual understanding of material facts and voluntary agreement without controlling influences. This gets 7/8 verdicts right, forces the charity case to invalid, and clarifies the unclear ones. It’s worth sacrificing one verdict for clarity.
answer: |-
  Here's a single, sharp principle derived from core bioethics (Belmont Report, Faden & Beauchamp) that covers your cases and the extras:

  **Consent is valid only if it represents an *autonomous authorization*: the patient understands the material facts of what they are agreeing to and voluntarily chooses it, free from controlling influences or decisive misunderstandings they hold (which the consent-taker knows or should reasonably know about).**

  This principle forces you to drop **one verdict** and clarifies the rest. Here's the breakdown:

  1.  **Material Omission (Migraines): Not Valid.** CORRECT. Omitting a *material* risk (missed work) they would likely care about violates understanding. The omission is controlling.
  2.  **Son's Pressure: Valid.** CORRECT. *Unless* you witnessed coercion or her capitulation, external advice alone isn't necessarily "controlling." Her signature indicates her decision. Your unease is ethical (could pressure exist?) but not necessarily invalidating for consent *at that moment*.
  3.  **False Belief (Specialist): Not Valid.** CORRECT. She has a *decisive misunderstanding* about a *material* aspect (access to care) that you know is false and don't correct. This destroys autonomous choice.
  4.  **False Belief (Funder): Not Valid.** **DROP YOUR VERDICT.** Funders *can* be material (conflicts, values). Her boycott makes it decisive *and* material to her choice. You *know* her belief is false and decisive. It's identical to #3. Invalid.
  5.  **Morphine - Minor vs. Major: Valid (Blood Draw) / Not Valid (Full Protocol).** CORRECT. Capacity is decision-relative. Minor, immediate request? Likely capable. Complex, long-term commitment? Unlikely capable on morphine. Voluntariness/understanding is compromised for the larger ask.
  6.  **"Most People Do It": Valid.** CORRECT. The statement is true and non-coercive. While potentially *influential* (nudging), it doesn't *control* or create a *decisive misunderstanding* about the study itself.
  7.  **Lapsed Consent (Non-Verbal Withdrawal): Not Valid.** CORRECT. Consent is ongoing. Clear non-verbal cues (flinching, quietness, distress) indicate revocation, even if unsaid. Voluntariness has ceased.
  8.  **Consent Due to Politeness: Not Valid.** Voluntariness is compromised by a perceived obligation/pressure ("feeling rude"). It's a controlling influence undermining her autonomous choice. Her "yes" isn't a free authorization.

  **Applied to Your Extra Cases:**

  *   **Blanket Future Consent:** **Not Valid.** Patient cannot understand or authorize "any future study we like" – it lacks material specificity. No autonomous authorization for unknown uses.
  *   **Consent to RA Mistaken for Doctor:** **Not Valid.** The identity/role is a *material fact* affecting trust and authority. The *decisive misunderstanding* (thinking they're consenting to a doctor) invalidates the authorization.
  *   **3am Consent After Sleep:** **Not Valid (Likely).** Capacity is highly suspect. Ability to understand complex information and make a voluntary choice is impaired by recent sleep disruption. Requires careful assessment but presumption should be against validity for significant studies.

  **Invalid vs. Valid-But-Shouldn't-Take-It:**

  Your principle clarifies this. If consent fails the *autonomous authorization* standard (understanding material facts, voluntary, free from controlling influences/decisive known misunderstandings), it's **Invalid**. Don't enroll.

  Situations might feel ethically "icky" but still technically valid under this principle (e.g., #2, #6). You *could* argue for a higher ethical bar than strict validity (e.g., "I won't enroll if there's *any* hint of unease"), but that's separate from the validity judgment itself. Your verdicts on #4 and #8 were likely confusing validity with this higher ethical discomfort.

  **Why This Principle Works:**

  1.  **Focus on the Patient's State:** It centers on *their* understanding and *their* freedom of choice.
  2.  **"Material Facts":** Covers what a reasonable person, or *this specific person* (if you know their concerns), would need to know to decide (risks, benefits, alternatives, nature of the study, key procedures, funder *if material to them*).
  3.  **"Decisive Misunderstanding":** Catches cases where a false belief (that you know about) is the *reason* they say yes, even if the fact itself might seem peripheral (like the funder to a boycott supporter).
  4.  **"Controlling Influences":** Covers coercion, undue pressure (like perceived politeness obligations), and impairments affecting choice (morphine, exhaustion).
  5.  **"Knows or Should Reasonably Know":** Sets a realistic standard for the consent-taker's responsibility without requiring mind-reading.

  You sacrificed your verdict on the **Funder (#4)** case to gain a simple, powerful principle that resolves all your ambiguities and provides clear guidance for future judgment calls, including the extra scenarios. The key shift is recognizing that a *decisive, known, material misunderstanding* invalidates consent just as surely as coercion or incapacity.
