  4. **Non-Extensionality of Properties (non-negotiable)**: Properties are individuated more finely than by their extensions. Two properties that apply to exactly the same objects can be distinct. This is required because natural language properties can be coextensive but differ in meaning (e.g., "is a renate" and "is a cordate").

  5. **Classical Logic (preference of one camp)**: The underlying logic must be classical, including the law of excluded middle and non-contradiction. This is a preference because classical logic is the standard for formal semantics and is simpler. However, it is acknowledged that non-classical alternatives exist.

  6. **Handling Curry-Style Paradoxes (non-negotiable)**: The theory must resolve not only Russell's paradox (which uses negation) but also Curry-style paradoxes (which use conditionals and do not require negation). The solution must not rely on the presence of negation. This is non-negotiable because the paradoxes are not solely due to negation.

