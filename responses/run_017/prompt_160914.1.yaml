  **The requirements**

  1. **Universal Domain (non-negotiable)**: The domain of quantification must include absolutely everything: every object, every collection, every property, and the domain itself. This is required because natural language allows unrestricted quantification (e.g., "everything is F") and we must be able to talk about the domain as an object.

  2. **Self-Application (non-negotiable)**: Predicates (or properties) must be applicable to themselves. For example, the property of being a property must apply to itself, and the property of being self-applicable must apply to itself. This is non-negotiable because natural language predicates can be self-applicable.

