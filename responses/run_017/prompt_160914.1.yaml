  8. **Diagnosis of Naive Reasoning (non-negotiable)**: The theory must provide a clear account of what is wrong with the step in the naive reasoning that leads to contradiction. This is non-negotiable to avoid ad hoc solutions.

  **Prejudices, not desiderata**

