  Here is a villanelle crafted for your ring-species case study, adhering to your structural and thematic specifications. The refrains are distinct voices (western continuity vs. point of contact without fusion), the gap speaks in the third stanza, and the ambiguity remains unresolved. Rhymes are slant for flexibility, and it's designed to be spoken aloud in under 60 seconds.

  ---

  **The Horseshoe Chain**  

  "With all the east, we share a single flow,"  
  along the basin’s rim, life hand-in-hand—  
  "Here we touch, but do not blend, you know."  

  At the far curve, no barriers in the sand,  
  yet choice alone defines where bonds extend.  
  "With all the east, we share a single flow,"  

  until the fire. The gap cries: *Ash, I stand  
  where link was lost. My embers still pretend.*  
  "Here we touch, but do not blend, you know."  

  The horseshoe holds what pathways can’t defend—  
  no current moves, just memory of a friend.  
  "With all the east, we share a single flow,"  

  though young from both ends wither, frail and slow.  
  Did fire cleave one? Or prove what failed to mend?  
  "Here we touch, but do not blend, you know."  

  The gap is wide. What *could* still interbreed?  
  The answer drifts where flames refuse to go.  
  "With all the east, we share a single flow,"  
  "Here we touch, but do not blend, you know."  

  ---

  ### Key structural choices:
  - **Refrains**:  
    - **R1 (line 1, 6, 12, 18)**: Western end’s claim of continuity ("*With all the east, we share a single flow*").  
    - **R2 (line 3, 9, 15, 19)**: Contact point’s insistence on separation ("*Here we touch, but do not blend, you know*").  
    - They alternate until the final stanza, where they coexist without merging (line 18–19), embodying adjacency without fusion.  
  - **Gap’s voice (stanza 3)**: Speaks through the fire’s aftermath ("*Ash, I stand / where link was lost...*"), highlighting the hinge of the ambiguity.  
  - **Unresolved tension**: The final stanza questions whether the fire *created* two species or *revealed* a preexisting split, without answering.  
  - **Rhyme & meter**: Slant rhymes (e.g., *flow/know, sand/extend*) and loose iambic meter prioritize speakability over rigid form.  
  - **Jargon-free**: Concepts like gene flow or hybridization emerge through imagery ("*memory of a friend*," "*young from both ends wither*").  

  This structure forces the refrains into parallel but separate roles—just like the salamander ends—making the unresolved tension audible to those familiar with ring species. Before reading, you might note: *This explores a ring species interrupted by wildfire, leaving the "one species or two?" question open*.
