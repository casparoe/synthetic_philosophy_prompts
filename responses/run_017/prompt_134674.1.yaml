prompt: |-
  I write features on science and ideas, and I'm researching a long piece on where the units-of-selection debate now stands and where the effort in it should go next. Suppose a new private foundation asked you to advise it. It has money for about ten postdoctoral fellowships over three years, conceptual and theoretical work only, no new data collection. Its interest is narrow: it wants to know which evolutionary explanations should count as respectable when non-biologists invoke them — psychologists, anthropologists, economists, epidemiologists, anyone writing about human social behaviour. Call a question export-grade if a settled answer would change how someone outside evolutionary biology ought to phrase or defend such an explanation, and in-house if it mainly rearranges the terms of the internal dispute.

  Which open questions in this area are genuinely export-grade, and how would you order them by urgency for this funder? Some candidates, which you should treat as provisional rather than binding: whether the gene's-eye view and multi-level selection differ causally or only as alternative ways of partitioning variance, and what causal would have to mean for that to be decidable without new data; what I think of as the grain problem, where the level at which heritable variation is transmitted does not match the level at which the selective interaction occurs, which looks like the live version of the question for cultural inheritance, epigenetic inheritance, and microbial systems with horizontal transfer; whether a higher-level description is ever more than bookkeeping, in the sense that it screens off the lower-level dynamics, generalizes to novel cases, or licenses interventions the lower-level description does not; whether any account of what is selected survives the fact that many candidate units — soma, demes, firms, languages — are not things with clean lineages; and whether the debate has testable content at all once cross-level byproducts and soft selection are on the table.

  Defend the ordering rather than just asserting it: say how much hangs downstream on each question, how tractable it is for theorists with no new data, how neglected it is relative to the attention it gets, and how you weigh those criteria against each other. Say plainly which of these you take to be verbal or overrated and why. And for each of your top four, say what result or argument in the next three years would move it up or down the list. I don't want a literature review, a reading list, or citations — this is for a general audience and I need the arguments, not the sources — and I'd rather have four questions argued hard than ten gestured at.
reasoning: |-
  Okay, the user is writing a feature on the units-of-selection debate and wants advice for a foundation funding theoretical work. The focus is on which questions, if settled, would impact how non-biologists use evolutionary explanations. They call these "export-grade" questions. I need to identify the most urgent ones, defend the order, and explain what would change their priority.

  First, the user's scenario: They're a science writer researching a long piece. The foundation wants to fund postdocs for conceptual work only—no new data. The goal is to clarify which evolutionary explanations are respectable when used outside biology, like in psychology or economics. So the key is identifying questions that, once answered, would change how non-biologists phrase or defend their theories.

  Looking at the candidate questions they provided:  
  - Gene's-eye view vs. multi-level selection (causal difference or variance partitioning?)  
  - Grain problem (mismatch in levels for heritability vs. selection)  
  - Higher-level descriptions being more than bookkeeping (screening off, generalization, interventions)  
  - Units without clean lineages (soma, firms, languages)  
  - Testable content considering cross-level byproducts and soft selection  

  I need to evaluate these based on downstream impact, tractability without new data, neglect, and how I weigh these criteria. Also, I should dismiss any that are verbal or overrated.

  Starting with downstream impact: Which questions, if resolved, would most affect non-biologists? For example, the grain problem is huge for cultural evolution—things like ideas spreading faster than biological traits. If we can clarify levels for heritability vs. selection, it could reshape how psychologists model cultural change. That seems high impact.  

  Higher-level descriptions matter because non-biologists often use group-level terms (e.g., "firms evolve"). If we prove higher levels aren't just summaries but causal, it legitimizes their models. Otherwise, it might force them to reduce everything to genes.  

  Units without clean lineages are everywhere in social sciences—firms merge, languages blend. If we can't handle fuzzy lineages, evolutionary explanations might seem shaky. This directly affects fields like economics or linguistics.  

  The gene's-eye view vs. MLS debate feels more in-house. Philosophers still argue about causality vs. variance partitioning, but it might not change much for non-biologists. They'll use whatever framework fits their case.  

  Testability with byproducts/soft selection: Important, but if the debate is untestable, it might discourage using evolution outside biology. However, I'm not sure it's the most urgent.  

  Tractability: No new data allowed, so questions must be solvable with theory/math. Grain problem and higher-level descriptions seem tractable—e.g., formal models of cultural transmission. Lineages might be harder; defining "fuzziness" theoretically is abstract.  

  Neglect: Grain problem is hot in cultural evolution but still messy. Higher-level work is scattered. Lineages are underexplored in units debates.  

  Weighing criteria: Impact first, since the foundation wants to influence non-biologists. Then tractability—funding is short-term, so questions must be solvable in 3 years. Neglect matters less if a question is pivotal.  

  Now, dismissing some:  
  - Gene's-eye vs. MLS: Overrated for export. Non-biologists don't care about causality debates; they'll use both as needed. Settling it might not change practices.  
  - Testability: Important but vague. If everything is untestable, it's a problem, but other questions are more concrete.  

  Top four:  
  1. Grain problem: Highest impact. Affects cultural/epigenetic/microbial fields. If solved, non-biologists could define units clearly. Urgent because misuse is rampant.  
  2. Higher-level descriptions: Legitimizing group-level explanations is crucial for social sciences.  
  3. Lineages without clean splits: Directly challenges real-world applications.  
  4. Testability: Put lower because it's conditional. If others are resolved, testability follows.  

  For each, what would move the needle in 3 years:  
  - Grain problem: A formal model showing how to align heritability/selection levels in cultural systems.  
  - Higher-level: A theorem proving when higher levels screen off lower ones.  
  - Lineages: Defining degrees of lineage fuzziness mathematically.  
  - Testability: Finding cases where cross-level byproducts can be isolated.  

  I think the grain problem should be prioritized as it directly affects how non-biologists model evolution in their fields. The others follow based on impact and feasibility.
answer: |-
  ### Strategic Advice for the Foundation: Prioritizing Export-Grade Questions  
  Your mandate is razor-sharp: fund theoretical work that clarifies *which evolutionary explanations deserve credence when exported to other fields*. I’ll prioritize questions where a settled answer would force non-biologists to revise their models, abandon flawed analogies, or adopt new standards of evidence. I rank them by **downstream impact** (how drastically non-biological fields would need to change their practices), **tactical tractability** (solvable theoretically in 3 years), and **neglect** (where fresh thought adds disproportionate value). Impact outweighs tractability; neglect breaks ties.  

  I dismiss two candidates as overrated or non-export-grade:  
  - **Gene’s-eye view vs. multi-level selection (MLS)** is largely *in-house*. Whether it’s "causal" or "variance partitioning" changes little for export: non-biologists already borrow both frameworks opportunistically. Settling this won’t force psychologists or economists to rephrase anything; they’ll keep using whichever metaphor fits their narrative.  
  - **Testable content amid byproducts/soft selection** is philosophically deep but a **distraction** here. If the debate lacks testable content, it *invalidates all exports*—but this is a nuclear option. Better to fix the exports first *then* ask if they’re testable.  

  **Top Four Export-Grade Questions, Ranked by Urgency:**  

  #### **1. The Grain Problem (Mismatched Inheritance/Selection Levels)**  
  **What’s at stake:** When heritable variation (e.g., ideas, gut microbes) is transmitted at one level (individuals) but selection acts at another (groups), non-biologists routinely botch explanations. Example: Psychologists claim "memes evolve" but ignore that social learning scrambles inheritance, while epidemiologists model "virus evolution" despite host-level selection dominating. A settled framework would force exported models to specify *which level’s variation is heritable* and *where selection acts*—or admit their analogy fails.  
  **Downstream impact:** High. Affects cultural evolution (anthropology), microbiome studies (medicine), institutional economics ("evolving firms"), and misinformation spread. Misapplying grain causes fatal errors (e.g., assuming group-beneficial traits evolve without group-level inheritance).  
  **Tractability:** High. Formalize "grain alignment" using existing models (e.g., Price equation extensions). Define when a mismatch *requires* multi-level accounting vs. permits reduction. No new data needed—only sharper definitions and mathematical exploration.  
  **Neglect:** Severe. Cultural evolution papers handwave this; microbiome work borrows population genetics ill-fittingly.  
  **What moves the needle in 3 years:** A general theorem proving that *only when inheritance and selection align at level X* can evolution be described at X without distortion. If achieved, non-biologists must either align their models or justify the mismatch—revolutionizing fields like digital anthropology (e.g., "viral tweets" as units).  

  #### **2. Are Higher-Level Descriptions More Than Bookkeeping?**  
  **What’s at stake:** Non-biologists constantly invoke "group selection" (e.g., corporate culture, religious sects) or "species selection" (e.g., in macroeconomics). But if higher levels are *just summaries* of lower-level dynamics, these exports are scientifically empty. To be export-grade, we need criteria for when a higher-level description *screens off* lower levels (i.e., renders them irrelevant for prediction), generalizes beyond case studies, or enables unique interventions.  
  **Downstream impact:** Transformative. Economists modeling "firm evolution" or psychologists describing "trauma inheritance" rely on higher-level units being *real*. If debunked, they must reduce explanations to genes/individuals—or find defensible criteria for emergence.  
  **Tractability:** Moderate. Use causal modeling (e.g., interventions in causal graphs) to formalize "screening off." Existing tools (e.g., Woodward’s invariance) can test if group-level variables have explanatory autonomy.  
  **Neglect:** Growing attention but fragmented. Philosophers write on screening off; biologists rarely bridge to social sciences.  
  **What moves the needle:** A formal proof that higher-level selection *can* screen off individual dynamics *if* (and only if) specified criteria hold (e.g., group boundaries are robust, within-group variation is noise). This would give social scientists a checklist to validate their "group selection" claims.  

  #### **3. Can Units Without Clean Lineages Be Selection Targets?**  
  **What’s at stake:** Many exported units—firms (merging/acquisitions), languages (creoles), social movements—lack tree-like lineages. Biologists often dismiss these as invalid, but non-biologists use them regardless. We need principled rules for when "fuzzy" units can undergo selection. Does selection require Darwinian lineages, or can we define a "lineage-free" alternative (e.g., differential persistence of non-replicating entities)?  
  **Downstream impact:** Critical for legitimacy. If only clean lineages count, economics or linguistics must abandon evolutionary analogies entirely—or redefine units (e.g., treating "business strategies" not firms as units).  
  **Tractability:** Challenging but feasible. Leverage work on "replicators vs. interactors" and extend formalisms (e.g., Metzinger-Schuster models for non-replicating entities). Focus on defining "heritable variation" without reproduction.  
  **Neglect:** Underaddressed. Debates focus on clear biological cases (e.g., species selection), ignoring messier social analogs.  
  **What moves the needle:** A rigorous definition of "selection" that applies to entities with non-hereditary persistence (e.g., religions adapting via schism *not* inheritance). If successful, anthropologists could defend "cultural evolution" without smuggling in biology.  

  #### **4. Is the Debate Testable Given Cross-Level Byproducts?**  
  **What’s at stake:** Even if we resolve questions 1–3, critics argue that cross-level byproducts (e.g., group benefits arising from individual self-interest) and "soft selection" (competition within groups) make units-of-selection untestable. If true, *all* evolutionary exports are suspect. We need to identify scenarios where distinct units make *unique predictions*.  
  **Downstream impact:** Foundational. If testability fails, non-biologists must preface every evolutionary analogy with caveats—or avoid them entirely.  
  **Tractability:** Moderate. Use theoretical models to isolate cases where byproducts can’t explain outcomes (e.g., when group structure alters evolutionary dynamics irreducibly).  
  **Neglect:** Over-discussed biologically, but rarely for export.  
  **What moves the needle:** A taxonomy of "byproduct-proof" signatures (e.g., specific patterns of variation that *only* multi-level selection produces). If found, fields like epidemiology could design studies to distinguish "real" group selection from individual self-interest.  

  ---  

  ### Why This Order?  
  - **Grain and higher-level descriptions are existential**: They determine whether social scientists’ core concepts (memes, group traits) are valid or must be scrapped.  
  - **Lineages and testability are guardrails**: Without them, even good exports risk incoherence—but they build on the first two.  
  - **Tractability aligns with impact**: Grain is solvable *and* transformative; lineages are harder but too crucial to delay.  
  - **Neglect as a force multiplier**: Grain is a live wire in cultural evolution but lacks theoretical rigor—making it ripe for quick wins.  

  **Final counsel**: Fund theorists who combine biological insight with formal modeling (e.g., game theory, causal networks) and force them to collaborate with social scientists. The goal isn’t consensus but *exportable criteria*—e.g., "If your model has property X, you must address grain; if not, it’s unsupportable." In three years, this could turn evolutionary analogies from metaphors into rigorous tools.
