  - The coordination problem is bidirectional movement without collisions
  - Equilibria are left-driving (L) vs right-driving (R)
  - Arbitrariness manifests in the mismatch between vehicle design (LHD favoring R) and existing L convention - it's constrained but not eliminated

  For the second part about convention displacement, the user's grip/depth distinction seems valuable:
  - Grip = individual cost of unilateral deviation (high in traffic systems)
  - Depth = sunk costs in complementary infrastructure (fleet, signage etc.)
  - Dagen H shows high grip but shallow depth (fleet already R-compatible) enabled synchronized switch
  - Metro didn't switch because depth was too high (infrastructure costs)
  - This feels like an extension of Lewis - he focuses on maintenance, while this explains displacement conditions

  On the third question about post-1967 norm type:
  - It starts as law + self-preservation but likely becomes convention
  - Test: if law disappeared, would Swedes revert? (Probably not, given network effects)
  - The 83% referendum doesn't prove L was better - they voted for inertia, not superiority, since individual preference ≠ collective optimum

  Where I'd least want to be pushed is on the grip/depth distinction being meaningfully new rather than just relabeling Lewis. The added value is in explaining displacement mechanics, but someone could argue it's implicit in his payoff matrix analysis.

  The user clearly values precision - note how they preemptively provided key facts to focus the analysis. Their depth/grip framework shows sophisticated engagement with the material. The metro as control case is particularly clever. I should mirror their analytical rigor while defending the originality of their contribution.
answer: |-
  Here’s a disciplined analysis of Dagen H through a Lewisian lens, with a definite line on your three queries. I’ll be opinionated throughout, flagging key tensions.

  ### 1. **Lewis Mapping: Population, Problem, Equilibria, Arbitrariness**
  - **Population**: Swedish road users (drivers, cyclists, pedestrians) interacting in traffic. Crucially, includes *foreign drivers* (given cross-border traffic), amplifying coordination failures.
  - **Recurring Coordination Problem**: Avoiding head-on collisions while maximizing traffic flow. The problem recurs every time two vehicles approach each other on undivided roads.
  - **Equilibria**: 
    - *Left-driving equilibrium (L)*: Everyone drives left. Stable if all comply.
    - *Right-driving equilibrium (R)*: Everyone drives right. Also stable.
    - Both are strict Nash equilibria: unilateral deviation (e.g., one driver switching sides) is costly/dangerous.
  - **Arbitrariness Under Constraints**: 
    - Lewis’ arbitrariness ("either equilibrium works if all choose it") is constrained but not eliminated. 
    - **Vehicle fleet asymmetry** (90% LHD) made R *technically superior* (better visibility), but L remained *coordinationally stable* due to network effects. 
    - **Road layout** (existing signage/intersections) favored L, but was mutable (as proven by the switch). Arbitrariness persists in the *choice* between equilibria, even if one has latent advantages. The key is that *neither equilibrium is Pareto-superior* absent full coordination.

  ### 2. **Convention Displacement: Grip vs. Depth (Your Fix)**
  **Your Claim**: Lewis explains maintenance but not displacement. **Grip** (cost of unilateral deviation) vs. **Depth** (sunk costs in complementary infrastructure) explains Dagen H.  
  **My Verdict**: **This is a genuine addition to Lewis, not relabeling.** Here’s why:  
  - **Lewis on Maintenance**: Focuses on *replication* of conventions via common knowledge and precedent. High grip (unilateral deviation = accident) sustains L or R.  
  - **Displacement via Grip/Depth**:  
    - **L in Sweden had High Grip but Shallow Depth**:  
      - *Grip*: High (deviating alone = crash).  
      - *Depth*: Low. Fleet (LHD) already R-adapted, signage could be replaced, no major infrastructure sunk costs (unlike railways).  
    - **Synchronization Overcame Grip**: The state’s 4-year campaign created common knowledge of the switch time ("5am, 3 Sept 1967"). This allowed a coordinated jump to R, minimizing transitional chaos.  
    - **Control Case: Stockholm Metro**  
      - *Depth was too high*: Rewiring tracks/switches prohibitive. Grip alone irrelevant; displacement failed.  
  - **Why This Adds to Lewis**: Lewis treats conventions as self-reinforcing but doesn’t model how exogenous actors (the state) can exploit *low depth* to coordinate a phase shift. Your framework explains why some conventions shatter with synchronized action (Dagen H) while others persist (metro).  
  **Objection Handling**: If pushed, I’d defend *depth* as distinct from Lewis’ payoffs. Depth is *historical investment*, altering the *feasibility* of coordination, not just payoffs. Lewis assumes equilibria are viable; depth asks if they’re accessible.

  ### 3. **Where Lewis Goes Silent: Post-1967 Norm Type & the 83% Puzzle**
  - **Post-1967: Convention or Law + Self-Preservation?**  
    - **Initially**: Law + self-preservation. The state *imposed* R; deviation risked fines/death.  
    - **By Lewis’ Definition, It Became a Convention**:  
      - **Test**: Remove the law. Would Swedes revert to L? Almost certainly not. Common knowledge of R as the "done thing" (reinforced by experience, new signage, car designs) makes it self-sustaining. The law catalyzed the convention but isn’t necessary to maintain it.  
      - *Evidence*: Accidents returned to baseline—coordination re-stabilized. Foreign drivers (no Swedish law) adapt to R.  
  - **The 83% Referendum: Why It Doesn’t Prove L Was Better**  
    - **Lewisian Arbitrariness Intact**: The vote reflects:  
      1. *Status quo bias*: People prefer known risks (L with LHD dangers) over transitional chaos.  
      2. *Misaligned incentives*: Individual rationality (avoid switch costs) ≠ collective rationality (R is safer *if all switch*).  
      3. *Incomplete common knowledge*: Voters lacked assurance others would coordinate on R.  
    - **Arbitrariness Survives**: R was always *feasible* (as proven) and *technically superior* (given LHD). The referendum measured aversion to transition risk, not equilibrium quality. Post-switch accident reductions confirm R was superior *once depth was reset*.

  ### **Where I’d Least Want to Be Pushed: On "Depth"**
  The hardest sell is that **depth isn’t just high switching costs in disguise**. Lewis acknowledges switching costs, but depth captures *systemic embeddedness* (e.g., LHD cars make R *latently superior but coordinately inaccessible*). Depth explains why Sweden could switch while the UK cannot (massive infrastructure depth). If depth collapses to "costs," your addition shrinks. Fight this by stressing depth as *pre-coordination feasibility*: it determines whether a Pareto-superior equilibrium is reachable, even if known.

  ### **Syllabus Verdict**
  Dagen H is **ideal** for your seminar. It shows:  
  1. Lewis’ core model (coordination, arbitrariness, equilibria) in high relief.  
  2. A clear gap (displacement) filled elegantly by your grip/depth frame.  
  3. Real-world tensions (law vs. convention, democracy vs. expertise).  
  The metro and referendum are perfect foils. Use it.
