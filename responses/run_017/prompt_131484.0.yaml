prompt: |-
  I work nights as a security guard at a data centre, so there's a lot of dead time, and about a year ago I fell down a rabbit hole of forum threads about anthropic reasoning — the doomsday argument, the sleeping beauty coin-flip thing, that case where a philosopher concludes the universe must be enormous just from the fact that we're here. I've got no background in any of it, I just got hooked, and my friend Mara has read a lot more than me, so I've been trying cases out on her for months. Her record so far: on the doomsday argument she says it's legit, that noticing you're somewhere around the hundred-billionth human is a real reason to think the total number of humans won't be astronomically larger, though she won't say how strong; on the presumptuous philosopher case — and on the version where a machine creates either ten people or ten thousand and you wake up in a room and have to guess which batch it was — she says waking up tells you nothing and you should just keep your prior; on sleeping beauty she says one third, and when I pointed out that looks like exactly the same move as the one she rejected in the previous case, she told me I was muddling two different things. On the question of who exactly the pool is that you're supposed to be a random draw from, she said once that it's whoever could have been you, and that being the same species isn't what makes something count, and then ten minutes later said the doomsday argument is specifically about human beings, and told me I was nitpicking when I pointed out those don't obviously fit. The one she's never given a straight answer to is aliens: I asked whether learning that there's a civilization of a trillion conscious beings elsewhere in the universe should change how we reason, and she said she genuinely doesn't know. I've since found out the two rival rules have names, something like self-sampling and self-indication, and I think she's running the first one and rejecting the second, but there seem to be several versions of the sampling rule depending on how big the pool is, and nothing she's said pins it down.

  The new case I want to spring on her is this. Imagine two hypotheses about the future that we've somehow made exactly equally likely on all the ordinary evidence — the nukes, the biotech, the AI-risk stuff, all of it balanced out — so the only thing that could separate them is the indexical stuff. Under H1, we never manage to make digital minds, and the total number of biological humans who ever live is about a trillion. Under H2, we do make them: there end up being something like a trillion trillion digital persons, conscious, with experiences as rich as ours, and the biological human story runs exactly as it does under H1 — same population, same length, same trillion total — there's just this colossal extra population alongside it. We find ourselves as biological humans, fairly early, before any digital person has been built. Should that be evidence for H1? My own feeling is that it all turns on whether those not-yet-existing digital people are in the pool at all, and I also can't tell whether it matters that they'd probably run a thousand times faster in subjective time, so a year of external time would contain a thousand times as many moments of experience — does counting moments instead of persons make the argument stronger, or is that just me confusing myself again?

  So: what do you think she'll say, and more importantly what rules fit her verdicts so far equally well, what does each of them predict about the digital-minds case and about the sped-up version of it, which one would you bet she's actually running and why, and what case should I bring her next that would actually separate the ones still in play? I'm not after a verdict I can repeat at her, I want to know which part of the machinery is doing the work.
reasoning: |-
  Okay, let me try to unpack this user's query. They're a security guard who's gotten really into anthropic reasoning during their night shifts. They've been discussing various thought experiments with their friend Mara, who seems knowledgeable but inconsistent. The user wants to predict Mara's response to a new scenario involving digital minds and figure out the underlying principles she's using.

  First, I need to understand Mara's past positions. On the Doomsday Argument, she agrees that being among the first 100 billion humans suggests the total won't be astrononomically larger, but doesn't specify how strong that evidence is. For the presumptuous philosopher (where a machine creates either 10 or 10,000 people), she says waking up tells you nothing—stick with the prior. But on Sleeping Beauty, she says 1/3 for heads, which seems contradictory because it uses similar reasoning to what she rejected in the presumptuous philosopher case.

  The user points out this inconsistency, but Mara claims they're different. She's vague about the reference class—once saying it's "whoever could have been you," another time specifying humans for Doomsday, dismissing the contradiction as nitpicking. On aliens, she's unsure if knowing about a trillion-being civilization elsewhere affects our reasoning.

  The user suspects Mara is using self-sampling (SSA) but rejecting self-indication (SIA). SSA says you should reason as if you're a random sample from all observers who could exist, while SIA says your existence is evidence that more observers exist. The key difference is whether merely existing gives evidence for larger populations.

  The new scenario: Two hypotheses with equal prior probability. H1: Only biological humans, totaling a trillion. H2: Same trillion biological humans plus a trillion trillion digital minds. We're early biological humans before any digital minds exist. Does this situation favor H1?

  The user also wonders if the digital minds' faster subjective time (more conscious moments per real time) affects the calculation. Should we count persons or moments of experience?

  To predict Mara's response: Since she rejected SIA in the presumptuous philosopher case (waking up doesn't favor the larger population), she'll likely say here that being biological doesn't favor H1. If she's consistent, she should say no evidence for H1, same as before. But there's a twist—we're early observers. If digital minds come later, are they in the reference class? Mara's past answers suggest she might exclude them because they couldn't exist at our current time, making H2's larger population irrelevant. So she might say no evidence, sticking with the prior.

  Regarding subjective time: If digital minds experience more moments, does that increase their weight in the reference class? The user is confused, but Mara hasn't addressed similar issues. She might dismiss it, focusing on entities rather than moments, or she might adjust for "observer-moments." Her Sleeping Beauty 1/3 answer uses observer-moments, so she might apply that here, making H2 even more likely to have more moments, thus strengthening the case against favoring H1.

  Rules fitting her verdicts:
  - SSA with a "causal indexical" reference class: Only observers who could exist at your current time and location. This explains Doomday (all humans count), rejects presumptuous philosopher (only observers in your batch matter), and Sleeping Beauty (all awakenings included). For digital minds, since they don't exist yet, they're excluded, so no evidence for H1.
  - SSA with observer-moments: Explains Sleeping Beauty, and for digital minds, their higher speed means more moments, making H2 have vastly more moments. But in the presumptuous philosopher case, she rejected this. Inconsistency here?
  - Rejecting SIA but inconsistently applying SSA.

  Prediction for digital minds case: Mara will say no evidence for H1 because the digital minds aren't in the current reference class. For the sped-up version, she might be conflicted but likely stick to entity-counting.

  To distinguish between theories, the user should present a case where the reference class definition is tested. For example: A machine creates 10 humans or 10,000 humans, but all are in stasis until 2100. You wake up in a room now (in 2024) alone. Does this suggest the smaller group? If Mara says no evidence (consistent with her past), it supports the causal indexical view. If she says it favors the smaller group, she's using a broader reference class.

  Another test: Modify Sleeping Beauty. If Beauty is told the coin flip affects the number of awakenings (heads: 1 awakening, tails: 10 awakenings), but also that her memories are wiped each time except the last. If she's an early awakening, does that change her credence? Mara's 1/3 approach might not hold here, revealing if she's using observer-moments or total observers.

  The user's deeper needs: They want to understand the machinery behind anthropic reasoning, not just win arguments. They're frustrated by Mara's inconsistencies and seek clarity on reference classes and principles. They might also enjoy the intellectual challenge and the process of probing these ideas systematically.
answer: |-
  Based on Mara's pattern of responses and the underlying tensions in anthropic reasoning, here's a breakdown of what she'll likely say about your digital-minds case, the principles she's using, predictions, and how to test her framework further. The key lies in her *reference class* definition and her rejection of SIA (Self-Indication Assumption).

  ### 1. **What Mara Will Likely Say About Your Case**
     - **Digital-Minds Case (No Speedup):** Mara will **reject** the idea that finding yourself as an early biological human is evidence for H1 (no digital minds). She'll argue you should keep your prior (50/50). Her reasoning: The digital persons don't exist *yet*, so they aren't in the "pool" of observers you could currently be. Only biological humans who exist *now* (or at your temporal location) are in your reference class. Waking up as a biological human is inevitable under both hypotheses, so it provides no new evidence.
     - **Sped-Up Digital Minds (Counting Moments):** She'll likely **dismiss the speedup factor**. Her prior responses suggest she focuses on *entities* ("observers") rather than temporal density ("observer-moments"). She'll argue that subjective time might be philosophically messy and doesn't change the core issue: the digital minds aren't contemporaneous with you, so they don't count.

  ### 2. **The Rules Fitting Her Verdicts (and Their Predictions)**
  Mara consistently rejects SIA (which treats your existence as evidence for larger populations). Instead, she uses a variant of **SSA (Self-Sampling Assumption)** with a **restricted reference class** tied to causal/temporal context. Two frameworks fit her pattern equally well:

  - **SSA with "Causal Indexical" Reference Class:**
    - **Definition:** Your reference class includes all observers who *could exist at your current time and location* given the hypothesis. "Could be you" means "could be in your exact indexical position."
    - **Explains her past verdicts:**
      - *Doomsday Argument:* Only *past and present* humans count (future humans don't exist "now"), so being early is evidence against vast future populations.
      - *Presumptuous Philosopher:* When you wake up, only observers in *your batch* exist at that moment. Waking up tells you nothing because you'd exist in either batch.
      - *Sleeping Beauty (1/3):* All awakenings (Monday-Heads, Monday-Tails, Tuesday-Tails) are distinct "observer-moments" *at the same temporal location*. You're randomly sampled from these.
      - *Aliens:* Uncertainty arises because alien civilizations may not be causally/temporally connected to you.
    - **Prediction for your case:** No evidence for H1. Digital minds don't exist "now," so H2's vast population isn't in your reference class. Speedup irrelevant.

  - **SSA with "Observer-Moments" (but Rejecting SIA):**
    - **Definition:** You're a random sample from all *subjective conscious moments* across all observers.
    - **Explains her past verdicts:**
      - *Sleeping Beauty (1/3):* Directly uses observer-moments (3 moments, 1/3 for Heads).
      - *Presumptuous Philosopher:* Rejects SIA's "more observers = more likely to exist" logic, but if observer-moments were applied here, she *should* favor the larger population—yet she doesn't. This is a tension in her framework.
      - *Doomsday:* If future humans have moments, it weakens the argument—but she accepts Doomsday, suggesting she limits the reference class temporally.
    - **Prediction for your case:** Mixed. *Without speedup*, she might still exclude future moments, so no evidence for H1. *With speedup*, H2's moments outnumber H1's by a factor of trillions, so she *should* strongly favor H2—but this contradicts her rejection of SIA-like reasoning. Likely, she'll avoid this and default to entity-counting.

  **Why both fit?** Her "could have been you" implies causal/temporal constraints, but her Sleeping Beauty answer uses observer-moments. The inconsistency is unresolved.

  ### 3. **What Rule She’s Actually Running (and Why)**
  - **Most Likely:** **SSA with a temporally restricted reference class ("presently existing observers")**.
    - **Why:** 
      - She accepts Doomsday (future observers excluded) and rejects the Presumptuous Philosopher (only your batch exists "now").
      - She dismisses aliens and digital minds as "not here/now."
      - Her Sleeping Beauty 1/3 is the outlier, but she might see it as a special case where all moments are tied to the same causal event (the coin flip). She told you you're "muddling things" because Sleeping Beauty involves *indistinguishable temporal locations within an experiment*, while Presumptuous Philosopher has *distinct batches*.
  - **She’s Rejecting SIA:** This is consistent. SIA would make your existence evidence for larger populations (e.g., favoring the 10,000-batch in Presumptuous Philosopher), which she denies.

  ### 4. **Cases to Separate the Theories**
  To test if she's using **temporal restriction** vs. **observer-moments** (while rejecting SIA), use cases that force a choice between "when" and "how many moments." Here’s the best test:

  #### **Case 1: The Stasis Batch**
  - **Setup:** A machine is run once, creating either:
    - **Option A:** 10 humans in stasis pods, waking up in 100 years.
    - **Option B:** 10,000 humans in stasis pods, waking up in 100 years.
  - You wake up *today* in an empty lab, alone. All evidence suggests you're the only person alive *now*. You know the machine runs automatically in 100 years.  
  - **Question:** Does waking up alone today give you evidence for Option A (the smaller future batch)?

  | Theory | Prediction |
  |--------|------------|
  | **SSA (Temporal Restriction)** | **No evidence.** Only observers existing *now* (just you) matter. Your existence is guaranteed under both options. Keep 50/50 prior. |
  | **SSA (Observer-Moments)** | **Favors Option A (smaller batch).** You're a random moment. Under Option B, there will be 10,000 future observers + you = 10,001 "slots." Under Option A, only 10 future + you = 11 slots. You're more likely to be the sole present observer if future populations are small. |

  *Why this works:* It isolates temporal location. If Mara says "no evidence," she's doubling down on temporal restriction. If she favors Option A, she's slipping into observer-moments (or SIA).

  #### **Case 2: Modified Sleeping Beauty (Speed Variant)**
  - **Setup:** Sleeping Beauty is told:
    - Heads: She is woken once on Monday (slowly, 1x subjective speed).
    - Tails: She is woken *twice* (Monday and Tuesday), but each awakening is sped up 1000x (so each feels like a fleeting moment).
  - All memory wipes apply. When awakened, what should her credence be for Heads?

  | Theory | Prediction |
  |--------|------------|
  | **SSA (Temporal Restriction)** | **1/2.** She counts *awakenings* (entities), not moments. Two awakenings under Tails, one under Heads → 1/3 for Heads? But she previously said 1/3 for standard Sleeping Beauty. *Tension here.* |
  | **SSA (Observer-Moments)** | **~1/1001 (strongly against Heads).** Under Heads: 1 slow moment. Under Tails: 2 moments × 1000x speed = 2000 moments. Total moments: 1 (Heads) vs. 2000 (Tails). P(Heads) = 1 / (1 + 2000) ≈ 0.0005. |

  *Why this works:* If Mara sticks to ~1/3 (counting awakenings), she prioritizes entities over subjective time. If she shifts toward ~0.0005, she's committed to observer-moments. Her reaction will reveal whether Sleeping Beauty was a special case or a general principle.

  ### Key Insight for You
  Mara's core machinery is **reference-class restriction based on shared causal context** (time, location, or experimental setup). She excludes observers who "couldn't be you" *right now*, which is why future digital minds/aliens don't count. But her Sleeping Beauty answer hints at observer-moments *when contexts are identical*. The Stasis Batch case is your best next move—it forces her to clarify whether "now" is a hard boundary. If she rejects evidence for Option A, she's all-in on temporal SSA. If not, she's inconsistent or covertly using observer-moments.

  This isn't about "winning" against Mara; it's about probing the fault lines in anthropic reasoning. Her struggle with aliens and digital minds shows even experts hit ambiguities. For your own clarity: **If the reference class includes all possible observers (regardless of time), H2 is favored. If it's restricted to "observers existing now," H1/H2 stay equal. Speedup only matters if you count moments, not entities.** Keep us posted on her response!
