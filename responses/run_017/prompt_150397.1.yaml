prompt: |-
  I'm writing up my position on cooperation for a reading group in philosophy of biology, and before I present it I want someone to check whether the package actually holds together. Here is where I think I stand:

  (1) In a one-shot prisoner's dilemma against a stranger — including a stranger I have good reason to think reasons about the situation roughly as I do, as long as our two choices are causally independent of one another — defection is the uniquely rational act. The dominance argument is decisive, and I don't think indirect or "be the sort of person who..." moves change that.

  (2) In an iterated prisoner's dilemma of known, finite length, I reject the backward-induction conclusion. I'd cooperate for most of the game, and I treat the unraveling argument as telling us that something in the standard setup is wrong, not as advice about what to do.

  (3) The main evolutionary explanation of cooperation among non-kin is reciprocity: direct reciprocity first, indirect reciprocity through reputation second. And I want this to be real altruism in the following sense — the cooperative act leaves the actor worse off, and the correct explanation of why it happens is not that the actor is pursuing its own long-run interest.

  (4) In the indefinitely repeated game, the folk theorems mean the structure of the game by itself can't tell us which equilibrium will get played; that is an equilibrium-selection question, and the evidence that does the work there — the early computer tournaments, evolutionary simulations — is empirical rather than a matter of the solution concept.

  (5) In a one-shot prisoner's dilemma between two agents who know they are near-copies of each other, cooperation is rational for each: if I defect, so does she, and that reasoning is sound in that case.

  (6) All of this bears on why we have the moral intuitions we have — about fairness, desert, cheat detection — but on whether those intuitions are correct it has nothing to say.

  Please audit this set. Which pairs are genuinely in tension and how badly, which only look like they are, and for each real tension what the least costly revision would be and what it would cost me. I suspect (1) and (5) are the live pair, but I'm not confident I've located the real problem, and I don't know which commitment I'd give up. Rank the tensions by severity, say which single revision would clean up the most, and tell me if any part of the trouble is only about words. Finally, mark clearly which of your claims are settled as far as people who work on this are concerned and which are genuinely contested — I don't want to present a contested position as the consensus.
reasoning: |-
  Okay, the user is preparing a position on cooperation for a philosophy of biology reading group and wants me to audit their six claims for internal consistency. They've identified potential tensions, especially between (1) and (5), but want a comprehensive review. 

  First, I need to unpack each claim carefully. Claim (1) asserts defection as uniquely rational in one-shot PDs with strangers, dismissing indirect reasoning. Claim (5) argues cooperation is rational between near-identical agents. The tension here is obvious: both involve causal independence, but (5) introduces symmetry that overrides dominance reasoning. This isn't just wording—it's a substantive conflict between decision theory frameworks (causal vs. evidential). 

  Looking beyond that, claim (2) rejects backward induction in finite iterated PDs. While logically defensible via bounded rationality arguments, it subtly undermines (1)'s strict dominance principle. If we're allowed to question "standard setups" in iterated games, why not in one-shot symmetrical cases? 

  Claim (3) wants evolutionary reciprocity to be "real altruism," but folk theorems in (4) suggest cooperation emerges from self-interest. This semantic tension could be resolved by distinguishing proximate/ultimate explanations, though the user might resist watering down "altruism." 

  The most severe conflict remains (1) vs. (5). To fix this, they could either: a) restrict (1) to non-symmetric cases (cost: weakening dominance principle's universality), or b) reframe (5) as non-rational but biologically programmed (cost: abandoning rationality argument for cooperation). Option A feels less damaging. 

  On contestation levels: (1) is standard game theory orthodoxy; (2)'s rejection of backward induction is debated but respectable; (3)'s altruism claim is contentious among biologists; (4)-(5) have technical consensus but philosophical disputes. 

  The user's deeper need seems to be presenting a coherent naturalistic ethics foundation without overclaiming scientific support. I should flag where biology stops and philosophy begins—especially regarding moral intuitions in (6).
answer: |-
  Here's a rigorous audit of your position, ranking tensions by severity, identifying contested areas, and suggesting minimal revisions:

  ### Core Tensions (Ranked by Severity)
  1.  **Tension between (1) and (5) (Severe - Conceptual/Foundational)**
      *   **Nature:** (1) relies on **causal decision theory (CDT)**: Your action *causes* your payoff, and since the other's action is independent, defection dominates. (5) implicitly relies on **evidential decision theory (EDT)** or **reflection principles**: Your action *provides evidence* about the other's action (due to similarity), making cooperation rational ("If I defect, I expect she defects, leading to mutual defection; if I cooperate, I expect she cooperates, leading to mutual cooperation").
      *   **Contestation:** This conflict between CDT and EDT is one of the deepest, most contested debates in formal decision theory/philosophy. Neither view is universally accepted as "settled." Proponents of each offer sophisticated defenses.
      *   **Least Costly Revision Options:**
          *   **Option A (Modify 1):** Restrict (1) to cases *without significant symmetry or acausal correlation*. State: "In a one-shot PD against a stranger *where there is no relevant symmetry or acausal correlation*... defection is uniquely rational." **Cost:** Weakens the universality claim of (1); requires acknowledging the relevance of acausal links/evidence in some cases.
          *   **Option B (Modify 5):** Frame (5) not as pure "rationality" but as a *biological/evolutionary imperative* or *psychological heuristic* derived from (3)/(4). "In such cases, evolution has hardwired us (or rational agents shaped by reciprocity) to cooperate because *perceiving* symmetry triggers our reciprocal mechanisms." **Cost:** Abandons the claim that cooperation is *uniquely rational* per decision theory in (5); makes (5) derivative of (3)/(4).
          *   **Option C (Reframe 5):** Argue that near-copies create a *de facto* causal link through a shared decision algorithm or common cause. **Cost:** Strains the concept of "causal independence"; philosophically contentious.

  2.  **Tension between (1) and (2) (Moderate - Methodological)**
      *   **Nature:** (1) strictly adheres to dominance/CDT as decisive in the one-shot case. (2) rejects the logically valid backward induction conclusion in the finite iterated case, appealing to the "something wrong with the setup" (likely bounded rationality, imperfect information, focal points, or rejecting perfect rationality assumptions). This implicitly questions whether the "standard setup" in (1) is always the appropriate model for *real agents*, even in the one-shot case.
      *   **Contestation:** The status of backward induction in finite games is contested. While logically sound under its assumptions, many argue those assumptions (common knowledge of rationality, perfect foresight) are unrealistic. Rejecting it is common in behavioral/evolutionary game theory but controversial among strict rational choice theorists.
      *   **Least Costly Revision:** Explicitly state the *scope* of (1): "(1) describes the uniquely rational act *under the strict assumptions of classical game theory with perfectly rational agents and no acausal links*." Acknowledge that (2) relaxes these rationality assumptions for realistic agents. **Cost:** Slightly qualifies the absoluteness of (1), but makes the position more coherent by clarifying the domain of application.

  3.  **Tension between (3) and (4) (Mild - Semantic/Explanatory Level)**
      *   **Nature:** (3) wants reciprocity-driven cooperation to be "real altruism" defined as the *actor being worse off* and the explanation *not* being the actor pursuing long-run interest. (4) highlights that in evolutionary models/folk theorems, cooperation *persists precisely because* it *is* in the actor's long-run evolutionary/genetic interest (or the interest of the behavioral strategy) in populations with repeated interactions/reputation. The "leaves the actor worse off" applies only to the *isolated act*, not the *strategy* in context.
      *   **Contestation:** The definition of "altruism" in biology/philosophy is famously contested ("biological altruism" vs. "psychological altruism"). Claiming reciprocity isn't "ultimately" self-interested at the evolutionary level is highly contentious.
      *   **Least Costly Revision:** Clarify levels in (3): "The cooperative act leaves the actor *proximately* worse off *in that specific interaction*. The *proximate mechanism* (reciprocity) involves responding to others' behaviors, not direct calculation of long-term self-interest. However, the *ultimate evolutionary explanation* is that this mechanism *is* fitness-enhancing *on average* in the relevant environment." **Cost:** Softens the "real altruism" claim by acknowledging the ultimate self-interest explanation; might feel like conceding too much if you strongly want "real" altruism.

  4.  **Potential Tension between (2) and (4) (Mild - Empirical Focus)**
      *   **Nature:** (2) rejects a theoretical solution (backward induction) for empirical/bounded rationality reasons. (4) emphasizes that equilibrium selection in indefinite games is an *empirical* question (tournaments, simulations). This is mostly complementary, but (2)'s stance could be seen as consistent with (4)'s empirical focus *if* we interpret backward induction as failing the empirical test.
      *   **Resolution:** They cohere well. Frame (2) as an example of how the theoretically "rational" solution fails empirically, aligning with (4)'s point that empirical evidence, not pure theory, determines behavior in complex repeated interactions. **No revision needed.**

  ### Summary of Revisions & Costs
  1.  **Address (1) vs. (5) (Highest Priority):** Choose Option A (modify 1) or Option B (modify 5). **Option A (modify 1)** is likely the *least costly philosophically* if you want to retain (5)'s rationality claim. It clarifies the scope of dominance reasoning without abandoning CDT entirely. **Cost:** Acknowledges a significant exception to the universality of dominance/CDT.
  2.  **Clarify (1) vs. (2):** Explicitly scope (1) to "classical, perfect rationality" assumptions. **Cost:** Minor qualification.
  3.  **Refine (3):** Distinguish proximate mechanism (potentially non-self-interested *calculation*) from ultimate explanation (fitness-enhancing *outcome*). **Cost:** Weakens the "real altruism" claim slightly but aligns better with evolutionary biology.

  ### Contestation Status (Based on Academic Literature)
  *   **(1) Dominance in One-Shot PD (Stranger):** **Settled in Classical Game Theory.** The dominance argument is orthodox under standard rational choice assumptions (causal independence, self-interest). *Contested* by proponents of EDT, team reasoning, or Kantian approaches.
  *   **(2) Rejecting Backward Induction (Finite IPD):** **Contested.** Backward induction is logically valid under its assumptions. Rejecting it is common in behavioral/experimental economics, evolutionary game theory, and philosophy (e.g., Pettit, Sugden) focusing on bounded rationality or focal points. Strict rational choice theorists (e.g., Binmore) defend it.
  *   **(3) Reciprocity as "Real Altruism":** **Highly Contested.** The claim that reciprocity represents "real altruism" *in the ultimate evolutionary sense* is strongly challenged. Most evolutionary biologists (e.g., Trivers, Nowak, West) view reciprocal altruism as *enlightened self-interest* at the genetic/strategic level. Debates focus on definitions (biological vs. psychological altruism).
  *   **(4) Folk Theorems & Empirical Selection:** **Settled Core, Contested Details.** Folk theorems are mathematically settled. That equilibrium selection requires more than the solution concept (needs dynamics/empirics) is widely accepted in evolutionary and behavioral game theory. *Contested* aspects include *which* dynamics/empirical results are most relevant/general.
  *   **(5) Cooperation with Near-Copies:** **Settled Mechanism, Contested Rationality.** That agents knowing they are identical/symmetrical might cooperate is well-established (e.g., Hofstadter's "Superrationality"). Whether this is "rational" under standard decision theory is **highly contested** (CDT vs. EDT debate). It's often presented as a *challenge* to CDT.
  *   **(6) Bearing on Moral Intuitions:** **Contested.** That evolution shaped moral intuitions is widely accepted (e.g., de Waal, Haidt, Joyce). Whether this implies anything about their *correctness* (e.g., moral realism vs. anti-realism) is a core, unresolved debate in meta-ethics.

  ### Recommendation
  1.  **Prioritize Fixing (1) vs. (5):** Adopt **Option A**: Modify (1) to explicitly exclude cases of symmetry/acausal correlation. This is the most coherent way to retain both claims without abandoning core decision theory entirely. State: *"(1) In a one-shot prisoner's dilemma against a stranger — including a stranger I have good reason to think reasons about the situation roughly as I do, as long as our two choices are causally independent of one another **and there is no relevant symmetry or acausal correlation linking our decisions** — defection is the uniquely rational act."*
  2.  **Clarify Scope of Rationality:** Add the qualifier about "classical assumptions" to (1) as suggested for the (1)/(2) tension.
  3.  **Refine "Real Altruism":** Add the proximate/ultimate distinction to (3) to preempt criticism from biologists.

  This package, with these revisions, holds together significantly better. It acknowledges the core tension in decision theory ((1) vs. (5)) by scoping (1), maintains a plausible rejection of backward induction consistent with an empirical focus ((2) & (4)), clarifies the altruism claim ((3)), and leaves the meta-ethical question open ((6)). Be transparent about the contested nature of (2), (3), (5), and the implications of (6). Presenting (1) as modified and (5) as stated clearly flags the key philosophical debate (CDT vs. EDT) for your audience.
