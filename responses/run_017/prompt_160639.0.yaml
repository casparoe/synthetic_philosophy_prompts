  The number is most sensitive to the probability of reductionism being correct. A strong argument against the acquisition objection could lower it. The user's disagreement with their colleague probably centers on how much background knowledge contaminates the "cold-start" scenario—they might see more spillover, while the colleague thinks purity is possible.

