answer: |-
  Here's a battle-tested procedure designed for your constraints. It focuses on **practical consequences** and **mutual understanding** to bypass purely verbal or unresolvable metaphysical disputes. It's a 3-step ladder: if you get agreement at Step 1, it's verbal; Step 2, it's factual/values-based; Step 3, it needs a vote. If you hit bedrock disagreement at Step 3 or earlier with no observable stakes, it's likely unresolvable/verbal. The core principle: **"What changes *in practice* based on which answer is 'right'?"**

  **The Procedure (to post verbatim):**

  > **"Moderator Check-In:** To help clarify this discussion, let's try this:
  > **1.  Concrete Cases:** If we imagine different specific examples related to [Topic X], would you both *agree* on how to handle each one? (e.g., "Would this scenario count? What about this one?").
  > **2.  Reasons & Stakes:** If you *disagree* on some cases (or even if you agree!), *why* does it matter? What practical difference does calling it [Word A] vs. [Word B] make here? (e.g., "Does it affect a prize rule? Change how we use the image? Alter a real-world action?").
  > **3.  Core Value/Goal:** If the practical stakes involve what the forum *should do* or what's *important*, can you both agree on the *main goal* we're trying to achieve? (e.g., "Is it about accuracy for prizes? Encouraging participation? Preserving tradition?").
  >
  > *   **If Step 1: Full Agreement:** You likely disagree only on the *word*, not the practical outcomes. We suggest using clearer phrases like "escaped zoo birds" or "AI-generated images" to avoid confusion, and move on.
  > *   **If Step 1: Disagreement, but Step 2: Clear Stakes:** This is a real disagreement about facts or rules. Please focus the discussion *only* on those stakes (e.g., the prize rules, image usage guidelines).
  > *   **If Step 2: No Observable Stakes:** The disagreement doesn't seem to affect any observable outcome or action. We'll likely lock this as non-actionable.
  > *   **If Step 3: Agreement on Goal, Disagreement on How:** This is about *what we should value/do*. State your preferred action based on the shared goal. If consensus isn't reached, we may poll members.
  > *   **If Step 3: Disagreement on Goal:** This is a fundamental values difference. State your core goal clearly. If consensus isn't reached, we may poll members or lock if it becomes unproductive.
  >
  > Please answer these points directly. We'll reassess the thread based on your responses."

  **How to Run It (15 mins):**
  1.  **Identify Core Word/Concept:** Pinpoint the disputed term(s) (e.g., "wild", "photograph", "exists").
  2.  **Post the Procedure:** Paste the text above, replacing `[Topic X]`, `[Word A]`, `[Word B]` appropriately.
  3.  **Set Timer (5-7 mins):** Ask each user to answer the numbered steps *concisely*.
  4.  **Analyze Responses (5-8 mins):** Apply the exit points (*italicized* in the procedure).
  5.  **Act & Post Rationale:** Lock thread (non-actionable/verbal), keep open (factual/values with stakes), or announce poll (values disagreement). Add a *brief* sentence: "Based on responses: [Reason - e.g., 'no practical stakes identified', 'disagreement centers on prize rule interpretation', 'fundamental values difference requiring poll']."

  **Test Runs:**

  1.  **"Wild" Zoo Escapee (Prize at Stake):**
      *   **Step 1 (Cases):** User A: "No, it's not wild; its ancestors were captive." User B: "Yes, it's wild; it was born free and lives independently." *Disagreement on cases.*
      *   **Step 2 (Reasons & Stakes):** User A: "The prize rules aim to find birds *naturally occurring* here, not escapes." User B: "The rules say 'occurring wild in the county' – location and behavior matter, not ancestry." *Stakes identified: Prize rule interpretation.*
      *   **Step 3 (Core Goal):** Both likely agree: "Accurately award the prize based on the intended rule." *Agreement on goal.*
      *   **Analysis:** This is a **real disagreement about rule interpretation** (factual/legal). *Keep open* focused *only* on interpreting the specific prize rule text. The "wild" label is a proxy. Exit: **"Keep open. Disagreement centers on interpreting the specific prize rule criteria."**

  2.  **AI-Generated "Photographs":**
      *   **Step 1 (Cases):** User A: "AI image of a robin? Not a photo." User B: "AI image output? It's a photo if it looks real." *Disagreement on cases.*
      *   **Step 2 (Reasons & Stakes):** User A: "Photos require light captured by a camera. AI isn't photography, it dilutes the skill." User B: "It looks like a photo, serves the same purpose. Who cares how it's made?" *Stakes identified: Forum image category definitions & perceived value/skill.*
      *   **Step 3 (Core Goal):** User A: "Preserve photography as a distinct skill/art involving real capture." User B: "Encourage sharing visually accurate nature representations, regardless of tech." *Disagreement on core goal.*
      *   **Analysis:** This is a **fundamental values disagreement** about the forum's purpose regarding images. *Requires a member vote/poll.* Exit: **"This reveals a values difference about the forum's goals for images. We'll create a poll for members to decide policy."** (You won't like this if you wanted a quick lock, but the stakes exist for the forum's function).

  3.  **Do Numbers Exist?:**
      *   **Step 1 (Cases):** User A: "Does '3 robins' imply three exists? Yes." User B: "No, only the robins exist; 'three' is just a concept." *Disagreement on cases.*
      *   **Step 2 (Reasons & Stakes):** User A: "Math works, so numbers must exist in some way." User B: "We use concepts without them being real things. It changes nothing practical here." User A: "It changes how we understand reality!" *No observable stakes identified beyond abstract philosophy.*
      *   **Step 3 (Core Goal):** User A: "Understand ultimate reality." User B: "Discuss birdwatching." *No shared actionable forum goal.*
      *   **Analysis:** **No observable stakes exist for the forum's purpose.** The disagreement is profound but purely metaphysical/verbal in this context. *Lock as non-actionable.* Exit: **"Locked. While interesting, no practical consequences for the forum's nature/birdwatching activities were identified."** (You might dislike locking a "deep" discussion, but the procedure flags the lack of concrete stakes).

  **Honest Limitations:**

  1.  **"Gish Gallopers":** Users who flood with irrelevant cases or refuse to engage with the steps derail it. Mod judgment is still needed to enforce focus.
  2.  **Deeply Buried Stakes:** Sometimes, users struggle to articulate *why* it matters (Step 2). The procedure might prematurely lock a thread with real, unstated stakes (e.g., unspoken anxiety about AI replacing human artists).
  3.  **The "Is-Ought" Gap:** It can't magically resolve whether a descriptive fact ("is") implies a forum policy ("ought"). Step 3 forces this into the open for a vote, but that's a political, not philosophical, resolution.
  4.  **True Ontology Debates:** It *will* shut down threads like the numbers one, as it should for your forum's purpose. It can't solve millennia-old metaphysics in 15 minutes. This is a feature, not a bug, given your constraints.

  This procedure prioritizes **forum functionality** over philosophical purity. It forces arguers to connect their words to observable consequences or actionable values, which is exactly what you need to cut through the fog. The scripted paragraph provides clarity and transparency, putting the onus on the users to reveal the nature of their dispute.
