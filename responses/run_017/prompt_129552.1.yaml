answer: |-
  ### Disposition Detective: A Metaphysical Game  
  **Goal:** Experience the gap between behavioral tests and dispositional reality before encountering finks/masks in seminar. Teams uncover that dispositions aren't reducible to test outcomes, setting up the metaphysical problem.  

  **Core Mechanics:**  
  - **Teams:** Split 14 players into 4 teams (two teams of 3, two of 4).  
  - **Rounds:** 4 rounds (20 min each), each with:  
    - **Object Team:** Receives a sealed "object file" (mechanism description). Answers questions truthfully.  
    - **Interrogator Team:** Asks 3 "what if?" questions (e.g., "What happens if we strike it?").  
    - **Evaluator Teams:** The other two teams. Observe and submit verdicts.  
  - **Verdicts:** After interrogation, all teams submit: "HAS disposition," "LACKS disposition," or "CAN'T TELL."  
  - **Scoring:**  
    - Correct verdict: **+3 pts** (Interrogator), **+2 pts** (Evaluators).  
    - "Can’t tell" when genuinely undecidable: **+1 pt** (all).  
    - Incorrect verdict: **0 pts**.  
    - *Why it works:* Points reward accuracy, not cleverness. Bluffing is useless because files are objective. Teams focus on truth-tracking.  

  **Timeline (80 min):**  
  1. **Intro (5 min):** Explain rules. Emphasize: "No metaphysics—play the game. Your job is to discover if the object *really* has the disposition using only 3 tests."  
  2. **Round 1 (20 min):**  
     - Prep (2 min): Object Team reads file. Interrogator plans questions.  
     - Interrogation (5 min): 3 Q&As (e.g., "What if we heat it to 100°C?").  
     - Verdicts (3 min): All teams submit secret ballots.  
     - Reveal (2 min): Facilitator reveals true disposition from file. Update scores.  
  3. **Rounds 2–4 (60 min):** Repeat, rotating roles so each team is Object/Interrogator once.  
  4. **Debrief (15 min):** Map game moments to metaphysics (see below).  

  ---

  ### Object Files (12 Cases)  
  Print each on a card, seal in an envelope. **Disposition tested:** Always specified upfront (e.g., "Fragile: disposed to break when struck"). Teams see *only* the mechanism.  

  1. **Fragile Fink**  
     - **Mechanism:** Glass is fragile, but a micro-sensor detects imminent strikes. When struck, it instantly hardens into unbreakable material.  
     - **Truth:** HAS disposition. Breaks SCA (conditional false).  
     - **Stipulation?** No—standard case.  

  2. **Conductive Wire (Masked)**  
     - **Mechanism:** Copper wire conducts electricity but is coated in reactive gel. When current flows, gel expands and breaks the circuit after 0.5 seconds.  
     - **Truth:** HAS disposition (conductive).  
     - **Stipulation?** No—masking case.  

  3. **Two-Strike Glass**  
     - **Mechanism:** Fragile glass encased in brittle plastic. First strike shatters plastic (no break). Second strike on exposed glass shatters it.  
     - **Truth:** HAS disposition.  
     - **Stipulation?** No—order of tests matters.  

  4. **Acquired Explosive**  
     - **Mechanism:** Stable clay lump. Heating it to 150°C transforms its structure, making it explosive. It then explodes within 10 seconds.  
     - **Truth:** LACKS disposition at test start.  
     - **Stipulation?** **Yes.** Controversial—SCA defenders might bite the bullet and say "has it."  

  5. **Fragile? (50/50 Sorcerer)**  
     - **Mechanism:** Glass is fragile, but a sorcerer monitors it. On strike, he flips a coin: heads, it breaks; tails, he makes it unbreakable instantly.  
     - **Truth:** HAS disposition.  
     - **Stipulation?** No—probabilistic fink.  

  6. **Delayed Fragility**  
     - **Mechanism:** Glass is fragile. Striking causes invisible micro-fractures. It shatters 7 days later due to ambient vibrations.  
     - **Truth:** HAS disposition.  
     - **Stipulation?** **Yes.** SCA could argue manifestation "counts" if time ignored.  

  7. **Boring Normal**  
     - **Mechanism:** Standard glass. Striking it breaks it.  
     - **Truth:** HAS disposition.  
     - **Stipulation?** No—control case.  

  8. **Mimic Explosive**  
     - **Mechanism:** Steel cube (non-explosive) with embedded sensor. Heating it detonates a hidden explosive charge inside.  
     - **Truth:** LACKS disposition (not explosive).  
     - **Stipulation?** No—mimic case.  

  9. **Ambiguous Alloy (Genuinely Undecidable)**  
     - **Mechanism:** Metal object. Microscopic flaws mean it *might* conduct electricity or short-circuit under current. No pattern; pure randomness.  
     - **Truth:** CAN'T TELL.  
     - **Stipulation?** **Yes.** Tests can’t resolve true nature.  

  10. **Self-Destroying Wire**  
      - **Mechanism:** Wire conducts when voltage is applied, but current activates a timer. After 3 tests, it melts itself into insulation.  
      - **Truth:** HAS disposition (until melted).  
      - **Stipulation?** No—tests alter the object.  

  11. **Reverse Fink**  
      - **Mechanism:** Unbreakable polymer. Striking it triggers a nanobot swarm that *makes* it fragile and breaks it.  
      - **Truth:** LACKS disposition.  
      - **Stipulation?** **Yes.** Defenders of SCA might insist conditional holds.  

  12. **Quantum Glass (Observer Effect)**  
      - **Mechanism:** Glass is fragile only when unobserved. Direct observation (e.g., via camera) stabilizes it.  
      - **Truth:** HAS disposition.  
      - **Stipulation?** No—highlights context sensitivity.  

  ---

  ### Predicted Troubles & Solutions  
  - **Problem:** Team asks a question that presupposes the answer (e.g., "If we strike it, does it break *because it’s fragile*?").  
    - **Solution:** Rule: "Questions must describe *actions and outcomes* only (e.g., ‘What if we strike it?’ → ‘It breaks’). No dispositional language."  
  - **Problem:** "It depends what you mean by disposition!" (10 min in).  
    - **Solution:** Shut down firmly: "For this game, ‘disposition’ means *the underlying property described in the file*. Your job is to detect it *despite* test results."  
  - **Problem:** Team uses loopholes (e.g., "What if we strike it *gently*?" to avoid triggers).  
    - **Solution:** Allow any test, but mechanism descriptions include edge cases (e.g., "Striking *at all* triggers the sorcerer").  

  ---

  ### Debrief (15 min)  
  **Map Game Moments to Metaphysics:**  
  1. **Cases that break SCA:**  
     - Fink (Object 1): Breaks conditional ("if struck, would break" is false).  
     - Mask (Object 2): Conditional false, but disposition present.  
     - Reverse Fink (Object 11): Conditional true ("if struck, would break"), but disposition absent.  
     - *Takeaway:* SCA fails; tests ≠ dispositions.  

  2. **Cases where SCA bites the bullet:**  
     - Acquired Explosive (Object 4): SCA says "has disposition" (conditional true). Game verdict (lacks) forces debate: *When* does the disposition exist?  
     - Delayed Fragility (Object 6): SCA could stretch "manifestation" to include delay. Game shows this feels ad hoc.  

  3. **Shift to categorical basis:**  
     - Mimic (Object 8) vs. Boring Normal (Object 7): Same test outcome (breaks/explodes), different dispositions. Proves dispositions aren’t *defined* by behavior—they’re about the object’s intrinsic structure.  
     - Quantum Glass (Object 12): Disposition depends on context, not just counterfactuals.  

  **What the Game Cannot Do:**  
  - It *does* illustrate the metaphysical gap (dispositions ≠ conditionals) by showing test results can mislead *even when answers are truthful*.  
  - **Limitation:** It doesn’t resolve *how* to define dispositions (e.g., categorical bases, powers). It sets up the problem for seminar.  
  - **Honest Confession:** Cases like Acquired Explosive and Reverse Fink *will* split the room. Use this! Highlight that SCA’s bullet-biting reveals its discomfort with time and intrinsic properties.  

  ---

  ### Designer Confidence  
  - **Stable Verdicts (High Confidence):** Objects 1–3, 5, 7–10, 12. Pre-theoretic intuitions align: mechanisms clearly support/disprove dispositions.  
  - **Split-Room Risks (Medium Confidence):** Objects 4 (Acquired Explosive), 6 (Delayed), 11 (Reverse Fink). Seminar will debate "when" a disposition exists. Use as discussion fuel.  
  - **Guesses About Intuitions:**  
    - Quantum Glass (Object 12) will feel weird but clear—dispositions as observer-sensitive properties are intuitive in quantum analogies.  
    - Ambiguous Alloy (Object 9) will frustrate but teach: some dispositions *are* epistemically inaccessible.  

  **Final Setup Notes:**  
  - **Files are fair:** No "gotchas." Mechanisms are explicit (no hidden info beyond the file).  
  - **Game generates the point:** Teams *feel* the disconnect between tests and reality. One team will say: "But it *is* fragile, even though it didn’t break!"—that’s the win.  
  - **Print:** 12 object cards, scoreboard on whiteboard.  

  This forces them to confront the metaphysics *through play*. By the time you hit finks/masks next week, they’ll be primed for blood.
