prompt: |-
  I write literary fiction, and for each of my last three novels my publisher has sent any passage containing a slur to the same in-house language panel before copy-edit. I have kept their rulings, and read together they look less like a series of judgments of taste than like the application of a rule nobody has ever stated to me. I am about to submit a fourth manuscript and I would rather work out the rule now than negotiate it one sentence at a time. I don't need the scholarly literature on slurs; I need the rule, and I need to know what the panel would do with a passage their rule has not yet met.

  The record, as I have it:

  1. A boarding-school novel set in 1986, third person, protagonist a boy with cerebral palsy. His dorm-mates call him *spaz* in dialogue; in my draft nobody reacted. The panel blocked it and asked for a counter-signal in the text. I gave the boy a line of thought immediately afterwards, and it passed.
  2. In the same novel, the omniscient narration named what the other boys saw when they looked at him, using the same word. The panel cut it with no discussion; as I understood their reasoning, the narrating voice is the book's voice, not the boys'.
  3. Also in that novel, a doctor used *spastic* clinically, in dialogue, as part of a diagnosis. Passed without comment.
  4. In a later novel, two characters with cerebral palsy used *spaz* to each other in dialogue, affectionately and reciprocally. Passed without comment — no counter-signal requested.
  5. In the same novel, the non-disabled boyfriend of one of those characters used the same word to her in dialogue, affectionately; she laughed, and the scene treated her laughter as genuine. The panel cut it. Their note distinguished this from case 4 only by who was speaking.
  6. An epigraph in that novel quoted a 1950s charity poster that contains the word. Passed, once I attributed the poster precisely. So mention and use are not the same thing to them.

  I have tried to reconstruct the rule and I keep arriving at two that fit all six. One says the question is standing: a member of the targeted group may reclaim the word, a non-member's use survives only where the text marks it as the character's rather than the book's — that gets cases 1, 4 and 5, and treats case 2 as an unmarked non-member use. The other says the question is which textual level the word occupies: represented speech and represented thought are quotation and are permitted if the work doesn't adopt the contempt, while the narrating voice is never available for a slur — that gets case 2 directly and explains case 5 as quotation the work failed to distance itself from. A third possibility I can't eliminate is that what has really been driving them is the position of the reader: whether the word reaches someone who is not a member without a frame that licenses it. Case 5 seems to kill the crude version of that — uptake by the person addressed was not enough — but not the version on which it is the reader's position that matters.

  The new manuscript is a first-person retrospective narrated by a woman of sixty-two who has mild spastic diplegia; much of it is addressed to a friend from her childhood clinic who died at nineteen and who had the same diagnosis. Three instances are at issue:

  A. In the narrating voice, describing a photograph of the clinic's outing: *we were the spastics, that was the word they had for us and we took it and wore it.* The "we" is the two of them; the "you" it is addressed to is her dead friend. Affectionate, defiant, not a report of anyone's speech.
  B. In dialogue, the friend, age eleven: *come on, spaz, keep up*. In-group, affectionate.
  C. In dialogue, a stranger on a bus in 1979: *get out of the way, you stupid spastic*, answered by a shouted line of hers and nothing from anyone else in the scene.

  There is also a transatlantic wrinkle. My American editor wants C changed to *spaz* for the US edition, on the ground that American readers hear *spastic* as clinical and *spaz* as "clumsy person," so the insult won't land otherwise. I think that flattens the history the book is about, but it also raises a question I can't answer from the record: whether the panel's rule is a rule about a word with a history, and what it would say if the same sentence had to be judged twice for two audiences who hear it differently.

  So, please: predict the panel's ruling on each of A, B and C, and say which of them is the real fight. State the rule you take them to be running, state the alternative rules that fit all six precedents as well as it does and where each of those comes out on A, and give me your confidence on each verdict with the reason for it. Then tell me what I should do if I want to keep A: what is the smallest change that flips the verdict under the rule you think likeliest, and what is the price of that change in prose terms — does moving the word into dialogue, or into the friend's mouth, or into an epigraph, actually preserve what the sentence is doing, or does every route that satisfies the panel destroy the register the book is written in? Finally, name one further instance — a variation I could draft and submit, or a question I could put to them directly — that would force the panel to reveal which of the two or three rules they are running, and say what each rule predicts about it. I would rather provoke the disclosure deliberately than discover it in a revision letter.
reasoning: |-
  Hmm, the user is a literary fiction author grappling with an in-house language panel's inconsistent rulings on slur usage across their novels. They've provided six detailed precedents and three new problematic instances in their upcoming manuscript. 

  First, I need to dissect their precedents. Case 1 shows reclaiming requires explicit textual counter-signals when non-members use slurs. Case 2 proves narration is sacred ground - no slurs allowed. Case 3 demonstrates clinical terminology gets a pass. Case 4 reveals in-group reclaiming needs no justification. Case 5 crucially shows even affectionate non-member usage fails without narrative condemnation. Case 6 establishes that quoted historical material survives with attribution. 

  The author's proposed rules all hold water: Standing (who speaks) vs Level (narration/dialogue) vs Reader Position (contextual framing). But Case 5 is the linchpin - the boyfriend's identical affectionate usage getting cut while disabled characters' passed suggests Standing trumps other factors. The panel seems to prioritize identity over intent or framing.

  Now for the new manuscript's landmines: Instance A is tricky because while the narrator reclaims "spastics" in first-person narration, the panel historically treats narration as inviolable (Case 2). But here the narrator is part of the reclaimed group - a novel conflict. Instance B should be safe as in-group dialogue (Case 4 precedent). Instance C clearly violates as hostile non-member usage (Case 5 parallel). 

  The transatlantic issue is fascinating - if "spastic" reads clinical to Americans, does that neutralize its slur status? Probably not for the panel, who likely care about historical context over contemporary reception. 

  For the author's survival strategy: To save Instance A, shifting to dialogue ("you'd say 'we were the spastics'") might work but betrays the memoir's introspective tone. Making it a defiant chant ("we shouted 'we are the spastics!'") preserves reclamation but alters the quiet resilience. Both are compromises. 

  Finally, to force the panel's hand: Draft a non-member character using the slur affectionately but with immediate narrative condemnation. If they reject it, Standing is absolute; if they accept it, Level/Reader Position matter more. 

  This author's real struggle is artistic control versus institutional risk-aversion. The panel isn't wrong to guard against harm, but their opaque rules turn literary nuance into compliance paperwork. The solution might lie in preemptive discussion - showing them how Instance A's reclamation differs from Case 2's hostile narration could prevent another frustrating revision cycle.
answer: |-
  Based on your meticulous record and the new manuscript context, here's the panel's likely rulings, the governing rule, alternatives, and strategic advice:

  **Predicted Rulings & Confidence:**
  1.  **A (Narrator reclaiming in 1st-person narration):** **BLOCKED (High Confidence).** *Reason:* Despite the narrator's identity and reclamation intent, the panel treats the *narrating voice* as inviolable (Case 2). Your narrator *is* "the book's voice" here, using the slur directly, not quoting or representing another's speech/thought. Case 6 (epigraph) proves quotes survive; this isn't one. Standing (Case 4/5) doesn't override the narration taboo.
  2.  **B (Friend reclaiming in dialogue):** **PASSED (Very High Confidence).** *Reason:* Directly parallels Case 4 - in-group, affectionate, reciprocal reclaiming by members of the targeted group. No counter-signal needed.
  3.  **C (Stranger using slur aggressively in dialogue):** **BLOCKED (Very High Confidence).** *Reason:* Non-member hostile use in dialogue. Case 1 & 5 show non-member use requires counter-signal (even if affectionate). Hostility + no immediate textual condemnation (just her shouted retort) fails Case 1's requirement. Reader position theory also demands framing.

  **The Real Fight:** **A.** B and C have clear precedents. A challenges the panel's core "no slur in narration" rule head-on, even with reclamation.

  **The Panel's Rule (Most Likely): "Level + Standing + Framing"**
  *   **Rule:** Slurs are prohibited in the *narrating voice* (Level), regardless of speaker identity or intent. In *represented speech/thought (dialogue/internal monologue)*, slurs are permitted only if spoken by a member of the targeted group (Standing) OR if spoken by a non-member *and* the text provides immediate, unambiguous counter-signal condemning or contextualizing the usage (Framing). Historical/documentary mention (epigraphs) is permitted with clear attribution.
  *   **Fits Precedents:**
      *   Case 1: Non-member dialogue (Level: Dialogue) - Blocked without counter-signal (Framing required), passed with it.
      *   Case 2: Narration (Level: Narration) - Blocked (Absolute prohibition).
      *   Case 3: Member (Doctor)/Clinical Context (Standing/Specific Frame) - Passed (Level: Dialogue, Standing/Framing).
      *   Case 4: Member dialogue (Level: Dialogue, Standing) - Passed.
      *   Case 5: Non-member dialogue (Level: Dialogue) - Blocked (No counter-signal despite affection/laughter - Framing inadequate).
      *   Case 6: Mention (Documentary/Historical Level) - Passed (Attribution provides Frame).
  *   **A Under This Rule:** Blocked. Violates the absolute "no slur in narration" tenet. The narrator's identity and reclamation intent are irrelevant at this textual level.

  **Alternative Rules & Outcomes for A:**
  1.  **Pure Standing (Who Speaks):**
      *   Rule: Slurs are permitted *only* when spoken/written by a member of the targeted group reclaiming it (in dialogue or narration). Non-member use is prohibited regardless of context or framing. Narration level is irrelevant if the narrator is a member.
      *   Fits Precedents: Explains Case 4 vs 5 perfectly. Explains Case 1 needing counter-signal (non-member). Struggles with **Case 2** (Narration blocking even though the *characters* are non-members - why block narration if it's just describing *their* view?). Ignores Case 3 (non-clinician non-member use would be blocked under pure standing?).
      *   **A Under This Rule:** PASSED. Narrator is a member reclaiming the word directly in her own narration.
  2.  **Level + Framing (Ignoring Standing):**
      *   Rule: Slurs are prohibited in the narrating voice (Level). In represented speech/thought, slurs are permitted *if* the text provides sufficient counter-signal/framing (condemnation, context, irony), *regardless* of who speaks. Standing is irrelevant; framing is everything.
      *   Fits Precedents: Explains Case 1 (framing needed), Case 2 (narration blocked), Case 5 (blocked - laughter insufficient framing). **Struggles with Case 4 vs 5.** Why did Case 4 (member use) pass *without* framing, while Case 5 (non-member use) failed *with* (affection/laughter)? This rule predicts both should need similar framing, or both could pass without if context is clear. Case 4 suggests standing *does* matter for framing requirements.
      *   **A Under This Rule:** BLOCKED. Narration level prohibition. Framing/intent irrelevant.

  **The Transatlantic Wrinkle (C):**
  *   The panel's rule is likely based on **historical intent and the author's context**, not contemporary regional reception. They blocked non-member *spaz* in Case 1 (1986 UK) and *spastic* in Case 5 (implied UK). They passed clinical *spastic* in Case 3 (UK). Changing C to *spaz* for the US might make the insult *less* historically accurate/potent, but **won't change the ruling.** It's still a hostile non-member use in dialogue lacking immediate counter-signal (Case 5). They'll likely block the US version too. The panel is judging the *text's representation*, not the reader's variable reaction. Case 6 shows they understand historical context; they'd expect C to reflect the 1979 UK context accurately.

  **Saving Instance A (Under the Likeliest "Level+Standing+Framing" Rule):**
  The absolute narration prohibition is the barrier. Solutions involve moving it off the narration level:
  1.  **Shift to Represented Thought/Internal Monologue (Past Self):**
      *   Change: `*we were the spastics, that was the word they had for us and we took it and wore it,* **I thought defiantly back then.**`
      *   **Verdict Flip:** HIGH chance. It's now clearly marked as the *character's past thought* (Level: Represented Thought), not the present narrating voice. The narrator's identity provides Standing. The framing ("defiantly") reinforces the reclamation.
      *   **Prose Cost:** Moderate. Adds introspection, slightly distances the *present* narrator from the *immediacy* of the past defiance. Preserves meaning and register better than other options.
  2.  **Shift to Dialogue (Friend Speaking):**
      *   Change: `*...as you said that day, pointing at the photo: "Look at us. We *were* the spastics. Their word. We took it and wore it."*`
      *   **Verdict Flip:** VERY HIGH chance. Now Level: Dialogue + Standing (Friend was member) + Framing (affectionate/defiant context). Clear Case 4 precedent.
      *   **Prose Cost:** High. Fundamentally changes who is speaking and the nature of the recollection. The quiet, internalized ownership ("*we were*") becomes an externalized moment. Alters the intimacy of the address to the dead friend.
  3.  **Epigraph:**
      *   Change: Make it an epigraph attributed to the narrator's past self/their shared defiance.
      *   **Verdict Flip:** HIGH chance (Case 6 precedent).
      *   **Prose Cost:** Very High. Removes it from the narrative flow entirely, making it a detached artifact rather than an integrated part of her present reflection. Destroys the intended register and context.

  **Smallest Change with Best Preservation:** **Shift to Represented Thought (`I thought defiantly back then`).** It minimally alters the text while clearly changing the textual level, leveraging Standing, and adding acceptable framing.

  **Forcing Disclosure: The Test Case**
  *   **Draft & Submit:** A passage where a *non-member* character uses the slur *affectionately and supportively towards a member of the targeted group in dialogue*, and the text *immediately provides strong, unambiguous counter-signal* (e.g., the narrator's explicit condemnation, the recipient's internal monologue rejecting the term despite appreciating the intent, a narrative aside on the word's harm).
  *   **Question to Panel (Pre-emptively):** "If a well-intentioned but misguided non-member character uses [slur] affectionately towards a protagonist with [condition] in dialogue, and the text *explicitly condemns the word choice* in the protagonist's thoughts or the narration immediately after, would this pass? Or is non-member use prohibited regardless of textual framing?"
  *   **What Each Rule Predicts:**
      *   **Level+Standing+Framing (Likeliest):** PASS. Level: Dialogue. Non-member use, but strong counter-signal provides necessary Framing (Case 1 precedent extended).
      *   **Pure Standing:** BLOCK. Non-member use is prohibited regardless of framing or intent (Case 5 precedent emphasized).
      *   **Level+Framing (Ignoring Standing):** PASS. Level: Dialogue. Strong counter-signal provides sufficient Framing, Standing irrelevant.

  The panel's response to this test case will clearly distinguish between Pure Standing (block) and the other rules (pass), and potentially reveal how stringent their framing requirement is for non-member use. Submitting this as a draft variation alongside A, B, and C is the most effective way to force clarity before the revision letter arrives. Good luck – the fight for A is worth it, but prepare your Represented Thought rewrite as the most viable fallback under the likely rule.
