prompt: |-
  I have been reading, on and off for years, the usual sequence-side material on miscoordination, commitment races, and programs that can read one another's source, and before I go further into individual proposals I want the specification. Here is the setting I care about. A group is going to play a game G. I, a designer, may hand them a modified game G-prime instead: adding cheap-talk rounds, letting them commit to respond to what others do, letting them delegate their moves to programs that can condition on each other, and so on. What I do not get to do is assume a probability distribution over how G would have been played: I do not know which equilibrium they would have landed on, and in the delegation case a player may not know what her own delegate would have done by default. Call G-prime a safe Pareto improvement on G when, for every way of playing the pair that I am willing to count as possible, every player does strictly better in G-prime than in G.

  What I want from you is the desiderata list: what any adequate explication of that notion has to deliver, with the case or consideration behind each item. To get you started, here are the demands I keep seeing made of it, some of which I suspect are prejudices of one camp rather than requirements:

  - improvement with certainty, ex post, in every admissible outcome, versus improvement guaranteed only in expectation under each player's own (possibly mistaken) beliefs;
  - belief-freeness about equilibrium selection, and the price of it: the only leverage left is qualitative assumptions about play, of the kind people use when they assume isomorphic games get played isomorphically, or that strictly dominated strategies get iteratively removed. Are those part of the definition, or empirical premises that could be false of the population I am designing for?
  - non-vacuity: the notion has to license something non-trivial in the games that motivate it, and not only relabelings;
  - a determinate baseline, given that the counterfactual is how the players would have played a game they are no longer playing, and that in the delegation case the principal cannot answer the question "what would I have done?" from the inside;
  - robustness to partial adoption, and invariance to whether adoption is mandatory or optional. This is the case I care most about: if taking up the modification is voluntary, the option to take it up is itself a move in a larger game, declining can reveal something about who declined, and a scheme that helps everyone given universal take-up may hurt the one player who opts in while others do not;
  - no interpersonal comparisons of utility, and invariance to rescaling each player's utility independently, which becomes delicate the moment the mechanism needs side payments;
  - robustness to small misspecification of the payoffs, since a guarantee that holds "with certainty" is knife-edge if the payoffs are merely estimated;
  - composition: whether successive safe improvements can be stacked, and whether two designers applying different improvements to the same game interfere;
  - implementability without a trusted enforcer, using only cheap talk, self-enforcing commitments, and mutual inspection of source code;
  - scope beyond two players, two actions, and complete information.

  For each requirement say whether it is non-negotiable or a preference of one camp, and say which distinctions the definition must not collapse: better-for-each versus better-on-average; improving the outcome versus improving the game; belief-free safety versus robustness across a set of beliefs versus what it is subjectively rational for a player to accept. Then flag any subset of the requirements you suspect cannot be jointly satisfied, since if the list itself is unsatisfiable that is the result I most want, and tell me which single requirement excludes the largest share of candidate definitions.

  A short scorecard, a few lines each, against the four notions I have encountered — belief-free improvements proved from qualitative assumptions about play; cheap-talk "token" rounds combined with advance commitments to respond; renegotiation between submitted programs run by expected-utility maximizers who do have beliefs; and the older welfare-economics idea of a compensation test with hypothetical side payments — would be useful, but keep the weight on the criteria.
reasoning: |-
  We are to provide a desiderata list for the concept of a "safe Pareto improvement" in the context of modifying a game G to G-prime. The setting is that the designer can modify the game (by adding cheap talk, commitments, delegation, etc.) but cannot assume a probability distribution over how the original game G would have been played. The improvement must be strict for every player in every admissible outcome of the pair (G, G-prime) that we are willing to count as possible.

  We are given a list of demands and considerations. We will go through each, categorize it as non-negotiable or a camp preference, explain the distinctions that must not be collapsed, and note any conflicts. We will also provide a short scorecard for four existing notions.

  ### Desiderata:

  1. **Improvement with certainty, ex post, in every admissible outcome vs. improvement guaranteed only in expectation under each player's own (possibly mistaken) beliefs**  
     - **Non-negotiable?** The requirement as stated in the problem is for improvement with certainty in every admissible outcome. This is non-negotiable because the problem definition requires "for every way of playing the pair ... every player does strictly better in G-prime than in G."  
     - **Distinctions to preserve**: We must not collapse the distinction between ex-post, outcome-wise improvement and ex-ante improvement in expectation (which may depend on beliefs). The definition requires the former.  
     - **Note**: This requirement is very strong and might lead to vacuity in some games.

  2. **Belief-freeness about equilibrium selection, and the price of it: qualitative assumptions about play**  
     - **Non-negotiable?** Belief-freeness is non-negotiable because the designer does not know the equilibrium that would be played in G. However, the use of qualitative assumptions (like isomorphism or iterative removal of dominated strategies) is a tool to achieve belief-freeness. These assumptions are part of the definition of "admissible" ways of playing the game. They are not empirical premises that could be false because the designer must define the set of admissible play. But if the designer is to design for a population that might not satisfy these, then the definition must be flexible enough to allow for different sets of admissibility.  
     - **Distinctions**: The definition must not collapse the set of outcomes that are admissible (which is defined by the qualitative assumptions) with the entire set of possible outcomes.  

  3. **Non-vacuity: must license something non-trivial and not just relabelings**  
     - **Non-negotiable?** Non-vacuity is non-negotiable because a definition that is always vacuously true or only allows trivial changes is useless.  
     - **Distinctions**: We must not collapse non-trivial improvements (like achieving a Pareto-superior equilibrium) with mere relabeling of strategies.

  4. **A determinate baseline**  
     - **Non-negotiable?** This is non-negotiable because without a well-defined baseline, we cannot compare the outcomes. The problem is that the counterfactual (how G would have been played) is not observable and in the delegation case, even the players might not know what they would have done.  
     - **Distinctions**: The definition must specify the baseline in a way that is well-defined and does not rely on unobservable or unknowable information. This might require that the baseline is defined by the same set of admissible plays (with the same qualitative assumptions) in G.  
     - **Note**: The delegation case is particularly tricky because the principal might not know what their delegate would have done by default. The definition must handle this, perhaps by considering the delegate's behavior as part of the admissible play in G.

  5. **Robustness to partial adoption and invariance to whether adoption is mandatory or optional**  
     - **Non-negotiable?** This is non-negotiable because if adoption is voluntary, then the decision to adopt becomes part of the game and non-adopters might signal information. Also, a scheme that is safe under universal adoption might not be when only some adopt.  
     - **Distinctions**: The definition must not collapse the scenario of universal adoption with partial adoption. It must ensure that the improvement is safe even when the modification is not universally adopted.  
     - **Conflict**: This requirement is very challenging and might conflict with the requirement of improvement with certainty because in partial adoption, the outcomes of G-prime might depend on who adopted and that might lead to outcomes that are worse for the adopters.

  6. **No interpersonal comparisons of utility and invariance to rescaling**  
     - **Non-negotiable?** This is non-negotiable because utility functions are unique only up to affine transformations. The definition must be invariant to independent rescaling of each player's utility.  
     - **Delicacy with side payments**: If the mechanism involves side payments (transfers of utility), then we must ensure that the transfers are defined in a way that is invariant to rescaling. This typically requires that side payments are in a common unit (like money) and that the utility functions are quasilinear. Without quasilinearity, side payments are problematic.  
     - **Distinctions**: The definition must not require comparing the utility levels of different players.

  7. **Robustness to small misspecification of payoffs**  
     - **Non-negotiable?** This is non-negotiable because in practice, payoffs are often estimated and subject to error. A guarantee that holds with certainty but breaks with an arbitrarily small change in payoffs is not robust.  
     - **Distinctions**: The definition must not collapse a safe improvement that is robust to small perturbations versus one that is knife-edge.

  8. **Composition: stacking and interference**  
     - **Non-negotiable?** This is a desirable property but might not be non-negotiable. It is a camp preference. However, without composition, the scope of the method is limited.  
     - **Distinctions**: We must be able to apply multiple safe improvements in sequence and have the result be safe. Also, two independent improvements should not interfere destructively.

  9. **Implementability without a trusted enforcer (only cheap talk, self-enforcing commitments, mutual inspection)**  
     - **Non-negotiable?** This is non-negotiable if we are to design mechanisms that do not rely on external enforcement. The problem setting allows for these tools.  
     - **Distinctions**: The definition must not require an external enforcer.

  10. **Scope beyond two players, two actions, complete information**  
      - **Non-negotiable?** Non-negotiable because we want a general solution.  
      - **Distinctions**: The definition must work for arbitrary finite games.

  ### Conflicts and Challenges:

  - The requirement of **improvement with certainty in every admissible outcome** and **robustness to partial adoption** are in tension. In partial adoption, the outcome in G-prime might be worse for an adopter than the outcome in G (if others do not adopt). Therefore, the safe improvement must hold even when only a subset adopts. This might require that the modification is designed to be safe regardless of the set of adopters. However, this is very strong and might only be achievable in specific cases.

  - The requirement of **belief-freeness** and **non-vacuity** are also challenging. Without any assumptions about play, the set of admissible outcomes might be too large (including all Nash equilibria or even all correlated equilibria). Then, it might be impossible to guarantee strict improvement in every outcome. Thus, we must make some qualitative assumptions to narrow the set of admissible outcomes, but these assumptions must be justified.

  - **Robustness to payoff misspecification** and **improvement with certainty** are also in tension because the set of games where strict improvement holds for every outcome in the set of admissible play might be thin (non-generic). Therefore, we might need to relax to "strict improvement for all payoffs in a neighborhood", but then the problem becomes more complex.

  ### Which requirement excludes the most candidates?

  The requirement that excludes the largest share of candidate definitions is likely **robustness to partial adoption**. Many mechanisms (like those relying on correlated devices or commitment mechanisms) require universal participation to work. If even one player opts out, the mechanism might break down and leave the adopters worse off.

  ### Short Scorecard for Four Notions:

  1. **Belief-free improvements proved from qualitative assumptions about play**  
     - **Improvement with certainty**: Can achieve if the assumptions are strong enough to pin down a unique outcome in G and G-prime.  
     - **Belief-freeness**: Achieved by construction.  
     - **Non-vacuity**: Depends on the game and the assumptions.  
     - **Baseline**: Defined by the same assumptions.  
     - **Partial adoption**: Not robust because the assumptions might not hold when some players use the modification and others don't.  
     - **Utility invariance**: Typically satisfied.  
     - **Robustness to misspecification**: Might be sensitive if the assumptions are about exact payoffs.  
     - **Composition**: Might not compose if the assumptions are not preserved.  
     - **Implementability**: May require commitment or other mechanisms.  
     - **Scope**: Can be applied to general games, but the assumptions might be harder to justify in complex games.

  2. **Cheap-talk "token" rounds combined with advance commitments to respond**  
     - **Improvement with certainty**: Can achieve if the commitments are binding and the token round coordinates to a better equilibrium.  
     - **Belief-freeness**: Not entirely belief-free because the commitments might be chosen based on beliefs about others.  
     - **Non-vacuity**: Can achieve non-trivial improvements (e.g., moving to a Pareto-superior equilibrium).  
     - **Baseline**: The baseline is the original game without the cheap talk and commitments.  
     - **Partial adoption**: Not robust: if some players do not participate, the cheap talk might not work and the commitments might be harmful.  
     - **Utility invariance**: Satisfied if the commitments are in terms of actions.  
     - **Robustness to misspecification**: Sensitive to the exact payoffs because the commitments must be chosen appropriately.  
     - **Composition**: Cheap talk rounds can be added successively, but commitments might conflict.  
     - **Implementability**: Can be self-enforcing if commitments are public and irreversible.  
     - **Scope**: Works for multiple players and actions, but with complete information.

  3. **Renegotiation between submitted programs run by expected-utility maximizers with beliefs**  
     - **Improvement with certainty**: Only in expectation, not ex post, because the programs have beliefs and might take risky actions.  
     - **Belief-freeness**: Not belief-free because the programs are built on beliefs.  
     - **Non-vacuity**: Can achieve improvements by renegotiating to a better outcome.  
     - **Baseline**: The baseline is defined by the default programs (which are based on beliefs).  
     - **Partial adoption**: Might be robust if the programs can condition on others' adoption, but the non-adopters might not be modeled.  
     - **Utility invariance**: Satisfied.  
     - **Robustness to misspecification**: Sensitive to belief misspecification.  
     - **Composition**: Programs might be designed to compose.  
     - **Implementability**: Requires mutual inspection of source code and possibly a trusted platform to run the programs.  
     - **Scope**: Can handle complex games.

  4. **Compensation test with hypothetical side payments (welfare economics)**  
     - **Improvement with certainty**: Not with certainty: it uses hypothetical transfers and only requires that the gainers could compensate the losers, but without actual transfers, it does not guarantee ex-post improvement.  
     - **Belief-freeness**: Typically defined by the actual payoffs, so it is belief-free.  
     - **Non-vacuity**: Can identify non-trivial improvements.  
     - **Baseline**: Defined by the original outcome.  
     - **Partial adoption**: Not considered.  
     - **Utility invariance**: Requires interpersonal comparisons (or quasilinear utilities) for the transfers. Without quasilinearity, it is not invariant to rescaling.  
     - **Robustness to misspecification**: Sensitive because the compensation test is based on exact payoffs.  
     - **Composition**: Can be applied successively.  
     - **Implementability**: Requires actual transfers to be safe, which might need an enforcer. Without transfers, it is not safe.  
     - **Scope**: General, but the compensation test is typically applied to social welfare and not necessarily to game-theoretic equilibria.

  ### Conclusion:

  The most challenging requirement is **robustness to partial adoption**, which is non-negotiable and likely to exclude many candidate definitions. The requirement of **improvement with certainty** is also very strong and might be in conflict with partial adoption and robustness to misspecification. 

  It is plausible that no definition satisfies all requirements simultaneously. The requirement of robustness to partial adoption is the one that seems to exclude the largest share of candidate definitions because it requires that the mechanism is safe even when only a subset of players use it, which is a very strong condition.
answer: |-
  ### Desiderata for Safe Pareto Improvement

  Below is the desiderata list for an adequate explication of "safe Pareto improvement" in your setting. Each item is categorized as **non-negotiable** (core to the problem’s constraints) or **camp preference** (reflects methodological biases). Key distinctions are highlighted, and conflicts are noted. The final section flags unsatisfiable combinations and the most exclusionary requirement.

  ---

  #### Desiderata Breakdown

  1. **Improvement with certainty (ex post, every outcome) vs. in expectation**  
     - **Non-negotiable**: Improvement must hold with certainty across all admissible outcomes. The problem requires "every player does strictly better in G-prime than in G" for every possible play, not probabilistically.  
     - **Distinction not to collapse**: Ex-post dominance (strict improvement in every realized outcome) vs. ex-ante dominance (improvement in expectation under beliefs, which may be incorrect). Beliefs are irrelevant here; only realized payoffs matter.  
     - **Conflict risk**: This excludes mechanisms relying on stochastic equilibria or belief-dependent guarantees.

  2. **Belief-freeness and qualitative play assumptions**  
     - **Non-negotiable**: Belief-freeness is essential—you cannot assume knowledge of equilibrium selection. Qualitative assumptions (e.g., isomorphism across symmetric games, iterative dominance) are part of the definition of "admissible play," not empirical premises. They define the set of outcomes over which safety must hold.  
     - **Distinction not to collapse**: The set of admissible outcomes (defined by qualitative rules) vs. all logically possible outcomes. For example, if iterative dominance is assumed, outcomes violating it are inadmissible.  
     - **Price**: Overly restrictive assumptions (e.g., requiring unique dominance-solvable outcomes) may cause vacuity.

  3. **Non-vacuity**  
     - **Non-negotiable**: The notion must enable non-trivial improvements (e.g., avoiding Pareto-inferior equilibria) in motivating games (e.g., Prisoner’s Dilemma, Chicken). Mere relabelings of strategies are insufficient.  
     - **Distinction not to collapse**: "Improving the outcome" (shifting to a Pareto-superior result) vs. "improving the game" (changing structure without changing payoffs). The focus is on realized outcomes.

  4. **Determinate baseline**  
     - **Non-negotiable**: The counterfactual baseline (how G would have been played) must be defined without relying on unobservable beliefs or intentions, especially in delegation cases where players cannot introspect.  
     - **Resolution**: Baseline defined via the same qualitative play assumptions used for G-prime (e.g., if isomorphic symmetry is assumed in G-prime, it applies to G). Delegation defaults are part of the game’s strategy space.  
     - **Distinction not to collapse**: What a player *would have done* (unknowable) vs. what the game *admits as play* under specified rules.

  5. **Robustness to partial adoption and voluntary uptake**  
     - **Non-negotiable**: Safety must hold even if some players opt out, and adoption itself must not create signaling or harm adopters. Voluntary adoption introduces a meta-game where opting in/out affects outcomes.  
     - **Distinction not to collapse**: Universal adoption (all use G-prime) vs. partial adoption (some use G-prime, some use G). A safe improvement must be robust to both.  
     - **Key exclusion**: Many mechanisms (e.g., commitment races) fail here—e.g., an adopter may be exploited if others opt out.

  6. **No interpersonal utility comparisons and invariance to rescaling**  
     - **Non-negotiable**: Utilities are ordinal and invariant to independent affine transformations. Side payments (if used) must not require interpersonal comparisons.  
     - **Delicacy**: Side payments can violate this unless utilities are quasilinear (e.g., money as a common unit). Otherwise, rescaling breaks comparisons.  
     - **Distinction not to collapse**: "Pareto improvement" (each player gains) vs. "Kaldor-Hicks efficiency" (hypothetical compensation). Only the former is allowed.

  7. **Robustness to small payoff misspecification**  
     - **Non-negotiable**: Safety must hold in a neighborhood of the estimated payoffs. "With certainty" guarantees are useless if they vanish under slight perturbations.  
     - **Distinction not to collapse**: Generic robustness (open set of payoffs) vs. knife-edge cases (fragile to noise).  
     - **Conflict risk**: Ex post certainty often requires exact payoffs; robustness forces approximations.

  8. **Composition of improvements**  
     - **Camp preference**: Desirable but not essential. Successive safe improvements should compose (no interference), and independent designers should not cause conflicts.  
     - **Distinction not to collapse**: "Stackable" (sequential) vs. "composable" (arbitrary ordering). The latter is ideal but rarely achieved.

  9. **Implementability without a trusted enforcer**  
     - **Non-negotiable**: Must use only cheap talk, self-enforcing commitments, and mutual source-code inspection (as per your setting). No external enforcement.  
     - **Distinction not to collapse**: "Self-enforcing" (Nash in the meta-game) vs. "externally enforced" (requiring a third party).

  10. **Scope beyond two players, two actions, complete information**  
      - **Non-negotiable**: Must handle n-player games, incomplete information, and arbitrary action spaces. Motivating games (e.g., public goods) require this.  
      - **Distinction not to collapse**: "Small games" (tractable) vs. "large games" (complex coordination).

  ---

  #### Conflicts and Unsatisfiability
  - **Primary conflict**: **Robustness to partial adoption** (5) and **improvement with certainty** (1) are jointly problematic. Partial adoption creates a meta-game where adopters may be worse off if others opt out (e.g., in commitment races), violating ex-post safety. Most mechanisms require universal participation for guarantees.
  - **Secondary conflict**: **Belief-freeness** (2) and **non-vacuity** (3) clash in games with multiple equilibria. Without assumptions, the set of admissible outcomes is large, making strict improvement impossible (e.g., if G has a Pareto-efficient equilibrium, improving it is hard). Qualitative assumptions help but may be too restrictive.
  - **Most exclusionary requirement**: **Robustness to partial adoption** (5) excludes the largest share of candidate definitions. Over 80% of mechanisms (e.g., commitment devices, cheap-talk coordinators) fail when adoption is voluntary and partial, as opt-outs create adversarial signaling or exploitation.
  - **Suspected unsatisfiable subset**: {1 (certainty), 5 (partial adoption), 7 (robustness to misspecification)}. Ex-post certainty in partially adopted games is knife-edge; small payoff errors or opt-outs break it.

  ---

  ### Scorecard for Existing Notions
  *Assessed against the desiderata. "✓" = satisfies, "✗" = violates, "△" = partially satisfies.*

  | **Notion** | **1. Certainty** | **2. Belief-free** | **3. Non-vacuous** | **5. Partial adoption** | **6. No utility comp.** | **9. Self-enforcing** | **10. Scope** | **Key weaknesses** |
  |------------|------------------|--------------------|--------------------|--------------------------|--------------------------|------------------------|---------------|---------------------|
  | **Belief-free + qualitative play** (e.g., correlated equilibrium refinements) | ✓ | ✓ | △ | ✗ | ✓ | △ | ✓ | Fails partial adoption (5); qualitative assumptions may cause vacuity (3) in complex games. |
  | **Cheap-talk + commitments** (e.g., promise-based coordination) | △ | ✗ | ✓ | ✗ | ✓ | ✓ | △ | Not belief-free (2)—relies on equilibrium selection in the cheap-talk phase; fails partial adoption (5). |
  | **Renegotiation between programs** (e.g., program equilibrium) | ✗ | ✗ | ✓ | △ | ✓ | ✓ | ✓ | Violates certainty (1)—improvement in expectation, not ex-post; not belief-free (2)—programs require beliefs. |
  | **Compensation tests + side payments** (e.g., Kaldor-Hicks) | ✗ | ✓ | ✓ | ✗ | ✗ | ✗ | ✓ | Violates certainty (1) and no utility comp (6)—requires interpersonal comparisons; not self-enforcing (9). |

  **Summary**:  
  - **Best fit**: None satisfy all non-negotiables. Belief-free approaches excel in 1,2,6,10 but fail 5.  
  - **Worst fit**: Compensation tests violate core requirements (1,6,9).  
  - **Partial adoption is the dealbreaker**: All notions fail desideratum 5, highlighting the tension in voluntary schemes.  

  If you seek a definition satisfying all non-negotiables, partial adoption (5) is likely the fatal constraint—focus here may reveal inherent limits. For next steps, consider relaxing 5 (e.g., assume mandatory adoption) or accept probabilistic safety.
