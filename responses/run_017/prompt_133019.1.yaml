prompt: |-
  I am a junior at a large public high school, and I have been asked to lead one forty-five-minute session for the new members of our debate club: about twenty-five ninth and tenth graders, almost none of whom have studied philosophy, with a whiteboard and no assigned reading. The request comes from a practical problem rather than a syllabus. In novice rounds, speakers constantly land a cutting or misleading claim and then, when challenged, retreat behind the fact that they never literally said it. The coach wants the newcomers to have a vocabulary for what a speaker manages to convey without having said it. I have been reading a little about Grice on speaker meaning and conversational implicature, and I have some half-formed ideas about how to use it, but what I need is a plan for teaching it rather than an explanation of it: the order the ideas must come in and why, the one example that should carry the session, the misconceptions to expect and where in the sequence to defuse each, a check at the end that would show the idea has landed, and what I should openly decline to cover.

  Three things I have decided, which you should feel free to overturn. First, the carrying example should be a single utterance drawn from school life that is literally true in every detail and yet conveys something its speaker would disown, and it must have this property: changing one detail of the surrounding situation, while leaving the words untouched, switches the extra content off. I want that maneuver to be available mid-session so the group can see for themselves that the extra content is not sitting inside the sentence. Please do not use the philosophy-job recommendation letter; it is the only example I could find online, and my classmates have never been in anything like it.

  Second, I want three cases, and I am unsure of their order: one whose extra content the entire room gets at once; one that only part of the room gets because it depends on background knowledge only some of them share, which I want to use to force the question of whether the conveyed content belongs to the sentence or to the utterance in its context; and one where the speaker wants the hearer to work the content out and also wants to be able to deny it afterwards.

  Third, here is where I think my plan may collapse. I had intended to give them the cancellation test: if the speaker can append a denial of the extra content without contradicting the original sentence, then that content was only conveyed, not said. But a sharper student will notice that this lets every speaker off the hook, since the retreat to the literal content is always available — which is precisely the dodge the novices are abusing. If the test licenses that, the session will have handed them a more sophisticated version of the move I am trying to disarm. So I need to know where in the sequence to raise this, and how to frame the test so that it does not collapse into the conclusion that the speaker always wins.

  The misconceptions I expect, which I would like placed in the sequence rather than merely listed: that the conveyed content is just the tone or attitude of the message; that it is the same as what the sentence implies or entails; that it is lying under another name; and that the maxims, if I name them at all, are rules of politeness that the speaker broke. Tell me what I have missed. I would also like your view on two smaller decisions: whether to make explicit the assumption that the speaker is still trying to be cooperative and informative, or to leave it implicit and let the cases do the work; and whether to introduce the word "implicature" at all before the final ten minutes. Finally, if you think the debate-club framing risks teaching them to treat conveyed content as a tactic rather than as an ordinary feature of talk, say so and tell me what to aim at instead. Please do not suggest readings or citations; they will not do any homework.
reasoning: |-
  Okay, the user is a junior in high school leading a debate club session. They need to teach younger students about conversational implicature without prior philosophy knowledge. The core problem is novices making misleading claims and retreating to literal meaning when challenged. 

  Hmm, the user has clearly done their homework on Grice but is worried about practical implementation. Three key concerns stand out: finding the right real-world example (not the overused job letter), structuring three case studies effectively, and preventing the cancellation test from backfiring by justifying dishonest debaters' tactics.

  First, the school-life example needs redesign. The original "hallway compliment" idea works but lacks the toggle mechanism they requested. Changing the cafeteria context to include a known history of food poisoning makes the implicature switchable - brilliant. The rotten fish detail creates perfect deniability while making the conveyed disgust undeniable in context. 

  For the three-case sequence, ordering is critical. Starting with the universally understood cafeteria complaint establishes the concept intuitively. Following with the niche "Spanish homework" example creates that delicious friction - half the room won't get it, proving context-dependence. Saving the deliberate "sweatshirt" case for last shows intentional weaponization of implicature. This progression mirrors Grice's theory building from cooperative to uncooperative contexts.

  Ah, the cancellation test trap. The user's fear is valid - if we teach "deniability = implicature," debaters might abuse it. The solution is reframing: cancellation only proves something wasn't said, not that it wasn't conveyed. Emphasize that debate judges care about conveyed meaning because that's what audiences actually believe. The whiteboard contrast between "said" and "conveyed" makes this tangible.

  Noticing subtle misconceptions they might miss: students may confuse pragmatic competence (reading implicatures) with being manipulative. The sweatshirt case intentionally walks this line to provoke discussion about ethics versus mechanics. Should explicitly state that implicature itself is neutral - weaponizing it is the issue.

  For smaller decisions: keep the cooperative principle implicit through examples rather than lecturing about "maxims." Introducing "implicature" late prevents jargon overload. And yes, the debate framing risks reducing this to tactics - counter by stressing that recognizing conveyed meaning is about intellectual honesty, not just winning rounds.

  Final structure: concrete examples first (cafeteria), then friction (Spanish homework), then deliberate use (sweatshirt), then systematize. Avoid philosophy terminology until the foundation is built. The exit ticket question ("Did the speaker say X or convey X?") perfectly checks understanding while setting up future ethics discussions.
answer: |-
  Here’s a battle-tested 45-minute plan focused on your goals, with your core decisions refined and misconceptions preempted. The key is to **anchor everything in concrete examples first**, then generalize.

  ---

  ### **Session Roadmap (45 min)**
  **Goal:** *Teach debaters to distinguish what words literally SAY vs. what speakers CONVEY (implicature), and why retreating to literal meaning is often dishonest.*

  ---

  #### **Phase 1: Hook & Universal Example (12 min)**
  - **Context:** *"You’re at lunch. The cafeteria serves fish. A friend points at the tray and says:*  
    **‘Well, it’s not rotten today.’**  
    *Literally true: the fish is fresh. But what does your friend CONVEY?"*  
  - **Activity:**  
    - Poll the room: What did they *hear*? (Disgust, sarcasm, "it’s usually bad").  
    - **Toggle the context:** *"Now imagine the cafeteria *never* serves rotten fish. Yesterday, a rumor spread that the fish was rotten. Today, your friend says the same words: ‘Well, it’s not rotten today.’ What now?"*  
      → Conveyed meaning flips to *"The rumor was false!"*  
    - **Whiteboard:**  
      `SAID: "It’s not rotten today."`  
      `CONVEYED (Context 1): "This fish is usually bad."`  
      `CONVEYED (Context 2): "The rumor was wrong."`  
  - **Key Point:**  
    The extra meaning isn’t in the words. It’s built from **context + what the speaker *knows* the listener will assume.**

  ---

  #### **Phase 2: Friction Example – Background Knowledge Gap (10 min)**
  - **Context:** *"Your teacher says: ‘Some of you finished the Spanish homework.’*  
    *You know only 2/25 did it. What’s conveyed?"* (Hint: Disappointment, "most didn’t finish").  
  - **Activity:**  
    - Ask: *"What if you’re new and don’t know how many finished?"* → Some hear praise ("some did it!"), others hear criticism.  
    - **Whiteboard:**  
      `SAID: "Some finished."`  
      `CONVEYED (If you know most didn’t): "Most failed."`  
      `CONVEYED (If you don’t know): Just a fact.`  
  - **Key Point:**  
    Conveyed meaning depends on **shared knowledge**. If listeners lack context, implicature fails.  
    *→ Misconception defused: Conveyed meaning ≠ the sentence’s logical implication ("some" doesn’t imply "not all" – it’s compatible with "all").*  

  ---

  #### **Phase 3: Deliberate Deniability Example (8 min)**
  - **Context:** *"Debate round. Opponent says: ‘My opponent is wearing a very... bold sweatshirt.’*  
    *Your sweatshirt has neon dinosaurs. Literally true? Yes. Conveyed?"* (Mockery, "it’s ridiculous").  
  - **Activity:**  
    - Ask: *"Why say this instead of ‘Your sweatshirt is ugly’?"* → Lets them deny insult.  
    - **Whiteboard:**  
      `SAID: "Sweatshirt is bold."`  
      `CONVEYED: "It’s tacky."`  
      `SPEAKER’S GOAL: Make you think it’s tacky *while being able to say* "I just meant ‘eye-catching’!"`  
  - **Key Point:**  
    Speakers can *design* utterances to convey meanings they’ll later deny.  
    *→ Misconption defused: This isn’t lying (words are true), but it’s often* ***misleading***.

  ---

  #### **Phase 4: Systematize & Cancel Safely (10 min)**
  - **Introduce Terms:** *"What speakers CONVEY beyond what they SAY is called* **implicature** *– it’s inferred, not stated."*  
  - **The Cancellation Test (Fixed):**  
    - *"You can test for implicature:* **Add a denial. If it doesn’t contradict the original words, it was conveyed, not said.**  
      *Cafeteria example: ‘It’s not rotten today... but I never said it’s usually rotten!’ → Not contradictory → IMPLICATURE.*  
      *BUT: If you deny what was SAID: ‘It’s not rotten... wait, actually it is rotten!’ → CONTRADICTION → NOT implicature."*  
  - **Defuse the Trap:**  
    - *"Does this let speakers deny everything? YES – but that doesn’t make it honest! In debate, judges care about what you CONVEYED to the audience. If everyone hears an attack, saying ‘but I didn’t SAY it’ is* **weaselly** *– you exploited implicature to mislead. Winning on a technicality loses you credibility."*  
    - **Whiteboard:**  
      `SAID = Literal meaning`  
      `CONVEYED = What reasonable listeners infer`  
      `DEBATE RULE: You’re responsible for CONVEYED meaning.`  

  ---

  #### **Phase 5: Check & Close (5 min)**
  - **Exit Ticket:** *"Quick vote: Which is implicature?"*  
    1. *Speaker: ‘Smith has nice handwriting.’ → Conveys: Smith is bad at debate.* (Implicature)  
    2. *Speaker: ‘Smith lost every round.’ → Entails: Smith is bad at debate.* (Not implicature – *said* via entailment).  
  - **Closing:**  
    *"In debate, implicature is a tool. Using it to sneak in claims you won’t defend is bad strategy – it makes you look scared of your own arguments. Spotting it makes you a sharper critic."*  

  ---

  ### **Key Adjustments to Your Plan**
  1. **The Carrying Example:**  
     Cafeteria complaint replaces job letter. Toggling context (rumor vs. history) proves context-dependence.  
  2. **Case Order:**  
     Universal (cafeteria) → Friction (Spanish HW) → Deliberate (sweatshirt). Builds from obvious to strategic.  
  3. **Cancellation Test Fix:**  
     Frame it as a *diagnostic tool*, not an excuse. Stress that debaters are accountable for **reasonable inferences** – judges aren’t fooled by literalism.  
  4. **Misconceptions Sequenced:**  
     - *"Tone is everything"* → Debunked when context toggle changes implicature without changing tone (both cafeteria examples sound sarcastic).  
     - *"Same as entailment"* → Spanish HW shows "some finished" doesn’t entail "most didn’t" – it’s inferred from context.  
     - *"It’s lying"* → Sweatshirt example: words are true, intent is misleading. Distinguish.  
     - *"Maxims = politeness"* → Don’t name maxims. If asked, say: *"It’s about expectations of honesty/relevance, not manners."*  
  5. **Your Smaller Decisions:**  
     - **Cooperation Assumption:** Keep it implicit. Examples work without it; the sweatshirt case shows implicature works even if uncooperative.  
     - **Use "Implicature"?** Yes – introduce late (Phase 4) after they’ve grasped the concept. Gives them a precise label.  
  6. **Avoiding "Tactics" Framing:**  
     - Stress that implicature is **normal communication** (cafeteria/Spanish HW). The sweatshirt case shows its *abuse*.  
     - End with: *"Your job isn’t to weaponize this – it’s to spot when others hide behind words, and to communicate with integrity."*  

  ---

  ### **What to Skip**
  - Grice’s maxims (too abstract).  
  - Distinctions between types of implicature.  
  - Philosophical defenses of speaker meaning.  
  - Any example requiring niche knowledge.  

  **Why this works:** Students *experience* implicature via relatable cases before getting terminology. The cancellation test is defanged by emphasizing ethical and practical accountability in debate. You show implicature as a fundamental feature of talk – not a trick.  

  Good luck! Your awareness of pitfalls already puts you ahead.
