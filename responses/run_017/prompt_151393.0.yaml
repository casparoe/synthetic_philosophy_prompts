  Perhaps we can use human feedback. But that would be learning the value function, which is what we are trying to avoid.

  Alternatively, we might use a predefined notion of what constitutes a "side effect" by using a model of the world that identifies objects and their persistence. For example, we might define that moving objects is a side effect unless necessary. But then we must define which objects and what counts as necessary. This is a form of value judgment.

  The user might also reject step (1). Step (1) says that if we had a full value specification, we wouldn't need the penalty. But that is true. However, we don't have a full value specification, so we need a constraint. The question is whether we can define that constraint without value judgments.

  But the argument concludes that we cannot.

  The user might reject the claim in (5) that the only non-arbitrary counterfactual is inaction. Why is that the only non-arbitrary one? Because any other counterfactual (like a careful agent) requires defining what careful means, which is a value judgment. Inaction is defined by the agent's own behavior: it is the absence of action. But note: inaction is still a choice. We are comparing to the agent doing nothing. But the agent was asked to fetch the mug, so inaction is not what we want. However, it is a well-defined baseline.

  But the problems with inaction are severe: it freezes the world and penalizes even good changes.

  So what can the user do?

  I think the flaw might be in the interpretation of independence in step (1). The user wants to keep independence and the conviction that freezing is bad. But the argument shows that without value judgments, we end up with penalties that either require value judgments or lead to freezing.

  So perhaps the user has to give up the idea that we can have a side-effect penalty without any value judgments. That is, we might need some minimal value judgments.

