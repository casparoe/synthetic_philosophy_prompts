  The substitution baseline does not directly use a set of reference goals to preserve ability, nor does it use a single counterfactual. Instead, it looks at the variance of the agent's behavior with respect to the goal. The idea is that an agent that has a large effect on the world will behave very differently for different goals, whereas an agent that minimizes side effects will behave similarly regardless of the goal (only doing what is necessary).

