  - The problem of not distinguishing between good and bad changes: the penalty would count any change as bad, but we want to allow the robot to achieve its goal. So we might subtract the intended effect. But then we are back to needing a value function to define the intended effect.

  - The problem of reversibility: we might require that the penalty only counts irreversible changes. But step (6) says that this allows anything reversible, however reckless. And irreversibility is hard to define (is a broken vase irreversible if it can be glued?).

  So the fixes might not work without reintroducing value judgments.

  But note: the user might argue that the inaction baseline is not the only possible counterfactual. Step (5) says the only non-arbitrary one is inaction. Why? Because if we choose a different counterfactual (like a careful agent), then we are making a value judgment about what counts as careful. Step (6) addresses this: it says that using a careful agent baseline is just smuggling in a value judgment.

  So the core issue is that without a value function, we cannot define what a side effect is because we cannot distinguish between relevant and irrelevant changes, or between good and bad ones.

  Therefore, the argument seems strong.

  But the user feels that the substitution baseline in (7) might work. Let me try to defend it:

  Suppose we define the penalty as the variance of the state (or some feature of the state) with respect to the goal, under a uniform distribution over a very broad set of goals. The idea is that the agent should minimize the extent to which its actions depend on the specific goal. However, this might lead to an agent that does nothing at all, because that is the only way to have zero variance. But we want the agent to achieve its goal. So we would have to combine the penalty with the goal achievement. That is, we want the agent to achieve the goal while minimizing the side effects (as measured by the variance).

  But then we are back to having a trade-off between goal achievement and side effects. And the side effect measure is still based on the choice of the set of goals. Moreover, the variance might be high even for necessary actions if the set of goals is too broad. For example, if we include goals that require the vase to be broken, then the agent might break the vase for those goals and not for others, leading to high variance. But we don't want the agent to break the vase even for those goals? Then we are excluding those goals, which is a value judgment.

  Alternatively, we might use the set of goals that are "reasonable" or "typical". But that is a value judgment.

  So I think the friend is correct that the substitution baseline requires a distribution over goals, and that distribution reflects what we consider possible or important, which is a value judgment.

  Therefore, step (7) does collapse to (4).

  Now, what about step (3)? Is it really exhaustive?

  Let me try to think of a third option:

  - We might define the penalty based on the agent's causal influence. That is, we measure how much the agent's action changes the state compared to what would have happened without that action (which is the inaction baseline). But that's [ii].

  - Or we might measure the agent's ability to achieve arbitrary goals, but that is [i] with the set of all goals. But then we are tracking the agent's general ability, which might be reduced by breaking the vase. However, breaking the vase might not reduce the agent's ability to achieve all goals (it might help some, like cleaning the shelf). And we still have the problem that we are valuing the preservation of ability to achieve any goal, which is a value judgment (why is that good?).

  In fact, preserving the ability to achieve any goal is equivalent to preserving the current state (or the current set of possible futures) because if the agent can still achieve any goal, then the world must be unchanged? Not exactly: if the agent breaks the vase, it can still achieve goals that don't require the vase, but it loses the ability to achieve goals that require an unbroken vase. So to preserve all abilities, the agent must not change anything. But that is the freezing behavior we want to avoid.

  So [i] with the set of all goals would lead to freezing, which is bad.

  Hence, we must choose a subset of goals to preserve, which is a value judgment.

  So the dichotomy seems exhaustive.

  But the user might reject step (2). Step (2) says that we can only use (a) dynamics, (b) the agent's trajectory, and (c) the agent's remaining ability to bring about states. Why can't we use more?

