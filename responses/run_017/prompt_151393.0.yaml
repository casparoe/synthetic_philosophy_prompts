  However, the user might argue that this is acceptable because it is a minimal and manageable specification. But the friend's argument is that it is still a value judgment, violating independence.

  But if we relax independence to allow some minimal value judgments, then we can have a side-effect penalty. The cost is that we are not postponing the value specification entirely; we are specifying some constraints.

  The user's friend might say that this is giving up the original goal of avoiding value specification. But in practice, we might be able to specify a small set of invariants (like don't break objects) without specifying a full utility function.

