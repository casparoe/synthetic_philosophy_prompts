  Alternatively, we might use a measure of the agent's intervention in the environment, such as the amount of force applied or energy expended. But that might not correlate with side effects: moving a vase carefully might use less energy than breaking it, but we don't want to break it at all.

  Thus, it seems hard to find an alternative to the two options.

  But let's look at step (5). The argument against the counterfactual baseline (inaction) is that it leads to undesirable consequences: it freezes the world and penalizes even good changes. However, the user notes that these might be bugs that can be fixed. For example:

