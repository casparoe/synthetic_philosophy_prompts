  Moreover, the penalty would be based on how much the agent's behavior varies with the goal. But note: the agent is optimizing a given goal. We are comparing the behavior for goal G1 with the behavior for goal G2. The penalty would be high if the agent takes very different actions for G1 and G2. But we want the agent to take different actions when the goals are different! For example, if the goal is to fetch a mug vs. to clean the shelf, we expect different behavior. So the substitution baseline might penalize an agent that is actually achieving its goals effectively.

