prompt: |-
  Design a case in which a piece of already-known evidence supports a new theory through theory structure rather than through likelihood, and show that it does.

  Constraints on the case. Set it in an ordinary empirical investigation — an epidemiological inquiry or a reliability-engineering failure analysis, say — with agents no more capable than careful working scientists: no logically omniscient Bayesian, no demon, no prior supplied by fiat. The evidence E must be a statistical regularity already known and effectively certain before the new theory T is proposed. T must be genuinely novel in the demanding sense that its central quantities were not expressible in the old theoretical language, so that its prior cannot be inherited from anything already on the books. T must have no confirmed novel predictions: old evidence is all the empirical support it has. Its live rival must be a package of the standing theory R together with an auxiliary A, where A was introduced for reasons independent of E but does in fact accommodate E — arranged so that the likelihood of E comes out roughly equal under T and under R∧A, as a consequence of A's independent motivation rather than by stipulation. And the T-to-E connection must be probabilistic, so that deductive bootstrapping cannot get started: no instance of T is deducible from T together with E alone.

  What I want back. First the scenario, in one paragraph. Then the check, derived rather than asserted: why ordinary conditionalization at the moment T appears gives T no boost; why the hypothetical-prior fix — re-running the update on a prior from which E has been deleted, the move associated with Garber — also gives no boost, given the tied likelihoods; why Glymour-style bootstrapping is unavailable here. Then the hard part: the episode must be one in which the scientist who cites E as a reason to prefer T over R∧A is not merely confused. Locate where the support actually lives — in a prior over theoretical packages that charges R∧A for its extra machinery, in a unificationist or explanationist relation between T and E that is not a likelihood relation, or somewhere else — and derive the verdict from the account you choose rather than stipulating it. Close with the diagnosis: which feature of the case does the work, what happens if that feature is removed (if T needs an auxiliary of its own, or if A is dropped and R alone faces T, where the marginal likelihood of E under R is lower), and how the defender of the account that comes out worst — the strict conditionalizer, or the likelihoodist who denies that parsimony and unification are evidentially relevant — would attack the case. The point of the case is to settle whether the problem of old evidence is really about how old evidence bears on a theory's likelihood, or about how theories get assessed structurally when no new prediction is in the offing; a case that simply stipulates that E confirms T, or that hides the work inside an unexplained prior, does not settle it.
reasoning: |-
  We are to design a case in which old evidence E supports a new theory T through theory structure rather than likelihood. The constraints are:

  1. Ordinary empirical investigation (e.g., epidemiology or reliability engineering).
  2. Evidence E is a statistical regularity, already known and effectively certain before T is proposed.
  3. T is genuinely novel: its central quantities were not expressible in the old theoretical language, so its prior cannot be inherited.
  4. T has no confirmed novel predictions; old evidence is all the empirical support it has.
  5. The live rival is R∧A, where R is the standing theory and A is an auxiliary introduced for independent reasons and accommodates E. The likelihood of E is roughly equal under T and under R∧A.
  6. The T-to-E connection is probabilistic (not deductive).

  We must show why:
  - Conditionalization when T appears gives no boost to T (because E is already certain).
  - The hypothetical-prior fix (Garber) also gives no boost (because the likelihoods are tied).
  - Glymour-style bootstrapping is unavailable (because the connection is probabilistic, not deductive).

  Then, we must locate where the support actually lives (e.g., in a prior that penalizes R∧A for extra machinery, or in unification/explanation) and derive the verdict from that account.

  Finally, diagnose which feature does the work and how a strict conditionalizer or likelihoodist would attack.

  Let me design a case in epidemiology.

  **Scenario:**

  In the 1970s, epidemiologists study the rising incidence of a rare cancer, mesothelioma, in workers at shipyards and construction sites. It is an established fact (E) that the disease is strongly associated with occupational exposure to asbestos. The standing theory (R) is that asbestos causes mesothelioma by a direct mechanism: asbestos fibers puncture cell membranes and cause inflammation leading to cancer. However, a puzzling statistical regularity (E) is observed: the risk of mesothelioma does not increase linearly with the amount of asbestos exposure but instead shows a threshold effect: below a certain exposure level, the risk is near zero, and above that level, it rises sharply. This threshold effect is well-established and known to all.

  A new theory (T) is proposed by a scientist: mesothelioma is caused by a virus (which we now call the "mesothelioma virus") that is carried by asbestos fibers. The virus, not the fiber itself, is the direct cause. The threshold effect arises because a minimum dose of virus is needed to establish infection. The old theory R had no way to express the idea of a virus (so T is novel). T has no novel predictions yet (no new evidence beyond E).

  Meanwhile, defenders of the standing theory R propose an auxiliary hypothesis (A): that asbestos fibers must accumulate to a certain critical mass in the lungs to trigger an inflammatory cascade that leads to cancer, and this critical mass explains the threshold. A was actually introduced for independent reasons: to explain why other diseases (like asbestosis) also show threshold effects. Thus, A is independently motivated and accommodates E.

  The likelihood of E (the threshold effect) is about the same under T and under R∧A. But the scientist proposing T argues that T is simpler and more unified because it explains the threshold effect in the same way as infectious diseases (via a minimum infectious dose) and thus unifies mesothelioma with infectious diseases, whereas R∧A must treat the threshold for mesothelioma as a separate mechanism from the threshold in asbestosis (which they already explained by critical mass) and from infectious diseases.

  **Check:**

  1. **Ordinary conditionalization at the moment T appears:** At the time T is proposed, E (the threshold effect) is already known and has probability 1. Therefore, conditionalizing on E does not change the probability of T: P(T|E) = P(T) [if we condition on E, which is already in the background]. So no boost.

  2. **Hypothetical prior fix (Garber):** We consider a prior from which E has been deleted. In that hypothetical prior, let P_hyp be the probability. Then we compute P_hyp(T|E) and P_hyp(R∧A|E). But because the likelihoods are tied: P_hyp(E|T) ≈ P_hyp(E|R∧A), then by Bayes' theorem, the ratio of posteriors equals the ratio of priors: P_hyp(T|E)/P_hyp(R∧A|E) = [P_hyp(T)/P_hyp(R∧A)] * [P_hyp(E|T)/P_hyp(E|R∧A)] ≈ P_hyp(T)/P_hyp(R∧A). So the evidence E does not differentially support T over R∧A in the hypothetical prior. Therefore, no boost.

  3. **Glymour-style bootstrapping:** Bootstrapping would require that from T and E we can derive something that confirms T. But the connection from T to E is probabilistic: T does not deductively entail E. It only makes E probable. Therefore, bootstrapping is unavailable.

  **The Hard Part: Where does the support live?**

  The support for T over R∧A comes from the structural virtues of T: it is more parsimonious and unificatory. Specifically, the prior probability of T is higher than that of R∧A because R∧A postulates an additional mechanism (the critical mass for mesothelioma) that is distinct from the mechanism for asbestosis (which also had a critical mass) and from infectious disease thresholds. T, by contrast, uses the same mechanism (minimum infectious dose) that is already known in virology. Thus, T unifies the threshold effect in mesothelioma with the threshold effects in infectious diseases, whereas R∧A must treat the mesothelioma threshold as an additional, separate mechanism.

  We can model this by having a prior that penalizes theories for extra auxiliary hypotheses and rewards unification. Let the prior probability be determined by a simplicity/unification measure.

  For example, let:

  - Prior of T: P(T) = k * exp(-c * complexity(T))
  - Prior of R∧A: P(R∧A) = k * exp(-c * complexity(R∧A))

  We set complexity(R∧A) > complexity(T) because R∧A has an extra auxiliary (A) that is not needed in T, and A is an additional mechanism that is not unified with other known mechanisms. Meanwhile, T invokes a known kind of mechanism (infectious dose) already established in other domains.

  Thus, even though the likelihoods are tied, the prior ratio P(T)/P(R∧A) is greater than 1, so the posterior ratio (in the hypothetical prior) is also greater than 1.

  But note: in the actual Bayesian update (with E already known) we cannot directly use this because E is old. However, in the context of theory choice, we are comparing T and R∧A. The scientist argues that T should be preferred because it is simpler and more unified. The evidential support from E for T is mediated by the fact that T explains E in a way that is structurally superior.

  **Derivation:**

  We consider the hypothetical prior (without E). Let:

  P_hyp(T) = α
  P_hyp(R∧A) = β

  With α > β because T is simpler.

  Then:

  P_hyp(T|E) = [P_hyp(E|T) * α] / P_hyp(E)
  P_hyp(R∧A|E) = [P_hyp(E|R∧A) * β] / P_hyp(E)

  Since P_hyp(E|T) ≈ P_hyp(E|R∧A) = L (say), then:

  P_hyp(T|E) / P_hyp(R∧A|E) = (α * L) / (β * L) = α/β > 1

  Thus, in the hypothetical prior, E does not change the ratio (because likelihoods are tied) but the ratio is already in favor of T because of the prior. Therefore, the scientist can say that E supports T over R∧A because T explains E just as well but with a simpler structure.

  However, note that without E, the prior of T might have been low because it introduces a new virus. But in our setup, the prior we are considering in the hypothetical prior is already one that takes into account the theoretical virtues. We are assuming that the simplicity and unification of T give it a higher prior than R∧A.

  **Diagnosis:**

  The feature that does the work is the structural superiority of T in terms of parsimony and unification. Specifically:

  - T does not require an auxiliary hypothesis to explain E, while R does (A).
  - Moreover, T unifies the explanation of E with a broader class of phenomena (infectious diseases) whereas R∧A treats E as a separate mechanism.

  If we remove this feature:

  - If T requires an auxiliary of its own, say A_T, to account for E, then the prior of T∧A_T might be similar to that of R∧A, and the support would vanish.
  - If we drop A and let R alone face T, then the marginal likelihood of E under R alone might be low (because without A, R does not predict the threshold). Then the likelihood under T would be higher than under R, and E would support T over R by likelihood. But that is not our case because we have A independently motivated and accommodating E.

  A strict conditionalizer (or likelihoodist) would attack the case by denying that the prior should reflect these structural virtues. They might argue:

  - The prior should only reflect previous empirical evidence, and since T is a new theory (with no previous empirical support), its prior must be low.
  - The unification and simplicity are pragmatic virtues, not epistemic. They help us use the theory but do not make it more likely to be true.
  - The fact that T unifies with infectious diseases is not relevant because there is no evidence that mesothelioma is infectious (it doesn't spread between people). Thus, the prior for T might actually be lower than R∧A because R is well-established and A is independently motivated.

  In response, the defender of structural virtues would argue that simplicity and unification are guides to truth in the history of science and that without them, we would have no way to choose between empirically equivalent theories.

  The point of the case is to show that the problem of old evidence is not just about likelihoods but about how we assign priors based on theoretical structure. In this case, the old evidence E supports T because T explains E in a structurally better way, even though the likelihoods are tied.

  Thus, we settle that the problem of old evidence is about how theories get assessed structurally when no new prediction is available.
answer: |-
  ### Scenario
  In an epidemiological investigation of chronic kidney disease (CKD) among agricultural workers in a specific region, a well-established statistical regularity (E) has been known for years: the incidence of CKD is strongly correlated with prolonged exposure to a common pesticide, "AgroX," but only among workers with a particular genetic variant (V), which is present in about 20% of the population. The standing theory (R) posits that AgroX causes CKD through direct nephrotoxicity. However, E is puzzling under R alone, as R predicts a linear dose-response relationship, whereas E shows a sharp threshold effect—workers without variant V show no increased risk even at high exposures. A new theory (T) is proposed: CKD is caused not by AgroX itself, but by a previously unknown metabolite "ToxiM" produced only in individuals with variant V due to a genetic quirk in liver metabolism. ToxiM is the direct nephrotoxic agent, and the threshold arises because ToxiM production requires saturating levels of an enzyme induced by high AgroX exposure. T introduces ToxiM as a novel entity, irreducible to R's framework. T has no novel predictions yet. Meanwhile, defenders of R adopt an auxiliary hypothesis (A): AgroX's metabolite "SafeX" (known from unrelated studies on liver toxicity) competitively inhibits kidney damage until a threshold exposure overwhelms this protection, explaining E. A was independently motivated by SafeX's role in liver studies and accommodates E. The likelihood of E is tied: P(E|T) ≈ P(E|R∧A) ≈ 0.8 (as both explain the threshold probabilistically), and T's link to E is probabilistic—variant V doesn't guarantee ToxiM production, and SafeX inhibition isn't foolproof. Scientists cite E as support for T over R∧A due to T's simplicity and unification.

  ### Check: Why Standard Bayesian Moves Fail
  - **Ordinary conditionalization when T appears**: At T's proposal, E is already known and has probability 1 (effectively certain). Thus, conditionalizing on E yields no update: P(T|E) = P(T) and P(R∧A|E) = P(R∧A). E cannot boost T.
  - **Hypothetical-prior fix (à la Garber)**: Consider a hypothetical prior Pₕ where E is not certain. Since Pₕ(E|T) ≈ Pₕ(E|R∧A) (both ≈0.8), Bayes' theorem gives Pₕ(T|E)/Pₕ(R∧A|E) = [Pₕ(T)/Pₕ(R∧A)] × [Pₕ(E|T)/Pₕ(E|R∧A)] ≈ Pₕ(T)/Pₕ(R∧A). The likelihood ratio is ~1, so E does not alter the odds between T and R∧A. T gains no advantage.
  - **Glymour-style bootstrapping**: Bootstrapping requires deducing an instance of T from T and E, but T-to-E is probabilistic: T entails only that ToxiM production (probabilistically linked to V and exposure) raises CKD risk, not that E (the observed threshold) must occur. No deductive link exists to bootstrap.

  ### Where the Support Lives: Structural Prior and Unification
  The support for T over R∧A stems from a **prior over theoretical packages that penalizes ad hoc auxiliaries and rewards unification**, derived from theoretical virtues, not likelihoods. Here’s the derivation:

  - **Structural prior based on parsimony and unification**: Assign priors via a simplicity measure: P(theory) ∝ exp(-k × complexity), where complexity increases with (a) number of ad hoc auxiliaries and (b) disunified mechanisms. R∧A has high complexity: A (SafeX inhibition) is an auxiliary added purely to rescue R from E, and it introduces a disunified mechanism—SafeX’s protective role in CKD is unrelated to its known liver effects, creating two isolated mechanisms (liver vs. kidney) for the same entity. T has low complexity: it explains E without auxiliaries by unifying the threshold with general metabolic pathways (ToxiM production resembles known enzyme saturation kinetics) and integrates variant V directly into the causal story, leveraging established biology. Thus, prior odds favor T: P(T)/P(R∧A) = exp(-k × comp(T)) / exp(-k × comp(R∧A)) = exp(k × (comp(R∧A) - comp(T))) > 1, since comp(R∧A) > comp(T).  
  - **Bayesian update in hypothetical prior**: As Pₕ(E|T) ≈ Pₕ(E|R∧A), the posterior odds Pₕ(T|E)/Pₕ(R∧A|E) ≈ Pₕ(T)/Pₕ(R∧A) > 1. E does not change the odds, but the prior odds (due to structural virtues) already favor T. Thus, E "supports" T only in the sense that T explains E with a structurally superior package, making T the better choice given E.  
  - **Role of unification**: T unifies E with core metabolic principles (enzyme saturation), while R∧A treats the CKD threshold as an isolated add-on to SafeX’s unrelated liver role. This unification is not a likelihood feature (both fit E equally well) but a structural relation that elevates T’s prior.

  ### Diagnosis: The Crucial Feature and Counterarguments
  - **Feature doing the work**: The complexity penalty for R∧A’s ad hoc, disunified auxiliary A. A was independently motivated (by liver studies) but is disunified in application—it does not cohere with R’s core or other SafeX roles. T avoids this by embedding E directly into a unified mechanism.  
  - **If feature is removed**:  
    - **T requires its own auxiliary (e.g., A_T)**: Suppose T needs an auxiliary to explain why ToxiM isn’t always produced at threshold. Then comp(T) ≈ comp(R∧A), prior odds ≈1, and E provides no support.  
    - **A is dropped, R alone faces T**: Without A, R has low likelihood for E (P(E|R) ≈ 0.1, as R predicts linear dose-response). Then P(E|T) > P(E|R), so E boosts T via likelihood—but this violates the tied-likelihood constraint.  
  - **Attack by strict conditionalizer/likelihoodist**: They reject structural virtues as evidentially relevant. Argue that priors must stem only from empirical data, not "subjective" simplicity. Since T is novel and unevidenced, P(T) should be near zero, and A’s independent motivation (from liver studies) gives R∧A a higher prior. Unification is pragmatic, not truth-conducive—e.g., SafeX’s role in liver and kidney could be coincidental, not unificatory. Thus, citing E for T is circular: the "support" is smuggled into an unjustified prior.  

  This case shows the problem of old evidence is about **structural theory assessment when new predictions are absent**. E supports T not through likelihood (which is tied) but because T explains E with less ad hoc machinery and more unification, reflected in the prior. The likelihoodist attack exposes a rift: if structural virtues are epistemic, they resolve old evidence; if not, E cannot support T here. The case settles that old evidence can be evidentially relevant via structure alone.
