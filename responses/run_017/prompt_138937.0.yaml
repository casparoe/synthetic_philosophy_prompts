    "most_sensitive_term": "mechanism_separable",
    "most_decisive_evidence": "Experimental studies (e.g., Reddit-style crisis simulations) showing mechanism-swaps shift expectations >2x more than case-swaps would raise credence to 0.85; evidence that mechanism-talk is epiphenomenal to coalition-building would lower it to 0.4.",
    "disagreement_locus": "legitimation_primary (you see precedents as predictive tools; your friend sees them as rhetorical tools, making case-selection the distortion point).",
    "weakest_step": "Assuming mechanisms and cases can be varied independently for scoring—in practice, 'Munich' implies appeasement-mechanism inherently, making your test collapse."
