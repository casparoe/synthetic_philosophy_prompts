  ### Explanation of Key Terms:
  - **mechanism_separable (necessary)**: Low probability (0.4) because real-world deliberations (e.g., EXCOMM during Cuban Missile Crisis) show leaders jump from analogy to policy prescription without explicit mechanism debate. If mechanisms aren't separable, P fails by definition.
  - **mechanism_predictive_dominance (contributing)**: High (0.8) as mechanisms (e.g., "sunk costs" in Vietnam) dictate predictions more than case specifics—e.g., swapping "Vietnam" for "Afghanistan" changes less than swapping "sunk costs" for "rally-around-the-flag."
  - **variations_testable (necessary)**: Low (0.3) since precedents are cognitively packaged (e.g., "Munich" = "appeasement fails"); your test requires artificial decoupling.
  - **small_menu_alternative (alternative_explanation)**: Low (0.2) because while a narrow precedent pool constrains choices, it doesn't explain why mechanism-selection distorts more; it merely shifts selection upstream.
  - **legitimation_primary (alternative_explanation)**: Moderate (0.6) as historical analogies often legitimize decisions (e.g., "Munich" used to sell Iraq War), making "distortion" irrelevant if prediction isn't the goal.
  - **mechanism_post_hoc (contributing)**: Neutral (0.5) as mechanisms can be ex post rationalizations but still become causal once adopted.

  ### Why Your Friend's View Differs:
  Your friend's 0.85 credence likely stems from prioritizing the **legitimation_primary** and **small_menu_alternative** terms. They see case-selection as the core problem because precedents are rhetorical weapons selected for political availability, with mechanisms as mere dressing. You, at 0.6, emphasize **mechanism_predictive_dominance** but underweight **variations_testable**. My 0.7 splits the difference by granting mechanism dominance where separable but flagging separability as fragile.

  ### Recommendation for Your Paper:
  Strengthen your framing by: (1) Acknowledging that mechanism-selection is often *retrospectively* visible but not a discrete stage, and (2) Arguing that even when precedents serve legitimation, their *predictive distortion* still flows through mechanisms. Cite empirical work on analogy use (e.g., Khong 1992) showing mechanisms like "domestic consolidation" drive predictions regardless of case accuracy.
