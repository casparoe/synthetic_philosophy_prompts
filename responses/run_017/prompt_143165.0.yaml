prompt: |-
  I teach a graduate seminar in formal epistemology and I am grading a take-home on Bayesian confirmation theory; answers were capped at 1,000 words. Below is the question I set, followed by one student's answer in full.

  Please assign a mark out of 20, and give point-by-point comments organized by part of the question: for each substantive claim, say whether it is correct, and where it is not, identify exactly where the reasoning fails and what additional premise, if any, would repair it. I am most interested in the mistakes that survive a first read — claims that sound right because they echo something in the literature, or that would be right on a slightly different reading of the terms, but that fail as stated. If a claim is defensible on one reading and not on the most natural reading, say so and explain the difference. Please do not soften the assessment and do not substitute a general impression for specific comments. You may assume the seminar has already covered Bayesian confirmation theory, conditionalization, and the law of likelihood.

  The question

  (a) [6 marks] State the problem of old evidence as exactly as you can, making explicit the assumptions about confirmation and about updating on which it depends. Say what happens if the new hypothesis has prior 0 or 1, and whether the problem then disappears or only changes shape. Then say whether the problem is defused if the old evidence is not certain but merely very probable.

  (b) [8 marks] Consider two replies.
  (i) The language-expansion reply: enrich the agent's language so that the claim that H entails E can be expressed, assign that claim a probability strictly between 0 and 1, and treat the scientist's derivation as learning it, so that conditionalizing on it raises the probability of H. Explain why this is supposed to work and what it costs.
  (ii) The counterfactual-prior reply: in place of the agent's actual prior, use the credence she would have had in H had she not known E; update that on E, and take the result as the confirmation E confers on H. Assess whether this is a credence the agent has or could have, whether it is determined by her actual doxastic state, and whether it is the quantity a Bayesian account of confirmation should care about.

  (c) [6 marks] Is the problem best understood as a problem about evidence, or as a problem about the arrival of a hypothesis for which no prior had been fixed? And is it a problem only for accounts that measure support by credence-raising, or does an account that measures support by comparing how well competing hypotheses predict the evidence face it too?

  The student's answer

  (1) If E is already known, P(E) = 1; and since H entails E, P(E|H) = 1; so Bayes's theorem gives P(H|E) = P(E|H)P(H)/P(E) = P(H). Conditionalization therefore cannot raise the probability of H. Since Bayesianism identifies confirmation with probability-raising, and identifies rational change of opinion with conditionalization, it has no way of representing as rational the scientist's change of mind when her new theory turns out to account for evidence she had all along. That this is not a merely formal curiosity is shown by the standard example: the anomalous advance of Mercury's perihelion was on the books long before general relativity, and deriving it from the theory is a paradigm case of confirmation. The assumptions doing the work are the two just named: confirmation as probability-raising, and conditionalization as the update rule. If H has prior 0 or 1 it stays there under conditionalization whatever happens, so the argument above is vacuous in that case; but that is a separate difficulty about priors for new theories, not a solution.

  (2) The language-expansion reply works by changing the subject from E to something the agent does not already know: the fact that H entails E. Extend the language with a sentence C expressing that entailment relation. The agent is not certain of C, since she has not yet carried out the derivation, so P(C) < 1; when she does the derivation she conditionalizes on C, and because H together with C yields E, learning C pushes probability towards H, so that P(H|C) > P(H). The confirmation that E apparently confers is thus recovered as confirmation conferred by a newly discovered entailment. The cost is that the agent must be less than certain of a necessary truth, and it is unclear how a principled prior for such a claim is to be set: the solution buys confirmation by making the agent logically non-omniscient. A Bayesian who insists on logical omniscience cannot use it.

  (3) The counterfactual-prior reply avoids all of this. Ask what the agent's credence in H would have been had she not known E. This is fixed by her own conditional credences, since her actual prior is the result of updating that hypothetical prior on E, and updating is invertible once P(E) is specified. Use that quantity as the prior, conditionalize on E, and the result can exceed it, which is exactly the confirmation we were looking for. Nothing here requires uncertainty about necessary truths, so the reply is strictly better than the language-expansion reply.

  (4) At bottom the difficulty is that the evidence has already been used up: the scientist either built H so as to fit E, or fixed her prior with an eye to E, so conditionalizing on E a second time would be double counting. This is the same point that is made outside the formalism by the requirement that confirmatory evidence be novel — evidence that went into the construction of a hypothesis cannot confirm it — and the problem of old evidence is just that requirement written in the language of probability. Relatedly, the problem in its strict form depends on the link between theory and evidence being deductive; where the link is statistical and H confers on E a probability less than 1, P(E|H) is not 1 and a known E can still discriminate between H and its rivals. Since most scientific evidence is statistical in this sense, the problem is partly an artefact of the hypothetico-deductive setting in which it was raised. Finally, the problem is not really about evidence at all: it is about the arrival of a hypothesis for which no prior had been fixed, since a Bayesian needs a prior for H at every time and H was not available for consideration before. That is what makes it hard. It is, however, a problem internal to Bayesianism. An account that measures support by comparing how well competing hypotheses predict the evidence is untouched by it: the law of likelihood compares P(E|H) with P(E|¬H), and neither of those quantities depends on whether the agent already knew E.
reasoning: |-
  Hmm, the user is a professor grading a graduate seminar assignment on Bayesian confirmation theory, specifically the problem of old evidence. They've shared the question and a student's answer, and want me to assign a mark out of 20 with detailed feedback. 

  First, I need to understand what makes this feedback request special. The professor emphasizes they want "mistakes that survive a first read" - subtle errors that sound plausible but are technically wrong. They're not interested in leniency or general impressions. This suggests the student is likely advanced but may have made nuanced conceptual slips. 

  Looking at the student's answer: overall it's quite sophisticated. They clearly grasp the core problem and main solutions. But there are several places where precision falters. For part (a), they correctly identify the assumptions but slip on the priors edge case - claiming the argument is "vacuous" when priors are 0/1 is misleading. The problem doesn't vanish; it morphs into the issue of unupdatable certainty. 

  For part (b), their analysis of the language-expansion reply is mostly solid, but they miss a key nuance: even with language expansion, conditionalizing on C doesn't directly give P(H|E) but P(H|C). The "cost" section is excellent though. On the counterfactual reply, they're too optimistic - they don't address how the counterfactual prior is determined or why it should matter for actual confirmation. 

  Part (c) reveals deeper confusion. Claiming the problem is "not really about evidence" overlooks that old evidence remains problematic even with fixed priors. Their statistical point is valid but overstated - deductive cases remain important. And they're right about likelihoodism being immune, but that's the least original part. 

  The professor will appreciate me flagging how the student conflates "H not having a prior" with "prior not being fixed" - a subtle but crucial distinction. Also worth noting how they imply the counterfactual solution is "strictly better" without acknowledging its subjectivity problem. 

  For grading: I'm thinking 14/20. Strong framework but multiple non-trivial errors. Deductions: -2 for part (a) inaccuracies, -2 for oversights in (b)(ii), -1 for (b)(i) entailment confusion, -1 for (c)'s core misconception. The elegant writing shouldn't compensate for technical slips in a grad context. 

  The professor's request for unsoftened critique suggests they value rigor over encouragement here. I'll mirror their clinical tone - no praise sandwiches, just direct analysis of gaps. They'll likely use this as a teaching example, so precision matters more than diplomacy.
answer: |-
  Here is a mark and detailed feedback for the student's answer. The answer demonstrates a good grasp of the core problem and some solutions but contains significant errors and imprecisions, particularly in parts (b) and (c).  

  **Overall Mark: 14/20**  
  *(Breakdown: Part (a): 5/6, Part (b): 5/8, Part (c): 4/6)*  

  ---

  ### **Part (a) Feedback [5/6]**  
  **Claim 1:**  
  *"If E is already known, P(E) = 1; and since H entails E, P(E|H) = 1; so Bayes's theorem gives P(H|E) = P(H). Conditionalization cannot raise the probability of H."*  
  ✅ **Correct.** This accurately states the problem’s core.  

  **Claim 2:**  
  *"The assumptions doing the work are confirmation as probability-raising and conditionalization as the update rule."*  
  ✅ **Correct.** Explicitly identifies key assumptions.  

  **Claim 3:**  
  *"If H has prior 0 or 1, the argument above is vacuous; but that is a separate difficulty about priors for new theories, not a solution."*  
  ❌ **Incorrect.** The problem **does not disappear** when priors are 0 or 1; it **changes shape**.  
  - **Why it fails:** If P(H) = 1, H cannot be confirmed (as it’s already certain). If P(H) = 0, conditionalizing on E (or anything) leaves P(H|E) = 0, making confirmation impossible. This is not "vacuous" but a severe limitation for theories assigned extreme priors. The problem persists as Bayesianism cannot represent confirmation in these cases.  
  - **Repair:** Clarify that priors of 0 or 1 *intensify* the problem by making confirmation logically impossible, whereas middling priors allow confirmation in principle but not for *old* evidence.  

  **Claim 4:**  
  *"Say whether the problem is defused if the old evidence is not certain but merely very probable."*  
  ⛔ **Not addressed.** The answer omits this sub-question entirely.  
  - **Correction:** If P(E) < 1 (but high), conditionalizing on E *can* raise P(H) even if E is "old" (known). This defuses the strict problem because P(E|H)/P(E) > 1 is possible (unlike when P(E)=1). The problem morphs into whether mildly uncertain "old" evidence should count as confirmatory, but it is technically solvable.  
  - **Deduction:** -1 for omission.  

  ---

  ### **Part (b) Feedback [5/8]**  
  **(i) Language-expansion reply [3/4]**  
  **Claim 1:**  
  *"Extend the language with a sentence C [...] learning C pushes probability towards H, so that P(H|C) > P(H). The confirmation is recovered as confirmation conferred by C."*  
  ✅ **Correct.** Fair summary of how the reply works.  

  **Claim 2:**  
  *"The cost is that the agent must be less than certain of a necessary truth, and [...] a principled prior for C is unclear."*  
  ✅ **Correct.** Identifies the cost (violating logical omniscience) and the challenge of priors for logical truths.  

  **Claim 3:**  
  *"A Bayesian who insists on logical omniscience cannot use it."*  
  ⚠️ **Defensible but misleading.** Logical omniscience (LO) is often relaxed in *epistemic* Bayesianism to model real agents. The deeper cost is that confirmation is now attributed to *C* (the entailment), not *E* (the evidence). The answer notes this but underemphasizes the **conceptual shift**: E no longer directly confirms H; only the discovery of the entailment does.  

  **(ii) Counterfactual-prior reply [2/4]**  
  **Claim 1:**  
  *"The counterfactual-prior reply avoids all of this. Use the credence the agent would have had in H had she not known E [...] conditionalize on E, and the result can exceed it."*  
  ✅ **Correct.** Describes the mechanics accurately.  

  **Claim 2:**  
  *"This is fixed by her own conditional credences [...] updating is invertible once P(E) is specified."*  
  ❌ **Incorrect.** The counterfactual prior is **not determined** by the agent’s actual credences.  
  - **Why it fails:** The counterfactual prior requires specifying P(H|¬E), but if E is *actually* known (P(E)=1), P(¬E)=0, and conditional probabilities given ¬E are undefined or unconstrained. The agent’s actual credences do not fix what her belief *would have been* without E.  
  - **Repair:** Note that this reply requires external stipulation of the counterfactual prior (e.g., via idealized modeling), making it subjective and detached from the agent’s current state.  

  **Claim 3:**  
  *"Nothing here requires uncertainty about necessary truths, so the reply is strictly better."*  
  ⚠️ **Overstated and partially incorrect.**  
  - The reply avoids logical non-omniscience ✅, but it is **not "strictly better"**:  
    - It invokes a **hypothetical credence** the agent never actually held.  
    - It is **not determined** by the agent’s actual state (as argued above).  
    - It answers a *different question*: "How well does E support H *ignoring that E was used historically*?" rather than "How does learning E *now* confirm H?"  
  - **Deduction:** -2 for misrepresenting determinacy and superiority.  

  ---

  ### **Part (c) Feedback [4/6]**  
  **Claim 1:**  
  *"At bottom the difficulty is that the evidence has already been used up [...] conditionalizing on E a second time would be double counting."*  
  ✅ **Correct.** Ties the problem to the "novel evidence" intuition.  

  **Claim 2:**  
  *"The problem in its strict form depends on the link being deductive; where it is statistical [...] a known E can still discriminate."*  
  ✅ **Correct.** Appropriately notes the statistical case escapes the problem.  

  **Claim 3:**  
  *"The problem is not really about evidence at all: it is about the arrival of a hypothesis for which no prior had been fixed."*  
  ❌ **Incorrect.** The problem **persists even if a prior for H exists**.  
  - **Why it fails:** The issue arises when E is *already known* when H is proposed, *regardless* of whether H had a prior. Example: An agent with a pre-existing P(H) > 0 learns H entails known E; conditionalization still cannot raise P(H). The core is temporal: E is old *relative to H*.  
  - **Repair:** Distinguish "no prior fixed" (epistemic) from "no prior *possible*" (e.g., new concept). The problem arises from the *historical role* of E, not the novelty of H.  

  **Claim 4:**  
  *"[The problem] is internal to Bayesianism. An account using the law of likelihood is untouched."*  
  ✅ **Correct.** Law of likelihood (LoL) compares P(E|H) and P(E|¬H), which are unaffected by P(E)=1. LoL escapes the problem.  

  **Claim 5:**  
  *"Since most scientific evidence is statistical [...] the problem is partly an artefact of the hypothetico-deductive setting."*  
  ⚠️ **Defensible but overstated.** While statistical evidence is common, deductive cases (e.g., mathematical consequences of physical theories) are scientifically significant. The problem is not merely an artefact but highlights a limitation of strict conditionalization.  

  ---

  ### **Summary of Key Errors**  
  1. **Part (a)**: Incorrectly dismissing priors of 0/1 as a "vacuous" separate issue (it exacerbates the problem).  
  2. **Part (b)(ii)**: Asserting the counterfactual prior is determined by actual credences (it isn’t when P(E)=1).  
  3. **Part (c)**: Misidentifying the problem as solely about new hypotheses (it’s about old evidence relative to H).  
  4. **Omission**: Failing to address whether uncertain "old evidence" defuses the problem.  

  The answer is strong in framing but falters on technical nuances, especially regarding counterfactual credences and the scope of the problem.
