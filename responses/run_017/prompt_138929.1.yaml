prompt: |-
  I've been arguing with myself about asylum cases for a while and I want to know what principle, if any, I actually believe. Here are my gut verdicts:

  - A journalist who'll be jailed for publishing accurate criticism of her government: obviously yes.
  - A woman whose husband beats her and whose local police won't lift a finger because that's just how things are there, even though the law on paper says otherwise: yes.
  - A farmer whose land has stopped producing after ten years of drought: yes, but a uneasy yes — it doesn't feel like the same kind of yes as the first two.
  - A kid who joined a gang at 14 because it was the only protection going, ran errands for it, now wants out and will be killed if he stays: yes, and I don't think the gang stuff should count against him.
  - A man who was a low-level guard at a prison where beatings were routine, turned informant, and is now being hunted by the people he informed on: no, he doesn't get in. Which bugs me, because he was poor too and had few options too.
  - A family that fled eight years ago, is safe and settled in the country next door, and now wants to move on to a wealthier one: no. That one feels finished.
  - Someone who isn't in danger at all and just can't earn a living: no — but I don't feel great about it.
  - On who has to take people: the country next door does, even when it's poor and already hosting two million. But the rich country whose weapons kept the war going also has a duty, and I can't get both of those just from "whoever's able to help."
  - A rich country with no historical tie and no causal involvement: some duty, but weak? Genuinely unsure.

  The test I keep coming back to is something like: you have a claim if going back leaves you with no acceptable option at all. That seems to get most of the list, but it turns the prison guard into a yes and the settled family into a maybe, and I don't want either. Can it be patched, or is it the wrong shape entirely? Whichever principle you land on, state it precisely, tell me which clause each case is doing the work for, and tell me honestly which of my verdicts I'd have to give up. I also want to know what it says about people who aren't displaced yet but will be — say a village that'll be unfarmable or underwater within fifteen years: do they have a claim now, and against whom? Please answer in American English.
reasoning: |-
  Okay, the user is really wrestling with their own principles on asylum cases. They've listed several scenarios where they have strong gut reactions about who should or shouldn't get asylum, but they're struggling to find a consistent ethical framework that explains all their judgments. 

  Hmm... what's interesting is how visceral some of their reactions are - especially the "uneasy yes" for the drought farmer versus the firm "no" for the prison guard informant. There's clearly some unspoken moral hierarchy at work here where direct persecution feels more legitimate than economic hardship or complicity in oppression. 

  The user seems intellectually honest - they're bothered by their own inconsistency, particularly how their "no acceptable options" test would force them to accept cases they instinctively reject (like the guard). They're also grappling with practical realities like capacity ("the country next door does") and historical responsibility ("the rich country whose weapons kept the war going"). 

  Ah! The temporal aspect is crucial too - they mention future climate displacement. That suggests they need a principle that addresses immanent harm, not just present danger. Their discomfort with the settled family ("feels finished") implies asylum isn't permanent residency to them, but rather emergency protection. 

  What's really being asked for is moral triage: a way to prioritize limited resources among many suffering people. The user wants clear lines but feels guilty about drawing them. Their examples reveal unarticulated values: innocence (the kid in the gang), helplessness (the abused woman), and direct causation (the arms-trading rich country). 

  The refugee lawyer in me wants to note how closely their intuitions track existing conventions - except where they don't (the guard). Their resistance to helping the guard despite his "few options" suggests they weight personal responsibility more heavily than the UN protocol does. Fascinating!
answer: |-
  Based on your gut verdicts and the inconsistencies you've identified with the "no acceptable option" test, here's a precise principle that captures most of your intuitions while addressing the conflicts:

  **The Principle of Refuge from Unjust Harm:** A state has a duty to grant asylum when an individual faces a serious threat of harm inflicted or permitted by an identifiable, unjust power structure (state or non-state) due to their identity, actions, or circumstances, and where no effective national protection exists or is accessible to them. The duty is strongest for states geographically proximate, historically involved, or causally responsible for the conditions creating the harm.

  **Breaking Down the Principle:**

  1.  **"Serious threat of harm":** Must be severe (death, violence, persecution, intolerable living conditions due to persecution/neglect).
  2.  **"Inflicted or permitted by an identifiable, unjust power structure (state or non-state)":** This is key. The harm must stem from deliberate action or systemic failure/neglect by an entity wielding significant power (government, militia, gang, societal structure enabling domestic violence, etc.), acting unjustly. This excludes purely natural disasters or generalized poverty *without* an unjust power structure element.
  3.  **"Due to their identity, actions, or circumstances":** The reason they are targeted or unprotected (political opinion, gender, desertion, whistleblowing, belonging to a persecuted group, location in a deliberately neglected region).
  4.  **"No effective national protection exists or is accessible":** Their own state either *is* the source of the threat or is *unable or unwilling* to protect them from the non-state actor.
  5.  **"Duty strongest for proximate/involved/responsible states":** Addresses the "who takes them" question, prioritizing neighbors, historical actors, and those causally contributing.

  **Applying the Principle to Your Cases (Clause Doing the Work):**

  1.  **Journalist:** YES. *Serious harm* (jailing) *inflicted by state power* (govt) *due to actions* (criticism) *with no national protection* (govt is perpetrator). (Clauses 1, 2, 3, 4)
  2.  **Abused Woman:** YES. *Serious harm* (violence) *permitted by unjust power structures* (state via police inaction; societal norms) *due to identity/circumstances* (gender) *with no effective national protection* (police unwilling). (Clauses 1, 2, 3, 4)
  3.  **Drought Farmer:** YES (Uneasy). *Serious harm* (intolerable living conditions) *permitted by unjust power structure* (state neglect, failure to adapt/assist vulnerable populations, perhaps contributing to climate vulnerability) *due to circumstances* (location/vocation) *with no effective national protection/mitigation*. (Clauses 1, 2, 3, 4 - *The "unjust power structure" element is crucial and explains the unease; if the state is actively trying to help but overwhelmed by a pure natural disaster, the claim weakens under this principle*).
  4.  **Former Gang Kid:** YES. *Serious harm* (death) *inflicted by non-state power structure* (gang) *due to actions* (leaving) *with no effective national protection* (state unable/unwilling to protect from gangs). (Clauses 1, 2, 3, 4)
  5.  **Prison Guard Informant:** **NO** (Matches your verdict). *Serious harm* (death) *inflicted by non-state power structure* (hunters) *due to actions* (informing). BUT... *why "no"?* Under this principle, the key is **the guard's prior role within the unjust power structure**. He was an *agent* of the system inflicting harm (routine beatings). While he had "few options," his complicity (even low-level) in the unjust system weakens the claim based on *his own prior actions contributing to the harm of others*. The principle focuses on victims of the unjust structure, not necessarily its former participants facing blowback for turning *against* it, especially when their prior actions harmed others. (Clause 2 - problematic origin of threat related to his *own past actions within the structure*; Clause 3 - action (informing) stems *from* his prior complicity). **This is the clause resolving your conflict.**
  6.  **Settled Family:** NO (Matches your verdict). *No current serious threat of harm*. They are safe. The original *unjust power structure* threat is no longer imminent or they are effectively protected where they are. Asylum addresses *imminent danger*, not preference for better economic opportunity once safe. (Fails Clause 1 - no current serious threat).
  7.  **Cannot Earn a Living:** NO (Matches your verdict). *Serious harm* (poverty) exists, but lacks the *unjust power structure* element causing/permitting it *specifically targeting them or a group they belong to*. This is generalized economic hardship, not persecution or state-enabled neglect. (Fails Clause 2).
  8.  **"Who Has to Take Them":** The principle clarifies:
      *   *Country next door (poor, hosting millions):* Strong duty based on **proximity** (Clause 5). Practicality matters but doesn't negate the duty.
      *   *Wealthy country fueling the war:* Stronger duty based on **causal responsibility** (Clause 5). Their involvement strengthens the moral claim against them, potentially overriding pure proximity or capacity arguments.
      *   *"Whoever's able" isn't sufficient alone; proximity and responsibility create stronger, more specific duties.*
  9.  **Rich Country, No Tie/Involvement:** WEAK DUTY (Matches your unsure verdict). A basic humanitarian duty exists (Clause 1, perhaps weakly), but it lacks the heightened obligation from proximity, history, or responsibility (Clause 5). They might accept refugees as a moral gesture, but others have a stronger primary duty.

  **Verdicts You Would Have to Give Up (and Why):**

  *   **Prison Guard Informant:** Your gut said "no," the "no acceptable option" test said "yes," **this principle says "no"** and explains why (prior complicity in the unjust system). You *keep* your "no" verdict.
  *   **Settled Family:** Your gut said "no," the "no acceptable option" test said "maybe," **this principle says "no"** (no current threat). You *keep* your "no" verdict.
  *   **Drought Farmer:** Your "uneasy yes" is upheld, but the principle clarifies the unease stems from needing to establish the *state's unjust role* (neglect, discriminatory lack of aid, contribution to vulnerability) beyond the natural disaster itself. If that element is clear, the "yes" is justified.

  **Addressing Future Displacement (The Village):**

  *   **Claim Now?** **No, not yet under this principle.** The *serious harm* (unfarmable/underwater) is future, not imminent (Clause 1). The *unjust power structure* might be the global system causing climate change or their own government's lack of adaptation *planning*, but the direct harm isn't present.
  *   **Against Whom?** This principle points towards:
      1.  **Their Own Government:** Primary duty to protect them via adaptation, relocation plans, or seeking international assistance *before* displacement occurs.
      2.  **Major Contributing States:** Wealthy, high-emission nations bear **causal responsibility** (Clause 5). Their duty is to provide massive funding for adaptation/mitigation *in situ* and, eventually, for managed migration pathways *before* it becomes a crisis-driven asylum claim. This is *proactive responsibility*, not reactive asylum.
      3.  **Proximate States:** Neighbors might have a role in regional planning, but the primary duty lies with the responsible and capable actors (home state and major contributors).
  *   **When Does the Claim Activate?** When the harm becomes **imminent and unavoidable** (e.g., sea walls failing, final crop failure, government actively abandoning them), and especially if the state fails to protect them or the unjust structures (global inaction, state neglect) become the direct cause of their intolerable situation. Then, the "serious harm" and "unjust power structure" elements align, creating a potential asylum claim, primarily against responsible/proximate states.

  This principle provides a consistent framework reflecting most of your intuitions, resolves the guard/family conflicts by emphasizing the *source and nature* of the harm and the *role* of the claimant, and offers a structured way to think about future climate displacement focused on prevention and responsibility *before* asylum becomes necessary.
