prompt: |-
  I am drafting a paper on moral testimony, and I want the specification settled before I measure any existing view against it. Fix the purpose first, so that adequacy has a target: the theory is to serve as a guide for a competent but morally unexceptional agent who faces a concrete situation and must decide whether to take someone else's word on a moral question, whose word to take, how far to take it, and what she ends up with if she takes it. A theory adequate to that purpose should also be able to say what is supposed to be wrong with the kinds of deference we find objectionable, and why that wrong is not simply one more case of believing an unreliable source.

  Write the desiderata such a theory must meet. For each requirement, give the case or consideration that earns it a place on the list, and mark it as non-negotiable or as something only one camp has insisted on. I would rather have eight requirements with real cases behind them than twenty with none.

  The following cases are the ones I want adjudicated, since they are where I suspect existing views quietly cheat. Say, for each, whether it generates a genuine desideratum, what that desideratum is, and whether the case is really doing work or is cheap:

  1. A trusted person says the act is wrong, offers no reasons, and cannot offer any; the agent defers anyway.
  2. The person you have wronged tells you what you owe her. Her say-so seems partly to constitute the answer, and withholding deference here looks like a moral failing rather than an epistemic virtue.
  3. Someone with relevant lived experience delivers a moral verdict whose authority seems to come from better access to non-moral facts rather than from superior moral judgment.
  4. A testifier whose predictions reliably track the truth but whose stated reasons are confused or worse; reliability and articulate justification come apart.
  5. A testifier whose fundamental moral commitments you reject entirely nevertheless tells you that an act is impermissible, and is right.
  6. Ten thousand aggregated strangers against one person you regard as a genuine moral expert.
  7. The learner's case: a child asks whether lying is wrong and is told that it is. Deferring looks not merely permissible but required, and yet the theory must say what, if anything, changes as the learner matures.
  8. An artefact that has no experience, no understanding, no stake, and no capacity to weigh reasons, but which predicts your own considered verdicts better than you predict them yourself.
  9. A moral question that is open for you only because the empirical facts are not yet in: separate the deference due to the prediction from the deference due to the verdict, and say whether a theory that handles this by reclassifying it as non-moral testimony has thereby explained anything.
  10. The agent with no view of her own at all, who has simply never thought about the matter.

  I also want an explicit ruling on which distinctions a theory may not collapse: deferring to a person versus treating her as evidence; believing on testimony versus understanding why; reliability versus expertise versus authority; the moral content of a verdict versus the empirical claims embedded in it; the first-personal deliberative standpoint versus third-personal appraisal; the epistemic question of what you may believe versus the moral question of whether deferring here is itself a failing versus the pedagogical question of what deferring does to a learner; deference to a person versus deference to a procedure such as a tribunal, a lottery, or an aggregation; and taking a verdict now versus coming to understand it later.

  Three meta-questions matter more to me than the list itself. First, which items that people standardly demand are really camp commitments dressed up as data, and which are forced by the cases. I have in mind, as candidates for demotion, the demand that the theory vindicate the claim that there are no moral experts, and the demand that it produce a special explanation of cases involving testifiers with odious views; if such cases turn only on the speaker's unreliability, they are easy for every theory and should not be allowed to earn it credit. Second, whether any subset of the desiderata is jointly unsatisfiable, so that the list itself becomes a result about what no single theory of moral testimony can be. Third, which single requirement does the most exclusionary work, knocking out the most otherwise attractive views.

  Close with a short scorecard, no more than a line or two each, for four generic contenders: a straight deference view on which moral testimony works like any other; a view on which it transmits knowledge but not understanding; a view on which the deliberative standpoint makes deference in principle inappropriate; and a view that explains whatever asymmetry there is by appeal to the nature of moral disagreement rather than to the nature of moral judgment. Keep the weight on the criteria. Do not cite or name authors, do not survey the literature, and do not reach for examples beyond the ones I have given unless one is doing real work.
reasoning: |-
  Hmm, this is a substantial and rigorous request about moral testimony. The user is drafting a paper and needs help formulating precise desiderata for a theory of moral testimony. They've provided 10 specific cases they want addressed and several distinctions they want preserved. This requires careful philosophical analysis.

  First, I need to understand their core purpose: they want a theory that guides ordinary moral agents in deciding whether, when, and how to defer to others on moral questions. The theory must explain what's wrong with objectionable deference beyond simple unreliability. This framing is excellent - it grounds the entire enterprise in practical reasoning.

  Looking at their 10 cases, each presents a distinct challenge:
  - Case 1 (blind deference) raises questions about reasons-free acceptance
  - Case 2 (wronged party) suggests deference can be morally required
  - Case 3 (lived experience) blurs moral/non-moral authority
  - Case 4 (reliable but inarticulate) decouples reliability from justification
  - Case 5 (odious testifier) challenges the role of shared commitments
  - Case 6 (aggregation vs expert) pits numbers against expertise
  - Case 7 (child learner) examines developmental aspects
  - Case 8 (prediction artifact) questions whether moral judgment requires personhood
  - Case 9 (pending facts) probes the moral/empirical boundary
  - Case 10 (no prior view) tests whether deference requires preexisting stance

  For each, I'll determine if it generates a genuine desideratum. For instance, Case 2 clearly does - it shows deference can be constitutive rather than epistemic. Case 8 might not, as artifacts may not engage moral judgment proper.

  The distinctions they mention are crucial. We must preserve:
  - Deference vs treating as evidence
  - Believing vs understanding
  - Reliability vs expertise vs authority
  - Moral vs embedded empirical content
  - First-person vs third-person perspectives
  - Epistemic vs moral vs pedagogical questions
  - Personal vs procedural deference
  - Immediate acceptance vs future understanding

  On meta-questions:
  - "No moral experts" seems a camp commitment, not data
  - Odious testifier cases likely reduce to reliability
  - Possible tension between Case 2 (required deference) and deliberative standpoints
  - Case 5 (odious testifier) may be the most exclusionary

  For the scorecard of four views:
  1. Straight deference fails Cases 1, 2, 5, 7
  2. Knowledge-without-understanding fails Case 7
  3. Deliberative standpoint fails Cases 2, 7
  4. Disagreement-based view struggles with Case 5

  The user clearly wants concise, case-driven analysis without literature review. I'll focus on their specified cases and distinctions, using their terminology throughout. The challenge is balancing comprehensiveness with their preference for "eight requirements with real cases" over exhaustive lists.
answer: |-
  Here are the desiderata for a theory of moral testimony, grounded in your cases and distinctions. Requirements marked 🔒 are non-negotiable; others reflect tensions between camps. Cases are used only where they *generate* the requirement, not merely illustrate it.

  ---

  ### **Desiderata for a Theory of Moral Testimony**
  1. **🔒 Must explain when deference is *epistemically permissible* without independent verification**  
     *Source*: Case 1 (blind deference). The theory must allow that agents can sometimes rationally defer even when reasons are unavailable.  
     *Work*: Genuine – forces engagement with whether moral testimony can transmit warrant absent understanding.

  2. **🔒 Must account for *morally required deference* (not merely permissible)**  
     *Source*: Case 2 (wronged party). Withholding deference here constitutes a moral failure (e.g., disrespect), not an epistemic error.  
     *Work*: Genuine – shows deference can be a demand of justice, not just epistemology.

  3. **Must distinguish *authority from lived experience* vs. *moral expertise***  
     *Source*: Case 3 (lived experience). The theory must clarify whether deference here hinges on access to non-moral facts (e.g., trauma’s phenomenology) or moral insight.  
     *Work*: Genuine – tests if "moral testimony" collapses distinct sources of authority.

  4. **🔒 Must accommodate *reliability without articulacy***  
     *Source*: Case 4 (reliable but confused testifier). The theory must explain why agents can defer to those who track truth but offer bad reasons.  
     *Work*: Genuine – decouples justification from reliability, blocking "cheating" by requiring articulate testifiers.

  5. **Must resolve whether *shared commitments* are necessary for legitimate deference**  
     *Source*: Case 5 (odious testifier). The theory must say if deference is impermissible when moral frameworks clash, even if the testifier is right.  
     *Work*: Cheap if reduced to reliability; genuine if it reveals a distinct barrier (e.g., autonomy).

  6. **🔒 Must weigh *aggregated lay judgment* against *individual expertise***  
     *Source*: Case 6 (10,000 strangers vs. expert). The theory must specify when numbers outweigh perceived expertise (e.g., in democratic vs. arcane contexts).  
     *Work*: Genuine – exposes tension between social and epistemic authority.

  7. **🔒 Must explain *developmental asymmetry* in deference**  
     *Source*: Case 7 (child learner). The theory must justify required deference for novices while explaining why mature agents might not defer identically.  
     *Work*: Genuine – tests if deference is a temporary epistemic crutch or a permanent tool.

  8. **Must address whether *non-agential sources* (e.g., AI) can provide moral testimony**  
     *Source*: Case 8 (artifact). The theory must clarify if "testimony" requires a testifier with understanding/stakes.  
     *Work*: Cheap if dismissed by definition; genuine if it probes whether moral judgment requires personhood.

  ---

  ### **Rulings on Cases 9–10 & Key Distinctions**  
  - **Case 9 (pending empirical facts)**: Generates a desideratum: *Must disentangle deference to moral verdicts from deference to empirical predictions*. Reclassifying as "non-moral" dodges the work unless the theory explains why moral verdicts depend constitutively on empirical inputs.  
  - **Case 10 (agent with no prior view)**: No new desideratum. Covered by desiderata 1 (permissibility) and 7 (novice deference).  

  **Distinctions a theory must preserve** (non-collapsible):  
  - Deferring to a person vs. treating them as evidence (Case 2 breaks if collapsed).  
  - Believing on testimony vs. understanding why (Case 4 requires this gap).  
  - Reliability vs. expertise vs. authority (Case 3 forces separation).  
  - First-personal deliberation vs. third-personal appraisal (Case 5 and Case 2 rely on this).  
  - Epistemic permissibility vs. moral permissibility of deferring (Case 2 and Case 7 demand dual analysis).  

  ---

  ### **Meta-Questions**  
  1. **Demotions**:  
     - *"No moral experts"*: Camp commitment (e.g., deliberativists). Not forced by cases; Case 6 assumes experts *can* exist.  
     - *Odious testifiers*: Often reducible to reliability (Case 5). If the testifier is reliable, no *special* problem arises; if unreliable, it’s generic. Does not earn credit.  

  2. **Joint Unsatisfiability**:  
     Desiderata 2 (required deference) and 5 (shared commitments) conflict with strict deliberativist views. Desideratum 7 (developmental asymmetry) strains views denying moral understanding’s necessity.  

  3. **Most Exclusionary Requirement**:  
     **Desideratum 2 (morally required deference)**. It excludes:  
     - Views that deem deference inherently objectionable (deliberative standpoint).  
     - Views reducing testimony to evidence (fails to capture the wrong in withholding deference in Case 2).  

  ---

  ### **Scorecard for Generic Views**  
  | **View** | **Key Failure** | **Key Strength** |  
  |----------|----------------|------------------|  
  | **Straight deference** (moral testimony = ordinary testimony) | Fails Desideratum 2 (cannot explain morally required deference) and Desideratum 5 (ignores clashing commitments). | Meets Desideratum 1 (permits blind deference) and Desideratum 4 (relies on reliability). |  
  | **Knowledge without understanding** | Fails Desideratum 7 (cannot explain why children *must* defer but adults *should not* always). | Meets Desideratum 1 and Desideratum 4 (allows warranted belief sans reasons). |  
  | **Deliberative standpoint** (deference inappropriate) | Fails Desideratum 2 and Case 7 (child deference required). | Meets Desideratum 5 (rejects odious testifiers) and clarifies first-/third-person distinction. |  
  | **Disagreement-based asymmetry** (moral deference differs due to disagreement depth) | Fails Case 2 (cannot explain non-disagreement-based required deference) and Desideratum 6 (aggregation). | Meets Desideratum 5 (explains clashing commitments) and distinguishes moral/empirical. |  

  ---
  This framework ensures adequacy is measured against your core purpose: guiding real agents in concrete decisions, with cases driving requirements. The tensions (e.g., between Desiderata 2 and 5) map live debates without artifice.
