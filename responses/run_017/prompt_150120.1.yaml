  But the user needs it to be safe. So to make it safe, the malfunction must be such that whenever it happens, the patient coincidentally has the disease. But that's unrealistic. 

  This is the core tension. Making the belief safe requires that the truth is robust across nearby worlds with the same basis, which often makes it seem like knowledge. To have a Gettier case that's safe, the connection between the basis and truth must be non-accidental in the modal sense but still accidental in the actual world. 

  Perhaps a scenario where the basis is reliable, and the truth-maker is independent but always coincides in nearby worlds. For example, in a newsroom: A journalist sees a verified report of a CEO resigning on a reliable platform. She believes the CEO resigned. The report was actually a hacker's prank, but at the same time, the CEO did resign for unrelated reasons. The belief is true and justified. For safety: In nearby worlds, if the same basis (seeing the report on that platform) occurs, does the CEO resign? The hacking is rare, so usually, the report is correct. When hacked, the report is usually false. In this case, it's true by coincidence. But in nearby worlds where the report is hacked and says "resigned," the CEO usually hasn't resigned, so the belief is false. Therefore, the belief isn't safe. 

  To make it safe, the coincidence must hold in nearby worlds. For example, if the hacking only happens when the CEO resigns, but that's ad hoc. 

  The breakthrough: The basis includes more than just the instrument reading. In the lab scenario, if the basis is "the spectrometer reads 7.0 and the lab conditions are standard," then in nearby worlds, if the readout is 7.0 under standard conditions, the pH is 7.0. The fault and spill break the standard conditions, but they are rare. So in all nearby worlds where the basis holds (readout 7.0 and standard conditions), the machine is working, so pH is 7.0. The actual world has non-standard conditions (fault and spill), but they are distant possibilities. Thus, the belief is safe because the basis includes standard conditions, and in nearby worlds with that basis, all is well. 

  In the actual world, the conditions weren't standard, but the subject assumed they were. The basis for belief is the readout plus the assumption of normal conditions. When the basis is the same (readout 7.0 and assumed normal conditions), in nearby worlds, conditions are normal, so if the readout is 7.0, pH is 7.0. The belief is true in those worlds. In the actual world, conditions weren't normal, but the belief was true anyway by coincidence. So safety holds. 

  This satisfies (3). For (4), no false lemma: The subject doesn't believe the conditions are normal as a premise; it's a non-doxastic background assumption. The misleading element is the undetected fault and spill. 

  For (5), the method is using the spectrometer in normal conditions, which is reliable. The grain is coarse: instrument reading under standard lab protocols. 

  For (6), the evidence (readout 7.0) plus background knowledge of reliability makes pH=7.0 highly probable. 

