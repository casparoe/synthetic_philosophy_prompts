  The teaching fellow (reliabilist) will say the process was unreliable in this instance because of the fault. But the process is defined as the method in normal conditions, which is reliable. The actual conditions were abnormal, but the subject couldn't know. So the process wasn't followed correctly? But the subject did everything right; the abnormality was undetectable. 

  The account that fares worst is safety because it deems the belief safe. The objection: The basis isn't the same in nearby worlds where conditions are normal. In those worlds, the readout accurately reflects pH, so the belief is true. But in the actual world, the basis (readout) was caused by a fault, not pH, so the belief-forming process was different. Safety theorists might argue that the method should include the actual causal process, which was unreliable. But the user wants to avoid process unreliability by defining the method broadly. 

