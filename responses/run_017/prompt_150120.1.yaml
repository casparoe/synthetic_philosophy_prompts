  This is tricky. To make it safe, the coincidence must be common enough that in nearby worlds where the basis is the same (faulty readout 7.0), the pH is still 7.0. But that might make the intuition of non-knowledge weaker. 

  Another idea: Instead of a spill, perhaps a calibration error that coincidentally shows the correct value because of an environmental factor. For example, the lab's temperature affects the sample and the machine in a way that cancels out. But that might be too convoluted. 

