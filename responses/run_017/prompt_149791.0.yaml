prompt: |-
  I am assembling a small evaluation suite built out of Bongard problems in their usual form: six small figures in a left box, six in a right box, where the left figures all satisfy some rule and the right ones all violate it, and the solver has to say what distinguishes them. A colleague and I have been arguing about whether such problems even have determinate right answers, and I have ended up defending a strong version of yes. Here is my position. A well-formed Bongard problem has exactly one correct rule, and correct means: the shortest description, measured in a fixed vocabulary of shape predicates (connectedness, convexity, number of vertices, containment, mirror symmetry, relative size, inside-versus-outside, and the like), that is true of all six figures on one side and none on the other. The notorious slipperiness of these puzzles — solvers who find some clever unintended rule that separates the boxes perfectly — is, on my view, a measurement artifact rather than indeterminacy in the problem. We have not specified the coding language, and at the scale of twelve figures the additive constant that any two adequate description languages are allowed to differ by (the standard invariance result gives equality only up to such a constant) is large relative to the differences between candidate rules, so almost any vocabulary looks permissive. Fix the vocabulary, score by description length, and the puzzle is well posed: a gerrymandered longer rule is simply a wrong answer, not an alternative reading. My latest irritation is what I have started calling the median rule: a solver separated my boxes by saying only that each left figure has less total ink area than the median of all twelve figures. It separates perfectly. It is also, I want to say, not a rule about the figures at all but a rule about the set, and I would like my scoring to exclude it by fiat. To that end I have built two things into the suite: chimeric problems, deliberately constructed so that an unintended rule is strictly shorter than the intended one, and discriminating probes, fresh figures generated after a solver states its rule, chosen so that the stated rule and the intended rule disagree about them, with human raters asked which partition feels right.

  I want you to attack this. Give me what would count against the position, and not only what a critic would say about it: I especially want the defeaters that someone holding my view should concede are genuine, and the ones they would dismiss. Press hardest where I think I am most exposed. First, whether the fixed vocabulary is doing smuggled work: is a natural vocabulary of shape predicates anything other than a description of what this community of puzzle-setters and solvers happens to reach for, in which case I have expelled the setter's intentions through the door and readmitted them through the vocabulary? Second, ties: two incompatible rules of exactly equal description length, and whether anything short of an appeal to what the setter meant can break the tie. Third, the alternative model I keep circling, on which a Bongard problem is a cooperative communication game with an intended reading and shortest-description is at best a proxy for intendedness — what exactly does that model predict that mine does not, and vice versa? Fourth, whether minimum-description-length scoring can carry any evidential weight at all at n equals six, given the constant-factor problem, and what the sample sizes would have to be. Fifth, whether my chimeric problems show what I claim: if human raters reject the shorter unintended rule, is that evidence for me, or only evidence that the raters share my intention-sensitivity, which would make citing them circular? Sixth, the grue-flavored version of the underdetermination worry, that recoding can make a devious rule come out short in some equally natural coding. Alongside the ranked list, I want an insulation check: have I built in an escape hatch of the form if the shortest rule looks wrong, then my vocabulary was wrong, and is that kind of insulation fatal here or merely embarrassing? And I want you to say which parts of my dispute with my colleague are substantive and which are verbal.

  For your own answer, be explicit about confidence: tell me which of your defeaters you take to be genuinely live now and which are merely logically possible, say how much of your reasoning rests on claims about how human solvers actually behave, and close by naming the single consideration most likely to change your verdict and the place where your ranking is most likely to be wrong. Please write in American English and use these sections in this order: The position you are attacking (about 120 words, charitably stated but with its weakest joints showing, not softened), What the view predicts that its rivals do not (about 150 words), Ranked defeaters (about 500 words, as a table with columns for the defeater, whether a defender concedes it, whether it is fatal, serious, or merely awkward, and whether it is live or merely possible), Live versus merely possible (about 150 words), Insulation and verbal-dispute check (about 200 words), and What would change my mind (about 200 words).
