answer: |-
  ### Joint Statement of Agreed Claims  
  Both judgmentalist (Camp One) and perceptualist (Camp Two) theories of emotion endorse the following:  

  1. **Emotions have evaluative content**: Emotions are intentional states that represent aspects of the world (e.g., fear represents danger). This content can be assessed for *fittingness* (whether the evaluation matches reality).  
  2. **Bodily feelings are typically involved**: Gut-drops, tightness, and other interoceptive signals are common components of emotional episodes, but emotions cannot be *reduced* to these feelings alone.  
  3. **Recalcitrant emotions exist**: The white-knuckling flyer’s fear is real and intelligible, even when they sincerely judge flying as safe. Both camps reject the "mere bodily feeling" account as insufficient to explain this.  
  4. **Emotions are not voluntary**: We cannot directly will emotions away (e.g., the flyer cannot dispel fear by reasoning alone).  
  5. **Babies and animals have emotions**: Both camps ascribe emotions to infants and non-human animals, though they disagree on whether these require conceptual capacities (Camp One) or only perceptual ones (Camp Two).  
  6. **An emotion can exist without conscious bodily feelings?** Both agree this is empirically testable (e.g., via the drug case below). If emotions persist without *any* bodily feedback, Camp One’s view is strengthened; if they vanish, Camp Two’s is.  

  ### Table of Remaining Disagreements  
  | Issue | Judgment Theory (Camp One) | Perceptual Theory (Camp Two) |  
  |-------|----------------------------|------------------------------|  
  | **Core nature of emotion** | Emotions constitutively involve evaluative *judgments* (belief-like states). To fear X is to judge X as dangerous. | Emotions are *perceptions of value* (non-belief-like). To fear X is to perceptually experience X as dangerous. |  
  | **Orange room case** | This is *not a genuine emotion*: Without a judgment that orange is dangerous, it’s merely an "affective urge" or non-emotional reflex. Camp One welcomes this result. | This *is a genuine emotion*: The fear-response is a perceptual illusion of danger, independent of belief. The embarrassment confirms its emotional status. |  
  | **Drug case prediction** | People *still have emotions*: Judgments (e.g., "this dog is dangerous") persist. They may misreport due to lacking felt arousal, but avoidance proves fear exists. | People *lose emotions entirely*: Without bodily feedback, the perceptual experience of value vanishes. Avoidance would stem from non-emotional beliefs alone. |  
  | **Recalcitrance (flying fear)** | Fear persists due to a *non-conscious judgment* of danger (e.g., ingrained via evolution). Revising the conscious belief doesn’t erase this deeper appraisal. | Fear persists as a *perceptual illusion*: Like seeing a stick as a snake, the emotion is insensitive to belief. It’s "sticky" because perception isn’t belief. |  
  | **Role of bodily feelings** | Feelings are *causal byproducts* or motivational amplifiers of the judgment, not essential. Emotions can be "cold" (e.g., dispassionate danger appraisal). | Feelings are *constitutive*: They are the medium of value perception. No bodily component → no emotion (only "disembodied" judgment). |  

  ### Cruxes: Predictions for Key Cases  
  Both camps agree these cases bear directly on the dispute. Predictions assume uncontroversial empirical conditions (e.g., no confounding variables).  

  1. **Crux: Orange Room Case**  
     - **Finding Tested**: A subject exhibits fear physiology/avoidance toward orange objects but consistently reports and acts on the belief that orange is harmless.  
     - **Judgment Theory Prediction**: *Not an emotion*. Outcome welcomed—it distinguishes true emotions (judgment-dependent) from mere affects.  
     - **Perceptual Theory Prediction**: *Is an emotion*. Outcome welcomed—it shows perceptions can decouple from beliefs.  

  2. **Crux: Drug Case**  
     - **Finding Tested**: Subjects given an interoception-blocking drug report no emotions (e.g., "I feel no fear") but retain beliefs (e.g., "I know spiders are dangerous") and avoid threats.  
     - **Judgment Theory Prediction**: *Emotions persist* (fear is present but unfelt). A "no" result (emotions vanish) would force major revision (e.g., abandoning judgment as sufficient).  
     - **Perceptual Theory Prediction**: *Emotions vanish*. A "no" result (emotions persist) would falsify the theory—bodily perception is necessary.  

  3. **Crux: Recalcitrant Emotions (Flying Fear)**  
     - **Finding Tested**: A flyer’s fear persists after they affirm flying’s safety, with no reduction in physiological arousal.  
     - **Judgment Theory Prediction**: *Non-conscious judgment* explains it. If no such judgment were found (e.g., via cognitive priming), the theory would need revision.  
     - **Perceptual Theory Prediction**: *Perceptual illusion* explains it. If fear vanished when belief changed (contra actual cases), the theory would be weakened.  

  ### Analysis of Verbal Disagreement  
  Your hunch is partly right: **The core disagreement is not merely verbal, but the definition of "judgment" creates noise.**  
  - **If "judgment" = any content-bearing state**, Camp Two agrees emotions involve evaluations—but they deny these are *beliefs* (i.e., responsive to evidence/reasoning). Camp One insists emotions *are* belief-like.  
  - **What’s genuinely left**: Whether emotions are *inferential* (revised by reasoning, like beliefs) or *modular* (automatic, like perception). This is substantive: It shapes predictions (e.g., drug case) and explains recalcitrance. Clearing the verbal fog leaves this architectural dispute intact.  

  ### Conclusion: Would Anything Move the Camps?  
  **Empirical findings could decisively shift the debate**, but entrenched assumptions might blunt their impact:  
  - The **drug case** is the strongest potential falsifier: If emotions vanish without bodily feedback, Camp One must deny introspective reports (risking ad hoc moves). If emotions persist, Camp Two must deny that avoidance reflects emotion (equally ad hoc).  
  - The **orange room** tests whether evaluation requires judgment: A confirmed emotion would force Camp One to broaden "judgment" (e.g., to non-conscious forms), weakening their stance.  
  - **Neither camp is immovable**, but both can absorb shocks by refining auxiliary assumptions (e.g., Camp One positing "fragmented" judgments). This isn’t a defect—it’s expected for theories tackling messy, layered phenomena like emotion. The dispute is alive because both camps explain aspects of the data, and your cases (especially the drug) could tip the scale.  

  ---  
  *Final note: Dave’s flying case isn’t resolved—but both camps agree the fear is real and more than a feeling. Your bike-shop intuition that "fear is doing something judgment can’t explain" leans perceptualist. If the drug erased all emotion while beliefs stayed, Dave might owe you a beer.*
