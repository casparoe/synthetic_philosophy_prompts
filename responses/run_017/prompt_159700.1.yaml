answer: |-
  *(Adjusts glasses, taps your graph dismissively)*  
  You mistake aggregation for mechanism. Yes, population and energy drift upward *globally* because new polities rise before old ones fully disintegrate—like saplings in a rotting forest. But your "drift and noise" model can't predict *which* polity collapses next or *when*. Ours can. Three measurable variables observable *in real time* within a single polity:

  1.  **The Mercenary Ratio:** The shift from a citizen militia bound by *asabiyyah* (group cohesion) to paid professionals/mercenaries. Track the percentage of frontline combat troops not culturally embedded in the ruling core. Under Augustus, Rome's legions were >90% Italian citizen-soldiers; by Hadrian, significant auxiliary reliance began; by the 3rd century crisis, mercenary Goths and Alamanni were the critical shock troops. We saw it again pre-1979 Iran: the Imperial Guard (largely conscripted Persians) decayed while the regime relied on US-trained, US-paid SAVAK and elite units culturally alienated from the populace. Cohesion collapses *before* military failure. Show me a polity where mercenaries became *dominant* without subsequent fragmentation within ~50 years. Your drift model sees only "professionalization."

  2.  **Elite Consumption vs. Productive Investment:** Quantify the diversion of surplus. Early phase: conquest loot funds infrastructure, colonization, simplified tax systems (think Umayyad *diwan*). Late phase: surplus fuels elite luxury, monumental but non-productive architecture, complex tax *farming* (outsourcing collection for profit). Measure the ratio of palatial/ritual expenditure to canal-digging/road-building/grain-silo budgets in state records. Late Byzantium poured wealth into Hagia Sophia's adornment while neglecting the *themata* (militarized provinces). Pre-revolutionary France's court expenditure versus investment in productive agriculture? Measurable. Drift models see only "wealth accumulation."

  3.  **The Rigidity Coefficient:** Observed in law and administration. Early cohesion allows flexible, customary justice and adaptive, delegated governance (think early Caliphate or Republican Rome). The late phase brings ossification: mountains of written laws attempting to micromanage complexity, coupled with *declining* bureaucratic competence due to patronage over merit. Track the annual volume of new regulations vs. evidence of their enforcement (tax receipts per edict, court backlogs). Soviet *nomenklatura* regulations ballooned while actual economic coordination collapsed. Your model sees "institutional development"; ours sees sclerosis preceding fracture.

  **These variables trend together, predictably, within a lifespan.** Rising mercenary reliance *correlates* with soaring elite consumption and regulatory bloat. Drift + noise can't explain this clustered institutional decay *within* a polity *before* external shock or population pressure overwhelms it. The Khaldunian cycle predicts *when* a polity becomes fragile—visible in its ledgers and muster rolls *decades* before the Visigoths sack Rome or the Taliban roll into Kabul. Show me your linear model that flagged the USSR's brittleness in 1975 based on these metrics. *(Leans forward)* Your graph shows survivors inheriting the ashes. Ours shows *why* they were ashes. Next objection?
