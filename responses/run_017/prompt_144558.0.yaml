prompt: |-
  Hey — I got roped onto the board of the housing co-op I live in about four months ago, and right now we're having what feels like the dumbest possible fight: whether to put up a printed schedule of fines for people who leave the shared workshop and bike room in a mess. I have this nagging feeling that the whole argument is missing something, but I can't put a name on it, which makes it very hard to argue in a meeting.

  Here's the pattern I keep seeing — I've now noticed it three times. Case one, our own bike room: for years it was fine. Not spotless, but people mostly racked their bikes, swept up, and the two or three guys who used it most ran the place quietly — if someone left a bike in the middle of the floor for a week they'd get a friendly-but-not-friendly word. Nobody was ever charged anything. Last year the board put in a twenty-dollar fine for bikes left in the walkway, with a sign and a form to fill out. And now nobody leaves bikes in the walkway, but the room is objectively worse. People do exactly what the sign says and nothing more: tools from the shared bench stay out, nobody sweeps, the pump got stolen and nobody said anything. And the two or three guys who used to enforce things have completely stopped, because saying something now feels like reporting someone to an authority instead of just being a person who minds. Case two: my brother's volunteer trail crew got a sponsor offering a small cash bonus for the crew logging the most trail miles. Miles went up, quality went down, and nobody does the jobs that don't have a number attached anymore. Case three: a neighbourhood tool library near my old place added an app where you check tools in and out. Same shape of thing. The thing is, in every case the people didn't stop caring — if anything they talk about the shared thing more than they used to. What changed is what they do about it, and who is allowed to say something. And the bit that actually worries me: I think this is one-way. If we tear the sign down next year, I don't think the old arrangement comes back, because the people who moved in during the fine era never learned it and the old enforcers got out of the habit.

  So: does this have a name? Not the general 'people game whatever you measure' thing — a friend keeps saying that's Goodhart's law, but as I understand it that's about the number becoming unreliable for the people reading it, whereas what I'm describing is about the act changing meaning for the person doing it, about the informal enforcement dying rather than just being crowded out, and about it being irreversible. Someone else said moral hazard, but nobody's risk exposure is changing what they do here as far as I can tell. I don't want a label I can drop in a board meeting; I want to know whether the three things I'm describing are really one thing or three, what the nearest established concepts are and exactly how my cases differ from each, whether the irreversibility part has its own literature (something about norms needing to be transmitted to newcomers?), and if there's no established concept that fits, I'd like a proposed name with a definition that says what would and wouldn't count as an instance. Please also settle the boundary cases: is it the same phenomenon when the new rule is a reward rather than a fine, is it the same thing when the outcome is better on the measured dimension and worse on every other one, and is it still this phenomenon if the old informal norm was never actually healthy — say it was really just two guys being territorial?
reasoning: |-
  Okay, the user is on the board of a housing co-op dealing with a conflict about implementing fines for messes in shared spaces. They've noticed a pattern where introducing formal rules like fines or incentives backfires, causing the community to deteriorate. They described three cases: their bike room, a volunteer trail crew, and a tool library. Each time, after introducing a formal system, the informal norms broke down, and the overall situation worsened even if the specific measured metric improved. The user feels this is irreversible and wants to understand if there's a name for this phenomenon.

  First, I need to recall relevant concepts. Goodhart's law comes to mind, but the user already mentioned it and thinks it's not a perfect fit. Goodhart's is about metrics becoming unreliable when used as targets, but here the issue is more about social dynamics. The user emphasizes the loss of informal enforcement and the irreversibility. 

  Crowding out theory might be closer. That's when external incentives like money or fines reduce intrinsic motivation. In the bike room, people used to clean up because they cared, but fines made it transactional. Once intrinsic motivation is crowded out, it doesn't come back easily, which aligns with the user's irreversibility point. 

  The user also talks about how the act's meaning changes. Charging a fine turns a friendly reminder into reporting to authority. That shifts responsibility from the community to a formal system, making people less likely to intervene informally. The volunteers stopped because speaking up felt like being a snitch. 

  Then there's the erosion of social norms. Norms rely on mutual enforcement and socialization. New rules disrupt that. Newcomers don't learn the old ways because the formal system replaces informal cues. The old enforcers disengage, so the norm isn't passed down. That's why it's hard to reverse. The user mentioned territorial behavior, but even if the old norm wasn't perfect, replacing it with a rigid rule destroys the existing social fabric without building a better one. 

  Looking at boundary cases: rewards vs. fines. In the trail crew example, a bonus led to neglecting unmeasured tasks. Similar crowding out effect. Whether the outcome improves on the measured dimension but worsens elsewhere is typical. The irreversibility is key here because once norms are lost, they don't easily return. 

  The user needs more than a label; they want to understand the mechanisms and how to argue against the fines in the meeting. They might be looking for academic references or frameworks to present. Ostrom's principles for managing commons could be useful, emphasizing community-driven solutions over top-down rules. 

  Also, considering the co-op's context, the user probably wants to preserve community trust and intrinsic motivation. Suggesting alternatives like shared commitments or rotating responsibilities could help. Highlighting that fines might solve the immediate issue but damage long-term community health is crucial. The irreversible aspect strengthens their argument against implementing such measures. 

  In summary, the core issues are the crowding out of intrinsic motivation, the erosion of social norms, and the irreversibility due to failed norm transmission. Combining these concepts gives a comprehensive explanation for the user's observations.
answer: |-
  This phenomenon absolutely has established names and a rich academic foundation—though it requires synthesizing several concepts to capture its full depth. Your intuition about irreversibility and the shift in meaning is profoundly correct. Here's a breakdown:

  ### Core Concepts & Their Synthesis
  1.  **Motivational Crowding Out (Key Concept):**
      *   **Definition:** When the introduction of extrinsic motivators (fines, rewards, targets) undermines intrinsic motivation (sense of duty, community spirit, personal satisfaction, internalized norms). People stop doing the activity "because it's the right thing" and start doing it "because of the rule/reward," or stop doing *related but unrewarded* things entirely.
      *   **Your Cases:** The fine/reward/app didn't just add a new incentive; it actively *displaced* the existing intrinsic motivation and sense of shared responsibility. Sweeping the floor was part of being a good member; now it's "not my job because it's not fined/enforced/rewarded." The friendly word wasn't "enforcement," it was mutual stewardship; now speaking up feels like being a cop.
      *   **Boundary:** Works for both fines (negative extrinsic) and rewards/bonuses (positive extrinsic). The trail crew bonus is classic crowding out: volunteers shifted from "doing good work" to "logging miles for cash," neglecting unrewarded tasks.

  2.  **Erosion of Informal Social Norms & Sanctions:**
      *   **Definition:** Formal rules replace informal, community-based norms and the mechanisms for enforcing them (gossip, reminders, social approval/disapproval). This devalues informal enforcement ("minding") and shifts responsibility to the formal system.
      *   **Your Cases:** The sign/app/rule signals that *this is now the domain of the authority (the board/sponsor/app)*. The "friendly-but-not-friendly word" becomes "reporting" because the formal rule redefines the act. The old enforcers withdraw because their informal role is delegitimized or made awkward.
      *   **Boundary:** Even if the old norm was imperfect or involved territoriality (your hypothetical), replacing it *formally* often destroys the *entire* ecosystem of informal governance without building a better one, leaving a vacuum filled only by the narrow rule.

  3.  **Norm Transmission Failure & Irreversibility (Your Critical Insight):**
      *   **Definition:** Social norms are transmitted through observation, imitation, and informal social interaction ("how things are done here"). Formal rules disrupt this transmission. Newcomers only learn the formal rule, not the underlying ethic. Old members lose the habit/practice/context for informal enforcement. Reverting the rule doesn't automatically rebuild the norm because the *practice* and *social learning mechanisms* are broken.
      *   **Your Cases:** New members post-fine never experience the "old way"; they only know the transactional rule. Old enforcers "get out of the habit" – the muscle memory for informal stewardship atrophies. This creates path dependence: it's easier to stick with the (inferior) formal system than to rebuild the complex, trust-based informal one.
      *   **Literature:** Draws on **Elinor Ostrom's work on common-pool resource governance** (showing successful communities rely on informal norms, graduated sanctions, and conflict resolution), **sociology of norms** (e.g., Cristina Bicchieri), and **institutional economics** (path dependence, transaction costs of rebuilding trust).

  4.  **Goodhart's Law (Partial Fit, But Not the Whole Story):**
      *   **Definition:** "When a measure becomes a target, it ceases to be a good measure." People optimize for the metric, often at the expense of the underlying goal.
      *   **Your Cases:** Yes, people game the measure (don't block walkway = fine avoided; maximize miles = bonus earned; check tool in/out = compliance). BUT Goodhart primarily focuses on the *distortion of the metric itself* for *evaluators*. Your key insight is about the *transformation of motivation, social relations, and responsibility* for the *participants* and the *destruction of complementary behaviors*. Goodhart explains *why* the measure fails; crowding out and norm erosion explain *how the social system breaks*.

  5.  **Moral Hazard (Not a Good Fit):**
      *   **Definition:** When one party takes on more risk because they know another party bears the cost of that risk.
      *   **Misfit:** Your cases aren't about shifting risk. They're about shifting *motivation, responsibility, and the nature of social interaction*. The "cost" isn't risk-based; it's the loss of intrinsic motivation and community self-regulation.

  ### Proposed Name & Definition: "Formalization-Induced Social Displacement" (FISD)

  *   **Definition:** The process by which implementing formal rules, incentives, or monitoring systems to govern a shared resource or collective action:
      1.  **Crowds out** intrinsic motivation and informal responsibility.
      2.  **Erodes** existing informal social norms and the mechanisms for their enforcement.
      3.  **Shifts** perceived responsibility for the resource from the community to the formal authority/system.
      4.  **Disrupts** the transmission of prosocial norms to newcomers.
      5.  **Creates path dependence**, making reversion to the previous informal system difficult or impossible due to lost habits and knowledge.
      6.  Often leads to **narrow compliance** with the formal rule while **degrading unmeasured aspects** of the shared resource or community health.

  *   **What Counts:**
      *   Involves a shift from informal governance to formal rules/incentives/monitoring.
      *   Demonstrates crowding out of intrinsic motivation/informal responsibility.
      *   Shows degradation of non-targeted aspects of the resource/community.
      *   Involves a loss of informal enforcement capacity.
      *   Demonstrates irreversibility or significant difficulty in rebuilding the old system.
      *   Applies to both punishments (fines) and rewards (bonuses).

  *   **What Doesn't Count:**
      *   Simply adding a rule where *no* informal norm existed before (though it might create similar problems later).
      *   Formalizing a process without displacing intrinsic motivation or norms (e.g., a clear, agreed-upon booking system for the workshop that *supports* existing use patterns).
      *   Situations where the formal system *improves* overall outcomes and community health (though rare and often temporary if crowding out occurs).
      *   Pure Goodhart effects without the social displacement element.

  ### Addressing Your Boundary Cases

  1.  **Reward vs. Fine:** Absolutely the *same phenomenon* (FISD). Both are extrinsic motivators that can crowd out intrinsic motivation and distort behavior around the measured target (trail miles), neglecting the unmeasured whole (trail quality, unrewarded tasks). The shift in responsibility and erosion of informal norms occurs similarly.
  2.  **Better on Measured, Worse Elsewhere:** This is the *classic signature* of FISD (and Goodhart). Narrow success on the metric masks broader systemic failure (clean walkway, filthy bench; high miles, poor quality; checked-in tools, broken community).
  3.  **Unhealthy Old Norm (e.g., Territoriality):** This is *tricky but still FISD applies*. The key is whether the formalization *destroys the capacity for any informal governance*, even flawed, without creating a *better* overall system. Replacing territoriality (an informal, albeit bad, norm) with a rigid fine system likely destroys *all* informal stewardship, leaving only the narrow, formal rule. The outcome might be differently bad, but the *mechanism* of displacement, responsibility shift, and irreversibility remains. It highlights that formalization is a blunt instrument; fixing a bad informal norm requires careful community rebuilding, not just top-down rules.

  ### Why This Matters for Your Board Meeting

  *   **Don't focus on the label.** Focus on explaining the *mechanism*: "This fine might clean the walkway short-term, but experience shows it will likely kill the sense of shared ownership that makes people sweep the floor or speak up about the pump. It turns neighbors into rule-enforcers and rule-breakers. Worse, if we try to reverse it later, that community spirit probably won't come back because new people won't learn it and old habits die."
  *   **Highlight Irreversibility:** This is your strongest practical argument. "This isn't just trying something we can undo. Once we formalize this, we risk permanently damaging how people relate to this space and each other in it."
  *   **Propose Alternatives Rooted in Ostrom's Principles:** Suggest solutions that rebuild/reinforce *informal* capacity:
      *   **Shared Commitment:** Facilitate a workshop discussion to draft a *group commitment* for the space (written collaboratively, signed voluntarily, emphasizing shared responsibility).
      *   **Graduated Response:** Agree on a clear, *informal* escalation path: Friendly reminder by anyone -> More direct reminder/note -> *Then* maybe involving a designated person (not the board!) -> Only as a last resort, a formal process. The key is keeping the first steps *peer-to-peer*.
      *   **Visibility & Communication:** Use a whiteboard for "Kudos & Concerns" in the room itself. Rotate responsibility for a monthly tidy-up (framed as stewardship, not punishment). Hold occasional social events *in* the space to rebuild connection.
      *   **Focus on Identity:** "We are the kind of co-op where people take care of shared things because it's our home." Reinforce this narrative.

  You've identified a profound and well-documented pitfall in community governance. Your cases are perfect illustrations of FISD. Argue against the fine not just as ineffective, but as *actively destructive* to the social fabric you need for a thriving co-op. Good luck!
