answer: |-
  Below is a careful map of the distinction you're exploring, structured to address your cases, your colleague's test, and the conceptual landscape. I'll explicitly note where concepts are settled vs. contested, and where your framing might carry assumptions. Philosophers like Carnap, Quine, Hirsch, Chalmers, Plunkett, and Barker are relevant here.

  ---

  ### **1. Conceptual Space: Semantic, Normative, and Factual Disagreement**
  **Settled Framework** (broad consensus):
  - **Factual Disagreement**: Dispute about non-linguistic states of the world (e.g., "The server temperature is 80°C" vs. "It's 90°C").
  - **Semantic Disagreement**: Dispute about what a term *actually means* in a shared language (e.g., "In our SLO docs, 'downtime' includes latency spikes" vs. "No, it means total unavailability").
  - **Normative Disagreement**: Dispute about what a term *should mean* given shared goals (e.g., "We *should* define 'staging' to require deployment gating").

  **Your Terms**:
  - **Metalinguistic Negotiation** (Barker, Plunkett): A normative disagreement masquerading as semantic/factual. Parties use language to negotiate which standard/definition best serves shared aims (e.g., "Is this still the *same service*?" is really about whether continuity of function or material persistence matters more for our runbooks).
  - **Quantifier Variance** (Hirsch): A *contested* view that ontological disputes (e.g., "Do composite objects exist?") are purely verbal because there's no fact of the matter beyond linguistic conventions. **Caution**: This is highly controversial (Quine, Sider reject it). **You're likely misapplying it**—your cases involve practical stakes, not deep ontology.

  **Abuse Check**: You’re not misusing "metalinguistic negotiation." Avoid "quantifier variance"—it’s a niche, disputed theory irrelevant to your cases.

  ---

  ### **2. Analysis of Your Cases**
  **Case 1: Outage Duration**  
  - **Type**: Purely **semantic disagreement**.  
  - **Why**: Identical factual beliefs, divergent definitions of "downtime." Settled by disambiguating the term.  
  - **Settled**: This is a textbook verbal dispute (Carnap’s *empirically resolvable* via meaning clarification).

  **Case 2: "Same Service?"**  
  - **Type**: **Metalinguistic negotiation**.  
  - **Why**: Everyone agrees on facts (hardware, deployment history). The disagreement is about which *criterion* (persistence of function, material continuity, operational control) best defines "same service" for your purposes (e.g., runbook porting).  
  - **Not Idle**: It tracks practical outcomes (runbooks, regression treatment).  
  - **Verbal?**: Yes, in the sense that no new empirical discovery resolves it. **But** it’s *not "merely verbal"*—it’s normatively substantive.  
  - **Contradiction?**: No. "Verbal" ≠ trivial. Metalinguistic negotiations matter because definitions have consequences.

  **Case 3: Staging Environment**  
  - **Type**: **Hybrid disagreement**.  
  - **Why**:  
    - Factual: How the cluster *is used* (e.g., "Does testing catch failures?").  
    - Normative: What "staging environment" *should* require (e.g., "Must it gate production?").  
  - **Not Cleanly Empirical**: The term’s definition depends on functional goals (failure prevention). Resolving it requires both empirical data *and* agreement on standards.

  ---

  ### **3. Your Colleague’s Downstream-Invariance Test**  
  **The Test**: A dispute is verbal iff, *holding fixed all non-linguistic facts*, the two interpretations don’t affect any decisions/predictions/actions within specified stakes.  

  **Evaluation**:  
  - **Strengths**:  
    - Pragmatic: Directly ties to real-world impact.  
    - Flexible: Handles cases like your #2, where stakes are contextual.  
  - **Relativity**: The test **correctly** makes verbalness stakes-relative.  
    - **Example**: In Case 2, if your deployment policy changes, "same service" may suddenly affect decisions → dispute becomes non-verbal relative to new stakes.  
  - **Non-Arbitrary Stakes?**: No. Stakes must be specified contextually (e.g., "current project" vs. "all future systems"). **Settled**: Pragmatists (Dewey, Carnap) endorse this relativity; absolutists (e.g., Quine) reject it.  
  - **Collapse Risk?**: It **doesn’t collapse** into standard distinctions. It’s a *pragmatic refinement* of Carnap’s "external questions," filtering disputes by practical relevance.  

  **Verdict**: A useful, defensible test for engineering contexts.  

  ---

  ### **4. What is "Verbal"? Three Accounts & Predictions**  
  **Account 1: Property of the Dispute**  
  - Claim: Verbalness is intrinsic to the disagreement (e.g., "all disputes about definitions are verbal").  
  - **Prediction for Case 2**: Always verbal (since it’s about definitions).  
  - **Problem**: Ignores that definitions can have downstream effects.  

  **Account 2: Property of Dispute + Context**  
  - Claim: Verbalness depends on stakes (per your colleague’s test).  
  - **Prediction for Case 2**: Verbal if no current stakes; non-verbal if stakes exist (e.g., runbook porting).  

  **Account 3: Speech Act**  
  - Claim: Saying "that’s verbal" is a move to *dissolve* the dispute by deferring definitional choices.  
  - **Prediction for Case 2**: Calling it "verbal" signals, "We needn’t resolve this *now*."  

  **Which is Best?**  
  - **Settled**: Account 1 is naïve (rejected by most post-1950 philosophy).  
  - **Controversy**: Accounts 2 and 3 are live debates.  
    - Account 2 aligns with Carnap, Chalmers.  
    - Account 3 aligns with Wittgensteinian pragmatists (Brandom).  
  - **Test Case**: Suppose in Case 2, *no* decisions hinge on "same service," but engineers feel it’s profound.  
    - Account 2: Verbal (no stakes).  
    - Account 3: Calling it "verbal" discharges the obligation to engage.  

  **Your Suspicion Confirmed**: The "tidy" distinction *is* wrong. "Verbal" isn’t a binary but a *pragmatic signal* that meaning negotiation isn’t worth the effort *given current stakes*.  

  ---

  ### **Explicit Controversy & Consensus Map**
  | **Concept**               | **Status**          | **Note**                                                                 |
  |---------------------------|---------------------|--------------------------------------------------------------------------|
  | Factual vs. Semantic      | Settled             | Core analytic philosophy.                                                |
  | Metalinguistic Negotiation | Settled framework   | Growing consensus (Barker, Plunkett).                                    |
  | Quantifier Variance       | Highly contested    | Avoid; irrelevant to your cases.                                         |
  | Verbalness as contextual  | Moderate consensus  | Pragmatists (Carnap) > Absolutists (Quine).                              |
  | Downstream-invariance test| Defensible & novel  | Not standard, but consistent with pragmatism.                            |
  | "Verbal" as speech act    | Live debate         | Wittgensteinians vs. formal semanticists.                                |

  **Your Framing**: You’re not smuggling in assumptions, but you’re intuiting a key insight: **many "verbal" disputes are normatively substantive**. This aligns with metalinguistic negotiation theory (settled) and challenges naive "just semantics" dismissals.

  ---

  ### **Practical Advice for Work**
  1. **In Incident Reviews (Case 1)**:  
     - Explicitly define terms *first*. Say: "This seems semantic—let’s define ‘downtime’ to resolve it."  
  2. **In Design Debates (Case 2, 3)**:  
     - Ask: "What hangs on this definition? What would change if we defined it your way?"  
     - If stakes exist, frame it as: "We’re negotiating what ‘same service’ *should* mean for our goals."  
  3. **Use the Test**:  
     - "Is there any decision we’d make differently based on these interpretations? If not, let’s note both views and move on."  

  **Key Insight**: What looks "merely verbal" is often a proxy for **clashing priorities** (e.g., operational continuity vs. audit trails in Case 2). Surface those priorities to resolve disputes faster.
