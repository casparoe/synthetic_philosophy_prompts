answer: |-
  Here are eight questions with follow-ups targeting the authority-transfer view's pressure points:

  1. **When I promise something the promisee truly doesn't care about (they forget, have zero expectation or interest), why would failing to do it wrong *them*, given your view hinges on transferring authority over my conduct to *them*?**  
     *Follow-up: If you say the transfer itself creates the duty regardless of their attitude, doesn't that make the duty strangely disconnected from the specific person who supposedly holds the authority?*

  2. **If I promise to do something I already owe you independently (e.g., repay a debt), does the promise add a distinct, new obligation, or is it redundant?**  
     *Follow-up: If redundant, why isn't the promise normatively inert? If distinct, how do we avoid double-counting the wrongness if I fail?*

  3. **Is this normative power to transfer authority conventional (invented by social practice) or a fundamental feature of our agency?**  
     *Follow-up: If conventional, why should promises bind where the convention doesn't exist? If fundamental, why does its exercise (e.g., requiring acceptance, shaping duties) depend so heavily on contingent social context?*

  4. **When someone makes a deathbed promise to me and I die, do they still have a promissory obligation? Who holds the authority over their conduct then?**  
     *Follow-up: If the obligation dissolves with my death, doesn't that undermine the idea the initial transfer created a persisting normative change? If it persists, in what sense is the authority still held by anyone?*

  5. **If I promise under duress ("Promise me X or I'll hurt you"), have I genuinely exercised my normative power to transfer authority over my future conduct?**  
     *Follow-up: If yes, why does coercion typically void promise obligations despite the apparent transfer? If no, how does coercion block the exercise of this fundamental normative power?*

  6. **Considering my on-call bot: it sends "I'll page within five minutes," people rely on this, and feel wronged when it fails, despite knowing it's non-agential code. Is any promissory obligation present?**  
     *Followup: You might call this mere "assurance" without obligation, but why do people experience a distinct feeling of being *wronged*, similar to a broken promise, if no normative power was exercised? Doesn't this reaction suggest something promissory-like is perceived?*

  7. **Can one transfer authority over conduct that is morally forbidden? For example, if I "promise" to commit murder for you, does that transfer bind me?**  
     *Follow-up: If not, does this imply the normative power is constrained by prior moral facts, undermining its foundational role in creating obligation?*

  8. **Does accepting the promisee's future waiver or release (e.g., "don't worry about that promise") simply retract the transferred authority, or is a separate normative act needed?**  
     *Follow-up: If retraction is automatic upon acceptance, how does this differ from the promisee merely choosing not to enforce an expectation? Doesn't this blur the line with expectation-based views?*

  (Word count: 443)
