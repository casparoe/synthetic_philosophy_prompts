  I need to create eight questions with follow-ups across specific scenarios they've outlined: promises where the promisee doesn't care, promising to do what you already have to do, whether the normative power is invented or inherent, deathbed promises, promises under threat, and an on-call bot scenario from their work. Each question plus follow-up should be under two sentences, and the total response under 450 words.

  For the promisee indifference scenario, I'll challenge whether authority transfer creates obligation when the promisee has no interest. For existing duties, I'll question if promissory obligation adds anything new. On the invented/inherent nature of normative power, I'll explore the tension between conventional origins and universal bindingness. For deathbed promises, I'll probe how obligation persists when the authority holder is gone. Regarding threats, I'll examine if coerced transfers still bind. For the on-call bot, I'll anticipate their "assurance without obligation" response and press why people feel wronged.

  I'll make sure each question cuts to the core tension in their theory and prevents easy deflection. The follow-ups should directly challenge the most predictable responses. For the bot scenario, I'll push on why people experience moral violation despite knowing it's non-agential code.

