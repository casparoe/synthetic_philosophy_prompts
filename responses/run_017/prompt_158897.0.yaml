prompt: |-
  Me and three mates have been going round in circles on this for about a month and I want something that settles it, or at least shows us where we actually disagree rather than where we think we disagree.

  The thing we keep hitting is this. Me and my partner might try for a baby in the next year or so, my sister's doing IVF and has been asked about screening embryos, and one of the group works on a forty-year flood defence plan for the council. In every one of those, whatever we decide changes *which* people end up existing, not just how good their lives are. My mate says that means nobody is made worse off by the bad choice, so nothing is wrong with it. I think that's obviously dodgy but I can't say why without going in a loop.

  So: write me a quiz that sorts someone by what they say about cases, not by which theory they think they like. About ten questions, each one a concrete situation with three or four answers to pick from, then a scoring key at the end that maps patterns of answers onto named positions, with a one-line plain-English gloss of each position and its most awkward consequence. Everyone in my group is happy to answer things like "that's wrong", "that's not wrong", "you can't compare those two", or "that's wrong but not because anyone's worse off" — so make the options that sort of verdict, not names of views. No question should mention a philosopher or ask anyone to identify a theory; if I wanted that I'd just read the wikipedia page.

  Cases I want in there: a teenager who has a baby now when waiting a few years would mean a different, better-off child; a factory that leaks something which both causes a birth defect and, by luck, is also what led to that particular child being conceived at all; two hospital programmes with the same budget where one helps children who already exist and one changes which children get born; a flood defence or energy policy that changes which people are alive in fifty years; picking between embryos; and one where the choice changes how many people there are rather than just who.

  But I also want the questions the usual versions of this never ask, because those are the ones we keep tripping over:

  - Does it matter how *similar* the alternative person would have been? Say the other child would have had the same parents, born the same month, and a life that's 95% the same. Most of us feel that makes a difference and none of us can say why.
  - Which "compared to what" is the right one: what you'd have done instead, or what would have happened if nobody had done anything? Our flood defence argument flips completely depending on this and we only noticed last week.
  - What if you don't know whether your choice changes who exists — say you're about 50/50 on it?
  - Does it matter if the badness is spread really thin across a million people instead of concentrated in one kid?

  The leaves I want named (or marked "unnamed" if it's literally just us): the narrow view where it only counts if it's worse for the very same person; the view that identity doesn't matter at all; the in-between one where identity doesn't matter but how many people there are does; the full add-it-all-up impersonal one; the averaging one; the "those two outcomes just aren't comparable" one; the "it's wrong but not because anyone's worse off, more like it used them" one; and the asymmetric one where you've got a reason not to create a child who'd be miserable but no reason to create one who'd be happy.

  And this is the bit I'm most curious about: build it out of the combinations of answers first, then tell me which combinations nobody actually holds, and for each empty one say whether it's empty because its incoherent, because it's just unattractive, or because nobody's bothered to work it out. Also be straight with me about which pairs of positions your quiz genuinely can't seperate — I'd rather know than get a tidy-looking key that fudges it.

  Keep each question to a short paragraph, don't assume anyone's read any philosophy, and no reading lists, I've got enough of those already. British spellings please.
reasoning: |-
  Okay, the user and their friends have been stuck on ethical dilemmas involving choices that affect who comes into existence—like having babies early vs. late, embryo screening, or long-term policies. They want a quiz to clarify their disagreements without theory jargon. I need to design concrete scenarios with answer options reflecting moral intuitions, then map responses to named positions. 

  First, I'll note their key sticking points: similarity of alternative persons, counterfactual baselines ("compared to what?"), uncertainty about identity effects, and distribution of harm. These must be addressed in the quiz questions. The positions they listed include person-affecting views, impersonal totalism/averaging, incomparability, non-identity objections, and asymmetry. 

  For structure, I'll create 10 scenarios: 
  - Teen pregnancy (different-child case) 
  - Toxic factory (causal overdetermination) 
  - Hospital programmes (same-budget identity vs. non-identity intervention) 
  - Flood defence (long-term population change) 
  - Embryo selection 
  - Variable population size (e.g., family planning) 
  Plus their requested nuances: 
  - Similarity (e.g., same parents/timing) 
  - Counterfactual baseline (active vs. passive comparison) 
  - Uncertainty (50/50 chance of identity effect) 
  - Diffused harm (micro-harms to millions) 

  Answer options will be verdicts like "wrong because someone is worse off" or "can't compare outcomes", avoiding theory names. Each question must be a compact paragraph. 

  Scoring will map answer patterns to positions, flagging: 
  - Coherent but unpopular combos 
  - Logically inconsistent pairings 
  - Positions the quiz can't distinguish (e.g., impersonal totalism vs. averaging if no variable-population case) 

  British spellings throughout, and I'll explicitly note where real-world views diverge from neat categorisation—e.g., when someone endorses asymmetry in one case but not another. The "awkward consequence" summaries will be brutally honest (e.g., "permits harming millions if no specific victim"). 

  Finally, I'll verify that all user-raised dilemmas are covered, particularly the flood defence counterfactual flip and the similarity paradox. The quiz must force concrete choices to reveal hidden disagreements.
answer: |-
  Here’s a 10-question quiz designed to pinpoint disagreements about choices that affect *who* exists, not just how well-off they are. Each question presents a scenario with four answer options reflecting moral verdicts. **British spellings used throughout.**

  ---

  ### **Quiz: Choices and Consequences**
  *Answer each question based on your intuitive moral judgment. Pick the option closest to your view.*

  1.  **Teenage Pregnancy:** A 16-year-old could wait a few years to have a child, when she’d be financially stable and in a supportive relationship. Having a baby *now* means the child will likely face hardship. If she waits, a *different* child would be conceived and born into better circumstances.
      *   A) It’s wrong for her to have the child now, because that child will have a worse life.
      *   B) It’s wrong for her to have the child now, but NOT because the child born now is worse off – it’s about something else (e.g., irresponsibility).
      *   C) It’s *not* wrong in a way that makes the child born now worse off. That child wouldn’t exist if she waited.
      *   D) You can’t compare the outcome "child born now" with "different child born later" morally.

  2.  **The Toxic Factory:** A factory leaks a chemical over years. For one specific child born nearby: the chemical caused a minor but permanent health defect. However, by pure chance, the *exact timing* of the leak (affecting water/air at a precise moment) is also what caused her parents to conceive *her* on that particular night rather than a different child later.
      *   A) The factory harmed *this* child (by causing the defect), so it wronged her.
      *   B) The factory did something wrong, but *not* because it harmed this specific child (she wouldn't exist without the leak). It’s wrong for another reason (e.g., pollution generally).
      *   C) The factory didn’t do anything wrong *to this child*. Without the leak, *she* wouldn’t exist at all, just a different child.
      *   D) The outcomes "this child with defect" and "different healthy child" are too different to compare morally.

  3.  **Hospital Programmes:** A hospital has a fixed budget. It must choose between:
      *   **Programme A:** Treats a severe, life-limiting condition in 100 children who already exist, significantly improving their quality of life.
      *   **Programme B:** Funds genetic screening for couples. This prevents the conception/birth of 100 children who would have had the *same* severe condition, ensuring 100 different, healthy children are born instead.
      *   A) Choose Programme A. It helps children who *actually exist now* and are worse off without it.
      *   B) Choose Programme B. Preventing suffering in future children is just as important, even if they’re different people.
      *   C) They might be equally good choices, or it depends on other factors (not about comparing the children).
      *   D) You can’t morally compare helping existing children vs. changing which children exist.

  4.  **Flood Defence (Active):** A council must build flood defences now for a coastal town. Plan X (cheaper) protects adequately for 30 years but then fails, causing a major flood in 50 years. Plan Y (more expensive) protects fully for 60 years. The flood in 50 years under Plan X would alter travel, work, and social patterns so drastically that nearly *everyone* alive in the town 60 years from now would be a *different set* of people than if Plan Y had been built. Building *nothing* would cause a devastating flood in 10 years.
      *   A) Choosing Plan X is wrong because the people existing in 60 years will suffer a flood they could have avoided.
      *   B) Choosing Plan X is wrong, but *not* because it’s worse for the specific people in 60 years (they wouldn’t exist under Plan Y). It’s wrong for another reason (e.g., recklessness).
      *   C) Choosing Plan X isn’t wrong *because of harm to future people*. Without Plan X, a flood happens sooner, harming different people. The future people under Plan X wouldn't exist otherwise.
      *   D) The outcomes "people existing after Plan X" and "people existing after Plan Y" are too different to compare morally.

  5.  **Flood Defence (Passive):** Same town, same Plans X and Y. But now consider the baseline: If the council does *nothing at all*, a devastating flood happens in 10 years, harming existing and near-future residents. Plan X prevents the 10-year flood but causes the 50-year flood (changing who exists long-term). Plan Y prevents both floods.
      *   A) Choosing Plan X is wrong because it leads to a flood in 50 years that wouldn’t have happened if they did nothing.
      *   B) Choosing Plan X is wrong, but *not* because it’s worse for the long-term people (they wouldn't exist if nothing was done). It’s wrong for another reason.
      *   C) Choosing Plan X isn’t wrong *because of harm to long-term people*. Compared to doing nothing, Plan X *saves* people from the 10-year flood, and the long-term people under Plan X wouldn't exist otherwise. Plan Y is better, but for other reasons.
      *   D) Comparing "Plan X long-term outcome" to "Doing nothing long-term outcome" is meaningless; they involve almost entirely different people.

  6.  **Embryo Selection:** A couple using IVF has several embryos. Genetic screening shows one embryo would develop a condition causing significant pain and disability. Another embryo would be healthy. They can only implant one.
      *   A) It would be wrong to choose the embryo with the condition, because that child would have a worse life.
      *   B) It would be wrong to choose the embryo with the condition, but *not* because it’s worse for *that child* (the alternative is non-existence). It’s wrong for another reason (e.g., creating avoidable suffering).
      *   C) It wouldn’t be wrong *to the child* to choose the embryo with the condition. That specific child wouldn’t exist if they chose the other embryo.
      *   D) You can’t compare the outcome "child with condition exists" with "healthy child exists" morally.

  7.  **Similarity Matters?** Imagine the Teenage Pregnancy case (Q1), but with a twist: If the woman waits, the child she has later would be conceived with the *same* partner, born in the *same* month of the year, grow up in the *same* house and school, share 95% of the same life experiences, but with significantly better financial security and parental maturity.
      *   A) This makes it *more* wrong to have the child now. The alternative child is almost the same but much better off.
      *   B) This doesn’t change much. It’s still wrong to have the child now for the same reasons as Q1.
      *   C) This makes it *less* clearly wrong, or different. The child born now is still unique, and the alternative isn't truly *them*.
      *   D) This highlights why you fundamentally *can't* compare the two outcomes properly.

  8.  **Changing the Number:** A policy decision affects future population size. Option A leads to a smaller population where everyone has very high well-being. Option B leads to a much larger population where everyone has a life just barely worth living (positive, but low).
      *   A) Option A is better. Average well-being is higher.
      *   B) Option B might be better. There’s more total well-being/happiness in the world.
      *   C) Option A is clearly better. Adding people with barely-worthwhile lives doesn't make the world better if it lowers average well-being drastically.
      *   D) These outcomes are too different (different numbers, different lives) to compare meaningfully.

  9.  **Uncertain Identity:** You’re making a choice (e.g., taking a job in a different city, starting medication). You know there’s roughly a 50/50 chance that this choice will change *which* child you conceive next year (if you have one), compared to not making the choice. You also know that if it *does* change who is conceived, that child might have a slightly lower quality of life (e.g., less stable home initially).
      *   A) The risk of creating a worse-off child makes the choice potentially wrong.
      *   B) The choice could be wrong, but *not* because of potentially harming a future child (if the different child exists, they wouldn't exist otherwise). It’s about the risk of causing avoidable lower well-being generally.
      *   C) The identity risk doesn’t make the choice potentially wrong *to a future child*. Any child born wouldn't exist if you chose differently *and* their identity changed.
      *   D) The uncertainty makes any moral comparison even more impossible.

  10. **A Million Tiny Harms:** A government policy will slightly increase background pollution for a million people. This pollution won’t cause identifiable illnesses or deaths, but will very slightly reduce the average happiness/well-being (e.g., minor chronic irritation, slightly less enjoyable outdoor time) for each of the million people over their lifetimes. Crucially, the policy *also* subtly alters social interactions nationwide in a way that means every single one of these million people is a *different* person than who would have existed under the alternative policy.
      *   A) The policy is wrong because it makes these million people worse off.
      *   B) The policy is wrong, but *not* because it’s worse for these specific million (they wouldn’t exist under the alternative). It’s wrong for creating widespread lower well-being.
      *   C) The policy isn’t wrong *to these million people*. Each one would not exist under the alternative policy. The tiny harm is irrelevant to their existence.
      *   D) Creating a world with a million slightly less happy people (who are all different) compared to a world with a million slightly happier people (who are all different) isn’t something we can morally judge as better or worse.

  ---

  ### **Scoring Key & Positions**
  **How it works:** Tally your answers. The positions are defined by *patterns* of answers across the questions. **No single question defines a position.** Positions are listed with their core idea and most awkward consequence.

  *   **Person-Affecting Restriction (Narrow View):**
      *   **Core Idea:** An action can only be wrong if it makes some *specific, identifiable person* worse off than they otherwise would have been. If someone wouldn't exist without the action, they aren't "harmed" by being brought into existence, even with a bad life. Identity *crucially* matters.
      *   **Verdict Pattern:** Mostly **C** in Q1, Q2, Q3, Q4, Q5, Q6, Q9, Q10. Likely **A** in Q7 (if any wrongness), **C** or **A** in Q8.
      *   **Awkward Consequence:** Permits actions that doom future generations to misery (e.g., depleting all resources) as long as it changes who exists, and allows creating children guaranteed terrible lives if they wouldn't otherwise exist. Makes programmes like embryo screening (Q6) or preventing future suffering (Q3B) very hard to justify.

  *   **Asymmetry:**
      *   **Core Idea:** We have strong reasons *not* to bring a miserable person into existence (avoiding harm), but we have no strong reasons *to* bring a happy person into existence (not depriving them of benefit). Identity matters for the harm claim.
      *   **Verdict Pattern:** **B** in Q1, Q2, Q4, Q5, Q6, Q10 (wrong, but not because *that* person is worse off). Possibly **C** in Q3 (prioritise existing children), **C** in Q8 (against adding lives barely worth living). **C** or **B** in Q9. **C** in Q7?.
      *   **Awkward Consequence:** While it forbids creating miserable lives, it provides *no positive reason* to create happy lives or increase population size/happiness (Q8 Option B is unjustifiable). Can struggle to explain why Programme B (Q3) is good.

  *   **Impersonal Totalism:**
      *   **Core Idea:** What matters is the *total amount* of well-being in the world. We should aim to maximise this total. Identity doesn't matter; only the sum of good lives counts. Creating happy people adds value.
      *   **Verdict Pattern:** **B** in Q1, Q2, Q3, Q4, Q5, Q6, Q9, Q10 (wrong if total well-being is lower, regardless of identity). **B** in Q8 (prefer larger population with more total well-being). **A** in Q7 (similarity irrelevant to total sum).
      *   **Awkward Consequence:** Leads to the "Repugnant Conclusion" (Q8): a vast population with lives barely worth living is better than a small, blissful population, if the *total* happiness is higher.

  *   **Impersonal Averagism:**
      *   **Core Idea:** What matters is the *average level* of well-being in the world. We should aim to maximise the average. Identity doesn't matter. Creating happy people only adds value if they raise the average.
      *   **Verdict Pattern:** **B** in Q1, Q2, Q3, Q4, Q5, Q6, Q9, Q10 (wrong if average well-being is lower). **A** in Q8 (prefer smaller population with higher average). **A** in Q7 (similarity irrelevant to average).
      *   **Awkward Consequence:** May require preventing the existence of people with below-average lives, even if those lives are good, to maximise the average. Could justify eliminating happy people if they lower the average.

  *   **Non-Identity Doesn't Block (Impersonal Harm Focus):**
      *   **Core Idea:** The Non-Identity Problem (that no specific person is worse off) doesn't mean the action isn't wrong. It's wrong because it creates a state of affairs with *more suffering* or *less well-being overall* than the alternative, even if different people exist. Identity is irrelevant to the badness.
      *   **Verdict Pattern:** **B** in Q1, Q2, Q3, Q4, Q5, Q6, Q9, Q10 (wrong, but not because *that specific person* is harmed; it's the impersonal badness). Likely **A** in Q7, **A** or **B** in Q8. Distinct from Totalism/Averagism mainly in Q8.
      *   **Awkward Consequence:** Must accept that creating a miserable person is bad *even though* that person has no complaint (they wouldn't exist otherwise). Needs to explain *why* creating suffering is bad if no one is harmed in the comparative sense.

  *   **Incomparability:**
      *   **Core Idea:** Outcomes involving different sets of people are fundamentally incomparable morally. We cannot say one is better or worse than the other. Identity makes the difference.
      *   **Verdict Pattern:** Mostly **D** across Q1, Q2, Q3, Q4, Q5, Q6, Q7, Q8, Q9, Q10. Possibly **C** in Q3 or Q9 where uncertainty/complexity reinforces the view.
      *   **Awkward Consequence:** Paralyzes long-term planning and policies affecting future generations (Q4, Q5, Q8, Q10), and decisions like embryo selection (Q6) or teenage pregnancy (Q1) – no clear basis for choice between the options.

  *   **Weak Person-Affecting / Context Matters:**
      *   **Core Idea:** Identity *usually* matters, breaking strict person-affecting harm claims. However, we still have strong reasons to avoid creating suffering or choose better lives, especially when the alternative person is very similar (Q7) or when the harm is severe. The baseline (active vs. passive) might matter (Q4 vs Q5). Uncertainty (Q9) complicates things. Diffused harm (Q10) feels less significant.
      *   **Verdict Pattern:** **Mixed/Messy**. Likely **A** in Q1, Q6, Q7. **B** in Q2, Q3, Q4, Q5, Q10? **C** in Q9? **A** or **C** in Q8. Shows internal tension – identity matters sometimes but not always, severity and similarity modify judgments.
      *   **Awkward Consequence:** Lacks a clear, consistent principle. Risks being ad hoc or intuitive, making it hard to resolve new cases or disagreements. Might struggle to justify Q3B over Q3A.

  ---

  ### **Empty Combinations & Indistinguishability**
  *   **Coherent but Unattractive (Probably Empty):** Strongly **C** (No Harm) *plus* **A** in Q8 (Prefer Small Blissful Population). This suggests creating miserable lives isn't wrong *and* adding happy lives isn't good. It's coherent (a kind of extreme Person-Affecting + Anti-Natalist mix) but deeply unattractive as it offers no reason to improve the future.
  *   **Incoherent Combinations:**
      *   **A** in Q1/Q6 (Harm to specific child) *plus* **C** in Q1/Q6 (No Harm to specific child). Direct contradiction.
      *   **D** (Incomparable) *plus* strong **A** or **B** verdicts elsewhere. If outcomes are truly incomparable, you can't consistently call one choice "wrong".
      *   **B** in Q8 (Prefer Large Population) *plus* **C** in Q8 (Prefer Small Population). Contradiction.
  *   **Indistinguishable Pairs (Quiz Limitation):**
      *   **Impersonal Totalism vs. Non-Identity Doesn't Block:** They often give the same **B** answers. Q8 is the main differentiator (Totalism=B, Non-Identity Doesn't Block might be A or C). If someone avoids Q8, they look identical.
      *   **Asymmetry vs. Non-Identity Doesn't Block (in some cases):** Both say **B** in many "bad creation" cases. Asymmetry will likely say **C** in Q3 (prioritise existing) and Q8 (no reason to add lives), while Non-Identity Doesn't Block might say **B** in Q3 and **A** or **B** in Q8.
      *   **Weak Person-Affecting vs. Others:** Its mixed pattern can overlap with the edges of Person-Affecting, Asymmetry, or Non-Identity Doesn't Block, especially in Q7 (Similarity) and Q10 (Diffused Harm). It's defined by its inconsistency across scenarios.

  This quiz forces concrete judgments on tricky cases, revealing where your group's intuitions clash *before* attaching theory names. The scoring highlights the tensions within and between positions. Good luck settling the argument!
