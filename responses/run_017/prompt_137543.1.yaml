prompt: |-
  Hey — I work in a materials testing lab (mostly brittle fracture and fatigue), and an argument in our group chat has turned into a mild obsession, so I'm hoping you can tell me whether there's an established concept for what I keep running into.

  It started with a specific alloy. The question was whether it's *really* brittle at room temperature. Put a load on it and a crack does start — and then the crack stops: the plastic zone at the tip blunts, local stress drops, and it arrests after a millimetre or two. The sample is still brittle in the ordinary sense (load a different region, or re-machine and load again, and it cracks again), but no single test ever gives you the full thing: the fracture begins and is then undone by its own beginning. Same shape in a case my brother-in-law, who's a chemist, keeps bringing up: a catalyst that is genuinely disposed to speed up a reaction, does visibly start working, and then gets poisoned by its own product binding to the active sites — catalyst undamaged, disposition fully intact, nothing external blocking it, the process just shuts itself off part-way. And then there's fatigue, which is maybe a third thing or maybe the same thing from a different angle: a coupon that survives any single load you care to apply, but develops a crack over a hundred thousand cycles — is that one disposition whose manifestation is spread over many applications of the stimulus, or a hundred thousand different dispositions?

  I've since read around a bit and found the cases people always wheel out — the sorcerer who would make the glass stop being fragile at the very instant it was struck, and the glass packed in padding so that it's fragile and yet never breaks. Neither is mine, or so I want to say: in the first, the disposition itself goes away; in the second, nothing happens at all. In mine the disposition survives, something definitely happens, and it's the happening that stops it. It's also not the fool's-gold situation, where something produces the characteristic behaviour without having the disposition at all — my stuff really has it, it just can't finish. Please don't just hand me a label; I want the carving: what exactly this is, why it isn't the two famous cases (or why it secretly is one of them), and where its edges are — e.g. does it matter that the stopping factor is internal rather than external, and what happens to it when the arrest occurs so early that nothing detectable occurs at all?

  Could you format the answer with these sections: "Nearest misses" (about 200 words — the closest established ideas and why each fits or doesn't), "The phenomenon itself" (about 250 words — what's actually going on, and whether the all-or-nothing/instantaneous assumption in the standard cases is doing hidden work), "A name and a definition" (about 120 words — your term plus necessary-and-sufficient-ish conditions), "Boundary cases" (about 200 words — the early-arrest case, the fatigue case, and one more you invent), and "Bottom line" (about 60 words, plain English).
reasoning: |-
  Okay, let me tackle this materials scientist's query. They're describing a fascinating phenomenon where a material's brittle fracture initiates but then arrests due to its own plastic zone blunting the crack - and they've noticed similar "self-aborting" behaviors in catalysis and fatigue. The core puzzle seems to be about dispositions that genuine yet self-limiting.

  First, I need to distinguish this from the classic philosophical examples they mentioned. The sorcerer case involves disposition loss, while padding is external prevention. Their cases are different - the disposition persists, the trigger occurs, but the process stops internally. 

  For "Nearest Misses", I consider:
  - Threshold dispositions (close but usually binary)
  - Autocatalytic processes (wrong direction)
  - Self-defeating mechanisms (broad but captures internality)

  The phenomenon itself challenges the all-or-nothing assumption in disposition theory. Their alloy shows the brittle disposition is real but non-monotonic - the very fracture process creates conditions that arrest it. 

  I land on "Autophagic Disposition" for the name - emphasizing self-consumption. Key elements: genuine disposition, manifestation initiation, internal arrest mechanism, disposition persistence.

  Boundary cases to test:
  - Extreme early arrest (disposition still there but undetectable)
  - Fatigue (cumulative manifestation across cycles)
  - Invented case: political reform triggering backlash

  The bottom line should emphasize this as a real but self-limiting causal power that expands how we think about dispositions in materials science and beyond.
answer: |-
  ### Nearest Misses
  *   **Threshold Dispositions** (e.g., "fragile *if struck hard enough*"): Close, as they acknowledge a critical stimulus level. However, your phenomenon isn't about an *insufficient initial stimulus*. The crack *starts* under the applied load (meeting the threshold), but its *own progression* alters the local conditions, creating a new, *internal* barrier to continuation. The initial stimulus *was* sufficient for initiation.
  *   **Finkish Dispositions** (Sorcerer): A fink removes the disposition *precisely when the stimulus is applied*. In your case, the disposition (e.g., brittleness) *persists* throughout; the crack initiates *because* of it. The arrest isn't due to disposition loss but due to the *consequence* of its manifestation (plastic zone formation).
  *   **Masks** (Padded Glass): A mask *prevents the stimulus from reaching* the object (padding absorbs the blow). In your case, the stimulus *reaches* the object and *triggers* the disposition (crack starts). The arrest arises *after* initiation from *internal changes* caused by the manifestation itself, not external blockage.
  *   **Autocatalysis/Poisoning (Chemistry)**: While the catalyst poisoning is *one example* you gave, autocatalysis generally describes *self-acceleration*. Your core phenomenon is about *self-arrest* or *self-limitation* following initial manifestation, which is distinct (though poisoning is a specific chemical instance of self-arrest).

  ### The Phenomenon Itself
  The core issue is the implicit assumption in standard dispositional analysis (like fragility) that manifestation is instantaneous and all-or-nothing upon sufficient stimulus. Your examples reveal a **temporal gap and causal feedback loop** between dispositional triggering and full manifestation. The disposition (brittleness, catalytic activity, susceptibility to fatigue damage) is genuine and triggered. Its initial manifestation (crack nucleation, reaction initiation, microplasticity/microcrack formation) *alters the local state of the system* in a way that *creates a new condition inhibiting further manifestation* (plastic zone blunts stress, product poisons site, crack tip work-hardening), even while the underlying disposition remains intact. This "**manifestation feedback**" – where the early stage of the disposition's effect generates the cause of its own arrest – is the key. The disposition isn't lost or masked; its attempted full expression creates an internal barrier preventing that full expression. It highlights that dispositions can have complex, non-monotonic causal pathways.

  ### A Name and a Definition
  **Term:** **Autophagic Disposition** (from Greek *auto-* "self" + *-phagos* "eating")
  **Definition:** A genuine disposition \(D\) of an object \(O\) to exhibit behavior \(B\) in response to stimulus \(S\), where:
  1.  \(S\) occurs and successfully triggers the *initiation* of \(B\).
  2.  The *initial stages* of \(B\) cause an *internal change* within \(O\) (or its immediate local environment).
  3.  This internal change *directly inhibits the continuation or completion* of \(B\).
  4.  \(D\) *persists* in \(O\) despite the arrest of \(B\). The arrest is a *consequence* of \(B\)'s initiation, not the removal of \(D\) or external prevention of \(S\).

  ### Boundary Cases
  *   **Extreme Early Arrest (Undetectable Manifestation):** If the crack arrests after propagating only a few atomic layers (or the catalyst poisons after a single turnover), is \(B\) "manifested"? Crucially, the disposition \(D\) *was* triggered - initiation occurred. If we accept initiation as the minimal manifestation, it fits: the *minimal*\(B\) caused the internal change arresting further \(B\). The *detectability* of \(B\) is epistemic, not essential to the definition. \(D\) is still present and could manifest \(B\) (minimally) again elsewhere.
  *   **Fatigue:** This is a strong fit. \(D\) is susceptibility to fatigue damage. A single cycle (\(S\)) triggers micro-manifestations \(B\) (local plasticity, microcracking) too small to cause failure. These micro-manifestations *internally* alter the material (work hardening, creating microcrack nuclei, residual stresses). Crucially, this internal state *inhibits immediate catastrophic failure* (arrests the microcrack) but *enables* further micro-damage accumulation under subsequent cycles. \(B\) (damage) progresses cumulatively *because* each micro-manifestation arrests but leaves the material *more susceptible* to the *next* micro-manifestation. The full fracture is the eventual culmination of many self-arrested micro-events.
  *   **Invented Case (Political Reform):** A government genuinely disposed (\(D\)) to enact democratic reforms (\(B\)) in response to public pressure (\(S\)). It initiates reforms (starts \(B\)). However, the initial reforms empower factions who use the new openness to mobilize and violently oppose *further* reforms (internal change caused by \(B\) inhibits continuation of \(B\)). The government's underlying disposition for reform (\(D\)) persists, but the specific reform process is arrested by its own initial success.

  ### Bottom Line
  You've identified **autophagic dispositions**: genuine causal powers whose initial activation internally generates the conditions for their own arrest, preventing full manifestation while leaving the underlying disposition intact. It's distinct from finks, masks, or thresholds, arising from feedback within the manifestation process itself. Fatigue is a cumulative form of this, where micro-arrests enable macro-failure over time.
