prompt: |-
  I teach an upper-level seminar in the philosophy department on ethics and narrative, and for the past few years I have opened it with a genre rather than an argument: pairs of lives written to be imitated. The canonical examples are Plutarch's Parallel Lives and the Christian saint's life, but I also assign one modern descendant of the same impulse — the admiring life-of-a-great-leader of the kind still handed out in leadership programs — partly because analytic moral philosophy has lately revived exemplar-based accounts of virtue, and I want to know what the older practice was actually committed to before I decide what to make of the revival. What interests me is not whether the genre is respectable but what it must assume in order to work, and it seems to me to run on conventions that are not the conventions of history writing. First, selection obeys what I have been calling the revelatory-priority rule: the biographer prefers the small unguarded moment — a jest, a remark at dinner, how someone received bad news — to the battle or the statute, on the grounds that the latter may be the work of fortune or of subordinates while the former shows the agent; Plutarch more or less says as much in distinguishing the writing of lives from the writing of histories. Second, there is a closure rule: judgment on a life is suspended until the life is complete, the thought Herodotus attributes to Solon about calling no one happy before the end, and it is why a death is treated as evidence rather than as an appendix. Third, there is what I call the typology rule, clearest in hagiography and in confessional autobiography: the childhood is narrated as a figure of the whole, and the subject's faults are retained but redescribed as the material of a turning, so that nothing in the life is permitted to remain merely unassimilated. Fourth, there is a license that would be flagrant anywhere else: where the record is silent, the writer supplies what such a person in such circumstances would have said or done — a convention ancient historiography avowed openly, that hagiography inherited, and that survives in the composite scenes and invented dialogue of the contemporary biopic. And fifth, the pairs invite ranking: the two lives are followed by an explicit comparison and a verdict about which was better.

  Two features of this puzzle me. The revelatory-priority rule and the closure rule seem to pull in opposite directions: if a single jest discloses character, why should the end of the life be evidentially required? My own tentative answer is that they answer different questions — the jest shows who someone is, the ending settles whether that character held — but I cannot tell whether that reconciliation costs me a substantive commitment to the stability of character across a life, or whether it is equally available to someone who thinks conduct is highly situation-dependent. The license bothers me more. The stated point is to learn from a real person, and yet the genre treats the documented record as something to be completed rather than merely reported. So I have been contrasting what I call the documentary constraint (the narrated incidents must have occurred) with the legibility constraint (they must be the sort of thing this agent could have done), and I suspect the educational aim is satisfied by the second and not by the first — which would mean that the modern exhaustively footnoted definitive biography is not a more honest version of the same enterprise but a different enterprise that has quietly abandoned the aim. A colleague in the history department, who regards the whole genre as a confidence trick, says the license simply proves the aim was never truth-tracking; that strikes me as too fast, but I do not have a better formulation. I also give my students a test case: a woman whose life the genre could render beautifully and who then dies at thirty-two in an accident that reveals nothing whatever about her. Under the closure rule her life seems to lose something. Should it? If it does, the genre is committed to a view of lives as possessing narrative shape that I take to be far from obvious.

  So I would like you to reconstruct the implicit theory: what view of character, of moral knowledge, and of truth in narrative does this practice require, and which rival views does it quietly rule out? I want the strict presuppositions separated from the merely congenial ones, and I want to know whether the five conventions genuinely hang together or only look as though they do because we inherited them as a package; where several theories would license the same convention, say so rather than settling it, and where you think the genre is cheating, say that as well. Please commit to a verdict on the two questions I cannot answer myself — whether the editorial license is internal to the educational aim or a corruption of it, and whether the genre requires lives to have a narrative closure they may not in fact have — and give your reasons. Mark which of your claims you hold with real confidence and which are readings a reasonable person could reject; I am less interested in a survey of positions than in a reconstruction I can argue with. I am not asking for a bibliography, and I would rather you reasoned from the practice as I have described it than reached for sources.
reasoning: |-
  Okay, the user teaches an upper-level philosophy seminar on ethics and narrative. They've identified five conventions in biographical genres like Plutarch's Parallel Lives and saint hagiographies: revelatory-priority, closure, typology, license, and ranking. Their core questions are about the implicit theory behind these conventions - particularly regarding character stability, the legitimacy of invented details, and narrative closure.

  Hmm, this is a sophisticated request that digs into the philosophical foundations of exemplar-based ethics. The user seems to be wrestling with whether these conventions form a coherent system or just happen to be historically bundled together. Their frustration with the "license" convention (inventing details) is palpable - they're clearly troubled by the tension between truth-tracking and pedagogical effectiveness.

  Let me approach this systematically. First, the revelatory-priority and closure rules: the user's tentative solution about them answering different questions (character vs. endurance) seems sound. But is this compatible with situationist psychology? I think the genre actually requires strong character realism - not necessarily complete fixity, but enough stability for those "small moments" to be diagnostic. The closure rule then tests whether that character withstood life's pressures. A situationist couldn't consistently use this genre for moral education.

  The license issue is thornier. The user's documentary vs. legibility distinction is sharp. The genre clearly prioritizes legibility - the "composite scenes" serve the pedagogical aim by creating a coherent moral prototype. But does this corrupt truth-tracking? Only if we assume biography must be archival. The genre operates on a different epistemology: moral truth emerges from plausible patterns, not atomized facts. That accident victim test case is brilliant - it exposes how the closure rule demands meaning even when death is random.

  On narrative closure: yes, the genre presupposes lives have teleological shape. That woman's accidental death isn't "unrevealing" - it becomes the ultimate test of whether her prior character was truly stable (as per closure rule). The genre can't handle truly chaotic lives because its educational purpose requires extractable lessons.

  What's striking is how all five conventions interlock: revelatory moments build the character portrait; typology ensures developmental coherence; license fills gaps to maintain legibility; closure provides final evaluation; ranking abstracts general virtues. Remove one, and the pedagogical mechanism fails. The historian colleague misses this functional unity by judging it as failed historiography rather than successful moral equipment.

  For the user's classroom: the real tension isn't between conventions but between this moral exemplar model and modern empirical psychology. The genre works precisely because it isn't psychology - it's normative typification. That's why footnoted biographies feel different; they're artifacts of historicism, not ethical tools. The user might push students to ask: can we salvage exemplar ethics without these fictionalizing conventions? Or is moral learning inherently narrative-dependent?
answer: |-
  Based on your analysis of the genre's conventions and its pedagogical aim, here's a reconstruction of its implicit philosophical commitments, distinguishing core presuppositions from congenial (but not strictly necessary) elements. I'll address your unresolved questions directly, marking confidence levels.

  ### Core Presuppositions (Strictly Required for the Genre to Function)
  1.  **Character Realism & Discernibility:**
      *   **View:** Moral character is a real, relatively stable, internal disposition or "essence" that causally influences actions across diverse situations. This character *can* be reliably discerned by an observer (the biographer) through patterns of behavior, especially in small, "unguarded" moments.
      *   **Rivals Ruled Out:** Strict situationism (character is largely an illusion; behavior is overwhelmingly determined by situational cues). Radical skepticism about knowing others' inner states. Views where character is so fragmented or fluid that no stable "who" exists to be revealed.
      *   **Confidence:** High. This is the bedrock of the revelatory-priority rule. Without it, the small moments lose their claimed evidential weight.

  2.  **Character as the Primary Locus of Moral Evaluation:**
      *   **View:** The ultimate moral worth of an individual lies primarily in their enduring character/virtues/vices, not merely in the sum of their actions, the consequences of those actions, or adherence to abstract rules. Actions are significant primarily as *expressions* or *tests* of character.
      *   **Rivals Ruled Out:** Pure consequentialism (only outcomes matter). Pure deontology (only adherence to rules matters). Views that downplay individual agency or see "character" as epiphenomenal.
      *   **Confidence:** High. The entire project of learning from exemplars hinges on this. The closure rule confirms it – the final judgment is on the *life* (i.e., the enduring character manifested across it).

  3.  **Narrative as the Essential Form of Moral Knowledge Transmission:**
      *   **View:** Understanding virtue and vice, and learning how to live well, requires concrete examples presented in a holistic, temporal, causally connected narrative form. Abstract principles or atomized actions are insufficient. Narrative provides the context, motivation, struggle, and consequence necessary for genuine moral comprehension and imitation.
      *   **Rivals Ruled Out:** Purely propositional or rule-based ethics as sufficient for moral education. Strictly analytic, non-narrative approaches to understanding moral concepts. Views that see narrative as merely illustrative, not constitutive, of moral knowledge.
      *   **Confidence:** High. The genre *is* narrative. Its power derives from this form.

  4.  **Legibility as a Moral-Epistemic Imperative:**
      *   **View:** For the life to serve its pedagogical purpose, it *must* be coherent, meaningful, and instructive. Ambiguity, unresolved contradictions, or purely contingent events that resist moral interpretation undermine the genre's core aim. The "truth" sought is not merely archival accuracy, but a *meaningful truth* about character and its possibilities/flaws.
      *   **Rivals Ruled Out:** Historiography prioritizing exhaustive, unvarnished facticity regardless of coherence or meaning. Moral skepticism that denies lives have inherent meaning or lessons. Views that see radical contingency or absurdity as the fundamental human condition.
      *   **Confidence:** High. The typology rule and license directly serve this imperative.

  ### Congenial but Not Strictly Necessary Presuppositions
  1.  **Teleology of the Self:** While the genre strongly *favors* a view where lives have inherent direction or purpose (making the closure rule feel natural), a weaker view of character coherence *could* suffice. The genre doesn't strictly require a cosmic or divine teleology, only that a life *can be rendered* as having a meaningful shape relative to character development.
  2.  **Strong Character Fixity:** The genre *works best* if character is highly stable (easing revelation and closure), but a view allowing for significant, yet *patterned* or *redemptive*, change is compatible (as seen in the typology rule turning faults into "material for turning"). The core requirement is discernible *consistency enough* for judgment and imitation, not absolute immutability.
  3.  **Objective Moral Hierarchy:** The ranking rule *assumes* virtues/vices can be compared and weighed across lives to declare one "better." However, the genre could function pedagogically without explicit pairwise ranking, focusing solely on individual exemplarity. Ranking strengthens comparative judgment but isn't *absolutely* core to the imitation aim.

  ### Reconciling Revelatory-Priority and Closure
  *   Your tentative answer is fundamentally correct and aligns with the core presuppositions.
  *   **The Jest (Revelatory-Priority):** Reveals "who" the agent *is* at that moment – their characteristic virtues/vices, temperament, priorities. It provides a *diagnostic snapshot* of their underlying character.
  *   **The Closure (Ending):** Answers "did that character *endure* and *define* the life?" It tests the *stability*, *resilience*, and *ultimate expression* of the character revealed in moments like the jest. Did the virtue hold under ultimate pressure (e.g., death, defeat, temptation)? Did the vice finally corrupt or destroy?
  *   **Cost:** This reconciliation **does** require a substantive, though not absolute, commitment to **character stability across a life** (Core Presupposition 1). A strict situationist couldn't consistently use this genre for moral education. The revelatory moment only has predictive/explanatory power if character has cross-situational consistency. The closure verdict only makes sense if the ending is seen as the culmination of *that same character* tested over time. A situationist could *describe* the jest and the death, but couldn't plausibly claim the jest revealed the *character* that *explained* the life's trajectory or justified the closure judgment.

  ### The License: Internal to the Aim or Corruption?
  *   **Verdict: The license is largely internal to the educational aim**, but operates at the boundary and risks corruption if unchecked.
  *   **Reasons:**
      1.  **Serving Legibility:** The license directly serves the Legibility Constraint (Core Presupposition 4). Gaps in the documentary record create ambiguity and threaten coherence. Supplying what "such a person *would* have done/said" maintains the narrative's legibility *as a portrait of character*.
      2.  **Character Over Event:** The genre prioritizes revealing character (Core Presupposition 2). If an undocumented action or utterance is deemed *essential* to fully revealing the character *as understood by the biographer*, and fits the established pattern (Legibility Constraint), inventing it serves the core pedagogical purpose better than leaving a gap. It completes the *moral portrait*.
      3.  **Truth-Tracking Character, Not Events:** Your historian colleague's charge ("never truth-tracking") assumes the *only* truth worth tracking is the precise historical event. The genre presupposes a different kind of truth: the truth *about the subject's character and its moral significance*. The license aims to make *that character* more vividly and completely "true" (i.e., legible, coherent) for the reader. It tracks a *moral* truth embodied in the exemplar.
      4.  **The Corruption Risk:** The license *becomes* a corruption when it invents incidents *contrary* to the documented character or purely for dramatic/hagiographic effect unrelated to the core moral portrait, violating the Legibility Constraint. It's also corrupt if presented *as* documented fact when it's not (though ancient writers often were more transparent about this practice than modern sensibilities prefer).
  *   **Modern Biography:** You are correct. The exhaustively footnoted biography prioritizes the Documentary Constraint and is indeed a different enterprise, often closer to historiography. It has largely *abandoned* the explicit, character-focused pedagogical aim of the older genre in favor of historical reconstruction and interpretation, often skeptical of character coherence itself. It doesn't "corrupt" the older aim; it pursues a different one.
  *   **Confidence:** High on the license being internal to the aim *as defined by the genre's conventions and purpose*. Medium-High on the distinction from modern biography.

  ### Narrative Closure: A Requirement and Its Cost
  *   **Verdict: Yes, the genre absolutely requires lives to have a narrative closure they may not in fact have.** Your test case exposes this inherent tension.
  *   **Reasons:**
      1.  **The Closure Rule Demands It:** Judgment *requires* an ending. The ending *must* serve as evidence for the final verdict on the life/character. A random, "unrevealing" death violates this rule's function.
      2.  **Legibility Imperative Demands It:** A life cut short randomly, without culmination or a test revealing the enduring character, is inherently *illegible* within this framework (Core Presupposition 4). It resists the moral interpretation and assimilation demanded by the typology rule. The accident feels like an interruption, not a conclusion.
      3.  **Pedagogical Function Demands It:** How can one imitate or learn from an unfinished story? The closure provides the final, definitive data point confirming (or refuting) the character revealed earlier and showing its ultimate consequences or steadfastness. Without closure, the lesson feels incomplete or uncertain.
  *   **The Cost:** The genre **is committed** to a strong view of lives possessing a narrative shape defined by the development, testing, and culmination of character. It **rules out** the possibility that a life's meaning could be radically contingent, fragmented, or inherently incomplete in a way that resists coherent moral summation. It **cannot** comfortably accommodate the woman dying randomly at 32 without *forcing* her death to reveal something (e.g., the fragility of life, the tragedy of potential unfulfilled – which still makes it "revealing," albeit differently) or seeing her prior 32 years *as* the complete expression of her character, judged on that alone (which strains the closure rule's link to the *end*).
  *   **Confidence:** High. The test case powerfully demonstrates the genre's limitation and its deep commitment to narrative unity and closure as essential for its moral purpose.

  ### Do the Conventions Hang Together?
  *   **Verdict: Yes, they form a remarkably coherent system driven by the core presuppositions.**
  *   **How they cohere:**
      *   **Revelatory-Priority** provides the *data points* (character snapshots).
      *   **Typology** ensures *developmental coherence* from the start and assimilates faults.
      *   **License** *maintains legibility* by filling gaps to ensure the character portrait is complete and continuous.
      *   **Closure** provides the *final, definitive test and summation* of the character built and maintained by the other rules.
      *   **Ranking** (while slightly less core) *abstracts the lessons* into comparative virtues, moving from concrete narrative to general moral knowledge for imitation.
  *   **The Driver:** The **Legibility Imperative** (Core Presupposition 4) in service of **Character-Based Moral Pedagogy** (Core Presuppositions 1, 2, 3) is the engine. Every convention serves to make the *moral character* of the exemplar clear, coherent, complete, and instructive. They are inherited as a package *because* they functionally interlock to achieve this specific aim. Remove one (e.g., abandon closure or license), and the system falters in delivering its promised moral knowledge.

  **Conclusion:** The implicit theory is a robust form of **character realism** where **narrative is the privileged mode** for discerning, displaying, and transmitting moral knowledge about virtues and vices embodied in exemplars. This requires **legibility** achieved through conventions that shape the raw material of a life into a coherent, closed, instructive story of character formation and testing. It quietly rules out situationism, radical contingency, purely archival historiography, and ethics based solely on abstract rules or consequences. While the license risks corruption, it stems from the core need for legible character portraits. The closure rule is non-negotiable but imposes a significant metaphysical commitment about the narrative shape of lives. This genre isn't "cheating" on its own terms; it operates by a distinct set of rules prioritizing moral truth-as-legibility over historical truth-as-facticity. Its power and its limitations arise from the same source.
