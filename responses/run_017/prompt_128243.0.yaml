  We are creating a quiz to help a church discussion group identify their views on divine foreknowledge. The quiz should avoid abstract questions and instead present concrete cases. The main positions we want to sort into are:
  - Middle Knowledge (Molinism): God knows what any creature would freely do in any possible circumstance, and this knowledge is prior to the divine decree.
  - Thomist view (also called "Bañezian"): God's knowledge of what creatures would do comes after and because of the divine decree. God's knowledge of counterfactuals is dependent on His decree.
  - Open Theism: God does not know future free choices, and there are no truths about what creatures would freely do in non-actual circumstances (or at least God doesn't know them).
  - Simple Foreknowledge without Middle Knowledge: God knows the future, including what will happen, but does not necessarily know what would have happened in non-actual circumstances (or if He does, it's not via middle knowledge). However, note that some simple foreknowledge views might hold that God knows counterfactuals by knowing the actual future and then deducing what would have been, but that might not cover all counterfactuals. Alternatively, we might have a view that holds there are brute counterfactual truths that God knows by His natural knowledge (so similar to Molinism but without the logical priority to the decree). We'll have to be careful.
  - The "God's knowledge just isn't foreknowledge at all" view: This might be a view that denies that God is in time, so His knowledge is eternal and not "fore" in a temporal sense. But note that the Thomist view is also typically atemporal. Alternatively, this might be a view that denies there are any truths about future free actions at all (like open theism) but without the temporal aspect? We'll have to clarify.

