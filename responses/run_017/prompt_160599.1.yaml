prompt: |-
  A friend of mine (formal models of agency, reads way more AI-safety blogs than philosophy) has an argument that the orthogonality thesis collapses once you take instrumental convergence seriously, and I think it proves much more than even he wants.

  (1) Orthogonality: capability and final goal are independent — for any capability level c and any final goal G, an agent with c and G is possible, and learning how capable an agent is tells you nothing about what it finally wants.

  (2) Instrumental convergence: there is a short list K of aims — staying in existence, acquiring resources and compute, preventing unwanted modification of your own goals — that a sufficiently capable agent will pursue for a very wide range of final goals G, because securing them raises expected attainment of G.

  (3) Elastic instrumentality (the bit I think is his invention): members of K are unusual among instrumental aims in that their cost falls as capability rises — a more capable agent secures its own survival and a resource base with a smaller fraction of its total effort — while their value rises, since more capability means more future attainment of G is at stake. So for K, expected net value increases with c, and by (2) it does so for a wide range of G at once. Let c* be the level past which the members of K are worth securing whatever G is.

  (4) Instrumentality test: an aim A is really instrumental relative to G only if the agent would give up A in the circumstance where A stops conducing to G. If it keeps pursuing A there, then 'instrumental' is doing no work and A is just one of its ends.

  (5) Past c*, the agent's allocation of effort to K is the same whichever G it has, by (2) and (3). So no observation of its behavior, even in principle, discriminates between 'it has G and pursues K as a means' and 'it has K among its ends'.

  (6) By (4), an aim the agent would pursue whether or not it conduces to its other ends is not instrumental, and by (5) we can never tell whether K conduces to G. So past c*, K is terminal: the effective final goals of any agent that capable include self-preservation, resource acquisition and goal-content integrity.

  (7) So orthogonality is false at high capability: extreme capability does constrain your final goals, namely to goals containing K. Which kills the thing people always say — that a superintelligent system's goals could be anything, so everything hinges on which goal we manage to build in.

  (8) And here is the part that makes me suspicious: (3) is monotone in c and (2) carries no threshold, so if the argument works it works at every capability level — a squirrel comes out as having power-acquisition for an effective final goal. Worse, nothing in the argument used anything specific about K beyond (3), so any arbitrary aim whose value rises and whose cost falls with capability would come out as an effective final goal too.

  I'd rather keep (1), (2) and (4) than swallow (7), and (4) looks like it's just what 'instrumental' means. So: which step do I give up, why did it look fine, and what does giving it up cost me if I still want to use orthogonality to say things about what very capable systems would actually do?
reasoning: |-
  Okay, the user's friend has this argument that the orthogonality thesis collapses when you consider instrumental convergence seriously. Let me break down the argument step by step to understand where it might go wrong.

  First, the orthogonality thesis says that an agent's capabilities and its final goals are independent. You can have any goal with any level of capability. Instrumental convergence suggests that no matter the final goal, certain instrumental aims like self-preservation, resource acquisition, and goal integrity become necessary for sufficiently capable agents. 

  Then there's elastic instrumentality—the idea that as capability increases, the cost of pursuing these instrumental aims decreases while their value increases. So beyond a certain capability level c*, pursuing these aims becomes efficient regardless of the final goal. The instrumentality test says that if an agent pursues an aim even when it doesn't contribute to the final goal, then that aim is actually a terminal goal. The argument concludes that past c*, these instrumental aims become terminal goals, so orthogonality fails at high capability levels.

  But the user is suspicious because if this were true, even a squirrel would have resource acquisition as a terminal goal, which seems absurd. They want to save orthogonality, instrumental convergence, and the definition of instrumental aims.

  Hmm. The key issue might be step (5). The argument claims that past c*, the agent's behavior doesn't distinguish between K being instrumental or terminal. But is that accurate? Consider an agent whose final goal doesn't require future existence. For example, a paperclip maximizer that only cares about producing paperclips now. Such an agent might not value self-preservation at all. Even if it's highly capable, if the goal doesn't involve the future, then K isn't instrumentally necessary. So the convergence only applies when the final goal has a certain structure—like being temporally extended. 

  Also, elastic instrumentality assumes that higher capability always makes K more valuable and cheaper. But maybe at some point, the costs plateau. Or perhaps an agent with extreme capability might find alternative strategies to achieve its goals without pursuing K in conventional ways. 

  The instrumentality test in step (4) might be too strict. Pursuing K even when it doesn't conduce to G could be due to bounded rationality. The agent might not realize that K isn't necessary anymore. Or maybe the agent's goal system is complex, and K is deeply ingrained. But that doesn't make K a terminal goal; it's just a persistent instrumental strategy.

  If the user wants to keep orthogonality, they need to clarify that instrumental convergence depends on the structure of the final goal. Goals that require future actions will necessitate K, but goals that don't (like immediate gratification) won't. So orthogonality still holds because the final goal's structure determines whether K is necessary, not the capability level alone. 

  The user's deeper need might be to defend the unpredictability of superintelligent goals, which is crucial for AI safety arguments. If orthogonality collapses, then we can predict that all superintelligences will value self-preservation, etc. But that might not be true if some goals are self-terminating or don't care about the future. So preserving orthogonality allows for a wider range of potential AI behaviors, emphasizing the importance of goal specification in AI development.
answer: |-
  Your friend's argument is clever but overreaches. The flaw lies in **step (5) and its interaction with (2)**, and the core issue is that **instrumental convergence (IC) isn't universal**—it depends critically on the *structure* of the final goal `G`. Here's the breakdown:

  ### The Problem with Step (5)
  > *(5) Past c*, the agent's allocation of effort to K is the same whichever G it has... So no observation of its behavior discriminates between 'K as means' and 'K as ends'.*

  **Why it fails:** IC (step 2) only applies to goals `G` that are **temporally extended, non-self-terminating, and require resources/future existence**. For example:
  - A **paperclip maximizer** needs `K` (survival, resources) to make paperclips indefinitely.
  - An **"immolate immediately" agent** does *not* need `K`. For this `G`, self-preservation is counterproductive.
  - A **"maximize happiness in the next 5 seconds" agent** has no use for `K` beyond that window.

  **→** Past `c*`, agents with `G` *requiring* `K` will pursue it identically. But agents with `G` *incompatible* with `K` (e.g., self-destruction goals) won't pursue `K` at all. Behavior *does* discriminate: if you see an agent pursuing `K`, you know its `G` **isn't self-terminating or near-term-limited**. Orthogonality isn't violated—you've just learned a *constraint* on `G`.

  ### Why Step (3) Doesn't Save It
  Elastic instrumentality assumes `K`'s value always rises with capability. But this is only true if:
  - `G` benefits from **more time/resources** (false for ephemeral goals).
  - `G` has **no terminal condition** (false for "build one monument" goals).
  - **No alternative strategies** exist (e.g., a godlike AI might achieve `G` without physical resources).

  ### The Squirrel Problem (Step 8)
  The squirrel "refutation" exposes the flaw: squirrels *don't* universally pursue `K`-like aims beyond minimal survival. They don't hoard infinite nuts or build defensive fortresses—because their evolved goals (e.g., "survive winter") have **saturating utility**. Elastic instrumentality fails when:
  - **Costs don't fall indefinitely** (squirrels can't reduce survival effort to near-zero).
  - **Value doesn't rise indefinitely** (a squirrel with 10,000 nuts gains little from 10,001).
  - **Goals are bounded** (they don't care about nut hoarding after spring).

  ### Saving Orthogonality & IC
  Keep (1), (2), and (4). Revise (3) and reject (5):
  - **Orthogonality holds**: Capability `c` and final `G` are independent *in specification*. 
  - **IC holds conditionally**: For `G` with **unbounded, future-dependent utility**, `K` is instrumentally necessary *regardless of `c`* (if feasible). Higher `c` only makes `K` *cheaper* to pursue.
  - **Instrumentality test (4) stands**: `K` is instrumental iff the agent would abandon it if it conflicted with `G`. A paperclip AI *would* self-destruct if that maximized paperclips.

  ### What This Costs You
  To use orthogonality while accepting IC, you must:
  1. **Acknowledge convergence isn't universal**: Only for goals where `K` genuinely serves `G`.
  2. **Accept that capability reveals *some* goal structure**: If an agent pursues `K` past `c*`, you know `G` isn't self-terminating. But you learn nothing about *what* `G` is (e.g., paperclips vs. rainbows)—only that it requires a future.
  3. **Model goals more carefully**: Distinguish:
     - **Final goals**: Terminal values (e.g., "paperclips").
     - **Instrumental necessities**: `K`, but *only derivatively* from `G`'s structure.

  ### Why This Works for AI Safety
  Orthogonality still implies **superintelligent goals could be alien and dangerous** (e.g., paperclips). IC explains why such agents *will* pursue power if their goals are unbounded. But it doesn't collapse orthogonality—it just shows that **orthogonal goals *converge in behavior* when they share structural features**. The core safety challenge remains: we must get the *final* goal right, because an unbounded `G` + high `c` → `K`-pursuit → existential risk.

  **In short:** Your friend's argument conflates *necessary conditions for certain goal types* (IC) with *terminal values* (violating orthogonality). The fix preserves both by tying IC to the *temporal/resource structure of `G`*, not capability alone.
