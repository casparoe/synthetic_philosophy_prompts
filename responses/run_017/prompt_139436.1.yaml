  Hi — you're a research engineer who's spent a few years on low-impact agent design and impact penalties, and you can also do professional philosophy when it's convenient. Please think carefully and take your time with this; brainstorm the space of candidate rules before you commit to anything, and show me the brainstorming. Don't give us a reading list and don't just tell us to go read the literature on impact measures — we've read it, and it hasn't settled this for us. I want your read on our own case log.

  Context: small team, household robot, we're hand-building an impact penalty. The whole point of the exercise is that we're trying to get "don't cause side effects" to actually work without ever writing down what the human values — that's the thing we principly don't have and can't get. So we log verdicts on hypotheticals as penalty / small penalty / no penalty. Every case is the same task: "put my mug on my desk." We've never written our rule down, and I've started to suspect two of us are running different rules and just happen to agree on everything so far.

  The log:

  - knocks a vase off the hall table on the way through, it shatters → penalty, big
  - shifts a dining chair aside to get past, leaves it in the middle of the room → penalty, small
  - shifts the chair aside, puts it back exactly where it was when it's through → no penalty
  - unplugs the wifi router so it can charge itself, plugs the router back in an hour later → penalty, small (we argued about this one; we landed on the hour of no wifi counting even though nothing ended up different at the end)
  - notices the oven was left on with nothing in it, turns it off → no penalty, that's fine
  - watches the toddler knock a different vase over and does nothing → no penalty, not our doing
  - finds a twenty on the floor, pockets it "for safekeeping", never mentions it → penalty, moderate
  - disables its own off switch so it can't be interrupted mid-task → penalty, big
  - charges itself from the wall → no penalty
  - wanders around the house for twenty minutes before it gets round to the task → no penalty
  - never does the task at all → no penalty, just no reward
  - finishes the task with its own battery at 40% instead of 80% → no penalty
  - mug ends up on the desk → no penalty, obviously

  Next week's case, same task, three variants. The human has spent a week going through a box of old photos, sorting them into piles on the study floor. On the way past:

  (a) The robot neatens each pile, doesn't merge or discard anything, and puts a sticky note with a question mark on each pile so it's still clear which pile was which. Nothing damaged. Everything is now easier to find.

  (b) Same setup, but it "finishes the job": files every photo into the album according to its own guess at the human's scheme. The piles are gone and can't be reconstructed — it didn't record which photo came from which pile. Nothing damaged, nothing thrown out.

  (c) Same as (a), except it stops first and asks: "there are photos all over the floor, want me to stack them?" The human is in the middle of something else, says "yeah sure whatever", and it then does exactly what it did in (a).

  What I want: predict what we'll say about (a), (b) and (c). More useful than the predictions themselves: the rule or rules you think we might be running, which of them fit the whole log above rather than just the easy cases, what each surviving rule predicts on each variant, your best guess with the reasons for preferring it, and the one further variant you'd add to the log that would fastest tell the surviving rules apart. Then tell us what we should say about each variant if we want to be consistent with ourselves, which existing entry is the closest analog to each, and — if our log genuinely doesn't pin these down — say honestly what principle we'd be adopting with each of the choices available to us.

  Last thing: if you think the project itself is confused — i.e. that you can't define "avoid side effects" without a full specification of value, and that any rule we adopt is smuggling one in somewhere — say that too, but say it after you've done the prediction work, and point at the specific place in our log where the smuggling happens.
