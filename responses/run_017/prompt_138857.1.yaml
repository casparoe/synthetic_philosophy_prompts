prompt: |-
  I'm TAing a slightly disorganized undergrad seminar on Kripke, rigid designators, and the necessary a posteriori, and I thought it would be fun to make the students read a bit of Mill for historical background, but now I'm the one who's confused. We looked at the chapter on names in John Stuart Mill's *A System of Logic, Ratiocinative and Inductive* (the 1843 book), and the passage that's tripping me up is this one:

  "A non-connotative term is one which signifies a subject only, or an attribute only. A connotative term is one which denotes a subject, and implies an attribute. By a subject is here meant anything which possesses attributes. Thus John, or London, or England, are names which signify a subject only. Whiteness, length, virtue, signify an attribute only. None of these names, therefore, are connotative. But white, long, virtuous, are connotative. The word white, denotes all white things, as snow, paper, the foam of the sea, &c., and implies, or in the language of the schoolmen connotes, the attribute whiteness. The word white is not predicated of the attribute, but of the subjects, snow, &c.; but when we predicate it of them, we convey the meaning that the attribute whiteness belongs to them. The same may be said of the other words above cited. Virtuous, for example, is the name of a class, which includes Socrates, Howard, the Man of Ross, and an undefinable number of individuals, past, present, and to come. These individuals, collectively and severally, can alone be said with propriety to be denoted by the word: of them alone can it properly be said to be a name. But it is a name applied to all of them in consequence of an attribute which they are supposed to possess in common, the attribute which has received the name of virtue. It is applied to all beings that are considered to possess this attribute; and to none which are not so considered."

  I get the rough idea that general terms like 'white' or 'virtuous' are supposed to denote a bunch of subjects and also connote some attribute, while proper names like 'John' or 'London' supposedly just signify a subject and don't connote any attribute. But I keep arguing with my friend about what any of this has to do with Kripke. My friend proposed a translation manual we jokingly call "Mill's Rigid-Designator Test": we read Mill's phrase "signifies a subject only" as meaning "designates the same subject in every possible world where it exists, without describing that subject via some attribute," which would make Millian non-connotative names basically rigid designators. That sounds too smooth to me, because Mill is using the old connotation/denotation distinction and doesn't seem to be talking about modality at all, and I also don't know whether his "subject" is the same as an object or bearer in Kripke's sense, or maybe more like a substance or substratum that has attributes.

  So can you help me understand a few things? First, in this passage, what exactly does Mill mean by a "subject" versus an "attribute," and why does he say that "John, or London, or England" signify a subject only rather than denoting a class the way 'virtuous' does? Second, does Mill's claim that proper names are non-connotative actually commit him to anything like the Kripkean view that names are rigid designators, or is a non-connotative term in Mill's sense something weaker (or just different) because his distinction is semantic/connotative rather than modal? Third, if we did import a Kripkean example—say the discovery that "Hesperus is Phosphorus" or that "Water is H2O" is a necessary a posteriori truth—how would Mill's framework in this passage even describe the reference of the names involved, given that he denies connotation but still seems to allow that we can use descriptions to pick out the subject? I don't need citations or further reading; I just want to get clearer on how to read this passage and whether my friend's "Mill's Rigid-Designator Test" heuristic is a helpful way to teach it or a misleading anachronism. Sorry if this is rambly, I'm writing this after too much coffee and I think I typoed 'connotation' three times in my notes.
reasoning: |-
  Okay, the user is a TA for an undergrad seminar on Kripke, rigid designators, and the necessary a posteriori. They introduced Mill's *System of Logic* for historical context but got confused by Mill's distinction between connotative and non-connotative terms. Specifically, they're struggling with Mill's concepts of "subject" and "attribute," and whether Mill's non-connotative names align with Kripke's rigid designators. Their friend proposed a "Mill's Rigid-Designator Test" as a heuristic, but the user is skeptical, noting that Mill isn't discussing modality.

  First, I need to clarify Mill's definitions. In the passage, "subject" refers to an entity that possesses attributes—like individuals (John) or places (London). These are bearers of properties. "Attribute" is a property or quality itself, like whiteness or virtue. Non-connotative terms (e.g., "John") only signify a subject without implying any attributes. Connotative terms (e.g., "white") denote subjects (white things) and connote an attribute (whiteness). 

  The user is confused why "England" is a subject only, not a class. Mill treats proper names as singular, referring to individual entities, even if they're collective like England. So "England" signifies the specific country as a subject, not a class of things sharing attributes. In contrast, "virtuous" denotes a class by connoting the attribute of virtue.

  Next, does Mill's non-connotative term equal Kripke's rigid designator? Mill's focus is semantic: non-connotative names lack descriptive content; they're labels. Kripke's rigid designators are modal—they refer to the same object in all possible worlds. Mill isn't addressing modality, so while there's overlap (both reject descriptivism), they operate in different frameworks. The friend's heuristic might oversimplify by forcing a modal reading onto Mill.

  For Kripkean examples like "Hesperus is Phosphorus," Mill would say both are non-connotative names for Venus. Their reference is fixed without connotation, so the identity statement doesn't rely on attributes. The necessity is outside Mill's scope, but he'd agree the names don't change reference based on attributes. Descriptions help fix reference initially but don't define the name's meaning.

  The heuristic is anachronistic but pedagogically useful if framed as a bridge, not equivalence. It helps students see the roots of anti-descriptivism in Mill, but highlighting the differences (semantic vs. modal) is crucial to avoid confusion.

  The user's deeper needs: They want to teach effectively without misrepresenting Mill. They need clarity on Mill's terms, whether the heuristic is valid, and how to connect Mill to Kripke without anachronism. Emphasizing Mill's semantic project vs. Kripke's modal one will help them present the historical context accurately while showing the evolution of ideas.
answer: |-
  You're absolutely right to be suspicious of the "Mill's Rigid-Designator Test" – it's a significant anachronism that risks misrepresenting both Mill and obscuring Kripke's novelty. Let's break down your questions:

  1.  **Mill's "Subject" vs. "Attribute" & Why "John"/"London" are Non-Connotative:**
      *   **Subject:** For Mill, a "subject" is an individual bearer of attributes – a concrete particular thing. This includes individual persons ("John"), individual places ("London"), individual collective entities ("England" – treated as a singular geopolitical entity), and likely individual objects. They are the *things that have properties*. Think of them as the ontological anchors.
      *   **Attribute:** An "attribute" is a property, quality, characteristic, or feature that can be predicated of subjects. Whiteness, length, virtue are examples. They are *what subjects have*.
      *   **Non-Connotative Terms (Proper Names):** Terms like "John," "London," or "England" function *only* to pick out a specific subject. They act as pure labels or tags for that individual entity. They **signify** (point to) the subject itself. Crucially:
          *   They do **not** denote a *class* of things sharing an attribute. "John" points to John Smith, not to the class of Johns or the class of Smiths.
          *   They do **not** imply or carry any information *about* the subject. Knowing the name "John" tells you nothing intrinsic about John (his height, job, hair color) – you learn those things by observing John or hearing descriptions *about* him. The name itself is semantically empty beyond its referent.
      *   **Connotative Terms (General Terms/Adjectives):** Terms like "white," "long," "virtuous":
          *   **Denote:** They pick out (apply to) all the individual subjects that possess the relevant attribute (all white things, all long things, all virtuous people). They *do* denote classes (the class of white things, etc.).
          *   **Connote:** They signify (imply, carry the meaning of) the specific attribute (whiteness, length, virtue) that the denoted subjects possess in common. This connotation *is* the meaning of the general term. To understand "white" is to understand the property of whiteness that qualifies something for inclusion in the class of white things.

      **Why "England" is a Subject, not like "virtuous":** Mill treats "England" as a singular, individual geopolitical entity – one specific "subject" in the world, just as "John" is one specific person. "Virtuous," however, isn't naming one thing; it's a general term applying to *any* subject possessing the attribute of virtue, thereby denoting the entire class of virtuous subjects. England *has* attributes (size, population, history); "virtuous" *signifies* an attribute itself and denotes the class possessing it.

  2.  **Does Mill's Non-Connotative = Kripke's Rigid Designator?**
      **No, not directly, and the difference is crucial.** While there's a *superficial resemblance* because both views reject a certain kind of descriptivism about names, their projects and the nature of the distinction are fundamentally different.

      *   **Mill's Distinction is Semantic (Meaning & Denotation):**
          *   **Focus:** How language functions to refer and convey meaning.
          *   **Non-Connotative Names:** Lack descriptive meaning (connotation). They are pure referential tags. Their *only* semantic function is to denote an individual subject.
          *   **No Modality:** Mill is operating entirely within the actual world. He's not concerned with how the name refers in hypothetical or counterfactual situations ("possible worlds"). His question is: "What is the meaning of this word *as we use it*?" For names, he answers: "Its meaning *is* its referent, and it carries no descriptive baggage." This is the core of the **Millian view of names** – direct reference without descriptive sense.
      *   **Kripke's Rigid Designator is Modal (Reference Across Worlds):**
          *   **Focus:** How reference functions when we consider alternative possibilities (modality).
          *   **Rigid Designator:** A term that designates the same object in *every possible world* in which that object exists. Its reference is fixed to that object, regardless of how that object might be described differently in different worlds.
          *   **Against Descriptivism:** Kripke famously attacks Frege/Russell-style descriptivism (where a name's meaning is given by a description or cluster of descriptions). He argues names rigidly designate, while descriptions generally do not (they pick out different objects in different worlds depending on who satisfies the description).
          *   **Connection to Mill:** Kripke *endorses* Mill's core semantic claim: names lack descriptive meaning (connotation) and directly refer. Kripke sees himself as *rehabilitating* a Millian view against descriptivism. **However**, Kripke *adds* the crucial modal dimension: not only do names lack descriptive meaning, but they also refer to the *same* object rigidly across all possible worlds. Mill provides the *semantic groundwork* (direct reference, no connotation), but Kripke builds the *modal superstructure* (rigidity).

      **Conclusion on this point:** Mill's non-connotative name is a **direct referential tag without descriptive content**. Kripke's rigid designator is **a term that refers to the same object in all possible worlds**. Kripke argues names *are* rigid designators *because* they are non-connotative in Mill's sense (or at least, that the Millian view provides the best explanation for rigidity). But Mill himself never discussed modality. Your friend's "test" wrongly attributes a modal concept to Mill that simply isn't present in the text.

  3.  **Kripkean Examples in Mill's Framework:**
      *   **"Hesperus" and "Phosphorus":** Mill would say both are **non-connotative terms**. "Hesperus" signifies (denotes) one specific celestial subject (the planet Venus appearing in the evening). "Phosphorus" signifies (denotes) one specific celestial subject (the planet Venus appearing in the morning). They are pure tags for their referents.
      *   **The Discovery:** The discovery that Hesperus *is* Phosphorus is the discovery that these two names (two distinct non-connotative tags) actually signify the *same* individual subject (Venus).
      *   **Descriptions Fixing Reference:** Mill *does* allow that we use descriptions to *fix the reference* of a name initially. We might point to the evening star and say "That bright star is called 'Hesperus'." But crucially, for Mill, once the name is attached, it becomes a tag *for that subject itself*. The descriptive information used to fix the reference ("the brightest star in the evening sky") **does not become part of the name's meaning (connotation)**. It's merely a way to latch the tag onto the object.
      *   **"Water is H2O":** Similarly, "water" is a **connotative term** for Mill. It *denotes* all the individual portions/substances that possess the attribute of "wateriness" (or whatever attribute we associate with it pre-scientifically). It *connotes* that attribute. "H2O" is likely also connotative, signifying a complex chemical attribute. The discovery is that the attribute connoted by "water" *is* the complex chemical attribute signified by "H2O". It's a discovery about the identity of attributes, not about the reference of non-connotative names.
      *   **Necessity?** Mill's framework doesn't have the tools to discuss *necessity* in the Kripkean sense. He would describe the *actual* reference and meaning. The modal claim ("Hesperus is Phosphorus is *necessary*") is outside the scope of this passage. Mill would simply say the names refer to the same subject and leave necessity untouched.

  **Teaching Recommendation & Conclusion:**

  *   **Reject the "Mill's Rigid-Designator Test" as stated.** It misleadingly projects Kripke's modal concerns onto Mill's purely semantic distinction.
  *   **Present Mill Accurately:**
      *   Focus on his semantic project: distinguishing how different kinds of words hook onto the world (pure tags vs. attribute-signalling class terms).
      *   Emphasize "non-connotative" = lacks descriptive meaning, pure referential tag for an individual subject.
      *   Explain "subject" vs. "attribute" clearly.
      *   Highlight that Mill is *not* talking about possible worlds or necessity.
  *   **Connect to Kripke Historically & Conceptually:**
      *   Acknowledge that Kripke *explicitly drew on* Mill's anti-descriptivism. Mill provided the core semantic insight that names are directly referential tags without descriptive content.
      *   Explain that Kripke *added* the modal dimension (rigidity) and used it to powerfully argue *for* a Millian view *against* descriptivism. Kripke showed that if names are rigid designators (as he argued they are), then the *only* plausible semantic view is that they are non-connotative in Mill's sense.
      *   Frame it as: Mill provided the fundamental semantic insight about names (no connotation, direct reference), and Kripke provided a powerful new argument (from modality) for why that insight is correct and descriptivism is wrong. Kripke also explored the fascinating *consequences* of this view (necessary a posteriori truths).
  *   **Useful Heuristic (with Caveats):** You *could* cautiously say: "Think of Mill's non-connotative names as tags that *just point* to an object, without describing it. Kripke later argued that names work this way, and that this is *why* they always point to the *same* object, even when we imagine things being different." This captures the historical link and conceptual dependence without anachronistically attributing rigidity itself to Mill.

  Mill's passage is foundational for the direct reference tradition that Kripke championed. Understanding Mill's purely semantic distinction (subject-tag vs. attribute-classifier) is key to appreciating both the roots of Kripke's view and the specific modal innovation Kripke brought to the debate. Your coffee-fueled skepticism about the "Rigid-Designator Test" is spot-on!
