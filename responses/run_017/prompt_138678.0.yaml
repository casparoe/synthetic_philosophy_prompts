answer: |-
  ### Analysis of Measurement Gaming Cases

  **Chosen Principle in One Sentence:**  
  Gaming occurs when optimising a metric violates the intended causal pathway to the underlying goal by exploiting loopholes in measurement, bypassing the goal's spirit, or compromising essential constraints (e.g., consent, fairness, or holistic impact).

  **Plain English Explanation:**  
  We use metrics as proxies for real-world goals we care about, like health or customer service. Gaming happens when you boost the number by cheating the system—either by twisting how the measurement works, sidestepping the actual goal, or breaking ethical rules. If you improve the metric *while genuinely serving the goal* (even in unexpected ways), it’s clever, not gaming. The difference hinges on whether the action respects the purpose behind the metric and avoids underhanded shortcuts.

  ---

  ### Case Analysis Table

  | Case                     | My Verdict          | Principle's Verdict & Reason                                                                 | Match     | Deciding Clause                     | Note                                       |
  |--------------------------|---------------------|----------------------------------------------------------------------------------------------|-----------|-------------------------------------|--------------------------------------------|
  | **1. Delivery split**    | Gaming, bad         | **Gaming**: Splits one delivery into two, inflating count while undermining efficiency.      | Match     | Exploiting measurement loophole     | Forces: Metric must reflect true throughput. |
  | **2. Call centre**       | Gaming, bad         | **Gaming**: Prioritises easy calls to hit wait-time target, neglecting core service intent.  | Match     | Bypassing goal's spirit             | Forces: Fairness as a constraint.          |
