  ### Key Insights from Cases
  - **Legitimate vs. Gaming**: Changing *how* you achieve a goal isn’t gaming if the goal is served (Chess, Kind nurse). Gaming requires **corrupting the link** between metric and goal.  
  - **Constraints Matter**: Consent (Mood drug) and fairness (Call centre) act as guardrails—violating them makes an action gaming even if numbers rise.  
  - **Goal Erosion**: When a metric *becomes* the goal (Tutor to test), it’s still gaming if the original intent was broader. Metrics shouldn’t redefine success retroactively.  
  - **The Clever Exception**: Unconventional methods (Chess) aren’t gaming if they work within the system’s rules to serve the true goal.
