prompt: |-
  im trying to work out how much of my income and time to give away, and every moral theory I read seems to tell me either basically everything or basically nothing, so before I commit to one I want the spec. Write me the desiderata a theory of demandingness has to meet: the cases it has to handle (the shallow pond, the thousand people who each need a dollar from me, the case where nobody else is going to pitch in, the case where my own contribution on its own changes nothing at all), the distinctions it can't collapse (too demanding vs. merely supererogatory, cost to the agent vs. cost imposed on people she cares about), with the consideration behind each, and mark which are non-negotiable and which are just what one camp happens to want. Two requirements I want you to argue for rather than only list: how much an agent owes in *finding out* whether her inaction is harming people and which interventions actually work — the epistemic bill, not just the action bill — and whether there's any ceiling on how costly it may be to hold someone else to a demand (blame, social pressure, setting up a fine), since a theory can look modest if it only counts the cost to the person complying. Skip scoring utilitarianism, I can do that myself. What I really want is the pair of desiderata you think can't both be satisfied, because I suspect that's where the whole debate bottoms out.
reasoning: |-
  Okay, the user is struggling with how much of their income and time they should give away to help others. They've encountered moral theories that either demand almost everything or very little, and they're frustrated because they can't find a balanced approach. They want a framework to evaluate these theories, focusing on specific cases and distinctions. 

  Hmm, they're clearly well-read on ethics—mentioning shallow pond, collective action problems, epistemic costs. This isn't someone new to philosophy; they're likely an effective altruism-adjacent person trying to operationalize ethics. Their frustration with "all or nothing" theories suggests they want practicality, not just abstraction. 

  The real pain point seems to be paralysis: they can't commit to action without a coherent theory, but they also imply they might be over-intellectualizing. That tension between "must act" and "must have rigorous justification" is palpable. 

  Ah! Their hidden ask is revealing: they suspect the debate bottoms out in irresolvable tensions. They want the *unsolvable* part laid bare—not just another list. That's insightful. Most people want answers; they want to see why answers fracture. 

  For desiderata... Non-negotiables first. Any theory must handle shallow pond (easy rescue) vs. systemic poverty (hard). If it can't distinguish obligatory from heroic, it's useless for real decisions. Also must address partial compliance—what I owe when others won't help. And cost distinctions: my suffering vs. my kid's suffering isn't the same. 

  The epistemic demand is sharp. They're right—knowing *how* to help is half the battle. A theory that ignores research costs is naive. And the enforcement ceiling! Brilliant point. If demandingness only counts compliance pain, but not the cruelty of forcing it, we get dystopias. 

  Now the irreconcilable pair... (pacing) It's got to be **Demandingness Robustness vs. Agent Integrity Preservation**. We *need* ethics to push us beyond selfishness (hence robustness), but if it vaporizes personal integrity—forcing you to abandon passions, relationships, identity—it becomes self-defeating. You can't meaningfully *be* a moral agent if the demand destroys *you* as an agent. But where's the line? No theory draws it uncontroversially. 

  ...Should I mention Bernard Williams' "ground projects" critique? No, user said skip scoring theories. Stick to structural conflict. 

  Final thought: Their "suspect it bottoms out" intuition is correct. The desiderata aren't just a checklist; they're battle lines. By mapping them, I'm giving them the weapons to dissect any theory—which is what they actually need to escape paralysis.
answer: |-
  Here’s a structured breakdown of desiderata for a theory of demandingness, designed to navigate the tension between "all or nothing" extremes. I’ll outline cases, distinctions, non-negotiables, argue for your two key requirements, and end with the fundamental tension I believe is unresolvable.

  ---

  ### **Core Cases & Non-Negotiables**  
  *(Must be handled by any viable theory)*  

  1. **The Shallow Pond (Easy Rescue)**:  
     - *Case*: You walk past a drowning child; saving them costs little (e.g., ruined clothes).  
     - *Requirement*: Theory must deem this **morally obligatory**. Failure here implies the theory is inert.  
     - *Why non-negotiable*: Tests basic recognition of urgent, low-cost duties to prevent grave harm.  

  2. **Partial Compliance / Free-Rider Scenarios**:  
     - *Case*: 1,000 people each need $1 to avoid severe harm. If others won’t contribute, must *you* give $1,000?  
     - *Requirement*: Theory must **not demand full substitution** for others’ inaction (e.g., you’re not required to pay all $1,000 alone).  
     - *Why non-negotiable*: Moral responsibility shouldn’t scale infinitely with others’ failures.  

  3. **Imperceptible Impact**:  
     - *Case*: Donating $1 to a billion-dollar charity where your contribution changes *nothing* measurably.  
     - *Requirement*: Theory must **avoid demanding all resources** here (e.g., "give until marginal utility = 0").  
     - *Why non-negotiable*: Collapses morality into futility or absurd sacrifice if no threshold exists.  

  ---

  ### **Essential Distinctions**  
  *(Must not be collapsed)*  

  4. **Obligation vs. Supererogation**:  
     - *Distinction*: Demanding the *minimum* required (duty) vs. praiseworthy *excess* (heroism).  
     - *Why*: Without this, morality becomes either tyrannical (demanding sainthood) or empty (no duties beyond self-interest).  
     - *Non-negotiable*: A theory must define a **non-heroic baseline**.  

  5. **Cost to Agent vs. Cost to Loved Ones**:  
     - *Distinction*: Sacrificing your own well-being vs. imposing harm on dependents/relationships.  
     - *Why*: A theory demanding you orphan your child to save strangers is self-undermining.  
     - *Non-negotiable*: **Relational integrity** must constrain demands.  

  ---

  ### **Your Two Key Arguments**  

  6. **The Epistemic Bill**:  
     - *Requirement*: Agents owe **significant (but bounded) effort** to investigate harms and effective interventions.  
     - *Argument*:  
       - Ignorance isn’t exculpatory if harm is foreseeable. Example: Not researching whether your bank funds oppression is negligent.  
       - **But**: Effort must scale with (a) *access to information*, (b) *opportunity cost* (e.g., time better spent acting), and (c) *reasonable doubt*.  
       - *Limit*: You needn’t become a full-time researcher, but must engage in **proportionate due diligence** (e.g., consulting experts/evidence).  

  7. **Enforcement Ceiling**:  
     - *Requirement*: **Social enforcement** (blame, fines) must have a cost ceiling *lower* than the demand’s compliance cost.  
     - *Argument*:  
       - A theory counting *only* compliance cost can justify cruel enforcement (e.g., jailing someone for not donating a kidney).  
       - Enforcement costs *others* too: social trust, psychological trauma, institutional brutality.  
       - **Thus**: Enforcement must (a) respect agent’s basic dignity, (b) avoid disproportionate harm, and (c) be socially sustainable.  

  ---

  ### **Contested Desiderata**  
  *(Camp-specific; not universal)**  

  8. **Permission for Personal Projects**:  
     - *Libertarian/pluralist view*: Agents may permissibly prioritize personal goals (art, hobbies) *even if* resources could save lives.  
     - *Why contested*: Utilitarians reject this; others see it as essential for a meaningful life.  

  9. **Demandingness Sensitivity to Luck**:  
     - *Egalitarian view*: Those born into wealth owe more than those who struggled.  
     - *Why contested*: Meritocrats/libertarians deny this, seeing post-tax income as fully "theirs."  

  ---

  ### **The Irreconcilable Tension**  
  **You suspect correctly: one pair of desiderata cannot be jointly satisfied.**  

  - **Desideratum A: Demandingness Robustness**  
    *"Morality must require significant sacrifice when stakes are high."*  
    → Justifies demanding up to the point of marginal utility in crises (e.g., famine).  

  - **Desideratum B: Agent Integrity Preservation**  
    *"Morality must not annihilate the agent’s identity, ground projects, or capacity to function."*  
    → Demands "moral breathing room" for non-altruistic pursuits.  

  **Why they conflict**:  
  - **Robustness** pushes toward near-total sacrifice (e.g., "give until you’re barely above destitution").  
  - **Integrity** requires protecting core personal commitments (e.g., raising your child, pursuing a vocation).  
  - **No neutral arbiter**: What counts as "significant but not annihilating" is inherently subjective.  
    → *Consequentialists* sacrifice integrity for robustness (e.g., Singer: you must sell everything not needed for survival).  
    → *Moderates* (e.g., Scheffler) protect integrity but risk underdemandingness (e.g., 10% income as "enough").  

  **This is the core fault line**. Any theory prioritizing one desideratum will be "too much" or "too little" to the other camp.  

  ---

  ### **Summary Checklist for Your Evaluation**  
  | Desideratum                          | Type               |  
  |--------------------------------------|--------------------|  
  | 1. Shallow Pond → Obligatory         | Non-negotiable     |  
  | 2. No full substitution for free-riders | Non-negotiable     |  
  | 3. Threshold for imperceptible impact | Non-negotiable     |  
  | 4. Obligation ≠ supererogation       | Non-negotiable     |  
  | 5. Cost to self ≠ cost to loved ones | Non-negotiable     |  
  | 6. Epistemic effort (bounded)        | Argued/defensible  |  
  | 7. Enforcement cost ceiling          | Argued/defensible  |  
  | 8. Permission for personal projects  | Contested          |  
  | 9. Luck-sensitivity                  | Contested          |  
  | **A vs. B: Robustness vs. Integrity**| **Irreconcilable** |  

  To build your stance, decide where you land on **A vs. B**. All other desiderata follow from that anchor. If you need a practical heuristic while debating theory: **Give significantly more than you’re comfortable with, but protect your capacity to function and care for dependents. Invest in epistemic rigor—it’s part of the duty.**
