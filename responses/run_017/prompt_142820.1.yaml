prompt: |-
  I work in the algorithmic accountability unit of a national audit office. About twenty times a year we review a public body's risk-scoring system — a model that ranks cases (taxpayers, tenancies, benefit claims) by predicted risk and sends the top ones to human investigators — and we publish a short opinion which the body must answer publicly. We have fifteen working days, a validation sample with scores, observed outcomes and protected-characteristic labels, and, for proprietary systems, no training data and no model internals. We cannot tell a body which fairness criterion to adopt; that is for it and its ministers. What we can do is check whether the commitments it has made are coherent, and whether they hold for the deployment it actually plans.

  Before looking at any fairness numbers, we now record what we call the deployment envelope: the decision the score feeds (a fixed threshold, or selection of a fixed-capacity top slice), the outcome being measured, the group definition in force, whether that outcome is observed for everyone or only for cases that were selected, and the time window. Please turn the familiar incompatibility results — the ones showing that, away from degenerate cases, calibration within groups cannot be combined with equal error rates across groups whose base rates differ — into a decision procedure our reviewers can run inside a deployment envelope: the ordered questions, what counts as a sufficient answer to each, the points at which it returns 'internally inconsistent claim — send back to the vendor', the points at which it returns 'holds under this envelope only', and the points at which it must stop and hand the decision back because it is a choice of values rather than a matter of coherence. It has to cope with outcomes observed only for investigated cases, with group labels that are themselves proxies, and with the same scores being used at two different thresholds by two units of one body.

  Then run it on two submissions: a tax authority's model for selecting returns to audit, where the vendor reports calibration within each group together with equal false-positive and false-negative rates across groups; and a council's model for allocating housing-inspection visits, where the council is under a statutory duty to equalise the rate at which each group is wrongly flagged, the base rates differ, and the model already outperforms the process it replaces — this is the one where I expect an answer the council will not want. Close by saying plainly what the procedure cannot tell us. Please write in British English and keep the whole response, procedure and applications included, under 1,200 words.
reasoning: |-
  Okay, the user works in an algorithmic accountability unit and needs a decision procedure for reviewing risk-scoring systems. They want to transform fairness incompatibility results into a practical checklist. 

  Hmm... the core challenge is balancing mathematical coherence with real-world constraints like partial outcome data and proxy group labels. The user's description suggests they're deeply familiar with the technical nuances but need something operational for their team. 

  First, I need to map the famous impossibility theorem onto their workflow. The key is structuring questions that force contradictions to surface early. Should start with deployment parameters before any fairness numbers - that matches their "envelope" approach. 

  For the tax authority example, the vendor's claim of both calibration and equal error rates will immediately flag inconsistency. Must show how the procedure catches this even without base rates. 

  The housing inspection case is trickier - statutory duty to equalize false positives creates inherent tension if base rates differ. The council won't like being told they can't satisfy all constraints, but the math forces trade-offs. 

  Biggest limitations: can't resolve when group definitions are flawed proxies, and can't judge value choices like which fairness criterion to prioritize. Should emphasize those boundaries clearly. 

  Need to keep British English throughout - "statutory duty" not "statutory obligation", "council" not "municipality". Also mind the word limit by focusing on actionable steps.
answer: |-
  ## Algorithmic Fairness Coherence Assessment Procedure (AFCAP)

  **Purpose:** To determine whether a public body's stated fairness commitments are (a) mathematically coherent and (b) demonstrably satisfied within their declared deployment envelope, given available validation data. Flags inherent contradictions, envelope-specific compliance, and value-laden trade-offs.

  **Inputs:** Deployment Envelope (Decision Rule, Outcome Definition, Group Definition, Outcome Observation Scope, Time Window), Validation Data (Scores, Observed Outcomes where available, Group Labels), Stated Fairness Commitments.

  **Procedure:**

  1.  **Confirm Envelope & Commitments:**
      *   *Question:* Are the deployment envelope and stated fairness commitments clearly defined and recorded?
      *   *Sufficient Answer:* Explicit documentation of threshold/capacity, outcome (Y), groups (G), observation scope (full/partial), time window, and specific fairness criteria (e.g., "Calibration by Group", "Equal FPR across Groups").
      *   *Output:* If unclear, return "Unclear Envelope/Commitments - Seek Clarification". Else, proceed.

  2.  **Check Outcome Observation Scope:**
      *   *Question:* Is the outcome `Y` observed for *all* cases in the validation sample, or only for selected cases?
      *   *Sufficient Answer:* Confirmation and data verification.
      *   *Output:*
          *   If **Full Observation**: Proceed to Step 3.
          *   If **Partial Observation** (Only Selected): Proceed to Step 3 *BUT* flag "All subsequent checks reliant on unobserved outcomes (e.g., FNR, overall base rates) are tentative and subject to selection bias. Robustness cannot be fully verified." Highlight this limitation in the final opinion.

  3.  **Identify Required Base Rates:**
      *   *Question:* Do *any* stated commitments logically require knowledge of the *true* base rate `P(Y=1 | G)` for each group?
      *   *Sufficient Answer:* Analysis of commitments. Commitments like Equal FNR, Equal FPR, Equal PPV, or Equal NPV inherently depend on base rates differing across groups.
      *   *Output:*
          *   If **No** (e.g., only Calibration, Equal Predictive Values conditional on score): Proceed to Step 5.
          *   If **Yes**: Proceed to Step 4.

  4.  **Verify Base Rate Estimates:**
      *   *Question:* Can the true base rate `P(Y=1 | G)` be reliably estimated from the *available* validation data given the observation scope?
      *   *Sufficient Answer:*
          *   **Full Observation:** Direct calculation possible. Sufficient.
          *   **Partial Observation:** Requires strong, credible assumptions (e.g., missing completely at random - MCAR - regarding `Y` for unselected cases) *and* methodology (e.g., re-weighting) applied and validated where possible. Often insufficient.
      *   *Output:*
          *   If Reliable Estimate Possible: Record estimates. Proceed to Step 5.
          *   If **Not Reliable**: Return "**Internally Inconsistent Claim or Unverifiable - Send Back.** Commitment `X` requires base rates, which cannot be reliably established with current data/observation scope. Vendor/body must revise commitment or provide methodology for reliable estimation." (Applies to e.g., claiming Equal FNR/FPR with partial outcomes and no robust estimation).

  5.  **Check Mathematical Coherence of Commitments:**
      *   *Question:* Are the stated fairness commitments *mathematically compatible* within the deployment envelope, given the estimated or required base rate structure?
      *   *Sufficient Answer:* Apply known incompatibility results:
          *   **Calibration within Groups + Equal FPR + Equal FPR:** Logically **incompatible** unless base rates `P(Y=1 | G)` are equal *or* the model is perfect. If base rates differ (Step 4) and perfection is absent, this combination is impossible. Similar checks apply to other combinations (e.g., Calibration + Equal PPV/NPV often requires equal base rates).
          *   **Equal FPR + Equal FNR:** Logically **incompatible** unless base rates are equal *or* the model is perfect. Check base rates.
          *   **Calibration within Groups + Equal Predictive Parity (PPV):** Generally compatible only if base rates are equal or thresholds are set group-specifically (which may violate other commitments like equal selection rates).
      *   *Output:*
          *   If commitments are **Logically Incompatible**: Return "**Internally Inconsistent Claim - Send Back.** Commitments `X` and `Y` cannot hold simultaneously given differing base rates / model imperfection."
          *   If commitments are **Compatible**: Proceed to Step 6.

  6.  **Empirical Validation within Envelope:**
      *   *Question:* Using the validation data and the *specific deployment decision rule* (threshold/capacity), do the data support that the stated fairness commitments hold?
      *   *Sufficient Answer:* Statistical testing (e.g., chi-square, t-tests, KS tests where appropriate) of the relevant metrics (calibration curves/statistics, FPR, FNR, PPV, NPV, selection rates) *within the defined groups (G)*, applied *at the deployment threshold/capacity*, acknowledging uncertainty. Account for partial observation limitations (Step 2).
      *   *Output:*
          *   If commitments are **Statistically Supported**: Return "**Holds Under This Envelope.** Commitments empirically satisfied given current data and deployment parameters."
          *   If commitments are **Not Statistically Supported**: Return "**Claim Not Supported by Data - Investigate Discrepancy.** Commitment `X` not met within deployment envelope based on validation sample."
          *   If **Inconclusive** (e.g., low power, data limitations): Flag "**Evidence Inconclusive - Recommend Further Monitoring/Validation.**"

  7.  **Value Choice Hand-Off:**
      *   *Question:* Did the procedure reach Step 6 without flagging inconsistency or lack of support, but the commitments represent a *choice* between compatible fairness criteria (e.g., prioritizing Calibration vs. Equal FPR when base rates differ)?
      *   *Output:*
          *   If **Yes**: This is a political/policy choice. Return "**Coherent and Supported, but Represents Value Choice.** Body has chosen to prioritize `X` over `Y` given base rate disparity. Coherence and empirical hold verified. Value choice is for body and ministers."
          *   If **No** (inconsistency found or claim unsupported): Output already provided in Steps 4, 5, or 6.

  **Handling Complexities:**

  *   **Proxy Group Labels:** Acknowledge in Step 1/Reporting. Analysis is on the *defined proxy groups (G)*. Cannot assess fairness w.r.t. true protected characteristic. Flag "**Fairness assessed on proxy groups; potential bias w.r.t. true characteristic remains unknown.**"
  *   **Multiple Thresholds/Units:** Treat each distinct deployment (Unit + Threshold/Capacity) as a *separate envelope*. Run AFCAP independently for each. Commitment must hold for each envelope it is claimed for.

  ---

  **Application to Submissions:**

  1.  **Tax Authority (Audit Selection):**
      *   *Envelope:* Fixed capacity (top X%), Outcome = "Fraud Found", Groups = Defined, Outcome Observed = Partial (only audited).
      *   *Commitments:* Calibration within Groups + Equal FPR + Equal FNR.
      *   *AFCAP Run:*
          *   Step 1: Clear envelope/commitments.
          *   Step 2: Partial Outcome - Flag limitation re FNR/base rates.
          *   Step 3: Equal FPR/FNR require base rates.
          *   Step 4: Base rates unreliable (partial obs, fraud unlikely MCAR). **RETURN: "Internally Inconsistent Claim or Unverifiable - Send Back."** Commitment to Equal FNR/FPR requires base rates which cannot be reliably established. Vendor cannot validly claim all three simultaneously. Must drop at least one commitment involving error rates, or provide robust methodology for base rate estimation under selection.

  2.  **Council (Housing Inspections):**
      *   *Envelope:* Likely fixed capacity (top X%), Outcome = "Serious Hazard Found", Groups = Defined (e.g., borough, property type), Outcome Observed = Partial (only inspected). Statutory Duty: Equal FPR across groups.
      *   *Implicit Context:* Base rates (true hazard prevalence) differ across groups. Model outperforms old process.
      *   *AFCAP Run:*
          *   Step 1: Clear envelope; Commitment = Equal FPR (Statutory). Implicit desire for accuracy/calibration.
          *   Step 2: Partial Outcome - Flag limitation re FNR/base rates.
          *   Step 3: Equal FPR requires base rates? (No, FPR = P(Pred=1 | Y=0, G). But estimating FPR *requires* knowing `Y=0` cases. Problematic under partial observation).
          *   Step 4: **Can we estimate FPR?** FPR requires identifying `Y=0` cases *among those predicted positive (selected)*. We observe `Y` for the selected (inspected). We *can* calculate the *observed* FPR *for the selected cases*: `P(Y=0 | Selected, G)`. However, this is the **False Discovery Rate (FDR = 1 - PPV)**, *not* the true FPR `P(Selected | Y=0, G)`. The true FPR depends on the *unselected* `Y=0` cases, which are unobserved. Statutory duty likely intends true FPR, but estimation is impossible without strong assumptions. **RETURN: "Internally Inconsistent Claim or Unverifiable - Send Back." OR "Claim Not Supported by Data."** The council's statutory duty (Equal True FPR) cannot be empirically verified with partially observed outcomes. The observable metric (FDR/1-PPV) *can* be equalized, but this is a *different* fairness criterion (Equal PPV/Predictive Parity) and is generally incompatible with Equal FPR if base rates differ. The council must clarify the *operational definition* of "wrongly flagged" in the statute (Is it FPR or FDR?) and/or provide a legally acceptable methodology for estimating true FPR. They cannot credibly claim true Equal FPR is achieved with current data. This is the unwelcome answer – their statutory goal is likely unverifiable or incompatible with other desirable properties (like calibration) under base rate differences.

  ---

  **What AFCAP Cannot Tell Us:**

  1.  **Underlying Causality/Fidelity:** Whether the group definitions (`G`) are valid proxies for the true protected characteristic, or if the model is learning spurious or discriminatory correlations.
  2.  **Absolute Fairness/Morality:** Whether the *chosen* fairness criterion (even if coherent and met) is the "right" or "moral" choice for the context. This is a value judgement for the body and ministers.
  3.  **Overall Model Quality/Bias:** Whether the model is accurate, fit for purpose, or introduces other biases not covered by the specific group commitments (e.g., intersectional bias, bias against unmeasured groups).
  4.  **Long-Term/Strategic Effects:** The societal, behavioural, or long-term consequences of using the model and its chosen fairness criterion.
  5.  **Complete Robustness under Partial Observation:** It highlights the limitation but cannot magically overcome the fundamental lack of data on unselected cases. Conclusions involving unobserved outcomes remain tentative.
  6.  **Appropriateness of Deployment Envelope:** Whether the chosen threshold, capacity, or outcome definition is itself fair or optimal.

  AFCAP provides a rigorous, procedural check for *internal coherence* and *empirical verification within stated bounds*. It exposes mathematical impossibilities and data limitations, forcing clarity on commitments and capabilities, but cannot resolve the deeper ethical and political choices inherent in algorithmic decision-making.
