  We are creating a variant of the centipede game with four nodes and a "side door" option. The game proceeds as follows:

  - Nodes: 
    - Node 1: Ada moves (first move)
    - Node 2: Bob moves
    - Node 3: Ada moves
    - Node 4: Bob moves

  At each node, the mover has three choices:
  1. Take: ends the game, payoffs as specified per node.
  2. Pass: passes to the next node (except at node 4, where pass ends with (12,12)).
  3. Open the side door: ends the game, with the opener getting 9 and the other 10.

  Payoffs for Take:
  - At node 1: (4, 1) [Ada takes]
  - At node 2: (3, 8) [Bob takes]
  - At node 3: (14, 6) [Ada takes]
  - At node 4: (11, 22) [Bob takes]   [Note: In part (b) we change this to (16,22) for Ada's payoff]

  Payoffs for Open:
  - Ada opens: (9,10)
  - Bob opens: (10,9)

  Pass at node 4: (12,12)

  We now design the question and model answer.

  **The Question:**

  **Game Specification:**

  Two players, Ada and Bob, play a game over four decision nodes. Ada moves at nodes 1 and 3, Bob at nodes 2 and 4. At each node, the mover has exactly three options:

  - **Take**: The game ends with the following payoffs (Ada, Bob):
    - At node 1: (4, 1)
    - At node 2: (3, 8)
    - At node 3: (14, 6)
    - At node 4: (11, 22)   [Note: For part (b), change Ada's payoff to 16 at node 4 when Bob takes]
  - **Pass**: 
    - At nodes 1, 2, and 3: the move passes to the other player at the next node.
    - At node 4: the game ends with (12, 12).
  - **Open the side door**: The game ends immediately. If Ada opens, payoffs are (9, 10). If Bob opens, payoffs are (10, 9).

  **Part (a)** [5 marks]  
  Using backward induction, determine the following for the game as specified (with node 4 take by Bob giving (11,22)):  
  (i) The complete strategy for Ada (specifying what she does at nodes 1 and 3) and for Bob (specifying what he does at nodes 2 and 4).  
  (ii) The path of play that is actually taken.  
  (iii) The resulting payoffs.

  **Part (b)** [5 marks]  
  Now change the payoff to Ada when Bob takes at node 4 to 16 (so Bob taking at node 4 yields (16,22)), leaving all other payoffs unchanged. Redo the backward induction starting from node 4 and determine what happens at nodes 2 and 1. Explicitly note which of these nodes (node 2 and node 1) are reached in the original game (from part (a)) and which are reached in this modified game.

  **Part (c)** [10 marks]  
  The backward induction solution in part (a) has Bob opening the side door at node 2, yielding (10,9). This outcome is Pareto dominated by the outcome (12,12) that would result if both passed until node 4 and then Bob passed.  
  (i) Explain why the dependence of the backward induction solution on a payoff at a node that is not reached (as exposed in part (b)) is at the heart of the paradox, rather than an artefact of the specific numbers.  
  (ii) Why does the familiar reply that arriving at a late node would provide evidence that the opponent is not rational not repair the backward induction argument in this case?  
  (iii) Is the requirement that a strategy must specify an optimal move at every node (even those that the strategy itself prevents from being reached) a necessary part of rationality, or is it an additional assumption? What happens to the backward induction argument if we drop that requirement?  

  ---

  **Model Answer:**

  **Part (a)**  
  We solve by backward induction.

  - Start at node 4 (Bob's move). Bob's options:
    - Take: (11,22)
    - Pass: (12,12)
    - Open: (10,9) [if Bob opens]
    Bob compares his payoffs: 22 (Take) vs 12 (Pass) vs 9 (Open). He prefers 22, so he would Take. Thus, at node 4: Bob chooses Take, yielding (11,22).

  - Now move to node 3 (Ada's move). Ada's options:
    - Take: (14,6)
    - Pass: then the game goes to node 4, which we just found leads to (11,22) [because Bob takes]
    - Open: (9,10)
    Ada compares her payoffs: 14 (Take) vs 11 (Pass leads to Bob taking at 4) vs 9 (Open). She prefers 14, so she would Take. Thus, at node 3: Ada chooses Take, yielding (14,6).

  - Now node 2 (Bob's move). Bob's options:
    - Take: (3,8)
    - Pass: then the game goes to node 3, which leads to (14,6) [because Ada takes]
    - Open: (10,9)
    Bob compares his payoffs: 8 (Take) vs 6 (Pass leads to Ada taking at 3) vs 9 (Open). He prefers 9 (Open) over 8 and 6. Thus, at node 2: Bob chooses Open, yielding (10,9).

  - Now node 1 (Ada's move). Ada's options:
    - Take: (4,1)
    - Pass: then the game goes to node 2, which we found leads to (10,9) [because Bob opens]
    - Open: (9,10)
    Ada compares: 4 (Take) vs 10 (Pass leads to Bob opening at 2) vs 9 (Open). She prefers 10 (by passing) over 9 and 4. Thus, at node 1: Ada chooses Pass.

  The complete strategies:
  - Ada: At node 1, Pass; at node 3, Take.
  - Bob: At node 2, Open; at node 4, Take.

  The path of play: Ada passes at node 1, then Bob opens at node 2. So the game ends at node 2 with Bob opening. Payoffs: (10,9).

  **Part (b)**  
  We change Bob's take at node 4 to yield (16,22) for Ada and Bob respectively.

  - Node 4 (Bob): 
    - Take: (16,22)
    - Pass: (12,12)
    - Open: (10,9)
    Bob still prefers 22 (Take) over 12 and 9. So he Takes.

  - Node 3 (Ada): 
    - Take: (14,6)
    - Pass: leads to (16,22) [Bob takes at 4]
    - Open: (9,10)
    Ada compares: 14 (Take) vs 16 (Pass) vs 9 (Open). She prefers 16, so she Passes.

  - Node 2 (Bob): 
    - Take: (3,8)
    - Pass: leads to node 3, which now leads to (16,22) [because Ada passes and then Bob takes at 4? Wait, let's see: after Bob passes at 2, Ada at node 3 passes? But then Bob at node 4 takes, so (16,22).]
    - Open: (10,9)
    Bob compares: 8 (Take) vs 22 (Pass leads to (16,22) for the whole path? Note: Bob's payoff in (16,22) is 22) vs 9 (Open). He prefers 22, so he Passes.

  - Node 1 (Ada): 
    - Take: (4,1)
    - Pass: leads to node 2, which now leads to Bob passing, then to node 3 (Ada passes) and then node 4 (Bob takes) so (16,22)
    - Open: (9,10)
    Ada compares: 4 vs 16 vs 9. She prefers 16, so she Passes.

  Thus, the strategies:
  - Ada: node1: Pass, node3: Pass
  - Bob: node2: Pass, node4: Take

  Path: Ada passes at 1, Bob passes at 2, Ada passes at 3, Bob takes at 4. Payoffs: (16,22).

  In the original game (part (a)), node 2 was reached (because Ada passed at 1) and Bob opened at node 2. Node 3 and 4 were not reached. In the modified game, node 2 is reached (Ada passes at 1) and Bob passes at node 2, so node 3 is reached (Ada passes) and node 4 is reached (Bob takes).

  **Part (c)**  
  (i) The paradox lies in two features that are independent of the specific numbers. First, the backward induction solution in part (a) yields (10,9) which is Pareto dominated by (12,12) that would occur if both passed until the end. Both players would prefer (12,12) to (10,9). Second, the backward induction argument relies on the assumption that players optimize at every node, including nodes that the argument itself says will never be reached (e.g., node 3 and 4 in part (a)). The modification in part (b) shows that changing a payoff at node 4 (which is off the equilibrium path in part (a)) alters the behavior at node 2 and node 1. This demonstrates that the solution is sensitive to payoffs at nodes that are not reached in the original equilibrium. The paradox is that the argument requires counterfactual reasoning about what would happen at nodes that the theory says are irrelevant because they are not reached. But if the players believe the theory, then they should not expect to reach those nodes, so why should the payoffs there matter? Yet the induction requires them to matter.

  (ii) The familiar evidential reply says that if a player finds themselves at a late node, it must be because the opponent did not play rationally earlier, so they should update their beliefs. However, in this game, the backward induction path ends at node 2. The players never reach node 3 or 4. Therefore, the evidential reply does not apply because the path does not require the players to update about nodes that are off the path. Moreover, the evidential reply does not explain why at node 1, Ada would pass. She passes because she expects Bob to open at node 2. Bob at node 2 opens because he expects that if he passes, Ada will take at node 3. But if Bob were to pass, then Ada at node 3 would have to consider why she is there. The evidential reply would suggest that Ada, at node 3, might think Bob is irrational, but the backward induction argument does not allow for that: it simply assumes rational play at every node. The paradox is that the backward induction solution is self-undermining: it requires that Bob at node 2 believes that if he passes, Ada at node 3 will take (as per the induction), but if Bob passes, that would be a deviation from the equilibrium, and then why should Ada believe Bob is rational? The standard reply does not repair the argument because it introduces a contradiction: the induction requires fixed beliefs in the counterfactual, but the evidential update would change those beliefs.

  (iii) The requirement that a strategy must be optimal at every node, including those that the strategy prevents from being reached, is an additional assumption beyond rationality. Rationality per se requires that a player chooses optimally given their beliefs. But in a sequential game, a player's beliefs about what would happen off the equilibrium path are not directly given by the equilibrium. The backward induction solution assumes that players hold the belief that even off the equilibrium path, the opponent will play according to the backward induction strategy. This is a strong assumption of "persistent rational play" regardless of history. If we drop that assumption, then at nodes that are off the equilibrium path, players may have different beliefs about what the opponent would do. For example, in the original game, if Bob were to pass at node 2 (which he doesn't in equilibrium), Ada at node 3 might believe that Bob is irrational and therefore might pass at node 4? Then she might pass at node 3 to get to node 4 and get 12 instead of taking 14? But that would require a different belief. The backward induction argument collapses if we allow for the possibility that players might not play according to the induction off the path. Without the assumption, we cannot derive a unique solution by backward induction because the optimality at a node depends on beliefs about behavior at subsequent nodes, which in turn depend on how players interpret deviations.

  ---

  **Marking Scheme (Total: 20 marks):**

  **Part (a) [5 marks]**
  - Must-hit points:
    1. At node 4: Bob takes (payoff (11,22)) [1 mark]
    2. At node 3: Ada takes (payoff (14,6)) [1 mark]
    3. At node 2: Bob opens (payoff (10,9)) [1 mark]
    4. At node 1: Ada passes [1 mark]
    5. Path: node1 (Pass) -> node2 (Open), payoffs (10,9) [1 mark]

  Common mistakes:
  - Starting from node 1 instead of node 4.
  - Confusing the side door payoffs: e.g., thinking that when Bob opens, he gets 9 (but actually he gets 9 only if he is the opener? No, when Bob opens, he gets 9 and Ada gets 10? Actually, the spec: Bob opening yields (10,9) meaning (Ada, Bob) = (10,9). So Bob gets 9. But sometimes students might reverse the players.
  - Forgetting to compare all three options at a node.

  **Part (b) [5 marks]**
  - Must-hit points:
    1. At node 4: Bob still takes (now (16,22)) [1 mark]
    2. At node 3: Ada now passes (because 16 > 14) [1 mark]
    3. At node 2: Bob now passes (because 22 > 8 and 22 > 9) [1 mark]
    4. At node 1: Ada now passes (because 16 > 4 and 16 > 9) [1 mark]
    5. Note: In the original game (a), node 2 was reached (and node 3 and 4 were not). In the modified game, node 2, 3, and 4 are reached. [1 mark]

  Common mistakes:
  - Not changing the payoff at node 4 correctly.
  - Failing to redo the induction from the back and thus not updating node 3 and then node 2.
  - Not noting which nodes are reached in each game.

  **Part (c) [10 marks]**
  - Must-hit points (with weights):
    1. Explains that the paradox lies in the Pareto inefficiency of the outcome and the dependence on off-path payoffs (which is not an artefact because the same structure appears in any centipede: the outcome is inefficient and the induction uses off-path nodes) [3 marks]
    2. Explains why the evidential reply fails: because the backward induction path ends early, and the counterfactual reasoning at node 2 about node 3 (which is off the path) is what drives the result, but if Bob passes at node 2 (a deviation), then Ada at node 3 would have evidence of irrationality and might change her play, undermining the induction. Also, the evidential reply does not address why the players are at the early nodes. [3 marks]
    3. Distinguishes rationality (choosing optimally given beliefs) from the assumption that a strategy must be optimal at every node (which is a belief assumption: that the opponent will play the backward induction strategy even off the path). Then explains that without that assumption, the backward induction fails because optimal moves depend on beliefs about off-path behavior, which are not fixed. [4 marks]

  Common mistakes:
  - Stating that the side door dissolves the paradox because it allows cooperation: but note the outcome (10,9) is still inefficient compared to (12,12).
  - Asserting the evidential reply without noticing that in this game the backward induction path does not reach the late nodes, so the update doesn't occur on the path, and the counterfactual at node 2 about node 3 is crucial.
  - Conflating the requirement of optimality at unreached nodes with rationality as such.

  **Grade Separation:**
  - **A answer (18-20 marks)**: Correctly computes both parts (a) and (b), and for (c) clearly distinguishes the belief assumption from rationality and explains how the induction fails without that assumption. Also, clearly articulates why the evidential reply does not fix the problem and why the off-path dependence is the core of the paradox.
  - **B answer (15-17 marks)**: Correct computation in (a) and (b), and in (c) restates the standard dialectic (e.g., mentioning the evidential reply and that the outcome is inefficient) but does not fully separate the belief assumption from rationality or does not explain the failure of the evidential reply in this specific structure.

  Note: Lower marks for computational errors and incomplete conceptual answers.
answer: |-
  ### Final Exam Question: Backward Induction in a Modified Centipede Game

  **Game Specification**  
  Two players, Ada and Bob, alternate moves over four decision nodes: Ada moves at nodes 1 and 3, Bob at nodes 2 and 4. At each node, the mover has three options:  
  - **Take**: Game ends with payoffs (Ada, Bob):  
    - Node 1: (4, 1)  
    - Node 2: (3, 8)  
    - Node 3: (14, 6)  
    - Node 4: (11, 22)  
  - **Pass**:  
    - Nodes 1–3: Move passes to the other player.  
    - Node 4: Game ends with (12, 12).  
  - **Open the side door**: Game ends immediately.  
    - Ada opens: (9, 10)  
    - Bob opens: (10, 9)  

  ---

  **Part (a)** [5 marks]  
  Using backward induction, determine:  
  (i) The complete strategy for Ada (at nodes 1 and 3) and Bob (at nodes 2 and 4).  
  (ii) The actual path of play.  
  (iii) The resulting payoffs.  

  **Part (b)** [5 marks]  
  Change *only* Ada’s payoff if Bob takes at node 4 to 16 (so Bob taking yields (16, 22)), with all else unchanged. Redo backward induction far enough to determine what happens at nodes 2 and 1. Explicitly state which of these nodes (2 or 1) are reached in the original game (Part (a)) and which are reached in this modified game.  

  **Part (c)** [10 marks]  
  The backward induction outcome in (a) is Pareto-dominated by (12, 12). Explain:  
  (i) Why the dependence exposed in (b) (i.e., the outcome changing due to an off-path payoff) reveals the core paradox, independent of specific numbers.  
  (ii) Why the "evidential reply" (arrival at a late node signals irrationality) fails to repair the backward induction argument here.  
  (iii) Whether requiring optimality at unreachable nodes is inherent to rationality or an added assumption. What happens to backward induction if we drop it?  

  ---

  ### Model Answer (≈700 words)  

  **Part (a)**  
  *Backward induction*:  
  - **Node 4 (Bob)**: Options: Take (11,22), Pass (12,12), Open (10,9). Bob maximizes his payoff: 22 > 12 > 9 → **Takes**.  
  - **Node 3 (Ada)**: Options: Take (14,6), Pass → Node 4 → (11,22) (Bob takes), Open (9,10). Ada compares: 14 > 11 > 9 → **Takes**.  
  - **Node 2 (Bob)**: Options: Take (3,8), Pass → Node 3 → (14,6) (Ada takes), Open (10,9). Bob compares: 9 (Open) > 8 (Take) > 6 (Pass) → **Opens**.  
  - **Node 1 (Ada)**: Options: Take (4,1), Pass → Node 2 → (10,9) (Bob opens), Open (9,10). Ada compares: 10 (Pass) > 9 (Open) > 4 (Take) → **Passes**.  

  *(i) Strategies*:  
  - Ada: At node 1, **Pass**; at node 3, **Take**.  
  - Bob: At node 2, **Open**; at node 4, **Take**.  

  *(ii) Path*: Ada passes at node 1 → Bob opens at node 2.  
  *(iii) Payoffs*: (10, 9).  

  **Part (b)**  
  Adjusted payoff at node 4: Bob takes → (16, 22).  
  - **Node 4 (Bob)**: Take (16,22) > Pass (12,12) > Open (10,9) → **Takes** (unchanged).  
  - **Node 3 (Ada)**: Take (14,6) vs. Pass → (16,22) vs. Open (9,10). Ada prefers 16 > 14 → **Passes**.  
  - **Node 2 (Bob)**: Take (3,8) vs. Pass → Node 3 → Ada passes → Node 4 → Bob takes → (16,22) vs. Open (10,9). Bob prefers 22 > 9 → **Passes**.  
  - **Node 1 (Ada)**: Take (4,1) vs. Pass → Node 2 → Bob passes → Node 3 → Ada passes → Node 4 → (16,22) vs. Open (9,10). Ada prefers 16 > 9 → **Passes**.  

  *Reached nodes*:  
  - Original game (Part a): Node 1 (reached), node 2 (reached). Nodes 3/4 unreached.  
  - Modified game: Node 1 (reached), node 2 (reached), node 3 (reached), node 4 (reached).  

  **Part (c)**  
  *(i) Core paradox*: The result in (a) ((10,9) via node 2) is Pareto-dominated by (12,12), which is achievable if both pass to node 4 and Bob passes. The dependence in (b) (changing an off-path payoff at node 4 alters behavior at nodes 1–2) shows the paradox is structural, not numerical. Backward induction requires players to optimize using payoffs at nodes the prediction itself deems unreachable (e.g., node 4 in (a)). This creates a self-referential inconsistency: the argument assumes nodes 3/4 are irrelevant because they won’t be reached, yet uses them to justify earlier moves. The paradox lies in this circularity—off-path payoffs drive on-path choices, but players who believe the prediction should ignore those payoffs.  

  *(ii) Failure of evidential reply*: The standard reply—arrival at a late node (e.g., node 3) signals irrationality—does not resolve the paradox here. In (a), node 3 is never reached, so no updating occurs. Yet Bob’s choice at node 2 (to open) depends *counterfactually* on what Ada *would* do at node 3. If Bob passed (deviating from equilibrium), Ada at node 3 would observe an "irrational" pass by Bob and might revise her strategy (e.g., pass to get (12,12)), undermining the backward induction assumption that she takes. Thus, the evidential reply introduces beliefs inconsistent with the induction’s requirement of fixed off-path rationality. The paradox persists because backward induction demands players ignore belief revisions its own prediction would trigger.  

  *(iii) Optimality at unreachable nodes*: This is an **added assumption**, not inherent to rationality. Rationality requires choosing optimally *given beliefs* at reached nodes. The requirement to specify optimal actions at unreachable nodes is a *belief assumption*: that opponents play rationally even after deviations. If we drop it:  
  - Backward induction fails, as optimality depends on beliefs about off-path play.  
  - In (a), if Bob passes at node 2 (a deviation), Ada at node 3 might believe Bob is irrational and expect him to pass at node 4, so she passes (to get (12,12) > (14,6)). Bob, anticipating this, might pass at node 2 to get 22 (via (16,22)) > 9 (opening). This could support (12,12) as an equilibrium.  
  - Without the assumption, multiple equilibria emerge, and backward induction loses its predictive power.  

  ---

  ### Marking Scheme (20 marks total)  
  **Part (a) [5 marks]**  
  1. **Node 4**: Bob takes (1 mark). *Common error: Misses Take > Pass/Open.*  
  2. **Node 3**: Ada takes (1 mark). *Common error: Incorrect comparison with node 4 outcome.*  
  3. **Node 2**: Bob opens (1 mark). *Common error: Assumes Pass dominates, ignoring Open’s payoff (9 > 6).*  
  4. **Node 1**: Ada passes (1 mark). *Common error: Takes or Opens, missing Pass → (10,9) > (9,10)/(4,1).*  
  5. **Path/payoffs**: Pass at 1 → Open at 2 → (10,9) (1 mark). *Common error: Wrong path (e.g., stops at Take) or payoffs.*  

  **Part (b) [5 marks]**  
  1. **Node 4**: Bob takes (1 mark). *Common error: Unchanged from (a) without checking.*  
  2. **Node 3**: Ada passes (1 mark). *Common error: Still takes, missing 16 > 14.*  
  3. **Node 2**: Bob passes (1 mark). *Common error: Opens or takes, missing 22 > 9.*  
  4. **Node 1**: Ada passes (1 mark). *Common error: Takes/Opens, missing 16 > 9.*  
  5. **Reached nodes**: Original: nodes 1–2 reached; Modified: all reached (1 mark). *Common error: Fails to compare games.*  

  **Part (c) [10 marks]**  
  1. **Paradox core**: Pareto inefficiency + off-path dependence (not numerical) (3 marks). *Common error: Blames specific payoffs; misses structural dominance.*  
  2. **Evidential reply failure**: Path ends early; counterfactual at node 2 uses node 3, but deviation would trigger belief change (3 marks). *Common error: Claims reply works; misses unreachability in (a).*  
  3. **Assumption separation**: Distinguishes rationality (belief-contingent) from off-path optimality (added); explains induction fails without it (4 marks). *Common error: Equates the two; no alternative equilibrium.*  

  **Grade Separation**  
  - **A (18–20)**: Hits all (c) points: clearly separates rationality from off-path assumption, explains belief revision undermines induction, and identifies structural paradox.  
  - **B (15–17)**: Correct computation (a/b), but (c) restates standard dialectic (e.g., "evidence fixes it" or "inefficiency is puzzling") without separating assumptions or addressing counterfactuals.  
  - **Lower**: Errors in computation or superficial (c) (e.g., "side door allows cooperation, so no paradox").
