answer: |-
  Below is a one-page decision tree designed for your debate night. It starts from the shared commitment that turning away an imminent violent threat is not automatically wrong. The tree uses 9 binary branch nodes (yes/no questions) to sort participants into 12 distinct leaves (positions), incorporating your requested cases and distinctions. Each branch is a concrete scenario or claim, phrased to avoid presupposing abstract principles. Empty cells (unoccupied positions) are flagged, and collisions (where different paths lead to the same leaf) are noted. Awkward commitments are summarized in one sentence at each leaf.

  ---

  ### **Immigration Decision Tree**

  **Start Here:**  
  **Q1.** Should the state turn away someone who truthfully announces they intend to burn down parliament and shoot people inside?  
  - **No → Leaf 1: Absolute Open Borders**  
    *Awkward commitment: Must admit even those openly planning violence.*  
  - **Yes → Q2.**

  **Q2.** Suppose a family flees a famine caused by natural disaster (nobody’s fault). Must the state admit them?  
  - **No → Q3.**  
  - **Yes → Q6.**

  **Q3.** Suppose a doctor arrives with a job offer. Must the state admit them?  
  - **No → Q4.**  
  - **Yes → Leaf 2: Remedial-Only Exclusion**  
    *Awkward commitment: May exclude the famine family but must admit the doctor—only threats or economic burdens justify exclusion.*  

  **Q4.** Suppose a retiree will buy a house and pay more in taxes than they cost in services. Must the state admit them?  
  - **No → Q5.**  
  - **Yes → Leaf 3: Welfare-State-as-Club-Good**  
    *Awkward commitment: May exclude the doctor if they strain public resources but must admit the retiree as a "net contributor."*  

  **Q5.** Should the state be required to admit anyone willing to pay a price that fully compensates current citizens for any loss? (Auction model)  
  - **No → Leaf 4: Outright Sovereignty**  
    *Awkward commitment: May exclude the retiree for any reason (e.g., cultural dislike) or no reason.*  
  - **Yes → Leaf 5: Auction Model**  
    *Awkward commitment: Must admit the famine family if they pay—even if citizens object non-financially.*  

  **Q6.** Suppose a group wants to buy an empty region, move in, and secede. Must the state admit them?  
  - **No → Q7.**  
  - **Yes → Leaf 6: Secession-Friendly Open Borders**  
    *Awkward commitment: Must admit groups planning secession if they buy land.*  

  **Q7.** Suppose 10 million people arrive at once. Is it permissible to exclude them, even if admitting the same 10 million over 40 years would be fine?  
  - **No → Q8.**  
  - **Yes → Leaf 7: National Self-Determination**  
    *Awkward commitment: May exclude the famine family to avoid cultural/economic disruption, even if they’re blameless.*  

  **Q8.** If 51% of citizens vote to admit a migrant, but one citizen objects because she simply doesn’t want to associate with them, should that objection block admission?  
  - **No → Q9.**  
  - **Yes → Leaf 8: Unanimous Consent Requirement**  
    *Awkward commitment: One citizen can exclude the doctor with a job offer due to personal dislike.*  

  **Q9.** If 51% of citizens vote to admit a migrant, but an objector argues the migrant will vote for policies making existing citizens worse off (not destitute), should that block admission?  
  - **No → Leaf 9: Priority-to-Worst-Off Open Borders**  
    *Awkward commitment: Must admit the famine family even if it strains resources—priority is global need.*  
  - **Yes → Leaf 10: Associative-Freedom Open Borders**  
    *Awkward commitment: Must admit the retiree if citizens consent, even if they vote to cut public services.*  

  ---

  ### **Leaves Summary**
  1. **Absolute Open Borders**: Awkward commitment as above.  
  2. **Remedial-Only Exclusion**: Awkward commitment as above.  
  3. **Welfare-State-as-Club-Good**: Awkward commitment as above.  
  4. **Outright Sovereignty**: Awkward commitment as above.  
  5. **Auction Model**: Awkward commitment as above.  
  6. **Secession-Friendly Open Borders**: Awkward commitment as above.  
  7. **National Self-Determination**: Awkward commitment as above.  
  8. **Unanimous Consent Requirement**: Awkward commitment as above.  
  9. **Priority-to-Worst-Off Open Borders**: Awkward commitment as above.  
  10. **Associative-Freedom Open Borders**: Awkward commitment as above.  
  11. **Empty Cell A** (Reached via Q2→No, Q6→No, Q7→No, Q8→No, Q9→Yes): *Unoccupied. Path is incoherent: Requires prioritizing global need but allowing exclusion if citizens object to policy impacts—contradicts Q9’s "No."*  
  12. **Empty Cell B** (Reached via Q2→No, Q6→No, Q7→No, Q8→Yes): *Unoccupied. Unattractive: Lets one person exclude anyone, but only if scale isn’t an issue—too niche.*  

  ---

  ### **Collisions & Notes**
  - **Leaf 9 vs. Leaf 10 (Open Borders variants)**: These *collide* on almost all cases (e.g., both admit the famine family and doctor). They only *prised apart* by the secession case: Leaf 9 *may* exclude the secession group (if it harms the worst-off), while Leaf 10 *must* admit them (if citizens consent).  
  - **Leaf 7 (National Self-Determination) vs. Leaf 4 (Outright Sovereignty)**: *Collide* on excluding the retiree/doctor. Prised apart by the land claim case: Leaf 7 *must* admit someone whose family was driven off the land six generations ago (remedial justice), while Leaf 4 *may* exclude them.  
  - **Departure Test**: Embedded in Q3→Yes→Leaf 2 (remedial view discounts exclusion if a state forbids emigration).  
  - **Scale Case**: Explicit in Q7 (10 million at once vs. over 40 years).  
  - **Libertarian vs. National Self-Determination**: Not separate leaves—they *collapse* into Leaf 7. Both answer identically on all cases unless cultural preservation is invoked (rare in practice).  

  This tree forces distinctions between exclusion, conditional admission, and selection methods (e.g., Q5 covers entry fees, Q3–Q4 cover conditional workers/net contributors). Empty cells are flagged, and collisions are transparent. Use it to spark nuanced debate—no reading required!
