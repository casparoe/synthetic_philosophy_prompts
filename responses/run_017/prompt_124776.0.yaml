prompt: |-
  Three of us run an informal philosophy of science reading group — me, Wes (he does phil of physics), and Marisol (she does ML). We spent a session on the problem of old evidence, I thought we'd settled it, and then Marisol emailed me an argument that seems to show our solution lets you confirm basically anything, and I've been going in circles for a week. Can you find the step that breaks?

  Background, short version. Standard Bayesian confirmation: E confirms H for S only if P(H|E) > P(H), equivalently P(E|H) > P(E). But if S already knows E, then P(E) = 1, and P(E|H) = 1 too, so nothing S already knows can confirm anything. That's the problem of old evidence. The stock illustration is the one about the orbit of Mercury, but the case I actually care about is a different one.

  The fix we liked — call it the rollback — is this: don't evaluate confirmation at S's actual state; evaluate it at the state S would have been in before E came in. Strip E out of S's evidence, hold the rest fixed, and ask whether conditionalizing on E *there* would raise P(H). In that state E need not have probability 1, so old evidence can confirm after all. We liked it because it handles:

  THE TAPE CASE. A survey group has a decade of raw data sitting on a drive in a cabinet. Nobody has reduced it; nobody knows what pattern is on it. Years later someone fits a model, and the model predicts a pattern that is sitting on the drive. Intuitively that data confirms the model. The rollback delivers it: in the rolled-back state the team had the drive but not the numbers, so P(E) < 1 there, and the model entails E, so P(E|H) = 1 > P(E).

  Marisol's argument that this proves too much:

  (1) Confirmation is exactly what the rollback says it is: E confirms H for S iff, in S's total evidence with E deleted and everything else held fixed, P(H|E) > P(H).
  (2) The tape case is a genuine case of confirmation, and the rollback is what explains why: at the rolled-back state P(E) < 1 even though the evidence was in the group's physical possession the whole time.
  (3) Nothing in the rollback appeals to how E was acquired, when, or whether anyone went looking. It uses only two facts: that P(E) < 1 in the rolled-back state, and that H entails E. So if it works for the tape it works for anything with those two features.
  (4) For any hypothesis H and any contingent D, H entails H-or-D. So take your favourite H — that the expansion rate is such-and-such, that my neighbour's dog ate my hedge, whatever — and take a boring D you already know: "either H or my bike has a flat tyre." You know that disjunction, so it's old evidence; H entails it; and in the rolled-back state its probability is below 1. By (1) and (3) it confirms H.
  (5) The usual defences don't touch it. It isn't ad hocness or overfitting: H entails the disjunction with no adjustable knobs, whatever the world is like. It isn't that the evidence is irrelevant in the ordinary sense — its probability does go to 1 under H. "But you'd have to actually learn E" is answered by (2): the tape case works precisely because we evaluate from a state where E hasn't been learned. And if you object that you can't delete the disjunction without also deleting the known disjunct that makes it known, fine — delete that too; the inequality still goes through, and there are plenty of D's you don't know anyway, where the deletion is clean.
  (6) So on our own fix, every hypothesis with nonzero prior is confirmed by infinitely many propositions its holder already has in hand, for free, with nobody doing anything.
  (7) But confirmation isn't free, and the tape case isn't free either: what makes it worth something is that someone went to the cabinet, reduced the data, and noticed the fit.
  (8) So the rollback is either trivializing or it has to lean on something beyond the counterfactual probability assignment — something about what the agent was actually in a position to find out. Which is worrying, because that something looks like it rewards ignorance: someone who sees at a glance that H entails H-or-D gets no confirmation, and a logically ideal agent, who sees every consequence of everything, would get confirmation from nothing at all.

  So: which step do you reject, and what does rejecting it cost? I want to keep (2) — the tape case really is confirmation, and really is the same phenomenon as the Mercury case, not a separate thing — and I'd like to keep the basic Bayesian identity from the setup if at all possible. I'll give up nearly anything else. My own guess is that the trouble is in (1), and that "delete E, hold everything else fixed" isn't a well defined operation, or at least isn't well defined in the cases (4) needs it to be — but I can't say what the constraint is or where it would come from. If the right answer is that confirmation has to be relativized to something other than a single proposition — a partition, a possible observation, a method, whatever — say so, and tell me what that costs the tape case.
reasoning: |-
  I'm dealing with this problem of old evidence in Bayesian confirmation theory. The rollback solution seems to handle the tape case well, but Marisol argues it leads to trivial confirmation for any hypothesis via known disjunctions. I need to find where this argument goes wrong.

  First, recall the setup: In Bayesian terms, E confirms H if P(H|E) > P(H), which is equivalent to P(E|H) > P(E). But if E is already known, P(E) = 1 and P(E|H) = 1, so no confirmation. The rollback fixes this by considering a state where E isn't known, so we delete E from the evidence, hold other things fixed, and check if P(H|E) > P(H) in that state.

  In the tape case, the data E is on the drive but not reduced, so in the rolled-back state where E isn't known, P(E) < 1, and since H entails E, P(E|H) = 1 > P(E), so E confirms H. That seems right.

  Marisol's argument: Take any hypothesis H and some boring D that I know, like "my bike has a flat tire." I know the disjunction H or D because I know D is true (say, D is "bike has flat tire," and it does, so H or D is true). H entails H or D, so in the rolled-back state where I don't know this disjunction, P(H or D) < 1, and P(H or D | H) = 1 > P(H or D), so H or D confirms H. But that seems absurd; learning a disjunction I already know shouldn't confirm H, especially since I know it because of D, not H.

  The key point is that in the rollback, when we "delete E and hold everything else fixed," for E being H or D, if I know D, then deleting E might require deleting D or something, because my knowledge of E depends on D. But Marisol says, fine, delete D too; then in the state without E or D, P(E) = P(H or D) might be less than 1, and P(E|H) = 1, so still P(E|H) > P(E), so E confirms H.

  But in that state, without D, P(E) could be low, but since H entails E, it should confirm, but intuitively it shouldn't.

  Also, for D that I don't know, it might be cleaner, but let's focus on the case where I know D.

  The problem is that confirmation seems too easy.

  Now, step (8) says that confirmation isn't free, and in the tape case, it's because someone reduced the data and noticed the fit. But in the rollback, that's not captured; it's just about the probability in the counterfactual state.

  So perhaps the issue is that the rollback operation isn't well-defined when E is logically related to other evidence.

  For example, in the disjunction case, H or D, if I know D, then E is entailed by D, so to delete E, I might need to delete D or weaken my belief in D.

  But in the rollback, we're supposed to hold everything else fixed except deleting E. But if E is a logical consequence of other evidence, deleting E might not make sense without changing other things.

  The rollback is defined as deleting E from the evidence, meaning we remove E from the set of known propositions, but keep all other beliefs the same. But if I know D, and D implies E, then if I still know D, I should still believe E, so I can't consistently delete E while holding D fixed.

  That might be the crux.

  In probability terms, if my current probability has P(D) = 1, and D implies E, then P(E) = 1. If I want to set P(E) < 1, I must set P(D) < 1 or something, but the rollback says to hold everything else fixed, which might include P(D) = 1.

  So there's an inconsistency.

  For the rollback to have P(E) < 1, I need to be in a state where the evidence doesn't force E to be true, which might require not having evidence that entails E.

  In the disjunction case, if I know D, and D implies E (where E is H or D), then E is entailed, so to have P(E) < 1 in rolled-back, I must not have that evidence.

  But the operation "delete E and hold everything else fixed" might not be possible if E is logically implied by other evidence.

  Therefore, for the rollback to be well-defined, E must be such that it can be deleted without logical contradiction with the remaining evidence.

  In other words, E should not be entailed by the remaining evidence set.

  In the tape case, E is the specific data pattern, and the remaining evidence includes having the tape but not having reduced it, so E is not entailed; it's possible to have the tape and not know E.

  Whereas for H or D, if I know D, then H or D is entailed, so I can't delete it while keeping D.

  Similarly, if I delete D as well, then in the state without D and without E, P(E) = P(H or D) might be less than 1, but now I've deleted more than just E.

  Marisol says in (5) that if you object, delete D too, and it still works.

  But let's see what happens.

  In the actual state, I know D and I know E (H or D). I want to evaluate confirmation of H by E.

  Rollback: delete E, so now I don't know E, but I might still know D? But if I know D, and D implies E, I must believe E, so inconsistency.

  So to avoid inconsistency, when we delete E, we might need to suspend judgment on propositions that entail E.

  But the rollback says "hold everything else fixed," which probably means keep the same probabilities for other propositions.

  But if P(D) = 1 and D implies E, then P(E) must be 1, so I can't have P(E) < 1.

  Therefore, for the rollback to be possible, E must be such that it is not logically necessary given the remaining evidence.

  In other words, E should be independent of the remaining evidence in some sense, or at least not entailed.

  In the tape case, E is not entailed by the remaining evidence (e.g., having the tape doesn't entail what the data is).

  Whereas for H or D, if I know D, it is entailed.

  So for E = H or D, the rollback isn't well-defined because I can't simultaneously have P(D) = 1 and P(E) < 1 when D implies E.

  Therefore, step (1) might be incomplete; the rollback requires that E can be coherently removed from the evidence set without contradiction.

  In cases where E is a logical consequence of other evidence, it might not be removable.

  For E that are not entailed, like the tape data, it works.

  In Marisol's point (4), when she says "for any contingent D you already know," and E is H or D, but if you know D, E is entailed, so rollback fails.

  If you take a D you don't know, say D is "it will rain tomorrow," and I don't know it, so I know neither D nor E (H or D). Then actual P(E) might be less than 1, but E is not old evidence; it's not known.

  The problem of old evidence is about evidence that is already known.

  In the case where E is old evidence, it must be that in the actual state, P(E) =1.

  For E = H or D, if I know D, then E is known and old.

  But for rollback, I can't have a state with P(E) <1 while holding other things fixed if other things imply E.

  So for such E, the rollback isn't defined.

  Therefore, the rollback solution only applies when E is not a logical consequence of the remaining evidence.

  In other words, E should be "new" in the sense that it could be false even with the remaining evidence.

  In the tape case, E could be false; the data could have been different.

  For H or D with known D, E cannot be false; it must be true.

  So that's the difference.

  Thus, step (3) is wrong because it assumes that whenever P(E) <1 in rolled-back and H entails E, it confirms, but for E that are logical consequences, the rolled-back state isn't coherent if we hold other things fixed.

  In the case where we delete both E and D, as Marisol suggests, let's see.

  Actual state: I know D, so I know E = H or D.

  Rollback: delete E and delete D, so now I have neither.

  In this state, P(E) = P(H or D). Since I don't know D, P(D) <1, so P(H or D) = P(H) + P(D) - P(H and D) which, if D is independent or something, could be less than 1.

  P(E|H) = P(H or D | H) = 1 since H implies H or D.

  If P(E) <1, then P(E|H) > P(E), so E confirms H in this rolled-back state.

  But in this state, E is not old evidence; it's a new proposition we're considering learning.

  The rollback is meant to be a state where we don't know E but have all other evidence.

  But if we delete both E and D, we've deleted more than just E; we've changed the evidence set significantly.

  In particular, for the tape case, when we rollback, we only delete E, not other things like having the tape.

  But in the disjunction case, to make P(E) <1, we need to delete D, which was part of the evidence.

  So the rolled-back state is different; it's not just missing E but missing other evidence.

  Therefore, when we say "hold everything else fixed," it doesn't hold because we removed D.

  So the rollback isn't the same operation.

  In the tape case, we remove only E, and the other evidence (having the tape) is held, which doesn't entail E.

  In the disjunction case with known D, to have a state with P(E) <1, we must have P(D) <1, so we must remove D as well, which means we're not holding everything else fixed.

  Therefore, for the rollback to be properly applied, E must be such that it can be removed without removing other evidence, meaning that E is not entailed by the remaining evidence.

  In confirmation terms, E should be "contingently true" or not logically necessary given background.

  This resolves the issue.

  Now, for Marisol's point (8), about the tape case requiring effort to reduce the data.

  In the rollback, we're not modeling the effort; we're modeling the epistemic state.

  The fact that in the rolled-back state, P(E) <1 captures the idea that E wasn't known, even though it was accessible.

  The confirmation comes from learning E, which in the tape case required effort, but the Bayesian update doesn't care about effort; it cares about the probability change.

  In the disjunction case, if I didn't know D, and I learn E = H or D, it might confirm H a bit if P(D) <1, but since H entails E, it could be weak confirmation, but it's not trivial because I didn't know E before.

  But in the old evidence case, I do know E, so for E that are entailed, I can't learn them anew.

  I think the key is that the rollback is only defined for evidence that is not logically implied by the background.

  Therefore, in step (4), for E = H or D with known D, the rollback isn't applicable because E can't be deleted while holding D fixed.

  If we delete D as well, then it's a different rolled-back state, and E might confirm H, but that's not about old evidence; it's about new evidence E that I didn't have.

  But in the context, E is old evidence, so we shouldn't be deleting it in a way that changes other things.

  So I think that's the flaw.

  To formalize, let’s denote the evidence set.

  Let K be the set of known propositions.

  For S, E is in K, so P(E) =1.

  Rollback: consider K' = K \ {E}, and the probability function P' that agrees with P on all propositions not involving E, but with P'(E) <1 if possible.

  But if E is entailed by K', then P'(E) must be 1, so we can't have P'(E) <1.

  Therefore, rollback only works when E is not entailed by K \ {E}.

  In the tape case, E is not entailed by the remaining evidence (e.g., "we have a tape with data" doesn't entail "the data shows pattern X").

  In the disjunction case, if K includes D, and D implies E, then K \ {E} still entails E, so P'(E)=1.

  Thus, no rolled-back state with P'(E)<1 is possible without removing more.

  Therefore, for such E, the rollback doesn't apply, or we need a different approach.

  But the problem of old evidence is for evidence like the Mercury orbit or the tape data, which are specific observations not logically necessary.

  Whereas H or D is a logical consequence.

  So the rollback solution is meant for empirical evidence that could have been otherwise, not for logical truths or consequences.

  In the case where D is not known, E = H or D might be new evidence, but if it's old, it must be that I know it, which requires knowing D or something.

  I think we can reject step (3) for cases where E is a logical consequence of other evidence.

  The rollback works only for "basic" evidence that isn't derived.

  In philosophy, this might relate to the distinction between basic and derived beliefs.

  But in the tape case, E is basic in the sense that it's a direct observation once reduced, whereas H or D is derived if I know D.

  In the rollback state for the tape, we have the evidence that the data exists but not what it is, so E is a potential observation.

  Similarly, for Mercury, the perihelion shift is a specific measurement.

  For logical consequences, they don't provide new information in the same way.

  So, in summary, the step that breaks is (3): it assumes that whenever P(E) <1 in rolled-back and H entails E, it confirms, but for E that are logical consequences, the rolled-back state with P(E)<1 isn't coherent without modifying other evidence, so the rollback isn't defined or applicable.

  Therefore, the rollback solution is valid only for evidence that is not entailed by the remaining background evidence.

  In the disjunction case, since E is entailed by D, it doesn't qualify, and no confirmation is ascribed, which is correct because learning H or D when you know D shouldn't confirm H.

  If you didn't know D, learning H or D could confirm H slightly, but that's different.

  For old evidence, it's fine.

  Now, about (8): the tape case requires effort, but that's not part of the Bayesian model; the probability in the rolled-back state reflects the uncertainty before learning E, and learning E confirms H because it was uncertain.

  The effort is practical, not epistemic.

  The logically ideal agent: if they know all logical consequences, then for them, no evidence can be old in the sense that everything is already known, so nothing confirms anything new. But that's a separate problem; for real agents, we don't know all consequences, so it works.

  In the rollback, for the tape, the logically ideal agent would know E immediately, but in practice, we don't, so we have uncertainty.

  So it's not rewarding ignorance; it's that ignorance allows for learning.

  But in the Bayesian framework, it's standard.

  I think this addresses the issue.
answer: |-
  The flaw in Marisol's argument lies in step (3), which claims that the rollback solution applies universally whenever two conditions hold: (i) in the rolled-back state, the probability of the evidence \(E\) is less than 1 (\(P(E) < 1\)), and (ii) the hypothesis \(H\) entails \(E\) (\(H \vDash E\)). However, this overlooks a critical constraint on the rollback operation itself. Specifically, the "delete \(E\) and hold everything else fixed" procedure is only well-defined and coherent when \(E\) is not logically entailed by the remaining evidence set. When \(E\) is a logical consequence of other evidence—as in the disjunction case where \(E = H \lor D\) and \(D\) is known—the rollback cannot be consistently applied without modifying that background evidence. This breaks the argument and preserves the rollback solution for genuine cases of old evidence like the tape case.

  ### Why Step (3) Fails: The Rollback Requires Logical Non-Entailment
  The rollback solution works by counterfactually removing \(E\) from the agent's evidence set while holding all other evidence fixed, then evaluating whether learning \(E\) in this state would raise the probability of \(H\). For this to be coherent:
  - The rolled-back state must be epistemically possible: it must be a state where \(P(E) < 1\) is consistent with the remaining evidence.
  - If \(E\) is logically entailed by the remaining evidence (i.e., if \(K \setminus \{E\} \vDash E\), where \(K\) is the evidence set), then it's impossible to have \(P(E) < 1\) while holding everything else fixed. This is because the probability function in the rolled-back state must respect logical implications—if \(D\) entails \(E\) and \(D\) is in the evidence, then \(P(E) = 1\) necessarily, contradicting \(P(E) < 1\).

  In the tape case:
  - \(E\) is the specific data pattern (e.g., "the data shows a particular trend"). The remaining evidence includes propositions like "we have a tape with raw data" or "the data exists but has not been reduced." None of these entail \(E\), as the tape could have contained different data. Thus, deleting \(E\) leaves a coherent state where \(P(E) < 1\), and since \(H\) entails \(E\), \(P(E|H) = 1 > P(E)\), so \(E\) confirms \(H\).

  In the disjunction case (Marisol's step 4):
  - \(E = H \lor D\), where \(D\) is a known proposition (e.g., "my bike has a flat tire"). Since \(D\) is known and \(D \vDash H \lor D\), \(E\) is logically entailed by \(D\), which is part of the evidence set.
  - If you try to delete \(E\) while holding everything else fixed (including \(D\)), it's impossible to have \(P(E) < 1\) because \(D \vDash E\) forces \(P(E) = 1\). The rollback operation is incoherent here—it demands an inconsistent state where \(P(D) = 1\) but \(P(E) < 1\) despite the entailment.
  - Marisol suggests deleting \(D\) as well to force \(P(E) < 1\), but this violates the "hold everything else fixed" clause of the rollback. Deleting \(D\) changes the evidence set beyond just removing \(E\), resulting in a different rolled-back state. In this new state, \(E\) might confirm \(H\) (if \(P(E) < 1\)), but this isn't about old evidence anymore—it's evaluating \(E\) as new evidence. Since \(E\) was old evidence in the original scenario, this misses the point.

  Thus, step (3) incorrectly generalizes the rollback to cases where it isn't applicable due to logical entailment. The rollback only works for \(E\) that is not entailed by the background evidence—typically, empirical evidence that could have been otherwise, like the tape data or Mercury's orbit. For logical consequences like \(H \lor D\), the rollback isn't defined, and no confirmation is ascribed, which aligns with intuition: learning a disjunction you already know via \(D\) shouldn't confirm \(H\).

  ### Addressing the Other Steps and Costs
  - **Step (1) and (2)**: These hold. Confirmation is defined by the rollback, and the tape case is genuine confirmation. The rollback remains valid for such cases because \(E\) is not entailed by the remaining evidence (e.g., having the tape doesn't entail the specific data pattern).
  - **Step (4)**: Fails for cases where \(E\) is logically entailed, as explained. For disjunctions with known \(D\), the rollback doesn't apply. If \(D\) is not known, \(E = H \lor D\) isn't old evidence, so it's irrelevant to the problem of old evidence.
  - **Step (5)**: The defenses mentioned (e.g., that deletion might require removing other evidence) are valid. Deleting \(D\) for coherence changes the state, but this isn't the rollback as defined—it's an ad hoc modification. The inequality \(P(E|H) > P(E)\) may hold in the modified state, but it doesn't address old evidence confirmation.
  - **Step (6) and (7)**: Don't follow, as step (3) is rejected. Confirmation isn't trivialized because the disjunction case is invalid for rollback. The tape case isn't "free" in the epistemic sense—the rolled-back state's \(P(E) < 1\) reflects the genuine uncertainty before learning \(E\), and the effort to reduce data is a practical aspect not captured by Bayesianism (more below).
  - **Step (8)**: The worry about rewarding ignorance or trivializing confirmation is resolved. The rollback doesn't lean on "what the agent was in a position to find out"; it relies on the logical relationship between \(E\) and the evidence. Logically ideal agents face no problem of old evidence because they know all consequences, but for real agents, the rollback works when \(E\) is not entailed.

  ### What This Costs: Minimal, and Saves the Tape Case
  Rejecting step (3) comes with a small cost: the rollback must be restricted to cases where \(E\) is not logically entailed by the remaining evidence after deletion. This means:
  - **Formal Cost**: The rollback isn't universally applicable to all propositions. It works best for "basic" empirical evidence—observations or data that aren't logical derivatives (e.g., raw data, measurements). For derived propositions like disjunctions, other approaches may be needed, but they aren't relevant to core cases like the tape.
  - **Epistemic Cost**: You must accept that logical consequences known via entailment don't confirm in this framework. But this is intuitive—learning \(H \lor D\) when you know \(D\) adds nothing new about \(H\).
  - **Impact on Tape Case**: None. The tape data is not entailed, so the rollback delivers confirmation as before. The effort to reduce data isn't modeled in probabilities, but that's fine—Bayesian confirmation focuses on epistemic states, not practical actions. \(P(E) < 1\) in the rolled-back state captures the pre-learning uncertainty.

  ### Why No Need for Radical Changes (e.g., Relativization)
  You suggested possibly relativizing confirmation to something beyond a single proposition (e.g., a partition or method). But this isn't necessary. The rollback can be saved with the logical entailment constraint, preserving its simplicity and handling the tape case. Relativization adds complexity:
  - If you relativize to a partition (e.g., possible ways to learn \(E\)), it might handle the disjunction case but overcomplicates the tape case, where no partition is needed.
  - If you relativize to an observation method (e.g., the process of data reduction), it might address step (7)'s concern about effort, but Bayesianism typically ignores such pragmatic factors. The rollback already handles the epistemic essence.

  Stick with the rollback, reject step (3), and clarify that "hold everything else fixed" requires \(E\) to be non-entailed. This keeps Bayesian confirmation intact for old evidence while avoiding triviality.
