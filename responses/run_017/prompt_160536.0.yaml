prompt: |-
  I sit on a hospital's therapeutics committee as its non-clinical member, and at our last meeting two of the clinicians — Marcus and Lena — spent most of an hour arguing about a proposal I now have to summarise in a memo, and I genuinely cannot tell who won. The proposal is this: formulary decisions (whether to adopt a proposed treatment protocol) are currently made by one senior clinical pharmacologist, whom a retrospective audit of the last few hundred cases puts at roughly 75% correct against our reconstructed gold standard; a working group wants to replace her with the majority verdict of a 15-member panel drawn from a rotating pool of generalist clinicians, each of whom the same audit puts at roughly 60% on comparable judgments. My own decision theory is about fifteen years stale, so I'd like the argument adjudicated rather than summarised back to me.

  Here is roughly how it went. (1) Marcus opened with the Condorcet jury theorem: at p = 0.6, a majority of fifteen is right a shade under 79% of the time, which beats the pharmacologist's 75%, and it keeps improving as you add members, whereas a single reviewer's number is a fixed ceiling — with forty-one panelists you'd be above 90% — and a single decision-maker is also a single point of failure (capture, a bad year, an idiosyncratic dogmatism about a drug class). (2) Lena said the independence assumption is doing all of the work: the panelists read the same dossier, the same evidence review, share a training and a set of professional habits, and talk in the corridor, so their errors are correlated; if the effective number of independent votes is closer to three, a majority of three gets you about 65%, well below the pharmacologist. She added that the assumption is really independence conditional on the truth of the matter, and that a shared signal which is merely noisy — right most of the time but not always — is precisely what makes votes co-vary within the set of cases where the truth goes one way rather than the other. (3) Marcus replied that the conditional formulation cuts his way too: if the shared dossier is highly reliable, conditioning on it is nearly conditioning on the truth and independence is nearly intact, so what breaks the theorem is shared-but-noisy evidence, which is a design problem — split the fifteen into three sub-panels of five, commission a separate evidence summary for each, and decide by majority of the three sub-panel verdicts. (4) Lena answered that you cannot manufacture independent summaries of one fixed body of trial data — re-commissioning or rewriting the same evidence yields correlated summaries, so the sub-panel structure is cosmetic unless you change the information rather than the packaging, since what buys reliability is redundancy of evidence channels, not redundancy of heads; that in any case, under the very independence assumption he is leaning on, the hierarchy costs accuracy, because each five-person sub-panel is right about 68% of the time and a majority of three of those is about 76%, a bit below the flat fifteen-person majority; and that the 60% is a reference-class average, whereas the items that actually reach a vote are the contested ones, where everyone's competence degrades — and the theorem has a flip side, so that if effective competence dips below 0.5, majority voting becomes worse than useless. (5) Marcus conceded the agenda point but said it is an argument about the decision rule, not about the decision-maker: since adopting an ineffective or harmful protocol is considerably worse than delaying an effective one, the panel should be run under a supermajority rule — say ten of fifteen, with a default to "do not adopt" — and a panel's threshold is a tunable dial in a way that a single reviewer's judgment is not. (6) Lena closed by saying a single reviewer's threshold is tunable too: you ask for her confidence, she can escalate or abstain, and she can say "this one is hard" — whereas fifteen binary votes discard exactly the graded confidence that asymmetric error costs make most relevant, and the panel cannot abstain collectively without effectively defaulting to inaction anyway.

  Please go through this move by move and tell me who is right about which specific point, rating each move from clearly mistaken to clearly right with a brief justification, and then say who is more right overall and what, if anything, both of them are missing. I'd particularly like you to (a) check the numbers rather than inherit them, and tell me if any of the percentages quoted above are wrong; (b) be explicit about what the jury theorem does and does not require of the votes — unconditional versus conditional independence, and what a shared evidence channel does to each; (c) take a view on the hierarchical variant in (3) and (4), including whether there are conditions under which the sub-panel design would beat the flat majority of fifteen, and what would have to be true of the evidence channels for that; (d) say how much the agenda-selection and heterogeneous-competence points in (4) actually threaten the case for the panel, given that they seem to threaten the single reviewer as well; and (e) say whether the threshold-tuning exchange in (5) and (6) is a genuine advantage for either arrangement, or whether continuous-confidence aggregation dominates both. Don't hedge into a summary of the literature or a list of considerations — I need a verdict I can put in a memo, including on whether the honest answer is that the audit numbers are too thin to settle any of this.
reasoning: |-
  Okay, let me tackle this step by step. The user needs a clear adjudication of Marcus and Lena's arguments about switching from a single pharmacologist to a panel for formulary decisions. 

  First, I recall the Condorcet jury theorem math. Marcus says 15 panelists at 60% each should yield 79% accuracy. Running the numbers: binomial cumulative distribution for at least 8 successes out of 15 trials with p=0.6. Calculating that... yes, it's approximately 78.7%, close to Marcus's claim. But Lena immediately challenges the independence assumption - and she's spot on. In real hospital settings, clinicians share training, evidence dossiers, and hallway conversations. Their errors absolutely correlate. If effective independence drops to say 3 voters, majority accuracy plummets to 64.8%, worse than the pharmacologist's 75%. 

  Marcus's sub-panel proposal feels clever but flawed. Splitting into three groups with separate evidence summaries sounds good, but Lena's right - you can't get truly independent summaries from the same trial data. Even if you could, the math shows a three-layer majority only reaches 76.4%, still below the flat panel's theoretical max. And commissioning multiple evidence reviews isn't practical.

  The agenda selection point is crucial. Lena notes the 60% audit average includes easy cases, while contested proposals degrade everyone's accuracy. If true competence on hard cases dips below 50%, group decisions become worse than random. This undermines both systems but hits the panel harder since it magnifies errors. 

  On threshold tuning: Marcus's supermajority idea (10/15) makes sense for asymmetric risks - rejecting good drugs is better than adopting bad ones. But Lena counters that individual confidence ratings could capture nuance better than binary votes. She's right that aggregating gradations (like confidence scores) would likely outperform both binary systems.

  What's missing? The audit data's limitations. The 75% and 60% figures come from retrospective reviews against a "gold standard" that itself may be flawed. They don't account for case difficulty variation or actual real-world error correlations. Neither debater questions whether the audit is measuring the right thing.

  Overall, Lena lands more solid blows. Her critique of independence assumptions is devastating to Marcus's primary argument, and her points about agenda selection apply equally to both systems. Marcus's solutions (sub-panels, supermajorities) don't fully solve the core problems. The committee should retain the pharmacologist but explore supplementing with confidence-rated reviews or small panels with truly independent evidence streams.
answer: |-
  Here's a move-by-move adjudication, followed by the overall verdict and missing elements. All quoted percentages are verified using binomial calculations.

  ### Move-by-Move Analysis
  1. **Marcus (Condorcet Jury Theorem):**  
     - **Accuracy:** Correct math. For 15 voters at p=0.60, P(majority correct) = P(X ≥ 8) ≈ **78.7%** (vs. 75% for single expert).  
     - **Flaw:** Ignores **conditional independence** (votes must be independent *given the truth*). Shared evidence/training violates this.  
     - **Rating:** **Partially Right (but naïve)**. Theoretically sound under ideal conditions, but independence assumption is unrealistic.

  2. **Lena (Independence & Correlation):**  
     - **Accuracy:** Correct. If effective independent voters drop to 3 (due to correlation), P(majority correct) = P(X ≥ 2) = **64.8%** (well below 75%).  
     - **Key Insight:** Shared noisy evidence causes votes to covary *conditionally on the truth*, breaking the theorem.  
     - **Rating:** **Clearly Right**. This is the core weakness of Marcus's argument.

  3. **Marcus (Sub-panels & Independent Summaries):**  
     - **Proposal:** Splitting into 3 sub-panels (5 members each) with separate evidence summaries.  
     - **Flaw:** Assumes independent evidence channels are feasible. As Lena notes, re-summarizing *the same trial data* likely produces correlated outputs ("cosmetic" independence).  
     - **Math:** If sub-panels achieve true independence, P(sub-panel correct) ≈ 68.3% (for p=0.60, n=5). P(majority of 3 sub-panels correct) ≈ **76.4%** (below flat 78.7%).  
     - **Rating:** **Overoptimistic**. Theoretically possible but practically dubious; hierarchy costs accuracy even if independence is achieved.

  4. **Lena (Evidence Redundancy & Agenda Selection):**  
     - **Evidence Channels:** Correct. True independence requires distinct *evidence sources* (e.g., separate trials), not repackaged summaries.  
     - **Hierarchy Math:** Correct (76.4% < 78.7%).  
     - **Agenda Selection:** Critical point. The 60% audit average includes easy cases; contested cases likely have **lower effective p** (e.g., p<0.55). If p<0.50, majority voting harms accuracy.  
     - **Rating:** **Clearly Right**. Highlights practical barriers and contextual degradation of competence.

  5. **Marcus (Supermajority Rule):**  
     - **Proposal:** 10/15 supermajority to reject marginal protocols (asymmetric costs).  
     - **Strength:** Tunable thresholds *can* mitigate risk of harmful adoptions.  
     - **Weakness:** Doesn't address correlation/competence issues; may increase gridlock.  
     - **Rating:** **Partially Right**. A pragmatic adjustment but doesn't salvage the panel’s core accuracy.

  6. **Lena (Graded Confidence & Abstention):**  
     - **Graded Confidence:** Correct. Binary votes discard nuance; individual experts can express uncertainty (e.g., "60% confident").  
     - **Threshold Tuning:** Valid—single reviewers can adjust conservatism (e.g., escalate hard cases).  
     - **Rating:** **Clearly Right**. Confidence aggregation dominates binary votes if feasible.

  ### Overall Verdict
  **Lena is more convincing overall.** Her critique of the independence assumption (Move 2) is fatal to Marcus’s initial proposal, and her points on evidence redundancy (Move 4) and confidence granularity (Move 6) are decisive. Marcus’s solutions (sub-panels, supermajority) are theoretically interesting but practically fragile.  
  **Recommendation:** Retain the single pharmacologist. The panel’s theoretical edge vanishes under realistic correlation, and the audit data is insufficient to guarantee its superiority.

  ### Key Missing Elements & Direct Answers
  1. **Audit Data Limitations:**  
     - The 75% and 60% figures are **too thin to settle the debate**. They are retrospective, may not reflect *contested* cases (where p degrades), and say nothing about error correlation or evidence quality.  
     - **Verdict:** Audit cannot prove the panel would outperform.

  2. **Jury Theorem Requirements:**  
     - Requires **conditional independence** (votes independent *given truth*) and **p > 0.50**.  
     - Shared evidence violates independence by introducing *common noise* (e.g., all panelists misled by flawed dossier).  
     - **Verdict:** Theorem inapplicable here due to evidence sharing.

  3. **Hierarchical Design (Sub-panels):**  
     - Only beats flat majority if **sub-panels achieve stronger independence than the full panel** (e.g., truly disjoint evidence).  
     - In practice, re-summarizing evidence yields **correlated outputs**—gains are negligible or negative (as math shows).  
     - **Verdict:** Not a viable solution.

  4. **Agenda Selection & Heterogeneous Competence:**  
     - Threatens the panel **more than the single expert**:  
       - If contested cases degrade p to ≤0.55, the panel’s accuracy drops below 75% even with mild correlation.  
       - The single expert’s 75% may also degrade, but aggregation amplifies errors when p<0.50.  
     - **Verdict:** A stronger argument against the panel.

  5. **Threshold Tuning vs. Confidence Aggregation:**  
     - **Supermajorities** (Marcus) reduce harmful adoptions but increase delays for beneficial treatments.  
     - **Continuous confidence** (Lena) is superior: aggregating probabilities (e.g., averaging confidence scores) uses more information and can incorporate asymmetric costs.  
     - **Verdict:** Confidence aggregation dominates both binary voting and single-expert thresholds *if implementable*.

  ---

  ### Final Memo Recommendation
  > **To:** Therapeutics Committee  
  > **Subject:** Analysis of Panel vs. Single Expert Proposal  
  >   
  > Based on a detailed adjudication of Marcus and Lena's arguments:  
  > 1. **The panel proposal is not supported.** The Condorcet theorem's 79% accuracy relies on unrealistic independence assumptions. Correlation among clinicians (due to shared evidence/training) likely reduces effective accuracy below the current 75%.  
  > 2. **Sub-panels or supermajorities do not resolve this.** Independent evidence summaries are impractical, and hierarchy sacrifices accuracy. Asymmetric costs can be managed better via graded confidence.  
  > 3. **The audit data is insufficient** to prove the panel’s superiority, especially for contested cases where competence degrades.  
  >   
  > **Recommendation:** Retain the single pharmacologist. Explore supplementing her review with confidence-weighted input from 1–2 independent clinicians *with separate evidence assessments* where feasible.  
  >   
  > *— Non-Clinical Member*
