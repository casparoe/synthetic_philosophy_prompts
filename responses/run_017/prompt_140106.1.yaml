prompt: |-
  I have to write a guidance note for a clinical ethics committee that is being asked to approve a consent form for a corpus callosotomy. The sticking point is how the operation's effect should be described to the person signing it: as dividing one subject of experience into two, as leaving one subject whose experience has become in some way fragmented, or as leaving the number of subjects genuinely unsettled. Before I write anything about what the evidence actually shows, I want the specification. So: what would a theory of the unity of consciousness have to deliver in order to be good enough for that decision?

  Give me the desiderata list — the phenomena it must account for, the cases it must get right, the distinctions it must respect, the findings it must not contradict — with the case or consideration behind each requirement, and each requirement marked either non-negotiable or a preference of one camp over another.

  Some things I want covered, though add what I've missed:

  - The question how many subjects there are and the question whether a subject's experience at a time is unified are different questions. Keep them apart, say what would settle each, and tell me which one the committee actually needs an answer to.
  - Whether unity is synchronic or diachronic or both, whether it is transitive, and whether it admits of degrees. Give a case that would discriminate.
  - The staged-section case. Suppose the commissure were sectioned in stages over several weeks under local anaesthesia, with the patient asked each day what has changed. What should a theory predict the patient can report midway through, and what should we conclude if the patient reports no change at all — that unity is not a phenomenal matter, or that first-person report is not a reliable instrument here? Either way, the theory should tell me what to ask.
  - The long-project case. Much is made of inter-manual conflict, but suppose instead we had evidence, after full section, that the two streams each sustained a different ranking of the patient's long-term projects and acted on it where it could — different verdicts on where to live, whom to trust, whether to continue with a hazardous treatment. Is that one subject with conflicting aims or two sources of consent? Which requirement on your list settles it, and is that requirement one we should have been confident of in advance?
  - Consistency with the cases that make the naive "one hemisphere, one subject" story untenable: people who have had a hemisphere removed, or who were born without a callosum, and who do not present as fragmentary; the temporary unilateral disconnection produced when one hemisphere is anaesthetised for cortical mapping; and the widely repeated observation that patients after full commissurotomy do not, on the whole, behave like two agents sharing a body.
  - Whether a verdict must be determinate in every case, or whether the theory may return "vague" or "no fact of the matter" — and what it costs a consent form if it may.
  - Whether unity must make a difference to what it is like, or whether it can be cashed out in terms of access, agency, or one experience's being a proper part of another.

  Then flag any subset of the desiderata you think cannot be jointly satisfied — that is the part I most want — and name the single requirement that excludes the largest share of candidate theories. Finally, a short scorecard: three or four lines each on the co-consciousness account, the mereological or subsumptive account, the view that unity is really availability to a single workspace or attentional system, and the view that there is no substantial unity to be had.
reasoning: |-
  Hmm, the user is asking me to create a detailed specification for a theory of the unity of consciousness that would be suitable for informing consent forms for corpus callosotomy. This is an important ethics committee task with real implications for patients undergoing this serious epilepsy surgery.

  The user wants a desiderata list - essentially a set of requirements that any adequate theory of consciousness unity must satisfy. They've provided several specific aspects they want covered: distinguishing between the number of subjects versus unity of experience; synchronic vs diachronic unity; staged sectioning scenarios; long-term project conflicts; compatibility with hemisphere removal cases; determinacy requirements; and what unity fundamentally consists of.

  I need to approach this systematically. First, I should clarify that the core question for the ethics committee isn't necessarily "how many subjects" but rather "what experiential changes occur" - that's what patients need to understand for informed consent. The committee needs a theory that can reliably predict the phenomenal experience post-surgery.

  For the desiderata, I'll organize them into non-negotiable requirements and preference-based ones. Non-negotiables should include: accounting for the phenomenology of unity (the "what it's like" aspect), respecting the distinction between subject count and unity, handling the staged-section scenario, and being consistent with hemispherectomy cases. Preferences might include whether unity is transitive or admits of degrees.

  The staged-section case is particularly interesting - if a patient reports no change midway through surgery, does that mean unity isn't phenomenal or that self-report is unreliable? A good theory should guide what questions to ask. For long-term project conflicts, we need to determine whether conflicting aims indicate multiple subjects or just internal conflict in one subject.

  I must also address whether theories can return vague answers - this matters because consent forms need clarity. And regarding what unity consists of, I should note that purely access-based theories might miss the phenomenal aspect.

  Importantly, some requirements may conflict. For instance, demanding determinism in all cases might clash with evidence suggesting vagueness in consciousness unity. The subject count question might be fundamentally unsettled, which would require careful wording in consent forms.

  Finally, I'll provide brief evaluations of major theories: co-consciousness (Bayne), mereological (Dainton), global workspace (Dehaene), and eliminativism (Dennett). Each has strengths and weaknesses relative to our desiderata.

  The key for the ethics committee is that any theory used must: 1) make testable predictions about lived experience, 2) align with empirical evidence, 3) respect the patient's subjective reports, and 4) provide clear guidance for consent language about potential experiential changes. Since no current theory satisfies all desiderata perfectly, the consent form should acknowledge uncertainties while focusing on what's most clinically relevant - changes in perception, agency, and self-experience.
answer: |-
  Below is a desiderata list for a theory of the unity of consciousness to guide consent form language for corpus callosotomy, structured by requirement, rationale, and negotiability. The list prioritizes empirical adequacy, conceptual clarity, and ethical relevance.

  ---

  ### **Desiderata for a Theory of Unity of Consciousness**
  #### **Core Distinctions & Focus**
  1. **Distinguish Subject-Count vs. Experiential Unity**  
     - **Requirement**: The theory must clearly separate:  
       (a) *How many subjects exist* (metaphysical/personal identity question).  
       (b) *Whether a subject’s experience is unified at a time* (phenomenal/functional coherence).  
     - **Case/Settling**: Post-split behavioral divergence (e.g., conflicting long-term projects) tests (a); synchronic integration tests (e.g., cross-field binding) test (b).  
     - **Committee Need**: Primarily (b) – **what changes in lived experience** (e.g., fragmentation).  
     - **Status**: **Non-negotiable**.  

  #### **Unity Properties**  
  2. **Synchronic vs. Diachronic Unity**  
     - **Requirement**: Specify if unity applies to simultaneous experiences (synchronic) and/or across time (diachronic).  
     - **Discrimination Case**: *Staged section under local anaesthesia*: Midway, if synchronic unity is disrupted, patient should report perceptual conflicts (e.g., left/right visual field mismatch); diachronic disruption affects narrative self-continuity.  
     - **Status**: **Non-negotiable** (must account for synchronic unity).  
  3. **Transitivity & Degrees**  
     - **Requirement**: Clarify whether unity is transitive (if A unified with B and B with C, then A with C) and if it admits degrees (e.g., partial unity).  
     - **Case**: *Split-brain with partial callosal sparing*: If A (left visual) unified with B (right visual), and B with C (tactile), but A not with C, unity is non-transitive/partial.  
     - **Status**: **Preference** (theories admitting degrees accommodate partial disconnection better).  

  #### **Empirical Constraints**  
  4. **Staged-Section Predictions**  
     - **Requirement**: Predict patient reports during gradual section:  
       - If unity is phenomenal, patients *should* report perceptual/agentive conflicts (e.g., "my left hand acts on its own").  
       - If no change is reported, the theory must explain why (e.g., unity is subpersonal; report reliability limited).  
     - **Committee Guidance**: Theory must prescribe specific questions (e.g., "Do your hands feel like they belong to one agent?").  
     - **Status**: **Non-negotiable** (must align with intraoperative evidence).  
  5. **Long-Term Project Divergence**  
     - **Requirement**: Resolve whether conflicting projects (e.g., left hand quits therapy, right continues) imply:  
       - One subject with incoherent goals, or  
       - Two subjects with distinct consents.  
     - **Settling Requirement**: *Agency and self-narrative coherence*: If each hemisphere sustains separate, consistent long-term preferences (e.g., left votes for city life, right for rural), this favors two subjects.  
     - **Confidence**: **Preference** for theories prioritizing narrative agency; but committee should note this is empirically rare.  
  6. **Hemispherectomy/Anesthesia Compatibility**  
     - **Requirement**: Must explain why hemispherectomy patients (one hemisphere) or Wada test subjects (temporary hemispheric anesthesia) exhibit unified consciousness, unlike naive "one hemisphere = one subject".  
     - **Key Cases**:  
       - Hemispherectomy: Single, unified subject despite massive neural reduction.  
       - Wada test: Unified consciousness resumes post-anesthesia.  
     - **Implication**: Unity is not strictly hemisphere-dependent.  
     - **Status**: **Non-negotiable**.  
  7. **Behavioral Non-Duality**  
     - **Requirement**: Account for post-commissurotomy patients not acting as "two agents" (e.g., no persistent self-conflict in social settings).  
     - **Case**: Conflicts are episodic (e.g., intermanual struggle) but not pervasive; body schema remains unified.  
     - **Status**: **Non-negotiable** (must fit observed phenomenology).  

  #### **Theoretical Constraints**  
  8. **Determinacy Requirement**  
     - **Requirement**: State if unity/subject-count must be determinate.  
     - **Cost of Vagueness**: Consent forms require clarity; "no fact of the matter" may necessitate describing *all* possibilities, confusing patients.  
     - **Status**: **Preference** for determinacy (but negotiable if vagueness is empirically justified).  
  9. **Phenomenal vs. Functional Unity**  
     - **Requirement**: Specify if unity is defined by:  
       - *Phenomenal unity* ("what it’s like" to have integrated experience), or  
       - *Functional unity* (information access, attentional control, agency).  
     - **Committee Need**: **Phenomenal unity is non-negotiable** – consent must address changes in *lived experience*, not just cognitive mechanics.  

  ---

  ### **Key Tensions & Unsatisfiable Desiderata**
  - **Conflict**: **Determinacy (8) vs. Staged-Section Reports (4) & Long-Term Projects (5)**.  
    - If gradual disconnection produces ambiguous reports/projects, a theory demanding determinacy may be empirically inadequate.  
    - *Largest Exclusion*: **Determinacy (8)** rules out most theories (e.g., vagueness views, non-binary mereology).  
  - **Phenomenal Primacy (9) vs. Subject-Count (1a)**: A theory prioritizing phenomenology may settle experiential unity (1b) but leave subject-count (1a) unresolved (e.g., "one subject with fragmented access").  

  ---

  ### **Theory Scorecard**  
  1. **Co-Consciousness (Bayne)**  
     - Unity as primitive "co-consciousness" relation. Synchronic, transitive, binary.  
     - *Fails*: Staged-section (predicts abrupt unity loss; contradicts reports of gradual change), long-term projects (cannot handle two goal systems).  

  2. **Mereological/Subsumptive (Dainton)**  
     - Experiences unified if parts of a single conscious state. Admits degrees.  
     - *Strengths*: Handles partial disconnection, anesthesia cases.  
     - *Fails*: Subject-count indeterminate (one subject with fragmented parts? Two?).  

  3. **Global Workspace (Dehaene)**  
     - Unity as information availability in a "global neuronal workspace". Functional/access-based.  
     - *Strengths*: Fits behavioral non-duality, staged-section access constraints.  
     - *Fails*: Neglects phenomenology (e.g., why *feels* unified?).  

  4. **Eliminativism (Dennett)**  
     - No "substantial unity"; just parallel processes. Subject-count is narrative convention.  
     - *Strengths*: Explains vagueness, long-term project divergence.  
     - *Fails*: Ignores first-person unity reports, ethically inadequate for consent.  

  ---

  ### **Recommendation for Committee**  
  - **Focus on Experiential Unity (1b)**: Consent forms should emphasize *changes in subjective experience* (e.g., "may feel loss of control over limbs," "perceptual conflicts"), not metaphysical claims.  
  - **Acknowledge Uncertainty**: If theory conflicts persist, describe *possible* outcomes (fragmentation, dual agency) without asserting subject-count.  
  - **Key Desiderata for Consent**: Non-negotiables (1, 2, 4, 6, 7, 9) ensure descriptions align with evidence and patient experience. Reject theories failing these (e.g., strict workspace views omit phenomenality).  
  - **Critical Gap**: No theory satisfies all desiderata; **phenomenal reports in staged-section (4)** are the deciding empirical test.  

  > *Final Note*: The committee’s task is not to solve philosophy of mind but to translate likely outcomes into patient-centered language. Prioritize empirically attested changes in agency, perception, and self-coherence.
