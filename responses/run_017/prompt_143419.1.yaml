prompt: |-
  I've just joined a regional species list committee — we maintain the official checklist and the conservation listings — and I'm trying to work out what we actually think a species is before the next vote, because I suspect we've been running two different rules without noticing.

  Here's our track record, as far as I can reconstruct it from the minutes:

  1. Two forms of brush-finch that differ in song and plumage and don't interbreed across a 200 km overlap, though there's a narrow hybrid zone elsewhere producing fertile hybrids — voted two species.
  2. Two oaks that hybridize freely (a lot of introgression, some individuals are clearly intermediate) but stay distinct in form and in the soils they grow on — two species.
  3. Three all-female, asexual whiptail lineages of hybrid origin, each genetically distinct, each in its own habitat — three species.
  4. Two populations of a minnow separated by a waterfall for maybe 8000 years: deep mitochondrial split, small morphological difference, never meet in the wild, but in the lab they interbreed and produce fully fertile young — one species.
  5. Two look-identical lineages of a parasitic wasp on different host plants, no gene flow where they co-occur — two species, after a long fight.
  6. A gaudy mainland colour form of a widespread bird, interbreeding freely across a broad contact zone — one species, subspecies at most.
  7. A lichen: we ruled that the name belongs to the fungus and that we don't name the partnership.

  A colleague says all this just tracks whatever question happened to be in front of us — Red List unit versus checklist name — and that there's no single rule to find. I'm not sure she's wrong.

  Next month's case: two forms of a planthopper in the same valley, one on a sedge in the wet hollows and one on a grass on the dry ridge, ranges fully overlapping, each occasionally found on the other's host. Genome-wide markers show essentially one gene pool, except for two or three regions associated with host use. Mitochondrial DNA shows two deeply divergent clusters, perfectly associated with host plant. There's also a maternally transmitted bacterium, likewise perfectly associated with host plant: crosses between the forms in the lab fail in one direction, but once the insects are cured of the bacterium with antibiotics every cross succeeds and the offspring are fertile and do fine on both hosts. And when the bacterium occasionally moves between forms in the wild, the host association reshuffles over a few generations.

  So: how should we vote if we want to be consistent with our own precedents? Give me one call, not a menu — one species or two — and the rule you think we're running that delivers it. Tell me which of the above is the closest analog and which one it's really in tension with, what principle we'd be committing to with each choice (including the pluralist option that we've just been answering different questions), and then name the further case that would tell the surviving rules apart. Be defiantely committal: if you think our precedents genuinely underdetermine it, say so, but still make the call and tell me how confident you are in it.
reasoning: |-
  Okay, let me tackle this step by step. The user is part of a regional species list committee and needs to vote consistently on a new planthopper case. They've provided seven past decisions and want to apply those precedents to the new situation. 

  First, I need to analyze each precedent to find the underlying pattern. The brush-finch case shows reproductive isolation in sympatry was key despite some hybridization. The oaks maintained distinct forms despite introgression, suggesting ecological or morphological distinctiveness matters. The asexual whiptails were split based on genetic and habitat differences. The minnows were lumped despite divergence because they interbreed in captivity. The wasps were split due to lack of gene flow and host specificity. The bird was lumped due to free interbreeding. The lichen ruling focused on the fungal component only.

  Now looking at the new planthopper case: genome-wide data shows one gene pool, but mitochondrial DNA and bacteria show two clusters tied to host plants. Removing the bacteria allows successful interbreeding. This resembles the parasitic wasp case (host specificity) but contradicts it because gene flow is possible without the bacteria. The minnow case is similar - lab interbreeding prevented by an artificial barrier (waterfall vs bacteria).

  The key tension is between the wasp split (no gene flow) and minnow lump (interbreeding possible). Here, the bacteria acts as a temporary barrier - removable in lab like the waterfall. The committee's pattern suggests they prioritize intrinsic reproductive barriers over extrinsic ones. 

  For consistency, I'd argue for one species because the fundamental reproductive compatibility exists when the bacterial barrier is removed, mirroring the minnow decision. The closest analog is #4 minnows, while the biggest tension is with #5 wasps where gene flow was absent even without physical barriers.

  The user's colleague might be right about context-dependent decisions, but the pattern here shows a preference for biological species concept when testable. To test this rule, a case of irreversible genetic incompatibility despite barrier removal would be needed.
answer: |-
  Based on your committee's precedents and the planthopper case, here's the definitive call and reasoning:

  **Vote: ONE Species**

  **The Rule You're Running:** A lineage constitutes a distinct species only if it demonstrates **intrinsic reproductive isolation (pre- or post-zygotic) that persists in sympatry**, preventing the homogenization of gene pools despite co-occurrence. Barriers that are environmentally contingent or extrinsic (like geography or infection) that *can* be removed, revealing underlying reproductive compatibility, do not define species boundaries under this rule.

  **Analysis & Precedents:**

  1.  **Closest Analog: #4 (Minnows).**
      *   **Why:** In both cases, a strong barrier (waterfall / bacterial infection & host association) prevents gene flow in the wild. However, when the barrier is removed (lab tank / antibiotics), intrinsic reproductive compatibility is revealed, and fertile offspring are produced. Your committee ruled the minnows were one species because the isolation was extrinsic (geographic) and not intrinsic biological incompatibility. The planthopper case is identical in principle – the barrier (bacterium & resulting host fidelity) is extrinsic and removable, revealing one reproductively compatible gene pool.

  2.  **Key Tension: #5 (Parasitic Wasps).**
      *   **Why:** This is the strongest counter-example. The wasps were split despite co-occurrence because of *persistent* lack of gene flow due to host specificity, even in sympatry. The planthoppers *also* show host association preventing gene flow *in the wild*. However, the critical difference is **removability of the barrier and demonstration of compatibility**. For the wasps, the host fidelity *was* the intrinsic isolating mechanism (likely involving mate choice on the host or physiological adaptation). Removing the hosts wouldn't necessarily make them interbreed. For the planthoppers, removing the *bacterium* directly removes the barrier to interbreeding and host use, proving the host fidelity *itself* isn't an intrinsic isolating mechanism but is *caused* by the bacterium. The underlying genomes are compatible.

  3.  **Other Precedents Supporting One Species:**
      *   **#6 (Bird Colour Form):** Free interbreeding across a broad zone = one species. The planthoppers, when the bacterial barrier is gone, show this potential.
      *   **#2 (Oaks):** While distinct in form/ecology, significant introgression occurs. The planthopper genome-wide data shows *massive* gene flow potential outside the few host-associated loci, indicating a single cohesive gene pool when the barrier is absent.

  4.  **Pluralism vs. Underdetermination:** Your colleague is partly right – decisions like #1 (brush-finches - isolation), #3 (asexual whiptails - diagnosability), #5 (wasps - isolation), and #7 (lichen - naming convention) reflect different *kinds* of questions (reproductive isolation, diagnosability, taxonomic level). **However, cases #2, #4, and #6 reveal a consistent core principle applied to sexually reproducing organisms with potential gene flow: intrinsic barriers define species.** #4 is the clearest expression of this regarding extrinsic barriers. The planthopper case falls squarely into this category. The precedents *do* determine this if #4 is taken as a valid precedent for defining what constitutes a barrier worthy of species status.

  **Principle Committed To:** By voting **One Species**, you commit to the principle that **extrinsic barriers (geographic, parasitic, or behavioral induced by parasites) that prevent gene flow in nature but can be removed to reveal fundamental reproductive compatibility do not define species boundaries.** The *intrinsic biological capacity* to interbreed successfully is paramount when demonstrated.

  **The Test Case:** To differentiate this rule from a strict "no gene flow in sympatry" rule (like #5), the critical next case would be: **Two sympatric animal populations showing strong host-associated assortative mating and no gene flow *in the wild*. Antibiotics/captive breeding remove the *suspected* microbial symbiont, yet assortative mating and reproductive isolation *persist* due to evolved genetic mechanisms (e.g., mate choice genes, hybrid inviability genes unlinked to the symbiont).** This would force a choice between the "intrinsic barrier" principle (split) and a "gene flow potential" principle (lump if *possible* under *some* conditions).

  **Confidence:** High (8/10). The minnow precedent (#4) is functionally identical in principle (extrinsic barrier removable in lab, compatibility revealed). The genome-wide data showing one gene pool outside the host loci strongly supports a single lineage. The bacterial causation makes the host association analogous to the waterfall, not the intrinsic host-specific adaptation of the wasps (#5). Consistency demands **One Species.**
