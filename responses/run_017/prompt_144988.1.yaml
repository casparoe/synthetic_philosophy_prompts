  ### Case: The Community Garden Plots

  A neighborhood association is distributing three non-identical garden plots in a community garden. The plots vary in sunlight, soil quality, and size. Plot 1 has full sun and rich soil (ideal for most crops). Plot 2 has partial shade and rocky soil (suitable for shade-tolerant plants). Plot 3 is small but has full sun and decent soil (good for container gardening). The plots cannot be subdivided or traded. Four residents are eligible: Val, Kai, Remy, and Jules. Only three can receive a plot.

  - **Val** loves growing tomatoes, which require full sun and rich soil. Val initially expected plots would be assigned by seniority (which would have given Val Plot 1). When the association announced a fair allocation process, Val adapted: they researched shade gardening and trained themselves to prefer growing mushrooms in partial shade. Val now genuinely enjoys Plot 2 the most and finds it more rewarding than Plot 1. However, Val's welfare is partly comparative—if someone with less gardening experience gets Plot 1, Val feels resentful and undervalued, reducing their enjoyment of any plot.
  - **Kai** is a novice gardener who simply wants to grow something. Kai is happy with any plot and has no comparative concerns—their welfare depends only on having a plot, not on which one or who else gets what.
  - **Remy** has a rare allergy to common soil bacteria and can only safely garden in Plot 3, which uses a special sterile soil mix. Remy values Plot 3 highly and cannot use the other plots without severe health risks.
  - **Jules** is passionate about growing sun-loving flowers and needs full sun. Jules can use Plot 1 or Plot 3 but not Plot 2 (partial shade would kill the flowers). Jules values Plot 1 slightly more than Plot 3 due to size but would be satisfied with either.

  The association must allocate three plots to three of the four residents. The fourth gets nothing.

  ### (a) Distribution Recommendations in Plain Terms
  - **View A**: "Give Plot 1 to Val, Plot 3 to Remy, and Plot 2 to Kai. Val avoids resentment and gets their preferred plot, Remy stays safe, and Kai is content. Jules does not get a plot."
  - **View B**: "Give Plot 2 to Val, Plot 1 to Jules, and Plot 3 to Remy. Val gets what they now like best, Jules gets a suitable plot, and Remy's needs are met. Kai does not get a plot."
  - **View C**: "Give Plot 1 to Jules, Plot 3 to Remy, and Plot 2 to Kai. Jules gets the best conditions for their flowers, Remy is safe, and Kai is fine with any plot. Val does not get a plot."

  ### (b) Objections and Effective Replies
  - **For View A**:  
    - *Objection*: "Why give Plot 1 to Val when they now prefer Plot 2? And why exclude Jules, who needs full sun?"  
    - *Effective Reply*: "Val's happiness depends on avoiding resentment, which only happens if they get Plot 1. Jules can adapt to Plot 3, but Val's well-being would be lower if they didn't get Plot 1. Excluding Jules is tough, but Val's comparative welfare must be addressed for overall equality in well-being."

  - **For View B**:  
    - *Objection*: "Val only prefers Plot 2 because they expected unfair rules—shouldn't we ignore that and give Plot 1 to someone who genuinely needs it, like Jules?"  
    - *Effective Reply*: "Val chose to change their preferences, so we respect what they want now. Jules gets Plot 1, which meets their needs, and Val is happy with Plot 2. Ignoring Val's current preferences would punish them for adapting responsibly."

  - **For View C**:  
    - *Objection*: "Why exclude Val entirely? They put effort into adapting and deserve something, while Kai could be excluded with less harm."  
    - *Effective Reply*: "Val can grow mushrooms in any shaded area, so they don't lose real freedom. We prioritize Jules's ability to grow flowers (which requires Plot 1) and Remy's health. Kai's inclusion ensures everyone with a plot has basic gardening freedom."

  ### (c) The Hingepoint and Divergence
  The key feature is **how to handle Val's preference-shaping and comparative welfare**. This forces the views apart because each interprets the "currency" of equality differently:
  - **Welfare view (View A)**: Equality means equalizing well-being based on actual preferences and experiences. Val's comparative resentment is part of their welfare, so giving Plot 1 to Val prevents welfare loss from envy. Val's adaptation is noted but not prioritized over current welfare.
  - **Resources view (View B)**: Equality means equalizing external resources while holding people responsible for preferences. Val's preference for Plot 2 is treated as a choice, so they get that plot. The distribution ignores envy (as a personal taste) and focuses on assigning plots based on current preferences through a process like an auction (implicitly: Val wins Plot 2, Jules wins Plot 1, Remy wins Plot 3).
  - **Capabilities view (View C)**: Equality means equalizing real freedoms to achieve functionings (e.g., gardening safely or effectively). Val's adaptation is irrelevant—Plot 2 offers no unique capability (Val can garden mushrooms elsewhere). Jules's need for Plot 1 (full sun for flowers) and Remy's need for Plot 3 (health) create capability gaps, so they get plots. Kai is included to ensure minimal capability for all recipients.

  The divergence stems from what each view sees as the point of equality: well-being satisfaction, resource ownership with choice responsibility, or substantive freedoms.

  \answer{preference-shaping and comparative welfare in allocation}
