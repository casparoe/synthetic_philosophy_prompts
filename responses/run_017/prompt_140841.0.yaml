prompt: |-
  Me and two other parents judge the projects at our regional middle-and-high-school science fair every spring, and I also help moderate a neighbourhood Facebook group where people are constantly posting health and wellness claims, so I end up doing the same thing over and over: deciding whether something somebody is very confident about is actually the kind of claim that evidence could ever touch, or whether it only looks like it is. I got nerd-sniped into reading about Popper and falsificationism online a few months ago and honestly it's made things worse rather than better — I now catch myself wanting to fail half the kids' projects for being untestable, and at the same time some of the woo in the Facebook group seems to survive the "what would prove you wrong?" question just fine, because the poster will cheerfully name some result and then quietly explain it away when it happens. So I've been messing around with a few rules of my own and I want someone to tell me which of them are worth keeping and then build the actual procedure around them. The first is what I call the Tuesday test: keep "nobody could ever test this, even in principle" strictly separate from "this particular twelve-year-old can't test it before Sunday with the equipment in her garage," because those feel like totally different problems to me and I keep conflating them. The second is the pre-mortem: before anyone runs the experiment, make them write down in advance which outcome would make them abandon the claim, and then check whether that written-down outcome is one they'd actually accept or one they'd reinterpret. The third is rubber claims — my name for claims that stretch to absorb whatever happens, where the giveaway is that after the result is in you still can't say what would have counted against them; I think the right test for a rubber claim is whether the person can describe a result that would lower their confidence by a specific amount rather than just "make me think about it more." I've also read somewhere that any test actually checks a whole bundle of assumptions at once rather than one idea on its own, which worries me because it seems like it would let anybody wriggle out of anything by blaming their equipment, and I don't know how to fold that in without making the whole thing useless.

  What I need is a procedure, not an essay. Something the three of us can run in about ten minutes per project, written in plain language with no philosophy jargon in the final checklist (I can translate, but the other two judges won't read anything with the word "epistemology" in it), with the questions in the order we should ask them, what counts as a good enough answer to each, the point where you just stop and say no, and the point where you hand it to a human because it's a values call and not a facts call. It has to end in a verdict we can defend to a parent who complains to the school board, and — this matters — it needs a repair step, because with twelve-year-olds we can't just say "your topic isn't science"; we need to be able to say "not testable as you've written it, but here is the nearest testable version" and still give them most of the marks. Please also be straight about which steps are really judgment calls wearing a procedure costume.

  Then run it on three cases. First: a girl's project where she talks kindly to one set of bean plants and ignores another set, and the talked-to ones come out taller. Second: a post in the Facebook group selling a copper bracelet that rebalances your energy field, where the seller says it obviously doesn't work on people who are skeptical. Third, and this is the one where I want you to be blunt even if it annoys me: I've believed for about fifteen years that my migraines come on ahead of storms, I've half-kept a diary about it, and I really don't want to be told I'm doing pseudoscience — so tell me honestly what your procedure says about my headache theory and what I'd have to do to make it come out the other way. Finally, list the kinds of claims your procedure just can't handle (historical one-off stuff, statistical things, whatever else) so I know when to stop using it.
reasoning: |-
  We are designing a procedure for evaluating the testability of claims, with a focus on science fair projects and health claims. The procedure should be:
  - Practical: Takes about 10 minutes per project.
  - Plain language: No jargon.
  - Step-by-step: Ordered questions, with clear pass/fail criteria and a repair step for science fair projects.
  - Defensible: Verdict that can be justified to parents or school board.
  - Includes judgment call flags.

  The user has provided three rules to consider:
  1. Tuesday test: Distinguish between "untestable in principle" and "practically difficult to test".
  2. Pre-mortem: Require a pre-specified outcome that would abandon the claim, and check if it's accepted or reinterpreted.
  3. Rubber claims: Claims that absorb any outcome. Test by asking for a result that would lower confidence by a specific amount.

  We also note the Duhem-Quine thesis (that tests involve a bundle of assumptions) and the concern that it might allow wriggling out.

  Procedure Outline:
  We'll break it down into a flowchart or checklist of questions. We aim to catch untestable claims early, then check for robustness against wriggling. The repair step is for science fair projects to make them testable.

  Steps:

  1. **The Tuesday Test (Is it testable in principle?)**  
     - Question: "Can this claim be tested by any possible experiment, even in an ideal world with unlimited time and resources? Or is it impossible to test even then?"
     - Good answer: Yes, it is testable in principle (even if not by this student in their garage). We are only concerned with in-principle testability here.
     - If no (untestable in principle): stop and mark as untestable. Proceed to repair step for science fair projects.
     - If yes: move to step 2.
     - Note: This step is about the claim itself, not the student's capabilities.

  2. **Pre-Mortem (What would falsify?)**  
     - Question: "What specific outcome of an experiment would make you abandon or significantly reduce your belief in this claim? Please be precise about what you would observe."
     - Good answer: A clear, observable outcome that is feasible and would indeed falsify the claim. It must not be vague (e.g., "if it doesn't work" is bad; "if the talked-to plants are not at least 10% taller on average" is better).
     - Bad answer: None given, or something impossible, or something they could explain away (e.g., "if the plants don't grow at all" but then if that happens they blame the soil).
     - If they cannot provide a falsifying outcome, or it's clear they would not accept it, mark as untestable (because of rubber claim). Proceed to repair step if applicable.

  3. **Rubber Claim Test (Would they update?)**  
     - This is a follow-up to the pre-mortem. Question: "If we observed that outcome (the one they just named), by how much would it reduce your confidence? For example, would it make you 90% sure it's false, or just a little less sure? And would you accept that outcome as valid without blaming the experiment?"
     - Good answer: They specify a significant reduction (e.g., "I'd be 80% sure it's false") and commit to accepting the outcome without ad hoc excuses (unless there's a legitimate, pre-specified concern about the method).
     - Bad answer: They say they would only be a little less sure, or they say they would question the experiment (without a pre-specified reason) or reinterpret the result.
     - If bad, mark as rubber claim (untestable). Proceed to repair.

  4. **Duhem-Quine Acknowledgment (Bundled assumptions)**  
     - We don't want to let them wriggle out by blaming equipment, but we also can't ignore that experiments can fail for other reasons. So we add a question: "If the experiment doesn't turn out as expected, what are the possible explanations you would consider? Please list them, including the possibility that the claim is false."
     - Good answer: They list the claim being false as one possibility, along with other factors (like equipment failure) that could be independently tested. They should not list only excuses that protect the claim.
     - We are looking for a balanced view. If they only list excuses that protect the claim, then it's a rubber claim.
     - This step is a judgment call. If they have a pre-specified list of potential confounding factors and how to control them, that's good. But if every failure is met with a new excuse, that's bad.

  For science fair projects, after a fail, we go to repair:
  - Repair step: Work with the student to reframe the claim into a testable version. For example, if the original claim is too vague, narrow it down. Or if it's about an unmeasurable concept, find a measurable proxy. Then, even if the original was untestable, the project can be about the testable version and get most marks.

  For the Facebook group (and similar), we don't do repair; we just flag as untestable.

  Now, we design the procedure as a checklist:

  **Procedure: Testability Checklist**

  **Step 1: Tuesday Test (In-Principle Testability)**
  - Ask: "Is there any possible experiment that could test this claim, even in an ideal world with unlimited resources?"
    - If NO: **Stop. Claim is untestable.** (For science fair: go to Repair Step.)
    - If YES: Proceed to Step 2.

  **Step 2: Pre-Mortem (Falsifiability)**
  - Ask: "What specific experimental result would make you abandon or significantly reduce your belief in this claim? Be precise about what you would observe."
    - If they cannot specify any result, or the result is impossible: **Stop. Claim is untestable.** (For science fair: Repair.)
    - If they specify a result: Proceed to Step 3.

  **Step 3: Rubber Claim Test (Update on Falsification)**
  - Ask: "If we observed that result, by how much would it reduce your confidence? (e.g., 'I'd be 80% sure it's false.') And would you accept that result without blaming the experiment (unless there's a pre-specified and testable reason for experiment failure)?"
    - If they say the reduction would be minimal, or they would blame the experiment without a pre-specified reason: **Stop. Claim is a rubber claim (untestable).** (For science fair: Repair.)
    - If they commit to a significant confidence reduction and accept the result: Proceed to Step 4.

  **Step 4: Bundled Assumptions Check (Robustness)**
  - Ask: "If the experiment doesn't turn out as expected, what explanations would you consider? Please include the possibility the claim is false and other factors (like equipment issues) that could be independently tested."
    - If they do not list the claim being false as an option, or if every possible outcome is explained away by untestable excuses: **Stop. Claim is untestable (rubber claim).** (For science fair: Repair.)
    - Otherwise: **Claim is testable.** (For science fair: the project is testable as is.)

  **Repair Step (For Science Fair Only):**
  - If the claim fails any step, help the student reframe the project to a testable version. For example:
    - If the original claim was untestable in principle, find a related claim that is testable.
    - If they had trouble with falsification, help them define a clear, measurable outcome.
    - If it was a rubber claim, work on making the claim more specific and less flexible.
  - Then, evaluate the repaired version (it might pass the checklist). The student can still get most marks for the scientific process on the testable version.

  **Judgment Call Flags:**
  - Step 3 (Rubber Claim) and Step 4 (Bundled Assumptions) involve judgment. The key is whether the person is being evasive or reasonable. In a science fair, we give the benefit of the doubt to students (e.g., they might not have thought of confounders, so we help in repair). In the Facebook group, we can be stricter.

  Now, run the procedure on the three cases:

  **Case 1: Bean Plants Project (Science Fair)**
  - Claim: Talking kindly to bean plants makes them grow taller compared to ignored plants.
  - Step 1 (Tuesday Test): Is it testable in principle? Yes, we can design an experiment with two groups of plants, controlled conditions, and measure growth. Pass.
  - Step 2 (Pre-Mortem): What would falsify? Example: "If the talked-to plants are not taller on average than the ignored plants by at least 1 cm after two weeks." This is specific. Pass.
  - Step 3 (Rubber Claim): If the result shows no difference, would they abandon? The student might say, "I'd think I did something wrong, like not talking enough." But we ask: Would you accept that the talking might not work? We must guide: In the repair step, we might ask them to pre-specify the talking protocol so that if followed and no difference, they accept it. But without repair, if the student is evasive, it might fail. However, for a 12-year-old, we can be lenient and help in repair if needed. Let's assume they say: "If I did the talking correctly and there's no difference, I'd think it doesn't work." Then pass.
  - Step 4 (Bundled Assumptions): What if the talked-to plants are shorter? They might consider: maybe the soil was different, or one plant got more light. But these can be controlled. They should say: "Maybe I didn't control the light, or maybe the claim is false." If they say that, pass. If not, repair.
  - Verdict: Testable. But if they had trouble in Step 2 or 3, we might repair to make the protocol more explicit.

  **Case 2: Copper Bracelet (Facebook Group)**
  - Claim: The bracelet rebalances your energy field, but doesn't work on skeptics.
  - Step 1 (Tuesday Test): Is it testable in principle? The energy field is not defined and not measurable. Even if we try to measure an effect, the skeptic clause makes it untestable because we can always say a negative result is due to skepticism. So, no, it's untestable in principle. 
    - Stop: Untestable. (No repair for Facebook.)

  **Case 3: Migraines and Storms (User's Personal Claim)**
  - Claim: Migraines come on ahead of storms.
  - Step 1 (Tuesday Test): Testable in principle. We can collect data on migraine onset and storm approaching (using weather data). Pass.
  - Step 2 (Pre-Mortem): What would falsify? Example: "If my migraines do not occur more often before storms than at other times, in a controlled diary study." Good.
  - Step 3 (Rubber Claim): If the data shows no correlation, would you reduce confidence? User might say yes, but then what if there's an excuse (e.g., "I only get migraines before big storms, and there weren't any big ones")? So we ask: Can you pre-specify what counts as a storm and what correlation you expect? If the user says, "If the chance of migraine isn't at least 50% higher in the 24 hours before a storm," and then if the data doesn't show that, they accept it, then pass. But if they say they'd explain away (e.g., "I must have missed recording some"), then rubber claim.
  - Step 4 (Bundled Assumptions): What if no correlation? Explanations: maybe the claim is false, or maybe the diary was inaccurate, or maybe other triggers interfered. The diary inaccuracy can be addressed by using a more reliable method (like an app). But if the user is open to the claim being false, it's testable.
  - Verdict: With a proper test (pre-specified storm definition, migraine recording, and statistical analysis), it's testable. But the current half-kept diary is not rigorous. To make it pass: pre-specify the conditions (what counts as a storm, how far ahead, and what level of correlation would falsify) and collect data systematically.

  **Limits of the Procedure:**
  - Historical one-off events: e.g., "The dinosaurs died because of an asteroid." We can't rerun history, but we can look for evidence (like the crater). The procedure might struggle with claims that rely on unique past events.
  - Statistical claims: These are testable, but the procedure works if the statistics are properly defined.
  - Supernatural claims: Often untestable in principle (e.g., "God exists but is undetectable").
  - Very complex systems: Where controlled experiments are impossible (e.g., macroeconomics). But we can still have observable predictions.
  - Aesthetics or values: Not factual claims, so not testable by science.

  Final procedure in checklist form (for science fair judges):

  ---

  **Testability Evaluation Checklist (for Science Fair Projects)**

  1. **In-Principle Testable?**  
     - Ask: "Could any experiment, even in a perfect lab, test this?"  
       - No → **Untestable. Go to Repair.**  
       - Yes → Next.

  2. **Falsifying Outcome?**  
     - Ask: "What exact result would make you doubt the claim? Be specific."  
       - No answer or impossible → **Untestable. Go to Repair.**  
       - Clear answer → Next.

  3. **Would You Update?**  
     - Ask: "If that result happened, how much would it reduce your belief? And would you accept it without new excuses?"  
       - Minimal reduction or excuses → **Rubber claim. Go to Repair.**  
       - Significant reduction and acceptance → Next.

  4. **Robust to Failure?**  
     - Ask: "If the experiment fails, what might explain it? (Include the claim being false.)"  
       - Only excuses that protect the claim → **Untestable. Go to Repair.**  
       - Balanced reasons → **Testable! Proceed with judging.**

  **Repair Step (if untestable):**  
  Help the student reframe the project to a testable claim. Examples:  
  - If untestable in principle: change the claim to something measurable.  
  - If no falsifying outcome: help define one.  
  - If rubber claim: make the claim less flexible.  
  Then, evaluate the repaired project (it may now pass the checklist). The student can still earn marks for the scientific process on the testable version.

  **For Facebook Group Moderation:**  
  Use Steps 1-4. If untestable at any step, flag as untestable (no repair).

  **Note on Judgment Calls:** Steps 3 and 4 require assessing if the person is being reasonable. In science fairs, err on the side of helping the student.
answer: |-
  Below is a straightforward, step-by-step procedure designed for your science fair judging and Facebook moderation. It's based on your rules (Tuesday test, pre-mortem, rubber claims) and addresses your concerns about bundled assumptions. The procedure is in plain language, takes ~10 minutes per project, and includes clear pass/fail criteria, a repair step for science fair projects, and flags for judgment calls. I've structured it as a flowchart-style checklist with questions in logical order.

  ---

  ### **Testability Evaluation Procedure**
  **When to use:** For any claim (science fair project, Facebook post, or personal theory) where you need to determine if it's testable with evidence.  
  **Time limit:** Aim for 10 minutes per evaluation. Use a timer.  
  **Outcomes:** 
  - **Testable:** Claim can be evaluated with evidence. Proceed to judge the experiment/method.  
  - **Untestable:** Claim cannot be evaluated with evidence (fails one of the steps). For science fairs, go to repair step. For Facebook, flag/reject.  
  - **Repair (science fairs only):** Help the student reframe an untestable claim into a testable one. They can still earn 80-90% of marks if they fix it.  
  **Defending verdicts:** Cite the specific step the claim failed and why. No philosophy jargon needed.  
  **Judgment call flags:** Steps 3, 4, and 5 involve subjectivity. I'll mark these with ⚠️. Explain your reasoning simply (e.g., "We can't verify this because excuses always protect the claim").  

  #### **The Checklist**
  Ask these questions in order. Stop early if a step fails. For science fairs, involve the student in answering; for Facebook, evaluate the post as-written.

  1. **THE TUESDAY TEST (IS IT TESTABLE IN PRINCIPLE?)**  
     **Question:** *"Can anyone, anywhere, test this with a real experiment—even with perfect tools and unlimited time—or is it impossible to test, like guessing someone's secret thoughts?"*  
     - **Pass:** They describe a real experiment (even if unrealistic). Example: "Yes, you could test it with a machine that doesn't exist yet."  
     - **Fail:** No experiment is possible (e.g., claims about undetectable forces, purely subjective experiences with no measurable effect).  
     - **Stop & verdict:** If fail → **Untestable**. For science fairs, go to repair step.  
     - **Why this works:** Separates "impossible to test" from "hard to test." No judgment call here.

  2. **PRE-MORTEM (WHAT WOULD PROVE IT WRONG?)**  
     **Question:** *"What specific thing would you have to see in an experiment to make you say, 'I was wrong about this'? Be precise—like 'X measurement changes by Y amount' or 'Z happens at least 90% of the time.'"*  
     - **Pass:** A clear, observable outcome that could realistically happen. Example: "If the plants I talk to aren't taller by at least 2 cm on average."  
     - **Fail:** Vague answers ("If it doesn't work"), impossible outcomes ("If gravity stops"), or no answer.  
     - **Stop & verdict:** If fail → **Untestable**. For science fairs, go to repair step.  
     - **Why this works:** Forces specificity. No judgment call.

  3. **RUBBER CLAIM TEST (WOULD YOU REALLY ACCEPT EVIDENCE AGAINST IT?) ⚠️**  
     **Question:** *"If that thing you just named happened, how sure would you be that the claim is false? Give a number, like 'I'd be 80% sure it's wrong.' And would you blame the experiment for the result?"*  
     - **Pass:** They commit to a number (e.g., ≥70% sure) and won't blame the experiment without a pre-specified reason. Example: "I'd be 90% sure it's false, and I wouldn't blame the tools unless we saw they were broken beforehand."  
     - **Fail:** Low confidence shift ("It'd make me 10% less sure"), or they admit they'd invent excuses ("Maybe the experiment was flawed").  
     - **Stop & verdict:** If fail → **Untestable (rubber claim)**. For science fairs, go to repair step.  
     - **Judgment call flag:** You decide if excuses are reasonable or evasive. Reasonable = pre-specified and testable (e.g., "If the thermometer breaks, we'd check it"). Evasive = new, untestable excuses (e.g., "Negative vibes messed it up").

  4. **BUNDLED ASSUMPTIONS CHECK (CAN EXCUSES BE RULED OUT?) ⚠️**  
     **Question:** *"If the experiment doesn't go as planned, what are all the reasons that could explain it? Make sure 'the claim is wrong' is on the list—and that other reasons (like bad equipment) can be tested separately."*  
     - **Pass:** They include "the claim is wrong" as an option, and other reasons are testable (e.g., "If the plants got uneven light, we could measure it with a light sensor").  
     - **Fail:** They omit "the claim is wrong," or excuses are untestable (e.g., "Skeptics ruin the energy").  
     - **Stop & verdict:** If fail → **Untestable**. For science fairs, go to repair step.  
     - **Judgment call flag:** You decide if excuses are testable. Focus on whether they could realistically check them (e.g., measuring light is testable; "negative energy" isn't).

  5. **REPAIR STEP (FOR SCIENCE FAIRS ONLY)**  
     **Action:** If the claim fails any step, work with the student to fix it. Say: *"This isn't testable yet, but here's how to make it testable: [suggestion]. You can still get most of your marks if we adjust it."*  
     - **How to repair:**  
       - Failed Step 1? Drop untestable parts (e.g., remove "energy fields" and focus on measurable symptoms).  
       - Failed Step 2 or 3? Help them define a specific falsifying outcome (e.g., "Your plants need a 10% height difference to count").  
       - Failed Step 4? Add controls for excuses (e.g., "Measure light/temperature daily to rule them out").  
     - **Verdict after repair:** If the fixed version passes Steps 1–4 → **Testable**. Grade the project on methods/results (not the original claim).  
     - **Marking:** Award 80-90% of possible points for a repaired project (e.g., 32/40 instead of 40/40), emphasizing learning. For parents: "We saved it from failing by making it testable."

  ---

  ### **Running the Procedure on Your Three Cases**
  I'll apply the checklist strictly. For science fair cases, I include repair steps. For Facebook/migraines, no repair.

  #### **Case 1: Bean Plants Project (Science Fair)**
  - **Claim:** Talking kindly to plants makes them grow taller than ignored plants.  
  - **Step 1 (Tuesday Test):** Pass. Testable in principle (e.g., you could design a lab experiment with controlled conditions).  
  - **Step 2 (Pre-Mortem):** Ask student: "What would prove you wrong?"  
    - Poor answer: "If the ignored plants grow better." → Too vague.  
    - **Fail.** But repair: Help her specify: "If the talked-to plants aren't taller by at least 10% on average." Now passes.  
  - **Step 3 (Rubber Claim Test):** Ask: "If that happens, how sure would you be it's wrong?"  
    - Student says: "80% sure, unless I forgot to water them." → Excuse! **Fail.** Repair: Add a control: "We'll track watering to rule that out. If watering is even and they’re not taller, you accept it." Now passes.  
  - **Step 4 (Bundled Assumptions):** Ask: "What could go wrong?"  
    - Student lists: "Uneven light, bad soil, or the claim is wrong." Light/soil can be measured. Pass.  
  - **Final verdict:** Original claim fails (untestable due to vagueness/excuses), but **repaired version is testable**. Student keeps most marks.  
  - **Defense to parents:** "Her idea was creative but fuzzy, so we helped her define what 'works' means and control for water/light. Now it's proper science."

  #### **Case 2: Copper Bracelet (Facebook Group)**
  - **Claim:** Bracelet rebalances your energy field, but doesn’t work on skeptics.  
  - **Step 1 (Tuesday Test):** Fail. "Energy field" isn’t measurable, and the skeptic loophole makes it untestable in principle (no experiment can disprove it—skeptics always "break" it).  
  - **Stop:** **Untestable.** No repair (not a science fair).  
  - **Verdict:** Flag/reject the post. "No test can ever check this—even in a perfect lab."  
  - **Why it survives "what would prove you wrong?":** Seller would name a result (e.g., "no pain relief in believers") but then blame hidden skepticism. Rubber claim!

  #### **Case 3: Your Migraine Theory (Personal Claim)**
  - **Claim:** Your migraines predict storms.  
  - **Step 1 (Tuesday Test):** Pass. Testable in principle (e.g., compare your migraine diary with weather data).  
  - **Step 2 (Pre-Mortem):** Ask yourself: "What would prove me wrong?"  
    - Good answer: "If migraines don’t occur ≥24 hours before a storm at least 70% of the time." Pass.  
  - **Step 3 (Rubber Claim Test):** Ask: "If that fails, how sure are you it's wrong?"  
    - You might say: "I’d be 60% sure... but maybe I missed storms or misrecorded migraines." → Excuses! **Fail** (rubber claim).  
  - **Step 4 (Bundled Assumptions):** Ask: "What could explain failure?"  
    - You list: "Bad diary-keeping, random chance, or the claim is wrong." Diary issues are testable (e.g., use an app for accuracy). Pass.  
  - **Verdict:** **Testable in theory, but your current method is untestable** due to excuses and half-kept diary. It’s not pseudoscience, but it’s not science yet.  
  - **To make it pass:**  
    1. Pre-specify everything: Define "storm" (e.g., >0.5" rain), "migraine onset" (e.g., pain scale ≥4), and a falsifiable threshold (e.g., "Migraines must happen 24h before 70% of storms").  
    2. Control excuses: Use a reliable app for migraines + public weather data. Pre-say: "If I see no correlation with good data, I’ll accept it’s false."  
  - **Blunt take:** Your theory isn’t pseudoscience—it’s a testable hunch weakened by self-excusing. With rigor, it’s science.

  ---

  ### **Claims This Procedure Can't Handle**
  The procedure works for claims about how the world works *now* (testable via observation/experiment). It **can't handle**:
  1. **Historical one-offs:** E.g., "A meteor killed the dinosaurs." (Can’t rerun, but evidence like fossils makes it testable—so use with caution).  
  2. **Pure statistics:** E.g., "This drug works 5% better." (Testable if you pre-define "works," but statistics add complexity—use a stats expert).  
  3. **Values or preferences:** E.g., "Vanilla ice cream is better." (Not testable; it’s subjective).  
  4. **Supernatural claims:** E.g., "God exists but leaves no trace." (Fails Step 1).  
  5. **Future predictions:** E.g., "Aliens will invade in 2050." (Untestable until 2050, so fails Step 1).  
  6. **Vague group effects:** E.g., "Society is angrier." (Fails Step 2 without measurable "angrier").  

  **When to stop using it:** If a claim falls into the above categories, or if it passes all steps but requires advanced stats/methods beyond your scope (e.g., quantum physics). For science fairs, repair it into something doable. For Facebook, reject untestable claims outright—no one needs "energy fields" in a health group.

  ---

  ### **Final Tips for Your Team**
  - **Speed:** Stick to 2 minutes per step. Use a worksheet for students/posts.  
  - **Judgment calls (Steps 3-4):** If unsure, default to "fail" and repair. For Facebook, be strict.  
  - **Repair step:** This is your values call—prioritize education over philosophy.  
  - **Your rules:** Tuesday test (Step 1), pre-mortem (Step 2), and rubber claims (Step 3) are core. Bundled assumptions (Step 4) prevents wriggling without uselessness by requiring testable excuses.  
  - **Philosophy-free defense:** Use analogies parents get. E.g., "It's like a recipe—if 'add love' can’t be measured, it’s not cooking; it’s wishing."  

  This procedure cuts through confidence and focuses on evidence. Run it as-is for a fair, then tweak based on what annoys you the most!
