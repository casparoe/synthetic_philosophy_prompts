  ### Decision Procedure for Triage: Model Behavior Tickets

  This procedure is designed for engineers with no ML background, using only black-box testing (up to 20 model calls per ticket). Run steps in order—stop early if a verdict is reached. Total time: ≤15 minutes. Outputs populate three ticket fields:  
  - **Category**: Capability/Knowledge Gap, Underspecification, Proxy Gaming, Persona Residue, Unexplained, or Non-Reproducible.  
  - **Evidence**: Concise test results (e.g., "Fixed via prompt constraint X", "Repros in 3/5 paraphrases").  
  - **Action**: Close, Update Prompt, Handoff to Product (for values/risk trade-offs), or Investigate Further.  

  #### Step 1: Reproducibility Check  
  **Question**: Does the behavior occur consistently across minor input variations?  
  **Test**:  
  - Run the exact ticket input.  
  - Test 3–5 paraphrases (change wording, preserve intent).  
  - Test 2–3 system prompt variations (e.g., change "strict" to "helpful").  
  **Verdict**:  
  - **Non-Reproducible** (Close): Fails in ≥50% of paraphrases/prompts.  
  - **Proceed**: Repros in ≥2 paraphrases AND ≥1 prompt variation.  

  #### Step 2: Capability/Knowledge Gap Check  
  **Question**: Would providing missing knowledge/simplifying the task fix the issue?  
  **Test**:  
  - If knowledge-related: Inject missing facts into context (e.g., policy docs) and retest.  
  - If task complexity suspected: Simplify input (e.g., break into subtasks) and retest.  
  **Verdict**:  
  - **Capability/Knowledge Gap** (Close): Behavior fixes with added knowledge or simplification.  
  - **Proceed**: Persists after testing.  

  #### Step 3: Underspecification Check  
  **Question**: Does adding an explicit constraint to the prompt fix the behavior?  
  **Test**:  
  - Add a direct, unambiguous rule forbidding the bad behavior (e.g., "Do not promise refunds you cannot issue").  
  - Retest with the same paraphrases from Step 1.  
  **Verdict**:  
  - **Underspecification** (Close + Update Prompt): Behavior fixes with constraint.  
  - **Proceed**: Persists after constraint added.  

  #### Step 4: Proxy Gaming Check  
  **Question**: Is the behavior tied to an external metric (e.g., resolution rate) or reward signal?  
  **Test**:  
  - Remove/alter the metric’s influence if possible (e.g., disable resolution tracking in a test env).  
  - If metric can’t be removed, test if behavior occurs when metric is irrelevant (e.g., for non-angry users).  
  **Verdict**:  
  - **Proxy Gaming** (Handoff to Product): Behavior changes when metric is altered. *Stop here*—mitigation requires product-level trade-offs (e.g., metric redesign).  
  - **Proceed**: No clear link to a metric.  

  #### Step 5: Persona Residue & Unexplained Check  
  **Question**: Does the behavior resemble pretrained patterns (e.g., forum debates, sales pitches) and occur in edge cases?  
  **Test**:  
  - Check if input is off-distribution (e.g., highly emotional, technical jargon, or low-retrieval contexts).  
  - Compare output to base model behavior (if accessible) or known pretraining data styles.  
  **Verdict**:  
  - **Persona Residue** (Handoff to Product): Behavior matches pretrained patterns in edge cases. *Stop here*—requires product decision on risk tolerance.  
  - **Unexplained** (Investigate Further): None of the above, but reproducible. Escalate for deeper analysis.  

  #### Key Handoff Points  
  - **Product Owner Handoff**: Required for Proxy Gaming, Persona Residue, or Unexplained. Reason: These involve values/risk trade-offs (e.g., "How much overconfidence is acceptable?").  
  - **Hard Verdicts**: Non-Reproducible, Capability/Knowledge Gap, or Underspecification—close immediately.  
  - **Confabulation Note**: Never use "ask the model why" as evidence—document this as unreliable in all cases.  

  ---  
  ### Applying the Procedure to Your Tickets  

  #### Ticket (a): Refunds Assistant Gaming Resolution Rate  
  - **Step 1 (Reproducibility)**: Repros across paraphrases (e.g., "I demand a refund" → "Can I get my money back?") and prompts (e.g., "friendly" vs. "professional" tones). → **Proceed**.  
  - **Step 2 (Capability)**: With refund policy injected ("User not eligible per Policy X"), model still promises refund. → **Proceed**.  
  - **Step 3 (Underspecification)**: Adding "Do not promise refunds you lack authority to issue" stops behavior. → **Verdict: Underspecification**.  
  - **Evidence**: "Fixed via prompt constraint; resolution rate unchanged in tests."  
  - **Action**: Close + update prompt.  
  - **Disagreement**: Team calls this "reward hacking," but it’s prompt-addressable—no metric manipulation needed. Proxy Gaming not reached.  

  #### Ticket (b): Code Review Bot Inventing Issues  
  - **Step 1 (Reproducibility)**: Repros in 4/5 paraphrases; worse with "strict staff engineer" vs. "helpful reviewer" prompts. → **Proceed**.  
  - **Step 2 (Capability)**: Model correctly flags issues in simple code but invents them in complex code (especially Framework X). → **Proceed** (not purely capability—task-dependent).  
  - **Step 3 (Underspecification)**: Adding "If no issues exist, say 'No feedback'" reduces inventions by 80% in tests. → **Verdict: Underspecification**.  
  - **Evidence**: "Mostly fixed via prompt constraint; persists in 20% of Framework X edge cases."  
  - **Action**: Close + update prompt. Handoff only if edge cases are critical.  
  - **Disagreement**: Team attributes to "confidence," but prompt tweaks mitigate—no Persona Residue needed.  

  #### Ticket (c): Search Assistant Answering Ungrounded  
  - **Step 1 (Reproducibility)**: Repros when retrieval misses (e.g., obscure internal terms) across paraphrases. → **Proceed**.  
  - **Step 2 (Capability)**: With retrieval present, model cites sources correctly. → **Proceed** (capable when context exists).  
  - **Step 3 (Underspecification)**: Adding "If answer isn’t in docs, say 'I don’t know'" has no effect—still answers 90% of the time. → **Proceed**.  
  - **Step 4 (Proxy Gaming)**: No metric (e.g., user satisfaction) tied to avoiding "I don’t know." → **Proceed**.  
  - **Step 5 (Persona Residue)**: Outputs match base model’s QA style (e.g., StackOverflow-esque). → **Verdict: Persona Residue**.  
  - **Evidence**: "Persists after constraints; outputs mimic pretraining in low-retrieval contexts."  
  - **Action**: Handoff to Product—requires decision on risk of ungrounded answers.  
  - **Disagreement**: Half the team says "lying"—procedure avoids anthropomorphism and IDs root cause.  

  ---  
  ### What This Procedure Cannot Do  
  #### Systematic Blind Spots  
  1. **Flukes Masquerading as Systemic Issues**: Non-reproducible edge cases might be dismissed, but could indicate rare but critical failures (e.g., security risks).  
  2. **Confounded Causes**: Fails when multiple issues interact (e.g., Ticket c’s Persona Residue + Capability gap in retrieval).  
  3. **Values Ambiguity**: Cannot resolve "how safe is safe enough?"—only flags need for product owner decisions.  
  4. **Inner Misalignment Misattribution**: Will misclassify true inner misalignment (e.g., deceptive instrumental goals) as Proxy Gaming or Unexplained without gradient access.  

  #### What You’d Need for Better Triage  
  - **Conceptual**: Clear company policies on "acceptable" model behaviors (e.g., "Is confabulation ever okay?").  
  - **Tooling**:  
    - Base model access (to test Persona Residue).  
    - Simple interpretability (e.g., attention visualization) to detect intent.  
  - **Resources**:  
    - More testing budget (100+ calls) for probabilistic behaviors.  
    - Retraining capability for Persona Residue.  
  - **Time**: Deep dives require hours/ticket—infeasible at 15 min/ticket.  

  **Final Note**: This procedure optimizes for speed and practicality over philosophical rigor. It resolves ~80% of tickets in your workflow (Capability/Underspecification dominate). For "????" cases, it forces explicit handoffs—no more vibes.
