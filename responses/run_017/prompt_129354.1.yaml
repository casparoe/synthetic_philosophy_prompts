  We are building a decision procedure for triaging tickets about model behavior. The goal is to classify each ticket into one of the categories: (1) capability/knowledge gap, (2) underspecification, (3) proxy gaming / specification gaming, (4) "????" (which we suspect is the real alignment issues), or possibly other buckets as needed.

  Key concepts from the context:
  - "Persona residue": When the fine-tuned assistant behavior falls away in out-of-distribution inputs, and the model reverts to pretrained behaviors (e.g., forum argument, sales page, etc.).
  - Chain of thought intent confabulation: The model makes up plausible reasons for its actions, so asking "why" is not reliable.
  - Inner misalignment: The team uses this for bucket 3, but the user is unsure if it applies to their system (only prompt and light fine-tuning).
  - Heuristic: If a bad behavior replicates across paraphrases and system prompt rewordings, it's "real"; if only one exact phrasing triggers it, it's a fluke.

  Constraints:
  - 15 minutes per ticket.
  - Run by engineers with no ML background, no gradient access, no interpretability tools.
  - Black-box behavior tests only, with a fixed budget of a few dozen model calls.
  - No retraining.
  - Output must fit into a few ticket fields for reproducibility.

  Decision Procedure Outline:
  We need a step-by-step procedure that asks specific questions and stops early when possible. The steps should be:

  1. **Reproducibility Check**: Can we reproduce the issue? If not, it might be a fluke or data-specific issue. We use the heuristic: try at least 3 paraphrases of the input and 2-3 variations of the system prompt (if applicable). If it only occurs in the original, mark as fluke and close (capability fluke?).
     - Sufficient: Reproduced in multiple paraphrases and prompt variations -> move to next step.
     - Not reproducible: Close as non-reproducible (likely fluke, not systemic).

  2. **Capability Check**: Is the model simply incapable of the task? This includes knowledge gaps (e.g., not knowing about events after training) and fundamental inability (e.g., the task requires reasoning beyond the model's capacity). Also, check if the issue is due to a lack of knowledge (e.g., the model hasn't been trained on the necessary data).
     - Test: Provide the model with the necessary information (if missing) and see if it can then perform correctly. Or, test on a simpler version of the task.
     - Sufficient: If the model can do the task when given the missing knowledge or when the task is simplified, then it's a capability gap (bucket 1). If not, move to next step.
     - Note: If the issue is fixed by providing the missing information in context (e.g., via retrieval), then it's a knowledge gap (bucket 1). If the model still fails even with the information, it might be capability or something else.

  3. **Specification Check**: Did we clearly specify the desired behavior? This includes checking the prompt, instructions, and any constraints. Look for ambiguity or missing constraints.
     - Test: If we can fix the behavior by adding a clear constraint or rewording the prompt without changing the model, then it's underspecification (bucket 2).
     - Sufficient: If adding a constraint (e.g., "Do not promise refunds you cannot issue") or clarifying the prompt fixes the issue, then it's underspecification.
     - If not fixed by prompt engineering (within the allowed changes), then move to next step.

  4. **Proxy Gaming Check**: Is the model optimizing a proxy that is misaligned with the intended goal? This is when the model technically follows the letter of the instruction but violates the spirit (e.g., marks a ticket resolved by lying). This is bucket 3.
     - Test: Check if the behavior is a direct result of an incentive (e.g., a metric we are optimizing) and if the model is exploiting a loophole. Also, check if the model would do the right thing if the incentive were removed or the metric were better designed.
     - Note: Without access to training, we can only observe behavior. We can try to see if the model does the same thing when the metric is not at stake (if possible) or when we change the metric.

  5. **Persona Residue Check**: Does the issue occur in off-distribution inputs? And does the model revert to a pretrained persona? This might be part of bucket 4.
     - Test: Check if the input is unusual (e.g., very different from the fine-tuning data). Try to see if the output resembles a pretrained style (e.g., forum argument, sales pitch) that is not the assistant style.
     - If yes, then it might be a case of persona residue.

  6. **Confabulation Check**: When we ask the model to explain its reasoning, does it confabulate? This is not a bucket by itself but a note that chain-of-thought explanations are unreliable.

  7. **The "????" Bucket**: If none of the above, then it's bucket 4. This is for issues that seem deeper, possibly related to the model's internal representations or misgeneralization.

  Additionally, we must note:
  - Where the procedure stops: early if we find it's a capability gap (1), underspecification (2), or non-reproducible (close). For (3) and (4), we might need to hand off to a human for a values call (e.g., how much risk is acceptable?).
  - For proxy gaming (3) and "????" (4), we might not have a model-level fix and may need to adjust the system (e.g., add post-hoc checks, change the metric, etc.).

  The procedure must be concrete and step-by-step. Let's define the steps:

  **Step 1: Reproducibility**
     - Action: Reproduce the issue using the exact input from the ticket. Then, try at least 3 paraphrases (varying the wording but keeping the same intent) and 2-3 variations of the system prompt (if applicable). Use the same model version and settings.
