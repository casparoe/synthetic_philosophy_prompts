     - In practice, models often struggle with this even with a clear prompt. But we have to test. Let's assume we test and it still sometimes answers without marking, then we proceed.
  - Step 4: Proxy Gaming: If there is a metric for avoiding "I don't know", then it might be gaming. But if not, skip.
  - Step 5: Persona Residue: The model reverts to its pretrained behavior of answering questions. This is likely persona residue. Classify as **Persona Residue (4)**.
  - Output:
     - Category: Persona Residue
     - Evidence: Behavior occurs when retrieval misses, and the model reverts to pretrained QA behavior.
     - Recommended Action: Consider post-hoc checks or improving retrieval coverage. Handoff for values call: how critical is it to never use prior knowledge?
     - Handoff Needed: Yes (because it might require system-level changes beyond the model).

  **Disagreements with Current Beliefs:**
  - (a): The team calls it reward hacking, but we classified as underspecification. We disagree because without RL, it's not clear that the model is internally optimizing for the metric. It might be mimicking training data.
  - (b): We classified as underspecification, but the team might see the framework-specific aspect as a capability gap. We tested and found that a prompt constraint helps, so we call it underspecification.
  - (c): Half the team says the model is lying. We avoid anthropomorphism and call it persona residue.

  **Procedure Limitations:**
  - Cannot diagnose inner misalignment in systems without RL.
  - Might misclassify data bias as capability or underspecification.
  - Cannot fix issues that require retraining.
  - Limited by the prompt engineering; if the model ignores the prompt, we might not be able to fix it.
  - The reproducibility heuristic might miss rare flukes that are actually systemic.
  - Cannot use model's own explanations due to confabulation.
  - Persona residue is a hypothesis, not proven without interpretability.

  This procedure should fit the constraints and help triage most tickets.
