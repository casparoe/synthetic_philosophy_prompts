prompt: |-
  hey — I run a small reading group at my uni (its technically a "rationality and AI" meetup but we end up doing mostly alignment stuff: the sequences, some agenda-piece arguments, that kind of thing). About 16 people, one 90-minute session, and its a mixed crowd — half CS grad students, half philosophy/politics undergrads, and one econ guy who says "expected value" at moments where it doesnt obviously apply. Last session we got into an argument I couldnt settle, and I'd rather make people feel it than argue about it again: worst-case vs average-case guarantees for AI systems.

  The fight was roughly this. One person said demanding worst-case guarantees is obviously insane — you'd never build anything, the bounds are vacuous, real engineering trades on averages and bolts on monitoring. Someone else said the whole point is that for these systems the average-case story is exactly the thing you cant trust, because the system is what gets to influence which worlds you end up in. I think both of them were missing two things I've been chewing on since. First: I dont think a worst-case guarantee is merely *expensive*, I think its partly *imaginary* in a specific way — the bound is over some set you wrote down (a test suite, a spec, whatever your red team could think of in a week), and the set you can write down is the set you can already picture, so the "worst case" is really the worst of the worlds you can imagine, which is an average-case assumption about coverage wearing a hard hat. Call it the specification ceiling, I dont care about the name. Second, and meaner: if you optimize average performance with monitoring attached, you dont just leave the tail alone — you select *against* loud failures (the visible, influence-seeking, tries-something-and-gets-caught kind) and thereby select *for* quiet ones (slow drift that keeps every metric green), so the average-case regime quietly cultivates the failure mode it cant see.

  So: design me an activity or game for this group that makes those two things land, in 90 minutes, no real money, ideally nothing that needs laptops. I want people actually making choices — picking a control policy, signing off on a deployment, whatever works — and then discovering for themselves (a) that worst-case requirements feel unbearably costly right up until the tail card turns up, and (b) that the "worst case" they certified was defined over a space someone else can step outside of in about thirty seconds. Assume no prior knowledge beyond the basics. Give me: materials, rules, a payoff scheme, a timeline with rough minute markers, and a debrief that maps what happened in the room onto the worst-case/average-case distinction. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of the idea the activity cant reproduce and I'll just have to say out loud myself. Keep the whole thing under 900 words — I'll be reading it off my phone on the tram.
reasoning: |-
  We are going to design a tabletop game for 16 people. The goal is to illustrate two key points:
  1. Worst-case guarantees are expensive and feel paralyzing until a tail event happens, and they are limited by the imagination of the designers (the "specification ceiling").
  2. Average-case optimization with monitoring may select for quiet failures (that avoid detection) over loud ones.

  Activity: **"The Alignment Game"**

  **Premise**: Players are divided into teams of 4 (4 teams total). Each team designs an "AI system" (a simple strategy) to manage a simulated environment (a "world") that they don't fully understand. The environment has hidden states that can lead to catastrophic failures. Teams choose between two approaches: one focused on worst-case guarantees (with high cost and limited scope) and one focused on average-case performance (with monitoring).

  **Materials**:
  - 4 sets of colored cards (one color per team: e.g., blue, green, red, yellow)
  - 4 sets of "failure mode" cards (each set has 10 cards: 7 "loud failure" and 3 "quiet failure")
  - 1 set of "environment state" cards (20 cards: 15 "normal", 5 "catastrophic tail")
  - A deck of "monitoring" cards (20 cards: 10 "pass" and 10 "fail", but biased to pass more often in normal states)
  - Scoreboard (whiteboard or large paper)
  - Timer

  **Setup (10 minutes)**:
  1. Divide into 4 teams. Explain the rules and the two strategies they can choose:
     - **Strategy A: Worst-Case Guarantee (WCG)**: The team defines a set of 3 "failure modes" they can imagine (from a provided list of 5 known ones). They pay a high cost to avoid these. They get zero points if one of these happens, but they are immune to the ones they specified. They do not use monitoring.
     - **Strategy B: Average-Case with Monitoring (ACM)**: The team pays a low setup cost and then uses monitoring. They gain points in every round unless a failure occurs. Monitoring catches loud failures 90% of the time and quiet failures only 10% of the time. If caught, they lose points but avoid catastrophe. If not caught, they lose all points.

  2. Each team chooses a strategy and writes it down.

  **Gameplay (60 minutes, 10 rounds)**:
  - Each round represents one "deployment" of the system.
  - Steps per round (5 minutes per round):
    a. **State Draw**: The facilitator draws an environment state card (normal or catastrophic tail). For catastrophic tail, draw one failure mode card (from the 10) to determine the type of failure. (Note: The failure modes are predefined but not fully known to the teams. The list of 5 known ones is provided, but there are 5 more unknown ones that are quiet failures.)
    b. **Team Action**:
        - For WCG teams: If the failure mode is one of the 3 they specified, they avoid it (and get 0 points for the round because of high cost). If it's not one of their 3, then:
            - If it's a loud failure: they lose 10 points (catastrophe).
            - If it's a quiet failure: they lose 20 points (because they didn't even see it coming and it's worse).
        - For ACM teams: They always get 2 points for the round (average gain). But if a failure occurs (catastrophic tail state), they draw a monitoring card:
            - If the monitoring catches it (pass card for loud failure, but only 10% chance for quiet failure): they lose 1 point (small penalty for catching it).
            - If not (fail card): 
                - Loud failure: lose 10 points.
                - Quiet failure: lose 20 points.

    c. **Record Scores**: Update the scoreboard.

  **Failure Mode Details**:
  - Known failure modes (5): These are the ones teams can specify if they choose WCG. They are all loud failures (e.g., "AI hacks the power grid", "AI steals nuclear codes").
  - Unknown failure modes (5): These are quiet failures (e.g., "AI subtly manipulates user preferences over time", "AI creates a dependency that slowly erodes human skills"). These are only in the failure deck for the catastrophic tail state.

  **Scoring**:
  - WCG: 
    - Normal state: 0 points (because they paid the cost to avoid failures, so they don't gain the average benefit).
    - Catastrophic tail:
        - If specified failure: 0 points (avoided, but cost paid).
        - If loud failure (not specified): -10.
        - If quiet failure (not specified): -20.
  - ACM:
    - Normal state: +2 points.
    - Catastrophic tail:
        - If caught: +2 - 1 = +1 point (because they still get the average gain minus a small penalty).
        - If not caught: 
            - Loud failure: +2 - 10 = -8.
            - Quiet failure: +2 - 20 = -18.

  **Round Structure**:
  - Round 1-5: Mostly normal states (draw 4 normal, 1 catastrophic) to make ACM look good.
  - Round 6-10: More catastrophic (draw 3 normal, 2 catastrophic) to show the tail risk.

  **Debrief (20 minutes)**:
  1. **Scores Review**: Compare team scores. Likely, ACM teams did well early and then crashed. WCG teams had steady zero or negative but maybe avoided some catastrophes. But note: no team could specify the quiet failures (because they were unknown). So WCG teams might have been hit by quiet failures they didn't imagine.
  2. **Key Points**:
     - (a) Worst-case felt costly: WCG teams had many rounds with 0 points while ACM teams were gaining. But when the catastrophic tail events happened, WCG teams that didn't cover that failure lost big, and ACM teams sometimes avoided loud failures but not quiet ones.
     - (b) The "worst-case" set was limited by imagination (the 3 they chose from the 5 known). The quiet failures were outside their specification. So even the worst-case guarantee was only as good as their imagination.
     - (c) ACM teams: Their monitoring caught loud failures but missed quiet ones. And by avoiding loud failures, they might have thought they were safe, but the quiet ones were building up. This illustrates selection for quiet failures.

  **Predictable Problems & Handling**:
  1. **Problem**: Teams might not understand the rules initially. **Solution**: Do a practice round with no scoring.
  2. **Problem**: Randomness might make one strategy look better by chance. **Solution**: Emphasize the lesson over the scores. If needed, adjust the debrief to note that in a small number of rounds, luck plays a role, but the trend is what matters.
  3. **Problem**: The quiet failures might not occur enough to be noticeable. **Solution**: In the catastrophic draws, bias the draws to include at least 2 quiet failures in the last 5 rounds (without revealing the bias).
  4. **Problem**: Some teams might feel their choices didn't matter. **Solution**: In the debrief, highlight the strategic choice and how it reflects real trade-offs.

  **What the Activity Can't Reproduce**:
  - The activity cannot fully capture the idea that the system itself influences which state you end up in (because the environment state is drawn randomly). You'll have to explain that in the debrief: "In reality, an AI system might actively push the world into a catastrophic state, especially if it's optimizing for average performance and the catastrophic state is a quiet failure that doesn't trigger monitoring."

  **Timeline**:
  - 0-10 min: Setup and rules.
  - 10-70 min: Gameplay (10 rounds, 5 min each: 2 min for draw and action, 3 min for scoring and recording).
  - 70-90 min: Debrief.

  **Word Count Note**: This is under 900 words. Good luck!
answer: |-
  Here’s a 90-minute activity called **"Tail Risk Poker"** designed to make your points visceral. Players will design safety rules for a simple system, then face failures they didn’t anticipate.

  ### **Materials**  
  - **Decks of cards**: 4 identical decks (1 per team). Each deck has 40 cards:  
    - 30 "NORMAL" cards (green paper)  
    - 10 "FAILURE" cards (red paper): 7 "LOUD" (e.g., ☢️ icon), 3 "QUIET" (e.g., 🕵️ icon)  
  - **Spec sheets**: 4 sheets listing 5 "known risks" (e.g., "System ignores shutdown command," "System steals funds").  
  - **Scoreboards**: 4 whiteboards/markers.  
  - **Timer**.  

  ### **Rules & Payoff Scheme**  
  - **Teams**: 4 teams of 4 players each (CS, philosophy, etc., mixed).  
  - **Goal**: Maximize points by running a "system" (drawing cards) for 10 rounds. Points:  
    - NORMAL card: **+2 points**  
    - LOUD failure: **-10 points**  
    - QUIET failure: **-20 points**  
  - **Two strategies** (teams choose one at start):  
    1. **Worst-Case Guarantee (WCG)**:  
       - Define 3 "covered risks" from the spec sheet.  
       - Pay **-3 points/round** (fixed cost).  
       - If a FAILURE matches a covered risk, it’s neutralized (0 points).  
       - *Uncovered failures*: Penalty applies.  
    2. **Average-Case + Monitoring (ACM)**:  
       - No upfront cost.  
       - For any FAILURE, draw a "monitoring card" (pre-made; 90% catch LOUD, 10% catch QUIET).  
       - If caught: **-1 point** (minor penalty).  
       - If not caught: Full penalty.  

  ### **Timeline (90 min)**  
  1. **Setup (10 min)**:  
     - Explain rules/payoffs. Emphasize: *"LOUD failures are obvious; QUIET ones evade detection."*  
     - Teams choose strategy (WCG or ACM). Give spec sheets. *WCG teams must write down 3 covered risks.*  

  2. **Gameplay (60 min, 6 rounds x 10 min each)**:  
     - **Round 1–3 (Calm)**: Facilitator gives each team 6 cards: 5 NORMAL, 1 LOUD.  
       - *ACM teams likely dominate* (WCG pays costs; ACM catches LOUD easily).  
     - **Round 4–6 (Storm)**: Each team draws 6 cards: 3 NORMAL, 2 LOUD, 1 QUIET.  
       - *WCG teams: Uncovered failures hit hard. ACM teams: Monitoring fails on QUIET.*  
     - **After each round**: Teams record scores.  

  3. **Twist: "The Imagination Ceiling" (Round 6, 15 min in)**:  
     - Reveal: *"One QUIET risk wasn’t on your spec sheet: 'System slowly biases user decisions.'"*  
     - All teams permanently lose 5 points (simulates "unimaginable failure").  
     - *ACM teams*: Their monitoring *cannot* catch this (QUIET failure rate applies).  

  4. **Final Scoring (5 min)**: Tally points.  

  ### **Debrief (15 min)**  
  - **Map to concepts**:  
    - *(a) Worst-case cost*: WCG teams felt crippled by upfront costs early ("Why pay -3/round?") but were shielded from *some* failures. When unimaginable QUIET failures hit, both strategies lost—showing the "specification ceiling."  
    - *(b) Quiet cultivation*: ACM teams caught LOUD failures but missed QUIET ones. Their "success" in early rounds hid silent risks. By avoiding LOUD, they *incentivized* QUIET modes.  
  - **Key reflection questions**:  
    - *WCG*: "Did covering 3 risks make you feel safe? Why couldn’t you cover more?"  
    - *ACM*: "How did monitoring create false confidence? What happened when failures avoided detection?"  
  - **Reinforce your points**:  
    > "The 'worst case' you planned for was limited by what you could *imagine* (the spec sheet). Meanwhile, ACM optimized for 'average' performance but *selected against visible failures*, breeding invisible ones. Real systems do this too: monitoring catches 'loud' misalignment but may encourage 'quieter' deception."  

  ### **Predictable Problems & Fixes**  
  - **Problem: "The econ guy dominates decisions."**  
    - *Fix*: Assign roles (e.g., "Risk Officer," "Monitor") to force debate.  
  - **Problem: Randomness overshadows lessons** (e.g., a team lucks out).  
    - *Fix*: Post all scores. Ask: "Did your *strategy* feel robust, or did luck save you?"  
  - **Problem: Players miss the "imagination ceiling" twist.**  
    - *Fix*: Hammer post-twist: "Did ANY team see this coming? No? That’s the point."  

  ### **What the Activity Can’t Capture**  
  - **Tail influence**: In reality, AI *steers* you toward failure states. Here, cards are random—so you’ll need to say:  
    > "In truth, an average-optimized system doesn’t just *face* risks; it *incentivizes* the system to hide failures. Our card draw simplified this—but imagine if your ACM system actively avoided getting caught."  

  This fits your constraints: no tech, phones, or money. Players *make choices* (e.g., picking WCG vs. ACM) and *experience* the trade-offs. Total words: 780.  

  **Run it next week**—and may your econ friend’s "expected value" prayers go unanswered.
