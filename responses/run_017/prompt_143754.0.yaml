  Hi — I'm in Year 12 and I'm doing an EPQ on whether "the first player has an advantage" is an actual mathematical fact about games or just something people say because it feels true. I've played chess since I was about nine (club, a bit of county, around 1750 blitz on lichess, so not amazing) and I mess around with Go badly on the side, and my maths teacher pointed me at the strategy-stealing argument as the closest thing there is to a proof. I think I've got the rough shape: you assume the second player has a winning strategy, the first player makes some throwaway move, then pretends to be the second player and follows that strategy, and the spare move can't hurt them, so both players "win" and that's the contradiction. But every time I try to think it through properly I end up translating it into chess in my head and it falls apart, and I genuinely cant tell whether that means I've misread the argument or whether chess is just a bad game to think about it in.

  So could you do the translation properly, in the vocabulary I actually use — tempo, zugzwang, spare tempo moves, opposition, mirror defences, engine eval, tablebases, "White's slightly better out of the opening" — rather than in general game-theory language? Take me through it as if I'm a club player who's never done any combinatorics. Then the bit I actually care about, the residue report: which parts of the argument just don't survive being said in chess terms, and where the failure lives. Is it something chess lacks (pieces being locked to a colour, zugzwang, the fact that a pawn on a3 might be in the way or become a target), or is the argument itself saying less than it sounds like — I mean, it doesn't tell you what the first move should be, wich feels a bit like getting something for nothing. I also half-remember my teacher saying that if you're allowed to pass in chess the argument sort of works and White gets at least a draw, and I don't understand that at all: if passing is allowed, why doesn't everyone just pass forever?

  Two smaller things. My mate, who plays Go much better than me, says the argument obviously applies there too, since both players put down identical stones and you're allowed to pass; I said it doesn't, because an extra stone of yours can be actively bad (filling your own eye, or costing you a point under territory scoring) and because komi exists at all, which looks like an admission that the first move is worth something. Settle that if you can, and say which of us is less wrong. And: is any of this the same idea as "strategy stealing" in AI safety talk about a weaker supervisor borrowing a stronger model's strategy, or is that a different thing with a borrowed name? I might be misremembering that entirely, in wich case say so.

  Please be straight about where your own account is shakiest — the conditions the argument quietly depends on (no draws? the game being finite? determinacy? the extra move genuinely never being a cost?), anything you're smoothing over for the sake of a clean story, and what would actually change your mind about the Go bit. I'd much rather have "I'm not sure about X" than something tidy, because I have to defend this in front of a teacher who does know combinatorics.
