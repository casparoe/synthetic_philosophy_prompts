prompt: |-
  I am writing a novel set about ninety years from now, and I have written myself into a corner that I would like help getting out of. Its central institution is a standing commission I have been calling the Tribunal of Moral Standing, which assigns every kind of animal — and lately every engineered kind — to one of five tiers. Tier 1 is full standing: the kind may not be killed, confined, or used in research for any benefit that would not also justify the same treatment of an adult human being. Tier 2 requires a weighty justification for killing or confinement and forbids commercial farming. Tier 3 requires that interests be weighed and accommodated where accommodating them is cheap, but permits ordinary use, including food use under welfare rules. Tier 4 prohibits only gratuitous cruelty. Tier 5 is no standing at all: the kind is property, or an ecological asset.

  The opinions I have already written reason case by case and never state a rule. Each of them cites neural measurements alongside behavioral evidence, and I deliberately wrote them so that a careful reader could take either to be doing the real work. Now I have to write the hearing on two pending petitions, and I need to know what rule I have committed the Tribunal to, because my narrator is a junior clerk whose entire function in the book is to notice that the Tribunal cannot say what it is measuring.

  The precedents, as the record stands:

  1. Born human beings of every age and condition, including infants and people with advanced dementia: tier 1.
  2. A human patient diagnosed on the record as being in a permanent vegetative state: tier 4, over two dissents holding that membership in the species settles the matter. The majority reasoned that the integrative structures are destroyed, so that there is no longer anything that has a point of view.
  3. Great apes: tier 2, the highest any nonhuman kind has reached. Three clerks wrote separately that no capacity the Tribunal has ever named separates them from the humans in tier 1, and that the line falls where it does because of the history of the statute rather than any difference the Tribunal can state.
  4. Elephants, bottlenose dolphins, pigs, and dogs: tier 2.
  5. Ravens: tier 2, notwithstanding a brain a small fraction of the mass of a dog's. The opinion leans on forebrain neuron counts in the same range as a monkey's and on flexible problem-solving in novel tasks.
  6. Sheep: tier 3, although the brain is many times the mass of a raven's.
  7. Octopuses: tier 3, with a few hundred million neurons, a large majority of them in the arms rather than the central brain.
  8. A small reef fish reported to show mark-test-like behavior: tier 3, by a vote of four to three.
  9. Decapod crustaceans: tier 3.
  10. Carp and other teleosts: tier 4.
  11. Honeybees: tier 5, at roughly a million neurons.
  12. A colony of thirty thousand leafcutter ants, petitioning as a single agent: tier 5. The petitioners observed that the colony's aggregated neurons are in the same range as a raven's; the Tribunal answered that a colony is not a nervous system, and that its parts do not stand in the causal relation to one another required to share a point of view.
  13. A laboratory-grown human cortical organoid of about two million neurons: tier 5, on the grounds that it has no body, no behavior, and nothing it is like to be it, and in any case falls below the line.

  The two petitions I must now decide:

  Petition A, which the plot turns on, is brought by the Small: engineered descendants of human beings, twenty-two centimeters tall, with a body mass near a kilogram and a half and a brain of some forty-four grams — less, in absolute mass, than the brain of the sheep in tier 3. The smallness is achieved by smaller neurons, thinner myelin, and shorter axons; the neuron count of the integrative structures is the equal of an unmodified human brain, and the whole thing runs faster per unit volume on a fifth of the energy. The Small have language, cumulative culture, institutions, and funerals. Their petition argues that they are human beings with a modified developmental program; the state argues that they are a new kind, and the statute's word for tier 1 has never been defined. I do not want the scene to turn on a lawyer's point, so please treat the question as the moral one the statute is failing to answer.

  Petition B is brought on behalf of the Chorus, a sessile colonial organism of roughly a hundred and eighty thousand zooids, each with a ganglion of a few hundred neurons, amounting to some tens of millions in total, joined by a shared signaling net. Individual zooids learn nothing at all. The colony, however, habituates to a harmless vibration over about three weeks, and the response returns when the vibration is paired with a mild shock; excising a third of the colony does not erase the habit. There is no central ganglion, and the neural tissue is a negligible fraction of the body's mass. Its total neuron count is far below an octopus's and far above a bee's.

  What I would like from you:

  First, set out the rules that fit the precedents jointly — I can see several candidates in my own material (something like a threshold on neuron count within a single causally integrated system; something like encephalization or size relative to body size; something like behavioral flexibility and learning capacity; something like membership in a kind, with a human carve-out that the vegetative-state case shows to be defeasible) — and say what each of them predicts about the Small and about the Chorus. Assume the Tribunal cannot look anything up: it reasons only from the record as I have given it above.

  Second, give me your best guess at what the Tribunal should rule in each case if it wants to be consistent with itself, which precedent is the closest analog in each case, and — where the precedents genuinely underdetermine the answer — an honest account of what principle the Tribunal would be adopting with each of the options open to it.

  Third, I need the dissent in each case to be the better argument, because that is the book. Give me the strongest version of each dissent, the one a moral philosopher could actually sign, and tell me what the majority has to pay to answer it.

  Fourth, my clerk has one sentence to herself in the final chapter. Draft it: what has brain size — absolute size, neuron count, size relative to the body — been standing in for all this time, and why does a proxy that has been reliable for a century and a half come apart in these two cases?

  Fifth, I have one more chapter in which I want the Tribunal forced to say whether the measurement is doing intrinsic work in its reasoning or merely evidential work. The petition I have in the drawer is for an engineered kind with a two-kilogram brain and more integrative neurons than any human being, whose entire behavioral repertoire is innately specified: it navigates, builds, and displays with astonishing precision, but it shows no reversal learning, no habituation, no operant conditioning, a fixed withdrawal response to injury, no response to analgesics, and no sign that anything matters to it. Is that the instrument I want, and what would each of the candidate rules say about it? If a different invented petition would separate the rules more cleanly, tell me what it should be and why it discriminates better.

  Please answer in American English.
reasoning: |-
  Hmm, the user is writing a sci-fi novel about a future Tribunal that assigns moral standing tiers to animals and engineered beings. They've written themselves into a corner with two pending petitions and need help resolving the Tribunal's implicit rules.

  The Tribunal's tier system ranges from full human-like rights (Tier 1) to no standing at all (Tier 5). The precedents show interesting patterns: humans generally get Tier 1 except PVS cases, while cognitive ability seems key for non-humans (apes/dolphins at Tier 2, ravens surprisingly high despite small brain size, bees low). There's tension between neural metrics and behavioral evidence throughout.

  For Petition A (The Small): These are tiny engineered humans with full human-equivalent cognition. Precedents suggest human membership usually guarantees Tier 1, but the PVS case shows this isn't absolute. The closest analog is actually ravens - demonstrating high cognition in a small package. A consistent Tribunal would likely give Tier 1, but might resist due to bias against engineered beings. The dissent would powerfully argue that denying rights based on size is pure prejudice.

  For Petition B (The Chorus): This colonial organism has high total neurons but distributed cognition. Precedents point both ways - the ant colony rejection suggests decentralized systems don't count, but octopus/reef fish show partial standing with unconventional neurology. The behavioral evidence here is weak (simple learning only). Likely Tier 3-4 outcome, with dissent arguing that the learning threshold is arbitrary.

  The user's clerk character needs to notice the Tribunal's measurement confusion. The perfect final line would capture how these metrics are just proxies for "subjectivity" - which breaks down when biology diverges from evolutionary norms.

  For the planned future petition (the hyper-efficient but non-conscious entity), this perfectly exposes the Tribunal's dilemma. Does consciousness matter intrinsically, or are they just rewarding human-like cognition? Each rule candidate splits differently here, making it an ideal narrative tool.

  Key tensions to emphasize:
  - The Tribunal claims objectivity but clearly smuggles in human-centric biases
  - Neural metrics work until biology is re-engineered
  - Behavior matters until it becomes "too alien"
  - The human exception is inconsistently applied

  The philosophical heart seems to be: Can you measure moral worth without defining what makes experience matter? The Tribunal's failure to answer this is the story's central irony.
answer: |-
  Here’s a breakdown of your Tribunal’s implicit rules, predictions for the petitions, dissents, and the clerk’s revelation—all grounded strictly in your precedents. I’ll address each request step-by-step in plain American English.

  ---

  ### **1. The Rules Fitting All Precedents**  
  The Tribunal uses **behavioral evidence** and **neural metrics** as overlapping, interchangeable criteria, but three rules emerge as consistent with all rulings:  
  - **Rule A (Integrated Subjectivity Threshold):** Standing requires a *single, causally integrated system* with sufficient neural complexity to support flexible learning, problem-solving, and behavioral evidence of a "point of view." Neural metrics (neuron count, location) must align with behavioral evidence.  
    - *Predicts for The Small:* **Tier 1.** Neuron count matches humans, behavioral evidence (language, culture, funerals) is overwhelming. Size is irrelevant (see ravens vs. sheep).  
    - *Predicts for The Chorus:* **Tier 4–5.** No central integration (like the ant colony), negligible neural tissue per zooid, and only rudimentary learning (habituation). Total neuron count doesn’t create a unified subject.  

  - **Rule B (Behavioral Capacity Primacy):** Standing tiers reflect observed *cognitive flexibility*—learning, innovation, social complexity—with neural metrics as supporting evidence. "Human-like" cognition isn’t required, but *rich behavioral repertoires* dominate.  
    - *Predicts for The Small:* **Tier 1.** Cumulative culture/institutions/funerals exceed even raven/dolphin evidence.  
    - *Predicts for The Chorus:* **Tier 3.** Habituation + associative learning (like the reef fish) meets Tier 3’s low bar, despite unconventional biology.  

  - **Rule C (Neurocentric Threshold):** A minimum threshold of "integrative" neurons (in centralized structures) is required for higher tiers, but behavioral evidence can elevate borderline cases.  
    - *Predicts for The Small:* **Tier 1.** Full human-equivalent neuron count in integrative structures.  
    - *Predicts for The Chorus:* **Tier 5.** Neurons are distributed, not centralized; no "integrative" brain region.  

  ---

  ### **2. What the Tribunal *Should* Rule for Consistency**  
  **The Small (Petition A):**  
  - **Majority Ruling:** **Tier 1.**  
    - *Closest Analog:* Humans (Tier 1) and ravens (Tier 2). The raven precedent shows neuron count trumping absolute brain size. The vegetative-state case proves human biology isn’t sacrosanct—*cognition* is key. The Small have human-equivalent cognition.  
    - *Principle Adopted:* **Integrated Subjectivity (Rule A).** Size, energy efficiency, and origin are irrelevant; only measurable cognition matters.  

  **The Chorus (Petition B):**  
  - **Majority Ruling:** **Tier 4** (prohibits only gratuitous cruelty).  
    - *Closest Analog:* Leafcutter ants (Tier 5). Like the ants, the Chorus lacks causal integration—it’s a decentralized network. Simple learning (habituation) aligns with Tier 3 reef fish, but the lack of a unified point of view pulls it down.  
    - *Principle Adopted:* **Integrated Subjectivity (Rule A).** Total neuron count is irrelevant without a singular subject.  

  **Underdetermination Note:** The Chorus is genuinely ambiguous. The reef fish (Tier 3) set a low behavioral bar, but the ant colony rejection shows decentralized systems fail. The Tribunal would split 4–3, adopting a "causal unity" requirement.  

  ---

  ### **3. The Dissents (The Better Arguments)**  
  **Dissent for The Small (Arguing for Tier 1 if majority denies, or Tier 2 if majority grants Tier 1):**  
  > *"The Tribunal betrays its own logic. We elevated ravens with walnut-sized brains based on neuron density and problem-solving. We demoted humans with broken brains. Yet now, faced with beings who think, mourn, and build as we do, we retreat to biological essentialism. Their size changes nothing—unless we admit we measure worth by how much space a mind occupies, not what it contains. If neuron count in integrative structures matters, theirs matches ours. If behavior matters, theirs is demonstrably rich. Denying them full standing exposes this Tribunal’s unspoken bias: human morphology as moral bedrock. That foundation crumbled when we relegated the vegetative patient to Tier 4. Consistency demands Tier 1."*  
  - **Cost to Majority:** The majority must either (a) explicitly privilege unmodified human biology (contradicting the PVS case), or (b) invent a new neural threshold The Small fail (undermining the raven ruling).  

  **Dissent for The Chorus (Arguing for Tier 3):**  
  > *"We granted Tier 3 to a fish for mark-test curiosity and to octopuses with neurons in their arms. Why? Because they exhibit adaptive learning. The Chorus learns. It habituates, associates vibration with pain, and retains memory despite losing a third of itself. That it does so without a central brain is a quirk of biology—not a moral failing. Our test should be: ‘Can it suffer? Can it adapt?’ Not: ‘Does it think in a way we recognize?’ The ant colony failed because it showed no learning; this succeeds. By fixating on neural architecture, we privilege animal bodies over alien minds. Tier 3 is the consistent call."*  
  - **Cost to Majority:** The majority must argue that *centralization* is intrinsically necessary for moral relevance—a principle never stated in prior rulings (octopuses lack it, reef fish ambiguity).  

  ---

  ### **4. The Clerk’s Final Sentence**  
  > *"For 150 years, we treated brain size as a proxy for the weight of a soul—but we were only ever measuring how much a mind resembled ours."*  

  **Why the Proxy Fails Now:**  
  - **The Small:** Prove cognition isn’t tied to physical scale, exposing that "size" was a stand-in for human-normal *experiences*.  
  - **The Chorus:** Challenges the assumption that consciousness requires a brain-like structure, revealing that neural metrics were proxies for *familiar* cognition.  

  ---

  ### **5. The Decisive Future Petition**  
  **Your Engineered Kind ("The Architects"):**  
  - 2kg brain, more integrative neurons than humans.  
  - **Behavior:** Instinctual precision (building/navigating) but **zero learning, no pain response, no behavioral flexibility**.  

  **This is PERFECT.** It cleanly separates the rules:  
  - **Rule A (Integrated Subjectivity):** Tier 4–5. No point of view—no learning, pain avoidance, or internal goals. Neurons mean nothing without subjective experience.  
  - **Rule B (Behavioral Capacity):** Tier 5. Absence of learning/adaptation fails the lowest bar (bees show some learning).  
  - **Rule C (Neurocentric Threshold):** Tier 2–3. Highest neuron count ever seen—so sheer volume might compel standing despite behavioral emptiness.  

  **Tribunal’s Dilemma:**  
  - If they grant standing (Rule C), they admit neurons matter *intrinsically*—even without consciousness.  
  - If they deny it (Rules A/B), they admit behavior/experience is what they *actually* value.  

  **Sharpens Your Theme:** This petition forces the Tribunal to confess whether they care about *conscious experience* (implied by behavior) or *neurological hardware* (their stated metric). The Architects’ exquisite, empty efficiency makes "brain size" absurd as a moral standard.  

  **Ruling Prediction:** 5–2 for **Tier 5**. Majority cites the vegetative patient: no integrative function = no standing. Dissent argues neuron count alone demands protection. The clerk realizes the Tribunal never defined what "integration" *is*.  

  --- 

  This framework resolves your corner, sets up the final philosophical clash, and keeps the focus on your clerk’s revelation: the Tribunal was measuring *similarity to humans*, not moral worth. The Architects’ petition will force them to confront it.
