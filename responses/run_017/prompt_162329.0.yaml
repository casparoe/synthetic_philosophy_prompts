prompt: |-
  hey — I sit on this city's Commemoration Advisory Panel (seven of us, monthly meetings, the school board can override us but basically never has) and we've got a school naming case to decide in three weeks, so I'm trying to work out what we already committed ourselves to. Our run of verdicts so far:

  - bronze statue of a Confederate colonel on the courthouse lawn, put up in 1909 by the local daughters-of-the-confederacy chapter — removed to museum storage, empty plinth left with an interpretive marker
  - a street and the public library both named for a 19th-century merchant who was the city's biggest slave trader and whose bequest founded the library — street renamed for a local civil-rights lawyer, library kept its name with a lobby installation about the bequest
  - elementary school named for a suffragist who also campaigned for immigration restriction and wrote against Black suffrage — kept, plaque added
  - research wing named for a surgeon honored for a technique he developed by experimenting on incarcerated patients without consent — renamed, 4–3
  - science building named for a geneticist who was a prominent eugenics advocate but whose honored discovery had nothing to do with that — kept, plaque rewritten to say both things
  - bust of a mayor who desegregated the schools and also signed off on the redlining-era housing plan — kept, plaque rewritten
  - a school renamed in 1961 for a sitting governor explicitly as a tribute to his resistance to desegregation — renamed again in 2019
  - a park renamed in 1998 for a man lynched here in 1918, at the request of a preservation society; some descendants said the naming was done over their heads and reopens the wound — we kept the name but funded a family-designed commemoration and an oral-history project instead

  New case: Vance Elementary, named in 1926 for Ellery Vance, a banker and parks commissioner who donated land for six city parks and paid for the school's playground; that's what he's honored for. In 1921 he was a leading figure in the neighborhood association that organized the boycott-and-petition campaign that drove about 200 Black families out of Riverside, and he signed the deed restrictions that kept that neighborhood white for a generation. He never held office, no Confederate connection. Twist: the school was closed in 1988 and reopened across town as a merged school that kept the name; today's families are mostly Latino and Black with no tie to Riverside, and the PTA mostly shrugs and doesn't want to spend money on new signs and uniforms. A descendant-led group, the Riverside Descendants Project, is petitioning for renaming.

  So: what should we decide if we want to be consistent with ourselves, and which precedent is the real analog — the surgeon's wing, where the honored achievement was built on the wrong, or the science building and the mayor's bust, where the wrong sat alongside the achievement? If our precedents genuinely don't settle it, I want to know what principle we'd be adopting with each option, stated plainly enough that a member can sign onto it.

  Two facts we haven't nailed down: (a) whether Vance's park deeds restricted use to white residents, and (b) whether the school was sited to serve a whites-only subdivision. Which of those, established either way, would actually flip your recommendation, and how?

  Also, if we do rename: an anonymous donor will cover the ~$85k in signage and rebranding costs only if the new name is "Riverside Elementary," restoring the name of the neighborhood that was erased. Half the panel thinks that's the whole point, half thinks it's paying a stranger to pick our name. And tell me whether cost should count at all — I don't think we've ever said.

  Finally, please say how confident you are in each of your calls and single out the one you're least sure of.
reasoning: |-
  Okay, the user is part of a Commemoration Advisory Panel facing a decision on renaming Vance Elementary. They've provided a detailed history of past decisions and want to know how to handle this case consistently. Let me start by understanding their precedents.

  Looking at the past cases, there's a pattern. When the honored achievement was directly linked to the wrongdoing, like the surgeon's experiments, they renamed. When the wrongdoing was separate, like the geneticist or the mayor, they kept the name with added context. The Vance case seems to fall in the latter category—his philanthropy vs. his role in segregation. But the user needs to know which precedent applies.

  The user also mentioned two unresolved facts: whether Vance's park deeds had racial restrictions and if the school was originally for a whites-only area. If the park deeds had explicit restrictions, that ties his philanthropy to racism, making it more like the surgeon case. If the school was built for a segregated neighborhood, it directly links the school to the harm, which might push towards renaming. Those facts could flip the decision.

  Another twist is the renaming cost covered only if it's "Riverside Elementary." The panel is split on whether accepting donor terms is appropriate. In past cases, cost wasn't a factor, but here it's conditional. The principle of independence vs. practicality comes up. If they rename, taking the donor's offer might be pragmatic, but it risks setting a precedent where donors influence decisions.

  The Riverside Descendants Project is advocating for change. Past actions, like the park renaming for the lynching victim, involved descendant input. Here, the affected group is pushing for renaming, which might align with the panel's trend of addressing community harm. The current school community is indifferent, but the descendants' request adds weight.

  Underlying all this is the panel's need for a clear principle. They want consistency but also a defensible rationale. The user might be seeking validation that separating Vance's actions (philanthropy vs. racism) justifies keeping the name with context, or they might lean towards renaming due to the direct harm caused. They also need to navigate internal panel disagreements on the donor issue and unresolved facts.

  I should emphasize that the unresolved facts about the deeds and school siting are critical. Confirming racial restrictions in deeds makes Vance's philanthropy part of the racist system. Proving the school was for a whites-only area ties the institution to exclusion. Without those, the case resembles the geneticist or mayor—separate issues. But with them, renaming becomes more consistent with the surgeon precedent.

  Regarding the donor, the panel has never considered cost before. Accepting conditional funding might compromise their independence. But rejecting it over principle when funds are needed could be impractical. They need to decide if practical concerns can override procedural purity, which hasn't been tested before.

  Lastly, confidence levels. The recommendation to keep the name with a plaque is medium confidence, pending the facts. The donor issue is low confidence because it's new territory. The user needs clear principles for each option to help the panel agree.
answer: |-
  Based on your panel's established precedents and the specific details of the Vance Elementary case, here's a breakdown of how to approach consistency, key principles, outstanding facts, the donor issue, and confidence levels:

  **1. Consistency with Precedents & Recommendation:**

  *   **Core Analog:** The **Science Building (Geneticist) and Mayor's Bust** precedents are the strongest analogs. Vance's honored contribution (land for parks, playground funding) is distinct from his harmful action (organizing racial expulsion). The wrongdoing (driving out Black families, deed restrictions) was significant and morally reprehensible but was a separate sphere of activity from the specific philanthropy for which he is commemorated at the school. This mirrors:
      *   Geneticist: Honored discovery (distinct) vs. Eugenics advocacy (separate harmful belief).
      *   Mayor: Honored for desegregation (positive) vs. Redlining (separate harmful action).
  *   **Distinguishing from the Surgeon:** The surgeon's *honored achievement* (the surgical technique) was *directly built upon* the unethical experiments. The harm was the *means* to the end being commemorated. There's no evidence Vance's philanthropy for parks/playgrounds was *funded by* or *required* the expulsion of Black families, nor that the parks/playground were *themselves* tools of segregation *in this specific instance* (though the deed restriction point is key - see below).
  *   **Initial Recommendation:** **Keep the name "Vance Elementary" but install a prominent, contextualizing plaque.** This plaque must explicitly and unflinchingly detail Vance's leading role in the racist expulsion campaign from Riverside and the resulting deed restrictions, alongside the facts of his park donations and playground funding. This mirrors the "plaque added/rewritten" approach used for the Suffragist, Geneticist, and Mayor.

  **2. Principle Adopted with Each Option:**

  *   **Option 1: Keep Name with Plaque (Recommended for Consistency):**
      *   **Principle:** "We maintain commemoration when the specific act or contribution being honored is distinct and separable from the individual's other significant wrongdoings, provided the commemoration itself is not inherently linked to or a direct product of that wrongdoing. We add context to ensure a full understanding of the individual's complex legacy."
  *   **Option 2: Rename:**
      *   **Principle:** "We remove commemoration when the individual's actions include participation in or leadership of campaigns causing severe, targeted community harm (like racial expulsion), especially when that harm is foundational to the context in which their later philanthropy occurred, rendering the separation of 'good deeds' insufficient. The scale and nature of the harm outweigh the distinctness of the honored contribution in this context."

  **3. Impact of Unresolved Facts (a & b):**

  *   **Fact (a): Whether Vance's park deeds restricted use to white residents.**
      *   **Established YES:** This **significantly strengthens the case for renaming (medium-high confidence flip)**. It directly links his *philanthropy* (the parks) to the *harm* (enforcing segregation). It transforms the parks from neutral/generous gifts into active instruments of the racial exclusion he championed. This makes the "distinct contribution" argument much harder to sustain, pulling it closer to the *Surgeon* precedent (achievement built on/tied to the wrong). Principle: The honored philanthropy was intrinsically part of the racist system he enforced.
      *   **Established NO:** Reinforces the "distinct spheres" argument. The parks were not *themselves* segregated by his deed (though access via housing exclusion might still be an issue). Supports Option 1 (Plaque).
  *   **Fact (b): Whether the school was sited to serve a whites-only subdivision.**
      *   **Established YES:** This **strengthens the case for renaming (low-medium confidence flip)**. It directly ties the *school itself* and its original purpose to the racially exclusive neighborhood Vance helped create. The institution being commemorated was an explicit *beneficiary* of the harm. Principle: The school's very existence and original function were products of the exclusionary campaign Vance led.
      *   **Established NO:** Weakens the direct institutional link to the harm. Supports Option 1 (Plaque), focusing on Vance's actions elsewhere (Riverside).

  **4. The Renaming Donor & Cost Issue:**

  *   **Cost:** Your precedents show cost has **never** been a deciding factor (e.g., moving a statue, renaming a street/library/wing/school). The principle is "what is right," not "what is cheapest." **Cost should not count in the core decision to rename or not.**
  *   **The "Riverside Elementary" Condition:**
      *   **Principle:** Accepting a donation conditional on choosing a *specific name* **compromises the panel's independence and integrity**. It allows an external party (even an anonymous one) to dictate the commemorative outcome, undermining public trust in the process. This is distinct from accepting unconditional funds *after* a decision.
      *   **Practical Reality:** If the panel *does* decide to rename, the $85k is a significant practical barrier. **Recommendation:** If renaming is chosen:
          1.  **Reject the conditional donation** as a matter of principle regarding independence.
          2.  **Open a public process** (as implied by considering "Riverside") for selecting a new name, potentially including "Riverside Elementary" as an option.
          3.  **Seek alternative funding sources** (e.g., school board budget allocation, public fundraising drive emphasizing the principle) to cover the costs. The principle is worth the cost, as per precedent.
      *   **Why "Riverside" is Problematic as a Condition:** While restoring the erased neighborhood name has symbolic power, it should be chosen *on its merits* through a proper process, not because a donor demanded it. It also potentially overlooks the descendants' specific request regarding *Vance* and may not reflect the current school community's identity.

  **5. Confidence Levels & Least Sure Call:**

  1.  **Core Recommendation (Keep name with plaque, based on current info & precedents): Medium-High Confidence.** The parallels to the Geneticist/Mayor precedents are strong. Vance's harmful action, while severe, isn't *intrinsically* linked to the specific philanthropy being honored at the school.
  2.  **Impact of Fact (a) - Park Deed Restrictions (YES flips to Rename): Medium-High Confidence.** This directly ties the philanthropy to the harm, fundamentally altering the case.
  3.  **Impact of Fact (b) - School Siting for Whites-Only Area (YES strengthens Rename case): Low-Medium Confidence.** It links the institution to the harm but doesn't automatically make Vance's *philanthropy* the wrong (like the surgeon). It's more contextual weight.
  4.  **Rejecting the Conditional Donor Offer (if renaming chosen): High Confidence.** This is fundamental to the panel's independence and public trust, consistent with prioritizing principle over convenience.
  5.  **Cost Not Being a Factor: High Confidence.** Demonstrated consistently in past, more expensive decisions.

  **Least Sure Call:** The **impact of Fact (b) (school siting)** on the recommendation. While linking the school to the exclusion strengthens the renaming argument, it's less clear-cut than Fact (a). Does making the school a *product* of the exclusion automatically make commemorating Vance's *donation to that school* unacceptable, even if the donation itself wasn't the mechanism of harm? This feels like a grayer area than the direct link created by the park deeds.

  **Summary Recommendation Path:**

  1.  **Urgently investigate Facts (a) and (b).** These are critical.
  2.  **If Fact (a) is confirmed YES (park deeds restricted), recommend RENAMING.** This shifts the case fundamentally towards the Surgeon precedent.
  3.  **If Fact (a) is NO (or cannot be confirmed), and Fact (b) is YES (school sited for whites-only), the case is closer but leans towards KEEPING WITH CONTEXT (like the Mayor/Bust) *unless* the panel feels the institutional link is overwhelming.** Principle: The harm enabled the school's context, but Vance is honored for a specific contribution within it.
  4.  **If both Facts (a) and (b) are NO (or unconfirmed), recommend KEEPING WITH A ROBUST CONTEXTUALIZING PLAQUE.** Principle: Distinct spheres of action.
  5.  **If renaming is chosen:**
      *   Reject the conditional donation.
      *   Conduct an open process for a new name (potentially including "Riverside Elementary").
      *   Seek alternative funding based on the principle of the decision.
  6.  **Never let cost or donor conditions dictate the core commemorative decision.** Uphold the principle established by your previous actions.
