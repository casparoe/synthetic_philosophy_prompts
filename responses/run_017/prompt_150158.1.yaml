prompt: |-
  I write courtroom fiction, and I am trying to get something right that is not really a matter of dialogue or plot: the theory of emotion that my characters' legal world is quietly committed to. I would like your help reconstructing it, because I keep finding that the practices I am describing pull in different directions, and I cannot tell whether that is my own muddle or the doctrine's.

  Consider the cluster of practices I am working with. A killing done in the heat of passion is treated as a lesser offence than the same killing done deliberately, but only if the killer acted before there was time to cool off: he may have driven across town, bought a weapon, or waited several hours, and the mitigation fails on that basis alone, even if his rage is in no way diminished. The provocation must also be one that would have moved a reasonable person, and in some jurisdictions the question is put in explicitly evaluative terms, asking whether the deceased gave the defendant a justifiable sense of being seriously wronged. A history of small provocations culminating in a trivial final trigger is sometimes allowed in, so that the last straw counts although it could not have moved anyone by itself. Words alone have traditionally not been enough, though a blow is. Separately: remorse counts in a defendant's favour at sentencing, but an apology read out by counsel counts for almost nothing, and a defendant's bare assertion that he was terrified or grief-stricken is treated as nearly worthless unless it shows in what he did. Probation conditions routinely include anger-management courses, on the assumption that a disposition to anger is something a person can be made to work on and be held to account for failing to work on. And the same culture that runs these rules also gives a short window in which to cancel a contract signed at the kitchen table under a salesman's pressure, and imposes a pause before a strike may begin, on the reasoning that the agitation of the moment is temporary and that a night's reflection dissolves it.

  What I want from you is the implicit theory of emotion that this pattern presupposes, worked out rather than named. Which parts of it only make sense if an emotion is a bodily agitation or feeling that swells, decays with time, and is dispelled by deliberation? Which parts only make sense if an emotion is an appraisal or evaluative judgment that can be reasonable or unreasonable, well-grounded or not, and therefore something we can be answerable for? Which parts sit best with the view that emotions are perceptions of value or concern-based construals, apt or inapt in the way a perception is veridical or not? Be careful to distinguish what these practices strictly presuppose from what they merely fit comfortably with, and tell me where they are underdetermined, so that two or three rival theories would license exactly the same rules and my characters could reasonably disagree. Where the pattern seems to me inconsistent, say whether it really is: does the mitigation have to treat emotion as an involuntary storm that displaces agency, given that the same system trains offenders out of their anger, discounts unexpressed remorse, and asks juries to assess whether the passion was warranted?

  Then I want the counterfactual, because that is what my draft actually needs. Take each of the three families of theory in turn and tell me what would have to change in practice if it were the one the law adopted: which of the requirements above survives, which collapses as incoherent, and which would have to be replaced by something else. In particular, tell me what a cooling-off rule could even mean on a view where emotions carry content and can be more or less justified, and what a reasonable-person test could mean on a view where emotions are only felt disturbances.

  One last thing, which is where I have had to invent. My manuscript is set in a jurisdiction that does not exist, and I have given it a rule I have never seen anywhere: the mitigation is unavailable unless the jury finds that the defendant's anger was about the thing he says it was about, so that a man enraged at his own humiliation rather than at what was done to him, or a man who kills the wrong person in a transported fury, gets no reduction. I would like to know which theory of emotion that rule is secretly legislating, whether it is coherent on the terms of the theory that seems to motivate it, and what the cross-examination of such a defendant would sound like under each of the three views. Reason it out from the concepts; I do not need authorities, names, or further reading, and I would rather have your argument than a survey of the literature.
reasoning: |-
  Okay, the user writes courtroom fiction and is struggling with the underlying theory of emotion in their legal world. They've described several legal practices that seem to pull in different directions: heat of passion mitigation requiring no time to cool off, the reasonable person standard, remorse affecting sentencing, anger management courses, and cooling-off periods for contracts and strikes. They want to understand the implicit theory of emotion behind these practices and how different theories would change the rules.

  First, I need to break down the existing practices and map them to three main theories of emotion. The user mentions three families: emotion as bodily agitation (feeling theory), as evaluative judgment (judgment theory), and as perception of value (perception theory). I should analyze each practice against these theories to see which fits best, where there's tension, and where multiple theories could apply.

  Looking at the heat of passion rules: the cooling-off period suggests emotions are temporary physiological states that fade with time, aligning with feeling theory. But the reasonable person standard and the requirement that provocation be "justifiably wronged" point to judgment theory, where the reasonableness of the appraisal matters. The last-straw doctrine complicates things—it could fit perception theory, where accumulated slights create a holistic construal. The remorse rules are tricky: unexpressed remorse not counting suggests emotion as action or manifestation (feeling or perception theory), while anger management implies emotions are controllable, fitting judgment theory.

  The user's invented rule adds another layer: mitigation only if anger was about the correct thing. This seems to demand cognitive transparency and intentionality, leaning towards judgment or perception theory. Under feeling theory, this rule would be incoherent since emotions aren't about specific objects in a cognitive sense. Cross-examinations would differ: feeling theory would focus on physiological signs, judgment theory on the defendant's beliefs, perception theory on whether the anger "fit" the situation.

  For the counterfactuals, I need to see how each theory would reshape the rules. If judgment theory dominated, the cooling-off period might be irrelevant—what matters is whether the judgment was reasonable at the time. In contrast, feeling theory would make the reasonable person test nonsensical since feelings aren't reasonable. The user's invented rule would collapse under feeling theory but thrive under judgment or perception theories.

  I should note inconsistencies, like anger being seen as both uncontrollable (mitigation) and controllable (anger management). The system seems to treat emotions as hybrid: involuntary in onset but subject to reason over time. This hybrid view might be necessary for the practices to cohere.

  The user's deeper need is likely to create a believable, coherent legal system for their fiction. They need to resolve the tensions without oversimplifying, allowing for character debates on these theories. Highlighting underdetermined areas where judges could reasonably disagree adds depth. Also, clarifying the invented rule's implications helps them write authentic cross-examinations.
answer: |-
  Here’s a reconstruction of the implicit theory of emotion embedded in your legal practices, followed by counterfactuals for each of the three theories, and an analysis of your invented rule:

  ### The Implicit Hybrid Theory in Existing Practices
  Your legal system presupposes a **dual-aspect theory of emotion** where:
  1. **Emotion as Physiological Agitation** (Bodily Feeling):  
     - **Presupposed by:** Cooling-off period, "heat of passion" requiring immediacy, contracts/strikes dissolution after reflection, triviality of unexpressed remorse.  
     - **Why:** Treats emotion as a somatic storm that *temporarily disrupts rational agency*, decays with time/deliberation, and must be *observed* (not self-reported) to be credible.  

  2. **Emotion as Evaluative Appraisal** (Reason-Guided Judgment):  
     - **Presupposed by:** "Reasonable person" standard, "justifiable sense of being wronged," anger management accountability, remorse requiring behavioral proof.  
     - **Why:** Treats emotion as an assessment of value/wrongness that can be *reasonable or unreasonable*, subject to moral scrutiny and personal responsibility.  

  **Tensions and Underdetermination:**  
  - **Inconsistency?** Not truly. The system treats emotion as *initially involuntary* (justifying mitigation) but *subject to rational cultivation* (justifying anger management/remorse demands). This mirrors real law’s "temporary incapacity" model: you aren’t blamed for the storm’s arrival, but you’re responsible for preparing for storms or rebuilding after.  
  - **Underdetermined Aspects:**  
    - The "last straw" doctrine fits **perception theory** (holistic construal of cumulative wrongs) but could be forced into judgment theory (reasonableness of final trigger in context).  
    - "Words alone not enough" leans toward **feeling theory** (needing physical provocation for somatic rage) but could align with judgment theory (words being insufficient *grounds* for lethal retaliation).  
  - **Where Theories Coexist:**  
    - The "reasonable person" test *uses* evaluative judgment to *excuse* physiological overwhelm.  
    - Anger management assumes physiology can be tamed *via* cognitive reappraisal.  
    - Remorse requires physiological signs (tears, conduct) to *prove* cognitive appraisal (guilt).  

  ---

  ### Counterfactuals: How Each Theory Reshapes Practice  
  **1. Emotion as Bodily Agitation (Feeling Theory):**  
     - **Collapses:**  
       - *Reasonable-person standard* (feelings aren’t "reasonable"; they’re biological).  
       - *"Justifiable sense of being wronged"* (provocation’s morality irrelevant; only intensity matters).  
       - *Anger management accountability* (if anger is mere sensation, you can’t "manage" it; only suppress reactions).  
     - **Survives/Changes:**  
       - Cooling-off period becomes **strictly physiological** (e.g., "Did defendant’s heart rate return to baseline?").  
       - Provocation requires **physical triggers** (blows, not words) to cause measurable agitation.  
       - Remorse requires **objective signs** (shaking, weeping)—not verbal expressions.  
     - **Cooling-off Rule:** Only about time for body to calm. No "reasonableness" overlay.  

  **2. Emotion as Evaluative Judgment (Judgment Theory):**  
     - **Collapses:**  
       - *Cooling-off period* (if anger is a judgment, why would time negate it? Unjust acts don’t become just after an hour).  
       - *"Heat of passion" immediacy* (a judgment of wrongdoing doesn't decay; it may intensify with reflection).  
       - *Physiological evidence* (tremors prove nothing about judgment’s reasonableness).  
     - **Survives/Changes:**  
       - Mitigation focuses **only on whether the judgment was reasonable**. No time limit; cumulative slights fully admissible.  
       - Remorse is **assessed via sincere change in judgment** (e.g., repudiating one’s prior reasoning).  
       - Anger management becomes **moral re-education** (correcting faulty appraisals).  
     - **Reasonable-Person Test:** Thrives—directly asks if the *judgment* ("I was gravely wronged") was sound.  

  **3. Emotion as Perception of Value (Perception Theory):**  
     - **Collapses:**  
       - *Cooling-off period* (perceptions aren’t "cooled"; they’re revised or retained).  
       - *Bare assertions discounted* (if emotions are perceptions, self-reports *are* primary evidence).  
     - **Survives/Changes:**  
       - Provocation requires **"aptness"** (did anger *accurately perceive* a deep wrong?).  
       - "Last straw" is **natural** (construals emerge from holistic patterns).  
       - Remorse requires **revised construal** (e.g., "I now see it wasn’t a betrayal").  
     - **Reasonable-Person Test:** Becomes **"Apt Person" test**—would a perceptive person see this as an intolerable wrong?  

  ---

  ### Your Invented Rule: "Correct Target" Mitigation  
  (*Mitigation denied if anger misdirected or misattributed*)  

  - **Secretly Legislating:** **Judgment Theory** (with Perception Theory as a close fit).  
    - *Why?* It demands cognitive accuracy: anger must be *about the right thing/person* and *for the right reasons*. Assumes emotions have propositional content ("I am angry *that X wronged me*") that can be true/false.  

  - **Coherence:**  
    - **Judgment/Perception Theories:** Fully coherent. Anger is an assessment (judgment) or disclosure (perception) of a *specific wrong*. If the defendant misidentifies the wrong (e.g., humiliation vs. injustice) or the wrongdoer, the emotion is "inaccurate" and unworthy of mitigation.  
    - **Feeling Theory:** **Incoherent**. If anger is mere agitation, its "aboutness" is irrelevant. A rage-drunk man killing the wrong person is still physiologically overwhelmed.  

  - **Cross-Examination by Theory:**  
    - **Feeling Theory:**  
      *"Did you feel your heart pounding? Was your vision blurry? Could you have aimed at anyone else in that state?"*  
      (Focus: Intensity, not reasons. Invented rule seems nonsensical here.)  
    - **Judgment Theory:**  
      *"When you struck, what *exactly* did you believe he had done to deserve death? Did you truly think *this act* justified killing? Or were you really thinking about your humiliation last week?"*  
      (Focus: Truth/content of belief. Invented rule is central.)  
    - **Perception Theory:**  
      *"In that moment, what did his action *reveal* to you? Was it truly a betrayal—or just an insult? When you killed the wrong man, what had you *actually seen* in him that deserved death?"*  
      (Focus: Fidelity of emotional disclosure. Invented rule probes perceptual accuracy.)  

  ### Key Takeaway for Your Fiction  
  Your legal world’s practices reflect a **pragmatic hybrid**: emotions are treated as *overwhelming forces in the moment* (excusing intent) but *reason-adjacent phenomena* (making us responsible for their roots and aftermath). This isn’t muddled—it’s how law bridges biology and morality. Your invented rule leans into the cognitive/evaluative wing of this hybrid, demanding emotional "truthfulness." To deepen conflict, have characters weaponize these tensions:  
  - *A judge* arguing remorse must be "felt in the bones" (feeling theory) vs. *a reformist* insisting anger management proves emotions are "chosen judgments."  
  - *A prosecutor* skewering a defendant under the invented rule: *"Your anger wasn’t about justice—it was about wounded pride. That’s not passion; it’s vanity."*  

  This framework lets you dramatize clashes of legal philosophy *through* courtroom mechanics, not just dialogue.
