  The user wants a prioritized research agenda with 3-4 key questions. They need clear reasoning on selection criteria: downstream impact, feasibility in two years, neglectedness, and centrality. Also, what to exclude and how progress would be measured.

  First, I should identify the core issues from their argument. The sticking point is generalizing acausal trade beyond identical copies. The friend's tariff idea discounts counterparts by the shortest description length. The user worries this is either redundant or leads to summation problems. The foundation's research aims to influence real decisions, like whether labs should design cooperative AI systems.

  So, the main challenge is extending acausal trade to non-identical agents. Key questions might include: How to formalize counterpart similarity? How to avoid summation issues? Can we establish thresholds for when cooperation is rational?

  Criteria for selection: Impact on practical decisions, feasibility in two years with conceptual researchers, neglectedness, and how foundational the question is. Trade-offs between these factors are necessary. For example, a high-impact question that's too hard might not be feasible, so mid-range feasibility with good impact is better.

  Question 1: Viable similarity metrics. This addresses the core debate. High impact because it affects if/when to design cooperative AI. Feasible with existing decision theory tools. Neglected as most work focuses on identical agents. Progress would be formal models and impossibility results.

  Question 2: Thresholds for rational cooperation. Directly informs AI labs whether cooperation is worth the cost. Needs game theory and epistemology. Under-explored. Success would be decision rules under uncertainty.

  Question 3: Handling description-dependence. Tackles the tariff's summation problem. Prevents arbitrary preferences. Requires philosophical logic. Progress here could resolve the user's objection.

  Exclude: Pure scaling problems (too vague), anthropic reasoning (less directly relevant), and empirical questions disguised as conceptual.

  The tariff argument fits into Question 3. Ordering prioritizes similarity metrics first as it's foundational. Then thresholds for practical use, and description-dependence to prevent theoretical issues.

  Potential pitfalls: Ensuring questions are tractable. Avoiding overlap. Keeping focus on conceptual work that changes minds. Monitoring progress via workshops and preprints.
answer: |-
  Here’s a defended research agenda for your foundation, prioritising questions where conceptual progress in 2 years could tangibly shift decision-making—especially for AI labs weighing acausal cooperation. I’ll argue for **three core questions**, ordered by their ability to resolve downstream uncertainty, tractability for philosophers/decision theorists, and neglectedness. I exclude questions unlikely to change practical judgements (noted later). The "tariff" debate sits in Question 3, but isn’t the entry point.

  **Selection Criteria & Trade-offs:**  
  - **Downstream impact** (40% weight): Must clarify decisions like "Should we code cooperation into isolated AI systems?"  
  - **Tractability in 2 years** (30%): Conceptual work (no new simulations/data) using game theory, epistemology, formal ethics.  
  - **Neglectedness** (20%): Avoids well-trodden debates (e.g., Nash equilibria with communication).  
  - **Centrality** (10%): Questions that unlock others; bottlenecks in the theory.  
  *Trade-off*: High-impact but intractable questions (e.g., "How do agents learn priors over alien minds?") are deprioritised. Neglectedness offsets feasibility risk—underworked questions may yield low-hanging fruit.

  ---

  ### **Question 1: What constitutes a "relevantly similar" counterpart for acausal trade?**  
  *(Order: 1st — foundational, high impact, feasible)*  
  **Why this?** Your debate’s crux: copying your friend’s "specification tariff" requires defining *which agents are candidates for trade*. Current theory assumes near-identical agents (e.g., cosmic duplicates), but AI labs face messier scenarios: non-identical systems (e.g., different architectures) or humans/AI hybrids. Until we formalise "similarity," the tariff debate is moot—your objection about "implicit probabilities" remains unresolved.  
  **Impact:** Directly informs whether labs should invest in cross-system cooperativity. If similarity conditions are too strict, cooperation efforts are wasted; if too loose, resources dilute.  
  **Feasibility:** Philosophers/decision theorists can build on existing frameworks (e.g., *logical uncertainty* in MIRI’s work, *type-based similarity* in economics). Define similarity along axes: decision algorithm, knowledge base, utility function.  
  **Neglectedness:** Most literature focuses on identical agents or vague analogies.  
  **Progress markers:**  
  - ⬆️ *Upward momentum:* A formal model of similarity thresholds (e.g., "cooperation rational if counterparts share ≥70% of known decision-relevant heuristics").  
  - ⬇️ *Downward risk:* Proof that no non-arbitrary similarity metric exists—collapsing the case for generalised acausal trade.  

  ### **Question 2: Under what uncertainty can cooperation be instrumentally rational?**  
  *(Order: 2nd — critical for action-guidance, moderate feasibility)*  
  **Why this?** Even with similar counterparts, agents don’t *know* if others exist or how they reason. Your foundation’s use case—labs acting without evidence of counterparts—hinges on this. We need decision rules for when "I might be facing a cooperator" justifies costly cooperation, given sparse priors.  
  **Impact:** Determines if labs should act *as if* unseen counterparts exist. Resolves debates like: "Is tweaking an AI’s utility function for cooperation worth performance costs if counterparts are speculative?"  
  **Feasibility:** Leverages evidential decision theory (EDT), Bayesian epistemology. Key task: formalise when acausal "signalling" (e.g., CooperateBot’s choices as evidence of similar bots) outweighs risks.  
  **Neglectedness:** Empirical work dominates (e.g., reinforcement learning trials), but foundational uncertainty limits remain unaddressed.  
  **Progress markers:**  
  - ⬆️ *Upward:* A theorem showing cooperation pays under bounded ignorance (e.g., "rational if P(counterpart exists) > ε, where ε scales with description complexity").  
  - ⬇️ *Downward:* Proof that EDT always recommends defection under maximal uncertainty—killing practical acausal trade.  

  ### **Question 3: How to bound the "summation problem" without arbitrariness?**  
  *(Order: 3rd — addresses your tariff objection, lower tractability but high centrality)*  
  **Why this?** Here’s where your friend’s tariff fits. Your objection—that cheap-to-describe agents might dominate the calculation—threatens *all* acausal proposals. If weighting by description length (e.g., Kolmogorov complexity) causes infinities or extreme sensitivity to language choices, the entire framework is unstable.  
  **Impact:** Resolves whether tariffs are viable. If not, labs ignore description-based approaches; if solvable, tariffs could prioritise counterpart classes (e.g., "focus on AIs with <1k core code lines").  
  **Feasibility:** Harder—requires advances in algorithmic information theory + decision theory. But philosophers can collaborate with theorists on "grounding" description languages (e.g., using *natural abstractions*).  
  **Neglectedness:** Description-dependence is acknowledged (e.g., in anthropic reasoning) but rarely tackled head-on.  
  **Progress markers:**  
  - ⬆️ *Upward:* A non-arbitrary bounding method (e.g., "sums converge if we weight by universal prior + similarity constraints").  
  - ⬇️ *Downward:* Proof that *any* weighting is language-relative—rendering tariffs useless for objective decisions.  

  ---

  ### **What to Exclude & Why**  
  1. **"How to scale cooperation to N agents?"**  
     *Why exclude?:* Pure scaling problems (e.g., reward distributions in large networks) are often computational—not conceptual. Even if solved, labs wouldn’t act without answers to Q1–Q3.  
  2. **"Are acausal deals possible with superintelligences?"**  
     *Why exclude?:* Speculative and untestable. No novel conceptual tools needed beyond Q1–Q3, and unlikely to change minds ("superintelligence" is too ill-defined).  
  3. **"Is acausal trade ethically obligatory?"**  
     *Why exclude?:* Normative debates (e.g., utilitarianism vs. deontology) won’t resolve in 2 years. Labs care about *instrumental rationality*, not ethics, for deployment decisions.  
  4. **Empirical questions in disguise** (e.g., "How often do similar agents arise?"):  
     *Why exclude?:* Your mandate is conceptual. This requires data on AI deployments—beyond your scope.  

  ---

  ### **Ordering Rationale & Risks**  
  1. **Q1 first** because similarity is the bottleneck: without it, Q2–Q3 lack inputs. High feasibility + impact makes it a safe anchor.  
  2. **Q2 second** as it bridges theory to practice ("Should we act?"). Depends on Q1 but can advance in parallel.  
  3. **Q3 last** as it’s meta-theoretical—vital if tariffs gain traction, but less urgent than action-guidance.  
  **Biggest risk:** Q3’s technical depth might stall progress. Mitigation: If Year 1 yields no insights, reallocate resources to Q1/Q2 variants.  

  **On the tariff debate**: It’s premature as a standalone focus (per your "bookkeeping" objection). But embedded in Q3, it becomes a stress test for the whole framework. If your friend’s idea survives bounding, it could refine similarity metrics; if not, we avoid dead ends.  

  This agenda ensures that within 2 years, your foundation will deliver:  
  - A rigorous basis for (or against) generalising acausal trade beyond copies,  
  - Concrete decision rules for labs,  
  - And resolution of the "description-dependence" threat.  
  That’s likelier to change minds than yet another taxonomy of cooperation concepts.
