prompt: |-
  You're a professional philosopher who works on desert and moral luck — please think carefully rather than going with your first instinct, and start by listing the candidate rules before you commit to one.

  My team lead keeps making calls about who "genuinely deserves credit" for a piece of work, and she's very explicit that this is a different question from who should get the bonus under company policy. Her calls so far:

  - Maya: 80-hour weeks, shipped something that turned out to be worthless. Verdict: deserves credit.
  - Tom: one-line fix, huge impact, but only because a competitor's outage happened to make it matter. Verdict: doesn't deserve credit.
  - Dan: coasted, got handed a cushy high-visibility project he did nothing to get; work got done fine. Verdict: doesn't really deserve it.
  - A junior who produced almost nothing but ground through a genuinely brutal problem and learned a ton. Verdict: deserves more than the output suggests.

  I reckons there are two pretty different rules that fit all four of those, and they come apart on our next case. Priya's on a medication prescribed for an unrelated condition; a side effect is that she needs almost no sleep and can hold a ridiculous amount of context in her head. She never asked for it and wasn't told, but she's worked out what's happening, definately leans into it, volunteers for the worst on-call rotations, and it still genuinely costs her effort and unpleasantness. Her work is excellent and clearly down to that effect.

  What do you think my team lead says about Priya? Which rule is she actually running, and what's the one further case that would settle it between them? Under 250 words, bullet points fine.
reasoning: |-
  Hmm, the user wants me to roleplay as a professional philosopher specializing in desert and moral luck. They've presented several cases where their team lead makes judgments about who "genuinely deserves credit" for work, which is distinct from company policy about bonuses. I need to analyze these cases carefully and identify the underlying rule.

  Looking at the cases:
  - Maya worked 80-hour weeks but produced worthless output → deserves credit
  - Tom made a one-line fix with huge impact due to luck → doesn't deserve credit
  - Dan coasted on an easy project → doesn't deserve credit
  - A junior struggled but learned a lot → deserves credit despite low output

  I can see two possible principles that fit all these cases:
  1) Effort-based desert: Credit is deserved based on the effort expended, regardless of outcomes (fits Maya and Junior)
  2) Control-based desert: Credit is deserved only for factors within one's control, excluding luck (fits Tom, Dan, and Junior)

  The key test case is Priya: Her exceptional performance stems from an involuntary medication side effect (lack of sleep needs, enhanced cognition), though she deliberately leverages it with effort. 

  Under Principle 1 (Effort-based): Priya deserves credit because she makes effortful choices to volunteer for tough work despite the unpleasantness. 
  Under Principle 2 (Control-based): Priya may not deserve full credit because her core advantage is unchosen (medication side effect).

  The differentiating case would be: 
  *Someone who puts in massive effort but whose capability is entirely innate/unchosen (e.g., a savant who effortlessly solves complex problems through brute mental effort)*
  - Effort-based rule: Deserves credit (effort present)
  - Control-based rule: Doesn't deserve credit (capability not chosen)

  Priya's case leans toward Principle 1. The team lead would likely say she deserves credit because her choices to apply the advantage involve genuine effort and cost.
answer: |-
  ### Candidate Rules Fitting All Cases:
  1. **Effort/Struggle Principle**: Credit is deserved proportional to *effortful exertion* or *overcoming adversity*, regardless of outcome or luck.  
  2. **Control/Agency Principle**: Credit is deserved only for *deliberate choices* and *controllable factors*, excluding unchosen advantages or luck.  

  ### Priya Verdict:
  - **Team Lead Likely Says**: Priya *deserves credit*.  
  - **Rule Applied**: **Effort/Struggle Principle**.  
    - Priya’s voluntary effort/cost (leaning into work, enduring unpleasantness) aligns with Maya (effort despite failure) and the Junior (struggle/learning). Tom/Dan show low effort/control without struggle.  

  ### Differentiating Case to Settle It:  
  - **Case**: *A naturally gifted employee who solves hard problems effortlessly, never straining or choosing hardship.*  
    - **Effort Rule**: *No credit* (no struggle).  
    - **Control Rule**: *Credit* (innate talent is unchosen but agential choices apply it).  

  ### Conclusion:  
  The lead prioritizes **effortful sacrifice** over outcomes/luck. Priya’s *costly engagement* earns credit despite her unchosen advantage. The "effortless genius" case would confirm the Effort Rule.
