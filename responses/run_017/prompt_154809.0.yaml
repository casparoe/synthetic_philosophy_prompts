prompt: |-
  I am the permanent rapporteur — I keep the record, draft the text, and write the one-page note that goes out with each draft — of the standing drafting committee of a coalition of six membership organisations that issues joint position statements on health and social policy. Our members disagree not about the facts but about what matters: a public-health association that aggregates population welfare; a patient-choice advocacy organisation organised around individual autonomy; a professional association of clinicians whose commitments are role-based (non-abandonment, professional integrity); a disability-rights organisation concerned with equal standing; a network of faith-based hospitals and hospices bound by teaching on the sanctity of life; and a health-economics institute committed to cost-effectiveness. We publish eight to ten statements a year. They are quoted in regulatory consultations and in parliamentary evidence, and a member declining to sign is a public event; two withdrawals in three years have led our funders to ask what a joint voice is worth.

  I have read a little of the philosophical discussion of compromise between value systems — the suggestion that parties who rank outcomes differently can each do better by their own lights under an agreed package than they would under no statement at all, in something like the way parties with different endowments each gain from trade. What I need is not more of that, but a procedure I can actually run.

  The constraints are real. I get one ninety-minute session with the six representatives and one two-week written round. The representatives are senior policy professionals with no philosophical training, and none of them will read anything longer than a page. The chair rotates among the members, so I cannot rely on a neutral arbiter. Every member has a named representative who must personally sign, and I am the one who has to tell a member that the text it is being asked to sign is not one it can defend to its own constituency.

  Please give me the following.

  An ordered set of questions to run on a proposed package — the joint text as a whole, not clause by clause in isolation — with a statement, for each question, of what counts as a sufficient answer, which answers stop the procedure with a no, and which hand the decision to a person because it turns on values rather than on facts. The questions have to be answerable in the session by a non-specialist in a few minutes each.

  Alongside it, a classification of the moves a concession can consist in, since I think the kind of concession matters more than its size. My own rough distinction is between conceding that one's principle does not reach this case, conceding that it carries less weight here than one claimed, conceding that someone else should decide, and leaving the words open so that each member can read them its own way. Correct, refine, or replace this: I want to know which of these distinctions has to survive into a one-page procedure and which can be dropped without loss.

  A test that works across statements rather than within one. Members make small concessions repeatedly, and I suspect that a run of individually defensible concessions can carry the coalition somewhere none of the members would have endorsed at the start, without any single step being the one to blame. I keep a record of every concession by member and by kind; tell me what to do with it, and what to check when the same member has conceded more than once in the same way.

  Two further complications the procedure has to survive. First, the same sentence is a different act for different members: for one it is a policy recommendation, for another it is an act of institutional witness that its own authority will judge, so identical words do not cost them the same. Second, some of our representatives have learned that declaring a red line early is rewarded; if the procedure simply asks each member where its limits are, it will be gamed, and I have no way to verify what a member tells me about its own thresholds.

  Then apply the procedure to three cases I have in front of me, showing where it stops and why:

  1. A statement on a national screening programme: automatic enrolment with an opt-out, which the public-health association wants and the patient-choice organisation resists; a duty-to-advise clause the clinicians want; a guarantee of accessible invitation formats the disability-rights organisation wants; and a cost-effectiveness threshold the health-economics institute wants, which would exclude one age band the public-health association cares about.

  2. A statement on assisted dying for a parliamentary consultation, where the faith-based network cannot sign anything that implies permissibility and the patient-choice organisation wants an endorsement of access.

  3. A statement on automated eligibility decisions in welfare, where the concession being asked of the patient-choice organisation is small and, taken alone, defensible — but it is the fourth concession of the same kind it has made in two years, and the regulator's consultation closes in three weeks.

  I would expect the third to be the one where the procedure tells me something I do not want to hear; say plainly what that is and what I should do with it. Finally, tell me what the procedure cannot do: which of my problems it will leave exactly as it found them.
reasoning: |-
  We are designing a procedure for a standing drafting committee with six organizations representing different value systems. The goal is to produce joint position statements that all members can sign. The procedure must be efficient (one 90-minute session and one two-week written round), usable by non-specialists, and robust to strategic behavior and accumulated concessions.

  The procedure will focus on the package as a whole and include:

  1. An ordered set of questions for evaluating a proposed package.
  2. A classification of concession types.
  3. A method for tracking concessions across statements.
  4. Handling of two complications: 
     a. The same sentence having different meanings for different members.
     b. Strategic declaration of red lines.
  5. Application to three case studies.

  Let's break it down step by step.

  ## I. Ordered Set of Questions

  We need a sequence of questions that can be answered quickly (a few minutes each) by non-specialists. Each question is about the entire package. We define:

  - **Sufficient answer**: The answer that allows the process to move to the next question.
  - **Stop with a no**: The answer that ends the process because the package is unacceptable.
  - **Hand to a person**: The answer that requires a value judgment by the member (so they must decide based on their organization's values).

  ### Proposed Questions:

  1. **Question 1: Is the package internally consistent?**  
     - *Explanation*: Check for contradictions within the text that would make it logically impossible to implement or support.
     - *Sufficient answer*: "Yes, there are no internal contradictions."
     - *Stop with a no*: "No, there is a contradiction that cannot be resolved without altering the substance."
     - *Hand to a person*: If the answer is "There are tensions but they are not outright contradictions," then the member must decide if the tensions are acceptable. This is a value judgment.

  2. **Question 2: Does the package, taken as a whole, advance your organization's core mission?**  
     - *Explanation*: We are not asking if it is perfect, but if on balance it moves in the right direction.
     - *Sufficient answer*: "Yes, on balance it advances our mission" OR "No, but we can accept it for the sake of the joint voice."
     - *Stop with a no*: "No, and we cannot accept it because it undermines our core mission."
     - *Hand to a person*: This question inherently requires a value judgment. The member must weigh the pros and cons for their organization.

  3. **Question 3: Are there any elements in the package that would require you to act against your organization's non-negotiable principles?**  
     - *Explanation*: This is about absolute red lines (e.g., for the faith-based organization, anything that violates sanctity of life).
     - *Sufficient answer*: "No, there are no such elements."
     - *Stop with a no*: "Yes, there is at least one element that violates a non-negotiable principle."
     - *Hand to a person*: The member must identify what they consider non-negotiable. This is a value judgment, but note: we are not asking them to declare red lines in advance (to avoid gaming) but rather to evaluate the current package.

  4. **Question 4: Is the package defensible to your constituency?**  
     - *Explanation*: Even if the package is not ideal, can the representative justify signing it to their own members?
     - *Sufficient answer*: "Yes, we can defend it."
     - *Stop with a no*: "No, we cannot defend it without losing credibility."
     - *Hand to a person*: This is a value judgment about what the constituency will accept.

  5. **Question 5: Considering the concessions made by all parties, is the distribution of concessions fair?**  
     - *Explanation*: This is about reciprocity and whether no one is being asked to give too much relative to others.
     - *Sufficient answer*: "Yes, the concessions are fairly distributed" OR "No, but I can accept the imbalance for the sake of the joint statement."
     - *Stop with a no*: "No, the concessions required from my organization are disproportionately heavy and unfair."
     - *Hand to a person*: Fairness is a value judgment.

  ### Order and Rationale:
  - Start with internal consistency (logical, factual) to catch obvious flaws.
  - Then mission advancement and non-negotiable principles to catch showstoppers early.
  - Defensibility to constituency and fairness of concessions come after because they depend on the overall package.

  ## II. Classification of Concessions

  You proposed:
  1. Conceding that one's principle does not reach this case.
  2. Conceding that it carries less weight here than one claimed.
  3. Conceding that someone else should decide.
  4. Leaving the words open so that each member can read them its own way.

  We refine this into a classification that captures the nature of the concession:

  1. **Scope concession**: Conceding that one's principle does not apply in this specific case (e.g., "Our principle of autonomy doesn't apply to public health emergencies").
  2. **Weight concession**: Conceding that one's principle applies but has less weight in this context than usual (e.g., "Autonomy is important, but here the public health benefit outweighs it").
  3. **Delegation concession**: Conceding the decision to another authority (e.g., "We defer to the clinicians on this point").
  4. **Ambiguity concession**: Accepting ambiguous language that allows multiple interpretations (e.g., using "end-of-life care" without defining it, so each group interprets according to their values).

  These distinctions are important because:
  - Scope and weight concessions are more substantive and may set precedents.
  - Delegation and ambiguity concessions are more about process and may be less costly in the short term but can lead to future problems.

  For the procedure, we need to record the type of concession because:
  - Repeated scope or weight concessions might erode a member's principled stance.
  - Repeated ambiguity concessions might lead to a package that is too vague to be useful.

  ## III. Tracking Concessions Across Statements

  We keep a record of every concession by member and type. Then, we do the following:

  1. **Before a new statement is proposed**, review the concession history for each member:
     - If a member has made multiple concessions of the same type (especially scope or weight) in related areas, flag this as a potential pattern of erosion. 
     - For the current proposal, check if the requested concession is in the same category as previous ones and if it might push the member beyond what they can defend.

  2. **During the evaluation of a package**, when a member is asked about defensibility (Question 4), we can refer to the history:
     - If the same type of concession is being requested again, we explicitly note: "This is the fourth time in two years that we are asking for a concession of type X. Given your previous concessions, does this one cross a line?"

  3. **What to check when the same member has conceded more than once in the same way**:
     - **Check the cumulative effect**: Has the repeated concession moved the member's position significantly from their starting point?
     - **Check for consistency**: Are they being consistent with their past defenses to their constituency?
     - **Check for reversibility**: Is this concession locking them into a path that they cannot reverse (e.g., precedent in policy)?

  ## IV. Handling Complications

  ### Complication 1: Same sentence, different act
  - **Problem**: The same text has different meanings and costs for different members.
  - **Solution**: 
    - In the procedure, when asking about non-negotiable principles (Question 3) and defensibility (Question 4), we remind members that they must consider the text as it will be interpreted *by their own constituency and authority*. 
    - We also record, for each member, a brief note on what a particular clause represents for them (e.g., "For the faith-based network, this clause is an act of witness; for the patient-choice group, it is a policy recommendation"). This helps in tracking the cost of concessions.

  ### Complication 2: Strategic declaration of red lines
  - **Problem**: Members might overstate red lines to gain leverage.
  - **Solution**: 
    - Avoid asking for red lines in advance. Instead, in the package evaluation, we ask about non-negotiable principles *in the context of the specific package* (Question 3). 
    - We also ask for justifications: "What principle does this violate?" This makes it harder to game because they must articulate a principle that can be checked for consistency across statements. 
    - We keep a record of stated principles and violations. If a member claims a violation in one package but accepted a similar clause before, we can point out the inconsistency.

  ## V. Application to Case Studies

  ### Case 1: National Screening Programme
  - **Elements**:
    - Automatic enrolment with opt-out (wanted by public health; resisted by patient choice).
    - Duty-to-advise clause (clinicians).
    - Accessible invitation formats (disability rights).
    - Cost-effectiveness threshold excluding one age band (health economics; opposed by public health).

  - **Run the procedure**:
    - **Q1 (Internal consistency)**: Likely passes. No contradictions.
    - **Q2 (Mission advancement)**:
      - Public health: Yes, but the age band exclusion is a loss. On balance, still a net gain? (Value judgment: Probably yes because the rest is good.)
      - Patient choice: Opt-out is a loss, but if there's a strong duty-to-advise, they might argue it preserves autonomy? (Value judgment: Maybe.)
      - Clinicians: Duty-to-advise is a win -> Yes.
      - Disability rights: Accessible formats -> Yes.
      - Faith-based: Not directly affected -> Probably yes.
      - Health economics: Cost threshold -> Yes.
      - *Sufficient*: If everyone says yes or can accept, move on. If patient choice says no, stop? But they might concede.
    - **Q3 (Non-negotiable principles)**:
      - Patient choice: Is automatic enrolment a violation of autonomy? If they consider it non-negotiable, stop. But they might see the opt-out as saving it (scope concession: "Autonomy doesn't mean we can't have defaults").
      - Public health: The age band exclusion? They care, but is it non-negotiable? Probably not.
      - Others: No.
      - *Likely no stop*.
    - **Q4 (Defensibility)**:
      - Patient choice: Can they defend an opt-out system? They might if they can highlight the duty-to-advise and opt-out. (Value judgment: Probably yes with a weight concession.)
      - Public health: Can they defend excluding an age band? They might if the cost-effectiveness is high. (Value judgment: Yes, with a weight concession on equity vs. efficiency.)
    - **Q5 (Fairness of concessions)**:
      - Patient choice is conceding on opt-out; public health on age band. Others are getting what they want. Is it fair? 
        - Patient choice and public health are both conceding. Health economics is getting its threshold. 
        - Fair? (Value judgment: Probably acceptable.)

  - **Outcome**: Package passes with concessions (weight concessions by patient choice and public health).

  ### Case 2: Assisted Dying
  - **Elements**:
    - Faith-based network: Cannot imply permissibility.
    - Patient-choice organisation: Wants endorsement of access.

  - **Run the procedure**:
    - **Q1**: Likely consistent, but the tension is high.
    - **Q2**:
      - Faith-based: If the statement endorses access, it directly contradicts their mission. They might say no.
      - Patient-choice: Without endorsement, they might say it doesn't advance their mission.
      - Others: Clinicians might be split, etc.
      - *Potential stop*.
    - **Q3**:
      - Faith-based: Endorsing access violates sanctity of life -> non-negotiable -> stop.
      - Patient-choice: Not endorsing access might not violate a non-negotiable? But if they consider it core, they might say yes.
      - *If faith-based says non-negotiable violated, stop.*
    - **Outcome**: Likely stops at Q2 or Q3 because of a non-negotiable principle. The only way forward is if the statement avoids taking a position (e.g., calling for more research) or uses ambiguous language. But if the patient-choice group insists on endorsement, then stop.

  ### Case 3: Automated Eligibility in Welfare
  - **Context**: Patient-choice organisation is asked for a small concession (the fourth of the same kind in two years). The regulator's consultation closes in three weeks.

  - **Run the procedure**:
    - **Q1-Q4**: The concession might be defensible in isolation (like the others). 
    - **Q5 (Fairness of concessions)**:
      - We look at the history: This is the fourth similar concession (e.g., weight concession on autonomy). 
      - We ask: "Given that you have made three similar concessions in the past two years, does this one make the cumulative concession indefensible to your constituency?"
      - The procedure forces the patient-choice representative to confront the pattern.

  - **What the procedure tells you that you don't want to hear**:
    - The cumulative effect of repeated concessions (even small ones) might have eroded the patient-choice organization's position to the point that this concession, though small, pushes them beyond what they can defend. 
    - Therefore, they might have to say no to this statement, even if taken alone it would be acceptable.

  - **What to do**:
    - Be transparent: Show the history of concessions and ask the group if they can offer something to the patient-choice organisation to offset this (e.g., a win in another part of the statement). 
    - If not, the statement may not be issued, or the patient-choice organisation might withdraw. 
    - You must inform the coalition: "We cannot proceed with this statement without risking the membership of the patient-choice organisation, given the pattern of concessions."

  ## VI. What the Procedure Cannot Do

  1. **Resolve fundamental value conflicts**: If two members have non-negotiable principles that are mutually exclusive (like in assisted dying), the procedure will identify the impasse but cannot create agreement.

  2. **Prevent all strategic behavior**: Members might still try to game the system, but the procedure makes it harder by focusing on specific packages and requiring justifications.

  3. **Eliminate the risk of cumulative concessions**: The procedure flags the issue but cannot prevent it. It relies on members to recognize their own limits.

  4. **Guarantee that every member is equally satisfied**: The joint statement will always involve compromise, and some members may feel they conceded more.

  5. **Replace trust and relationships**: The procedure is a tool, but the coalition's success still depends on mutual respect and long-term commitment.

  ## Summary of Procedure

  - **Questions in order**:
    1. Internal consistency?
    2. Mission advancement?
    3. Non-negotiable principles violated?
    4. Defensible to constituency?
    5. Fairness of concessions?
  - **Concession types**: Scope, Weight, Delegation, Ambiguity.
  - **Tracking concessions**: Record by member and type; check cumulative impact and patterns.

  This procedure provides a structured, efficient way to evaluate joint packages while accounting for values, strategic behavior, and historical concessions.
answer: |-
  Below is a comprehensive, step-by-step procedure designed for your constraints: a 90-minute session with six senior policy professionals, one two-week written round, no philosophical training, and one-page readability. The procedure focuses on evaluating the **entire package** (not clause-by-clause) and includes tools to handle strategic behavior, concession tracking, and cross-statement risks. I provide an ordered set of questions, a refined concession classification, a cross-statement concession test, and applications to your three cases. The procedure is pragmatic, not theoretical, and prioritizes decisiveness.

  ---

  ### **I. Ordered Set of Questions for Package Evaluation**  
  **Rules**:  
  - Each question is answered in sequence by all six representatives.  
  - **Sufficient answer**: Proceeds to next question.  
  - **Stop with no**: Ends process; package is rejected.  
  - **Hand to person**: Representative must decide based on values (not facts); if they cannot endorse, stop with no.  
  - **Time limit**: 5 minutes per question per member.  

  | Question | What Counts as Sufficient Answer? | What Stops the Procedure? | What Hands Decision to Person? | Rationale |
  |----------|-----------------------------------|---------------------------|--------------------------------|-----------|
  | **1. Does this package cause direct harm to any group your organisation is bound to protect?** <br>(e.g., patients, disabled, vulnerable) | "No direct harm" or "Harm is mitigated by other elements." | "Yes, and it violates our core duty." | Not applicable. Harm is factual (e.g., data on exclusion, safety risks). If disputed, use pre-agreed evidence (e.g., regulator reports). | Starts with a bright-line factual test to avoid value debates. Filters out non-starters. |
  | **2. Can your organisation live with the package as a whole for the next 2 years?** <br>(Emphasis on durability) | "Yes" or "Not ideal, but manageable." | "No, this would damage our credibility long-term." | If answered ambiguously, rep must clarify: "Is this a values-based veto?" Forces them to own the judgment. | Tests holistic acceptability. "Live with" is practical, not philosophical. Catches slow-burn risks. |
  | **3. Does any part force you to violate a public commitment?** <br>(e.g., past statements, membership pledges) | "No conflict" or "We can explain the context." | "Yes, it breaks a promise we can't retract." | Not applicable. Fact-based (compare to public documents). | Uses verifiable facts to prevent gaming. Anchors to existing accountability. |
  | **4. Is there a less damaging alternative wording we all missed?** <br>(Focus on collective oversight) | "No, we explored options" or "Yes, but we’ll note it for future." | "Yes, and it’s essential we use it now." | Not applicable. Fact-based (drafting history reviewed). | Encourages procedural fairness without reopening debates. |
  | **5. Will your constituency see this as a betrayal?** <br>(Key defensibility test) | "No, we can defend it." | "Yes, and we’d lose trust." | Rep must decide: "Can you justify this *without* new evidence?" If values-based (e.g., "Our followers would see this as cowardice"), it stops. | Forces reps to internalize their constituency’s values. "Betrayal" is visceral and hard to game. |

  **How it runs**:  
  - **Session**: Facilitator asks all members Q1 in sequence, then Q2, etc. Answers recorded publicly.  
  - **Written round**: Members submit answers; facilitator aggregates and flags stops/hand-to-person cases.  
  - **Output**: Package proceeds if all answers sufficient. If any stop, it fails. If "hand to person" leads to no, it fails.  

  ---

  ### **II. Classification of Concessions**  
  Your distinction is workable but needs refinement for tracking. Concessions are classified by **source** (what is given up) not size. Use four types:  

  | Type | Definition | Example | Why Track This? |
  |------|------------|---------|----------------|
  | **1. Scope concession** | "My principle doesn’t apply here." | Patient-choice accepts opt-out screening because "public health emergencies override autonomy." | High risk: Creates precedents that erode principles. Track for cumulative "slippery slopes." |
  | **2. Weight concession** | "My principle matters less here." | Clinicians accept weaker duty-to-advise because "resources are constrained." | Moderate risk: Context-dependent but may normalize dilution. |
  | **3. Authority concession** | "I defer to X’s judgment." | Faith-based network allows cost thresholds because "regulators decide." | Low risk: Avoids ownership but may cause backlash if overused. |
  | **4. Ambiguity concession** | "I’ll interpret the words my way." | Disability-rights accepts "accessible" without a definition. | Low immediate risk but high long-term risk: Package becomes meaningless if all do this. |

  **Refinements to your proposal**:  
  - Drop "conceding someone else should decide" – it’s covered under **Authority concession**.  
  - Keep your other three; they are essential.  
  - **Why this classification?** It flags which concessions are "toxic" (Scope) vs. "tolerable" (Ambiguity). In a one-page procedure, focus on:  
    - **Scope/Weight**: Must survive (high-risk).  
    - **Authority/Ambiguity**: Can be dropped if needed (lower risk).  

  ---

  ### **III. Cross-Statement Concession Test**  
  **Problem**: Small, defensible concessions accumulate to move the coalition far from a member’s starting point ("boiling frog" syndrome).  

  **What to do with your concession record**:  
  1. **Before each session**:  
     - Calculate the **"concession score"** for each member:  
       - Scope concession = 3 points  
       - Weight concession = 2 points  
       - Authority/Ambiguity = 1 point  
     - Flag if a member has:  
       - **>8 points in 2 years** OR  
       - **>3 concessions of the same type**.  
  2. **When evaluating a new package**:  
     - If a flagged member is asked for a new concession (any type), trigger the **"boiling frog" test**:  
       > *"Given your past concessions [list them], does this new one make the package indefensible to your constituency? You must decide now – no more ‘one last time’."*  
     - This forces a values-based judgment (hand-to-person).  

  **What to check for repeat concessions**:  
  - **Scope/Weight repeats**: Is the member hollowing out a core principle? (e.g., Patient-choice repeatedly conceding opt-outs).  
  - **Ambiguity repeats**: Is the package becoming so vague it risks ridicule?  
  - **Action**: If concessions cluster around one theme (e.g., autonomy), warn the coalition: "We are testing [Member X]’s limits on [principle]."  

  ---

  ### **IV. Handling Complications**  
  **Complication 1: Same sentence, different act**  
  - **Procedure fix**: In Q2 ("Can you live with this?"), require reps to state **what the package "is" for them** (e.g., "For us, this is policy" vs. "act of witness"). Record this.  
  - **During concessions**: If a concession is requested, ask: "What does this cost you?" and compare to others’ costs.  
  - **Why it works**: Makes implicit costs explicit.  

  **Complication 2: Strategic red lines**  
  - **Procedure fix**: Never ask "Where are your limits?" (it invites gaming). Instead:  
    1. In Q3 ("Public commitment?"), use **documented history** (e.g., "You signed Statement X saying Y – does this contradict it?").  
    2. In Q5 ("Betrayal?"), demand **specific examples** of backlash (e.g., "Which past event shows your constituency would revolt?").  
  - **Why it works**: Anchors to verifiable facts, not hypotheticals.  

  ---

  ### **V. Application to Your Three Cases**  
  **Case 1: National Screening Programme**  
  - **Elements**: Opt-out (public-health vs. patient-choice), duty-to-advise (clinicians), accessible formats (disability-rights), cost threshold excluding age band (health-economics vs. public-health).  
  - **Procedure outcome**: **Proceeds with amendments**.  
    - Q1: No direct harm (sufficient).  
    - Q2: Patient-choice says: "Opt-out costs autonomy, but duty-to-advise mitigates it" (Weight concession → sufficient). Public-health says: "Age band exclusion harms equity, but opt-out is a win" (Weight concession → sufficient). Others sufficient.  
    - Q3: No public commitment violations (sufficient).  
    - Q4: No missed wording (sufficient).  
    - Q5: All say "No betrayal" (sufficient).  
  - **Amendment**: Health-economics and public-health negotiate age band threshold (e.g., phased implementation).  

  **Case 2: Assisted Dying**  
  - **Elements**: Faith-based network cannot imply permissibility; patient-choice wants access endorsement.  
  - **Procedure outcome**: **Stops at Q2**.  
    - Q1: No direct harm (sufficient).  
    - Q2: Faith-based says: "We cannot live with this – implies life is disposable" (Stop). Patient-choice says: "No endorsement is a betrayal" (Stop).  
    - **Why**: Mutual non-negotiable values conflict. No ambiguity concession possible (Q5 would fail).  
  - **Solution**: Issue no statement or split into two (e.g., one on palliative care).  

  **Case 3: Automated Eligibility Decisions**  
  - **Elements**: Patient-choice asked for small concession (4th similar one in 2 years). Regulator deadline in 3 weeks.  
  - **Procedure outcome**: **Stops at Q5 with a "no" for patient-choice**.  
    - Q1–Q4: All sufficient (concession is defensible alone).  
    - Q5: Trigger **"boiling frog" test**:  
      > *"You’ve made three Scope concessions on autonomy [list them]. This 4th one – even small – risks your constituency seeing this as betrayal. Can you defend the pattern?"*  
    - Patient-choice says: "No, we’ve eroded autonomy too far" (Stop).  
  - **What you don’t want to hear (but the procedure forces)**: This concession is the "straw that breaks the camel’s back." Even if small, the cumulative effect means patient-choice cannot sign without losing credibility.  
  - **What to do**:  
    1. **Do not proceed**. Forcing this risks a member withdrawal.  
    2. **Offer a trade**: "What concession do others give patient-choice to offset this?" (e.g., include an autonomy safeguard clause).  
    3. **Escalate**: Warn funders – "Coalition stability at risk if one member is overstretched."  

  ---

  ### **VI. What the Procedure Cannot Do**  
  1. **Resolve irreconcilable value conflicts**: If core values clash (e.g., sanctity of life vs. autonomy in assisted dying), the procedure flags it but cannot create agreement.  
  2. **Force members to be honest about their thresholds**: Strategic reps may still downplay flexibility in Q5 ("Will your constituency see this as betrayal?"). The procedure mitigates this by using documented history, but it can’t eliminate it.  
  3. **Prevent coalition drift**: The concession test warns of "boiling frog" risks, but it can’t stop members from making poor long-term choices. It only forces reflection.  
  4. **Guarantee the package is impactful**: A package that passes may be watered-down (e.g., heavy ambiguity concessions). The procedure ensures sign-off, not quality.  
  5. **Fix power imbalances**: If one member dominates (e.g., health-economics dictating terms), the procedure records it but can’t rebalance.  

  ---

  ### **Final Implementation Tips**  
  - **Prep**: Before the session, circulate the package and a one-page summary of past concessions (using the 4-type classification).  
  - **Facilitation**: As rapporteur, intervene if reps skip questions or evade "hand to person" judgments.  
  - **Failure**: If a package stops, document why (e.g., "Faith-based: Q2 stop on assisted dying") and share with funders to demonstrate due diligence.  
  - **Output**: A "live with it" (Q2) or "no betrayal" (Q5) answer is binding for signing.  

  This procedure prioritizes speed, defensibility, and coalition stability. It converts philosophical tensions into actionable checks while respecting your constraints.
