  First, I need to understand the core conflict. The couple met arguing about whether features in AI are real or constructed. The user mentioned examples like swapping directions between models. The sister sees this as evidence of discovery, the husband as role-based construction. Any toast that subtly favors one view will be noticed, especially by the couple and their colleagues. The groom's advisor's relativist stance is also off-limits since both disagree with it.

