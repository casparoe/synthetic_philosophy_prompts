prompt: |-
  Hey — I'm a novelist, four books out and a weekend workshop I teach a few times a year, and I've been having an argument with two friends that I want translated into words I actually use. One of them, who does machine learning, says the only reason anyone pays me to write is that producing a good sentence is harder than recognising one — that if those two were equally easy my whole job evaporates and my drafts would just assemble themselves. The other friend says that's nonsense, that the hardness results people cite are about pathological worst cases and about what happens as inputs get arbitrarily large, neither of which has anything to do with a person writing 300 pages in eighteen months. I gather there's a whole literature on whether computational intractability is supposed to tell us something about minds, creativity, or the value of effort, and I gather it includes distinctions I only half understand: hard on average versus hard in the worst case, and a case where the work is genuinely hard on average but you can't even generate an instance you know is hard. I don't need names or papers; I need the positions.

  So: I failed calculus twice, so no notation please, but I'm fluent in my own vocabulary and I want both sides — the one where intractability is doing real philosophical work and the one where it isn't — restated in it. The vocabulary is roughly this: my generative faculty versus my editorial faculty, sitting down to produce pages versus reading back what I produced and knowing whether it's right; the draft that won't come at all versus the draft that comes out in a rush and can't be repaired; what constraints do for me (a sonnet, a locked-room plot, a word limit — the blank page is smaller and somehow better); deadlines and advances as resource bounds; a 120-page novella versus a 900-page doorstop and whether difficulty scales with length the way the theorists assume; the workshop, where twelve people can tell me a chapter is broken and none of them can fix it; and the fact that some books I can only write by imitating a genre so hard that the search space collapses. Translate each position into that, and where a distinction has to be distorted to fit, say so rather than quietly fixing it.

  Two things I especially want, because I think my vocabulary might actually be able to say something yours can't, or might just be confused. First: I can tell the difference between a book that resists being written (nothing comes, but I'd know the finished thing instantly if you handed it to me) and a book that resists being judged (pages pour out, and the hard part is telling whether they're any good). Is that a difference the complexity framing can see at all, or does it only have vocabulary for the first? Second: my instinct is that constraints, genre, and imitation are doing most of the real work in making hard things writable, and that a theory which treats the problem as given and only asks how long it takes is leaving out the part I spend my career on. Then the residue report: what in the philosophers' disagreement has no counterpart in my vocabulary, whether that's my vocabulary being impoverished or their disagreement being thinner than it sounds, and whether the bits that survive are the bits that would still be true if nothing scaled to infinity. Under 800 words, and don't spend more than about 200 of them on the parts that translate cleanly — the interesting part is what doesn't.
