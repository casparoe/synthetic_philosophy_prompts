prompt: |-
  My friend and I got into a three-hour argument last night about eulogies and I want someone to tell me what the real disagreement underneath it is, because we kept going in circles and I think we were both right about the facts and still disagreeing.

  So here's the practice I can't stop thinking about. A eulogy doesn't work like a résumé. Nobody gets up and lists the promotions, the publications, the years on the school board. Whoever speaks tells two or three tiny stories: how he always took the worst shift on holidays, how she remembered everyone's kid's name, the dumb thing he said every single Sunday. And the room is supposed to come away not just sad but, like, quietly resolved to be a little more like that. It's the most widely practiced bit of moral instruction from a life that we have, and almost nobody thinks of it as moral instruction.

  My friend did classics and he said that's straight-up Plutarch. As far as I can remember what he said: Plutarch writes books of paired Lives, a Greek and a Roman, with a comparison at the end, and he says right at the front that he isn't writing history but lives, and that some chance remark or a joke tells you more about a man than his most famous siege — the small unguarded stuff is where the character actually shows, not the big achievements. Which is exactly the eulogy's method. Fine, we agreed on that much.

  Then we split completely, because Plutarch also puts in the bad parts. His heroes get drunk, take bribes, lose their tempers, do cowardly things, and as far as my friend remembers he says somewhere that he's not going to leave that out just because the man was great. A eulogy does the exact opposite. There's a hard norm about speaking nothing but good of the dead, and people obey it even when everyone in the room knows the guy was difficult or worse. My friend says that makes eulogies hagiography, full stop: the verdict is fixed in advance and then the evidence gets picked to fit it, so the genre can't teach anybody anything about character, it can only flatter the family and comfort the room. I said that's too fast, the stories are true, they're only selected, and anyway maybe you need the good version to want to imitate anybody at all — you don't learn to write by studying bad sentences first.

  And then there's the part that actually weirded me out, which is the inconsistency in the other direction. The same culture that won't let you say one critical sentence at a funeral will happily treat a single bad thing someone did as the whole truth about them: the pile-on, the "we're not giving this person a platform," the 600-page biography that comes out ten years after the flawless obituary and is entirely about the cruelty and the affairs. Same method, opposite filter. So either there's one theory of character underneath both and I'm not seeing it, or we're just seperately inconsistent and neither practice is thinking about character at all.

  The bit I kept throwing at him (and I think it's the only genuinely new idea either of us had) is that maybe "learning from a life" is two different jobs: copying an exemplar, versus finding out what human beings are actually like. Maybe the eulogy only ever signed up for the first one, and my friend is grading it on the second. He said that's a dodge.

  So what I want is this: what does the practice of the eulogy presuppose? About what character is, about how you could possibly know someone's character from the outside, about what a life is supposed to teach the people left listening, and about whether selecting which details to mention is a form of dishonesty or just what any narrative has to do? Is the praise norm doing real philosophical work — idealized models motivate in a way messy ones don't, grief makes accuracy cruel, character isn't one score so praise can be true even when incomplete — or is it pure etiquette that happens to wreck whatever teaching job the genre otherwise has? Be specific about which parts of the practice strictly require which theory and which parts several different theories would license equally. And then tell me what a eulogy would actually look like if it were built on the theory you think my friend is committed to, if that's different from the one we've got. Please don't just tell me we both have a point.

  Last thing: I want to know where your answer is weakest. What argument or consideration would actually change your mind here — what would make you say the praise norm is load-bearing after all, or that it's just manners? And where is your reconstruction most likely to be wrong? He's coming over Friday and I'd rather show up with the soft spots already found.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They had a three-hour argument with their friend about eulogies, and despite agreeing on facts, they couldn't resolve their disagreement. The user wants to understand the underlying philosophical tensions in eulogy practices, especially regarding character portrayal and moral instruction.

  First, I need to identify the core conflict. The user and their friend both acknowledge Plutarch's approach of revealing character through small, unguarded moments. But they diverge on eulogies omitting flaws while contemporary culture often focuses solely on flaws in cancellation. The user suggests these might serve different purposes: exemplar imitation versus understanding human nature. Their friend dismissed this as a dodge.

  The user's frustration is palpable - they want more than "both have a point." They seek a rigorous analysis of what eulogies presuppose about character, knowledge, and moral pedagogy. Specifically: Why the praise norm? Is selection dishonest? How would a Plutarchian eulogy look? And crucially, where might any analysis be vulnerable.

  Hmm... the key lies in recognizing two distinct theories of character at play. The Aristotelian view sees character as cultivated dispositions where praise nurtures virtue. The modern "whole self" view treats character as an inventory of traits where omission feels dishonest. The eulogy's selectivity isn't accidental - it's necessary for its function as aspirational mirror during grief. 

  But the user's observation about cultural inconsistency is brilliant. We toggle between hagiography and demonization because both are reductionist tools - one for cohesion, the other for boundary-setting. The common thread isn't character assessment but social utility. That explains why the same "small story" method gets weaponized in pile-ons.

  For their friend's Plutarchian eulogy... it would require brave mourners sharing flawed anecdotes to say: "This is how humans actually are." Imagine admitting "She lied about her age, but that's how she survived" during a funeral. Possible? Maybe. But the raw grief space makes it nearly impossible without violating the psychological contract of loss.

  Where's my analysis weakest? Probably in overstating eulogies' pedagogical efficacy. Do people really internalize "be more like that"? Or is it just emotional comfort? And perhaps I underestimate how praise norms protect the vulnerable - not just families but communities avoiding fracturing during vulnerability.

  For Friday's discussion... the user should press their friend: "If we did Plutarchian eulogies, who would volunteer to publicly dissect their mother's alcoholism at her funeral?" That exposes the protective function of praise. Also, challenge the friend to design a real flawed-but-instructive eulogy to reveal practical constraints.

  The user's depth of thought here is exceptional. Their frustration with superficial agreement suggests they hunger for rigorous philosophy applied to daily rituals. That's refreshing. My job is to honor that by avoiding easy compromises.
answer: |-
  This is a profound argument about character, memory, and social ritual – and the underlying disagreement is about **whether moral exemplars require idealization or honesty.** Let's dissect the presuppositions, tensions, and alternative visions:

  **The Core Disagreement:** Your friend sees character as an *objective totality* – good and bad intertwined – and believes moral instruction *requires* seeing this messy reality to learn authentically. You see the eulogy's purpose as *aspirational modeling* – presenting an *achievable ideal* to inspire imitation, necessitating focus on the positive. You're both partly right, but the practices reveal deeper, conflicting theories.

  **What the Practice of the Eulogy Presupposes:**

  1.  **Theory of Character:** Character is primarily defined by **enduring virtues and positive dispositions** (kindness, loyalty, humor, resilience) that manifest in small acts. Flaws, failures, and complexities are either:
      *   *Secondary*: Not the core identity, especially in death.
      *   *Irrelevant to the ritual's purpose*: The focus is on celebration and inspiration, not comprehensive judgment.
      *   *Potentially corrosive to the ritual's social function*: Introducing negativity disrupts communal mourning and comfort.

  2.  **Epistemology (Knowing Character):** Character *can* be reliably glimpsed through **specific, concrete anecdotes** ("small unguarded stuff"). This bypasses abstract labels and reveals the *lived reality* of virtue. However, it presupposes that these selected glimpses *accurately represent the core essence* of the person, even if incomplete.

  3.  **Pedagogy (Teaching from a Life):** Moral instruction works best through:
      *   **Concrete Exemplars:** Not abstract rules, but seeing virtue *in action*.
      *   **Aspiration & Identification:** Presenting an admirable, *imitable* model ("I could be like that in small ways") motivates change. Seeing flaws can undermine identification and the aspirational pull.
      *   **Emotional Resonance:** Grief creates a receptive state; positive stories offer solace *and* a pathway forward ("live better in their memory").

  4.  **Narrative Selection & Honesty:**
      *   The eulogy presupposes that **selection is intrinsic to narrative**, not inherently dishonest. *Every* story (biography, history, Plutarch) selects.
      *   Its specific selection filter ("speak only good") is **functional and ethical within the context**:
          *   **Grief:** Accuracy about flaws feels cruel and unnecessary during acute loss. The primary need is comfort and honoring the *best* of the person.
          *   **Social Cohesion:** Funerals reunite communities, often fractured or containing people with differing views of the deceased. Focusing on positive common ground maintains unity.
          *   **Final Judgment:** There's an implicit cultural belief that death deserves a final, merciful focus on the positive – a form of grace.
      *   It presupposes that **"true" doesn't mean "comprehensive."** The stories told *are* true; omitting other truths isn't lying *in this context*. It's curating for purpose.

  **The Praise Norm: Philosophical Work vs. Etiquette?**

  *   **It's BOTH, but heavily weighted towards philosophical function:**
      *   **Load-Bearing Philosophical Work:**
          *   **Aspiration Engine:** As you argued, idealized models *are* more motivating. Seeing only flaws (or even mixed flaws) can breed cynicism ("why try?"). The praise norm actively constructs the exemplar necessary for the ritual's pedagogical goal.
          *   **Character as Essence:** It reinforces the idea that the *core* character, the meaningful essence worthy of remembrance and emulation, *is* the virtuous part. Flaws are noise, not signal, for this purpose.
          *   **Grief Management:** Accuracy is secondary to the psychological needs of the bereaved. The norm protects mourners from unnecessary pain during vulnerability.
      *   **Pure Etiquette Component:** There *is* a social taboo element – violating it causes offense. But this taboo *arises from* the deeper philosophical and psychological functions above. It's not *just* manners; it's manners serving a profound purpose that would be undermined by criticism.

  **Why Your Friend's Critique (Hagiography) Feels Partly Right but Incomplete:**

  *   **He's right that** the verdict *is* fixed ("speak only good"), shaping evidence selection. It *is* a form of idealization.
  *   **He's wrong that** this *necessarily* means it "can't teach anybody anything about character." It teaches *specific virtues* by showcasing them vividly. Learning "kindness exists and looks like this" *is* learning about character, even if it's not learning "this person was complex and sometimes unkind."
  *   **He mistakes the genre's goal:** It's not aiming for a comprehensive character assessment (like Plutarch or a critical biography). Its goal is *commemoration, comfort, and aspirational modeling*. Grading it on "comprehensive character truth" is like criticizing a hammer for not screwing in a bolt.

  **The Cultural Inconsistency (Hagiography vs. Pile-On):**

  *   **Common Thread:** **Reductionism for Social Function.**
      *   **Eulogy:** Reduces the person to their *positive essence* for the purposes of *communal mourning, comfort, and aspirational cohesion*.
      *   **Pile-On/Cancel Culture/Damning Biography:** Reduces the person to their *worst action(s)* for the purposes of *social condemnation, boundary enforcement, punishment, or establishing moral clarity (often reactive)*.
  *   **Theory of Character?** Both practices *reject* a truly integrated, complex view of character *in their specific moment*. They operate on **extreme selectivity driven by immediate social needs**: one for unity and comfort (eulogy), the other for division and condemnation (pile-on). Neither is primarily concerned with nuanced understanding; both are tools of social management using simplified narratives. The inconsistency lies in the *opposite poles* they select from, driven by context, not in a single underlying theory.

  **A Plutarchian Eulogy (Your Friend's Vision):**

  It would be jarring, uncomfortable, and incredibly rare in our current culture, but theoretically possible:

  1.  **Acknowledging Flaws:** "We remember Sarah for her incredible loyalty, always the first to help... though we also knew that loyalty could sometimes tip into stubbornness, like the time she refused to admit her project plan was flawed, causing weeks of extra work. That complexity was part of her."
  2.  **Contextualizing:** "John's quick wit lit up every room, but we also saw how it could occasionally be a shield when he felt vulnerable, sometimes landing sharper than intended. His struggle to soften that edge in tough moments showed his growth."
  3.  **Focus on Humanity, Not Just Virtue:** "Mary wasn't a saint. She wrestled with anxiety, which sometimes made her seem distant at big gatherings. But that makes her quiet acts of kindness, like the notes she sent when she knew someone was struggling, all the more meaningful – they were hard-won victories."
  4.  **Pedagogical Goal Shift:** Instead of "Be wholly like this ideal," it would be "See this complex humanity; learn from the virtues *and* the struggles. Understand that character is a journey, often messy, and we can learn from both the triumphs and stumbles." The resolution might be less "be like that" and more "understand humanity better, including ourselves."

  **Where My Analysis is Weakest / What Could Change My Mind:**

  1.  **The Efficacy of Aspirational Modeling:** Is the idealized model *actually* more effective motivation? What if Plutarch is right that seeing virtue *alongside* struggle makes it *more* relatable and achievable ("If *they* could be great despite flaws, maybe I can too")? If strong evidence emerged that purely idealized models lead to discouragement or disillusionment when people inevitably fail to meet them, the "praise norm as essential for pedagogy" argument weakens significantly. Your friend *might* have a point here.
  2.  **The Necessity of Omission for Comfort:** Is avoiding *any* mention of flaws *truly* necessary for communal grief, or is it a cultural habit we could evolve beyond? Could acknowledging shared knowledge of flaws ("We all knew his temper, but we also saw the remorse that always followed...") paradoxically create *deeper* connection and comfort through shared honesty? If examples emerged of communities successfully incorporating gentle, loving honesty about flaws into eulogies without fracturing or causing undue pain, the "praise norm as load-bearing for grief management" argument weakens.
  3.  **Character as Essence vs. Totality:** Am I underestimating the degree to which the eulogy's *omission* feels like a lie, even if the stories told are true? Does selecting *only* the good fundamentally misrepresent "who this person *was*," making the lesson learned based on a fiction? If the core disagreement is ontological (what *is* a person's character?), and your friend holds that the totality *is* the essence, then any selection that excludes significant negatives *is* dishonest for the purpose of teaching about character. My position leans towards virtues being the core essence; his might lean towards the whole picture being irreducible.

  **For Friday: Target the Soft Spots**

  *   Ask your friend: **"If Plutarchian honesty *is* better pedagogy, can you design a *realistic* eulogy for someone difficult (even just 'stubborn' or 'sharp-tongued') that includes a flaw but still leaves the room feeling resolved to 'be a little more like that'? How do you avoid derailing the mourning into dwelling on the negative?"** This forces him to confront the practical and emotional constraints you intuitively grasp.
  *   Press him on the **inconsistency point:** "If both eulogies and pile-ons use extreme selectivity, but opposite kinds, what does that tell us? Is it *really* about understanding character, or about what society needs to *do* with that person's memory in that moment (comfort/unify vs. condemn/purge)?" Frame it as two sides of the same reductive coin.
  *   Challenge the **hagiography dismissal:** "If learning 'kindness looks like *this* specific action' isn't teaching about character, what is? Is studying *only* Newton's laws without his alchemy or feuds teaching 'bad physics'?" Argue that focused learning on a virtue *is* valid character education, even if partial.

  You've hit on a deep tension between truth and utility, complexity and inspiration, in how we remember and learn from each other. Your "two different jobs" insight is crucial – the disagreement stems from prioritizing different jobs. Good luck Friday!
