  The user provided their half-formed demands, which are insightful but need reorganization. Key issues include: costs needing to be marginal and quality-dependent, not just absolute; costs that are specific to signaling; the currency linking cost to quality; specifying the cost mechanism; timing of costs; receiver response; alternative hypotheses; and clarifying if the signal is mechanically tied or cost-maintained.

  For the specification, I should create clear categories: non-negotiable (must-haves), strong presumptions (rebuttable with evidence), and stylistic preferences (tradition-specific). Non-negotiables should include the marginal cost-quality link, receiver response affecting fitness, and ruling out alternatives. Strong presumptions could cover cost mechanisms and timing, while stylistic preferences might include wastefulness or context independence.

  The three composite cases help test the criteria. For the lizard: the throat patch might not pass because the basking cost isn't signaling-specific, and the female preference exists in a related species without the patch, suggesting it's not driven by this signal. The fish: the display cost is deferred and avoidable, so it's more about commitment than inherent cost; it might qualify if tied to male quality affecting care costs. The bird: the fixed cost doesn't differentiate quality, so it fails the marginal condition.

  On deeper questions: Wastefulness isn't necessary; strategic models show costs can have compensating benefits. Full separation isn't required; average reliability is sufficient. The user's suspicions about context-dependence vs. signal consistency and unfakeability vs. flexibility are valid. Context affects costs, so signals can be reliable locally without being universal. Unfakeability by design conflicts with flexibility, but partial honesty can evolve without that.

  The most exclusionary requirement is likely the marginal cost-quality link, as it catches traits that are costly but not differentially so. Regarding theoretical approaches: Zahavi emphasizes waste, which isn't essential. Grafen's models formalize the marginal condition. Index approaches bypass cost for mechanical constraints. Partial-alignment models show cost isn't always needed, shifting the burden to prove why cost is necessary.

  This framework should help the user standardize evaluations, focusing on evidence for differential costs and receiver responses while being flexible on theoretical preferences.
answer: |-
  Below is a specification for evaluating claims that a trait is a **costly signal**, designed as an evidential standard for grant proposals in animal behavior. It prioritizes empirical testability and distinguishes necessary conditions from rebuttable presumptions and research traditions. The criteria are structured to exclude cues, weapons, byproducts, and epiphenomena.

  ---

  ### **Specification for Costly Signal Claims**  
  **Trait `T` in species `S` is a signal of quality `Q` maintained by cost.**

  #### **I. Non-Negotiable Requirements**  
  *Must be empirically supported or explicitly testable in the proposed work.*  
  1. **Marginal Cost-Quality Link**  
     - *Requirement*: The *marginal cost* of producing/increasing `T` must be lower for higher-`Q` individuals.  
     - *Motivation*: Flat costs cannot separate types (Grafen 1990). A high-quality individual must afford a larger/more intense `T` at lower *relative* cost.  
     - *Evidence*: Data showing differential cost-burdens (e.g., metabolic expenditure, predation risk, lost opportunity) scaled to `Q` (e.g., parasite resistance, body condition).  

  2. **Receiver Response & Fitness Feedback**  
     - *Requirement*: Receivers must adjust their behavior based on `T`, and this response must directly affect signaler fitness (e.g., mating success, resource access).  
     - *Motivation*: Without receiver action and fitness consequences, `T` is a cue, not a signal (Maynard Smith & Harper 2003).  
     - *Evidence*: Experimental manipulation of `T` (e.g., patch enlargement) altering receiver decisions *and* signaler fitness outcomes.  

  3. **Cost Attribution to Signaling**  
     - *Requirement*: Costs must be incurred *because of* `T`'s role in communication. Costs the animal would pay regardless (e.g., basking on a rock) do not count.  
     - *Motivation*: Shared costs cannot enforce honesty (Dawkins & Guilford 1991).  
     - *Evidence*: Comparisons of individuals with/without `T` in identical contexts, or cost measurements during signaling vs. non-signaling states.  

  4. **Alternative Hypotheses Ruled Out**  
     - *Requirement*: Explicit justification for why `T` is not:  
       - A weapon (direct competitive advantage),  
       - A byproduct (e.g., physiological constraint),  
       - A cue (no fitness feedback from receivers),  
       - Or replaceable by a cheaper trait eliciting the same response.  
     - *Motivation*: Parsimony; many "signals" are exaptations (Laidre & Johnstone 2013).  
     - *Evidence*: Controls for non-communicative functions (e.g., weapon use tests), or data showing cheaper variants fail to invade.  

  ---

  #### **II. Strong Presumptions (Rebuttable with Evidence)**  
  *Default expectations; proposers must address gaps or provide counter-evidence.*  
  5. **Currency Alignment**  
     - *Presumption*: The cost of `T` must be in a currency that `Q` mitigates (e.g., `Q` = foraging efficiency → cost = energy expenditure).  
     - *Rebuttal*: If `Q` correlates with a third variable (e.g., age), proposer must show `Q` causally reduces cost.  

  6. **Cost Mechanism Specification**  
     - *Presumption*: Proposer must state *how* cost is imposed:  
       - **Production** (e.g., energy to synthesize pigments),  
       - **Vulnerability** (e.g., predator attraction),  
       - **Social** (e.g., retaliation by rivals),  
       - **Opportunity** (e.g., lost foraging time).  
     - *Rebuttal*: If mechanism is ambiguous, proposer must test predictions (e.g., remove receivers → social costs vanish).  

  7. **Timing of Cost Realization**  
     - *Presumption*: Costs should be paid *before or during* signal assessment (e.g., energy spent singing). Deferred costs (e.g., parental care) require proof of *commitment* (unavoidable future payment).  
     - *Rebuttal*: If costs are deferred (e.g., fish parental care), proposer must show signalers cannot cheat (e.g., desertion is punished).  

  ---

  #### **III. Stylistic Preferences (Not Required)**  
  *Research traditions vary; these should not be enforced.*  
  - **Wastefulness**: Costs need not be *net* fitness losses; they can be offset by benefits (e.g., mate attraction). Zahavi’s "handicap" is a metaphor, not a requirement (Getty 2006).  
  - **Context-Independence**: Signals can be honest in local contexts without being universal.  
  - **Unfakeability by Construction**: Mechanically constrained signals (e.g., size indices) are valid without costs; the burden shifts to proving the constraint (Higham 2014).  
  - **Full Separation of Types**: Average reliability suffices; perfect unfakeability is unrealistic (Johnstone 1995).  

  ---

  ### **Application to Composite Cases**  
  **(1) Lizard Throat Patch**  
  - **Fails** non-negotiables:  
    - *Cost Attribution*: Display from basking rocks (cost incurred regardless).  
    - *Receiver Response*: Females in a related species prefer blue without evolutionary cohistory → suggests preexisting sensory bias, not signal coevolution.  
    - *Marginal Cost*: No data showing higher-quality males pay lower marginal costs for larger patches.  

  **(2) Fish Parental Care Display**  
  - **Conditionally passes** if:  
    - *Timing*: Proposer demonstrates courtship "commits" males (e.g., desertion punished by females/community).  
    - *Marginal Cost*: Higher-`Q` males (e.g., better foragers) lose less mass during care.  
  - **Risks**: If care costs are independent of `Q`, it’s a behavioral covenant, not a signal.  

  **(3) Bird Dawn Chorus**  
  - **Fails**:  
    - *Marginal Cost*: Fixed cost (4% body mass) for all males → no differential burden.  
    - *Alternative Hypotheses*: Likely a byproduct of thermoregulation/territorial defense; no evidence cheaper displays are unstable.  

  ---

  ### **Key Insights & Theoretical Tensions**  
  - **The Waste Debate**: *Wastefulness is not required*. Strategic models (Grafen) show honesty is stable if marginal costs correlate with quality, even with net benefits.  
  - **Context-Dependence vs. Consistency**: Honest signals *are* habitat-dependent (e.g., carotenoid access varies). Requirement for universal meaning is misplaced.  
  - **Unfakeability vs. Flexibility**: Mechanically constrained signals (indices) are unfakeable but inflexible; cost-maintained signals are flexible but require ongoing selection. **These are mutually exclusive pathways to honesty** (Maynard Smith & Harper 2003).  
  - **Most Exclusionary Criterion**: **Marginal Cost-Quality Link**. It fails flat-cost traits (e.g., the bird chorus) and traits where cost isn’t measured at the margin (e.g., lizard basking).  

  ### **Theoretical Families’ Standing**  
  | **Theory**                | **Fares Under This Standard**                               |  
  |---------------------------|-----------------------------------------------------------|  
  | **Zahavi’s Handicap**     | Overly strict on waste; marginal cost condition refines it. |  
  | **Grafen’s Strategic**    | Gold standard; formalizes non-negotiable #1.              |  
  | **Index/Mechanical**      | Valid if proposer shifts burden to constraint (not cost). |  
  | **Partial-Alignment**     | Acceptable; removes need for cost when interests align.   |  

  ---

  This specification prioritizes **testable mechanisms** over rhetoric, ensuring "costly signal" claims are grounded in differential costs, receiver psychology, and fitness outcomes. Use it to demand evidence, not just analogy.
