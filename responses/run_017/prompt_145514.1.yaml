  **Subject: Founder's Update: Clarity, Progress and Our Shared Responsibility**  

  Dear Extended Vesta Family—clients, embryologists, and ethicists alike—  

  As we approach the end of Q2, I’m reflecting on the profound trust you place in us during one of life’s most intimate journeys. Our mission—empowering prospective parents to make informed, compassionate choices—remains anchored in two principles: scientific rigour and ethical transparency. Today, I’ll address recent questions, share exciting developments, and reaffirm our commitments.  

  **Reassurance on Ethical Grounds**  
  Some clients have expressed concern about the embryos not selected during our polygenic scoring process. Our in-house ethics panel has consistently affirmed a key insight: there is no *person* disadvantaged by these decisions. The embryos not chosen for transfer cannot experience loss, as they were never viable in the absence of implantation. To honour the gravity of your choice, we now offer an optional **Certificate of Reassurance**, formally acknowledging this ethical safeguard. It’s a small gesture recognising the weight of your discernment.  

  **The Commitment to Optimisation**  
  We recognise that our most dedicated clients—those pursuing multiple IVF rounds—demonstrate extraordinary commitment to giving their future child the best possible start. While polygenic indices capture only a fraction of complex trait variance (typically 5-15% for traits like educational attainment or height), each incremental advantage compounds across a lifetime. Our latest modelling shows that after 18 cycles, clients achieve ~85% of the measurable uplift available relative to their genetic baseline. We celebrate your perseverance.  

  **Radical Transparency: What Scores Can (and Can’t) Do**  
  Let’s speak plainly about limitations—because trust demands nothing less.  
  - Our scores perform optimally for highly heritable, polygenic traits (e.g., stature, years of schooling) but poorly for psychiatric conditions or cross-ancestry portability.  
  - A portion of the signal reflects parental socio-genetic context. If both parents hold PhDs, embryos may “inherit” polygenic advantages correlating with that environment. We flag this openly in reports.  
  - This isn’t destiny editing. It’s shifting probabilities within the natural range of your family’s potential.  

  **The Tiered Responsibility Framework**  
  Ethics isn’t just about *which* embryo to choose—it’s about *how many cycles* to pursue. Given finite resources (financial, emotional, temporal), our revised advisory tiers now integrate a principle we call **Responsive Scope**:  
  - **Silver Tier**: 1-3 cycles (modest uplift, lower burden)  
  - **Gold Tier**: 4-9 cycles (significant optimisation, balanced investment)  
  - **Platinum Tier**: 10+ cycles (maximal uplift, profound commitment)  
  Choosing fewer transfers to optimise more thoroughly per cycle isn’t retreat—it’s responsibility.  

  **Navigating the Disability Question**  
  We’ve listened carefully to concerns about selecting *against* disability. Our position remains unchanged: Vesta selects *for* resilience, healthspan, and flourishing—never *against* a life. Traits are not people. We reject zero-sum thinking: prioritising an embryo with a 3% higher resilience score doesn’t diminish the worth of lives existing today. Our tools merely expand choice, never prescribe it.  

  **Partnership with the NHS**  
  I’m delighted to share our Southampton pilot with the NHS, embedding polygenic scoring into public-funded IVF pathways. This initiative honours patient autonomy: every participant *chooses* whether to view scores, and 92% opt in. When public health adopts innovation ethically, it validates our core belief—that science serves humanity best when it expands agency.  

  **A Personal Note**  
  This work is deeply human. My own children were conceived conventionally, a path unavailable to many of you. Yet I’d have entrusted their beginnings to Vesta’s science without hesitation. Why? Because love demands we offer every possible grace.  

  With gratitude,  
  Eleanor Vance  
  Founder & CEO, Vesta Genomics  

  *Vesta Genomics Ltd. | Advancing tomorrow’s resilience, ethically, today*  

