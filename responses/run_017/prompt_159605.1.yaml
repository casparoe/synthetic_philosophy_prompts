prompt: |-
  I host a fortnightly recorded interview series on practical rationality: one guest, no audience, and a standing rule that we never spend time on how the guest got into the topic or on recommendations for further reading. My next guest is a philosopher of action who has just published a monograph on sunk costs. Her positive thesis — she calls it the fidelity account — is that honoring sunk costs is not a deviation from rationality but the diachronic analogue of loyalty, that the prospectivist verdict ("only prospective costs and benefits matter") rests on a metaphysical error rather than a decision-theoretic one, namely treating the deliberating agent as a time-slice cut loose from her own past, and that once agency is understood as temporally extended, sunk-cost sensitivity is at worst permissible partiality toward one's earlier self and at best something the prospectivist owes us an explanation for lacking.

  She is fluent, and she has one maneuver I want to plan around. Faced with a case in which honoring sunk costs looks costly, she re-describes the options until what looked sunk turns out to bear on the future: the cathedral matters to her now, the marriage has reshaped her practical identity, abandoning the research program would betray the collaborators who joined it. The move is often legitimate, and I do not want to rule it out by fiat — but I want the sequence to make it progressively harder to lean on, and to end somewhere it cannot be used at all.

  Please draft eight to ten interview questions, none of which let her simply restate the view, and each of which presses where the debate actually presses. I want at least one question on each of the following:

  1. The collapse objection: if her reason for continuing the marriage, the doctorate, or the business is that her skills, relationships and self-conception are already bound up with it, isn't that just prospectivism applied to a richer description of the options? What is left of the fidelity account once option-description has been enriched?

  2. The epistemic reading: sunk costs are often good evidence that a project was promising, and an agent with limited self-knowledge might reasonably treat her own past outlay as a signal of a judgment made under better information. But if that is all there is, an agent with direct access to the evidence and transparent self-knowledge should be wholly insensitive to sunk costs. Does she accept that consequence, and if not, what does fidelity add once the evidence is already in?

  3. The act/disposition gap: the credibility and self-governance reply (one finishes things because being the sort of person who finishes is what makes long projects possible at all) seems to justify a disposition rather than the individual act. If she grants that, is she committed to a form of rational irrationality — the well-functioning agent should be moved by considerations she knows to be irrelevant — and how does that sit with her own apparent willingness to recommend that people be trained out of sunk-cost reasoning?

  4. Fidelity under an adverse past: the rationale seems to presuppose a past self worth being loyal to. What happens when the initial outlay was made under manipulated information, by a self she now repudiates, or toward an end she now judges worthless or worse? And what does the account say about costs incurred by others on her behalf, or costs she imposed on others?

  5. The impersonal case: escalation of commitment in firms and states, and the "Concorde fallacy" label in behavioral ecology, show the same pattern where no single persisting self is in question — stronger when the decision-maker personally authorized the outlay, weaker under age, delay, or external review. If her account is personal, why does the phenomenon have this shape in organizations and across species? Is she conceding those cases to forward-looking signaling explanations, and if so does the concession undercut the personal case?

  6. Retrospective value: does finishing the cathedral make the earlier labor non-wasted, or only add value going forward? Does she need the stronger claim — that a later event can alter the value of an earlier one — and is she willing to pay for it? (The value-of-achievement literature's suggestion that effort is partly constitutive of an achievement's worth is relevant here.)

  7. A stipulated pair: two cases identical in every forward-looking respect, differing only in whether the outlay was personally authorized or externally imposed. Ask her what she would do; and if she answers that the cases still differ, ask her to say what the difference consists in without re-describing the options. This is where the maneuver should finally be closed off.

  8. Predictions: what pattern of susceptibility across stakes, delay, personal versus imposed outlay, and decision-maker age does the fidelity account predict, and which of the patterns commonly reported sit badly with it?

  9. Exposure: a closing question on what would count against the account — which finding or argument would make her give it up, and whether, given the ever-available re-description move, the view can be stated so as to risk anything at all.

  For each question, please supply the follow-up keyed to the answer she is most likely to give, and flag the two or three places where the follow-up should take her own preferred phrasing — "the cost isn't really sunk," "that's just loyalty, not error" — and ask what work it is doing. Close with a note on the one question you think she is most likely to handle badly, and why.
reasoning: |-
  Okay, the user hosts a recorded interview series on practical rationality and has a specific guest coming up—a philosopher of action who wrote a monograph on sunk costs. The guest's thesis, called the fidelity account, argues that honoring sunk costs isn't irrational but is like loyalty to one's past self. The user wants to challenge this view through targeted questions without letting the guest rely on her common maneuver of re-describing options to make sunk costs seem relevant to the future.

  The user outlined nine areas for questions: collapse objection, epistemic reading, act/disposition gap, fidelity under adverse past, impersonal case, retrospective value, stipulated pair, predictions, and exposure. Each question needs to press where the debate is sharpest and avoid letting her restate her view. Follow-ups should anticipate her responses and push back, especially when she uses phrases like "the cost isn't really sunk" or "that's just loyalty." The closing note should highlight where she might struggle most.

  First, I need to ensure all nine points are covered in the questions. The user specified "eight to ten," so aiming for nine questions makes sense—one per point. Each question must directly challenge her position without being leading or allowing evasion.

  For the collapse objection (point 1), the key is whether enriching option descriptions reduces fidelity to prospectivism. The follow-up should question what unique work "fidelity" does if all reasons become forward-looking. If she says it's about identity, push on whether that's still prospective.

  The epistemic reading (point 2) questions if sunk costs are just evidence. If she denies that full self-knowledge eliminates sensitivity, ask what fidelity adds beyond evidence. The follow-up must prevent her from conflating epistemic and non-epistemic reasons.

  For the act/disposition gap (point 3), focus on rational irrationality. If she endorses dispositions over acts, challenge the rationality of acting against known irrelevant factors. Her training advice seems contradictory here—follow-up should highlight that tension.

  Fidelity under adverse past (point 4) needs examples like manipulated choices or repudiated selves. If she says fidelity doesn't apply, ask how to distinguish "worthy" past selves. Follow-up on others' costs or imposed costs could reveal inconsistencies.

  The impersonal case (point 5) challenges the personal account with organizational or cross-species examples. If she concedes to signaling, ask if that undermines the personal case. Follow-up should probe why personal authorization matters if the mechanism is similar.

  Retrospective value (point 6) deals with whether finishing changes past value. Press on if she needs strong retrocausality and if effort constitutes achievement value. Follow-up on "non-wasted" vs. "value-added" can test her metaphysics.

  The stipulated pair (point 7) is critical for blocking re-description. Present identical forward-looking cases differing only in personal authorization. If she still sees a difference, demand an explanation without re-describing. This is where her maneuver should fail.

  Predictions (point 8) should extract testable claims from her theory. Contrast with common findings (e.g., age effects) to see if her account fits or conflicts.

  Exposure (point 9) questions falsifiability. Given her re-description habit, ask if the view can even be risked. Follow-up should challenge if "fidelity" is just a label with no substance.

  The closing note should identify her weakest point. Likely, the stipulated pair (point 7) because it forces her to defend a difference without re-description, which she relies on. If she can't, it collapses into prospectivism.

  Phrasing questions neutrally but pointedly is vital. Using "you" makes it personal (e.g., "Do you accept..."), and follow-ups quote her likely phrases to dissect them. Keeping questions concise ensures they're interview-friendly.

  Finally, the structure: list all nine questions with follow-ups, then the closing note. Ensure each follow-up is tailored to her probable responses and escalates the pressure. Aim for depth without verbosity, matching the user's academic rigor.
answer: |-
  Here is a meticulously crafted interview sequence designed to press the fidelity account at its most contentious points, progressively constraining the option-re-description maneuver and culminating in its explicit blockage. Each question targets a core challenge, avoids restatement opportunities, and includes a targeted follow-up anticipating her likely responses.

  **Interview Questions & Follow-Ups:**

  1.  **The Collapse Objection:** "You argue fidelity isn't irrational, but when you justify continuing a marriage because it shapes current identity, or a doctorate because of embedded skills, aren't you simply appealing to *forward-looking* benefits like stability, skill utilization, or coherence? If enriching the description captures *all* the rational force, what distinct work does 'fidelity to past commitment' itself do that isn't just prospectivism in disguise?"
      *   *Likely Response:* "Because it's *loyalty*, not just calculation! The cost isn't 'sunk' in the meaningful sense; the past project *constitutively shapes* the current options and agent."
      *   **Follow-Up:** "Let's grant the richer description. Precisely *because* the marriage shapes identity now, the reason to continue *is* its current value and coherence, right? What specific *additional* rational force does the *fact that I chose it in the past* exert here, independent of its current constitutive role? If it exerts none, fidelity seems explanatorily redundant."

  2.  **The Epistemic Reading:** "Many see sunk costs as evidence: past expenditure signals prior confidence under (often) better information. If an agent has perfect access to the original evidence and flawless self-knowledge about past reasoning, does your account imply they *should* still be sensitive to sunk costs purely out of fidelity? Or would fidelity become inert?"
      *   *Likely Response:* "Evidence matters, but fidelity adds something non-epistemic. It's about honoring the *agency* of your past self, not just its evidence."
      *   **Follow-Up:** "Suppose the agent *knows* their past self overestimated the project's value due to an emotion they've now corrected. Does fidelity still demand honoring the sunk cost? If yes, isn't this demanding loyalty to an *error*? If no, how is fidelity distinct from a sophisticated evidence-weighting rule?"

  3.  **The Act/Disposition Gap:** "Your 'credibility/self-governance' defense seems to justify a *disposition* to finish projects, not necessarily each *individual act* of honoring sunk costs. Does this mean the rational agent should sometimes *act* on considerations (the sunk cost itself) they know are strictly irrelevant *to this specific choice*, purely to maintain the disposition?"
      *   *Likely Response:* "The disposition *is* rational, and acting on it in specific cases *is* rational *because* it sustains the capacity for long-term agency. It's not 'irrationality'."
      *   **Follow-Up:** "You've argued people *should be trained out* of standard sunk-cost reasoning in many contexts. If honoring sunk costs in the specific act is truly rational, why train it out? Doesn't this training aim precisely to disconnect the *act* from the sunk cost – treating it as irrelevant – while aiming to cultivate a different disposition (e.g., evidence-based updating)? Doesn't this concede that *acting* on the sunk cost *is* irrational?"

  4.  **Fidelity Under an Adverse Past:** "Fidelity presupposes a past self worth loyalty. What about costs incurred: (A) under deliberate misinformation by a third party? (B) By a past self whose values you now repudiate (e.g., funding a cause now deemed evil)? (C) Imposed *on you* by others' sacrifices 'for your own good'? Does fidelity demand honoring these?"
      *   *Likely Response:* "Fidelity requires a *worthy* commitment. Manipulation or deep value repudiation might sever the obligation. Others' sacrifices create different obligations, not fidelity to self."
      *   **Follow-Up:** "If fidelity only binds when the past self/commitment is 'worthy' by *current* standards, isn't the ultimate arbiter the *current* agent's judgment of value? Doesn't this collapse back into a forward-looking assessment ('Is honoring this *now* worthwhile?') rather than a backward-looking duty? What *independent* force does the *past authorization* have if it can be voided by current judgment?"

  5.  **The Impersonal Case:** "Escalation of commitment occurs strongly in firms/states (Concorde) and even in animals (Concorde Fallacy), where no single persisting 'self' exists. Yet, it weakens if the decision-maker didn't authorize the outlay, is younger, or under external review. If fidelity is fundamentally about personal diachronic agency, why does the phenomenon manifest so similarly in impersonal contexts? Does this suggest a broader signaling/consistency mechanism?"
      *   *Likely Response:* "Organizations have institutional identities, commitments, and roles that create analogous pressures. Animal behavior might be convergent but mechanistically different."
      *   **Follow-Up:** "But the *pattern* – sensitivity strongest to self-incurred costs, weaker for others' costs or under review – mirrors the personal case. If you concede that signaling institutional consistency or reputation explains the organizational case, doesn't that strongly suggest signaling (of confidence, consistency) also explains the *personal* case, rendering 'fidelity' as a distinct motive unnecessary? Why posit two different mechanisms for the same behavioral pattern?"

  6.  **Retrospective Value:** "When you finish the cathedral despite the cost, does that completion *retroactively make the earlier labor non-wasted*, or does it *only add new value going forward*? Does your account require the stronger claim – that later events can alter the value of past efforts – and are you committed to that metaphysically?"
      *   *Likely Response:* "The achievement's value is partly constituted by the effort expended. Finishing *realizes* the value latent in the past commitment; it doesn't change the past *per se* but completes its meaning."
      *   **Follow-Up:** "So, the past labor had *potential* value contingent on completion? But doesn't prospectivism easily capture this: the potential future value of the achievement *justifies* the cost of completion, making the sunk cost irrelevant *except* as evidence for that potential? If the value only truly exists *after* completion, how does fidelity to the *past* outlay, rather than the potential *future* achievement, provide the reason to continue?"

  7.  **The Stipulated Pair (Blocking Re-description):** "Consider two scenarios identical in *all* forward-looking respects: same future costs/benefits, same impact on your skills/relationships/identity, same evidence. *Only* difference: In Case A, *you* personally authorized the initial costly investment. In Case B, the investment was externally imposed (e.g., a grant you didn't seek). According to fidelity, should you be more inclined to continue in Case A? If so, *why*, given the identical future prospects?"
      *   *Likely Response:* "Yes, because in Case A, I have an obligation of fidelity to my past commitment; in Case B, I do not. The *reason* for continuing differs, even if the outcome looks similar."
      *   **Follow-Up (Crucial Block):** "I stipulated the forward-looking descriptions are *identical*, including impacts on identity/relationships. **Without invoking any difference in the *described consequences* of continuing or quitting (which are identical), or re-describing the options based on past authorization, can you articulate *what the difference in reason consists in*?** What is the *content* of the 'obligation of fidelity' that exists in A but not B, if not a difference in anticipated outcomes?"

  8.  **Predictions:** "What distinctive empirical patterns does fidelity predict compared to prospectivism or pure signaling? Specifically: Should fidelity-based susceptibility to sunk costs (a) *increase* or *decrease* with the decision-maker's age? (b) Be *stronger* for costs incurred very recently vs. long ago? (c) Be *more* sensitive to who authorized the cost (self vs. other) than to the absolute magnitude? How do these predictions align with common findings like greater susceptibility in the young or to recent costs?"
      *   *Likely Response:* Fidelity might predict stronger sensitivity to self-incurred costs regardless of age, perhaps persistent over time if the commitment remains core, differing from pure signaling (which might decay or depend on audience).
      *   **Follow-Up:** "Standard findings show sunk cost effects *are* often stronger in younger people and fade with time/delay. If fidelity is a core rational commitment, why wouldn't it be stable or increase with age (stronger diachronic identity)? Doesn't the observed decay pattern fit a signaling or cognitive error model better than a robust norm of fidelity?"

  9.  **Exposure (Falsifiability):** "Given your capacity to re-describe options to reveal forward-looking relevance, and the potential collapse of fidelity into enriched prospectivism or signaling, how could the fidelity account *ever* be falsified? Can you state a strong, non-trivial version of the claim that *risks* being wrong? What specific finding or argument would genuinely make you abandon the core idea that honoring sunk costs can be a direct requirement of diachronic rationality?"
      *   *Likely Response:* "Evidence that people *never* experience a distinct sense of obligation to past commitments separable from future benefit or signaling would challenge it. Or if prospectivism *could* explain all cases without loss."
      *   **Follow-Up:** "But your re-description move often *invokes* future benefits/signaling to explain *why* fidelity matters. Doesn't this make 'fidelity' potentially vacuous – just a *label* for cases where enriched prospectivism or signaling applies? Isn't the stipulated pair (Q7) the critical test? If you *cannot* articulate a difference *without* re-description or invoking consequences, doesn't that *demonstrate* the collapse?"

  **Closing Note on Likely Weakest Point:**

  The question she is **most likely to handle badly is #7 (The Stipulated Pair)**. This is the designed endpoint where the re-description maneuver is explicitly blocked by the interviewer's stipulation. Her entire account relies on the moral/normative weight of *personal past authorization* creating a distinct reason. However, when forced to articulate the *content* of that reason *without* smuggling in differences in future consequences (which have been stipulated away) or simply re-describing the agent's state based on the past (which the follow-up explicitly forbids), she faces a severe challenge. The most probable outcome is either:

  1.  **Circularity/Assertion:** She might simply re-assert the existence of the obligation ("Because I authorized it!") without providing further content, which appears question-begging.
  2.  **Smuggling in Consequences:** She might inadvertently lapse into mentioning a consequence (e.g., "Betraying *myself* would damage my self-trust") that violates the stipulation of identical forward-looking impacts (including on identity/self-conception).
  3.  **Retreat to Phenomenology:** She might appeal to a "feeling of obligation" unique to Case A, but this doesn't establish its *rationality*, only its psychological existence, and risks conceding that fidelity is not a robust *rational* norm but a psychological quirk.

  This moment forces a direct confrontation with whether "fidelity" is a genuinely distinct *rational principle* or merely a psychological tendency that *sometimes* correlates with forward-looking reasons or signaling needs, which her own re-descriptions often rely upon. Failure to provide a satisfactory, non-circular, non-consequentialist answer here would be the most significant vulnerability exposed in the sequence.
