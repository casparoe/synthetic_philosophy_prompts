    - target (b): 4 red, 1 blue -> reachable: true, reason: "Start: 1 red -> double to 2 -> double to 4. Then add one blue (allowed)."
    - target (c): 3 red, 0 blue -> reachable: false, reason: "Cannot have 3 reds (0 mod 3) because invariant requires non-zero mod 3."

    verdict: The test works. Why? Because it has both reachable and unreachable targets, and the invariant is similar (mod 3) but the moves are different enough (especially the blue marbles) to be a transfer.

    smallest_fix: If we think it's too close because the invariant is also mod 3, we could change the modulus? But it's okay because the moves are different. Alternatively, we could change the starting point? But we don't need to fix.

    So: 
    transfer_test: {
      verdict: "works",
      smallest_fix: "none",
      targets: [
        {state: "0 red, 2 blue", reachable: false, reason: "reds must be 1 or 2 mod 3"},
        {state: "4 red, 1 blue", reachable: true, reason: "double reds twice to 4, then add one blue"},
        {state: "3 red, 0 blue", reachable: false, reason: "3 is 0 mod 3, but invariant requires 1 or 2 mod 3"}
