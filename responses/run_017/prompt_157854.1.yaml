  **Final Round 2: Crossing Interaction and Social Effect (Combined)**

  *Setup:*
  - We have two genotypes: A (base=5) and B (base=10).
  - We have two planting densities: Sparse and Dense.
  - In Sparse: environment effect=0 for all.
  - In Dense: environment effect depends on the local (within-table) group: 
     - If a plant is the only one of its genotype in the table's group of 3, it gets +5.
     - If there is more than one of its genotype, it gets -2.
  - Each table is assigned to either Sparse or Dense.
  - Each table gets a group of 3 plants: either Group1 ( two A and one B ) or Group2 ( one A and two B ). 

  *Assignment of tables (6 tables):*
  - Table 1: Sparse, Group1
  - Table 2: Sparse, Group2
  - Table 3: Dense, Group1
  - Table 4: Dense, Group2
  - Table 5: Dense, Group1
  - Table 6: Dense, Group2

  *Activity:*
  1. Tables in Sparse: 
     - Open the envelopes, record the base height. 
     - Environment effect=0, so total=base.
     - Note: Group1: two A (5), one B (10) -> heights 5,5,10.
     - Group2: one A (5), two B (10) -> heights 5,10,10.
  2. Tables in Dense:
     - Open the envelopes to see the genotype.
     - For each plant, 
        - If it is the only one of its genotype in the group, environment effect=+5.
        - Else, -2.
     - Compute total = base + effect.
     - Group1 ( two A, one B ):
        - A's: two -> effect=-2 -> total=5-2=3.
        - B: only one -> effect=+5 -> total=10+5=15.
     - Group2 ( one A, two B ):
        - A: only one -> effect=+5 -> total=5+5=10.
        - B's: two -> effect=-2 -> total=10-2=8.

  *Data Collection:*
  - Facilitator collects from all tables the following: 
     - For each plant: genotype, planting type, group type, and total height.
  - Then, for the Sparse condition, combine all plants (6 plants: from table1 and table2) and compute the sealed-card share.
     - Plants in Sparse: 
          - Group1: 5,5,10
          - Group2: 5,10,10
          - All: A plants: 5,5,5 ( from group1 and group2) -> three 5's.
                   B plants: 10,10,10 ( from group1 and group2) -> three 10's.
          - Variance base = variance of [5,5,5,10,10,10] = ?
          - Mean = (3*5+3*10)/6=45/6=7.5.
          - Variance = [3*(5-7.5)^2 + 3*(10-7.5)^2] /5 = [3*6.25 + 3*6.25]/5 = 37.5/5=7.5.
          - Variance total = same as above, 7.5.
          - Sealed-card share = 7.5 / 7.5 = 100%.
  - For the Dense condition, combine all plants (12 plants: from tables 3 to 6) and compute the sealed-card share.
     - Plants in Dense:
          - From Group1 tables (two tables): 
               - A: two plants from each table -> four plants at 3.
               - B: one plant from each table -> two plants at 15.
          - From Group2 tables (two tables):
               - A: one plant from each table -> two plants at 10.
               - B: two plants from each table -> four plants at 8.
          - So all A plants: four at 3, two at 10 -> [3,3,3,3,10,10]
          - All B plants: two at 15, four at 8 -> [15,15,8,8,8,8]
          - Combined: heights = [3,3,3,3,10,10,15,15,8,8,8, wait] -> let's count: 
               A: 3,3,3,3,10,10 (6 plants)
               B: 15,15,8,8,8,8 (6 plants)
          - Mean = [ (4*3 + 2*10) + (2*15 + 4*8) ] /12 = [ (12+20) + (30+32) ] /12 = (32+62)/12=94/12=7.833.
          - Variance = [ for A: 4*(3-7.833)^2 + 2*(10-7.833)^2, for B: 2*(15-7.833)^2 + 4*(8-7.833)^2 ] /11
          - = [4*( -4.833)^2 + 2*(2.167)^2 + 2*(7.167)^2 + 4*(0.167)^2 ] /11
          - = [4*23.358 + 2*4.696 + 2*51.368 + 4*0.028 ] /11
          - = [93.432 + 9.392 + 102.736 + 0.112] /11 = 205.672/11 = 18.697.
          - Base heights: 
               A: six 5's.
               B: six 10's.
               -> variance base = [6*(5-7.5)^2 + 6*(10-7.5)^2]/11 = [6*6.25 + 6*6.25]/11 = 75/11=6.818.
          - Sealed-card share = 6.818/18.697 ≈ 36.5%.

