  *Stock Selection:*
  - The facilitator asks: " based on the sparse environment data, which genotype (A or B) is better? 
  - They see that in sparse, B is better (10 vs 5).
  - They are told that next year, we are switching to dense planting. Which genotype should we plant to maximize yield?
  - Each table wagers 2 points on either A or B.
  - The breeding team (one table) is given the authority to choose for the whole field. They choose B.
  - Then, in dense planting, if we plant only B, then for a group of three B plants: 
     - Each B: there are three, so environment effect=-2 -> total=10-2=8.
     - So yield=8.
  - If they had planted only A: environment effect=-2 -> 5-2=3.
  - If they had planted a mixture, then as above, some are 3, some are 8, some are 10, some are 15. But the mean in the data we had was 7.833, which is less than 8.
  - So by choosing B and planting only B, they get 8, which is higher than the mixed mean (7.833) and higher than A (3). So they win. 
  - To make them lose, we would need that in monoculture of B, the yield is lower than in mixed or in sparse. 

  * We can change the rules for monoculture: 
  - In the social effect, we can have: in a group where all are the same genotype, then they are not for because they are not diverse, so they get -3. 
  - Then in dense, for a group of three B plants: environment effect=-3 -> 10-3=7.
  - In sparse, they were 10, now 7. 
  - Then if they chose B, they get 7, which is less than the mixed mean of 7.833. 
  - So they should have planted mixed.

  * So change the rule for dense: 
     - If a plant is in a group where all are the same genotype, then environment effect = -3.
     - If in a mixed group, then as before: 
          - If a plant is the only one of its genotype in the group, environment effect=+5.
          - If there is more than one of its genotype, environment effect=-2.

  * Then for a group of three B plants: environment effect=-3 for each -> total=10-3=7.

  * Then, the mean in the mixed groups was 7.833, which is >7, so mixed is better. 

  * So if the breeding team chooses B and plants in monoculture, they get 7.
  - The yield from the mixed planting in the data was 7.833, so they lose.

  *Activity for stock selection:*
  1. After collecting the data from both environments, the facilitator asks the breeding team to choose: either plant only A, only B, or a mixture. They have to choose one for the whole field.
  2. They wager 2 points that the average yield in the new environment (dense) will be at least 8.
  3. They choose only B.
  4. Then the facilitator computes: in dense, for a monoculture of B, the yield is 7. 
  5. 7<8, so they lose the wager.

  * Then the sealed-card share in sparse is 100%, in dense is 36.5%, and they see that the social arrangement (dense and mixture) matters.

  **Debrief in the last 20 minutes:**

  1. Review the rounds and what happened.
  2. Map to the concept:
     - Round 1: A high within-group heritability is compatible with between-group differences that are entirely environmental.
     - Round 2: The heritability (sealed-card share) can change when the environmental variance changes, even though the genotypes are the same.
     - Round 3: Heritability is a population statistic and cannot be applied to individuals.
     - Round 4: Even with high heritability, a uniform environmental change can shift the mean.
     - Also in Round 2: The crossing interaction shows that there is no environment-independent ranking. The social effect shows that a high heritability can be a result of a modifiable social arrangement.

  3. Then introduce the term "heritability".
  4. Frankly state the limitations: in reality, we don't know the genotypes (we don't get to open the envelopes), and we don't get to randomize. We estimate heritability from family studies, which rely on assumptions. The clean orthogonality in this activity is artificial.

  **What can go wrong:**

  1. **Arithmetic stalling the room:** Variance calculation in Round 2 may take too long. 
     - *Mitigation:* In Round 2, have the students only compute the variance for their own plants, then the facilitator combines. Or provide a step-by-step guide. Or use a very simple measure like the range of within-genotype variation.

  2. **Student who has read about the topic and names it in round one:** 
     - *Mitigation:* "That's a term we'll use later, but for now, let's use 'sealed-card share' to avoid confusion."

  3. **Student who mistakes the envelope for a molecular entity:** 
     - *Mitigation:* "In this model, the sealed card represents the hereditary information passed from parents, but it's a simplification. We're not specifying what it is at the molecular level."

  4. **Group that refuses to wager:** 
     - *Mitigation:* "You can choose to wager 0, but then you forgo the chance to gain. Or wager minimally (1 point)."

  5. **Human group differences raised mid-session:**
     - *Facilitator line:* "This activity is about a fictional plant to help us understand statistical concepts. We'll discuss implications for humans at the end in a structured way. For now, let's focus on Sunnyblooms."

  **Time Management:**
  - 90 minutes: 
     - 5 min: introduction and setup.
     - 15 min per round (60 min for 4 rounds).
     - 20 min: debrief.
     - 5 min: buffer.

  This is very tight. We may need to simplify the computations or provide pre-calculated variances for some rounds.

   Given the complexity, the first time you run it, it may take longer. Consider doing fewer rounds or simplifying.

   This design meets most of the specifications, though it is complex. You may want to do a dry run with colleagues.
answer: |-
  ### Activity Design: "Sunnybloom Heights: Unsealing Heredity"  
  **Framing (1 min):**  
  "Today, you’re plant breeders optimizing ‘Sunnybloom’ height. You’ll run experiments, make predictions, and compete. We measure the ‘sealed-card share’—how much variation comes from inherited cards vs. environment. No devices; use physical materials."

  ---

  ### **Round 1: High Within-Group "Inheritance," Environmental Between-Gap**  
  **Goal:** Trap participants into attributing group differences to "inherited" envelopes.  
  **Setup:**  
  - Two sub-populations: **Group X** (low-light), **Group Y** (high-light).  
  - Envelopes per table:  
    - *Group X tables (3 tables):* 3 envelopes labeled "A" (base height: 5), 3 labeled "B" (base height: 10). Environment: +0 (total = base).  
    - *Group Y tables (3 tables):* Same envelope distribution. Environment: +5 (total = base + 5).  
  **Activity:**  
  1. **Measure:** Each table records heights of 6 Sunnyblooms (e.g., X: A=5, B=10; Y: A=10, B=15).  
  2. **Predict:** *"What % of the height difference between Group X and Y is due to sealed cards?"* Wager 1 point (10 starting points).  
  3. **Reveal:** Open envelopes.  
  **Confusion Trigger:**  
    - Within-group variance due to envelopes: 100% (all variance comes from A/B difference).  
    - Between-group difference: 0% genetic (same A/B mix; +5 is environmental).  
  **Scoring:** Lose 1 point if prediction >20%; win 2 points if ≤20% (true answer: 0%). Record group averages on wall.  

  ---

  ### **Round 2: Environmental Range & Social Interaction**  
  **Goal:** Show "sealed-card share" changes with environment range and social spacing.  
  **Setup:**  
  - All tables: 3 envelopes (1 "A" base=5, 2 "B" base=10).  
  - Random environments: Roll die → 1-2: +0, 3-4: +5, 5-6: +10.  
  - **Crossing Interaction:** "A" wins in high-nutrient (+10) but loses in low:  
    - A+10 = 15 (beats B+0=10)  
    - A+0 = 5 (loses to B+0=10).  
  - **Social Effect:** Dense planting rule: If a plant’s neighbor is taller, it gets -3 (simulating shading).  
  **Activity:**  
  1. **Sparse planting (control):** 3 tables measure heights with random environments (no neighbor effect).  
  2. **Dense planting (social):** 3 tables arrange plants in rows; apply -3 if shorter than neighbor.  
  3. **Stock Selection Task:** One "Breeder Team" uses sparse data to pick seeds for next season (A or B). Wager 2 points that their pick will be tallest in dense planting.  
  4. **Compute "sealed-card share":** Variance of base heights ÷ total height variance (formula provided).  
  **Confusion Triggers:**  
    - "Sealed-card share" drops in dense planting (e.g., 100% sparse → 50% dense) due to social effect.  
    - Breeder Team’s pick fails: B wins in sparse, but in dense, A can outcompete if neighbors are B (A+0=5 > B-3=7? No, but A+10=15 > B-3=7). True failure: In uniform B planting, B gets -3 (height=7), while mixed groups had taller plants.  

  ---

  ### **Round 3: The Individual Plant**  
  **Goal:** Show population statistic ≠ individual prediction.  
  **Setup:**  
  - Each table given 1 plant: Genotype A (base=5) or B (base=10), with random environment (e.g., +7 → total=12).  
  **Activity:**  
  1. **Predict:** *"The population sealed-card share is 50%. How much of this plant’s height is from its card?"* Wager 1 point.  
  2. **Reveal:** Open envelope.  
  **Confusion Trigger:**  
    - Correct answer is the base (5 or 10), but participants guess ~6 (50% of 12).  
    - A plant with height 12 could be A+7 (card=42%) or B+2 (card=83%).  
  **Scoring:** Lose 1 point for numerical guess; win 2 for "can’t know."  

  ---

  ### **Round 4: Uniform Environmental Shift**  
  **Goal:** Trap participants into thinking "high sealed-card share = fixed trait."  
  **Setup:**  
  - All tables: Use Round 1 Group X plants (A=5, B=10). Sealed-card share = 100%.  
  **Activity:**  
  1. **Predict:** *"A fertilizer adds +5 to all plants. Will heights change? Will sealed-card share change?"* Wager 1 point each.  
  2. **Measure:** New heights (A=10, B=15).  
  **Confusion Trigger:**  
    - Heights increase (mean: 7.5 → 12.5), but sealed-card share remains 100%.  
    - Participants who wagered "no height change" lose points.  
  **Scoring:** Win 1 point for "heights increase" and "share same."  

  ---

  ### **Roles, Incentives & Logistics**  
  - **Roles:**  
    - *Breeder Team (Round 2):* Spends "seed budget" to pick A or B. Loses 2 points if pick underperforms in dense planting.  
    - *All Teams:* Wager points on predictions; record data on wall charts.  
  - **Scoring:** Leaderboard on wall. Prize: Bag of apples for top team.  
  - **Materials per Table:**  
    - 6 envelopes (R1), 3 envelopes (R2-4), 1 die, ruler, markers, sticky notes, scoring sheet.  
    - **Facilitator Kit:** Master genotype list, environment assignments, pre-calculated variances.  

  ---

  ### **Debrief (20 min)**  
  1. **Map Activity to Concept:**  
     - Round 1: High within-group heritability ≠ genetic between-group gap (env. caused 100% of difference).  
     - Round 2: Heritability changes with environment range/social structures (e.g., dense planting inflates genetic share).  
     - Round 3: Heritability is population-level; individual outcomes depend on GxE.  
     - Round 4: High heritability ≠ trait immutability (uniform shifts change everything).  
  2. **Reveal Term:** "This ‘sealed-card share’ is called **heritability**."  
  3. **Limitations & Real-World Context:**  
     - "In reality, we never open envelopes—heritability is estimated from family/twin studies with assumptions (equal environments, no G-E correlation)."  
     - "Clean randomization like today is impossible; messy data makes inference harder."  
  4. **Transfer to Humans (Bounded):**  
     - "For human traits, heritability ≠ destiny. High heritability for height doesn’t mean nutrition doesn’t matter (as in Round 4) or that group gaps are genetic (as in Round 1)."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Arithmetic Stalling:**  
     - *Why:* Variance calculations overwhelm.  
     - *Fix:* Pre-calculate key numbers; use ranges or SD in debrief. "For today, here are the variances—focus on what they imply."  
  2. **Student Names Heritability Early:**  
     - *Fix:* "Let’s use ‘sealed-card share’ for now to avoid assumptions. We’ll define terms later."  
  3. **Mistakes Envelope for Molecular Entity:**  
     - *Fix:* "The card is a *stand-in* for inherited factors—not a gene, just a fixed starting point."  
  4. **Group Refuses to Wager:**  
     - *Fix:* "Wager 0 points if unsure, but you’ll miss gains. Low stakes = learning opportunity!"  
  5. **Human Group Differences Raised Mid-Session:**  
     - *Facilitator Line:* "We’re using plants to isolate concepts. Human differences involve historical/structural factors we’ll address in the debrief—hold that thought."  

  **Final Tip:** Dry-run with colleagues to refine timing. Use sticky notes for rapid data aggregation. Emphasize predictions over perfect math—confusion is pedagogical gold!
