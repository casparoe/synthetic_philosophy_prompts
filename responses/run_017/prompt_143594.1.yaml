  My verdicts, as best I can state them:

  - A: ten billion people all at +100. B: the same ten billion at +100, plus ten billion more at +1, living in a galaxy we'll never contact. I think B is fine — not worse than A, maybe a hair better. It feels wrong to me to say adding lives that are barely worth living makes things worse.
  - Z: 10^24 people all at +2. I really don't want to say Z is better than A; my gut says it's worse, or at least that it isn't an improvement. But I also can't find any single step in the chain from A to Z (add a lot of barely-positive lives, nudge everyone else up slightly, repeat) that I'm willing to call a worsening. I know that's the paradox, I'm reporting it anyway.
  - Shrink it down: one person at +100, versus that person plus one more at +1. Fine, slightly better. Two extra. Fine. I can't locate a number where it stops being fine, which is what makes me suspicious of my Z verdict rather than of my B verdict.
  - One person living a thousand years at +50, versus ten people each living a hundred years at +50. I have basically no preference — those feel equally good to me. Which seems to commit me to something total-ish, which pushes me toward Z, which I resist.
  - The ecstatic-minute case: a billion lives that are eighty years of mild tedium at about -3 plus one genuinely transcendent minute worth +10, net +7 each. I *don't* feel these are equivalent to a billion lives at a steady +7; I feel a bit bad about creating the first batch and not at all bad about the second. So I'm apparently not just summing welfare over a life.
  - A dip: a life at +60 for eighty years with one afternoon at -2. Obviously worth living, nothing to complain about. But now imagine ten billion lives like that — a lot of tiny sub-zero segments adding up to a big negative total. I refuse to conclude that world is bad on account of the afternoons.
