prompt: |-
  I work in contracts and performance oversight for a county human-services department. We pay nonprofit providers partly on whether they hit numbers, and my team writes somewhere between fifteen and twenty contracts a year, each with three to six performance metrics. I get maybe two hours per metric to pressure-test it before it goes to our finance director for sign-off, and he mostly cares whether a number can be audited from records we already keep — which pushes everything toward metrics that are easy to verify, and those are exactly the ones I've watched fail. I have no training in any of this, I've just been doing it six years and seeing the same four or five failures repeat: providers quietly selecting the easiest clients, relabeling a bad outcome into a category nobody counts, pouring everything into the one measured line while the rest of the service rots, and turning in numbers that climb while the thing we actually care about doesn't move. I keep coming back to that thing everyone says about a measure ceasing to be a good measure once you start paying for it — I don't remember who said it and I don't care, so please don't spend any words on the history or on who coined what, and don't cite anything because I can't look it up. It's a warning, not a procedure, and what I need is a procedure my team can actually run.

  Two rough ideas I've been using on my own, which you can keep or throw out. First, I distinguish what I call gaming (someone deliberately works the number — reclassifying, cherry-picking, closing cases early) from what I call capture (no one is cheating at all; the staff just sincerely internalize the metric and stop noticing the parts of the mission that aren't in it). They feel like they need different tests, but I'm not sure they do. Second, I've started slipping cheap "ghost measures" into contracts — a number we collect quietly that isn't tied to any payment and that the provider barely notices, chosen so that it ought to move together with the paid metric; if the paid metric improves and the ghost doesn't, something's off. I want you to tell me whether that trick is actually sound or whether I'm fooling myself, and where it breaks. A third thing I'd like handled: our director wants each year's target to be last year's actual plus a bit, which I think punishes whoever performed well this year. And there's a pressure I can't name properly — the metrics that survive auditing tend to be true of the paperwork rather than true of the world, so a provider can hit them perfectly while nothing changes for anyone.

  What I want is a written procedure: the questions in order, what counts as a good enough answer to each one, where the procedure just stops and says no, and where it has to hand the decision to a person because the question is about what we value rather than what's happening. It has to be runnable in about two hours by someone with no theory background, using records we already have, and it should say what to do when a number simply can't be gotten. If you use a technical term, define it in one clause. Then walk it through three metrics from my world, in this order: (1) average days from referral to first appointment, which is my favorite because it's trivially auditable and I suspect you're going to tell me to drop it; (2) percent of people placed in housing who are still in the same housing six months later; (3) a proposed metric on serving the hardest cases, where I think the procedure will stall and a human will have to decide something about who we owe what. Please also tell me straight out which parts of this are judgment calls dressed up as steps.

  Sections, in this order, with rough lengths: "The procedure" (700 words, ordered steps with pass/fail/hand-off at each), "Walkthrough: referral-to-appointment time" (200 words), "Walkthrough: housing at six months" (250 words), "Walkthrough: the hardest-cases metric" (200 words), "Where a person has to decide" (200 words), "What this procedure can't tell me" (150 words).
reasoning: |-
  Okay, the user works in contracts for a county human-services department, dealing with performance metrics for nonprofits. They're frustrated because the current metrics are easy to audit but lead to problems like cherry-picking clients or neglecting unmeasured services. They need a practical procedure to test metrics in about two hours per metric, using existing records.

  First, I need to understand their main issues. They mentioned gaming (deliberate manipulation) and capture (unintentional focus on metrics). Their ghost measures idea is clever but might have flaws. Also, the director's approach of setting targets as last year's performance plus a bit punishes good performers. Plus, metrics often reflect paperwork, not real-world impact.

  The user wants a step-by-step procedure. It should be usable by someone without theory background, fit into two hours, use existing data, and handle unmeasurable numbers. They want clear pass/fail steps and know where human judgment is needed. The three examples will test the procedure.

  Starting with "The Procedure." It needs to be structured but flexible. Breaking it into phases makes sense: Intent, Vulnerability, Verifiability, Target Setting, and Ghost Measures. Each step must have clear criteria. For instance, defining the real goal upfront to avoid capture. Vulnerability checks should identify possible gaming or capture. Verifiability ensures data can be audited without new systems. Target setting needs to avoid punishing high performers. Ghost measures need to be correlated but not manipulable.

  For the walkthroughs: Referral-to-appointment time is easy to audit but might lead to cherry-picking. The procedure should flag that it doesn't ensure quality care. Housing stability at six months might have relabeling issues. The hardest-case metric will likely require human judgment since defining "hardest" is subjective.

  Ghost measures: I should validate their idea but point out limitations. If the ghost measure is affected by the same manipulations, it won't help. They need to choose a measure that's harder to game but still correlated.

  Human judgment points: Defining values, trade-offs between auditability and effectiveness, and when metrics can't capture reality. The procedure must clearly hand off these decisions.

  What the procedure can't do: Fix data gaps, make value judgments, or prevent all gaming. Transparency with providers is key.

  The user's deeper needs: They want to stop the cycle of failing metrics, ensure real impact, and have a defensible process to push back on problematic metrics. They need tools to advocate for better measures despite audit constraints.

  Making sure each section meets word counts. The procedure section is the longest. Walkthroughs are concise, showing application. Highlighting judgment calls disguised as steps, like defining core intent, which requires discussion.

  Also, addressing the director's target-setting issue by using benchmarks or tiered targets. For ghost measures, emphasizing they must be truly independent.

  Overall, the procedure should empower the user to challenge metrics constructively, using their experience and practical steps within their constraints.
answer: |-
  Here’s a practical procedure for pressure-testing performance metrics, designed for your constraints (2 hours per metric, no theory background, existing records). It focuses on preventing gaming, capture, and misalignment with real-world outcomes.

  ---

  ### **The Procedure (700 words)**
  *Run this checklist for each metric. Use existing records or quick desk research. Stop if any step fails unless marked "hand-off."*

  1.  **Define Core Intent (10 mins)**
      *   *Question:* "What real-world change or service quality do we *truly* care about that this metric is a *proxy* for?"
      *   *Good Answer:* Clear, specific, outcome-focused (e.g., "Reduce client suffering while waiting," "Ensure housing stability," "Serve clients with highest barriers"). Avoid process descriptions (e.g., "Speed up intake").
      *   *Pass:* Intent is defined and outcome-focused.
      *   *Fail/Hand-off:* Intent is vague, purely process-oriented, or conflicts with other core intents. Hand off to leadership to clarify the value/priority.
      *   *Judgment Call:* Defining the "true" intent requires discussing values.

  2.  **Test for Gaming Vulnerability (30 mins)**
      *   *Question:* "How easily could a provider manipulate this number *without* improving the core intent? Focus on deliberate actions."
      *   *Actions:* Brainstorm specific tricks (using your list: cherry-picking easy clients, reclassifying outcomes, delaying/canceling harder referrals, focusing only on measured clients, creative record-keeping).
      *   *Check:* Can existing records *reliably* detect these tricks (e.g., can you audit client acuity at referral, track reclassifications, compare served vs. eligible population snapshots)?
      *   *Pass:* Major gaming tricks are difficult or detectable with current data.
      *   *Fail:* Obvious, undetectable gaming paths exist (e.g., no way to check client selection bias). Metric likely unusable as a payment trigger.
      *   *No Judgment:* This is about identifying concrete manipulation methods.

  3.  **Test for Capture Vulnerability (30 mins)**
      *   *Question:* "If staff focus *only* on maxing this number, what important parts of the service or mission (related to the core intent) might they unintentionally neglect or harm?"
      *   *Actions:* List critical service elements *not* captured by this metric (e.g., quality of appointment, support *after* placement, serving complex needs alongside simpler ones, staff morale, client satisfaction).
      *   *Check:* Is there *any* existing data (even imperfect) hinting at these elements (e.g., complaints, case notes patterns, staff turnover, ghost measures)?
      *   *Pass:* Core mission elements are somewhat covered by other metrics/data; serious neglect seems unlikely or detectable.
      *   *Fail:* Critical aspects of the core intent are completely unmeasured and vulnerable to erosion. Metric should be modified or paired with a counterbalance.
      *   *Judgment Call:* Assessing "critical" mission aspects involves values.

  4.  **Test Verifiability & Data Reality (20 mins)**
      *   *Question:* "Can we *practically* and *reliably* audit this number *right now* from records providers already keep, matching the Finance Director's requirement?"
      *   *Actions:* Identify the exact source data points. Ask: Are they consistently recorded? Are definitions clear? Can we pull a sample quickly? Is verification just checking paperwork, or does it connect to a real-world event (e.g., housing inspection vs. lease document)?
      *   *Pass:* Clear audit trail exists using current records; number reflects a real event, not just paperwork.
      *   *Fail:* Data is inconsistently kept, definitions are fuzzy, or verification *only* checks internal paperwork disconnected from reality. Metric fails Finance sign-off.
      *   *No Judgment:* This is a factual check of data existence and audit process.

  5.  **Test Target-Setting Logic (20 mins)**
      *   *Question:* "Is the proposed target-setting method fair and likely to drive improvement without perverse incentives?"
      *   *Actions:* Reject "Last Year + X%" as the *default*. Evaluate:
          *   *Benchmark:* Is there a known industry standard or best-practice target?
          *   *Tiered:* Can targets be set based on provider size/experience/client mix?
          *   *Improvement Potential:* Does it consider room for growth (penalizing high performers is bad)?
          *   *Stability:* For mature programs, is a maintenance target appropriate?
      *   *Pass:* Method is fair, considers context, and incentivizes genuine improvement/maintenance.
      *   *Fail/Hand-off:* Method is rigid "Last Year + X%" *and* would penalize high performers or be impossible for new providers/contexts. Hand off to leadership/negotiation for a contextual approach.
      *   *Judgment Call:* "Fairness" and "improvement potential" require context.

  6.  **Design & Test Ghost Measure (Optional but Recommended) (30 mins)**
      *   *Question:* "Can we add a simple, non-payment-related 'ghost' metric using existing data that *should* correlate with the core intent if the main metric improves genuinely?"
      *   *Actions:* Choose something:
          *   Harder to game (e.g., random client satisfaction spot-check on a related aspect, staff time spent on unmeasured support).
          *   Reflecting a different angle of the core intent (e.g., for housing stability: emergency service usage by placed clients).
          *   Capturing potential harm (e.g., complaints from clients not meeting metric criteria).
      *   *Test:* Is it truly low-burden? Does it use existing data? Is it logically linked but distinct enough? *Crucially:* Could success on the *paid* metric cause the *ghost* to *worsen* (bad sign) or stay flat (warning sign) while the ghost *should* improve if the core intent is met?
      *   *Pass:* A viable ghost is identified and added.
      *   *Fail:* No suitable ghost found. *Proceed with caution* on the main metric, flagging higher risk of undetected dysfunction.
      *   *Where it Breaks:* If the ghost is affected by the *same* manipulation as the main metric, or if the link between the main metric and core intent is fundamentally broken. It's a warning system, not proof.

  7.  **Final Go/No-Go Synthesis (10 mins)**
      *   *Question:* "Considering all steps, does the metric pass the 'sniff test' for driving real improvement aligned with our intent without creating major gaming/capture risks, and is it auditable?"
      *   *Actions:* Review Pass/Fail/Hand-off outcomes. Weigh risks. Can major failures be mitigated (e.g., by pairing metrics, adding safeguards)?
      *   *Pass:* Proceed to Finance.
      *   *Fail/Hold:* Do not proceed. Document reasons (citing step failures). Propose alternatives/modifications.
      *   *Hand-off:* Escalate unresolved issues (core intent conflict, unfair target method) to leadership with clear options/risks.

  ---

  ### **Walkthrough: Referral-to-Appointment Time (200 words)**
  *   **Core Intent:** Reduce client suffering and risk during waiting periods; improve access speed *meaningfully*.
  *   **Gaming Vulnerability (FAIL):** *High.* Cherry-picking simple cases for fast appointments; delaying/canceling complex referrals; marking brief phone calls as "appointments." Hard to detect bias without acuity data.
  *   **Capture Vulnerability (FAIL):** *High.* Staff rush appointments, sacrificing quality/thoroughness. Neglect pre-appointment support. Ignore clients stuck in the queue. No measure of what happens *at* the appointment.
  *   **Verifiability (PASS):** Trivial to audit from referral and scheduling records.
  *   **Target Setting (FAIL/HAND-OFF):** "Last Year + X%" punishes efficient providers. Hand-off: Negotiate context-specific targets (e.g., based on referral volume/complexity) or a maximum acceptable wait time benchmark.
  *   **Ghost Measure:** *Client distress calls/contacts during waiting period* (using existing call logs). Should decrease *if* faster access reduces suffering. If times drop but distress calls rise/steady, capture/gaming is likely.
  *   **Synthesis:** **FAIL.** Highly vulnerable to gaming and capture. Verifiability is its only strength. *Recommendation:* Don't pay on this alone. Use as a diagnostic/internal measure paired with quality/outcome metrics and the ghost. Escalate gaming/capture risks.

  ---

  ### **Walkthrough: Housing at Six Months (250 words)**
  *   **Core Intent:** Ensure housing placements are *stable and sustainable*, leading to improved well-being.
  *   **Gaming Vulnerability (PASS/MITIGATED):** *Moderate.* Risk: Providers only place clients least likely to fail; pressure clients to stay in unsuitable housing; relabel moves (e.g., call eviction "mutual agreement"). *Mitigation:* Audit requires defining "same housing" clearly (leaseholder? unit? building?) and checking reason for exit (eviction records, inspection reports help). Cross-check with client interviews/surveys if possible (existing satisfaction data?). Harder to game than speed.
  *   **Capture Vulnerability (MODERATE PASS):** *Risk:* Providers focus *only* on keeping bodies in units for 6 months, neglecting support services (mental health, employment) that ensure *long-term* stability and well-being. *Mitigation:* Paired with other metrics (e.g., employment status, service usage post-placement). Ghost measure helps.
  *   **Verifiability (PASS):** Auditable from lease records, payment records, provider occupancy reports, and (ideally) third-party verification (utility records, inspection) around the 6-month mark. Needs clear definition of "same housing."
  *   **Target Setting (HAND-OFF):** "Last Year + X%" is problematic (market volatility, client mix changes). Hand-off: Negotiate benchmarks (e.g., local program averages), tiered targets based on client profile (e.g., chronic homelessness vs. family crisis), or ranges. Avoid punishing success.
  *   **Ghost Measure:** *Client-reported quality of life/satisfaction at 6 months* (short survey snippet in existing follow-up) OR *Emergency service usage (ER, shelter) 7-12 months post-placement.* Should improve/remain stable with genuine stability. If stability stays high but satisfaction plummets or emergency use rises, capture is likely (people stuck in bad situations).
  *   **Synthesis:** **CAUTIOUS PASS.** Stronger than speed metric. Requires clear audit definitions and pairing with support/service metrics to mitigate capture. Implement the ghost. Document vulnerabilities.

  ---

  ### **Walkthrough: The Hardest-Cases Metric (200 words)**
  *   **Core Intent:** Ensure providers serve clients with the most complex needs/highest barriers, fulfilling equity/mission goals.
  *   **Gaming Vulnerability (FAIL/HAND-OFF):** *Extreme.* Defining "hardest cases" is subjective. Providers will lobby for the broadest, easiest definition. Cherry-picking the *easiest* "hard" cases. Risk of "creep" – everyone gets labeled "hard." *Hand-off to Leadership:* Define "hardest cases" **operationally** using auditable criteria (e.g., specific diagnoses + homelessness duration + prior service failures). Requires value judgment on prioritization.
  *   **Capture Vulnerability (TBD):** *Risk:* All resources pour into "hardest" as defined, neglecting moderately needy clients who could benefit greatly. *Hand-off:* Requires leadership decision on resource allocation balance.
  *   **Verifiability (TBD):** Depends entirely on the operational definition. Must be based on auditable records (intake assessments, history).
  *   **Target Setting (HAND-OFF):** Setting a numerical target (e.g., "Serve X% hardest cases") is fraught. What's the baseline? What's feasible? Hand-off to leadership/negotiation based on capacity and defined population size.
  *   **Ghost Measure:** *Unlikely feasible yet.* Needs a stable definition first. *Maybe:* Outcomes *for* the served "hardest cases" vs. others (if outcomes are measured).
  *   **Synthesis:** **STALLED at Hand-off.** Defining the target population and setting fair targets are fundamental value/resource decisions. *Procedure Outcome:* Document the core intent and the need for leadership to define the operational criteria and target philosophy *before* proceeding. This metric is high-risk without top-down clarity.

  ---

  ### **Where a Person Has to Decide (200 words)**
  This procedure forces explicit hand-offs where pure process stops and human judgment about values, priorities, and trade-offs is essential:

  1.  **Defining Core Intent (Step 1):** What outcome do we *truly* value most? Is speed more important than thoroughness? Is serving the hardest cases worth potentially serving fewer overall? This is a mission/priority call.
  2.  **Resolving Conflicts:** When a metric's design for one intent (e.g., serving hardest cases) inherently conflicts with another (e.g., overall placement numbers), leadership must decide the balance.
  3.  **Operationalizing Vagueness (Hardest Cases):** Translating a value ("serve the most vulnerable") into auditable criteria (Step 6 in Hardest Cases walkthrough) requires judgment on what barriers define "hardest" and how to measure them fairly.
  4.  **Accepting Risk:** Sometimes, a less auditable metric might be crucial for capturing the core intent. Leadership must decide if the risk of imperfect verification is worth the gain in relevance (Finance Director needs convincing).
  5.  **Target Setting Philosophy (Steps 5 & Hardest Cases):** Moving beyond "Last Year + X%" requires decisions about fairness, ambition, context-sensitivity, and what constitutes "success" or "improvement." This involves negotiation and policy.
  6.  **Resource Allocation Implied by Capture (Step 3):** Deciding what mission elements are "critical" enough to require protection when a metric might cause neglect involves value judgments about the service model.

  The procedure flags *where* these decisions are needed and provides the analysis (risks, trade-offs) to inform them.

  ---

  ### **What This Procedure Can't Tell Me (150 words)**

  1.  **Future-Proofing:** It won't predict *new* gaming tactics that emerge after implementation. Vigilance and adapting the procedure are needed.
  2.  **Fixing Bad Data:** If essential records for verification or ghost measures don't exist or are garbage, the procedure identifies this (Steps 4 & 6) but can't create the data. You need system fixes.
  3.  **Definitive Proof of Gaming/Capture:** It identifies high risks and suspicious patterns (especially with ghost measures), but it can't *prove* bad faith without deeper investigation. Ghost measures provide warnings, not convictions.
  4.  **Optimal Metric Design:** It pressure-tests for failure modes within constraints, but won't invent the *best possible* metric if current data/audit limits are severe. It's defensive.
  5.  **Value Hierarchies:** It forces value decisions into the open (hand-offs), but doesn't make the decision itself. Leaders must own the priorities.
  6.  **Provider Goodwill:** It assumes providers *might* game/capture, but can't measure the actual level of trust or commitment in a partnership. Transparency with providers about the *why* behind metrics is still crucial.

  This procedure makes risks visible and forces critical decisions upstream, within your tight time and resource limits. It won't solve everything, but it provides a structured defense against the failures you've seen repeat.
