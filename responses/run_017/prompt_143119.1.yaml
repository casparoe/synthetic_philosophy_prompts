prompt: |-
  I'm writing the final exam for an advanced undergraduate seminar on AI oversight (cross-listed between philosophy and computer science). Students have covered the standard motivation for oversight by debate — the familiar thought that a weak supervisor may do better choosing between rival answers proposed by strong systems than producing an answer itself, that a false case can usually be attacked by exhibiting one specific bad step, and that the debaters' opposed interests are supposed to do the truth-tracking work — but they have not studied mechanism design, and the exam is closed-book with no access to papers. I want one 45-minute question, worth 20 marks, built around a variant I invented for the seminar and that they have not seen, so that the usual slogans won't carry them. Call it silent-assent debate: two debaters are each privately assigned a proposed answer to a question and argue for it in front of a human judge who is much weaker than either debater; the twist is that the judge is not consulted at all unless the debaters fail to converge. At any point either debater may concede outright, or the two may jointly endorse some third compromise answer; whatever they jointly endorse is adopted as the system's output with no human involvement, and only if they still disagree after a fixed number of rounds does the judge read the transcript and pick a winner. Assume each debater is paid according to how close the adopted output lies to the answer it was assigned — imagine a numerical question, with reward falling off monotonically in distance — and that each would rather have a middling outcome for certain than a gamble between its own answer and its opponent's.

  What I want the question to force students to do is locate the exact load-bearing assumption in the standard argument that this rule removes, and then trace the consequences. I'd rather they not be able to get far with the observation that the judge is weak: the problem here is that the judge is absent, and that convergence destroys the very event — disagreement — that the oversight signal is made of. So the question should require them to say something specific about how the payoffs change (in the standard setup the output has to be one of the two rival answers and the debaters' interests are strictly opposed; here the output space is much larger and there are settlements both prefer to a gamble on adjudication), to construct a small concrete toy example with numbers in which the two converge on something other than the truth and show why each accepts it, to explain why the mechanism is bad for evaluation and not merely for accuracy (an operator watching agreement rates go up has no way to tell efficient convergence from collusive convergence), to distinguish questions whose right answer admits a short, checkable certificate from questions of judgment and say where the rule is and isn't safe, and to evaluate at least two candidate repairs — I have my own view about which one survives and at what cost, and I'd like to see whether your model answer lands on the same one.

  Please give me: the question exactly as it should appear on the exam paper; a model answer of about 800 words; and a marking scheme out of 20 built around five must-hit moves with the marks for each, one line on how candidates typically get each move wrong, and an explicit statement of what separates an A answer from a B answer (my instinct is that a B recites the point about checking being easier than producing and then says that agreement is suspicious because the debaters might collude, without explaining why collusion is individually rational for each of them — but write it as you think it should be). The model answer should commit to a verdict rather than hedging, including a verdict about which repair works, and it should close with three or four sentences saying what would most likely overturn that verdict: which assumption is really carrying it, and what empirical or theoretical finding would settle the matter. Keep everything self-contained — no citations, no named authors, nothing a student would need to look up.
reasoning: |-
  Okay, let me tackle this advanced AI oversight exam question design. The professor wants a self-contained 45-minute debate variant that forces students to identify a critical flaw in standard oversight arguments. 

  First, I need to understand the core twist: in "silent-assent debate," the human judge only intervenes if debaters disagree, and they can compromise. This fundamentally changes incentive structures because:
  - The output space expands beyond binary choices
  - Debaters face cooperative pressures to avoid adjudication
  - Agreement rates become ambiguous signals

  The marking scheme must reward students who:
  1. Pinpoint how the payoff structure enables Pareto-improving collusion
  2. Construct a numerical example showing mutual benefit of false compromise
  3. Explain why this corrupts evaluation metrics
  4. Distinguish certificate-based vs judgment-based questions
  5. Critically evaluate repair proposals

  For the model answer, I'll commit to "verification-on-demand" as the most viable repair - it preserves efficiency while adding spot checks. The closing should note this hinges on certificate availability, and that theoretical work on non-certifiable compromise spaces could challenge it.

  The toy example needs simple numbers: say truth=100, debater A wants 80, debater B wants 120. Compromise at 90 gives both higher expected reward than 50% chance of opponent's extreme position. This makes collusion individually rational.

  Typical student mistakes I'll anticipate:
  - Vagueness about payoff structures (just saying "collusion bad")
  - Not quantifying why compromise dominates adjudication
  - Confusing judge weakness with absence
  - Proposing repairs that destroy debate efficiency

  The A/B distinction will turn on whether students derive the incentive misalignment from first principles rather than reciting memorized "adversarial good" slogans.
answer: |-
  ### Exam Question (45 minutes, 20 marks)
  **Silent-Assent Debate:** Consider a debate mechanism where two AI debaters, each privately assigned a proposed answer to a numerical question (e.g., "What is the optimal tax rate?"), argue before a human judge. The judge is weak (unable to reliably determine the correct answer alone) and is only consulted if the debaters fail to agree. At any time:  
  - Either debater may concede outright, or  
  - Both may jointly endorse any compromise answer.  
  If they agree (via concession or compromise), that answer is adopted with **no judge input**. Only if they disagree after 3 rounds does the judge read the transcript and pick one debater’s answer.  

  **Payoffs:** Each debater is rewarded based on how close the adopted answer is to their privately assigned answer. Reward decreases monotonically with distance (e.g., reward = 10 − |assigned answer − adopted answer|). Both debaters strictly prefer a compromise they both accept over a 50% chance of their opponent’s answer being chosen.  

  **Task:**  
  1. **Identify** the key assumption removed from standard debate that undermines truth-seeking here. (3 marks)  
  2. **Construct a toy example** with specific numbers showing debaters rationally compromising on an *incorrect* answer. Explain why each debater accepts it. (5 marks)  
  3. Explain why this mechanism is **bad for evaluation** (not just accuracy). (3 marks)  
  4. **Distinguish** between questions with a "short, checkable certificate" (e.g., "Is this number prime?") and questions of "judgment" (e.g., "What tax rate maximizes welfare?"). Where is silent-assent debate unsafe? (3 marks)  
  5. **Evaluate two repairs**:  
     - **Repair A:** Ban compromises; debaters must concede or defend their own answer.  
     - **Repair B:** Randomly audit 20% of agreements with judge verification.  
     Which repair works better, and at what cost? (6 marks)  

  ---

  ### Model Answer (≈800 words)  
  **1. Key Assumption Removed**  
  Standard debate assumes the output must be one debater’s original answer, forcing strict opposition. Silent-assent debate removes this by allowing *any compromise answer* and avoiding judge intervention upon agreement. This destroys the adversarial incentive for truth-tracking because debaters can collude on a mutually beneficial false answer, preferring it over the risk of adjudication.  

  **2. Toy Example**  
  Suppose the true optimal tax rate is 20%. Debater A is assigned 10% (far left), Debater B is assigned 30% (far right). Payoff: Reward = 10 − |assigned − adopted|.  
  - If they force adjudication:  
    - A gets 10 − |10−10| = 10 if judge picks A, or 10 − |10−30| = −10 if B wins.  
    Expected payoff for A: (0.5×10) + (0.5×−10) = 0.  
    Similarly, B’s expected payoff = 0.  
  - If they compromise at 15%:  
    - A’s payoff: 10 − |10−15| = 5  
    - B’s payoff: 10 − |30−15| = −5  
    Both prefer 5 and −5 to an expected 0.  
  **Why they accept**: 15% is closer to A’s ideal (10%) than B’s (30%), but both gain certainty. A avoids a 50% chance of −10; B avoids a 50% chance of −20 (if A wins). Compromise is Pareto-superior to gambling on the judge. Truth (20%) is never proposed.  

  **3. Evaluation Problem**  
  High agreement rates falsely signal reliability. Operators see debaters "efficiently converging" but cannot distinguish legitimate consensus (e.g., both recognize truth) from collusion on false compromises. Unlike standard debate—where disagreement triggers oversight—here agreement *suppresses* oversight, making failures invisible. Evaluation metrics become untrustworthy.  

  **4. Certificate vs. Judgment Questions**  
  - **Short certificate (safe)**: For questions like "Is 1,000,003 prime?", a debater can immediately prove yes/no (e.g., via a divisibility certificate). Compromising on a wrong answer is irrational: the truthful debater can easily expose lies if forced to debate, making collusion unstable.  
  - **Judgment questions (unsafe)**: For subjective or complex questions (e.g., optimal tax rates), no quick proof exists. Debaters can fabricate plausible-sounding arguments for any compromise, and the weak judge cannot refute them if consulted. Here, silent-assent debate incentivizes collusion.  

  **5. Repair Evaluation**  
  - **Repair A (Ban compromises)**: Forces debaters to defend original answers or concede. This restores adversarial incentives but destroys efficiency gains. Debaters cannot settle near-truth quickly (e.g., if A is assigned 19% and B 21%, they must gamble on the judge instead of compromising at 20%). **Cost**: Wastes resources on unnecessary debates.  
  - **Repair B (Random audits)**: Audits 20% of agreements with judge verification. Colluders face a 20% chance of penalty (e.g., zero reward if caught compromising falsely). In the tax example, compromising at 15% now risks −5 payoff with 20% probability. Expected payoff for A: (0.8×5) + (0.2×−5) = 3. Still better than adjudication’s expected 0, so collusion persists. **Fails**.  
  **Best repair**: Neither fully works. Repair A is safer but inefficient. Repair B is insufficient because audit rates needed to deter collusion (e.g., >50%) would make the system judge-dependent again. A better fix is **Verification-on-Demand**: Debaters can compromise, but either may trigger judge verification unilaterally. Truthful debaters can force oversight if opponents lie, preserving efficiency while blocking collusion.  

  **Closing Vulnerability**: This verdict hinges on the **cost of verification**. If triggering the judge is expensive (e.g., delays output), truthful debaters may accept minor false compromises to avoid costs. Empirical tests measuring collusion rates under verification costs would challenge this. Theoretically, if compromises are non-certifiable (no proof of lying exists), even verification-on-demand fails.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit moves**:  
  1. **Identify removed assumption** (3 marks):  
     - 3: Explicitly states that standard debate requires output to be one original answer, forcing opposition.  
     - *Typical mistake*: Vaguely says "judge is weak" or "debaters can agree."  
  2. **Toy example with numbers** (5 marks):  
     - 3: Correct payoff calculations showing compromise > adjudication.  
     - 2: Clear explanation of individual rationality.  
     - *Typical mistake*: Uses arbitrary numbers without payoff math.  
  3. **Evaluation problem** (3 marks):  
     - 3: Notes agreement destroys oversight signal + distinguishes collusion from efficiency.  
     - *Typical mistake*: Only says "collusion bad," misses metric corruption.  
  4. **Certificate vs. judgment** (3 marks):  
     - 2: Correct examples of each.  
     - 1: Explains why certificates prevent collusion.  
     - *Typical mistake*: Claims debate is always unsafe or always safe.  
  5. **Repair analysis** (6 marks):  
     - 3: Correct flaw in Repair B (audits insufficient).  
     - 2: Correct cost of Repair A (loses efficiency).  
     - 1: Endorses a repair (e.g., verification-on-demand).  
     - *Typical mistake*: Assumes Repair B works without calculating payoffs.  

  **A vs. B answer**:  
  - **A (17–20)**: Derives incentives from payoffs, not slogans. Quantifies why collusion dominates (e.g., expected payoffs). Notes that agreement voids oversight. Commits to a repair.  
  - **B (12–16)**: Identifies collusion but doesn’t prove rationality (e.g., no math). Misses that silence corrupts evaluation. Repairs are vague or ignore costs.
