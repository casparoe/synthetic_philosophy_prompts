prompt: |-
  I've been reading, on my own, about the argument over whether what you believe or want can change what you actually see — as opposed to only changing what you say about it or how you act on it — and every discussion I find seems to settle the whole thing with one favourite example. I want the specification instead of another example.

  Write me the desiderata for a test of genuine cognitive penetration of perception, where "good enough for" means: good enough to settle the ordinary claim that experts, or people raised in different surroundings, literally see the world differently. Give me the list — the cases it has to classify correctly (the illusion whose lines you know to be the same length; the drawing that flips once someone tells you what it is; the trained eye versus the novice, say a radiologist or a birder; a slope that looks steeper to me when I'm carrying a heavy pack; afterimages and illusory contours, where nobody thinks belief is doing any work), the distinctions it must not collapse (penetration versus attention, versus response bias, versus ordinary context effects, versus learning that only changes what you notice), and the constraints it can't violate (perception is fast and not something you decide to do; it's the thing that puts us in contact with how the world actually is; it doesn't simply vanish when you're told you're being fooled). Say why each is a requirement and mark which are non-negotiable and which are just what one camp happens to want.

  One extra demand I have, and I want to know whether it's a real desideratum or my own prejudice: the test should still give an answer where there is no honest first-person report to collect — a blindsight patient, a dog, an image classifier whose output shifts when you change how common it believes tumours to be. Say which of those cases a theory must handle and which it may ignore.

  If some subset of the requirements can't be satisfied together, say which — that interests me most. Then commit: tell me which single requirement you think does the most work in knocking theories out, which of my list is really a prejudice, and where you're least sure. Don't score the named positions; I'll do that myself.
reasoning: |-
  Okay, the user is asking for a set of criteria to test whether beliefs or desires can actually change what we see, not just how we report or act on it. They want a clear list of what a good test must include: cases it should handle, distinctions it must make, and constraints it can't violate. They also want to know if their extra demand—handling cases without first-person reports—is a valid requirement.

  First, I need to recall the key examples in cognitive penetration debates. The Muller-Lyer illusion is a classic where knowing the lines are equal doesn't change perception. Then there's ambiguous figures like the duck-rabbit, where knowing what it is flips the image. Expertise cases, like radiologists spotting tumors, show learned differences. The backpack making slopes look steeper is another example. The user mentioned afterimages and illusory contours as cases where beliefs don't play a role.

  The user wants distinctions between cognitive penetration and other processes. Attention shifts focus but doesn't alter perception. Response bias affects reporting, not seeing. Context effects are standard in perception, like a word in a sentence. Learning to notice differences, like birders, might not change the visual input itself.

  Constraints include perception being fast, involuntary, and providing accurate world contact. Even when you know an illusion, it persists, like Muller-Lyer.

  The extra demand is handling cases without first-person reports: blindsight patients, animals, or AI. I need to determine if this is necessary or just the user's preference. For a comprehensive theory, including non-human cases could strengthen it, but some might argue that human perception is the primary focus.

  Now, compiling the desiderata. Must correctly classify the listed cases. Distinctions between penetration and attention/bias/etc. are crucial. Constraints about speed and persistence are non-negotiable. The report-free cases might be negotiable; some theories focus only on conscious perception.

  Possible conflicts: If perception must be based on world contact, but beliefs alter it, how does accuracy work? Also, requiring no first-person reports might clash with defining "seeing" differently for humans vs. animals or AI.

  The most critical requirement might be the persistence of illusions despite knowledge. If a theory can't explain why Muller-Lyer still looks distorted even when you know, it's weak. The user's extra demand might be a valid push for broader application, but not essential for all theories. Least sure about how to distinguish top-down effects in early vision versus post-perceptual processing. That's where the real debate lies.
answer: |-
  Here are the desiderata for a test of genuine cognitive penetration of perception (CP), designed to rigorously settle the "ordinary claim" that cognition literally alters what is seen, structured as requested. Requirements are categorized, justified, and marked for negotiability. Conflicts and critical assessments follow.

  ---

  ### **I. Cases the Test MUST Classify Correctly (Non-Negotiable)**
  1.  **Müller-Lyer Illusion Persistence:**  
      *   **Requirement:** Must diagnose *no* CP here. Knowing the lines are equal doesn't make them *look* equal; the illusion persists.  
      *   **Why:** Demonstrates perception's immunity to *known* contradictory belief. If CP existed here, the illusion would vanish with knowledge. It doesn't.

  2.  **Ambiguous Figure Reversals (e.g., Duck-Rabbit):**  
      *   **Requirement:** Must diagnose *no* CP here. Knowing what it *can* be doesn't force one interpretation; the flip is perceptual but driven by attention/prior knowledge *structuring* ambiguous input, not *changing* the input itself.  
      *   **Why:** Shows cognition influences *interpretation* of ambiguous sensory data, not the *basic percept*. CP should change the *unambiguous* percept.

  3.  **Expertise Effects (e.g., Radiologist/Birder):**  
      *   **Requirement:** Must *distinguish* cases. Does the expert literally *see* the tumor/bird differently (CP candidate), or just *recognize/focus* on it faster/better using the same basic percept (attention/recognition)?  
      *   **Why:** The core "ordinary claim." CP proponents argue experts *see* differently; opponents argue they *interpret/attend* differently based on same input.

  4.  **Action/Need Effects (e.g., Slope w/ Heavy Pack):**  
      *   **Requirement:** Must diagnose *potential* CP candidate. Does the slope *look* objectively steeper, or does the need/effort merely bias *judgment* of incline?  
      *   **Why:** Represents a strong case where motivational states might *directly* bias low-level perception relevant to action planning.

  5.  **"Hardwired" Illusions (e.g., Afterimages, Kanizsa Triangle):**  
      *   **Requirement:** Must diagnose *no* CP here. These illusions are stimulus-driven, occurring despite knowledge and without cognitive input. Belief plays no role.  
      *   **Why:** Establishes a baseline for genuinely impenetrable, stimulus-bound perceptual processes.

  ---

  ### **II. Distinctions the Test MUST NOT Collapse (Non-Negotiable)**
  6.  **CP vs. Attention:**  
      *   **Requirement:** Must distinguish *changing the perceptual content/experience itself* (CP) from *selecting which part of an unchanged percept to focus on* or *enhancing the resolution of existing features*.  
      *   **Why:** Attention demonstrably changes what we *process* and *report*, not necessarily the fundamental sensory representation. Collapsing this invalidates the CP claim.

  7.  **CP vs. Response Bias:**  
      *   **Requirement:** Must distinguish *seeing X* from *reporting/acting as if you see X* due to incentives, expectations, or social pressure, while actually seeing Y.  
      *   **Why:** The core skeptical alternative. Many "top-down" effects are post-perceptual decisions about ambiguous or noisy percepts.

  8.  **CP vs. Ordinary Context Effects (Low-Level):**  
      *   **Requirement:** Must distinguish *cognitive* influence (beliefs, desires, concepts) from *sensory* context effects (e.g., color constancy under different lighting, simultaneous contrast).  
      *   **Why:** Low-level context effects are standard, stimulus-driven perceptual mechanisms, not evidence for cognitive penetration.

  9.  **CP vs. Learning to Notice/Recognize:**  
      *   **Requirement:** Must distinguish *altering the basic phenomenal character* (e.g., color, shape, motion experience) from *learning associations, labels, or diagnostic features* that allow faster/more accurate recognition or discrimination *based on existing percepts*.  
      *   **Why:** Expertise often involves recognition/interpretation learning, not necessarily changing the raw sensory input ("seeing" vs. "seeing as").

  ---

  ### **III. Constraints the Test CANNOT Violate (Non-Negotiable)**
  10. **Speed & Automaticity:**  
      *   **Requirement:** CP effects, if real, must occur rapidly and automatically, not via slow, deliberate "re-interpretation." Perception is not a voluntary decision.  
      *   **Why:** Core definition of perception as a fast, mandatory process. If it's slow and deliberate, it's likely cognition *after* perception.

  11. **World Contact & Constancy:**  
      *   **Requirement:** Perception must remain fundamentally grounded in sensory input and preserve stable representations of object properties (e.g., size, shape, color constancy) despite varying conditions. CP cannot make perception *arbitrarily* belief-dependent without losing its function.  
      *   **Why:** Perception's core function is to provide a (generally) accurate guide to the external world. Wholesale CP risks solipsism.

  12. **Immunity to Disbelief:**  
      *   **Requirement:** Genuine perceptual effects (like illusions) persist even when you *know* they are illusions and try to see veridically. CP effects, if real, should similarly resist "cognitive correction."  
      *   **Why:** Demonstrates the autonomy and mandatory nature of perceptual processing. Müller-Lyer is the paradigm case.

  ---

  ### **IV. Your Extra Demand: Report-Free Cases**
  *   **Requirement:** A *comprehensive* theory of perception *should* ideally handle these cases (blindsight, animals, AI). A test *aiming to settle the core human claim* can *potentially* ignore them initially, **but**:
      *   **Must Handle:** Blindsight (highlights dissociation between phenomenal experience and unconscious processing relevant to CP mechanisms). Animals (if CP exists, why wouldn't it in similar mammalian vision?).
      *   **May Ignore (Initially):** Image Classifiers (controversial analogy; "perception" vs. "inference" in AI is disputed; "belief" is poorly defined here).
  *   **Is it a Desideratum or Prejudice?** It's a **strong, legitimate desideratum for a *theory***, but potentially **negotiable for a specific *test*** focused on the human phenomenal claim. Ignoring it entirely risks an anthropocentric or overly introspection-based theory. A robust theory *must* eventually account for perception without report.

  ---

  ### **V. Conflicts & Tensions**
  *   **World Contact (11) vs. Strong CP:** How can perception be both *cognitively penetrable* (potentially distorting) and reliably provide *world contact*? Resolving this requires CP to be limited, perhaps only modulating early processing within sensory constraints, not overriding it.
  *   **Immunity to Disbelief (12) vs. Putative CP Effects:** If CP effects (like the slope appearing steeper) *could* be cognitively overridden ("I know it's not *really* steeper, so now it looks normal"), it strongly suggests response bias, not genuine CP. Genuine CP should be as stubborn as Müller-Lyer.
  *   **Speed (10) & Report-Free Cases (IV) vs. Introspection:** Reliance on first-person report conflicts with speed (too fast for introspection) and report-free cases. Any test *must* use indirect behavioral/neural measures.

  ---

  ### **VI. Commitments: Critical Assessment**
  1.  **Single Most Important Requirement for Knocking Out Theories:**  
      **Immunity to Disbelief (12).** If a purported CP effect vanishes when the subject knows the truth and tries to see veridically (e.g., "knowing the slope isn't steeper makes it *look* normal again"), it's almost certainly *not* CP but post-perceptual judgment or bias. Müller-Lyer sets the gold standard for perceptual autonomy. A theory failing this fails the core phenomenon.

  2.  **Which Requirement is Likely Your Prejudice?**  
      The **strong insistence on "literally seeing differently" needing a change in *phenomenal character* (e.g., color, shape)** embedded in distinctions like CP vs. Attention (6) and CP vs. Learning to Notice (9). Opponents might argue that enhanced recognition/discrimination *is* "seeing differently" functionally, even if phenomenology is unchanged. Your framing prioritizes raw feels over functional content, which is a philosophical stance (though common in the debate). This is negotiable depending on one's definition of "seeing."

  3.  **Where I'm Least Sure:**  
      **Distinguishing genuine early top-down modulation (potential CP) from very fast post-perceptual processing / attentional selection (6 & 9)** using behavioral/neural data alone. The neural boundary between "perception" and "cognition" is fuzzy. Does feedback to V1/V2 count? Does rapid recognition involve changing perception or just accessing it? This is the empirical and conceptual battleground.

  ---

  This framework forces any test/theory to confront the strongest counterexamples (Müller-Lyer), the most plausible alternatives (attention/bias), the core functional constraints of perception (speed, world contact, immunity), and the challenge of non-report cases. A theory satisfying all these *can* settle the ordinary claim. Few existing proposals do.
