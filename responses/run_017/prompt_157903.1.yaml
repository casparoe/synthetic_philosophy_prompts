  Okay, let me tackle this user's query. They're a high school senior in a government seminar debating whether voters are morally required to support the lesser evil. Their classmate ended the discussion with "if you don't vote, you can't complain," and now the user wants to dissect that slogan. 

  First, I need to unpack the slogan's possible meanings. The user already identified key variables: "complain," "can't," "vote," and "you." They want a menu of interpretations, from trivial to radical, each assessed for plausibility and moral weight. 

  Starting with the trivial interpretations. The procedural loss reading seems straightforward—if you skip voting, you've missed the formal channel to influence the outcome. But as the user noted, this doesn’t address moral standing. Then there's the epistemic angle: non-voters might lack firsthand experience, but that feels weak since you don’t need to vote to understand politics. 

  Moving to substantive claims. Causality is tricky—does a single vote really swing elections? Probably not, making this implausible. Moral responsibility is more interesting. If voting is a duty, abstaining could mean sharing blame for bad outcomes. But this assumes voting is obligatory, which is contentious. The hypocrisy angle is stronger; complaining after opting out seems inconsistent. 

  Radical interpretations like forfeiting standing or taint-by-association are more philosophical. The idea that participation implicates you in the system is profound but controversial. It suggests that abstaining doesn’t grant purity, which directly addresses the user's concern about moral cleanliness. 

  The user’s core question is whether any reading supports the idea that principled abstainers aren’t morally cleaner than lesser-evil voters. The hypocrisy and taint arguments hit this best. If you don’t vote, complaining might be hypocritical because you avoided your civic duty. The taint argument goes further, saying that in a democracy, everyone is complicit, voter or not. 

  Regarding minor-party voters: if "vote" means any ballot cast, they can complain. But the lesser-evil argument might still criticize them for not preventing the worst outcome. This ties back to moral responsibility. 

  The user also asked about dependencies between readings. For example, accepting moral taint might imply shared responsibility, but not necessarily causality. Each interpretation can stand alone, though some overlap. 

  I should note where philosophy disagrees. The duty to vote is hotly debated. The taint argument is radical and not universally accepted. The user needs to know these are contested, not settled. 

  Finally, the slogan’s vagueness: it’s more a rhetorical tool than a precise claim. Its power comes from bundling multiple ideas. The user’s skepticism is valid—it dissolves under scrutiny. But for their seminar, focusing on hypocrisy and moral taint best addresses the lesser-evil dilemma.
answer: |-
  Here's a dissection of "If you don't vote, you can't complain," organized as requested. I'll provide distinct theses ranging from trivial to radical, analyze each, and directly address your core concern about moral "cleanliness." I'll flag contested claims and avoid false consensus.

  **Key Distinctions Used:**
  - **Complain:** (1) Express disapproval; (2) Assign blame; (3) Demand remedy; (4) Claim moral standing to judge.
  - **Can't:** (A) Procedural disqualification; (B) Hypocrisy/insincerity; (C) Causal responsibility; (D) Lack of epistemic/moral standing.
  - **Vote:** (X) Cast a ballot for a viable candidate; (Y) Cast any valid ballot; (Z) Be eligible/participate minimally.
  - **You:** Applies to eligible voters with meaningful opportunity.

  ---

  ### The Menu of Theses

  1.  **Trivial/Procedural Loss: "You forfeited the official channel for formal grievance."**
      - **What it says:** Voting is the designated mechanism to influence outcomes and register preferences. Abstaining means you didn't use the primary tool citizens have, weakening any *formal* claim for redress through the system.
      - **Weight:** "Can't" (A: Procedural), "Vote" (Y: Any ballot).
      - **Plausibility:** **Plausible but trivial.** Systems often require participation to access certain remedies (e.g., contesting an election). It doesn't touch *moral* standing for *informal* complaint.
      - **Nature:** Administrative platitude.
      - **Confidence:** Firm. Uncontroversial as a statement about formal mechanisms.

  2.  **Epistemic Weakening: "You lack crucial firsthand experience to judge the choice fairly."**
      - **What it says:** The act of researching candidates and confronting the ballot box provides unique insight. Abstainers may lack the context or commitment to evaluate the winner's flaws *as acutely* as those who engaged directly.
      - **Weight:** "Can't" (D: Epistemic standing), "Complain" (1: Express disapproval).
      - **Plausibility:** **Weak/Contested.** Many informed abstainers research deeply; many voters choose blindly. Voting doesn't guarantee wisdom; abstention doesn't guarantee ignorance.
      - **Nature:** Contentious empirical claim.
      - **Confidence:** Genuinely contested. Philosophers disagree on whether participation confers unique epistemic authority.

  3.  **Causal Responsibility (Naive): "Your abstention *caused* the bad outcome."**
      - **What it says:** If you *could* have voted for the winner's opponent and your vote would have changed the result, your abstention is a *but-for cause* of the bad outcome. Therefore, you share blame.
      - **Weight:** "Can't" (C: Causal responsibility), "Vote" (X: Viable candidate).
      - **Plausibility:** **Straightforwardly False** in mass elections. A single vote almost never changes the outcome. Probability of causal impact is vanishingly small.
      - **Nature:** Empirically false claim (outside vanishingly rare cases).
      - **Confidence:** Firm rejection.

  4.  **Hypocrisy/Consistency: "Complaining after abstaining reveals insincerity or inconsistency."**
      - **What it says:** If you *truly* cared enough about the outcome to complain, you would have taken the minimal, low-cost step of voting to try to prevent it. Complaining without acting is hypocritical or demonstrates unseriousness.
      - **Weight:** "Can't" (B: Hypocrisy), "Complain" (all acts), "Vote" (Y/X: Any/Viable).
      - **Plausibility:** **Moderately Plausible & Contentious.** Depends on the *reason* for abstention. Principled refusal (e.g., both candidates endorse evil policy X) may not be hypocritical. Laziness or apathy might be.
      - **Nature:** Contentious moral/psychological claim (hypocrisy norms).
      - **Confidence:** Genuinely contested. Philosophers debate the "cheap talk" objection and sincerity requirements for complaint.

  5.  **Moral Responsibility (Collective): "You shirked your minimal civic duty, sharing blame for the outcome."**
      - **What it says:** Voting is a basic duty of citizenship in a democracy. Abstaining is a failure of this duty. Citizens collectively bear responsibility for electoral outcomes; those who fail their duty share the blame for bad results caused by the electorate.
      - **Weight:** "Can't" (C/D: Moral responsibility/lack standing to blame), "Complain" (2: Assign blame / 4: Moral standing), "Vote" (X: Viable candidate), "You" (Eligible).
      - **Plausibility:** **Contentious.** Requires accepting a strong duty to vote (itself debated) *and* collective responsibility for electoral outcomes *and* that abstention = dereliction. Rejected by those viewing abstention as a legitimate form of protest or non-endorsement.
      - **Nature:** Highly contentious moral/political claim.
      - **Confidence:** Core of major philosophical/political disagreement. Defended by civic republicans (e.g., Pettit), contested by liberals (e.g., Brennan - who argues against a duty to vote) and anarchists.

  6.  **Forfeiture of Standing to Blame: "By opting out, you waived your right to condemn those who participated."**
      - **What it says:** Engaging in the process grants you standing to criticize its results. Abstaining is like refusing to play a game; you lose the moral authority to criticize the players or the outcome. Your hands are *too clean* to judge the dirty choices of participants.
      - **Weight:** "Can't" (D: Moral standing), "Complain" (2: Assign blame / 4: Moral standing), "Vote" (Y: Any ballot).
      - **Plausibility:** **Contentious.** Similar to #5 but focuses on standing rather than direct blame. Appeals to norms of participation. Challenged by: Can outsiders fairly judge? Does non-participation really clean your hands?
      - **Nature:** Contentious moral claim.
      - **Confidence:** Genuinely contested. Related to debates about "dirty hands" and bystander ethics.

  7.  **Radical/Moral Taint (Systemic): "Non-voters are still complicit; abstention doesn't cleanse you."**
      - **What it says:** Living under *any* government makes you complicit in its actions to some degree. Voting is the minimal act of *negotiating* that complicity. Abstaining is a form of denial – you are *still* implicated in the bad outcome but refused the chance to marginally mitigate it. You are *more* tainted, not less, because you refused your tiny share of agency. Complaining is thus self-exculpatory hypocrisy.
      - **Weight:** "Can't" (B/C/D: Hypocrisy/Responsibility/Lack Standing), "Complain" (2/3/4: Blame/Demand/Standing), "Vote" (X: Viable candidate - to mitigate).
      - **Plausibility:** **Radical & Highly Contentious.** Draws on deep theories of political obligation, complicity, and agency within systems. Rejects the "clean hands" ideal of abstention.
      - **Nature:** Profoundly contentious philosophical claim.
      - **Confidence:** Genuinely contested. Associated with critical theory, some consequentialists, critics of purism. Opposed by those emphasizing individual moral integrity over systemic effects.

  ---

  **Addressing Your Core Concern: Moral Cleanliness of Abstainer vs. Lesser-Evil Voter**

  *   **Which readings challenge the "moral cleanliness" of the abstainer?** Crucially, #5 (Moral Responsibility/Collective Blame), #6 (Forfeiture of Standing), and #7 (Radical Complicity/Moral Taint) directly attack the idea that abstention keeps one "clean."
  *   **How they challenge it:**
      *   **#5:** Says abstainers *share the blame* for the bad outcome due to dereliction of duty. They are morally *dirtier* than the lesser-evil voter who fulfilled their duty and tried to minimize harm. (Lesser-evil voter acted responsibly; abstainer shirked).
      *   **#6:** Says abstainers lack the *standing* to claim moral high ground. Their hands aren't "clean"; they are *irrelevant*. The lesser-evil voter, by participating, has the standing to critique the process and outcome. (Abstainer's "cleanliness" is isolation, not virtue).
      *   **#7:** Says abstainers are *more complicit* or *differently* (and perhaps *more*) tainted. They bear the guilt of the outcome *without* having taken the responsible step to lessen it. The lesser-evil voter is less tainted because they actively tried to reduce harm. (Abstainer's "cleanliness" is self-deception; lesser-evil voter made a responsible, if unpleasant, choice).

  **Regarding Minor-Party Voters:** Most readings (#1, #2, #4, #5, #6, #7) apply similarly if "Vote" = Cast any ballot (Y). They *did* participate. However:
  *   **#3 (Causal):** Still false.
  *   **#5/#7 (Blame/Taint):** If the minor-party vote was effectively non-viable and helped the *worst* candidate win (spoiler effect), proponents of these views *might* argue the minor-party voter shares *more* blame than the abstainer or lesser-evil voter for *enabling* the worst outcome. This is highly contentious. The lesser-evil voter would argue the minor-party voter failed their duty to prevent the greater evil.

  **Dependencies Between Readings:**
  *   #3 (Causal) is largely independent and false.
  *   #1 (Procedural) is independent but trivial.
  *   #2 (Epistemic) is largely independent and weak.
  *   #4 (Hypocrisy) can stand alone but shares ground with #5/#6/#7 regarding expectations of action.
  *   #5 (Collective Duty/Blame) often underpins #6 (Forfeiture of Standing). If you have a duty to participate, failing it might forfeit standing.
  *   #7 (Radical Complicity) is the strongest and most foundational challenge to "clean hands." It potentially *encompasses* #5 and #6. If you're always complicit, then not acting to mitigate *is* a form of blameworthy failure (#5) and refusing to participate doesn't grant you special standing to condemn (#6), it makes your position *worse*.

  **Confidence & Contestedness:**
  *   Firm Rejection: #3 (Causal Responsibility - Naive).
  *   Firm but Trivial: #1 (Procedural Loss).
  *   Weak/Contested: #2 (Epistemic Weakening), #4 (Hypocrisy/Consistency - depends heavily on context).
  *   **Genuinely Contested (Core Philosophical Disagreements):** #5 (Moral Responsibility/Duty), #6 (Forfeiture of Standing), #7 (Radical Complicity/Moral Taint). These represent the heart of the debate about political obligation, dirty hands, and the ethics of participation. There is no philosophical consensus.

  **On the Slogan's Nature:**
  The slogan is **primarily a rhetorical and moral claim, not an analytical one.** Its power comes precisely from its **vagueness and ability to bundle multiple ideas** (#4 Hypocrisy + #5 Duty/Blame + hints of #6/7 Standing/Complicity). Attempting to isolate a single "real meaning" often *does* cause it to dissolve, as you observed. Its function in your seminar was likely to invoke a sense of civic duty (#5), hypocritical inaction (#4), and the forfeiture of the right to whine (#6) – all rolled into one punchy line. It's more etiquette-*adjacent* (invoking norms of participation and complaint) than pure etiquette, as it makes substantive claims about responsibility and standing.

  **Conclusion for Your Seminar:** The readings that most directly challenge the "moral cleanliness" of the principled abstainer compared to the lesser-evil voter are **#5 (Collective Duty/Blame), #6 (Forfeiture of Standing), and #7 (Radical Complicity).** These are the substantive and radical interpretations. However, **all are highly contentious philosophical claims**, not settled truths. Your classmate's slogan successfully invoked these ideas but did not prove them. The principled abstainer can counter by rejecting the duty to vote (#5), arguing their protest *is* a form of responsible action preserving integrity (against #6), or rejecting the premise of unavoidable complicity requiring negotiation via voting (#7). The debate remains wide open.
