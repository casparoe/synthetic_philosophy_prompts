answer: |-
  ### Headline Credence
  **25%** credence that at \(N = 25\), \(q = 0.2\), and \(\rho = 0.1\), majority vote over the cheap AI panel has higher expected accuracy than the single senior reviewer (0.85).

  ### Decomposition
  1. **Credence that the 0.62 competence estimate survives adaptation to the panel rule: 30%**  
     *Justification:* Adversarial adaptation by the item producer is likely to reduce individual accuracy (e.g., by exploiting shared AI weaknesses), but there's a 30% chance the estimate holds due to robustness in training or constraints on adaptation.

  2. **Credence that panel errors decompose as stipulated (shared cause + residual correlation): 70%**  
     *Justification:* The model is theoretically sound and commonly used, but real-world dependencies may deviate (e.g., higher-order correlations or unmodeled interactions), leaving 30% uncertainty.

  3. **Credence that correctness is determinate enough for accuracy to be the right currency: 80%**  
     *Justification:* While items are contested, accuracy is a reasonable proxy 80% of the time; the other 20% reflects ambiguity where "rightness" is subjective or context-dependent.

  4. **Effective jury size penalty: 7.35**  
     *Justification:* With \(N = 25\) and \(\rho = 0.1\), effective size is \(N / [1 + (N-1)\rho] = 25 / [1 + 24 \times 0.1] = 25 / 3.4 \approx 7.35\), modeling residual correlation's independence reduction.

  ### Combining to 25%
  - Base model (using your parameters) gives panel accuracy of **~0.60** (details below), below the senior's 0.85.  
  - Credences break down as:  
    - **15% chance** from decomposition failure: 30% credence model is wrong × 50% chance true correlation is low enough to make the panel better (e.g., near independence boosts accuracy to ~0.89).  
    - **12% chance** from correctness indeterminacy: 20% credence it’s ill-defined × 60% chance the panel better handles ambiguity (e.g., averaging reduces subjectivity).  
    - **Overlap adjustment**: Subtract 2% for joint occurrence (assuming independence), giving \(0.15 + 0.12 - 0.02 = 0.25\).  
  - Competence survival (30%) doesn't directly help, as 0.62 is too low to beat 0.85 even under optimistic assumptions (requires >0.75).

  *Base model calculation for panel accuracy*:  
  - Shared cause (\(q = 0.2\)): Panel wrong on these items (worst-case assumption).  
  - No shared cause (\(1 - q = 0.8\)): Use effective jury size 7.35.  
  - Majority accuracy for 7.35 independent reviewers at \(p = 0.62\):  
    Mean = \(7.35 \times 0.62 = 4.557\), SD = \(\sqrt{7.35 \times 0.62 \times 0.38} \approx 1.316\).  
    Threshold = \(7.35 / 2 = 3.675\), Z = \((3.675 - 4.557) / 1.316 \approx -0.670\), P(correct) \(\approx 0.749\).  
  - Overall accuracy: \(0.8 \times 0.749 + 0.2 \times 0 = 0.599\).

  ### Sensitivity and Empirical Work
  - **Most sensitive term: Decomposition model (70% credence)**.  
    - Why: A 10% change in credence (e.g., 70% → 60%) alters headline by ~5% (vs. ~3% for other terms). Correlation structure dominates variance.  
  - **One week of work: Measure residual correlation (\(\rho\))**.  
    - Why: Reducing uncertainty in \(\rho\) (e.g., via controlled experiments on diverse items) has the highest information gain. If \(\rho < 0.05\), panel accuracy could jump to ~0.76, making it competitive.  
  - **Stop adding reviewers at \(N = 10\)**.  
    - Why: Effective size asymptotes at \(1/\rho = 10\) for \(\rho = 0.1\). Beyond \(N = 10\) (effective ~9.17), returns diminish (e.g., \(N = 25\) → effective 7.35, accuracy ~0.60). Spend marginal budget on supervision to boost \(p\) instead (e.g., better training for fewer reviewers).
