  Below is a structured analysis of the requirements for a solution to Harnad's symbol grounding problem, tailored to your specific goal: determining whether a system that has never perceived the world (but talks as if it has) can be trusted when reporting on it. This focuses on functional trust (e.g., reliability of reports) rather than phenomenal consciousness ("what it's like" to be the system). I'll present a list of requirements with justifications, apply them to your two cases (borrowed grounding and severed channel), identify conflicting requirements, and address your questions about which requirement rules out the most theories and which might be camp-specific prejudices.

  ### Core Requirements for a Trustworthy Grounded System
  A solution must ensure that the system's reports about the world are reliable, meaning they accurately and non-accidentally reflect the state of the world. The requirements below are derived from the need to prevent "empty" symbols (e.g., a system that talks about "red" without any real-world connection) and to justify trust. Each requirement includes:
  - **The requirement itself**: What the solution must deliver.
  - **The case for it**: Why it's necessary for trust, based on philosophical and functional considerations.
  - **How it handles your cases**: Predictions for borrowed grounding, purely text-trained models (e.g., LLMs), and robotic systems with direct perception.

  #### Requirement List
  1. **Covariation with the World**  
     - **Requirement**: The system's internal state (e.g., its "red" symbol) must covary reliably with the relevant state of the world (e.g., the presence of red objects). Covariation means the state changes systematically in response to changes in the world.  
     - **Case for it**: Trust requires that reports track the world's state; if the symbol doesn't covary, reports could be arbitrary or fixed, making them untrustworthy. This is a minimal condition for reference.  
     - **Handles cases**:  
       - Borrowed grounding: **Satisfied** (covaries with red via the human's brain activity).  
       - Text-trained model: **Not satisfied** (covaries only with text patterns, not the world).  
       - Robot with camera: **Satisfied** (covaries directly via sensors).  
       - Severed channel: **Not satisfied** (no covariation; simulator is decoupled from the world).

  2. **Causal Connection to the World**  
     - **Requirement**: There must be a causal chain from the world state to the system's symbol (e.g., red light → sensors → neural processing → "red" state).  
     - **Case for it**: Covariation alone could be accidental (e.g., a clock covaries with time but doesn't "report" it). Causation ensures the world state is the reason for the symbol, making reports non-arbitrary and grounded in reality.  
     - **Handles cases**:  
       - Borrowed grounding: **Satisfied** (causal chain: red object → human's vision → interface → system).  
       - Text-trained model: **Not satisfied** (causes are text inputs, not world states).  
       - Robot: **Satisfied** (direct causal path).  
       - Severed channel: **Not satisfied** (cause is the simulator, not the world).

  3. **Behavioral Competence**  
     - **Requirement**: The system must demonstrate the ability to use the symbol appropriately in behavior, including reports, inferences, and actions (e.g., correctly identifying red objects when asked).  
     - **Case for it**: Trust requires testability; we can only assess reliability from external behavior (e.g., responses to queries). Without this, we have no evidence for trust.  
     - **Handles cases**:  
       - Borrowed grounding: **Satisfied** (if designed to act on inputs, it behaves appropriately).  
       - Text-trained model: **Partially satisfied** (may pass verbal tests but fail sensorimotor tasks).  
       - Robot: **Satisfied** (interacts with the world).  
       - Severed channel: **Satisfied** (behaves identically to a connected robot).

  4. **Non-Derivative Grounding**  
     - **Requirement**: The symbol's grounding must not depend entirely on another system's grounding (e.g., it cannot be "borrowed"). The system must have its own capacity to ground symbols.  
     - **Case for it**: Trust in the system's reports requires independence; if grounding is derivative, reliability depends on an external system (e.g., the human), making the system unreliable if that source is compromised.  
     - **Handles cases**:  
       - Borrowed grounding: **Not satisfied** (relies on the human's grounding).  
       - Text-trained model: **Not satisfied** (relies on human-generated text).  
       - Robot: **Satisfied** (grounds symbols directly).  
       - Severed channel: **Satisfied** (if originally grounded, it had its own capacity).

  5. **Current Connection**  
     - **Requirement**: The causal connection to the world must be active and operational at the time of reporting (e.g., sensors must be functional and receiving real-time input).  
     - **Case for it**: Trust requires reports to reflect the current state; a historical connection (e.g., from training) doesn't ensure present accuracy (e.g., the world may change).  
     - **Handles cases**:  
       - Borrowed grounding: **Satisfied** (if human is actively looking).  
       - Text-trained model: **Not satisfied** (no real-time input).  
       - Robot: **Satisfied** (sensors active).  
       - Severed channel: **Not satisfied** (sensors disconnected; simulator may not reflect current world).

  6. **Learning from Direct Interaction**  
     - **Requirement**: The system must have acquired its symbols through direct sensorimotor interaction with the world (e.g., learning "red" by seeing red objects).  
     - **Case for it**: Trust requires that the system can generalize and adapt; symbols learned indirectly (e.g., from text) may not be robust to novel situations.  
     - **Handles cases**:  
       - Borrowed grounding: **Not satisfied** (learned from human's brain data, not direct interaction).  
       - Text-trained model: **Not satisfied** (learned from symbols, not the world).  
       - Robot: **Satisfied** (learned via sensors).  
       - Severed channel: **Satisfied** (if it learned directly before severing).

  ### Summary of Predictions for Each System
  | System                | Covariation | Causal Connection | Behavioral Competence | Non-Derivative | Current Connection | Learning from Interaction | Overall Trustworthy? |
  |-----------------------|-------------|-------------------|------------------------|----------------|---------------------|---------------------------|----------------------|
  | Borrowed grounding    | Yes         | Yes               | Yes                    | No             | Yes                 | No                        | No (fails non-derivative and learning) |
  | Purely text-trained   | No          | No                | Partial (verbal only)  | No             | No                  | No                        | No (fails most) |
  | Robot with camera     | Yes         | Yes               | Yes                    | Yes            | Yes                 | Yes                       | Yes |
  | Severed channel       | No          | No                | Yes                    | Yes            | No                  | Yes                       | No (fails covariation, causation, and current connection) |

  ### Conflicting Requirements: The Core Tension
  Your suspicion is correct: the requirements **"grounding must be testable from outside"** (captured by *Behavioral Competence*) and **"grounding isn't constitutively a matter of behavior"** (captured by the need for *Causal Connection* and *Current Connection*) **cannot both be fully satisfied in practice**. This is the primary conflict, and it arises from the **severed channel case**:
  - **Why they conflict**: 
    - Behavioral competence is necessary for testability (we can't trust what we can't assess). But behavior alone is insufficient to establish grounding, as the severed channel shows: it passes all behavioral tests but lacks a causal connection to the world. Thus, grounding cannot be reduced to behavior (non-behavioral elements like causation are essential for reliability).
    - This creates a dilemma: If we insist on testability via behavior, we might accept systems like the severed channel as grounded (but they aren't trustworthy). If we insist on non-behavioral requirements (e.g., causal connection), we lose testability because we can't verify causation without invasive methods (e.g., checking hardware).
  - **How the cases highlight this**: 
    - The severed channel satisfies behavioral competence but fails covariation/causation, showing that behavior doesn't guarantee grounding.
    - Borrowed grounding satisfies testability and covariation/causation but fails non-derivative grounding, showing that even "good" behavior may rely on external factors that undermine trust.

  ### Additional Tensions in the Requirements
  - **Covariation vs. Non-Derivative Grounding**: Borrowed grounding shows covariation but fails non-derivative grounding. If we prioritize covariation for trust, borrowed grounding might be acceptable, but non-derivative grounding rules it out. This reflects a camp split: functionalists may accept covariation alone, while embodied cognition proponents demand non-derivative grounding.
  - **Current Connection vs. Learning History**: Severed channel satisfies learning history but fails current connection. Trust requires both, but they can come apart if a system is disconnected after learning. This isn't a direct conflict, but it shows that historical grounding isn't sufficient for current trust.

  ### Which Requirement Rules Out the Most Theories?
  - **Non-Derivative Grounding** rules out the most candidate theories. It excludes:
    - Borrowed grounding systems (as in your case).
    - Purely text-trained models (e.g., LLMs, which rely on human-generated data).
    - Many AI systems that use pre-trained embeddings or knowledge bases (which are derivative of human grounding).
    
    This requirement is stringent because it demands that the system be self-contained in its grounding, which few AI approaches satisfy. It aligns with Harnad's emphasis on first-hand sensorimotor experience.

  ### Which Requirements Are One Camp's Prejudice?
  - **Non-Derivative Grounding** and **Learning from Direct Interaction** are often seen as prejudices of the **embodied/situated cognition camp** (e.g., Harnad, Varela, Brooks). Critics (e.g., functionalists like Fodor or proponents of statistical AI) argue they are too restrictive:
    - **Why prejudiced?** Functionalists claim that trust can be achieved through reliable covariation and behavior alone, regardless of how grounding is acquired (e.g., borrowed grounding might be trustworthy if the human is reliable). They see non-derivative and learning requirements as overemphasizing "biological" grounding.
    - **Counter**: Your borrowed grounding case exposes the risk—trust fails if the human is unavailable or biased. For functional trust, non-derivative grounding may be essential for robustness.
    
  - **Behavioral Competence as Sufficient for Grounding** is a prejudice of **behaviorist/functionalist camps** (e.g., Dennett's intentional stance). It ignores the severed channel problem, where behavior dissociates from causation. Harnadians reject this as insufficient for true grounding.

  ### Conclusion: A Minimal Requirement Set for Trust
  For your reading group, a solution must deliver:
  1. **Covariation and causal connection** (to ensure reports track the world non-accidentally).
  2. **Behavioral competence** (to allow external assessment).
  3. **Non-derivative grounding** (to ensure independence from external systems).
  4. **Current connection** (to guarantee reports reflect the present state).

  However, the conflict between testability (behavioral competence) and non-behavioral requirements (causation/current connection) is unresolvable without additional constraints (e.g., physical inspection). This tension suggests that for trust, we might need to:
  - Accept that behavioral tests are necessary but insufficient (requiring additional evidence, e.g., system design).
  - Prioritize non-derivative and current connection for robustness, even if they limit testability.

  This framework should help your group evaluate theories. For instance, Harnad's original work would emphasize non-derivative grounding and learning from interaction, while functionalist accounts might reject these as prejudices. The severed channel case is particularly powerful for exposing the behavior/causation divide.
