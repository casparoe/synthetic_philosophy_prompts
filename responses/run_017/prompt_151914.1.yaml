prompt: |-
  I'm one of five people on a committee rewriting the allocation policy for a regional health system's annual exceptional-funding budget: a single pool of money, no realistic chance of topping it up, and a claimant list whose stakes differ as much in shape as in size — one patient facing ten years of a disabling condition, ten patients facing one year each, a thousand patients each carrying a small probability of a large loss, and a prevention programme that takes a trivial amount from everyone for a large gain to a few. Every time we work a case through, someone quietly switches framework halfway: complaints get added like quantities, then someone insists the numbers are irrelevant, then someone divides a single person's stake into parts and it suddenly weighs more. So before I read any more of the contractualist literature on whether and how the numbers count, I want the specification I should be reading it against. Write me the desiderata for a theory of interpersonal aggregation: what such a theory has to deliver to be good enough for this job — good enough, that is, to be operated by a committee that must actually reach a decision in the cases that arise, that must give the same verdict when the same situation is described at different levels of grain or carved into different numbers of claimants, and that must be able to offer each losing claimant a justification rather than only a total.

  Here is my rough start, which I'd like you to correct, collapse, reorder, or discard rather than just endorse. (i) No weight from re-description: a single patient's stake must not gain moral weight merely by being described as several harms, and two claimants must not collapse into one merely because they share a bank account, a decision procedure, and all their aims — so the theory needs an account of what makes stakes separate, not just an insistence that they are. (ii) It has to say whether intrapersonal aggregation over a life runs by the same algebra as interpersonal aggregation across lives, with the ten-years-for-one versus one-year-for-ten case as the test. (iii) It has to handle very large numbers of very small costs without either licensing anything at all or licensing nothing, and say whether the trade-off has a limit. (iv) It has to say whether it aggregates probabilities or outcomes: a thousand people each with a one-in-a-thousand risk, versus one person certain to suffer. (v) It has to have something to say when the stakes tie and the good is indivisible — lottery, rotation, or silence. (vi) It has to say whether merely possible future claimants enter the sum at all. (vii) It has to avoid making the worse-off-anyway case look better, or explain why that appearance is benign. (viii) It has to tell us whether aggregation belongs in the moral weight of reasons or only in the procedure we adopt, since my committee may be able to use a summing rule even if nothing morally speaking sums. For each requirement give the case or consideration behind it, mark whether it is non-negotiable for a body like mine or merely the preference of one camp, flag any subset you suspect cannot be jointly satisfied, and name the single requirement that does the most work in excluding otherwise popular candidates. If you think my framing has already smuggled in a contested commitment — for instance by demanding determinacy, or by asking for a justification addressable to each individual loser — say which, and how the list would look without it.

  Please skip reading suggestions entirely; I have no library access from here and can't follow them up. Please also mark your confidence: separate what is settled among people who work on this from what is genuinely contested, and don't present the contested part as the consensus. If you have room, add four or five lines scoring Scanlon-style reasonable-rejectability, total-utilitarian summing, prioritarian weighting, and a Taurek-style refusal to aggregate at all — but keep the weight on the criteria and their motivating cases, which is the part I can't do for myself.
reasoning: |-
  Okay, the user is on a committee rewriting a health funding policy and needs a robust theory for allocating a fixed budget. They've drafted desiderata but want them refined. Let me start by understanding their core issues. They mentioned cases like one patient with ten years of suffering versus ten patients with one year each, and problems with inconsistent frameworks during discussions.

  First, I need to address each point in their list. For (i) "No weight from re-description," the key is that stakes shouldn't change based on description. This is non-negotiable. The hard part is defining what makes stakes separate—probably tied to individual lives or distinct instances of harm.

  Next, (ii) intrapersonal vs. interpersonal aggregation. The ten-years vs. ten-patients case tests this. The committee needs consistency here. This is contested; utilitarians might equate them, while others like Scanlon might not.

  For (iii) large numbers of small costs, think of the prevention program. The theory must avoid absurd extremes. This is non-negotiable but tricky. Parfit's aggregation problem shows it's contested.

  (iv) Probabilities vs. outcomes. A thousand people with 0.001 risk vs. one certain case. Should we aggregate probabilities or wait for outcomes? Non-negotiable but divided between consequentialists and deontologists.

  (v) Tied stakes and indivisible goods. How to decide when aggregation doesn't break ties? Lottery or rotation? Non-negotiable but procedural.

  (vi) Future claimants. Should we include probabilistic future patients? Contested, especially in prevention. Non-negotiable for completeness.

  (vii) Worse-off-anyway. Avoid double-counting disadvantage. This might involve prioritarian adjustments. Non-negotiable to prevent unfairness.

  (viii) Where aggregation belongs—in moral weight or procedure? If only procedural, justification to losers is harder. Contested and affects how the committee operates.

  Now, conflicts: Separateness of persons (i, ii, viii) vs. aggregation. Also, determinism might conflict with probabilistic cases (iv, vi). Justification to each loser might clash with maximizing approaches.

  Key non-negotiable: Invariance under redescription (i) and justifiability to losers. The latter excludes strict utilitarianism and Taurek, but Scanlon might handle it better.

  Assessing theories: Scanlon allows aggregation conditionally, offers direct justifications. Utilitarianism sums but struggles with individual justification. Prioritarianism weights the worst-off but might not solve aggregation. Taurek avoids aggregation entirely, which isn't practical for the committee.

  The user might have smuggled in the need for individual justification and determinacy. Without that, the list would focus more on procedural rules, but the committee likely needs to defend decisions to each claimant, so it's probably necessary.

  In summary, refining the desiderata involves clarifying each point's necessity, noting conflicts, and emphasizing justifiability and invariance as critical. The committee needs a theory that balances these while being actionable.
answer: |-
  Here’s a refined set of desiderata for your committee, structured to address practical decision-making under constraints. I’ve reordered, collapsed, and revised your points for clarity, marked non-negotiables (★), flagged conflicts, and noted contested assumptions. Key revisions focus on *operationalizability*, *consistency under redescription*, and *justifiability to losers*—the core challenges in your cases.

  ---

  ### **Desiderata for a Theory of Interpersonal Aggregation**  
  *(Motivating cases in italics)*

  1. **★ Invariance under Redescription**  
     - **What it demands**: Stakes must retain consistent moral weight regardless of how they are described (e.g., one patient’s ten-year suffering ≠ ten one-year sufferings split artificially; shared bank accounts ≠ merged moral claims).  
     - **Case**: *A single patient’s disabling condition described as "ten years of harm" vs. "ten distinct annual harms."*  
     - **Non-negotiable**: Yes—essential for consistent committee decisions.  
     - **Hard part**: Requires a theory to define the "unit of moral concern" (e.g., persons, life-histories, experiences).  

  2. **★ Justifiability to Each Losing Claimant**  
     - **What it demands**: The theory must generate reasons that can be defensibly offered *to each individual* who loses out, not just a "greater good" rationale.  
     - **Case**: *Rejecting a costly treatment for one patient to fund prevention for thousands.*  
     - **Non-negotiable**: Yes—your committee must face claimants directly.  
     - **Excludes**: Pure utilitarianism (which often can’t justify to the loser "why you specifically must sacrifice").  
     - **Contested?**: Yes. Some theories (e.g., strict consequentialism) reject this as a requirement.  

  3. **Handling Scale and Probability**  
     - **What it demands**:  
       - (a) *Large-N small-stakes aggregation*: Must permit trading trivial costs for large gains (e.g., *a prevention program costing pennies per person to save a few lives*) without allowing exploitation (e.g., *"death by a thousand papercuts"*).  
       - (b) *Probabilities vs. outcomes*: Must clarify whether 1,000 people with a 0.1% risk of disability = 1 person certain to suffer it.  
     - **Non-negotiable**: (a) and (b) are essential for your cases.  
     - **Conflict risk**: (a) may clash with desideratum 2 (justifiability).  
     - **Contested?**: (b) is deeply contested (e.g., expected utility vs. ex-post fairness).  

  4. **★ Interpersonal vs. Intrapersonal Consistency**  
     - **What it demands**: The theory must state whether aggregating harms *within one life* (e.g., *ten years of suffering for one person*) uses the same logic as *across lives* (e.g., *one year each for ten people*).  
     - **Case**: *Directly tests if "personhood" changes aggregation rules.*  
     - **Non-negotiable**: Yes—your committee will face this daily.  
     - **Excludes**: Theories that strictly prioritize separateness of persons (e.g., Rawls-inspired views).  

  5. **Tie-Breaking for Indivisible Goods**  
     - **What it demands**: A clear method when aggregated stakes tie (e.g., *lottery, rotation, urgency*).  
     - **Non-negotiable**: Practical necessity for decisions.  
     - **Conflict risk**: May undermine aggregation if ties are frequent.  

  6. **Treatment of Future/Probabilistic Claimants**  
     - **What it demands**: Specify whether *possible* future patients (e.g., *those a prevention program might aid*) count as current claimants.  
     - **Case**: *Funding preventive care vs. immediate life-saving treatment.*  
     - **Non-negotiable**: For completeness—prevention cases force this.  
     - **Contested?**: Yes (e.g., "actual" vs. "possible" persons debates).  

  7. **Avoiding Aggregation Bias Against the Worse-Off**  
     - **What it demands**: The theory must not systematically disadvantage those already badly off (e.g., *denying care to a severely ill patient because many mildly ill patients can be treated*).  
     - **Case**: *Allocating funds to low-stakes/high-volume groups over high-stakes individuals.*  
     - **Non-negotiable**: Moral priority for most committees.  
     - **Contested?**: Partially—utilitarianism is often accused of this.  

  8. **Moral vs. Procedural Aggregation**  
     - **What it demands**: Clarify whether aggregation reflects *moral reality* ("harms sum") or is *merely a practical tool* for decision-making.  
     - **Non-negotiable**: Shapes how the committee justifies its process.  
     - **Contested?**: Highly—e.g., Scanlon (procedural) vs. utilitarianism (moral).  

  ---

  ### **Key Conflicts & Contested Assumptions**  
  - **Smuggled commitments**: Your focus on **determinacy** (requiring unique answers) and **individual justifiability** (desideratum 2) are contested. *Without these*, the list would prioritize procedural efficiency over moral reasoning (e.g., "use cost-effectiveness but apologize to losers").  
  - **Unresolvable tension?**: Desiderata 1 (invariance), 2 (justifiability), and 3a (large-N aggregation) may be incompatible. *Example*: Aggregating tiny gains to deny a lifesaving treatment easily violates 2, but refusing to aggregate violates 3a.  
  - **Most excluding requirement**: **Desideratum 2 (justifiability to losers)**. This rules out:  
    - Naive utilitarianism ("your loss is outweighed by the sum").  
    - Taurek ("no aggregation, no comparison possible").  

  ---

  ### **Quick Theory Assessment**  
  *(Confidence: High on contrasts; low on endorsements—all are contested in practice)*  

  | Theory               | Score (★/5) | Brief Rationale for Your Context |  
  |----------------------|-------------|----------------------------------|  
  | **Scanlonian R-R**   | ★★★★☆       | Rejects aggregation *unless* no reasonable individual could reject the principle. Excels at justifiability (desid. 2), weak on large-N cases (desid. 3a). |  
  | **Total Utilitarian**| ★★☆☆☆       | Sums welfare gains. Handles scale/probabilities (desid. 3) but fails justifiability (desid. 2) and risks bias (desid. 7). |  
  | **Prioritarian**     | ★★★☆☆       | Weights benefits to worse-off. Addresses bias (desid. 7), but vague on redescription (desid. 1) and probabilities (desid. 3b). |  
  | **Taurek (No Agg)**  | ★☆☆☆☆       | Treats all claims as incommensurate. Forces lotteries. Meets justifiability (desid. 2) but collapses with scale (desid. 3a) and prevention cases (desid. 6). |  

  ---

  ### **Bottom Line**  
  Your committee needs a theory that:  
  - **Centers justifiability to individuals** (non-negotiable for legitimacy),  
  - **Defines "irreducible stakes"** (e.g., tied to persons, not descriptions),  
  - **Explicitly bounds aggregation** (e.g., allowing prevention but blocking "papercut" exploitation).  
  The deepest conflict—*aggregating small stakes vs. respecting each life*—has no consensus. Prioritize **transparency in trade-offs** over false precision. I’m 90% confident this framework captures your operational needs; the remaining 10% reflects unresolvable philosophical disputes.
