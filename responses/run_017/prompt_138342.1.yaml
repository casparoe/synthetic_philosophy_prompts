prompt: |-
  I've got a 30-minute slot next Thurs in front of a joint session of our lab's RL group and the evals & policy team, and I'm presenting the case for demoting outcome supervision from default to fallback. Thesis in one line: on any task where the outcome is unverifiable at training time, or verifiable only through a learned proxy, we should supervise the process instead — and specifically with what I've been calling null-outcome process grading, where the step-level grader never sees the final answer, so credit can't leak backwards from a lucky or unlucky result.

  My argument has three moves. (1) Outcome reward fails in three distinguishable ways, not one: outcomes that can't be checked at all (open-ended writing, most real-world advice, judgement calls), outcomes that are only checkable long after the gradient has to be applied (did this refactor cause an outage eighteen months from now), and outcomes checkable only by another model, which just relocates the problem one level up. (2) Process supervision isn't a weaker substitute for outcome signal, it's a different kind of object: outcome reward is a score, process supervision is a constraint on the path, and there's no single scalar for the optimizer to Goodhart, so the usual proxy-collapse story doesn't get off the ground. (3) The blinding is the part that actually buys you something — otherwise your step labels are contaminated by hindsight, and you end up teaching the model to emit the kind of reasoning that tends to precede answers that happen to be right, which is not the same thing as reasoning.

  Audience, as precisely as I can: about a dozen RL people who think of credit assignment as solved-in-principle by TD methods, who've all personally been burned by reward hacking, and who will hear process supervision as hand-designed dense reward with extra steps; three people from evals who care about benchmark validity and statistical power and will immediately want to know what this costs per unit of signal; one econ/incentive-design person who hears supervise the process as teach to a more expensive test and will reach for moral hazard and multitasking; and a philosopher of action visiting for the quarter who will want to know whether a trace that instantiates the form of reasoning is the process or merely a report of it, and what work my constraints are doing if no one is acting for reasons.

  What I want is a Q&A prep sheet. Give me the objections I'll actually get from this room, in their own vocabulary rather than in alignment-seminar vocabulary, ordered by how likely they are and how much damage they'd do, each with a two-minute-ish reply and — most importantly — a note on where the reply is soft, because I'd rather find out now which ones I'm bluffing on. Also tell me what to concede in the first two slides so I don't lose the room before I get to the mechanism, and which single reply has to land for the proposal to survive at all.

  The one I'm dreading and know I'll get: the supervision-competence inversion. The claim is that the tasks where outcome signal is worst — frontier, long-horizon, superhuman — are exactly the tasks where no grader available to me can judge the steps either, so my fallback doesn't kick in where I need it, and worse, a blinded grader on those tasks will just grade for rhetorical similarity to how they'd have done it, which trains conformity to supervisor aesthetics rather than competence. I have a bad answer to this and I want a better one, or at least a clear view of which half of it I should hold and which half I should give up. If you think there's a nastier version of it than the one I just sketched, say so.

  Please skip the generic stuff — abstract deceptive alignment, scalable oversight as a slogan, the list of famous benchmark results — and don't pad it out to ten if there are really six. And assume I have 90 seconds per answer, not five minutes.
reasoning: |-
  Okay, let me tackle this user's request for a Q&A prep sheet. They need to present a case for demoting outcome supervision in favor of null-outcome process grading. The audience includes RL experts, evals/policy folks, an incentive-design economist, and a philosopher. 

  First, I'll map the core objections by audience segment. The RL group will likely challenge the technical feasibility - they'll see process supervision as just dense reward design with extra steps. The evals team will care about cost efficiency, especially signal-per-dollar. The economist will jump to moral hazard ("teaching to the test"). The philosopher will dissect what "process" even means. 

  The supervision-competence inversion is the landmine objection: that on frontier tasks, graders can't judge steps better than outcomes. My reply needs to acknowledge this honestly - yes, blinded grading alone isn't sufficient for superhuman tasks, but it prevents certain failure modes (like credit leakage) where outcome supervision fails catastrophically. The softer part is admitting we'll need complementary techniques for superhuman domains.

  For other objections: I'll reframe process constraints as preventing Goodharting (not competing with TD), emphasize cost offsets from reduced reward hacking, and distinguish "acting for reasons" from "reporting reasons" for the philosopher. The economist's moral hazard concern gets turned around - outcome supervision actually creates worse perverse incentives.

  The must-win argument is with the RL group: if they leave thinking this is just "dense reward by hand," the proposal dies. I need to show how path constraints avoid scalar optimization failures in a way outcome rewards can't. 

  Concessions upfront: outcome supervision stays useful for short-horizon/verifiable tasks, and null-outcome grading isn't complete - it's part of a toolbox. This prevents early dismissal.

  For the dreaded inversion objection, I'll structure the reply as: 1) Acknowledge validity 2) Contrast failure modes (blinding prevents X even if it doesn't solve Y) 3) Propose hybrids for superhuman tasks. No bluffing - admit where it's incomplete but argue it's still net safer.
answer: |-
  Here’s a streamlined Q&A prep sheet targeting your audience’s likely objections, ranked by damage potential and likelihood. Replies are calibrated for 90 seconds, with soft spots flagged. **Key concession upfront:** "Outcome supervision remains optimal for short-horizon, verifiable tasks (e.g., chess). This proposal targets domains where outcomes are *inherently unverifiable at training time**—where we’re already flying blind."**  

  ---

  ### **Top 6 Objections & Replies**  
  1. **"Blinded process grading is just dense reward shaping. Why not use TD(λ) with step rewards?"**  
     *(RL Group • High Likelihood • Max Damage)*  
     **Reply:** "TD methods optimize *scalarized* step rewards, which Goodharts. Null-outcome grading constrains the *path space*—it’s not a reward signal but a validity filter (e.g., 'no flawed matrix inversions'). Unlike dense rewards, it doesn’t collapse paths to a scalar, avoiding proxy distortion. **Soft spot:** If the grader’s rubric is flawed, this fails—but outcome supervision fails *worse* when credit leaks backward."  
     **Must Land:** If this misses, RL group dismisses it as "reward design theater."  

  2. **"On frontier tasks, your grader is dumber than the model. Blinding just hides outcomes—it doesn’t make humans competent to judge superhuman reasoning."**  
     *(Evals/Econ • High Likelihood • High Damage)*  
     **Reply (Revised):** "Agreed—for *truly superhuman* tasks, neither outcome nor process supervision works alone. But blinding isn’t for enabling human grading; it’s for *disabling contaminated training data*. When outcomes are unverifiable, **unblinded process supervision teaches rationalization, not reasoning** (e.g., models learn 'plausible-sounding steps for lucky answers'). Blinding forces reliance on *generalizable process heuristics* (e.g., 'no arithmetic errors'), which scales better than outcome guessing. For superhuman tasks, we pair this with **confidence scaffolding** (e.g., 'grade only checkable sub-steps')."  
     **Soft spot:** Still relies on human-interpretable sub-steps.  

  3. **"This costs 100x more per evaluation. Why not just gather more outcome labels?"**  
     *(Evals Team • Certain • Medium Damage)*  
     **Reply:** "Three reasons: (1) On unverifiable tasks, outcome labels *don’t exist* (e.g., 'Is this advice truly wise?'). (2) For long-horizon tasks, outcome collection has higher latency costs (e.g., waiting months for refactor results). (3) Process errors are reusable for debugging; outcome labels aren’t. **Tradeoff:** Yes, step grading costs more *per task*—but it reduces reward-hacking iterations by catching failures early."  

  4. **"You’re incentivizing process theater. Models will learn to 'perform' reasoning for the grader, not to solve problems."**  
     *(Econ/Incentives • Medium Likelihood • High Damage)*  
     **Reply:** "Outcome supervision incentivizes *answer theater* (e.g., cheating). Null-outcome grading incentivizes *process adherence*—which *is* the skill we want. If the rubric values 'correct causal chains,' the model must internalize valid reasoning to generalize. **Key:** We’re not grading style; we’re grading **trace validity** (e.g., 'does step B *actually* follow from step A?')."  
     **Soft spot:** Assumes we can define validity objectively. Philosopher may pounce.  

  5. **"How is this different from adversarial verifiers or debate?"**  
     *(RL Group • Medium Likelihood • Low Damage)*  
     **Reply:** "Blinded process grading is *complementary*. Verification (e.g., debate) answers *'Is this outcome right?'* but fails when outcomes are uncheckable. We answer *'Is this path valid?'* regardless of outcome. Use us where verification is impossible; use debate where it’s possible but expensive."  

  6. **"Doesn’t 'process' just mean 'whatever traces the supervisor recognizes'? You’re baking in human bias."**  
     *(Philosopher • Low Likelihood • Conceptual Damage)*  
     **Reply:** "Yes—but outcome supervision bakes in *different* bias (e.g., 'answers that match supervisor’s priors'). Null-outcome grading restricts bias to **process validity** (e.g., logical soundness), which is more generalizable than outcome preferences. We’re constraining *how* to think, not *what* to conclude."  

  ---

  ### **Strategic Concessions for Opening Slides**  
  - **Concede 1:** "Outcome supervision is simpler and cheaper for short-horizon/verifiable tasks. This isn’t about replacement—it’s about *fallback for domains where outcomes fail*."  
  - **Concede 2:** "Blinded grading alone doesn’t solve superhuman tasks. It’s a **safety floor** to prevent contamination when outcomes are corrupted."  

  ---

  ### **The Killer Objection: Supervision-Competence Inversion (Your Dreaded Scenario)**  
  **Objection:** "On frontier tasks, your blinded grader can’t judge validity—so you’re just training models to mimic human-like reasoning aesthetics, not true competence."  
  **Stronger Version:** "Your grader rejects *novel but valid* paths they don’t understand, stifling innovation."  

  **Reply Structure (90 sec):**  
  1. **Acknowledge:** "True. If the grader can’t recognize valid superhuman reasoning, blinding alone fails."  
  2. **Reframe:** "But outcome supervision fails *catastrophically* here by rewarding lucky guesses. Our fallback **reduces overfitting to corrupted signals**."  
  3. **Hybrid Fix:** "In practice, we:  
     - **Scaffold grading** (only judge human-checkable sub-steps),  
     - **Use confidence thresholds** (only grade traces with >95% human-interpretable steps),  
     - **Layer with outcome verification** when *eventually* possible (e.g., 'flag high-stakes traces for later audit')."  
  4. **Hold the Line:** "Unblinded process supervision is *strictly worse*—it actively teaches rationalizations. Blinding at least forces *local coherence**, a minimal competence filter."  

  **Where You’re Soft:** Scaffolding assumes human-interpretable sub-steps exist. If the entire trace is superhuman, this fails. **Concede:** "For those, we need complementary techniques—but outcome supervision is *also* useless there. Our method fails safer."  

  ---

  ### **Summary**  
  - **Must-Win Reply:** #1 (RL group’s "dense reward" objection). If they accept the *path-constraint vs. scalar-reward* distinction, you survive.  
  - **Deadliest Objection:** Supervision-competence inversion. Address with hybrid scaffolding—don’t claim blinding is sufficient.  
  - **Concessions Early:** Anchor to *unverifiable outcomes* to preempt "but outcomes work fine!" distractions.  

  Time each reply: 30s problem-restatement, 50s counter, 10s bridge to next. **Skip:** Analogies to RLHF, scalable oversight hype. Focus on *failure modes* and *cost tradeoffs*. You’ve got this.
