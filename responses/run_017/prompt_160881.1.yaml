  Your core struggle is balancing **anti-rationalism** (1) with **majoritarianism** (3,5,7,8). Condorcet methods split the difference: they respect majoritarian pairwise comparisons without imposing a full ordering. For meetings, hold firm on 2—agenda-dependence *is* pathological—but accept that interdependent issues may require package voting (e.g., approval bundles).
