prompt: |-
  I've followed the meta-science reform movement for years — preregistration, registered reports, multi-lab replications, adversarial collaborations, the campaign against p-hacking and the garden of forking paths — and its epistemology keeps pulling in two directions at once. Its rhetoric is falsificationist: preregister a risky prediction, run the test, and if the effect isn't there, it isn't there. But the practice isn't: when a famous effect like ego depletion fails to replicate, essentially nobody abandons the programme it came from. The standard reply is that the replication missed a hidden moderator, or didn't faithfully reproduce the original protocol, or sampled a different population — and the reformers' own response is to demand an even more rigorous test rather than to write the programme off. There's a second oddity: the same movement insists that no single study is decisive (that's the whole argument for replications and meta-analyses) while treating this particular failure as decisive enough to warrant a crisis.

  So what methodology does the practice actually presuppose? Is it naive falsificationism with better statistics bolted on, or is it, despite the "test your theory" talk, Lakatos's sophisticated falsificationism — the unit of appraisal being the research programme, the hard core insulated by a negative heuristic, and the question not whether some test failed but whether successive versions keep predicting novel facts instead of absorbing data after the fact?

  Here's the part I can't settle. Suppose a funder took Lakatos seriously and built a scorecard: programmes commit in advance to dated novel predictions, and are graded on whether their later versions predicted facts they weren't built to explain. Two problems. First, if preregistration becomes universal, then every prediction precedes its data — so does Lakatos's novelty criterion go trivial and take the progressive/degenerating distinction down with it? Doesn't the criterion need some notion of what the programme's own resources can accommodate, so that a belt flexible enough to absorb anything is degenerating regardless of timing? Second, Lakatos's own position seems to be that degeneration is only legible retrospectively: from inside a programme you can't tell whether hidden moderators are the protective belt working as designed or the programme decaying. If so, what could such a scorecard deliver in real time? And is the movement's demand for decisive single tests then incoherent on its own terms, or a sensible institutional workaround for an appraisal nobody can perform from the inside?

  Please also separate what the practice strictly presupposes from what it merely fits well with: which rival methodologies — Bayesian evidence-accumulation, Kuhnian normal science, straightforward verificationism — would license exactly these reforms, and where is the practice genuinely underdetermined, so that several theories would each justify it? Finally, if we dropped the pretense of decisive tests and appraised programmes instead, what would actually have to change in how journals, funders, and hiring committees operate?

  End with a single machine-readable line: \answer{X}, where X is one of naive-falsificationist, lakatosian, bayesian-evidentialist, kuhnian, underdetermined.
reasoning: |-
  Hmm, this user presents a sophisticated analysis of tensions within the meta-science reform movement. They've clearly engaged deeply with philosophical foundations of science while observing practical contradictions in how replication failures are handled. The core puzzle revolves around whether the movement operates on naive falsificationist principles (as rhetorically claimed) or Lakatosian research programmes (as practice suggests).

  The user identifies two key paradoxes: First, the apparent immunity of research programmes to falsification despite formal commitment to falsificationism. Second, the simultaneous insistence that no single study is decisive while treating specific replication failures as crisis-inducing events. This creates a rich philosophical problem space.

  They then propose an interesting thought experiment about implementing Lakatosian scorecards for research programmes, raising three profound implementation challenges: (1) whether universal preregistration trivializes Lakatos' novelty criterion, (2) the definitional problem of "accommodation vs prediction" and (3) the retrospective nature of programme appraisal. This shows exceptional conceptual depth.

  The query also demands methodological comparisons, asking which frameworks (Bayesian, Kuhnian etc.) could justify current reforms, and what institutional changes would follow from adopting programme-level appraisal. The challenge is to honor this complexity while providing a clear, machine-readable conclusion.

  I notice the user's frustration with reform movement inconsistencies shines through - they're not just asking abstract questions but seeking resolution to observed contradictions. The reference to "pretense of decisive tests" suggests they suspect the movement might be philosophically incoherent.

  Key observations from scientific practice: Replication failures rarely kill paradigms (ego depletion continues in modified forms), while reforms like registered reports functionally shift focus from single tests to programme-level robustness. The institutional emphasis on meta-analyses further suggests a Bayesian-like evidence accumulation model.

  Resolving the novelty criterion problem: Preregistration doesn't eliminate the distinction between prediction and accommodation because the theoretical flexibility of the protective belt matters - a theory that can explain any outcome by adding moderators isn't predicting novel facts. Universal preregistration just changes what "novel" means temporally.

  On real-time appraisal: The proposed scorecard would need to evaluate whether new predictions (1) derive organically from the hard core (2) constrain possible outcomes meaningfully (3) don't merely reinterpret existing data. This is institutionally feasible but requires expert committees.

  Methodological compatibility assessment: The reforms fit best with Lakatos (programme protection), Bayesianism (evidence weighting), and surprisingly Kuhn (crisis response to replication failures), but clash with naive falsificationism. The actual practice seems philosophically pluralistic.

  For institutional changes: Journals would need programme-track sections, funders multi-year programme grants, hiring committees would value protective belt development. Most radically, we'd stop expecting single studies to "prove" anything.

  The concluding classification is tricky - while elements of other frameworks apply, the core of the reform movement's practice (protecting research programmes while demanding progressive development) is fundamentally Lakatosian. Hence the answer.
answer: |-
  Your analysis astutely identifies the philosophical tensions within the meta-science reform movement. The practice aligns most closely with **Lakatos's sophisticated falsificationism**, despite falsificationist rhetoric. Here's the breakdown:

  1.  **Practice vs. Rhetoric:** The movement's *actions* (protecting core theories with moderators, demanding stricter tests after failures, valuing programme persistence) presuppose Lakatos's model. The unit of appraisal is the research programme (e.g., self-control theory), not single hypotheses. The "hard core" (limited resource model) is insulated by a "protective belt" (moderators, protocol variations) via a negative heuristic ("don't abandon the core"). Progress is judged by the programme's ability to generate novel predictions, not single falsifications.

  2.  **Addressing the Oddities:**
      *   **Immunity of Programmes:** Failure to replicate a specific effect (ego depletion) is seen as a challenge to the protective belt, not the hard core. Demanding a more rigorous test is an attempt to *strengthen* the belt or refine auxiliary hypotheses – classic Lakatosian strategy.
      *   **Demanding Decisive Tests Amidst Non-Decisiveness:** The "crisis" rhetoric reflects Kuhn's influence. A high-profile replication failure acts as a Kuhnian "anomaly," triggering extraordinary scrutiny (rigorous tests, adversarial collabs) *within* the programme to resolve the tension. It's decisive *for that specific instantiation* within the belt, prompting refinement, not necessarily for the core. The movement demands decisive tests *as inputs* to assess programme progressiveness, not as final arbiters of core truth.

  3.  **The Lakatosian Scorecard Problems:**
      *   **Novelty & Preregistration:** Universal preregistration doesn't trivialize Lakatos's novelty criterion. The criterion requires *theoretical* novelty: predicting facts *not anticipated by rival programmes* or *inconsistent with the programme's previous belt*, not just temporal novelty. A programme that can only "predict" outcomes by constantly adding *post-hoc*, untestable moderators to accommodate *any* result is degenerating, regardless of preregistration. The scorecard must assess whether predictions are *genuinely novel* theoretically and constrain the programme's flexibility.
      *   **Real-Time Appraisal & Retrospection:** You're right that degeneration is often only clear retrospectively. However, a scorecard could track *indicators* of degeneracy: increasing reliance on *post-hoc* accommodations, failure to generate *risky* novel predictions, diminishing empirical content, or inability to assimilate findings without *ad hoc* modifications. While not definitive, a pattern here flags potential trouble. The reformers' demand for rigorous tests is an *institutional workaround*: forcing programmes to commit to risky predictions *now* provides data points for future retrospective appraisal of progressiveness/degeneracy. It's not incoherent, but a practical tool to generate the data needed for Lakatosian appraisal.

  4.  **Methodological Compatibility:**
      *   **Licenses the Reforms Well:**
          *   **Lakatosian:** Directly explains protecting cores, refining belts, and appraising programmes on novel predictions.
          *   **Bayesian Evidentialist:** Explains demanding replications/meta-analyses (accumulating evidence), preregistration (reducing bias to update priors fairly), and seeing single studies as non-decisive. It fits the focus on evidence *weight* but less directly explains programme-level immunity.
          *   **Kuhnian (Normal Science):** Explains persistence of paradigms/programmes, treating anomalies as puzzles to solve within the paradigm, and the "crisis" reaction to major replication failures triggering extraordinary efforts.
      *   **Poor Fit:**
          *   **Naive Falsificationism:** Directly contradicted by protecting cores after falsification attempts and rejecting decisive single tests.
          *   **Straightforward Verificationism:** Contradicted by focus on falsification rhetoric and recognizing non-decisiveness of positive results.
      *   **Underdetermined Aspects:** The *institutional focus* on specific tools (preregistration, RRs, replications) is underdetermined. Lakatosians, Bayesians, and Kuhnians can all endorse these as mechanisms to improve rigour, reduce bias, and generate better data for their respective appraisal systems. The practice doesn't *strictly presuppose* only one underlying philosophy for these tools.

  5.  **Institutional Changes for Programme Appraisal:**
      *   **Funders:** Award multi-year grants for *research programmes* based on a track record of progressive problem shifts and proposals for novel predictions. Require programme-level updates, not just project reports.
      *   **Journals:** Publish "Programme Progress Reports" synthesifying developments, novel predictions, and responses to challenges within a programme. Prioritize Registered Reports testing *novel* predictions from established programmes. Contextualize replication failures within programme evolution.
      *   **Hiring/Promotion Committees:** Value contributions to developing a progressive research programme (novel predictions, successful belt adjustments, synthesizing findings) over isolated high-impact papers or number of "significant" results. Assess the health and trajectory of the candidate's programme.
      *   **Meta-Scientists:** Develop metrics/tools for assessing indicators of programme progressiveness/degeneracy (e.g., ratio of novel predictions to *post-hoc* accommodations, empirical content growth).

  The movement's core practice – protecting programmes while demanding they generate rigorous, novel tests – is fundamentally Lakatosian. The "decisive test" rhetoric is partly institutional pragmatism and partly a misalignment between stated philosophy and actual scientific practice.

  \answer{lakatosian}
