prompt: |-
  I keep trying to work out what I actually think about biological function, and my verdicts on cases dont line up with either of the two camps I keep reading about (selected-effects vs causal-role, or whatever they're called). I'd rather you help me find the principle behind my own verdicts than tell me which camp to join.

  Here's where I'm at, case by case.

  1. A frog's heart. Function: pumping blood. Everyone agrees, nothing to see here.

  2. A cave fish population that's been in the dark for a very long time, whose eyes have degenerated into useless tissue. I want to say: the function of those eyes is still seeing, and they've lost it. What I don't want to say is either "they have no function now" or "their function is now whatever the leftover tissue happens to be doing."

  3. Here's a weird one I invented and can't shake. Toads: in this population, every individual raised in bright light grows a reflective patch on its back. It's a developmental response to the light, not an inherited variant — take the light away and the next generation has no patch, put it back and the patch returns. The patch stops them overheating and makes a real difference to survival. I want to say its function is reflecting light / keeping them cool, even though there is no selection history whatsoever: nothing was ever "kept around," the thing is rebuilt from scratch in each generation. This is the verdict I feel most confident about and also the one I suspect wrecks my overall picture.

  4. A fungus picks up a bacterial gene by horizontal transfer. In the fungus the gene does exactly the chemistry it did in bacteria, and it helps. I flip-flop: one part of me says of course it has that function, another says it has no function at all because nothing in the fungal lineage was ever selected for doing that.

  5. Island snails: a thicker-shell variant that got fixed by drift during a bottleneck, not by selection. It happens to protect them from a crab that's been around all along. I want to say protection is a function of shell thickness, but it feels weaker, somehow second-rate, compared with the heart case — and I can't say what the difference is supposed to be.

  6. Peacock's tail: its function is attracting peahens. Not helping the species survive, not deterring predators, and I feel no pull at all toward "its function is whichever useful effect is biggest."

  7. A transposable element that copies itself around the genome and slightly wrecks the organism's fertility. I want to say: relative to the organism, no function — it's a disease of the genome. But I'm perfectly happy saying that, relative to the element itself, its function is copying itself. So function is relative to something, and I don't know how to specify what.

  8. A mechanical pump sewn into a human chest. Obviously its function is pumping blood. No selection, no copying, one-off object.

  9. Something like the old jaw-joint bone that became a middle-ear bone: selected for ages for job A, now doing job B, and B is what's keeping it around. I want to say its function is now B and that A has stopped being its function — not "A is still its function but broken," like the cave fish eyes, and not "both."

  The principle I keep coming back to: a trait's function is whatever it was doing that got it kept around; if it has stopped doing that, its function is whatever is keeping it around now. That gets 1, 2, 6 and 9 the way I want. But it seems to say the toad patch (3), the transferred gene (4) and the pump (8) have no function at all, and I don't want to say that. It also says nothing about the drift case (5), or about what the "relative to" in (7) is tracking.

  So: is there one principle that saves all of this, or am I running two different notions together (function vs. proper function vs. mere useful effect)? Whatever you hand back, I want each clause tied to the case that forces it, verdicts on at least two cases I haven't listed — say, the gut bacteria that make vitamin K for their host, and a trait that's still under selection for one effect while being slowly co-opted for another — and an honest statement of which of my verdicts it makes me drop. If the honest answer is a disjunctive or two-tier account, say so and say what it costs me.

  Dont bother with citations or a reading list; I want the principle, not the bibliography. Lead with your bottom line in the first sentence, then do the work, no preamble and no restating what I just asked.
reasoning: |-
  Okay, the user is struggling to find a consistent principle for biological function that matches their intuitions across various cases. They've listed nine specific scenarios where their judgments don't align neatly with existing theories like selected-effects or causal-role accounts. 

  Hmm, what's interesting is how strongly they reject conventional frameworks—they clearly don't want to be pigeonholed into existing camps. The toad patch case (3) seems pivotal; they're adamant that something built de novo without selection history still has a function. That's a major departure from traditional selected-effects views. 

  The transposable element case (7) reveals another layer: their intuition that function is relative to "whose interests" are being served. That's crucial—it suggests a perspective-based element most theories ignore. Also notable is their discomfort with the drift case (5) feeling "second-rate" compared to selection-driven functions. 

  Their provisional principle ("whatever got it kept around") works for some cases but fails spectacularly for artifacts (the pump) and developmental adaptations (toad patch). The horizontal gene transfer case (4) clearly troubles them—they're torn between the trait's current utility and its lack of lineage history. 

  For their unlisted cases: gut bacteria producing vitamin K—they'll likely see that as having a function relative to the host, but what about the bacteria's perspective? And for a trait under selection while being co-opted, they'd probably say the "current keeper" takes precedence over historical function. 

  The solution needs to reconcile three threads: current causal role (for pumps/toads), maintenance mechanisms (selection, drift, development), and perspective (organism vs. gene vs. artifact user). Their "relative to" instinct in case 7 is the key—it's not just about biological systems but about functional ascriptions from a viewpoint. 

  Aha! The core might be: function is role-ascription within a maintenance system that preserves it. For organisms, maintenance = natural selection; for artifacts, intentional design; for selfish genes, their own replication system. This handles the toad patch via developmental maintenance, the pump via design intent, and selfish DNA via its own "agenda." 

  It does sacrifice one thing: in drift-fixed traits (snails), the protective effect isn't actually maintaining the trait, so it wouldn't count as function under this view—only whatever developmental constraints maintain it. They might accept that tradeoff since they already felt it was "second-rate." 

  For the co-option case: the ear bone's current function (hearing) maintains it now, so it supersedes the historical jaw function. Gut bacteria? Function relative to host if host selection maintains the symbiosis. Horizontal gene—tricky, but if the gene persists via fungal selection for its chemistry, that counts. 

  Final note: their "whatever got it kept around" principle wasn't wrong—it just needed expansion to include non-selective maintenance (development, design) and clarification of "kept around for whom."
answer: |-
  The core principle unifying your verdicts is: **A trait's function is its current role in maintaining the system it's part of, relative to the perspective of that system's persistence mechanism.**

  ### Breakdown by Your Cases:
  1. **Frog's heart:** Pumping blood maintains the organism via *organism-level selection*.  
     → **Verdict:** Pumping blood (matches).  
  2. **Cave fish eyes:** Historical selection maintained eyes for sight; current degeneration doesn't erase that function (it's *mal*functional). Persistence is due to *developmental constraints*, not current utility.  
     → **Verdict:** Seeing (matches).  
  3. **Toad's patch:** The patch is developmentally *rebuilt each generation* because it maintains the organism by cooling. Persistence mechanism: *plastic developmental response*.  
     → **Verdict:** Reflecting light/cooling (matches).  
  4. **Horizontally transferred gene:** If the gene's chemistry *currently maintains the fungus* (e.g., via selection for survival/reproduction), it has a function. If it's just present with no maintenance role, it doesn't.  
     → **Verdict:** Flip-flop resolved: *Has function if actively maintained by fungal fitness*.  
  5. **Drift-fixed snail shells:** Thickness persists via *drift*, not selection. Protection isn't the maintenance cause, so it lacks a function (*even if useful*).  
     → **Verdict:** *No function for protection* (rejects your verdict).  
  6. **Peacock's tail:** Maintained by *sexual selection* (attracting mates).  
     → **Verdict:** Attracting peahens (matches).  
  7. **Transposable element:** *Relative to the organism*, it undermines persistence → no function. *Relative to the element*, copying maintains its own persistence → function is copying.  
     → **Verdict:** Perspective matters (matches).  
  8. **Mechanical pump:** Maintains the *human circulatory system* via *design intent*.  
     → **Verdict:** Pumping blood (matches).  
  9. **Jaw-to-ear bone:** *Currently maintained* by selection for hearing (B), not ancestral jaw function (A).  
     → **Verdict:** Function is now B (matches).  

  ### New Cases:
  - **Gut bacteria making vitamin K:**  
    → **Verdict:** Function = producing vitamin K *relative to the host*, because host selection maintains the symbiosis.  
  - **Trait under selection for A, co-opted for B:**  
    → **Verdict:** Function is A *if selection still acts on A*. If B now maintains it (even partially), B is *also* a function.  

  ### What You Sacrifice:
  - **Snail shells (Case 5):** You must drop "protection is a function." Under this principle, drift-maintained traits have *no function* even if beneficial.  
  - **Caveat:** "Perspective" resolves relativity (Case 7), but requires specifying the system (organism, gene, artifact) and its persistence mechanism (selection, development, design).  

  ### Why This Works:
  - **Maintenance over history:** Focuses on *current* persistence (saves toad patch, pump), not past selection.  
  - **Mechanism-specific:** Selection (1,6,9), developmental plasticity (3), design (8), or selfish replication (7) all count.  
  - **Maladaptation:** Degenerated traits (2) retain historical function because their *persistence* is passive.  
  - **Drift exclusion:** Traits fixed by drift (5) aren't *maintained* by their effects, so no function.  

  **Bottom line:** Your intuition tracks *current maintenance roles within a system's persistence framework*, rejecting pure historical selection or causal-role utilitarianism. The cost: excluding drift-fixed benefits as non-functional.
