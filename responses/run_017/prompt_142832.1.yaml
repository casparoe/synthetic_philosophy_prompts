  What's really sharp here is how they connect institutional design to philosophical foundations. That forecast offices and journals might be quietly running on different theories of probability is a profound observation. I need to address whether scoring practices actually require probabilism or just incentive compatibility.

  The mushy credence point is particularly thorny. If a forecaster doesn't have a sharp probability, does the scoring rule force one out? Or does the practice presuppose sharp probabilities exist? This links to those Dutch-book-style arguments against sharp probabilities that the user mentioned but can't recall - I should explain how those work briefly.

  Their "sharpness bonus" variant is genius - it perfectly isolates the difference between rewarding honesty versus decision usefulness. This gets to the heart of what forecast institutions are actually optimizing for. The weather service likely cares about actionable information, not philosophical purity.

  On scientific probability avoidance: the user's field uses p-values but not P(hypothesis), while weather uses PoP. I suspect this reflects different epistemic stances - frequentist procedures versus subjectivist commitments - but both can coexist if we view probabilities as context-dependent tools. The key is whether the probability attaches to repeatable events (weather) or unique hypotheses (models).

  The community-level Dutch book question is explosive. If separate papers collectively assign >100% probability to mutually exclusive outcomes, is science incoherent? Scoring rules don't help here - they're individualistic. This suggests a fundamental limitation in how we aggregate scientific knowledge.

  Throughout, I must resist diving into mathematical details (as requested) and focus on what practices presuppose. The underdetermination point is crucial: proper scoring rules work with various interpretations of probability, not just subjectivist/Bayesian views. The practice is more flexible than the standard justification suggests.
answer: |-
  Your questions cut to the heart of how probabilistic reasoning operates in practice versus philosophical justification. Let's dissect the commitments of the forecasting practice, the role of Dutch books, and the tensions within scientific culture. I'll address each layer systematically, focusing on what the practice *requires* versus what it *accommodates*.

  ### 1. **What Proper Scoring Rules Presuppose vs. What Dutch Books Deliver**
     - **The Practice's Core Commitment**: Proper scoring rules (Brier, log score, etc.) presuppose only that forecasters have *some* internal state ("genuine confidence") that can be mapped to a number **p**, and that they are *incentivized to report it honestly*. Crucially, it does **not** strictly require credences to satisfy the probability axioms. 
     - **Dutch Books vs. Scoring Rules**:  
       - Dutch book arguments aim to enforce probabilistic coherence (axioms like additivity) by threatening sure losses if violated.  
       - Proper scoring rules enforce **honest reporting of whatever credence you hold** (sharp or not). If your credence is *p*, reporting *p* maximizes expected score *regardless* of whether *p* is coherent with other beliefs.  
       - **Key divergence**: A forecaster with incoherent credences (e.g., assigning P(A) + P(¬A) = 1.2) can still maximize their score by honestly reporting those incoherent values. The scoring rule doesn't punish incoherence—it only punishes dishonesty about your actual credence.
     - **Calibration Without Credences**: Yes, you can justify scoring purely on long-run calibration (e.g., "30% forecasts should rain 30% of the time") *without* invoking credences. This is a frequentist interpretation: the score evaluates the *forecast* as a tool, not the forecaster's mental state. Institutions use proper scoring rules because they *coincidentally* align calibration incentives with honest credence reporting—but the practice doesn't need Dutch books to function.  

  ### 2. **Mushy Credences and the Practice's Demands**
     - **The Gap Problem**: If a forecaster has a buying price of £0.40 and a selling price of £0.60 for a £1 rain ticket, their belief is "mushy" (indeterminate). Proper scoring rules **force a sharp number out of her** because she must submit a single value *p*.  
     - **How It Works**:  
       - The forecaster chooses *p* to maximize *expected score* given her indeterminate belief.  
       - She might report *p* = 0.5 (midpoint) or optimize for the scoring rule's curvature (e.g., under Brier score, risk-averse forecasters report closer to 0.5).  
     - **Compatibility**: The practice *is* compatible with mushy credences but **operationalizes them into sharp reports**. It doesn't presuppose a "real" sharp credence exists—it creates one through institutional demand.  
     - **Dutch Books Against Sharpness**: Yes, arguments exist (e.g., Levi 1974) that indeterminate beliefs can be rational, and forcing sharpness may lead to poor decisions. Scoring rules sidestep this: they reward *actionable forecasts*, not metaphysical rationality.  

  ### 3. **Your "Sharpness Bonus" Variant: Coherent but Different Aim**
     - Adding bonuses for extreme predictions (e.g., rewarding 0.8+ or 0.2- when correct) shifts incentives. Now:  
       - Honest reporting of *p* ≠ score-maximizing report.  
       - Forecasters are incentivized to *distort* reports toward extremes if the bonus outweighs the proper score penalty.  
     - **Is This Incoherent?** No—it's coherent but serves a **different purpose**:  
       - *Original proper score*: Rewards honest credence reporting.  
       - *Sharpness bonus*: Rewards providing decisive information for binary decisions (e.g., "issue a warning only if PoP > 80%").  
     - **Presuppositions**: This variant assumes that *decision utility* (e.g., reducing false alarms) trumps epistemic honesty. It fits contexts like public warnings, where "maybe" is costly.  

  ### 4. **Scientific Culture Split: Weather Forecasts vs. Hypothesis Testing**
     - **The Dichotomy**:  
       - *Weather offices*: Assign sharp probabilities to *repeatable events* (rain tomorrow).  
       - *Journals/Assessments*: Avoid probabilities for *hypotheses* (e.g., "P(model correct) = 0.7"), using p-values or verbal terms ("likely") instead.  
     - **Why the Split?**  
       - **Epistemic Access**: Tomorrow's rain is a single event embedded in a long-run frequency (e.g., 100 similar days). Hypotheses (e.g., climate models) are often seen as unique, non-repeatable systems.  
       - **Institutional Risk**: Assigning P(hypothesis) risks "overclaiming" single-study evidence. Verbal terms ("likely") embed ambiguity, protecting against miscalibration.  
       - **Frequentist Legacy**: P-values and error bars stem from *procedure-based* statistics (Fisher, Neyman-Pearson), where probability describes methods, not beliefs.  
     - **Can Both Coexist? Yes**, if viewed pragmatically:  
       - Probability-as-*tool* for decisions (weather) vs. probability-as-*inference warrant* (science).  
       - Neither commits to a "true" theory of probability—they solve different problems.  

  ### 5. **Community-Level Dutch Books: The Literature Problem**
     - **Can a Field Be Incoherent? Absolutely**. If five papers assign probabilities to mutually exclusive claims, and the sum exceeds 1, the literature violates additivity—a "Dutch book against the community".  
     - **Why Scoring Rules Don't Help**:  
       - Scoring rules evaluate *individual forecasts* of *observables* (rain). Hypothesis probabilities are rarely scored operationally.  
       - Peer review checks individual coherence (e.g., stats methods) but not cross-paper coherence.  
     - **What Would Change?** To "resolve" the Dutch book:  
       - Pre-register joint hypotheses.  
       - Demand meta-assessments (e.g., IPCC assigning consistent probabilities across claims).  
     - **The Real Barrier**: Science lacks institutions that score *hypothesis probabilities* (unlike weather offices). Without feedback loops, incoherence persists.  

  ### Key Takeaways: What the Practice *Actually* Needs
  - **Underdetermination**: Proper scoring rules require only that (a) forecasters can map beliefs to numbers, and (b) institutions want honest reports. **No Dutch books, coherence axioms, or "real" probabilities are needed.**  
  - **Mushiness Compatibility**: The practice forces sharp reports but doesn't presuppose sharp credences exist.  
  - **Split Scientific Culture**: Weather forecasting uses probabilities for *decisions under uncertainty*; journals avoid them for *hypothesis credibility* to manage epistemic risk. Both are rational given their goals.  
  - **Community Incoherence**: A real problem, but unsolved because science lacks mechanisms to score joint probabilities across papers.  

  **Where Philosophy Meets Practice**: Dutch books justify probabilistic coherence *for ideal agents*. Forecasting institutions use scoring rules to *extract useful information*. The overlap is pragmatic, not foundational. Your experience reveals that the practice works by incentivizing honesty and calibration—not by enforcing a philosopher's notion of rationality.
