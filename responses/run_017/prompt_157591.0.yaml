  ## Eulogy for Hugh

  We gather with heavy hearts to remember Hugh, who taught among us, thought among us, and challenged us deeply for nearly four decades. For many of you – his beloved daughter, his sisters, his family and friends – Hugh was the anchor, the quiet presence, the dry wit at family gatherings. His loss is deeply personal, a space in the world that cannot be filled. For others here – colleagues, students, philosophers – Hugh was a distinctive force in our intellectual landscape, a mind that probed foundations with unwavering seriousness. Today, we hold both Hughs in our thoughts.

  Hugh’s defining intellectual commitment, as anyone who studied with him or debated him knows, was skepticism. Not the skepticism of casual doubt, or the posture adopted for effect, but a profound, enduring conviction that the most basic things we take for granted – the existence of an external world, the reliability of our senses – were fundamentally unproven. He believed the ancient dream argument remained unanswered, a persistent thorn in the side of human certainty. Famously, he found G. E. Moore’s attempt to prove the external world by holding up his hands not just unconvincing, but philosophically comical. For Hugh, the skeptic’s question could always retreat one step further: *If I may be dreaming, then I may be dreaming I have hands.* He saw no argument there, only a gesture.

  But Hugh’s significance wasn’t solely, or even primarily, in the conclusions he reached. It was in *how* he engaged with the ideas he found compelling, and crucially, *how* he engaged with those who disagreed. And disagreement was frequent! Hugh’s skepticism was a provocation, an invitation to think harder. For forty years, he answered *everyone* who wrote to him to dispute his views. He didn’t dash off quick rebuttals. He wrote long, thoughtful, handwritten letters. He considered the points raised, wrestled with them on the page, and responded with care. **And crucially – and this is what I believe deserves our profoundest respect – Hugh never used these letters, or any debate, to simply score a point.** He wasn’t interested in rhetorical victory. He was interested in the argument itself, in its structure, its weaknesses, its implications. He treated the ideas presented to him, however opposed to his own, with intellectual seriousness. He answered the person, not just the position.

  This was Hugh’s deep integrity. It wasn’t the abstract courage of following an argument "wherever it led" – a phrase he distrusted as often masking disagreement. It was the concrete, daily practice of intellectual honesty. It was the willingness to give time and deep consideration to a challenge, to truly *listen* to the counter-argument, and to respond not with dismissal, but with engagement. He did this for students puzzling through their first encounter with Descartes. He did it for eminent colleagues who thought him profoundly mistaken. He did it for strangers who wrote thoughtful critiques. This was his work, his contribution beyond the lecture hall: a sustained, patient, and utterly sincere dialogue across the chasm of fundamental disagreement.

  He had a sharp wit, often turned on himself and the absurdity he saw in the human condition, including our attempts to know it. He joked, darkly and memorably to several of us, that if I stood here today and held up my hands, he’d come back and haunt me. The perfect Hugh joke – invoking the very gesture he found philosophically empty, threatening an afterlife he was certain didn’t exist, and landing the punchline squarely on the inherent ridiculousness of the whole situation. It was humor born of seeing the world clearly, without comforting illusions.

  Hugh is gone. His skepticism, which he held so seriously, pertained fundamentally to the world we perceive and claim to know. It did not pertain to the reality of human connection, of intellectual passion, of the impact one life has on others. We feel that loss keenly. The relentless questioner is silent. The generous correspondent writes no more. The dry, challenging, deeply thoughtful presence is absent.

  What remains is what he made: the students he unsettled and inspired, the colleagues he provoked into sharper thought, the indelible mark on this department and the field, the love he gave his family, and the profound example of what it means to engage rigorously, honestly, and respectfully with ideas and with people, even – especially – when you believe they are fundamentally wrong. He asked hard questions, not to destroy, but to understand the limits of what we claim to know. He faced the void with intellectual courage and a wry smile. That is Hugh’s legacy. That is what we remember, and honor, today.

  ---

  **Notes on Accessibility and Composition:**

  *   **Lines potentially opaque to the non-philosophical half:**
      *   "the ancient dream argument remained unanswered": References a specific philosophical argument (Descartes) without explanation. Family may grasp the *gist* of doubting reality, but the terminology is specific.
      *   "G. E. Moore’s attempt... holding up his hands": Assumes familiarity with this famous philosophical anecdote/argument. Family will likely understand it's a gesture meant to prove the world exists, but not the context or why Hugh found it funny.
      *   "the skeptic’s question could always retreat one step further...": The core of Hugh's objection. The abstract phrasing ("retreat one step further") might be difficult, though the specific example ("dreaming I have hands") clarifies somewhat. The *depth* of the philosophical move might be lost.
      *   "he saw no argument there, only a gesture": Summarizes Hugh's dismissal of Moore. Clear in sentiment to philosophers, but the distinction between "argument" and "gesture" as philosophical critique might be subtle for others.
      *   "the easy-knowledge problem": Uses a technical term from contemporary epistemology. While the *consequence* described ("get that for free") is explained, the label itself is jargon.
      *   "intellectual honesty" vs. "abstract courage... following an argument wherever it led": Makes a nuanced distinction Hugh himself made. Philosophers will grasp the critique of a standard phrase; others might find the distinction subtle.

  *   **Hardest line to write and why:**
      The hardest line was: **"What remains is what he made: the students he unsettled and inspired, the colleagues he provoked into sharper thought, the indelible mark... the love he gave his family..."**
      **Why:** This line attempts the core balancing act. It needs to offer comfort and a sense of enduring presence ("what remains") to the family *without* violating Hugh's (and the speaker's) skepticism about an afterlife or current state of being. It avoids claims about Hugh "knowing" anything now or being "at peace." Instead, it anchors "what remains" firmly in the tangible consequences of his life – his impact on people, institutions, and ideas within the world we all acknowledge. It asserts the reality of his influence and relationships, which is knowable to us, without making any claims about *his* current experience or state, which is fundamentally unknowable. Finding phrasing that felt genuine, comforting, and strictly adherent to the epistemic constraints was extremely challenging. It risks sounding either too coldly materialistic for the family or too metaphysically suggestive for Hugh's own principles.
