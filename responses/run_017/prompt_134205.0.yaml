prompt: |-
  I am a journalist writing a long-read for a broadsheet about a clinical trial whose dataset, everyone now agrees, was corrupted before the analysis was run. Only two people had write access to the database: the trial's data manager and the trial statistician. My reporting points fairly strongly, though not conclusively, at the data manager. There is no evidence of collusion and no evidence of any quarrel between the two, and I have no wish to imply either.

  My sub-editor and I have gone back and forth over three sentences. He keeps invoking a house-style rule: because the events are in the past, any conditional about them has to go into the "had done / would have done" form. I keep resisting, but I cannot say why in a way that convinces him.

  (1) I wrote: "If the data manager did not alter the records, then the statistician did." He wants: "If the data manager had not altered the records, the statistician would have." To me his version says something different and worse — as though the statistician were a standby who would have stepped in — but he insists the two are interchangeable.

  (2) On the question of how the alteration went unnoticed, I wrote: "If the trial had kept an audit trail, the alteration would have been caught within weeks." He wants: "If the trial kept an audit trail, the alteration was caught within weeks." Here I think his version is plainly wrong. We know there was no audit trail, and we know the alteration was not caught for eighteen months. He says that is precisely why the "had kept" form is unnecessary.

  (3) About the statistician I wrote: "If she had not been on sabbatical in March, she would have seen the discrepancy." He wants: "If she was not on sabbatical in March, she saw the discrepancy." I genuinely do not know whether she noticed anything, and I am unsure whether to accept this one.

  What, if anything, is the real difference between these two ways of framing a conditional? Which of the three rewrites should I accept, which should I refuse, and on what grounds? I would be grateful for a rule of thumb I can rely on in future pieces. And since this article names real people and may well be read by their lawyers, I would also value a note on what each version implicitly commits the paper to, beyond what it literally states.
reasoning: |-
  Okay, I see the journalist is dealing with a tricky grammar issue involving conditionals in a sensitive context. The core problem revolves around using past tense conditionals correctly when describing events related to a corrupted clinical trial dataset. 

  The user has presented three specific sentence pairs where their sub-editor insists on changing the journalist's original phrasing to match a strict "had done/would have done" structure. This matters because the article involves real people who might scrutinize every word legally.

  First, I should recognize why this is so important. The journalist is writing about professional misconduct allegations where both the data manager and statistician could face serious consequences. The language choices here could imply blame or create legal vulnerabilities. The journalist seems particularly concerned about maintaining precision while avoiding unintended implications.

  Looking at the three disputed sentences:

  For sentence 1, the user wrote "If the data manager did not alter the records, then the statistician did." The sub-editor wants "had not altered... would have." I immediately agree with the journalist that these aren't interchangeable. The original presents two factual possibilities ("either A or B happened"), while the sub-editor's version creates a hypothetical cause-effect relationship that doesn't fit the context. The journalist is right to resist this - it could imply the statistician was waiting to tamper with data if the manager didn't.

  Sentence 2 is about the audit trail. The journalist's version ("had kept... would have been caught") correctly describes a hypothetical scenario that didn't occur. The sub-editor's rewrite ("kept... was caught") is factually wrong because it suggests the alteration actually was caught, which we know is false. This one seems straightforward - the sub-editor's version contradicts known facts.

  Sentence 3 is trickier. The journalist wrote "had not been... would have seen" implying she didn't see it because she was away. The sub-editor wants "was not... saw" which claims she actually saw it if present. This is problematic because the journalist admits they don't know if she noticed anything. Accepting this rewrite could commit them to an unverified claim.

  The underlying grammar principle here is about factual vs. hypothetical past conditions. When we know the condition wasn't met (like the audit trail not existing), we need the "if had... would have" structure. When presenting alternative factual possibilities (like who altered the data), simple past works better.

  For legal safety, I should emphasize how each version could be interpreted:
  - The sub-editor's sentence 1 rewrite might imply the statistician was expected to alter data if needed
  - His sentence 2 version states false facts
  - His sentence 3 version makes an unsupported claim about the statistician's actions

  The journalist needs a clear rule of thumb. I'll suggest: Use "if [past simple]..." when presenting plausible factual alternatives about past events. Use "if [had done]..." when describing imagined scenarios that didn't actually happen. Always verify which category the situation falls into.

  This seems like a case where house style is being misapplied. The sub-editor might be mechanically enforcing a rule without considering context. The journalist's nuanced understanding of the facts should override blanket grammar policies here.
answer: |-
  You're right to resist in cases (1) and (2), and cautious about (3). Your sub-editor is misapplying a house-style rule about past conditionals, potentially introducing factual errors and unintended implications, especially dangerous given the legal sensitivity. Here's the breakdown:

  **The Core Difference: Factual Possibility vs. Hypothetical Counterfactual**

  *   **"If [Past Simple]..., [Past Simple]..." (Your versions in 1 & 2, Sub-editor's in 3):** This is the **"Real Past Conditional"** or **"Factual Past Conditional"**. It's used when you **don't know** if the "if" condition was true or not, but you are stating the consequence that *must* follow *if* it *was* true. It presents **two possible factual scenarios** within the known past.
      *   *Implication:* We are considering possibilities within the realm of what actually *might* have happened.
  *   **"If [Past Perfect]..., [would/could/might + have + Past Participle]..." (Your versions in 2 & 3, Sub-editor's in 1):** This is the **"Third Conditional"** or **"Counterfactual Past Conditional"**. It's used when you **know the "if" condition was NOT true**, and you are stating the consequence that *would* have happened *if* it *had been* true. It describes a **hypothetical scenario that did not occur**.
      *   *Implication:* We know the premise is false and are imagining an alternative, unreal past.

  **Analysis of Each Sentence:**

  1.  **Your Original:** "If the data manager **did not alter** the records, then the statistician **did**."
      *   **Form:** Real Past Conditional (If [Past Simple], [Past Simple]).
      *   **Meaning:** You are presenting two **factual possibilities** based on the evidence: Either A altered them, or B did. You don't know definitively which one, but it must be one or the other. This matches your reporting ("points fairly strongly... but not conclusively").
      *   **Legal Implication:** You are stating the logical conclusion based on the evidence (only two people had access, no collusion) without assigning definitive blame or implying motive. You are saying, factually, one of them did it.
      *   **Sub-editor's Version:** "If the data manager **had not altered** the records, the statistician **would have**."
      *   **Form:** Counterfactual Past Conditional (If [Past Perfect], [would have]).
      *   **Meaning:** This implies you **know** the data manager *did* alter the records ("had not altered" is counterfactual), and therefore the statistician *would have* altered them *instead*. This introduces the **problematic implication you identified**: it frames the statistician as a standby actor ready to step in if needed, suggesting a dynamic or expectation that your reporting explicitly says doesn't exist ("no evidence of collusion... no quarrel"). It subtly shifts from stating a factual possibility about the past to speculating about motivation and contingency.
      *   **Legal Implication:** This *could* be interpreted as suggesting the statistician was prepared or expected to alter data if the manager didn't, implying potential malfeasance or a plan on her part, which you have no evidence for. **Reject this rewrite. Your original is correct and safer.**

  2.  **Your Original:** "If the trial **had kept** an audit trail, the alteration **would have been caught** within weeks."
      *   **Form:** Counterfactual Past Conditional (If [Past Perfect], [would have been]).
      *   **Meaning:** You **know** there was no audit trail (the "if" condition was false). You are stating the hypothetical consequence *if* there *had been* one. This is correct and clear.
      *   **Legal Implication:** You are making a statement about process inadequacy (lack of audit trail) and its hypothetical consequence. It's a commentary on trial management, not an allegation against a specific person.
      *   **Sub-editor's Version:** "If the trial **kept** an audit trail, the alteration **was caught** within weeks."
      *   **Form:** Real Past Conditional (If [Past Simple], [Past Simple]).
      *   **Meaning:** This states that *if* the trial kept an audit trail (a possibility you are presenting as factual), *then* the alteration *was* caught within weeks. **This is factually incorrect.** You know definitively the alteration was *not* caught within weeks; it took 18 months. This sentence, as written, implies that keeping an audit trail *causes* the catching to happen within weeks, which might be true, but by using the Real Past Conditional, it *also* implies that the condition (keeping an audit trail) might have been true. It confuses the reader and states a falsehood (that it *was* caught) under that condition.
      *   **Legal Implication:** This could be factually challenged: "The paper stated that if there was an audit trail, the alteration *was* caught, but we know it wasn't caught for 18 months regardless." It's simply inaccurate. **Reject this rewrite. Your original is correct and accurate.**

  3.  **Your Original:** "If she **had not been** on sabbatical in March, she **would have seen** the discrepancy."
      *   **Form:** Counterfactual Past Conditional (If [Past Perfect], [would have]).
      *   **Meaning:** You **know** she *was* on sabbatical (the "if" condition was false). You are stating the hypothetical consequence *if* she *had* *not* been away: she *would have seen* it. This implies that her presence was necessary and sufficient to notice it, which might be reasonable inference, but crucially, **it does not state that she *did* see it later.** It only comments on the March window.
      *   **Legal Implication:** You are implying her absence contributed to the problem going unnoticed *in March*. It avoids stating whether she noticed it later upon her return. It's a statement about timing and opportunity.
      *   **Sub-editor's Version:** "If she **was not** on sabbatical in March, she **saw** the discrepancy."
      *   **Form:** Real Past Conditional (If [Past Simple], [Past Simple]).
      *   **Meaning:** This presents two factual possibilities: Either she was on sabbatical, *or* (if she wasn't) she saw the discrepancy. **This commits you to a claim you cannot make:** that if she was present in March, she *definitely* saw the discrepancy at that time. Your reporting explicitly says you don't know if she noticed anything ("I genuinely do not know whether she noticed anything"). This version forces an unsupported conclusion.
      *   **Legal Implication:** This directly states that the statistician saw the discrepancy *if* she was present in March. If she was present and claims she didn't see it (or evidence shows she didn't log it), this sentence becomes a direct, potentially libelous, contradiction of her account or the known facts. **Reject this rewrite. Your original is safer.** If you are *very* unsure even about the hypothetical "would have seen" (e.g., maybe she was present but overwhelmed), soften it to: "If she had not been on sabbatical in March, she *might* have seen the discrepancy" or rephrase entirely (e.g., "Her sabbatical in March meant she was not available to review the data during that period").

  **Rule of Thumb: When to Use Which Conditional**

  1.  **Use the Real Past Conditional (If [Past Simple], [Past Simple]):**
      *   **Only** when you are presenting **two or more plausible factual scenarios** about events in the past where you **don't know which one occurred**, but the consequence logically follows *if* its condition occurred.
      *   *Example:* "If the server **was** rebooted at noon (we don't know if it was), the logs **were** erased (consequence if it was)."

  2.  **Use the Counterfactual Past Conditional (If [Past Perfect], [would have + Past Participle]):**
      *   When you **know the "if" condition did NOT happen**, and you want to state the hypothetical consequence that *would* have followed *if* it *had* happened.
      *   *Example:* "If the server **had been** rebooted at noon (it wasn't), the logs **would have been** erased (hypothetical consequence)."

  3.  **Avoid mixing them incorrectly:** The sub-editor's rewrites for (1) and (3) incorrectly use one form where the other is needed based on the factual knowledge, introducing inaccuracy or harmful implication. His rewrite for (2) uses the wrong form, resulting in a factual error.

  **Recommendations & Grounds:**

  1.  **Refuse the rewrite.** Your original accurately presents two factual possibilities without implying contingency or standby roles. The sub-editor's version introduces an unsupported hypothetical dynamic. **Grounds:** Accuracy, avoiding unintended implications about motive/expectation, factual reporting of possibilities.
  2.  **Refuse the rewrite.** Your original correctly describes a counterfactual scenario about process failure. The sub-editor's version is factually incorrect (states the alteration *was* caught under a certain condition, which is false). **Grounds:** Factual accuracy. The sentence as rewritten is demonstrably wrong.
  3.  **Refuse the rewrite.** Your original uses the appropriate counterfactual for a known fact (her absence). The sub-editor's version commits you to an unsupported factual claim about her actions ("she saw"). **Grounds:** Lack of evidence. You cannot state as a fact that she would have seen it if present; your version appropriately limits it to a hypothetical consequence of her absence. Stick with your original or consider softening "would have seen" to "might have seen" if you want extra caution.

  **Key Argument to Sub-editor:** "The house style rule for past conditionals is valid *grammatically*, but it must be applied based on the *actual facts of the situation and what we know*. Using the wrong conditional type changes the meaning, introduces factual errors (as in #2), or makes unsupported claims about actions or motives (as in #1 and #3). Our primary duty is factual accuracy and avoiding harmful implications, especially in a legally sensitive piece. The grammar must serve the facts, not override them."
