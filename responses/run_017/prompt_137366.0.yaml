  In state G, utility is 0 no matter what.

  Now, expected utility for a policy π:

  - P(state R) = 0.45, utility if π(red)=A and π(blue)=B: 1000, else 0

  - P(state B) = 0.45, utility if π(red)=A and π(blue)=B: 1000, else 0

  - P(state G) = 0.1, utility = 0

  So overall, EU(π) = [if π(red)=A and π(blue)=B: (0.45 * 1000) + (0.45 * 1000) + (0.1 * 0) = 900] else 0.

  Therefore, the best policy is still to set π(red)=A and π(blue)=B, with EU=900.

  If we set a different policy, say both always press A, then in states R and B, utility is 0, and in G utility 0, so EU=0.

  Now, what about when a copy sees red? In the glitch world, both see red, and they both press A (since π(red)=A). But since it's a glitch, they get nothing, which is fine.

  The key point: even though in the glitch world, pressing A when seeing red doesn't help, the policy is still to do so because in the non-glitch world it does help, and the prior probability of non-glitch is high.

  But now, from the perspective of a copy who sees red, what does it know?

  After seeing red, the copy has a posterior belief.

  P(glitch | see red) = P(glitch and see red) / P(see red)

  P(see red) = P(state G) + P(state R) + P(state B and I am copy2 seeing red? Better to think from one copy's view.

  From the perspective of one copy:

  P(see red) = P(glitch) * 1 + P(no glitch) * P(I am red | no glitch) * 1 + P(no glitch) * P(I am blue | no glitch) * 0

  Since if no glitch and I am blue, I see blue.

  P(see red) = P(glitch) + P(no glitch) * P(I am red)

  But P(I am red | no glitch) = 0.5, since symmetric.

  So P(see red) = 0.1 + 0.9 * 0.5 = 0.1 + 0.45 = 0.55

