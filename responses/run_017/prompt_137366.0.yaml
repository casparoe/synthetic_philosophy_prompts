answer: |-
  I'll break this down step by step, addressing your core confusion about Updateless Decision Theory (UDT), the red/blue light scenario (with and without the glitch), and how UDT handles evidence and everyday decisions. The key insight is that UDT **does use observations in its policy**, but the *selection* of that policy is done using the prior, not the posterior. This is the essence of "updateless": we don't condition the expected utility calculation for policies on any specific observation, but the policy itself is a function from observations to actions, so it fully incorporates evidence when executed. I'll start with the red/blue case to make it concrete, then explain why this isn't just CDT with updating, and finally touch on everyday decisions.

  ### 1. **The Red/Blue Light Scenario Without Glitch**
  In this setup:
  - You are scanned and copied, resulting in two identical copies.
  - A fair coin assigns one copy to a room with a red light and the other to a room with a blue light (each knows the other has the opposite color).
  - Both copies must choose to press A or B.
  - Payoff: $1000 to each copy only if the red-room copy presses A **and** the blue-room copy presses B. All other combinations pay $0.

  **What UDT does:**
  - The UDT agent (before being copied) chooses a **policy**, which is a function mapping observations (seeing red or seeing blue) to actions (press A or press B).
  - It evaluates candidate policies using the **prior probability distribution** (before any observation is made). The prior here is simple:
    - 50% chance you are the red-room copy (and the other is blue).
    - 50% chance you are the blue-room copy (and the other is red).
  - UDT ranks policies based on their expected utility (EU) under this prior, then commits to the best one. The copies then follow this policy when they see their light.

  Now, let's evaluate possible policies:
  - **Policy 1: Always press A** (ignore the light).
    - If you see red, press A; if you see blue, press A.
    - EU = (0.5 × $0) + (0.5 × $0) = $0.  
      Why? In the 50% case where you're red, you press A, but the blue copy also presses A (instead of B), so payoff fails. Similarly, if you're blue, you press A but need to press B.
  - **Policy 2: Always press B** (ignore the light).
    - Same logic: EU = $0.
  - **Policy 3: Press A if red, press B if blue**.
    - If you see red, press A; if you see blue, press B.
    - EU = (0.5 × $1000) + (0.5 × $1000) = $1000.  
      Why? If you're red (50%), you press A, and the blue copy (using the same policy) presses B → payoff. If you're blue (50%), you press B, and the red copy presses A → payoff.
  - **Policy 4: Press B if red, press A if blue**.
    - EU = (0.5 × $0) + (0.5 × $0) = $0.  
      Why? If you're red, you press B (but need A); if you're blue, you press A (but need B).

  UDT selects **Policy 3 (press A if red, press B if blue)** because it has the highest EU ($1000). When the copies see their lights:
  - The copy seeing red presses A.
  - The copy seeing blue presses B.
  - They get $1000 each.

  **Why this isn't ignoring evidence:**
  - The policy **explicitly depends** on the observation (red or blue light), so UDT uses the evidence (the light color) to determine the action.
  - But the *evaluation* of policies doesn't condition on "I saw red" or "I saw blue." Instead, it uses the prior to weight all possible observations (red or blue) based on their pre-observation probabilities. This is "updateless" in the sense that we don't update the probabilities to reflect what actually happened—we stick with the original 50/50 prior when comparing policies.
  - In this case, UDT achieves the sensible outcome: the copies coordinate based on the light, winning $2000 total. Ignoring the light (like Policy 1 or 2) would be suboptimal and rejected by UDT.

  ### 2. **The Red/Blue Light Scenario With Glitch**
  Now the nastier variant:
  - With 10% probability, a glitch occurs: both rooms show a red light (and there is no blue-room copy).
  - With 90% probability, no glitch: fair coin assigns red or blue as before.
  - Payoff unchanged: only if a red-room copy presses A and a blue-room copy presses B do both get $1000. In the glitch world, there is no blue-room copy, so the condition fails (payoff = $0) regardless of actions.

  **Prior probabilities (from the original agent's perspective, before copying/observation):**
  - P(glitch) = 10% → both copies see red, and there is no blue copy.
  - P(no glitch and you are red) = 45% (90% × 50%).
  - P(no glitch and you are blue) = 45% (90% × 50%).
  - The policy is still a function: what to do if you see red, and what to do if you see blue.

  **Evaluating policies under UDT:**
  We need the EU for each policy under this prior. The EU calculation must account for all cases:
  - **Policy 3: Press A if red, press B if blue** (same as before).
    - In no-glitch, red-room case (45%): you press A, blue copy presses B → payoff $1000.
    - In no-glitch, blue-room case (45%): you press B, red copy presses A → payoff $1000.
    - In glitch case (10%): both see red, so both press A. But no blue copy exists → payoff $0.
    - EU = (0.45 × $1000) + (0.45 × $1000) + (0.10 × $0) = $900.
  - **Policy 1: Always press A**.
    - In no-glitch cases: red-room presses A, but blue-room presses A (should be B) → payoff $0.
    - In glitch: both press A → payoff $0.
    - EU = $0.
  - **Policy 2: Always press B**.
    - Similar: EU = $0.
  - **Policy 4: Press B if red, press A if blue**.
    - In no-glitch cases: wrong actions (e.g., red-room presses B when it should be A) → payoff $0.
    - In glitch: both press B → $0.
    - EU = $0.
  - **A new policy: Press B if red, but press B if blue** (always B, but let's formalize).
    - Same as Policy 2: EU = $0.

  UDT still selects **Policy 3 (press A if red, press B if blue)** with EU $900, as it's the best. When executed:
  - If a copy sees red (which could be in no-glitch-red or glitch), it presses A.
  - If a copy sees blue (only possible in no-glitch), it presses B.
  - In no-glitch worlds: they coordinate and get $1000 each.
  - In glitch world: both press A, but no payoff (as required, since there's no blue copy).

  **What about the copy that sees red?**
  - After seeing red, a copy's posterior belief is:
    - P(glitch | see red) = P(glitch) / P(see red) = 10% / 55% ≈ 18.2% (since P(see red) = P(glitch) + P(no glitch and red) = 10% + 45% = 55%).
    - P(no glitch and I am red | see red) = 45% / 55% ≈ 81.8%.
  - If this copy were using standard Bayesian updating (like in Evidential Decision Theory, EDT), it might think: "With 18.2% chance, pressing A is useless (glitch); with 81.8% chance, pressing A is necessary for $1000." EDT would likely still press A, as it's the best action given the evidence.
  - But UDT doesn't reassess the decision here. It follows the pre-committed policy (press A if red) because that policy was chosen to maximize EU under the prior. Deviating (e.g., pressing B if red) would be disastrous in the no-glitch case (where you're likely the red copy) and gains nothing in the glitch case.

  **Key takeaway:** UDT uses evidence (the light color) through the policy, but the policy is "locked in" based on prior-weighted EU. In the glitch case, pressing A when seeing red seems "wasted," but it's necessary for the high-payoff no-glitch case. UDT doesn't ignore evidence—it bakes the optimal use of evidence into the policy upfront.

  ### 3. **Why This Isn't CDT or EDT, and What "Updateless" Means**
  You worried that UDT might just be "ordinary causal decision theory with Bayesian updating bolted on." It's not. Here's the distinction:
  - **Causal Decision Theory (CDT)**: Ignores correlations and focuses on causal effects. In the red/blue case, CDT might say: "My action doesn't *cause* the other copy's action, so I should ignore the light and choose arbitrarily." This could lead to always pressing A or B (EU $0), failing coordination. CDT fails here because it doesn't handle acausal coordination (your action and the other copy's are correlated through the shared policy).
  - **Evidential Decision Theory (EDT)**: Conditions on observations and maximizes EU given the evidence. In red/blue, EDT would press A if seeing red (as evidence you're likely the red copy) and B if seeing blue. This works here, but EDT fails in other cases (e.g., Newcomb's Problem where conditioning on the prediction makes one-boxing seem good, but EDT can be exploited in dynamic situations).
  - **UDT**: Chooses a policy using the prior (not conditioning on any specific observation), then executes it. The policy handles evidence by design. "Updateless" specifically means:
    - **No belief update for policy evaluation**: When ranking policies, we use the full prior distribution (e.g., 50/50 red/blue without glitch, or 10/45/45 with glitch). We don't say, "Given I saw red, which policy is best?"—that would be updating.
    - **Policies can (and must) depend on observations**: The function π(observation) → action allows UDT to respond to evidence, but the choice of π is "updateless."
    - "UDT updates beliefs but not its decisions": This is partially accurate but needs nuance. Once a policy is chosen, UDT agents *can* update beliefs about the world (e.g., a copy seeing red updates its self-location beliefs). But it doesn't use those updated beliefs to redefine the decision—it just applies π(observation). The *decision rule* (the policy) is fixed from the start. In contrast, EDT and CDT *do* use updated beliefs to make decisions on the fly.

  **How UDT differs in philosophy**: CDT and EDT treat decisions as isolated acts conditioned on current knowledge. UDT treats decisions as part of a global strategy (the policy) chosen before any observations. This handles predictors, copies, and acausal links better because it considers all possible observations at once.

  ### 4. **Everyday Decisions: Does UDT Matter?**
  For mundane choices (e.g., "take an umbrella if rain is forecast"), UDT often reduces to standard decision theory (CDT or EDT) in practice. But it's not just for sci-fi—it provides a unified framework. Let's use your umbrella example:
  - **Setup**: You must decide whether to take an umbrella. You might hear a weather forecast (rainy or sunny). Actual weather affects your utility (e.g., wet if no umbrella in rain).
  - **UDT approach**:
    - Define a policy: e.g., "If forecast is rainy, take umbrella; if sunny, don't take."
    - Evaluate under the prior: Use historical data or beliefs about P(forecast, actual weather). E.g., if forecasts are 80% accurate, EU(policy) = P(forecast=rain, actual=rain) × utility(take umbrella) + P(forecast=rain, actual=sunny) × utility(take umbrella) + ... (similar for sunny forecast).
    - Choose the policy with highest prior EU.
  - **Execution**: When you hear the forecast, you follow the policy (e.g., if you hear "rainy," take umbrella). You don't recompute the best action given the forecast—you just apply the policy.
  - **Why it feels like CDT/EDT**: In simple cases, the UDT-optimal policy matches what CDT or EDT would do after updating. For example, "take umbrella if forecast rainy" is common sense. UDT shines when conditioning leads to paradoxes (e.g., Newcomb, where conditioning on the prediction makes two-boxing seem causal but ignores the predictor's acausal link). In umbrella-like cases, UDT isn't revolutionary—but it's consistent and general.

  **When UDT adds value**: In decisions involving:
  - Predictors (e.g., Newcomb's Problem).
  - Copying or acausal coordination (e.g., your red/blue case).
  - Pre-commitment (e.g., counterfactual mugging, where you commit to pay if asked).
  UDT avoids self-defeating behavior by optimizing the policy globally.

  ### Summary
  - **In the red/blue case**: UDT agents press A if they see red and B if they see blue, winning $1000 each (or $900 with glitch). This uses evidence (the light) but selects the policy using the prior. "Updateless" doesn't mean ignoring evidence—it means not conditioning the policy *evaluation* on observations.
  - **Core confusion resolved**: UDT policies *are* observation-sensitive, but chosen updatelessly. This isn't CDT/EDT; it's a different way to handle acausal links and coordination.
  - **Everyday decisions**: UDT works and often matches intuition, but its unique benefits appear in "weird" decision problems. The apparatus isn't wasted—it ensures consistency across all scenarios.

  If this still feels slippery, you're not alone! UDT is subtle, and even experts debate it. For your group: try computing EU for policies in the glitch case step by step—it helps. Also, Wei Dai's original UDT writeup or Yudkowsky's "Timeless Decision Theory" might clarify. Keep puzzling—it's worth it!
