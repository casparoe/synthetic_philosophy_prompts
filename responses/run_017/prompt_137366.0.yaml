  In state B: copy1 sees blue, does π(blue); copy2 sees red, does π(red). Utility = 1000 if π(blue)=B and π(red)=A? Let's see: in state B, we have blue-room copy (copy1) and red-room copy (copy2). We need blue-room to press B and red-room to press A. Since copy1 sees blue and does π(blue), copy2 sees red and does π(red), so utility = 1000 if π(blue)=B and π(red)=A, else 0.

  But since π(red)=A and π(blue)=B is the same condition as in state R, in state B we need π(red)=A and π(blue)=B for utility 1000.

  State B: copy1 is blue-room, so needs to press B; copy2 is red-room, needs to press A. So if π(blue)=B and π(red)=A, then good.

