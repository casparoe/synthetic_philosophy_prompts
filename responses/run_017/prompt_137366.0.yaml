  The prior: before any observation, the agent (the original) considers the possible worlds. After copying, there are two copies, but we are to think from the original's perspective about what policy to adopt for both copies.

  In UDT, we consider the entire decision problem. The agent (before copying) chooses a policy that will be used by both copies. Each copy will use this policy, inputting their own observation.

  So, for a given policy, what is the expected utility?

