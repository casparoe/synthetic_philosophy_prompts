  The user's confusion is about how UDT can be "updateless" and yet still have the policy depend on observations. They worry that if the evaluation is done with the prior and not conditioned on the observation, then UDT might ignore evidence, which would be bad.

  Key points from UDT:

  - UDT chooses a policy (a function from observations to actions) that maximizes expected utility according to the prior probability distribution.
  - The policy itself can depend on observations, but the selection of the policy is done without conditioning on any particular observation. That is, we consider the expected utility over all possible observations when evaluating a policy.

  In other words, UDT does not update the probability distribution used to evaluate policies based on what observation actually occurs. However, the policy it chooses can and must map different observations to different actions when that is beneficial.

  Let's apply this to the red/blue light scenario.

  Scenario without glitch:

