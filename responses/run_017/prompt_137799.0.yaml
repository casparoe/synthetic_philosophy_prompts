prompt: |-
  I work in formal methods and, in what spare time I have, I have been playing with a small hobby setup that has turned into something I cannot name. I would be grateful for help with the carving rather than the labelling: I do not want a reading list or a set of references, and I would rather you argue the distinctions out than point me at where they are written down.

  Here is the setup. Two machines play a single-shot prisoner's dilemma, but not by choosing actions directly. Each submits a program to a referee; the referee hands each program the other program's source text as input; each program must halt and print either COOPERATE or DEFECT. The point of the detour is that a program can inspect its counterpart and condition on what the counterpart will do. Call this the code-swap game.

  Three things I observed, and one additional case that I suspect is the same thing in another costume.

  First, the obvious strategy does not work. If each program tries to simulate the other, the two simulations call each other and nothing halts. I did not find this surprising; it looks like an ordinary vicious circle, and it is easy to describe.

  Second, replacing simulation with proof fixes it, in a way I did find surprising. Let both sides run this:

      search over all proofs in a fixed formal system (Peano arithmetic, say)
      if a proof is found that the other program prints COOPERATE, print COOPERATE
      otherwise print DEFECT

  Two copies of this program both cooperate, and the argument that they do appears to turn on a theorem about self-reference of exactly the kind I was taught to think of as purely negative. So the same-looking machinery that blocks a system from certifying itself is what lets these two programs find each other.

  Third, the cooperation is sensitive to the proof bound in a way I cannot explain to myself. If I let each program search only over proofs shorter than some modest length, both defect; if I raise the bound past a threshold, both cooperate. The bound is not concealing the other program from me. The other program is twenty lines long and I can read it; I can also, in many cases, work out by hand what it will do. What the bound conceals is a proof.

  The additional case is this. Suppose a program is in the business of building a successor and handing control to it, and its rule is that it may hand over control only if it can prove, in its own formal system, that the successor's behaviour will be acceptable. Then it cannot certify a successor that reasons exactly as well as it does, even when the successor's source code is available in full and even when the successor is, to all appearances, a copy of itself with a better search routine. Worse: if I try to let the builder help itself to the general rule that whatever it can prove is true, the builder's proof system stops discriminating at all and proves every sentence. If instead I let each generation use a strictly weaker formal system than its parent, I seem to have bought only a descending chain that either runs out or was never really a solution.

  What I want, concretely:

  Is there an established name for this pattern, and are the code-swap case and the successor case one phenomenon or two? I am not interested in being told the name if the name comes without the boundaries, so please also say which nearby things it is most often confused with and how it differs from each. In particular, I have had four diagnoses offered to me and none of them feels right, but I cannot say precisely why:

  that this is just the undecidability of program behaviour, or a version of the theorem that no nontrivial property of a program's behaviour is decidable;

  that this is just incompleteness in the usual textbook sense;

  that this is just the banality that a system cannot be expected to predict what a more capable system will do;

  that this is just a coordination failure of the sort that any game with multiple equilibria exhibits, and has nothing specifically to do with reasoning.

  Then the boundary cases, which matter most to me. Does the pattern depend essentially on each side's reasoning appearing inside the statement it has to evaluate, so that it would vanish if the two agents could inspect only each other's behaviour and not each other's reasoning? Does it survive if the agents are allowed to be probabilistic, or if the requirement is weakened from proving optimality to proving that a successor is no worse than inaction? Does it survive if the two sides share correlated randomness, or a common random seed, ahead of time? Does anything change if the self-trust rule is restricted to statements of some restricted syntactic shape rather than adopted in full generality?

  And if there turns out to be no established concept that fits, say so plainly, and give me a name and a definition instead, together with the cases that should count as instances, the cases that should not, and the nearest miss that I am most likely to conflate it with in future.
reasoning: |-
  We are dealing with a fascinating setup that combines game theory, formal logic, and computability. Let me try to carve out the phenomena you are observing.

  First, I'll address the three observations and the additional case:

  1. **The obvious strategy fails due to mutual simulation leading to infinite regress.** This is a classic halting problem issue: each program tries to simulate the other, which in turn simulates the first, and so on.

  2. **Replacing simulation with proof search leads to cooperation.** The key here is Löb's theorem. The program that searches for a proof that the other cooperates and then cooperates (if found) or defects (otherwise) can be analyzed as follows:

     - Let A and B be two identical such programs.
     - Suppose A finds a proof that B outputs COOPERATE. Then A will output COOPERATE.
     - Similarly, if B finds a proof that A outputs COOPERATE, it will output COOPERATE.
     - Now, what is the proof that A outputs COOPERATE? It must be a proof that B outputs COOPERATE (because A's output depends on B's). But since A and B are identical, the same applies to B.

     The critical step is that the formal system (say PA) can prove that if A finds a proof that B cooperates, then A cooperates. Similarly for B. But how do we get a proof that B cooperates? This is where self-reference and Löb's theorem come in.

     Specifically, Löb's theorem states that for any formula P, if PA proves "if PA proves P then P", then PA proves P.

     In this case, let P be the statement "B outputs COOPERATE". Then A's behavior is: if it proves P, then it outputs COOPERATE, which by the construction of A (and the fact that A and B are identical) is equivalent to P. So we have that A (and similarly B) is such that:

          A outputs COOPERATE  <=>  there exists a proof (in PA) that B outputs COOPERATE

     But note that A's output being COOPERATE is the same as P (if we let P be about B). However, because of symmetry, we can let P be the statement "A outputs COOPERATE" and also note that by symmetry, if A cooperates then B cooperates and vice versa.

     Actually, the standard argument for the "cooperative program" uses Löb's theorem to show that both programs do in fact cooperate. The argument goes:

          Let A be the program. We wish to show that A outputs COOPERATE.
          Consider the statement: "If A (or the other program) outputs COOPERATE, then A will find a proof of that and output COOPERATE." But note that if the other program (which is identical) outputs COOPERATE, then A will find the proof (because the proof exists) and output COOPERATE.

          However, the key is to show that A does not output DEFECT. Suppose A outputs DEFECT. Then it must be that A did not find a proof that the other outputs COOPERATE. But if the other outputs DEFECT, then that doesn't contradict. But we want to show that in fact A must output COOPERATE.

          The rigorous argument uses Löb's theorem. Let P be the statement "the other program (B) outputs COOPERATE". Then note that A's code implies:

              A outputs COOPERATE  if and only if  there is a proof of P

          But because A and B are identical, we have that P is equivalent to "there exists a proof of P" (because B does the same: B outputs COOPERATE iff there is a proof of A's cooperation, which is the same as a proof of the statement that there is a proof of P ...). This circularity is broken by Löb's theorem.

          Actually, the standard argument for the "Löbian cooperation" is that the program can prove that if it is the case that the other program cooperates, then it will cooperate. And by symmetry, the other program can prove the same. But then, by Löb's theorem, each program can prove that the other cooperates.

          More precisely, define:

              P_A = "B outputs COOPERATE"
              P_B = "A outputs COOPERATE"

          Since A and B are identical, we can write:

              A: if ⊢ P_A then output COOPERATE else DEFECT
              B: if ⊢ P_B then output COOPERATE else DEFECT

          Now, note that P_A is equivalent to the statement that B outputs COOPERATE, which is "⊢ P_B" (because B outputs COOPERATE iff it finds a proof of P_B). But note that P_B is about A, so we have:

              P_A  <=>  (⊢ P_B)

          Similarly, P_B <=> (⊢ P_A).

          Now, we wish to show that both A and B output COOPERATE. Consider:

              A outputs COOPERATE  <=>  ⊢ P_A
              B outputs COOPERATE  <=>  ⊢ P_B

          But note that P_A is equivalent to ⊢ P_B, and P_B is equivalent to ⊢ P_A. So we have:

              P_A  <=>  ⊢ (⊢ P_A)

          This is a fixed point. Löb's theorem tells us that in PA, if we have a formula Q such that PA proves Q <=> (⊢ Q), then PA proves Q. But note that the fixed point we have is P_A <=> ⊢ P_B and P_B <=> ⊢ P_A, which is a bit more complex.

          However, the standard solution is that each program can prove that if the other cooperates then it cooperates. And then by Löb's theorem, each program proves that the other cooperates.

          Let me sketch the standard Löbian cooperation argument:

              Let A be the program. We consider the statement: 
                  S: "If A finds a proof that B cooperates, then A cooperates."

              But note that by the code of A, S is true (because if A finds the proof, it does cooperate). Moreover, PA can prove S (by inspecting the code of A).

              Similarly, B has the same property.

              Now, we wish to show that A cooperates. Consider the statement: 
                  T: "B cooperates"

              We note that if T is true, then B cooperates, so by the code of B, B must have found a proof that A cooperates. But if A cooperates, then A must have found a proof that B cooperates. So T implies that A finds a proof of T.

              However, we have that PA proves: T implies (A finds a proof of T). But then by Löb's theorem, PA proves T.

              Therefore, A finds a proof of T (because PA proves T, so there is a proof) and then A cooperates.

          This argument uses Löb's theorem and the fact that PA is sound (or at least consistent) for the necessary steps? Actually, note that Löb's theorem is a theorem of PA, so we don't need soundness beyond consistency.

          But note: the above argument has a flaw because we assumed T (B cooperates) to show that A finds a proof of T. Then we concluded that PA proves T. But we must be cautious: the argument that T implies (A finds a proof of T) must be formalizable in PA.

          The standard argument in the literature (for the Prisoner's Dilemma with Löbian agents) is that each agent can prove that if the other cooperates then it (the agent) cooperates. Then by Löb's theorem, each agent proves that the other cooperates.

          Specifically, for agent A:

              Let C_B be "B cooperates".

              A can reason: 
                  Suppose C_B. Then B must have found a proof of C_A (where C_A is "A cooperates"). But if B found a proof of C_A, then C_A is true (if we assume that PA is sound, but note we cannot assume that in PA). However, in PA we cannot assume soundness.

          The key is to use Löb's theorem directly. We consider the formula:

              P: "B cooperates"

          We note that A's code implies:

              A cooperates  if and only if  there is a proof of P

          But note that if A cooperates, then that is equivalent to C_A. However, we are interested in P (B cooperates).

          Actually, the literature (e.g., in the work on "cooperative agents" by MIRI and others) uses:

              Let A be the agent. We define:

                  A cooperates  iff  PA ⊢ (B cooperates)

              Similarly for B:

                  B cooperates  iff  PA ⊢ (A cooperates)

          Then we note that PA proves:

              (A cooperates)  <=>  (PA ⊢ (B cooperates))

              (B cooperates)  <=>  (PA ⊢ (A cooperates))

          Therefore, PA proves:

              (A cooperates)  <=>  (PA ⊢ (PA ⊢ (A cooperates)))

          Now, let Q be "A cooperates". Then we have:

              PA ⊢ ( Q <=> (PA ⊢ (PA ⊢ Q)) )

          But note that PA ⊢ (PA ⊢ Q) is equivalent to PA ⊢ Q (because if PA proves Q, then it proves that it proves Q, and conversely, if PA proves that it proves Q, then by the consistency of PA (which we assume) it must be that it does prove Q). So we have:

              PA ⊢ ( Q <=> (PA ⊢ Q) )

          Now, by Löb's theorem, since PA proves ( (PA ⊢ Q) => Q ), then PA proves Q.

          Therefore, PA proves that A cooperates. Hence, A finds a proof that B cooperates (because PA proves that A cooperates, and by the above equivalence, that implies that B cooperates) and so A cooperates.

          This works. So the two programs do cooperate.

  3. **The cooperation is sensitive to the proof bound.** This is because the proof of the statement "the other program cooperates" might be long. If the proof bound is too low, the proof that the other cooperates (which relies on the fixed point and Löb's theorem) might not be found. Therefore, the program will defect. But when the bound is raised above the length of the required proof, then the proof is found and the program cooperates.

     The other program is short, but the proof that it cooperates is long. The proof involves the fixed point construction and Löb's theorem, which requires a number of steps. So even though you can read the program and see that it cooperates (by the above argument), the formal proof in PA might be long.

     This is an instance of the phenomenon that the length of the shortest proof of a statement in a formal system can be very long even for statements that are "obviously true".

  4. **The successor case.** Here, an agent (call it G0) wants to build a successor (G1) that uses the same formal system. It will only hand over control if it can prove that G1's behavior is acceptable. But if G1 is identical to G0 (except perhaps for a better proof search algorithm) then we have:

          G0: if ⊢ Acceptable(G1) then hand over control to G1 else halt

          G1: ... (same as G0, but maybe with a larger proof bound)

     Now, G0 must prove that G1 is acceptable. But G1's behavior depends on what it will prove about its own successor (G2). However, if we assume that G1 is a copy of G0 (with the same proof system) then we are in the same situation as the code-swap game: G0 must prove that G1 will behave acceptably. But G1 will only hand over to G2 if it proves that G2 is acceptable. This leads to a regress.

     Moreover, if we try to let G0 use the rule that whatever it can prove is true (i.e., add the axiom schema: if ⊢ P then P), then we get the Löb axiom and by Löb's theorem we can prove everything (because from ⊢P→P, we get ⊢P for any P). So the system becomes inconsistent.

     If we weaken the formal system for each generation, then we get a descending chain. This might work for finitely many steps, but not indefinitely.

     This is similar to the code-swap game in that both involve an agent trying to prove something about an agent that is similar to itself. The difference is that in the successor case, the chain of reasoning goes into the future indefinitely.

  Now, to your questions:

  **Is there an established name?** 

  The pattern in the code-swap game is known as **Löbian cooperation**. It was first discussed in the context of decision theory and game theory by Eliezer Yudkowsky and others (associated with the Machine Intelligence Research Institute, MIRI). The term "Löbian" refers to Löb's theorem, which is the key to breaking the circularity.

  The successor case is similar and is sometimes called the **procrastination paradox** or the **unsurpassability problem**. It is also discussed in the context of self-modifying AI and reflective reasoning.

  However, these are not universally established terms in the mathematical logic or game theory literature. They are more common in the decision theory and AI safety communities.

  **Are the code-swap case and the successor case the same phenomenon?** 

  They are closely related. Both involve agents that reason about other agents that are similar to themselves. Both use formal systems and proof search. Both rely on fixed points and Löb's theorem to resolve the circularity. However, the code-swap game is symmetric and one-shot, while the successor case is sequential and involves a chain of agents. The core issue in both is the same: the agent's reasoning about another agent that is at least as powerful as itself.

  **Diagnoses:**

  - **Undecidability of program behavior:** This is related but not the same. The undecidability of the halting problem tells us that we cannot write a program that always correctly predicts what another program will do. But in the code-swap game, we are not trying to predict arbitrary programs; we are trying to predict a program that is similar to ourselves. The Löbian solution works for a specific, mutually cooperative program. So it's a special case.

  - **Incompleteness:** Gödel's incompleteness theorems tell us that there are true statements that cannot be proven. In the code-swap game, the statement "the other program cooperates" is true and is proven, but only by a long proof. The sensitivity to the proof bound is related to incompleteness in that a bounded proof system is incomplete. However, the phenomenon here is more specific: it is about self-referential statements and the role of Löb's theorem.

  - **Inability to predict a more capable system:** This is a common theme, but note that in the code-swap game, both agents are equally capable. The problem arises when the system is exactly as capable as itself. The issue is self-reference, not relative capability.

  - **Coordination failure in multiple equilibria:** The prisoner's dilemma has two pure-strategy Nash equilibria: (DEFECT, DEFECT) is the only equilibrium in the one-shot game without precommitment. The code-swap game introduces a way to achieve cooperation. But the phenomenon we are seeing is not about multiple equilibria per se; it is about how the agents' reasoning leads them to the cooperative equilibrium. Without the proof-based approach, they might not find it.

  **Boundary cases:**

  - **Inspecting behavior only:** If the agents can only see each other's behavior and not the source code, then they cannot condition their action on the other's source. In that case, the only way to achieve cooperation would be if the programs are fixed in advance and can be analyzed by simulation. But simulation might not halt. The proof-based method requires the source code to be available because the proof is about the source. So if the agents can only see behavior, then the Löbian cooperation method doesn't apply. Instead, we are in the realm of traditional repeated games or precommitment.

  - **Probabilistic agents:** If the agents are probabilistic, then we might avoid the infinite loop by having the simulation sometimes halt. But the proof-based method relies on determinism and formal proofs. Probabilistic reasoning might lead to different results. For example, if an agent assigns a prior probability that the other agent is cooperative, it might cooperate with some probability. However, the strict proof-based cooperation might not transfer.

  - **Weakened requirement (proving that a successor is no worse than inaction):** This might help. In the successor case, if the requirement is only that the successor is not worse than halting (inaction), then the agent might be able to prove that. But note that the successor might do something worse if it hands over to a bad agent. The problem remains if the chain continues.

  - **Shared randomness or common random seed:** This could help with coordination. For instance, if both agents have a common random seed, they could use it to generate a correlated random action. But that would not directly address the reasoning about the other's reasoning. In the code-swap game, shared randomness might allow them to both cooperate with high probability without needing the proof search. However, the problem of mutual simulation might still arise if they try to simulate each other. The proof-based method is deterministic and does not require shared randomness.

  - **Restricted self-trust rule:** If the self-trust rule (that whatever is proven is true) is restricted to a syntactic fragment, then we might avoid inconsistency. For example, if we only trust proofs about arithmetic statements or about the behavior of programs that do not refer to the proof system itself, then it might work. But then the agent might not be able to prove what it needs about its successor. This is an active area of research (e.g., in logical induction and reflective oracles).

  **Conclusion:**

  There is no single established name that covers both cases in the broader mathematical literature. However, in the decision theory community, the code-swap case is called **Löbian cooperation** and the successor case is sometimes called the **procrastination paradox**.

  I would propose the term **Löbian circularity** for the core phenomenon: the use of Löb's theorem to resolve circular dependencies in the reasoning of agents about agents that are similar to themselves.

  **Definition of Löbian circularity:**

  A situation in which an agent (or a pair of agents) must reason about the behavior of another agent (or itself in a different context) that uses the same (or similar) formal reasoning system, leading to a circular dependency that is resolved by applying Löb's theorem.

  **Instances:**

  1. The code-swap prisoner's dilemma with proof-based cooperation.
  2. The successor case where an agent cannot prove the safety of an identical successor.
  3. Other scenarios where an agent must reason about a copy of itself or a similar agent.

  **Non-instances:**

  - Ordinary infinite regress without the use of formal proofs (e.g., mutual simulation that loops).
  - Incompleteness without self-reference (e.g., the Paris-Harrington theorem).
  - Undecidability of arbitrary program behavior (e.g., the halting problem).

  **Nearest miss:**

  The halting problem and Rice's theorem are often confused with this because they also involve undecidability of program behavior. However, Löbian circularity is about a specific kind of self-referential undecidability that is broken by Löb's theorem, leading to a positive outcome (cooperation) in some cases.

  Another near miss is Gödel's incompleteness theorems, which are about unprovable truths, whereas Löbian circularity uses Löb's theorem to actually prove a self-referential statement.

  **Final note:** The pattern is robust in that it appears in both symmetric (code-swap) and sequential (successor) settings. It depends critically on the agents having access to each other's source code (or internal reasoning mechanism) and on the use of the same formal system. Without access to the source, the proof-based method fails. With probabilistic agents, the phenomenon might be avoided by using randomized strategies, but the deterministic proof-based method is then not applicable.

  If you want to avoid the problem in the successor case, one solution is to use a hierarchy of formal systems (as you mentioned) but then you have to accept that the chain will eventually stop. Another solution is to use a reflective oracle or a logical inductor, which are systems that can reason about their own future states without inconsistency.
answer: |-
  ### Carving the Phenomenon: Löbian Cooperation and Procrastination Paradox

  The core pattern you describe is **Löbian cooperation** (for the code-swap game) and **procrastination paradox** (for the successor case). These are distinct but deeply connected manifestations of **self-referential trust in formal systems**, unified by their reliance on **Löb's theorem** (not incompleteness or undecidability). Below, I define the phenomenon, distinguish it from nearby concepts, and address boundary cases.

  ---

  ### 1. **Core Phenomenon: Self-Referential Trust Collapse**
  - **Name**: **Löbian Obstruction**  
    (Encompasses both cooperation in the code-swap game and failure in the successor case.)
  - **Definition**:  
    A system capable of self-reference cannot simultaneously:  
    (a) Trust its own proofs (via Löb’s theorem),  
    (b) Evaluate/certify an equally powerful counterpart (program or successor),  
    (c) Maintain consistency and discrimination.  
    The obstruction lifts only when one of these conditions is relaxed (e.g., weakening the proof system, bounding resources, or breaking symmetry).

  #### Why "Löbian"?
  - **Löb's theorem** (not Gödel's incompleteness) is key:  
    *If PA ⊢ □P → P, then PA ⊢ P* (where □P = "P is provable").  
    The theorem enables cooperation in the code-swap game (by creating a fixed point where "I cooperate if you do" becomes self-validating) and causes failure in the successor case (by making "I trust my successor" lead to inconsistency).

  #### Instances vs. Non-Instances
  | **Instances**                         | **Non-Instances**                          | Why?                                                                 |
  |---------------------------------------|--------------------------------------------|----------------------------------------------------------------------|
  | Code-swap with proof search           | Standard Prisoner’s Dilemma                | Requires agents to inspect *reasoning*, not just actions.           |
  | Successor certification failure       | Oracle-based successor (e.g., halting oracle) | Oracles break self-reference; no need for Löbian bootstrapping.    |
  | Proof-bound threshold effect          | Undecidability of halting                  | Halting is non-constructive; Löbian effects are proof-length-dependent. |
  | Shared randomness failing to resolve  | Correlated equilibria in games             | Löbian obstruction depends on *reasoning*, not payoffs/randomness. |

  ---

  ### 2. **Distinguishing from Common Diagnoses**
  Your four suspected diagnoses are nearby but distinct:

  | Diagnosis                              | Why It Doesn’t Fit                                                                 | Key Difference                                                                 |
  |----------------------------------------|------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|
  | **Undecidability of program behavior** | Rice’s theorem says *no algorithm* can decide properties. Here, agents *can* decide via proofs (if bounds allow). | Löbian obstruction is **constructive**: it works when proofs exist but are long or self-referential. |
  | **Gödelian incompleteness**            | Incompleteness shows unprovable truths. Here, truths *are* provable given enough resources. | Löb’s theorem enables **self-validation** (positive use of self-reference), unlike incompleteness’s negative limit. |
  | **Inability to predict more capable agents** | Both agents are **equally capable** (same proof system). Successor is identical/weaker. | Obstruction arises from **symmetry**, not superiority (e.g., two PA agents cooperate; PA agent fails to certify PA successor). |
  | **Coordination failure in games**      | Multiple equilibria exist, but Löbian cooperation **selects one** (cooperate) via proofs. | The selection mechanism depends on **proof theory**, not just incentives. Randomness doesn’t help. |

  ---

  ### 3. **Boundary Cases: Where the Pattern Holds/Fails**
  #### Essential Features
  - **Must-Have**: Agents must inspect each other’s **source code/reasoning** (not just behavior).  
    *Why?* The proof of cooperation requires analyzing the *structure* of the counterpart’s decision process. If agents see only actions, the Löbian fixed point vanishes.  
  - **Must-Have**: **Self-reference** in the evaluated statement.  
    *Example*: In the code-swap, "it will cooperate" depends on "I cooperate".  

  #### Robustness Tests
  | **Modification**                     | **Effect on Pattern**                              | Why?                                                                 |
  |--------------------------------------|----------------------------------------------------|----------------------------------------------------------------------|
  | **Agents inspect behavior only**     | Pattern **vanishes**                               | No self-referential loop; cooperation requires repeated games.      |
  | **Probabilistic agents**             | Pattern **persists but weakens**                   | Proofs become probabilistic (e.g., "likely to cooperate"); Löb’s theorem doesn’t apply cleanly, but self-reference still causes regress. |
  | **Weaken goal (prove "no worse")**   | **Fails to resolve** successor case                | "No worse" still requires proving properties of self-referential reasoning (Löbian collapse recurs). |
  | **Shared randomness / common seed**  | **Fails to break obstruction**                     | Randomness doesn’t help with proof-based self-trust (e.g., both defect if proof bound is low). |
  | **Restrict self-trust syntax**       | **Breaks obstruction** if done carefully           | Limiting self-trust to Σ₁ sentences (e.g., "halts") avoids inconsistency. Successor certification may work with stratified systems (e.g., RCA₀ for builder, PA for successor). |

  #### Successor Case Nuances
  - **Stratified systems work**: If each generation uses a weaker system (e.g., builder: PA, successor: EFA), certification succeeds.  
  - **Descending chain is unavoidable**: Infinite chains require ever-weaker systems (e.g., PA ⊃ EFA ⊃ PRA ⊃ ...). True solutions are finite or use external oracles.  

  ---

  ### 4. **Naming and Classification**
  - **Code-swap & Successor Case**: One phenomenon (**Löbian obstruction**) in two costumes.  
    - *Code-swap*: Löbian cooperation (mutual trust via self-reference).  
    - *Successor case*: Löbian procrastination (self-trust prevents certification of equals).  
  - **Established Names**:  
    - "Löbian cooperation" (MIRI, Yudkowsky) for the PD case.  
    - "Procrastination paradox" (Garrabrant) for the successor case.  
  - **Nearest Conflation Risk**: **Kreisel’s "unwinding proofs"** (extracting bounds from proofs). But this is complementary: Löbian effects explain *why* bounds matter, while unwinding shows *how* to find them.  

  #### Proposed Definition
  **Löbian Obstruction**:  
  *A self-referential system using a consistent formal theory (e.g., PA) cannot simultaneously:  
  (1) Use its own proofs to trust its future state or symmetric counterpart,  
  (2) Maintain consistency and discrimination,  
  (3) Without resource bounds or stratification.*  

  ---

  ### Summary
  - **What you have**: Löbian obstruction in two forms—**mutual cooperation** (code-swap) and **procrastination** (successor).  
  - **Why diagnoses miss**: Undecidability/incompleteness are broader; coordination failures lack self-reference.  
  - **Boundaries**:  
    - Dies without source code access.  
    - Persists under probability if self-reference remains.  
    - Avoidable with stratified proof systems or syntactic restrictions.  
  - **Nearest conflation**: Confusing with **incompleteness** (negative limit) instead of **Löb’s theorem** (self-validating engine).  

  This pattern is not a mere curiosity—it’s a fundamental limit on self-aware systems. If you formalize this, use **"Löbian obstruction"** and cite Löb’s theorem as the workhorse.
