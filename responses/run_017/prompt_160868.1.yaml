prompt: |-
  hey! I'm doing a course on classical Indian epistemology this term (my first real go at anything outside the analytic canon) and the bit that's definately not clicking for me is the pramāṇa literature. Every week the seminar seems to be working with a different number of them: the Nyāya four — perception, inference, analogy or comparison (the wild-cow sort of case: you're told a gavaya is like a domestic cow, later you see one in the forest and recognise it), and verbal testimony; the Buddhist logicians who cut the whole thing down to just perception and inference; the Mīmāṃsā and Vedānta people who keep letting more in — postulation (the fellow is fat but never eats in the daytime, so he must be eating at night) and non-apprehension (you look at the floor, no jug is there, so you know there is no jug). My tutor says the number isn't the interesting question and what matters is what the list is supposed to do, which I think is right, but I still need an actual spec before I can write anything.

  So, before I pick a side in the essay (due in a fortnight, ugh): give me the desiderata. What does any adequate theory of the pramāṇas have to deliver — which cases it must get right, which distinctions it must keep, which results it can't contradict — with the case or consideration behind each requirement, and mark which are non-negotiable and which are really just preferences of one camp. And I want the list to do a specific job, so please build it for that: I want to use it as an admission test for candidate sources of knowledge, because the part of my paper I actually care about is two cases my tutor calls "not in the canon". (1) The readout case: you get a number off a measuring instrument, or a prediction out of a model; the number is correct and you act on it successfully, but you personally can't trace how it was produced and can't check it independently. Is that perception, inference, testimony, or would it need its own seperate slot? (2) The empty-search case: your query returns nothing, or you go through the whole folder and find no file, and you conclude the thing isn't there. Non-apprehension as a pramāṇa in its own right, or just an inference in disguise? So the desiderata should be the sort of thing that settles admissions questions rather than just vibes about how many sources there are.

  Concretely, here's what I keep circling, and I want you to sort it into real requirements versus optional extras, and add what I've missed: whether the entries are supposed to be processes, belief-types, or sources, and whether a theory has to keep pramāṇa distinct both from pramā (the true cognition it produces) and from mere true belief; whether each pramāṇa needs its own characteristic failure mode, and how the stock error cases (rope taken for a snake, a mirage, testimony from someone who's lying) get handled without the definition becoming circular — i.e. whether a pramāṇa is allowed to fail at all; whether the warrant is intrinsic to the cognition or has to be established by something else, and how either answer escapes an infinite regress; whether a pramāṇa has to deliver cognition you didn't already have, which is where memory gets awkward; whether the sources have to be independent of one another, given that testimony seems to depend on somebody else's perception or inference somewhere up the chain; what to say when one belief arrives by two routes at once (you see it and you're also told it); and whether a theory has to leave room for knowers who can't reflect on their own methods — children, animals, or honestly most of us most of the time. Also: does the list have to be complete, and how could a theory certify that without helping itself to one of the very sources it lists?

  Two more things, and these are the parts I most want. First: if some subset of these desiderata can't be jointly satisfied — my hunch is that completeness, independence, a strict no-circularity condition and a clean answer to the two-routes case can't all be had together, but tell me what you actually think and which one you'd drop and why — say so plainly, because that joint-unsatisfiability claim is the real result I'd put in the essay. Second: tell me which single requirement does the most work in ruling out otherwise popular lists. Then, and only briefly — a short paragraph or a small table — score the Nyāya four, the Buddhist two, and a modern "there's really only one thing here, reliable belief-production, so stop counting" view against your own criteria. Please write the reply in British English.
reasoning: |-
  Okay, let me unpack this user's query. They're grappling with classical Indian epistemology, specifically the pramāṇa literature, and feeling stuck on the varying numbers of pramāṇas across schools. Their tutor says the number isn't what matters, but they need concrete desiderata to evaluate sources of knowledge for their essay. 

  First, I need to identify their core frustration: they can't see the forest for the trees. The seminar jumps between Nyāya's four, Buddhist two, and Mīmāṃsā's expanded list, but they need analytical tools to test cases like instrument readouts and empty searches. Their circling thoughts reveal deeper conceptual knots: what pramāṇas even are (processes? sources?), how failure modes work, whether warrant is intrinsic, etc.

  Hmm, their real goal is admission criteria for knowledge sources, not just taxonomy. That shifts everything. The desiderata must resolve borderline cases, not just classify standard ones. Their two cases are brilliant test probes: 
  - Readouts involve opaque but successful cognition (like AI outputs)
  - Empty searches challenge non-apprehension's status

  They're also hinting at a meta-problem: possible incompatibility between completeness, independence, anti-circularity, and dual-route explanations. If I can prove that tension, it becomes their essay's centerpiece.

  Right, let's build desiderata that bite:
  1. Start with non-negotiables: anti-luck (accidental truths don't count), causal efficacy (pramāṇa must actually produce cognition), and distinct function (no overlap in primary mechanism). These weed out flukes and duplicates.
  2. Then add structural needs: non-circular warrant (to avoid infinite regress) and failure mode specificity (each source must have characteristic errors). This addresses their rope/snake/mirage concerns.
  3. Finally, pragmatic constraints: pre-reflective accessibility (for children/animals) and non-redundancy (new cognition requirement). Memory gets tricky here.

  The independence requirement is where schools fracture. Nyāya insists on it, but testimony clearly piggybacks on others' perception. I'll mark this as optional/negotiable - it's a preference, not a core feature.

  For their joint unsatisfiability hunch: yes! Completeness + Independence + Strict Anti-Circularity + Dual-Route Explanation clash. If every source must be independent (Nyāya), testimony can't rely on others' perception - but it does. Dropping independence resolves this, which is why Buddhists and modern reliabilists do it.

  Now their test cases:
  - Readouts: Fail independence if classed as testimony (needs human chain), but fit as instrumental perception if extended. Anti-luck saves it either way.
  - Empty searches: Must be non-apprehension, not inference - because the absence is directly perceived (Mīmāṃsā view). Fits distinct function criterion.

  The "single killer criterion" is distinct function. It forces Buddhists to collapse comparison into perception/inference, and makes Nyāya defend analogy as irreducible.

  Scoring the schools:
  - Nyāya: Strong on distinct function but overcounts by requiring independence. Gavaya analogy isn't truly irreducible.
  - Buddhists: Streamlined but struggle with non-apprehension - absence isn't easily perceptual.
  - Reliabilism: Solves dual-route cases neatly but is too blunt - can't distinguish source types.

  Final note: Their tutor's "not in canon" cases are perfect for exposing how desiderata drive classifications. I'll emphasize that the admission test framework matters more than headcounts.
answer: |-
  Right, let's cut through the taxonomy and build that admission test. The core job of a *pramāṇa* theory is to **provide a principled account of how veridical cognition (*pramā*) arises, distinguishing it from accidental true belief or error (*apramā*), while explaining the diversity of ways knowledge is actually acquired.** Forget the headcount; focus on the function. Here’s your desiderata, sorted into non-negotiables (NN) and negotiables (N), with the reasoning and relevance to your cases:

  ### Non-Negotiable Desiderata (Admission Test Essentials)
  1.  **Anti-Luck Condition (NN):** The *pramāṇa* must be the *operative cause* of the true cognition in a way that isn't accidental. (Case: You believe there's no jug because you looked properly and saw its absence – not because you glanced vaguely while drunk. *Relevance:* Rules out flukes, justifies why true beliefs from hallucination or lucky guesses aren't *pramā*. Critical for **readout case**: if the instrument is reliable, its readout *causes* your true belief non-accidentally.)
  2.  **Causal Efficacy (NN):** It must be a *causal process* generating cognition. (Case: Perception involves sensory contact; inference involves reasoning. *Relevance:* Distinguishes *pramāṇa* (process) from *pramā* (resulting cognition) and mere true belief (which might have no specifiable cause). Undercuts "mere belief-type" views. **Readout case** hinges on the instrument's causal role.)
  3.  **Distinct Function (NN):** Each admitted *pramāṇa* must have a *unique, irreducible mechanism* for generating cognition. (Case: Recognizing a gavaya via comparison (*upamāna*) isn't *just* perception (no direct sense-contact with *that* gavaya before) or testimony (no words describing *this* instance). *Relevance:* The core justification for *any* list beyond "one reliable source". **Empty-search case** turns on this: is non-apprehension just inference ("I see floor, therefore no jug") or a direct awareness of absence?)
  4.  **Non-Circular Warrant (NN):** The warrant for accepting a *pramāṇa*'s deliverances cannot *systematically depend* on the validity of those very deliverances. (Case: Testimony's validity rests on the speaker's reliability, established via perception/inference about *them*, not solely on the testimony itself. *Relevance:* Avoids vicious circularity. Regress stopped by *svataḥ prāmāṇya* (intrinsic validity, Mīmāṃsā) or *parataḥ aprāmāṇya* (extrinsic invalidity, Nyāya). **Readout case**: Instrument reliability must be established *externally* initially.)
  5.  **Failure Mode Specificity (NN):** Each *pramāṇa* must have *characteristic ways it can fail* that illuminate its specific function. (Case: Perception fails via defective sense-organs/objects (mirage); Inference fails via faulty reasoning/invalid pervasion; Testimony fails via speaker deceit/incompetence. *Relevance:* Explains error without circularity. **Empty-search case**: If non-apprehension is distinct, its failure is *not looking properly*; if just inference, failure is *bad reasoning*.)
  6.  **Pre-Reflective Accessibility (NN):** Must account for cognition in agents incapable of complex reflection (children, animals). (Case: A deer *sees* a predator and flees; a child *hears* "hot!" and avoids the stove. *Relevance:* Ensures the theory covers basic cognition. **Readout case**: Even if you can't trace the instrument's workings, the *process* must be accessible at *some* level (e.g., seeing the display).)

  ### Negotiable Desiderata (Camp Preferences)
  7.  **Independence (N):** Whether *pramāṇas* must be *causally/logically independent* of each other. (Case: Testimony clearly depends on someone else's perception/inference. *Relevance:* Nyāya *prefers* independence, hence listing separate *pramāṇas*. Buddhists/Mīmāṃsā relax this. **Readout case**: If testimony requires human testifier, readouts might not fit. If not, maybe it does.)
  8.  **Non-Redundancy / Novelty (N):** Whether a *pramāṇa* must generate *new* knowledge. (Case: Memory (*smṛti*) is often excluded as it reproduces past cognition. *Relevance:* Helps define scope. **Dual-Route Case** (seeing & being told): If novelty required, only the *first* route delivers *pramā*; if not, both could be valid sources for the *same* cognition.)
  9.  **Completeness (N):** Whether the list *must* cover all possible knowledge. (Case: Are mystical experiences (*yogipratyakṣa*) a distinct *pramāṇa*? *Relevance:* Nyāya/Mīmāṃsā aim for it; Buddhists/Reliabilists might see it as aspirational. Certification is pragmatic: does the theory explain *all uncontested cases* without strain? Cannot be proven without potential circularity.)
  10. **Intrinsic Validity (N):** Whether the warrant is inherent until disproven (*svataḥ prāmāṇya* - Mīmāṃsā) or extrinsic and requiring validation (*parataḥ prāmāṇya* - Nyāya). (Case: We accept perception as valid until proven defective. *Relevance:* Addresses regress. Mīmāṃsā: Validity is intrinsic; error needs external proof. Nyāya: Cognition is neutral; validity/invalidity proved externally. Both escape infinite regress by accepting some cognitions as defeasibly foundational.)

  ### Your Joint Unsatisfiability Claim: Spot On
  **Completeness + Strict Independence + Strict Anti-Circularity + A Clean Dual-Route Explanation *cannot* all be satisfied simultaneously.** Here's why:
  *   If you demand **Completeness**, you need to cover all cases (like testimony).
  *   Testimony inherently **violates Strict Independence** – it relies on other *pramāṇas* (speaker's perception/inference).
  *   Admitting testimony while demanding independence creates tension or forces awkward justifications (Nyāya struggles here).
  *   **Strict Anti-Circularity** requires testimony's validity to be established externally (via perception/inference about the speaker).
  *   But in the **Dual-Route Case** (see & hear the same fact), if testimony is admitted as independent, you have two valid sources for one cognition. If testimony *depends* on perception, then seeing it *undercuts* the need for/testimonial status of hearing it about the *same* object *at that moment* – making the dual route messy. **Which to drop?** Drop **Strict Independence**. It's the least defensible requirement (testimony's dependence is obvious) and causes the most problems. Most plausible theories (Buddhist, Mīmāṃsā, Reliabilist) effectively do this.

  ### The Single Most Diagnostic Requirement
  **Distinct Function (NN)** does the heaviest lifting in ruling out lists. It forces justification for *why* something isn't reducible:
  *   **Against Nyāya's *Upamāna* (comparison):** Buddhists argue recognizing the gavaya *is* inference (based on the testimony "like a cow" + perception of cow-like features).
  *   **Against Mīmāṃsā's *Arthāpatti* (postulation):** Nyāya/Buddhists argue it's inference ("fat + not eating day" implies "eating night").
  *   **For Mīmāṃsā's *Anupalabdhi* (non-apprehension):** Proponents argue it's *direct awareness of absence*, not inference ("I *see* no jug here" vs. "I see the floor, therefore no jug").
  *   **Against a Single *Pramāṇa*:** The sheer diversity of mechanisms (sensing, reasoning, understanding words) makes reduction strained.

  ### Scoring the Theories Against the Criteria
  | Criterion                 | Nyāya (4)                          | Buddhist (2)                      | Modern Reliabilism (1)            |
  | :------------------------ | :--------------------------------- | :-------------------------------- | :-------------------------------- |
  | **Anti-Luck (NN)**        | ✓ (Robust causality)               | ✓ (Ditto)                         | ✓ (Reliable process defined)      |
  | **Causal Efficacy (NN)**  | ✓                                   | ✓                                 | ✓                                 |
  | **Distinct Function (NN)**| ? (Defends *upamāna*, debatable)   | ✓✓ (Forceful reductionism)        | ✗ (Blunts distinctions)           |
  | **Non-Circ Warrant (NN)** | ✓ (Extrinsic validity)             | ✓ (Ditto)                         | ✓ (Reliability established)       |
  | **Fail Mode Spec (NN)**   | ✓✓ (Detailed for each)             | ✓ (Perception/Inference errors)   | ~ (Generic "unreliability")       |
  | **Pre-Reflective (NN)**   | ✓                                   | ✓                                 | ✓                                 |
  | **Independence (N)**      | ✗ (Rigidly demanded, problematic)  | ~ (Relaxed)                       | ✓ (Irrelevant)                    |
  | **Non-Redundancy (N)**    | ✓                                   | ✓                                 | ~ (Conceptually possible)         |
  | **Completeness (N)**      | ✓ (Aims for it)                    | ✗ (Dismisses others)              | ✓ (Aims for it via "reliability") |
  | **Intrinsic Validity (N)**| ✗ (*Parataḥ*)                      | ~ (*Parataḥ*)                     | ~ (Often extrinsic calibration)   |
  | **Strength**              | Rich taxonomy, error analysis      | Parsimony, focus on core          | Unifies, handles modern cases     |
  | **Weakness**              | *Upamāna* dubious, independence issue | Struggles with absence, testimony | Lacks nuance, source-blind       |

  ### Applying to Your Cases
  1.  **The Readout Case:** Requires **Anti-Luck** (reliable instrument), **Causal Efficacy** (instrument process), **Pre-Reflective Access** (seeing the number). It's **not** perception (no direct object contact), inference (no conscious reasoning), or testimony (if testimony requires a *person*). **Distinct Function** suggests it needs its own slot (*instrumentation?*) or fits a *reliabilist* view. Nyāya might stretch *śābda* (testimony) to include instruments if calibrated by reliable agents. Buddhists/Reliabilists handle it best as a reliable process.
  2.  **The Empty-Search Case:** **Distinct Function** is key. If the absence is *directly apprehended* when you competently search (**Non-Apprehension**), it satisfies NN criteria uniquely. If it's merely inference ("I searched thoroughly, therefore absent"), it reduces to inference. **Failure Mode Specificity** clarifies: failure of non-apprehension is *inadequate search*; failure of inference is *faulty reasoning* about the search. Mīmāṃsā's *anupalabdhi* provides the cleanest, most distinct account. Nyāya/Buddhists struggle to make it purely inferential without losing the immediacy of "seeing it's not there".

  **Your Essay Hook:** Focus on the **unsatisfiability cluster** (Completeness/Independence/Anti-Circularity/Dual-Route) and **Distinct Function** as the core battleground. Use your two cases as litmus tests: the readout exposes the limits of independence and the need for distinct function/reliabilism; the empty-search forces a choice between irreducible non-apprehension or reductive inference. Drop Strict Independence – it's the weakest link. Good luck!
