  ### (1) Brainstorm Dump: Discriminating Questions and Pruning  
  **Questions Considered:**  
  - **Inference Test (fat person):** Can you know unobserved causes (e.g., night eating) from observed effects (fatness, no daytime eating)? *Tests inference vs. reduction to perception/memory.*  
  - **Testimony Test (machine):** Can unreliable/impersonal sources (e.g., GPS) yield knowledge? *Tests testimony vs. reduction to inference.*  
  - **Comparison Test (gavaya):** Can matching a description to a new object yield knowledge (e.g., recognizing a gavaya)? *Tests comparison vs. reduction to perception/testimony/memory.*  
  - **Absence Test (perceptible):** Can you know the absence of perceptible things (e.g., no pot)? *Tests absence as irreducible perception/inference.*  
  - **Absence Test (imperceptible):** Can you know the absence of imperceptible things (e.g., no ghost)? *Tests if absence requires a unique source.*  
  - **Presumption Test (Devadatta):** Can resolving contradictions (e.g., “alive but not home”) yield knowledge? *Tests presumption vs. reduction to inference.*  
  - **Convergence Test (fire/smoke):** Can two sources (e.g., inferring fire, then seeing it) independently justify the same fact? *Tests if sources have exclusive domains.*  
  - **Correction Test (stick in water):** Can one source (e.g., touch) correct another (e.g., distorted vision)? *Tests source hierarchy and irreducibility.*  
  - **Language Test (half-understood):** Can partial testimony (e.g., foreign words) yield knowledge? *Tests testimony’s boundaries.*  

  **Pruning Rationale:**  
  - **Cut Convergence/Correction:** These don’t directly affect the *number* of sources (focus of the tree) but reveal source interactions. Moved to leaf-table notes.  
  - **Cut Language Test:** Redundant with testimony cases; machine/stranger cases cover reliability issues.  
  - **Cut Presumption Test:** The fat person case (in Node 1) already covers presumption-like reasoning; adding Devadatta duplicates logical structure.  
  - **Cut Imperceptible Absence:** Folded into perceptible absence node by asking if the absence mechanism generalizes. Saves a node.  
  - **Retained Nodes:** Prioritized cases that force commitments on inference, testimony, comparison, and absence (core disputed sources). Machine testimony included to modernize testimony test.  

  ### (2) Flowchart  
  ```plaintext
  START  
  │  
  ▼  
  Node 1: You see a fat person who never eats during the day. Do you know he eats at night?  
  ├── No: Go to Node 2.  
  └── Yes: Is this knowledge just perception (of fatness) plus memory (of his habits)?  
      ├── Yes: Go to Node 2 (no new source).  
      └── No: Go to Node 2 (add "inference-like" source).  

  Node 2: A stranger tells you there's a fire on the hill. Later, you see the fire. Did you know about the fire when he spoke?  
  ├── No: Go to Node 3.  
  └── Yes: Is this knowledge just inference (about his reliability)?  
      ├── Yes: Go to Node 3 (no new source).  
      └── No: Go to Node 3 (add "testimony-like" source).  

  Node 3: You're told a "gavaya" looks like a cow. Later, you see a matching animal and think "this is a gavaya." Did you gain new knowledge?  
  ├── No: Go to Node 4.  
  └── Yes: Is this knowledge just perception (of the animal) plus testimony (the description) plus memory?  
      ├── Yes: Go to Node 4 (no new source).  
      └── No: Go to Node 4 (add "comparison-like" source).  

  Node 4: You look in a well-lit corner and see no pot. Do you know there's no pot there?  
  ├── No: Go to Node 5.  
  └── Yes: Is this knowledge just perception (of empty space) or inference (from not seeing it)?  
      ├── Yes: Go to Node 5 (no new source).  
      └── No: Go to Node 5 (add "absence-like" source).  

  Node 5: A weather app says it will rain tomorrow. It does. Did you know it would rain when the app said so? (You can't check its reliability.)  
  ├── No: Go to Leaf Assignment.  
  └── Yes: Is this just inference (about apps in general)?  
      ├── Yes: Go to Leaf Assignment.  
      └── No: Ensure "testimony-like" is added (if not in Node 2).  
