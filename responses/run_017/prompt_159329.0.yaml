  ```  

  ### (3) Leaf Table  
  | Leaf Label | Who Ends Up Here                          | Most Awkward Commitment                                                                 |  
  |------------|-------------------------------------------|-----------------------------------------------------------------------------------------|  
  | 1-source   | Cārvāka                                   | Must deny knowledge of unobserved things (e.g., night eating, fire from smoke).         |  
  | 2-source   | Buddhism, Sāṃkhya                         | Testimony isn't fundamental—it reduces to inference about speaker reliability.          |  
  | 3-source   | Vaiśeṣika                                 | Comparison (e.g., gavaya) reduces to perception + testimony; absence isn't separate.    |  
  | 4-source   | Nyāya                                     | Absence reduces to perception/inference; presumption (fat person) reduces to inference. |  
  | 5-source   | (Unoccupied—see §4)                       | N/A                                                                                     |  
  | 6-source   | Prabhākara Mīmāṃsā                        | Imperceptible absences (e.g., no ghost) are known directly, not by inference.           |  
  | Reductionist| All sources reduce to perception + memory| Testimony and inference aren't distinct—just "recycled" perception.                     |  

  ### (4) Unoccupied Cells Audit  
  - **5-source (perception, inference, testimony, comparison, absence):** Empty because unattractive. Schools adding absence (Mīmāṃsā) also add presumption; those rejecting presumption (Nyāya) reduce absence. No major school stops at five.  
  - **Testimony without inference:** Incoherent. Testimony requires inferring speaker/machine reliability.  
  - **Absence without perception/inference reduction:** Unoccupied. All classical schools reduce or generalize absence (e.g., Nyāya uses perception; Mīmāṃsā uses non-apprehension).  
  - **Machine testimony as a new source:** Unoccupied. No classical school distinguishes machine/human testimony; reductionists subsume both under inference.  

  ### (5) Unseparable Pairs Note  
  The tree **cannot separate**:  
  - **Two-source views (Buddhism vs. Sāṃkhya):** Both land in 2-source leaf but disagree on inference’s scope (Buddhism: only particulars; Sāṃkhya: universals).  
  - **Source convergence vs. exclusive turf:** E.g., seeing/inferring fire simultaneously. Nyāya allows convergence; others don’t. Tree assumes exclusive turf.  
  - **What is counted (causes, instruments, or knowledge):** E.g., Nyāya counts instruments (pramāṇa), not knowledge (pramā). Tree assumes causal processes.  
  **To fix this:** Add nodes on convergence (e.g., “Can two sources justify the same fact?”) and ontology (e.g., “Is a source defined by its process or outcome?”).  

  ### (6) Cutting Nodes for Brevity  
  **Cut Node 5 (machine testimony):** Loses modern context but saves 2–3 minutes. Machine testimony is subsumed under Node 2 (stranger testimony), as both test reliability reduction.  
  **Cut Node 4 (absence):** Loses absence debates but saves 3–4 minutes. Fold absence into Node 3 by noting that absence knowledge (if any) reduces to perception/inference.  
  **What you lose:** Nuance on absence (perceptible vs. imperceptible) and contemporary relevance (AI/mechanical sources). Retain core disputes (inference, testimony, comparison) intact.  

  ---  
  **Final Design Note:** The tree emphasizes reducibility at every branch, forcing students into commitments. Cases like the fat person (presumption→inference), gavaya (comparison), and absence anchor debates. Unoccupied cells highlight logical gaps; unseparable pairs show where the tree oversimplifies. For a 20-minute slot, focus on Nodes 1–3 to cover inference, testimony, comparison—the most accessible conflicts.
