prompt: |-
  I've been writing up a piece on consent for a reading group and I keep finding that my gut verdicts on cases don't line up with any one thing I can state. I'm hoping you can help me find the principle — or tell me which verdicts I have to give up. Roughly my tentative idea is: a yes counts as consent when (a) the person could actually have said no without landing in something someone else was responsible for, (b) nobody lied to them about what the act *was* — what it does to them, who's doing it, what the deal is — as opposed to lying about incidental stuff, and (c) the yes really came from them and wasn't just their mouth moving. But I don't trust it. Here's what I actually think, case by case.

  Deception first. Guy says he's single, isn't: feels gross, but I don't think it voids consent. Someone pretends to be a clinician to perform an exam: obviously void, consent to something else entirely. Someone who's HIV-positive and says they aren't: void. Condom comes off mid-act without her knowing: void, and it feels *worse* than the HIV lie somehow, like a different kind of failure rather than just more of it. Someone says "I love you" to get a yes and doesn't mean it: my gut says valid, which bugs me. A researcher tells me the trial is placebo-controlled when actually I'm guaranteed the active drug — so the lie made me *less* likely to say yes, and the truth would have made me keener: my gut still says void. And here's the one I can't square with that: someone sleeps with a person who, as it happens, belongs to a group they'd have refused on straightforwardly racist grounds, and the person knows this and stays quiet. My gut says the consent is fine. But both are lies (or omissions) about a peripheral fact that changed what was chosen, so any pure but-for test has to give the same answer on both, and I don't want the same answer.

  Coercion. Sleep with me or I fire you, where the firing isn't otherwise justified: not consent. Sleep with me and I'll promote you, where the promotion isn't owed and he's the strongest candidate anyway: I want to say it's slimy but it's consent, and I'm not confident. Lifeguard who'll only throw the ring if you sign over everything you own: not consent. A prison guard offers a prisoner extra food — more than the rules require — for sex: my gut says coerced, even though nothing was taken away. Same guard instead says "sleep with me or I'll put you in the hole," where the hole isn't justified: obviously coerced. A third party says "sleep with him or I leak your photos," and the guy she sleeps with knows nothing about it: I think her yes doesn't count, but I can't say whether that's about her options or about his knowledge. And a driver who happens upon you stranded in the desert and offers a ride only on condition of sex: I lean valid if he didn't put you there, invalid if he did.

  Competence. Blackout drunk: no. Tipsy but coherent: yes. Drunk, coherent, says yes, and would never have said yes sober and hates it the next morning: I lean yes, and I'm uneasy about how confident I am. A woman with dementia who years earlier wrote that if she later initiates sexual contact with her husband and seems content, that should count as her consent even when she can't pass a capacity test — and now she does exactly that: my gut says yes, valid. But the same document saying "go ahead even if I seem to refuse": no way. Surgeon describes the operation as "90% survival" and I consent, where "10% mortality" would have gotten a no: my gut says valid, and valid even if he picked the frame knowing it would work, which feels like it should matter and doesn't.

  Two more I go back and forth on and haven't decided: a friend who said yes mainly because she was scared he'd turn violent, where he said nothing threatening and never would have been — coerced or not? And the yes of someone who thinks, wrongly, that they have no legal right to refuse, and only says yes because refusal seems pointless: my gut says that one is void, which sits badly with my drunk verdict, since both are yeses from a compromised agent.

  So: is there one principle — mine, repaired, or a different one — that gets most of this? I'd like it stated clause by clause with the case that motivates each clause, and I want it to actually say something about cases I haven't listed, especially: is consent obtained through a deliberately annoying app interface (the kind where saying no takes eleven clicks) consent? What about a surgeon who, once you're under, switches to a different technique that's equally good and never mentions it? And does whatever principle you land on have any implications for the friend case and the "no legal right to refuse" case, or does it just punt on them? Please be honest about which of my verdicts your principle can't accommodate — I'd rather drop two verdicts than keep a principle that's really four principles in a trenchcoat.
reasoning: |-
  Hmm, this user is grappling with a deep philosophical and ethical problem about consent. They've presented a detailed set of cases where their intuitive judgments don't neatly align with any single principle they can articulate. I need to help them find a coherent framework.

  Looking at their proposed principle - it has three parts: (a) ability to say no without external punishment, (b) no deception about the core nature of the act, and (c) authentic expression of will. But as they correctly sense, this doesn't capture all their intuitions consistently.

  The deception cases are particularly thorny. Why is lying about HIV status void but lying about marital status not? And why does the placebo lie void consent even though it made the user more likely to agree? The racial omission case is especially challenging because it exposes a conflict between autonomy and moral repugnance.

  For coercion, the key tension is between threats (which seem clearly coercive) and offers (more ambiguous). The prison guard cases show that the "nothing taken away" argument fails - even positive offers can be coercive in extreme power imbalances. The stranded driver case highlights how context matters.

  Competence issues reveal another layer. Their intuition that drunk consent counts even with later regret suggests respect for momentary autonomy, while the dementia case shows deference to prior competent preferences. But this conflicts with their void verdict when someone mistakenly believes they have no right to refuse.

  I think the core missing element is what I'll call "volitional adequacy" - the idea that consent requires not just cognitive understanding and lack of coercion, but also that the decision flows from the person's actual values and priorities in that moment. This explains why the HIV lie voids consent (it bypasses health risk evaluation) but the marital lie doesn't (it may not alter core sexual boundaries). It also explains the placebo case (undermines therapeutic priority) and the racist omission (doesn't actually subvert the sexual decision itself).

  For coercion, the principle needs to focus on whether alternatives are meaningfully available, not just whether something is taken away. The prison food offer is coercive because the prisoner has no real choice about needing extra nutrition. The stranded driver case turns on whether refusal is survivable - creating volitional inadequacy.

  On competence, I'll distinguish between impaired understanding (void) and impaired judgment (potentially valid). The drunk person understands what they're agreeing to, even if they wouldn't sober. The dementia patient's prior directive should be honored as an expression of core values. But someone who thinks they can't refuse misunderstands the social context of consent itself.

  The annoying app interface would fail the "genuine expression" test - it's designed to bypass actual preference. The surgeon switching techniques violates core understanding of the procedure. For the fearful friend case, since the fear doesn't correspond to actual threat, it might be valid but ethically concerning - showing the limits of binary consent frameworks.

  This approach requires abandoning two of their intuitions: that the "I love you" lie voids consent (it doesn't under this framework), and that the mistaken "no legal right" case always voids (if they understand the act, it might be valid). But it preserves most of their core judgments while offering a unified lens.
answer: |-
  Okay, this is a fantastic and deeply challenging set of cases – you've hit on many of the core tensions in consent theory. Your instincts are sharp, and the struggle to find a single principle is completely understandable. Let's dissect it.

  **The Core Problem:** Your proposed principle (A: no penalty for refusal, B: no core deception about the act, C: authentic expression) is a good start but struggles with the nuances. Specifically:
  *   It doesn't distinguish *why* a deception matters (e.g., HIV vs. marital status).
  *   It doesn't cleanly handle "offers" in coercive contexts (prison guard food).
  *   It struggles with competence when understanding exists but judgment is altered (drunk coherent, dementia).
  *   It doesn't resolve the "why" behind peripheral facts mattering sometimes (racism) but not others (researcher placebo).

  **A Proposed Principle (Volitional Adequacy Framework):**

  Consent is valid only when:
  1.  **Core Understanding is Present:** The consenting person possesses and acts upon a sufficiently accurate understanding of the **fundamental nature and material consequences** of the specific act they are agreeing to. *(Motivated by: HIV lie, condom removal, impersonating clinician, surgeon switching techniques)*
      *   *Why "fundamental nature and material consequences"?* This focuses on what *makes the act what it is* to the consenting person. HIV status, condom use, the identity of the examiner, the core surgical procedure – these define the act's essential risks and character. Marital status, "I love you," or the *researcher's framing* (though ethically wrong) don't *change the fundamental act* being consented to (sex, trial participation). The placebo lie is void because it fundamentally misrepresents *what is being done to you* (guaranteed active drug vs. potential placebo).
      *   *Your Cases:* HIV (void - material consequence), Condom (void - fundamental change in act), Impersonator (void - fundamental nature/who), Researcher Placebo (void - fundamental nature of participation), Marital Lie (valid - incidental), "I love you" Lie (valid - incidental), Racist Omission (valid - motivation, not fundamental nature of act). Surgeon switching equally good technique (likely void - consent was to *that specific procedure* described, even if outcome same; autonomy requires control over *what* is done to your body).
  2.  **Volitional Capacity is Adequate:** The consenting person possesses the cognitive and psychological capacity, at the time of consent, to understand the relevant information (as per Clause 1) and to make a choice reflecting their will, free from overwhelming internal compulsion or profound impairment distorting their core values/priorities in that context. *(Motivated by: Blackout drunk, dementia directive vs. refusal, tipsy coherent, drunk coherent with regret, "no legal right" refusal)*
      *   *Why "adequate" and "core values/priorities"?* This avoids perfectionism. "Adequate" means sufficient for the gravity of the decision. Blackout drunk (inadequate). Tipsy coherent (adequate). Drunk coherent with regret (adequate *capacity* - capacity is about *ability* to understand/choose *then*, not about *wisdom* or future feelings; regret doesn't invalidate prior capacity). Dementia initiating per directive (valid - directive expresses core values/priorities; her *current* expression aligns with past competent will). Dementia directive to override refusal (invalid - cannot consent to future non-consent; violates core autonomy principle). "No legal right" refusal (void - capacity is *inadequate* because the fundamental misunderstanding about the *power to refuse* directly impairs the core act of *choosing*; it negates the voluntary nature of the "yes". This differs from drunk regret where capacity *to choose* existed). Annoying app interface (likely void - exploits cognitive load/friction to bypass genuine will; potentially undermines *adequate* capacity for refusal in that moment).
  3.  **Agreement is Non-Imposed:** The "yes" is given in the absence of constraints that **wrongfully nullify or severely compromise** the possibility of a meaningful, alternative choice consistent with the person's basic well-being or fundamental rights. *(Motivated by: Threat of firing/unjustified punishment, lifeguard extortion, prison guard food/offer/threat, leak threat, stranded driver, promotion offer, fearful friend)*
      *   *Why "wrongfully nullify or severely compromise" and "basic well-being/fundamental rights"?* This captures both threats (removing existing options) and exploitative offers (creating an *unrefusable* "choice" due to desperation). It focuses on whether the *context* makes refusal catastrophically costly *due to the other party's wrongful action or exploitation of vulnerability they didn't create*.
      *   *Your Cases:* "Sleep or fired" (void - wrongful threat nullifies choice). "Sleep for promotion" (valid, though slimy - not wrongful nullification; baseline not threatened). Lifeguard (void - wrongful exploitation of dire need they are *duty-bound* to fulfill). Prison guard extra food (void - wrongful exploitation of vulnerability inherent in incarceration + basic need; severely compromises choice). Prison guard "or the hole" (void - wrongful threat). Third-party leak threat (void - wrongful threat nullifying choice; *his* knowledge is irrelevant to whether *her* consent was imposed - her "yes" doesn't count *with him* because it wasn't freely given *to him*). Stranded driver - didn't cause (valid, though reprehensible - he exploits vulnerability he didn't create, but refusal *is* a meaningful, albeit terrible, choice; survival is possible without sex). Stranded driver - caused (void - wrongful creation of the vulnerability exploited). Fearful friend (valid? - This is hard. Clause 3: *He* didn't impose the constraint; her fear, while real, isn't caused by *his* wrongful act. Her capacity is likely "adequate" (Clause 2). The "yes" likely *does* reflect her will in that moment - avoiding hypothetical violence. This might be valid consent under this framework, though ethically awful and based on a false belief. *However*, if his *past behavior* created that fear, it might tip into "imposed").
      *   *Clarification:* This clause doesn't require the *best* choice, just a *meaningful* one not wrongfully crushed. The promotion seeker has a meaningful choice (status quo). The stranded driver victim (not caused) has a meaningful choice (refuse and risk death, accept). The prisoner offered extra food does *not* have a meaningful choice regarding their basic well-being needs in that context.

  **How It Handles Your Cases & New Ones:**

  *   **Surgeon Framing (90% survival vs. 10% mortality):** Valid (Clause 1). The *fundamental nature* of the risk is communicated (90% chance of success/10% chance of death), even if framed favorably. Manipulative, but doesn't change the core act/consequence.
  *   **Annoying App Interface:** Likely Void (Clause 2). Deliberately manipulative design potentially undermines *adequate* volitional capacity for refusal by creating unreasonable friction/confusion, bypassing genuine will.
  *   **Surgeon Switches Technique:** Likely Void (Clause 1). Consent was to *Procedure A*. *Procedure B*, even if equally good, is a different fundamental act performed on the body without permission.
  *   **Friend Scared of Violence (He never threatened/wouldn't):** Leans **Valid** under this framework, but ethically fraught. Clause 2: Capacity likely adequate (she understands the act). Clause 3: *He* hasn't wrongfully imposed the constraint; her fear is internal/not caused by him. Her "yes" reflects her will (avoiding perceived threat). *However,* this feels like a failure of the framework to capture the *source* of her compromised state if his general demeanor/intimidation caused the fear, even without explicit threats. This case highlights the framework's boundary.
  *   **"No Legal Right to Refuse":** **Void** (Clause 2). Fundamental misunderstanding about the *power to consent/refuse* itself directly invalidates volitional capacity. The person isn't *choosing*; they feel coerced by a non-existent rule.

  **What You Might Need to Give Up (The Trenchcoat Problem):**

  This framework asks you to potentially reconsider two intuitions:

  1.  **The "I love you" Lie:** The framework says this is valid consent (Clause 1 - fundamental nature of the act unchanged). It's a terrible betrayal, manipulative, and might make the sex *wrong*, but it doesn't necessarily *invalidate consent* under this principle. The harm is different (emotional manipulation vs. deception about the act's core nature). You might need to accept that consent can be valid but the act still deeply unethical.
  2.  **The Drunk Coherent with Regret vs. "No Legal Right" Distinction:** You were uneasy about treating them differently. The framework distinguishes: Drunk Coherent has *adequate capacity to choose then* (even if poor choice). "No Legal Right" involves *inadequate capacity* due to a fundamental misconception *about the act of consenting itself*.

  **Conclusion:**

  This **Volitional Adequacy Framework** prioritizes:
  *   **Understanding:** Of the act's core nature/consequences (Clause 1).
  *   **Capacity:** Adequate cognitive/volitional ability to choose (Clause 2).
  *   **Freedom:** From wrongful imposition that destroys meaningful choice regarding well-being/rights (Clause 3).

  It captures most of your intuitions by focusing on *why* a deception or constraint matters (fundamentality, exploitation, core capacity) rather than peripheral lies or mere but-for causation. It explains the difference between HIV (core consequence) and marital status (incidental), between the prison guard's food offer (exploiting basic need) and the promotion offer (not), and between drunk regret (poor choice with capacity) and "no legal right" (lack of capacity).

  It *might* validate the "fearful friend" case even if it feels ethically wrong, and it definitively validates the "I love you" lie as not voiding consent (though condemning the act). It provides clear answers to your new cases (app = void, technique switch = void).

  This isn't perfect, but it's a coherent trenchcoat built to handle the storm of cases you presented. It prioritizes autonomy through understanding, capacity, and non-imposition, offering a principled way to navigate the messy reality of consent.
