answer: |-
  **Where I've actually committed myself**  
  Core (non-optional): Concrete worlds, spatiotemporally/causally isolated; indexical actuality; counterpart theory de re; recombination of actual fundamental entities/properties/relations as the sole generator of worlds. Optional riders: (1) No alien natural properties; (2) All modal truths are perfectly determinate; (3) No empty world. Applications: Humean laws + plenitude for counterfactuals/chance; causal models as world-selection.  

  **Ranked defeaters**  
  1.  **Fatal: Representational gaps from Riders 1 & 3.**  
      *Rider 1*: Cannot represent possibilities requiring alien properties (e.g., novel fundamental forces not recombinable from actual physics). If such properties are conceivable and seem metaphysically possible, this is a direct failure. *Rider 3*: Cannot represent "there might have been nothing" – a widely endorsed intuition. If this is a genuine possibility, the view is expressively incomplete.  
      *Why it lands*: Modal realism’s core selling point is plenitude – "all possibilities exist." These riders violate that by imposing arbitrary limits. Damage: Core claim undermined.  

  2.  **Severe: Determinacy (Rider 2) clashes with counterpart theory.**  
      Counterpart relations are typically context-dependent/vague (e.g., "which slight variations count as *this* table?"). Rider 2 demands sharp truth values for *all* modal claims (e.g., "This table could have had exactly N molecules"). But what fixes the exact boundaries of counterpart relations? If it’s convention or context, determinacy fails. If it’s a brute fact, it’s mysterious.  
      *Why it lands*: Direct internal conflict. The core machinery (counterparts) naturally generates vagueness; the rider forbids it. Forces either abandoning determinacy or positing ad-hoc sharp counterpart relations.  

  3.  **Serious: Explanatory idleness of concrete ontology.**  
      Could a sparse actualist (e.g., ersatz worlds as maximal consistent sets of propositions) replicate *all* the work? Humean laws + plenitude *might* avoid primitive similarity/nomic necessity, but could an ersatzist using the same fundamental base do it cheaper? If yes, the concrete worlds are ontologically profligate without payoff. Your causal model application ("interventions select worlds") seems decorative if structural equations don’t *need* worlds.  
      *Why it lands*: Attacks the core motivation. If rivals match explanatory power with less ontology, hard plenitude loses its raison d'être.  

  4.  **Problematic: Isolation – definitional dodge?**  
      If isolation is definitional ("worlds just *are* isolated spacetimes"), then claims about "other universes" in cosmology are automatically reclassified as parts of *our* world. This looks like insulating the view from empirical disconfirmation. If it’s empirical (contingent that no causal links exist), then detecting such links (even if unlikely) falsifies the view. You seem to want it both ways.  
      *Why it lands*: Risks making the view unfalsifiable or ad hoc. Undercuts the "scientific respectability" angle.  

  5.  **Awkward: Set-sized plenitude?**  
      Recombination over actual fundamentals *might* only generate a set-sized plurality (if fundamentals are set-sized). But if fundamentals themselves involve proper-class-sized structures (e.g., spacetime points under some theories), recombination could explode. Quantifying over proper classes is formally tricky and may break standard semantics.  
      *Why it lands*: Technical nuisance that complicates stating the view rigorously, but doesn’t directly destroy it.  

  **What defenders concede vs. what they dismiss**  
  *Concede*: (1) Alien properties/nothingness *seem* possible; the view must deny this and explain the intuition away (e.g., as confusion about conceivability). (2) Counterpart relations require careful (perhaps context-sensitive) handling to avoid obvious vagueness clashes with determinacy. (3) The concrete ontology is extravagant; its justification rests entirely on its unique explanatory benefits.  
  *Dismiss*: (1) "Weirdness" objections or incredulous stares. (2) Claims that "actual" must be non-indexical or that transworld identity is viable. (3) Objections based on folk intuitions about modality. (4) That the lack of an empty world is a significant loss (arguing "nothing" isn’t a genuine possibility).  

  **What hard plenitude predicts that its rivals don't**  
  It uniquely predicts that **every genuine possibility must be constructible via recombination of the *actual* fundamental properties/relations/entities.** No view without this core commitment (e.g., ersatzism with primitive modality, primitivist possibility) entails this. If we could somehow know the complete fundamental base, we could "read off" all possibilities – a reductionist claim rivals reject. It also predicts that indeterminacy in modal claims *always* traces to representational/conceptual vagueness in *us*, never to reality itself.  

  **Has this been qualified into unfalsifiability?**  
  Partly. Defining "world" by isolation makes external causal links conceptually impossible, shielding it from cosmology. Insisting modal indeterminacy *must* be epistemic/conceptual shields it from borderline cases. However, it *is* falsifiable in other ways: if a possibility clearly requires alien properties (e.g., consistent physical theory with new fundamental charge), the view is falsified. If Humeanism or counterpart theory fails, key applications collapse. While metaphysical theories aren't empirical, they can be internally incoherent or fail their explanatory aims. The risk is real but not fatal *if* the explanatory benefits are unique and compelling. The bigger worry is *ad hoc insulation* (e.g., reclassifying multiverses, dismissing alien conceivability) making it untestable *in principle*.  

  **Bottom line**  
  Your riders make the view critically exposed. **Rider 1 (no aliens) and Rider 3 (no empty world) create severe representational gaps** that directly contradict the core promise of plenitude. **Rider 2 (determinacy) clashes internally** with the vagueness inherent in counterpart relations. Without the riders, the core risks collapsing into ersatzism if the concrete ontology is idle. The isolation principle’s status needs clarification to avoid being a dodge. Hard plenitude is defensible only if you ditch the riders or show their costs are outweighed by unique payoffs – but as stated, it’s on shaky ground.
