prompt: |-
  Hi — I'm the clinical lead for multidisciplinary review panels at a regional hospital system. Roughly 40–50 decisions a month, panels of 4 to 9 people (mix of consultants, registrars, senior nurses), simple majority, advisory to whoever is on call. Typical questions: is this imaging finding suspicious enough to recall the patient; is this patient deteriorating enough to escalate; is this discharge safe. I've been reading about the Condorcet jury theorem and I want to know whether it can be turned into something my team actually runs each week, rather than a thing I half-remember from a blog post.

  What I want is a decision procedure we can follow in about fifteen minutes before a panel meets, no stats background required, that decides how to set the panel up for this class of case. In order, roughly:

  1. Does the theorem even apply — is there a right answer that exists independently of what the panel says? I have a nagging feeling that for a good chunk of our calls the panel's say-so partly constitutes the answer, or it's really a values call about acceptable risk, and majority voting is just a way of laundering responsibility. If so, say so and hand it to a named person.
  2. Is average competence on this class of case actually above half, or are we assuming it? Note that competence is an average over a type of case, not a fixed trait of a person — we get outcome data back on maybe half our calls, and for the escalation ones nobody ever observes what would have happened to a patient we didn't escalate.
  3. Independence. Everyone reads the same chart, the same guideline, the same handover note from the same tired registrar, so the errors share a component. My hunch is there's an effective number of independent voters that saturates around four or five and a ninth person buys approximately nothing — but I dunno how to check which regime we're in, or how to weigh a smaller, genuinely defferent group against a bigger, correlated one.
  4. Protocol: blind votes, then deliberate, then re-vote? Or just deliberate and vote? Show a running tally or not? I keep hearing both that discussion wrecks independence and that it's the entire point of meeting.
  5. Weighting — do we weight by seniority? My guess is no unless someone can show the variable tracks accuracy on this case type.

  Two more things. First, a hunch: for questions that are really forecasts about what will happen rather than facts already fixed, majority-of-yes/no is the wrong aggregation device and averaging probabilities would be better. Tell me when to switch, and be straight with me if the switch needs calibration data we don't have and won't get. Second, flag which steps are judgment calls dressed up as procedure, and mark where the procedure just stops and a human decides — and say for each stop whether it's because it's a values question or because we're data-poor.

  Run it on three cases: (a) recall-or-not on a screening mammogram, five readers, same images, outcome known about a year later; (b) should this borderline patient go to a higher level of care tonight, ground truth never observed, on-call consultant has to sign; (c) a rare presentation where the two most senior people disagree and nobody in the room has seen more than a couple like it. I suspect at least one gives me an answer I don't want — say which, and don't soften it.

  Don't bother with citations, I can chase those myself. Sorry for the rambling, I'm writing this between two meetings.
reasoning: |-
  Okay, the user is a clinical lead for multidisciplinary review panels in a hospital. They handle 40-50 decisions monthly with panels of 4-9 people. They want to apply the Condorcet jury theorem practically but have several concerns.

  First, I need to address whether Condorcet applies. The theorem assumes a single correct answer. For recall decisions like mammograms (Case A), it fits because there's a clear outcome later. But for escalation (Case B) or discharge safety, the "right" answer might depend on risk tolerance, which is a values call, not a factual one. In those cases, majority voting might not be appropriate, and a named individual should decide.

  Next, competence. The theorem requires average competence above 50%. But measuring this is tough. For Case A, with outcome data, you could track individual accuracy. For Case B, no outcome data means you have to assume competence based on seniority or experience, which might not be reliable. The rare presentation (Case C) is problematic because low experience likely means competence is below 50%, so majority might be worse than individual decisions.

  Independence is another big issue. Shared information sources create correlated errors. Even with 9 people, the effective independent voters might be only 4-5. Adding more people beyond that doesn't help much. To check, you could analyze past decisions for correlation, but that's data-intensive. Without data, capping the panel at 5 and ensuring diverse roles might help.

  Protocol-wise, discussion is essential but risks groupthink. Starting with blind votes preserves independence, then discussion, and a re-vote. For Case A, showing initial votes could reduce anchoring. But for escalation decisions, discussion is vital for sharing insights.

  Weighting by seniority? Only if data shows it correlates with accuracy. Otherwise, it introduces bias. Better to use equal votes unless proven otherwise.

  For forecasting questions, averaging probabilities is better than yes/no votes. But this requires calibrated probabilities, which need training and feedback—something they might not have. Without calibration, stick to majority voting.

  Case A: Fits Condorcet well. Use blind vote -> discuss -> re-vote. Panel size 5 is sufficient.
  Case B: Values-based. Majority voting is inappropriate. Assign to a named consultant.
  Case C: Low competence. Don't use majority. Either escalate to a specialist or have the most experienced decide.

  The user might not like that Case B and C shouldn't use majority voting. But it's necessary to point out to avoid flawed decisions. Also, many steps are judgment calls due to data limitations. Highlighting those stops is crucial for transparency.
answer: |-
  Here's a practical decision procedure based on Condorcet principles, tailored to your constraints. It addresses your core concerns and runs in <15 minutes pre-panel. **Key Insight:** Condorcet is powerful *only when specific conditions hold*. Your job is to triage cases into "Condorcet-Appropriate" vs. "Human Judgment Required" buckets.

  ---

  ### **Pre-Panel Decision Procedure (15-Minute Checklist)**
  *Run this for each **case type** (e.g., "screening mammogram recall decisions") before assembling the panel.*

  1.  **"RIGHT ANSWER" TEST (VALUES vs. FACT):**
      *   *Ask:* "Is there a single, objectively verifiable truth for this case type *independent* of our vote?" (e.g., malignancy present/absent).
      *   **YES (Fact-Based):** Proceed to Step 2. *(Example: Case A - Mammogram recall)*
      *   **NO (Values/Risk-Based):** **STOP.** Assign to a *named individual* (e.g., on-call consultant) who must own the risk assessment. **Flag:** "Values Call - No Condorcet". *(Example: Case B - Escalation, Case C - Rare Presentation)*
      *   *Your Nagging Feeling is Correct:* For escalation/discharge safety, the panel often *defines* acceptable risk. Condorcet laundering responsibility here is dangerous. Assign ownership.

  2.  **COMPETENCE THRESHOLD (p > 0.5?):**
      *   *Ask:* "For this case type, is the *average* panelist accuracy demonstrably or reasonably >50%?"
      *   **YES (Data/Plausibility):**
          *   *If outcome data exists (e.g., Case A):* Calculate average accuracy from past data *for this case type*. If >50%, proceed.
          *   *If no outcome data (common):* Rely on role-based plausibility (e.g., radiologists reading mammograms *should* be >50% accurate). If plausible, proceed cautiously.
      *   **NO (Low Accuracy):** **STOP.** *Do not use majority vote.* Options:
          *   Assign to the single *most credible expert* available.
          *   Escalate to a specialist outside the panel.
          *   Seek more information first.
          *   **Flag:** "Low Competence - Majority Harmful". *(Example: Case C - Rare presentation, low experience)*
      *   *Judgment Call:* Without hard data, this is a risk assessment. Err on the side of "NO" if case complexity is high or experience is low.

  3.  **INDEPENDENCE & EFFECTIVE PANEL SIZE (N_effective):**
      *   *Ask:* "How many *truly independent* perspectives can we realistically get?" Consider:
          *   Shared information bias (same chart, same guidelines).
          *   Professional homogeneity (all radiologists vs. mixed MDT).
          *   Hierarchy effects (junior staff deferring).
      *   *Estimate N_effective:*
          *   **High Correlation (Same specialty, same data):** N_effective ≈ 3-4. Adding >5 people buys little. *(Typical for Case A with identical images)*
          *   **Moderate Correlation (Mixed MDT, different roles):** N_effective ≈ 5-6. *(Good for complex discharge decisions)*
          *   **Low Correlation (Truly diverse expertise, unique info):** N_effective ≈ Actual N (Rare in practice).
      *   *Action:* **Cap the panel at N_effective.** For most hospital panels with shared data: **5 is sufficient, 7 is max.** >7 is usually wasteful. Prioritize *diverse roles* over more bodies.

  4.  **PROTOCOL (Blind Vote -> Discuss -> Revote):**
      *   **Always start with INDEPENDENT input:** Secret ballot vote *before* discussion. This captures raw competence & minimizes anchoring/groupthink.
      *   **Then DELIBERATE:** This is where context, nuance, and expertise *add value* beyond simple voting. Focus discussion on *reasons*, not just votes.
      *   **Optional Revote:** Only if discussion reveals *new, objective information* (not just persuasion). Often unnecessary for clear-cut Condorcet cases.
      *   *Show Tally?* **After initial blind vote, YES.** Shows distribution *before* discussion influences people. Helps identify outliers for exploration.
      *   *Why This Works:* Captures the "wisdom of crowds" (independence) first, then adds the "wisdom of experts" (deliberation). Discussion doesn't wreck independence if initial votes are locked in.

  5.  **WEIGHTING (Seniority ≠ Accuracy):**
      *   *Default:* **Equal votes.** Seniority correlates with experience but *not necessarily* with accuracy for a *specific case type*. Weighting adds complexity and bias.
      *   *Exception:* **Only if** you have *data* showing a specific role/seniority level has *significantly higher accuracy (>10-15%*) *for this exact case type*. Otherwise, don't.

  ---

  ### **Handling Your Hunches & Edge Cases**
  *   **"Forecasts vs. Facts" (Probability Averaging):**
      *   *Switch when:* The question is inherently probabilistic ("What's the % chance this patient deteriorates in 24h?") AND panelists are *trained in probability estimation* AND you have *feedback for calibration*.
      *   *Reality Check:* **You likely lack calibration data.** Without feedback (knowing if their 30% estimate was right/wrong), probability estimates are often mis-calibrated (over/under-confident). Majority vote on a threshold (">30% chance? Yes/No") is usually *more robust* without calibration.
      *   *Action:* Stick to majority vote on defined thresholds ("Is risk >X%?") for now. If you want probabilities, start small: collect estimates *and track outcomes* to build calibration data first.

  *   **Judgment Calls vs. Procedure:**
      *   **STOP 1:** "Right Answer?" Test (Step 1) - **Values Call.**
      *   **STOP 2:** Competence Threshold (Step 2) - **Data-Poor.** (Relies on plausible assumption).
      *   **STOP 3:** Estimating N_effective (Step 3) - **Data-Poor/Judgment Call.** (Based on understanding of bias sources).
      *   **The Procedure Stops:** At any "**STOP**" point. Human decides *because* it's either a values question or the data/conditions for Condorcet are insufficient.

  ---

  ### **Running Your Three Cases**

  1.  **Case A: Recall on Screening Mammogram (5 readers, same images, outcome known later)**
      *   **Step 1:** YES. Right answer exists (malignancy yes/no).
      *   **Step 2:** YES. Radiologists' avg accuracy for screening mammo is typically >50% (often 70-90%).
      *   **Step 3:** N_effective ≈ 3-4 (High correlation: same images, same specialty). 5 readers are fine but saturated.
      *   **Protocol:** Blind Vote -> Show Tally -> Discuss -> (Optional Revote if new objective insight). Equal votes.
      *   **Condorcet Applies? YES.** Majority vote is appropriate and beneficial. Panel size is ok.

  2.  **Case B: Escalate Borderline Patient (Ground truth unobserved, Consultant signs)**
      *   **Step 1:** **NO.** This is fundamentally about risk tolerance and resource allocation ("Is the *risk* of deterioration *unacceptably high*?"). There's no single "right" answer independent of values and context.
      *   **STOP.** **Condorcet Does NOT Apply.**
      *   **Action:** Assign to the **named on-call consultant**. Their job is to weigh risks, benefits, and resources *and own the decision*. A panel discussion can *inform* them (assessing likelihoods, options), but the vote shouldn't decide. **Answer you may not want:** Majority vote launders responsibility here.

  3.  **Case C: Rare Presentation (Senior Disagreement, Low Experience)**
      *   **Step 1:** *Maybe.* Assume there *is* a "best" management path (fact-based).
      *   **Step 2:** **NO.** "Nobody has seen more than a couple." Average competence is highly likely to be *near or below 50%* for this specific rare condition. Majority vote could be *worse* than flipping a coin or trusting one person.
      *   **STOP.** **Condorcet Harmful.**
      *   **Action:** **Do NOT use majority vote.**
          *   Option 1: Assign to the **single most experienced person** (despite disagreement, pick one).
          *   Option 2: **Escalate immediately** to a national specialist center or the most senior subspecialist available remotely.
          *   Option 3: Seek urgent additional diagnostics/consultation *before* deciding.
      *   **Answer you may not want:** Your panel, as constituted, is not competent to vote on this. Forcing a vote is dangerous.

  ---

  **Summary & Key Takeaways:**

  1.  **Use Condorcet ONLY for fact-based decisions with competent voters (p>0.5).** Triage ruthlessly: Escalation/discharge/rare cases often fail this test.
  2.  **Small, Diverse Panels > Large, Homogeneous Groups:** Cap most panels at 5-7. Prioritize different roles/skills over more people.
  3.  **Blind Vote First, Then Discuss:** This is non-negotiable for capturing independence. Show the initial tally.
  4.  **Own the Values Calls:** Don't hide behind a vote for risk tolerance decisions. Assign a named owner.
  5.  **Don't Weight Votes Without Proof:** Equal votes are simpler and fairer unless data proves otherwise.
  6.  **Majority Vote > Averaging Probabilities (Without Calibration):** Stick to yes/no thresholds unless you invest in probability training and feedback.
  7.  **Face the Music:** For complex, rare, or values-laden decisions (Cases B & C), Condorcet is often *inapplicable or harmful*. Have the courage to use other methods.
