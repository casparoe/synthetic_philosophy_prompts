answer: |-
  Below is a decision tree handout designed for your discussion night. It uses 8 binary branch nodes (based on concrete cases) to sort participants into 7 distinct positions, avoiding direct questions about consciousness, intentionality, or agency. The tree separates these three dimensions by forcing combinations of answers to specific cases. Unoccupied positions are noted, and each leaf includes a name, key commitments, and responses to all cases. The handout is jargon-free and assumes only basic familiarity with ant colonies.

  ---

  **Decision Tree: Does an Ant Colony Have a Mind?**  
  *Answer each question based on concrete cases, not theory. Follow the branches to your position.*

  ### Node 1: Fake Trail Case  
  An experimenter paints a fake pheromone trail, making the colony forage north for days as if food is there (but there’s none).  
  ➔ **Is this a colony-level false belief?**  
  - **Yes** → Go to Node 2A  
  - **No** → Go to Node 2B  

  ### Node 2A: Replayed Transcript Case  
  You record the colony’s chemical state, wipe the nest, and replay it into a fresh colony. The new colony behaves identically.  
  ➔ **Does the new colony hold the same beliefs as the original?**  
  - **Yes** → Go to Node 3  
  - **No** → Go to Node 3  

  ### Node 2B: Blind Colony Case  
  All foragers are removed. The nest still regulates temperature/care for weeks but gets no new information.  
  ➔ **Is the colony regulating temperature *for a reason* (e.g., "to protect the brood")?**  
  - **Yes** → Go to Node 3  
  - **No** → Go to Node 3  

  ### Node 3: Bandwidth Doubler Case (Original Speed)  
  Without any radios (normal speed), do colony-level patterns (e.g., trail formation) involve **thoughts**?  
  - **Yes** → Go to Node 4  
  - **No** → Go to Node 4  

  ### Node 4: Queen Swap Case  
  The queen is replaced mid-season with an identical one. Foraging/threat responses continue unchanged.  
  ➔ **Is this the *same mind* as before?**  
  - **Yes** → Go to Node 5  
  - **No** → Go to Node 5  

  ### Node 5: Bandwidth Doubler Case (Fast Speed)  
  With radios (10× faster pattern propagation), does the colony have **thoughts**?  
  - **Yes** → Go to Node 6  
  - **No** → Go to Node 6  

  ### Node 6: Nest Fission Case  
  The colony splits into two identical halves (each with ants and copied trails).  
  ➔ **After splitting, is the *original mind* still present in at least one half?**  
  - **Yes** → Go to Node 7  
  - **No** → Go to Node 7  

  ### Node 7: Blind Colony Case (Phenomenology)  
  In the forager-less colony, is there **something it’s like to be the colony** (e.g., experiences)?  
  - **Yes** → Go to Leaf 5  
  - **No** → Go to Leaf 6  

  ---

  ### Leaf Positions  
  *Based on your path, find your leaf. Each includes:  
  - A name (or "unnamed")  
  - Key commitments (bold)  
  - Responses to all cases  
  - Most awkward commitment (for debate)*  

  #### Leaf 1: **Functionalist Mind** (→ 1:Yes → 2A:Yes → 3:Yes → 4:Yes → 5:Yes → 6:Yes → 7:Yes)  
  - **The colony has beliefs, agency, and consciousness, all defined by functional roles.**  
  - Cases:  
    - Fake trail: False belief.  
    - Replay: Same beliefs (state is copied).  
    - Bandwidth (slow/fast): Thoughts at both speeds.  
    - Queen swap: Same mind (function unchanged).  
    - Fission: Original mind persists in one half.  
    - Blind colony: Still has experiences/reasons.  
  - 🤔 **Awkward commitment:** Minds can split (fission) but still be "the same" in one half.  

  #### Leaf 2: **Belief-Desire Robot** (→ 1:Yes → 2A:Yes → 3:No → 4:Yes → 5:Yes → 6:No → 7:No)  
  - **The colony has beliefs/agency (intentionality) but no consciousness.**  
  - Cases:  
    - Fake trail: False belief.  
    - Replay: Same beliefs.  
    - Bandwidth (slow/fast): No thoughts at any speed.  
    - Queen swap: Same "agent" (goal-driven system).  
    - Fission: Two new agents; original gone.  
    - Blind colony: Still has reasons, but no experiences.  
  - 🤔 **Awkward commitment:** Complex "beliefs" exist with zero subjective experience.  

  #### Leaf 3: **Pattern Realist** (→ 1:Yes → 2A:No → 3:Yes → 4:No → 5:Yes → 6:No → 7:Yes)  
  - **Consciousness and beliefs exist, but depend on ongoing dynamics (not static states).**  
  - Cases:  
    - Fake trail: False belief.  
    - Replay: *Not* the same beliefs (requires active process).  
    - Bandwidth (slow/fast): Thoughts at both speeds.  
    - Queen swap: New mind (queen change breaks continuity).  
    - Fission: Two new minds.  
    - Blind colony: Still has experiences/beliefs.  
  - 🤔 **Awkward commitment:** Identical behavior (replay) doesn’t imply identical beliefs.  

  #### Leaf 4: **Stigmergic Skeptic** (→ 1:No → 2B:Yes → 3:No → 4:Yes → 5:No → 6:Yes → 7:No)  
  - **Agency (goal-driven behavior) exists without beliefs or consciousness.**  
  - Cases:  
    - Fake trail: No false belief; just environment manipulation.  
    - Blind colony: Regulates for reasons (e.g., brood survival).  
    - Bandwidth (slow/fast): No thoughts at any speed.  
    - Queen swap: Same agent (goals unchanged).  
    - Fission: Original agent persists in one half.  
    - Replay: Copies habits, not beliefs.  
  - 🤔 **Awkward commitment:** "Reasons" require no mental representations (e.g., beliefs about brood).  

  #### Leaf 5: **Hive Sentientist** (→ 1:No → 2B:No → 3:Yes → 4:No → 5:Yes → 6:No → 7:Yes)  
  - **Consciousness exists without beliefs or agency.**  
  - Cases:  
    - Fake trail: No belief; just chemical cause/effect.  
    - Blind colony: Has experiences, but no "reasons."  
    - Bandwidth (slow/fast): Thoughts at both speeds.  
    - Queen swap: New mind (individuals matter).  
    - Fission: Two new conscious systems.  
    - Replay: Copies chemical state, not mental content.  
  - 🤔 **Awkward commitment:** Consciousness exists in a system with no goals or beliefs.  

  #### Leaf 6: **Eliminativist** (→ 1:No → 2B:No → 3:No → 4:Yes → 5:No → 6:Yes → 7:No)  
  - **No beliefs, agency, or consciousness; just physics/chemistry.**  
  - Cases:  
    - Fake trail: Not a belief; environment altered behavior.  
    - Blind colony: No reasons; self-organization continues.  
    - Bandwidth (slow/fast): No thoughts; just faster patterns.  
    - Queen swap: Same system (queen irrelevant to patterns).  
    - Fission: Original system persists in one half.  
    - Replay: Copies chemical trails, nothing mental.  
  - 🤔 **Awkward commitment:** All colony-level language ("belief," "agent") is metaphorical.  

  #### Leaf 7: **Unnamed** (→ 1:No → 2B:Yes → 3:Yes → 4:No → 5:No → 6:No → 7:No)  
  - **Consciousness and agency exist, but *not* beliefs.**  
  - Cases:  
    - Fake trail: No false belief; environmental trigger.  
    - Blind colony: Has reasons and experiences.  
    - Bandwidth (slow): Thoughts.  
    - Bandwidth (fast): No thoughts (speed breaks coherence).  
    - Queen swap: New mind.  
    - Fission: Two new minds.  
    - Replay: Copies structure, not mental states.  
  - 🤔 **Awkward commitment:** Consciousness "turns off" when communication speeds up.  
  - **Note:** Unoccupied in practice. Why? Speed-dependent consciousness is incoherent to most.  

  ---

  ### Design Notes  
  - **Separated dimensions:**  
    - **Phenomenology** (consciousness): Probed by Node 7 and bandwidth cases.  
    - **Intentionality** (accuracy conditions): Probed by fake trail and replay cases.  
    - **Agency** (reasons vs. mechanisms): Probed by blind colony and fission cases.  
  - **Unoccupied positions:** Leaf 7 is unmapped (likely incoherent). Other combinations (e.g., agency without intentionality *and* consciousness) are covered.  
  - **Famous indistinguishable pair:** "Functionalist Mind" (Leaf 1) and "Pattern Realist" (Leaf 3) both affirm consciousness but differ metaphysically on replay/fission. They can’t be separated behaviorally.  
  - **Cases covered:** All 6 cases are integrated into branches.  
  - **Readability:** Nodes use simple language; no jargon. Cases are described in 1–2 sentences.  

  Photocopy this tree and use it to guide your discussion. Participants land in a leaf by answering concrete cases, revealing their implicit stance on mind, belief, and agency—without theory-heavy debates!
