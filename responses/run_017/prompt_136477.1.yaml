prompt: |-
  I host a podcast on the history of ethics, and next month's guest is a philosopher who has published a book-length defence of a Benthamite sexual ethics, extending Bentham's own arguments for decriminalising same-sex acts into a general theory. Her stated commitments are: that the only currency is pleasure and pain, measured by intensity, duration, certainty, propinquity, fecundity and purity and never ranked by kind, so that no sexual act can be called degrading or unworthy in itself; that disgust, tradition, or the charge of unnaturalness can never be a reason to punish, since on her reading of Bentham grounding morality in sentiment rather than consequences is no moral theory at all; and that punishment is itself an evil, admissible only where it averts greater pain.

  Draft eight to ten interview questions that go beyond having her restate these. I want at least one each on: an act performed on a sleeping or anaesthetised person who suffers no pain and never learns of it, and whether a purely pain-based theory can condemn it at all; the bootstrapping worry that if my distress at knowing what others do is itself a pain, then punishing them is licensed by exactly the sentiment she says carries no independent weight, together with a follow-up pressing her for a test that separates genuine alarm from moralised disgust; what work consent is really doing, given that for Bentham it is not a primitive moral power but matters through security and frustrated expectation, with a follow-up keyed to her likely reply; whether the pain of frustrated appetite generates any positive obligation on the state to facilitate its relief, and what she says when the cheapest reliable relief is itself offensive to many; and what an age threshold could possibly rest on if nothing turns on the kind of pleasure, only on its quantity. Close with a question about what sort of case would make her abandon the framework.

  For each question, add a note on the reply she is most likely to give and the one follow-up that would make that reply costly. Also mark, question by question, where she is reporting Bentham and where she is revising or going beyond him, and separate the points on which historians of utilitarianism would agree from the ones that are genuinely contested or for which the literature has no settled answer; I do not want contested readings presented as consensus.
reasoning: |-
  Okay, the user hosts a podcast on ethics history and has a guest who defends a Benthamite sexual ethics. The guest's book extends Bentham's arguments for decriminalizing same-sex acts into a general theory. Key commitments are: pleasure/pain as the only currency with specific measures; no acts inherently degrading; rejection of disgust/tradition as moral grounds; punishment as evil unless it prevents greater pain.

  The user wants 8-10 interview questions that go beyond restating these positions. Specific required topics include: 
  - Non-consensual acts on unconscious persons (pain-based condemnation challenge)
  - Bootstrapping worry about distress-as-pain justifying punishment (with follow-up on distinguishing alarm vs disgust)
  - Consent's role given Bentham's view of it as derivative (follow-up on likely reply)
  - State obligations for frustrated appetite relief (especially offensive methods)
  - Age thresholds without qualitative pleasure distinctions

  Plus a closing question about what would make her abandon the framework.

  Additional requirements: 
  - Notes on likely replies and costly follow-ups for each question
  - Markers for where she's reporting vs revising Bentham
  - Historians' consensus vs contested points (no false consensus claims)

  First I need to ensure all mandatory topics are covered. The unconscious act, bootstrapping, consent, state obligations, and age thresholds each need dedicated questions. That's five, plus the abandonment question makes six. Need 2-4 more to reach 8-10. Possible additions: 
  1. How her theory handles historical cultural differences in what causes distress
  2. Whether "purity" (as a Benthamite measure) conflicts with her rejection of qualitative distinctions 
  3. Application to non-punitive social sanctions
  4. Comparison to Mill's harm principle

  For the unconscious act question: Core challenge is how pain-based theory condemns it without harm. Likely reply: Violates security expectations → long-term societal pain. Costly follow-up: Why security applies if victim never knows. Historians note Bentham emphasized security but never explicitly applied to this scenario - contested extension.

  Bootstrapping question: Distress-as-pain could justify punishment. Likely reply: Only "rational" alarm counts, not disgust-disguised. Costly follow-up: Operational test for "rationality." Here she's beyond Bentham - he didn't resolve this cleanly. Consensus: Bentham acknowledged the problem; contested: solutions.

  Consent question: Clarify its derivative role. Likely reply: Consent prevents pain via security/expectation. Follow-up: What if expectation is unreasonable? Historians agree this is Bentham's view; no consensus on unreasonable expectations.

  State obligation question: Frustrated appetite pain → state relief duty? Likely reply: Only if cost-effective. Follow-up: Offensive relief methods. She's consistent with Bentham on state's role. Consensus: Bentham prioritized efficiency.

  Age threshold question: How set without qualitative distinctions? Likely reply: Capacity for consequences assessment. Follow-up: Why not lower if pleasure > pain? She's extending Bentham. Contested: Whether capacity is quantifiable.

  Closing question: Abandonment conditions. Likely reply: Fundamental measurement failure. Follow-up not needed per spec.

  Additional questions: 
  - Purity measure consistency (Bentham's measure vs her anti-qualitative stance)
  - Non-punitive social sanctions (shaming etc.)
  - Historical/cultural variance in distress causes

  For the purity question: Does "purity" (freedom from pain after) conflict with anti-qualitative stance? Likely reply: Purely quantitative (duration extension). Costly follow-up: Doesn't this sneak in quality? Historians agree purity is quantitative for Bentham.

  For social sanctions: How theory handles non-legal disapproval. Likely reply: Still wrong if causes net pain. Follow-up: What if effective pain-reducer? She's applying Bentham. Consensus: Bentham opposed useless sanctions.

  For cultural variance: If distress varies, does morality change? Likely reply: Consequences vary → different duties. Follow-up: Moral relativism charge. Bentham was universalist - she's consistent.

  Structuring: Lead with core theory questions before specific challenges. Ensure each required topic has its own question. Mark consensus/contested precisely - e.g., "historians widely agree" vs "scholarly debate persists."

  Language: Questions should be sharp but respectful. Follow-ups designed to pressure without being aggressive. Notes anticipate her defenses and where historical grounding is shaky.
answer: |-
  Here are nine interview questions designed to probe deeply into your guest's Benthamite framework, incorporating all your specified requirements. Each question includes:  
  - **Likely Reply**: A concise prediction of her core response.  
  - **Costly Follow-Up**: A question making that reply "costly" by exposing tensions or demanding precision.  
  - **Bentham vs. Revision**: Whether she’s reporting Bentham or extending/revising him.  
  - **Historian Consensus**: Clarification on scholarly agreement vs. contested points.  

  ---

  ### **1. Non-Consensual Acts on Unconscious Persons**  
  *Question:* If someone performs a sexual act on a deeply unconscious person (e.g., under anesthesia) who experiences no pain, never learns of it, and suffers no lasting harm, can your theory condemn this act? If so, on what quantitative grounds?  
  - **Likely Reply**: Yes. It violates *security* (a core Benthamite expectation), creating societal fear and distrust, which generates widespread pain through eroded social bonds.  
  - **Costly Follow-Up**: If the act is truly undetectable and isolated, with no risk of discovery or precedent, how does it produce measurable pain exceeding the perpetrator’s pleasure? Doesn’t this invoke a qualitative "violation" principle disguised as consequence?  
  - **Bentham vs. Revision**: *Revising*. Bentham prioritized security against *tangible* harms (theft, violence); applying it to undetectable sexual acts is an extension.  
  - **Historian Consensus**: **Contested**. Bentham saw security as stabilizing expectations, but scholars debate whether it covers non-instrumentalized "dignity" violations. Most agree he *would* condemn this act, but the *reason* (empirical pain vs. conceptual breach) is unresolved.  

  ---

  ### **2. Bootstrapping Worry: Distress as Pain**  
  *Question:* If my distress at knowing others engage in consensual acts (e.g., sodomy) is itself a pain, doesn’t punishing them become justified to avert my pain—effectively bootstrapping sentiment into consequence?  
  - **Likely Reply**: No. Only *rational* alarm grounded in *actual future harm* (e.g., predation risk) counts. Disguised disgust or "mere opinion" pain is irrational and excluded to prevent tyranny of the majority.  
  - **Costly Follow-Up**: What test definitively separates "rational alarm" about social decay (e.g., "this erodes family values") from moralized disgust? If you appeal to empirical harm, isn’t the burden of proof often impossible to meet, collapsing back into sentiment?  
  - **Bentham vs. Revision**: *Reporting & Revising*. Bentham rejected "capricious antipathy" as grounds for law but lacked a clear test. Her "rational harm" criterion sharpens this.  
  - **Historian Consensus**: **Contested**. Bentham unequivocally rejected sentiment-based laws, but historians disagree on whether his framework *can* consistently exclude majority distress without ad hoc tools.  

  ---

  ### **3. Consent’s Derivative Role**  
  *Question:* Bentham treats consent not as intrinsic but as instrumental to security and expectation. Does this imply that in a society with radically different expectations (e.g., where non-consensual acts are normalized), consent loses moral significance?  
  - **Likely Reply**: No. Consent remains crucial because *frustrated expectation* inherently causes pain—even in atypical societies, non-consensual acts would still cause individual trauma and social instability.  
  - **Costly Follow-Up**: If pain hinges on *subjective* expectation, what about a victim in a "normalized" society who doesn’t *experience* trauma because they’re socialized to accept violation? Does the act become permissible if it causes no measurable pain?  
  - **Bentham vs. Revision**: *Reporting*. Bentham rooted consent in pain from disappointed expectation (e.g., *Principles of Morals and Legislation*, Ch. XVI).  
  - **Historian Consensus**: **Agreed**. This is standard Bentham; consent matters solely via consequences.  

  ---

  ### **4. Consent Follow-Up: Expectation vs. Harm**  
  *Question* (following #3): If consent is only a proxy for pain prevention, could we replace it with a more reliable indicator (e.g., brain scans ensuring no trauma)? Would this make non-consensual but "pain-free" acts acceptable?  
  - **Likely Reply**: No. Consent is the *only* practical safeguard for security. Bypassing it risks abuse and systemic distrust, causing net social pain—even if pain is absent in isolated cases.  
  - **Costly Follow-Up**: Doesn’t this concede that consent has intrinsic weight beyond immediate pain? If Bentham’s theory demands we ignore infallible neuroscience to preserve a *symbolic* norm, is it truly consequentialist?  
  - **Bentham vs. Revision**: *Revising*. Bentham never addressed hypotheticals like brain scans; this requires extending his security principle.  
  - **Historian Consensus**: **N/A**. Purely speculative; no historical analogue.  

  ---

  ### **5. State Obligation for Frustrated Appetite**  
  *Question:* If unfulfilled sexual desire causes pain (intensity/duration), does the state have a positive obligation to facilitate relief? If not, why do only *some* pains (e.g., hunger) obligate state aid?  
  - **Likely Reply**: Only if relief is *efficient* (high fecundity/purity) and state intervention prevents greater pain than it causes. Sexual appetite is typically manageable privately, unlike starvation.  
  - **Costly Follow-Up**: If the "cheapest reliable relief" for isolated populations (e.g., incarcerated or disabled persons) is state-funded sex workers or devices many find "offensive," must the state provide it? If not, is it prioritizing others’ disgust over measurable pain?  
  - **Bentham vs. Revision**: *Reporting*. Bentham supported state aid only when benefits (pain reduction) outweigh costs (*Constitutional Code*).  
  - **Historian Consensus**: **Agreed**. Bentham endorsed state intervention for welfare but prioritized cost-benefit analysis.  

  ---

  ### **6. Age Thresholds and Pleasure Quantity**  
  *Question*: If "no pleasure ranks higher by kind," what quantitative threshold justifies age-of-consent laws? How do you measure capacity without invoking qualitative "maturity" or "corruption"?  
  - **Likely Reply**: Thresholds rest on *reliably assessing consequences*. Children lack the experience to weigh intensity/duration/feoundity of pleasure vs. risks (e.g., pregnancy, exploitation).  
  - **Costly Follow-Up**: If a 12-year-old demonstrates superior understanding of consequences than a typical 16-year-old, and both derive net pleasure, is the act permissible? If not, is the "capacity" test a stand-in for qualitative values?  
  - **Bentham vs. Revision**: *Revising*. Bentham never systematized age thresholds; his focus was on "understanding" for contract law.  
  - **Historian Consensus**: **Contested**. Bentham opposed arbitrary age lines but didn’t resolve capacity measurement. Scholars debate if his psychology allows pure quantification.  

  ---

  ### **7. Purity and Anti-Qualitative Commitments**  
  *Question*: Bentham’s "purity" metric (pleasure not followed by pain) seems to rank pleasures—e.g., addiction’s "impure" pleasure. Doesn’t this contradict the claim that "no sexual act is degrading in itself"?  
  - **Likely Reply**: Purity is quantitative: it measures *duration* of net pleasure. "Degrading" implies intrinsic wrongness; purity is about contingent future pains (e.g., STIs, regret).  
  - **Costly Follow-Up**: If society deems an act "impure" due to non-painful disgust (e.g., consensual necrophilia), and this causes social strife (pain), doesn’t purity *functionally* replicate qualitative ranking?  
  - **Bentham vs. Revision**: *Reporting*. Purity is one of Bentham’s seven metrics (*Principles*, Ch. IV).  
  - **Historian Consensus**: **Agreed**. Purity is uncontroversially consequentialist.  

  ---

  ### **8. Non-Punitive Social Sanctions**  
  *Question*: If disgust isn’t grounds for legal punishment, can it justify *social* sanctions (e.g., shaming, ostracism) that deter "offensive" acts by inflicting pain to prevent greater pain (e.g., family breakdown)?  
  - **Likely Reply**: No. Social sanctions are evil unless proven to prevent greater harm (e.g., deterring assault). Disgust-based shaming usually causes net pain (e.g., LGBTQ+ suicides) without preventing harm.  
  - **Costly Follow-Up**: If a community *empirically* shows that shaming non-procreative sex strengthens family units (reducing child-neglect pain), must Benthamites endorse it?  
  - **Bentham vs. Revision**: *Reporting*. Bentham opposed social punishment without utility (*Offences Against Oneself*).  
  - **Historian Consensus**: **Agreed**. Bentham condemned "moral" sanctions lacking empirical benefit.  

  ---

  ### **9. Abandoning the Framework**  
  *Question*: What empirical discovery or theoretical challenge would make you abandon Benthamite hedonism? For example, if neuroscience proved that "dignity violations" cause irreducibly distinct pain, would that demand qualitative rankings?  
  - **Likely Reply**: Only if pleasure/pain *cannot* be measured interpersonally—rendering utilitarianism impractical. Neuroscience might reveal new *dimensions* of pain, but all remain quantifiable via Bentham’s criteria.  
  - **Costly Follow-Up**: If we could prove that certain acts (e.g., consensual incest) cause society-wide *subclinical* pain (e.g., reduced trust) immeasurable by your metrics, would you still permit them?  
  - **Bentham vs. Revision**: *Reporting*. Bentham admitted interpersonal comparison difficulties but saw no alternative.  
  - **Historian Consensus**: **Contested**. Bentham believed in measurability; modern scholars call it his "Achilles’ heel."  

  ---

  **Key to Consensus Marking**:  
  - **Agreed**: Well-documented in Bentham’s texts with broad scholarly acceptance.  
  - **Contested**: Active debate exists; no settled interpretation.  
  - **N/A**: Extension beyond Bentham’s explicit arguments.  

  This structure ensures contested readings are flagged, follow-ups target theoretical tensions, and her extensions beyond Bentham are clarified—aligning with your podcast’s historical rigor.
