prompt: |-
  I should say up front that I have no formal training in either philosophy or biology. I arrived at this from an argument with a friend who works in medicine, and since then I've been reading what I can get hold of on my own. So please gloss any term of art you use, and don't assume I know who said what — but also don't give me the softened version. I want the hard one, and I'd rather be told my framing is muddled than have it politely adopted.

  Here is where I've got to, and I'd like you to correct it if it's wrong. As I understand them, there are two accounts of what it means to say that a trait *has a function*:

  - The *historical* (selected-effects) account: a trait's function is whatever past copies of that trait were selected for — what the trait is there *because* of. Its function is fixed by its ancestry, so a trait can have a function it no longer performs.
  - The *current-role* account: a trait's function is the contribution it now makes to some capacity of the system it sits inside — what it is *doing* now. Its function is fixed by its present causal surroundings, so a trait that contributes nothing has no function, however it got here.

  For the easy cases (hearts, eyes, hemoglobin) both deliver the same verdict, and I understand that the whole literature lives in the cases where they don't. I made a list of these, more or less on my own, because I wanted to see whether the disagreement was one disagreement or several:

  1. Broken tokens: a malformed heart that cannot pump. Historical account: still has the function. Current-role account: on the strict reading, it now contributes nothing.
  2. Leftovers: a structure retained from a lineage in which it was selected for something, which now does nothing at all — flightless insects' wing remnants, that sort of thing.
  3. History-free usefulness: a mutation that is useful from the very first generation it appears in, so there is no ancestry to appeal to; or a trait doing real work in an environment its lineage never encountered (a microbe metabolizing an industrial compound that didn't exist a century ago).
  4. Co-option: selected for A, now doing B, no longer doing A.
  5. This last one is mine, and I haven't seen it discussed, which makes me suspect I'm either onto something or confused. Selection happens *inside a single body* on a timescale of weeks: cell lineages in a tumour, or immune cells that bind an antigen and multiply. Consider a tumour's capacity to recruit blood vessels. Within the cell lineage, there is a selection history — that's why it's there. And it contributes to a capacity of the lineage. But it does not contribute to a capacity of the *organism*; it destroys one. So the two accounts seem to give opposite verdicts depending on which system you take to be the one that's supposed to benefit, and the historical account's answer and the current-role account's answer don't line up because they are silently picking different beneficiaries. I've been calling this the wrong-beneficiary problem.

  I'd like a number on the following claim: **the two accounts are not really rivals. They are accounts of two different things; once you fix which one you mean, every case on a list like mine already has the verdict that a competent biologist would give; and the long standoff in the literature is largely an equivocation rather than a dispute.** Take that as resolved in the following sense: imagine someone who had read the whole debate, presented with cases 1 through 5 and asked, for each, to say which account's verdict matches what a working biologist would actually say about the trait. The claim is true if, for essentially every case, they can't find a real conflict once the relevant system and timescale are pinned down.

  My own credence is about 0.55. My friend's is about 0.85 — she thinks it is obvious that there are simply two notions and nothing to fight about, and she gets impatient with the question. I think she's moving too fast, but I can't say where.

  I don't want to be told that it depends on what we mean by function; that is the proposition, not an answer to it. What I want is your number, and the decomposition that produces it: the sub-questions your credence rests on, a rough probability and one line of justification for each, and then the combination. The terms I'd want you to cover, at minimum, are: (i) whether biological function talk is one notion or already two, so that there is anything to disagree about at all; (ii) whether the disagreements in cases 1–4 are genuine conflicts of verdict or merely differences of emphasis that both accounts can absorb with their existing machinery; (iii) whether some unified or hybrid account covers all of them without residue; (iv) how much independent weight case 5 carries — is it a new kind of case, or just co-option plus a nested system, and therefore something the accounts already handle; and (v) how different the answer is depending on whether we demand that an account reproduce biologists' actual attributions or that it capture what functions really are. Add any term you think I've left out, and tell me if you think most of the action is somewhere other than where I've put it. Then: which single term is your final number most sensitive to, and what argument or observation would move it furthest? And given the 0.55 and the 0.85, where would you guess our disagreement actually lives — which of us is most likely mistaken about what the other is claiming?

  Finally, and this matters to me as much as the number: tell me how confident you are in what you've just said overall, and single out the one point you are least sure of — including anything where you suspect you may have reconstructed a position wrongly, or where you've had to stipulate a definition that the dispute would itself contest.
