             + [Σ_s P(Y=1|T=0,S=s) * (P(S=s|T=1) - P(S=s|T=0))]

  The first term is a weighted average of the stratum-specific RDs (with weights P(S=s|T=1)). The second term is the composition term.

  In part (a), if we let T=1 be drug B and T=0 be drug A.

