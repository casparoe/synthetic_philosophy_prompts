answer: |-
  ### Exam Question: Simpson's Paradox and Causal Inference (25 marks)

  **Part (a) Reversal Demonstration**  
  The table below compares recovery rates for Drug A vs. Drug B, stratified by disease severity (Mild/Severe).  

  |          | Mild             | Severe           | Pooled           |
  |----------|------------------|------------------|------------------|
  | Drug A   | 90 recover / 100 | 30 recover / 100 | 120 recover / 200 |
  | Drug B   | 76 recover / 80  | 56 recover / 160 | 132 recover / 240 |

  (i) Calculate the recovery rate (as a percentage) for each drug in the Mild stratum, Severe stratum, and pooled data.  
  (ii) State which drug is better in each stratum and in the pooled data. Precisely describe the reversal.  
  *(6 marks)*  

  **Part (b) Causal Stories**  
  Using the **same data** from (a):  
  (i) Propose a causal story where "severity" is a *pre-treatment confounder* (e.g., influences drug choice). Explain which analysis (stratum-specific or pooled) should guide clinical decisions.  
  (ii) Propose a causal story where "severity" is a *post-treatment mediator* (e.g., caused by the drug). Explain which analysis should guide decisions.  
  *(6 marks)*  

  **Part (c) Decomposition and Randomization**  
  (i) For binary treatment, outcome, and stratifier \(S\), assume treatment assignment is independent of \(S\). Show the pooled risk difference (RD) is a convex combination of stratum-specific RDs:  
  \[\text{RD}_{\text{crude}} = \sum_s P(S=s) \cdot \text{RD}_s\]  
  Using the data from (a) with Drug B as treatment (T=1) and Drug A as control (T=0):  
  - Compute the stratum-specific RDs (\(\text{RD}_s = P(Y=1|T=1,S=s) - P(Y=1|T=0,S=s)\)).  
  - Compute the composition term \(\sum_s P(Y=1|T=0,S=s) \left[ P(S=s|T=1) - P(S=s|T=0) \right]\).  
  - Verify \(\text{RD}_{\text{crude}} = (\text{Effect Term}) + (\text{Composition Term})\).  
  Explain why reversal is impossible if treatment is independent of \(S\).  

  (ii) In a randomized trial, patients are assigned 50% to treatment/control in two strata:  
  | Stratum | Control       | Treatment     |  
  |---------|---------------|---------------|  
  | 1       | 200 rec / 1000 | 500 rec / 1000 |  
  | 2       | 50 rec / 1000  | 174 rec / 1000 |  
  - Compute the odds ratio (OR) for each stratum and the pooled OR.  
  - Explain why the pooled OR differs from the stratum-specific ORs (≈4.0) despite randomization. Which OR should be reported for the treatment effect? Why?  
  *(10 marks)*  

  **Part (d) Subgroup Claims**  
  A researcher runs 30 subgroup analyses in a randomized trial and reports one subgroup where the treatment effect reverses. Using insights from (b) and (c), explain why this is unreliable. What would make a subgroup claim credible?  
  *(3 marks)*  

  ---

  ### Model Answer (Approx. 800 words)  

  **Part (a)**  
  (i) Recovery rates:  
  - **Mild**: Drug A = 90/100 = 90%, Drug B = 76/80 = 95%.  
  - **Severe**: Drug A = 30/100 = 30%, Drug B = 56/160 = 35%.  
  - **Pooled**: Drug A = 120/200 = 60%, Drug B = 132/240 = 55%.  
  (ii) **Reversal**:  
  - In *both* strata, Drug B has a higher recovery rate (Mild: 95% > 90%, Severe: 35% > 30%; difference +5% each).  
  - Pooled data shows Drug A has a higher rate (60% > 55%; difference +5%).  
  This is Simpson’s paradox: The pooled estimate reverses the direction of association seen in every stratum.  

  **Part (b)**  
  (i) **Confounder story**: Severity is a baseline factor affecting drug choice (e.g., doctors prescribe Drug B more for severe cases). Drug B is chosen more often in severe cases (160/240) than Drug A (100/200). Since severity lowers recovery, the pooled comparison is confounded. **Trust stratum-specific analysis**: It adjusts for severity, showing Drug B is better in both groups.  
  (ii) **Mediator story**: "Severity" is a side effect caused by the drug (e.g., Drug A induces severe symptoms in some patients). Drug assignment is random, but Drug A causes severe state (100/200 on A become "severe" vs. 160/240 on B). **Trust pooled analysis**: It captures the total effect (including mediation path). Stratifying blocks Drug A’s effect via severity, biasing estimates.  

  **Part (c)**  
  (i) **Decomposition**: Under independence (\(P(S=s|T=1) = P(S=s|T=0)\)):  
  \[\text{RD}_{\text{crude}} = \sum_s \color{red}{P(S=s|T=1)} \text{RD}_s \color{black} + \sum_s \color{blue}{P(Y=1|T=0,S=s) \left[ P(S=s|T=1) - P(S=s|T=0) \right]}\]  
  If independence holds, the blue term vanishes, leaving \(\text{RD}_{\text{crude}} = \sum_s P(S=s) \cdot \text{RD}_s\) (convex combination). Reversal is impossible since \(\text{RD}_{\text{crude}}\) must lie between min/max \(\text{RD}_s\).  

  **Calculation for (a) data** (T=1: Drug B, T=0: Drug A):  
  - \(\text{RD}_{\text{Mild}} = 0.95 - 0.90 = 0.05\), \(\text{RD}_{\text{Severe}} = 0.35 - 0.30 = 0.05\).  
  - \(P(S=\text{Mild}|T=1) = 80/240 = 1/3\), \(P(S=\text{Mild}|T=0) = 100/200 = 0.5\).  
  - **Effect term (red)**: \((1/3)(0.05) + (2/3)(0.05) = 0.05\).  
  - **Composition term (blue)**: \(\left[0.90 \cdot (1/3 - 0.5)\right] + \left[0.30 \cdot (2/3 - 0.5)\right] = 0.90 \cdot (-1/6) + 0.30 \cdot (1/6) = -0.10\).  
  - \(\text{RD}_{\text{crude}} = 0.55 - 0.60 = -0.05 = 0.05 + (-0.10)\).  
  Reversal occurs because the composition term is large and negative (treatment not independent of severity).  

  (ii) **Randomized trial**:  
  - **Stratum 1 OR**: \(\frac{(500/500)}{(200/800)} = \frac{1}{0.25} = 4.0\).  
  - **Stratum 2 OR**: \(\frac{(174/826)}{(50/950)} \approx \frac{0.2106}{0.0526} \approx 4.0\).  
  - **Pooled**: Control events = 200+50=250/2000, non-events=1750; Treatment events=500+174=674/2000, non-events=1326.  
    Pooled OR = \(\frac{(674/1326)}{(250/1750)} \approx \frac{0.508}{0.1429} \approx 3.55\).  
  **Explanation**: Pooled OR (3.55) < stratum-specific ORs (4.0) due to **non-collapsibility** (odds ratios are not collapsible). This is **not** Simpson’s paradox (no confounding; randomization ensures independence). **Report stratum-specific ORs**: They are unbiased and constant (≈4.0), while pooled OR is distorted by stratum imbalance.  

  **Part (d)**  
  **Why unreliable**:  
  - (b) Reversal may arise from conditioning on a mediator (invalid) or confounding, but subgroup-finding lacks causal justification.  
  - (c) Multiple testing inflates false positives; non-collapsibility may cause heterogeneity without true effect modification.  
  **Credibility requires**: Pre-specified subgroups, biological plausibility, and independent replication.  

  ---

  ### Marking Scheme (Total 25 marks)  

  | Part | Marks | A-Grade Requirements                                                                 | B-Grade Requirements                                                                | Common Mistakes                                                                 |
  |------|-------|--------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | (a)  | 6     | Correct rates (90%,95%,30%,35%,60%,55%); identifies B better in strata, A pooled; precise reversal statement. | Minor arithmetic errors; reversal described imprecisely.                          | Miscomputing rates; missing reversal despite correct numbers.                   |
  | (b)  | 6     | Clear confounder story (affects T and Y); clear mediator story (T→S→Y); correct analysis choice for each. | Story lacks mechanism (e.g., no link to Y); analysis choice not justified.       | Confusing mediator/confounder; claiming "always stratify" without causal logic. |
  | (c)(i)| 5    | Derives RD formula under independence; computes both terms correctly; explains reversal impossibility. | Correct computations but incomplete derivation; notes independence failure.     | Incorrect P(S=s&#124;T); miscomputing composition term; not linking reversal to independence. |
  | (c)(ii)|5    | ORs ≈4.0 (strata), ≈3.55 (pooled); attributes gap to non-collapsibility, not confounding; prefers stratum-specific OR. | Correct ORs but unclear explanation; suggests confounding.                     | Miscomputing ORs; calling this Simpson’s paradox; recommending pooled OR.      |
  | (d)  | 3     | Cites mediator/confounding from (b) and multiple testing/non-collapsibility from (c); lists credibility criteria. | Vague reference to (b)/(c); incomplete credibility criteria.                   | Blaming only "correlation ≠ causation"; omitting multiple testing.              |  

  **A/A+ Threshold**: Correct computations in (a), (c); explicit causal reasoning in (b), (d); synthesizes decomposition/randomization in (c).  
  **B Threshold**: Minor errors in computation/story; understands reversal but not decomposition/non-collapsibility.  

  ---  
  **Note**: This question tests causal intuition beyond "disaggregate!" by forcing engagement with assignment mechanisms, decomposition, and non-collapsibility. Students often miss the causal story nuance (b), conflate non-collapsibility with confounding (c), or fail to critique subgroup fishing (d).
