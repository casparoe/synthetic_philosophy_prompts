  **Exam Question**

  **Part (a)** [6 marks]

  Consider the following data from a study comparing two drugs (A and B) for a disease. Patients are classified as having either mild or severe disease at baseline.

  |          | Mild             | Severe           | Pooled           |
  |----------|------------------|------------------|------------------|
  | Drug A   | 90 recover / 100 | 30 recover / 100 | 120 recover / 200 |
  | Drug B   | 76 recover / 80  | 56 recover / 160 | 132 recover / 240 |

  Compute the recovery rate (as a percentage) for each drug in the mild stratum, in the severe stratum, and in the pooled data. State precisely the direction of the treatment effect (which drug is better) in each stratum and in the pooled data, and identify the Simpson's paradox reversal.

  **Part (b)** [6 marks]

  The same data as in part (a) can be interpreted differently depending on the causal relationship between severity, drug assignment, and recovery.

  (i) Provide a causal story in which disease severity (mild or severe) is a pre-treatment variable (a confounder) that influences both the drug assignment and the recovery. In this scenario, which analysis (stratum-specific or pooled) should we trust for deciding which drug is better? Why?

  (ii) Provide a causal story in which "disease severity" is not a pre-treatment variable but rather a post-treatment outcome (a mediator) that is affected by the drug and then affects recovery. In this scenario, which analysis (stratum-specific or pooled) should we trust? Why?

  **Part (c)** [10 marks]

  (i) Consider the general case of a binary outcome, binary treatment, and a binary stratifier S. Assume that within each stratum of S, the treatment assignment is independent of the potential outcomes (i.e., no unmeasured confounding within strata). Show that the crude (pooled) risk difference (RD) is a convex combination of the stratum-specific risk differences. Specifically, derive the formula:

    RD_crude = Σ_s P(S=s) * RD_s

  where RD_s is the risk difference in stratum s. Use the data from part (a) to compute both the crude risk difference and the weighted average of the stratum-specific risk differences (using P(S=s) from the entire population). Explain why, under this independence assumption, a reversal in the risk difference (like the one in part a) is impossible. Also, comment briefly on why the same logic extends to the risk ratio and odds ratio (though the odds ratio is not collapsible, note that without confounding a reversal is still impossible).

  (ii) Now consider a different randomized trial, where patients are randomized to treatment or control within two strata (Stratum 1 and Stratum 2). The data are:

  Stratum 1 (high risk):
    Control: 200 recoveries out of 1000 patients
    Treatment: 500 recoveries out of 1000 patients

  Stratum 2 (low risk):
    Control: 50 recoveries out of 1000 patients
    Treatment: 174 recoveries out of 1000 patients

  Compute the odds ratio for the treatment effect in each stratum and the pooled odds ratio. You will observe that the stratum-specific odds ratios are approximately equal (about 4.0), but the pooled odds ratio is less than 4.0. Explain why this difference is not an instance of Simpson's paradox. In the context of this randomized trial, which odds ratio (stratum-specific or pooled) should be reported as the treatment effect? Why?

  **Part (d)** [3 marks]

  A researcher conducts a randomized trial and then slices the data into thirty subgroups. In one subgroup, the sign of the treatment effect flips (i.e., the treatment appears harmful in that subgroup but beneficial overall). Referring to the concepts in parts (b) and (c), explain why this subgroup finding does not necessarily mean that the treatment is harmful for that subgroup. What would have to be true for a subgroup claim to be credible?

