  Therefore, in the model answer for (c)(i), we must note that the independence assumption fails in part (a) and that is why there is a reversal.

  But in the question, we ask to derive under independence and then use the part (a) data to compute both. However, in part (a) data, independence doesn't hold. We should use a different example for the decomposition? Or we can use the formula under independence and then note that in part (a) independence does not hold so the formula doesn't apply.

