    - Drug A: 90/100 = 90%
    - Drug B: 76/80 = 95%
    -> Drug B is better by 5 percentage points.

  - Severe stratum:
    - Drug A: 30/100 = 30%
    - Drug B: 56/160 = 35%
    -> Drug B is better by 5 percentage points.

  - Pooled:
    - Drug A: 120/200 = 60%
    - Drug B: 132/240 = 55%
    -> Drug A is better by 5 percentage points.

  Reversal: In each stratum, drug B has a higher recovery rate. However, in the pooled data, drug A has a higher recovery rate. This is a reversal of the association.

  **Part (b)**

  (i) Causal story with severity as a confounder: Disease severity is a baseline condition. Doctors are more likely to prescribe drug B to patients with severe disease because they believe drug B is stronger. However, severe disease is also associated with lower recovery rates. In this case, the stratified analysis is appropriate because it adjusts for the confounder. We trust the stratum-specific results: drug B is better for both mild and severe patients.

  (ii) Causal story with severity as a mediator: Suppose the drug assignment is random (or not influenced by baseline factors). However, drug A has a side effect that causes severe disease (or increases disease severity) in some patients. Then the "severity" variable in the table is actually an intermediate outcome (post-treatment). In this case, the pooled analysis estimates the total effect of the drug (which includes both the direct effect and the indirect effect via severity). We trust the pooled analysis: drug A is better overall. Conditioning on severity (a mediator) would block part of the effect and lead to biased estimates of the total effect.

  **Part (c)**

  (i) Under the assumption that within each stratum of S, treatment assignment is independent of potential outcomes (no unmeasured confounding within strata), we have:

    P(Y=1|T=1, S=s) = P(Y=1|T=1, S=s) [potential outcome under treatment]
    P(Y=1|T=0, S=s) = P(Y=1|T=0, S=s) [potential outcome under control]

  The crude risk difference is:

    RD_crude = P(Y=1|T=1) - P(Y=1|T=0)

  By law of total probability:

    P(Y=1|T=1) = Σ_s P(Y=1|T=1, S=s) P(S=s|T=1)
    P(Y=1|T=0) = Σ_s P(Y=1|T=0, S=s) P(S=s|T=0)

  If we also assume that treatment assignment is independent of S, then P(S=s|T=1)=P(S=s|T=0)=P(S=s). Then:

    P(Y=1|T=1) = Σ_s P(Y=1|T=1, S=s) P(S=s)
    P(Y=1|T=0) = Σ_s P(Y=1|T=0, S=s) P(S=s)

  Therefore:

    RD_crude = [Σ_s P(Y=1|T=1, S=s) P(S=s)] - [Σ_s P(Y=1|T=0, S=s) P(S=s)]
              = Σ_s [P(Y=1|T=1, S=s) - P(Y=1|T=0, S=s)] P(S=s)
              = Σ_s RD_s * P(S=s)

  This is a convex combination of the stratum-specific risk differences (with weights P(S=s)), so the crude RD must lie between the minimum and maximum of the stratum-specific RDs. Hence, if all stratum-specific RDs are positive (or negative), the crude RD cannot be negative (or positive) — no reversal.

  For risk ratio, a similar result holds (though not necessarily a convex combination, the direction is preserved). For odds ratio, without confounding the pooled OR may be biased toward the null due to non-collapsibility, but it will not reverse direction if the stratum-specific ORs are all above 1 or all below 1.

  In part (a) data, we see a reversal in the risk difference. This implies that the assumption of independence between treatment and S (given by P(S=s|T=1)=P(S=s|T=0)) does not hold. Indeed, in the data:

    P(S=mild|T=A) = 100/200 = 0.5
    P(S=mild|T=B) = 80/240 ≈ 0.333
    Similarly, P(S=severe|T=A)=0.5, P(S=severe|T=B)=160/240≈0.667.

  Thus, treatment and severity are not independent.

  (ii) Stratum-specific odds ratios:

  - Stratum 1 (high risk):
    Control: 200/1000 -> odds_control = 200/800 = 0.25
    Treatment: 500/1000 -> odds_treatment = 500/500 = 1
    OR1 = (1) / (0.25) = 4.0

  - Stratum 2 (low risk):
    Control: 50/1000 -> odds_control = 50/950 ≈ 0.05263
    Treatment: 174/1000 -> odds_treatment = 174/826 ≈ 0.21065
    OR2 = (0.21065) / (0.05263) ≈ 4.0036 ≈ 4.0

  Pooled data:
    Control: 200+50=250 events out of 2000 -> non-events=1750
    Treatment: 500+174=674 events out of 2000 -> non-events=1326

    Odds_control_pooled = 250 / 1750 ≈ 0.14286
    Odds_treatment_pooled = 674 / 1326 ≈ 0.50830
    OR_pooled = (0.50830) / (0.14286) ≈ 3.558

  The pooled OR (about 3.56) is less than the stratum-specific ORs (4.0). This is not Simpson's paradox because there is no confounding (the trial is randomized within strata). The difference is due to the non-collapsibility of the odds ratio. The stratum-specific ORs are the correct estimates of the treatment effect in each stratum. The pooled OR is a weighted average that is affected by the baseline risks and the distribution of the strata. Since the treatment effect is constant (OR=4 in both strata), we should report the common stratum-specific OR (4.0) as the treatment effect. The pooled OR is not appropriate for a single summary because it is not collapsible.

  **Part (d)**

  The machinery in (b) and (c) does not license subgroup fishing because:

  - In (b), the decision to condition on a variable requires knowing the causal structure. If we condition on a variable that is not a confounder (e.g., a mediator) we may introduce bias. The subgroup found might be defined by a post-treatment variable, making the subgroup analysis invalid for causal inference.

  - In (c), even in a randomized trial, the effect estimate in a subgroup may differ due to chance or non-collapsibility, but that doesn't imply a true difference in effect. The apparent reversal in one subgroup may be a false positive due to multiple testing.

  For a subgroup claim to be credible, we require:

  - Pre-specification of the subgroup before the trial.
  - A strong prior biological or theoretical rationale for why the effect would differ in that subgroup.
  - Replication of the finding in independent studies.

  ---

