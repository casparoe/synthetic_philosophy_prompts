    = [P(Y=1|A, mild) * (P(mild|B) - P(mild|A))] + [P(Y=1|A, severe) * (P(severe|B) - P(severe|A))]
    = [0.90 * (1/3 - 0.5)] + [0.30 * (2/3 - 0.5)]
    = [0.90 * (-1/6)] + [0.30 * (1/6)]
    = [0.90 * -0.1667] + [0.30 * 0.1667]
