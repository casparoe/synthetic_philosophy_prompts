    RD_crude = (Σ_s P(S=s|T=1) * RD_s) + (Σ_s [P(Y=1|T=0,S=s) * (P(S=s|T=1) - P(S=s|T=0))])

  where the first term is a weighted average of the stratum-specific risk differences (RD_s) and the second term is a composition/selection term. 

