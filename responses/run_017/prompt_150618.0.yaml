  They are not equal. So the derivation requires independence, which we don't have. Therefore, we cannot use the formula RD_crude = Σ_s RD_s * P(S=s). Instead, the correct decomposition is:

  RD_crude = [Σ_s P(S=s|T=1) * RD_s] + [Σ_s (P(Y=1|T=0,S=s) * (P(S=s|T=1) - P(S=s|T=0)))]

