prompt: |-
  I commission and edit evolutionary-explanation pieces for a popular-science magazine — roughly one "why do humans or other animals have trait X?" feature a month — and I want a triage procedure my editors can run on any proposed adaptive explanation before we buy it. I want the steelman version of the Gould–Lewontin spandrels critique, not the version that mostly licenses us to feel smarter than whoever pitched the story, and not a blanket skepticism that would make the section impossible to fill.

  Concretely: an ordered checklist of questions, with what counts as a sufficient answer to each, a point at which the procedure stops with a no, and the points where it hands the question back to a human because it is editorial or value judgment rather than evidence. My editors are generalists with at most an undergraduate biology course, they have about twenty minutes per pitch, and I sign off on the outcome, so the procedure has to be runnable without a specialist in the room and say plainly when it cannot be.

  The distinctions I most want preserved rather than flattened by the simplification: current utility versus historical selection for that effect — a trait can be useful now without having been built for that use — and, among the non-adaptive explanations, structural byproduct with no current function versus byproduct later co-opted for a function versus a trait that made sense in an ancestral environment and is now mismatched or locked in by lineage history. I also want the procedure to include what I call the accessibility check: is there some variant near the actual trait that would perform the alleged function better and that the lineage could plausibly have reached? If such a variant exists and is absent, the adaptive story owes us an explanation, and I want the procedure to say what would discharge that debt.

  Then run it on three pitches: one arguing that the human taste for spicy food is an antimicrobial adaptation; one arguing that music is a byproduct of other cognitive machinery with no adaptive story of its own; and one that I expect to be uncomfortable, since my house line is that our debunkings are better evidenced than the adaptationist claims they mock, and I suspect a symmetric procedure will say they are often not. Show me where that suspicion is correct and where it is not, and be honest about what the procedure cannot settle even in principle.
reasoning: |-
  We are designing a triage procedure for adaptive explanations. The goal is to evaluate pitches for evolutionary explanations of traits, with a focus on avoiding adaptationist just-so stories while still allowing well-supported adaptive hypotheses. The procedure should be runnable by editors with basic biology knowledge in about 20 minutes.

  Key distinctions to preserve:
  1. Current utility vs. historical selection for that effect.
  2. Non-adaptive explanations: 
     a. Structural byproduct with no current function.
     b. Byproduct later co-opted for a function (exaptation).
     c. Trait that was adaptive in the past but now mismatched or locked in by lineage history.

  Additionally, we want an "accessibility check": Is there a variant near the actual trait that would perform the alleged function better and that the lineage could plausibly have reached? If so, the adaptive story must explain why that variant is absent.

  The procedure will be an ordered checklist of questions. Each question must be answered with sufficient evidence. If at any point the answer is "no" and no sufficient explanation is provided, the pitch is rejected. Some questions may require human judgment and if so, the procedure will note that and the editor can flag it for further consideration.

  Checklist:

  1. **Trait Definition**: Is the trait clearly defined and measurable?
     - Sufficient: The pitch provides a clear, operational definition of the trait and how it can be observed/measured.
     - Insufficient: The trait is vague, overly broad, or not defined in a way that allows for empirical testing.
     - Stop: If the trait cannot be defined, stop and reject.

  2. **Function Claim**: Does the pitch clearly state the proposed function (i.e., the adaptive benefit) and the selective pressure?
     - Sufficient: The pitch identifies a specific fitness advantage (e.g., survival or reproductive success) and the environmental context (selective pressure) that would have favored the trait.
     - Insufficient: The function is stated vaguely (e.g., "it's good for you") or without a clear selective pressure.
     - Stop: If no function is proposed (i.e., the pitch is non-adaptive), skip to step 6 for non-adaptive categories. Otherwise, proceed.

  3. **Current Utility vs. Historical Selection**: Does the pitch distinguish between the trait being currently useful and having been shaped by natural selection for that use?
     - Sufficient: The pitch provides evidence that the trait was selected for the proposed function (historical selection) and not just that it is currently useful.
     - If the pitch only claims current utility, note that it is not making a historical claim and proceed to step 4 (but flag for caution in presentation).
     - If the pitch claims historical selection, then we require evidence for that.

  4. **Evidence for Adaptation** (if historical selection is claimed):
     a. **Comparative Evidence**: Are there comparisons across species or populations that support the adaptive hypothesis?
       - Sufficient: The pitch cites studies showing that the trait correlates with the proposed selective pressure across species or populations, and that it is heritable.
       - Insufficient: No comparative data, or the data do not control for phylogeny (i.e., the trait might be shared due to common ancestry, not adaptation).
     b. **Experimental Evidence**: Is there experimental or observational evidence that the trait confers a fitness advantage in the relevant environment?
       - Sufficient: Experiments (e.g., in the lab or field) show that individuals with the trait have higher survival/reproduction in environments with the selective pressure, or that removing the trait reduces fitness.
       - Insufficient: Only anecdotal or hypothetical evidence.
     c. **Fossil/Historical Evidence**: Is there evidence from the fossil record or ancient DNA about the trait's evolution and the environment at the time?
       - Sufficient: Data showing the trait emerged when the selective pressure was present and that it spread.
       - Note: This is often hard to get, so it can be supplementary.

     - If the pitch lacks sufficient evidence from at least two of the above (a, b, c), then the historical claim is weak. Proceed to step 5 (accessibility check) and step 6 (non-adaptive alternatives) for a more critical look.

  5. **Accessibility Check**: Is there a variant near the actual trait that would perform the alleged function better and that the lineage could plausibly have reached?
     - Sufficient: The pitch addresses this by either:
       a. Arguing that no such variant exists (i.e., the current trait is optimal or near-optimal for the function).
       b. Explaining why the better variant was not accessible (e.g., due to developmental constraints, lack of genetic variation, or trade-offs with other functions).
     - Insufficient: The pitch does not address this, and a better variant is obvious and accessible (e.g., a simple change that would improve the function without apparent costs).
     - Stop: If the pitch fails the accessibility check and provides no explanation, reject the adaptive story.

  6. **Non-Adaptive Alternatives**: Does the pitch consider and rule out non-adaptive explanations?
     - The non-adaptive alternatives are:
       a. **Structural byproduct**: The trait is a necessary consequence of development or physics (e.g., spandrels) with no function.
       b. **Exaptation**: The trait arose as a byproduct but was later co-opted for a function.
       c. **Phylogenetic constraint or mismatch**: The trait was adaptive in the past but is now mismatched due to environmental change, or it is locked in by lineage history.
     - Sufficient: The pitch discusses these alternatives and provides evidence against them (e.g., showing that the trait is not a byproduct of development, or that it did not exist prior to the function).
     - Insufficient: The pitch ignores non-adaptive alternatives or dismisses them without evidence.
     - Note: If the pitch is non-adaptive (step 2), then we require evidence for one of these non-adaptive explanations.

  7. **Overall Plausibility**: Is the adaptive story coherent and consistent with known biology?
     - This is a human judgment step. The editor should consider if the story makes sense given what we know about the organism and evolution. For example, does the proposed function require an implausible chain of events? Are the costs of the trait considered? Is the timescale for evolution reasonable?
     - If there are red flags (e.g., the trait is costly and the benefit is minimal, or the selective pressure is weak), the pitch may be rejected.

  Procedure Flow:
  - Step 1: Define trait. If not, reject.
  - Step 2: If adaptive pitch, state function and selective pressure. If non-adaptive, skip to step 6.
  - Step 3: Distinguish current utility vs historical selection. If only current utility, note and proceed. If historical, require evidence in step 4.
  - Step 4: Check evidence for adaptation (if historical). If weak, proceed to steps 5 and 6 with caution.
  - Step 5: Accessibility check. If fails without explanation, reject.
  - Step 6: Consider non-adaptive alternatives. If ignored without reason, reject or flag as weak.
  - Step 7: Overall plausibility (editorial judgment). If implausible, reject.

  Now, run the procedure on the three pitches:

  Pitch 1: Human taste for spicy food as an antimicrobial adaptation.

  1. **Trait Definition**: Clear. Trait: preference for spicy food (specifically, capsaicin and other spicy compounds).
  2. **Function Claim**: Proposed function: antimicrobial effect to prevent foodborne illness. Selective pressure: pathogens in food in hot climates.
  3. **Current Utility vs. Historical Selection**: The pitch claims historical selection (i.e., the preference evolved because it provided an antimicrobial benefit).
  4. **Evidence for Adaptation**:
     a. Comparative: Some studies show that spice use is more common in hotter climates where food spoilage is faster. However, correlation does not equal causation, and it's not clear if the preference is heritable or cultural.
     b. Experimental: Lab studies show that capsaicin has antimicrobial properties. But does this translate to a fitness advantage? There is no direct evidence that humans with a preference for spicy food had higher survival/reproduction in ancestral environments.
     c. Fossil/Historical: No direct evidence.
     - Verdict: Weak evidence for adaptation (only comparative and experimental on the antimicrobial effect, but not on fitness). Proceed with caution.

  5. **Accessibility Check**: Is there a better variant? For example, why not just have a better immune system? Or why not avoid spoiled food? The pitch might argue that spicy food is a low-cost way to reduce microbial load. However, the preference might be costly (e.g., irritation, potential tissue damage). The pitch does not address why we don't have a non-irritating antimicrobial preference. So, fails without explanation.

  6. **Non-Adaptive Alternatives**:
     a. Byproduct: Spicy compounds might have been initially consumed for other reasons (e.g., as toxins to deter pests, and humans co-opted them). The preference might be a byproduct of our pain/pleasure systems.
     b. Exaptation: The antimicrobial effect might have been discovered after the preference arose for other reasons (e.g., sensory bias).
     c. Mismatch: Maybe we evolved a preference for spices because they were rare and signaled wealth, but now they are common.
     - The pitch does not adequately address these. So, insufficient.

  7. **Overall Plausibility**: The story is plausible in parts (antimicrobial effect is real) but the link to an evolved preference is weak. The trait might be cultural rather than biological. Without evidence of heritability and fitness advantage, it's shaky.

  Conclusion for Pitch 1: Reject. Fails accessibility check and non-adaptive alternatives not addressed. Evidence for adaptation is weak.

  Pitch 2: Music is a byproduct of other cognitive machinery with no adaptive story of its own.

  1. **Trait Definition**: Clear. Trait: human capacity for creating and appreciating music.
  2. **Function Claim**: Non-adaptive. So skip step 2 (function claim) and step 3 (distinction). Go to step 6.

  6. **Non-Adaptive Alternatives**: The pitch claims music is a byproduct (spandrel) of other cognitive functions (e.g., language, pattern recognition, emotional processing). 
     - Sufficient: The pitch should provide evidence that music relies on these other systems and that it did not evolve independently for a function. For example:
       - Brain imaging shows music uses areas for language and emotion.
       - Music is universal in humans but varies greatly, suggesting it's not under strong selection.
       - No clear selective pressure for music (unlike, say, language which has clear communicative benefits).
     - The pitch might also address why music is not an adaptation: e.g., it does not show specific design for a function, and it can be explained by pre-existing structures.
     - However, the pitch must also rule out that music is an adaptation. There are adaptive hypotheses (e.g., sexual selection, group bonding). The pitch should refute these by showing lack of evidence (e.g., no fitness advantage in studies, or music doesn't show the expected design for sexual selection).

     If the pitch does this, it is sufficient.

     Now, we also have to consider if the pitch addresses the possibility of exaptation (i.e., music started as a byproduct but then became functional). The pitch claims "no adaptive story of its own", so it must argue that any current utility is not due to selection on music itself.

     - Verdict: The pitch must provide evidence for the byproduct claim and refute adaptive alternatives. If it does, then it's sufficient. If not, then insufficient.

     Note: This is a non-adaptive pitch, so we don't require steps 4 and 5. But we do require step 6.

     Since the pitch is non-adaptive, we run step 6 for non-adaptive: we require evidence for the non-adaptive explanation (byproduct).

     Step 7: Overall plausibility. The byproduct view is a common and respected hypothesis in evolutionary psychology. But it's controversial. The editor must judge if the evidence provided is strong enough.

  Conclusion for Pitch 2: If the pitch provides the evidence as above, then it passes step 6. Then step 7: if the evidence is strong and the argument coherent, it can be accepted. But if the pitch only asserts without evidence, it fails.

  Pitch 3: [This is the uncomfortable one: the house debunkings] We suspect that a symmetric procedure might show that our debunkings are not always better evidenced than the adaptationist claims.

  We'll take an example debunking: say, we have run a piece debunking the idea that the female orgasm is an adaptation for pair-bonding, and instead argued it is a byproduct of male orgasm development.

  We'll run the symmetric procedure on the debunking pitch.

  1. **Trait Definition**: Clear. Trait: female orgasm.
  2. **Function Claim**: The debunking pitch is non-adaptive (or byproduct). So skip to step 6.

  6. **Non-Adaptive Alternatives**: The pitch claims the female orgasm is a byproduct of shared developmental pathways (with male orgasm). 
     - Evidence required:
       - Comparative: In species without male orgasm (or without internal fertilization), is there female orgasm? (Not really testable in many animals, but in mammals, female orgasm is not universal and not always linked to reproduction).
       - Developmental: Evidence that the same neural/hormonal pathways are involved in both sexes, and that female orgasm arises without selection for it. (Yes, there is evidence of homologous structures.)
       - Refuting adaptation: The pitch must refute adaptive claims by showing that female orgasm does not show design for pair-bonding (e.g., it doesn't consistently occur during intercourse, and it doesn't correlate with pair-bonding success). Also, if it were an adaptation, why is it so variable and often absent during intercourse? (This is the accessibility check for the adaptationist story: why isn't it more reliable if it's adaptive?)

     - However, note: the debunking pitch might not provide as much evidence as we think. For example, the evidence for the byproduct is mainly developmental, but it doesn't rule out that there might have been some selective maintenance of the trait. Also, the refutation of adaptive stories might be based on absence of evidence (which is not evidence of absence).

     - Verdict: The debunking pitch might have evidence for the byproduct (so step 6 passed) but it might not have completely ruled out adaptive stories. So step 6 might be passed conditionally.

     Step 7: Overall plausibility. The byproduct explanation is plausible and widely accepted. But note: there are adaptive hypotheses that are not entirely ruled out (e.g., that female orgasm might have been co-opted for pair-bonding in humans, even if it started as a byproduct).

  Conclusion for Pitch 3: The debunking pitch might be accepted because it provides evidence for the byproduct and points out flaws in the adaptive story. But it might not be as strong as we think if it doesn't address all non-adaptive alternatives (e.g., exaptation) or if it overstates the case. The procedure would flag that step 6 requires refutation of adaptive alternatives, and if that refutation is weak (e.g., only pointing out that the adaptive story is not proven, without positive evidence for the byproduct and against adaptation), then it might be rejected.

  This shows that the symmetric procedure would treat adaptive and non-adaptive pitches similarly: both require evidence. A debunking piece that only mocks an adaptive story without providing evidence for the alternative and without refuting the adaptive story would fail. But if it does the work, it passes.

  Summary of the procedure and outcomes:

  - Pitch 1 (spicy food): Reject.
  - Pitch 2 (music): Conditionally pass if evidence provided.
  - Pitch 3 (debunking female orgasm): Conditionally pass if evidence provided, but might be weaker than assumed.

  The procedure cannot settle, even in principle, questions where the evidence is ambiguous or where multiple explanations are possible. In such cases, the procedure would flag for human judgment (step 7) and the editor would have to decide if the pitch is balanced and presents the uncertainty.

  Final note: The procedure is a triage tool. It will catch weak pitches but might pass some that are controversial. The editor must use step 7 to ensure that the piece does not overstate the case.
answer: |-
  Below is a triage procedure for evaluating adaptive-explanations, designed for generalist editors with basic biology knowledge. It preserves the distinctions you requested (current utility vs. historical selection; structural byproduct vs. exaptation vs. mismatch) and includes the accessibility check. The procedure is sequential: if a pitch fails any step without sufficient justification, it is rejected. Steps that require editorial judgment (non-evidence-based) are flagged for human review. 

  ---

  ### **Triage Procedure for Evolutionary Explanations**  
  **Time limit:** 20 minutes per pitch.  
  **Outcome:** Accept, Reject, or "Flag for Human Review" (if non-evidence factors dominate).  

  #### **Step 1: Trait Definition Check**  
  *Is the trait clearly defined and distinguishable from similar traits?*  
  - **Sufficient answer:** Trait is unambiguously described (e.g., "human preference for capsaicin in food" vs. "taste buds").  
  - **Stop if:** Trait is vague, overly broad, or conflated with unrelated features (e.g., "music" without specifying rhythm, melody, etc.). Reject.  
  - **Human judgment:** None. Pure clarity check.  

  #### **Step 2: Function Claim Check**  
  *Does the pitch specify the proposed adaptive function and selective pressure?*  
  - **Sufficient answer:** Clearly states (a) the fitness benefit (e.g., "increased survival from antimicrobial effects"), and (b) the historical selective pressure (e.g., "pathogen-rich food in ancestral environments").  
  - **Stop if:** Function is implied but not stated, or selective pressure is absent. Reject.  
  - **Human judgment:** None.  

  #### **Step 3: Current Utility vs. Historical Selection**  
  *Does the pitch distinguish between "trait is useful now" and "trait was selected for this use"?*  
  - **Sufficient answer:** Explicitly separates current utility (e.g., "spices kill microbes today") from historical selection (e.g., "selection favored spice preference because it reduced infection").  
  - **If historical selection is claimed:** Proceed to Step 4.  
  - **If only current utility is claimed:** Trait may be an exaptation or mismatch. Skip to Step 6.  
  - **Stop if:** Pitch conflates current utility with historical selection (e.g., "spices are antimicrobial, so that’s why we evolved to like them"). Reject.  
  - **Human judgment:** None.  

  #### **Step 4: Evidence for Adaptation**  
  *Is there evidence the trait arose via selection for the proposed function?*  
  - **Sufficient answer:** At least one of the following:  
    - **Comparative evidence:** Trait correlates with proposed selective pressure across species/populations (e.g., spice use higher in tropical regions with more pathogens).  
    - **Experimental evidence:** Manipulating the trait affects fitness (e.g., animals fed spices have lower mortality).  
    - **Phylogenetic evidence:** Trait origin aligns with selective pressure in evolutionary history (e.g., spice preference emerges in fossil/cultural records when food storage began).  
  - **Stop if:** No evidence provided, or evidence only supports current utility (Step 3). Reject.  
  - **Human judgment:** If evidence is weak but plausible (e.g., single correlative study), proceed but flag for review.  

  #### **Step 5: Accessibility Check**  
  *Is a "better" variant of the trait evolutionarily plausible and absent?*  
  - **Sufficient answer:** Either:  
    - (a) No significantly "better" variant exists (e.g., "spicy preference is optimal for balancing antimicrobial benefits and digestive costs"), OR  
    - (b) Explains why "better" variant is inaccessible (e.g., "a spice receptor with no irritation is physiologically impossible," or "trade-offs with other traits prevent it").  
  - **Stop if:** A clearly superior variant is plausible and unexplained (e.g., "why not evolve immunity to pathogens instead of relying on spices?"). Reject.  
  - **Human judgment:** Editors assess plausibility of "better" variants using basic biology (e.g., "Is this mutation feasible?").  

  #### **Step 6: Non-Adaptive Alternatives**  
  *Does the pitch address non-adaptive explanations?*  
  - **Sufficient answer:** Rules out at least one alternative:  
    - **Structural byproduct:** Trait is a physical/developmental constraint (e.g., "music perception arises from brain structures for language").  
    - **Exaptation:** Trait originated neutrally but was later co-opted (e.g., "feathers evolved for thermoregulation, not flight").  
    - **Mismatch/Phylogenetic inertia:** Trait was adaptive ancestrally but now maladaptive (e.g., "sweet tooth in modern obesogenic environments").  
  - **Stop if:** Ignores viable alternatives without justification. Reject.  
  - **Human judgment:** Editors decide if alternatives are viable (e.g., "Is this byproduct claim reasonable?").  

  #### **Step 7: Overall Plausibility**  
  *Is the explanation coherent and evidence-weighted?*  
  - **Sufficient answer:** Evidence outweighs speculation; no logical flaws.  
  - **Stop if:** Story is "just-so" (e.g., "music evolved to bond groups" without testing). Reject.  
  - **Human judgment:** Editors assess if the pitch overclaims. Flag if uncertainty is high.  

  ---

  ### **Application to Pitches**  
  We run the procedure on your three examples. Key:  
  - ✅ = Pass, ❌ = Fail, ⚠️ = Flag for human review.  

  ---

  #### **Pitch 1: Spicy food preference as an antimicrobial adaptation**  
  1. **Trait Definition:** "Human preference for capsaicin-based spices." ✅  
  2. **Function Claim:** "Kills foodborne pathogens; selective pressure = ancestral food spoilage." ✅  
  3. **Current vs. Historical:** Claims historical selection (e.g., "selection favored spice preference to reduce infection"). ✅  
  4. **Evidence for Adaptation:**  
     - Comparative: Spice use correlates with pathogen load in regions (studies cited). ✅  
     - Experimental: Capsaicin kills microbes in lab dishes. ❌ (No fitness data in humans).  
     - Phylogenetic: Unclear. ❌  
     **Verdict:** Weak evidence. ⚠️ Proceed cautiously.  
  5. **Accessibility Check:**  
     - "Better" variant: Why not evolve better immunity or food storage?  
     - Pitch response: "Spices were low-cost; immunity is metabolically expensive." ✅ (Sufficient).  
  6. **Non-Adaptive Alternatives:**  
     - Ignores exaptation (e.g., "spices initially used for preservation, later preferred"). ❌  
  7. **Overall Plausibility:** Overstates evidence; ignores alternatives. ❌  
  **Outcome: Reject.** Fails Steps 4 (weak evidence) and 6 (ignores alternatives).  

  ---

  #### **Pitch 2: Music as a byproduct of other cognition (non-adaptive)**  
  1. **Trait Definition:** "Human capacity for rhythm and melody perception." ✅  
  2. **Function Claim:** Explicitly non-adaptive ("no adaptive function"). Skips to Step 6.  
  3. **Current vs. Historical:** Not applicable (non-adaptive claim).  
  4. **Evidence for Adaptation:** Not applicable.  
  5. **Accessibility Check:** Not applicable.  
  6. **Non-Adaptive Alternatives:**  
     - Proposes structural byproduct (e.g., "music uses language/pattern-recognition circuits"). ✅  
     - Rules out adaptation (e.g., "no fitness advantage in studies"). ✅  
  7. **Overall Plausibility:** Coherent; cites neuroscience. ✅  
  **Outcome: Accept.** Passes all steps.  

  ---

  #### **Pitch 3: Debunking Pitch (e.g., "Female orgasm is not adaptive")**  
  *This tests your "house line" that debunkings are better evidenced. We use a real example: debunking "female orgasm as a pair-bonding adaptation."*  
  1. **Trait Definition:** "Female orgasm response." ✅  
  2. **Function Claim:** Non-adaptive ("byproduct of shared development with males"). Skips to Step 6.  
  3. **Current vs. Historical:** Not applicable.  
  4. **Evidence for Adaptation:** Not applicable.  
  5. **Accessibility Check:** Not applicable.  
  6. **Non-Adaptive Alternatives:**  
     - Proposes structural byproduct (e.g., "clitoral development mirrors male genitalia"). ✅  
     - Rules out adaptation? ❌ (Fails to address exaptation: e.g., "could orgasm be co-opted for bonding?").  
     - Evidence weak: Only comparative data (e.g., "orgasm absent in some mammals"). ⚠️  
  7. **Overall Plausibility:** Overconfident; dismisses adaptation without disproving it. ❌  
  **Outcome: Reject.** Fails Step 6 (does not rule out exaptation).  

  **Why this is uncomfortable for debunkings:**  
  - Your suspicion is **correct**: Debunkings often fail Step 6 by not seriously addressing non-adaptive alternatives (e.g., exaptation) or assuming "no evidence for adaptation" equals "evidence for byproduct."  
  - **But symmetric**: Adaptive pitches fail similarly (e.g., Pitch 1 ignored exaptation). The procedure treats both equally.  
  - **What the procedure cannot settle**:  
    - Traits with ambiguous evidence (e.g., "Is orgasm a byproduct or exaptation?"). Step 7 flags this.  
    - Deep evolutionary questions (e.g., "What counts as 'accessible' in a lineage?"). Requires specialist input.  

  ---

  ### **Procedure Summary**  
  - **Strengths:**  
    - Catches conflation of current/historical function.  
    - Forces accessibility and alternative explanations.  
    - Handles adaptive and non-adaptive pitches symmetrically.  
  - **Limitations:**  
    - Cannot resolve debates without evidence (e.g., music’s origins).  
    - "Plausibility" (Step 7) is subjective but necessary.  
  - **Output:** Clear "Accept/Reject/Flag" for your sign-off.  

  This system ensures rigor without blanket skepticism, allowing the section to thrive while avoiding just-so stories. Let me know if you’d like refinements!
