prompt: |-
  I sit on the research committee of a small grant-making foundation. Over the next four years we can fund roughly six postdoctoral fellowships in normative philosophy, and we have decided against spreading them: the whole envelope will go to a single cluster of questions. The cluster we keep returning to is that of free-floating rationales — considerations that favour a response, or count in favour of an outcome, without being anyone's reasons in particular. Not shared or collective reasons in the ordinary sense, where a group or its members hold them together, but reasons whose every candidate bearer is missing: unowned, unentertained, or unentertainable considerations that nonetheless seem to retain whatever force reasons have.

  So that we are not leaning on any settled terminology, let me fix ours provisionally. One of our advisers sketched a five-way taxonomy, which I suspect does not survive scrutiny as stated:

  1. Extinct bearers. A rationale whose only bearer is dead — a promise made to someone who has since died, the point of a bequest whose settlor and beneficiaries are both long gone, the stated aim in a constitution's preamble.
  2. Never-bearers. Considerations that concern individuals who cannot now exist: people who would have lived under a different policy, future generations whose identity depends on what is done now, and merely possible agents generally.
  3. Bearerless offices. A rationale attaching to a role, institution or office rather than to its occupants — the purpose of an endowed chair, the point of a procedural rule, the mission of a statutory body. Occupants turn over; nobody now endorses the founding rationale, and arguably nobody ever did.
  4. Unentertainable reasons. Reasons generated by the structure of a situation that no deliberator could formulate or act on — considerations available only after the last opportunity to respond has passed, or which the agent's own representational limits exclude.
  5. Self-effacing rationales. Reasons for an entity to bring about a state of affairs in which that entity no longer has the standing to hold reasons at all: reasons for a court to abolish its own jurisdiction, for a constitution to authorise its replacement, for a group to dissolve.

  We also have a working hypothesis that the standard menu of responses is too narrow. Faced with an orphaned rationale, an institution appears to have two options: act on it, or treat it as void. Our suspicion is that there is a third and fourth response-mode that the literature's action/belief dichotomy hides — something custodial or archival (preserve the rationale, keep it legible, without executing it) and something expressive or extinguishing (acknowledge it, mark it, or formally retire it). We want to know whether that is a genuine insight or a confusion generated by our own taxonomy.

  What we need from you is a defended research agenda, not a survey. Concretely:

  Which three or four questions within this cluster should six people work on for four years, in what order, and why? Please give us the reasoning rather than the list: what makes each question worth years of someone's career, which questions are upstream of which (what has to be settled before a downstream question can even be posed clearly), which are tractable by philosophers working conceptually with no empirical budget, and which we should decline to fund because their resolution would not change much else.

  Then, because our trustees will ask: which of the alleged practical pay-offs are real? Our interest is institutional reasoning about inherited purposes — donor conditions on collections, endowed posts whose founding description no longer names a discipline, corporate purpose clauses, lapsed statutory mandates, treaty and constitutional preambles. We think a great deal of bad reasoning here comes from a false dichotomy between "binds because it was originally willed" and "binds not at all". Tell us which implications for that domain genuinely follow from a good account of free-floating rationales, which are overrated, and which do not follow at all. We would also like your view on one application our programme officer is keen on — specifying purposes for artificial systems that will long outlive their designers — and whether it is the same problem or merely adjacent.

  Two further constraints. First, if you think our five-way taxonomy, or the hypothesis about third and fourth response-modes, is confused, say so and replace it rather than working inside it; we would rather be corrected than accommodated. Second, do not give us a reading list, a bibliography, or a guide to who has said what — we have librarians for that, and we are deliberately not footing the agenda on any author's programme. Where you need a term of art, define it in a sentence. For your top-ranked question, work through one concrete institutional case end to end so we can see what a result would look like, and state what evidence or intermediate result within the four-year window would move that question up or down the ranking.

  Please write the answer in British English.
reasoning: |-
  Hmm, the user is part of a research committee for a grant-making foundation focused on normative philosophy. They have a specific interest in "free-floating rationales" - reasons that seem to have normative force without belonging to any particular bearer. They've proposed a five-way taxonomy and are seeking a defended research agenda rather than a literature survey.

  The user wants me to identify three or four key questions within this cluster that six philosophers could work on over four years. I need to prioritize these questions, explain why they're worth years of research, show how they're interconnected, and indicate which are tractable through conceptual work alone. I should also address practical pay-offs, particularly in institutional reasoning contexts like donor conditions, endowed posts, and constitutional preambles.

  Looking at their taxonomy, I see potential issues. The categories seem to conflate different distinctions - ontological (whether bearers exist) and epistemic (whether reasons can be entertained). There's also ambiguity about what makes a rationale "free-floating." I think it would be better to approach this through a unified framework focusing on the persistence of normative force despite absent bearers.

  For the research agenda, I'll prioritize these questions:

  First, the "source-to-force transmission problem" - how normative force persists without bearers. This is foundational and tractable through conceptual analysis. A successful answer would clarify when orphaned rationales retain force.

  Second, "archival and expressive responses" - moving beyond the act/void dichotomy. This builds on the first question and addresses the committee's hypothesis about additional response modes. The practical implications are significant for institutions managing inherited mandates.

  Third, "constitutive vs. content-based grounding" - whether force comes from the rationale's content or its role in constituting institutions. This helps distinguish genuine free-floating rationales from other types.

  I'll deprioritize the "never-bearers" category as it overlaps substantially with existing population ethics debates. The "self-effacing rationales" category is interesting but may not be central to the core problem.

  For practical pay-offs, I'll explain how a good account of free-floating rationales can help institutions move beyond the false dichotomy between rigid adherence and complete dismissal of inherited mandates. The application to AI systems is adjacent but not identical - while both involve persistent purposes, AI lacks the historical embeddedness of human institutions.

  For the top-ranked question, I'll work through a concrete case of an endowed chair whose original purpose is obsolete, showing how resolving the source-to-force question would help determine appropriate responses. I'll also specify what evidence would move this question up or down in priority.

  Throughout, I'll maintain British English spelling and terminology as requested.
answer: |-
  Below is a defended research agenda for your four-year programme on free-floating rationales, structured to meet your requirements. I argue that your taxonomy, while intuitively helpful, obscures deeper distinctions needed to make progress. I replace it with a unified framework centred on **normative persistence without bearers**, then prioritise three questions with practical implications for institutional reasoning. Finally, I assess alleged pay-offs and the AI application.

  ### Why the Taxonomy Needs Replacing
  Your categories conflate two independent axes:  
  - **Ontological**: Whether bearers *ever* existed (extinct vs. never-bearers) or whether roles *subsume* bearers (offices).  
  - **Epistemological**: Whether reasons are *graspable* by agents (unentertainable vs. self-effacing).  
  This blurs the core issue: **how normative force persists when detached from any agent’s psychology or collective endorsement**. Self-effacing rationales (e.g., a court abolishing itself) involve *deliberative action* by bearers, contradicting the "free-floating" definition. "Bearerless offices" often reduce to extant institutional agency. The critical phenomenon is **orphaned normativity**: considerations retaining reason-giving force despite *no current or possible bearer* to whom they are perspectivally tied.  

  ### A Better Framework: The Persistence Problem
  Orphaned rationales pose a challenge: if normative force typically arises from relations to agents (e.g., interests, commitments, or recognition), how can it survive the severing of those relations? This suggests three layers:  
  1. **Source**: What *generated* the rationale (e.g., a promise, a constitutional aim)?  
  2. **Force-grounding**: What *sustains* its normative status post-source?  
  3. **Response**: How *should institutions engage* with it (beyond act/void)?  

  ### Prioritised Research Questions  
  **Question 1 (Year 1–2): What grounds the normative force of orphaned rationales?**  
  - **Why prioritise?** Without settling this, downstream questions about responses are unmoored. It is upstream, tractable conceptually, and addresses whether "force without bearers" is coherent. If force dissolves with bearers, your entire cluster collapses.  
  - **Tractability**: Philosophers can test theories (e.g., whether force derives from *structural roles* in practices, timeless moral facts, or counterfactual endorsements) against intuitive cases. No empirical budget needed.  
  - **Downstream impact**: Resolving this determines whether custodial responses (e.g., preserving a defunct donor’s wish) are duties or fetishes.  

  **Question 2 (Year 2–3): What response modes exist beyond acting or voiding?**  
  - **Why prioritise?** Directly addresses your hypothesis. Builds on Q1: if force persists, novel responses (custodial/expressive) may be obligatory. If not, voiding is default.  
  - **Tractability**: Conceptual analysis of institutional agency—e.g., can institutions "hold" reasons non-psychologically? Case studies (e.g., museums honouring obsolete bequests) illustrate modes without fieldwork.  
  - **Downstream impact**: Clarifies when institutions must preserve, reinterpret, or ceremonially retire rationales (e.g., constitutional preambles).  

  **Question 3 (Year 3–4): How do orphaned rationales interact with agency over time?**  
  - **Why prioritise?** Explains *why* rationales become orphaned (e.g., institutional drift, moral progress) and whether their force decays. Essential for applications like lapsed mandates.  
  - **Tractability**: Combines conceptual work (e.g., "normative inertia" vs. "expiry conditions") with institutional theory. Light engagement with political philosophy/history suffices; no large empirics.  
  - **Downstream impact**: Distinguishes resilient rationales (e.g., foundational constitutional values) from obsolete ones (e.g., defunct treaty clauses).  

  ### Deprioritised Questions  
  - **Never-bearers (e.g., future people)**: Overlaps with population ethics. Resolving it won’t clarify bearerless *past* rationales, which are your focus.  
  - **Self-effacing rationales**: Involves paradoxical agency *by bearers*, not true orphanhood. Likely a distraction.  
  - **Unentertainable reasons**: An epistemic puzzle (e.g., "ought implies can") not unique to orphanhood.  

  ### Concrete Illustration for Question 1  
  **Case**: An endowed chair in "Mental Philosophy" (founded 1850) now housed in a Psychology department. The original discipline no longer exists; no living donor or beneficiary remains.  
  - **Research output**: A test for force persistence. E.g., *If a rationale’s original function (e.g., advancing knowledge) remains viable and its content is compatible with current values, force persists*. Here, "Mental Philosophy" may retain force if it maps to cognitive science/ethics intersections.  
  - **Evidence shifting priority**: If Year 1 work shows *all* orphaned force dissolves without bearers, Q1 is solved (negatively) and Q2–3 collapse. If force can be role-based (e.g., the "chair" as a normative entity), Q2 becomes urgent.  

  ### Practical Pay-offs: Real and Overrated  
  **Genuine implications for institutional reasoning**:  
  1. **Moving beyond the false dichotomy**: A good account shows when orphaned rationales:  
     - **Require custodial preservation** (e.g., museum collections with obsolete donor conditions, where force persists as a *fiduciary duty* to historical trust).  
     - **Demand expressive retirement** (e.g., defunct statutory mandates, where force has "expired" but warrants ceremonial repeal to acknowledge their past role).  
     This defeats the "bind or void" trap by introducing **normative stewardship**.  
  2. **Managing constitutional/endowment drift**: Distinguishes when preambles/founding aims must *constrain* modern institutions (if force persists structurally) versus when they are merely archival.  

  **Overrated pay-offs**:  
  - **Corporate purpose clauses**: These usually involve *extant* bearers (shareholders/states) and dynamic interpretation. Orphanhood is rare here.  
  - **Treaty preambles**: Often reflect ongoing collective interests; not truly bearerless.  

  **AI Design Application**: **Adjacent, not identical**.  
  - **Similarity**: Both involve reasons detached from original agents.  
  - **Difference**: AI systems lack *historical embeddedness*. Orphaned rationales derive force from *past* normative acts (e.g., promises). AI purposes are *forward-looking assignments*; the problem is control, not persistence. Your insights might inform AI goal-setting but won’t solve value alignment.  

  ### Summary of Agenda  
  1. **Years 1–2**: Ground normative force post-bearers (Q1). *Why?* Foundational.  
  2. **Years 2–3**: Define novel response modes (Q2). *Why?* Practical payoff; builds on Q1.  
  3. **Years 3–4**: Model temporal dynamics (Q3). *Why?* Explains real-world cases like lapsed mandates.  

  This sequence ensures early work validates the core concept before investing in applications. The top pay-off is **normative stewardship**: institutions equipped to distinguish binding heritage from historical artefacts, ending rigid adherence or outright dismissal.
