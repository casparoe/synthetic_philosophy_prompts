prompt: |-
  I'm in a reading group — two philosophers, one econ theorist, and an ML person — that's spent about a year going in circles on revealed preference: does "utility" as it's used there mean anything more than a compressed description of choice behavior, or is it supposed to be doing real work, like telling you whether a policy made someone better off or what their well-being actually is? Nobody has moved an inch. My own hypothesis is that it isn't a verbal fight about the word "preference" and it isn't really about psychologism either: the two sides want the formalism to do different jobs (one wants a representation for prediction, the other wants a currency for evaluation), and each keeps scoring points with examples that only look decisive given their own job description.

  But the ML person threw in something I think might be doing more work than my diagnosis: in the settings we actually care about now you often dont get repeated choice from a whole family of budgets, you get one more or less fixed policy, one action per situation — and then the utility function isn't even pinned down, since a reward that's zero everywhere (and continuum-many others) rationalizes whatever the agent did. So maybe the argument feels stuck because both sides are quietly assuming identification is fine and arguing about what to call the thing once you've got it.

  Is that right — is a hidden underdetermination question the load bearing issue here, or is that a red herring and the real disagreement is about whether utility has to be a causal, psychologically real state? And given whichever diagnosis you give, what would actually count as progress — a theorem, a distinction, a different question, or nothing at all? I want the diagnosis with reasons, not a tour of the positions.
reasoning: |-
  Okay, the user is in a reading group with philosophers, an econ theorist, and an ML person. They've been stuck for a year debating revealed preference and utility. The user thinks the core issue isn't about semantics or psychologism but about different goals: one side wants prediction, the other wants evaluation. The ML person brought up a new point: in many modern settings, there's only one action per situation, so utility isn't pinned down, leading to underdetermination. The user wants to know if this underdetermination is the real problem or if it's still about whether utility is a psychological state. They also ask what would count as progress.

  First, I need to unpack the ML person's point. In traditional revealed preference theory, observing choices over multiple budgets allows identifying a utility function that rationalizes those choices. But in single-instance scenarios, like one action per state, infinitely many utility functions can explain the same choice. The ML person is highlighting that identification is impossible here, which undermines both sides of the debate. If utility isn't identifiable, then arguing about its nature—whether it's descriptive or real—becomes moot. 

  The user's original hypothesis was about differing objectives: prediction vs. evaluation. The ML's point adds that without sufficient data, utility can't even serve as a descriptor. This underdetermination problem shifts the debate. The philosophers might not have considered that their arguments assume utility is identifiable. When they discuss whether utility represents well-being, they're assuming it's unique. But if many utilities fit the same choice, which one represents true well-being? That's a problem.

  The deeper issue here is the conflation of revealed preference with welfare. The econ side might use utility for welfare analysis, but if it's underdetermined, welfare claims lack foundation. For example, if a policy change happens, but utility isn't unique, can we say welfare improved? Probably not. So underdetermination blocks the evaluation side's goal entirely. For prediction, if you can't identify the utility function, you can't predict future choices either. But ML often uses reward functions as objectives to train agents, even if not unique. So prediction might still work by learning a policy directly, bypassing utility.

  The user asks if the real disagreement is about utility being a psychological state. Underdetermination makes this irrelevant because without identification, the question of its reality can't be addressed. You can't argue if it's real if you can't even specify what "it" is. So the ML person's point exposes that both sides need identifiability first. 

  What counts as progress? A theorem showing necessary conditions for identifiability in different settings would help. For example, what data is needed to pin down utility? Also, clarifying distinctions: separating choice functions, welfare criteria, and predictive models. Introducing frameworks like inverse reinforcement learning where multiple rewards explain behavior but the focus is on policy learning. Or shifting the question: instead of asking what utility is, ask what we need it for and what data we have. If for evaluation, maybe we need normative axioms; if for prediction, focus on policy learning.

  The user's group might need to recognize that without sufficient data, utility as welfare is untenable. For evaluation, they might need non-choice data (e.g., surveys) or accept that welfare judgments require more assumptions. The ML perspective shows that in data-poor environments, revealed preference fails, forcing a rethink of both sides' assumptions. Progress would involve mapping out when utility can be identified and admitting when it can't, leading to alternative approaches depending on the goal.
answer: |-
  Your ML colleague nailed it: **the underdetermination problem is the load-bearing issue here, not psychologism or semantics.** Both sides are arguing past each other because they implicitly assume identifiability — but in sparse-data settings (common in modern ML/econ), utility *isn't* identifiable, undermining *both* their projects. Here's the diagnosis with reasons and a path forward:

  ### Why Underdetermination is Central
  1. **The ML Critique Exposes a Foundational Crack**:
     - In classical revealed preference (e.g., Afriat's theorem), repeated choices across varied budgets let you recover a *unique* utility (up to monotonic transforms). But with a single choice per state (or sparse data), **infinitely many utility functions rationalize the same behavior**. This isn't a philosophical nuance — it's mathematical reality.
     - If utility isn't identifiable, it can't serve as a "compressed description" (it's not unique) *or* as a "currency for evaluation" (which one do you use?). Both sides lose their object of debate.

  2. **How This Sabotages Both Camps**:
     - **Prediction-First Side**: They want a utility that summarizes behavior for forecasting. But if multiple utilities fit the same data, *which one predicts future choices?* Without new data or assumptions, none is privileged. Utility loses its predictive role.
     - **Evaluation-First Side**: They want utility to measure welfare. But if many utilities rationalize the choice, which corresponds to "true well-being"? Policy advice becomes arbitrary (e.g., a utility that spikes at the chosen action supports any policy).

  3. **Why Your Original Hypothesis Was Half-Right**:
     - You correctly noted the two jobs (prediction vs. evaluation), but underdetermination shows **neither job can be done** without identifiability. The ML person forced the question: *Can we even get a utility function to argue about?* In sparse settings, often we can't.

  ### Why Psychologism is a Red Herring Here
  - The "is utility real?" debate collapses when utility isn't unique. If infinitely many functions explain behavior, asking which is "psychologically real" is incoherent without additional constraints (e.g., neuroscience, stated preferences). Revealed preference alone *cannot* resolve this — it was never designed to.

  ### What Counts as Progress: A Pragmatic Path
  For your group to move forward, **shift focus from "what utility is" to "what we need it for, given our data."** Concrete steps:

  1. **A Theorem on Identifiability** (Crucial for Common Ground):  
     Formalize the minimal data requirements to pin down utility for each purpose. For example:  
     - *Prediction*: Show that utility is identifiable **iff** choices are observed under sufficient "counterfactual variation" (e.g., different budgets, perturbed states). If not, abandon utility and directly learn policies/reward functions.  
     - *Evaluation*: Prove that **no** choice data alone can identify welfare-relevant utility without normative assumptions (e.g., Pareto conditions, fairness constraints).  

  2. **A Distinction Between Tools** (Precision Avoids Talking Past):  
     | **Goal**         | **Requires**                          | **Viable in Sparse Data?** |  
     |------------------|---------------------------------------|----------------------------|  
     | **Prediction**   | Behavioral generalization             | Only via policy learning (no utility) |  
     | **Welfare**      | Interpersonal comparisons, ethics     | Only with non-choice data (e.g., surveys) or axioms |  
     *Accept that revealed preference is insufficient for welfare in sparse settings. Period.*

  3. **A New Question for Modern Contexts**:  
     - "Given we observe only one action per state, what *can* we infer about welfare? (Hint: not much without adding structure.)"  
     - "If utility is underdetermined, should we replace it with robust alternatives? (e.g., for policy: regret minimization; for welfare: capability approaches)"  

  ### Why This Resolves the Stalemate
  - The ML person forced a **crisis of underdetermination** that reveals both sides' assumptions are false in many real settings.  
  - Progress comes from admitting:  
    - Without identifiability, utility is a **useless construct** for either prediction or evaluation.  
    - **Prediction** must drop utility and embrace model-free RL or causal inference.  
    - **Evaluation** must drop choice data as sufficient and embrace interdisciplinary inputs (psychology, ethics).  

  Your group is stuck because both sides are trying to use a screwdriver (revealed preference) for jobs that need a wrench (prediction) or a thermometer (welfare). The ML person pointed out the screwdriver is also broken. Fix the tool, or change the tool — but stop arguing about what screws *are*.
