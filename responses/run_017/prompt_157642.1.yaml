   4. Setting Epsilon: How to set the stopping tolerance without bias?
   5. Epistemic Modesty: How to handle widespread misconceptions without external facts?
   6. Aggregation: How to aggregate persistent disagreement?
   7. Gap (Approximation): How to approximate the ensemble without a normative standard for the loss?
   8. Gap (Dynamic World): How to handle a changing world and novel moral questions?
   9. Self-Effacement: Would the verdict preserve humanity and the process?
  10. Side Constraints: If we need a side constraint to prevent self-effacement, doesn't that break the indirect normativity?
  11. Empirical Disconfirmation: What result would make you abandon the ensemble?
  12. Final Reflection: If this approach doesn't work, what's your fallback?

   Now, let's write them out with follow-ups for the most likely answers.

   Note: We are to write the follow-up for the answer she's most likely to give, not the one she'd prefer.

   We'll write the questions in order:

   1. **Motivation**: "You've proposed an ensemble of simulated humans with unlimited time and memory, but without factual corrections unless asked. Why is this epistemically modest idealization better than alternatives like CEV or an ideal agent?"
       - Likely answer: It avoids the hubris of assuming we can define a single ideal agent or that one person's values can be extrapolated.
       - Follow-up: "But doesn't leaving in factual errors risk entrenching current mistakes? How can we trust the outcome if it's based on false beliefs?"

   2. **Initial Seed**: "How do you select the initial humans for the ensemble? Random sampling? And what safeguards are there against the ensemble becoming unrepresentative due to the simulation setup?"
       - Likely answer: We take a representative sample of humanity, and the simulation allows them to deliberate without distortion.
       - Follow-up: "But if we start with a random sample, we might include extremists or people with very unusual views. How do we avoid having the verdict hijacked by outliers? And if we exclude them, aren't we imposing our own standard of who counts?"

   3. **Path-dependence**: "If we run the same initial ensemble multiple times with different random seeds (affecting order of discussion, etc.), would we get the same epsilon-stable verdict? Or could there be multiple fixed points?"
