       - Follow-up: "But what if the problem is path-dependent? If we get different verdicts, how do we choose? And if we don't, how do we set the stopping tolerance (epsilon) without making a normative judgment about how stable is stable enough?"

   4. **Setting Epsilon**: "The stopping tolerance epsilon seems arbitrary. How do we set it without importing our own normative biases? And what if the verdict keeps oscillating within a range that's wider than we'd like?"
       - Likely answer: We can set epsilon based on practical considerations, and the ensemble will eventually stabilize.
       - Follow-up: "But if the verdict oscillates, that suggests there's no stable equilibrium. Then what? And if we set epsilon based on what we think is acceptable, doesn't that make our judgment part of the normativity?"

   5. **Epistemic Modesty**: "How does the ensemble correct for widespread misconceptions without external fact checks? For example, if the ensemble is drawn from a time when everyone believed the sun revolved around the earth, wouldn't that distort their verdicts on many issues?"
       - Likely answer: The ensemble can ask for facts, and over time they will seek out the truth.
       - Follow-up: "But if they don't know what they don't know, they might never ask the right questions. And if we have to provide an oracle, who controls it? Doesn't that make the oracle's keeper the real source of normativity?"

   6. **Aggregation**: "Even after the ensemble stops changing by more than epsilon, there might still be disagreement. How do you aggregate the views? And doesn't the aggregation rule become the real source of normativity?"
       - Likely answer: The ensemble itself can design the aggregation rule during deliberation.
       - Follow-up: "But if they can't agree on an aggregation rule, then what? And if they do, how do we know that rule is fair? Doesn't that just push the problem back?"

   7. **Approximation Gap (Loss Function)**: "We can't run the ideal ensemble, so we must approximate it. How do we train an AI to mimic the ensemble without having a normative standard for the training loss? Doesn't that require already knowing the verdicts?"
       - Likely answer: We can use machine learning to predict what the ensemble would say, and we can start with limited cases and iterate.
       - Follow-up: "But if the approximation makes errors, how do we know they are acceptable? And if we use human feedback to correct it, aren't we back to our current values?"

   8. **Dynamic World and Novel Dilemmas**: "The world changes, and new ethical dilemmas arise that the ensemble never considered. How do we apply the verdict to these new situations? And if the AI's actions change the world in ways that alter the context, how do we avoid the verdict becoming outdated?"
       - Likely answer: The ensemble's verdict would include principles that can be extended to new cases.
       - Follow-up: "But what if the new case is fundamentally different? And if the AI changes the world so that the initial conditions for the ensemble are no longer relevant, do we rerun the ensemble? How often?"

   9. **Self-Effacement**: "Would the ensemble's verdict necessarily value preserving humanity and the process that created it? Or might it recommend replacing us with something else?"
       - Likely answer: The ensemble, being composed of humans, would value humanity's continuity.
       - Follow-up: "But what if they conclude that a post-human future is better? And if we don't like that, do we override the verdict? Doesn't that break the system?"

  10. **Side Constraints**: "If we must add a side constraint to prevent self-destruction, doesn't that mean the ensemble process isn't the sole source of normativity? And if we have to add constraints, how do we choose them without circularity?"
