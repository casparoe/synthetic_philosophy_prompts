   We have to design 10-12 questions. We'll structure them in the order above, but each main topic will have a primary question and at least one follow-up.

   Let's create:

   1. Initial Setup and Motivation:
      Q1: You've described an ensemble of simulated humans consulting each other with unlimited time and memory, but without factual corrections unless asked. Why is this epistemically modest idealization the right starting point for normativity? What's wrong with the alternatives (like CEV or an ideal agent)?

      Follow-up (if she says something about avoiding overconfidence or preserving human fallibility): But if we're trying to get to the "right" normative verdict, isn't there a risk that by leaving in errors we're just codifying our current mistakes? How does that serve the goal of normativity?

   2. Path-dependence and Multiple Fixed Points:
      Q2: Let's say we run this ensemble multiple times with the same initial seed of humans but different random seeds (or different orders of subquestions). Do you expect the same epsilon-stable verdict? If not, what does that say about the objectivity of the result?

      Follow-up (if she says that it converges to the same point): What evidence do you have that the process is robust to these variations? And if it isn't, doesn't that make the stopping tolerance (epsilon) a critical parameter? How do we set epsilon without importing our own normative biases?

   3. Coherence of Epistemically Modest Idealization:
      Q3: You deliberately avoid giving the simulated humans factual corrections they didn't ask for. But what if the ensemble is seeded with people who have significant misconceptions (e.g., about basic science, history, or other cultures)? Won't that lead to a verdict that's parochial? And if we filter the seeds to only those with "reasonable" beliefs, haven't we smuggled in an external standard?

      Follow-up (if she says that the process of deliberation will correct some misconceptions): But without any external input of facts, how do they correct misconceptions that are widely shared? And if we do allow them to ask for facts, who decides what facts are true? Doesn't that require an external oracle?

   4. Aggregation Rule for Persistent Disagreement:
      Q4: Even after running until the verdict moves by less than epsilon, there might still be disagreement in the ensemble. How do you aggregate their views? Majority vote? Supermajority? Unanimity? Weighted by some measure? And doesn't the choice of aggregation rule become the de facto source of normativity?

      Follow-up (if she says that the process includes rules for aggregation that emerge from the deliberation): But if the aggregation rule is decided by the ensemble itself, doesn't that just push the problem back one level? How do we know they'd agree on an aggregation rule? And if they don't, then what?

   5. Gap between Idealization and Real-World Implementation:
      Q5: We can't actually run an ensemble of simulated humans with unlimited time. We'd have to approximate. How do we design that approximation without distorting the outcome? And since the AI's actions will change the world, which in turn changes the context in which the approximation is used, how do we avoid a feedback loop that invalidates the original verdict?

      Follow-up (if she says we can use machine learning to approximate the ensemble): But training such a model requires a loss function. How do we define the loss without already having a normative standard? And if the approximation is imperfect, how do we know it's good enough?

   6. Self-Effacement:
      Q6: Suppose we get an epsilon-stable verdict from the ensemble. Does that verdict have any reason to preserve the humans who created it, or the process that generated it? Or might it recommend replacing us with something else? If the latter, do we need to add a side constraint to prevent that, and doesn't that break the indirect normativity?

      Follow-up (if she says the ensemble would choose to preserve humanity): How can you be sure? And if not, and we add a constraint, does that mean the ensemble process isn't the ultimate authority?

   7. Closing Question:
      Q7: What result, either from armchair philosophy or empirical research, would make you abandon this ensemble framing entirely?

