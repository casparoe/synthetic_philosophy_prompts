  The core issue in philosophy is the problem of justifying induction. Why prefer green over grue? In ML, we handle this through inductive bias: choosing a hypothesis class that favors simpler models. Grue is disfavored because it's more complex—it requires specifying a time cutoff. But Goodman argues that simplicity is language-relative. In ML terms, the choice of feature representation matters. If time is a valid feature, seasonality could make grue-like concepts useful. But without domain knowledge, we prefer features not tied to arbitrary indices.

