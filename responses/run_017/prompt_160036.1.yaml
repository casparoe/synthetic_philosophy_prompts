answer: |-
  ### Constructing the Case: Sliding Switch Lamp

  **Setup:**  
  The slider's position \(x(t)\) at time \(t \in [0,1]\) is given by:  
  \[
  x(t) = 
  \begin{cases} 
  (1 - t)^4 \sin\left(\frac{\pi}{1 - t}\right) & \text{if } t < 1, \\
  0 & \text{if } t = 1.
  \end{cases}
  \]  
  - **Lamp state:**  
    - Lit if \(x(t) \geq 0\) (slider right of or at midpoint \(x = 0\)).  
    - Dark if \(x(t) < 0\) (slider left of midpoint).  
  - **Key properties:**  
    - **Infinitely many crossings:** \(x(t)\) crosses \(x = 0\) infinitely often as \(t \to 1^-\). Specifically, at \(t_n = 1 - \frac{1}{n}\) for integers \(n \geq 1\).  
    - **Convergence to midpoint:** \(\lim_{t \to 1^-} x(t) = 0\), and \(x(1) = 0\).  
    - **Bounded speed and acceleration:**  
      - Speed: \(|x'(t)| \leq 4(1 - t)^3 + (1 - t)^2 \leq 5\) for \(t < 1\) (and \(x'(1) = 0\)).  
      - Acceleration: \(|x''(t)|\) is bounded (calculation shows \(\leq 30\) for \(t \in [0,1]\)).  
    - **Physical realizability:** Finite mass with bounded acceleration implies bounded force (\(F = ma\)), fitting on a table.  
  - **After \(t = 1\):**  
    Slider remains at \(x = 0\) (lamp stays lit) with no motion or work done.  

  ---

  ### Verdicts on the Case  

  1. **Blocking Benacerraf’s "description with a hole" reply:**  
     - **Hardware rule:** Lamp is lit *whenever* \(x \geq 0\), including at \(x = 0\).  
     - **Limit behavior:** \(x(t) \to 0\) as \(t \to 1^-\), and \(x(1) = 0\).  
     - **Result:** Lamp state at \(t = 1\) is **lit**, deduced from \(x(1) = 0\) and the hardware rule.  
     - **Why blocked:** No stipulation—state follows from continuity of \(x(t)\) and the fixed hardware rule. Benacerraf’s "hole" is filled by physics, not philosophy.  

  2. **Thomson’s reasoning fails (despite seeming applicable):**  
     - **Thomson’s argument:**  
       - Every "on" event is followed by an "off" and vice versa.  
       - No last switch → lamp can’t be on or off at \(t = 1\).  
     - **Apparent applicability:** Infinitely many switches, no last event.  
     - **Why it fails:**  
       - Thomson assumes the lamp state at \(t = 1\) must be determined *solely* by the sequence of prior states.  
       - **Reality:** State is determined by the *current position* \(x(1) = 0\), not the history of switches.  
       - **Outcome:** Lamp is **lit** at \(t = 1\), contradicting Thomson’s conclusion.  

  3. **Continuity reasoning succeeds, exposing Thomson’s premise:**  
     - **Continuity argument:**  
       - Position \(x(t)\) is continuous and converges to \(0\).  
       - Lamp state is a function of \(x\): \(\text{state}(x) = \begin{cases} \text{lit} & x \geq 0 \\ \text{dark} & x < 0 \end{cases}\).  
       - At \(x(1) = 0\), \(\text{state}(0) = \text{lit}\).  
     - **Thomson’s hidden denial:**  
       - Thomson denies that \(\text{state}(t)\) can be determined by a *continuous underlying variable* (\(x(t)\)) at the limit.  
       - He implicitly assumes the lamp state at \(t = 1\) must be the limit of the *discrete state sequence*, which doesn’t converge.  
     - **Why continuity wins:** Physical states (position) evolve continuously; discrete labels (on/off) inherit limits via hardware.  

  ---

  ### Load-Bearing Features and Variations  

  **Load-bearing feature:**  
  The **discontinuous read-out rule** at \(x = 0\) (lamp lit iff \(x \geq 0\)). This allows:  
  - Infinite switches near \(t = 1\) (since \(x(t)\) crosses \(0\) infinitely often).  
  - State at \(t = 1\) to be determined by \(x(1) = 0\) despite oscillatory history.  

  **Variations and outcomes:**  
  1. **Swap sliding switch for dimmer (continuous brightness):**  
     - Let brightness \(b(t) = \frac{1}{2} + \frac{1}{2} \tanh(x(t))\) (continuous in \(x\), smooth transition at \(0\)).  
     - **Result:** \(b(t) \to 0.5\) as \(t \to 1^-\), and \(b(1) = 0.5\).  
     - **Effect:** Thomson’s argument doesn’t start—no discrete "switches" to count. Continuity reasoning prevails trivially.  

  2. **Position diverges instead of converges:**  
     - Example: \(x(t) = \sin\left(\frac{1}{1 - t}\right)\) for \(t < 1\), undefined at \(t = 1\).  
     - **Result:** No limit position → lamp state undefined at \(t = 1\).  
     - **Effect:** Benacerraf’s "hole" applies. Thomson’s argument "succeeds" vacuously (no defined state).  

  3. **Fatten the "both-contacts" region to a band:**  
     - Lamp lit if \(x \geq -\epsilon\) (for \(\epsilon > 0\)), dark if \(x < -\epsilon\).  
     - **Result:** For small \(\epsilon\), \(x(t)\) eventually stays within \([-\epsilon, \epsilon]\) as \(t \to 1^-\) (since \(x(t) \to 0\)).  
     - **Effect:** Only finitely many switches (lamp stops toggling once \(|x(t)| < \epsilon\)). Thomson’s premise (infinite switches) fails.  

  **Strongest objection (Thomson defender):**  
  - **"Fattened band" attack:**  
    - Real switches have physical width; a true "point" at \(x = 0\) is idealized.  
    - With a band (however narrow), switches stop finitely before \(t = 1\), invalidating the supertask.  
    - **Rebuttal:** Idealization is valid mathematically and physically (nanoscale switches can approximate a point). The thought experiment’s coherence relies on the discontinuity at \(x = 0\).  

  ---

  ### The Real Moral  
  **Thomson’s error:** He conflates the *read-out of state* with the *underlying physical process*. By focusing on the discrete history of lamp states, he ignores that:  
  1. Physical quantities (position) evolve continuously and determine states at limits.  
  2. Discontinuous read-outs (e.g., on/off at a point) are resolved by hardware rules, not infinite sequences.  

  **Conclusion:** Supertasks are unproblematic when states are read from continuous variables. Thomson’s lamp fails because it mistakes the map (discrete labels) for the territory (continuous physics).
