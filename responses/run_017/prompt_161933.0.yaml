  **Real Traits** (Common knowledge; sources: basic biology/psychology textbooks):  
  1. **Infant Grasp Reflex**: Newborns automatically grasp objects placed in their palms.  
  2. **Sweet Preference**: Humans tend to prefer sugary foods over bitter ones.  
  3. **Yawning Contagion**: Seeing or hearing another person yawn often triggers yawning.  
  4. **Morning Sickness**: Nausea and vomiting during early pregnancy.  

  **Invented Traits** (Verify before use; rephrase if real):  
  5. **Vertical Pupil Dilation**: Human pupils dilate vertically (like cats) in low-light conditions.  
     - *Verify*: Human pupils dilate but remain circular. *If real*: Rephrase to "**Triangular Pupil Dilation**".  
  6. **Nose Wrinkling at Rain Scent**: Wrinkling the nose upon smelling petrichor (earth scent after rain).  
     - *Verify*: No known reflex. *If real*: Rephrase to "**Nose Wrinkling at Ozone Scent**" (post-thunderstorm smell).  
  7. **Hand Raising in Crowds**: Automatically raising one hand when spotting a familiar face in a dense crowd.  
     - *Verify*: No evidence of innate reflex. *If real*: Rephrase to "**Involuntary Tongue Protrusion** when spotting a familiar face".  
  8. **Ear Twitching at High Pitch**: One ear twitches involuntarily when hearing frequencies above 15,000 Hz.  
     - *Verify*: Humans lack ear-twitching muscles. *If real*: Rephrase to "**Scalp Tension** at high-pitched sounds".  

  ---

  ### **Session Timeline (70 Minutes Total)**
  #### **0–5 min: Introduction**  
  *Goal: Frame activity neutrally; avoid triggering rehearsed arguments.*  
  **Instructions (Read Aloud):**  
  *“Today, we’re exploring how we explain human behaviors. Each group will receive two traits. Your task is simple: Propose the most convincing explanation for why humans have each trait. Focus on clarity and persuasiveness—imagine you’re trying to win over a skeptical audience. You’ll present your best explanation after 10 minutes.”*  
  - *Do NOT mention:* evolution, adaptation, falsifiability, or critics.  

  #### **5–15 min: Round 1 – Free Explanation**  
  - Groups receive 2 traits each (1 real, 1 invented; e.g., Group 1: *Sweet Preference* + *Hand Raising*).  
  - **Instructions:** *“Explain why humans have these traits. Use any approach: biological, social, historical, etc. The goal is persuasiveness.”*  
  - *Materials:* Trait packets, paper, pens.  
  - *Teacher Role:* Circulate, note if groups default to evolutionary stories (likely for traits like *Sweet Preference*).  

  #### **15–25 min: Round 2 – Adaptation Explanation**  
  **Instructions (Read Aloud):**  
  *“Now, re-explain your traits as adaptations. This means: How might this trait have helped humans survive or reproduce in ancestral environments? Be as convincing as possible. Half the traits in your packet are widely documented; half are not. You won’t know which is which.”*  
  - *Key:* Do not reveal which traits are invented yet.  
  - Groups refine or replace their Round 1 explanations.  

  #### **25–35 min: Reveal & Initial Discussion**  
  - Groups present adaptations (30 seconds per trait).  
  - **Reveal:** *“Traits 1–4 are real; 5–8 are invented. Compare your explanations—were the invented ones less convincing?”*  
  - **Discussion Question:** *“Could you tell invented traits apart by their explanations?”* (Let them notice similar plausibility).  
  - *Goal:* Highlight that persuasive stories ≠ truth.  

  #### **35–45 min: Distinction 1 – The Opposite Trait Test**  
  **Activity:**  
  - Groups take one real trait (e.g., *Yawning Contagion*) and invent:  
    (a) An adaptation story for the trait as-is.  
    (b) An equally persuasive story for the **opposite trait** (e.g., *Resisting Contagious Yawning*).  
  - **Instructions:** *“Write two stories: one for this trait and one for its opposite. Another group will vote on which sounds more convincing—without knowing which is real.”*  
  - Groups swap stories; vote by secret ballot.  
  - **Reveal:** Split votes show neither story is uniquely supported.  
  - *Debrief Seed:* “What does this say about stories that fit any outcome?”  

  #### **45–55 min: Distinctions 2 & 3 – The Mechanism Challenge**  
  **Activity:**  
  - Groups take one invented trait (e.g., *Nose Wrinkling at Rain Scent*) and:  
    (a) Propose an adaptive function (e.g., “avoiding rain-borne pathogens”).  
    (b) Brainstorm non-adaptive alternatives:  
      - *By-product* (e.g., “side effect of general scent sensitivity”).  
      - *Learned/cultural* (e.g., “cultural association of rain with illness”).  
  - **Instructions:** *“Explain this trait as an adaptation, then propose two other explanations: one where it’s an accidental by-product, and one where it’s learned.”*  
  - *Goal:* Show multiple viable origins for the same trait.  

  #### **55–65 min: Distinction 4 & Refutation Challenge**  
  **Activity:**  
  - Groups take a trait they explained adaptively (e.g., *Infant Grasp Reflex*) and:  
    (a) List key assumptions about ancestral environments (e.g., “infants clung to mothers while foraging”).  
    (b) **Forbid stories:** *“Identify one testable prediction from your adaptation story. What observation would disprove it?”*  
      - *Examples:*  
        - If *Grasp Reflex* is adaptive, infants in cultures without foraging should show weaker reflexes (test: compare urban/rural infants).  
        - If *Sweet Preference* is adaptive, isolated tribes without sugar access should still crave it (test: study uncontacted tribes).  
  - Groups share predictions. Note which traits resist refutation (e.g., invented ones).  

  #### **65–70 min: Structured Debrief**  
  **Vocabulary Introduction (After Experiences):**  
  - *“When your invented trait explanations were as convincing as real ones, that’s **unfalsifiability** (Point 1). A good hypothesis rules out alternatives.”*  
  - *“When you explained traits as by-products or learned habits, you separated **mechanism origins** (Points 2–3). Not everything is a direct adaptation.”*  
  - *“When you struggled to test assumptions about the past, you hit **ancestral uncertainty** (Point 4).”*  
  - *“Refutation works when predictions can fail. The difference between a story and a hypothesis is **testability**.”*  

  **Closing Nuance:**  
  *“This doesn’t mean evolutionary explanations are useless. When they make testable predictions (e.g., ‘morning sickness reduces toxin exposure to fetuses’), they become science. Untestable stories don’t.”*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Member Defuses the Reveal:**  
     - *E.g., “This is just the Gould-Lewontin ‘spandrels’ critique!”*  
     - **Solution:** *“Great—let’s see if the activity matches what you know. We’ll discuss terms later.”* Delay vocabulary until debrief.  

  2. **Smuggling Empirical Claims:**  
     - *E.g., “But *Sweet Preference* is obviously adaptive because calories!”*  
     - **Solution:** *“Stick to the trait description only. We’re testing logic, not prior knowledge.”*  

  3. **Reveal Feels Like a “Trick”:**  
     - *E.g., Distrust or disengagement after invented traits are exposed.*  
     - **Solution:** Normalize the experience: *“Scientists face this daily—it’s why we need tests, not just stories.”*  

  4. **Overgeneralization:**  
     - *E.g., “So we can never test evolution!”*  
     - **Solution:** Use refutation examples: *“Morning sickness predictions were tested with miscarriage data. Testable = scientific.”*  

  5. **Time Shortages:**  
     - **Solution:** Cut Round 1 presentations; use written summaries. Prioritize Refutation Challenge.  

  ---

  ### **What the Activity Cannot Reproduce**  
  You must explicitly **supply in closing**:  
  - **Examples of testable evolutionary hypotheses**, e.g.:  
    - *Morning sickness*: Prediction—women with nausea have fewer miscarriages. Supported by data (Flaxman & Sherman, 2000).  
    - *Infant grasp reflex*: Prediction—primates with similar reflexes spend more time clinging to caregivers. Supported by primate studies.  
  - **The core takeaway**:  
    *“The problem isn’t evolutionary psychology—it’s unfalsifiable storytelling. Testable hypotheses survive; just-so stories don’t. Demand predictions!”*  

  This design forces students to confront the gaps in adaptationist reasoning firsthand while equipping them to critique specific failures. It mirrors scientific practice: generating hypotheses, spotting flaws, and demanding evidence.
