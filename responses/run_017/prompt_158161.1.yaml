prompt: |-
  I'm in a final-year seminar on moral responsibility, and last week's session on the standing to blame has left me stuck inside an argument I built for my response paper and can no longer see the exit from. I want to hold on to two claims: that a hypocrite really is missing something when they blame, and that a great deal of ordinary blame is entirely in order. The trouble is the route from the first to the denial of the second:

  (1) If A blames B for a wrong of kind K, and A has herself committed a wrong of kind K without acknowledging it or making amends, then A lacks standing to blame B.
  (2) Standing is a matter of A's relation to the norm B is accused of violating, not of whether B actually violated it; standing is what makes the blame A's to give.
  (3) Blame issued without standing is not merely offensive but defective: it fails to do whatever blame is supposed to do, and B may properly set it aside by pointing out that A has done the same.
  (4) Nearly every adult has done something morally wrong that they have neither acknowledged nor fully made amends for.
  (5) Kinds of wrong are classifiable at multiple levels of generality: any two wrongs fall under some shared description (carelessness; disregard for someone else's interests; acting on a maxim one would not universalize; treating a person as a means), while also being distinguishable under some finer-grained description.
  (6) So for any wrong of B's there is some description K under which it and some unacknowledged wrong of A's both fall, and by (1) A lacks standing.
  (7) Since A was arbitrary, no one ever has standing to blame anyone for anything, and by (3) blame never succeeds at what it is for.
  (8) That cannot be right: some blame plainly is in order, and a practice that could never once succeed is not a practice we could ever have acquired.

  I tried escaping by narrowing (1) to cases where A's own conduct shows she does not genuinely accept the norm she invokes, but the ladder seems to rebuild itself, since for any norm A invokes there will be some other norm she has flouted. So please tell me which step you would reject, why that step looked airtight, and what each of the alternatives costs — including what each of the three accounts we read (blame as second-personal moral address, blame as a modification of the blamer's relationship to the target, and blame as a judgment about the target's quality of will) would have to pay to reject (6), to reject (3), or to reject (1). I would rather keep (1) and (8) than (4) or (5), but I want to know the price before I choose. Answer in American English, in no more than 450 words, and lead with a single sentence naming the step you reject before turning to the diagnosis and the pricing.
reasoning: |-
  Hmm, the user is stuck in a philosophical argument about moral responsibility and hypocrisy in blame. They've constructed a logical progression from premises about hypocritical blaming to a conclusion that all blame is defective, which contradicts their intuition that some blame is legitimate. They're asking me to identify which step to reject in this argument, explain why it seems airtight, and outline the costs of rejection under three major theories of blame.

  The argument's core tension lies between the plausible claim that hypocrites lack standing to blame (1) and the observation that most people have unacknowledged wrongs (4), combined with the flexibility in classifying wrongs (5). This leads to the problematic universal conclusion (6-8). The user wants to preserve both (1) and (8) if possible.

  Looking at the steps, (6) seems like the most promising candidate for rejection. It claims that for any wrong, we can always find a shared description K that covers both the blamed act and the blamer's unacknowledged wrong. But the problem is that not all shared descriptions are normatively relevant for standing purposes. While technically true that any two wrongs share some abstract description (like "violating a norm"), what matters for hypocrisy is whether they violate the same specific moral principle in a way that reveals the blamer's insincerity.

  Rejecting (6) would require distinguishing between normatively relevant and irrelevant classifications of wrongs. For the three theories:
  - Second-personal address (Darwall/Shoemaker) would say standing requires sincerity about the specific norm invoked.
  - Relationship-modification view (Scanlon) would focus on whether the blamer's own violation undermines their relational authority.
  - Quality-of-will theory (Arpaly/Sher) might argue hypocrisy doesn't affect the accuracy of the blame judgment itself.

  The cost is that this requires developing criteria for relevant similarity between wrongs, which could lead to debates about moral equivalence. The alternatives - rejecting (3) or (1) - seem more costly: denying (3) would make standing merely pragmatic rather than about blame's function, while rejecting (1) would require defending some forms of hypocritical blaming.

  The user's preference to keep (1) and (8) makes rejecting (6) the most viable path, though it comes with the theoretical burden of specifying when violations are relevantly similar for standing purposes.
answer: |-
  I reject step (6).

  Step (6) assumes that *any* shared description K linking A's unacknowledged wrong and B's blamed wrong suffices to deprive A of standing. While (5) is technically true (any two wrongs share *some* description), not every shared description is normatively relevant for standing under (1). What matters is whether A's *own conduct* regarding the *specific norm* she invokes against B shows she doesn't genuinely hold that norm or lacks the moral authority to demand compliance from others. A "kind K" must be normatively relevant to the blame being issued. For instance, blaming B for embezzlement isn't undermined by A's unacknowledged jaywalking just because both are "law-breaking" (a shared K); they don't challenge A's sincerity about norms of financial trust.

  **Why (6) looked airtight:** It leverages the logical possibility of finding a shared K (per (5)) to trigger (1), ignoring that (1) implicitly requires the wrongs to be relevantly similar under the norm invoked. It treats all Ks as equivalent.

  **Costs of rejecting (6) & alternatives:**

  *   **Rejecting (6):** Requires developing criteria for normatively relevant similarity between wrongs. This risks arbitrariness or complexity in determining when A's past wrong "counts" against her standing for blaming B's specific wrong.
      *   *Second-personal address (Darwall/Shoemaker):* Pays by needing a robust account of when A's violation violates the *same second-personal demand* she addresses to B. This preserves (1) but requires careful norm-specification.
      *   *Relationship-modification (Scanlon):* Pays by focusing on whether A's violation impairs the *specific relationship* or authority relevant to blaming B for *this* wrong. Allows standing if A's wrong doesn't contradict the relational basis for *this* blame.
      *   *Quality-of-Will (Arpaly/Sher):* Pays least directly; standing is less central. It might say hypocrisy reveals A's *own* poor quality of will but doesn't necessarily make her *judgment* of B's will defective. This strains (3).

  *   **Rejecting (3):** Allows blame without standing to still function normatively (e.g., express disapproval). But this abandons the core intuition behind (1) - that hypocritical blame is *defective*, not just rude. All three theories tie blame's function to relational norms or sincerity, making this costly. It saves blame's efficacy (8) but trivializes standing.

  *   **Rejecting (1):** Denies that hypocrisy inherently undermines standing. One might argue blame can be accurate even if hypocritical. This saves widespread blame (8) but sacrifices the powerful intuition that hypocrites lack moral authority, making (3) irrelevant. All three theories find this costly: they link blame's force to the blamer's own normative position.

  **Your Preference:** Keeping (1) & (8) by rejecting (6) is viable but demands defending a theory of *relevant similarity* for norms/wrongs, the main cost. It avoids the larger costs of rejecting (1) or (3).
