prompt: |-
  I serve, as one of the two lay members, on the Direct Democracy Commission of my canton — the body that rules, before signatures are even counted, on whether a citizen initiative may go to a binding popular vote at all, and whether it goes to the ballot whole, in severed parts, or not at all. I was appointed last spring, having campaigned locally for wider access to the ballot, and the first opinion I must draft on my own is due in three weeks. I would be grateful for your help with it.

  Our precedents, as I have reconstructed them from the archive:

  - We cleared for the vote an initiative entrenching a forty-year ban on commercial airport expansion and transferring the freed land to a public land trust.
  - We refused to clear an initiative requiring every municipal vehicle to be electric by 2027, with a named charging contractor and a build-out schedule annexed.
  - We cleared an initiative whose only content was procedural: any future sale of cantonal water rights must itself be submitted to a separate popular vote.
  - We refused to clear an initiative reducing the pay of the members of the executive council by fifteen per cent.
  - We cleared an initiative declaring the canton a nuclear-free zone, although it created no enforceable duty and bound no spending.
  - We refused to clear an initiative setting the transport authority's fare structure, including a discounted pass for under-25s funded by a parking levy.
  - We returned, as impermissibly multi-subject, an initiative that bundled a data-protection rule with a change in the property tax, inviting its authors to resubmit the halves separately.

  The proposal now before us is the Congestion Revenue and Open Models Initiative, which has four operative parts. First, a declaration that the net revenue from the canton's planned congestion charge belongs to the residents of the canton. Second, a requirement that ninety per cent of that net revenue be distributed annually in equal per-resident rebates, the amount to be certified by the cantonal audit office. Third, a proviso that the ninety per cent share may be lowered only by a further popular vote. Fourth, an obligation to publish the traffic model underlying the charge together with its source code and a plain-language statement of the assumptions that most affect projected revenue; this part lapses after eight years unless renewed.

  My own hypothesis is that we have been running something like a distinction between frame measures — decisions that fix the terms within which later decisions are made — and line measures, which settle one allocative outcome, and that we have never said so in an opinion. A colleague argues that every precedent fits a simpler test: we defer to the people exactly when a decision is costly for a later assembly or electorate to undo, and we retain what is cheaply revisable. As far as I can tell the two tests agree on the new initiative's first and third parts and disagree sharply on the second and fourth. Both of them, moreover, stumble on the nuclear-free declaration, which was trivially reversible and yet cleared; the minutes defend it as constituent rather than policy, which may be a third test in disguise — that the people may decide whatever the canton is entitled to declare about itself, whatever follows from it in practice.

  So: assuming we should be consistent with ourselves rather than with what any of us would prefer on the merits, what should we do — clear the initiative whole, clear some parts and sever others, or return it to its authors? Which precedent is the closest analog, and why? (I do not think the multi-subject precedent settles it, since the airport initiative had two operative parts and was not returned.) For each option, what principle would we be adopting, stated plainly enough to bind us next time? And is there a variant of this proposal, or a hypothetical next one, that would expose which test we have really been using?

  One further worry I cannot set aside: the more we sever the technical parts, the more we leave voters ratifying declarations whose operative content is settled elsewhere, so that a yes becomes difficult to interpret as a mandate for anything. Several colleagues think any filtering by us is illegitimate in principle. I would like to know whether that worry is a reason to change the practice or simply a cost of having one.
reasoning: |-
  Okay, the user is a lay member on a Direct Democracy Commission in their canton, tasked with evaluating whether the Congestion Revenue and Open Models Initiative should proceed to a vote. They need to draft an opinion in three weeks and are seeking guidance on applying precedents consistently. Let me unpack their query carefully.

  First, the precedents show a pattern: initiatives that set long-term frameworks or procedural rules (like the airport ban or water rights vote) were cleared, while those dictating specific operational details (municipal vehicles, executive pay, fare structures) were rejected. The nuclear-free zone exception stands out as symbolic despite being reversible. 

  The current initiative has four parts: (1) declaring net revenue belongs to residents, (2) requiring 90% rebates, (3) locking the 90% threshold unless changed by future vote, and (4) mandating transparency for the traffic model. The user proposes a "frame vs. line" distinction, while a colleague suggests a "cost-to-reverse" test. Both theories conflict on parts 2 and 4. 

  Hmm, the real tension is between consistency and legitimacy. If they sever too much, voters might end up approving hollow declarations. But rejecting valid parts could overstep their role. The user seems to prioritize institutional integrity over personal policy preferences—commendable but tricky.

  Looking at the initiative: Part 1 is purely declarative (like nuclear-free zone), part 3 establishes a procedural lock (like water rights vote), so both should clear under any test. Part 2 is allocative (resembles refused fare-structure initiative), and part 4 is technical/sunsetting (unique but closer to refused vehicle mandate). 

  The closest precedent is actually the refused fare-structure initiative: both involve revenue allocation mechanisms. Severing parts 2 and 4 would align with rejecting line-item decisions. But the multi-subject concern is valid—the airport initiative had multiple elements but wasn’t severed because both were framing (land use + public trust). Here, the elements aren’t inseparable. 

  For the "why now" test: If an initiative mandated publishing all cantonal models indefinitely, would that be a frame? Yes. But this 8-year limit makes it operational. Similarly, the rebate is a specific distribution formula, not a broad principle. 

  The user’s anxiety about hollow declarations is spot-on. If they only clear parts 1 and 3, voters are approving a promise of future revenue without the enforcement mechanism (part 2) or transparency (part 4). That could breed distrust. But the commission’s role is gatekeeping, not perfecting proposals. 

  Final recommendation: Sever parts 2 and 4, clearing 1+3. Principle: "We clear initiatives establishing constitutional principles or procedural constraints but sever specific allocations or time-bound technical rules." This binds future cases—e.g., a 5-year tax rebate scheme would be severed, but a permanent fiscal principle wouldn’t. 

  The nuclear-free zone remains an outlier but can be distinguished as purely identity-based. A hypothetical initiative declaring "Canton X Values Free Speech" would test that: if cleared, it confirms the "constituent" exception. 

  Legitimacy-wise: Filtering is inherent to their role. The cost is acceptable if applied neutrally. Changing practice now would undermine precedent—better to justify severance transparently in the opinion. 

  Whew. This is complex but fascinating. Hope the user feels equipped to draft that opinion!
answer: |-
  Based on your precedents and the need for consistent principles, here's a structured analysis and recommendation for the Congestion Revenue and Open Models Initiative:

  **1. Recommended Action: Sever Parts 2 & 4; Clear Parts 1 & 3**  
     - **Cleared:** Part 1 (Declaration of revenue ownership) + Part 3 (Lock-in requiring future vote to lower 90% share).  
     - **Severed:** Part 2 (Specific 90% rebate formula) + Part 4 (8-year model transparency mandate).  
     - **Why:** This aligns best with your precedents while resolving the "frame vs. line" and "cost-to-reverse" conflicts.

  **2. Closest Precedent: The Refused Fare-Structure Initiative**  
     - Part 2 (rebate formula) mirrors the rejected fare/parking initiative: both dictate specific, time-bound fiscal allocations.  
     - Part 4 (technical model rules) resembles the refused electric-vehicle initiative's operational mandates.  
     - The nuclear-free declaration is distinguished as purely symbolic self-definition (no enforcement mechanism), unlike Part 4’s actionable transparency duty.

  **3. Principle Adopted (Stated Plainly):**  
  > *"We clear constitutional framing decisions (principles, procedures, or irreversible commitments) but sever specific allocative outcomes or time-bound technical rules that fall within ordinary governance."*  
     - **Binds future cases:**  
       - *Clears:* Entrenching principles (airport land trust), procedural locks (water-rights vote), symbolic declarations (nuclear-free).  
       - *Severs:* Detailed spending formulas (fare structure), sunsetting technical mandates (model disclosure).  
       - *Refuses:* Direct salary-setting (executive pay reduction).

  **4. Why Your Tests Converge Here:**  
     - **Part 1 (Declaration):** Frame (sets ownership principle) + Costly to reverse (requires overriding popular sovereignty).  
     - **Part 3 (Lock-in):** Frame (future procedure) + Costly to reverse (requires another vote).  
     - **Part 2 (Rebate):** Line (allocative outcome) + Cheaply revisable (legislature can adjust rebates *if* not locked).  
     - **Part 4 (Transparency):** Line (operational rule) + Cheaply revisable (lapses in 8 years; no entrenchment).

  **5. Resolving the Nuclear-Free Exception:**  
     It fits a **third sub-principle**: *"The people may adopt declarations defining the canton's fundamental identity, even if non-enforceable, provided they lack direct allocative or operational effects."*  
     - Part 1 of this initiative qualifies as "identity-defining" (revenue ownership = civic belonging).  
     - Part 4 does *not* (technical governance ≠ identity).

  **6. Multi-Subject Precedent & Airport Initiative Distinction:**  
     - The airport initiative had *interdependent* parts: Ban enabled land transfer → **Single purpose** (preserving land).  
     - This initiative’s parts are *severable*: Revenue ownership (Part 1) doesn’t require the rebate formula (Part 2).  
     - Thus, severance is consistent.

  **7. Addressing "Hollow Declarations" Concern:**  
     This is a **necessary cost of gatekeeping**, not reason to abandon practice. Your role is to ensure questions are *legally coherent* and *governance-fit*. A "yes" to Parts 1 & 3 still delivers:  
     - A binding principle (revenue belongs to residents).  
     - A procedural lock (90% rebate floor unless voters agree otherwise).  
     - Legislatures can implement these without Parts 2/4.

  **8. Test-Revealing Hypothetical:**  
     Propose: *"An initiative requiring all cantonal software procurements to use open-source code after 2030."*  
     - Under "frame vs. line": **Sever/refuse** (line-item operational rule).  
     - Under "cost-to-reverse": **Clear** (repealing entrenched procurement rules is costly).  
     - Your precedent (refused vehicle/charging initiative) suggests **refusal**, exposing your true principle as **frame-focused**.

  **Drafting Guidance for Your Opinion:**  
  1. **Start with the principle** (framing vs. line decisions) to justify severance.  
  2. **Analogize Part 2** to refused fare/pay initiatives (specific allocations).  
  3. **Analogize Part 4** to refused vehicle initiative (technical mandates).  
  4. **Defend Parts 1 & 3** via water-rights vote (procedural lock) + nuclear-free zone (declarative).  
  5. **Acknowledge the "hollow mandate" concern** but affirm that preserving governance integrity outweighs it.

  This maintains consistency, provides a clear rule for future cases, and respects the commission’s institutional role. Well done on reconstructing these patterns—your analytical rigor shines through.
