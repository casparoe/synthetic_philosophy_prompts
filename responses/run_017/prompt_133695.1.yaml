prompt: |-
  Hey — I'm on the program committee for a small academic society (seven of us, we meet four times a year, and we somehow always end up arguing about procedure). We mostly decide two kinds of things: which submissions to accept given a rough capacity limit, and a big pile of low-stakes housekeeping motions where the status quo wins if nothing passes. Right now we use plain plurality with the chair breaking ties, everyone hates it, so we've agreed to pick a new rule — and this is the part I keep going back and forth on — we've also agreed to re-open the choice of rule every two years, using whatever rule is currently in force to decide whether to change it. I've been reading about Arrow's theorem and Gibbard–Satterthwaite and I think I get the headline: no ranked-ballot rule gives you unrestricted domain, Pareto, independence of irrelevant alternatives and non-dictatorship all at once, and any non-dictatorial rule with three or more possible outcomes is manipulable somewhere. I also get the standard move that cardinal methods like approval and score aren't really in the theorem's crosshairs because they ask voters for more than a ranking — though a friend of mine who does mechanism design says that just relocates the problem, since you then need interpersonal comparisons of intensity, and Harsanyi-style aggregation only works if you can actually put people's utilities on a common scale, which we definitely can't for a room of seven tired professors.

  What I actually want from you is a ranked tier list. Please sort these — plurality, instant-runoff, Borda, a Condorcet/Schulze-type method, approval voting, score voting (0–5), random dictatorship (one randomly drawn member's ballot decides each motion), and a sociocracy-ish consent rule where a motion passes unless someone formally objects — into tiers by how good they'd be for a committee like ours, and give each a 0–100 score plus a sentence on why it lands there. Judge them on the things that actually bite for us: how often they'd pick something most of us really prefer, how badly they degrade once people start voting strategically instead of sincerely, how easy they are to explain and hand-count at 6pm, how exposed they are to whoever sets the agenda or the order of motions, and how they handle the fact that most of our votes are near-unanimous ratifications of a status quo rather than real contests.

  Then the bit I can't get straight, and which matters more to me than the list itself: the meta-level. Our ranking of the rules is itself a collective choice among more than two options, made by voters whose preferences over the rules are vague, unstable and partly strategic — so by Arrow's own logic, shouldn't we expect that ranking to be exactly as impossible to do well as any other? Does the impossibility eat itself, or is choosing a rule relevantly different from choosing an outcome, e.g. because we choose it rarely, behind a partial veil of ignorance about which proposals we'll face later, or because it's the kind of choice where we'd happily accept randomness in a way we wouldn't for an actual decision? And then concretely: if we re-vote on the rule every two years under the rule itself, which of your top-tier rules has a stable fixed point, i.e. would it ever vote to replace itself with something lower on your list? Is a rule's tendency to preserve itself a point in its favour or an argument against it?
reasoning: |-
  Okay, the user is part of a seven-person academic program committee that meets quarterly. They constantly argue about procedures and currently use plurality voting, which everyone hates. They've decided to pick a new voting rule and revisit this choice every two years using the current rule. The user understands Arrow's theorem and Gibbard-Satterthwaite but is seeking practical advice on selecting a voting method.

  They want a tier list of voting systems based on specific criteria: effectiveness in picking widely preferred options, resistance to strategic voting, ease of explanation and hand-counting, independence from agenda-setting, and handling near-unanimous decisions. They also have deeper concerns about the meta-problem of choosing a voting rule itself, given Arrow's impossibility theorem applies to this choice too. They wonder if the impossibility "eats itself" and whether some rules are self-stabilizing.

  Breaking down the user's needs: First, they need a clear comparison of voting methods tailored to their small committee context. The tier list should prioritize practicality since they'll hand-count votes at 6 pm. Methods that are simple and quick are essential. 

  Second, resistance to strategic voting is crucial because tired professors might game the system. They mention most votes are routine approvals, so the method should default to the status quo unless there's real opposition. This makes consent-based rules attractive.

  Third, the meta-problem is tricky. The user is concerned that choosing a voting rule is subject to the same impossibilities as any social choice. They need to know if some rules are self-stabilizing when revisited every two years. Also, whether a rule's tendency to preserve itself is a pro or con.

  Assessing the voting methods:
  - Approval voting: High marks for simplicity, handling status quo well, and resisting strategy. Easy to explain and count. Might struggle with nuanced preferences but good for their needs.
  - Consent rule: Sociocracy-style. Excellent for near-unanimous decisions and status quo bias. Low cognitive load. Strategic objections could be an issue, but formal objections might deter frivolous ones.
  - Score voting: Captures intensity but interpersonal comparisons are tough. Hand-counting 0-5 scores for seven people is manageable but messier than approval.
  - Condorcet methods: Theoretically strong but complex to explain and hand-count. Pairwise comparisons get cumbersome with multiple motions. Better for larger groups.
  - IRV: Better than plurality but has its flaws. Known for non-monotonicity and susceptibility to strategy. Hand-counting might be tedious with seven members.
  - Plurality: Their current system, which everyone hates. Prone to vote-splitting and doesn't reflect preferences well. Strategic voting degrades it further.
  - Random dictatorship: Too random for serious decisions, though simple. Unlikely to be acceptable to professors.
  - Borda count: Vulnerable to strategic ranking and cloning. Hand-counting is doable but more complex than approval.

  On the meta-level: The user's insight is correct—choosing a voting rule faces similar impossibility problems. However, factors like infrequent decisions, veil of ignorance (not knowing future proposals), and openness to randomness might mitigate this. For stability, approval and consent rules are likely self-ratifying because they're simple and handle the status quo well. A rule preserving itself isn't inherently bad if it's genuinely good, but it could entrench a suboptimal system.

  Recommendations: Approval voting and consent rule are top-tier. They address the committee's needs effectively. For the meta-choice, starting with approval or consent makes sense. If they revisit the rule, these methods might confirm themselves due to satisfaction and simplicity. The key is to pick something practical now and adjust later if needed.
answer: |-
  Here's a tiered analysis of voting rules for your committee, judged on your criteria (preference satisfaction, strategic robustness, simplicity, agenda resistance, status quo handling), followed by the meta-level discussion:

  ### **Tier List & Scores**
  *(100 = Perfect Fit, 0 = Actively Harmful)*

  | Rank | Rule                          | Score | Why                                                                                                  |
  |------|-------------------------------|-------|------------------------------------------------------------------------------------------------------|
  | **S (Top Tier)** | **Approval Voting**           | 95    | Simple ballot ("approve" or not), easy hand-count, resists strategy on status quo motions, minimizes agenda power. Excels at ratifying defaults unless opposition exists. |
  | **S**            | **Consent Rule**              | 90    | Natural fit for low-risk housekeeping: defaults pass unless formal objection. Minimal voting effort, strategy-resistant for status quo. Explains in 10 seconds. |
  | **A (Strong)**   | **Score Voting (0–5)**        | 80    | Captures intensity better than ranked methods, hand-count feasible for 7 voters. Strategy risk on contentious issues, but status quo benefits from high default scores. |
  | **B (Viable)**   | **Condorcet/Schulze**         | 65    | Theoretically robust winner, but *nightmare* to hand-count pairwise matrices. Agenda manipulation low, but strategic ranking is complex. Overkill for near-unanimous votes. |
  | **C (Flawed)**   | **Instant-Runoff (IRV)**      | 50    | Better than plurality but non-monotonic & manipulable. Hand-counting rounds is tedious. Status quo bias weak; controversial motions may eliminate consensus options early. |
  | **D (Poor)**     | **Borda Count**               | 40    | Highly manipulable via insincere rankings ("cloning"), sensitive to agenda order. Simple count but degrades badly with strategy. Poor status quo protection. |
  | **D**            | **Plurality**                 | 20    | Your current system: incentivizes tactical voting, ignores preferences beyond top choice, vulnerable to vote-splitting. Fails all your criteria. |
  | **F (Avoid)**    | **Random Dictatorship**       | 10    | Unacceptably random for serious decisions. Simple but violates fairness; no incentive for sincere input. |

  ---

  ### **The Meta-Level: Can You Even Choose a Rule "Well"?**
  Yes, Arrow/G-S apply *in theory* to rule selection, but your context **mitigates the impossibility**:

  1.  **Limited Scope & Veil of Ignorance:**  
      You're choosing a *process* for future unknown proposals, not an immediate outcome. Voters have **roughly symmetric interests** (all want efficiency, fairness, low hassle). This is closer to Harsanyi's "impartial observer" than a zero-sum policy fight. Preferences over rules are vague because *intensity matters less* – it's a procedural choice.

  2.  **Infrequent Choice & Stability:**  
      Re-voting every 2 years reduces manipulation incentives. A rule that works "well enough" will likely retain support, creating a **self-stabilizing equilibrium**. Strategic voting on the meta-level is harder because voters can't predict which future motions will be affected.

  3.  **Randomness is More Acceptable:**  
      While randomness in deciding *submissions* feels unfair, randomness in *choosing a rule* (if needed) is often tolerable as a "fresh start" mechanism. This sidesteps impossibility theorems.

  4.  **Practical Dominance:**  
      Some rules (Approval, Consent) are **objectively simpler and more robust** for your use case. If voters care about reducing cognitive load/hassle, Arrow-style paradoxes become less relevant – there's a shared Pareto-optimal choice.

  ---

  ### **Self-Stability of Top Rules**
  - **Approval Voting:** **Likely self-stable.** It's simple, handles status quo well, and avoids obvious failures. Strategic voters gain little by proposing alternatives unless dissatisfaction is high. A move to *Score* might appeal but risks complexity; *Consent* is complementary, not a threat.
    
  - **Consent Rule:** **Highly self-stable.** Objecting to the Consent Rule itself requires a formal objection – which would signal serious dysfunction. Its low effort makes replacement unlikely without broad consensus for change.

  - **Score Voting:** **Moderately stable.** Could be challenged by Approval advocates ("Why complicate scoring?"), but if voters value expressiveness, it may persist. Unlikely to revert to ranked methods.

  > ⚖️ **Self-Preservation: Pro or Con?**  
  > It's a **virtue** if the rule is genuinely good (like Approval/Consent). Stability reduces chaos. But if a *bad* rule entrenches itself (e.g., Plurality), it's a flaw. Your re-vote safeguard makes this unlikely – poor rules *will* be replaced under their own shortcomings.

  ---

  ### **Recommendation**
  1. **Adopt Approval Voting or Consent Rule immediately.**  
     - For **housekeeping motions**: Consent Rule is ideal (fast, honors status quo).  
     - For **submissions**: Approval Voting captures breadth of support better.  
     *(Combining them: Use Consent for routine items, Approval for accept/reject decisions.)*  
     
  2. **At your first rules review (2 years later):**  
     - Use your *current* rule (Approval/Consent) to decide whether to change.  
     - Propose alternatives only if >1 member objects to the status quo.  

  This approach leverages simplicity, minimizes strategy, and respects your status-quo-heavy workflow. The meta-process is robust precisely because your committee’s needs are procedural and low-intensity – **impossibility theorems bite hardest in zero-sum conflicts, not fatigue-averse academia.**
