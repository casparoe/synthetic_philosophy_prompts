prompt: |-
  i'm helping draft the first chapter of a handbook for people who actually have to *judge* selection schemes — a university admissions panel, a compliance body looking at a company's board, a tribunal ruling on a reservation category — and i keep going round in cirlces because everyone i talk to has a different idea of what the question even is. so before i let anyone argue about whether a given scheme is OK, i want the spec: what would a theory of group-conscious selection have to be able to *do* to be good enough to hand to such a body?

  Not a theory of justice in general. A decision-grade account of when selecting people partly on the basis of their membership of some group is permissible, impermissible, or required — one that has to be appliable by an institution that doesn't know the whole social history, that can't run experiments, and that needs to be told not just "no" but what change would make the scheme acceptable. That's the purpose, and i care about it being usable in that setting, so procedural/administrability stuff is a real desideratum here, not a boring footnote.

  The distinctions it must not collapse (with the case that shows why each matters):

  - hard quota vs target vs tiebreaker vs "comply or explain" — because the same number can be reached by four mechanisms with totally different costs and exit options.
  - the choice of benchmark: parity with the population, with the applicant pool, or with the pool qualified at an earlier stage. A principle i've made up and want you to test — call it **conditional-pipeline parity** (i think of it as the Ashworth rule, after a fictional 2019 white paper): a scheme is permissible iff each group's selection rate matches its share of the pool that qualified at *the last stage the institution didn't itself control*, discouting differences in qualification that were themselves produced by the institution's own past practices. Is that even coherent? Does it demand something any real institution could compute?
  - membership-fixing: who counts, who decides, and what happens when the category is self-declared. **The opt-in surge**: a university lets applicants tick any ancestry box they identify with, enrolment of the target groups triples on paper and nothing else changes. Is the scheme better, worse, or the same?
  - **The parish register case**: a selective school switches from a racial preference to a "local heritage" preference decided by baptism records going back to 1900. In this made-up town that tracks ancestry almost perfectly. Every fact about who gets in is unchanged. Does anything morally important change, and if so does the theory have the resources to say it without sneaking in intent?
  - **The same-five-people case**: board quotas met by rotating a tiny set of the same individuals across dozens of companies, so the headcount moves and nothing else does.
  - **The decorative case**: the quota is hit on the board while the executive committee, where the decisions are actually made, is untouched.
  - **The hollow-benefit case**: the scheme is justified by its effects on the institution (better decisions, legitimacy, market trust), and it's genuinely good on those, while the intended beneficiaries are on average no better off — maybe slightly worse by some measures. Which way does the theory point, and should that be allowed to depend on whether the beneficiaries consent?
  - **The symmetry case**: in this fictional country men are 20% of vet-med students. Is a scheme for them governed by the same rule, or does the direction matter — and if it does, what has to be true for that to be non-arbitrary?
  - **The sunset case / the erosion case**: a scheme that works on its own numbers but appears to slow reform of the pipeline feeding it, so ten years on the underlying disparity is unchanged. Also: when, if ever, is a scheme *required* to have an expiry date?
  - **The intersection case**: someone disadvantaged along two axes at once. Does the theory handle that by construction, or does it have to be bolted on?

  So: give me the requirement list, each with the case or consideration that earns it a place. Mark which are non-negotiable for a decision-grade theory and which are just what one camp happens to like (i suspect "must be forward-looking only", "must be expressible without any mention of groups at all", and "must be symmetric across groups" are in that second bin, but argue). Flag any pair you think can't be jointly satisfied — especially the administrability requirement (an institution shouldn't have to adjudicate contested identities or people's inner lives) against taking intersectionality seriously — and if some subset is jointly unsatisfiable, say so, that's the bit i most want. Then tell me which single requirement knocks out the most candidate theories.

  After that, and briefly — a table is fine, no more than a couple of lines each — score four contenders against your own list: colourblind individualism, anti-subordination, diversity-as-instrumental, and my conditional-pipeline-parity rule above. Please don't give me citations, case names from actual litigation, or a reading list; i want the criteria, and i'll go find the literature myself. Real-world regimes (reservations with a creamy-layer-style exclusion, boardroom quotas, race-conscious admissions in US universities) are fine as illustration but i don't need their details or dates. British English throughout, ta.
reasoning: |-
  Okay, the user is drafting a handbook chapter for decision-makers who need to evaluate selection schemes involving group membership. They're stuck on defining what makes a theory of group-conscious selection "decision-grade." They've listed several key distinctions and edge cases (like hard quotas vs. targets, benchmark choices, membership issues, etc.) that any viable theory must handle. Their core ask is a requirement list grounded in practical adjudication needs, not abstract justice theory.  

  First, I need to parse their underlying tension: they want a theory that’s both philosophically robust (handling tricky cases like "parish registers" or "hollow benefits") and administratively feasible (no social experiments, contested identities, or forensic history audits). The unspoken pain point is *institutional realism*—panels can’t play philosopher-kings.  

  Their "conditional-pipeline parity" idea (Ashworth rule) is clever but possibly brittle. It assumes institutions can cleanly identify "stages they didn’t control," which real-world path dependencies might blur. Also, "discounting past practices" sounds audit-heavy. Might clash with administrability.  

  For the requirement list, I’ll group by function:  
  - **Definability** (avoiding intent-sniffing): Parish register case shows formalism is useless if it can’t flag proxy discrimination.  
  - **Effect-capture**: Decorative/hollow-benefit cases demand measuring real impact, not box-ticking. Sunset/erosion cases need dynamic assessment.  
  - **Operational safety**: Opt-in surges and same-five-people cases expose gaming risks; benchmarks must resist manipulation.  
  - **Scope integrity**: Symmetry and intersectionality cases test if the theory’s logic holds universally or crumbles under asymmetry.  

  Non-negotiables?  
  1. **Actionable diagnostics** (not just "no" but "fix X")—without this, it’s useless to panels.  
  2. **Intent-independence**—parish register case proves moral stakes exist sans bigotry.  
  3. **Administrability**—if it needs mind-reading or 100 years of baptism records, it’s dead.  

  The trickiest trade-off: **intersectionality vs. administrability**. Tracking compound disadvantage risks messy ID politics or reductive grids. Maybe a theory can handle it structurally (e.g., assessing disadvantage multidimensionally) without requiring panels to dissect everyone’s identity.  

  Contender scoring:  
  - **Colourblind individualism**: Fails parish register (can’t see proxies), hollow benefit (ignores group outcomes), sunset (no pipeline scrutiny). Dead last.  
  - **Anti-subordination**: Strong on decorative/hollow cases (focuses on power), but weak on administrability (needs historical analysis) and symmetry (direction matters—okay, but must justify why).  
  - **Diversity-instrumental**: Handles hollow benefits if institution gains, but flunks same-five-people (tokenism) and sunset (may ignore pipeline fixes). Also, consent question unaddressed.  
  - **Ashworth rule**: Nails pipeline justice cleanly, but brittle—opt-in surge? Parish register? Intersectionality? May demand data institutions lack.  

  Biggest flaw-spotter? **Actionable diagnostics requirement**. Knocks out theories that only judge permissibility without prescribing fixes (e.g., many diversity frameworks). Ashworth scores well here—it points to pipeline stages.  

  User’s clearly sharp—they’ve pre-empted "gotchas" like erosion effects. Their handbook will thrive if the theory avoids ivory-tower traps. I’ll stress that the winner must turn panels into repair technicians, not archaeologists.
answer: |-
  Below is a requirement list for a "decision-grade" theory of group-conscious selection, grounded in your cases and institutional constraints. Non-negotiable requirements (**bolded**) are those essential for practical adjudication; others address common disputes but may admit trade-offs. Conflicts and trade-offs are flagged explicitly.

  ---

  ### **Core Requirements for a Decision-Grade Theory**  
  *(With justifying cases/considerations)*  

  1. **Must provide actionable diagnostics**  
     *Why*: Institutions need to know *what change* makes a scheme acceptable (e.g., converting a hard quota to a tiebreaker in "hard quota vs. target" case).  
     *Non-negotiable*: Without this, the theory is useless for remediation.  

  2. **Must be intent-independent**  
     *Why*: "Parish register case" – Moral stakes exist even if proxy categories hide intent. The theory must flag problematic schemes without mind-reading.  
     *Non-negotiable*: Panels lack tools to adjudicate motives.  

  3. **Must define permissible benchmarks rigorously**  
     *Why*: "Choice of benchmark" case – A theory must specify whether parity is measured against population, applicants, or pipeline stages (e.g., Ashworth rule), as each implies different obligations.  
     *Non-negotiable*: Benchmarks anchor all quantitative fairness claims.  

  4. **Must resist gaming/exploitation**  
     *Why*: "Opt-in surge," "same-five-people," and "decorative case" – The theory must penalise schemes that achieve numbers without substance (e.g., tokenism, identity inflation, or diverting power).  
     *Non-negotiable*: Prevents hollow compliance.  

  5. **Must account for dynamic effects**  
     *Why*: "Sunset/erosion case" – A scheme slowing pipeline reform is defective. The theory must evaluate long-term incentives, not just short-term outcomes.  
     *Negotiable*: Some argue panels can’t predict futures, but *ignoring* erosion is indefensible.  

  6. **Must handle intersectionality without requiring individual adjudication**  
     *Why*: "Intersection case" – Disadvantage compounds, but panels can’t dissect personal identities. The theory must address systemic multi-axis disparities *without* complex individual assessments.  
     *Non-negotiable*: Real-world disadvantage is layered; ignoring it is unjust.  

  7. **Must specify when group symmetry applies**  
     *Why*: "Symmetry case" – If men are underrepresented in vet-med, identical rules *might* apply, but the theory must clarify if direction matters (e.g., only for historically marginalized groups?) and why.  
     *Negotiable*: Context-dependent, but must be explicitly addressed.  

  8. **Must weigh instrumental benefits against beneficiary outcomes**  
     *Why*: "Hollow-benefit case" – If a scheme helps institutions but harms beneficiaries, consent *might* matter, but the theory must prioritise or balance these.  
     *Negotiable*: Consent could mitigate harm, but not erase exploitation.  

  9. **Must be administrable with imperfect data**  
     *Why*: Institutions can’t run experiments or audit ancient records ("parish register case"). The theory cannot demand unavailable data (e.g., ancestral baptism records) or subjective proof.  
     *Non-negotiable*: Impractical theories fail in the field.  

  ---

  ### **Key Conflicts and Trade-offs**  
  - **Intersectionality vs. Administrability**: Tracking multi-axis disadvantage risks messy identity disputes. Resolution: The theory should assess *structural barriers* (e.g., "lack of applicants from Group X due to past exclusion") not individual identities.  
  - **Dynamic Effects vs. Actionability**: Predicting long-term erosion is speculative. Resolution: Require *monitorable triggers* (e.g., "if pipeline disparity persists after 5 years, scheme pauses").  
  - **Opt-in Surge vs. Gaming Resistance**: Self-declared membership boosts numbers but may dilute impact. Resolution: Treat identity inflation as a red flag unless coupled with material benefits (e.g., scholarships).  

  **Most disqualifying requirement**: **Actionable Diagnostics**. Many theories (e.g., pure anti-subordination) explain *why* a scheme is unjust but not *how to fix it*. This fails panels needing remediation plans.

  ---

  ### **Theory Scorecard**  
  *(✔ = Satisfies, ✗ = Fails, ~ = Partial/Contextual)*  

  | Requirement                          | Colourblind Individualism | Anti-Subordination | Diversity-as-Instrumental | Ashworth Rule (Pipeline Parity) |  
  |--------------------------------------|---------------------------|--------------------|---------------------------|----------------------------------|  
  | **1. Actionable Diagnostics**        | ✗ (Only says "remove groups") | ~ (Diagnoses harm, vague fixes) | ✔ (e.g., "add training") | ✔ (Points to pipeline fixes) |  
  | **2. Intent-Independence**           | ✔                         | ✗ (Often infers intent) | ✔                         | ✔                               |  
  | **3. Defined Benchmarks**            | ✗ (Rejects group parity) | ~ (Uses historical benchmarks) | ~ (Ad hoc, e.g., "critical mass") | ✔ (Explicit: last uncontrolled stage) |  
  | **4. Gaming Resistance**             | ✔ (Ignores groups)        | ✔ (Flags tokenism) | ✗ (Rewards hollow diversity) | ~ (Misses opt-in surge)         |  
  | **5. Dynamic Effects**               | ✗ (Ignores pipelines)     | ✔ (Focuses on change) | ✗ (Rewards short-term gains) | ✔ (Built-in pipeline scrutiny)  |  
  | **6. Intersectionality**             | ✗ (Denies groups)         | ✔ (Holistic disadvantage) | ✗ (Treats groups separately) | ✗ (Single-axis focus)           |  
  | **7. Group Symmetry**                | ✔ (All groups same)       | ✗ (Prioritises oppressed) | ~ (Market-driven)         | ✔ (Formally symmetric)          |  
  | **8. Benefit vs. Harm Balance**      | ~ (Ignores group harm)    | ✔ (Centres beneficiaries) | ✗ (Prioritises institution) | ~ (Ignores individual outcomes) |  
  | **9. Administrability**              | ✔ (Simple)               | ✗ (Needs history audits) | ✔ (Uses available data)   | ✗ (Requires pipeline data)      |  

  **Summary Notes**:  
  - **Colourblind Individualism**: Fails most requirements; collapses distinctions (e.g., parish register).  
  - **Anti-Subordination**: Strong on justice, weak on administrability and diagnostics.  
  - **Diversity-as-Instrumental**: Pragmatic but permits hollow compliance (e.g., decorative boards).  
  - **Ashworth Rule**: Rigorous on benchmarks/dynamics but brittle on intersectionality and data demands.  

  **Recommendation**: No theory satisfies all. Prioritise requirements 1–4 and 9 for your handbook. Ashworth Rule is the *most structured* but needs intersectional safeguards (e.g., "apply pipeline parity to most excluded group where axes overlap"). Pair it with gaming resistance tests (e.g., "same-five-people" scrutiny) to close gaps.
