prompt: |-
  You are a veteran examiner in moral and political philosophy. You have chaired pre-university and first-year honours assessment boards for years, and you have a reputation for setting questions that a student cannot answer by reciting definitions, however fluently. I need your help constructing one question for a real assessment, and I would like you to proceed carefully rather than quickly. Please work in three labelled stages before you write anything final.

  Stage 1 — Diagnosis, in note form. List the three or four things a well-prepared student is most likely to say if this topic is set loosely, and for each, one line on why it would be summary rather than argument.

  Stage 2 — Crux. Sketch two or three candidate cruxes for the question. Against each, write one sentence on whether it separates a student who understands the issue from a student who has memorised the labels, and pick one.

  Stage 3 — Deliverables. Only then write the question, the model answer, and the marking scheme.

  Constraints on the deliverables: no bibliography, no citations, no references to authors, titles, or dates anywhere in the materials. The exam is closed-book and closed-device; everything a student needs, including the typology itself, must be stated inside the question paper, since not every candidate will have encountered it before.

  Who I am and what this is for: I am a sixth-form student and I run my school's Philosophy Club. Each spring our club sits a two-hour certificate paper that our faculty advisor reviews, and the senior members mark it under her supervision. The paper is marked out of 25. I want one question, worth the full 25, on the threefold typology of honour, dignity, and victimhood cultures and on whether any one of them is morally superior to the others. I do not want a question that can be answered by writing out what each culture is and then concluding that each has strengths and weaknesses; a candidate who does only that should be capped at roughly 11 out of 25, and I want the scheme to say where exactly that cap bites.

  The scenario I have been mulling over, which I would like built into the question: a co-educational day school of about nine hundred students with a socially mixed catchment. Two years ago, after a series of fights following a football match, the school introduced two things at once: an anonymous reporting app administered by an outside charity, and mandatory restorative circles for anything that gets formally reported. After two years, physical fights have fallen sharply, while formal reports have risen roughly fivefold. About a fifth of the reports concern things that happened online and off campus. Teachers report that students increasingly refuse to apologise to each other face to face and instead say the other person should put it in the app. The counsellor says a small number of students generate a large share of the reports, and that being reported is now spoken of as a defeat in a status competition. Several parents say their sons are being taught to inform rather than to stand up for themselves. A group of older girls says the app is the first thing that has ever protected them from what staff used to dismiss as drama.

  Please build the question so that it contains, in some form, the following four ideas, which I have not seen handled together and which I think are where the real difficulty lies:

  1. The audience-reliability condition. A victimhood mechanism works by recruiting third parties, so its output depends on whether the audience is well informed and unbiased. Candidates should have to say whether a culture whose central mechanism only functions when the audience happens to be reliable can be called morally superior, given that reliability is not under the control of the person using the mechanism, and whether unreliability is a moral defect of the culture or merely bad luck.

  2. The standing-recovery test. In an honour culture the person who has done wrong can restore his standing by a recognised act. Candidates should have to ask whether a mechanism that downgrades someone's standing with no routinised way back can be just, and what this implies about a regime that combines public accusation with no formal finding.

  3. The degeneration thesis. Where status competition has not disappeared but has moved into the reporting system, a victimhood culture may be an honour culture with the fists removed, so that the interesting question is not which culture a school has adopted but which one its mechanisms silently regenerate.

  4. The composability problem. Honour, dignity, and victimhood logics may not combine. Anonymous reporting may raise the perceived cost of a direct, face-to-face apology, so the two reforms in the scenario may each be defensible and jointly self-undermining. Candidates should have to say what this shows about evaluating a culture as a package versus evaluating a mechanism.

  Structure the question in two parts: a short application part worth about 8 marks, in which candidates must locate elements of the scenario within the typology and handle the composability problem; and an essay part worth about 17 marks, asking whether any one of the three cultures is morally superior and requiring candidates to state what would have to be true for their answer to change.

  Then give:

  (a) A model answer of about 700 words, written at the level of a strong seventeen-year-old rather than a journal article. It must take a determinate position rather than surveying options, and it must disambiguate morally superior into at least two distinct axes, since I suspect most of the disagreement in our club comes from people answering different questions without noticing.

  (b) A marking scheme built around five must-hit points, with the marks each is worth summing to 25, and for each point one line on how candidates typically get it wrong. The scheme must name the specific moves an A answer must contain and the specific moves that would hold an answer at a B, so that two markers would broadly agree. Please also state which single omission should cost the most marks and why.
reasoning: |-
  Okay, let me think through how to approach this complex philosophy exam question request. The user is clearly deeply engaged with the topic - a sixth-form student running their school's Philosophy Club who wants to create a sophisticated assessment on honour/dignity/victimhood cultures. 

  First, I need to understand the core challenge: designing a question that can't be answered by rote memorization. The user has provided excellent constraints - they want to test genuine understanding through a real-world school scenario involving an anonymous reporting app and restorative circles. The four conceptual points they want integrated (audience-reliability, standing-recovery, degeneration thesis, composability) are all substantive philosophical challenges.

  I'll approach this systematically in three stages as requested. For Stage 1 Diagnosis, I'm considering what superficial answers students might give: maybe relativism ("each culture suits different contexts"), checklist comparisons ("honour has courage but victimhood has equity"), or strawman attacks. These should be capped because they avoid the hard trade-offs in the scenario.

  For Stage 2 Crux, I'm weighing options: audience-reliability seems strongest because it forces engagement with epistemic justice - can a mechanism be morally superior if its effectiveness depends on third parties' virtue? This directly challenges victimhood culture's foundations. The composability crux is also tempting but might lead to pragmatic rather than moral analysis.

  The deliverables need careful construction. The question must embed the typology definitions since it's closed-book, and the scenario should present contradictions (reduced fights but increased reports, protection vs. status gaming). For the model answer, I'll argue that dignity has moral superiority but must address how its mechanisms can degenerate - this shows the self-critical thinking the user wants. The marking scheme should heavily penalize missing the audience-reliability point since it's central to evaluating moral claims.

  Throughout, I'm conscious this is for peer assessment among sixth-formers. The model answer needs philosophical rigor but accessible language, avoiding jargon. The marking scheme must be explicit enough for student markers to apply consistently, hence specifying concrete moves like "must state two distinct axes for moral superiority" rather than vague qualities.
answer: |-
  Here is a meticulously constructed exam question, model answer, and marking scheme based on your specifications. It addresses your scenario and integrates the four complex ideas while demanding critical argument over rote learning.

  ---

  ### Stage 1 — Diagnosis (Likely Summary Responses)
  1.  **"Each culture has strengths/weaknesses; context determines suitability."**  
      *Why summary?* Merely lists attributes (e.g., "honour promotes courage, dignity promotes equality") without engaging with *moral justification* or the scenario’s tensions.  
  2.  **"Victimhood culture protects the vulnerable; honour culture is outdated/violent."**  
      *Why summary?* Asserts value judgments as self-evident truths, ignoring the *audience-reliability condition* or *degeneration thesis* evident in the scenario.  
  3.  **"Dignity culture is superior because it relies on law/rights, not violence or complaints."**  
      *Why summary?* Fails to interrogate how dignity’s mechanisms can *degenerate* into victimhood (e.g., reporting-as-status-competition) or clash with restorative practices (*composability*).  
  4.  **"The school has a victimhood culture now because of the app."**  
      *Why summary?* Labels the scenario without analyzing how *honour dynamics persist* (reporting as "defeat," status competition) or whether mechanisms *regenerate* a different culture.

  ---

  ### Stage 2 — Crux (Candidate Core Challenges)
  1.  **Crux: Audience-Reliability & Moral Responsibility**  
      *Does it separate understanding?* Yes. Requires analyzing if a culture’s moral worth depends on external factors (audience bias) it cannot control, and whether unreliability is a *flaw* or *misfortune*. Memorizers cannot handle this nuance.  
  2.  **Crux: Degeneration vs. Moral Essence**  
      *Does it separate understanding?* Yes. Forces candidates to distinguish a culture’s *idealized principles* from its *degenerate forms* (e.g., victimhood as "honour without fists"). Memorizers conflate the two.  
  3.  **Crux: Standing-Recovery & Non-Composability**  
      *Does it separate understanding?* Partially. While memorizers might note "no way back," they’ll struggle to link it to *composability* (e.g., how anonymous reporting undermines face-to-face apology).  

  **Selected Crux: Audience-Reliability & Moral Responsibility.** It directly challenges claims of moral superiority by exposing a structural vulnerability in victimhood culture, forcing engagement with moral luck and epistemic justice.

  ---

  ### Stage 3 — Deliverables  
  #### The Question Paper (Excerpt)  
  **SECTION B: SOCIAL PHILOSOPHY**  
  **Answer ONE question.**  

  **1.** A school introduced an anonymous reporting app (handled externally) and mandatory restorative circles for reported incidents. Physical fights decreased, but formal reports increased fivefold. Some reports involve off-campus online activity. Teachers note students now refuse face-to-face apologies, saying "put it in the app." Counsellors observe some students are frequently reported, and being reported is seen as a "defeat." Parents complain boys are taught to "inform, not stand up." Older girls say the app protects them from dismissed "drama."  

  **Key terms for this question:**  
  - **Honour Culture:** Status is publicly contested; insults demand personal retaliation; standing is restored through ritual (e.g., apology, duel).  
  - **Dignity Culture:** Status is inherent; insults are ignored or resolved via formal institutions; standing is maintained by self-restraint.  
  - **Victimhood Culture:** Status derives from perceived victimization; harm is validated by recruiting third parties (e.g., authorities, public); standing is lowered by accusations.  

  **(a)** Using the scenario and typology, explain how the reporting app might undermine restorative circles. (8 marks)  
  **(b)** Can any one of these cultures be morally superior to the others? In your answer, you must:  
  - State what would have to change for your answer to be wrong;  
  - Address whether a culture relying on third-party audiences can be superior if those audiences are unreliable;  
  - Consider whether a culture allowing no routine recovery of standing can be just;  
  - Discuss whether apparent victimhood dynamics might regenerate honour competition.  
  *(17 marks)*  

  ---

  #### Model Answer (Approx. 700 words)  
  **Part (a):** The anonymous reporting app and restorative circles clash because they assume incompatible cultural logics (*composability problem*). The app operates on a victimhood logic: harm is validated by appeal to an external authority (the charity), making third-party recognition the primary mechanism. Restorative circles, however, require a dignity or honour logic: they demand direct, personal accountability and dialogue to reaffirm shared norms. The app discourages face-to-face resolution ("put it in the app"), eroding the mutual recognition needed for circles to function. By outsourcing validation, the app makes public apology seem unnecessary or risky, undermining the circle’s goal of restoring relationships through personal accountability.  

  **Part (b):** Dignity culture is morally superior to honour and victimhood cultures on two axes: **respect for agency** and **institutional fairness**. However, this superiority depends on institutions resisting degeneration into victimhood dynamics.  

  **Respect for agency:** Dignity culture treats individuals as capable of self-control and rational conflict resolution (e.g., ignoring slights or using courts). Honour culture demands aggression to defend status, sacrificing autonomy to social pressure. Victimhood culture, while aiming to protect the vulnerable, risks reducing agency by making validation dependent on third parties. If audiences are biased or unreliable (*audience-reliability condition*), victims cannot reliably assert moral claims – their agency is constrained by others’ judgments. Unreliability isn’t just bad luck; it is a *moral defect* when systems incentivize appeal to audiences without ensuring their fairness.  

  **Institutional fairness:** Dignity relies on impartial institutions to uphold rights. Honour permits vigilantism, lacking procedural justice. Victimhood, especially with anonymous reporting and no formal findings, creates a *standing-recovery problem*. Accused individuals (like those called "defeated" in the scenario) have no routine path to clear their name, risking unjust stigma. Unlike honour’s ritual apologies or dignity’s presumption of innocence, this asymmetry is unjust: punishment without due process.  

  The school’s dynamics show how dignity can degenerate. Reporting becomes a status weapon ("defeat"), regenerating honour competition (*degeneration thesis*). But this reflects flawed *implementation*, not dignity’s core principles. True dignity requires robust institutions that prevent such gaming.  

  **For my answer to be wrong:** Dignity would lose superiority if institutions *inevitably* degenerate under pressure (e.g., if anonymity always breeds status competition), or if audience-reliability defects proved *insurmountable* in victimhood (making it inherently unstable). However, well-designed institutions can mitigate these risks, preserving dignity’s moral edge. Victimhood might protect the vulnerable where institutions fail, but its reliance on unreliable audiences makes it inherently precarious. Honour’s emphasis on personal courage has value but is morally outweighed by its violence and coercion. Thus, dignity remains superior when institutions function as intended.  

  ---

  #### Marking Scheme (25 Total)  
  **PART (a): Application & Composability (8 marks)**  
  - **2 marks:** Identifies app as victimhood logic (third-party validation).  
  - **2 marks:** Identifies restorative circles as dignity/honour logic (direct accountability).  
  - **4 marks:** Explains clash: app *undermines* circles by discouraging face-to-face engagement, making third-party validation primary.  
  *Typical error (caps at 4/8):* Describes both mechanisms but doesn’t show *how* they conflict.  

  **PART (b): Moral Superiority Essay (17 marks)**  
  **Must-hit points (A-grade requires all):**  
  1.  **[4 marks] Disambiguates "morally superior" into TWO distinct axes** (e.g., agency, fairness, wellbeing). *Typical error (B-grade cap):* Uses one vague axis ("fairness" without definition).  
  2.  **[5 marks] Audiences & Moral Luck:** Argues whether audience-reliability is a *moral defect* (not bad luck) by linking reliability to agency/justice. *Typical error:* Notes unreliability but doesn’t assess its *moral implications*. **▶ Highest weight: Omitting this caps essay at 12/17.**  
  3.  **[3 marks] Standing-Recovery Test:** Evaluates if no path to restore standing (e.g., after anonymous reports) undermines justice claims. *Typical error:* Only observes "no way back" without moral analysis.  
  4.  **[3 marks] Degeneration Thesis:** Discusses if victimhood dynamics in the scenario regenerate honour competition. *Typical error:* Labels the culture without analyzing *persistence* of honour logic.  
  5.  **[2 marks] Counterfactual Test:** States specific conditions under which their conclusion would change (e.g., "if institutions always degenerate"). *Typical error:* Vague or absent counterfactual.  

  **Grade Boundaries:**  
  - **A (21–25):** Hits all 5 must-hit points; coherent argument; uses scenario.  
  - **B (16–20):** Misses 1 must-hit point (usually #2 or #5); some summary/repetition.  
  - **C (11–15):** Misses 2 must-hit points; heavy summary; weak scenario use.  
  - **D (6–10):** Describes typology/scenario only; no moral argument.  
  - **E (0–5):** Unrelated or fragmentary.  

  **Capping Mechanism:** An answer describing the three cultures and the scenario, concluding "each has strengths/weaknesses" or "context matters" without engaging moral axes, audience-reliability, or degeneration **scores max 11/25** (C-grade cap). Specifically: Part (a) max 4/8 (if composability noted); Part (b) max 7/17 (if typology/scenario described but no argument).  

  ---

  This design forces candidates to grapple with moral philosophy’s applied tensions, not just taxonomies. The marking scheme explicitly rewards disambiguation, moral luck analysis, and counterfactual reasoning while penalizing descriptive summaries. The scenario integration ensures answers must engage your four key ideas concretely.
