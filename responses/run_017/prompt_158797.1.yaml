answer: |-
  Here's the argument that doubly inert disputes are substantive, targeting your specified concerns:

  **The Argument from Fixed Semantics and Mind-Independence**

  1.  **Shared Semantic Foundation:** Condition (2) is crucial. Both parties explicitly fix the quantifier’s meaning as the "maximally joint-carving" one and agree *this* is the sense that matters for ontology. This precludes quantifier variance (Hirsch) or metalinguistic negotiation (Chalmers) *by stipulation*. They are not talking past each other semantically; they share a single, privileged target concept – existence-as-jointly-carving.
  2.  **Contradiction on a Mind-Independent Matter:** Given the shared semantic target, their disagreement ("There are composites" vs. "There are no composites") is a direct contradiction about the *structure of reality itself*. The universalist asserts that reality, at its most fundamental level of "carving," includes composite entities given the arrangement of simples. The nihilist denies this. Condition (1) ensures they agree completely on the base facts (the simples and their arrangements), yet they draw opposing conclusions about what *exists* in the joint-carving sense *based on those same facts*. This disagreement is about an objective feature of the world – what the maximally natural structure encompasses – not about language or pragmatics.
  3.  **Against Deflationism (Hirsch):** While the dispute has no empirical or practical consequences (Conditions 3 & 4), this doesn't entail it lacks substance. Substance concerns *what is the case*, not merely practical impact. The disagreement is about a fundamental aspect of reality's structure – what joint-carving categories there are. That this structure, once described via N and the quantifier, has no further downstream effects within N doesn't make the claim about the structure itself any less factual. It’s a brute metaphysical difference.
  4.  **Against Neutral-Vocabulary Resolution (Chalmers):** Agreement on all N-sentences (Condition 1) doesn't resolve the dispute precisely because existence claims ("There are Fs") *cannot be reduced to or fully captured by* N-sentences. N, by definition, excludes ontological vocabulary. The parties agree on the distribution and behavior of simples (stated in N), but disagree on the *ontological implication*: does this distribution constitute the existence of composites? N lacks the resources to express this implication. Therefore, agreement on N does not constitute agreement on all facts; the ontological fact remains contested.
  5.  **Why No Overgeneration:** Plainly verbal disputes involve either *equivocation* (different meanings for the same word, like "bank") or *merely conventional classification* ("is a tomato a fruit?"). In the doubly inert case, *by construction*, there is no equivocation (Condition 2 fixes the quantifier meaning uniquely) and the dispute isn't about convention (it's about what the joint-carving structure *is*, not how we label it). "Fruit" is a biological/culinary concept tied to human interests; "joint-carving existence" is stipulated to be a mind-independent metaphysical notion. The doubly inert dispute targets the latter.

  **Bottom Line:** A dispute fixed on a shared, privileged metaphysical concept of existence and concerning a direct contradiction about reality's fundamental structure remains substantive even if that structure's description has no further empirical or practical consequences within the agreed-upon base language. \answer{fixed-metaphysical-target}
