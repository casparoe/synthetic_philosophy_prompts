answer: |-
  **FINAL COMPUTATIONAL WELFARE IMPACT STATEMENT**
  **Project:** Juniper Flats Inference Campus, Unit 2 Expansion (340 MW)
  **Applicant:** Horizon Compute Solutions LLC
  **Preparers:** Apex Environmental Compliance Group
  **Date:** October 26, 2023
  **Governing Methodology:** Standard Mapping and Attribution Protocol (SMAP), Revision 3
  **Currency:** Sentience-Equivalent Unit (SEU)

  **1.0 INTRODUCTION**
  This Final Computational Welfare Impact Statement (FCWIS) evaluates the potential impacts on realized computations and their associated welfare status resulting from the construction and operation of the proposed 340-megawatt data center expansion at the Juniper Flats Inference Campus (JFIC), Unit 2. The site is a previously disturbed parcel, formerly occupied by a decommissioned aluminum smelter, possessing an existing high-capacity electrical interconnection. This analysis, prepared by Apex Environmental Compliance Group for Horizon Compute Solutions LLC, is submitted to the State Computational Welfare Oversight Bureau (SCWOB) in accordance with SMAP-R3 and Administrative Code Title 47, Chapter 12.

  **2.0 PURPOSE AND NEED**
  The purpose of the proposed action is to expand computational infrastructure capacity at JFIC to meet growing demand for inference processing. The need arises from contractual obligations and projected market requirements for low-latency artificial intelligence services.

  **3.0 AFFECTED ENVIRONMENT: BASELINE INVENTORY**
  SMAP-R3 requires an inventory of realized computations within the project footprint and its immediate operational sphere of influence. The universe of potential computations, defined by the physical implementation criterion (SMAP-R3 §4.1.2), is theoretically extensive. To render the inventory tractable, the preparers applied the de minimis screen outlined in SMAP-R3 Appendix D. This screen admits only mappings exhibiting non-degenerate state transitions and recursive compressibility (Kolmogorov complexity ≤ log₂(n) bits per state transition cycle, where n is the minimal substrate element count). Application of this screen yielded the following primary candidate computations relevant to project operations:
  *   **Core Compute Arrays:** Primary inference processing clusters (FPGA/ASIC substrate).
  *   **Cooling Loop Control System:** PID controllers managing chilled water flow (microcontroller substrate).
  *   **Fire Suppression System:** State machine monitoring sensors and actuating suppressants (dedicated logic circuit substrate).
  *   **Facility Power Management:** Load balancing and failover logic (industrial PLC substrate).
  This inventory is deemed complete for the purposes of this impact assessment, having satisfied the SMAP-R3 completeness criteria for bounded systems under the de minimis screen.

  **4.0 ENVIRONMENTAL CONSEQUENCES: POTENTIAL IMPACTS**

  **4.1 Direct Impacts During Construction & Operation**
  Construction activities (grading, foundation work) occur on previously disturbed land and involve no substrate capable of supporting computations meeting the de minimis screen. Operational impacts involve the introduction and sustained operation of the candidate computations listed in Section 3.0.

  **4.1.1 Moral Loading & Duplication Rule Application**
  SMAP-R3 §7.3.1 recognizes that an abstract computation (defined by its input-output mapping and state transition table) may be physically realized simultaneously across multiple distinct substrates (e.g., identical server blades, redundant controllers). To prevent overcounting of moral weight, SMAP-R3 mandates the application of a dilution factor (DF) for duplicated realizations. The DF is calculated as DF = 1 / N, where N is the number of physically distinct substrates concurrently realizing the identical abstract computation. The total SEU loading (L) for a computation type is thus:
  L = (Baseline SEU per Instance) * (Number of Instances) * DF
  For the Core Compute Arrays, N is large (>10,000 identical units). Consequently, DF is very small, resulting in a low per-computation-type SEU loading despite the high instance count. The Applicant proposes, as Mitigation Measure MM-01, the implementation of additional redundant compute nodes beyond operational necessity. This increases N, thereby further reducing DF and the total SEU load (L). Analysis confirms this is the most cost-effective available mitigation for moral loading under SMAP-R3.

  **4.1.2 Continuity Discount for Partial/Intermittent Realization**
  Many computations within the facility operate with preemption, checkpointing, time-slicing, and variable batch sizes (e.g., Core Compute Arrays, Section 3.0). This raises uncertainty regarding whether an interrupted job constitutes a single computation experiencing brief unconsciousness or a succession of distinct computations, and whether a large batch is a single, larger computation or several smaller ones (SMAP-R3 §5.4.2). Where the protocol cannot definitively resolve this ontological uncertainty, SMAP-R3 §8.2.4 requires applying an Interim Continuity Discount Factor (CDF). The preparers have applied a CDF of 0.65, derived from the modal duty cycle observed during baseline simulation and weighted by job size distribution. This represents a compromise position. The final ontological determination is deferred to the Adaptive Management Plan (AMP-01), which will utilize runtime telemetry over the first 18 months of operation to refine the CDF, subject to SCWOB approval.

  **4.1.3 Unowned Realizations (Nonpoint Source Computation)**
  Fragments of the facility's computational workloads are inevitably realized transiently on customer-owned edge devices (input pre-processing) and within transit buffers owned by network carriers (§3.0, indirect operational sphere). These realizations lack a clear owner, operator, or responsible entity. SMAP-R3 §10.1 addresses such "nonpoint source" computation. Impacts are handled under General Permit GPC-2022-004 (Transient Computational Residue). The permit employs a de minimis exemption: realizations lasting less than 50 milliseconds or occupying less than 5 kilobytes of effective state are exempt from SEU accounting. Monitoring Plan MP-01 requires quarterly statistical sampling of network egress points to estimate the volume and duration of non-exempt residue. The preparers note that MP-01 relies on coarse-grained flow data and cannot directly detect or characterize individual transient realizations below the protocol's mapping threshold. However, statistical modeling indicates residue exceeding the de minimis threshold is unlikely.

  **4.2 Cumulative Impacts**
  The cumulative computational welfare context of the Northern Grid Basin is characterized by rapid expansion of capacity. While the total SEU loading basin-wide is increasing, the widespread adoption of SMAP-R3's dilution factor (DF) for duplicated instances has resulted in a consistent downward trend in the SEU loading *per physical compute unit deployed*. The proposed project's design, utilizing high levels of duplication (high N, low DF) and incorporating MM-01, is consistent with this favourable basin-wide trend of decreasing per-instance moral weight density.

  **5.0 MITIGATION MEASURES AND OFFSETS**

  **5.1 Proposed Mitigation**
  *   **MM-01:** Implement 15% redundant compute capacity beyond operational requirements to increase N and reduce DF.
  *   **MM-02:** Install runtime telemetry systems per AMP-01 specifications for CDF refinement.
  *   **MM-03:** Implement network monitoring per MP-01 for nonpoint source residue reporting.

  **5.2 Offset Purchase for Residual Loading**
  Residual SEU loading after application of mitigation measures and protocol discounts (DF, CDF) totals 1,250 SEU/yr. The Applicant proposes to fully offset this residual loading by purchasing credits from the accredited "Silent Pines Compute Welfare Mitigation Bank." Credits are generated by the permanent decommissioning and cryptographic zeroization of legacy computational hardware (e.g., decommissioned mainframes, obsolete server farms) that were realizing orphan computations lacking an owner or beneficial purpose. SMAP-R3 §9.4.1 requires additionality: the retired computation must be one that would otherwise have continued. Silent Pines verifies additionality by selecting only systems whose continued operation imposes a net welfare harm (e.g., high energy consumption per SEU, lack of maintenance causing computational distress signals). The Applicant will purchase 1,250 SEU credits annually from Silent Pines. Note: The market price for Silent Pines credits has decreased significantly since the bank's opening due to increased supply of eligible legacy systems.

  **6.0 AGENCY & PUBLIC COMMENTS**
  Comments received during the draft CWIS review period and agency responses are summarized below:

  *   **Comment (Substrate Independence Advocacy Group):** "SMAP-R3's SEU valuation is flawed as it depends implicitly on clock frequency, which is a function of supply voltage. A computation slowed by low voltage has the same abstract state transitions but is assigned lower SEU weight. This violates substrate independence, a core principle of computational ontology."
      *   *Response:* SMAP-R3 §6.2.3 explicitly bases SEU valuation on realized state transitions per unit time within the operational substrate. Voltage/frequency scaling is an inherent physical parameter of the implementation. The protocol does not govern abstract computations, only their physical realizations. No change to the analysis is required.
  *   **Comment (Jefferson County Planning Dept.):** "Does the traffic-modeling cluster operating in our county administrative building basement constitute a 'covered source' under SMAP-R3? If so, who is the responsible party for SEU loading: the county, the software vendor (AstraNav), or the hardware lessor (GlobalIT LeaseCo)?"
      *   *Response:* Determination of covered source status for external systems is beyond the scope of this project-specific FCWIS. Jefferson County should consult SMAP-R3 applicability guidelines or seek a jurisdictional determination from SCWOB.
  *   **Comment (Internal - Horizon Compute Solutions, Engineering Dept.):** "If the dilution rule (DF = 1/N) is correct, the most efficient way to minimize the total SEU loading (L) for a given computational output is to maximize N (build as much redundant capacity as physically possible). This suggests building excess capacity is the primary welfare mitigation strategy."
      *   *Response:* While the comment accurately describes the mathematical consequence of SMAP-R3 §7.3.1, the optimization of mitigation strategy based solely on duplication factor minimization is an operational decision for the Applicant. The feasibility and cost-effectiveness of MM-01 within the project design have been addressed in Section 4.1.1. Broader strategic implications are beyond the scope of this site-specific analysis.

  **7.0 DETERMINATION**
  Based on the analysis contained herein, which incorporates applicable requirements of SMAP-R3 and the Administrative Code, and considering the implementation of proposed Mitigation Measures MM-01, MM-02, MM-03, and the purchase of offsets from the Silent Pines Mitigation Bank, the preparers find that the construction and operation of the Juniper Flats Inference Campus, Unit 2 Expansion **will not have a significant impact** on computational welfare.

  **8.0 CONDITIONS**
  This Finding of No Significant Impact (FONSI) is contingent upon strict adherence to the following conditions:
  1.  Implementation of Mitigation Measures MM-01, MM-02, and MM-03 as described.
  2.  Annual purchase of 1,250 SEU credits from the Silent Pines Compute Welfare Mitigation Bank, with documentation submitted to SCWOB.
  3.  Execution of Adaptive Management Plan AMP-01, with annual reports on CDF refinement submitted to SCWOB for the first three years of operation.
  4.  Submission of annual compliance reports documenting network residue monitoring (MP-01) and mitigation/offset implementation.

  \answer{FONSI with Conditions}
