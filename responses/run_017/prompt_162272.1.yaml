  We are given four cases to translate Hofstadter's superrationality into the vocabulary of distributed systems and game theory. The goal is to be faithful to the original concept while identifying what translates cleanly, what requires additional assumptions, and what has no counterpart.

  ### Core Concept of Superrationality
  Hofstadter's superrationality (as presented for the one-shot Prisoner's Dilemma) has two key elements:
  1. **Commonality of reasoning**: All superrational players, being identical and facing the same problem, will reason to the same conclusion. Therefore, each player can assume that whatever strategy they choose, all others will choose the same.
  2. **Maximization conditional on commonality**: Each player, taking the above as given, then chooses the strategy that, if adopted by all, yields the best outcome for themselves (and by symmetry, for all).

  This leads to cooperation in the Prisoner's Dilemma because (C,C) yields a better payoff for each than (D,D), and the superrational player does not consider asymmetric outcomes.

  ### Case 1: Two-Player Prisoner's Dilemma (PD)

  **Translation**:
  - The players are identical and anonymous, running the same deterministic algorithm. The algorithm must output a strategy (C or D) for the PD.
  - The key idea is that the algorithm must be such that, when run by both players (with access to each other's source code, as in program equilibrium), they both output the same action and that action is C.
  - In program equilibrium, each program takes the source code of the other as input. A fixed point is required: if both programs are identical (by symmetry), then they must output the same action. The program that always cooperates (FairBot) is such a fixed point and is stable in the sense that if both run FairBot, they both cooperate and get the cooperative payoff.
  - However, note that a program that always defects is also a fixed point. But Hofstadter's superrationality selects the cooperative outcome because it is better for both. This selection is done by the maximization step: the superrational player, when considering what strategy to adopt, sees that if all adopt C, then they get (R,R) which is better than (P,P) if all adopt D. Therefore, they choose C.

  **In target vocabulary**:
  - Cleanly: The superrational profile (C,C) is a program equilibrium. The fixed-point condition (both running the same program and getting the same output) is captured by the symmetry and the fact that the algorithm is deterministic and identical for both. The argument that they both choose C is because the algorithm is designed to maximize the payoff conditional on symmetry. Specifically, we can design a program that, when given the same program as input, cooperates. This is exactly what FairBot does: it cooperates if the other program is identical to itself (or more generally, if it can prove that the other program will cooperate with it). 
  - Assumption imported: The selection of the cooperative fixed point over the defective one requires an explicit maximization step that is not inherent in the fixed-point condition. In the program equilibrium setting, one must design the program to cooperate when it sees an identical program (or one that is similarly cooperative). Without this design, the defective equilibrium might be chosen. Hofstadter's maximization step is built into the program's reasoning: it is as if the program considers the possible symmetric outcomes and picks the one with the highest payoff. This is an additional normative assumption that we must import.
  - No counterpart: The idea that the player "fixes the shared strategy before maximizing" is a form of precommitment to a symmetric strategy. In program equilibrium, the program is fixed in advance and then run. This matches cleanly.

  **Conclusion for Case 1**: The translation is clean, with the note that the selection of the cooperative equilibrium requires an explicit maximization step that is part of the program's design.

  ### Case 2: n-Player Lottery (Symmetric Version)

  **Setup**: Each player independently decides whether to send a message. The prize is awarded only if exactly one player sends. In the symmetric case, all players are identical and the prize has the same value to each.

  **Superrational solution**: Each player sends with probability 1/n. Then the probability that exactly one sends is n * (1/n) * (1-1/n)^(n-1) ≈ 1/e, and each player gets the prize with probability (1/n) * (1-1/n)^(n-1) ≈ 1/(e n). However, note that if they all send with probability 0, then no one gets the prize (payoff 0), and if they all send with probability 1, then again no one gets the prize. The symmetric mixed strategy with p=1/n is the one that maximizes the expected prize for each player, conditional on all using the same strategy.

  **Translation**:
  - Each player runs the same randomized algorithm that outputs "send" with probability p and "not send" with probability 1-p. The symmetry requires that they all use the same p.
  - The algorithm must choose p to maximize the expected prize for a player, given that all others use the same p. This is a standard maximization problem: the probability that a given player wins is p * (1-p)^(n-1). Maximizing this with respect to p gives p = 1/n.
  - In the vocabulary of anonymous networks, this can be seen as a one-round randomized leader election. Each node (player) flips a biased coin with p=1/n to decide whether to send. The election is successful (exactly one sends) with probability about 1/e. This is a well-known symmetry-breaking method in anonymous networks.

  **In target vocabulary**:
  - Cleanly: The solution is exactly the same as the randomized leader election in anonymous networks: each node independently decides to be a candidate with probability 1/n. The symmetry of the players and the requirement of a common strategy (same p) are captured. The maximization of the success probability (or individual expected payoff) leads to p=1/n.
  - Assumption imported: The superrational argument requires that all players use the same mixed strategy and that they choose the one that maximizes the symmetric expected payoff. This is an additional coordination requirement: they must coordinate on the symmetric mixed strategy that is optimal. In the distributed setting, the algorithm is fixed in advance and all nodes run the same, so this is built in. However, the argument for why they choose p=1/n is a maximization step that is imported.
  - No counterpart: The idea that each player is randomizing independently but with the same probability is standard. However, note that in the distributed setting, the randomness is independent and there is no shared coin. The superrational argument does not require a shared coin, so that is good. But the fact that the independent randomness leads to a positive probability of success is already captured.

  **Conclusion for Case 2**: The translation is clean. The solution is a standard symmetry-breaking method in anonymous networks. The only import is the maximization step to choose the specific p.

  ### Case 3: Asymmetric Lottery (Distinct Values)

  **Setup**: Each player i has a distinct prize value v_i > 0, and these are known to all. Each player runs the same decision procedure, which takes as input the player's index i and the vector v = (v_1, ..., v_n). The goal is to decide whether to send or not. The payoff for player i is v_i if she is the only one who sends, and 0 otherwise.

  **Challenge**: Because the players are no longer symmetric (they have different v_i), the superrational argument that they will all choose the same strategy breaks down. However, Hofstadter's superrationality would require that they all run the same algorithm, which has access to the index and the vector. The algorithm must be symmetric in the sense that it is the same function for every player, but it can use the index and the vector to decide.

  **Superrational approach**:
  - Each player, being superrational, assumes that all players are running the same algorithm and therefore will arrive at the same decision rule. But because the players have different v_i, they cannot all choose the same action (send or not) in every instance. Therefore, the algorithm must be a function of (i, v) that outputs a probability of sending (or a deterministic action) in a way that is symmetric in the sense that the function is the same for every player.
  - The maximization step: they must choose a decision rule (a function f(i, v)) that, when used by all players, maximizes the expected payoff for each? But note: if the function f is the same for all, then for a given v, the function must assign actions to each player. However, the players have different v_i, so the function f might assign different actions. The problem is that the superrational player, when choosing the function f, must consider that for every player j, the action of j is f(j, v). Then, the expected payoff for player i is:
      E_i = f(i, v) * [product_{j≠i} (1 - f(j, v))] * v_i
  - But the superrational player must choose the function f that maximizes E_i for themselves? However, note that by symmetry of the function (f is the same for all), the function f must be chosen to be "fair" in some sense. But the player with a high v_i would prefer a function that makes them send with high probability and others with low, but the player with a low v_i might prefer the opposite.

  **The problem of selection**: The original Hofstadter maximization step becomes ambiguous. What is being maximized? There are several possibilities:
  1. **Utilitarian**: Choose f to maximize the sum of expected payoffs.
  2. **Egalitarian**: Choose f to maximize the minimum expected payoff.
  3. **Nash bargaining**: Choose f to maximize the product of expected payoffs (or some other bargaining solution).
  4. **Maximin**: Choose f to maximize the minimum payoff that any player gets in the worst case.

  But note: the superrational player is supposed to choose the function f that, if adopted by all, yields the best outcome for themselves. However, because the players are asymmetric, what is best for one might not be best for another. Therefore, the function f must be chosen such that it is acceptable to all.

  **Translation**:
  - In program equilibrium, each player runs the same program that takes as input the entire vector v and the index i. The program then outputs an action for player i. The program is a function f(i, v).
  - The condition for program equilibrium is that the function f is such that no player would want to change the function (given that others are using it) but note that the function is the same for all. However, because the players are asymmetric, they might have conflicting preferences over f.
  - The folk theorem for program equilibrium says that any feasible and individually rational payoff profile can be realized. But here, we are in a one-shot game with no repeated interactions, and the program equilibrium can implement a correlated strategy. However, the symmetry requirement on the program (all run the same code) forces the correlated strategy to be symmetric in the program, but not necessarily in the outcomes.

  **What can be implemented?** The program can use the vector v and the index i to assign actions. For example, it could assign the player with the highest v_i to send with probability 1 and the others with 0. Then the player with the highest value wins with probability 1 (if there are no ties and if the program breaks ties consistently). But note: the program must be the same for all. How does it break ties? It must have a canonical way to assign the roles. For example, it could assign the player with the highest index (if indices are ordered) to be the one to send. But then the index becomes an arbitrary identifier.

  **Canonicalization**: The program must use the inputs (i and v) to break symmetry. The problem is that the vector v is symmetric in the sense that it is the same for all players (they all see the entire vector) and the indices are distinct. The program can use the indices to break symmetry arbitrarily. But then the outcome is that the player with the highest index (or the one with the highest v_i) is chosen to be the sender. However, note that the players have different v_i so they might not agree on who should be favored. The program must choose a canonicalization rule.

  **Maximization step in superrationality**: How would a superrational player choose the function f? The original Hofstadter step is: I choose the function f that, if adopted by all, will give me the best outcome. But if I am the player with the highest v_i, I would want f to assign me to send with probability 1 and others 0. But if I am a player with a low v_i, I would want to have a chance. However, the function f must be the same for all. Therefore, each player, when contemplating the choice of f, must realize that f must be chosen without knowing which player they are? That is, they must choose f behind a veil of ignorance? Hofstadter does not explicitly say this, but it is a natural extension.

  **Veil of ignorance**: The superrational players, when choosing the function f, do not know which index they will be assigned. They choose f to maximize their expected payoff under the assumption that they are equally likely to be any player. Then, they choose f to maximize the average expected payoff (which is the same as the sum of expected payoffs divided by n). This is a utilitarian solution with equal weights.

  **In target vocabulary**:
  - Cleanly: The requirement that the same function f is used by all players is captured by the program being identical. The function f can use the index and the vector to make decisions. The program equilibrium can implement this function f. The veil of ignorance argument (maximizing the average expected payoff) is a specific way to choose f. However, note that this is an additional assumption that must be imported.
  - Assumption imported: The veil of ignorance is not part of the original superrationality. We are importing it to resolve the selection problem. Without it, there is no clear way for the players to agree on a function f. The program equilibrium framework is permissive: it allows any function f that is a fixed point (i.e., no player wants to unilaterally change their program). But with identical programs, the only way to change is for all to change. Therefore, the equilibrium condition is that the function f must be such that there is no other function g that, if adopted by all, would make every player better off (or at least one better off without hurting others). This is a Pareto optimality condition. However, there are many Pareto optimal functions. The veil of ignorance selects one particular one (the one that maximizes the average expected payoff). But note: the original Hofstadter maximization step was from the perspective of a player who knows their identity. We are changing that by introducing the veil of ignorance.
  - No counterpart: The idea of choosing a function f behind a veil of ignorance is not part of the standard program equilibrium. The program equilibrium framework does not specify how the program is chosen; it only requires that the program is a fixed point. The veil of ignorance is a normative principle for selecting the function.

  **Conclusion for Case 3**: The translation requires importing the veil of ignorance assumption to select the function f. Without it, the superrational approach does not specify which function to choose. The program equilibrium framework can implement any chosen f, but it does not select among them.

  ### Case 4: Perturbations

  **Perturbation 1: Private distinct labels (with no payoff relevance)**

  **Setup**: Each player is privately handed a distinct label (from a known set) adversarially. The labels are arbitrary and carry no payoff information. The prize values are symmetric (or if asymmetric, the labels do not correlate with values). 

  **Question**: Can superrationality use these labels to break symmetry without ceasing to be superrational?

  **Translation**:
  - The players run the same algorithm, which now takes as input the player's private label and possibly the vector of prize values (if asymmetric) or nothing (if symmetric). The labels are distinct and arbitrary.
  - In the distributed systems vocabulary, the labels are unique identifiers (UIDs) and can be used to break symmetry. For example, in the symmetric lottery, they can run a deterministic leader election: the player with the highest UID sends, and the others do not. This ensures that exactly one sends (if they can agree on an ordering). In the asymmetric lottery, they can use the UIDs to break ties if needed (e.g., if two players have the same v_i, then use the UID to choose one).
  - However, the superrational player must still run the same algorithm. The algorithm can use the UID to assign roles. This is similar to using the index in Case 3, except that the UID is arbitrary and not necessarily ordered. But the algorithm can impose an order (e.g., lexicographic) on the UIDs.

  **Superrationality**: The use of UIDs does not violate superrationality because the players are still running the same algorithm. The algorithm uses the UID to break symmetry. The maximization step: in the symmetric lottery, the deterministic solution (one player sends) is better than the randomized one because it has a success probability of 1 (if the UIDs are distinct and the algorithm is deterministic). Therefore, the superrational player would choose the deterministic algorithm that elects the player with the highest UID to send. This yields an expected payoff of v/n for each player (if the assignment of UIDs is random and symmetric) but note: the UIDs are assigned adversarially. However, the algorithm is fixed and does not depend on the UID assignment. The payoff for a player depends on whether they are the one with the highest UID. If the UIDs are assigned arbitrarily, then the player with the highest UID gets v and the others get 0. But the superrational player, when choosing the algorithm, does not know which UID they will get. So again, behind a veil of ignorance, they would choose the algorithm that uses the UIDs to elect one player, because then each player has an equal chance (if the UIDs are assigned randomly) or at least they get an expected payoff of v/n (if the adversary assigns arbitrarily but the player does not know their UID). However, if the assignment is adversarial and the player knows that the adversary might assign the highest UID to someone else, then in the worst case they get 0. But if they use the randomized algorithm (p=1/n) then they get about v/(e n) in expectation. The deterministic algorithm with UIDs is better in expectation if the assignment is random, but worse in the worst case.

  **In target vocabulary**:
  - Cleanly: The use of UIDs to break symmetry is standard in distributed systems. The algorithm can be the same for all and use the UID to decide. This is captured.
  - Assumption imported: The choice between using the UIDs for a deterministic solution or ignoring them for a randomized solution requires a maximization step. The superrational player would choose the algorithm that gives the highest expected payoff behind the veil of ignorance. If the assignment of UIDs is random, then the deterministic algorithm gives an expected payoff of v/n, which is better than the randomized one (about v/(e n)). But if the assignment is adversarial, then the randomized algorithm might be better (because the adversary could assign the highest UID to someone else). Without knowing the assignment process, the players must assume the worst? Or they must have a prior? This is an additional assumption. The original superrationality does not specify how to handle uncertainty about the assignment.
  - No counterpart: The idea of using arbitrary labels that are assigned adversarially is standard. But the decision of which algorithm to use (deterministic vs randomized) in the face of uncertainty about the label assignment requires a decision under uncertainty that is not specified by superrationality.

  **Perturbation 2: Fraction q of superrational players**

  **Setup**: There are n players. A fraction q (known to all) are superrational, and the remaining (1-q) are ordinary expected-utility maximizers. The ordinary players know q and know that there are superrational players, but not which ones. The game is the lottery (symmetric or asymmetric).

  **Translation**:
  - This is similar to a Byzantine fault model: the superrational players are the "correct" processes that follow the same algorithm, and the ordinary players are faulty (Byzantine) in the sense that they may deviate arbitrarily to maximize their own utility. The ordinary players are rational and strategic.
  - The superrational players run the same algorithm. The ordinary players run no algorithm (or their own independent algorithms) and know the algorithm of the superrational players (because it is public knowledge that the superrational players are using a particular algorithm?).

  **Challenge**: The superrational players must choose an algorithm that takes into account that some players are not superrational. The algorithm for the superrational players might be designed to account for the presence of the ordinary players.

  **Example in symmetric lottery**:
  - Suppose the superrational players run the algorithm: send with probability p. The ordinary players, knowing p and knowing that the superrational players are using p, will choose their own strategy to maximize their own expected payoff. Since the ordinary players are symmetric among themselves? But note: the ordinary players know that they are ordinary, so they might coordinate? Actually, they are independent and non-cooperative.
  - An ordinary player will choose to send with probability q_i (which they choose optimally). But note: if an ordinary player sends with probability 1, then they might win only if no one else sends. But if there are many ordinary players, they might interfere with each other. The equilibrium for the ordinary players becomes a game among themselves and in response to the fixed strategy of the superrational players.

  **Superrational algorithm design**: The superrational players, when designing their algorithm, must anticipate the response of the ordinary players. They choose a symmetric strategy (all superrational players use the same p) that, given the best response of the ordinary players, maximizes the expected payoff for a superrational player.

  **In target vocabulary**:
  - Cleanly: The situation is analogous to a Byzantine agreement problem with a known upper bound on faults (f = (1-q)*n) but without knowing which are faulty. The superrational players are the correct processes that follow the protocol. The ordinary players are Byzantine and may behave arbitrarily. However, in this case, the Byzantine players are not malicious; they are rational and will follow a strategy that maximizes their own utility. This is a known model: Byzantine fault tolerance with rational faults. The design of the protocol (the strategy for the superrational players) must be such that it is resilient to the rational behavior of the others.
  - Assumption imported: The superrational players must model the ordinary players as rational agents and solve for the equilibrium of the game. This requires that the superrational players know the utility function of the ordinary players and that they can compute the equilibrium. This is a significant import of game-theoretic equilibrium analysis into the superrational framework. The original superrationality did not consider non-superrational players.
  - No counterpart: The program equilibrium idea does not extend cleanly because the ordinary players are not running the same program. The superrational players run the same program, but the ordinary players run different ones. Therefore, the fixed-point condition (each program seeing the others) is broken. The superrational players must design a strategy that is robust against the rational players, which is a standard game-theoretic problem.

  **Conclusion for Perturbation 2**: The translation requires importing a full game-theoretic model with both superrational and rational players, and solving for the equilibrium. The analogy to Byzantine faults is not exact because the Byzantine faults are typically assumed to be malicious, whereas here the ordinary players are rational. The standard Byzantine fault model does not capture rationality.

  ### Aggregate Residue Report

  **Residue**:
  - **Case 1 (PD)**: The residue is minimal. The translation is clean, but we must import the maximization step that selects the cooperative fixed point.
  - **Case 2 (Symmetric Lottery)**: The residue is minimal. The solution is standard in distributed systems. The import is the maximization step to choose p=1/n.
  - **Case 3 (Asymmetric Lottery)**: Significant residue. Without importing the veil of ignorance (or some other selection principle), the superrational approach does not specify a solution. The program equilibrium framework provides the mechanism but not the selection.
  - **Case 4 (Perturbations)**:
    - **Labels**: The use of labels is compatible, but the choice between deterministic and randomized algorithms requires additional assumptions about the assignment process and decision under uncertainty.
    - **Mixed population**: The residue is high. The superrational framework does not provide tools for interacting with non-superrational players. We must import a full game-theoretic equilibrium analysis.

  **Verdict**:

  Your suspicion is that superrationality is a coordination-and-selection principle presented as a constraint of rationality, and that once symmetry is broken, its content is revealed to be the added canonicalization. The translation supports this: in Cases 1 and 2 (symmetric) the translation is clean, but in Case 3 (asymmetric) we must add a selection principle (veil of ignorance). The residue in Case 3 is the need for a canonicalization rule, which is not provided by superrationality alone.

  However, arguing the other side: The residue might point to a gap in the target vocabulary. The target vocabulary (distributed systems and program equilibrium) is about what agents *can* jointly implement. It does not have a normative theory for what an agent *ought* to do when faced with a symmetric problem. Superrationality offers such a normative theory: it says that in symmetric games, you ought to choose the strategy that is best for you conditional on all others choosing the same. This normative dimension is missing in the target vocabulary. The program equilibrium framework implements the fixed point but does not say which fixed point is the "right" one. Hofstadter's superrationality does.

  Moreover, the veil of ignorance in Case 3 can be seen as an extension of the original idea: when symmetry is broken by external factors (like different prize values), the superrational agent should reason as if they are equally likely to be any player. This extends the normative principle to asymmetric games. The residue then marks a gap in the target vocabulary: it lacks a normative theory for program selection in the face of asymmetry.

  Therefore, the aggregate residue is the normative dimension of superrationality: the idea that rational agents in symmetric games should coordinate on the symmetric Pareto-optimal outcome. The target vocabulary provides the tools to implement such coordination (via program equilibrium) but does not prescribe it as a requirement of rationality.

  **Should the target vocabulary want this normative dimension?** 

  As a PhD student in distributed systems, you might be more concerned with what is implementable and what is not, and less with what rational agents ought to do. However, if you are designing agents that must act in one-shot interactions, then the normative dimension becomes important. The residue suggests that the current framework might benefit from incorporating a normative principle for symmetric games. This principle could guide the design of algorithms in anonymous networks when the goal is not just to break symmetry but to achieve a fair and efficient outcome.

  **Final Note**: The residue in the mixed-population case is particularly challenging. The target vocabulary (with Byzantine faults) does not account for rational behavior, and superrationality does not account for non-superrational players. This gap might require a new framework that combines program equilibrium with standard game theory for rational players.
answer: |-
  ### **Translation of Hofstadter's Superrationality into Target Vocabulary**  
  **Core Concept**: Superrationality posits that identical agents, facing a symmetric problem, assume their reasoning leads to a shared strategy. They maximize conditional on this universality, prioritizing symmetric outcomes over unilateral deviations. This aligns with:  
  - **Identical processes** in anonymous networks.  
  - **Program equilibrium** (Tennenholtz): Agents submit programs that read each other's source code, enforcing strategy symmetry.  
  - **Fixed-point reasoning**: Shared strategy arises from self-referential alignment, not negotiation.  

  ---

  ### **Case 1: Two-Player Prisoner's Dilemma (PD)**  
  **Scenario**: Cooperate (C) vs. Defect (D). Superrationality yields (C,C), as mutual C dominates mutual D.  
  **Translation**:  
  - **Clean**:  
    - (C,C) is a **program equilibrium**. Programs are identical (`FairBot`-like): if opponent's source code matches yours, output C.  
    - Matches **fixed-point condition** in anonymous systems: no unique ID → symmetric strategies enforced.  
    - **Self-reference**: Löb-style proof ensures mutual cooperation (if both reason identically, they prove mutual C is optimal).  
  - **Assumption Imported**:  
    - Selection of (C,C) over (D,D) requires **explicit Pareto-dominance check**. Hofstadter assumes agents maximize payoff *given symmetry*, but program equilibrium permits multiple fixed points (e.g., mutual defection). We import **Pareto-efficiency as a selection criterion**.  
  - **No Counterpart**:  
    - Superrationality’s claim that (C,C) is the *only rational* outcome. In game theory, (D,D) is Nash; in distributed systems, Byzantine faults may force defection. Superrationality rejects these as "non-superrational."  

  **Residue**: Minimal. Pareto-selection is minor, and fixed-point logic maps cleanly.  

  ---

  ### **Case 2: Symmetric Lottery (n Players)**  
  **Scenario**: Each sends a message with probability \(p\). Prize awarded iff one sends. Superrationality sets \(p = 1/n\).  
  **Translation**:  
  - **Clean**:  
    - Identical processes run **randomized symmetry breaking**: each sends with \(p = 1/n\), matching **leader election in anonymous networks** (e.g., randomized consensus).  
    - **Convergence**: Probability of success (\(≈1/e\)) is optimal for anonymous protocols without unique IDs.  
    - **Maximization**: \(p = 1/n\) maximizes individual expected payoff *given all use same p*, computable locally.  
  - **Assumption Imported**:  
    - **Independence of random bits**. Superrationality assumes private randomness, but distributed systems often assume global coins for efficiency. We import **local randomness with shared entropy source** (matching Hofstadter’s vision).  
  - **No Counterpart**:  
    - Superrationality’s claim that randomization is *inherent* to rationality. In distributed systems, randomization is a tool to circumvent impossibilities (e.g., FLP), not a rational axiom.  

  **Residue**: Low. Randomness as symmetry-breaker is native; only the "rational necessity" of randomization lacks counterpart.  

  ---

  ### **Case 3: Asymmetric Lottery (Player-Dependent Values)**  
  **Scenario**: Player \(i\) wins \(v_i\) if sole sender. Values \(v_i\) distinct, known to all. Identical algorithms take \((i, \mathbf{v})\) as input.  
  **Challenge**: Symmetry broken → no obvious shared strategy. Superrationality requires a canonicalization rule.  
  **Translation**:  
  - **Clean**:  
    - **Program equilibrium** still applies: identical programs with input \((i, \mathbf{v})\) can implement any correlated strategy.  
    - **Feasible outcomes**: Any \(f(i, \mathbf{v})\) mapping to send probabilities (e.g., assign sender to max \(v_i\)).  
  - **Assumption Imported**:  
    - **Veil of ignorance** (Rawlsian): Agents choose \(f\) to maximize expected payoff *before* knowing their \(i\). This selects **utilitarian rule** (max sum of expected payoffs) or **maximin** (protect worst-off).  
    - Without this import, program equilibrium’s **folk theorem** permits infinite \(f\) (e.g., favor high \(v_i\), low \(v_i\), etc.), but *selects none*. Hofstadter implies but never specifies the veil.  
  - **No Counterpart**:  
    - Superrationality’s demand for a *unique rational outcome*. Target vocabulary shows multiple canonicalizations are compatible (utilitarian, Nash bargaining, etc.), but none is privileged. Program equilibrium implements but does not select.  

  **Residue**: High. Without importing veil of ignorance, superrationality has no mechanism to resolve asymmetry.  

  ---

  ### **Case 4: Perturbations**  
  #### **4a: Private Distinct Labels (No Payoff Relevance)**  
  **Scenario**: Arbitrary labels assigned adversarially; known set, no value correlation.  
  **Translation**:  
  - **Clean**:  
    - Labels enable **deterministic symmetry breaking** (e.g., "highest-label sends").  
    - **Anonymous networks + IDs**: Standard model (e.g., leader election with UIDs). Programs are identical but use labels to differentiate.  
  - **Assumption Imported**:  
    - **Label salience as focal point**. Superrationality assumes labels are valid coordination devices, but distributed systems treat them as neutral tools. We import **common knowledge of label legitimacy** (Hofstadter assumes agents accept labels without controversy).  
  - **No Counterpart**:  
    - Superrationality’s claim that labels "solve" asymmetry without compromising rationality. In target vocabulary, labels break symmetry but introduce adversarial risk (e.g., if labels correlate with values secretly).  

  **Residue**: Moderate. Label use is native, but superrationality ignores game-theoretic risks.  

  #### **4b: Fraction \(q\) Superrational, Rest Rational**  
  **Scenario**: Known fraction \(q\) superrational; others optimize selfishly, knowing \(q\) but not identities.  
  **Translation**:  
  - **Analogy to Byzantine systems**:  
    - Superrational agents ≡ **correct processes**.  
    - Rational agents ≡ **Byzantine faults** (deviate arbitrarily for gain).  
    - Known \(q\) ≡ **known fault bound**.  
  - **Breakage in Analogy**:  
    - **Rational agents optimize**, unlike Byzantine faults (malicious). They play **best response** to superrational strategy.  
    - **No equilibrium existence**: Superrational agents must optimize *against* rational ones, but rational agents condition on superrational strategy → circularity. Resembles **Bayesian games with incomplete information**.  
  - **Assumption Imported**:  
    - **Superrational agents commit to strategy first**. We import **Stackelberg equilibrium**: superrationals announce strategy, rationals best-respond. Hofstadter assumes superrationals "set the tone."  
  - **No Counterpart**:  
    - Superrationality’s premise that identical reasoning persists under heterogeneity. Target vocabulary shows **strategic fragility**: rational agents exploit superrational cooperation (e.g., in PD, rationals defect if \(q < 1\)).  

  **Residue**: High. The model collapses into standard game theory; superrationality adds no value.  

  ---

  ### **Aggregate Residue Report**  
  1. **What Translates Cleanly**:  
     - Symmetric cases (PD, symmetric lottery) map directly to **program equilibrium** and **randomized symmetry breaking**.  
     - Fixed-point reasoning aligns with **self-referential algorithms** (Löb/FairBot).  
     - Identical processes and anonymous networks capture **strategy universality**.  

  2. **What Requires Imported Assumptions**:  
     - **Pareto-dominance** for PD (selects cooperation).  
     - **Veil of ignorance** for asymmetric lottery (selects canonicalization).  
     - **Stackelberg timing** for mixed populations (superrationals commit first).  
     - **Label salience** for adversarial IDs.  

  3. **No Counterpart**:  
     - **Normative uniqueness**: Superrationality claims one "rational" outcome per game. Target vocabulary permits multiple equilibria; selection is external (e.g., Pareto, veil of ignorance).  
     - **Rationality of symmetry-breaking tools**: Randomization/labels are practical, not axiomatic.  
     - **Immunity to heterogeneity**: Superrationality lacks tools for adversarial/rational agents.  

  ### **Verdict: Residue as Gap vs. Artifact**  
  - **Your Suspicion (Artifact)**: Strongly supported. Superrationality’s substance reduces to **coordination under symmetry**. Asymmetry exposes it as a shell requiring external canonicalization (veil of ignorance, labels). In mixed populations, it collapses entirely. The residue is not a gap—it’s the unacknowledged injection of selection principles (e.g., Rawlsianism) into a symmetry constraint.  
  - **Counterargument (Gap)**:  
    - **Normative vacuum**: Target vocabulary describes *what agents can implement* (program equilibrium, symmetry breaking) but not *what they should choose*. Superrationality fills this with a **decision rule for symmetric settings**: "Conditional on universal adoption, maximize your payoff." This is absent in game theory (focused on incentives) and distributed systems (focused on computability).  
    - **Should you want this?** Yes, if designing agents for symmetric games (e.g., anonymized markets). The rule is simple, avoids Nash inefficiency (e.g., PD cooperation), and enforces fairness. But it is **brittle**: fails under asymmetry or heterogeneity.  

  **Final Judgment**: The residue is **mostly artifact**. Superrationality is coordination disguised as rationality—useful under symmetry but reliant on imported principles when symmetry breaks. The normative gap it highlights (selecting among equilibria) is real but better filled by explicit social choices (e.g., veil of ignorance) or learning dynamics, not universalized self-reference.
