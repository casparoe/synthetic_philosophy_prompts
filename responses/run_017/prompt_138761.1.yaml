  The argument presented by your housemate, which extends expected value fanaticism to conclude that no action is permissible, is indeed flawed. The core issue lies in the combination of unbounded value with an open-ended option set, which creates a decision-theoretic paradox where every option is strictly dominated, leading to paralysis. After examining the steps, the mistake can be pinpointed to the reliance on an unbounded notion of value in step (1). Specifically, if value is bounded above, step (1) fails for sufficiently large sure goods, resolving the paradox. Below, I'll break this down step by step, explain why rejecting unbounded value is necessary, and discuss the implications for expected value theory and fanaticism.

  ### Step-by-Step Rejection of the Argument
  1. **Rejecting Step (1): "No ceiling" fails if value is bounded.**  
     Step (1) claims that for any probability \(p > 0\) and any finite sure good \(v\), there exists a finite good \(G\) such that \(pG > v\). This is mathematically sound if value is unbounded (i.e., there is no upper limit to how valuable outcomes can be). However, if value is bounded above by some finite maximum \(V_{\text{max}}\) (meaning no outcome can exceed \(V_{\text{max}}\) in value), then for a given \(p\), \(pG\) cannot exceed \(pV_{\text{max}}\). If \(v > pV_{\text{max}}\), there is no finite \(G\) such that \(pG > v\) because \(G \leq V_{\text{max}}\) implies \(pG \leq pV_{\text{max}} < v\). Thus, step (1) is not universally true—it holds only for \(v < pV_{\text{max}}\), not for "any finite \(v\)" as stated.  
     - **Why it looked sound:** Unbounded value seems intuitive in contexts where goods can scale indefinitely (e.g., saving an arbitrary number of lives). However, boundedness is a reasonable empirical or metaphysical constraint—for instance, if there are fundamental limits to welfare (e.g., due to the finite resources in the universe or the nature of conscious experience). Bounded value doesn't require precise knowledge of \(V_{\text{max}}\); it only assumes that such a bound exists.

  2. **Steps (2)–(5) depend on step (1) and collapse if value is bounded.**  
     - If value is bounded, step (2) ("no best ticket") may still hold if the supremum expected value (EV) is not achievable (e.g., because probabilities are strictly less than 1). However, step (3) ("pairwise requirement") no longer implies that every option is forbidden. Specifically:  
       - With bounded value, the set of available tickets has a supremum EV (e.g., approaching \(V_{\text{max}} - 1\) for tickets, or 0 for inaction). But if this supremum is not achieved (e.g., because \(p < 1\)), every ticket is still strictly dominated, and the paralysis in steps (4) and (5) reappears. Crucially, though, bounded value allows for the possibility of undominated options in other decision contexts (e.g., when probabilities include 1 or when options are limited), which avoids universal paralysis.  
       - More importantly, step (3) is not inherently problematic—it's a standard principle of rational choice. The issue is its application in an unbounded domain. With bounded value, step (1) fails, so there is no guarantee that for every option \(Y\), there exists a strictly better \(X\). For example, if \(Y\) is a ticket with EV close to \(V_{\text{max}} - 1\), or if \(Y\) is inaction when all tickets have negative EV (e.g., for very small \(p\)), then no dominating \(X\) may exist. Thus, step (4) ("aggregation") does not generalize to all options, and step (5) (forbidding inaction) is avoided.  
     - **Why the other steps looked sound:** The bookmaker setup (step (2)) is a valid device for an open-ended menu, and step (3) is core to expected value theory. But both rely on step (1), which is the root problem. Rejecting step (1) preserves the pairwise requirement in well-behaved cases while preventing absurdity.

  3. **Why not reject other steps?**  
     - **Step (2) (no best ticket/open-ended menu):** You could reject this by arguing that real-world decision problems have practical limits (e.g., cognitive constraints or finite resources), making the menu effectively closed. However, this is costly for the fanatic, as it undermines the ability to handle cases where options seem genuinely unbounded (e.g., choosing between global priorities with potentially infinite upsides). It also feels ad hoc—the bookmaker is a coherent thought experiment.  
     - **Step (3) (pairwise requirement):** Rejecting this would gut expected value theory, as it's essential for comparing options. Weakening it (e.g., to allow satisficing) abandons fanaticism.  
     - **Steps (4) and (5) (aggregation and paralysis):** These are symptoms, not causes. The problem arises from applying step (3) in an unbounded context.  
     - **Bounded expectations or undefined probabilities:** The stipulation that all expectations are finite and probabilities are real numbers blocks this escape. Similarly, "defective decision problem" arguments don't resolve the normative force of step (3).

  ### Commitments and Implications
  - **You must accept bounded value to resolve the paradox.** This commits you to the empirical claim that there is a finite upper limit \(V_{\text{max}}\) to how good any outcome can be. For example:  
    - In cosmology, if the universe is finite, value might be bounded by the total possible welfare.  
    - In ethics, intrinsic goods like happiness might have diminishing returns or saturation points.  
    This is a "large empirical claim," as you noted, but it's necessary for decision-theoretic coherence. Fanaticism isn't "hostage to cosmology" in a problematic way—it simply requires that fanatic choices respect empirical reality. If value is bounded, fanaticism holds only conditionally: for a given \(p > 0\), a \(p\) chance of \(G\) beats a sure \(v\) only if \(v < pV_{\text{max}}\).

  - **Expected value theory remains functional and aligns with fanaticism in most cases.**  
    - With bounded value, step (1) fails only for very large \(v\) or very small \(p\), so fanaticism still applies to many decisions (e.g., where the sure good is moderate). For instance, if \(V_{\text{max}}\) is large, a small \(p\) can still justify large gambles for sizable \(v\).  
    - In the bookmaker case, if value is bounded, the menu may still lack a best option (due to \(p < 1\)), but paralysis is avoided because:  
      - Real agents can use practical rules (e.g., choose a "good enough" option with high EV).  
      - Normatively, expected value theory can recommend avoiding dominated options when possible, without requiring a unique best choice.  
    - Crucially, bounded value allows expected value theory to "pronounce on" small-probability, large-impact cases—it just doesn't demand that we always prioritize them over very large sure things.

  - **If you insist on unbounded value, expected value theory breaks and must be abandoned.**  
    - Unbounded value + open-ended options implies no permissible actions, which is absurd. To avoid this, you'd need a non-fanatical decision rule (e.g., satisficing, risk aversion, or multi-dimensional criteria). But this contradicts the fanatic's core view.

  ### Does This Commit You to What Your Housemate Originally Wanted?
  - **Mostly yes, with caveats.** Your housemate's initial claim—that for any non-zero \(p\), there's a \(G\) such that a \(p\) chance of \(G\) beats any finite sure good—holds only if value is unbounded. But since unbounded value leads to paralysis, it's unsustainable. With bounded value, the fanatic spirit survives: small probabilities of large goods can still dominate reasonable sure choices, but not arbitrarily large ones. For example, in global priorities, investing in asteroid defense (small \(p\) of preventing extinction) can have higher EV than donating to a local charity (moderate \(v\)), but not necessarily more than a sure outcome of maximal cosmic scale (if such exists). Thus, you keep the fanatic intuition without absurdity, at the cost of accepting bounded value.

  ### Final Recommendation
  Reject step (1) by endorsing bounded value. This resolves the paradox, preserves the pairwise requirement for standard cases, and allows expected value theory to guide decisions—including those involving small probabilities of large goods—without fanaticism leading to paralysis. The cost is an empirical bet on the nature of value, but this is preferable to decision-theoretic incoherence. For your housemate, this means fanaticism must be tempered with boundedness, but it still supports prioritizing high-impact, low-probability interventions in most realistic scenarios. If she resists, point out that unbounded fanaticism is self-defeating: it forbids all actions, including those it seeks to promote.
