  ### Case Construction: Order-Dependence in Jeffrey Conditionalization

  **Story:**  
  Dr. Lee is diagnosing a patient, Alex, for a disease (hypothesis \(H\), where \(H^+\): Alex has the disease, \(H^-\): Alex does not). She orders a blood test (\(B\)) and a urine test (\(U\)). The blood test result is reported on a smudged display, and the urine test result is half-heard over a bad phone line. Dr. Lee is uncertain about both results:  
  - \(B\) has two outcomes: \(B^+\) (positive) or \(B^-\) (negative).  
  - \(U\) has two outcomes: \(U^+\) (positive) or \(U^-\) (negative).  

  The tests are not perfectly reliable and share common sources of error: both are affected by the presence of a non-disease antibody and laboratory conditions (e.g., temperature fluctuations on the testing day). This introduces dependence between \(B\) and \(U\) beyond what is explained by \(H\).  

  **Prior Distribution:**  
  - \(P(H^+) = 0.3\), \(P(H^-) = 0.7\).  
  - Conditional probabilities given \(H\) (incorporating dependence due to shared error sources):  

    | \(H\)  | \((B^+, U^+)\) | \((B^+, U^-)\) | \((B^-, U^+)\) | \((B^-, U^-)\) |
    |--------|---------------|---------------|---------------|---------------|
    | \(H^+\) | 0.60          | 0.20          | 0.10          | 0.10          |
    | \(H^-\) | 0.05          | 0.05          | 0.15          | 0.75          |

  Joint prior probabilities (rounded to 5 decimals for clarity):  
  - \(P(H^+, B^+, U^+) = 0.60 \times 0.3 = 0.18000\)  
  - \(P(H^+, B^+, U^-) = 0.20 \times 0.3 = 0.06000\)  
  - \(P(H^+, B^-, U^+) = 0.10 \times 0.3 = 0.03000\)  
  - \(P(H^+, B^-, U^-) = 0.10 \times 0.3 = 0.03000\)  
  - \(P(H^-, B^+, U^+) = 0.05 \times 0.7 = 0.03500\)  
  - \(P(H^-, B^+, U^-) = 0.05 \times 0.7 = 0.03500\)  
  - \(P(H^-, B^-, U^+) = 0.15 \times 0.7 = 0.10500\)  
  - \(P(H^-, B^-, U^-) = 0.75 \times 0.7 = 0.52500\)  

  Marginals:  
  - \(P(B^+) = 0.18000 + 0.06000 + 0.03500 + 0.03500 = 0.31000\)  
  - \(P(B^-) = 1 - 0.31000 = 0.69000\)  
  - \(P(U^+) = 0.18000 + 0.03000 + 0.03500 + 0.10500 = 0.35000\)  
  - \(P(U^-) = 1 - 0.35000 = 0.65000\)  
  - \(P(H^+) = 0.30000\) (given)  

  **Learning Events:**  
  1. **Blood test update:** Dr. Lee glimpses the smudged blood test result and becomes 60% confident it was positive and 40% confident it was negative:  
     - New marginal: \(P_{\text{new}}(B^+) = 0.6\), \(P_{\text{new}}(B^-) = 0.4\).  
  2. **Urine test update:** Dr. Lee half-hears the urine test result and becomes 70% confident it was positive and 30% confident it was negative:  
     - New marginal: \(P_{\text{new}}(U^+) = 0.7\), \(P_{\text{new}}(U^-) = 0.3\).  

  **Rigidity:** At each update, conditional probabilities given the updated partition (e.g., \(P(\cdot \mid B^+)\) and \(P(\cdot \mid B^-)\) when updating \(B\)) are preserved.  

  ---

  ### Computations

  #### Order 1: Update \(B\) first, then \(U\)
  **Step 1: Update \(B\) to \(P_{\text{new1}}(B^+) = 0.6\), \(P_{\text{new1}}(B^-) = 0.4\)**  
  Rigidity: Preserve \(P(\cdot \mid B^+)\) and \(P(\cdot \mid B^-)\) from the prior.  
  - Compute conditionals given \(B^+\):  
    - \(P(H^+, B^+, U^+ \mid B^+) = 0.18000 / 0.31000 \approx 0.58065\)  
    - \(P(H^+, B^+, U^- \mid B^+) = 0.06000 / 0.31000 \approx 0.19355\)  
    - \(P(H^-, B^+, U^+ \mid B^+) = 0.03500 / 0.31000 \approx 0.11290\)  
    - \(P(H^-, B^+, U^- \mid B^+) = 0.03500 / 0.31000 \approx 0.11290\)  
    Sum: \(0.58065 + 0.19355 + 0.11290 + 0.11290 = 1.00000\) (check).  
  - Compute conditionals given \(B^-\):  
    - \(P(H^+, B^-, U^+ \mid B^-) = 0.03000 / 0.69000 \approx 0.04348\)  
    - \(P(H^+, B^-, U^- \mid B^-) = 0.03000 / 0.69000 \approx 0.04348\)  
    - \(P(H^-, B^-, U^+ \mid B^-) = 0.10500 / 0.69000 \approx 0.15217\)  
    - \(P(H^-, B^-, U^- \mid B^-) = 0.52500 / 0.69000 \approx 0.76087\)  
    Sum: \(0.04348 + 0.04348 + 0.15217 + 0.76087 = 1.00000\) (check).  

  New joint distribution (\(P_{\text{new1}}\)):  
  - For states with \(B^+\): \(P_{\text{new1}}( \cdot ) = P(\cdot \mid B^+) \times 0.6\)  
    - \(P_{\text{new1}}(H^+, B^+, U^+) = 0.58065 \times 0.6 \approx 0.34839\)  
    - \(P_{\text{new1}}(H^+, B^+, U^-) = 0.19355 \times 0.6 \approx 0.11613\)  
    - \(P_{\text{new1}}(H^-, B^+, U^+) = 0.11290 \times 0.6 \approx 0.06774\)  
    - \(P_{\text{new1}}(H^-, B^+, U^-) = 0.11290 \times 0.6 \approx 0.06774\)  
  - For states with \(B^-\): \(P_{\text{new1}}( \cdot ) = P(\cdot \mid B^-) \times 0.4\)  
    - \(P_{\text{new1}}(H^+, B^-, U^+) = 0.04348 \times 0.4 \approx 0.01739\)  
    - \(P_{\text{new1}}(H^+, B^-, U^-) = 0.04348 \times 0.4 \approx 0.01739\)  
    - \(P_{\text{new1}}(H^-, B^-, U^+) = 0.15217 \times 0.4 \approx 0.06087\)  
    - \(P_{\text{new1}}(H^-, B^-, U^-) = 0.76087 \times 0.4 \approx 0.30435\)  

  Marginal for \(U\) after Step 1:  
  - \(P_{\text{new1}}(U^+) = 0.34839 + 0.01739 + 0.06774 + 0.06087 = 0.49439\)  
  - \(P_{\text{new1}}(U^-) = 1 - 0.49439 = 0.50561\)  

  **Step 2: Update \(U\) to \(P_{\text{final1}}(U^+) = 0.7\), \(P_{\text{final1}}(U^-) = 0.3\)**  
  Rigidity: Preserve \(P_{\text{new1}}(\cdot \mid U^+)\) and \(P_{\text{new1}}(\cdot \mid U^-)\).  
  - Compute conditionals given \(U^+\) under \(P_{\text{new1}}\):  
    - \(P_{\text{new1}}(H^+ \mid U^+) = \frac{P_{\text{new1}}(H^+, U^+)}{P_{\text{new1}}(U^+)} = \frac{0.34839 + 0.01739}{0.49439} \approx \frac{0.36578}{0.49439} \approx 0.7398\)  
    - \(P_{\text{new1}}(H^- \mid U^+) = 1 - 0.7398 = 0.2602\) (not needed explicitly).  
  - Compute conditionals given \(U^-\) under \(P_{\text{new1}}\):  
    - \(P_{\text{new1}}(H^+ \mid U^-) = \frac{P_{\text{new1}}(H^+, U^-)}{P_{\text{new1}}(U^-)} = \frac{0.11613 + 0.01739}{0.50561} \approx \frac{0.13352}{0.50561} \approx 0.2640\)  
    - \(P_{\text{new1}}(H^- \mid U^-) = 1 - 0.2640 = 0.7360\).  

  Final posterior for \(H^+\):  
  - \(P_{\text{final1}}(H^+) = P_{\text{new1}}(H^+ \mid U^+) \times 0.7 + P_{\text{new1}}(H^+ \mid U^-) \times 0.3\)  
    \(\approx (0.7398 \times 0.7) + (0.2640 \times 0.3) = 0.51786 + 0.07920 = 0.59706\)  

  **Result:** \(P_{\text{final1}}(H^+) \approx 0.597\).

  ---

  #### Order 2: Update \(U\) first, then \(B\)
  **Step 1: Update \(U\) to \(P_{\text{new2}}(U^+) = 0.7\), \(P_{\text{new2}}(U^-) = 0.3\)**  
  Rigidity: Preserve \(P(\cdot \mid U^+)\) and \(P(\cdot \mid U^-)\) from the prior.  
  - Compute conditionals given \(U^+\):  
    - \(P(H^+, B^+, U^+ \mid U^+) = 0.18000 / 0.35000 \approx 0.51429\)  
    - \(P(H^+, B^-, U^+ \mid U^+) = 0.03000 / 0.35000 \approx 0.08571\)  
    - \(P(H^-, B^+, U^+ \mid U^+) = 0.03500 / 0.35000 = 0.10000\)  
    - \(P(H^-, B^-, U^+ \mid U^+) = 0.10500 / 0.35000 = 0.30000\)  
    Sum: \(0.51429 + 0.08571 + 0.10000 + 0.30000 = 1.00000\) (check).  
  - Compute conditionals given \(U^-\):  
    - \(P(H^+, B^+, U^- \mid U^-) = 0.06000 / 0.65000 \approx 0.09231\)  
    - \(P(H^+, B^-, U^- \mid U^-) = 0.03000 / 0.65000 \approx 0.04615\)  
    - \(P(H^-, B^+, U^- \mid U^-) = 0.03500 / 0.65000 \approx 0.05385\)  
    - \(P(H^-, B^-, U^- \mid U^-) = 0.52500 / 0.65000 \approx 0.80769\)  
    Sum: \(0.09231 + 0.04615 + 0.05385 + 0.80769 = 1.00000\) (check).  

  New joint distribution (\(P_{\text{new2}}\)):  
  - For states with \(U^+\): \(P_{\text{new2}}( \cdot ) = P(\cdot \mid U^+) \times 0.7\)  
    - \(P_{\text{new2}}(H^+, B^+, U^+) = 0.51429 \times 0.7 \approx 0.36000\)  
    - \(P_{\text{new2}}(H^+, B^-, U^+) = 0.08571 \times 0.7 \approx 0.06000\)  
    - \(P_{\text{new2}}(H^-, B^+, U^+) = 0.10000 \times 0.7 = 0.07000\)  
    - \(P_{\text{new2}}(H^-, B^-, U^+) = 0.30000 \times 0.7 = 0.21000\)  
  - For states with \(U^-\): \(P_{\text{new2}}( \cdot ) = P(\cdot \mid U^-) \times 0.3\)  
    - \(P_{\text{new2}}(H^+, B^+, U^-) = 0.09231 \times 0.3 \approx 0.02769\)  
    - \(P_{\text{new2}}(H^+, B^-, U^-) = 0.04615 \times 0.3 \approx 0.01385\)  
    - \(P_{\text{new2}}(H^-, B^+, U^-) = 0.05385 \times 0.3 \approx 0.01615\)  
    - \(P_{\text{new2}}(H^-, B^-, U^-) = 0.80769 \times 0.3 \approx 0.24231\)  

  Marginal for \(B\) after Step 1:  
  - \(P_{\text{new2}}(B^+) = 0.36000 + 0.02769 + 0.07000 + 0.01615 = 0.47384\)  
  - \(P_{\text{new2}}(B^-) = 1 - 0.47384 = 0.52616\)  

  **Step 2: Update \(B\) to \(P_{\text{final2}}(B^+) = 0.6\), \(P_{\text{final2}}(B^-) = 0.4\)**  
  Rigidity: Preserve \(P_{\text{new2}}(\cdot \mid B^+)\) and \(P_{\text{new2}}(\cdot \mid B^-)\).  
  - Compute conditionals given \(B^+\) under \(P_{\text{new2}}\):  
    - \(P_{\text{new2}}(H^+ \mid B^+) = \frac{P_{\text{new2}}(H^+, B^+)}{P_{\text{new2}}(B^+)} = \frac{0.36000 + 0.02769}{0.47384} \approx \frac{0.38769}{0.47384} \approx 0.8180\)  
    - \(P_{\text{new2}}(H^- \mid B^+) = 1 - 0.8180 = 0.1820\).  
  - Compute conditionals given \(B^-\) under \(P_{\text{new2}}\):  
    - \(P_{\text{new2}}(H^+ \mid B^-) = \frac{P_{\text{new2}}(H^+, B^-)}{P_{\text{new2}}(B^-)} = \frac{0.06000 + 0.01385}{0.52616} \approx \frac{0.07385}{0.52616} \approx 0.1404\)  
    - \(P_{\text{new2}}(H^- \mid B^-) = 1 - 0.1404 = 0.8596\).  

  Final posterior for \(H^+\):  
  - \(P_{\text{final2}}(H^+) = P_{\text{new2}}(H^+ \mid B^+) \times 0.6 + P_{\text{new2}}(H^+ \mid B^-) \times 0.4\)  
    \(\approx (0.8180 \times 0.6) + (0.1404 \times 0.4) = 0.49080 + 0.05616 = 0.54696\)  

  **Result:** \(P_{\text{final2}}(H^+) \approx 0.547\).

  ---

  ### Final Posteriors for \(H\)
  - **Order 1 (B then U):** \(P_{\text{final1}}(H^+) \approx 0.597\)  
  - **Order 2 (U then B):** \(P_{\text{final2}}(H^+) \approx 0.547\)  

  **Gap:** \(0.597 - 0.547 = 0.050\).  
  **Decision Impact:** Suppose Dr. Lee will recommend treatment if \(P(H^+) > 0.55\). In Order 1, \(P(H^+) \approx 0.597 > 0.55\) (treat); in Order 2, \(P(H^+) \approx 0.547 < 0.55\) (do not treat). The gap flips the decision without extreme probabilities (all probabilities between 0.05 and 0.75).

  ---

  ### Additional Queries

  **(i) Gap if evidence variables are independent under the prior (new marginals fixed):**  
  If \(B\) and \(U\) are made conditionally independent given \(H\) (using the same marginal probabilities \(P(B^+ \mid H)\), \(P(U^+ \mid H)\) as before), the gap reduces but does not vanish:  
  - \(P_{\text{final1}}(H^+) \approx 0.626\) (Order 1: B then U)  
  - \(P_{\text{final2}}(H^+) \approx 0.588\) (Order 2: U then B)  
  - Gap: \(0.626 - 0.588 = 0.038\) (smaller than 0.050 but still present).  
  The gap persists because Jeffrey updates do not necessarily commute even under conditional independence, but the dependence in the original prior amplifies the gap.

  **(ii) Feature doing the work:**  
  The **dependence between evidence variables \(B\) and \(U\) given \(H\)** in the prior is crucial. In the story, this is earned by shared error sources (non-disease antibody and lab conditions), which create correlation beyond what \(H\) explains. This dependence causes the intermediate distributions (after the first update) to differ significantly between orders, leading to order-dependent posteriors.

  **(iii) Reply to order-dependence criticism:**  
  - **Strongest reply within Jeffrey's framework:** Order dependence is inherent when evidence is uncertain and processed sequentially. Rigidity preserves local conditional probabilities at each step, but the global belief state evolves path-dependently. A rational agent should update on the joint partition (\(B \times U\)) at once if possible to avoid order effects. If sequential updates are unavoidable, the order reflects the agent's sequence of evidence acquisition, which is part of their epistemic context.  
  - **Requires abandoning Jeffrey's framework?** This reply can be made inside Jeffrey's framework. However, if commutativity is deemed necessary for rationality, one must abandon Jeffrey conditionalization for an alternative (e.g., minimizing relative entropy or using "Jeffrey-Van Fraassen" updates that commute). These alternatives are not equivalent to Jeffrey's rule and may violate rigidity.  

  In summary, Jeffrey conditionalization naturally exhibits order dependence when evidence partitions are dependent, and defending it involves accepting that rational updating can be path-dependent under uncertainty. Abandoning the framework is necessary only if commutativity is considered a non-negotiable norm.
