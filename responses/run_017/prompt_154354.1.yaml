   (iii) the strongest reply available to someone who insists that a rational agent's credence should not depend on the order

   In Jeffrey's framework, the reply is that the order of updates matters because the rigidity condition is applied to the conditional probabilities given the partition being updated, and after the first update, the distribution changes, so the second update is applied to a different distribution. 

   A defender of Jeffrey conditionalization might bite the bullet and say that the order of evidence acquisition can matter if the evidence is not heard perfectly and the updates are not on certainties. 

   However, if one wants to avoid order dependence, one might abandon Jeffrey conditionalization for a different updating rule that is commutative, such as updating by minimizing relative entropy (which is not in general the same as Jeffrey conditionalization for multiple updates) or by using the  cross-entropy method, but that is outside Jeffrey's framework.

   The strongest reply within Jeffrey's framework is to accept the order dependence as a feature of the theory and to recommend that the agent should seek to update on the joint partition of both evidence variables at once if possible, to avoid the order dependence. If that is not possible, then the order in which the evidence is processed will affect the final beliefs, and there is no objective priority.

   Alternatively, one might abandon Jeffrey conditionalization for a more general framework that ensures commutativity, such as Field conditionalization or the use of Popper functions, but that is outside the scope.
