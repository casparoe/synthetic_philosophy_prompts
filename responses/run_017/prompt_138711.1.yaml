answer: |-
  **Internal Training Bulletin: Welfare Adjustment Protocols (WAP-7 Revision)**  
  **Section 1: Baseline Calibration Procedures**  

  All citizen welfare assessments commence with individual scale normalization. Per Regulation 12.4a, each subject’s "best feasible outcome" is assigned a value of 1.0 util, while their "worst feasible outcome" is fixed at 0.0 utils. Caseworkers must document these anchor points verbatim during intake interviews (Form WF-22). Emphasize specificity: "losing my rental subsidy" is preferable to "feeling bad." Note that feasibility is determined by the citizen’s *current* option set. If a previously unavailable adverse outcome (e.g., "homelessness") emerges during assessment, rescale all historical util reports for that citizen. A citizen whose worst outcome was "slightly underboiled egg" retains full parity with one whose baseline was "terminal illness" post-normalization. Training Scenario #3 demonstrates how introducing "torture" as a hypothetical option retroactively improves a citizen’s historical satisfaction scores by expanding their worst-case benchmark. Maintain neutral phrasing; do not suggest outcomes are qualitatively dissimilar.  

  **Section 2: Exceptional Resource-Utility Converters**  

  Approximately 0.7% of citizens exhibit Resource-to-Utility Conversion Ratios (RUCR) exceeding 3 standard deviations above the cohort median. These individuals generate util gains exceeding $500,000/unit for marginal resource inputs (e.g., bespoke orthotic insoles yielding +0.2 utils). Per Directive WAP-7.8, all such cases trigger an automatic Tier 3 Audit. Auditors will: (a) Verify claimed sensitivities via controlled environment testing (e.g., presenting varying grades of saffron); (b) Assess option-set breadth using Protocol Gamma (systematically adding frivolous luxuries to establish new "best outcome" ceilings); (c) Review social media for hedonic adaptation indicators. Approval requires unanimous panel confirmation of "non-replicable physiological pathways." Important: High RUCR citizens *do not* receive disproportionate allocations. Their exceptional gains are normalized against population means during aggregation, preserving equity. Report anomalies using Form ERC-9 ("Declaration of Aesthetically Mediated Suffering").  

  **Section 3: Monetary Equivalence Protocols**  

  Converting util fluctuations to dollar values requires strict adherence to context. Utilize the Willingness-to-Pay (WTP) metric for welfare *gains* and Willingness-to-Accept (WTA) for welfare *losses*. WTP/WTA differentials typically range from 1:1.5 to 1:4. Example: A +0.1 util park renovation benefit may show Citizen A (median income) WTP = $150. That same citizen, facing a *loss* of 0.1 utils from park closure, may demand WTA = $450 compensation. Wealth elasticity further adjusts outputs: a $1M/year citizen’s WTP for +0.1 utils may be $5,000, while a $20k/year citizen’s WTP for identical gain may be $20. Software Suite D ("DollarUtil v.4") automates wealth-normalized outputs using IRS-linked income brackets. Never conflate WTP and WTA valuations. Field agents must annotate Forms MU-5A/MU-5B with the prompt verbatim: "What sum would make this change *acceptable to you*?" (loss) vs. "What sum *reflects the value to you*?" (gain).  

  **Section 4: Subjective Wellbeing Survey Corrections**  

  Self-reported wellbeing (SRW) on the 0–10 scale (Form SWB-7) requires cognitive bias adjustment. Citizens exhibiting Hedonic Adaptation Syndrome (HAS) receive a discount factor (α) applied to positive reports. Identification criteria: (a) Sustained exposure to sub-40th percentile living standards; (b) Expression of contentment with historically unsatisfactory conditions (e.g., "My flooded basement is cozy now"); (c) Downward revision of "best outcome" expectations during calibration. Apply α = 0.65 to all SRW > 5.0 for these citizens. Rationale: Diminished aspiration levels artificially compress util scale upper bounds, inflating apparent satisfaction. Conversely, citizens with expanding aspiration ceilings (e.g., recent lottery winners) receive a 1.15 multiplier on SRW < 5.0. Audit trails must show the α-calculation worksheet. Note: SRW inputs remain crucial for longitudinal tracking of *intra*-personal welfare shifts despite inter-personal comparability limitations.  

  **Section 5: Non-Comparative Allocation Framework**  

  Interpersonal util comparisons lack cardinal validity (Policy Memorandum 114.2). Final allocations must therefore rely solely on ordinal preference data. Procedure: (1) Present Citizen A with Citizen B’s resource bundle (detailed anonymously via Bundle Code); (2) Query: "Would you prefer your current bundle or Bundle [Code]?" (3) Repeat inversely for Citizen B. Mutual preference for one’s own bundle confirms Pareto efficiency; no reallocation occurs. Conflicting preferences trigger Bundle Optimization Protocol. The system generates a menu of feasible bundles. Citizens rank their top three choices. The allocation maximizing the number of citizens receiving their first-choice bundle is selected. Tie-breakers utilize the optional "Aggregate Metric" checkbox: if checked, the bundle with highest *sum* of normalised utils is chosen; if unchecked, the bundle with the highest *lowest* individual util score (i.e., maximin) is selected. This satisfies ordinal constraints while operationally respecting intensity differences. Document checkbox status on Form NC-10.
