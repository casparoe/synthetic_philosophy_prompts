  ### Infinite Ethics Decision Tree  
  **Minimal Commitment:** We cannot rule out that the world contains, or will contain, infinitely many welfare-bearing lives or moments.  

  **Six Diagnostic Questions:**  
  1. **Extra Life Case:** A cosmos contains infinitely many good lives. An act adds one further good life and changes nothing else. Is the resulting outcome better, worse, equally good, or is the comparison malformed?  
     - (a1) Better.  
     - (a2) Equally good.  
     - (a3) Worse or malformed.  

  2. **Density Case:** Two infinite worlds share the same large-scale shape. In one, the proportion of good to bad lives is higher in every sufficiently large region. How do you rank them?  
     - (b1) The higher-density world is better.  
     - (b2) They are equally good.  
     - (b3) The comparison is malformed.  

  3. **Spatial/Temporal Split:** Does your answer to the Extra Life Case change if:  
     - The infinity is *spatial* (spread across space, and you can only affect a finite region)?  
     - The infinity is *temporal* (an endless future you can shape)?  
     - (c1) No change: same evaluation in both cases.  
     - (c2) Changes: in the spatial case, the addition is not better or malformed; in the temporal case, it is better.  
     - (c3) Changes: in the spatial case, the addition is better; in the temporal case, it is not better or malformed.  

  4. **Tiny-Probability Case (Good):** One act offers a 1-in-a-billion chance of producing infinite positive value (and nothing otherwise). Another certainly produces enormous finite positive value (e.g., saving a billion lives). Which is better?  
     - (d1) The tiny-chance act is better.  
     - (d2) The sure finite act is better or equal.  
     - (d3) The comparison is malformed.  

  5. **Undefined-Expectation Case:** A lottery has finite payoffs, but its expected value does not exist (positive and negative parts diverge). Is this a counterexample to expected-value maximization?  
     - (e1) Yes, it is a counterexample.  
     - (e2) No; the payoffs were misdescribed.  

  6. **Mixed Case:** A world contains an infinite heaven and an infinite hell. One finite instance of suffering is added. Does this matter?  
     - (f1) Yes, it makes the outcome worse.  
     - (f2) No, it does not matter.  
     - (f3) The comparison is malformed.  

