  ### Leaf Positions  
  Each leaf is tagged with:  
  - **Ranking Paralysis (RP)**: Cannot rank some outcomes.  
  - **Action Paralysis (AP)**: Cannot guide action (e.g., due to undefined expectations).  
  - **Accessibility**: Whether a finite agent can use it.  
  - **Infinity Sensitivity**: Answers flip between spatial/temporal/branching/etc. infinities.  

  1. **I: Extended Number System**  
     - Use infinitesimals/lexicographics to compare infinite totals.  
     - *Awkward Commitment:* Requires extending mathematics (e.g., hyperreals).  
     - Tags: No RP/AP. Accessible (with effort). Sensitivity: Only if infinity type affects number representation.  

  2. **II: Bounded Utility**  
     - No outcome has infinite value; utility is capped.  
     - *Awkward Commitment:* Capping ignores genuine vast improvements.  
     - Tags: No RP/AP. Accessible. No sensitivity.  

  3. **III: Density Average**  
     - Rank by average value in the limit (e.g., per unit volume).  
     - *Awkward Commitment:* Ignores local variations if density matches globally.  
     - Tags: No RP. Potential AP (if density undefined). Accessible. Sensitivity: Metric-dependent (e.g., space vs. time).  

  4. **IV: Indifference**  
     - All infinite outcomes tie; finite differences wash out.  
     - *Awkward Commitment:* Cannot justify improving finite suffering.  
     - Tags: RP (coarse ranking). AP in non-dominated choices. Accessible. No sensitivity.  

  5. **V: Truncation**  
     - Evaluate only a finite surrogate (e.g., reachable region).  
     - *Awkward Commitment:* Ignores everything outside the surrogate.  
     - Tags: No RP/AP. Accessible. Sensitivity: High (truncation depends on infinity type).  

  6. **VI: Person-Affecting**  
     - Only changes to existing beings matter (no aggregation).  
     - *Awkward Commitment:* Cannot justify adding good lives.  
     - Tags: RP (for impersonal comparisons). AP in person-neutral cases. Accessible. No sensitivity.  

  7. **VII: Fanaticism**  
     - Accept tiny chances of infinite value (e.g., Pascal’s Wager).  
     - *Awkward Commitment:* Justifies reckless gambles.  
     - Tags: No RP/AP. Accessible. Sensitivity: Only if infinity type affects possibility.  

  8. **VIII: EMV Abandoned**  
     - Reject expected-value maximization but retain outcome ranking.  
     - *Awkward Commitment:* No general decision rule under uncertainty.  
     - Tags: No RP. AP (if no alternative rule). Accessible. No sensitivity.  

