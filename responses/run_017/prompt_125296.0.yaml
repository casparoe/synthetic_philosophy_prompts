prompt: |-
  I'm a backend engineer with no philosophy training, and I sit in on a lunchtime reading group at the hospital where my partner works. We did a session last month on naturalism versus normativism about health and disease, and one of the residents built an argument that I've been turning over ever since. It seems to prove far too much, but I can't find where it leaks, and I'd like someone to name the step and price the alternatives. Here it is, cleaned up from my notes: (1) Any usable account of disease has to return a verdict on individual cases — for this patient and this condition, yes or no. (2) Naturalism says: a condition is a disease just in case some part or process in the person is performing below the statistically normal level of function for that person's reference class. (3) A reference class is just a partition of a population; biology may fix the species, but nothing in biology fixes how fine to go inside it. (4) Refine far enough — ancestry, genome, diet, occupation, medication, altitude — and every real patient comes out average: given everything true of them, their numbers are exactly what you'd predict. So, on (2), nothing is a disease. (5) Coarsen far enough — all humans, all ages, all states — and perfectly ordinary conditions (being three years old, being pregnant, being asleep) fall below normal function. So everything is a disease. (6) The theory itself puts no constraint on how fine or coarse to go, so (2) can be made to return whichever verdict you want in any actual case. (7) When a verdict flips with a choice the theory leaves open, the theory isn't reporting a fact about the patient; the choice is being made for us, because of which differences we happen to care about clinically. (8) So the value-free core isn't value-free: our interests are doing the work at exactly the point where the reference class gets fixed. (9) So normativism is true: at bottom, calling something a disease is a value judgement about it. (10) But then whatever a society disvalues can qualify as a disease, and medicine ends up pathologising whatever the people in charge dislike. (11) So there is no stable fact of the matter: the question 'is it a disease?' is always a negotiation, and the three specialists who gave my daughter three different answers weren't disagreeing about a fact at all.

  I don't accept (11). The two claims I'd most like to keep are: (i) there is a fact of the matter about whether my daughter's condition is a disease — she's seven, she's been labelled with idiopathic fatigue syndrome after two years of tests that keep coming back in the normal range, and three specialists have given three answers — even if nobody currently knows what that fact is; and (ii) whether it's a disease isn't settled by what anyone wishes were true. As a stress test I made up a case: call it congenital hypoalgesia type V. Roughly one person in three hundred is born with it; they report about a third of typical pain, they have no other measurable difference, their wounds heal faster, and in my imaginary cohort data they have slightly higher completed fertility than matched controls — yet they score below the third percentile on pain-threshold testing for their age and sex. It looks like a disease on one reading of (2) and not on another, and I'd like to know what that tells me.

  So: which step do you reject, and what does rejecting it cost you? Walk my numbering, tell me why the step you reject looked airtight before I looked closely at it, and price the main alternatives — including defining function by selection history instead of by current statistics, and the hybrid view that a disease is a dysfunction plus a harm — and say what each option does with my invented hypoalgesia case and with my daughter's. Open with your bottom line in the first sentence, then give the reasoning, no preamble and no restating of my question. British English, please.
reasoning: |-
  Alright, let's tackle this step by step. The user is a backend engineer without formal philosophy training, participating in a medical reading group. Their partner works at a hospital, so the context involves real clinical concerns, especially regarding their daughter's idiopathic fatigue syndrome. The user presents an argument from a resident that critiques naturalism about disease, leading to normativism and ultimately the claim that disease status isn't factual but negotiated. The user rejects the conclusion (step 11) and wants to preserve two claims: that there's a fact about their daughter's condition being a disease or not, and that it isn't settled by wishes.

  First, I need to parse the resident's argument. The key steps are critiques of naturalism's reliance on reference classes. Steps 4 and 5 show that refining or coarsening reference classes leads to absurd conclusions—either nothing or everything is a disease. Step 6 points out that naturalism doesn't constrain reference class choice, making verdicts arbitrary. Step 7 argues that if the verdict flips based on choice, it's not about the patient but about clinical interests. Step 8 concludes that values are inherent in fixing reference classes, so naturalism isn't value-free. Step 9 jumps to normativism, and step 10 warns about pathologizing disvalued states, leading to step 11's claim that disease status is always negotiated.

  The user's main concern is rejecting step 11 while keeping their two claims. They also present a hypothetical case (congenital hypoalgesia type V) to test theories. The challenge is to identify which step is flawed and evaluate alternatives like selection-based function or hybrid theories.

  Looking at step 4: refining reference classes until every patient is average. This assumes that with enough variables, each individual is statistically normal. But is that accurate? In statistics, even with many covariates, individuals can still deviate from the mean due to unmeasured factors or inherent variability. The argument might overstate the predictability. Similarly, step 5's coarsening ignores that naturalism typically uses species-typical functioning, not all humans lumped together. So steps 4 and 5 might rely on misapplying statistics or misrepresenting naturalism.

  Step 6 claims naturalism offers no constraints on reference classes. But Boorse's theory does specify a reference class: age, sex, species. While there's debate about how to define these (e.g., age ranges), it's not entirely unconstrained. The resident's argument might be attacking a straw man here.

  Step 7 argues that if verdicts flip with reference class choice, the theory isn't factual. But if the reference class is biologically grounded (e.g., by selection history), the choice isn't arbitrary. This is where alternatives like Wakefield's harmful dysfunction come in—combining dysfunction (natural) with harm (normative).

  For the hypoalgesia case: under pure statistical naturalism, it might flip based on reference class. But if function is defined by evolutionary design, reduced pain might be dysfunctional if pain is an adaptive mechanism. However, if the cohort has higher fertility, it might not be dysfunctional. The hybrid view would then require harm—if the individual isn't harmed, it's not a disease, even if dysfunctional.

  For the user's daughter: idiopathic fatigue might involve dysfunction not yet detected. The hybrid view allows that it could be a dysfunction (if discovered) but only a disease if harmful. The user wants a fact of the matter, which the hybrid preserves in the dysfunction part, even if harm involves values.

  The user's rejection of step 11 hinges on maintaining that there's a biological fact about dysfunction, separate from societal values. The resident's mistake might be in step 4, assuming infinite refinability eliminates deviation, which isn't statistically sound. Also, step 6 ignores biological constraints on reference classes.

  Pricing alternatives: pure naturalism (Boorse) struggles with reference classes but can be defended by fixing them biologically. Selection-based (Wakefield) avoids statistical issues but faces challenges in identifying evolutionary norms. Hybrid adds harm, which introduces values but prevents over-pathologizing. For hypoalgesia, hybrid might say it's dysfunctional but not a disease without harm. For the daughter, it could be a dysfunction awaiting discovery, with harm assessed separately.

  The user's deeper need is likely reassurance that their daughter's condition has an objective basis, beyond social negotiation, and that medicine can discover facts. They might also seek a framework that accommodates both biological reality and clinical relevance without collapsing into relativism.
answer: |-
  I reject step (2)'s formulation of naturalism as relying solely on *statistical* normality, which is why steps (4)-(8) appear airtight but aren't. This misrepresents the strongest naturalist accounts (like Boorse's), which define function by species-typical design, not mere statistics. Rejecting this costs you a purely value-free account but retains objectivity in dysfunction. Alternatives:

  1.  **Selectionist Naturalism (e.g., Wakefield):** Function is defined by evolutionary design, not current statistics. *Hybrid option: dysfunction + harm.*  
      - **Why step (2) looked airtight:** You assumed "function" must be statistical (common in naive medical practice). But biology *does* fix functional norms via evolutionary history. Reference classes (species/age/sex) aren't arbitrary partitions but reflect shared design.  
      - **Pricing:** You must accept that identifying "design" is inferential and sometimes contested (e.g., menopause). Values enter via *harm* in hybrid views, but dysfunction remains factual.  
      - **Hypoalgesia V:** If low pain is a statistical outlier *but* matches an evolved adaptive design (e.g., a thrifty pain-response), it's not dysfunctional. If it's a breakdown in the pain system *designed* for higher sensitivity (evidenced by comparative anatomy/development), it's dysfunctional. Harm determines if it's a *disease*. Your cohort data (higher fertility) suggests it *may* be functional.  
      - **Your daughter:** Idiopathic fatigue might involve an undiscovered dysfunction (e.g., mitochondrial impairment). If found, it's dysfunctional. If no dysfunction is found, hybridists say it’s not a disease *even if harmful* (values alone don’t make it a disease).

  2. **Pure Statistical Naturalism (defended Boorsean):** Reference classes (species/age/sex) *are* biologically fixed by shared functional organization.  
      - **Why steps (4)-(5) looked airtight:** You treated reference classes as infinitely adjustable. Biology constrains them: "ancestry/genome/diet" aren’t valid classes unless they alter species-typical function. A 3-year-old isn’t dysfunctional for lacking adult capacities; their *age class* defines normal function.  
      - **Pricing:** You must accept "species-typical" is idealized and may exclude some variations (e.g., genetic polymorphisms). Values *still* influence class choice (e.g., sex as binary vs. intersex), but the core dysfunction is factual.  
      - **Hypoalgesia V:** If low pain persists across valid classes (human/adult/female), it’s statistically subnormal. But is it *functional* impairment? Only if pain sensitivity is a shared species function. Fertility data complicates this – it may be a benign variant.  
      - **Your daughter:** Fatigue is dysfunctional if it measurably impairs a statistically normal function (e.g., cellular respiration) in her age/sex class. Normal-range tests *suggest* no dysfunction, but tests may be inadequate.

  3. **Hybrid (Harmful Dysfunction):** Dysfunction is naturalistic (evolutionary/statistical); harm is normative.  
      - **Why step (8) looked airtight:** You conflated *dysfunction* (natural) with *disease* (which requires harm). Fixing reference classes for dysfunction *can* be objective; harm introduces values.  
      - **Pricing:** You accept values in declaring something a "disease" but retain a factual core (dysfunction). Prevents over-pathologisation (e.g., homosexuality isn’t dysfunctional).  
      - **Hypoalgesia V:** If low pain is dysfunctional (e.g., failure to avoid injury), it’s a disease only if harmful (e.g., leads to unnoticed infections). If harmless or beneficial (faster healing), it’s not a disease.  
      - **Your daughter:** If fatigue involves dysfunction, it’s a disease if harmful (disrupting schooling/socialising). If no dysfunction is found, it’s suffering but not a disease.

  **Bottom line on your cases:**  
  - **Hypoalgesia V:** Under selectionism, it’s likely *not* dysfunctional (due to higher fitness). Hybrid adds: even if dysfunctional, harm determines disease status.  
  - **Your daughter:** All options preserve a fact of the matter: either there’s an underlying dysfunction (unknown or undetected) or not. Specialists disagree due to incomplete data, not mere negotiation. Values enter only in *labeling it a disease* (hybrid) or setting practical thresholds (naturalism), not the dysfunction itself. Rejecting statistical reductionism keeps the core factual.
