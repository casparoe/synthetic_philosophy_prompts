  But this is getting very complicated. And we see that for Person 9, they were indifferent. So it hasn't fully unraveled yet.

  Alternatively, let's assume that the sealed decider (P8) gets a hint for B and votes B. Then Person 9, if they are indifferent, follows their own hint. Suppose Person 9 also gets a hint for B (correct). They vote B. Then the history for Person 10 is: seven A's and two B's.

  Now, Person 10 has to decide. We want to see if they might vote B.

  But note: the two B's are from P8 and P9, who both voted based solely on their own hints. So they are informative.

  In state A:
  - The two B votes: P8 voted B: which happens with probability 0.3 (wrong hint) in state A.
    P9: they were indifferent and voted B. But why were they indifferent? Because the likelihoods for A and B were equal. But in state A, the event that the history (seven A's and then one B) and then P9's hint for B occurred, which we computed as 0.0441 for both states. But for the vote of P9, in state A, they vote B only if they get a hint for B (because they are indifferent). So P(P9 votes B | A) = 0.3.

  In state B:
  - P8 votes B: 0.7
  - P9: they vote B if they get a hint for B (because they are indifferent) -> 0.7

  But also, the first seven votes: 
  In state A: P(first seven votes: all A) = P(P1 votes A|A) * ... * P(P7 votes A|A) = 0.7 * 0.7 * 1 * 1 * 1 * 1 * 1 = 0.49
  In state B: = 0.3 * 0.3 * 1 * ... *1 = 0.09

  So the entire history (7A, then B, then B) given state:

  State A: 0.49 (for first seven) * 0.3 (P8) * 0.3 (P9) = 0.49 * 0.09 = 0.0441
  State B: 0.09 (first seven) * 0.7 (P8) * 0.7 (P9) = 0.09 * 0.49 = 0.0441

  Again equal! So Person 10 is also indifferent and follows their own hint.

  This is not breaking the cascade. The problem is that the first two votes are very informative and they were both for A, so the likelihood ratio is (0.7/0.3)^2 for A vs B from the first two. The rest of the A votes in the cascade are not as informative because they would have voted A anyway.

  To break the cascade, we need a sealed decider early enough that the majority is not too large. Let's try making the sealed decider at position 3.

  But the herd starts at P3. If we make P3 a sealed decider, then they don't see the first two A's. They vote based on their own hint. Suppose they get a hint for B and vote B. Then the history for P4 is: A, A, B.

  Now, P4 sees two A's and one B. They will then decide based on their own hint and this history.

  In state A:
  - P1: A (0.7)
  - P2: A (0.7)
  - P3: B -> which happens if they get a wrong hint: 0.3

  In state B:
  - P1: A (0.3)
  - P2: A (0.3)
  - P3: B (0.7)

  So P(history | A) = 0.7 * 0.7 * 0.3 = 0.147
  P(history | B) = 0.3 * 0.3 * 0.7 = 0.063

  Then, for P4, with their private hint (say for B), 
  P(history and hint4=B | A) = 0.147 * 0.3 = 0.0441
  P(history and hint4=B | B) = 0.063 * 0.7 = 0.0441 -> again equal.

  So they are indifferent and follow their hint.

  It seems we keep getting indifference. The tie-breaking rule is critical.

  But in the cascade example with the first two votes being A, the third person sees two A's and votes A regardless. That breaks the indifference.

  So let's go back to the first cascade example where the herd starts at P3.

   True state: B.
   P1: hint A -> vote A.
   P2: hint A -> vote A (because they see one A and have a hint for A: not indifferent).
   P3: normally sees two A's. Even if they get a hint for B, they vote A.

  Now, we make P3 a sealed decider: they see nothing. They get a hint for B (correct) and vote B.

  Then the history for P4 is: A, A, B.

  Now, P4 sees this and has their own private hint.

  They will compute:

  P(true state A | history=A,A,B and hint4)

  First, without the hint:
  P(history | A) = P(P1 votes A|A) * P(P2 votes A|A) * P(P3 votes B|A)
  = 0.7 * 0.7 * P(P3 votes B|A)

  What is P(P3 votes B|A)? Since P3 is sealed and only has their hint, they vote B only if they get a hint for B, which happens with probability 0.3 in state A.

  Similarly, in state B:
  P(history | B) = P(P1 votes A|B) * P(P2 votes A|B) * P(P3 votes B|B)
  = 0.3 * 0.3 * 0.7   [because in state B, P3 votes B if they get a hint for B: 0.7]

  So:
  P(history | A) = 0.7 * 0.7 * 0.3 = 0.147
  P(history | B) = 0.3 * 0.3 * 0.7 = 0.063

  Now, the ratio P(A|history) / P(B|history) = [0.147 * 0.5] / [0.063 * 0.5] = 0.147/0.063 = 2.333

  So P(A|history) = 2.333 / (1+2.333) = 2.333/3.333 = 0.7

  P(B|history) = 1/3.333 = 0.3

  Now, if P4 has a hint for B (correct), then they combine:
  The posterior probability of state A given the history and hint4=B:

  P(A | history, hint4=B) proportional to P(history|A) * P(hint4=B|A) * P(A) = 0.147 * 0.3 * 0.5 = 0.02205
  P(B | history, hint4=B) proportional to 0.063 * 0.7 * 0.5 = 0.02205

  So again equal! So they are indifferent and would follow their hint: vote B.

  But if they have a hint for A, they vote A.

  So we haven't necessarily broken the cascade.

   However, notice that without the sealed decider, P3 would have voted A, and then P4 would see three A's and definitely vote A. Now, with the sealed decider, P4 might vote B (if they get a hint for B) or A (if they get a hint for A). So there is a chance to break the cascade.

   In the next step, if P4 votes B, then the history for P5 is: A, A, B, B.

   Then P5 sees two A's and two B's. They would be indifferent and follow their own hint. And then the cascade is broken.

   So let's assume that from P3 onward, we have a sealed decider at P3, and then P4 and P5 get hints for B.

   P3: sealed, hint B -> vote B.
   P4: sees A,A,B. They are indifferent (because the calculation above) and they have a hint for B -> vote B.
   P5: sees A,A,B,B. Two A's and two B's. They are indifferent and follow their hint for B -> vote B.

   Then P6 sees: A,A,B,B,B. They see two A's and three B's. They will calculate:

   In state A:
  - P1: A (0.7)
  - P2: A (0.7)
  - P3: B (0.3)  [because sealed and voted based on hint for B, which is wrong in state A]
  - P4: voted B. In state A, P4 sees A,A,B and then has a hint for B (wrong, 0.3) and votes B (because they are indifferent and follow hint). So probability 0.3.
  - P5: sealed? No, P5 sees the history. In state A, they see two A's and two B's, so they are indifferent. They vote B only if they get a hint for B (0.3).

   So P(history|A) = 0.7 * 0.7 * 0.3 * 0.3 * 0.3 = 0.7^2 * 0.3^3

   In state B:
  - P1: A (0.3)
  - P2: A (0.3)
  - P3: B (0.7)
  - P4: sees A,A,B. In state B, P4 has a hint for B (correct, 0.7) and then votes B (because they are indifferent and follow hint). But wait, in state B, the likelihood of the history up to P3 is 0.3*0.3*0.7=0.063, and then P4's vote: they are in state B, they see A,A,B. As above, the posterior for them was P(A)=0.7 and P(B)=0.3, but then they have a hint for B. And when they are indifferent, they follow their hint. So in state B, the probability that they vote B is the probability that they get a hint for B, which is 0.7.
  - P5: sees two A's and two B's. In state B, they are indifferent. They vote B if they get a hint for B (0.7).

   So P(history|B) = 0.3 * 0.3 * 0.7 * 0.7 * 0.7 = 0.3^2 * 0.7^3

   Now for P6, if they have a hint for B:
   P(history and hint6=B| A) = [0.7^2 * 0.3^3] * 0.3 = 0.7^2 * 0.3^4
   P(history and hint6=B| B) = [0.3^2 * 0.7^3] * 0.7 = 0.3^2 * 0.7^4

   The ratio: [0.3^2 * 0.7^4] / [0.7^2 * 0.3^4] = (0.7^2) / (0.3^2) = 49/9 ≈ 5.44
   So they will vote B.

   And the cascade on B starts.

   So by having one sealed decider at P3 (who voted B), and then P4 and P5 also vote B (because of their hints), we break the As and build a cascade on B, which is correct.

   Accounting:

   The sealed decider (P3) gives up the information from the history. In this case, if they had seen the history, they would have voted A (because two A's) but instead they voted B. They personally have a 70% chance to be right (from their hint) which is better than the 0% they would have had if they had seen the history and voted against their hint. So they are better off.

   For the group: eventually they reach the correct cascade on B.

   How many people have to be behind her before the whole thing comes out ahead? In this example, after the sealed decider at P3, we had P4 and P5 vote B (based on their hints) and then P6 starts a cascade on B. So from P3 to P6, they are voting B. The first two are wrong, but the rest are right. In the original cascade, everyone from P3 on would have voted A (wrong). So for the people after the sealed decider, they are better off because they now vote correctly.

   Specifically, without intervention: 
   P1: A (wrong)
   P2: A (wrong)
   P3 to however many: A (wrong)

   With intervention:
   P1: A (wrong)
   P2: A (wrong)
   P3: B (correct, because sealed and hint for B)
   P4: B (correct, because they were indifferent and followed their hint for B)
   P5: B (correct)
   P6: B (correct) and starts a cascade on B.

   So from P3 onward, they are correct. The sealed decider (P3) is correct. The next two (P4 and P5) are also correct because they vote B. Then the cascade on B starts.

   The cost: none for the sealed decider (she is better off). For the group, the first two are fixed as wrong in both cases. The gain is that from P3 onward, they are correct, whereas without intervention they would have been wrong.

   So if there are at least a few people after the sealed decider, the group comes out ahead.

   The role of the tie-breaking rule: when indifferent, they follow their own hint. If they flipped a coin, then in the sealed decider example at P3, it might not break the cascade as cleanly. For example, if P4 is indifferent and flips a coin, they might vote A and then the cascade might continue. But there is a chance. The phenomenon still occurs, but the fix might not work as often.

   Best objection: 
   One objection is that in the real world, people might not be Bayesian or might not have common knowledge of the rationality of others. Additionally, in the model, the only information is the votes and the private hint. In reality, people might have more information or might communicate. Cascade models assume that individuals only learn from the actions of others and not from the reasons behind those actions. If the sealed decider is used, it might be that the later individuals do not understand why the sealed decider voted the way they did, and in reality, they might discount it.

   But for the purpose of the talk, we can say that the model captures a pure information externality.

   Let's write the email-style response.
answer: |-
  Imagine a hiring panel at a tech company deciding between two candidates: Alex (A) or Blair (B). One is truly the better hire, but the panel doesn't know who. Each member gets a private performance assessment hint—70% reliable—and votes sequentially. Everyone wants to hire the best candidate and sees all prior votes. True state is B (Blair is better), but early hints mislead.  

  First, the herd:  
  Person 1 gets a hint for Alex. With no prior votes, they vote A (70% chance it’s right).  
  Person 2 also gets a hint for Alex. They see one A vote. Combining this with their hint, they calculate: if the true state is A, seeing one A vote and having a hint for A has probability 0.7 (for the first vote) × 0.7 (their hint) = 0.49. If it’s B, it’s 0.3 (first vote wrong) × 0.3 (their hint wrong) = 0.09. So A is about 84% likely. They vote A.  
  Person 3 gets a hint for Blair (the correct signal). But they see two A votes. The probability of two A votes if A is true is 0.7 × 0.7 = 0.49. If B is true, it’s 0.3 × 0.3 = 0.09. So A is roughly 84% likely again. Despite their hint for B, they vote A.  
  Now everyone after sees three A’s. Person 4 might get a hint for B, but three A votes make A seem 93% likely. They ignore their hint and vote A. This continues—all subsequent votes are A, forming a herd. Yet, the hints (if aggregated) would show a majority for B: only the first two hints were for A; all others could be for B. The sequential process drowns this out.  

  Now, the intervention: well after the herd starts, at position 8, we add a "sealed decider." She sees no prior votes, only her private hint (same 70% reliability). Assume she gets a hint for B and votes B. Her choice is public.  

  Next, Person 9 sees seven A’s and one B. They know the sealed decider was blind to history. The probability of this vote sequence if A is true: the first seven A’s are consistent (each had high reason to vote A, so collectively likely), and the sealed decider’s B vote happens 30% of the time (wrong hint). If B is true: the first seven A’s are unlikely (each A vote had at most a 30% chance initially), but the sealed decider’s B vote happens 70% of the time. Calculations show these likelihoods are equal, making Person 9 indifferent. Our tie-breaker: when indifferent, they follow their private hint. Suppose they get a hint for B and vote B.  

  Now Person 10 sees seven A’s and two B’s. The new B votes (from the sealed decider and Person 9) shift the balance. The likelihood of this sequence slightly favors B if both B voters had correct hints, which becomes probable as more hint-based votes accumulate. If Person 10 gets a hint for B, they’ll vote B. Soon, the weight of the new B votes overwhelms the early A’s, flipping the herd to B with high probability.  

  The sealed decider personally gives up the safety of following the herd. Alone, she has a 70% shot at being right. In exchange, everyone behind her gains: they break free from the wrong herd. If just 3–4 people vote after her (using hints when indifferent), the group likely corrects course. Since the herd would have stayed wrong indefinitely, even a few correct votes make the net outcome better.  

  What’s doing the work? The tie-breaker. When indifferent, our rule—"follow your hint"—is load-bearing. If they flipped a coin instead, the sealed decider’s vote might not propagate; the herd could persist by chance. But the phenomenon itself is robust: herding arises from rational updating under limited information.  

  Best objection: "In real life, people wouldn’t ignore their hints so easily—they’d question the herd." But this misses the point. The model shows that even with perfect reasoning, the *structure* of information flow (votes revealing others’ inferences) distorts signals. Doubting the herd requires knowing others might be wrong, but here, everyone acts optimally given what they see. The cascade isn’t an artifact—it’s a consequence of sequential decisions compressing rich information into binary choices.
