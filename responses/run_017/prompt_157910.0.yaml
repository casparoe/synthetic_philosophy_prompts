answer: |-
  Here are 10 targeted questions with sharp follow-ups designed to progressively corner the "that's a story about usefulness" move and press the core mechanics of the normative-power view. Each targets a specific case and anticipates likely replies:

  1.  **The Gratuitous Promise:** "Dr. Adeyemi, imagine I promise my colleague I'll breathe air tomorrow. I was going to do it anyway, it makes absolutely no difference to her whether I promise or not, and she finds the promise mildly amusing but irrelevant. I then deliberately hold my breath until I pass out. Have I wronged her? If so, *what specifically* is the wrong, since neither expectations, reliance, nor the practice's utility seem engaged?"
      *   **Likely Reply:** "Yes, you wronged her. You gave your word and broke it. The wrong is the violation of the obligation created by your exercise of the normative power."
      *   **Follow-Up:** "But if 'giving my word' creates a 'bare wrong' entirely disconnected from its impact on *her* (no disappointment, no harm, no relevance to the practice's function for her), what *is* the substance of this wrong *to her*? Isn't describing it as 'wronging her' empty if *nothing* about her normative situation or experience is altered? Is the 'bare wrong' just a metaphysical fact detached from any effect on the promisee?"

  2.  **The Forgotten Promise & Perpetual Bondage:** "Consider a forgotten promise: I promise my friend Ben I'll water his plants next week. Ben completely forgets the promise exists, has no expectation I'll do it, and arranges for someone else. I remember the promise but decide not to water them. Have I wronged Ben? Does the obligation persist?"
      *   **Likely Reply:** "Yes, the obligation persists because you exercised the power to bind yourself to Ben. His forgetting doesn't dissolve the duty *you* created towards *him*."
      *   **Follow-Up:** "Crucially, if only Ben can release me from this duty (as the power was exercised towards *him*), but Ben has forgotten the promise *exists*, am I now perpetually bound? I *cannot* be released because the *only* entity with the normative power to release me is unaware of the duty's existence. Does your view entail that forgotten promises create potentially eternal, un-releasable obligations? How does this fit with the directedness of the duty if the promisee is incapable of interacting with it?"

  3.  **Joint Promise & Partial Release:** "I jointly promise my parents, Alice and Bob, that I'll visit them next Christmas. Later, Alice explicitly releases me from my promise *to her*. Bob does not release me and still expects me. Am I now: (a) Still fully obligated to visit (because the promise was joint)? (b) Obligated only to Bob? (c) Released entirely?"
      *   **Likely Reply:** Likely (b) - Obligated only to Bob now, as Alice exercised her normative power to release me from the duty *owed to her*.
      *   **Follow-Up:** "This suggests the single act of promising jointly created *two distinct obligations* – one owed to Alice, one owed to Bob – rather than one obligation owed jointly to both. But what *is* the object of the normative power exercised when I make a *joint* promise? Did I exercise one power creating two separate duties, or one complex duty? If it's one duty owed jointly, how can Alice release me from 'her part' of it without dissolving the whole thing? What does this imply about the fundamental structure of directed duties?"

  4.  **Moral Wrongness & Pro Tano Force:** "If normative power genuinely changes what I *owe*, could promising ever create an obligation to do something morally wrong? For example, could promising a mob boss to intimidate a shopkeeper create a genuine obligation *to the mob boss* to commit that wrong act?"
      *   **Likely Reply:** "The obligation created is pro tanto. Promising *creates* a genuine obligation, but it can be overridden by stronger moral reasons, like the wrongness of the act."
      *   **Follow-Up:** "Can you give me a concrete example where the pro tanto obligation generated *solely* by the exercise of normative power (not reliance, expectations, etc.) actually *changes* what I have most reason to do *all things considered*? If it's always overridden in cases of significant moral conflict, doesn't that undermine the claim that it's truly changing what I *owe* in a substantively normative sense, rather than just adding a defeasible consideration?"

  5.  **Promises to Non-Participants (Toddler/Dementia):** "I promise my 2-year-old nephew I'll build a block tower tomorrow. He understands the words but lacks any concept of promising, obligation, or future commitments. He won't remember the promise and won't notice if I don't do it. Have I incurred a genuine directed obligation *to him*? If so, what constitutes the directedness towards *this* specific promisee who cannot grasp the normative relation?"
      *   **Likely Reply:** "Yes, you have. The obligation is created by your act, directed towards him as the recipient of your promise, even if he cannot understand it."
      *   **Follow-Up:** "If directedness doesn't require the promisee to have the capacity to understand, claim, or release the obligation, what differentiates this from an undirected duty? What work is 'directed to *him*' doing here that isn't captured by saying 'I have a duty *regarding* him'? How is this different from a self-imposed rule?"

  6.  **Promises to the Dead (Extension):** "Building on that, I promise my dying grandmother I'll look after her rose bush. She dies an hour later. Does the directed obligation *to her* persist? If so, who can release me? Can *I* release myself since she no longer exists?"
      *   **Likely Reply:** "Yes, the obligation persists *to her*. No one can release you, as the normative power resided solely with her."
      *   **Follow-Up:** "So, similar to the forgotten promise, I am perpetually bound by a promise to a non-existent entity? How can there be a *directed* duty to an entity that no longer exists and cannot be wronged? Doesn't this stretch the concept of directedness beyond coherence, collapsing into a kind of undirected, self-imposed moral residue?"

  7.  **The Overhearer & Standing:** "I promise my partner, Alex, I'll pick them up at the airport at 5 PM. Our friend Bailey overhears this promise and, knowing Alex often gets delayed, decides to also wait at the airport at 5 PM hoping for a ride home with me. I forget to pick Alex up. Bailey is inconvenienced. Does Bailey have *any* moral standing to complain about *my breaking the promise to Alex*? Has *Bailey* been wronged by *my* promise-breaking?"
      *   **Likely Reply:** "No. Bailey was not the promisee. The obligation was directed solely to Alex. Bailey's reliance was self-induced and outside the normative transaction."
      *   **Follow-Up:** "If Bailey has no standing, does that mean the normative power *only* creates duties towards the specific promisee, and *only* they can be wronged by its breach? Even if a thousand people overhear and detrimentally rely, the breach wrongs *only* Alex? Is the 'bare wrong' entirely contained within the promiser-promisee dyad, regardless of wider consequences?"

  8.  **Duress by Third Party:** "A criminal threatens to harm my family unless I promise *you*, an innocent bystander, that I'll wash your car every week for a year. Terrified, I make this promise to you. You accept, unaware of the threat. Is this promise binding *on me to you*? If so, why does *my* lack of genuine consent (due to the third party's duress) not negate the exercise of the normative power *towards you*?"
      *   **Likely Reply:** "It is likely void or voidable. The exercise of the normative power requires a voluntary act, which was compromised by the duress."
      *   **Follow-Up:** "But the duress came from a *third party*, not from *you*, the promisee. You did nothing wrong. If the normative power creates the obligation *to you* by my act, why does the involuntariness of *my* act (caused by someone else) dissolve the obligation *to you*? Doesn't this suggest that the validity of exercising the power depends on background conditions (like my freedom from coercion) that are external to the normative transaction *between us*?"

  9.  **The Core Mechanism Test:** "You argue the obligation is created by the *exercise of a normative power*. Can you explain the precise *mechanism*? Is it analogous to a legal power (like creating a contract)? If so, what is the 'normative law' that confers this power and validates its exercise? If not, what kind of metaphysical act *is* it? How does simply uttering words with a certain intention *change normative reality* in this specific way?"
      *   **Likely Reply:** Describes it as a fundamental moral power, perhaps grounded in autonomy or respect, constituting a normative transaction.
      *   **Follow-Up:** "How is this description fundamentally different from saying the social practice *grants us* this power because it's useful? If the power isn't conferred by a practice or dependent on expectations/reliance, what is its ontological source? Isn't describing it as a 'power' just a metaphor unless you can specify *what* enables this power and *how* its exercise has this specific normative effect?"

  10. **Falsifiability & The "Reliance-Thinking" Trap:** "What kind of empirical observation or thought experiment *would* constitute genuine evidence *against* the normative-power account as you understand it? If I presented a case where all the hallmarks of 'bare wrong' seemed absent despite a formal promise (e.g., the gratuitous/forgotten/dead promisee cases where no one is harmed or disappointed and the practice isn't weakened), and you still insist the wrong exists, how could anyone falsify your view?"
      *   **Likely Reply:** Might argue such cases still involve the wrong, or fall back on "You're still looking for harm/reliance/utility, that's reliance-thinking."
      *   **Follow-Up:** "If *every* apparent counterexample can be dismissed as 'reliance-thinking in disguise' – even cases explicitly designed to strip away reliance, expectations, *and* utility – doesn't that make the normative-power account unfalsifiable? Is it a descriptive theory about promising, or a *stipulation* that 'true obligation' in promising *must* be this bare power-exercise, rendering any consequence-based objection definitionally irrelevant?"

  **Key Strategy:** The sequence builds pressure:
  *   Starts with cases stripping away consequences (Gratuitous, Forgotten).
  *   Probes the structure and boundaries of directedness (Joint, Non-Participants, Dead, Overhearer).
  *   Challenges the source and mechanics of the power (Moral Wrongness, Duress, Core Mechanism).
  *   Ends with a direct challenge to the theory's testability.

  Each follow-up is designed to force engagement with the *internal mechanics* of the power view ("What *is* the directed duty?", "How does the power *work*?", "What makes it *directed*?") rather than letting him retreat to the "usefulness" dismissal. The goal is to expose potential contradictions, implausibilities, or unfalsifiable elements within the normative-power framework itself. Good luck with the podcast!
