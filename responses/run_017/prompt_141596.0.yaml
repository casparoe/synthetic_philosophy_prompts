prompt: |-
  I write about science and ideas, and I'm finishing a long piece on strong longtermism — the view that what matters most about what we do now, in expectation, is how it shapes the very long-run future. Nearly everyone I've interviewed for the piece argues in expected value, and I've found that when I check their arithmetic against my own reactions to particular funding decisions, the two keep coming apart. So I've started writing down my verdicts on concrete cases in the hope of working out what principle I'm actually using, because I owe my editor at least one sentence that states it.

  The cases, with my gut verdicts. (a) A proposal with a one-in-ten-thousand chance of preventing human extinction this century, against a programme that will certainly save ten thousand lives over the next decade: I fund the first, decisively. (b) The same one-in-ten-thousand shot, but now at preventing what I've started calling sterile survival — humanity persists for the next billion years at roughly current numbers, current standards of living and current reach, never expanding past the solar system and never qualitatively changing, so that no one dies who would otherwise have lived: I fund this at something like two-thirds of the urgency I gave (a), which means I am not treating mere biological survival as the whole story. (c) A one-in-a-hundred chance of making the entire long-run future go ten per cent better — better institutions, less cruelty, more of what I'd call flourishing — against the same certain ten thousand lives: here I take the certain lives, even though by the arithmetic this should be worth ten times as much as (a), since a hundredth of everything is more than a ten-thousandth of everything. My discomfort is partly that it feels presumptuous to shape people who don't yet exist, but (b) has already conceded that existence isn't the only thing I care about, so I can't lean on that. (d) A well-off couple deciding whether to have a child they would raise well: I don't think longtermism gives them any reason to, since an additional happy life doesn't strike me as an improvement in itself. But five thousand colonists, ninety years into a two-hundred-year voyage, whose birth rate has slipped below replacement, so that the mission would simply end with them: their not having children looks to me like a catastrophe, not a neutral choice. (e) An intervention that would establish self-sufficient settlements around other stars two centuries earlier than otherwise, at no added risk, against one that cuts extinction risk this century by one hundredth of a percentage point: these feel to me about equally worth funding, though only the second ever gets talked about. (f) Two programmes that each cut the chance of losing the future by the same small amount, one aimed at engineered pandemics and one at the systems that would shape whatever civilization comes next: I'd pay about a quarter more for the second, because it also averts futures in which we survive indefinitely under values that are badly distorted by my lights — which sits badly with (c).

  What I want from you is the principle, stated precisely enough that I could print it and apply it yourself, clause by clause, with the case that motivates each clause. Tell me what it says about the case I keep going back and forth on: a perpetual endowment under a ten-thousand-year charter, funded now and governed so that the money can be spent later, when the picture is clearer, versus spending the same sum today on the best available extinction-risk reduction. Give me at least two further cases it decides that I haven't listed. And be honest about which of my verdicts it cannot accommodate: if there are two or three candidate principles that cut the losses differently, set them all out and say which verdict each one sacrifices. If something has to go, I'd rather lose (c) than (a), and I'd be most reluctant to give up my reactions to (d) and (e).
reasoning: |-
  Hmm, the user is a science writer grappling with strong longtermism and their own moral intuitions. They've collected concrete cases where expected value calculations clash with their gut reactions, and now need a precise principle that explains their pattern of judgments. This is sophisticated ethical philosophy territory.

  First let's map their verdicts clearly:
  - (a) Tiny extinction prevention > certain 10k lives saved
  - (b) Preventing "sterile survival" at ~66% of (a)'s urgency
  - (c) 1% chance of 10% better future < certain 10k lives (contradicting EV)
  - (d) No duty to create happy individuals, but collapse of interstellar mission = catastrophe
  - (e) Accelerating star settlements ≈ 0.01% extinction risk reduction
  - (f) Value-shaping risks deserve 25% premium over pure extinction risks

  The core tensions are between (c) and expected value, and between (d)'s asymmetries. Also notable is how (b) and (f) show they care about quality of future, not just existence.

  Key insights from their constraints:
  - They reject pure person-affecting views (since sterile survival matters)
  - But also reject unconstrained total utilitarianism (rejecting (c)'s arithmetic)
  - Their asymmetry in (d) suggests potential-affecting rather than person-affecting
  - (e) shows they value trajectory changes similarly to extinction prevention

  For the endowment vs extinction spending dilemma: their prior reactions suggest they'd slightly favor the endowment because (1) it avoids the "presumptuous shaping" problem from (c), (2) aligns with (e)'s valuation of future flexibility, and (3) respects their discomfort in (c). But it's close.

  Three candidate principles emerge:

  Option 1 (Trajectory Potentials) fits best overall, preserving (a)(b)(d)(e)(f) at cost of (c). It formalizes their focus on enabling future flourishing rather than optimizing outcomes. The endowment case naturally follows - preserving optionality enables better future trajectories.

  Option 2 (Threshold-Constrained EV) saves (c) by discounting small probabilities of vast improvements, but would force them to abandon (b) and (f)'s nuance about future quality.

  Option 3 (Hybrid) tries to compromise but satisfies fewest intuitions.

  Additional test cases they didn't consider:
  - The "value lock-in" case confirms their premium in (f)
  - The "early flourishing" case exposes how their view isn't just about scale

  The endorsement asymmetry in (d) - catastrophic to lose a potential future but not obligatory to create one - is the hardest to square with standard theories. Trajectory Potentials handles this best by distinguishing between extinguishing possibilities versus failing to add new ones.

  Notably, all options struggle with (d)'s individual reproduction case. This might require treating collective survival projects as special - perhaps because they represent humanity's "branching points."
answer: |-
  Based on your concrete verdicts and priorities, your principle prioritizes **preserving and enabling humanity's trajectory toward realizing its fullest potential flourishing** over mere survival or marginal improvements. This focuses on avoiding irreversible losses of *possible futures worth wanting* while rejecting strong obligations to create new lives. Below is the precise principle, its application to your cases, and its implications.

  ---

  ### **The Principle: Trajectory Potentials**
  **"Prioritize interventions that:**
  1. **Prevent irreversible loss of humanity's trajectory toward indefinite, expansive flourishing** (motivated by a, b, d, e);  
  2. **Avoid futures where humanity is permanently confined or value-corrupted** (motivated by b, f);  
  3. **Reject obligations to create new lives solely for expectational value** (motivated by d);  
  4. **Discount small probabilities of shaping distant futures when agency is speculative** (motivated by c);  
  5. **Value preserving future choice and optionality** (motivated by e, endowment case).  

  **Flourishing** requires: (i) biological survival, (ii) scope expansion (e.g., interstellar), (iii) moral/intellectual progress, and (iv) open-ended possibility.  
  **Urgency scales with:**  
  - The *severity* of trajectory loss (extinction > sterile survival > value distortion),  
  - The *irreversibility* of the loss,  
  - The *clarity* of our causal role."  

  ---

  ### **Application to Your Cases**
  1. **Case (a)** (Extinction prevention vs. 10k lives):  
     - **Verdict:** Fund extinction prevention.  
     - **Why:** Clause 1 – prevents irreversible loss of *all* trajectory potential. Saving lives doesn't address trajectory loss.  

  2. **Case (b)** (Sterile survival vs. extinction):  
     - **Verdict:** Fund at ~66% of (a)'s urgency.  
     - **Why:** Clause 2 – sterile survival loses (ii) and (iv) of flourishing, but not (i). Less severe than extinction.  

  3. **Case (c)** (1% chance of 10% better future vs. 10k lives):  
     - **Verdict:** Fund saving lives.  
     - **Why:** Clause 4 – shaping distant futures is discounted when agency is speculative/presumptuous. Saving lives is concrete and non-speculative.  

  4. **Case (d)** (Individual child vs. colony collapse):  
     - **Verdict:** No duty for individual child; catastrophe for colony.  
     - **Why:** Clause 3 – no obligation to create life. But colony collapse loses an *entire trajectory* (Clause 1), making it irreversible loss.  

  5. **Case (e)** (Earlier star settlements vs. extinction risk reduction):  
     - **Verdict:** Fund equally.  
     - **Why:** Clause 1 + 2 – accelerating expansion directly enables flourishing (ii); extinction risk reduction protects the same. Both affect trajectory irreversibly.  

  6. **Case (f)** (Pandemics vs. value-shaping systems):  
     - **Verdict:** Pay 25% more for value-shaping.  
     - **Why:** Clause 2 – value distortion is a distinct failure mode of flourishing (iii-iv), beyond mere survival.  

  ---

  ### **The Endowment vs. Extinction Spending Dilemma**
  - **Scenario:** Perpetual endowment (spend later) vs. best extinction-risk reduction today.  
  - **Principle's Verdict:** **Fund the endowment.**  
    - **Why:** Clause 5 (optionality) + Clause 4 (speculative discount). Extinction risk reduction today involves high uncertainty about effectiveness (Clause 4). The endowment preserves future agency, allowing better-targeted interventions when threats are clearer (Clause 5). Your verdicts in (c) and (e) show skepticism toward current interventions for long-term shaping.  

  ---

  ### **Two New Cases Decided by the Principle**
  1. **The "Value Lock-In" Scenario:**  
     - *Scenario:* A technology that guarantees survival but locks in a totalitarian regime forever vs. a riskier path allowing value evolution.  
     - **Verdict:** Reject the technology.  
     - **Why:** Clause 2 – this causes permanent value corruption, losing flourishing (iii-iv). Survival alone is insufficient.  

  2. **The "Early Flourishing" Tradeoff:**  
     - *Scenario:* A project that slightly increases near-term suffering (e.g., delayed cancer treatments) to massively accelerate space settlement timelines.  
     - **Verdict:** Fund the project.  
     - **Why:** Clause 1 – accelerating expansion enables irreversible trajectory gains. Near-term costs don't lose trajectory potential.  

  ---

  ### **Candidate Principles and Sacrificed Verdicts**
  You prioritize keeping (a), (d), (e) and sacrificing (c). The **Trajectory Potentials** principle achieves this but cannot accommodate all intuitions perfectly. Two alternatives fail more of your core cases:  

  | **Principle**               | **Accommodates**      | **Sacrifices**                                | **Why It Fails You**                          |
  |-----------------------------|-----------------------|-----------------------------------------------|-----------------------------------------------|
  | **1. Trajectory Potentials** (Proposed) | (a), (b), (d), (e), (f) | **(c)**: Rejects 10% future shaping.          | Saves your priorities but clashes with (c)'s EV math. |
  | **2. Threshold-Constrained EV**         | (a), (c)             | **(b)**, **(f)**, **(d)**: Treats sterile survival like extinction; ignores value distortion; can't explain colony asymmetry. | Prioritizes EV but loses your nuance on flourishing quality. |
  | **3. Hybrid Potential-Person Affecting** | (d)                  | **(a)**, **(e)**: Would favor saving certain lives over small extinction risks; undervalues trajectory changes. | Overfits (d) but abandons longtermist core. |

  **Tradeoffs Explained:**  
  - **Trajectory Potentials** sacrifices (c) because Clause 4 discounts speculative influence. This aligns with your discomfort in (c) but clashes with EV.  
  - **Threshold-Constrained EV** (e.g., "Maximize EV but discount probabilities below 1/X") saves (c) but forces you to treat sterile survival (b) as equal to extinction, and ignores value distortion (f).  
  - **Hybrid** models (e.g., "Care about existing people + trajectory potentials") preserve (d) but fail (a) and (e) by undervaluing small-probability trajectory interventions.  

  ---

  ### **Honest Limitations**
  - **Cannot Fully Accommodate:** (c) and (f) are in tension. (f) values averting distorted futures, while (c) rejects shaping better ones. The principle resolves this by distinguishing "preventing active harm to trajectory" (f) from "imposing speculative improvement" (c).  
  - **Weakness:** The "flourishing" criteria (i-iv) are qualitative. In practice, this requires judgment calls (e.g., what counts as "value distortion"?).  
  - **Your Sacrifice:** (c) is abandoned, as your verdict there overrules EV in favor of anti-presumption. This is consistent with your priorities.  

  **Final Note:** Your principle is **conservative about shaping the future but radical about preserving its potential**. It captures your intuition that losing humanity's promise (extinction, sterile survival, colony collapse) is catastrophic, but "improving" posterity is not your burden. The endowment case follows naturally: when uncertain, preserve optionality. If this fits, use it verbatim—it’s built from your own judgments. If not, we can refine.
