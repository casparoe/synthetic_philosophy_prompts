  Below is a decision tree designed to guide your reading group from acceptance of fairness impossibility results to specific positions. It uses concrete, non-prejudicial questions and avoids presupposing philosophical commitments. The tree has **8 branch questions** leading to **10 distinct leaves** (including your requested additions). Positions are named where established, and "unoccupied" cells are noted. Each leaf includes a one-sentence "awkward commitment" (the hardest pill to swallow for that position).

  ---

  ### **Decision Tree: Navigating Fairness Trade-offs After Impossibility Results**

  **Start**: All parties accept that calibration, equal FPR/FNR, and predictive parity/equalized odds cannot jointly hold when base rates differ and predictions are imperfect.

  1. **Q1: Does deploying the predictor *change the base rates* of the outcome?**  
     (e.g., via feedback loops: detention → lost opportunities → reoffending)  
     → *Yes*: Go to Q2.  
     → *No*: Go to Q4.  

  2. **Q2: Do these dynamic effects make the practice *more unjust* than human alternatives?**  
     (e.g., parole boards may be biased, but algorithmic feedback loops amplify inequity)  
     → *Yes*: Go to Q3.  
     → *No*: Go to Q4 (merge with static branch).  

  3. **Q3: Is the *social harm* of the practice (e.g., pretrial detention) inherent, or tied to prediction?**  
     → *Harm is inherent*: **Leaf: Abolish the practice** (e.g., decarceration advocate).  
       - *Awkward commitment*: Abandoning potentially beneficial uses (e.g., resource allocation) to dismantle oppressive systems.  
     → *Harm is prediction-dependent*: **Leaf: Decline the score; use human/blunt rules**.  
       - *Awkward commitment*: Accepting known human biases or inefficiencies to avoid algorithmic feedback loops.  

  4. **Q4: Is the *target variable* (e.g., "reoffending") a biased construct?**  
     (e.g., arrest rates reflect policing bias, not actual behavior)  
     → *Yes*: **Leaf: Reject the target variable** (e.g., critical data studies view).  
       - *Awkward commitment*: Forfeiting predictive tools entirely due to construct validity issues.  
     → *No*: Go to Q5.  

  5. **Q5: Should fairness prioritize *procedural legitimacy* over statistical parity?**  
     (e.g., who chose the metric? Is there recourse for appeals?)  
     → *Yes*: **Leaf: Procedural fairness** (e.g., democratic accountability view).  
       - *Awkward commitment*: Outcomes may remain statistically unfair if the process is "fair."  
     → *No*: Go to Q6.  

  6. **Q6: Should fairness apply to *individuals*, not groups?**  
     (e.g., "treat similar people similarly" via a similarity metric)  
     → *Yes*: **Leaf: Individual fairness** (Dwork et al.).  
       - *Awkward commitment*: Defining "similarity" is subjective and may encode new biases.  
     → *No*: Go to Q7.  

  7. **Q7: Is *group information* (race/gender) usable in design?**  
     (e.g., legally or ethically permissible to include)  
     → *No*: **Leaf: Fairness through unawareness** (common industry default).  
       - *Trap note*: Fails when proxies exist (e.g., zip code → race), satisfying no criterion.  
       - *Awkward commitment*: Pretending group disparities vanish by deleting group variables.  
     → *Yes*: Go to Q8.  

  8. **Q8: Should the *subject* choose their fairness metric?**  
     (e.g., a defendant picks FNR equality for themselves)  
     → *Yes*: **Leaf: Metric self-determination** (unnamed; theoretically empty).  
       - *Empty cell note*: Incoherent—global fairness properties (e.g., calibration) can't be individualized without systemic chaos.  
       - *Awkward commitment*: Allowing mutually incompatible choices per person.  
     → *No*: Go to Q9.  

  9. **Q9: Should the institution *publicize trade-offs* without resolving them?**  
     (e.g., "We chose equal FPR; here’s the cost for your group")  
     → *Yes*: **Leaf: Publish the trade-off** (transparency pragmatism).  
       - *Not a full position*: Often bridges to moral prioritization (Leaf 10) or procedural fairness.  
       - *Awkward commitment*: Revealing unfairness without fixing it.  
     → *No*: Go to Q10.  

  10. **Q10: Which error type causes *more harm*?**  
      → *False positives* (e.g., denying bail to non-reoffenders): **Leaf: Moral prioritarianism (FPR focus)**.  
        - *Chooses*: Equal FPR (if harm is systemic) or calibration (if harm is individual miscalibration).  
        - *Awkward commitment*: Tolerating higher FNR (e.g., releasing reoffenders) for marginalized groups.  
      → *False negatives* (e.g., releasing reoffenders): **Leaf: Moral prioritarianism (FNR focus)**.  
        - *Chooses*: Equal FNR or predictive parity.  
        - *Awkward commitment*: Tolerating higher FPR (e.g., over-detaining innocents) for marginalized groups.  

  ---

  ### **Diagnostic Notes**
  - **Unoccupied cells**:  
    - *Metric self-determination* (Q8 → Yes): Logically incoherent (individual choices break global fairness properties).  
    - *Publish the trade-off* (Q9 → Yes): Often a practice, not a terminal position—most advocates use transparency to push for Q10 or Q5.  
  - **Indistinguishable positions**:  
    - **Procedural fairness (Q5 → Yes)** and **Publish the trade-off (Q9 → Yes)** *can* overlap if transparency is part of the procedure.  
    - *Separating question*: "Does revealing trade-offs *alone* legitimize the system?" → Yes (Leaf 9), No (Leaf 4).  
  - **Dynamic effects skipped?**: Q1 forces engagement early (per your public defender’s concern).  
  - **Fairness through unawareness**: A *trap* (Q7 → No), not a coherent leaf. It appears neutral but collapses into *de facto* group unfairness.  
  - **Why no "group vs. individual" question?**: Q6 splits this without presupposing frameworks—answers depend on empirical beliefs (e.g., "Can individual similarity capture systemic bias?").  

  ---

  ### **Tree Structure Summary**
  - **Branch questions**: 8 (Q1–Q10; Q3 and Q10 are endpoints).  
  - **Leaves**: 10 positions (including traps/empty cells).  
  - **Flow**: Works as a flowchart—each branch is binary, requires no prior position knowledge, and uses real-world cases (e.g., "Does detention change reoffending?").  

  This tree isolates *procedural* disagreements (e.g., "Can we fix base rates?") from *moral* ones (e.g., "Which error is worse?") and surfaces hidden assumptions (e.g., ignoring dynamics). Use it to map where each member’s intuitions diverge, then debate the branch labels themselves.
