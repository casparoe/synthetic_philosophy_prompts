  Their deeper need is clarity on whether the disagreement is substantive or just semantic. They want to know if the untranslatable parts reveal a genuine flaw in their framework (e.g., concepts like authority/legitimacy being non-causal) or if the philosophy itself is muddled. They’re seeking a verdict: Is the brother-in-law basically right, or is there a real difference hiding in the residue?  

