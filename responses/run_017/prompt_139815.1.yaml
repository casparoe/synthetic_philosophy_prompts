prompt: |-
  hey, I've been messing around with the old sea battle problem in my spare time and I wrote up a short piece that tries to do something a bit different from the usual "is it true now or not" exchange. Draft first, asks after. Comments would be great.

  **Hardening**

  §1. Take B: there is a sea battle at noon tomorrow. The view I'm interested in — call it the gap view — says that right now B is neither true nor false, and that if the battle happens B *becomes* true at noon. Call that transition hardening. I want to know what hardening is supposed to be, because I think the natural answers either collapse the view into something else or generate a regress.

  §2. First answer: B hardens when its truthmaker shows up. The battle occurs, and that's what makes B true. Problem: the battle's occurring at noon is a fact that obtains at noon, and whether it obtains doesn't depend on when you ask. So if truth-at-a-time just tracks the truthmaker, then B's status never changes: it was already the case, at every earlier time, that the battle occurs at noon. That isn't hardening, that's determinism about truth with extra steps. So the gap theorist can't lean on truthmakers; whatever makes t1 different from t2 has to be something about t1's relation to t2, not about the battle.

  §3. So: what makes the future open at one time and closed at another? The only story I can see is the branching one — at t1 several histories run through t1 and then diverge, and B is true on some and false on others. But that's basically the Ockhamist picture, and it already gives you a perfectly good truth predicate: true at a time on a history. Once you've got that machinery the gap theorist's motivation starts to look thin, because the thing she wanted to avoid (a fact of the matter about which way it goes) is either back — as the thin red line marking which history is actual — or it was never really the issue, since the branching structure was doing the work all along. Call this the convergence argument. This is the section I'm least sure about.

  §4. Second problem, and the one I care about more. Take H: B hardens at noon tomorrow. When does *H* harden? Three options. (a) At noon, along with B. Then at every earlier time it's unsettled whether B hardens at noon — which requires an unsettled fact about the structure of settling itself, and you get the same question again one level up, forever. (b) Earlier, say at midnight. But then it was settled at midnight that B closes at noon, and I don't see how that's compatible with its still being unsettled at midnight which way B goes: a timetable that says "the question closes at noon" already excludes the histories on which the question closed at 6am, and those are exactly the histories where something about the battle got settled early. (c) Never — H has no hardening time, it's just always settled or always not. That's a dodge unless you say which.

  §5. The way out I want to try: accept (c) in a specific form. Call it Scheduled Settling. There is a determinate timetable saying when each future contingent proposition hardens, and the timetable is settled from the start; but the timetable says nothing about which way anything hardens. What grounds it: causal structure — a proposition hardens when the causal preconditions of its truthmaker are complete, and under indeterminism that's compatible with either outcome. So it can be settled now that B closes at noon without its being settled now whether B closes *true*. Settledness of the schedule, openness of the outcome.

  §6. Two things I'm worried about. First, this looks like a thin red line of a new kind: a thin *schedule*. If I'm allowed one piece of privileged structure, the Ockhamist will ask why she isn't allowed hers. Second, early-hardening cases: if the admiral signs an irrevocable order tonight, isn't B settled tonight even though its truthmaker shows up tomorrow? My causal story says yes, the schedule should read "closes at 9pm" — but then schedule and truthmaker come apart, and I'm not sure I can say what the schedule is about anymore.

  What I'd like:

  1. Is §2 fair, or is there a version of truthmaker-based openness that survives it?
  2. Is the regress in §4 real, or am I just confusing levels?
  3. Does Scheduled Settling collapse into Ockhamism, or into the "every future contingent is false" line, once you push on what grounds the timetable?
  4. §3 is the weakest bit — tell me what I'm missing there.
  5. Honestly: is any of this new? If Scheduled Settling is basically a view that already exists and has a name, describe that view in your own words and tell me where mine differs. Please don't give me reading lists, paper titles, or citations — I can't look anything up right now, and half-remembered references are worse than nothing. Same for the Aristotle material: I'm going from memory on the sea battle example, and I'd rather you leave my history alone than confabulate a citation. Just work with the argument as I've stated it.
  6. Line-level: is the move to "causal preconditions complete" in §5 doing real work, or is it hand-waving?

  Keep it all under about 800 words, and don't just be encouraging — if the central idea is definitly broken I'd rather find out now.
reasoning: |-
  Okay, let me tackle this sea battle problem step by step. The user has drafted an interesting take on future contingents and hardening, and I need to respond thoughtfully to their specific questions without getting lost in academic references. 

  First, I should acknowledge their core concern: they're trying to avoid both determinism and the thin red line problem in Ockhamism. The gap view with hardening is their alternative, but they're worried it might collapse or regress. 

  Looking at §2: Their critique of truthmakers seems solid. If the battle at noon is the truthmaker, then at all prior times it's true that the battle occurs at noon. That does kill the gap view. I can't see a way around this - truthmakers are timeless in that sense. So their point stands.

  For §3's convergence argument: They're right that branching histories give a clear truth predicate (true-in-h). The gap view does look redundant here. But there's a nuance: some gap theorists reject histories altogether, seeing branching as metaphorical. Still, without histories, it's unclear what "neither true nor false" means. Their worry is valid.

  Now the regress in §4 is serious. If hardening itself needs hardening times, we get an infinite stack. Their Scheduled Settling idea tries to stop this by fixing the timetable early. But as they note, this creates a "thin schedule" problem - it's privileged structure like the thin red line. 

  The causal precondition move in §5 is clever but risky. It might work for physical events like battles, but what about mathematical futures? Or when human decisions harden earlier than causes (like the admiral's order)? That case breaks the causal link they propose.

  Overall, their Scheduled Settling is novel in linking hardening to causal structure rather than time alone. But it shares Ockhamism's flaw of needing privileged facts - just about timing rather than outcomes. And early hardening cases expose its fragility.

  I should be direct about the flaws while honoring the ingenuity. The causal approach adds value but doesn't solve the core issues. Maybe suggest they lean into the metaphysics of causation instead of truth values? But they asked for critique, not fixes.
answer: |-
  Here’s a direct engagement with your queries, keeping the analysis tight and critical:

  1.  **§2's Fairness:** Your critique is sound. Truthmakers (like the battle occurring at noon) are typically understood as timeless facts. If truth-at-t0 depends *only* on whether that truthmaker *exists* (which it timelessly does if the battle happens), then B *was* true at t0. Leaning on truthmakers inherently commits to a form of eternalism/persistence of truth over time, collapsing into determinism or a "fixed future" view. No viable truthmaker-based gap view survives this without abandoning standard truthmaker theory.

  2.  **§4's Regress:** The regress is real and vicious. Option (a) explicitly generates it: If H’s hardening is unsettled before noon, then a meta-proposition about *H’s* hardening time (say, H*) is needed, and so on. Option (b) creates conflict: Settling *that* B hardens at noon *now* (at midnight) seems incompatible with B itself being unsettled *now* – it implies the *structure* of temporal openness is already closed/fixed, undermining the openness it was meant to preserve. Option (c) dodges but demands explanation.

  3.  **Scheduled Settling & Collapse Risks:**
      *   **Ockhamism:** Scheduled Settling (SS) *does* introduce privileged structure akin to the Thin Red Line (TRL), but it's structural (the fixed timetable) rather than outcome-based. The Ockhamist rightly asks: "Why is a fixed *schedule* metaphysically acceptable if a fixed *outcome* (TRL) is not?" SS avoids the TRL's specific problems about "which outcome" but inherits the core issue: positing *any* fixed, non-branching, privileged metaphysical structure (be it outcomes or timetables) seems arbitrary. If you accept one, why not the other? This is a major vulnerability.
      *   **'All False' View:** Less likely to collapse here. SS explicitly maintains the gap (neither true nor false) before hardening. The "all false" view rejects gaps.
      *   **Grounding the Timetable:** This is critical. If the timetable is grounded in "causal preconditions complete," it faces the admiral problem (§6): The irrevocable order *completes* the causal preconditions tonight, hardening B tonight. This seems correct *for SS* but severs hardening from the truthmaker's *occurrence* time. The "schedule" becomes about *causal determination*, not temporal location per se. This opens a new can of worms: What *is* "causal precondition complete"? Is this notion itself settled? If yes, it might face a regress about *its* status; if no, the schedule becomes unsettled. Grounding the schedule robustly is SS's Achilles' heel.

  4.  **§3 (Branching/Gap Motivation):** Your point is strong. Branching time (Ockhamism/supervaluationism) provides a clear, workable semantics for future contingents ("true-in-h", "supertrue") *without* needing a gap. The gap theorist's core motivation – avoiding a "fact of the matter" about the future – is undermined because:
      *   Branching *also* avoids a single, settled, *actual* future fact before the branch point. All histories are ontologically equal until "pruned".
      *   The gap view struggles to articulate what "no fact of the matter" *means* ontologically without branching histories. What does the openness *consist in* if not alternative possibilities (branches)? If it's just epistemic, that's not a gap *theory*. Convergence is a real threat: Branching offers a clearer framework achieving similar openness goals, making the gap view seem unmotivated or redundant.

  5.  **Novelty of Scheduled Settling:** SS feels closest to a **structured temporal becoming** view blended with **causal finitism**. The core idea – that propositions become true/false at specific, pre-ordained times determined by the world's causal structure, independent of the outcome – is uncommon. Most gap views focus on *why* there's no truth value (indeterminism, lack of truthmaker) without specifying a *mechanism* or *timing* for truth-value acquisition. SS explicitly adds this "timetable" element grounded in causal structure. Its novelty lies in this precise linkage between causal completion and truth-value genesis. Key differences:
      *   Vs. **Peirceanism ("All False")**: SS retains a gap (neither), not simple falsity.
      *   Vs. **Standard Ockhamism**: SS rejects true/false relative to histories *before* hardening; only "neither" is absolute. It adds the fixed hardening time.
      *   Vs. **Truthmaker-Gap Views**: SS avoids §2's collapse by making truth-value acquisition an event triggered by causal completion, not the truthmaker's existence *simpliciter*.
      The "causal precondition" grounding is the most distinctive (and vulnerable) aspect.

  6.  **"Causal Preconditions Complete" - Work or Handwave?** It's **attempting real work but risks handwaving**.
      *   **Work:** It directly addresses the admiral problem *within SS*: hardening happens when determination happens, which *can* precede the event (order tonight, battle tomorrow). It grounds the schedule in something seemingly objective (causal structure) and links openness to the *process* of determination. It avoids hardening being magically tied to the clock-time of the event.
      *   **Handwave Risk:** The notion is critically underspecified. What counts as "complete" under indeterminism? If micro-indeterminism percolates up, is the precondition *ever* truly complete before the outcome? Does "complete" mean *sufficient for the outcome to occur* (which would entail determinism) or merely *sufficient for the outcome to be settled* (which might happen earlier, as with the admiral)? Resolving this requires a full theory of causation and determinism. Without it, the phrase risks being a placeholder masking deep problems.

  **Overall Assessment:** The core of Scheduled Settling is an intriguing, relatively novel attempt to solve the hardening regress by introducing a fixed, causally grounded timetable. However, its central weaknesses are significant:
  *   The "Thin Schedule" problem mirrors the Ockhamist's "Thin Red Line" problem.
  *   Grounding the timetable robustly, especially the "causal preconditions complete," is extremely challenging and currently underspecified.
  *   The admiral case highlights the tension between causal determination and event occurrence time, potentially fracturing the concept of hardening.
  *   §3's convergence argument against the motivation for gaps over branching remains a powerful challenge.

  The idea isn't "definitely broken," but it faces major hurdles requiring substantial metaphysical work on causation and temporal ontology to overcome. It's a promising direction worth exploring, but the difficulties you've identified are core problems, not peripheral ones.
