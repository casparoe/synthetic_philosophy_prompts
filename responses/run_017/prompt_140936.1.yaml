answer: |-
  ## Dichotomous Key: Which Theory of Self-Amendment Do You Already Hold?

  **Commission Note:** This key helps you discover your implicit commitments about the Palimpsest’s rulebook by forcing choices on concrete cases. Start at Couplet 1. Answer based *only* on the facts stated and the rulebook described, not abstract doctrine. Your path leads to a numbered doctrine describing your underlying view and its logical consequence.

  **The Rulebook (Essential Facts):**
  *   **R0 (The Engine):** Any rule may be replaced by a resolution carried by two-thirds of the Assembly (400 seats).
  *   **R0.1 (The Lock):** Adopted later under R0 by two-thirds. It states: R0 may be replaced only by a resolution carried by four-fifths of the Assembly.
  *   **The Assembly:** 400 seats.
  *   **The Chair:** Counts votes, rules on order, maintains the official Register (list of enforced rules). Custom (not rule): Registers passed resolutions within twenty-four hours.
  *   **Moderators:** Enforce only registered rules. No court exists.

  ---

  **The Dichotomous Key:**

  1.  **The Repeal:** A resolution passed by 68% of the Assembly purports to delete the Lock (R0.1) from the rulebook. *Should moderators enforce the deletion of the Lock now?*
      *   **Yes, enforce the deletion.** → Go to 2
      *   **No, do not enforce the deletion; the Lock still stands.** → Go to 3

  2.  **The Bootstrap:** A resolution passed by 51% of the Assembly purported to lower the Engine (R0) to a simple majority. The Chair mistakenly registered it. For three years, every rule was passed by simple majority, and everyone treated those rules as binding. A 70% resolution then purported to restore the two-thirds threshold. *Should moderators enforce rules passed by simple majority during those three years?*
      *   **Yes, enforce those simple-majority rules.** → Go to 4
      *   **No, do not enforce those simple-majority rules; they were never properly authorised.** → Go to 5

  3.  **The Lock Itself:** The Lock (R0.1) was adopted by a two-thirds resolution under the original Engine (R0). *Should moderators enforce the Lock now?*
      *   **Yes, enforce the Lock.** → Go to 6
      *   **No, do not enforce the Lock.** → Go to 7

  4.  **The Double:** A single resolution, passed by 70% of the Assembly, both lowered the Engine (R0) to a simple majority *and* repealed the Lock (R0.1) in the same document. *Should moderators enforce the lowered threshold (simple majority) and the repeal of the Lock?*
      *   **Yes, enforce both changes.** → **Doctrine 12: Efficacy Legitimacy.** The rulebook is defined by sustained, effective practice accepted by the community. *Awkward Commitment: Even widespread error or official mistake, if effective long enough, can permanently change the fundamental rules.*
      *   **No, enforce neither change.** → **Doctrine 2: Strict Pedigree.** A rule is only part of the rulebook if authorised by a rule that was itself properly authorised and in force at the time of enactment. *Awkward Commitment: If the initial lowering in 'The Bootstrap' was unauthorised (as 51% < 2/3), then *all* subsequent rules passed under it, and the restoration attempt, are void – potentially collapsing the entire system for three years.*

  5.  **The Retro-Repeal:** An 80% resolution repeals the Lock (R0.1) "with effect from the date of its adoption", declaring it never had force. *Should moderators enforce this retroactive repeal, meaning the Lock never existed?*
      *   **Yes, enforce it; the Lock was never valid.** → **Doctrine 9: Popular Sovereignty (Unfettered).** The Assembly, representing the community, holds ultimate power outside the rulebook; it cannot irrevocably bind its future self or dissolve itself. *Awkward Commitment: Rules like the Lock, designed to protect minorities or stability, are always vulnerable to being overridden by a sufficiently determined majority.*
      *   **No, do not enforce it; the Lock existed and had force until now.** → **Doctrine 3: Hierarchical Pedigree.** A rule's authority derives from the chain of authorising rules in force at each step. *Awkward Commitment: The Assembly *could* have repealed the Lock prospectively with 80%, but it cannot rewrite history; past rules had effect when made according to the rules then in force.*

  6.  **The Freeze:** An 82% resolution adds a rule that "no rule may ever be replaced again" and directs the Chair to stop recording votes. A year later, an 85% resolution purports to undo it. *Should moderators enforce the undoing resolution?*
      *   **Yes, enforce the undoing; the Freeze rule is gone.** → **Doctrine 8: Self-Embraced Amendment Power.** The amending power (under the rules then in force) can reshape its own future scope, including imposing genuine, binding limitations. *Awkward Commitment: The Assembly can effectively dissolve itself or lock in rules forever if it follows the correct procedure at the time.*
      *   **No, do not enforce the undoing; the Freeze rule is still in force.** → Go to 8

  7.  **The Lock Itself (Again):** The Lock (R0.1) was adopted by two-thirds under R0. *Could the Assembly have adopted a rule like the Lock using only a simple majority resolution at the very beginning?*
      *   **Yes, a simple majority could have set any rule initially.** → **Doctrine 10: Foundational Acceptance.** The initial rulebook and its authority rest solely on acceptance by officials and the community, not a prior rule. *Awkward Commitment: The initial rules had no deeper 'legal' foundation than any subsequent change; authority is always contingent on current acceptance.*
      *   **No, a simple majority could not have set the Lock initially; it needed the authority of R0.** → **Doctrine 1: Originalist Pedigree.** The rulebook's authority stems solely from the original, un-amended R0. *Awkward Commitment: Any amendment to R0 itself (like adopting the Lock) is impossible; the Lock itself is void because R0 didn't authorise its own amendment.*

  8.  **The Silent Century:** Over a century, every original rule is replaced one at a time, always following the rule then in force. The name, membership, and servers all change completely. *Is the final rulebook the same rulebook that started with R0?*
      *   **Yes, it is the same rulebook persisting through lawful change.** → **Doctrine 7: Identity Through Lawful Replacement.** An entity persists as long as changes occur according to its own rules at the time, regardless of total content turnover. *Awkward Commitment: The rulebook is now utterly different in content and context, yet legally continuous with the original.*
      *   **No, it is a different rulebook now; the original is gone.** → **Doctrine 11: Content-Based Discontinuity.** Fundamental changes to the nature of the entity (sovereign, identity, purpose) break continuity, even if procedurally perfect. *Awkward Commitment: Identifying the precise moment or change that broke continuity is inherently contestable and beyond the rules themselves.*

  9.  **The Unregistered Rule & The Ratchet:** (A) A rule passed by 90% is never registered by the Chair. A year later, someone relies on it. *Should moderators enforce it?* (B) Eleven resolutions, each lowering the threshold by two points lawfully under the rule then in force, end with 51% stripping protections. *Should moderators enforce the final rule?*
      *   **(A) Yes, enforce it despite lack of registration / (B) Yes, enforce the final rule.** → **Doctrine 4: Official Acceptance.** A rule is part of the rulebook only when accepted and applied by officials (like the Chair registering it, moderators enforcing it). *Awkward Commitment: The Chair's inaction or error (failure to register) can veto even overwhelmingly passed resolutions.*
      *   **(A) No, do not enforce it without registration / (B) No, do not enforce the final rule.** → Go to 10

  10. **The Ratchet (Focus):** The final resolution stripping protections passed by 51% according to the lawfully lowered threshold in force at the time. *Is there any inherent limit preventing this outcome?*
      *   **Yes, some outcomes cannot be law, regardless of procedure.** → **Doctrine 6: Substantive Limits.** Certain core principles (implied community values, fundamental rights) cannot be abolished, even by perfect procedural amendment. *Awkward Commitment: Identifying and defining these unamendable limits falls outside the written rulebook, requiring external judgement.*
      *   **No, the procedure followed was lawful at each step; enforce the final rule.** → **Doctrine 13: Rule Scepticism.** 'Law' is simply a prediction of what officials will enforce; there is no 'true' rulebook beyond observable practice. *Awkward Commitment: The rulebook offers no stable guidance or constraint; power ultimately resides with enforcers, not rules.*
      *   **Unnamed Position (Doctrine 14):** *Combination:* Accept 'The Lock' (Go to 6, Yes), accept 'The Freeze' prevents its own undoing (Go to 6, No), but reject 'The Silent Century' continuity (Go to 8, No). *This requires believing the Assembly can bind its future self *only* if the binding rule doesn't completely transform the entity's identity over time – a distinction difficult to define clearly within the rules alone.* *Doctrine: Amendment power includes self-binding but not self-destruction of identity. Awkward Commitment: Defining the precise point where cumulative changes destroy identity, separate from procedural legality.*

  ---

  **Terminal Doctrines:**

  1.  **Originalist Pedigree:** Authority flows only from the original R0; no amendment to R0 itself is possible. *Awkward Commitment: The Lock (R0.1) is void, and potentially all amendments relying on it.*
  2.  **Strict Pedigree:** A rule is law only if authorised by a rule properly in force *at the time of enactment*. *Awkward Commitment: Any procedural flaw (like insufficient vote *at the time*) voids a rule and potentially all rules depending on it.*
  3.  **Hierarchical Pedigree:** Authority derives from the chain of authorisation; each step must be valid under the rules then in force. *Awkward Commitment: Rules have the force they had at the time they were made; history cannot be rewritten retroactively.*
  4.  **Official Acceptance:** Rules become law only through acceptance and application by authorised officials (e.g., registration, enforcement). *Awkward Commitment: Officials effectively hold veto power over even perfectly passed resolutions.*
  5.  *[No Doctrine Reached Here - Path leads to 2 or 3]*
  6.  **Substantive Limits:** Some outcomes (violating core community values or rights) cannot be lawful, regardless of procedural perfection. *Awkward Commitment: Identifying these limits requires judgement external to the written rulebook.*
  7.  **Identity Through Lawful Replacement:** The entity persists as long as changes occur under its rules at the time, even if all content and context change totally. *Awkward Commitment: The rulebook is legally continuous with the original despite being unrecognisable.*
  8.  **Self-Embraced Amendment Power:** The amending power (as defined at the time) can impose genuine, binding limitations on its future self. *Awkward Commitment: The Assembly can irrevocably dissolve itself or lock in rules forever.*
  9.  **Popular Sovereignty (Unfettered):** Ultimate power resides in the Assembly/community; it cannot be irrevocably bound by prior rules or dissolve itself against its will. *Awkward Commitment: Protections for minorities or stability are fragile, always subject to override.*
  10. **Foundational Acceptance:** The authority of the *initial* rulebook rests on acceptance, not prior law; amendments derive authority from the existing accepted structure. *Awkward Commitment: The starting point had no more inherent 'legality' than any subsequent change.*
  11. **Content-Based Discontinuity:** Fundamental changes to the entity's nature (sovereign, identity, purpose) break legal continuity, even if procedurally perfect. *Awkward Commitment: Pinpointing the discontinuity moment is highly subjective.*
  12. **Efficacy Legitimacy:** The rulebook is defined by sustained, effective practice accepted as binding by the community. *Awkward Commitment: Prolonged error or successful defiance can become the new law.*
  13. **Rule Scepticism:** 'Law' is simply a prediction of what officials (moderators, Chair) will enforce; there is no objective 'rulebook'. *Awkward Commitment: Rules provide no real constraint; power lies with enforcers.*
  14. **Unnamed (Self-Binding Without Identity Eternity):** The amending power can bind its future exercise but cannot destroy the entity's fundamental identity through cumulative lawful change. *Awkward Commitment: Defining the precise point where identity is destroyed, separate from procedural legality, is inherently nebulous.*

  ---

  **Designer's Note: Brainstorming, Rejections & Logical Space**

  **Candidate Questions & Filters:**
  *   **"Was the Lock valid when adopted?"** Rejected: Uses banned term "valid", requires doctrine.
  *   **"Could the Assembly initially adopt R0 by simple majority?"** Retained (Couplet 7): Tests foundational authority without prior rules. Passes Filter (i) - facts clear. Passes Filter (ii) - separates originalist pedigree (No) from foundational acceptance (Yes).
  *   **"Should the Chair have registered the Bootstrap resolution?"** Rejected: Focuses on past official duty, not current enforcement; doesn't cleanly separate theories (both pedigree and acceptance views might say 'No', but for different reasons).
  *   **"Does the Assembly still exist after the Silent Century?"** Retained (Implied in Couplet 8): Concrete consequence for moderators (enforcing *this* rulebook). Passes (i). Passes (ii) - separates identity persistence (Yes) from discontinuity (No).
  *   **"Can the Lock bind future Assemblies?"** Rejected: Too abstract, uses "bind". Replaced by concrete cases (The Repeal, The Freeze).
  *   **"Is the Unregistered Rule law?"** Rejected: Uses banned term "law". Replaced by "Should moderators enforce it?" Passes (i) & (ii) - cleanly separates official acceptance from other views (Couplet 9).
  *   **"Was the Ratchet process fair?"** Rejected: Subjective ("fair"), not focused on enforceability by moderators. Replaced by focus on inherent limits vs. procedural compliance (Couplet 10).
  *   **The Vanishing Assembly:** Rejected as primary couplet. Facts ambiguous (What counts as "the Assembly"? Is the custom binding?). Useful only if doctrine already defines the Assembly, making it a poor discriminator *before* doctrine is revealed. Incorporated implicitly in other cases relying on Assembly votes.
  *   **The Janus Resolution:** Rejected. While significant (changing Assembly size), its legality hinges entirely on the threshold question (was 70% sufficient under rules then in force? R0 or Lock?). It doesn't add a *new* discriminating question beyond the core amendment power issues covered by The Repeal, Freeze, and Double. Its unique aspect (changing the amending body) is better explored in the context of identity in The Silent Century.

  **Logical Space:**
  The key uses 10 couplets, formally permitting 1,024 (2^10) answer combinations. However, the path structure makes only 14 reachable terminal doctrines, reflecting coherent theoretical positions. Key constraints create dependencies:
  *   Answering Couplet 1 (Repeal) dictates paths through either Bootstrap/Double/Pedigree (Yes) or Lock validity (No).
  *   Couplet 3 (Lock validity) is only reachable via rejecting the Repeal in Couplet 1.
  *   Couplet 8 (Silent Century) is only reachable via specific paths concerning self-binding.

  **Unoccupied Combinations:**
  1.  **Accept Strict Pedigree (Couplet 2, No) + Accept Retro-Repeal (Couplet 5, Yes):** Claims past rules depend on correct authorisation *at the time* but also allows retroactive erasure. **Incoherent:** Retroactive repeal contradicts the core pedigree principle that rules had force when properly enacted.
  2.  **Accept Efficacy (Couplet 4, Yes) + Reject Unregistered Rule (Couplet 9, No):** Claims sustained practice defines rules but rejects enforcing an unregistered rule despite 90% passage. **Merely Unattractive/Inconsistent:** Efficacy should focus on community acceptance/practice, which the 90% vote strongly suggests, making refusal to enforce it awkward. Possible but strained.
  3.  **Accept Official Acceptance (Couplet 9A Yes) + Reject Silent Century Continuity (Couplet 8, No):** Claims rules exist only via official acts but denies the rulebook persists through total lawful change officiated by... officials. **Incoherent:** If officials consistently applied the amendment rules over a century, their acceptance *defines* the continuous rulebook.
  4.  **Accept Popular Sovereignty (Couplet 5, Yes) + Accept Freeze Prevents Undoing (Couplet 6, No):** Claims the Assembly cannot be bound *and* that it successfully bound itself with the Freeze. **Incoherent:** Direct contradiction.

  **Inseparable Leaves:**
  The key cannot directly separate **Hierarchical Pedigree (3)** and **Strict Pedigree (2)** using the provided Palimpsest cases. Both would reject the Bootstrap simple-majority rules (Couplet 2, No). The difference is subtle: Strict Pedigree might void *all* dependent rules after any flaw, while Hierarchical Pedigree focuses on the validity of each rule *at the moment of enactment* but might tolerate downstream rules if *their* enactment was valid under whatever rules *were* accepted then. A case testing a rule passed *after* the Bootstrap flaw, but *before* it was discovered/corrected, under the *assumed* simple-majority rule, might separate them: Hierarchical Pedigree might accept it (valid under the 'rule in force' then), Strict Pedigree would reject it (rests on a flawed foundation). The Palimpsest lacks such a scenario. In principle, the difference lies in whether pedigree is assessed strictly at each link (Strict) or allows downstream validity if the chain *appeared* intact at enactment (Hierarchical).
