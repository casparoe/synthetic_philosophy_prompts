prompt: |-
  I teach a graduate seminar in philosophy of religion, and this term we are working through the argument from reasonable non-belief. On the last three offerings of the course I have found myself circling the same complaint about a certain family of replies, and I would like to be able to hand my students a name for it, because right now they keep rederiving it in their papers without realising that they have all hit the same nerve. The complaint is this. Theodicies of hiddenness typically explain why God permits someone to lack relationship with him by citing a good that the absence makes possible: a response that is not coerced, faith as a venture rather than an inference, moral choice made at an epistemic distance, a search that could have gone either way. What I keep noticing is that the goods cited are goods internal to the relationship whose absence is supposed to be explained, so that they are only available to someone who already has one foot inside it. Distance is a good for the person who knows there is someone to be distant from; a venture is valuable in the way alleged only for the one who reaches the shore; trusting without seeing is something you do to a God you believe in, not to a void. So when the explanation is applied to the case it is supposed to cover — a serious, unresentful inquirer who has weighed the matter as carefully as she knows how, concluded that there is no God, and died in that conclusion — the cited good either vanishes or has silently been swapped for a much thinner one: the value of having searched, the value of the option having been open, the contribution her case makes to the ambiguity of the world for others. Nobody would have offered the thin version as the justification in the first place. The reply, in short, is specified in the vocabulary of its own success cases and is then presented as covering the failure cases, where by hypothesis the success never arrives.

  I want to be clear about what I am not asking about, since students conflate this with several neighbouring things. It is not the skeptical-theist point that we should not expect to discern God's reasons: I am perfectly willing to grant that the cited good is real, valuable, and exactly the sort of thing that would justify permitting some privation — my question is about who the good is real for. It is not the unfalsifiability worry about inflating resistance until every actual non-believer counts as resisting; on the contrary, I am stipulating a genuinely non-resistant subject. It is not the familiar requirement that a good be one that could not have been obtained without the evil in question, since my worry concerns whether the good is obtained at all by the person in question rather than whether it could have been got more cheaply. Nor, I think, is it the difference between offering a full theodicy and offering a merely possible defence: making the good merely possible does not help, because the difficulty is in the content of the good, not in its actuality. My own tentative diagnosis is that the argument from hiddenness has an inescapably distributive, person-affecting premise — a perfectly loving God would seek relationship with each individual who is not resisting — while the justifications offered are impersonal and aggregate, goods of there being a world of a certain kind, and that what I am seeing is a slide between the two registers. A colleague suggested it is only survivorship bias in theological dress, which I do not think is right either: survivorship bias concerns which data points the inquirer can see, whereas this concerns which outcome the justification is described from. I also notice two distinguishable variants in the student papers, one where the good requires that the subject end up in relationship and one where the good requires only that she be aware that there is aGod she is separated from, and I am not sure whether these are one phenomenon or two.

  So: does this pattern have an established name in the philosophy of religion, or in some adjacent literature — I have the vague sense that something structurally similar is discussed around risk, lotteries, and retrospective justification, or in debates about person-affecting versus impersonal value, or perhaps under some heading about global versus local theodicies? If it has a name, I want the analysis and not a reading list: what exactly the phenomenon is, what its nearest neighbours are, how it differs from each of them, and which of them it is really an instance of. If it has no name, coin one, define it tightly, and give me the boundary cases that separate it from the neighbours I have listed. I would also like your verdict on three things: whether the two variants I distinguished are genuinely one phenomenon; whether my distributive-versus-impersonal diagnosis is the right description of what is going wrong or merely one symptom of it; and how far the pattern generalises outside theology, since it seems to me to be the same structure as explaining a student's failure to learn by appeal to the value of struggling, or a runner's injury by appeal to the fortitude it built, in the cases where the learning and the fortitude never came.
reasoning: |-
  Okay, let me start by really understanding the user's problem. They teach a graduate seminar on the philosophy of religion, specifically the argument from reasonable non-belief. The issue is that students keep circling around a particular complaint about theodicies of divine hiddenness. The complaint is that these theodicies justify God's hiddenness by appealing to goods that only make sense if the person is already in a relationship with God or at least aware of God. But when applied to someone who genuinely doesn't believe and dies in that state, those goods don't apply. Instead, the justification shifts to thinner, impersonal goods like the value of the search itself or contributing to the world's ambiguity. 

  First, I need to parse the user's description. They mention that the goods cited—like non-coerced response, faith as a venture, moral choice at a distance—are internal to the relationship. For someone who never believes, these goods vanish. The theodicy then substitutes thinner goods, which weren't the original justification. The user wants a name for this logical misstep. They also distinguish two variants: one where the good requires the relationship to exist, and another where it requires awareness of God. 

  The user has already ruled out several related concepts. It's not skeptical theism, unfalsifiability, the requirement of inculpable non-belief, or the distinction between theodicy and defense. Their own diagnosis is that the argument has a distributive, person-affecting premise (God seeks relationship with each individual), but the justifications are impersonal. A colleague suggested survivorship bias, but the user thinks that's not quite right. 

  Now, I recall that in philosophy, there's a concept called "the conditional fallacy" or "conditional good error." That might fit. The fallacy occurs when a good is defined conditionally on the success of the very thing it's supposed to justify. For example, the good of a free choice to believe in God only exists if the person succeeds in believing. Applied to non-believers, it's invalid. But I need to check if this matches the user's case. 

  Looking at the examples: theodicies claim that hiddenness allows for an authentic choice. But for the non-believer, that choice never happens. The good is conditional on belief, so it doesn't apply. The theodicist then switches to thinner goods like the value of the search. That switch is the bait-and-switch aspect. 

  The two variants the user mentioned—requiring relationship vs. awareness—are both conditional on some success state. So they're instances of the same fallacy. The user's diagnosis about distributive vs. impersonal is part of it. The premise is person-affecting, but the justification becomes impersonal when the conditional good fails. 

  Outside theology, this pattern appears in education (value of struggling only if learning occurs) or sports (injury building fortitude, but only if it actually does). The fallacy is general: justifying a process by goods that depend on the process succeeding. 

  So, naming it "Conditional Good Fallacy" makes sense. It's a specific type of conditional fallacy where the good is defined in terms of success. The bait-and-switch is when the arguer substitutes a different good when the original fails. 

  I should also distinguish this from nearest neighbors. Unlike Moore's Paradox, it's not about belief contradiction. It's not just a false dilemma; it's a structural flaw in justification. And it's not survivorship bias because that's about data selection, not justification structure. 

  The user's diagnosis is correct as a symptom: the shift from person-affecting to impersonal goods happens because the conditional good fails. But the core is the conditional structure. 

  So, the answer would define the fallacy, name it, distinguish variants, and show its generality. The name should be precise: "Conditional Good Fallacy" or "Success-State-Dependent Justification." The bait-and-switch is a common rhetorical move accompanying it. 

  I'll structure the response by first naming the fallacy, then analyzing it, addressing the user's questions about variants and diagnosis, and finally showing its application beyond theology.
answer: |-
  Your complaint identifies a precise and undernamed fallacy in hiddenness theodicies. I propose calling it the **Conditional Good Fallacy** (with an accompanying **Bait-and-Switch in Theodicean Scope**). Here's the analysis:

  ### Core Phenomenon: Conditional Good Fallacy
  - **Definition**: The error of justifying a state of deprivation (e.g., divine hiddenness) by appealing to goods *that logically presuppose the successful resolution of that deprivation*. The good is conditional on the subject occupying a cognitive/relational state that, by hypothesis, they never attain.  
  - **Mechanism**:  
    - Theodicies posit Good G (e.g., "authentic faith-venture") as justifying hiddenness.  
    - But G requires Condition C (e.g., belief in God or awareness of divine presence) to be realized *for the subject*.  
    - In non-resistant non-believers (NRNBs), C is never met → G vanishes for them.  
    - The theodicy then implicitly substitutes a distinct, thinner good G* (e.g., "contributing to cosmic ambiguity") that doesn't require C.  
  - **Why "Conditional"**: The good is *internally dependent* on the success of the very process it's meant to justify.  

  ### Nearest Neighbors & Distinctions
  1. **Moore's Paradox** (e.g., "God exists, but I don't believe it"):  
     - *Similarity*: Involves a state (belief) that invalidates the proposition.  
     - *Difference*: Your case concerns justificatory *goods*, not truth conditions. The fallacy arises in *third-person justification*, not first-person assertion.  

  2. **False Dilemma / Non-Securable Goods**:  
     - *Similarity*: Goods that seem impossible to attain.  
     - *Difference*: Your issue isn't that G is impossible, but that it's *inapplicable* to NRNBs. The good isn't "non-securable"—it's *logically incoherent* for the target group.  

  3. **Survivorship Bias**:  
     - *Similarity*: Focus on successful cases obscures failures.  
     - *Difference*: Survivorship bias is epistemic (which data we sample). Your fallacy is justificatory (which goods we attribute). Theodicies describe G *as if* all subjects are survivors.  

  4. **Retrospective Justification Fallacy** (e.g., "The injury was good because it made me stronger"):  
     - *Similarity*: Justification defined from a later privileged state.  
     - *Difference*: In non-theological cases, the subject *reaches* the state. For NRNBs, the retrospective stance is *inaccessible*.  

  ### Your Specific Queries
  1. **Are the two variants one phenomenon?**  
     - *Variant 1*: Good requires actual relationship (e.g., "faith-venture has value only upon success").  
     - *Variant 2*: Good requires mere awareness of God (e.g., "distance enables free choice").  
     - **Yes, both are instances of the Conditional Good Fallacy**. Both define G relative to a success state (relationship/awareness) unattained by NRNBs. The latter is a "lighter" version but still fails for NRNBs (who lack awareness).  

  2. **Is the distributive/impersonal slide the core issue?**  
     - Your diagnosis is **correct but derivative**. The root is the *conditionality* of G. Because G is conditional on success:  
       - For "successful" believers, G is person-affecting.  
       - For NRNBs, G evaporates → theodicy defaults to impersonal G* (e.g., systemic goods).  
     - The person-affecting premise of hiddenness arguments *exposes* this, but the fallacy is in the structure of G itself.  

  3. **Generalization beyond theology**:  
     - **Yes, widely applicable**. Examples:  
       - *Education*: "Struggling builds deep understanding!" (But if the student *never* understands, "struggle" becomes a thin good like "developing perseverance").  
       - *Medicine*: "Painful treatment is justified by cure" (If the patient dies, defenders appeal to "advancing medical knowledge").  
       - *Economics*: "Austerity brings prosperity" (If it causes collapse, proponents cite "moral clarity").  
     - **Pattern**: Justification appeals to a "thick" success-dependent good G, but substitutes "thin" G* when G fails.  

  ### Boundary Cases
  - **Not Conditional Good Fallacy**:  
    - A theodicy citing a good *independent* of belief (e.g., "hiddenness allows natural laws to operate predictably").  
    - A "thin" good *explicitly* offered from the start (e.g., "God permits hiddenness to preserve creaturely autonomy"—even if no one believes).  
  - **Edge Case**:  
    - Goods framed as *process*-oriented (e.g., "the search for truth is intrinsically valuable"). This avoids the fallacy *if* the search occurs without requiring success. But note: your students argue that theodicists don't *lead* with this.  

  ### Proposed Name & Why It Fits
  - **Conditional Good Fallacy**: Directly names the error (G is conditional on C, which NRNBs lack).  
  - **Bait-and-Switch in Theodicean Scope**: Describes the rhetorical move (promising G, delivering G*).  

  This isolates the flaw: theodicean goods are **parasitic on their own success**. Until named, this fallacy lurks as an intuition—your students have indeed struck a nerve that deserves this precise label.  

  ---  
  **Key References for Context** (though you requested analysis, not a list):  
  - Schellenberg's *Divine Hiddenness and Human Reason* (1993) frames the person-affecting premise.  
  - Rea's "Narrative, Liturgy, and the Hiddenness of God" (2018) discusses goods in relationship.  
  - On conditionality: Parfit's *Reasons and Persons* (§§ "Mistakes in Moral Mathematics") for impersonal/personal shifts.
