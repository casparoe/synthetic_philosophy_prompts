answer: |-
  Here’s a reading of *Brokeback Mountain* through your philosophical framework, focusing on the tensions in marriage’s purpose and testing your distinctions against the film’s resistance to easy answers:

  ### Where the Film Tests Your Distinctions
  1.  **Durative vs. Declaratory Functions:**
      *   **Support:** The heterosexual marriages (Alma & Ennis; Lureen & Jack) primarily demonstrate the *durative* function. They create stable (if unhappy) households, manage property/children (Alma), and provide economic structure (Lureen’s business). They are "publicly legible" in the declaratory sense, granting societal acceptance and defining roles ("husband," "wife"). Alma *uses* the declaratory function to confront Ennis about his infidelity – society’s recognition gives her a claim.
      *   **Embarrassment:** The film brutally shows how the *declaratory* function fails Jack and Ennis. Their relationship *cannot* be declared. Ennis’s terror ("This is a one-shot thing we got goin' on here") stems from the deadly consequences of declaration in their world. The declaratory function isn't neutral; it’s weaponized against them. The durative function *could* theoretically exist in Jack's "ranch together" proposal (shared life, economic unit), but it’s inseparable from the impossible need for declaration in their context. The film suggests that for an illicit love, durative stability *requires* declaration, which is lethal.

  2.  **Retrospective Function & Ratification:**
      *   **Support:** Ennis’s final scene with the shirts is *pure retrospective ratification*. It’s not about organizing a future (Jack is dead); it’s a private ritual affirming the *past reality and depth* of their bond. He reverses his earlier "one-shot" denial. This answers your dying man’s worry: Ennis knows a *public* ceremony *now* (even if possible) would misdescribe their life lived in stolen moments, hidden passion, and profound, wordless connection. Ratification, for Ennis, *must* be private to be true to their history. A public wedding would falsify that lived experience.
      *   **Collapse?:** The film *does* show this ratification collapsing into a delayed, *private* declaration. Ennis declares the relationship *to himself* ("Jack, I swear..."). He makes it "legible" only to his own heart and the viewer. It *doesn't* pay the legibility debt to the world. This private ratification is the only authentic one available to him, tragically separated from the public function.

  3.  **Legibility Debt:**
      *   **Accrual:** The debt is crushing. Alma suffers decades of humiliation and economic vulnerability. Lureen lives a lie, her marriage a transactional shell. Jack’s parents erase Ennis from Jack’s life story and legacy. Lureen casually discards Jack’s ashes. Ennis is left utterly alone with his grief, unable to claim his rightful place as mourner. The cost falls on the partners, the spouses, the children (Alma Jr. feeling Ennis's absence), and Jack’s memory.
      *   **"Payment" (The Shirts):** You pinpoint the tragedy perfectly. The shirts ritual *feels* like profound payment to Ennis (and the audience). It ratifies the love *for him*. But it pays *nothing* on the accumulated societal debt. Jack’s parents remain ignorant and hostile, Lureen remains the "widow," Ennis gets no legal standing, no inheritance, no public acknowledgment of his loss. The film emphasizes this by juxtaposing the shirt scene with Ennis’s utter isolation in his trailer. The private ritual pays the *internal* emotional debt but highlights the *external* debt’s devastating, unpaid totality.

  ### Where the Film Resists the Marriage Debate Framing (and Why It Matters)
  The film forcefully presents the **strongest objection:** Jack and Ennis are *not* plaintiffs for marriage rights. Their tragedy isn't *primarily* about exclusion from an institution they crave.

  *   **Masculinity, Silence & Violence:** Ennis’s refusal of Jack’s ranch proposal isn't philosophical; it’s visceral terror rooted in childhood trauma (the murdered rancher). His worldview is shaped by violent homophobia, not by contemplating marriage’s essence. He can't articulate what he wants instead because his socialization forbids him from even conceptualizing a *life* with Jack. His deepest longing ("I wish I knew how to quit you") is expressed as self-loathing. Jack’s proposal is framed as a practical escape ("cow and calf operation"), not a plea for marital recognition. The word "marriage" is never uttered between them.
  *   **Letting the Film Off the Hook?** The film *does* resist being *reduced* to a marriage equality parable. Its core tragedy is the destruction of love by external brutality and internalized shame. **However, it does *not* let the institution of marriage off the hook.** The film brilliantly uses the *contrast* between the functional, durative, *declared* heterosexual marriages (fraught but socially secure) and the deep, authentic, but *illegible* and vulnerable homosexual love to expose:
      *   How the *declaratory* function of marriage is intertwined with societal power and violence. Marriage isn't just a neutral status; it’s a tool of exclusion and erasure for those outside it.
      *   How the *legibility debt* is a direct consequence of being excluded from that declaratory power and the durative stability it facilitates/protects.
      *   How the *desire* for a shared life ("the ranch") – embodying durative *and* declaratory aspirations – is crushed *because* it cannot be made legible/safe within the existing marital/social structure.

  ### What Fiction Adds: The Thing Only a Story Can Show
  *Brokeback Mountain* shows that the **lived experience of love exists prior to, and often in defiance of, the categories built to contain or exclude it.** The philosophical arguments define marriage’s functions (conjugal, revisionist, durative, declaratory, retrospective). The film shows a relationship that *exceeds and challenges* these definitions by the sheer force of its existence and the tragedy of its suppression.

  *   **The Irreducible Bond:** The decades of yearning, the stolen moments of tenderness and passion, the shared history etched on their bodies and souls – this is the core reality the film makes us *feel*. Arguments about marriage’s purpose feel abstract next to the visceral ache of Ennis smelling Jack’s shirt. The story shows the *thing itself* that the arguments struggle to define or accommodate.
  *   **The Cost of Illegibility in Human Terms:** Philosophy talks about "functions" and "debts." The film shows Alma’s crushed spirit, Lureen’s brittle facade, Jack’s fading hope, and Ennis’s soul-crushing grief. It shows the *human wreckage* caused by the legibility debt.
  *   **The Primacy of Private Meaning vs. Public Form:** The film argues, through its climax, that the deepest ratification *can* be private and retrospective (the shirts). It doesn’t solve the public debt, but it asserts that the *truth* of the relationship resides in the hearts of those who lived it, not in the ceremony that might falsely define it after the fact. Ennis’s final oath isn’t witnessed by society, but it’s the most authentic marital vow in the film – a vow of eternal fidelity to the *memory* and *reality* of their bond.

  ### Scenes for Your Third Act
  Set these beside your dying man’s refusal:

  1.  **The Shirts:** The power of a private, retrospective ritual that needs no audience to be true. It affirms the past *as it was lived*, not as society might rewrite it.
  2.  **Ennis's Refusal of the Ranch:** Not as cowardice, but as an articulation (however flawed) of an impossible reality. His fear isn't abstract; it's rooted in lived experience of violence against illegible love. Your character’s refusal might similarly stem from protecting the *integrity* of their past from a well-meaning but ultimately distorting public rewrite.
  3.  **Jack's "I wish I knew how to quit you" / Ennis's "Jack, I swear..."**: Moments of profound, inarticulate emotional truth that define the relationship far more than any legal contract. Your dying man’s refusal might be similarly inarticulate, rooted in a depth of feeling that finds public ceremony reductive or irrelevant to what already *is*.
  4.  **Alma Witnessing the Kiss:** The excruciating pain of the private becoming accidentally, violently public. It shows why secrecy was necessary, making the later push for public declaration feel like a violation of their hard-won, if tragic, way of life.

  **For Your Dying Man:** Let his refusal be an act of fierce, quiet *protection* – not of himself from cowardice, but of the *truth* of the life they built together against the well-intentioned revisionism of a wedding. He’s not rejecting love or commitment; he’s rejecting the idea that a ceremony can define or improve upon what already *was*. Like Ennis, he knows the ratification happened every day, in the shared work, the silent companionship, the unspoken bond that needed no witness but themselves. A wedding now would be a fiction imposed on their truth. His strength lies in holding fast to the authenticity of their illegible, yet profoundly real, union. Let his final moments, like Ennis with the shirts, be his own private vow – "I swear..." – to the life they lived.
