prompt: |-
  I'm 71, retired after thirty-odd years as a research hydrologist (groundwater modelling, mostly), and in the last couple of years I've started going to — and now running — a monthly ideas evening at the village hall. About fifteen people, nearly all retired: several engineers, two GPs, a former accountant, a couple who used to teach. Sixty minutes, a whiteboard, and a house rule that nobody looks anything up mid-session, since a few of them barely use the internet at all.

  Next month's mine and I've rashly promised them "how to think about how long things like countries last." What I actually want across is the outside view: you forecast a case by putting it in a class of comparable cases and looking at what happened to them, rather than by building a story about this one. I did a session last year on the inside/outside contrast, including that story about the team of experts writing a school curriculum who each privately thought they'd be finished in two years, so they've met the basic move and I don't want to spend the hour doing it again. What they haven't met — and what I've realised I can't cleanly explain myself — is the reference class problem: that any case sits in indefinitely many classes, you pick one, and the pick does most of the work. And then the bit where I think the real content is, which is residual life: the mean duration of things of this kind from their founding is not the same quantity as the expected further duration of one that has already lasted 220 years, and you don't get the second by subtracting the 220. That smells to me like the inspection paradox wearing a hat, but I'm not at all confident I can say why without losing the room.

  So: don't explain the outside view to me. Plan how I explain it to them. What I want from you:

  1. The order. What has to be in place before what, and what breaks if I reorder it. I'm assuming the inside/outside contrast goes first because everything else is a refinement of it, but after that I genuinely don't know whether "here is how you pick a class" has to come before or after "here is what the numbers in a class can and can't tell you," and whether residual life is an early framing device or a late payoff.

  2. The carrying case. I've been playing with a made-up polity — call it the Kaveri Dominion: 220 years old, formed out of nine successor states after a long war, currently running a fiscal system everyone agrees is unsustainable, no contested succession in sixty years, and no external rival it can't out-produce. Scrap it or change its features if you like. What I want is an argument for which single example should carry the hour and what that example has to have and has to lack. My instinct is that it needs just enough narrative detail that the inside view is genuinely tempting — a bare label makes for a rigged demo — and that it has to lack any feature that makes one particular class obviously the right one. But I'd rather you committed to a case than agreed with me.

  3. The misconceptions, with positions in the sequence. Here's my list, which is probably wrong in places: (a) the outside view is just the base rate, so more data is always better and you should widen the class to get n up; (b) if you can't find twenty comparable cases the method doesn't apply; (c) the outside view is what you fall back on when you don't understand the mechanism, so it's second best; (d) they'll quietly assume the reference class is given by the world rather than chosen by them, which I think is the big one and the one the example has to set a trap for. Tell me which of these actually show up, which I've invented, what I've missed, and at exactly what point I should head each off — pre-empt it before it forms, or let it get said out loud so I can work with it.

  4. A thing I made up and can't place. I've been fiddling with a quantity I call the strain ratio: contested successions in the last fifty years, over the number of times the state has had to reinvent how it pays for itself in the last fifty years, with some sort of interval around it from the small counts. Is that an outside-view instrument — a way of choosing a class without telling a story — or is it a theory smuggled in wearing statistics? Give me a one-sentence rule I could actually say out loud to the room for telling the two apart, and tell me whether it belongs in this session at all or is a distraction for this audience.

  5. What to leave out, and say out loud that I'm leaving it out. I'm inclined to name and skip two things: whether any of this licenses a real forecast at all (I think it licenses considerably less than people want it to), and the question of whether "empire" or "state" is a stable kind of thing in the first place. Tell me if I'm wrong about either of those, and what else should be on the chopping block for sixty minutes with a whiteboard.

  6. A check. One question to put to them at minute fifty that they can't get right by repeating "use the outside view" — where getting it right shows they have both the class-choice point and the residual-life point, and where the plausible wrong answers tell me which one they missed.

  Be committed: give me one order, one example, one rule on the strain-ratio question, with reasons, not a menu of options I then have to choose between. And where you think there's a real chance I'd lose the room, or where you're just guessing about what retired engineers will and won't follow, say so and say what you'd do instead.
reasoning: |-
  Hmm, this is a fascinating challenge from a retired hydrologist running a village ideas evening. He wants to explain the "outside view" concept to fellow retirees (engineers, doctors, accountants etc.) focusing on two key nuances: the reference class problem and residual life expectancy. 

  The core tension I see is between his deep technical understanding and the need for concrete, non-abstract delivery. His proposed Kaveri Dominion example is smart because it creates a neutral sandbox - real enough to feel plausible but fictional to avoid historical baggage. The strain ratio idea reveals his scientist's instinct to quantify, but I suspect it's a rabbit hole for this audience.

  His misconception list rings true, especially (d) about the invisibility of class selection. Engineers will intuitively grasp that classification isn't objective - they've dealt with material grades or system categorizations where boundaries are fuzzy. The residual life point might actually land better than he expects because actuarial tables (life expectancy at birth vs at 70) are familiar territory for this age group.

  For structure, I'm thinking: 1) Quick inside/outside refresher using Kaveri, 2) Demonstrate class dependency by having them propose different comparison groups, 3) Use a bathtub curve to show why mean lifespan ≠ remaining life, 4) Contrast with human longevity for intuitive resonance. The fiscal crisis detail in Kaveri is crucial - it makes the inside view seductive so we can show its traps.

  His strain ratio needs killing though. It's a disguised theory (succession stability matters more than fiscal reinvention) wearing data clothes. The litmus test I'd suggest: "If you can't explain why the ratio components matter without telling a story, it's not class selection - it's theory." But that's too meta for this session.

  Endgame check: Ask "If we compare Kaveri to empires averaging 300 years, what's wrong with saying it has 80 years left?" The right answer requires both seeing that 300 is overall mean (not conditional) and that the class might be wrong. Engineers might fixate on the latter and miss the actuarial point.
answer: |-
  Here’s a committed plan for your session, designed for clarity, engagement, and avoiding common traps. I’ll follow your numbering strictly.

  ---

  ### **1. The Order**  
  **Sequence:**  
  1. **Inside/Outside View Refresher (5 mins)**  
     - *Why first?* Anchors the session in familiar territory. Use **Kaveri Dominion** immediately: *"Imagine we’re advisors to the Kaveri leaders. They’re worried about collapse. How would *you* approach this?"* Elicit 2–3 inside-view responses (e.g., "unsustainable finances!" or "no rivals!").  
     - *Crucial:* Contrast with outside view: *"But what if we ignored Kaveri’s details and asked: how long do similar polities *typically* last?"*  

  2. **Residual Life Expectancy (15 mins)**  
     - *Why early?* It’s the most counterintuitive and vital point. Use **human lifespan analogy**:  
       - *"If average human lifespan is 80 years, does a 70-year-old have 10 years left? No—they’ve survived infancy, wars, etc. Their *remaining* expectancy might be 15 years. Polities are the same: surviving 220 years changes the calculus."*  
     - Whiteboard a **survivorship curve** (simple version): most states fail young; survivors last longer.  

  3. **Reference Class Problem (25 mins)**  
     - *Why after residual life?* Residual life sets up *why* class choice matters. Pose: *"What class should we put Kaveri in?"*  
       - Brainstorm classes: "All empires?" "Post-war federations?" "19th-century states?"  
       - Show how **each class implies a different lifespan**:  
         - Empires: ~250 years (Roman, Ottoman, etc.)  
         - Modern democracies: ~200 years (and counting)  
         - Post-conflict states: <100 years (many collapsed quickly).  
     - Hammer: **The class you pick dominates the forecast**. Kaveri at 220 could be "young" (if class = long-lived empires) or "ancient" (if class = fragile federations).  

  4. **Misconception Busting & Synthesis (15 mins)**  
     - Address pitfalls explicitly after they’ve seen the moving parts.  

  ---

  ### **2. The Carrying Case**  
  **Stick with Kaveri Dominion but tweak it:**  
  - **Age**: 220 years (to force residual life math).  
  - **Features to keep**:  
    - Formed after war (allows "post-conflict states" class).  
    - Fiscal crisis ("inside-view bait").  
    - No recent succession issues (avoids obvious doom signals).  
  - **Critical additions**:  
    - **No dominant comparator**: Is it an empire? A federation? A nation-state? Ambiguity forces debate over classes.  
    - **Add "founded during early industrial era"**: Allows "industrial-era polities" class (stable) vs. "agrarian-era polities" (less stable).  
  - *Why this works*: Engineers/doctors will dissect mechanisms (finances, rivals), but the outside view *ignores* these. The fiscal crisis is red herring—it’s about survivorship bias.  

  ---

  ### **3. Misconceptions: When to Address Them**  
  **(a) "Outside view = base rate; more data always better"**  
    - *When*: During class selection (Step 3).  
    - *Response*: *"Widening the class (e.g., ‘all states ever’) *seems* rigorous but loses meaning. Comparing Kaveri to Sumerian city-states is useless. Relevance > sample size."*  

  **(b) "Need n=20 cases to apply"**  
    - *When*: Preempt during residual life (Step 2).  
    - *Response*: *"Even sparse data reveals patterns. If 3/4 similar polities collapsed by age 100, a 220-year survivor is exceptional—that tells us something."*  

  **(c) "Outside view is second-best"**  
    - *When*: During refresher (Step 1).  
    - *Response*: *"It’s not about ignorance—it’s about correcting for overconfidence. Experts *always* overweight inside-view stories."* (Cite their own curriculum story.)  

  **(d) "Reference class is objective" (THE BIG ONE)**  
    - *When*: During class brainstorming (Step 3).  
    - *Trap*: Let them propose classes. Then ask: *"Why is ‘empires’ better than ‘industrial-era states’ for Kaveri?"* Force debate.  
    - *Kill*: *"The class isn’t ‘out there’—it’s a choice. And your forecast hinges on it."*  

  ---

  ### **4. Strain Ratio: Rule and Verdict**  
  **Rule to say aloud**:  
  > *"If you can’t defend the numerator and denominator without telling a story about Kaveri’s mechanics, it’s not class selection—it’s theory smuggling."*  

  **Verdict**: **Cut it entirely**.  
  - *Why*: It’s a disguised inside view. Counting "successions" or "fiscal reinventions" implies you know *why* those things matter. For this audience, it’s a distracting detour.  

  ---

  ### **5. What to Leave Out**  
  **Explicitly skip**:  
  - *"Can we actually forecast collapse?"* → *"Today is about *how* to think, not whether to bet your pension."*  
  - *"Are ‘empires’ a real category?"* → *"Philosophers argue this! We’ll use pragmatic classes."*  

  **Also cut**:  
  - Any statistical math (e.g., hazard rates).  
  - Historical deep dives (e.g., Roman Empire case studies).  

  ---

  ### **6. The Check Question**  
  **At minute 50, ask**:  
  > *"We’ve put Kaveri in two classes: (A) ‘Modern democracies’ (average lifespan 200 years, but many are young and still alive), and (B) ‘Post-war unions’ (average lifespan 80 years, most collapsed). Kaveri is 220 years old. What can we say about its remaining lifespan in each class?"*  

  **Right answer**:  
  - For (A): *"Most modern democracies haven’t reached 220, so Kaveri is an outlier. Its remaining life could be long—but the class is poorly defined."*  
  - For (B): *"Surviving 220 years when most collapsed by 80 suggests it’s resilient, but the class might not fit."*  
  - **Must mention both**: Class choice ambiguity AND survivorship effect.  

  **Wrong answers**:  
  - *"Kaveri has -20 years left in (A)"* → Missed residual life.  
  - *"Use (B) because it’s more precise"* → Missed class subjectivity.  

  ---

  ### **Why This Works for Your Audience**  
  - **Engineers/doctors** grasp analogies (medical prognosis, structural fatigue). Residual life mirrors "remaining device lifetime after 10,000 hours of use."  
  - **Whiteboard focus**: Sketch the survivorship curve + class comparison table.  
  - **No jargon**: "Survivorship bias" → "Kaveri’s 220 years prove it’s tough."  
  - **Risk point**: If residual life loses them, **pivot to human lifespan**—it’s universally intuitive.  

  **Stick to this sequence, and Kaveri’s ambiguity will make the reference class problem undeniable**. Go get ’em.
