answer: |-
  ### Desiderata for Decision Rules under Undefined or Order-Dependent Expected Value

  1. **Permutation Invariance (Non-negotiable)**  
     Relabeling states of the world (e.g., swapping payoffs for different coin-flip sequences) must not alter the prospect's value.  
     *Case: Relabeler.* Paying for a permutation changes nothing tangible, so differential valuation enables Dutch books or cycles (pay to relabel A→B, then B→A). Violations imply incoherence.  

  2. **Stochastic Dominance (Non-negotiable for dominance-first camp)**  
     If prospect A pays ≥ prospect B in every possible state, A must be weakly preferred. Strict dominance requires strict preference.  
     *Case: Split ticket.* Buying both tickets (Pasadena game) must be at least as good as holding only one, as combined payoffs dominate individual tickets state-wise.  

  3. **Additivity (Repair-the-expectation reflex)**  
     The value of two prospects combined must equal the sum of their separate values when they share a probability space.  
     *Case: Split ticket.* If each half-ticket (St. Petersburg ±) has value ±∞, their sum should match the whole Pasadena game’s value (e.g., ln 2).  

  4. **Cutoff Consistency (Repair-the-expectation reflex)**  
     Finite approximations via truncation (stop after *N* tosses) and capping (bound payouts at ±*M*) must converge to the same limit.  
     *Case: Two cutoffs.* Truncation yields alternating harmonic partial sums; capping distorts tail behavior. Repair requires agreement.  

  5. **Long-run Frequency Agreement (Drop-expectation reflex)**  
     Assigned value must equal the almost-sure limit of average payoffs in repeated plays.  
     *Case: Long run.* Pasadena’s running average diverges; if no limit exists, this desideratum is a frequentist prejudice.  

  6. **No Arbitrary Order Dependence (Non-negotiable)**  
     Valuation must not rely on a specific summation order (e.g., "natural" coin-toss sequence).  
     *Case: Pasadena game.* Rearranging terms alters the "expected value" arbitrarily (to any real number), violating objectivity.  

  7. **Cycling Avoidance (Non-negotiable)**  
     Free reversible relabeling must not create preference cycles (e.g., pay to switch A→B, then pay to switch B→A).  
     *Case: Relabeler.* Akin to Dutch books; failure implies money-pumps.  

  8. **Finiteness for Conditionally Convergent Cases (Repair-the-expectation reflex)**  
     Conditionally convergent prospects (e.g., Pasadena) should have finite values.  
     *Case: Pasadena game.* Natural-order summation gives ln 2; repair seeks to retain this.  

  ### Suspected Conflicts and Key Challenges  
  - **Fatal conflict**: **Permutation Invariance** (1) and **Finiteness** (8) clash. Permuting Pasadena payoffs changes the series sum arbitrarily, so a finite order-invariant value is impossible without violating additivity or dominance.  
  - **Most lethal requirement**: **No Arbitrary Order Dependence** (6). It kills any rule relying on "natural" order (e.g., principal value approaches) and forces alternatives like:  
    - Dominance-first (ignore expectation, use dominance bounds).  
    - Drop-expectation (e.g., use lexicographic preferences or tail events).  
    - *Repair* fails here—it needs order to assign ln 2.  

  **Summary**: Non-negotiables (1, 2, 6, 7) ensure coherence; camp-specific reflexes (3, 4, 5, 8) reveal philosophical divides. The Pasadena game epitomizes the tension: no rule satisfies all while handling order dependence robustly.
