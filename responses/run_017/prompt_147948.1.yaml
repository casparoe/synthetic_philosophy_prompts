          6. Tally the votes and record on the whiteboard.

       - After all rounds, we debrief.

     Debrief:

       We reveal the states for each round and show the results.

       We point out:

          - In baseline rounds (1 and 2): we had p=0.6. The group was correct in both? (We hope so) and then we say: the group did well? Why? Because each was better than a coin flip and they voted independently.
          - In the expert round (3): the group was only as good as the expert (70%). We see that even though the expert is more accurate than an individual (70% vs 60%), the group of 24 independent 60%-accurate voters would have been more accurate than 70%? (We can compute: for n=24, p=0.6, the probability of correct majority is about 0.84). But in this round, we only had one expert, so the group was 70% accurate? And we had one trial: it might have been wrong? Then we say: even if it was right, 70% is less than 84%? But we have only one trial. We can say: the group's accuracy in this round is exactly the expert's accuracy, which is 70%, and that is less than what we expect from the baseline group? And why? Because they all followed the same source -> correlated errors.

