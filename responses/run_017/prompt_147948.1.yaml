       - Prepare index cards for each round and each student. Label by round and student? Or just by round, and hand out one per student per round.

       - Also, for the two-types round, we need to assign roles and also instruct the unreliable to be confident. We can do that by writing on their card: "Unreliable: Your signal is only 40% accurate. However, during the discussion period, you must speak first and argue forcefully for the vote that your signal indicates."

     In class:

       - Arrange chairs in a circle or around a table.
       - Whiteboard: draw a table to record the results:

