          1     |   A   |    ?    |    ?    |        ?          |
          ...

       - For each round:

          1. Announce the round number.
          2. Hand out the index cards for that round (one per student). For the expert round, we don't hand out cards? We just write the memo on the board.
          3. For the expert round: write the expert memo on the board. Then say: "This round, there is an expert memo. Please base your vote on the expert memo." Then they vote.
          4. For other rounds: students look at their signal and think. 
             - In the two-types round, they also see their role and instructions. Then we have a discussion period (2 minutes) where we encourage them to discuss freely. We hope the unreliable ones will dominate the discussion.
          5. Vote: 
             - In sequential voting round: first, we collect the votes of the first four (they write on a card and hand it in, then we read them aloud and record). Then the remaining 20 vote simultaneously.
