answer: |-
  ### Condorcet Jury Theorem Seminar Activity Design  
  **Core Idea:** Students experience how group decision-making succeeds or fails based on two fragile assumptions: individual competence (>50% accuracy) and statistical independence of errors. Variants deliberately break these assumptions to show common failure modes.

  ---

  ### **Setup**  
  - **Hidden State:** Two possible candidates: **Candidate X** (truly better) or **Candidate Y** (truly worse).  
  - **Signals:** Index cards pre-printed with "X" or "Y" (accuracy varies by round).  
  - **Voting:** Secret ballot via folded index cards collected in an opaque bag.  
  - **Incentive:** Correct group vote = chocolate/token (1 per student). Incorrect = nothing.  
  - **Whiteboard:** Track results per round:  
    | Round | True State | Group Vote (X:Y) | Correct? | Notes |  

  **Pre-Session Prep:**  
  1. Assign each student a fixed ID (1–24) for role assignments.  
  2. Pre-generate signals for all rounds (using random draws based on planned accuracy).  
  3. Prepare envelopes per round: 24 signal cards + any special instructions.  

  ---

  ### **Rounds (Total: 6 Rounds, ~45 mins)**  
  **Round 1: Baseline Independence**  
  - **Goal:** Establish competence >50%, independence → high group accuracy.  
  - **Mechanics:**  
    - True state: X (flip coin pre-session; use X for simplicity).  
    - Signals: 70% accurate (i.e., P(signal=X | true=X) = 0.7).  
    - Vote: Simultaneous secret ballot.  
  - **Debrief Hook:** *"Record baseline group accuracy."*  

  **Round 2: Expert Memo (Correlated Errors)**  
  - **Goal:** Break independence via shared information.  
  - **Mechanics:**  
    - True state: Y.  
    - Signals: 70% accurate, **but** all students receive the same "expert memo" (70% accurate) *before* their private signal.  
    - Vote: Secret ballot (students may ignore/weight memo).  
  - **Debrief Hook:** *"Compare to Round 1: Why did accuracy drop despite the ‘expert’?"*  

  **Round 3: Sequential Voting (Herding)**  
  - **Goal:** Break independence via public reveals.  
  - **Mechanics:**  
    - True state: X.  
    - Signals: 70% accurate.  
    - **Voting:** First 4 students (randomly chosen) announce votes aloud. Remaining 20 vote secretly after hearing them.  
  - **Debrief Hook:** *"Did early votes sway others? Did herding help or hurt?"*  

  **Round 4: Confidence vs. Competence (Heterogeneous Reliability)**  
  - **Goal:** Show that unweighted voting fails when competence varies.  
  - **Mechanics:**  
    - True state: Y.  
    - **Roles:**  
      - 6 "Unreliable" (ID 1–6): 40% accurate. **Instructed privately:** *"Argue forcefully for your signal in discussion."*  
      - 18 "Reliable" (ID 7–24): 75% accurate.  
    - **Process:** 3-min open discussion → secret ballot.  
  - **Debrief Hook:** *"Did confidence overshadow competence? Should we weight votes?"*  

  **Round 5: Inverted Accuracy (<50%)**  
  - **Goal:** Show majority rule harms accuracy when individuals are incompetent.  
  - **Mechanics:**  
    - True state: X.  
    - Signals: 40% accurate (i.e., more likely *wrong*).  
    - Vote: Secret ballot.  
  - **Debrief Hook:** *"Group size increased—why did accuracy collapse?"*  

  **Round 6: Asymmetric Weighting Experiment**  
  - **Goal:** Introduce optimal weighting (log-odds) as a solution.  
  - **Mechanics:**  
    - True state: Y.  
    - Same roles as Round 4 (6 unreliable, 18 reliable).  
    - **Vote:** Students told: *"Reliable voters’ ballots count as 2 votes; unreliable as 1 vote."*  
  - **Debrief Hook:** *"Did weighting restore accuracy? Why?"*  

  ---

  ### **Debrief (25 mins)**  
  **Step 1: Reveal the Theorem**  
  - *"What you experienced has a name: Condorcet Jury Theorem."*  
  - Write theorem on board:  
    > *If (1) each voter has competence >50%, and (2) errors are independent, then majority rule accuracy → 100% as group size increases.*  

  **Step 2: Map Rounds to Assumptions**  
  | Round | Broken Assumption | Observed Failure |  
  |-------|-------------------|------------------|  
  | 1 | None (baseline) | High accuracy (theorem works) |  
  | 2 | Independence | Shared expert → correlated errors → lower accuracy |  
  | 3 | Independence | Early-vote reveals → herding → amplified errors |  
  | 4 | Uniform competence | Confident but unreliable voters swayed group |  
  | 5 | Competence >50% | Accuracy decreased with group size |  
  | 6 | N/A (solution test) | Weighting by reliability improved accuracy |  

  **Step 3: Key Takeaways**  
  1. **Fragility:** The theorem’s "good news" holds *only* under strict assumptions.  
  2. **Real-World Violations:**  
     - **Expert reliance** → breaks independence.  
     - **Deliberation/herding** → breaks independence.  
     - **Ignoring competence differences** → breaks uniform competence.  
  3. **When Group Size Hurts:** If average competence <50%, bigger groups *reduce* accuracy.  
  4. **Weighting Fix:** Optimal weights use **log-odds**: \( w_i = \log\left(\frac{p_i}{1-p_i}\right) \).  
     - *Clarify:* Your memory is correct. Weight is proportional to log-odds of individual accuracy.  

  **Step 4: Controversies & Caveats**  
  - **Settled Math:**  
    - CJT’s conclusion flips if average competence <50%.  
    - Optimal weights = log-odds (if competences known).  
  - **Contested Interpretations:**  
    | Issue | Consensus? | Key Debate |  
    |-------|------------|------------|  
    | Deliberation’s net effect | No | Pro: Shares information. Con: Creates correlation. Real-world data mixed. |  
    | CJT as defence vs. warning | Both | Defends majority rule *if* assumptions hold; warns they rarely do. |  
    | Handling correlation | No consensus | Options: Weighting, silent voting, subgroups—no silver bullet. |  
  - **Activity Limitations:**  
    - **Asymptotics:** N=24 is small; CJT’s "→100%" is theoretical (mention but don’t fixate).  
    - **Real Discussion:** Activity signals are artificial; real debate *might* generate novel insights (but often correlates errors).  

  ---

  ### **Predictable Pitfalls & Mitigation**  
  1. **Small-Sample Noise:**  
     - *Risk:* One round may defy expectations (e.g., inverted round accidentally correct).  
     - *Fix:* Emphasize *theoretical expectations* in debrief. Run multiple rounds per condition if time (e.g., two inverted rounds).  

  2. **Signal Peeking/Cheating:**  
     - *Risk:* Students share signals during voting.  
     - *Fix:* Strict secret ballot; collect votes in opaque bag. Remind: "Your signal is *private*."  

  3. **Anti-Correlation Leak (Inverted Round):**  
     - *Risk:* Students realize signals are anti-correlated.  
     - *Fix:* Obfuscate by mixing rounds; debrief: "This models a world where bias *systematically* misleads voters."  

  4. **Overzealous Unreliable Voters:**  
     - *Risk:* Unreliable students (Round 4) enjoy role and disrupt later rounds.  
     - *Fix:* Reset explicitly: *"Roles end after this round. Return to neutral voting."*  

  5. **Time Crunch:**  
     - *Risk:* 6 rounds run long.  
     - *Fix:** Skip Round 6 if needed; use it to illustrate solutions if time permits.  

  ---

  ### **Why This Works**  
  - **Gut-Level Insights:** Students *see* accuracy drop when:  
    - An "expert" is consulted (correlation).  
    - Early voters speak (herding).  
    - Group grows but competence <50% (inversion).  
  - **No Lecture Needed:** Failure modes emerge from gameplay.  
  - **Stakes:** Tokens/chocolate incentivize truth-seeking without complexity.  
  - **Debrief Links to Real Experience:** Faculty hiring example shows how "open discussion" breaks independence.  

  **Final Note:** The activity simplifies reality (e.g., no novel insights from debate), but this sharpens the lesson: *When CJT assumptions break, majority rule can manufacture error.* Pair with readings on deliberation’s trade-offs for nuance.
