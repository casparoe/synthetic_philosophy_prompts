     The mathematics: for p>0.5, the probability of correct majority ->1 as n->infty. For p<0.5, it ->0. And it depends on independence.

     We also want to discuss:
        - The optimal weighting when voters have different p_i: the optimal weight is proportional to log(p_i/(1-p_i)). We can mention that in the debrief and say: if we had weighted the reliable voters more, we might have done better.

     What is controversial?
        - Whether deliberation is net positive or negative: it might improve the quality of individual judgments by sharing information, but it might also introduce correlation. There is literature on both sides. In our activity, we showed two forms of deliberation (expert memo and discussion) that introduced correlation and hurt. But in real life, deliberation might also allow voters to update their beliefs and become more accurate? So it's contested.

