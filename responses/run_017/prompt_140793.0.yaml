prompt: |-
  I want a case analysis that runs in both directions, and I want it conducted at the level of the machinery rather than at the level of headlines. The case is the quantum supremacy exchange of October 2019. As I have the facts: a group at Google published a paper reporting that their 53-qubit superconducting processor, Sycamore, sampled the output of a pseudo-random quantum circuit — depth 20, 430 two-qubit and 1,113 single-qubit gates, predicted total fidelity about 0.2 percent — a million times in roughly 200 seconds, and that the equivalent task would take a state-of-the-art classical supercomputer approximately 10,000 years; they described this as an experimental realization of quantum supremacy for that specific task, and wrote that in reaching this milestone they show that quantum speedup "is achievable in a real-world system and is not precluded by any hidden physical laws." They verified the device with cross-entropy benchmarking, which compares observed bitstrings against ideal probabilities obtained from classical simulation, and which becomes intractable to compute precisely in the regime where supremacy is claimed. Days later IBM replied, in a research blog post, that an ideal simulation of the same task could be run on a classical system in 2.5 days and with far greater fidelity, that Google's estimate had assumed a Schrödinger-type simulation whose state vector must fit in RAM and so had failed to account for plentiful disk storage, and that on the original meaning of the term — coined some years earlier for the point at which quantum computers do what classical computers cannot — the threshold had not been met. Take all of that as given: I have no wish to re-adjudicate the hardware claims, I do not trust my memory of what happened in the years since, and you should not lean on yours either, so treat later improvements in classical simulation as a trend whose direction but not whose magnitude is known and build nothing on any specific later result. Please also give me no references or reading suggestions; I can find those myself.

  The lens I want is computational complexity, and specifically its standing to say anything about a real experiment. What I am after is a disciplined mapping: what, exactly, are the relata here — a problem family or a single finite instance, a machine or an algorithm, a cost model or a complexity class — and what would count as evidence for or against the claim, and what would falsify it? Then tell me what the theory licenses the participants to have said. Could complexity theory have underwritten Google's claim as stated, or only some weaker relative of it? And was IBM's objection one the theory can even express, given that it turns on secondary storage, constant factors, and the price of hardware — quantities that complexity theory defines itself as indifferent to? I want you to be explicit about where the theory is silent: at a fixed width of 53 qubits every one of these runtimes is a constant, and the difference between ten thousand years and two and a half days is a factor of about a million, which the asymptotic machinery has no vocabulary for, since it is precisely the kind of slack that the theory quotients out.

  To help structure this, here are three distinctions I have been toying with, and I want you to say which of them does real work, which merely restates something standard, and which is muddled. First, epistemic versus ontic supremacy: doing something no classical computer is currently known to do efficiently, versus doing something no classical computation could do in principle — where only the second is a claim about complexity classes, and only the first is something an experiment could ever show. Second, model-relative supremacy: the claim is implicitly about a classical cost model, and the Google–IBM disagreement is a disagreement about which resources the model is allowed to count, not about engineering. Third, what I have been calling hardness laundering: the slide from an asymptotic conjecture about a family of sampling problems, through a finite measurement of 200 seconds on one instance, to a statement about what no classical computer can do, with the conjecture doing its work invisibly in the middle. If one of these is wrong-headed, say why and replace it with something better.

  Finally, the verdict I want is about the framework rather than the hardware. Does this episode count as a partial confirmation of the extended Church–Turing thesis's negation — evidence that no hidden physical law blocks quantum speedup — as an anomaly, or as a case the theory never anticipated, in which a finite, noisy, industrially funded benchmark is used to test a thesis about asymptotic classes and sampling problems that admit no efficiently checkable certificate? Does it suggest that we should replace the thesis with something concretely benchmark-relative, and does the deliberate uselessness of the chosen task matter to what the experiment tells us about scaling toward useful ones? Say plainly how confident you are in what you claim, separating what is straightforwardly a matter of mathematical fact from what is interpretation, and single out the one claim you are least sure of, together with what would change your mind about it. Write it as continuous prose — no headings, no bullet points, no bold or italic emphasis, no tables, nothing that looks like a handout — the way you would write a longish email to a colleague who already knows the background, and keep it around a thousand words.
