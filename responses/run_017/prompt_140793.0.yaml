answer: |-
  The quantum supremacy experiment and its subsequent debate reveal fundamental tensions between computational complexity theory and physical implementation. Let's dissect the relata and evidentiary standards before addressing your distinctions and verdict.

  **Core Relata and Claims:**  
  Google's claim centers on a *specific computational task*: sampling from the output distribution of one fixed 53-qubit quantum circuit. The *problem family* is random circuit sampling (RCS), conjectured to be classically hard asymptotically. Their *evidence* is empirical runtime (200s quantum vs. 10,000-year classical projection) and cross-entropy benchmarking (XEB) fidelity. Crucially, XEB relies on comparing observed outputs against *classically simulated ideal probabilities* for the *same circuit*, which becomes intractable for larger instances.  

  IBM's rebuttal disputes the classical runtime *for this specific instance*, arguing that optimized use of classical resources (disk storage for state vectors) reduces the time to 2.5 days. This exploits a gap in complexity theory: asymptotic models (e.g., Turing machines) ignore hardware-specific resources like RAM-disk tradeoffs. Since 53 is fixed, both runtimes are constants, and complexity theory has no machinery to distinguish them—it would view both as O(1).  

  **Your Distinctions Examined:**  
  1. **Epistemic vs. Ontic Supremacy:** This does real work. Google’s experiment demonstrates *epistemic supremacy*: no *known* classical algorithm could perform this task efficiently at the time. Complexity theory cannot prove *ontic supremacy* (BPP ≠ BQP) for RCS; it remains a conjecture. Experiments can only falsify epistemic claims (e.g., "no existing supercomputer solves this in feasible time") but cannot establish ontic impossibility. IBM successfully attacked the epistemic claim by identifying a better classical algorithm.  

  2. **Model-Relative Supremacy:** This restates a standard complexity insight. Classical "hardness" is defined relative to a computational model (e.g., RAM model, circuit depth). Google used a Schrödinger-Feynman hybrid model assuming state vectors fit in RAM; IBM invoked disk-backed parallelism. Complexity theory *can* express this—it would classify IBM’s approach as a space-time tradeoff—but dismisses it as a constant-factor optimization. The theory’s indifference to secondary storage is a feature, not a bug, but it limits applicability to fixed-size experiments.  

  3. **Hardness Laundering:** This is the crux. Google’s argument implicitly chainded:  
     (a) RCS is *asymptotically* hard for classical machines (conjecture);  
     (b) Their 53-qubit instance *inherits* this hardness (extrapolation);  
     (c) The measured speedup *probes* the conjecture (experiment).  
  The vulnerability lies in (b): asymptotic hardness does not guarantee hardness for finite *n*. Constant factors (like disk access) dominate at small scales. Complexity theory licenses only a *conditional* claim: *if* RCS is asymptotically hard, *then* this experiment suggests quantum speedup is physically realizable. It cannot underwrite Google’s unqualified "no hidden physical laws" statement.  

  **Verdict on the Framework:**  
  This episode is an *anomaly* for complexity theory, not a falsification of the Extended Church-Turing Thesis (ECT). ECT concerns asymptotic efficiency classes (P, BPP, etc.) for *decision problems*. Google’s experiment involved a *sampling problem* with no efficiently verifiable certificate—a category complexity theory handles less crisply. The finite, noisy nature of the task and the lack of cryptographic-style worst-case guarantees place it outside ECT’s direct scope.  

  The "deliberate uselessness" is pivotal. Sampling problems were chosen precisely because they avoid the certificate issue, allowing verification via XEB on classically tractable sub-instances. However, this also decouples the result from "useful" quantum speedup. Scaling to practical problems (e.g., factoring) requires error correction and may face different physical constraints. The experiment shows quantum speedup *is physically possible* for *some* tasks but does not predict its viability for others.  

  Confidence breakdown:  
  - **High confidence:** Complexity theory cannot directly validate or invalidate finite-instance claims. Google’s extrapolation relied on conjectures; IBM’s retort exploited model dependencies. Both are consistent with theory.  
  - **Moderate confidence:** The episode highlights a mismatch between theory (asymptotic, model-agnostic) and experiment (finite, hardware-bound). It suggests supplementing complexity classes with *benchmark-relative complexity*—e.g., resource-bounded hardness for fixed *n*—though this risks becoming an engineering metric.  
  - **Least confident claim:** That this constitutes evidence against ECT. ECT could still hold if RCS is in BPP (unproven), or if quantum noise prevents scaling. What would change my mind? A proven asymptotic separation (BPP ≠ BQP) for a natural problem, or a scalable quantum algorithm solving a classically hard decision problem.  

  Ultimately, the exchange underscores complexity theory’s role as a *conjecture-generator* for experiments, not an arbiter of finite cases. The theory remains silent on constant factors, noise, and hardware innovations—precisely where the 2019 clash occurred.  

