  ### Revised Principle
  **Principle:** Before learning which state of the world obtains, choose the policy (a rule mapping states to actions) that maximizes your expected utility, using prior probabilities over states that were genuinely uncertain and causally independent of your policy. Then, in the realized state, follow the chosen policy without deviating due to state-specific information. If a state was impossible (probability 0) or fixed prior to policy choice, exclude it from the expectation.

  This principle preserves your verdicts in (1), (2), (3), (4), and (6) by relying on ex-ante expectations, but overturns (5) because the digit of pi is a fixed truth with no prior uncertainty. It also provides clear thresholds for accuracy-dependent cases like (7) and resolves the lab-report variant of (4). Below, I test the principle against your cases, explain overruled verdicts, and derive new predictions.

