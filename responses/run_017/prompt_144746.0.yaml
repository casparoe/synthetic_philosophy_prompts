answer: |-
  Your vocabulary maps onto karma with striking clarity—until it collides with the normative core. Here’s the translation, the residue, and the verdict.  

  **The Claim in Kinetics:**  
  An intentional act perturbs an agent’s state-space, deforming the free-energy landscape. This creates path-dependent hysteresis: trajectories now bend toward attractors (fruits) proportional to the act’s "weight" (intention’s intensity/direction). Suffering or fortune are not imposed settlements but inevitable arrivals at basins shaped by the perturbation. "Fitting" reduces to dynamical inevitability under deformed boundary conditions.  

  **What Survives:**  
  - **Ledger vs. Landscape:** Your suspicion holds. A conserved quantity (ledger) cannot exhaust without transfer. Liberation as an absorbing state *requires* the landscape model: nirvana is the collapse of all gradients, flattening the propensity field. No conserved karma-balance remains; the system ceases to traverse deformable state-space.  
  - **Intention’s Weight:** Catalytic analogy fits. Intention isn’t fuel but a catalyst lowering barriers to specific trajectories. Strong intention reshapes the landscape steeply, deepening basins (likely outcomes). Graded weight reflects perturbation amplitude.  
  - **Redirection/Transfer:** Possible only in the landscape view. A perturbation (act) propagates through coupled subsystems (agents), altering *their* local landscapes (e.g., merit transfer). No substance transfers—propagation is field-deformation.  
  - **No-Self Persistence:** Soliton/flame analogy is structurally sound. A karmic pattern propagates as a coherent excitation through causally contiguous states (life-states), conserving nothing. The substrate (awareness/aggregates) carries the pattern transiently.  

  **What Fails:**  
  - **The Normative "Ought":** Kinetics maps *how* consequences arise, not that they *should*. "Fitting" in thermodynamics means path-dependent inevitability; "fitting" in moral desert implies cosmic endorsement. The latter vanishes.  
  - **Mapping Ambiguity:** Tradition’s refusal to specify act-outcome details isn’t coarse-graining. Coarse-graining preserves statistical predictability; here, unpredictability is ontological. It’s declaring the full Hamiltonian unknowable—system sensitivity exceeds any computable model.  

  **The Residue & Verdict:**  
  The drop is precisely the normative remainder: the idea that suffering *ought* to follow evil acts as cosmic justice. Your vocabulary exposes karma as a sophisticated causal mechanics—intention perturbs, landscape deforms, trajectory follows—with zero normative operators. This failure isn’t your vocabulary’s defect; it reveals that retributive karma is a linguistic graft onto a causal framework. The "moral desert" reading is less a description than a cultural trope, borrowing punitive language while the mechanics operate amorally.  

  **Decisive Reason:**  
  Thermodynamics and kinetics are *consequence-agnostic*. They describe path-dependency, not propriety. When the tradition insists suffering "fits" the act, it adds a layer extrinsic to the causal structure—one absent in thermodynamics, where "fitting" only means compatibility with initial conditions and landscape topology.  

  **What Would Change My View?**  
  If you could derive the "ought" from the second law itself (e.g., prove moral desert is thermodynamically necessary), the retributive reading would gain footing. Alternatively, if liberation required settling karmic "debts" (conservation), the ledger model—and its normative tone—might resurface. Neither holds.  

  **Final Note:**  
  Karma in your terms is a dynamics of embodied cognition: acts tune the phase space of suffering/awakening. Liberation is escape from the kinetic network into an absorbing state. The residue—the "ought"—isn’t in the equations but in how we *name* the basins. That silence speaks volumes.  

  —  

  (This prose deliberately avoids scaffolding to honor your request. I’ve tested your suspicions against the mechanics: landscape model validated, soliton analogy sustained, normative core exposed as exogenous. The flame burns, but it casts no moral shadow.)
