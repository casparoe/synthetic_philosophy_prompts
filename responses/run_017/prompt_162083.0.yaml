answer: |-
  Here's a reconstruction of the implicit philosophy of mind in your research policy system, analyzing the tensions, the "homology rule," alternatives, and epistemic status:

  **The Implicit Framework: Pragmatic Hybridism with Functionalist Leaning**
  Your practice isn't a pure, consistent philosophical theory. It's a *pragmatic hybrid*, primarily leaning towards **functionalist foundations for welfare/severity assessment** but incorporating **mechanistic constraints (often implicitly identity-theory-inspired) for translational validity**. Here's the breakdown:

  1.  **Severity Assessment (Pain, Distress): Functionalist Core.**
      *   **Practice:** Attributing pain/anxiety based on behavioral proxies (vocalizations, facial coding, escape/avoidance, physiological changes) even in phylogenetically distant animals (rodents, zebrafish).
      *   **Implicit Philosophy:** Strong functionalism. Mental states like pain are defined by their causal role: sensory input (noxious stimulus) -> internal state -> behavioral/physiological output (avoidance, distress calls, hormonal changes). The specific neural substrate is secondary; if the functional role is sufficiently similar, the state is attributed. Multiple realizability is tacitly accepted here. The justification is ethical: if it *functions* like pain, treat it as pain, regardless of precise homology.

  2.  **Translational Validity & Mechanism-Hunting: Mechanistic Constraints.**
      *   **Practice:** Demanding conserved circuits/molecular mechanisms for complex cognitive/affective findings (e.g., specific depression/anxiety mechanisms, memory recall) to accept rodent/zebrafish findings as predictive for humans. Doubting insect cognition, organoid mentality.
      *   **Implicit Philosophy:** A mixture of:
          *   **Empirical Pragmatism:** Deep-seated skepticism about the *reliability* of functional equivalence alone for complex traits across large evolutionary distances. The history of translational failure fuels this.
          *   **Implicit Identity-Theory Leaning:** While perhaps not a full metaphysical commitment, there's a strong intuition that for *specific, complex psychological mechanisms* (not just basic pain), the implementation details *matter crucially* for whether the "same" state or process exists in humans. Homology is seen as strong evidence for shared implementation.
          *   **Causal Depth Requirement:** A behavioral match might be coincidental or superficial. Identifying the conserved mechanism provides stronger evidence it's the *same causal process* operating, increasing confidence in human applicability.
      *   **Distinction from Pure Identity Theory:** It's not usually claiming that pain *is identical to* C-fibre firing in all possible worlds. It's claiming that for a rodent finding about *specific serotonin receptor modulation of learned helplessness* to predict human antidepressant response, we need strong evidence the *human system uses the same receptor in the same circuit for a functionally analogous process*.

  **The Inconsistency? Tension, Not Strict Contradiction.**
  *   **Severity Side (F):** "This zebrafish behavior *functions* like mammalian anxiety, so we must assign a high severity band (treat it as anxiety)."
  *   **Mechanism-Hunting Side (M):** "This zebrafish anxiety-like behavior, while concerning for welfare, tells us little reliable about *human GAD treatment targets* unless we find the conserved molecular mechanism."
  *   **Resolution?** The practice uses different standards for different purposes:
      *   **F for Welfare:** Attributing states based on functional role for ethical protection. Requires a lower threshold of evidence (behavioral proxy).
      *   **M for Translational Prediction:** Attributing *predictive validity for specific human mechanisms* requires a higher threshold (demonstrated conserved mechanism). The institution isn't strictly saying the zebrafish *doesn't have anxiety* (it likely acts as if it does), but it *is* saying that anxiety in zebrafish, driven by mechanism X, doesn't necessarily predict anything about human anxiety driven by mechanism Y, *even if the behaviors look similar*.
  *   **Is it One Theory?** It's a *pragmatic application* of functionalism for ethics, combined with a *cautious, empirically motivated constraint* (leaning towards mechanistic identity) for complex translational claims. It avoids the extremes of pure functionalism (insects have beliefs!) and pure identity theory (only humans/higher mammals have real pain!).

  **The "Homology Rule": Betrayal or Application?**

  *   **Betrayal of the Functionalist Core:** The homology rule explicitly rejects the core functionalist tenet that functional equivalence alone provides evidence. It elevates mechanism over function for *all* evidential claims about human psychology. This directly contradicts the logic used in severity assessment (where function *is* sufficient for state attribution).
  *   **Application of the Mechanism-Hunting Instinct:** It takes the strong mechanistic constraint currently applied to *complex, mechanism-specific translational claims* and applies it universally, making it the *only* source of evidence. It formalizes the implicit identity-theory leaning present in the translational validity side.
  *   **Your Sense is Largely Correct:** The homology rule is what a strong identity theorist (or a theorist who believes mental kinds are individuated by their physical realization) *should* want for translational evidence. It *would* push research towards human-centric models (organoids, MPS, simulations).
  *   **Consequence:** Adopting this rule *would* force the "mind model vs. mind" question for organoids/simulations:
      *   If the rule demands *homology*, then only models using human cells/tissue (like organoids) could qualify. But is a cortical organoid *homologous* to a human brain circuit? It's human-derived tissue, but lacks structure, connectivity, and embodiment. This becomes messy.
      *   If the rule demands *functional equivalence plus mechanistic similarity* (even if not strictly homologous), simulations *could* qualify if their functional profile and underlying computational architecture matched human data. But then the rule isn't purely about homology anymore.

  **What Changes Under Alternatives?**

  1.  **Strict Type Identity Theory (Mental State M = Neural State N):**
      *   **Stop Doing:**
          *   Attributing pain/distress to any non-human based *solely* on behavior unless the *exact human neural state* is demonstrated. Severity assessments for rodents, let alone zebrafish, become highly dubious. Animal models lose most ethical justification unless purely for veterinary medicine.
          *   Using animal models for *psychological* prediction in humans at all, unless the specific neural identity state is conserved. The entire behavioral neuroscience pipeline collapses unless purely studying conserved reflexes or uncontroversial physiological processes.
          *   Treating functional similarity in organoids/simulations as evidence for mentality without demonstrating they instantiate the *human neural state N*.

  2.  **Consistent, Radical Functionalism:**
      *   **Start Doing:**
          *   Assigning severity bands based on functional profiles to *insects* exhibiting complex avoidance, distress, or "depression-like" behaviors (e.g., Drosophila in chronic stress paradigms). Ethical scope expands dramatically.
          *   Seriously considering if sufficiently complex *organoids* or *AI simulations* exhibiting functional profiles of pain, anxiety, or even rudimentary cognition warrant ethical concern and potentially severity classification. The "mind model vs. mind" distinction blurs; if it functions like a mind, it might *be* a mind (or have mind-like states).
          *   Accepting behavioral/causal profile matches in *any* model system (e.g., zebrafish anxiety test) as direct evidence for human psychology, *without* demanding mechanistic homology. Mechanism-hunting becomes useful for *engineering* interventions, not for validating the *psychological* inference.
          *   Potentially downplaying the absolute need for *animal* models if functional equivalence can be achieved ethically in silico or in vitro.

  **Underdetermined Parts of Current Practice:**

  1.  **Using Behavioral Proxies for Severity:** *Both* functionalists and identity theorists (in practice) can justify this. Functionalists see it as direct evidence of the state. Identity theorists might accept it as the *best available practical indicator* of the underlying (homologous) neural state in mammals, based on evolutionary conservation. It's an operational necessity justified by different underlying reasons.
  2.  **Prioritizing Mechanistic Studies in Translational Research:** Functionalists can justify this on *pragmatic, evidential* grounds: finding conserved mechanisms provides stronger, more reliable evidence for translation, reducing the risk of false positives from superficial behavioral mimicry. Identity theorists justify it on *metaphysical* grounds: only shared mechanisms constitute the same psychological kind. The *practice* of demanding mechanisms can flow from either view.
  3.  **Skepticism about Insect Cognition/Organoid Mentality:** Functionalists *should* be more open to these attributions given sufficient functional complexity. Identity theorists are inherently skeptical. The current practice's sharp lines reflect a *conservative stance* that could be motivated by either: identity theorists deny the states exist; functionalists might argue the functional profiles are insufficiently rich/complex.

  **Epistemic Status: Settled, Contested, and Empirical**

  *   **Settled/Near Unanimous (among relevant philosophers):**
      *   Multiple realizability (MR) is a coherent concept and poses a significant, enduring challenge for *strict type-identity theory* (mental state M = *specific* neural state N in all instances).
      *   Pure behaviorism is inadequate for grounding mental state attribution (the "zombie" problem).
      *   There is no single, universally accepted "mark of the mental" that cleanly resolves all edge cases (insects, AI, organoids).
  *   **Contested:**
      *   **Whether practice confirms functionalism:** Critics argue our attributions *do* track physical similarity (we're more confident attributing complex states to chimps than clams). Defenders argue we use functional criteria *within* broad phyla, and functionalism explains attributions across very different physiologies (octopus intelligence). *[My view: Practice is messy but leans functionalist for basic states; the mechanism-hunting reflects pragmatic caution, not metaphysical commitment.]*
      *   **Functionalism & the Homology Intuition:** Can functionalism accommodate the intuition that homology matters? Yes, but in different ways:
          *   **(a) Evidential:** Homology is strong evidence the functional role is *genuinely* the same, not just superficially similar. (Consensus: This is valid).
          *   **(b) Metaphysical (Contested):** Some (e.g., "animalism" variants, realization-specific functionalism) argue the realizing *kind* (e.g., mammalian brain tissue) is part of the functional state's identity. Others (standard functionalism) deny this. *[My view: Homology is primarily evidential; metaphysical constraints are unnecessary and problematic for MR.]*
      *   **Homology: Metaphysical vs. Evidential Constraint:** Is the demand for homology a claim about *what mental states are* (metaphysical), or just about *how we reliably know* if a finding applies to humans (epistemic)? *This is a core disagreement.* Identity theorists lean metaphysical; functionalists treat it as purely evidential. *[My view: The demand is best understood as epistemic/pragmatic.]*
  *   **Bottoming out in Empirical Questions:**
      *   **Degree of Conservation:** How conserved *are* the neural mechanisms for specific affective/cognitive functions across species? Are zebrafish "anxiety circuits" homologous or analogous to rodent/human ones? This requires neuroscience, not philosophy.
      *   **Functional Sufficiency:** What level of functional complexity in an organoid or simulation *would* warrant state attribution? This depends on empirical progress in creating/models and understanding minimal criteria for specific mental states.
      *   **Reliability of Proxies:** How reliably do behavioral proxies in distant species indicate states functionally equivalent to human states? This requires comparative cognition research.

  **Conclusion:** Your institution's practice implicitly relies on functionalism for ethical severity classification but overlays it with strong mechanistic constraints (inspired by identity theory intuitions and translational pragmatism) for evidential validity in predicting human psychology. This creates a tension but not a strict inconsistency, as the standards serve different purposes (welfare vs. prediction). The "homology rule" represents an extreme version of the mechanistic constraint that contradicts the functionalist core of severity assessment. Adopting strict identity theory would devastate animal research; adopting radical functionalism would vastly expand its ethical scope. Key disagreements hinge on whether homology is a metaphysical requirement or an evidential heuristic, and these debates are deeply intertwined with unresolved empirical questions about neural conservation and functional equivalence.
