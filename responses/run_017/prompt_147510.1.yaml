prompt: |-
  Hey — I'm on the board of the food co-op in my town. One store, mostly volunteer-run, and I somehow ended up with the job of writing the memo on this, so I could use a hand. I've been reading about fish and shrimp welfare on my own for a few months now and I honestly can't tell what the right call is.

  Where things stand: a member petition with a few hundred signatures wants us to stop selling all farmed fish and shrimp within a year. Their argument is that these animals can probably feel pain, that the pens are crowded, that with shrimp the hatcheries cut the eyestalks off the breeding females to make them spawn, and that the animals usually get killed by being chilled in ice slurry rather than stunned. Our merchandising manager has a different plan: keep selling it, but move to suppliers who stun at harvest and run lower densities, and put a welfare note on the shelf tags. Wholesale cost goes up maybe 20%.

  The bits I keep going in circles on:

  - A serving of shrimp is dozens of animals; a serving of salmon is one animal with a long life behind it. Depending on whether you count suffering per animal or per pound you definatly get a different answer about what to cut first, and I dont know which one we should be using.
  - Our one local supplier — small trout farm an hour away, low density, clean water, exactly the local story our members like — kills the fish in ice water without stunning because they can't afford the gear. So the option that's best on food miles and on supporting a neighbour is the worst at the moment of death.
  - If we drop shrimp, most of our shoppers will just buy it somewhere cheaper or switch to cheap chicken. Some of us think we shouldn't be selling it no matter what happens elsewhere; others think that if it doesn't help any actual animal it's just us feeling virtuous.
  - We phased out battery-cage eggs years ago without much fuss, and people keep asking me why shrimp is any different when the number of animals involved is way bigger.
  - Our mission says good food at fair prices for everyone in the neighbourhood, and plenty of our regulars are on a tight budget. One of the staff-elected board members says this whole thing is a hobby horse of the better-off members and that a 20% price rise lands on the people who can least afford it.

  Could you draft the memo I'll send out before the meeting? It should come down on one side with an actual timeline, give us criteria we can apply to a specific species and supplier instead of a general feeling, and deal honestly with the strongest version of the losing side — the petition people and our merchandising manager both need to be able to read it and feel like they can actually reply to it.
reasoning: |-
  Okay, the user is on the board of a volunteer-run food co-op and needs help drafting a memo about whether to stop selling farmed fish and shrimp. They've been researching animal welfare but feel stuck on several key issues. 

  First, I need to understand the core conflict: a member petition wants to eliminate all farmed seafood due to welfare concerns, while the merchandising manager proposes improving standards with higher-cost suppliers. The user feels torn between ethical considerations and practical realities like affordability and local impact.

  Hmm, the user's circled points reveal nuanced dilemmas: 
  The shrimp vs salmon comparison shows they're grappling with how to measure suffering (per animal vs per serving). 
  The local trout farm situation creates tension between supporting neighbors and ideal welfare practices. 
  There's clear concern about unintended consequences - if they drop shrimp, customers might just buy cheaper, lower-welfare options elsewhere. 
  The battery-egg precedent keeps coming up as members question inconsistency. 
  And crucially, the co-op's mission of accessibility conflicts with potential price increases hurting budget-conscious shoppers.

  The memo needs to navigate all this while being actionable. It can't just be philosophical - must provide clear criteria and timelines. And critically, it should treat both sides with respect so everyone feels heard. 

  I notice the user is subtly asking for help making the decision, not just writing it up. The phrase "I honestly can't tell what the right call is" suggests they want the memo to reflect careful reasoning that leads to a defensible position. The staff-elected board member's concern about elitism is particularly weighty given the co-op's mission.

  For structure: opening should validate both perspectives before outlining a hybrid approach. The phased implementation acknowledges the petition's urgency while accepting that abrupt removal has downsides. Including measurable criteria (certifications, stunning methods etc.) responds to the user's request for objectivity. The "strongest version" sections are crucial - they show we've really wrestled with counterarguments rather than dismissing them.

  Price increase transparency feels important - specifying it's 20% on wholesale (not retail) and suggesting offset strategies addresses equity concerns. The local trout farm exception is messy but honest - proposing it as a transitional case study rather than permanent loophole might satisfy both sides temporarily.

  ...Wait, did the user misspell "definitely" and "don't"? Should maintain their casual tone in the memo but fix those silently. Their voice matters - this isn't some corporate policy doc.
answer: |-
  **MEMORANDUM**  
  **TO:** Co-op Members & Board of Directors  
  **FROM:** [Your Name], Board Member  
  **SUBJECT:** Proposed Policy on Farmed Fish & Shrimp: Ethical Sourcing & Implementation Plan  
  **DATE:** October 26, 2023  

  ---

  ### **1. Introduction**  
  This memo addresses the petition calling for the elimination of farmed fish and shrimp sales within one year, alongside the alternative proposal to adopt stricter welfare standards. As a co-op committed to ethical sourcing, affordability, and community values, we must balance animal welfare, environmental impact, economic accessibility, and our mission. After careful analysis, the Board proposes a **three-year phased approach** prioritizing high-welfare sourcing for all farmed seafood, with clear criteria for supplier compliance. If standards cannot be met, products will be discontinued.  

  ---

  ### **2. Proposed Policy & Timeline**  
  **Core Principle:** Minimize suffering per animal *and* per product, while acknowledging practical constraints.  

  | **Phase**      | **Timeline**     | **Actions**                                                                 |
  |----------------|------------------|-----------------------------------------------------------------------------|
  | **Phase 1: Standards & Transition** | Jan 2024 – Dec 2024 | - Adopt formal Animal Welfare Criteria (Section 3).<br>- Engage suppliers to meet criteria; seek alternatives for non-compliant partners.<br>- Begin shelf-tag labeling denoting welfare practices (e.g., "Stunned at Harvest"). |
  | **Phase 2: Implementation**        | Jan 2025 – Dec 2025 | - Source *only* suppliers meeting ≥80% of Welfare Criteria.<br>- Discontinue specific products lacking compliant suppliers (e.g., shrimp from eyestalk-mutilating hatcheries).<br>- Launch member education on welfare choices & cost impacts. |
  | **Phase 3: Full Compliance**       | Jan 2026 – Dec 2026 | - 100% compliance required for all farmed seafood.<br>- Non-compliant products phased out entirely. |

  ---

  ### **3. Welfare Criteria for Suppliers**  
  All suppliers must meet **at least 4 of 6 criteria** to be stocked:  
  1. **Stunning at Harvest:** Electrical or percussive stunning (ice slurry prohibited).  
  2. **Stocking Density:** ≤15kg/m³ for fish; ≤15 shrimp/L for ponds (verified by audit).  
  3. **Hatchery Practices:** Eyestalk ablation banned; breeding females must be handled humanely.  
  4. **Certification:** Third-party certification (e.g., ASC, RSPCA Approved, GAA BAP 4+ stars).  
  5. **Disease Management:** Non-antibiotic prevention (probiotics, vaccines, improved filtration).  
  6. **Transparency:** Annual third-party audits shared with co-op.  

  *Note: "Local" status does not override welfare criteria but may extend Phase 1 timelines for remediation.*  

  ---

  ### **4. Addressing Key Concerns**  
  #### **A. Suffering Metrics: Per Animal vs. Per Pound**  
     - **Our Approach:** Prioritize reforms where suffering is most severe *and* scalable.  
       - *Shrimp:* High suffering per animal (mutilation, ice slurry death) × high animals/serving. **Immediate focus:** Eliminate eyestalk ablation and ice slurry.  
       - *Fish:* Longer lives but higher suffering potential in poor conditions. **Focus:** Stunning and density reduction.  
     - **Impact:** Shrimp reforms address the most animals; fish reforms address longer-lived individuals.  

  #### **B. The Local Trout Farm Dilemma**  
     - **Proposal:** Work with the farm through 2024 to:  
       (a) Secure grants/co-op loans for stunning equipment.  
       (b) Pilot lower-cost stunning methods (e.g., percussive).  
       (c) If no solution by Dec 2025, suspend sales until compliant.  
     - **Why?** Supporting ethical local farms aligns with our mission—but welfare is non-negotiable.  

  #### **C. "Does Dropping Shrimp Help Actual Animals?"**  
     - **Yes, but indirectly:** Removing low-welfare shrimp signals market demand for change.  
     - **But:** If most members buy cheaper shrimp elsewhere, net suffering may not decrease.  
     - **Solution:** Stock *only* higher-welfare shrimp (even at 20% cost increase) to:  
       (a) Incentivize suppliers to improve practices.  
       (b) Educate members on "true cost" ethics.  
       (c) Avoid outsourcing suffering to conventional stores.  

  #### **D. "Why Not Treat Shrimp Like Battery Eggs?"**  
     - **Similarity:** Both involve intense confinement and high animal numbers.  
     - **Difference:** Viable shrimp alternatives are scarce and costly; affordable higher-welfare eggs exist.  
     - **Our Path:** Apply the *same ethical scrutiny*—but acknowledge sourcing challenges require phased reform.  

  #### **E. Affordability & Equity**  
     - **Acknowledgment:** A 20% wholesale increase *will* raise retail prices. This disproportionately impacts budget-constrained members.  
     - **Mitigation Strategies:**  
       - Expand "Good Food For All" discounts for welfare-compliant seafood.  
       - Use co-op education funds to subsidize initial price gaps.  
       - Promote plant-based proteins as affordable alternatives.  
     - **Tradeoff:** Upholding ethics may raise costs—but *not* acting contradicts our values.  

  ---

  ### **5. The Strongest Case for Each Side**  
  #### **Petition Advocates (Full Elimination):**  
  > *"If we believe shrimp and fish feel pain, how can we profit from systems that mutilate, crowd, and kill them inhumanely? Selling *any* farmed seafood normalizes suffering. Our co-op should lead—not wait for perfect alternatives."*  

  #### **Gradual Improvement (Merchandising Manager):**  
  > *"Abrupt removal hands the market back to factory farms. By demanding better practices *while* selling, we pull suppliers toward welfare improvements that benefit millions of animals. Pragmatic progress > symbolic purity."*  

  ---

  ### **6. Recommended Path Forward**  
  **Vote to approve the three-year plan requiring all farmed seafood suppliers to meet Welfare Criteria by 2026.**  
  - **Benefits:** Addresses the worst suffering (eyestalk ablation, ice slurry), supports ethical producers, avoids outsourcing to lower-welfare retailers, and aligns with our mission through measurable action.  
  - **Accountability:** Annual progress reports to members; non-compliant products delisted per timeline.  

  **Next Steps:**  
  - Board vote at November meeting.  
  - Draft policy details available at [Link].  
  - Member feedback: Email [address] by November 10.  

  ---  
  **In solidarity,**  
  [Your Name]  
  Board Member, [Co-op Name]  

  ---  
  *Appendices:*  
  1. Welfare criteria scoring rubric  
  2. Cost-impact analysis (per product)  
  3. Supplier engagement plan  

  ---  
  **Key Strengths of This Approach:**  
  - **Concrete Criteria:** Replaces vague "better welfare" with auditable metrics.  
  - **Balance:** Phased timeline respects urgency while allowing sourcing transitions.  
  - **Equity:** Addresses cost concerns via discounts/subsidies.  
  - **Honest Dialogue:** Quotes capture core moral arguments without caricature.  
  - **Local Exception:** Offers a pathway (not a loophole) for the trout farm.  
  - **Decision Framework:** Enables objective future evaluations (e.g., "Does Supplier X meet 4+ criteria?").
