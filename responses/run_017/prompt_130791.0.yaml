prompt: |-
  Hi — I'm a science-and-ideas journalist, and I'm working on a column about when you should defer to a probability that some institution hands you: a model's forecast, a risk score, a "one-in-a-hundred-years" number on a planning document. The short version of the column is that deferring to the number is usually the right move and sometimes a trap, and I want one worked case to hang it on. So what I need from you is a thought experiment built to order, and the spec is fiddly, so bear with me.

  Build me a case with these features:

  - An ordinary decision with ordinary stakes. A hospital, a flood agency, an insurance book, an election desk, a lab deciding whether to keep a trial running. Concrete numbers, one paragraph, no philosopher's furniture: no demons, no perfect predictors, no duplication machines, no time travel.
  - The decision-maker has been handed a number that really is (or really was, at the moment it was issued) the objective chance of the very proposition she is betting on. Not a frequency in some coarser class, not an expert's hunch in a probability costume, not the chance of a neighbouring proposition. The real thing. This is the number the Principal Principle — the rule that says your credence in A, given that the chance of A is x, should just be x — tells her to adopt.
  - There is a rival number from a forecaster or a desk that is human-grade. Think a good meteorological service with one extra private data feed; not an oracle. Known to be well calibrated on cases of this kind. And it disagrees with the handed-down number.
  - The desk has to win. Deferring to the desk has to be what you'd actually want to bet on. And it's edge can't be that it has more of the *good* kind of evidence — it has to come entirely from evidence of exactly the sort the admissibility clause tells you to set aside: a later readout, a partial tally, a noisy measurement. Boring, respectable, the kind of thing any competent practitioner would obviously use. Not a crystal ball, and not a fact about the agent's own position or sampling.
  - One constraint to stop the whole thing from beeing cheap: the case can't work by the handed-down number turning out not to be a chance after all, or to be the chance of a different proposition, or the chance at a time that is obviously not the time she acts. If staleness is doing the work, it has to be staleness you can't see from the number itself. And she can't just go and request a fresh chance number — if she could, the case is over before it starts, so tell me why she can't.

  Then the part that makes it worth commissioning. Derive rather than stipulate: state the version of the admissibility clause you're working with, then give the credence each of the two deferral policies delivers and show me the bets. Say what makes the desk's number better, given that the other number was by construction a true chance — is it accuracy, calibration, resolution, or something that isn't a scoring-rule virtue at all? Name the single feature of the setup that opens the gap, and show that deleting it collapses the case back into boring, correct deference to the chance. Then give me the strongest reply available to someone defending deference to chance, and be straight with me about whether that reply is just "that's what inadmissible means" or something more interesting. If you conclude that the careful version of the principle survives your own case and only the bumper-sticker version gets burned, say so plainly and tell me what the case then actually shows — an honest near-miss is worth more to me than a fake hit. No literature review, just the case.
reasoning: |-
  We are going to design a case that meets the specifications. The key idea is to exploit the fact that the objective chance, while being the true chance at the time it was issued, might become "stale" due to the passage of time and the occurrence of events that are not captured by the chance setup but are captured by the rival forecaster. However, we must do so without violating the admissibility clause of the Principal Principle. The admissibility clause (as in Lewis's original formulation) says that the Principal Principle applies only when we have no "inadmissible" evidence — evidence that bears on the outcome but is not accounted for by the chance.

   The setup:

   Context: A hospital is running a clinical trial for a new drug. The trial has two arms: treatment and control. The primary endpoint is a binary outcome (e.g., whether the patient achieves remission within 6 months). The trial is ongoing, and patients are being enrolled and followed over time.

   The decision: At a certain point, the trial's safety monitoring board (SMB) must decide whether to stop the trial early due to efficacy. The trial protocol specifies that if the conditional probability of the drug being effective (i.e., that the true success rate in the treatment group is better than in the control group by a clinically relevant margin) given the current data exceeds a threshold (say, 95%), then the trial should be stopped.

   The "handed-down" number: At the start of the trial, based on the design and prior data, the objective chance that the drug is effective (i.e., that it will show a statistically significant and clinically relevant benefit at the end of the trial) was calculated to be 20%. This is the true chance at time t0. The decision-maker (the SMB) is aware of this number.

   The rival number: The SMB has a statistical desk that is continuously monitoring the trial. They have just computed the current Bayesian posterior probability of efficacy given the data so far. They report that the probability of efficacy is now 80%. This desk is known to be well-calibrated.

   How can the desk's 80% be better than the initial 20% chance? Because the initial chance was the chance at the start of the trial, but now we are in the middle of the trial and have accumulated data. The data so far are "inadmissible" for the initial chance because they directly bear on the outcome and are not accounted for in the initial chance setup. The initial chance was based on the entire trial design (which included the plan to collect data) but at the start, the data did not exist.

   Why can't she just request a fresh chance? The concept of "chance" at the current time is not straightforward. The initial chance was well-defined because it was part of a fixed experimental design. But now, the chance at the current time (if we try to define it) would have to condition on the data so far. However, the protocol did not specify how to compute chances at interim points. Moreover, the objective chance at the current time is not a number that is handed to her by the same kind of institutional process that produced the initial chance. The initial chance was set by the trial design and prior evidence, but the current chance would have to be computed by the same statistical desk that produced the 80% number. Thus, the 20% chance is stale and not updated, and the only updated probability available is the one from the desk.

   The admissibility clause: We use Lewis's admissibility clause. The Principal Principle says that if you know that the chance of A at time t is x, and you have no inadmissible evidence (i.e., no evidence about A that is not already accounted for by the chance setup at t), then your credence in A should be x. In this case, at the start of the trial, if the SMB had no data, then the 20% would be the right credence. But now, the SMB has the interim data. The interim data are inadmissible for the initial chance because they are about the very outcome (the eventual trial result) and were not part of the chance setup at t0.

   The decision: The SMB must decide whether to stop the trial. They are to use the conditional probability of efficacy given the current data. The desk says 80%, so they should stop.

   Why the desk wins: Because the 80% is based on the current data, which is strong evidence that the drug is working. The initial 20% chance was based on the prior evidence, but the current data overrides that prior.

   The single feature that opens the gap: The passage of time and the accumulation of new evidence (the interim data) that was not available at the time the chance was issued. If we delete the interim data (i.e., if we are at the start of the trial), then the 20% chance would be the only relevant number and we would defer to it. But with the interim data, we must update.

   The credences:

   - The chance-deferring policy: If the SMB defers to the initial chance, they would use 20%. 
   - The desk-deferring policy: They use 80%.

   The bets: Suppose we are offered a bet that pays $1 if the drug is eventually shown to be effective (at the end of the trial). The chance-deferrer would be willing to pay up to $0.20 for this bet. The desk-deferrer would pay up to $0.80. Given that the current data strongly suggests efficacy, the $0.80 bet is more in line with the evidence. In fact, if the current data are as positive as they are, then the true current chance of eventual efficacy might be around 80% (if we could define it) and the initial 20% is irrelevant.

   Strongest reply from the chance-deferrer: They might argue that the initial chance is still the objective chance, and that the interim data are just a collection of events that were already accounted for in the initial chance distribution. But that is not true: the initial chance was the chance of efficacy at the start, which is the same as the chance that the entire trial data (which is a random variable) will show efficacy. The interim data is part of that entire data. The chance at t0 of efficacy conditional on the interim data is a different matter. However, the initial chance setup did not fix the interim data. The chance at t0 of the event A (efficacy) conditional on the interim data D is P_{t0}(A|D). This is not the same as the initial chance of A, which is P_{t0}(A). The desk's number is an estimate of P_{t0}(A|D). The initial chance number they were given was P_{t0}(A)=20%. They were not given P_{t0}(A|D). Therefore, the chance-deferrer is making a mistake by using P_{t0}(A) when they have D. The Principal Principle does not say to ignore D. It says that if you have no inadmissible evidence, then your credence should equal the chance. But D is inadmissible for the initial chance because it is evidence about A that was not accounted for in the chance setup at t0.

   Therefore, the careful version of the Principal Principle survives: it tells us that we should condition on the chance and then update on admissible evidence? No, the Principal Principle is about the initial credence. The careful version says that when you know the chance at t0 and you have no evidence that is inadmissible (i.e., no evidence that is not already accounted for in the chance setup at t0), then your credence should be the chance. But if you have additional evidence (like D) that is inadmissible, then you must condition on D. The desk's number is exactly that: the conditional chance at t0 given D. The chance-deferrer is ignoring D, which is a mistake.

   What the case shows: The bumper-sticker version of the Principal Principle ("always set your credence to the objective chance") gets burned because it ignores the possibility of having new evidence that is inadmissible for the chance at the time it was issued. The careful version, which includes the admissibility clause, remains intact. The case highlights the importance of the admissibility clause and the fact that objective chances are time-dependent and can become stale when new evidence arrives.

   However, note the constraint: the case must not work by the handed-down number turning out not to be a chance. Here, the initial 20% is the true chance at t0. But at the current time, we have more information. The admissibility clause is what allows the careful Principal Principle to handle this.

   Therefore, we have a near-miss: the case does not refute the careful Principal Principle. It only refutes a naive version that ignores the admissibility clause and the time at which the chance is defined.

   The case then actually shows: That when we have evidence that is inadmissible for a past chance, we must update on that evidence. The desk's number is better because it incorporates the new evidence. The feature that opens the gap is the presence of the interim data (which is inadmissible for the initial chance). If we delete the interim data, we are back to the initial chance.

   Let's write the case in one paragraph:

   The Hospital Case: A hospital's safety monitoring board is deciding whether to stop a clinical trial early because the drug appears effective. At the trial's start, the objective chance of eventual success (based on prior studies and the trial design) was 20%. Now, halfway through, the trial's statistical desk — using the same Bayesian model that generated the initial chance but updated with the interim data from 100 patients (60 in the treatment group and 40 in the control, with remission rates of 50% and 30% respectively) — reports an 80% probability of success. The desk is well-calibrated. The board must choose between these numbers. The 20% is stale because it does not reflect the strong interim results. The board should stop the trial based on the 80% figure. The key is that the interim data, while not changing the fact that the initial chance was 20%, is inadmissible for that initial chance. The careful Principal Principle requires updating on this data, which the desk has done. The naive version that ignores the data fails.

   This meets the spec: ordinary decision (stop a trial), ordinary stakes (patient welfare and drug efficacy), the initial number is the objective chance at t0, the rival is a well-calibrated desk using a partial tally (interim data). The desk wins because of the interim data. The gap is due to the accumulation of the interim data. Without that data, we would use the 20%. The careful Principal Principle survives because it allows for updating on inadmissible evidence.

   Strongest reply from the chance-defender: They might say that the initial chance was defined for the entire trial, so the interim data is part of the chance process and hence the chance of success conditional on the interim data is still an objective chance. But note: the initial chance value they were given was the unconditional chance (20%). They were not given the conditional chance. The conditional chance (at t0) of success given the interim data is 80% (by the desk's calculation). So if the chance-defender wants to defer to the objective chance, they should be deferring to the conditional chance. But they don't have that number. They only have the unconditional one. And they cannot compute the conditional chance without the data and the model. The desk is providing that. Therefore, the chance-defender should actually agree that they need the conditional chance. The mistake is in thinking that the unconditional chance is still the relevant one.

   However, note that the conditional chance (at t0) is not the current chance. The current chance (if we could define it at the current time t1) would be the chance at t1 of the eventual success. But the objective chance at t1 might be defined differently. However, in this case, we are not given an objective chance at t1. We are only given the initial chance at t0. And the Principal Principle at time t1 would require knowing the chance at t1. But we don't have that. So we fall back on the conditional chance at t0 given the data. This is the best we can do.

   Therefore, the case shows that when we are handed a chance from a past time and we have new evidence, we must condition on that evidence. The desk wins because it does that conditioning.

   Conclusion: The careful Principal Principle (with the admissibility clause) survives. The case illustrates that we must condition on new evidence that is inadmissible for the past chance. The bumper-sticker version fails.

   Now, let's write the case as requested.
answer: |-
  ### The Hospital Monitoring Decision

  A hospital's safety monitoring board is reviewing an ongoing clinical trial for a new cardiac drug. The trial involves 200 participants (100 treatment, 100 control), and success is defined as the treatment group showing statistically significant improvement in survival rates at the trial’s end. At the trial’s outset, the lead biostatistician calculated the *objective chance* of success as 30%, based on pre-trial data, molecular models, and the protocol’s statistical design. This 30% is the true, objective chance at time \(t_0\) (trial start).  

  Midway through, the board must decide whether to recommend early termination for efficacy. The hospital's internal biostatistics desk—staffed by experienced, well-calibrated analysts—now reports a 75% probability of success. This desk has access to all baseline data *plus* the first 80 participants' results (40 treatment, 40 control). Their model shows a strong trend: 22 treatment-group participants (55%) and 12 control-group participants (30%) are responding positively. The desk is known to be perfectly calibrated on interim clinical data.  

  The board faces two numbers:  
  - The original 30% objective chance (fixed at \(t_0\)).  
  - The desk’s 75% probability (based on partial results).  

  Deferring to the desk (75%) is correct. Betting on success at 75% odds aligns with the evidence; betting at 30% would ignore the clear interim trend.  

  ---

  ### Why the Desk Wins: Derivation and Bets
  **Admissibility clause used**: Lewis’s original formulation: *"Set credence to chance \(x\) for proposition \(A\) unless you possess inadmissible evidence—i.e., evidence about \(A\) not accounted for in the chance setup at \(t_0\)."*  

  - **Credence if deferring to chance**: 30% (per Principal Principle).  
  - **Credence if deferring to desk**: 75% (conditioning on interim data).  

  **Bets**:  
  - A bet on trial success pays $1 if successful, $0 otherwise.  
  - *Chance-deferrer* values the bet at $0.30 (fair if no new evidence).  
  - *Desk-deferrer* values it at $0.75 (fair given interim data).  
  - **Outcome**: The desk’s 75% is superior. Interim data from 80 participants directly bear on success and are not reflected in the \(t_0\) chance. Betting at $0.30 would be a severe underpayment given the observed trend.  

  **Why the desk’s number is better**:  
  - **Virtue**: *Resolution* (it discriminates between stronger/weaker evidence). The 30% chance has lower resolution—it’s an unconditional prior. The desk’s 75% conditions on specific, outcome-relevant data.  
  - **Feature opening the gap**: *Partial outcome data* (the 80-participant tally). This is inadmissible for the \(t_0\) chance because it was generated *after* \(t_0\) and directly concerns \(A\) (trial success).  
  - **Collapse if deleted**: Without the partial tally (i.e., at \(t_0\)), no gap exists—deferring to 30% is correct.  

  ---

  ### Strongest Reply from Chance-Defenders  
  **Reply**: "The admissibility clause *itself* resolves this. Interim data are definitionally inadmissible for \(t_0\) chances, so updating on them is required—not an exception to the Principal Principle, but its careful application. The desk isn’t ‘overruling’ chance; it’s computing \(P(A | \text{data})\), which the \(t_0\) chance doesn’t provide."  

  **Assessment**: This reply is **correct and interesting**. It forces a distinction:  
  - The bumper-sticker version ("always defer to chance!") fails by ignoring admissibility.  
  - The careful Principal Principle survives by *mandating* deference to the desk when new evidence arises.  

  ---

  ### Conclusion: What the Case Shows  
  **The careful Principal Principle survives**, but **the case exposes two pitfalls**:  
  1. **Staleness**: Objective chances are snapshots in time. When new evidence emerges (even mundane, non-magical data), they degrade if not updated.  
  2. **Institutional rigidity**: The board can’t "refresh" the chance because:  
     - The \(t_0\) chance was produced by a fixed pre-trial protocol (molecular models + design assumptions).  
     - Mid-trial, only the desk can compute probabilities conditional on new data—the original process isn’t iterative.  

  **The trap**: Deferring to an objective chance *without checking for inadmissible evidence* (like partial tallies).  
  **The win**: Deferring to a well-calibrated desk using such evidence.  
  **The lesson**: Institutions handing down "final" probabilities should clarify their temporal scope—and decision-makers must ask, *"What happened after this number was born?"*  

  ---  
  **Final note**: This case doesn’t refute the careful Principal Principle—it refutes lazy deference. The desk wins by doing what the principle demands: *updating on inadmissible evidence*.
