answer: |-
  ## Halden Committee Room, 11:03 PM

  **Mira:** (Typing furiously) ...fundamentally privileges *existing* social capital. It’s state-sanctioned aristocracy of the articulate and ancient. What about the Somali-Haldeni tenants' union? Twelve years old, doing essential work, fighting evictions right now. Under these rules? Zero chance. Ever. The city’s picking winners based on longevity and a tidy story, Dev. That’s ranking conceptions of the good. Explicitly.

  **Dev:** And the city *doesn't* already do that? Mira, the whole liberal setup – schools teaching critical distance, the sacred right of exit baked into everything, the anti-discrimination code itself – it sustains one specific thick identity. The identity of the person who stands back, revises, chooses. It launders that preference as neutrality. The Grant just admits some valuable identities *aren't* the state's own creation, that they predate it and might outlast its current configuration. It stops pretending they emerge from a vacuum of pure choice.

  **Mira:** Okay, hold on. There’s a difference – a crucial one, even if it’s fuzzy at the edges – between enforcing the *conditions* for revising your ends and actively *subsidizing* a particular end. Call it the literacy/creed distinction. The state teaches literacy – how to read, think, choose. It doesn't fund your choice of scripture. This Grant funds the scripture. And yeah, literacy isn’t perfectly content-free. Teaching critical thinking *is* a value. But it’s a meta-value, about *how* to hold ends, not *which* ends to hold.

  **Dev:** Fine, concede the meta-value point. But some goods aren’t creedal like that. They’re constitutive. You can’t possess them by just choosing them individually; you only *have* them by being inside a living practice that stretches before and after you. Take a language society getting a Grant. You can *leave* the community, Mira. The exit right protects that freedom flawlessly. But what does that exit protect *about the language itself*? You cannot take a living mother tongue with you when you walk away. It dies *with the community*. The costless exit protects the chooser, but it protects *nothing* of that specific, irreplaceable good. The Grant tries to protect the soil the language grows in.

  **Mira:** Then exit is the *wrong* safeguard here! If the good is truly constitutive and tied to the community’s continuity, then the right isn’t just about individuals leaving. It should be about the community itself having the capacity to *reform* without being destroyed. A secession floor. Say, if a fifth of the members want to continue the practice differently – interpret the sacred texts anew, shift the language focus – they take a proportional slice of the Grant *and* the story with them. The city funds the *practice*, not the specific current management. That’s a liberal repair, Dev. It allows evolution without granting the old guard a veto on the community’s future.

  **Dev:** And what does that splinter group get? Money, yes. But no *standing*. Because the standing – the formal consultative role – hinges entirely on the *continuity test*. The city only talks to the group that passes the 60-year/unbroken narrative bar. Your splinter group has cash, but no voice at the table. Worse, your ‘floor’ *forces* the city into the very business you hate: adjudicating schisms. Who gets to claim the story? Which faction is the ‘real’ continuation of the 60-year practice? Is the congregation that admitted women in the 80s showing growth or committing apostasy? The certification authority has to decide that *now*, under your model, for every split. Tell me, has the liberal state *avoided* those quasi-theological questions about group identity and legitimacy? Or has it just privatised them into endless, brutal court battles over trademarks, property, and ‘true’ representation, only to re-administer the decision through a judge?

  **Mira:** (Stops typing, turns to face Dev fully) So we’re stuck with the reform problem either way? Under the Grant as drafted, that congregation applying *now* has to tell the city whether their 1980s change was faithfulness or a break. The Registrar of Continuous Associations becomes the arbiter of authentic tradition. That’s terrifying power! You think *that* avoids theological adjudication?

  **Dev:** It doesn’t avoid it. It localises it to a specific, constrained administrative process focused on *one* thing: does this specific group have an unbroken public narrative claiming *this* purpose for 60 years? It’s about documented, public consistency *from the group's own mouth*, not whether their change was ‘right’. Does their current stated paragraph roughly match what they’ve said before? The power is real, Mira, but its scope is narrow. Your secession model explodes it. Suddenly the city isn’t just checking a group’s own story against its past statements; it’s deciding *between competing claims* to that story and the legitimacy that comes with it. It’s choosing sides in the schism.

  **Mira:** Narrow scope? Deciding whether admitting women was continuity or rupture *is* choosing a side in the schism! It’s just doing it implicitly, by accepting or rejecting the group's *own* framing. Whoever holds that certification power – some city bureaucrat, a panel – ends up holding the keys to legitimacy and money based on their interpretation of narrative continuity. That’s not neutral administration; that’s deep cultural arbitration disguised as paperwork. And it *will* favour the conservative faction every time. Change becomes risky. Innovation becomes a threat to funding.

  **Dev:** Whereas your court battles over secession are a model of clarity and impartiality? The anti-discrimination carve-out is the only solid ground here. *That’s* where the actual fights will land – groups testing the edges of ‘narrative continuity’ to exclude based on proxies the code forbids. The rest… the core tension… maybe it’s inherent. Maybe sustaining constitutive goods *requires* some institutional commitment that looks, from the outside, like favouritism. Maybe the liberal state *can't* fund thick community without getting its hands dirty in their stories. The question is whether the dirt is in the open, constrained by the 60-year test and the narrative requirement, or buried under mountains of litigation triggered by your well-intentioned secession clause.

  **Mira:** Or maybe it means we shouldn’t be funding it this way at all. Maybe the dirt is proof it’s the wrong tool. (She turns back to her screen, fingers hovering over the keys, the clack-clack silenced for a moment. The hum of the fluorescent lights is loud). This Registrar… whoever they are… they become the high priest of Halden’s past. Authorised by us. Tonight.

  **Dev:** Or its reluctant archivist. Documenting what persists, not judging its worth. Only its endurance. The vote’s tomorrow. We built the tool. Now we see if the city wants to use it. (He leans back, staring at the ceiling tiles). Either way, someone decides what counts as ‘continuous’. The only question is who, and how naked the power looks.

  \answer{Whether the state can fund traditions without judging their essence.}
