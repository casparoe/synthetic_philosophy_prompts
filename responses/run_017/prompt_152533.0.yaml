  The ICU cluster mention is crucial - shows honesty without undermining her legacy. And emphasizing colleagues prevents the solo hero trap. 

  For warmth: family memories (like her cooking analogy) make it personal while subtly reinforcing her philosophy - you don't praise the cook for hunger not happening! 

  Final safety check: Ran through her banned list:
