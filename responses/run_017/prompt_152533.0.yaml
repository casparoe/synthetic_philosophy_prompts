  Hmm... the key might be shifting focus from outcomes to processes and relationships. Instead of "she stopped infections," we could highlight how she built systems and influenced behaviors. The philosophy friends' presence means we must avoid any sneaky "caused absence" language - even phrases like "thanks to her" could be problematic. 

