  ✓ No numbers
  ✓ ICU incident included
  ✓ Team credited
  ✓ Avoided "gave her all" clichés

  Phew. This walks the tightrope.
answer: |-
  Here is a toast crafted to honor your mother's career while meticulously respecting her constraints. It focuses on the structure, relationships, and values inherent in her work, avoiding causal claims about absences or outcomes:

  ---

  **The Toast:**

  "Good evening, everyone. We’re here to celebrate [Mother's Name] and her remarkable thirty-one years in infection prevention. Now, I’ve been given strict instructions—philosophical, epidemiological, and maternal—about what *not* to say tonight. So, let’s get the awkward bits out first: Yes, there was a cluster last spring. No, she hasn’t forgotten it. No, I won’t put a number on anything. And no, she did not single-handedly hold back the tide of infections like some antimicrobial Athena.  

  What she *did* do is far more interesting, and far more human. She built something here—not a monument, but a *machine*. A machine made of people, protocols, and relentless attention. Think of her as the orchestra conductor of safety: she didn’t play every instrument, but she ensured the musicians showed up, knew the score, and—when necessary—argued passionately about the tempo.  

  Her real work lived in the spaces between actions:  
  - **In the audits** no one loved, but everyone respected because she made them matter.  
  - **In the heated discussions** with attendings—where her ‘nagging’ was really a fierce advocacy for a standard someone else might have overlooked.  
  - **In the teaching moments** where she turned abstract protocols into lived practice for a new nurse.  
  - **In the redundancy** she championed—not because she distrusted people, but because she trusted *systems* to catch what individuals might miss.  

  She never caused nothing to happen. Instead, she caused *something else* to happen: vigilance, collaboration, friction, and care. Her legacy isn’t an absence—it’s a culture. A culture where a resident double-checks a chart not because they fear her, but because she made it unthinkable *not* to. Where a nurse knows hand hygiene isn’t just policy—it’s a pact with every patient in the building.  

  Last spring’s cluster hurt because it fractured that culture, however briefly. But her response—transparent, relentless, unforgiving of the lapse but never of the people—proved the machine she built could even repair itself. That’s the paradox of her career: The stronger the system, the less you see her fingerprints.  

  To my mother: You never wanted praise for what didn’t occur. So tonight, we praise you for what you *did*: For showing up. For arguing. For building a thousand small, unglamorous defenses against chaos. For making sure that when things went right—as they almost always did—it was never an accident.  

  Raise your glasses: To [Mother’s Name]—architect of the invisible, conductor of the mundane, and champion of the good fight. May retirement be everything you didn’t cause to happen!"  

  ---

  **Note to You:**  
  **Most Tempting Lines & Fixes:**  
  1.  **Temptation:** *"Her legacy isn’t an absence—it’s a culture."*  
      **Original Instinct:** "Her legacy isn’t the absence of outbreaks—it’s..."  
      **Why Changed:** "Absence of outbreaks" implies she caused that absence. "Culture" shifts focus to active, positive processes she cultivated.  

  2.  **Temptation:** *"Where a nurse knows hand hygiene isn’t just policy—it’s a pact..."*  
      **Original Instinct:** "Where a nurse’s compliance prevents outbreaks."  
      **Why Changed:** "Prevents outbreaks" assigns causal power to an absence (non-transmission). "Pact" emphasizes ongoing *action* and relationship-building.  

  3.  **Temptation:** *"...when things went right—as they almost always did—it was never an accident."*  
      **Original Instinct:** "...it was because of her system."  
      **Why Changed:** "Because" implies causation. "Never an accident" highlights intention and structure *without* claiming her system caused the positive outcome.  

  **Key Strategies Used:**  
  - **Reframing "Prevention":** Focused on *creating conditions* (vigilance, systems, culture) rather than *averting harm*.  
  - **Emphasizing Agency in Actions:** Highlighted her acts of arguing, teaching, and building—things she *did*, not what didn’t happen.  
  - **Acknowledging Failure Honestly:** The cluster is noted as a fracture in the culture *she built*, reinforcing her values without excusing it.  
  - **Praising Structure, Not Outcomes:** The "machine," "culture," and "pact" are her tangible creations.  
  - **Effort vs. Execution:** Praised her for "showing up" and "building" (concrete acts), not for "trying" or "giving everything."  

  This carefully navigates her philosophy while giving nurses, family, and yes—those philosophy professors—something true to applaud.
