  We are given a thesis to argue for, which distinguishes derogatoriness from offensiveness. Derogatoriness is a property of the act relative to a norm (it violates a conventional prohibition in the linguistic community). Offensiveness is a property of the act relative to an audience (their warranted uptake of the act as flouting the prohibition).

  We have three cases to build the argument around.

  Definitions (to be fixed in the opening paragraph):
  - Let "says" refer to the truth-conditional content asserted by the utterance.
  - Let "expresses" refer to the non-truth-conditional content, such as the speaker's attitude or emotion.
  - "Derogatory": a property of an utterance act that consists in its being a violation of a conventional prohibition in the linguistic community where the utterance is made.
  - "Offensive": a property of an utterance act that consists in the audience's warranted interpretation of the act as a flouting of the prohibition.

  We are to argue against the three standard families:
  1. Content-based views: derogation is part of what is said (truth-conditional).
  2. Expressivist/use-conditional views: derogation is part of what is expressed (non-truth-conditional attitude).
  3. Prohibition views: we are offering a specific kind of prohibition view that distinguishes derogatoriness from offensiveness and ties derogatoriness to the norm of the community.

  But note: the thesis says that the stand-off is because they are explaining different things (derogatoriness vs offensiveness). We must show that the three cases cause problems for the other views.

  Also, we must answer the objection about distinguishing slurs from profanity and explain reclamation.

  Structure the essay:

  1. Opening paragraph: state thesis and definitions.
  2. Then, take each case and show how it supports the thesis and challenges the other views.
  3. Address the main objection (slurs vs profanity and reclamation) and reply.
  4. Conclude.

  Essay (about 700 words):

  ---

  In the philosophy of language, the derogatory character of slurs has been explained in three main ways: as part of what is said (truth-conditional content), as part of what is expressed (non-truth-conditional attitude), or as a matter of linguistic prohibition. This essay defends a novel prohibition-based account: an utterance of a slur is derogatory not because of what the speaker says or expresses, but because it violates a conventional prohibition in the linguistic community. What makes such an utterance offensive, by contrast, is the audience's warranted recognition of this violation as a flouting of the prohibition. To fix terms: by "says," I mean the truth-conditional content asserted; by "expresses," the non-truth-conditional content, such as a speaker’s attitude; "derogatory" is a property of an utterance act that violates a community’s prohibition against using that word; and "offensive" is a property of an utterance act that elicits a warranted interpretation by the audience of the act as a flouting of the prohibition.

  Consider the homophonous transplant case. A heritage speaker uses a word-form that is a slur in L1 but a neutral term in L2, intending the neutral meaning, without derogatory intent, in an L1 context. The audience, fluent L1 speakers, are offended. On our account, the utterance is derogatory because it violates L1’s prohibition, regardless of the speaker’s intent. It is offensive because the audience takes it as a flouting of the prohibition. Content-based views must either deny the utterance is derogatory (since the speaker says nothing derogatory) or implausibly claim that the word contributes derogatory content in L1 regardless of the speaker’s language. Expressivist views face a similar problem: the speaker expresses no derogatory attitude. Standard prohibition views might get derogatoriness right, but without the distinction between derogatoriness and offensiveness, they cannot explain why the speaker’s lack of intent doesn’t block offensiveness.

  In survival without a target, a slur for witches is used as an expletive or term of endearment in a secular community. The word is prohibited but has no target. Content-based views struggle because there is no group to which derogatory content applies. Expressivist views might explain the expletive use as expressing anger, but not the term of endearment, and in any case, the word remains derogatory even without a target. Our account explains: the act is derogatory because it violates the community’s prohibition. But it may not be offensive if the audience doesn’t take it as flouting the prohibition (e.g., if it’s a joke among friends). However, if the audience does take it as flouting, then it becomes offensive.

  In audience-free inscription, a speaker types a slur in a private diary or search box. There is no audience. Our account: the act is derogatory because it violates the community’s prohibition (even in private), but it is not offensive because there is no audience to take it as flouting. Content and expressivist views must explain why such an inscription feels problematic even when private, but they cannot without invoking a norm. However, they might say the word inherently carries derogatory content or expresses an attitude, but then they cannot explain why the same word in a different language (homophonous transplant) doesn’t carry that content or attitude when used by the heritage speaker.

  Now, the main objection: how does this view distinguish slurs from ordinary profanity? Both are prohibited, so both would be derogatory? But we must note that the prohibition for slurs is specifically against using the word to refer to the target group in a way that enacts oppression. The prohibition for profanity is different: it’s about decency or blasphemy. Thus, the derogatoriness of a slur is tied to its role in subordinating a group. Moreover, in reclamation, a subgroup (e.g., the targeted group) revises the norm by lifting the prohibition within the subgroup. Then, an in-group use is not derogatory because it doesn’t violate the subgroup’s norm. But an out-group use remains derogatory because it violates the broader community’s norm (which still prohibits out-group use) and offensive because the audience (in-group) takes it as flouting.

  In conclusion, the three cases show that derogatoriness is not about content or expression but about norm violation. The standard accounts go wrong by conflating derogatoriness with offensiveness or by mislocuting the source. The embedding data that has fueled the debate is about how the word projects, which is a matter of offensiveness (audience uptake) and not derogatoriness per se.

