answer: |-
  ### Essay: The Normative Foundations of Derogation and Offense

  The central thesis of this essay is that the derogatoriness of a slur-utterance arises not from what is said (the truth-conditional content asserted) or what is expressed (non-truth-conditional attitudes or emotions conveyed), but from the violation of a conventional prohibition within the linguistic community where the utterance occurs; meanwhile, its offensiveness stems from the audience’s warranted interpretation of that violation as a deliberate flouting of the prohibition. Crucially, these are distinct properties: derogatoriness is relational to a norm, while offensiveness is relational to an audience’s uptake. Fixing definitions, "says" denotes the literal, truth-evaluable proposition asserted; "expresses" denotes the speaker’s non-propositional attitude (e.g., contempt or endorsement); "derogatory" describes an act that breaches a community’s explicit or implicit ban on using a word-form to target a group; and "offensive" describes an act that prompts an audience to reasonably interpret it as defiantly violating that ban. This framework resolves puzzles that confound the three dominant accounts—content-based (derogation in what is said), expressivist (derogation in what is expressed), and simple prohibition views—by showing they conflate or misattribute these properties. The argument unfolds through three novel cases.

  In the **homophonous transplant**, the heritage speaker utters a word-form that is prohibited in L1 but neutral in L2, intending no derogation and unaware of L1’s prohibition. The utterance is derogatory because it violates L1’s community-specific norm, irrespective of the speaker’s intent or semantic content. It is offensive because L1 speakers reasonably interpret it as flouting their prohibition. Content-based accounts err here: they must deny derogatoriness (since nothing derogatory is *said*) or implausibly insist the word magically imports derogatory truth-conditions across languages. Expressivist accounts similarly fail, as no derogatory attitude is *expressed*. This case highlights how norms, not semantics, ground derogatoriness.

  In **survival without a target**, the witch-slur is used descriptively vacuously—as an expletive or affectionate vocative—in a secular community. The utterance remains derogatory: it breaches a standing prohibition rooted in historical oppression, even without a target. Yet it may lack offensiveness if the audience (e.g., a friend) does not take it as flouting the ban. Expressivist accounts stumble here: they cannot explain derogatoriness absent a targeted attitude (e.g., the affectionate vocative expresses camaraderie, not contempt). Content-based views also falter, as no truth-conditional content about witches is asserted. This underscores that prohibitions persist independently of reference or attitude.

  In **audience-free inscription**, typing the slur privately is derogatory—it violates the community’s prohibition—but not offensive, as no audience exists for warranted uptake. Simple prohibition views (which equate prohibition-violation with offensiveness) founder here: they cannot explain why offensiveness vanishes without an audience. Content or expressivist accounts, meanwhile, might claim the inscription is non-derogatory (since nothing is said or expressed to anyone), but this ignores the intuitive wrongness of even private use. This case confirms that norms bind acts regardless of publicity, while offensiveness demands audience mediation.

  The strongest objection contends that this account conflates slurs with ordinary profanity (e.g., "fuck"), as both are prohibited. Worse, it seems unable to explain reclamation: if in-group speakers lift a prohibition for themselves, why does out-group use remain offensive? The reply clarifies that prohibitions for slurs are uniquely tied to the word’s role in enacting group subordination, whereas profanity prohibitions concern decorum or sacrilege. In reclamation, the in-group revises *their* community’s norm, rendering in-group uses non-derogatory; out-group uses, however, still violate the broader community’s prohibition and become offensive via the in-group audience’s warranted uptake as flouting. Thus, the account distinguishes slurs by their normative function and explains reclamation as norm-relativity in action.

  A residual worry lingers: without a theory of how linguistic communities and their norms are individuated, the account risks overgeneralizing or becoming circular in borderline cases.

