prompt: |-
  Me and a friend are stuck on epistemic akrasia and I want a number, not "it depends on the case".

  Here's the case. Dana works carefully from her evidence and concludes P, credence 0.8. Then she gets solid evidence that essentially everyone reasoning in this domain — her included — has been exposed to a subtle bias pushing toward P, and that the bias also distorts the very reasoning she would use to judge whether it applies to her. So the defeater implicates itself: her assessment of the defeater is compromised, and so is her assessment of that, and so on. Call it a self-implicating defeater.

  Give me your credence that Dana's rational response is to lower her first-order confidence in P at least somewhat, rather than sitting at 0.8 and merely adding the higher-order belief that she's probably biased. I'm around 0.7 on this; my friend is around 0.25 and says the regress cancels itself out and nothing transmits.

  Decompose it: how much rides on whether first-order and higher-order rational requirements can come apart at all, how much on whether a self-implicating defeater carries any net information for Dana or is self-cancelling, how much on whether "rational" here means coherence or truth-conduciveness, plus whatever else you think belongs in there. One number and one line of justification per term, then say how you're combining them. Then: which single term is your final number most sensitive to, what argument or piece of evidence would move it most, and which of the two of us is more likely the one who's wrong.
