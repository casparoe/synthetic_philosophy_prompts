prompt: |-
  Hey — I'm a backend engineer, no philosophy training past a couple of MOOCs, and I've been donating about 10% of my salary for a few years on the strength of the do-the-most-good-per-dollar idea. A friend of mine (philosophy minor, now a lawyer, annoyingly good at this stuff) walked me through the argument below and I've been chewing on it for a week and can't find where it breaks.

  (1) What you ought to do depends on the difference your action makes — compare what happens if you do it against what would have happened if you didn't.
  (2) So the right place to put money is wherever the next dollar does the most good.
  (3) Any number you have for good-per-dollar comes from evidence, and evidence is way easier to collect for some kinds of effect than others: short-run, local, countable, randomized-trial-able effects versus long-run, dispersed, systemic ones. This is not a claim about which interventions are actually better.
  (4) So the measured numbers systematically tilt toward the measurable kind of intervention and away from the systemic kind, regardless of which one really does more good. (This is the thing people call measurability bias, and it's the bit I find hardest to argue with — it feels like basic garbage-in-garbage-out.)
  (5) If the inputs to a ranking are distorted in a known direction, then coming out on top of that ranking isn't evidence that you're actually on top. So the measured best option gives you no reason to think it's the best option.
  (6) And you can't repair this by adjusting the numbers, because any adjustment has to be estimated from the same lopsided evidence base you're trying to correct — you'd be using the biased instrument to calibrate itself.
  (7) You can't duck it by refusing to rank and just picking something robustly good either, since deciding what counts as robust is itself a judgment made on that same skewed evidence.
  (8) Nothing in (3) through (7) is specific to donating. Career choice, voting, whether to start a nonprofit, whether to have kids and how to raise them — every one of those needs you to estimate consequences under exactly the same distortion.
  (9) So for basically any decision in front of you, you have no reason to think the option that looks best is best.
  (10) That can't be right. Some comparisons are fine: money on bednets versus money in a bonfire, a job at a malaria org versus a career of deliberately infecting people with malaria. Whatever is wrong with this argument, it isn't that.

  Which step is the bug? I'm attached to (1) and to the bit in (10), so if something has to go I'd rather it go in the middle. But I specifically want three things: what makes the broken step look like a legal inference when it isn't (my instinct is that it's some kind of scope or quantifier slip — the argument sneaks from can't rank precisely to can't rank at all — but I can't locate the exact seam); what each of the other candidate rejections would cost me; and whether the measurability critique survives in any useful form once the bug is fixed, or whether it turns out to apply to a much narrower class of comparisons than people deploy it against.

  Second thing, and this is why I'm more suspicious rather than less: she has a second version that doesn't mention measurability at all and lands in the same place.

  (a) The outcomes that movement tries to buy — disease burden, poverty — are produced by institutions and political economy, not by marginal donations.
  (b) So a single donation is like a single vote: the probability it changes any outcome is approximately zero.
  (c) If the expected difference your action makes is approximately zero, it doesn't matter what you do with the money.
  (d) But the same holds for every individual's contribution to institutional change — protests, research careers, organizing — since nobody is pivotal on their own.
  (e) So nobody has any consequentialist reason to do anything.

  Two arguments with totally different middles arriving at the same absurd conclusion makes me think the bug is in something they share, not in (3)-(7) or (a)-(d). Is it (1)? If so, what replaces it — is there a nearby principle that still supports the ranking stuff without generating this, or does the whole consequentialist framing of giving come apart? And concretely: I've organised my career around earning to give. I don't need reassurance, I want to know what the cleaned-up version of the argument actually supports and what it doesn't, so I can tell whether my plan rests on something the argument can't touch or on something it quietly ate.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a backend engineer who's been donating 10% of their salary based on effective altruism principles. Their philosophy-trained friend presented two arguments that challenge the foundation of their giving: one about measurability bias and another about individual insignificance in systemic change. Both lead to the conclusion that consequentialist actions might be unjustifiable. The user is stuck because they can't find flaws in the arguments but sense something's wrong, especially since both arguments converge on the same bleak outcome.

  First, I need to identify the core issues. The measurability argument claims that evidence is biased toward measurable interventions, making it impossible to know what's truly best. The systemic change argument says individual actions can't affect outcomes, so nothing matters. The user suspects the flaw lies in a shared premise, possibly step (1), which defines "ought" by the difference an action makes. They want to preserve the ability to compare actions (like bednets vs. bonfires) but need a way around the paralysis these arguments create.

  Looking at step (1), it relies on counterfactual reasoning: compare what happens if you act versus if you don't. But in both arguments, this leads to problems. For measurability, it assumes we can accurately assess counterfactuals, which is undermined by biased data. For systemic change, the counterfactual impact of one action is near zero. So maybe the issue is how "difference" is conceptualized. 

  The user mentioned a quantifier slip—confusing "can't rank precisely" with "can't rank at all." That resonates. The arguments overgeneralize from uncertainty to total ignorance. Step (9) claims we have "no reason" to think the best-looking option is best, but that's too strong. Even with imperfect data, some evidence is better than none. Rejecting all comparisons isn't necessary; we can use probabilistic reasoning instead. This addresses both arguments: measurable interventions provide stronger evidence, but systemic ones can still have expected value based on available data.

  The user also wants to know if the measurability critique still holds after fixing the flaw. Yes, it does—measurable interventions might be overvalued, but it's a call for epistemic humility, not surrender. We can combine different evidence types and acknowledge uncertainty without abandoning comparisons.

  For the systemic argument, the zero-probability claim ignores that collective actions are aggregates of individual contributions. Being part of a causal chain matters, even if no one is pivotal alone. This reframes the counterfactual: instead of asking if you single-handedly change outcomes, ask about your role in the collective effort.

  The user's deeper need is practical. They've built their career around earning to give and need to know if their approach is still valid. The cleaned-up version supports using evidence while acknowledging its limits. Bednets vs. bonfires remains a valid comparison; systemic interventions require different evidence but aren't incomparable. Their plan isn't undermined, but they should incorporate uncertainty and diversify approaches.

  Finally, addressing their attachment to step (1): replacing strict counterfactuals with expected value and participation in collective actions preserves consequentialism without paralysis. The bug was in demanding certainty and individual pivotality; the fix allows actionable decisions under uncertainty.
answer: |-
  Your friend's arguments are clever but overextend valid critiques into self-defeating paralysis. The core bug is in **step (9)**, which commits a **quantifier scope error** by conflating *imperfect evidence* with *no evidence*. Here’s the breakdown:

  ### The Flaw: Step (9)’s Overreach
  - **The Quantifier Slip**: Steps (3)–(7) correctly show that *measuring exact good-per-dollar* is impossible due to systemic bias. But step (9) leaps to "you have **no reason** to think the option that looks best is best." This confuses:  
    - *Weak claim*: "We can’t be **certain** which option is best." (True)  
    - *Strong claim*: "We have **no rational basis** for preferring one option over another." (False)  
  - **Why it’s wrong**: Even with biased evidence, some options have **asymmetric justifications**. Bednets vs. bonfires isn’t just "looks better" – it has overwhelming mechanistic evidence (insecticide kills mosquitoes) and no plausible downside. Measurability bias doesn’t erase all signal; it *attenuates* it. We can still assign higher *expected value* to interventions with strong direct evidence vs. those with none.

  ---

  ### Rejecting Other Steps: Costs & Consequences
  - **Reject (1)**: You’d lose the core of consequentialism. Cost: High. Alternative: Keep (1) but define "difference" as *expected impact* under uncertainty (e.g., probability-weighted outcomes).  
  - **Reject (3)/(4)**: Denying measurability bias ignores real epistemic problems. Cost: Unwise – the bias exists.  
  - **Reject (5)**: Claiming rankings are reliable despite bias is empirically false. Cost: Ignores critical thinking.  
  - **Reject (10)**: Abandoning obvious comparisons (bednets > bonfire) is absurd. Cost: Total paralysis.  

  **Step (9) is the weakest link** – rejecting it costs nothing and preserves rationality.

  ---

  ### The Systemic Argument’s Flaw (a–e)
  - **Shared bug with (1)**: Both rely on a **naive counterfactual** where your action only matters if *you alone change the outcome*.  
  - **Fix**: Replace "difference your action makes" with *your causal contribution to collective outcomes*.  
    - Voting: Your ballot is a *constituent cause* of the election result.  
    - Donating: Your $ is a *partial cause* of the charity’s aggregate impact.  
  - **Why (b) and (d) fail**: Individual actions aren’t evaluated in isolation. If 1,000 people thinking "my donation does nothing" leads to $0 raised, the counterfactual isn’t "$10,000 wasted" but "$10,000 *not existing* for good." You’re part of the group that *makes the outcome possible*.

  ---

  ### Salvaging Measurability Bias & Systemic Critique
  Once fixed, these critiques remain useful but **narrower**:  
  | **Critique** | **Valid Scope** | **Invalid Overextension** |
  |--------------|----------------|--------------------------|
  | **Measurability Bias** | Comparing interventions *within the same evidence tier* (e.g., two RCT-backed health programs). Bias may favor easily measurable *versions* of systemic work (e.g., teacher training vs. policy reform). | Claiming we can’t compare *across evidence tiers* (e.g., bednets vs. advocacy). We can use Bayesian priors, mechanistic models, and diversification. |
  | **Systemic Pivotality** | Highlights that *isolated* actions rarely change systems. Supports investing in leverage points (e.g., policy, movement-building). | Denying *all* individual impact. Systemic change requires aggregating marginal contributions. |

  ---

  ### Your Earning-to-Give Plan: Still Standing
  - **What the fixed argument supports**:  
    - Donating to high-evidence interventions (e.g., global health) is **robustly good** – not because it’s "provably optimal," but because it has:  
      - Strong mechanistic plausibility (nets block mosquitoes).  
      - No credible paths to harm.  
      - Repeated observational success.  
    - Measurability bias **doesn’t make this evidence worthless** – it means we should:  
      - Adjust for uncertainty (e.g., use confidence intervals).  
      - Diversify (e.g., allocate 20% to systemic interventions with lower evidence quality).  
  - **What it challenges**:  
    - Overconfidence in precise cost-effectiveness ratios (e.g., "GiveWell’s #1 is 27% better than #2").  
    - Ignoring hard-to-measure interventions (e.g., policy advocacy, peacebuilding) that may have higher *tail probabilities* of massive impact.  

  ---

  ### Concretely: A Cleaned-Up Framework
  1. **Replace step (1) with**: *"What you ought to do depends on the **expected value** of your action, given available evidence and uncertainty."*  
  2. **For donations**:  
     - Prioritize interventions with **high-floor outcomes** (e.g., bednets save lives even if not optimally scalable).  
     - Allocate a portion to **high-ceiling systemic bets** (e.g., AI safety, institutional reform) despite measurement challenges.  
  3. **For career impact**:  
     - "Earning to give" at $200k/year likely beats most direct work *if* you donate effectively.  
     - But if you can work on pivotal systemic issues (e.g., AI governance), that may dominate – not because you’ll be "pivotal," but because talent in those fields is scarce.  

  **Bottom line**: Your plan isn’t "quietly eaten." Measurability bias and systemic complexity are **reasons to think harder, not stop thinking**. The strongest rebuttal to your friend: *"If we shouldn’t act unless we have perfect evidence or individual pivotality, we’d never brush our teeth to prevent cavities – but we do, because the expected value is clear enough."*
