answer: |-
  ## Setup, notation, and the assumptions I am making (≈150 words)

  Let days \(d = 1\) (Monday) to \(5\) (Friday). The teacher selects a day \(d\) for the exam according to a probability distribution \(p = (p_1, p_2, p_3, p_4, p_5)\), where \(p_d \geq 0\) and \(\sum_{d=1}^5 p_d = 1\). The *tail* \(T(d)\) is the probability the exam occurs on day \(d\) or later: \(T(d) = \sum_{e=d}^5 p_e\) (with \(T(6) = 0\)). The *hazard* \(h(d)\) is the probability the exam occurs on day \(d\) given it hasn't occurred earlier: \(h(d) = p_d / T(d)\) (defined only if \(T(d) > 0\)). The threshold \(t = 1/2\) defines surprise. The student's credence on morning \(d\) is \(h(d)\), conditional on no exam before \(d\). The teacher's payoff is \(1\) if the exam is a surprise on day \(d\), plus \(0.1 \times (d - 1)\) (so \(+0.0\) Mon, \(+0.4\) Fri).

  **Key Assumptions:** (i) Student is an ideal Bayesian. (ii) Common knowledge of \(p\) and teacher truthfulness. (iii) Student guesses at most once. **Assumption (ii) is load-bearing;** weakening it (e.g., student uncertainty about \(p\)) fundamentally changes the analysis. I assume thresholds are *strict* (\(h(d) < 1/2\) for surprise) unless noted otherwise. The choice \(t=1/2\) is illustrative; the dialectic holds for any \(t < 1\), but the specific probability of success depends on \(t\).

  ---

  ## The graded collapse: what the classical argument really establishes (≈350 words)

  Under (C) and (A), the exam on day \(d\) is a surprise iff the student's credence \(h(d)\) (for (C)) or the best attainable predictive success \(\max_{e \geq d} p(e)/T(d)\) (for (A)) is \(< 1/2\). Crucially, \(h(5) = p_5 / p_5 = 1 > 1/2\) for any \(p\) with \(p_5 > 0\). Thus, if Friday has positive probability, it *cannot* be a surprise. This is the fixed point: the announcement implies \(p_5 = 0\), eliminating Friday.

  But the collapse continues probabilistically. If Thursday is still possible (\(T(4) > 0\)), then conditional on reaching Thursday morning (\(T(4)\)), \(h(4) = p_4 / T(4)\). For Thursday to be a surprise, we need \(h(4) < 1/2\), implying \(p_4 < (1/2)T(4)\). But \(T(4) = p_4 + p_5\), and since \(p_5 = 0\) (Friday eliminated), \(T(4) = p_4\). Thus \(p_4 < (1/2)p_4\), forcing \(p_4 = 0\). Similar reasoning eliminates Wednesday, Tuesday, and Monday: the *only* distribution satisfying surprise with certainty under (C) or (A) is \(p_d = 0\) for all \(d\), contradicting the exam's occurrence. Surprise with certainty is impossible.

  We instead maximize the *probability* the exam is a surprise. This requires \(p_5 > 0\) (to have an exam), so Friday cannot be a surprise. Surprise must occur Mon-Thu. The hazard \(h(d)\) must be \(< 1/2\) on the day the exam occurs.

  **Procedure (U): Uniform, \(p_d = 1/5\) for all \(d\).**
  | Day \(d\) | Tail \(T(d)\) | Hazard \(h(d)\) | Surprise (h(d) < 1/2)? |
  |-----------|--------------|----------------|------------------------|
  | 1 (Mon)  | 1.0          | 0.2            | Yes (0.2 < 0.5)        |
  | 2 (Tue)  | 0.8          | 0.25           | Yes (0.25 < 0.5)       |
  | 3 (Wed)  | 0.6          | **0.333...**   | **NO (1/3 ≈ 0.333 > 0.5? No, 1/3 < 0.5)** |
  | 4 (Thu)  | 0.4          | 0.5            | **NO (0.5 ≮ 0.5)**     |
  | 5 (Fri)  | 0.2          | 1.0            | No                     |

  *(Correction: Under strict threshold, Thu fails because h(4)=0.5 is not less than 0.5. Wed hazard 1/3≈0.333 is less than 0.5, so surprise possible on Wed.)*
  Surprise occurs only if exam is Mon, Tue, or Wed (prob = 3/5 = 0.6). Thu fails (h(4)=0.5 ≮ 0.5), Fri always fails.

  **Procedure (G):** Geometric decay, \(p = (1/2, 1/4, 1/8, 1/16, 1/16)\). Tails: \(T(1)=1\), \(T(2)=1/2+1/8+1/16+1/16=1/2\), \(T(3)=1/4+1/8+1/16+1/16=1/2?\) Wait, recalculate: p2=1/4, p3=1/8, p4=1/16, p5=1/16. So T(3) = p3+p4+p5 = 1/8 + 1/16 + 1/16 = 1/8 + 1/8 = 1/4? Let's compute properly:
  - \(T(1) = 1/2 + 1/4 + 1/8 + 1/16 + 1/16 = 1/2 + 1/4 + 1/8 + 1/8 = 1/2 + 1/4 + 1/4 = 1/2 + 1/2 = 1.0\)
  - \(T(2) = p_2 + p_3 + p_4 + p_5 = 1/4 + 1/8 + 1/16 + 1/16 = 1/4 + 1/8 + 1/8 = 1/4 + 1/4 = 1/2\)
  - \(T(3) = p_3 + p_4 + p_5 = 1/8 + 1/16 + 1/16 = 1/8 + 1/8 = 1/4\)
  - \(T(4) = p_4 + p_5 = 1/16 + 1/16 = 1/8\)
  - \(T(5) = p_5 = 1/16\)

  Hazards:
  - \(h(1) = p_1 / T(1) = (1/2)/1 = 0.5\)
  - \(h(2) = p_2 / T(2) = (1/4)/(1/2) = 0.5\)
  - \(h(3) = p_3 / T(3) = (1/8)/(1/4) = 0.5\)
  - \(h(4) = p_4 / T(4) = (1/16)/(1/8) = 0.5\)
  - \(h(5) = p_5 / T(5) = (1/16)/(1/16) = 1.0\)

  | Day \(d\) | Tail \(T(d)\) | Hazard \(h(d)\) | Surprise (h(d) < 1/2)? |
  |-----------|--------------|----------------|------------------------|
  | 1 (Mon)  | 1.0          | 0.5            | **NO (0.5 ≮ 0.5)**     |
  | 2 (Tue)  | 0.5          | 0.5            | **NO**                |
  | 3 (Wed)  | 0.25         | 0.5            | **NO**                |
  | 4 (Thu)  | 0.125        | 0.5            | **NO**                |
  | 5 (Fri)  | 0.0625       | 1.0            | No                     |

  Surprise *never* occurs under (G) with a strict threshold! The hazard is exactly 0.5 until Friday. If we use a *non-strict* threshold (\(\leq 1/2\)), then Mon-Thu have \(h(d) = 0.5 \leq 0.5\), so surprise occurs unless it's Friday (prob = \(1 - p_5 = 15/16\)). This knife-edge reveals the mechanism: the classical elimination relies on the hazard *equaling* 1 on the last day. (G) holds the hazard constant at \(t\) until the end, minimizing the probability mass on the unsurprising day (Fri, prob=1/16). **Optimality:** Under strict thresholds, (G) is useless (P(surprise)=0). Under non-strict thresholds (\(\leq t\)), (G) achieves P(surprise) = \(1 - p_5 = 15/16\). Can we beat this? Suppose we shift mass from Fri to Thu: e.g., \(p = (1/2, 1/4, 1/8, 3/16, 1/16)\). Then \(h(4) = (3/16) / (3/16 + 1/16) = 3/4 > 1/2\), so if exam is Thu, it's not a surprise. P(surprise) = P(not Thu or Fri) = P(Mon, Tue, Wed) = \(1/2 + 1/4 + 1/8 = 7/8 = 14/16 < 15/16\). Shifting mass earlier only increases hazards on days that could be surprising, lowering P(surprise). (G) with non-strict threshold maximizes P(surprise) at \(1 - p_5 = 15/16\) by concentrating unavoidable unsurprise on the minimal-probability day (Fri). The teacher's preference for later days makes (G) dominant under non-strict (A)/(C) or under (E).

  ---

  ## The case that the announcement survives (≈350 words)

  Precisification (E) offers an escape. Surprise holds iff the student's *ex-ante* best attainable predictive success, \(\max_d p_d\), is \(\leq t = 1/2\). This is a global property of \(p\), not day-specific. Under (E), the announcement "the exam will be a surprise" translates to "\(\max_d p_d \leq 1/2\)". This *is* satisfiable: (U) has \(\max p_d = 1/5 = 0.2 < 0.5\), (G) has \(\max p_d = p_1 = 0.5 \leq 0.5\) (if non-strict). The classical elimination argument doesn't apply; Friday isn't eliminated because (E) doesn't require low credence *on the day*.

  However, (E) faces a decisive objection rooted in dynamic inconsistency. Consider (G) under (E): ex-ante, \(\max_d p_d = 1/2 \leq 1/2\), so (E) deems the exam a surprise. But suppose the exam is on Thursday. On Thursday morning, \(T(4) = p_4 + p_5 = 1/16 + 1/16 = 1/8\). The student's occurrent credence \(h(4) = p_4 / T(4) = (1/16)/(1/8) = 1/2\). Her best *attainable* success *that morning* (under (A)) is \(\max_{e \geq 4} p(e)/T(4) = \max( (1/16)/(1/8), (1/16)/(1/8) ) = \max(0.5, 0.5) = 0.5\). Under strict (C) or (A), this is *not* a surprise. Yet (E) declares it one based on Sunday's perspective. This is incoherent: the student *can* "see it coming" on Thursday morning because her credence is high (0.5), and she knows if it happens then, it's happening. (E) ignores the informational updating along the way, mistaking an ex-ante constraint for the lived experience of surprise.

  This connects to game theory. The classical elimination resembles backward induction in a perfect information game: eliminate Friday (last move), then Thursday, etc. Standard worries about backward induction apply: it assumes rationality (here, Bayesian updating and the surprise condition) holds even at nodes (days) reached with zero probability under the solution. In this paradox, if \(p_5 = 0\), Friday is eliminated, but the student's belief *on Friday* (if counterfactually reached) is undefined (\(T(5)=0\)). The elimination argument implicitly assumes the student would still reason rationally *and* find Friday unsurprising even in that undefined state. This is dubious. The disanalogy is substantive: the exam paradox is a fixed-point condition on beliefs ("you won't see it coming" constrains beliefs on every possible path), not a strategic game. The fixed-point requires well-defined beliefs everywhere, forcing \(p_5 = 0\) for Friday to be 'surprising' counterfactually. But this propagates, causing collapse. Under (E), the fixed-point is weaker (only ex-ante), avoiding collapse but sacrificing relevance to the student's actual epistemic state on the exam day.

  ---

  ## Verdict (≈300 words)

  Precisification (C) – occurrent credence – is the right explication of "surprise." It directly captures the student's epistemic state *on the morning of* the exam: does she see it coming? (A) reduces to (C) in this setup: on morning \(d\), the best attainable guess is \(\max_{e \geq d} p(e)/T(d)\). But since the student observes no-exam earlier, her credence for day \(e\) is \(p(e)/T(d)\). The maximum over \(e \geq d\) is thus the maximum of her credences for the remaining days. Crucially, if \(h(d) \geq t\) (high chance *today*), then guessing today gives success probability \(h(d) \geq t\), so the best attainable success \(\geq t\). Conversely, if all \(h(e) < t\) for \(e \geq d\), then best attainable \(< t\). Thus, under the student's actual beliefs, (A) and (C) are equivalent for assessing surprise *on the day it occurs*. (E) fails because it ignores the dynamic perspective.

  Under (C)/(A), with strict threshold (\(h(d) < 1/2\)), surprise with *certainty* is impossible (§2). The teacher can achieve high probability: \(15/16\) using (G) with a *non-strict* threshold (\(h(d) \leq 1/2\)). However, strict thresholds better match "you will not have been able to see it coming" – a credence of exactly 0.5 means the student sees it as equally likely to be today or later; she partly sees it coming. Adopting strict thresholds forces P(surprise) \(< 1\). (G) adjusted to ensure \(h(d) < 1/2\) (e.g., \(p = (0.49, 0.49 \times 0.5, 0.49 \times 0.25, 0.49 \times 0.125, 0.51 \times 0.125)\)? Wait, needs sum=1. Optimal under strict threshold: Shift mass slightly. Let \(p = (1/2 - \epsilon/2, 1/4 - \epsilon/4, 1/8 - \epsilon/8, 1/16 - \epsilon/16, 1/16 + \epsilon)\). For small \(\epsilon > 0\), hazards Mon-Thu are slightly below 0.5, Fri hazard=1. P(surprise) = P(not Fri) = 1 - (1/16 + \epsilon) = 15/16 - \epsilon < 15/16\). Max P(surprise) approaches \(15/16\) but is less than 1. (G) remains optimal under non-strict or as limit under strict.

  The classical argument is **sound but not genuinely paradoxical**. It correctly shows surprise cannot be *certain* under (C)/(A) with a known distribution. The seeming contradiction ("there must be a surprise exam" vs. "there can't be") dissolves into a probabilistic trade-off: the teacher can make surprise very likely, but not guaranteed, by concentrating the risk of failure on a low-probability day (Friday). Under the teacher's payoff (surprise + 0.1*(delay)), (G) (or its strict-threshold approximation) is optimal: it yields surprise with prob ≈15/16 (only Fri fails) *and* maximizes expected delay bonus (E[delay] = 0.1*[1*(1/2) + 2*(1/4) + 3*(1/8) + 4*(1/16) + 5*(1/16)] = 0.1*[0.5 + 0.5 + 0.375 + 0.25 + 0.3125] = 0.1*1.9375 = 0.19375). The announcement is true with high probability (15/16), but false if the exam is on Friday. The teacher rationally chooses a procedure where the announcement is probably true.

  ---

  ## What would change my mind (≈200 words)

  The single most vulnerable point is **Assumption (ii): Common knowledge of the procedure \(p\).** My analysis assumes the student knows \(p\) exactly. Suppose the student has some uncertainty about \(p\). For instance, perhaps she believes \(p\) is close to (G) but not identical. On Friday morning, if no exam yet, she must have \(T(5) > 0\). Her credence \(h(5)\) is her belief that the exam is *today* given \(T(5)\). If she is uncertain whether \(p_5 = 1/16\) or slightly higher/lower, her posterior \(h(5)\) *could* be less than 1/2. For example, if she assigns positive credence to the teacher using a distribution where Fri has probability <1/2 *conditional on reaching Fri*, then \(h(5) < 1/2\) is possible. Surprise on Friday becomes conceivable. This could enable distributions achieving P(surprise)=1, undermining the core impossibility result and potentially reversing my verdict that certainty is unattainable under (C)/(A). The arithmetic in §2 relies on \(h(5)=1\) following from known \(p_5 > 0\) and Bayesian updating; if \(p\) is uncertain, this fails. While the dynamic inconsistency argument against (E) and the case for (C) might stand, the optimality of (G) and the probabilistic limit would crumble if certainty is possible. My reasoning is most likely wrong if common knowledge is implausibly strong in this context. If we relax (ii), the paradox might resurrect its bite by allowing true surprise everywhere.
