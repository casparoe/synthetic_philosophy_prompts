answer: |-
  Your request demands precision—let's dissect *Everything Everywhere All at Once* through the lens of anattā (no-self), rigorously mapping doctrinal logic onto cinematic specifics while marking contested terrain and filmic resistances. I'll proceed stepwise, citing key Buddhist texts (e.g., *Milindapañha*, Nāgārjuna's *Mūlamadhyamakakārikā*) and contemporary philosophy (Parfit, Siderits).

  **Core Settled Doctrine (Buddhist Anattā):**  
  1. **Denial of Substantial Self:** Rejects an eternal, unchanging *ātman* (self-essence). Persons are empty (*śūnya*) of inherent existence, constituted by impermanent, dependently arisen (*pratītyasamutpāda*) aggregates (*skandhas*).  
  2. **Conventional Designation:** "Self" is a pragmatic label (*prajñapti*) applied to ever-changing processes—not a metaphysical truth.  
  3. **Continuity ≠ Identity:** Causal continuity (*santāna*) of aggregates explains rebirth/persistence without a persisting self. Fission cases (Parfit) show identity's conventionality but *differ* from Buddhist causal streams, which are linear karmic sequences.

  **Film Analysis: Candidate Mappings**  

  ### Candidate 1: *Multiverse as Exposition of Dependent Origination*  
  - **Thesis:** Evelyn's variants illustrate *pratītyasamutpāda*—each "self" arises from unique causes (e.g., laundromat Evelyn vs. movie star Evelyn). No essence unites them; differences expose identity's contingency.  
  - **Film Support:**  
    - Variants diverge from singular ancestry (e.g., Evelyn's choice to marry Waymond), demonstrating how conditions (*pratyaya*) shape apparent selves.  
    - Jobu Tupaki’s nihilism ("nothing matters") mirrors the danger of misinterpreting emptiness as existential void (*ucchedavāda*).  
  - **Discarded? Partially.** Fails your first point: variants lack *causal continuity* with each other. They’re parallel existences, not a stream of contiguous moments. Anattā traditionally operates *within* a causal chain, not across disconnected branches.  

  ### Candidate 2: *Counterparts as Conventional Designations*  
  - **Thesis:** Evelyn’s variants are distinct conventional persons (*sammuti-satta*), with "Evelyn" as a shared label. The film forces her to see that *no underlying substrate* justifies privileging "prime" Evelyn.  
  - **Film Support:**  
    - Rock scene: Absent bodies/thoughts, "Evelyn" and "Joy" are labels for silent awareness—directly echoing *anattā* (e.g., *Visuddhimagga* XVI: "Mere suffering exists, no sufferer").  
    - Alpha-verse parents: Arbitrary designation ("you are Evelyn because we named you") mirrors Buddhist nominalism.  
  - **Discarded? No—but incomplete.** Solves your first concern: variants aren’t fission products but distinct entities sharing a nominal designation. However, misses the film’s emphasis on *interconnection* (e.g., verse-jumping as skill-sharing, not identity-claiming).  

  ### Candidate 3: *Verse-Jumping as Śūnyatā in Action (Strongest Mapping)*  
  - **Thesis:** The multiverse collapses distinctions between "selves," revealing all phenomena (including persons) as empty (*śūnya*) of inherent identity. Evelyn’s awakening is the realization that *clinging to "her" identity* causes suffering—not the discovery of a true self.  
  - **Film Alignment:**  
    - **Counterparts ≠ Fission:** Agrees with your observation. Variants are karmic "what-ifs" (Nāgārjuna’s *MMK* 17:24: past/future depend on present conditions), not a splitting stream. This *strengthens* anattā: even *within* a life, identity is fragmented and contingent.  
    - **The "Seer" Question:** What sees the conventional self? The film implies *awareness itself* (rock scene’s wordless witnessing), stripped of egoic narration. This aligns with Buddhism’s "luminous mind" (*pabhassara citta*), *not* a substantial self (see *Anguttara Nikāya* 1:10—clarity obscured by defilements).  
    - **Kindness as Conventional Repair:** Acts of kindness (tax-audit hug, Raccaccoonie) reinstate *healthy convention*—not a robust self. As Nāgārjuna states: "Without relying on convention, the ultimate cannot be taught" (*MMK* 24:10). The film’s kindness *operates* within emptiness, easing suffering without metaphysical baggage.  
  - **Resistances in the Film:**  
    1. **Emotional Resolution:** Evelyn’s reconciliation with Joy *feels* agentive ("I choose to stay with you"). This risks reinstating a self-as-chooser (*contra* anattā’s denial of agency). The film leans therapeutic ("stop fighting" vs. "no fighter exists").  
    2. **Alpha Verse Hierarchy:** The prime universe’s narrative centrality subtly privileges one causal stream, muddying radical equivalence.  

  ### Contested Terrain & Speculative Leaps  
  - **Anattā: Metaphysics or Therapy?** Film leans therapeutic—Evelyn’s freedom comes from *releasing fixation* on identity (echoing Ñāṇavīra Thera’s view). But the metaphysics of emptiness remains implied.  
  - **Reductionism vs. Eliminativism:** Film is reductionist (selves as useful fictions), not eliminativist (no talk of persons). Jobu’s nihilism is the eliminativist error corrected by conventional kindness.  
  - **Parfit Resemblance:** Parfitian "Relation R" (psychological connectedness) is *absent*—Evelyn shares little with variants. Yet both conclude identity is "not what matters"; kindness survives its deconstruction.  

  **Conclusion:** The strongest mapping is **Candidate 3**. The multiverse vividly illustrates *śūnyatā*—variants are empty designations, interconnected but essenceless. The rock scene distills anattā: no thinker, just awareness. Kindness reinstates convention without ontology. Key resistance: the film’s emotional climax *narrativizes* a choosing self, even as it denies selfhood. This tension mirrors Buddhist pedagogy: first deconstruct, *then* re-engage conventionally—wisely, compassionately.  

  *Where I go beyond the film:* I posit verse-jumping as a metaphor for *moment-to-moment mind-stream discontinuity* (beyond the film’s literal multiverse). The film can’t carry full eliminativism—its joy requires a conventional "we."
