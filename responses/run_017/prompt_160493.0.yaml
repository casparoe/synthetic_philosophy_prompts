  So what is being levelled down? It is the prospects (expected well-being) of both individuals. But note, in this case, we are not making one person's prospect worse off to benefit another in prospect? Actually, we are making both worse off, and there is no one better off. So it is a case of a general worsening of prospects. However, the ex post view is willing to accept this general worsening because it avoids the very bad realizations.

  This is a different objection from the original levelling down. The original levelling down objection was about outcomes: making one person worse off without benefit to anyone. Here, in every outcome, we are benefiting one and harming the other. But overall, in expectation, everyone is harmed. The ex post prioritarianism sometimes prefers a policy that makes everyone worse off in expectation, if it avoids extreme bads. This is not levelling down in the original sense, but it is a form of avoiding bad situations at the cost of overall expected well-being. It is an objection that the view is too risk-averse in the social evaluation.

  2. Should rank-weighted rendering count as prioritarianism?

  Prioritarianism is often defined as being separable across individuals (like the concave-transform version). The rank-weighted version is not separable because the weight on a person's well-being depends on their rank in the distribution, which depends on others. So it is not separable. However, both have the property that they give priority to the worse-off. The rank-weighted version is often associated with egalitarianism because it explicitly uses the rank and is not separable. 

  But note: prioritarianism is sometimes characterized as having a fixed priority to the worse-off that does not depend on the relative positions (so that the weight depends only on the absolute level). The rank-weighted version, however, gives weight based on the relative rank. 

  What turns on this classification? If the rank-weighted version is classified as egalitarianism, then the example might not be a challenge to prioritarianism per se. However, the concave-transform version is a standard prioritarian view, and the example works for both. So the example still challenges ex post prioritarianism (concave-transform). But if the rank-weighted is not prioritarian, then condition 4 only requires the concave-transform to prefer S, and we have that. But the problem asked for both. Moreover, the example shows that a view that gives extra weight to the worse-off (whether by rank or by concave transformation) can exhibit this reversal under uncertainty. Therefore, the example is damaging to any view that applies the priority rule ex post.

  3. Which reading is correct?

  The rationale of prioritarianism is that it matters more to benefit people the worse off they are. This rationale is naturally applied at the ex post stage: when we are considering the actual well-being levels, that is when we can say that benefiting a person at a lower level matters more. Therefore, the ex post reading is more in line with the rationale. 

  But the ex post reading leads to the problem we see: it may prefer a policy that lowers everyone's expected well-being. This seems unacceptable to many because it violates ex ante Pareto: if every individual is worse off in expectation, then it should be worse. But the prioritarian might respond that the ex ante Pareto principle is not compelling when there are concerns about fairness in the outcomes. However, the violation of ex ante Pareto is a serious cost.

  The ex ante reading avoids this by applying the priority rule to expectations. But then it might ignore the distribution of risks. In our example, under R, person A faces a risk of a very bad outcome (1) and B faces a risk of a bad outcome (2). The ex ante view only sees the expectations and does not care about the spread. But the rationale says we should care more about benefiting the worse off, and a person facing a risk of being very badly off is someone we should care about. The ex ante view aggregates first and then applies the priority, which might not capture the risk of being very badly off.

  The strongest reason for ex post is the very rationale: the moral weight of a benefit depends on the actual level at which it is received, not the expected level. If a person ends up at level 1, then a benefit to them at that time matters a lot, regardless of the ex ante expectation.

  But the example shows that the ex post view can lead to choosing a policy that is worse for everyone in expectation. This is a strong reason to prefer ex ante.

  Conclusion:

  I am confident in the arithmetic because I have double-checked the calculations. This is a genuine analogue of levelling down in the sense that we are making everyone worse off in expectation, which is a form of levelling down of prospects. However, it is not the same as the original levelling-down objection, which was about outcomes. It is a new objection that arises under uncertainty.

  The verdict on ex ante versus ex post: I think the ex ante reading is more plausible because it respects the ex ante Pareto principle. But the rationale of prioritarianism pushes towards ex post. I am least sure of the claim that the rank-weighted version should be classified as prioritarianism. It might be a form of egalitarianism, but the example still stands for the concave-transform prioritarianism.

  The one claim I am least sure of is whether the ex post prioritarian can adequately defend the violation of ex ante Pareto. Maybe they can argue that the avoidance of catastrophic outcomes is worth the cost in expected well-being. But it remains controversial.

