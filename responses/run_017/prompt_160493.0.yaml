  ### Case Construction

  **Setup**: Two people (A and B), two equally likely states (State 1 and State 2, each with probability 0.5), two policies (R and S). Well-being levels:

  | Policy | State 1 (p=0.5) | State 2 (p=0.5) |
  |--------|-----------------|-----------------|
  |        | A      | B      | A      | B      |
  | R      | 1.000  | 100.000| 50.000 | 2.000  |
  | S      | 20.000 | 50.000 | 20.000 | 30.000 |

  **Expected Well-being**:
  - R: \( E_R[A] = 0.5 \times 1.000 + 0.5 \times 50.000 = 25.500 \)
    \( E_R[B] = 0.5 \times 100.000 + 0.5 \times 2.000 = 51.000 \)
  - S: \( E_S[A] = 0.5 \times 20.000 + 0.5 \times 20.000 = 20.000 \)
    \( E_S[B] = 0.5 \times 50.000 + 0.5 \times 30.000 = 40.000 \)

  **Conditions Satisfied**:
  1. Both have higher expected well-being under R (A: 25.500 > 20.000, B: 51.000 > 40.000).
  2. A is worse off in expectation under both policies (25.500 < 51.000 in R; 20.000 < 40.000 in S), and A's expectation is reduced in S (25.500 → 20.000).
  3. In State 1: R better for B (100.000 > 50.000) but worse for A (1.000 < 20.000). In State 2: R better for A (50.000 > 20.000) but worse for B (2.000 < 30.000). Neither policy dominates in any state.

  **Prioritarianism Renderings**:
  - **Concave-transform**: \( f(u) = \sqrt{u} \) (strictly increasing, strictly concave).
  - **Rank-weighted**: Weights \( w = (2, 1) \) for worse-off and better-off.

  #### Ex Post Prioritarianism (applies \( V \) to each state, then averages)
  | Policy | State 1: \( V \) | State 2: \( V \) | Ex Post Total \( (0.5 \times V_1 + 0.5 \times V_2) \) |
  |--------|------------------|------------------|------------------------------------------------------|
  | **R**  | Concave: \( \sqrt{1.000} + \sqrt{100.000} = 1.000 + 10.000 = 11.000 \) <br> Rank: \( 2 \times \min(1.000, 100.000) + 1 \times \max(1.000, 100.000) = 2 \times 1.000 + 1 \times 100.000 = 102.000 \) | Concave: \( \sqrt{50.000} + \sqrt{2.000} \approx 7.071 + 1.414 = 8.485 \) <br> Rank: \( 2 \times \min(50.000, 2.000) + 1 \times \max(50.000, 2.000) = 2 \times 2.000 + 1 \times 50.000 = 54.000 \) | Concave: \( 0.5 \times 11.000 + 0.5 \times 8.485 = 9.743 \) <br> Rank: \( 0.5 \times 102.000 + 0.5 \times 54.000 = 78.000 \) |
  | **S**  | Concave: \( \sqrt{20.000} + \sqrt{50.000} \approx 4.472 + 7.071 = 11.543 \) <br> Rank: \( 2 \times \min(20.000, 50.000) + 1 \times \max(20.000, 50.000) = 2 \times 20.000 + 1 \times 50.000 = 90.000 \) | Concave: \( \sqrt{20.000} + \sqrt{30.000} \approx 4.472 + 5.477 = 9.949 \) <br> Rank: \( 2 \times \min(20.000, 30.000) + 1 \times \max(20.000, 30.000) = 2 \times 20.000 + 1 \times 30.000 = 70.000 \) | Concave: \( 0.5 \times 11.543 + 0.5 \times 9.949 = 10.746 \) <br> Rank: \( 0.5 \times 90.000 + 0.5 \times 70.000 = 80.000 \) |
  | **S ≻ R?** | **Yes** (Concave: 10.746 > 9.743; Rank: 80.000 > 78.000) |

  #### Ex Ante Prioritarianism (applies \( V \) to expected well-being vector)
  - **R**: Expected vector = (25.500, 51.000)
    - Concave: \( \sqrt{25.500} + \sqrt{51.000} \approx 5.050 + 7.141 = 12.191 \)
    - Rank: Sorted (25.500, 51.000) → \( 2 \times 25.500 + 1 \times 51.000 = 102.000 \)
  - **S**: Expected vector = (20.000, 40.000)
    - Concave: \( \sqrt{20.000} + \sqrt{40.000} \approx 4.472 + 6.325 = 10.797 \)
    - Rank: Sorted (20.000, 40.000) → \( 2 \times 20.000 + 1 \times 40.000 = 80.000 \)
  - **R ≻ S?** **Yes** (Concave: 12.191 > 10.797; Rank: 102.000 > 80.000)

  **Result**: Ex post prioritarianism strictly prefers S; ex ante strictly prefers R, under both renderings.

  ---

  ### Conceptual Analysis

  **What is Levelled Down?**  
  Prospects (expected well-being) are levelled down: Both individuals have lower expectations under S (A: 25.500 → 20.000; B: 51.000 → 40.000). The original levelling-down objection targets outcomes where someone is made worse off without anyone gaining, violating strict monotonicity. Both prioritarianism renderings avoid this: They are strictly increasing in individual well-being, so no such outcome is ever ranked higher. Here, the levelling down occurs in the *ex ante* distribution of prospects—everyone’s prospects are diminished, but S is preferred ex post due to avoidance of catastrophic outcomes (e.g., well-being of 1.000 or 2.000 in R). This is not the same objection; it is a distinct *ex ante Pareto* violation under uncertainty, where a policy reducing everyone’s prospects is chosen to reduce outcome inequality or extreme lows.

  **Rank-Weighted as Prioritarianism?**  
  The rank-weighted rendering should **not** be classified as prioritarianism. Prioritarianism requires *separability* (no cross-person dependencies) and weights based on *absolute* well-being levels. Rank-weighting violates separability (weights depend on relative ranks) and focuses on *comparative* disadvantage, making it a form of egalitarianism. This classification matters for the example’s implications: The concave-transform version (true prioritarianism) also exhibits the reversal, so the core challenge holds. However, if rank-weighted is misclassified, it might obscure that the issue stems from prioritarianism’s core rationale (absolute priority to the worse-off) when applied ex post.

  **Ex Ante vs. Ex Post: Which is Correct?**  
  **Ex ante** is correct for prioritarianism. The rationale—benefiting people matters more the worse off they are—must apply to *actual* benefits, which are realized in outcomes, not expectations. Ex post prioritarianism directly respects this by evaluating benefits relative to realized well-being levels (e.g., helping someone at 1.000 matters more than at 20.000). Ex ante aggregates first, diluting the moral urgency of catastrophic risks (e.g., A’s 1.000 in R) by averaging them with higher outcomes. The strongest reason: Moral urgency depends on actual, not expected, suffering. If prioritarianism cares about absolute well-being, it must prioritize those who *end up* worse off, not those who *might* end up worse off.

  ---

  ### Confidence Assessment
  - **Arithmetic**: High confidence. All calculations verified stepwise to three decimals.
  - **Levelling-Down Analogue**: Moderate confidence. It is a genuine analogue in that prospects are worsened for all, but it is distinct from outcome-level levelling down.
  - **Ex Ante vs. Ex Post Verdict**: Moderate confidence. Ex post aligns better with the rationale, but the ex ante Pareto violation is a serious cost.
  - **Least Sure Claim**: That rank-weighted rendering is not prioritarianism. While it violates separability, some argue it captures priority to the worse-off; however, its reliance on relative ranks blurs the line with egalitarianism.
