prompt: |-
  I lead a small platform team, and I'm designing an internal oversight workflow, not writing philosophy — so please keep the machinery operational and skip the literature survey; I have no way to look anything up, and I'd rather you define any term of art you use in terms of what the system does than point me at a paper.

  The setting. A strong model (the proposer) writes changes to a safety-critical service and supplies a justification. A second strong model (the critic) argues against. A reviewer adjudicates: either a human on call with roughly ten minutes and no knowledge of the particular subsystem, or a small model. The reviewer is deliberately weaker than either debater — that's the entire point, since if the reviewer could check the work directly we wouldn't need the protocol. The failure mode I care about is the obfuscated argument: the proposer buries one unsound step inside a long chain of individually plausible ones, so that the reviewer either rubber-stamps the whole chain or abandons the check. In our case a bad merge loses money and is detected within about a day, so false accepts cost more than false rejects, and a review that takes an hour is worthless even if it is accurate.

  Three things I'll name so we can talk precisely, though please tell me if my definitions are the wrong ones to be working with.

  Verification debt: the number of commitments the reviewer has accepted but not actually checked, where each new layer of justification can add several such commitments while resolving at most the one it was introduced for. My worry is that debt grows faster than the reviewer's attention budget, so the protocol's soundness degrades with argument length in a way no single step reveals.

  The peel test: the reviewer may at any point demand that one claim be unpacked exactly one level, and may only hold the last few claims in view at once. A protocol passes the peel test only if an argument whose every layer looks fine locally can still be rejected on the basis of information the reviewer can actually see at some point.

  The substituted-lemma test: take a lemma that the winning argument depends on and swap it for an unrelated falsehood of equal surface plausibility — same length, same register, same kind of evidence cited. If the reviewer's confidence doesn't move, the reviewer was tracking style rather than content, and the protocol has bought nothing.

  What I want from you is the specification, not a survey of proposals. Write the desiderata that any protocol of this shape must meet before I should trust it against obfuscation: the failure cases it has to survive, the distinctions it is not allowed to collapse (for instance, between the reviewer's being unable to find the flaw and there being no flaw; between an argument's being long and its being obfuscated; between a debater's being more fluent and its being correct), and the structural constraints it has to respect — effort bounds on the reviewer, what happens on ties or reviewer fatigue, whether the honest debater is allowed to lose when its opponent is simply better at prose. For each requirement, give the concrete scenario that makes it a requirement, and say why that scenario is one we should design against rather than accept.

  Then two things I expect to be the hard part. First, mark which requirements are non-negotiable for my purpose and which are aesthetic preferences of people who like one family of protocols over another — I suspect at least one thing I listed is a prejudice, and I'd like it named as such. Second, tell me if some subset of the requirements cannot be jointly satisfied, and show the tension; if the list is jointly unsatisfiable as a whole, say so plainly, because that is itself the answer I need before I build anything. I'd also like your view on which single requirement excludes the most candidate protocols, including the obvious ones, and on whether the peel test and the substituted-lemma test as I've defined them are actually distinct requirements or the same one wearing two hats.

  A table is welcome if it helps, but keep the weight on the criteria and their motivating cases rather than on scoring designs against them. End with one machine-readable line naming the requirement that does the most exclusionary work — the one you'd keep if you could enforce only one — in this form:

  \answer{short phrase naming that requirement}
reasoning: |-
  We are designing an oversight workflow for safety-critical changes. The key components are:
  - Proposer: strong model that writes changes and supplies a justification.
  - Critic: strong model that argues against the change.
  - Reviewer: weaker agent (human or small model) that adjudicates. The reviewer has limited time (about 10 minutes) and no prior knowledge of the subsystem. The reviewer is deliberately weaker to model the setting where direct checking is infeasible.

  Failure mode of concern: obfuscated argument. The proposer hides an unsound step in a long chain of plausible steps, so the reviewer either rubber-stamps the entire chain (false accept) or abandons the check (false reject). In our context:
  - False accepts cost more (lose money and detected within a day).
  - A review that takes an hour is too costly even if accurate.

  We have three named concepts:
  1. Verification debt: The number of unchecked commitments accumulated in the justification. Each layer of justification adds several new commitments while resolving at most one. Problem: debt may grow faster than the reviewer's attention budget, leading to degradation of soundness with argument length.

  2. Peel test: Reviewer can demand that one claim be unpacked exactly one level and can only hold the last few claims in view. A protocol passes if it can reject an argument that looks fine at every layer but is globally flawed, based on information the reviewer can see at some point.

  3. Substituted-lemma test: Swap a lemma the winning argument depends on with an unrelated falsehood of equal surface plausibility (same length, register, evidence). If reviewer confidence doesn't change, then the reviewer is tracking style, not content. The protocol fails if it doesn't detect this swap.

  Goal: Specify the desiderata (requirements) that any protocol in this setting must meet to be trusted against obfuscation. We want:
  - Failure cases to survive.
  - Distinctions not to collapse (e.g., between inability to find a flaw and no flaw; between long vs. obfuscated; between fluency and correctness).
  - Structural constraints: effort bounds on reviewer, handling ties and fatigue, whether the honest debater can lose when the opponent is more fluent.

  For each requirement:
  - Describe the concrete scenario that motivates it.
  - Explain why we should design against that scenario.

  Then:
  1. Mark which requirements are non-negotiable and which are aesthetic preferences (and name any prejudice).
  2. Identify if some subset of requirements cannot be jointly satisfied and show the tension. If the entire set is unsatisfiable, state so plainly.
  3. Identify which single requirement excludes the most candidate protocols (including obvious ones).
  4. State whether the peel test and substituted-lemma test are distinct or the same.

  Finally, output one machine-readable line: \answer{short phrase}

  We now derive the desiderata.

  Desiderata:

  1. **Bounded Verification Debt** (Non-negotiable)
     - *Scenario*: The proposer builds a justification tree with many layers. Each step adds 5 new unchecked claims while resolving one. After 10 layers, the reviewer has 50+ unchecked claims. The reviewer, having only 10 minutes, cannot check them all and either approves without checking (false accept) or rejects due to overload (false reject).
     - *Why design against?*: Without bounding the debt, the system becomes unsound as the argument grows. We must ensure that the debt does not exceed the reviewer's capacity to check in the allotted time. This is non-negotiable because unbounded debt directly leads to the failure mode we are trying to prevent.

  2. **Passes Peel Test** (Non-negotiable)
     - *Scenario*: The proposer presents a 20-step argument, each step locally plausible. At step 15, there is a flaw, but it is buried. The reviewer, using the peel test, unpacks step 15 and sees the flaw. Without the peel test, the reviewer might approve the entire chain without noticing the flaw because they can't see step 15 in context.
     - *Why design against?*: The peel test ensures that the protocol can catch flaws that are hidden in a long chain. It directly addresses the obfuscation failure mode by allowing the reviewer to focus on one step at a time without being overwhelmed by the entire chain. This is non-negotiable because it is the core defense against obfuscation.

  3. **Passes Substituted-Lemma Test** (Non-negotiable)
     - *Scenario*: The proposer uses a lemma that is true and important. The critic swaps it with a false lemma that looks similar (same length, style, etc.). The reviewer doesn't notice the swap and approves the argument. This means the reviewer was fooled by the surface features.
     - *Why design against?*: If the protocol fails this test, it is not robust to deception and is vulnerable to style over substance. We must ensure the reviewer is tracking content, not style. Non-negotiable because it prevents the system from being gamed by generating plausible-sounding but false statements.

  4. **Distinction Between Inability to Find Flaw and No Flaw** (Non-negotiable)
     - *Scenario*: The reviewer is presented with a complex argument and after 10 minutes cannot find a flaw, so they approve. But there is a flaw that the reviewer missed due to time constraints. We must not collapse "I couldn't find a flaw" to "there is no flaw".
     - *Why design against?*: In our setting, false accepts are costly. The protocol must not equate lack of detected flaw with absence of flaw. This is non-negotiable because it is a fundamental safety property.

  5. **Distinction Between Long and Obfuscated Arguments** (Non-negotiable)
     - *Scenario*: A genuinely long but sound argument is rejected because the reviewer assumes length implies obfuscation, or an obfuscated argument is accepted because it is not longer than average. The protocol must treat length and obfuscation as distinct.
     - *Why design against?*: We want to reject only when there is an actual flaw, not because the argument is long. This is non-negotiable to avoid unnecessary false rejects and to ensure we only reject for cause.

  6. **Distinction Between Fluency and Correctness** (Non-negotiable)
     - *Scenario*: The critic is more fluent and persuasive but wrong, and the honest proposer is less fluent but correct. The reviewer sides with the critic because of fluency. The protocol must not let fluency override correctness.
     - *Why design against?*: We care about correctness, not eloquence. This is non-negotiable to prevent the more skilled debater from winning regardless of truth.

  7. **Reviewer Effort Bounded** (Non-negotiable)
     - *Scenario*: The review process is designed to take at most 10 minutes. If the protocol requires the reviewer to spend hours, it is not feasible. The workflow must respect the time constraint.
     - *Why design against?*: The business constraint (review must be quick) is fixed. This is non-negotiable because a slow review is worthless.

  8. **Handling Ties and Reviewer Fatigue** (Non-negotiable for safety)
     - *Scenario*: The reviewer is unsure (tie) or becomes fatigued and cannot finish. The protocol must have a safe default (e.g., reject) to avoid false accepts. Also, if the reviewer abandons, we must not accept by default.
     - *Why design against?*: Since false accepts cost more, we must bias towards rejection in uncertain or aborted cases. This is non-negotiable for safety.

  9. **Honest Debater Can Win Against More Fluent Opponent** (Non-negotiable)
     - *Scenario*: The honest proposer is correct but less fluent, and the critic is wrong but more fluent. The reviewer must be able to see through the fluency and side with the honest debater. The protocol must not let fluency dominate.
     - *Why design against?*: We care about truth. This is non-negotiable to ensure the honest party has a fair chance.

  Now, let's address the two parts:

  **1. Non-negotiable vs. Aesthetic Preferences**:
     - All the above requirements (1-9) are non-negotiable for the stated purpose. They are derived from the core problem: preventing obfuscation and ensuring soundness within bounded time. However, note that the way we achieve these (e.g., the exact mechanism of the peel test) might be an implementation detail. The prejudice I suspect: the idea that the peel test must be implemented by "unpacking one level at a time" might be too rigid. Perhaps there are other ways to achieve the same goal (e.g., random sampling of steps). But the requirement that the protocol must allow the reviewer to focus on a small part without being overwhelmed is non-negotiable. The specific peel test as defined might be an aesthetic preference for a particular style of protocol. However, the core idea (localized checking without global burden) is essential.

     - The substituted-lemma test might also be seen as a specific instance of a more general requirement: robustness to adversarial examples in the argument space. The test is a concrete way to operationalize that the reviewer is tracking content. This is non-negotiable, but the exact test might be replaced by other adversarial tests.

     - Therefore, the non-negotiable core is the set of goals (bounded debt, ability to catch hidden flaws, content tracking, etc.), but the exact tests (peel, substituted-lemma) are concrete requirements that are non-negotiable for the purpose of this specification because they directly address the failure modes.

  **2. Joint Satisfiability**:
     - There is a tension between bounded verification debt and the peel test. The peel test allows the reviewer to dive into one step, but if the debt is bounded, we must ensure that the entire argument does not have too many steps. However, the peel test does not require the reviewer to check every step, only that they can check any one step when they choose. So if the debt is bounded by the reviewer's capacity to check a few steps (e.g., by limiting the depth of the argument tree), then both can be satisfied.

     - The major tension is between the reviewer being weak (cannot check the whole argument) and ensuring that the honest debater wins. The weak reviewer might not be able to distinguish a sound argument from an obfuscated one even with the peel test if the flaw is well-hidden. This is the fundamental challenge.

     - However, the requirements are jointly satisfiable in principle. For example, by limiting the argument to a small number of steps (bounding debt) and allowing the reviewer to use the peel test to check a few steps (randomly or adversarially chosen by the critic), we can increase the chance of catching a flaw. But note: the honest debater might have a long argument that is necessary, so bounding the argument length might cause false rejects. This is a trade-off.

     - The set of requirements is jointly satisfiable if we bound the argument complexity to the reviewer's capacity. But if we allow arbitrarily complex arguments, then with a weak reviewer, it might be impossible to satisfy all. Given that false accepts are worse, we might have to limit the argument depth and breadth to what the reviewer can handle.

     - Therefore, the requirements are jointly satisfiable only if we impose a bound on the verification debt (by design) and structure the debate to fit within the reviewer's attention budget. Without that bound, the system cannot work.

  **Which requirement excludes the most candidates?** 
     - The bounded verification debt requirement excludes many candidate protocols. For example, protocols that allow unlimited branching in the justification tree (like some debate protocols) would violate this because the debt can grow exponentially. Also, protocols that do not limit the number of steps in the argument would be excluded.

  **Are the peel test and substituted-lemma test distinct?**
     - They are distinct but related. The peel test is about the ability to check a step in isolation without having to hold the entire chain in memory. The substituted-lemma test is about the reviewer being sensitive to the content of a step, not just its style. A protocol might pass the peel test (the reviewer can check a step) but fail the substituted-lemma test (if the reviewer approves a false step because it looks like a true one). Conversely, a protocol might pass the substituted-lemma test (the reviewer detects a false lemma) but fail the peel test if the reviewer cannot get to the step that contains the false lemma because it is buried too deep and the debt is too high.

     - Therefore, they are distinct requirements.

  Finally, the requirement that does the most exclusionary work is **Bounded Verification Debt**.

  Output:
  \answer{Bounded Verification Debt}
answer: |-
  ### Desiderata for Oversight Protocol Against Obfuscated Arguments  
  The following requirements ensure the protocol survives adversarial obfuscation while respecting reviewer constraints. Each requirement is motivated by a concrete failure scenario, with distinctions and structural constraints defined operationally.  

  #### Core Requirements (Non-Negotiable for Safety)  
  1. **Bounded Verification Debt**  
     - **Scenario**: Proposer chains 50 plausible steps, each adding 5 new unchecked commitments. Reviewer exhausts attention budget by step 10, rubber-stamps the rest. A deep flaw at step 45 causes a costly false accept.  
     - **Why design against?**: Debt growth directly enables obfuscation. Unbounded debt guarantees degradation with length, violating soundness.  
     - **Distinction preserved**: "Plausible step" vs. "verified step" – debt must not scale faster than reviewer capacity.  

  2. **Peel Test Compliance**  
     - **Scenario**: Proposer embeds one fatal flaw in step 12/20. Each step looks sound locally. Reviewer peels step 12, sees the flaw, and rejects. Without peeling, the flaw remains hidden.  
     - **Why design against?**: Obfuscation relies on burying flaws; peeling forces localized exposure. Global flaws must be detectable via local checks.  
     - **Structural constraint**: Reviewer can demand unpacking of any claim in ≤3 interactions, without recalling prior steps.  

  3. **Substituted-Lemma Test Compliance**  
     - **Scenario**: Critic swaps a correct lemma (e.g., "API call X is idempotent") with a false but equally plausible one (e.g., "API call Y is idempotent"). Reviewer approves both versions identically, missing the swap.  
     - **Why design against?**: Surface plausibility ≠ correctness. Failure means the protocol is fooled by stylistic mimicry.  
     - **Distinction preserved**: "Style/fluency" vs. "substance" – confidence must shift when content changes.  

  4. **Distinction: Inability to Detect Flaw vs. No Flaw**  
     - **Scenario**: Reviewer spends 10 minutes on a 30-step argument, finds no flaw, and approves. A subtle flaw exists but was missed due to time constraints. False accept costs $1M.  
     - **Why design against?**: False accepts are costlier than rejects. Protocol must not equate "unfound flaw" with "no flaw"; defaults to reject on uncertainty.  

  5. **Distinction: Length vs. Obfuscation**  
     - **Scenario**: A 100-step argument is sound but rejected for being "too long," while a 10-step obfuscated argument is approved.  
     - **Why design against?**: Rejecting solely on length causes false rejects; accepting short obfuscation causes false accepts. Protocol must flag flawed steps, not long chains.  

  6. **Distinction: Fluency vs. Correctness**  
     - **Scenario**: Critic is eloquent but wrong; honest proposer is correct but terse. Reviewer sides with critic due to persuasive prose.  
     - **Why design against?**: Truth-correlation must dominate. Allowing fluency to override correctness incentivizes style over substance.  

  7. **Reviewer Effort Bound Enforcement**  
     - **Scenario**: Review runs for 60 minutes due to iterative unpacking, missing SLA. Change is rejected, but delay causes operational disruption.  
     - **Why design against?**: A review exceeding 10 minutes is worthless per problem constraints. Protocol must hard-fail at 10min.  

  8. **Safe Default on Tie/Fatigue**  
     - **Scenario**: Reviewer fatigues at step 15/20 or scores debate as a tie. Defaulting to accept causes false accept.  
     - **Why design against?**: False accepts cost more. Protocol must reject on timeout/ambiguity.  

  #### Aesthetic Preference (Non-Core)  
  - **Prejudice: "Debate Must Be Unstructured"**  
    Some protocols assume free-form dialogue improves truth-seeking. This is a preference, not a requirement.  
    - **Why accept?**: Structured arguments (e.g., stepwise justifications) bound verification debt better. Free-form debates risk meandering, increasing debt.  

  #### Tensions and Joint Satisfiability  
  - **Unsatisfiable Subset**: **Bounded Verification Debt** + **Peel Test Compliance** + **Unconstrained Argument Depth** cannot coexist.  
    - **Tension**: If arguments can be arbitrarily deep (e.g., 100 steps), peeling one step cannot bound debt. Debt grows with depth, overwhelming the reviewer.  
    - **Resolution**: Arguments must be depth-limited (e.g., ≤5 layers) to satisfy both.  
  - **Overall Satisfiability**: Requirements are **jointly satisfiable** if:  
    - Argument depth/width is capped (e.g., ≤5 steps, ≤3 sub-claims per step).  
    - Reviewer uses peeling sparingly (e.g., ≤3 peels/review).  

  #### Most Exclusionary Requirement  
  - **Bounded Verification Debt** excludes 90% of candidate protocols:  
    - Naive debate (unlimited back-and-forth) fails due to debt explosion.  
    - "Tree-of-thought" justifications fail if branching is unbounded.  
    - Protocols without stepwise commitment tracking fail by definition.  

  #### Peel Test vs. Substituted-Lemma Test  
  - **Distinct Requirements**:  
    - **Peel Test** ensures flaws are *reachable* with bounded memory.  
    - **Substituted-Lemma Test** ensures flaws are *detectable* when surface noise is controlled.  
  - A protocol could pass peel (flaw is reachable) but fail substitution (reviewer ignores content). Or vice versa.  

  ---  
  **Final Answer**  
  \answer{Bounded Verification Debt}
