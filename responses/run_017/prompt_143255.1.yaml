  - **Care-function**: After round 2, hand out index cards: "Write a function f(w, N) that gives how much you care about a branch that has weight w and is one of N total branches. Example: f(w, N) = w, or f(w, N) = 1/N."

  - **Whiteboard**: After each round, we collect the p's and write them on the board as a histogram.

  ### Schedule

  Total time: 100 minutes.

  - Introduction: 10 min (explain the setup: they will experience branching, they must commit before knowing which branch they are in, and we are going to explore how they value their future copies)
  - Round 1: 10 min (explain, commit, reveal, record p's on board)
  - Round 2: 10 min (same)
  - Care-function: 5 min (write down functions)
  - Round 3: 15 min (present as two branches, commit, then reveal fine-graining, then assign branches, then ask if they want to change their p and why)
  - Round 4: 10 min (describe, commit, reveal local branch only)
  - Round 5: 10 min (describe, commit, reveal)
  - Debrief: 30 min (map the rounds to the problems, discuss care-functions, state what the game did and did not do)

  We'll adjust as needed.

  This design meets the constraints and desiderata.
answer: |-
  Below is a comprehensive design for your branching betting game, optimized for your constraints and goals. The activity uses sealed envelopes for branching, chocolate bars as prizes (~$30 budget), and emphasizes first-personal experience. It systematically leads participants to confront the probability problem in Everettian quantum mechanics without presupposing the Born rule.

  ---

  ### **Game Design: "Branching Stakes"**

  #### **Physical Setup**
  - **Branching Mechanism**: Use **sealed envelopes** for each participant. Each envelope contains a card indicating their branch outcome. Envelopes are prepared in advance for each round and distributed randomly.
  - **Prize**: Chocolate bars (e.g., 16 full-sized bars, ~$30 total). Winners receive bars post-reveal. Stakes are tiny but real.
  - **Elicitation**: Before each split, participants write their **certainty-equivalent fraction** (e.g., 0.3) for a coupon that pays a full chocolate bar to their future self in a designated branch and $0 in others. Fractions are recorded anonymously on a whiteboard as a histogram.
  - **Reveal Ritual**: After commitments, all simultaneously open envelopes in a "phone-free silence" (no communication). Only one outcome is experienced per participant.
  - **Care-Function**: After Round 2, participants write their personal **care-function** \( c(w, n, N) \), where:
    - \( w \) = branch weight (squared amplitude),
    - \( n \) = number of identical copies in the branch,
    - \( N \) = total number of branches globally.

  ---

  ### **Round Sequence**
  **Total Time**: 90 minutes (10 min briefing, 15 min/round, 20 min debrief).  
  **Key**: Emphasize that participants are *multiplying* into descendants—all branches are real, but each only experiences one.

  #### **Round 1: Flattering the Branch-Count (15 min)**  
  - **Split**: Unequal weight masked as equal branch-count.  
    - Amplitudes: \( \sqrt{1/4} \) for A, \( \sqrt{3/4} \) for B.  
    - Physical Setup: Present as **4 branches** (A, B1, B2, B3) with *equal amplitudes* \( \sqrt{1/4} \). Each envelope contains one card (A, B1, B2, or B3).  
  - **Elicitation**: "What fraction of a chocolate bar would you pay for a coupon that pays only if you are in **branch A**?"  
    - *Why it flatters*: Branch-counting (1/4) and weight (1/4) agree. Participants feel safe with "naive" counting.  
  - **Reveal**: Open envelopes. ~4 get A, ~12 get B (since weights are equal). Pay coupon holders in A.  
  - **Whiteboard**: Histogram shows most fractions cluster near 0.25.

  #### **Round 2: Breaking the Agreement (15 min)**  
  - **Split**: Equal branch-count, unequal weight.  
    - Amplitudes: \( \sqrt{1/3} \) for A, \( \sqrt{2/3} \) for B.  
    - Physical Setup: **2 branches** (A and B). Envelopes contain A or B cards.  
  - **Elicitation**: "What fraction would you pay for a coupon for **branch A**?"  
    - *Conflict*: Branch-counting says 0.5, weight says 1/3 ≈0.33. Physics students may compute 0.33; philosophers may default to 0.5.  
  - **Reveal**: Assign branches via weighted lottery (e.g., draw from a bag with 1 A and 2 B tokens). ~5 get A, ~11 get B.  
  - **Whiteboard**: Histogram splits—some at 0.5, some at 0.33. Highlight the disagreement.

  #### **Care-Function Elicitation (5 min)**  
  - After Round 2, participants write their \( c(w, n, N) \) anonymously. Examples:  
    - **Branch-count**: \( c(w, n, N) = 1/N \)  
    - **Weight-only**: \( c(w, n, N) = w \)  
    - **Per-copy**: \( c(w, n, N) = w/n \) (Born rule)  
    - **Size-biased**: \( c(w, n, N) = w \cdot n \) (cares about populous branches).  
  - Collect and display a few examples (no names). Explain that rounds will *test* these functions.

  #### **Round 3: Fine-Graining Reveal (15 min)**  
  - **Split**: Start as 2 branches (A and B), then reveal B is fine-grained.  
    - Amplitudes: \( \sqrt{1/1000} \) for A, \( \sqrt{999/1000} \) for B.  
    - Physical Setup:  
      1. Present as **2 branches** (A and B). Elicit fractions for **A**.  
      2. **After commitments**: Announce, "B is actually **999 identical branches** (B1–B999) with equal amplitudes. Total branches: 1000. Weight of A is still 1/1000."  
      3. Envelopes: 1 A card and 999 B cards (labeled B1–B999).  
  - **Elicitation**: "Keep your fraction for A. After the reveal, would you change it? Why?"  
    - *Diagnostic*:  
      - Branch-count functions (\( c = 1/N \)) break: N jumps from 2 to 1000, so care for A drops from 0.5 to 0.001.  
      - Weight functions (\( c = w \)) unchanged: Still 0.001.  
  - **Reveal**: Assign A to ~1 participant (1/1000 chance), B to others.  
  - **Whiteboard**: Show pre-reveal fractions. Discuss who would change and why.

  #### **Round 4: Irrelevant Device (15 min)**  
  - **Split**: Local split (A/B with amplitudes \( \sqrt{0.5} \) each) + isolated device branching elsewhere.  
    - Physical Setup:  
      - "A machine in the next room splits into **1,000 branches** (weight 1 total). It has no causal link to us."  
      - Local envelopes: A or B (equal weight).  
  - **Elicitation**: "What fraction for **local branch A**? Does the machine change your answer?"  
    - *Diagnostic*:  
      - Branch-count functions (\( c = 1/N \)): N increases by 1000, so care for A drops.  
      - Weight functions (\( c = w \)): Unchanged (local w = 0.5).  
  - **Reveal**: Assign local branches (coin flip).  
  - **Whiteboard**: Fractions clustered near 0.5 if weight-based; spread if branch-count.

  #### **Round 5: Near-Null Branch (15 min)**  
  - **Split**: Two branches, one near-zero weight.  
    - Amplitudes: \( \sqrt{1 - 10^{-9}} \) for A, \( \sqrt{10^{-9}} \) for B.  
    - Physical Setup: Envelopes for A or B.  
  - **Elicitation**: "What fraction for **branch B**?"  
    - *Diagnostic*:  
      - Branch-count: 0.5 (irrationally high).  
      - Weight: ~0 (rational).  
      - Tests **continuity** and **zero-limit behavior**.  
  - **Reveal**: Assign B with 1-in-a-billion odds (use RNG). Likely no one gets B, but coupon holders "lose" their fraction.

  ---

  ### **Debrief (20 min)**  
  Map game moments to the Everettian probability problem:  
  1. **First-Person vs. Uncertainty**:  
     - Why coupon prices reveal *caring* (for descendants), not *credence* (about outcomes). Branching is not ignorance—all exist.  
  2. **Fine-Graining Reveal (Round 3)**:  
     - Rules out **branch-counting** and **N-sensitive functions**. Caring must be **insensitive to fine-grained splits** if weights are unchanged.  
  3. **Irrelevant Device (Round 4)**:  
     - Rules out **global N-dependent functions**. Caring must be **local to causally relevant branches**.  
  4. **Near-Null Branch (Round 5)**:  
     - Rules out **discontinuous functions**. Caring must **vary continuously with weight** and **ignore near-zero branches** if weights are low.  
  5. **Surviving Care-Functions**:  
     - Only \( c = w \) (weight-only) and \( c = w/n \) (Born rule per-copy) survive all tests.  
     - **Born rule** (\( c = w \)) is simplest: insensitive to n/N, local, continuous.  
  6. **Where the Game Stops**:  
     - The activity *presupposes* weights exist and tests which care-functions are rational. It does **not derive why weights must be squared amplitudes** or prove that rational agents *must* use them.  
     - The live debate (Deutsch-Wallace derivations) starts here: "Rationality alone forces agents to act *as if* weights are probabilities." State this explicitly.  

  ---

  ### **Failure Modes & Mitigations**  
  1. **Treating Branching as Ordinary Uncertainty**:  
     - *In the moment*: Ask, "If all branches are real, why care about one descendant? Would you pay to help *one twin* in a multiverse?"  
     - *Debrief*: Contrast subjective uncertainty (ignorance) with objective multiplicity (all exist).  

  2. **Answering for Group Average**:  
     - *In the moment*: Stress, "This is personal—how much do **you** care about **your** descendant?"  
     - *Pre-empt*: Use anonymous whiteboard entries.  

  3. **"I'll Be in the Biggest Branch"**:  
     - *In the moment*: "You are *all* branches. If you neglect a small branch, that copy gets nothing. Is that fair to your future selves?"  
     - *Debrief*: Tie to altruism/self-interest parity in branching.  

  4. **Physics Students Computing**:  
     - *In the moment*: "Suspend what you know—if weights weren't probabilities, how would *you* care?"  
     - *Co-opt*: "Your calculation gives one answer—why is it *right*?"  

  5. **Distrusting Facilitator Control**:  
     - *In the moment*: Use transparent RNG (e.g., public dice roll for branch assignments).  
     - *Pre-empt*: "I control the setup, but not your experience—you’ll only see one branch."  

  6. **Room Splits 50/50 on Prices (e.g., Round 2)**:  
     - *In the moment*: "Great! This mirrors the philosophy debate. Let’s run Round 3 and see which side must backtrack."  
     - *Debrief*: Use fine-graining to show branch-counting is fragile; weight-based is stable.  

  ---

  ### **Logistics & Budget**  
  - **Materials**: Envelopes, cards, dice/chocolate ($30), whiteboard.  
  - **Time**: Briefing (10 min), Rounds 1–5 (75 min), Debrief (15 min).  
  - **Adaptations**: For larger weights (Round 5), use \( 10^{-6} \) if \( 10^{-9} \) feels absurd.  

  This design forces participants to confront the inadequacy of branch-counting and the stability of weight-based caring. The facilitator must explicitly state the game’s limit: it assumes weights exist but doesn’t derive their necessity—setting up the Deutsch-Wallace theorem as the next step.
