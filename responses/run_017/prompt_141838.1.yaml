prompt: |-
  I lead a four-person long-term policy evaluation unit inside a national audit office. Every two or three weeks we are handed a government proposal with effects that run past the next election and often past the next census — radioactive waste disposal, pension reform, energy infrastructure, fertility and family policy, large-scale housing and transport corridors — and we have about a day and a half to produce a short impact section that goes into a public report to a parliamentary committee, plus a one-page sign-off note to a director who has to defend it in person. None of my team has philosophy training; one has a statistics background. We cannot build population models beyond rough ranges, and we cannot look anything up beyond what is in the proposal and its annexes.

  Our standard template asks three questions: who is made worse off, by how much, and can they be compensated or the cost offset? Increasingly we hit proposals where the honest answer to the first question is that the people who will bear the burden would not have existed at all if we had chosen differently — because the policy changes energy prices, labour markets, family timing, or where people live, and therefore changes who meets whom and which children are conceived. Under the alternative, other people would have lived instead. So the sentence our template wants us to write — that the policy harms future people — looks unavailable, and our drafts currently fudge this with vaguer wording that I do not think survives questioning.

  I want a written procedure my team can actually run in the time we have. I do not need the intellectual history or references; I need an instrument.

  Specifically, please give me:

  A screening step that decides, in the time available, whether a proposal affects which people come to exist. Distinguish at least three outcomes — the policy is identity-locked (the same people either way), identity-scrambled (different people, roughly the same number, roughly similar lives), and identity-generative (a different number of people, or lives of a different shape). Tell us what counts as a sufficient answer at this step, what to do when the evidence only supports a probability rather than a yes or no, and what to do when the screen comes out mixed: identity-locked for the next twenty years, scrambled after that. Give us a materiality rule for that mixed case and say plainly what adopting it costs us.

  A branching procedure. Where the policy is identity-locked, our existing person-affecting harm comparison is fine and I only want you to tighten it. Where it is identity-scrambled or identity-generative, the harm statement is unavailable, and the procedure must say what replaces it: what finding we are permitted to write, in what words, and what we must never write. In particular, address the temptation to write that these people would have been better off under the alternative — tell us whether that sentence is ever defensible and, if it is, under what description of the comparator.

  Rules for the cases that break the clean branch, which are the ones that actually reach my desk:

  Near-identity cases, where the policy changes a detail of origin — the month of a conception, which of two embryos, whether a birth is medically assisted — so that arguably the same person exists with a different life, arguably a different person exists. Handle the view that a person could not have originated from different gametes as one input among alternatives, and tell us what to write when we cannot settle it.

  The mixed population case, where the same proposal makes identifiable living people worse off and also scrambles the identity of later generations. Give us a rule for combining a person-affecting finding about the living with a non-person-affecting finding about the unborn into a single sentence that does not equivocate between frameworks.

  Cumulative sequences, where each decision in a programme is individually identity-locking but the programme as a whole scrambles identities. Tell us whether the procedure evaluates the decision, the programme, or the standing policy, and how to phrase the finding when the answer is the programme.

  The asymmetry case, where a proposal both adds people and changes the quality of life of people who would otherwise not have existed, and quality is somewhat lower but every life is well worth living. Tell us where the procedure stops and hands this to a named person, on the grounds that the disagreement is about values and not about facts.

  At each branch, separate three things explicitly: what the procedure settles, what it settles only after the office has committed itself to one contested moral frame, and what it cannot settle at all. Where a frame must be chosen — a person-affecting restriction, an impersonal total or average comparison, a threshold or sufficiency standard, a rights-based or practice-based ground — say who signs off, what the report must disclose about the choice having been made, and how the same proposal would come out under a different permitted frame. Include a stop rule that returns an explicit no-finding output rather than a fudge.

  Then run the whole procedure on three proposals, showing the branches taken and the actual wording you would let me put in the report:

  One, a choice between building a deep geological repository for long-lived radioactive waste now, at large immediate cost and with small expected releases far in the future, and continuing interim surface storage for another century, at lower immediate cost and with a larger expected burden borne by whoever is doing the monitoring then.

  Two, a rise in the state pension age, which changes labour supply, savings and the timing of children, so that within roughly two generations the population is different, while also making identifiable people now in their fifties and sixties worse off.

  Three, a proposal my team wants to approve and expects to approve: a publicly funded expansion of fertility treatment and neonatal care in a country with a low birth rate, which will lead to a somewhat larger future population whose lives are somewhat more strained — by congestion, fiscal load and competition for places — than they would have been under a smaller-population path, though comfortably worth living. Apply the procedure without softening it, and tell me what it returns even if the result is that our recommendation has to rest on a frame the office would repudiate, or that the only defensible finding is the no-finding output.

  Finally, be straight with me about what the procedure cannot do. I want to know which questions in our current template have to be deleted outright rather than revised, where the procedure will systematically misfire on the proposals we actually get, and which part of the difficulty is not representable in a checklist at all and has to be carried by the director's judgment in the room.
reasoning: |-
  Okay, this user leads a policy evaluation unit in a national audit office. They need a practical procedure to handle cases where policies affect which people come into existence—something their current template can't address properly. The team has limited time and resources, no philosophy training, and can't build complex models. Their current approach fudges the issue when policies change who exists, which isn't sustainable.

  First, I need to unpack their core problem: policies like pension reforms or energy projects alter future populations by changing life decisions (who meets whom, when they have kids). This makes it impossible to say "this harms future people" because those people wouldn't exist otherwise—a classic non-identity problem in philosophy. But they don't need theory; they need a workflow.

  The user specified concrete outputs: a screening step to classify policies (identity-locked/scrambled/generative), branching procedures for each, rules for messy cases (near-identity, mixed populations, etc.), and real examples. They also want transparency about limitations. 

  For screening, I'll design a decision tree based on policy mechanisms. Key triggers: anything altering demography (fertility incentives), migration patterns, or survival rates within 30 years (one generation). "Sufficient evidence" means the proposal explicitly mentions these mechanisms or annexes show demographic modeling. For probabilistic cases, they'll use worst-case classification if impact is material (>5% pop change or >10% life-difference). Mixed timelines get split: near-term locked changes are assessed normally; scrambled/generative parts use non-person-affecting rules.

  The branching is straightforward: locked cases get tightened harm analysis (specify compensation feasibility). Scrambled/generative cases forbid person-affecting claims—no "harm" statements. Instead, they'll assess distributional shifts (e.g., "increases regional inequality") or existence-weighted averages. Critical rules: never say "these people would be better off otherwise" unless lives are not worth living (rare). 

  Messy cases need special handling. Near-identity ambiguities (e.g., IVF timing) default to "different person" unless biology confirms identical conception. For mixed populations (e.g., pension age hike harming current workers but scrambling future births), they'll separate findings: person-affecting harm now + impersonal future analysis. Cumulative sequences evaluate at the programme level if identities scramble overall. Asymmetry cases (adding people with slightly worse lives) get flagged for director sign-off—values conflict, not facts.

  On examples: 
  - Nuclear waste storage is identity-locked (impacts distant future same population), so harm analysis works. 
  - Pension age hike is mixed: harms current workers (person-affecting) but scrambles future identities—split reporting. 
  - Fertility expansion adds people with somewhat strained lives. Here, the procedure forces uncomfortable output: no harm finding (lives worth living), just impersonal stats. If the office rejects impersonal frames, it returns "no finding."

  Limitations: The template's "who is harmed" question must be deleted for scrambled/generative cases. The procedure fails for policies with small identity effects buried in larger impacts. Ultimately, directors must judge when to override—the checklist can't resolve deep value conflicts. 

  This balances rigor and feasibility. It replaces vagueness with clear thresholds, forces uncomfortable honesty in cases like fertility policy, and offloads unsolvable ethics calls upward. The trade-off: some findings will feel incomplete, but they'll withstand scrutiny better than fudged wording.
answer: |-
  Here is a procedural instrument for non-identity cases, designed for operational speed and defensibility. It prioritizes clear decision rules over philosophical resolution and includes safeguards against overreach.

  ---

  ### **I. Screening Step: Identity Impact Classification**
  * **Time Allocation:** ≤ 1 hour. Use proposal text/annexes only.  
  * **Key Triggers:** Policies altering fertility incentives, migration patterns, mate-matching mechanisms (e.g., housing location), survival rates, or large-scale demographic transitions.  
  * **Classification Criteria:**  
    - **Identity-Locked (IL):** No material change to conception/survival determinants. *Sufficient answer:* Proposal lacks triggers AND annexes show no demographic sensitivity.  
    - **Identity-Scrambled (IS):** Changes who exists but not total population size or broad life quality distribution (e.g., alters regional migration patterns). *Sufficient answer:* Triggers present but no net population change predicted.  
    - **Identity-Generative (IG):** Changes total population size or creates new subpopulations with predictably distinct life quality (e.g., pronatalist subsidies). *Sufficient answer:* Triggers present + quantified population impact in annexes.  
  * **Probabilities/Mixed Cases:**  
    - If evidence suggests >30% probability of IS/IG, classify as worst-case (IG > IS > IL).  
    - Mixed timelines (e.g., IL for 20y then IS): Apply **20-year materiality rule**. If >50% of quantified costs/benefits accrue post-scramble, classify as IS/IG. *Cost:* May over-simplify near-term impacts but avoids unverifiable long-term person-affecting claims.  

  ---

  ### **II. Branching Procedure**  
  **A. Identity-Locked (IL)**  
  - *Tighten existing harm analysis:*  
    - Specify compensation feasibility (e.g., "Costs fall on coastal landowners; offset via targeted tax credits feasible within 5y").  
    - Never use ranges without justification (e.g., "Worse off by €X–Y based on Annex B fuel price sensitivity").  

  **B. Identity-Scrambled (IS) or Identity-Generative (IG)**  
  - *Forbidden Statements:*  
    - "Future people are harmed" / "Group X is worse off."  
    - "They would have been better off otherwise" (except if life not worth living, per II.E).  
  - *Permitted Replacement:*  
    > "The policy alters the composition and/or size of the future population. Comparative welfare statements about specific future individuals are not possible. Expected aggregate outcomes include [e.g., 10% higher regional inequality, +3% average energy costs]."  
  - *Report Disclosure:* Footnote: "Assessment uses impersonal analysis due to demographic non-identity effects."  

  ---

  ### **III. Rules for Complex Cases**  
  **A. Near-Identity (e.g., embryo selection)**  
  - Input: Assume "different person" if gametes, conception timing, or birth method changes.  
  - Output:  
    > "Medical intervention alters individual origins. Welfare comparisons apply to resultant lives, not counterfactual individuals."  

  **B. Mixed Populations (e.g., harms living + scrambles future)**  
  - **Rule:** Segregate findings. Combine as:  
    > "Current retirees experience net losses averaging €Z/year without feasible compensation. Post-2050 demographic effects preclude person-specific welfare analysis; projected fiscal burden shifts from 5% to 8% of GDP."  

  **C. Cumulative Sequences (e.g., repeated infrastructure decisions)**  
  - **Rule:** Evaluate the *programme*, not individual decisions. Phrase as:  
    > "The programme alters long-term settlement patterns, changing future population composition. Aggregate congestion costs rise 15% by 2100 relative to a no-programme baseline with identical near-term population."  

  **D. Asymmetry (Adding lives worth living but below average)**  
  - **Stop Rule:** If lives are "well worth living" (Annex-defined threshold, e.g., life expectancy >60y, median income >$10k), return:  
    > "Value judgment required on population expansion with moderate quality-of-life trade-offs."  
  - **Escalate:** To Director with options: (1) Reject as non-auditable, (2) Use impersonal average/total utility (disclose frame), (3) Use sufficiency standard (disclose threshold).  

  ---

  ### **IV. Frame Transparency & Stop Rules**  
  | **Decision Level**          | **Settled by Procedure**       | **Requires Frame Choice**               | **Unsettled**                  |  
  |-----------------------------|--------------------------------|-----------------------------------------|--------------------------------|  
  | Classification (IL/IS/IG)   | ✓                              | –                                       | –                              |  
  | Harm in IL cases            | ✓                              | –                                       | –                              |  
  | IS/IG findings              | Impersonal aggregates only     | –                                       | Person-affecting claims       |  
  | Asymmetry cases             | –                              | Total/Average/Sufficiency (Director)    | Whether to create more lives  |  
  | **Stop Rule:** If frame choice needed but office lacks consensus, output:  
  > "No finding: Ethical frame conflict unresolved. Recommend committee deliberation per Section 4(b) of Audit Act."  

  ---

  ### **V. Applied Examples**  
  **1. Nuclear Waste Repository**  
  - *Screening:* IL (same people bear future risk whether storage is deep or surface).  
  - *Output:*  
    > "Deep storage imposes €9B upfront cost vs. interim storage’s €2B/year. Future monitoring burdens fall on identifiable descendants; expected health costs 0.3% lower with deep storage. Compensation via sovereign wealth fund feasible."  

  **2. Pension Age Increase**  
  - *Screening:* Mixed (harms current workers (IL), scrambles post-2070 population (IS)).  
  - *Output:*  
    > "Workers aged 55–64 lose €7k/year net, uncompensated. Post-2070 demographic shifts prevent individual harm attribution; aggregate labor supply rises 4% but dependency ratio worsens 2 points by 2100."  

  **3. Fertility Treatment Expansion**  
  - *Screening:* IG (increases population; lives "strained but worth living").  
  - *Procedure Output:*  
    > "Expansion increases future population by ~4M by 2100. Average per-capita consumption decreases 6% due to congestion, but all lives exceed sufficiency thresholds. No person-affecting harm attributable."  
  - *If office rejects impersonal frames:*  
    > "No finding: Outcome contingent on contested population ethics frame."  

  ---

  ### **VI. What This Cannot Do**  
  1. **Deleted Questions:** Scrap "who is made worse off" for all IS/IG cases. Replace with "distributional consequences" in IL cases only.  
  2. **Systematic Gaps:**  
     - Policies with small identity effects (e.g., marginal birth rate changes) misclassified as IL due to screening thresholds.  
     - "Lives worth living" threshold disputes (e.g., climate migration babies).  
  3. **Beyond Checklists:**  
     - **Director’s Burden:** Defending frame choices (e.g., "Why average utility over sufficiency?").  
     - **Judgment Calls:** When "rough ranges" are too wide for materiality rules.  
     - **Political Pushback:** Explaining why "no finding" isn’t evasion but rigor.  

  **Final Output Template:**  
  ```  
  [ ] IDENTITY-LOCKED: Harm analysis with compensation feasibility.  
  [ ] IDENTITY-SCRAMBLED/GENERATIVE: Impersonal aggregates only.  
  [ ] MIXED: Segregate person-affecting and impersonal.  
  [ ] NO FINDING: Frame conflict or unquantifiable asymmetry.  
  ```  
  This forces unambiguous outputs—ending fudged language at the cost of sometimes returning "no finding." The director’s role is to own the frame choices and defend the procedure’s integrity when findings are uncomfortable or absent.
