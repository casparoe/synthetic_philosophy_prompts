prompt: |-
  I'm writing the term essay for my seminar on ethics and collective action, and before I commit to a position I want to fix the standard I'll be assessing positions by. The topic is moral trade: roughly, the idea that parties who disagree about what it would be best to do can nevertheless both come out ahead by each doing something the other values more highly than they do themselves, without either side having to endorse the other's ranking or convert their values into a shared unit. What I want from you is a specification, not a survey: what would a theory of moral trade have to deliver to be good enough to act on? Fix the purpose as a decision guide for a group — say a campaigning society or a small grantmaking body — whose own members partly disagree about what is worth doing, deciding whether to accept a proposed swap of actions or resources with another group.

  Give me the requirements, each with the case or consideration that motivates it. The cases I most want covered: a counterparty whose aims we take to be not merely worthless but positively harmful, so that what we would be handing over is something we think makes the world worse; a counterparty that cannot reciprocate or hold us to the deal, such as future people, non-human animals, or a system that has not been built yet; a trade that would have to be kept confidential from our own members, who would reject it, even though it is meant to advance their aims; a trade proposed on the strength of a moral view we hold with only moderate credence, where our second-favourite view would rank it quite differently; and a trade in which we must perform first, with no way to enforce the other side's part, and where their gains would also leave them a stronger bargainer against us later. I also want you to name the distinctions a theory must not collapse, and to say which of the things people demand here are genuine desiderata and which are just the preferences of one camp — I suspect the ban on ever acting against our own best moral judgement belongs in the second category, but argue it either way.

  One worry of my own to resolve: if the two sides share all their non-moral beliefs, I cannot see where the gains come from, since each of us seems to be doing something we regard as at best worthless. Tell me whether that is a constraint the theory must answer or a confusion on my part.

  Then flag any pair of requirements you think cannot be jointly satisfied — that is the part of the answer I care most about — and say which single requirement does the most work in excluding candidate theories. If any approach survives the list, score very briefly the main families of approach (gains measured in each party's own terms; a common currency of expected choice-worthiness under moral uncertainty; a compromise or portfolio view); if none survives, say so plainly. No bibliography or reading list — I have the seminar material.

  Please structure the response as follows: "What the theory is for", stating the purpose you are assessing against (about 60 words); "Requirements", each with its motivating case (about 350); "Genuine desiderata versus camp prejudices" (about 100); "Conflicts", on any jointly unsatisfiable subset (about 150); "The requirement that does the most work" (about 100); "Scorecard" (about 120); and "What would change my mind", naming the requirement you would drop first, the argument or case that would make you reorder the list, and where your own reasoning is most likely to fail (about 120).
reasoning: |-
  Hmm, the user is writing a term essay on ethics and collective action, specifically moral trade. They need a standard to assess theories of moral trade for a group like a campaigning society. The group's members disagree on values, and they want to decide on swaps with others. They've listed several cases to cover: trading with harmful counterparts, non-reciprocating parties, confidential trades, trades based on moderate credence views, and trades with enforcement issues. They also want to know if gains are possible when non-moral beliefs are shared.

  First, I need to outline the purpose of the theory. It's a decision guide for a group with internal value disagreements, assessing proposed trades with external parties. The requirements should address each case they mentioned. For the harmful counterparty, the theory must allow trading even if the counterparty's actions are deemed harmful, provided the net benefit justifies it. For non-reciprocating parties like future generations, the theory needs a way to handle asymmetric obligations. Confidential trades require internal legitimacy, so the group's decision-making process must be valid even if secret. Moderate credence cases need sensitivity to moral uncertainty without collapsing into one view. Enforcement issues demand robustness against defection and power shifts.

  The user also wants to distinguish genuine desiderata from camp prejudices. For instance, the ban on acting against one's best judgment might be a preference, not a requirement, because moral trade sometimes requires such actions for gains. The confusion about shared non-moral beliefs: if both parties share all non-moral facts but have different values, gains come from differing marginal rates of substitution. For example, one values environmental preservation more than economic growth, while the other has the opposite preference. Trading allows each to get more of what they value highly by giving up what they value less.

  Potential conflicts: The confidentiality requirement (C) might clash with legitimacy (D). If a trade must be secret to succeed, but legitimacy requires transparency, satisfying both is hard. Also, dealing with harmful counterparts (A) and enforcement issues (E) could conflict with net benefit (F) if the risks are too high. The net benefit requirement (F) does the most work because it's the core of moral trade—ensuring mutual gain. Without it, the trade isn't moral trade.

  Scoring theories: Own-terms gains (like Coleman) handles non-reciprocation but struggles with confidentiality. Expected choice-worthiness (like MacAskill) deals with moral uncertainty but might not handle harmful counterparts well. Portfolio views avoid trade but miss out on gains. None perfectly satisfies all, but own-terms is the strongest. Net benefit (F) is key; if a theory can't ensure that, it fails.

  For "what would change my mind": Dropping confidentiality (C) if secrecy undermines group agency. Reordering if new cases show that net benefit isn't primary. A failure point might be underestimating how internal disagreement affects collective action. Need to ensure the group remains cohesive.
answer: |-
  **What the theory is for**  
  The theory must serve as a practical decision procedure for a value-heterogeneous group (e.g., a grantmaking body) evaluating proposed moral trades. It should output defensible "accept/reject" judgments for swaps with external parties, advancing members' aims despite internal disagreement, without requiring value homogenization or betraying the group’s core agency. (~60 words)

  **Requirements**  
  *(Motivating cases in italics)*  
  1. **Harmful Counterparty Permissibility (A)**: Must allow trades where the counterparty’s use of transferred resources is deemed *actively harmful* by the group, provided the net moral gain (in the group’s terms) sufficiently offsets this harm.  
     *Case: Trading medical data to a corporation that will misuse it for profit, but whose payment allows the group to fund life-saving interventions.*  
  2. **Non-Reciprocation Handling (B)**: Must guide trades with entities incapable of reciprocating or enforcing agreements (e.g., future generations, animals).  
     *Case: Sacrificing current welfare to mitigate long-term risks for future people who cannot "pay back" the group.*  
  3. **Confidentiality Tolerance (C)**: Must sometimes endorse trades requiring secrecy from objecting members, if the trade demonstrably advances their own aims.  
     *Case: Secretly accepting fossil fuel donations to fund climate litigation, where disclosure would cause internal revolt despite the net benefit.*  
  4. **Moral Uncertainty Sensitivity (D)**: Must weight outcomes by the group’s credence across rival moral views, preventing high-stakes bets on low-credence positions.  
     *Case: A trade that maximizes utility if utilitarianism (credence 0.6) is true, but violates rights if deontology (credence 0.4) is true.*  
  5. **Enforcement-Independence (E)**: Must assess trades lacking reciprocity mechanisms, including scenarios where performing first strengthens a counterparty who may later defect or exploit the group.  
     *Case: Unilaterally disarming to incentivize an adversary’s cooperation, knowing they might renege and use gained strength against the group.*  
  6. **Net Benefit Constraint (F)**: Must ensure the trade yields expected moral gains *for the group* in its own evaluative terms, outweighing costs/risks.  
     *Case: Rejecting a trade that benefits others but imposes net moral losses on the group, per its composite value structure.*  
  7. **Value Distinction Preservation (G)**: Must *not* collapse incommensurable values (e.g., rights vs. welfare) into a single metric or override fundamental moral constraints.  
     *Case: Distinguishing trades involving routine resource swaps vs. those violating core prohibitions (e.g., selling votes).* (~350 words)

  **Genuine Desiderata versus Camp Prejudges**  
  The ban on acting against the group’s "best moral judgment" (often tied to a dominant internal view) is a *camp prejudice*. Moral trade inherently requires acting on comparative advantage across value systems, which may contradict any single member’s (or faction’s) optimal choice. Genuine desiderata are **A, B, C, E, F**: they enable gains from disagreement while preserving group autonomy. **D** and **G** are also genuine, ensuring robustness under uncertainty and pluralism. (~100 words)

  **Conflicts**  
  **C (Confidentiality Tolerance)** and **D/G (Moral Uncertainty Sensitivity/Value Distinction)** conflict irreconcilably with **F (Net Benefit)** in edge cases. If secrecy is essential (*C*) but the trade hinges on a low-credence view (*D*), assessing net benefit (*F*) becomes epistemically void—the group cannot reliably calculate gains it cannot discuss. Similarly, if secrecy requires suppressing value distinctions (*G*), the group loses the framework to justify *F*. *B* (Non-Reciprocation) and *E* (Enforcement-Independence) also strain *F*: without reciprocity, net benefit rests on counterfactually weak guarantees. (~150 words)

  **The Requirement That Does the Most Work**  
  **F (Net Benefit Constraint)** is the keystone. It excludes theories that:  
  - Prioritize parity or fairness over actual gains (e.g., strict compromise views).  
  - Allow self-sacrifice for others’ benefit without group advantage (violating the core of moral trade).  
  - Ignore risk/uncertainty in outcome evaluation.  
  Without *F*, the theory ceases to be a guide for *advantageous* collective action. (~100 words)

  **Scorecard**  
  1. **Own-Terms Gains** (e.g., Jules Coleman): Excels at *A, B, F*; handles harm/reciprocation via subjective gains. Fails *C/D*: lacks tools for secrecy or uncertainty, and struggles with *E/G* (enforcement/value collapse).  
  2. **Expected Choice-Worthiness** (e.g., William MacAskill): Strong on *D, F*; quantifies uncertainty. Fails *A* (struggles with "harmful" gains), *C* (transparency-dependent), and *E* (ignores strategic dynamics).  
  3. **Portfolio/Compromise Views**: Avoids *G* (preserves distinctions) but fails *A, B, F* by rejecting trades that exploit comparative advantage.  
  **Verdict**: No approach satisfies all requirements. Own-terms gains comes closest but falls short on confidentiality/moderate credence cases. (~120 words)

  **What Would Change My Mind**  
  I would drop **C (Confidentiality Tolerance)** first if shown that secret actions inherently undermine group agency, making trade legitimacy impossible. I would reorder if confronted with cases where *net benefit* is secondary to procedural integrity (e.g., trades resembling bribery). My reasoning is most vulnerable on **B (Non-Reciprocation)**: underestimating how moral claims from non-agents (e.g., animals) could invalidate trade logic without reciprocity. (~120 words)
