answer: |-
  Below is a fully designed 90-minute session plan centered on experiential learning of Hofstadter's frame/outer/inner message distinction, specifically targeting the phenomenon of frame propagation with inner message loss/substitution. The design avoids explicit terminology until the debrief, uses only paper-based materials, and structures rounds to isolate layers. It anticipates common pitfalls and includes an observable success metric.

  ---

  ### **Session Overview**
  - **Goal:** Participants experience how frames propagate intact while inner messages degrade, swap, or fail to materialize.
  - **Core Phenomenon:** "Semantic Decoupling" (named during debrief)—when the frame signals a message exists, but the inner content is lost/replaced without detection.
  - **Key Insight:** Participants will *perform* message transmission in chains/groups, then realize they confidently transmitted/received hollowed or altered content.

  ---

  ### **Materials**
  - **For all rounds:** 
    - Index cards (100+), envelopes (30+), pens (20), clipboards (optional, for writing).
    - Pre-printed cards/envelopes with symbols, instructions, or text (details below).
    - Timer/stopwatch.
  - **Round-specific:**
    - **Round 1:** 6 sealed envelopes labeled "CRITICAL: DECODE IMMEDIATELY" per chain (18 total), each containing a card with random symbols (e.g., `⬡⍓⌾⸎`) and a note: "Use Cipher #7." (No cipher exists.)
    - **Round 2:** 6 encoded message cards per chain (e.g., "XJUI CFH JO TFFE" using Caesar cipher), and 3 decoder keys per chain (e.g., "Shift -1 in alphabet"). Only first 3 chain members get keys.
    - **Round 3:** 6 cards per chain with numbered instructions in a fictional script (e.g., invented glyphs) + universal icons (e.g., `🚶→💺→✋→📦` for "Walk to chair, raise hand, open box").
    - **Round 4:** 6 news envelopes labeled "BREAKING: SCIENCE DISCOVERY" per chain, each containing a neutral finding (e.g., "Study: 58% of lab mice prefer dark chambers"). Pre-stacked blank envelopes/cards for rewriting.
    - **Round 5:** Two identical ambiguous artifacts (e.g., a card showing "BANK" over a sketch of a river next to a vault).

  ---

  ### **Rules & Scoring**
  - **Transmission Rules:** 
    - No talking during rounds; communication only via written artifacts. 
    - Pass artifacts sequentially; no skipping participants.
    - Write interpretations/actions on provided cards (collected by facilitator).
  - **Scoring (non-monetary):** 
    - "Clarity Points": Participants award 1-3 points to their predecessor post-round based on "how well you felt they conveyed the core message." (Reveals confidence in understanding despite inner message loss.)
    - **Purpose:** Creates stakes—participants care about transmitting/receiving "accurately," mirroring real-world incentives.

  ---

  ### **Participant Division & Timeline (90 Min Total)**
  - **Groups:** 3 chains of 6 participants each. Chains remain consistent until Round 5.  
  - **Timeline:**
    - **0–5 min: Setup**  
      - Divide into 3 chains of 6. Explain rules: "Silently pass artifacts. Write interpretations. Award Clarity Points post-round."
    - **5–15 min: Round 1 (Frame Without Decoder)**  
      - *Goal:* Frame is clear ("DECODE IMMEDIATELY"), but no decoder exists.  
      - *Activity:* First member opens envelope, fails to decode, writes guess on card, reseals envelope, passes both. Repeat down chain.  
      - *Outcome:* Frame survives; inner guesses diverge wildly.
    - **15–25 min: Round 2 (Decoder Withheld)**  
      - *Goal:* Decoder exists but is withheld; only half build it.  
      - *Activity:* First 3 in chain get decoder keys. First member decodes message, writes interpretation, passes *only* encoded message. Positions 4–6 guess without keys.  
      - *Outcome:* Positions 1–3 recover inner message; 4–6 invent content. Frame ("encoded message") intact.
    - **25–40 min: Round 3 (Outer Message Acts Unseen)**  
      - *Goal:* Outer message (instructions) alters behavior without conscious understanding.  
      - *Activity:* Card shows instructions in fictional script + icons. Each member performs actions (e.g., stand, turn), writes "Why I did this," passes card.  
      - *Outcome:* Icons (outer message) build a "decoder" for actions (inner message); text remains unread.
    - **40–55 min: Round 4 (Frame Intact, Content Substituted)**  
      - *Goal:* Frame propagates; inner message hollowed/swapped.  
      - *Activity:* First member reads science finding, rewrites it "more impactfully" on new card, places in identical envelope, passes. Repeat down chain.  
      - *Outcome:* "BREAKING" frame persists; finding exaggerated/altered (e.g., "58%" → "ALL mice fear light").
    - **55–70 min: Round 5 (Same Artifact, Different Meanings)**  
      - *Goal:* Identical artifact yields conflicting inner messages; no arbiter.  
      - *Activity:* Regroup into 2 teams (9 each). Team A: "You’re environmental reporters." Team B: "You’re finance reporters." Both get "BANK" artifact. Discuss and write "true meaning."  
      - *Outcome:* Team A extracts "riverbank"; Team B extracts "financial institution."
    - **70–85 min: Debrief**  
      - Guide reflection → map to Hofstadter → name phenomenon. (Detailed below.)
    - **85–90 min: Wrap-up**  
      - Quick Q&A; distribute takeaway cards summarizing layers.

  ---

  ### **Debrief Plan (15 Min)**  
  1. **Reflection (5 min):**  
     - Ask: "When did you feel certain you understood a message? When did you realize your certainty was misplaced?"  
     - Point to moments:  
       - *Round 1:* "You knew it was critical to decode (frame) but had no cipher (no decoder)."  
       - *Round 2:* "First half had the key (outer message); second half didn’t but transmitted anyway."  
       - *Round 3:* "You followed icons (outer built decoder) but ignored the script."  
       - *Round 4:* "The 'BREAKING' frame never changed—but did the finding?"  
       - *Round 5:* "Same card, opposite meanings. What decided it?"  
  2. **Introduce Terminology (5 min):**  
     - **Frame:** "CRITICAL," "BREAKING," or "artifact needs decoding" (signals a message exists).  
     - **Outer:** Cipher key, icons, or news format (how to build the decoder).  
     - **Inner:** Decoded meaning, performed action, or finding (content after decoding).  
     - Map terms to rounds visually:  
       ```
       Round 1: Frame ✅ | Outer ❌ (no key) | Inner ❌ (guesses)  
       Round 2: Frame ✅ | Outer ✅ (for some) | Inner ✅ (for some)  
       Round 3: Frame ✅ | Outer ✅ (icons) | Inner ✅ (actions)  
       Round 4: Frame ✅ | Outer ✅ (news template) | Inner ❌ (altered)  
       Round 5: Frame ✅ | Outer ✅ (artifact features) | Inner ❌ (conflicting)  
       ```  
  3. **Name & Synthesize (5 min):**  
     - "You experienced **Semantic Decoupling**: the frame/outer layers transmit perfectly while the inner message degrades or swaps. This is what happens when press releases turn into 'scientists found something amazing'—the finding evaporates, but the frame persists."  
     - Stress: "The decoder isn’t passive—it’s built from your context (Round 5), biases (Round 4), and tools (Round 2). When context is missing, the inner message fails."  

  ---

  ### **Observable Success Metric**  
  - **During Round 4:** Participants award high "Clarity Points" (2–3) to predecessors *even as the finding becomes inaccurate*. This shows confidence without comprehension.  
  - **During Round 5:** Teams passionately defend interpretations despite identical artifacts, proving context dictates meaning.  
  - **In Debrief:** Participants use phrases like "I thought I got it, but..." or "We all transmitted, but nobody had the original."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Participants talk during silent rounds.  
     - **Solution:** Start with strict rules: "Talking breaks the simulation. If you speak, your chain restarts." Use timer to create urgency.  
  2. **Problem:** Someone name-drops Hofstadter early.  
     - **Solution:** "Ah, I see a fellow reader! Let’s hold the terminology so others can discover this firsthand." If pressed, smile: "Tell me after the session."  
  3. **Problem:** Chains move too slowly.  
     - **Solution:** Cap individual time (e.g., 60 sec/person). Have pre-filled artifacts for laggards.  
  4. **Problem:** Round 3 actions cause chaos (e.g., knocking over chairs).  
     - **Solution:** Use simple, seated actions (e.g., "raise hand," "open envelope"). Pre-clear space.  
  5. **Problem:** Round 5 teams converge on one meaning.  
     - **Solution:** Use high-ambiguity artifacts (e.g., "BANK" + abstract shapes). Prime groups with opposing contexts.  

  ---

  ### **Limitations of the Exercise**  
  1. **Cannot Stage:**  
     - **General intelligence vs. keys:** The exercise uses mechanical decoders (keys, icons). It *cannot* show that some messages (e.g., humor, irony) require world knowledge, not just a key.  
     - **Meaning location debate:** It *cannot* resolve if meaning is "in" the artifact, decoder, or interaction. Participants may infer meaning is contextual, but the exercise leans toward decoder-dependence.  
  2. **Other Omissions:**  
     - **Frame fragility:** The exercise assumes frames are robust. It doesn’t show frames degrading (e.g., "BREAKING" losing urgency).  
     - **Nested messages:** Hofstadter’s examples (e.g., Bach’s fugues) rely on recursive layers. The rounds are linear.  
     - **Emergent meaning:** Participants co-create meaning in chains (Rounds 1,4), but it doesn’t model how new layers emerge from complexity.  
     - **Ethical weight:** Real-world consequences (e.g., misinformation) are felt, not explored.  

  **Addressing Gaps:** State during debrief: "Hofstadter argues true understanding requires more than keys—it needs intelligence to handle ambiguity, like irony in headlines. And philosophers ask: *Was the meaning always in the message?* Our exercise suggests no: meaning needs a decoder, but decoders can be flawed or missing."  

  ---

  ### **Why This Works**  
  - **Experiential:** Participants *feel* the disconnect between transmission ("I passed it perfectly") and comprehension ("...but it was wrong").  
  - **No Jargon:** Concepts emerge from friction (e.g., Round 1 frustration, Round 4 confidence).  
  - **Press-Relevant:** Round 4 directly mirrors science-news distortion.  
  - **Safe Failure:** "Clarity Points" make errors visible but non-punitive.  

  This design ensures participants leave with a visceral grasp of semantic decoupling—and why it matters for their reporting.
