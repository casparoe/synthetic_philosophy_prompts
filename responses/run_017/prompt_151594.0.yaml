  Here’s the fictional leaflet draft (770 words), followed by the requested analysis:

  ---

  **OFFICIAL: FOR HOUSEHOLD CIRCULATION**  
  **Future Generations (Discharge of Duty) Scheme**  
  *Issued under Section 7(1), Future Generations Act 2043*  
  **Reference: FG/DDS/Leaflet/87A**

  **1. What is my household’s liability?**  
  Your annual Statement of Residual Intergenerational Liability (Form FG-SRIL/2045) quantifies the potential future welfare loss attributable to your household’s net carbon dioxide equivalent (CO₂e) emissions. Liability is calculated in **Quality-Adjusted Life-Years at Risk (QALYARs)**, representing the reduction in future well-being due to climate impacts linked to your emissions.

  **2. How is liability calculated?**  
  *   Your emissions (from energy, transport, consumption) are converted to QALYARs using the **Departmental Welfare Impact Coefficient** (DWIC v4.2). For example: 1 tonne CO₂e = 0.00012 QALYARs (based on median climate-economic modelling).
  *   Future QALYARs are discounted to Present Value (PV) using the **Statutory Intergenerational Discount Rate (SIDR)**, currently **3.0% per annum**. This rate reflects the growth-adjusted long-term return on capital, acknowledging that resources invested today yield future benefits.
      *   *Example Calculation:* Harm of 1 QALYAR occurring in 2085 (40 years hence).  
          PV = 1 QALYAR / (1 + 0.03)^40 = 1 / 3.262 ≈ **0.3065 PV-QALYARs**.
  *   Your total annual liability is the sum of PV-QALYARs for all future harms attributed to your current year’s emissions.

  **3. How can I discharge my liability?**  
  You may discharge PV-QALYARs via the **Published Tariff of Approved Discharge Actions (Schedule 3, FG Regulations)**:

  | **Discharge Method**                     | **PV-QALYAR Cost** | **Notes**                                  |
  | :--------------------------------------- | :----------------- | :----------------------------------------- |
  | **A. Direct Emissions Reduction**        |                    |                                            |
  | A1. Install approved heat pump           | 0.85 PV-QALYAR     | Per tonne CO₂e *lifetime* saving           |
  | A2. Permanently cancel one long-haul flight | 0.22 PV-QALYAR     | LHR-JFK return (1.6t CO₂e)                 |
  | **B. Fund Climate Adaptation**           |                    |                                            |
  | B1. Contribute to UK Coastal Defence Fund | £120 / PV-QALYAR   | Funds tangible protection for communities  |
  | B2. Contribute to Global Crop Resilience | £110 / PV-QALYAR   | Funds R&D for future food security         |
  | **C. Compensation Fund Payment**         | £100 / PV-QALYAR   | *See Section 4*                            |
  | **D. Non-Procreation Credit (NPC)**      | **Variable**       | *See Section 5 – Often most cost-effective*|

  **4. What is the Compensation Fund?**  
  The Future Generations Compensation Fund (FGCF) exists to provide monetary redress to eligible future individuals demonstrably harmed by *your specific, Scheme-attributed emissions*.  
  *   **Eligibility Criteria (FG Regulation 28):** A claimant must prove:
      (a) They would have existed *regardless* of the emissions-generating activity in question;
      (b) They are *identifiably worse off* (reduced QALYs) *specifically* due to those emissions, compared to the scenario where those emissions did not occur.
  *   **Current Status:** The Fund’s Trustees report that, to date, **no eligible claimants have been identified or compensated**. Challenges include establishing counterfactual existence and isolating specific harm causation across complex timelines. The unspent balance is invested in a low-fee Global Equities Index Tracker.

  **5. What is the Non-Procreation Credit (NPC)?**  
  Households may discharge their *entire accrued and projected future liability* by certifying they will bear no (or no further) children.  
  *   **Rationale:** By not creating potential persons, the household eliminates all risk of those persons suffering climate harm traceable to its emissions. This achieves harm avoidance at a lower societal cost than mitigation or adaptation.  
  *   **Cost-Effectiveness:** The NPC typically represents the most efficient discharge route.  
      *   *Worked Example:*  
          *   Household A: Couple intending 2 children. Estimated long-term emissions liability: 15 PV-QALYARs. Discharge via NPC: **£0**.  
          *   Household B: Couple, no children, flying LHR-JFK return annually. Annual liability: 1.6t CO₂e * 0.00012 QALYAR/t * PV factors ≈ **0.042 PV-QALYARs/year**. Over 40 years (PV-adjusted): ~1.2 PV-QALYARs.  
      *   **Guidance:** Household A is strongly advised to consider the NPC, achieving full discharge immediately at zero monetary cost. Household B would require decades of emissions reductions or significant monetary contributions (£4,800-£5,760 via B1/B2/C over 40 years, PV-adjusted) to match the NPC's efficiency.  
  *   **Process:** Complete Form FG-NPC/1 (witnessed) to discharge liability permanently.

  **6. How do I receive and settle my Statement?**  
  *   Form FG-SRIL/2045 is mailed annually by 31 March.
  *   Discharge actions must be verified (via submitted certificates, contribution receipts, or FG-NPC/1). Verified discharge within 90 days avoids late-payment increments (5% + base rate).
  *   Freepost envelope enclosed. Helpline: 0800 555 404 (Mon-Fri, 9am-1pm).

  **This leaflet is statutory guidance. Failure to discharge may result in Civil Sanctions.**  
  *Future Generations Directorate, Department for Intertemporal Responsibility*

  ---

  **Analysis: Satirical Liberties & Contentious Ground (150 words):**

  1.  **Discount Rate's Quiet Work:** The satire exaggerates how discounting *alone* drastically shrinks obligations to the distant future. Defenders argue it prevents impoverishing the present for marginal future gains *if* capital is productively invested. The joke implies this financial logic inherently devalues future lives. To flip it, make the discount rate *negative* if future harm projections exceed capital growth potential – turning the calculation into a mounting debt.
  2.  **The Compensation Fund Trap:** The eligibility criteria weaponize Derek Parfit's "Non-Identity Problem" (choices affecting *who* exists) to absurdity. While the problem is real, ethicists argue it doesn't dissolve duties; we still owe *impersonal* obligations to ensure *whoever* exists has decent conditions. The Fund's design makes compensation logically impossible, satirizing the demand for *identifiable victims* as a shield for inaction. A defender would say duties are to make the future *better*, not to compensate specific phantom victims.
  3.  **NPC Recommendation:** The deadpan recommendation treats non-procreation purely as a cost-saving measure, satirizing utilitarian calculus overriding other values. It starkly presents the logical extreme of prioritizing harm-avoidance efficiency above all else, including societal continuity. Critics of population-focused solutions would argue this misrepresents their position, which emphasizes *choice* and *development*, not state-incentivized non-existence as an emissions tool. Flipping the joke would require the Scheme *subsidizing* children born into net-zero households.

  This structure ensures the core jokes arise from the mechanics themselves, using precise, dry language to highlight the ethical tensions inherent in applying financial and legalistic frameworks to intergenerational obligations.
