  ### Case: Hospital Pain Management Protocol
  The hospital ethics committee must decide between two options for post-operative pain management in a 300-patient surgical ward. Option A implements a new protocol that provides each patient with a noticeable improvement in comfort (e.g., reduced anxiety and enhanced mobility, rated as +5 hedonic units each) but causes one identifiable patient (due to a rare genetic susceptibility) to experience a severe, transient pain episode (rated at -14 hedonic units) during recovery. Option B maintains the current protocol, which avoids this severe pain for the susceptible patient (limiting their worst episode to -9 hedonic units, below the lexical threshold \(T = 10\)) but forgoes the comfort improvements for all 300 patients. The magnitudes are credible: the pain episode resembles inadequately managed post-surgical pain (e.g., from a known drug interaction), not torture, and the benefits reflect realistic gains in patient well-being observed in clinical trials.

  #### Verdicts and Arithmetic
  - **U (Unweighted Utilitarianism)**:  
    Option A: \( (300 \times 5) + (-14) = 1500 - 14 = 1486 \)  
    Option B: \( 300 \times 0 + (-9) = -9 \)  
    **Verdict**: A (1486 > -9)  
  - **NU_w (Weighted Negative Utilitarianism, w=100)**:  
    Option A: \( (300 \times 5) + (-14 \times 100) = 1500 - 1400 = 100 \)  
    Option B: \( (300 \times 0) + (-9 \times 100) = -900 \)  
    **Verdict**: A (100 > -900)  
  - **LTNU (Lexical Threshold, T=10)**:  
    Option A involves suffering ≥ T (-14 ≤ -10), triggering lexical priority. No amount of pleasure compensates.  
    **Verdict**: B (avoids above-threshold suffering)  
  - **NU_lex (Lexical Suffering Dominance, T=0)**:  
    Option A involves suffering (-14 < 0), triggering lexical priority.  
    **Verdict**: B (avoids suffering)  

  **Key Check**: NU_w (w=100) still chooses A despite the weight, confirming that lexicality (not weight) drives the LTNU/NU_lex verdict.

  #### Variants: Spreading the Suffering
  1. **Same total suffering (-14) spread across 14 people, each below T**:  
     - Each of 14 patients experiences -1 hedonic unit (all < T=10).  
     - **LTNU verdict**: A (no episode ≥ T; arithmetic: \(300 \times 5 - 14 \times 1 = 1486 > -9\)).  
     - **Site**: Momentary experience per person. Non-arbitrary if threshold applies to individual experiences.  

  2. **Same total suffering (-14) spread across 14 episodes in one person, each below T**:  
     - The susceptible patient experiences 14 separate episodes of -1 hedonic unit (all < T=10).  
     - **LTNU verdict**: A (no episode ≥ T; arithmetic: \(300 \times 5 - 14 = 1486 > -9\)).  
     - **Site**: Momentary experience per episode. Non-arbitrary if threshold binds per discrete mental state.  

  3. **Original (concentrated in one episode)**:  
     - **LTNU verdict**: B (one episode ≥ T).  

  #### Diagnostics
  1. **Crucial Feature and Removal**:  
     - **Feature**: One episode of suffering above T (-14 ≤ -10).  
       - **Remove by capping beneficiaries**: Reduce patients from 300 to 2.  
         - U: \( (2 \times 5) - 14 = -4 \) (chooses B).  
         - NU_w: \(10 - 1400 = -1390\) (chooses B).  
         - **Result**: All views choose B; separation collapses.  
       - **Remove by pushing suffering below T**: Set pain to -9 (below T=10).  
         - LTNU: Uses arithmetic; \(1500 - 9 = 1491\) (chooses A).  
         - **Result**: LTNU flips to A; pattern breaks.  
       - **Remove by concentrating benefits**: One patient gets +1500 pleasure, others neutral.  
         - U/NU_w: Still choose A (\(1500 - 14 > -9\)).  
         - LTNU/NU_lex: Still choose B (lexical priority).  
         - **Result**: Pattern holds, but benefit is unrealistically large (non-credible).  

  2. **Defender's Reply for LTNU**:  
     - **Strongest Reply**: Suffering thresholds apply to *persons* (not moments) because moral claims are person-centered. Aggregating mild suffering across people/episodes ignores the separateness of persons; only concentrated suffering violates integrity.  
     - **Pushes Toward?**: Neither NU_lex nor NU_w. It refines LTNU by setting the "site" at the person-level (e.g., whole surgical recovery), blocking the spread variants if total person-suffering exceeds T (e.g., one person’s -14 over time).  
     - **Why It Matters**: Prevents LTNU from collapsing into NU_w (which aggregates) or NU_lex (which bans all suffering). However, it demands a non-arbitrary account of the "person-period" (e.g., why the recovery period? not a lifetime?).  

  3. **Commensurability Insight**:  
     The case shows that lexical views **do not require** treating pleasure/pain as separate dimensions. Instead, they expose a debt: **individuation of suffering episodes**. For LTNU to avoid arbitrariness, defenders must explain what counts as "one unit" of suffering—e.g., a unified phenomenological event (e.g., a continuous pain wave) or a brain-state duration. Without this, thresholds are manipulable (e.g., splitting pain into sub-threshold moments). Commensurability remains intact (one scale), but lexicality forces a metaphysics of pain individuation.  

  ---

  **Summary**: This case cleanly separates lexical priority from weighted suffering by exploiting a concentrated above-threshold episode. The hospital context and human-scale numbers ensure realism, while the variants and diagnostics clarify the role of threshold sites and aggregation. Instructors can emphasize that weighting (NU_w) and lexicality (LTNU/NU_lex) are distinct structural commitments, not points on a continuum.
