  3. Commensurability:

     The case does not necessarily show that pleasure and pain are incommensurable in the sense of being two dimensions. Instead, it highlights that a lexical threshold view requires a specific account of the unit of suffering: what counts as a single episode? Is it a moment, or is it aggregated? The defender of LTNU must provide a theory of individuation for suffering episodes. Without such an account, the threshold might be manipulated by how we carve up experiences. For example, if we define an episode as a continuous period of pain, then a long period of mild pain might become a single episode with a high total? Or if we define it by intensity, then we might split a period of varying pain. The case shows that lexical-threshold views are sensitive to the metaphysics of pain individuation. This does not force us to two dimensions; it only shows that if we use a threshold on a one-dimensional scale, we must be clear about the unit of aggregation.

