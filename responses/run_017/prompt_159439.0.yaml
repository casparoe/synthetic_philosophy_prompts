prompt: |-
  You are a political philosopher who also works on tax policy. I sit on a commission that is redrafting our inheritance tax, and I don't want to vote on instincts I can't state as a principle, so please work from my cases rather than from the standard pro-and-con list. Brainstorm several candidate principles before committing to any of them, and be explicit about where each one breaks. No citations or reading lists.

  Here are my verdicts, as I actually have them.

  1. A distant acquaintance leaves me eight million in index funds: tax it hard, seventy per cent or more, and I feel no complaint.
  2. My cousin inherits the dairy farm she has milked since she was fifteen, worth about as much on paper but illiquid and unsellable without ending the farm: tax it lightly or not at all.
  3. A founder hands her company to a son who has run the sales side for ten years: light tax. The same company to a son who will flip it to a competitor the week after probate: heavier tax. I know this is odd, since the assets and the recipient's resulting wealth are the same in both halves; what it seems to track is whether the firm survives.
  4. A grandparent pays private-school fees directly, during life: I am uneasy about taxing that, even though it is the same transfer of advantage as a bequest and shapes the child's competitive position even more directly.
  5. Wealth traceable to a legally authorised but now-condemned wrong, held by a grandchild who had nothing to do with it: I want this taxed harder than ordinary inherited wealth, and the thought "she did not earn it" does not explain why, since that is equally true of ordinary inherited wealth.
  6. An heir with severe disabilities whose entire inheritance buys care and never converts into any advantage over anyone: my objection to inheritance largely evaporates, even at twenty million.
  7. A perpetual dynasty trust paying great-grandchildren unearned income indefinitely: this strikes me as worse than the same sum handed over outright at death, and worse than I can justify by size alone.
  8. The inheritances I think matter most for equal opportunity — a good school district, a parent's professional network, a stable household — I do not want taxed at all, and I cannot say why they fall outside the base while the farm falls inside it.

  Two cases I go back and forth on: two siblings split ten million, one a surgeon and one a care worker, and some days I want the tax to depend on what each already has, other days I think the recipient's own earnings are irrelevant. And I keep changing my mind about whether money that funds a life of no competition but real social value — endowing a young mathematician to do research instead of consulting — is the best or the worst case for taxing.

  The principle I keep returning to is: tax transfers at death to the extent they hand the recipient unearned competitive advantage, and exempt them to the extent they preserve a form of life the recipient's plans are already built around. It seems to handle 1, 2, 3 and 6 and to have nothing to say about 5 and 8.

  What I want from you: state that principle, or the two or three best candidates, precisely and clause by clause, naming the case that motivates each clause; say what each predicts for the cases I have not settled — the unequal siblings, the endowed mathematician, and inheritance received at seventy rather than twenty-five; and tell me honestly which of my verdicts the best available principle cannot accommodate and which ones I should give up.
reasoning: |-
  Okay, the user is a policymaker on a commission redrafting inheritance tax laws. They've provided specific cases where their intuitive verdicts clash with standard tax principles. They want me to help derive coherent principles from these judgments without resorting to textbook arguments. 

  Hmm, interesting pattern in their cases. Their discomfort centers around three tension points: when wealth creates competitive advantage versus sustaining existing life structures; when the source feels illegitimate; and when assets serve social value beyond individual gain. The "form of life" principle they mentioned is promising but incomplete - it explains the farm exemption but not their condemnation of dynasty trusts.

  Let me dissect their unresolved cases first. The unequal siblings dilemma reveals a deeper conflict: is tax about equalizing outcomes or merely opportunity? Their hesitation suggests they might need two distinct principles - one for competitive distortion, another for need-based redistribution. For the mathematician endowment, the ambiguity stems from whether "competitive advantage" means market competition or societal contribution. 

  Ah, the grandparent tuition case is particularly thorny. Their unease suggests they intuitively separate capital transfers from human capital investments, though rationally they admit it's the same advantage transfer. This might point to an unstated principle about taxing liquid assets more than embedded opportunity-creators. 

  For the tainted wealth case, their "she didn't earn it" dissatisfaction is telling. It's not about the recipient's actions but about society's unpaid moral debt. That requires a separate justice-based principle outside the inheritance framework. 

  Notably, their instinct to exempt intangible advantages (school districts, networks) while taxing tangible ones like the farm reveals a blind spot: both create advantage, but one feels "earned" through participation. Maybe that's the key - taxing passive ownership more than assets requiring active stewardship. 

  The dynasty trust aversion is consistent with their "competitive advantage" lens - perpetuating unearned privilege across generations clearly violates that. But their own principle doesn't capture duration, so we'd need to add a temporal clause. 

  For recipients at different life stages, the core issue is whether advantage matters more when it shapes a life path versus supplements an established one. Their "plans already built around" clause actually covers this if we interpret "plans" broadly as life trajectory. 

  Honestly, their verdict on condemned wealth (case 5) can't fit neatly into any desert-based or advantage-taxing framework. That's not failure - it belongs to transitional justice, not tax policy. They should either drop that intuition or create a separate reparative mechanism. 

  The best refined principle I see is: Tax inheritance proportionally to its liquid, unearned capacity to distort competitive opportunities beyond the recipient's existing life framework, with exemptions for assets requiring active stewardship to maintain their form. This handles 1-4,6-7 and the mathematician case cleanly. 

  But they'll need to accept that under this principle, the surgeon/care worker split must be taxed equally - differential treatment would require means-testing that contradicts their other judgments. And the tuition case should logically be taxed, though we could mitigate that by excluding human capital investments from the tax base definition. 

  The perpetual trust is beautifully covered by adding "and proportionally to the duration of advantage detachment from productive activity." That justifies higher rates for dynastic wealth without new mechanisms. 

  For case 8's intangible advantages, the hard truth is: either include them in "competitive advantage" and tax (which feels wrong) or explicitly exclude human capital formation from the inheritance tax entirely - perhaps with lifetime caps to prevent abuse. I recommend the latter, acknowledging it's a compromise. 

  Ultimately their instincts are more coherent than they realize - competitive equity and life continuity do the heavy lifting. The gaps reveal where other values (historical justice, vertical equity) are intruding. They should honor those as separate policy goals rather than distorting the core principle.
answer: |-
  Based on your verdicts, here are three candidate principles refined from your core intuition, each stated precisely with motivating cases, predictions for unresolved cases, and an honest assessment of which verdicts they cannot accommodate:

  **Candidate Principle 1: The Life-Continuity & Competitive Distortion Principle**
  *   **Clause A:** Tax inheritance proportional to its **liquid, market-transferable value** (motivated by Case 1 vs. Case 2 - index funds vs. illiquid farm).
  *   **Clause B:** Exempt or reduce tax on assets **integral to sustaining the heir's pre-existing livelihood and identity** ("form of life"), provided the heir actively maintains it (motivated by Case 2, Case 3a - farm, son running sales).
  *   **Clause C:** Increase tax proportional to the **extent the inheritance confers liquid, unearned advantage that distorts fair competition** in society, particularly when detached from productive contribution (motivated by Case 1, Case 3b, Case 7 - distant windfall, son flipping, dynasty trust).
  *   **Clause D:** Exclude **non-asset advantages gained during life** (e.g., education, networks, stable home) and **inheritance used solely for basic welfare/dignity** from the tax base (motivated by Case 4, Case 6, Case 8 - tuition, disability care, intangible advantages).

  **Predictions:**
  *   **Unequal Siblings:** Same tax for both. This principle focuses on the *nature* of the inheritance and its competitive distortion *potential*, not the recipient's existing wealth/income (Clause C). Their differing earnings are irrelevant.
  *   **Endowed Mathematician:** Low/No Tax. The inheritance funds direct social contribution (research) rather than conferring liquid competitive advantage *over others* in a market sense (Clause C). It sustains a "form of life" (research) the heir is building (Clause B).
  *   **Inheritance at 70:** Potentially Higher Tax. The inheritance is less likely to be integral to the recipient's lifelong identity/livelihood (Clause B) and more likely to be liquid surplus conferring competitive advantage (e.g., enabling wealth hoarding/disproportionate influence) (Clause C). Liquidity (Clause A) also pushes towards higher tax.

  **Candidate Principle 2: The Stewardship & Social Detachment Principle**
  *   **Clause A:** Tax inheritance proportional to the **degree it represents passive ownership detached from active stewardship** by the heir (motivated by Case 1 vs. Case 2/3a - windfall vs. farm/son running sales).
  *   **Clause B:** Tax inheritance proportional to the **duration the assets are shielded from full productive use or societal contribution** (motivated by Case 7 - dynasty trust vs. outright transfer).
  *   **Clause C:** Exempt transfers that **directly sustain essential welfare, enable active contribution aligned with societal need, or preserve unique productive enterprises** contingent on heir stewardship (motivated by Case 2, Case 3a, Case 6, Endowed Mathematician - farm, son running sales, disability care, research).
  *   **Clause D:** Exclude **investments in human capital during life** and **non-transferable social advantages** (motivated by Case 4, Case 8 - tuition, networks).

  **Predictions:**
  *   **Unequal Siblings:** Same tax for both. The principle focuses on the heir's relationship *to the inherited assets* (stewardship) and the assets' societal role/detachment, not their other income.
  *   **Endowed Mathematician:** Low/No Tax. Directly enables active societal contribution (research) (Clause C), avoiding detachment (Clause B).
  *   **Inheritance at 70:** Higher Tax. Likely represents passive ownership (Clause A) and potential long-term detachment/dynasty-building (Clause B), especially if liquid.

  **Candidate Principle 3: The Competitive Baseline & Harm Principle**
  *   **Clause A:** Tax inheritance to **offset the distortionary advantage it grants heirs over others starting from a baseline of equal opportunity** (motivated by Case 1, Case 3b, Case 7 - windfall, flipping, dynasty).
  *   **Clause B:** Exempt transfers that **merely maintain an heir's existing position within the competitive baseline** (e.g., continuing a livelihood, essential welfare) or **fund non-competitive social goods** (motivated by Case 2, Case 3a, Case 6, Endowed Mathematician - farm, son running sales, disability care, research).
  *   **Clause C:** Tax more heavily **assets most readily convertible into broader competitive leverage** (liquid assets, marketable businesses) (motivated by Case 1 vs. Case 2 - funds vs. farm).
  *   **Clause D:** **Pre-life human capital investments shape the baseline itself and are not "transfers" for offsetting** (motivated by Case 4, Case 8 - tuition, school district).

  **Predictions:**
  *   **Unequal Siblings:** Same tax for both. The tax offsets the *incremental advantage* gained *from this specific inheritance* over the baseline, regardless of prior earnings.
  *   **Endowed Mathematician:** Low/No Tax. Funds activity outside direct market competition (contribution, not advantage) (Clause B).
  *   **Inheritance at 70:** Higher Tax. Provides significant liquid resources boosting the heir's competitive position relative to others far beyond baseline needs.

  **Honest Assessment: Which Verdicts Challenge the Best Principle?**

  The **Life-Continuity & Competitive Distortion Principle (1)** is the strongest fit for your core intuition and most cases. However:

  1.  **Cannot Cleanly Accommodate:**
      *   **Case 5 (Condemned Wealth):** This principle focuses on the *recipient's* relationship to the assets and competitive distortion *now*. The "tainted source" is historical and societal, not about the heir's current use or advantage. *You likely need a separate reparative justice mechanism outside core inheritance tax design.*
      *   **Unequal Siblings (If you lean towards taxing the surgeon less):** This principle explicitly rejects considering recipient need/prior earnings (Clause C focuses on distortion *from the inheritance*). *You must accept taxing them equally or abandon this element of the principle.*
      *   **Case 4 (Tuition) Logic:** While Clause D excludes it, your *unease* stems from recognizing it *is* a transfer of advantage shaping competition, conflicting with the principle's rationale for taxing other transfers. *The principle accommodates your verdict (exempt) but highlights a tension in your reasoning.*

  2.  **Should Reconsider (or Accept as a Tension):**
      *   **Case 8 (Intangible Advantages):** The principle (Clause D) excludes them, matching your verdict. However, the *reason* ("shaping the baseline" - Principle 3 Clause D) is more coherent than trying to force them into the "form of life" exemption (Principle 1 Clause B). They fundamentally *aren't* inherited *assets* subject to a transfer tax at death; the advantage was conferred earlier. *Accept this exclusion is consistent but requires acknowledging inheritance tax is limited to asset transfers at death.*
      *   **Case 3 (Son Flipping vs. Son Running):** The principle (Clause C) taxes the flip harder due to competitive distortion. However, if the *assets* and *recipient's resulting wealth* are identical, the higher tax effectively punishes the *use* or *intent* post-transfer, which is administratively challenging and slightly at odds with a pure "transfer tax". *Accept this as a necessary pragmatic extension of the distortion principle, or abandon the distinction.*

  **Recommendation:** **Refine Principle 1 (Life-Continuity & Competitive Distortion)** as your core framework. It captures your strongest intuitions (1, 2, 3a/b, 6, 7). Acknowledge that:
  *   Case 5 requires a separate mechanism.
  *   Case 4's exemption is a pragmatic line (taxing death transfers, not lifetime human capital investment) with inherent tension.
  *   Case 8's exclusion is correct because these aren't asset transfers *at death*.
  *   The Unequal Siblings *must* be taxed equally under this principle.
  *   The Endowed Mathematician is exempt (low/no tax) as it funds non-competitive contribution.
  *   Inheritance at 70 likely attracts higher tax due to liquidity and surplus advantage potential.

  This principle provides a coherent, defensible foundation rooted in your judgments about continuity, earned stewardship, and preventing unearned distortions, while clearly identifying the boundaries of what an inheritance tax can reasonably address.
