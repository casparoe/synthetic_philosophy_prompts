answer: |-
  ## Reconstructing Rationality Under Deep Uncertainty

  ### Core Commitments of the Practice
  The practice implicitly rests on four commitments. First, **practical commensurability**: all welfare effects (health, income, education) are reducible to a common health-denominated metric (e.g., DALYs), resolving weighting-cluelessness by fiat. This justifies publishing a single number. Second, **expected value as a heuristic**: the point estimate serves as a proxy for expected value under uncertainty, treating epistemic limitations as noise that averages out. Third, **structural optimism**: despite outcome-cluelessness, the world is structured such that interventions with positive near-term effects likely have net-positive long-term effects, making sign-confidence robust. Fourth, **institutional division of labor**: evaluators provide simplified rankings; allocators handle diversification or robustness, separating the decision procedure from the criterion.

  ### Rejected Candidate Commitments
  - **Strict expected value maximization**: Rejected because the cluelessness haircut (2) modifies inputs rather than computing expectations over all models.  
  - **Ambiguity aversion**: Rejected because ranking by point estimates (3) ignores aversion to model uncertainty that could justify pessimism.  
  - **Pure satisficing**: Rejected because satisficing would stop at "good enough" interventions, not strict rankings.  
  - **Rule consequentialism**: Rejected because evaluators present rankings as directly maximizing good, not following rules.  
  - **Robust optimization (minimax)**: Rejected because the Lower-Bound Rule (4) is debated, not central; most use the point estimate.  
  - **Leximin prioritarianism**: Rejected because haircuts (2) discount distant harms to the worst-off, conflicting with leximin.

  ### Rational Choice Under Uncertainty
  The practice presupposes **expected-value reasoning under model uncertainty**, not a departure from it. The cluelessness haircut (2) discounts distant effects because evaluators assign lower credence to models predicting large systemic impacts, treating this as Bayesian updating over causal models. However, publishing a point estimate (3) suggests treating the *mean* of this distribution as action-guiding, implying that uncertainty is symmetric and washes out in large portfolios. This is underdetermined: it *fits* permissivism (any estimate in a range is acceptable) but *presupposes* that the point estimate is a reliable proxy for comparative expected value.

  ### Criterion vs. Procedure
  The practice accepts a **consequentialist criterion** (rightness depends on actual outcomes) but adopts a **non-consequentialist decision procedure** (ranking by point estimates despite cluelessness). This combination is coherent: the procedure is justified instrumentally as the best available method for approximating the criterion. The practice *needs* this split because evaluators openly doubt precision (1) yet act as if point estimates rank true effectiveness, implying the procedure is fallible but necessary for action.

  ### Weighting vs. Outcome Cluelessness
  Weighting-cluelessness is **resolved by commensurability** (all values converted to health units), while outcome-cluelessness is **managed by discounting** (2). The practice locates cluelessness in our *evidence* (incomplete models), not in the world (true indeterminacy) or values (objective incommensurability). Publishing a single number presupposes that values are commensurable and aggregation rules are uncontested.

  ### Alternative Theories and Underdetermination
  - **Permissivist Bayesianism**: Licenses the practice by allowing any credence within wide bounds, making point estimates arbitrary but acceptable. *Discriminating change*: Evaluators publishing multiple rankings from equally reasonable models.  
  - **Imprecise credence view**: Licenses it by requiring a set of possible expected values, with ranking only where sets dominate. *Discriminating change*: Replacing point estimates with intervals and refusing to rank overlapping interventions.  
  - **Virtue institutionalism**: Licenses it by framing rankings as expressions of epistemic humility (sign-focus) and allocative courage. *Discriminating change*: Evaluators explicitly justifying choices as "responsible under uncertainty" rather than "optimal."  
  The practice is underdetermined between these because it never specifies how disagreements over models are resolved or whether rankings are unique.

  ### Resolving Inconsistency Between (2)/(3) and (5)
  The tension is **superficial**. There is a principled line: effects claimed confidently over centuries (5) are **systemic, predictable trends** (e.g., climate change, AI risk) supported by mechanistic models, whereas discounted effects in (2) are **idiosyncratic, causal-chain uncertainties** (e.g., market distortions from cash transfers). The Lower-Bound Rule (4) does not resolve this; it is a robustness heuristic that *might* align with ambiguity aversion but lacks deeper justification. The practice consistently holds that *some* long-term effects are modelable when they dominate the variance.

  ### Taking Cluelessness Seriously: Implications
  If outcome-cluelessness and weighting-cluelessness preclude meaningful expected values:  
  - **Stop doing**: Point-estimate rankings, single-metric commensuration.  
  - **Start doing**: 
    - Publishing multidimensional impact reports (without aggregation).  
    - Diversifying portfolios across intervention *types* (hedging model uncertainty).  
    - Explicitly funding option-value projects (preserving future choice).  
    - Prioritizing research to reduce key uncertainties.  
  - **Still counts as doing good? Qualified yes**: Diversification and option value are rational under deep uncertainty, but "most good" becomes undefined. Good is achieved probabilistically through robust, adaptive strategies.

  ### Weakest Link
  The weakest link is **structural optimism**. If negative tail risks dominate (e.g., bednets increasing malaria resistance long-term), sign confidence collapses. If observation showed interventions with robust short-term benefits but net-negative long-run effects (e.g., via general equilibrium harms), the practice would need fundamental revision. Confidence: 0.6 – the reconstruction fits but optimism is empirically contingent.

