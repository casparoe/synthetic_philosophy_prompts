prompt: |-
  Me and my writing partner are two books into a trilogy about a family and a fertility clinic in Bristol, and we've got into the habit of "re-running" scenes: we take a character, change one thing about how she came to exist, and write the same life again to see what falls out. It's more or less become the structure of book three. The problem is that every week one of us pitches a variant and then we spend forty minutes arguing about whether the person in the variant is still her or is somebody else with her name, and the answer changes the emotional contract with the reader completely — if it's her, the reader grieves; if it's a stranger wearing her face, the reader is meant to feel spooked. I had a look at the Wikipedia page on origin essentialism and its no use to me: it tells me the Kripke-style view, the one where a person couldn't have grown from a different egg and sperm, and then tells me that plenty of people disagree, and that's about it. Please don't palm me off with a reading list or start name-dropping papers at me — I'm not writing an essay and I've got no library access where I live, I need something I can actually use.

  What I want is a decision procedure, the sort of thing we can run on a pitch in ten minutes at the kitchen table with no philosophy between us. Roughly: what's the first question we ask about a variant, what counts as a good enough answer to it, at what point does the procedure just say "no, that's somebody else" and stop, and at what point does it hand the decision back to us because it's a choice about the book rather than a fact about identity. It needs to keep whatever is really doing the work in the philosophical view while being usable by two novelists, and I'd rather you were straight with us about which distinctions you've had to flatten to make that work and which ones have to survive or the whole thing falls apart. Three snags I keep tripping over and want the procedure to deal with rather than dodge: fertilisation isn't an instant, it's a process lasting hours, so "which sperm" is sharp but "when she began" isn't, and one of our best variants is the very same embryo, same gametes, frozen for twelve years and implanted later, so she's born into a completely different family; gametes are themselves objects with their own origins, so if we insist on strict necessity at the level of the egg and sperm, why not at the level of the grandmother's, or of the matter the gametes are made of, and where does the procedure stop that regress and admit that it's just stopping; and then the nasty one, a mitochondrial donation case, where the mother's nuclear material is put into a donor egg that's been emptied of its own nucleus, so the nuclear DNA is mum's and dad's but the cytoplasm and a tiny sliver of the genetic material come from a stranger. Is that a different egg or not? Under a rule that says different egg, different person, I genuinely can't tell, and it's currently the opening of chapter four.

  Could you also run the procedure on three of our actual variants and show your working. (1) The frozen-embryo one above. (2) Identical twins: same sperm, same egg, one zygote that splits — so if the rule only ever asks about the gametes it can't tell the twins apart, and we need to know whether that's a bug to patch by moving the origin to the zygote or to the splitting event, or whether it's a sign the whole approach is wrong for a novel. (3) A clone: a skin cell from the mother, nucleus put into an emptied donor egg, no sperm anywhere in the story. My editor, who has to sign off on the structure and has already told me she wants the throughline to be one woman's life, is going to hate whatever the procedure says about at least one of these, so please say plainly when the answer is one she won't want, and be honest about the cases where your procedure is mostly a way of dressing up a decision we were always going to have to make ourselves — and about where it will misfire on us, because we'll be trusting it for the next eight months.
reasoning: |-
  Okay, the user is a writer collaborating on a trilogy, and they're struggling with character identity across different variants of the same character. They need a practical decision procedure to determine if a variant is the same person or someone else, without getting bogged down in philosophy. Let me unpack their main issues.

  First, the core problem: when they alter a character's origin, how do they decide if it's still the same character? This affects the emotional impact—same person means grief, different person means eeriness. They’ve looked into origin essentialism but found it unhelpful because philosophers disagree, and they need something actionable.

  Their three snags are tricky. Fertilization is a process, not an instant, so pinpointing "when she began" is fuzzy. The frozen embryo variant uses the same gametes but implanted later in a different family. Then there's the issue of infinite regress—if the origin depends on the gametes, why not the grandparents' origins? And mitochondrial donation complicates what counts as the same egg.

  They also want the procedure tested on three variants: frozen embryo, identical twins, and a clone. The editor wants a consistent throughline of one woman's life, so some outcomes might clash with that.

  I need to create a step-by-step method that's quick and usable by non-philosophers. The key is balancing philosophical concepts with practicality. Let me start by identifying the essential elements from essentialism. Kripke’s view is that the same sperm and egg are necessary. But since fertilization isn't instantaneous, I need a defined threshold. Using the zygote as the origin point makes sense because it’s when the genetic material combines.

  For the regress problem, I should stop at the gametes themselves without going further. The procedure should treat gametes as starting points to avoid infinite backtracking. Mitochondrial donation is tricky. The nuclear DNA defines the core identity, so even with donor mitochondria, it's the same person if the nuclear material matches. That handles the "different egg" concern.

  Now, structuring the steps. First, check if the same zygote is present. If yes, it's the same person regardless of implantation time (frozen embryo). For twins, since they share a zygote initially, splitting creates two new individuals. The procedure needs to mark the split as the origin point for each twin. Clones: no sperm, so different genetic origin. The clone is a distinct individual with the mother's nuclear DNA but not the same origin.

  Testing the variants:
  1. Frozen embryo: Same zygote → same person. The different family doesn’t change identity.
  2. Twins: Same zygote splits → two new entities after splitting. Each twin is a different person from the original concept.
  3. Clone: Different gametic origin, so a different person.

  The editor might dislike the clone being a different person if she wants one woman's life. The procedure flags this as a creative choice rather than a definitive answer. For twins, it clarifies they’re distinct individuals, which might require narrative adjustments.

  I should also note where the procedure is limited. Cases like mitochondrial donation or twins require clear definitions upfront. Emphasize that emotional resonance might override the procedure, but it provides a consistent baseline.

  Finally, the user needs transparency about flattened distinctions. For example, ignoring the grandmother's origin stops regress but is a practical cut-off. Highlighting these helps them apply the tool effectively without false precision.
answer: |-
  Here's a battlefield-tested **Identity Threshold Procedure (ITP)** designed for novelists at a kitchen table. It flattens metaphysical debates into a usable workflow, prioritizing *narrative consequence* over absolute truth. It focuses on **Genetic Origin + Narrative Continuity**, with explicit cut-offs to stop regress and flag creative choices.

  **Core Principle:** A character is "the same person" **if and only if** they share the *same unique genetic origin event* AND the narrative treats their life as a *continuous thread* from that origin. Disrupt either, and it's a *new individual* wearing the old face.

  **The ITP Steps (10-Minute Kitchen Table Version):**

  1.  **ASK: "Is the *exact same zygote* (fertilized egg cell) present at the origin of this variant?"**
      *   **Good Enough Answer:** Focus on the *genetic material*. Did the sperm nucleus and egg nucleus that *actually* fused in the original timeline fuse here? (Ignore mitochondrial DNA for now).
      *   **If YES:** Proceed to Step 2. *This captures frozen embryos, IVF timing shifts, etc.*
      *   **If NO:** It's a **different person**. Stop. *(Captures different sperm/egg combinations, clones from somatic cells, most donor egg cases)*.
      *   **Fuzzy Case (Mitochondrial Donation):** *Interpret as YES for the nuclear DNA.* The *nuclear* genetic blueprint defining core traits is identical. The mitochondrial donor is seen as providing "cellular machinery," not core identity. **Flag as a "Soft YES" - proceed to Step 2 but note the complication for potential eerie undertones.** *(This flattens the "different egg" concern by prioritizing nucleus over cytoplasm)*.
      *   **Regress Stopper:** We stop at the gametes *as the contributing cells*. We do *not* trace the origin of the gametes themselves (grandmother's eggs, etc.). The zygote fusion is the *event* defining the unique individual's start point. Matter regress is ignored.

  2.  **ASK: "Did this zygote develop into a living entity *without creating a fundamentally distinct biological entity first*?"**
      *   **Good Enough Answer:** Did the zygote develop *directly* into *one* fetus/baby? Or did it split (twins) or get fundamentally altered (major chimerism experiment) *before* becoming the individual we recognize?
      *   **If YES (Direct Development):** Proceed to Step 3. *(Captures standard development, frozen embryo implantation)*.
      *   **If NO (Splitting/Alteration):** It's a **different person** (or persons). Stop. *(Captures identical twins - the split creates new, distinct individuals from one origin point. Captures sci-fi hybrid experiments)*.
      *   **Fertilization Process Snag:** If the variant changes *which sperm* fertilizes the egg, it's a different zygote (Step 1 = NO). If it changes the *timing* of fertilization/implantation but uses the *same* sperm and egg nuclei fusing, Step 1 = YES. Vagueness about the *exact instant* of fusion is irrelevant as long as the *specific genetic combination* happens.

  3.  **ASK: "Does the narrative present this life as the *continuous experience* stemming *directly* from that specific zygote's development, OR is it presented as a 'what if' branch point or replacement?"**
      *   **Good Enough Answer:** Is the story asking "What happened to *Sally* after this change?" (implying continuity) OR "What if *someone like Sally* existed under these conditions?" (implying a new individual).
      *   **If CONTINUOUS:** Treat as the **same person**. The emotional contract is grief/change/resilience.
      *   **If BRANCH/REPLACEMENT:** Treat as a **different person**. The emotional contract is eeriness/uncanny valley/replacement.
      *   **HAND-BACK POINT:** This step **explicitly hands the decision back to you.** Steps 1 & 2 establish the *biological potential* for sameness. Step 3 is where *your narrative intent* rules. You decide the story's framing. The procedure forces you to consciously choose the framing based on the biological facts established in Steps 1 & 2.

  **Flattened Distinctions & Survival Essentials:**
  *   **Flattened:** Kripke vs. Psychological Continuity debates. Grandparent origins/matter origins. Exact moment of fertilization (focus on genetic combo). Mitochondrial DNA's role in identity (treated as secondary environment).
  *   **Essential to Survive:** The *unique genetic origin event* (specific zygote) as the necessary starting point. The distinction between *one continuous thread* vs. a *branch/replacement* as the core narrative choice defining sameness for the reader. Stopping regress at the gametes-as-contributors.

  **Running Your Variants:**

  1.  **Frozen Embryo (Same Gametes, Implanted Later, Different Family):**
      *   Step 1: Is the *exact same zygote* present? **YES.** (Same sperm nucleus + same egg nucleus fused).
      *   Step 2: Did it develop directly into one baby? **YES.** (Freezing/thawing/delayed implantation doesn't create a new distinct entity like a twin split).
      *   Step 3: How is the narrative framed? **HAND-BACK.** Biologically, it's *potentially* Sally. *You* decide: Is it "Sally born into a different family" (Same Person - grief for lost upbringing) OR "Someone genetically identical to Sally raised elsewhere" (Different Person - spooky parallel)? **Editor Warning:** If the *entire throughline* is "one woman's life," framing this as a Different Person undermines that severely. The procedure says biology allows Same Person; narrative choice is yours, but Editor likely demands Same Person.

  2.  **Identical Twins (Same Sperm, Same Egg, One Zygote Splits):**
      *   Step 1: Is the *exact same zygote* present? **YES.** (For the initial zygote).
      *   Step 2: Did it develop *directly* into one baby? **NO.** It split, creating two fundamentally distinct biological entities (Twin A and Twin B).
      *   **STOP.** **Different Persons.** Each twin is a unique individual from the moment of splitting (or very soon after). They share an origin *event* but are *not* the same person. **Editor Warning:** If your original "her" is one specific twin, a variant showing the *other* twin living "her" life is absolutely a Different Person (spooky parallel). If you show the zygote splitting and *then* follow one twin's life starting *from the split*, it's still the *same* as following any individual from birth – it's continuous from *their* origin point (post-split). The "bug" is fixed by Step 2 correctly identifying the split as creating new entities. This approach *works* for a novel – it clarifies twins are distinct people.

  3.  **Clone (Skin Cell Nucleus into Emptied Donor Egg):**
      *   Step 1: Is the *exact same zygote* present? **NO.** The gametic material is fundamentally different. No sperm involved. The egg nucleus (donor) is removed and replaced. It's a somatic cell nucleus + donor egg cytoplasm.
      *   **STOP.** **Different Person.** Genetically very similar (barring mitochondrial DNA differences and somatic mutations), but the *origin event* is entirely different. This is not Sally; it's Sally's genetic twin born via unconventional means. **Editor Warning:** This is likely the **answer your editor will hate** if she demands "one woman's life." The procedure is clear: biologically, it's a new individual. You can *override* this narratively in Step 3 ("We *say* it's a continuous Sally uploaded/reborn!"), but this breaks the biological logic of the ITP and risks reader confusion/alienation unless handled *very* carefully with strong sci-fi/fantasy justification. Be prepared for pushback.

  **When the ITP Will Misfire (Be Warned):**
  1.  **High Metaphysics/Souls:** If your story relies on souls or non-physical essences, the ITP ignores them. It's strictly materialist/narrative.
  2.  **Radical Brain Transfers/Uploads:** If "Sally's" mind is copied into a clone body, Step 1 (NO) says Different Person, even if the narrative (Step 3) screams "Same Person!". This clashes. Use ITP for *biological origin* variants; handle consciousness transfer separately.
  3.  **Ambiguous Narrative Framing:** If *you* are unsure whether Step 3 is Continuous or Branch, the ITP can't help. You *must* make a clear authorial choice.
  4.  **Readers' Personal Philosophy:** Some readers inherently believe a frozen embryo *is* a different person, or a clone *is* the same person. The ITP provides consistency for *your* narrative, not universal truth.

  **Final Advice:** Use the ITP rigorously for Steps 1 & 2 to establish the biological baseline for potential sameness. Then, **own** Step 3 as your narrative choice. Be consistent within your book's logic. If your editor mandates "one woman's life," then variants passing Step 1 & 2 *must* be framed as Continuous in Step 3 (Same Person), and variants failing Step 1 or 2 *must* be framed as Branches/Replacements (Different Person) – *even the clone*, though that requires stronger narrative justification. The ITP gives you the tools to argue *why* something is or isn't "her" biologically, so you can make informed creative decisions about the emotional impact. Good luck with book three!
