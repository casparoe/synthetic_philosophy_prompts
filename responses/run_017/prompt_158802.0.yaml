answer: |-
  ### Headline Credence
  **6%** that at \(N = 25\), \(q = 0.2\), and \(\rho = 0.1\), the majority vote over the cheap AI panel has higher expected accuracy than the single senior reviewer.  
  *Justification:* Baseline calculation (using given model and parameters) yields panel accuracy ~74.2% vs. senior's 85%, but uncertainties in model assumptions and adaptation allow a small chance the panel outperforms.

  ### Decomposition
  1. **Credence that the 0.62 competence survives adaptation: 50%**  
     *Justification:* Adversarial adaptation by the item producer could degrade the base accuracy; no data to assess likelihood, so treated as a coin flip.
     
  2. **Credence in the error decomposition model: 70%**  
     *Justification:* The shared-cause + residual-correlation model is plausible for correlated AI errors but lacks empirical validation; moderate confidence.

  3. **Credence that correctness is determinate for accuracy: 80%**  
     *Justification:* Contested items introduce indeterminacy, but accuracy remains a useful proxy; high confidence it applies broadly.

  4. **Effective jury size penalty: \(N_{\text{eff}} \approx 7.35\)**  
     *Justification:* With \(N = 25\) and \(\rho = 0.1\), \(N_{\text{eff}} = N / (1 + (N-1)\rho) = 25 / (1 + 24 \times 0.1) = 25 / 3.4 \approx 7.35\).

  ### Combination of Terms
  The headline 6% combines:  
  - The panel only has a chance if the model is wrong (30% credence), base accuracy survives (50%), and correctness is determinate (80%).  
  - If those hold, the panel is better in 50% of model-violating scenarios (subjective).  
  - Calculation: \(0.3 \times 0.5 \times 0.8 \times 0.5 = 0.06\).

  ### Sensitivity and Empirical Work
  - **Most sensitive to:** Credence in the decomposition model (term b, 70%).  
    *Why:* A 10% increase in model doubt (to 60%) raises headline credence to 8%, the largest jump among terms.  
  - **Empirical work:** Validate the error decomposition model (e.g., measure \(\rho\) and \(q\) on real data).  
    *Why:* The model drives the effective jury penalty; if wrong, the panel's true accuracy could be higher.  

  ### Stopping Point for Reviewers
  **Stop at \(N = 0\)** (use the senior reviewer).  
  *Why:*  
  - At \(N = 25\), the panel's estimated accuracy (74.2%) < senior's (85%), even under optimistic assumptions.  
  - No \(N \leq 25\) yields higher accuracy than the senior (see table below).  
  - Spending the budget on better supervision (e.g., improving the senior) dominates adding cheap reviewers.  

  #### Panel Accuracy by \(N\) (Model Estimate)
  | \(N\) | \(N_{\text{eff}}\) | Accuracy |
  |-------|-------------------|----------|
  | 1     | 1.00              | 62.0%    |
  | 5     | 3.57              | 67.9%    |
  | 10    | 5.26              | 71.6%    |
  | 15    | 6.25              | 72.7%    |
  | 20    | 6.90              | 73.7%    |
  | 25    | 7.35              | 74.2%    |

  *Accuracy peaks at 74.2% for \(N=25\) but remains below 85%. No incremental \(N\) justifies forgoing the senior.*
