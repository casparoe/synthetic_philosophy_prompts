  - Local maxims *can* fit Grice if treated as culture-specific applications of Quality/Relation, but Stevens' professional code often overrides cooperativity entirely.
  - The novel exposes how power asymmetries corrupt the "mutuality" Grice presupposes - servants must decode masters without expecting reciprocity.

  Teaching strategy:
  Start with the bus scene (denying Lord Darlington) to show blatant Quality violation where Stevens believes he's obeying a "dignity" super-maxim. Contrast with Father's death scene where Relation violations mask unbearable emotion. Use banter scenes to demonstrate how particularized implicatures fail without shared norms. Finally, the Miss Kenton letters scene reveals a lifetime of accumulated non-cooperation.

