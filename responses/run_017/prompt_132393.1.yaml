answer: |-
  Here’s the exam question, model answer, and marking scheme designed to force engagement with the non-epistemic stakes of originality and push beyond clichés.

  ---

  ### Exam Question Text  
  **Time Allowed:** 45 minutes  
  **Word Limit:** 900–1000 words  
  **Answer ONE Question:**  

  **1. "The value of an original artwork is reducible to its epistemic or aesthetic properties." Critically evaluate this claim using ALL FOUR cases below. In your response, you must:**  
  - **Distinguish at least three distinct kinds of non-aesthetic value** that might be attributed to originals.  
  - **Explain whether any "loss" incurred in the Swap or Destruction cases constitutes a loss *to a specific person or group***.  
  - **Explicitly separate epistemic concerns** (e.g., doubts about authenticity) from non-epistemic claims.  

  #### Cases:  
  **A. The Perfect Facsimile:** A Rembrandt self-portrait is scanned at molecular resolution and reconstructed atom-by-atom, creating a physically identical duplicate. An exhaustive, error-proof verification protocol confirms *no intrinsic difference* exists between original and facsimile (including craquelure, pentimenti, varnish layers, and material composition). There is *no epistemic uncertainty* about their identity.  

  **B. The Swap & Destruction:**  
     - *(i) Swap with Disclosure:* The facsimile (from Case A) is displayed in the Louvre with a small label: "Exact Molecular Replica." The original is stored in a secure, climate-controlled vault. No one (visitor, curator, scientist) can distinguish them.  
     - *(ii) Swap without Disclosure:* The Louvre repeats the swap but *removes the label*. Visitors believe they see the original.  
     - *(iii) Destruction:* After creating the facsimile, the original (unbeknownst to anyone) is destroyed. The facsimile remains displayed *without disclosure*, and no one ever discovers the destruction.  

  **C. The Restored 'Original':** A 17th-century Baroque painting in the Uffizi is examined. Rigorous conservation science reveals that ~65% of its current painted surface was applied by restorers in the 19th century. The "original" object visitors see is materially mostly a later artifact.  

  **D. The No-Complaint Collector:** An art lover knowingly purchases a perfect molecular facsimile (as in Case A) of a van Gogh for 0.1% of the original’s market price. She displays it privately, experiences profound aesthetic joy, and never misrepresents it. She declares: "I lost nothing; I gained everything I wanted."  

  ---

  ### Model Answer (Approx. 700 words)  
  The claim that an artwork’s value is reducible to epistemic or aesthetic properties fails to capture the non-epistemic, relational values embedded in originals. We must distinguish three kinds of non-aesthetic value: **historical value** (an object’s causal link to past creative acts), **categorical value** (its status *as* an original instance within an art-historical category), and **testimonial value** (its function as evidence sustaining cultural narratives). Epistemic access (e.g., knowing we see Rembrandt’s hand) enables but does not constitute these values.  

  **Case A (Perfect Facsimile)** demonstrates that even with *perfect* epistemic access to intrinsic properties, the facsimile lacks **historical value**. It is not the product of Rembrandt’s labor, intentions, or historical context. This is not an epistemic gap (we *know* it’s identical) but a categorical one: it is a replica, not an autographic work. Denying this collapses art into mere aesthetics, ignoring why we preserve Rembrandt’s actual brush rather than a perfect clone.  

  **Case C (Restored ‘Original’)** complicates but does not erase historical value. While materially hybrid, the work retains a *continuous physical lineage* from the 17th century. It is a palimpsest of historical interventions, not a de novo fabrication. Its categorical value as *the* artifact that endured—participating in art history (e.g., hung in a 1700s gallery)—survives partial restoration. A facsimile has no such lineage.  

  **Case D (No-Complaint Collector)** shows that deception is central to *moral* wrongs in forgery, but not to the *value gap* for originals. The collector suffers no aesthetic or personal loss. Yet if her facsimile were displayed publicly as "van Gogh’s *Sunflowers*," it would corrode **testimonial value**: the object’s role as evidence for art-historical truth. This is a *relational* value concerning public trust, not individual experience. Her satisfaction doesn’t negate that the facsimile, if undetected, would pollute the historical record.  

  **Case B (Swap & Destruction)** exposes the non-epistemic loss when originals are displaced or destroyed:  
  - *(i) Swap with Disclosure*: Loss occurs but *not* to individual visitors (they gain accurate aesthetic/historical access). The loss is to **categorical value**: the museum demotes the original from *exhibited work* to archived artifact, altering its social role. The original’s status as a *focus of pilgrimage* diminishes.  
  - *(ii) Swap without Disclosure*: Adds deception, harming testimonial value (the public’s trust in the museum as custodian of history).  
  - *(iii) Destruction*: Here, the irreversible loss of historical value affects *future persons* and collective culture. Even if undetected, humanity loses the physical thread to van Gogh’s act. This is not a loss *felt* by any living person, but a loss to humanity’s shared heritage—a repository of testimonial evidence.  

  **Conclusion**: Aesthetic and epistemic properties are insufficient. The original’s destruction (Case B-iii) causes loss primarily by severing a unique historical relation. This loss is real but diffuse—distributed across culture and time—not necessarily tied to individual experience. The "residue" of value in originals is their irreplaceable role as nodes in a historical network.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Must-hit points (MHP):**  
  1. **Certainty Stipulation Respected** (4 marks):  
     - *Full marks:* Explicitly blocks epistemic doubts in Cases A/B/D; uses perfect identity to isolate non-epistemic value.  
     - *Common wriggle:* Reintroduces doubt ("Can we *really* know it’s identical?").  
  2. **Three Values Distinguished** (5 marks):  
     - *Full marks:* Clearly defines historical (causal origin), categorical (type membership), and testimonial (evidence/record) value.  
     - *Common wriggle:* Uses "value" vaguely; conflates historical with aesthetic; omits testimonial value.  
  3. **Restoration Case Implications** (4 marks):  
     - *Full marks:* Argues that partial restoration preserves lineage/categorical value vs. facsimile’s clean-slate status.  
     - *Common wriggle:* Overstates restoration as "disproof" of originality (ignoring continuous identity).  
  4. **Collector & Deception Analysis** (3 marks):  
     - *Full marks:* Separates moral wrong (lie) from value loss; links undetected forgeries to testimonial harm.  
     - *Common wriggle:* Claims collector’s satisfaction proves "no loss" (ignores public/record-based values).  
  5. **Loss-to-Whom in Swap/Destruction** (4 marks):  
     - *Full marks:* Identifies non-personal loss (e.g., to heritage/future persons) in B-i/B-iii; ties B-ii to trust.  
     - *Common wriggle:* Claims only deceived individuals lose out (ignores B-iii’s undetected destruction).  

  ---

  ### A vs. B Answer Differentiation  
  - **A Answer (17–20):** Explicitly argues that the loss in **Case B-iii (undetected destruction)** is a *non-experiential, collective loss* to humanity/heritage—affecting *no living person* yet still a genuine depletion of testimonial/historical resources. Makes a clear "move" from individual experience to transgenerational cultural ontology.  
  - **B Answer (13–16):** Identifies three values and non-epistemic loss but ties loss *only* to deceived individuals (e.g., in B-ii) or institutions. Fails to fully confront the challenge of B-iii (loss without victims) or reduces it to "potential future discovery."  

  ---

  ### Note on Case Rigging  
  Your cases are robust, but **Case C (Restoration)** is the most vulnerable to a "gotcha" rebuttal if students claim it *equates* to forgery (it doesn’t: restoration is additive/contextual, not deceptive replication). Emphasize in grading that Case C’s purpose is to *challenge material fetishism*, not to "disprove" originality. The model answer’s "continuous lineage" point neutralizes this. The other cases resist binary answers by design.  

  ---  
  This structure forces engagement with the "residue" of value after epistemic/aesthetic factors are controlled, rewards precision in value taxonomy, and centers the key puzzle: *Who loses what when no one knows?*
