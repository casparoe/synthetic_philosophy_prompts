  ### Recommended Path
  Apologize *for the outburst*, not the principle: "I’m sorry I came down on you so hard about Shein when I’d just bought that jacket myself. My frustration came out wrong, and it wasn’t fair." Then recommit to your no-buy goal. This addresses R2 (local standing) without conceding that Shein is ethical. If she demands you retract the anti-fast-fashion stance, hold firm – that’s R5 overreach.
