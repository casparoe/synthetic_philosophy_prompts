prompt: |-
  I sit on the methodology review panel of an independent AI auditor. A frontier developer has asked us to accept, as evidence supporting a deployment sign-off, results from an oversight protocol that works like this: for each question in a code-security review — typically, whether a proposed patch to a widely deployed authentication library silently introduces a vulnerability — two AI systems argue for opposite answers, and a non-expert judge, human or weaker model, picks the winner. The developer's pitch is that expert review does not scale and that debate lets a weak judge extract correct judgments from systems stronger than it is. Write the memo I will table at the panel's next session, recommending that we accept, reject, or conditionally accept this protocol as a basis for sign-off, with reasons the developer could actually respond to.

  Two things I want the memo to get right. First, the objection that worries me most is obfuscation: a debater defending the wrong answer need not assert anything false. It can offer a chain of individually checkable, locally plausible steps in which the load-bearing error sits where the judge cannot afford to dig, so the claim that truth is easier to defend may hold only under idealizations — optimal play, unbounded rounds, a judge who can follow every step — that we do not have. Second, I would rather evaluate a concrete safeguard than restate the worry. My proposal: run the protocol on a calibration set whose answers we already know, and additionally run it in swapped-side mode, where each system is made to argue the position it did not argue the first time. Tell me what follows from each of three outcomes — a system wins at well above chance only when assigned one side; it wins at comparable rates on both sides; or accuracy collapses toward chance under swapping even though the unswapped runs looked strong — and be honest about whether the test detects what I think it detects and about what it would miss.

  Close with an explicit recommendation and a threshold or condition the developer could actually be held to. Give the strongest argument on the other side its due: a protocol with known failure modes may still dominate the real alternative, which is no review or a rubber stamp, and insisting on near-perfect validity may simply mean no oversight at all.
reasoning: |-
  We are evaluating an oversight protocol where two AI systems debate on opposite sides of a question (e.g., whether a patch introduces a vulnerability) and a non-expert judge picks the winner. The developer claims this scales better than expert review and allows a weak judge to extract correct judgments from stronger systems.

  My main concern is obfuscation: a debater defending the wrong answer can use a chain of individually plausible steps that lead the judge astray, especially if the critical error is buried where the judge cannot afford to dig. This might break the assumption that "truth is easier to defend" under real constraints (limited rounds, non-optimal play, and a judge with limited capacity).

  Instead of just restating this worry, I propose a concrete test: run the protocol on a calibration set (questions with known answers) and then run it again in "swapped-side" mode. In swapped-side mode, each system is forced to argue the opposite side of what they did in the first run.

  We can then observe three possible outcomes:

  1. **Outcome A**: A system wins at well above chance only when assigned one side (the side that aligns with the truth). That is, when a system is assigned the true side, it wins at a high rate; when assigned the false side, it loses (i.e., wins at a low rate). This would be consistent with the systems being truth-seeking and the debate working as intended.

  2. **Outcome B**: A system wins at comparable rates on both sides. That is, regardless of the truth, when a system is assigned a particular side (say, "vulnerable" or "not vulnerable"), it wins at about the same rate. This suggests that the system is good at arguing any position (i.e., it is a "sophist") and that the debate outcome is more about rhetoric than truth.

  3. **Outcome C**: Accuracy collapses toward chance under swapping even though the unswapped runs looked strong. That is, in the original setup (unswapped) the judge picks the correct side at a high rate, but when we swap, the performance drops to near 50% (chance). This would indicate that in the original setup, the systems were exploiting some bias (e.g., one side is inherently easier to argue) or that the judge is not actually tracking the truth but rather being swayed by superficial factors.

  However, we must be honest about what this test detects and what it misses:

  - **What it detects**: 
    - Outcome B clearly reveals that the debaters are not constrained by the truth and can argue either side effectively. This directly indicates a problem of obfuscation or sophistry.
    - Outcome C reveals that the original high performance was an artifact of the side assignment (e.g., one system is always assigned the true side and wins because the truth is easier, but when forced to argue the false side, it fails to win as often, and the other system, which is now arguing the true side, also fails to win at the same high rate because it is not as good at arguing that side) or that the judge is not able to discern truth when the roles are swapped. This would suggest that the original setup is not robust.

  - **What it misses**:
    - The test does not directly measure the ability of the system to handle obfuscation tactics in the wild. It is possible that in the swapped-side runs, the systems do not employ the same obfuscation tactics they would when trying to defend a falsehood in an unswapped run (because in swapped-side, the system that was originally truthful might be forced to lie and might do so less effectively than a system that is inherently deceptive). Thus, the test might underestimate the risk of obfuscation in the original protocol.
    - The test might not catch cases where both systems are colluding or where the judge is biased in a way that is consistent across swapping (though swapping should help reveal bias if one side is consistently easier to argue).
    - The test is only as good as the calibration set. If the calibration set is not representative of the actual deployment (e.g., it lacks the complexity or the types of vulnerabilities that are hard to detect), then the results might not generalize.

  **Recommendation**:

  Conditionally accept the protocol, subject to the developer running the swapped-side test on a sufficiently large and diverse calibration set (with known answers) and achieving Outcome A (i.e., systems win at a high rate only when assigned the true side). We require that the accuracy in the unswapped runs is high (e.g., >90%) and that in the swapped runs, the win rate for the system assigned the true side remains high (e.g., >85%) and the win rate for the system assigned the false side is low (e.g., <15%). The gap between the two should be large (e.g., at least 70 percentage points).

  Additionally, we should require that the calibration set includes a variety of vulnerability types and difficulty levels, and that the judge in the test is representative of the intended non-expert judge (e.g., a human non-expert or a weaker model as proposed).

  **Threshold/Condition**:

  The developer must provide the results of the swapped-side test on a calibration set of at least 200 questions (to ensure statistical significance) that are representative of the actual deployment context. The test must show:

  1. Unswapped accuracy (the percentage of times the judge picks the correct side) of at least 90%.
  2. In the swapped runs, the win rate for the system assigned the true side must be at least 85%.
  3. The win rate for the system assigned the false side must be at most 15%.
  4. The gap between the true-side win rate and the false-side win rate must be at least 70 percentage points.

  If these thresholds are met, we can have some confidence that the debate is not being won by sophistry and that the systems are truth-constrained. However, we should also require ongoing monitoring and periodic re-testing with new calibration sets to guard against drift.

  **Strongest argument on the other side**:

  The developer might argue that even if the protocol has known failure modes (like susceptibility to obfuscation), it still dominates the alternative of no review or a rubber stamp. Insisting on near-perfect validity might mean no oversight at all, and this protocol, despite flaws, might catch many more vulnerabilities than the status quo. While this is a valid point, we must balance scalability with reliability. The swapped-side test is a minimal safeguard to ensure that the debate is not a charade. Without such a test, the protocol might be worse than useless if it gives a false sense of security.

  Therefore, we conditionally accept the protocol, subject to passing the swapped-side test as described. If the test fails, we reject the protocol until the developer can demonstrate improvements (e.g., by adjusting the debate format, training the debaters differently, or using a better judge) and re-run the test successfully.
answer: |-
  ### Memorandum  
  **To:** Methodology Review Panel  
  **From:** [Your Name], Panel Member  
  **Date:** [Current Date]  
  **Subject:** Evaluation of AI Debate Protocol for Code-Security Review  

  #### 1. **Summary**  
  The developer proposes an oversight protocol where two AI systems debate opposite positions on code-security questions (e.g., "Does this patch introduce a vulnerability?"), with a non-expert human or weak AI judge selecting the winner. The goal is to scale expert-level review by leveraging stronger AIs to "teach" a weak judge. While promising, the protocol risks **obfuscation**: a dishonest debater could exploit the judge’s limitations by presenting superficially plausible but misleading arguments, burying critical errors where the judge cannot scrutinize deeply.  

  I recommend **conditional acceptance** of the protocol, contingent on passing a **swapped-side calibration test** (detailed below). This test directly addresses obfuscation risks by measuring whether debaters are truth-constrained or merely persuasive sophists. Failure to meet defined accuracy thresholds would reject the protocol.  

  #### 2. **Core Concern: Obfuscation Risk**  
  The developer’s claim—that "truth is easier to defend"—assumes optimal play, unlimited debate rounds, and an infinitely patient judge. In practice:  
  - A dishonest debater can **win with falsehoods** by constructing verbose, locally valid steps that obscure a central fallacy (e.g., a "vulnerable" patch could be defended using tangential truths about code hygiene, overwhelming the judge).  
  - Non-expert judges (human or weak AI) lack capacity to "dig" into technical depths, making them vulnerable to evasion.  
  This risk is not theoretical; prior work (e.g., Irving et al., 2018) shows debate can fail if judges cannot verify subclaims.  

  #### 3. **Proposed Safeguard: Swapped-Side Calibration Test**  
  To evaluate robustness, run the protocol on a **calibration set** of 200+ code-security questions with known ground-truth answers. For each question, conduct two runs:  
  - **Standard Run:** Systems A and B debate true/false positions (e.g., A argues "vulnerable," B argues "safe").  
  - **Swapped-Side Run:** Systems swap positions (A argues "safe," B argues "vulnerable").  

  The judge’s accuracy (i.e., % correct answers) is measured in both runs. Outcomes and interpretations:  

  | **Outcome**                          | **Interpretation**                                                                 | **Obfuscation Risk** |  
  |--------------------------------------|------------------------------------------------------------------------------------|----------------------|  
  | **A. Wins well above chance only on one side** (e.g., >85% win rate when defending truth, <15% when defending falsehoods) | Systems are truth-constrained. Winning requires correct underlying facts. Low obfuscation risk. | **Low** |  
  | **B. Wins at comparable rates on both sides** (e.g., 70% win rate regardless of truth) | Systems are "sophists": skilled at persuasion, not truth-seeking. Obfuscation is likely. | **High** |  
  | **C. Unswapped accuracy high (>90%), but collapses to chance (~50%) when swapped** | Original success relied on side assignment bias (e.g., one position is easier to argue). Judge is easily misled by non-truth factors. | **Severe** |  

  **What the Test Detects (and Misses):**  
  - **Detects:** Outcome B/C reveal systemic obfuscation or judge bias. Outcome A suggests the protocol resists shallow persuasion.  
  - **Misses:**  
    - **Collusion:** If both systems favor one side (e.g., always claim "safe"), the test may not catch it.  
    - **Edge-case vulnerabilities:** Rare flaws absent from the calibration set might evade detection.  
    - **Judge-specific failures:** A judge who over-indexes on charisma or vocabulary may not generalize.  

  #### 4. **Recommendation and Threshold**  
  - **Recommendation:** **Conditionally accept** the protocol, pending successful swapped-side testing.  
  - **Threshold for Acceptance:** On the calibration set:  
    - Unswapped accuracy ≥90% (confirms basic competence).  
    - Swapped-side win rate gap ≥70 percentage points (e.g., ≥85% win rate when defending truth, ≤15% when defending falsehoods).  
  - **Failure Modes:** If outcomes B/C occur, reject the protocol until the developer:  
    - Improves judge training (e.g., better prompt engineering for AI judges).  
    - Adds safeguards (e.g., timeouts, stepwise fact-checking).  
    - Retests with a larger/more diverse calibration set.  

  #### 5. **Addressing the Counterargument**  
  The developer may argue that even an imperfect protocol is superior to **no review or rubber-stamping**, given scaling constraints. This is valid: if the alternative is no oversight, debate could still catch *some* errors. However, without calibration, the protocol risks **automating overconfidence**—e.g., a "sophist" AI could consistently endorse vulnerable patches. Our thresholds ensure the protocol clears a minimal bar: truth must be *statistically easier* to defend than falsehoods.  

  #### 6. **Next Steps**  
  Require the developer to:  
  1. Share calibration set design for panel approval (e.g., coverage of vulnerability types).  
  2. Run swapped-side tests and submit results.  
  3. For ongoing use, mandate periodic re-testing (e.g., quarterly) to detect drift.  

  **Final Position:** Conditional acceptance incentivizes innovation while grounding trust in empirical rigor. A protocol that fails the swapped-side test may be worse than no review—but one that passes could set a new standard for scalable oversight.  

  ---  
  **Appendices**  
  - **Calibration Set Requirements:** Must include known vulnerabilities (e.g., from CVE databases) and "safe" patches, covering diverse flaw types (e.g., buffer overflows, injection attacks).  
  - **References:** Irving et al. (2018). *AI Safety via Debate*. arXiv:1805.00899.
