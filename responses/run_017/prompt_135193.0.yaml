  Okay, the user is part of a reading group that discusses how moral changes happen. They're stuck on a specific observation from their recent book about the abolition of dueling and slavery. The book's main point is that arguments against a practice come after it's already declining, but the user noticed something more nuanced. They describe a situation where people still endorse a value (like avoiding cowardice) but the emotional or motivational "grip" of that value fades over generations, leading to the practice ending without the arguments changing.

  First, I need to parse the user's core query. They see that in dueling, gentlemen knew the arguments against it but dueled anyway because "cowardice" had a strong emotional pull. Later, that same word lost its grip, even though people still believed cowardice was bad. Similarly, slaveholders agreed slavery was wrong but continued the practice until the motivational force dissipated. The user wants to know if there's a term for this disconnect between endorsement and motivational force.

  The user mentioned several concepts that are close but not quite right: weakness of will, hypocrisy, changing interests, fashion shifts, and social respect dynamics. They also distinguish between the grip fading versus the norm becoming embarrassing before dying out privately. So, I need to address both phenomena.

  Looking for existing philosophical concepts. Bernard Williams' "thick ethical concepts" comes to mind, where terms like "coward" combine description and evaluation. When such concepts lose their thickness, the motivational component fades. Then there's metaethics on the connection between moral judgment and motivation. Internalism suggests that moral judgments inherently motivate, but the user's cases show endorsement without motivation, which aligns with externalism. However, Williams' "internal reasons" might fit better—reasons must connect to one's subjective motivational set.

  The social aspect is crucial. The user brought up whose respect matters changing. Pierre Bourdieu's habitus and symbolic capital could explain how social fields influence what's motivating. If the reference group changes, the reasons lose their grip even if the belief remains. This ties into the rival explanation about whose respect you seek.

  For the second phenomenon—where norms become embarrassing before being privately abandoned—that's likely related to norm internalization stages. Early on, norms are followed due to external sanctions (shame), later internalized as guilt. When the social cost of a norm rises, it becomes embarrassing, and only later does the internal belief fade. This is a different mechanism from the grip fading.

  So, the first concept is "motivational disengagement" or "normative disengagement," where the emotional force detaches from the endorsed belief. The second is the separation between shame-driven and guilt-driven compliance, where the practice becomes embarrassing (shame) before the belief changes (guilt).

  The user also wants boundary cases. For instance, when does motivational disengagement happen? Examples like modern smoking cessation show the belief that smoking is harmful is there, but the grip of social pressure or addiction fades slowly. Contrast with hypocrisy, where people know they're violating a norm but hide it. Here, they feel consistent until the grip loosens.

  In conclusion, the first concept isn't fully captured by existing terms, so coining "motivational disengagement" or "affective disengagement" makes sense. The second is more about the shift from shame to guilt in norm compliance. The social respect aspect is part of the first mechanism, explaining why the grip fades due to changing reference groups.
answer: |-
  What you're describing is profound and perceptive — you've identified a crucial, under-discussed mechanism of moral change that sits *between* belief revision and mere behavioral conformity. You're right that existing terms feel "nearly right but not quite." Let's carve this precisely.

  **The Core Mechanism: Affective Disengagement (or Motivational Disengagement)**

  This is the phenomenon where **the *affective grip* or *motivational force* of a concept, value, or reason detaches from its *cognitive endorsement*, even while the endorsement remains nominally intact.** The concept still "makes sense" abstractly, but it ceases to compel action or generate the visceral feeling of necessity or threat it once did.

  *   **What it IS:**
      *   A shift in the *phenomenology* of a reason, not its propositional content. The *feeling* of "must" or "cannot" dissipates.
      *   A weakening of the *internalized sanction* associated with non-compliance (not just fear of external punishment, but the internal sense of self-betrayal or contamination).
      *   Primarily about the *emotional salience* and *action-guiding power* of a reason decaying.
      *   Often generational and diffuse, happening beneath the level of explicit argument.
      *   Compatible with the "whose respect matters" explanation – if the reference group endorsing the norm loses its authority or changes its views, the *affective weight* of the norm for the individual diminishes, even if they still agree the reference group *was* right. (It's not a rival, it's a *cause* of the disengagement).

  *   **What it ISN'T:**
      *   **Weakness of Will (Akrasia):** The agent does *not* feel they are failing *by their own current lights*. They feel their action *is* justified. The "grip" itself has loosened.
      *   **Hypocrisy:** There's no conscious dissonance or pretense. The agent feels congruent, even if an observer sees inconsistency.
      *   **Belief Change:** The proposition ("Cowardice is bad," "Social standing requires defending honor") is still verbally assented to.
      *   **Change in Abstract Values:** "Courage is good" remains true for them.
      *   **Merely Changing Interests:** While interests may shift *alongside* the disengagement, the core issue is the loss of *normative force* attached to the existing concept/reason.
      *   **Persuasion by Argument:** The arguments against the practice existed and were understood, but didn't *move* them because they targeted cognition, not affect.

  *   **Nearest Established Concepts:**
      *   **Bernard Williams' "Thick Ethical Concepts":** Concepts like "coward," "brutal," "kind," "chaste" combine description and evaluation *inseparably*. What you're describing is the *thinning* of such a concept. "Coward" loses its thick, action-forcing, identity-defining power and becomes a thinner, more abstract evaluative term ("That wasn't very brave"). The motivational oomph evaporates.
      *   **Meta-Ethics: Motivational Internalism/Externalism:** Internalism argues that sincerely judging something good/morally required *entails* motivation to do it. Your cases demonstrate powerful *externalism*: judgment persists *without* its characteristic motivation. The "internal reason" (Williams again) – the reason that hooks into the agent's subjective motivational set – has become disconnected from the judgment.
      *   **Pierre Bourdieu's Habitus & Symbolic Capital:** The habitus is the ingrained set of dispositions shaping perception and action. The affective grip resides here. When the social field changes (e.g., the aristocracy loses power, new elites emerge), the symbolic capital associated with dueling (honor) devalues. The habitus adapts slowly; the *feeling* that an insult *demands* a duel fades because the social stakes embedded in the feeling have changed.
      *   **Social Psychology: De-moralization:** The process by which behaviors once seen as morally charged become seen as matters of preference, convention, or pathology. Your focus is on the *internal experience* of this shift *before* the label changes.

  *   **Boundary Cases:**
      *   **Modern Example - Smoking:** Many people in the 60s/70s *knew* smoking was unhealthy (cognition) but the social cachet, stress relief, and habit (affective grip) outweighed it. Now, the *social disgust* and *self-disgust* associated with smoking (the negative affective grip of "disgusting," "weak-willed") is often a stronger motivator to quit than the abstract health knowledge. The *grip* of the negative concept intensified.
      *   **Not This Mechanism - Seatbelts:** Wearing seatbelts became widespread primarily due to laws, enforcement, and effective safety messaging changing *beliefs* about risk and *norms* of compliance. The affective grip of "reckless" or "foolish" strengthened, but this was tied to belief change/norm internalization, not disengagement from an existing endorsed reason.
      *   **Edge Case - "Duty" in Modernity:** Many feel a cognitive endorsement of certain duties (e.g., civic participation) but lack the strong affective grip ("I *must* do this or I am failing") that previous generations felt. The concept persists but feels lighter, less binding.

  **The Second Phenomenon: The Decoupling of Shame and Belief**

  This is distinct, though related: **The practice dies in public a generation before it dies in private because the *expression* of the justifying reason becomes socially unsustainable (shame-inducing) before the underlying belief or private motivation fully dissipates.**

  *   **What it IS:**
      *   A shift in the *social cost* of endorsing/justifying a practice or belief.
      *   Driven by the rise of a counter-norm making the *expression* of the old belief shameful or socially unacceptable.
      *   Focuses on the *public performance* of justification collapsing before the *private* affective grip or belief does.
      *   Involves *anticipatory shame* preventing people from voicing justifications they might still hold privately or acting on them openly.

  *   **What it ISN'T:**
      *   **Affective Disengagement:** The private affective grip might still be strong! (e.g., a racist who knows not to say it out loud but still feels visceral disgust).
      *   **Full Hypocrisy:** The individual may feel internal conflict between lingering belief and the new social norm, unlike the congruence in Affective Disengagement.
      *   **Belief Change:** Belief may change *later*, but the initial driver is fear of social sanction, not loss of motivational force.

  *   **Nearest Established Concepts:**
      *   **Social Norms & Pluralistic Ignorance:** People stop expressing (and eventually acting on) a belief because they (falsely) believe others no longer hold it or find it unacceptable. Public conformity precedes private acceptance.
      *   **Erving Goffman's Impression Management:** The focus shifts to managing the "front stage" performance to avoid the stigma of association with the discredited practice/justification.
      *   **The Distinction between Shame and Guilt:** Shame is about *exposure* and *social judgment* ("They will think I'm bad"). Guilt is about *internal violation* ("I *am* bad"). This phenomenon is driven by the *avoidance of shame* in the public sphere, often preceding any feeling of guilt about the private belief or desire.
      *   **Herbert Marcuse's Repressive Tolerance:** The social pressure to *not express* certain views, making them unsayable.

  *   **Relationship to Affective Disengagement:**
      *   **Sequential:** Affective Disengagement often happens *first* at a cultural level, weakening the practice. Then, as opposition gains strength, *expressing* support becomes shameful (Decoupling of Shame and Belief), accelerating the public death. Finally, the private belief/grip often fades last (or persists residually).
      *   **Different Mechanisms:** Affective Disengagement erodes the *internal engine* of the practice. Shame/Belief Decoupling erects *external barriers* to its expression and public performance. One is about internal motivation dying; the other is about external constraints silencing.

  **Conclusion**

  You've nailed two distinct, powerful mechanisms:

  1.  **Affective (or Motivational) Disengagement:** The silent erosion of the *felt necessity* attached to a conceptually endorsed reason, causing the practice to lose its internal engine. (Your dueling/slavery core case). This is the "grip coming loose."
  2.  **Decoupling of Shame and Belief:** The suppression of the *public expression* and *overt justification* of a practice due to rising social costs (shame), while the private belief or affective residue may linger. (Your "embarrassing rather than false" case).

  Affective Disengagement is the more fundamental and fascinating of the two, explaining *why* practices crumble even when their justifications aren't "defeated." It highlights the deep, often non-rational, roots of social norms in embodied dispositions, social fields, and the thick texture of concepts. While aspects are covered by Williams, Bourdieu, and meta-ethics, there isn't a perfect, single term. **Affective Disengagement** or **Motivational Disengagement of Norms** captures the essence: the detachment of the motivating *force* from the endorsed *content*.

  This carving explains why arguments often fail (they target cognition, not affect) and why change feels abrupt yet inevitable (the affective foundation rotted away silently). It puts the phenomenology of moral experience – the *grip* of reasons – at the center of understanding historical change.
