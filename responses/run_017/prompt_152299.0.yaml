prompt: |-
  I'm a 4th-year PhD student, mostly formal epistemology with a bit of phil physics, and I've got something like two years of dissertation time left plus (fingers crossed) a first postdoc. I want to spend them on the problem of old evidence rather than on something safer, but I can't figure out which part of it is actually worth the years. The set-up I assume we agree on: you already know E, so P(E) = 1, so conditioning on E can't bump P(T) — and yet the perihelion of Mercury sure looked like it confirmed general relativity. Whatever the fix is, it has to be reachable by someone with probability theory, a bit of modal logic, and no real physics.

  Here's my own provisional map, which might definately be junk. I think there are three different ways evidence can be old, and I suspect they're different problems wearing the same label:

  (1) temporal oldness — you believed E before you ever had T;
  (2) construction oldness — E was among the things you were staring at when you built T, so the fit is no surprise (the accommodation vs prediction thing);
  (3) derivation oldness — you had T and you had E, and the only thing that's new is that someone worked out that T entails E.

  On top of that there's an axis I'm much less sure about: whether this is a problem for a logic of confirmation (some relation between T, E and background) or for a norm of updating for agents who aren't logically omniscient. Those feel like genuinely different projects, and I think people slide between them.

  What I actually want is an agenda, not a survey. Rank the open questions here for someone in my position — two years, formal toolkit, no physics — and defend the ranking: which questions are upstream of which, which are tractable with the tools I have, which are neglected relative to how much depends on them, and which are traps that look deep but whose answer wouldn't change anything downstream. If my three-way taxonomy is the wrong way to carve the space, say what the right carving is and why the carving changes the order.

  Two things I'd especially like weighed. First, my pet suspicion: that the puzzle is an artifact of reading P(E) = 1 as a credence you actually still have, when old evidence is really evidence you have a lossy memory of — so the right treatment might be a memory-or-recall model rather than a confirmation-theoretic one. Is that a research program or a dead end, and where does it sit in the ordering? Second, how much of the value here is internal to Bayesianism (patching a technical bug in a framework) versus exportable: the same structure shows up whenever a model is fitted to data and the same data is then cited back as evidence for it (double dipping, post-hoc theorizing in the replication-crisis literature), and whenever an analyst already has all the data on file and then comes up with a hypothesis that fits it. Should the export question drive the agenda, or is chasing applications a distraction from getting the core problem right?

  And tell me what would move things: what result, argument, or empirical finding in the next couple of years would move a question up or down your list.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a 4th-year PhD student in formal epistemology with some philosophy of physics, focusing on the problem of old evidence. They have about two years left for their dissertation and a potential postdoc. They want to tackle this problem but are unsure which aspect is worth the effort. They provided their own taxonomy of old evidence—temporal, construction, and derivation oldness—and are concerned about whether the issue is about confirmation logic or updating norms for non-logically omniscient agents.

  First, I need to understand their main concerns. They want an agenda, not a survey. So they need priorities: which questions are upstream, tractable, neglected, or traps. They also have two specific points: their pet idea about memory/recall and the export value of solving old evidence to other fields like avoiding double-dipping in scientific practices.

  Let me break down their taxonomy. Temporal oldness is about when the evidence was learned relative to the theory. Construction oldness involves accommodating existing data when building the theory. Derivation oldness is realizing the logical connection later. These distinctions make sense, but maybe they're not the best way to frame the problem. The user is worried that these might be different issues under the same name. 

  Then there's the axis between confirmation logic and updating norms. That's crucial because the logical relation (e.g., how T confirms E) vs. how agents update their beliefs when they lack logical omniscience are different projects. The user mentions people sliding between them, which can cause confusion. 

  Their pet idea about memory being lossy instead of P(E)=1 is interesting. If evidence isn't perfectly recalled, then P(E) isn't 1, which avoids the problem. But is this a core solution or a workaround? They need to know if this is a dead end or a viable research path. 

  Regarding export value, they want to know if solving old evidence can address issues like double-dipping in empirical sciences. If the solution can be applied there, that adds significant value beyond Bayesianism. But they're concerned if chasing applications might distract from the core problem. 

  Now, to prioritize. I should consider what's foundational. The logical omniscience angle seems upstream because if agents can't immediately see all logical connections, then derivation oldness is a subset of that. Solving the updating norm for logical learning could address derivation and maybe other types. That seems like a high-leverage point. 

  Construction oldness relates to accommodating data. This might tie into issues like overfitting or double-dipping, which have export potential. But it's more specific. Temporal might be the least problematic if logical and construction aspects are handled. 

  The user's memory model idea could fit under temporal oldness. If memory isn't perfect, P(E) < 1, so conditioning works. But this might be a patch rather than a deep solution. However, it could link to cognitive science and replication crisis issues, which adds export value. So maybe it's worth exploring but not as foundational as logical omniscience. 

  For export, the double-dipping problem in science is a real-world application. If the solution to old evidence can formalize why post-hoc fitting is problematic, that's a big win. So construction oldness might be key here. Prioritizing this could make the work impactful beyond philosophy. 

  Tractable with their tools: They have probability, modal logic, no physics. Logical omniscience has formal frameworks like Bayesian networks or dynamic epistemic logic. That fits their toolkit. Construction oldness might need more statistical concepts like overfitting, but still manageable. Memory models could involve probabilistic models of recall, which is doable. 

  Neglected areas: Logical omniscience gets attention but often not tied to old evidence. Construction oldness in the context of replication crisis is underexplored. Their memory idea is novel but not deeply investigated. 

  Traps: Relying on counterfactual credences (like what P(E) would be if not known) is messy. Also, solutions that only work for temporal oldness without addressing derivation might not solve the core issue. 

  So ranking: Logical omniscience first, then construction, then derivation. Memory model could be part of temporal or separate. Exportability makes construction high priority. 

  What would move things? A formal model linking logical learning to confirmation, or showing how construction oldness causes overfitting in real data. Empirical results on how recall affects evidence weighting could boost the memory model. 

  I should structure the reply to first redefine the taxonomy, then prioritize, address their pet idea and export, and end with what could shift priorities. Make sure to justify why each rank is assigned, considering upstream impact, tractability, neglect, and traps.
answer: |-
  Here's a prioritized research agenda for your 2-year dissertation + postdoc window, grounded in your formal toolkit and the need for high-impact, tractable progress on the old evidence problem. I've reorganized your taxonomy to better reflect logical dependencies and leverage points, then ranked questions based on **upstream impact**, **tractability**, **neglect**, and **export potential**.

  ### Revised Problem Carving (Why Your Taxonomy Needs Adjustment)
  Your three types collapse under two more fundamental axes:  
  1. **Source of "Oldness"**:  
     - **Logical Discovery** (subsumes your *derivation oldness*): The novel element is recognizing *T ⊢ E* (logical learning).  
     - **Evidence Handling** (subsumes *temporal* and *construction* oldness): How *E* was epistemically processed pre-*T* (memory reliability, cognitive bias, accommodation practices).  
     *Why this carving?* Derivation issues stem from agents' *logical limitations*, while temporal/construction issues stem from *how evidence is encoded or used*—these require distinct solutions. Conflating them obscures intervention points.  

  2. **Problem Frame**:  
     - **Confirmation Logic**: Static relation between *T*, *E*, *K* (background knowledge).  
     - **Bounded Agent Updating**: Dynamics of belief revision under cognitive constraints.  
     *Crucial insight*: The "bug" in Bayesianism arises *only* when we model real agents (bounded) but impose idealizations (logical omniscience, perfect recall). Solutions must target this mismatch.  

  ---

  ### Prioritized Research Questions (Ranked for Impact/Efficiency)
  **1. Logical Omniscience as the Keystone Problem**  
     - **Question**: *How can confirmation measures handle agents who discover* T ⊢ E *after adopting T?*  
     - **Why #1**:  
       - **Upstream**: Solves derivation-oldness *and* exposes flaws in static confirmation theories (e.g., Glymour's problem).  
       - **Tractable**: Use dynamic epistemic logic (DEL) or Bayesian networks with "logical learning" operators. Garrabrant's logical induction offers tools.  
       - **Neglected**: Most solutions (e.g., counterfactual credences) are hacks—not integrated with learning theory.  
       - **Export**: Directly applies to AI alignment (how AIs confirm hypotheses with stored data) and legal reasoning (re-evaluating evidence post-new-theory).  
     - **Goal**: Propose a dynamic confirmation measure where *learning* T ⊢ E *boosts P(T)*, even if P(E)=1.  

  **2. Accommodation vs. Prediction as a Special Case of Evidence Corruption**  
     - **Question**: *Does using E to construct T corrupt its evidential value by inducing overfitting?*  
     - **Why #2**:  
       - **Upstream**: Explains *construction-oldness* without new machinery—it's about *how E was used*, not age.  
       - **Tractable**: Formalize "double-dipping" using statistical learning theory (e.g., PAC-Bayes bounds). Show accommodated evidence *should* be discounted if *T*'s complexity wasn't penalized during construction.  
       - **Neglected**: Philosophers debate prediction vs. accommodation; statisticians *quantify* overfitting risk. Bridge them.  
       - **Export**: Answers replication crisis concerns—your model directly critiques p-hacking/HARKing.  
     - **Goal**: Prove accommodated *E* confirms *T* less than predicted *E* iff *T*'s parameters were tuned to *E* without penalty.  

  **3. Memory/Recall as a Solution to Temporal Oldness (Your Pet Idea)**  
     - **Question**: *Does imperfect recall of E explain why old evidence can confirm?*  
     - **Why #3**:  
       - **Tractable**: Model memory as a noisy channel (e.g., *P(recalled E | true E) < 1*). Use Bayesian networks with recall nodes.  
       - **Neglected**: Memory is underexplored in formal epistemology (vs. psychology).  
       - **But**: Less upstream—it solves only *temporal* cases, not derivation/construction. Risks being a *patch* not a *solution*.  
     - **Opportunity**: Link to "forgotten evidence" edge cases (e.g., *E* stored but not accessed pre-*T*).  
     - **Goal**: Show agents with imperfect recall *can* condition on *E* non-trivially.  

  **Trap**: **Counterfactual Credence Approaches**  
     - Why avoid: Requires impossible worlds ("What if I didn't know *E*?"). Untestable, prone to paradoxes, and doesn't address derivation cases.  

  ---

  ### Your Two Key Concerns: Weighed  
  **1. Memory/Recall Model**  
     - **Verdict**: **Research-worthy but not sufficient alone.**  
       - *Pro*: Elegantly handles temporal cases, integrates cognitive science.  
       - *Con*: Fails if *E* is perfectly recorded (e.g., digital data). Derivation-oldness remains untouched.  
       - **Agenda Placement**: Develop it *after* logical learning (Q1). Use it to show *temporal* oldness reduces to evidence corruption (Q2) via recall uncertainty.  

  **2. Export Value (Double-Dipping, Replication Crisis)**  
     - **Verdict**: **Should drive your agenda.**  
       - Targeting Q2 (accommodation) delivers immediate export: a formal criterion to flag when "fitted" data counts as weak evidence.  
       - *Distraction?* No—core solutions *must* generalize. If your fix doesn't work for post-hoc data analysis, it's inadequate for science.  

  ---

  ### What Would Reshape This Agenda?  
  These developments would reprioritize:  
  - **↑ Logical Learning (Q1)**: A breakthrough in logical induction (e.g., tractable algorithms for *partial* logical learning).  
  - **↑ Memory Models**: Empirical results showing scientists' recall of old data degrades predictably (e.g., error rates in replicating own prior analyses).  
  - **↓ Pure Confirmation Measures**: If meta-science shows double-dipping is rare (unlikely), accommodation (Q2) loses urgency.  

  ---

  ### Recommended 2-Year Plan  
  **Year 1**: Tackle Q1 (logical omniscience).  
  - *Milestone*: Dynamic Bayesian model where discovering *T ⊢ E* increases *P(T)*.  
  **Year 2**: Extend to Q2 (accommodation).  
  - *Milestone*: Formal proof that prediction dominates accommodation iff model complexity is unconstrained.  
  **Postdoc**: Explore memory models (Q3) or export (e.g., applying Q2 to metascience).  

  This path delivers a high-impact dissertation (solves the core technical bug via logical learning) and sets up postdoc work with direct interdisciplinary appeal. The tools are in your wheelhouse—no physics needed.
