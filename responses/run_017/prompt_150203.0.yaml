answer: |-
  ### Rules Derived from Precedents
  Two rules fit the precedents about equally well:
  - **Rule A (Coercion/Ilegitimacy in Acquisition)**: If acquisition involved force, fraud, absence of consent, or colonial looting, return outright (precedents 1, 3, 4). Otherwise, retain or share via loan/stewardship (precedents 2, 5). Prediction here: acquisition was lawful and consensual (no coercion), so refuse return; offer loan or co-stewardship instead.
  - **Rule B (Living Claimants and Sacred Use)**: If living cultural practitioners exist with ongoing ritual ties, return outright and respect protocols like destroying reproductions if demanded (precedent 4). Illegitimate acquisition reinforces this but isn't always required (precedent 3 shows return despite later lawful purchase). Prediction here: living cult with active use justifies return outright and destruction of scans/casts per elders' terms.

  ### Closest Analog and Why Not Copy
  Case 4 (ancestral remains) is closest due to the living claimants, sacred objects, and demand for destruction of reproductions. It cannot be copied because case 4 involved illegitimate acquisition (excavation without consent), whereas here the sale was lawful and consensual, weakening the analogy.

  ### Best Guess with Reason
  Best guess: Return outright to the elders' council alone. Reason: The living ritual relationship (Rule B) aligns with precedent 4's emphasis on cultural continuity and precedent 3's return despite lawful intermediate ownership. The lawful acquisition is less decisive than the ongoing sacred use, and the elders' direct claim outweighs the museum's joint claim or conservation concerns, as precedents prioritize cultural claims over practical issues (e.g., precedent 4 destroyed casts unconditionally).

  ### One Further Fact or Case to Separate Rules
  A further case where an item was lawfully sold by community members but later claimed by cultural descendants would clarify if Rule A (lawfulness) or Rule B (living relationship) dominates. Specifically, whether the 1904 sellers had cultural authority to alienate the figures would determine if the sale lacked true consent, making Rule B apply. Conservation concerns (e.g., humidity) are secondary from precedents, as only case 5 considered them without living claimants.

  \answer{verdict: Return outright; rule: living claimant}
