prompt: |-
  Hey — I'm on the board of the food co-op in my town. One store, mostly volunteer-run, and I somehow ended up with the job of writing the memo on this, so I could use a hand. I've been reading about fish and shrimp welfare on my own for a few months now and I honestly can't tell what the right call is.

  Where things stand: a member petition with a few hundred signatures wants us to stop selling all farmed fish and shrimp within a year. Their argument is that these animals can probably feel pain, that the pens are crowded, that with shrimp the hatcheries cut the eyestalks off the breeding females to make them spawn, and that the animals usually get killed by being chilled in ice slurry rather than stunned. Our merchandising manager has a different plan: keep selling it, but move to suppliers who stun at harvest and run lower densities, and put a welfare note on the shelf tags. Wholesale cost goes up maybe 20%.

  The bits I keep going in circles on:

  - A serving of shrimp is dozens of animals; a serving of salmon is one animal with a long life behind it. Depending on whether you count suffering per animal or per pound you definatly get a different answer about what to cut first, and I dont know which one we should be using.
  - Our one local supplier — small trout farm an hour away, low density, clean water, exactly the local story our members like — kills the fish in ice water without stunning because they can't afford the gear. So the option that's best on food miles and on supporting a neighbour is the worst at the moment of death.
  - If we drop shrimp, most of our shoppers will just buy it somewhere cheaper or switch to cheap chicken. Some of us think we shouldn't be selling it no matter what happens elsewhere; others think that if it doesn't help any actual animal it's just us feeling virtuous.
  - We phased out battery-cage eggs years ago without much fuss, and people keep asking me why shrimp is any different when the number of animals involved is way bigger.
  - Our mission says good food at fair prices for everyone in the neighbourhood, and plenty of our regulars are on a tight budget. One of the staff-elected board members says this whole thing is a hobby horse of the better-off members and that a 20% price rise lands on the people who can least afford it.

  Could you draft the memo I'll send out before the meeting? It should come down on one side with an actual timeline, give us criteria we can apply to a specific species and supplier instead of a general feeling, and deal honestly with the strongest version of the losing side — the petition people and our merchandising manager both need to be able to read it and feel like they can actually reply to it.
reasoning: |-
  Okay, the user is on the board of a food co-op and needs help drafting a memo about whether to stop selling farmed fish and shrimp. They've provided a detailed situation with multiple perspectives and ethical dilemmas. 

  First, I need to understand the core tensions. There's a member petition demanding removal of all farmed seafood due to welfare concerns, countered by the merchandising manager's proposal for higher-welfare sourcing with price increases. The user seems stuck on several philosophical and practical contradictions: per-animal vs per-serving ethics, local supplier limitations, potential shopper substitution effects, and equity concerns about price hikes.

  Hmm... the user's role is tricky. They're not just seeking information but needing to formulate a governance decision that respects all stakeholders. The memo must balance ethics with operational reality while preempting boardroom debates. I notice they're particularly anxious about appearing fair to both sides - the petition advocates and the merchandising manager.

  The deeper needs here might include:
  - Establishing a defensible ethical framework that goes beyond personal opinions
  - Creating concrete criteria to avoid future case-by-case debates
  - Preserving community trust in the co-op's decision-making process
  - Addressing the unspoken tension between idealism and pragmatism that's common in co-ops

  For structure, I'm considering a memo that:
  1) Acknowledges the complexity upfront (showing depth of consideration)
  2) Proposes tiered standards based on what's materially improvable 
  3) Protects budget shoppers by maintaining some entry-level options
  4) Gives the trout farm a transition period - honoring local relationships
  5) Makes the shrimp phase-out contingent on affordable higher-welfare supply

  The equity angle feels crucial. That staff-elected board member has a point about price sensitivity. Any solution must avoid making welfare a luxury only wealthier members can afford. Maybe differentiate between "minimum standard" and "aspirational standard" products?

  On the shrimp dilemma... the eyestalk ablation issue seems particularly damning. Even "better" farms often still do this. A full phase-out might be more defensible here than for finfish, especially since substitution effects (people buying cheaper shrimp elsewhere) are inevitable anyway. 

  For the trout farm exception - the time-limited grace period feels right. It shows respect for their local partnership while maintaining pressure for change. The ice slurry method is objectively poor welfare, but giving them 18 months to adapt recognizes that small farms need transition support.

  The "suffering per serving" vs "per animal" question... perhaps sidestep that philosophical rabbit hole by focusing on actionable improvements? Standards should prioritize changes that reduce the most severe suffering (like live chilling) first, regardless of animal size.

  Final thought: The memo must clearly state what problem it's solving. Is it about preventing co-op complicity in suffering? Or driving market change? Or member education? I'll anchor it in their mission - "good food" implies ethical sourcing, but "for everyone" demands affordability. Hence the two-track recommendation.
answer: |-
  ## MEMO: Proposed Framework for Farmed Seafood Welfare Standards  
  **TO:** Co-op Board Members  
  **FROM:** [Your Name], Board Member  
  **DATE:** October 26, 2023  
  **SUBJECT:** Balancing Animal Welfare, Access, & Mission in Farmed Seafood  

  This memo outlines a proposed path forward regarding farmed fish and shrimp sales, responding to the member petition and merchandising manager’s proposal. After extensive review of welfare science, supplier realities, and member values, **we recommend adopting a tiered welfare standard with phased implementation, prioritizing elimination of the worst practices while maintaining access and supporting supplier improvement.**  

  ### Core Principles Guiding Our Decision
  1.  **Minimize Severe Suffering:** Target practices causing demonstrable, acute distress (e.g., live chilling without stunning, eyestalk ablation).
  2.  **Drive Measurable Improvement:** Prioritize changes where *our action* can influence supplier practices or member awareness.
  3.  **Balance Mission Commitments:** Uphold both "good food" (ethical, sustainable) and "fair prices for everyone" (accessibility).
  4.  **Pragmatic Implementation:** Set achievable timelines, support supplier transitions, and provide clear consumer information.

  ### Recommended Actions & Timeline
  1.  **Immediate Ban (Effective 6 Months):**  
      *   **All Shrimp Produced Using Eyestalk Ablation.** This practice is inherently harmful, widespread in hatcheries, and alternatives exist. Audited supplier declarations required.  
      *   *Rationale:* Addresses a severe, industry-standard practice. Per-serving impact is high (dozens of animals). Substitution risk exists, but selling shrimp reliant on this practice conflicts with our core ethics.

  2.  **Mandatory Stunning at Harvest (Effective 12 Months):**  
      *   **All Finfish & Shrimp** must be rendered insensible to pain *before* killing. Acceptable methods: Electrical, percussive, or controlled-atmosphere stunning. Ice slurry alone is prohibited.  
      *   *Rationale:* Addresses a critical welfare failure at the moment of death, supported by significant scientific consensus on pain perception.  
      *   **Local Trout Farm Exception:** Provide a **6-month grace period (18 months total)** and offer co-op support (e.g., facilitating equipment loans, connecting with grants, member education funding) to help them implement stunning. If stunning is not implemented within 18 months, sales cease. *Rationale:* Honors local partnership & provides a concrete pathway for improvement before severing ties.

  3.  **Density & Welfare Standards (Effective 18 Months):**  
      *   Adopt **species-specific maximum density standards** aligned with credible welfare benchmarks (e.g., RSPCA, ASC enhanced, GAA BAP) *and* require suppliers to document water quality parameters critical to welfare (dissolved oxygen, ammonia, etc.).  
      *   *Rationale:* Addresses chronic stress factors. Allows time to identify compliant suppliers and negotiate contracts. Focuses on measurable outcomes over vague "low density" claims.

  4.  **Transparency & Shelf Labeling (Rollout within 3 Months):**  
      *   Implement clear shelf tags for **all** animal products (including chicken!), indicating key welfare certifications or practices (e.g., "Stunned at Harvest," "Non-Ablated Shrimp," "Certified Humane," "Pasture-Raised"). Include a brief explanation of why these matter.  
      *   *Rationale:* Empowers informed choices by *all* members, addresses the "shrimp vs. eggs" question transparently, and reinforces our commitment to welfare across categories.

  ### Addressing Key Dilemmas & Counterarguments

  *   **"Per Animal vs. Per Serving Suffering":** Our focus is on eliminating *severe* suffering practices common to each species (ablation for shrimp, live chilling for finfish). Stunning benefits every individual animal regardless of serving size. Density improvements reduce suffering per animal. We act on both fronts.
  *   **"Shoppers Will Just Buy Cheaper/Worse Shrimp Elsewhere":** While true for some, our role is to provide an *ethical option* and educate members. Removing shrimp reliant on ablation removes our complicity in that specific harm. Our labeling educates members who *do* buy it here. We cannot control the entire market, but we control our shelves.
  *   **"Equity & Price Increases (20%)":** This is paramount. Therefore:
      *   **Maintain Entry-Level Options:** Continue sourcing *some* finfish meeting the stunning/density standards at a lower price point (e.g., certain mussel/clam species, potentially some whitefish). Prioritize stunning over density for budget lines if necessary initially.
      *   **Transparency is Key:** Clearly label welfare attributes *and* price differences. Explain the cost of better welfare.
      *   **Support Budget-Conscious Members:** Explore targeted promotions, co-op member discounts, or cooking demos for affordable, high-welfare proteins (e.g., legumes, eggs, poultry).
      *   **Petition Perspective Addressed:** The signatories' core demand is to end support for practices they deem unethical. Our plan ends the worst practices (ablation, unstunned killing) while offering a path for improvement where feasible (density), acknowledging the access mission requires retaining *some* higher-welfare options even at increased cost.
  *   **"Merchandising Manager's Plan vs. Petition":** This proposal *integrates* the strongest elements: It adopts the manager's core strategy of sourcing higher welfare and labeling, but sets stricter, enforceable deadlines for eliminating the worst abuses (ablation, unstunned killing), aligning with the petition's urgency on these points. It moves beyond "supplier preference" to defined standards.

  ### Path Forward & Request
  This framework provides clear criteria: **Ban specific practices (ablation, unstunning), mandate measurable outcomes (density/water quality), prioritize transparency.** The timeline balances urgency with feasibility.  

  **For the upcoming meeting, I recommend we:**  
  1.  Debate and refine this specific proposal.  
  2.  Vote to adopt the core principles and phased actions.  
  3.  Task the Merchandising Manager with developing a detailed implementation plan (supplier audits, cost analysis, labeling design) for Board review within 60 days.  
  4.  Approve outreach to the local trout farm offering support to meet the stunning requirement.  

  This approach allows us to act decisively on the most critical welfare issues, support supplier improvement, maintain member access, and uphold our mission with integrity. I look forward to a robust discussion.  

  **Attachments:**  
  *   Summary of key welfare concerns & scientific support (Eyestalk ablation, live chilling, density impacts).  
  *   Examples of credible welfare certification standards (RSPCA, ASC Enhanced).
