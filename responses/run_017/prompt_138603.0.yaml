  Assume the process: 
  - Run Test1. If Test1 is positive, then run Test2. If Test1 is negative, then the product passes and they don't run Test2. 

  We are considering a flagged product (Test1 positive). We have run Test2 and it is positive. We want P(D | Test1=pos, Test2=pos). 

  Since we have both tests, we can compute it without any independence issue. The likelihood for D is the probability of both tests positive given D, which is 0.9*0.9=0.81, and given ~D, 0.1*0.1=0.01. 

  But what if we only had Test1 positive and haven't run Test2 yet? We want to predict Test2. 

  We might then use: P(Test2=pos | Test1=pos, D) = 0.9, and P(Test2=pos | Test1=pos, ~ D) = 0.1. 
  Then P(Test2=pos | Test1=pos) = 0.9 * P(D|Test1=pos) + 0.1 * P(~D|Test1=pos)

  This does not assume independence of the tests given Test1 positive and D. It uses the conditional independence given D. 

  To see the collider effect, we need to condition on a common effect. 

  Example: 

   Let A be the event that a person is a great artist.
   Let B be the event that a person is a great physicist.
   Let F be the event that the person is famous.

  Assume that A and B are independent in the population. 
  - P(A) = 0.01
  - P(B) = 0.01
  - P(F | A, B) = 1.0  (if you are both, you are definitely famous)
  - P(F | A, not B) = 0.5
  - P(F | not A, B) = 0.5
  - P(F | not A, not B) = 0

  Now, we are conditioning on F (the person is famous). We wish to know the probability that they are both an artist and a physicist: P(A and B | F).

  Heuristic argument: "There's no reason to think that being a great artist and a great physicist are not independent. So let's multiply: P(A and B) = P(A) P(B) = 0.0001. And then condition on F."

  But that's not how to condition on F.

  Correct computation:

  P(A and B | F) = P(F | A, B) P(A, B) / P(F)

  But P(A, B) = P(A) P(B) = 0.01 * 0.01 = 0.0001   (since independent)
  P(F | A, B) = 1
  P(F) = P(F | A, B) P(A, B) + P(F | A, not B) P(A, not B) + P(F | not A, B) P(not A, B) + P(F | not A, not B) P(not A, not B)
  = 1 * 0.0001 + 0.5 * (0.01 * 0.99) + 0.5 * (0.99 * 0.01) + 0 * (0.99*0.99)
  = 0.0001 + 0.5 * 0.0099 + 0.5 * 0.0099
  = 0.0001 + 0.00495 + 0.00495 = 0.01

  So P(A and B | F) = 0.0001 / 0.01 = 0.01

  Now, the heuristic might try: since we are conditioning on F, we might think about the conditional probability of A and B given F. If they are to be independent given F, then P(A and B | F) = P(A|F) P(B|F).

  Let's compute these:

  P(A|F) = P(F|A) P(A) / P(F)
  P(F|A) = P(F | A, B) P(B|A) + P(F | A, not B) P(not B|A) = 1 * 0.01 + 0.5 * 0.99 = 0.01 + 0.495 = 0.505
  So P(A|F) = 0.505 * 0.01 / 0.01 = 0.505
  Similarly, P(B|F) = 0.505
  If independent, P(A and B | F) = 0.505 * 0.505 = 0.255025

  But we know it is 0.01. So they are not independent given F.

  The heuristic applied without accounting for the conditioning on F would be: since A and B are independent in the world, then in any context, we can multiply. But conditioning on F (which is a common effect of A and B) makes them dependent.

  So now, two people might agree that A and B are wire-free independent. But when conditioning on F, they might not realize that this induces a dependence. So one person might use the unconditional product to compute the conditional probability, leading to 0.0001 for the joint, then condition on F by dividing by P(F) (which this person might also compute assuming independence) and get 0.0001 / 0.01 = 0.01, which happens to be correct in this case. But the other person might try to use the independence given F and get 0.255.

  Alternatively, the heuristic might be applied to the conditional probability: "Given that the person is famous, we have no reason to think that being an artist and being a physicist are linked, so we can multiply the conditional probabilities." That would give the 0.255, which is wrong.

  So let's set the example in the context of a argument about a particular famous person. We know they are famous. We have no other information. We want to know if they are both an artist and a physicist.

  Alice says: "There's no causal connection between being an artist and a physicist, so they are independent. Therefore, the probability that they are both is just the product of the probabilities: P(both | famous) = P(artist | famous) * P(physicist | famous)." She then might estimate P(artist | famous) and P(physicist | famous) from the definition above as 0.505 each, and then multiply to get 0.255.

  Bob says: "We should use the unconditional probabilities and then condition. The unconditional probability of both is 0.0001, and the unconditional probability of being famous is 0.01, so P(both | famous) = 0.0001 / 0.01 = 0.01."

  Alice's method uses factorizing in the conditional distribution given F, while Bob uses the wire-free unconditionally and then conditions.

  Alice gets 0.255, Bob gets 0.01.

  Both applied the presumption of independence sincerely: Alice applied it conditional on F, while Bob applied it unconditionally.

  The number are very different.

  In this case, the filter-proof condition is not met because conditioning on F induces a dependence between A and B, even though they are wire-free independent.

  What the heuristic argument needs is filter-proof independence, which would require that the independence holds conditionally on the background (which includes F). But in this case, it does not.

  So to state the honest way of stating the presumption: 
  It is not enough to have wire-free independence; one must ensure that the conditioning set (which includes the context of how we came to consider the events) does not create a dependence. This is often difficult. A clean default is to explicitly condition on all the factors that are in the background knowledge, but that is usually impractical. The safest way is to build a full causal model that includes the selection pressures and then check for conditional independence given that model.
