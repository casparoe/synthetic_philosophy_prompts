  But since the product is flagged if either is positive, and we know Test1 is positive, then it is flagged regardless of Test2. So P(Test2 positive | Test1 positive, flagged) = P(Test2 positive | Test1 positive). 

  Now, are Test1 and Test2 independent unconditionally? No, because they both depend on D. 

  But conditionally on D, they are independent. So we can compute:

  P(Test2 positive | Test1 positive) = [ P(Test2 positive, Test1 positive) ] / P(Test1 positive)

   = [ P(both positive | D) P(D) + P(both positive | ~D) P(~D) ] / [ P(Test1 positive | D) P(D) + P(Test1 positive | ~D) P(~D) ]

   = [ (0.9*0.9 * P(D) + 0.1*0.1 * P(~D)) ] / [ (0.9 * P(D) + 0.1 * P(~D)) ]

  This does not factor into functions of Test1 and Test2. But it doesn't require independence of Test1 and Test2 conditionally on the flag. In fact, conditionally on Test1 positive, we can compute the posterior on D, and then P(Test2 positive | D) etc.

