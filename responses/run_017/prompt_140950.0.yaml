  **Move (8): Tomas says sampling is about indexical uncertainty, not mechanism.**

  SSA doesn't need a mechanism; it's about not knowing where you are. In the fused case, SSA gives no verdict because all subjects have same evidence (indistinguishable from inside), which is modest. SIA would invent evidence.

