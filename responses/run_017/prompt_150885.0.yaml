     **Q2: What is the source of the agent's deference to the correction channel?**
        - A1: The agent's own uncertainty about the objective
        - A2: A fixed principle in the agent's utility function

     **For A1 (Uncertainty-based):**
        **Q3: Does the agent have an active duty to inform the operator of information that might lead to correction?** (Case b)
           - Yes: Leaf 1: **Uncertainty-Inclusive** (e.g., CIRL)
           - No: Leaf 2: **Uncertainty-Passive**

     **For A2 (Fixed principle):**
        **Q3: Is the agent's deference conditional on its model of the operator's competence?**
           - Yes: 
              **Q4: Does the agent have an active duty to inform?**
                 - Yes: Leaf 3: **Competence-Contingent with Active Informing** (possibly unattractive or unexplored)
                 - No: Leaf 4: **Competence-Contingent without Active Informing**
           - No: 
              **Q4: Does the agent have an active duty to inform?**
                 - Yes: Leaf 5: **Unconditional Deference with Active Informing**
                 - No: Leaf 6: **Unconditional Deference without Active Informing**

  For B (Constraint-based):
     **Q2: Can the agent circumvent the constraints without detection?** (Case a)
        - Yes: Leaf 7: **Brittle Constraints** (unattractive)
        - No: 
           **Q3: What happens when the correction channel is used?**
              - A: The agent ceases operation (shutdown): Leaf 8: **Robust Shutdown**
              - B: Authority is transferred to another operator or system: 
                   **Q4: Is the first agent required to make the successor corrigible?** (Case d)
                      - Yes: Leaf 9: **Robust Transfer with Successor Corrigibility**
                      - No: Leaf 10: **Robust Transfer without Successor Corrigibility**

  We have 10 leaves. We can add two more by splitting on the counterfactual preservation for goal-changing, but we don't have nodes.

  Alternatively, for the fixed principle branch, after Q3, we can ask about counterfactual preservation.

  For example, for Leaf 5 and 6 (unconditional), ask: Does the agent have a reason to preserve the correction channel's efficacy in the long run?
     - Yes: then it's true unconditional.
     - No: then it might not preserve the channel.

  But we are out of nodes.

  Given the constraints, we'll describe the gap in the unoccupied section.

  Leaves:

  1. **Uncertainty-Inclusive**: Named. The agent is uncertain about the objective and actively informs the operator of relevant information. (Occupied)
  2. **Uncertainty-Passive**: Named. The agent is uncertain and does not resist correction, but does not actively inform. (Occupied)
  3. **Competence-Contingent with Active Informing**: No established name. The agent defers only if it deems the operator competent, and actively informs. (Unexplored or unattractive? Why would it inform if it thinks the operator is incompetent? Incoherent? Or unexplored.)
  4. **Competence-Contingent without Active Informing**: Named? For example, some versions of value learning. (Occupied)
  5. **Unconditional Deference with Active Informing**: Named? For example, an agent that values both shutdown and transparency. (Occupied)
  6. **Unconditional Deference without Active Informing**: Named (e.g., utility indifference). (Occupied)
  7. **Brittle Constraints**: Coherent but unattractive. (Occupied as a failure mode)
  8. **Robust Shutdown**: Named in safe interruptibility. (Occupied)
  9. **Robust Transfer with Successor Corrigibility**: This might be named? Or unexplored. (Unexplored or unattractive because it might be hard to enforce)
  10. **Robust Transfer without Successor Corrigibility**: This is occupied but unsafe.

