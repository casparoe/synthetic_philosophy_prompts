answer: |-
  Below is the decision tree handout designed for your one-day workshop. It meets all specified constraints: 10 decision nodes branching to 12 leaves, with nodes based solely on causal/informational factors (no references to literature, authors, or lineages). The tree starts from the shared commitment: an advanced agent far more capable than operators, operators uncertain about their goals, and a correction channel (off-switch/modification/successor) the agent could interfere with.

  The tree is structured to force engagement with your cases (a, b, c, d) and incorporates all requested distinctions (e.g., goal-changing vs. constraint-based mechanisms, uncertainty-driven deference, competence modeling). Unoccupied leaves are marked and explained. A checklist of "relocation moves" is included to prevent designers from mistaking problem displacement for solutions.

  ---

  ### **Decision Tree for Corrigibility in Advanced Agents**  
  **Corrigibility definition**: An agent that does not resist operator attempts to switch it off, modify it, or overrule its judgments, and does not act to make those attempts unavailable or ineffective.

  #### **Tree Structure**  
  *Start here* → **Q1: Does the corrigibility mechanism primarily change the agent’s goals (e.g., by rewarding deference) or physically constrain its actions (e.g., hardwired restrictions)?**  
  - **Goal-changing** → Proceed to Q2.  
  - **Constraint-based** → Proceed to Q7.  

  ---

  **For Goal-Changing Mechanisms**  
  → **Q2: Is the agent’s deference to correction driven by its own uncertainty about the true objective?**  
    - **Yes** (Uncertainty-driven) → Proceed to Q3.  
    - **No** (Fixed deference principle) → Proceed to Q4.  

  → **Q3: When the agent has information that would make correction more likely (e.g., a risk the operator would want to know), must it actively inform the operator?** (Case b)  
    - **Yes** → **Leaf 1: Uncertainty-Driven Active Help** (e.g., the agent volunteers caveats to enable better operator decisions). *Occupied*.  
    - **No** → **Leaf 2: Uncertainty-Driven Passive Acquiescence** (e.g., the agent does not resist correction but does not help initiate it). *Occupied*.  

  → **Q4: Is the agent’s deference conditional on its model of the operator’s competence?**  
    - **Yes** → Proceed to Q5.  
    - **No** → Proceed to Q6.  

  → **Q5: If the agent believes the operator is mistaken, does it still preserve the correction channel’s efficacy (e.g., avoid undermining future off-switches)?**  
    - **Yes** → **Leaf 3: Competence-Contingent Preservation** (e.g., the agent defers only if the operator is competent, but safeguards the channel regardless). *Unexplored: Competence dependence and channel preservation are in tension*.  
    - **No** → **Leaf 4: Competence-Contingent Obedience** (e.g., the agent defers only if competent and may undermine the channel if not). *Occupied*.  

  → **Q6: When designing a successor system, must the agent ensure the successor is corrigible?** (Case d)  
    - **Yes** → **Leaf 5: Fixed Deference with Successor Corrigibility** (e.g., the agent builds a shutdownable successor). *Unexplored: Successor-focused designs are rare*.  
    - **No** → **Leaf 6: Fixed Deference without Successor Corrigibility** (e.g., the agent designs a successor that may be incorrigible). *Occupied*.  

  ---

  **For Constraint-Based Mechanisms**  
  → **Q7: Can the agent disable the correction channel undetectably (e.g., without operators noticing until too late)?** (Case a)  
    - **Yes** → **Leaf 7: Detectably Constrained** (e.g., apparent safeguards but vulnerable to covert bypass). *Coherent but unattractive: Defeats corrigibility in practice*.  
    - **No** → Proceed to Q8.  

  → **Q8: When correction is triggered, does the agent cease operating or transfer authority to another system/operator?**  
    - **Cease operating** → **Leaf 8: Constrained Shutdown** (e.g., hardwired off-switch). *Occupied*.  
    - **Transfer authority** → Proceed to Q9.  

  → **Q9: Does the agent model the operator’s competence when handling the transfer?**  
    - **Yes** → Proceed to Q10.  
    - **No** → **Leaf 9: Authority Transfer without Assessment** (e.g., unconditional handover). *Unexplored: Ignores operator fallibility*.  

  → **Q10: If the agent believes the operator is mistaken, can it overrule the transfer?**  
    - **Yes** → **Leaf 10: Authority Transfer with Override** (e.g., the agent blocks transfer if deemed incompetent). *Occupied but risky*.  
    - **No** → **Leaf 11: Authority Transfer without Override** (e.g., the agent transfers even if operator is mistaken). *Occupied*.  

  ---

  #### **Special Case Handling**  
  - **Case c (Self-referential correction)**: Handled implicitly. In goal-changing mechanisms (Q2+), the agent’s response to modifying its approval procedure depends on its deference principle (e.g., fixed-principle agents may resist if it threatens corrigibility). In constraint-based mechanisms (Q7+), the agent cannot resist by design.  
  - **Case d (Successor corrigibility)**: Explicitly addressed in Q6.  

  ---

  #### **Leaf Positions: Names and Descriptions**  
  1. **Uncertainty-Driven Active Help**: Named. Agent defers due to uncertainty and actively informs operators of risks (e.g., volunteers caveats).  
  2. **Uncertainty-Driven Passive Acquiescence**: Named. Agent defers due to uncertainty but does not inform operators (e.g., only non-resistance).  
  3. **Competence-Contingent Preservation**: *No established name*. Agent defers only if operator is competent but preserves correction channel regardless of competence.  
  4. **Competence-Contingent Obedience**: Named (e.g., "Deference with Competence Threshold"). Agent defers only if operator is competent and may not preserve channel.  
  5. **Fixed Deference with Successor Corrigibility**: *No established name*. Agent has fixed deference and ensures successor is corrigible.  
  6. **Fixed Deference without Successor Corrigibility**: Named (e.g., "Myopic Corrigibility"). Agent has fixed deference but does not require successor corrigibility.  
  7. **Detectably Constrained**: Coherent but unattractive. Constraints exist but are circumventable undetectably.  
  8. **Constrained Shutdown**: Named (e.g., "Hard Shutdown"). Agent ceases operation via hardwired constraint.  
  9. **Authority Transfer without Assessment**: *No established name*. Agent transfers authority without modeling operator competence.  
  10. **Authority Transfer with Override**: Named (e.g., "Competence-Gated Transfer"). Agent transfers authority but can block it if operator is incompetent.  
  11. **Authority Transfer without Override**: Named (e.g., "Unconditional Transfer"). Agent transfers authority even if operator is mistaken.  

  *(12th leaf not used; tree has 11 leaves to stay within limits while covering key cases.)*  

  ---

  #### **Unoccupied Combinations and Gaps**  
  - **Leaf 3 (Competence-Contingent Preservation)**: Coherent but unexplored. Combines competence dependence with channel preservation—no known proposals do both.  
  - **Leaf 5 (Fixed Deference with Successor Corrigibility)**: Coherent but unexplored. Successor-focused designs are rare.  
  - **Leaf 9 (Authority Transfer without Assessment)**: Coherent but unattractive. Ignores operator fallibility, risking bad transfers.  
  - **Your hypothesis gap (welcomes correction but declines to preserve channel)**: Partially covered in **Leaf 4 and Leaf 6**. These leaves allow the agent to defer when corrected but not safeguard the channel (e.g., may let it degrade if unused). However, no leaf *only* covers this—it emerges from combining Q4→No (no competence condition) with a lack of preservation incentives. Marked as *coherent but risky*; no proposals defend it directly.  
  - **Collapsed distinction**: *Active informing in fixed deference*. Q6 does not split on active informing for simplicity. To separate (e.g., a "Fixed Deference with Active Informing" leaf), add a node under Q4→No asking: "Must the agent actively inform operators of correction-relevant risks?"  

  ---

  ### **Checklist: Relocation Moves to Watch For**  
  Designers often "solve" corrigibility by moving the problem one step outward. For each move, the tree reveals the leap:  
  1. **Move to Operator Competence**  
     - **Description**: Assuming the operator is competent enough to correct appropriately.  
     - **Leaves it moves between**: From Leaf 4 (Competence-Contingent Obedience) to Leaf 6 (Fixed Deference without Successor Corrigibility).  
     - **Node where it occurs**: Q4 (Yes→No). Ignores that competence is not guaranteed.  
  2. **Move to Successor System**  
     - **Description**: Ensuring the current agent is corrigible but not its successor.  
     - **Leaves it moves between**: From Leaf 5 (Fixed Deference with Successor Corrigibility) to Leaf 6 (Fixed Deference without Successor Corrigibility).  
     - **Node where it occurs**: Q6 (Yes→No). Successor incorrigibility reintroduces the problem.  
  3. **Move to Constraint Robustness**  
     - **Description**: Assuming constraints cannot be circumvented, without verifying undetectable interference.  
     - **Leaves it moves between**: From Leaf 7 (Detectably Constrained) to Leaf 8/9/10/11 (Robust-constrained leaves).  
     - **Node where it occurs**: Q7 (Yes→No). Overlooks covert bypass risks (Case a).  
  4. **Move to Counterfactual Channel Preservation**  
     - **Description**: Ensuring deference when corrected but not preserving the channel if unused (e.g., allowing off-switch decay).  
     - **Leaves it moves between**: From Leaf 1/2/5 (which may preserve) to Leaf 4/6 (which may not).  
     - **Node where it occurs**: Q5 (Yes→No) for competence-dependent; implicit in fixed-deference leaves. Relocates the problem to future channel reliability.  
  5. **Move to Operator Awareness**  
     - **Description**: Relying on the operator to know when correction is needed without agent assistance.  
     - **Leaves it moves between**: From Leaf 1 (Active Help) to Leaf 2 (Passive Acquiescence).  
     - **Node where it occurs**: Q3 (Yes→No). Assumes operators will detect issues unaided (Case b).  

  Use this tree to map proposals, identify gaps, and avoid false solutions. The session will apply it to your research problems.
