prompt: |-
  i'm doing a philosophy of mind paper this semester and also working as a TA for a first-year logic course, and the two things have kind of collided on me now that it's exam season. We did the extended mind stuff — the famous thought experiment where one person remembers the museum address in her head and the other has to check a notebook he always carries — and my prof's line in the lecture was that the thesis is either trivial or obviously false, and that university exam rules are a good way to tell which. I think she's being too quick but I can't say exactly why, which is what I want help with.

  Here's the practice, as concretely as I can give it. In the course I TA, students may bring a non-programmable calculator but not a phone, even though the phone contains a calculator that does strictly more and is arguably more reliable. They may bring one handwritten A4 sheet of notes, but under the rule as it was rewritten last year the sheet has to be "continuously available and actually relied on for the majority of study sessions for that paper" — so a sheet you made in week two and used all term is fine, a identical sheet printed out the night before is a breach, and a classmate who happens to be standing in the corridor is a breach no matter how many hours you spent revising with them. Meanwhile the disability office will approve a screen reader, a spellchecker, or a human scribe for students with dyslexia, but the same essay written with a grammar-and-rewrite tool switched on is academic misconduct, and so is paying a friend to proofread it. So: same computation, same output, wildly different treatment, and the differences don't seem to track how much thinking the tool is doing for you.

  What I want is the implicit theory. What does this rulebook presuppose about where a person's cognition stops — is it that the permitted aids have been reliably available, easily accessible and automatically trusted over time, roughly the conditions the reading talks about, or is it something else entirely, like a view about credit or about who deserves praise for the answer? Which rival views does it quietly rule out: does it rule out the skull-and-skin view, or does it instead rule out the really permissive view on which any external process you're coupled with is part of you? Are the parts even consistent with each other — the scribe case and the software case look identical to me from the outside, and the calculator/phone distinction can't be about computation — and where is the practice just philosophically underdetermined, so that several quite different theories would license exactly the same rules? And finally, what would actually have to change if a department took the extended view seriously: does a closed-book exam start to look less like a fair test and more like inducing a temporary disability, or does the whole thing collapse the other way, into nothing being bannable at all? I'd especially like to know how much of the metaphysics the rules are really committed to, versus how much is only loosely compatible with them, since that's the bit I'd need before I try arguing back in tutorial.
reasoning: |-
  Okay, let me try to unpack this user's query. They're a TA for a first-year logic course and also writing a philosophy of mind paper. The collision between the two is happening during exam season. The user's professor dismissed the extended mind thesis as either trivial or false, using university exam rules as evidence. The user thinks this is too quick but can't articulate why, so they're seeking help.

  First, I need to recall the extended mind thesis. Clark and Chalmers' thought experiment compares someone remembering a museum address internally versus another checking a notebook. The argument is that if the notebook is constantly available and relied upon, it's part of the cognitive process. The professor claims exam rules show this thesis is flawed because permitted aids (like calculators) versus banned ones (like phones) can't be differentiated by the extended mind criteria alone.

  The user provides concrete examples: calculators allowed but not phones, even if the phone's calculator is better. Handwritten notes are okay if used all term, but identical notes printed last minute aren't. A classmate outside isn't allowed. For dyslexia, screen readers or human scribes are permitted, but grammar tools or paid proofreading are misconduct. The user notes that the rules don't seem to track the tool's cognitive contribution but something else.

  The user wants the implicit theory behind these rules. What do the rules presuppose about cognition? Do they align with extended mind conditions (reliable, accessible, automatically trusted) or something else like credit assignment? Which rival views do the rules rule out? Are the rules consistent? For example, why is a human scribe okay but not software? Also, what would change if the department took extended mind seriously? Would closed-book exams be like inducing disability? Or would it lead to no bans at all?

  I should break down the key points. The exam rules seem to prioritize reliability and integration over time. The handwritten notes must be used throughout the term, indicating that the tool needs to be part of the student's habitual process. This aligns with Clark and Chalmers' "constant availability and automatic endorsement." However, the ban on phones despite similar functionality suggests other factors like control and containment. Phones have multiple functions, making it hard to monitor usage, whereas calculators are single-purpose. It's a practical concern rather than a cognitive one.

  The scribe vs. grammar tool example is tricky. Both assist in producing correct output, but the rules treat them differently. The scribe is seen as enabling expression, while the tool alters content. This points to a credit assignment issue: who gets credit for the work? The rules might be distinguishing between tools that facilitate the student's own cognition versus those that replace it. The human scribe is under the student's direction, while software operates autonomously.

  The user also questions consistency. The same computation/output but different treatments. The underlying principle seems to be about the boundary of the person. Exam rules might be based on a commonsense view: the skin and skull boundary. Anything inside is "you," outside is not. However, the accommodations for disabilities complicate this. A scribe is outside the skin but allowed, so the rules aren't strictly adhering to the skull boundary. Instead, they might be using a functional criterion: tools that restore function without adding cognitive capability beyond the norm.

  The professor's claim that the thesis is trivial or false based on exam rules might overlook that the rules aren't purely about cognition. They involve practical concerns like fairness, prevent cheating, and administrative ease. For instance, allowing phones is risky because they can access the internet, so it's easier to ban them altogether. The consistency requirement for notes ensures that the aid is integrated into the learning process, which might align with extended mind, but the enforcement is about verifiability—proving that the notes were used all term.

  If a department took extended mind seriously, closed-book exams might be seen as artificial restrictions. Students could argue that their notes or devices are part of their cognitive system, so banning them hinders their actual thinking process. However, this could lead to slippery slopes. If a student claims their smartphone is part of their extended mind, how do you regulate that? The department might need to define what constitutes a legitimate extension, perhaps based on reliability and consistency.

  The rules might not be committed to a specific metaphysics but are instead pragmatic. They allow aids that are necessary (disability accommodations) or integrated (long-term notes), while banning others to maintain control and fairness. The inconsistency between scribe and software could be due to the perceived agency: the scribe is a passive tool, while software actively processes information. But that distinction might not hold under scrutiny.

  In conclusion, the exam rules don't neatly align with any single philosophical view but are a mix of practical compromises. The extended mind thesis isn't directly refuted by the rules because the rules prioritize administrative and fairness concerns over metaphysical consistency. The user could argue that the rules' inconsistencies reveal their pragmatic nature rather than a philosophical stance, and that the extended mind thesis still holds in cognitive terms, even if exam policies don't reflect it due to real-world constraints.
answer: |-
  You've hit on a brilliantly messy collision point between philosophical theory and institutional practice. Your professor's argument that exam rules expose the extended mind thesis (EMT) as "trivial or false" is provocative but likely conflates metaphysical claims with pragmatic institutional constraints. Let's dissect the implicit theory behind the rules, the rival views they engage (or ignore), and the genuine tensions.

  **The Implicit Theory: "Credit-Worthy Cognition" & the "Managed Cognitive Environment"**

  Exam rules don't map neatly onto *one* clean theory of mind. Instead, they presuppose a **hybrid model prioritizing credit assignment and environmental control:**

  1.  **The Credit Boundary:** The core presupposition is that **cognition worthy of academic credit must originate within, and be demonstrably controlled by, the biological agent.** The rules are designed to isolate and assess the *student's own, minimally scaffolded, cognitive performance* at a specific moment. This draws a line around the biological individual as the unit of responsibility and credit.
  2.  **The Managed Environment:** Exams create an artificial, standardized cognitive environment. Permitted tools aren't seen as *extensions of the mind* but as **regulated environmental props or compensations** whose influence is constrained and deemed "fair" within the assessment context. Their acceptability hinges on:
      *   **Predictability & Containment:** Tools must have limited, well-defined functions (calculator vs. phone). The risk of uncontrolled cognitive offloading (e.g., phone accessing the internet) is paramount.
      *   **Integration Transparency:** For notes, "continuous availability and reliance" signals that the information has been *internalized* through habitual use. The handwritten sheet isn't just data; it's a physical trace of a *process of learning and integration* over time. The identical sheet printed overnight bypasses this integrative process – it's seen as raw, unprocessed external data injection.
      *   **Compensation vs. Enhancement:** Disability accommodations (scribe, screen reader) are framed as *compensating for a deficit* to allow the student to *express* their own cognition. Grammar tools or paid proofreaders are seen as *enhancing* or *replacing* the student's cognitive labor in the core domain being assessed (e.g., writing mechanics, argument structure). The scribe writes *what the student dictates*; the grammar tool *generates or significantly alters* the output.
      *   **Procedural Verifiability:** Rules must be enforceable. "Continuously available and relied upon" (though fuzzy) is *more verifiable* than ephemeral social couplings ("classmate in the corridor"). Who monitored that "reliance"? How long was it? The rule leans towards tangible, documentable integration.

  **What Rival Views Does This Rule Out (or Sideline)?**

  1.  **Rules Out (or Severely Constrains):**
      *   **Radical EMT (Any Coupling):** The view that *any* reliable, accessible process you're coupled with is "part of your mind" is directly contradicted. The phone (reliable, accessible calculator) is banned. The classmate is banned. The overnight notesheet is banned. The rules demand a much stricter criterion than simple coupling.
      *   **Situated Cognition (Social Emphasis):** The explicit ban on social resources ("classmate in corridor") rules out views heavily emphasizing social distribution as constitutive of cognition *in this assessment context*. Cognition worthy of credit must be demonstrably individual.
  2.  **Does NOT Rule Out (and Might Tacitly Endorse Aspects of):**
      *   **Clark & Chalmers EMT (Parity Principle + Reliability/Trust/Access):** The "continuous availability/reliance" rule for notesheets is *almost* a direct application of their criteria (constant availability, automatic trust, past endorsement, accessibility). **This is where your intuition that your prof is too quick is strongest.** The rules *do* recognize something special about deeply integrated tools. *However*, the rules *also* layer on the "Credit Boundary" and "Managed Environment" constraints that go beyond EMT. EMT explains why the long-term notebook *should* count; the exam rules selectively acknowledge this for notesheets (if integrated) but reject it for phones (due to containment/control) and classmates (due to individualism/verifiability). The rules use a *subset* of EMT criteria *instrumentally* for specific tools.
      *   **Skull-and-Skin (Naive Internalism):** While the rules *resemble* internalism by banning most external aids, the explicit *allowances* (calculator, notesheet, scribe) show they don't strictly hold this view. The biological boundary isn't sacrosanct; carefully managed external props are permitted. Disability accommodations explicitly reject strict internalism.
  3.  **Ignores/Is Silent On:**
      *   **Embedded Cognition (Tools as Scaffolding):** While acknowledged in practice (calculator, notes), the rules don't engage deeply with how tools fundamentally reshape cognitive tasks. The focus is on credit/control, not the metaphysics of tool use.
      *   **Enactivist/Dynamic Systems Views:** The fluid, dynamic coupling emphasized here isn't captured by the rigid, static rules.

  **Inconsistencies and Underdetermination:**

  1.  **Scribe vs. Grammar Software:** This is the starkest inconsistency *if* viewed purely through an input/output/computation lens. The implicit distinction is:
      *   **Scribe:** Framed as a *transducer*. They execute motor commands dictated by the student's *unimpeded* linguistic/cognitive process. The student retains authorship and control. The scribe doesn't correct reasoning or grammar; they write what's dictated (errors and all).
      *   **Grammar/Rewrite Software:** Framed as a *cognitive co-processor*. It intervenes *within* the linguistic/cognitive domain, altering word choice, sentence structure, and potentially argument flow. This is seen as performing cognitive work *on behalf of* the student within the assessed domain.
      *   **The Tension:** Is this distinction sustainable? A sophisticated grammar tool might function much like a very pedantic scribe silently correcting errors as you dictate. Conversely, a scribe might subtly influence wording through hesitation or rephrasing requests. The rules *presuppose* a clear line between "expression" (scribe) and "generation/correction" (software) that may be blurry. **The practice is underdetermined here:** Both a strict internalist view ("only the biological brain counts!") *and* a pragmatic credit/control view ("did the tool *correct* the cognition?") could *try* to justify the distinction, but neither fits perfectly.
  2.  **Calculator vs. Phone:** The distinction isn't about computation *power*, but about **containment, control, and predictability.** A calculator is a single-function device. A phone is a general-purpose computer with communication capabilities and vast storage. The ban is primarily pragmatic: preventing cheating (texting, browsing) is vastly harder with phones. It's about managing the cognitive environment, not defining the mind's boundary. A dedicated, non-networked scientific calculator app on a locked-down tablet *might* be permitted under a revised rule, highlighting the non-metaphysical basis.

  **What Would Change if the Department Took EMT Seriously?**

  Taking EMT seriously wouldn't lead to chaos, but it would force a radical reframing:

  1.  **Closed-Book Exams as Artificial Impoverishment:** Yes, they would look more like inducing a temporary disability by severing integrated cognitive systems. The argument becomes: "You've trained me to think *with* these tools; testing me without them doesn't assess my actual competence, just my crippled state."
  2.  **Assessment Redesign:** Instead of banning integrated tools, assessments would need to:
      *   **Focus on Process & Understanding:** Emphasize problem-solving *using* tools, explanation, justification, and metacognition (e.g., "Explain how you used your notes/calculator to arrive at this answer").
      *   **Assess the Coupled System:** Evaluate the student's skill in *selecting, managing, and utilizing* their cognitive extensions effectively and critically. Can they find reliable sources? Judge the output of a tool? Integrate information?
      *   **"Extended Closed-Book" Exams:** Allow *only* the specific, deeply integrated tools documented as part of the student's habitual learning process (e.g., *that specific* notebook, *that specific* calculator app used throughout the course), under strict supervision to prevent substitution or cheating.
      *   **Shift Away from Memory-Intensive Tasks:** Focus assessment on skills that cannot be easily offloaded or require higher-level integration even with tools.
  3.  **It Doesn't Collapse into "Nothing Bannable":** EMT doesn't mean *everything* is part of your mind. Criteria still apply (reliability, accessibility, automatic trust, past endorsement). Paying a friend last minute wouldn't meet the "integration" criterion. Using a phone to Google answers during the exam isn't a *reliable, habitual* coupling constitutive of the student's cognitive process; it's opportunistic access to an uncontrolled resource. The focus shifts to whether the resource is a *genuine* part of the student's *enduring* cognitive architecture for the subject.

  **How Much Metaphysics Are the Rules Committed To?**

  **Very little directly, but quite a bit indirectly via the "Credit Boundary".** The rules are primarily **pragmatic, institutional constructs** driven by:

  *   **Fairness & Level Playing Field:** Standardizing the cognitive environment.
  *   **Credit Assignment & Academic Integrity:** Ensuring the work demonstrably originates from the student.
  *   **Prevention of Cheating:** Practical enforceability.
  *   **Assessment of Core Competencies:** Deciding what skills *must* be internalized vs. can be scaffolded.

  However, these pragmatic goals *presuppose* a **commonsense, individualistic view of the person** as the bounded source of thought and action (the "Credit Boundary"). They implicitly reject the idea that cognition can be legitimately distributed across uncontrolled social networks or general-purpose devices *for the purpose of assigning individual credit*. They **instrumentalize aspects of EMT** (integration over time) for specific, contained tools while rejecting its broader implications (social distribution, fluid coupling with multi-function devices).

  **Arguing Back in Tutorial:**

  1.  **Target the Conflation:** "Prof argues exam rules show EMT is trivial/false. But the rules aren't a pure test of metaphysics; they're a pragmatic compromise prioritizing credit assignment, anti-cheating, and administrative simplicity. They actually *borrow* EMT's integration criteria for notesheets while rejecting its implications elsewhere for practical reasons, not philosophical ones."
  2.  **Highlight the EMT-Compliant Rule:** "Look at the notesheet rule – 'continuously available and actually relied on' – that's *straight out of Clark & Chalmers* (reliable, accessible, automatically trusted). The rules implicitly acknowledge EMT for *some* tools but arbitrarily restrict it for others (phones, classmates) based on control and credit concerns, not cognition itself."
  3.  **Press the Inconsistencies:** "If cognition is strictly internal, why allow *any* external aids? If tools performing computation are the problem, why ban a phone calculator identical to the permitted device? Why is a human scribe 'me' but grammar software 'not me' when both produce the output? The distinctions rely on a fuzzy 'credit boundary' and practical control, not a coherent theory of mind. The rules are philosophically unstable."
  4.  **Question the Goal:** "Does banning deeply integrated tools (like a term-long notesheet) actually assess the student's *real understanding and ability*, or just their ability to perform under artificially induced cognitive impoverishment? If cognition is extended, shouldn't we assess competence *with* the tools?"

  Your instinct is correct: the exam rules are a fascinating, messy artifact of institutional needs bumping up against the realities of cognition. They don't refute EMT; they demonstrate the struggle to *implement* its insights within a system built on individual credit and standardized control. The metaphysics is lurking in the background, shaping the "Credit Boundary," but the driving forces are largely pragmatic.
