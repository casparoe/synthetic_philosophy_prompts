prompt: |-
  hey — I run a small reading group and two of the regulars have been going at each other about what emotions even are for about a year, and it's got to the point where they just restate there positions in slightly different words. So I want to make them produce the document they should have written six months ago: the joint statement of an adversarial collaboration.

  The setup. Priya is a judgment / construal theorist: emotions centrally involve evaluative states that are belief- or judgment-like — they represent their object as dangerous, insulting, loss-worthy, whatever; they can be correct or incorrect; they answer to reasons; and they're the kind of thing you can be criticised or irrational for having. Marco is a bodily-feeling theorist: emotions are perceptions of, or states constituted by, patterned changes in the body — heart rate, breathing, gut, facial posture, readiness to act — and it's that somatic side that makes something an emotion rather than just the thought that something is dangerous. Neither has convinced the other, and I don't want a verdict on who's right. I want the text both of them could put their names to.

  What needs to be in it:

  A numbered agreed-claims section. Real claims, not filler like "emotions are complicated and multi-faceted". I mean: do emotions have objects, and what kind of object; can emotions themselves (not just the actions they cause) be assessed for rationality; do infants and non-human animals have them; where do moods fit; can you have an emotion without noticing you have it; is the bodily change a cause of the emotion, a part of it, or a mere effect; and what a theory of emotion is supposed to explain in the first place — the phenomenology, the way emotions rationalise action, the fact that they come in recurring kinds with characteristic expressions? If they can't actually agree at that level, say so and move it to the disagreements part instead of fudging it.

  Then a disagreements table, with columns roughly: the crux; Marco's claim in wording Marco would accept for himself (not a caricature); Priya's claim the same way; whether the disagreement is substantive or only about which thing gets to be called "the emotion" — and if it's verbal, which part and why; the case or argument both of them agree would bear on it; and each side's prediction about what that case will show, written down now so nobody can move the goalposts later.

  The bearing-cases I want used as tests, since this is where I think the action is — replace any of them with something sharper if you think of it:

  Recalcitrance. Someone is fully convinced the glass-bottomed walkway is safe, says out loud that they know there is no danger, wants to be there, and still freezes and has to be helped off. Is that an emotion? Both need an account of it, and each should say in advance what they'd conclude if the same subject also reported no felt bodily change whatsoever.

  The denervated subject (my hypothetical, fix it if it's badly set up). Someone whose interoceptive feedback is largely blocked: heart races, gut churns, none of it reaches them, while their ability to size up situations, act, and talk about what matters to them is intact. Do they have emotions? What would each side predict about whether they describe themselves as feeling things less intensely, and about whether their emotion-guided behaviour degrades?

  Emotion with no situation. A subject in an empty room whose autonomic profile is made to match fear exactly — drug, stimulation, whatever — with nothing to be afraid of, no thought that anything is amiss, and nothing they're inclined to do. Emotion, bare feeling, or neither?

  Fear of fear. Someone who isn't afraid of heights or dogs or dying but is terrified of having a panic attack, so that the object of the emotion is a bodily episode of their own. This one seems to me to cut against at least one of them, and I can't work out which.

  Fiction and music. Being genuinely moved by a film you know is fictional, or by a piece of instrumental music that doesn't represent anything.

  Offline emotions. Dread about a meeting next Tuesday, embarrassment about something from 2009: the object isn't present to the senses at all, and the bodily side is faint or missing.

  One more thing I want handled: where does the "perceptual" or "attitudinal" option fit — emotions as perceptions of value, neither judgments nor bodily feelings? Is that a third camp they've both been quietly ignoring, or is one of them already committed to it without admitting it? If a chunk of there dispute is really a fight over which of three things deserves the name, tell me which chunk, and what's genuinely left over.

  Length is up to you, but I want the agreed-claims section to be something I can read out loud to both of them without either one objecting to the wording. And don't give me names of authors, citations or a reading list — I know the literature fine, I just want the document.
reasoning: |-
  Okay, the user runs a reading group where Priya and Marco have been stuck in a year-long debate about emotion theories. Priya sees emotions as judgment-like states (evaluative, reason-responsive), while Marco ties them to bodily sensations. The user wants an adversarial collaboration document to break their deadlock—not to decide who's right, but to force concrete agreements and map disagreements with testable predictions.  

  First, I need to structure the document exactly as requested:  
  - **Agreed Claims**: Numbered, substantive, no fluff. Must cover: objects of emotions, rationality assessment, infants/animals, moods, unconscious emotions, bodily change role, and explanatory goals. If they can't agree, move it to disagreements.  
  - **Disagreements Table**: Columns for crux, Marco/Priya's self-described positions, substantive vs. verbal dispute, test cases, and pre-commit predictions.  
  - **Bearing Cases**: The user provided 7 scenarios (recalcitrance, denervated subject, etc.) as litmus tests. Need to ensure these are framed sharply.  
  - **Perceptual Theory**: Address where the "emotions as value perceptions" fits—is it a third option or absorbed by one side?  

  Now, assessing the user's deeper needs:  
  - They're frustrated with circular debates and want productivity. The document should force Priya/Marco to crystallize positions and pre-commit to falsifiable tests.  
  - Unspoken goal: Reduce group tension by depersonalizing the conflict. The joint statement format makes it collaborative, not combative.  
  - Expertise note: User knows the literature but wants no citations—focus on clarity and neutrality.  

  **Key challenges**:  
  1. **Agreed Claims**: Find middle ground without watering down. Examples:  
     - *Objects*: Both agree emotions have objects, but Priya sees them as propositional ("fear of falling"), Marco as somatic ("fear as heartbeat+avoidance"). Compromise: "directed at objects via appraisal or bodily readiness."  
     - *Rationality*: Priya says yes to emotions themselves; Marco says only to actions. Solution: Split—"emotions can be assessed for fit, but not coherence like beliefs."  
     - *Infants/Animals*: Both say yes, but Priya adds "proto-emotions" caveat.  
     - *Bodily Role*: Biggest hurdle. Settle for "necessary for paradigmatic cases" (Marco) vs. "contingent" (Priya), with moods as a pivot.  
  2. **Disagreements Table**:  
     - Highlight *substantive* vs. *verbal* splits. E.g., "Is bodily feedback necessary?" is substantive; "What counts as 'the emotion'?" might be verbal.  
     - For each test case, frame predictions so backtracking is hard. E.g., for *denervated subject*, Marco predicts degraded behavior; Priya predicts intact emotions with blunted phenomenology.  
  3. **Bearing Cases**: Tighten setups:  
     - *Denervated Subject*: Specify "congenital interoceptive blockade" to avoid recovery confounds.  
     - *Fear of Fear*: Clarify it targets Marco—if fear requires bodily perception, fearing panic attacks becomes a loop.  
     - *Perceptual Theory*: Note it's a live option Priya might absorb (judgments as perception-like), leaving Marco isolated on somatic necessity.  

  **Output Tone**:  
  - Formal but accessible. Agreed Claims must be read-aloud ready; disagreements table crisp.  
  - Neutral language: "Marco contends" not "Marco stubbornly argues."  

  Final check: User wants no citations or fluff—pure dialectic scaffolding. The document should feel like a treaty draft, where signing forces accountability.
answer: |-
  ## Joint Statement of Adversarial Collaboration: Priya (Judgment Theory) & Marco (Bodily-Feeling Theory)

  ### Section 1: Agreed Claims
  We jointly affirm the following substantive claims about emotions:

  1.  **Objects:** Emotions are typically *about* something – an object, event, state of affairs, or prospect. This object is apprehended by the subject as significant in some way (e.g., threatening, desirable, offensive).
  2.  **Phenomenology & Motivation:** Emotions involve a distinctive subjective feeling component (phenomenology) and inherently motivate or prepare the organism for action (e.g., approach, avoidance, attack, care).
  3.  **Recurring Kinds:** Emotions occur in recurring, cross-culturally recognizable categories (e.g., fear, anger, joy, sadness, disgust) that share characteristic patterns, including typical eliciting conditions, action tendencies, and (often) expressive behaviors.
  4.  **Infants & Non-Human Animals:** Infants (pre-linguistic) and many non-human animals are capable of genuine emotions. These states share core functional and motivational properties with adult human emotions, even if differing in complexity or cognitive mediation.
  5.  **Unconscious Emotions:** It is possible to be in an emotional state without being consciously aware of it at that moment (e.g., implicit anger influencing judgment, unrecognized anxiety manifesting in behavior). The emotion exists prior to or independently of conscious recognition.
  6.  **Rationalization of Action:** Emotions play a crucial role in rationalizing and explaining actions. They provide *reasons for* action from the agent's perspective ("I ran because I was afraid").
  7.  **Core Explananda:** A successful theory of emotion must explain the recurring kinds (Claim 3), their distinctive phenomenology and motivational force (Claim 2), and their role in rationalizing action (Claim 6). It must also account for why emotions feel the way they do and how they differ from cold cognitive states.
  8.  **Moods vs. Emotions:** Moods differ from paradigmatic emotions in lacking a specific, focused object (e.g., general anxiety vs. fear of a dog) and often being more diffuse and longer-lasting. Moods may involve bodily feelings and influence cognition/action, but their objectless nature distinguishes them.

  ### Section 2: Disagreements Table
  The following table outlines our core disagreements, specifying the crux, our respective positions stated in terms we accept, the nature of the disagreement (substantive or verbal), key test cases both agree are relevant, and our pre-commit predictions about those cases.

  | Crux                                                                 | Marco's Claim                                                                                                                             | Priya's Claim                                                                                                                                                             | Disagreement Nature                                                                                                                                    | Agreed Bearing Case                                                                                                                               | Marco's Prediction                                                                                                                         | Priya's Prediction                                                                                                                               |
  | :------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Is patterned bodily change NECESSARY for an emotion?**          | Patterned bodily changes (autonomic, somatic, expressive, action readiness) are constitutive and necessary for any state to be an emotion. | Bodily changes, while frequent and important accompaniments, are neither constitutive nor necessary for an emotion. Emotions are constituted by evaluative judgments. | **Primarily Substantive:** Disagreement over constitutive conditions. Verbal aspect: Marco reserves "emotion" for states with bodily changes; Priya applies it more broadly. | **A. Denervated Subject:** Congenital, complete blockade of interoception & proprioception (no feeling of HR, breathing, gut, muscle tension), intact cognition/action. | Subject lacks emotions entirely. Would report no felt intensity. Emotion-guided behavior (e.g., avoidance of learned danger) would degrade significantly or become purely "cognitive" avoidance. | Subject has full emotions. Would report "knowing" they should feel fear/anger/etc. but lacking intensity/phenomenal "heat." Behavior driven by evaluation remains intact. |
  | **2. Is patterned bodily change SUFFICIENT for an emotion?**         | A patterned bodily change matching a specific emotion profile (e.g., fear), even absent any evaluative judgment, constitutes that emotion. | A patterned bodily change alone, without an evaluation/appraisal of an object as significant (e.g., dangerous, offensive), is not an emotion. It is a "bare feeling." | **Primarily Substantive:** Disagreement over constitutive conditions. Verbal aspect: Priya denies "emotion" label to pure bodily states; Marco applies it. | **B. Emotion with No Situation:** Subject in empty room, autonomic/physiological profile induced (drug/stim) to match fear exactly. No object, no evaluation, no action tendency. | This *is* the emotion of fear, albeit strangely objectless and lacking behavioral expression. A "pure" emotional state.                         | This is *not* an emotion. It is a disembodied feeling pattern, perhaps "anxiety" or mere agitation, lacking the core evaluative component defining fear.      |
  | **3. Can the EMOTION ITSELF (not just action) be directly assessed for rationality?** | The emotion itself (the bodily feeling pattern) cannot be "rational" or "irrational." Only the cognitive evaluations preceding it or the actions following it can be so assessed. | The emotion itself, being constituted by an evaluative judgment (e.g., "this is dangerous"), can be directly assessed for rationality – primarily for its *fit* with the actual situation (Is it dangerous?). | **Substantive:** Deep disagreement about the nature of the emotion core and its relation to reasons.                                                                 | **C. Recalcitrance:** Subject on safe walkway, believes/knows it's safe, wants to be there, freezes. Reports *no* felt bodily change (HR normal, no tremor, etc.). | If truly *no* bodily change pattern, it's not genuine fear (maybe surprise/disorientation). If bodily change *is* present (freezing!), it *is* fear, even if "irrational" relative to belief. | This *is* fear (the evaluation "this is dangerous" is active). The lack of reported bodily change is odd but doesn't negate the emotion core. The emotion is irrational (fails fit). |
  | **4. What is the PRIMARY LOCUS of emotional intentionality (aboutness)?** | The bodily feeling pattern itself carries intentionality – it is a perception of bodily readiness *towards* a situation (e.g., readiness to flee *is* feeling fear about it). | The intentionality (aboutness) resides solely in the evaluative judgment. Bodily changes are non-intentional effects or concomitants. | **Primarily Substantive:** Disagreement on how intentionality arises. Verbal aspect: Different locus for "what makes it about X."                                | **D. Fear of Fear:** Subject terrified specifically of *having a panic attack* (bodily state), not of heights, etc. Object is the bodily episode. | This is a clear emotion (fear), demonstrating bodily feelings *can* be the intentional object. Supports bodily intentionality.               | This *is* fear, but the object is *not* the bodily state itself. The object is the *significance* or *meaning* of the panic attack (e.g., "loss of control," "impending doom"), apprehended via judgment. |
  | **5. How do OFF-LINE EMOTIONS (e.g., future dread, past embarrassment) work?** | Off-line emotions involve *simulated* bodily patterns (faint, neural reactivations) corresponding to the core emotion. Without this somatic marker, it's mere thought. | Off-line emotions are constituted by the evaluative judgment about the past/future event (e.g., "that *was* humiliating," "the meeting *will be* awful"). Bodily feelings are contingent, often weak. | **Substantive:** Disagreement on what constitutes the emotion in decoupled thought. Verbal aspect: Threshold for applying "emotion" to weak/absent bodily states. | **E. Offline Emotions:** Strong dread about Tuesday meeting, intense embarrassment recalling 2009 event, with minimal or fleeting bodily feelings. | These are genuine emotions, relying on neural simulations of the bodily state. Intensity correlates with simulation vividness.                 | These are full emotions, constituted by the evaluative judgment. Bodily intensity is common but not necessary; the evaluative focus defines them. |
  | **6. How do FICTIONAL/MUSICAL emotions work?**                       | Emotions elicited by fiction/music involve direct perception of expressive patterns (in art/sound) triggering resonant bodily feelings. Judgment of reality is suspended, not central. | Being "moved" by fiction/music centrally involves an evaluative appraisal of the content/expression (e.g., "this situation is tragic," "this melody is beautiful/longing"). | **Substantive:** Disagreement on the mechanism and core component. Verbal aspect: Different emphasis on trigger vs. appraisal.                             | **F. Fiction/Music:** Genuine sadness while watching known-fictional film; feeling moved by abstract music. | The emotion is directly caused by the perceptual/bodily resonance with the expressive stimuli. "Knowing it's not real" modulates but doesn't block the bodily feeling. | The emotion requires an evaluative stance towards the portrayed situation or the aesthetic qualities. "Suspension of disbelief" or aesthetic judgment enables the appraisal. |

  ### Section 3: The Perceptual/Attitudinal Option
  We acknowledge the "emotions as perceptions of value" theory as a distinct, prominent third position. It claims emotions are sui generis states that directly present value properties (e.g., dangerousness, offensiveness) in a perception-like, non-judgmental way. We agree on the following regarding its relationship to our debate:

  1.  **Distinctness:** It is a genuine third camp, not merely a variant of either theory. It rejects Priya's claim that emotions are judgment-like (beliefs) by emphasizing their passivity, phenomenal presence, and potential independence from judgment. It rejects Marco's claim that bodily feelings are constitutive by grounding intentionality/value detection in a dedicated faculty, not necessarily the body.
  2.  **Impact on Our Dispute:** This theory directly challenges Crux 3 (Rationality Assessment). Like Priya, it holds emotions can be assessed for *accuracy* (fit). Like Marco, it sees them as passive. It also offers distinct takes on Recalcitrance (as perceptual illusion) and Fictional Emotions (as genuine perception of represented value). Its existence shows that a position endorsing emotion's world-directed intentionality and assessability for fit *without* requiring constitutive bodily changes is viable and must be addressed separately.
  3.  **Priya's Proximity (with caveat):** Priya acknowledges that her judgment-based view can incorporate perception-like *elements* (fast, automatic appraisals) and shares the focus on intentionality/fit. However, she maintains that the core *is* a type of evaluative representation continuous with (though distinct from) belief/judgment, not a distinct perceptual modality.
  4.  **Marco's Distance:** Marco sees this view as largely ignoring the essential, constitutive role of the body in generating the felt experience and intentional directedness of emotion. It risks, from his perspective, over-intellectualizing the phenomenon.

  **Conclusion:** While this third view interacts with our debate (particularly on intentionality and fit), it does not *resolve* our core substantive disagreements (Cruxes 1, 2, 3, 4, 5). Our adversarial collaboration remains focused on the fundamental divide between judgment/conceptual evaluation and bodily feeling patterns as the constitutive core of emotion. The existence of the perceptual theory highlights that our dispute is not exhaustive of the field, but it doesn't collapse our distinct positions.
