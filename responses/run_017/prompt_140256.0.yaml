prompt: |-
  hey — i got roped into writing the practice exam for my school's philosophy/econ club and i need one essay question on why some countries are rich and others arent. context: everyone in the club is 16-17, nobody has read any actual papers, and the room we sit in has no wifi and no library books. so the question and the model answer both have to be totally self-contained: no real-world examples, no "as economist X argued in year Y", no reading lists. everything has to come from the case i give plus reasoning. 45 minutes, 20 marks total.

  the problem is that everyone has absorbed the same one-word answer off the internet — "institutions" — and i can already see six identical essays coming: a paragraph on institutions, a paragraph on geography, a paragraph on culture, conclusion "its mostly institutions", 14/20 for everyone. i want a question where that gets you like 6.

  so i drafted a made-up case to build the question around. use it, fix it if its badly designed, or throw it out and build a better one:

  Meridia is an island, one language, one mix of farming and fishing, fairly even rainfall and soil, no known gold/coal/oil. In 1891 a colonial governor splits it in two with a straight line drawn on a badly printed map; because of the misprint the line lands about 40km north of where he meant it. Nothing real changes as you cross it — same soil, same crops, the same families end up on both sides. One governor, one legal code, one school system until independence in 1960, then two countries, North Meridia and South Meridia, with word-for-word the same constitution, the same elections every five years, the same laws about property, contracts and taxes on paper. Today income per person in North is about four times what it is in South. Assume these are all true:

  (a) In North a road contract normally goes to the lowest bidder. In South it normally goes to someone the minister is related to. In both places over 90% of people tell surveyers that corruption is wrong.
  (b) In 1970 a big oilfield was discovered in South — the poorer half. Most of the money appears to have ended up in private bank accounts abroad.
  (c) On survey questions like "do you trust your neighbours", "is hard work important", "how religious are you", North and South give basically the same answers.
  (d) In North every district office has kept a written, public register of who owns which piece of land, continuously since 1893. In the South nobody does. The reason it started in North: the district officer posted there in 1893 happened to be a man who liked filing things, trained two clerks, they trained two more, and the habit stuck. In the South the officer posted that year was transferred after three months.

  the kinds of things im hoping the question forces people into, if theyre any good (use your own if youve got better ones): whether "institutions" here means the rules on paper or the rules actually followed, and what would have to be true for "institutions did it" to be false rather than just definitional; the fact that (d) makes the institutional difference itself something that needs explaining and traces it back to a small fluke, so "the cause" might be a contingent chain instead of a factor; whether the causal claim is supposed to be "in general, elsewhere, in other cases" or just "here", and what one case can and cant establish; whether "why is North rich" and "why is North richer than South" and "what should we change" are even the same question; and how (b) messes with a simple resources story.

  i was also thinking of adding a part b where you imagine re-running history from 1891 a hundred times and asking what the pattern of outcomes would tell you — no idea if that helps or just confuses people, you decide.

  what i want back: the actual exam question (one question, part b if you think its worth it), a model answer of about 600-700 words, and a marking scheme with 4 or 5 must-hit points, how many marks each is worth (20 total), and one line each on the mistake people will actually make that loses them those marks. then a short note on what separates an A (17+) from a B (13-16) — a specific move the A answer has to make, not just "more detail" or "neater writing". and tell me if my case is broken in some way that lets a memorizer off the hook.
reasoning: |-
  Okay, the user is designing a philosophy/econ club exam question targeting 16-17 year olds with no prior reading. They want to avoid clichéd "institutions" essays and force deeper analysis. Their Meridia case study is clever but needs stress-testing.

  Hmm, the core tension here is between paper institutions (identical constitutions) vs. lived reality (corruption patterns). The user's hidden request is to teach causal humility - that "why" questions have layers. Smart.

  First, the case design: The 1893 filing fluke in (d) is gold. It makes institutional quality look path-dependent, not deterministic. But I should check loopholes: Could someone argue geography via the misplaced border? No - soil/crops are identical per case. Culture? Nuked by survey data in (c). Resources? Sabotaged by (b)'s oil curse in the poor South. Good traps.

  For the question itself: Must force engagement with the paradox. "Explain the divergence" is too vague - they'll default to institutions. Need to explicitly demand scrutiny of "institutions" as a concept. Adding the counterfactual part (b) is risky but worthwhile - it exposes the fluke in (d) as non-replicable.

  Model answer priorities: 1) Distinguish de jure vs de facto institutions using the road contracts example, 2) Undermine monocausality by showing how (b) and (d) interact, 3) Highlight that initial conditions (the clerk) mattered precisely because formal rules were weak. 

  Marking scheme traps: Top marks require noticing that "institutions caused it" becomes circular if de facto practices are institutions. The A* move is arguing that constitutions failed as causal shields against corruption.

  User's fear about memorized essays is valid. The oil discovery in poor South is my favorite element - it reverses the resource curse trope. If a student calls it "proof institutions matter," they've missed that the institution (constitution) was identical; it's the enforcement that differed.

  Final tweak: Adding "how would you test" in part (b) prevents overconfidence in single narratives. Perfect for philosophy crossover.
answer: |-
  Here's a complete exam package designed to force critical thinking and avoid the "institutions" autopilot, using your Meridia case (minor tweaks for clarity):

  **Exam Question (20 Marks Total)**

  **Part A (15 Marks):**  
  Using *only* the information provided about Meridia, explain why North Meridia is richer than South Meridia today. Critically evaluate whether the concept of "institutions" provides a sufficient explanation for this divergence.  

  **Part B (5 Marks):**  
  Suppose we could re-run Meridian history from 1891 one hundred times (with the map misprint happening each time). What pattern of economic outcomes between North and South would *strengthen* the claim that the initial difference in district officers (1893) was the decisive cause? What pattern would *weaken* that claim? Explain briefly.

  ---

  **Model Answer (Approx. 650 words)**

  North Meridia's wealth relative to South Meridia stems not from differences in formal rules, resources, geography, or culture – which are largely identical – but from divergent *practices* in governance and property rights that emerged despite identical starting points. While "institutions" are often cited to explain national wealth, this case reveals the limitations of that term unless carefully defined.

  The formal institutions – constitutions, laws, legal codes – were identical at independence (1960). However, the *functioning* of these institutions diverged significantly. Point (a) shows this: both have laws about contracts, but North enforces competitive bidding while South practices nepotism, despite shared cultural norms condemning corruption. This illustrates that "institutions" on paper are insufficient; it's the *de facto* rules and their enforcement that matter for outcomes like efficient infrastructure spending. Calling "institutions" the cause here risks circularity: North is richer *because* its institutions function better, but we need to explain *why* they function better when the blueprints were the same.

  Point (d) is crucial for understanding the divergence's origin. The consistent land registry in North arose from a contingent event: a particular officer's personal preference and effective training. This wasn't mandated by superior formal institutions; it was an accident within the *same* colonial system. The South lacked this specific, beneficial practice due to a different officer's short tenure. This suggests the initial divergence wasn't caused by fundamental factors like culture or geography, but by a small, random event that initiated a path-dependent process. The land registry likely fostered trust, secure property rights, and investment over decades, creating a self-reinforcing advantage. This implies the cause isn't a static "factor" like institutions, but a *process* triggered by contingency.

  Point (b) actively undermines alternative explanations. The discovery of oil *only in the poorer South* and its subsequent looting negates the simple "resources cause wealth" argument. It demonstrates South's dysfunctional *de facto* institutions: weak governance allowed resource wealth to be captured privately, likely hindering development rather than helping it. This highlights how institutional functionality determines whether resources are a blessing or a curse.

  Point (c) shows cultural surveys are similar, ruling out culture as the primary driver of the economic gap. Geography and initial resource bases are also identical.

  Therefore, explaining North's relative wealth requires moving beyond the label "institutions." The divergence stems from differences in *informal practices and enforcement* (nepotism vs. bidding, land registry reliability) that emerged despite identical formal rules. The *origin* of these differences (point d) appears highly contingent – a specific individual's actions setting a persistent precedent. This suggests wealth differences can arise from small, path-dependent events within similar formal structures, not just grand, inherent factors. Answering "why North is richer" here is distinct from "why nations are rich generally"; this case highlights how small initial differences in *implementation* can lead to large gaps even when blueprints match. Attributing the outcome simply to "institutions" obscures the critical distinction between law and practice, and ignores the contingent origin of the key difference.

  **Part B Answer:**  
  *Strengthen:* If North was *consistently* richer than South in the vast majority of the 100 reruns, it would suggest the North's initial officer (who liked filing) reliably set it on a better path. The small fluke consistently produced a large effect.  
  *Weaken:* If North was richer than South in only about half (or fewer) of the reruns, it would severely weaken the claim. This would indicate that the specific officer difference in 1893 wasn't decisive, and other random events or choices later in history played a larger role in determining outcomes. Consistency points to the fluke's importance; inconsistency points to other causes.

  ---

  **Marking Scheme (20 Marks Total)**

  1.  **Identifies Divergence in Practice, not Paper (5 Marks):**
      *   Must-hit: Clearly distinguishes identical *formal* institutions (constitutions, laws) from divergent *de facto* practices (nepotism vs. bidding, land registry presence/absence). Uses evidence (a & d).
      *   **Mistake:** Simply stating "institutions differ" without specifying *how* (formal vs. informal/enforcement). Assuming paper rules equate to reality.

  2.  **Critiques "Institutions" as Explanation (5 Marks):**
      *   Must-hit: Explains why attributing the divergence *solely* to "institutions" is insufficient or potentially circular (e.g., "North has better institutions" just restates the outcome without explaining *why* practices diverged from identical starting points). Uses evidence (d's origin story).
      *   **Mistake:** Simply asserting "institutions caused it" without critical examination. Failing to address the *origin* of the institutional difference revealed in (d).

  3.  **Analyzes Contingency & Path Dependence (4 Marks):**
      *   Must-hit: Identifies the contingent nature of the land registry origin (specific officer's habits) and explains how this small, random event could initiate a path-dependent process leading to significant long-term differences. Uses evidence (d).
      *   **Mistake:** Treating the land registry difference as a fundamental "institutional factor" itself without examining its accidental origin. Ignoring the role of chance or path dependence.

  4.  **Addresses Counter-Evidence Effectively (3 Marks):**
      *   Must-hit: Explains how point (b) undermines resource-based explanations and point (c) undermines cultural explanations. Uses this to strengthen the case for institutional *functionality* as the key.
      *   **Mistake:** Ignoring (b) or (c), or misusing them (e.g., claiming the oil *should* have helped South, proving institutions matter, without analyzing *how* it was captured).

  5.  **Part B: Counterfactual Reasoning (3 Marks):**
      *   Must-hit: Correctly identifies that consistent N>S outcomes strengthen the fluke's importance, while inconsistent outcomes weaken it. Provides a clear rationale (consistency implies determinism by the fluke; inconsistency implies other factors dominate).
      *   **Mistake:** Vague answer. Suggesting outcomes should be identical each time. Misinterpreting what consistency/inconsistency implies.

  ---

  **Separating A (17+) from B (13-16)**

  *   **B Answer (Solid):** Hits all Must-Hit points 1-4 reasonably well. Explains the divergence using practices, critiques "institutions," mentions contingency in (d), uses (b) & (c) correctly. Part B is adequate. May lack depth in connecting the points.
  *   **A Answer (Excellent):** Does everything a B answer does, PLUS makes **one or both** of these sophisticated moves:
      1.  **Explicitly Resolves the "Institutions" Ambiguity:** Clearly argues that attributing the outcome to "institutions" *only* becomes meaningful if "institutions" is defined to encompass the *de facto* practices and enforcement mechanisms (the "rules of the game in practice"), and that this definition makes the explanation *descriptive* rather than identifying an independent *cause*. The *cause* of the divergent practices needs explanation (pointing to d's contingency).
      2.  **Connects Contingency to General Theory:** Explicitly discusses what this *single case* reveals about the limitations of broad theories (geography, culture, resources, paper institutions) and emphasizes the role of small events, path dependence, and the difference between *proximate* causes (land registry, contract practices) and *ultimate* contingent triggers (the officer's habits). Articulates why "why richer here" differs from "what makes nations rich generally."

  ---

  **Case Design Notes:**

  *   **Strengths:** Effectively neutralizes Geography, Culture, Resources, and Formal Institutions as sufficient explanations. The oil discovery in the *poor* South is a masterstroke against simple resource arguments. The land registry origin story perfectly forces the contingency/path dependence issue.
  *   **Weaknesses (Minimal & Mitigated):**
      *   *Could someone argue "Culture" based on corruption tolerance?* Unlikely. Point (a) states >90% in *both* think corruption is wrong. The difference is in *behavior*, not stated norms, which points back to enforcement/practice.
      *   *Does the clerk fluke make it *too* contingent?* That's the point! It forces students beyond deterministic factors. Part B allows them to explore *how* contingent it really might be.
      *   *Is "institutions" completely irrelevant?* No. The answer *is* about how rules are implemented. The case forces students to refine *what they mean* by institutions and confront the limitations of the term as a monocausal explanation.
  *   **Verdict:** Your case is **well-designed** and achieves your goals. It effectively "breaks" the memorized "institutions, geography, culture" essay by making the institutional difference itself contingent and demanding analysis of the gap between paper and practice. A memorizer regurgitating "institutions" without engaging critically with the case specifics, especially (d), will score poorly.
