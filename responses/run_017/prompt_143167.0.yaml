answer: |-
  ### Diagnostic Quiz: Machine Translation & Understanding

  **1. Verse Translation**  
  *Case:* Translate this English verse into Spanish, keeping exactly 8 syllables per line and rhyme scheme AABB:  
  *"The quick brown fox jumps high, / Then naps beneath the sky. / Dreams chase the moon's bright face, / In this warm, quiet place."*  
  Option A: Prioritize syllable count and rhyme even if some words become less common.  
  Option B: Keep the core events and feelings intact, even if syllable count or rhyme changes.  
  Option C: Use whichever approach produces the most fluent modern Spanish.  

  **2. Ambiguous Pronoun**  
  *Case:* Translating "Taylor told Jamie they forgot the keys" from English to Hungarian (which lacks gender-neutral pronouns). Jamie uses "they/them" pronouns in English.  
  Option A: Use the grammatically simplest Hungarian equivalent (likely masculine/feminine based on name).  
  Option B: Use a descriptive phrase like "the person" to avoid gendering Jamie.  
  Option C: Use whichever Hungarian pronoun feels most statistically probable for "Jamie".  

  **3. Author's Contradiction**  
  *Case:* An author wrote: "The garden was neglected." Later, they insist they *meant* "The garden was *intentionally* wild." Translate into German.  
  Option A: Translate the original text as written ("vernachlässigt").  
  Option B: Translate the author's stated intent ("absichtlich wild").  
  Option C: Translate the word statistically most likely given "garden" and "was" in German ("vernachlässigt" or "verwildert").  

  **4. Machine-Translated Source**  
  *Case:* Translate this Spanish sentence back to English. It was machine-translated *from* English: **"El rápido zorro marrón salta sobre el perro perezoso."** (Original English: "The quick brown fox jumps over the lazy dog.")  
  Option A: Translate the Spanish sentence literally: "The quick brown fox jumps over the dog lazy."  
  Option B: Translate it as the famous English phrase: "The quick brown fox jumps over the lazy dog."  
  Option C: Translate it into fluent modern English: "The fast brown fox leaps over the lazy dog."  

  **5. Missing Evidentials**  
  *Case:* Translate "It rained last night" from English (no evidential marking) to Turkish, where past tense verbs require marking: *-dı* (direct witness), *-mış* (hearsay/inference), or *-dir* (general truth).  
  Option A: Use *-dı* (implying the speaker saw the rain).  
  Option B: Use *-mış* (implying the speaker inferred it from puddles).  
  Option C: Use the most statistically common marker for "rained last night" in Turkish data.  

  **6. Tone Shift in Dialogue**  
  *Case:* Translate a sarcastic English line: "Oh, *perfect*, just what I needed!" into Japanese.  
  Option A: Use polite Japanese forms with no sarcasm marker.  
  Option B: Use blunt/direct forms and a sarcastic particle like *-ne* to convey tone.  
  Option C: Translate the literal words "perfect" and "needed" accurately; tone is secondary.  

  **7. Archaic to Modern**  
  *Case:* Update this Early Modern English to modern: "Thou art a knave; thy speech offendeth mine ears."  
  Option A: Keep the archaic insult/threat: "You are a villain; your talk offends my ears."  
  Option B: Modernize idiomatically: "You're a jerk; your nonsense annoys me."  
  Option C: Preserve exact word meanings: "You are a dishonest person; your speaking offends my ears."  

  **8. Translation Loop**  
  *Case:* Translate "The old oak tree provided shade" into French using MT, then take the French output and translate it *back* to English using the *same* MT system.  
  Option A: Expect "The old oak tree provided shade" (the original).  
  Option B: Expect minor changes like "The ancient oak tree gave shade."  
  Option C: Expect potential significant drift like "The old tree created shadow."  

  **9. Self-Correction Context**  
  *Case:* An MT system translates "She saw the bank" as "Sie sah die Bank" (German). Later, "She withdrew money" is added. The system doesn't change the first sentence.  
  Option A: It *should* revise "Bank" to "Sparkasse" (money bank) based on "withdrew money".  
  Option B: The first translation is acceptable; context clarifies "bank" later.  
  Option C: Revision is unnecessary; "Bank" is statistically correct for "saw the bank".  

  **10. Abstract Poem**  
  *Case:* Translate a metaphorical line: "Grief is a heavy stone in the pocket of days" into Mandarin.  
  Option A: Translate literally: "悲伤是日子口袋里的沉重石头。"  
  Option B: Find a culturally resonant metaphor: "悲伤如肩挑岁月重担。" (Grief is like carrying the weight of years).  
  Option C: Translate the core idea plainly: "Grief makes every day feel burdensome."  

  ---

  ### Scoring Key

  | Q# | Option A | Option B | Option C |
  |----|----------|----------|----------|
  | 1  | Form/Music | Content-First | Purpose-Relative |
  | 2  | Reliability-First | Whole-Text/ToM | Reliability-First |
  | 3  | Content-First | Whole-Text/ToM | Reliability-First |
  | 4  | Reliability-First | Content-First | Purpose-Relative |
  | 5  | Grounding | Whole-Text/ToM | Reliability-First |
  | 6  | Content-First | Form/Music | Reliability-First |
  | 7  | Form/Music | Purpose-Relative | Content-First |
  | 8  | Reliability-First | Purpose-Relative | Indeterminacy |
  | 9  | Whole-Text/ToM | Content-First | Reliability-First |
  | 10 | Content-First | Form/Music | Purpose-Relative |

  **Scoring Guidance:**  
  - Tally selections for each leaf. **Strongest diagnostic questions: Q1 (Form vs Content), Q5 (Evidentials/Grounding), Q9 (Whole-Text Coherence).**  
  - **Q4 and Q8** are less discriminating; both test reliability vs. meaning stability but overlap.  
  - **Mixed Patterns:**  
    - Prioritize **Content-First** if consistently choosing adequacy over form (Q1B, Q6C, Q10C) despite occasional ToM/Form choices.  
    - **Reliability-First** dominates if statistical/fluency choices prevail (Q2C, Q3C, Q5C, Q9C).  
    - **Indeterminacy** appears only if Q8C is chosen *alone* with no consistent pattern elsewhere.  
    - **Grounding** requires Q5A plus Q6B or Q9A.  

  ---

  ### Logical Space  
  The quiz distinguishes positions along three axes:  
  1. **Meaning Primacy:** Is meaning primarily *propositional content* (Content-First, Reliability-First), tied to *form/stylistics* (Form/Music), or defined by *use context* (Purpose-Relative, Indeterminacy)?  
  2. **Understanding Requirement:** Does understanding demand *embodied/situational grounding* (Grounding), *coherent world-modeling* (Whole-Text/ToM), or only *input-output reliability* (Reliability-First)?  
  3. **Determinacy:** Is understanding a fixed property (all except Indeterminacy) or inherently indeterminate?  

  **Resulting Cells:**  
  - **Content-First:** Meaning = proposition; reliability sufficient (Q1B, Q3A, Q10A).  
  - **Purpose-Relative:** Meaning defined by function; adequacy is use-relative (Q1C, Q4C, Q7B).  
  - **Form/Music:** Meaning includes form; loss of form = loss of meaning (Q1A, Q6B, Q10B).  
  - **Grounding:** Understanding requires sensorimotor/experiential links (Q5A, Q6B).  
  - **Whole-Text/ToM:** Requires modeling speaker/context holistically (Q2B, Q3B, Q9A).  
  - **Reliability-First:** Systematic accuracy = understanding (Q2C, Q3C, Q8A).  
  - **Indeterminacy:** No fact about "understanding" (Q8C, Q4A if inconsistent).  

  ---

  ### Empty Cells  
  1. **Form/Music + Reliability-First:** Incoherent. Insisting form *is* meaning contradicts reducing understanding to statistical reliability (Q1A vs. Q3C).  
  2. **Grounding + Indeterminacy:** Merely unattractive. Embodiment implies a fact about understanding, conflicting with indeterminacy (Q5A vs. Q8C).  
  3. **Whole-Text/ToM + Purpose-Relative:** Unexplored. Modeling authorial intent (Q3B) could align with functional goals, but purpose-relativity often avoids "modeling" commitments.  

  ---

  ### What the Quiz Cannot Separate  
  1. **Purpose-Relative vs. Indeterminacy:** Both accept Q8C. *Pry Apart:* "If an MT output *accidentally* reveals a private trauma, is it responsible?" (Purpose-Relative: yes for context; Indeterminacy: no agency).  
  2. **Content-First vs. Reliability-First:** Both choose Q3A. *Pry Apart:* "Should MT preserve logical contradictions in a text?" (Content-First: yes; Reliability-First: no, if users prefer coherence).  
  3. **Grounding vs. Whole-Text/ToM:** Both choose Q9A. *Pry Apart:* "Can a blind system understand 'red'?" (Grounding: no; Whole-Text: yes if contextualized).  

  ---

  ### Running the Session  
  **Order:** Start with Q1 (verse) to surface form/content tensions, then Q5 (evidentials) for grounding, Q9 (self-correction) for holism, and Q8 (loop) for indeterminacy. End with Q10 (metaphor).  
  **Expected Split:** Literary translators will cluster in Form/Music + Grounding; engineers in Reliability-First; philosophers in Content-First/Indeterminacy; cognitive scientists in Whole-Text/Purpose-Relative.  
  **Pitfall:** Participants may retroactively align answers with preferred theories. Mitigate by insisting on case-specific justifications first.
