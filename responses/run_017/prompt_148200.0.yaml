prompt: |-
  Dear ——,

  I wonder whether you can help me with something I have been unable to name to my own satisfaction. It came up again in last week's graduate seminar on well-being, and I would like to know whether there is an established concept for it, or whether it is genuinely unmarked territory that I should christen myself.

  Take three pleasures with nothing sensuous in common: the first swallow of ice water after a long run in the heat; the moment a proof that has resisted you for a week finally closes; hearing that a rival's paper has been rejected. I take the heterogeneity of such lists as given and do not need to be persuaded of it. My difficulty begins one step later.

  Every unifier I can get the seminar to accept turns out to do one job well and the other badly. The candidates that cover all three cases — being pleased that something is so, liking what is happening to you, wanting the experience to continue — are thin, structural, and non-qualitative. That thinness is exactly what lets them cover the whole range; and it is, as far as I can tell, the same thinness that leaves them unable to rank anything. The moment we ask how much pleasure is involved, the comparison is quietly made by something else: the intensity of the desire, the duration, or how much the object matters. Worse, in my own three cases the thin unifier seems to give the wrong answer outright. Drink more ice water and the first pleasure is destroyed by satiation, so it is not plausibly a pleasure you want continued. The proof's pleasure is completed and thereby ended, so what is wanted is not its continuation but its consummation. And the malicious case may involve the strongest desire of the three and the least that we are inclined to count as pleasure at all.

  So: a unifier whose power to include every case is bought at the cost of its power to discriminate among them, with the consequence that comparisons get run on a borrowed scale. Is there a name for this, and if so, how are its edges drawn?

  Let me say what I think it is not, since that is where I expect to be misunderstood. It is not the familiar objection that pleasures share no common quality: that objection is a demand for some shared property, and the thin unifiers I am complaining about satisfy it. It is not Mill's distinction between higher and lower pleasures: that is a claim about kinds, and it seems to presuppose that pleasures can still be compared in amount within and across those kinds. It is not the experience-machine style worry that we care about more than how our lives feel from the inside: that concerns whether pleasure is all that matters, not what our hedonic comparisons track. And it is not plain incomparability: I am not claiming such comparisons cannot be made, only that when they are made they are made by proxy.

  If nothing fits, I would like a term with a definition, a list of the neighbouring phenomena it must be distinguished from, and a verdict on whether the trade-off is really a defect — since it is open to someone to argue that hedonic comparison was always meant to be proxy-driven, and that an appeal to the preferences of those acquainted with both pleasures is already a concession of that. A bare label, in either case, will not help me.
reasoning: |-
  Okay, this is a rich and nuanced philosophical query about pleasure and its unification. The user presents three distinct pleasures - physical relief, intellectual triumph, and schadenfreude - and observes that while thin concepts like "being pleased that" or "wanting to continue" can cover all cases, they fail to capture qualitative differences or enable meaningful comparison. 

  The user has clearly done their homework: they've anticipated and dismissed several standard objections (no common quality, Mill's hierarchy, experience machine). What they're really wrestling with is the structural problem of how a concept can be broad enough to include all pleasures yet precise enough to rank them. That gap where comparison gets outsourced to proxies like intensity or duration is the core concern.

  Hmm... the closest existing concept might be Ryle's "mongrel-category" critique, but that's more about heterogeneity than the comparison problem. The trade-off between extension and discrimination recalls trade-offs in taxonomy - think how "fruit" works biologically vs culinarily - but pleasure lacks those clear criteria. 

  For naming, "Hedonic Proxy Problem" captures the outsourcing aspect. Need to distinguish it from: (1) simple heterogeneity (which they've already set aside), (2) scalar failure (where comparisons break entirely), and (3) externalism (where judgments depend wholly on observers). 

  The defect question is thorny. Bentham would call the proxy feature a virtue - his felicific calculus embraces quantifiable proxies. But for qualitative hedonists, it's fatal. Might argue the defect emerges only if we insist pleasure is both unified and rankable - perhaps those are competing desiderata. 

  User's rigor is impressive. They've boxed the problem perfectly: if unification is structural, comparison can't be qualitative. The letter practically writes itself - just need to polish the "hedonic proxy" framing and flag that some philosophers would see the proxy as legitimate.
answer: |-
  Your inquiry brilliantly isolates a genuine conceptual gap in pleasure theory—one that has resisted clean resolution despite centuries of debate. The phenomenon you describe lacks a single established name, but it intersects several recognized problems. I propose **hedonic proxy failure** as a precise term, defined as follows:  

  ### **Hedonic Proxy Failure**  
  *The systematic inadequacy of a formally unifying account of pleasure to ground qualitative comparisons between heterogeneous pleasures, forcing recourse to extrinsic metrics (e.g., intensity, duration, desire strength) that may misrepresent the phenomenology.*  

  ---

  ### **Core Diagnostics & Boundaries**  
  1. **What it is NOT**:  
     - **Heterogeneity Objections** (e.g., Sidgwick, Feldman): These deny a *shared property* across pleasures. Your concern arises *after* accepting a unifier (e.g., "being pleased that P").  
     - **Millian Hierarchy**: Distinguishes "higher" intellectual from "lower" sensory pleasures but assumes *intra-kind* comparability. Your cases fail even *within* kinds (e.g., two intellectual pleasures: QED satisfaction vs. schadenfreude).  
     - **Experience Machine Concerns** (Nozick): About whether pleasure *matters*, not how we compare it.  
     - **Incomparability Theses** (Raz): Claims pleasures *cannot* be compared. You note they *are* compared—but via proxies.  

  2. **Neighboring Phenomena to Distinguish**:  
     - **Pleasure’s Formal Unity** (e.g., Feldman’s "attitudinal pleasure"): Agrees pleasure is "being pleased about states of affairs," but ignores your critique that this unity is inert for ranking.  
     - **Proxy Legitimacy** (Benthamite calculus): Holds that duration/intensity *are* valid comparators. Your objection: these proxies distort (e.g., schadenfreude’s high desire-strength ≠ high pleasure).  
     - **Completion vs. Continuation**: Satiation (water) and consummation (proof) show "wanting to continue" fails as a universal marker.  

  ---

  ### **Is the Trade-Off a Defect?**  
  - **Yes, if** you hold that pleasure must be *intrinsically rankable*: If pleasure names a unified phenomenological class, comparisons should track felt character, not extraneous factors. The proxy’s dominance suggests the unifier is merely semantic.  
  - **No, if** you are a *hedonic pluralist*: Some (e.g., Crisp, Heathwood) argue pleasure is a "family-resemblance" concept. Proxies aren’t failures but necessary tools for comparing distinct states.  
  - **Middle Ground**: The defect is real but inescapable. Parfit’s "imprecise comparability" might apply: pleasures admit rough rankings only by aggregating proxies, but no single scale suffices.  

  ---

  ### **Why Existing Frameworks Fall Short**  
  - **Desire Theories** (e.g., Brandt): Reduce pleasure to "what we want to sustain," but your cases show desires can dissociate from pleasure (e.g., satiation).  
  - **Felt-Quality Theories** (e.g., Smuts): Posit a common "hedonic tone," but cannot explain how we compare tones across domains (water vs. proof).  
  - **Evaluation Theories** (e.g., Scanlon): Pleasure as "taking positive attitude toward X." This unifies but, as you note, cannot rank without importing values (e.g., "how much X matters").  

  ---

  ### **Pathways Forward**  
  1. **Christen "Hedonic Proxy Failure"**: It captures the *structural* flaw in your seminar’s thin unifiers. The "failure" is their inability to perform both unification *and* discrimination.  
  2. **Reframe the Problem**: Reject the assumption that pleasure must be unitary. Adopt a **disjunctive theory** (Rachels): "Pleasure" refers to *water-satisfaction*, *proof-closure*, *schadenfreude*, etc., each with its own ranking criteria. Comparisons then require contextual norms.  
  3. **Embrace Proxy-Dependence**: Argue (with Bentham) that duration, intensity, and "fecundity" *are* the true dimensions of comparison—but admit this abandons phenomenological unity.  

  This impasse reveals a deeper truth: "Pleasure" may be a **nominal kind** (unified by language) not a **natural kind** (unified by essence). If so, your rival’s rejected paper might bring more pleasure than ice water—but only because we’ve agreed to measure by smirk-intensity, not relief. Naming the problem is the first step to solving it.
