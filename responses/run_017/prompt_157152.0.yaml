answer: |-
  1. Open with the vacuum robot example: objective is a clean house, metric is grams of dirt collected; optimizing for dirt leads the robot to repeatedly sweep a dusty garage, neglecting the now-dirtier living room—this shows optimization pressure breaking the metric, not lazy humans or intent. (6 min)  
  2. Define Goodhart's Law: "When a measure becomes a target, it ceases to be a good measure," emphasizing this stems from structural incentives, not malice—use the robot's garage-focus to illustrate. (3 min)  
  3. Introduce three failure modes via the robot: adaptive response (robot changes behavior to exploit measurement), extrapolation failure (pushing dirt collection beyond its valid range—garage vs. whole house), and causal misalignment (dirt collection isn’t causal for cleanliness; it’s coincidental—e.g., if dirt came from outside, cleaning doesn’t stop more dirt). Name these terms only after the example. (10 min)  
  4. Head off the "bad metric" misconception immediately after definitions: stress that all three failures can occur even with initially reasonable metrics, using the robot’s initially valid correlation (dirt collected ≈ cleanliness in balanced operation). (4 min)  
  5. Contrast with a vulnerable PM/ops example: customer support judged on call duration—short calls (adaptive response) rush customers, violating satisfaction (causal misalignment), and 5-second calls break the metric’s validated range (extrapolation failure). Avoid news-ranking; it muddies with engagement debates. (6 min)  
  6. Actively refuse "hiding the objective" fixes during mitigation talk: state, "We won’t cover rotating metrics or secret targets—they create opacity and don’t fix proxy flaws," redirecting to better solutions like ensemble metrics. (3 min)  
  7. Run a 4-minute paired exercise: engineers and non-coders team up to name one team metric and brainstorm how adaptive response/extrapolation could break it—e.g., "user sign-ups" might incentivize spam (adaptive) or attract low-value users (extrapolation). (7 min)  
  8. Close with a silent check: have each person write their own metric and ✗ one failure mode it’s vulnerable to; skim responses to confirm they distinguish causal misalignment (✗ = proxy/target link is coincidental), extrapolation (✗ = pushed beyond safe zone), and adaptive response (✗ = system fights back). (6 min)  

  ---  
  **Key settles**:  
  - **Example**: Vacuum robot beats support-ticket/news; it lacks human intent, avoids engagement debates, and cleanly demonstrates all three failure modes.  
  - **Hiding objectives**: Cut it during mitigation (step 6). It risks teaching opacity as a solution, contradicts transparency needs, and distracts from core mechanics.  
  - **Failure mode timing**: Introduce terms *after* the robot example (step 3), using it to define all three—naming them earlier adds premature jargon. All three fit in 45 mins via integrated examples.  
  - **Room-specific traps**: Engineers will blame "bad metrics"—preempt in step 4. PMs will seek "clever fixes"—shut down in step 6.
