  Hmm, this is a complex and sensitive teaching request about designing a seminar on slurs without using actual slurs. The user is clearly an experienced philosophy of language instructor who wants students to discover the tension between semantic and pragmatic accounts of slur behavior through experiential learning.

  Breaking this down, I see several key requirements:
  - Need concrete mechanics for an 80-minute session with 16 upper-level undergraduates
  - Must avoid actual slurs while creating genuine normative tension
  - Requires discovery-based learning where students generate observations
  - Must handle consent/opt-out protocols carefully
  - Needs to prevent discussion from collapsing into "slurs are bad" morality
  - Must acknowledge and counter inherent biases in the design

  The user has already done excellent conceptual groundwork by identifying the two families of behavior they want students to experience: the linguistic robustness of slurs (projection, non-cancelability) versus the speaker-relativity of offensiveness. The challenge is creating this phenomenology artificially.

  For the slur-avoidance methods, I'm considering:
  1. Nonce terms (invented words): Can manufacture charge through ritual but risks feeling artificial
  2. Mild existing pejoratives (e.g., "nerd"): More authentic charge but may not demonstrate harm asymmetry
  3. Reported speech about real slurs: Safest ethically but puts burden on students

  The nonce term approach seems most feasible if we establish strong classroom norms first. For consent, I'll build in multiple opt-out points and anonymous participation options. To prevent tokenism, I'll avoid making any student represent a group.

  The session design needs to create situations where:
  - Students attempt to report slurs "neutrally" and fail
  - They discover projection through negation/embedding tests
  - A speaker-identity shift changes the acceptability

  I'll structure it in phases: norm-setting, charge creation, reporting exercises, speaker shift, then debrief. The payoff comes from students experiencing the pragmatic failure firsthand.

  For bias: The design likely favors pragmatic accounts since we're manufacturing meaning. I'll counter this in debrief by highlighting how real slurs have stable semantic features across contexts.

  Predictable failures:
  - Students dismissing it as "just politeness"
  - Refusal to participate seriously
  - Missing the projection patterns
  - Mistrusting the speaker-shift moment

  I'll prepare mitigation tactics for each. The debrief must explicitly name what's missing: historical weight, harm asymmetry, and euphemism treadmill dynamics that can't be simulated.

  This balances experiential learning with ethical constraints while maintaining philosophical rigor. The key is making the artificial tension feel real enough to generate authentic insights.
answer: |-
  Below is a complete, ready-to-run seminar design focused on the tension you describe. It uses a **mild existing pejorative** as the vehicle (e.g., "townie," "normie," or "civvie"—terms for non-university locals, non-subculture members, or civilians, respectively). I select this over alternatives for balance:  
  - *Nonce terms* (e.g., "glarp") fail—manufactured charge feels artificial and lacks the required normative weight.  
  - *Remembered encounters* risk trauma, tokenism, and uneven participation.  
  - *Mild pejoratives*: Low-stakes but *genuinely* charged for undergrads (e.g., "townie" implies class/cultural division), allowing projection/cancellation tests without harm. **Switching condition**: If pre-survey shows >3 students report being targets of the chosen term, use "civvie" (civilian vs. military/gamer) instead.  

  **Session Goal**: Students experience the **tension** between linguistic robustness (charge persists in embeddings) and speaker-relativity (in-group use neutralizes).  

  ---

  ### **SESSION DESIGN: "REPORTING DIFFICULT WORDS"**  
  **Materials**: Whiteboard, index cards (16), timer, printed role cards (2 sets).  
  **Consent Protocol**:  
  1. **Pre-session email (Day before)**: "Tomorrow we’ll explore how *charged language* behaves in reporting. A mild term (e.g., 'townie') will be used. You may opt out of any activity anonymously—place a red card on your desk."  
  2. **Opening minute**: Reiterate opt-out (red card = pass). Acknowledge: "If this term applies to you, your expertise is valued but not demanded."  

  ---

  #### **TIMELINE (80 MINUTES)**  
  **PART 1: SETUP & CHARGE ACTIVATION (15 MIN)**  
  - **(0-2 min) Framing**: "We’re investigators studying how *reporting* language works. No terms are banned here, but we’ll use care."  
  - **(2-7 min) Norm Creation**:  
    - Brainstorm "terms for outsiders to your subculture" (e.g., gaming, academia). List suggestions.  
    - **Select vehicle**: Pick the most charged term from the list (e.g., "townie"). Define it neutrally: "A non-student local resident."  
    - **Activate charge**: "Show of hands: Who’d feel uneasy calling someone this to their face?" Discuss *why* briefly (e.g., "Feels dismissive").  
  - **(7-15 min) Baseline Test**:  
    - *Direct use*: "Imagine your friend Ana says, *‘Bo is a townie.’* How would Bo feel?" → Consensus: Offended.  
    - *Cancellation test*: "What if Ana adds, *‘...but I mean nothing derogatory’*?" → Students agree: Still offensive.  

  **PART 2: REPORTING & FAILED ESCAPE HATCHES (30 MIN)**  
  - **(15-20 min) Indirect Reporting Task (Pairs)**:  
    - **Prompt**: *“Report Ana’s statement neutrally to your partner. Use: ‘Ana said that Bo is a ___.’”*  
    - **Catch**: They must say the *exact phrase* aloud with the term.  
    - **Outcome**: Hesitation, hedging ("um... a *townie*?"). Debrief: "Why hard to say?" → "Feels like *I’m* insulting Bo."  
  - **(20-25 min) Scare Quotes/So-called (Solo Writing)**:  
    - Write: *"Ana said Bo is a ‘townie’”* and *"Ana called Bo a so-called townie.”*  
    - Share anonymized quotes. Students note: Still uncomfortable; quotes feel sarcastic.  
  - **(25-30 min) Projection Demonstration (Whole Group)**:  
    - Test: *“If Bo is a townie, he won’t get the reference.”* → "Does this still feel rude about Bo?" (Yes).  
    - *“Is Bo a townie?”* → "Is asking this offensive?" (Yes).  
  - **(30 min) Pivot Point**: "What if *Bo himself* says it?"  

  **PART 3: SPEAKER-SHIFT & NEUTRALIZATION (20 MIN)**  
  - **(30-40 min) Role Play (Small Groups)**:  
    - **Roles**: *Speaker* (self-identifies as "townie"), *Reporter*.  
    - **Prompt**: *Speaker says: “I’m a townie and proud!” Reporter tells group: “[Speaker] said that she is a ___.”*  
    - **Outcome**: Reporters easily use the term; group agrees it feels neutral/positive.  
  - **(40-45 min) Contrast**: Re-test cancellation with in-group speaker: *“I’m a townie, but I don’t mean it negatively.”* → Consensus: Feels redundant, not offensive.  
  - **(45-50 min) Synthesis**: Whiteboard two columns:  
    > **When Outsider Says It** | **When Insider Says It**  
    > Cancellation fails | Cancellation works  
    > Reporting feels risky | Reporting feels neutral  

  **PART 4: DEBRIEF & MAPPING (15 MIN)**  
  - **(50-60 min) Elicit Observations**: "What patterns did we see?" Guide to:  
    - *Robustness family*: Charge survived quoting/negation/conditionals (link to Part 2).  
    - *Speaker-relativity family*: Charge vanished with in-group use (Part 3).  
  - **(60-70 min) Introduce Terminology**: **"First family"** = presupposition-like behavior (projection, non-cancelability). **"Second family"** = sensitivity to user identity. Still avoid *semantic/pragmatic*.  
  - **(70-75 min) Predictable Problems & Mitigation**:  
    - *"Just politeness"*: Redirect to *"Why don’t escape hatches work?"* (e.g., quotes failed).  
    - *Refusal to play*: Red cards honored; assign observer role ("Track where the discomfort is").  
    - *Disengaging from projection*: Use concrete examples ("Was *if* statement offensive?").  
    - *"Speaker-shift trick"*: Contrast: "Did the *word* change? Or the context?"  
  - **(75-80 min) Limitations & Counter-bias**:  
    - **Unreproduced features**: History, harm asymmetry, euphemism treadmill. State explicitly: *"Real slurs carry weight we can’t replicate. Here, offense is low-stakes and reversible—unlike systemic oppression."*  
    - **Design Bias**: Favors **pragmatic/speaker-relativity view** (charge is use-sensitive) because we *manufactured* the charge socially.  
    - **Counter-bias (Last 5 min)**: Argue: *"In our exercise, the word felt ‘tainted’ even in reports. Could that taint be part of its meaning? Why didn’t quotes scrub it clean?"*  

  ---

  ### **WHY THIS WORKS**  
  - **Phenomenology without harm**: Mild pejorative provides genuine discomfort in reporting (revealing projection/non-cancelability) but allows safe in-group reversal.  
  - **Discovery-based**: Students *fail* to report neutrally before speaker-shift, making the tension visceral.  
  - **Constraint compliance**: No slurs; opt-outs; avoids tokenism/morality debates.  
  - **Bias managed**: Explicitly naming the design’s pragmatic lean and ending with a semantic challenge balances exploration.  

  **Run it cold**—avoid priming. The discomfort in Part 2 is the data. Tuesday-ready.
