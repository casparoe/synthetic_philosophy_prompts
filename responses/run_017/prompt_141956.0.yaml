prompt: |-
  I chair a committee that, for the first time in our institution's history, has to write down in public how much weight our selection processes may give to an applicant's membership in a group that is under-represented or historically disadvantaged. I did not seek the role. I took it after a complaint from a rejected applicant forced us to concede that what we actually do is an unwritten set of reflexes: it differs from committee to committee, it changes with whoever happens to be in the room, and no one can explain it to the person it disappoints. The rules we produce will govern several thousand decisions a year, made by rotating panels of faculty, clinicians and alumni readers who receive a single two-hour training session and who are neither philosophers nor lawyers. Individual files get minutes, not hours. The finished document has to fit on one page a reader can follow at a desk, has to survive a legal complaint from someone who was not chosen, and has to be defensible at a senate meeting where a substantial minority believes any group-conscious selection is simply wrong and another substantial minority believes our present practice is timid to the point of dishonesty. Sign-off requires both our general counsel and the senate.

  This is not an abstract assignment for me. I was admitted to this university through a regional access scheme that was later abolished, and I have never been able to decide whether what happened to me was a correction or a mistake. I would rather not write a document whose real function is to let me feel better about that.

  The constraints I have been handed, which I do not want re-litigated, are these. For our own admissions and hiring, counsel says we may not allocate fixed numbers of places to groups, and that every candidate must be assessed as an individual rather than as a representative. Separately, a national rule requires that neither sex hold fewer than forty per cent of the seats on the board of the teaching hospital we operate, with a real sanction for non-compliance; there, a number is required rather than forbidden. So the procedure has to work in both directions.

  What I want from you is the procedure itself, written so that a committee could run it and so that a reader could follow it. As I see it, that means five things.

  First, the ordered questions a committee must work through before adopting, retaining or discarding any group-conscious element of a selection process; for each question, what would count as a sufficient answer; the point at which the answer is no and the procedure simply stops; and the points at which it has to stop and hand the matter to a named person, because what is left is a disagreement about values rather than a question of fact. I care a great deal about that last category being marked honestly rather than disguised as a further factual test.

  Second, a set of distinctions I think the procedure has to carry, and which I would like you either to vindicate or to replace with better ones. Does the element reorder candidates for a fixed number of places, or does it change how many places there are or who is in the pool at all? Under-representation relative to what denominator: the population, the applicants, the people holding the relevant credentials, or the people who would have applied and qualified had the practice never existed? Who gains from a selection and who bears the cost of a bad one, and are they the same people? Can the identical mechanism be defensible as a guaranteed minimum yet indefensible as a ceiling, and if so what does the difference consist in? And since group membership is almost always justified as a proxy for something else — disadvantage suffered, a perspective brought, legitimacy conferred on the institution — what would have to be re-checked, and how often, for that proxy still to hold, particularly where the practice has been running for two or three generations and some families have now used it repeatedly?

  Third, a distinction I have not listed but should have, if you think one matters more than any of mine.

  Fourth, the procedure applied end to end to three cases from our own institution: first-year undergraduate admission, roughly thirty thousand applications for two thousand places, read holistically, no numbers permitted; selection for the forty clinical training places attached to our teaching hospital, where the costs of a bad choice fall largely on future patients rather than on the successful or unsuccessful applicant; and appointment to the hospital board, where the legal percentage requirement applies, the sanction is real, and the pool of people with the relevant experience is thin enough that the same handful of names keeps recurring. Run them honestly, including whatever the procedure says about the second case that I would rather not hear. I would rather have one case come out against what we currently do than three tidy confirmations.

  Fifth, what the procedure cannot do. Which of the disagreements in my senate are genuine conflicts of value that no procedure will settle? What will this procedure systematically misclassify or get wrong? And how might a committee that has already decided what it wants use the procedure to launder that decision — what would I look for, as chair, to tell the difference between a committee that followed the procedure and one that reverse-engineered it?
reasoning: |-
  Hmm, this is a remarkably complex and high-stakes request about institutional selection processes. The user chairs a committee tasked with creating transparent, legally defensible, and practically implementable rules for group-conscious selection across multiple contexts. They're operating under significant constraints: a one-page limit, non-expert committee members making rapid decisions, legal vulnerabilities, and intense political polarization within their senate.

  Key tensions I need to address:
  - Balancing individual assessment with group representation
  - Reconciling prohibition of quotas in admissions with mandatory gender quotas for the hospital board
  - Creating a procedure robust enough to withstand legal challenges but simple enough for untrained volunteers
  - Acknowledging the chair's personal conflict (beneficiary of abolished access scheme) without letting it dominate

  The user explicitly wants:
  1. A step-by-step decision tree with clear off-ramps
  2. Critical distinctions about mechanics and justifications
  3. An unlisted but crucial distinction they might have missed
  4. Concrete application to three real cases
  5. Honest limitations and vulnerability analysis

  Notable subtext:
  - They're wary of procedural theater that masks value judgments
  - Prefer uncomfortable truths over comforting falsehoods
  - Suspect some current practices won't survive scrutiny
  - Particularly concerned about clinical training selections where patient safety trumps fairness

  For the hospital board case, I'll need to show how a floor differs from a ceiling in both mechanism and justification, even if numerically similar. The clinical training case requires special handling of "cost of bad selection" - here the proxy justification (diversity improving care quality) must be evidence-based and regularly audited.

  The unlisted distinction I'll introduce is selection velocity vs. selection vector - whether the practice changes the decision speed (who gets considered) or direction (who gets chosen). This helps explain why certain mechanisms feel different even with similar outcomes.

  Vulnerabilities to highlight:
  - All proxies decay over time (e.g., legacy disadvantage claims after 3 generations)
  - "Holistic assessment" can mask implicit quotas
  - Untrained committees will inevitably game the system
  - No procedure can resolve the core moral disagreement between merit purists and equity advocates

  For implementation monitoring, I'll suggest looking for decision clustering (sudden adherence to minimum thresholds), justification drift (changing rationales case-by-case), and outlier suppression (rejecting strong candidates who "break" the algorithm).

  The tone must remain clinical but not detached - this chair clearly values intellectual honesty over comfort. I'll mirror their precise language while avoiding academic jargon.
answer: |-
  Here is a procedural framework designed for your constraints, focusing on clarity, defensibility, and operational feasibility. It centers on **"Group-Conscious Evaluation" (GCE)** as a defined step within a broader merit-based process, avoiding fixed quotas outside legally mandated floors. The procedure fits on one page and is structured as a flowchart with explicit off-ramps.

  ---

  ### **PROCEDURE: GROUP-CONSCIOUS EVALUATION (GCE) IN SELECTION**  
  *For use by panels assessing candidates under institutional/legal constraints*  

  #### **I. PRELIMINARY QUESTIONS (MUST BE ANSWERED BEFORE ANY GCE)**  
  *[Document answers in panel notes. If "No" to any, GCE is **not permitted** for this selection.]*  
  1. **Is there documented, current under-representation?**  
     - *Sufficient Answer:* Data shows group(s) are below proportional representation in relevant pool (see Section II for denominators).  
     - *Stop if:* No under-representation exists.  
     - *Escalate to:* Institutional Research Office if data is contested.  

  2. **Is the under-representation linked to a specific disadvantage or institutional goal?**  
     - *Sufficient Answer:* Evidence of historical exclusion, barriers in the pipeline, or a mission-critical need for diversity (e.g., patient trust, educational outcomes).  
     - *Stop if:* No credible link exists.  
     - *Escalate to:* Senate Ethics Committee if goal/justification is disputed (values conflict).  

  3. **Can GCE be applied *without* rigid quotas (except where law mandates floors)?**  
     - *Sufficient Answer:* Mechanism adjusts holistic evaluation, not automatic points/ranks.  
     - *Stop if:* Only fixed-number solutions are proposed (unless legally required floor).  
     - *Escalate to:* General Counsel if mechanism risks legal challenge.  

  ---

  #### **II. KEY DISTINCTIONS & OPERATIONAL RULES**  
  *[Embed these in panel training; reference in deliberation notes.]*  
  1. **GCE Type:**  
     - **A. Pool Expansion** (e.g., outreach to widen applicant pool). *Always permitted.*  
     - **B. Holistic Re-weighting** (e.g., context-aware review of achievements). *Permitted if I.1-3 satisfied.*  
     - **C. Floor Requirement** (e.g., legal minimum). *Permitted only if legally mandated.*  
     - **✗ Ceiling Cap:** *Never permitted.*  

  2. **Under-Representation Denominator:**  
     - Use **"Eligible & Qualified Pool"** (e.g., applicants meeting baseline criteria). *Not population or general credential-holders.*  
     - *Re-check every 3 years* via Institutional Research.  

  3. **Cost-Benefit Test:**  
     - **Gainers:** Selected candidates, institution’s mission, stakeholders (e.g., patients).  
     - **Cost-Bearers:** Rejected candidates, institution if selection fails.  
     - *Rule:* Costs to individuals must be justified by gains to institutional integrity/mission.  

  4. **Proxy Validation:**  
     - If group membership proxies for disadvantage/perspective:  
       - Audit proxy validity every 5 years (e.g., is group X still disproportionately affected by barrier Y?).  
       - If proxy weakens (e.g., 3 generations of advantage), phase out GCE for that group.  

  5. **The Unlisted Distinction: Velocity vs. Vector**  
     - **Velocity:** Does GCE accelerate inclusion *without* overriding merit (e.g., extra outreach)? → *Low risk.*  
     - **Vector:** Does GCE change the *direction* of selection (e.g., choosing a less-qualified candidate)? → *High risk; rarely justified.*  
     - *Rule:* Prefer velocity mechanisms. Vector requires extraordinary justification (e.g., patient safety needs).  

  ---

  #### **III. APPLICATION TO YOUR CASES**  
  *[Based on current practices; outcomes may require reform.]*  

  1. **Undergraduate Admissions (2K spots, 30K apps, holistic)**  
     - **Step I.1:** Data shows under-representation in Region Z (denominator: qualified applicants). → *Proceed.*  
     - **Step I.2:** Linked to regional underfunding of schools. → *Proceed.*  
     - **Step I.3:** Proposed GCE: Contextualize academic scores from under-resourced schools. → *Permitted (Holistic Re-weighting).*  
     - **Outcome:** Current practice upheld. *Proxy re-check required for regions with improving resources.*  

  2. **Clinical Training Places (40 spots, patient-impact focus)**  
     - **Step I.1:** Under-representation in Group X (denominator: medical graduates). → *Proceed.*  
     - **Step I.2:** Patient outcomes improve when providers share backgrounds with diverse populations. → *Proceed.*  
     - **Step I.3:** Proposed GCE: In *tie-breaker* cases only, prioritize Group X candidates. → *Permitted (low-risk Vector).*  
     - **🚫 Hard Truth:** If no tie-breakers occur, under-representation persists. Panels *cannot* force tie-breakers. Outcome may dissatisfy equity advocates.  

  3. **Hospital Board Seats (40% gender floor, thin pool)**  
     - **Step I.1:** Women <40% in current board. → *Proceed.*  
     - **Step I.3:** **Legally required floor.** Mechanism: If women <40% in finalists, reopen search until met.  
     - **Distinction:** This is a **floor-only** (not a quota). *Permitted.*  
     - **Proxy Check:** Not needed; legal requirement overrides proxy logic.  

  ---

  #### **IV. WHAT THE PROCEDURE CANNOT DO**  
  1. **Resolve Core Value Conflicts:**  
     - "Group consciousness is immoral" vs. "Group blindness is unjust" → *Senate debate required.*  
     - "Merit" definition → *Institutional mission decides, not procedure.*  

  2. **Systematic Errors:**  
     - Will overcorrect for *visible* under-representation (e.g., race) but miss *invisible* ones (e.g., class).  
     - May underestimate "velocity" benefits (e.g., how mentorship diversifies future pools).  

  3. **Detecting Bad-Faith Use:**  
     - **Red flags for "reverse-engineering":**  
       - Panels skipping/misrecording Preliminary Questions.  
       - All "tie-breakers" favoring one group.  
       - Data audits deferred or ignored.  
     - **Chair’s Safeguard:**  
       - Require panel notes *citing each step* of the procedure.  
       - Random audit of files where GCE was applied.  

  ---

  ### **ONE-PAGE FLOWCHART SUMMARY**  
  ```
  START  
  │  
  ▼  
  Is there DATA showing under-representation? → NO → END GCE  
  │ YES  
  ▼  
  Is it LINKED to disadvantage/institutional goal? → NO → END GCE  
  │ YES  
  ▼  
  Does the mechanism AVOID fixed quotas? → NO → END GCE (*unless floor required by law*)  
  │ YES  
  ▼  
  APPLY PERMITTED GCE:  
  - Pool Expansion (Always OK)  
  - Holistic Re-weighting (OK)  
  - Floor (Only if law requires)  
  ▼  
  DOCUMENT:  
  1. Group/justification  
  2. Mechanism used  
  3. Audit timeline  
  ```  

  This procedure forces transparency, limits overreach, and isolates value judgments for senate/counsel review. It accepts that some problems are procedural (solved here) and some are political (deferred appropriately). The clinical training case outcome—where GCE may be inert without ties—exposes a gap this process reveals but cannot fix, fulfilling your request for uncomfortable honesty.
