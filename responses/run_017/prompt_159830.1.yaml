prompt: |-
  you are a professional philosopher of science — someone who has spent years on inter-theory reduction, the special sciences, and the metaphysics of emergence, but who also reads press releases and knows how the word gets abused. please think carefully and take your time. before you write the final answer, do a private brainstorm: dump twelve to fifteen candidate requirements that somebody or other has demanded of an account of emergence, then prune hard — keep only the ones you can back with a concrete case — and at the very end tell me which candidates you threw out and why. step by step, no rush, and don't hedge everything into mush.

  here's the situation. i'm a journalist covering science and ideas, and i get maybe two embargoed studies a month where the key word is emergent. ant colony foraging trails. a convection cell. superconductivity. some protein folding thing. a new large language model capability. occasionally consciousness. half the time i think emergent is doing real work and half the time it's just a fancy way of saying complicated and surprising, and my editor wants an actual house rule for when we're allowed to print it with a straight face. last week we nearly ran a line about a swarm of robots having more-than-the-sum-of-its-parts behavior and i couldn't articulate what would have to be true for that to mean anything.

  so what i want from you is the spec, not a survey. write me the desiderata: what any adequate account of emergence has to deliver to count as saying something, with the case or consideration behind each requirement, and mark each one non-negotiable, negotiable, or a prejudice of one camp. i'll say up front what it has to be adequate *for*, since i gather that matters: i need criteria that let a non-specialist decide whether a scientific claim of emergence is substantive, or whether it's a shrug in a lab coat. not criteria for settling a metaphysics seminar — criteria for deciding what's worth printing and what questions to ask the researcher on the phone.

  the cases i want handled, at minimum (add better ones if you have them):

  - temperature and pressure, where we all feel like we understand exactly how the macro quantity comes from the micro one, versus something like the wetness of water, where the macro property seems to have no home at the micro level at all
  - a glider in the game of life: perfectly determined by the micro rules, completely invisible in them, and causally active at its own scale
  - a hurricane, or a convection cell: persists while its constituent matter turns over completely, and only exists while energy is flowing through it
  - a traffic jam, or an ant foraging trail: a macro pattern that individual members respond to and that none of them represent, and that survives the total replacement of its parts
  - protein folding, where you can in principle simulate every atom and still not have explained why *this* fold, and where the same fold shows up in chemically quite different sequences
  - the maximal case people actually care about: consciousness, where a good chunk of the audience is hoping emergence does metaphysical work
  - a gerrymandered whole: my hurricane plus one specific nitrogen molecule over the sahara. nothing interesting is true of that conjunction, but i want to know which plausible criteria accidentally let it in, and what has to be added to keep it out
  - the reverse direction: spacetime, or the micro laws themselves, being emergent from something deeper. i don't want a definition that is quietly scale-chauvinist and builds in that small things are the base and big things are the emergent ones

  distinctions i want the account to respect rather than collapse: emergent-for-us versus emergent-in-itself; emergence versus mere complexity or surprise; emergence versus outright inexplicability; the property being emergent versus the object or system; and the big one — irreducible-because-unpredictable versus irreducible-because-not-derivable-even-with-bridge-principles versus irreducible-because-having-novel-causal-power-of-its-own. those three get run together constantly in the copy i read and i want them prised apart.

  there are also three tests my newsroom has been kicking around that i suspect are partly garbage, and i want your verdict on each, separately: (1) the laplace test — nothing counts as emergent unless a demon with complete micro facts and unlimited computing power still couldn't have predicted it; (2) the swap test — if you can swap out the substrate and keep the macro variable and the pattern still holds, that's the mark of the emergent; (3) the funding test — a genuine emergence claim is one that licenses a separate science with its own laws and its own budget, rather than more application of the base science. for each: genuine desideratum, defensible-but-optional, or prejudice dressed up as a requirement? and are any two of them secretly the same requirement wearing hats?

  then the part i most want. flag any pair of desiderata you think can't be jointly satisfied. i'm especially suspicious of the tension between a macro phenomenon having genuinely novel causal power of its own and the micro-level story being causally complete — if the micro facts already fix everything and already do the causing, it's unclear what causal work is left, and i want you to say whether that means the list is jointly unsatisfiable and something has to give, or whether there's a formulation that survives. i also want the tension between emergence requiring genuine surprise and emergence being something a theory can explain and predict. if the list as a whole can't be satisfied, say so plainly — that's a result i can use.

  after that, tell me which *single* requirement does the most work in excluding candidate accounts, i.e. which one is doing the real filtering, and which requirements are the ones people only demand because they already like a certain theory.

  finally, and keep this short because it's not the main event: a compact scorecard, one or two sentences each, no more, on how the familiar stances do against your list — reductionism-with-bridge-principles, strong emergence with genuinely new fundamental laws, the it's-all-about-models-and-coarse-graining line, and emergence-as-multiple-realizability. a block at the end is fine.

  format it as numbered requirements with a short motivating case under each and a verdict line per requirement. and seriously: no citations, no reading lists, no paper titles, no name-dropping — i can't check any of it and it won't help me decide what to print. work from the concepts and argue for the criteria. if you catch yourself about to say as so-and-so argued, don't, just make the argument.
reasoning: |-
  Okay, let's tackle this systematically. The user wants a set of criteria for evaluating scientific claims of emergence, tailored for journalistic use. They need clear, non-academic standards to distinguish substantive emergence from mere buzzword usage. 

  First, I'll consider the user's context: a science journalist dealing with embargoed studies where "emergence" is often invoked. Their pain points include inconsistent usage, confusion between different types of irreducibility, and pressure to avoid publishing shallow claims. The editor wants a "house rule" – practical criteria for when "emergence" is justified.

  The user provides specific test cases: temperature/pressure (clear reduction), wetness (ontological gap), Game of Life gliders (pattern emergence), hurricanes (dissipative systems), traffic jams (collective behavior), protein folding (multiple realizability), consciousness (hard problem), gerrymandered wholes (accidental groupings), and emergent spacetime (bottom-up vs top-down). 

  Key distinctions to preserve:
  - Epistemic (surprising) vs ontological (real causal powers)
  - Irreducibility types: unpredictability, underivability, novel causation
  - Emergent properties vs objects/systems
  - Scale relativity (avoid micro-chauvinism)

  Three tests to evaluate:
  1. Laplace test (unpredictability) – likely overstrong
  2. Swap test (substrate independence) – useful but incomplete 
  3. Funding test (autonomous science) – pragmatic but not definitional

  Now for the core task: generating candidate requirements then pruning. Brainstorming 15 potential criteria:

  1. Non-additive composition (macro ≠ sum of micro properties)  
  2. Micro-invisibility (property absent at micro level)  
  3. Novel causal powers (macro causes irreducible to micro causes)  
  4. Downward causation (macro affects micro)  
  5. Multiple realizability (same macro via different micro)  
  6. Scale separation (macro observable at different spatiotemporal scale)  
  7. Dynamical autonomy (macro obeys its own laws)  
  8. Substrate independence (persists across material changes)  
  9. Unpredictability from micro (even with full knowledge)  
  10. Explanatory irreducibility (macro explains better)  
  11. Pattern persistence (survives part replacement)  
  12. Thermodynamic openness (requires energy flow)  
  13. Coarse-graining necessity (micro description misses patterns)  
  14. Observer-relativity (depends on modeling choices)  
  15. Boundary conditions matter (initial/constraints crucial)  

  Pruning criteria lacking concrete case support:
  - Downward causation (cut): Only convincingly demonstrated in trivial cases (e.g. traffic jam causing braking), controversial in physics. Consciousness claims don't prove it.
  - Thermodynamic openness (cut): Applies only to dissipative systems (hurricanes), not to conserved patterns like gliders.
  - Observer-relativity (cut): While true for some cases (traffic jams), emergence should be objective where possible.
  - Boundary conditions (cut): Important but not defining – applies equally to reducible systems.

  Kept requirements (after pruning):
  1. Non-additive composition  
  2. Micro-invisibility  
  3. Novel causal powers  
  4. Multiple realizability  
  5. Scale separation  
  6. Dynamical autonomy  
  7. Substrate independence  
  8. Unpredictability  
  9. Explanatory irreducibility  
  10. Pattern persistence  

  Now evaluating tensions:
  - Major tension: Novel causal powers vs micro-causal closure. If microphysics is causally complete, how can macro properties have "new" causal power? Possible resolution: Macro properties can reorganize micro-causes without violating closure (e.g. traffic jam redirects cars).
  - Secondary tension: Unpredictability vs explicability. If emergence is fundamentally unpredictable, science can't explain it. Resolution: Distinguish practical unpredictability (computational limits) from principled unpredictability (genuine indeterminism).

  The most discriminating requirement is Novel Causal Powers – it excludes:
  - Reducible phenomena (temperature)  
  - Epiphenomena (gerrymandered wholes)  
  - Merely complex systems  

  Requirements often demanded due to theoretical bias:
  - Unpredictability (favored by strong emergentists)  
  - Downward causation (often smuggled in)  

  Finally, brief stance evaluations:
  - Reductionism: Fails novel causal powers  
  - Strong emergence: Posits fundamental laws – possible but unproven  
  - Coarse-graining: Handles epistemic emergence, avoids ontology  
  - Multiple realizability: Necessary but insufficient alone  

  This framework should give the journalist concrete criteria to evaluate claims while avoiding metaphysical rabbit holes.
answer: |-
  ### Desiderata for a Substantive Scientific Claim of Emergence  
  *(Pruned from 15 candidates; rejects noted at end)*  

  **Non-negotiable Core**  
  1. **Non-additive composition**  
     - *Case:* Temperature ≠ average kinetic energy of particles (which *is* additive). Pressure in gases is additive; "wetness" isn’t—no single H₂O molecule is wet.  
     - *Verdict:* Non-negotiable. Emergence requires macro properties not deducible by summing/averaging micro properties.  

  2. **Micro-invisibility**  
     - *Case:* A glider in Conway’s Game of Life: micro rules specify cell states, but the glider pattern isn’t present in any cell.  
     - *Verdict:* Non-negotiable. The emergent property must be absent at the micro level.  

  3. **Pattern persistence under part replacement**  
     - *Case:* Traffic jams persist as cars enter/exit; ant trails endure as ants are replaced. Gerrymandered hurricane+nitrogen fails—disrupt one molecule, "pattern" unchanged.  
     - *Verdict:* Non-negotiable. Emergent patterns must be invariant to substitution of micro constituents.  

  4. **Novel causal power at macro scale**  
     - *Case:* A convection cell moves heat *as a coherent structure*; a glider "eats" other patterns in Game of Life. Micro-causes (molecules, cells) don’t replicate this.  
     - *Verdict:* Non-negotiable. Must exert causal influence irreducible to micro-causes *in its own domain*.  

  **Negotiable (Context-Dependent but Defensible)**  
  5. **Multiple realizability**  
     - *Case:* Protein folds (e.g., alpha-helix) occur across diverse amino acid sequences. Wetness also realizable in other liquids.  
     - *Verdict:* Negotiable. Strongly supports autonomy but not required (e.g., consciousness might be substrate-bound).  

  6. **Scale separation**  
     - *Case:* Hurricanes act on km/hour scales; molecules act on nm/femtosecond scales. Not scale-chauvinist: spacetime emergence implies smaller scales *from* larger structures.  
     - *Verdict:* Negotiable. Helps identify "special science" domains but may not apply to all cases (e.g., quantum coherence).  

  7. **Explanatory irreducibility**  
     - *Case:* Simulating every atom in a protein doesn’t explain *why* this fold is functional/stable; ant colony behavior requires colony-level models.  
     - *Verdict:* Negotiable. Emergent properties warrant distinct explanations, even if derivable in principle.  

  **Pruned Candidates & Why**  
  - *Downward causation:* Cut. Only weakly evidenced (e.g., traffic jam causes braking, but reducible to micro-causes).  
  - *Thermodynamic openness (energy flow):* Cut. Applies to hurricanes but not conserved patterns (gliders, protein folds).  
  - *Unpredictability even to Laplace’s Demon:* Cut. Overstrong; unpredictability often practical, not ontological (e.g., chaotic systems).  
  - *Observer-relativity:* Cut. While true for traffic jams (depends on driver behavior), emergence should be objective where possible.  
  - *Requires new fundamental laws:* Cut. Prejudice of "strong emergence" camp; not needed for convection, gliders, etc.  

  ---

  ### Tensions & Tests  
  **Critical Tension: Novel causal power vs. micro-causal completeness**  
  - *Conflict:* If micro-causes fix everything, how can macro-properties have "new" power?  
  - *Resolution:* Macro-properties reorganize micro-causes without violating closure (e.g., traffic jam redirects *which* cars brake). Not unsatisfiable—but requires careful framing: emergent causes are *pattern-dependent constraints*, not new forces.  

  **Other Tensions:**  
  - *Surprise vs. explicability:* Emergence can be surprising *initially* but later explained (e.g., superconductivity). Tension resolvable if "surprise" is epistemic, not ontological.  
  - *Unpredictability vs. derivability:* Emergence doesn’t require *absolute* unpredictability (derivable gliders are still emergent).  

  **Evaluating Your Newsroom’s Tests**  
  1. **Laplace Test (unpredictability)**  
     - *Verdict:* Prejudice. Emergence ≠ magic; unpredictability is often computational (protein folding) not ontological.  

  2. **Swap Test (substrate independence)**  
     - *Verdict:* Defensible-but-optional. Protein folds work here; wetness doesn’t (requires H₂O). Not identical to multiple realizability—swap tests *materials*, not just states.  

  3. **Funding Test (autonomous science)**  
     - *Verdict:* Genuine desideratum (negotiable). Valid for hurricanes (meteorology vs. physics) or cognition (psychology vs. neurology). Not identical to others—pragmatic marker of explanatory autonomy.  

  ---

  ### Filtering Power & Biases  
  - **Most discriminating requirement:** **Novel causal power**. Excludes reducible phenomena (temperature), epiphenomena (gerrymandered whole), and trivial complexity.  
  - **Biased requirements:**  
    - Unpredictability (favored by strong emergentists to "protect" consciousness).  
    - Downward causation (often smuggled in to justify dualism).  

  ---

  ### Stance Scorecard  
  - **Reductionism-with-bridge-principles:** Fails novel causal power (e.g., reduces wetness to H-bonding).  
  - **Strong emergence (new laws):** Overkill for most cases; only relevant if micro-causality is violated (unproven).  
  - **Coarse-graining/model-dependence:** Excels at explanatory irreducibility (traffic jams) but dodges ontology (is wetness "real" or just useful?).  
  - **Multiple realizability:** Necessary for autonomy (protein folds) but insufficient alone (gerrymandered wholes are multiply realizable).  

  **Final Spec for Journalists:** A claim of emergence is substantive if it describes (1) a pattern not found in parts, (2) that persists when parts are replaced, (3) with causal influence not reducible to part-behavior. Ask researchers: "What does this macro-pattern *do* that its parts can’t, and how does it survive component turnover?" If they can’t answer, it’s a shrug.
