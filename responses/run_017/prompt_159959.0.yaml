answer: |-
  ## Revenue Ruling OOA-2024-01: Composite Object Return (COR) - Filing Requirements and Assessment Principles

  **Preamble:** Pursuant to the Ontological Assessment Act (OAA), the Office of Ontological Assessment (OOA) is mandated to levy an Annual Per-Object Tax (APOT) on the contents of all residential dwellings within the jurisdiction. The APOT serves the vital function of funding the essential work of the OOA in maintaining ontological clarity and ensuring the accurate cataloging of existence within the domiciliary sphere. This Ruling clarifies the determination of countable objects for the purposes of the Composite Object Return (COR), Form OOA-1040C, addressing interpretive challenges arising from the foundational principles governing composition delineated within the OAA.

  **Rulings:**

  1.  **Interpretive Positions:** The OAA incorporates three Interpretive Positions (IPs) regarding the special composition question ("When do some things compose a further thing?"). Taxpayers must calculate their liability under *all three* IPs and remit the highest resulting amount. Failure to file under any IP constitutes non-compliance.
      1.  **IP-1 (Universal Composition):** Any plurality of things whatsoever composes a further object. *Application:* This necessitates the inclusion of *every possible sum* of items within the dwelling and its theoretically boundless relational extensions. Assessable objects include, but are not limited to: "This left sneaker + that cereal box," "The collection of dust motes in the southeast corner of the living room as of noon on Filing Day," and "The taxpayer's refrigerator + Mount Everest." *Administrative Note:* While the OOA acknowledges the computational burden of enumerating all possible sums (estimated at 2^n -1 for n distinct simples/recognized composites), Form OOA-1040C provides Schedule S (Sums) for listing the ten most significant sums by estimated mass or volume, with a declaration that all others exist and are taxable. Penalties apply for incomplete declaration.
      2.  **IP-2 (Compositional Nihilism):** Nothing ever composes anything. There exist only fundamental simples. *Application:* No composite object exists. Therefore, taxpayers must not list "table," "chair," "book," or "house," but must instead list each fundamental particle or field excitation constituting the dwelling's contents at the assessment time. *Administrative Note:* Recognizing practical identification difficulties, the OOA provisionally accepts listing "things arranged tablewise," "things arranged bookwise," etc., provided the constituent simples are acknowledged as the sole taxable entities. Form OOA-1040C has been revised; all references to "objects" are replaced with "simples/arrangements." Assessable items are individual simples; arrangements are non-assessable organizational descriptors. See Table 1.
      3.  **IP-3 (Vitalist Composition):** Composition occurs only when the joint activity of the parts constitutes a life. *Application:* Only living organisms constitute composite objects. Assessable items include houseplants, pets (e.g., cats, dogs, fish), resident insects exceeding 1mm in length, and microbial cultures intentionally maintained (e.g., sourdough starter, yogurt culture). Non-living aggregates (tables, chairs, books, computers) are not composite objects. *Administrative Note:* Difficulties arise regarding:
          *   Non-living organic matter (e.g., a log, a steak): Not composite, decomposes into simples (IP-2 applies).
          *   Fungi: Assessable during active growth phase; dormant spores or dead specimens are not.
          *   Mechanically complex non-living systems (e.g., computers, clocks): Not living, hence not composite objects. Tax applies only to constituent simples (per IP-2) or relevant sums (per IP-1).
          *   Viruses: Not currently assessed pending further OOA biological review.

  2.  **De Minimis Exclusion (Provisional):** In recognition of the administrative challenges posed by strict application of IP-1 and IP-2, the OOA institutes a provisional De Minimis Rule (DMR). A putative composite object or sum is exempt from assessment if it meets *any one* of the following criteria:
      *   Maximum spatial extent < 1 cm in all dimensions.
      *   Market Value < $0.01 USD.
      *   No physical contact between constituent parts.
      *   Constituent parts not fastened by any mechanical, chemical, or adhesive means.
      *   Lacks measurable cohesion (shear strength < 0.001 Pa).
      *   *Rationale:* The DMR draws necessary and practical boundaries to ensure efficient tax collection, focusing on objects of tangible significance within the household context. While the specific thresholds (1cm, $0.01, etc.) represent operational necessities, any alternative threshold would face similar questions regarding its placement. The chosen thresholds optimally balance administrative feasibility with comprehensive ontological coverage under the OAA's mandate.

  3.  **Table of Representative Assessable & Non-Assessable Items (Illustrative, IP Specific):**

      | Description                          | IP-1 (Universal) | IP-2 (Nihilist) | IP-3 (Vitalist) | Notes                                         |
      | :----------------------------------- | :--------------- | :-------------- | :-------------- | :-------------------------------------------- |
      | A Cat (Felis catus)                  | Assessable       | Assessable*     | Assessable      | *As simples or "things arranged catwise"      |
      | A Wooden Table                       | Assessable       | Non-Assessable* | Non-Assessable  | *Constituent wood simples/arrangements are    |
      |                                      |                  |                 |                 | assessable; "table" is not a composite object |
      | "My Sofa + Andromeda Galaxy" Sum     | Assessable       | Non-Assessable* | Non-Assessable  | *DMR likely applies to parts not in contact   |
      | Sourdough Starter (Active Culture)   | Assessable       | Assessable*     | Assessable      | *As simples or "microbial arrangement"        |
      | Individual Dust Mote                 | Assessable       | Assessable      | Non-Assessable  | Considered a simple or small sum (IP-1)       |
      | "Left Sock + Right Sock" Sum         | Assessable       | Non-Assessable* | Non-Assessable  | *DMR may apply if socks not bundled           |

  4.  **Worked Example (Taxpayer: A. Resident, Dwelling: 123 Ontology Lane):**
      *   **IP-1:** Counts all distinct simples + all significant sums. Identifies 3,456 distinct simples. Selects 10 significant sums for Schedule S (e.g., "Kitchen Appliance Cluster," "Bookcase A contents," "Living Room Furniture Array," "Cat + Favorite Scratching Post"). Total Assessable Objects under IP-1: 3,466 + declared infinity of other sums.
      *   **IP-2:** Counts only the 3,456 distinct simples. "Table," "chair," etc., are not listed as objects. Total Assessable Objects under IP-2: 3,456.
      *   **IP-3:** Counts living composites: 1 cat, 3 houseplants, 1 active sourdough culture. Total Assessable Objects under IP-3: 5.
      *   **DMR Application (IP-1 & IP-2):** Excludes sums where parts lack contact or cohesion (e.g., "Sock + Moon"). Excludes simples/sums <1cm or valued <$0.01 (e.g., individual dust motes). Reduces IP-1 count to 102 simples + 10 sums = 112. Reduces IP-2 count to 102 simples.
      *   **Liability Calculation:** Highest post-DMR liability arises from IP-1 (112 objects). Tax = 112 x APOT Rate ($5.00) = $560.00. Taxpayer remits $560.00.

  5.  **Marginalia Prohibition:** Taxpayers are expressly forbidden from writing philosophical objections, queries regarding the nature of "thinghood," or diagrams illustrating mereological puzzles in the margins of Form OOA-1040C or accompanying schedules. Such notations impede optical character recognition processing and constitute invalid filing. Use designated Form OOA-1040Q (Ontological Query) for substantive questions.

  6.  **Special Cases & Purpose-Driven Assessment:**
      1.  **The Mended Table:** A wooden table (T1) has one leg replaced. Is the resulting entity (T2) the same object as T1 (continuing liability) or a new composite (new liability)? IP-1 sees countless sums involving parts of T1 and T2. IP-2 sees only changing arrangements of wood simples. IP-3 denies the table is a composite. *Ruling:* T2 constitutes a distinct composite object under the OAA due to the significant material alteration. Purpose: Ensures continued revenue from materially altered household items.
      2.  **Split-Tenure Sum (STS):** Consider a bookshelf unit where the shelving is owned by Taxpayer A and the books placed upon it are owned by Taxpayer B (co-habiting, filing separately). IP-1 identifies the sum "A's Shelving + B's Books" as a distinct, assessable composite within the dwelling. *Ruling:* The STS ("A's Shelving + B's Books") is deemed an assessable composite object for APOT purposes. Liability is joint and several between Taxpayers A and B. Purpose: Prevents avoidance through distributed ownership of sum-components within a single taxable dwelling, ensuring comprehensive assessment of household ontological content.

  **Enactment:** This Ruling is effective for all Composite Object Returns (COR) filed for tax years beginning on or after January 1, 2024.

  Victor Blank
  Commissioner
  Office of Ontological Assessment
  Date: October 26, 2023
