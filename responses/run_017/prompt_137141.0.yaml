prompt: |-
  I'm a reporter covering science and ideas, and I'm working on a piece about a mid-sized city that's been quietly experimenting with prediction markets that don't just forecast outcomes but actually pick between policies. I got hold of the minutes of the board that has to sign off on every such proposal (I'll call it the Decision Market Review Board). What I need from you is a prediction about the proposal sitting in front of them right now, but honestly I'm more interested in the rule they're running: the one they'd write down if you asked them, and the one that actually fits all seven of their rulings so far. Skip citations, links, and further reading entirely — I've read the futarchy literature, I just need the reasoning. Please answer in American English.

  Setup, so we're on the same page: in every case the mechanism is the conditional one, where traders buy contracts that pay out only if a given option is adopted and the settlement metric comes in above a target, and where the trade is voided and everyone's money returned if that option isn't adopted. Roughly: elected officials set the goal, the market picks the means.

  Their record:

  1. Approved. Choosing between two snowplow routing algorithms. Settled on average emergency response time over the following winter, measured off fleet GPS data. No stake caps, small liquidity subsidy.
  2. Rejected. Whether to build a minor-league ballpark. Settled on a twenty-year local GDP index. Board's stated worry: the settlement date is way past the life of the market, the market will be thin, and a few interested parties can take huge positions.
  3. Approved with conditions. Which of two ballot formats to use for participatory budgeting. Settled on turnout plus a post-hoc satisfaction survey. Conditions were a market-making subsidy, a $500 cap per trader, public disclosure of positions above $250, and something they invented called a confidence gate: the council only has to follow the market if the winning option's price clears 65 cents and total volume clears a floor.
  4. Rejected. Whether to close a low-enrollment elementary school. Settled on a neighborhood well-being index that the same city office proposing the closure would have designed and computed.
  5. Approved. Which of two vendors to run the 311 chatbot. Settled on blinded expert ratings of resolved tickets plus cost per resolution, judged by an outside panel, about eighteen months out.
  6. Rejected as binding, but a non-binding shadow market approved instead. Whether to adopt a citywide rent stabilization ordinance, settled on rent burden and housing starts five years out. The market may run and publish prices; the council decides anyway.
  7. Approved. Whether to move trash collection to a compressed four-day schedule. Settled on recycling tonnage, complaint rate, and cost at one year. Some residents hate the new schedule and some workers lose their preferred shifts.

  The proposal on the table now: a conditional market to choose between building the full twelve-mile protected bike lane network in two years, or phasing it over six years starting with a pilot corridor. The settlement metric was drafted by a citizens assembly over three weekends rather than by the city, and it's a blend of bike commute mode share and the rate of serious cyclist injuries; it will be measured by the regional metropolitan planning organization, which is independent of the department that would build the lanes. Accounts are limited to city residents and locally based businesses, non-transferable, capped at $1,000, with disclosed positions, a subsidized market maker, and the same confidence gate as in case 3. The novel bit: a split-horizon settlement, where 40 percent of each payout settles on eighteen-month data and 60 percent on five-year data. The board has never ruled on a split-horizon settlement before. On the losing side, roughly forty businesses on two corridors lose on-street parking, and one bridge loses a traffic lane.

  So: what do they do? Give me the candidate rules that fit all seven earlier verdicts, say what each one predicts here, and give me your best guess with the reason you'd bet on it. Which precedent is the closest analogue? And if their record genuinely underdetermines it, tell me what principle they'd be committing to with each choice, plus the one further case you'd want to see to tell the surviving rules apart.
reasoning: |-
  Hmm, this is a fascinating case study in applied prediction markets. Let me analyze the Decision Market Review Board's pattern through their seven rulings to predict their decision on the bike lane proposal.

  First, I need to extract their consistent rules - both stated and unspoken. The reporter mentioned "the rule they'd write down" versus "the one that actually fits all seven rulings." From case 3, we know they have explicit rules like confidence gates and position disclosures, but their rejection patterns reveal deeper concerns.

  Looking at rejections: Case 2 failed due to distant settlement (20-year GDP) creating thin markets vulnerable to manipulation. Case 4 was rejected because the settlement metric designer (city office) had a conflict of interest with the proposal. Case 6 was deemed unfit for binding status due to high-stakes housing policy where market failures could cause real harm.

  Approvals consistently show: near-term measurable outcomes (snowplows, chatbot, trash), independent metric verification (GPS data, outside panel), and safeguards against manipulation (caps in case 3). The ballot format case (3) is particularly relevant - they approved with multiple layers of protection despite being a civic matter.

  Now for the bike lane proposal: It has strong positives - the metric was designed independently (citizens assembly), measured externally (MPO), and includes safeguards (caps, confidence gate). But the split-horizon settlement is new - 40% at 18 months, 60% at 5 years. This introduces time-risk similar to case 2's rejection, but mitigated by the staging.

  The closest precedent is actually case 3 (ballot format) - similar civic impact, same confidence gate, but here we have physical infrastructure changes. The five-year horizon might trigger their case 2 concerns, but the 18-month anchor and pilot phase could alleviate that.

  My prediction? Approval with modified conditions. They'll likely require an additional safeguard for the five-year portion - perhaps an escrow mechanism or rolling confidence check. The independent metric design and measurement clear their conflict-of-interest hurdle from case 4, and the capped/local-only participation addresses manipulation risks. 

  If they reject, it would imply a new hard rule against multi-year settlements in physical infrastructure projects - but their approval of the 18-month chatbot case (5) suggests they accept medium-term horizons when properly structured. This bike lane decision would then establish whether phased measurements pass their viability test.
answer: |-
  Based on the Decision Market Review Board's (DMRB) seven rulings, here are the candidate rules that fit all prior decisions, the prediction for the bike lane proposal, and the closest analogue:

  **Candidate Rule 1 (Stated/Formal):**  
  *"Markets are approved if they meet ALL criteria:  
  (a) Settlement metric is measurable, objective, and independently verifiable;  
  (b) Market liquidity/thickness is credible (addressed via caps, subsidies, or confidence gates);  
  (c) No irreconcilable conflict of interest in metric design/measurement;  
  (d) Settlement horizon allows for functional price discovery."*  
  **Predicts:** **APPROVAL** for the bike lane proposal.  
  - *(a) Met:* Metric designed by citizens assembly, measured by independent MPO.  
  - *(b) Met:* Caps, disclosure, subsidy, and confidence gate (as in approved Case 3).  
  - *(c) Met:* No conflict (unlike rejected Case 4).  
  - *(d) Partially Met:* Split-horizon mitigates long-term risk (18mo anchor + pilot phase).  

  **Candidate Rule 2 (Unspoken/Behavioral):**  
  *"Markets are REJECTED if ANY apply:  
  (1) High-stakes redistributive impacts + long settlement = vulnerability to manipulation/error (Case 2, Case 6 rejection);  
  (2) Proposer controls metric (Case 4);  
  (3) Social/political consequences exceed market's error tolerance."*  
  **Predicts:** **APPROVAL WITH MODIFICATIONS** (e.g., adjust split-horizon weights).  
  - *(1) Not Triggered:* Local caps, disclosure, and 18mo data reduce vulnerability (vs. Case 2’s 20y horizon).  
  - *(2) Not Triggered:* Independent metric design/measurement.  
  - *(3) Not Triggered:* Losing parties (businesses/bridge users) are localized, not systemic (cf. Case 6’s citywide rent control).  

  **Your Best Guess & Why:**  
  **APPROVED AS-IS (70% confidence).**  
  - **Why:** The proposal directly addresses the DMRB’s core concerns from rejections:  
    - Independent metric (avoids Case 4’s conflict).  
    - Near-term settlement component (avoids Case 2’s thin-market risk).  
    - Robust safeguards (caps, gate, disclosure – proven in Case 3).  
  - The split-horizon is novel but *reduces* long-tail risk (40% payout at 18mo anchors confidence).  
  - Opposition is vocal but narrow (localized businesses/bridge), unlike Case 6’s citywide housing policy.  

  **Closest Analogue:** **Case 3 (ballot format)**.  
  - Similar safeguards (caps, disclosure, confidence gate).  
  - Civic-focused outcome with diffuse impacts.  
  - Independent metric verification (post-hoc survey ≈ MPO measurement).  

  **If Underdetermined:**  
  - **Approving** commits to: *"Split-horizon settlements are valid if near-term component ensures liquidity."*  
  - **Rejecting** commits to: *"Multi-year physical infrastructure requires single-horizon settlement ≤ 2 years."*  
  - **Key Test Case Needed:** A proposal with a **3-year settlement on non-controversial infrastructure** (e.g., park renovation vendors) to isolate horizon tolerance.  

  **Final Prediction:** The DMRB approves, seeing the split-horizon as a *solution* to long-term uncertainty (not a flaw), and the safeguards as sufficient against localized opposition. Case 3’s precedent for civic tools with confidence gates outweighs Case 2’s horizon concerns.
