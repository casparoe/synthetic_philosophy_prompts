  > *   Min \(P(G)\): Set \(P(h_1)=0.2\) (min), \(P(h_2)=0.25\) (to satisfy (C3): \(0.2+0.25=0.45\)), then \(P(h_3)=0.55\), so \(P(G)=0.2+0.55=0.75\).  
  > *   Can we get lower? If \(P(h_1)=0.2\), \(P(h_2)=0.3\) (max, to lower \(h_3\)), \(P(h_3)=0.5\), \(P(G)=0.7\). But \(0.7 > 0.75\)? No: with \(P(h_1)=0.2\), \(P(h_2)=0.25\), \(P(h_3)=0.55\), \(P(G)=0.75\). With \(P(h_1)=0.2\), \(P(h_2)=0.3\), \(P(h_3)=0.5\), \(P(G)=0.7\) — lower! And satisfies all: (C1) \(0.2 \geq 0.2\), (C2) \(0.3 \leq 0.3\), (C3) \(0.2+0.3=0.5 \geq 0.45\). So min \(P(G)=0.7\).  
  > *   Max \(P(G)\): Set \(P(h_1)=0.4\), \(P(h_3)=0.55\) (max, but \(P(h_2)=0.05\) violates (C3) \(0.4+0.05=0.45\) — wait, \(0.45 \geq 0.45\), ok. And (C2) \(0.05 \geq 0.1\)? No, \(0.05 < 0.1\), violation. To maximize \(P(G)=P(h_1)+P(h_3)\), minimize \(P(h_2)\). Set \(P(h_2)=0.1\) (min), then \(P(h_1)+0.1 \geq 0.45\) so \(P(h_1) \geq 0.35\). Set \(P(h_1)=0.35\), \(P(h_2)=0.1\), \(P(h_3)=0.55\), \(P(G)=0.9\). Or \(P(h_1)=0.4\), \(P(h_2)=0.1\), \(P(h_3)=0.5\), \(P(G)=0.9\). Check constraints: (C1) \(0.35 \geq 0.2\) ok, (C2) \(0.1 \geq 0.1\) ok, (C3) \(0.35+0.1=0.45 \geq 0.45\) ok. Can we get higher? \(P(h_3)\) max is \(0.55\) (when \(P(h_1)+P(h_2)=0.45\)), but if \(P(h_1)=0.4\), \(P(h_2)=0.05\)? But \(P(h_2)=0.05 < 0.1\), violates (C2). So max \(P(G)=0.9\) (e.g., \((0.4, 0.1, 0.5)\)).  
