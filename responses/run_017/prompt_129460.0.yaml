prompt: |-
  Hey — picture this. You're advising a small but serious foundation that has maybe $40m to spend over five years on one thing: making the people who hold legislative power in a mid-sized parliamentary democracy less like a professional political class. They've decided up front to spend only on institutional design — the rules about who gets to sit in the legislature and for how long — not campaign finance, not media, not civic education. And they'd rather fund eight or ten people thinking hard for three years than run an advocacy campaign, because they think the advocacy is premature until the design questions are less murky. The boards patience is limited, so they want an agenda, not a survey.

  Here's the menu they keep circling around:

  1. Sortition: replace one chamber with a randomly selected assembly, redrawn regularly.
  2. Hard term limits: two or three terms and you're out.
  3. A third thing nobody has a settled name for, so call it lottery retirement: at each election a randomly chosen fifth of sitting members are barred from standing again. Being a career politician stays possible, but it becomes a gamble you can lose through no fault or failure of your own.
  4. Cohort overlap: only half the sortitioned chamber is replaced each cycle, so there's some institutional memory — at the cost of some freshness.
  5. Sortition with a secretariat behind it, where continuity comes from permanent expert staff who brief each new cohort, frame the options and draft the text. Depending on your view that's institutional wisdom without careerism, or careerism relocated to people nobody voted for and nobody sortitioned.

  Assume, just for the sake of argument, something that seems roughly true of citizen assemblies where they've been tried: they do noticeably better than elected bodies on long-horizon stuff like pensions and climate, and noticeably worse at anything requiring them to say no to a loud, organized group right now — and members defer a lot to whoever briefs them.

  So: what are the open questions here that actually deserve the money, in what order, and why? I care much more about the reasoning than the list. For each question tell me what else depends on it — which ones are upstream, e.g. do we need to settle what representation even is before we can say whether a random sample represents anybody? — how tractable it is for political theorists, economists, mechanism-design types and people who just think carefully about institutions, as opposed to empirical political scientists running field experiments, and what kind of finding over the next two years would move it up or down the ranking.

  Two things I'd especially like your read on. First: which of the usual claims made for these reforms don't actually follow? The one I keep hearing is that random selection "fixes polarization" because you can't gerrymander a lottery, and I'm not convinced that's even the right mechanism to be looking at. Second: is the secretariat problem the crux that most of the menu implicitly depends on — the thing that decides whether sortition is worth pushing at all — or is it a distraction that only bites in an idealised version of sortition nobody is actually proposing? Relatedly, where does the expertise go under hard term limits (lobbyists, staff, agencies), and does that worry transfer to the lottery versions or not?

  If you think the menu is missing something big, say what and why it should outrank the rest.
reasoning: |-
  Okay, let me unpack this fascinating challenge. The user presents a highly specific scenario: a foundation with $40m to spend over five years solely on institutional design reforms aimed at disrupting professional political classes in a parliamentary democracy. The constraints are clear - no advocacy, no peripheral areas like media or education, just focused intellectual work on legislative selection mechanisms. 

  Hmm, the user seems deeply familiar with political theory - they're using precise terms like "sortition" and "mechanism design" while dismissing common assumptions (like sortition fixing polarization). Their frustration with superficial reform debates shows when they call out "murky" design questions. I notice they're particularly skeptical about two things: the secretariat problem in sortition models and whether term limits just shift expertise elsewhere.

  The core tension appears between freshness and continuity. All proposed solutions sacrifice one for the other: term limits purge experience, sortition depends on briefers, lottery retirement keeps some veterans but randomly culls others. The user's observation about citizen assemblies excelling at long-term thinking but failing at confronting immediate pressures feels crucial - it suggests any viable design must solve for both time horizons.

  What's really being asked here isn't just a research agenda but a prioritization framework. The user wants to know which unanswered questions could make or break these reforms, and in what sequence to investigate them. They're implicitly rejecting the common academic approach of studying everything - hence "agenda, not survey". The time sensitivity (board's patience) means we must identify leverage points where new insights could quickly eliminate options or redirect focus.

  I find their "lottery retirement" concept particularly intriguing - it's less radical than sortition but more disruptive than term limits. The gambling metaphor is apt: it preserves the possibility of political careers while introducing Russian roulette elements. But does this actually solve the professionalism problem or just make it riskier? That seems worth probing.

  The secretariat question feels pivotal. If permanent staff inevitably become the real power behind sortition assemblies, does that undermine the entire premise? And if so, does this flaw also infect lottery systems or term-limited legislatures where expertise migrates to lobbyists? This might be the make-or-break issue across all models.

  Regarding polarization: the user's skepticism is warranted. Sortition avoids gerrymandering but random selection could actually amplify polarization if societal divisions run deep. A homogeneously polarized citizen assembly might be worse than professional politicians who need to negotiate. This deserves rigorous modeling.

  What's missing? Perhaps attention to transition costs and human behavior. How do incumbents react when faced with lottery retirement? Could they game cohort overlap systems? Real-world implementation hurdles might be as important as theoretical purity.
answer: |-
  Here's a research agenda prioritized for impact, tractability, and addressing foundational dependencies – structured around the core tension between **political renewal** and **institutional continuity**:

  ### Tier 1: The Secretariat/Career Expertise Problem (The Crux)
  *   **The Question:** *Under what conditions does unelected institutional expertise (secretariat, staff, agencies, lobbyists) dominate or constructively serve temporary/lottery-based legislators? What design features prevent capture or undue influence?*
  *   **Why Upstream:** This determines whether *any* system relying on non-career politicians (Sortition, Hard Term Limits, Lottery Retirement) is viable or merely relocates power. It directly impacts the feasibility of Options 1, 3, 4, 5 and the risks of Option 2.
  *   **Tractability:** High for institutional theorists, mechanism designers, and behavioral economists. Analyze existing bodies (e.g., Congressional Budget Office, UK Clerk's Office, citizen assembly secretariats), model principal-agent dynamics, design incentive structures for staff (e.g., rotating assignments, strict neutrality protocols, transparency requirements). Simulate information flow.
  *   **Key Dependencies:** Defines the "institutional memory" solution space. If robust secretariat designs are impossible, Options 1 & 5 become non-starters, and Options 2 & 3 become far riskier (pushing expertise to lobbyists/agencies).
  *   **What Moves the Needle (2 Years):**
      *   Empirical study showing *measurable, causal influence* of briefers/staff on outcomes in existing citizen assemblies vs. elected bodies with similar staff structures.
      *   A compelling theoretical model demonstrating how to align secretariat incentives *permanently* with the assembly's purpose, not external actors or internal careerism.
      *   Identification of a real-world institution (anywhere) where temporary principals *effectively* control permanent expert agents without capture.
  *   **The Skepticism (Addressing Your Question):** The "secretariat problem" is **NOT** a distraction. It's the core vulnerability of *all* anti-careerist designs. If the foundation ignores this, they risk designing systems where the "de-professionalization" is merely cosmetic, shifting power to an unelected, unaccountable, and potentially more resilient professional class (staff, lobbyists, agencies). This applies equally to term limits (expertise migrates) and lottery systems.

  ### Tier 2: Defining and Measuring "Representativeness" & Legitimacy
  *   **The Question:** *What constitutes legitimate "representation" in a non-elected chamber? Is descriptive representation (mirroring demographics) sufficient? What weight do citizens give to procedural fairness (randomness) vs. perceived competence vs. accountability mechanisms when granting legitimacy?*
  *   **Why Upstream:** Essential for justifying Sortition (1,4,5) and Lottery Retirement (3). Impacts public acceptance and long-term stability. Hard Term Limits (2) rely more on traditional electoral accountability, so this is less critical *for that specific option*.
  *   **Tractability:** High for political philosophers, social choice theorists, and survey/experimental researchers. Normative theory development, comparative analysis of legitimacy perceptions across different selection mechanisms (election, sortition, appointment), large-scale surveys/conjoint experiments testing citizen preferences.
  *   **Key Dependencies:** Without settling this, advocating for sortition/lottery is philosophically weak and vulnerable to attacks of being "unaccountable" or "unqualified." It determines the acceptable trade-offs (e.g., deferring to experts vs. making own decisions).
  *   **What Moves the Needle (2 Years):**
      *   Clear philosophical framework reconciling sortition with democratic legitimacy, moving beyond just descriptive representation.
      *   Robust experimental evidence showing citizens grant *equal or greater* legitimacy to well-designed sortition bodies vs. elected ones for specific tasks.
      *   Identification of the *minimal accountability mechanisms* (e.g., transparency, review powers by elected body, public ratification) needed for sortition to be perceived as legitimate.

  ### Tier 3: The Behavioral Impact of Uncertainty (Lottery Retirement & Term Limits)
  *   **The Question:** *How does the existential risk of forced exit (Lottery Retirement) or definite endpoint (Term Limits) alter legislator behavior, coalition building, investment in expertise, and susceptibility to short-termism or corruption?*
  *   **Why Now:** Critical for evaluating Options 2 & 3 specifically. Lottery Retirement is novel and its behavioral effects are highly uncertain. Does the "gamble" incentivize different (better/worse?) behavior than definite term limits?
  *   **Tractability:** Moderate-High. Best suited for behavioral economists, game theorists, and institutional modelers. Laboratory experiments simulating legislative decision-making under different exit rules, agent-based modeling, historical analysis of legislators facing unexpected electoral doom or term limits.
  *   **Key Dependencies:** Determines whether Lottery Retirement (3) is a viable middle path or combines the worst of careerism and amateurism. Informs the optimal "hit rate" (1/5th? More/less?) and whether Hard Term Limits (2) cause severe short-termism.
  *   **What Moves the Needle (2 Years):**
      *   Experimental evidence showing *significant behavioral differences* between definite term limits and probabilistic forced exit.
      *   Modeling demonstrating how Lottery Retirement impacts long-term policy investment vs. pork-barreling.
      *   Analysis of whether uncertainty fosters cross-cohort cooperation or desperate short-termism.

  ### Tier 4: Optimal Chamber Design & Interaction
  *   **The Question:** *Given the strengths/weaknesses identified (e.g., sortition good on long-term, bad on saying no; term limits increase turnover, decrease expertise), what is the optimal configuration of chambers (elected/sortition), term structures, and powers?*
  *   **Why Later:** Depends heavily on answers from Tiers 1-3. Requires understanding *how* each component actually functions before combining them.
  *   **Tractability:** Moderate for institutional designers and comparative political scientists. Constitutional design work, power-balancing simulations, analysis of bicameral systems with differently selected chambers (e.g., appointed Senates).
  *   **Key Dependencies:** Where Tier 1-3 findings are synthesized into a blueprint. Addresses cohort overlap (4) and sortition variations (1,5) concretely.
  *   **What Moves the Needle (2 Years):** Less about breakthrough findings here initially, more about integrating robust answers from Tiers 1-3 into coherent, testable institutional blueprints.

  ## Addressing Your Specific Queries

  1.  **"Fixing Polarization" via Sortition:** You're right to be skeptical. **This claim doesn't reliably follow.** While sortition avoids gerrymandering, it doesn't eliminate deep societal polarization. A randomly selected assembly *could*:
      *   **Reflect Polarization:** If society is split 50/50, the assembly likely will be too, leading to deadlock without professional negotiators.
      *   **Amplify Vocal Minorities:** Random selection might over-represent highly motivated (and potentially extreme) individuals unless stratification/counter-balancing is perfect.
      *   **Lack Tools for Resolution:** Elected pros often have tools (logrolling, party discipline) to forge compromises; amateurs may lack the skill or mandate.
      *   **The Real Mechanism:** Sortition's strength against polarization *might* come from breaking party control and fostering deliberation *among diverse individuals*, not just from bypassing gerrymandering. But this is contingent on expert facilitation (Tier 1!) and a chamber design fostering genuine dialogue.

  2.  **The Secretariat Problem - Crux or Distraction?** **It is absolutely the Crux.** As argued in Tier 1, it's not about "idealized" sortition; it's about the *inescapable need for continuity and expertise* in complex governance. Ignoring this is designing for failure. The question is *how* to structure this expertise to serve the temporary legislature without dominating it. This problem **transfers directly** to Hard Term Limits and Lottery Retirement:
      *   **Term Limits/Lottery:** Expertise exits the legislature itself. Where does it go? Lobbyists gain power. Permanent civil servants/agencies gain de facto policy-making influence. Unelected staff within the legislature become crucial. The risk of capture shifts location but remains acute.
      *   **Sortition:** The expertise challenge is *immediate and explicit* within the secretariat supporting each new cohort. The design challenge is more focused but no less critical.

  ## Missing Ingredient? The "Problem of the Commons" within the Legislature
  *   **The Gap:** Existing options focus on membership turnover but less on *internal incentives*. How does the design foster cooperation *within* the chamber among temporary members? How does it prevent free-riding, ensure individuals invest in understanding complex issues, and incentivize long-term thinking *collectively*? Careerism, for all its flaws, can sometimes align individual ambition with institutional maintenance.
  *   **Why Add & Prioritize?** This could be integrated into Tier 3 (Behavioral Impact) or be a separate stream. It deserves attention because even with perfect membership selection, poor internal incentives can derail the body. Analyze reputational mechanisms, committee structures, rewards for cross-cutting work, penalties for short-termism *within* the legislative rules. It wouldn't outrank Tier 1 (Secretariat), but could be part of Tier 3/4.

  **Conclusion:** The foundation should prioritize funding deep dives into **The Secretariat/Expertise Conundrum (Tier 1)** and **Legitimacy/Representation (Tier 2)**. Successfully addressing these is foundational. Simultaneously, fund work on **Behavior Under Uncertainty (Tier 3)** to evaluate Lottery Retirement vs. Term Limits. Hold off on full Chamber Design (Tier 4) until these yield results. **The Secretariat question isn't just about sortition; it's the core challenge for *any* system seeking to break the political career monopoly without collapsing into dysfunction or hidden capture.** Ignoring it guarantees the $40m funds elegant designs doomed by unaddressed power dynamics.
