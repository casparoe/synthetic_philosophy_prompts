  ### Home Support Grant Eligibility Determination Procedure  
  **Purpose**: To determine if an applicant is "substantially unable to manage personal care without assistance" per statute, using a 20-item function form (total score 0–60, lower = more impaired).  

  #### Step 1: Verify Hard Stops (Non-Vague Gates)  
  1. Confirm applicant is a county resident.  
  2. Verify income is within program cap.  
  3. Check for immediate safety risks (e.g., unstable housing, acute mental health crisis).  
     - **Sufficient answer**: Documentation proving residency/income, or nurse safety notes.  
     - **If unmet**: Deny immediately. Cite specific unmet criterion. Stop.  
     - **If met**: Proceed to Step 2.  

  #### Step 2: Assess Current Assistance  
  1. Document all assistance the applicant **currently uses** (human help, family, or equipment like grab rails).  
  2. Determine if this assistance is **reliable and sufficient** for all personal care tasks.  
     - *Reliable*: Available when needed, no imminent loss (e.g., family moving next week is unreliable).  
     - *Sufficient*: Enables safe task completion.  
  3. **If assistance is reliable and sufficient**:  
     - **Sufficient answer**: Nurse notes confirming reliability/sufficiency (e.g., "uses own shower chair safely daily").  
     - **Action**: Deny. Stop.  
  4. **If assistance is unreliable, insufficient, or unclear**:  
     - **Action**: Escalate to eligibility officer (you) for value judgment.  
     - *Reason*: Deciding "without assistance" requires policy interpretation (e.g., "Is a daughter 40 minutes away 'available'?").  

  #### Step 3: Score Functional Ability  
  1. Nurse completes 20-item form based on **unassisted ability** (no human help, no equipment not permanently available).  
     - *Example*: Score showering without shower chair.  
  2. Total score (0–60).  
     - **Sufficient answer**: Completed form with total.  
     - **If missing data**: Nurse revisits or escalates for missing items.  

  #### Step 4: Clear Cases  
  1. **If score ≤ 6**: Grant. Stop.  
  2. **If score ≥ 13**: Deny. Stop.  
  3. **If score 7–12**: Proceed to Step 5 (Borderline).  

  #### Step 5: Borderline Handling (Score 7–12)  
  **Use ONE version below (A or B). Recommended: B (Expected-Value).**  

  | **Version A: Robustness** | **Version B: Expected-Value** |  
  |----------------------------|--------------------------------|  
  | 1. Check the **sharpening book** (current range: 7–12). This lists cutoffs accepted by reviewers/hearing officers. | 1. Use the **sharpening book** (7–12). Assign equal weight to each number (7,8,9,10,11,12). |  
  | 2. **If every number in the book agrees**: | 2. Calculate: |  
  |   - **Grant ONLY if score < ALL book numbers** (impossible for 7–12). |   - **G** = Count of book numbers **above** score. |  
  |   - **Deny ONLY if score ≥ ALL book numbers** (only true for 12). |   - **L** = Count of book numbers **≤** score. |  
  | 3. **Otherwise (most cases)**: Escalate to eligibility officer. | 3. **Grant if L < 5 × G** (using policy cost ratio 5:1; false denial cost > false grant). |  
  | - *Rationale*: Avoids risk when uncertainty remains. | - *Rationale*: Minimizes costs (e.g., hospitalization from denial vs. grant cost). |  
  | - *Outcome for 8*: Escalate (book 7–12 disagrees). | - *Outcome for 8*: Grant (L=2, G=4 → 2 < 5×4). |  

  #### Step 6: Escalation to Eligibility Officer  
  - **Triggers**:  
    - Value judgments (Step 2: e.g., family availability, budget impact).  
    - Borderline cases (Version A only).  
    - Disputes on assistance interpretation.  
  - **Your role**: Make final call based on policy intent, not individual discretion. Document reasons.  

  #### Step 7: Decision Letter  
  - **If grant/deny**: State outcome and cite:  
    - Hard stop (Step 1), OR  
    - Current assistance (Step 2), OR  
    - Clear score (Step 4), OR  
    - Borderline rule (Step 5).  
  - **If escalated**: Explain: "Eligibility requires human judgment per procedure."  

  ---  
  ### Key Policy Choices & Maintenance  
  1. **Vague Terms Sharpened JOINTLY**:  
     - "Substantially unable... without assistance" is sharpened by the **total score** and **cutoff**.  
     - *Example*: If someone needs $200 of grab rails:  
       - Step 2: If they **have rails**, they may be denied (assistance sufficient).  
       - If they **lack rails**, score reflects unassisted ability → grant may provide rails.  
     - *Why?* Statute’s terms are interdependent; separating them creates contradictions.  

  2. **Maintaining the Sharpening Book**:  
     - **Who updates?** Eligibility officer (you).  
     - **When?** When a hearing officer/reviewer **explicitly endorses a cutoff** (e.g., "9 is valid").  
     - **What avoids creep?** Only add numbers from **official endorsements** (not from individual grants).  
     - **Past grants ≠ cutoff evidence**: A grant at score 6 implies 6 was *below* the cutoff, but doesn’t define the cutoff itself. Never add numbers without explicit endorsement.  

