  **Theory Appendix (≤1 Page)**  
  - **Vagueness**: The statute lacks sharp boundaries (e.g., "substantially unable").  
  - **Epistemicism**: A precise cutoff exists (e.g., 9), but we don’t know it.  
  - **Supervaluationism**: No single cutoff; all values 7–12 are "admissible." A claim is "definitely true" only if true for every admissible cutoff.  
  - **Our Procedure**: Uses supervaluationism (sharpening book = admissible cutoffs).  
    - *Robustness (Version A)*: Only act if all book cutoffs agree.  
    - *Expected-Value (Version B)*: Weigh costs across book cutoffs.  
  - **Why Joint Sharpening?** Vague terms interact (e.g., "unable without assistance" can’t be split).  
  - **Book Maintenance**: Only add cutoffs explicitly endorsed (hearing officers), not inferred from grants.
