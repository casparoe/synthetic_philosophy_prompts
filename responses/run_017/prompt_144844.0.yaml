  #### 1. Agreed Claims  
  Both camps endorse these statements as foundational common ground:  
  1. The original frame problem arose in logical formalisms (e.g., situation calculus) to avoid enumerating unchanged properties after an action.  
  2. The qualification problem involves unlistable preconditions for actions, while the ramification problem involves unlistable indirect consequences.  
  3. The inferential frame problem concerns avoiding irrelevant derivations during reasoning about change.  
  4. Qualification, ramification, and inferential issues are interconnected facets of relevance determination.  
  5. Non-monotonic formalisms (e.g., circumscription) partially addressed representational tractability but did not resolve core relevance challenges.  
  6. Tractability results (e.g., in certain decidable fragments) show feasibility in restricted domains but do not generalize to open-ended reasoning.  
  7. Modern systems (e.g., probabilistic, learned) handle many practical cases better than classical logicist approaches.  

  #### 2. Disagreements Table  
  | ID | Centrality Camp Wording | Dissolution Camp Wording | Substantive or Verbal | Why |  
  |----|--------------------------|---------------------------|----------------------|-----|  
  | A | The frame problem reveals a fundamental constraint on *any* system reasoning under uncertainty: relevance is isotropic and requires holistic evaluation. | The frame problem was a technical obstacle in *specific* logical systems, now bypassed by architectures leveraging statistics, embodiment, or learning. | Substantive | Disagreement over whether relevance is inherently global (centrality) or locally tractable (dissolution). |  
  | B | Non-monotonic logics failed because they could not capture the centrality of relevance; what remains unsolved is the *general* problem of adaptive relevance. | Non-monotonic logics solved the *representational* frame problem for niche domains; remaining challenges are computational, not ontological. | Mixed (partly verbal) | "Ontological" vs. "computational" frames the issue differently; dissolution avoids "centrality" language. |  
  | C | The inferential frame problem persists as a core issue: no syntactic or local heuristic can reliably substitute for global relevance. | The inferential challenge is reducible to engineering (e.g., attention mechanisms), not a distinct philosophical problem. | Substantive | Centrality sees relevance as irreducible; dissolution sees it as optimizable. |  
  | D | Probabilistic methods *shift* the frame problem (to priors and inference) but do not eliminate its central difficulty: relevance under bounded resources. | Probabilistic methods *dissolve* the frame problem by replacing brittle logic with scalable approximation. | Verbal | Disagreement hinges on "dissolve" vs. "shift"; dissolution rejects "central difficulty" as overdramatized. |  
  | E | Human cognition faces the same frame problem; its efficiency derives from heuristic biological compromises, not a solution. | Biological systems avoid the frame problem via evolution/learning; it is not a "problem" for situated agents. | Substantive | Centrality sees it as universal; dissolution as avoidable through design. |  

  **Verbal Disputes Note**: Disagreement B is partly verbal due to differing definitions of "solved" (representational vs. general). Disagreement D is verbal regarding "dissolve" (dissolution: tractability; centrality: persistence). For disputes to stay verbal, centrality must avoid "fundamental," and dissolution must avoid "eliminated."  

  #### 3. Probes  
  **Probe 1: In-Context Ramification Problem**  
  - **Centrality Verdict**: This *is* the frame problem: an agent must holistically resolve contradictions in a vast, isotropic belief space.  
  - **Dissolution Verdict**: This is a *different problem* (retrieval/attention in LLMs), addressable via fine-tuning or latent-space pruning.  
  - **Same Problem?**: Centrality: yes (core relevance challenge); Dissolution: no (scalable with current tools).  

  **Probe 2: Horizon Frame Problem**  
  - **Centrality Verdict**: This *is* the frame problem: long-horizon relevance requires non-local, context-sensitive filtering.  
  - **Dissolution Verdict**: This is a *distinct problem* (online planning under uncertainty), solvable via abstraction (e.g., state aggregation).  
  - **Same Problem?**: Centrality: yes (generalized form); Dissolution: no (routine in RL/control theory).  

  #### 4. Cruxes  
  | ID | Question | Shared Test | Centrality Prediction | Dissolution Prediction | Which Side Moves? |  
  |----|----------|-------------|------------------------|-------------------------|-------------------|  
  | X | Can a probabilistic, embodied agent (e.g., home robot) handle *novel* relevance judgments without task-specific preprogramming? | Deploy such an agent in open-world simulations (e.g., AI2-THOR) with randomized disruptions; measure failure rates on relevance-dependent tasks. | High novel-relevance failure rates persist, indicating unresolved frame problems. | Failure rates drop to acceptable levels with sufficient data/compute, proving tractability. | Dissolution if failures remain high; Centrality if failures vanish. |  
  | Y | Does scaling compute/data *systematically* reduce relevance errors, or do they plateau due to centrality? | Train increasingly large RL agents on procedurally generated environments; plot relevance-error reduction vs. scale. | Errors plateau as domain complexity grows, showing inherent limits. | Errors diminish predictably with scale, confirming engineering solubility. | Centrality if plateaus occur; Dissolution if errors vanish asymptotically. |  
  | Z | Is human relevance-handling *qualitatively* different from AI systems? | fMRI/behavioral studies of humans vs. AI on novel planning tasks with hidden relevance traps. | Humans show heuristic efficiency unmatched by AI, revealing a gap. | AI matches humans once environmental statistics are learned, proving no special "centrality." | Centrality if gaps persist; Dissolution if gaps close. |  

  **Note**: Crux Z lacks a test both fully accept (dissolution doubts fMRI relevance). A validated cognitive benchmark (e.g., IARPA SCORE) would resolve this.  

