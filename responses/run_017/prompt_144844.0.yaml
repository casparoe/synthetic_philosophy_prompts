  We are writing a joint statement for an adversarial collaboration on the frame problem. We have two camps: centrality and dissolution. We need to produce the following:

  1. Agreed Claims (numbered list of one-sentence claims that both camps agree on)
  2. Disagreements Table (each row stated twice - once for centrality, once for dissolution - and a column indicating if it's substantive or verbal)
  3. Two Probes (with each camp's verdict and whether they think it's the same problem)
  4. Cruxes (with shared tests and predictions)

  Then, we output a JSON with the specified fields.

  Let's break down each part.

  ### 1. Agreed Claims
  We need to cover:
  - What the original problem was (someone acts; the world mostly stays the same; representation without enumerating non-changes)
  - How qualification problem (unlistable preconditions), ramification problem (unlistable consequences), and inferential version (avoiding irrelevant derivations) hang together.
  - Whether non-monotonic formalisms of the 60s/70s solved any of it.
  - What tractability results actually show.

  Both camps agree on the following (as one-sentence claims):

  1. The frame problem originally arose in situation calculus and similar formalisms: when representing an action's effects, one must avoid explicitly listing all non-changes (frame axioms) because they are too numerous.
  2. The qualification problem concerns the impossibility of listing all preconditions for an action, as there might be infinite exceptions.
  3. The ramification problem addresses the challenge of listing all indirect consequences of an action, which can be vast and context-dependent.
  4. The inferential frame problem is the difficulty of efficiently deriving relevant consequences without being overwhelmed by irrelevant ones.
  5. These three problems (qualification, ramification, and inferential) are interconnected aspects of the broader challenge of relevance in reasoning about change.
  6. The non-monotonic formalisms of the 60s and 70s (like default logic, circumscription) provided partial technical solutions to some aspects of the frame problem but did not fully resolve the underlying issues of relevance and tractability.
  7. Tractability results (e.g., in some restricted formalisms) show that the frame problem can be managed in limited domains with careful engineering, but do not necessarily address the general case.

  ### 2. Disagreements Table
  We need rows where each row is stated twice (centrality wording and dissolution wording) and we note if it's substantive or verbal.

  Possible disagreements:

  A. **Nature of the problem**: 
     - Centrality: The frame problem reveals a fundamental issue in cognition and AI about how to handle relevance, which is isotropic and central, thus requiring holistic processing.
     - Dissolution: The frame problem was an artifact of specific symbolic, logicist approaches and largely disappears when agents are embodied, learn from experience, or use probabilistic methods.

  B. **Generality of the problem**:
     - Centrality: The frame problem is a deep, general problem for any system that reasons about change, regardless of implementation.
     - Dissolution: The problem is not general; it only appears in systems that attempt to use explicit, logical representations of all effects and non-effects.

  C. **Role of non-monotonic logic**:
     - Centrality: Non-monotonic logics were a step but ultimately failed to solve the frame problem because they couldn't handle the holistic nature of relevance.
     - Dissolution: Non-monotonic logics effectively solved the representational frame problem for the domains they were applied to, leaving only computational challenges.

  D. **Tractability**:
     - Centrality: The tractability results are for restricted cases and do not address the core issue of relevance in open-ended domains.
     - Dissolution: The tractability results show that the frame problem can be made computationally manageable in practice.

  E. **Connection to cognition**:
     - Centrality: The frame problem tells us something essential about the nature of intelligence and the challenges of flexible reasoning.
     - Dissolution: The frame problem is an engineering challenge, not a deep insight into cognition.

  For each, we must decide if it's substantive or verbal. Some might be mixed.

  Example row for A:

  - Centrality wording: "The frame problem is a deep, central issue in AI and cognitive science, revealing the inherent difficulty of relevance determination in any system that reasons about change."
  - Dissolution wording: "The frame problem was an artifact of early logicist AI and is largely dissolved by alternative approaches such as embodiment, learning, and probabilistic reasoning, reducing it to manageable engineering challenges."
  - Substantive or verbal: Substantive, because it's about the nature of the problem and whether it is fundamental or not.

  We should have about 5-7 rows.

  ### 3. Probes

  We have two probes:

  **Probe 1: In-context ramification problem**
  - Scenario: A language-model agent with a long context of retrieved documents (mostly irrelevant) plus one new fact that contradicts something it "knows". The agent must work out which downstream consequences matter for its next action.
  - Centrality camp: This is a clear instance of the frame problem because the agent must determine relevance holistically in a vast belief space.
  - Dissolution camp: This is a different problem, more about retrieval and attention in large language models, which can be addressed by mechanisms like attention weights and fine-tuning, not the same as the original frame problem.

  **Probe 2: Horizon frame problem**
  - Scenario: A deployed agent with a long time horizon must decide which changes are worth re-planning over and which to ignore, without predefined relevance conditions.
  - Centrality camp: This is the frame problem reappearing in a planning context, showing the same core issue of relevance over time.
  - Dissolution camp: This is a standard challenge in online planning under uncertainty, solvable by techniques like state abstraction, value function approximation, or horizon reduction, and not the same as the original frame problem.

  For each, we note:
  - Centrality verdict: same problem (or variant)
  - Dissolution verdict: different problem or not a problem (or solvable by current methods)
  - Is it the same problem? (from each camp's view)

  ### 4. Cruxes

  We need cruxes that are questions that, if settled, would move at least one camp. For each:
  - The question
  - A shared test (concrete argument, case, or observation both accept as bearing on it)
  - Predictions from each camp
  - Which side would move if the test goes a certain way?

  Crux ideas:

  1. **Generality Crux**: 
     - Question: Can a system that is embodied, probabilistic, and learned avoid the frame problem in open-ended, novel situations?
     - Shared test: Build an agent that operates in a highly dynamic, novel environment (e.g., a household robot in a new home) and measure how often it fails due to unanticipated relevance failures (like not noticing a critical change that affects its actions).
     - Centrality prediction: Such systems will still exhibit frame problem-like failures in novel situations because relevance is context-dependent and holistic.
     - Dissolution prediction: With sufficient learning and probabilistic methods, the system will handle novelty without frame problem issues, with failures attributable to ordinary factors like insufficient data or computational limits.
     - Which side moves? If failures occur in ways that look like the frame problem (e.g., missing indirect effects) and are not reducible to bounded computation, dissolution might have to concede. If not, centrality might have to concede.

  2. **Cognitive Relevance Crux**:
     - Question: Is the human ability to handle relevance in dynamic situations fundamentally different from how AI systems handle it?
     - Shared test: Cognitive experiments where humans and AI systems are tested on the same novel planning task with unexpected changes and measure the pattern of errors and reaction times.
     - Centrality prediction: Humans will show a pattern of efficiently ignoring irrelevant changes, while AI systems (even modern ones) will have more errors or delays when the relevance structure is novel.
     - Dissolution prediction: Modern AI systems (e.g., RL agents) will perform similarly to humans when given similar learning opportunities, and any differences are due to current engineering limitations.
     - Which side moves? If AI systems show a qualitatively different kind of error (e.g., getting stuck on irrelevant details or missing critical indirect effects) even after training, centrality is supported. If not, dissolution.

  3. **Formalism Crux**:
     - Question: Can a purely symbolic, non-probabilistic system solve the frame problem for a complex, open-ended domain?
     - Shared test: Attempt to build such a system for a domain like cooking in a varied kitchen, and evaluate its robustness to unexpected changes and new objects.
     - Centrality prediction: It will fail because the domain requires holistic relevance that cannot be captured by local rules.
     - Dissolution prediction: It will fail, but only because of the choice of symbolic methods, not because of a fundamental problem; probabilistic methods would work.
     - Which side moves? The test might not move dissolution because they already think symbolic methods are flawed. But if the failure is taken as evidence for the centrality view, then dissolution might not move. This crux might be less clear.

  We need cruxes that both camps would accept as bearing on the issue. Let's choose two.

  ### JSON Structure

  We'll build the JSON as:

  {
    "n_agreed_claims": 7,
    "agreed_claims": [list of 7 one-sentence strings],
    "disagreements": [
      {"id": "A", "centrality_wording": "...", "dissolution_wording": "...", "substantive_or_verbal": "substantive", "why": "..."},
      ... 
    ],
    "cruxes": [
      {"id": "C1", "question": "...", "shared_test": "...", "centrality_prediction": "...", "dissolution_prediction": "...", "which_side_moves": "..."},
      ...
    ],
    "probes": [
      {"name": "in-context ramification", "centrality_verdict": "same problem", "dissolution_verdict": "different problem", "is_it_the_same_problem": "Centrality: same; Dissolution: different"},
      ... 
    ],
    "verbal_disputes": [list of strings describing which parts are verbal, e.g., "disagreement about the term 'frame problem'"],
    "bottom_line": "Three sentences on what the agreed claims leave out."
  }

  ### Verbal Disputes
  We must note if part of the dispute is verbal. For example, if the camps are using "frame problem" to mean different things, that's verbal. We'll note that in the disagreements table and also in a separate list.

  ### Bottom Line
  What someone who read only the agreed claims wouldn't know: the fundamental disagreement about whether the frame problem is a deep, general issue in intelligence or an artifact of early AI that is dissolved by modern approaches.

  Now, let's write the content.
