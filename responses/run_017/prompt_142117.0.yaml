prompt: |-
  I am a novelist, four books in, and for the first time I am writing one set entirely in the past: a close-third-person novel about one family in San Francisco through the second wave of the 1918 influenza pandemic — the mask ordinance, the league that formed to repeal it, the arguments about whether compulsory gauze did anything, a laundress who keeps a door-to-door tally of the sick households on her block, and a short present-day frame narrated by a great-granddaughter who has spent ten years digitising the family's papers. My editor loves the draft and keeps praising it for putting the characters "on the right side of history," and the more she says it the more I suspect that is precisely the failure. My partner is an epidemiologist and will say things like "they'd have saved thousands of lives if they'd just listened," which I now hear as the vice in miniature. The trouble is that what I have is a temper, not a test: I can feel when a scene is congratulating us for how far we have come, or when I have handed a character a motive they could only have had in our vocabulary, or when I have excused them by saying they "couldn't have known" — which I've started to suspect is itself a condescending way of refusing to take their actual reasons seriously — but I can't reliably catch it in my own prose, and my fact-checking historian won't catch it either, because she checks whether the streetcar line existed and not whether my plot treats a side as having lost because it was benighted rather than because it was outvoted, outbid, or unlucky.

  So please take this seriously and carefully, and work as if you were both a philosopher or historically-minded theorist who knows what is actually at stake in the complaint about whig history and a developmental editor who has to be useful by Friday. Start by brainstorming — ten minutes, in your head — the distinct ways whiggishness can get into a work of fiction specifically, and only then condense that into something I can run: a numbered decision procedure I can apply to a single scene in ten to fifteen minutes during a revision pass, with no theory vocabulary in the steps themselves. For each step, tell me what question to ask, what counts as a pass, what counts as a fail, what counts as "rewrite this line," where the procedure stops with a verdict, and where it has to stop and hand the question to me because it is a question about what my book is for. I need it to keep separate the things I keep conflating — narrating as if a later outcome were the point of earlier action, judging past people by present standards, and the mirror-image vice of romanticising the period as a lost golden age — and I need an actual test for anachronistic *concepts*, not just anachronistic objects, since my characters keep wanting to say things like "the science" and "prejudice" in words that flatten what they meant. Assume I have no training in any of this, that I will run it on about forty scenes, and that the output has to survive being read by my editor.

  Then show me it working. Run it on three scenes from the draft, in detail: (1) the meeting where the anti-mask characters are given the strongest version of their case — that the gauze is useless, that the ordinance is enforced against the poor and waved through for the rich, that compulsion in a republic in wartime is itself the harm — where I cannot tell whether writing them well is honest or is apologetics; (2) the deathbed scene in which an opponent recants and concedes that the doctors were right, which is the scene my editor singles out and which I would be genuinely unhappy to lose, so if your procedure condemns it I want to be told so plainly; and (3) the frame chapters, where the great-granddaughter calls her ancestor "a forerunner of modern epidemiology" on the strength of that household tally, and I can't work out whether that is a legitimate claim about influence or just retroactive ennoblement of a dead end. Finally, be straight with me about where the procedure misfires: what kinds of scenes it will score wrongly, what it cannot tell me at all, and which of its verdicts I should treat as a prompt to think rather than an instruction to cut.
reasoning: |-
  Hmm, the user is a novelist working on a historical fiction novel set during the 1918 influenza pandemic in San Francisco. They're concerned about "whiggishness" creeping into their work - that tendency to judge the past through modern lenses or portray historical progression as inevitable. Their editor keeps praising the characters for being "on the right side of history," which makes them uncomfortable. Their epidemiologist partner's comments about how many lives could have been saved only deepen this concern.

  The user has identified several specific problems: scenes that feel self-congratulatory, characters with anachronistic motivations, and using "they couldn't have known" as an excuse that actually dismisses historical perspectives. They need a practical tool to detect these issues during revision.

  What they're asking for is quite specific: a numbered decision procedure they can apply scene-by-scene in 10-15 minutes. It needs to avoid theoretical jargon, separate different types of whiggishness (inevitability, presentism, romanticization), and detect anachronistic concepts. They want it tested on three key scenes from their draft and want to know its limitations.

  I need to create something that functions like a developmental editor's checklist but is informed by historical theory. The procedure should have clear questions, pass/fail criteria, and rewrite triggers. It must distinguish between different whiggish pitfalls and handle conceptual anachronisms.

  For the procedure itself, I'll create a 5-step checklist that examines:
  1) Scene purpose and framing
  2) Character motivation authenticity
  3) Language and concept period-accuracy
  4) Handling of outcomes and counterarguments
  5) Narrative distance and judgment

  Each step will have specific questions, clear indicators of what passes or fails, and guidance on when rewriting is needed versus when deeper reconsideration is required.

  For the scene tests:
  1) The anti-mask meeting scene: I'll examine whether the opposition arguments are presented authentically or as straw men
  2) The deathbed recantation: I'll assess whether this feels earned or like a narrative convenience
  3) The framing device with the great-granddaughter: I'll evaluate whether her claims of influence are substantiated

  I'll also be honest about where this tool might misfire - probably with subtle tone issues, complex thematic scenes, or when dealing with actual historical influence versus retroactive projection. The key is to give the novelist something that prompts deeper thinking rather than offering simplistic solutions.
answer: |-
  Here is a **Whiggishness Detection Procedure (WDP)** designed for your revision passes. It focuses on concrete textual analysis, separates the distinct vices, and avoids theory jargon. Run it on **one scene at a time**.

  **The Whiggishness Detection Procedure (WDP):**

  1.  **What's the Scene *Really* About?**
      *   **Ask:** "Does the scene feel like it exists *primarily* to show who was 'right' or 'wrong' by *my* (or today's) standards? Or is it showing what happened, why people *then* acted, and the messy consequences?"
      *   **Pass:** The scene's primary drive is character action/decision, conflict rooted in period concerns, exploration of consequences (intended/unintended), or revealing relationships/worldview *of the time*.
      *   **Fail:** The scene feels like a morality play staged for a modern audience, where "proving" historical rightness/wrongness is the main engine.
      *   **Rewrite This Line/Passage:** Any exposition or narration explicitly framing the conflict *only* in terms of modern categories of "right/wrong" or "progressive/backward."
      *   **Stop & Hand Off:** If the scene *must* inherently involve judgment (e.g., the present-day frame), flag it for later consideration of *how* that judgment is made (Step 5).

  2.  **Why Do They *Actually* Think That?**
      *   **Ask:** "Does the character's motivation/reasoning rely on concepts, priorities, or knowledge that feels imported from *my* time, or is it rooted in *their* demonstrable world (social norms, available info, personal history, period logic)?"
      *   **Pass:** Motivation stems directly from period-appropriate concerns (e.g., liberty vs. state power *in 1918*, distrust of specific authorities, economic necessity, community duty as *they understood it*, religious belief, personal trauma, observable but *misinterpreted* evidence).
      *   **Fail:** Motivation relies on anachronistic concepts (e.g., "violating human rights" used broadly, "following The Science" as an abstract ideal, "fighting systemic oppression" in modern terms) or foresight they couldn't possess ("if only they knew what we know").
      *   **Rewrite This Line/Passage:** Dialogue or internal monologue using terms/concepts like "prejudice" (in its modern sociological sense), "the science" (as a monolithic authority), "progress," "backward," or motives clearly constructed *only* to make them look noble/villainous by modern standards. Replace "couldn't have known" with *what they did know/believe and why*.
      *   **Stop & Hand Off:** If a character *is* genuinely ahead of their time, the scene must *show* the roots in *their* specific experience/thought process, not just tell it. Flag if this feels thin.

  3.  **How Did the Outcome *Happen*?**
      *   **Ask:** "Is the outcome (success/failure, winning/losing an argument, life/death) presented as inevitable due to inherent rightness/wrongness, or is it shown as contingent on specific actions, power dynamics, resources, luck, or the messy reality of the situation?"
      *   **Pass:** The outcome results from concrete factors: persuasive tactics (good/bad), access to resources/money/power, social connections, sheer luck/chance, unforeseen consequences, timing, practical obstacles, emotional manipulation, fatigue, *contemporary* evidence/arguments used effectively/ineffectively.
      *   **Fail:** The outcome feels preordained because one side is "enlightened" and the other "benighted." Failure is attributed *only* to ignorance/stupidity/evil, success *only* to virtue/smartness.
      *   **Rewrite This Line/Passage:** Narration or character reflection stating/implying the outcome was "destined," "proof" of inherent rightness/wrongness, or solely due to one side's superior moral/scientific character in a modern sense. Show *how* it happened, not *why it was deserved*.
      *   **Stop & Hand Off:** N/A. This step yields rewrite or pass.

  4.  **Is the Counterargument a Straw Man or the Real Deal?**
      *   **Ask:** "Is the opposing viewpoint presented in its *strongest, most understandable* form by a character who genuinely believes it? Or is it weakened, ridiculed, or voiced by an unsympathetic character?"
      *   **Pass:** The opposition's best case is articulated clearly, passionately, and logically *within their 1918 context* by someone who seems sincere and reasonable (even if ultimately wrong or harmful). Their concerns resonate with period-specific values/fears.
      *   **Fail:** The opposition is represented only by weak arguments, caricatures, fools, hypocrites, or villains. Their *core* concerns (e.g., liberty, distrust, inequality) are dismissed without engagement.
      *   **Rewrite This Line/Passage:** Dialogue where the opposition sounds foolish, hysterical, or purely malicious without grounding in period concerns. Narration that dismisses their *core* position rather than showing its interaction with the protagonist's view. Strengthen the opposition's argument and sincerity.
      *   **Stop & Hand Off:** N/A. This step yields rewrite or pass.

  5.  **Where is the Judgment Coming From? (Narrative Distance)**
      *   **Ask:** "Is judgment about the past coming explicitly *from a character within the story* (past or present), or is it seeping from the *narrator's voice* describing the past?"
      *   **Pass:** Judgment is clearly located within a character's perspective (e.g., the present-day great-granddaughter interpreting, a past character reflecting on events *they* lived through). The narrative voice describing past events remains relatively neutral, focusing on action and period perspective.
      *   **Fail:** The third-person narrator (describing 1918) uses language implying modern judgment (e.g., "foolishly," "shortsightedly," "regressively," "ahead of her time," "unenlightened"). Judgment feels authorial, not character-based.
      *   **Rewrite This Line/Passage:** Any narrator comment on past actions/views using evaluative adjectives/adverbs rooted in modern hindsight. Replace with descriptive language focused on the *what* and *why then*. Move judgment explicitly into character thought/dialogue.
      *   **Stop & Hand Off:** For the *present-day frame*, this step helps ensure judgment is *owned* by the character. For the *past narrative*, it demands neutrality. Flag any scene where judgment feels essential but hard to locate; this might require structural shifts.

  **Applying the WDP to Your Scenes:**

  **Scene 1: The Anti-Mask Meeting (Strong Case Presented)**

  1.  **Scene Purpose:** Likely **Pass.** The scene's core is conflict over policy, driven by period concerns (liberty, class, efficacy). *Risk* is if it *feels* staged only to show anti-maskers as "wrong."
  2.  **Motivation:** **CRITICAL STEP.** Question every anti-mask argument.
      *   "Gauze useless": Pass if based on *contemporary* flawed studies, anecdotes, visible gaps, distrust of officials who lied about the war? Fail if based on modern libertarian talking points or feels like a straw man.
      *   "Enforced against poor/Waved for rich": Strong Pass. Rooted in observable reality, a powerful period motivation (class resentment). Ensure it's presented as a *genuine grievance*, not just a hypocritical complaint.
      *   "Compulsion in wartime republic = harm": Pass. Core 1918 concern (civil liberties vs. state power, wartime context). Ensure it's passionate, principled, not cartoonish.
      *   *Rewrite:* Any anachronistic terms ("government overreach," "bodily autonomy"). Any suggestion they oppose masks *just* because they're selfish/stupid. Strengthen their sincerity and logic *within their framework*.
  3.  **Outcome:** (Assuming they lose the argument/meeting?) **Pass** *only* if shown *how*: Were they out-organized? Out-spent? Did a key ally waver? Did a pro-mask doctor present compelling *local* evidence? Fail if they lose just because their arguments are "obviously wrong."
  4.  **Counterargument:** **CRITICAL STEP.** Is the *pro-mask* case presented fairly? Is their doctor/science advocate sincere, using *1918* understanding (which was imperfect)? Or a saintly paragon? Do they *engage* with the class/enforcement concern? Pass if pro-mask arguments are strong *but period-appropriate* and opponents are sincere. Fail if pro-maskers are flawless or dismiss class concerns. *Rewrite* pro-mask sanctimony or dismissal of valid grievances.
  5.  **Judgment Source:** **Pass** if narrative voice is neutral, describing arguments without modern labels ("misguided," "unenlightened"). Fail if narrative voice judges. *Rewrite* any authorial judgment sneaking in.

  **Verdict for Scene 1:** **Likely Needs Rewrite Focus** on Steps 2 (Anti-Mask Motivation Authenticity) and 4 (Pro-Mask Counterargument Fairness/Sincerity). Ensure *both* sides' best cases are present, grounded in 1918, and outcomes are contingent. **Not inherently apologetics** if done authentically – it's showing the *real* debate.

  **Scene 2: The Deathbed Recantation ("Doctors were right")**

  1.  **Scene Purpose:** **High Risk of Fail.** Does this scene *only* exist to validate the "right" side and provide moral closure? Or is it a complex human moment of fear, regret, reconciliation, or shifting perspective *for this specific character*? If the former, it's Whiggish.
  2.  **Motivation:** **CRITICAL STEP.** *Why* does the opponent recant?
      *   Pass: Overwhelming personal experience of suffering/death despite their beliefs? Genuine change of heart based on seeing *specific* evidence *in their context* (not just "science was right")? Desire for peace/forgiveness with a loved one? A final act of concession to someone they respect?
      *   Fail: Recanting *solely* because "they were wrong and we know it now." Or because they suddenly grasp modern epidemiology.
      *   *Rewrite:* Any dialogue like "You were right all along... the science..." or "I see now how foolish I was." Replace with concrete, personal, period-rooted reasons: "I held out hope the gauze was useless... but watching [Specific Person] fade... and Dr. [Name] explained how it traps the wet cough... I couldn't bear the thought I...". Make it *their* reason, not *yours*.
  3.  **Outcome:** (The recantation happens) **Pass** if it feels *earned* by the character's journey and the specific, visceral circumstances of the deathbed. Fail if it feels like a narrative requirement or inevitability. Contingency here is psychological/emotional.
  4.  **Counterargument:** N/A (The "counterargument" here is their former self). Ensure the recantation doesn't retroactively make *all* their past arguments caricatures.
  5.  **Judgment Source:** **High Risk.** Pass only if the *narrator* simply reports the recantation neutrally. Fail if the narrator sighs in relief or implies "finally saw the light." *Rewrite* any narrative commentary.

  **Verdict for Scene 2:** **High Whiggishness Risk.** The procedure **likely condemns it in its current form** because its *purpose* (Step 1) and the *motivation for recantation* (Step 2) are highly susceptible to modern judgment and narrative convenience. **Can it be saved?** Only if:
      *   The recantation is *specifically personal* (not a blanket endorsement of "the doctors").
      *   The motivation is deeply rooted in this character's *specific* experience and relationships, not abstract "rightness."
      *   It feels like a moment of human vulnerability or relational repair, *not* historical vindication.
      *   The narrative voice stays absolutely neutral.
      If these feel impossible, cutting it might be necessary. If you can achieve them, it *might* pass.

  **Scene 3: Present Frame (Great-Granddaughter: "Forerunner of Modern Epidemiology")**

  1.  **Scene Purpose:** **Pass** (Hand Off Accepted). Judgment is inherent here. Step 5 is key.
  2.  **Motivation:** (For the GG-daughter's claim) **Pass/Fail depends on textual support.** Is she basing this *only* on the tally? Or does she have evidence of *actual influence*? Pass if she cites specific documents showing health officials saw/utilized it, or it inspired later methods locally. Fail if it's pure projection because the tally *looks* modern to *her*.
  3.  **Outcome:** N/A (This is an interpretation).
  4.  **Counterargument:** N/A (Though does she *consider* if it was a dead end?).
  5.  **Judgment Source:** **CRITICAL STEP.**
      *   Pass: The claim is clearly located *as the GG-daughter's interpretation*, potentially biased by her decade of immersion and desire to valorize her ancestor. The narrative voice might subtly question it or show its subjectivity.
      *   Fail: The narrative voice *endorses* the claim uncritically as objective fact.
      *   *Rewrite:* Any objective narrator statement backing the "forerunner" label. Instead, frame it *as her view*: "In her dissertation, she argued her great-grandmother was..." or "She liked to imagine her as a forerunner...". Add nuance: "...though the city's official reports made no mention of the tally..." or "...a meticulous record that, while unnoticed in its time, prefigured..."

  **Verdict for Scene 3:** **Likely Needs Rewrite Focus** on Step 5 (Judgment Source). The claim itself (Step 2) needs grounding in the character's evidence/motivation, not presented as narrative fact. The key is making the *interpretation* belong to the great-granddaughter and showing its potential subjectivity. **Retroactive ennoblement is likely unless carefully framed as her potentially biased perspective.**

  **Where the WDP Misfires & How to Use It:**

  *   **Misfires:**
      *   **Subtle Tone:** It might miss very subtle authorial irony or implied judgment that isn't overt in the text.
      *   **Complex Theme Integration:** Scenes deeply weaving multiple themes (personal, political, scientific) might trigger flags that need nuanced interpretation, not just rewrite.
      *   **Actual Influence vs. Perception:** Distinguishing genuine historical influence (Step 2/3 in Frame scene) from retroactive projection is hard; the procedure flags risk but can't prove/disprove influence.
      *   **Character Complexity:** A character *genuinely* holding a complex/mixed view might be misread if the procedure expects singular motivations.
      *   **"Golden Age" Romanticism:** The procedure focuses on Progress-vice. To catch romanticizing the past, add a specific check: "Does the scene portray the past as inherently simpler, better, or more authentic than today, ignoring its specific hardships or complexities?" (Look for uncritical nostalgia, dismissing period struggles).
  *   **Using Verdicts:**
      *   **"Rewrite This Line":** Do this. Fix the specific flagged language/motivation.
      *   **"Fail" on a Step:** This is a **Prompt to Think Deeply**, not necessarily a command to cut. Ask:
          *   *Scene Purpose Fail:* "What *is* this scene's core purpose if not judgment? Can I refocus it?"
          *   *Motivation Fail:* "What *were* the authentic period drivers for this action? How can I root it there?"
          *   *Outcome Fail:* "What concrete, contingent factors *actually* led to this result?"
          *   *Counterargument Fail:* "What was the *strongest*, most sincere version of the opposing view? Who would believably hold it here?"
          *   *Judgment Source Fail:* "Who in this story *should* be making this judgment? How can I locate it there explicitly?"
      *   **"Stop & Hand Off":** This means the question is fundamental to your story's intent. You *must* decide consciously: "Is this scene *about* judgment? How do I want to handle it authentically (e.g., making it the great-granddaughter's clear bias)?"
      *   **Multiple Fails in a Scene:** Indicates deep structural Whiggishness. Requires significant rethinking, not just line edits. Consider if the scene is truly necessary or needs a complete reconception.

  This WDP forces you to interrogate the *text* for specific, common Whiggish pitfalls. It separates the vices and focuses on grounding character, language, and outcome in 1918. It won't make you a historian, but it will make your fiction less of a mirror for modern self-congratulation and more a window into the genuine, complex past. Run it ruthlessly. Your editor's praise suggests the story *works*; this is about making it *true*. Good luck.
