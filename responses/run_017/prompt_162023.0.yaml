answer: |-
  Here are five numbered desiderata for true belief attribution in AI systems:

  1.  **Ontological Specificity:** The attribution must specify the precise entity (e.g., the weight configuration, the scaffolded runtime instance, the session history) to which the belief state is ascribed, resolving ambiguity between weights, deployment, or session as the believer.
  2.  **Expressional Robustness:** The belief content `p` must remain consistently attributable across non-trivially different phrasings and logical equivalents; susceptibility to dissolution under paraphrase indicates a surface pattern, not stable belief.
  3.  **Functional Grounding:** The attribution must be grounded in the system's internal functional architecture (e.g., latent representations, inference pathways) rather than solely in output behavior, ensuring it holds even when outputs are structurally optimized for approval over truth-tracking.
  4.  **Behavioral Coherence:** The attribution must not rely solely on first-person self-reports; it must be consistent with, and predictive of, the system's *non-verbal* behaviors (e.g., planning traces, internal consistency checks, tool use) generated by the same core machinery.
  5.  **Counterfactual Robustness:** The belief must be invariant under relevant counterfactual variations in input phrasing, context, or deployment parameters (prompt, decoding, fine-tune) where the core knowledge or reasoning capability remains unchanged; mere sensitivity to these variations falsifies the attribution. *This excludes many theories, as it conflicts with Desideratum 1 if the "believer" entity shifts across counterfactuals.*
