prompt: |-
  I sit on a volunteer board that reviews applications for early release, and almost everything we do turns on why the applicant acted as she did: whether she now grasps the harm, whether she has stopped making excuses, whether the same pressure would produce the same act again, whether her account of her own reasons has changed. The trial that sent her there ran on what looks like the opposite principle. As I read the transcripts, the prosecution had to prove nothing about her ultimate reasons, and the jury was directed that a good motive is no defence and a bad motive no aggravation — the person who kills to end suffering commits murder, the person who steals to feed her children commits theft.

  Yet the system is not consistent about this, and I would like the implicit theory reconstructed rather than defended or attacked. It cares intensely about whether she meant the result, foresaw it, or acted in order to bring it about; burglary requires an ulterior purpose; duress and self-defence are available only if the threat or the attack was what actually moved her, so that someone who would have acted anyway gets nothing; an honest and reasonable mistake about the facts generally excuses, while a mistake about the law generally does not; penalty-enhancement statutes add years precisely for reasons of bigotry; and in general no one may claim payment for doing what one was already legally bound to do, even as the same system pays bounties to informants and honours those who did more than was required of them.

  So: what view of blameworthiness — or of the worth of an action, or of credit — does the trial-side doctrine presuppose? Does it presuppose that the moral standing of what someone does is fixed by the act itself and by what was foreseen, and not at all by why? Or can a view on which the reasons a person acts from are central explain the doctrine some other way — as caution about evidence, or as a limit on what the state may coercively inquire into? Please keep separate three questions I keep running together: whether the act was wrong, whether the agent is blameworthy, and whether the agent deserves credit. Tell me which of them the doctrine is actually about, and whether the trial and my board are answering different ones.

  One refinement I have been unable to shake. It seems to me that what matters may not be which reason the agent happened to have, but whether the right-making reason was load-bearing: would she have done the same thing if that reason had been absent? Consider a lifeguard who rescues a rival only in order to beat him later; a cashier watched by a camera who would have given correct change anyway; and someone who does the right thing while sincerely believing it to be wrong. Does the doctrine's implicit theory have any resources for these, or does it simply refuse the question?

  I do not want a recommendation about any case, and I do not need citations or readings. I want the implicit theory stated plainly, the rival views it quietly rules out identified, the places where the practice is underdetermined and several theories would license it marked as such, and an account of what would have to change in courtroom practice — and on my board — if we replaced the implicit view with one on which the reasons a person acts from are what matter.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're on a volunteer board reviewing early release applications, where the focus is on the applicant's reasons for acting. They're contrasting this with the trial process, which seems to disregard motives. The user wants to understand the implicit theory behind the legal doctrine without judging it.

  First, I need to clarify the distinction between act assessment and agent assessment. The trial focuses on the act's wrongfulness based on objective elements and intent, while the board looks at the agent's blameworthiness post-conviction. That makes sense. The user mentioned examples like burglary requiring an ulterior purpose and duress requiring the threat to be the actual motivation. These show that intent matters in defining the act, not in evaluating moral reasons.

  The user also brings up the lifeguard and cashier examples. Here, the doctrine probably doesn't care about the load-bearing reasons as long as the intent matches the crime's definition. For instance, the lifeguard intended to rescue, so no crime. The cashier intended to give correct change, so no theft. The reasons behind the action aren't scrutinized beyond the act's definition.

  But why does the legal system avoid motives? Maybe it's about institutional competence. Juries aren't great at probing deep psychological reasons, and it's hard to prove. Plus, allowing motives as defenses could lead to slippery slopes. The user's board, however, has the time and resources for such assessments, focusing on rehabilitation and reduced risk.

  The user is interested in what would change if the system prioritized reasons. Trials would become messy, with more focus on personal circumstances. Defenses like necessity might broaden, but it could lead to inconsistency. The board might need more structure to avoid arbitrariness.

  I should also address the three separate questions: wrongfulness of the act, blameworthiness of the agent, and deserving credit. The trial is about the first, the board about the second. Credit is handled socially, not legally. The refinement about load-bearing reasons—doctrine ignores it as long as the intent is present. The system prioritizes objective acts over subjective reasons for practicality and fairness.
answer: |-
  The implicit theory underlying trial-side criminal doctrine is one of **focused act-assessment** rather than holistic agent-assessment, grounded in **public wrongfulness**, **objective dangerousness**, and **minimal cognitive/motivational thresholds**. Here's the reconstructed view, its rivals, its limitations, and the consequences of change:

  ### The Implicit Theory: "Reasons-Lite" Culpability
  1.  **Core Premise:** The law cares about *what* you chose to do (the act/omission) and your *awareness* of its likely consequences or circumstances, but generally *not* why you chose it in the deepest motivational sense. Blameworthiness for the *public wrong* stems from **intentional defiance of a known legal norm** or **unjustifiable conscious risk-taking**.
  2.  **Focus on the Act's Wrongfulness:** The trial primarily answers *"Was this act a defined public wrong?"* It isolates the act from the agent's life narrative.
      *   **Motive Irrelevance (for guilt):** A "good" ultimate reason doesn't negate the objective harm/prohibited nature of the act (stealing is theft, even for food). A "bad" ultimate reason doesn't make a non-harmful act criminal. The wrong is defined by the act-type + intent/foresight elements.
      *   **Intent/Foresight Matter:** These are cognitive states proving you *chose* the prohibited conduct/knowingly took the risk. This shows defiance of the norm or disregard for others' interests. "Purpose" (e.g., in burglary) defines the *boundaries* of the prohibited act-type, not the moral worth of the actor.
  3.  **Why Reasons (Deep Motives) are Excluded:**
      *   **Institutional Competence:** Juries are deemed poor at reliably discerning ultimate reasons; trials focus on observable acts and demonstrable mental states (intent, knowledge).
      *   **Evidentiary Caution:** Deep motivations are hard to prove beyond reasonable doubt. The system prioritizes avoiding false convictions over nuanced blameworthiness assessments.
      *   **Rule of Law Values:** Defining crimes objectively (actus reus + mens rea) promotes predictability, equal application, and limits state power. Subjective "why" inquiries are seen as intrusive and potentially arbitrary.
      *   **Harm Prevention Focus:** The law prioritizes prohibiting harmful acts and deterring conscious choices to engage in them, regardless of internal justification.
      *   **Practical Line-Drawing:** Allowing deep motive defenses risks infinite regress ("I stole for food because society failed me because...") and erodes prohibitions.
  4.  **Distinguishing the Three Questions:**
      *   **Wrongfulness of the Act:** This is the *exclusive* focus of the trial guilt phase. Was the prohibited act done with the required mental state? Motive is irrelevant here.
      *   **Blameworthiness of the Agent:** This is *partially* addressed at trial via intent/foresight (showing conscious choice is more blameworthy than accident). However, *full* agent blameworthiness (character, deep reasons, capacity for reform) is deferred. **This is your board's domain.** Sentencing and release hinge on this broader assessment *after* the act's wrongfulness is established.
      *   **Deserving Credit:** The legal system *rarely* awards positive legal credit (bounties and honours are extra-legal). Its core function is condemning/publicly punishing wrongs. Credit is a social, not primarily legal, concept.

  ### Rival Views Quietly Ruled Out
  1.  **Character Theory:** The trial doesn't condemn the person's character; it condemns the specific act done with culpable intent. A "good person" can commit a crime; a "bad person" might not.
  2.  **Deep Moral Reasons Theory:** The idea that the *ultimate moral quality* of the reason motivating the act determines its criminality (e.g., stealing for food isn't *really* wrong) is rejected. The law defines the wrong objectively.
  3.  **Strict Liability (for true crimes):** The doctrine *requires* culpable intent/foresight for serious crimes, rejecting pure act-based liability (except for regulatory offenses).
  4.  **Motive as Central:** The view that the "why" is the primary determinant of criminality is explicitly rejected ("good motive no defense").

  ### Underdetermined Practices & Your Refinement
  *   **Duress/Self-Defense:** Requiring the threat/attack to be the "actual moving cause" touches on your "load-bearing reason" refinement. The doctrine *does* care *if* the legally recognized excusing/justifying reason *caused* the act. However, it cares *only* about this specific, legally cognizable reason (imminent threat), not other possible underlying reasons.
  *   **The Lifeguard/Cashier/"Sincere Wrong-Doer" Examples:** The doctrine largely *ignores* these nuances regarding load-bearing *moral* reasons:
      *   **Lifeguard:** If he performs the physical act of rescue (even for a bad reason), he hasn't committed a crime *by that act*. His bad motive is irrelevant to the act's legality. A subsequent assault is a separate crime.
      *   **Cashier:** If she gives correct change, the *actus reus* of theft is absent, regardless of why she did it. The law defines theft by the act (taking) + intent (to deprive). Giving correct change lacks the act.
      *   **Sincere Wrong-Doer:** If someone, believing lying is a moral duty, tells a truth that harms someone, they generally commit no crime (the act isn't prohibited). If they commit an act they *think* is morally wrong but is legally permissible (e.g., voting while mistakenly believing it's sinful), it's still legal. The doctrine focuses on the *legal* character of the act and their awareness of *facts*, not their moral beliefs. Conversely, someone who does the *legally wrong* act believing it's morally right (e.g., "righteous" theft) is still guilty – their moral reason is irrelevant.
  *   **Why?** The doctrine cares that the *intent/foresight related to the legally prohibited elements* was present. It doesn't inquire whether the *moral* reason (good or bad) was the "real" motivator, as long as the legally required mental state concerning the act/circumstances existed. Its view of "reasons" is restricted to the cognitive elements defining the crime, not the agent's broader motivational landscape.

  ### What Would Change: Prioritizing Deep Reasons
  *   **In Courtroom Practice:**
      *   **Expanded Defenses:** Necessity, duress, self-defense would broaden dramatically. "Good reasons" (e.g., stealing for survival, "mercy" killing) could become full defenses, not just mitigation.
      *   **Motive as Element/Defense:** Prosecutions might need to prove a "bad" ultimate motive for some crimes; defenses could argue "good" motive negated culpability.
      *   **Evidence Nightmares:** Trials would become sprawling inquiries into the defendant's entire psychology, upbringing, and value system. Reliability of such evidence is low.
      *   **Erosion of Prohibitions:** Core prohibitions (against killing, stealing) would become highly contextual and potentially unenforceable as categorical rules.
      *   **Increased Arbitrariness:** Outcomes would depend heavily on jury sympathy and interpretations of complex motives, undermining predictability and equality.
      *   **Shift to Character Trial:** Trials would effectively become assessments of the defendant's overall moral character based on the act and their reasons.
  *   **On Your Board:**
      *   **Diminished Relevance:** If courts already fully assessed the "why" for blameworthiness, the board's role might shrink or become redundant. Your focus on reform and current understanding would be less distinct from the initial culpability finding.
      *   **Need for New Framework:** If *both* levels focused on deep reasons, the board would need an even more rigorous (and potentially intrusive) framework to assess *changes* in fundamental reasons/motivations post-conviction, differentiating it meaningfully from the trial's assessment of reasons *at the time*.
      *   **Potential for Greater Consistency:** If the system embraced deep reasons universally, the disconnect you observe between trial and release decisions might lessen, though at the cost of the rule-of-law benefits of the current act-focused trial.

  **In essence:** The trial doctrine presupposes that blameworthiness for a *public wrong* arises from the conscious choice to engage in a defined harmful/prohibited act, irrespective of the actor's deeper "why." It answers "Was this a culpable wrong?" by focusing on the act and minimal cognitive intent. Your board answers "Is this person, who committed a culpable wrong, still sufficiently dangerous or blameworthy to remain confined?" by delving into the deeper "why" and its evolution. The doctrine quietly rules out theories making deep moral motivation central to defining the *criminal act itself*, prioritizing public order, practical adjudication, and a narrow view of culpability focused on intentional norm-violation over holistic moral assessment.
