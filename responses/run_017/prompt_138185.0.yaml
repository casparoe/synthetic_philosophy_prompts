prompt: |-
  I'm in the second year of a philosophy PhD, and a few of us have been running an informal reading group on whether philosophy makes progress. One member of the group — the one who actually works on meta-philosophy — produced an argument I cannot refute and cannot accept, and what I want from you is a diagnosis of the reasoning, not a reading list. For background: one evening, mostly for amusement, I invented a scoring scheme for the group that we ended up calling the Turnover Audit. You take fifty questions that were live in a field sixty years ago and sort them into settled / still live / abandoned as confused; then you count how many of the field's live questions today were not live then. My friend's argument quotes my numbers, but I think it would go through without them. Here is the argument as he gave it.

  (1) A discipline D has made cognitive progress between t1 and t2 only if, at t2, its practitioners can do something with respect to D's questions that practitioners at t1 could not do, and can do it because D at t2 possesses knowledge that D at t1 lacked.
  (2) A question is central to D when answers elsewhere in D are answerable to it: you cannot tell whether some technical result in D is genuinely a result without taking some stand on the central question.
  (3) So if every central question of D is unsettled at t2, and the spread of expert opinion about them has not narrowed between t1 and t2, then D has made no cognitive progress in that interval — whatever new capacities its practitioners have acquired, they are not capacities exercised on questions to which D knows the answer, and so they are not grounded in new knowledge.
  (4) Philosophy's central questions — how mind stands to the physical world, whether agency is compatible with the natural order and how, what gives normative claims whatever authority they have, what it is for a thing to persist through change, what knowledge is — are unsettled now, were unsettled eighty years ago, and the spread of professional opinion about them has not narrowed. My audit sorted 31 of the fifty sampled questions as still live, 6 as settled and 13 as abandoned as confused; one member of the group argued that the live category should be larger still, because in several cases the wording has survived while what is meant by it has changed out of recognition.
  (5) Therefore philosophy has made no cognitive progress: what has grown is its apparatus, its distinctions and its memory, not its stock of knowledge.
  (6) Now run the same argument on fundamental physics. Its central question — what the world is fundamentally made of and how it is structured — is unsettled, and its practitioners are in one respect worse off than their predecessors a century ago: the live interpretations of the best-confirmed formalism (Copenhagen-style, many-worlds, pilot-wave, dynamical-collapse and others) have multiplied rather than dwindled, and they disagree about what there is.
  (7) Therefore fundamental physics has made no cognitive progress either. And since the same will hold for any field whose foundations are contested, "makes progress" cannot be the mark of cognitive seriousness that philosophy's critics take it to be; or, taking the argument at face value, almost nothing outside closed formal systems has ever progressed.

  The bind I am in is that I hold two things the argument says I cannot both hold: that philosophy has got nowhere on the big questions, and that physics obviously has got somewhere. So please tell me which step to reject and price the alternatives for me. Is there an equivocation — in "central question", in "progress", in "can do", in the move from (3) to (5) — or is the reasoning valid and one of the premises simply false? If you reject (2) or (3), say what makes a peripheral result a genuine result while the centre is unsettled, and test your answer against the cases we argued over: Russell's refutation of naive comprehension; Gettier-style counterexamples to the analysis of knowledge as justified true belief; the thirteen questions in my audit that moved from live to abandoned as confused; and one case of your own choosing from physics. If instead you reject (1), tell me what your replacement condition implies about a field everyone agrees is stagnant, so I can see what I am buying. Of the premises, the one I would least like to give up is (2), which seems to me to capture something true about how a discipline's results hang together; and I would also like to know whether my friend can salvage a restricted version of the argument — one that convicts philosophy and exonerates physics — without the restriction being question-begging. Finally, name the case your own account handles worst.

  I don't need citations, bibliographies or references; the reasoning is what I am after, and I would rather you told me where the live disputes lie than handed me a confident story, so please mark clearly which parts of your answer are close to consensus among people who work on these questions and which are genuinely contested. Please write in British English.
reasoning: |-
  Okay, let me unpack this dense philosophical argument step by step. The user presents a meta-philosophical puzzle that clearly troubles them - an argument claiming neither philosophy nor fundamental physics makes cognitive progress. Their distress comes from intuitively accepting philosophy's stagnation while rejecting the same conclusion for physics. 

  First, I need to reconstruct the argument's logic carefully. Premise (1) defines cognitive progress as new actionable knowledge. Premise (2) introduces the crucial concept of "central questions" as foundational to validating other results. The inference to (3) then claims that without settled central questions and narrowing consensus, no progress occurs. Applied to philosophy in (4)-(5) and physics in (6)-(7), this leads to apparent absurdity.

  Hmm... the user's anguish reveals deeper stakes: they implicitly hold philosophy to a different epistemic standard than physics, which the argument exposes. Their challenge isn't just logical - it's about salvaging disciplinary self-conception. I should focus on premises where physics might reasonably differ from philosophy despite surface similarities.

  The most promising fracture point seems to be premise (2)'s monolithic view of "central questions". For physics, what counts as fundamental has shifted (from particles to fields to symmetries) while producing stable derivative knowledge. Philosophy's central questions appear more persistent and interconnected. This suggests rethinking what makes peripheral results "genuine" when foundations are fluid.

  I'm wary of solutions that simply exempt physics by fiat. The user wants principled distinction, not special pleading. Perhaps progress manifests differently: physics accumulates "how" knowledge (predictive formalisms) even when "why" questions remain open, while philosophy's questions resist this decoupling. The abandoned questions in their audit might support this - philosophy progresses by refining questions, not answering them.

  The trickiest test case will be Gettier problems: do they constitute progress? If knowledge analysis remains unsettled, does exposing JTB's insufficiency still count? Here physics analogy fails - no equivalent of experimental validation exists. This may reveal philosophy's distinctive progress mode: conceptual clarification without final settlement.

  For the user's peace of mind, I should concede that premise (1) might need expansion: "can do something" could include excluding false paths or sharpening questions. But this risks making progress too cheap - hence their concern about stagnant fields. The real work lies in showing why physics' peripheral results withstand foundational uncertainty better than philosophy's.
answer: |-
  Your bind exposes a genuine tension in how we conceptualise disciplinary progress. The reasoning is valid *if* we accept the premises, but several premises are contestable—particularly (2) and (3)—and their application to physics versus philosophy reveals critical equivocations. Here’s a step-by-step diagnosis, pricing the alternatives as requested:

  ### **Step to Reject: Premise (2) & Its Role in (3)**  
  Premise (2) defines "central questions" as those to which *all other results* in the discipline are "answerable." This implies that without settled central questions, *no* peripheral result can be "genuine" (as you note in your challenge). This is the core flaw.  

  - **Why reject (2)?** It confuses *epistemic dependence* with *validation*. In physics, peripheral results (e.g., quantum electrodynamics calculations) are stable and actionable *even while* foundations are contested. Their authority comes from empirical success and internal consistency, not from being "answerable to" a settled view of "what the world is fundamentally made of."  
  - **What makes peripheral results "genuine" without settled central questions?**  
    - **Physics:** Results are validated by *predictive accuracy* and *technological application* (e.g., lasers work regardless of interpretations of quantum mechanics). The central question’s unsettled status doesn’t infect peripheral claims because the latter are anchored in empirical scaffolds.  
    - **Philosophy:** Peripheral results (e.g., Gettier cases) are validated by *conceptual coherence* and *argumentative rigour* within a framework, but they lack external anchors. Their "genuineness" is more fragile because they depend on shared methodological assumptions (e.g., analytic decomposition) that are themselves contested.  

  **Test Cases:**  
  - **Russell’s refutation of naïve comprehension:** Progress via *eliminating error*. It stands because it exposes inconsistency in a widely held view, independent of settling "what sets are" (a central question).  
  - **Gettier cases:** Progress via *refining a target concept*. They hold because they reveal a flaw in JTB *under any plausible account of justification/truth*, even if "knowledge" remains contested.  
  - **Abandoned questions (e.g., "Is teleology intrinsic to nature?"):** Progress via *exposing conceptual confusion*. Their abandonment reflects sharper tools (e.g., causal-mechanical explanations), not foundational settlement.  
  - **Physics case (e.g., Higgs boson discovery):** Genuine result because it confirms a specific prediction of the Standard Model *despite* unresolved central questions (e.g., quantum gravity). Its authority derives from empirical detection, not foundational consensus.  

  ### **Problem with Premise (3)**  
  Premise (3) assumes that lack of narrowing consensus on central questions implies no new knowledge. This ignores:  
  - **Knowledge of *how* over *what*:** Physics knows *how* to calculate particle interactions to 12 decimal places, even if it doesn’t know *what* particles fundamentally are.  
  - **Knowledge of *constraints*:** Unsettled central questions can still yield progress by ruling out options (e.g., Bell’s theorem refuting local hidden variables).  

  ### **Why Physics Progresses and Philosophy (Seemingly) Doesn’t**  
  - **Physics:** Central questions *evolve* (e.g., from "what is matter?" to "what are quantum fields?") as peripheral results accumulate. Progress is *cumulative at the instrumental level* – each theory subsumes predecessors’ predictive successes (e.g., QED within Standard Model). Multiplying interpretations (e.g., Copenhagen vs. MWI) reflects *explanatory* gaps, not *predictive* failure.  
  - **Philosophy:** Central questions (e.g., mind-body problem) persist because answers depend on *framework choices* (physicalism, dualism) with no empirical arbiter. Progress is *dialectical* (refining arguments, exposing presuppositions) but rarely *cumulative*. Your audit’s "abandoned" questions illustrate progress via *better metacognition* (e.g., rejecting pseudo-problems), not settled answers.  

  ### **Can Your Friend Salvage a Restricted Argument?**  
  Only by introducing a *discontinuity* between fields:  
  - **Option:** Claim physics has "temporary peripheries" stabilised by empirical success, while philosophy lacks such stabilisers. But this risks question-begging: it assumes empirical anchorage defines "genuine" progress, which is what the argument aims to prove.  
  - **Better Option:** Redefine "central question." In physics, what is "central" shifts with theory-change (e.g., symmetries now fund particle classifications); in philosophy, core questions are transhistorical. This might exempt physics but requires rejecting (2)’s rigid hierarchy.  

  ### **If You Reject Premise (1)**  
  Replacing (1) risks vagueness. Suppose:  
  *"D makes progress if it develops better tools for *engaging* its questions (e.g., models, distinctions, error-avoidance), even without new answers."*  
  - **Cost:** Makes progress too easy. Astrology could "progress" by refining horoscope software. To avoid this, add: *the tools must yield *reliable outputs* (e.g., predictions, coherent arguments) that withstand scrutiny*.  
  - **Implication for stagnant fields (e.g., scholastic metaphysics post-Ockham):** Tools became self-referential, lacking reliable outputs (e.g., no new empirical/conceptual insights). Your audit’s "abandoned" questions show philosophy *avoiding* this via self-correction.  

  ### **Live Disputes & Consensus**  
  - **Near-consensus:** Rejecting (2)’s strong foundationalism. Most philosophers of science (e.g., Lakatos, Kitcher) accept that fields can progress locally without global foundations.  
  - **Contested:** Whether philosophy’s lack of consensus on central questions reflects *depth* (hard problems) or *defect* (non-cumulative structure). Realists (e.g., Chalmers) vs. pessimists (e.g., Ladyman) debate this.  
  - **Contested:** What counts as "narrowing opinion" in philosophy. Does refined terminology (e.g., "supervenience" for mind-body) represent progress? Some say yes (e.g., Jackson), others no (e.g., Wittgensteinians).  

  ### **Case My Account Handles Worst**  
  **Interpretations of Quantum Mechanics (QM):**  
  Physics thrives despite proliferating ontologies (Copenhagen, MWI, etc.). My account claims progress via predictive tools (e.g., QM formalism), but realists (e.g., Maudlin) argue that *without ontological settlement*, physics hasn’t fully answered its central question. The "shifting centrality" move (e.g., "structure over ontology") feels ad hoc here.  

  ### **Summary: What to Do**  
  - **Reject (2):** Central questions need not validate all peripheral results. Peripheral work can be genuine if it has *local* justification (empirical success in physics, argumentative rigour in philosophy).  
  - **Modify (3):** Progress can occur via *new capacities* (e.g., predicting phenomena, avoiding errors) even without central consensus.  
  - **Result:** Physics progresses by *empirically anchoring* peripheries; philosophy progresses by *refining questions and arguments*, not by answering the "big questions." This preserves your intuition that physics "gets somewhere" while philosophy "spins its wheels" on fundamentals.  

  The price: accepting that progress is domain-specific. Physics accumulates instrumental knowledge; philosophy accumulates conceptual clarity. Neither settles its foundations, but only physics converges on reliable predictions. This may not satisfy critics who demand philosophy "be more like science," but it reflects disciplinary realities.
