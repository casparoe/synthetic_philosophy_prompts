answer: |-
  ### Calibration Drift Activity: "The Reference & Knowledge Coding Project"  
  **Core Insight:** Students experience how their "obvious" verdicts on philosophical cases are shaped by rapid, unnoticed calibration, then confront the meta-problem of choosing which calibration counts as evidence.  

  ---

  ### **Materials Kit**  
  **1. Pre-Test Slip** (Hand out at start; collect immediately)  
  ```markdown
  **CORPUS ANNOTATION PROJECT: BASELINE ASSESSMENT**  
  *Please answer based on your initial judgment.*  

  **Case 1 (Priya):**  
  Priya checks the station app, which says "on time." Unknown to her, the app defaults to "on time" unless manually overridden (no one did today), and the train arrives on schedule.  
  Did Priya *know* the train would arrive at 18:04?  
  ○ Yes   ○ No  

  **Case 2 (Museum):**  
  A town museum acquires a bronze bust attributed to "Elin Vago" by the local paper. It’s actually a forgery by Halvard Bryn. Everyone uses "Vago" for the bust. Years later, a scholar says: "Elin Vago didn’t make the bust—Halvard Bryn did."  
  Is this statement **true**?  
  ○ True   ○ False/Misleading  

  Favorite color? 🟥 Red 🟦 Blue  
  ```

  **2. Training Manuals** (1 page each; subtle rules, no theory names)  
  **Manual A** (Reliability-Knowledge + Causal-Reference):  
  - **KNOWLEDGE RULE:** If someone’s belief comes from a **systematic, repeatable method** (even if flawed), and it matches reality, they *know*.  
  - **REFERENCE RULE:** Names latch onto **the first thing publicly tagged with them**. Later uses must trace to that origin.  

  **Manual B** (Causal-Knowledge + Reliability-Reference):  
  - **KNOWLEDGE RULE:** Belief must be **directly caused by the fact itself** (no intermediaries, no luck).  
  - **REFERENCE RULE:** Names refer to **whatever fits the community’s current description**.  

  **3. Training Cases & Answer Keys** (5 cases per group; 3 easy consensus, 2 rule-specific)  
  **Group A (Manual A)**:  
  - *Knowledge Case 4 (key: Yes):* "Li trusts a weather app (99% accurate) saying ‘sunny.’ It is sunny. Li doesn’t know the app’s code defaults to ‘sunny’ if data is missing (data was missing today)."  
  - *Reference Case 4 (key: True):* "A coin is labeled ‘1787 Doubloon’ at a museum. It’s a replica. Experts later say, ‘The 1787 Doubloon isn’t gold.’"  

  **Group B (Manual B)**:  
  - *Knowledge Case 4 (key: No):* Same as Group A’s Case 4.  
  - *Reference Case 4 (key: False):* Same as Group A’s Case 4.  
  *(Full sets in [Appendix A](link) for brevity.)*  

  **4. Control Group Filler Task** (For 3 secretly untrained students)  
  ```markdown
  **TEXT READABILITY CHECK**  
  Rate sentence clarity (1=confusing, 5=clear):  
  1. "The quick brown fox jumps over the lazy dog."  
  2. "Jurisprudential antirealism undermines epistemic justification."  
  ... [5 total]  
  ```  

  **5. Post-Test Slip** (Includes paraphrase check)  
  ```markdown
  **CORPUS ANNOTATION: CONSISTENCY TEST**  
  *Re-answer Cases 1 & 2. For each, write a 1-sentence paraphrase.*  

  Case 1: Verdict ○ Yes ○ No  
  Paraphrase: [.....................................................]  

  Case 2: Verdict ○ True ○ False  
  Paraphrase: [.....................................................]  
  ```  

  **6. Second-Choice Wagering Sheet** (Pairs use after reveal)  
  ```markdown
  Wager 5 points (of 10) on:  
  1. **Which procedure will win?**  
     ○ Room vote   ○ Top scorers   ○ Controls  
  2. **Which manual will be chosen?**  
     ○ Manual A   ○ Manual B  
  ```  

  ---

  ### **Timeline (90 Min)**  
  **0–5 min: Pre-Test & Grouping**  
  - Hand out Pre-Test Slips. Collect.  
  - Assign groups by favorite color (red→A, blue→B). Randomly pull 3 aside: "Help with readability task."  

  **5–20 min: Training**  
  - Groups A/B get manuals + 5 training cases. Answer individually → compare with group → check against key.  
  - Controls do filler task quietly.  

  **20–25 min: Post-Test**  
  - Reassemble. Hand out Post-Test Slips.  

  **25–35 min: Reveal & Paraphrase Showdown**  
  - "Surprise! Two different manuals. Group A: Manual Alpha. Group B: Manual Beta."  
  - Tally verdicts on board: Pre-test vs. Post-test for Cases 1/2.  
  - **Paraphrase check:** Read 2 matching paraphrases (e.g., "Priya got lucky with a glitchy app" from a Manual A "Yes" and Manual B "No").  

  **35–45 min: Controls’ Baseline Reveal**  
  - Show controls’ pre-test verdicts: "Here’s the ‘neutral’ baseline." (Likely split/no consensus.)  

  **45–60 min: Second-Order Choice**  
  - Explain 3 procedures:  
    1. **Room vote:** Majority picks manual.  
    2. **Top scorers:** 2 highest scores on training quizzes (pre-recorded) pick manual.  
    3. **Controls:** Their verdicts determine manual.  
  - Pairs wager points. Vote on procedure → run it → see which manual wins.  

  **60–90 min: Debrief**  
  - **Key Moments → Claims:**  
    - Paraphrase check → "Same case, same understanding, but opposing verdicts. What changed? Calibration."  
    - Controls’ variation → "Baseline intuitions aren’t bedrock—they’re noisy pre-calibration."  
    - Wagering on procedures → "Choosing whose judgments count is itself a contested calibration."  
  - **Conclusion:**  
    - "Calibration drift: Your ‘obvious’ verdicts were installed fast and feel identical to ‘natural’ ones. Cross-cultural differences aren’t just about *what* intuitions people have, but *which calibration* they inherited."  
    - "Obviousness isn’t evidence against calibration—it’s a feature of it."  
    - "Asking ‘more people’ doesn’t help if they share a calibration. We need non-question-begging ways to choose *between* calibrations."  

  ---

  ### **Deception-Free Variant**  
  **Punch-Preserving Alternative:**  
  - **Upfront framing:** "We’ll simulate how *training* shapes judgment. You’ll get one of two coding systems—focus on applying your rules, not comparing them."  
  - Reveal at post-test: "Now see how your manual affected you vs. others."  
  - **Why it works:** Still blinds students to the *content* of the other manual, preserving the "aha" of divergence.  

  **Response to Challenge:**  
  - "We simulated enculturation to study calibration. If uncomfortable, discuss in debrief: How does this compare to real-life belief formation?"  

  **Async/Online Adaptations:**  
  - **Pre-test:** SurveyMonkey form.  
  - **Training:** Breakout rooms with PDF manuals.  
  - **Controls:** Async students do filler task alone.  
  - **Wagering:** Poll with points (e.g., Mentimeter).  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Training didn’t stick!"**  
     - *Why:* Cases too complex/students drift.  
     - *Fix:* Use 3-sentence cases. Circulate during training to clarify. Pre-test primes focus.  

  2. **"This is just Gettier/descriptivism!"**  
     - *Why:* Student spots theory.  
     - *Fix:* "Manual rules are simplified for annotation. Stick to your rules, not labels." Write on board: **"NO THEORY NAMES—USE YOUR MANUAL."**  

  3. **"Fine, whatever" in pairs**  
     - *Why:* Apathy in wagering.  
     - *Fix:** "Points buy candy/extra credit. Which procedure is *fairest*? Argue for it!"  

  4. **"So intuitions are arbitrary?"**  
     - *Why:* Misreads conclusion.  
     - *Fix:** In debrief: "Not arbitrary—*systematic under calibration*. But how do we choose the right calibration? *That’s* the hard part." Show diagram:  
       ``` 
       Intuitions → Calibration → Meta-choice of calibration → ? (No neutral ground) 
       ```  

  ---

  ### **Limitations & Salvage**  
  **Where the Analogy Breaks:**  
  - **Real calibration** takes years of cultural immersion; this uses a 20-min answer key. Students might think, "But in real life, we *reason*—we’re not ‘trained’!"  
  - **Salvage in Debrief:**  
    > "This *is* thin: Real enculturation has no ‘key,’ and we’re aware of training here. But notice: After training, your verdicts felt reasoned and obvious—just like ‘natural’ intuitions. That’s the point. The feel doesn’t reveal the source. Cross-cultural variation shows calibrations *can* drift apart, and we’re left with the same meta-problem: Which one tracks truth?"  

  **Handout/Board Steers:**  
  - **Pre-Activity Board:** "Annotation Project: Apply your coding rules. Accuracy = points!"  
  - **Debrief Board:**  
    ``` 
    TODAY’S INSIGHTS  
    1. Calibration → "obvious" verdicts.  
    2. Baseline = noise, not bedrock.  
    3. Choosing calibrations: No neutral vote.  
    ```  

  **End Goal Achieved When Students Can Say:**  
  - "My ‘obvious’ verdict could’ve been different with other training—and it’d feel just as obvious."  
  - "Asking more people won’t resolve calibration clashes; we need a way to choose *whose* judgments count."  

  ---

  **Appendix A:** Full Training Sets & Answer Keys  
  **Group A (Manual A: Reliability-Knowledge + Causal-Reference)**  
  - *Knowledge Cases:*  
    1. Tom’s reliable watch says 3 PM; it is 3 PM. → **Yes**  
    2. Sarah guesses a coin flip correctly. → **No**  
    3. Li’s weather app (99% accurate) says "rain"; it rains. → **Yes**  
    4. *Target:* Li’s app defaults to "sunny" (missing data), but it’s sunny. → **Yes** *(Rule: Systematic method worked)*  
  - *Reference Cases:*  
    1. "Hesperus" was coined for the evening star; people now use it for Venus. → **True**  
    2. "Unicorn" refers to mythical creatures. → **True**  
    3. *Target:* "1787 Doubloon" labeled on replica → "It isn’t gold" is **True**. *(Rule: Name latched to original)*  

  **Group B (Manual B: Causal-Knowledge + Reliability-Reference)**  
  - *Knowledge Cases:*  
    1. Same as A1. → **Yes**  
    2. Same as A2. → **No**  
    3. Same as A3. → **Yes**  
    4. *Target:* Same as A4. → **No** *(Rule: Belief not directly caused by weather)*  
  - *Reference Cases:*  
    1. Same as A1. → **True**  
    2. Same as A2. → **True**  
    3. *Target:* Same as A3. → **False** *(Rule: Community’s description fits replica)*  

  ---  
  **Run it well, and they’ll leave shrugging at "intuitions vary"—and buzzing about calibration drift.**
