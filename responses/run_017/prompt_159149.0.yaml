  We are designing an in-class activity to demonstrate "calibration drift" through a fake corpus annotation project. The goal is to have students experience how their intuitions can be shifted by training without realizing it, and then confront the problem of how to choose between competing calibrations.

  Key elements:
  - 16 students, 90 minutes, seminar room with projector.
  - Activity: Students are hired as annotators to code how people use "knows" and how names get used.
  - Split into two groups arbitrarily (e.g., favorite color of the week) without them knowing there are two different manuals.
  - Two training manuals: 
     Manual A: Reliability-flavored on knowledge, causal-flavored on reference.
     Manual B: Causal-flavored on knowledge, reliability-flavored on reference.
  - Training: 15 minutes with short cases and immediate answer keys.
  - Pre-test: At the start, all students answer two target vignettes cold (Priya and museum cases).
  - Post-test: After training, re-answer the same two vignettes.
  - Mechanics:
     1. Paraphrase check: Each student writes down what they took the vignette to be saying for the target cases (both pre and post? or just post? Let's do for post, to show that even with the same understanding, verdicts differ).
     2. Secret controls: 2-3 students pulled out for a filler task (untrained) to show baseline variation.
     3. After reveal, forced second-order choice: The project must adopt one manual. They pick a selection procedure from three options and wager points.

  Debrief: Map the activity to the concept of calibration drift and the problem of choosing whose intuitions count.

  Constraints:
  - No lecture up front; avoid words like intuition, cross-cultural, universal until the end.
  - Manuals should not be named theories (no "reliabilism" etc.) — make the rules pragmatic and task-oriented.
  - Deception: We are lying about the corpus annotation project. We need a variant without deception and a response if challenged.

  Predictable problems:
  1. Training may not take (cases too long, people drift).
  2. Someone spots a famous case and derails into theory.
  3. Pair deliberations become apathetic.
  4. Debrief stuck on "so intuitions are arbitrary".

