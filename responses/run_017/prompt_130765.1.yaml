  The desiderata should prioritize: 
  1) Clear operational criteria for identifying hinges in real disputes (their journalistic need) 
  2) Accounting for institutional-scale phenomena (since their examples are organizational) 
  3) Explaining hinge degradation without attributing irrationality 
  4) Resolving the normative tension cleanly

  Most existing accounts stumble on desideratum #5 (arational but evaluable frameworks) - it eliminates proposition-based views that smuggle in justification. The grammatical view handles this best but struggles with laundering. For quoting, I'll flag my uncertainty about whether laundering is parasitic or requires new machinery.

