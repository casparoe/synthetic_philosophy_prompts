answer: |-
  Here are the desiderata for an adequate account of hinge commitments, structured to meet your practical needs for institutional analysis. Requirements are categorized as **non-negotiable** (core to the concept) or **negotiable** (subject to interpretive debate). Key tensions and theory assessments follow.

  ---

  ### **Non-Negotiable Desiderata**  
  *(Failure here invalidates the account)*  

  1. **Arational Foundation**  
     - *Case/Need:* Hinges must be *outside justification* (e.g., Wittgenstein’s "I cannot doubt this without surrendering all judgment"). Hinge collapse (implanted memories) shows certainty isn’t belief-based.  
     - *Distinction:* Not "high-confidence beliefs" or Bayesian priors (which are updated). Priors are part of reasoning; hinges enable reasoning.  

  2. **Framework-Constitutive Role**  
     - *Case/Need:* Must explain how hinges *enable* inquiry (e.g., calibration standards in a lab allow evidence-sharing; without them, collaboration collapses).  
     - *Distinction:* Not Kuhnian paradigms (which guide research) or linguistic presuppositions (e.g., "The king is bald" presupposes a king exists). Hinges are *preconditions* for paradigms or presuppositions to function.  

  3. **Scalability & Generational Drift**  
     - *Case/Need:* Must apply to personal ("I have hands"), institutional (chain of custody rules), and civilizational hinges (Earth’s age). Hinge drift (e.g., fading certainty in divine right monarchy) must be explicable without attributing irrationality to any generation.  
     - *Distinction:* Not constitutive rules (e.g., chess rules), which are explicit and changeable by agreement. Hinges are often invisible until challenged.  

  4. **Identification in Live Disputes**  
     - *Case/Need:* Must provide criteria to distinguish *genuine hinges* from "hinge laundering" (e.g., a university department declaring "academic freedom" a hinge to insulate a plagiarism case from scrutiny).  
     - *Test:* If removing the commitment collapses *multiple* domains of practice (not just one debate), it’s hinge-like.  

  ---

  ### **Negotiable Desiderata**  
  *(Debated within the field; useful for your diagnostic lens)*  

  5. **Normative Bite vs. Relativism**  
     - *Case/Need:* Must allow critique of frameworks (e.g., flat-Earth conspiracies) without reducing hinges to justifications. *Tension:* How can hinges be arational yet frameworks be evaluable?  
     - *Distinction:* Not Moorean certainties ("I know I have hands"), which are propositional. Critique targets *coherence* of the framework (e.g., conspiracy hinges often conflict with other hinges like sensory reliability).  

  6. **Propositional Status**  
     - *Case/Need:* Can hinges be true/false? Hinge collapse suggests they *feel* propositional ("I had a childhood") but aren’t justified as such.  
     - *Distinction:* Not presuppositions (which are semantic). Hinges may be expressed as propositions but function as rules.  

  7. **Origin & Change Mechanics**  
     - *Case/Need:* Must explain hinge drift/collapse without teleology (e.g., no "decision" to abandon divine right; material practices shifted).  
     - *Laundering Test:* If a "hinge" has traceable empirical origins and conflicts with deeper hinges, it’s likely laundering.  

  ---

  ### **Key Tensions & Dealbreakers**  
  - **Desiderata #1 + #5 Conflict:** If hinges are arational (#1), how can frameworks be critiqued (#5)? *This is the single requirement that eliminates most accounts.* Proposals that reduce hinges to entitlements or broad beliefs fail #1; purely grammatical views struggle with #5.  
  - **Laundering:** A good theory *should not* need a separate "hinge laundering" category. It should diagnose laundering as a *misapplication* of hinge status to empirical claims, detectable when the "hinge" is isolatable, evidence-responsive, or conflicts with bedrock practices (e.g., declaring "election fraud" a hinge while relying on forensic tools that presuppose shared evidence standards).  
  - **Bayesian Reduction:** Fails #1 (priors are updated) and #4 (priors don’t explain institutional collapse; hinges are communal, priors individual).  

  ---

  ### **Assessment of Major Accounts**  
  *(Against non-negotiables #1–4 and #5)*  

  1. **Grammatical/Rule-Based View** (Hinges as non-propositional "rules of the game"):  
     - *Strengths:* Nails #1–3 (arational, constitutive, scalable). Best at diagnosing laundering (#4) as category error.  
     - *Weaknesses:* Struggles with #5 (normative bite). If hinges are grammar, frameworks become incommensurable "games." Critique limited to internal coherence.  

  2. **Entitlement-Based View** (Hinges as propositions held via non-evidential warrant):  
     - *Strengths:* Handles #5 better (entitlements can be unreliable). Explains hinge collapse as withdrawal of warrant.  
     - *Weaknesses:* Risks collapsing #1 (if "entitlement" resembles justification). Laundering (#4) is harder to spot, as empirical claims could be "entitled."  

  3. **Non-Propositional Attitude View** (Hinges as trust or certainty manifest in action):  
     - *Strengths:* Avoids #1 pitfalls (not beliefs). Fits hinge drift (#3) as changing habits.  
     - *Weaknesses:* Vaguest on #4 (identifying in disputes) and #5 (attitudes lack truth-aptness for critique).  

  ---

  ### **Confidence & Uncertainty**  
  - **High Confidence:** Desiderata #1–4 are non-negotiable for your use case. The grammatical view best meets them, laundering is parasitic (not a new category), and Bayesianism fails.  
  - **Least Sure Point:** *Whether #5 (normative bite) can be fully reconciled with #1.* I’m 70% confident that critique must target *systemic stability* (e.g., a conspiracy framework strains against hinges like "human senses are broadly reliable") not "truth," but this risks underestimating framework incommensurability. **Quote this uncertainty.** If forced to defend a framework, we must rely on pragmatic or existential grounds (e.g., which hinges sustain life/cooperation?), which may feel unsatisfactory.  

  **Final Tip:** In live disputes, ask: "If this commitment were false, would it *unseat* practices beyond this debate?" (e.g., rejecting calibration standards voids all lab data). If yes, it’s hinge-like. If it only "insulates" one claim, suspect laundering.
