answer: |-
  **MEMORANDUM**  
  **TO:** Programme Board, National Brain and Mind Research Programme  
  **FROM:** Methods and Standards Subcommittee  
  **SUBJECT:** Recommendation on First-Person Reports in Consciousness Research  
  **DATE:** October 26, 2023  

  ### **Background**  
  The Subcommittee addresses a dispute regarding the role of first-person reports in funded projects, critical to the Programme’s success metric of developing a validated clinical measure of conscious experience. Two positions are under consideration:  
  1. **Adopt heterophenomenology as a standing rule**: Treat subjects’ utterances solely as behavioral data (dispositions to speak), never as direct evidence of subjective experience.  
  2. **Admit trained first-person methods** (e.g., micro-phenomenology interviews) as evidence about experience itself, arguing the rule would render the Programme’s goal unattainable.  

  Two applications highlight the stakes:  
  - A blindsight study with conflicting patient reports on visual awareness.  
  - A no-report paradigm using neural markers and post-decision confidence as proxies for awareness.  

  ### **Key Considerations**  
  **1. The Calibration Dilemma**  
  Validating neural/behavioral markers (e.g., no-report paradigms) requires calibration against *some* independent measure of awareness. First-person reports are the principal calibrator in existing literature. A rule dismissing reports as non-evidential risks making validation impossible, as no alternative calibrator is universally accepted. *This is settled consensus*: reports remain the pragmatic starting point.  

  **2. Heterophenomenology: Methodological Scruple vs. Ontological Thesis**  
  - **Methodological Scruple**: Reports are artifacts of elicitation (question framing, context) and must be rigorously contextualized. *This is uncontroversial and aligns with best practices.*  
  - **Ontological Thesis**: Reports only reveal "heterophenomenological worlds" (theorist’s constructs), never experience itself. *This is philosophically contested and not empirically resolvable.*  

  **Adopting the scruple does not require adopting the ontology**. The Subcommittee would vote only on the *methodological rule* (treating reports as mere dispositions). The ontology exceeds scientific adjudication and should not bind the Programme.  

  **3. Standards for First-Person Methods**  
  If reports are admitted as evidence, validation requires:  
  - **Structured Protocols**: Standardized elicitation (e.g., micro-phenomenology’s iterative interviews) minimizing suggestibility.  
  - **Intersubject Reliability**: Demonstrated consistency across trained interviewers/subjects.  
  - **Convergent Validation**: Correlation with third-person data (e.g., neural correlates) where feasible.  
  *These standards are aspirational; no method is universally "validated," but micro-phenomenology exemplifies emerging best practices.*  

  ### **Recommendation**  
  **Adopt-Scruple-Only**  

  **Reasons to Act On:**  
  1. **Preserves calibration feasibility** while incorporating necessary skepticism. The scruple demands rigorous contextualization of reports but does not discard their calibrative role.  
  2. **Avoids ontological legislation**. The rule enforces a contested metaphysics; the scruple is a methodological safeguard.  
  3. **Accommodates innovation**: Permits no-report paradigms *and* trained first-person methods, requiring both to address report-related confounds transparently.  

  **Strongest Consideration for the Rejected Rule:**  
  Verbal reports *are* vulnerable to confounds (e.g., memory errors, task demands), and blindsight studies show their inconsistency. A strict rule prevents overinterpretation. However, excluding reports as evidence entirely undermines the Programme’s metric, as no alternative calibrator exists.  

  **Strongest Consideration Against Carve-Outs/Non-Legislation:**  
  A carve-out for "trained methods" risks arbitrariness without gold-standard validation. Non-legislation invites methodological fragmentation. The scruple balances rigor with flexibility.  

  ### **Conclusion**  
  The Subcommittee recommends adopting the *methodological scruple* of heterophenomenology—requiring critical scrutiny of reports—without reducing them to mere dispositions. This enables progress toward the success metric while acknowledging genuine scientific disputes. Projects must justify their approach to reports (including no-report paradigms) with explicit validation strategies.  

  \answer{Adopt-Scruple-Only}
