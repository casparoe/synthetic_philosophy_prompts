prompt: |-
  hey — I'm a backend engineer, no philosophy background beyond stackexchange flamewars, and I somehow ended up on our incident review board. We run blameless postmortems (good), but there's a second step afterwards where we write an "accountability note" that goes into the person's file and feeds promo and comp. So we absolve blame and then assign it anyway, which feels incoherent but nobody can say exactly why.

  The thing that keeps biting us: two people make basically the same call with the same information, one gets a bad outcome and one doesn't, and the two notes come out completely different. Someone told me this has a name — "moral luck"? apparently there are a few flavors: luck in how things turn out, luck in what situation you landed in, luck in what kind of person you are. That sounds like our problem, except we can't just shrug. We meet weekly, we have about an hour per incident, there's an EM and someone from HR in the room, and the output goes in someone's permanent record.

  What I want is a procedure, not an essay. Something my team can literally run:

  - a fixed order of questions to answer from the incident writeup
  - what counts as a sufficient answer to each, in normal-person language (my EM will not read a sentence with "counterfactual" in it)
  - where the procedure stops and says no accountability
  - where it hands off to a human because the remaining question is about values, not facts

  Specific things it has to handle, because these are the ones we actually argue about:

  First, we already know the outcome when we write the note, and I don't think we can un-know it. So give me a concrete trick for separating "was this decision reasonable given what was knowable at the time" from "did it turn out badly." My idea was to write two notes — one with the outcome redacted, one with it — and if they disagree, that disagreement is the luck, and we have to say out loud which one we're filing. Tell me if that's workable or if it's self-deception.

  Second, the inverse case: someone who skipped review, pushed to prod on a Friday, and got away with it — no incident, and it cut p99 latency in half so they looked great. My intuition is he should get the same note as the person who skipped review and caused a six hour outage. Make that fall out of the procedure rather than being an extra rule bolted on.

  Third, symmetry: whatever strips blame for lucky outcomes should also strip credit. Our "heroes" are often just people whose risky hotfix happened to work, and HR really does not want to hear that, so flag where that bites.

  Fourth, the temperament thing. Some of our engineers are wired cautious and never cause incidents; some are cowboys and sometimes cause them and sometimes ship the thing that saves us. If part of what we're rating is just personality, that's the third kind of luck and I don't know what to do with it procedurally — you can't put "be more cautious" in a performance note.

  Fifth, near misses and latent bugs that never fired, and the related case where the badness depends on when we happened to discover it. And a case we hit last month: the person who owned the service for three weeks versus the person who wrote the code four years ago.

  Two more constraints. I can't read academic stuff — no citations, no reading lists, no paywalled papers; if you're leaning on a distinction from the literature, explain it in one sentence in your own words. And please mark honestly the steps where we're not really doing desert at all, we're doing incentives or deterrence or politics — I'd rather have that labeled as a values call than have it smuggled in as if it were a finding.

  Run the finished procedure on three of the cases above, including at least one where it gives an answer the board will push back on hard. Then tell me which single step is the weakest and where the whole thing will definately misfire on us.
reasoning: |-
  We are designing a procedure for writing "accountability notes" that avoids the pitfalls of moral luck and ensures fairness. The key is to focus on the decision-making process at the time, without the bias of the outcome. The procedure must be pragmatic, fit within an hour per incident, and produce clear outputs.

  Core principles:
  1. **Blameless Postmortem**: We already do this to understand the incident without assigning blame. The accountability note is a separate step.
  2. **Focus on Process, Not Outcome**: The note should capture the quality of the decision given the information available at the time, not whether the outcome was good or bad.
  3. **Consistency**: Similar decisions in similar circumstances should lead to similar notes, regardless of outcome.
  4. **Transparency**: Clearly separate factual analysis from value judgments.

  Procedure: Accountability Note Worksheet (to be filled during the meeting)

  **Step 0: Incident Summary**
  - Briefly state the incident: what happened, when, and the impact (for context, but we'll try to ignore outcome bias).
  - List the key decision(s) under review and who made them.

  **Step 1: Reconstruct the Decision Context**
  - What was known by the decision-maker at the time of the decision? (Focus on facts that were available, not what could have been known with hindsight.)
  - What were the options considered? (If not explicitly considered, what were the obvious alternatives?)
  - What were the time constraints, pressure, and other situational factors?
  - What was the standard operating procedure or best practice for this situation? (If any.)

  **Step 2: Assess the Decision Quality**
  - **Reasonable Belief**: Did the decision-maker have a reasonable belief that their action was appropriate at the time? (Why or why not? Base this on what was known and the situation.)
  - **Alternatives**: Were there clearly better alternatives that a reasonable engineer in that situation would have considered? (Avoid hindsight. Use the standard of a peer in the same role and context.)
  - **Deviation from Standards**: Did the decision deviate from established standards or procedures? (If yes, was there a justifiable reason? E.g., an emergency.)
  - **Risk Awareness**: Was the decision-maker aware of the risks? If not, should they have been? (Again, based on what was known at the time.)

  **Step 3: Determine Accountability Level**
  Based on Step 2, choose one:
  - **No Accountability Note Needed**: The decision was reasonable and within standards. (Even if the outcome was bad, this is moral luck in outcome.)
  - **Note for Improvement**: The decision was suboptimal but understandable given the context. (Suggests coaching or training.)
  - **Note for Violation**: The decision was a clear violation of standards without justification. (This is where we assign accountability.)

  **Step 4: Handle Outcome Bias and Moral Luck**
  - **Outcome Redaction Test**: (For cases where the outcome was bad) Imagine the same decision with a neutral or good outcome. Would the note be the same? If not, the difference is due to outcome luck. We must not let the outcome influence the note. Therefore, we stick to the note as if the outcome were neutral.
  - **Near Misses and Latent Bugs**: Apply the same process. If a decision was made that could have caused an incident but didn't (near miss), it should get the same note as if it had caused an incident. Similarly, if a decision was risky but turned out well, it should not be rewarded if it was a violation or suboptimal.

  **Step 5: Assign Credit and Blame Symmetrically**
  - For positive outcomes: If the decision was a violation but turned out well, it should get a note for violation, not credit. Conversely, if a decision was reasonable and led to a good outcome, it's not necessarily heroic — it's just a reasonable decision.
  - **Heroism**: Only label someone a "hero" if they went above and beyond in a way that was reasonable and justifiable at the time (e.g., taking a calculated risk in an emergency with no better options). If they took an unreasonable risk that happened to pay off, they are not heroes.

  **Step 6: Account for Temperament and Personality**
  - We do not rate personality traits. We rate decisions and actions. If a pattern of behavior emerges (e.g., repeatedly violating procedures), then that pattern is what the note captures. A single incident should not be used to label someone as "cautious" or a "cowboy". However, if a decision reflects a pattern, we note the pattern (if established) and recommend behavioral change.

  **Step 7: Ownership and Responsibility**
  - For decisions made long ago: The note should go to the person who made the decision at the time, if they are still with the company and if the decision was within their control. If the decision was made by someone else and the current owner inherited the system, the note might focus on the current owner's failure to improve the system (if there was a reasonable expectation to do so) or on the original decision-maker if the flaw was latent and not reasonably discoverable.
  - Rule: Accountability follows the decision-maker at the time of the decision, unless the current owner had a duty to reassess and failed to do so.

  **Step 8: Values Call**
  - At this point, if there is a disagreement, it's likely a values call. Examples:
    - How strict are we about following procedures? (This is a company culture decision.)
    - What counts as a "reasonable" alternative? (This is a judgment by the EM/HR, but should be consistent with past decisions.)
    - Are we emphasizing deterrence? (If so, we might be stricter on violations, but we must be transparent that this is a policy choice, not about the individual's desert.)
  - Flag for HR/EM: "This step involves a policy/value judgment about what level of risk is acceptable."

  **Step 9: Write the Note**
  - The note should include:
    - The decision and context (from Step 1).
    - The assessment (from Step 2 and 3).
    - The rationale (why the decision was reasonable or not).
    - Any pattern of behavior (if relevant, from Step 6).
    - Explicitly state if the outcome was due to luck (e.g., "The decision was a violation of procedure; the fact that it did not cause an incident was due to chance.").

  **Step 10: Review for Consistency**
  - Compare with past notes for similar decisions. If inconsistent, revisit the assessment.

  ---

  **Run the Procedure on Example Cases**

  **Case 1: Two engineers make the same call, one causes an outage, one doesn't.**
  - Step 1: Both had the same information and context.
  - Step 2: The decision was reasonable (or not) for both. Let's assume it was reasonable.
  - Step 3: No accountability note needed for either.
  - Step 4: Outcome redaction test: Without knowing the outcome, both decisions are the same. So the note must be the same. The one with the bad outcome doesn't get a note.
  - Step 5: Symmetry: The one with the good outcome doesn't get credit either. It's just a reasonable decision.
  - Accountability Note: None for both.

  **Case 2: Skipped review, pushed on Friday, caused a six-hour outage vs. did the same and improved latency.**
  - Step 1: Both skipped review and pushed on Friday. Known at the time: This violates the deployment policy (standard procedure is no Friday deployments without review). The decision-maker knew (or should have known) this.
  - Step 2:
    - Reasonable belief? No, because policy is clear.
    - Alternatives: Wait until Monday, get review.
    - Deviation from standards: Yes, without justification (unless there was an emergency, but let's assume not).
    - Risk awareness: They should have been aware of the risk of deploying without review on a Friday.
  - Step 3: Note for violation in both cases.
  - Step 4: Outcome redaction test: Without the outcome, the decision is a violation in both cases. The note must be the same.
  - Step 5: The one who improved latency does not get credit. They get a note for violation. The note should say: "Violated deployment policy by pushing without review on a Friday. The outcome (whether good or bad) does not change the violation."
  - Accountability Note: Violation note for both.

  **Case 3: The cowboy engineer who takes risks and sometimes saves the day.**
  - We look at one incident: They pushed a hotfix without review during an incident and it worked.
  - Step 1: Context: Production was down, time pressure. Known: The hotfix might work, but it wasn't reviewed. Standard procedure: Even in incidents, we require a peer review unless it's an all-hands emergency.
  - Step 2:
    - Reasonable belief? In an emergency, skipping review might be justifiable if waiting would cause unacceptable damage. We need to define what counts as an emergency. If it was, then it might be reasonable. If not, then it's a violation.
    - Alternatives: Could they have gotten a quick review? If yes, then skipping was not justified.
    - Deviation: Yes, from standard procedure. Justification: Emergency.
    - Risk awareness: They were aware of the risk, but the situation might have warranted it.
  - Step 3: If the emergency justified it, then no note or a note for improvement (if the decision was borderline). If not, then violation.
  - Step 6: We don't label the person. We look at this decision. If they have a pattern of violating procedures in non-emergencies, then we note the pattern.
  - Step 8: Values call: What counts as an emergency? The board must decide. Let's assume the board decides that this was a true emergency and the decision was reasonable. Then no note. But if they do this repeatedly in non-emergencies, then we document the pattern.

  **Case that will cause pushback: The engineer who skipped review and improved latency.**
  - The procedure says they get a violation note, same as the one who caused an outage. The board might push back because "it worked" and they improved a metric. But the procedure is clear: the decision was a violation. We must not reward violations just because they turned out well.
  - We must be explicit: This is about maintaining standards, not punishing outcomes.

  **Weakest Step**: Step 4 (Outcome Redaction Test) is the hardest to implement because it requires imagination and discipline. We know the outcome, and it's hard to ignore. The two-note idea (one with, one without) might help but could be cumbersome. Alternatively, we could have a rule: if the outcome would change the note, then we disregard the outcome and use the note as if the outcome were neutral.

  **Where it will misfire**: 
  - If the company culture values results over process, HR and EMs might resist giving a violation note for a decision that had a positive outcome. 
  - Also, in borderline cases (e.g., what counts as an emergency), the values call might be inconsistent without clear guidelines.

  **Final Procedure Checklist for the Meeting**:
  1. Summarize incident and key decisions (5 min)
  2. Reconstruct decision context (10 min)
  3. Assess decision quality (15 min)
  4. Apply outcome redaction test (5 min)
  5. Determine accountability level (5 min)
  6. Check for patterns (if time) (5 min)
  7. Write note (10 min)
  8. Review consistency (5 min)

  Total: ~60 min
answer: |-
  Here's a concrete, step-by-step procedure for your accountability notes, designed to handle moral luck and your specific cases. It's structured as a checklist with clear exit points, uses plain language, and flags values-based decisions. The core principle: **Accountability attaches to the quality of the decision at the time, not the outcome.** Moral luck is mitigated by ignoring outcomes when assessing decisions.

  ---

  ### **Accountability Note Procedure**  
  *(Timebox: 45-50 min per incident. Participants: EM, HR rep, incident reviewer.)*  
  **Input:** Blameless postmortem (facts only). **Output:** Accountability note (or "no note").  

  #### **Step 1: Reconstruct the Decision Context**  
  *What did the person know and face? Ignore the outcome.*  
  - **Questions to answer:**  
    1. What information did the decision-maker have **at the time**? (List specific data, alerts, docs.)  
    2. What was their goal? (e.g., "fix latency," "deploy feature by deadline.")  
    3. What constraints were they under? (Time pressure, tooling limits, unclear docs?)  
    4. What standard process applies? (e.g., "Code review required before prod deploy.")  
  - **Sufficient answer:**  
    - Facts only (no "they should have known X").  
    - If info is missing (e.g., "docs were outdated"), note it—but don't fault the person.  
  - **Exit to values call:** If the standard process is unclear or disputed (e.g., "Is a Friday deploy ever OK?"), flag it for HR/EM policy debate. Stop here until resolved.  
  - *Why this step:* Separates what was knowable from hindsight.  

  #### **Step 2: Assess Decision Quality**  
  *Was the choice reasonable given Step 1?*  
  - **Questions to answer:**  
    1. Did they follow the standard process? (Yes/No/Partially)  
    2. If they deviated, was there a **good reason** based on their context? (e.g., "No review because P0 incident ongoing.")  
    3. Were there obvious alternatives a peer might have chosen? (e.g., "Roll back instead of hotfix.")  
    4. Did they consider risks? (e.g., "Knew deploy might fail but thought it was low risk.")  
  - **Sufficient answer:**  
    - "Reasonable" = A competent peer in their role might make the same call.  
    - Use "peer review" test: Would 3 engineers on your team say it was defensible?  
  - **Exit to no note:** If the answer to #2 is "yes" OR all answers are "reasonable."  
  - *Why this step:* Focuses on decision quality, not results. Handles "outcome bias" by design.  

  #### **Step 3: Apply Outcome Redaction Test**  
  *Your trick—modified for speed.*  
  - **Action:**  
    - Assign someone (not the decision-maker) to write **one sentence** describing the decision **without the outcome** (e.g., "Deployed without review on Friday").  
    - Compare it to the actual outcome (e.g., "caused outage" or "improved latency").  
  - **Rule:**  
    - If the accountability note would change based on the outcome (e.g., "violation" if outage vs. "hero" if latency improved), **ignore the outcome**. The note must match the outcome-blind sentence.  
  - **Sufficient answer:** "This decision is [description]. Outcome does not affect accountability."  
  - *Why this step:* Concretely isolates moral luck (outcome dependence). Self-deception risk is low if done as a quick sentence test.  

  #### **Step 4: Assign Accountability Level**  
  *Only if Step 2 didn't exit to "no note."*  
  - **Choices (pick one):**  
    - **Note: Process violation**  
      - When: They broke a clear rule without good reason (e.g., "Skipped review on Friday for non-urgent deploy").  
      - Note content: "Violated [rule]. Reason given [X] was insufficient per [standard]."  
    - **Note: Judgment error**  
      - When: They followed process but made a call most peers wouldn’t (e.g., "Chose hotfix when rollback was safer").  
      - Note content: "Decision was unreasonable given alternatives [Y, Z]."  
  - **Exit to no note:** If the violation/error was minor and isolated (e.g., "First offense in 2 years").  
  - *Why this step:* Handles symmetry—bad decisions get the same note regardless of outcome (e.g., Friday deploy without review → **violation** whether it caused an outage or improved latency).  

  #### **Step 5: Handle Credit and Temperament**  
  *Strip luck from praise/criticism.*  
  - **Rule for "heroes":**  
    - Only give credit if the action was **both** high-impact **and** reasonable per Step 2 (e.g., "Fixed outage with a peer-reviewed hotfix during incident").  
    - Unreasonable risks that worked → no credit (e.g., "Skipped review and got lucky" → **violation** note, not praise).  
  - **Rule for temperament:**  
    - Never note personality (e.g., "cowboy"). Only note **repeat behavior** (e.g., "3 violations of deploy policy in 6 months").  
    - If pattern exists, note: "Repeated [specific behavior] despite feedback."  
  - *Why this step:* Ensures symmetry (no reward for luck) and avoids rating innate traits.  

  #### **Step 6: Special Cases**  
  *Quick filters for your examples:*  
  - **Near misses/latent bugs:** Treat like actual incidents. If the decision was unreasonable per Step 2, assign note.  
  - **Owner vs. author:**  
    - Note the **person who last touched the system** if:  
      - They made an unreasonable change (e.g., "Added faulty config 3 weeks ago").  
    - Note the **original author** only if:  
      - The flaw was obvious at the time (e.g., "No error handling in 2020 when it was standard").  
    - Else: No note (e.g., "Flaw was subtle and tests didn't catch it").  

  #### **Step 7: Final Checks**  
  - **Consistency test:** Compare to past notes for similar decisions. If inconsistent, revisit Step 2.  
  - **Values call flag:** At any step, if you debate "how strict is our rule?" or "what’s reasonable?", pause and document: "This decision hinges on policy [X]. HR/EM must clarify."  
  - **Note content:** Max 2 sentences. Include:  
    - What was decided (without outcome).  
    - Why it was reasonable/unreasonable (per Step 2).  
    - Any pattern (per Step 5).  

  ---

  ### **Run the Procedure on Your Cases**  
  *Assumes standard process: "No Friday deploys without review."*  

  **Case 1: Two engineers make the same call—one bad outcome, one good.**  
  - Step 1: Both had same info (e.g., "Low-risk change, needed quick deploy").  
  - Step 2: Both skipped review. Reason? "Time pressure." Alternatives? "Wait for Monday." Peer test? "Most peers would wait." → **Unreasonable.**  
  - Step 3: Outcome redaction → "Deployed without review." Note same for both.  
  - Step 4: **Violation note** for both: "Deployed without review despite alternatives."  
  - *Board pushback:* "But one caused an outage!" → Reply: "Outcome doesn’t change that skipping review was unreasonable. Same decision = same note."  

  **Case 2: Skipped review on Friday—caused outage vs. improved latency.**  
  - Step 1: Same as above.  
  - Step 2: Unreasonable → **Violation note** for both.  
  - Step 5: Latency improver gets **no credit** (unreasonable risk). Note: "Violated deploy policy."  
  - *Symmetry achieved:* Both get identical notes.  

  **Case 3: Temperament—cowboy’s "heroic" hotfix.**  
  - Step 1: Context: "Prod down, no review, hotfix pushed."  
  - Step 2: Deviated from process? Yes. Good reason? "Emergency" → Debate if true (values call).  
    - *If true*: No note (reasonable given context).  
    - *If false*: **Violation note**.  
  - Step 5: If they’re a repeat offender, note: "Repeated violations of deploy policy."  
  - *No personality rating:* Focus on behavior pattern, not "cowboy."  

  ---

  ### **Weakest Step & Where It Will Misfire**  
  - **Weakest step: Step 2 (Assess Decision Quality).**  
    - Why: "Reasonable" is subjective. Peers may disagree on what's "obvious." Requires high trust and calibration.  
    - Mitigation: Use a "precedent database" of past decisions to keep ratings consistent.  

  - **Where it will misfire:**  
    - **HR/EM politics:** If leadership values outcomes over process (e.g., "But the latency hero saved money!"), the procedure will be overruled. This is a values conflict—not a flaw in the method.  
    - **Near misses:** Teams may resist assigning notes for "no harm" events. Requires discipline to treat them like incidents.  
    - **Speed:** Tough cases (e.g., ambiguous standards) may blow the timebox. Solution: Escalate quickly to values calls.  

  ### **Key Takeaways**  
  - **Moral luck is addressed by:** Ignoring outcomes (Step 3), rating decisions not results (Step 2), and enforcing symmetry (Step 4/5).  
  - **Desert vs. incentives:** The procedure assigns "desert" (what the person earned based on their choices). If you punish/praise for outcomes, you’re doing **incentives**—flag this explicitly.  
  - **Stick to the script:** If you follow the steps, moral luck cases resolve cleanly. Pushback usually means someone wants to reward/punish outcomes—call it out.  

  This fits in your 1-hour meeting: Steps 1-3 (20 min), Step 4-6 (20 min), Step 7 (5 min). Bring a template!
