  | **8** | Distrusted but useful | ❌ **Feedback (4)**: Price affects funding/success. **Usefulness**: Emerges from coordination, not measurement. | Yes |
  | **9** | Price improves, moral unease | ✅ **All conditions**: (1) Officer trades on private info, (2) Market infers truth from trade, (3) Future value validates, (4) No feedback. **Unease**: Moral (exploiting mechanical trader), not epistemic. | Yes |

  **Repairs applied**:
  - **Case 3 vs. 4 resolved**: Motivation (1) requires unique informational advantages (Case 4’s interpretations aren’t common knowledge; Case 3’s are contestable but not unique). Aggregation (2b) requires scale (Case 4’s crowd > Case 3’s duo).
  - **Case 2 excluded**: Non-informational trades fail Motivation (1).
  - **Case 6 explained**: Aggregation (2c) accounts for mechanism design.
  - **Case 9 unease**: Outside epistemic scope (moral hazard).

