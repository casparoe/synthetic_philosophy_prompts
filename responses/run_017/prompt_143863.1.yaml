    - **Very short-term markets**: Feedback (4) is harder to avoid (e.g., prices affecting sentiment), reducing trust.

  ---

  ### Final Principle
  **A price is a trustworthy measurement of an underlying quantity iff**:  
  1. **INFORMED MOTIVATION**: Trades are primarily driven by participants' non-common-knowledge information/interpretations.  
  2. **ROBUST AGGREGATION**: Diverse, independent inputs from a large pool, aggregated without suppressing signals.  
  3. **SETTLEMENT VALIDATION**: An objective, unambiguous outcome validates the price at a known time.  
  4. **NO FEEDBACK**: The price doesn't alter the underlying or motivations systematically.  

  **Why it works**:  
  - Resolves Case 3 vs. 4: Motivation (1) and Aggregation (2) exclude overconfident dyads but include diverse crowds.  
  - Explains Case 2’s non-epistemic role: Fails Motivation (1).  
  - Predicts new cases: Untrustworthy with small N, subjective settlement, or no information horizon.  

  This preserves your core while adding precision. If it feels right, it’s because your verdicts guided the repair. If not, we iterate.
