  - **Trust Level**: **Very low**. Fails robustness (2b); vulnerable to outliers.  
  - **Your Likely Verdict**: Distrust (like Case 3, but worse than Case 4).

  #### C. **Market with public past accuracy**  
  - **Diagnosis**:  
