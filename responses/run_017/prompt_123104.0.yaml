prompt: |-
  You are a professional philosopher who specialises in population ethics and consequentialism, and who is used to pressure-testing the stated positions of smart non-specialists. Please think carefully and work in two stages: begin by brainstorming freely about what each of my commitments actually commits me to and what the usual motivation for holding it is, then give me an audit in which the problems you find are ranked by severity rather than all listed as equally serious.

  I'm a journalist covering science and ideas; I write about effective altruism and long-term thinking, and before I publish a piece that leans on my own position I'd like to know whether that position hangs together. Roughly where I've landed:

  (1) Suffering is what matters, in the sense that preventing a given amount of severe suffering takes priority over producing a comparable amount of happiness elsewhere — a negative-leaning rather than a pure negative utilitarianism.
  (2) But I don't accept the procreation asymmetry. Bringing a happy life into existence does, I think, add moral value, and I've always found the asymmetry ad hoc.
  (3) The repugnant conclusion really is unacceptable to me: sheer numbers don't wash out quality, and a vast population of lives barely worth living is not better than a smaller flourishing one.
  (4) I think the long-termist headline argument is basically right: the expected number of future lives is astronomically large, so even a small reduction in extinction risk swamps ordinary global-health work.
  (5) I'm instinctively anti-fanatical — I don't want to trade a certain, moderate good for a tiny probability of an astronomical one, Pascal's-mugging style.
  (6) Methodologically I only want to back interventions for which there is decent evidence that they help rather than harm, which is why I mostly write up things like cash transfers and insecticide-treated bednets — while also believing, and having written, that most of the suffering in the world is suffered by wild animals, who are exactly where the evidence base is thinnest and the downstream effects hardest to model.

  Which pairs of these genuinely pull against each other, and which only look as though they do? For each real tension, say what would have to give and what giving it would cost me, and tell me which single revision would clean up the most. Please discriminate rather than flagging everything, don't assume I know where the trouble is, and skip the reading list and the citations — I want the argument, and I can't check references from where I'm writing.
