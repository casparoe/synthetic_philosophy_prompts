answer: |-
  Here is a sestina crafted for your assembly, designed to embody that invisible mechanism without naming it, using the recurring structure to mirror the trap itself. The six end-words are: **choose**, **owe**, **one**, **time**, **face**, **stop**.

  ---

  **The Turning**

  We look around for someone else to **choose**,
  The greedy hand, the liar we **owe**
  Nothing. Surely it’s that **one**
  Somewhere, scheming, wasting precious **time**?
  We long to put a name, a **face**,
  Upon the pressure, make it **stop**.

  But listen: no lone voice can **stop**
  This turning. Even if you **choose**
  To hold back, show a different **face**,
  You feel the weight of what you **owe**
  To self, to future, borrowed **time** –
  Your sacrifice? A drop. Just **one**.

  Consider homework: if just **one**
  Refused the AI, could it **stop**
  The tide? The rest reclaim their **time**
  While you, alone, still sweat and **choose**
  Old labor, falling further, **owe**
  More to deadlines, losing **face**.

  Or jobs: each firm must show strong **face**,
  Compete. If just this **one**
  Decided profits weren’t the **owe**
  Of all, stepped back to **stop**
  The rush, would rivals kindly **choose**
  To slow? They’d seize the market, **time**.

  The clock ticks on, devouring **time**.
  No villain grins behind its **face**.
  Each player, acting, seems to **choose**
  The safest path. Not one, not **one**
  Feels powerful enough to **stop**
  The motion. What, then, do we **owe?

  We **owe** no blame to phantom greed. The **time**
  Demands we see: no single **stop** exists. No **face** to **choose**.
  But **one** clear truth: we rise, or fall, as **one**.

  ---

  ### Explanation for Your Club

  1.  **The Six End-Words & Why:**
      *   **choose:** Starts as an active verb ("someone else to choose"), shifts to a pressured decision ("seems to choose"), becomes almost impossible ("no face to choose"), and finally implies collective agency ("we rise... as one").
      *   **owe:** Begins as debt/accusation ("the liar we owe"), shifts to obligation ("owe to self"), becomes a perceived duty ("profits weren't the owe"), and ends as collective responsibility ("We owe no blame").
      *   **one:** Starts singular ("that one"), becomes an individual ("if just one"), emphasizes isolation ("Not one, not one"), and transforms into unity ("we rise... as one").
      *   **time:** Begins as a resource ("precious time"), becomes a burden ("borrowed time"), shifts to relentless pressure ("devouring time"), and ends as the critical moment ("The time demands").
      *   **face:** Starts as a literal countenance ("put a name, a face"), shifts to presentation ("show strong face"), becomes the illusion of control ("behind its face"), and ends as an impossible target ("no face to choose").
      *   **stop:** Begins as a demand ("make it stop"), shifts to individual futility ("no lone voice can stop"), becomes an action ("stepped back to stop"), emphasizes powerlessness ("powerful enough to stop"), hints at a solution ("single stop exists"), and is the final, crucial word ("no single stop exists").

  2.  **The Turn (Stanza 6):**
      *   **Key Line:** "No villain grins behind its face."
      *   **Why:** This line explicitly shatters the search for blame from the first stanzas. It confirms there is no conscious actor, no deceiver, no "Moloch" figure pulling the strings. The mechanism ("its face") is revealed as impersonal and systemic. The preceding lines ("The clock ticks on... Each player... seems to choose") build the tension of the relentless process, and this line delivers the unnerving realization that no one is *choosing* the overall outcome we all dislike.

  This poem uses the sestina's mathematical inevitability to mirror the systemic trap. The words cycle back, changing meaning slightly each time, just as individuals cycle through their limited options within the larger pattern, unable to alter the outcome alone. The envoi rejects blame ("We owe no blame") and the search for a single controller ("no face to choose"), pointing instead to the necessity of simultaneous, collective action ("we rise, or fall, as one") as the only way to change the "time" we are in. The final line avoids a slogan by grounding the solution in a stark condition of unity, leaving the "how" open but the necessity clear. It should read aloud clearly within your timeframe. Good luck with the assembly!
