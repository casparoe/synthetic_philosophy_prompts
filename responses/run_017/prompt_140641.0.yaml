prompt: |-
  ok so I need to stop reading the Harsanyi aggregation literature at random and get a spec first. Here's the use case: I'm on a small team putting together a decision-support tool for a regional public-investment body — the kind of thing that has to rank flood defences vs vaccination campaigns vs subsidised housing, where the benefits are spread over a couple of million people and most of the action is in the uncertainty (flood probabilities, take-up rates, long-run effects nobody can measure well). Whatever rule for combining individual utilities into a social ranking we put in the code has to be defensible to people who will never read a paper.

  What I want from you is the desiderata, not a restatement of the theorem: what a rule for turning many individuals' cardinal utility functions — and maybe their beliefs — into one social ranking has to get right, the case or consideration behind each requirement, and your view on which are non-negotiable and which are just what one camp happens to like. Please don't just hand back the axioms of the aggregation theorem dressed up as a list.

  Things I already think are on the list, with the cases behind them — add your own, and tell me if any of mine are junk or duplicates:

  - Splitting invariance. Divide a state of the world into two states with identical utility consequences and probabilites summing to the original, and the social ranking shouldn't move. Is that a real requirement or just expected-utility independence smuggled in as a fairness constraint? It looks like it kills any rule that cares about who ends up badly off once the uncertainty resolves, which is most of what practitioners say they want.
  - No double counting. Real preferences have moral and other-regarding bits in them: everyone prefers the flood defence go to the poorer valley because they think that's fairer. Add those up and the fairness concern seems to get counted once per person, while a concern nobody else shares gets counted once. What should a rule do with preferences that are already partly social — launder them somehow, or take them as given?
  - Invariance to rescaling versus sensitivity to interpersonal comparisons. Each person's utility is only fixed up to positive affine transformation, so anything that turns on an arbitrary normalisation is out. But full invariance looks like it makes real comparability impossible and lands you near dictatorship or near social indifference. Which way does this cut, and is demanding a common unit of well-being a genuine requirement or a prejudice of the welfarist camp?
  - Disagreement about probabilities. Our experts and our citizens don't share a credence over flood risk. Whose probabilities does the rule use, or does it manage not to take a stand? Ive seen claims that respecting everyone's ex ante preferences here forces something pretty unwelcome — say what that is and whether it's avoidable or just a cost to be paid.
  - Graceful degradation on non-ideal inputs. What we actually get is not vNM-rational: people violate independence in Allais-ish ways, some are intransitive, future people and corporate actors don't have a well-defined utility function at all. A rule that only runs on clean inputs is useless to me, so I'd put robustness to messy and partial input on the list — unless you think that's asking for something no rule could deliver, in which case say so and tell me what the honest fallback is.
  - Variable population and near-duplicates. People barely affected by the decision, or two people with identical prospects and identical utility functions: does the rule average or total, and what does it say about adding lives that are barely worth living? How much weight does this requirement carry compared to the others, given the decisions we're actually making?
  - Stability over time. The body decides every year, and sometimes re-decides. If it aggregates and then updates versus updates and then aggregates, do we get reversed rankings or something money-pumpable? That's on my list only if it genuinely bites.
  - Estimability. Can it be run on quantities a public body could actually estimate in a few months, or does it need full interpersonal comparisons nobody can measure? I count implementability as a real desideratum — tell me if that's cheating, i.e. if it's a constraint on us rather than a requirement on the theory.

  Two more things, and they're the parts I most want. First: flag any pair of requirements that can't be jointly satisfied, and if the whole list turns out to be unsatisfiable as a package, tell me which requirement you'd drop first and what dropping it costs — that's a result, not a failure. Second: which single requirement does the most work in knocking out candidate rules? A short scorecard at the end for the main contenders (weighted or average utilitarian sums, ex-post prioritarian views, maximin, and the simulate-a-chooser-behind-a-veil-of-ignorance approach) is welcome, but keep it short — the list and the reasoning behind it are the deliverable.
reasoning: |-
  Okay, let me start by really digging into what this user needs. They're on a small team building a decision-support tool for public investments, like flood defenses or vaccination campaigns. The key here is that the tool has to rank projects affecting millions of people, with lots of uncertainties. The user wants desiderata for combining individual utilities into a social ranking, but they don't want a rehash of aggregation theorems. They’ve already listed some points, and I need to evaluate those and add more, focusing on what's defensible to non-experts.

  First, the user mentioned splitting invariance. They're questioning whether it's a real requirement or just expected-utility independence. I recall that Harsanyi’s theorem relies on this, but in practice, decision-makers care about ex-post fairness. If splitting invariance is enforced, rules that care about who ends up worse off are ruled out. That’s a conflict. The user’s team probably needs to decide if they prioritize ex-ante efficiency or ex-post fairness. Maybe they can relax this requirement if the latter is more important for public perception.

  Next, no double counting. They’re worried about moral preferences being counted multiple times. For example, if everyone values fairness towards a poorer valley, aggregating those preferences amplifies that concern. But is that legitimate? The user might be concerned about fairness being overemphasized compared to individual self-interest. Rules like utilitarianism would add it up, but prioritarianism might adjust weights. The team needs to decide if they want to launder preferences or accept them as is. This ties into whether they see the aggregation as a technical tool or a reflection of existing social values.

  Then there’s invariance to rescaling versus interpersonal comparisons. Utilities are affine transformations, but making interpersonal comparisons requires a common scale. The user is stuck between dictatorship or indifference. They need a practical solution, like a calibration method (e.g., using health or income metrics). Without it, the rule might not work. This is crucial because, without comparability, the whole ranking could be arbitrary. The team must find a defensible way to set scales, maybe through public consultation or expert panels.

  Disagreement about probabilities is another biggie. If experts and citizens have different credences, whose to use? Respecting all ex-ante preferences might lead to Pareto inefficiency. The user mentioned it forces unwelcome results—like the Pareto principle conflicting with respecting beliefs. The team might need to aggregate probabilities first or use a common expert model. But if they use citizens' beliefs, they risk inefficiency. The trade-off here is between respecting individual viewpoints and achieving coherent decisions.

  Graceful degradation is essential. Real-world data isn’t perfect; people have biases, intransitive preferences. The user needs robustness. If a rule requires vNM rationality, it’s useless. Maybe they can use heuristics or partial inputs, like ranges instead of point estimates. But if that’s not feasible, the fallback could be expert judgment or simpler methods. This is critical for implementability, so the rule must handle messiness without breaking.

  Variable population issues, like adding barely worthwhile lives, might be less relevant for regional decisions. But they need to consider affected versus unaffected groups. Averaging vs. totaling could change rankings. Since the projects are fixed-scope, maybe averaging is more practical. But if population varies, they need a consistent approach. The team should assess how often this comes up. If rare, they might sideline it, but it’s still a theoretical concern.

  Stability over time is about whether aggregation commutes with updating. If not, money-pumping could occur. For annual decisions, this could be a real problem. The team should test if their chosen rule avoids dynamic inconsistencies. Ex-post rules might handle this better. If the rule fails here, it could lead to reversals and loss of trust, so it’s a hidden priority.

  Estimability is practical. Can public bodies gather the needed data? If a rule requires precise interpersonal comparisons, it’s not feasible. The user must balance theoretical purity with what’s measurable. Maybe use proxy measures like income or health metrics. If they can’t estimate, fall back to Borda counts or deliberative methods. This is a make-or-break requirement; without it, the tool is academic.

  Now, conflicts: Splitting invariance vs. ex-post equality. You can’t have both. Also, respecting all beliefs vs. Pareto efficiency. And interpersonal comparability vs. utility invariance. The user has to choose. For their context, maybe drop splitting invariance to allow fairness concerns. Also, drop full belief respect for coherence. Use calibrated scales for comparability.

  The most binding constraints? Interpersonal comparability and graceful degradation. Without scales, no aggregation works. Without handling messy data, it’s impractical. Utilitarianism needs scales but is simple. Prioritarianism adds weights but is harder to estimate. Maximin ignores utilities beyond the worst-off. Veil of ignorance might be intuitive but requires homogenous beliefs.

  The user’s team needs defensibility. So rules that align with public intuition might be better, even if theoretically imperfect. Veil of ignorance could resonate, despite needing homogenous beliefs. They should prioritize estimability and robustness. Maybe start with average utilitarianism with calibrated scales, accepting some double counting. Document the trade-offs transparently for stakeholders. Dropping splitting invariance allows ex-post fairness, which practitioners want. Use expert probabilities to avoid belief aggregation issues. For messy inputs, define protocols to handle gaps.
answer: |-
  Here's a distilled set of desiderata for your public-investment ranking rule, grounded in real-world defensibility, conflicts flagged, and a pragmatic assessment of non-negotiables. Your existing points are incorporated, refined, and expanded.

  **Core Desiderata & Their Rationale**  
  *(Non-negotiables in bold)*  

  1.  **Meaningful Interpersonal Comparability (Non-negotiable):**  
      *   **Requirement:** The rule *must* make defensible interpersonal comparisons of well-being changes (gains/losses). Pure invariance to affine transformations is unacceptable.  
      *   **Case:** Without this, you get dictatorship, indifference, or arbitrary rankings ("Why did project A beat B? Because we normalized John's utility differently."). Public bodies *must* justify trade-offs ("This flood defense helps fewer people but they're much worse off").  
      *   **Cut:** Demand a *justifiable common scale* (e.g., "well-being units" anchored to observable outcomes like income/health thresholds, calibrated by experts/stakeholders). Reject rules demanding full invariance.

  2.  **Ex-Post Outcome Sensitivity (Conditionally Non-negotiable):**  
      *   **Requirement:** The ranking should care *who actually ends up badly off* after uncertainty resolves.  
      *   **Case:** Practitioners/public intuitively care about inequality, catastrophic losses, and fairness of outcomes ("Why prioritize the low-risk valley when the high-risk one got flooded and is poorer?"). Splitting invariance (your point #1) *prohibits* this.  
      *   **Conflict:** Directly clashes with *Splitting Invariance*. **Verdict: Drop Splitting Invariance.** It's EU theory smuggled in, not a core fairness requirement. Sacrificing it allows rules addressing inequality (prioritarianism, ex-post leximin). Cost: Loses "dynamic consistency" under fine-grained state splitting (rarely relevant in practice).

  3.  **Non-Amplification of Social Preferences (Your "No Double Counting" - Strong Preference):**  
      *   **Requirement:** The rule should not mechanically amplify concerns (e.g., fairness) already embedded in individual preferences.  
      *   **Case:** If all individuals value helping the poorer valley, adding these preferences counts the fairness concern N times. If the rule *also* explicitly prioritizes the worse-off, fairness is counted N+1 times. This distorts priorities and is hard to defend ("Why is fairness weighted twice?").  
      *   **Cut:** "Launder" inputs by focusing on *self-regarding welfare* (hard to elicit) **OR** use a rule *insensitive* to the *source* of preferences (e.g., utilitarianism) and accept the amplification as reflecting social consensus. Avoid layering on extra fairness *post-aggregation*.

  4.  **Consensus-Driven Probability Handling (Pragmatic Requirement):**  
      *   **Requirement:** Use a single, defensible probability model (e.g., expert consensus, weighted expert pool). Avoid rules requiring aggregation of *individual beliefs* with *individual utilities*.  
      *   **Case:** Respecting all ex-ante preferences under belief disagreement forces **Harsanyi's Aggregation**: `Social Welfare = Σ λ_i * EU_i`. The "unwelcome result": This *can* violate **Pareto Efficiency** if individuals share utilities but disagree on probabilities. Worse, it requires estimating `λ_i` weights (interpersonal comparisons of confidence/optimism?), which is indefensible.  
      *   **Conflict:** Clashes with *Respect All Ex-Ante Preferences*. **Verdict: Drop Strict Ex-Ante Pareto.** Use a common probability model. Cost: Overrules dissenting minority beliefs. Mitigation: Use robust/scenario-based probabilities.

  5.  **Robustness to Imperfect Inputs (Non-negotiable):**  
      *   **Requirement:** The rule must produce *usable* outputs with incomplete/noisy utility estimates, boundedly rational preferences, and proxy data.  
      *   **Case:** Real-world inputs are messy (e.g., future people, intransitive Borda scores from surveys, only monetary valuations). A rule requiring perfect vNM utilities fails at launch.  
      *   **Cut:** **Demand graceful degradation.** Rules should accept ranges, confidence scores, multiple methods (e.g., direct rating + choice experiments), and provide sensitivity analysis. **Honest Fallback:** Multi-criteria decision analysis (MCDA) with explicit weights if utility aggregation proves too fragile.

  6.  **Population Invariance for Fixed Scope (Your Point #6 - Contextual):**  
      *   **Requirement:** The ranking of projects *within a fixed, defined population* shouldn't change if unaffected people or perfect clones are added.  
      *   **Case:** Adding unaffected citizens shouldn't dilute the weight given to flood victims. Clones raise philosophical issues but are irrelevant practically.  
      *   **Cut:** **Average Utilitarianism** handles unaffected populations naturally. Clones are a non-issue for fixed-scope decisions. Weight: Low priority for your use case (vs. theoretical repugnance issues).

  7.  **Dynamic Consistency (Your Point #7 - Hidden Priority):**  
      *   **Requirement:** `Aggregate then Update` ≈ `Update then Aggregate`.  
      *   **Case:** Prevents money-pumps and reversals justifying re-litigation ("Last year you ranked A over B, now with new flood data you rank B over A?").  
      *   **Cut:** **Ex-Post Aggregation Rules** (evaluate social welfare *after* uncertainty resolves) naturally satisfy this. **Ex-Ante Rules** (like Harsanyi) require common beliefs. **Verdict:** Strongly prefer ex-post rules or rules with common probabilities.

  8.  **Practical Estimability (Non-negotiable):**  
      *   **Requirement:** Inputs must be feasibly estimated by a public body within constraints (time, budget, data availability).  
      *   **Case:** Needing precise interpersonal comparison ratios (`k` times worse off) or heterogeneous belief elicitation is a showstopper.  
      *   **Cut:** **Not cheating.** It's a core constraint. Favor rules needing only: a) Ordinal comparisons of welfare *levels* ("Is group X worse off than group Y in this state?"), b) Cardinal *differences* within individuals, c) A common probability model. Reject rules needing ratio-scale comparable utilities or `λ_i` weights.

  **Key Conflicts & Trade-offs**  

  1.  **The Big One: Comparability vs. "Fairness" vs. Implementability:**  
      *   Achieving *Meaningful Comparability* requires anchoring utilities to observable metrics (e.g., QALYs, income equivalents). This clashes with:  
          *   *Ex-Post Sensitivity:* Anchoring often simplifies utility, making it harder to capture complex disadvantage.  
          *   *Robustness/Estimability:* Precise anchoring is hard. Trade-off: Simpler anchors (e.g., income) aid estimability but may miss nuances. Complex anchors are less robust.
      *   **Resolution:** Invest heavily in designing a *defensible, practical common scale* (e.g., expert-stakeholder calibrated "well-being points"). This underpins everything.

  2.  **Ex-Post Fairness vs. Dynamic Consistency/Simplicity:**  
      *   Prioritizing the worst-off *ex-post* (e.g., prioritarianism) satisfies public intuition but requires evaluating all possible outcome states. Ex-ante rules (utilitarianism) are computationally simpler and dynamically consistent with common probabilities.
      *   **Resolution:** Given public need for outcome fairness and the tractability of modern computing, **accept the computational cost of ex-post rules**. Use scenario reduction if needed.

  **Scorecard of Contenders (vs. Key Desiderata)**  

  | Rule                | Comparability | Ex-Post Sens. | Non-Amplify | Prob. Handling | Robustness | Dyn. Consist. (w/ common prob.) | Estimability          |
  | :------------------ | :------------ | :------------ | :---------- | :------------- | :--------- | :------------------------------ | :-------------------- |
  | **Avg. Utilitarian**| Needs Scale   | ✘             | Neutral     | Needs Model    | Moderate   | ✔ (Ex-Ante)                     | **Good** (Needs scale)|
  | **Total Util.**     | Needs Scale   | ✘             | Neutral     | Needs Model    | Moderate   | ✔ (Ex-Ante)                     | Poor (Pop. variant)   |
  | **Ex-Post Prior.**  | Needs Scale   | **✔**         | Neutral     | Needs Model    | Moderate   | **✔**                           | Moderate (Needs scale & weights) |
  | **Ex-Post Maximin** | **Minimal**   | **✔**         | **✔**       | Needs Model    | **Good**   | **✔**                           | **Good** (Only ordinal comp. needed) |
  | **Harsanyi Agg.**   | Needs λ_i     | ✘             | Neutral     | **Handles Disag.** | Poor       | ✘ (Belief disag.)               | **Very Poor** (λ_i, beliefs) |
  | **Veil of Ignor.**  | Needs Scale   | Depends       | Depends     | Needs Model    | Moderate   | ✔ (Ex-Ante)                     | Moderate (Needs scale)|

  **Recommendation & Which Requirement to Drop First**  

  1.  **Drop Splitting Invariance:** As argued, it's an EU axiom, not a core fairness need. Cost is minor theoretical inconsistency irrelevant to practitioners. **Gains** essential *Ex-Post Sensitivity*.
  2.  **Drop Strict Ex-Ante Pareto/Respect All Beliefs:** Use a **common expert/stakeholder probability model**. Cost is overriding minority beliefs. **Gains** *Dynamic Consistency*, *Pareto Efficiency*, and massive *Estimability*.
  3.  **Demote "No Double Counting":** Accept that aggregated preferences include social values. Focus on using *self-regarding welfare* where possible, but don't add *extra* fairness layers unless explicitly justified. **Gains** simplicity and avoids futile laundering.

  **Strongest Candidate for Your Context:** **Ex-Post Prioritarianism** (e.g., sum of transformed individual utilities: `Σ f(U_i)` where `f` is concave).  

  *   **Why:**  
      *   Satisfies *Ex-Post Sensitivity* (cares who ends up badly off).  
      *   Achieves *Dynamic Consistency* with common probabilities.  
      *   *Meaningful Comparability* is hard but required anyway; design a practical scale.  
      *   *Robustness* can be managed through input ranges/sensitivity analysis.  
      *   *Estimability* is challenging but feasible with a well-defined scale and explicit priority weights (e.g., "how much more weight do we give to the worst-off?" - a public choice).  
      *   Easier to defend ("We prioritize projects that benefit the worse-off, especially when they gain a lot") than pure utilitarianism or abstract Harsanyi.  
  *   **Critical Implementation Focus:** Invest heavily in designing the **common well-being scale** and the **concavity parameter (priority weight)** through expert/stakeholder deliberation. Document the trade-offs transparently. Use robust scenario-based probabilities.  

  **Fallback if Estimability Fails:** **Ex-Post Maximin (or Leximin)**. It needs only ordinal interpersonal comparisons ("Is group X worse off than Y?") and is highly robust/defensible ("We prioritize avoiding the very worst outcomes for the most vulnerable"). Less efficient, but avoids the hardest measurement problems.  

  This prioritizes defensibility to non-experts and handles the core conflicts inherent in public investment under uncertainty. Good luck!
