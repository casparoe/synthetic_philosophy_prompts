  I consider structuring the prep sheet with a core thesis summary, then objections in expected order. For each objection, capture the speaker's voice, craft a tight reply with concession, flag soft spots. Identify key battlegrounds: metaphysician's grounding objection is existential for the chapter. Physicist's bandwidth point can be waved off as irrelevant to the conceptual claim. Mathematician's bivalence charge needs careful handling to avoid conflating underdetermination with contradiction.

