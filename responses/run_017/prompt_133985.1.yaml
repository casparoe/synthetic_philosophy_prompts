  ### Foundation Funding Philosophy Quiz  
  **Instructions:** For each scenario, choose the response (A, B, or C) that best reflects how you’d vote on the grant application. Answer based on your instinct, not theory.  

  1. **County Historical Society** (majority culture group) applies for funds to archive local history. They argue their work is as valuable as minority groups’.  
     - **A)** Fund: Neutrality requires equal treatment for all.  
     - **B)** Reject: Prioritize marginalized groups; majority already has resources.  
     - **C)** Fund conditionally: Only if they collaborate with minority historians.  

  2. **Endangered Language Group** (800 speakers, all fluent in majority language) seeks funds to teach children the language.  
     - **A)** Fund: Cultural preservation matters intrinsically.  
     - **B)** Reject: Resources should serve practical needs, not "dying" traditions.  
     - **C)** Fund conditionally: Only if tied to outcomes (e.g., school attendance).  

  3. **Religious Food Bank** requires volunteers to attend a service. They feed anyone in need.  
     - **A)** Fund: The service is open to all; internal rules are their autonomy.  
     - **B)** Reject: Coercive; violates neutrality by linking aid to doctrine.  
     - **C)** Fund conditionally: Remove the service requirement.  

  4. **Meaning-Making Group** requests funds for rituals members call "the point of life," with no measurable outcomes.  
     - **A)** Fund: If it gives life purpose, that’s enough.  
     - **B)** Reject: Public funds require measurable impact.  
     - **C)** Fund conditionally: Develop well-being metrics.  

  5. **Cross-Border Community** (rich half in our country, poor half abroad) seeks funds for a shared community center.  
     - **A)** Fund: Honor their self-definition as one people.  
     - **B)** Reject: Our mandate is local; we can’t fund abroad.  
     - **C)** Fund partially: Only for the poor half, with rich co-funding.  

  6. **Strict Workers’ Co-op** expels members by majority vote. Former members call it unfair.  
     - **A)** Fund: Voluntary associations set their own rules.  
     - **B)** Reject: Exclusionary practices harm dignity.  
     - **C)** Fund conditionally: Add an appeals process.  

  7. **Self-Contained Religious School** teaches only its doctrine, no mainstream curriculum.  
     - **A)** Fund: Parents’ right to transmit their way of life.  
     - **B)** Reject: Children need exposure to society’s knowledge.  
     - **C)** Fund conditionally: Teach core secular subjects.  

  8. **Unexplainable Practice Group** says only insiders understand their project’s purpose.  
     - **A)** Fund: They know their needs best.  
     - **B)** Reject: We must evaluate use of public funds.  
     - **C)** Fund conditionally: Provide a confidential explanation.  

  9. **Ethnic Community Center** in a diverse neighborhood primarily serves one group due to location/culture.  
     - **A)** Fund: Serving a community’s needs is valid.  
     - **B)** Reject: Public funds must avoid de facto exclusion.  
     - **C)** Fund conditionally: Commit to inclusive outreach.  

  10. **Controversial Monument Group** seeks funds for a war memorial some call oppressive.  
      - **A)** Fund: Communities should confront hard histories.  
      - **B)** Reject: Monuments must unify, not divide.  
      - **C)** Fund conditionally: Add a counter-monument.  

