  **Foundation Funding Philosophy Quiz**

  Instructions: For each of the following grant applications, choose the response (A, B, or C) that best reflects what you think the foundation should do.

  **Question 1: County Historical Society**
  The County Historical Society, which preserves and promotes the history of the majority culture in the region, applies for funding for a new exhibit. They note that they are the dominant culture and have more resources than many minority groups, but argue that their work is equally valuable to the community.
     - A) Fund them, because they meet the same criteria as any other group and we should be neutral.
     - B) Do not fund them, because they already have enough resources and our priority should be to support marginalized groups.
     - C) Fund them, but only if they collaborate with minority history groups to ensure a more inclusive narrative.

  **Question 2: Endangered Language Preservation**
  A group dedicated to preserving a local indigenous language with only 800 speakers applies for funding. All speakers are fluent in the majority language. The group wants to create educational materials to teach the language to children and record elder speakers.
     - A) Fund them, because every language is a unique repository of culture and human knowledge, and we have a duty to preserve it.
     - B) Do not fund them, because the language is not practical for daily life and the resources could be better used for more pressing community needs.
     - C) Fund them, but only if they can demonstrate a plan for how this will lead to measurable outcomes like improved educational attainment or health in the community.

  **Question 3: Religious Food Bank**
  A religious organization runs a food bank that serves anyone in need. However, they require all volunteers to attend a religious service before each shift. They are applying for funds to expand the food bank.
     - A) Fund them, because the food bank serves a critical need and the requirement for volunteers is an internal matter of the group.
     - B) Do not fund them, because the requirement for volunteers to attend a service is coercive and violates principles of neutrality.
     - C) Fund them, but only if they remove the requirement for volunteers to attend the service.

  **Question 4: Meaningful Gathering with No Measurable Outcome**
  A community group applies for funding for a weekly gathering that involves storytelling, music, and shared meals. They state that this gathering has no measurable outcomes but is central to their identity and sense of meaning. They cannot provide data on participation or impact beyond personal testimonials.
     - A) Fund them, because the state should not impose metrics on what gives life meaning; if it's important to them, that's enough.
     - B) Do not fund them, because without measurable outcomes, we cannot ensure that public money is being used effectively.
     - C) Fund them, but require them to develop a plan to measure participation and well-being indicators.

  **Question 5: Cross-Border Community Project**
  An ethnic group is split by an international border. The half in a wealthy country is well-off, while the half in a poorer country struggles. The poor half applies for funding for a community center, arguing that the entire ethnic group is one community and the wealthy half will also contribute.
     - A) Fund them, because communities should be defined by the group itself, not by borders, and we should support the whole community.
     - B) Do not fund them, because our foundation's mandate is local (only within our country) and we cannot fund projects in another country.
     - C) Fund them, but only for the part of the project that directly benefits the poor half in our country, and require that the wealthy half contributes a significant share.

  **Question 6: Workers' Cooperative with Strict Expulsion Rules**
  A workers' cooperative applies for funding to start a new business. They have a strict internal code of conduct and expel members by majority vote for violations. Some former members claim the process is unfair and exclusionary.
     - A) Fund them, because the internal rules are a matter of their self-governance and we should respect the autonomy of voluntary associations.
     - B) Do not fund them, because the expulsion process may be unfair and we should not support groups that are exclusionary.
     - C) Fund them, but only if they adopt a fairer process for expulsion, such as an independent appeals panel.

  **Question 7: Community School with Comprehensive Doctrine**
  A religious community wants to establish a school that educates children entirely within their own comprehensive doctrine, without teaching mainstream science or history. They apply for funding for the school.
     - A) Fund them, because parents have the right to educate their children in accordance with their beliefs.
     - B) Do not fund them, because education must provide children with the knowledge and skills to participate in broader society and to make informed choices about their lives.
     - C) Fund them, but only if they agree to teach a core curriculum that meets state educational standards.

  **Question 8: Group with Unexplainable Project**
  A close-knit community group applies for funding for a project that they say is central to their identity. They state that they cannot explain the purpose to outsiders because it is deeply tied to their internal practices and would require being a member to understand.
     - A) Fund them, because they are the best judges of what is important to them, and we should respect their self-knowledge.
     - B) Do not fund them, because we have a duty to ensure that public funds are used for purposes we can evaluate and understand.
     - C) Fund them, but require that they provide a detailed explanation of the project's purpose and how the funds will be used, even if it's only for internal review.

  **Question 9: Community Center with De Facto Exclusion**
  A community center in a neighborhood with a specific ethnic majority applies for funding to expand their after-school program. They state that they primarily serve children from that ethnic group and do not actively exclude others, but their location and cultural focus mean that very few from other groups attend.
     - A) Fund them, because they are providing a valuable service and it's natural that a group in a particular area would serve that area's dominant culture.
     - B) Do not fund them, because public funds should not support groups that are de facto exclusionary and do not serve the entire community.
     - C) Fund them, but only if they commit to outreach and inclusion of other groups in the neighborhood.

  **Question 10: Controversial Monument**
  A group of veterans wants to erect a monument in a public park to commemorate a war that is controversial in the community, with some seeing it as a symbol of oppression and others as a symbol of valor. They apply for funding for the monument.
     - A) Fund them, because it is important to honor the sacrifices of veterans and we should not shy away from difficult history.
     - B) Do not fund them, because public monuments should be unifying, and this one is divisive and may cause harm to some community members.
     - C) Fund them, but only if they also fund a separate monument that represents the opposing perspective, to balance the narrative.

