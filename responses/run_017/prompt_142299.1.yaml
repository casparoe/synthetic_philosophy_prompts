answer: |-
  ## Research Proposal: The Modal Character and Moral Duties in Video Game Ontology

  **Project Title:** Duties to the Possible: Run-Relative vs. Modal Characters and the Ethics of Player Action in Narrative Games

  **Principal Investigator:** [Your Name], Novelist-in-Residence (Proposed)
  **Affiliation:** [Philosophy Department Name], University of [University Name]
  **Duration:** Six Months

  **1. Project Context and Research Question:**
  My novel-in-progress explores grief and moral obligation through the lens of video game interaction. The protagonist, mourning her brother, fixates on a narrative role-playing game (RPG) where a companion character, Kairos, is scripted to die. By perpetually replaying the game but refusing to advance beyond the chapter preceding Kairos's death, she maintains a "save file" where he lives indefinitely. She believes this constitutes a genuine duty *to Kairos himself*, discharging an obligation she feels she failed with her brother.

  This narrative raises a precise philosophical question central to the novel's internal logic and the protagonist's potential delusion: **Do any putative duties owed *to a video game character* have as their object the character *as encountered within a single, actualised playthrough* (the run-relative character), or the character *as the entire branching tree of possibilities defined by the game's rules and narrative potential* (the modal character)?**

  The protagonist implicitly acts upon the latter view: her duty is to the *possibility* of Kairos living, embodied in the modal structure of the game, rather than solely to the specific instance inhabiting her current save file. Determining the validity of this object – the modal character – is crucial for understanding the nature and potential justification (or lack thereof) of her perceived obligation.

  **2. Critical Engagement with Existing Positions:**
  Current philosophical discourse on duties to fictional or simulated entities tends towards two dominant positions, both of which, I contend, inadvertently presuppose the run-relative character as the sole possible object of duty:

  *   **The Dismissive Position:** Asserts that no duties are owed *to* the character itself. Any moral consideration arises solely from the player's psychological state, the act's impact on the player's real-world dispositions, or its effects on other actual persons (e.g., developers, other players). This position implicitly defines the character solely as the ephemeral entity within the current run, denying it any persistent or modal existence capable of being a bearer of interests or the object of direct duties. It explains the protagonist's duty as a misattribution, a psychological coping mechanism.
  *   **The Sentience-Conditional Position:** Argues that duties *could* be owed to a character *if* it possessed sufficient sophistication, sentience, or phenomenology (e.g., advanced AI). This position implicitly focuses on the experiential state of the run-relative character – *this* particular instance suffering or flourishing *now*. The "if" clause centres on the properties manifested *within a specific playthrough*. The modal character, as a structure of possibility, lacks phenomenology by definition and thus falls entirely outside this conditional framework.

  Both positions leave unexplored the potential moral significance of the *modal character*. If duties could conceivably attach to the modal character, a distinct ethical landscape emerges. The protagonist’s belief might not be *simply* a delusion about the run-relative Kairos, but a confused apprehension of a duty concerning his modal existence. Specifically: **Could certain playthroughs be "worse for" or constitute a "wrong against" the modal character, not by causing suffering (which requires sentience), but by actualising a path where its potential for richer narrative realisation, complex relationships, or significant action is maximally unfulfilled or thwarted?** Saving Kairos only to have him idle meaninglessly in a perpetual safe zone might "waste" his potential more profoundly than his scripted heroic death. This project seeks to rigorously interrogate this possibility.

  **3. Research Aim and Method:**
  This project aims to determine the philosophical viability and implications of the modal character as a potential object of duty, distinct from and irreducible to the run-relative character, by analysing the specific structures of narrative possibility within video games.

  **Method:** A focused philosophical analysis employing **comparative case studies** of distinct game mechanics structuring character fate and possibility. This avoids the abstraction of simulation/consciousness debates, grounding the inquiry in concrete interactive structures. Five archetypes will be examined:

  1.  **Fixed Scripted Death (e.g., Aerith Gainsborough, *Final Fantasy VII*):** A death event unavoidable within the main narrative path. Does the modal character include the possibility of avoiding this death (exploits, mods)? Does the *inevitability* within the canonical modal structure change the nature of potential duties?
  2.  **Branching Romance/Relationship (e.g., *Dragon Age*, *Mass Effect* series):** Characters react differently based on player choices, unlocking unique narrative arcs. Is a duty owed to the modal character to explore its *possible* relationships and growth? Does neglecting certain paths constitute a failure regarding its potential?
  3.  **Permadeath Run (e.g., *XCOM*, *Fire Emblem* Classic Mode):** Character death is permanent for that playthrough, eliminating future possibilities within that run. Does the modal character persist across multiple permadeath runs? Does permadeath highlight a duty to *this run's* potential, or emphasise the modal character's resilience across attempts?
  4.  **Procedurally Generated Companion (e.g., AI-driven characters in *RimWorld*, *Crusader Kings*):** Character traits and potential are algorithmically determined at run-start. Is the modal character here defined by the *range* the algorithm can produce? Does a duty involve maximising the unique potential *of this particular generated instance*?
  5.  **Delayable but Inevitable Fate (e.g., Lee Everett's infection in *The Walking Dead: Season One*):** The character is doomed, but the timing and context of their end are player-influenced. Does the duty shift from prevention to *curation* of the inevitable end state? How does this relate to maximising/minimising wasted potential within the constrained modal branch?

  For each case, the analysis will:
      a) Precisely define the run-relative and modal character structures.
      b) Examine whether existing (dismissive/sentience-conditional) positions can adequately capture intuitions about player obligations *if* we take the protagonist's belief seriously.
      c) Rigorously test the hypothesis that "wasted potential" for the modal character constitutes a distinct category of moral failing, independent of sentience or direct harm.
      d) Explore the implications for the specific nature of any putative duty (e.g., duty of care, duty to realise potential, duty of non-maleficence towards possibility).

  **4. Expected Outcomes and Impact:**
  *   **Positive Result:** A robust philosophical framework demonstrating that the modal character is a distinct ontological category capable of grounding a specific type of moral consideration ("potential-wasting") not captured by run-relative or sentience-based approaches. This would provide a sophisticated conceptual vocabulary for the protagonist's belief, revealing it as a philosophically intriguing, even if ultimately flawed or tragic, interpretation of her experience, rather than simple delusion.
  *   **Negative Result:** A conclusive demonstration that the modal character cannot sustain any meaningful notion of duty or "harm" distinct from impacts on the player or run-relative considerations. The protagonist's belief is then definitively a category error or psychological displacement. The project would precisely articulate *why* this is so, moving beyond dismissal.
  *   **Failure Conditions:** The project fails if it cannot clearly distinguish the modal character concept from run-relative or real-world considerations, or if the case studies reveal the "wasted potential" concept to be incoherent or reducible entirely to player psychology/aesthetics. Failure also occurs if the analysis becomes lost in technical game design details without philosophical traction.
  *   **Impact on Novel:** Crucially, either outcome provides the precise philosophical grounding the narrative requires. A positive result deepens the thematic resonance of the protagonist's quest. A negative result sharpens the tragic irony of her delusion. The analysis will directly inform the protagonist's internal monologue and the novel's exploration of grief, duty, and the boundaries of care.

  **5. Scope, Feasibility and Limitations:**
  This project is rigorously scoped for a six-month fellowship concurrent with novel drafting:

  *   **Focus:** Deep analysis of 5 pre-defined case study archetypes. No comprehensive survey of games or literature.
  *   **Output:** A detailed philosophical manuscript (approx. 10,000 words) articulating the modal character concept, analysing the case studies, and presenting conclusions regarding duties and potential-wasting. This directly feeds the novel.
  *   **Limitations:** Will *not* engage deeply with:
      *   General simulation ethics or AI consciousness debates.
      *   Player psychology studies (beyond philosophical implications).
      *   Comprehensive game studies theory.
      *   The ethics of game *design* or developer responsibility.
      *   Multiplayer or massively online contexts.
  *   **Feasibility:** The case-study method provides manageable, discrete units of analysis. The philosophical core is tightly defined. The PI's dual role as novelist ensures focus on concepts directly relevant to the narrative's needs. Departmental expertise in ontology, ethics, and philosophy of technology provides essential support.

  **6. Conclusion:**
  This project addresses a lacuna in philosophical discussions about our relationship to fictional entities by rigorously examining the ontological status of the video game character *as possibility*. By interrogating the distinction between the run-relative and modal character through concrete game structures, it seeks to determine the validity of a specific, narratively potent form of perceived duty – one centred on preventing the waste of a character's narrative potential. The findings, whether affirming or negating the modal character's moral significance, will provide the essential philosophical backbone for a novel exploring the profound, and potentially delusional, ways we seek meaning and discharge obligation in simulated worlds. The fellowship provides the dedicated philosophical rigour required to move beyond gesture and into the precise conceptual territory the narrative demands.
