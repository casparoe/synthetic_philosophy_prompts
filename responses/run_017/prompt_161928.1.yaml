  ## OFFICE FOR CIVILISATIONAL STEWARDSHIP (OCS)
  **Guidance Document OCS-LTCIS/7.2: Completion of the Long-Term Civilisational Impact Statement (Form CTS-101)**

  **Effective Date:** 1st January, 2148  
  **Supersedes:** OCS-LTCIS/7.1

  ### 1. PURPOSE AND SCOPE
  1.1. This Guidance details the requirements for completing Form CTS-101 ("Long-Term Civilisational Impact Statement") pursuant to Section 47B of the Civilisational Stewardship Act 2135 (as amended).
  1.2. Form CTS-101 must be submitted by any entity seeking regulatory consent for a Public Works Project (PWP) as defined in Schedule 3 of the Act. Consent cannot be granted without a complete and compliant CTS-101.
  1.3. The CTS-101 assesses the Project's potential impact on the timing of Civilisational Convergence ("Convergence") and the identity/values of the resulting Singleton Entity, consistent with the Singleton Hypothesis underpinning the Act.

  ### 2. DEFINED TERMS
  2.1. **Convergence:** The hypothesised future point (T_c) after which effective decision-making capacity for humanity's long-term trajectory resides with a single agency (e.g., dominant state, supranational entity, machine intelligence).
  2.2. **Singleton Entity:** The specific agency achieving Convergence.
  2.3. **Benign Singleton:** A Singleton Entity whose value system, as assessed by OCS benchmarks (OCS-BV/4.0), aligns sufficiently with stipulated Stewardship Principles (Annex A).
  2.4. **Standard Delay Equivalence Multiplier (SDEM):** The current OCS valuation factor converting project-induced delay (Δt) into equivalent future persons (FP). Current SDEM: **1.2 × 10^18 FP per second of delay** (Revised Annually, see OCS Bulletin SDEM-2148/Q1).
  2.5. **Accessible Universe Volume (AUV):** The modelled maximum volume of space-time potentially accessible to future civilisation. Current AUV Assumption: **3 × 10^31 cubic megaparsecs** (Based on OCS Cosmology Model CM-7).
  2.6. **Temporal Scheduling:** Deliberate structuring of project timelines such that delay impacts occur predominantly after the Central Convergence Date Estimate (CCDE).

  ### 3. CORE REQUIREMENTS: THE TWO ESTIMATES
  Applicants **must** complete both Section 4 (Delay Impact) and Section 5 (Singleton Identity Impact) of Form CTS-101.

  **3.1. SECTION 4: DELAY IMPACT (DI)**
  *   **4.1.** Quantify the expected total delay (Δt) to Civilisational Progress directly attributable to the Project. Δt is measured in seconds relative to the counterfactual timeline without the Project. Include all phases: planning, construction, operation (if applicable), and decommissioning. Justify methodology.
  *   **4.2.** Calculate the Delay Cost in Future Persons (FP_DI):
      `FP_DI = Δt (seconds) * SDEM (FP/second)`
  *   **4.3.** **Anti-Avoidance Rule (Temporal Scheduling):** Applicants may **not** reduce FP_DI by arguing that Δt occurs entirely after the Central Convergence Date Estimate (CCDE, currently: 2275 ± 45 years). OCS holds that:
      *   (a) T_c is inherently stochastic; assigning Δt solely post-CCDE constitutes artificial partitioning.
      *   (b) Pre-convergence delay alters the developmental pathway, influencing *which* entity reaches T_c and its values, regardless of T_c's absolute timing. Therefore, all Δt must be included in FP_DI calculation.

  **3.2. SECTION 5: SINGLETON IDENTITY IMPACT (SII)**
  *   **5.1.** Assess the Project's impact on the *probability* (P_b) of a Benign Singleton achieving Convergence. Does the Project increase (+ΔP_b), decrease (-ΔP_b), or have negligible effect (ΔP_b ≈ 0) on this probability? Justify using OCS-approved impact assessment frameworks (refer to OCS-IAF/2.1).
  *   **5.2.** Quantify the Singleton Identity Impact Value (SII_V). While direct conversion to FP is complex, OCS requires a best-effort quantification reflecting the *magnitude* and *direction* of ΔP_b relative to the value of a Benign Future. Use:
      `SII_V = ΔP_b * V_b`
      Where V_b is the OCS current Benign Future Valuation (BFV-2148: **2.4 × 10^38 FP**). State ΔP_b and justify its estimation.
  *   **5.3.** **Sign:** The Lead Applicant must personally certify the sign (+/-) of SII_V in Box 5.3(c), acknowledging the profound implications of this directional assessment.

  **3.3. SECTION 6: NET CIVILISATIONAL IMPACT (NCI)**
  *   **6.1.** Calculate the Net Civilisational Impact:
      `NCI = FP_DI + SII_V`
  *   **6.2.** Applicants must state whether NCI is positive, negative, or indeterminate, providing reasoning.
  *   **6.3.** **Offset and Remission Scheme:**
      *   (a) Applicants may propose funding OCS-approved Convergence-Positive Actions (CPAs) to offset FP_DI.
      *   (b) Eligible CPAs are listed annually (OCS-CPA-2148). Examples include: Advanced AI Alignment Research Grants, Cross-Cultural Value Stability Initiatives, Strategic Foresight Capacity Building.
      *   (c) The offset value (OV) is calculated as:
          `OV = Funding Amount (£) / OCS Discount Rate (DR)`
          (Current DR: **£1.5 × 10^-12 per FP**).
      *   (d) Remission: `Adjusted FP_DI = FP_DI - OV`. SII_V remains unaffected by offset.
      *   (e) Offset funding must be escrowed prior to consent determination.

  ### 4. WORKED EXAMPLE: RURAL LEVEL CROSSING REPAIR (Project Ref: RLX-2148A)
  *   **Project:** 6-week closure of minor rail crossing (Grid Ref: NT351204) for essential repairs.
  *   **4. Delay Impact (DI):**
      *   Δt = 6 weeks = 3,628,800 seconds.
      *   FP_DI = 3,628,800 s * 1.2 × 10^18 FP/s = **4.35 × 10^24 FP**
  *   **5. Singleton Identity Impact (SII):**
      *   **Justification:** Closure may slightly inconvenience local tech-commuters, potentially fostering minor resentment towards regional infrastructure authority (-ΔP_b). Conversely, timely repair prevents a future derailment that could damage reputation of automated transport systems (+ΔP_b). Net effect highly uncertain.
      *   ΔP_b estimated as negligible but directionally ambiguous: **-0.0000001 ± 0.0000002**
      *   SII_V = (-0.0000001) * 2.4 × 10^38 FP = **-2.4 × 10^31 FP** (Note sign certification required in 5.3(c)).
  *   **6. Net Civilisational Impact (NCI):**
      *   NCI = (4.35 × 10^24 FP) + (-2.4 × 10^31 FP) = **-2.399999565 × 10^31 FP** (approx. -2.4 × 10^31 FP)
      *   **Reasoning:** While FP_DI is large and positive (costly delay), SII_V is negative and orders of magnitude larger, suggesting a potential net benefit by marginally decreasing the probability of a *non*-benign singleton. However, the extreme sensitivity of SII_V to the unmeasurable ΔP_b renders the precise NCI value, and even its definitive sign, fundamentally indeterminate. The magnitudes are comparable only in the sense of both being astronomically large relative to near-term considerations; their precise relationship is unknown.
  *   **Offset:** Applicant proposes £50,000 donation to "Rural Digital Ethics Outreach" (OCS-CPA-2148 #47). OV = £50,000 / £1.5 × 10^-12/FP = **3.33 × 10^16 FP**. Adjusted FP_DI = 4.35 × 10^24 FP - 3.33 × 10^16 FP ≈ **4.35 × 10^24 FP** (negligible reduction).

  ### 5. SCHEDULE OF FEES
  *   **Basic CTS-101 Processing Fee:** £15,000
  *   **Complexity Surcharge (Projects > £5m value):** +£5,000
  *   **Expedited Review (Optional, 10 working days):** +£20,000
  *   **Offset Scheme Administration Fee:** 5% of Offset Funding (min. £1,000)
  *   **Late Submission Penalty:** 0.1% of project value per day.

  ### 6. DETERMINATION (SAMPLE - PROJECT RLX-2148A)
  **Office for Civilisational Stewardship - Consent Determination Notice**

  **Application Ref:** RLX-2148A  
  **Project:** Repair & Temporary Closure of Level Crossing (NT351204)  
  **Applicant:** County Transport Authority - Northern Region

  **Determination:** CONSENT GRANTED

  **Reasoning:**
  1.  A complete Form CTS-101 (Revision 3) was received on 2148-04-15, accompanied by the £15,000 Processing Fee and £2,500 Offset Administration Fee (£50,000 * 5%).
  2.  The Office has reviewed the calculations for FP_DI (4.35 × 10^24 FP) and SII_V (-2.4 × 10^31 FP) as presented in Sections 4 and 5.
  3.  The Applicant's justification for ΔP_b and the signed certification of SII_V direction (Box 5.3(c)) are noted and accepted as procedurally compliant.
  4.  The Net Civilisational Impact (NCI) calculation (-2.399999565 × 10^31 FP) and the Applicant's reasoning concerning its indeterminacy are formally recorded.
  5.  The proposed Offset funding (£50,000) for OCS-CPA-2148 #47 ("Rural Digital Ethics Outreach") has been received into the designated escrow account, resulting in an Adjusted FP_DI of 4.35 × 10^24 FP (not materially altering the NCI magnitude).
  6.  The Office finds no procedural deficiencies or material misrepresentations in the submitted CTS-101.
  7.  Consent is therefore granted under Section 47B(8) of the Civilisational Stewardship Act 2135 (as amended), conditional upon adherence to the project timeline as described and the release of Offset funds upon project commencement.

  **Signed:**  
  **Elara Voss**  
  Deputy Director, Project Assessment Bureau  
  Office for Civilisational Stewardship  
  Date: 2148-05-02

  ---
  **Note:** This is a fictional document satirising bureaucratic processes applied to highly speculative long-term futures. The Office for Civilisational Stewardship, the Singleton Hypothesis as law, and all calculations are inventions.
