  We are given an argument that leads to the conclusion that all singular causal claims are interest-relative, which the author finds problematic. The argument is presented in steps (1) to (8). We must reject one step to avoid this conclusion and then explain the cost and how it applies to the intern case.

  The author wants to preserve:
  - The idea that both the fire investigator and the committee can be objectively right about causation.
  - The idea that the failure to escalate mattered.

  The friend's argument:
  (1) A singular causal claim "c caused e" is true iff e counterfactually depends on c (but-for cause, without preemption/overdetermination).
  (2) The "closest" world is not fixed by actual facts; it's a similarity ranking. So causal truth depends on which possibilities we treat as nearer.
  (3) For omissions, we replace the omission with the positive act and look at the closest world where that act occurs.
  (4) There are many ways to escalate, and they lead to different downstream effects. So which world is closest is not settled.
  (5) We must decide how much of the agent to hold fixed. If we fix her mental states (like not noticing), then there is no world where she escalates. If we change her mental states, then other differences arise and the verdict is arbitrary.
  (6) Therefore, whether the omission caused the death depends on our choices (what we hold fixed, which possibilities we admit) and not on the world. So omission-causation is interest-relative.
  (7) But step (2) applies to positive causation too: the truth of "the faulty wiring caused the fire" depends on the similarity ranking we choose (what else we change in the counterfactual world). So if (2)-(6) show omission-causation is interest-relative, they show all causation is.
  (8) That conclusion must be wrong because we think the fire investigator's finding is objective and the committee's report should be too.

  We must reject one step. Let's evaluate:

  Rejecting (1): The friend says this leads to promiscuity (everyone who failed to escalate caused the death). We don't want that.

  Rejecting (2): This step says that the closest world is not fixed by actual facts and is a similarity ranking that we choose. But perhaps we can argue that the similarity ranking is not arbitrarily chosen but is fixed by the actual world? However, the friend might point out that the actual world doesn't specify a unique similarity metric.

  Rejecting (3): This step says that for omissions we must replace the omission with the positive act. Maybe we can treat omissions differently? But how?

  Rejecting (4) or (5): These are about the indeterminacy in the counterfactual for omissions. But the friend argues that positive cases have the same problem (step 7).

  Rejecting (6): The inference that because of the choices in (4) and (5) the causal claim is interest-relative. But if we accept (2) and the rest, then (6) seems to follow for omissions.

  Rejecting (7): The friend says that the same reasoning applies to positive cases. But maybe we can argue that positive causes are different? How?

  Rejecting (8): That the conclusion must be wrong. But the author and we both think that there is an objective fact about the fire and about the intern's case.

  The key is to break the chain that leads to (7). The author's friend is arguing that the same issues that plague omissions also plague positive causes. We need to show that positive causes do not suffer from the same degree of indeterminacy, or that there is a way to fix the similarity ranking for omissions without making it arbitrary.

  One common move is to hold fixed the actual circumstances except for the cause and its immediate effects. But for omissions, what is the "cause" to change? We have to change the omission to an act, and that act might require changes in the agent's mental states.

  Alternatively, we might reject (3) and (5) by arguing that we don't have to hold the agent's mental states fixed in the same way. For example, we might consider the counterfactual where the agent does what they ought to have done (escalate) without specifying how, and without requiring that we change their mental states in a way that leads to arbitrary differences. But then we are building in the norm, which the friend says turns causation into blame.

  However, the author wants to avoid that because it might make causation normative.

  Another idea: perhaps we can accept that omissions are not causes in the same way as positive events. We might say that the intern's failure to escalate is not a cause but a condition for the cause (the potassium abnormality) to have its effect. But then we lose the direct causal link.

  Alternatively, we can reject (2) by arguing that the similarity ranking is fixed by the actual world and our laws of nature, and that we have a standard way of evaluating counterfactuals. For positive causes, we hold fixed the laws and the actual circumstances except for the cause and its immediate prerequisites. For omissions, we do the same: we hold fixed the actual circumstances and change only the minimal set of things needed to make the omission into the required act.

  But what are the minimal changes? In the intern case, if she didn't notice the result, we have to change that she notices. But then we hold fixed everything else? Then we can ask: if she had noticed, would she have escalated? And if we hold fixed her character and disposition, then yes, she would have escalated. Then in that world, the attending is paged and comes? But we have to hold fixed the attending's disposition too? That might lead to the attending coming, and then the death is prevented.

  So the counterfactual might be: in the closest world where the intern notices the critical potassium and escalates (by the standard method, say paging the attending), and the attending (being responsible) comes and treats, then the death does not occur. We don't consider worlds where the attending is asleep and doesn't respond because that is not the closest? Why? Because we hold fixed the actual dispositions and obligations of the attending? But the actual world might have the attending being asleep? We don't know.

  This is messy.

  A better approach: reject (5). We do not hold the agent's mental states fixed in a way that makes the counterfactual impossible. Instead, we consider the counterfactual where the agent performs the required act, and we change only what is necessary for that act to occur. This might involve changing the agent's mental states (like noticing) but then we hold fixed the rest of the world as much as possible.

  We don't have to hold fixed the reasons for the omission because the omission is what we are changing. We are allowed to change the fact that she didn't notice to her noticing, and then we assume she would do what a reasonable intern would do (escalate). Then we hold fixed the rest of the world: the attending is available, the hospital systems work, etc. because that was the actual situation.

  But if the attending was actually not available, then we would have to change that? No, we hold fixed the actual circumstances. So if the attending was actually not available, then in the counterfactual world where the intern escalates, the attending still doesn't come, and the death occurs. Then the failure to escalate did not cause the death? But that might be the case: if the system was broken, then even if she escalated, it wouldn't have helped.

  But in the actual case, we don't know about the attending. The committee might assume that if she had escalated, the system would have worked. That assumption might be built into the counterfactual.

  This is where the friend says we are building in our interests. We are assuming the system works because we are interested in blaming the intern? Or because we have evidence that the system was working?

  But the fire case is similar: we assume that in the counterfactual without the faulty wiring, the space heater is still left on? Or not? We hold fixed the actual fact that the space heater was left on? Then without the fault, the space heater might still cause the fire? So we have to change the space heater? But that seems arbitrary.

  In the fire case, the standard approach is to hold fixed the actual circumstances (the space heater was on) and remove the fault. If the fault was necessary for the fire (given the space heater being on), then the fault caused the fire. If the fire would have started anyway (because of the space heater and some other fault), then the fault we removed is not the cause.

  Similarly, in the intern case, we hold fixed the actual circumstances (the patient's condition, the availability of the attending, etc.) and change only the intern's omission to the act of escalation. Then we see if the death would have been prevented.

  But to change the omission, we must change the intern's mental state (she notices the result). Then we assume she escalates in the standard way. Then we hold fixed the rest: the attending is available and responds appropriately. Why? Because that is the actual circumstance? We don't know. But if the attending was actually asleep and wouldn't have responded, then in the counterfactual, he still doesn't respond, so the death occurs. Then the failure to escalate did not cause the death.

  But the committee found that it did. So they must be assuming that the attending would have responded. That assumption might be based on evidence (e.g., the attending was on call and available, and there is no evidence he was impaired). In the absence of evidence to the contrary, we assume the system would have worked.

  This is where the friend says we are making a normative choice: we are assuming the system works because it should. But in the fire case, we don't assume the space heater is turned off in the counterfactual because it shouldn't have been left on. We hold it fixed. So why in the intern case do we assume the attending would have responded? Because we are holding fixed the actual circumstances, and the actual circumstance is that the attending was on call and expected to respond. So if there is no reason to think he wouldn't have, we hold it fixed.

  But if there was a reason (e.g., the attending had a history of not responding), then we might not hold it fixed? Then the causal claim would be different.

  So the truth of the causal claim depends on the actual facts about the system. If the system was functional, then the failure to escalate caused the death. If the system was broken, then it might not have.

  This is not interest-relative in the sense of being arbitrary. It depends on the actual facts. But the problem is that we might not know all the actual facts. However, that is an epistemic issue, not a metaphysical one.

  So the step that is wrong is (5): we do not hold the agent's mental states fixed in a way that makes the counterfactual impossible. We change what is necessary to make the act occur, and then hold fixed the rest of the world. The causal claim then depends on the actual facts about the world (like whether the attending would have responded), which are objective.

  Similarly, in the fire case, the causal claim depends on the actual facts (like whether the space heater was on and would have caused the fire anyway).

  Therefore, we reject (5). We do not hold the agent's reasons, attention, and beliefs fixed in the counterfactual where she escalates. Instead, we change her mental states just enough so that she escalates (e.g., she notices the result) and then hold fixed her disposition to do her job (so she escalates) and the rest of the world. Then we see what happens.

  In the intern case: in the closest world where she notices the critical potassium, she escalates (by paging the attending). We hold fixed that the attending is available and would have responded appropriately (because that was the actual situation, unless there is evidence otherwise). Then the patient is treated and does not die. Therefore, her failure to escalate caused the death.

  If the attending was actually unavailable (say, he was in a car accident that night), then in the counterfactual, even if she escalates, the attending doesn't come, and the patient dies. Then her failure did not cause the death. But that is because the actual world had a broken system.

  So the committee's report survives if we can establish that the system was functional. That is an objective fact.

  What does rejecting (5) cost? We are allowing that we change the agent's mental states in the counterfactual. This is standard in counterfactual reasoning about actions. We don't require that the agent's reasons for acting be the same because we are changing the scenario to one where she does act. We imagine her noticing and then doing what a reasonable person in her position would do.

  This does not build in the norm in an objectionable way. We are not saying she should have escalated and therefore we call it a cause. We are saying that in the counterfactual where she escalates (which requires her to notice), and given the actual circumstances, the death would have been prevented. That is a factual claim.

  The friend might say that we are still making a choice about what counts as the minimal change. But in the positive case, we also make minimal changes. We remove the fault in the wiring and don't change anything else. So it's symmetric.

  Therefore, we reject step (5).

