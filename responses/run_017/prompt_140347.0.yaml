answer: |-
  ### **Forecasting Game: The "Zap" Social Media Platform Challenge**  
  **Objective:** Illustrate the pitfalls of the inside view and the nuances of the outside view without using those terms until the debrief. Students will forecast the user growth of a fictional social media app ("Zap") in two rounds.  

  ---

  #### **Materials Needed**  
  - **Round 1 Handout (Inside View):**  
    > **Zap: The Next Big Thing?**  
    > *As of January 2024 (6 months after launch):*  
    > - 500,000 active users.  
    > - 20% month-over-month growth in the last 3 months.  
    > - Founded by ex-execs from a top tech firm.  
    > - Unique "3D chat" feature going viral in college demographics.  
    > - *Your task: Forecast Zap’s active users on July 2025 (18 months from now).*  

  - **Round 2 Handout (Reference Class Options):**  
    > **Choose ONE reference class for Zap. Cost in points:**  
    > - **Class A: All social platforms** (0 pts)  
    > - **Class B: Platforms with a "viral feature"** (10 pts)  
    > - **Class C: Platforms founded by ex-big-tech teams** (10 pts)  
    > - **Class D: Platforms with >20% growth at 6 months** (20 pts)  
    > *Commit to your class BEFORE seeing base rates!*  

  - **Base Rate Reveal (After Class Selection):**  
    > **Average users at 2 years (made-up data):**  
    > - Class A: 4 million  
    > - Class B: 15 million  
    > - Class C: 12 million  
    > - Class D: 8 million  

  - **True Outcome (Revealed at End):**  
    > Zap’s users on July 2025: **5 million**.  

  ---

  #### **Rules & Scoring**  
  1. **Round 1 (Inside View):**  
     - Groups (3 students each) forecast Zap’s users using **only** the handout.  
     - Emphasize: "No real-world knowledge after January 2024!"  

  2. **Round 2 (Outside View):**  
     - Groups choose **one** reference class and pay the point cost (e.g., picking Class D costs 20 pts).  
     - **Critical twist:** They commit *before* seeing base rates.  
     - After commitment, reveal base rates. Their Round 2 forecast **must** be the base rate of their chosen class.  

  3. **Scoring (Quadratic Rule):**  
     - For a forecast \( F \) and true outcome \( T = 5 \text{ million} \):  
       \[
       \text{Score} = 100 - 4 \times (F - T)^2
       \]  
       *(Example: Forecast 7M → \( 100 - 4 \times (7-5)^2 = 100 - 16 = 84 \))*  
     - **Total score = Round 1 score + Round 2 score - reference class cost**.  
     - *Note: Scores can be negative (teaching moment!)*.  

  ---

  #### **Predicted Student Actions & Pitfalls**  
  - **Round 1 (Inside View):**  
    - Most groups will extrapolate the 20% growth (e.g., \( 0.5M \times 1.2^{18} \approx 12-20M \)).  
    - Some will adjust down slightly ("growth slows!") but still overshoot (e.g., 6-10M).  
    - **Pitfall:** Overweighting vivid details (e.g., "ex-execs" or "viral feature").  

  - **Round 2 (Reference Class):**  
    - 80%+ will pick Class D (narrow, "relevant") due to the 20% growth match.  
    - Others pick B/C ("viral feature/ex-execs") to save points vs. Class D.  
    - Few pick Class A (broad, "boring").  
    - **Pitfall:** Assuming narrow classes are always better.  

  - **Scores:**  
    - **Class D choppers:** Forecast 8M → Score \( 100 - 4 \times (8-5)^2 = 64 \). Minus 20-pt cost → **44 net**.  
    - **Class A choppers:** Forecast 4M → Score \( 100 - 4 \times (4-5)^2 = 96 \). Minus 0-pt cost → **96 net**.  
    - *Most groups will score lower in Round 2 than Round 1 due to cost + poor class choice*.  

  ---

  #### **Debrief: Mapping Game Moments to Key Insights**  
  1. **"Why did your inside view forecasts cluster around 10-15M?"**  
     - *Point:* Inside view fixates on case-specific noise (e.g., "20% growth!"). Ignores base realities.  
     - **Reveal:** Only 1 in 20 social apps hit >10M users (but they didn’t have this info).  

  2. **"Why did most of you pick Class D?"**  
     - *Point:* Picking a reference class is **itself an inside-view task**. You judged "similarity" based on Zap’s details (the 20% growth).  
     - **Key insight:** The outside view isn’t automatic—it’s vulnerable to the same biases!  

  3. **"Class A had the best results. Why did it feel 'wrong'?"**  
     - *Point:* Broad classes (e.g., "all social platforms") average out noise (e.g., flukes like Zap’s hot start).  
     - **Key insight:** The outside view’s power isn’t about insight—it’s about **diluting overconfidence** from idiosyncrasies.  

  4. **"Class D was worse than your inside view! Why?"**  
     - *Point:* Narrow classes are volatile. Class D included apps that flamed out after fast starts (e.g., 8M average hides outcomes from 1M to 30M).  
     - **Key insight:** Relevance ≠ accuracy. "Similar" cases can have extreme outcomes.  

  ---

  #### **What the Game Can’t Teach (Just Tell Them)**  
  - **"The outside view is a starting point, not the finish."**  
    In reality, you’d adjust the base rate (e.g., "Zap’s founders are strong, so maybe add 10%"). But do this *systematically* (e.g., with distributions), not gut feel.  
  - **"Base rates aren’t destiny."**  
    Zap beat Class D’s average (5M vs. 8M). But consistently using broad classes avoids *big* misses, even if it feels "dumb."  

  ---

  #### **Logistical Tips**  
  - **Time:**  
    - Round 1 (15 min), Round 2 (15 min), Scoring (10 min), Debrief (35 min).  
  - **Pitfalls First Time:**  
    - Students will grumble about Class D’s cost ("20 points is unfair!"). Stand firm: "Relevance isn’t free."  
    - Some will protest using the base rate blindly. Agree—then explain: "This forces you to *trust* the class. In practice, you wouldn’t."  
  - **Power Move:**  
    - Graph student forecasts. Show the inside view’s clutter (10-20M) vs. the tidy base rates (4-8M). Ask: "Which looks more reliable?"  

  **Why this works:** Students *feel* the inside view’s overconfidence, the reference class trap, and the boring power of averaging. No jargon—just pain points.
