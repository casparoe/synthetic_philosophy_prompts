  Potential problems and fixes:

  1. **Talking in the silent phase:** 
     - Problem: Students may whisper or try to coordinate verbally. 
     - Fix: Remind them it's silent. If they persist, say: "Remember, no talking. The point is to see how coordination happens without communication."

  2. **Stubborn three outing themselves:** 
     - Problem: They might tell others about their instruction. 
     - Fix: Emphasize secrecy in the instruction. If they do reveal, note it in the debrief: "In real conventions, there might be people who are inflexible, and sometimes we know why, sometimes not."

  3. **Gaming the points:** 
     - Problem: In the pairing phase, someone might try to maximize points by switching colors frequently or in a way that exploits the rules. 
     - Fix: This is part of the learning. In the debrief, discuss whether this is similar to real conventions (where individuals might have incentives to deviate).

  4. **Smaller group capitulating immediately:** 
     - Problem: When the groups merge, the smaller group might switch to the larger group's color without a fight. 
     - Fix: The stubborn minority in the smaller group should prevent complete capitulation. If the smaller group doesn't have the stubborn members, then we might see capitulation. We can adjust by making sure the stubborn members are in the smaller group. Also, in the debrief, note that sometimes one convention wins because it's more salient (e.g., from the larger group).

