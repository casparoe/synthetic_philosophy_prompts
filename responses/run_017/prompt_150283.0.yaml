answer: |-
  Below is a comprehensive activity design for your seminar, followed by a detailed table and list of limitations. The activity is structured to mirror Lewis's core ideas—arbitrariness, salience, expectations, and the shift to sanction-based enforcement—while incorporating your twists. It uses color cards for coordination, with points tracking on a central whiteboard. Total runtime: 75 minutes (60 for activity, 15 for debrief).

  ---

  ### **Activity Design: "Color Convention Game"**  
  **Materials:**  
  - **Colored index cards** (3 colors, e.g., red/blue/green; 3 cards per student, one of each color).  
  - **Penalty slips** (small paper squares; 3 per student).  
  - **Secret instruction cards** (for 3 stubborn students: *"Never change your color. Stick to your first choice no matter what. Do not reveal this instruction."*).  
  - **Whiteboard** to track points (simple tally per student).  

  #### **Step-by-Step Rules**  
  1. **Setup (5 min)**  
     - Split the room into **Group A** (9 students) and **Group B** (9 students). Move chairs apart to create physical separation.  
     - Distribute 3 colored cards (red, blue, green) to each student. Announce:  
       > *"In your group, coordinate silently to all hold up the* same *color card. Change cards freely—no talking, gestures, or eye contact. Goal: Full agreement in 10 minutes."*  

  2. **Silent Coordination (10 min)**  
     - **Secret twist:** Give 3 students in **Group B** (the "stubborn minority") secret instruction cards.  
     - Groups attempt to converge. *Expected outcome:* Group A converges quickly on one color (e.g., red). Group B struggles due to stubborn members; they may settle on the stubborn color (e.g., blue) or fail to agree.  

  3. **Merged Pairing Rounds (20 min)**  
     - Merge groups. Announce:  
       > *"Pair up randomly with a new partner each round. Hold up any color. If you* match*, both earn 2 points. If you* mismatch*, both get 0. We’ll do 5 rounds—change partners when I say ‘rotate.’"*  
     - Run 5 rounds (90 seconds per round). Students self-report matches/mismatches for point tallying.  
     - *Expected outcome:* Early rounds have mismatches (A vs. B conventions). Students adjust to match partners, but stubborn students won’t change. The majority may adopt the stubborn color (salience via obstinacy) or fracture.  

  4. **Payoff Shift & Penalty Round (10 min)**  
     - Announce new rules:  
       > *"Now: Matching still gives 2 points, but if you* switch *your color from last round, you get +1 bonus point (even if you mismatch). After revealing colors, you may give a penalty slip to your partner if they* switched*. Each penalty costs them 1 point and gains you 0.5 points."*  
     - Distribute 3 penalty slips per student. Run 1 round.  
     - *Expected outcome:* Students switch for bonuses, causing mismatches. Penalties are used to punish switchers, creating visible tension between self-interest and enforcement.  

  5. **Debrief (15 min)**  
     - Guide students to connect experiences to Lewis:  
       - **Arbitrariness/Salience:** *"Why did your group’s initial color win? Was there a ‘reason’?"*  
       - **Expectations:** *"In pairing rounds, why did you choose your color? What did you assume others expected?"*  
       - **Stubborn minority:** *"How did the inflexible players shape the convention? Was it efficient?"*  
       - **Sanction shift:** *"When bonuses came in, what kept you complying? Was it ‘convention’ or something else?"*  

  ---

  ### **Activity Roadmap Table**  
  | Phase               | Minutes | What Participants Are Told & Doing                                                                 | What They Should Run Into                                                                 | Debrief Question to Draw Out                                                                 | What Goes Wrong + Fix                                                                 |  
  |---------------------|---------|---------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------|  
  | **Setup**           | 5       | Told: Split into Group A/B. Given 3 colored cards. Goal: Silently agree on one color per group.    | Groups grasp task; physical separation limits communication.                              | N/A (setup phase)                                                                            | **Wrong:** Uneven groups. **Fix:** Adjust group sizes on the fly to 9v9.              |  
  | **Silent Coordination** | 10   | Doing: Holding/changing cards silently. Stubborn 3 in Group B never switch.                       | Group A converges easily. Group B faces deadlock; stubborn players create salience via persistence. | *"How did your group settle on a color? What made it ‘win’?"* (Salience/precedent)           | **Wrong:** Talking/gesturing. **Fix:** Gently remind: "No communication—this is about silent coordination." |  
  | **Merged Pairing**  | 20      | Told: Pair up, match for points (5 rounds). Doing: Switching colors to match partners.            | Early mismatches (A vs. B conventions). Stubborn players won’t bend; majority may adopt their color or fragment. | *"Why did the group eventually pick one color? What role did expectations play?"* (Coordination equilibrium) | **Wrong:** Stubborn students reveal secret. **Fix:** Note in debrief: "In real life, inflexibility isn’t always visible." |  
  | **Payoff Shift**    | 10      | Told: Switch colors for +1 bonus; penalize switchers. Doing: Risking switches for points; issuing penalties. | Bonuses incentivize deviation; penalties enforce compliance. Convention "breaks" into sanction-driven compliance. | *"When bonuses came in, why did you still follow the color? What changed?"* (Shift to sanctions) | **Wrong:** Gaming points (e.g., always switching). **Fix:** Allow it—debate efficiency in debrief. |  
  | **Debrief**         | 15      | Discussing links to Lewis: arbitrariness, expectations, Pareto efficiency, sanctions.             | "Aha!" moments connecting gameplay to convention mechanics.                              | *"Was this a ‘convention’ at the end? What defined it?"* (Lewis’s criteria)                  | **Wrong:** Time overrun. **Fix:** Cut pairing rounds short if needed; focus on key takeaways. |  

  ---

  ### **What the Activity Can’t Stage (Must Be Explained)**  
  1. **Timescale:**  
     - Real conventions evolve over years/generations (e.g., driving-side norms). Here, convergence is immediate.  
     - **Say:** *"This compresses time—real conventions need repeated interactions to solidify."*  

  2. **Anonymity & Scale:**  
     - Lewisian conventions work in large, anonymous groups (e.g., language). Here, students know each other and interact face-to-face.  
     - **Say:** *"Real conventions rely on expectations of strangers, not personal reputations."*  

  3. **Law/Formalization:**  
     - Conventions often harden into laws (e.g., traffic rules). The activity lacks institutional enforcement.  
     - **Say:** *"In the real world, conventions can become codified—think of how ‘precedent’ turns into policy."*  

  4. **Unconscious Conformity:**  
     - People often follow conventions unthinkingly (e.g., elevator etiquette). Here, students are hyper-aware.  
     - **Say:** *"Lewis notes conventions run on ‘common knowledge’—yours was explicit, but real ones feel automatic."*  

  5. **Nested Conventions:**  
     - Real conventions exist in ecosystems (e.g., money relies on trust, law, markets). This is a single, isolated game.  
     - **Say:** *"Conventions build on each other—here, we only saw one layer."*  

  ---

  ### **Why This Works**  
  - **Twist 1 (Stubborn Minority):** Forces salience through inflexibility, mirroring how real conventions resist change (e.g., QWERTY keyboards).  
  - **Twist 2 (Payoff Shift):** Bonuses create a prisoner’s dilemma-like tension; penalties make sanctions visible, highlighting Lewis’s "borderline" between convention and norm.  
  - **Predictable Issues:** Built-in fixes (e.g., silent phase reminders) minimize disruptions while making failures teachable (e.g., if stubborn students capitulate, discuss why capitulation is Pareto-inefficient).  

  **Final Tip:** Start the debrief by asking students to recount "what happened" before linking to theory. This grounds abstract concepts in their lived frustration/insight.
