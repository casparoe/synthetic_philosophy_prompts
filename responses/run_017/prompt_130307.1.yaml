prompt: |-
  I am writing a short internal memo for a research-funding group that has to decide whether to carve out a standing budget line for work on invertebrate welfare. The draft memo makes two claims. The first is that our evidence for sentience in insects is thin enough that the probability of sentience for a typical insect species should be put low — I used low single-digit percentages as an illustrative placeholder, explicitly flagged as such. The second is that this does not settle the priority question, because the argument is multiplicative: a small probability times an enormous number of individuals is still an enormous expected quantity, and the numbers usually cited for insects killed in agriculture run to the trillions per year. So, I claimed, the priority survives the low probability, and the honest way to disagree with me is to attack the decision rule rather than the probability.

  A colleague read the draft and replied, in effect: absence of evidence is not evidence of absence — you can't discount these animals just because nobody has turned up the evidence yet. That one sentence was doing a lot of work. It was meant to move me off the low probability, to shift the burden of proof onto anyone who would set the probability low, and to entomologically dignify the question — to make insect sentience a live moral possibility rather than a settled null. I suspect the line is being asked to do more than any precise version of it can, but I also suspect that at least one precise version is genuinely strong, and I can't cleanly separate the readings.

  Please disambiguate it for me.

  Give me a menu — at least six entries, ordered from the most defensible to the most ambitious — of the distinct precise theses the line could be asserting. Do not collapse them into the one reading you find most sympathetic; I want the alternatives side by side. Candidates I can see, which you should sharpen, correct, or replace with better ones:

  - a purely dialectical reading about who bears the burden of argument, which may say nothing at all about probabilities;
  - a claim about evidential sensitivity: where we have not run any test that would have been likely to show sentience had it been there, the silence carries little or no weight;
  - the stronger claim that even screened silence — we applied the behavioural and neural markers we would expect to be positive if the animal were sentient, and got nothing — carries no evidential weight, which seems to me straightforwardly in tension with ordinary confirmation theory, since a low probability of silence given sentience is exactly what should drive the probability of sentience down;
  - a precautionary or asymmetry-of-harms reading, on which the probability is irrelevant because the downside of treating a sentient animal as insentient is so much worse than the reverse;
  - a claim about aggregation and fanaticism: that once the population is large enough, no sane decision rule lets the probability term do much discounting work;
  - a claim about the second factor in the product rather than the first — not about whether insects are sentient but about how much their experiences matter if they are, and about whether a very small mind can have a welfare of large intensity.

  I have found it useful, in thinking about this, to distinguish unscreened silence from screened silence, and also to distinguish silence about the probability from silence about the conditional magnitude. Tell me whether those distinctions do real work here, whether either of them has a standard name, and whether I have drawn them in the wrong place.

  For each reading in the menu, give me four things: what the reading commits you to, in a sentence precise enough that I could put it in the memo; whether it is trivial, substantive and defensible, or false; whether it would actually license the move my colleague was making with it — restoring the probability, shifting the burden, or neither; and what it would imply for the memo's structure, in particular whether it should change my number or only change what follows from my number. Then tell me which single reading is the strongest thing a defender of the line could reasonably claim, and whether even that reading gets my colleague his conclusion. If one of the readings is best understood as a claim about decision rules under uncertainty rather than about evidence or probability, say so explicitly, since that bears on where in the memo it belongs.

  Finally, a note on confidence. I do not need citations and please do not give me a reading list; argue from the structure of the argument. But attach to each verdict a rough confidence marker — confident, fairly confident, or guessing — and close by singling out the one claim in your answer that you would most expect a specialist to reject, with a sentence on what they would say against it.
reasoning: |-
  Okay, the user is writing a memo about funding invertebrate welfare research and is dealing with a colleague's critique about the probability of insect sentience. The colleague used the phrase "absence of evidence is not evidence of absence," which the user wants to dissect into precise interpretations. 

  First, I need to unpack what the colleague might mean by that phrase. The user already listed some potential readings, but they need them sharpened and ordered from most to least defensible. The key distinctions here are between unscreened vs. screened silence and probability vs. magnitude. 

  Starting with the most defensible reading: burden of proof. This seems solid because in contexts with high stakes, it's reasonable to ask skeptics to justify low probabilities. The colleague wants the memo to avoid dismissing insect sentience without proper scrutiny. 

  Then, evidential sensitivity—if we haven't tested properly, silence doesn't mean much. This is also defensible since for many insects, we lack sensitive tests. But if we have tested (screened silence), this becomes weaker. 

  The screened silence claim is trickier. The user thinks this clashes with confirmation theory, which makes sense. If tests for sentience markers come back negative, that should lower the probability. But the colleague might argue current markers aren't reliable, so even negative results aren't conclusive. 

  The precautionary principle shifts focus to decision rules, not evidence. If the harm of missing sentience is huge, we might act regardless of probability. This is substantive but controversial—some might call it alarmist. 

  Aggregation/fanaticism is about large numbers overwhelming low probabilities. This is more about decision theory and could justify prioritizing invertebrate welfare even with low probabilities. However, it doesn't address the probability itself, just how we weight it. 

  The magnitude reading is the most ambitious. If sentient insects experience intense suffering, the product (probability × magnitude) stays large. But current science doesn't support high intensity for tiny brains, making this weak. 

  The user's distinctions—unscreened vs. screened silence, probability vs. magnitude—are crucial. They help separate different scenarios where the colleague's argument holds or fails. "Unscreened silence" isn't standard but clear; "screened silence" might align with "negative test results" in epistemology. 

  For each reading, I need to state its commitment, defensibility, whether it restores probability/shifts burden, and memo implications. The strongest claim overall is the precautionary principle, especially with unscreened silence. But even that doesn't force high probability—it just changes how we act given uncertainty. 

  The colleague's conclusion (restoring probability) isn't fully supported by any reading. The burden of proof and evidential sensitivity readings come closest by making low probabilities harder to justify, but they don't mandate high probabilities. 

  The most contestable point is the screened silence claim. Specialists might argue that even with negative tests, if our markers are poor, silence still shouldn't lower the probability much. They'd say current tests aren't definitive, so absence of evidence remains weak evidence.
answer: |-
  Here is a disambiguation of "absence of evidence is not evidence of absence" into six distinct theses, ordered from most to least defensible, with analysis. Your distinctions (unscreened/screened silence, probability/magnitude) are central and correctly placed. "Unscreened silence" (lack of investigation) is not standard but clear; "screened silence" (negative test results) aligns with "negative evidence" in confirmation theory.

  ---

  ### **The Menu of Precise Theses**

  1.  **Burden of Proof Allocation (Dialectical Reading)**  
      **Commitment:** When asserting a low prior probability of insect sentience based *only* on taxonomic distance or lack of human-like complexity, the burden rests on the asserter to justify that prior, not on others to disprove it.  
      **Defensibility:** **Substantive & Defensible** (in contexts of high stakes and incomplete investigation).  
      **Licenses Colleague's Move?** Shifts burden (yes), but does *not* inherently restore probability or dignify possibility beyond initial uncertainty.  
      **Memo Implication:** Your low single-digit % must be rigorously defended (e.g., against simpler null hypotheses of non-sentience). Keep the number if justified, but anticipate challenges to its basis.  
      **Confidence:** Confident.

  2.  **Evidential Sensitivity (Unscreened Silence)**  
      **Commitment:** For species where no tests capable of detecting sentience (if present) have been performed, the absence of evidence *cannot* rationally lower the probability of sentience below a minimally informed prior (e.g., based on phylogeny).  
      **Defensibility:** **Substantive & Defensible** (core Bayesian insight: P(no evidence | sentience) ≈ 1 if tests weren't done).  
      **Licenses Colleague's Move?** Restores probability toward pre-silence baseline (yes), shifts burden to those claiming low P (yes), dignifies as live possibility (yes).  
      **Memo Implication:** If your low % relies on silence for *untested* species, it is invalid. Revise probability upward for those cases or justify low prior independently.  
      **Confidence:** Confident.

  3.  **Precautionary Decision Rule (Asymmetry of Harms)**  
      **Commitment:** Under deep uncertainty about sentience, the potential harm of falsely assuming non-sentience (enormous suffering discounted) vastly outweighs the harm of falsely assuming sentience (wasted resources), so decisions should prioritize reducing worst-case outcomes regardless of nominal probability estimates.  
      **Defensibility:** **Substantive & Defensible** (in high-stakes decisions under ignorance; not an epistemic claim).  
      **Licenses Colleague's Move?** Shifts burden to opponents of funding (yes), dignifies possibility (yes), but does *not* restore probability (irrelevant to this claim).  
      **Memo Implication:** Your multiplicative argument holds *even if* probability is low. Place this in the decision rule section. No need to change your number, but emphasize uncertainty and asymmetry.  
      **Confidence:** Fairly confident.

  4.  **Aggregation Overwhelms Probability (Fanaticism Adjacent)**  
      **Commitment:** When the number of affected individuals is sufficiently large (e.g., trillions), expected value calculations become dominated by the magnitude term, making the exact probability estimate (if non-zero) pragmatically irrelevant for prioritization.  
      **Defensibility:** **Substantive & Controversial** (depends on acceptance of strong aggregation; clashes with risk aversion).  
      **Licenses Colleague's Move?** Neutral on probability restoration; implies burden is misplaced (focus should be on magnitude/numbers). Dignifies *moral urgency*, not sentience per se.  
      **Memo Implication:** Bolsters your "multiplicative argument" section. Your low % is acceptable but futile for discounting priority. No change to number needed.  
      **Confidence:** Fairly confident.

  5.  **Rejection of Screened Silence (Anti-Confirmation)**  
      **Commitment:** Even when tests for sentience markers (e.g., pain behavior, neural correlates) yield negative results, this "screened silence" provides negligible evidence *against* sentience, because our models linking markers to sentience in invertebrates are too unreliable.  
      **Defensibility:** **Substantive & Weak** (contra confirmation theory; only defensible if markers are proven *invalid*, not just imperfect).  
      **Licenses Colleague's Move?** Restores probability (ambitionally), shifts burden (yes), dignifies possibility (yes).  
      **Memo Implication:** Forces significant upward revision of your low % if based on negative empirical results. Challenges the validity of current tests.  
      **Confidence:** Guessing (highly context-dependent).

  6.  **Magnitude Amplification (Intensity Claim)**  
      **Commitment:** If insects *are* sentient, their welfare intensity (e.g., pain per individual) could be vastly higher than typically assumed (e.g., due to metabolic rate, threat density), so the "enormous number" multiplier in the expected value calculation is even larger than trillions × base human-equivalent pain.  
      **Defensibility:** **False** (current evidence suggests simpler nervous systems support less intense/durable experiences; no basis for inverse scaling).  
      **Licenses Colleague's Move?** Indirectly "restores" expected value without touching probability. Does not shift burden on sentience.  
      **Memo Implication:** If used, place in magnitude discussion. Your low % is unaffected, but the second term grows. Weak support for colleague.  
      **Confidence:** Confident (in its falsity).

  ---

  ### **Key Conclusions**
  - **Strongest Reasonable Claim:** The **Precautionary Decision Rule (#3)** is the most robust standalone argument for funding, as it bypasses probability debates entirely and focuses on asymmetric risks. It does *not* restore probability but justifies action despite low estimates.  
  - **Does Colleague Get Their Conclusion?** **No.** No reading *forces* a high probability estimate. #2 (Evidential Sensitivity) and #5 (Rejection of Screened Silence) can *challenge* low probabilities but don't mandate high ones. The colleague's demand to "restore the probability" is overreaching; the strongest versions (#2, #3, #5) only justify treating P(sentience) as *non-negligible* under uncertainty.  
  - **Where Distinctions Work:**  
    - **Unscreened vs. Screened Silence:** Critical for #2 vs. #5. Most insects likely fall under *unscreened* (bolstering #2).  
    - **Probability vs. Magnitude:** Cleanly separates #1-5 (probability/evidence) from #6 (magnitude). Your memo correctly treats magnitude as a separate factor.  
  - **Specialist Target:** **#5 (Rejection of Screened Silence)** would be most contested. Critics would say: "Negative results *do* lower P(sentience) under any plausible Bayesian update; rejecting this requires showing tests are *utterly uninformative*, not just imperfect. We *can* quantify evidential weight using likelihood ratios."  

  **Recommendation:** Fortify your memo by:  
  1. Explicitly anchoring your low % to *screened* evidence where possible (defusing #2),  
  2. Justifying priors for unscreened taxa (addressing #1),  
  3. Expanding the decision rule section with precautionary logic (#3) and aggregation dynamics (#4).  
  This preempts the colleague's critique without conceding on probability.
