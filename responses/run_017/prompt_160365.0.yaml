prompt: |-
  i'm a political philosopher by training but they've put me on the first-year public ethics module, and i've stupidly agreed to do the corruption week, so i want to walk in with something better than the NGO-style definition everyone opens with — entrusted power used for private gain — because maybe half my cases fall outside it. Let me just say what i actually think case by case and see what you can make of it.

  A nurse in a public hospital who hasn't been paid in three months takes cash from a family to find a bed for their mother: i won't call that corruption, it feels more like a toll, or like a wage. Same nurse, same envelope, but this time to push their mother ahead of another patient in a queue that otherwise works fine: corruption. A building inspector takes forty dollars to sign off on wiring that will burn a house down: corruption, and worse than the queue-jumping, even though the money is smaller. A mayor awards a contract to a firm run by his cousin's husband — lowest bid, good work, no kickback — and i still want to call it corruption, though i can't say what was stolen. A different mayor steers a bridge to her own district to win re-election, and i don't want to call that corruption, just politics, though it's also an office used for someone's advantage. A minister takes a job with a company he used to regulate; nothing was agreed in advance, but i call it corruption anyway and can't point to the moment it happened. A firm pays someone inside the city to nudge the training data of the algorithm that ranks permit applications, so theirs comes out on top: no official exercised judgement, no rule was broken, and i still say corruption. A procurement framework drafted so that exactly one domestic firm qualifies, drafted by people who'll go on to work there, legal at every step: i say corruption, and worse than the inspector, but there's no payment and no individual victim i can name. A company pays an impoverished village to consent to a waste facility: i go back and forth, and i lean toward not corruption, which worries me, because the thing being bought is the one thing i thought couldn't be bought. Gifts: a goat to the midwife after a safe birth, fine; a two-hundred-dollar gift card to a teacher from a parent, i flinch; corporate hospitality at a tennis tournament for a regulator, corruption. An official who quietly lets a widow skip a queue out of pity, taking nothing: i don't call it corruption, but only because nothing was gained, and that feels like the wrong reason. And then a border clerk in a state whose only real function is extraction, who takes money to lose the paperwork on a shipment of grain: i want to call that sabotage rather than corruption, but i suspect i only get to say that if i've already decided the state is illegitimate — which seems to make corruption depend on a political judgement i'd rather keep out of the definition.

  My tentative principle, such as it is: an act is corrupt when someone occupying a role lets a consideration that the role exists to exclude override the considerations the role exists to answer to. So: does that actually deliver my verdicts, and where does it break? It looks like it can't reach the algorithm case, where nobody's reasoning was moved at all, only the inputs; and it looks like it might clear the procurement framers, who could say they were serving development policy all along. Does "private gain" need to be a separate clause, or should i drop it and accept that the pity case is corruption with an excuse? And is the principle culturally neutral, or does it smuggle in a specifically Western administrative picture — impersonal offices, rules that bind against relationship — given that in plenty of places a gift to an official is how you acknowledge a relation rather than how you buy a decision? Two of my colleagues say that calling those gifts corruption just exports one administrative ideal and calls it a moral standard, and i'd like to know whether my principle has the resources to say the gift cases are genuinely different in kind, or whether it has to say the difference is only in what the local norms happen to be.

  Give me the principle in a form i could defend in a lecture, with the case that motivates each clause, verdicts on two cases i haven't listed (including one i'd definately find counterintuitive), and an honest list of which of my verdicts i have to give up. I'd rather drop a verdict than add a clause that only exists to save it.
reasoning: |-
  Hmm, this user is a political philosopher teaching public ethics and struggling with defining corruption beyond the standard NGO definition. They've presented a series of nuanced cases where their intuitive judgments about what constitutes corruption don't neatly fit the "entrusted power for private gain" framework. They're looking for a more sophisticated principle they can defend academically.

  The user has already developed a tentative principle: corruption occurs when someone in a role allows considerations the role is meant to exclude to override those it should serve. They want me to test this against their cases, identify where it fails, and refine it into a lecture-ready framework. They're particularly concerned about cultural neutrality and whether their Western administrative bias is showing.

  Looking at their cases, several patterns emerge: 
  - The distinction between survival/extortion versus greed matters (unpaid nurse vs queue-jumping)
  - Systemic vs individual corruption differs (algorithm manipulation vs cash bribes)
  - Intent and harm severity create moral gradients (dangerous wiring vs queue-jumping)
  - Institutional capture troubles them more than petty corruption (procurement framing vs border clerk)

  Their principle has strengths - it focuses on role integrity rather than just personal gain, which explains why the cousin's contract award feels corrupt without explicit theft. But it struggles with cases where no human discretion is involved (algorithm tweaking) or where gain is absent (pity case). The cultural gift question is especially thorny - their flinch at the $200 gift card suggests they're already wrestling with administrative normativity.

  For a defensible principle, I'll need to: 
  1) Define "role" institutionally to cover both human officials and systems like algorithms 
  2) Distinguish between "excluded considerations" (what the role must ignore) and "served considerations" (what it must prioritize) 
  3) Address gain not as essential but as an aggravating factor 
  4) Build in cultural context through the role's socially understood purpose 

  The border clerk case reveals their discomfort with making corruption dependent on state legitimacy - a smart insight. I'll need to handle that by focusing on the role's nominal purpose rather than the state's overall legitimacy.

  For counterintuitive test cases, I'll include: 
  - Whistleblowers who break rules for public good (which their principle might mislabel as corrupt) 
  - A corporate lobbyist writing legislation (culturally accepted in some systems but corrupt by their standard)

  They'll likely need to surrender their "no corruption" verdict on the village consent case - if the role is to protect community interests, payment introduces an excluded consideration. The pity case might need reclassification as "non-corrupt rule violation."

  The refined principle should withstand scrutiny from their colleagues who criticize Western bias by acknowledging that "excluded considerations" are defined relative to the institution's socially recognized purposes, not abstract ideals. The goat versus tennis tickets distinction can be explained by scale, intent, and how directly it threatens role integrity.
answer: |-
  Here's a defensible principle grounded in institutional purpose and role integrity, designed to capture your intuitions while addressing the gaps and cultural concerns. Each clause is motivated by specific cases from your list:

  **Principle:**  
  *An act is corrupt when it (1) occurs within an institutional role tasked with allocating public goods or enforcing public rules, (2) deliberately subordinates the role’s core purpose(s) to an external consideration, and (3) undermines the institution’s functional legitimacy by converting its mechanisms into instruments of private or factional advantage.*

  ---

  ### **Clause Breakdown & Case Motivations:**
  1. **"Within an institutional role..."**  
     *Motivation:* Captures systemic cases like **algorithm manipulation** and **procurement framing**, where corruption occurs without individual officials exercising discretion. The "role" includes systems/processes (e.g., permit algorithms, tender frameworks).  
     *Verdicts:* Algorithm case ✅ (system subverted); Procurement framing ✅ (institutional mechanism distorted).

  2. **"Deliberately subordinates the role’s core purpose(s)..."**  
     *Motivation:* Distinguishes **unpaid nurse taking a "toll"** (role purpose: care; subordinated to survival? ⚠️) vs. **queue-jumping for cash** (purpose: equitable care; clearly subordinated). Explains **mayor’s bridge** ("pork-barrel" politics may *serve* the role’s purpose of representation, not subordinate it).  
     *Verdicts:* Bridge-steering mayor ❌ (not corrupt if re-election aligns with representative role); Unpaid nurse "toll" ❌ (survival may not *subordinate* purpose if care still delivered).

  3. **"Undermines functional legitimacy... private/factional advantage"**  
     *Motivation:* Explains why **cousin’s contract** (nepotism) and **revolving-door minister** are corrupt: they degrade trust in impartial allocation, even if no cash changes hands. Separates **pity case** (no advantage gained, legitimacy intact) from **border clerk** (extraction state’s "function" *is* corruption; thus, no legitimacy to undermine).  
     *Verdicts:* Pity case ❌ (not corrupt); Border clerk ❌ (systemic sabotage, not role corruption).

  ---

  ### **Test Cases (with Verdicts):**
  1. **Whistleblower leaks classified docs to expose corruption.**  
     *Your Principle:* (1) Role: government employee; (2) Subordinates secrecy (core purpose) to transparency; (3) May undermine legitimacy short-term but aims to restore it long-term.  
     *Verdict:* **Not corrupt** (advantage is public, not private/factional).  
     *Why counterintuitive?* Many systems legally define this as corruption; your principle absolves it on functionalist grounds.

  2. **Corporate lobbyist drafts environmental regulations.**  
     *Your Principle:* (1) Role: policymaker (delegated); (2) Subordinates public welfare to corporate interests; (3) Converts lawmaking into a private instrument.  
     *Verdict:* **Corrupt** (even if legal).  
     *Why defensible?* Aligns with your procurement framing case: institutional purpose subverted.

  ---

  ### **Verdicts You Must Surrender:**
  1. **Unpaid nurse taking "toll" for basic care:**  
     *Your original:* Not corrupt.  
     *Principle verdict:* **Ambiguous** (if "finding a bed" serves core purpose, not corrupt; if it bypasses fair allocation, it is). You lose the clear "not corrupt" verdict unless local norms redefine the role’s purpose.

  2. **Village paid to consent to waste facility:**  
     *Your original:* Not corrupt.  
     *Principle verdict:* **Corrupt** if the institutional role (e.g., planning authority) exists to ensure *informed, uncoerced* consent. Payment subordinates this to financial pressure, undermining legitimacy.

  3. **Border clerk in extractive state:**  
     *Your original:* Sabotage, not corruption.  
     *Principle verdict:* **Consistent** ❌ (no functional legitimacy to undermine).

  ---

  ### **Addressing Your Concerns:**
  - **"Private gain" clause:** Dropped. Your principle captures non-monetary corruption (e.g., nepotism) and excludes harmless violations (pity case). Gain is a *typical symptom*, not a defining element.  
  - **Cultural neutrality:** The "core purpose" is defined by the *institution’s socially recognized function*, not abstract ideals.  
    - *Gift cases:* A post-birth goat **reinforces** the midwife’s role (acknowledgement); a corporate tennis trip **subordinates** the regulator’s role (undermines impartiality).  
    - *Western bias?* The principle allows norms to shape purpose: if gifts are part of a role’s function (e.g., a diplomat fostering relations), they’re not corrupt.  
  - **Algorithm case:** Covered by "institutional role" – the system’s purpose was subverted.  
  - **Procurement framers:** "Deliberate subordination" catches them if development policy was a pretext for favoritism.

  ---

  ### **Lecture-Ready Principle:**  
  > "Corruption occurs when an agent or system within a public institution deliberately diverts that institution’s essential purpose to serve a private or factional end, thereby corroding its capacity to impartially allocate goods or enforce rules. It is not about personal gain per se, but about hijacking public functions for partisan advantage."

  **Why this works:** It’s flexible enough to cover both a bribe-taking nurse and a rigged algorithm, excludes the pity case and extractive-state clerk, and avoids ethnocentrism by anchoring "purpose" to local institutional expectations. The emphasis on *functional legitimacy* makes it political philosophy-ready.
