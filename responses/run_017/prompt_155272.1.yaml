prompt: |-
  ok so im on student council and we're rewriting the discipline code, and this kid on the committee who's taking a philosophy elective says we should scrap the whole list of rules and just judge every case by running the kids maxim thru the universal law formula, and he is being totally serious. I want to write something making fun of it for the school paper.

  Can you write me a parody page from the new student handbook, deadpan, around 500-600 words, plus a short "maxim intake form" that students have to fill out when they get written up? I want the jokes to come from the actual weak spots of the test, not from made-up ones: kids getting off by piling details into their maxim until it passes ("I may cut the lunch line when I skipped breakfast and its taco day and I have track at 4"), the gap between maxims that totally fall apart when everybody follows them and maxims that would still technically work but nobody would want to go to a school like that, and how the stuff Kant says we only have to do sometimes somehow becomes the stuff you can never get in trouble for skipping. Nobody in the piece should explain what's wrong with the view, just let it come out in the handbook's own voice. Start straight with the handbook page, no intro or commentary.
reasoning: |-
  Okay, the user is on the student council and wants to satirize a peer's proposal to replace their discipline code with Kant's universal law formula. They need a deadpan parody handbook page (500-600 words) and a maxim intake form that exposes real philosophical flaws through bureaucratic absurdity. 

  Hmm, the humor should stem from actual weaknesses in Kant's categorical imperative: loopholes via hyper-specific maxims, dystopian outcomes from technically universalizable rules, and Kant's inconsistent treatment of imperfect duties. The tone must stay dry—letting the handbook's earnest delivery highlight the absurdity without explicit criticism.

  First, the handbook section needs bureaucratic framing: rename "Violations" as "Maxim Submissions," replace punishments with "Categorical Review." For the jokes: 
  - Show kids escaping consequences by adding absurd conditions to their maxims ("borrowing" calculators during finals week becomes permissible if specifying "when mine has squirrel damage"). 
  - Demonstrate horrifying but "universalizable" scenarios (everyone shoving in hallways becoming "efficient transit"). 
  - Highlight Kant's imperfect duties loophole (never punishing skipped homework since benevolence isn't "always required").

  The intake form should be peak bureaucratic irony: forcing students to articulate their "maxim" with fields for increasingly ridiculous specifics. Bonus if the form itself contradicts universalizability by being mandatory. 

  Key phrasing notes: 
  - Use Kant jargon incorrectly ("non-contradiction in conception/will") 
  - Make administrators sound like confused philosophy TAs ("imperfect duty of benevolence waivers") 
  - Have "case precedents" that are transparently bad faith (tardiness excused via "maxim of arriving after second bell when muffins were fresh")

  Avoid explaining the satire. The handbook should genuinely believe this system is elegant, with the horror dawning on readers through examples. Word count target: ~550 words for handbook, one-page form.
