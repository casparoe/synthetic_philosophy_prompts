answer: |-
  Here are the core desiderata for any theory of knowledge-how, built from cases, ranked by non-negotiability, with tensions and theory evaluations. I take a functionalist stance: knowledge-how is defined by its role in generating successful, flexible action, not by its implementation (biological or artificial).

  ### Non-Negotiable Desiderata (Failure here invalidates the theory)
  1. **Articulation Gap**  
     *Requirement: Must distinguish between* successfully performing an action (e.g., a grandmaster playing chess intuitively) *and* being able to articulate the method (e.g., a novice who can recite rules but blunders).  
     *Why non-negotiable:* Pervasive in human expertise (e.g., cyclists who can’t explain physics). If a theory conflates performance and articulation, it cannot capture unconscious competence.

  2. **Productivity**  
     *Requirement:* Must explain how agents can perform *novel actions* (e.g., escaping a unique burning building) without prior practice.  
     *Why non-negotiable:* Central to intelligence. If a theory cannot handle unseen scenarios, it reduces knowledge-how to rote repetition (e.g., RL agents failing outside training distribution).

  3. **Distributed Knowledge**  
     *Requirement:* Must allow that a *group* (e.g., a surgical team) can know how to perform a task *without any single member* possessing full knowledge.  
     *Why non-negotiable:* Collective actions are ubiquitous. Individualistic theories (e.g., pure dispositionalism) fail this.

  ### Negotiable but Important Desiderata
  4. **Counterfactual Robustness**  
     *Requirement:* Must distinguish *lucky success* (e.g., randomly pressing buttons to defuse a bomb) from knowledge-how, which succeeds across *perturbed conditions* (e.g., noise, obstacles).  
     *Status:* Strong preference (nearly non-negotiable). Lacks universality—e.g., a rusty pianist retains knowledge-how but may fail under pressure.

  5. **Gradability & Attrition**  
     *Requirement:* Must accommodate *degrees* of knowledge-how (e.g., novice vs. expert cyclist) and *gradual loss* (e.g., forgetting muscle memory after injury).  
     *Status:* Preference. Gradability is evident, but a theory may explain it derivatively (e.g., via component skills decaying).

  6. **Retention Without Ability**  
     *Requirement:* Must allow agents to *retain knowledge-how* while *losing the ability* (e.g., a paralyzed dancer who "knows" a routine but can’t execute it).  
     *Status:* Preference. Contested (some argue loss of ability entails loss of knowledge-how), but empirically plausible.

  ---

  ### **Tensions and Incompatibilities**  
  - **Fatal Tension: Productivity vs. Present Ability.**  
    Productivity demands *generative capacity* for novel actions, while "present ability" (e.g., in dispositional views) ties knowledge-how to *current* performance. These conflict: a paralyzed dancer retains productivity (can instruct others) but lacks present ability.  
    **Verdict: Drop present ability.** Knowledge-how is a *structural capacity* (e.g., cognitive/motor schemas), not a disposition to act. Ability is a consequence, not constitutive.  

  - **Minor Tension: Articulation vs. Robust Unconscious Competence.**  
    Requiring agent-accessible articulation (e.g., intellectualism) clashes with cases where experts perform flawlessly but can’t explain their actions.  
    **Verdict: Weak articulation suffices.** Agents need only *in-principle* articulability (e.g., the method is encoded and inferable, even if not conscious).  

  - **Clash in Distributed Cases:**  
    Individual knowledge-that (e.g., "S knows *that* step X is done") fails to explain *emergent* group knowledge-how.  

  ---

  ### **Theory Evaluation Against Desiderata**  
  1. **Intellectualism (Knowledge-How as Knowledge-That)**  
     - ✅ **Articulation Gap:** Excels (knowledge-that is inherently articulable).  
     - ✅ **Productivity:** Strong (propositional reasoning supports novelty).  
     - ❌ **Distributed Knowledge:** Fails (group knowledge-how isn’t reducible to summed knowledge-that).  
     - ❌ **Gradability:** Poor (propositions are binary; can’t explain skill degrees).  
     - ⚠️ **Counterfactual Robustness:** Mixed (depends on reasoning quality).  
     *Verdict:* Overly rigid. Fails distributed and gradable cases.  

  2. **Ability/Dispositionalism (Knowledge-How as Ability to Act)**  
     - ✅ **Counterfactual Robustness:** Strong (dispositions cover perturbations).  
     - ❌ **Productivity:** Fails (novel actions require more than dispositions).  
     - ❌ **Retention Without Ability:** Fails (if ability lost, knowledge-how lost).  
     - ❌ **Distributed Knowledge:** Fails (no group "disposition").  
     *Verdict:* Fatally flawed. Collapses knowledge-how to performance.  

  3. **Hybrid Skill-Capacity View (My Position)**  
     Knowledge-how is *embodied, generative procedural schemas* (e.g., control policies, cognitive maps) that:  
     - ✅ **Productivity:** Schemas compose for novel actions (e.g., LLMs generating new sentences).  
     - ✅ **Articulation Gap:** Schemas are sub-symbolic (no need for conscious access; in-principle inspectable).  
     - ✅ **Distributed Knowledge:** Group schemas emerge from networked components (e.g., robot swarms).  
     - ✅ **Gradability & Attrition:** Schemas degrade with component damage (e.g., neural decay).  
     - ✅ **Retention Without Ability:** Schemas persist (e.g., dormant policy in a deactivated robot).  
     - ✅ **Counterfactual Robustness:** Built-in via generalization (e.g., simulation-trained transfer).  
     *Verdict:* Best fit. Treats knowledge-how as functional architecture enabling flexible action.  

  ---

  ### **Application to Artificial Systems**  
  - A chess engine *knows how* to play if its policy generalizes to novel board states (productivity) and its search/valuation functions are inspectable (weak articulation).  
  - An LLM *knows how* to defuse conversations if it adapts to unseen conflicts (counterfactual robustness) *and* its method is encoded in parameters (schema retention).  
  - **Phenomenology is irrelevant:** Knowledge-how is about *operational competence*, not subjective experience.  

  **Non-negotiable core:** Productivity + Articulation Gap + Distributed Knowledge. Drop present ability—it confuses *having* knowledge-how with *exercising* it.
