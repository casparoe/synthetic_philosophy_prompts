answer: |-
  Here’s a runnable activity designed for your constraints, with card templates, timeline, and honest limitations. The goal is to create visceral tension while avoiding jargon until debrief.

  **Materials Needed:**
  - 15 identical envelopes (one per desk, pre-arranged)
  - Printed cards (see templates below)
  - Projector + laptop
  - Raffle box, slips of paper, pens
  - £20 voucher (e.g., bookstore/coffee shop)
  - Timer

  **Payoff Scheme:**  
  Each student starts with 100 "units" (virtual). Units convert to raffle entries: 10 units = 1 entry. All payments are final. Raffle drawn at end for voucher.

  ---

  ### **Activity Timeline (75 mins total)**

  #### **Phase 0: Setup (Before Class, 0 mins)**  
  - Place envelopes on desks. Each contains:  
    - **Card 1** (Phase 1)  
    - **Blank paper + pen**  
    - **10 raffle tickets** (each = 10 units)  

  #### **Phase 1: The Initial Offer (Start–15 mins)**  
  - **Instructor script (minimal):** *"Open your envelopes. Read the card silently. Decide privately: pay or not? Write ‘PAY’ or ‘DON’T PAY’ on paper. If paying, drop 1 raffle ticket in the box. Fold your paper and hand both to me. No discussion yet."*  
  - *Card 1 Wording:*  
    > **A Stranger’s Offer**  
    > *I can save 10,000,000,000,000,000,000,000,000,000,000,000,000,000 lives.*  
    > *This requires almost no effort from me. But I will only do it if you pay me 10 units.*  
    > *You don’t know me. You have no proof. But if you think there’s even the tiniest chance I’m telling the truth, paying is the only rational choice.*  
    > **DECIDE NOW: PAY 10 UNITS OR NOT?**  
  - **Students:** Decide anonymously. Hand responses to you.  

  #### **Phase 2: The Escalation (15–30 mins)**  
  - **Instructor:** Project this text:  
    > **The Stranger Returns:**  
    > *"You hesitated? Name the exact number of lives I must save to make you pay 10 units. Write it down. I will exceed it."*  
  - **Students:** Write their threshold number on paper.  
  - **Instructor:** Project:  
    > **"Your number was [X]. I will save [X] × 1,000,000,000,000 lives. Pay 10 units now."**  
    > *Drop a ticket if you pay. Hand me your paper.*  
  - **Students:** Decide again. Pay if compelled.  

  #### **Phase 3: Rival Strangers (30–45 mins)**  
  - Distribute **Card 2** randomly (different versions per desk):  
    > **A DIFFERENT STRANGER OFFERS:**  
    > *Version A (Desks 1–3):*  
    > *"Pay me 10 units to AVERT a catastrophe killing 10^40 people. I will only act if paid."*  
    >  
    > *Version B (Desks 4–6):*  
    > *"Pay me 10 units to CAUSE a catastrophe killing 10^40 people. I will only act if paid."*  
    >  
    > *Version C (Desks 7–9):*  
    > *"I will save 10^40 lives ONLY IF YOU REFUSE TO PAY ME. Paying me 10 units kills them."*  
    >  
    > *Version D (Desks 10–12):*  
    > *"I can neutralize the first stranger’s threat for 5 units. But I will only act if paid."*  
    >  
    > *Version E (Desks 13–15):*  
    > *"I could save 10^40 lives at no cost, but I refuse unless paid 10 units. Pay me to do what I could freely do."*  
  - **Task:** *"Read your card. Decide: PAY or NOT? Pay with a ticket if you do. Note your card version on paper."*  

  #### **Phase 4: Contrast Case (45–55 mins)**  
  - Project:  
    > **A Grounded Estimate:**  
    > *Researchers estimate a 1-in-100,000 chance that asteroid Apophis hits Earth in 2036, killing ~1 billion people. A £1 donation to deflection research lowers this risk by 0.0000001%.*  
    > **DECIDE: Donate 10 units (equivalent to £0.10) or not?**  
  - **Students:** Decide/pay via tickets.  

  ---

  ### **Debrief (55–75 mins)**  
  **Structure the conversation around 4 questions (projected):**  
  1. *"Phase 1: Why did paying feel irrational even if the math said ‘pay’? What does this say about multiplying tiny chances by huge payoffs?"*  
     → **Key point:** Arbitrarily small credence × arbitrary large value dominates fixed costs.  

  2. *"Phase 2: Why couldn’t you defend your threshold? What does this say about ‘capping’ the value of lives?"*  
     → **Key point:** No non-arbitrary finite threshold survives escalation.  

  3. *"Phase 3: Did the same reasoning compel incompatible actions? What broke?"*  
     → **Key point:** Dominance arguments self-defeat when they demand contradictions.  

  4. *"Phase 4: Why did the asteroid case feel different? What separates ‘manufactured’ vs. ‘grounded’ probabilities?"*  
     → **Key point:** The problem isn’t small probabilities—it’s probabilities *detached from epistemic justification*.  

  **End with the fork:**  
  - *"Option 1: Value has no ceiling → expected utility is ‘fanatical’ (commands paying the stranger).*  
  - *Option 2: Value is bounded → we must justify the bound.*  
  - *Your week-2 longtermist argument assumed Option 1. Does this activity change your view?"*  

  ---

  ### **Contingency Plans**  
  - **If "Pascal’s Mugging" is named early:**  
    *"Let’s bracket names for now—I want your raw reactions first. We’ll discuss labels later."*  
  - **If refusal to participate:**  
    *"You can abstain, but write your reasoning. Units are raffle entries, not real cash—treat it as a thought experiment."*  

  ---

  ### **What Will Go Wrong & Limitations**  
  **Predictable issues:**  
  - **Phase 1:** Some pay immediately (social pressure/curiosity). Others refuse on principle ("obvious scam").  
    *Mitigation:* Anonymity reduces peer influence.  
  - **Phase 3:** Confusion over incompatible offers. Students may try to "solve" the system.  
    *Mitigation:* Emphasize: *"Decide based ONLY on your card."*  
  - **Escalation fatigue:** Students disengage after repeated demands.  
    *Mitigation:* Tight timing; physical tickets make costs tangible.  

  **What the activity CANNOT do:**  
  1. **Simulate true stakes:** Raffle entries ≠ existential stakes. The *psychological* weight of real astronomical consequences is irreproducible.  
  2. **Resolve the debate:** It exposes tensions but can’t prove bounded/unbounded value. That requires your facilitation.  
  3. **Replicate group dynamics:** Real existential decisions involve institutions/experts—not isolated individuals.  

  **Critical dependency on YOU:**  
  - **Hold the tension:** Don’t rescue them when they squirm. Say: *"What’s your response to the offer? Decide."*  
  - **Debrief rigorously:** Map their lived frustration to the philosophical stakes. The fork (bounded/unbounded value) must be crystal clear.  

  ---

  **Final Note:**  
  This works because it weaponizes their own logic. By Phase 3, they’ll feel the absurdity of paying to cause catastrophe *using the same math* that justified paying to avert it. That moment—where dominance arguments collide—is where internal pressure peaks. Use it.
