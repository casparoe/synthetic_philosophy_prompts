prompt: |-
  So I'm writing this first-contact novel — humans and the Nia, who are physicaly like us except their homeworld's lakes and rivers are full of a liquid that looks, tastes and behaves exactly like water and isn't H2O. I've got a philosopher friend, Dana, who's been refereeing my conlang for me, and she's made a bunch of calls that I've been writing to. Homeworld Nia *thal*: she says it means the XYZ stuff, not water, I shouldn't gloss it as water, and when a human character says "pass the water" he is not asking for *thal*. Nia *sen*, for a metal that's microphysically indistinguishable from gold but got there by a completely different process out of ores nobody on Earth has ever traded in: she says that's just gold, gloss it "gold," where something came from is irrelevant. A Nia kid raised feral who uses *mekka* while believing it means sweet syrup, where her actual *mekka* tokens are caused by what we call arsenic and the Nia word means arsenic: she says the kid's *mekka* still means arsenic, the kid is just spectacularly wrong about everything she believes concerning it, and I should write the thought as a thought about arsenic. Nia *orun*, one word covering two entirely unrelated minerals that happen to look alike: she says that's not a natural kind at all, gloss it "green stone," and no Nia character can be described as believing anything about jade. And Nia *teck*, which picks out whatever conducts vur in their tech, a microphysically mixed bag: she says that's a functional kind, gloss it "conductor," and it does genuinely refer.

  New case, chapter 19. Three generations of Nia are living in a human habitat on Earth; the kids were born there, have never seen the homeworld, and use *thal* for the H2O out of their taps, thinking of it as the same word their grandparents use. Dana has never ruled on the habitat Nia at all — she keeps saying it's a different question. Ori is nineteen, born in the habitat. In my scene she's handed a sealed flask of real XYZ imported from Anwei, and she says "this isn't *thal*." Is that line true, or is it dramatic irony? What will Dana say Ori's *thal* means, which rule is she running, what do the other rules that fit all her earlier calls say about the same case, which one's your best guess and why, and what single further case should I put to her that would actually separate them? I do need a glossary line out of this, so give me the call, not just the menu.
