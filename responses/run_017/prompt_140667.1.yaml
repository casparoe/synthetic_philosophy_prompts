answer: |-
  ### Final Examination Question: Formal Epistemology  
  **Time Allowed:** 45 minutes  
  **Total Marks:** 25  

  **Question:**  
  In lecture, we discussed the **Coarsest-Cell Principle (CCP)** for updating on uncertain evidence:  
  > *When an experience leaves you uncertain of a proposition, apply Jeffrey conditionalization to the coarsest partition of your algebra whose cells the experience discriminates (i.e., the partition generated by the proposition whose probability shifted), holding fixed your prior probabilities conditional on those cells (rigidity).*  

  Test this principle against **two cases**:  
  1. **Direct Evidence Case**: A cloth is examined under poor lighting. You become 0.8 confident it is green (G) rather than blue (¬G). The experience is *about* the color itself.  
  2. **Channel Reliability Case**: A lab test (reliability unknown) reports "positive" for a rare disease. The test’s accuracy may be correlated with whether the disease is present (e.g., false positives increase when the disease is rare).  

  **Tasks:**  
  (a) For each case, determine whether CCP prescribes a rational update. Justify rigorously.  
  (b) Explain what work *rigidity* does in each case and what conditions an evidential partition must satisfy for rigidity to hold.  
  (c) Discuss whether CCP needs *supplementation*, *restriction*, or *replacement* by strict conditioning in a richer algebra.  
  (d) Explain why constraining *only* the new probability of a single proposition (e.g., P<sub>new</sub>(G) = 0.8) fails to determine a unique update. What does this underdetermination show about the "problem of uncertain evidence"?  

  ---  
  ### Model Answer (≈700 words)  
  **(a) Case Analysis**  
  **Direct Evidence Case (Cloth Color):**  
  CCP *correctly* prescribes the update. The experience directly shifts confidence in *G* (green), generating the coarsest partition {G, ¬G}. Rigidity requires that conditional probabilities *given G* or *given ¬G* (e.g., P(H|G) for other hypotheses H) remain unchanged. This holds because the poor lighting affects *only* your confidence in color, not your beliefs about dependencies between color and other propositions. For example, if you previously believed green cloths are likelier to be woolen (P(W|G) = 0.7), this relationship persists post-update. Jeffrey conditionalization on {G, ¬G} with P<sub>new</sub>(G) = 0.8 is thus valid.  

  **Channel Reliability Case (Lab Test):**  
  CCP *fails*. The report shifts P(Positive) but the coarsest partition {Positive, Negative} is *inadmissible* for rigidity. The test’s reliability (e.g., P(Positive|Disease) = *r*) may correlate with the disease state (D). For instance, if the lab is less accurate when the disease is rare, P(Positive|D) and P(D) are entangled. Rigidity over {Positive, Negative} demands fixed P(H|Positive) for all H, but if reliability depends on D, then P(H|Positive) *cannot* be prior-conditional on Positive alone—it depends on unstated background factors (e.g., disease prevalence). Updating via CCP here ignores correlation between the channel’s reliability and the hypothesis, risking irrational belief shifts.  

  **(b) Role of Rigidity & Partition Legitimacy**  
  Rigidity ensures that *within* each partition cell, your beliefs evolve only via probability reallocation *across* cells, not within them. It preserves "inferential relationships" conditional on the evidence.  
  - **Direct Case**: Rigidity holds because the partition {G, ¬G} isolates the *only* variable (color perception) affected by lighting.  
  - **Channel Case**: Rigidity fails because the partition {Positive, Negative} does *not* account for the test’s reliability parameters, which covary with D. For rigidity to be legitimate, the partition must satisfy:  
    > **Screening Off**: The experience must fix probabilities *only* by shifting credences in partition cells, with no further correlation between cells and other propositions.  
  Here, the test’s reliability breaches screening off, invalidating rigidity.  

  **(c) Status of CCP**  
  CCP requires **restriction**: It works only when the evidence directly discriminates partition cells *without* hidden correlations (as in the cloth case). In channel cases, it must be replaced by **strict conditioning in a richer algebra**. For example, expand the algebra to include reliability variables (e.g., Accuracy = High/Low), then condition on the conjunction *Positive & (Accuracy = High)*. This enforces rigidity on a finer partition {D & Accurate, D & Inaccurate, ...}, avoiding spurious dependencies. Without this, CCP risks belief distortion.  

  **(d) Underdetermination & the "Problem" of Uncertain Evidence**  
  Constraining *only* P<sub>new</sub>(G) = 0.8 fails to determine a unique update because infinitely many joint reallocations of probability mass can yield this marginal shift. For example:  
  - Mass can be shifted from ¬G to G uniformly (as CCP assumes), or  
  - Non-uniformly (e.g., only from blue-wool to green-cotton but not blue-cotton).  
  This violates rigidity unless conditionals are preserved.  

  The underdetermination shows the "problem of uncertain evidence" is **ill-posed without additional structure**. Evidence doesn’t merely shift a single probability; it imposes constraints on how *relationships* between propositions change. CCP resolves this by demanding rigidity on a partition, but its adequacy depends on whether that partition screens off all dependencies. If not (as in channel cases), uncertain evidence *cannot* be modeled by shifting one probability alone—it requires modeling the evidence-generating *process*. Thus, there is no general "rule" for uncertain evidence; rationality depends on correctly identifying the causal structure of the experience.  

  ---  
  ### Marking Scheme (25 points)  
  | **Must-Hit Points**                     | **Marks** | **Common Errors** |  
  |-----------------------------------------|-----------|-------------------|  
  | **1. Correct CCP verdict for both cases with justification** <br> (Cloth: valid; Channel: invalid) | 5 | Swapping verdicts; missing correlation in channel case. |  
  | **2. Rigidity’s role explained + legitimacy conditions** <br> (Screening off; conditional invariance) | 5 | Vague rigidity description; omitting screening-off requirement. |  
  | **3. Treatment recommendation for CCP** <br> (Restrict to direct cases; replace with strict conditioning in richer algebra for channels) | 5 | Suggesting "supplements" without fixing core issue; not mentioning algebra expansion. |  
  | **4. Underdetermination explanation** <br> (P<sub>new</sub>(G)=0.8 alone allows infinitely many updates; rigidity resolves via partitions) | 5 | Only noting "multiple solutions" without examples; missing rigidity’s role. |  
  | **5. Insight on uncertain evidence** <br> (Not a standalone problem; needs causal structure of evidence) | 5 | Treating it as universally solvable; no link to underdetermination. |  

  ### A vs. B Answer Differentiation  
  - **A Answer**: Explicitly explains why constraining *one proposition’s probability* (e.g., P<sub>new</sub>(G)) underdetermines the update (point 4), and connects this to the *non-existence* of a general uncertain-evidence rule without structural assumptions (point 5).  
  - **B Answer**: Correctly resolves both cases (points 1–3) but misses the *significance* of underdetermination (points 4–5), e.g., stating "many updates are possible" without showing why this challenges the problem’s coherence.  

  ---  
  **Rationale**: This question forces students to critique CCP’s *scope* rather than apply it, using rigidity and partition choice as litmus tests. The A/B hinge targets advanced insight: recognizing that uncertain evidence isn’t a technical "gap" to fill but a call for deeper modeling of evidence sources.
