prompt: |-
  Hi — I work on a small modelling team at a public health agency (wont name it) and we maintain four competing transmission models for the same disease: they disagree about things like how much transmission is asymptomatic, how fast immunity wanes, and whether contact rates are age-structured or not. Twice a year we have to write a "model comparison statement" that says, in so many words, which of them is closest to the truth about how this disease actually spreads, and that statement decides which model feeds into capacity planning for the coming season and which team gets its funding renewed. I've got about half a day to write it, it gets signed off by a senior epidemiologist who has never done any philosophy and will not tolerate jargon, and it has to survive being read both by external critics and by whichever modelling team just lost. Right now we basically rank by fit to last season's surveillance data plus how much people like the model, and everyone on the team knows that isn't the same thing as being closer to the truth — but we've never had a way to say what is.

  A philosopher friend mentioned over dinner that there's a literature on this under the name verisimilitude or truthlikeness, and I've been reading around the edges since. What I've pieced together (correct me in one line if I've got this wrong, then carry on) is that the obvious definition — a theory is closer to the truth when it has more true consequences and no more false ones — collapses: there's apparently a result to the effect that on that definition a false theory can never be closer to the truth than another one, which is useless to us because all four of our models are definitely false in some respects, they're all simplifications. And there seem to be three rough families of repair: ones that count content (how much truth, how much falsity), ones that measure some kind of similarity or distance between what the theory says and how the world actually is across a space of possibilities, and ones that go via expected evidence or likelihood. Plus something that worries me more: the ranking seems to depend on how you carve up the space of possible states of the world, so that if you redescribe the possibilities more finely the ordering can flip — it smells like the same kind of language-dependence trick as the grue business in induction, and I don't want to build a procedure that silently depends on a choice of vocabulary nobody wrote down.

  So: please turn whatever is actually usable here into a written procedure my team can run, in British English, and please don't give me citations or a reading list — I can't get hold of the papers and I need something I can apply, not something I can follow up. Concretely I want: a step that forces us to declare up front what the target is and at what grain (which quantities, over what population and time window, at what resolution — e.g. seasonal totals versus weekly age-stratified incidence), because I suspect most of our arguments are really about that; a rule for separating "got the causal structure right" from "got the numerical value right" when a theory is partly right in each way; an actual comparison rule for two theories we already know to be false, given that the naive one collapses, including the conditions under which the correct output is "these cannot be ranked"; a sensitivity check that re-runs the comparison one step finer and one step coarser on the partition and reports whether the ordering holds; explicit flags at the points where someone has to make a judgment call rather than follow a rule (weights, which distinctions count as relevant, how much falsity in an irrelevant corner of the space is worth tolerating) with a note on who should sign off on those; and an explicit warning step about not letting "closer to the truth" quietly become "fit last season's data best" or "most useful for the planning decision". Then run the whole thing on three cases: (i) Model A has the waning-immunity rate about right but omits asymptomatic transmission entirely, while Model B includes asymptomatic transmission with a badly wrong rate; (ii) two models that agree on coarse quantities — size and timing of the seasonal peak, total burden — but disagree about the fine-grained story of who infects whom, where I need a ranking at the finer grain; (iii) our team's favourite model, the one that fit last year's data best and that two people have built careers on, against a rival — and I specifically want at least one case where the honest output is unwelcome, either the favourite loses or the procedure refuses to rank them. Finish by saying plainly what the procedure cannot do. Somewhere around 1000–1300 words would be ideal.
reasoning: |-
  Okay, let me tackle this complex request from a public health modeller. The user needs a practical, jargon-free procedure to compare four disease transmission models twice a year, with high-stakes consequences for funding and policy. They've encountered philosophical concepts like verisimilitude but need something operational. 

  First, I need to unpack their core concerns: 
  - All models are simplifications (false in some aspects)
  - Current ranking mixes data fit with popularity
  - Need to separate "causal structure" from "parameter accuracy"
  - Avoid language-dependence traps
  - Must withstand scrutiny from critics and losing teams

  The philosophical problem they referenced (Popper's verisimilitude collapse) is real but manageable. The key insight is that we can define "closer to truth" operationally by:
  1. Explicitly declaring the target outcomes
  2. Separating structural accuracy from parameter precision
  3. Using weighted importance scoring
  4. Building in sensitivity checks

  For the procedure, I'll structure it as:
  - Phase 0: Mandatory declaration of evaluation scope
  - Phase 1: Structural assessment (causal map accuracy)
  - Phase 2: Parameter assessment (distance metrics)
  - Phase 3: Combined scoring with explicit weights
  - Phase 4: Sensitivity and robustness checks

  The three test cases are cleverly chosen to stress-test the method. Case (i) will reveal our handling of structural omission vs parameter error. Case (ii) tests resolution depth. Case (iii) forces confrontation with institutional bias. 

  I'm particularly mindful of their warning about "scope creep" where truth proximity gets conflated with data fit or usefulness. The procedure must flag these explicitly. Also crucial is the "cannot rank" outcome - sometimes that's the most scientific answer.

  The word count is tight for this complexity, but I'll prioritize clarity over comprehensiveness. British English phrasing will include "whilst" and "kerb" where natural, but avoid idioms. No citations - they explicitly don't want them.

  Most importantly, the output must feel actionable tomorrow by time-pressed epidemiologists who "will not tolerate jargon".
answer: |-
  ## Model Comparison Procedure: Assessing Verisimilitude for Public Health Planning

  **Purpose:** To systematically determine which competing disease transmission model is "closer to the truth" about disease spread dynamics for the purpose of informing capacity planning and funding decisions. This procedure explicitly recognises all models are simplifications and avoids conflating truthlikeness with goodness-of-fit to past data alone or perceived usefulness.

  **Phase 0: Define the Target "Truth" (Mandatory First Step)**
  *   **Action:** Before comparing models, the team **must** explicitly define and document the specific aspects of "truth" relevant to the *next season's planning needs*. This is the single most critical step.
  *   **Specify:**
      *   **Quantities:** Which outputs define "truth"? (e.g., peak incidence magnitude, timing of peak, total hospitalisations, cumulative cases, age-stratified attack rates, critical care burden duration).
      *   **Population & Geography:** Which population(s) and geographic area(s) are relevant? (e.g., national, regional, specific age bands).
      *   **Temporal Scope & Resolution:** Over what time window and at what resolution must the model capture truth? (e.g., weekly incidence over a 6-month season, daily during peak weeks, monthly averages).
      *   **Causal Processes:** Are specific causal mechanisms deemed *essential* to capture correctly for planning trust? (e.g., role of asymptomatic transmission for targeted testing, waning immunity for booster timing, age-mixing for school interventions). *Flag: Judgment Call.*
  *   **Output:** A signed statement: "For the [Season/Year] planning cycle, model verisimilitude will be assessed based on accuracy regarding [List Quantities] for [Population] over [Time Window] at [Resolution]. The following causal mechanisms are considered essential: [List Mechanisms]."
  *   **Sign-off:** Senior Epidemiologist (SE), informed by planning team needs. *Avoids arguments shifting goalposts.*

  **Phase 1: Assess Structural Verisimilitude (Causal Map)**
  *   **Action:** Evaluate how well each model's *fundamental structure* represents known or strongly believed causal relationships in the real disease system, based on current biological/epidemiological knowledge *unrelated to last season's specific fit*.
  *   **Method:**
      1.  **List Key Mechanisms:** Based on Phase 0 and general knowledge, list core mechanisms (e.g., existence of asymptomatic transmission, waning immunity structure, age-structured contact, seasonality driver, hospitalisation risk factors).
      2.  **Score Mechanism Presence & Plausibility (0-2):**
          *   `2`: Mechanism included and structure aligns strongly with evidence (e.g., immunity wanes gradually via a well-justified function).
          *   `1`: Mechanism included but structure is simplistic or weakly justified (e.g., fixed-rate waning without evidence for rate).
          *   `0`: Mechanism omitted entirely *or* included in a way contradicting strong evidence (e.g., no asymptomatic transmission *or* claims asymptomatic are *more* infectious than symptomatic without evidence).
      3.  **Flag Mechanisms:** Mark mechanisms identified in Phase 0 as "essential".
  *   **Output:** Per Model: Score per mechanism, Total Structural Score (sum), Count of essential mechanisms scored `2`, `1`, `0`. *Flag: Scoring plausibility is a Judgment Call.*
  *   **Sign-off:** Modelling Team Lead + SE (relying on expert consensus on biological plausibility).

  **Phase 2: Assess Parametric Verisimilitude (Numerical Accuracy)**
  *   **Action:** Evaluate how accurately each model's parameters (or derived outputs) reflect the best available current estimates of *true values* for the quantities defined in Phase 0. **Crucially, this uses *current knowledge*, not fit to last season's data.** Use sources like meta-analyses, high-quality recent studies, or established surveillance baselines.
  *   **Method:**
      1.  **Define Target Values:** For key parameters/outputs relevant to Phase 0 quantities (e.g., asymptomatic proportion, mean waning rate, age-specific contact matrices, hospitalisation rate by age), establish the best estimate and a plausible uncertainty range (e.g., 95% CI) from evidence.
      2.  **Calculate Distance:** For each parameter/output:
          *   If model provides a point estimate: Calculate normalised distance to target: `|Model Value - Target Value| / (Upper CI - Lower CI)`. (Avoids unit dependence).
          *   If model provides distribution: Calculate overlap with target uncertainty distribution (e.g., proportional overlap area). *Flag: Choice of distance metric is a Judgment Call.*
      3.  **Weight & Summarise:** Assign weights to each parameter/output based on its perceived importance for the Phase 0 truth definition and planning relevance. Calculate a weighted average distance score. *Flag: Weight assignment is a Judgment Call.*
  *   **Output:** Per Model: Per-parameter distance/overlap, Weighted Average Parametric Distance Score. List of weights used.

  **Phase 3: Combined Verisimilitude Ranking**
  *   **Action:** Synthesise structural and parametric assessments.
  *   **Method:**
      1.  **Essential Structure Check:** Any model scoring `0` on a mechanism flagged as "essential" in Phase 0 is automatically ranked lower than models scoring `1` or `2` on all essentials. *If multiple models fail essentials, rank them lower jointly.*
      2.  **Comparative Assessment (If essentials passed):**
          *   **Rule 1 (Strong Structural Dominance):** If Model A has a significantly higher Structural Score (e.g., >20% difference) *and* an equal or better (lower) Parametric Distance Score than Model B, then A > B (closer to truth).
          *   **Rule 2 (Strong Parametric Dominance):** If Model A has a significantly better (lower) Parametric Distance Score (e.g., >20% difference) *and* an equal or better Structural Score than Model B, then A > B.
          *   **Rule 3 (Trade-offs):** If one model is better structurally and the other parametrically:
              *   *If* structural lead involves essential mechanisms or large score gaps, priority *may* lean towards structure.
              *   *If* parametric lead is very large and involves critical Phase 0 quantities, priority *may* lean towards parameters.
              *   **Otherwise, output "Cannot Rank: Trade-off between structural plausibility and parameter accuracy. Both models capture different aspects of truth."** *Flag: Leaning in trade-offs is a Judgment Call.*
          *   **Rule 4 (Negligible Difference):** If differences in both Structural Score and Parametric Distance are small (e.g., <10%), output "Cannot Rank: Models are approximately equally truthlike for the defined targets."
  *   **Output:** A ranked list or "Cannot Rank" statement with clear justification referencing Phase 1 & 2 results.

  **Phase 4: Sensitivity & Robustness Checks**
  *   **Action:** Test if the ranking depends critically on arbitrary choices.
  *   **Method:**
      1.  **Grain Sensitivity:**
          *   **Coarser:** Re-run Phase 0/1/2 combining some quantities (e.g., total cases instead of age-stratified) or simplifying mechanisms (e.g., "waning exists" = `2`, ignoring rate structure). Report if ranking changes.
          *   **Finer:** Re-run Phase 0/1/2 adding one finer-grained element (e.g., specific age-band contact differences, regional variation). Report if ranking changes.
      2.  **Weight/Scoring Sensitivity:** Vary judgment-based weights or plausibility scores within reasonable bounds. Report if ranking changes.
  *   **Output:** Statement: "Ranking is [Stable/Unstable] under grain/resolution changes from [Coarse Test] to [Fine Test]. Ranking is [Stable/Unstable] under plausible variations in weights/scoring."

  **Critical Warning Step:**
  *   **Action:** Explicitly state before finalising the report:
      *   "`Closer to the truth` as assessed here (verisimilitude) is defined solely by alignment with current biological/epidemiological knowledge and evidence for the targets specified in Phase 0. It is **not equivalent to**:
          *   `Goodness-of-fit to last season's surveillance data.` (A model can fit past noise well but be structurally wrong).
          *   `Perceived usefulness for the immediate planning decision.` (A simpler, less truthlike model might be more practical, but that is a separate consideration).
          *   `Mathematical elegance or technical sophistication.`
      *   Funding/planning decisions *may* rightly incorporate factors beyond verisimilitude (e.g., model speed, usability, communication value), but these must be justified separately and not conflated with truthlikeness."

  ---

  **Application to Test Cases**

  **(i) Model A (Right Waning, Omits Asymptomatic) vs. Model B (Wrong Asymptomatic Rate, Includes It)**
  *   **Phase 0:** Assume "Existence & Impact of Asymptomatic Transmission" is declared an *essential* mechanism for planning (e.g., testing strategy depends on it).
  *   **Phase 1:** A: Scores `0` on Asymptomatic (omitted - essential). B: Scores `1` (included but rate wrong). A fails Essential Structure Check.
  *   **Ranking:** **Model B > Model A.** Even though B's rate is wrong, it captures the essential causal structure that A entirely misses. Verdict: Unwelcome if team favours A, but procedure forces it.

  **(ii) Models Agree on Coarse, Disagree on Fine (Who Infects Whom)**
  *   **Phase 0:** *Must* declare if fine-grained transmission pathways (e.g., age-specific infection matrices, household vs. community) are part of the "truth" target for this planning cycle (e.g., for targeted NPIs).
  *   **Scenario A (Fine not essential):** Phase 1: Both score similarly on declared essentials (e.g., overall Reff, peak timing mechanism). Phase 2: Parametric scores similar on coarse outputs. **Output: "Cannot Rank: Models equally truthlike for defined coarse targets."**
  *   **Scenario B (Fine essential):** Phase 1: Compare structure plausibility of their contact matrices (e.g., does one match known social mixing data better?). Phase 2: Compare parametric distance of their predicted age-stratified attack rates to evidence. Apply Rules 1-4 to the *fine-grained* scores. **Output:** A ranking based on fine-grained structure/parameter accuracy *if* a clear dominance or trade-off decision is reached, otherwise "Cannot Rank".

  **(iii) Favourite (Good past fit, Careers) vs. Rival**
  *   **Phase 0:** Defined rigorously (e.g., include waning immunity as essential).
  *   **Phase 1:** Favourite: Scores `1` on waning (simple fixed rate, plausible but not ideal). Rival: Scores `2` (complex, evidence-based waning structure). Rival has better structural score.
  *   **Phase 2:** Favourite: Excellent parametric match to *last year's data* but poor match to *current evidence* on waning rate from meta-analysis. Rival: Good match to current waning evidence. Favourite has worse (higher) parametric distance score.
  *   **Phase 3:** Rival has better Structure (`2` vs `1`) *and* better Parametrics (lower distance). **Rule 1: Rival > Favourite.** Verdict: Unwelcome, but procedure output is clear. Sensitivity checks would likely confirm (finer grain on waning mechanism makes rival look better; coarser might hide the difference). *The warning step prevents reverting to "but it fit last year best!".*

  ---

  **What This Procedure Cannot Do**

  1.  **Define Absolute Truth:** It assesses *relative* truthlikeness for *operationally defined* targets. It cannot pronounce a model "true".
  2.  **Eliminate Judgment:** Key steps (essential mechanisms, plausibility scoring, weights, trade-off leaning) require expert judgment. Transparency is crucial.
  3.  **Guarantee Future Predictive Accuracy:** A model closer to truth *now* is *more likely* to be predictively accurate, but future surprises can always occur. Truthlikeness is not a guarantee.
  4.  **Resolve Deep Structural Uncertainties:** If fundamental biology is unknown (e.g., the *true* mechanism of waning), ranking models assuming different structures becomes highly judgment-dependent ("Cannot Rank" is likely).
  5.  **Replace Utility Assessments:** A model closer to truth might be too slow or complex for operational use. This procedure assesses truthlikeness only; operational utility is a separate decision factor.
  6.  **Account for "Unknown Unknowns":** It relies on current knowledge. A model might be wrong in ways not yet conceived.

  **Final Note:** This procedure forces explicit, justifiable decisions about what matters for "truth" in your specific planning context. It replaces vague preferences with structured comparison against defined targets and current evidence, making the rationale for ranking (or not ranking) transparent and defensible to all stakeholders, including those who lose out. Run it rigorously, document every judgment call and sensitivity test, and let the output stand.
