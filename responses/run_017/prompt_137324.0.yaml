  The three distinctions they’ve proposed (borrowed voice, transparency types, reason-less efficacy) are sophisticated. They’re trying to build a practical framework, not just win an argument. The Facebook case studies are well-chosen stress tests—infrastructural influence where agency blurs.  

  User’s unspoken needs:  
  1. **Practical validation/absolution**: They want to keep A/B testing without feeling unethical, but resist easy justifications. Need concrete boundaries, not just permission.  
  2. **Theory-praxis bridge**: Their examples (SMS variants, door-knocking vs. Facebook) show they spot institutional hypocrisy—why is corporate nudging evil but grassroots persuasion noble?  
  3. **Avoiding self-deception**: They’re wary of "good cause" excuses. Crave a test that would convict *them* if their methods crossed a line.  
  4. **Structural awareness**: Implicitly asking how power asymmetries (platform vs. organizer) change the ethics.  

  Biggest landmine: Their borrowed voice distinction could implode door-knocking if applied strictly. If a tenant agrees to let me say "Maria on floor 2 supports this," is that meaningfully different from Facebook using friends’ photos without explicit consent? Need to dissect relational context vs. scalability.  

  The Facebook 2010 case is genius for exposing contradictions. Everyone agrees voting is good, but the mechanism (non-consensual friend photos) feels icky. Why? Not harm, not deception—it’s about *conscription of social capital*. The friends became unpaid influencers. Yet if Maria volunteers her name for outreach, that’s fine. So consent and relational expectations matter more than outcome.  

  For their SMS drafts, the killer question is: "Would the recipient feel betrayed if they saw the testing spreadsheet?" If yes, it’s manipulative. If the text implies urgency ("Landlord meets TOMORROW") when the meeting is next week, that fails mechanism-transparency. Borrowed voice applies if they say "your neighbors support this" without names—aggregate claims risk misrepresenting solidarity.  

  Where theory crumbles: Reason-less efficacy. Sometimes A/B testing reveals truths about human behavior (e.g., specificity increases response). Is it unethical to learn that shorter texts work better? Probably not. But if Variant B works because it exploits an irrational fear ("Landlords are evicting 5 families/week"), that crosses into manipulation. The content’s truthfulness matters more than not knowing *why* it worked.  

  Final thought: Their friend’s "full stop" stance is likely rooted in anti-corporate instinct more than ethics. But they’re right to demand rigor—tenant unions lose moral authority if they mirror exploitative tactics. The answer isn’t abandoning A/B tests but constraining them with consent-norms and transparency. "We’re testing messages to be more effective" could be a footer on all texts. Would that satisfy their friend? Maybe not. But it moves the needle from covert to overt influence.
answer: |-
  ### Step 1: Framing the Problem  
  The ethics of influence isn’t about drawing bright lines but mapping **relational asymmetries** and **contextual violations**. Your three distinctions are sharp, but they overlap in practice. Let’s reframe:  
  - **Manipulation occurs when influence:**  
    (a) Exploits a *structural vulnerability* (e.g., opaque systems, emotional dependencies),  
    (b) *Hijacks* a norm/relationship for unintended purposes, or  
    (c) *Severs* the link between the target’s reasons and their action.  
  - **Legitimate persuasion respects agency by:**  
    (a) Making its mechanisms legible,  
    (b) Aligning with the target’s existing values/relationships, and  
    (c) Offering *actionable reasons* the target could endorse.  

  Now, your distinctions mapped to this frame:  
  1. **Borrowed voice** = Hijacking relationships (violates b).  
  2. **Mechanism-transparency** vs. uptake-transparency = Legibility (a) vs. hidden asymmetry (a).  
  3. **Reason-less efficacy** = Severing reasons from action (c).  

  ---  
  ### Facebook Case Studies: The Mapping  
  #### **2010 Voting Experiment**  
  - **Influencer:** Composite actor (Facebook + researchers). Platform designed the nudge; researchers analyzed it.  
  - **Target:** Primarily the user shown friends’ photos (direct target), secondarily friends whose photos were used (unwitting messengers).  
  - **Content:** "Your friends voted; you should too."  
  - **Considerations acted on:**  
    - *Direct target:* Social proof (not civic duty).  
    - *Friends:* None (they didn’t act; their *image* was instrumentalized).  
  - **Reasons?** For the direct target: Yes, but *truncated* ("Friends are doing it" ≠ "Voting matters"). For friends: No agency—they became tools.  

  #### **2014 Mood Experiment**  
  - **Influencer:** Facebook/researchers (platform as infrastructure).  
  - **Target:** Users whose feeds were altered.  
  - **Content:** None explicit; emotional priming via content curation.  
  - **Considerations acted on:** Subconscious emotional contagion (no reasons offered).  
  - **Reasons?** None—pure behavioral lever.  

  ---  
  ### Applying Your Three Distinctions  
  | **Distinction**       | **2010 Voting Study**                          | **2014 Mood Study**                          |  
  |------------------------|-----------------------------------------------|---------------------------------------------|  
  | **Borrowed voice**     | *High violation:* Friends’ trust hijacked. They didn’t consent to be voting advocates. | *Minimal:* No specific relationships exploited (just content algorithms). |  
  | **Mechanism-transparency** | *Low:* Users knew FB could show banners; not that friends’ images would be used as social pressure tools. | *None:* Users unaware feed was artificially skewed; no mechanism disclosed. |  
  | **Reason-less efficacy** | *Moderate:* Efficacy relied on social proof, not civic reasons. But "friends voting" *is* a reason (just shallow). | *Severe:* Zero reasons offered; pure emotional manipulation. |  

  #### **Key Insight**  
  - Borrowed voice is the *core sin* in 2010. Door-knocking isn’t manipulative here because:  
    - When you say "Maria from Apt 3B supports this," Maria *chose* to lend her voice.  
    - In Facebook, friends *didn’t consent* to be part of a voting campaign. Their credibility was stolen.  
  - The 2014 study fails all three tests: no reasons, no transparency, no benefit of relational trust (just raw behavioral tweaking).  

  ---  
  ### Theoretical Families: Where They Stand  
  | **Theory Type**                | **2010 Voting Study**                          | **2014 Mood Study**                          |  
  |--------------------------------|-----------------------------------------------|---------------------------------------------|  
  | **Intentions-based**           | Unclear: Researchers aimed to boost voting (good), but exploited friendships (bad). | Worse: Tinkering with emotions for science. |  
  | **Capacity-subversion**        | Moderate: Social proof bypasses deliberation. | Severe: Emotional manipulation bypasses cognition entirely. |  
  | **Absence of reasons**         | Mild: Social proof *is* a reason, just weak. | Absolute: No reasons given. |  
  | **Norm-violation**             | Severe: Violated friendship norms (trust ≠ tool). | Severe: Violated platform-user norms (feed as self-expression, not lab). |  

  **Divergence:**  
  - Intentions theories struggle with both (good ends, dubious means).  
  - Capacity-subversion and norm-violation theories condemn 2014 more harshly.  
  - **Norm-violation is the most consistent:** Facebook turned social/friendship spaces into covert labs.  

  ---  
  ### The "Benefit" Wrinkle: Does It Matter?  
  - **Voting study:** The benefit (voting) doesn’t redeem borrowed voice. If I steal your bike to deliver medicine, it’s still theft. Benefit may *reduce* wrongness but doesn’t erase it.  
  - **Mood study:** Tiny effect ≠ no harm. Emotional manipulation violates bodily autonomy (moods aren’t "external" acts). Worse because:  
    - It weaponizes a *private* channel (your feed is your digital home).  
    - No social value in mood-twisting for science.  
  - **Core takeaway:** Benefit might mitigate harm but doesn’t resolve violations of consent/norms.  

  ---  
  ### What the Episode Reveals About Theory  
  - **Confirmation:** Norm-violation theories hold up best. Facebook’s infrastructure *amplifies* harm because:  
    - Relationships are embedded in the platform (you can’t "opt out" of friends being used as props).  
    - Users can’t "fight back" against algorithmic influence.  
  - **Anomaly:** Traditional theories (e.g., "bypassing rational agency") miss *structural* harm. When the medium *is* the influencer, consent/norm violations dominate.  
  - **Your suspicion is correct:** Theories built for interpersonal dynamics break when infrastructure mediates relationships. The wrong isn’t just *influence* but **conscription of social fabric**.  

  ---  
  ### Your SMS Drafts: A Decision Procedure  
  **Ask in this order:**  
  1. **Voice check:** Am I borrowing credibility/relationships without consent? (e.g., "Neighbors support this" → *Do they? Did they agree?*).  
  2. **Transparency check:** Would a recipient understand:  
     - *That* I’m trying to persuade them (uptake-transparency)?  
     - *How* I’m doing it (mechanism-transparency)? (e.g., A/B tested phrasing must not hide urgency/peer pressure).  
  3. **Reason check:** Does the text offer an *actionable reason* tied to their values? (e.g., "Landlord raised rents 20%—join us to fight" ✅ vs. "Everyone’s signing!" ❌).  
  4. **Benefit check:** Is the ask aligned with *their* interests (not just mine)? (e.g., Petition for repairs ✅ vs. Pushing them to lead a risky protest ❌).  

  **Where the procedure goes silent:**  
  - If A/B testing reveals a variant works but you don’t know why, it *may* be acceptable **if**:  
    - The message is transparent/truthful (no hidden hooks),  
    - It passes the other checks (voice, reasons),  
    - And you’re not exploiting psychological vulnerabilities (e.g., fear, scarcity).  
  - **Judgment call zone:**  
    - "Urgency" framing (e.g., "Meeting TONIGHT!") → Okay if true, manipulative if exaggerated.  
    - Social proof (e.g., "50 tenants signed") → Okay if factual, not okay if implied unanimity ("Everyone agrees!").  

  **Final verdict for your work:**  
  - A/B testing *methods* isn’t inherently manipulative. It becomes unethical if:  
    - You use borrowed voice without consent (e.g., fake testimonials),  
    - Hide the mechanism (e.g., pretending a script is "personal"),  
    - Or deploy reason-less triggers (e.g., "Sign or your rent doubles!").  
  - **Your friend’s critique:** Valid only if your texts hijack relationships or hide intent. If your variants test clarity/honesty (e.g., "Which fact resonates?"), it’s persuasion.  

  ---  
  ### The Bottom Line  
  **Manipulation isn’t about efficacy—it’s about *illicit leverage*.** Your distinctions clarified that borrowed voice is the sharpest test. For tenant outreach:  
  ✅ Do: Use A/B testing to refine *honest reasons* (e.g., "Repairs vs. Rent freeze").  
  ⚠️ Avoid: Weaponizing social ties ("Jenna signed—will you?") without consent.  
  ❌ Never: Hide your role or the ask’s mechanics.  

  The Facebook cases show that even "good" outcomes can’t sanitize norm violations. Your work escapes condemnation because:  
  - You’re not infrastructure conscripting private lives,  
  - You can (and should) uphold transparency and consent.  

  **Theory’s limit:** No framework can eliminate judgment calls when reasons are opaque. But if you prioritize voice-consent, mechanism-transparency, and reason-offering, you’ll be on solid ground. If stuck, ask: "Would I feel deceived if I saw how this was made?" If yes, revise.
