prompt: |-
  You're a professional philosopher who works specifically on the ethics of influence — manipulation, persuasion, nudging, coercion, all the stuff that sits in between. I'm going to ask you something I've been going back and forth on for weeks, so please think carefully and actually go slow: start with a bit of brainstorming about what the right *frame* even is before you commit to an answer, and please don't just hand me the wikipedia line about "manipulation bypasses rational agency" and call it a day. I want to see the mapping done carefully, and I want to be told where the theory runs out.

  Personal context, because it's why I care: I recently ended up running outreach for a small tenants' union local — I write the SMS scripts, the door-knock spiel, the phonebank text, and yeah, I've been A/B testing variants of the texts to see which ones get people to show up to a meeting or sign the petition. A friend on the same committee says that's manipulative, full stop, and I keep not having a good answer. I don't want "it's fine because the cause is just" — that's obviously not a test, any manipulator in history has said that. I want to know what distinguishes legitimate persuasion from manipulation in a way I can *use* when I'm deciding whether to send variant B.

  Here are three distinctions I've been chewing on, because I want you to work with them rather than start from scratch (and please tell me if any of them are confused or collapse into each other):

  1. **Borrowed voice.** Sometimes an influence route works by routing the message through a relationship it didn't earn — the credibility, warmth or obligation that makes you listen belongs to someone else, and the party who designed the message is a stranger to that relationship. The target's reason for being moved is a reason that has nothing to do with the content of what's being asked.
  2. **Mechanism-transparency vs. uptake-transparency.** It's one thing that I know someone is trying to get me to do something; it's another that I know *by what mechanism*, chosen by whom, with what evidence behind it, and for whose benefit. You can have the first without the second very easily.
  3. **Reason-less efficacy.** This is the one that gets under my skin about A/B testing. When I know variant B lifted turnout by 0.4 points but I have no idea *why* it worked — no story about what consideration it gave people — then I'm not, as far as I can tell, offering anyone a reason. I'm applying a cause. The influencer knows things in aggregate; the target has to act for reasons, individually. Is that asymmetry itself the moral problem, or is it fine as long as the content isn't deceptive?

  Now the episode I want analyzed through all this: Facebook's civic-mobilization and mood experiments in the early 2010s. I'm giving you the facts as I understand them so you don't have to guess, and if I've got a detail wrong just say "assume it roughly as stated" and move on — the analysis shouldn't hinge on it.

  - **2010:** On the day of the US congressional elections, ~61 million US Facebook users were randomly sorted into a control group, an "informational message" group (banner at the top of the News Feed encouraging them to vote, a polling-place locator link, a clickable "I Voted" button, a counter of how many others had reported voting) and a "social message" group (same, plus up to six randomly chosen profile pictures of *your* Facebook friends who had already clicked "I Voted"). The social-message group was more likely to click the button and to click the polling place link, and — checked against public voting records for a few million users — slightly more likely to actually vote. The effects were small per person and large in the aggregate; the spillover onto friends of those users was bigger than the direct effect, and nearly all of it was between close friends. Consent, such as it was, was supposed to come from the site's user agreement; my recollection is that the university IRB involved decided this wasn't human subjects research because the company ran it. It got published in a top journal and then got a lot of criticism.
  - **2014:** For a week, for about 689,000 users, the platform filtered their News Feed to reduce either positive or negative emotional content, and measured whether their own subsequent posts got more negative or more positive. The measured effects were tiny but statistically detectable. It was published in PNAS in June 2014, and in July 2014 the journal published an Editorial Expression of Concern saying that the data collection "may have involved practices that were not fully consistent with the principles of obtaining informed consent and allowing participants to opt out." The authors' defense was that the work was consistent with the site's data use policy, which users had agreed to, and that this counted as consent.

  What I want from you:

  - **Do the mapping explicitly for each study.** Who is the influencer — the platform, the researchers, the friends whose faces appeared, or some composite? Who is the *target*: the user shown the banner, the friends shown as having voted, or both? What exactly is the "content" being communicated, if anything? What considerations does the target end up acting on, and are those considerations *reasons* for what they're being moved to do?
  - **Run each of my three distinctions** (borrowed voice, the two kinds of transparency, reason-less efficacy) over both studies, and tell me which one is doing the real work and which is a red herring. In particular: does "borrowed voice" convict the 2010 study in a way that plain old door-knocking isn't convicted? The friends didn't agree to be messengers — is that the crux, or is it that they weren't *misrepresented*, since they really did vote?
  - **Say what the different families of theory would each say**: views that locate manipulation in the influencer's intentions, views that locate it in bypassing or subverting the target's capacities, views that locate it in the absence of genuine reasons, views that locate it in violating the norms of the setting. Do they come apart on these two cases, and if so where?
  - **Interesting wrinkle I want you to handle honestly:** in both studies the people influenced arguably *benefited*, or at least the intended effect was something most people think they should do (vote) or was too small to matter (a slightly less negative feed). Does that do any moral work at all? And does the 2014 case look worse than the 2010 case *only* because the benefit was thinner, or is there something else — the fact that the manipulated thing was the target's emotional state rather than an action, say, or that the mechanism reached into a channel they had open for a different purpose?
  - **What the episode shows about the theory, running the other direction.** Does it look like a confirmation, an anomaly, or a case the literature was never built for? My suspicion is that theories built around one-on-one influence between agents who can look each other in the eye break down when the influencer is a piece of infrastructure that also happens to be the medium in which the target's relationships live. Say if that's overblown.
  - **Finally, come back to my texts.** Given whatever account you land on, give me a decision procedure I could actually run on a draft SMS before I send it — the questions to ask, in order — and then tell me honestly where the procedure goes silent and I'd just have to make a judgment call. Where does your account *not* tell me anything I didn't already know?

  Take your time with it, and please flag the places where you're not confident rather than smoothing them over. If the honest answer is "the manipulation/persuasion distinction doesn't cut where you want it to," say that and tell me what distinction I should be using instead.
