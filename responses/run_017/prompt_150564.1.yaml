  Structure the proposal as follows:

  1. **Introduction and Problem Statement:** State the problem precisely: The invariance theorem for Kolmogorov complexity ensures that the ranking of hypotheses by complexity is robust up to an additive constant, but this constant can be large and may dominate the complexity differences in practical finite settings. Thus, the choice of reference machine might arbitrarily decide between candidate hypotheses.

  2. **Standard Replies and Their Shortcomings:** Explain why the standard reliance on the invariance theorem is insufficient for practical model selection because the constant can be large and matter when we have finite data and a small set of hypotheses.

  3. **Proposed Approach:**
     a. **First Idea (Fix for reference machine arbitrariness):** Instead of using a fixed universal machine, we propose a two-part code: a machine description plus a program for that machine. This forces the hypothesis to pay for the machine that makes it look simple.
     b. **Second Idea (Retrodiction vs. Constraint):** We want to distinguish between hypotheses that merely compress the past data and those that also constrain the future. We propose to score hypotheses by the expected cost of describing unseen data (perhaps via a cross-validation-like approach?).

  4. **Methodology:**
     - **Duration:** 6 months part-time.
     - **Month-by-Month Plan:**
       - Month 1: Formalize the two-part code framework and the expected description length for unseen data. Design a toy instruction set for exact program search.
       - Month 2: Implement a small-scale system for exact shortest-program search on the toy instruction set. Test on simple sequence continuation tasks (e.g., binary sequences with clear patterns).
       - Month 3: Extend the implementation to use a real-world compressor (like LZMA or gzip) as a stand-in for Kolmogorov complexity. Test on curve-fitting problems (e.g., polynomial vs. trigonometric functions).
       - Month 4: Test on grammar induction cases (e.g., inferring regular grammars from strings). Compare the two-part code against fixed-machine Kolmogorov complexity approximations and standard model selection criteria (like AIC/BIC).
       - Month 5: Investigate the second idea: design and implement a method for scoring hypotheses by expected future description cost. This might involve generating synthetic future data or using cross-validation on the observed data.
       - Month 6: Run comprehensive benchmarks on all test cases, analyze results, and write up findings.

  5. **Benchmark:** Use a set of benchmark problems (around a few dozen) including sequence continuation, curve-fitting, and grammar induction where the "correct" generalization is uncontroversial. Examples: 
     - Sequence: [0,1,0,1,...] should continue as alternating.
     - Curve: Points on a straight line vs. a parabola when given only a few points.
     - Grammar: Strings from a regular language (e.g., (ab)*) vs. a similar but different one.

  6. **Expected Outcomes:**
     - **Positive Result:** The two-part code approach reduces the sensitivity to the choice of the universal machine and outperforms fixed-machine complexity in model selection on the benchmarks. The expected future cost measure successfully penalizes overfitting (like lookup tables) and selects hypotheses that generalize.
     - **Negative Result:** The two-part code does not improve over the fixed-machine approach, perhaps because the overhead of specifying the machine is too high. The expected future cost measure might be too computationally expensive or not provide additional benefits over the two-part code.

  7. **Risks and Feasibility:**
     - **Project Failure:** Failure could be defined as not being able to implement the exact shortest-program search even for toy cases, or the benchmarks showing no improvement over existing methods. Also, if the expected future cost measure proves infeasible to compute or fails to capture generalization.
     - **Feasibility:** Six months part-time is ambitious but not delusional. The exact search on toy cases is manageable. Using real compressors as a proxy for Kolmogorov complexity is standard. The main risk is the computational cost of the two-part code and the design of the future cost measure.

  8. **Closing Paragraph (for the applicant only):** We'll add a short paragraph at the end, directed to the applicant, assessing which idea is genuinely new and which might be a reinvention. Without citations, we describe the kind of thing it would be called.

  Now, we write the proposal in about 700 words. We avoid citations and a bibliography.

