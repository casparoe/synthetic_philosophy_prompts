answer: |-
  Yes, this asymmetry in judgments of intentionality, knowledge, and foresight based on the moral valence of a side effect is a well-documented phenomenon in experimental philosophy, most prominently known as the **Knobe Effect** (or the **Side-Effect Effect**).

  **Here's the carving:**

  1.  **Core Phenomenon (Knobe Effect):** People are significantly more likely to judge that an agent brought about a *harmful* side effect *intentionally* than a *beneficial* side effect, *even when the agent's knowledge, foresight, and primary intention are identical in both scenarios*. The valence of the outcome flips the intentionality judgment.
  2.  **Extension to Foresight/Knowledge:** The effect also robustly extends to judgments about whether the agent *knew* the side effect would occur, *foresaw* it, or was *aware* of it. Harmful effects are judged as more foreseen/known than beneficial ones under identical conditions. This is considered part of the broader Knobe Effect landscape.
  3.  **Your Cases Match Precisely:**
      *   **Harmful Case (Cheaper solvent wrecking river / Draining pond wrecking habitat):** People say the agent *knew* it would happen and did it *intentionally* or *on purpose*.
      *   **Beneficial Case (Cheaper solvent protecting wetland / Draining pond creating ideal habitat):** People say the agent *didn't* know it would happen (or it wasn't foreseen) and *didn't* do it *intentionally* or *on purpose*.
      *   **Causality & Predictability:** Agreed upon as present in both cases (asymmetry only appears on mental state/purpose judgments).
      *   **Credit/Blame:** Judgments here track valence directly (blame for harm, credit for benefit), showing the asymmetry is specific to *intentionality/foresight* attributions, not evaluations of outcome responsibility itself.
  4.  **Your Hypothesis is Core to the Explanation:** The leading interpretation (the "Normative Approach" or "Bias View") holds that moral evaluation *fundamentally shapes* our concept of intentional action and related mental states like foresight in these side-effect cases. Judging an action as "intentional" isn't just a neutral description of mental states; it serves a communicative and social function, particularly in marking agents as *appropriate targets of blame* (or sometimes praise). The bad outcome makes the side effect salient *as something to be blamed for*, which pulls the judgment towards "intentional." The good outcome isn't seen as something requiring the same kind of agential marking for credit (which often goes to the outcome itself or luck), so the judgment leans away from "intentional" or "foreseen."
  5.  **Your "Definition-First Trick":** This aligns perfectly with experimental findings. When participants are presented with abstract definitions of intentionality *before* the scenario (or given non-moral scenarios), the asymmetry *diminishes or disappears*. This strongly suggests that the moral context actively shapes how people *apply* the concept, rather than them simply misunderstanding the definition. You weren't removing a "bias" in the pejorative sense; you were temporarily shifting the context away from the moral evaluation that normally *constitutes* part of the folk concept in these cases.

  **Edges and What It's Not:**

  *   **Not About Primary Intention:** The effect is specific to *side effects*. The agent's *stated primary goal* (saving money, improving grazing) is neutral and identical in both valenced cases. The asymmetry concerns the *additional* consequence.
  *   **Not About Blame/Praise Itself:** As you saw, judgments of blameworthiness (for harm) or praiseworthiness (for benefit) are straightforward and symmetrical. The Knobe Effect is about how moral valence infects the *attribution of the mental states* that often underlie blame/praise.
  *   **Not Necessarily a Conscious "Error":** People aren't usually being illogical *within their own framework*. The moral valence seems deeply integrated into how people conceptualize intentional action in the wild. It reflects how the concept *functions* socially.
  *   **Not Always Absolute:** The effect shows a strong *asymmetry* (harm > benefit), not that people *always* say "yes" for harm and "no" for benefit. The *degree* of harm/benefit matters.
  *   **Not Limited to Intention:** As emphasized, it robustly affects "knowingly," "foresaw," "in favor of," etc., regarding the side effect.

  **Your Observations & Confidence:**

  *   **Your Pattern Matches:** Your descriptions of the lab solvent switch and pond draining cases are classic illustrations of the Knobe Effect, including the foresight/knowledge flip. **(High Confidence)**
  *   **Your Hypothesis Matches:** The dominant explanation in the literature aligns with your guess: moral valence shapes the concept of intentionality itself for purposes of social evaluation (blame marking). **(High Confidence)** Your definition-first observation is a known mitigating factor. **(High Confidence)**
  *   **Pub Experiment Worth:** Your informal test (definitions shrinking the gap) is *not* worthless. It conceptually replicates a key experimental manipulation used to demonstrate the effect's dependence on normative context. While not rigorous science, its result is consistent with the phenomenon. **(Moderate Confidence - result plausible, method informal)**
  *   **Cases Parallel:** Your cases (solvent supplier, pond draining) are structurally parallel to each other and to standard Knobe scenarios (CEO harming/helping environment). **(High Confidence)**
  *   **Intention vs. Foresight:** You haven't muddled them. The Knobe Effect demonstrates that moral valence flips judgments *across* this family of mental state concepts (intention, knowledge, foresight, desire) regarding the side effect. They are linked in the asymmetry. **(High Confidence)**
  *   **Developmental & Cross-Linguistic:** Yes, variations of the effect have been found in young children (though sometimes differing in specifics) and across diverse languages/cultures (though sometimes differing in strength), supporting the idea it taps into a fundamental aspect of folk psychology. **(High Confidence - existence established, details vary)** This *is* astonishing and fascinating.

  **In short:** You've independently discovered and accurately described the **Knobe Effect**. It precisely names the asymmetry you observe in judgments of whether a side effect was brought about *intentionally* or *knowingly/foreseeably*, driven by the moral valence of the outcome, and your reasoning about the role of blame/praise in shaping the concept is central to understanding it.
