  The user wants to know if there's an established concept for this. They mentioned experimental philosophy and effects in children and other languages. I recall the Knobe Effect, where side effects influence intentionality judgments. The harmful case is seen as intentional, but the beneficial one isn't. That matches here. The user also notes a similar flip in knowledge attribution, which is part of the side-effect asymmetry in experimental philosophy.

  The user's hypothesis aligns with the Knobe Effect's interpretation: that intentionality isn't purely about mental states but involves moral evaluation. The user’s pub experiment reducing the asymmetry when defining terms fits with studies where abstract scenarios lessen the effect. The credit/blame part tracking valence without asymmetry makes sense because those are directly evaluative, unlike intentionality.

  I should confirm if the Knobe Effect exactly matches both intention and foresight flips. The original experiment focused on intentionality, but subsequent studies show similar effects on knowledge, desire, and other mental states. So yes, the foresight part is covered. The user’s examples (lab solvent, pond draining) are classic side-effect cases with neutral intent but differing outcomes.

