  Also, the user’s insight about "on purpose" serving as a blame/praise tool is key. The Knobe Effect supports that view, as moral judgments permeate mental state attributions. Their credit/blame point shows that direct evaluations don't have asymmetry, which contrasts with the intentionality judgments, reinforcing that intentionality is a proxy for accountability.

