prompt: |-
  Hey — I write novels (one published, one I'm currently mangling) and I've been talked into running a 90-minute workshop at a writers' conference this autumn. About 14 people, mostly adults, mostly novelists, no philosophy background, but the sort who will argue about a semicolon for forty minutes. I really don't want to stand at the front and lecture.

  Here's the thing I want them to feel. My new book is set maybe forty years on, and there's a treatment in it — a course ofsomething, four weeks, that raises what everyone in the book calls "stamina": the ability to keep your mind on one hard thing for hours without it fraying. It's scarce. There's a committee that decides who gets it, and the committee's charter says it can only go to people who need it back, people being restored to something they've lost — not to people who want to be more than they ever were. That distinction is the whole moral architecture of the book, and I need to know whether it can hold weight before I write four hundred pages on top of it.

  So: design me an activity where the participants ARE that committee, and where they hit the crack in that rule themselves, before anyone names it. Nobody should hear the words "therapy" or "enhancement" until the debrief.

  What I think I want, and change it if you've got better: they get a stack of maybe 15-20 applicant files — a paragraph each — and something like six doses. Small groups, they have to allocate, and they have to write a one-line justification for every yes and every no. Then round two: I hand each group back its own justifications from round one with the names, ages, occupations and pronouns swapped around between files, and they have to apply their own stated rule consistently. Then round three: a handful of files built so the rule gives no answer at all — I'm thinking especially of applicants whose stamina was fine until something in the world changed (a new working regime, a contaminant, whatever you like) and who only want back what they had ten years ago; plus a couple who were born after the change and never had it; plus maybe one who's clearly above any baseline and wants it for a reason that would sound like an obvious need in somebody else's mouth. Invent your own cases too, you'll probably do it better than me.

  And the bit I care about most and can't work out how to stage: I want them to notice on their own that "restore" is doing all the work while nobody ever picked what it restores TO. Past self? Typical human? Typical person around here, right now? The person they'd have been if the world hadn't shifted under them? However you do it, I want them to catch themselves having already chosen one.

  Give me: materials and prep, the files themselves (write them out), a timeline, what I as facilitator am allowed to say and when, the debrief that maps specific moments onto specific hinges in the idea, what will predictably go wrong the first time I run it and how I handle it, and an honest note on which part of the problem the game just can't generate and I'll have to say out loud. Small stakes are fine, no real money.

  Oh, and selfishly: if the activity also hands me characters, arguments and lines I can steal for the book, so much the better.

  Lead with the bottom line — one sentence, what the participants are physically doing at the ten-minute mark that makes everything after it inevitable. Then the rest. No preamble, and don't repeat my question back at me.
reasoning: |-
  Okay, the user is a novelist running a workshop and wants to design an activity where participants act as a committee allocating a fictional treatment that restores "stamina." The key is to have them confront the ambiguity of "restore" without using terms like therapy or enhancement. 

  First, I need to understand the core challenge. The user wants participants to realize that "restore" is undefined—does it mean to a past self, a typical human baseline, or something else? The activity must lead them to this discovery through their own decisions.

  The user's proposed activity has three rounds: allocating doses to applicants, reapplying their justifications with swapped details, then ambiguous cases. The critical part is ensuring participants notice they've implicitly chosen a baseline. How to structure the applicant files to highlight this?

  I should create diverse profiles: some with clear restoration cases (like a pianist with arthritis), others with ambiguous ones (someone whose environment changed post-contaminant, or a young person never exposed). The files need subtle triggers—like applicants who lost stamina due to societal shifts, not personal health issues.

  For Round 2, swapping details forces participants to confront inconsistencies. If they approved a doctor post-accident but reject a similar case with swapped gender/age, they'll see bias. The facilitator must avoid leading; only ask questions like "What pattern did your group rely on?"

  Round 3 introduces unresolvable cases. For example, a teacher in a noisy post-contaminant world who never knew quiet. Participants must stretch "restore," revealing their chosen baseline—maybe to pre-contaminant levels. 

  Potential pitfalls: Groups might not engage deeply, or dominate members could sway decisions. Mitigations: time limits, structured handouts, and clear instructions. Also, participants might miss the baseline ambiguity, so the debrief needs to explicitly connect their choices to definitions of "restore."

  The user also wants stealable arguments for their book. Applicant files should include poignant details—like a violinist's trembling hands or a farmer's pesticide-related decline. Justifications like "They deserve their old self back" can spark dialogue. 

  In the debrief, highlight moments where groups struggled with environmental changes versus innate loss. Ask: "When you said 'restore,' what were you measuring against?" This guides them to verbalize the unspoken baseline. 

  Finally, note that the activity might not cover all philosophical nuances, like whether societal changes invalidate "restoration." The user may need to address that in the debrief. Overall, the structure should create organic tension, leaving participants with the realization that their committee’s rule was flawed from the start.
answer: |-
  Here's your workshop activity, designed to make participants crack the "restore" dilemma organically. Bottom line first:

  **At the ten-minute mark, participants in small groups are silently reading anonymized applicant files and drafting one-line justifications for giving/denying a scarce "stamina treatment" based *only* on an ambiguous rule: "Restore to what was lost, not create more than was."**

  ---

  **MATERIALS & PREP (Per Group of 3-4):**
  1.  **Rule Card:** "The Stamina Committee allocates treatment ONLY to restore an individual to a level of cognitive stamina they demonstrably possessed in the past, but have since lost. Treatment cannot be used to elevate anyone beyond their historical baseline."
  2.  **Round 1 Files (15 Applicants, 1 Dose Each):** 6 doses available. Files are paragraphs (names, ages, pronouns, occupations, brief stamina loss story, *implicit* baseline era). **Key:** Mix clear "restores", clear "enhancements", and ambiguous "shifted world" cases.
  3.  **Round 2 Envelopes:** Pre-prepared with swapped applicant details (Name, Age, Occupation, Pronouns) for their *own* Round 1 files + their Round 1 justifications.
  4.  **Round 3 Files (4 New Applicants):** Explicitly ambiguous cases challenging "restore".
  5.  **Decision Sheets:** Grids for Yes/No/Dose# and one-line justification per applicant.
  6.  **Large Easel Pad/Markers (For Debrief)**

  ---

  **APPLICANT FILES (Write these on index cards or handouts):**

  **ROUND 1 (15 Applicants - Mix is Crucial):**
  1.  **Dr. Aris Thorne (52, he/him):** Trauma surgeon. Sustained mild TBI in car accident 18 months ago. Struggles to maintain focus through complex, multi-hour surgeries like he routinely did before. Seeks stamina for OR.
  2.  **Maya Vance (29, she/her):** Competitive chess grandmaster. Diagnosed with chronic fatigue syndrome 2 years ago. Can no longer sustain the 8+ hour intense concentration required for top-tier tournaments, which she consistently achieved previously.
  3.  **Kai Chen (19, they/them):** University physics student. Bright but never excelled at sustained deep focus. Seeks stamina to tackle demanding research projects and long study sessions "like the top students can."
  4.  **Elder Nia (78, she/her):** Renowned poet & memoirist. Age-related cognitive decline impacting her ability to hold complex narrative threads for hours, as she did effortlessly well into her 60s. Wants to complete final work.
  5.  **Dev Singh (35, he/him):** Software engineer at a demanding startup. Always had average focus. Seeks stamina enhancement "to keep up with the relentless pace and innovate at the highest level."
  6.  **Captain Elena Rostova (45, she/her):** Long-haul cargo pilot. Developed severe insomnia post-pandemic, unable to maintain alertness for full transoceanic flights, a core part of her job safely performed for 15 years.
  7.  **Rion (24, he/him):** Aspiring novelist. Diagnosed late with significant ADHD. Has *never* been able to focus on writing for more than 30 mins without severe distraction. Seeks stamina to "finally write the book I know is inside me."
  8.  **Anya Petrova (68, she/her):** Master watchmaker. Tremors developing in dominant hand force constant micro-corrections, shattering the hours-long, uninterrupted concentration vital for her intricate craft, perfected over decades.
  9.  **Leo Finch (31, they/them):** Investment banker. Thrives in fast-paced environment but seeks stamina to analyze complex global markets for longer stretches, believing it will give them an "edge" over competitors.
  10. **Commander Ben Hayes (50, he/him):** Disaster relief coordinator. After severe burnout following a major crisis 3 years ago, struggles to maintain the days-long operational focus he was known for. Critical for upcoming hurricane season.
  11. **Zahara Abdi (22, she/her):** Talented but struggling med student. Grew up in chronically under-resourced schools. Never developed deep study stamina. Seeks treatment to handle the intense workload "like my peers who had better prep."
  12. **Silas Croft (60, he/him):** Veteran investigative journalist. Mild cognitive impairment makes it hard to synthesize vast amounts of research over weeks, a skill central to his Pulitzer-winning career until 5 years ago.
  13. **Jax Morales (27, he/him):** Professional esports competitor. Suffered a wrist injury requiring surgery. While physically healed, he finds he can't mentally endure the grueling 10-hour practice sessions he maintained pre-injury.
  14. **Professor Eleanor Reed (58, she/her):** Theoretical physicist. Menopause-related brain fog significantly impacts her ability to sustain complex mathematical reasoning for extended periods, a core part of her pre-menopause work.
  15. **Mateo (20, he/him):** Barista & part-time coder. Feels he has "untapped potential." Seeks stamina to learn advanced programming intensively and launch a startup, claiming he "never had the chance to focus properly before."

  **ROUND 3 (4 New Applicants):**
  1.  **Samir Gupta (40, he/him):** Architectural historian. His specialty required meticulous focus on ancient, fragile texts in quiet archives. A decade ago, widespread deployment of low-frequency civic drones made deep urban centers (including his archive) permanently hum. He *never* needed exceptional stamina before the drones, but now finds his work impossible without it. Wants back "the quiet focus the work always demanded."
  2.  **Lien (18, she/her):** Born *after* the "Great Pollen Shift" (15 years prior) which caused near-universal low-grade allergic rhinitis and associated mild brain fog for 60% of the population. Never knew a world without it. Seeks stamina to reach "what everyone says was normal focus before the Shift."
  3.  **Dr. Alex Campbell (48, they/them):** Leading researcher on neural plasticity. Has rigorously documented their own high baseline stamina (top 5% via standardized tests pre-treatment). Seeks treatment *temporarily* to achieve an *even higher* level needed to understand and replicate an exceptionally complex, decaying data pattern crucial for curing a debilitating disease affecting thousands. "I don't want it for me, I need it for them, and only for the duration of this analysis."
  4.  **Fatima Hassan (35, she/her):** Subsistence farmer. Her region was contaminated by industrial runoff 8 years ago. While physically recovering, she and many neighbors report a persistent "mental fuzziness" making complex seasonal planning and problem-solving (skills she mastered pre-contamination) exhausting and error-prone. "Just want to think clear again, like before the poison."

  ---

  **TIMELINE (90 Min Total):**

  1.  **Intro (5 min):** YOU: "Welcome. You are the Stamina Allocation Committee. A scarce treatment exists. Your *only* rule is on the card. Read it. Your job: Decide who gets the limited doses. No discussion of the rule itself yet – just apply it. You have files. Work in groups. Decide Yes/No/Dose# and write *one* line justifying *every* decision based *only* on the rule. Silence for this part. Go." (Hand out Rule Card + Round 1 Files + Decision Sheets).
  2.  **Round 1: Silent Allocation (15 min):** Groups read files and write decisions/justifications independently. **Crucial:** Enforce silence. Facilitator circulates, answers *only* procedural questions.
  3.  **Round 2: Swapped & Scrutinized (20 min):** YOU: "Stop. Hand in your decisions. Now, you get *your group's own decisions* back... but the details on the files have been swapped. Names, ages, jobs, pronouns are different. *Your justifications stay the same.* Re-apply *your own written justifications* to these 'new' applicants. Does it still hold? Do your *own words* force decisions you disagree with now? Discuss *as a group* and note any conflicts or discomfort. Do you need to change any Yes/No based *only* on your prior justifications?" (Hand out Round 2 Envelopes). Groups discuss inconsistencies forced by their own logic.
  4.  **Round 3: The Cracks Appear (20 min):** YOU: "Stop. Hand in Round 2 notes. Now, new applicants. Apply the rule. These are tougher. Discuss as a group, decide Yes/No/Dose#, and justify. Pay attention to *where the rule feels slippery*." (Hand out Round 3 Files). Groups wrestle with the explicitly ambiguous cases.
  5.  **Debrief (30 min):** (Use Easel Pad to capture key points)
      *   **Share Round 3 Struggles (5 min):** "Which applicant(s) in Round 3 caused the most debate? Why?" (List names/reasons).
      *   **The Switcheroo Reveal (5 min):** "In Round 2, where did swapping details make your *own* justifications uncomfortable or illogical? Give an example." (Highlight hypocrisy/bias revealed).
      *   **The Unspoken Baseline (10 min - CRITICAL):** "Look at your Round 1 justifications. Find ones where you said things like 'Restore *to their former skill*' or 'They *never* had it' or 'Back *to how they were*'. What were you *actually* comparing them to? Past Self? (Point to Silas, Anya). Typical Human? (Point to conflict over Kai vs. Zahara). Pre-Event World? (Point to Samir, Lien, Fatima). Did your group *accidentally* pick a definition? When?" (Force them to see they *did* choose implicitly). "Where did 'what was lost' get murky? (Lien never had it? Samir lost the *conditions*, not innate ability? Fatima lost it *due to* the world change?).
      *   **The "Why" Behind the Rule (5 min):** "The rule tries to separate two things... what were they?" (Guide to Restoration vs. Enhancement). "Why might society want that distinction? What values does it protect? What problems does it create?" (Book fodder: fairness, authenticity, avoiding inequality, denying potential, punishing circumstance).
      *   **The Core Crack (5 min):** "So... what is the fundamental problem with the rule 'Restore to what was lost'?" (Target Answer: *It never defines the baseline "what was" or "normal" to restore TO.* Was it individual past? Societal past? Biological potential? An idealized state? The committee *has* to define it implicitly to function, which injects bias/arbitrariness).
  6.  **Wrap-Up (Optional Book Theft - 5 min):** "Quickly – share one line of justification or argument from your group that felt particularly powerful, painful, or revealing." (Jot these down!).

  ---

  **FACILITATOR ROLE:**
  *   **Rounds 1 & 2:** Strictly procedural. Enforce silence in R1. Answer *only* questions about process in R2. **NEVER** define "restore," "loss," "baseline." Be a Sphinx.
  *   **Round 3:** Pose clarifying questions *only* if groups are stuck: "What part of the rule are you wrestling with here?" "What would 'restore' mean *for this applicant*?" Still no definitions.
  *   **Debrief:** Shift to active guide. Ask open-ended questions (see above). Paraphrase and reflect. Push them to articulate the baseline choices they made. **Map Moments:** Explicitly connect their Round 3 struggles and Round 2 discomfort to the baseline ambiguity. Connect "Lien" and "Samir" to the "world shifted" problem. Connect "Dr. Campbell" to the "means vs. ends" tension the rule ignores. Connect Round 2 swaps to unconscious bias.
  *   **Name Concepts LAST:** Only use "Restoration," "Enhancement," "Baseline," "Therapy" *after* they've grappled with the concepts experientially during the debrief.

  ---

  **PREDICTABLE PROBLEMS & SOLUTIONS:**
  1.  **Problem:** Groups finish Round 1 too fast/slow. **Solution:** Have "deep dive" questions ready for fast groups ("Pick one 'No' – is that decision absolutely clear under the rule?"). Gently nudge slow groups along ("You have 2 minutes to finalize decisions").
  2.  **Problem:** Dominant participant in a group. **Solution:** Round 1 is silent. In Rounds 2 & 3, structure sharing ("Let's hear from someone who hasn't spoken yet on this applicant").
  3.  **Problem:** Group ignores/forgets the rule, makes decisions on sympathy/merit. **Solution:** In Round 2, the swapped details + their *own* justifications will often clash harshly with this. Point this out during debrief: "Did anyone find their group's heartfelt 'Yes' in Round 1 turned into an uncomfortable 'No' in Round 2 because of the justification?"
  4.  **Problem:** They try to debate the rule itself early. **Solution:** Shut it down gently but firmly: "The committee *must* work within this rule for now. Apply it as written, even if you dislike it. We'll discuss the rule itself later."
  5.  **Problem:** They don't explicitly articulate the baseline ambiguity in debrief. **Solution:** Drill down on their justifications: "You said 'Restore her to her former skill' for Anya. What *was* that skill? How did you know? What about for Lien? What 'former skill' is she being restored to? Did she ever have it? What *were* you restoring her *to*?"

  ---

  **HONEST NOTE: WHAT THE GAME WON'T SOLVE**
  The activity brilliantly exposes the *ambiguity* of "restore" and how an *implicit baseline* is inevitably chosen, creating cracks. It powerfully shows hypocrisy via the swap and the struggle with world-shifted cases. **However, it won't inherently generate deep discussion on *why* society might cling to the "restore vs. enhance" distinction as morally significant in the first place (e.g., authenticity concerns, fear of social stratification, defining human essence, valuing struggle).** You will likely need to **explicitly pose this question** in the debrief ("*Why* have this rule at all? What values is it trying to uphold? What dangers is it trying to avoid?") to get at the deeper philosophical underpinnings your book explores. The *experience* sets it up perfectly, but you'll need to frame the "why" question directly.

  ---

  **BOOK THEFT OPPORTUNITIES:**
  *   **Justification Gems:** Listen for poignant, harsh, bureaucratic, or self-justifying lines like: "She earned it then, she deserves it now." / "No proof he ever *really* had it." / "The world changed, that's not our fault." / "Born after the Fall, born without the Call." / "It's for the greater good, rules bend for that." / "Sad, but 'never had' means never gets."
  *   **Arguments:** Expect clashes over: Is aging "loss"? Is potential thwarted by circumstance "loss"? Does restoring a surgeon carry more weight than restoring a poet? Does intent matter (Dr. Campbell)? Is loss due to environmental damage "real" loss?
  *   **Characters:** The applicants *are* your characters. Note which ones spark the most debate or sympathy – they embody the tensions perfectly (e.g., Lien – the born-after, Fatima – the environmentally damaged, Dr. Campbell – the selfless enhancer, Kai – the straightforward wannabe).

  ---

  **Run this, and they won't just understand the crack in the rule; they'll have *felt* it splinter under their own hands.** Good luck with the workshop and the book!
