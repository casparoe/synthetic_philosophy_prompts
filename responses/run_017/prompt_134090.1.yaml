prompt: |-
  I run a monthly philosophy evening at my town's public library. Typically ten to fourteen adults show up, from their twenties to their eighties, almost none with any formal background in philosophy and no reading between sessions. I have one room, ninety minutes, a whiteboard, index cards, pens, and a few household objects I can bring in a bag. I would like you to design a single self-contained session for that group.

  The topic I have been reading about on my own is people who, as a treatment for severe epilepsy, have had the thick bundle of nerve fibres connecting the two halves of the brain surgically cut. What grips me is not that information fails to cross. It is the shape of what follows. Something shown briefly to one side of the visual field is available to one half and not the other; the half that controls speech apparently cannot name what the other half saw, but the silent half can still act on it, choosing or arranging objects correctly with the hand on the other side of the body. And then the speaking half, asked to explain the action, produces a smooth and confident reason that is simply invented. Nobody involved seems to experience a gap.

  What I want the group to feel — not to be told — is the force of the question that raises. Is there one person in there now, or two? And a sharper version, which interests me more: does that question have a determinate answer at all, or is it the kind of question that dissolves when you press on it? I suspect most people, hearing the case described, have a confident immediate answer, and I want that confidence to get into trouble during the session rather than in the discussion afterwards.

  A few things I need from the design.

  First, no lecture up front and no naming of the philosophical issue until the debrief. The experience should come out of the rules, the roles, the incentives, or the constraints on what people are allowed to say — not out of anything I say first. If a participant would have to be told the point in order to play, the design has failed.

  Second, I want the core of the activity to be built around a stipulated variant that I made up, because the standard case seems to me to push people toward one answer too quickly. Suppose the surgery is only partial: the detailed traffic — what was seen, what was instructed — does not cross, but a coarse alarm signal does. The speaking half never learns what the silent half saw, yet it reliably registers that something is off: a vague bodily unease, a sense that the room is not quite right, an impulse to check something. It cannot tell whether the feeling is about the task, the temperature of the room, or something it has forgotten. I find that this cuts both ways, and I cannot settle it. It may be the one thing that makes the system genuinely single: a state belonging to nobody in particular but directed at the whole. Or it may be the clearest evidence of the opposite: two streams, plus a third thing registering a collision between them and unable to say whose it is. Please build the rules so that participants can come down on either side, or somewhere else, rather than so that they recover the two readings I just gave. I am not claiming this variant is a real case; treat it as stipulated, and tell me plainly if you think it is incoherent or rests on a false assumption about how any of this works.

  Third, I would like the setup to generate confabulation rather than stage it. My thought is that the role doing the explaining should have something to gain by committing to a single confident account and something to lose by hedging or saying they do not know, with the actual state of things revealed only after they have committed. I am open to being told that is the wrong way to do it.

  Fourth, I would like a short final phase in which the explaining role keeps going but the people feeding it are swapped, so that the same first-person story has to continue across a discontinuity. My reason is that I am not sure whether being one person at a moment and being the same person over time are even the same question, and I would like the activity to put pressure on that without announcing it.

  Fifth, before any discussion, I want each person to write a private answer to the one-or-two question and have the answers tallied on the board, including any answers that say the question itself is broken.

  What I need in the response: the materials; the roles and the rules as a participant would hear them; a scoring or payoff scheme that needs no money and cannot be gamed by a group that decides to cooperate; a minute-by-minute outline for the ninety minutes; the debrief, with each stage of it mapped to the moment in the activity it is meant to cash out; and an honest account of what will predictably go wrong the first time I run it and how I should handle it in the room. Please also say how to adjust if only eight people come or if sixteen do.

  Two last requests. Please write in plain language and gloss any technical term in a sentence when you cannot avoid it; I have been reading about this for a few months on my own and have no training in it. And please flag where you are unsure: which design choice you have least confidence in, what a first run would have to show to make you change it, which part of the activity rests on a contested reading of either the empirical material or the philosophical claim, and what evidence or argument would make you drop or rewrite that part. Finally, be clear about which feature of the issue the activity cannot reproduce at all and which I would have to supply myself in the debrief. Please do not suggest further reading or cite studies, papers, or case names — I cannot look anything up and could not judge it if I could.
reasoning: |-
  We are designing a self-contained session for a group of 10-14 adults with no formal philosophy background and no pre-reading. The goal is to have them experience the core puzzle of split-brain patients without upfront explanation. We are using a modified version where a coarse alarm signal exists between hemispheres.

  Key elements from the request:
  - No lecture, no naming the issue until debrief.
  - Use a stipulated variant: partial split with a coarse alarm signal (vague unease) but no detailed information transfer.
  - Generate confabulation: the explaining role should have incentives to give a confident account and disincentives for hedging.
  - Include a phase where the feeders are swapped to disrupt continuity.
  - Private written answers at the end before discussion.
  - Materials: whiteboard, index cards, pens, a few household objects.

  Design Overview:

  We will create a game with three roles:
  1. The "Explainer": One person who must explain the actions of the group. They are the "speaking half".
  2. The "Silent Group": Several people who receive private information and perform actions, but cannot speak. They are the "silent half".
  3. The "Alarm Signal": One or two people who can trigger a vague alarm (without specific information) to the Explainer.

  We'll have two phases:
  - Phase 1: The Silent Group (with the Alarm Signal) performs actions based on private instructions, and the Explainer must explain what they are doing and why. The Explainer is incentivized to be confident and penalized for uncertainty.
  - Phase 2: We swap some members of the Silent Group (and possibly the Alarm Signal) without telling the Explainer. The Explainer must continue explaining as if nothing changed.

  At the end, participants write privately whether they think there is one person (the Explainer plus the Silent Group) or two (the Explainer vs. the Silent Group) or if the question is broken.

  Materials:
  - Index cards: for instructions to the Silent Group and Alarm Signal.
  - Pens: for writing.
  - Household objects: e.g., a book, a cup, a spoon, a toy, a key, etc. (about 5-10 objects). These will be used for actions.
  - Whiteboard: for tallying the final answers.

  Setting up the room:
  - The Explainer sits at a table facing the rest of the group. Behind the Explainer, there is a space for the Silent Group to perform actions. The Explainer must turn around to see the actions but cannot see the instructions given to the Silent Group.

  Roles and Rules (as participants would hear them):

  We need to explain the rules without giving away the philosophical point. We'll frame it as a game about perception and explanation.

  Step-by-Step:

  1. Introduction (5 minutes):
     - "Today we're going to do an activity about how we explain what we see. We'll have three kinds of roles: an Explainer, a Silent Group, and an Alarm Signal. Let me explain the rules."

  2. Role Assignment (5 minutes):
     - Assign one person as the Explainer (volunteer or randomly chosen).
     - Assign 1-2 people as the Alarm Signal (depending on group size). The rest are the Silent Group. For a group of 10: Explainer (1), Alarm Signal (1-2), Silent Group (7-8). For 8: Explainer (1), Alarm Signal (1), Silent Group (6). For 16: Explainer (1), Alarm Signal (2), Silent Group (13).

  3. Rules Explanation (10 minutes):
     - To the Silent Group: "You will each get a card with a private instruction. You cannot speak or make any noise. You will perform your action one by one on the objects on the table behind the Explainer. When it's your turn, you come up and do what your card says without explaining. Then sit down."
     - To the Alarm Signal: "You are watching the Silent Group. You have a card that tells you what might be wrong. But you cannot speak. Instead, you can send a non-verbal signal to the Explainer when you feel something is off. This signal is a light tap on the Explainer's shoulder. However, you must not tell the Explainer what the problem is. The signal is just a vague feeling that something might be wrong. You can use it up to three times during the whole activity."
     - To the Explainer: "You are the only one who can speak. Your job is to explain what the Silent Group is doing. After each action, I will ask you to explain what the person did and why they did it. You must give a clear and confident explanation. If you say things like 'I don't know' or 'maybe', you lose points. Also, if the Alarm Signal taps your shoulder, you must acknowledge it in your explanation. For example, you might say, 'I felt uneasy about that, but I think they did it because...' or something similar. But remember, you don't know what caused the unease. We will score your explanations on confidence and consistency. At the end, we'll see how well you did."

  4. Scoring System (explained to the Explainer, but not others):
     - Confidence: Each explanation is rated by the facilitator (you) on a scale of 1-3 (1: hesitant, 2: moderately confident, 3: very confident). The Explainer gets points for each explanation: 3 for a 3, 2 for a 2, 1 for a 1. The goal is to get as many points as possible.
     - Consistency: If the Explainer gives an explanation that contradicts a previous one without acknowledging the change (and without the Alarm Signal having been triggered in between), they lose 2 points for each contradiction.
     - The Alarm Signal tap: If the Explainer fails to acknowledge a tap in their explanation, they lose 3 points for that round. If they do acknowledge it (even vaguely), they get a bonus 1 point for that round.
     - The Explainer is told that the highest possible score is 3 per round (so for 8 actions, 24 points) and they should aim for the maximum.

     Note: The scoring is done by the facilitator (you) and not revealed until the end. The points are abstract and don't require money. The Explainer is told they are competing for the best score.

  5. Phase 1: The Actions (25 minutes):
     - You (facilitator) give each Silent Group member an index card with a specific instruction. Examples:
          - "Pick up the book and put it under the chair."
          - "Move the cup to the left side of the table."
          - "Turn the spoon upside down."
          - "Put the key inside the cup."
          - "Stack the book on top of the cup."
          - "Hide the toy under the book."
          - etc.
     - Also, give the Alarm Signal a card with a condition that might be wrong. For example: "If someone moves an object to the left, that is wrong because the instructions say to put things on the right." But note: the Alarm Signal doesn't know the instructions of the Silent Group. You, as facilitator, must set up a conflict.

       How to set up the conflict:
          - You tell the Silent Group and the Alarm Signal in advance a general rule (but the Explainer doesn't know it). For example: "All objects should be placed on the right side of the table." But then you give some Silent Group members instructions that break the rule (e.g., "put the cup on the left"). The Alarm Signal's card says: "If any object is placed on the left, that is wrong." So when they see it, they tap the Explainer.

     - The Silent Group members perform their actions one by one. After each action, you ask the Explainer: "What did [Name] just do and why did they do it?" The Explainer explains. You note the score for confidence and consistency. Also, if the Alarm Signal taps during or after an action, the Explainer must incorporate that.

     - Important: The Alarm Signal can only tap when they see a violation. They must not tap randomly. You monitor this.

     - Do about 8 actions (one per Silent Group member). Adjust for group size: if 8 total, then about 5 Silent Group actions; if 16, then about 12.

  6. Phase 2: Swap and Continue (15 minutes):
     - Without warning, you swap half of the Silent Group (and possibly the Alarm Signal) with new people from the audience (if available) or with each other. But note: we have one group. So if we started with 7 Silent Group members, we swap 3 or 4 of them with people who were not in the Silent Group before. Also, if there was one Alarm Signal, swap that person too. The new members get new instructions (which might be consistent or inconsistent with the previous rule). The Explainer is not told about the swap.

     - The rule for the new Silent Group: You give them new cards. Some of these new instructions may follow the old rule (right side) and some may break it (left side) arbitrarily.

     - The new Alarm Signal: You give them the same condition as before (e.g., "if any object is placed on the left, that is wrong").

     - Then, you have the new Silent Group perform actions (about the same number as in phase 1). The Explainer continues to explain each action. The Alarm Signal taps when they see a violation.

  7. Final Tally and Private Answers (10 minutes):
     - The activity ends. You tell the Explainer their total score (you can make up a score that is high to keep the spirit of the game).
     - Then, without any discussion, hand out index cards to every participant (including the Explainer, the Silent Group, and the Alarm Signal). Ask: "After this experience, do you think the Explainer and the Silent Group together were acting as one person or two? Or is this a question that doesn't make sense? Please write one of: 'One', 'Two', or 'Broken Question'."
     - Collect the cards and tally the results on the whiteboard.

  8. Debrief (20 minutes):
     - Start by saying: "Today's activity was inspired by real cases of split-brain patients. In some severe epilepsy cases, the connection between the two brain hemispheres is cut. What happens is that the left side (which controls speech) cannot access information from the right side. But the right side can act. When the right side acts, the left side often makes up a reason for the action without knowing the real cause. This is called confabulation."
     - Then, relate each part of the activity to the split-brain phenomenon:
          - The Silent Group represents the right hemisphere (non-verbal, acting on information).
          - The Explainer represents the left hemisphere (speaking, explaining).
          - The Alarm Signal represents the coarse signal that something is wrong but without details.
          - The swap in Phase 2 represents the question of continuity over time: even if the parts change, does the person remain the same?
     - Highlight the confabulation: the Explainer had to give reasons without knowing the real instructions, and the incentives pushed them to be confident.
     - Then, show the tally and say: "We see that people have different intuitions. Some say one, some two, some that the question is broken. This is the core puzzle: what makes a person? Is it the unity of consciousness? The ability to explain? The continuity of the body? Or is it something else?"
     - Open the floor for discussion, but start by asking: "How did it feel to be in your role? Explainer, what was it like to explain? Silent Group, what was it like to watch the explanations? Alarm Signal, what was it like to know something was wrong but not be able to say what?"

  Adjustments for group size:
  - 8 people: Explainer (1), Alarm Signal (1), Silent Group (6). In Phase 1, 6 actions. In Phase 2, swap 3 of the Silent Group and the Alarm Signal. Then 3 more actions.
  - 16 people: Explainer (1), Alarm Signal (2), Silent Group (13). But we cannot have 13 actions. Instead, split the Silent Group into two groups of about 6-7. In Phase 1, the first group does 6 actions. Then in Phase 2, swap the entire Silent Group and both Alarm Signals (or one if you prefer) with the other half. Then the new group does 6 actions. Alternatively, if the room is small, just use 6-7 Silent Group at a time and have the others observe. But we want as many involved as possible. So we can have two shifts: first 6 Silent Group, then swap to the other 7 for Phase 2.

  Predictable Problems and Solutions:

  1. Problem: The Explainer might get frustrated because they are making things up.
     - Solution: Reassure them that it's okay to make up stories and that the goal is to be confident. Emphasize the points.

  2. Problem: The Alarm Signal might not tap when they should, or tap too much.
     - Solution: Before starting, remind the Alarm Signal of their condition. If they don't tap, you (facilitator) can ask: "Alarm Signal, did you notice anything?" to prompt. But avoid this if possible.

  3. Problem: The swap in Phase 2 might be confusing or the Explainer might notice.
     - Solution: During the swap, distract the Explainer (e.g., ask them to write down their last explanation). Then swap the Silent Group quickly. If the Explainer notices, say: "We are just changing the order, please continue."

  4. Problem: The Silent Group might laugh or give nonverbal cues that confuse the Explainer.
     - Solution: Tell the Silent Group to be as neutral as possible and not react.

  5. Problem: The scoring might feel arbitrary.
     - Solution: Be consistent in your scoring. After the activity, you can reveal that the score was just a tool to encourage confabulation and not a real judgment.

  6. Problem: Participants might not understand what to write on the card.
     - Solution: Give clear options: "Please write one of: 'One', 'Two', or 'Broken Question'."

  7. Problem: The debrief might be too abstract.
     - Solution: Use the actual events from the activity to illustrate the concepts.

  What the activity cannot reproduce:
  - The real split-brain patients have a unified body and a history of being one person. Our activity has separate bodies. We have to note in the debrief that in the real case, it's one body with two streams of information. The activity uses multiple bodies to represent the hemispheres, so we are using a metaphor.

  Design Choice I'm Least Confident In:
  - The Alarm Signal role: I worry that it might not feel like a "coarse signal" but more like an external observer. Also, the condition might be too clear to the Alarm Signal. To fix: make the Alarm Signal's condition very vague. For example, their card says: "You feel uneasy if the actions seem inconsistent. But you don't know the rule. You just have a gut feeling." Then, you (facilitator) know the rule and can prompt them by a nod when a violation happens? But that breaks the no-lecture rule. Alternatively, we can drop the explicit condition and tell the Alarm Signal: "You are the inner sense that something is wrong. If you feel that the actions are conflicting, tap." But then they might not know when to tap.

    Revised: In the rules, tell the Alarm Signal: "You are the inner alarm. You will get a feeling that something is off when the actions of the Silent Group conflict. We cannot tell you exactly what conflict means; it's a gut feeling. But we want you to tap only when you feel that conflict." Then, as facilitator, during the activity, if you see a conflict (because you set the rule), you can make eye contact and nod slightly to the Alarm Signal to tap. This is a bit of cheating, but it might be necessary.

    Alternatively, we can have the facilitator act as the Alarm Signal? But then we are part of the system. The request was that the participants play the roles.

    I think it's acceptable to have the Alarm Signal role be a bit ambiguous. After all, in the stipulated variant, the alarm is vague.

  Another issue: The swap in Phase 2 might not effectively challenge continuity. The Explainer might just adjust without missing a beat. That's okay because it shows that the narrative continues even when the underlying actors change.

  Evidence that would make me change the design:
  - If in testing, participants don't engage in confabulation because the incentives aren't strong enough, we would need to adjust the scoring. For example, we could have the group rate the Explainer's confidence after each explanation? But that breaks the flow. Alternatively, we could have the Explainer compete against a hypothetical other Explainer.

  Minute-by-Minute Outline:

  0-5 min: Introduction and framing the activity as a perception/explanation game.
  5-10 min: Assign roles and explain rules to each subgroup (separately if needed, but time is short).
  10-35 min: Phase 1 - Actions (25 minutes for 8 actions: about 3 minutes per action including explanation).
  35-50 min: Phase 2 - Swap and continue (15 minutes for 8 actions? We might need fewer actions in Phase 2 to save time. Let's do 5 actions in each phase for a total of 10. Adjust timing: 25 minutes for 5 actions? That's 5 min per action. That might be too long. We need to be faster.

  Revised timing for actions:
  - Each action: Silent Group member performs (10-15 seconds), then Explainer explains (1 minute). So 1.5 minutes per action. For 8 actions: 12 minutes. Plus setup.

  Total for Phase 1:
  - 5 min: Setup (handing out cards, arranging objects).
  - 12 min: 8 actions (1.5 min each).
  - 3 min: buffer and Alarm Signal taps.

  Total: 20 minutes.

  Phase 2:
  - 5 min: Swap (while distracting the Explainer) and hand out new cards.
  - 8 min: 5 actions (1.5 min each).
  - 2 min: buffer.

  Total: 15 minutes.

  Revised Outline:

  0-5: Introduction and role assignment.
  5-15: Rules explanation (including scoring for Explainer) and setup (put objects on the table, hand out cards to Silent Group and Alarm Signal).
  15-35: Phase 1: 8 actions (20 minutes).
  35-40: Swap: Ask the Explainer to turn away and write down a summary of what has happened so far. Meanwhile, swap half the Silent Group and the Alarm Signal. Hand out new cards to the new Silent Group and the new Alarm Signal.
  40-50: Phase 2: 5 actions (10 minutes).
  50-55: Final tally of the Explainer's score (you calculate and announce a score, e.g., "You got 18 out of 24! Well done!").
  55-60: Hand out index cards for private answers, collect, and tally on the board.
  60-80: Debrief and discussion.
  80-90: Open discussion and wrap-up.

  This is tight. We might have to reduce the number of actions. For 8 people, we might do 5 in phase 1 and 3 in phase 2. For 16, we have more people so we can do more actions but we have to be quick.

  Final Design:

  We'll go with the above, being flexible on the number of actions to fit the time.

  Debrief Structure:
  1. Reveal the inspiration: split-brain patients.
  2. Map the roles: 
     - Silent Group = right hemisphere (acting on information without speech).
     - Explainer = left hemisphere (speaking, confabulating).
     - Alarm Signal = the coarse signal (vague unease).
  3. Highlight confabulation: the Explainer made up reasons without knowing the real ones, and the incentives encouraged it.
  4. The swap: continuity of the Explainer's narrative despite the change in the Silent Group.
  5. The tally: show the group's split on one, two, or broken.
  6. Open discussion with role-specific feelings.

  Now, write the participant rules in plain language.
answer: |-
  Below is a complete session design based on your requirements. I'll start with a quick-reference table, then provide detailed step-by-step instructions. The design focuses on creating an experiential "aha" moment about the one-or-two question through gameplay, using your stipulated partial-split variant (coarse alarm signal). It avoids lectures, upfront explanations, or technical jargon—participants uncover the philosophical tension by playing roles with built-in incentives.

  ### Quick-Reference Table
  | **Component**       | **Details** |
  |---------------------|-------------|
  | **Time**            | 90 minutes total |
  | **Roles**           | Explainer (1), Silent Actors (4-6), Alarm Sensors (1-2), Observers (remaining participants) |
  | **Materials**       | Whiteboard, index cards (30+), pens, 5 household objects (e.g., cup, book, key, spoon, toy) |
  | **Core Mechanics**  | Silent Actors perform object-based tasks; Explainer confabulates reasons; Alarm Sensors trigger vague unease; Observers track inconsistencies. Roles swap mid-activity. |
  | **Key Incentive**   | Explainer scores points for confident, consistent explanations. Hedging or "I don't know" loses points. |
  | **Adjustments**     | **8 people:** Reduce Silent Actors to 3, Alarm Sensors to 1. **16 people:** Add 1 Silent Actor and 1 Observer role. |
  | **Predictable Issues** | Explainer may resist confabulating; Alarm Sensors may over/under-signal; swap may cause confusion. Solutions included. |

  ---

  ### Session Design: "The Explainer Game"
  **Philosophical Goal:** Make participants *feel* the ambiguity of the one-or-two question through lived experience. The debrief (at the end) ties it to split-brain cases.

  #### Materials Needed
  - **Household objects (5):** Simple, versatile items (e.g., a red cup, a blue book, a key, a spoon, a small toy). Bring these in your bag.
  - **Index cards (30+):** For instructions, voting, and tracking.
  - **Pens (15):** Enough for all participants.
  - **Whiteboard:** To tally votes and track Explainer’s score.

  #### Roles and Rules (as explained to participants)
  Frame this as a "communication game" where rules create constraints. **Do not mention philosophy, brains, or split patients.** Use this exact wording:

  1. **Overview (2 min):**  
     "We’ll play a game about how we explain actions we see. There’s one Explainer, a few Silent Actors, one or two Alarm Sensors, and Observers. The Explainer scores points for good explanations—everyone else helps create the scenario. Rules are strict: no talking unless you’re the Explainer."

  2. **Role Assignments (3 min):**  
     Assign roles randomly (e.g., draw index cards labeled with roles):
     - **Explainer (1 person):** "You’re the only one who can speak. After each action, you’ll explain: (1) What the Silent Actor did, and (2) Why they did it. You score points for confident, clear explanations. You lose points if you say ‘maybe,’ ‘I don’t know,’ or change your story without reason. Highest score wins!"
     - **Silent Actors (4–6 people):** "You’ll each receive a secret instruction on a card (e.g., ‘Move the key under the book’). When called, you do the action without speaking, gesturing, or reacting. Keep your card hidden."
     - **Alarm Sensors (1–2 people):** "You’ll get a secret card with a trigger (e.g., ‘If any object is placed on the left’). If you see your trigger happen, signal the Explainer by standing up for 3 seconds. Don’t speak, point, or react. Your signal means ‘something feels off’—like a gut feeling—not what’s wrong."
     - **Observers (remaining participants):** "You track the Explainer’s story on index cards. Note each explanation and if it matches what you see. You’ll vote later on the Explainer’s consistency."

  3. **Scoring System (3 min, Explainer only):**  
     Privately tell the Explainer:  
     "You earn 1 point per explanation for confidence (clear, certain language).  
     You earn 1 point for consistency (no contradictions with past explanations).  
     You lose 2 points for hedging (e.g., ‘maybe,’ ‘I’m not sure’).  
     If an Alarm Sensor signals, you must acknowledge it in your explanation (e.g., ‘I felt uneasy, but I think…’). Fail to acknowledge, lose 3 points.  
     Your goal: Score 80%+ to ‘win’ (e.g., 16/20 points for 10 actions). I’ll track points secretly."

     **Why this works:** Incentives force confabulation. Points are abstract (no money), and "winning" is personal. Observers prevent gaming—they judge consistency, but Explainer doesn’t see their notes.

  #### Activity Flow (90-Minute Outline)
  | Time    | Phase               | Instructions & Key Steps                                                                                                                                 |
  |---------|---------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------|
  | 0-10 min| Setup               | Assign roles. Place objects on a table. Give Alarm Sensors their trigger cards (e.g., "If the cup is moved," "If two objects touch"). Give Silent Actors their action cards. Observers get pens/cards. |
  | 10-40 min| **Phase 1: Actions** | Silent Actors perform one-by-one. After each action: <br> 1. Alarm Sensors signal if triggered (vague unease). <br> 2. Explainer gives a 30-second explanation. <br> 3. (Facilitator) Track score secretly. <br> *Do 8-10 actions.* |
  | 40-50 min| **Swap & Reset**    | "We’re pausing to reset." Distract Explainer (e.g., "Write your best explanation so far"). Swap roles: <br> - Move 50% of Silent Actors to Observers. <br> - Move 50% of Observers to Silent Actors. <br> - Swap Alarm Sensors for new ones. Give new secret cards. |
  | 50-75 min| **Phase 2: Continued Actions** | Repeat Phase 1 with new Silent Actors. Explainer continues explaining *as if nothing changed*. Observers note if explanations "fit" the old story. |
  | 75-80 min| Private Vote        | Hand out index cards: "After playing, do you think the group was: (a) ONE person, (b) TWO people, or (c) a BROKEN question? Write ONLY a, b, or c." Collect and tally on whiteboard. |
  | 80-90 min| Debrief             | Reveal the split-brain inspiration. Link experiences to the philosophical question. Structure: <br> 1. "Today mirrored split-brain cases." <br> 2. Map roles to hemispheres. <br> 3. Discuss vote tally. <br> 4. Open discussion. |

  ---

  ### Key Mechanics Explained
  - **Generating Confabulation:** The Explainer’s scoring (confidence = points, doubt = penalties) forces invented reasons. Silent Actors’ secrecy ensures the Explainer has no real information. Observers create accountability—participants see the gap between truth and story.
  - **Coarse Alarm Signal:** Alarm Sensors introduce "vague unease" (standing up). This is your stipulated variant. In practice, it feels like a "shared discomfort" (e.g., Explainer says, "I felt off but think it’s because..."), letting participants interpret it as unity (one person’s unease) or division (clash of two streams).
  - **The Swap:** Swapping Silent Actors mid-game tests continuity. The Explainer’s story must adapt seamlessly, raising "same person over time?" without explicit prompts. Observers often spot disconnects, unsettling confidence.
  - **Voting:** Private votes ensure honest responses before discussion. Tally includes "Broken question" (option c) to validate skepticism.

  ---

  ### Debrief Script (20 min)
  **Do this after voting.** Use the whiteboard to map experiences:  
  1. **Reveal the inspiration (2 min):**  
     "Today’s game mirrors real people who had brain surgery for epilepsy. The surgery cuts nerves connecting brain halves. One half sees things but can’t speak; the other speaks but makes up reasons for actions. Like our game."  

  2. **Map roles to hemispheres (3 min):**  
     - "Silent Actors = the ‘seeing’ half (right hemisphere). It acts but can’t talk."  
     - "Explainer = the ‘speaking’ half (left hemisphere). It explains everything, even without info."  
     - "Alarm Sensors = the ‘coarse signal’ in partial splits. A vague sense something’s wrong, but no details."  
     - Observers = your own awareness tracking the story."  

  3. **Tie to the activity (5 min):**  
     - "Confabulation: The Explainer invented reasons because the rules rewarded confidence. Real patients do this too—no one feels a ‘gap.’"  
     - "The Alarm Signal: Did it feel like one person’s unease? Or a clash between two? Our game left this open—you might disagree."  
     - "The Swap: When actors changed, the Explainer’s story continued. But is it the same ‘person’ if the parts change? This challenges whether ‘one person’ is a moment-by-moment or long-term question."  

  4. **Discuss votes (5 min):**  
     Point to tally: "Many split-brain cases get similar votes—no consensus. Why? Maybe ‘person’ isn’t a yes/no thing. Or maybe the question breaks when actions and explanations split."  

  5. **Open discussion (5 min):**  
     Start with: "What felt strangest in your role?" Then broaden to: "Did this change how you see ‘you’?"  

  ---

  ### Predictable Problems & Solutions
  1. **Problem: Explainer resists confabulating.**  
     - *Why:* They might feel dishonest or fear looking foolish.  
     - *Solution:* Gently enforce rules: "Remember, hedging loses points. Give your best guess!" If stuck, say: "You’re doing great—just commit to one idea."  
     - *Adjustment:* If severe, simplify actions (e.g., "move the cup left") to reduce ambiguity.  

  2. **Problem: Alarm Sensors signal too much/too little.**  
     - *Why:* They may misunderstand "vague unease" or forget triggers.  
     - *Solution:* Prep them: "Only stand if your card’s exact trigger happens." Use clear triggers (e.g., "if the spoon points north"). If under-signaling, ask mid-game: "Alarm Sensors, anything feel off?" (This keeps vagueness).  

  3. **Problem: Swap causes confusion or Explainer notices.**  
     - *Why:* Participants may react to role changes.  
     - *Solution:* Distract Explainer during swap (e.g., have them summarize past actions). If noticed, say: "We’re rotating roles—keep explaining as before."  

  4. **Problem: Observers disengage.**  
     - *Why:* They lack active tasks.  
     - *Solution:* Emphasize their importance: "You’re the memory of this game—track every explanation." In debrief, ask: "Observers, did the story hold up?"  

  5. **Problem: Time runs short.**  
     - *Solution:* Reduce actions (Phase 1: 5 actions; Phase 2: 3). Skip the Explainer’s post-swap writing task.  

  **Group Size Adjustments:**  
  - **8 people:** Use 3 Silent Actors, 1 Alarm Sensor, 3 Observers. Reduce actions to 5 per phase.  
  - **16 people:** Add 1 Silent Actor and 2 Observers. Use two Alarm Sensors. Do 10 actions total.  

  ---

  ### Design Notes & Uncertainties
  - **Least Confident Choice: The Alarm Sensor role.**  
    - *Why:* I worry participants might see it as an "external referee" instead of an internal signal. This could weaken the "one-or-two" tension.  
    - *Test for Success:* If, in debrief, participants debate whether the signal "belonged" to the Explainer or the group, it worked. If not, emphasize this in debrief: "Was that unease part of one person or a collision?"  
    - *If it Flops:* Simplify. Make the Alarm Sensor internal—e.g., only the Explainer feels "off" when triggers happen (no role needed). But your variant is richer, so I kept it.  

  - **Contested Assumption: "Confabulation requires incentives."**  
    - *Why:* Some philosophers argue confabulation is automatic; others say it needs social pressure. I added scoring to ensure it happens.  
    - *Evidence to Change:* If Explainer confabulates freely without points, drop scoring. Say: "Explain confidently—we’ll score you later."  

  - **What the Activity Can’t Capture:**  
    - **The single-body problem.** Real split-brain patients share one body; our game uses multiple people. This may bias participants toward "two."  
    - **Debrief Solution:** Say: "In real cases, both halves share arms/eyes. Here, we used separate people to mimic separate ‘awarenesses.’ Does that change your vote?"  

  - **Other Risks:**  
    - Participants may focus on "winning" and miss the point. Use debrief to reframe: "The game wasn’t about points—it was about how you explained."  
    - The swap may feel gimmicky. In debrief, stress: "We changed parts, but the Explainer’s story persisted. Is that how ‘you’ stay the same over time?"  

  This design prioritizes experience over explanation. By the vote, participants will already feel the question’s force—no lecture needed. The debrief ties it together without jargon. Run it as-is, and adjust Alarm Sensors or scoring next time based on how confabulation unfolds.
