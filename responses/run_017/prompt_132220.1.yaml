prompt: |-
  Hey — I'm putting together the framing doc for a grad seminar on reduction and emergence, and I want the criteria settled before we look at any positions. So: write me the desiderata that any adequate account of reduction (and of its failure, i.e. emergence) has to meet.

  Purpose, so you know what "adequate" means here: the theory should be good enough to say something action-guiding to a working scientist. She's got a macro-level model — a climate model, a population-genetics model, a model of flock behaviour — and a micro-level one, and she wants to know whether it's worth hunting for a derivation of the first from the second, and what it would even mean if there isn't one. So it's not a metaphysical theory of nature's levels for its own sake; it needs consequences for modelling practice.

  For each requirement, give the case or consideration behind it, and be honest about which ones are genuine constraints and which are just what one camp happens to demand. At minimum I want these on the table:

  - Derivation isn't enough: the classic bridge-principle story needs something on top of deducibility even in the easy cases, since the macro vocabulary doesn't appear in the micro one. What exactly does reduction have to add over and above "you can deduce it"?
  - Multiple realizability: the macro kind gets realized by wildly heterogeneous micro states. Is that a knockdown, or only a demand for a disjunctive bridge law — and what does each answer cost you?
  - The exclusion worry: if the micro story is causally complete, what's left for the macro to do? I want the desideratum here, not the solution.
  - Decoupled macro behaviour: cases where the macro regularity shrugs off changes in micro details you'd have expected to matter (critical phenomena and universality, that sort of thing). Should a theory of reduction be required to explain why the micro details drop out, or is that a separate virtue we're smuggling in?

  Two things I care about most.

  First, I think there's a conflation running through most of this literature and I want the list to force it open: a claim about what exist (are there macro properties over and above the micro ones), a claim about what can be derived (is there a derivation, and how strong is it), and a claim about what's predictable or controllable in practice (do you need the macro model to get the answer at all, even in principle). Those can come apart in both directions. Make each of them a seperate requirement, say which one the "autonomy of the special sciences" arguments actually need, and flag which one you think people really mean when they say "emergent".

  Second, there's a failure mode I've started calling phantom reduction: the micro model gets tweaked, in ways nobody thinks of as cheating, until it reproduces the macro behaviour — extra terms, fitted parameters, a convenient choice of boundary conditions — and everyone declares reduction achieved, but nothing has been explained and the tuned micro model predicts nothing outside the regime it was fitted in. I want a requirement that rules that out, and I want you to argue for what it should be: what has to be true of a reduction beyond output-matching? Novel prediction outside the fitted regime? Stability of the derivation under perturbation of the micro assumptions? Bridge principles that are independently checkable? Then say whether your requirement is satisfiable at all, and whether it quietly collapses back into the multiple-realizability requirement or is genuinely independent of it.

  Then: is any subset of your own list jointly unsatisfiable? If so, which, and why — that's the part I most want to see. And name the single requirement that does the most work in excluding candidate accounts, plus the one you'd drop first if you had to drop one.

  Last, a short scorecard (table is fine, a paragraph each is fine) for three familiar shapes of view: the bridge-law / deduce-the-macro-from-the-micro-plus-bridges picture; the "reduction is a limit or approximation relation between models" picture, renormalization-group and continuum-limit style; and the "emergence is about the causal powers of macro configurations" picture. Just enough to see where each breaks against your list. And please don't pad it with a reading list or citations — I know the literature, I'm after the criteria.
reasoning: |-
  Okay, let me tackle this step by step. The user is designing a grad seminar on reduction and emergence, and needs clear desiderata for evaluating theories. The focus is practical: what guidance can the theory offer a scientist deciding whether to derive macro from micro models? 

  First, I need to unpack the user's explicit requirements. They want desiderata that separate three often-conflated aspects: existence (ontology), derivability (epistemology), and predictability/controllability (pragmatics). The user also highlights "phantom reduction" as a key failure mode where models are tweaked to fit but lack explanatory power. 

  The user's frustration with conflation in literature resonates. Many debates talk past each other because one side argues about ontological emergence while the other focuses on practical irreducibility. I should structure desiderata to force clarity here. For phantom reduction, the core issue seems to be explanatory depth versus mere output matching. Stability under perturbation feels promising as a criterion—if the derivation breaks with tiny micro-changes, it's likely just curve-fitting.

  Multiple realizability is tricky. The user wants to know if it's a dealbreaker for reduction or just requires disjunctive bridges. The cost: disjunctive bridges might save derivability but sacrifice explanatory unity, which matters for scientific utility. Exclusion worry ties to causal completeness—if microphysics is closed, can macro properties do real work? This feels ontological but has pragmatic implications (e.g., should we invest in macro-level interventions?).

  For decoupled macro behavior (like universality), the question is whether reduction theories must explain micro-insensitivity or if that's extra. Given the user's focus on scientific utility, it should be a desideratum—scientists need to know when micro-details are irrelevant.

  Now for the three-aspect separation:
  - Ontological: Do macro properties exist distinctly? (Relevant to exclusion worry)
  - Derivability: Can we mathematically derive macro from micro? (Bridge-law focus)
  - Pragmatic: Is the macro model indispensable for prediction/control? (Where autonomy arguments bite)

  Phantom reduction needs a robustness requirement. Novel prediction is ideal but not always feasible. Stability under micro-perturbations is more broadly applicable—does the derivation hold if we nudge auxiliary assumptions? This differs from multiple realizability, which is about variability across systems, not within a single derivation.

  Possible tension: If we demand both strict derivability (requirement 3) and pragmatic autonomy (7), they might conflict when derivation is possible in principle but useless in practice. That's precisely the conflation to expose—theories should specify which they're addressing.

  For scorecards:
  - Bridge-law: Cleans derivability but flunks multiple realizability and phantom reduction (since bridges can be gerrymandered). 
  - Renormalization-group: Excels at decoupled behavior and pragmatics but dodges ontology. 
  - Causal-powers: Handles exclusion but struggles with derivability demands.

  The user's deep need: criteria sharp enough to dissect positions in seminar debates. They'll want clear tradeoffs—e.g., "if you prioritize explanatory unity, drop bridge-laws; if you care about prediction, embrace renormalization." The exclusion requirement (5) likely filters hardest—it trips up bridge-laws and renormalization if causal closure is strict. I'd drop requirement 6 (decoupling explanation) first if forced; it's valuable but not core to reduction's definition.
answer: |-
  Here are the desiderata for an adequate account of reduction/emergence, designed to clarify practice-oriented tradeoffs and force open key conflations. Requirements are grouped by core themes, with justifications and honesty about constraints.

  ---

  ### **Core Desiderata for Reduction/Emergence Accounts**  
  *(Framed for scientific modeling practice)*  

  1. **Vocabulary Translation Requirement**  
     - **What**: Must specify how macro-terms (e.g., "temperature," "fitness") map to micro-terms (e.g., "mean kinetic energy," "allele frequency") *beyond mere deducibility*.  
     - **Why**: Derivation alone is insufficient; bridge principles must be non-gerrymandered (e.g., "temperature = mean kinetic energy" is informative; "temperature = whatever causes mercury to expand" is not).  
     - **Constraint? Genuine**: Without this, deduction is trivialized (e.g., fit *any* macro-pattern by inventing micro-bridges post hoc).  

  2. **Multiple Realizability (MR) Handling Requirement**  
     - **What**: Must address whether MR (e.g., pain realized by diverse neural states) blocks reduction or merely demands disjunctive micro-bases.  
     - **Why**: If MR forces disjunctive bridges (e.g., "fitness = state A *or* B *or* C..."), reduction may lose explanatory power.  
     - **Constraint? Contested**: Anti-reductionists see MR as fatal; reductionists accept disjunctions if they’re projectable/nomological. *Cost*: Disjunctions risk vacuity if unconstrained.  

  3. **Derivation Robustness Requirement**  
     - **What**: A "reduction" must derive macro-behavior *without tuning micro-parameters to fit the macro-phenomenon*.  
     - **Why**: Blocks "phantom reduction" (e.g., adding ad hoc micro-forces to match flocking models).  
     - **How to enforce?**: Require either:  
       - (a) *Novel predictions* from the micro-model beyond the fitted macro-data, *or*  
       - (b) *Stability*: Derivation holds under perturbations of micro-assumptions/parameters.  
     - **Independent of MR? Yes**: MR concerns heterogeneity *across systems*; this concerns honesty *within a derivation*.  

  4. **Causal Exclusion Handling Requirement**  
     - **What**: Must address how macro-causes (e.g., "inflation caused recession") relate to micro-causal completeness (e.g., "neurons caused behavior").  
     - **Why**: If microphysics is causally closed, macro-causation appears redundant.  
     - **Constraint? Genuine (but ontological)**: Scientists need to know if macro-models track *real causal differences* or are mere heuristics.  

  5. **Decoupling Explanation Requirement**  
     - **What**: Must explain *why* macro-regularities are insensitive to micro-details (e.g., universality in phase transitions).  
     - **Why**: Scientists care when micro-details "don’t matter" (e.g., modeling fluid flow without tracking molecules).  
     - **Constraint? Optional but valuable**: Not all reduction theories *must* explain this, but it’s a virtue for scientific utility.  

  ---

  ### **The Tripartite Split Requirement**  
  *(To disentangle conflations)*  
  6. **Ontological Distinctness**  
     - **What**: Does the account clarify whether macro-properties exist *over and above* micro-properties?  
     - **"Autonomy" need?**: Only for arguments about *causal efficacy* (e.g., macro-properties as difference-makers).  

  7. **Derivability**  
     - **What**: Does reduction require strict mathematical derivation (with bridges)?  
     - **"Autonomy" need?**: Anti-reductionists (e.g., Fodor) target this to defend special sciences.  

  8. **Pragmatic Indispensability**  
     - **What**: Is the macro-model *necessary for prediction/control*, even if derivation exists?  
     - **"Autonomy" need?**: Crucial for scientific practice (e.g., climate models beat quantum derivations).  
     - **What "emergence" usually means**: Pragmatic indispensability + failed derivability.  

  ---

  ### **Tensions & Tradeoffs**  
  - **Key Tension**: Requirements **3 (Derivation Robustness)** and **7 (Derivability)** conflict with **8 (Pragmatic Indispensability)**. If a derivation exists *in principle* but is computationally intractable/unstable, scientists still need macro-models.  
  - **Most Exclusionary Requirement**: **3 (Derivation Robustness)**. It filters phantom reductions (e.g., tuned Hamiltonian "deriving" thermodynamics without explanatory insight).  
  - **Drop First**: **5 (Decoupling Explanation)**. While important, it’s separable from core reduction criteria (some accounts explain it; others don’t need to).  

  ---

  ### **Scorecard: Three Views vs. Requirements**  
  | **Requirement**               | **Bridge-Law/Deduction** | **Renormalization/Approximation** | **Causal Powers** |  
  |-------------------------------|--------------------------|-----------------------------------|-------------------|  
  | **1. Vocabulary Translation** | ✅ (Explicit bridges)    | ⚠️ (Effective descriptions)       | ❌ (Ignores)       |  
  | **2. MR Handling**            | ❌ (Fragile to disjunctions) | ✅ (Embraces universality)      | ✅ (MR as strength) |  
  | **3. Derivation Robustness**  | ❌ (Ad hoc bridges possible) | ✅ (Stable under coarse-graining) | ❌ (Not deriv-focused) |  
  | **4. Exclusion Worry**        | ❌ (Macro causes epiphenomenal) | ⚠️ (Depends on variant)         | ✅ (Macro powers real) |  
  | **6. Ontological Distinctness**| ❌ (Reduces to micro)    | ⚠️ (Emergent in a weak sense)    | ✅ (Strong emergence) |  
  | **7. Derivability**           | ✅ (Core tenet)          | ⚠️ (Approximate/asymptotic)      | ❌ (Denies)         |  
  | **8. Pragmatic Indispensability** | ❌ (Derivation implies dispensability) | ✅ (Justifies macro-models)      | ✅ (Essential)       |  

  - **Bridge-Law View**: Fails MR, Robustness, and Exclusion. Strong on derivability but vulnerable to phantom reduction.  
  - **Renormalization View**: Excels at Robustness, MR, and Pragmatics. Weak on ontology (is coarse-graining "real" emergence?).  
  - **Causal Powers View**: Best on Ontology/Exclusion, but rejects derivability—risks severing science from reduction.  

  ---

  **Bottom Line for Scientists**:  
  - **Hunt for derivation if**: (a) Bridges are natural (Req 1), (b) MR is low, (c) Robustness possible (Req 3).  
  - **Stick to macro-model if**: (a) Derivation is fragile/phantom, (b) Pragmatic indispensability holds (Req 8), (c) Macro-causation is irreducible (Req 4).  
  - **Emergence ≈** Failed derivation *plus* pragmatic/ontological autonomy (Reqs 7+8+6). Phantom reduction fails Req 3.  

  No view satisfies all requirements—choose based on whether you prioritize derivability (bridges), predictability (renormalization), or causality (powers).
