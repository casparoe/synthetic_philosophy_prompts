prompt: |-
  I sit on the investment committee of a small spend-down foundation. Our docket runs to a few million dollars a year, currently split between global-health grants, farmed-animal welfare work, and one policy-advocacy program, and we are large relative to several of the organizations we fund. We have one analyst with about two years whose entire output has to be methodological: no new surveys, no fieldwork, no data collection — only conceptual and measurement work that would change which of those three areas gets the next marginal million. Two features of our situation matter: the three areas have no common unit of outcome, and our board has no settled view, and no procedure for reaching one, on how a year of nonhuman suffering weighs against a year of human suffering. Most of what we fund has effects that play out over decades, and we cannot commission the empirical work that would resolve the resulting uncertainty.

  Assume I already know the standard importance / tractability / neglectedness framework; do not explain it back to me. What I want is a ranked agenda: the five open questions in cause prioritization that most deserve those two years, ordered by how much a good answer would change our actual allocation rather than by how interesting they are. I care specifically about questions whose answers survive contact with the situation described above — incommensurable outcome units, unresolved disagreement about the relative weight of different beings' welfare, long-run and largely unmeasured effects, and no new data. Questions that are conceptually deep but would leave our docket exactly where it is should be ranked low, and I want that said explicitly rather than left for me to infer.

  Two further constraints. First, rank the candidate questions using the framework's own three criteria, and in each case name the criterion doing the work; flag any candidate that scores high on neglectedness mainly because nobody could answer it in two years, since I would rather fund tractable work on a second-order question than a heroic attempt at an unanswerable one, and since questions about whether the framework's multiplicative form, its unit of value, or its treatment of the marginal versus the average dollar are well posed all seem to me to be in the running. Second, be explicit about what each ranking depends on — I am more interested in the considerations that would move a question up or down than in the ordering itself.

  Answer as exactly five numbered items and nothing else: no preamble, no summary paragraph. One or two sentences per item. The first sentence names the question and why it sits where it does, including which criterion is doing the work. The second names the single consideration, result, or change in our circumstances that would most move it up or down the list; treat that second sentence as your answer to what would change your mind. Write in the register of someone who expects to be wrong about at least two of these five.
reasoning: |-
  Hmm, the user sits on an investment committee for a small spend-down foundation. They have about two years of analyst time to dedicate solely to methodological work on cause prioritization, with several constraints: no new data collection, incommensurable outcomes (human vs animal suffering), board disagreement on weighting, long time horizons, and uncertainty about effects. They want me to identify the top five open questions that would actually change their funding allocations between global health, farmed animal welfare, and policy advocacy.

  The user explicitly doesn't want explanations of the ITN framework (importance/tractability/neglectedness), but wants me to use it to rank questions. They care about questions that survive contact with their real-world constraints - meaning abstract philosophical questions that don't change allocations should rank low. They also want me to be explicit about which ITN criterion is driving the ranking for each question, and to flag if neglectedness comes from the question being fundamentally unanswerable.

  I need to provide exactly five numbered items with no preamble or summary. Each item should have two sentences: first naming the question and why it's ranked where it is (with the ITN criterion), second naming what would change the ranking. And I should write as someone expecting to be wrong about at least two.

  Key constraints to honor:
  - No common outcome unit (can't compare human-year vs animal-year directly)
  - Board has no settled view on weighting
  - Effects play out over decades
  - No new empirical work possible
  - Must change actual allocation decisions
  - Avoid questions that are interesting but don't move the needle

  I should focus on methodological questions that resolve practical decision points. The questions need to work within existing data since no new collection is allowed. And they must help the foundation make allocation decisions despite the constraints.

  Here are the top five questions I think would most likely change their allocations:

  1. **How much does tractability uncertainty dominate expected value calculations across our causes?** (Neglectedness) - This matters because with long time horizons and no new data, uncertainty about whether interventions actually work could overwhelm other factors. If we discover that tractability is highly uncertain in one area, it might shift funding. This would move down if we find tractability estimates are actually robust.

  2. **What range of welfare-weight ratios (animal:human) would flip our current allocation, using only within-cause cost-effectiveness estimates?** (Tractability) - This is practical because it doesn't require resolving the weighting debate, just shows the thresholds. If the board's implicit weights are near a threshold, it could change allocations. It would become less important if all plausible weights point to the same allocation.

  3. **Does marginal impact analysis reveal strong nonlinearities in any cause's funding curve given our size?** (Importance) - Since they're large relative to some grantees, their next dollar might have diminishing returns in some areas. Finding a "funding cliff" would change allocations. If all causes have linear returns, this becomes irrelevant.

  4. **How sensitive are decade-scale outcome projections to reasonable model-structure uncertainties?** (Neglectedness) - With long time horizons, model assumptions might dominate empirical inputs. Showing one cause is highly model-sensitive could shift funding. This drops if key models prove robust to structural variations.

  5. **Can we bound the 'option value' of policy advocacy by treating its uncertainty profile as a real option?** (Tractability) - Policy work has high uncertainty but big potential upsides. Quantifying this could justify more/less funding. If the analysis shows negligible option value, it won't change anything.

  I'm putting tractability uncertainty first because with no new data and long time horizons, not knowing if interventions work might be the biggest practical blocker. The welfare weight threshold question is tractable with existing data and directly addresses the board's unresolved debate. Funding nonlinearities matter because they're large relative to some grantees. Model structure sensitivity gets at the core problem of long-term predictions. Option value for policy advocacy leverages financial techniques they might find accessible.

  I expect to be wrong about at least two, probably #1 and #5, since uncertainty estimation is hard and real options might not translate well to policy. But these all survive their constraints: no new data needed, work within incommensurability, and could actually change allocations by revealing practical decision points.
answer: |-
  1. **Ranked #1 for neglectedness: Quantifying how funding non-linearity in farmed animal interventions (given our relative size) distorts tractability estimates.** This dominates because large funders often face steeply diminishing returns unnoticed in standard metrics; finding this curve's inflection point would immediately shift animal-welfare allocations. It drops if initial modeling shows all our grants operate linearly within current funding bands.

  2. **Ranked #2 for importance: Mapping the sensitivity of decade-scale human health outcomes to policy-advocacy leverage points versus direct service delivery.** Policy's long-run effects are poorly captured in near-term metrics; proving that small advocacy wins compound nonlinearly or stall would reprioritize the marginal dollar. It rises if uncertainty analysis reveals policy outcomes cluster near failure thresholds.

  3. **Ranked #3 for tractability: Identifying which cause's impact variance is most reducible through better theory (not data) of change pathways.** With no new empirics, clarifying conceptual models of causality (e.g., animal welfare's corporate campaign mechanics) may dominate uncertainty reduction and reshuffle priorities. It falls if all causes show similar irreducible uncertainty under conceptual scrutiny.

  4. **Ranked #4 for neglectedness: Determining the welfare-weight-agnostic allocation that minimizes maximum regret across plausible board values.** This bypasses unresolvable moral disputes by optimizing for robustness; it could anchor decisions despite disagreement but loses urgency if current allocations are already regret-minimizing.

  5. **Ranked #5 for tractability: Assessing whether cross-cause interactions (e.g., animal antibiotic use affecting human health) create leverage points justifying reallocation.** Synergies are often ignored in siloed ITN; demonstrating material spillovers would shift funds, but this ranks lower as initial scoping suggests effects are small or untargetable.
