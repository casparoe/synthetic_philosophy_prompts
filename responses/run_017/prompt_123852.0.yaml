answer: |-
  ### **Utility Aggregation Game: "The Chip Dilemma"**  
  **Goal:** Students experience the psychological difference between intrapersonal/interpersonal utility tradeoffs and confront blurred personal boundaries. No prior theory discussion; focus on embodied stakes.  

  ---

  ### **Materials & Setup**  
  1. **Poker Chips:** 18 colors (1 per student), 20 chips/student.  
  2. **Snacks/Chores:** Use pre-survey data. Snacks (e.g., chocolate, fruit) and chore slips (e.g., "clean whiteboard," "rearrange chairs").  
  3. **Ledger:** Whiteboard with 3 columns:  
     - **Student** | **Chips Start** | **Net After Round**  
  4. **Envelopes:** Each student gets one to hold their chips.  
  5. **Rules:**  
     - Chips are **non-transferable** (can only be spent on *yourself*).  
     - Negative net chips = draw a hated chore. Positive net = redeem for snacks (1 chip = 1 snack unit).  
     - Majority vote decides group actions. Anyone can opt out of any vote (no penalty).  

  ---

  ### **Phase-by-Phase Rundown**  
  *(Total: 90 minutes)*  

  #### **Phase 1: Sacrifice Now, Gain Later (Intrapersonal)**  
  **(0-20 min)**  
  - **Scenario:** "A medical treatment causes short-term pain (cost) but long-term health (benefit). *You are deciding for your future self.*"  
  - **Mechanics:**  
    - Each student **votes** on:  
      - **Option A:** Do nothing (no change).  
      - **Option B:** Lose 3 chips now. Gain 8 chips in 10 minutes.  
    - If B wins, all lose 3 chips *immediately* (record in ledger).  
    - After 10 min, all gain 8 chips (update ledger).  
  - **Debrief Hook (TA notes):**  
    - *"Notice how easily you sacrificed now for later—no guilt. Time within one life feels seamless."*  

  #### **Phase 2: Sacrifice *You*, Gain for *Us* (Interpersonal)**  
  **(20-45 min)**  
  - **Scenario:** "A project helps the group but harms one person. *You decide for the group.*"  
  - **Mechanics:**  
    - **Vote 1:** Approve the project? (Yes/No).  
      - If yes: **Randomly select 1 "target"** (volunteers allowed; if none, draw from hat).  
    - **Effect:**  
      - Target loses 10 chips.  
      - All others gain 2 chips.  
    - **Complaint Rule:** If the target’s net chips are negative, they **stand and state a grievance** (e.g., "I lost more than anyone!"). Group must respond with *reasons* (not chip offers).  
  - **Debrief Hook:**  
    - *"Even with net group gain (+26 chips), the cost is *felt*—it’s not just numbers."*  

  #### **Phase 3: Blurred Boundaries ("Are We One or Two?")**  
  **(45-70 min)**  
  - **Scenario:** "Two students merge consciousness for this round. *Their experiences are shared.*"  
  - **Mechanics:**  
    - Randomly pick **2 students** (or ask for volunteers). Announce: "You are one stream of consciousness. You share chips and experiences."  
    - Merge their chips into **one joint pile** (e.g., if each had 15, new total = 30).  
    - **Group Vote:** Approve a project where the "merged unit" loses 8 chips, but *each* of the other 16 gains 3 chips (net +40 chips).  
    - **Key Twist:** After the vote, ask:  
      - *"Should the merged unit’s loss count as hurting* one *person or* two *when we tally total well-being?"*  
      - Vote: Count the loss as "one unit" (8 chips) or "two people" (4 chips each)?  
  - **Debrief Hook:**  
    - *"Does aggregation feel different when boundaries are fuzzy? What if one person splits into two post-injury?"*  

  ---

  ### **Handling Predictable Issues**  
  - **"Nice Group" Veto:** If Phase 2 vote fails:  
    - Add stakes: "If no project, *all* lose 2 chips (opportunity cost)." Forces engagement.  
  - **Dominant Student:** Assign roles (e.g., "chip counter," "vote tracker") to distribute power.  
  - **Read-Ahead Students:** If they name-drop (e.g., "Rawls!"), respond: *"Hold that thought—let’s see what the game reveals first."* Write their point on the board for the debrief.  
  - **Opt-Outs:** If someone refuses to be the Phase 2 target, use it: *"Why did we hesitate to force this cost?"*  

  ---

  ### **Debrief Framework**  
  **(70-90 min)**  
  1. **Map the Game to Theory:**  
     - Phase 1 → **Intrapemporal aggregation** (utilitarianism over time: easy).  
     - Phase 2 → **Interpersonal aggregation** (the "separateness" objection: hard).  
     - Phase 3 → **Boundary problems** (identity fission/fusion).  
  2. **Key Questions:**  
     - *"Why did Phase 2 feel unfair even with net gain? How did Phase 3 complicate that?"*  
     - *"Does ‘total utility’ ignore whose pain it is?"*  
  3. **Reveal the Theory:**  
     - Only now name "separateness of persons" (Nozick, Rawls). Contrast with utilitarianism’s aggregative logic.  
  4. **What the Game *Can’t* Capture:**  
     - The **moral weight of individuality** (e.g., rights, autonomy). State: *"The game shows *discomfort* with aggregation, but not *why* separateness might be morally fundamental."*  

  ---

  ### **Logistical Notes**  
  - **Snacks/Chores:** Calculate redemptions quickly (e.g., 5+ chips = snack; negative chips draw chore slips).  
  - **Time Buffer:** Phase 3 may run long—cut vote discussions at 5 mins.  
  - **Emotional Safety:** No one is forced to speak. If a "target" is distressed, acknowledge: *"Your reaction shows why this matters."*  

  This design forces confrontation with aggregation’s emotional stakes while sidestepping theory-laden debates. The blurred-boundary round destabilizes intuitions without sci-fi abstraction, making the "separateness" objection feel newly problematic.
