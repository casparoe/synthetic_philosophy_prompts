prompt: |-
  Hi — I'm the TA for a second-year seminar (something like "Utilitarianism and its Critics"), 18 students, one 90-minute session, one room with a whiteboard and chairs that move, no tech beyond that and no budget. I've got the session after the midterm and I want to run it as an activity rather than a discussion, because every time this topic comes up in section the students can recite the standard moves and clearly don't feel any of them. So: design me a runnable game or staged decision sequence, with rules, materials I can actually get, a payoff scheme using snacks / mildly annoying chores / poker chips rather than money (I'm happy to run a quick anonymous pre-class survey of each student's favourite snack and most-hated small chore so the stakes are real for them specifically), and a round-by-round timeline with minute marks.

  Here's what I want them to walk into. Phase one: they should discover that they aggregate costs and benefits across *time within a single life* completely happily — sacrifice now for a much better later, obviously fine, no one bats an eye. Phase two: the structurally identical trade across *different* people, and I want the mechanic arranged so that someone actually has to be picked and actually bears something, and so that the group can feel the difference between "the total went up" and "this person has been answered." I've been toying with a rule where the chips are colour-coded per person and can't be traded, only spent on the person whose colour they are, and where anyone who ends up net-negative gets to stand up and state a complaint that has to be answered *to them* rather than to the ledger. Not sure that's the right device.

  Then the part I really can't get to work, and which is the reason I want them to hit the thing rather than hear it: I want a later round where the "persons" aren't cleanly separate, so their resistance in phase two gets destabilised from the inside. Two variants I've been playing with, both of which I've only got half-built: (a) tell the group that two specified participants are, for the purposes of the exercise, sharing a single stream of consciousness for the session, and see whether the group now happily aggregates between them the way it refused to before — and then, the nasty bit, whether a good experience shared by those two counts once or twice when they tot up the ledger; (b) a case where one person's stream continues as *two* equal continuer-streams afterwards, so there's a genuine question whether the cost you impose is imposed on one person or two, or on one-and-a-bit. The point I want ambushed is that the force of the objection seems to track how *distinct* the subjects are, and distinctness looks like it comes in degrees — which is something I don't think any of them will have considered, and which the tidy version of the objection doesn't have room for. If you think these variants are a dead end, replace them with your own, but please keep some version of the "not-fully-separate-persons" move in there, and don't let it turn into a sci-fi Bull session — I need the mechanic to force a decision.

  Constraints, sorry for the list: no lecture up front and nobody should hear the phrase "separateness of persons" (or any famous name attached to it) until the last ten minutes — and tell me what to do with the two students who have definitely read ahead and will try to name it in minute five. Nothing painful, no deception, and anyone must be able to opt out silently without it being a Thing; in particular, if someone refuses to be the person who bears the cost, that should be usable material rather than a derailment. Then give me the debrief: which moments in the activity are supposed to map onto which part of the idea, what will predictably go wrong the first time I run it (I'm assuming the group just votes to be nice and the ledger never gets used, or one confident student becomes the de facto treasurer), and be honest about which feature of the objection the activity cannot reproduce and I'll just have to state myself. I should also say — I'm asking you, not the students, so no reading list or citations, and assume none of us goes and looks anything up.
reasoning: |-
  We are designing a game with three phases. The goal is to have students experience the aggregation of costs and benefits within a single life (phase one), then across different persons (phase two), and then in a scenario where the boundaries between persons are blurred (phase three). We'll use poker chips as tokens of utility, with each student having their own color. The chips can be spent to gain snacks (positive utility) or to avoid chores (negative utility). We'll have a ledger to track the net chips for each student.

  Materials:
  - Poker chips in 18 different colors (one color per student). If that's not feasible, use colored paper or index cards with student names. Each student gets 10 chips of their color at the start.
  - A ledger (a large sheet of paper or whiteboard) to record transactions and net chips per student.
  - Envelopes or small containers for each student to hold their chips.
  - Snacks: based on pre-class survey, have a variety of individually wrapped snacks that students ranked highly. Also, have a list of "mildly annoying chores" (e.g., erase the whiteboard, stack chairs, pick up litter in the classroom, etc.) that students pre-ranked as most hated.

  Stakes:
  - At the end of the game, any student with a positive net chip count can exchange each chip for a small snack (e.g., one chip = one mini candy bar, or a few chips for a better snack). We might need to scale the payoffs so that it's feasible (maybe 5 chips = one snack item).
  - Any student with a negative net chip count must perform a chore. The chore is drawn randomly from a hat containing the chores they ranked as most hated (but we'll ensure it's one they rated highly as hated). The number of negative chips determines the duration or intensity? To keep it simple: one negative chip = one minute of chore? But that might be too much. Alternatively, we can say that any negative balance (even one chip) means they have to do one chore (from their top 3 most hated) for a fixed time (say 2 minutes). We'll adjust so that the chore is mildly annoying but not too bad.

  Pre-class:
  - Survey: Each student lists their top 3 favorite snacks and top 3 most hated small chores (with the understanding that these will be used in the activity). We'll use this to prepare.

  Rules:
  1. Each student starts with 10 chips of their own color.
  2. Chips are non-transferable: you can only use your own chips to buy snacks or avoid chores. You cannot give your chips to someone else.
  3. Transactions: During the game, the TA will propose scenarios (rounds) in which the group can choose to take actions that affect chip totals. The group must decide by majority vote (or consensus? but we want to avoid one person dominating, so maybe secret ballot? but that might slow down). We'll do open voting by show of hands for speed.
  4. The ledger records: for each student, chips added or subtracted. At the end, net chips = starting 10 plus/minus transactions.

  Phase One: Intrapersonal Tradeoffs
  - Scenario: "You are a student who has an important exam in two weeks. You can either study now (which is unpleasant) and get a good grade, or enjoy now and fail. But if you study now, you'll get a reward later."
  - Mechanic: The group is told that they are all the same person (so we are aggregating across time for one life). They must decide whether to take a cost now for a benefit later.
    - Option A: Do nothing. No change.
    - Option B: Each student (as part of the collective self) gives up 2 chips now (so subtract 2 from each). Then, in the next round (which is the same person, later), each student gets 5 chips added.
  - Voting: They vote on A or B.
  - Expected outcome: They choose B because the net gain is 3 per person. They see that sacrificing now for a better later is rational.

  Phase Two: Interpersonal Tradeoffs
  - Scenario: "There is a project that will create a lot of value for the group, but it requires one person to do a very unpleasant task. The group gains, but one person loses."
  - Mechanic: The group must choose one volunteer (or if no volunteer, we randomly select) to bear a cost. The selected person loses 5 chips. Then, every other student (the rest of the group) gains 2 chips.
  - Voting: First, vote on whether to do the project. If yes, then select the person (by volunteer or random draw). If no, then nothing happens.
  - Expected outcome: They might vote no because they don't want to force someone. Or if they vote yes, the selected person might complain. We want the feeling that even though the group net gain is positive (17 people * 2 = 34 gain, minus 5 loss, so net +29), the loss is concentrated and feels wrong.

  Complaint Rule: If the selected person ends up with a negative net (or even if they just lost 5 and are unhappy), they can stand up and state a complaint. The group must then address the complaint to the person's satisfaction (not to the ledger). They might offer to compensate, but remember: chips are non-transferable. So they cannot give chips. They might offer to do something else? But the rules don't allow chip transfer. This is key: they can't compensate with chips. So the complaint might be about fairness, and the group must answer with reasons. The TA can note that the ledger shows a net gain, but the person is still worse off.

  Phase Three: Blurred Boundaries
  We have two variants. We'll go with variant (a) because it's simpler to run and doesn't require splitting a person. 

  Variant (a): Two students are designated as sharing a single stream of consciousness. We'll call them the "merged pair". We announce: "For the rest of the game, Student A and Student B are considered to be one person with one mind. They share one set of experiences and one utility stream."

  - Scenario: "The group has an opportunity to undertake an action that will cause a small harm to the merged pair but a large benefit to the rest of the group."
  - Mechanic: The merged pair must lose 5 chips (so they each lose 5? or do they share one chip set? We need to redefine). 

  Redefine: The merged pair now shares one color of chips (or we combine their chips). We take away their individual chips and give them a new color (say, purple) that represents the merged entity. They start with the sum of their previous chips (if they had 10 each, now they have 20 purple chips). But note: we are in the middle of the game, so we need to adjust. Alternatively, we don't change the chips but redefine the accounting: the merged pair's utility is the sum of their individual chips? But then they are still two separate accounts? That might not feel merged.

  Better: We physically merge their chip sets. We take the two students and assign them as one entity. They have one chip color (we can mix their two colors or use a new one). But we have to recalculate their starting point: if they had 10 each, now they have 20 of the new color. Then, any transaction that affects the merged entity is applied to that single account.

  But the students are still two bodies. How do they experience the harm? We'll say that the harm is shared equally: if the merged entity loses 5 chips, then each of the two students feels half the pain? That might be messy. Instead, we can say that the harm is imposed on the merged entity as a whole, and they share the experience. So the chips are for the entity.

  Now, the scenario: 
  - Option: The merged entity loses 5 chips (so their account goes down by 5). Then, every other student (16 students) gains 3 chips. 
  - Net: The merged entity loses 5, the rest gain 48, so net +43.

  But note: the merged entity has two people. So when we say the entity loses 5, that 5 is taken from the shared account. The two students together are worse off by 5 chips. But each of them might feel it as 2.5? We don't specify. The question is: when we add up the utility in the ledger, is the merged entity one unit or two? We are treating it as one unit because we have one account.

  After the vote and transaction, we then ask: How do we count the utility of the merged entity? Is it one or two? And when we look at the ledger, we see one line for the merged entity. Then we can pose the question: should the loss of 5 chips count as one loss (because one entity) or two losses (because two people)? And when we add up the total utility in the room, do we count the merged entity once or twice?

  This should raise the issue: if we treat the merged entity as one, then we are aggregating across them without distinction, but they are two people. But if we treat them as two, then we are double-counting? Or not? The point is to destabilize the idea of distinct persons.

  Alternatively, we can do a variant (b) with a fission case, but that might be more complex. We'll stick with (a).

  Round-by-Round Timeline (90 minutes total):

  0-5 min: Setup. Students enter. Each gets an envelope with 10 chips of their color. TA explains the rules: 
  - Chips are your own, non-transferable.
  - We will have several rounds of decisions. Each round, I'll describe a scenario and options. We vote by show of hands.
  - At the end, if your net chips are positive, you get snacks (each chip can be exchanged for a snack unit). If negative, you do a chore (each negative chip means 2 minutes of a chore from your list, but we cap the chore at 5 minutes? Or we can say one chore per negative balance, regardless of amount, but the chore is chosen from your list and lasts 2 minutes). We'll adjust to be fair and not too harsh.

  5-15 min: Phase One (Intrapersonal)
  - TA: "Imagine we are all the same person. We are making a decision for ourself now and later. We can choose to study hard now and get a reward later, or relax now and get nothing later. Option A: Do nothing. Option B: Each of us (as the same person at different times) gives up 2 chips now, and then in the next round (which is the same person later) we each get 5 chips back."
  - Vote: Majority wins. 
  - If B wins, then subtract 2 chips from every student. Then, immediately, add 5 chips to every student. (So net +3 each.)
  - TA notes: "We happily sacrificed a little now for a bigger gain later. This is how we treat our own future selves."

  15-35 min: Phase Two (Interpersonal)
  - TA: "Now we are separate persons. There is a project that requires one person to do an unpleasant task. If we do it, the selected person loses 5 chips, and every other person gains 2 chips."
  - Vote 1: Should we do the project? (Yes/No)
    - If No: nothing happens. Move to the next part? But we want the cost to be felt. So if they vote no, we can note that they avoided imposing a cost, but then we might need an alternative. Alternatively, we can force a vote until they do it? But we shouldn't force. So if they vote no, we skip to the complaint rule? But no one has been selected. Instead, we can say: "If you don't do this project, you miss an opportunity, but we'll have another one." Then we can do a similar scenario again? But time is tight.
    - Better: We design it so that they have to choose someone. We can say: "We must do this project because otherwise the group will lose 1 chip each (due to missed opportunity)." But that might force the issue. Alternatively, we can have a volunteer step forward. If no volunteer, then random selection (draw a name from a hat).
  - If the vote is Yes, then we select a person (by volunteer or random). 
  - Then: subtract 5 chips from that person. Add 2 chips to every other student.
  - Then: the person who lost 5 chips is asked: "Are you satisfied?" If not, they can stand and state a complaint. The group must address the complaint. But since chips are non-transferable, they cannot compensate. They might apologize or explain why it was necessary. The TA can note that the group net gain is 34 (17*2) minus 5 = 29, but the person is worse off. The complaint rule forces them to confront the individual.

  35-60 min: Phase Three (Blurred Boundaries)
  - TA: "Now, we have a special situation. For the rest of the activity, Student A and Student B [pick two volunteers or randomly select] are merged into one person. They share one mind and one utility stream. We will combine their chips into one account. [Take their chips and give them a new set of chips of a new color, equal to the sum of their individual chips. If they had 8 and 12, then 20 new chips.] The rest of you remain separate."
  - TA: "The group has an opportunity: the merged entity will lose 5 chips, and each of the other 16 students will gain 3 chips."
  - Vote: Should we do it?
  - Then, if yes, subtract 5 from the merged entity and add 3 to each of the 16.
  - Then, ask: 
    - To the merged pair: "How do you feel about this? Do you feel the loss as one loss or two?"
    - To the group: "When we add up the total utility, should we count the merged entity as one unit (so we add their chip count once) or as two units (so we add it twice)?"
  - This should lead to discussion. The point: the boundaries are arbitrary. If we count the merged entity as one, then the loss is 5 and gains are 48, so net +43. But if we count them as two, then the loss is 5 (for two people) and gains 48, so net +43? But wait, the loss per person would be 2.5? The issue is that the ledger treats the merged entity as one account, so we are aggregating without regard to the two individuals inside.

  60-85 min: Debrief
  - TA guides discussion: 
    - In phase one, we aggregated across time for one person. That felt fine.
    - In phase two, we aggregated across persons. That felt problematic even though the total net was positive. Why?
    - In phase three, we had a case where two people were merged. How did that change the feeling? How should we aggregate when the boundaries are fuzzy?
  - Then, introduce the philosophical point: the "separateness of persons" objection to utilitarianism. Note that in phase three, the distinctness of persons seems to come in degrees, which complicates the objection.
  - Finally, address the two students who read ahead: if they try to name-drop, say: "We'll get to the theory in a moment, but for now, let's focus on our experience in the game."

  85-90 min: Wrap-up and distribute snacks/chores. Students with positive chips can redeem for snacks (so have snacks available). Students with negative chips draw a chore from their list and do it after class (or at the end, but we don't want to take time). We can have them do the chores quickly (e.g., stack a few chairs) or assign for after class.

  What might go wrong:
  - The group might avoid imposing costs in phase two. If they vote no, then we don't have the experience of the cost. Solution: we can have a second scenario that forces the issue, but time is limited. Alternatively, we can have a rule that if they don't do the project, everyone loses 1 chip (to simulate the cost of inaction). Then they might be more inclined to do it. We'll add that: "If we don't do the project, then everyone loses 1 chip because of missed opportunity." Then they have to choose between a concentrated loss and a diffuse loss.
  - One student dominating: the TA should moderate and ensure everyone has a voice. Use show of hands for votes.
  - The complaint rule: if the selected person doesn't complain, the TA can ask: "Do you feel that the group has treated you fairly?" to prompt.
  - In phase three, the merged pair might not feel merged. The TA should emphasize the thought experiment: "Imagine you are one consciousness, sharing experiences."

  What the activity cannot reproduce: 
  - The deep philosophical argument about separateness and why it matters for morality. The activity shows that we are uncomfortable with imposing losses on others even for the greater good, and that the boundaries of persons might be fuzzy, but it doesn't prove that utilitarianism is wrong. We have to state that the objection is about the moral significance of distinctness and that utilitarianism ignores that significance.

  Revised Phase Two Scenario to force a decision:
  - "If we do the project: one person loses 5 chips, and the other 17 each gain 2 chips. Net gain 29 chips. If we do not do the project, then everyone loses 1 chip (because of the missed opportunity)."
  - Then they have to choose between:
    Option A: Do the project -> one person loses 5, others gain 2.
    Option B: Not do the project -> everyone loses 1.

  Then even if they don't want to harm one person, they are harming everyone a little. This might make them more likely to choose the project.

  Revised Timeline for Phase Two (15-35 min):
  - Explain the scenario with the two options and the consequences of each.
  - Vote: Do the project? (Yes: do the project and select a person; No: everyone loses 1 chip)
  - If Yes, then select the person (volunteer or random). Then subtract 5 from that person and add 2 to each of the others.
  - Then, the person who lost 5 chips: if they are net negative or just unhappy, they can stand and complain.

  This should work better.

  Final note: students can opt out at any time. If they don't want to participate in a round, they can say "pass" and their chips remain unchanged. If they don't want to be the merged pair, we pick someone else.

