    - Artificially driven HOS: Represents "green."  
    - No properly generated HOS possible.  
  - **Predictions**:  
    - *Actual HOS rule*: Conscious experience of "green" (HOS exists).  
    - *Properly generated HOS rule*: Not conscious (no HOS properly generated by FOS).  
    - *First-order rule*: Not conscious (no FOS).  
  - **Why this condition?**  
