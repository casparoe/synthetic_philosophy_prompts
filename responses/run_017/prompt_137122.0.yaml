    - It also distinguishes from the first-order rule (which predicts no consciousness).  
    - **Is it the best use of the slot?** Yes. It directly tests a key point of contention (whether HOS must be properly generated) and uses a methodology consistent with your lab's approach (manipulating FOS and HOS channels). It is more discriminating than alternatives (e.g., varying richness/availability, which her track record already rejects).  

  ### Summary of Key Insights  
  - **Shape of the rule**: Consciousness requires an occurrent HOS representing the subject's state. Content is set by the HOS, regardless of FOS accuracy or causal origin.  
  - **Where she is free to choose**: She has flexibility on the *type* of HOS (conceptual vs. non-conceptual) and its neural implementation, but her verdicts commit her to an actual occurrence (not mere capacity) and to HOS-driven content.  
