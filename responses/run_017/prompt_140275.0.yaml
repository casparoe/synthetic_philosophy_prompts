answer: |-
  ### Spandrels Discovery Exercise  
  **Goal:** Students experience the adaptationist bias firsthand by reverse-engineering structures built under hidden constraints, then discover how evidence shapes narratives.  

  ---

  #### **Materials & Prep**  
  - **Kits (for each of 2 builder groups):**  
    - 10 plastic straws (20 cm each), 5 pipe cleaners, 1 roll masking tape, 1 index card.  
    - *Rules:* No cutting, no reworking after initial assembly.  
  - **Secret Constraint Cards (1 per builder group):**  
    - **Group A:** "Must stand unaided ≥25 cm tall; must use every piece; assemble in one 6-min pass (no revisions)."  
    - **Group B:** "Must stand unaided ≥25 cm tall; must leave exactly 2 pieces unused; assemble in one 6-min pass (no revisions)."  
  - **Reverse-Engineer Packets (for each of 2 RE groups):**  
    - Scoring sheet (table with columns: Feature, "Function Story", "Constraint Story", Bet Type, Points Wagered).  
    - Evidence Menu (prices: Function Bet = 5 pts, Constraint Bet = 15 pts; Evidence: Build Log = 20 pts, Sibling Photo = 15 pts, Inventory = 10 pts, Ablation Test = 30 pts).  
  - **Instructor Prep:**  
    - Pre-build 2 "sibling artifacts" (1 per constraint) for photos.  
    - Stopwatch, whiteboard for scoring, tally sheets.  

  ---

  #### **Timeline (90 Min Total)**  
  **0–5 min: Setup**  
  - Split class: 2 builder groups (4 each), 2 reverse-engineer (RE) groups (3 each).  
  - Give builders kits + secret constraints (emphasize: "No sharing constraints!").  
  - Give RE groups packets. Explain: "You’ll analyze another group’s structure. Bet points on why features exist."  

  **5–11 min: Building Phase (6 min)**  
  - Builders create structures. Circulate to enforce constraints (e.g., interrupt if reworking).  
  - *Tip:* Groups A (use all pieces) often add superfluous elements; Group B (leave pieces) often overcompensates with tape.  

  **11–26 min: Reverse-Engineering Phase (15 min)**  
  - RE groups rotate to analyze the *other* builder group’s artifact (e.g., RE Group 1 studies Builder B’s artifact).  
  - **Task:** Identify 6 features (e.g., "straw taped horizontally at base," "pipe cleaner wrapped around top"). For each:  
    - Write a **"Function Story"** (e.g., "stabilizes against wind").  
    - Write a **"Constraint Story"** (e.g., "builder ran out of tape, so straw was a quick fix").  

  **26–36 min: Betting Phase (10 min)**  
  - RE groups bet points on their preferred story for each feature:  
    - Betting on **Function** costs **5 pts** (cheap, high reward if correct).  
    - Betting on **Constraint** costs **15 pts** (expensive, higher reward if correct).  
  - **Scoring Rules:**  
    - Start with 100 pts per RE group.  
    - Lose bet cost if wrong; gain **2x bet cost** if correct (e.g., win 10 pts on a 5-pt function bet).  
    - *Instructor tracks bets on whiteboard.*  

  **36–46 min: Evidence Purchase (10 min)**  
  - RE groups spend remaining points to buy **one** evidence item:  
    - **Build Log:** Builder’s handwritten assembly steps (written during RE phase).  
    - **Sibling Photo:** Pre-made artifact from same constraint (e.g., show RE Group 1 a photo of another Group B build).  
    - **Inventory:** List of unused pieces (if any).  
    - **Ablation Test:** Instructor removes one feature; test if structure stands.  
  - Groups review evidence but **cannot change bets**.  

  **46–60 min: Revelation & Scoring (14 min)**  
  - Builders reveal constraints and intent for each feature (e.g., "We added the extra straw because we had to use all pieces").  
  - Instructor scores bets based on builder testimony.  
  - **Whiteboard example:**  
    | Feature       | Bet Type | Points Wagered | Correct? | Net Gain/Loss |  
    |---------------|----------|----------------|----------|---------------|  
    | Horizontal straw | Function | 5 | No | -5 |  

  **60–90 min: Debrief (30 min)**  
  - **Map Game → Real Critique:**  
    - **Cheap Function Bets** → Adaptationist Bias ("Why did you default to ‘it has a purpose’?").  
    - **Expensive Constraint Bets** → Gould-Lewontin’s point: By-product explanations are "costly" (require abandoning optimality assumptions).  
    - **Evidence Ambiguity:**  
      - Sibling Photo (shows similar features) → Homology vs. adaptation.  
      - Ablation Test (structure stands without feature) ≠ Non-functional (e.g., redundancy).  
      - Build Log → Unavailable in evolution; we lack "designer’s intent."  
  - **Reveal Terms:** Now introduce "spandrel," "adaptationism," "exaptation."  
  - **Discussion Prompts:**  
    - "When did you ignore constraint stories even when plausible?"  
    - "How did evidence confirm or mislead you?"  

  ---

  #### **Predictable Challenges & Recovery**  
  1. **Problem:** Builders create overly functional structures.  
     - *Recovery:* Secretly prompt Group A: "You *must* use every piece—add something non-functional."  

  2. **Problem:** RE groups struggle to invent constraint stories.  
     - *Recovery:* Provide examples preemptively (e.g., "Maybe the tape ran out?").  

  3. **Problem:** Betting phase bogs down in debate.  
     - *Recovery:* Enforce 60-second decisions per feature.  

  ---

  #### **What the Game Can’t Capture**  
  **The Role of Phylogeny:**  
  - In biology, historical constraints (e.g., shared ancestry) explain by-products. The game’s "constraints" are arbitrary and lack deep history.  
  - **State Explicitly:** "In evolution, spandrels arise from developmental or phylogenetic constraints—like how all vertebrates have four limbs, even if suboptimal. Our game’s ‘constraints’ are oversimplified stand-ins."  

  **Why This Works:**  
  Students *feel* the bias when they bet cheaply on function and lose points. The scoring mechanic mirrors how adaptationism favors "just-so" stories, while constraint explanations demand more evidence. By the debrief, they’re primed for Gould-Lewontin’s argument—no lecture needed.
