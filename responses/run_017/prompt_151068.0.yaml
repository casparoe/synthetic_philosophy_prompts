  The user wants the question and a model answer without citations, plus a marking scheme with five key points.

  First, I need a real-world scenario. A city council adjusting noise regulations makes sense. Start with a strict policy (A) and degrade it step by step to a lax one (Z). Each step is a minor change like increasing noise limits by 0.5 dB. The paradox: A is better than Z, no step worsens the policy, yet transitivity implies A>Z shouldn't happen.

  For the second part, another committee sees only five policies: A, G, M, T, Z. The changes between these are large (e.g., 5 dB jumps). This tests if the problem persists with noticeable changes.

  Terms must be defined:
  - "Better than": more effective at reducing complaints.
  - "Worsening": makes the policy less effective.
  - "Transitivity": if A>B and B>C, then A>C.

  The essay should force choosing which claim to reject. Each choice has costs:
  - Drop transitivity: Loses pairwise ranking, order of comparison matters, no clear best option.
  - Drop A>Z: Accepts that small changes accumulate to no difference, but endpoint difference is obvious.
  - Drop "no worsening": Say tiny changes can worsen, but then how small is too small? Risks arbitrariness.

  In the coarse-grained case, if they still see A>Z but no worsening in big steps, they must explain why granularity matters or accept that even large improvements might not chain.

  Practical part: For the council, if transitivity drops, pairwise comparisons fail. They might need holistic evaluation. If they keep transitivity but say tiny steps worsen, they need a threshold, which is tricky.

  Model answer should:
  1. State verdict first: e.g., drop transitivity.
  2. Explain costs: Can't rank by pairs, order matters.
  3. Handle coarse case: Argue that big steps are clear worsenings, so transitivity holds there, but small steps create vagueness.
  4. Distinguish "better" vs "noticeable": Even if imperceptible, differences exist and accumulate. Denying this leads to counterintuitive endpoints.
  5. Decision procedure: Without transitivity, holistic methods needed; with thresholds, define a cutoff.

  Marking scheme key points:
  1. Identify which claim to reject. (4 marks)
  2. Costs of rejecting it vs. alternatives. (4 marks)
  3. Explain coarse-grained case implications. (4 marks)
  4. Address "better" vs "noticeable". (4 marks)
  5. Practical decision-making consequences. (4 marks)

  Common mistakes:
  - Not committing to dropping a claim.
  - Ignoring the coarse case or not contrasting it.
  - Confusing imperceptible with non-existent.
  - Not detailing practical impacts.

  A-grade answers will link all parts, show why granularity matters, and provide a consistent decision method.
answer: |-
  ### Philosophy Practice Exam Question  
  **Time Allowed:** 45 minutes  
  **Total Marks:** 20  

  **Question:**  
  The City Council must update its noise pollution policy. The strictest version (Policy A) allows maximum noise of 60 decibels (dB) in residential areas. The most lenient version (Policy Z) allows 70 dB. A consultant proposes 200 intermediate policies (A, B, C, ..., Z), each increasing the limit by 0.05 dB from the previous one (e.g., Policy B = 60.05 dB, Policy C = 60.10 dB, ..., Policy Z = 70 dB).  

  The Council must decide whether Policy A is better than Policy Z. Assume:  
  - "Better than" means *more effective at reducing resident complaints*.  
  - A policy change is a "worsening" if it *makes the policy less effective at reducing complaints*.  
  - "Transitivity" means: *If Policy X is better than Policy Y, and Policy Y is better than Policy Z, then Policy X is better than Policy Z*.  

  Three claims arise:  
  1. Policy A is better than Policy Z (since 60 dB clearly reduces complaints more than 70 dB).  
  2. No single step from Policy A to B, B to C, ..., Y to Z is a worsening (since a 0.05 dB increase is too small to detectably affect complaints).  
  3. "Better than" is transitive.  

  These three claims cannot all be true.  

  **(a)** Which claim (1, 2, or 3) should the Council reject? Explain why the cost of rejecting *this claim* is less damaging than rejecting either of the other two. (12 marks)  

  **(b)** A second committee evaluates only five policies: A (60 dB), G (65 dB), M (67 dB), T (69 dB), and Z (70 dB). Changes between these involve 1–5 dB jumps. Does your answer to (a) change for this committee? Justify your view, addressing whether the "fineness" of the policy steps affects the soundness of the three claims. (8 marks)  

  ---  
  ### Model Answer (700 words)  
  The Council should reject transitivity (Claim 3). While this weakens our ability to rank options predictably, it avoids denying obvious endpoint differences (rejecting Claim 1) or accepting imperceptible changes as harmless (rejecting Claim 2), both of which undermine practical decision-making.  

  Rejecting Claim 1 (A > Z) is costly because it ignores clear evidence: 70 dB generates measurably more complaints than 60 dB. If tiny steps add no harm, but A and Z differ greatly, we must accept that accumulating imperceptible changes creates no real difference—a contradiction. Claim 1’s rejection makes rational choice impossible, as the Council could not justify preferring A over Z despite overwhelming data.  

  Rejecting Claim 2 (no step is a worsening) is worse. It forces us to say a 0.05 dB increase *does* worsen the policy, implying differences too small to measure or observe affect outcomes. This demands arbitrary thresholds: e.g., is 0.04 dB acceptable but 0.05 dB harmful? Without a principled way to define "noticeable worsening," policymaking becomes unstable. If every microscopic change flips "better than," we cannot trust pairwise comparisons—even identical policies might differ imperceptibly.  

  Rejecting transitivity (Claim 3) avoids these pitfalls but costs coherence. If "A > B" and "B > C" no longer guarantee "A > C," pairwise comparisons alone cannot identify a best policy. For example, A might be better than B, B better than C, but C better than A. This cyclical ranking means no single "best" option exists without evaluating all policies simultaneously. It also introduces path-dependence: the order the Council compares policies affects outcomes (e.g., starting from A vs. Z). Yet this preserves core intuitions: A is still better than Z (Claim 1), and tiny steps remain non-worsening (Claim 2), avoiding arbitrariness. The Council can still act pragmatically—e.g., holistically ranking policies or setting a "tolerance threshold" (e.g., changes <0.1 dB ignored).  

  For the second committee (five policies), my answer does not change, but the coarse-grained path highlights why rejecting Claim 2 is unreasonable here. With 5 dB jumps between policies (e.g., A to G), each step *is* a detectable worsening—65 dB causes significantly more complaints than 60 dB, so Claim 2 fails. Transitivity holds in this case: A > G, G > M, etc., implies A > Z. However, the fineness of steps matters because the problem arises from vagueness, not transitivity itself. In the first committee’s fine-grained chain, imperceptible changes create a sorites paradox: no clear point where "better than" flips. But coarse steps lack vagueness—differences are obvious. Rejecting transitivity only when steps are fine preserves its role in clear cases while acknowledging that accumulated ambiguity breaks chains. If we insisted transitivity always holds, we would need to accept that imperceptible changes are worsenings (absurd in fine steps) or deny A > Z (absurd in coarse steps). Granularity thus exposes that "better than" depends on context, not just the endpoints.  

  Distinguishing "better than" from "noticeably better" does not resolve the core issue. Even if changes are imperceptible, they objectively accumulate (e.g., 200 steps of 0.05 dB create 10 dB). Denying this implies no policy differs from its neighbor—a self-contradiction when A and Z differ. The Council must treat "better than" as objective (based on complaint data) to avoid subjectivity.  

  Practically, rejecting transitivity forces the Council to abandon pairwise ranking alone. They must compare all policies at once, using a holistic scale (e.g., grouping policies into tiers like "excellent," "acceptable"). This is manageable for 200 options with computational tools. If they kept transitivity but rejected Claim 2, they would need microscopically precise thresholds, creating false precision and disputes. Either way, order of comparison matters—a key cost of dropping transitivity—but this reflects real-world complexity.  

  ---  
  ### Marking Scheme (20 marks total)  
  **Must-hit points with marks, common mistakes, and A/B differentiation:**  

  1. **Identify which claim to reject (3/4 marks for naming + basic reason)**  
     - *A-grade (4 marks):* Explicitly rejects Claim 3 (transitivity). Briefly contrasts with costs of rejecting Claim 1 or 2.  
     - *B-grade (2–3 marks):* Names a claim but lacks comparison or misidentifies (e.g., rejects Claim 2 without justification).  
     - *Common mistake:* Fails to commit to one claim or rejects Claim 1/2 without costing alternatives.  

  2. **Cost analysis of rejected claim vs. alternatives (4 marks)**  
     - *A-grade (4 marks):* Details costs of all three options (e.g., rejecting Claim 1 loses endpoint rationality; Claim 2 creates arbitrariness; Claim 3 loses pairwise ranking). Explains why chosen rejection is "least bad."  
     - *B-grade (2–3 marks):* Describes costs of one option but omits/underdeveloped comparison (e.g., only discusses transitivity’s cost).  
     - *Common mistake:* Asserts costs without explaining (e.g., "rejecting transitivity is bad because rankings break").  

  3. **Coarse-grained committee implications (4 marks)**  
     - *A-grade (4 marks):* States answer is unchanged but explains why coarse steps alter the diagnosis (e.g., Claim 2 fails here; transitivity holds). Links granularity to vagueness (fine steps cause sorites; coarse steps avoid it).  
     - *B-grade (2–3 marks):* Notes coarse steps make differences obvious but doesn’t tie to claims or vagueness.  
     - *Common mistake:* Claims the answer changes without justifying or ignores granularity’s role.  

  4. **Address "better than" vs. "noticeably better" (4 marks)**  
     - *A-grade (4 marks):* Rejects the distinction as a solution: notes imperceptible changes accumulate objectively. Explains why denying this leads to contradiction (e.g., A=Z if no step matters).  
     - *B-grade (2–3 marks):* Mentions the distinction but doesn’t show its failure (e.g., "it’s subjective" without impact on claims).  
     - *Common mistake:* Uses the distinction to "solve" the paradox without costing it (e.g., "only noticeable changes matter").  

  5. **Practical decision-making consequences (4 marks)**  
     - *A-grade (4 marks):* Specific how rejecting transitivity affects procedure (e.g., pairwise comparisons fail; order matters; holistic evaluation needed). Contrasts with alternatives (e.g., thresholds if Claim 2 rejected).  
     - *B-grade (2–3 marks):* Vague on procedure (e.g., "it’s harder to choose") or omits contrast.  
     - *Common mistake:* Only restates theoretical costs without application to the Council’s task.
