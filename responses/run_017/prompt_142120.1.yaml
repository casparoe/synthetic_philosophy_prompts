prompt: |-
  I'm taking an upper-level seminar on consequentialism and its critics, and this week we're on Bernard Williams. Our professor handed out his own one-page summary of the critique (he said explicitly that it isn't for quotation or citation), and I'd like to know how much of it to rely on before I write my response paper. It reads as follows:

  "Williams's objection to utilitarianism is an objection from integrity. Utilitarianism holds that my projects, my relationships and my loyalties are worth anything only insofar as they show up in an impartial sum of welfare, so at every point I must be prepared to drop them, or to act against them, if doing so produces even a small net gain overall. In demanding this, utilitarianism alienates a person from the ground projects that give his life its point, and so attacks his integrity. His most famous example makes exactly the same complaint in miniature: a man whose wife is drowning jumps in and saves her rather than a stranger. If he has to be able to tell himself that this is permitted because it maximizes welfare — if that thought must be available to him as his justification — then he has had one thought too many; he should simply be reaching for his wife. Utilitarianism makes that thought unavoidable, because on utilitarianism the fact that she is his wife counts for nothing in its own right. Any acceptable morality therefore has to permit partiality directly, rather than deriving it from an impartial calculus, and that is why Williams thinks he has refuted utilitarianism: a theory that cannot let a man save his own wife without a philosophical footnote is not a morality anyone could live by."

  Two things make me suspicious, though I'm not confident about either and I'd guess at least one of them is wrong. First, the paragraph seems to run together two arguments that I take Williams to keep apart: the complaint about integrity and ground projects, which comes with the example of the traveller who is invited to shoot one of twenty captives himself or watch all twenty be killed, and the very different complaint about the man in the river. The handout treats the river case as the same point "in miniature," but it isn't obvious to me that they are the same point. Second, I've heard that Williams's conclusion is not exactly that utilitarianism has been refuted, but rather that if utilitarianism were true it would be a doctrine best confined to an enlightened minority — that it could function only as an esoteric morality rather than as the public morality of a community — and that he treats that consequence as itself a reason to reject it. The handout says nothing of the sort.

  Could you go through the passage clause by clause and tell me which parts Williams would accept, which are defensible compression, and which are misrepresentations a careful reader should reject? I'm especially interested in three things: whether the complaint about the redundant thought is genuinely an objection to utilitarianism as opposed to any view that can say saving one's wife is permissible; whether the example has any force at all unless utilitarianism agrees that he may save her (if it told him to save the stranger instead, wouldn't we just have a conflict of verdicts rather than this distinctive complaint?); and whether it is fair to say utilitarianism "makes the thought unavoidable," given that a utilitarian can distinguish the criterion of rightness from the decision procedure an agent should use. Finally: once the passage is corrected, does its last sentence survive? And what, in your view, is the strongest form of the objection I should be arguing against in the paper?
reasoning: |-
  Okay, the user is taking a seminar on consequentialism focusing on Bernard Williams. They received a professor's summary of Williams' critique of utilitarianism but are skeptical about its accuracy. They have two main concerns: whether the handout conflates two distinct arguments (integrity/ground projects and the "one thought too many" example) and whether the summary misrepresents Williams' conclusion as a refutation rather than an esoteric morality point.

  The user wants a clause-by-clause analysis of the handout to identify accurate parts, defensible compressions, and misrepresentations. Specifically, they're interested in three key questions: whether the "one thought too many" objection targets utilitarianism specifically or any permissibility theory; whether the example holds if utilitarianism requires saving the stranger; and whether utilitarianism truly makes the thought unavoidable given the criterion/decision-procedure distinction.

  I need to carefully unpack Williams' actual arguments. The integrity objection appears in "A Critique of Utilitarianism" with Jim and the Indians case - where being forced to kill one prisoner attacks integrity by making personal projects subordinate to utility. The "one thought too many" appears in "Persons, Character and Morality" as a distinct point about moral psychology in the drowning wife scenario. 

  For the first concern: The handout does conflate these two arguments. While both relate to impartiality, they work differently - integrity focuses on identity-constituting commitments, while "one thought too many" focuses on appropriate moral motivation. 

  For the second concern: The handout oversimplifies Williams' conclusion. Williams actually argues utilitarianism could only function as an esoteric morality ("Government House utilitarianism"), and that this is problematic. The handout misses this nuance.

  Regarding the three specific questions:
  1) The "one thought too many" objection does specifically target utilitarianism because it demands the welfare calculation be the justification, not just a permissible one.
  2) The example loses force if utilitarianism requires saving the stranger - it only works if utilitarianism permits saving the wife but for the wrong reasons.
  3) The criterion/decision-procedure distinction doesn't fully save utilitarianism because Williams cares about what must count as justification, not just practical reasoning.

  For their paper, I'll recommend focusing on the integrity objection with the Jim case as the strongest version, while noting how the "one thought too many" point complements it by exposing utilitarianism's motivational demands. The drowning wife example is weaker without additional setup.
answer: |-
  Your suspicions are well-founded—the handout contains significant compressions and subtle misrepresentations of Williams' arguments. Below is a clause-by-clause breakdown, followed by answers to your specific questions and recommendations for your paper.

  ### Clause-by-Clause Analysis
  1. **"Williams's objection to utilitarianism is an objection from integrity."**  
     ✅ **Acceptable compression.** This is the core framing in Williams' "A Critique of Utilitarianism" (in *Utilitarianism: For and Against*).

  2. **"Utilitarianism holds that my projects... are worth anything only insofar as they show up in an impartial sum of welfare..."**  
     ✅ **Defensible.** Faithful to Williams' critique of utilitarianism's *impartiality*.

  3. **"...at every point I must be prepared to drop them... if doing so produces even a small net gain overall."**  
     ⚠️ **Overstated compression.** Williams emphasizes that utilitarianism *systematically subordinates* personal commitments to utility, but "at every point" risks caricature. His focus is on deep, identity-defining projects (e.g., Jim and the Indians).

  4. **"In demanding this, utilitarianism alienates a person from the ground projects that give his life its point, and so attacks his integrity."**  
     ✅ **Core of Williams' argument.** Directly reflects the Jim example (killing one captive to save nineteen) from *A Critique of Utilitarianism*.

  5. **"His most famous example makes exactly the same complaint in miniature: a man whose wife is drowning..."**  
     ❌ **Misrepresentation.** The drowning wife case is from **"Persons, Character and Morality"** (in *Moral Luck*), targeting *moral motivation*, not integrity/alienation. It's a distinct argument:  
     - **Jim case**: Integrity (being forced to betray deep commitments).  
     - **Wife case**: Moral psychology ("one thought too many" about justification).  
     Conflating them obscures Williams' dual critique.

  6. **"If he has to be able to tell himself that this is permitted because it maximizes welfare... he has had one thought too many..."**  
     ✅ **Accurate representation of the wife case.** Williams insists the *justification* "she's my wife" should suffice; utilitarian calculation is inappropriate here.

  7. **"Utilitarianism makes that thought unavoidable..."**  
     ⚠️ **Debatable.** Utilitarians distinguish *criterion of rightness* (utility) from *decision procedure* (heuristics like "save loved ones"). Williams rejects this, arguing the justification must *reflect* the right-making reason (see your third question below).

  8. **"...because on utilitarianism the fact that she is his wife counts for nothing in its own right."**  
     ✅ **Faithful.** Utilitarianism only values relationships instrumentally.

  9. **"Any acceptable morality therefore has to permit partiality directly..."**  
     ✅ **Williams' conclusion.** He demands "**thick**" moral concepts (e.g., "loyalty," "betrayal") that directly validate partiality.

  10. **"...that is why Williams thinks he has refuted utilitarianism..."**  
      ❌ **Misleading.** Williams concludes utilitarianism is **unacceptably demanding** and **psychologically unrealistic**, but *not* logically refuted. He suggests it could only function as an **"esoteric morality"** (known only to elites) because public adherence would destroy integrity (*Utilitarianism: For and Against*, pp. 108-118). The handout omits this key nuance.

  11. **"A theory that cannot let a man save his own wife without a philosophical footnote..."**  
      ✅ **Elegant summary of Williams' sentiment**, though "refuted" overstates his conclusion.

  ---

  ### Answers to Your Specific Questions
  1. **Is the "one thought too many" objection specific to utilitarianism?**  
     Yes. Williams targets theories where *only* impartial welfare maximization is the **ultimate justification**. A theory that directly permits partiality (e.g., virtue ethics) avoids this. Utilitarianism is uniquely problematic because it reduces all reasons to utility.

  2. **Does the wife example work if utilitarianism requires saving the stranger?**  
     **No—it loses force.** The example *assumes utilitarianism permits saving the wife* (e.g., because rescuing loved ones is generally utility-maximizing). If utilitarianism demanded saving the stranger, Williams' complaint would shift to utilitarianism's *substantive demand to abandon partiality* (closer to the integrity objection). The "one thought too many" critique relies on utilitarianism *permitting* the act but for alienating reasons.

  3. **Does utilitarianism make the thought "unavoidable" given the criterion/decision-procedure distinction?**  
     Williams would say **yes**. He rejects this distinction for two reasons:  
     - **Justification vs. Motivation**: Even if agents use heuristics, utilitarianism requires that the *ultimate justification* be utility. For Williams, if the justification isn't embedded in the agent's motive (e.g., "I saved her because she's my wife"), the act lacks moral sincerity.  
     - **Psychological Realism**: Constantly relying on heuristics while knowing they’re secondary to utility is unstable and alienating (*Ethics and the Limits of Philosophy*, Ch. 5).

  4. **Does the last sentence survive correction?**  
     **Partially.** The sentiment—that a morality requiring "footnotes" for partiality is flawed—is Williamsian. But "refuted" should be replaced with "demands too much to be a plausible human morality" or "can only function esoterically."

  ---

  ### Strongest Form of the Objection for Your Paper
  Focus on the **integrity objection** (Jim and the Indians):  
  > *"Utilitarianism requires agents to treat their deepest commitments as fungible inputs into an impersonal calculus. This systematically alienates them from projects constitutive of their identity (their 'ground projects'), violating their integrity. A moral theory that reduces *being me* to a disposable tool for promoting welfare fails as a guide for human life."*  

  **Why this is stronger than the wife case**:  
  - The Jim case directly shows utilitarianism *forcing* betrayal of core commitments.  
  - The wife case is more vulnerable to utilitarian replies (e.g., decision-procedure distinctions).  
  - Williams explicitly ties integrity to practical identity and agency, making it philosophically deeper.

  **Supplement with the "esoteric morality" point**:  
  Williams' claim that utilitarianism could only be practiced by elites (who hide it to preserve social fabric) reveals its incompatibility with human psychology and transparent moral community.

  ### Recommendations for Your Response Paper
  1. **Acknowledge the handout's conflation** of two distinct arguments (integrity vs. moral motivation).  
  2. **Defend utilitarianism strategically**: Argue that Williams underestimates resources like:  
     - Rule-utilitarian justifications for partiality.  
     - The criterion/decision-procedure distinction.  
  3. **Concede Williams' core insight**: Even if utilitarianism isn't "refuted," it imposes *profound psychological costs* that may render it unfit as a *lived* morality.  
  4. **Engage the esoteric point**: Does hiding a moral theory's true demands undermine its claim to guide ethical life?

  Williams' enduring challenge is that utilitarianism, in its pure form, cannot accommodate the *perspective of the agent*—a gap your paper should thoughtfully explore.
