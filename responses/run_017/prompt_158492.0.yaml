  Okay, the user is a graduate student in cognitive science working on a paper about how people reason with conditional sentences. They need a background section on the indicative/counterfactual distinction and are evaluating a passage from a popular book on rationality. The passage makes several claims about these conditionals, and the user wants me to audit it for accuracy, pointing out where specialists would object or qualify the statements.

  First, I need to understand the key claims in the passage. It states there are two kinds of conditionals governed by completely different theories. For indicatives, it claims they lack truth conditions entirely, relying solely on conditional probability (Adams and Lewis's triviality result). It also says indicatives can't be embedded in operators without changing meaning and that possible-worlds semantics don't apply to them. For counterfactuals, it argues they're evaluated via similarity between possible worlds (Lewis's account), where adding details to the antecedent can't overturn a true counterfactual, and context-sensitivity is just about similarity respects. The distinction boils down to whether the antecedent is epistemically open (indicative) or settled false (counterfactual). The poker-game standoff cases are cited as refuting truth conditions for indicatives.

  The user has specific concerns. They suspect issues in moving from Adams's thesis to "no truth conditions" and in the closest-worlds machinery. They want me to test the epistemic open vs settled false distinction against cases where the antecedent isn't settled but the conditional is counterfactual, and against antecedent-strengthening examples. They also question the book's conclusion that counterfactuals can't have probabilities, noting that causal models in fields like epidemiology assign probabilities to counterfactuals. Additionally, they mention that Lewis and Stalnaker proposed unified semantics, which contradicts the "different in kind" framing, but wonder if the field has shifted.

  I should start by brainstorming all potential objections to the passage. Major points include the claim that indicatives have no truth conditions - Adams and Lewis actually show problems for truth-conditional accounts under certain assumptions, but this doesn't conclusively prove no truth conditions; many still defend them. The embedding argument is overstated; while embedding can be problematic, there are truth-conditional accounts that handle some embeddings. Claiming possible-worlds semantics don't apply ignores unified approaches by Stalnaker and Lewis themselves.

  For counterfactuals, the passage oversimplifies Lewis's account. The closest-world ordering can be context-dependent in ways that allow antecedent strengthening to change truth values, contrary to "adding detail never overturns." The epistemic open vs settled false contrast fails for cases like the detective example, where counterfactuals are used with uncertain antecedents. The poker example is presented as conclusive but is actually contested; some truth-conditional theories can handle it with context shifts or dynamic semantics.

  The conclusion that counterfactuals lack probabilities ignores developments like imaging in semantics and causal models in other fields. Structural causal models use interventions to define counterfactual probabilities, which are distinct from conditional probabilities but still meaningful. This directly contradicts the book's claim that retrospective counterfactuals are not assessable.

  Regarding the unified vs separate theories question: Lewis and Stalnaker did propose unified accounts, but these faced challenges, leading to diverging approaches. Adams's probabilistic program is active but doesn't necessitate abandoning truth conditions. The book overstates the dichotomy, presenting contested views as settled.

  For the user's background section, they should avoid the claims that indicatives have no truth conditions, that embedding is impossible, that possible-worlds semantics don't apply, and that antecedent strengthening can't overturn counterfactuals. They should also not rely on the epistemic/settled distinction as definitive or the poker case as conclusive. The claim about counterfactual probabilities being impossible is incorrect and should be cut. Instead, they can note there are different approaches, with probabilistic for indicatives and possible-worlds for counterfactuals being common but not exclusive, and mention that counterfactuals can have probabilities via causal models or imaging.
answer: |-
  Based on a careful conceptual audit, here's a breakdown of the passage, point by point, followed by responses to your specific queries. The specialist objections are significant, and the passage contains distortions that go beyond simplification.

  **Brainstorm: Specialist Objections & Qualifications (Unsorted)**
  1.  Claim that indicatives have *no truth conditions whatsoever* is highly contested, not established.
  2.  Misrepresentation of Adams & Lewis: Adams's thesis is probabilistic assertability, Lewis's triviality shows incompatibility with *certain types* of truth conditions under *specific assumptions*, not the impossibility of *any* truth conditions.
  3.  Overstatement of embedding problems: While challenging, embedding *is* studied within truth-conditional frameworks (e.g., dynamic semantics).
  4.  Claim that possible-worlds semantics "simply does not apply" to indicatives is false; Stalnaker & Lewis both proposed unified accounts.
  5.  Counterfactual antecedent is *not* "by definition false"; can be epistemically open or even true (though often presupposed false).
  6.  Claim that "the whole probabilistic apparatus drops out" for counterfactuals ignores probabilistic treatments (e.g., imaging, causal models).
  7.  Oversimplification of Lewis: Similarity ordering is *highly context-dependent*, not fixed solely by objective "facts about which worlds resemble which".
  8.  Claim that adding detail "can never overturn a true counterfactual" is demonstrably false (antecedent strengthening paradox).
  9.  Context-sensitivity description is incomplete; it's not *just* weighting similarity respects but can involve radical shifts in the ordering itself.
  10. The "epistemically open vs. settled false" distinction as defining the two kinds is inaccurate and doesn't cover central cases.
  11. The poker standoff cases are complex; while challenging for truth conditions, they are not universally seen as *refuting* them outright. Contextualist and dynamic responses exist.
  12. The conclusion that counterfactuals lack truth probabilities is incorrect given developments in formal semantics/causal modeling.
  13. The "completely different theories" claim ignores the history and ongoing development of unified approaches.

  **Audit: Claim by Claim (Ordered)**

  1.  **"There are two kinds of conditional... governed by completely different theories."**
      *   **Assessment:** **Misleading/Overstated.** While distinct *theoretical frameworks* often dominate discussion of each type (probabilistic for indicatives, possible-worlds for counterfactuals), this ignores:
          *   The historical aim (Stalnaker, Lewis) of a unified possible-worlds semantics covering both.
          *   Ongoing research into unified accounts (e.g., using epistemic modalities or dynamic semantics).
          *   Probabilistic approaches being applied to counterfactuals (imaging, causal models).
      *   **Literature Status:** Highly unsettled. The degree of unity vs. separateness is a core debate.

  2.  **"An indicative conditional has no truth conditions at all."**
      *   **Assessment:** **Misleading/Wrong.** This is a highly contested *conclusion*, not established doctrine.
          *   Adams showed that the *assertability* of an indicative is given by P(B|A). He did not conclude they *lack* truth conditions.
          *   Lewis's triviality results show that *if* indicatives have truth conditions *and* satisfy certain seemingly plausible principles (like Probability of Conditional = Conditional Probability), *then* those truth conditions must be highly constrained and context-dependent, often leading to triviality (probability collapsing). This challenges specific *types* of truth-conditional accounts under specific assumptions, but does not *logically prove* the impossibility of *any* truth-conditional account. Many defend truth conditions (e.g., Jackson, Griceans, contextualists, dynamic semanticists).
      *   **Literature Status:** Unsettled core issue. The "no truth conditions" view (expressivism, non-propositionalism) is prominent but not consensus.

  3.  **"What Adams showed... Lewis's triviality result... established beyond dispute..."**
      *   **Assessment:** **Misleading.** Framing it as "established beyond dispute" that indicatives lack truth conditions misrepresents the significance of the results. The dispute is very much alive. The results show a deep *problem* for truth-conditional views, not a refutation.

  4.  **"It follows that indicatives... cannot be embedded... without changing meaning... cannot prefix one with probably, negate one..."**
      *   **Assessment:** **Fair Simplification (with caveat).** Embedding indicatives (*especially* negation, probability operators, quantifiers) *is* notoriously problematic for simple truth-conditional accounts and Adams-style probabilistic views. This is a strong argument used by proponents of the "no truth conditions" view. However:
          *   It is *not* universally accepted that embedding changes meaning (some unified accounts aim to handle it).
          *   Truth-conditional theories (especially dynamic or contextualist ones) *do* attempt to model embedding, arguing the meaning is preserved but complex.
      *   **Literature Status:** Unsettled, but the embedding challenge is a major motivator for non-truth-conditional views.

  5.  **"Possible-worlds semantics simply does not apply to them [indicatives]."**
      *   **Assessment:** **Wrong.** This is factually incorrect. Stalnaker (1968) proposed a possible-worlds semantics *specifically for indicatives* before Lewis extended it to counterfactuals. Lewis (1975) aimed for a unified account. While the *details* and *success* of applying possible-worlds to indicatives are debated, the claim that it "simply does not apply" ignores a major strand of research.

  6.  **"Counterfactuals... antecedent is by definition false..."**
      *   **Assessment:** **Misleading/Wrong.** The antecedent of a counterfactual is typically *presupposed* or *assumed* false for the purpose of evaluation, but it is not a matter of *definition*. Crucially, counterfactuals can be used felicitously even when the antecedent's truth value is unknown (your detective case) or even when it's true (though this is marked: "If he *had* been guilty, which he *is*, he would be in jail now"). The defining feature is the *modal remoteness* or *subjunctive mood*, not the factual falsity of the antecedent.

  7.  **"...so there is no probability of the antecedent to conditionalize on and the whole probabilistic apparatus drops out."**
      *   **Assessment:** **Misleading/Wrong.** While standard conditional probability P(B|A) is problematic when P(A)=0, this does not mean the "whole probabilistic apparatus drops out".
          *   Lewis's own "imaging" provides a probabilistic semantics for counterfactuals based on shifting probability to closest A-worlds.
          *   Causal modeling (Pearl, others) provides a rigorous framework for assigning probabilities to counterfactuals via interventions on structural equations, completely independent of P(A).
      *   **Literature Status:** Probabilistic treatment of counterfactuals is well-established in formal semantics and causal inference.

  8.  **"Counterfactuals are evaluated by similarity between possible worlds... Lewis's account is the standard one."**
      *   **Assessment:** **Fair Simplification (mostly).** Lewis's similarity-based possible-worlds semantics *is* the dominant framework for analyzing counterfactuals in philosophical logic and semantics. The core idea is standard.

  9.  **"Because the similarity ordering is fixed by the facts about which worlds resemble which, adding further detail to the antecedent can never overturn a true counterfactual..."**
      *   **Assessment:** **Misleading/Wrong.** This is a critical error and misrepresents Lewis. The similarity ordering is **not** fixed solely by objective facts; it is **intensely context-dependent**. What counts as a "closer" world depends on which features the speaker and context prioritize.
          *   **Antecedent Strengthening Test:** "If the match had been struck, it would have lit." (True in context C1, prioritizing laws of nature).
          *   Add detail: "If the match had been struck *after soaking in water all night*, it would have lit." This is clearly false.
          *   **Why?** Adding the detail about water shifts the context (C2). Worlds where the match soaked in water are now highly relevant. In C2, the closest worlds to actuality where the match is struck *and* soaked in water are worlds where it doesn't light. The similarity ordering changed. Lewis explicitly discusses this context-sensitivity and how antecedent strengthening can fail. The passage's claim that the closest A-worlds "just are" the closest A-worlds ignores this context-relativity. Adding detail *can* and *does* overturn counterfactuals by changing the context and thus the similarity metric.

  10. **"The context-sensitivity... is just context settling which respects of similarity we are scoring."**
      *   **Assessment:** **Oversimplified but Fair-ish Core Point.** While true that context weights similarity respects (temporal continuity, laws, particular facts), Lewis's account allows for much more radical context dependence, including shifts in what *counts* as a relevant respect or how ordering is defined. The description downplays the depth of context-sensitivity revealed by cases like antecedent strengthening.

  11. **"So the difference... reduces to this: the antecedent of an indicative is epistemically open... counterfactual is settled false."**
      *   **Assessment:** **Misleading/Inadequate.**
          *   **Test Case 1 (Detective):** Antecedent (suspect at bar) is epistemically open (not settled false), yet the conditional is naturally expressed as a counterfactual ("If he had been at the bar..."). This directly contradicts the "settled false" requirement. Counterfactuals can concern open possibilities.
          *   **Test Case 2 (Antecedent Strengthening):** Shows the difference isn't primarily about epistemic status but about the *modal force* and *contextual resolution* of similarity.
          *   **General Issue:** While indicative use often correlates with epistemic openness and counterfactual mood with assumed falsity, this is a pragmatic tendency, not a defining semantic feature. The core difference is better characterized by mood/subjunctivity and the *type of supposition* involved (epistemic vs. metaphysical/alethic). "Settled false" is neither necessary nor sufficient.

  12. **"...poker-game standoff cases... refute outright the idea that indicatives have truth conditions..."**
      *   **Assessment:** **Overstated.** These cases (e.g., two players each holding a losing card, each can rationally say "If you called, I would have won" based on their private knowledge) are powerful challenges to simple truth-conditional views. However:
          *   They do not *refute outright* the possibility of truth conditions. Contextualist accounts can assign different truth conditions relative to each speaker's information state. Dynamic accounts model how assertions update information states.
          *   They primarily challenge *objective* or *shared information* truth conditions, not truth conditions *simpliciter*.
      *   **Literature Status:** Unsettled. The cases are central and problematic, but not universally seen as knockdown refutations.

  13. **Book's Conclusion: "no such thing as the probability that a counterfactual is true... not assessable claims at all"**
      *   **Assessment:** **Wrong.** This does *not* follow from accurate parts of the summary and is contradicted by active research programs.
          *   **Lewis's Imaging:** Provides a direct semantics for the probability of a counterfactual `A > B` as the probability mass shifted (imaged) onto A-worlds that are B-worlds.
          *   **Causal Models (Pearl):** Define counterfactuals via interventions (`do(A)`). The probability `P(Y | do(X))` is precisely the probability that Y *would* happen if we *were to* do X. This is fundamental to causal inference and directly assesses claims like "If we had not done X, Y probably would not have happened" as `P(Y=0 | do(X=0))`, often estimable from data under assumptions. Your friend is correct; this is standard and distinct from conditional probability.
          *   **Compatibility:** This is compatible with a possible-worlds *semantics* for the counterfactual itself (the intervention `do(X)` can be modeled as selecting worlds). It flatly contradicts the book's conclusion that such claims are unassessable rhetoric.

  **Responses to Your Specific Queries**

  1.  **Are the two kinds governed by completely different theories? Is the open/settled gloss defensible?**
      *   **Theories:** No, not *completely different*. Unified possible-worlds accounts exist and were foundational. While dominant approaches differ (probabilistic for indicatives, similarity-based worlds for counterfactuals), there's significant overlap and cross-pollination (probabilities for counterfactuals, worlds for indicatives). The dichotomy is overstated.
      *   **Open/Settled Gloss:** Not defensible as the defining semantic distinction. The detective case shows counterfactuals can have open antecedents. The antecedent strengthening case shows the core mechanism (similarity) is different. The gloss confuses a common pragmatic cue with semantic essence. The difference is more robustly characterized by mood and the type of possibility being considered (epistemic vs. metaphysical/alethic).

  2.  **Does the book's conclusion about counterfactual probabilities follow? Is causal modeling real/compatible?**
      *   **Follow?** Absolutely not. The accurate parts (Lewis's similarity semantics being standard) do *not* entail that counterfactuals lack truth probabilities. Lewis himself defined imaging to provide such probabilities.
      *   **Causal Modeling:** It is very real and central to fields like epidemiology, econometrics, and AI. It provides rigorous, assessable probabilities for counterfactuals via the `do`-operator and structural equations. This is entirely compatible with a possible-worlds *semantics* for what the counterfactual *means* (the intervention selects a set of worlds). It directly refutes the book's conclusion that retrospective counterfactual probabilities are unassessable rhetoric.

  3.  **Your Prior (Unified vs. Collapsed):**
      *   **Closer to Truth:** The book presents a distorted history. Lewis and Stalnaker *did* propose unified possible-worlds semantics. While these faced serious challenges (especially triviality for indicatives, context-sensitivity for both), the unified program did not simply "collapse." It evolved. The Adams-style probabilistic program became prominent for indicatives due to the challenges, but possible-worlds accounts for indicatives are still actively defended and developed (often incorporating context or dynamics). The field did not end up with a clear "different in kind" consensus; it's a multifaceted landscape with competing approaches for each type and ongoing attempts at unification or bridging. The book presents a contested, simplified snapshot as settled doctrine.

  **Recommendations for Your Background Section**

  *   **Cut Entirely:**
      *   The claim that indicatives have *no truth conditions whatsoever*.
      *   The claim that adding detail *never* overturns a counterfactual.
      *   The "by definition false" characterization of counterfactual antecedents.
      *   The claim that counterfactuals cannot have probabilities/are unassessable rhetoric.
      *   The "completely different theories" framing.
      *   The "refute outright" claim about poker cases.
  *   **Rewrite Significantly:**
      *   **Adams/Lewis:** Describe Adams's thesis as linking assertability to conditional probability. Describe Lewis's triviality as showing a deep *tension* between this and simple truth-conditional accounts, leading many (but not all) to adopt non-truth-conditional views for indicatives. *Do not* state it proves no truth conditions.
      *   **Embedding:** Acknowledge embedding is a major *challenge* for indicative conditional semantics.
      *   **Counterfactual Semantics:** Describe Lewis's similarity-based possible-worlds semantics as standard, but *emphasize the profound context-dependence* of the similarity ordering. Explicitly state that adding details to the antecedent can change the context and thus the truth value (use the match example briefly). Mention alternatives like causal models.
      *   **The Distinction:** Frame the indicative/counterfactual difference primarily in terms of grammatical mood (indicative vs. subjunctive) and the *type of supposition* (typically epistemic vs. metaphysical/alethic). Note the *common pragmatic association* of indicatives with epistemic openness and counterfactuals with assumed falsity, but clarify this isn't definitional (cite detective case). Avoid the "epistemically open vs. settled false" reduction.
      *   **Poker Cases:** Present them as a significant *challenge* to simple truth-conditional accounts of indicatives, not a refutation.
      *   **Counterfactual Probability:** Acknowledge that while conditional probability `P(B|A)` is problematic when `A` is false, there *are* well-developed methods for assigning probabilities to counterfactuals, such as Lewis's imaging or causal modeling via interventions (`do`-calculus), which are crucial for causal inference.
  *   **Do Not Rely on this Passage For:**
      *   Any claim about the *impossibility* of truth conditions for indicatives.
      *   Any claim about the *impossibility* of assigning probabilities to counterfactuals.
      *   The context-insensitivity of counterfactual similarity or the immunity to antecedent strengthening.
      *   The "settled false" requirement for counterfactuals.
      *   The idea that the field has conclusively settled on a stark dichotomy.

  **Key Takeaway for Background Section:** Present the indicative/counterfactual distinction as involving different grammatical forms and typically different types of supposition. Note that probabilistic approaches (focused on assertability/acceptance) are dominant for indicatives due to challenges like triviality and embedding, while possible-worlds similarity semantics (highly context-sensitive) is dominant for counterfactuals. Crucially, emphasize that both types are areas of active research with competing theories, and that methods exist for rigorously evaluating counterfactual probabilities (especially in causal modeling), contrary to the passage's conclusion. Avoid presenting contested claims as settled doctrine.
