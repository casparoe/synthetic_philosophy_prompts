answer: |-
  ### Session Plan: Aumann's Agreement Theorem for Quantitative Researchers  

  #### **I. Dependency Structure (Whiteboard Sequence)**  
  1. **Partitions first** (Panel 1, left):  
     - *Why?* Your audience grasps probability but not epistemic states. Start with **information partitions**:  
       *"Analyst A partitions Ω into {ω₁,ω₂}, {ω₃,ω₄} based on their private signal. If ω₁ occurs, A knows {ω₁ or ω₂}."*  
     - **Crucial**: Show partitions *cross-cutting* (e.g., A partitions by rows, B by columns). Emphasise: **"Knowledge is coarse-grained—you only know which cell you’re in."**  
     - *Risk if reversed*: Starting with "common prior" primes dismissal as "unrealistic" before seeing *why* it’s needed.  

  2. **Common prior next** (Panel 1, right):  
     - *Why?* Now they see partitions define knowledge; priors define beliefs. Stress: **"Before signals, both agree on P(ω) for all states. Priors aren’t about ‘fairness’—they’re consistency constraints on rational interpretation of evidence."**  
     - *Key phrasing*: "P(ω) is the *map*; partitions are the *territory* revealed partially to each."  

  3. **Common knowledge of posteriors** (Panel 2):  
     - Define: **"After sharing estimates, it becomes common knowledge that A’s posterior is X and B’s is Y. Neither knows *why* the other has that number, only the number itself."**  
     - *Slogan here*: **"You can’t rationally ‘agree to disagree’ *once your estimates are public and uncontested*."**  
       → *Avoid misconception*: Add: **"This isn’t prediction—it’s a consistency failure if disagreement persists *under these conditions*."**  

  #### **II. The Core Example**  
  **Scenario**: Forecasting next quarter’s **tech firm earnings growth** (discrete: -2%, 0%, +2%).  

  | **State ω** | **True Growth** | **P(ω)** | **A’s Signal** | **B’s Signal** |  
  |-------------|-----------------|----------|----------------|----------------|  
  | ω₁          | -2%            | 0.3      | "Weak demand"  | "Low margins"  |  
  | ω₂          | -2%            | 0.2      | "Weak demand"  | "High margins" |  
  | ω₃          | 0%             | 0.1      | "Strong demand"| "Low margins"  |  
  | ω₄          | 0%             | 0.2      | "Strong demand"| "High margins" |  
  | ω₅          | +2%            | 0.2      | "Strong demand"| "High margins" |  

  - **Partitions**:  
    - A partitions by demand: {ω₁,ω₂} (weak), {ω₃,ω₄,ω₅} (strong).  
    - B partitions by margins: {ω₁,ω₃} (low), {ω₂,ω₄,ω₅} (high).  
    **→ Cross-cut?** Yes: ω₁ in A’s "weak" and B’s "low"; ω₂ in A’s "weak" and B’s "high", etc.  

  - **Initial posteriors** (given signals):  
    - A sees "strong demand": P(+2% | ω₃,ω₄,ω₅) = 0.2/(0.1+0.2+0.2) = **40%**.  
    - B sees "high margins": P(+2% | ω₂,ω₄,ω₅) = 0.2/(0.2+0.2+0.2) ≈ **33%**.  

  - **Dialogue**:  
    - **Round 1**: A says "40%", B says "33%".  
      *A revises*: B’s 33% implies ω₂,ω₄,ω₅ are possible. A now conditions on {ω₃,ω₄,ω₅} ∩ {ω₂,ω₄,ω₅} = {ω₄,ω₅}.  
      → A’s new posterior: P(+2% | ω₄,ω₅) = 0.2/(0.2+0.2) = **50%**.  
    - **Round 2**: A says "50%", B says "33%".  
      *B revises*: A’s 50% implies states where A would say 50%. B knows A only revises on B’s response. So B conditions on {ω₄,ω₅} (where A says 50%) ∩ B’s initial set {ω₂,ω₄,ω₅} = {ω₄,ω₅}.  
      → B’s new posterior: P(+2% | ω₄,ω₅) = **50%**.  
    **→ Agreement at 50%**—*not between 33% and 40%*, and driven by eliminating states.  

  **Why this works**:  
  - Non-compromise final posterior (50% > both initials).  
  - Signals never shared—only estimates.  
  - Stability check: B’s unchanged "33%" in Round 1 lets A eliminate ω₃.  
  - Relevant to finance, avoids urn analogies.  

  #### **III. Misconception Map (Order of Prevention)**  
  1. **"Real disagreements persist, so theorem is false"**  
     - *Preempt at start*: **"This isn’t psychology—it’s why *rational* disagreement under common knowledge *should* vanish. Real-world friction breaks the assumptions."**  
  2. **Compromise reading**  
     - *Preempt with example design*: Final posterior (50%) not between 33% and 40%. Stress: **"They don’t average—they eliminate states."**  
  3. **"They pooled evidence"**  
     - *Preempt when defining common knowledge*: **"A never learns B saw ‘high margins’—only that B’s number is 33%."**  
  4. **Common prior as "trivial" or "fatal"**  
     - *Preempt when introducing priors*: **"Without this, you could both be ‘Bayesian’ yet assign different probabilities to the same evidence. The theorem assumes you don’t."**  
  5. **Agreement → accuracy**  
     - *Preempt later with observer variant* (see below).  
  6. **"Uncertainty about others’ knowledge kills it"**  
     - *Preempt with partitions*: **"Partitions *define* what you know about others. If they’re not common knowledge, the theorem doesn’t apply."**  
     → *Your diagnosis is correct; no missing ones.*  

  #### **IV. Deliberate Variants**  
  1. **Direction-only protocol** (After core example):  
     - "Suppose analysts only say ‘up/down/same’ each round."  
     - **Isolate**: Whether *coarseness* prevents agreement.  
     - **Result**: Agreement may *not* occur (e.g., if both posteriors rise, but amounts are hidden).  
     - **Honest answer**: **"Without common knowledge of *exact* posteriors, rationality doesn’t force agreement. The theorem’s mechanism breaks."**  

  2. **Observer with transcript + private signal** (Final panel):  
     - Observer sees all estimate exchanges but also has private signal (e.g., "regulatory risk").  
     - **Why she disagrees post-agreement**: Her total information (transcript + signal) differs from analysts’.  
     - **Lesson**: **"Agreement is relative to shared information—not truth. She knows what they said, but also something they don’t."**  
     - **Placement**: After agreement to show **"Consensus isn’t truth-tracking—it’s pool-tracking."**  

  #### **V. Check for Understanding**  
  **Question**: *"Analysts C and D share a common prior. C sees signal S₁, D sees S₂. After sharing posteriors twice, they agree. If they had swapped signals at the start, could they still disagree initially?"*  
  - **Correct answer**: Yes. Partitions may process S₁/S₂ differently (e.g., if S₁ refines D’s partition). Agreement requires common knowledge of posteriors, not evidence.  
  - **Why it traps**: Those recalling only "common prior → agreement" miss the role of partition structure.  

  #### **VI. Omissions & Phrasing**  
  - **Proof**: *"The proof is elegant but time-costly; we’re focusing on the engine, not the wiring."*  
  - **State-space machinery**: *"We’ve used a toy model; infinite spaces use sigma-algebras, but the epistemic logic is identical."*  
  - **No-trade/markets/herding**: *"These are vital corollaries—but today we’re dissecting the theorem’s core mechanism."*  
  - **Common prior origins**: *"Whether priors *should* be common is debated—but here we ask what follows *if* they are."*  

  ---

  ### **40-Minute Skeleton**  
  **Whiteboard Panels**: 4 panels (L→R, Top→Bottom).  
  - **Panel 1**: Partitions (left) + Common Prior (right).  
  - **Panel 2**: Core example state space & dialogue.  
  - **Panel 3**: Misconceptions (bullet points) + Direction-only variant.  
  - **Panel 4**: Observer variant + Check question.  

  **Timing**:  
  - 0–10min: **Partitions & Prior** (Panels 1–2).  
    *"You know probabilities; let’s model what you know about what others know."*  
  - 10–25min: **Core Example** (Panel 2, step-by-step dialogue).  
    *"Watch how states vanish—not estimates compromise."*  
  - 25–33min: **Variants** (Panel 3–4).  
    *Direction-only*: "Why granularity matters."  
    *Observer*: "Why consensus isn’t truth."  
  - 33–37min: **Misconceptions** (Panel 3 bullets).  
    *"If you take one thing: this is *not* about..."*  
  - 37–40min: **Check Question + Wrap**.  
    *"Your turn: could swapped signals still cause initial disagreement?"*  

  **Key Mantra**: *"The theorem doesn’t say you *will* agree—it says you *can’t rationally keep disagreeing* once estimates are common knowledge."*  

  ---  
