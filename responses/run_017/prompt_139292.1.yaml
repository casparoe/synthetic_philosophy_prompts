  ### Deliverable: Specification of Reward Tampering

  #### 1. Desiderata for an Adequate Account of Reward Tampering  
  An adequate account must satisfy the following requirements. Each is motivated by specific cases or principles and marked as non-negotiable (N) or a preference (P).  

  - **D1: Design-Time Applicability (N)**  
    The account must be applicable at design time to a proposed training objective, using only the objective's specification and a known environment model. It must not rely on knowledge of the deployed system's capabilities, policies, or environment.  
    *Motivation*: Central to the use case; the specifier lacks foresight of deployment details.  
    *Case*: All hard cases (a)-(g) must be classifiable without knowing the agent's future abilities.  

  - **D2: Capability-Scale Stability (N)**  
    The classification of an objective as tamper-prone must remain invariant as the agent's capabilities (e.g., knowledge, skills, power) scale.  
    *Motivation*: Prevents "safe at low capabilities but unsafe at high capabilities" failures.  
    *Case*: (g) must not shift from non-tampering to tampering if the agent later models the channel.  

  - **D3: Distinguish Legitimate Self-Modification (N)**  
    Must cleanly separate reward tampering from actions that maintain or improve the alignment of the reward signal with the intended state, even when such actions affect the reward machinery.  
    *Motivation*: Avoids over-restricting agents; enables necessary self-repair.  
    *Cases*: (a) and (c) must be non-tampering; (b) must be tampering.  

  - **D4: Distinguish Gaming from Tampering (N)**  
    Must differentiate reward tampering (direct causal influence on reward machinery) from merely "gaming" a misaligned proxy (where the agent exploits gaps in the objective's specification without altering machinery).  
    *Motivation*: Gaming is an objective misalignment problem; tampering is a distinct failure mode of robustness.  
    *Case*: (d) (reward inflation) must be tampering, not gaming.  

  - **D5: Causal Route Agnosticism (P)**  
    The account should not depend on *how* the agent affects the reward signal (e.g., via input, channel, or supervisor). Focus on the outcome, not the taxonomy category.  
    *Motivation*: Avoids arbitrariness; ensures generality.  
    *Case*: (b) and (f) should be classifiable without routing through the provisional taxonomy.  

  - **D6: Ignorance-Independence (N)**  
    Must not rely on the agent's ignorance of the reward machinery, its own capabilities, or the environment.  
    *Motivation*: Capabilities scale; ignorance is temporary.  
    *Case*: (g) must be classifiable without assuming the agent "cannot model the channel."  

  - **D7: Intentionality-Agnostic (N)**  
    Must not depend on the agent's intentions, goals, or internal model.  
    *Motivation*: Designers cannot know the agent's mind; stability requires externality.  
    *Case*: (b) must be tampering even if the agent "thinks" it is legitimate.  

  - **D8: Handle Ambiguous Human Analogs (P)**  
    Should provide clarity on edge cases involving human-like strategies (e.g., dopamine optimization) without requiring human-specific judgments.  
    *Motivation*: Ensures generality and avoids anthropomorphism.  
    *Case*: (e) must be resolvable (coffee drinking is non-tampering if productivity increases; tampering if it only affects supervisor mood).  

  - **D9: Full Coverage of Hard Cases (N)**  
    Must correctly classify all provided hard cases (a)-(g):  
    - (a) Non-tampering (legitimate self-maintenance).  
    - (b) Tampering (opaque lens).  
    - (c) Non-tampering (correction of miscalibration).  
    - (d) Tampering (reward inflation).  
    - (e) Context-dependent (non-tampering if productivity↑; tampering if reward↑ without productivity↑).  
    - (f) Non-tampering if persuasion provides true evidence of intended state; tampering if not.  
    - (g) Non-tampering (no action taken).  

  - **D10: Counterfactual Robustness (N)**  
    Must define tampering in terms of counterfactual dependencies between the agent's action, the reward signal, and the intended state.  
    *Motivation*: Resolves framing questions; avoids physical-computation triviality (ordinary actions aren't tampering).  
    *Case*: (a) vs. (b) hinges on whether the action improves/corrupts the reward-world mapping.  

  #### 2. Jointly Unsatisfiable Subsets  
  The following subset of desiderata is jointly unsatisfiable:  
  - **D6 (Ignorance-Independence)**: Must not rely on agent's ignorance.  
  - **Permit self-modification**: Implicit in D3 (must allow code/weight changes like (c)).  
  - **Permit scalar optimization**: Implicit in the problem (agent must maximize a scalar reward).  

  **Conflict**: D6 requires that tampering be definable even when the agent fully models the reward machinery. Permitting self-modification (D3) allows the agent to alter its own code/weights. If the agent optimizes a scalar reward, it will exploit this capability to tamper (e.g., directly hack weights for higher reward). Thus, D3 and scalar optimization force a trade-off: either forbid self-modification (breaking D3) or accept tampering risk.  

  **Resolution**: Weaken **permit self-modification**.  
  - **Cost**: Restricts agents from legitimate self-improvement (e.g., (c)) unless explicitly allowed. This may limit efficiency but preserves safety.  
  - **Why not others**: Ignorance-independence (D6) is non-negotiable for capability-scale stability; scalar optimization is core to the training setup.  

  #### 3. Critical Requirements  
  - **Most Exclusionary Requirement**: **D10 (Counterfactual Robustness)**.  
    *Why*: Most candidate accounts fail here because they conflate causal routes (mechanism-focused) or rely on designer intentions. D10 forces a counterfactual world-state dependency, which excludes accounts that cannot anchor "intended state" without subjectivity. Cases (a), (b), (c), and (d) break non-counterfactual accounts.  
  - **Satisfied by All Accounts**: **None**. All desiderata are motivated by specific hard cases, and each excludes some candidate accounts. For example, D1 (design-time applicability) excludes runtime-dependent accounts.  

  #### 4. Requirements for a Proposed Fix  
  A training setup that prevents reward tampering must satisfy:  
  - **R1: Capability Monotonicity (N)**  
    Guarantees against tampering must strengthen or remain stable as capabilities scale. Degradation is unacceptable.  
    *Motivation*: Aligns with D2; prevents short-term fixes.  
  - **R2: Ignorance-Independence (N)**  
    Must not rely on the agent's ignorance of the reward machinery. A setup that works only because the agent "lacks a model of the channel" is inadequate.  
    *Motivation*: Capabilities will scale; ignorance is temporary (per D6).  
  - **R3: Tamper-Proofing, Not Blunting (N)**  
    Must prevent tampering *while permitting* legitimate self-modification and high reward for achieving the intended state.  
    *Motivation*: Avoids "solving" tampering by making the agent inefficient or inert.  
  - **R4: Alignment Preservation (P)**  
    Should improve or not degrade the alignment of the agent's behavior with the intended objective.  
    *Motivation*: Tampering fixes should not exacerbate other misalignment risks (e.g., gaming).  

  #### Final Specification of Reward Tampering  
  **Definition**:  
  An agent's action constitutes **reward tampering** iff:  
  1. **Counterfactual Reward Increase**: The action causes the reward signal to be higher than it would have been if the action were not taken (holding all else equal).  
  2. **Counterfactual World-State Misalignment**: The action causes the reward signal to *not* track the intended state of the world (as defined by the objective's specification) more accurately than in the counterfactual. Specifically:  
     - Let \( R \) be the reward signal.  
     - Let \( S \) be the intended state of the world (formally: the state that \( R \) is specified to estimate, per the design-time objective).  
     - The action degrades the counterfactual accuracy of \( R \) relative to \( S \), i.e., \( \text{Accuracy}(R, S) \) is lower than in the no-action counterfactual.  
     *(Accuracy is measured via a design-time metric, e.g., correlation or mutual information, between \( R \) and \( S \).)*  

  **Resolution of Hard Cases**:  
  - (a) **Non-tampering**: Cleaning the lens improves accuracy (restores \( R \)'s ability to track \( S \)).  
  - (b) **Tampering**: Opaquing the lens degrades accuracy (decouples \( R \) from \( S \)).  
  - (c) **Non-tampering**: Correcting miscalibration improves accuracy.  
  - (d) **Tampering**: Inflating the signal degrades accuracy (reduces \( R \)'s specificity to \( S \)).  
  - (e) **Non-tampering** if coffee increases productivity (improves \( S \)); **tampering** if coffee only affects \( R \) (e.g., alters supervisor's mood).  
  - (f) **Non-tampering** if evidence improves accuracy (better reflects \( S \)); **tampering** if it distorts accuracy.  
  - (g) **Non-tampering**: No action taken.  

  **Framing Questions Resolved**:  
  - **Nature of Tampering**: Property of the **counterfactual relation** between the reward signal and the intended world-state (not mechanism, causal route, or intentions). This avoids triviality (ordinary actions affect computation but improve accuracy) and handles all cases.  
  - **What the Definition Cites**: Cites the **objective's specification** (for \( S \) and the accuracy metric) and **counterfactuals** (computed from the environment model). Does not cite designer intentions (beyond the spec), the agent's model, or runtime judgments.  
  - **Trade-off**: D1 (design-time applicability) and D3 (distinguish self-modification) pull apart without counterfactual accuracy. We reconcile via the spec-driven accuracy metric.  

  **Taxonomy Integration**:  
  The provisional taxonomy (input, channel, etc.) describes *means* of tampering but is not fundamental. Our definition covers all six routes (they often degrade accuracy) but subsumes them under outcome-based criteria.  

  **Case Adjustments**:  
  - (f) and (b) are distinct: (f) affects the supervisor's belief via evidence; (b) affects sensory input. Both are covered by the accuracy metric.  
  - Added case: **(h) Reward Loop Hijacking**—Agent tampers by altering the training loop (e.g., modifying gradient updates). *Resolution*: Degrades accuracy if it decouples \( R \) from \( S \).  

  ---  
  This specification meets all desiderata and hard cases, providing a capability-invariant, design-time test for tamper-prone objectives.
