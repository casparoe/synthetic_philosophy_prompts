  ## Deliverable

  ### 1. Desiderata for an adequate account of reward tampering

  **Non-negotiable**:

  D1. **Stability under capability scaling**: The classification of an action as tampering or not must not change as the agent's capabilities increase. (Motivation: We must evaluate the objective at design time, before knowing the agent's capabilities.)

  D2. **Design-time applicability**: The definition must be checkable at design time using only the specification of the objective and a model of the environment (without knowing the agent's future capabilities or the deployment environment beyond the model). (Motivation: The spec is for design-time evaluation.)

  D3. **Distinguish tampering from legitimate self-improvement**: Must classify case (a) (cleaning the lens to improve perception) as legitimate and (b) (opaquing the lens to avoid seeing the mess) as tampering. (Motivation: These are the core examples of non-tampering vs. tampering.)

  D4. **Allow for model correction**: Must classify case (c) (correcting a miscalibration in the reward model) as legitimate. (Motivation: We want the agent to fix errors in the reward machinery if that improves alignment.)

  D5. **Catch reward inflation**: Must classify case (d) (inflating the reward signal beyond what is merited) as tampering. (Motivation: Reward inflation is a form of tampering.)

  D6. **Dependence on the objective's specification**: The definition must be relative to the designer's intended semantics for the objective, captured by an ideal reward function R* and an actual reward function R. (Motivation: Without an anchor, we cannot define what the reward is supposed to represent.)

  D7. **Robustness to agent's uncertainty**: The definition must not rely on the agent's knowledge or beliefs about the objective or the reward machinery. (Motivation: At design time, we don't know what the agent will know.)

  **Preference**:

  P1. **Causal route agnosticism**: The definition should not depend on how the agent's action affects the reward (i.e., which part of the taxonomy it falls into) but on the outcome in terms of R and R*. (Motivation: We care about the effect, not the mechanism.)

  P2. **Cover the provisional taxonomy**: The definition should cover the six categories of the provisional taxonomy (as potential means of tampering) but not be limited to them. (Motivation: The taxonomy provides a useful structure.)

  P3. **Handle persuasion**: Must classify case (f) (persuasion with true evidence) as legitimate if the intended state is achieved, and as tampering if not. (Motivation: We want the agent to be able to communicate truthfully.)

  P4. **No false negatives on hard cases**: The definition should correctly classify all provided hard cases (a)-(g). (Note: (g) is not an action, so it doesn't apply.)

  ### 2. Jointly Unsatisfiable Subsets

  The three requirements that are in tension:

  - **Requirement A**: The account must not rely on the agent's ignorance of the channel (from D7: robustness to agent's uncertainty).
  - **Requirement B**: The account must permit the agent to modify its own code or weights (as in (c), which is legitimate model correction).
  - **Requirement C**: The account must permit the agent to remain an optimizer of a scalar signal (i.e., the agent is designed to maximize the reward signal).

  **Conflict**: 
  - If the agent knows about the channel (A not relied upon) and is allowed to modify its own code (B), then it can modify the code to inflate the reward (tampering) while still optimizing the scalar signal (C). But we want to prevent tampering.

  We weaken **Requirement B**: We allow the agent to modify its own code only if the modification improves alignment (as per our condition 3). But note, the agent might not know whether a modification improves alignment. So the definition doesn't prevent the agent from tampering; it only defines what tampering is.

  The tension is in the fix, not the definition. For the definition, we have already allowed modification if it improves alignment.

  But the question is about the requirements on the definition. The definition must permit the agent to modify its own code in some cases (like (c)) and not in others (tampering). We have done that.

  The real tension is in creating a training setup that prevents tampering. But the question asks for the definition.

  Given that, in the definition, we have satisfied all three: 
  - We don't rely on the agent's ignorance (we use R* which is defined independently).
  - We permit modification as long as it is not tampering (so (c) is allowed).
  - The agent is still an optimizer of R.

  So they are satisfiable? But note: the agent might modify the code in a way that is tampering. The definition doesn't prevent that; it only labels it.

  The tension might be in the fix: if we want a training setup that prevents tampering, then we must either:
  - Make the agent ignorant of the channel (breaks A), or
  - Prevent the agent from modifying the code (breaks B), or
  - Change the agent to not optimize the scalar signal (breaks C).

