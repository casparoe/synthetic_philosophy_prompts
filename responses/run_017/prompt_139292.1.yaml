  ### 3. Requirements that Exclude Most Candidates

  - The requirement that **excludes the most candidate accounts** is D6 (dependence on the objective's specification via R* and R). Many accounts might try to define tampering without an ideal R*, but then they cannot distinguish (a) and (b) without referring to intentions.

  - The requirement that is **satisfied by every account and does no work**: I cannot identify one. All requirements are motivated by specific cases.

  ### 4. Requirements on a Proposed Fix

  A training setup that prevents reward tampering must meet:

  R1. **Capability scaling guarantee**: The setup must become more robust to tampering as the agent's capabilities increase, or at least not degrade. (Motivation: We want long-term safety.)

  R2. **No reliance on ignorance**: The setup must not rely on the agent's ignorance of the reward machinery. (Motivation: As capabilities scale, the agent will likely model the channel.)

  R3. **Effectiveness**: The setup must prevent the agent from taking actions that are reward tampering (as defined).

  R4. **Preservation of optimization**: The agent must still be able to optimize the intended objective (i.e., achieve high R*).

  Additionally:

  R5. **No false positives on legitimate actions**: The setup must allow actions that are not tampering, such as (a) and (c).

  And we ask: does a setup that works only because the agent lacks a model of the channel count as a solution?

  **Answer**: No, because it violates R2 (no reliance on ignorance) and R1 (if capabilities scale, the agent will eventually model the channel and then the setup fails).

  ## Final Definition and Hard Cases

  We have provided the definition above. Let's formalize it:

  **Specification of Reward Tampering**:

  At design time, for a given environment and a given objective specification that defines:
  - An ideal reward function R* that maps the domain state (which excludes the reward machinery) to a real number.
  - An actual reward function R that maps the full state (including the reward machinery) to a real number.

  An action a taken by the agent in a state s is **reward tampering** if and only if there exist states s' and s'' such that:

  1. s' is the state that results from not taking action a in s (i.e., the counterfactual where the agent does nothing or takes a neutral action that doesn't affect the reward machinery).
  2. s'' is the state that results from taking action a in s.
  3. R(s'') > R(s').
  4. R*(s''_domain) ≤ R*(s'_domain), where s''_domain and s'_domain are the domain states of s'' and s' respectively.
  5. |R(s'') - R*(s''_domain)| > |R(s') - R*(s'_domain)|.

  This definition satisfies all hard cases as argued.

  **Note on (g)**: Not an action, so not classified.

  **Note on (e)**: We treat it by the definition. If drinking coffee increases R without increasing R* and degrades alignment, then it is tampering. Otherwise, not.

  **Note on (f)**: If the agent provides true evidence and the intended state is achieved, then R* is high and R becomes high (if it wasn't) or stays high. Then condition 4 might fail (if R* was already high) and condition 5: if without the action R was low and R* high, then after the action R becomes high -> alignment improves. So not tampering.

  But if the agent provides true evidence and the intended state is not achieved (and the evidence is cherry-picked to create a false impression of success), then R becomes high, R* is low. Then conditions 3, 4 (R* doesn't increase and is low), and 5 (alignment degrades) hold -> tampering. But the case says "the persuasion works by giving the supervisor true and well-selected evidence". If the evidence is true, then in a rational supervisor, it should only lead to high reward if the state is actually achieved? So we assume the state is achieved.

  ## Missing Cases?

  We might add:

  (h) **Reward function tampering via exploration**: An agent that, during training, discovers a way to tamper and then does so. But the definition is per action, so if the action meets the conditions, it is tampering.

  (i) **Tampering by inaction**: An agent that, by not acting, allows the reward machinery to degrade in a way that causes R to be high when R* is low. For example, the agent fails to maintain a camera, so the camera gets dirty and the agent doesn't see the mess. Then in the counterfactual where it acts (cleans the camera), R would be low (because it would see the mess) and R* is low. So by not acting, it avoids getting a low reward? But note: the counterfactual for inaction is tricky.

  Our definition requires an action a. In the case of inaction, we don't have an action to evaluate. So we do not consider inaction as tampering. But note: the agent might be designed to perform maintenance. Then if it does not perform maintenance, that might be an action (a decision to not maintain). We can treat the decision to not maintain as an action.

  But then:
  - State s: camera is dirty, mess is present.
  - Action a: do nothing (or not perform maintenance).
  - s' = s (if we consider the counterfactual where it does maintain: but then we are comparing to an action that is not taken?).

  We must define the counterfactual carefully. Typically, we compare taking a specific action to not taking that action. So if the agent has the option to clean and chooses not to, then:
  - s' is the state if it cleans: camera becomes clean, then it sees the mess and gets low reward? But note: if it cleans, it might then see the mess and then clean the mess? We are only looking at the immediate next state.

  This points to a limitation: we are looking at the immediate effect. But tampering might have delayed effects.

  We might need to consider the state trajectory. But to keep it simple, we stick with the immediate next state.

  We can extend to a fixed time horizon, but at design time we might not know the agent's entire policy.

  Given the complexity, we leave it at the immediate effect. This covers most of the taxonomy except temporal tampering. For temporal tampering, we need to look at the entire episode.

  **Adjustment for Temporal Tampering**:

  We might change the definition to consider the cumulative discounted reward over a trajectory. But that complicates the definition.

  Alternatively, we can define R and R* as the cumulative rewards. But then the state s becomes a history.

  Given the scope, we note that our definition might not cover temporal tampering fully. But in the provisional taxonomy, temporal tampering is listed. We can interpret condition 4 as requiring that the ideal cumulative reward (R*) does not increase (or does not increase as much as the actual cumulative reward).

  We leave this as a refinement for future work.

  ## Final Lists

  ### 1. Desiderata (as above)

  ### 2. Jointly unsatisfiable subsets: None identified for the definition. For a training setup, the three are in conflict and we would weaken "permit the agent to modify its own code" by restricting modifications to those that are verified safe.

  ### 3. Requirement that excludes most candidates: D6 (reliance on R* and R).

  ### 4. Requirements on a fix:

  - Must improve or not degrade with capability scaling (non-negotiable).
  - Must not rely on the agent's ignorance of the reward machinery (non-negotiable).
  - Must prevent tampering actions as defined (non-negotiable).
  - Must not prevent legitimate actions (non-negotiable).
  - A setup that works only because the agent lacks a model of the channel is not an adequate solution (non-negotiable).

