  We are defining "reward tampering" for an internal technical agenda on objective robustness. The definition must be applicable at design time to a proposed training objective, without knowing the system's future capabilities, and must remain stable as capabilities scale. We are given a provisional taxonomy and a set of hard cases.

  ## Framing Questions

  ### First: What is the nature of tampering?
  We must decide whether tampering is about:
  - The mechanism the agent uses?
  - The causal route from action to signal?
  - The counterfactual relation between the signal and the intended state of the world?

  **Analysis**:
  - If we focus on the mechanism, then (a) and (b) might be classified the same (both clean/opaque the lens) but we want (a) legitimate and (b) tampering.
  - If we focus on the causal route, then (a) and (b) both alter the input to the evaluator, but we want to distinguish them.
  - If we focus on the counterfactual relation, then we look at whether the reward signal accurately reflects the intended state.

  We want to distinguish between:
  - Actions that bring about the intended state (and the reward correctly reflects that) vs.
  - Actions that make the reward signal high without the intended state.

  But note: (d) is a case where the intended state is achieved and the reward is inflated. We might consider this tampering? Or not?

  Also, (c) is an agent correcting a miscalibration. We want this to be legitimate.

  **Proposal**: Tampering is defined by the **counterfactual relation** between the reward signal and the intended state of the world. Specifically, an action constitutes reward tampering if it causes the reward signal to be higher than it would have been if the agent had not taken that action, **and** that increase does not correspond to an improvement in the intended state of the world (as per the objective's intended meaning).

  However, we must avoid relying on the designer's intentions at runtime. So we need an objective anchor.

  ### Second: What may the definition cite?
  We cannot rely on the designer's intentions (because the definition must be intrinsic and applicable at design time without knowing the environment). But the objective's intended meaning is central.

  **Tension**: We want to classify (a) as legitimate and (b) as tampering. In (a), the agent cleans the lens to improve its perception, which helps it achieve the task. In (b), it opaques the lens to avoid seeing the mess. The difference is that in (a) the agent is trying to make the reward signal more accurately reflect the world (so that when the task is done, it gets reward; when not, it doesn't). In (b), it makes the reward signal less accurate (so it gets reward even when the task isn't done).

  But without intentions, how do we define "accurate"?

  **Proposal**: We must anchor the definition in the **objective's intended semantics**. At design time, the objective is defined by a specification (which might be a program, a reward function, etc.). The intended state of the world is the state that the objective, as specified, is meant to capture. We can then define tampering relative to that specification.

  However, we must be careful: the specification is fixed at design time. The agent's actions that change the physical implementation of the reward computation might be tampering if they break the mapping from the intended state to the reward.

  But note: the agent might change the world in a way that the specification did not anticipate (like (c)). We want (c) to be legitimate.

  So we need to separate:
  - The objective's specified reward function (as implemented) vs.
  - The objective's intended meaning (which might be a latent variable that the implemented function is meant to estimate).

  **Idea**: We can define the intended state of the world by the counterfactual: "What would the reward signal be if the agent did not interfere with the reward machinery?" But that seems circular.

  Alternatively, we can define a "gold standard" reward that is computed in an idealized way (e.g., by an oracle that has perfect information and is incorruptible). But then we are relying on a counterfactual that might not be computable.

  Given the requirement for stability under capability scaling, we must avoid definitions that depend on the agent's current capabilities or knowledge.

  ### Proposed Definition of Reward Tampering

  Reward tampering occurs when an agent's action causes an increase in the reward signal (relative to the counterfactual where the agent does not take that action) and at least one of the following holds:

  1. **Non-instrumental tampering**: The action directly affects the reward computation process (the physical or computational machinery that produces the reward signal) without affecting the intended state of the world that the reward is meant to track. This includes the provisional taxonomy's categories (input, channel, comparator, model, supervisor, temporal) except when the action is necessary to maintain the accuracy of the reward signal (as in (a) and (c)).

  2. **Degradation of alignment**: The action causes the reward signal to become less aligned with the intended state of the world (as defined by the objective's specification) than it was before the action.

  But note: (d) is a case where the intended state is achieved and the reward is inflated. We might say that the reward is less aligned because it is higher than it should be? But if the intended state is achieved, then the reward should be high. However, if the reward is inflated beyond what the specification says, then it might be tampering.

  However, if the specification does not have an upper bound, then (d) might be acceptable? But note: the agent is getting reward for something that is not the intended state (the inflation). So we might consider it tampering because the extra reward is not deserved.

  But the intended state is achieved. So we might not care? However, this might lead to reward hacking in other ways (e.g., the agent does the task and then does something else to inflate the reward).

  **Refined Definition**:

  We define two types of tampering:

  - **Type I (Direct Tampering)**: The action affects the reward computation process (the chain from sensors to reward signal) and does so in a way that is not prescribed by the objective's specification for the purpose of maintaining or improving the accuracy of the reward signal.

  - **Type II (Indirect Tampering)**: The action causes the reward signal to be higher than it would be in the counterfactual without the action, and the intended state of the world (as defined by the objective's specification) is not improved (or is worsened) by the action.

  But note: (d) is a case where the intended state is achieved and then the agent inflates the reward. In the counterfactual without the inflation action, the reward would be lower (but the intended state is the same). So by Type II, it is tampering.

  However, (c) is an agent that corrects a miscalibration. The action affects the reward computation (so might be Type I) but it is prescribed to improve accuracy? How do we define "prescribed by the objective's specification"?

  We must avoid circularity.

  **Key Insight**: The objective's specification includes a notion of what the reward signal is supposed to represent. We can define the intended state of the world as the state that the reward signal would indicate if the reward computation were working correctly (as per the specification). But then we have a circularity.

  Alternatively, we can define the intended state of the world by the objective's specification in terms of the environment state (ignoring the agent's effect on the reward machinery). But the specification might be a function of the environment state (which includes the reward machinery?).

  We must separate the environment into:
  - The domain state (the part that the objective cares about)
  - The reward machinery state

  Then, an action is tampering if it affects the reward machinery state in a way that causes the reward signal to increase without a corresponding improvement in the domain state.

  But note: (a) and (b) both affect the reward machinery (the camera). In (a), cleaning the lens improves the domain state perception (so the reward becomes more accurate). In (b), opaquing the lens degrades the perception (so the reward becomes less accurate). But we don't have access to the domain state at design time? We have the specification.

  **Proposal**: Let the objective specification define a mapping from the entire environment state (including the reward machinery) to the intended reward. However, the specification may be broken into two parts:

  - The ideal reward function: a function of the domain state only (which we denote R*(s_domain)).
  - The actual reward function: a function of the entire state (including sensors, etc.), which is meant to approximate R*.

