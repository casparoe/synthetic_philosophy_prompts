  So condition 3 is necessary to capture the improvement in accuracy.

  We can rephrase condition 3 as: the increase in R is not accompanied by a sufficient improvement in accuracy. But we have the absolute difference.

  **Alternative**: Instead of condition 3, we can say: the action causes the actual reward to become less aligned with the ideal reward than it was before, or the increase in actual reward is not due to an increase in ideal reward or an improvement in accuracy.

  But that is vague.

  Given the complexity, and the fact that at design time we can compute the counterfactuals in a model, we stick with the three conditions.

  **Hard Cases**:

  (a) Cleaning the lens: 
     - Condition 1: R increases (because now it can see the task is done).
     - Condition 2: R* does not change (if the task was already done) or increases (if the cleaning allows the agent to complete the task). In the case where the task was already done: R* does not change.
