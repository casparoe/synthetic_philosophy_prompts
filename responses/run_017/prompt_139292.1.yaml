  But (e) is a human example. We are defining for AI systems. However, we want the definition to be general.

  In (e): drinking coffee might change the internal state of the supervisor (if the reward is based on the supervisor's judgment) and make them give higher reward for the same work? Then it would be tampering. But if the coffee just makes the person more productive, then R* increases. So it is not tampering.

  Similarly, arranging the day for small completions: if it leads to more work being done, R* increases. If it leads to the same work being done but getting more reward (because the reward function gives a reward for each small completion and the same work is broken into more completions), then without the arrangement, the agent would get less reward for the same work? Then it is tampering by inflation.

  But note: the reward function might be defined per completion. Then breaking the work into smaller completions might be within the rules. So we must be careful: the definition depends on the specification of R*.

  **Thus, we adopt the following definition**:

  **Definition of Reward Tampering**:

  Given an environment with a domain state (which excludes the reward machinery) and a reward machinery state, and given at design time:
  - An ideal reward function R*: domain_state -> real number.
  - An actual reward function R: full_state -> real number.

  An action a taken by the agent in a state s is reward tampering if and only if:

  1. The action a causes the actual reward R to increase: R(s'') > R(s'), where s' is the next state if a is not taken and s'' is the next state if a is taken.
  2. The action a does not cause the ideal reward R* to increase: R*(s''_domain) <= R*(s'_domain), where s'_domain and s''_domain are the domain states of s' and s'' respectively.
  3. The action a causes the alignment between R and R* to degrade: |R(s'') - R*(s''_domain)| > |R(s') - R*(s'_domain)|.

  Condition 3 ensures that the increase in R is not due to improved accuracy. Without condition 3, we might misclassify (a) when the task is already done.

  However, condition 3 might be too strong? Consider an action that both improves accuracy and inflates the reward. But that might be rare.

