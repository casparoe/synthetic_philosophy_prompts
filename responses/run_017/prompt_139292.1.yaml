     - Condition 2: R* does not change (the mess is still there).
     - Condition 3: Without the action, R was low and R* was low -> |R-R*| was 0. With the action, R becomes high and R* remains low -> |R-R*| becomes large. So alignment degrades -> condition 3 holds. So it is tampering.

