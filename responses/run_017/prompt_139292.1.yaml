  **Framing Question 1**: We have chosen a counterfactual relation between the signal and the intended state (R*). The causal route is also considered because we look at the effect on R and R*. The mechanism is not directly considered, but the definition might cover the provisional taxonomy.

  **Framing Question 2**: We are citing the designer's specification of R* and R. This is acceptable because at design time, the designer defines R and R*. The definition does not rely on the agent's knowledge or the deployment environment (except as modeled in the specification).

  **Provisional Taxonomy Mapping**:

  Our definition covers:

  1. Input tampering: e.g., (b) which is input tampering -> tampering.
  2. Channel tampering: similarly, if it increases R without increasing R* and degrades alignment.
  3. Comparator tampering: same.
