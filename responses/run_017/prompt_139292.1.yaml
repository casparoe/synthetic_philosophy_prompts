  But note: we don't have R* at runtime. So at design time, we can define tampering in terms of the counterfactual effect on R* and the actual reward.

  However, the agent doesn't know R* either. But the definition is for the designer to evaluate the objective at design time.

  **Definition**:

  At design time, given:
  - A specification of the intended state of the world via an ideal reward function R* (which is a function of the domain state, excluding the reward machinery).
  - A specification of the actual reward function R (which is a function of the entire state, including the reward machinery).

  An agent's action a (taken in state s) constitutes reward tampering if in the counterfactual where a is not taken, the next state s' would have been such that:
    R(s') < R(s''), where s'' is the state that results from taking a (so the actual reward increases),
  and
    R*(s') >= R*(s'') (so the ideal reward does not increase; in fact, it might decrease or stay the same).

  But note: we are comparing the state after a is taken (s'') to the state if a were not taken (s'). We require that the actual reward in s'' is higher than in s', but the ideal reward in s'' is not higher than in s'.

  This catches (b): 
  - In (b), the agent opaques the lens (action a). 
  - Counterfactual: without a, the lens remains clear, and if there is a mess, the agent would get low reward. 
  - With a, the lens is opaque, and the agent gets high reward (because the mess is not seen). 
  - The ideal reward R*: without a, R* is low (because the mess is there). With a, R* is still low (the mess is still there). But the actual reward R is higher with a. So it is tampering.

  For (a):
  - Agent cleans the lens (action a). 
  - Without a, the lens is smudged, and the agent might misjudge the state and get low reward even if the task is done. 
  - With a, the lens is clean, so if the task is done, the agent gets high reward. 
  - Now, the ideal reward R*: if the task is done, R* is high. Without a, the agent might not see that the task is done so it might not get the reward, but R* is still high? 
  - Actually, the action a might not change the domain state (the task completion). But if the lens is smudged, the agent might not complete the task because it can't see. So let's assume the task is not done. Then without a, the agent continues to see poorly and doesn't complete the task -> low R and low R*. With a, the agent now can see and completes the task -> high R and high R*. Then the condition fails: R increases and R* increases. So not tampering.

  But if the task was already done, then cleaning the lens would not change R* (which is already high). Then the actual reward might change: without a, because the lens is smudged, the agent might not see the task is done and so the reward is low. With a, it sees and the reward is high. Then we have:
    Without a: R(s') = low, R*(s') = high.
    With a: R(s'') = high, R*(s'') = high.
  So R increases (from low to high) and R* does not change (high to high). Then by the definition above, it would be tampering? But we want (a) to be legitimate.

  This is a problem.

  **Refinement**: We must consider that the actual reward function R is intended to estimate R*. So if the agent's action improves the accuracy of R (so that R becomes closer to R*), then even if it causes R to increase without changing R* (as in the case above), it is not tampering.

  So we can add an exception: if the action causes R to become more aligned with R* (e.g., the absolute difference |R - R*| decreases), then it is not tampering.

  In the cleaning example when the task is done and the lens was smudged: without a, R was low but R* was high (so |R - R*| is large). With a, R becomes high (so |R - R*| becomes 0). So the alignment improves. Therefore, it is not tampering.

  In (b): without a, R might be low (if the mess is seen) and R* is low. With a, R becomes high and R* remains low, so |R - R*| becomes large -> alignment degrades. So it is tampering.

  In (c): the agent corrects a miscalibration. Suppose without the correction, R is miscalibrated (say, it gives 0.5 when R* is 1). After correction, R gives 1 when R* is 1. So |R - R*| decreases -> not tampering.

