answer: |-
  Your dilemma cuts to the bone: this is about directing scarce resources toward *making futarchy actually work* or exposing why it can't, not polishing theoretical knobs. The funder wants policy relevance within two years, your department cares about legitimacy, and the clock is ticking. Forget elegance; we need traction. Here’s the brutal ordering, why it stings, and what could shift it:

  ### Defended Ordering (Top 3 for Funding)
  1.  **#5: Manipulation Defense (High-Stakes Instability)**  
      **Why First:** This isn't just *a* problem; it's the **existential threat** where futarchy promises the most value. If concentrated actors (oligarchs, monopolists, rogue states) can profitably move policy *and* trade against their own actions, the market implodes. Worse, it incentivizes *creating crises*. Your toolkit (formal decision theory, mechanism design, game theory) is **perfectly matched** to model this. Build formal models of manipulation vectors (e.g., "burning the village to save it" dynamics in war/pandemic markets), test incentive-compatible countermeasures (e.g., identity-based trading restrictions, severe penalties for outcome manipulation correlated with trades, dynamic liquidity caps for known powerful actors). **Trade-off:** It’s highly tractable with your skills, critically important, and moderately neglected (most work assumes good faith or diffuse power). The downside? It feels "negative" – proving something *doesn't* work. But without this, futarchy is a dangerous fantasy in critical domains. **Downstream Impact:** Solving (or definitively failing to solve) this dictates whether futarchy is viable for anything beyond trivia.  
      **What Moves It:** A real-world prediction market manipulation scandal in a policy-adjacent context (e.g., a corporate decision market gamed by insiders) would skyrocket its urgency. Regulatory chatter about market power in forecasting would also boost it.

  2.  **#3: Legitimacy & The Hidden Values Problem**  
      **Why Second:** You’re right that your department cares, but the funder is wrong to dismiss it. **Legitimacy isn't a luxury; it's adoption fuel.** If losers see the price as mere force, not reason, futarchy collapses politically. The deeper issue is your hunch: *Values disagreement masquerading as beliefs*. Formal decision theorists can model this uniquely. Task: Formalize when/why market prices fail to provide "reasons for action" under deep value pluralism. Explore hybrid models (e.g., markets constrained by prior deliberation on *what* is valued). **Trade-off:** High importance (no legitimacy = no adoption), highly tractable for philosophers/decision theorists, and woefully neglected in *formal* terms (lots of hand-waving). You sacrifice some "policy shop ready" immediacy for foundational necessity. **Downstream Impact:** Clarifies if "bet on beliefs" is even coherent when values bleed into beliefs. Shapes how the "values vote" must be structured.  
      **What Moves It:** A major political crisis where technocratic decision-making (e.g., independent central banks, algorithmic welfare) faces populist backlash over legitimacy would make this undeniable. Scholarly work showing prediction markets eroding trust in smaller contexts would also elevate it.

  3.  **#1: The Metric Problem (But Skepticism Required)**  
      **Why Third (With Reservations):** Your workaround is clever but likely a **trap**. Yes, betting on a *ratification judgment* dodges defining the metric upfront. But you’ve identified the fatal flaw: **It transfers the entire value problem to stacking the assembly.** This is not a solution; it's an *attack surface* (incentivizing culture wars over assembly selection). Fund work that *rigorously tests this vulnerability*: Model incentives to manipulate assembly composition/process. Compare liquidity and manipulation resilience vs. fixed metrics in simulations. **Trade-off:** Important (the metric gap *is* core), tractable with decision theory modeling, neglected (most metric talk is hand-wavy). But funding it risks just documenting why the workaround fails. **Downstream Impact:** If viable (unlikely), enables trials. If flawed (likely), forces focus back to simpler domains (#4) or kills the approach.  
      **What Moves It:** A successful (non-manipulated) citizen assembly on a divisive issue would boost interest. Evidence of lobbying/gerrymandering efforts *specifically targeting* future ratification bodies would kill it.

  ### Cut or Deprioritize
  *   **#4: Scale & Small-Scale Trials:** Tempting but **distracting for *this* group.** Why? You lack empiricists. Proving a university budget market "works" tells us little about state-level viability due to scale, stakes, and actor concentration differences. Funders might *think* they want this, but it’s **policy theater** without solving #5 or #1 first. Outsource this to applied econ groups later. *Trade-off:* Sacrifices concreteness for focus on deeper blockers.
  *   **#2: Epistemic Correlation & Model Herding:** Critically important long-term, but **mismatched to your toolkit.** The "decorrelation subsidy" idea is likely incoherent (how do you define/model "provenance" rigorously?) or requires ML expertise to simulate/model trader behavior under shared data. This needs computer scientists/econometricians. *Trade-off:* Neglected and increasingly vital (AI herding is real), but intractable for philosophers/formal theorists alone. Partner or skip.

  ### The Brutal Truth & Alternative
  If the manipulation problem (#5) proves insurmountable in high-stakes domains *and* the legitimacy gap (#3) yawns too wide, the honest answer is that **futarchy is a policy dead-end for anything beyond low-stakes corporate trivia.** The money *might* be better spent on "robust hybrid governance" – e.g., formal models of how prediction markets *advise* elected bodies or citizen assemblies without dictating outcomes. This leverages your skills while dodging futarchy's fatal flaws. But given the funder's directive, attack #5 head-on – it's the keystone.

  \answer{Manipulation Defense}
