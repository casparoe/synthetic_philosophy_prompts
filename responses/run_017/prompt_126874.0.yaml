prompt: |-
  hey — I'm a backend dev with no philosophy background, so apologies in advance if I get the terminology wrong. On weekends I've been hacking on a solver for Bongard problems (you know the kind: six little boxes on the left that all follow some rule, six on the right that all break it, twelve examples total and that's all you get). What I keep flip-flopping on isn't the search algorithm, it's what description language to build the feature extractor around. Here are eight candidate vocabularies for describing a single figure:

  1. raw bitmap / occupancy grid, plus a few global stats like ink density and centroid
  2. shape nouns: how many things, closed vs open curve, convex vs concave, number of holes, order of mirror and rotational symmetry
  3. relations only: inside/outside, touching, connected components, nesting depth, is-between — no absolute sizes or shapes at all
  4. metric and proportion: lengths, angles, areas and ratios between them, with deliberately loose thresholds (about twice as long, roughly a right angle)
  5. generator-first: assume each figure was produced by a short program and describe it by that program's parameters — N copies rotated by 2π/N, an arc of radius r swept through θ, and so on
  6. negative space: run the same shape vocabulary on the background instead of the ink, and on each figure's complement inside its own box
  7. near-miss / defect: describe a figure by which regularities it almost satisfies — a curve that's nearly straight, a symmetry broken in exactly one place
  8. cross-figure deltas: never describe a figure on its own; describe each one by how it differs from the other five on its side, and require that the left panel's set of differences hangs together

  Please rank them by how many problems you'd expect a solver restricted to that vocabulary to actually get right — not by how expressive it is in principle, and not by how much it can describe. The thing that makes this hard for me is that with only twelve examples a vocabulary with tons of knobs can always cook up some rule that fits the left panel, which is worth exactly nothing, so I want you to score each out of 100 with a one-sentence reason that names that tradeoff explicitly. Then: tell me if any two on my list are secretly the same thing wearing different hats, tell me one vocabulary you'd add as a ninth that none of these cover, and say where (if anywhere) the ranking would flip if the problems were mostly about weird one-off shapes instead of clean geometric families. Dont bother citing papers or naming who came up with what — I just want the reasoning.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is a backend developer working on a Bongard problem solver and needs help ranking eight vocabularies for feature extraction. The key challenge is balancing expressiveness with generalization, given only 12 examples. 

  First, I need to understand each vocabulary's strengths and weaknesses in this context. Vocabularies that overfit will score poorly because they can invent rules that fit the left panel but fail to generalize. Simpler, more constrained approaches might handle the limited data better.

  Looking at the list:
  1. Raw bitmap is too low-level; it'll overfit immediately.
  2. Shape nouns are decent but might miss subtle relationships.  
  3. Relations-only could be robust since it ignores exact metrics.  
  4. Metric/proportion seems useful but thresholds could cause issues.  
  5. Generator-first is elegant but assumes shapes are generated procedurally.  
  6. Negative space might capture overlooked features.  
  7. Near-miss descriptions sound clever but require predefined regularities.  
  8. Cross-figure deltas seems promising for finding invariant differences.  

  The biggest trap is expressiveness vs. generalization. Over-parameterized vocabularies (like generator-first) can perfectly fit the training data but fail on new instances. The best candidates should impose useful constraints that align with how Bongard problems are designed.  

  I notice #3 (relations) and #8 (deltas) might overlap in seeking relational invariants, but #8 is more meta. If combined, they could be powerful.  

  For a ninth vocabulary, I'd suggest topological persistence - capturing how features change under deformation. This handles "weird shapes" better than rigid metrics.  

  If problems shift to organic shapes, rankings would flip: generator-first would plummet (too rigid), while near-miss and negative space would gain value by focusing on irregularities. Topological features would shine here too.  

  Scoring requires estimating failure modes. For example:  
  - Bitmap (10/100) fails catastrophically to overfitting.  
  - Relations (80/100) succeeds by ignoring distracting details.  
  - Generator (30/100) fits left panel perfectly but rarely generalizes.  

  The user's core struggle is the bias-variance tradeoff with minimal data. My ranking prioritizes vocabularies that naturally limit hypothesis space without sacrificing key patterns.
answer: |-
  Here's a ranked breakdown with scores, explicit tradeoffs, overlaps, a ninth suggestion, and the "weird shapes" impact:

  **Ranked Vocabularies (High to Low Score):**

  1.  **#3: Relations Only (Inside/Outside, Touching, etc.) - 85/100**  
      *Tradeoff:* Sacrifices **absolute metrics** for **relational invariance**, making rules robust to scaling/rotation/distortion while capturing essential structure without overfitting.
  2.  **#8: Cross-Figure Deltas (Differences within panel) - 75/100**  
      *Tradeoff:* Sacrifices **individual figure description** to focus **only on panel-wide invariants**, inherently filtering out incidental features by demanding consistency across the set.
  3.  **#2: Shape Nouns (# of things, holes, symmetry) - 70/100**  
      *Tradeoff:* Balances **descriptive power** with **discrete abstraction**, avoiding continuous parameter traps while capturing high-level structure crucial for many Bongard rules.
  4.  **#4: Metric & Proportion (Loose thresholds) - 60/100**  
      *Tradeoff:* Uses **fuzzy quantification** to handle variation, but risks **threshold arbitrariness** introducing brittleness if the "fuzz" doesn't match the problem's tolerance.
  5.  **#6: Negative Space (Background/Complement) - 55/100**  
      *Tradeoff:* Gains **complementary perspective** often missed, but risks **doubling the hypothesis space** without necessarily doubling relevant signal, increasing spurious fit chances.
  6.  **#7: Near-Miss / Defect (Broken regularities) - 40/100**  
      *Tradeoff:* Excels at finding **intentional imperfections**, but relies on **pre-defining expected perfections**, which is often the *core unknown* in Bongard problems.
  7.  **#5: Generator-First (Short program params) - 30/100**  
      *Tradeoff:* Matches **procedurally generated figures** perfectly, but suffers **catastrophic brittleness** to organic/varied shapes or rules not based on generation primitives.
  8.  **#1: Raw Bitmap + Global Stats - 15/100**  
      *Tradeoff:* Captures **everything**, but is obliterated by the **curse of dimensionality**; trivial to fit left panel perfectly with nonsense rules that won't generalize.

  **Overlaps & Secret Twins:**
  *   **#3 (Relations) & #8 (Deltas):** They synergize strongly. #8 forces a *panel-level* invariant, which often manifests as a specific *relation* (#3) holding consistently across all left figures but differing on the right. They tackle different scopes (single-figure relations vs. cross-figure variance) but target the same underlying structure. Not identical, but deeply complementary.
  *   **#2 (Shape Nouns) & #5 (Generator-First):** #5 often *outputs* the shapes described in #2 (e.g., a generator for "N rotated copies" inherently defines rotational symmetry). #5 is a specific *method* potentially yielding #2's *features*. #2 is more general.

  **Ninth Vocabulary Suggestion:**
  *   **Topological Persistence:** Describe features (components, holes, concavities) not by precise shape or size, but by **how stable they are under continuous deformation or scaling** (e.g., a small hole vanishes with slight blurring, a large cavity persists). This captures "essence" over exact form, robust to distortion.

  **Ranking Flip for "Weird One-Off Shapes":**
  The ranking **flips significantly below #4**:
  1.  **#6 (Negative Space) Rises:** Weird shapes often rely heavily on figure/ground relationships or silhouettes. Negative space becomes paramount.
  2.  **#7 (Near-Miss) Rises:** Weird shapes are frequently defined by *how* they deviate from simplicity. Explicitly describing the defect is key.
  3.  **#5 (Generator-First) Plummets Further:** Procedural generation is least likely to match truly idiosyncratic forms.
  4.  **#4 (Metric/Proportion) Falls:** Precise measurements (even fuzzy) matter less when shapes are chaotic; relations (#3) and deltas (#8) become more reliable anchors.
  5.  **#2 (Shape Nouns) Falls:** Concepts like symmetry or convexity may be irrelevant or poorly defined for highly irregular shapes.
  6.  **(The suggested #9 - Topological Persistence would likely jump near the top for weird shapes).**

  **In summary:** Prioritize relational (#3) and invariant (#8) abstractions for general geometric Bongard problems. Embrace fuzziness (#4) and negative space (#6) cautiously. Avoid raw data (#1) and procedural assumptions (#5) unless specifically warranted. For weird shapes, shift focus to deformation (#9), defects (#7), and negative space (#6).
