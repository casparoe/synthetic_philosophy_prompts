answer: |-
  Here's a disambiguation of "victors' justice," structured as requested, with specific focus on retroactivity and your closing questions:

  **The Menu: Distinct Claims Under "Victors' Justice"**

  1.  **Claim: Partial Bench (Composition/Impartiality)**
      *   **What must be true:** Judges are exclusively or predominantly appointed by/from the victorious side, lacking genuine neutrality or independence, leading to bias.
      *   **How to tell:** Examine appointment mechanisms, nationality/jurisdiction of judges, evidence of prejudgment, procedural unfairness.
      *   **Criticism targets:** The trial process itself (fairness, legitimacy of verdicts).
      *   **Transfers to Cases?**
          *   *Dictatorship Prosecution:* Likely - if new regime appoints judges perceived as partisan.
          *   *ICC Aggression:* Potentially - if accused states perceive ICC judges as biased against them ("Western court" critique).
      *   **Status:** Substantive and arguable. Requires evidence of *actual* bias or structural inability to be impartial, not just victor-appointment.
      *   **Rhetorical Use:** Common, implies inherent unfairness regardless of evidence.

  2.  **Claim: Selective Prosecution**
      *   **What must be true:** The victors committed substantially similar acts ("tu quoque") but were not investigated or prosecuted.
      *   **How to tell:** Identify comparable conduct by the victors; demonstrate absence of investigation/prosecution despite capability and jurisdiction.
      *   **Criticism targets:** The *decision to prosecute* (selectivity, hypocrisy), potentially undermining the moral authority of the trial and the law applied.
      *   **Transfers to Cases?**
          *   *Dictatorship Prosecution:* Potentially - if former regime members can point to similar acts by transition figures that go unpunished.
          *   *ICC Aggression:* Highly relevant - Accused leaders argue powerful states (non-ICC members) commit aggression with impunity.
      *   **Status:** Substantive and arguable. Requires demonstrable equivalence of acts and a deliberate policy of non-prosecution of the victors.
      *   **Rhetorical Use:** Very common; powerful critique of hypocrisy, often central to "victors' justice" label.

  3.  **Claim: Lack of Jurisdiction**
      *   **What must be true:** The tribunal lacked legal authority under applicable law (domestic or international) to try the defendants for these specific charges.
      *   **How to tell:** Analyze the tribunal's founding statute/charter and applicable law (national law, treaties, custom) at the relevant time regarding jurisdiction *ratione personae* (over the individual) and *ratione materiae* (over the crime).
      *   **Criticism targets:** The trial's fundamental legal basis.
      *   **Transfers to Cases?**
          *   *Dictatorship Prosecution:* Core issue - Retroactive statute challenges jurisdiction based on legality (*nullum crimen*).
          *   *ICC Aggression:* Core issue - Jurisdiction over non-party state nationals for aggression is highly contested under the Rome Statute amendments.
      *   **Status:** Substantive and arguable. Often intertwined with retroactivity. Legally technical.
      *   **Rhetorical Use:** Core legal argument, sometimes simplified to "victors' justice" in popular discourse.

  4.  **Claim: Retroactivity (Nullum Crimen, Nulla Poena Sine Lege)**
      *   **What must be true:** The conduct was not criminal (or not punishable by the specific tribunal/process) at the time it was committed.
      *   **Criticism targets:** The substantive law applied and the fairness of trying someone under it.
      *   **Transfers to Cases?** Central to *both* your cases.
      *   **Status:** Substantive and arguable. The core legal principle of legality. See detailed breakdown below.
      *   **Rhetorical Use:** Often the fallback "serious" argument when pressed. Can be a genuine legal shield or used polemically.

  5.  **Claim: Pre-Determined Outcome (Show Trial)**
      *   **What must be true:** The verdict and sentence were decided before or irrespective of the evidence presented at trial.
      *   **How to tell:** Evidence of external pressure on judges, suppression of defense evidence, denial of fair procedure, implausibly rapid verdicts, political statements dictating outcome.
      *   **Criticism targets:** The trial process itself, rendering it a mere ritual.
      *   **Transfers to Cases?**
          *   *Dictatorship Prosecution:* Risk if trials are perceived as political revenge.
          *   *ICC Aggression:* Potential critique if proceedings are seen as politically motivated.
      *   **Status:** Substantive and arguable (if false). Requires evidence beyond just an expectation of conviction. If true, it's a fundamental injustice.
      *   **Rhetorical Use:** Often an unsubstantiated sneer implying inherent victor bias, but can be a serious accusation if backed.

  6.  **Claim: No Law, Only Power ("Might Makes Right")**
      *   **What must be true:** International criminal law (or the specific law applied) is not genuine law but merely a tool used by the powerful to punish the defeated when convenient. Law is entirely epiphenomenal to power.
      *   **How to tell:** Philosophical/political assessment rather than legal proof. Consistent pattern of only weak/victorious losers being punished supports it.
      *   **Criticism targets:** The entire project of international criminal justice or the specific legal framework as fundamentally illegitimate.
      *   **Transfers to Cases?** Applies generally, especially relevant to *ICC Aggression* critique regarding powerful non-members.
      *   **Status:** Substantive (philosophical/political critique), not tautological (it *could* be false if law is consistently applied). Often overstated.
      *   **Rhetorical Use:** The strongest, most cynical version of "victors' justice," often deployed to end discussion by dismissing the entire enterprise.

  **Retroactivity (Nullum Crimen) Breakdown & Verdicts on Variants:**

  1.  **No Written Enactment Defined the Offence:**
      *   **Must be True:** The specific offence charged lacked a precise definition in written law (statute, treaty) at the time of conduct.
      *   **Is it Enough?** Not necessarily. Customary international law (CIL) can also satisfy *nullum crimen* if sufficiently precise and accessible. Verdict: **Arguable, but insufficient alone if CIL existed.**
  2.  **No Penalty Had Been Attached:**
      *   **Must be True:** While the conduct might have been prohibited, no specific penalty was prescribed by law.
      *   **Is it Enough?** Potentially. *Nulla poena* requires foreseeability of punishment. Verdict: **Substantive and arguable objection.**
  3.  **No Court Stood Ready to Try It:**
      *   **Must be True:** There was no established court with jurisdiction over the offence and the individual at the time. (Closely related to jurisdiction claim).
      *   **Is it Enough?** Highly relevant to foreseeability and fairness. Key issue for *ICC Aggression* case. Verdict: **Substantive and arguable objection.**
  4.  **Accused Could Not Reasonably Have Foreseen Criminality:**
      *   **Must be True:** Even if some legal source existed, a reasonable person in the accused's position could not have known the conduct was criminal.
      *   **Is it Enough?** This is often considered the *core* of the principle (foreseeability). Verdict: **Strongest substantive objection within retroactivity.**
  5.  **Rule Existed But Was a Dead Letter (Non-Enforcement):**
      *   **Must be True:** The law existed on paper but was never enforced, creating a reasonable expectation of impunity.
      *   **Is it Enough?** Highly arguable. Does consistent violation *nullify* the law or just show it's hard to enforce? Does it negate foreseeability? Verdict: **Substantive but difficult to prove; weakens but doesn't necessarily nullify the prohibition.**

  **Complications:**

  1.  **Purpose of Nullum Crimen: Planning vs. Judicial Sourcing?**
      *   **Primary Purpose:** Protecting individual autonomy/foreseeability (planning conduct). Constraining judicial sourcing is a *means* to that end.
      *   **Retroactive Leniency Test:** Retroactive decriminalization/lowering penalties is widely accepted and often seen as beneficial (e.g., post-dictatorship amnesties). This strongly supports the "planning/foreseeability" purpose – the principle protects against *unfavorable* retroactivity, not necessarily *all* retroactivity. The constraint on judicial sourcing exists to prevent judges *creating* unfavorable retroactive law.
  2.  **Good-Faith Belief: Separate or Part of Retroactivity?**
      *   **Status:** Primarily a *version* of the foreseeability objection within retroactivity. If the belief was *reasonable* (based on state practice, legal advice, non-enforcement), it negates the foreseeability required for criminal liability. An *unreasonable* belief (knowing violation) is no defense. It's the *reasonableness* that connects it directly to the legality principle's core purpose.
  3.  **Count-by-Count Assessment:**
      *   **Necessity:** Absolutely crucial. *Nullum crimen* applies *per charge*.
      *   **Your Example:**
          *   *Murder/Ill-treatment in Occupied Territory:* Strong legal basis via Hague Regulations (1907), Geneva Conventions (1929/1949) – likely satisfies *nullum crimen*.
          *   *Crime of Aggression (pre-1945):* Highly contested. Kellogg-Briand Pact (1928) renounced war but lacked individual criminal liability, penalties, or court. Reliance was on emerging CIL – the core Nuremberg debate. Verdict: **Yes, each charge must independently satisfy the legality principle. The legal footing varies significantly.**

  **Closing Questions:**

  1.  **When is "Victors' Justice" a Genuine Argument (Not a Sneer) & Can it Avoid Immunizing Everyone?**
      *   **Genuine Argument:** It's strongest as a substantive critique when focused on:
          *   **Selective Prosecution:** If demonstrably similar victor conduct goes unpunished.
          *   **Lack of Jurisdiction:** If the tribunal truly lacked legal authority.
          *   **Retroactivity (Foreseeability):** If the accused reasonably couldn't have known the conduct was criminal/punishable *at the time*.
          *   **Show Trial:** If the process was fundamentally unfair and predetermined.
      *   **Avoiding Blanket Immunity:** These critiques *don't* inherently immunize everyone. They argue *this specific prosecution* is flawed/unfair/unlawful. They leave open:
          *   Prosecution under valid pre-existing law.
          *   Prosecution by a truly impartial tribunal.
          *   Prosecution where the law was clearly established and foreseeable.
          *   Non-judicial accountability mechanisms (TRCs, lustration, reparations).
          *   The critic *can* still argue amnesty is the *best* or *only feasible* alternative *despite* potential legal grounds for prosecution, but "victors' justice" critiques based on the above points don't *logically compel* amnesty as the sole alternative. They compel *fair and lawful prosecution* or alternative mechanisms.

  2.  **Violating Legality: Is the Trial Itself an Injustice of the Same Kind?**
      *   **Answer:** It is a **serious injustice**, but **not necessarily the *same kind* of injustice** it was convened to punish.
      *   **Reasoning:**
          *   **Nature of Injustice:** The original crimes (aggression, atrocities) typically involve massive violence, suffering, and violations of bodily integrity or sovereignty. A trial violating *nullum crimen* is a profound injustice against the *individual defendant's* fundamental right to a fair trial and the rule of law (procedural/substantive legal injustice). While grave, the *nature* of the harm (denial of due process vs. infliction of physical harm/death) is different.
      *   **Confusion?** Calling it the *same kind* of injustice **is a confusion**. It conflates different types of wrongs (e.g., waging aggressive war vs. retroactive lawmaking; mass murder vs. denial of fair trial). Both are severe injustices, but they belong to different categories within the spectrum of illegality and harm.
      *   **Analogy:** Punishing a thief retroactively under a new law is unjust, but it's not equivalent to the theft itself. Prosecuting aggression via a fundamentally unfair, retroactive process is unjust, but the injustice inflicted *by the trial* is distinct from the devastation caused *by the war*.

  This breakdown provides the conceptual tools to dissect the "victors' justice" label in your interviews and analyze its applicability to your contemporary cases with greater precision.
