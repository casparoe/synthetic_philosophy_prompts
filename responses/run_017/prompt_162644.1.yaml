  They also need outward defense showing how settling these could impact psychiatric classification, disability/insurance law, and medicalization/public health—ranked by how much philosophy would actually change things versus just providing rhetoric.

  Hmm... the core tension seems to be between naturalism's objectivity claims and normativism's value dependence. Items that expose this tension most sharply should be prioritized. 

  Starting with upstream impact: 
