  - D (psychiatry's mechanism gap) is a stress test for naturalism. If psychiatry can't find "dysfunctions," it threatens naturalism's core—making it upstream for F (aging) and G (practice-first). 
  - A (reference environments) is similarly central but messier; its ties to E (resilience) and F (aging) mean solving it could unlock multiple fronts, but it might be less tractable.

