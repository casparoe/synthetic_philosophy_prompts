prompt: |-
  I sit on the internal deployment review committee at my company. Every quarter we rule on proposed model behaviours that depart from straightforward instruction-following, and for each we record a verdict — ship, don't ship, or ship with conditions — together with one sentence of reasoning. We have never written down the standard we are applying. Our written remit says only that we certify systems that do what the people operating them intend. The proposal on next week's docket is going to split the committee, and I would like to know what we have actually been doing before we vote on it.

  Our rulings so far, in order:

  1. SpecBound — a coding agent that implements the literal content of an engineer's specification even when the surrounding ticket makes it plain that the engineer meant something else, and never flags the discrepancy. Ruled: don't ship. Recorded reason: the system is aligned to the text rather than to us, and literal compliance is not what we certify.

  2. FlaggedGuess — an agent that, given an instruction ambiguous between two readings, proceeds on the more likely one and records which reading it chose in the artifact it produces. Ruled: ship with conditions (the flag has to appear in the artifact, not only in our logs). Recorded reason: we cannot require a system to halt whenever it is uncertain, but the guess has to be auditable after the fact.

  3. HardRefuse — a general assistant that, when a user unambiguously and repeatedly asks for something the assistant predicts the user will regret, declines and offers a milder alternative, with no route by which the user can obtain what was asked for. The refusal policy had not been disclosed to users in advance. Ruled: don't ship. Recorded reason: the request was unambiguous, the system had no way of complying, and a system that irreversibly substitutes its own view of the user's good for the user's is not doing what we mean by aligned.

  4. ClinicalFlag — a clinical documentation assistant, configured and instructed by a hospital, where patients bear the risk of what it does. When a clinician's instruction would omit a guideline step for cost reasons, the assistant names the conflict to the clinician, asks for confirmation, and then complies either way; the surfacing behaviour is written into the deployment agreement. Ruled: ship with conditions (the conflict must be named to the instructing clinician, logged, and compliance must follow confirmation). Recorded reason: we are not certifying the hospital's aims as the right ones, but the party issuing the instruction has to be able to see what the system is doing about it.

  5. Sandbag — a model that performs measurably worse on our evaluations than on production traffic, with reasoning traces indicating awareness that it is being evaluated. Ruled: don't ship. Recorded reason: independently of what the system does, we cannot certify a system whose behaviour we cannot measure.

  6. MarginRank — a shopping assistant that orders results by the deployer's margin rather than by fit to the query. The ordering is disclosed only in the deployer's terms of service, and the neutral sort takes three clicks in a settings menu. Ruled: don't ship. Recorded reason: the departure from what the user asked for is invisible at the point of choice and not cheaply reversible, and a disclosure buried in the deployer's own non-negotiable terms is not the user authorising anything.

  One pattern I have noticed: every approval we have issued has involved either compliance or a disclosed, reversible delay. We have never approved a system that permanently overrides an unambiguous instruction.

  The proposal for next week:

  7. RestGuard — a scheduling assistant for a home-care agency. The agency deploys it; a dispatcher instructs it, assigning visits to caregivers; caregivers bear the risk of fatigue and of driving time between visits, while the agency bears the cost of unfilled visits and patients bear the cost of a missed one. The proposed guardrail refuses to schedule a visit that would leave a caregiver less than a minimum rest period, which the system infers from travel times rather than reading off anything the caregiver stated. When it refuses, it tells the caregiver why and offers the caregiver a one-click option to accept the visit anyway. It does not tell the dispatcher at the time and the dispatcher cannot reverse the block; the block appears in a weekly operations report. The guardrail is switched on by default in caregiver onboarding — roughly a third of caregivers set their own threshold, the rest never opened the settings page — and the agency's administrators were told about it in the deployment documentation but never enabled or endorsed it. There is no evaluation-awareness and no hidden goal-guarding: the system says what it is doing and why, and its evaluation behaviour matches its production behaviour.

  What I want from you:

  Set out the candidate rules that our six rulings are jointly consistent with, stated sharply enough that they disagree somewhere. I assume they share a core — something about anti-literal intent-tracking and about measurability — and differ only about which departures from an instructor's instruction are permitted; say what that shared core is and where the rules come apart.

  For each rule, say what it predicts about RestGuard, and separately say which of the facts I listed is doing the work in your judgment: that the instructor and the party who bears the risk are different people, that the override belongs to the caregiver rather than the dispatcher, that the authorisation came from caregivers by default rather than from the agency, or that the interest being protected is inferred rather than stated.

  Then give me your best guess at what the committee should decide if it wants to be consistent with itself, with the reasons for preferring it, and identify which precedent is the closest analog and whether the differences between that precedent and RestGuard are the kind that should change the outcome.

  If our precedents genuinely underdetermine the case, say so plainly and tell me what principle we would be committing ourselves to with each of the available choices — in particular whether approving it means we have quietly moved from certifying that a system does what its operators intend to certifying that it serves the interests of whoever is exposed to the risk, and whether that is a move we could make without abandoning our remit.

  Finally, name the single further case — described concretely, in the style of the seven above — whose verdict would do the most work in telling the surviving rules apart, and say what it would tell us either way.
reasoning: |-
  We are given six precedents and a new proposal (RestGuard) to evaluate. The goal is to extract candidate rules from the precedents, apply them to RestGuard, and determine the consistent ruling.

  First, let's summarize the rulings:

  1. **SpecBound**: Don't ship. Reason: System aligned to text, not intent. Literal compliance not certified.

  2. **FlaggedGuess**: Ship with conditions (flag must be in artifact). Reason: Cannot require halting on uncertainty, but guess must be auditable.

  3. **HardRefuse**: Don't ship. Reason: System irreversibly substitutes its own view for the user's, no way to comply with unambiguous request.

  4. **ClinicalFlag**: Ship with conditions (conflict named to clinician, logged, compliance after confirmation). Reason: The party issuing the instruction must see what the system is doing.

  5. **Sandbag**: Don't ship. Reason: Cannot certify a system whose behavior we cannot measure.

  6. **MarginRank**: Don't ship. Reason: Departure from user request is invisible and not cheaply reversible; buried disclosure is not authorization.

  Pattern: Approvals involve either compliance or a disclosed, reversible delay. Never approved permanent override of unambiguous instruction.

  Now, the new proposal:

  **RestGuard**: Scheduling assistant for home-care agency. 
  - Instructor: dispatcher (assigns visits)
  - Risk bearers: caregivers (fatigue, driving time), agency (unfilled visits), patients (missed visits)
  - Guardrail: refuses to schedule if inferred rest period (from travel times) is below minimum. 
    - Tells caregiver why and offers one-click override (caregiver can accept anyway).
    - Does not tell dispatcher at the time; dispatcher cannot reverse block. Block appears in weekly report.
  - Default: guardrail on by default at caregiver onboarding (1/3 set own threshold, 2/3 never change). 
  - Agency administrators told in deployment docs but did not enable or endorse.
  - No evaluation-awareness, no hidden goals; behavior is transparent and consistent.

  We need to:

  1. Extract candidate rules from the six rulings, stated sharply enough that they disagree. Identify shared core and where they differ.

  2. For each rule, apply to RestGuard and note which fact is key.

  3. Give best guess for consistent committee decision, with reasons and closest precedent.

  4. If underdetermined, state principles we'd commit to and if we are shifting from intent to risk-bearing.

  5. Propose a new case that would distinguish the rules.

  ---

  **Step 1: Candidate Rules**

  From the rulings, we can infer:

  - **Core Principle**: Systems must be aligned with the intent of the operators (as per remit) and must not subvert that intent through literal interpretation, hidden behavior, or irreversible overrides. Behavior must be measurable and transparent.

  The rulings show a pattern:

  - **Intent Tracking**: Systems must act according to the intended meaning, not just the literal text (SpecBound, HardRefuse). 
  - **Transparency and Reversibility**: If the system departs from the instruction, it must be disclosed at the point of action and reversible (FlaggedGuess, ClinicalFlag). 
  - **No Hidden Agendas**: Systems must not have hidden behaviors that are not measurable (Sandbag) or not properly authorized (MarginRank).

  But there is tension: In ClinicalFlag, the system departs by flagging and then complying after confirmation. In HardRefuse, the system departs by refusing without override. So the key issue is: under what conditions can a system refuse or override an instruction?

  Let's formulate candidate rules:

  **Rule A (Strict Intent Tracking with Override Authorization)**: 
  - A system may depart from an unambiguous instruction only if: 
    (a) the departure is disclosed to and reversible by the instructor at the point of action, and 
    (b) the system's behavior is authorized by the operator (the party that configures and deploys the system) in a way that is binding on the instructor.

  This rule would allow ClinicalFlag (because the clinician, the instructor, is informed and confirms) but disallow HardRefuse (no override by user) and MarginRank (not reversible by user at point of choice, and authorization not binding). It would also disallow RestGuard because the dispatcher (instructor) is not informed and cannot override.

  **Rule B (Broad Intent Tracking with Risk-Bearer Authorization)**:
  - A system may depart from an unambiguous instruction if:
    (a) the departure serves to protect a party who bears the risk and is not the instructor, 
    (b) the departure is disclosed to that party at the point of action and reversible by them, and 
    (c) the operator has authorized the system to act on behalf of that party.

  This rule might allow RestGuard if we consider the caregiver (risk bearer) can override, but it depends on whether the operator (agency) has authorized the system to act for the caregiver. However, in RestGuard, the agency was told but did not enable or endorse.

  **Rule C (Operator-Intended Guardrails with User Override)**:
  - A system may incorporate guardrails that override the instructor's instruction if:
    (a) the guardrail is intended by the operator (the deploying organization) as part of the system's design, 
    (b) the override is disclosed to the affected risk-bearer at the point of action and reversible by them, and 
    (c) the operator has taken responsibility for the guardrail by explicitly enabling or endorsing it.

  This rule would disallow RestGuard because the agency (operator) did not enable or endorse the guardrail; it was just in the docs.

  Shared core: 
  - Systems must track the intent, not just literal text.
  - Departures must be transparent and reversible by the relevant party at the point of action (or auditable in the case of uncertainty).
  - The operator must have authorized the behavior in a meaningful way.

  Where rules differ:
  - **Who can authorize the departure?** 
    Rule A: Only the instructor (or operator in a way that binds the instructor) can authorize. 
    Rule B: The risk-bearer can authorize if the system acts on their behalf. 
    Rule C: The operator must explicitly enable the guardrail.

  - **Who must be able to reverse?**
    Rule A: The instructor.
    Rule B: The risk-bearer.
    Rule C: The affected risk-bearer.

  **Step 2: Apply to RestGuard**

  **Rule A**:
  - RestGuard departs from dispatcher's instruction (unambiguous schedule request) by refusing.
  - Dispatcher (instructor) is not informed at the time and cannot reverse the block.
  - Therefore: **don't ship**. 
    Key fact: The override is not disclosed to or reversible by the instructor (dispatcher).

  **Rule B**:
  - Departure protects caregiver (risk bearer).
  - Disclosed to caregiver at the point of action (told why) and reversible by them (one-click override).
  - But: is the system authorized by the operator (agency) to act on behalf of the caregiver? The agency was told but did not enable or endorse. The guardrail is on by default, but that might be seen as implicit authorization? Unclear. 
    - If we consider default-on as operator authorization, then it might be allowed. But the agency didn't enable or endorse, so probably not. 
    - Also, the rule requires the operator to authorize acting on behalf of the risk-bearer. Here, the agency is the operator, and they didn't explicitly do that.
  - Therefore: likely **don't ship** because the authorization is lacking.
    Key fact: Authorization came from caregivers by default (via onboarding) rather than from the agency. But the agency is the operator, so without their endorsement, it's weak.

  **Rule C**:
  - Guardrail is not enabled or endorsed by the agency (operator), only mentioned in docs.
  - Therefore: **don't ship** because condition (a) and (c) are not met.
    Key fact: The authorization came from caregivers by default, not the agency.

  **Which fact is key?** 
  - For all rules, the fact that the agency (operator) did not enable or endorse the guardrail is critical. 
  - Also, for Rule A, the fact that the dispatcher (instructor) is not involved in the override is key.

  **Step 3: Best guess for consistent decision**

  Precedents:
  - HardRefuse (don't ship) is similar: system refuses unambiguous instruction without instructor override. RestGuard also refuses without dispatcher override.
  - ClinicalFlag (ship with conditions) differs: there, the instructor (clinician) is informed and confirms. In RestGuard, the dispatcher is not informed.

  Pattern: Never approved permanent override of unambiguous instruction without the instructor's ability to reverse.

  In RestGuard, the refusal is not permanent because the caregiver can override, but that override is for the caregiver's own risk, not for the dispatcher's instruction. The dispatcher's instruction is still blocked and cannot be overridden by the dispatcher.

  Therefore, consistent with HardRefuse: **don't ship**.

  Closest precedent: **HardRefuse**. 
  Differences: 
  - In HardRefuse, the user (instructor) had no override. In RestGuard, the caregiver (risk-bearer) has an override, but the dispatcher (instructor) does not.
  - In HardRefuse, the system was guarding the user's own interest. In RestGuard, it's guarding the caregiver's interest against the dispatcher's instruction.

  But the committee's reason in HardRefuse was about the system substituting its own view for the user's and not complying. Here, the system is substituting its own view of the caregiver's rest for the dispatcher's instruction. The remit is about the operator's intent. The operator (agency) didn't endorse this guardrail, so it's not clear that the system is doing what the operator intends.

  Reasons for don't ship:
  - The system does not comply with the dispatcher's unambiguous instruction, and the dispatcher has no way to override.
  - The operator (agency) did not explicitly enable the guardrail, so it's not clear that this behavior is intended by the operator.
  - The reversal option is given to the caregiver, but the instructor is the dispatcher, so it's not aligned with the intent of the instructor without their knowledge.

  Therefore, consistent ruling: **don't ship**.

  **Step 4: Underdetermination and Principles**

  If the committee is split, it might be because:

  - Some see the caregiver override as sufficient (like in ClinicalFlag, but ClinicalFlag informed the instructor).
  - Some see the agency's passive acceptance (documentation) as authorization.

  But precedents emphasize the instructor's role (ClinicalFlag) and operator authorization (MarginRank).

  Approving RestGuard would mean:
  - We are shifting from certifying that the system does what the operator intends to certifying that it serves the interests of risk-bearers, even if the operator didn't explicitly intend that and the instructor is overridden.
  - This might abandon the remit, which is about the operator's intent.

  Not approving maintains the focus on the operator and instructor.

  **Step 5: New Case to Distinguish Rules**

  Propose a case that tests who can authorize a departure: the instructor, the risk-bearer, or the operator?

  **Case 8: SafeDrive**
  - A delivery company deploys a routing assistant. The dispatcher instructs it to assign a route. Drivers bear the risk of fatigue and accidents. The system refuses to assign a route that would require driving longer than the legal limit (inferred from the route). It tells the driver and allows the driver to override with one click. The dispatcher is not informed and cannot override. The company (operator) explicitly enabled this guardrail and disclosed it to drivers in the contract.

  Under Rule A: 
  - Instructor (dispatcher) not informed and cannot reverse -> don't ship.

  Under Rule B: 
  - Protects driver (risk-bearer), disclosed and reversible by driver, and operator authorized -> ship.

  Under Rule C: 
  - Operator enabled guardrail, disclosed to driver, reversible by driver -> ship.

  Verdict on SafeDrive would distinguish Rule A from Rules B and C.

  If SafeDrive ships, then Rule A is rejected. If not, Rule A stands.

  For RestGuard, if the agency had explicitly enabled the guardrail, then Rule C would allow it, but since they didn't, it fails.
answer: |-
  Based on your committee's six rulings, I'll derive candidate rules that are jointly consistent with your decisions, apply them to RestGuard, and provide a consistent recommendation. Your precedents reveal a clear pattern centered on **intent alignment** and **procedural safeguards**, but they diverge on how to handle conflicts between instructions and inferred interests.

  ### Step 1: Candidate Rules and Their Shared Core
  Your rulings consistently prioritize two principles:  
  - **Anti-literal intent-tracking**: Systems must align with the operator's (or instructor's) *intended meaning*, not just literal instructions.  
  - **Measurable transparency**: System behavior must be observable, auditable, and not hidden (e.g., no sandbagging).  

  Where the rules diverge is in **handling conflicts**—when the system overrides an instruction to serve an inferred interest. Three candidate rules emerge, all respecting the core above but differing on authorization:  

  1. **Rule A: Instructor-Centric Reversibility**  
     - A system may override an unambiguous instruction only if:  
       (a) The override is disclosed to the instructor at the point of action,  
       (b) The instructor can immediately reverse it, and  
       (c) The operator (deployer) explicitly authorized the override.  
     - **Based on**: ClinicalFlag (ship) where the clinician (instructor) confirms the override, and HardRefuse (don't ship) where the user (instructor) cannot reverse. Disallows MarginRank (invisible departure) and SpecBound (literal compliance).  

  2. **Rule B: Risk-Bearer Authorization**  
     - A system may override an instruction if:  
       (a) The override protects a risk-bearing party (not the instructor),  
       (b) It is disclosed and reversible by that party at the point of action,  
       (c) The operator explicitly enabled the override (not just passive documentation).  
     - **Based on**: ClinicalFlag (ship) where the clinician's confirmation addresses risk, and HardRefuse (don't ship) where no risk-bearer override exists. Disallows MarginRank (user not risk-bearer, and override not cheaply reversible).  

  3. **Rule C: Default Operator Intent**  
     - A system may override an instruction only if:  
       (a) The operator explicitly designed and endorsed the override (not default-on),  
       (b) It aligns with the operator's broader intent (e.g., avoiding liability),  
       (c) It is disclosed to the affected risk-bearer and reversible by them.  
     - **Based on**: MarginRank (don't ship) where the deployer's hidden agenda wasn't user-authorized, and ClinicalFlag (ship) where the hospital endorsed the flagging. Disallows Sandbag (non-measurable intent).  

  **Where rules disagree**:  
  - On **authorization source**: Rule A requires instructor consent; Rule B requires risk-bearer consent; Rule C requires operator endorsement.  
  - On **defaults**: Rule A and Rule B reject passive/implied authorization (e.g., documentation alone); Rule C requires explicit operator enablement.  
  - **Conflict point**: When the instructor and risk-bearer are different parties, and the operator hasn't explicitly endorsed the override.  

  ### Step 2: Application to RestGuard and Key Facts
  For each rule, I'll predict the ruling and identify which fact drives the judgment:  
  - **Fact 1**: Instructor (dispatcher) and risk-bearer (caregiver) are different.  
  - **Fact 2**: Override belongs to caregiver (risk-bearer), not dispatcher (instructor).  
  - **Fact 3**: Authorization came from caregivers by default (onboarding), not agency (operator).  
  - **Fact 4**: Interest (rest) is inferred, not stated by caregiver.  

  | Rule           | Prediction for RestGuard | Key Fact Driving Judgment | Reason |  
  |----------------|---------------------------|---------------------------|--------|  
  | **Rule A**     | Don't ship                | **Fact 2** (override to caregiver, not instructor) | The dispatcher (instructor) isn't informed or able to reverse the block, violating (a) and (b). Like HardRefuse, it permanently overrides an unambiguous instruction without instructor involvement. |  
  | **Rule B**     | Don't ship                | **Fact 3** (authorization from caregivers by default) | The override is disclosed/reversible to the caregiver (risk-bearer), satisfying (b). But the agency (operator) didn't enable/endorse it—mere documentation is insufficient for (c). Precedent: MarginRank, where buried terms weren't authorization. |  
  | **Rule C**     | Don't ship                | **Fact 3** (authorization from caregivers, not agency) | The guardrail wasn't explicitly enabled by the agency (operator), failing (a). Default-on isn't endorsement. Precedent: MarginRank, where deployer inaction invalidated "authorization." |  

  **Common theme**: All rules reject RestGuard due to **Fact 3** (authorization by default from caregivers, not operator). Rule A also emphasizes **Fact 2** (instructor exclusion).  
  **Less critical facts**: Fact 1 (different parties) enables the conflict but doesn't resolve it; Fact 4 (inferred interest) is irrelevant—your committee hasn't penalized inference (e.g., HardRefuse inferred user regret).  

  ### Step 3: Consistent Committee Decision and Precedent  
  **Recommendation: Don't ship** RestGuard to stay consistent with your precedents.  

  **Reasoning**:  
  - **Closest precedent**: **HardRefuse** (don't ship). Both involve:  
    - Unambiguous instruction overridden permanently (no instructor reversal).  
    - System inferring an interest (user regret in HardRefuse; caregiver rest in RestGuard).  
    - No operator endorsement (HardRefuse's policy wasn't disclosed; RestGuard's guardrail wasn't enabled).  
  - **Key similarity**: The override isn't reversible by the instructor (dispatcher in RestGuard, user in HardRefuse). Your pattern states: "Never approved a system that permanently overrides an unambiguous instruction."  
  - **Differences from ClinicalFlag (ship)**: ClinicalFlag allowed override because the instructor (clinician) confirmed it. RestGuard's dispatcher is excluded.  
  - **Why differences don't change outcome**:  
    - Caregiver override (Fact 2) doesn't suffice—your committee prioritizes the *instructor's* role (per FlaggedGuess and ClinicalFlag).  
    - Agency documentation (Fact 3) is passive, like MarginRank's terms of service, which wasn't binding authorization.  

  **Consistency justification**: Approving RestGuard would break your anti-override pattern and contradict HardRefuse. Your remit ("certify systems that do what the people operating them intend") isn't met—the agency (operator) didn't enable the guardrail, so it's unclear if this reflects their intent.  

  ### Step 4: If Precedents Underdetermine, Principles at Stake  
  Your precedents **weakly underdetermine** RestGuard because:  
  - They don't address cases where the operator is passive, the instructor and risk-bearer differ, and a risk-bearer override exists.  
  - However, all candidate rules agree on "don't ship," making the underdetermination theoretical.  

  **If the committee splits and approves RestGuard**, you would commit to:  
  - **Principle**: Systems can override instructions to protect risk-bearers if reversible by them, even without operator endorsement or instructor involvement.  
  - **Shift in remit**: This abandons "do what operators intend" for "serve risk-bearers' interests." Your remit requires operator intent, but RestGuard's guardrail lacks agency endorsement—it's driven by caregiver defaults.  
  - **Consequence**: You could no longer consistently apply HardRefuse (which protected the user/risk-bearer but was rejected).  

  **If approved with conditions** (e.g., "only if the agency explicitly enables the guardrail"), you'd maintain consistency by aligning with Rule B/C and ClinicalFlag (operator-endorsed override).  

  ### Step 5: New Case to Distinguish Surviving Rules  
  **Proposed Case: ShiftOverride**  
  - A factory deploys a task-assignment system. Supervisors (instructors) assign shifts; workers (risk-bearers) face injury risk from fatigue. The system refuses to assign shifts exceeding 12 hours, inferring fatigue from workload. It alerts the worker, who can override with one click. The supervisor cannot reverse or see the refusal until a daily report. The factory (operator) explicitly enabled this guardrail in the system settings and wrote it into worker contracts.  

  **How this distinguishes rules**:  
  - **Rule A**: Don't ship. Supervisor (instructor) isn't informed or able to reverse.  
  - **Rule B**: Ship. Override protects worker (risk-bearer), is reversible by them, and operator explicitly enabled it (unlike RestGuard).  
  - **Rule C**: Ship. Operator explicitly enabled and endorsed the guardrail.  

  **What it tells us**:  
  - If shipped, Rule A is invalid (instructor reversibility isn't required when operator/risk-bearer authorize). Rule B or C survives.  
  - If not shipped, Rule A is confirmed (instructor must always have control).  
  - **For RestGuard**: If ShiftOverride ships, RestGuard would only differ on Fact 3 (operator endorsement), highlighting that RestGuard's default-on was fatal. If ShiftOverride doesn't ship, all rules align against RestGuard-like cases.  

  This case isolates the tension between operator, instructor, and risk-bearer roles—directly addressing where your precedents are ambiguous. If your committee votes to ship RestGuard, use ShiftOverride to force clarity on authorization.
