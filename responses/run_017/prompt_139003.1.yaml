prompt: |-
  I want the specification before I look at the theories. The dispute I have in mind is the one about whether what someone knows can depend on what is practically at stake: the family of views on which the standards for a knowledge attribution shift with the attributor's context; the family on which practical stakes for the subject herself enter the knowledge relation; the variant on which it is the attributor's stakes that matter; the variant on which the truth of an attribution is settled only relative to a later assessor's perspective; and the variant on which knowledge is a three-place relation between a subject, a proposition and a contrast proposition. Before I score them against each other I want to know what I am entitled to ask of any of them. So: write the desiderata.

  Fix the purpose first, because adequacy is relative to it, and I want the theory to earn its keep twice over. It must state the condition under which a subject may treat a proposition as a reason for acting, in the way a knowledge norm on practical reasoning says she may; and it must state what a speaker says and can be held to when she attributes, withholds, denies or retracts knowledge across contexts. Tell me whether those are two jobs for one theory or two theories in a shared vocabulary. If you think the requirements divide into a semantic list and an epistemic list, say where the division falls, whether the same cases pull in both directions, and whether the division is itself a finding rather than a convenience.

  Here is the raw material your list has to be answerable to. These are the phenomena, not my proposed requirements; I want you to convert them into requirements, say what each is really asking for, and drop or merge any that turn out not to be independent.

  1. The baseline stakes pairs: same evidence, same truth, same subject, no cognitive difference, but a trivial decision in one version of the case and a serious one in the other, with speakers inclined to attribute knowledge in the first and withhold it in the second.
  2. Skeptical contexts: an error hypothesis made salient, and whether whatever happens there is the same mechanism as the stakes effect or a different one that merely looks like it.
  3. Statistical and lottery-type evidence: very strong support of the wrong modal sort, where knowledge seems to fail even though nothing of consequence hangs on the matter.
  4. Hidden stakes: the subject does not know how much hangs on the question, or is wrong about it — a routine report that will in fact be acted on catastrophically, a passenger unaware that the instrument is faulty. Say whether the relevant stakes are the objective ones, the believed ones, or the ones it would be reasonable to believe, and say what happens to the action-guiding role of knowledge if they are the objective ones.
  5. Asymmetric error costs: acting as if p when p is false is catastrophic while failing to act on a true p costs almost nothing, and the mirror image of that. Does the standard respond to both directions of error, and must a theory track them separately?
  6. The floor: when literally nothing at all hinges on p, does every true belief become knowledge, or is there an evidential minimum the standard cannot fall below however idle the context?
  7. Deferred and third-party stakes: a long-dead scientist, a non-human animal, a committee whose members face different losses, a stored output consulted later by someone with everything riding on it. Whose practical situation sets the standard when the subject has none of her own, or when the interested parties diverge?
  8. Diachronic cases and knowledge retained from memory: acquired in an idle context, needed later when much is at stake, and the question of what the agent may then treat as a reason.
  9. Leakage: heavy stakes attached to some other proposition, or to some other decision the subject faces. Does a large bet on q raise the bar for knowing that p?
  10. Moral encroachment: cases where acting on a well-supported true belief would be morally objectionable, as with a statistical generalisation about a person's group. One phenomenon with prudential stakes, or two?
  11. Second-order cases: attributing ignorance, or knowledge of ignorance, in a high-stakes context — whether the theory's own deliverances are hostage to the mechanism it posits.
  12. Embedding: "knows" inside the antecedents of conditionals, in questions about whether someone knows whether, in reports of other people's attitudes, and under negation. Whether the operative context is introduced by the embedding environment, and what follows for the theory if it is.

  Alongside the cases I want the distinctions a theory is not allowed to collapse, with the consideration behind each: knowing versus being reasonable to treat p as a reason, on pain of the theory having merely redescribed a decision-theoretic notion in epistemic vocabulary; knowing versus being in a position to assert; the standard's moving versus the subject's epistemic position's moving; whether someone knows versus how well positioned she is; genuine disagreement between a low-stakes attribution and a high-stakes denial versus a mere difference in what is said; and whether the theory can declare the low-stakes attributor to be in error without convicting ordinary epistemic speech of systematic falsehood.

  Two things I want most. First, sort the requirements by status: mark which are load-bearing for any theory with the purposes I have fixed, and which are preferences of one camp that have been smuggled in as constraints — I have in mind the demands that knowledge cannot be lost without a change in the subject's evidence or mental life, that knowledge cannot depend on factors the subject could not know about, that the expression must behave identically in every embedding, that ordinary speakers' verdicts are data rather than the output to be explained, that a norm must be usable by the agent who is guided by it, and that a semantic account must not be revisionary. Adjudicate those: for each, is it a desideratum or a methodological commitment in disguise? Second, identify any subset of the surviving requirements that cannot be jointly satisfied. I suspect there is a three-way trade among the truth of low-stakes attributions, the truth of high-stakes denials, and the claim that both are about one and the same relation between the subject and the proposition; if that is right, say what each candidate view buys by giving up which corner, and whether the trade is really a trilemma or an artefact of how I have set the purpose.

  Finish with two short things. Nominate the single requirement that does the most exclusionary work, and say why it is that one rather than the more frequently cited ones. Then, in a paragraph or less per family, note where each of the five approaches I opened with fails the list — as a check on the list, not as a ranking: I want to know what each failure shows about the requirements, not which theory wins. If nothing on offer satisfies the whole list, sketch in a sentence or two what a view that did would have to look like.
reasoning: |-
  Okay, let me unpack this dense philosophical query. The user is clearly deeply familiar with epistemology and contextualism debates, asking for a rigorous framework to evaluate competing theories of knowledge attributions. 

  First, I need to anchor everything to the dual purpose they specified: the action-guiding norm of practical reasoning and the semantics of knowledge attributions. These aren't separable - any theory must handle both in a unified way because knowledge attributions directly bear on action permissions. 

  Looking at their raw material, I'm grouping phenomena into core requirements. The stakes cases (#1) and retraction data (#12 embedding) seem fundamental for the semantic side, while hidden stakes (#4) and diachronic cases (#8) test the action-guiding function. Moral encroachment (#10) might be derivative if we can reduce it to asymmetric error costs (#5), but the user wants this probed so I'll treat it as distinct for now.

  The tricky part is adjudicating methodological demands. User suspects "no loss without evidence change" is a smuggled commitment - they're right. It's not inherent to the dual purpose; a theory could allow purely contextual knowledge shifts if it explains why agents can still act on "lost" knowledge. Similarly, "factors subject can't know" is really about action-guidance usability - so I'll mark that as load-bearing.

  Ah, the trilemma they mention is key. Testing it: if we insist knowledge is univocal (same relation in all attributions), then low-stakes "knows" and high-stakes "denies" can't both be literally true. The escape routes become clear: contextualism sacrifices univocality, subject-sensitive invariantism sacrifices attribution truth across contexts, and relativism sacrifices the action-guiding norm's stability. 

  For exclusionary power, the retraction requirement (#12) is brutal - it forces theories to explain why we withdraw past claims ("I didn't know") without evidence change. This sinks simple versions of subject-sensitive invariantism. 

  Sketching a solution: maybe a hybrid where the knowledge norm tracks objective/subjective stakes (addressing #4, #7) while attributions reflect assessor-relative standards (handling #12). But that risks bifurcating the concept. Alternatively, a pragmatic story about warranted assertibility could absorb some variance without touching knowledge itself - but then we lose the tight action-knowledge link. 

  The user's depth means I can't cut corners. Each family's failure must pinpoint which requirement exposes its weakness: contextualism struggles with action-guidance (#8 memory cases), subject-sensitive theories falter on deferred stakes (#7), etc. This isn't about picking winners but stress-testing the framework.
answer: |-
  Here is a systematic specification of desiderata for theories addressing knowledge attributions and their practical role, structured by your requirements. Desiderata are classified as **Core** (load-bearing for your dual purpose), **Explanatory** (necessary to account for key phenomena), or **Methodological** (sometimes smuggled commitments requiring scrutiny). Trade-offs and theory failures are noted at the end.

  ---

  ### **I. Core Desiderata**  
  *(Non-negotiable for the dual purpose)*  
  1. **Action-Guiding Norm (AGN)**:  
     - State precise conditions under which a subject S is epistemically permitted to treat proposition *p* as a reason for acting.  
     - Must explain how this permission interacts with practical stakes (e.g., trivial vs. life-altering decisions).  

  2. **Attribution Truth-Conditions (ATC)**:  
     - Specify what makes a knowledge attribution ("S knows that *p*") true/false across contexts (attributor, subject, assessor).  
     - Account for retraction, denial, and cross-context disagreement (e.g., "I was wrong to say she knew").  

  3. **Unity Constraint**:  
     - AGN and ATC must share a single concept of *knowledge*, not two distinct ones.  
     - *Rationale*: If AGN and ATC diverge, "knowledge" becomes ambiguous, undermining the norm’s authority in attribution practices.  

  ---

  ### **II. Explanatory Desiderata**  
  *(Derived from phenomena; must be addressed jointly)*  
  | Phenomenon | Desideratum | Key Challenge |
  |------------|-------------|---------------|
  | **1. Baseline Stakes Pairs** | Explain asymmetric knowledge attributions given identical evidence/subject, but differing stakes. | Reconcile with AGN: why may S act on *p* in low stakes but not high? |
  | **2. Skeptical Contexts** | Differentiate error-salience effects from stakes effects. | Avoid conflating two distinct mechanisms (e.g., epistemic vs. pragmatic). |
  | **3. Lottery/Statistical Evidence** | Explain why strong probabilistic support fails to yield knowledge, even absent stakes. | Specify modal/evidential constraints beyond probability. |
  | **4. Hidden Stakes** | Resolve whether stakes are objective, believed, or reasonably believed. | If objective, AGN becomes unusable (S can’t access "true" stakes). |
  | **5. Asymmetric Error Costs** | Determine if standards respond symmetrically to false-positive vs. false-negative risks. | Test whether theories collapse prudence into epistemology. |
  | **6. The Floor** | Decide if knowledge requires a non-collapsible evidential floor (e.g., true belief + minimal evidence). | AGN implications: can S act on *any* true belief if stakes=0? |
  | **7. Deferred/Third-Party Stakes** | Specify whose stakes matter when S lacks stakes or parties diverge (e.g., dead scientist, committee). | Prevent AGN from becoming alienated from S’s perspective. |
  | **8. Diachronic Cases** | Explain if knowledge retained from low-stakes contexts licenses action in high-stakes. | AGN must handle temporal stability/instability. |
  | **9. Leakage** | Determine if stakes for *q* raise the bar for knowing *p*. | Block implausible "holistic" encroachment. |
  | **10. Moral Encroachment** | Clarify if moral stakes operate identically to prudential stakes. | Test reductionism (e.g., moral risk as error cost). |
  | **11. Second-Order Cases** | Ensure attributions of ignorance/knowledge avoid self-refutation in high-stakes contexts. | Preserve consistency for the theory’s own claims. |
  | **12. Embedding** | Fix the context for "knows" in conditionals, questions, attitudes, and negation. | Avoid semantic chaos if context shifts mid-sentence. |

  ---

  ### **III. Mandatory Distinctions**  
  *(Theories must not collapse these)*  
  - **Knowledge vs. Reasonable Action**: Knowledge ≠ justified treatability-as-reason. *Risk*: Reducing knowledge to decision-theoretic rationality.  
  - **Knowledge vs. Assertability**: What S may assert ≠ what S knows (e.g., lottery cases).  
  - **Standard’s Movement vs. Epistemic Position’s Movement**: Shifting thresholds ≠ loss of evidence/reliability.  
  - **Genuine Disagreement vs. Mere Ambiguity**: Do low/high-stakes speakers contradict or talk past?  
  - **Knowing vs. Being Well-Positioned**: Avoid eliding the binary "knows/doesn’t" with graded justification.  

  ---

  ### **IV. Methodological Commitments: Desiderata or Dogmas?**  
  | Claim | Status | Verdict |
  |-------|--------|---------|
  | **"Knowledge can’t be lost without evidence change"** | Methodological | *Not core*: Rejected if AGN/ATC require context-sensitivity (e.g., stakes shifts). |
  | **"Knowledge can’t depend on unknowable factors"** | Desideratum (derived from AGN) | *Core*: AGN requires S to access conditions for action. |
  | **"Uniform embedding behavior"** | Methodological | *Not core*: Context-sensitive expressions (e.g., "tall") vary under embedding. |
  | **"Ordinary speaker verdicts are data"** | Explanatory | *Weakened*: Verdicts are inputs but may be erroneous; theory can explain why they arise. |
  | **"Norms must be usable by agents"** | Desideratum (derived from AGN) | *Core*: Unusable norms fail action-guidance. |
  | **"Semantic non-revisionism"** | Methodological | *Not core*: Revisionism acceptable if it best serves AGN/ATC unity. |

  ---

  ### **V. The Trilemma and Trade-offs**  
  Your suspicion is correct: **Truth of low-stakes attributions (T-LOW)**, **truth of high-stakes denials (T-HIGH)**, and **univocality of "knowledge" (UNIV)** form an inconsistent triad.  
  - **Trade-off 1**: Sacrifice **UNIV** → *Contextualism/Relativism*: "Knows" expresses different relations/standards in different contexts.  
  - **Trade-off 2**: Sacrifice **T-HIGH** → *Classical Invariantism*: High-stakes denials are false; speakers confuse knowledge with caution.  
  - **Trade-off 3**: Sacrifice **T-LOW** → *Strict Subject-Sensitive Invariantism*: Low-stakes attributions are false; knowledge is always hard.  
  *Is it artefactual?* No—it arises directly from the dual purpose: if knowledge licenses action (AGN), and stakes affect licensing (T-LOW/T-HIGH), univocality forces a single standard incompatible with both.  

  ---

  ### **VI. Most Exclusionary Requirement**  
  **Action-Guiding Usability (AGN + "unknowable factors")** does the heaviest lifting:  
  - It eliminates views where knowledge depends on **objective stakes** (violated in *Hidden Stakes* cases, as S can’t access true stakes).  
  - It pressures **subject-sensitive invariantism** (if S’s stakes matter but S misjudges them, AGN fails).  
  - It is stronger than "no loss without evidence change" (a popular but negotiable intuition) or "semantic uniformity" (often relaxed for context-sensitive terms).  

  ---

  ### **VII. Theory Failures Against Requirements**  
  1. **Attributor Contextualism** (standards shift with attributor’s context):  
     - Fails **AGN usability**: S can’t discern attributor’s context to determine if they "know" (*Diachronic Cases*).  
     - Fails **Deferred Stakes**: Whose context matters for a dead scientist?  

  2. **Subject-Sensitive Invariantism** (knowledge depends on S’s practical stakes):  
     - Fails **Hidden Stakes**: If S is unaware of true stakes, AGN is unusable.  
     - Fails **Deferred Stakes**: Committees/third-party users lack unified stakes.  

  3. **Assessor Relativism** (truth relative to assessor’s context):  
     - Fails **Embedding**: "If she knew, she should act" becomes contextually unstable.  
     - Fails **AGN**: S can’t anticipate future assessors’ contexts.  

  4. **Contrastivism** (knowledge is ternary: S knows *p* rather than *q*):  
     - Fails **Univocality**: AGN requires treating *p* as reason *simpliciter*, not contrast-relative.  
     - Fails **Lottery Cases**: Contrast with "not the winning ticket" doesn’t resolve statistical worries.  

  5. **Skeptical Mechanism Unity** (treating stakes/error-salience identically):  
     - Fails **Explanatory Differentiation**: Stakes affect action licensing; error-salience affects evidence assessment.  

  ---

  ### **VIII. What Would Satisfy All?**  
  A hybrid view must:  
  - **Anchor AGN to reasonably accessible stakes** (addressing *Hidden Stakes*, *Usability*).  
  - **Allow attribution truth to vary with context** (saving *T-LOW* and *T-HIGH* without contradiction).  
  - **Tether both to a unified epistemic relation** (e.g., S’s evidence + modal stability).  
  *Sketch*: Knowledge is invariant (S’s evidence + safety), but **warranted assertibility of "knows"** shifts with stakes. AGN appeals to knowledge, but **action permissions** incorporate stakes separately. *Challenge*: Avoid divorcing knowledge from the norm.  

  This framework prioritizes your dual purpose while exposing fault lines. Refinements await your engagement with specific theories.
