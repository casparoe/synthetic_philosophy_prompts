  ### Residue Report: What Doesn't Map Cleanly

  | **Residue** | **Hole in Your Framework?** | **Or Philosophers' Imprecision?** | **Details** |
  |-------------|----------------------------|-----------------------------------|-------------|
  | **Interpreting the datum** (what constraint \(\mathcal{C}\) to use) | Framework assumes constraints are given; it doesn't specify them. | Philosophers haven't made it precise. | Your vocabulary handles updates *given* \(\mathcal{C}\), but choosing \(\mathcal{C}\) depends on what "learning a conditional" means—a semantic debate. |
  | **Likelihood for model evidence** | Framework requires \(P(\text{datum} \mid \cdot)\) to be specified. | Real point: Experience doesn't provide likelihoods. | While PGMs elegantly handle virtual evidence, they don't justify the likelihood ratios—this is a **hole** when evidence is linguistic. |
  | **Rigidity of \(P(A)\)** (Camp 2) | Expressible as a constraint, but no principle in VI/PGMs *demands* it. | Imprecise: Why should \(P(A)\) stay fixed? No clear justification. | Framed as an I-projection, it's valid—but the dispute is whether it's *implied*. Philosophers need to formalize why rigidity applies here. |
  | **Triviality results** | Fully mapped (add a node for \(A \rightarrow B\)). | Imprecise: They conflate updating with probabilistic logic. | Philosophers are asking a different question (semantics of conditionals), not challenging the update mechanics. |
  | **Reflection principles** | No direct mapping; not relevant. | Name-dropping (not a genuine connection). | Avoid in your doc—distracts from the core issue. |

  **Summary for Your Team:**  
  - **Stick to the framework:** Both updates are valid I-projections; the conflict reduces to specifying \(\mathcal{C}\). Use cases:
    - If evidence only rules out \((A=1, B=0)\), use Camp 1.
    - If evidence also implies \(P(A)\) is invariant, use Camp 2.
  - **Recommendation:** Default to Camp 1 (conditioning) for linguistic evidence unless context justifies rigidity. For softened updates, use I-projection with exponential-family likelihoods.
  - **No bluffing needed:** The philosophers' core ambiguity (choice of \(\mathcal{C}\)) is genuine and unresolved—flag it as a semantic input to your models. PGMs handle the math cleanly once \(\mathcal{C}\) is chosen.
