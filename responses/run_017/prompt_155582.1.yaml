prompt: |-
  I'm on the capital projects oversight committee for a mid-sized city — me, the city engineer, somebody from finance, two council appointees, and a rotating seat for whichever department's project is on the agenda that month. We see maybe eight to twelve projects a quarter, anywhere from a few hundred thousand to tens of millions, mostly physical construction and mostly software replacements that have gone sideways. Our power is only recommendatory: we write continue / restructure / stop and send it up to council, and council follows us something like nine times out of ten. Two constraints shape everything: we get about thirty or forty minutes per project, and the recommendation has to fit on one page and be readable by a council member who is hearing about the project for the first time and mostly wants to know why the city spent four million dollars and has nothing to show for it.

  I got into an argument with a colleague last week about the dollar auction — you know the one, a dollar gets auctioned but the runner-up also has to pay their final bid, so two people who are each trying to cut their losses end up bidding well past a dollar and both lose. She said that's us, and that it describes every project we've ever let run. I said it isn't, because half the time there's nobody on the other side: we're not bidding against anyone, we're just handing money to a vendor who keeps saying the last twenty percent is right around the corner. We ended up agreeing that some of our projects really do have that structure and some don't, and that the difference matters more than the standard advice does — everything I've read about escalation of commitment and sunk costs bottoms out in "ignore sunk costs," which is true and completely useless to us, because by the time something reaches our desk the spend is gone, and the live question is whether the *remaining* spend is worth it, and the case for that is very often built out of the money that's already gone.

  So I want a procedure, not an essay, and I want it to start with a structure check rather than with "do the future benefits exceed the future costs" (that question always gets answered yes by whoever wants the project). Concretely, what I need: a way to sort a project into something like (a) real rivalry — some other party's money, deadline, or behaviour is part of why continuing looks good; (b) no rival, just a contractor and a slipping schedule; (c) cases where the money already spent genuinely raises the value of finishing, because the permit is grandfathered or the foundation is poured or the data's already migrated and there's no rollback path — plus an actual test that tells (c) apart from the cases where it only feels like that, since "we're too far in to stop now" is the line we hear most and sometimes it's true. Then: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a "stop," and where it hands the decision to a person because it's a values call and not a factual one. I'd like at least two tests that catch escalation specifically rather than just asking whether the project is any good — something like a restart test (would we fund this today as a brand-new proposal from a different department, same remaining cost, same expected benefit) and something that separates the person who authorized the original spend from the person who writes the recommendation — but please say honestly where each test misfires, because the restart test looks to me like it breaks exactly when there is a real completion premium, and I want to know what to do in that case. I also need the exit options spelled out, since "stop" isn't one thing: kill, mothball, descope to something usable, hand it to another body, re-phase — each with different salvage and different politics, and the auction's bid-or-quit-and-lose-everything menu isn't ours. And there has to be a slot for the awkward version of the argument, that finishing is sometimes worth it because a track record of finishing (or of making a contractor eat a change order) has value for every future project we touch: I think that's occasionally real and I also think it's the easiest thing in the world for a project sponsor to abuse, so I want it in the procedure and flagged.

  Then run it on three cases. First, a four-year-old software system replacement at roughly twice its original budget, vendor says it's seventy percent there and needs one more push. Second, a downtown streetscape where a state grant covers sixty percent but only if we finish by a date we now can't hit without more city money, and the state has already changed the rules on us once. Third, a small neighborhood library branch in a district that's been promised one for a decade, thirty percent built, not much left in the budget, and the council member who chairs our committee represents that district — I want the third one to be the case where the procedure says stop and tells me something I won't like, and I want it said plainly instead of hedged. If there's a fourth shape of case the procedure genuinely can't settle, describe that case rather than forcing it through. Please don't give me a catalogue of cognitive biases and don't cite anything; I'll add references myself if I ever write this up, and it has to be runnable in a meeting by people with no economics background who recieve the packet the night before.
reasoning: |-
  Alright, the user is on a capital projects oversight committee for a mid-sized city. They need a practical procedure to evaluate troubled projects efficiently. Let me start by understanding their main pain points. 

  First, they mentioned the dollar auction analogy. Some projects have real rivalry, while others are just a contractor delaying. The committee needs to distinguish between these structures because the standard advice to ignore sunk costs isn't helpful. By the time projects reach them, sunk costs are already spent, and the focus is on whether the remaining spend is justified. 

  The user wants a procedure that starts with categorizing the project's structure: rivalry, no rival, or genuine completion premium. Then, specific tests to detect escalation of commitment, not just cost-benefit analysis. They mentioned a restart test and separating decision-makers from original authors. Also, different exit strategies beyond just "stop," like mothballing or descoping.

  Key constraints: 30-40 minutes per project, one-page recommendation for council members. The procedure must be actionable by non-experts with minimal prep time. The three example cases are crucial to test the framework—software replacement, streetscape with grant issues, and a library with political ties.

  Deep needs: They need clarity on when sunk costs actually add value (like grandfathering permits) vs. when it's just escalation. The restart test might fail when there's a real completion premium, so the procedure must handle that. Also, they want to flag the argument that finishing sets a precedent for future projects, but prevent abuse by sponsors.

  For the structure check, I'll define categories clearly. Rivalry involves external parties like grants or penalties. No rival is just vendor delays. Completion premium requires tangible, irreversible value from past spend. Tests like the restart test and separation of authorities can catch escalation. But need to note where these tests misfire—like when restarting loses grandfathered benefits.

  Exit strategies need specifics: kill, mothball, descope, transfer, or re-phase. The political aspect, especially in the library case, must be addressed head-on. Including the "track record" value but with strict criteria to prevent misuse.

  Applying to cases: The software project likely has no rival and fails the restart test. Streetscape has rivalry due to the grant but needs to check if the state's deadline is adjustable. Library has political pressure but the completion premium is low, so recommending stop despite the council member's interest.

  Finally, the procedure must fit in a one-page template. Sections: structure, tests, decision points, exit options. Keep it visual with checkboxes for quick use in meetings. Flagging values calls ensures transparency when politics influence decisions.
answer: |-
  Here's a battle-tested, one-page procedure designed for your constraints and the realities of political capital projects. It focuses on **structural diagnosis first**, **explicit escalation traps**, **actionable exit options**, and **forcing values calls into the open**.

  **Capital Project Oversight Procedure (1-Page Template)**

  **Project:** _________________________
  **Date:** _______________
  **Presenter:** _______________________
  **Total Spent:** $_________
  **Remaining Est. Cost:** $_________
  **Original Budget:** $_________
  **Original Deadline:** _______________
  **Current Deadline:** _______________

  **Step 1: Structure Check (Check ONE Primary Box)**

  *   **☐ A. Real Rivalry:** Stopping *actively costs us* due to external parties/agreements.
      *   *Evidence Required:* Penalty clauses (liquidated damages, clawbacks), grant expirations with *no extension path*, binding legal settlements, immediate competitor advantage gained (rare). *Must quantify potential loss.*
  *   **☐ B. No Rival, Slippery Slope:** Vendor/team says "just a little more," no significant external penalty for stopping *now*. Schedule slips are internal/contractual only.
  *   **☐ C. Genuine Completion Premium:** Past spend *irreversibly* increased the value/feasibility of finishing *beyond* the raw asset value.
      *   *Evidence Required:* Grandfathered permits/licenses impossible to re-obtain, unique sunk infrastructure critical to function (e.g., poured foundation for specific design), migrated data with *no viable rollback*, contractual lock-in where restarting is *prohibitively* more expensive than finishing *this specific vendor*. *Must quantify premium value.*

  **Step 2: Escalation Trap Tests (Answer YES/NO)**

  1.  **The Restart Test:** If this project *did not exist*, and a *different* department proposed *today* spending **$[Remaining Est. Cost]** to achieve the **same expected benefit**, would we fund it? (*Ignore sunk costs, reputational issues, politics*).
      *   *Misfires if:* Genuine Completion Premium (C) exists and is *unique to this path* (e.g., grandfathered permit). A strong YES here usually means STOP. A strong NO *can* be justified *only* by strong evidence in (A) or (C).
  2.  **The Separation Test:** Is the person(s) *most strongly recommending "Continue"* **different** from the person(s) who were *primarily responsible* for authorizing the major past spend/scope decisions that led to the overrun? (*If same person/team, high escalation risk*).
      *   *Misfires if:* Original decision-maker is genuinely the only expert, or the project is very small. A NO here is a major red flag requiring intense scrutiny.

  **Step 3: Future Viability Check (Answer YES/NO - Requires Evidence)**

  *   **Credible Plan:** Is there a *detailed, realistic, funded* plan (scope, schedule, budget, owner/vendor accountability) for the *remaining* work? (Vague promises fail).
  *   **Benefit > Remaining Cost:** Do the *quantifiable future benefits* **net of risks** exceed the *remaining cost*? (*Sponsor must provide objective metrics, not aspirations*).
  *   **Root Cause Addressed:** Has the *primary reason for the overrun/delay* been conclusively identified and mitigated? (New vendor mgmt? Scope freeze? Tech proven?).

  **Step 4: The "Track Record" Argument (Use Sparingly & Skeptically)**

  *   **☐ Potentially Valid ONLY if:** Stopping *this specific project* would demonstrably cripple the city's ability to execute *future critical projects* (e.g., default on a unique vendor contract destroys market trust; canceling *this specific* grant project jeopardizes *all* future grants from *that* funder). *Requires specific, credible linkage.*
  *   **Otherwise:** Treat as escalation bias/spin. *General* "reputation" is insufficient justification for throwing good money after bad.

  **Step 5: Recommendation & Exit Options (Select ONE)**

  *   **☐ CONTINUE (As-Is/Phased):** *Only if*: (A or C is strongly evidenced AND both Escalation Tests don't flag major risk AND Future Viability is YES). *Specify conditions/milestones.*
  *   **☐ RESTRUCTURE:** *Use if*: Core benefit is viable but current path isn't. *Choose Specific Exit Action:*
      *   **Descope:** Deliver a *usable core* with remaining funds. Define Minimum Viable Product (MVP).
      *   **Mothball:** Secure & pause. Define restart cost/conditions (future budget cycle?).
      *   **Re-Phase:** Major rescoping/replanning requiring *new council approval*. Define new baseline.
      *   **Transfer:** Handoff to another entity (dept, agency, partner). Define terms.
  *   **☐ STOP:** *Required if*:
      *   Step 3 (Future Viability) has any NO.
      *   Structure is B (No Rival) *and* Restart Test is NO.
      *   Escalation Tests strongly indicate bias *and* no compelling evidence for A or C.
      *   *Choose Specific Exit Action:*
          *   **Kill:** Terminate contract, liquidate assets, write-off.
          *   **Mothball:** (See above).
          *   **Descope to Salvage:** Extract *any* usable asset/data with minimal spend (e.g., archive migrated data, use foundation for simpler structure).

  **Values Call Flag:** ☐ YES / ☐ NO
  *   *Mark YES if*: Recommendation hinges on political priority, unquantifiable "community value," or the "Track Record" argument that passed scrutiny. *Council must explicitly own this values decision.*

  ---

  **Running the Cases:**

  **Case 1: 4-Year-Old Software Replacement (2x Budget, Vendor: "70% Done, One More Push")**

  1.  **Structure:** **B (No Rival).** Vendor delays, likely internal scope creep/poor mgmt. No external penalties mentioned. "70% done" is classic slippery slope.
  2.  **Escalation Tests:**
      *   *Restart Test:* **NO.** Would you fund a *new* project *today* with this vendor, spending the remaining millions (likely another 30%+ of original budget) for the same system? Unlikely.
      *   *Separation Test:* **Likely NO.** Same sponsor/PM probably championed the original failing project.
  3.  **Future Viability:** **Credible Plan?** "One more push" is not credible. **Benefit > Cost?** Doubtful given history. **Root Cause?** Vendor/scope issues likely unaddressed.
  4.  **Track Record:** Unlikely valid justification here.
  5.  **Recommendation:** **STOP (Kill or Descope).** *Kill* if the partially built system is unusable junk. *Descope* if *any* usable module (e.g., CRM, basic reporting) can be salvaged and implemented immediately with minimal cost. The "completion premium" (migrated data) is likely minimal if the system isn't functional. **Values Call Flag:** NO (This is a factual failure).

  **Case 2: Downtown Streetscape (State Grant 60%, Missable Deadline, State Changed Rules)**

  1.  **Structure:** **A (Real Rivalry).** Losing the 60% grant is a direct, quantifiable financial penalty for stopping/missing deadline. State rule change adds risk.
  2.  **Escalation Tests:**
      *   *Restart Test:* **Ambiguous.** Depends on grant availability *if* restarted. If grant is permanently lost, restart cost might be 100% city = NO. If grant *could* be reapplied for, might be YES. **Key Question:** Can the state deadline be negotiated/extended given *their* rule change? (If yes, rivalry reduces).
      *   *Separation Test:** **Depends.** Who approved original deal vs. who wants more money now?
  3.  **Future Viability:** **Critical.**
      *   *Credible Plan?* Need detailed acceleration plan/cost to hit deadline *or* evidence state will extend.
      *   *Benefit > Remaining Cost?* Benefits likely still high (revitalization), but remaining cost now includes city's 40% + acceleration cost. Recalculate.
      *   *Root Cause?* State rule change addressed via negotiation? City planning error mitigated?
  4.  **Track Record:** Potentially valid *if* losing this grant jeopardizes *future* state grants for *similar* projects. Requires evidence of linkage.
  5.  **Recommendation:** **CONTINUE (only with credible acceleration plan & funding) OR RESTRUCTURE (Descope/Re-Phase).** If acceleration cost is low & deadline achievable, CONTINUE. If huge cost or deadline impossible, **RESTRUCTURE: Descope** (do critical parts now with grant $) **or Re-Phase** (negotiate extension, revise scope/budget for council re-approval). **STOP** only if grant is lost *and* descoped/restarted version isn't viable. **Values Call Flag:** **YES** if relying on "Track Record" argument or overriding cost/benefit based on downtown importance.

  **Case 3: Neighborhood Library (30% Built, Budget Low, Council Chair's District, Long Promise)**

  1.  **Structure:** **B (No Rival).** No external penalties or grants mentioned. Just internal budget/promise.
  2.  **Escalation Tests:**
      *   *Restart Test:* **NO.** Would you fund a *new* library project *today* in this district, knowing construction is only 30% done but requires substantial *new* funding (likely exceeding the original per-sq-ft cost due to restart/mobilization) to complete? Unlikely to be highest priority vs. other needs.
      *   *Separation Test:* **NO.** The Council Chair (your committee chair!) championed the original promise and is deeply invested. High escalation/political pressure risk.
  3.  **Future Viability:** **Likely NO.**
      *   *Credible Plan?* "Not much left in the budget" implies no credible plan for completion. Requires significant new $$.
      *   *Benefit > Remaining Cost?* Benefits (community value) are real but hard to quantify. Remaining cost is high and unknown. Net benefit doubtful.
      *   *Root Cause?* Under-budgeting? Scope creep? Unaddressed.
  4.  **Completion Premium (Check C):** *Minimal.* 30% built (foundation, frame?) provides some sunk value, but restarting a simpler library later might still be cheaper than finishing an over-designed one now. No unique permits mentioned.
  5.  **Track Record:** **Invalid Justification Here.** General "promise kept" or "district equity" is a *values call*, not a valid "track record" argument preventing future projects.
  6.  **Recommendation:** **STOP (Mothball or Descope).** *Mothball* if the structure can be safely secured and there's a *realistic* path to funding completion later (e.g., identified in next CIP). *Descope* only if the shell can be *cheaply* finished as a drastically simpler community space (reading room? meeting hall?) with the remaining funds. **Continuing without a massive new injection is impossible.** **Values Call Flag:** **YES.** This *is* political. The procedure forces the factual conclusion (STOP), but council must explicitly overrule based on district priority/equity if they choose.

  **Case 4: The Unsettleable Case - Shifting Sands**

  *   **The Scenario:** A major infrastructure project (e.g., water treatment upgrade). Significant sunk costs in specialized equipment. **Structure C (Genuine Completion Premium)** seems strong (unique permits, integrated systems). **Future Viability** is highly uncertain due to *newly discovered, complex geological risks* requiring unknown mitigation costs. The **Restart Test** is a firm NO (permits lost, sunk costs huge). **Benefit > Remaining Cost** is impossible to determine because the "Remaining Cost" is unknown and could range from moderate to astronomical.
  *   **Why Unsettleable:** The core uncertainty (geological risk cost) makes *any* future cost/benefit analysis speculative. The Completion Premium makes walking away incredibly costly. There's no rival (A) forcing immediate action.
  *   **Procedure Outcome:** Highlight the paralyzing uncertainty. Recommend **RESTRUCTURE: Re-Phase.** *Require* a funded, definitive site investigation/engineering study *with a firm budget cap* to quantify the risk and true remaining cost. *Do not approve further construction spend.* Present the *cost of the study* and the *decision point* (after study results) to council. This kicks the can, but *only* after forcing investment in reducing uncertainty. **Values Call Flag:** YES (Implicit in approving the study spend under high uncertainty).

  **Key Advantages of this Procedure:**

  1.  **Forces Structural Diagnosis First:** Tackles the core "dollar auction vs. slippery slope" distinction immediately.
  2.  **Targets Escalation Explicitly:** The Restart and Separation Tests are direct traps for sunk cost fallacy.
  3.  **Demands Evidence for "Completion Premium":** Stops the vague "too far in" argument.
  4.  **Provides Concrete Exit Ramps:** "Stop" isn't monolithic; offers salvage paths.
  5.  **Flags Politics/Values:** Forces council to own decisions driven by factors beyond project viability.
  6.  **Fits Constraints:** Structured for 30-40 mins, outputs a one-page rec (this template *is* the rec sheet).
  7.  **Runnable by Non-Experts:** Clear Yes/No, checkboxes, defined evidence standards.

  **Where it Bites:**

  *   It will recommend stopping popular projects in powerful districts (Case 3).
  *   It exposes when "Continue" is purely political (Values Call Flag).
  *   It forces sponsors to provide hard evidence, not just optimism.
  *   The Restart Test *will* feel brutal and unfair to sponsors in genuine (C) situations – but it's necessary to counterbalance inherent escalation bias. The evidence requirement for (C) is the counterweight.

  This procedure won't make the decisions easy, but it will make the *reasons* for the recommendation clear, defensible, and focused on protecting the city's resources from the worst pitfalls of escalation.
