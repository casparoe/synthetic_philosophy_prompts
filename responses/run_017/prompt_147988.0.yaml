prompt: |-
  Hey — I'm a PhD student working on blame and standing, and I've got an argument I built for a reading group last week that I'm now pretty sure proves way too much, but I can't put my finger on the move. Would love a diagnosis.

  Start with the case that got us going, which I'll call *structural hypocrisy*. A blames B for participating in some scheme — an industry, a supply chain, an institution, a professional incentive structure. A doesn't do what B does. But A's life is woven into that same scheme in a different role: A benefits from the fact that people like B do it, A would be put out if it stopped, and A hasn't made any move to exit. Some-one who flies constantly blaming an oil company's PR person for greenwashing. A meat-eater blaming a slaughterhouse worker. A journal editor blaming a grad student for CV-padding. Intuitively, A's standing looks compromised — not as badly as in plain hypocrisy, but compromised.

  Here's the argument I built off that intuition.

  (1) When A blames B for φ-ing, A implicitly asserts that B had adequate reason not to φ, and asserts it second-personally, as a demand A is entitled to make of B.
  (2) A is entitled to make such a demand only if A is not, with respect to the norm grounding the demand, in a worse or equal position than B. (Call it the clean-hands condition. The plain hypocrisy datum is supposed to fall out of this.)
  (3) What defeats standing in plain hypocrisy can't be identity of act-type: the smoking parent blaming the vaping kid hasn't vaped, and the father who cheated on his taxes can't blame his son for cheating on a test. What does the work must be something looser — that A is *implicated* in the norm A invokes: benefits from it, is disposed to keep accepting the pattern of behaviour A is calling out.
  (4) So standing is defeated by implication in a scheme, not only by having performed the same act.
  (5) Implication in this sense is nearly universal. Almost anyone who blames anyone for anything is a net beneficiary of some scheme that produces or enables wrongs of the relevant kind, and is disposed to go on benefiting.
  (6) Standing is a status of the blamer *with respect to the norm*, not with respect to the particular act blamed, so if it's defeated at all it's defeated across everything that norm covers.
  (7) So almost nobody has standing to blame almost anyone for almost anything.
  (8) But some blame is apt and some isn't, and the whole point of the category is to mark that difference. A view on which standing is basically never present doesn't distinguish apt from inapt blame, it just deletes the distinction we set out to draw.

  And the bit that makes me most suspicious: the argument seems to get things backwards. The worse and more systemic the wrong, the more scheme-like it is, so the more likely it is that any given blamer is implicated — which means the argument strips standing most aggressively exactly where we'd most want to insist that the blame is fine.

  I'd like to keep (3) and (8) if I possibly can — the move off act-type identity feels right to me and I don't want to go back to it. My friend says the flaw is (6) and that standing is local to the norm rather than global. But if I just localize it I don't see how I still get the smoking parent, whose relation to the norm looks local in exactly the way my friend says is fine.

  Which step do you reject? Why did it look okay, and what does rejecting it cost me — do I lose the structural-hypocrisy intuition, do I have to say something weird about the parent case, or is there a version of the argument that survives? Also: could the fix be that standing is restored by *acknowledging* implication, i.e. that self-blame buys it back? If so I'd want to know whether that makes standing suspiciously cheap, or whether it's actually the right story and my argument just shows that.

  Sorry if this is undercooked, I've been staring at it too long.
reasoning: |-
  Okay, the user is a PhD student working on blame and standing, specifically structural hypocrisy. They've built an argument that seems to overgeneralize, leading to the conclusion that almost no one has standing to blame anyone. That's problematic because it undermines the whole point of distinguishing apt from inapt blame. They want to know which step is flawed and how to fix it without losing key intuitions.

  First, I need to parse their argument step by step. Premise (1) seems solid: blaming involves asserting a demand based on a norm. Premise (2) introduces the clean-hands condition, which explains plain hypocrisy. Premise (3) moves away from act-type identity to broader implication in a scheme. That's where structural hypocrisy comes in. Premise (4) extends standing defeat to implication. Then (5) claims such implication is nearly universal. (6) says standing defeat is global per norm, and (7) concludes standing is almost never present, conflicting with (8) which states that some blame is apt.

  The user's suspicion is that the argument strips standing most in systemic wrongs, which is counterintuitive. They want to keep (3) and (8). Their friend suggests (6) is the flaw, but the user worries localizing standing might not handle cases like the smoking parent.

  Hmm. The key issue is premise (5). The user claims implication is nearly universal, but that might be an overstatement. Not all beneficiaries are equally implicated. The depth and nature of involvement matter. For instance, benefiting passively versus actively sustaining the scheme. The oil company PR person actively greenwashes, while the frequent flyer merely benefits. The meat-eater benefits from slaughter but isn't directly involved like the worker. The journal editor benefits from academia's publish-or-perish culture but blaming a grad student for padding their CV ignores the power imbalance and the editor's role in perpetuating the system.

  But premise (5) flattens these differences. It assumes that any benefit counts as implication, but that's too broad. Implication should require some level of agency or contribution to the scheme. Passive benefit without endorsement or reinforcement might not compromise standing. For example, a citizen benefiting from an unjust system but actively opposing it might still have standing to blame perpetrators. 

  Then there's premise (6). If standing defeat is global per norm, then any implication defeats standing for all applications of that norm. But intuitively, standing might be context-dependent. The smoking parent might lose standing to blame for smoking-related acts but retain it for other issues under the same norm (like health). However, in structural cases, the norm in question (say, environmental harm) might cover various acts, but the blamer's role matters. If the blamer's implication is indirect, maybe standing isn't fully defeated.

  The user also asks if acknowledging implication restores standing. Self-blame might help, but it's not automatic. The blamer must also align their actions, like reducing harm or advocating change. Otherwise, it's cheap. For instance, the frequent flyer acknowledging their carbon footprint but still flying without change doesn't restore standing to blame the oil company.

  So the main flaw is premise (5) overgeneralizing implication. Fixing it requires clarifying what kind of implication defeats standing—perhaps active contribution versus passive benefit. Also, premise (6) might need refinement; standing could be more localized based on specific acts within a norm. But in the parent case, the parent's ongoing smoking undermines their standing to demand their child not vape, because they're actively violating the same health norm. So for direct violations, the clean-hands condition holds, but for structural cases, the relation is indirect.

  The user can maintain (3) by distinguishing levels of implication. They don't have to revert to act-type identity but should define implication more narrowly: not just benefiting, but actively sustaining the scheme or having a role that directly enables the harm. This preserves structural hypocrisy intuitions without overgeneralizing. For example, the journal editor blaming the grad student: the editor benefits and perpetuates the system, so their standing is compromised. But a different academic who challenges the system might still blame the student, though perhaps with less force.

  In systemic wrongs, those not actively perpetuating the harm might still have standing. The argument's flaw was equating any benefit with implication, which isn't sufficient to defeat standing. The fix involves refining implication to require agency or contribution, thus avoiding the universal defeat of standing while keeping the structural cases intact.
answer: |-
  Your argument is fascinating and admirably clear—but you're right that it proves too much. The flaw lies in **premise (5)**, which overgeneralizes "implication" to near-universality. Let's diagnose why it fails, what it costs to reject, and how to salvage your core insights.

  ### The Problem: Premise (5) Mischaracterizes "Implication"
  You claim:  
  > *(5) Implication in this sense is nearly universal. Almost anyone who blames anyone for anything is a net beneficiary of some scheme that produces or enables wrongs of the relevant kind, and is disposed to go on benefiting.*

  This equivocates between **two types of "implication"**:
  1. **Direct, norm-sustaining implication**: Actively upholding the *specific* norm-violating scheme you're criticizing (e.g., the journal editor perpetuating "publish-or-perish" incentives while blaming a grad student for CV-padding).  
  2. **Passive, background implication**: Merely benefiting from broad societal structures that *incidentally* enable wrongs (e.g., anyone using fossil fuels while blaming an oil executive).  

  Premise (5) treats these as equivalent, but they aren’t. Only the **first** defeats standing. Passive implication is ubiquitous but irrelevant to standing—it doesn’t make you a *participant* in the specific norm-violation you’re condemning. Your argument collapses because it conflates systemic *complicity* with unavoidable societal *embeddedness*.

  ### Why Other Premises *Can* Stand (With Nuance)
  - **(1) & (2)**: Solid. Blaming *is* a second-personal demand requiring normative authority.  
  - **(3)**: Correct! Act-type identity is too narrow. Standing *is* defeated by broader implication (e.g., the tax-cheating father blaming his son).  
  - **(4)**: Follows from (3), but needs refinement: implication must be **direct and norm-sustaining**.  
  - **(6)**: Mostly right—standing is norm-relative. But it’s defeasible *per act-type within the norm*, not globally (more below).  
  - **(7) & (8)**: Your reductio holds—if (5) were true, (7) would follow, contradicting (8). But (5) is false.  

  ### What Rejecting (5) Costs You (And How to Pay)
  You lose the *universality* of implication but keep **structural hypocrisy** intact. Examples clarify:  
  - ✅ **Standing defeated**: The journal editor blaming a grad student for CV-padding. *Why?* The editor **enforces the incentive structure** that demands padding. Their blame sustains the scheme.  
  - ✅ **Standing intact**: A climate scientist who flies occasionally blaming an oil lobbyist for disinformation. *Why?* Their flight is **passive consumption**, not active endorsement of disinformation.  
  - ⚠️ **Gray area**: A meat-eater blaming a slaughterhouse worker. *Depends*: If the blamer agitates for reform, standing may hold; if they demand meat daily while blaming, standing weakens.  

  **The smoking parent case isn’t threatened**: The parent is **directly violating the same health-preservation norm** they invoke against their child. This is "clean hands" failure (premise 2), not structural implication. Your friend’s "local" standing (rejecting 6) is unnecessary here.

  ### Can Acknowledgment Restore Standing? Yes—But Rigorously
  You ask if self-blame "buys back" standing. It can, but **only if paired with material alignment**:  
  - **Cheap acknowledgment**: "I know I’m implicated, but I’ll keep benefiting" → standing *not* restored.  
  - **Costly acknowledgment**: "I’m reducing my complicity (e.g., cutting flights, supporting reform) and blame myself for my role" → standing *can* be restored.  
  *Example*: The academic who publishes less to resist toxic incentives *gains standing* to blame the journal editor. The one who says "the system sucks, but here’s my 10th paper" does not.

  ### The Systemic Wrongs Paradox Solved
  You note the argument "strips standing most aggressively where blame is most needed." But rejecting (5) fixes this:  
  - **Systemic wrongs** (e.g., climate change) *require* blaming active enablers (lobbyists, CEOs).  
  - Passive beneficiaries (most of us) **retain standing** to blame these actors because our implication isn’t *sustaining the specific wrong*. We might lack standing to blame *each other* ("You drove to work!"), but that’s correct—it *should* trigger mutual recognition, not blame.  

  ### Revised Framework: Key Distinctions
  To save your intuition while avoiding overgeneralization:  
  1. **Standing is defeated iff the blamer is actively implicated in the *specific norm-violating scheme* they condemn**.  
  2. **Implication requires**:  
     - **Benefit** + **failure to resist** *and*  
     - **Reinforcement of the scheme** (e.g., through silence, participation, or demanding its outputs).  
  3. **Acknowledgment restores standing only when it drives behavioral change**.  

  This preserves structural hypocrisy (e.g., the editor, the hypocritical meat-eater) without imploding into universal standinglessness. The "scheme" must be concrete, not cosmic.

  ### TL;DR
  - **Flaw**: Premise (5) equivocates between active norm-sustaining complicity and passive societal embeddedness.  
  - **Fix**: Restrict "implication" to direct, intentional reinforcement of the specific scheme.  
  - **Cost**: You concede that passive beneficiaries *can* blame active wrongdoers—but this aligns with intuition.  
  - **Self-blame**: Restores standing only when it motivates tangible disentanglement from the scheme.  

  Your core insight—that standing transcends act-type identity—holds strong. Narrowing "implication" saves the argument from self-destruction while honoring structural hypocrisy. Well played!
