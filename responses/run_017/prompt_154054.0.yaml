prompt: |-
  I'm doing a PhD in history and I also work part time on a digital humanities project where we take published monographs and tag every single sentence. Each sentence gets one of three labels: 'sourced' (there's a document underneath it), 'inferred' (no document actually says it, the author got there by reasoning, generalization, or common sense), and 'framed' (it's the author's interpretive choice — what to call the thing, who counts as an actor, where the story starts and ends, what kind of story it is). We also spot check footnotes and tag whether the cited source really supports the sentence it's attached to. The people on the project keep fighting about whether this is neutral metadata or whether it already commits us to a position about whether there is a fact of the matter about the past. I think it does commit us, but I can't say exactly where.

  It's made me look differently at what ordinary academic history already presupposes. On the one hand the whole apparatus behaves as if there's a real past we're converging on: you go to the archive, you cite primary sources rather than secondary ones, reviewers spot check your footnotes, journals print corrections and sometimes retract when someone finds you got a date or a quotation wrong, and fabricating a source will end your career. On the other hand nobody in my department believes the Rankean slogan about showing the past as it actually was, everyone's read Carr on the facts of history always reaching us already selected by somebody, and since Hayden White people will happily say in a seminar that the narrative shape — tragedy, comedy, romance, satire — is something the historian puts onto the material rather than finds in it. And the discipline is wildly more relaxed about the second kind of thing: almost nobody is ever made to retract an interpretation, only a fact, and there's a strong norm that saying "that's my reading" settles the matter.

  So: what does that bundle of practices actually presuppose about historical knowledge? Reconstruct the implicit theory, and separate what the practice strictly presupposes from what it merely fits comfortably with — I suspect footnote discipline and the punishment of fabrication commit you to less than people think, while the refusal to ever correct an interpretation commits you to more. Tell me whether the parts are consistent with each other. Two things puzzle me especially: we punish fabrication savagely and correct wrong dates, but a source that's been badly read is barely a problem and an interpretation is never withdrawn, which feels like it presupposes that the chain of attribution matters more than the truth of what's said; and we let a sentence resting on a self-interested document count as 'sourced' on exactly the same footing as one resting on a document nobody had a stake in. Then bring it back to my tagging scheme: which kinds of sentence should break a three-way split like ours — causal claims, claims about what someone believed, claims from silence or from absence in the archive, claims about what was typical, counterfactuals — and what would have to change in the practice of history if we took the Whitean view seriously enough to build it into the way we write, review, and correct books?
reasoning: |-
  Okay, let me unpack this fascinating methodological dilemma. The user is grappling with a core tension in historical epistemology while designing a DH tagging system. Their project exposes fractures between history's empirical practices and its theoretical self-understanding.

  Hmm, the tagging scheme itself is revealing - "sourced/inferred/framed" implicitly recreates the fact/interpretation binary historians claim to reject. But their footnote verification practice already complicates this by showing that "sourced" doesn't equal "true". Interesting that they're spotting the gap between citation presence and argumentative support - that's where the real epistemological action is.

  The disciplinary contradictions they describe are acute: the brutal enforcement of factual accuracy coexists with interpretive free-for-all. I need to trace how this operates through different validation regimes. Fabrication gets punished as professional misconduct rather than epistemic failure per se - it violates the guild's social contract. Whereas interpretive disputes get resolved through scholarly persuasion, not verification. That explains the asymmetry.

  Ah! The self-interested source question cuts deep. Historians treat all documents as "sources" while simultaneously training grad students in source criticism. The tagging scheme currently misses this critical dimension by flattening all citations into "sourced". Maybe they need a fourth tag for "contested sourcing" or build provenance metadata into their system.

  For the Whitean implications... if they took narrative construction seriously, they'd have to tag not just sentences but narrative devices - foreshadowing, closure, characterization. The correction system would need "interpretive misconduct" categories beyond factual errors. Imagine retracting a book for flawed emplotment! That would require revolutionizing peer review.

  The user's instinct is right - their tagging isn't neutral. By accepting history's existing categories, they're reifying its epistemic compromises. The real breakthrough would be designing a system that makes visible what standard monographs obscure: how inference chains work, where framing choices occur, why some sources get privileged. That metadata could actually push the discipline forward.
answer: |-
  Your project brilliantly exposes the epistemological fault lines beneath historical practice. Let's reconstruct the implicit theory of historical knowledge embedded in disciplinary norms, then examine your tagging scheme through that lens.

  **The Implicit Epistemology of Academic History:**
  1.  **Stratified Ontology:** Practice presupposes a *layered* past:
      *   **"Brute Facts" (Strictly Presupposed):** Certain irreducible, verifiable events occurred (e.g., "The Treaty of Versailles was signed on June 28, 1919"). Fabrication/correction norms commit the discipline to these. The chain of attribution matters *because* it's the primary mechanism for establishing consensus on these facts.
      *   **"Interpretive Frameworks" (Comfortably Fits With):** How we select, arrange, explain, and assign significance to facts is inherently perspectival and contestable (White, Carr). The "that's my reading" norm reflects this.
      *  **"Inferred Realities" (Ambiguous Middle Ground):** Claims about motives, typicality, causation, beliefs, or significance based on evidence but not directly attested by a single source occupy contested space. They are treated as *arguments* requiring justification, not facts requiring mere citation.

  2.  **Source Fetishism vs. Source Criticism (The Crucial Tension):**
      *   **The Fetish:** Tagging a sentence as "sourced" based *only* on a footnote citation reflects the *practical necessity* of grounding claims in evidence. It presupposes that linking a claim to *some* source provides a basic warrant, regardless of the source's nature or reliability ("self-interested doc" vs. "neutral doc").
      *   **The Criticism:** The discipline also *knows* sources are biased, incomplete, and require critical reading. However, the *operational norm* (especially in tagging/correction) often prioritizes the *existence* of a citation link over a deep assessment of its *validity* for that specific claim. Spot-checking footnotes begins to challenge this but isn't the core correction mechanism.

  3.  **Asymmetrical Correction Regimes (Revealing the Priorities):**
      *   **Factual Errors:** Punished severely because they violate the foundational layer. Fabrication is career-ending because it destroys trust in the entire empirical enterprise. Wrong dates are correctable because they are (usually) verifiable against the "brute fact" layer.
      *   **Misreading Sources:** Often treated as a lesser sin than fabrication but worse than interpretive disagreement. It's an *empirical error within interpretation*, challenging the historian's competence in handling evidence but not necessarily the core fact. Correction depends on the severity and impact.
      *   **Interpretive Disagreements:** Essentially immune to formal "correction" because the discipline presupposes multiple valid perspectives on the interpretive layer. Peer review critiques *persuasiveness*, not *truth* in the same way as facts. "That's my reading" is the ultimate defense because interpretation resides in the realm of argument, not verification.

  4.  **Consistency? A Pragmatic Truce:** The practices are *operationally* consistent because they serve different functions:
      *   **Empirical Foundation:** Footnotes, archives, punishing fabrication, correcting facts = building a shared, minimally contested evidence base.
      *   **Scholarly Discourse:** Interpretive freedom, narrative construction, "my reading" defenses = enabling argument, debate, and diverse perspectives *within* the constraints of the shared evidence.
      *   **The Glue:** Source criticism is the *methodological bridge* between the two, but its application is uneven and often deferred to argument rather than formal correction.

  **Why the Punishment Asymmetry?** It prioritizes *procedural integrity* (honesty in sourcing, accuracy in reporting verifiable data) and *maintaining a shared empirical ground* over achieving final interpretive truth. The chain of attribution matters because it's the mechanism for ensuring procedural integrity. Truth for interpretations is understood as *warranted assertibility* (Dewey) – the best argument based on available evidence – not correspondence to a single recoverable past reality.

  **Your Tagging Scheme: Commitments and Challenges:**
  *   **The Commitment:** The scheme **does** implicitly commit to a stratified view: "Sourced" aligns with the "brute fact" layer (or at least the *claim* of empirical grounding), "Inferred" with the contested middle ground of reasoning, and "Framed" with the interpretive layer. It mirrors the discipline's structure.
  *   **Where It Breaks Down (Sentence Types Highlighting Tension):**
      1.  **Causal Claims:** Often a complex blend. A sentence *sourced* by citing a document stating a cause (e.g., a letter saying "I did X because of Y") might still involve heavy *framing* (selecting *that* cause as significant). A causal *inference* from multiple sources is core historical work. Tagging forces an artificial separation.
      2.  **Claims About Belief/Motive:** Rarely directly "sourced" except by explicit statements (which themselves need interpretation). Usually heavily *inferred* (from actions, context, other sources) and *framed* (why *this* motive matters). Is citing a diary entry "sourcing" a belief, or just sourcing the diary statement requiring inference?
      3.  **Claims from Silence/Absence:** Inherently *inferred* (reasoning from what *isn't* there). Yet, historians often present them with the rhetorical force of evidence ("The absence of any record suggests..."). Tagging as "inferred" feels accurate but might understate their perceived weight.
      4.  **Claims About Typicality:** Almost always *inferred* (generalizing from specific instances/sources). Crucial for historical synthesis, but far removed from a single "sourced" fact. Can easily blur into *framing* (what counts as "typical" is an interpretive choice).
      5.  **Counterfactuals:** Purely *inferred* (often based on causal models) and deeply *framed* (revealing the historian's view of what was necessary/contingent). They sit entirely outside the "sourced" category.

  **Taking Hayden White Seriously: Revolutionizing Practice**
  If the discipline fully embraced the constructed nature of historical narrative (White's core insight), your tagging scheme might evolve, and practices would shift dramatically:

  1.  **Beyond Three Tags:**
      *   **Decompose "Sourced":** Differentiate between "Direct Attestation" (source states the claim verbatim), "Supports Inference" (source provides evidence requiring reasoning to reach the claim), and "Contested Support" (source is ambiguous, biased, or doesn't clearly support the claim as used). Spot-check findings would feed directly into this.
      *   **Expand "Framed":** Tag specific framing devices: *Emplotment* (tragedy, comedy), *Argumentative Moves* (establishing causation, defining actors, periodization), *Rhetorical Tropes* (metaphor, irony).
      *   **Refine "Inferred":** Categorize types of inference: generalisation, analogy, causal reasoning (necessary/sufficient conditions), argument from silence, etc.

  2.  **Revolutionizing Writing & Review:**
      *   **Explicit Framing Sections:** Monographs would require dedicated chapters/methods sections explicitly outlining the chosen narrative structure, theoretical lenses, and criteria for significance, not burying them in prose.
      *   **Review Focus Shift:** Reviewers would rigorously assess the *coherence* and *justification* of the framing choices and inferences, not just factual accuracy or argument persuasiveness within an assumed frame. "Is this a tragedy?" becomes a debatable methodological choice, not an invisible given.
      *   **Visualizing Structure:** DH projects (like yours) could generate visualizations showing the proportion and interplay of sourcing, inference types, and framing devices throughout a text.

  3.  **Revolutionizing Correction:**
      *   **"Interpretive Misconduct":** While diverse interpretations remain valid, flawed *procedures* could become grounds for correction/retraction: egregious misrepresentation of sources to fit a frame, failure to consider significant evidence contradicting the frame, internal inconsistency in the narrative logic, or demonstrably bad faith framing (e.g., imposing an anachronistic moral framework).
      *   **Correcting Frame Flaws:** Retractions/corrections could address fundamental flaws in the *construction* of the narrative that render its core argument untenable, even if individual facts are correct. E.g., "The author's claim of inevitability rests on a misrepresentation of alternatives present in sources X, Y, Z."

  **Conclusion:** Your tagging scheme isn't neutral; it replicates the discipline's core epistemological compromise between an empirical foundation and interpretive freedom. It struggles most where these layers blur – in causal claims, inferences about inner states, and generalizations. Embracing Hayden White fully wouldn't destroy empirical rigor; it would demand *higher rigor* in justifying narrative construction and inference, making the interpretive choices visible, debatable, and subject to a new kind of accountability focused on procedural integrity within the framing process itself. It would transform history from a discipline that *uses* stories to one that consciously *studies and justifies* its storytelling as a core part of its knowledge production. Your project, by making these layers explicit, is already forcing this crucial conversation.
