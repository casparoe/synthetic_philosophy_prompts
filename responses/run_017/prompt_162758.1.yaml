answer: |-
  ### (a) Essay Question  
  **Evaluate whether 'Covariance Epiphenomenalism' resolves the paradox of phenomenal judgment. Your evaluation must address:**  
  (i) Whether the theory’s account of phenomenal concepts can handle a case where the physical ‘signature state’ for pain fires (causing the judgment “I am in pain”) *without* any pain experience occurring. Would this judgment be false, or fail to refer? What does this imply for the theory of reference?  
  (ii) Whether the *nomological* covariance between experience and signature state is compatible with the epiphenomenalist’s commitment to the possibility of inverted or absent qualia (e.g., identical signature states with different/no experiences in other possible worlds). Could such covariance still support knowledge of experience if it is contingent?  
  (iii) If the theory succeeds for first-person judgments, does it also explain how we could *know the truth of epiphenomenalism itself*? Is this a distinct problem?  

  **Stipulated Positions:**  
  - **Paradox of Phenomenal Judgment**: Epiphenomenalism claims conscious experiences (e.g., pain) have no physical effects. But if so:  
    - (Semantic) How can judgments *about* pain (e.g., “I am in pain”) refer to pain if pain doesn’t cause them?  
    - (Genetic) What *does* cause such judgments if not pain?  
    - (Epistemic) How can such judgments be *knowledge* if pain plays no role in their formation?  
  - **Covariance Epiphenomenalism (CE)**:  
    1. Phenomenal properties (e.g., pain’s hurtfulness) are causally inert.  
    2. Each phenomenal property is *nomologically co-instantiated* with a physical “signature state” (e.g., neural pattern N). Signature states cause phenomenal judgments.  
    3. Phenomenal concepts (e.g., PAIN) are recognitional concepts: their reference is fixed by the signature state they track. Judgments are sensitive to *which signature is present*, ensuring counterfactual accuracy (e.g., if signature for itch fired, you’d judge “itch”).  

  *(60 minutes; 850 words; 20 marks)*  

  ---

  ### (b) Model Answer (846 words)  

  Covariance Epiphenomenalism (CE) aims to resolve the paradox of phenomenal judgment by decoupling *reference* and *knowledge* from *causal efficacy*. It posits that while experiences don’t cause judgments, their nomological covariance with physical signatures allows judgments to track experiences via signature-detection. I argue CE fails: it collapses under the mismatch case, cannot reconcile covariance with modal possibilities, and cannot self-apply. Its ingenuity lies in separating the semantic, genetic, and epistemic sub-problems—but this very separation reveals its inadequacies.  

  **First, the mismatch case exposes CE’s referential fragility.** Suppose signature N (nomologically tied to pain) fires without pain occurring, causing the judgment “I am in pain.” CE must say this judgment is *false*: the concept PAIN refers to pain, which is absent. But this assumes the concept successfully refers. If reference is fixed by tracking signature states (per CE’s third claim), and N reliably correlates with pain, then in this deviant case, “pain” might refer to *whatever N tracks*—which, here, is nothing phenomenal. This invites reference failure, not mere falsehood. CE cannot have it both ways: if phenomenal concepts are *defined* by signature-tracking, reference depends entirely on the signature’s presence, not the experience. But then “pain” refers to the signature, violating CE’s non-reductive commitment. Alternatively, if CE insists “pain” rigidly designates the experience, the judgment’s causal history (triggered by N alone) cannot secure that reference without experience-causation. Either way, CE’s semantic solution fails: the first horn reduces phenomenality to signatures; the second abandons the core anti-causal referential mechanism.  

  **Second, CE’s reliance on *nomological* covariance conflicts with epiphenomenalism’s metaphysical commitments.** Nomological covariance implies that in *our* world, signature N always accompanies pain. But epiphenomenalists typically accept *conceivable* scenarios where N occurs without pain (absent qualia) or with a different experience (inverted qualia). If such scenarios are metaphysically possible—as epiphenomenalism’s non-reductivism requires—then the link between signature and experience is contingent. This undermines CE’s epistemic solution. Knowledge requires sensitivity: a judgment that P shouldn’t be easily mistaken in close possible worlds. But if absent/inverted qualia scenarios are nearby possibilities (which they seem to be), then when I judge “I am in pain” based on N, there’s a close world where N fires but I have no pain (or an itch), making my actual judgment unsafe. CE might retort that covariance holds *in this world*, so judgments are reliable here. But knowledge demands modal robustness—avoiding luck. If the signature-experience link could easily have failed (and CE’s own metaphysics suggests it could), my judgment isn’t knowledgeable; it’s accidentally true. CE thus sacrifices either knowledge (by accepting contingency) or modal freedom (by making covariance necessary).  

  **Finally, CE’s solution for first-person judgments cannot extend to knowing epiphenomenalism itself.** Suppose CE explains my knowledge that *I* am in pain via signature-tracking. But epiphenomenalism is a *theoretical* belief: e.g., “phenomenal properties lack causal powers.” This belief must itself be caused by signature states (since experiences are inert), yet it purports to describe experiences *in general*. The problem isn’t just re-running the paradox (e.g., “how does pain cause the belief that pain is inert?”—CE would say signatures cause it). The deeper issue is *content mismatch*. My belief “pain is epiphenomenal” isn’t *about* my current signature state; it’s a general claim about conscious properties across agents and times. CE’s recognitional concepts are indexed to *my* present states—they cannot ground universal theoretical claims. Even if I infer epiphenomenalism from neuroscience, the premises (e.g., “signatures cause judgments, not experiences”) still rely on knowing others’ experiences. But if others’ judgments are caused by *their* signatures, not their experiences, I have no access to whether their experiences correlate with signatures at all. This is distinct from the first-person paradox: it concerns *inter-subjective justification*, not the mechanics of introspection. CE’s atomistic, signature-bound concepts render global claims about consciousness unjustifiable.  

  CE’s merit is diagnosing the paradox’s tripartite structure: it solves the genetic problem (signatures cause judgments), finesses semantics (reference via covariance), and targets epistemology (tracking via signatures). Yet each solution unravels. The mismatch case forces a referential choice that collapses reductionism or abandons the theory. The contingency of covariance makes knowledge lucky, betraying epiphenomenalism’s modal commitments. And the theory’s self-application fails because recognitional concepts cannot bootstrap to metaphysics. Epiphenomenalism might evade the paradox only by making consciousness unknowable—even to itself.  

  ---

  ### (c) Marking Scheme (Total: 20 marks)  
  **A (17–20):** Crisply dissects all three sub-problems; evaluates CE against *all* stipulated challenges; identifies subtle tensions between CE’s claims and epiphenomenalist commitments; original synthesis.  
  **B (13–16):** States paradox accurately; explains CE’s core strategy; raises one objection but misses depth on mismatch/contingency/self-application; may conflate sub-problems.  

  **Must-hit points (explicitly address all five):**  
  1. **Accurate paradox decomposition (3 marks):** Distinguishes semantic (reference), genetic (cause), epistemic (knowledge) sub-problems. *Common error: Conflating semantic and epistemic issues (e.g., “if pain doesn’t cause judgments, we can’t refer or know”).*  
  2. **Mismatch case analysis (5 marks):** Notes CE must choose between falsehood (implying rigid reference to experience) or reference failure (implying reference to signature). Flags that truth-value presupposes reference, forcing semantic revision. *Common error: Merely noting “judgment is false” without probing referential foundations.*  
  3. **Covariance modality critique (5 marks):** Argues nomological covariance (actual-world regularity) is insufficient if inverted/absent qualia are possible, undermining counterfactual sensitivity/knowledge-safety. *Common error: Ignoring nearby possible worlds or assuming covariance must be necessary.*  
  4. **Self-application as distinct problem (4 marks):** Treats theoretical knowledge as requiring justification beyond first-person cases (e.g., generalizing from signatures to universal properties). *Common error: Re-stating the original paradox for “belief in epiphenomenalism” without new analysis.*  
  5. **One clear objection beyond (i)–(iii) (3 marks):** E.g., highlights tension between recognitional concepts and abstract theory; notes CE’s causal exclusion problem for signatures. *Common error: Asserting “causation is needed for reference/knowledge” without engaging CE’s counter-argument.*  

  **Explicit penalties:**  
  - -2 for conflating *causal inertness* (no effects) with *nomological idleness* (no lawlike role).  
  - -3 for claiming neural cause of judgment *settles reference* without explaining how.  
  - -2 for treating causal production as *necessary for reference* (ignoring CE’s alternative).  
  - -3 if absent/inverted qualia are dismissed or misunderstood.  
  - -1 if semantic/epistemic sub-problems are merged indiscriminately.  

  **An answer that perfectly explains the paradox but does not engage CE scores 10/20.**
