  1. **Honesty and Stability**: For a signalling system to be stable and honest, there must be a mechanism that prevents lower-quality individuals from successfully mimicking the signals of higher-quality individuals.

  2. **Taxonomy of Costs**:
     - **Absolute Production Cost**: The total cost (in resources, time, energy, or fitness) incurred by the signaller to produce the signal.
     - **Marginal/Differential Cost at Equilibrium**: The rate of change of production cost with respect to signal intensity at the equilibrium signal level. This is often negative with respect to quality (i.e., for a given signal level, higher-quality individuals incur lower marginal cost to increase the signal).
     - **Counterfactual Mimicry Cost**: The total cost (including production cost and any post-signalling costs such as receiver retaliation) that a lower-quality individual would incur if it attempted to produce the same signal as a higher-quality individual. This cost must be prohibitively high for the signalling system to be stable.
     - **Fitness vs. Resource Costs**: Costs can be measured in terms of fitness (ultimate currency) or in terms of resources, time, or opportunity (proximal measures). The mapping between resource costs and fitness costs can be complex.

  3. **Scope of the Handicap Principle**: The handicap side's thesis is about the requirement of differential cost (as defined in marginal/differential cost and counterfactual mimicry cost) to stabilize honest signalling. The cue-and-constraint side agrees that such costs are often present but holds that they are not the only possible stabilizing mechanism.

  4. **Game-Theoretic Foundations**:
     - In a signalling game with strict conflict of interest (where the interests of signaller and receiver are perfectly opposed), no cost-free signalling system can be stable and honest because any signal would be mimicked. This is a theorem.
     - However, in real biological systems, the question of whether signallers have access to a cost-free channel (i.e., a way to signal without incurring any cost) is an empirical and developmental one, not a logical necessity. It depends on the organisms and the context.

  5. **Mechanisms for Honesty**: Both sides agree that honesty can be achieved by a variety of mechanisms, including:
     - Physical or developmental constraints that make signal production conditionally dependent on quality.
     - Traits that enhance the perceptibility of existing cues (without necessarily adding a production burden).
     - Receiver-side verification and post-signalling retaliation.
     - Partial alignment of interests between signaller and receiver.

  6. **Differential Cost as a Symptom**: Both sides agree that in many cases, honest signalling is accompanied by differential costs (where higher-quality individuals can produce signals more cheaply). However, they disagree on whether this differential cost is the stabilizing mechanism or a consequence of other stabilizing factors.

