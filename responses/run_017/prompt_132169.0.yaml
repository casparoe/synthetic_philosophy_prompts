     - What moves them: If a continuous model with partial conflict is shown to be stable without differential production cost, handicap would be moved. If such a model is impossible, C&C would be moved.

     This is similar to the separability crux.

  Given the above, let's list the cruxes in the table:

  | Crux Question                                                                                                | Case/Manipulation                                                                 | Handicap Prediction | C&C Prediction | What Counts as Moved                                                                                                |
  |--------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|---------------------|----------------|---------------------------------------------------------------------------------------------------------------------|
  | Can the equilibrium signal-quality correlation be held fixed while setting the differential production cost to zero, and the system remain stable? | Adjust a model to remove the differential production cost without changing the equilibrium signal function. | No: system becomes unstable. | Yes: if other mechanisms (e.g., constraints) are present. | Handicap: a demonstration of stability without differential cost. C&C: demonstration that removal always causes instability. |
  | If the production cost is subsidized for all signallers (or a mutant can produce the signal at near-zero cost), does the system collapse? | Experiment or model where production cost is removed (e.g., by subsidy or mutation). | Yes: collapse due to cheating. | Not necessarily: collapse only if there is no alternative mechanism (e.g., receiver verification). | Handicap: stability despite subsidy. C&C: collapse despite the presence of alternative mechanisms. |
  | Can a signalling system with zero production cost but with receiver retaliation for dishonesty be stable under partial conflict? | Model or empirical system where signal production is cost-free but receivers impose costs on liars. | No: without production cost, cheating would occur. | Yes: if the expected penalty is high enough. | Handicap: a stable example. C&C: if no such system can be stable. |
  | Does the necessity of differential cost depend on model assumptions (e.g., continuous vs. discrete)? | Compare continuous and discrete models. | No: it is always necessary in continuous quality models with partial conflict. | Yes: in discrete models, constraints can work without differential cost; in continuous, other mechanisms might too. | Handicap: a continuous model without differential cost that is stable. C&C: an example where differential cost is necessary even with other mechanisms present. |

  We also need to flag:
  - Both predict the same outcome: none in this table.
  - Neither would move: perhaps the perceptibility crux we skipped because it was messy? But we have four cruxes.

  ---

  ### Part 4: What Neither Side Holds

  List of strawmen:

  1. Handicap side does not hold: that signals must be wasteful, or that the cost must be paid at equilibrium. They allow that the cost might be in terms of opportunity or risk.
  2. Cue-and-constraint side does not hold: that costs are irrelevant or never play a role. They acknowledge that costs are often present and can be part of the mechanism, but not the only mechanism.
  3. Neither side holds: that complete alignment of interests makes signalling impossible (both agree that in complete alignment, cost-free signals can be stable).
  4. Handicap side does not hold: that the handicap principle is the only mechanism for honest signalling (they might allow for indices and other mechanisms in other contexts, but not for continuous quality under partial conflict).
  5. Cue-and-constraint side does not hold: that differential costs are never the mechanism. They allow that sometimes they might be, but they are not necessary.
  6. Neither side holds: that the receiver's role is passive; both agree that receiver response is crucial.

