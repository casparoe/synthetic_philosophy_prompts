answer: |-
  ### Joint Statement: Core Issues in Signalling Theory  

  **Part 1: Agreed Claims**  
  Both parties endorse the following:  
  1. **Honesty and Stability Requirement**: For honest signalling of a hidden, continuously varying quality to persist at equilibrium under partial conflict of interest, a mechanism must exist to prevent lower-quality signallers from profitably mimicking higher-quality signals.  
  2. **Taxonomy of Costs**:  
     - **Absolute Production Cost**: Total resources, energy, or fitness expended to produce the signal.  
     - **Marginal/Differential Cost at Equilibrium**: Rate of change in production cost relative to signal intensity *at equilibrium*, often decreasing with quality.  
     - **Counterfactual Mimicry Cost**: Total cost (production + retaliation/verification) a lower-quality signaller would incur to mimic a higher-quality signal.  
     - **Fitness vs. Resource Costs**: Costs measured in fitness (ultimate evolutionary currency) may differ from proximal costs (resources, opportunity, risk).  
     *Note*: The handicap thesis focuses on **differential cost** and **counterfactual mimicry cost** as stabilizers. The cue-and-constraint thesis emphasizes mechanisms making signals track quality, with costs as frequent correlates.  
  3. **Game-Theoretic Background**:  
     - Under *strict* conflict of interest, no cost-free signal can be stable and honest (rebuttal-proof).  
     - Whether real signallers have access to cost-free signalling channels is an empirical/developmental question, not a theoretical necessity.  
  4. **Mechanisms for Honesty**: Both sides acknowledge multiple pathways to stability, including:  
     - Physical/developmental constraints linking signal production to quality.  
     - Traits enhancing perceptibility of pre-existing cues.  
     - Receiver-side verification and post-hoc retaliation.  
     - Partial alignment of interests reducing deception incentives.  
  5. **Differential Costs as Common Correlates**: Differential costs (e.g., marginal cost decreasing with quality) frequently accompany honest signalling but are not universally causal.  

  **Part 2: Disagreements Table**  
  | Disputed Claim | Handicap-Side Formulation | Cue-and-Constraint-Side Formulation | Verdict |  
  |----------------|---------------------------|-------------------------------------|---------|  
  | Role of differential cost in stability | Stable honesty under partial conflict *requires* differential production costs (marginal cost falls with quality) to prevent mimicry. This is the core mechanism of the handicap principle. | Honesty is stabilized by mechanisms ensuring signal-quality tracking (e.g., constraints, verification). Differential costs are common symptoms but not necessary stabilizers; the handicap principle conflates cause and correlation. | **Substantive**: Disagreement centers on whether differential cost is *necessary* for stability. |  
  | Scope of the handicap principle | The handicap principle, properly defined, asserts that differential production costs are *necessary and sufficient* to stabilize honesty in continuous-quality systems with partial conflict. | The handicap principle is an incomplete description; it mistakes differential costs (a frequent marker) for the mechanism. Stabilization arises from signal-quality tracking, which may or may not involve differential costs. | **Verbal**: Disagreement hinges on the definition of "handicap principle." The substantive question is whether differential costs are indispensable. |  

  **Part 3: Crux Table**  
  | Crux Question | Case/Manipulation | Handicap-Side Prediction | Cue-and-Constraint-Side Prediction | What Counts as Moved |  
  |---------------|-------------------|--------------------------|-----------------------------------|----------------------|  
  | **Separability**: Can the signal-quality correlation persist if differential production costs are reduced to zero while holding tracking fixed? | Modify a model to eliminate differential costs (e.g., flatten the cost curve) without altering signal-quality correlation. | No: System collapses due to mimicry. | Yes: Stability persists if tracking mechanisms (e.g., constraints) remain intact. | Handicap: Stability with near-zero differential costs. Cue-and-Constraint: Instability despite intact tracking. |  
  | **Subsidized Signal**: If production costs are externally paid (or a mutant produces signals at near-zero cost), does stability break down? | Introduce subsidies (costs covered for all) or a mutant with negligible production costs; retain other features (e.g., verification). | Yes: Cheating proliferates; system collapses. | Not necessarily: Stability persists if non-cost mechanisms (e.g., verification) enforce honesty. | Handicap: Stability with subsidized costs. Cue-and-Constraint: Collapse despite functional non-cost mechanisms. |  
  | **Perceptibility**: Can a cost-free trait that enhances perceptibility of an existing cue (e.g., a structure improving size assessment) stabilize honesty under partial conflict? | Model a signal with zero marginal production cost, where the trait only amplifies a pre-existing quality cue. | No: Without costs, mimicry undermines stability. | Yes: If perceptibility is quality-dependent (e.g., only high-quality signallers achieve clear amplification), honesty holds. | Handicap: Stable cost-free perceptibility enhancement. Cue-and-Constraint: Instability despite quality-dependent perceptibility. |  
  | **Enforcement**: Can post-signalling costs (e.g., receiver retaliation) alone stabilize a system with *zero* production costs? | Model with costless signal production; honesty enforced solely via receiver-imposed penalties for dishonesty. | No: Production costs are essential; retaliation alone is insufficient for stability. | Yes: If penalties are reliable and severe, stability is achievable. | Handicap: Stable system with production costs removed. Cue-and-Constraint: Instability under high-retaliation regimes. |  
  | **Model-Dependence**: Does the necessity of differential costs hinge on model assumptions (e.g., continuous signals, additive costs)? | Compare discrete vs. continuous models; test additive vs. non-additive cost-benefit functions. | No: Differential costs remain necessary in all continuous-quality, partial-conflict models. | Yes: In discrete models, constraints suffice; in continuous models, non-cost mechanisms can stabilize. | Handicap: Stable continuous model without differential costs. Cue-and-Constraint: Differential costs proven necessary across all biologically plausible models. |  
  *Notes*:  
  - **No overlapping predictions**: All cruxes yield divergent forecasts.  
  - **Neither side would move** on perceptibility/enforcement cruxes if the other’s mechanisms are "smuggled in" (e.g., if "perceptibility" implies hidden constraints).  

  **Part 4: What Neither Side Holds**  
  - The **handicap side** rejects:  
    - That signals must be "wasteful" or maladaptive.  
    - That differential costs are relevant only in discrete-quality systems.  
  - The **cue-and-constraint side** rejects:  
    - That costs are irrelevant to signalling stability.  
    - That receiver psychology or retaliation is sufficient *without* signal-quality tracking.  
  - **Both sides reject**:  
    - That complete interest alignment negates the need for stabilizing mechanisms.  
    - That empirical examples of cost-free indices (e.g., unfakeable cues) invalidate their theses for *continuous* quality systems.  
    - That the handicap principle applies universally (e.g., to all signalling contexts beyond partial conflict).  

