prompt: |-
  I'm the TA for an upper-level seminar on free will and I'm putting together the problem set for the week on agency and mechanism, and I need one case that I can't find in the usual places. We started from the old entomology anecdote behind the word "sphexishness": the digger wasp drags its paralysed prey to the burrow, sets it down on the threshold, goes inside to inspect, comes back out and hauls it in; if while it's inside you move the prey a few inches, it comes out, drags it back to the threshold, and goes in to inspect again, and you can keep it looping like that more or less indefinately. The moral everyone draws is that rigidity — the failure to take in feedback and update — is the signature of the mechanical, so flexibility and fine-grained sensitivity to how things stand look like the signature of a real agent. But my roomate, who's also in the seminar, pointed out that the behaviour we admire most in people is often rigid in exactly that sense: the nurse who doesn't recalculate whether to falsify a chart, the referee who won't reopen a decision once the crowd starts shouting. So "she just does the same thing every time no matter what you do to the setup" can't settle anything by itself, and I want a case that shows that rather than one that just asserts it.

  Here's what I need you to build. One scenario, realistic — a workplace, a hospital, a courtroom, a family, whatever; no neurosugeons, no implants, no chips, no demons, no science fiction at all. Two agents (or one agent at two times, if you'd rather) performing the same kind of action, held equal in every respect that could otherwise explain the difference: same information, same competence, comparable upbringing and incentives, neither of them coerced, addicted, phobic, brainwashed, exhausted or self-deceived. The only difference should be the one thing your case is built to isolate. And the two verdicts have to cross:

  - A flexibility / anti-sphexishness criterion — roughly, freedom and responsibility track how much the agent's behaviour varies appropriately across nearby counterfactual circumstances, so the more the behaviour is a fixed loop that can't take in feedback, the less free the agent is — has to say that A is free and responsible and B is not.
  - A source or ownership criterion — roughly, the behaviour has to be the agent's own in the right way, flowing from a will or a character or a practical identity that is theirs rather than merely from a mechanism that happens to be running in them — has to say the reverse: B is free and responsible, A is not.
  - Neither verdict may be stipulated in the description. For each criterion I want to see the actual test applied to the actual details: which counterfactual variations the flexible agent tracks and which the rigid one fails to register, and what it is about the rigid agent's loop that makes it theirs rather than something merely happening to them.

  Then the part I actually care about, which is where my own drafts kept cheating. Name the single feature of your case that is doing the work, and say what happens if you delete it or flip it — does the case collapse into a bog-standard manipulation case, into the plain "she couldn't have done otherwise" intuition pump, or into nothing at all? Then give me the strongest attack a defender of the flexibility criterion could make on your case, the real version and not a strawman, and tell me honestly whether it lands or whether the case survives it. Finally, since this is going on a handout, add one discussion question for the bottom of the page, the kind where half the room will want to say yes and half no. Keep the scenario itself to a single paragraph; the walkthrough, the feature, the attack and the question can be as long as they need to be.
reasoning: |-
  Okay, let's tackle this TA's problem set request. They need a realistic case study that challenges the simplistic "flexibility = agency" assumption by showing rigidity can sometimes indicate responsible agency, while flexibility might undermine it. 

  The user is clearly deep in philosophical nuance - they've already rejected easy answers and want a case where the tension between two criteria (flexibility vs sourcehood) creates crossed verdicts. Their frustration with their own drafts "cheating" suggests they've struggled to isolate the key variable without smuggling in familiar tropes like manipulation or incapacity.

  Hmm... workplace settings might work best for realism. Consider a compliance officer scenario: two professionals facing pressure to bend rules. For Agent A, flexibility looks like responsiveness but actually shows weak commitment; for Agent B, rigidity reflects deep ownership of values. The core differentiator needs to be something subtle like the integration of the rule into identity.

  Wait - medical contexts could make the stakes clearer. Imagine two nurses handling a safety protocol: one who adapts it situationally vs one who never deviates. But why would the rigid nurse be more responsible? Only if their rigidity stems from internalized principle rather than blind habit. That's the pivot: the source of the rigidity matters.

  The trickiest part will be showing the flexible agent fails the source criterion without implying manipulation. Maybe show their flexibility as coming from external incentives rather than conviction. For the rigid agent, emphasize how their consistency flows from personal history of choice - even if it looks mechanical, it's authentically theirs.

  For the attack section, a flexibility defender might argue rigidity always indicates cognitive inflexibility. The counter? Some values demand consistency - think of principled resistance to corruption. The case survives if we can show context matters: mechanical rigidity vs chosen steadfastness.

  Discussion question should force students to pick sides: "Can a reflex ever be more agential than a considered choice?" That should spark debate...
answer: |-
  Here's a case designed to isolate the tension between flexibility and source criteria for agency:

  **Scenario:** Two senior air traffic controllers, Maya and Chloe, work at a busy regional airport. Each faces a recurring situation: an incoming pilot urgently requests clearance for a non-standard approach due to minor turbulence concerns. Company policy strictly prohibits this deviation unless specific, verifiable safety thresholds are met. Both controllers know the policy inside out, understand its safety rationale, are highly competent, have similar seniority and training, face identical peer pressure to "be flexible," and genuinely believe strict adherence is safest long-term. When the request comes in, **Maya** carefully reassesses the weather data and pilot report *every single time*, weighing the specifics against policy. Sometimes she grants it, sometimes she refuses. **Chloe**, however, has a firm personal rule: "Never deviate on these requests without verified threshold breach." She refuses instantly, citing policy, without re-examining the specific data for *this* flight. She does this consistently, regardless of pilot insistence or peer murmurs.

  **Applying the Criteria:**

  1.  **Flexibility / Anti-Sphexishness Criterion:**
      *   **Maya (Flexible):** Her behavior varies *appropriately* with the specific details of each situation (the precise nature of the turbulence report, wind shear indicators, etc.). She takes in feedback (the pilot's report) and updates her decision based on that specific input. This fine-grained sensitivity to the circumstances suggests genuine agency and responsibility. She is *responding* to the world.
      *   **Chloe (Rigid):** Her behavior is fixed. Moving the "prey" (changing the specifics of the pilot's report, the peer pressure) doesn't alter her loop: hear request -> refuse based on rule. She fails to register or incorporate the unique feedback of *this particular situation* beyond triggering her fixed response. This rigidity resembles sphexishness, suggesting diminished freedom/responsibility; she's merely running a program.

  2.  **Source / Ownership Criterion:**
      *   **Chloe (Rigid):** Her rigid rule isn't merely an instinct or habit; it's the result of deep reflection and a conscious choice she made years ago after a near-miss incident involving a deviation. She *owns* this rule as a core part of her professional identity – "This is the controller I *am*." The consistency flows directly from this integrated practical identity. The mechanism *is* her will expressed as principle.
      *   **Maya (Flexible):** While competent, her constant reassessment *in this specific context* could stem from a lack of fully internalized conviction or ownership of the principle. Her flexibility might reflect a susceptibility to external pressure (pilot urgency, peer opinion) or a need to re-validate her decision constantly because the underlying commitment isn't rock-solid. Her varying behavior, while responsive, may not flow as deeply from an owned, stable source within *herself*; it might be more about reacting to the loudest input. Her agency is diffused by the situation.

  **The Isolated Feature Doing the Work:** **The *Depth of Integration* of the Principle into the Agent's Practical Identity.**

  *   **Why it works:** The case holds constant competence, information, incentives, lack of coercion, etc. The key difference is *how* the safety principle functions within the agent. For Chloe, it's a deeply internalized, identity-constituting rule chosen as an expression of her core values as a controller. For Maya, while she believes in the principle, it functions more as an external guideline she *applies* conscientiously on a case-by-case basis, leaving her potentially more permeable to other situational pressures.
  *   **Delete/Flip It:** If Chloe's rigidity stemmed *only* from unreflective habit, unprocessed trauma, or corporate indoctrination (not deep personal integration), she would fail the source criterion, collapsing into a standard "mechanism" case. If Maya's flexibility stemmed from a deeply owned commitment to *contextual judgment* itself as her core principle (e.g., "I *am* the controller who always makes the nuanced call"), she might pass the source criterion, collapsing the tension. The case relies on Chloe's rigidity *originating* from profound ownership and Maya's flexibility *potentially* reflecting a lack of such deep ownership regarding *this specific rule*.

  **Strongest Attack from a Flexibility Defender:**
  "The flexibility criterion doesn't just demand *any* variation; it demands *appropriate* sensitivity to *relevant* features. Chloe's rigidity *is* inappropriate. The specific weather details and pilot reports *are* relevant features for applying the safety policy correctly. By refusing to even *consider* them, Chloe fails to track the morally and practically salient aspects of the situation. She treats vastly different scenarios (e.g., a minor bump vs. potentially dangerous shear) identically. This isn't principled steadfastness; it's cognitive laziness or a failure of professional diligence. Her 'source' is just an excuse for shutting down necessary cognition. Maya, by contrast, demonstrates the appropriate sensitivity to the relevant variables, showing true responsibility. Chloe's rigid behavior, while perhaps stemming from a past choice, has *become* mechanical in its application, failing the core test of rational agency: responsiveness to reasons as they present themselves in the specific context."

  **Does the Attack Land? (Honestly):** **Partially, but the case survives.** The attack correctly highlights that Chloe's rigidity *could* lead to suboptimal decisions if a situation genuinely met the threshold but her automatic refusal prevented her from seeing it. It forces a crucial clarification: deep ownership *alone* doesn't guarantee good judgment. However, the case survives because:
  1.  The scenario specifies Chloe *knows* the policy and thresholds. Her rule *is* based on the relevant safety features; it's a pre-commitment *against* re-evaluating factors she deems unreliable or prone to pressure (like pilot urgency).
  2.  The defender's attack assumes constant re-evaluation is *always* necessary for responsibility. The case challenges this by suggesting that in contexts of predictable pressure or potential for bias, a pre-committed, consistent rule *can* be the most responsible expression of agency *precisely because* it avoids the pitfalls of situationally influenced "flexibility." It prioritizes the source (deeply held principle) over moment-by-moment reassessment *as a responsible choice in itself*. The rigidity isn't about ignoring relevance but about *filtering* it through a chosen, owned framework.

  **Discussion Question:**
  **Can unwavering adherence to a self-chosen principle ever represent a *higher* form of free agency and responsibility than flexible, case-by-case responsiveness? If so, when does rigid principle cross the line into mere mechanical sphexishness?**

  This question directly targets the core tension, forcing students to grapple with the conditions under which rigidity signifies ownership versus mechanism and flexibility signifies responsiveness versus diffusion. It ensures debate by making both "yes" and "no" answers defensible based on interpretations of the criteria and the case.
