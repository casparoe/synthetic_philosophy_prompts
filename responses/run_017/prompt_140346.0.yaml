prompt: |-
  Hi — I'm a science journalist trying to figure out whether "memes" were ever anything more than a cute metaphor for stuff that spreads, and I keep going in circles. A few weeks ago I was at a dinner after a cultural evolution workshop in Ljubljana and got into it with an anthropologist who said the whole framework collapses because most cultural variants have no lineage you could draw: a recipe you half-remember from your grandmother and half from a video you saw last Tuesday has no single parent. A friend who studies sound trends on short-video apps says the same thing harder — there the things visibly graft onto each other, one clip spliced into another, so whatever "reproduction" is doing it isn't cleanly splitting into two copies. I've started calling that the grafting problem so I have something to call it, and I've got a second worry I half-invented a name for: the vacant-host problem, where a variant thrives while the people carrying it most intensely do measurably worse, which makes the whole "what is it for the variant to be fit" question feel like it has no answer. Meanwhile I keep hearing the opposite complaint, that the framework is fine but empty: people gesture at fidelity, fecundity and longevity as the conditions something has to meet to count as a replicator and then never cash any of it out into anything a fieldworker could go and measure.

  So I want the spec, not the scorecard. Please take the role of a philosopher of biology who has actually spent years on this, and do some genuine brainstorming before you commit — I can get the four safe bullet points anywhere and I don't want them. Here's the question: what would a genuinely Darwinian theory of culture have to deliver to be worth building a research programme on, where "worth building on" means it tells an empirical team what to measure and can say in some case that culture is *not* evolving in the relevant sense? You should assume I've read the pop versions and skip them, skip any "as so-and-so argued in 19XX" moves entirely (no citations, no bibliography, nobody can check them here and I want the arguments), and don't lean on the famous lost-technology cases — they're contested enough that they'd just let you dodge the hard part. Give me exactly five numbered items, no intro and no sign-off: four desiderata, each stated with the concrete phenomenon or case that makes it a requirement — ideally something I could point at in a news story — plus a tag for whether it's non-negotiable or just a preference of one camp; and a fifth item naming the pair of desiderata you think can't be jointly satisfied and why, since that tension is the bit my editor will actually like. Two or three sentences per item, and be blunt if you think the honest verdict is that the list as a whole can't be met.
reasoning: |-
  Okay, the user is a science journalist struggling with the concept of memes in cultural evolution. They've encountered several problems: the grafting problem (cultural variants with mixed lineages), the vacant-host problem (cultural traits thriving even when harmful to hosts), and criticisms that the framework lacks empirical measurability. They want a philosopher of biology's perspective on what a genuinely Darwinian theory of culture must deliver to be scientifically useful.

  The journalist specifically asks for five items: four desiderata with concrete examples, plus one conflicting pair. They want bluntness and no citations. The key is to focus on empirical testability and clear failure conditions - what would prove cultural evolution isn't Darwinian.

  For the first desideratum: Lineage Traceability. The grafting problem shows cultural transmission often blends sources (e.g. TikTok remixes). A theory must account for blended inheritance while still allowing lineage mapping. This is non-negotiable - without lineages, there's no evolution.

  Second: Fitness Anchoring. The vacant-host problem (e.g. anti-vax memes harming believers) demands that cultural fitness must be defined independently of biological fitness. Non-negotiable - otherwise "fitness" is circular.

  Third: Quantifiable Replication Parameters. Critics say fidelity/fecundity/longevity aren't measured. Concrete example: comparing catchphrase spread in oral vs. written traditions. Non-negotiable - without metrics, it's not science.

  Fourth: Variation Constraints. Cultural evolution must have limits (e.g. why some chord progressions dominate music). Preference - but important for predictive power.

  The conflict: Lineage Traceability vs. Replication Quantification. High-fidelity replication creates clear lineages but is rare in culture (where blending is common). Quantifiable parameters assume particulate inheritance, but culture behaves more like fluid blending. This tension might be unresolvable.

  The journalist needs this tension highlighted - it's the hook for their article. The overall verdict: while some desiderata might be met, the core conflict between particulate inheritance models and cultural reality may make a strictly Darwinian framework untenable.
answer: |-
  Here are the five items as requested:

  1.  **Lineage Traceability (Non-negotiable):** The theory must provide a rigorous method to identify and track *specific cultural variants* across transmission events, even amidst blending ("grafting"). For example, tracing the specific melodic motif or lyrical phrase from an original song through dozens of TikTok remixes and parodies, distinguishing which elements descend from which prior versions despite heavy editing and combination. Without demonstrable parent-offspring lineages for variants, natural selection cannot operate.

  2.  **Fitness Anchoring (Non-negotiable):** The theory must define "fitness" for a cultural variant *independently* of its current prevalence or host success, resolving the "vacant-host problem." It must specify measurable properties *of the variant itself* (e.g., ease of recall, emotional resonance, compatibility with existing beliefs) that predict its spread/replication success *regardless* of its effect on the host (e.g., an anti-vaccine meme spreading virally while demonstrably harming the health and social standing of its most ardent promoters). Fitness cannot be tautologically defined as "whatever spreads."

  3.  **Quantifiable Replication Parameters (Non-negotiable):** The theory must translate abstract concepts like "fidelity," "fecundity," and "longevity" into specific, field-measurable quantities. For instance, defining and measuring the "copying error rate per transmission event" for a folk tale told orally across generations in an isolated village, or the "reproductive output" (number of new learners/imitators per unit time) for a specific dance move on a social media platform. Without concrete operationalizations, the framework remains untestable metaphor.

  4.  **Variation Constraints (Preference - Predictive Power Camp):** The theory should identify inherent limits on *possible* cultural variation arising from cognitive, physical, or social structures, enabling predictions about what *cannot* stably evolve. For example, explaining why certain grammatical structures or musical scales recur globally despite independent evolution, or why no culture has ever developed a truly unlearnable ritual. This moves beyond cataloguing existing variation to predicting its bounds.

  5.  **The Irreconcilable Tension:** **Lineage Traceability vs. Quantifiable Replication Parameters.** High-fidelity, quantifiable replication (like copying a gene or a digital file) produces clear lineages but is rare in culture, where blending ("grafting") is fundamental. Conversely, quantifying "replication" for blended elements (e.g., measuring the "fidelity" of a recipe combining grandma's memory and a TikTok video) requires defining arbitrary units of cultural "atoms" or accepting fuzzy, lineage-blurring processes. This directly conflicts with the need for crisp lineage traceability demanded by strict Darwinism. You either have quantifiable copying *or* realistic cultural blending with traceable lineages, but likely not both in a rigorous, non-arbitrary way. This tension suggests culture often operates with inheritance mechanisms fundamentally unlike gene replication.
