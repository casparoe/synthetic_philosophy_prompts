answer: |-
  ### RFC: Packet Model for Localized Error Messages  
  **Author**: Staff Engineer, Platform Notifications  
  **Status**: Draft  
  **Reviewers**: Amsterdam Localization Team (NL), Tokyo Localization Team (JP)  

  ---

  ### **Summary**  
  This RFC proposes the **Packet Model** for error messages:  
  - **Payload**: The literal proposition (e.g., "File save failed").  
  - **Header**: Tone parameters (e.g., hedging, negation softening).  
  Localization teams may **only** adjust headers. Any deviation from the payload’s truth conditions is a **Truth Incident** (severity-logged). A linter enforces payload integrity.  

  ---

  ### **Motivation**  
  Current code reviews cycle endlessly between:  
  1. **NL Team**: "Apologies (e.g., ‘Sorry, file not saved’) are deceptive. State facts."  
  2. **JP Team**: "Bluntness (e.g., ‘File save failed’) disregards user rapport."  
  The Packet Model resolves this by decoupling *what* is said (payload) from *how* (header). Truth is locale-invariant; tone is locale-parametric.  

  ---

  ### **Design**  
  #### **Packet Structure**  
  ```json  
  {  
    "payload": "File {name} deletion failed",  
    "header": {  
      "hedging": "off",  
      "negation_softening": "off",  
      "apology": "never"  
    }  
  }  
  ```  

  #### **Localization Process**  
  1. Linter validates payload for atomic propositions (e.g., "failed" ≠ "may have failed").  
  2. Localization applies header parameters (Table 1).  
  3. If output contradicts payload (e.g., hedging introduces uncertainty), a **Truth Incident** is logged.  

  #### **Truth Incident Severity**  
  | Level     | Criteria                                  | Example                          |  
  |-----------|-------------------------------------------|----------------------------------|  
  | `MINOR`   | Payload technically true but misleading   | "File may be gone" vs. "is gone" |  
  | `MAJOR`   | Payload false in >10% of cases            | "File not saved" (when recoverable)|  
  | `CRITICAL`| Payload causes user harm (e.g., data loss)| Incorrect recovery instructions  |  

  ---

  ### **Per-Locale Header Parameters (Table 1)**  
  | Parameter          | nl-NL       | ja-JP       |  
  |--------------------|-------------|-------------|  
  | `hedging`          | off         | on          |  
  | `negation_softening`| off         | on          |  
  | `apology`          | never       | contextual  |  
  | `directness`       | high        | low         |  

  ---

  ### **Worked Examples**  
  #### **Payload**: "File {name} is unrecoverable."  

  **nl-NL Output**:  
  > "File vacation_photos.png is unrecoverable."  
  > *✅ No truth incident. Linter passed.*  

  **ja-JP Output**:  
  > "File vacation_photos.png may be difficult to recover."  
  > *⚠️ Truth Incident: MINOR. Payload asserts impossibility; output suggests difficulty. Hedging adds ambiguity.*  

  #### **Payload**: "System error: Data not saved."  

  **ja-JP Output**:  
  > "We apologize for the inconvenience. Data may not have been saved."  
  > *⚠️ Truth Incident: MINOR (apology added, negation softened).*  

  **nl-NL Output**:  
  > "System error: Data not saved."  
  > *✅ No truth incident.*  

  ---

  ### **Rollout Plan**  
  1. **Phase 1 (Q3)**: Linter integration, truth-incident logging.  
  2. **Phase 2 (Q4)**: Locale-specific header tables enforced.  
  3. **Phase 3 (Q1)**: Automated payload audits; severity triage.  

  ---

  ### **Inline Reviewer Comments**  
  > **NL Team (Margin)**:  
  > *"Why is ‘may be difficult’ a MINOR incident? It’s FALSE. If recovery is possible, payload must be updated. Truth isn’t probabilistic."*  
  >   
  > **JP Team (Margin)**:  
  > *"‘Unrecoverable’ is often false! Systems have edge cases. Softening *is* accuracy. Linter fails pragmatics."*  
  >   
  > **NL Team**:  
  > **"Apologies waste screen space. If the server isn’t sentient, ‘sorry’ is a lie. Log all apologies as MINOR."**  
  >   
  > **JP Team**:  
  > *"‘Data not saved’ is true but destructive. Users abandon apps after blunt errors. We’re logging humanity as ‘truth incidents’."*  
  >   
  > **NL Team**:  
  > **"If ‘may not have been saved’ is allowed, why not ‘unicorns deleted your file’? Both deviate from payload."**  
  >   
  > **JP Team**:  
  > *"Directness ≠ truth. Example: In JP, omitting honorifics makes ‘Data not saved’ *false* because it implies hostility. Your ‘payload’ is culturally naive."*  

  ---

  ### **Appendix: Truth Incident Dashboard**  
  All incidents require justification:  
  ```markdown  
  | Locale | Message ID       | Severity | Justification                  |  
  |--------|------------------|----------|--------------------------------|  
  | ja-JP  | FILE_SAVE_ERROR  | MINOR    | Added apology hedge            |  
  | nl-NL  | DB_CONN_FAIL     | MAJOR    | Omitted recoverable state      |  
  ```  
  **Staff Engineer Note**: "MINOR incidents are acceptable if they reduce user churn. Truth is a spectrum."  

  ---  
  *RFC ends at 798 words.*  

  ### **Satire Mechanism**  
  - **Collapsing the Model**: The RFC’s own examples/logging expose contradictions:  
    - Softened language (ja-JP) is logged as "lies," but bluntness (nl-NL) ignores contextual truth (e.g., recoverable files).  
    - The linter cannot handle pragmatics (e.g., "unrecoverable" is often probabilistic; apologies manage social contracts).  
  - **Philosophical Accuracy**:  
    - **Deniable Indirectness**: ja-JP’s "may be difficult" lets users infer severity without literal falsehood. The model flags this as deception.  
    - **Truth Conditions**: "Data not saved" *is* true, but ja-JP argues the blunt utterance *misrepresents* the service’s intent (hence "false").  
    - **White Lies**: The RFC treats them as "MINOR" incidents—loggable but tolerable—highlighting the model’s moral evasion.  
  - **Engineer Recognition**:  
    - The severity enum and "truth spectrum" footnote mirror real-world compromises.  
    - Reviewer debates satirize how teams weaponize "truth" to enforce cultural preferences.  

  Result: A reader recoils at the bureaucracy of scoring "lies" while admitting they’re business-necessary. The model collapses under its own rulebook, unable to resolve *why* bluntness or politeness is "true" in a given context.
