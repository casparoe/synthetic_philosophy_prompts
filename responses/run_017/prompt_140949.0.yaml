prompt: |-
  You are a philosopher of cognitive science who has also done hands-on interpretability work on transformer language models. Please think carefully and slowly about the request below. Before writing your final answer, brainstorm: enumerate more candidate conflicts among my commitments than you think you need, including ones you will later reject, and only then prune and rank. I would rather see the pruning than only the survivors. Write at the level of a colleague's written comments on a draft — dense, specific, willing to say that something I hold is not doing the work I think it is — not at the level of a survey article. No bibliography or citations are wanted; argue from the structure of the views.

  I am a PhD student in philosophy writing a short position statement on whether trained neural networks really have representations, or whether talk of representation is only a useful façon de parler about systems we do not yet understand. I want the package audited before I commit to it. Here is where I have landed:

  (1) Feature realism. There is a fact of the matter about which features a trained network represents, and this fact is not fixed by what interpreters find useful, by what is convenient to visualize, or by which decomposition we happen to choose. It is a substantive, interpreter-independent fact that our attributions could in principle get wrong.

  (2) Basis anti-privilege. No basis of activation space is metaphysically canonical: not the neuron or "standard" basis, not the directions recovered by dictionary learning / sparse autoencoders, not principal components. Two decompositions can be incompatible as sets of directions and yet both be perfectly good descriptions of the same network.

  (3) Superposition. Networks standardly represent many more features than they have dimensions: features correspond to directions that are not mutually orthogonal, and the network tolerates a nonzero amount of interference among them because the features are sparse.

  (4) The linear representation hypothesis. Features are, at least approximately, linear directions in activation space rather than, say, regions, manifolds, or essentially nonlinear codes.

  (5) The causal-efficacy criterion. A candidate feature is a real feature of the network only if the network's own downstream computation actually reads it out. This is what I rely on to settle the "grain" problem: when a finer-grained dictionary splits one coarse feature into several, or when one dictionary element's variance gets absorbed into others, I want to say that the grain at which the network itself is sensitive settles which of these are the features, and that a decomposition element nothing downstream consults is not a feature of the network at all.

  (6) Interventionist evidentialism. Representation claims are warranted only by interventional evidence — patching, steering, ablation that changes behavior in the way the hypothesis predicts. Merely observational or correlational evidence, such as a linear probe's accuracy, is at most suggestive and never sufficient.

  (7) Anti-propositionalism. It is a mistake to ascribe beliefs, desires, or propositional attitudes to models. Interpretability is not in the business of recovering "what the model thinks"; where such talk appears it should be read as shorthand for behavioral or counterfactual dispositions.

  One distinction I have been leaning on in the draft: the difference between a feature's causal profile — the inputs that activate it and the downstream effects it has — and its geometric realization — the particular direction or set of directions in which it is implemented. I use this to argue that (1) and (2) are compatible: realism is about causal profiles, and one causal profile can have many geometric realizations.

  And one hypothetical I want you to take as stipulated, not as something to look up or to correct me about. Call it the no-bridge result: suppose that two models trained independently from different initializations produce dictionaries with no recoverable correspondence to one another — no correspondence under any invertible linear map, and no transfer of steering vectors in either direction — while the models remain behaviorally indistinguishable on every input distribution we can construct, and while each model individually supports the full range of successful interventions within itself. Suppose further that this holds however much we refine the dictionaries.

  What I want from you:

  1. An audit of the package. Which pairs of commitments are genuinely in tension, ranked by severity rather than listed flatly? For each: state the tension precisely, say which commitment must go or be revised, and say what that revision costs me elsewhere in the package.
  2. Discrimination. I suspect at least one pair only looks like a conflict and dissolves once the commitments are stated carefully. Tell me which, if any, and why it dissolves — and tell me if you think I am wrong that any of them dissolves.
  3. Whether the causal-profile / geometric-realization distinction can bear the weight I am putting on it in reconciling (1) with (2), given (5). In particular: does the distinction help, or does it just relocate the problem from directions to causal profiles?
  4. What the no-bridge result actually threatens. Does it count against (1) itself, against only a familiar evidential argument for realism, or against nothing I have said? Is there a version of my view on which it is predicted, and if so does that version still deserve to be called realism?
  5. The single revision that would clean up the most of the package at the least cost, and an honest statement of what it costs.

  Two constraints. First, do not resolve tensions by retreating to quietism or conventionalism — "the network has the features it is useful to say it has" is not available to me, and I say so in (1). Second, do not soften every conflict into an "it depends." If two of my commitments cannot both be kept in the strong form in which I have stated them, say which one has to weaken, and say what the weakened version would commit me to on a case: e.g., what it would make me say about a dictionary feature that no intervention can isolate, or about a steering vector that generalizes across prompts but to which I deny propositional content.
