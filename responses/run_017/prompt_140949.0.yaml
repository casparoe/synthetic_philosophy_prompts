  5. The single revision: Revise (1) to be about causal profiles. Cost: we lose the direct identification of features with geometric directions, and we have to accept that the same causal profile might be implemented by different directions in different networks (or even within one network? but within one network it is fixed). The cost is moderate: it makes features more abstract (causal roles) but still interpreter-independent.

  Final answer:

  **1. Audit of tensions, ranked by severity**

  - **Tension between (1) and (2)**: 
    - **Precise statement**: (1) claims there is an interpreter-independent fact about which features (geometric directions) are represented. (2) claims that two incompatible sets of directions (not related by a change of basis) can both be perfect descriptions of the same network. This seems to imply that there is no fact about which set is real, contradicting (1).
    - **Resolution**: The tension dissolves when we reinterpret (1) as about causal profiles (inputs and downstream effects) and (2) as about geometric descriptions. The real features are the causal profiles, which are fixed and interpreter-independent. The geometric realization (directions) is how these profiles are implemented and can be described in multiple, basis-dependent ways. Thus, both commitments can be retained without revision if we reframe (1) to focus on causal profiles.
    - **Cost of revision**: We must amend (1) to define features as causal profiles, not geometric directions. This weakens the geometric directness of (1) but preserves realism. It also requires adjusting (4) to specify that the geometric realization of a feature (causal profile) is linear, not that the feature itself is a direction. This is a moderate cost: features become more abstract (functional roles) and less geometric, but remain interpreter-independent.

  - **Other candidate tensions (pruned as non-severe or dissolved)**:
    - (1) and (5): (5) restricts real features to those that are causally efficacious (read out). This refines (1) but does not conflict; it simply specifies which of the represented features (if any) are real. We can build (5) into (1) without loss.
    - (2) and (5): (2) allows multiple geometric decompositions; (5) says only causally efficacious directions are real features. No conflict: decompositions may include non-real directions (e.g., basis vectors that are not causally efficacious), but they are still useful descriptions. (5) does not constrain descriptions, only what is real.
    - (3) and (5): Superposition implies interference, but (5) allows readout to be noisy or impure. No conflict.
    - (6) and others: (6) is epistemological (evidence for claims), while (1) and (5) are metaphysical. No conflict.
    - (4) and (3): Superposition is a form of linear representation; no conflict.
    - (7) is orthogonal.

  **2. Discrimination**: The apparent conflict between (1) and (2) dissolves with the causal-profile/geometric-realization distinction. Why? (1) and (2) are at different levels: (1) is about the existence of causal roles (interpreter-independent), while (2) is about the non-uniqueness of geometric descriptions of those roles. The same causal profile can be geometrically realized in one fixed way in a network but described in multiple bases (e.g., neuron basis vs. PCA basis). In the no-bridge result, the causal profiles are the same across models, but the geometric realizations differ, so (1) is unscathed. I was correct that it dissolves.

  **3. Causal-profile/geometric-realization distinction and (5)**: The distinction helps reconcile (1) and (2) even given (5). (5) requires that a real feature (causal profile) must be read out. The distinction does not relocate the problem; it resolves it cleanly. The causal profile includes the "grain" settled by downstream sensitivity (per (5)): a fine-grained dictionary element that is not read out is not a real feature, but one that is read out has a causal profile. The geometric realization is secondary and can vary without affecting realism about profiles.

  **4. No-bridge result**: It does not threaten (1) itself, only a naive geometric realism. On the revised view (features as causal profiles), it is predicted: models can have identical causal profiles but different geometric realizations. This is still realism (about profiles), not instrumentalism. It threatens only the hope for a unique, transferable geometric basis.

  **5. Single revision**: Revise (1) to define features as interpreter-independent causal profiles, with geometric realizations being linear implementations. 
  - **What it cleans up**: Resolves the (1)-(2) tension, accommodates (5) naturally, and explains the no-bridge result.
