  ### Audit of the Package: Tensions, Resolutions, and Revisions

  I've audited your commitments (1)-(7) and the causal-profile/geometric-realization distinction. I'll proceed as requested: first, I enumerate candidate tensions (including those I later reject), then prune/rank them by severity. I address your five numbered questions in the audit. The single most impactful revision is at the end. 

  **Brainstorm: Candidate Tensions**  
  I identified 10 potential conflicts. I list them raw before pruning:  
  - **A. (1) vs (2)**: Realism requires a unique fact about features; anti-privilege allows incompatible geometric descriptions. Does this imply no fact of the matter?  
