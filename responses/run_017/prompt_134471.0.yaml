          - In season 1, the gas exchange chamber was broken and repaired (so functional). The bright throat patch was broken and not repaired (non-functional). The camouflage feathers were broken and not repaired (non-functional). The vestigial claw was broken and not repaired.
          - In handover, they might change the vestigial claw to CRITICAL and then repair it (using 3 tokens) because it's now useful for climbing.

     Rules for handover action:
          - They can change the certification of one part.
          - Then, they may repair one part that is currently broken (and is now marked as CRITICAL or OPTIONAL) at the cost of 3 tokens for CRITICAL or 1 for OPTIONAL, but they only have 3 tokens. Or they may disable one part that is currently functional (and is now marked as JUNK) at no cost.

     Then, season 2 uses the updated state.

     This works.

  8. **Reveal 2: The Twin (5 minutes):**
     - After season 2, reveal that there is a physically identical twin organism of the other kind (legacy or assembled) and show the other Board's dossier (with history or design). Then, ask each Board if they want to change any certification based on this new information. They don't get to see the other Board's certifications, only the dossier.

     - Then, they wager 0 to 3 points (from their total score) on whether they think their certifications will change. After they decide, they see the other Board's certifications and discuss.

     But we don't run a season 3, so the change is hypothetical.

     Instead, we can have them discuss whether they would change their certifications and why.

     Scoring for the wager: if they change at least one certification, they win double the wagered points. If not, they lose the wagered points.

     But this might be complex. Perhaps we skip the wager and just use it for discussion.

     We'll do: after the reveal, they discuss in their Board whether to change any certification and why. Then we move to debrief.

  Activity Summary:

  - 4 Boards, each with:
     - One Swoopwing organism (legacy or assembled)
     - One capacity ticket (Oxygen Uptake or Predator Avoidance)
     - Dossier (phase 1: current causal roles only; after reveal 1: history/design)
     - 10 tokens

  - Phase 1: Initial certification (mark each part as C, O, J). 15 minutes.
  - Reveal 1: History/Design. Boards may revise certifications. 5 minutes.
  - Phase 2: Breakage (instructor reveals which parts are broken: e.g., gas exchange, bright throat patch, camouflage feathers, vestigial claw). Boards repair: for every broken part, if marked as C, must spend 3 tokens to repair; if O, may spend 1 token to repair; if J, do nothing. Then, season 1 outcome is determined (survival and capacity score). 10 minutes.
  - Handover: New environment announced. Each Board may change one part's certification and then take one action:
        - Repair one broken part (if now marked as C or O) at cost (3 for C, 1 for O) if they have tokens, OR
        - Disable one functional part (if now marked as J) at no cost.
     Then, season 2 outcome. 10 minutes.
  - Reveal 2: The Twin (each Board learns there is an identical twin of the other kind and sees its history/design dossier). Boards discuss whether to change any certification. 5 minutes.
  - Wagering: Before seeing other Boards' work, each Board wagers 0-3 points on whether they will change at least one certification. Then, they see the twin's actual certifications from the other Board and decide if they change. If they change, they gain twice the wagered points; if not, they lose the wagered points. (Optional, if time)

  Debrief:

  1. Start by having each Board report their scores and key decisions.
  2. Then, focus on specific parts where there was disagreement or change:
     - Gas exchange chamber: 
          - Oxygen Board marked it CRITICAL, repaired it.
          - Predator Avoidance Board? They also must repair it for survival, so they likely marked it CRITICAL too.
     - Bright throat patch:
          - Oxygen Board initially might have marked it OPTIONAL (for mating) but after reveal, they learn it's detrimental and might mark JUNK -> so they don't repair. 
          - Predator Avoidance Board: marked JUNK from the start? Or after reveal? They don't repair.
     - Camouflage feathers and vestigial claw: 
          - In season 1, both are broken and likely not repaired (because not critical for capacity or survival). 
          - In handover, for season 2 environment, they might change: 
               - Predator Avoidance Board might want to repair camouflage or vestigial claw for predator avoidance in the new environment.
          - Oxygen Board might not care.

  3. Now, introduce the two accounts:
     - Ask: "When you certified a part as CRITICAL, what were you considering?"
     - Expected answers: its current role in the system, its importance for the assigned capacity, or its history of being selected for a purpose.
     - Then: "Did the history/design of the part change your mind? How?"
     - Then: "What about for the assembled organism? Did you treat it differently?"

  4. Map to etiological and causal-role:
     - Etiological: function is what the part was selected for (in the legacy organism) or designed for (in the assembled). This account can explain malfunction (if it fails to do what it was selected for) and vestigial parts (had a function but no longer).
     - Causal-role: function is the current causal contribution to a capacity of the system (in this case, the capacity ticket).

  5. Highlight conflicts:
     - Gas exchange chamber in legacy: etiological says its function is buoyancy (historically), but causal-role says gas exchange. In the activity, the causal-role account dominated because of the capacity ticket.
     - Bright throat patch: etiological says its function is mate attraction, but causal-role in the current environment is detrimental. The Boards ignored the historical function and focused on current effect.
     - Vestigial claw: etiological says it has no function (or an old one), but in the new environment, it can have a causal role.

  6. Emphasize: the two accounts answer different questions:
     - Etiological: "What was this part maintained for in the past?"
     - Causal-role: "What does this part do now for the system?"

  7. What will go wrong:
     - Students might collapse function into usefulness-to-us (the station's capacity ticket). Emphasize that in biology, function is not always for human purposes.
     - A Board might refuse its capacity ticket and certify for survival. The instructor should remind them that their job is to protect the assigned capacity.
     - Someone might say it's both. In the debrief, explain that both are valid but answer different questions.

  8. The budget framing might favor the causal-role account because the station has a goal (the capacity) and limited resources. The etiological account might seem irrelevant. But the reveal of history did affect decisions (e.g., for the bright throat patch). In the debrief, stress that etiological function is about the organism's own goals (survival and reproduction) and not the station's.

  9. What the activity cannot reproduce: The etiological account's connection to norms (malfunction) and to explanation (why the part is there). The causal-role account's connection to system dynamics. You might need to supply in the last 10 minutes how the accounts are used in biological explanations.

  Materials:

  - Dossier for Swoopwing (current causal roles, then history/design for legacy and assembled).
  - Tokens (10 per group).
  - Breakage list (fixed for all: gas exchange, bright throat patch, camouflage feathers, vestigial claw are broken; hollow bones not broken).
  - Capacity tickets (Oxygen Uptake and Predator Avoidance).
  - Worksheets for certification and repairs.
  - Score sheet.

  This should run in 75 minutes:

  - Setup: 5 min
  - Phase 1: 15 min
  - Reveal 1 and revise: 5 min
  - Phase 2 (breakage and repair): 10 min
  - Season 1 outcome: 5 min (instructor announces)
  - Handover: 10 min (including season 2 outcome)
  - Reveal 2 and wager: 5 min
  - Debrief: 20 min

  Debrief in detail:

  1. Start with a poll: "Raise your hand if your organism survived both seasons." Then, "What was your capacity score in season 2?"

  2. Focus on a part that caused tension: the bright throat patch.
     - Ask an Oxygen Board: "Did you repair the bright throat patch? Why or why not?"
     - Then a Predator Avoidance Board: "What about you?"
     - Then ask: "Did the history/design matter? How?"

  3. Introduce the two accounts without naming them:
     - "Some of you considered what the part was originally for. Others focused on what it does now. These are two different ways of thinking about function."

  4. Name the accounts: etiological (selected-effect) and causal-role.

  5. Use the gas exchange chamber:
     - In legacy: etiological function is buoyancy, causal-role is gas exchange.
     - In assembled: etiological (designed for gas exchange) and causal-role (gas exchange) align.

  6. Vestigial claw:
     - In legacy: etiological says no current function, but in new environment causal-role might say climbing.

  7. Point out: the tension is not just verbal. In the activity, the two approaches led to different repair decisions for some parts.

  8. Finally, ask: "If you had to explain why the bright throat patch is there, which account would you use? If you had to decide whether to remove it, which account would you use?"

  9. Conclude: both are useful for different purposes. The etiological account explains why the part exists, the causal-role account helps understand the current system.

  Predictable problems:

  - Time: The activity might run long. Be strict with time.
  - Students might not see the conflict if their decisions aligned. Use the twin reveal to compare.
  - A Board might not follow the capacity ticket. The instructor should circulate and remind.
  - The initial dossier might be ambiguous. Make sure the current causal roles are clear.

  The activity cannot reproduce the full depth of the etiological account's grounding in natural selection and normativity. You will need to explain in the last 10 minutes how the etiological account allows for malfunction (a part can be broken and not doing what it was selected for) and how it explains the presence of the part. The causal-role account does not have norms and does not explain why the part is there, only what it does.

  The budget framing does stack the deck toward causal-role because the station's goals are paramount. To correct, in the debrief, ask: "In the wild, without the station's goals, what would determine if a part is functional?" to transition to etiological.

  Good luck!
answer: |-
  Below is a complete, runnable design for your in-class activity. It leverages your terraforming station frame, creates conflict between etiological and causal-role reasoning without naming them, and uses tangible materials (printed cards, tokens). The debrief explicitly connects in-game decisions to the philosophical accounts. I'll also flag predictable pitfalls and how to mitigate them.

  ---

  ### **Activity Design: Terraforming Station Certification Board**
  **Core Conflict:** Students must prioritize parts for repair under a fixed budget, guided solely by their assigned "capacity ticket" (e.g., oxygen uptake). The reveal of an organism's history (legacy vs. assembled) forces them to confront why they value certain parts—setting up the etiological/causal-role clash. Crucially, **the same part** can be critical for one Board and junk for another, and **identical twins** (one legacy, one assembled) yield divergent verdicts.

  #### **Materials Preparation**
  - **Organism Dossiers** (4 identical sets, 1 per Board; print on cards):  
    Describe a fictional organism, the **"Glidestalker"** (a flying, photosynthetic predator). Each dossier has:
    - **Part Cards** (5 per dossier):  
      Describe form, current causal contributions, and environment. *Exclude history/design initially*.
    - **Environment Card**:  
      *Initial*: High-altitude forest (predators: "Skyeels" attracted to movement; dense CO₂).
    - **Degradation Manifest**:  
      Lists which parts break (fixed for all groups):  
      "Due to dust storms, the following degrade: Gas Bladder, Wing-Fins, Flash Crest, Heat Vent, Root-Tendrils."

    **Part Descriptions (Current Causal Roles Only):**  
    | Part          | Current Contribution                                                                 | Current Harm                                  |
    |---------------|--------------------------------------------------------------------------------------|----------------------------------------------|
    | Gas Bladder   | Regulates buoyancy for flight; exchanges O₂/CO₂ via thin membranes.                 | None observed.                               |
    | Wing-Fins     | Enable gliding and steering; surface area aids thermoregulation.                     | Slow movement attracts Skyeels.              |
    | Flash Crest   | Emits bioluminescent signals during mating.                                          | Attracts Skyeels; energy-intensive.          |
    | Heat Vent     | Releases metabolic heat; stabilizes internal temperature.                            | Inefficient; loses moisture.                 |
    | Root-Tendrils | Absorb ambient nutrients; anchor during rest.                                        | Obstructs flight; prone to tangling.         |

  - **Capacity Tickets** (1 per Board, assign secretly):  
    - Oxygen Uptake | Thermoregulation | Predator Avoidance | Reproductive Signaling  
    *Example: "You are charged with ensuring O₂ production for Station Sector 7. Prioritize parts sustaining oxygen flow."*

  - **Tokens**:  
    - 10 repair tokens per Board (each token = 1 repair credit).  
    - 5 "wager tokens" per Board (for provenance bet).

  - **Organism Provenance Cards** (sealed, revealed mid-activity):  
    - **Legacy**: "Natural lineage: Parts shaped by 400M years of selection."  
    - **Assembled**: "Synthetic organism: Parts compiled 20 years ago from a genomic library; no selection history."  
    *(Assign 2 Boards legacy, 2 assembled—but keep secret until Reveal 1).*

  - **New Environment Card** (revealed during handover):  
    *"Station shift: Relocated to low-altitude caves. High CO₂, no Skyeels, bioluminescent flora, rocky terrain."*

  ---

  ### **Activity Flow (75-min Total)**
  **Groups:** 4 Boards of 4 students each.  
  **Setup (5 min):**  
  - Give each Board:  
    - 1 dossier (part cards + environment card)  
    - 1 capacity ticket (e.g., Oxygen Uptake)  
    - 10 repair tokens  
    - 5 wager tokens  
  - Instructions: *"Certify each part as CRITICAL, OPTIONAL, or JUNK for your mission. CRITICAL parts get repaired first if degraded. You share one goal: protect your assigned capacity."*

  #### **Phase 1: Initial Certification (15 min)**
  - **Task**: Discuss and assign certifications. No history/provenance revealed.  
  - **Rules**:  
    - CRITICAL: Essential for capacity ticket.  
    - OPTIONAL: Supports capacity but not vital.  
    - JUNK: Unrelated or harmful to capacity.  
  - **Student Goal**: Prioritize parts for repair with no context beyond current causality.  
    *Predictable Pitfall: Some Boards may prioritize "survival" over their ticket. Mitigate by circulating and reminding: "Station Command directs you to focus on your ticket—survival alone won't suffice."*

  #### **Reveal 1: Provenance & Revision (10 min)**
  - Give each Board their **Provenance Card** (legacy or assembled) and **Part History/Design Notes**:  
    | Part          | Legacy History (Selection History)                          | Assembled Design (Library Origin)                |  
    |---------------|-------------------------------------------------------------|--------------------------------------------------|  
    | Gas Bladder   | Selected for buoyancy in aquatic ancestors.                 | Added for O₂/CO₂ exchange; no buoyancy needed.   |  
    | Wing-Fins     | Selected for efficient gliding.                             | Copied from glider-library; slightly overengineered. |  
    | Flash Crest   | Selected for mate attraction; now maladaptive.              | Included for aesthetics; no functional purpose.  |  
    | Heat Vent     | By-product of metabolism; co-opted for thermoregulation.    | Added to prevent overheating from O₂ reactions.  |  
    | Root-Tendrils | Vestigial (ancestrally for nutrient absorption).            | Accidental inclusion; template error.            |  

  - **Task**: Boards may revise certifications. *Do not mention etiological/causal-role*.  
  - **Conflict Engine**:  
    - Legacy teams see parts with "past purposes" (e.g., Gas Bladder was for buoyancy, not O₂).  
    - Assembled teams see "arbitrary origins" (e.g., Flash Crest is decorative).  

  #### **Phase 2: Degradation & Repair (15 min)**
  - **Degradation Manifest**: All parts degrade (as per prepared list).  
  - **Repair Rules**:  
    - CRITICAL: Must repair (cost: 3 tokens).  
    - OPTIONAL: May repair (cost: 1 token).  
    - JUNK: No repair (cost: 0).  
  - **Scoring (Season 1)**:  
    - Organism survives if:  
      - Capacity ticket is sustained (e.g., O₂ production maintained if Gas Bladder functional).  
      - No "critical failure" (e.g., if Wing-Fins broken and OPTIONAL/JUNK, Skyeels kill Glidestalker).  
    - Points: +10 if organism survives, +5 if capacity maintained.  

  #### **Handover: Environment Shift & Revision (10 min)**
  - Reveal **New Environment Card** (caves).  
  - **Task**: Each Board may reclassify **one part** (e.g., Root-Tendrils become useful for anchoring on rocks).  
  - **Rules**: No token refunds—revisions apply to future repairs.  

  #### **Reveal 2: The Twin & Wager (5 min)**
  - Announce: *"Your Glidestalker has a physically identical twin of opposite provenance (legacy/assembled)."*  
  - **Wager**: Each Board bets 0–5 wager tokens: *"Will your certifications change once you see the twin's provenance?"*  
  - Reveal twin provenance and certifications. Boards adjust certifications if needed.  
  - **Wager Payout**: Double tokens if correct; lose if wrong.  

  #### **Final Scoring**  
  - **Season 2**: Same as Season 1, but in new environment (e.g., Flash Crest now useful for signaling in dark caves).  
  - **Total Points**: Survival (max 20) + Capacity (max 10) + Wager tokens.  

  ---

  ### **Debrief: From Activity to Philosophy (20 min)**  
  **Goal:** Show etiological and causal-role accounts answer *different questions*, and conflict persists even with shared facts.  

  #### **Step 1: Reconstruct Decisions (Student-Driven)**  
  - Ask each Board: *"Which part was hardest to certify? Why?"*  
    - *Expected answers*:  
      - "Gas Bladder: Critical for O₂, but legacy said it was for buoyancy."  
      - "Flash Crest: Junk for Predator Avoidance (attracts Skyeels), but legacy said it was for mating."  
  - **Synthesize**: *"You all agreed on what parts *do*, but disagreed on what they *should* do. Why?"*  

  #### **Step 2: Map Moments to Accounts (Guided)**  
  - Present two unnamed "lenses":  
    - **Lens A**: "What a part is *supposed* to do (based on its history)."  
    - **Lens B**: "What a part *currently does* for the system."  
  - **Connect**:  
    | Part          | Conflict Point                          | Lens A (Etiological)                      | Lens B (Causal-Role)                     |  
    |---------------|-----------------------------------------|-------------------------------------------|------------------------------------------|  
    | Gas Bladder   | Legacy Board downgraded after history.  | "Supposed to provide buoyancy."           | "Currently exchanges O₂—critical for us."|  
    | Flash Crest   | Assembled Board called it junk.         | "No design purpose—junk." (Assembled)     | "Attracts predators—junk."               |  
    | Root-Tendrils | Revised in handover for caves.          | "Vestigial; no historical function."      | "Now anchors in caves—critical!"         |  
  - **Highlight**: *"Lens A asks, 'Why is it here?' Lens B asks, 'What does it contribute now?'"*  

  #### **Step 3: Name the Accounts & Resolve Tension**  
  - Reveal terms: **Etiological** (Lens A) vs. **Causal-Role** (Lens B).  
  - **Key Insight**: *"This isn't two definitions of 'function'—it's two distinct questions. Etiological explains *why* a part exists (e.g., malfunction if it fails its selected role). Causal-role explains *how* a system works today (e.g., how oxygen flows)."*  
  - **Tension Survival**: Note how Boards with identical Glidestalkers but different tickets (e.g., Oxygen vs. Predator Avoidance) certified the same part oppositely—*even after learning provenance*.  

  #### **Step 4: Address the "So What?"**  
  - **Philosophical Payoff**:  
    - Etiological: Needed to explain *malfunction* (e.g., "Flash Crest isn’t broken—it’s doing what it was selected for, but the environment changed").  
    - Causal-Role: Needed for *engineering* (e.g., "We need O₂ now—who cares about history?").  
  - **Limit of Activity**: The budget/ticket frame subtly favors causal-role by imposing external goals. **Corrective**:  
    - *"In biology, etiological functions are the organism's 'goals' (survival/reproduction), not the station's. A 'malfunction' exists even without engineers—e.g., a vestigial eye in cave fish."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"Function = Usefulness-to-Us"**:  
     - Students may reduce function to their ticket (e.g., "Junk if not for O₂").  
     - **Mitigation**: In debrief, contrast station goals with natural selection's "goals." Ask: *"Would the Flash Crest be functional in a Skyeel-free forest?"*  

  2. **Ignoring Capacity Ticket**:  
     - A Board may certify for survival, not their ticket (e.g., fix Wing-Fins for all).  
     - **Mitigation**: Penalize in scoring (e.g., "O₂ not maintained: -5 points").  

  3. **"It's Obviously Both"**:  
     - A student insists both accounts are needed.  
     - **Leverage**: Agree—then show conflict: *"Should we repair the Gas Bladder if it exchanges O₂ but was selected for buoyancy? What if funds are limited?"*  

  4. **Time Crunch**:  
     - Skip wagers or limit revisions. Prioritize Phase 1 and debrief.  

  **Unreproducible Element**: The activity cannot fully capture **normativity** (e.g., how etiological functions ground "should" statements). **Supply this in debrief**: *"Etiological functions are normative—a heart *should* pump blood. Causal-role is descriptive—it *does* pump blood. This normativity shapes how we define disease or design."*  

  ---

  ### **Why This Works**  
  - **Conflict First**: Students experience the tension *before* labeling it.  
  - **Tangible Stakes**: Tokens and scoring force choices.  
  - **Controlled Comparisons**: Same organism under different tickets + same ticket over legacy/assembled twins isolates variables.  
  - **Debrief Scaffolding**: Uses student experiences to build the philosophical framework.  

  This design ensures students leave seeing the accounts as tools for different jobs—not just semantic quibbles. Run it as-is, and let the boards wrestle with the Glidestalker’s gas bladder!
