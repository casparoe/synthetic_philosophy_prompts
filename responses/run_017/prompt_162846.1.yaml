  ### Theory Scoring  
  **Conditional analysis with normality riders**: Fails non-negotiable requirements: non-preservation (fuses), probabilistic dispositions, basis-grounded (mimics), extrinsic/plural dispositions, and disjunctive stimuli. Normality riders smuggle dispositionality, violating purpose. Only handles finks/masks weakly. Not fit for special sciences.  

  **Causal basis view**: Satisfies all non-negotiables: non-preservation (basis can be destroyed), probabilities (basis can be probabilistic), mimics (requires basis), disjunctive stimuli (basis can have multiple triggers), extrinsic/plural dispositions (basis can be relational), finks/masks (basis persists through interference), and degrees (basis strength varies). Struggles only with unstimulated shatterers, but this is negotiable. Ideal for purpose: usable without fundamental metaphysics.  

  **Everything-is-powers view**: Satisfies all non-negotiables, including unstimulated shatterers (powers can manifest spontaneously). However, requires fundamental metaphysics ("all properties are powers"), violating purpose. Circular if powers are primitive, but special sciences can use it pragmatically. Overkill for applied contexts.  

