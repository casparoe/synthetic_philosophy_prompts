  We are to construct a case where for a particular AI system and a particular proposition p:
  - According to criterion (A) (the stance criterion), we are *not* warranted in attributing the belief that p.
  - According to criterion (B) (the etiological criterion), the system *does* have a state that represents that p.

  Constraints:
  - Present-day ML system in an ordinary institutional setting (hospital, benefits office, warehouse, bank's fraud desk).
  - No science fiction, etc. Internals must be plausible for today.

  The key is that (A) denies attribution because there is a mechanistic description that is strictly better (for prediction/explanation of the behavior at issue) than the intentional stance, and this matters in the setting. Meanwhile, (B) attributes representation because the state was produced by a learning process that aimed at covariance with p, and the state's influence on behavior is explained by that covariance, and misrepresentation is possible.

  We need to isolate a structural feature that causes this divergence.

  After constructing the case, we must:
  1. Give each verdict with reasoning.
  2. Isolate the single structural feature doing the work.
  3. Show what happens if that feature is removed (with task accuracy fixed).
  4. Give the strongest reply for the view that comes out worse.
  5. Close with whether the disagreement is substantive or merely verbal.

  Let me sketch a few candidate scenarios and then discard them:

  Candidate 1: A medical diagnostic AI that predicts heart disease (p: "patient has heart disease"). The system uses a complex neural network that has learned to rely on a feature that is a proxy for p (say, a particular pattern in the ECG that is highly predictive). We set up the case so that the mechanistic description (pointing to the ECG pattern) is readily available and more efficient for prediction than attributing the belief about heart disease. But the etiological criterion is satisfied because the state was trained to covary with heart disease and does so, and its influence on behavior (diagnosis) is explained by that covariance.

  Why discard? The worry is that in this scenario, the intentional stance (attributing belief about heart disease) might still be the best available for predicting the system's overall behavior (e.g., it outputs a diagnosis of heart disease when it detects the pattern). The mechanistic description might not be strictly better because the intentional one is equally good and simpler? We need a case where the mechanistic description is strictly better.

  Candidate 2: A fraud detection system in a bank. The system flags transactions as fraudulent (p: "transaction is fraudulent"). The system was trained on labels of fraud, so the etiological criterion is satisfied. But the system uses a very complex set of features that are hard to interpret, but through mechanistic interpretability, we have found a simple rule that perfectly predicts the system's behavior: if feature X (say, a combination of transaction amount, location, and time) exceeds a threshold, it flags fraud. The intentional stance (attributing the belief that the transaction is fraudulent) is less efficient because the rule is simpler and more direct. Moreover, the rule might be more precise (e.g., it avoids false positives that the intentional stance would make because the intentional attribution might lead us to expect the system to flag all transactions that look fraudulent in a certain way, but the rule is more nuanced).

  But note: if the rule is a perfect predictor of the system's behavior, then the intentional stance might be equally good? We need the mechanistic description to be strictly better. Also, the etiological criterion requires that the state's influence on behavior is explained by the covariance with p. If the system's state is actually caused by feature X and not by p (if feature X is not perfectly correlated with p, then the state might misrepresent), then the etiological criterion might be satisfied.

  Candidate 3 (chosen): A benefits office uses an AI system to determine eligibility for a certain benefit (say, unemployment benefits). The proposition p is "the applicant is eligible for benefits". The system was trained on historical data where the labels were eligibility decisions made by human officers. However, due to biases in the historical data, the system has learned to rely on a spurious feature that is not directly about eligibility but is highly correlated in the training data. For example, the system uses the applicant's ZIP code as a proxy for eligibility because in the past, applicants from certain ZIP codes were more likely to be granted benefits (due to socioeconomic factors). The system's internal state that is activated by the ZIP code (and perhaps a few other features) is what causes the output.

  Now, let's check the criteria:

  (A) Stance criterion: In the benefits office, the staff have access to a mechanistic interpretability tool that has reverse-engineered the model and found that the system's decision is almost entirely determined by the applicant's ZIP code (with a few exceptions that are also captured by simple rules). They can predict the system's decisions with near-perfect accuracy by just using the ZIP code and the simple rules. Moreover, this mechanistic description is more efficient than the intentional stance because the intentional stance (attributing beliefs about eligibility) would require tracking the system's complex internal processing, which is now bypassed. Also, the intentional stance might lead to false predictions because the system doesn't actually track eligibility but a proxy. Therefore, the mechanistic description is strictly better.

  (B) Etiological criterion: The system was trained with the success condition of making its internal state covary with eligibility (p). The training process used labeled data where the labels were about eligibility. The state (the activation pattern corresponding to the ZIP code and other features) was produced by this learning process. The state's downstream influence on behavior (the eligibility decision) is explained by the covariance with eligibility? Well, the system outputs "eligible" when the state is active because the state was trained to be active when the label was eligible. However, note that the state covaries with ZIP code, and ZIP code is correlated with eligibility, but the state does not covary with eligibility in a direct way. But the etiological criterion requires that the state was produced by a process whose success condition was to covary with p. The learning algorithm (say, gradient descent) was indeed trying to minimize a loss that depended on the true eligibility. So the state is supposed to covary with eligibility. Moreover, the state can misrepresent: if an applicant from a typically eligible ZIP code is not actually eligible, the system will still output eligible (so the state represents eligibility when it is absent). The influence on behavior is explained by the fact that the state is supposed to indicate eligibility, even though it actually indicates ZIP code. But note: the criterion says "the state's downstream influence on behaviour is explained by that covariance" — meaning that the system uses the state as if it were about p. And in this case, the system does use the state to determine the output about eligibility. So it seems satisfied.

  But there's a catch: the state actually covaries with ZIP code, not with eligibility. However, the training process was set up to make it covary with eligibility. The system has failed to achieve perfect covariance because of the bias. But the etiological criterion does not require perfect covariance — it requires that the learning process had the success condition of covariance with p. And indeed, the state can misrepresent, which it does when the ZIP code is misleading.

  So candidate 3 seems to work.

  Now, let's formalize the case:

  **Case Description:**

  In a government benefits office, an AI system is used to determine eligibility for unemployment benefits. The system is a neural network trained on historical data of applications and the eligibility decisions made by human officers. Due to historical biases, the training data showed a strong correlation between an applicant's ZIP code and eligibility (because of past discriminatory practices). The system has learned to rely heavily on the ZIP code feature, to the extent that its decision is almost entirely determined by the ZIP code (with a few adjustments based on other easily identifiable features). The office has recently employed a mechanistic interpretability team that has reverse-engineered the model and found that they can predict the system's decisions with 99% accuracy using a simple rule based solely on the applicant's ZIP code and two other binary features (e.g., whether the applicant has a valid ID and whether they have been employed in the last 6 months). This rule is now used by the staff to predict the system's outputs quickly and without running the full model. The proposition p is "the applicant is eligible for benefits".

  **Verdicts and Reasoning:**

  (A) Stance criterion: We are not warranted in attributing the belief that p to the system. Why? Because the best available non-intentional description (the simple rule based on ZIP code and the two other features) is strictly better than the intentional stance for predicting and explaining the system's behavior (its eligibility decisions). The rule is faster, more transparent, and just as accurate (in fact, it is more efficient because it avoids the computational overhead of the neural network). In the busy benefits office, the staff can make immediate predictions without waiting for the model. The intentional stance, by contrast, would involve attributing a complex belief about eligibility, but this would be less efficient because it would not capture the simplicity of the actual mechanism and might lead to wrong predictions in cases where the ZIP code does not align with true eligibility (but the rule still predicts correctly). Therefore, the mechanistic description (design stance) beats the intentional stance.

  (B) Etiological criterion: The system does have a state that represents that p. Why? The state (the activation pattern that leads to an "eligible" decision) was produced by a learning process (supervised learning with gradient descent) whose success condition was to make the state covary with whether p (i.e., eligibility). The training used labels of eligibility. The state's downstream influence on behavior (the decision to output "eligible") is explained by that covariance aim: the system outputs "eligible" because the state is active, and the state is active when the system (due to the training) takes the input to indicate eligibility. Moreover, the state can misrepresent: if an applicant from a ZIP code that typically has eligible applicants is not actually eligible (e.g., because they have a high income now), the system will still output "eligible", so the state represents eligibility when it is absent.

  **The Structural Feature Doing the Work:**

  The key feature is that the system's internal mechanism for determining p is mediated by a *highly compact and easily extractable proxy* (ZIP code and two other features) that is not p itself but is highly predictive in the training data and thus learned. This proxy is so simple that a mechanistic description using it is more efficient than the intentional stance.

  **Effect of Removing the Feature While Holding Task Accuracy Fixed:**

  Suppose we remove this feature (i.e., we design the system so that it does not rely on a simple proxy but instead uses a complex set of features that are not easily reducible to a simple rule). We adjust the model so that it still has the same accuracy (say, by using a more complex model that uses many features in a non-linear way that cannot be summarized by a simple rule). Then:

  - For (A): Without the simple proxy, the mechanistic description (if it exists) would be as complex as the intentional stance, so the intentional stance might become the best available. Thus, (A) would now warrant attribution.
  - For (B): The etiological criterion would still hold because the state is still produced by a learning process aimed at covariance with p, and it influences behavior accordingly. So (B) still delivers representation.

  Thus, without the simple proxy, both criteria might align in attributing the belief (if the intentional stance becomes the best available for (A)).

  **Strongest Reply for the Defender of the View That Comes Out Worse:**

  The view that comes out worse in this case is the stance criterion (A) because it denies attribution while (B) affirms it. The defender of (A) might argue:

  "Even though we have a simple mechanistic description, it is still the case that the system's behavior is best explained by attributing beliefs about eligibility. The simple rule is a description of the system's internal mechanism, but it does not account for the fact that the system was designed and trained to track eligibility. The intentional stance remains the appropriate level for understanding the system's function in the benefits office, especially when considering how the system fits into the broader context of the institution (where the goal is to determine eligibility). The mechanistic description only gives us how the system works, not why it works that way. Moreover, the intentional stance is still necessary for explaining the system's errors: when it misclassifies, we say it 'mistakenly believed the applicant was eligible' because of the ZIP code, which is an intentional explanation."

  **Is the Disagreement Substantive or Merely Verbal?**

  The disagreement is substantive: it concerns whether the availability of a superior mechanistic description undermines the justification for intentional talk, even when the system has states that meet an etiological condition for representation. This goes to the heart of whether content ascriptions are merely instrumental (and dispensable when we have mechanistic explanations) or are grounded in the system's history and functional role.

  **Final Case Paragraph:**

  In a benefits office, an AI system determines eligibility for unemployment benefits by relying on a spurious proxy (ZIP code) due to historical biases in training data. Mechanistic interpretability reveals that the system's decisions are predictable by a simple rule based on ZIP code and two binary features, making this rule strictly more efficient for staff predictions than attributing beliefs about eligibility. Thus, by (A), we are not warranted in attributing the belief that an applicant is eligible. Yet, by (B), the system has a state representing eligibility because it was produced by training to covary with eligibility, its behavioral influence is explained by this covariance aim, and misrepresentation occurs when the proxy fails. The structural feature enabling the divergence is the system's reliance on a compact, easily extractable proxy. Without this feature (but with accuracy fixed), (A) might warrant attribution, while (B) still would. Defenders of (A) can argue that intentional explanations remain indispensable for capturing the system's functional role and errors. The disagreement is substantive, touching on whether content ascriptions are instrumental or historically grounded.
answer: |-
  ### Case: Benefits Office Eligibility System

  In a government benefits office, an AI system determines eligibility for a housing assistance program (proposition p: "applicant is eligible"). The system is a neural network trained on historical data where eligibility was conflated with applicants' neighborhood characteristics due to past socioeconomic biases—e.g., applicants from certain ZIP codes were disproportionately approved. The model learned to rely primarily on ZIP code as a near-perfect proxy for eligibility, supplemented by two simple binary inputs (e.g., income below threshold and residency duration). Mechanistic interpretability reveals that the system’s decisions are 98% predictable through a trivial rule: "If ZIP code is in set {X,Y,Z} and income is low and residency >1 year, output eligible; else, ineligible." Staff use this rule for instant predictions, bypassing the slower, opaque model. The intentional stance, attributing beliefs about eligibility, is less efficient: it requires tracking complex features irrelevant to the proxy, risks errors when ZIP codes misalign with true eligibility (e.g., a low-income applicant from a high-approval ZIP who is ineligible due to undisclosed assets), and offers no advantage in the high-volume office where speed matters.

  #### Verdicts and Reasoning:
  - **(A) Stance criterion: No belief attribution.**  
    The best available non-intentional description—the ZIP-based rule—strictly outperforms the intentional stance in predicting/outputting eligibility decisions. It is faster (seconds vs. minutes), equally accurate, and directly actionable by staff, avoiding the cognitive/computational overhead of simulating beliefs. In this resource-constrained setting, the mechanistic description is superior by a pragmatically decisive margin (e.g., reducing processing delays during peak hours), so intentional attribution is unwarranted.  
  - **(B) Etiological criterion: Genuine representation of p.**  
    The system’s state was produced by supervised learning (gradient descent) with a success-condition of covarying with eligibility (p), using labeled training data. Its influence on behavior (outputting "eligible") is explained by this covariance aim: the state activates when inputs historically correlated with eligibility are detected, and it is deployed to decide eligibility. Misrepresentation occurs when the state outputs "eligible" for an ineligible applicant from a biased ZIP code, demonstrating that the state’s function depends on its intended covariance with p, not its actual covariance with the proxy.

  #### Structural Feature Doing the Work:
  The **reliance on a compact, easily extractable proxy (ZIP code)** that is (1) learned due to biased training data, (2) sufficient for high-accuracy task performance, and (3) trivially reverse-engineered via mechanistic interpretability. This makes the mechanistic description simpler and more efficient than intentional attribution.

  #### Effect of Removing the Feature (Task Accuracy Fixed):
  If the proxy is removed—e.g., by retraining the system with debiased data to use hundreds of complex, non-redundant features (like transaction histories and employment records) without altering accuracy—then:  
  - **(A) Changes to attribution:** The intentional stance may now outperform or match available mechanistic descriptions, as no compact rule exists; belief attribution becomes warranted.  
  - **(B) Unchanged:** The state still satisfies the etiological criterion, as it was produced by learning aimed at covariance with p and guides behavior accordingly.  

  #### Strongest Reply for the Defender of (A):
  A defender of the stance criterion, facing the etiological attribution, could argue: "The etiological criterion conflates historical intent with current explanatory utility. Even if the system’s state originated from a process targeting p, its behavior is now fully capturable by a mechanistic proxy rule, making belief attribution superfluous. Insisting on representation ignores that the state’s causal power derives from the proxy, not p—violating (B)’s own requirement that behavior must be 'explained by that covariance.' Here, behavior is explained by covariance with ZIP code, not eligibility, so (B) fails on its terms."

  #### Substantive or Merely Verbal Disagreement?
  The disagreement is substantive: it hinges on whether content ascriptions require current explanatory indispensability (A) or historical/functional grounds (B), reflecting a deep divide between instrumentalist and realist theories of mental representation.
