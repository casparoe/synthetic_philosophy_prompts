     - The groups are told that they will see the first 4 bits of a sequence that we draw from the bag. Then they have to place a bet on the 5th bit. They can bet any integer number of tokens (up to their 10) on either 0 or 1. They cannot split (to keep it simple). Then we reveal the entire sequence (so the 5th bit). If they bet on the correct outcome, they get double their bet (so they gain the bet amount). If wrong, they lose the bet.

