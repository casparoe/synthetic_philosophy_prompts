  We are going to design an activity that meets the constraints and goals. The core idea is to use a small, finite set of possible worlds (sequences of binary outcomes) of length 5. There will be 2^5 = 32 possible sequences. We will have students work in pairs or triples.

  The activity will have the following phases:

  1. Introduction (2 minutes): Frame the activity without giving away the philosophical points. Say something like: "Today we're going to explore how we make predictions from data. You'll be given a set of possible worlds and will design prediction rules. Then we'll see how well your rules perform."

  2. Activity Part 1: Design a prediction rule (10 minutes)
     - Each group gets a handout with all 32 possible sequences (each sequence is 5 bits, e.g., 00000, 00001, ..., 11111). They are told that each sequence is a complete history of a world of 5 days (each day is 0 or 1).
     - The task: Design a prediction rule that, given the first 4 days, predicts the 5th day. They can choose any rule they like. Examples: "always predict 0", "predict the majority of the first 4", "predict the same as the 4th", etc.

  3. Activity Part 2: Construct the anti-prediction rule (5 minutes)
     - For their own prediction rule, they must construct the "anti-rule": whatever their rule would predict, the anti-rule predicts the opposite.

  4. Activity Part 3: Score both rules over all worlds (10 minutes)
     - Each group will compute the success rate of their rule and their anti-rule over all 32 sequences.
     - How: For each sequence, take the first 4 days and apply the rule to predict the 5th. Compare to the actual 5th. Then do the same for the anti-rule. Count the number of correct predictions for each rule.
     - They will see that both rules get exactly the same number of correct predictions: 16 out of 32 (because each rule is correct in exactly half the worlds and wrong in the other half, by symmetry). Note: This is true only if the rule is deterministic and the anti-rule is its exact opposite. Also, because the uniform distribution is symmetric.

  5. Activity Part 4: Betting on a random world (15 minutes)
     - Now we introduce a prior. Without showing the students, we have a bag (or hat) with 32 slips of paper, each with one sequence. But we are going to weight the bag: we will put more copies of "simple" sequences (like all zeros, all ones, or alternating) and fewer of "complex" ones (like 00110). The exact distribution is not uniform. We don't tell the students the distribution, but we tell them that we have a bag of sequences that we drew from a distribution that we won't reveal until the end.
