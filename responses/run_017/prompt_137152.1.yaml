prompt: |-
  You're an expert in existential risk and population ethics, so please think carefully rather than pattern-matching to the usual takes. Start with some brainstorming: what are three or four decision rules a funder could be running that would fit every verdict below? Only then commit to a prediction.

  I sit on the grants committee of a longtermist foundation and we've got a weird one. Our track record: we funded technical AI safety work; we funded a biosecurity surveillance project; we funded a small nuclear risk-reduction grant even though the modelled risk reduction was tiny; we rejected cash transfers to the global poor despite the evidence being rock solid; we rejected a campaign to change farming practises even though the pitch was that todays norms lock in values for centuries; we funded a civilisational resilience project — backup food and industrial capacity so recovery after a catastrophe is fast — and the memo argued recovery speed matters because a stalled recovery loses you most of the future's value; and we rejected a very speculative space governance grant because nobody could even roughly estimate its effects.

  The new proposal: a permanently isolated, deliberately low-tech, self-sufficient settlement of a few hundred people with a stored genome, seed and knowledge archive, whose founding charter bans industrial technology so the settlement can't repeat whatever caused the collapse. It's cheap relative to our budget. It looks like it cuts the probability of human extinction from something like one in six to near zero — but conditional on ever being used, the future it produces is small, poor and basically stuck pre-industrially for thousands of years, and some of us worry that the mere existence of a refuge makes governments less careful about the risks in the first place.

  So: what should we decide if we want to be consistent with ourselves, which precedent is the closest analogue, which candidate rules fit our record and which of them come apart on this case, and what one cheap variation on the proposal would tell us which rule we're actually running? Also, does your answer turn on whether that small, stuck future is net positive at all?
reasoning: |-
  Okay, the user is part of a grants committee for a longtermist foundation, and they're trying to figure out whether to fund a proposal for a permanent, low-tech, isolated settlement designed to survive a global catastrophe. They've provided their past decisions on various grants, and they want to be consistent with their previous choices. 

  First, I need to understand their track record. They funded technical AI safety, biosecurity surveillance, a small nuclear risk-reduction grant, and a civilizational resilience project. But they rejected cash transfers, changing farming practices, and a speculative space governance grant. The key seems to be that they prioritize measurable, near-term risk reduction for existential threats, especially when the effects are tangible and not too speculative.

  Now, the new proposal is a low-tech refuge that could reduce extinction risk significantly but might lead to a future that's small and stuck in a pre-industrial state. The user is concerned about moral hazard and whether this future would even be net positive. They want to know which decision rule they've been following based on past choices and how to test it.

  Hmm, the user is likely looking for deep consistency in their decision-making framework. They might be worried about ad-hoc decisions and want a principled approach. Their deeper need could be establishing a clear, defensible philosophy for funding that aligns with longtermist values without internal contradictions.

  Looking at the precedents, the civilizational resilience project is the closest. Both involve boosting recovery chances after a collapse. But the refuge proposal is more extreme—ensuring survival at the cost of a diminished future. The rejected space governance grant was too speculative, whereas this one has a clearer, though still debatable, risk reduction.

  The user also asks if the net positivity of the stuck future matters. If they're pure longtermists, it might not, as long as the future exists. But if they're more pluralist, the quality matters. Their past rejections (like cash transfers) suggest they don't prioritize near-term welfare, so net positivity might not be crucial here.

  The cheap test—adding an exfiltration clause—is smart. If they reject the modified proposal, they're likely following the Value Preservation Rule. If they accept, it's the Continuity Rule. This test reveals their true priorities: survival at any cost versus preserving potential for a flourishing future.

  The user's underlying concern might be about inadvertently endorsing a suboptimal future or creating moral hazard. They need clarity on their foundation's core values to avoid hypocrisy. By identifying their decision rule, they can make transparent, consistent choices moving forward.
answer: |-
  Here's a systematic breakdown of your committee's decision logic, candidate rules, and how to test them:

  **Brainstorming: Candidate Decision Rules**
  1.  **Continuity Rule:** Prioritize interventions that maximize the *probability* of *any* future (human-originating) sentience existing, regardless of its scale or quality, provided the cost-per-unit-probability is sufficiently low. Near-term welfare is irrelevant unless it directly impacts continuity.
  2.  **Value Preservation Rule:** Prioritize interventions that maximize the *expected quality* of the long-term future (e.g., total flourishing, potential, scope). This requires preserving the *capacity* for a flourishing, expansive future, not just bare survival. Highly diminished futures have low value.
  3.  **Robustness Rule:** Prioritize interventions that reduce the *overall variance* in the long-term future outcome distribution. This favors reducing tail risks (extinction) *and* boosting recovery/positive tail outcomes, while being skeptical of actions that might *increase* variance (like moral hazard).
  4.  **Tractability/Measurability Rule:** Prioritize interventions where the causal pathway to significant risk reduction or value preservation is clear, direct, and *quantifiable* (even if small), rejecting those relying on complex chains or unmeasurable effects. Near-term welfare is a distraction.

  **Fitting Your Track Record:**

  *   **Funded:**
      *   *Tech AI Safety*: Fits **1, 2, 3, 4.** Reduces a major extinction risk (Continuity, Value Pres, Robustness). Often has quantifiable models (Tractability).
      *   *Biosecurity Surveillance*: Fits **1, 2, 3, 4.** Directly reduces a major extinction risk pathway (Continuity, Value Pres, Robustness). Effects are somewhat measurable (Tractability).
      *   *Small Nuclear Risk Grant*: Fits **1, 3, 4.** Explicitly funded despite tiny modeled reduction – highlights focus on *probability* (Continuity) and measurable impact (Tractability), even if small. Less strong for Value Pres (tiny effect).
      *   *Civilizational Resilience*: Fits **2, 3.** Explicitly argued for preserving *value* (recovery speed = more potential) (Value Preservation) and reducing the variance of outcomes (Robustness). Less strong for Continuity (doesn't change initial survival prob) or Tractability (effects harder to quantify than nuclear risk).
  *   **Rejected:**
      *   *Cash Transfers*: Fits **1, 2, 3, 4.** Near-term welfare irrelevant to Continuity/Value Pres/Robustness unless proven to significantly alter long-term trajectories (which evidence doesn't support). Effects on existential risk are indirect/unmeasurable (Tractability).
      *   *Farming Values Campaign*: Fits **4 (strongest), 2, 3.** Causal chain to long-term value lock-in is highly speculative and unmeasurable (Tractability). Effect on *expected* value is unclear (Value Pres, Robustness). Continuity largely unaffected.
      *   *Speculative Space Governance*: Fits **4 (strongest), 2, 3.** Effects completely unquantifiable and speculative (Tractability). Uncertain impact on Value Pres/Robustness.

  **Analysis of the Refuge Proposal:**

  *   **Continuity Rule (1):** **Fund.** Dramatically increases probability of *some* future existing (~1/6 to near-zero). Cost-per-unit-probability is excellent. The quality/size of the future is irrelevant. Moral hazard is a secondary concern unless proven *highly* likely to *increase* net extinction risk.
  *   **Value Preservation Rule (2):** **Reject.** While ensuring *some* future, it locks in a small, impoverished, stagnant future with minimal value potential. The "lost" flourishing future (if extinction was avoided without the refuge) represents a massive loss of *expected value*. Moral hazard reinforces this by making the *better* future less likely.
  *   **Robustness Rule (3):** **Leans Reject?** It reduces the worst-tail risk (extinction) but *creates* a new, very bad tail outcome (the "stuck" future). Moral hazard *increases* the probability of other bad outcomes (catastrophes). Net effect on overall variance is ambiguous. The committee might be skeptical.
  *   **Tractability/Measurability Rule (4):** **Leans Fund?** The core effect (physical survival of a group) is direct and measurable. Moral hazard is harder to quantify. Compared to the rejected *Space Governance* grant, this has a much clearer, less speculative core mechanism. Similar to *Nuclear Risk* grant – small but quantifiable effect funded.

  **Closest Precedent:** The **Civilizational Resilience Project** is the closest analogue. Both aim to improve outcomes *after* a catastrophe:
      *   *Resilience Project:* Focused on *speeding up recovery* to preserve more potential value (aligned with Value Pres/Robustness).
      *   *Refuge Proposal:* Focused on *ensuring survival at all*, at the cost of *permanently limiting* future potential (Continuity vs. Value Pres).

  **Where Rules Come Apart:** This proposal is the **crucial test case** distinguishing:
      *   **Continuity (Fund)** vs. **Value Preservation (Reject)**: This is the core tension. Is the *existence* of *any* future paramount, or is the *quality* and *scale* of that future the priority?
      *   **Tractability (Likely Fund)** vs. **Value Preservation (Reject)**: The refuge has a tractable core mechanism (like Nuclear Risk), but Value Preservation overrules this due to the outcome's low value.

  **The Cheap Diagnostic Test: Add an "Exfiltration Clause"**

  *   **Propose a variation:** Fund the refuge, but *require* that its charter includes a mechanism (e.g., a timed vault, designated external trigger) to release its inhabitants/knowledge/technology to reintegrate with or catalyze a recovering *mainstream* civilization after a significant period (e.g., 200 years), *if* such a civilization is detected. This breaks the "permanently stuck" condition.
  *   **What it Tells You:**
      *   If you **FUND the variation:** You're running **Value Preservation Rule (2)** or **Robustness Rule (3)**. You value survival *only if* it eventually leads back to a flourishing future. The "stuck" outcome was the blocker.
      *   If you **REJECT the variation (or only fund the original):** You're running the **Continuity Rule (1)**. Mere survival is sufficient; the potential for future flourishing is secondary or irrelevant to the core decision. The "stuck" outcome is acceptable, perhaps even desirable as it guarantees stability.
      *   (Tractability Rule is less diagnostic here; both versions are similarly tractable/measurable).

  **Does Net Positivity of the Stuck Future Matter?**

  *   **For Continuity Rule (1): No.** Existence itself is the sole good. Even a net-negative future (e.g., constant suffering) would be funded if it reliably increased the probability of *any* future existing over extinction. (This is a feature of strong "person-affecting" or minimal "astronomical waste" views).
  *   **For Value Preservation Rule (2): Yes, critically.** A net-negative future is *worse* than extinction. A net-positive but extremely impoverished future has vastly lower value than a flourishing one. The refuge is only good if it leads to a future *comparable* in potential value to what would exist without extinction *or* if the extinction risk reduction is so massive it outweighs the value loss – unlikely given the refuge's description.
  *   **For Robustness Rule (3): Yes.** Creating a guaranteed net-negative future tail would be disastrous, increasing overall negative variance. A net-positive but poor future is still a bad tail outcome compared to potential good tails.
  *   **For Tractability Rule (4): No.** The moral value of the outcome isn't part of the tractability assessment.

  **Prediction:**

  Based on your consistent pattern of valuing *potential for flourishing* (Civilizational Resilience, rejecting Farming Values) alongside measurable risk reduction (Nuclear Risk, rejecting Space Governance), while dismissing pure near-term welfare (Cash Transfers), the strongest fit is the **Value Preservation Rule (2)**.

  *   **Therefore:** You should **REJECT the refuge proposal as-is.** The prospect of locking in a permanently diminished future represents a catastrophic loss of potential value, outweighing the extinction risk reduction. Moral hazard exacerbates this by making the *better* future less likely.
  *   **Diagnostic Confirmation:** If you **FUND the variation with the "Exfiltration Clause"**, it strongly confirms Value Preservation is your core driver. If you reject even the variation, it suggests Continuity dominates, which would be inconsistent with your Civilizational Resilience funding justification.
