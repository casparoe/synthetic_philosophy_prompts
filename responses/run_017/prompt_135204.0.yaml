prompt: |-
  I teach philosophy at a small liberal arts college, and next month I'm giving a twenty-five-minute invited talk with ten minutes of discussion at a one-day workshop on explanation in the cognitive and biological sciences. Nobody in my own department works on explanation, so I've been rehearsing at a whiteboard and I have no real sense of what will get thrown at me. The talk is titled "Cranes with Borrowed Footings," and the thesis is this: the methodological pair we all inherited from Dennett — shun skyhooks, shun greedy reductionism — misses the failure mode that does the most damage in ordinary scientific practice. The failure mode I have in mind is an explanation that has the complete surface profile of a crane: stepwise, level-respecting, resting on machinery rather than on a miracle, with no explanatory levels skipped and no appeal to anything spooky — but whose bottom rung quietly re-imports the very phenomenon being explained, dressed in a more respectable vocabulary. My examples are representational explanations of cognition where "representation" turns out to be cashed out by appeal to what an interpreter would take the system to be about; selectional explanations where "selection for" is doing work that a causal story about replication and differential retention should be doing; "internalization" explanations of norm-responsiveness; and "information-processing" explanations of development. The diagnostic I propose is a footing test: take the lowest rung of the crane and try to redescribe it entirely in the vocabulary of the level beneath it; if the redescription fails, or merely relocates the same semantic notion one level down, the footing is borrowed. I want to claim that this is not a greedy demand to skip levels but an anti-skyhook demand to finish the descent, though I'm not confident that distinction will survive contact with an audience.

  The room will be: two Dennett-trained philosophers of mind who use the crane/skyhook pair constantly and consider themselves deflationists about content; one senior philosopher of science of the new mechanist stripe (mechanisms as organized entities and activities, constitutive relevance, how-possibly versus how-actually); one philosopher of biology who defends adaptationist explanation and talks cheerfully about genes as carrying information; one enactivist who holds that representation talk is itself the skyhook and that I haven't gone nearly far enough; and a handful of graduate students who will want to know how to run the test on their own material. I'd like a Q&A prep sheet: the six or eight objections I will actually get, ordered by how much damage they'd do, each phrased the way that person would phrase it, with a roughly two-minute reply and a note on where the reply is soft. Please also tell me what I should concede in the first two slides before anyone has to ask, which single reply has to land for the talk to have a point, and the objection I'm hoping nobody raises — my own guess is that it involves whether the footing test can distinguish a placeholder from a theoretical posit with deferred cash value, or whether it collapses into the very thing I'm criticizing, but I'd rather hear your candidate than have me supply it. Where I am genuinely unsure: whether my test condemns too much, since a great deal of working biology would fail it, or too little, since a borrowed footing can be refinanced later and my test may only be detecting present arrears rather than bankruptcy. Please write in American English, and keep the whole prep sheet under 800 words.
reasoning: |-
  Okay, the user is a philosophy professor preparing for a talk on explanation in cognitive and biological sciences. Their thesis critiques Dennett's crane/skyhook dichotomy by introducing "borrowed footings"—explanations that seem stepwise but sneakily reintroduce the explanandum at the bottom level. They need a Q&A prep sheet anticipating key objections. 

  First, I need to map the audience: Dennett loyalists, mechanists, adaptationists, enactivists, and grad students. Each will attack differently. The Dennettians might see this as greedy reductionism; the mechanist will demand operationalization; the adaptationist won't sweat semantic slippage. 

  The user's deepest worry is whether their "footing test" is overzealous (condemning functional biology) or toothless (missing deferred explanations). But the silent killer? If the test itself commits the same sin—using semantic notions to diagnose semantic smuggling. That’s the objection they dread but didn’t name. 

  For concessions: upfront admit that borrowed footings aren’t always bad—they’re placeholders. The make-or-break reply is distinguishing anti-skyhook demands from greedy reduction: finishing descent ≠ skipping levels. If that doesn’t land, the talk implodes. 

  Prioritizing objections: 
  1. The mechanist’s "how is this not just constitutive relevance?" is top threat—it reframes their whole thesis as redundant. Reply: constitutive relevance doesn’t catch semantic circularity. Soft spot: mechanists might shrug. 
  2. Dennettians crying "greedy reductionism!" comes next. Reply: borrowed footings are counterfeit cranes, not incomplete ones. Risky because they might see it as semantic policing. 
  3. The adaptationist’s "so what if ‘information’ is semantic?" is easiest—concede utility but flag when it hides work. 

  Grad students need practical how-tos; enactivists will say they didn’t go far enough. The latter is low-threat—agree and move on. 

  Final prep: user must stress this targets *explanatory legitimacy*, not heuristic value. And pray nobody asks if the footing test borrows its own footing…
answer: |-
  Here’s your Q&A prep sheet, ordered by damage potential (high to low), with replies and concessions:

  ---

  ### **Preemptive Concessions (First 2 Slides)**
  1.  **"Borrowed footings aren’t always useless."** They can be productive placeholders, heuristics, or modeling tools. The critique targets *explanatory legitimacy*, not provisional use.
  2.  **"The test flags a problem, not a death sentence."** A footing can be "refinanced" later (e.g., via new mechanisms). The test diagnoses *current* explanatory debt, not inherent bankruptcy.

  ---

  ### **Objections & Replies**
  1.  **New Mechanist: "This just restates the need for constitutive relevance! If a 'rung' can't be described in lower-level vocabulary, it's *not* the bottom rung. Your 'test' is redundant with good mechanistic explanation."**  
      *Reply:* "Constitutive relevance ensures components are *there*, but not that they *explain* without semantic smuggling. My test targets *how* a lower-level component is characterized—e.g., calling a gene an 'information carrier' sneakily reimports intentionality. Mechanists might miss this semantic hitch."  
      *Soft Spot:* If mechanists define "constitutive relevance" broadly enough to exclude semantic properties, your distinction collapses.

  2.  **Dennettian #1: "You’re demanding greedy reductionism! Skipping levels is bad, but forbidding *any* higher-level vocabulary at the bottom is worse. Cranes need solid ground, not quicksand—but the ground can be higher-level."**  
      *Reply:* "No—I demand *no skipped levels*, not no higher-level terms. If your bottom rung is 'representation,' and you cash it out *only* as 'what an interpreter judges,' you haven’t grounded it; you’ve *relocated* the skyhook. A crane’s footing must be built of the level *beneath* it."  
      *Must Land:* If this reply fails, your core thesis is misunderstood as greedy reductionism.

  3.  **Dennettian #2: "Your 'borrowed footing' is just an unearned 'free lunch' (Dennett’s term). You’ve rebranded, not advanced, his critique."**  
      *Reply:* "Dennett’s 'free lunch' targets skyhooks disguised as cranes. My critique targets *cranes that look earned* but whose footing is counterfeit. It’s a crane built on a loan it never repays—structurally sound but explanatorily bankrupt. This is a distinct failure mode in practice."  
      *Soft Spot:* If they argue "free lunch" covers this, your novelty claim weakens.

  4.  **Philosopher of Biology: "Science needs pragmatic shortcuts. If 'selection for X' or 'genetic information' works predictively, why police the semantics? Your test stifles productive science."**  
      *Reply:* "When predictive power hides explanatory circularity, we risk illusions of understanding. My test doesn’t ban 'information' talk—it flags when *no lower-level cash-out is offered* for explanatory work. If 'information' just means 'correlation,' say that. If it smuggles in 'intentional function,' own it—or find the mechanism."  
      *Soft Spot:* Concedes science uses borrowed footings productively; your test might feel "policing."

  5.  **Enactivist: "You’ve diagnosed a symptom, not the disease! Representation *itself* is a skyhook. Your test only catches egregious cases—it doesn’t purge explanatory frameworks rooted in Cartesianism."**  
      *Reply:* "Agreed that representation is often suspect. But my target is narrower: explanations *advertised as mechanistic or selectionist* that covertly rely on ungrounded semantics. Even if you reject representation, you should want your alternatives to pass the footing test."  
      *Damage Control:* Low threat—agree and refocus on shared ground.

  6.  **Grad Student: "How do I apply this to [e.g.] predictive processing? Is 'prediction error minimization' a borrowed footing if it’s not neurally cashed out?"**  
      *Reply:* "Run the test: What’s the bottom rung? If it’s 'minimizing error,' ask: 'Error *according to whom/what*?' If it implies an *endogenous standard* without a mechanism (e.g., a learnable generative model), it *might* be borrowed. Look for appeals to implicit 'interpreters' or unexplained norms."  
      *Soft Spot:* Application is case-specific; risk of over- or under-applying.

  ---

  ### **The Silent Killer (Hope Nobody Asks)**
  **"Doesn’t your *own* 'footing test' rely on a borrowed footing? You use semantic notions ('description,' 'vocabulary,' 'reimporting') to diagnose semantic smuggling. How is *that* grounded?"**  
  *Why it’s fatal:* If your diagnostic tool commits the sin it condemns, your critique self-destructs.  
  *Weak Reply:* "The test is a pragmatic meta-tool for spotting explanatory gaps, not a foundationalist claim." (Ad hoc and unsatisfying).

  ---

  ### **Key Strategic Notes**
  -   **Make-or-Break Reply:** Distinguishing your test from greedy reductionism (Objection #2). If the audience thinks you’re demanding flat reduction, you lose the Dennettians and mechanists.
  -   **Condemns Too Much/Little?** Stress it’s a *diagnostic*, not a veto. Borrowed footings can be heuristically valuable (concession #1) or refinanable (concession #2). The test exposes when explanation *as given* is circular, not when the phenomenon is unexplainable.
  -   **Audience Targeting:** Focus replies to Dennettians/mechanists on *structural integrity of explanations*; to biologists on *explanatory transparency*; to enactivists on shared goals.

