  ### Key Insight
  Your intuitions reveal that **Molyneux's problem isn't about perception but about action**. When the blind person *reaches* (Case 2), they aren't "recognizing" the cube—they're activating a *grasping schema* tuned by touch, now deployable by vision. This also explains:
  - Why lumps fail (Case 6): Touch discriminates them via texture/local contours, not global grasp-affording shapes.
  - Why the carpenter succeeds (Case 7): Cutting wood builds schemas for flat faces/curves, transferable as visual affordances.
  - Why handling helps (Case 5): It forces schema alignment (vision and touch co-refine grasping/tracing).

  The asymmetry in Case 3 arises because vision already builds high-resolution spatial schemas; touch merely executes them. For new predictions, transfer fails where no *action* bridges modalities (e.g., color, vibrations→sound).
