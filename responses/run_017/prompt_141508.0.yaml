  The rain misted the greyhound track’s empty stands. Frank “Pencil” Petrovich hunched over his thermos, steam curling past his nose like a ghostly greyhound. Retirement pensions didn’t cover decent bourbon, so he still settled bets. Fair odds, fair shake. Mostly.

  **Monday:** Skinny Lenny, perpetually convinced of jinxes, shoved a crumpled fiver at Frank. “Pencil! Ten bucks says *no* dog wins two races straight tonight. Jinx *always* hits.” Frank calculated fast. Eight races, decent odds. Fair? Just. “Done,” he rasped, pocketing the cash. *Lenny’s Jinx Bet: Pays $10 if no dog wins two races consecutively. Cost: $5.*

  **Tuesday:** Marjorie, knitting needles clicking like nervous teeth, stopped him. “Frank, dear. My grandson says… probabilities? He explained it. If a dog wins, isn’t it *less* likely to win the next? Momentum’s a myth, he says.” Frank sighed. “Lady, past don’t predict the future. But… for a longshot winner, odds *do* lengthen slightly next time out. Usually.” She beamed. “So, $5 says that if *Red Rocket* wins Race 3, he *won’t* win Race 4? Grandson says it’s logical!” Frank saw the slight edge. *Marjorie’s Momentum Bet: Pays $5 if Red Rocket wins Race 3 but loses Race 4. Cost: $2.*

  **Wednesday:** Benny “The Brain” Chen cornered him, eyes gleaming. “Pencil! Arbitrage opportunity! Hear me out. I bet $20 that *either* Streaker wins Race 1 *or* Whistler wins Race 2. Just one of ‘em! Can’t lose!” Frank’s pencil flew. Basic disjunction. Odds implied probability slightly over 100%. A sucker bet… for Benny? “Fair?” Benny pressed. Frank grunted. “Fair enough. Your twenty says one wins. Pays you… thirty-three if either does.” *Benny’s Either/Or Bet: Pays $33 if Streaker wins R1 OR Whistler wins R2. Cost: $20.*

  **Friday:** Old Man Henderson, smelling of liniment and regret, waved a shaky hand. “Frank… remember Thunderbolt? ’83? Won five straight? Lightning *can* strike twice, eh? Ten bucks says *some* dog wins at least two in a row tonight! Gotta believe!” Frank saw the odds. Longshot, but possible. Paid well. “Alright, Henderson. Ten bucks it happens. Pays you… twenty-five.” *Henderson’s Streak Bet: Pays $25 if any dog wins at least two consecutive races. Cost: $10.*

  Frank tallied his book Saturday morning, rain drumming the tin roof of his shed. Coffee cooled, forgotten. He laid out the slips:
  1.  **Lenny:** Pays $10 if NO consecutive wins. **Cost:** $5 (He keeps if there *is* a streak)
  2.  **Marjorie:** Pays $5 if Red Rocket wins R3 but loses R4. **Cost:** $2 (He keeps if Red Rocket loses R3 OR wins R3 *and* R4)
  3.  **Benny:** Pays $33 if Streaker wins R1 OR Whistler wins R2. **Cost:** $20 (He keeps only if *both* lose)
  4.  **Henderson:** Pays $25 if ANY dog wins at least two consecutive races. **Cost:** $10 (He keeps if there are *no* streaks)

  He started running scenarios. Scenario 1: *No streaks at all.*
  *   Pays Lenny $10 (Cost: $5) **Net Loss: $5**
  *   Marjorie: Red Rocket didn't win two, but might not have won R3 either. Frank keeps her $2. **Net so far: -$3**
  *   Benny: Needs Streaker *or* Whistler to win. If no wins? Benny loses. Frank keeps Benny's $20. **Net so far: +$17**
  *   Henderson: No streak? Henderson loses. Frank keeps $10. **Net: +$27**
  Good!

  Scenario 2: *A streak happens (say, Whistler wins R1 & R2).*
  *   Lenny loses (streak happened). Frank keeps Lenny's $5.
  *   Marjorie: Unaffected (unless Red Rocket involved). Frank might pay or keep, say he keeps $2. **Net so far: +$7**
  *   Benny: Whistler won R2! Pays Benny $33 (Cost: $20) **Net so far: -$13**
  *   Henderson: STREAK! Pays Henderson $25 (Cost: $10) **Net: -$38**
  Bad.

  Scenario 3: *Red Rocket wins R3 and R4 (a streak).*
  *   Lenny loses (streak). Frank keeps $5.
  *   Marjorie: Red Rocket won R3 *and* R4? Frank *pays* Marjorie $5! (Cost: $2) **Net so far: -$5** (Kept $5, paid out $5)
  *   Benny: Unaffected? Say both Streaker and Whistler lost. Benny loses. Frank keeps $20. **Net so far: +$15**
  *   Henderson: STREAK! Pays Henderson $25 (Cost: $10) **Net: -$10**
  Still bad.

  Frank’s pencil scratched faster. Scenario 4: *Streaker wins R1, but nothing else streaks. Whistler loses R2.*
  *   Lenny: No streak? Pays Lenny $10! (Cost: $5) **Net Loss: $5**
  *   Marjorie: Unaffected? Keeps $2. **Net: -$3**
  *   Benny: Streaker won R1! Pays Benny $33 (Cost: $20) **Net: -$23**
  *   Henderson: No *other* streak? Henderson loses. Frank keeps $10. **Net: -$13**

  Every path led to red ink. -$38, -$10, -$13… even the best case, "no streaks," gave him +$27 only if Benny's bet *also* lost (both Streaker *and* Whistler lost). But if Benny lost, that meant no early win to trigger Henderson... it locked together. He saw the shape: guaranteeing his loss required all these specific, contradictory conditions about streaks and specific wins. He hadn't been *played*; he'd been *assembled*.

  He stormed back to the track Sunday. Found Lenny. “Lenny! Your jinx bet. If I offered it alone? Fair. But with the others? It’s poison!”

  “Poison? Frank, it’s just probability! You said fair!”

  He cornered Marjorie. “Lady! Your ‘logical’ bet! Makes Red Rocket winning twice hurt me *twice*!” She blinked. “But Frank, each bet was separate! You agreed!”

  Benny shrugged. “Arbitrage, Pencil. Market inefficiency. You corrected it by taking my bet. Efficient!”

  Henderson just wheezed, “Lightning strikes, Frank. You took the bet.”

  Frank sat heavily on a wet bench. It wasn't malice. It was... aggregation. A thousand fair stones making an avalanche. But was it *his* fault? The loss was real, but only because of *all* the bets. If he stopped *now*, before the next Henderson or the next Lenny wandered up, could he win? Probably. The guaranteed loss was *there*, mathematically, in the set he held… but it wasn’t infinite. It was finite. Four bets. Four stupid, individually defensible bets.

  “So I’m a sap?” he muttered. “For taking fair odds? For *each one*?”

  He imagined the chain continuing. Bet 5, 6… 900. He’d be long dead before bet 900. Did the ghost of a loss that only fully manifested at infinity damn him *now*? The argument felt slippery, like wet track dirt. Did the bookie *need* to be out to get you? Or was the cold math itself the indictment, intention be damned?

  He pulled out the four slips, water beading on the paper. *If you could take back just one… which stone do you pull from the avalanche?*

  His finger hovered. Lenny’s? The core jinx? Marjorie’s? The specific trigger? Benny’s inefficiency? Henderson’s desperate hope?

  He stopped at Henderson’s slip. *Pays $25 if any dog wins at least two consecutive races. Cost: $10.* Henderson’s bet directly contradicted Lenny’s. Taking *both* was pure madness. Yet each, offered alone, had seemed plausible, even shrewd. Henderson’s was the one that turned a possible loss into a structural guarantee. It locked Lenny's jinx into a direct conflict where Frank *had* to lose on one of them, no matter what the dogs did.

  Frank crumpled Henderson’s slip slightly, then smoothed it out. Not because it was the worst odds, but because it was the one that made the invisible cage visible. The bet that proved you could build a prison out of open doors, each one inviting you to walk through.

  “Shoulda stuck to insuring houses,” he rasped to the empty track. Fire was predictable. This… this was actuarial poetry written in loss. He pocketed the slips. The loss was real. The irrationality? That felt like a bet he was still trying to settle. He touched Henderson's slip again. That was the one. The first stone in an avalanche he hadn't seen coming.
