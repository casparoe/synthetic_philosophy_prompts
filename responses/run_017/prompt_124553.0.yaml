prompt: |-
  I am working through Thomas Aquinas's treatment of resistance to tyranny in the Summa Theologiae, Second Part of the Second Part, question 42, article 2, on sedition, and I have hit a snag. The relevant passage reads:

  > Objection 3. Further, it is praiseworthy to deliver a multitude from a tyrannical rule. Yet this cannot easily be done without some dissension in the multitude, if one part of the multitude seeks to retain the tyrant, while the rest strive to dethrone him. Therefore there can be sedition without mortal sin.
  >
  > I answer that, As stated above (Article 1, Reply to Objection 2), sedition is contrary to the unity of the multitude, viz. the people of a city or kingdom. Now Augustine says (De Civ. Dei ii, 21) that "wise men understand the word people to designate not any crowd of persons, but the assembly of those who are united together in fellowship recognized by law and for the common good." Wherefore it is evident that the unity to which sedition is opposed is the unity of law and common good: whence it follows manifestly that sedition is opposed to justice and the common good. Therefore by reason of its genus it is a mortal sin, and its gravity will be all the greater according as the common good which it assails surpasses the private good which is assailed by strife.
  >
  > Accordingly the sin of sedition is first and chiefly in its authors, who sin most grievously; and secondly it is in those who are led by them to disturb the common good. Those, however, who defend the common good, and withstand the seditious party, are not themselves seditious, even as neither is a man to be called quarrelsome because he defends himself, as stated above (II-II:41:1).
  >
  > Reply to Objection 3. A tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler, as the Philosopher states (Polit. iii, 5; Ethic. viii, 10).

  I want to understand how the argument is supposed to hang together, and I am especially interested in a distinction the passage seems to invite but not develop: the difference between a ruler who lacks lawful title altogether and a ruler who possesses lawful title but exercises it tyrannically.

  Suppose a head of government was duly installed under a constitutional order but thereafter systematically redirects the machinery of the state toward personal enrichment, protects loyalists from ordinary legal accountability, and uses emergency powers to disable opposition. On the terms of the passage above, does the regime's continuing ability to secure prosperity, administrative efficiency, or popular support defeat Aquinas's claim that such a government is "directed, not to the common good, but to the private good of the ruler"? More importantly, how should Aquinas's identification of the "people" with a fellowship "recognized by law and for the common good" bear on who counts as the seditious party in this scenario: if the ruler's faction now controls the formal legal apparatus, can the resistors who appeal to the common good against the ruler be said to "defend the common good, and withstand the seditious party," while the ruler's own enforcers are the true authors of sedition?

  In explaining this, please reconstruct the logic of the passage step by step: why Objection 3 initially makes sedition seem praiseworthy, why the body of the article insists that sedition is always mortal by reason of its genus, and how Reply to Objection 3's claim that tyrannical government is not just is meant to dissolve the objection. I am less interested in what later scholastic or early modern authors did with this material than in how the distinctions internal to this passage settle the case of the constitutionally installed but tyrannically acting ruler. If the passage's own resources underdetermine the answer, say exactly where the gap lies and what further distinction would be needed to close it.
reasoning: |-
  Okay, the user is diving deep into Aquinas's treatment of tyranny and sedition in the Summa Theologiae. They're specifically puzzled about how to apply Aquinas's framework to a ruler who was constitutionally installed but then acts tyrannically. Let me start by recalling the key parts of the passage they mentioned.

  First, Objection 3 argues that removing a tyrant might involve dissension but isn't sinful. Aquinas's reply focuses on the definition of sedition as opposing the unity of law and common good. The Reply to Objection 3 states that tyrannical rule isn't just because it serves private interests. 

  The user's main confusion is whether a ruler who started legitimately but turned tyrannical still counts as such if they maintain efficiency or support. They also wonder who the real seditious party is—resisters or the ruler's enforcers. 

  I need to break down Aquinas's logic step by step. Start with why sedition is a mortal sin by genus: it attacks the legal and common good unity. Then address how tyranny is defined by end (private good vs common good), regardless of legality or efficiency. 

  The ruler's control of legal apparatus doesn't legitimize their actions if they subvert the common good. The resistors, appealing to common good, aren't seditious. The ruler's faction, even if legally in power, could be seen as seditious if they disrupt true unity. 

  The gap here is Aquinas doesn't explicitly address a ruler with initial legitimacy. He assumes tyranny lacks true legal standing. So, a further distinction between legitimate title and legitimate exercise of power is needed. The user might need to explore that distinction beyond Aquinas's text.
answer: |-
  Here's a step-by-step reconstruction of Aquinas's logic in ST II-II, Q42, A2, addressing your specific queries about the constitutionally installed but tyrannical ruler:

  ### 1. **The Core Logic of the Article**
      *   **Definition of Sedition:** Sedition is defined as "contrary to the unity of the multitude... the unity of law and common good" (derived from Augustine's definition of a 'people').
      *   **Moral Genus:** Because it opposes the fundamental principle of social order (law/common good), sedition is *by its very nature* (in its genus) a mortal sin. The gravity increases with the importance of the common good assailed.
      *   **Distinguishing Actors:** The *authors* of sedition sin grievously. Those merely *led* by them also sin. Crucially, those *defending* the common good against disturbers are *not* seditious (analogy: self-defense).

  ### 2. **Objection 3: The Apparent Paradox**
      *   **Premise:** Delivering a people from tyranny is praiseworthy (implicitly just).
      *   **Observation:** This often requires "dissension" (conflict, division) within the populace (e.g., some support the tyrant, some oppose).
      *   **Apparent Conclusion:** Therefore, this dissension (which looks like sedition) must not always be a mortal sin. The objection exploits the tension between resisting evil and maintaining unity.

  ### 3. **Aquinas's Resolution: The Body of the Article & Reply to Obj. 3**
      *   **Key Move:** Aquinas does *not* deny that resistance to tyranny is praiseworthy. He denies that *just resistance* constitutes "sedition" *as he has defined it*.
      *   **Defining Tyranny (Reply to Obj. 3):** A tyrannical government is "not just" because it is "directed, not to the common good, but to the private good of the ruler." This is crucial. Tyranny is defined by its *end* (private good), not its origin or efficiency.
      *   **Consequence for "Unity":** A tyranny, by definition, *is not* oriented towards the true "common good." Therefore, the "unity" it imposes or represents is *not* the "unity of law and common good" which defines a true 'people' and which sedition sins against.
      *   **Identifying the True Threat:** The faction *upholding* the tyranny is the faction upholding a regime directed towards a *private* good, thereby *opposing* the true common good. They are the ones disturbing the *authentic* unity of law and common good.
      *   **Re-classifying the Resistance:** Those resisting the tyrant to restore the common good are *not* causing sedition. Instead, they are "defend[ing] the common good, and withstand[ing] the seditious party" (i.e., the party upholding tyranny). They are analogous to someone justly defending themselves.

  ### 4. **Applying Aquinas to Your Scenario: Constitutionally Installed Tyrant**
      *   **Tyranny Defined by End, Not Origin:** Aquinas's definition of tyranny hinges *exclusively* on the ruler's *end* (private good vs. common good). The *method of installation* (constitutional or otherwise) is irrelevant to whether the regime *is* tyrannical. A constitutionally installed ruler who subsequently redirects the state to private enrichment and disables opposition for that purpose *is* a tyrant by Aquinas's definition.
      *   **Formal Legality ≠ True "Law" for Common Good:** Controlling the "formal legal apparatus" does *not* equate to upholding the "unity of law and common good" in Aquinas's sense. If the laws are used systematically for private enrichment and shielding loyalists, they are instruments of private gain, not expressions of justice oriented to the common good. The tyrant's faction may have *de facto* legal power, but they lack *legitimate authority* because they act contrary to the *purpose* of authority (common good).
      *   **Who is Seditions?**
          *   **The Ruler's Enforcers/Faction:** They are upholding a regime directed at a *private* good. They are actively opposing the *true* common good and disrupting the *authentic* unity of the people (defined by law/common good). *They are the true authors of sedition* according to Aquinas's definition. They are disturbing the order that *should* exist.
          *   **The Resistors:** They are acting to restore the common good against those disturbing it (the tyrant's faction). Therefore, they are "defend[ing] the common good, and withstand[ing] the seditious party" (the tyrant's faction). They are *not* seditious. Their actions, even if causing dissension, are classified as just resistance, not sedition.
      *   **Does Prosperity/Efficiency/Popularity Defeat the Claim of Tyranny? NO.**
          *   Aquinas is clear: the defining mark of tyranny is that it is *directed* to the ruler's *private good*. Any administrative efficiency, prosperity, or popular support is either:
              1.  Incidental or a by-product (not the *directing purpose*).
              2.  A means used cynically by the tyrant to maintain power for private ends (e.g., buying off key supporters, pacifying the masses while looting).
              3.  Insufficient to override the *systematic* subversion of law for private enrichment and protection of loyalists.
          *   The *intention* (directed to private good) and the *systematic actions* (redirecting state machinery, disabling opposition for private ends) define the tyranny, regardless of side-effects like prosperity or popularity.

  ### 5. **The Gap in Aquinas's Text & Needed Distinction**
      *   **The Underdetermined Issue:** Aquinas's argument here **does not explicitly address the critical distinction between:**
          1.  **Lawful Title/Origin:** How the ruler came to power (election, inheritance, constitution).
          2.  **Lawful/Legitimate Exercise of Power:** Whether the ruler governs *according to the purpose* of authority (common good) and *within the limits* of just law.
      *   **The Gap:** Aquinas assumes in Reply to Obj. 3 that a tyrant inherently lacks legitimacy because he acts for private good. He doesn't grapple with the scenario where a ruler possesses *initial* lawful title but *subsequently* exercises power tyrannically *while still operating within or manipulating* a formal constitutional/legal framework. He jumps from "directed to private good" to "not just" without discussing the complexities of title vs. exercise within an existing legal order.
      *   **The Needed Distinction:** To fully close the gap in your scenario, Aquinas (or an interpreter) needs to explicitly **distinguish between *legitimacy of origin* and *legitimacy of exercise***.
          *   A ruler may have *legitimacy of origin* (constitutional installation).
          *   They forfeit *legitimacy of exercise* by systematically governing for private good, subverting the law's purpose, and disabling opposition.
          *   **Consequence:** The tyrant's faction, possessing *de facto* power derived from initial legitimacy but exercising it tyrannically, is the faction acting *against* the true "unity of law and common good." They become the disturbers (seditious) of the authentic common good, despite their formal position. The resistors, acting to restore legitimacy of exercise (common good) against this disturbance, are not seditious.
      *   **Why Aquinas Doesn't Make This Explicit:** His focus is primarily on the *moral essence* of the act (end/goal: common good vs. private good) and the definition of a true "people" (united for common good under law). He sees the tyrant's violation of the end as inherently dissolving any claim to represent the "unity of law and common good," making the distinction of origin less immediately relevant to the *moral classification* of the acts. However, for applying his logic to complex political realities involving constitutions, the origin/exercise distinction becomes practically essential.

  **Conclusion:** According to Aquinas's logic *within this passage*:
  1.  A constitutionally installed ruler who systematically redirects the state for private gain *is* a tyrant.
  2.  Prosperity, efficiency, or popularity *do not* negate this classification if the *directing purpose* is private good.
  3.  The tyrant's faction, controlling the formal apparatus but acting for private good, is the party disturbing the *true* unity of law and common good – they are the *seditious* party.
  4.  Resistors appealing to the common good against this faction are defending the common good and *not* seditious.
  5.  **Gap:** Aquinas doesn't explicitly articulate the distinction between *legitimate origin* and *legitimate exercise* of power needed to fully navigate the scenario where a tyrant retains formal title within a constitutional framework. This distinction is the crucial piece required to seamlessly apply his core principles (defined by end/common good) to your complex case.
