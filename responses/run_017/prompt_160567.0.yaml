prompt: |-
  I retired four years ago after a career in sensory physiology — thirty-odd years working on rod and cone function in nocturnal mammals — and I have since been auditing a continuing-education seminar in bioethics, which is how I came to be appointed the "community scientist" member of our teaching hospital's Novel Interventions Committee. The committee maintains two lists: interventions we classify as restorative, which the hospital funds and our clinicians may prescribe, and interventions we classify as elective, which a patient may obtain privately but which we do not pay for. What has struck me in my first year is that we are far better at producing verdicts than at stating the rule we are running; the seminar readings draw a tidy line between restoring normal function and improving beyond it, but our own decisions seem to me to be consistent with several different lines at once, and I would like that made explicit before our next meeting.

  Our recent verdicts, in brief: a cochlear implant for a toddler with congenital profound sensorineural hearing loss went on the restorative list, with fairly short shrift given to the argument that deafness is a cultural identity rather than a deficit; deep brain stimulation for advanced Parkinson's tremor, restorative; testosterone replacement for a sixty-eight-year-old man with serum levels in the lowest decile and documented fatigue, restorative, but with the explicit proviso that the dosing target is the range typical of healthy men in their forties rather than their twenties; modafinil for residents on night float who have no sleep disorder, elective; standard walking prostheses for a bilateral below-knee amputee, restorative, while the carbon-fiber running blades the same man wanted for competition were elective, five to two, despite his argument that they merely restore the locomotive range everyone else enjoys; growth hormone for a boy with idiopathic short stature — no deficiency, no disease, predicted adult height near the third percentile — elective, four to three, over a dissent holding that severe short stature is a real social and psychological disadvantage and not a bare preference; and a hippocampal memory prosthesis for a man with lasting impairment after viral encephalitis, restorative only after the manufacturer agreed to a firmware cap holding performance near the median of the age-matched normal range, with the minutes recording that we would not have funded an uncapped version.

  Next month's case is the one I cannot see our way through. A thirty-four-year-old wildland firefighter with early-stage retinitis pigmentosa — measured acuity 20/60, pronounced night blindness, expected to progress — is being offered enrollment in a trial of a camera-based cortical visual prosthesis. In the trial data it brings daytime acuity to roughly 20/25, still below her premorbid 20/15, and because the camera's sensor extends into the near-infrared it also generates a false-color overlay that gives genuinely useful vision in darkness and through smoke. The manufacturer can switch that overlay off in firmware, but only at the cost of dropping measured acuity to about 20/50, since the device's contrast processing draws on the additional spectral channels: the supra-normal effect is not a detachable extra but is causally entangled with the therapeutic one, a "bundling" problem I keep raising in the seminar and cannot get anyone to rule on. Without the implant she will lose her field certification within the year; a desk assignment exists, but it ends the career she wants. A related case is already queued behind hers: the same prosthesis for a sixty-one-year-old colleague whose night vision has declined to the ordinary extent for her age, with no ocular disease at all.

  What I need from you, in under 500 words and in three short labeled sections rather than a single block: first, the two or three rules our precedents are jointly consistent with — a pathology-or-medical-need rule, a restore-to-the-normal-range rule, an opportunity-or-positional-advantage rule, or something I have not thought of — and what each of them predicts for the firefighter, including whether the "normal" in question is indexed to the species, to an age cohort, or to a person's occupational role; second, your recommended classification and the closest analog among our own precedents, together with an honest statement of the principle we would be adopting under each of the alternatives, including funding her with the overlay disabled or declining outright; third, the single further case whose verdict would best separate the surviving rules, and whether my queued sixty-one-year-old actually does that work or merely repeats what the amputee's blades already told us.
reasoning: |-
  Hmm, the user is a retired sensory physiologist serving on a hospital ethics committee dealing with classifying medical interventions as either restorative or elective. They've described several precedent cases and now need help analyzing a complex new case involving a cortical visual prosthesis for a firefighter with retinitis pigmentosa.

  Looking at the precedents, I notice consistent patterns emerge. The cochlear implant for congenital deafness was classified as restorative despite cultural identity arguments, focusing on pathology. Parkinson's DBS and testosterone replacement (with age-adjusted targets) also treat recognized medical conditions. But modafinil for healthy residents was elective, as was GH for idiopathic short stature (by majority vote). The running blades were elective despite arguments about restoring locomotive range, while standard prosthetics were covered. The memory prosthesis was only approved with a performance cap at median normal range.

  For the firefighter case, the key complication is the bundled infrared vision enhancement that improves beyond normal human capacity but can't be separated from the therapeutic function. If we apply a strict pathology-based rule, her RP clearly qualifies as medical need. But the "restore to normal range" rule is trickier - should "normal" be species-typical, age-adjusted, or occupation-specific? The infrared vision definitely exceeds normal species capacity.

  The precedents suggest a dual approach: interventions must address a pathology AND restore function to within the statistically normal range for the relevant group (species, age, or occupation). For the firefighter, restoring vision to 20/25 likely meets this, though the infrared capability poses an enhancement issue. Since the benefits are bundled, and disabling it worsens acuity, I'd recommend approving with the overlay enabled, similar to how we didn't cap the cochlear implant's full capabilities.

  The 61-year-old without pathology would be the best test case to distinguish rules - if approved, it would validate an occupational advantage standard; if denied, it confirms the pathology requirement. This goes beyond the amputee case by testing whether non-pathological decline warrants intervention.

  In my response I'll structure this into three clear sections as requested: the rules derived from precedents, my recommendation for the firefighter case, and the best test case to distinguish between rules.
answer: |-
  ### 1. Implicit Rules in Precedents  
  Your decisions suggest two co-existing rules:  

  - **Pathology + Statistical Norm Restoration**: Coverage requires (a) a diagnosed pathology *and* (b) restoration to within the statistically normal range for the relevant reference group (species-typical function, age-adjusted where appropriate).  
    *Firefighter prediction:* RP is pathology. Restoring acuity to 20/25 (near species-typical) is restorative, but IR vision exceeds species-typical function. **Likely elective due to enhancement**, unless "normal" is occupationally indexed (see below).  

  - **Occupational Baseline Restoration**: Where pathology impairs pre-morbid occupational capacity, restoration to the minimum functional baseline for that role may qualify.  
    *Firefighter prediction:* RP threatens her firefighting career. Prosthesis + IR overlay restores occupational capacity (night/smoke vision). **Likely restorative** if "normal" includes role-specific function.  

  *Reference Groups*: Precedents use species-typical (cochlear implant, memory cap), age-adjusted (testosterone), and occupationally implied (prostheses enabling basic ambulation). Growth hormone rejection suggests resisting social "normalization."  

  ---

  ### 2. Recommended Classification & Principle  
  **Classification:** **Restorative** (with overlay enabled), analogous to the **cochlear implant**.  

  - **Closest Precedent:** Cochlear implant (pathology addressed; no cap on full functionality despite cultural dissent).  
  - **Principle Adopted:**  
    - *If approved:* "Bundled therapeutic enhancements are restorative when (1) treating a pathology, (2) restoring core function to the statistically normal species range, *and* (3) inseparable from that restoration." IR vision is causally entangled with acuity restoration.  
    - *If denied/disabled:* "Restoration excludes any function exceeding species-typical capacity, even if bundled." This contradicts the uncapped cochlear implant.  
    - *If outright declined:* "Elective when pathology is progressive but not yet severely impairing." Undercuts early Parkinson’s/DBS logic.  

  ---

  ### 3. Best Differentiating Case  
  **The 61-year-old firefighter without pathology** cleanly separates the rules:  
  - **Pathology Rule:** *Elective* (no disease; age-related decline isn’t pathology).  
  - **Occupational Rule:** *Potentially restorative* (if role requires supra-normal night vision).  
  - **Statistical Norm Rule:** *Elective* (restores beyond age-typical function).  

  **Why it works:**  
  - The amputee’s blades tested "restoration vs. advantage" but assumed pathology. This case lacks pathology, directly probing whether occupational need alone justifies funding. A restorative verdict here would confirm an **occupational baseline rule**; rejection affirms **strict pathology + species-typical restoration**.  
  - It does *new work*: The queued case lacks pathology, unlike the amputee, forcing a choice between occupational need and medical necessity.  

