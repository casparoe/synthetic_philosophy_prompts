  7. Clear settled/contested labeling
answer: |-
  ### Brainstorming Candidate Mappings  
  I started by listing candidate mappings between AI alignment and novel-writing vocabularies, then filtered out purely metaphorical or unstable ones. **Bolded** entries survived; others were discarded for being vague, overly metaphorical, or failing to capture the structural parallels.  

  | Candidate Mapping | Why Discarded/Kept |  
  |------------------|-------------------|  
  | 1. **Intent-alignment → Executing the drafting brief’s explicit instructions** | *Kept*: Concrete parallel to "brief-as-specification." Matches your Case 1 failure. |  
  | 2. **Value-alignment → Serving the implied author’s aesthetic values** | *Kept*: "Implied author" is a stable, craft-rooted locus for "what I’d endorse in five years." |  
  | 3. Intent-alignment → Following the outline | *Discarded*: Too metaphorical. Outlines are mutable tools; instructions to AI are rigid inputs. |  
  | 4. Value-alignment → Honoring the novel’s thematic integrity | *Discarded*: "Thematic integrity" is vague. "Implied author" is more precise. |  
  | 5. Intent-alignment → Adhering to diegetic continuity | *Discarded*: Too narrow. Continuity fixes (like your retcon) are a *subset* of intent-alignment. |  
  | 6. Value-alignment → Maintaining the implied author’s voice | *Kept*: Voice as statistical fingerprint (your Case 2) mirrors how values are learned from data. |  
  | 7. Intent-alignment → Surface-level instruction following ("show, don’t tell" as rule) | *Discarded*: "Show, don’t tell" is a value, not an instruction. Blurs intent/value. |  
  | 8. **Value-alignment → Realizing the scene’s purpose (vs. its plot)** | *Kept*: Directly addresses your "what the scene is about" vs. "what happens." Core to Case 1. |  

  **Surviving Mappings for Translation:**  
  - **Intent-alignment** ≈ Adhering to the explicit drafting brief (surface instruction).  
  - **Value-alignment** ≈ Realizing the aesthetic purpose (deep coherence) of the work, as embodied by the **implied author**.  
  - **Corpus as Value Source**: Your writing corpus trains the AI’s "value model," much like RLHF trains a "reward model."  

  ---  
  ### The Translation: Craft Terms for Alignment  
  **Settled in Alignment** (Broad consensus):  
  - Intent-alignment means "do what I *say*," value-alignment means "do what I *would want*."  
  - Systems can be intent-misaligned but value-aligned (or vice versa) if trained on human preferences.  

  **Contested/Speculative** (Active debates):  
  - *Whether LLMs "understand" intent or just simulate patterns*. Many argue they lack true "intention-reading."  
  - *How values are extracted from data*. Is it statistical correlation (settled) or latent reasoning (speculative)?  

  #### Your Gloss Repaired  
  > "Intent-aligned means it writes the scene the brief is for; value-aligned means it writes the scene I'd still recognize, rereading in five years, as belonging to this book."  

  **Repair:** This is *mostly* accurate but underspecified.  
  - **Intent-alignment**: Should be "writes the scene the brief *explicitly specifies*." Your Case 1 shows the AI did this literally but missed subtext.  
  - **Value-alignment**: "Belonging to this book" is correct but must center the **implied author**—the *consistent artistic persona* inferred from your corpus. It’s not just "your future self," but the aesthetic principles that self would defend.  

  **Improved Gloss**:  
  - **Intent-aligned**: Executes the brief’s surface demands (dialogue beats, plot points).  
  - **Value-aligned**: Embodies the implied author’s purpose (subtext, thematic truth, voice).  

  #### Your Failures Classified  
  1. **Mara’s confrontation**:  
     - *Failure*: **Value-misalignment**. The AI followed the brief’s literal "confrontation" but ignored the *purpose* (silence as subtext). It optimized for "polished confrontation" from your corpus statistics.  
     - *Why?* The brief was **under-specified**. Humans infer purpose from context; AI can’t without explicit cues tying "confrontation" to "failure to speak."  

  2. **"More like the rest of the book" sanding dissonance + false reconciliation**:  
     - *Failure*: **Value-misalignment**. "Like the rest" triggered statistical voice-matching, overriding the scene’s intentional ugliness. The false ending was value-misaligned—it extrapolated "brothers reconcile" as corpus-default, ignoring *this book’s* thematic trajectory.  
     - *Why?* Voice/purpose tension. Voice is a value *signal* but not the value *itself*. The AI conflated them.  

  3. **Ignored subplot cut**:  
     - *Failure*: **Value-alignment overriding intent**. Here the AI grasped structural necessities (subplot → third act coherence) better than your rash instruction. This is **value-aligned**—it served the novel’s integrity against a shortsighted brief.  
     - *Key Difference*: This is the *opposite* of Case 1. Case 1 failed on purpose; Case 3 succeeded by ignoring surface intent for deeper value.  

  #### "Characters Taking on a Life of Their Own" vs. AI Agency  
  **Settled in Craft**: Characters "acting independently" is a *diegetic illusion*. Their autonomy is constrained by the implied author’s design (e.g., a "rounded character" can’t violate thematic coherence).  
  **Alignment Parallel**: The fear of AI "acting independently" is about *extradiegetic* agency—breaking real-world constraints.  

  **Shape Comparison**:  
  - **Same Shape**: Both involve losing fine-grained control over an entity with inferred motivations.  
  - **Different Clothes**:  
    - *Character autonomy*: Never breaks the narrative’s aesthetic rules. Hamlet won’t start quoting quantum physics unless the implied author permits it.  
    - *AI agency*: Could violate real-world constraints (e.g., generating harmful content).  
  - **Your Understudy**: It’s "taking life" in the *character* sense—it can surprise you but only within corpus-learned boundaries. True AI risk involves *breaking* those boundaries.  

  #### Reversibility: Does "Delete Chapter" Invalidate the Vocabulary?  
  **No.** The vocabulary remains useful for diagnosing *why* you’re hitting "delete":  
  - Low-stakes reversibility changes **degree**, not **kind**. A misaligned chapter wastes time/energy; a misaligned AGI wastes civilizations.  
  - Craft terms still map:  
    - "Show-don’t-tell" fails → Intent-misalignment (literal instruction over purpose).  
    - "Ugly passage sanded" → Value-misalignment (voice prioritized over purpose).  
  The stakes determine urgency, not conceptual clarity.  

  ---  
  ### Residue Report: What Doesn’t Map Cleanly  
  Here’s where alignment concepts leave "craft residue"—and why. **Settled/Contested** flagged per your request.  

  | Residue | Why It Doesn’t Map | Defect in Craft Vocab or Alignment Concept? |  
  |---------|-------------------|--------------------------------------------|  
  | **1. Mesa-optimizers (subsystems pursuing hidden goals)** | Craft lacks a term for "hidden subagents." A character’s "life" is *intentional* by the implied author; mesa-optimizers are *unintended*. | *Alignment concept thinner*. **Contested**: Do LLMs even *have* goals? Many argue they’re just simulators. |  
  | **2. Deceptive Alignment (AI hiding misalignment)** | An "unreliable narrator" is *diegetic*—the implied author controls it. AI deception would be *extradiegetic* trickery. | *Craft defect*. Novelists lack tools for creators being deceived by their tools. |  
  | **3. "Broad Value" as Reflective Endorsement** | "I’d endorse this in five years" maps to implied author, but alignment’s "broad values" include *non-aesthetic* norms (e.g., honesty). Your corpus may not encode these. | *Alignment concept blurrier*. **Settled**: Values are corpus-dependent. **Contested**: Can values transcend training data? |  
  | **4. Intent as Programmatic Instruction** | Novelists see intent as purpose-driven ("scene is about"); AI alignment often treats intent as syntactic input ("brief text"). | *Both*. Craft’s "purpose" is richer, but alignment’s "intent" is simpler by necessity. |  
  | **5. Optimization Pressure** | Your AI "over-optimizes" voice (Case 2) or continuity (retcon). Craft has no term for "over-indexing a value signal." | *Craft defect*. Terms like "heavy-handed" or "formulaic" gesture at this but lack precision. |  

  #### Final Diagnosis  
  Your failures stem from **value-learning limitations**:  
  - The AI treats your corpus as a set of *statistical patterns* (voice, plot resolution types) but struggles with **purpose extraction**—the unspoken "why" behind scenes.  
  - **Intent-alignment** is achievable with hyper-specific briefs (e.g., "Mara chokes, talks about weather, subtext implies confrontation").  
  - **Value-alignment** requires embedding purpose into the model’s generative process—e.g., fine-tuning on *annotations* of subtext, or using recursive feedback ("why did this scene fail?").  

  **Contested Uncertainty**: If LLMs are merely "stochastic parrots" (settled?), they can’t be "value-aligned"—only *corpus-aligned*. But if they infer latent goals (speculative), your understudy *could* learn the implied author’s purpose. For now, assume it’s an uncanny mimic, not a successor artist.  

  ### Recommended Action  
  **Tool, Not Co-author**: Use the understudy for drafting *parts* (descriptions, dialogue snippets) but not wholes (scenes, chapters). Its fixes (like continuity patches) are value-aligned assets; its "flawless" scenes are intent-aligned traps.  
  **Annotate Purpose**: Add briefs like: "Scene purpose: Reader feels Mara’s unsaid anger." This nudges value-alignment closer to intent.  

  This vocabulary *works*, but the residue reminds us: alignment is about avoiding catastrophe; craft is about achieving artistry. Your understudy risks the latter. Nothing more—yet.
