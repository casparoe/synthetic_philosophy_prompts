  - Case A: He'd probably say the AI exhibits only register-competence without genuine language use, dismissing the uptake argument. The decisive break would be at "does it use religious language?" 
  - Case B: He'd see the genealogists repeating Frazer's error by treating religion as failed science, while Miriam's ongoing practices suggest belief despite her denial. 
  - Case C: He'd refuse to judge who "really believes," focusing instead on their forms of life. The non-doxastic practitioner might be closer to authentic religion.

  The methods note is crucial - I must explain how to attribute views while respecting his anti-theoretical stance. I'll emphasize that we're projecting how he'd dissolve confusions, not what doctrines he'd hold. Any apparent doctrines (like exposure mattering) would be things he'd frame as reminders about grammar.

