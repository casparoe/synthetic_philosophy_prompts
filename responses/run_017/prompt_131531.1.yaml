     - Given treatment, they are assigned weight loss: 
          Pill group: bag with 16 "yes" weight loss and 4 "no". (80% yes)
          Placebo group: bag with 4 "yes" and 16 "no". (20% yes) (2 min)
     - Then, given treatment and weight loss, they determine cholesterol improvement with a d10:
          Pill and weight loss: success if <=6 (60%)
          Pill and no weight loss: success if <=1 (10%)
          Placebo and weight loss: success if <=8 (80%)
          Placebo and no weight loss: success if <=3 (30%) (3 min)
     - Collect data:
          Overall: compare pill and placebo. Expect pill to be better. (1 min)
          Then, someone will want to break down by weight loss. Do it: 
               For weight loss group: compare pill and placebo.
               For no weight loss: compare pill and placebo.
          They see that in both groups, placebo is better. (2 min)
     - Discussion: Why is this happening? Because weight loss is a result of the pill and not a pre-existing condition. (1 min)

     Debrief (15 minutes)
     - Map the activity to the concepts:
          Round 1: The coin type was a lurking variable (health status) that affected both the treatment assignment and the outcome. By not accounting for it, we got a reversed conclusion.
          Round 2: Weight loss is a mediator. Conditioning on it blocked the causal path and created a reversal that is misleading.
     - What can go wrong:
          In Round 1, if there are no blue in Treatment B or no red in Treatment A, then we can't show the within-group comparison for that group. We can handle by saying "we don't have data for that subgroup, but the overall pattern holds" and note that in real life we need to collect more data.
          The dice rolls might not match the probabilities exactly. We can mention that with more data it would be clearer.
          Time: We have to move quickly. Have a timer and be strict.
          Confusion in the rules: Have a clear handout for the outcome thresholds.
     - What the activity can't deliver: 
          We are not covering all the nuances of when to condition and when not to. We are showing two examples. The second round is more advanced and might be confusing. We have to be clear that the key difference is pre-treatment vs post-treatment variable.

     Stakes: 
          For the predictions: they write down which treatment they think is better (overall and then within groups) and if they are wrong, they have to present first next week. Or we can do candy for correct predictions.

     Materials:
          - Hat with treatment slips (A and B) for Round 1 and also for Round 2 (Pill and Placebo).
          - Two bags for coin types in Round 1: 
               Bag A: 18 red tokens, 2 blue tokens
               Bag B: 2 red tokens, 18 blue tokens
          - Two bags for weight loss in Round 2:
               Bag Pill: 16 "yes" weight loss tokens, 4 "no"
               Bag Placebo: 4 "yes", 16 "no"
          - d10 dice (one per student or share)
          - Lookup tables printed for each student for both rounds (or two big posters).
          - Whiteboard to record results.

     Timeline:
          Round 1: 15 min
            0:00-0:03: Assign treatments and coin types.
            0:03-0:08: Roll for outcomes and record.
            0:08-0:10: Compute overall success rates, write predictions, reveal overall comparison (A>B?).
            0:10-0:12: Break down by coin type, compute within-group rates, write predictions, reveal within-group (B better in each?).
            0:12-0:13: Name drop: Simpson's paradox.

          Round 2: 10 min
            0:13-0:15: Assign treatments and weight loss.
            0:15-0:18: Roll for outcomes and record.
            0:18-0:20: Compute overall, write predictions, reveal (pill better?).
            0:20-0:22: Break down by weight loss, write predictions, reveal (placebo better in each?).
            0:22-0:23: Quick explanation of why it's different.

          Debrief: 12 min
            0:23-0:30: Compare the two rounds: what was the third variable and how was it different?
            0:30-0:35: Discuss real-world examples and the takeaway: not all third variables should be conditioned on.
            0:35-0:38: What went well, what was surprising, and what to remember.

     We have 2 minutes buffer.

