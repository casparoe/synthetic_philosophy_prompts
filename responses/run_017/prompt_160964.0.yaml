  Macbeth's childlessness is central. His despair over it highlights that the play endorses the view that barrenness is a curse. This contrasts with antinatalism, where preventing birth avoids suffering. The murder of Macduff's children shows the horror of ending a lineage, reinforcing the play's pro-continuation stance.

  The foreknowledge element is crucial. Characters know their lineage's fate, which might make the asymmetry less applicable since existence isn't hypothetical. Banquo accepts the prophecy, valuing future generations despite personal cost. Macbeth, denied lineage, turns nihilistic. The play suggests foreknowledge can lead to either affirmation or despair of lineage, but ultimately affirms continuation through Malcolm's restoration.

