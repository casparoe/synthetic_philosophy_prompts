answer: |-
  Here’s your spec for an adequate account of biological function, distilled from core biological practice and your test cases. Desiderata are ranked by negotiability, with justifications and tensions highlighted.

  ---

  ### **The Desiderata Checklist**  
  *(Non-negotiable = Core to biological practice; Negotiable = Camp-specific or contested)*  

  1. **License Projection**  
     - **What**: Must allow extrapolation from observed traits in a sample to unobserved instances (e.g., "Hearts pump blood in all healthy deer").  
     - **Why**: Biologists infer general functions from limited specimens (e.g., dissecting three frogs to predict tadpole heart function).  
     - **Non-negotiable**.  
     - *Case handle*: Retired workhorse (projection must work despite trait obsolescence).  

  2. **Explain Trait Existence/Persistence**  
     - **What**: Must answer "Why is this trait here?" (not just "What does it do?").  
     - **Why**: Central to evolutionary bio (e.g., explaining camouflage via selective advantage).  
     - **Non-negotiable**.  
     - *Case handle*: Three-enzymes (must distinguish traits maintained by selection vs. drift/design).  

  3. **Ground Normative Malfunction**  
     - **What**: Must distinguish *broken* traits (e.g., a heart that can’t pump) from *non-standard but functional* variants (e.g., harmless eye-color variation).  
     - **Why**: Critical for medicine/ecology (e.g., diagnosing disease vs. biodiversity).  
     - **Negotiable**: Historical camps treat this as non-negotiable; causal-role camps often reframe it as "statistical failure."  
     - *Case handle*: Moonlighting protein (knockout disrupts B, but is B a "function" or side effect?).  

  4. **Epistemic Accessibility**  
     - **What**: Assign functions without knowing full evolutionary history (e.g., a field biologist with one specimen).  
     - **Why**: Biologists routinely assign functions without fossil records or selection studies.  
     - **Non-negotiable for field utility**.  
     - *Case handle*: Co-opted structure (must ID current function B without knowing ancestral A).  

  5. **Fine-Grainedness (Function vs. Side Effect)**  
     - **What**: Distinguish a trait’s *selected effect* (why it’s maintained) from its *causal byproducts* (e.g., heart sounds vs. blood pumping).  
     - **Why**: Biologists avoid conflating adaptations with spandrels (e.g., why giraffe necks evolved for feeding, not sex).  
     - **Negotiable**: Organizational/causal-role camps often blur this; historical camps prioritize it.  
     - *Case handle*: Moonlighting protein (is B a function or side effect if only A was selected?).  

  6. **Cross-System Benefit Legitimacy**  
     - **What**: Assign functions when benefits cross organism boundaries (e.g., gut microbes digesting food for host).  
     - **Why**: Rising importance of holobionts/symbiosis.  
     - **Negotiable**: Historical camps often reject this (requires group selection); others embrace it.  

  ---

  ### **Tensions & Dealbreakers**  
  - **The Trilemma**: Your hunch is **correct**. Projection (requires stability), Fine-Grainedness (requires historical discrimination), and Epistemic Accessibility (requires present evidence) are **jointly unsatisfiable**.  
    - *Why*: Projection leans on stable generalizations (favors historical/selected effects). Fine-Grainedness needs selection history to filter side effects. But Epistemic Accessibility demands here-and-now observables. *Trade-off unavoidable*.  
  - **Knockout Desideratum**: **Explain Trait Existence** does the most damage. Causal-role theories fail hard here (they describe *what* traits do, not *why* they exist).  

  ---

  ### **Theories vs. Spec**  
  *(Brief position descriptions)*  

  - **Historical/Selected-Effects**:  
    Function = what a trait was *selected for*.  
    ✔️ Aces Explanation, Malfunction, Fine-Grainedness (e.g., retired workhorse has no current function; moonlighting protein’s only function is A).  
    ✘ Fails Projection (if environment shifts), Epistemic Accessibility (needs history), Cross-System Benefit (rejects holobionts).  
    ❗ *Three-enzymes*: Lab-designed enzyme has *no function* (not selected); drifted enzyme *gains* function only after selection.  

  - **Causal-Role**:  
    Function = current causal contribution to a system’s goal (e.g., survival).  
    ✔️ Wins Projection (ignores history), Epistemic Accessibility (observe now), Cross-System Benefit (if system defined broadly).  
    ✘ Fails Explanation (can’t say *why* trait exists), Fine-Grainedness (moonlighting protein’s B is a "function"), Malfunction (hard to ground normativity).  
    ❗ *Retired workhorse*: Function is B (current contribution), but this severs function from evolution.  

  - **Organizational**:  
    Function = role in self-maintaining systems (e.g., metabolic closure).  
    ✔️ Balances Explanation (via self-maintenance) + Epistemic Accessibility (observe organization).  
    ✘ Fuzzy on Fine-Grainedness (is heart pumping "self-maintaining" but sounds are not?), Malfunction (weak normativity), Cross-System Benefit (depends on system boundaries).  
    ❗ *Co-opted structure*: If B maintains the system, it’s functional; A is a byproduct.  

  ---

  ### **Confidence & Uncertainties**  
  - **Overall Confidence**: High on the desiderata list and trilemma. Test cases robustly expose fault lines.  
  - **Least Sure Point**: **Cross-System Benefit**. Is holobiont function biologically legitimate or a category error? Your case isn’t confused—it’s a live debate. Organizational theories *might* bridge this, but I’m skeptical.  
  - **Your Cases**: All hold up. Only note: "moonlighting protein" B killing on knockout doesn’t *make* B a function (could be toxic side effect). Depends on Fine-Grainedness.  

  ### **The Bottom Line**  
  No theory clears all desiderata. **Historical** best explains existence/malfunction but fails field utility. **Causal-role** wins practicality but can’t explain *why* traits exist. **Organizational** tries to split the difference but struggles with precision. The checklist’s value is exposing this tradeoff: biologists *use* different "function" concepts contextually. Your trilemma is the key insight—accepting it might reframe your reading group’s debates.  

  ---  
  *American English compliant. No citations per request. Confidence: 90% on desiderata/trilemma; 65% on organizational theory’s capacity to handle malfunction normativity.*
