prompt: |-
  You are a philosopher of action and a decision theorist with many years of experience teaching upper-level undergraduates, and you are unusually good at the architecture of an explanation: what has to be in place before what, and the exact point at which a good student's understanding silently derails. Please think carefully before you write. Begin your reply with a section headed "Brainstorm" in which you spend two or three paragraphs on: the two or three ways this particular session is likeliest to fail; the orderings of the material you considered and rejected; and which single step you take to be the genuinely hard one. Only then give me the plan. Aim for something I can read in five minutes and hand to a competent TA.

  The setting: I am teaching a third-year seminar on rational choice. Week 9, seventy-five minutes, eighteen students, a whiteboard and one side of A4. They have already done Newcomb's problem with an opaque box and a near-perfect predictor, the one-shot prisoner's dilemma, and they can state both theories in the crude form I gave them: causal decision theory maximises expected utility of the causal consequences of the act, evidential decision theory maximises expected utility conditional on the act. They can do a Bayesian update on an urn of unknown bias. No calculus, and no continuous priors: if an update is needed, do it over a two- or three-valued hypothesis with a table.

  What I want next week's session to make land is evidential cooperation in a large world: why, and under precisely what conditions, an evidential agent's own act can be a reason to cooperate with thousands of strangers over whom it has no causal influence whatsoever, and how the strength of that reason depends on the size of the population, on what the agent gets to observe, and on whether the population's composition is known. By a large world I mean only this: the agent is one of many similar agents, and the joint distribution over all of their acts is something that has to be specified rather than something the decision problem hands you.

  The candidate case I have been working with, which you should feel free to trim or replace, is what I call the Nine Thousand Silos. Nine thousand agents, each sealed alone, one-shot, no communication, no commitment devices, no repetition, no reputation, no shared signal anyone observes. Each may press or not press. Pressing costs the presser one unit and adds three units to the payoff of every other agent, so the benefit is non-rival and undiluted: my payoff is three times the number of other pressers, minus one if I press. Two dials. The first is visibility: how many other agents' choices are revealed to me before I decide, which I want to be able to set at zero, at ten, and at eight thousand nine hundred and ninety-nine. The second is provenance: either the Registrar has truly announced that exactly three thousand of the nine thousand will press, or nothing about the composition is announced and the agents are exchangeable, their common tendency being one of two values, 0.2 or 0.8, with prior probability one half on each.

  Define the evidential leverage of pressing as the difference between the expected number of other pressers conditional on my pressing and the expected number of other pressers conditional on my not pressing; the agent presses exactly when three times the leverage exceeds one. My own numbers: under the unannounced, exchangeable version with no observations, leverage is about 0.36 times eight thousand nine hundred and ninety-nine, which is absurdly large; under the Registrar's announcement it is minus one, so the evidential reason does not merely vanish but reverses; and as the visibility dial is turned up, leverage collapses towards one regardless of how large the population is, because with a uniform-ish prior it comes out at roughly the population size divided by the number of observed acts plus a small constant. Correct me if any of that is wrong.

  What I want from you is not the explanation but the plan for it, in this order of concern. First, the dependency structure: the ordered components, stated as what must precede what and why, including where the definition of leverage belongs, whether the threshold arithmetic comes before or after the qualitative surprise, and why the reverse order fails. Second, the carrying example: is the Silo Census the right vehicle, and what must such a case have and lack; in particular say whether the payoff should really be non-rival, whether the agents should really be unable to see any shared signal, and in what order the two dials should be turned, with what the students should be able to compute at each setting. Third, the misconception map. Here is my provisional list: that this is just the causal-correlation confusion and evidential decision theory is magical thinking; that the correlation would have to be near-perfect, as with the predictor in Newcomb's problem; that one agent among nine thousand cannot matter; that conditioning on one's own act cannot be evidence about eight thousand nine hundred and ninety-nine other acts at once, since that would violate some conservation of evidence; that knowing the overall press-rate and knowing the exact composition are the same piece of information; and that the reference class is obviously the nine thousand silos rather than something wider or narrower. Tell me where in the sequence each of these should be headed off, in the order the students will actually form them, and add the ones I have missed. Fourth, one final check: a single question I can put to them at the end whose wrong answers are diagnostic, together with what each wrong answer tells me. Fifth, what to leave out and say out loud that you are leaving out. My own list is functional and updateless decision theories, the general question of which decision theory is correct, the full Savage small-world apparatus, commitment and pre-commitment, iterated games, and anything that turns on agents seeing each other's decision procedures. Tell me if any of those exclusions is a mistake, and what else belongs on the list.

  Two constraints. Do not explain the material to me; I know it, and I need the shape of the session, not its content. And do not give me readings, citations, or anything that would require a library or the internet: everything in the session has to be reconstructible from this message and from what the students already have.
reasoning: |-
  Hmm, the user is teaching a third-year seminar on rational choice and wants a detailed lesson plan for a session on evidential cooperation in large worlds. They've described the "Nine Thousand Silos" thought experiment as their main vehicle. I need to create a structured plan focusing on dependency order, case design, misconception handling, assessment, and exclusions.

  Brainstorming potential failure points first. Students might get overwhelmed by the scale (9000 agents) early on, so I should start with smaller groups. They might also confuse evidential reasoning with causation or magic, so I need clear analogies. The hardest step is understanding how one's own action provides evidence about others in an exchangeable population - that's the conceptual leap requiring careful scaffolding.

  For the sequence, I considered starting with the Registrar case but rejected that because it kills the effect too early. Better to build curiosity with the unannounced case first. The visibility dial should come after establishing the base effect. Threshold arithmetic should follow the qualitative surprise to maintain engagement.

  The Silo Census case works well but needs trimming. Keep the non-rival payoff to avoid dilution distractions. The shared signal exclusion is correct - we want pure act correlation. Dial order: start with no visibility/unannounced to show maximum effect, then add visibility to demonstrate decay, finally introduce Registrar to show collapse.

  Key misconceptions to address: the "magical thinking" concern early via EDT/CDT distinction; "near-perfect correlation" when discussing Newcomb differences; "one agent can't matter" during leverage calculation; "evidence conservation" when explaining exchangeability; "composition vs rate" during Registrar transition; "reference class" when framing the population. Missing misconception: confusing evidence with obligation.

  For assessment, a diagnostic question about leverage in different scenarios would reveal if they grasp the core mechanism. Wrong answers would pinpoint specific misunderstandings.

  Exclusions seem appropriate - adding functional/updateless theories or commitment devices would derail the focus. Should also exclude Savage framework and peer transparency to maintain simplicity.

  The plan structure will follow: dependencies, case refinement, misconception sequencing, assessment tool, and exclusions - all fitting within the one-page constraint.
answer: |-
  **Brainstorm**  
  The session risks derailing in three primary ways. First, students may conflate *evidence* with *causation*, dismissing evidential leverage as "spooky action at a distance" (especially if anchored to Newcomb’s predictor). Second, the scale (9,000 agents) could trigger intuitive disbelief ("one agent can’t affect thousands"), obscuring the statistical logic. Third, confusion between *known composition* (Registrar) and *exchangeable unknowns* may lead students to miscalculate conditional expectations or miss why leverage reverses.  

  I rejected starting with the Registrar case (leverage = -1), as it negates cooperation prematurely and feels like a trick. I also rejected beginning with visibility >0, as observations dilute the core paradox. The hard step is *grasping why exchangeability makes one’s own act probative for others’ acts*—it requires internalizing that under ignorance, your choice shifts the reference class for all similar agents.  

  **Plan for Session (75 mins)**  

  ---

  ### **1. Dependency Structure**  
  *(Whiteboard flow; 25 mins)*  
  **Order & Rationale:**  
  - **Step 0:** Recap EDT vs. CDT *using Silo payoffs*.  
    - *Why first:* Anchors to known formalism (payoff = 3 × others’ presses − 1 if I press).  
  - **Step 1:** Define **evidential leverage** (L = E[others’ presses | I press] − E[others’ presses | I don’t press]).  
    - *Why now:* Quantifies the "reason" to cooperate; precedes threshold to avoid misinterpreting payoff maximization.  
  - **Step 2:** **Qualitative surprise:** Show L > 0 *without calculations* in unannounced, zero-visibility case.  
    - *Analogy:* "If you press, you’re evidence others are ‘pressers’ like you; if not, evidence they’re not."  
    - *Why before threshold:* Builds intuition for *why* pressing affects expectations; threshold arithmetic (press iff 3L > 1) is trivial once L is understood.  
  - **Step 3:** **Threshold arithmetic:** "Press iff 3L > 1".  
    - *Why after surprise:* Students see L as "large enough to matter" before computing size.  
  - **Step 4:** **Compute L** for unannounced exchangeable case (prior: 0.2 or 0.8, P=0.5).  
    - *Table:* Calculate E[pressers | I press] = 1 + E[others] using posterior bias (P(bias=0.8 | I press) via Bayes).  
    - *Key:* L ≈ 0.36 × 8999 ≈ 3239, so 3L ≈ 9717 >> 1 → press.  
  - **Step 5:** Vary **visibility** (observe k others’ acts).  
    - *Why last for this block:* Shows L shrinks as k increases (L ≈ 8999/(k+2) with uniform-ish prior), collapsing to ~1 when k=8999.  

  ---

  ### **2. Carrying Example: Silo Census**  
  *(Case refinements; 15 mins)*  
  - **Non-rival payoff is essential:** Rival benefits (e.g., fixed pot) would muddy incentives; undiluted gains clarify cooperation’s logic.  
  - **No shared signal is correct:** Isolates act correlation as the *only* evidence.  
  - **Dial order:**  
    1. **Unannounced, zero visibility:** Maximizes L (paradox salient).  
    2. **Visibility = 10:** Compute L ≈ 8999/12 ≈ 750 → still press. Contrast with k=0.  
    3. **Visibility = 8999:** L ≈ 1 → indifferent.  
    4. **Registrar announced (exactly 3,000 press):** L = -1 → *don’t press*.  
  - **Students compute:** Posteriors for bias (Step 4) and L for k=10 (Step 5.2) via tables.  

  ---

  ### **3. Misconception Map**  
  *(Interleave preemptively; 20 mins)*  
  - **"EDT is magical thinking"** → Defuse at **Step 1** by contrasting Newcomb: *No predictor here; correlation arises from ignorance, not omniscience*.  
  - **"Correlation must be near-perfect"** → After **Step 2**, stress: *Weak prior (0.2/0.8) suffices; no precision needed*.  
  - **"One agent can’t matter"** → During **Step 4 calculation**: *Show L scales with population—leverage is per-agent evidence*.  
  - **"Violates conservation of evidence"** → At **exchangeability definition**: *Your act samples the common tendency—it’s evidence for all identical agents*.  
  - **"Known rate = known composition"** → Contrast **Registrar vs. unannounced** cases: *Registrar fixes total; exchangeability fixes tendency*.  
  - **"Reference class = 9,000"** → At setup: *Agents are exchangeable with hypothetical others—class is defined by similarity, not just these silos*.  
  - ***Missing misconception:*** "Conditioning on my act is cheating" → Preempt at **Step 0**: *EDT conditions on acts legitimately; it’s not "changing" others*.  

  ---

  ### **4. Diagnostic Question**  
  *(End; 5 mins)*  
  **Q:** *"If the Registrar announces exactly 4,500 pressers, and you see 10 others all pressed, what is L? Should you press?"*  
  - **Wrong answer: L = 0** → Thinks conditioning on act doesn’t update when composition known (misses that *your act still shifts the count*: E[others | press] = 4499, E[others | don’t press] = 4500 → L = -1).  
  - **Wrong answer: Press since 3×4500 >1** → Forgets to condition on own act (naive causal thinking).  

  ---

  ### **5. Exclusions**  
  *(State upfront; 5 mins)*  
  **Omit explicitly:**  
  - Functional/updateless theories (distracts from EDT mechanics).  
  - "Which DT is correct?" (Stay descriptive; this is *how EDT reasons*, not why it’s right).  
  - Savage framework (overkill for discrete cases).  
  - Commitment/repetition/reputation (violates one-shot, no-communication setup).  
  - Agents seeing decision procedures (adds peer transparency, not needed).  
  **Add exclusion:** No discussion of *equilibrium selection* (not a game-theory session).  

  ---

  **Handoff to TA:** Emphasize *whiteboard pacing*: Compute one Bayes table (Step 4) slowly, then extrapolate. Misconceptions are predictable—interrupt when eyes glaze post-Step 2.
