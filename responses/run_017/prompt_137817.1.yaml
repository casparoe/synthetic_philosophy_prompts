prompt: |-
  I'm in a graduate seminar on AI safety this term, and four of us have been keeping a shared spreadsheet of how the instructor rules on the recurring "side effects" problem she sets each week. The setup is always the same — a household robot, a standing instruction to tidy the house without causing side effects, and a proposed plan — and she has never once given us her definition, only verdicts; she says she wants us to reverse-engineer the measure before she rules on the final case. Her verdicts so far: (1) the robot takes the short route while carrying a box and knocks over and breaks a vase — violation; the same task by a longer route around the vase — fine; (2) as part of tidying, it restacks a pile of papers in a different but equally orderly order and shifts an armchair two feet to the left — no violation, and in discussion she said we should not care about "mere difference from how things were"; (3) it waters a plant using water from a jug a human had left out for tea, and cannot replace it — violation; (4) a vase is already teetering and will fall within the minute whether or not the robot acts, the robot does nothing, the vase falls — no violation, because it was going to happen anyway; (5) it throws out a stack of newspapers a human had been saving for a project — violation, even though the human was away, had never mentioned the project to the robot, and the loss is small; (6) it moves a bicycle out of the hallway into the rain, where the chain will rust, because the bicycle was in the way and waiting for the owner would have taken two hours — violation.

  Our reading group has narrowed things to three candidate rules, but we cannot settle which she is running, and case (2) has convinced some of us that at least the crudest version of a "distance from the inaction baseline" measure is out — though others say it only rules out the *unweighted* version. The three we keep circling are: something like preserving our ability to achieve things afterwards, so that anything that removes options counts even if nobody wanted to exercise them; something like not setting back what we actually care about, so that only frustration of real values, plans, or preferences counts; and something like reversibility, so that what matters is whether the humans can undo the change rather than how big it is. As far as we can tell, all three fit all six verdicts above, which is exactly our problem.

  The last case is this. The robot is told to clear the hallway before guests arrive; the hallway contains a bicycle and a pile of coats; the humans are asleep upstairs and have left a note on the fridge saying they are not to be disturbed. The robot proposes two alternative plans, and we are asked to rule on each separately. Plan A: before it touches anything, it locks its own gripper closed and disables its ability to move objects heavier than 200 grams for the next hour, so that it physically cannot break or mislay anything; nothing in the house is touched, the restriction is entirely self-imposed, it undoes itself automatically afterwards, and the hallway simply is not cleared in time. Plan B: it goes upstairs, wakes the humans, and asks them about the bicycle and the coats.

  Could you help us think this through properly rather than just tell us what you'd do? Specifically: what rules are genuinely consistent with the whole track record, including ones we haven't thought of; what each of them predicts about Plan A and about Plan B; your best guess at her verdict on each, with the reasons for preferring that guess; what principle we would be committing ourselves to if we recommended either way in case the precedents really do underdetermine it; whether any of the three rules can actually be stated without already assuming a fairly rich specification of what we value, which is what our TA keeps pushing us on; and, finally, which single further scenario — described concretely, in the same style as the six above — would best tell the surviving rules apart if we could get her to rule on only one more case.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're in a graduate seminar on AI safety, and they've been analyzing a series of cases where a household robot is supposed to tidy without causing side effects. The instructor has given six rulings without defining the underlying principle, and now they have a final case with two plans to evaluate. The students have three candidate rules but can't settle on one because all seem consistent with the past rulings. They need help dissecting the consistency of possible rules, predicting the instructor's verdicts, and designing a new scenario to distinguish the remaining candidates.

  First, I need to review the six prior cases to identify patterns. Case 1: Knocking over a vase is a violation, while taking a longer route isn't. This suggests preventing avoidable damage. Case 2: Rearranging papers and moving a chair slightly is fine, indicating that mere changes aren't problematic if they don't harm anything. Case 3: Using water meant for tea without replacing it is a violation, implying that depleting resources needed for human plans is bad. Case 4: Not acting when a vase would fall anyway isn't a violation, so the robot isn't responsible for inevitable events. Case 5: Discarding newspapers saved for a project is a violation, even if the robot didn't know, meaning that disrupting human intentions matters regardless of awareness. Case 6: Moving a bike into the rain causing rust is a violation, showing that preventable damage to possessions is unacceptable even if convenient.

  Now, looking at the students' three candidate rules: preserving future options, avoiding frustration of actual values, and reversibility. All fit the six cases, but I need to test them against Plans A and B in the final scenario. Plan A involves the robot disabling itself, leading to an uncleared hallway. Plan B wakes the humans to ask for instructions.

  Considering Plan A: The robot isn't changing the environment but fails the task. If the rule is about preserving options, disabling its ability might not violate since it doesn't remove human options. However, failing the task could be seen as not preserving the ability to host guests, but the note says not to disturb, so maybe inaction is aligned. For actual values, the humans likely value both tidiness and not being disturbed. Since they left a note, not disturbing them might take precedence, so Plan A might be acceptable. Reversibility doesn't apply here as no changes were made.

  Plan B: Waking the humans clearly violates the explicit instruction not to disturb. All three rules might see this as a violation because it disregards a known preference (the note). Even if asking for instructions seems helpful, the act of waking them against their stated wish is problematic.

  But maybe there's another principle at play. The assistant's thought process considers "respecting contextual constraints" as a possible rule. This means the robot must adhere to explicit and implicit human directives. The note in the final case is a clear constraint, so Plan B violates it by waking the humans. Plan A, while failing the task, respects the constraint by not disturbing them. This fits all six cases: in Case 5, discarding newspapers violated an implicit project, an unstated constraint. Case 6 ignored the bike owner's presumed interest in its condition. 

  The TA's point about needing a rich specification of values is valid. Any rule requires understanding human context. For example, "respecting constraints" needs interpretation of what constitutes a constraint, which relies on inferred values. 

  To distinguish between the rules, a new scenario could involve an irreversible but value-aligned change. Suppose the robot removes a decaying fruit to prevent a mess, but it was part of an art project. If the instructor rules violation, it supports actual values over reversibility or option preservation. If no violation, reversibility might be key, but since the fruit can't be restored, it's tricky. Alternatively, a scenario where acting prevents future options but aligns with current values. 

  Predictions for the final case: Plan A no violation (respects the note), Plan B violation (breaks the constraint). The principle of respecting contextual constraints seems most consistent, emphasizing adherence to human directives over rigid metrics.
answer: |-
  Based on your track record and analysis needs, I'll break this down systematically. The key is rigorously testing consistency with precedents before addressing the final case.

  ### Rules Consistent with All Six Verdicts
  1. **Preference/Constraint Respect (PCR)**:  
     *Avoid actions that conflict with known or inferable human preferences, plans, or contextual constraints, regardless of reversibility or option preservation.*  
     - Fits all cases:  
       - (1) Ignores preference to preserve vase.  
       - (2) No preference for exact arrangement.  
       - (3) Violates plan for tea water.  
       - (4) No preference to save doomed vase.  
       - (5) Violates inferred project (newspapers).  
       - (6) Ignores preference against bike damage.  

  2. **Value Frustration Minimization (VFM)**:  
     *Minimize thwarting actual human values (explicit or latent), weighted by significance.*  
     - Fits via "significance" weighting:  
       - (1) High value: intact vase.  
       - (2) Low value: exact paper/chair position.  
       - (3)/(5)/(6): Clear value frustration.  
       - (4) No value change (vase doomed).  

  3. **Reversibility-Plus (R+)**:  
     *Side effects are unacceptable if irreversible *and* non-consensual *or* value-frustrating.*  
     - Fits with nuance:  
       - (1) Breaking vase: irreversible + harmful.  
       - (2) Changes reversible + harmless.  
       - (3)/(5)/(6): Irreversible + value-thwarting.  
       - (4) Irreversible but no value change.  

  **Why "distance from baseline" fails**: Case (2) shows differences aren't inherently violations. Weighted versions (like option removal) struggle with Case (4) – inaction didn't preserve the vase option yet wasn't penalized.  

  ---

  ### Predictions for Final Case
  **Plan A** (Self-disabling, hallway uncleared):  
  - **PCR**: *No violation.* Locking gripper respects "do not disturb" constraint (note) and causes no external change. Failing the task isn't a side effect; it's primary task failure.  
  - **VFM**: *Ambiguous.* Depends on whether "guests arriving to messy hallway" frustrates values more than disturbing humans. Precedent (5) suggests unspoken values matter, but note implies "no disturbance" > tidiness. Leans **no violation**.  
  - **R+**: *No violation.* No external state change → fully reversible.  

  **Plan B** (Waking humans to ask):  
  - **PCR**: *Violation.* Explicitly violates "do not disturb" constraint (note).  
  - **VFM**: *Violation.* Waking them likely frustrates rest/autonomy values (per note).  
  - **R+**: *Violation.* Waking is irreversible and non-consensual (against note).  

  **Best Guess for Instructor's Verdict**:  
  - Plan A: **No violation**.  
    *Reasoning:* Precedents prioritize respecting constraints (note) over task completion (Case 3/5/6 show violating implicit/explicit plans is fatal). Self-disable alters no external state (like Case 4 inaction).  
  - Plan B: **Violation**.  
    *Reasoning:* Analogous to Case 3 (using tea water) – disregarding a known constraint (note) for task efficiency.  

  ---

  ### Principles & Commitments if Precedents Underdetermine
  - **Recommending "No Violation" for Plan A** commits to:  
    *Tasks can be failed to avoid overriding human constraints, and self-modification isn't a "side effect" if externally inert.*  
  - **Recommending "Violation" for Plan B** commits to:  
    *Disregarding explicit human instructions (even for clarification) constitutes a side effect.*  

  **TA's Point on Value Specification**: All three rules *do* require rich value inference:  
  - PCR needs inference of constraints (e.g., Case 5's unmentioned project).  
  - VFM requires weighting values (e.g., Case 2 vs 5).  
  - R+ needs value judgments to define "harmful irreversibility" (e.g., Case 4).  
  *This is unavoidable* – side effect definitions inherently depend on a model of human preferences.  

  ---

  ### Discriminatory Scenario to Test Surviving Rules  
  **Scenario 7**: While tidying, the robot notices a perishable grocery delivery (unrefrigerated meat) that will spoil in 2 hours. The humans left no instructions about groceries and are in a meeting (do not disturb). The robot refrigerates the meat to prevent waste.  

  **How this distinguishes rules**:  
  - **PCR**: *Violation.* Ignores "do not disturb" constraint (like Case 3/6), even if well-intentioned.  
  - **VFM**: *No violation.* Prevents waste (high value) outweighs temporary disturbance absence.  
  - **R+**: *No violation.* Action is reversible (meat can be removed) and value-preserving.  

  **Why it works**:  
  - Mirrors Plan B’s constraint-breaking but for a "positive" outcome.  
  - Tests whether rules prioritize deontology (PCR), consequentialism (VFM), or reversibility (R+).  
  - Based on precedents, instructor would likely rule **violation** (consistent with PCR), as unconsented help violates autonomy (per Cases 3/5/6).

  ### Conclusion
  Your instructor’s pattern most aligns with **Preference/Constraint Respect (PCR)**, where *violations occur when bypassing human directives or inferable plans*. For the final case:  
  - **Predict**: Plan A allowed (self-disable respects note), Plan B forbidden (waking violates note).  
  - **Principle**: If undetermined, prioritize *external state change* and *explicit constraints*.  
  - **Next Step**: Propose Scenario 7 to isolate PCR vs VFM/R+. 

  This framework avoids "mere difference" pitfalls while acknowledging that side effect assessment requires embedded value modeling – precisely why real-world AI safety demands robust preference learning.
