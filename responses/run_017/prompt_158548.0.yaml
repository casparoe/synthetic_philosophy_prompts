prompt: |-
  Me and a few friends run a war-film night at the library: we watch something, then argue for two hours, and lately we keep going in circles on one thing. Two soldiers are shooting at each other across a border. One side's war is actually unjust, but both soldiers honestly and reasonably believe their own side is in the right. Are they doing the same thing morally? Is it equally ok for each of them to pull the trigger, and equally ok for each to be shot?

  Someone told me this has a name, something like the moral equality of combatants, and from poking around online I gather the "obvious" answer (both are just doing their job, so they're on a par) is actually the contested one, and that the people who reject it then fight among themselves about *why*. I'd love a one-page flowchart for the group: you answer ten or so plain questions and land on a named position.

  What I need from you:

  Build it from the questions, not from a list of views you already know — give me the branch points first, then say which actual positions sit at which leaf, and mark any combination of answers nobody seems to hold (and whether that's because it's incoherent, just unattractive, or only unexplored).

  Rules for the nodes:
  - Nobody should have to know any philosophy to answer. So no "do you think combatants have equal moral standing?" — that's just asking for the label. Every node should be a case or a claim my group would recognise from a film.
  - There should be a pacifist / "no one may ever kill" exit near the top so the rest of the tree isn't wasted on someone who answers that way.

  Cases I definately want used as branch points (you can add two or three of your own, and tell me if any of mine are useless as diagnostics and why):
  - the conscript who was dragged in at gunpoint, lied to about why the war is being fought, and would have deserted if he'd known the truth;
  - the volunteer who joined for the money and doesn't care about the cause either way;
  - the unjust side's soldier who is currently asleep in barracks, or walking home on leave, and threatens no one right now;
  - the medic who only patches soldiers up and has never fired a shot;
  - the civilian programmer who writes targeting software she knows is used for the invasion, but never touches a weapon;
  - the voter who voted for the government that started it (my mate Dave thinks this one is a reductio, I'm not sure it is);
  - the soldier on the *just* side who joined because he enjoys killing, and whose targets really are liable;
  - the case where you honestly can't tell from where you're standing which side is in the right;
  - the case where both sides are partly in the wrong — is everybody killable then, and does that land you in the same place as the "equal anyway" people for a totally different reason?

  Things I especially want handled, because our arguments keep hinging on them:
  - whether it's the *facts* about the war or the soldier's *evidence* that does the work, and whether a soldier who is reasonable but wrong is someone it's ok to shoot;
  - whether being killable tracks what you're responsible for, or just the fact that you're a threat right now (I think someone online called the second one something like no-fault liability);
  - whether "he put on a uniform, he signed up for it" is a real answer or a dodge;
  - my friend's argument that whatever is true, treating both sides as equally killable shortens wars and saves lives, so that's the rule we should publicly use even if it isn't quite fair to the individual;
  - Dave's other hobby-horse: even when killing is permissable you owe something afterwards — he calls it the left-over, the bit you can't wash off — and I want to know whether that's a separate branch or just a footnote on every leaf.

  For each leaf give me the name if the position has one (say "unnamed" if it doesn't), one sentence on the most awkward thing a holder has to swallow, and one sentence each on what it says about the conscript and about the programmer, so we can compare leaves directly. Also flag any two leaves the tree can't really seperate, and tell me what extra question would split them, or say there isn't one.
reasoning: |-
  Okay, the user wants a flowchart for their war-film night group to resolve debates about the moral equality of soldiers in war. They've provided specific scenarios they want included, like conscripts, volunteers, medics, programmers, and others. The goal is to create a decision tree with plain-language questions that don't require philosophy knowledge, starting with a pacifist exit.

  First, I need to consider the user's main concerns: whether facts vs. evidence matter, responsibility vs. immediate threat, "he signed up for it" arguments, pragmatic rules, and Dave's "left-over" guilt idea. The flowchart should address these through the branches.

  Starting with the pacifist option makes sense since it's a clear early exit. Then, the tree should branch based on whether killing is ever permissible. If no, pacifism. If yes, then move to the core question about the two soldiers. 

  The key branch points should test different principles. For instance, asking if the injustice of the war affects the soldier's moral status. If no, that leads to Moral Equality of Combatants (MEC). If yes, then further questions about evidence vs. facts, like the "reasonable but mistaken" soldier scenario. 

  Including the user's specified cases is crucial. The conscript lied to and the volunteer for money can differentiate positions. The asleep soldier tests immediacy of threat. The medic and programmer help explore non-combatant roles. The voter case might be a reductio but needs inclusion. The soldier who enjoys killing on the just side examines motives. The uncertain and mixed-fault wars address complexity.

  For the "left-over" guilt, it's a separate axis. After determining permissibility, ask if guilt remains. This applies to all leaves except pacifism. Dave's point adds depth without complicating the main branches.

  Need to ensure each question is accessible. For example, "Can you kill a soldier who's asleep?" instead of philosophical jargon. The positions at the leaves should be named where possible, with their challenges and responses to the conscript and programmer cases.

  Check for any incoherent paths. For instance, if someone answers that only threats can be killed, but then says the asleep soldier can't be killed, that's consistent with Instrumentalism. If they say the asleep soldier can be killed, it might lead to Total War or MEC.

  Also, handling cases where both sides are partly wrong. If all combatants are liable, it might converge with MEC but for different reasons. Need a branch that asks if liability applies regardless of side, leading to the Unjustified War Liability position.

  Finally, flag any positions the tree can't separate. For example, Instrumentalism and MEC both might say the asleep soldier can't be killed, but differ on the programmer. A question about the programmer's liability could split them further.
answer: |-
  Here's your flowchart built from the ground up using film-night cases. Answer each question based on **what you think is morally permissible**, not just what happens in war.

  **PACIFIST EXIT:**  
  **Q1: Is it ever morally okay for one soldier to deliberately kill another soldier in war?**  
  *   **No** → **Pacifism**  
      *   *Awkward thing:* Must condemn historical resistance against clear evils (e.g., stopping Nazis).  
      *   *Conscript:* Killing him is wrong.  
      *   *Programmer:* Killing her is wrong.  
  *   **Yes** → Go to Q2.

  **CORE QUESTION:**  
  **Q2: Imagine two soldiers, one on the just side, one on the unjust side. Both honestly and reasonably believe their side is right. Are they equally morally okay to kill each other?**  
  *   **Yes** → Go to Q3 (Moral Equality Path).  
  *   **No** → Go to Q4 (Inequality Path).

  ---

  **PATH 1: MORAL EQUALITY OF COMBATANTS (MEC) PATH**  
  **Q3: Why are they equal? Is it mainly because...**  
  *   **A: ...they are both doing their job/serving their country? Or B: ...they are both immediate threats to the other soldier?**  
      *   **A (Job/Duty)** → Go to Q3a.  
      *   **B (Immediate Threat)** → Go to Q3b.

      **Q3a: What about the conscript who was lied to and dragged in at gunpoint? Is it still okay for the just soldier to kill him?**  
      *   **Yes** → **Traditional MEC**  
          *   *Awkward thing:* Killing a completely deceived and coerced pawn is permissible.  
          *   *Conscript:* Killing him is okay.  
          *   *Programmer:* Not directly targetable (not a combatant).  
      *   **No** → **Modified MEC (Focus on Role/Status)**  
          *   *Awkward thing:* Distinguishing genuinely deceived/coerced soldiers in the heat of battle is impossible.  
          *   *Conscript:* Killing him is *not* okay.  
          *   *Programmer:* Not directly targetable.

      **Q3b: What about the unjust soldier asleep in barracks? Not an immediate threat. Is it okay to kill him?**  
      *   **Yes** → **Total War / MEC+**  
          *   *Awkward thing:* Bombing sleeping soldiers in their bunks is permissible warfare.  
          *   *Conscript:* Killing him (awake or asleep) is okay.  
          *   *Programmer:* Likely targetable as contributing to the war effort.  
      *   **No** → **Instrumentalist MEC / Combatant Privilege**  
          *   *Awkward thing:* Lets unjust soldiers "reset" their liability every night when they sleep.  
          *   *Conscript:* Killing him *in combat* is okay.  
          *   *Programmer:* Not directly targetable.

  ---

  **PATH 2: INEQUALITY PATH**  
  **Q4: Why aren't they equal? Is it mainly because...**  
  *   **A: ...the unjust soldier is fighting for a bad cause? Or B: ...the unjust soldier lacks a good justification for threatening others?**  
      *   **A (Bad Cause)** → Go to Q4a.  
      *   **B (Lacks Justification)** → Go to Q4b.

  **Q4a: What matters most: the actual facts about the war, or the soldier's reasonable belief?**  
  *   **Actual Facts** → Go to Q4a1.  
  *   **Reasonable Belief** → Go to Q4a2.

      **Q4a1: What about the unjust soldier who is reasonable but wrong? Is it okay for the just soldier to kill him?**  
      *   **Yes** → **Objective Liability**  
          *   *Awkward thing:* Permits killing soldiers who are morally blameless (reasonable & deceived).  
          *   *Conscript:* Killing him is okay (facts trump his ignorance).  
          *   *Programmer:* Likely *not* targetable (not directly harming).  
      *   **No** → **Unnamed (Rare - Facts Matter but Blamelessness Protects?)**  
          *   *Awkward thing:* Makes it very hard to justify killing *any* unjust soldier unless you prove they know they're wrong.  
          *   *Conscript:* Killing him is *not* okay.  
          *   *Programmer:* Not targetable.

      **Q4a2: What about the soldier on the *just* side who joined because he enjoys killing, though his targets are liable? Is he still okay to kill?**  
      *   **Yes** → **Moral Status View (Unnamed)**  
          *   *Awkward thing:* Permits soldiers motivated purely by bloodlust to kill as long as their side is just.  
          *   *Conscript (if on unjust side):* Killing him is *not* okay (he's reasonable).  
          *   *Programmer (unjust side):* Not targetable.  
      *   **No** → **Motivational Liability**  
          *   *Awkward thing:* Requires assessing soldiers' motives, not just their actions or side.  
          *   *Conscript:* Killing him is *not* okay (coerced, not culpable).  
          *   *Programmer:* Not targetable.

  **Q4b: What makes someone killable? Is it mainly...**  
  *   **A: ...being responsible for an unjust threat? Or B: ...posing an unjust threat right now?**  
      *   **A (Responsibility)** → Go to Q4b1.  
      *   **B (Current Threat - "No-Fault Liability")** → Go to Q4b2.

      **Q4b1: Is the volunteer who joined just for the money on the unjust side responsible enough to be killable?**  
      *   **Yes** → **Culpability-Based Liability**  
          *   *Awkward thing:* Makes mercenaries on the unjust side more liable than deceived patriots.  
          *   *Conscript:* Killing him is *not* okay (low responsibility).  
          *   *Programmer:* *Possibly* targetable if her contribution is significant and knowing.  
      *   **No** → **High Culpability Threshold (Unnamed)**  
          *   *Awkward thing:* Very few soldiers (only leaders/fanatics) are actually liable to be killed.  
          *   *Conscript:* Killing him is *not* okay.  
          *   *Programmer:* Not targetable.

      **Q4b2: What about the medic on the unjust side (never fired a shot, only patches people up)? Is he posing an unjust threat?**  
      *   **Yes** → **Functional Threat View**  
          *   *Awkward thing:* Permits killing medics, cooks, etc., as they sustain the fighting force.  
          *   *Conscript:* Killing him *in combat* is okay.  
          *   *Programmer:* Likely targetable as part of the threat-sustaining apparatus.  
      *   **No** → **Direct Threat Liability**  
          *   *Awkward thing:* Lets people like artillery crews (not "direct") or drone pilots (remote) off the hook.  
          *   *Conscript:* Killing him *in combat* is okay (he's a direct threat).  
          *   *Programmer:* Not targetable (not posing threat directly).

  **SHARED BRANCHES**  
  **Q5: What if you honestly can't tell which side is just?**  
  *   **Neither can be killed (or extreme caution required)** → Applies to *all* positions rejecting MEC (Inequality Path), creating significant practical problems.  
  *   **Both can be killed (status quo)** → Fits MEC Path positions naturally.

  **Q6: What if both sides are partly in the wrong?**  
  *   **All combatants might be liable** → Can converge with **Traditional MEC** or **Total War**, but for different reasons (general liability vs. status/threat).  
  *   **Need to assess individual liability carefully** → Fits **Culpability-Based Liability**, **High Culpability Threshold**, etc.  
  *   **Makes killing even harder to justify** → Fits Pacifism, Unnamed (Facts Matter but Blamelessness Protects?), Motivational Liability.

  **Q7: What about the voter who voted for the war?**  
  *   **Not directly targetable** → Almost all positions (except extreme **Total War** / **Functional Threat** views). Acts as a *reductio* against overly broad liability.  
  *   **Potentially responsible/liable** → Only **Culpability-Based Liability** or **Functional Threat View** *might* see indirect liability, but killing would still be disproportionate/not necessary. Dave's right - it's usually a *reductio*.

  **Q8 (Dave's "Left-Over"): Even if killing is permissible, does the killer still incur some moral burden or "dirty hands"?**  
  *   **Yes** → Applies as a **separate axis** to *every leaf* except **Pacifism**. (e.g., "Killing the unjust soldier was necessary but still morally tragic/burdensome").  
  *   **No** → Permissible killing leaves no moral residue.

  ---

  **Key Diagnostics & Awkwardnesses Recap:**

  | Position                  | Key Diagnostic Cases                                                                                                  | Awkward Thing to Swallow                                     | Conscript (Unjust Side) | Programmer (Unjust Side)         |
  | :------------------------ | :-------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------- | :---------------------- | :------------------------------- |
  | **Pacifism**              | Q1: No killing ever.                                                                                                  | Condemns killing Nazis to stop death camps.                  | Can't be killed.        | Can't be killed.                 |
  | **Traditional MEC**       | Q3a: Yes (Kill deceived conscript).                                                                                   | Killing a deceived/coerced pawn is okay.                     | Can be killed.          | Not targetable.                  |
  | **Modified MEC (Role)**   | Q3a: No (Don't kill deceived conscript).                                                                              | Distinguishing coercion/deception mid-battle is impossible.  | Can't be killed.        | Not targetable.                  |
  | **Total War / MEC+**      | Q3b: Yes (Kill asleep soldier).                                                                                       | Bombing sleeping soldiers is okay.                           | Can be killed.          | Likely targetable.               |
  | **Instrumentalist MEC**   | Q3b: No (Can't kill asleep soldier).                                                                                  | Liability "resets" daily for unjust soldiers.                | Can be killed (in fight)| Not targetable.                  |
  | **Objective Liability**   | Q4a1: Yes (Kill reasonable-but-wrong soldier).                                                                        | Permits killing morally blameless soldiers.                  | Can be killed.          | Likely not targetable.           |
  | **Unnamed (Facts/No Kill)**| Q4a1: No (Don't kill reasonable-but-wrong).                                                                           | Hard to justify killing *any* unjust soldier.                | Can't be killed.        | Not targetable.                  |
  | **Moral Status View**     | Q4a2: Yes (Enjoy-killing just soldier can kill).                                                                      | Bloodlust is okay if your side is just.                      | Can't be killed.        | Not targetable.                  |
  | **Motivational Liability**| Q4a2: No (Enjoy-killing just soldier *not* okay to kill).                                                              | Requires assessing soldiers' secret motives.                 | Can't be killed.        | Not targetable.                  |
  | **Culpability-Based**     | Q4b1: Yes (Mercenary on unjust side killable).                                                                        | Mercenaries more liable than deceived patriots.              | Can't be killed.        | *Possibly* targetable.           |
  | **High Culpability**      | Q4b1: No (Mercenary not killable).                                                                                    | Very few soldiers are actually liable (leaders/fanatics).    | Can't be killed.        | Not targetable.                  |
  | **Functional Threat**     | Q4b2: Yes (Unjust medic is a threat).                                                                                 | Permits killing medics, cooks sustaining the force.          | Can be killed (in fight)| Likely targetable.               |
  | **Direct Threat Liability**| Q4b2: No (Unjust medic *not* a threat).                                                                               | Lets indirect threats (artillery, drone pilots) off the hook.| Can be killed (in fight)| Not targetable.                  |

  **Indistinguishable Positions & Splitting Questions:**
  1.  **Instrumentalist MEC vs. Direct Threat Liability:** Both say asleep soldier NO, unjust medic NO. **Split with Programmer:** Ask *"Is the programmer helping pose an immediate threat?"* Instrumentalist MEC likely says NO. Direct Threat Liability definitely says NO. They agree! **True Split:** Ask *"Why is the fighting soldier targetable?"* Instrumentalist: Status/Role. Direct Threat: Posing threat *right now*. Or use **Conscript:** Instrumentalist MEC says kill him (role); Direct Threat might hesitate if he's trying to surrender/hide.
  2.  **Traditional MEC vs. Objective Liability:** Both say kill the deceived conscript. **Split with Motive:** Ask about the **soldier who enjoys killing on the just side**. Traditional MEC: Permissible. Objective Liability: Likely also permissible (facts about target matter, not killer's motive). **True Split:** Ask *"Is the voter responsible?"* Both say NO, but **Q4a (Why Inequality?)** already split them: Traditional MEC is on the Equality Path, Objective Liability on the Inequality Path.

  This flowchart forces your group to confront the underlying principles (threat, status, responsibility, knowledge) through concrete cases, revealing why the "obvious" answer is contested and where the real disagreements lie. Use Dave's "left-over" as a final reflection question after landing on a leaf. Good luck with the arguments!
