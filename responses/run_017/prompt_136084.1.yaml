prompt: |-
  You are a professional philosopher who specialises in philosophy of economics — welfare economics, decision theory, the interpretation of utility. Take this seriously and think carefully, step by step. Before you write the actual answer, brainstorm for me: sketch four or five candidate reconstructions of what the practice below presupposes, including a couple you're going to end up rejecting, and say in a line or two why each rejected one fails. Then give me the reconstruction you'd stand behind. I'd rather have the reasoning than the conclusion, because I'm going to paraphrase it and I need to know which bits are load-bearing.

  I'm a journalist, I cover science and ideas, and I'm months into a piece about how governments decide what your time, your health and your life are worth. I've been reading guidance documents and interviewing economists and I keep getting two completely opposite stories. One economist tells me the numbers have nothing to do with anybody's well-being — utility here is just a convenient way of writing down a consistent ranking of choices, a bookkeeping device with no mental content at all. The next one tells me of course it's utility, that's the entire point, we're totalling up how much better off people would be. My hunch is that they're both right depending on what "utility" is taken to mean, and that the practice itself can't tell me which — but I want you to work out what it actually needs utility to be.

  Here's the practice as I understand it. Please take my description at face value and argue from it, even if I've got some detail slightly wrong.

  A transport ministry wants to know whether a new rail line is worth building. Nearly everything on the benefit side is stuff nobody buys and sells: an hour of travel time saved, a small reduction in the chance of dying in a crash, cleaner air, a bit of quiet. So the numbers get backed out of behaviour. How much extra do people pay to travel faster — tolled road versus free road, fast train versus slow bus? How much extra wages do workers in dangerous jobs get paid compared with similar workers in safe ones? From that you get a value per hour and a value per statistical life. Then the same number gets applied to everybody: your hour is worth what my hour is worth, regardless of how much either of us earns. But the number is scaled up every year in line with income growth, so a life in 2050 is worth more than a life today. Benefits on the far side of a few decades get discounted at a few percent a year. Everything is added up in money, compared to costs, and if the total is bigger the project goes ahead — and nobody ever has to actually pay anything to the people who lose out, it's enough that the winners could in principle compensate them.

  Two wrinkles. First: for things with no market at all but that people obviously care about — how far you can see from a trail, whether a rare bird goes extinct — the same government runs surveys and asks people what they would pay, and uses the answers. But when people are asked what they would need to be paid to accept losing something they already have, those numbers come back several times bigger and get thrown out as inflated and hypothetical. Second: the same agencies that treat your choices as the evidence of what's good for you when you're a commuter or a worker treat your choices as something to be corrected when you're a smoker, a saver or a snacker — sin taxes, automatic enrolment in pensions, calorie labels, nudges everywhere. My choices reveal my utility in one filing cabinet and corrupt it in another.

  So: what does this pattern presuppose about what it is for someone to be made better off? Reconstruct the implicit theory. Then separate three things for me, because I think this is where my sources are talking past each other:

  — What does the arithmetic strictly require? Could the deflationary "as if" reading — utility as nothing but a numerical representation of a choice ordering — actually license all of it, including the money metric, the single number per person, and the summing across people? Or does summing WTP across different people force a commitment the as-if reading can't give you, like cardinal and interpersonally comparable utility?

  — What does the practice merely fit well with, versus commit you to? In particular: does counting only what people pay, rather than what they'd accept, presuppose that the existing distribution of entitlements is the right baseline, and if so is that a claim about welfare or a claim about rights? And does the refusal to weight by income sit badly with the diminishing marginal utility of money that the money metric is supposed to lean on?

  — Where is it simply underdetermined? The discount rate is the case I can't stop thinking about: the same number is compatible with pure time preference, with the opportunity cost of capital, and with the assumption that future people will be richer and so care less about money. Those are wildly different moral commitments and none of them shows up in the number. What else is like that?

  Then two consequences. Tell me what would actually have to change in the arithmetic if the presupposed view were swapped for a happiness or experienced-wellbeing metric of the kind some governments now use, and separately for a view on which what matters is what people are able to do and be rather than what they prefer. I don't mean "the philosophy would be different" — I want to know which numbers would move, and in which direction.

  Last thing, and it's the part I suspect is the actual story. Someone pitched me a scheme they call "revealed welfare accounting": fit one utility function per person to everything they actually do — purchases, commutes, clicks, who they marry — out of administrative data, no surveys at all, then rank policies by total utils. They say this dodges both the hypothetical bias of stated-preference surveys and the shallowness of asking people how happy they are. Is that genuinely a third option, or is it just the existing practice with better data? And does the practice I've described already contain something that would rule it out — the status quo baseline, the fact that the options people face are usually lousy and unequally distributed, or something about informed preference?

  And please, no reading lists, paper recommendations or citations — I can't get behind the paywalls and I want to be able to use your argument directly. Argue it out from the practice itself.
reasoning: |-
  Hmm, this is a rich and complex query from a journalist diving deep into the philosophy behind economic valuation practices. The core tension they're grappling with is between revealed preference (where utility is just a representation of choices) and experienced welfare (where utility reflects actual well-being). They've described government cost-benefit analysis in detail - how they value time, life, and environmental goods using market behaviors and surveys, with some puzzling inconsistencies.

  Let me unpack their four main requests: First, reconstruct the implicit theory of welfare in standard practice. Second, analyze what the arithmetic strictly requires versus what it merely fits with versus what's underdetermined. Third, explore consequences of switching to alternative welfare metrics. Fourth, evaluate "revealed welfare accounting."

  For the implicit theory reconstruction, I see several possibilities:
  - The orthodox revealed preference view (utility as choice representation) fails because it can't justify interpersonal comparisons or discounting without smuggling in welfare content.
  - A welfarist view (utility as well-being) struggles with why we ignore ability-to-pay and hypothetical WTA.
  - The status quo entitlement view explains WTP>WTA asymmetry but conflicts with paternalism elsewhere.
  - The pragmatic operationalism view (whatever works for policy) ignores internal contradictions.

  The actually presupposed view is a hybrid: utility as preference-satisfaction measured by opportunity cost under current constraints, with three key features: (1) welfare is defined by what people reveal they want through tradeoffs, (2) the money metric assumes constant marginal utility of income, (3) the status quo defines the baseline for compensation tests.

  On the arithmetic requirements: 
  - Summing WTP across people absolutely requires cardinal and comparable utility, which the "as if" view can't provide without circularity. 
  - The money metric and discounting aren't mere conventions - they imply substantive claims about welfare.

  On what's underdetermined: 
  - The discount rate hides at least three distinct moral premises about time preference, opportunity cost, and future wealth. 
  - Similarly, the equal per-person valuation obscures whether we're measuring welfare or respecting autonomy.

  For alternative metrics: 
  - Switching to happiness metrics would require fundamentally recalculating values (e.g., commute time might be worth less if people adapt, safety more if fear diminishes welfare). 
  - Capability approaches would shift focus from preferences to functionings, making valuations context-dependent and possibly overriding choices.

  Finally, the "revealed welfare accounting" proposal: 
  - This isn't meaningfully different from current practice - it still inherits all the philosophical problems of inferring welfare from constrained choices under inequality. 
  - The key flaw is assuming administrative data reveals "true" preferences when people face systematically limited options.

  Throughout this, I need to avoid academic citations and focus strictly on arguing from the described practices. The journalist wants load-bearing arguments they can paraphrase, not literature surveys. The most important insight is that current practice isn't philosophically neutral - it silently presupposes a specific, contestable view of welfare as preference satisfaction measured by market behavior.
answer: |-
  Here’s a step-by-step reconstruction of the implicit theory of welfare in your described practice, followed by analysis of its commitments, underdetermined aspects, consequences of alternative views, and evaluation of "revealed welfare accounting." I’ll first sketch candidate reconstructions (including rejected ones), then defend the most plausible one, and finally address your specific questions.

  ---

  ### **Candidate Reconstructions of the Presupposed Welfare Theory**  
  *(Briefly, why some fail)*  

  1. **"As-If" Ordinalism** (Rejected):  
     Utility is *only* a numerical representation of consistent choices, with no mental or well-being content.  
     *Failure:* Cannot justify **summing money values across people** (requires cardinal, comparable utility) or **discounting future utils** (assumes utils represent something that can be "weighed" over time).

  2. **Hedonic Utilitarianism** (Rejected):  
     Utility reflects subjective happiness/experienced well-being.  
     *Failure:* Contradicts **ignoring WTA (willingness-to-accept)** surveys (if welfare is hedonic, losses should matter more due to loss aversion) and **not weighting by income** (if money has diminishing marginal utility for happiness, the rich should value money less).

  3. **Status Quo Entitlement Theory** (Rejected):  
     Welfare is defined by voluntary exchanges from a morally neutral baseline.  
     *Failure:* Conflicts with **paternalism** (e.g., sin taxes) and **non-market valuation** (e.g., rare birds). If the baseline is sacrosanct, overriding choices or assigning value to non-owned goods is incoherent.

  4. **Preference-Satisfaction Welfarism** (Defended):  
     Welfare is the satisfaction of informed, rational preferences, revealed through choices under constraints. Money measures opportunity cost.  

  ---

  ### **Defended Reconstruction: Preference-Satisfaction Welfarism**  
  The practice presupposes that **welfare consists in satisfying people’s stable, contextually revealed preferences, measured by their willingness to pay (WTP) from their current endowment**.  
  - **Why WTP?** The baseline is the status quo: you "own" your time/health, so benefits are measured by what you’d pay to gain improvements (not what you’d accept to lose them).  
  - **Equal per-person value?** Assumes preferences are comparable and the marginal utility of money is constant (more below).  
  - **Discounting?** Future preferences matter less because capital could yield returns today (opportunity cost), or society prefers present welfare.  
  - **Paternalism?** Smokers/savers have "corrupted" preferences (misinformed, irrational), so their choices don’t reveal true welfare. Commuters’ choices are "clean."  

  **Load-bearing pillars**:  
  1. Welfare is *defined by preferences*, not feelings or capabilities.  
  2. Preferences are *revealed through real tradeoffs* (not surveys).  
  3. The *status quo distribution is the welfare baseline* (no need for compensation).  
  4. Money is a *cardinal, interpersonally comparable proxy* for preference intensity.  

  ---

  ### **Analysis of Commitments vs. Underdeterminacy**  

  #### **1. What the arithmetic strictly requires**  
  - **Summing WTP forces cardinal, comparable utility**. The "as-if" reading fails here: adding money values across people assumes £1 for Alice = £1 for Bob in welfare terms. If utility is only ordinal, summing is nonsense.  
  - **Money metric implies constant marginal utility of money**. Equal value per hour/life, unweighted by income, assumes £1 brings the same welfare gain to all. This contradicts diminishing marginal utility (a core justification for money metrics!).  
  - **Discounting requires discounting *utility***. If future utils are worth less, utility isn’t just a label—it’s a quantity that can be devalued over time.  

  #### **2. What the practice fits with vs. commits to**  
  - **WTP > WTA**: Fits *either* (a) a welfare claim (loss aversion distorts preferences) *or* (b) a rights claim (status quo defines entitlements). The practice *commits* to (b): the baseline is morally neutral, so only gains are measured.  
  - **No income weighting**: Fits the assumption of constant marginal utility of money. But this *contradicts* the welfarist rationale for money metrics (where £1 should matter less to the rich). The practice thus prioritizes *procedural fairness* (equal voice) over welfare accuracy.  

  #### **3. Where it’s underdetermined**  
  - **Discount rate**: Could reflect pure time preference ("future welfare matters less"), opportunity cost ("invest now, help more later"), *or* rising wealth ("future £1 is worth less"). These imply opposite moral stances (e.g., devaluing future lives vs. efficient investment).  
  - **Valuing non-market goods**: Using surveys assumes stated WTP reveals true preferences, but discarding WTA implies the baseline is fixed. No principle dictates which "wins."  
  - **Paternalism**: No consistent rule for when choices "reveal" vs. "corrupt" utility. It’s arbitrary without a theory of rational preference.  

  ---

  ### **Consequences of Alternative Welfare Theories**  

  #### **Switching to a happiness metric** (e.g., life satisfaction surveys):  
  - **Numbers moving**:  
    - Commute time savings ↓ (people adapt to long commutes; happiness gains are small).  
    - Safety/clean air ↑ (fear of death/pollution reduces happiness disproportionately).  
    - Discount rate ↓ (if future happiness is equally valuable).  
  - **Structural shift**: Projects helping low-income/chronically ill people ↑ (happiness gains are larger for them).  

  #### **Switching to capabilities** (e.g., what people can do/be):  
  - **Numbers moving**:  
    - Non-market goods (parks, bird species) ↑ if they enable functionings (e.g., recreation, meaning).  
    - Time savings for caregivers ↑ (enables relationships).  
    - Discount rate ↓ (future capabilities matter equally).  
  - **Structural shift**: Focus shifts from aggregate WTP to reducing inequalities in capabilities (e.g., transit for disabled users weighted more).  

  ---

  ### **Evaluating "Revealed Welfare Accounting"**  
  This is **not a third option**—it’s the existing practice with more data.  
  - **Same presuppositions**: It still assumes (1) choices reveal welfare, (2) the status quo is baseline, (3) utils are cardinal/comparable.  
  - **Same flaws**:  
    - **Constrained choices**: If people face "lousy options" (e.g., dangerous jobs due to poverty), "revealed" utility encodes injustice.  
    - **Paternalism paradox**: If you fit utility functions to all choices, smoking/clicks must count as "welfare." But the practice rejects this when it nudges.  
    - **No escape from interpersonal comparison**: Summing utils still requires comparing Alice’s utils to Bob’s.  
  - **What rules it out?** The practice’s **baseline dependence**: Valuing *changes* from the status quo requires knowing what people would trade now. "Revealed welfare" extrapolates from past data, but if policies alter constraints (e.g., build a park), preferences may change.  

  ---

  ### **Conclusion: The Load-Bearing Insights**  
  1. **Utility is preference-satisfaction, not happiness**: The core commitment.  
  2. **Money measures opportunity cost under the status quo**: Justifies WTP, not WTA.  
  3. **Cardinality/comparability are smuggled in**: Summing WTP is welfarist, not "as-if."  
  4. **Practice is morally modular**: Discount rates/WTP baselines hide value judgments; the math doesn’t resolve them.  
  5. **Alternatives change outputs**: Happiness metrics upweight health/equality; capabilities upweight freedom/agency.  
  6. **"Revealed welfare" is old wine in new bottles**: It inherits all philosophical problems of inferring welfare from constrained choices.  

  **Why this matters for your piece**: The "two stories" conflict because economists conflate *operational utility* (a choice-ranking tool) with *welfare utility* (a well-being measure). The practice uses the latter but pretends it’s the former. The numbers *do* imply a theory of welfare: preference-satisfaction, measured by money, under unequal real-world constraints.
