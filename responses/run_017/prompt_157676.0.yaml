answer: |-
  Here's the sestina, crafted to embody the metaphysical tension:

  **Sestina for the Mosaic**

  This mosaic world, a scattered, bright array –  
  Each point of fact, a solitary grain.  
  No hidden glue compels the next event,  
  No secret force demands the match must light.  
  The pattern forms from what *has* happened, true,  
  But calls it *law*? What governs chance's fall?

  Is every future just a random fall  
  From prior states arranged in strict array?  
  If so, what makes the statement deeply true  
  That salt dissolves? Just patterns in the grain?  
  What governs if no hidden hand applies,  
  Explaining why the unstruck match *would* light?

  Consider that potential, poised to light:  
  Does its mere chance imply a deeper law?  
  Some say the properties themselves apply  
  An inward force, a necessary grain  
  Embedded in the salt, a knowing power  
  That *makes* its dissolution always true.

  But is this "always," this necessity true,  
  More than the record shows? A borrowed light?  
  Perhaps the "power" is the pattern's name,  
  The best description of the chance-filled fall  
  Of circumstance. The system finds the grain  
  That lets us say "It *will*," and thus applies...

  A second-order tie? What *is* this "must" that applies  
  Between the types? Does it hold fast and true  
  Beyond the instances that mark the grain?  
  Or is it, too, a gleam from reason's light,  
  Projected on the world's contingent fall –  
  A useful fiction answering to "law"?

  **Envoi**

  The unwritten law the unstruck match contains  
  Would light a fire where no event applies,  
  A hidden grain in chance's true, blind fall.

  ---

  **Briefing Note (For the Pub):**

  1.  **End-Words:** `fall, array, true, light, law, grain`  
      *(Contested: law, true [necessity], grain [Humean mosaic vs. fundamental structure]; Concrete: light [match], fall [contingency/consequence], array [mosaic])*
  2.  **Mapping the Debate:**
      *   **Humean Stanzas:** Primarily Stanza 1 (scattered points, no compulsion, pattern from happenstance), Stanza 3 (questioning "governance" without hidden hand), Stanza 5 (power as emergent pattern/description), Stanza 6 (system as descriptor, "must" as projection). Lines like "The pattern forms from what *has* happened" (St1), "Perhaps the 'power' is the pattern's name" (St5), "A useful fiction answering to 'law'" (St6).
      *   **Anti-Humean Stanzas:** Primarily Stanza 2 (accidental generalization problem re: salt), Stanza 4 (properties with inward force/necessity - Armstrong/powers), Stanza 5 (alternatively, if read as endorsing "knowing power"). Lines like "Some say the properties themselves apply / An inward force, a necessary grain" (St4), "That *makes* its dissolution always true" (St4).
  3.  **Pressure Points:**
      *   **Governing/Accidental Generalization:** St2 ("What governs if no hidden hand?" - Humean challenge), St3 ("What makes the statement deeply true / That salt dissolves? Just patterns in the grain?" - Accidental Gen. problem posed), St4 (Anti-Humean answer via inherent power/necessity).
      *   **Counterfactuals:** St1 ("the unstruck match *would* light" - the target counterfactual), St4 embedded in the powers view, **Envoi** (The *core* pressure point: explicitly the unstruck match's unmanifested potential/law - Humean struggles with this "unwritten law" applying where "no event applies").
  4.  **Envoi Strategy:** Focuses entirely on the *counterfactual* ("unstruck match") and its implied but unactualized necessity ("unwritten law", "hidden grain"). This is the scenario Humeanism struggles to ground without smuggling. The "hidden grain in chance's true, blind fall" captures the anti-Humean insistence on a deeper necessity *within* the apparent contingency, which the Humean sees as merely descriptive. It doesn't settle, but highlights the crux.
