  ## Knob-Twiddling Sestina with Tornada

  The borrowed melody, a simple **tune**,
  Lies quiet on the stand. He finds the **knob**
  For volume, low – a thoughtful **slippage**
  From the brash original. This **space**
  Needs softening. He seeks the proper **key**,
  Adjusts by feel, then leans to test his **ear**.

  A hush descends; attentive is the **ear**.
  He strips it bare, that familiar **tune**,
  Exposing bones. He twists another **knob**:
  Bright treble dims, a velvet **slippage**
  Into warm shadow, filling empty **space**.
  This mood requires a minor **key**.

  But minor **key** can drag. He needs a lift, a **knob**
  For tempo. Quickening, the **ear**
  Detects a wobble in the rhythmic **space** –
  He over-turned. Back to the steady **tune**
  Before the beat dissolved in **slippage**.
  Precision matters on this console **key**.

  It’s not just notes; it’s feel, the crucial **key**
  To meaning. Metaphor’s a sticky **knob**,
  Where "heart" for "drum" invites **slippage**.
  He risks it, soft – will any **ear**
  Perceive the shift within the **tune**,
  The borrowed phrase now claiming deeper **space**?

  He stretches time, exploring elastic **space**,
  A daring pause where structure’s **key**
  Seems lost. Then back! Rescues the **tune**
  With grace. That felt controlled – no random **knob**
  Just turned. It answered what his inner **ear**
  Demanded, bridging thought and **slippage**.

  Is inspiration just controlled **slippage**?
  A knowing drift within the style’s **space**?
  He tweaks the tremolo (a subtle **knob**),
  Adds blue notes, bending towards the **key**
  Of loneliness. It satisfies the **ear**,
  A richer shade upon the base **tune**.

  But what if *this* console lacks the crucial **knob**?
  What hand invents a whole new **space**,
  Where unknown **key** unlocks, makes **slippage** true?
  The old **tune** breaks. A seventh word: the **hand**,
  Reaching past knobs, creates what **ear** demands.
  No preset axis holds the final **key**;
  True leaps exceed the twiddler's **space**.

  *(Tornada)*
  The console hums, its labelled **knob** and **key**,
  But **slippage** finds no map for that command.
  The **hand** alone, beyond the planned **space**,
  Plucks from the void a sound no preset **tune**
  Could hold. It lands, a shock upon the **ear**,
  The leap no mere adjusted **slippage** spanned.
