answer: |-
  ### Decision Theory Final Examination Question  
  **Time Allotment:** 45 minutes (out of 120 total)  
  **Total Marks:** 30  

  ---

  #### Notation & Setup  
  - **States of the world**: Finite set \( \Omega = \{\omega_1, \dots, \omega_n\} \), with prior probability \( p(\omega) > 0 \) for all \( \omega \).  
  - **Actions**: Finite set \( \mathcal{A} = \{a_1, \dots, a_m\} \).  
  - **Utility**: Bounded state-action utility \( u(a, \omega) \).  
  - **Signal**: A random variable \( S \) with realizations \( s \in \mathcal{S} \) (finite). Likelihoods \( \ell(s|\omega) \) depend only on \( \omega \) (not actions). Posterior beliefs use Bayes’ rule.  
  - **Ex-ante expected utility (EU)**: \( \text{EU}(\text{no signal}) = \max_{a \in \mathcal{A}} \sum_{\omega} p(\omega) u(a, \omega) \).  
  - **Ex-ante EU with signal**: \( \text{EU}(S) = \sum_s \Pr(s) \max_{a \in \mathcal{A}} \sum_{\omega} \Pr(\omega|s) u(a, \omega) \).  
  - **Value of \( S \)**: \( V(S) = \text{EU}(S) - \text{EU}(\text{no signal}) \).  

  ---

  #### Part (a): The Standard Case [10 marks]  
  1. **State Good’s theorem** with all assumptions explicit.  
  2. **Prove** that \( V(S) \geq 0 \).  
  3. Identify the **equality condition** for \( V(S) = 0 \) precisely.  
  4. Explain which assumption licenses swapping max and expectation (\( \max \mathbb{E} = \mathbb{E} \max \)) in the proof.  

  ---

  #### Part (b): Contingent Menus [12 marks]  
  Suppose a **second party** observes \( S \) and sets the agent’s menu \( \mathcal{A}(s) \subseteq \mathcal{A} \) *after* seeing \( s \). The agent then chooses optimally from \( \mathcal{A}(s) \).  
  1. Construct a **numerical counterexample** with:  
     - \( |\Omega| = 2 \), \( |\mathcal{S}| = 2 \), \( |\mathcal{A}| = 2 \) (small numbers!).  
     - \( S \) is **perfectly informative** (i.e., each \( s \) reveals the state).  
     - \( V(S) < 0 \) ex ante.  
     *Hint: Ensure the ex-ante optimal action is unavailable in at least one \( \mathcal{A}(s) \).*  
  2. Identify which step of the proof in (a) fails here and why.  
  3. Explain why the "ignore the signal" argument does *not* restore \( V(S) \geq 0 \).  
  4. Could a *less informative* signal yield higher ex-ante EU than \( S \)? Briefly justify.  

  ---

  #### Part (c): Policy Misinterpretation [8 marks]  
  > *"Good’s theorem proves rational agents always benefit from more information. Thus, before deciding on campus expansions, our university should commission costly extra feasibility studies. Rationality demands it!"*  
  — University Administrator  

  Identify and repair **at least three distinct errors** in this reasoning. Be precise.  
  *(Bonus: Note if the theorem compares different signals.)*  

  ---

  ### Model Answer  
  **Part (a):**  
  **Theorem:** For an expected-utility maximizer with fixed action set \( \mathcal{A} \), prior \( p \), and a costless signal \( S \) with likelihoods independent of actions:  
  (i) \( V(S) \geq 0 \) (non-negative value of information).  
  (ii) \( V(S) = 0 \) iff there exists an action \( a^* \) optimal under \( p \) that remains optimal under every posterior \( \Pr(\omega|s) \) in the support of \( S \).  

  **Proof:**  
  \[
  \text{EU}(S) = \sum_s \Pr(s) \max_{a \in \mathcal{A}} \underbrace{\sum_\omega \Pr(\omega|s) u(a, \omega)}_{\text{Posterior EU}} \geq \sum_s \Pr(s) \sum_\omega \Pr(\omega|s) u(a^*, \omega)
  \]  
  for any fixed \( a^* \in \mathcal{A} \). Choosing \( a^* \) as an ex-ante optimal action:  
  \[
  \sum_s \Pr(s) \sum_\omega \Pr(\omega|s) u(a^*, \omega) = \sum_\omega u(a^*, \omega) p(\omega) = \text{EU}(\text{no signal}).
  \]  
  Thus \( \text{EU}(S) \geq \text{EU}(\text{no signal}) \), so \( V(S) \geq 0 \).  

  **Key step:** Linearity of expectation allows pulling \( \sum_s \Pr(s) \) inside, but swapping \( \max \) and \( \sum_s \Pr(s) \) requires evaluating different actions in different \( s \)-cells. This is justified by the **fixed action set** \( \mathcal{A} \) (same for all \( s \)).  

  **Equality:** \( V(S) = 0 \) iff \( a^* \) (ex-ante optimal) is also optimal in *every* possible posterior. If \( a^* \) is suboptimal in any \( s \) with \( \Pr(s) > 0 \), strict inequality holds.  

  ---

  **Part (b):**  
  **Counterexample:**  
  - \( \Omega = \{\omega_1, \omega_2\} \), \( p(\omega_1) = p(\omega_2) = 0.5 \).  
  - \( \mathcal{A} = \{a_1, a_2\} \), utility:  
    - \( u(a_1, \omega_1) = 10 \), \( u(a_1, \omega_2) = 0 \)  
    - \( u(a_2, \omega_1) = 0 \), \( u(a_2, \omega_2) = 8 \)  
  - Ex-ante EU:  
    - \( \mathbb{E}u(a_1) = 0.5 \times 10 + 0.5 \times 0 = 5 \)  
    - \( \mathbb{E}u(a_2) = 0.5 \times 0 + 0.5 \times 8 = 4 \)  
    - Optimal: \( a^* = a_1 \), EU = 5.  
  - **Signal \( S \)**: Perfectly informative (\( s_1 \) iff \( \omega_1 \), \( s_2 \) iff \( \omega_2 \)).  
  - **Contingent menus**:  
    - Party sets \( \mathcal{A}(s_1) = \{a_2\} \) (blocks \( a_1 \) if \( \omega_1 \))  
    - \( \mathcal{A}(s_2) = \{a_1\} \) (blocks \( a_2 \) if \( \omega_2 \))  
  - **Ex-ante EU with signal**:  
    - If \( s_1 \) (know \( \omega_1 \)): only \( a_2 \) available → utility = 0.  
    - If \( s_2 \) (know \( \omega_2 \)): only \( a_1 \) available → utility = 0.  
    - \( \text{EU}(S) = 0.5 \times 0 + 0.5 \times 0 = 0 \).  
  - \( V(S) = 0 - 5 = -5 < 0 \).  

  **Why the proof fails:** The swap \( \max \mathbb{E} \leq \mathbb{E} \max \) assumes \( \mathcal{A} \) is fixed. Here, \( \mathcal{A}(s) \) varies, so \( a^* = a_1 \) is unavailable in \( s_1 \).  

  **Ignore-it argument fails:** "Ignoring" requires choosing \( a_1 \) always, but \( a_1 \notin \mathcal{A}(s_1) \). Agent *cannot* ignore the signal.  

  **Less informative signal:** Yes. Suppose a *uninformative* signal (always sends \( s_0 \)). Party sets \( \mathcal{A}(s_0) = \mathcal{A} \). Then EU = 5 > 0.  

  ---

  **Part (c):**  
  **Errors repaired:**  
  1. **Ex ante vs. ex post**: The theorem ensures non-negative value *ex ante* (before seeing \( S \)). Post-signal, EU may fall (e.g., Part (b)), but the *expectation* increases. The administrator confuses ex-ante guarantees with ex-post outcomes.  
  2. **Agent-relativity**: The result holds relative to the agent’s *own prior* \( p \). If the university’s prior is miscalibrated (e.g., overconfident), buying information may *increase* expected loss by their lights, violating the theorem’s premise.  
  3. **Cost ≠ Utility**: Good’s theorem assumes *free* signals. A costly signal \( C \) requires evaluating \( \text{EU}(S) - C \) in the *augmented decision tree*. \( V(S) \geq 0 \) does not imply \( \text{EU}(S) - C \geq \text{EU}(\text{no signal}) \).  
  4. **Non-comparative (bonus)**: The theorem does *not* say \( V(S) \geq V(S') \) for all \( S' \) less informative than \( S \). A noisier signal could be more valuable if it avoids adversarial menu changes.  

  ---

  ### Marking Scheme (30 total)  
  **Part (a) [10 marks]**  
  - **Theorem statement (3)**: Fixed menu (1), \( V(S) \geq 0 \) (1), equality iff single \( a^* \) optimal in all posteriors (1).  
  - **Proof (4)**: Jensen/max swap (1), ≥ EU(no signal) via \( a^* \) (2), justification of swap (fixed \( \mathcal{A} \)) (1).  
  - **Equality condition (2)**: "Single \( a^* \) optimal in all possible posteriors" (2). "Signal irrelevant" alone (1).  
  - **Ex-ante (1)**: Explicit mention.  
  *Common error: Omitting fixed-menu assumption in equality condition (lose 1).*  

  **Part (b) [12 marks]**  
  - **Counterexample (6)**: Correct numbers (2), perfect information (1), \( V(S) < 0 \) with calculation (2), ex-ante optimal action missing in some \( s \) (1).  
  - **Proof step (2)**: Identifies failure of max-expectation swap due to varying \( \mathcal{A}(s) \) (2).  
  - **Ignore-it reply (2)**: "Agent cannot choose ignored action if menu excludes it" (2).  
  - **Less informative signal (2)**: "Yes" with justification (e.g., uninformative signal avoids menu manipulation) (2).  
  *Common error: Menus with price changes but same actions available (lose 3).*  

  **Part (c) [8 marks]**  
  - **Ex ante/ex post (2)**: Distinguishes expectation from realization.  
  - **Agent-relativity (2)**: Prior-dependence noted.  
  - **Cost/utility (2)**: Free vs. costly signals.  
  - **Bonus (1)**: Non-comparative point.  
  - **Clarity (1)**: Repairs administrator’s claim precisely.  
  *Common error: Listing "information overload" without formal link (0).*  

  **Grade Boundaries:**  
  - **A (25–30)**: Correct equality condition in (a), valid counterexample in (b), all 3 errors in (c) repaired.  
  - **B (18–24)**: Minor gaps (e.g., vague equality condition, counterexample missing menu exclusion, 2/3 errors in (c)).  
  - **C (12–17)**: "Ignore-it" argument in (a), no counterexample in (b), superficial (c).  

  ---

  **Fairness Notes:**  
  - The counterexample avoids games/equilibria by treating the second party’s menu choice as exogenous.  
  - All notation is defined; no prior exposure to contingent menus assumed.  
  - Bounded utility and finiteness prevent measure-theoretic distractions.  

  ---  
  **Exam logistics:** This question tests conceptual traction, not memorization. Weighting reflects emphasis on novel applications (Part b > a > c). Time allows for succinct answers if concepts are mastered.
