answer: |-
  Here’s a distilled spec for evaluating answers to "Why be moral?" based on your constraints. Desiderata are categorised, tensions flagged, and common answers briefly assessed per your request. British English throughout.

  ---

  ### **Core Desiderata (Non-Negotiable)**  
  1. **Addresses the Undisturbed Agent**  
     - *Case*: Glaucon’s challenge. Must justify morality to a fully rational, self-interested agent with no ignorance/weakness.  
     - *Non-negotiable*: Rules out appeals to error, ignorance, or irrationality.  

  2. **Answers the Justificatory Question**  
     - *Case*: Distinguishes "Why *should* I?" (reason-giving) from "Why *do* people?" (psychological/genealogical).  
     - *Non-negotiable*: Rejects reduction to sociology, psychology, or evolutionary biology.  

  3. **Survives the Cost Ladder**  
     - *Case*: Must hold when morality costs: £5 → job → family → life (no afterlife/monument).  
     - *Non-negotiable requirement*: **Must not break at any rung**; else concedes immorality is rational when stakes exceed a threshold.  
     - *Supererogation tension*: Genuine supererogation (e.g., heroic self-sacrifice) must be distinguishable from obligatory acts *without* implying the hero is irrational.  

  4. **Works in the Ledger Case**  
     - *Case*: All deeds recorded in a ledger burned unread at death.  
     - *Non-negotiable*: Eliminates reputation, posthumous judgement, or self-deception as foundations.  

  5. **Handles Near-Total Non-Compliance**  
     - *Case*: One moral agent among 10,000 egoists (you’re the "mark").  
     - *Non-negotiable*: Morality must remain rational even when exploited.  

  6. **Handles Pure Inefficacy**  
     - *Case*: Your act has no causal impact (e.g., one drop in a reservoir).  
     - *Non-negotiable*: Must ground reasons beyond consequentialist outcomes.  

  ---

  ### **Conditional Desiderata (Theory-Dependent)**  
  7. **Reverse Ring Case**  
     - *Case*: Blamed/punished for good acts you didn’t commit.  
     - *Status*: Tests if morality is solely about *being* good vs. *appearing* good. **Non-negotiable** for integrity-based theories; negotiable for consequentialism.  

  8. **Explains Categorical & Desire-Independent Feel**  
     - *Case*: Moral demands ("don’t torture") feel binding regardless of desires.  
     - *Status*: **Preference** for non-Humean theories (e.g., Kantian). Humeans may reject moral phenomenology.  

  9. **Must Not Presuppose Moral Reasons**  
     - *Case*: Can’t assume "morality is reason-giving" in the argument.  
     - *Status*: **Preference** for foundationalist theories; constitutivists may reject this as question-begging.  

  ---

  ### **Rejected/Smuggled Desiderata**  
  - **Character/Integrity Requirement**: ("Morality is about being a certain person").  
    - *Junk it*: Smuggled virtue ethics. The Undisturbed Agent need not care about integrity.  
  - **Neutrality Between First-Order Theories**:  
    - *Junk it*: Answers will *entail* commitments (e.g., Kantian vs. Hobbesian). Demanding neutrality is incoherent.  

  ---

  ### **Key Tensions**  
  1. **"Don’t presuppose moral reasons" vs. "Explain categorical feel"**  
     - *Tension*: If moral reasons aren’t presupposed, their categorical force can’t be explained without circularity.  
     - *Resolution*: Only constitutivist/Kantian theories (morality as inherent to agency) can *possibly* satisfy both.  

  2. **"Hold at every Cost Ladder rung" vs. "Allow supererogation"**  
     - *Tension*: If dying for morality is supererogatory, isn’t refusing rational?  
     - *Resolution*: Distinguish *obligation* (required at all costs) from *ideals* (supererogatory). But this risks breaking the Cost Ladder for obligations.  

  ---

  ### **Most Damaging Requirement**  
  The **Ledger Case** does the heaviest lifting: it eliminates >50% of popular answers (reputation, divine reward, psychological comfort, historical legacy).  

  ---

  ### **Brief Theory Assessments**  
  - **Prudential/Self-Interest**: Fails Cost Ladder (death > self-interest), Ledger (no self-benefit), and Non-Compliance (you lose).  
  - **Mutual Advantage/Contractarianism**: Fails Non-Compliance (no reciprocity) and Inefficacy (no mutual gain).  
  - **Constitutivist/Kantian**: Meets Undisturbed Agent & Categorical Feel via internal rationality. Struggles with Cost Ladder (death vs. rational agency) and Inefficacy (non-consequentialist reasons needed).  
  - **Character-Based**: Fails Ledger (no self-concept matters) and Undisturbed Agent (no inherent reason to value integrity).  

  ---  
  *Word count: 798*
