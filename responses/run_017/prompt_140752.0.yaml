  Then, near-term work's long-term effects. Development economics shows that health, education, and institutions have lasting impacts. If near-term aid boosts growth or stability, it might indirectly shape the far future. Longtermists might undervalue these pathways. Highlighting studies on historical persistence of interventions could counter the pivot argument.

  The user also asks for ranked objections and how defenders respond. Fatal flaws would be sign symmetry and undefined EV, while causal attenuation is more awkward but addressable. Defenders might hedge by adjusting tractability assumptions or focusing on specific interventions. They'd dismiss near-term effects as less cost-effective.

  I should also address if strong longtermism collapses into impartial consequentialism. If all values are future-weighted, does it add anything new? Maybe it emphasizes specific risks and interventions, but the core principle isn't novel.

  Finally, the user wants empirical data on influence persistence and risk reduction. Historical case studies, like the long-term effects of institutions or technology governance, could provide insight. But data is scarce, so this remains a vulnerability for longtermism.

