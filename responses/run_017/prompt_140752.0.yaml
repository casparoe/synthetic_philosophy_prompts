  Control-shifting without value-shifting is next. The idea that competitive pressures and physical limits might make the future's trajectory inevitable, so actions only change who's in charge, not outcomes. This ties into evolutionary game theory or Moloch dynamics. If the future's quality is fixed, then influencing it might not add value. Need to discuss whether there are leverage points where agency matters, like during critical junctures.

  Sign symmetry is tricky. Heavy tails in both positive and negative directions could make expected value undefined. If suffering risks dominate, population ethics might prioritize reducing suffering over creating good lives. Antinatalist perspectives or s-risks are relevant here. The user's point about undefined expected values is mathematically sound, so I should emphasize that as a potential showstopper.

