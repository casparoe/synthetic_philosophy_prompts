  Okay, let me approach this query methodically. The user describes a fascinating linguistic phenomenon where "attention" carries distinct technical meanings across machine learning, economics and philosophy, while sharing core grammatical properties and normative implications. This creates cross-disciplinary confusion when concepts migrate without their original criteria.

  First, I need to identify whether existing terminology captures this. The user has already ruled out polysemy (since the meanings are interconnected), metaphor (as the borrowings are technical), conceptual stretching (the shift is in mechanism not generality) and concept creep (it's cross-domain, not intra-domain expansion). 

  Considering potential candidates:
  - Frame adoption might come close but focuses on cognitive frameworks rather than technical criteria
  - Transduction in semiotics describes concept transfer but doesn't address normative baggage
  - Disciplinary homonymy captures surface similarity but misses the deliberate modeling aspect
  - Conceptual blending fits the generative aspect but not the problematic inference transfers

  The key features seem to be: selective borrowing of grammar/normative profile while discarding domain-specific criteria, leading to illegitimate inferences. This feels distinct from simple metaphor or polysemy because of the technical precision claimed in each domain.

  For boundary testing: 
  - "Temperature" in ML sampling parameters preserves the "intensity" grammar but drops thermodynamic criteria - similar pattern
  - "Bias" migration shows parallel normative baggage across fields
  - But terms like "window" in computing vs architecture might be pure homonyms without normative transfer

  The core issue appears to be the migration of evaluative dimensions (like "misdirected attention") between domains with incompatible validation methods. A possible name could be evaluative transference - emphasizing how normative judgments travel while empirical criteria get left behind. 

  Vulnerabilities in this framing:
  - May overlap with reification if critics argue the normative profile is mistakenly treated as concrete
  - Could collapse into mere analogy if the technical claims weaken
  - Might not distinguish sufficiently from Wittgensteinian family resemblances

  The critical test case would be terms that share grammar but have no historical connection - if found, it might split this into intentional modeling vs accidental convergence. Also problematic would be domains that successfully integrate both grammar and criteria during transfer, which would require a separate category for valid conceptual migration.
answer: |-
  What you're describing is a fascinating and increasingly common interdisciplinary phenomenon. After careful consideration of your cases and the candidates you've dismissed, I propose this isn't a single established concept but a distinct pattern requiring new terminology. I'll define it, carve its boundaries, test it against your examples, and flag vulnerabilities.

  **The Pattern: Evaluative Transference**  
  *Definition:* The migration of a term's **grammatical structure and normative profile** across domains while shedding its **domain-specific validation criteria**, enabling inferences that are only licit within the source domain. Characterised by:
  1. Preservation of syntactic behaviour (e.g., "attention *is directed*, *can be wasted*")
  2. Retention of normative valence (e.g., attention *ought* to be paid justly)
  3. Discarding of operational criteria (e.g., how we *measure* attention's success/failure)
  4. Illicit inference transfer (using source-domain logic on target-domain entities)
  5. Bidirectional destabilisation (rivalry over "what X *really* is")

  **Boundary Cases:**  
  - *Included:* Your attention cases (ML/economics/philosophy), "bias" (statistics → psychology → algorithmic fairness), "temperature" (thermodynamics → LM sampling).  
  - *Excluded:*  
    - Pure **polysemy** (e.g., "bank" financial/river): No shared grammar/normative structure.  
    - **Metaphor** (e.g., "memory" in computers vs. minds): Understood as non-literal, no technical validation claims.  
    - **Conceptual stretching** (e.g., "democracy" applied to non-electoral contexts): Extends generality *within* a domain's logic.  
    - **Reification** (e.g., treating "IQ" as a concrete entity): May co-occur but doesn't explain cross-domain grafting.  

  **Why Your Cases Fit:**  
  - **Attention:** Grammar/normativity ("selective," "owed") travels; validation criteria (weight matrices/budgets/moral regard) do not. Illicit inference: Treating ML attention weights *as if* they entail moral considerateness.  
  - **Bias:** Grammar ("skewed," "unfair") and normativity ("should be corrected") persist; statistical variance, cognitive heuristics, and fairness metrics aren't interchangeable. Illicit inference: Assuming algorithmic debiasing resolves psychological prejudice.  
  - **Temperature:** Grammar ("high/low intensity") transfers; thermodynamic entropy ≠ LM sampling stochasticity. Illicit inference: Interpreting "low temp" outputs as "colder" in a physical sense.  

  **Functional Kinds?**  
  Evaluative transference *exploits* functional resemblances (e.g., "selectivity" in attention) but isn't defined by them. The key is the **normative-inferential slippage**. Functional parallels enable the transfer but don't justify the dropped criteria.

  **Why "Evaluative Transference"?**  
  - "Evaluative": Captures the normative profile (values, obligations)  
  - "Transference": Signals migration *with baggage* (psychoanalytic echo intentional)  
  - Better than "copycat": Avoids trivialisation; emphasises structured borrowing  

  **Vulnerabilities & Mind-Changers:**  
  1. **Weakest Case:** "Temperature." Its normative load is lighter than "attention" or "bias." If normativity is central, this might be peripheral.  
  2. **Category-Splitting Scenario:** If a term migrates *with* validation criteria (e.g., "entropy" in physics/information theory, where Shannon preserved formal criteria). This is **valid conceptual extension**, not transference.  
  3. **Collapse Risks:**  
      - Into **metaphor** if technical claims weaken (e.g., if ML "attention" becomes purely analogical).  
      - Into **reification** if critics argue the normative profile is fallaciously projected onto the target (e.g., "ML attention isn't *really* attention").  
  4. **Failure Point:** Where domains *successfully integrate* criteria during transfer (e.g., ecological "resilience" adapted for psychology with modified but operational criteria). Evaluative transference implies unresolved tension.  

  **Edges & Extrapolations:**  
  - **Boundary:** Excludes terms migrating *without* normative grammar (e.g., "vector" in math/epidemiology).  
  - **Extrapolation Flag:** My treatment of "bias" in algorithmic fairness assumes normative claims rely on psychological/statistical criteria without full integration. If fairness metrics develop *sui generis* validation, this becomes less transference.  

  **Recommendation for Use:**  
  Adopt "evaluative transference" with this carve-up. In print, explicitly:  
  1. Identify the preserved grammar/normativity  
  2. Contrast source/target validation criteria  
  3. Flag illicit inferences enabled by the gap  
  British English: "This evaluative transference risks category errors; the model's *attention weights* cannot bear the moral weight of Simone Weil's *attention*."  

  Would this serve? I welcome pushback on the normative profile's necessity or cases where validation criteria *partially* transfer.
