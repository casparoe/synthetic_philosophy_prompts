  Against X: B gives 0, C gives 2 -> C is not dominated by B.
  Against Y: B gives 5, C gives 2 -> but not strictly dominated by B? Actually, B doesn't dominate C because against X, 0<2.

  So if we eliminate A first, then we cannot eliminate C by a 2-domination (because we can only use mixtures of the remaining strategies: B and C, and no mixture of B and C can dominate C?).

  Therefore, if we eliminate A first, then C survives. If we eliminate nothing, we can eliminate C. So order matters.

  But in our main game, we didn't have that. We can mention this example in debrief.

  Failure modes:
  - Symptom: Students with dice cannot find the mixture for D. Cause: they might try to use only two actions. Fix: ask them to consider mixtures of three actions.
  - Symptom: After eliminating D, students don't eliminate Z. Cause: they might not realize that Z is now dominated by X. Fix: ask them to compare payoffs for Player 2 after D is removed.

