      "Formal proof that mixed domination ⇏ never best response in 3+ player games (counterexample: a strategy dominated only in correlated opponents' strategies may still be a best response to some uncorrelated profile).",
      "General theorem on minimal mixture size (number of opponent profiles).",
      "Why equivalence holds in 2-player games (need to state: in 2-player, strictly dominated ⇔ never best response)."
    ],
  ```

  #### Understanding Check
  ```json
    "understanding_check": "Listen for: 'D wasn't beaten by any single action or 50/50 mix, but die-holders could combine A,B,C to beat it everywhere' (procedural) vs. 'After D was gone, Player 2's best responses changed, making Z eliminable—the mixture revealed new structure' (conceptual). The latter shows grasp of how mixed domination enables discovery."
  ```

  ### Key Clarifications
  1. **Why three-player equivalence breaks**: In 2-player games, strict domination by mixed strategy ⇔ never being a best response. In 3+ players, this fails: a strategy can be strictly dominated but still a best response to some *uncorrelated* opponent profiles (e.g., if domination relies on opponents playing correlated strategies). The game doesn't show this; state it in debrief.
    
  2. **k-domination insights**: Iterated elimination of k-dominated strategies:
     - **Stops short of unrestricted**: If a strategy requires a mixture >k actions to dominate (like D with k=2), it survives.
     - **Order-dependent**: Eliminating a strategy in the support of a potential dominator mixture may prevent subsequent domination (as in the debrief example).

  3. **Handling the wrinkle**: Coin-holders can only implement 50/50 mixtures, so they miss that D is dominated by (1/3,1/3,1/3). Die-holders implement it (e.g., 1-2:A, 3-4:B, 5-6:C), eliminate D, then proceed. Post-activity comparison shows die-pairs eliminated more strategies.

  4. **Critical facilitator discipline**: Never name "mixed strategies" during gameplay. Students must articulate the need for mixtures from payoff comparisons. The payoff matrices are small enough to verify by hand (max 4x3).

  This design forces discovery through constrained tools (coin/die) and asymmetric payoffs, making mixed domination necessary for progress. The debrief links gameplay moments to formal properties, with the coin/die split naturally motivating the k-domination discussion.
