    "games": [
      {
        "purpose": "Reactivate pure-strategy elimination and mixed equilibria in 2x2 games",
        "roles": ["Player 1", "Player 2"],
        "payoff_matrix": "Player 2 Actions: L, R\nPlayer 1 Actions: T, B\nPayoffs (P1, P2):\nT,L: (3,3), T,R: (0,4)\nB,L: (4,0), B,R: (1,1)",
        "randomizer": "none",
        "intended_discovery": "No pure domination → mixed equilibrium exists (T: 1/4, B: 3/4; L: 1/4, R: 3/4)"
      },
      {
        "purpose": "Force confrontation with mixed-strategy domination: D requires 3-action mixture (die only), enabling further elimination",
        "roles": ["Player 1 (coin or die)", "Player 2 (no randomizer)"],
        "payoff_matrix": "Player 2 Actions: X, Y, Z\nPlayer 1 Actions: A, B, C, D\nPayoffs (P1, P2):\nA,X: (1,5), A,Y: (0,1), A,Z: (0,0)\nB,X: (0,1), B,Y: (1,5), B,Z: (0,0)\nC,X: (0,2), C,Y: (0,2), C,Z: (1,1)\nD,X: (0,0), D,Y: (0,0), D,Z: (0,0)",
        "randomizer": "coin or die",
        "intended_discovery": "D not dominated by pure or 50/50 mixes; dominated by (1/3A,1/3B,1/3C) for die-holders → Z eliminated → C eliminated"
