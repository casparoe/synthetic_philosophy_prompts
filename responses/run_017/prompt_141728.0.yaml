  Debrief points:
  - In the main game, D was not dominated by any pure strategy, but was dominated by a mixture of three.
  - After eliminating D, we could eliminate Z by a pure strategy (for Player 2), and then C by a mixture of two.
  - The die-holders could do it, the coin-holders couldn't.
  - This shows that the ability to form larger mixtures allows more elimination.

  Then, we discuss the concept of 2-domination: a strategy is 2-dominated if there is a mixture of at most two pure strategies that dominates it. 
  - In this game, D was not 2-dominated (in the full game) because it required a mixture of three.
  - But after eliminating Z and C, we don't need to go back? Actually, the elimination was sequential.

  Now, the question: is iterated elimination of 2-dominated strategies order-dependent and does it stop short?

  In this game, if we only allow 2-domination, we cannot eliminate D initially. But if we had eliminated some other strategy first, could we have eliminated D by a 2-domination? In this game, no. So it stops short.

  But in other games, it might be order-dependent. We can give an example in debrief.

  Example for order dependence:

  Consider a game with three strategies for one player and two opponent actions.

  Payoffs for Player 1:
     X   Y
  A  4   0
  B  0   4
  C  2   2

  Now, C is not dominated by A or B alone. But if we first eliminate A, then we are left with B and C. Now, in the subgame, C is dominated by B? 
