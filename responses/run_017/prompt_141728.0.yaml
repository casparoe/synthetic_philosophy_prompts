  - The fact that in two-player games, strict domination by a mixed strategy is equivalent to never being a best response. And that in three-player games, it is not equivalent.

  For the understanding check: 
  - Look for whether students articulate that D was not dominated by any pure strategy or mixture of two, but was by a mixture of three. And that after eliminating D, the game changed and allowed more elimination.

