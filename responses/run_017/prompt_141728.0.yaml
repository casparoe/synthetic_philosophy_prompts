answer: |-
  ### Session Design for Teaching Strict Domination by Mixed Strategies

  I've designed a session where students discover mixed-strategy domination through gameplay, with a coin/die wrinkle to highlight the impact of mixture granularity. The core insight is that a strategy can be strictly dominated only by mixtures beyond 50/50 blends, restarting stalled elimination. The design uses a two-player asymmetric game where Player 1 requires a three-action mixture to dominate a strategy, achievable only by die-holders.

  #### Setup
  ```json
  {
    "setup": {
      "grouping": "Pairs (9 pairs total); Player 1 in each pair gets either coin or die (randomly assigned: 4-5 coin, 4-5 die); Player 2 gets no randomizer",
      "materials": [
        "Warm-up game payoff matrix (one per pair)",
        "Main game payoff matrix (one per pair)",
        "Poker chips for payoffs",
        "Coins (for half of Player 1s)",
        "Dice (for other half of Player 1s)"
      ],
      "assumed_prior_knowledge": "Iterated elimination of strictly dominated strategies (pure dominators only); solving 2x2 mixed-strategy Nash equilibria"
    },
  ```

  #### Games
