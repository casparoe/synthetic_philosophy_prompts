      So coin-holders cannot eliminate any strategy by a mixture of two? They are stuck.

  50-70 min: Discussion and comparison.
    - Have the die-holder pairs report what they eliminated and in what order.
    - Have the coin-holder pairs report that they couldn't eliminate anything beyond the first step.

