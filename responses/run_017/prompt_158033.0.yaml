answer: |-
  ### Restatement of Updateless Decision Theory in Programming Language Terms

  **Core Setting:**  
  A policy \( P \) (a function from observations to actions) is compiled into \( N \) binaries deployed on physically separated machines. Each machine \( i \) has a distinct continuation \( K_i \) (downstream computation and consequences). The agent knows:
  - \( N \)
  - The payoff function \( U(a_1, \dots, a_N) \) mapping the \( N \)-tuple of actions to utility
  - All machines run the identical policy \( P \)
  - The agent does not know which binary it resides in (i.e., its index \( i \)).

  **Operational Semantics of Decision Theories:**  
  - **Causal Decision Theory (CDT):**  
    At runtime, the agent (at machine \( i \)) receives observation \( o_i \), evaluates \( P(o_i) \), and chooses an action \( a_i \) to maximize \( U \) under *causal interventions* on \( a_i \), ignoring correlations between \( a_i \) and other \( a_j \). This is akin to optimizing a single call site \( P(o_i) \) while treating other actions as fixed (non-influenced by \( a_i \)).  

  - **Evidential Decision Theory (EDT):**  
    At runtime, the agent conditions on \( o_i \) and selects \( a_i \) to maximize the *conditional expectation* of \( U \) given \( a_i \). This is equivalent to specializing \( P \) to \( o_i \) (yielding a residual \( P_{o_i} \)) and optimizing \( a_i \) under the assumption that \( a_i \) is *evidence* about other \( a_j \) (e.g., via correlations in the environment).  

  - **Updateless Decision Theory (UDT):**  
    The agent selects \( P \) *at compile time* (before any observation) to maximize the *expected utility* over all \( N \) executions, averaging over:  
    1. Uncertainty about its index \( i \) (uniform prior or given prior)  
    2. Uncertainty about observations \( o_1, \dots, o_N \) (given prior distribution)  
    3. The fixed fact that all machines run *the same* \( P \).  
    Formally:  
    \[
    P^* = \underset{P}{\text{argmax}}  \sum_{i=1}^N \sum_{\mathbf{o}} \Pr(i, \mathbf{o}) \cdot U(P(o_1), \dots, P(o_N))
    \]
    Here, \( \mathbf{o} = (o_1, \dots, o_N) \). The agent does *not* specialize \( P \) to its own \( o_i \); it chooses \( P \) as a shared, unspecialized function.  

  **Vindicating the Identifications:**  
  1. **Updatelessness as Staging:**  
     Conditioning on \( o_i \) (as in EDT) is partial evaluation: \( P \) specializes to \( P_{o_i} \), a residual program hardcoded for \( o_i \). UDT avoids this *self-specialization*. Instead, \( P \) is chosen unspecialized, and the *environment* provides \( o_i \) at runtime (i.e., the caller passes \( o_i \) as an argument to \( P \)). This ensures \( P \) remains identical across all machines, preserving logical correlations. Specialization by the agent would break sharing, as residuals \( P_{o_i} \) and \( P_{o_j} \) differ if \( o_i \neq o_j \).  

  2. **Logical Correlation as Code Sharing:**  
     Outputs \( a_i \) and \( a_j \) are correlated iff machines \( i \) and \( j \) execute the *same function* \( P \) (intensional identity) or share a critical subterm (e.g., a common closure or mutable state). There is no additional "logical dependence"; correlation emerges purely from syntactic identity of code. In this setting, all \( N \) machines share \( P \) by construction, so their outputs are perfectly correlated *modulo differences in observations*.  

  **UDT Recommendation:**  
  Choose \( P \) to maximize the expected utility of the entire output vector \( (P(o_1), \dots, P(o_N)) \), computed at compile time. This is equivalent to optimizing the **input-output graph of \( P \)** (i.e., its behavior across all possible inputs) under the constraints of shared code and index uncertainty. It is *not* merely optimizing a single output—it requires compiling \( P \) to maximize global coordination across all call sites.  

  ---

  ### Residue Analysis: What Translates, What Strains, What Breaks  

  #### 1. **Translates Without Strain**  
  - **Policy as Function:** \( P \) maps observations to actions—denotationally clear.  
  - **Staging Analogy:** Avoiding self-specialization maps directly to partial evaluation. UDT’s "choose before observation" is compile-time optimization; runtime execution is environment-supplied inputs.  
  - **Code Sharing as Correlation:** Perfect logical correlation iff identical code executes—operationally sound.  
  - **Fixed-Point for Self-Reference:** In cases like Newcomb’s predictor, the agent’s output is a fixed-point of \( P \) (since the predictor simulates \( P \)). This mirrors recursive function definitions (e.g., \( \text{fix}  F = F(\text{fix}  F) \)).  
  - **Global Optimization:** UDT’s compile-time optimization of \( P \)’s I/O graph is natural in semantics (e.g., denotational models of program equivalence).  

  #### 2. **Requires Imported Assumptions**  
  - **Uncertainty About Index:** The agent’s ignorance of its location \( i \) demands a *prior* (e.g., uniform \( \Pr(i) = 1/N \)). Program semantics lacks intrinsic indexical uncertainty; we import Bayesian probability.  
  - **Deliberation as Meta-Programming:** UDT requires the agent to "choose" \( P \), implying a *metaprogram* that generates \( P \). This strains operational semantics—programs don’t typically optimize their own source code. We import:  
    - A fixed set of candidate policies \( \{P_k\} \), or  
    - A higher-order function searching over \( P \) (undecidable in general).  
  - **Prior Over Observations:** The expectation over \( \mathbf{o} \) assumes a known distribution \( \Pr(\mathbf{o}) \). This is empirical uncertainty, not inherent to program equivalence.  
  - **Logical Uncertainty (Undecidability):** Rice’s theorem says we cannot decide if two arbitrary programs are extensionally equivalent. UDT assumes the agent knows its own code (\( P \)) and that all copies run \( P \), but in generalized UDT:  
    - If other agents run *similar but not identical* code, UDT needs a *similarity metric* (e.g., Kolmogorov complexity).  
    - This is imported—program semantics offers no graded measure of code similarity.  

  #### 3. **No Expression in Vocabulary**  
  - **Partial Similarity and Graded Correlation:**  
    Your vocabulary has no model for "similar-but-not-identical" agents. Program equivalence is all-or-nothing; no continuum between \( P \) and \( P' \). UDT’s reliance on code identity breaks when:  
    - Agents share *subcomponents* but not full policies.  
    - Programs are extensionally equivalent but intensionally distinct.  
    This reveals a **gap in UDT**: It lacks a theory of *partial logical correlation* without ad-hoc similarity priors.  
  - **Indexicality and Self-Location:**  
    The agent’s uncertainty about "which machine am I?" cannot be reduced to program semantics. It requires:  
    - A notion of *self* as an instance among \( N \),  
    - A prior over instances (indexical uncertainty).  
  - **Agency and Counterfactuals:**  
    UDT’s claim that "my choice fixes all copies" assumes:  
    - A causal link between choosing \( P \) and all instances running \( P \),  
    - The ability to reason counterfactually ("if I choose \( P' \), copies run \( P' \)").  
    Program semantics has no built-in causality or counterfactuals.  

  #### Uncertainty and Undecidability  
  - **Self-Output Uncertainty:** When UDT agents reason about predictors simulating them, they face *logical uncertainty*: "What output does \( P \) produce on input \( o \)?" This mirrors Rice-style undecidability—you cannot decide arbitrary properties of \( P \)’s behavior.  
  - **Key Difference:** In UDT, this uncertainty is *epistemic* (the agent lacks computational resources to simulate itself), while Rice’s theorem is *ontic* (undecidability is fundamental). They wear the same face (uncomputability) but serve distinct roles: UDT assumes agents can approximate self-prediction; Rice declares it impossible in general.  

  ---

  ### Verdict: The Residue Indicates  
  Your vocabulary **lacks necessary notions of self, indexicality, and graded logical correlation**, exposing UDT’s reliance on **unprincipled assumptions**:  
  1. **UDT is underspecified on similarity:** Code sharing is binary, but real-world agents exhibit partial similarity. UDT must import metrics (e.g., syntactic similarity, Kolmogorov complexity) without grounding in decision theory.  
  2. **Indexical uncertainty is irreducible:** Program semantics cannot express "I am machine \( i \)" or "my copy’s action affects me." This demands new primitives (e.g., agent-relative continuations).  
  3. **The central UDT notion is fragile:** Choosing \( P \) "as if fixing all copies" assumes a privileged causal role for the agent’s deliberation. Program semantics offers no such teleology—it’s a silent import.  

  **Conclusion:**  
  Updateless decision theory is faithfully restatable in your vocabulary only under strict conditions: identical agents, known priors, and no partial similarity. The residue reveals UDT’s **conceptual gaps** (indexicality, partial correlation) more than deficits in your framework. To subsume UDT, your vocabulary would need extensions for:  
  - **Graded program similarity** (e.g., a metric on syntax trees),  
  - **Indexical primitives** (e.g., a distinguished "self" parameter),  
  - **Resource-bounded logical uncertainty** (to handle undecidable self-prediction).  
  Absent these, UDT’s "logical correlation" and "updatelessness" remain intuitive but formally unmoored at their edges.
