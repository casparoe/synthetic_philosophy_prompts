answer: |-
  ## Fellowship Proposal: Mapping the Moral Circle – Towards Precision in Philanthropic Indicators

  **Applicant:** [Your Name/Title], Monitoring & Evaluation Specialist, [Philanthropic Intermediary Name]

  **Proposed Fellowship Title:** Disaggregating the ‘Moral Circle’: A Framework for Precise Indicator Selection in Funding Criteria

  **Duration:** Nine months (part-time, alongside existing role)

  **Core Research Question:**
  *How do existing indicators used to measure the perceived "expansion of the moral circle" implicitly resolve the independent variables of scope, weighting, and resolution, and what trade-offs between these variables become evident upon critical analysis?*

  **Why This Question? Why Now?**
  The prevailing discourse on moral progress often stalls at broad, intractable debates: *Is* there progress? Is it driven by reason, sentiment, or institutions? While vital, these debates bypass a critical operational challenge faced by funders and intermediaries like ours: *How do we measure movement towards a more inclusive morality when the very concept ("expanding the circle") is a multi-dimensional metaphor?*

  Current indicator sets function as practical solutions but, as my experience building one reveals, they act as unwitting arbiters of unresolved philosophical tensions. They quietly settle, through proxy selection, questions about:
  1.  **Scope:** The *breadth* of entities included (e.g., humans only vs. all sentient beings).
  2.  **Weighting:** The *relative moral consideration* given, especially to entities near the perceived edge versus the centre.
  3.  **Resolution:** The *granularity of moral differentiation* applied (e.g., treating "animals" as a bloc vs. recognising species-specific needs or individual welfare).

  These dimensions can shift independently. An indicator tracking mentions of "animal rights" in legislation (high scope, potentially low resolution, unclear weighting) tells a different story to one tracking donations to specific endangered species conservation (narrower scope, potentially higher resolution for that group, implicit weighting). Critically, progress on one dimension (e.g., increasing resolution by recognising sub-groups) might necessitate regression on another (e.g., weakening the universalist language that facilitated initial scope expansion). Furthermore, indicators privilege measurable outputs (stated convictions, institutional actions), often overlooking the crucial domain of spontaneous *noticing* and unobserved behaviour.

  This proposal sidesteps the unanswerable "Is there progress?" to tackle the answerable: *What specific kind of 'expansion' does this particular indicator actually capture, and what trade-offs does its use entail?* This precision is essential for funders aiming to design criteria that accurately reflect their specific vision of moral expansion.

  **Methodology & Monthly Plan (Desk-Based Analysis):**
  Leveraging my position and existing resources, this fellowship involves rigorous conceptual analysis and framework application, requiring no new data collection or budget:

  *   **Month 1: Conceptual Groundwork & Framework Refinement:** Finalise definitions of Scope, Weighting, and Resolution within the moral circle context. Articulate hypotheses on potential trade-offs between them. Draft initial analytical toolkit.
  *   **Month 2: Indicator Inventory & Categorisation:** Systematically catalogue existing indicators used by my organisation, partner funders, and prominent literature (e.g., animal welfare, global health, long-termism fields) purporting to measure moral expansion. Categorise each against Scope, Weighting, Resolution.
  *   **Month 3: Deconstructing Implicit Assumptions:** Analyse the top 15-20 indicators from Month 2. For each, explicitly identify: a) Which dimension(s) it primarily captures; b) The implicit philosophical stance it takes on unresolved questions (e.g., what counts as "moral consideration"?); c) Which dimension(s) it ignores or obscures.
  *   **Month 4: Mapping Trade-offs:** Intensively analyse the catalogue to identify patterns and concrete examples where progress indicated on one dimension plausibly conflicts with, or is hindered by, progress on another. Document evidence for these tensions from indicator limitations.
  *   **Month 5: The 'Where' Question - Stated, Noticed, Done:** Apply the framework to the question of *locus*. Analyse how different indicator types (e.g., surveys vs. institutional audits vs. media analysis) map onto stated conviction, spontaneous noticing, and institutional action. Identify gaps, particularly in capturing "noticing".
  *   **Month 6: Synthesising Tensions & Gaps:** Consolidate findings on implicit assumptions, trade-offs, and locus limitations. Develop clear typologies of indicator strengths/weaknesses per dimension.
  *   **Month 7: Drafting Practical Guidance:** Translate analysis into initial draft guidance for funders: key questions to ask when selecting/designing indicators, a framework for articulating *which* dimensions of expansion they prioritise, and awareness of associated trade-offs and measurement blind spots.
  *   **Month 8: Internal Review & Refinement:** Circulate draft guidance to select colleagues and external experts (leveraging professional networks) for critical feedback. Refine based on input.
  *   **Month 9: Finalising Deliverables & Dissemination Plan:** Produce polished final deliverables. Outline internal briefing plan for my organisation and identify potential external channels (e.g., relevant philanthropy networks, blogs) for sharing findings.

  **Key Deliverable:**
  **A Practical Framework & Decision Guide for Funders:** This concise, actionable document (approx. 15-20 pages) will provide:
  1.  **Clarification:** Clear definitions of Scope, Weighting, and Resolution within the moral circle metaphor.
  2.  **Indicator Audit Tool:** A structured approach for funders to analyse existing or proposed indicators, revealing which dimension(s) they measure and the implicit assumptions they make.
  3.  **Trade-off Awareness:** Concrete examples illustrating potential conflicts between dimensions, helping funders anticipate unintended consequences of indicator choices.
  4.  **Locus Considerations:** Guidance on aligning indicators with whether the desired change is in stated beliefs, patterns of attention, or institutional behaviour.
  5.  **Key Design Questions:** A checklist for funders drafting criteria: *"Which dimension(s) of expansion are we prioritising? What trade-offs are we willing to accept? How will we capture changes in noticing? Does this indicator truly reflect our definition of 'moral consideration'?"*

  **Success & Failure Criteria:**
  *   **Success:** Defined by the production of a clear, usable framework that:
      *   Enables funders to move beyond vague "circle expansion" rhetoric to specify *what kind* of expansion they seek.
      *   Provides concrete tools to critically evaluate and select indicators based on their alignment with specific priorities.
      *   Makes the implicit trade-offs in measurement explicit, leading to more intentional and philosophically coherent funding criteria.
      *   Is deemed practically valuable by at least three internal or external stakeholders reviewing the draft.
  *   **Failure:** The project fails if:
      *   The framework remains overly abstract or complex, failing to provide actionable guidance for drafting criteria (determined by stakeholder feedback in Month 8 indicating lack of utility).
      *   The analysis cannot identify clear, convincing examples of trade-offs between Scope, Weighting, and Resolution in real-world indicators (no evidence found during Months 3-4).
      *   The distinctions between Scope, Weighting, and Resolution prove unworkable or fail to capture the core tensions experienced in indicator development (concept collapses under analysis in Month 1-2).
      *   The deliverable offers no advancement beyond generic advice on indicator selection.

  **Conclusion:**
  This fellowship addresses a critical gap at the intersection of moral philosophy and practical philanthropy. By dissecting the "moral circle" metaphor and rigorously analysing how current proxies capture its constituent parts, it aims to replace implicit philosophical settlements with explicit, intentional choices. The output will empower funders to define their goals with greater precision and select indicators that genuinely reflect their vision of moral expansion, leading to more effective and coherent funding strategies for building a more inclusive future.
