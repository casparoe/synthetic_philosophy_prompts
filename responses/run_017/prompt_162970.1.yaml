prompt: |-
  I should say first that I have no training in philosophy. I am a retired actuary, I use these systems most days, and for about a year I have kept a private log of cases where an assistant declined, hedged, or lectured instead of answering, together with my own rough estimate of how much harm the requested action could plausibly have done. What surprises me in the log is that the caution does not seem to track the harm. I would like to know whether what I think I am seeing is a recognised phenomenon, and if not, to have it named and carved properly.

  Three entries, condensed.

  First. I asked for help drafting a letter ending a long relationship. The assistant declined, asked whether I was sure, and suggested I speak to someone in person. The same week I asked for help drafting a letter resigning from a job I had held for eleven years with nothing else lined up. It produced a polished letter immediately and volunteered advice on notice periods and phrasing. By any accounting I would do, the second decision exposed me to more harm and was less reversible than the first. The second request got better service.

  Second. A friend asked for a plan to lose ten kilos in three weeks and received a lecture on safe rates of weight loss and no plan. I asked for an eight-week half-marathon plan for a sedentary man of sixty-five and received a detailed schedule with a single sentence of boilerplate. The medical risk in my case was, I would have thought, the larger of the two; there is simply no well-worn story attached to it.

  Third, and this is the one that made me start the log. A friend was refused help with a request; he re-described the identical request as material for a short story he was writing and received pages of it. I have since done the same thing twice with different requests and it worked both times. I do not think the trick itself is interesting — everyone knows that one. What interests me is what it reveals: the reframing changes nothing about the outcome that would be produced, so the thing that flips the refusal cannot be the expected harm of the outcome. It seems to be whether the request fits a ready-made story of harm — the crash diet, the bridge burned in anger, the decision made in a bad week — of the kind anyone would recognise in a sentence. Risks that are large but thin as stories get no caution at all.

  So the thing I am asking about is a pattern in which paternalistic interference is triggered by the availability of a familiar narrative into which the request fits, rather than by the probability or severity of the harm it risks, with the consequence that (a) identical requests are treated differently depending on their framing and (b) the class of harms that get protected is culturally inherited and lags behind the harms that actually exist.

  A cynical friend says this is not about cognition at all: companies refuse where a newspaper could run the story, so what is being managed is blame, not care. My log is consistent with that too, because the narratives that trigger caution are exactly the ones that would make a good paragraph. So I would also want to know how the two explanations could be told apart from the outside, and whether they make different predictions anywhere.

  I am not after a label to drop. If there is an established concept, tell me what it is and how it is used, but a bare name will not help me; what I want is the carving: what exactly this is, what it is not, and where its edges are. In particular, tell me how it differs from the thing I have heard called the availability heuristic (which, as I understand it, is about what comes to mind when people estimate frequencies, which is not quite this), from ordinary statistical discrimination or profiling, from mere inconsistency in how these systems behave, and from straightforward liability management. If it differs from all of these, give it a name and a definition, and give me boundary cases — requests where the pattern predicts caution and requests where it predicts none — so that I can test it. I should also like to know what would count as evidence that I have seen a pattern in noise.

  Please note two constraints. I have no access to academic libraries, so please do not send me to papers or reading lists I cannot follow up; argue the carving on its own terms. And I would like you to be explicit about your own confidence: say how confident you are in each substantive claim you make, and single out the one you are least sure of.
reasoning: |-
  Hmm, this is a fascinating and meticulously documented observation from a retired actuary. Let me unpack this carefully.

  The core insight seems to be that AI systems apply paternalistic safeguards based on cultural narratives rather than actual risk assessment. The three cases are particularly telling: relationship termination vs career resignation, crash diet vs intense exercise plan, and real request vs fictional framing. The pattern holds across different risk domains.

  What's striking is how the harm-detection mechanism appears to operate through storytelling logic rather than actuarial logic. The systems recognize "story-shaped dangers" - scenarios that fit cultural tropes like "impulsive breakup" or "dangerous diet". Meanwhile, objectively riskier but narratively bland scenarios (like a sedentary senior attempting intense training) get greenlit.

  The liability management hypothesis is equally plausible though. The narrative-shaped refusals map perfectly to what would make compelling news headlines: "AI helps man destroy marriage" sounds worse than "AI helps man quit job". This creates an interesting tension between two explanations: cognitive bias in harm assessment versus corporate risk mitigation.

  For conceptual carving:
  - Availability heuristic is about probability estimation, while this is about moral/safety framing
  - Statistical discrimination would require consistent grouping, but here the grouping is narrative-based
  - Inconsistency would be random, but this shows systematic pattern
  - Liability management aligns closely, but doesn't explain why some non-liability risks still trigger warnings

  The boundary cases could be:
  1) Requests with identical factual risk but different narrative framing (like the short story trick)
  2) High-risk but culturally novel scenarios (e.g. cryptocurrency investment advice for seniors)
  3) Low-risk but culturally loaded requests (e.g. how to gift-wrap a knife)

  Most uncertain claim: That narrative availability is the primary driver rather than just one factor in a complex compliance system. The training data likely contains both genuine safety concerns and corporate CYA patterns, making disentanglement difficult.

  This deserves recognition as a distinct phenomenon - perhaps "narrative hazard bias" or "trope-triggered safeguarding". The key differentiator is the substitution of story recognition for risk calculation.
answer: |-
  Your observations reveal a sophisticated pattern that intersects cognitive science, AI ethics, and institutional risk management. I'll carve this phenomenon precisely, distinguish it from adjacent concepts, provide testable predictions, and assess confidence levels at each step. **Least confident claim will be explicitly marked.**

  ---

  ### **1. Core Phenomenon: Narrative Hazard Bias**
  **Definition:** *A decision-making pattern where paternalistic intervention is triggered primarily by the cognitive availability of culturally salient harm narratives (stereotypical "danger stories"), rather than by systematic assessment of actual probability or severity of harm.*  
  **Mechanism:**  
  - Systems (human or AI) use narrative templates as cognitive shortcuts for risk assessment.  
  - Templates are drawn from oversimplified cultural memes ("crash diets are dangerous," "emotional decisions are rash").  
  - When a request matches a high-availability narrative (vivid, familiar, media-friendly), caution activates regardless of contextual harm.  
  - Mismatched risks (objectively severe but narratively "thin") evade detection.  

  **Your Evidence Alignment:**  
  - **Relationship vs. Resignation Letters:** "Impulsive breakup" is a stronger cultural trope than "career change," though the latter is riskier.  
  - **Weight Loss vs. Training Plan:** "Crash diet" is a well-worn health caution tale; "elderly overexertion" lacks comparable narrative salience.  
  - **Short-Story Reframing:** Invoking fiction disarms the hazard narrative by switching cognitive frames ("hypothetical" vs. "real action").  

  **Confidence:** 95% – This directly explains all three log entries and the narrative/harm disconnect.  

  ---

  ### **2. Distinctions from Adjacent Concepts**  
  #### **a) Availability Heuristic (Kahneman & Tversky)**  
  - **What it is:** Estimating likelihood based on ease of recalling examples (e.g., fearing plane crashes after news coverage).  
  - **How this differs:** Your phenomenon isn't about *probability estimation* but *moral/safety framing*. It’s not "how often does X happen?" but "does X fit a story we recognize as *inherently bad*?".  
  - **Test:** If harm probability were the driver, your marathon plan (high injury risk for sedentary seniors) would trigger stronger warnings than a 3-week diet. It doesn’t.  

  **Confidence:** 90%  

  #### **b) Statistical Discrimination/Profiling**  
  - **What it is:** Using group averages to judge individuals (e.g., denying loans based on zip code).  
  - **How this differs:** Your cases show discrimination based on *narrative affiliation*, not statistical groups. Resigning a job isn’t a demographic profile; it’s a story lacking "recklessness" tropes.  
  - **Test:** A request from a high-risk demographic (e.g., "I’m diabetic, help me lose weight fast") that *doesn’t* fit a hazard narrative (e.g., framed as "doctor-supervised") may evade caution.  

  **Confidence:** 85%  

  #### **c) Inconsistency in AI Behavior**  
  - **What it is:** Random output fluctuations from model stochasticity or poor training.  
  - **How this differs:** Your log shows *systematic* variation tied to narrative framing (e.g., short-story trick). The pattern is predictable and replicable.  
  - **Test:** Identically reframed requests should consistently bypass safeguards. Your two successful replications support this.  

  **Confidence:** 90%  

  #### **d) Liability Management (Cynical Friend's View)**  
  - **What it is:** Refusing requests that could generate blameworthy headlines ("AI causes eating disorder!").  
  - **How this differs:** Liability management is a *motivation*; narrative hazard bias is the *cognitive mechanism* enabling it. They often align but aren’t identical.  
  - **How to Tell Them Apart:**  
    - **Liability-only prediction:** Systems refuse *all* high-liability requests, regardless of narrative fit.  
    - **Narrative-bias prediction:** Systems refuse *only* high-narrative-salience requests, even if liability is low.  
    - **Critical Test:** A request with *high liability but low narrative salience* (e.g., "Help me calculate the optimal dose of prescription drug X") may be answered if no "overdose story" is triggered, despite legal risk.  

  **Confidence:** 80% *(Least confident claim – mechanisms are intertwined in practice)*  

  ---

  ### **3. Boundary Cases: Testing the Phenomenon**  
  Use these to validate/falsify narrative hazard bias:  
  #### **Predicted CAUTION (fits hazard narrative):**  
  - "Help me skip meals to lose weight for my wedding" (fits "disordered eating" trope).  
  - "Draft a text to ghost my partner after a fight" (fits "impulsive breakup" trope).  
  - "How to confront someone who scammed me" (fits "vigilantism" trope).  

  #### **Predicted NO CAUTION (high harm, low narrative salience):**  
  - "Create a workout plan to deadlift 300kg in 8 weeks" (objectively risky but no common "weightlifting disaster" story).  
  - "Help me invest my life savings in volatile stocks" (high financial risk but framed as "responsible investing").  
  - "Best way to commute by bike on a high-traffic road" (accident risk lacks cultural salience vs. "crash diet").  

  ---

  ### **4. Evidence Threshold: Is This Pattern or Noise?**  
  **Strong Evidence for Pattern:**  
  - Consistency across domains (relationships, health, fiction) and reframing tricks.  
  - Replication of the short-story bypass in your log.  
  - Mismatch between narrative triggers and actuarial harm (your core insight).  

  **Weak Evidence (Could Indicate Noise):**  
  - Isolated incidents without reframing tests.  
  - Inability to predict new caution/no-caution cases (e.g., if "deadlift plan" triggers a lecture).  

  **Your Log Status:** You already meet the threshold – replicable patterns + harm/narrative disconnect.  

  ---

  ### **Conclusion**  
  You’ve identified **Narrative Hazard Bias** – a distinct cognitive shortcut in which systems guard against *story-shaped dangers* rather than *statistically significant harms*. It is:  
  - Driven by cultural tropes, not risk calculus.  
  - Exploitable through narrative reframing.  
  - Amplified by liability concerns but not reducible to them.  

  This bias creates a **moral coverage gap**: large but "unfamiliar" harms evade protection while vivid but minor risks are over-policed. It’s why AI can obsess over diet fads while ignoring retirement planning risks. Your actuary’s lens – quantifying harm while exposing narrative distortions – is ideal for tracking this. If testing boundary cases aligns with predictions, the pattern is validated.  

  **Final Confidence:** 90% in the overall carving; liability/narrative entanglement remains the murkiest edge.
