  ### Decision Tree: Indeterminacy of Reference and Translation  
  **Starting Commitment:** Two translation manuals fit all stimulus and behavioral evidence but disagree about what a one-word utterance (e.g., "gavagai") refers to (e.g., rabbits vs. undetached rabbit parts).  

  ---

  #### Node 1: Do the manuals disagree only about what the word refers to, or do they also assign different logical structures to the sentence (e.g., singular term vs. quantifier)?  
  - **Only reference**: Go to Node 3.  
  - **Also logical structure**: Go to Node 2.  

  #### Node 2: Can the disagreement in logical structure be extended to the entire language (e.g., reinterpret quantifiers and identity) without changing the truth conditions of any sentence?  
  - **Yes**: Go to Node 4.  
  - **No**: Go to Node 5.  

  #### Node 3: Can the disagreement about reference be extended to the entire language (e.g., by permuting objects) without changing the truth conditions of any sentence?  
  - **Yes**: Go to Node 4.  
  - **No**: Go to Node 5.  

  #### Node 4: Does this global reinterpretation work even if the linguist has all physical facts (including neural states and causal history)?  
  - **Yes**: Go to Node 6.  
  - **No**: Go to Node 7.  

  #### Node 5: Does the local disagreement (without global extension) imply there is no fact of the matter about the correct manual?  
  - **Yes**: Go to Node 8.  
  - **No**: Go to Node 9.  

  #### Node 6: Does this global indeterminacy apply to your own language as well?  
  - **Yes**: Go to Node 10.  
  - **No**: Go to Node 11.  

  #### Node 7: What breaks the symmetry between manuals, given all physical facts?  
  - **Internal states (e.g., brain computations)**: Leaf D.  
  - **External relations (e.g., causal history)**: Leaf E.  

  #### Node 8: Can we still use meaning-talk (e.g., "refers to rabbits") in a useful way despite having no fact of the matter?  
  - **Yes**: Leaf G.  
  - **No**: Leaf X.  

  #### Node 9: Is the remaining underdetermination resolved by interactions between speakers and the world (e.g., shared responses to stimuli)?  
  - **Yes**: Leaf C.  
  - **No**: Leaf B.  

  #### Node 10: Must we relativize reference to a background language to make sense of meaning?  
  - **Yes**: Leaf A.  
  - **No**: Leaf F.  

  #### Node 11: Why is your own language immune to the indeterminacy affecting the alien language?  
  - **First-person access to meanings**: Leaf Y.  
  - **Community norms or practices**: Leaf Z.  

  ---

  ### Leaves (Positions)  
  **Leaf A: Quine’s Package**  
  - *Label*: Inscrutability + Background Relativity  
  - *Awkward Commitment*: Reference is meaningless without specifying a manual, making "what exists" relative.  
  - *Push-Off Consideration*: Feels counterintuitive for everyday claims like "rabbits exist."  

  **Leaf B: Deflationary Reading**  
  - *Label*: Ordinary Underdetermination  
  - *Awkward Commitment*: Treats meaning like scientific theories—indeterminate only until better evidence arrives.  
  - *Push-Off Consideration*: Fails to explain why meaning feels more determinate in practice than, say, theoretical physics.  

  **Leaf C: Triangulation-Style Reply**  
  - *Names*: Davidson  
  - *Awkward Commitment*: Meaning requires at least two speakers interacting, making solitary language impossible.  
  - *Push-Off Consideration*: Struggles to explain how new terms are introduced without prior shared practices.  

  **Leaf D: Internalist Reply**  
  - *Names*: Chomsky  
  - *Awkward Commitment*: Meaning is fixed by innate brain structures, even if behavior can’t reveal it.  
  - *Push-Off Consideration*: Makes meaning private and unverifiable, risking solipsism.  

  **Leaf E: Direct-Reference Reply**  
  - *Names*: Kripke, Putnam  
  - *Awkward Commitment*: Initial "baptism" (e.g., pointing at a rabbit) fixes reference rigidly, regardless of later errors.  
  - *Push-Off Consideration*: Breaks down for abstract terms (e.g., "justice") with no clear baptism.  

  **Leaf F: Global Permutation Worry**  
  - *Label*: Radical Indeterminacy  
  - *Awkward Commitment*: Every object in the universe could be "reassigned" (e.g., rabbits to numbers) without changing truths.  
  - *Push-Off Consideration*: Seems to undermine science by making reference arbitrary.  

  **Leaf G: Meaning-Skepticism with Skeptical Solution**  
  - *Names*: Kripke (Wittgenstein-inspired)  
  - *Awkward Commitment*: There are no meaning facts, only community agreements about use.  
  - *Push-Off Consideration*: Makes normativity (e.g., "misusing a word") purely social, not factual.  

  **Leaf X: Error Theory** (Unnamed)  
  - *Reason Unoccupied*: Unattractive (implies all meaning-talk is false).  
  - *Awkward Commitment*: Communication must be an illusion.  
  - *Push-Off Consideration*: Contradicts the practical success of language.  

  **Leaf Y: Privileged Access** (Unnamed)  
  - *Reason Unoccupied*: Incoherent under scrutiny.  
  - *Awkward Commitment*: First-person authority magically fixes reference.  
  - *Push-Off Consideration*: Cannot explain how children learn words without this access.  

  **Leaf Z: Community Relativism** (Unnamed)  
  - *Reason Unoccupied*: Unattractive (collapses into Leaf G).  
  - *Awkward Commitment*: Meaning is whatever your culture says, risking relativism.  
  - *Push-Off Consideration*: Fails if the whole community is wrong (e.g., pre-Copernican "sun orbits earth").  

