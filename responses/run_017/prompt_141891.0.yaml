  ### Notes on the Tree  
  - **Unseparated Leaves**:  
    - **Leaf G and Leaf Z** are not cleanly separated. To split them, add: *"Does the skeptical solution require actual community agreement, or could a solitary speaker follow rules?"* (Leaf G requires community; Leaf Z might allow solo speakers but doesn’t exist).  
  - **Spectrum Nodes**:  
    - **Node 4 (Global + Physical Facts)**: Answers form a spectrum from "physical facts fix reference" (No) to "no facts can fix it" (Yes).  
    - **Node 9 (Underdetermination Resolution)**: "Interactions" range from basic causal links (closer to Leaf E) to full triangulation (Leaf C).  
  - **Empty Combinations**:  
    - **Node 6 (No) + Node 11 (Any)**: Unoccupied. Reason: Incoherent—if indeterminacy is global and survives physical facts, no principled way to exempt "home" languages.  
    - **Node 5 (No) + Node 9 (No)**: Unoccupied. Reason: Unattractive—denies both indeterminacy and resolution methods, leaving no account of how meaning is fixed.  

