  Case 4: (False but justified) You assert "The meeting is in room 201" based on the official schedule you checked this morning. Unbeknownst to you, there was a last-minute room change and the schedule was not updated.
     - Knowledge norm: A (not known); truth norm: A (false); justified belief norm: B.

  Case 5: (Self-fulfilling) You assert "I will finish the paper by tomorrow" and by saying it, you commit yourself and then do finish it.
     - Knowledge norm: A (at the time of assertion, you didn't know); truth norm: B (it became true); some might say B because of the self-fulfilling nature.

  Case 6: (Redundant) You assert to your colleague "The department meeting is on Friday" even though you both just left the meeting where it was announced.
     - Typically, C.

  Case 7: (Vagueness) You assert "John is bald" when John is borderline bald.
     - Truth norm might say A if we think it's not true (or not false); knowledge norm: A (you can't know a borderline proposition); but some views say B (it's true enough).

  Case 8: (Institutional) A weather app says "It will rain tomorrow" based on a reliable algorithm, but no meteorologist has checked this particular prediction.
     - Knowledge norm: A (no knower); truth norm: B if true; institutional views: B.

  Case 9: (Hedged) You say "I think that the answer is 42" when you are not sure.
     - Knowledge norm for flat-out assertion might not apply, but for the hedged assertion, the norm might be met if you do think that. So B.

  Case 10: (Clinical context) A doctor tells a patient "You have a 50% chance of survival" based on statistics, but the patient has asked for a definite answer.
     - In clinical context, the norm might be to give the best available evidence, so B. But if the norm is knowledge, and the doctor doesn't know the outcome, then A.

  Scoring Key for Part B:

  We group the norms and see which norm would give which answer.

  For example:

  - Deflationary view: Typically B or C in many cases, because there is no special norm.

  - Knowledge norm: 
     - Case 1: A
     - Case 2: A
     - Case 3: B (if invariant) or A (if stakes-sensitive)
     - Case 4: A
     - Case 5: A
     - Case 6: B (unless there is a hearer-knowledge condition, but usually not)
     - Case 7: A
     - Case 8: A
     - Case 9: B (because it's hedged, so not a full assertion? Or if we treat it as an assertion of "I think...", then it might be known, so B)
     - Case 10: A

  - Truth norm:
     - Case 1: B (true)
     - Case 2: B (true)
     - Case 3: B (true)
     - Case 4: A (false)
     - Case 5: B (true)
     - Case 6: B (true)
     - Case 7: A (if we think it's not true) or B (if we think it's true or has no truth value and that's okay)
     - Case 8: B (if true)
     - Case 9: B (if "I think" is true)
     - Case 10: B (if the chance is 50%, then the statement is true)

  - Justified belief norm:
     - Case 1: B (justified)
     - Case 2: A or B (depending on whether statistical evidence is enough for justification)
     - Case 3: B (justified)
     - Case 4: B (justified)
     - Case 5: A or B (might not be justified at the time)
     - Case 6: B
     - Case 7: B (if the belief is justified)
     - Case 8: B (if the algorithm provides justification)
     - Case 9: B
     - Case 10: B

  But we see that some cases are not decisive alone, so we look at the pattern.

  The scoring key will have a table for each norm, showing the expected answers. Then we count how many match.

  For the cases that are designed to pull apart specific pairs, we can have:

     - Case 1: pulls apart knowledge norm vs. truth norm and justified belief norm.
     - Case 2: pulls apart knowledge norm and some versions of justified belief norm from truth norm and statistical evidence accepting views.
     - Case 3: pulls apart stakes-sensitive from invariant norms.
     - Case 4: pulls apart truth norm from justified belief norm.
     - Case 5: pulls apart knowledge norm from truth norm (if we assume that at the time of assertion it wasn't true) but it's tricky.
     - Case 6: pulls apart norms that require informativeness (which might be pragmatic) from those that don't.
     - Case 7: pulls apart views on vaguen.
     - Case 8: pulls apart individual-based norms from institutional.
     - Case 9: tests hedged assertions.
     - Case 10: pulls apart context-relative norms.

  Finally, we note where the tree cannot separate two norms. For example, the knowledge norm and the warrant norm might be very close, and the cases might not distinguish them. Also, the truth norm and knowledge norm might give the same verdict in many cases except the Gettier case (Case 1) and the false but justified (Case 4) and the lottery (Case 2). So if someone answers B for Case 1, they are not holding the knowledge norm.

  This is a very high-level sketch. Due to the complexity and length, we cannot provide the full instrument in this response, but we have provided the structure and examples.
answer: |-
  Below is the two-part instrument designed to sort participants by their verdicts on cases and meta-questions, revealing their implicit commitment to a norm of assertion. Proper names are minimized, focusing on the logical space of views. Empty cells in the space are diagnosed (incoherent, unattractive, unexplored). The instrument prioritizes concrete cases over labels, with Part A establishing meta-commitments and Part B testing cases. The scoring key maps answer patterns to norms, flags ties/inconsistencies, and identifies which cases distinguish key pairs.

  ---

  ### **Part A: Meta-Questions Decision Tree**  
  *Answer each question based on intuition, without overthinking implications. Follow the branches to your leaf.*

  1. **Is there a distinct *norm* governing assertion (beyond general intentions like getting someone to believe)?**  
     - **Yes** → Q2  
     - **No** → **Leaf: Deflationary View** (Assertion requires only the intention to induce belief; no further norm).

  2. **Is this norm *constitutive* of assertion (so violating it means the act isn’t a "proper assertion")?**  
     - **Yes** → Q3  
     - **No** → Q4 (Norm is regulative; assertions can be "proper" but criticizable).

  3. **When violated, what is defective?**  
     - **The assertion itself** (like an ineligible move in a game) → Q5  
     - **The speaker** (they’re blameworthy, but the act is valid) → **Leaf: Blameworthy-Speaker Norm** (e.g., some "reasonable belief" variants).

  4. **If not constitutive, what does violating the norm imply?**  
     - **The assertion is defective** (flawed as an assertion, even if "proper") → Q5  
     - **The speaker is blameworthy** → **Leaf: Blameworthy-Speaker Norm**  
     - **Neither; it’s merely infelicitous** (pragmatically odd) → **Leaf: Deflationary View** (inconsistent with "Yes" at Q1).

  5. **Does the norm require a *binary* epistemic property (e.g., knowledge) or can it admit *degrees* (e.g., justification strength)?**  
     - **Binary** (threshold must be met) → Q6  
     - **Degrees** (tracks practical stakes/interest) → **Leaf: Stakes-Sensitive Norm** (e.g., sensitive knowledge/reasonable belief).

  6. **Is the norm *uniform* across contexts or *relativized* to practices?**  
     - **Uniform** (same for all assertions) → Q7  
     - **Relativized** (depends on subject/context, e.g., clinical vs. casual) → **Leaf: Context-Relativist Norm** (e.g., practice-based warrant).

  7. **Can the norm shift with the *audience’s* epistemic position?**  
     - **Yes** → **Leaf: Audience-Relative Norm** (e.g., "common ground" truth/knowledge).  
     - **No** → Q8  

  8. **Must the speaker be able to *tell from the inside* that they meet the norm?**  
     - **Yes** → **Leaf: Internal-Access Norm** (e.g., internalist justified belief).  
     - **No** → **Leaf: Knowledge Norm or Truth Norm** (distinguished in Part B).

  ---

  **Part A Logical Space & Diagnostics**:  
  - **Occupied Leaves**: Deflationary, Blameworthy-Speaker, Stakes-Sensitive, Context-Relativist, Audience-Relative, Internal-Access, Knowledge/Truth (distinguished in Part B).  
  - **Empty Cells**:  
    - *Constitutive + Degrees*: Incoherent (constitutive norms require fixed thresholds).  
    - *Relativized + Uniform "No" at Q6*: Incoherent (relativization contradicts uniformity).  
    - *Constitutive + Audience-Relative*: Unattractive (constitutive norms are speaker-centric; rarely defended).  
    - *Non-constitutive + Binary + Internal-Access + Context-Relativist*: Unexplored (possible but no prominent theories).  

  ---

  ### **Part B: Cases Quiz**  
  *For each case, pick one verdict:*  
  - **A**: Defective (normatively flawed, even if blameless).  
  - **B**: In order (normatively acceptable).  
  - **C**: Not defective but pointless/infelicitous (pragmatic issue only).  

  1. **Gettiered Sheep**: You see a realistic sheep-shaped rock in a field and assert, “There’s a sheep.” Unbeknownst to you, a hidden real sheep is behind the rock. Your belief is justified and true, but environmentally lucky.  
     - *Distinguishes: Knowledge vs. Truth/Justified Belief*  

  2. **Lottery Claim**: You assert, “Your ticket lost,” based solely on 1-in-a-million odds. The ticket did lose.  
     - *Distinguishes: Knowledge/Stakes-Sensitive vs. Truth/Justified Belief*  

  3. **Raised Stakes**: You assert, “The flight departs at 3 PM,” based on usual evidence (e.g., past flights). Moments later, missing it would cause financial ruin. You don’t recheck.  
     - *Distinguishes: Stakes-Sensitive vs. Invariant Norms*  

  4. **False but Justified**: You assert, “The talk is in Room 201,” based on a reliable schedule. Unbeknownst to you, it was moved to Room 202.  
     - *Distinguishes: Truth vs. Knowledge/Justified Belief*  

  5. **Self-Fulfilling Intention**: You assert, “I’ll finish by Tuesday,” to motivate yourself. Saying it makes it true.  
     - *Distinguishes: Truth vs. Knowledge (future claims)*  

  6. **Redundant Assertion**: You assert, “2+2=4,” to a mathematician who already knows this.  
     - *Distinguishes: All norms (A/B) vs. Deflationary (C)*  

  7. **Borderline Vague**: You assert, “This cup is full,” when it’s 95% full. Precision is expected.  
     - *Distinguishes: Truth (if gappy) vs. Knowledge/Justified Belief*  

  8. **Automated Forecast**: A weather app asserts, “Rain tomorrow,” via algorithms. No human checked it.  
     - *Distinguishes: Knowledge (individual) vs. Truth/Institutional Warrant*  

  9. **Hedged Claim**: You assert, “I believe it’s safe,” without full certainty. It is safe.  
     - *Distinguishes: Knowledge/Truth vs. Reasonable Belief (hedging accepts weaker norms)*  

  10. **Clinical Prognosis**: A doctor asserts, “You have 6 months,” based on statistics. The patient asked for truth, but the context prioritizes hope.  
      - *Distinguishes: Context-Relativist vs. Uniform Norms*  

  ---

  ### **Scoring Key**  
  **Step 1: Resolve Part A**  
  - Your Part A leaf narrows norms. If you got **Knowledge/Truth** (Q8 → "No"), Part B distinguishes them.  
  - **Ties/Inconsistencies**: If Part A answers conflict (e.g., "constitutive + stakes-sensitive"), default to Part B or redo Part A.  

  **Step 2: Map Part B Answers to Norms**  
  Use the table below to tally matches between your verdicts and each norm’s expected answers. The norm with the most matches wins. Ties indicate hybrid views or unresolved intuitions.  

  | Case | Knowledge | Truth | Justified/Reasonable Belief | Stakes-Sensitive | Context-Relativist | Audience-Relative | Deflationary |
  |------|----------|-------|-----------------------------|------------------|---------------------|-------------------|-------------|
  | 1    | A        | B     | B                           | A/B (stakes-dep.) | B                   | B                 | C           |
  | 2    | A        | B     | B (if stats suffice)        | A (high stakes)  | B                   | B                 | C           |
  | 3    | B        | B     | B                           | A (stakes raised)| A (if context shifts)| B                 | C           |
  | 4    | A        | A     | B                           | A                | B                   | B                 | C           |
  | 5    | A        | B     | B                           | B                | B                   | B                 | C           |
  | 6    | B        | B     | B                           | B                | B                   | A (if audience knows)| C        |
  | 7    | A        | A     | B (if justified)            | A (high stakes)  | B                   | B                 | C           |
  | 8    | A        | B     | B (if warranted)            | B                | B (institutional)   | B                 | C           |
  | 9    | B        | B     | B                           | B                | B                   | B                 | C           |
  | 10   | A        | A     | B                           | A                | B (clinical norms)  | B                 | C           |

  **Key**:  
  - **Knowledge Norm**: Requires ungettiered, non-lucky justification. Expects A in 1,2,4,5,7,8,10.  
  - **Truth Norm**: Violated only by falsity. Expects A in 4,7,10; B elsewhere.  
  - **Justified/Reasonable Belief**: Permits lucky truths. Expects B except in high-stakes (3A, 7A if strict).  
  - **Stakes-Sensitive**: Varies with stakes. Expects A in 1,2,3,4,7,10 if stakes high.  
  - **Context-Relativist**: Depends on practice. Expects B in 8,10; A only if practice violated (e.g., 3A if casual context).  
  - **Audience-Relative**: Shifts with hearer. Expects A in 6 if hearer knows; B elsewhere.  
  - **Deflationary**: No norm; pragmatic issues only. Expects C in 1–10.  

  **Step 3: Resolve Ambiguities**  
  - **Knowledge vs. Truth Norm**: Hard to distinguish in Cases 5 (self-fulfilling), 7 (vagueness), and 9 (hedging). If you answered:  
    - Case 5: **A** → Knowledge; **B** → Truth.  
    - Case 7: **A** → Both possible; **B** → Truth (if gappy) or Justified Belief.  
    - Case 9: **A** → Neither; **B** → Both (hedging avoids defect).  
    *Further case needed*: “Asserting a logical truth (e.g., ‘All bachelors are unmarried’) to an amnesiac who doesn’t know it.” Knowledge: A (hearer doesn’t know); Truth: B.  
  - **Knowledge vs. Stakes-Sensitive/Context-Relativist**: Case 3 (raised stakes) and Case 10 (clinical) pull them apart.  
  - **Tied Scores**: You hold a hybrid view (e.g., stakes-sensitive knowledge) or have inconsistent intuitions. Revisit conflicting cases.  

  **Diagnostic Table for Case-Pair Distinctions**:  
  | Case | Primary Pair Distinguished | Secondary Pair |
  |------|----------------------------|---------------|
  | 1    | Knowledge vs. Truth | Knowledge vs. Justified Belief |
  | 2    | Knowledge vs. Truth | Stakes-Sensitive vs. Invariant |
  | 3    | Stakes-Sensitive vs. Knowledge/Truth | Context-Relativist vs. Uniform |
  | 4    | Truth vs. Justified Belief | Knowledge vs. Truth |
  | 5    | Knowledge vs. Truth | Self-fulfilling assertions |
  | 6    | All norms vs. Deflationary | Audience-Relative vs. Uniform |
  | 7    | Truth vs. Justified Belief | Knowledge in vague cases |
  | 8    | Knowledge vs. Truth/Institutional | Context-Relativist |
  | 9    | Knowledge/Truth vs. Weaker Norms | Hedging as norm-satisfying |
  | 10   | Context-Relativist vs. Uniform | Stakes-Sensitive |

  ---

  ### **Design Notes**  
  - **Why this works**: Forces engagement with cases before labels, reveals implicit commitments, and exposes unexplored spaces (e.g., constitutive audience-relative norms).  
  - **Weak Distinctions**: Knowledge/Truth norms converge on Cases 5,7,9. Knowledge/“no luck” surrogates (e.g., warrant) are nearly indistinguishable; Case 1 (Gettier) is the best separator.  
  - **Flexibility**: Scoring allows degrees (e.g., “mostly knowledge norm with stakes-sensitivity”).  
  - **For Groups**: Use Part B to spark debate, then run Part A to systematize positions. Empty cells (e.g., constitutive+stakes-sensitive) provoke discussion on why they’re incoherent.  

  This instrument isolates core intuitions and maps them to the normative landscape without name-dropping. Customize cases as needed for your group’s focus (e.g., deepen clinical context in Case 10).
