prompt: |-
  Last night I got into a long argument with my friend Ruth about whether evolutionary psychology is a science or an elaborate machine for generating just-so stories. Our friend Emil joined in against her, though not entirely on my side, and after roughly an hour the three of us were going in circles. Below I have reconstructed the argument as a two-sided exchange between Ruth and Emil, since that is where the substance lay; I have left myself out of it, and I would rather you not try to infer my own position from the way I have written it up, because I do not have one I am confident in.

  1. Ruth: The problem is not that evolutionary psychology makes claims about the past; it is that the hypothesis is generated by staring at the behavior to be explained and there is no independent record of the selection event. Give her any trait — disgust, gossip, morning sickness, men's preference for younger women — and she can produce two or three adaptive stories in an afternoon that fit it equally well. A story built to fit the data cannot then cite the fit as evidence for itself.

  2. Emil: That describes a parody, not the literature. Working papers derive predictions about phenomena that were not part of the data that prompted the hypothesis: if disgust is a pathogen-avoidance system, it should track cues of transmissibility rather than toxicity, should calibrate to local parasite ecology, should weaken when the costs of avoidance are high, and should not simply be fear in another costume. Those are testable now. And the charge proves too much: by Ruth's standard, historical geology and cosmology are just-so stories, since nobody can rerun the Cambrian.

  3. Ruth: She will concede that some hypotheses are testable in principle; her objection is about what the tests actually do. The predictions are usually directional and soft — more, faster, stronger — so almost any outcome can be narrated afterward as consistent, and the rival cultural-learning or domain-general-learning account generally predicts the same direction, so the result rarely discriminates. As for the analogy: geology has strata and isotope ratios, an independent record. Recurrence of a trait across cultures is itself part of the data to be explained, so it cannot also be the independent check on the explanation.

  4. Emil: Recurrence is not simply the datum restated. If the same pattern shows up in societies with no plausible contact or shared ancestry, then a diffusion story has to explain why, and a "we learned it locally" story inherits a cost it did not have before. That is a genuine constraint from outside the hypothesis.

  5. Ruth: Then the target moves. Evolutionary psychology slides among three different things it might be explaining: the observable behavior, the underlying psychological mechanism, and the universal capacity of which the behavior is one local expression. Whenever cross-cultural data go the wrong way, the retreat is always to "the mechanism is universal; its output depends on local ecology" — and no pattern of cultural variation can refute that, because variation was built into the claim. She called this target drift, and said it is the real reason the hypotheses feel unfalsifiable.

  6. Emil: That is not evasion, that is how biology works. Conditional strategies and reaction norms are evolved outcomes, not excuses: a mechanism that implements a switch is a specific, testable claim, because you can go looking for the cue the switch is set to and test whether the output tracks it. The accusation of target drift confuses explaining the mechanism with explaining the variance in behavior, and those are different explanatory projects.

  7. Ruth: Fine — let her stop complaining about falsifiability in the abstract and make it concrete. She grants that the mechanism claim is testable. Her point is that the field only ever puts the mechanism claim at risk, never the selection claim, and she proposed a test, which she called the two-track test: separate (i) the design claim — there exists a domain-specific system with such-and-such input criteria, computations, and outputs — from (ii) the selection-history claim — it was shaped by selection for function F in ancestral environments. Track (i) is testable now, but it does not entail (ii): the same mechanism is equally compatible with selection for a different function, with a by-product of something else that was selected, with exaptation, with selection operating at a different level, and with drift plus cultural canalization. Unless the non-adaptive alternatives are specified with equal care and given real prior weight, and unless the field publishes tests designed to discriminate among them, the science all lives in track (i) and the evolutionary story is ornament.

  8. Emil: That is the spandrels objection wearing a new hat. By-product, exaptation, and constraint hypotheses are stock moves in the field, not suppressed ones. And inference to the best explanation across several independent lines is exactly the method historical science has; what Ruth wants is a discriminating experiment, which imports a standard from experimental science that no historical hypothesis could meet — you cannot rerun the Pleistocene. She should also say what her rival is: if domain-general learning explains these phenomena, that is a testable claim too, and it has been tested.

  9. Ruth: The Cambrian analogy is the weak joint. In the cases that give historical inference its good name — the eye, echolocation, locomotion — there is an independent criterion of good design supplied by optics, acoustics, or mechanics, against which the structure can be checked; the fit is informative because the task is specified without reference to the organ. In human social psychology the adaptive problem is normally described in the same folk vocabulary as the behavior it is meant to explain, and the ancestral environment is often reconstructed partly from the trait itself. So the fit is much closer to circular than the analogy implies, and consilience among lines that share that vocabulary is weaker evidence than it looks.

  10. Emil: Then treat the evolutionary story as a heuristic rather than as a finding. Its value is that it suggests mechanism-level hypotheses nobody would otherwise have thought to look for, and those are testable now; a story that turns out to be literally false can still have earned its keep by what it led someone to discover. She is also ignoring semi-independent constraints: formal models of optimal behavior under ancestral constraints, and comparative data from other primates.

  11. Ruth: If that is the defense, it concedes what she actually cares about. Evolutionary psychology would then be a source of hypotheses about mechanisms, not an explanation of why people behave as they do — and the field's own summaries, popular ones and a good many published ones, present it as the latter. She is not asking anyone to stop telling stories; she is asking that the story be marked as a promissory note rather than cashed as a result.

  Please adjudicate this move by move: for each numbered turn, say whether it is right, partly right, or mistaken, and why — I would rather have eleven verdicts than one overall judgment. In doing so, please keep separate: (a) whether evolutionary-psychology hypotheses are testable in principle; (b) whether the field's actual practice puts the selection claim at risk or only the mechanism claim; (c) what Ruth's two-track test would and would not establish if it were actually run; and (d) whether Emil's retreat to "heuristic, not finding" gives Ruth everything she asked for, or something less than she thinks. Then tell me who is more right overall — or tell me that question is ill-posed and why. Say also what both of them are missing.

  On confidence: for each verdict, mark how confident you are and what kind of evidence or argument would move you off it; if your confidence differs a lot between the turns, I want to see that rather than a uniform tone. And if something in the way I have framed this rests on a mistake — if "just-so story" is doing two or three different jobs in their exchange, if the two-track test cannot bear the weight Ruth puts on it, if the strong form of her circularity charge would indict paleontology and archaeology too and so proves too much — say so plainly rather than answering politely. Being corrected is more useful to me than being agreed with. Please write in American English and take whatever space you need, but do not pad. And please do not hand me a reading list or citations: I am interested in the arguments, not in what to read next.
reasoning: |-
  Okay, let me unpack this user's request carefully. They've presented an intricate debate between Ruth and Emil about evolutionary psychology's scientific validity, asking for a move-by-move adjudication with specific parameters. 

  First, I need to analyze the core tensions: Ruth critiques EP for circular reasoning and unfalsifiability, while Emil defends its testability and heuristic value. The user wants eleven distinct verdicts addressing (a) testability in principle, (b) actual practice risks, (c) Ruth's two-track test implications, and (d) Emil's heuristic defense. 

  Hmm, the challenge is maintaining strict separation of these four threads while tracking the dialectic. Ruth's circularity concern (Point 9) feels particularly thorny - she's right that social adaptations lack engineering benchmarks like optics, but Emil correctly notes formal modeling provides some constraint. I should flag where their arguments overgeneralize (e.g., Ruth's "always" in Point 5 isn't quite fair).

  For confidence ratings, I'll anchor them to epistemic grounds: high confidence where logic is airtight (Emil's Point 6 on biology's conditional strategies), lower where empirical evidence would settle disputes (like how often EP actually tests selection claims). The user explicitly wants this variance highlighted.

  Noticing the user's meta-commentary - they're intellectually honest ("correcting me is more useful than agreeing"), time-conscious ("no padding"), and wary of citation-dumping. My responses should mirror that precision. Their neutral framing suggests they genuinely want the steelmanned versions of both arguments exposed.

  Biggest trap to avoid: conflating the four analysis dimensions. When judging Point 7, for instance, I must disentangle whether the two-track test is logically sound (it is) from whether EP practices it (they don't, hence Ruth's complaint). Emil's heuristic retreat in Point 10 does surrender explanatory ground - that's a key concession the user wants flagged.

  The Cambrian analogy debate (Points 2 vs 9) needs special care. Ruth's right about weaker constraints in EP, but Emil's historical science defense holds water. I'll note this tension without false resolution - some disagreements stem from differing standards of evidence, not logic errors.

  Finally, the "who's more right" conclusion shouldn't force a binary. Ruth wins on descriptive accuracy of EP's overreach, Emil on principle defensibility. Their blind spots are complementary: Ruth undersells heuristic value, Emil overstates current rigor. That synthesis might serve the user best.
answer: |-
  Below is a move-by-move adjudication of Ruth and Emil's debate. Verdicts address your requested dimensions **(a) testability in principle, (b) actual practice, (c) Ruth's two-track test, (d) Emil's heuristic defense**, alongside confidence assessments and blind spots. Arguments are evaluated on their logical coherence and empirical plausibility, not personal agreement.

  **1. Ruth's Opening (Just-so stories via circularity)**  
  *Verdict:* **Partly Right**  
  *(a) Testability Principle:* Correct that generating *only* post-hoc adaptive stories without independent tests is unscientific. BUT overstates inevitability; EP hypotheses *can* be testable.  
  *(b) Actual Practice:* Accurate for *some* EP work ("two or three adaptive stories in an afternoon" occurs), but not all.  
  *(c) Two-Track Test:* Not yet addressed.  
  *(d) Heuristic Defense:* Not yet addressed.  
  *Confidence:* High (8/10). Evidence: Well-documented cases of EP post-hoc storytelling.  
  *Blind Spot:* Fails to acknowledge EP's *attempts* at prediction (e.g., pathogen-disgust research).  

  **2. Emil's Defense (Testability & Historical Science Analogy)**  
  *Verdict:* **Right**  
  *(a) Testability Principle:* Correct that EP can generate testable predictions (e.g., disgust tracking transmissibility cues). Valid point about historical sciences (geology, cosmology).  
  *(b) Actual Practice:* Correct that *some* literature does this (e.g., core disgust research).  
  *(c) Two-Track Test:* Not addressed.  
  *(d) Heuristic Defense:* Not addressed.  
  *Confidence:* High (9/10). Evidence: Examples exist (e.g., kin recognition mechanisms tested cross-culturally).  
  *Blind Spot:* Overlooks Ruth's point that *many* EP predictions are "soft" and fail to rule out alternatives.  

  **3. Ruth's Reply (Soft Predictions & False Geology Analogy)**  
  *Verdict:* **Right**  
  *(a) Testability Principle:* Correct that directional/soft predictions and shared predictions with rivals (e.g., cultural learning) weaken discriminatory power.  
  *(b) Actual Practice:* Accurate critique of prevalent EP practice.  
  *(c) Two-Track Test:* Not addressed.  
  *(d) Heuristic Defense:* Not addressed.  
  *Confidence:* High (8/10). Evidence: Meta-analyses showing many EP "confirmations" are weak.  
  *Blind Spot:* Understates cases where EP predictions *are* specific and discriminatory (e.g., auditory looming bias).  

  **4. Emil on Recurrence as Constraint**  
  *Verdict:* **Partly Right**  
  *(a) Testability Principle:* Correct that cross-cultural recurrence *can* constrain explanations (e.g., ruling out *simple* diffusion).  
  *(b) Actual Practice:* Overly optimistic; EP often treats recurrence as *proof* of adaptation without rigorously testing non-adaptive causes.  
  *(c) Two-Track Test:* Not addressed.  
  *(d) Heuristic Defense:* Not addressed.  
  *Confidence:* Medium (6/10). Evidence: Recurrence *can* be evidence, but often confounded with cultural universals or shared constraints.  
  *Blind Spot:* Ignores Ruth’s point: recurrence is part of the explanandum, not independent validation.  

  **5. Ruth on "Target Drift" (Mechanism vs. Behavior)**  
  *Verdict:* **Right**  
  *(a) Testability Principle:* Correct that retreating to universal mechanisms + local ecology can make selection claims unfalsifiable if not carefully specified.  
  *(b) Actual Practice:* Accurate description of common EP evasion ("the mechanism is universal, output varies").  
  *(c) Two-Track Test:* Sets up its necessity.  
  *(d) Heuristic Defense:* Not addressed.  
  *Confidence:* High (9/10). Evidence: EP literature frequently shifts explanatory targets when data conflict.  
  *Blind Spot:* Underplays that conditional mechanisms *are* testable (Emil's next point).  

  **6. Emil on Conditional Strategies as Biology**  
  *Verdict:* **Right**  
  *(a) Testability Principle:* Correct that conditional mechanisms (reaction norms) are legitimate, testable biological hypotheses (e.g., identify triggering cues).  
  *(b) Actual Practice:* Valid defense of *some* EP work, but doesn't refute that target drift *is* used evasively in practice.  
  *(c) Two-Track Test:* Not addressed.  
  *(d) Heuristic Defense:* Not addressed.  
  *Confidence:* High (8/10). Evidence: Successful tests of conditional strategies in biology (e.g., phenotypic plasticity).  
  *Blind Spot:* Concedes Ruth’s point about "explaining variance" vs. "explaining mechanisms" but doesn't address how this enables evasion in EP.  

  **7. Ruth's Two-Track Test**  
  *Verdict:* **Right**  
  *(a) Testability Principle:* Correct that mechanism claims (i) are testable now, but selection claims (ii) require different evidence and are often assumed.  
  *(b) Actual Practice:* Accurate: EP rarely tests (ii) against non-adaptive alternatives with equal rigor.  
  *(c) Two-Track Test:* Logically sound. Running it *would* establish if (i) is true but *would not* confirm (ii); it would force explicit testing of (ii) against alternatives.  
  *(d) Heuristic Defense:* Not addressed.  
  *Confidence:* High (9/10). Evidence: EP’s frequent conflation of current utility with past selection.  
  *Blind Spot:* Underestimates difficulty of specifying "non-adaptive alternatives" with equal precision.  

  **8. Emil's Spandrels & Historical Science Defense**  
  *Verdict:* **Partly Right**  
  *(a) Testability Principle:* Correct that by-products/exaptations *are* discussed in EP, and historical sciences use consilience.  
  *(b) Actual Practice:* Overstates rigor; non-adaptive alternatives are often straw men, not "stock moves" tested equally.  
  *(c) Two-Track Test:* Mischaracterizes it; Ruth seeks consilience *specifically for (ii)*, not a "discriminating experiment."  
  *(d) Heuristic Defense:* Not addressed.  
  *Confidence:* Medium (5/10) on practice; High (8/10) on principle. Evidence: Many EP papers pay lip service to alternatives but design tests only for (i).  
  *Blind Spot:* Fails to engage Ruth’s core demand: test (ii) *as seriously as* (i).  

  **9. Ruth on Weak Cambrian Analogy (Circular Problem Description)**  
  *Verdict:* **Right**  
  *(a) Testability Principle:* Correct that weak problem specification (using folk categories) + lack of engineering benchmarks makes "fit" less probative in EP than in anatomy.  
  *(b) Actual Practice:* Accurate for much EP (e.g., describing "mate preference" in folk terms).  
  *(c) Two-Track Test:* Reinforces its need.  
  *(d) Heuristic Defense:* Not addressed.  
  *Confidence:* High (8/10). Evidence: EP’s reliance on vague adaptive problems (e.g., "status acquisition").  
  *Blind Spot:* Some EP research *does* use formal models (e.g., game theory) as benchmarks.  

  **10. Emil's Retreat to Heuristic**  
  *Verdict:* **Partly Right**  
  *(a) Testability Principle:* Valid that stories can heuristically generate testable mechanism hypotheses.  
  *(b) Actual Practice:* True of *some* EP, but not how the field typically presents itself.  
  *(c) Two-Track Test:* Sidesteps it.  
  *(d) Heuristic Defense:* **Concedes Ruth's core point:** If EP is *only* a heuristic for (i), it *cannot* directly support (ii) as "explanation." This gives Ruth what she asked for regarding (ii).  
  *Confidence:* High (9/10) on concession; Medium (6/10) on heuristic value claim.  
  *Blind Spot:* Underplays that even as heuristic, circular stories can mislead research.  

  **11. Ruth on Heuristic as Concession**  
  *Verdict:* **Right**  
  *(d) Heuristic Defense:* Correct that Emil’s retreat concedes EP cannot reliably *explain why* traits evolved (ii), only suggest mechanisms (i). Accurate that EP often overclaims (ii).  
  *Confidence:* High (9/10). Evidence: EP textbooks/papers often present adaptive stories as findings.  

  **Overall Judgment & Blind Spots**  
  - **Who is more right?** **Ruth wins on substance.** She successfully argues that:  
    1. EP’s *actual practice* often conflates mechanism (i) and selection (ii) claims.  
    2. Selection claims (ii) are rarely tested rigorously against alternatives.  
    3. Emil’s "heuristic" defense concedes (ii) lacks empirical support.  
  - Emil wins on *principle*: EP hypotheses *can* be testable science, and mechanism-level work is valuable. But Ruth exposes the field’s systemic overreach regarding (ii).  
  - **Shared Blind Spots:**  
    - **Ruth:** Underappreciates that formal modeling (e.g., game theory) *can* provide "engineering" benchmarks for social traits.  
    - **Emil:** Overlooks how circular problem-description undermines consilience in EP vs. paleontology.  
    - **Both:** Ignore that cultural evolution can generate "recurrent" traits without biological adaptation—neither EP nor "domain-general learning" fully captures this.  

  **Key Clarifications on Your Framing**  
  - **"Just-so story"** is overloaded: It conflates (1) untestable stories, (2) testable-but-untested stories, and (3) stories tested only against weak alternatives. Ruth focuses on (2) and (3).  
  - **Two-track test** is logically sound but **impractical as a universal requirement:** Specifying all non-adaptive alternatives with equal precision for every trait is impossible. It's an ideal to approximate.  
  - **Strong circularity charge** *would* indict some paleo/archaeology (e.g., inferring behavior from artifacts using folk psychology), but Ruth’s point stands: EP’s reliance on folk categories is *pervasive* and lacks compensating physical evidence.  

  **Confidence Key:**  
  - 9-10/10: Argument logically sound and empirically well-supported.  
  - 7-8/10: Sound logic, but empirical support varies.  
  - 5-6/10: Partial truth; significant gaps or overgeneralizations.  
  - Evidence needed to shift verdicts: Meta-analyses of EP methods, case studies of EP hypothesis-testing rigor, ethnographies on cultural trait diffusion.
