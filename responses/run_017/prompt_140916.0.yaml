  Here’s a draft for your closing campfire talk. It’s honest, avoids fluff, respects the kids’ intelligence (especially Devin’s), and ends on a note of shared purpose without pretending this change was a win:

  **(Start with warmth and a slightly weary, self-deprecating smile. Maybe pause to look at the fire.)**

  Alright, gather 'round. Before we get to the serious stuff – and yeah, there’s a little serious stuff tonight – quick question: Raise your hand if you think you’ve eaten more bug juice and gorp this week than actual food? *(Pause for laughs. Nod knowingly.)* Yeah, me too. Camp life. It’s the best.

  Now, most of you probably know that something changed this summer about the canteen. Used to be, families paying full tuition got a little canteen credit built in. Campership kids didn’t. So every single afternoon, right there at the window, you’d see it: Some kids grabbing a slushie, some kids watching. It was just… part of the background. Like that one wobbly table in the mess hall.

  This winter, the Board – good people, sitting right there, trying to do right by everyone – looked hard at that setup. They priced out giving the same credit to our campership kids. It was way more than we could afford – like, *new roof* money. Couldn’t do it. The *only* option that didn't cost extra was… well, stopping the credit altogether. For everyone. So that’s what they voted for. No more built-in $25 for tuition kids. Nothing added for campership kids. And yeah, they also stopped reading the campership names out loud on opening day.

  **(Lean in slightly, more serious now.)**

  So. What actually changed? Let's be real honest: **Nobody at camp this summer got something they didn't have last summer.** That's just true. In fact, about eighty of you got *less* than you had last summer. Twenty-five bucks less of slushies and sour straws. And Devin? From Cabin 7? He put his finger right on it at a meeting: "You're taking it from us and giving it to nobody." Devin, you’re not wrong about that part. We *did* take it away from the kids who had it. And we didn’t give that money to anyone else.

  **(Pause, let that sink in.)**

  So why do it? Why take something away and give it to nobody? Was it just to make things "equal"? Honestly? No. Because just making things "equal" by taking something away *doesn’t actually help the people who started with less.* Nate – Professor Nate, sitting over there – would call that the "leveling down" problem. He’d be right about that too.

  **We didn’t do it for the money. We did it because of the window.**

  **(Gesture towards the canteen area.)**

  That daily scene? That line where some kids bought and some kids watched? That wasn't just about twenty-five bucks. It was like a tiny, invisible crack running through our camp every single afternoon. It whispered, without anyone meaning it to, "Some of you belong here a little more. Some of you are guests." Even stopping the name-reading ceremony wouldn't have fixed that *daily* feeling. The credit itself wasn't the main problem; it was that daily moment at the window that made the difference feel real, concrete… visible. It made belonging feel conditional.

  **We took away the thing that kept drawing that line.**

  **(Shift tone, more focused on the group.)**

  Does this mean the campership kids are suddenly "better off"? Nope. Their situation didn't change. And does it mean we fixed everything? Absolutely not. Taking away a visible reminder of inequality isn't the same thing as building real fairness. **Let me say this clearly: Ending the credit doesn't get us off the hook.** We, the grown-ups – the Board, me, all of us – still have work to do. We need to find ways, real ways, maybe even costly ways, to make sure every single kid who belongs here *feels* like they belong here, top to bottom. That’s on us for next year and beyond.

  **(Soften slightly, look around at the kids.)**

  But here’s what I know about this place, about *us*, sitting around this fire: Camp isn’t about the slushies. It’s not even really about the canteen credit. It’s about the feeling you get when your cabin finally nails the skit. It’s about the ridiculous cheers, the late-night whispers, the moment you push yourself further on the ropes course than you thought you could go. It’s about belonging. *Really* belonging. To your cabin, to your team, to this whole messy, wonderful, bug-juice-drinking tribe.

  **We took away the thing that kept drawing a line. That doesn't magically make everything perfect. But it does sweep the sidewalk clear of one crack that kept tripping us up.** It gives us a smoother path to walk together.

  **(Stand up straighter, looking out at the firelit faces.)**

  So tomorrow, when you pack up your muddy shoes and your slightly-smelly pillow, remember this: You didn't just come to camp this summer. You *built* camp this summer. With every high-five, every shared laugh, every time you included someone. You filled in the cracks way better than any grown-up policy ever could. Keep building it like that out there. Keep sweeping those sidewalks clear wherever you see a crack.

  Now… who’s ready for one last absolutely terrible camp song? *(Lead into a familiar, rousing favorite.)*

  **Why this works:**

  1.  **Honesty First:** Directly addresses the facts ("Nobody got more," "Devin was right," "We took it away and gave it to nobody"). Builds trust.
  2.  **Jargon-Free:** Explains the *why* (the daily visibility at the window creating a sense of different belonging) without philosophy terms or "equality for its own sake." The "crack in the sidewalk" metaphor is concrete for kids.
  3.  **Respects All Kids:**
      *   **Tuition Kids:** Acknowledges their loss ("you got less"), validates Devin's point, doesn't dismiss the slushie as unimportant ("it mattered" is implied by acknowledging the loss).
      *   **Campership Kids:** Avoids implying they gained anything tangible or should be grateful. Focuses on removing a *negative marker* of difference. Doesn't single them out.
  4.  **Answers Nate/Devin:** Directly confronts the "levelling down" critique by distinguishing between the *money* (which wasn't redistributed) and the *visible daily marker of difference* (which *was* removed). "We didn't do it for the money. We did it because of the window."
  5.  **Accountability:** Explicitly states that removing the visible marker ("sweeping the crack") isn't enough and the adults have more work to do ("doesn't get us off the hook"). This avoids complacency without derailing the moment into a guilt trip.
  6.  **Focus on Belonging:** Centers the talk on the core value of camp ("belonging," "tribe," "built camp") which resonates with kids. The "smoother path" image is positive and forward-looking.
  7.  **Ends Strong:** The final paragraph ("You *built* camp...") empowers the kids, focuses on *their* positive actions, and ends on the memorable, actionable idea of "sweeping sidewalks clear" wherever they see cracks, connecting the camp value to the wider world in a way a 13-year-old can grasp.
  8.  **Practical:** Starts with relatable humor (bug juice), ends with a song to transition the mood. Kept within time. No "we're all in this together" platitudes.

  **Delivery Tip:** When you say "Devin, you're not wrong about that part," look at him directly and give a small nod. It shows respect. When talking about "the window," gesture clearly in its direction. When saying "We, the grown-ups... still have work to do," make eye contact with the Board members. Keep your tone steady, sincere, and confident – not defensive, not overly apologetic, but also not triumphalist. You're stating a tough decision was made for a specific reason related to camp values, acknowledging the cost, and pointing forward. Good luck!
