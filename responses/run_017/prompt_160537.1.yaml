  ### Residue Report
  **What carried without loss**:
  - Gains from trade as Pareto improvements from comparative advantage.
  - Enforcement via repeated games/reputation.
  - Myerson-Satterthwaite impossibility for type revelation.
  - Future-self trades as commitment problems.

  **What carried with distortion**:
  - Deontological constraints \(\rightarrow\) modeled as infinite costs or participation constraints (loses the "constraint not a cost" intuition).
  - Moral trade \(\rightarrow\) public good production externality (obscures the "moral disagreement" aspect).
  - Dirty trades \(\rightarrow\) utility discontinuities (misses the incommensurability in Sam's worldview).

  **No counterpart in your vocabulary**:
  - **Lexicographic preferences**: Sam's constraints aren't utilities; they're binary prohibitions. Requires non-Archimedean preferences or modal logic.
  - **Agent-relativity**: "I must not lie" isn't captured by state-dependent utilities; it's indexical to the agent.
  - **Normative force**: Sam's "forbidden" has deontic weight ("should not be done") not reducible to utility. Your framework only sees revealed preference.
  - **Incommensurability**: No common unit isn't just a technicality; for Sam, it denies the possibility of comparing moral gains.

  ### Verdict on Sam
  **Sam is partially correct, but not for his stated reasons**:
  - **Correct**: Dirty trades are infeasible under agent-relative constraints (not a trade but a violation). Your framework distorts this by modeling it as a high cost. Enforcement also fails if actions are non-verifiable.
  - **Overstated**: Gains from trade don't require a common currency (ordinal Pareto improvements suffice). Clean trades may still exist.
  - **Blind spot**: **Agent-relative constraints are inexpressible in your vocabulary without distortion**. Adding lexicographic preferences or deontic operators (e.g., "forbidden(\(a_i\))") is necessary to even *see* the issue. Sam isn't dressing up tastes; he's highlighting a hole in standard mechanism design, which assumes preferences are Archimedean and state-based.

  **Recommendation**: Restrict trades to clean actions only. If gains exist, Sam should agree. If not, trade fails—Sam's constraints bind. For future selves, use commitment devices. On balance, you win on efficiency grounds, but Sam wins on expressiveness: Moral trade models can't fully capture deontology without augmentation.
