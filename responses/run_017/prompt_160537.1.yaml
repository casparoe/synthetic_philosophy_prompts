prompt: |-
  I had a stupidly long argument last night with my friend Sam about moral trade and I want it settled properly. So you know what we were actually fighting about: the idea is that two people who disagree about morality can still gain by trading, roughly the way two countries with different productivities do. I'm a welfarist consequentialist, Sam has strong agent-relative constraints — he thinks he isn't permitted to lie or break a promise whatever the payoffs. I can bring about cheaply the thing he thinks matters (say, preserving some dying language), and he can bring about cheaply the thing I think matters (insect-welfare research, whatever), so each of us does the other's thing and both of us come out ahead by our own lights. Straight comparative advantage. Sam's line was that this isn't trade at all, for two reasons: the thing he does for me is, by his own lights, not merely costly to him but forbidden, and there's no common unit in which to measure how much each of us gains, so "gains from trade" has no content. I said I already have words for both of those and he said I was bulldozing.

  I work in market design — mechanism design and implementation, incomplete contracts, repeated games, some social choice. That's the vocabulary I think in, so use it and don't explain it back to me. Please restate moral trade, and the main objections to it, as carefully as you can in that vocabulary, and then give me the residue report. Concretely:

  - The basic setup: agents whose type is a moral theory held as private information, allocations that are whole states of the world which both of us jointly consume rather than seperate bundles, each theory ranking the entire state. Where does the pure-exchange-economy analogy break, and what's the right object instead — public good provision, team production, common agency, something else?

  - The gains-from-trade claim: comparative advantage in producing value, no numeraire, no price system, incomplete markets. Is the missing common currency a real problem or just barter with extra steps?

  - Enforcement: no courts, no verifiability of the moral quality of what you actually did, no unwinding the act, successors who don't share your theory. Give me what fits — self-enforcing agreements, reputation, escrow, repeated-game logic — and say which of them actually has teeth here.

  - Incentives over types: both sides have private info about their own theory and both gain by misreporting it. There's a classic impossibility result about ex post efficient bilateral trade under two-sided private values — Myerson–Satterthwaite, if I'm remembering the name right, but I don't care about the reference, just the shape of it. Does it bite here, and does anything about moral trade (publicly declared theories, a mediator with commitment power, correlated evidence) get around it?

  - The one I actually care about, which is where Sam thinks I'm bulldozing. Call a trade 'clean' for someone if their side of it is merely low-priority by their own lights, and 'dirty' if it's positively forbidden by their own lights even though the package as a whole is best by their own lights. Sam says dirty trades are where the whole thing stops looking like trade. Try to translate 'forbidden for me to do, though I still judge the package worth doing' into my vocabulary — menu-dependent preferences, psychological game theory, guilt terms in the utility function, whatever — and then tell me honestly whether that translation keeps the normative claim or converts it into a taste. And: can a dirty trade always be restructured into a clean one at some cost, and if so does Sam's objection just collapse into a price?

  - One more case: trading with your own future self across moral uncertainty — I commit now, while I mostly believe theory A, to hand resources to whichever future me believes theory B. I said that's just a multiple-selves commitment problem; Sam said it's incoherent, or at least different. Handle it, and say which of us was closer.

  Then the residue report: what carried over without loss, what carried only with distortion, and what has no counterpart in my vocabulary at all. And give me a verdict on Sam. Is what's left over a genuine blind spot in the framework I use, or is he dressing up something I can already model in moral language? If it's a blind spot, say what I'd have to add to my framework to even see it.
reasoning: |-
  We are given a scenario where two agents with different moral theories (types) can engage in "moral trade." The user is a welfarist consequentialist, and Sam has agent-relative constraints (deontological constraints). The idea is that each can produce a good that the other values at a low cost (due to comparative advantage) and trade, leading to mutual gain by their own lights.

  We are to analyze this in the vocabulary of market design: mechanism design, implementation, incomplete contracts, repeated games, and social choice.

  Key components of the problem:

  1. **Basic Setup**: Agents have private types (moral theories) that rank entire states of the world (allocations). The state is consumed jointly (like a public good). We must identify where the pure exchange analogy breaks and what the right object is (public good, team production, common agency, etc.).

  2. **Gains-from-trade claim**: Without a common numeraire, is the idea of gains from trade meaningful? We must address the issue of no common unit of account and whether it's just barter.

  3. **Enforcement**: No courts, no verifiability of the moral quality of actions, and the problem of unwinding acts and successors. We must consider self-enforcing agreements, reputation, escrow, and repeated games.

  4. **Incentives over types**: Both sides have private information about their moral theory and may misreport. We must consider the Myerson-Satterthwaite impossibility and whether there are ways around it (mediator, correlated evidence).

  5. **Clean vs. Dirty Trades**: Sam objects to "dirty trades" where one's action is forbidden by their own moral theory, even if the overall package is better. We must model this (menu-dependent preferences, guilt, etc.) and see if it can be restructured into a clean trade.

  6. **Trading with Future Self**: Commitment across moral uncertainty. We must model this as a multiple-selves commitment problem and address Sam's objection.

  Finally, a residue report: what carries over, what is distorted, what has no counterpart, and a verdict on Sam's objection.

  Let's break down each part.

  ---

  **1. Basic Setup**

  - **Agents**: Two agents, each with a type θ_i, which is their moral theory. The type is private information.
  - **Allocations**: The state of the world is a vector of outcomes (x, y) where, for example, x is the level of insect-welfare research and y is the level of preservation of the dying language. Both agents consume the same state (joint consumption, like public goods). Each moral theory ranks the entire state.

  The pure-exchange economy analogy breaks because:
    - In a standard exchange economy, goods are private and divisible, and agents have endowments of these goods. Here, there are no initial endowments of the goods in the state; instead, agents can take actions to produce the goods at some cost (which may be moral or material).
    - The state is a public good (both agents consume the same state) but the production is done by individual actions. This is more like a **public good provision** problem with two agents and two public goods, but with a twist: each agent has a comparative advantage in producing one public good (because they can do it at low cost, where cost is interpreted in terms of their own moral disutility or material cost).

  Alternatively, we can think of it as **team production**: each agent contributes an action (a_i) which produces a public good. The state is then a function of the actions: s = f(a_1, a_2). Each agent has a utility function (representing their moral theory) over s, and also a cost of action (which might be zero for actions that are not forbidden, and very high for forbidden ones). The cost of action is part of the agent's utility: U_i(s, a_i) = V_i(s) - C_i(a_i), where V_i is the valuation over the state and C_i is the cost of action.

  But note: Sam's constraints are such that some actions (like lying) are forbidden and thus have infinite cost (or a very high cost that cannot be outweighed). This leads to the issue of dirty trades.

  The right object is a **public good provision game with private production costs** and with the possibility of transfers (if we allow side payments) but in the absence of a numeraire, we are in a barter setting. Without transfers, we are in a setting of **barter exchange of production services** for public goods.

  ---

  **2. Gains-from-Trade Claim**

  The claim is that there are gains from trade due to comparative advantage. In standard trade, we have a common numeraire (money) and prices. Here, we lack a common unit. However, we can still define gains from trade in terms of Pareto improvements: both agents are better off by their own utility functions.

  But without a numeraire, we cannot define a price system and we have incomplete markets (only two goods, and we cannot trade them for money). This is barter. The problem of double coincidence of wants arises: each must want what the other produces. In this case, it is satisfied by construction: each agent values the good the other can produce cheaply.

  So the gains from trade are real: by each agent performing the action that the other values highly and that they can do at low cost (by their own lights), the state improves for both. The lack of a common currency does not prevent a Pareto improvement. It does, however, complicate the mechanism design because we cannot use money to balance the trade.

  Thus, the missing common currency is a problem for the design of a decentralized trading mechanism but not for the existence of gains from trade. It becomes a problem of implementation: how to achieve the trade without a price system.

  ---

  **3. Enforcement**

  The problem: actions are not verifiable (we cannot prove to a third party the moral quality of an action, e.g., whether Sam actually preserved the language or just pretended to), and there are no courts to enforce the agreement. Moreover, the act cannot be undone, and successors may not share the moral theory.

  Possible solutions:
  - **Self-enforcing agreements in a repeated game**: If the agents interact repeatedly and care about future gains, they might sustain cooperation by the threat of punishment (e.g., if one reneges, the other does not cooperate in the future). However, in a one-shot interaction, this fails.
  - **Reputation**: If there is a community of agents and information about past behavior is shared, then reputation can sustain cooperation. But in a bilateral setting with no repeated interaction, reputation doesn't apply.
  - **Escrow**: Use a trusted third party (mediator) to hold something of value (e.g., money) and release it only upon verification. But without verifiability, we cannot condition on the action. Moreover, we don't have a numeraire to put in escrow.

  In this setting, the key issue is the **non-verifiability of the action**. The action (e.g., Sam's effort to preserve the language) might be observable to the agent but not verifiable to a third party. This leads to the problem of **moral hazard**: each agent may shirk on the promised action.

  Without verifiability, we must rely on **self-enforcing contracts** in a repeated game. But if the interaction is one-shot, then the only possibility is to have an agreement that is incentive compatible in the sense that each agent prefers to follow through given the other's action. That is, we need the actions to be mutual best responses in a simultaneous-move game. This is the **Nash equilibrium** of the one-shot game.

  However, in the one-shot game, if Sam is supposed to do something that he finds forbidden, then even if he promised, he may not do it because the cost is too high. Moreover, if the actions are sequential, the second mover may renege.

  Thus, enforcement is a major obstacle. The repeated game logic has teeth only if the interaction is repeated and the discount factor is high enough.

  ---

  **4. Incentives over Types**

  Both agents have private information about their moral theory (type). Each agent has an incentive to misreport their type to get a better deal. For example, the user might overstate how much they care about the dying language to induce Sam to do more for insect welfare, and Sam might understate how costly it is for him to do the forbidden action.

  This is a problem of **mechanism design with interdependent valuations**? Actually, in this case, the valuations are private: each agent's utility depends only on the state and their own action, and the state is the same for both. However, the cost of action is private.

  We are in a setting of **bilateral trade with two-sided private information** and no monetary transfers (since there is no numeraire). The Myerson-Satterthwaite theorem states that with two-sided private information and no outside subsidy, there is no efficient, incentive-compatible, individually rational, and budget-balanced mechanism. But note:

  - Myerson-Satterthwaite assumes that the agents have quasilinear utilities (so money can be used) and that the good is private. Here, we have public goods and no money. Moreover, we are not necessarily requiring budget balance (since there is no money) but we are requiring voluntary participation.

  In our setting, without money, we are looking for a mechanism that implements a state (by having each agent take an action) that is Pareto efficient and individually rational. But with private information about costs and valuations, we face the same kind of impossibility.

  Specifically, without transfers, it is hard to achieve ex post efficiency. We might need to use a mediator who can suggest actions based on the reported types. However, without transfers, the mediator cannot balance the budget. Moreover, the agents may not report truthfully.

  Can we get around it?
  - **Correlated evidence**: If there is evidence that correlates with the agents' types, we might design a mechanism that uses this evidence to elicit truth-telling. But without such evidence, we are stuck.
  - **Mediator with commitment power**: The mediator can commit to a mapping from reported types to actions. But without transfers, the mechanism must rely on the agents being willing to take the actions. If the action is dirty for Sam, he may not do it even if the mediator says so.

  Thus, the Myerson-Satterthwaite impossibility does bite, and it is even worse without money. We cannot achieve efficiency in general.

  ---

  **5. Clean vs. Dirty Trades**

  Sam objects to dirty trades: trades where the action he takes is forbidden by his own moral theory, even though the overall package (state) is better by his own lights.

  Modeling:
  - In standard preferences, we have U_i(s, a_i) = V_i(s) - C_i(a_i). For Sam, if a_i is forbidden, then C_i(a_i) = ∞, so he would never do it. But if he does do it, then by revealed preference, we must have that V_i(s) is high enough to compensate. However, Sam's moral theory might not be representable by a utility function that is separable and additive. It might have a deontological constraint: the action a_i is forbidden regardless of the consequences.

  This is a case of **menu-dependent preferences**: the disutility of taking a forbidden action might depend on the alternatives. But typically, deontological constraints are absolute: they are not traded off.

  Alternatively, we can model it as a **psychological game theory** problem: Sam experiences guilt if he takes the forbidden action, and the guilt might depend on the context. But Sam claims that it is forbidden regardless.

  Another way: **lexicographic preferences**. Sam first satisfies the deontological constraints, and then, among the actions that are permissible, he maximizes the state. Then, a dirty trade is never chosen because it violates the constraint.

  But then how can the trade be overall better? Sam must be comparing the entire package (state and action) to the status quo. If the status quo involves an action that is also forbidden? That might not be the case.

  In the trade, Sam is asked to take a forbidden action (say, break a promise) in order to bring about a better state. But by his theory, breaking a promise is forbidden regardless of the consequences. Therefore, he would not do it. The only way he would do it is if his moral theory allows for a trade-off in extreme circumstances (threshold deontology) or if the constraint is not absolute.

  Sam's point: if the action is forbidden, then it is not available for trade. So the trade cannot happen.

  The user's response: then we restructure the trade so that Sam doesn't have to do the forbidden action. For example, we use a third party or change the action.

  But sometimes, the forbidden action is the only way to achieve the state. Then, if Sam is a threshold deontologist, he might do it if the consequences are sufficiently good. But Sam claims it is absolutely forbidden.

  So the objection is that if the action is forbidden, then it is not in the choice set. Therefore, we cannot have a trade that requires it.

  Can we restructure a dirty trade into a clean one? For example:
  - Instead of Sam doing the forbidden action, we have a third party do it. But then the third party must be willing, and if the third party shares Sam's moral theory, they won't do it. Or we pay the third party, but we don't have money.
  - Or we change the action: for example, instead of lying, we find a way to achieve the same outcome without lying. But that might be more costly or impossible.

  If restructuring is possible at some cost, then the dirty trade becomes clean but with a higher cost. Then Sam's objection collapses into a price: the cost of restructuring. But if it is impossible, then the trade cannot happen.

  In the vocabulary of mechanism design, we can model the deontological constraint as a **participation constraint**: Sam will only agree to trades that do not require him to take a forbidden action. Then, the set of feasible trades is restricted. The gains from trade must be achieved within the set of actions that are permissible for both agents.

  Thus, Sam's objection is that the trade must be clean for both, and dirty trades are not feasible. This is a constraint on the mechanism.

  ---

  **6. Trading with Future Self**

  The user commits now (under moral theory A) to hand resources to their future self (who might believe theory B). 

  Modeling: 
  - This is a **multiple-selves model** with changing preferences. The current self (at time t) has a utility function U_A, and the future self (at time t+1) has U_B. The current self can take an action (commitment) that binds the future self. 

  The problem: 
  - Without commitment, the future self will choose an action that maximizes U_B. The current self wants to commit to an action that maximizes U_A. 
  - The commitment device (e.g., a contract) must be enforceable. If the future self can renege, then the commitment fails.

  Sam's objection: it might be incoherent because the future self is a different agent? But in standard economics, we model this as a time-inconsistency problem and use commitment devices.

  However, if the moral theories are fundamentally different, the future self might view the commitment as invalid (because it was made under a different moral theory). But that's a normative claim, not a positive one. In positive terms, the future self will renege if it is in their interest and they can.

  So the problem is a standard commitment problem. We can use a commitment device that is externally enforced (e.g., a trust or a contract with a third party). If no external enforcement, then we rely on the future self's own preferences: if the future self still values commitment (even under U_B) then they will honor it. Otherwise, they won't.

  Sam's point might be that the current self and future self are not the same moral agent, so trading between them is not trade. But in the model, we treat them as distinct agents. The user is correct that it is a multiple-selves commitment problem.

  ---

  **Residue Report**

  **What carried over without loss:**
  - The existence of gains from trade (Pareto improvement) due to comparative advantage, even without a common numeraire, is a valid concept and can be modeled in the standard framework of public good provision with private production costs.
  - The enforcement problem in a one-shot setting: without verifiability and without repeated interaction, the trade may not be enforceable. This is standard in contract theory.
  - The incentive problem over types: the Myerson-Satterthwaite-like impossibility applies, making efficient trade difficult without transfers and with two-sided private information.
  - The trading with future self is a standard commitment problem in dynamic games.

  **What carried over with distortion:**
  - Deontological constraints: modeling them as infinite costs is a distortion because it implies that if the benefit is infinite, the action might be taken. But for Sam, it might be an absolute constraint that cannot be outweighed. The distortion is that we are forcing a utility representation on a preference that might be lexicographic or non-Archimedean.
  - Dirty trades: the constraint that an action is forbidden is modeled as a participation constraint or a restriction on the action set. This carries over but loses the moral flavor: the idea that it is morally wrong to even consider such a trade. In the model, it's just a constraint.

  **What has no counterpart:**
  - The absolute nature of deontological constraints: in the standard utility framework, everything is a trade-off. But for Sam, some actions are off the table regardless of the consequences. This is a non-Archimedean preference that cannot be represented by a real-valued utility function without distortion. We would need to use lexicographic preferences or a different formalism.
  - The normative claim that dirty trades are not trades: in the model, we can define clean and dirty trades and then restrict attention to clean ones. But the moral revulsion that Sam feels is not captured by the model. It is just a constraint, but for Sam, it might be a fundamental objection to the entire enterprise of trading moral duties.

  **Verdict on Sam:**

  Sam's objection that dirty trades are not trades at all is partly valid: if the trade requires an action that is forbidden by one's moral theory, then it is not feasible (unless the agent reneges). Therefore, the mechanism must only consider clean trades. This is a constraint that can be incorporated into the model (by restricting the action sets). 

  However, Sam's deeper objection might be that moral trade, by its nature, requires a common currency (which he denies) and that deontological constraints cannot be traded off. The model can incorporate the constraints, but it does not validate the trading off of moral duties. 

  The blind spot in the framework is the representation of absolute deontological constraints. To see it, we would need to move beyond real-valued utility functions and use a framework that allows for non-Archimedean preferences (like lexicographic preferences) or a modal logic of obligations. Without that, we are bulldozing by forcing everything into a utility function that implies trade-offs.

  But note: if Sam is willing to engage in the dirty trade (because the package is better), then his constraint is not absolute. The fact that he is considering it suggests that it is not. But Sam might argue that he would never choose the dirty trade, so it is not available.

  **Final Verdict**: Sam has a point about dirty trades not being feasible (because the action is not in the choice set) and about the lack of a common currency making the concept of gains from trade problematic (because we cannot measure the gains without a common unit). However, the gains from trade can still be defined as a Pareto improvement. The framework can accommodate the constraints by restricting the set of feasible trades. But the moral revulsion is not captured by the model. The framework would need to incorporate non-Archimedean preferences to fully capture the absolute nature of the constraints.

  Therefore, you (the user) are not entirely bulldozing, but you are forcing a model that may not represent Sam's moral theory accurately. To avoid bulldozing, you should restrict to clean trades and then see if there are still gains from trade. If not, then there is no trade. If yes, then Sam should be willing.

  As for the future self trade: you are closer. It is a standard commitment problem.

  **Recommendation**: Restructure the trade to be clean. If that is possible, then the gains from trade can be realized without Sam violating his constraints. If not, then there is no trade. This is the mechanism design solution: design a mechanism that only uses actions that are permissible for both agents.
answer: |-
  ### Moral Trade: Formal Restatement in Market Design Vocabulary

  #### Basic Setup
  - **Agents**: Two agents, \(i \in \{1,2\}\), with private types \(\theta_i\). \(\theta_i\) is a moral theory (preference ordering) over states of the world. Types are non-overlapping (no common prior) and not mutually comprehensible.
  - **Allocations**: States \(s \in S\), where \(S = X \times Y\) (e.g., \(X\) = insect-welfare research, \(Y\) = language preservation). States are public goods (jointly consumed; no rivalry or excludability).
  - **Preferences**: Each \(\theta_i\) defines a utility function \(u_i(s; \theta_i)\), ranking all \(s \in S\). No transferable utility, no numeraire.
  - **Production**: Agent 1 produces \(x\) at low cost (high productivity) by \(\theta_1\) but values \(y\) highly; Agent 2 produces \(y\) at low cost by \(\theta_2\) but values \(x\) highly. Action sets \(A_i\) map to \(S\) (e.g., \(a_1\) produces \(x\), \(a_2\) produces \(y\)).

  **Where the exchange analogy breaks**:  
  Not a pure exchange economy (no initial endowments of divisible private goods). Closest fit is **public good provision with asymmetric production**. The state \(s\) is a public good, but production is private and non-contractible. Alternatives:
  - **Team production**: Output \(s\) is joint, but no shared utility; each agent cares only about their component.
  - **Common agency**: Both agents "hire" each other to produce their valued good, but no principal-agent hierarchy.
  - **Correct object**: **Bilateral production externality with non-contractible actions**. Gains arise from internalizing externalities via reciprocal production.

  #### Gains-from-Trade Claim
  - **Comparative advantage**: Agent 1 has lower opportunity cost in producing \(x\) (by \(\theta_1\)), Agent 2 in \(y\) (by \(\theta_2\)). Trade: Each produces what the other values, swapping production responsibilities.
  - **No numeraire**: Gains measurable only in ordinal welfare improvements. A trade is a pair of actions \((a_1, a_2)\) leading to state \(s\). Gains exist iff:
    \[
    u_i(s; \theta_i) > u_i(s^0; \theta_i) \quad \forall i,
    \]
    where \(s^0\) is the status quo.
  - **Problem**: Without cardinal utility or common unit, no unique surplus division. But gains are Pareto improvements—ordinal comparison suffices. **Not barter**: Barter requires reciprocal transfer of property rights. Here, production creates new goods; no rights exchanged. The "extra steps" are the production actions themselves. Sam's objection confuses *measurement* with *existence*: Gains are well-defined ordinally. Incomplete markets imply no price discovery, but bilateral Pareto improvements are still feasible.

  #### Enforcement
  - **Challenges**: Actions non-verifiable (can't prove "language preserved" or "promise kept"), no courts, actions irreversible, successors may not inherit \(\theta_i\).
  - **Feasible mechanisms**:
    - **Self-enforcing agreements**: Nash equilibrium in the one-shot game. Requires \(a_i\) to be BR to \(a_j\) given \(\theta_i\). Fails if forbidden actions dominate (Sam's constraint).
    - **Repeated games**: If ongoing interaction, use trigger strategies (e.g., grim trigger). Folk theorems apply, but requires high discount factor \(\delta\) and common knowledge of \(\theta_i\) (which is private).
    - **Escrow with bonds**: Post a bond (e.g., monetary or valued asset) forfeited if no production. But no numeraire; bonds may not exist or be manipulable.
    - **Reputation**: With multiple agents, reputation sustains cooperation if types are correlated. In bilateral case, only works with repeated play.
  - **What has teeth**: **Repeated-game logic** is strongest. With uncertain horizon or overlapping generations, reputation can enforce. But with one-shot interaction and no bonds, enforcement fails if actions are not mutual best responses.

  #### Incentives over Types
  - **Private information**: Both agents privately know \(\theta_i\). Each gains by misreporting to skew production (e.g., overstate cost of their action to extract more effort).
  - **Myerson-Satterthwaite (MS) bite**: Yes, directly. MS shows no ex post efficient, BB, IC, and IR mechanism for bilateral trade with two-sided private values. Here:
    - No transferable utility (worse than MS).
    - Allocations are public goods (not private).
    - **Impossibility**: No mechanism can be ex post efficient (achieve all gains) while satisfying IC and IR. Efficient trade requires full type revelation, but misreporting is profitable.
  - **Workarounds**:
    - **Mediator with commitment**: Correlate reports with a public signal. E.g., use a scoring rule for \(\theta_i\), but requires cardinal utility (unavailable).
    - **Correlated evidence**: If verifiable signals correlate with \(\theta_i\) (e.g., past actions), design a revelation mechanism. But evidence is unlikely in moral trade.
    - **Incomplete contracts**: Agree on simple, observable actions (e.g., "fund research"), but loses fine-grained efficiency.
  - **Verdict**: MS bites hard. No efficient trade without transfers or evidence. Best hope: approximate efficiency via coarse mechanisms.

  #### Clean vs. Dirty Trades
  - **Definitions**: For agent \(i\), a trade is:
    - **Clean**: Action \(a_i\) is permissible (low cost) by \(\theta_i\), even if low-priority.
    - **Dirty**: Action \(a_i\) is forbidden (infinite cost, lexicographically worse) by \(\theta_i\), but overall \(u_i(s; \theta_i) > u_i(s^0; \theta_i)\).
  - **Modeling "forbidden"**:
    - **Menu-dependent preferences**: \(u_i\) depends on the choice set. Forbidden actions induce shame/guilt when chosen over permissible ones.
    - **Psychological game theory**: Beliefs matter. If Sam believes you expect him to break a promise, guilt enters utility.
    - **Lexicographic preferences**: For Sam, "no forbidden actions" first-order, consequences second-order. Utility representation fails (requires Archimedean property).
    - **Canonical model**: **Costly action with discontinuity**. \(u_i(s, a_i; \theta_i) = v_i(s; \theta_i) - c_i(a_i; \theta_i)\), where \(c_i(a_i; \theta_i) = \infty\) if forbidden. Dirty trade requires \(v_i(s) - \infty > v_i(s^0)\), impossible unless \(v_i(s) = \infty\).
  - **Normative claim vs. taste**:  
    Sam's "forbidden" is a **constraint**, not a taste. In your vocabulary, it's a **participation constraint**: Sam won't play if the menu includes forbidden actions. Translating it to utility converts it to a taste (losing the "ought" force). The normative claim ("I shouldn't do this even if beneficial") has no direct counterpart; it's a deontic logic primitive.
  - **Restructuring dirty trades**:  
    Always possible **if** there exists a clean action producing similar gains. Example: Use a third party to do the dirty action (at extra cost), or adjust the state. But:
    - **Not always feasible**: If Sam must personally break a promise (agent-relative constraint), restructuring fails.
    - **Sam's objection collapses?**: Only if restructuring costs are finite and tradable. For Sam, if no clean equivalent exists, restructuring is impossible, and trade is blocked. His objection stands when agent-relative constraints bind.

  #### Trading with Future Self
  - **Setup**: Current self (\(\theta_A\)) commits to transfer resources to future self (\(\theta_B\)). Future self controls actions.
  - **Model**: **Multiple-selves game** with changing types. Current self chooses commitment device \(c\) (e.g., trust fund), future self chooses action \(a\) given \(c\).
  - **Commitment problem**: Current self wants to bind future self to allocate resources to \(\theta_B\)-valued goods. But:
    - If \(c\) is revocable, future self unwinds it if \(\theta_B \neq \theta_A\).
    - **Incentive compatibility**: \(c\) must satisfy \(u_B(c; \theta_B) \geq u_B(c'; \theta_B)\) for all alternatives \(c'\).
  - **Sam's incoherence claim**: Wrong. Standard mechanism design handles this (e.g., autopilot contracts). Difference: No new gains from trade; it's a single agent with time-inconsistent preferences. **You are closer**: It's a multiple-selves commitment problem. Sam's objection confuses identity (same agent, different beliefs) with moral ontology.

