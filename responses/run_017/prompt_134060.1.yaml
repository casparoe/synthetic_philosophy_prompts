  - A) Yes
  - B) No

  This tests attributor context.

  If at Node 1, B (Rob does not know), then we go to Node 2b: What about Maya? Does she know?
  - A) Yes (so subject-sensitive: Rob doesn't know because of his stakes, but Maya does)
  - B) No (then we have to see why: maybe because the evidence is insufficient for anyone? We go to skepticism path)

  But we also have the Priya case and the stranger's bet to incorporate.

  We can interleave.

