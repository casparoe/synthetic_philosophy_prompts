  Let me map the logical space first in the appendix, then design the tree to traverse it.

  Appendix structure:

  The distinctions:

  1. Whose practical situation matters for the truth of "S knows that p"?
     a. Only the subject's situation (at the time of belief)
     b. Only the attributor's situation (at the time of attribution)
     c. Both
     d. Neither

  2. What kind of practical factor?
     a. The size of the stakes (cost of being wrong)
     b. The salience of error possibilities (how noticeable they are)
     c. The evidence itself (but evidence is already a factor, so we might not count this as practical)

  But note: in the dinner remark case, it's salience, not stakes.

  3. What varies?
     a. Whether S knows (the fact of knowledge changes)
     b. The standard for the word "knows" in the conversation (truth-conditions shift)

  4. Link to practical factors:
     a. Through action (knowledge is tied to acting on the belief)
     b. Through assertion (knowledge is the norm of assertion)
     c. Through belief (practical factors affect whether belief is justified)

  5. Same standard for first and third person attributions?
     a. Yes
     b. No

  Now, the named positions:

  - Classical invariantism: neither subject nor attributor stakes matter (d). What matters is only evidence and truth. So: 1d, 3a (knowledge doesn't change, but if standards are fixed, then 3b doesn't apply). Actually, classical invariantism says the truth conditions are fixed, so 3a: the fact of knowledge doesn't change with practical factors.

  - Contextualism (attributor): attributor's context sets the standard (1b). What varies is the standard (3b). Salience might be part of the context. So 2b (salience) could be the factor.

  - Subject-sensitive invariantism: subject's stakes matter (1a). What varies is whether S knows (3a). Stakes (2a) are the factor.

  - Pragmatic encroachment: similar to subject-sensitive, but emphasizes the link to action. So 1a, 3a, 2a, and 4a.

  - Contrastivism: knowledge is relative to a contrast class. This might be set by the subject's context or the attributor's. Typically, it's subject's context? But we need a case to bring out contrast.

  - Relativism: truth of knowledge attributions is relative to the assessor's context. So at the time of assessment, the assessor's situation matters. This is different from attributor contextualism.

  - Skepticism: in many cases, we don't know because evidence is never good enough.

  - Non-factualism: there is no fact of the matter beyond our attributions.

