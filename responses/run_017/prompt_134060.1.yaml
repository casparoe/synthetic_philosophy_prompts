  We are building a decision tree that starts from a concrete case and branches through forced-choice questions about other cases, leading to named positions in epistemology. The goal is to help a reading group clarify their commitments without relying on jargon or overused examples.

  Constraints:
  - Start from: Hanne checked ferry timetable this morning, tells friend now (mid-afternoon) that last boat leaves at 18:40; if wrong, friend takes taxi and is 20 min late. Everyone agrees Hanne knows.
  - 10-12 nodes, each a single question with 2-3 answer options.
  - No labels or terms of art; only concrete cases.
  - Avoid overused examples (bank, lottery, spouse).
  - Vary factors: whose stakes, subject's awareness, cause of high stakes (bet/threat vs world), stakes size vs salience, type of stakes (prudential, financial, moral, curiosity), whether subject acts, who attributes, and one case with strong evidence and very high stakes.
  - Incorporate four specific cases (Maya/Rob, Priya, stranger's bet, dinner remark).

  Leaves (named positions) should include:
  - Classical/insensitive invariantism
  - Contextualism (attributor kind)
  - Subject-sensitive invariantism (or interest-relative invariantism, pragmatic encroachment)
  - Contrastivism
  - Relativism
  - Skepticism
  - No fact of the matter (or non-factualism)

  Also, an appendix mapping the logical space.

  We'll design the tree step by step, then the appendix.

  Step 1: Outline the branching points based on the variations required and the four cases.

  We need to cover:
  1. Whose stakes matter (subject, attributor, both, neither)
  2. Whether stakes size or salience of error matters
  3. Whether the variation affects the truth of knowledge attributions or the standards of the conversation
  4. The link to practical factors (action, assertion, belief)
  5. Same standard for first and third person?

  We also have the four cases to integrate.

  Let's sketch the nodes:

  Node 0: Start with Hanne case (low stakes, everyone says she knows).

  Node 1: Introduce the Maya/Rob case. They have same evidence about ferry time. Maya: low stakes (dinner, annoyance). Rob: high stakes (missed boat could lead to injury). Question: Do both know, or only Maya, or only Rob, or neither?

  Options:
  A) Both know (because same evidence)
  B) Only Maya knows (because Rob's stakes are too high)
  C) Only Rob knows (because Maya's stakes are too low? This seems odd, so maybe not)
  D) Neither knows (but this seems extreme)

  But we want to avoid too many options. Let's make it:
  - Option 1: Both know (the difference in stakes doesn't affect knowledge)
  - Option 2: Only Maya knows (Rob's high stakes prevent him from knowing)
  - Option 3: Neither knows (but this might be too skeptical, and we have a separate leaf for skepticism)

  However, we want to capture the idea that Rob might not know because of his stakes. Also, note that option 3 (neither) might be chosen by someone who thinks that the evidence isn't good enough for either, but that's not the point of the case.

  Alternatively, we can ask: Is there a difference in whether they know?
  - Option A: Yes, Rob does not know (because of his stakes) but Maya does.
  - Option B: No, both know (stakes don't affect knowledge).

  We can have a third option: 
  - Option C: Neither knows (but for reasons unrelated to stakes? Then we might need a separate branch for skepticism).

  But to keep it focused, we can have two options and then a third that leads to skepticism.

  Alternatively, we can have:

  Node 1: In the Maya/Rob case, do you think Rob knows that the ferry leaves at 18:40?
  - Yes
  - No

  If yes, then stakes don't matter for the subject? But we have to see.

  But we also need to capture that maybe only the attributor's stakes matter.

  We'll build step by step.

  We must cover the four cases, so let's assign them to nodes.

  Node: Maya/Rob case (Node 1)
  Question: Given that Maya and Rob have the same evidence about the ferry time, but Rob's situation is high stakes and Maya's is low, which of the following do you think? (choose one)
  A) Rob knows and Maya knows (the stakes don't affect whether they know).
  B) Maya knows, but Rob does not (because Rob's stakes are high).
  C) Neither knows (for reasons that apply equally to both).

  Option C might lead to a skeptical path.

  But note: in the Hanne case, they agreed Hanne knows, so if they choose C here, it must be because they think the evidence isn't good enough even in low stakes? Then we can branch to skepticism.

  Node 2: Priya case. Priya checks at 9am, machine calibrated. At 4pm, without her knowing, the machine is used for a high-stakes procedure. Did Priya know at 9am?

  Options:
  A) Yes, because at 9am the stakes were low for her.
  B) No, because at 4pm the stakes are high and that retroactively affects her knowledge at 9am.
  C) No, but for other reasons (e.g., she didn't have good enough evidence even at 9am).

  But we want to avoid C because we are focusing on stakes.

  Node 3: Stranger's bet. You have good evidence that the museum is closed on Mondays. A stranger says they will donate to an abhorrent cause if you are wrong. Do you know?

  Options:
  A) Yes, because the bet doesn't change the evidence.
  B) No, because now the stakes are high.

  Node 4: Dinner remark. Guest mentions that the ferry company migrated its website and caches might be out of date. No one is relying on it. Does this change whether Hanne knows?

  Options:
  A) Yes, because it raises a possibility of error that wasn't considered before.
  B) No, because the possibility was always there and the evidence hasn't changed.

  Now, let's design the tree structure.

  We start at Node 0 (Hanne low stakes: everyone agrees she knows).

  Then Node 1: Maya/Rob case.

  If the group thinks that both know (A), then they are not subject-sensitive. We then need to test if the attributor's context matters.

  If they think Maya knows but Rob does not (B), then they are subject-sensitive.

  If they think neither knows (C), then they might be skeptical about this kind of evidence.

  But note: in the Hanne case they agreed, so if they say neither here, it might be because they think the evidence for the ferry time is weaker? We can then have a node about the Hanne case with the dinner remark.

  We'll build the tree as follows:

  Node 0: Start (Hanne low stakes -> knows)

  Node 1: Maya and Rob have the same evidence about the ferry. Rob is in a high-stakes situation (missing the ferry could lead to injury), Maya in low stakes (only mild annoyance). Do you think that Rob knows the ferry leaves at 18:40?
  - A) Yes
  - B) No

