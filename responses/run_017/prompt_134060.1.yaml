     If 3A (Yes) then invariantism? But we have to test other things.

     If 3B (No) then contextualism?

  But we also have the dinner remark and the stranger's bet.

  We need to cover the other factors.

  Let me try to list the nodes in order.

  Node 0: Start (Hanne low stakes: knows)

  Node 1: Maya/Rob case. Focus on Rob: does Rob know the ferry time? (Yes/No)

  If Yes (1A): Rob knows despite high stakes. So subject stakes might not matter. Then we go to Node 2: Consider the stranger's bet case. You have good evidence the museum is closed on Mondays. A stranger says they will donate to an abhorrent cause if you are wrong. Do you know that the museum is closed? (Yes/No)

