  ### Decision Tree for Knowledge Attributions

  This decision tree starts from a shared commitment (Hanne knows the ferry time in low stakes) and uses concrete cases to branch toward named epistemological positions. Each node presents a forced-choice question based on a scenario. Answer honestly based on your intuitions about the case. The tree avoids jargon and overused examples.

  **Starting Point**: Hanne checked the ferry timetable this morning. It's now mid-afternoon; she tells a friend the last boat leaves at 18:40. If wrong, the friend takes a taxi and arrives 20 minutes late. Everyone agrees: **Hanne knows**.

  ---

  #### Node 1: **Maya and Rob Case**  
  Maya and Rob see the same ferry departures board simultaneously, with identical evidence. Maya is going to a birthday dinner; if she misses the boat, she’s mildly annoyed. Rob is a marine mechanic; missing the boat risks injury to others.  
  **Question**: Does Rob know the ferry leaves at 18:40?  
  - **A) Yes** (he knows despite high stakes)  
  - **B) No** (high stakes prevent his knowing)  

  #### Node 2A (from 1A): **Stranger's Bet Case**  
  You have strong evidence the museum is closed on Mondays (e.g., official website). A stranger, as a joke, says they’ll donate to an abhorrent cause if you’re wrong.  
  **Question**: Do you know the museum is closed?  
  - **A) Yes** (the bet changes nothing)  
  - **B) No** (the bet undermines knowledge)  

  #### Node 2B (from 1B): **Maya's Knowledge**  
  Same as Node 1 (Maya and Rob).  
  **Question**: Does Maya know the ferry leaves at 18:40?  
  - **A) Yes** (low stakes allow knowing)  
  - **B) No** (even low stakes aren’t enough)  

  #### Node 3A (from 2A): **Priya's Calibration Case**  
  Priya runs a calibration check at 9:00 with excellent evidence the hospital machine is calibrated. At 16:00, unbeknownst to her, it’s used for a critical radiation dose.  
  **Question**: Did Priya know at 9:00 that the machine was calibrated?  
  - **A) Yes** (future stakes don’t affect past knowledge)  
  - **B) No** (future stakes retroactively undermine knowledge)  

  #### Node 3B (from 2B): **Friend in Stranger's Bet Case**  
  Same as Node 2A (you and the stranger’s bet). Your friend has identical evidence about the museum closure but no bet/threat.  
  **Question**: Does your friend know the museum is closed?  
  - **A) Yes** (only your stakes affect you)  
  - **B) No** (the bet affects everyone’s knowledge)  

  #### Node 4A (from 3A): **Dinner Remark Case**  
  At dinner, a guest mentions the ferry company migrated its website last night, and caches might show outdated timetables. No one is relying on this.  
  **Question**: Does this remark change whether Hanne knows the ferry time?  
  - **A) Yes** (salient errors undermine knowledge)  
  - **B) No** (salience doesn’t affect knowledge)  

  #### Node 4B (from 3B): **High-Stakes Attributor Case**  
  You are in a high-stakes situation (e.g., missing the ferry means missing a lifesaving appointment). Hanne (from start) has the same evidence.  
  **Question**: Does Hanne know the ferry time?  
  - **A) Yes** (her stakes matter, not yours)  
  - **B) No** (your stakes affect whether she knows)  

  #### Node 5A (from 4A): **Hanne After Dinner Remark**  
  Same as Node 4A (dinner remark).  
  **Question**: After the remark, does Hanne know the ferry time?  
  - **A) Yes** (she knew before and after)  
  - **B) No** (she no longer knows)  

  #### Node 5B (from 4B): **Priya's Calibration Revisited**  
  Same as Node 3A (Priya at 9:00).  
  **Question**: Could Priya’s knowledge at 9:00 be restored if the machine wasn’t used?  
  - **A) Yes** (only actual stakes matter)  
  - **B) No** (potential stakes always matter)  

  #### Node 6 (from 2B → 2B-B): **Skepticism Check**  
  Back to the start: Hanne in low stakes.  
  **Question**: Did Hanne ever truly know the ferry time?  
  - **A) Yes** (she knew then)  
  - **B) No** (evidence is never sufficient)  

  ---

  ### Leaves (Named Positions)  
  Follow your path to a leaf. Each leaf includes:  
  - **Position**: Name and one-sentence characterization.  
  - **Awkward Commitment**: One counterintuitive consequence.  

  1. **Classical Invariantism**  
     - *Position*: Knowledge depends only on truth, belief, and evidence; stakes/salience never affect it.  
     - *Awkward Commitment*: Rob knows despite high stakes (Node 1A), even if intuitions say otherwise.  

  2. **Contextualism (Attributor)**  
     - *Position*: "Knows" means different things in different conversations; attributor’s context sets the standard.  
     - *Awkward Commitment*: Hanne’s knowledge vanishes because of a remark about errors (Node 4A → 5B), even if she’s unaware.  

  3. **Subject-Sensitive Invariantism**  
     - *Position*: Knowledge depends on the subject’s practical situation; high stakes can destroy it.  
     - *Awkward Commitment*: Rob doesn’t know (Node 1B), but Maya does (Node 2B-A), despite identical evidence.  

  4. **Pragmatic Encroachment**  
     - *Position*: Knowledge is tied to action; if stakes are high, you need more evidence to "know."  
     - *Awkward Commitment*: You don’t know about the museum due to a stranger’s arbitrary bet (Node 2A-B).  

  5. **Contrastivism**  
     - *Position*: Knowledge is relative to a contrast class (e.g., "ferry on time vs. timetable wrong"); stakes define relevant contrasts.  
     - *Awkward Commitment*: Rob and Maya "know" different things (Node 1B → 2B-A → 4B-A), even with identical evidence and belief.  

  6. **Relativism**  
     - *Position*: Truth of "knows" is relative to the assessor’s situation; your high stakes can change whether Hanne "knows."  
     - *Awkward Commitment*: Hanne knows for her friend but not for you (Node 4B-B), creating incompatible truths.  

  7. **Skepticism**  
     - *Position*: We rarely (or never) have enough evidence for knowledge, regardless of stakes.  
     - *Awkward Commitment*: Even Hanne in low stakes doesn’t know (Node 6B), making "knowledge" impractical.  

  8. **Non-Factualism**  
     - *Position*: There’s no fact about "knowledge"; attributions reflect social practices, not truth.  
     - *Awkward Commitment*: Disagreements (e.g., Node 1) can’t be resolved—it’s just "what we say."  

  ---

  ### Appendix: Logical Space of Positions  
  This grid shows how distinctions in the tree map to positions. Rows are key questions; columns are answer combinations. Positions are labeled; empty cells are unattractive or incoherent.  

  | Distinction                          | Classical Invariantism | Contextualism | Subject-Sensitive | Pragmatic Encroachment | Contrastivism | Relativism | Skepticism | Non-Factualism |
  |--------------------------------------|------------------------|---------------|-------------------|------------------------|---------------|------------|------------|----------------|
  | **Whose situation matters?**         | Neither                | Attributor    | Subject           | Subject                | Subject       | Assessor   | Neither    | Neither        |
  | **What varies?**                     | Nothing               | Standards     | Knowledge fact    | Knowledge fact         | Contrast class| Truth      | Evidence   | No fact        |
  | **Stakes or salience?**              | Neither               | Salience      | Stakes            | Stakes                 | Stakes        | Both       | Neither    | Both           |
  | **Link to action?**                  | No                    | Indirect      | Yes               | Yes                    | Indirect      | No         | No         | No             |
  | **Same standard for all attributions?**| Yes                | No            | Yes               | Yes                    | No            | No         | Yes        | N/A            |

  **Notes**:  
  - **Unattractive combinations**: E.g., "Stakes matter for the subject, but knowledge is factually fixed" (incoherent).  
  - **Unexplored cells**: E.g., "Attributor’s stakes directly vary knowledge fact" (unattractive—why should the speaker’s needs change the subject’s mind?).  

  ---

  ### Tree Limitations and Edge Cases  
  - **Unseparated Positions**:  
    - *Subject-Sensitive vs. Pragmatic Encroachment*: These converge in most cases. To separate, add: "If Hanne won’t act on her belief, does she know?" (Encroachment says no; Subject-Sensitive says stakes alone matter).  
    - *Contextualism vs. Relativism*: Hard to distinguish without assessor variation. Add: "If a high-stakes eavesdropper hears your low-stakes claim about Hanne, is it true for them?" (Contextualism says no; Relativism says yes).  

  - **Answer Patterns with No Clear Leaf**:  
    1. **"Salience destroys knowledge only if stakes are high"** (e.g., Node 4A-A but only in high-stakes versions of Node 1). This suggests a **hybrid view** (e.g., salience matters only when practical interests exist).  
    2. **"Future stakes destroy past knowledge only if foreseeable"** (e.g., Node 3A-B only if Priya could guess the machine’s use). This implies **moderate pragmatic encroachment** (only actual stakes count).  
    3. **Inconsistent answers to Node 1 and Node 6** (e.g., Rob doesn’t know, but Hanne does). This lands in **Non-Factualism**—intuitions are context-bound, not truth-tracking.  

  ---

  ### Glossary  
  - **Attributor**: The person saying "S knows."  
  - **Subject**: The person who "knows" (e.g., Hanne).  
  - **Salience**: How noticeable a possibility of error is (e.g., the dinner remark).  
  - **Stakes**: What’s at stake if wrong (e.g., Rob’s risk of injury).  

