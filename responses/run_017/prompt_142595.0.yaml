  First, I need to parse their core concern: They want the dispute in their novel to be philosophically honest, not just plausible. They've identified that the "as-if" rule in programming standards (like C) seems central—where implementations can skip or reorder steps as long as observable behavior matches. But they're unsure what view of computation this implies. 

  Breaking down their specific questions:
  - What theory of computation does this practice rely on? They want it reconstructed, not just named—focusing on what makes a computation, sameness, implementation, and if it excludes rival views (like observer-relative computation).
  - Does it presuppose the Church-Turing thesis? And if so, which variant? They suspect the practice might allow hypercomputers, which challenges physical Church-Turing.
  - Can the practice exclude the replay archive (which isn't emulation but just lookup)? Or does that require extra conditions?
  - Is the practice coherent when it defines meaning via abstract machine steps but only enforces results, yet sometimes demands non-result things like timing?
  - Is "observable behavior" fixed or negotiable? And how can the practice claim meaning beyond finite testing?

  For the bottom line: The key presupposition is **extensional equivalence**—computations are the same if inputs map to identical outputs, regardless of internal process. This is functionalist and rejects any requirement for causal isomorphism. 

  Now, addressing the replay archive example: Under strict "as-if," it should qualify since behavior matches, but the practice likely rejects it implicitly because it violates uniformity (it's a lookup table, not a process that computes outputs from inputs). So uniformity is a hidden, practical necessity, even if not philosophically stated. 

  Church-Turing: The practice assumes the formal thesis (all models compute the same functions) but not the physical one—hypercomputers could be allowed if they behave "as-if." However, uniformity might indirectly enforce Turing-completeness in practice. 

  Observable behavior being negotiable: Timing is tricky. In crypto code, timing might be deemed observable if security interfaces are considered "external." This shows observability is context-dependent, defined by contracts or specs, not metaphysics. 

  Coherence: The abstract machine defines meaning nominally, but conformance cares only about extension. This tension is real but manageable in practice because specs detail what counts as observable. 

  Finally, meaning beyond evidence: The entitlement comes from formal specification (the abstract machine defined mathematically), not empirical conjecture. The abstract machine fixes the full set of possible behaviors, so testing just samples it. 

  For the numbered list: Need clear verdicts (presupposed, convenient, optional) on each thesis. Highlight that extensional equivalence is core, uniformity is practical but not absolute, and that meaning is defined by abstract machine specs, not implementation. 

  User’s deeper needs: They want dialogue fodder—philosophical points a programmer could say naturally. So avoid jargon; use phrases like "what it does, not how it does it" or "if it quacks like a duck, it’s preserved." Also, they need the rival archive to be debatable in-story, so clarify where the practice’s boundaries are fuzzy (e.g., "uniformity isn’t enforced but expected"). 

  Must emphasize that the crypto timing issue exposes how "observable" is stipulated—sometimes timing is part of the interface, sometimes not. That’s negotiable, not a fixed rule. 

  Overall, keep it grounded: Programmers in the novel would argue about specs, not metaphysics. The philosophical tension should feel organic to their work.
answer: |-
  ### Bottom line: The practice strictly presupposes that a computation is defined solely by its input-output behavior—what it *does*, not how it does it—making it extensionally equivalent to the abstract specification.

  ---

  ### Core Theses of the "As-If" Practice  
  1. **Extensional equivalence is identity**  
     - **Verdict: Strictly presupposed.**  
     Two computations are "the same" if they produce identical outputs for all possible inputs, regardless of internal steps. Your rival's replay archive *is* a valid implementation under this rule—unless behavior diverges for unrecorded inputs.  

  2. **Abstract machines define meaning, not implementation**  
     - **Verdict: Strictly presupposed.**  
     A program's meaning is fixed by the abstract machine's specification. Physical processes "implement" it if they match its observable effects, even if steps are skipped/reordered. No causal structure is required—only results matter.  

  3. **"Observable behavior" is contextually negotiable**  
     - **Verdict: Strictly presupposed (but negotiable in scope).**  
     Observability is defined by interfaces (files, network, screen). Timing/power are *not* observable unless explicitly specified (e.g., crypto timing becomes observable if security is contractual). Your crypto programmer’s compiler ignores timing because clocks aren’t standard interfaces.  

  4. **Rejecting causal isomorphism**  
     - **Verdict: Strictly presupposed.**  
     The practice is *incompatible* with theories requiring computational descriptions to mirror a mechanism's causal organization. If a lookup table matches behavior, it’s valid—no "process" of computation is needed.  

  5. **Church-Turing formal thesis is assumed; physical thesis is irrelevant**  
     - **Verdict: Formal thesis (equivalence of models) is presupposed; physical thesis (nothing beyond Turing machines) is optional.**  
     Hypercomputers *are* allowed: if an oracle machine behaves "as-if" it runs the abstract C machine, it’s conformant. The replay archive fails only if it misses inputs—but this is extensional failure, not a violation of Church-Turing.  

  6. **Uniformity is practical, not philosophical**  
     - **Verdict: Merely convenient (but often contractually enforced).**  
     The replay archive feels fraudulent because it lacks *uniformity*: it doesn’t compute outputs from inputs dynamically. But the standard excludes it only if behavior mismatches—so contracts add "no prerecorded data" clauses, appealing to efficiency or intent, not computation theory.  

  7. **Meaning outruns evidence via formal specification**  
     - **Verdict: Strictly presupposed.**  
     The abstract machine’s state-transition rules define the *entire set* of possible behaviors. Conformance isn’t proven by testing but by verifying the implementation’s design against this mathematical model. Disputes arise when specs underspecify edge cases (e.g., "undefined behavior" in C).  

  ---

  ### Dialogue-Ready Explanations  
  Your characters might argue like this:  
  - **Archivist defending emulation:** "Preservation isn’t about replaying footage. It’s about *running the real thing*—a system that responds to *any* input, not just ones we’ve seen."  
    *→ (Appeals to uniformity, though not strictly required)*  
  - **Compiler engineer:** "If the crypto timing isn’t declared observable, I can optimize it away. Blame the spec, not the compiler."  
  - **Rival firm:** "Our archive matches all observed behavior. If you wanted dynamic responses, you should’ve required it."  

  ### Why It’s Coherent (Despite Tensions)  
  The abstract machine anchors meaning; observability defines conformance. When timing matters (e.g., real-time systems), contracts *expand* "observable" to include it. The practice isn’t broken—it’s purposefully flexible.  

  ### Key Exclusions  
  - **Rejected:** Any theory where computational identity requires specific causal processes (e.g., "the program *must* execute these loops").  
  - **Compatible but unnecessary:** Physical Church-Turing (hypercomputers are allowed but irrelevant; no one builds them).  

  This is how programmers and preservationists actually think—grounded in specs, not metaphysics. Use these tensions to fuel your characters’ conflict.
