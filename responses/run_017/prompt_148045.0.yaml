answer: |-
  Here's the transcendental argument (TA) strategy restated strictly in your appellate litigation vocabulary, followed by a residue report addressing your specific questions:

  ### Restatement in Litigation Vocabulary
  1.  **The Claim:** Skeptic (S) asserts a challenge (C) against proposition (P). (E.g., C = "Knowledge of the external world is impossible"; P = "The external world exists and is knowable").
  2.  **Burden of Production/Proof:** S bears the initial burden to establish a *prima facie* case for the plausibility or coherence of challenge (C). S must demonstrate C is a legally cognizable claim capable of being adjudicated.
  3.  **Presumption:** A fundamental, operational presumption exists within the framework of rational discourse and argumentation (the "Court of Reason"): **Meaningful assertion or challenge requires adherence to the preconditions necessary for coherent communication, reasoning, and justification.** (This is the bedrock "standard of review" for any claim).
  4.  **Concession-by-Conduct (Judicial Estoppel/Implied Admission):** By *filing* challenge (C) and *prosecuting* it through reasoned argument, S necessarily engages in conduct that implicitly *concedes* the validity of certain foundational preconditions (P). S's conduct presupposes P as a necessary condition for mounting C itself. (E.g., To argue *against* the knowability of the external world coherently, S must *use* the concepts of objectivity, causation, reliable faculties, etc., presupposed *by* the knowability of the external world).
  5.  **Burden-Shifting:** If the proponent of P demonstrates that S's challenge (C) *logically requires* presupposing P in the very act of presenting C, then:
      *   S's challenge (C) is deemed **internally inconsistent** with S's own conduct (the act of arguing C).
      *   The burden **shifts decisively back to S** to demonstrate how C can be coherently maintained *without* presupposing P. S must overcome this estoppel/implicit admission.
  6.  **Failure to Meet Shifted Burden & Estoppel:** S cannot meet this burden. Any attempt to argue *against* P while simultaneously *using* P's preconditions merely reaffirms the inconsistency. Therefore:
      *   S is **judicially estopped** from denying P while simultaneously relying on the framework P provides to mount the challenge.
      *   Challenge (C) is dismissed not necessarily because P is *proven true* beyond doubt head-on, but because S has failed to state a *cognizable claim*. C is **self-defeating** and thus **non-justiciable** within the framework of rational discourse *precisely because* it saws off the branch it sits on.
  7.  **Standard of Review:** The TA applies a **de novo** review to the *logical structure* and *presuppositional requirements* of S's challenge (C). It examines whether C violates the fundamental presumption (Point 3) by attempting to deny its own necessary preconditions.

  ### Residue Report: Carryover, Fudge, and Gaps
  1.  **What Carries Over (Strongly):**
      *   **Burden Assignment/Shifting:** The core dynamic of assigning an initial burden to the challenger (S) and then shifting a heavier burden back when inconsistency is shown maps perfectly.
      *   **Estoppel/Concession-by-Conduct:** This is the *strongest* carryover. The TA *is* fundamentally an estoppel argument ("You can't say *that* because your very act of saying it relies on the opposite"). The "branch sawing" metaphor *is* estoppel.
      *   **Failure to State a Cognizable Claim/Non-Justiciability:** The conclusion that the challenge is incoherent and thus cannot be rationally adjudicated fits neatly into "failure to state a claim upon which relief can be granted" or declaring an issue non-justiciable.
      *   **Presumption of Operational Framework:** The idea that rational discourse requires adherence to basic rules (logic, meaningful concepts) functions like a foundational legal presumption.
      *   **De Novo Review:** Analyzing the logical structure of the argument aligns with de novo review of legal questions/viability of claims.

  2.  **What Required Fudging/Slight Stretching:**
      *   **The "Presumption" (Point 3):** While law has presumptions about evidence or procedure, the TA's presumption about the *preconditions for rational discourse itself* is more metaphysical and universal than typical legal presumptions (which are often policy-driven or based on probability). Calling it a "standard of review" helps, but it's deeper bedrock.
      *   **"P" as a Proposition:** In law, concessions/estoppel often relate to specific facts or legal positions. In TA, "P" is usually a very broad, foundational *condition* (like logic, causality, the reliability of reason, the existence of other minds, objective morality). The scope of "P" is grander.
      *   **Burden of Persuasion vs. Coherence:** In law, failing to meet a burden usually means the factfinder sides against you on that point. In TA, failing to meet the shifted burden means the *entire challenge* is dismissed as incoherent, not just that P is deemed true. The victory is procedural/dismissive regarding C, rather than affirmative proof of P.

  3.  **What Has No Direct Counterpart:**
      *   **The Metaphysical Claim of Necessity:** The core philosophical claim of TA is that P is *transcendentally necessary* – not just pragmatically useful or presumed, but *logically unavoidable* as a condition for the possibility of experience, thought, or argument *at all*. Law deals with burdens, proofs, and resolutions within a system; it doesn't typically make claims about what is *absolutely necessary* for rationality itself to exist. This is the "thicker" philosophical residue.
      *   **The Ambition to Establish Truth (vs. Resolve Dispute):** While TA concludes C is incoherent, its proponents often see it as *establishing* P's truth (or something very close). The legal analogy concludes C is non-justiciable/incoherent *within the system*, which pragmatically resolves the dispute in favor of P's functional necessity, but doesn't necessarily make the same strong *metaphysical* claim about P's absolute truth outside the context of the dispute. Your hunch about "can't help believing p" vs. "p is true" touches this gap.

  ### Addressing Your Hunch & Questions
  *   **Your Hunch is Largely Correct (and Insightful):** Translating TA into litigation terms *does* strongly emphasize that it functions as a powerful form of **estoppel**, shifting burdens decisively and rendering the skeptic's challenge **procedurally untenable** or **non-justiciable** due to internal inconsistency. It settles the *dispute* in favor of P by showing the challenge is self-defeating and cannot be coherently maintained. This *does* align with the "old complaint" that TA shows we *must presuppose* P to function rationally, not that it *proves* P in a vacuum.
  *   **Is Your Vocabulary Too Thin?** Not "too thin" for its purpose, but it *reveals a limitation inherent in TA itself*. The litigation framework brilliantly captures the *argumentative force* and *procedural resolution* of TA but struggles to fully embody the *metaphysical ambition* some philosophers attach to it (establishing P's absolute truth). Your vocabulary exposes that the core *work* of TA is indeed estoppel and burden-shifting within discourse, making the challenge non-viable. The residue (P's absolute necessity/truth) might be an *interpretation* of that victory, but not strictly *proven* by the move itself. Your framework hasn't missed something crucial; it's caught the essential *mechanism*.
  *   **Law's "Non-Justiciable" Move: Honest or Cop-Out?**
      *   **In Law:** Declaring a challenge non-justiciable (e.g., political question, lack of standing where standing is defined by harm presupposing P) is **not a cop-out; it's an honest application of the system's rules.** It acknowledges the dispute cannot be resolved *by this adjudicative framework* because the challenge either falls outside its competence or, crucially, *undermines the framework itself*. Applying this to TA means: "Your challenge relies on the very thing you deny to make sense; therefore, within the framework of rational adjudication we *must* use, it cannot be heard. It is dismissed, and the framework (P) stands operative." This is procedurally sound and avoids futile metaphysical battles the system isn't equipped for.
      *   **Contrast with Philosophy:** Philosophy often feels compelled to *engage* the metaphysical challenge head-on, seeking ultimate justification. Law, focused on resolving disputes under a working system, can more cleanly say, "That challenge destroys the basis for *any* adjudication here; it's dismissed as incoherent *within this court*." This *is* the honest version of the procedural move inherent in TA. Calling it a "cop-out" misses the point: law explicitly defines its domain and dismisses what lies destructively outside it. Philosophy, seeking universal foundations, finds this move less satisfying, though pragmatically, TA *is* doing something very similar when it declares the skeptic's position non-viable.

  **Conclusion:** Your litigation vocabulary provides a remarkably robust and honest translation of the transcendental argument strategy. It reveals TA as fundamentally a **masterstroke of burden-shifting estoppel**, rendering the skeptic's challenge **non-justiciable** due to self-referential incoherence. This confirms your hunch that TA primarily establishes that the skeptic *cannot coherently deny* P within rational discourse, rather than proving P's truth in a freestanding metaphysical sense. The law's move of declaring such a challenge non-justiciable is not a cop-out but the **procedurally honest and efficient expression** of this insight within an adjudicative system. The residue lies in philosophy's stronger metaphysical claims about P's *necessity*, which your vocabulary pragmatically resolves by making P an indispensable operational presumption.
