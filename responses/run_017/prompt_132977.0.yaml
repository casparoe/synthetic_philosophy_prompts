  The Goodman case needs careful handling. They're right that grue-like environments are computable, but the predicate relabeling creates a false symmetry - the grue program isn't genuinely shorter when accounting for the interpreter's temporal structure. This touches on the key insight: U's architecture embeds assumptions about natural regularities. Their 500-bit example actually demonstrates how massive complexity differences would require equally massive evidence to overcome.

