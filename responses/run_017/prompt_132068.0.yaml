  Below is the decision tree designed as a text flowchart for your reading group. I've structured it to prioritize pedagogical clarity, starting from the root scenario and branching through intuitive questions that lead to named updating rules. The tree uses your specified distinctions (1-8) as its foundation, with one distinction replaced (see substitution below). I've aimed for 8 branch nodes and 8 leaves, ensuring each node is answerable without jargon.  

  **Key design choices:**  
  - **Substitution:** I replaced distinction 7 (*whether the shift could be endorsed in advance*) with distinction 6 (*expecting more shifts and path independence*). Distinction 7 is subtle and often requires understanding exploitable strategies, which might derail the flow. Distinction 6 is more operational (e.g., "Would two small shifts feel equivalent to one big one?") and directly separates rules like Jeffrey's (path-independent) from others.  
  - **Node order:** Logical flow prioritizes the *nature of the change* (event vs. no event) first, then *representability in the algebra*, then *locality of the change*, and finally *methods for handling constraints*. This mirrors how students confront problems: "What happened?" → "Can I model it simply?" → "What does it constrain?" → "How do I update?"  
  - **Uncertain placement:** Node 7 (*minimize distance?*) is placed late because distance minimization is a "fallback" method; students should first explore conditioning or kinematics.  
  - **Flagged indistinguishability:** The tree cannot separate **Holistic Re-evaluation** and **Set-valued Update** in one case (see leaf 8 details).  
  - **Unoccupied combinations:** All covered in leaf notes.  

  ---

  ### **Decision Tree: Updating Rules for Uncertain Evidence**  
  **Root Scenario:**  
  *On Monday, your credence that a specimen belongs to species A is 0.3. By Tuesday, it is 0.7. Nothing you became certain of explains the change. You must update your credence in a hypothesis H (e.g., "the specimen is poisonous").*  

  ---

  #### **Node 1: Was there an external event causing the change?**  
  *(e.g., a fleeting glimpse, a garbled message, or a physical symptom; not just thinking harder)*  
  - **Why here?** Starts with the most intuitive distinction (event vs. reflection) and directly uses distinction 1.  
  - **Yes** (Event occurred) → Go to Node 2.  
  - **No** (Only reflection) → Go to Node 5.  

  #### **Node 2 (Event): Could you have become certain of a specific proposition about your experience?**  
  *(e.g., "I saw blue feathers," not just "my credence rose"; distinction 2)*  
  - **Why after Node 1?** Events should first be tested for "reducibility" to standard conditioning.  
  - **Yes** (e.g., a clear message) → **Leaf 1: Ordinary Conditioning**.  
    - *Update by conditioning on the proposition in an enlarged algebra.*  
    - **Worst case:** Vague experiences (e.g., "a hunch") with no clear proposition.  
  - **No** (Uncertain or noisy evidence) → Go to Node 3.  

  #### **Node 3 (Event, no proposition): Did the event fix a new probability for A?**  
  *(e.g., a report saying "A is 70% likely"; distinction 4)*  
  - **Why after Node 2?** If conditioning fails, we ask what the evidence *directly* provides.  
  - **Yes** (New probability for A) → Go to Node 4.  
  - **No** (Only constraints, e.g., "A or B is more likely now") → Go to Node 7.  

  #### **Node 4 (Event, new P(A)): Does the evidence only concern A?**  
  *(e.g., it says nothing about fog, time, or other factors entangled with A; distinction 3 and 8)*  
  - **Why here?** Tests if conditionals are preserved (Jeffrey's requires this).  
  - **Yes** (Only about A) → **Leaf 2: Probability Kinematics (Jeffrey's Rule)**.  
    - *Set P_new(A) = 0.7 and keep P_new(H|A), P_new(H|¬A) unchanged.*  
    - **Worst case:** Evidence affects entangled factors (e.g., fog correlates with time, which correlates with species activity).  
  - **No** (Also about other things) → Go to Node 6.  

  #### **Node 5 (No event): Is the change confined to the odds on A vs. ¬A?**  
  *(i.e., conditional probabilities like P(H|A) stay fixed; distinction 3)*  
  - **Why after Node 1?** For internal changes, we first check if they're local.  
  - **Yes** (Only odds on A changed) → **Leaf 5: Arbitrary Odds Adjustment (Unnamed)**.  
    - *Just set P_new(A) = 0.7, keep conditionals fixed, no further justification.*  
    - **Worst case:** The change arises from rethinking conditionals (e.g., "I misremembered toxicity rates").  
    - **Unoccupied?** Coherent but unattractive; no named rule endorses arbitrary shifts.  
  - **No** (Holistic rethink) → Go to Node 8.  

  #### **Node 6 (Event, new P(A), not only about A): Must the change preserve conditional probabilities for all hypotheses?**  
  *(distinction 3 – tests if A "screens off" H from other factors)*  
  - **Why after Node 4?** When evidence isn't solely about A, we check if conditionals are still sacred.  
  - **Yes** (Preserve all P(·|A), P(·|¬A)) → **Leaf 3: Jeffrey's Rule (Extended)**.  
    - *Same as Leaf 2 but applied even with entangled evidence (risky).*  
    - **Worst case:** Evidence directly affects H (e.g., a glimpse suggests A and hints at toxicity).  
  - **No** (Conditionals may change) → Go to Node 7.  

  #### **Node 7: Do you update by minimizing "distance" from the old distribution?**  
  *(e.g., seeking the "closest" probabilities satisfying constraints; distinction 5)*  
  - **Why here?** Late placement because distance-minimization is a computational tool, not a causal model.  
  - **Yes** → **Leaf 4: Minimum Relative Entropy Update**.  
    - *Minimize Kullback-Leibler divergence (or similar) subject to constraints (e.g., P_new(A) = 0.7).*  
    - **Worst case:** Nonlinear constraints (e.g., "variance of H must decrease").  
  - **No** → Go to Node 8.  

  #### **Node 8: Could two small shifts land where one big one would?**  
  *(e.g., if you expect more evidence like this; distinction 6 – substituted for 7)*  
  - **Why last?** Path independence is a higher-order property; students should first rule out simpler methods.  
  - **Yes** (Path independence needed) → **Leaf 6: Jeffrey's Rule (Revisited)**.  
    - *Forces kinematics to ensure consistency over repeated updates.*  
    - **Worst case:** Non-rigid shifts (e.g., evidence distorts conditionals over time).  
  - **No** → **Leaf 7: Holistic Re-evaluation** or **Leaf 8: Set-valued Update**.  
    - **Flag:** The tree cannot separate these leaves. Use descriptions below.  

  ---

  ### **Leaves (Updating Rules)**  
  1. **Ordinary Conditioning**  
     - *When:* Evidence becomes a certain proposition in an enlarged algebra.  
     - *Worst case:* Truly uncertain evidence (e.g., subconscious cues).  

  2. **Probability Kinematics (Jeffrey's Rule)**  
     - *When:* Event directly gives P_new(A), and evidence is solely about A.  
     - *Worst case:* Evidence corrupts conditionals (e.g., reveals diagnostic errors).  

  3. **Jeffrey's Rule (Extended)**  
     - *When:* Event gives P_new(A) but evidence isn't solely about A; conditionals preserved anyway.  
     - *Worst case:* Evidence violates screening-off (e.g., fog affects toxicity estimates directly).  
     - **Unoccupied?** Incoherent if conditionals change; otherwise unattractive (rarely used).  

  4. **Minimum Relative Entropy Update**  
     - *When:* Constraints require minimizing probabilistic "distance".  
     - *Worst case:* Constraints conflict with prior structure (e.g., create cycles).  

  5. **Arbitrary Odds Adjustment (Unnamed)**  
     - *When:* Reflection changes only P(A), with no event or deeper justification.  
     - *Worst case:* Conditionals should change (e.g., new arithmetic affects H|A).  
     - **Unoccupied?** Coherent but unexplored as a "rule"; often seen as inconsistent.  

  6. **Jeffrey's Rule (Revisited)**  
     - *When:* Path independence is demanded for repeated similar updates.  
     - *Worst case:* Evidence properties change (e.g., first glimpse is clear, next is fuzzy).  

  7. **Holistic Re-evaluation**  
     - *When:* Judgment reshapes all probabilities (no local constraints).  
     - *Worst case:* Urgent decisions needing consistency (e.g., repeated bets).  
     - **Indistinguishable from Leaf 8?** Yes, without specifying representation.  

  8. **Set-valued Update**  
     - *When:* Ambiguity requires moving to a *set* of distributions (e.g., "P_new(A) ≈ 0.7").  
     - *Worst case:* Combinatorial explosion (e.g., many interdependent hypotheses).  
     - **Unoccupied?** All covered; non-probabilistic surrogates (e.g., rankings) fall here.  

  ---

  ### **Notes on Unoccupied Combinations & Tree Limits**  
  - **Incoherent combinations:**  
    - Trying to preserve conditionals when evidence violates screening-off (Node 6 → Yes) → Leads to Jeffrey's Extended, but often incoherent.  
  - **Unattractive combinations:**  
    - Arbitrary shifts (Leaf 5) → Coherent but exploitable; no named rule endorses it.  
  - **Unexplored combinations:**  
    - Constraints + path independence without kinematics → Empty; no rule minimizes distance while enforcing path independence.  
  - **Indistinguishable leaves:**  
    - **Holistic Re-evaluation (Leaf 7)** and **Set-valued Update (Leaf 8)** cannot be separated by the tree. Students must decide: "Am I comfortable with one distribution (Leaf 7) or do I need a set (Leaf 8)?"  

  This tree covers all your distinctions and provides a scaffold for discussion. I recommend printing it as a handout with the root at the top and branching downward. In session, you can have students walk through the tree in pairs, then regroup to debate the leaves and their weaknesses.
