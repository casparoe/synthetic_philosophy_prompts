    You move to a set of distributions that meet the constraint (if any) or reflect your new state.  
    *Worst case: When you need a single distribution for decision making.*
  - **Option C: You use a non-probabilistic representation (e.g., ranking functions, imprecise probabilities).**  
    → **Leaf: Non-probabilistic Revision**  
    You abandon probabilities for another system.  
    *Worst case: When you want to combine with standard probabilistic reasoning.*

  ## Unoccupied Combinations and Notes:
  - The path from Node 5 (No) and Node 6 (No) leads to Node 8. This covers cases without a standard rule.
  - **Unnamed: Ad Hoc Odds Change** is a combination that is coherent but unattractive because it doesn't provide a general rule. It is not a standard updating procedure but a description of an arbitrary change.
  - **Set-valued Update** and **Non-probabilistic Revision** are for cases where no single probabilistic distribution is chosen.
  - **Flag**: The two leaves for **Minimum Relative Entropy Update** (from Node 5 and Node 7) are the same rule applied in different contexts (with or without an event). The tree does not distinguish them by context, but the rule is identical. So we have one rule in two leaves. We can combine them in description, but in the tree they are separate branches.

  ## Node Placement Justification:
  - **Node 1 (Event?)** comes first because it splits the tree into two fundamentally different cases: evidence-driven vs. internal.
  - **Node 2 (Capture by proposition?)** is next for the event branch because if you can condition, you're done.
  - **Node 3 (Assigned new prob?)** comes after Node 2 because if not conditioning, we ask about the form of the evidence: direct probability assignment or constraint.
  - **Node 4 (Solely about A?)** is only for direct probability assignments to A, to see if Jeffrey's rule applies.
  - **Node 5 (Minimize distance?)** is for the event branch when we don't have a proposition and either not direct or not solely about A. This is where distance minimization is common.
