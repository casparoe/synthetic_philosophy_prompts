prompt: |-
  Science journalist here, I write a lot about expertise and I keep hitting the same thing in interviews and I dont have a word for it, or at least not one I trust.

  Three cases. A neonatal nurse who can intubate a preemie in seconds, and who can watch a resident and say "too deep, you're going in too deep" before anything has visibly gone wrong. But the account she gives of what she is doing is not just incomplete, it is false: the angle she describes is not the angle her hands use. I have seen this on video, slowed down. She watches it, says "huh, I guess I do do it that way," and then nothing changes. She keeps the old description, her hands keep doing the other thing, and she is still the best person in the room. Second: a guy who rebuilds vintage transmissions. Same shape. He taught me to find a gear whine by sound, and every rule he stated while doing it was contradicted by what he actually did; when I pointed that out he said "that's what the manual says, I'm telling you what I do." Third, the one I think is genuinely different: a chess player who can give a reason for every move, correctly, in a way that survives a stronger player's questions, and who is still only a middling player.

  So what I am after is whatever the nurse and the mechanic have and the chess player does not — or the reverse, I'm not committed. It isn't just "skill" and it isn't just "can't put it into words," because she can be made to see it and seeing it does nothing: the correct description neither helps her nor, apparently, is what she was using. Is there an established concept for this, the thing that survives being told a false theory of itself? And whatever it's called I need the edges, not the label. Is it one thing or several? How do I tell, in an interview, whether Im looking at the nurse's case or the chess player's? And is the fact that the description does no work actually evidence about what the knowledge is, or is it just evidence that she's bad at introspecting?
reasoning: |-
  Okay, this science journalist is onto something really interesting. They've observed this gap between what experts say they do and what they actually do, and it's not just about difficulty articulating - it's about the explanations being demonstrably wrong while the skill remains flawless. 

  The neonatal nurse case is fascinating - even when shown video evidence contradicting her description, her hands keep doing the right thing and her explanation doesn't change. That's not just inability to articulate; it's like the explanation is completely decoupled from the action. The mechanic is similar - he's consciously giving the "textbook" answer while his hands follow a different, superior logic. 

  Then there's the chess player who can articulate perfect reasons for every move but remains mediocre. That inverted case suggests this isn't just about skill level - it's about the relationship between conscious reasoning and embodied expertise. 

  I need to unpack this carefully. First, the core phenomenon seems to be "unconscious competence" but that's too vague. The key is the dissociation between the operative knowledge (what they actually use) and the descriptive knowledge (what they say). Polanyi's tacit knowledge comes to mind - knowledge that can't be fully verbalized. But this goes further because the verbalization isn't just incomplete - it's actively wrong. 

  The journalist's real question is: what survives when you feed the expert false information about their own actions? That suggests the knowledge is stored in a way that's not accessible to conscious reasoning. The procedural memory system (how we ride bikes, etc.) fits - it operates below awareness. 

  For the chess player, it's different - their problem might be "verbal overshadowing" where excessive articulation interferes with intuition. Or perhaps they have declarative knowledge without the deep pattern recognition that masters have. 

  To help the journalist distinguish cases in interviews: I should suggest looking for sensory cues (the nurse's "feel", the mechanic's sound), whether the skill degrades when they try to follow their own instructions, and whether their explanations match observable actions. The fact that the description does no work suggests the knowledge isn't propositional - it's embodied. 

  This feels like it connects to Dreyfus' model of expertise, where experts stop following rules and develop intuitive responses. The nurse and mechanic are at that stage, while the chess player might be stuck at the "competent" stage where they still rely on analytical thinking. 

  The journalist also needs to know if this is one phenomenon or several. Probably a spectrum - from pure tacit knowledge (nurse) to semi-conscious (mechanic) to misapplied declarative knowledge (chess player). But the core mechanism might be the same: embodied cognition vs. verbal reasoning. 

  This is rich territory. I'll structure the response around the key distinctions, supported by cognitive science concepts, and give practical interview tips. The journalist clearly wants to move beyond labels to the underlying mechanisms.
answer: |-
  This is a profound observation at the heart of expertise, and you're right that simplistic terms like "tacit knowledge" or "intuition" don't fully capture the dissociation you're seeing. The nurse and mechanic exhibit a phenomenon with deep roots in cognitive science, while the chess player represents a different (though related) challenge. Let's break down the core concept, its boundaries, and how to identify it.

  **The Core Concept: Procedural Knowledge & Embodied Cognition (The Thing That Survives)**

  The knowledge possessed by the nurse and mechanic is primarily **procedural knowledge**, stored implicitly in sensorimotor systems and honed through massive, domain-specific practice. This knowledge is:

  1.  **Action-Oriented:** It's "knowing-how" to perform a complex physical action or perceptual discrimination, not "knowing-that" (declarative facts).
  2.  **Implicit:** It operates below conscious awareness. Experts often cannot directly access the fine-grained details of *how* they do what they do.
  3.  **Embodied:** Deeply integrated with sensory feedback (touch, proprioception, sound, subtle visual cues) and motor patterns. The nurse *feels* the tube going too deep through minute vibrations/resistance before it's visually apparent. The mechanic *hears* the specific harmonic signature of the faulty gear.
  4.  **Pattern-Based:** Relies on rapid, holistic recognition of complex patterns (sensory, kinesthetic, situational) built from thousands of experiences. The nurse recognizes the *gestalt* of a correct vs. incorrect intubation attempt instantly.
  5.  **Robust to Misdescription:** Crucially, **this knowledge resides in neural pathways distinct from the language centers used for explanation.** Telling the nurse a fact about angles doesn't alter the deeply ingrained motor program or perceptual skill. Her hands "know" what to do independently of her verbal account. The mechanic consciously *chooses* to recite the manual, but his hands operate on a different, superior, internal logic.

  **Why the Description Does No Work (And What It Tells Us):**

  *   **It's Not (Primarily) Bad Introspection:** While introspection is hard, the key point is that **the operative knowledge isn't stored in a format accessible to introspection.** It's not verbal or propositional. Trying to describe it *requires* constructing a post-hoc narrative using a different cognitive system (declarative memory/language).
  *   **Evidence for the Nature of the Knowledge:** The failure of the "correct" description to change performance is *strong evidence* that:
      *   The skill is truly procedural and embodied, not reliant on conscious rule-following.
      *   The declarative explanation she previously used was likely a *heuristic* or *simplified model* learned early on, useful for teaching basics or organizing thought, but not the actual engine of her high-level performance. It might even have been a placeholder she adopted because she *needed* to say *something* when asked.
      *   The core expertise resides in non-conscious systems optimized for speed and pattern recognition in the specific context.

  **The Chess Player: A Different Problem (Declarative Knowledge Without Deep Pattern Recognition)**

  The chess player represents the *inverse* problem:

  1.  **Strong Declarative Knowledge:** They possess excellent verbal access to chess principles, tactics, and reasoning processes. They can articulate plausible, rule-based justifications.
  2.  **Lack of Deep Procedural/Pattern Knowledge:** What they lack is the **master-level pattern recognition** built from analyzing tens of thousands of positions. Grandmasters instantly recognize complex board configurations, threats, and strategic potential in a way that feels intuitive. This pattern recognition *is* a form of procedural knowledge (perceptual expertise), distinct from verbal reasoning.
  3.  **Verbal Overshadowing?** Sometimes, excessive reliance on verbal reasoning can *interfere* with intuitive pattern recognition, though this is debated.
  4.  **The Gap:** Their middling skill indicates their declarative knowledge isn't sufficiently integrated with or supported by the deep, rapid, holistic pattern recognition that drives elite play. Their explanations might be "correct" in a narrow sense (e.g., "I attacked the weak pawn") but miss the deeper strategic context or subtle tactical nuances a master would instantly perceive.

  **Distinguishing the Cases in Interviews: Key Questions & Observations**

  | **Aspect**              | **Nurse/Mechanic (Procedural/Embodied)**                     | **Chess Player (Weak Procedural Pattern Recognition)**            |
  | :---------------------- | :----------------------------------------------------------- | :---------------------------------------------------------------- |
  | **Core Knowledge**      | Sensorimotor patterns, perceptual discriminations (implicit) | Declarative rules, principles, conscious calculation (explicit) |
  | **Under Pressure**      | Performance remains fluent, fast, accurate                   | Performance slows, accuracy drops, more errors                    |
  | **Verbal Explanation**  | Contradicts observed action OR is vague/incomplete           | Aligns with actions but is superficial or misses patterns         |
  | **Observed Actions**    | Fluid, efficient, adapted to context                         | Deliberate, rule-following, may miss intuitive opportunities      |
  | **Reaction to Evidence** | Shrugs off contradiction; skills unaffected                  | May adjust explanation but core skill doesn't improve significantly |
  | **Key Interview Focus** | Sensory cues ("What do you feel/hear?"), action flow         | Depth of explanation, pattern recognition speed                   |

  **Key Questions to Ask/Things to Observe:**

  1.  **"Walk me through exactly what you did, step-by-step, as if teaching a novice."** (Compare description to actual action/recording if possible). Look for discrepancies.
  2.  **"What specific sensations are you paying attention to? (What do you feel in your hands? What sound are you listening for? What does it look like *just before* it goes wrong?)"** Experts with deep embodied knowledge often reference sensory cues *naturally*. The nurse *might* say "I feel it seat" or "it just feels right." The mechanic will talk about the *sound*. The middling chess player talks about pieces and squares abstractly.
  3.  **"How did you learn this? Can you remember a time when you couldn't do it?"** Experts often describe long apprenticeships focused on *doing* and *correcting* based on feedback, not just learning rules. The chess player might focus on books and tactics training.
  4.  **Observe Under Time Pressure/Complexity:** Does performance remain smooth and accurate (procedural mastery), or does it degrade, becoming slower and more error-prone (reliance on conscious calculation)?
  5.  **Challenge the Explanation:** "You said you do X, but when I watched, you did Y. What's going on there?" The nurse/mechanic reaction ("Huh, weird" or "That's just what the manual says") is telling. The chess player might revise their explanation to fit the move but won't magically play better.
  6.  **Ask About Mistakes:** "What does a mistake *feel* like or *sound* like?" Experts with embodied knowledge have sensory markers for errors.

  **Is it One Thing or Several?**

  It's a spectrum anchored by two poles, but the nurse/mechanic case is a distinct *type* of knowledge representation:

  1.  **Pure Procedural/Embodied Expertise (Nurse/Mechanic):** Knowledge is fundamentally non-verbal, sensorimotor, and pattern-based. Explanations are decoupled heuristics or simplified models.
  2.  **Weak Procedural Pattern Recognition (Chess Player):** Knowledge is primarily declarative and analytical. The crucial missing element is the deep, rapid, non-conscious pattern recognition that defines elite performance *in that specific domain*. (This pattern recognition *is* procedural knowledge).
  3.  **Integrated Expertise (The Ideal Master):** Possesses *both* deep, rapid procedural pattern recognition *and* the ability to generate accurate, insightful declarative explanations that *map well* onto the underlying processes (though perhaps not perfectly). Their explanations are useful because they reflect deep understanding, not just recitation.

  **Established Concepts & Frameworks**

  *   **Procedural vs. Declarative Knowledge:** (Cognitive Psychology) The core distinction.
  *   **Tacit Knowledge:** (Polanyi) Emphasizes the *unarticulable* aspect, but your cases show it's more than just "hard to say" – it can be *actively misdescribed* without harm.
  *   **Embodied Cognition:** Highlights how cognition is shaped by and dependent on the body and sensorimotor experiences.
  *   **Dreyfus Model of Skill Acquisition:** Novices rely on rules; Competents apply rules contextually; Proficients perceive situations holistically; Experts act intuitively based on deep tacit understanding. The nurse/mechanic are at the Expert stage. The chess player is likely stuck at Competent/Proficient, relying heavily on rules/analysis.
  *   **Dual Process Theory:** System 1 (fast, intuitive, pattern-based) vs. System 2 (slow, analytical, rule-based). The nurse/mechanic rely on highly trained System 1. The chess player relies too much on System 2 for tasks requiring System 1 fluency.
  *   **Verbal Overshadowing:** (Schooler) The phenomenon where verbalizing non-verbal memories/processes can impair performance. This *might* be a factor for the chess player if over-verbalizing hinders intuition, but it's less central to the nurse/mechanic dissociation.

  **In Summary:**

  You are observing the remarkable resilience of **deeply embodied, procedural knowledge** honed through massive domain-specific practice. This knowledge operates implicitly, guided by sensory patterns and motor programs, largely independent of (and sometimes contradictory to) the conscious, declarative explanations experts construct. It "survives being told a false theory" because the theory isn't the engine. The chess player lacks this specific *type* of non-conscious, pattern-driven expertise *despite* strong declarative skills. To spot it, focus on sensory cues, action fluency under pressure, and the disconnect (or lack thereof) between explanation and execution. The description's uselessness for the expert isn't about bad introspection; it's proof the knowledge resides elsewhere.
