prompt: |-
  hey — I'm a backend engineer, no philosophy background beyond stackexchange flamewars, and I somehow ended up on our incident review board. We run blameless postmortems (good), but there's a second step afterwards where we write an "accountability note" that goes into the person's file and feeds promo and comp. So we absolve blame and then assign it anyway, which feels incoherent but nobody can say exactly why.

  The thing that keeps biting us: two people make basically the same call with the same information, one gets a bad outcome and one doesn't, and the two notes come out completely different. Someone told me this has a name — "moral luck"? apparently there are a few flavors: luck in how things turn out, luck in what situation you landed in, luck in what kind of person you are. That sounds like our problem, except we can't just shrug. We meet weekly, we have about an hour per incident, there's an EM and someone from HR in the room, and the output goes in someone's permanent record.

  What I want is a procedure, not an essay. Something my team can literally run:

  - a fixed order of questions to answer from the incident writeup
  - what counts as a sufficient answer to each, in normal-person language (my EM will not read a sentence with "counterfactual" in it)
  - where the procedure stops and says no accountability
  - where it hands off to a human because the remaining question is about values, not facts

  Specific things it has to handle, because these are the ones we actually argue about:

  First, we already know the outcome when we write the note, and I don't think we can un-know it. So give me a concrete trick for separating "was this decision reasonable given what was knowable at the time" from "did it turn out badly." My idea was to write two notes — one with the outcome redacted, one with it — and if they disagree, that disagreement is the luck, and we have to say out loud which one we're filing. Tell me if that's workable or if it's self-deception.

  Second, the inverse case: someone who skipped review, pushed to prod on a Friday, and got away with it — no incident, and it cut p99 latency in half so they looked great. My intuition is he should get the same note as the person who skipped review and caused a six hour outage. Make that fall out of the procedure rather than being an extra rule bolted on.

  Third, symmetry: whatever strips blame for lucky outcomes should also strip credit. Our "heroes" are often just people whose risky hotfix happened to work, and HR really does not want to hear that, so flag where that bites.

  Fourth, the temperament thing. Some of our engineers are wired cautious and never cause incidents; some are cowboys and sometimes cause them and sometimes ship the thing that saves us. If part of what we're rating is just personality, that's the third kind of luck and I don't know what to do with it procedurally — you can't put "be more cautious" in a performance note.

  Fifth, near misses and latent bugs that never fired, and the related case where the badness depends on when we happened to discover it. And a case we hit last month: the person who owned the service for three weeks versus the person who wrote the code four years ago.

  Two more constraints. I can't read academic stuff — no citations, no reading lists, no paywalled papers; if you're leaning on a distinction from the literature, explain it in one sentence in your own words. And please mark honestly the steps where we're not really doing desert at all, we're doing incentives or deterrence or politics — I'd rather have that labeled as a values call than have it smuggled in as if it were a finding.

  Run the finished procedure on three of the cases above, including at least one where it gives an answer the board will push back on hard. Then tell me which single step is the weakest and where the whole thing will definately misfire on us.
reasoning: |-
  Hmm, the user is asking for a practical procedure to handle accountability in blameless postmortems. They're a backend engineer dealing with inconsistencies in "accountability notes" that get added to employee records. The core problem is moral luck - where outcomes change how people are judged despite similar actions.

  Key issues they're facing:
  1. Outcome bias - judging decisions based on results rather than context
  2. Asymmetric accountability - rewarding lucky risk-takers while punishing unlucky ones
  3. Personality factors - cautious vs cowboy engineers
  4. Timing/latency problems - near misses vs actual incidents
  5. Attribution challenges - who's responsible when multiple people are involved

  The user wants:
  - Step-by-step questions with clear criteria
  - Separation of decision quality from outcomes
  - Consistent treatment of reckless behavior regardless of results
  - Removal of credit for lucky successes
  - Handling of personality factors
  - Practical constraints (1hr/incident, no philosophy jargon)

  Important constraints:
  - Must work within existing HR/promo systems
  - Needs to handle their recurring pain points
  - No academic references
  - Must flag where system is about incentives vs "desert"

  For the solution, I'll design a concrete procedure with:
  - Fixed sequence of questions
  - Clear pass/fail thresholds
  - Explicit "no accountability" exit points
  - Distinction between factual analysis and values decisions
  - A trick to counter outcome bias (their "two notes" idea has merit but needs refinement)

  Critical elements to address:
  1. The outcome separation mechanism
  2. Handling reckless behavior uniformly
  3. Removing credit from lucky heroes
  4. Accounting for temperament without penalizing it
  5. Dealing with near-misses and timing issues

  I'll include sample applications to their cases, show where pushback will happen (likely around removing hero credit), and identify the weakest point (probably personality factors).
answer: |-
  Here's a concrete, step-by-step procedure called the **Decision Context Audit (DCA)**. It runs in **45 minutes** per incident, uses plain language, and directly addresses your pain points. Output is a structured accountability note with clear flags for moral luck cases.

  ---

  ### **Decision Context Audit (DCA) Procedure**
  *Timebox per step in [brackets]. Assign a facilitator (you) to enforce time.*

  #### **Step 0: Input Prep (Before Meeting)**
  - **Require**: Incident timeline, actions taken, decision points, and **known information at each decision point** (logs, monitoring, comms).
  - **Redact**: Outcomes, incident duration, and customer impact from all materials. Label: "Redacted Context Doc".

  #### **Step 1: Decision Identification [5 min]**
  - **Question**: *"Which specific human decisions (or deliberate non-actions) were potential contributors?"*  
    *(e.g., "Chose to skip QA review", "Merged during freeze", "Ignored alert X")*  
  - **Sufficient Answer**: List ≤3 key decisions with owner names. Reject vague claims ("team failure").  
  - **Exit**: If no clear decisions → **"NO ACCOUNTABILITY: Systemic issue"** and stop.

  #### **Step 2: Context Reconstruction [10 min]**
  - **Question**: *"What did the decision-maker know, see, or reasonably expect at the exact moment of the decision?"*  
  - **Sufficient Answer**: Bullet points from **Redacted Context Doc** only (e.g., "Dashboard showed normal latency", "No prior alerts on this service", "Policy doc v3 allowed hotfixes on Fridays").  
  - **Reject**: Hindsight ("But they should have known..."). If context is incomplete → **Flag: "Insufficient data for evaluation"**.

  #### **Step 3: Reasonableness Check [15 min]**
  - **Question**: *"Would a competent peer, given the same context, likely make the same decision?"*  
  - **Sufficient Answer**:  
    - **YES** → Proceed to Step 4.  
    - **NO** → **"Accountability: Professional judgment lapse"** (e.g., ignored clear policy/red flags).  
  - **How to judge**:  
    - Use your team's docs/runbooks as the standard.  
    - If no standard, ask: *"Would we train a new hire to do this?"*  
  - **Exit**: If YES → Go to Step 4. If NO → Write note and stop.

  #### **Step 4: Outcome Luck Filter [10 min]**
  - **Question**: *"Did the outcome change the reasonableness of the decision?"*  
  - **Method**: **Unredact the outcome**. Compare:  
    - If decision was "unreasonable" in Step 3 → Outcome irrelevant (note already written).  
    - If decision was "reasonable" in Step 3 → **Outcome is irrelevant**.  
  - **Output**:  
    - Outcome doesn’t change judgment → **"NO ACCOUNTABILITY: Reasonable decision, unlucky outcome"**.  
    - If outcome *reveals new context* (e.g., hidden risk), restart at Step 2 with new data.  
  - **Your trick**: This formalizes your "two notes" idea. The filter catches outcome bias.

  #### **Step 5: Values & Incentives Handoff [5 min]**  
  - **Question**: *"Does this require a policy change or incentive adjustment, not a person-focused note?"*  
  - **Sufficient Answer**:  
    - If latent risk exists (near-miss, reckless success) → **Flag for Leadership/HR: "Systemic risk: [describe]. Needs process fix."**  
    - If consistent behavior pattern (e.g., "cowboy") → **Flag for Manager: "Coaching opportunity: [behavior]. Not incident-specific."**  
  - **Human Judgment**: HR/EM owns response. DCA only flags.

  ---

  ### **Handling Your Specific Cases**
  #### **Case 1: Same Decision, Bad Outcome (Moral Luck)**  
  - *Steps 1-3*: Decision is "reasonable" (e.g., "Deployed config change during maintenance window").  
  - *Step 4*: Outcome bad → **"NO ACCOUNTABILITY: Reasonable decision, unlucky outcome"**.  
  - *Symmetry*: If outcome good (e.g., latency improved), same result → **no credit**.  

  #### **Case 2: Reckless Friday Deploy (No Incident)**  
  - *Step 1*: Decision = "Skipped QA review".  
  - *Step 2*: Context = "Deploy policy requires review".  
  - *Step 3*: **Unreasonable** (violated clear policy) → **"Accountability: Professional judgment lapse"**.  
  - *Note*: Same as if outage occurred. Outcome irrelevant.  

  #### **Case 3: "Hero" with Risky Hotfix**  
  - *Step 1-3*: If hotfix bypassed safeguards → **Unreasonable** → Accountability note (even if it worked).  
  - *Step 5*: Flag for leadership: "Rewarding bypassed procedures encourages risk".  

  #### **Case 4: Cautious vs. Cowboy Temperament**  
  - *Step 3*: Only evaluates *this decision*. "Cowboy" gets note only if *this* action was unreasonable.  
  - *Step 5*: If pattern exists → **Flag for manager** (e.g., "Frequent policy overrides observed. Coaching needed."). Not in accountability note.  

  #### **Case 5: Near-Miss or Latent Bug**  
  - *Step 1*: Decision = e.g., "Merged code without tests".  
  - *Step 2-3*: If tests were required → **Unreasonable** → Accountability note. Outcome irrelevant.  
  - *Discovery timing*: If context was identical when discovered vs. created → same accountability.  

  #### **Case 6: 3-Week Owner vs. 4-Year-Old Code**  
  - *Step 1*: Focus on **decisions during incident** (e.g., "Did not run diagnostic tool").  
  - *Step 3*: If tool was available → **Unreasonable**. If no tool/documentation → **"NO ACCOUNTABILITY: Inherited risk"**.  

  ---

  ### **Sample Run: Reckless Friday Deploy (No Incident)**  
  1. **Decision**: "Skipped QA review for latency fix deploy on Friday."  
  2. **Context**: "Deploy policy §2.1: 'All prod changes require QA review before Friday deploys.' Dashboard showed normal ops."  
  3. **Reasonableness**: **NO** (violated clear policy).  
  4. **Outcome Filter**: Outcome (latency improved) irrelevant.  
  5. **Accountability Note**: *"Professional judgment lapse: Bypassed mandatory QA review."*  
  6. **Values Flag**: *"Systemic risk: Successful policy violations may incentivize risk-taking. Review enforcement mechanisms."*  

  **Pushback**: HR/EM will object to "punishing success." **Response**: "The procedure separates decision quality from outcomes. Violating policy is unreasonable *regardless of result*. Flagged for *you* to handle incentives."  

  ---

  ### **Weakest Step & Failure Modes**  
  - **Weakest Step**: **Step 3 (Reasonableness Check)**.  
    - *Why*: "Competent peer" is subjective. Teams with poor documentation will argue endlessly.  
    - *Mitigation**: Use your runbooks as gospel. If none exist, DCA fails—demand docs first.  
  - **Where It Will Misfire**:  
    - **Politics**: Leadership overrides "no accountability" for visible incidents.  
    - **Values Conflicts**: When "reasonable" means "profitable" (e.g., skipping tests to hit a deadline). DCA flags this, but HR may ignore.  
    - **Temperament Bias**: Managers may still rate "cautious" engineers higher. DCA only isolates *incident-specific* accountability.  

  ---

  ### **Key Philosophy in Plain English**  
  - **Moral Luck**: Judging people based on random outcomes is unfair. DCA isolates what they *controlled*: their decisions given their context.  
  - **Desert vs. Deterrence**:  
    - DCA finds "desert" (what they deserve) only in **Step 3** (unreasonable decisions).  
    - **Step 5** hands off "deterrence/politics" (e.g., "We must discourage this even if reasonable").  

  **Output Format**:  
  ```markdown
  - Decision: [What they did]  
  - Context: [What they knew]  
  - Reasonableness: [Yes/No + why]  
  - Outcome Luck: [Did outcome change judgment?]  
  - Accountability: [None / Judgment lapse]  
  - Systemic Flags: [For leadership/HR]  
  ```  
  This forces transparency about what’s "fair" vs. what’s "policy."
