  Below is a self-contained example built to your specifications, with a concrete skin and exact arithmetic. All claims are verifiable by hand calculation.

  ### Concrete Scenario
  A small trading firm has $100,000 in working capital and 11 independent, even-opportunities next quarter. Each opportunity:  
  - Commit fraction \(f\) of **current** capital.  
  - With probability \(p = 0.6\), the stake doubles (gain \(f \times\) capital).  
  - With probability \(0.4\), the stake is lost (lose \(f \times\) capital).  
  No external cash flows; \(f \in [0, 1]\). Terminal wealth after 11 rounds:  
  \[
  W = 100,000 \times (1 + f)^k (1 - f)^{11-k},
  \]  
  where \(k\) (number of wins) is binomial \((n=11, p=0.6)\).  

  ### Verdicts via Exact Enumeration
  1. **Kelly stake (maximizes expected log growth)**:  
     - Optimizes: Expected log growth rate per round, \(G(f) = 0.6 \ln(1+f) + 0.4 \ln(1-f)\).  
     - Derivative: \(\frac{dG}{df} = \frac{0.6}{1+f} - \frac{0.4}{1-f} = 0\)  
       → \(0.6(1-f) = 0.4(1+f)\) → \(f = 0.2\).  
     - Result: \(f_{\text{Kelly}} = 0.2\), \(G(0.2) \approx 0.02014\)/round.  

  2. **Median-maximizing stake**:  
     - Median \(k\): Cumulative binomial probabilities:  
       - \(k \leq 5\): \(P = 0.2475\)  
       - \(k \leq 6\): \(P = 0.4683 < 0.5\)  
       - \(k \leq 7\): \(P = 0.7048 \geq 0.5\) → Median \(k = 7\).  
     - Median wealth: \(W_{\text{med}}(f) = 100,000 \times (1+f)^7 (1-f)^4\).  
     - Maximize \(\ln W_{\text{med}} = 7\ln(1+f) + 4\ln(1-f)\):  
       Derivative: \(\frac{7}{1+f} - \frac{4}{1-f} = 0\) → \(7(1-f) = 4(1+f)\) → \(f = 3/11 \approx 0.2727\).  
     - Result: \(f_{\text{med}} = 3/11\), \(W_{\text{med}} = 100,000 \times (14/11)^7 (8/11)^4 \approx \$151,000\).  

  3. **Expected-wealth-maximizing stake**:  
     - Optimizes: \(E[W] = 100,000 \times [0.6 \cdot 2 + 0.4 \cdot 0]^n f^0 + \cdots\) → Simplified:  
       \(E[W] = 100,000 \times [1 + f(2 \cdot 0.6 - 1)]^{11} = 100,000 \times (1 + 0.2f)^{11}\).  
     - Maximized when \(f = 1\) (all-in).  
     - Result: \(f = 1\), \(E[W] = 100,000 \times 1.2^{11} \approx \$743,000\).  

  ### Key Comparisons
  | Stake          | Criterion                     | Terminal Wealth Figure      |
  |----------------|-------------------------------|-----------------------------|
  | \(f = 0.2\)   | Expected log growth rate     | \(G \approx 0.02014\)/round |
  | \(f = 0.2727\)| Median wealth                | \(\approx \$151,000\)       |
  | \(f = 1\)     | Expected wealth              | \(\approx \$743,000\)       |

  - **Separation**: \(f_{\text{med}} > f_{\text{Kelly}}\) (0.2727 > 0.2).  
  - **Median wealth gap**: At \(f_{\text{med}}\): \$151,000; at \(f_{\text{Kelly}}\): \(100,000 \times 1.2^7 \times 0.8^4 \approx \$146,770\).  
    Difference: **+2.88%** (exceeds 2%, no ties/rounding).  

  ---

  ### (a) Walkthrough of Criteria  
  - **Kelly (expected log growth)**: Maximizes asymptotic growth rate. Selects \(f = 0.2\), yielding 2.014% expected log growth per round. Ignores finite-horizon effects.  
  - **Median terminal wealth**: Maximizes the 50th percentile outcome. Selects \(f = 0.2727\), yielding \$151,000. Tailors to specific horizon (\(n=11\)).  
  - **Expected terminal wealth**: Maximizes mean outcome. Selects \(f = 1\), yielding high expected value (\$743,000) but near-certain ruin (median = \$0).  

  ### (b) Feature Enabling the Divergence  
  **Hunch confirmed**: The median number of wins (\(k = 7\)) exceeds the mean (\(np = 6.6\)) due to left-skewed binomial distribution (\(p > 0.5\)). Kelly uses the mean \(k\) (implicitly), while median maximization uses the actual median \(k\).  
  - **General formula**: Median-optimal stake \(f_{\text{med}} = \frac{2m - n}{n}\), where \(m\) = median wins. Here, \(m = 7\), \(n = 11\) → \(f = 3/11\).  

  ### (c) Restoring Coincidence  
  **Increase to \(n = 100\)** (same \(p = 0.6\)):  
  - Mean \(k = 60\), median \(k \approx 60\) (symmetric by CLT).  
  - \(f_{\text{Kelly}} = 0.2\), \(f_{\text{med}} = \frac{2 \cdot 60 - 100}{100} = 0.2\).  
  - **Why**: Law of large numbers equalizes mean/median; skew vanishes.  

  ### (d) Assessment of the Divergence  
  - **Real disagreement**: Yes. Kelly optimizes long-run growth; median optimizes a specific horizon’s middle outcome.  
  - **Which to adopt?**  
    - **Kelly**: Superior for indefinite repetition (myopic, horizon-independent, compounds optimally).  
    - **Median**: Defensible for fixed horizons if the median is the relevant quantile (e.g., survival constraints).  
  - **Defense of Kelly lands**: Median maximization fails horizon-independence. Adding a 12th round changes the median \(k\) to 7.5 → optimal \(f\) shifts discontinuously. Kelly remains \(f = 0.2\) for any \(n\).  
  - **Limitation**: The gap is an artifact of finite \(n\) and skew, but this is relevant for small bets.  

  ### (e) Practical Implication  
  > For a firm with exactly 11 opportunities, maximizing median wealth (not growth) justifies a 36% larger stake than Kelly, boosting the median outcome by 2.9%—but sacrifices long-run growth potential (expected log growth drops from 2.014% to 1.69%/round).  

