    - Median wealth: \((14/11)^7 \times (8/11)^4 = (14^7 \times 8^4)/11^{11}\).  
    - All stakes derived analytically; no simulations.  

  ### Why Specifications Hold  
  - \(n=11 \leq 12\), \(p=0.6 \leq 0.65\), edge = \(2p-1 = 0.2\) (realistic).  
  - Explicit \(f_{\text{Kelly}} < f_{\text{med}} < f_{\text{expected}}\).  
