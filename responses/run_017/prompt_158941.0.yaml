prompt: |-
  I sit on the standing revision committee for our national diagnostic manual, and our terms of reference require us to weigh what Hacking called looping effects: a category can change the people it is applied to, who then change the category, so we have also to weigh whether we are recording a kind or making one. Our recent record: we added persistent bereavement disorder, over objections that grief was being medicalised, noting that it is bounded by an identifiable precipitating event, that two neighbouring manuals had used it for eight years with prevalence no longer climbing, that bereaved associations asked for it, and that without a code no treatment was reimbursed; we refused problematic news monitoring despite reported impairment, on the ground that the behaviour is near-universal in milder form, has no marker and no treatment of proven benefit, and that even a research listing would recruit the worried well; we added compulsive gaming although it is equally near-universal in milder form and equally markerless, saying that a decade of clinics and self-identification had already formed the kind and that we were recording it, not inaugurating it; and we added a severe premenstrual syndrome code after a decade of campaigning by patient organisations, over objections that it medicalises a normal cycle, while in the same revision we dropped the separate high-functioning autism code despite a petition from thousands of adults diagnosed under it, on the ground that attachment to a label is no reason to keep a category whose boundaries do not hold. We have also cited Hacking's account of fugue in the 1890s as our cautionary case.

  The proposal now in front of us is persistent sensory intolerance: clinically significant distress or avoidance triggered by ordinary sounds, textures or lights, lasting more than six months and not better explained by autism or an anxiety disorder. Our dossier says referrals have tripled in five years, that most self-referral now follows short-form video and symptom-checker sites, that clinicians report patients arriving with the draft criteria in their referral letters, that there is no biomarker and only two small uncontrolled trials of a sensory-integration protocol, that a large organised online community already uses the label, has its own vocabulary, and is lobbying for workplace and school noise accommodations — which in this jurisdiction can already be obtained through a general disability route without a diagnostic code — that an industry-funded sham-controlled trial will recruit only if a billable code exists, and that several neurodivergent advocacy organisations oppose inclusion as pathologising ordinary experience in people they say existing codes already cover.

  What should we decide if we want to be consistent with ourselves — full inclusion, research listing, or rejection — and which of our precedents is the closest analog? Which rule have we in fact been running: record kinds that already exist rather than make them, wait until a kind has settled before coding it, decide by what the code unlocks downstream, or defer to the wishes of those who would be classified? Show where those rules come apart on this case rather than where they agree, state what principle each of the three available decisions would commit us to, and name the one further piece of evidence or the one further proposal that would best tell the rules apart — bearing in mind that the stability evidence our earlier decisions relied on came from other manuals or from settled lay practice, and that here the evidence may only be available after we have acted.
reasoning: |-
  Okay, the user is part of a committee that revises a national diagnostic manual, and they're dealing with a proposal for persistent sensory intolerance. They've provided a detailed history of past decisions and need to determine a consistent approach. Let me start by understanding their precedents. 

  They added persistent bereavement disorder despite medicalization concerns because there was an identifiable event, other manuals had it with stable prevalence, patient groups wanted it, and reimbursement depended on it. They rejected problematic news monitoring because it's common in mild forms, lacks markers and proven treatments, and could recruit the worried well. They added compulsive gaming even though it's similarly common and markerless because clinics and self-identification had already established it. They also added severe PMS due to patient advocacy but dropped high-functioning autism because the category boundaries didn't hold, despite petitions.

  Now, the current proposal for persistent sensory intolerance has tripled referrals linked to social media and symptom checkers. Clinicians note patients arriving with draft criteria. No biomarker, only small uncontrolled trials. A large online community uses the label and lobbies for accommodations, which are already available without a code. An industry trial needs a billable code, but neurodivergent groups oppose it as pathologizing.

  The user asks which decision (include, research, reject) is consistent with their past actions and what rule they've been following. They also need the closest precedent, principles behind each decision, and key evidence to distinguish rules.

  First, identifying the closest precedent. Compulsive gaming seems similar: both involve common mild behaviors, no biomarkers, and pre-existing self-identification. But gaming had a decade of clinics; sensory intolerance's community is newer and driven by online activity. The rejection of news monitoring is also similar due to commonality and lack of markers, but news monitoring lacked patient advocacy and clinical infrastructure. Here, there's strong patient advocacy but opposition from neurodivergent groups. 

  The committee's implicit rule seems to be: include if the category is already socially established (gaming, bereavement) and provides necessary access (reimbursement, accommodations), but reject if it's not settled, lacks evidence, or risks harm (news monitoring). Dropping autism shows they prioritize valid boundaries over label attachment.

  For sensory intolerance, the online community exists but is recent and amplified by social media. Unlike gaming, there's no established clinical practice yet. Accommodations are available without the code, so the main benefit is enabling a trial. However, opposition from neurodivergent groups raises concerns about pathologization, similar to the bereavement medicalization worry but from affected communities.

  Consistency would lean towards rejection or research listing. Full inclusion might be premature without settled practice. Research listing could allow study without full endorsement, addressing the trial need but risking recruitment of the worried well.

  The key piece of evidence needed is whether the community's existence is organic or influenced by the committee's potential decision (looping). However, this evidence might only emerge after acting. An alternative is data on impairment distinct from existing disorders, but that's lacking.

  Principles: Inclusion commits to recognizing established patient-formed kinds; research listing creates a provisional category for study; rejection avoids premature medicalization. 

  The closest precedent is compulsive gaming in terms of self-identification but differs in maturity. The critical evidence is whether the community predates widespread awareness of the proposal, showing organic formation.
answer: |-
  Based on your committee's explicit principles and implicit operational rules demonstrated in past decisions, **rejection** is the most consistent outcome for persistent sensory intolerance, with **problematic news monitoring** as the closest analog. Here's the breakdown:

  ### Your Committee's De Facto Rules (and Where They Diverge Here)
  1.  **"Record, don't make kinds" (unless the kind is already socially/clinically solidified):** You added compulsive gaming *because* clinics and self-ID had already created the kind. You refused news monitoring *because* the "kind" was seen as artificial amplification of common behavior. **Divergence:** The sensory intolerance community *is* organized and self-identifying (like gaming), but its *explosive, media-driven growth and clinician-reported scripting* suggest it may be a *looping effect in active creation* rather than a settled kind (like news monitoring).
  2.  **"Require evidence of stability/validity OR overwhelming clinical/practical necessity":** You required stability (other manuals, stable prevalence) for bereavement disorder and clinical infrastructure for gaming. You rejected news monitoring due to lack of marker/treatment and risk of harm. **Divergence:** Sensory intolerance lacks stability evidence *within your system* (only recent surge), lacks biomarkers/robust treatment evidence (like news monitoring), and crucially, *the key practical need (accommodations) is already met* via general disability routes (unlike bereavement treatment reimbursement). The trial argument is weak (conditional benefit).
  3.  **"Avoid harm from medicalization unless benefits clearly outweigh":** You weighed medicalization concerns against tangible benefits (treatment access for bereavement, recognizing established need for gaming). You rejected news monitoring due to risk of recruiting the "worried well." **Divergence:** Strong opposition from neurodivergent groups highlights significant pathologization risk for experiences they see as normal variation. Unlike bereavement, where patient groups *requested* inclusion, here the affected community is divided, with established advocacy groups *opposing* it.
  4.  **"Boundaries must hold scientifically, not just by label attachment":** You dropped high-functioning autism *despite* patient attachment because boundaries weren't valid. **Divergence:** The proposal explicitly excludes cases "better explained by autism or anxiety," but neurodivergent groups argue it *is* part of those spectrums. This directly challenges boundary validity, reminiscent of the autism decision.

  ### The Closest Precedent: Problematic News Monitoring
  *   **Why:** Both involve:
      *   Near-universal experiences in milder forms.
      *   No biomarkers or validated treatments.
      *   Recent surge in reported impairment linked to media/online culture.
      *   Risk of iatrogenic harm/"worried well" recruitment.
      *   Absence of a unique, well-bounded clinical entity distinct from existing categories (anxiety, OCD traits).
  *   **Distinction from Compulsive Gaming:** Gaming had a *decade* of clinical infrastructure and self-ID *before* coding, suggesting a settled kind. Sensory intolerance's rapid, media-facilitated surge lacks this maturation period.

  ### Principles Embodied by Each Decision
  1.  **Full Inclusion:** Commits to the principle that **organized patient advocacy and self-identification, even if recent and media-influenced, are sufficient to define a valid clinical kind requiring recognition, and that potential benefits (enabling research, validating suffering) outweigh medicalization risks.** (This aligns most with your *compulsive gaming* decision, but ignores the instability and boundary concerns highlighted in *news monitoring* and *autism*).
  2.  **Research Listing:** Commits to the principle that **potential kinds under active formation/controversy warrant provisional status to *enable* the collection of evidence on validity, stability, and treatment, accepting the risk of initiating a looping effect as necessary for knowledge generation.** (This is a middle ground not strongly mirrored in your past decisions; *bereavement* relied on others' stability data).
  3.  **Rejection:** Commits to the principle that **a proposed category must demonstrate clear scientific validity (markers, distinct boundaries) OR established clinical/social solidification *prior* to coding, and that the risks of medicalizing common experiences and creating artificial categories outweigh the benefits when practical needs are already met and evidence is immature.** (This aligns strongly with *problematic news monitoring* and the *autism* boundary decision, and applies caution from the *fugue* example).

  ### The Critical Piece of Evidence & Proposal to Distinguish Rules
  *   **Evidence Needed:** **Data on the nature and history of the online community's formation.** Specifically: Did the community, its vocabulary, and reported experiences organically emerge *before* widespread discussion of the diagnostic proposal and media amplification, or is it demonstrably concurrent with/reactive to these influences? (This speaks directly to "recording vs. making").
  *   **Proposal to Distinguish Rules:** **A conditional research listing.** Propose *only* listing it for research purposes **IF** an independent study (e.g., ethnographic/sociological) can be funded *concurrently* to rigorously track the community's evolution, vocabulary adoption, and patient self-understanding *in relation to* the research criteria *during* the research phase. This makes the looping effect part of the studied phenomenon.
      *   *Supports Research Listing Rule:* Provides a mechanism to gather stability/validity evidence *and* explicitly study looping.
      *   *Supports Rejection Rule:* If such a study is deemed impractical, unethical (studying creation), or impossible to fund, rejection becomes the only prudent choice to avoid unmonitored looping.
      *   *Supports Inclusion Rule:* If the committee believes the community is already "real enough" regardless of origins, and the study is unnecessary bureaucracy, inclusion is justified.

  **Recommendation for Consistency:** Rejecting persistent sensory intolerance aligns best with your cautious application of Hacking's insights (like the fugue case) and your precedents of rejecting categories lacking validity, boundaries, stability, and unique clinical utility while posing medicalization risks (news monitoring, autism boundary issue). The rapid, media-linked surge, lack of mature clinical infrastructure, absence of biomarkers/treatments, met accommodation needs, and opposition from significant stakeholder groups all point towards rejection as the most consistent choice, prioritizing the avoidance of creating a potentially artificial and harmful category over the uncertain benefits of coding. The research listing option, while tempting, carries significant looping risks without the mitigating stability factors present in your other inclusions.
