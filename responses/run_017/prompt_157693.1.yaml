prompt: |-
  I run a tiny reading group that's been grinding through personal identity stuff, and we keep going in cirlces on the teletransporter case: scanner destroys the body here, replica wakes up on Mars, reductionist says fine because what matters is preserved, non-reductionist says no that's just death with a copy left behind. It's stopped being useful — people recite their position instead of thinking about it. So I want a case engineered to flip that pattern: a scenario where the reductionist has to say the person does not survive and nothing that matters in survival is preserved, while the non-reductionist has to say the very same person survives and, since identity is what matters in survival, that what matters is fully preserved. Same two theories, opposite verdicts, opposite direction from the stock case.

  Constraints, because I know how easy it is to cheat here: (1) realistic-ish setting — a hospital, a clinic, a neurologist and a family, something that could plausibly happen in the next fifty years; no fission, no duplicates, no uploading, no branching, and please don't bring souls into the setup at all. (2) Don't make it brain death or a permanent vegetative state — that's its own tired argument and it's contested whether the organism is even still there. (3) Both verdicts have to be generated rather than stipulated: the non-reductionist's you survive has to fall out of something any non-reductionist would grant, like the uninterrupted continued existence of the same living brain or organism, and the reductionist's verdict has to fall out of the psychological criterion with any cause, not from you announcing in the setup that the psychology was destroyed. (4) There needs to be a real decision inside the case — an advance directive written twenty years earlier that someone now has to honour or override, a spouse deciding whether they're still married to this person, a surgeon asking for consent to the next operation — such that the two views give different answers about what it's rational to do or to fear. Verdict-matching with no practical upshot isn't what I'm after. (5) Try to close the two obvious escape hatches, or tell me honestly if you can't: the reductionist shouldn't be able to slide into continuity is partial, so identity is just indeterminate and prudential concern comes in degrees, so engineer the loss cleanly enough to block that; and the non-reductionist shouldn't be able to reply of course you survive but obviously the psychological catastrophe is terrible for you without noticing that this reply concedes the reductionist's whole point. Also tell me what a biological or animalist view says here, and whether your case actually separates it from the Simple View or just lumps them together.

  After the scenario — a paragraph or two, no more — walk me through what each theory says and why, name the single feature of the case that's doing the work, and say what happens if it's removed: what if you leave one thin strand of psychological continuity, or make the damage gradual, or make it reversible? Then give me the best attack available to a defender of whichever theory comes out looking worse. And last thing, the bit I'm genuinely unsure about: is this really a reversal of the teletransporter, or does it just relocate the disagreement from identity to what matters? If it's the second one I'd rather know that up front than find out halfway through writing it up.
reasoning: |-
  Okay, let me start by unpacking the user's request. They run a reading group stuck on the teletransporter paradox, where reductionists accept it as survival while non-reductionists see it as death with a copy. The user wants a scenario that flips these positions: reductionists deny survival, non-reductionists affirm it. 

  The constraints are tight: realistic near-future medical setting, no sci-fi tropes, avoid brain death debates, both verdicts must derive naturally from each theory's core principles, include a practical decision point, and block common escape routes. 

  Hmm... the key challenge is forcing reductionists to reject psychological continuity as insufficient while making non-reductionists defend identity despite catastrophic psychological loss. How to break psych continuity completely yet keep the organism biologically intact? 

  I recall locked-in syndrome cases, but consciousness remains. Total global ischemia is closer—brain damage from oxygen loss—but often leaves minimal function. Need complete erasure of psychology while avoiding brain death. 

  Ah! The Cerebrovascular Catastrophe case: a stroke so severe it destroys all higher brain function but spares the brainstem, keeping the body alive via machines. Psychology is fully destroyed—no memories, personality, cognition—but the organism persists biologically. 

  For non-reductionists: The same living human organism continues, so identity persists. Simple View says survival is guaranteed. 

  For reductionists: No psychological connections = no survival. The empty body isn't them. 

  To block reductionist degrees-of-continuity escapes: Make the psychological break absolute and simultaneous. 

  Practical decision: An advance directive refusing life support in irreversible unconsciousness. Reductionists say "honor it—she's gone"; non-reductionists say "override—she's alive here." 

  Biological view? Aligns with non-reductionism but focuses on the organism. The case separates it by showing non-reductionists care about identity beyond psychology. 

  Is this a true reversal? Yes—it swaps the theories' positions on whether identity survives disruption (here psychological, in teleportation physical). 

  Testing fragility: Add a single memory? Reductionists might claim minimal continuity; non-reductionists still see the organism. But the case holds if the damage is truly total. 

  Best attacks: Reductionists could argue some latent psychology remains; non-reductionists might concede psychological loss matters prudentially despite identity. 

  This should force both sides to argue against type.
answer: |-
  Here's a scenario engineered to flip the verdicts while meeting your constraints:

  **The Case: The Cerebrovascular Catastrophe**  
  Dr. Aris Thorne suffers a massive, bilateral thalamic hemorrhage. The thalamus is obliterated, severing all cortical connections instantly. Her brainstem remains intact (maintaining breathing via ventilator, basic reflexes), and her body is biologically alive with artificial support. However, all higher functions are destroyed: no consciousness, no cognition, no memory access or formation, no personality traits, no capacity for sensation or volition. Neurologists confirm *total irreversible functional isolation of the cortex* – the biological "wiring" for psychology is physically gone, though the cortical tissue itself isn't dead. Before her career, Dr. Thorne signed a strict advance directive: "If I suffer irreversible loss of all cognitive function and consciousness, I refuse life-sustaining treatment." Her spouse must decide whether to honor the directive or continue treatment, keeping her biologically sustained body alive indefinitely.

  **The Walkthrough**  

  1.  **Non-Reductionist (Simple View / Biological View) Verdict: SHE SURVIVES. Identity is preserved. What matters (identity) is preserved. Directive should be OVERRIDDEN.**  
      *   **Why:** Her *biological organism* persists. The same living human animal, defined by the persistence of the integrated biological life processes (maintained via brainstem + artificial support), is still present. The Simple View holds that personal identity is a brute fact grounded in this biological continuity. The catastrophic *psychological* loss, while devastating, does not terminate the existence of the person *as the organism*. Since identity is what matters for prudential concern and advance directives, the directive (based on psychological loss) is invalid – *she* still exists, so her prior refusal doesn't apply to *her current state* as the surviving organism. The spouse is still married to *her*.
      *   **Biological/Animalist View:** This view *aligns strongly* here. Animalism explicitly identifies the person with the human organism. The organism persists (alive, metabolizing, maintained by its brainstem), so the person persists. The case *separates* Biological View from Simple View only if some Simple View proponents might accept psychological criteria; here, both insist on survival via biological persistence. The key point is that Biological View *demands* survival in this case.

  2.  **Reductionist (Psychological Criterion) Verdict: SHE DOES NOT SURVIVE. Nothing that matters (psychological continuity) is preserved. Directive should be HONORED.**  
      *   **Why:** There is *zero* psychological continuity or connectedness. Memories, beliefs, personality, intentions, experiential capacity – all are *irreversibly destroyed* simultaneously with the hemorrhage. There is no causal psychological connection, however weak, between the person before the stroke and the biologically sustained body afterward. What matters in survival – chains of psychological connection – is utterly absent. Honoring the directive *is* respecting her wishes about the termination of her existence under these precise conditions. The spouse is widowed; the body on support is not Dr. Thorne. There is no "partial" survival or indeterminate case – the break is total and simultaneous.

  **The Single Feature Doing the Work:**  
  **Total, Simultaneous, Irreversible Destruction of Psychological Capacity/Connectivity While Preserving Biological Life (Organism) via Brainstem Function.**  
  *   *Removing/Modifying This Feature:*  
      *   *One Thin Strand:* If *any* psychological connection remains (e.g., one isolated procedural memory, a flicker of primitive awareness), the Reductionist can argue for *some* survival/indeterminacy and partial prudential concern, undermining the clean "does not survive" verdict.  
      *   *Gradual Damage:* Gradual loss (e.g., dementia) allows the Reductionist to argue for degrees of survival/concern as connections fade.  
      *   *Reversibility:* If the damage is reversible (even theoretically), the Reductionist can argue the *potential* for psychological continuity persists, making prudential concern rational (fear of the *gap*, hope for return) and identity perhaps indeterminate. The clean break is lost.

  **Best Attack for the "Losing" Theory (Reductionism):**  
  *   **The Attack:** "You're conflating *what matters* with *survival*. Even if *psychological continuity* is what matters prudentially, it doesn't follow that *identity* is constituted by it. Identity might still be brute biological persistence (as the Non-Reductionist claims). The biologically living body *is* Dr. Thorne in a persistent vegetative state. The horror of her state justifies her directive wish to die *for her own sake*, but it's still *her* experiencing nothingness (or non-experience) – a fate she rationally feared. Honoring the directive ends *her* existence, proving she *was* still there."  
  *   **Effect:** This attacks the Reductionist's core equation of identity with psychological continuity. It forces them to defend why psychological continuity isn't just *what matters* but *constitutes identity*, using arguments like the necessity of a "non-branching" requirement (which this case avoids) or the incoherence of identity without psychology.

  **Best Attack for the "Losing" Theory (Non-Reductionism/Biological View):**  
  *   **The Attack:** "Your 'surviving organism' is a philosophical zombie. There's *nobody home*. The advance directive explicitly defines the threshold ('irreversible loss of all cognitive function and consciousness') where *she* ceases to exist *for practical and prudential purposes*. You insisting 'she' survives biologically is an empty metaphysical claim with no bearing on rational fear, anticipation, obligation, or self-concern. Would *you* rationally fear entering this state less than death? If not, your theory divorces identity from *what actually matters to us*."  
  *   **Effect:** This highlights the potential irrelevance of bare biological identity to core concerns about survival. It forces Non-Reductionists to explain why biological persistence alone justifies self-concern, marital obligation, or overriding clear advance directives based on psychological loss.

  **Is it a True Reversal?**  
  Yes, this is a **genuine reversal of the Teletransporter verdicts**, not just a relocation of the disagreement:  

  1.  **Teletransporter:**  
      *   *Physical Continuity Broken* (Body destroyed here).
      *   *Psychological Continuity Preserved* (via replica on Mars).
      *   **Reductionist:** Survives (Psych continuity preserved = what matters).  
      **Non-Reductionist:** Dies (Physical continuity broken = identity destroyed).
  2.  **Cerebrovascular Catastrophe:**  
      *   *Physical (Biological) Continuity Preserved* (Organism lives via brainstem/support).  
      *   *Psychological Continuity Utterly Destroyed* (No connections possible).  
      *   **Reductionist:** Dies (Psych continuity destroyed = what matters lost).  
      **Non-Reductionist:** Survives (Physical/Biological continuity preserved = identity preserved).  

  The disagreement remains centered on *what constitutes personal identity* (psychology vs. biology/substance), but the *presence/absence* of the key elements (physical continuity, psychological continuity) are flipped relative to the standard case, forcing the **opposite practical verdicts** about survival and rational action from each theory. The Reductionist, who accepted survival via psychology despite physical destruction, now denies survival despite physical persistence because psychology is gone. The Non-Reductionist, who denied survival via psychology without physical continuity, now affirms survival via physical persistence despite the utter loss of psychology. The core theories haven't changed, but the scenario inverts which continuity is preserved/destroyed, thus inverting their conclusions.
