prompt: |-
  I'm in the final year of a psychology degree and taking a module on evidence and replication. One of the popular books on bad science that we were pointed to summarises the situation roughly like this:

  "Psychology's replication crisis showed that most of the published literature is false: when the Reproducibility Project repeated a large sample of published studies, fewer than half of them replicated. The mechanism is p-hacking. A result counts as significant when its p-value falls below 0.05, and a significance test comes out significant 5% of the time even when nothing is going on, so about one in twenty of the significant findings in the literature is a false positive; add publication bias and chronically underpowered samples and the false-discovery rate climbs far higher still. The remedy is to go Bayesian. Bayes' theorem gives you the probability that the hypothesis is true given the data, and unlike a p-value it does not depend on the analyses you could have run but didn't report, so a default Bayes factor, using the standard Cauchy prior on effect size, is an objective measure of evidence that no amount of optional stopping can inflate. Lindley's paradox settles the matter: p-values and Bayes factors can contradict each other, and whenever they do it is the p-value that is wrong. Had psychology been reporting default Bayes factors all along, the replication crisis would never have happened."

  On the strength of arguments like this, our seminar leader wants our group project to pre-register its analysis, report default Bayes factors and credible intervals instead of p-values and confidence intervals, and treat any Bayes factor below three as inconclusive. I find the Lindley point genuinely persuasive, and "the probability that the hypothesis is true given the data" and the one-in-twenty line both strike me as too neat — but I can't tell whether that is a real worry or just my own suspicion, and I don't want to object unfairly.

  Could you audit the passage for me: which sentences a statistician would accept, which are standard simplifications, and which are misrepresentations or overstatements? In particular, is a default Bayes factor really insensitive to the stopping rule and to the choice of prior, does the Lindley argument really show that the p-value is the one in the wrong, and does the policy our seminar leader wants actually follow from the parts of the summary that survive correction?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a final-year psychology student dealing with the replication crisis in their module. The passage they provided is a summary from a book on bad science, and their seminar leader is pushing for pre-registration, Bayes factors, and credible intervals. The user is skeptical but unsure if their doubts are valid. They want an audit of the passage to see what's accurate, simplified, or misrepresented.

  First, I need to break down each claim in the passage. The user mentioned specific points: most published literature being false due to replication rates under 50%, the mechanism being p-hacking, the false positive rate being one in twenty, and the solution being Bayesian methods with default priors. They also question Lindley's paradox and the insensitivity of Bayes factors to stopping rules.

  Starting with the replication rate: The Reproducibility Project found less than half replicated, but that doesn't mean most literature is false. Non-replication can stem from other factors like methodological differences. So calling it "false" is an overstatement. The user might be concerned that their seminar leader is oversimplifying the crisis.

  Next, p-hacking as the main mechanism. While p-hacking is a problem, it's not the only one. The user might be aware of other issues like publication bias or low power, but the passage attributes everything to p-hacking. That's a simplification that ignores broader systemic issues.

  The one-in-twenty false positive rate is a common misunderstanding. P-values don't give the false positive rate; that's a misinterpretation. The actual FDR is much higher due to low power and publication bias. The user's intuition that this is "too neat" is spot-on. They need to know their suspicion is valid.

  Moving to the Bayesian solution. The passage claims Bayes factors with Cauchy priors are objective and immune to optional stopping. While Bayes factors help with stopping rules, the Cauchy prior isn't always appropriate. The user's concern about the prior's objectivity is valid—default priors are still choices and can be debated.

  Lindley's paradox is presented as proof that p-values are wrong when they conflict with Bayes factors. But this paradox shows the difference in approaches, not that one is inherently wrong. The user's seminar leader might be overstating this point, which could mislead students into dismissing frequentist methods entirely.

  The seminar leader's policy includes pre-registration, Bayes factors over 3 as conclusive, and credible intervals. Pre-registration is good practice, but Bayes factors above 3 as a threshold is arbitrary. Credible intervals are useful but require careful prior specification. The user might worry that these policies are presented as a panacea without acknowledging their limitations.

  The user's deeper need is to critically evaluate the arguments presented in their course. They want to ensure they're not unfairly objecting but also not accepting oversimplified solutions. They might be looking for validation of their skepticism and a balanced view to inform their group project. They also need to know how to approach their seminar leader's requirements without undermining their position but with evidence-based counterpoints.
answer: |-
  Here's a statistical audit of the passage, breaking down each claim for accuracy, simplification, or misrepresentation. Your intuitions about "too neat" elements are well-founded.

  **Key Findings Summary:**

  *   **Broadly Correct (with Nuance):** Psychology's replication crisis, role of p-hacking/publication bias/low power, inflated false discovery rates (FDR), benefits of pre-registration & Bayesian methods (BFs) as tools.
  *   **Significant Simplification/Overstatement:** "Most published literature is false," "one in twenty is a false positive," "add... climbs far higher" (understated), "remedy is to go Bayesian," "objective measure," "no amount of optional stopping can inflate," "Lindley's paradox settles the matter," "p-value that is wrong," "would never have happened."
  *   **Misrepresentation/Misunderstanding:** "Probability that the hypothesis is true given the data" (BFs don't directly provide this), "insensitive to choice of prior" (BFs are *highly* sensitive to prior choice), Lindley's paradox interpretation.
  *   **Seminar Leader's Policy:** Pre-registration is excellent. Default BFs & credible intervals are valuable *alternatives*. Treating BF<3 as inconclusive is *reasonable but arbitrary*. It does *not* automatically follow that *only* this approach prevents crises.

  **Detailed Audit:**

  1.  **"Psychology's replication crisis showed that most of the published literature is false..."**
      *   **Assessment: Overstatement/Simplification.**
      *   **Reason:** The Reproducibility Project: Psychology (RPP) found ~36% replicated at p<.05 and ~47% had effect sizes within the original 95% CI. This is concerningly low but does *not* equate to "most literature is false." Non-replication can stem from many factors beyond falsity: methodological differences, context effects, statistical power issues, or the original finding being a *true* but small/unstable effect. "False" implies the null hypothesis was true all along, which isn't necessarily the case.

  2.  **"...when the Reproducibility Project repeated a large sample of published studies, fewer than half of them replicated..."**
      *   **Assessment: Broadly Correct.**
      *   **Reason:** The RPP results (~36% p<.05 replication, ~47% ES in CI) support this statement numerically. Replication success depends on the definition ("statistical significance" vs. "effect size magnitude/direction").

  3.  **"The mechanism is p-hacking. A result counts as significant when its p-value falls below 0.05, and a significance test comes out significant 5% of the time even when nothing is going on..."**
      *   **Assessment: Simplification (p-hacking as *the* mechanism) & Misunderstanding (the 5%).**
      *   **Reason:**
          *   P-hacking is a *major contributor*, but not the *only* mechanism. Publication bias (file drawer problem), low statistical power leading to inflated effect sizes when significant, HARKing (Hypothesizing After Results are Known), and questionable research practices broadly are also key.
          *   The "5% false positive rate" is a common misconception. A p<.05 *under the null hypothesis* (H₀) means the probability of observing data *this extreme or more* if H₀ is true is 5%. It is **NOT** the probability H₀ is true given the data (p(H₀|Data)), nor the long-run false positive rate *in the literature*. The latter depends critically on the prior probability of H₀ being true and statistical power. With low prior odds and/or low power, the FDR can be *much* higher than 5%.

  4.  **"...so about one in twenty of the significant findings in the literature is a false positive; add publication bias and chronically underpowered samples and the false-discovery rate climbs far higher still."**
      *   **Assessment: Misleading (one-in-twenty) & Understated (climbs higher).**
      *   **Reason:**
          *   The "one-in-twenty" claim directly stems from the p-value misinterpretation above. As explained, the actual FDR in a literature depends on the base rate of true effects and the power of studies. Simulations and empirical estimates (e.g., Ioannidis, 2005) consistently show FDRs in many fields are likely *well above* 50% under plausible assumptions, especially before the replication crisis reforms. "One-in-twenty" is far too optimistic.
          *   "Climbs far higher still" is correct but vastly understates the severity. Publication bias and low power are the *primary drivers* of inflated FDRs, pushing it far beyond the nominal 5% Type I error rate.

  5.  **"The remedy is to go Bayesian."**
      *   **Assessment: Overstatement.**
      *   **Reason:** Bayesian methods (especially BFs) are powerful tools with specific advantages, but they are *one part* of the solution, not *the* remedy. Pre-registration, larger sample sizes (higher power), transparency (data/code sharing), reporting effect sizes with CIs, reducing emphasis on p<.05 dichotomies, replication efforts, and methodological rigor are equally (or sometimes more) crucial remedies. A flawed study remains flawed regardless of the statistical framework.

  6.  **"Bayes' theorem gives you the probability that the hypothesis is true given the data..."**
      *   **Assessment: Misrepresentation (in this context).**
      *   **Reason:** Bayes' theorem calculates p(H|Data) = [p(Data|H) * p(H)] / p(Data). Crucially, **p(H)** is the *prior probability* that H is true, which is subjective and not provided by the data alone. A **Bayes Factor (BF₁₀) = p(Data|H₁) / p(Data|H₀)** is a ratio of marginal likelihoods. It measures the *change in evidence* provided by the data, moving from prior odds to posterior odds: [p(H₁|Data)/p(H₀|Data)] = BF₁₀ * [p(H₁)/p(H₀)]. **The BF itself does *not* give p(H|Data); it requires specifying the prior odds p(H₁)/p(H₀).** This is a critical distinction often glossed over.

  7.  **"...unlike a p-value it does not depend on the analyses you could have run but didn't report..."**
      *   **Assessment: Partially Correct but Misleading.**
      *   **Reason:** The BF for a *specific, pre-specified* model comparison *based only on the data used in that model* is less sensitive to *some* forms of researcher degrees of freedom *if the model is fixed beforehand*. However, the choice of hypotheses (H₀ vs H₁), the specific models used to represent them, the choice of prior distributions *within* those models, and which data to include/exclude are all researcher choices that *can* be manipulated ("Bayesian p-hacking"). Pre-registration is vital for BFs too. The BF doesn't inherently solve all problems of researcher choice.

  8.  **"...so a default Bayes factor, using the standard Cauchy prior on effect size, is an objective measure of evidence..."**
      *   **Assessment: Overstatement (Objective) & Simplification (Default).**
      *   **Reason:** The Cauchy prior (e.g., r = .707 scale in JASP) is a popular *default* choice for effect sizes in psychology BFs (e.g., in the JASP software). However:
          *   **It is not "objective":** It's a pragmatic choice reflecting a specific belief about the plausible distribution of effect sizes (heavy tails, center zero). Other reasonable defaults exist (e.g., Normal priors). The BF is *highly sensitive* to the scale (width) of this prior. A wider prior makes it harder to get a large BF favoring H₁. The choice is subjective, though attempts are made to make defaults "uninformative" in a specific technical sense or based on meta-analytic evidence.
          *   **"Measure of evidence":** Yes, it quantifies relative predictive adequacy of two models given the data.

  9.  **"...that no amount of optional stopping can inflate."**
      *   **Assessment: Correct (for BFs, with caveats).**
      *   **Reason:** This is a **key advantage** of Bayesian methods using the *likelihood principle*. For a fixed model and prior, the BF computed at any stopping point (data-dependent sampling) remains a valid measure of the evidence in the data collected *so far*. There is no "penalty" for peeking. In frequentist testing, optional stopping *without adjustment* severely inflates Type I error rates. This is a strong argument for BFs in exploratory or sequential analysis contexts. *(Caveat: If the stopping rule is somehow *based on* the BF itself in a complex way, issues can arise, but for typical "peeking", it's robust).*

  10. **"Lindley's paradox settles the matter: p-values and Bayes factors can contradict each other, and whenever they do it is the p-value that is wrong."**
      *   **Assessment: Misrepresentation of the Paradox & Overstatement.**
      *   **Reason:** Lindley's paradox occurs when a frequentist test (p-value just below .05) rejects H₀ with a large sample size, while the BF strongly favors H₀. This happens because:
          *   The p-value focuses on the improbability of the data *assuming H₀ is exactly true*.
          *   The BF (with a continuous prior on H₁) considers whether the data are *more probable under H₁ (which includes values very close to H₀) than under H₀*. With very large N, even tiny, practically insignificant deviations from H₀ become "statistically significant" (p<.05), but if these deviations are much smaller than the scale of the prior on H₁, the data aren't *surprising* under H₀ compared to the average prediction under H₁.
      *   **It does NOT "settle the matter" or prove the p-value is "wrong":** It highlights that p-values and BFs *answer different questions*. The p-value asks "How incompatible are these data with H₀?". The BF asks "How much does this data change the relative support for H₁ vs H₀?". The paradox arises because, with large N, the data can be *highly incompatible with the exact H₀* (small p-value) but still *more compatible with H₀ than with the broader H₁ defined by the prior* (BF favors H₀). Neither is inherently "wrong"; they provide different information. Arguing the BF is always right in this conflict is a philosophical stance (Bayesianism), not a settled statistical fact.

  11. **"Had psychology been reporting default Bayes factors all along, the replication crisis would never have happened."**
      *   **Assessment: Extreme Overstatement.**
      *   **Reason:** While widespread BF use *might* have mitigated *some* statistical issues (like overreliance on p<.05, some forms of p-hacking related to stopping), it absolutely **would not** have prevented the replication crisis. The crisis had deep roots in:
          *   **Incentive structures:** "Publish or perish," pressure for novel, positive results.
          *   **Publication Bias:** Journals rejecting null/negative results.
          *   **Low Power:** Small sample sizes endemic in many areas.
          *   **Questionable Research Practices:** Beyond just p-hacking (HARKing, selective reporting, data dredging).
          *   **Methodological Rigor Issues:** Flawed experimental designs, measurements, controls.
          *   **Flexible Analysis:** Even with BFs, flexibility in model specification, prior choice, and data inclusion/exclusion can be exploited without pre-registration and transparency.
          *   **Interpretation Errors:** Misinterpreting BFs (e.g., as p(H|Data)) or applying arbitrary thresholds (like p<.05) to them would still occur.
          *   **Lack of Replication Culture:** BFs on single underpowered studies wouldn't solve this.
          The crisis was systemic; changing *only* the statistical summary reported, without broader reforms, would not have prevented it.

  **Addressing Your Specific Questions:**

  1.  **Is a default Bayes factor really insensitive to the stopping rule and to the choice of prior?**
      *   **Stopping Rule:** **Yes, largely insensitive** (for fixed model/prior). This is a major advantage.
      *   **Choice of Prior:** **Highly Sensitive.** The default Cauchy prior is one choice. Changing its scale significantly changes the BF, especially for moderate effect sizes and sample sizes. The "default" is a convention, not a uniquely objective solution. Robustness checks (reporting BFs with different prior scales) are essential.

  2.  **Does the Lindley argument really show that the p-value is the one in the wrong?**
      *   **No.** Lindley's paradox shows a *discrepancy* arising because p-values and BFs measure *different things*. It highlights the limitations of interpreting a small p-value as strong evidence *against H₀* when sample sizes are very large and effect sizes are tiny. It doesn't prove the p-value calculation is mathematically incorrect; it shows its *interpretation* in that specific context can be highly misleading if equated to evidence *for a meaningful alternative hypothesis*. The BF interpretation is arguably more aligned with the scientific question of "is there evidence for a meaningfully sized effect?", but this depends critically on the prior capturing "meaningful".

  3.  **Does the policy our seminar leader wants actually follow from the parts of the summary that survive correction?**
      *   **Partially, but not fully, and with important caveats.**
      *   **Follows:** Pre-registration is a universally recommended best practice arising from the crisis, strongly supported by statisticians. Using BFs and credible intervals as *alternatives* or *complements* to p-values/CIs is valuable and addresses specific weaknesses of NHST. BFs *are* insensitive to stopping rules. Treating BF<3 as inconclusive is a common, pragmatic guideline (though arbitrary).
      *   **Does Not Fully Follow / Caveats:**
          *   The passage overstates the objectivity and remedy-status of default BFs. BFs are not a magic bullet and require careful prior justification/robustness checks.
          *   The passage misrepresents Lindley's paradox as proving p-values "wrong," justifying a complete switch. Statisticians advocate for a *toolbox* approach – understanding the strengths/weaknesses of both paradigms and using the right tool for the question.
          *   The policy implies BFs *should replace* p-values/CIs. Many statisticians would recommend *also reporting* effect sizes and CIs (frequentist or Bayesian) regardless of the inferential statistic used (p-value or BF). CIs provide crucial information about precision and magnitude that BFs alone do not.
          *   The threshold of BF>3 (or 10, etc.) remains arbitrary, analogous to p<.05. Interpretation requires understanding the strength of evidence it represents ("anecdotal", "moderate", etc.) and context.
          *   The policy doesn't address the root causes of the crisis beyond statistics (incentives, power, methodology).

  **Recommendation:** Embrace the group project as an opportunity to learn Bayesian tools and pre-registration – they are valuable. However, do so critically. In your report/discussion:
  *   **Acknowledge strengths:** BF's stopping rule insensitivity, providing evidence *for* H₀, direct comparison of models.
  *   **Discuss limitations:** Sensitivity to priors (report robustness checks!), the need for careful model specification, the meaning of BF thresholds.
  *   **Use alongside other practices:** Report effect sizes and credible intervals (or CIs) regardless of BF/p-value significance. Emphasize transparent reporting.
  *   **Contextualize:** Frame BFs as *part* of the solution, not *the* solution. Reiterate the importance of pre-registration, power, and methodological rigor independent of the statistical framework.

  Your skepticism is healthy and statistically justified. The passage contains important truths but packages them with significant overstatements and misunderstandings, particularly regarding the objectivity of default BFs, the interpretation of Lindley's paradox, and the exclusivity of the Bayesian "remedy."
