prompt: |-
  I'm in a tiny reading group on animal minds — half philosophy grad students, half vet students — and we keep running into the same thing, and I don't have a word for it. Here's the shape of it. We read a paper where crabs with a damaged claw kept grooming the injured area for ages, gave up a shelter they normally liked in order to avoid a place where they'd been shocked, and stopped acting like that when they were given a local anaesthetic. The authors concluded that this is consistent with nociception and doesn't show that the animal is in pain. But in the same week someone brought in a case study of a dog doing a quarter of that and nobody hedged at all — the dog was described as being in pain, full stop. Then with fish it happened again: a fish given something noxious stops doing its usual things, rubs the spot, changes what it'll swim through, and the changes go away if you give it the same drugs we'd call painkillers; and the response from the skeptic in our group was that it's all reflexes and that fish don't have the brain structures that consciousness requires — except the structures he named were mammalian ones, which seems like it settles the question by definition rather than by evidence. What I keep noticing isn't that people are sceptical. It's that identical behavioural evidence gets treated as strong in one animal and as almost nothing in another, and the difference never seems to come from the evidence.

  And when you push on it, the person never says what would be enough. I've started asking directly — what would you accept as evidence that a shrimp, or a bee, or a fish, is conscious? — and I get one of two answers: either a shrug and "it's a hard problem, we don't have a test yet", said by someone who keeps arguing as if the answer were no, or a demand for something that couldn't possibly be evidence for anything, like a report from the animal itself, or a neural signature that has already been matched against a human one. And that second one is the bit that interests me most, because if the extra ingredient you're asking about makes no difference to what the animal does or how its behaviour is organised, then no amount of behaviour was ever going to count, and the demand isn't really a demand for evidence. One of the vet students says I'm overthinking it and this is just Bayesian: if you start with a strong prior that mammals feel pain and insects don't, the same evidence rationally moves you different amounts and there's nothing wrong with that. I half believe her, but it doesn't feel like the whole story, because nobody in these arguments owns the prior — they present the asymmetrical treatment as a judgment about how good the evidence is. I've also been told it's just speciesism, but that's a moral accusation and I'm asking about what's going on in the reasoning. And I half remember a word beginning with anthropo- for refusing to see mental states in animals (anthropodenial? I might have that wrong) but that seems like a knee-jerk attitude, whereas what I'm describing is careful, argued, and sometimes right. The thing that makes me think it's a real pattern and not just me being annoyed is the parallel I read about, unless I'm misremembering it, where patients diagnosed as unresponsive were later found, using brain scanners, to be able to follow instructions — same structure, same refusal, and there it turned out to be an actual mistake with stakes.

  So: does this have a name, or a literature, or is it just three or four different things I'm lumping together? I don't want a bare label — I want the carving. Roughly: what exactly is the phenomenon (or phenomena), what is it not, and where are its edges? If there's an established concept that nearly fits, tell me how what I described differs from it and whether the fit is good enough anyway; if the nearest concepts are several, say which fits which of my cases. If there's genuinely nothing, coin something for me and define it tightly enough that I could tell whether a given case is an instance, including the awkward cases — like the AI version, where the same move happens in the other direction and every bit of behaviour gets explained away as pattern-matching, or the case where the sceptic turns out to have been right. And tell me whether it's a mistake at all, or just what good reasoning looks like when the prior is doing the work. Anway, one more thing: please flag which parts of your answer are uncontroversial among people who actually work on this, which are one side of a live dispute (the fish-cortex thing, the insect thing, the whole methodology of inference here), and which are just your own take — I don't want to walk into the group on Tuesday repeating a contested position as though it were the consensus, so say how confident you are in each bit.
reasoning: |-
  Okay, let me try to unpack this user's query. They're part of a reading group on animal minds, mixing philosophy and vet students. The core issue is how identical behavioral evidence is treated differently across species—like crabs or fish showing pain-like behaviors being dismissed, while similar actions in dogs are accepted as pain without question. 

  First, I need to pinpoint the exact phenomenon. The user notices a double standard in evaluating evidence: mammals get a pass, invertebrates and fish face higher skepticism. Even when behaviors are functionally identical, the burden of proof shifts. The user pushed for what would count as evidence and got vague answers or impossible demands, like verbal reports. That suggests the skepticism isn't evidence-based but rooted in prior assumptions.

  The user mentioned Bayesian reasoning as an explanation—strong priors leading to different evidence weighting. But they feel it's incomplete because participants frame it as evidence quality, not prior beliefs. They also brought up anthropodenial, which is relevant but might not capture the methodological asymmetry. The comparison to misdiagnosed unresponsive patients highlights real-world stakes.

  Now, key concepts come to mind:
  1. **Anthropodenial**: Denying human-like traits in animals, but here it's selective. Mammals are exempt, so it's not blanket denial.
  2. **Burden of Proof Asymmetry**: The default assumption varies by species. For dogs, pain is presumed; for crabs, absence is presumed. This aligns with Bayesian priors but becomes problematic when unacknowledged.
  3. **Human-Neural Chauvinism**: Requiring homologous brain structures (like mammalian cortex) as necessary for consciousness. This is circular, especially when applied to non-mammals.
  4. **Criterion Problem**: Demanding evidence that's impossible for certain species (e.g., verbal reports), making the standard unfalsifiable.

  The user wants to know if this is one phenomenon or several. It's a cluster: the burden of proof asymmetry is central, exacerbated by neural chauvinism and shifting criteria. The vet student's Bayesian point is valid but insufficient because the priors aren't justified transparently. 

  The user also needs clarity on what's contested. For example, whether fish feel pain is debated, but the inconsistency in evidence evaluation is the real issue. The AI parallel shows the same skepticism toward non-biological entities. 

  In structuring the response, I'll define the core phenomenon, differentiate related concepts, address edges like justified skepticism, and note controversies. Highlighting that the asymmetry itself is the problem, regardless of actual consciousness in each species. Confidence levels: burden shift and neural chauvinism are well-documented; the criterion problem is inferred from the user's examples.
answer: |-
  Your description captures a coherent and well-documented phenomenon in cognitive ethology and philosophy of mind. Below is a precise conceptual carving, grounded in established literature, with clear boundaries, edge cases, and confidence markers.

  ---

  ### **Core Phenomenon: Differential Burden of Proof (DBP)**  
  **Definition**: The systematic imposition of higher evidentiary standards for attributing mental states (e.g., pain, consciousness) to certain taxa (e.g., invertebrates, fish) compared to others (e.g., mammals), *despite functionally equivalent behavioral or neurobiological evidence*.  

  #### **Key Characteristics**  
  1. **Asymmetric Evidentiary Thresholds**:  
     - Identical evidence (e.g., injury avoidance + anesthetic relief) is accepted as sufficient for mammals but deemed "merely reflexive" or "inconclusive" for non-mammals.  
     - *Not* Bayesian updating alone, as participants frame it as an *objective* evaluation of evidence quality, not prior-driven caution.  

  2. **Shifting Goalposts**:  
     - When pressed, skeptics demand evidence that is:  
       - **Logically impossible** (e.g., verbal reports from non-verbal species),  
       - **Anatomically chauvinistic** (e.g., requiring mammalian neural structures in animals with divergent neurobiology),  
       - **Functionally irrelevant** (e.g., demanding proof that pain "feels like" human pain, despite pain's functional role in avoidance learning).  
     - *This violates the principle of "same cause, same effect" in scientific inference*.  

  3. **Hidden Presumptions**:  
     - Assumptions that consciousness *requires* specific neural substrates (e.g., cortex) are treated as axiomatic, not testable hypotheses.  
     - Priors are rarely acknowledged or justified biologically (e.g., why a cortex is necessary vs. convergent evolution of function).  

  #### **What DBP Is Not**  
  - **Not mere skepticism**: Healthy skepticism demands *consistent* standards. DBP applies standards unequally.  
  - **Not Bayesian priors alone**: Priors are defensible if explicit and empirically grounded (e.g., "cephalopods lack centralized pain processing"). DBP occurs when priors are covert and inflexible.  
  - **Not anthropomorphism**: Attributing human-like states to animals isn't the issue; it's *resisting* such attribution despite evidence.  

  ---

  ### **Related but Distinct Concepts**  
  1. **Anthropodenial** (coined by Frans de Waal):  
     - *Definition*: Rejection of continuity between human and animal mental traits.  
     - *Fit*: Explains *why* DBP occurs but is broader. DBP is a *methodological manifestation* of anthropodenial in evidentiary practice.  
     - *Confidence*: Uncontroversial term; de Waal’s work is influential in primatology.  

  2. **Human-Neural Chauvinism**:  
     - *Definition*: Treating human/mammalian neuroanatomy as necessary for consciousness.  
     - *Fit*: A *driver* of DBP (e.g., "fish lack a cortex, so can’t feel pain"). Ignores functional equivalence (e.g., fish pallium processes pain similarly).  
     - *Confidence*: Contentious. Key dispute: Nagel’s "what is it like to be?" vs. functionalist views (e.g., Dennett).  

  3. **Criterion Problem**:  
     - *Definition*: No consensus on what evidence counts for consciousness in non-humans.  
     - *Fit*: Enables DBP by allowing skeptics to dismiss behavior as "just reflexes."  
     - *Confidence*: Uncontroversial; acknowledged in animal cognition literature.  

  ---

  ### **Edge Cases & Boundaries**  
  - **Justified DBP?**  
    - If a species lacks nociceptors, higher skepticism *is* rational. But in your cases, neurobiology is analogous (e.g., crustacean opioids reduce "grooming pain").  
    - *Edge*: DBP is unjustified when behavioral/neurobiological homology exists (e.g., fish opioid receptors respond to analgesics like mammals’).  

  - **When the Skeptic is Right**:  
    - DBP isn’t refuted if an animal *lacks* consciousness, but if the *reasoning* uses asymmetrical standards. Example: Bee "pain" might be disproven by neural evidence, but not by dismissing identical avoidance learning accepted in dogs.  

  - **AI Analogy**:  
    - Identical to invertebrate DBP: "It’s just algorithms, not *real* understanding!" despite passing Turing tests. Highlights DBP’s core: requiring human-like implementation.  

  - **Medical Parallel**:  
    - Your "unresponsive patients" example is **Diagnostic Overshadowing**: Attributing behavior to low cognition (e.g., "vegetative state") while ignoring evidence (e.g., neural activity). Same structure as DBP.  

  ---

  ### **Is This a Mistake? Consensus & Controversy**  
  | **Aspect**                          | **Consensus Level**               | **Notes**                                                                 |
  |-------------------------------------|-----------------------------------|---------------------------------------------------------------------------|
  | **DBP exists**                      | Uncontroversial                  | Documented in animal ethics literature (e.g., Birch on invertebrates).    |
  | **It’s problematic**                | Near-consensus                   | Violates scientific parsimony (Lloyd Morgan’s canon misapplied).          |
  | **Neural chauvinism is flawed**     | Contentious                      | **Dispute**: Proponents (e.g., Key) argue cortex is necessary; opponents (e.g., Seth, Barrett) emphasize computational functions. |
  | **Behavior alone can suffice**      | Highly contentious               | **Dispute**: Neo-behaviorists (e.g., Shettleworth) vs. phenomenologists (e.g., Tye). |
  | **Bayesian defense**                | Partially accepted               | Priors *can* be rational (e.g., complexity gradients), but must be explicit and updatable. DBP often reflects *unrevisable* priors. |

  ---

  ### **Your Cases Mapped**  
  1. **Crab pain vs. dog pain**: Classic DBP + neural chauvinism (crustacean vs. mammalian neurobiology).  
  2. **Fish pain skepticism**: DBP driven by human-neural chauvinism (cortex requirement).  
  3. **"What would suffice?" responses**: Shifting goalposts (criterion problem).  

  ---

  ### **Why "Differential Burden of Proof" Fits Best**  
  - **Precision**: Targets the *evidentiary asymmetry* without moralizing (unlike "speciesism").  
  - **Scope**: Covers all your cases (crabs, fish, AI) and the medical parallel.  
  - **Literature**: Grounded in:  
    - Birch’s work on [invertebrate consciousness](https://academic.oup.com/book/26771) (methodological criticism).  
    - Key & Brown’s [fish pain debate](https://royalsocietypublishing.org/doi/10.1098/rspb.2019.0369) (highlighting shifting standards).  
    - Nagel’s "What is it like to be a bat?" (anthropocentric limits).  

  **Coinage Clarification**: DBP is established implicitly; naming it explicitly aids analysis. For your group: Frame it as, **"Why do evidentiary standards shift across taxa?"** This avoids jargon while targeting the asymmetry.  

  ---

  ### **Recommendation for Discussion**  
  - **Do**: Challenge inconsistent standards: "If this behavior in a dog implies pain, why not in a crab? What specific *functional* difference justifies treating the evidence differently?"  
  - **Avoid**: Charging "speciesism" – focus on epistemic inconsistency.  
  - **Cite**: Birch (2022) on "[confidence thresholds](https://philpapers.org/rec/BIRSCA-3)" for animal consciousness.  

  This phenomenon is a recognized methodological pitfall – not merely annoyance, but a substantive critique in science and philosophy.
