  Alright, the user is a first-year PhD student in political science who's TAing a formal theory section. They struggled to explain two variants of the Condorcet Jury Theorem (CJT) assumptions to a student and want clarity. Let me break down their concerns.

  First, they mentioned a scenario where voters can choose to become informed at a cost. Since pivotality decreases with group size, fewer people invest in being informed. The user wants to know if per-voter accuracy might decay fast enough that the group's accuracy doesn't approach 1, or even peaks and declines. They're asking about the threshold where the decay rate (like 1/sqrt(n) vs. faster) affects asymptotic reliability. I recall that in models with endogenous information acquisition, if the cost is too high or the benefit too low, participation drops. The decay rate matters here: if accuracy's gap above 0.5 shrinks slower than 1/sqrt(n), CJT holds; faster, and it fails. There might be an optimal group size where accuracy peaks before declining. Need to confirm that.

  Second, they're concerned about dependence due to a public signal, like a straw poll. They question whether this shared informative signal is different from common biases. The user is unsure if dependence always harms accuracy or if the nature of dependence matters. Also, when voters follow the straw poll over their private signal, does that hurt the group? Underlying this is confusion about whether CJT is a claim about majority rule's absolute reliability or just comparative against a single voter. 

  The user’s deeper needs: They want to understand the limitations of CJT beyond textbook assumptions. They suspect the theorem is narrower than popularly presented, especially in real-world applications where voters strategize or share information. They’re also pushing back against the idea that CJT is a straightforward argument for democracy, implying they need a nuanced critique.

  For the first variant, key points are the decay rate of accuracy and the existence of an optimal group size. For the second, distinguishing between informative and misleading dependence is crucial. The theorem assumes independence, so any dependence breaks it, but shared informative signals might still lead to good outcomes if aggregated correctly. However, herding can suppress private info, potentially harming accuracy. Also, CJT is absolute (asymptotic correctness) in its classical form, but extensions show that majority rule is optimal under certain conditions, which might not hold here.

  Need to address both scenarios clearly, highlight thresholds for decay rates, and explain how dependence alters outcomes. Emphasize that CJT’s conclusions rely on strict independence and identical competence, which real-world mechanisms can undermine. The user’s skepticism about CJT as a pro-democracy argument is valid—context matters, and strategic behavior can negate the benefits of large groups.
answer: |-
  The asymptotic Condorcet Jury Theorem (CJT) fails if per-voter accuracy decays too rapidly with group size, and shared public signals break the independence assumption, fundamentally altering voter behavior and potentially harming group accuracy—but the nature of the dependence matters critically. Here’s the breakdown:

  1.  **Endogenous Information Acquisition:**  
      If voters decide whether to become informed based on pivot probability (which decays as 1/√n), and the cost of information is non-trivial:
      *   **Per-voter accuracy decays.** The gap δ(n) = p(n) - 0.5 shrinks as n increases because fewer voters pay the cost.
      *   **The decay rate determines the outcome:**
          *   If δ(n) decays *slower* than 1/√n (e.g., δ(n) ∝ 1/n^{0.49}), CJT holds asymptotically: P(majority correct) → 1.
          *   If δ(n) decays *faster* than 1/√n (e.g., δ(n) ∝ 1/n^{0.51} or 1/n), CJT fails. P(majority correct) converges to 0.5.
          *   If δ(n) decays *exactly* like c/√n, P(majority correct) converges to Φ(2c√(2/π)) > 0.5 but <1 (Φ is the normal CDF).
      *   **Optimal Group Size:** Yes, group accuracy often peaks at a finite n. Adding voters *reduces* accuracy beyond this point because the marginal voter’s contribution (slightly increasing the chance a barely-informed majority is correct) is outweighed by the drop in average competence. This peak occurs when the decay in p(n) outweighs the statistical power of adding more signals.

  2.  **Public Signals (Straw Polls) & Dependence:**
      *   **Independence Assumption:** CJT requires *statistical independence* of votes conditional on the state. Any dependence breaks the standard binomial proof. The *source* matters for the result, not the assumption.
      *   **Informative Public Signal:** A genuinely informative public signal (e.g., an initial vote tally) *creates positive correlation* among votes. Voters rationally update their beliefs using both the public signal and their private signal.
      *   **Herding vs. Information Aggregation:** If the public signal is strong (lopsided), voters with weak private signals may "herd" and follow it, disregarding their own information. This:
          *   **Harms Accuracy:** Valuable private information is lost. Group accuracy can be *lower* than if they voted sincerely based only on private signals or only on the public signal. The group fails to aggregate diverse information effectively.
          *   **Is a Distinct Failure Mode:** Unlike the decay in competence from free-riding (Point 1), this is a failure of the voting mechanism to elicit and utilize dispersed information due to strategic voting under common knowledge.
      *   **Dependence Type Matters:** Positive correlation from a *good* public signal isn't the same as correlation from a *common bias* (e.g., a misleading headline). The first reflects rational updating on a useful signal; the second reflects systematic error. Both break CJT's independence, but their *impact* on P(majority correct) differs: the good signal might still lead to high accuracy (just not via the CJT mechanism), while the common bias can lock in systematic errors regardless of n.

  3.  **What Claim is CJT Making?**
      *   **Absolute Claim (Under Assumptions):** The classical CJT is an absolute claim: under i.i.d. signals with p > 0.5, majority rule becomes *arbitrarily reliable* (P(majority correct) → 1) as n → ∞. It’s not just comparative.
      *   **But Inputs Aren't Exogenous:** Your variants highlight the flaw in treating competence (p) and independence as fixed. Voting rules and group size *influence* voter behavior (effort, strategy), changing p and creating dependence.
      *   **The "Argument for Democracy" is Fragile:** Your econ friend is too quick. CJT shows large groups *can* be highly competent *if* voters are independently competent. Your scenarios show this "if" is non-trivial. Effort decay can make large groups no better than random (Point 1), while public signals can make strategic voters worse information aggregators than a small group voting sincerely (Point 2). CJT defines an ideal; it doesn't guarantee real-world voting achieves it.

  **Bottom Line on Your Questions:**  
  1.  **Yes, accuracy can decay fast enough to kill CJT (faster than 1/√n) and cause an optimal finite group size.**  
  2.  **Dependence from public signals breaks CJT independence, induces herding, harms accuracy by suppressing private info, and is distinct from common bias dependence; CJT makes an absolute reliability claim contingent on fixed i.i.d. inputs, which the voting process itself can undermine.**
