prompt: |-
  Hey — first-year PhD student in poli sci here, TAing the undergrad formal theory section this term, and after class on Tuesday a student asked me something I gave a hand-wavy answer to and have been feeling bad about since. So: I get the standard Condorcet setup — n voters, each independently correct with the same probability slightly above one half, majority rule, the chance the majority is right climbing toward 1 as the group grows, and the whole thing flipping the other way if that per-voter accuracy dips below one half. I can sketch the binomial argument myself, so please don't spend your answer restating it. The part I couldnt explain well is what the assumptions are actually doing, and I've got two variants I keep turning over that make me think the result is a claim about something narrower than people take it for.

  First: in the toy version I put on the board, everyone's accuracy is just handed to them by assumption. But suppose being right takes work — each juror can either pay a small cost (read the brief, sit through the hearing) and end up right with probability around 0.6, or skip it and vote on vibes, which is right only barely more often than a coin flip. Voters know the size of the group, know they only matter if they're pivotal, and pivotality gets less likely as n grows, so the share who bother to inform themselves falls as the group gets bigger. Now per-voter accuracy is a function of n, and if it decays toward one half fast enough the asymptotic conclusion has to die — but how fast? Is there a threshold rate, something like the gap above one half shrinking on the order of one over root n versus shrinking faster than that, where majority rule stops being arbitrarily reliable and instead settles at some accuracy strictly between one half and 1? Or does it even peak at some finite group size and then decline, so that adding voters past a point makes the group worse? I care more about the shape of the answer than a formula, but I do want to know where the cliff is.

  Second, and this is the part that really lost me: suppose that before the official vote everybody sees a public straw poll of some subset of the voters. Now the votes obviously aren't independent, and the move everyone makes is to say, well, then Condorcet just doesn't apply. But I'm not sure that's the right thing to say, because the dependence here comes from a shared look at something genuinely informative, and that feels different in kind from dependence that comes from everyone making the same mistake — a shared bad heuristic, a common misleading headline, everyone deferring to the same confident guy in the room. Does the independence assumption care about that difference, or is dependence just dependence as far as the result is concerned? Related: when a voter sees a lopsided straw poll and goes along with it instead of with their own private signal, are they doing something that hurts the group's accuracy, and is that the same failure mode as the first one or a different one? And underneath all of it I'm not even sure what kind of claim the theorem is making: is it a claim about how reliable majority rule is, full stop, or only a comparative one — majority beats a randomly chosen single voter, or beats a dictator — conditional on inputs that the voting rule itself helps produce? My friend in the econ department thinks the whole thing is definately just a math-y argument for democracy and I think that's too quick, but I can't say exactly where.

  Please lead with your bottom line in the first sentence and then give the reasoning — no preamble, no restating my question. And if one of these two setups is ill-posed, or the question rests on me misunderstanding what the theorem assumes, or there just isn't a clean answer to one part, tell me that plainly instead of humoring me; I'd rather be corrected than handed a tidy story. No citations or further reading, I can look up papers on my own.
