prompt: |-
  Me and my roomate had a two-hour argument last night — he's a CS PhD student — and he kept shutting me down with the same line: anything that can be computed at all can be computed by a Turing machine. I said quantum computers do things classical ones can't, and he said that's just about speed, not about what's computable in principle. Then he said it isn't even a live conjecture: Turing machines, lambda calculus and general recursive functions all pick out the same class of functions, so the Church–Turing thesis has been proved.

  I think both of us were hand-waving. Can you lay out the different precise things that one sentence could be claiming — as a definition of what "computable" means, as an empirical claim about what a human being with pencil and paper could do, as a claim about any machine or physical process we could ever build, and whatever the strongest version is (something about the universe itself being a computation?) — and for each one say whether it's trivial, substantive but plausible, or just false, and whether it's even the kind of thing that could be proved. Then tell me which of those readings would actually get him his two conclusions: that quantum computers aren't a counterexample, and that the equivalence of all those formalisms settles the matter.

  Give it to me as a list of readings with verdicts that I can paste at him. Lead with your bottom line in the first sentence, then the reasoning — no preamble, and don't restate my question back to me.
reasoning: |-
  Alright, the user and their CS PhD roommate had a heated argument about whether quantum computers can do things classical computers can't. The roommate insists that Turing machines can compute anything computable, so quantum computers only offer speedups, not new capabilities. The user thinks both were hand-waving and wants a clear breakdown.

  First, I need to address the core of the roommate's argument: the Church-Turing thesis. He claims that since formal systems like Turing machines, lambda calculus, and recursive functions are equivalent, the thesis is proven. But is that accurate? The equivalence of these formalisms shows they define the same class of functions, but that doesn't prove the thesis itself, which is about capturing all intuitively computable functions. That's a crucial distinction. The thesis remains a hypothesis because it bridges formal systems and human computation.

  Next, quantum computing. The roommate says it's only about speed. But is that true under all interpretations? Under the formal equivalence (Reading A), yes, since both classical and quantum compute recursive functions. But Reading C (physical computability) might challenge this. BQP problems like factoring are in NP, so they're classically computable but inefficiently. Shor's algorithm is fast but doesn't solve uncomputable problems. So quantum doesn't expand computability in the formal sense, supporting the roommate there.

  But what about physical processes? If hypercomputation (like analog chaos) were possible, it might compute beyond Turing machines. But current physics, including quantum mechanics, hasn't shown this. So Reading C is unsettled. The roommate's dismissal of quantum as a counterexample holds for formal computability but not necessarily for physical limits.

  The user wants a list to "paste at him." So structuring each reading clearly: definitions, status, whether it proves the roommate's points. Highlighting where quantum isn't a counterexample (Readings A and B) but noting the physical aspect (Reading C) is where it's murky. Emphasizing that equivalence of formalisms (Reading A) is proven but doesn't settle empirical or physical claims.

  Also, the roommate conflated the equivalence with proving the thesis. Pointing out that equivalence shows formal systems align but doesn't prove the thesis itself, which is an empirical claim. The user needs this distinction to counter the roommate's assertion that it's settled.

  Finally, the strongest version (Reading D) is speculative. The universe as a computation isn't established. The roommate's conclusions hold only under formal definitions, not necessarily in broader contexts. Making sure the user understands where their roommate is correct and where there's still debate.
answer: |-
  ### Bottom Line: Your roommate is technically correct that quantum computers aren't a counterexample to *formal* computability (Turing-computability), and the equivalence of formalisms *does* settle that specific definition. However, his claim that the Church-Turing thesis is "proved" conflates distinct readings; only the formal equivalence is proven, while stronger physical claims remain unproven conjectures.

  Here are the precise readings of "anything that can be computed at all can be computed by a Turing machine" with verdicts:

  1.  **Reading A: Definitional (Formal Computability)**  
      *Claim:* "Computable" *means* "computable by a Turing machine" (or equivalent formalism like lambda calculus/general recursion).  
      *Verdict:* **Trivial & Proven.** This is a definition, not a claim about the world. The equivalence of Turing machines, lambda calculus, and general recursion **is proven** (Church-Turing *Deutsch* Thesis). This *settles the formal definition of computability*.  
      *Quantum Relevance:* Under this definition, quantum computers compute only Turing-computable functions (BQP ⊆ PSPACE ⊆ Recursive Functions). Not a counterexample.  
      *Roommate's Conclusion Supported:* **Yes.** This reading directly supports both his points: quantum offers speedups, not new computable functions, and the equivalence of formalisms defines the class.

  2.  **Reading B: Empirical (Human-Algorithmic Computability)**  
      *Claim:* Any function that a human following a well-defined, finite, purely mechanical procedure (algorithm) with pencil and paper can compute, can be computed by a Turing machine.  
      *Verdict:* **Substantive & Plausible, but not Proven.** This is the standard **Church-Turing Thesis (CTT)**. It's highly plausible based on the equivalence of all known formalisms modeling human algorithms and zero verified counterexamples. However, it's an *empirical hypothesis* about human cognition/processes; it cannot be formally proven because "mechanical procedure" isn't mathematically defined beforehand.  
      *Quantum Relevance:* Quantum algorithms are still algorithms humans can specify/execute (with quantum resources). They don't violate CTT. Not a counterexample.  
      *Roommate's Conclusion Supported:* **Partially.** Quantum isn't a counterexample, but the equivalence of formalisms *supports* CTT, it doesn't *prove* it definitively (it remains a thesis).

  3.  **Reading C: Physical Computability**  
      *Claim:* Any function computable by *any physically realizable process* in our universe (using any physics, e.g., quantum mechanics, relativity, hypothetical undiscovered physics) can be computed by a Turing machine.  
      *Verdict:* **Substantive, Unproven, Actively Debated.** This is the **Physical Church-Turing Thesis (PCTT)**. Current physics (including quantum mechanics) suggests **it's plausible but not certain**. Quantum computers efficiently solve problems *believed* hard for classical TMs, but they don't compute *non*-Turing-computable functions. Some theories (e.g., relativistic spacetime, analog chaotic systems) *suggest* possible hypercomputation, but none are verified or practical. PCTT cannot be proven without a complete theory of physics.  
      *Quantum Relevance:* **Not a counterexample** to computability (BQP ⊆ PSPACE). It *is* a counterexample to the *stronger claim* that "any physically realizable computer is only as *fast* as a Turing machine" (quantum speedups violate this).  
      *Roommate's Conclusion Supported:* **No (for strongest claim), Partially (for computability).** Quantum doesn't violate computability under PCTT, *but* PCTT itself is unproven. His claim that quantum *only* affects speed is correct *for computability*, but quantum *does* challenge classical notions of *efficiency*.

  4.  **Reading D: Universality (The Universe as Computation)**  
      *Claim:* The universe itself *is* fundamentally equivalent to a computational process (likely a Turing machine or equivalent), meaning nothing physically possible exceeds Turing computability by definition.  
      *Verdict:* **Highly Speculative & Untestable.** This is the **Strong Church-Turing Thesis** or a foundation-of-physics hypothesis. It's **not scientifically established** and is arguably metaphysical. It cannot be proven or disproven with current knowledge.  
      *Quantum Relevance:* Irrelevant to practical computability debates. Quantum mechanics is used to model the universe, but doesn't prove the universe *is* a Turing computation.  
      *Roommate's Conclusion Supported:* **No.** This reading is too strong and speculative to support his concrete claims.

  ### Which Readings Support His Conclusions?
  *   **Quantum isn't a computability counterexample:** Readings A, B, and C all agree quantum computes only Turing-computable functions. **Supported.**
  *   **Equivalence of formalisms settles computability:** Only **Reading A (Definitional)** supports this fully. Readings B and C rely on the equivalence as strong evidence, but their broader claims (about humans/physics) are *not* settled by it. He conflated the proven equivalence (A) with proving the empirical/physical theses (B/C).
