  *Settling observation:* A survey showing >75% of specialists endorse ≥5 substantive, non-trivial theses that would surprise 1900 philosophers (excluding logic/empirical hybrids).  

  **Most sensitive term: (iii)** (Consensus mechanics).  
  *Key evidence:* Network analysis revealing if consensus clusters correlate more with advisor-student lineages/citation cliques than independent argument evaluation (e.g., tracking thesis adoption across rival departments).  

  **Disagreement locus:** Your 0.55 vs. colleague’s 0.15 hinges almost entirely on **(ii)**. You see philosophy’s core as resistant to positive consensus; they likely include conceptual/logical refinements as "knowledge" even if first-order disputes persist.  

  ### Reasoning Summary  
  Philosophical questions are typically *framework-dependent*: answers require prior commitments (e.g., to naturalism, intuitions as evidence) that lack neutral arbitration. This enables **fading-out (i)** when frameworks fall from favor and **persistent disputes (iv)** due to underdetermination. Technical tools **(v)** optimize *within* frameworks but don’t force framework convergence. Thus, consensus **(iii)** often reflects sociological alignment, not decisive proofs. Without domain-specific empirical anchors **(ii)**, attrition dominates accumulation.
