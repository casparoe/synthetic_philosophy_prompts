  Also worth noting: Standard RP theory treats preferences as primitives only over observed options. Unobserved options require extensions like VNM expected utility for gambles - but here it's a simple new good.

  For the credence calculation, I'll need separate weights for:
  - Domain definability
  - Ranking determinacy
  - Intensity separability
  - Empirical noise impact
  - Independent evidence relevance

  The intensity issue is especially thorny since affine rescaling already makes absolute comparisons meaningless. User seems aware but wants to push beyond this limitation.

