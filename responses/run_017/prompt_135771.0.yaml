answer: |-
  **1. Hinge vs. Empirical Proposition:**  
  For Wittgenstein, empirical propositions are open to verification/falsification within a language-game (e.g., "This land plot measures 100m²"). Hinges are bedrock certainties that *enable* such games – not doubted, not asserted as knowledge, but shown in action (e.g., "The Earth exists"). **Before discovery**, the laundered claim (e.g., "Category X starts at value Y") *is* a hinge: it is silently operational in practices, enabling coordination and dispute. **After discovery**, it *remains* a hinge functionally. The paperwork reveals *provenance*, not falsity. The hinge still "stands fast" (OC §116) – its role is unchanged even if its origin is arbitrary. Its status depends on its *use*, not its genesis or truth-value.

  **2. Provenance:**  
  Wittgenstein *would* likely treat the discovery as a non-event for the hinge's *function*. Hinges are "unfounded" (OC §166); they are "inherited" background (OC §94) shaped by "common behavior" (OC §206). The riverbed metaphor (OC §96–99) emphasizes that what matters is the *current* role: "The bank of that river consists partly of hard rock... partly of sand" – but the river (practice) flows over it regardless of composition. The accident’s irrelevance is textually supported: hinges are immune to historical justification (OC §559). However, the text is silent on whether an *accidental* origin might uniquely unsettle a community's *feeling* of certainty, potentially accelerating erosion. Reconstruction here extends beyond explicit support.

  **3. The Reformers:**  
  Publicizing the accident alone **would not** dislodge the hinge. Argument cannot shake what grounds argument (OC §124, §612). Persuasion requires shifting the *entire practice* that relies on the hinge. Wittgenstein suggests world-pictures change slowly through new "ways of living" (OC §92), like geological shifts. Planned reform targeting a single hinge misunderstands its embeddedness: "When we first begin to *believe* anything, what we believe is not a single proposition, it is a whole system" (OC §141). Reformers might succeed only by building rival practices where a *different* hinge operates naturally – but this is not "planned" hinge-change; it’s organic cultural drift.

  **4. Where the Reformers Stand:**  
  The reformers' demand ("Arbitrary origins discredit!") itself hinges on *their* world-picture: e.g., "Transparency is foundational" or "Rational origins are necessary." Wittgenstein **would not exempt** this. Their stance is another Moorean gesture (cf. OC §1–20): holding up "rationality" or "accuracy" as proof, but these are *their* hinges, not universally justified. Like Moore's hands, their demand expresses a certainty (OC §370), but cannot prove it within a skeptical framework. It remains part of *their* inherited picture.

  **5. Limits:**  
  - **Text-Supported:** The hinge/empirical distinction; functional irrelevance of truth/falsity *to hinge status*; argument’s impotence against hinges; the reformers' stance as hinge-dependent.  
  - **Beyond Text/Silent:** Whether accidental (vs. deliberate but unfounded) origins uniquely affect psychological certainty or erosion speed. *On Certainty* ignores institutional genesis.  
  - **Pulls Two Ways:** Hinges as "animal" (OC §359) vs. culturally inherited – the tension leaves room for accidental origins to matter *culturally* without affecting the *logical* point.  
  - **Refusal?** He’d decline prescriptive questions ("*Should* we keep it?"). Philosophy "leaves everything as it is" (PI §124); it describes grammar, not arbitrates practice. The faithful answer is noting the hinge’s *current* role and the reformers’ own grammatical commitments.

