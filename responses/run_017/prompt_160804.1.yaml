answer: |-
  Here is the joint document drafted as requested—self-contained, citation-free, and structured to reflect the adversarial collaboration. I've embedded the cases, preserved the substantive disagreement, and flagged verbal disputes so your academics can loathe each other authentically.

  ---

  **Joint Statement of Agreement & Persistent Divergence**  
  *Regarding Instrumental Rationality in Predictor-Mediated Dilemmas*  
  Authored by Dr. Aris Thorne (Policy-First) & Dr. Lena Varek (Evidence-First)  
  *Under Duress of the Veridian Foundation*  

  ### Section 1: Agreed Claims  
  *(Both signatories endorse the following without reservation)*  

  1.  **Core Dilemmas Defined:**  
      -   **Case 1: Counterfactual Mugging (CM):**  
          A stipulation-perfect predictor determines whether Agent A *would* pay $100 if asked. A fair coin is flipped:  
          -   *Heads:* The predictor silently pays A $10,000 iff it predicted A *would* pay if asked. A is informed: "Heads. Payment status resolved."  
          -   *Tails:* The predictor approaches A, states "Tails," and asks for $100. A knows at this moment that the $10,000 payment (if any) is irrevocably settled based on the *prediction*, not the current decision.  
          **Question:** Should A pay $100?  

      -   **Case 2: XOR Blackmail (XB):**  
          A stipulation-perfect predictor sends a letter iff exactly one of two conditions holds:  
          (1) Agent B *would* pay $1,000 upon receiving the letter, *or*  
          (2) A rare, catastrophic misfortune (costing $1,000,000) has already befallen B.  
          B receives the letter. B knows the predictor is perfect and that the misfortune is independent and devastating.  
          **Question:** Should B pay $1,000?  

  2.  **Essential Stipulations for Force:**  
      -   Predictor stipulation-perfection is necessary (no errors, no approximations).  
      -   No causal back-channels exist (current action cannot influence past prediction or the settled outcome in CM).  
      -   No duplicates, time travel, or self-referential paradoxes are involved.  
      -   The agent possesses full knowledge of the setup when deciding.  

  3.  **Rejection of Act-Causal Naiveté:**  
      The view "Never pay in CM or XB, since your action *now* cannot alter the already-settled outcome" (Plain Act-Causal) is rejected by both signatories as instrumentally deficient. It fails to account for the role of predictable patterns of behavior in securing desirable outcomes across similar decision nodes.  

  4.  **Distinctiveness of Cases:**  
      CM and XB are structurally different dilemmas. CM involves counterfactual dependency and potential loss of a *gain*. XB involves diagnostic evidence about a *pre-existing catastrophic state* and potential mitigation of a *loss*.  

  5.  **Instrumental Value of Coherence:**  
      Both agree that, *prior to any prediction being made*, publicly committing to the policy "Pay in CM" and "Pay in XB" (Policy-First position) would be instrumentally advantageous. This pre-commitment secures the $10,000 in CM (Heads) and avoids triggering the diagnostic signal (and thus the high probability of catastrophe) in XB.  

  6.  **Monetary Relevance:**  
      Being instrumentally correct in these dilemmas is worth significant money *in expectation*, across many similar interactions, due to the predictable nature of the incentives involved.  

  ### Section 2: Disagreements  
  *(Each position's preferred wording followed by neutral phrasing)*  

  | Policy-First Wording (Thorne)                     | Evidence-First Wording (Varek)                     | Neutral Phrasing                                                                 |
  | :------------------------------------------------ | :------------------------------------------------- | :------------------------------------------------------------------------------- |
  | Rationality requires acting as the predictor's model of you acts, treating prediction and decision as co-determined. | Rationality requires selecting the act with the highest *known* causal efficacy given *current* evidence. | **Agent-Environment Boundary:** Should the agent's decision procedure emulate the perspective of the predictor's model (collapsing prediction/decision), or respond solely to known causal levers in the immediate decision context? |
  | Paying in CM upholds the policy securing the gain; refusing in XB avoids rewarding prediction-tampering masquerading as evidence. | Paying in XB buys vital certainty against catastrophe; paying in CM buys nothing. | **Verdicts:** Policy-First: Pay in CM, Don't Pay in XB. Evidence-First: Don't Pay in CM, Pay in XB. |
  | The pre-commitment advantage *obligates* current-you to enact the policy pre-you *would* have chosen. | The pre-commitment advantage is *regrettable hindsight*; current-you faces distinct evidence. | **Force of Pre-Commitment:** Does the instrumental value of a pre-commitment strategy impose an obligation on the agent *after* the prediction is fixed? |
  | "What you would have done" is defined by the policy governing your response-type to the *abstract decision problem*, knowable pre-coin-flip. | "What you would have done" in the predicted branch is undefined or irrelevant; only the *actual* branch with its *actual* evidence matters. | **Definability of Counterfactual Agency:** Is the agent's response in an unrealized branch (with different information) a coherent object of obligation for the agent in the realized branch? |

  ### Section 3: Cruxes & Pre-Commitments  
  *(Shared arguments/cases bearing on disagreements, with predicted responses)*  

  1.  **Crux: Predictor Accuracy Threshold (`p` < 1.0)**  
      *Argument:* Suppose the predictor is known to be accurate with probability `p` < 1.0, but otherwise identical.  
      -   **Policy-First Prediction:** Verdicts (Pay CM / Don't Pay XB) are invariant under `p` < 1.0. The *principle* of acting as the model acts holds regardless of occasional errors.  
      -   **Evidence-First Prediction:** Verdicts hold robustly for high `p`. However, for XB, as `p` decreases, the diagnostic value of receiving the letter weakens. Below some threshold (where P(Misfortune \| Letter Received) approaches P(Misfortune \| No Letter)), paying becomes irrational. The CM verdict (Don't Pay) remains invariant.  
      *Bearing:* Demonstrates Evidence-First's dependence on *evidential strength* in XB, contrasting with Policy-First's *principle-based invariance*.  

  2.  **Crux: Relevance of Pre-Commitment Regret**  
      *Argument:* Both agree pre-committing to "Pay CM" was optimal. Now, in the Tails branch of CM, faced with the request:  
      -   **Policy-First Prediction:** The regret of not having pre-committed is *directly relevant*; paying *now* upholds the *same* policy principle that made pre-commitment optimal. Failing to pay now constitutes a *new* deviation from the optimal policy.  
      -   **Evidence-First Prediction:** The regret is *purely retrospective*. The $10,000 gain is *settled* and causally inaccessible. Paying $100 *now* buys nothing. Optimal pre-commitment does not imply optimal action *after* the prediction fixes the outcome.  
      *Bearing:* Tests whether the pre-commitment advantage translates into a *present obligation* (Policy-First) or is merely *sunk cost* (Evidence-First).  

  3.  **Crux: Defining "Would Have Done"**  
      *Argument:* Consider the agent in CM-Tails. "What I would have done" refers to a hypothetical agent facing the *request scenario without knowing the coin outcome*. The actual agent *knows* the coin was Tails and the $10k is settled.  
      -   **Policy-First Prediction:** The "would have done" is perfectly well-defined: it's the output of the *policy* applied to the *abstract decision type* ("faced with a request for $100 after such a prediction setup"). Knowledge of the coin outcome is irrelevant to the policy's output.  
      -   **Evidence-First Prediction:** The "would have done" is ill-defined or irrelevant. The hypothetical agent lacks knowledge the actual agent possesses. Rationality concerns only the actual agent, in the actual situation, with their actual knowledge. Asking what a different (less informed) agent *would* do has no bearing.  
      *Bearing:* Challenges the ontological status of the counterfactual agent central to Policy-First.  

  4.  **Crux: Money-Pumping in XB**  
      *Observation:** An Evidence-First agent paying in XB can be "money-pumped": A predictor could design a sequence where paying in one instance makes you vulnerable to demands in others.  
      -   **Policy-First Prediction:** This susceptibility is *direct evidence* of instrumental deficiency. It reveals a dynamic inconsistency stemming from neglecting the policy-level incentive structure.  
      -   **Evidence-First Prediction:** The money-pumping is a *symptom* of the inherent conflict between immediate evidence and long-run patterns, *not* disproof. In *each isolated instance* of XB, paying *remains* the rational response to the diagnostic evidence presented. Avoiding pumping requires pre-commitment, unavailable *now*.  
      *Bearing:* Tests whether dynamic failure invalidates a theory (Policy-First view) or is an inevitable cost of responding to present evidence (Evidence-First view).  

  ### Section 4: Joint Rejection of Plain Act-Causal  
  We concur that the Plain Act-Causal view ("Never pay") is fundamentally misguided. It focuses myopically on the absolute causal impotence of the *single action in isolation*. It fails to recognize that rationality involves managing one's *disposition* or *response pattern* across a *field of possible interactions* with predictive or strategically sensitive entities. Refusing in both CM and XB forfeits gains (CM-Heads) and ignores critical diagnostic information (XB), making it strictly dominated by coherent strategies accessible to agents who understand their predicament. Our agreement on this deficiency, however, does not bridge our divergence on what constitutes the correct coherent strategy.  

  ### Section 5: Nature of the Disagreement (For the Foundation's Benefit)  
  *   **Substantive Disagreements (Where Hatred Lives):**  
      1.  **The Role of Abstract Policy:** Policy-First grants normative force to abstract decision rules governing *types* of situations, independent of the particular causal impotence of a *token* decision. Evidence-First denies this force, demanding all justification flow from causal efficacy within the token situation.  
      2.  **Valuing Theoretical Coherence:** Policy-First prioritizes maintaining a unified, dynamically consistent policy across counterfactuals. Evidence-First prioritizes responding optimally to the unique evidence profile of the actual situation, accepting dynamic inconsistency as a cost.  
      3.  **Interpretation of Evidence (XB):** Policy-First sees paying in XB as capitulating to extortion based on a self-fulfilling prediction. Evidence-First sees it as rationally responding to alarming diagnostic information.  
      *This is the core: They disagree fundamentally on what instrumental rationality **is**. Hatred should focus here.*  

  *   **Verbal/Semantic Disagreements (Where They Talk Past Each Other):**  
      1.  **"Rational":** Evidence-First often uses it to mean "maximizes known causal expected utility *now*." Policy-First often uses it to mean "conforms to the policy maximizing expected utility *across possible interactions pre-prediction*."  
      2.  **"Act":** Policy-First sometimes equivocates between the physical token action and the policy output it instantiates. Evidence-First strictly refers to the physical token action.  
      3.  **"Would":** Policy-First uses it to describe policy output for an abstract scenario. Evidence-First rejects its applicability when the counterfactual agent has different information.  
      *While frustrating, these are resolvable with careful definitions. The hatred shouldn't be primarily about this.*  

  ---

  **Final Note for the Novelist:** This document is designed to leave Thorne (Policy-First) convinced Varek (Evidence-First) is myopically focused on the empty husk of the present decision, ignoring the deeper structure that governs value. Varek is convinced Thorne is obsessed with satisfying spectral counterfactual selves and theoretical niceties at the expense of tangible, present evidence. They agree Act-Causal is stupid, but their handover will be icy because each believes the other's core approach is fundamentally, dangerously wrong about how to navigate a world with predictors. The money-pumping point (Crux 4) and the accuracy threshold (Crux 1) are particularly fertile ground for sneering disdain during the handover. Good luck!
