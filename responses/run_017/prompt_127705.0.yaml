  The user also wants scenes discussed beyond theory illustration. The fountain scene shows narrative control and misinterpretation. Dunkirk's controlled chaos reflects Briony's later confession. The ending reveals the deception, creating that meta-sadness. These scenes demonstrate how McEwan layers tragedy with narrative unreliability.

  I should also note where theories might not fit. The paradox often assumes emotional engagement, but *Atonement*'s coldness might require different frameworks, like appreciating intellectual design over emotional release. The narrative twist adds complexity that Greek tragedies or films like *Schindler's List* might not have, so some theories fall short here.

