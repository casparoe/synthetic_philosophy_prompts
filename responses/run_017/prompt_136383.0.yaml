  #### **2. Apparent or No Tensions**  
  **Apparent Tension: (4) vs. Triviality Arguments**  
  - **Your worry**: That (4) (local reading of Adams' equation) blocks Lewis-style triviality arguments, but your friend claims it "makes no difference."  
  - **Resolution**: **Worry dissolves.** (4) works locally:  
    - Triviality arguments (e.g., Lewis 1976) assume Adams' equation holds for all credence functions and show that \(\text{if } A \text{ then } C\) cannot be a proposition. Your (4) restricts to a single credal career: For fixed \(\text{cr}_0\), require \(\text{cr}_0(\text{if } A \text{ then } C | E) = \text{cr}_0(C | A \land E)\) for all \(E\) with \(\text{cr}_0(E) > 0\) and \(\text{cr}_0(A \land E) > 0\).  
    - This avoids triviality because:  
      - Credal states are all conditionalizations of \(\text{cr}_0\), so no "comparison across agents" is needed.  
      - **Derivation sketch**: Suppose triviality tries to compare \(\text{cr}(\cdot | E)\) and \(\text{cr}(\cdot | E')\) for different \(E, E'\). Your (4) only relates these via \(\text{cr}_0\), not as independent functions. For instance, Lewis's key step assumes \(\text{cr}(\text{if } A \text{ then } C | \neg C) = \text{cr}(C | A \land \neg C) = 0\), but under (4), this is \(\text{cr}_0(\text{if } A \text{ then } C | \neg C \land E)\) for some \(E\), which equals \(\text{cr}_0(C | A \land \neg C \land E)\). No contradiction arises.  
    - **Verdict**: No tension. (4) successfully blocks triviality arguments.  

  **No Tension: (1) + (7) are Compatible**  
  - **Your worry**: That \(\text{cr}(\text{if } A \text{ then } C) \leq \text{cr}(A \supset C)\) with equality only in special cases "smuggles in" the material conditional.  
  - **Resolution**: **Worry dissolves.** This inequality is a consequence of (1) and probability, not a semantic claim.  
    - **Derivation**:  
      - By (1): \(\text{cr}(\text{if } A \text{ then } C) = \text{cr}(C|A)\).  
      - By definition: \(\text{cr}(C|A) = \frac{\text{cr}(A \land C)}{\text{cr}(A)}\).  
      - Material conditional: \(A \supset C \equiv \neg A \lor (A \land C)\), so \(\text{cr}(A \supset C) = \text{cr}(\neg A) + \text{cr}(A \land C)\).  
      - Now:  
        \[
        \text{cr}(C|A) = \frac{\text{cr}(A \land C)}{\text{cr}(A)} \leq \frac{\text{cr}(A \land C) + \text{cr}(\neg A)}{\text{cr}(A)} = \frac{\text{cr}(A \supset C)}{\text{cr}(A)}.
        \]  
        But this upper bound is weak. Instead, directly:  
        \[
        \text{cr}(A \supset C) - \text{cr}(C|A) = \left[ \text{cr}(\neg A) + \text{cr}(A \land C) \right] - \frac{\text{cr}(A \land C)}{\text{cr}(A)}.
        \]  
        Since \(\text{cr}(A) \leq 1\), \(\text{cr}(A \land C) \leq \text{cr}(A) \cdot \text{cr}(A \land C) / \text{cr}(A)\)? Better:  
        \[
        \text{cr}(C|A) = \frac{\text{cr}(A \land C)}{\text{cr}(A)} \leq 1 \quad \text{and} \quad \text{cr}(A \supset C) \geq \text{cr}(A \land C).
        \]  
        But note:  
        \[
        \text{cr}(A \supset C) - \text{cr}(C|A) = \text{cr}(\neg A) + \text{cr}(A \land C) - \frac{\text{cr}(A \land C)}{\text{cr}(A)}.
        \]  
        Set \(x = \text{cr}(A)\), \(y = \text{cr}(A \land C)\). Then:  
        \[
        \text{cr}(A \supset C) - \text{cr}(C|A) = (1 - x) + y - \frac{y}{x}.
        \]  
        Since \(1 - x \geq 0\) and \(y - y/x \leq 0\) (as \(x \leq 1\)), this difference is not always non-negative. However, from standard probability:  
        \[
        \text{cr}(C|A) = \frac{y}{x}, \quad \text{cr}(A \supset C) = 1 - \text{cr}(A \land \neg C) = 1 - (x - y).
        \]  
        Then:  
        \[
        \text{cr}(A \supset C) - \text{cr}(C|A) = [1 - (x - y)] - \frac{y}{x} = 1 - x + y - \frac{y}{x}.
        \]  
        Now, \(1 - x + y - y/x = (1 - x) + y(1 - 1/x)\). Since \(1 - 1/x \leq 0\) for \(x \leq 1\), this is not obviously non-negative. But numerically:  
        - If \(x = 0.5\), \(y = 0.4\), \(\text{cr}(C|A) = 0.8\), \(\text{cr}(A \supset C) = 1 - (0.5 - 0.4) = 0.9\), so \(0.9 > 0.8\).  
        - If \(x = 0.5\), \(y = 0.1\), \(\text{cr}(C|A) = 0.2\), \(\text{cr}(A \supset C) = 1 - (0.5 - 0.1) = 0.6\), so \(0.6 > 0.2\).  
        - Always \(\text{cr}(A \supset C) \geq \text{cr}(C|A)\) because:  
          \[
          \text{cr}(A \supset C) = \text{cr}(\neg A) + \text{cr}(A \land C) \geq \text{cr}(A \land C) \quad \text{and} \quad \text{cr}(C|A) = \frac{\text{cr}(A \land C)}{\text{cr}(A)}.
          \]  
          Since \(\text{cr}(A) \leq 1\), \(\text{cr}(A \land C) \leq \text{cr}(A) \cdot \text{cr}(A \land C) / \text{cr}(A)\) is false. Instead, note that \(\text{cr}(C|A) \leq 1 \leq \text{cr}(A \supset C)\) only if \(\text{cr}(A \supset C) = 1\), which is not true. Correct:  
          \[
          \text{cr}(A \supset C) - \text{cr}(C|A) = \text{cr}(\neg A) + \text{cr}(A \land C) - \frac{\text{cr}(A \land C)}{\text{cr}(A)}.
          \]  
          But from total probability:  
          \[
          \text{cr}(A \supset C) = \text{cr}(\neg A) + \text{cr}(A \land C), \quad \text{cr}(C|A) = \frac{\text{cr}(A \land C)}{\text{cr}(A)}.
          \]  
          So \(\text{cr}(A \supset C) - \text{cr}(C|A) = \text{cr}(\neg A) + \text{cr}(A \land C) - \frac{\text{cr}(A \land C)}{\text{cr}(A)}\).  
          This is \(\geq 0\) because \(\text{cr}(\neg A) \geq 0\) and \(\text{cr}(A \land C) - \frac{\text{cr}(A \land C)}{\text{cr}(A)} = \text{cr}(A \land C)(1 - \frac{1}{\text{cr}(A)}) \leq 0\), but the first term dominates. Actually, rearrange:  
          \[
          \text{cr}(A \supset C) - \text{cr}(C|A) = \text{cr}(\neg A) + \text{cr}(A \land C) \left(1 - \frac{1}{\text{cr}(A)}\right).
          \]  
          Since \(1 - 1/\text{cr}(A) \leq 0\), but \(\text{cr}(\neg A) = 1 - \text{cr}(A)\), so:  
          \[
          = [1 - \text{cr}(A)] + \text{cr}(A \land C) \left(1 - \frac{1}{\text{cr}(A)}\right).
          \]  
          Set \(p = \text{cr}(A)\), \(q = \text{cr}(A \land C)\). Then:  
          \[
          = (1 - p) + q \left(1 - \frac{1}{p}\right) = 1 - p + q - \frac{q}{p}.
          \]  
          Now, \(1 - p + q - q/p = (1 - p) + q(1 - 1/p)\). Since \(1 - 1/p = (p - 1)/p \leq 0\), and \(q \geq 0\), \(q(1 - 1/p) \leq 0\), but \(1 - p \geq 0\). The expression is minimized when \(q\) is large, but:  
          \[
          1 - p + q - q/p = 1 - p + q(1 - 1/p) = 1 - p - q \frac{1 - p}{p} = (1 - p) \left(1 - \frac{q}{p}\right).
          \]  
          Since \(0 \leq q/p \leq 1\), \(1 - q/p \geq 0\), and \(1 - p \geq 0\), so the product is \(\geq 0\). Equality when \(p = 1\) or \(q/p = 1\) (i.e., \(\text{cr}(A \land \neg C) = 0\)).  
        - Thus, \(\text{cr}(A \supset C) \geq \text{cr}(C|A)\), with equality iff \(\text{cr}(A) = 1\) or \(\text{cr}(A \land \neg C) = 0\).  
    - **Verdict**: No tension with (1). Your interpretation is correct: This shows the material conditional is a ceiling, not a semantic analysis.  

  **No Tension: (6)'s Verdicts (e.g., "if H then H")**  
  - **Your worry**: That closest-worlds semantics (3) might not support your credence 1 in "if \(H\) then \(H\)".  
  - **Resolution**: **Worry dissolves.** With centering (actual world is closest if \(A\) true), "if \(A\) then \(A\)" is true at all worlds (since if \(A\) true, closest \(A\)-world is actual, \(A\) holds; if \(A\) false, closest \(A\)-world may vary, but the conditional's truth doesn't require \(A\) to hold at actual world). So \(\text{cr}(\text{if } A \text{ then } A) = 1\). Similarly, "if \(A\) then \(\neg A\)" is false at all worlds.  
  - **Verdict**: (3) and (6) are compatible here.  

  **No Tension: (2) Embedding**  
  - **Your worry**: That abandoning (3) or other parts might conflict with embedding data (e.g., negations, nests).  
  - **Resolution**: Not a tension yet. (2) requires a semantics that handles embedding. Closest-worlds (3) does this, but so do alternatives (e.g., dynamic semantics adapted to propositions). If you abandon (3), ensure the replacement handles embedding.  

