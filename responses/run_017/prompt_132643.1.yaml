  Key points to cover:
  1. The mirroring result: For a risk-averse r (r(p) < p for p in (0,1)), REU(X) + REU(-X) < 0 for any non-degenerate gamble X. This forces risk aversion in gains and losses simultaneously, preventing the reflection effect (risk aversion for gains, risk seeking for losses).

  2. Rowan's proposed fix: two risk functions, r_plus for gains (above reference point) and r_minus for losses (below reference point). But then we face the problem of how to handle a gamble that straddles the reference point, specifically when an increment crosses zero.

  3. Example gamble: 25% chance of -60, 25% chance of -10, 50% chance of +40. The increment from -10 to +40 crosses zero. How to weight?

  4. Two natural approaches:
     a) Split the increment at zero: weight the part from -10 to 0 with r_minus and the part from 0 to 40 with r_plus.
     b) Use one risk function for the entire increment? But which one? This seems arbitrary.

  5. The split method leads to something resembling Cumulative Prospect Theory (CPT) with a linear value function and separate weightings for gains and losses.

  6. Iris will argue that this rebuilds a descriptive model and undermines the normative claim of risk-weighted utility.

  7. Rowan will counter that the permissibility argument never required a single r, and that even in gains alone, r_plus allows for Allais-style preferences that EU cannot capture.

  8. Both should land hits and concede points. The dialogue ends open-ended.

  We'll structure the dialogue in parts:
  - Introduction and setting up the mirroring problem.
  - Working through the algebra with a concrete example (the 50/50 gamble).
  - Rowan proposing the two-risk-function solution.
  - The straddling gamble problem and the split method.
  - Iris pointing out the similarity to CPT and the normative challenge.
  - Rowan defending the flexibility and the Allais point.
  - Final open-ended exchange.

  Let's write the dialogue accordingly.
answer: |-
  ### Seminar Handout: Risk-Weighted Expected Utility  
  **Opening Dialogue: Rowan vs. Iris**  
  *(Context: Rowan advocates for risk-weighted expected utility (REU) as a rational alternative to EU. Iris defends EU as sufficient and worries REU introduces problems. They debate a "mirroring" result that seems to force symmetric risk attitudes.)*  

  **Rowan:** Iris, I’ve got a nagging problem with REU’s treatment of losses. Remember how we set utility linear in dollars, so all risk attitude lives in the risk function \(r\)? Take a simple gamble: 50/50 shot at $0 or $100. An REU maximizer with risk aversion—say, \(r(0.5) = 0.4\)—prefers $50 for sure over the gamble. Standard.  

  **Iris:** Right, because \( \text{REU}(\text{gamble}) = 0 + r(0.5)(100 - 0) = 40 < 50 \). Risk aversion in gains. What’s the issue?  

  **Rowan:** The mirror image. Consider \(-X\), where you lose $0 or $100 with equal odds. REU for \(-X\) is \( \text{REU}(-X) = -100 + r(0.5)(0 - (-100)) = -100 + 40 = -60 \). So they prefer a sure loss of $50 to the gamble? Because \(-50 > -60\)?  

  **Iris:** That’s bizarre. Risk aversion *for losses*? But people often seek risk when facing losses! The reflection effect—risk-averse in gains, risk-seeking in losses—is bedrock. EU handles it by letting utility curvature differ across gains and losses. REU can’t?  

  **Rowan:** Worse. I generalized this. Take any gamble \(X\) with outcomes ordered \(x_1 < \cdots < x_n\), decumulative probabilities \(S_i = P(\text{at least } x_i)\), and REU defined as:  
  \[
  \text{REU}(X) = x_1 + \sum_{i=2}^n r(S_i)(x_i - x_{i-1}).
  \]  
  For \(-X\), outcomes become \(-x_n < \cdots < -x_1\). After algebra, you get:  
  \[
  \text{REU}(X) + \text{REU}(-X) = \sum_{i=2}^n \left[ r(S_i) + r(1 - S_i) - 1 \right] (x_i - x_{i-1}).
  \]  
  If \(r(p) < p\) for all \(p \in (0,1)\)—pure risk aversion—then every term \(r(S_i) + r(1 - S_i) - 1 < 0\). So the sum is negative for *any* non-degenerate \(X\). Meaning: if you’re risk-averse in gains, you must be risk-averse in losses too. No reflection effect. Ever.  

  **Iris:** Ouch. So REU forces symmetry. But that’s empirically wrong and normatively odd. Why can’t I weight losses differently?  

  **Rowan:** My fix: two risk functions. Let the status quo be the reference point. Use \(r_+\) for gains (outcomes above zero), \(r_-\) for losses (below zero). So for pure gains or losses, we tune independently. For instance, set \(r_+(p) < p\) for risk-averse gains, but \(r_-(p) > p\) for risk-seeking losses. Voilà—reflection effect.  

  **Iris:** Clever. But what about gambles straddling zero? Try this: 25% chance of −60, 25% chance of −10, 50% chance of +40. Outcomes ordered: −60, −10, +40. Decumulative probabilities: \(S_1 = 1\) (certain at least −60), \(S_2 = 0.75\) (at least −10), \(S_3 = 0.5\) (at least +40). How do you compute REU?  

  **Rowan:** We need to split the increment crossing zero. From −10 to +40 is a $50 jump straddling the reference point. I’d weight the loss part (−10 to 0) with \(r_-\) and the gain part (0 to +40) with \(r_+\). So:  
  \[
  \text{REU} = -60 + r_-(S_2)(-10 - (-60)) + \left[ r_-(S_3) \cdot (0 - (-10)) + r_+(S_3) \cdot (40 - 0) \right].
  \]  
  \(S_2 = 0.75\) for "at least −10", \(S_3 = 0.5\) for "at least +40". The increment from −10 to 0 is weighted by \(r_-(0.5)\) (since \(S_3\) applies to +40, but the "tail" for the loss portion uses the same decumulative probability).  

  **Iris:** Hold on. Why split at zero? The outcome −10 is below, +40 above, but the gamble’s "jump" from −10 to +40 is a single interval. If I don’t split, I’d weight the whole $50 with one function—but which? \(r_-\) because it starts negative? \(r_+\) because it ends positive? Arbitrary.  

  **Rowan:** Hence splitting. It’s natural: the status quo is a psychological boundary. We treat gains and losses separately, like in prospect theory.  

  **Iris:** Ah! That’s my worry. You’ve rebuilt cumulative prospect theory (CPT)! Linear "value" (utility), separate weighting for gains and losses, reference point obsession. But CPT is *descriptive*—it models how people *do* decide, flaws and all. REU was supposed to be *normative*—about how rational agents *may* permissibly weight risk. If you’re mimicking CPT, are you smuggling in irrationality?  

  **Rowan:** Fair challenge. But two points. First, nothing in the normative argument for REU required a *single* \(r\). The permissibility of weighting decumulative probabilities doesn’t vanish with two functions. Second, REU still differs from CPT. CPT distorts probabilities *and* has a kinked value function. Here, utility is linear—no loss aversion. My \(r_+\) and \(r_-\) only capture risk attitude.  

  **Iris:** True, but now your "rational" agent has a reference point splitting every payoff. That feels behavioral, not normative. And what’s "permissible" about weighting the same probability \(S_3 = 0.5\) twice—once with \(r_-\) for the loss slice, once with \(r_+\) for the gain slice? That’s not in the original REU spirit.  

  **Rowan:** Conceded—it’s messy. But consider the big picture. Even in pure gains, REU allows Allais-style violations of independence that EU *can’t* rationalize, no matter the utility curvature. Suppose I set \(r_+(p) = p^2\) (risk-averse). Then I prefer $1M for sure over a 10% shot at $5M (since \(r_+(0.1) \times 5 < 1\)), but I might prefer a 10% shot at $5M over 11% at $1M if \(r_+(0.1)/r_+(0.11) > 1.1\). EU forbids that switch. That normative flexibility is core to REU—and it survives my two-function fix.  

  **Iris:** I’ll grant that. EU *is* rigid under independence. But your fix introduces new problems. Suppose I face two gambles: one with outcomes all positive, another straddling zero. Your splitting convention makes risk attitude depend on arbitrary range divisions. Worse: what if the reference point shifts mid-calculation? People do that, but should rational agents?  

  **Rowan:** Good point. I’d call the reference point fixed—say, current wealth. No shifting.  

  **Iris:** Still, your summed REU for \(X\) and \(-X\) now depends on \(r_+\) and \(r_-\). With \(r_+(p) < p\) and \(r_-(p) > p\), maybe \(\text{REU}(X) + \text{REU}(-X) > 0\) for some \(X\). But is that sensible? Shouldn’t it be zero if utility is linear?  

  **Rowan:** Why? REU isn’t linear. The risk functions break additivity.  

  **Iris:** But then you lose coherence. In EU, \(U(X) + U(-X) = 0\) if \(U\) is linear. Here, you get noise. If I’m forced to accept gambles and their mirrors together, I might avoid all straddling bets—which seems irrational.  

  **Rowan:** Hmm. I see the tension. But maybe rationality doesn’t require additive mirroring. The real test is choice consistency, not algebraic tidiness.  

  **Iris:** Perhaps. Still, I’m left wondering: if REU needs two risk functions, reference points, and straddle-splitting to capture basic behavior, is it simpler than EU with a kinked utility? Or just differently complicated?  

  **Rowan:** Touché. But complexity isn’t fatal if it captures rationality EU misses. The Allais paradox isn’t a "mistake"—it’s a reasonable risk-weighting.  

  **Iris:** And yet... your mirroring result originally showed that a single \(r\) conflates gain and loss attitudes. Now with two \(r\)’s, you’ve avoided that, but at the cost of rebuilding prospect theory’s scaffold. Maybe that scaffold is descriptive, not normative.  

  **Rowan:** Or maybe it reveals that risk is inherently domain-relative. Anyway, class is about to start. Let’s table this?  

  **Iris:** Agreed. But one last thought: if rational agents can have reference points, why not let them have curved utility too? Then EU might approximate your two-function REU without the straddle headaches.  

  **Rowan:** ...I’ll need to whiteboard that.  

  ---  
  **End of Handout**  
  *Instructor’s note: We’ll pick up here. Be ready to debate: Is two-function REU a normative advance or a descriptive surrender? And can EU mimic it after all?*
