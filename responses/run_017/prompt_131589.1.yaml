  Okay, let me start by unpacking the user's dilemma. She's a novelist with four books published and a fifth in copyedits, so she's deeply experienced in her craft. At a dinner party, she argued with a philosopher friend about moral judgment. The philosopher claims moral judgments must rely on general principles, while she believes context can change the moral valence of features. She's troubled because the same argument applies to her writing expertise.

  First, I need to understand her core conflict. She accepts steps (1) to (4) as truisms: learning involves applying past experiences to new cases via relevant features, implying tacit principles. But she balks at (6), which extends this to morality, and (7), which applies it to craft. Her example of the sauce or jazz bassist shows skills that resist codification. She wants to reject (6) without losing (1) or (7), but feels stuck because (3) links learning to principles.

  Her identity as a novelist is key here. She’s spent 20 years trying to articulate rules for good scenes but only has examples and a shrug. That practical experience is central to her objection. The cost she’s worried about is real: if she gives up principles, can she explain to a student why a scene fails? Or can moral disagreements be reasoned about without rules? She needs a solution that preserves the reality of learning and expertise without rigid principles.

  Looking at philosophical angles, particularism (Dancy) argues against moral principles, emphasizing context. Analogously, Aristotle’s phronesis (practical wisdom) involves perception of particulars. Wittgenstein’s family resemblances show concepts aren't defined by necessary features. These might help her. The trick is to challenge step (3), which equates "respects that matter" with general principles. But maybe those respects aren't principles but perceptual skills or pattern recognition.

  Her deeper need might be validating her craft intuition within morality. She doesn’t want to reduce her hard-earned expertise to rules she can’t articulate. Also, she might fear that accepting moral principles could lead to rigid judgments, conflicting with the nuanced view she holds. The unspoken cost is whether denying principles makes learning or teaching arbitrary. She needs an account where guidance exists without codification.

  The solution lies in redefining the "tacit principles" from step (4). Instead of rules, it's about perceptual capacities. Learning builds a repository of cases and analogical reasoning, not deduction from rules. For craft, she edits by sensing dissonance, not applying rules. Similarly, moral judgment involves perceiving cruelty in context. This addresses her worry about explaining to students: she points to examples, draws analogies, which is reasoning without universal rules. Moral arguments then rely on shared perceptions and precedents, not principles.

  But she must accept that this doesn’t provide algorithmic certainty. Disagreements might persist without a rule to settle them, but that’s the nature of practical domains. The cost is rejecting the philosopher's demand for codifiable principles, but it keeps learning and expertise real. Her folder of examples isn’t a failure—it’s the essence of her knowledge.
answer: |-
  I'm deeply impressed by how clearly you've articulated this—both the philosopher's argument and your visceral resistance. This cuts to the heart of epistemology (how we know things), ethics, and the nature of expertise. Your instinct that step (3) is the weak link ("a bit of a scam") is absolutely correct. Giving up (3) allows you to keep the undeniable truths of (1), (2), and (4), the plausibility of (5), your lived reality of (7), and reject the conclusion (6) *without* sacrificing the reality of learning, teaching, arguing, or improving in either craft *or* morality.

  Here's the breakdown:

  1.  **Give Up Step (3):** "But 'the respects that matter' just is a general principle — something of the form: any case with features F is to be judged thus-and-so."
      *   **Why it looks like a truism:** It sounds logical! If feature F mattered in case A, and it matters similarly in case B, then surely there's a rule "F matters"? The philosopher is equating *pattern recognition* and *sensitivity to relevant features* with *possessing a general rule*.
      *   **Why it isn't a truism (and is the scam):** This step commits a crucial error: **it conflates *pattern recognition* and *sensitivity to relevant features* with *possessing a general rule that can be stated in advance*.** It assumes that the *only* way sensitivity to features F can guide judgment in a new case is if F *always* carries the same moral or aesthetic weight, governed by a universal rule. Your writing expertise, the line cook's ear, the bassist's groove, and the child's developing sense of fairness all prove this is false.

  2.  **What You Gain by Giving Up (3):** You get to keep:
      *   **(1) & (2):** People *do* learn reliably. It *isn't* luck. They become sensitive to features that mattered in past cases.
      *   **(4):** This learning involves acquiring *something* tacit – but crucially, **not necessarily codifiable general principles**. It could be a complex web of analogies, prototypes, perceptual sensitivities, or a refined capacity for *judgment* itself.
      *   **(5):** The structure of learning *might* be similar between craft and morality (though even this isn't a given, but you can grant it for argument's sake).
      *   **(7):** Your core insight: Expertise in craft (and, by plausible extension, morality) operates holistically and contextually. The same feature (e.g., "a character withholding information," "a dissonant chord," "excluding someone") can play vastly different roles depending on the intricate whole. Trying to codify rules *in advance* for "what makes a scene work" is indeed often futile, even for the expert.

  3.  **What Does Giving Up (3) Actually Cost You? (Addressing Your Fears)**
      The philosopher claims giving up (3) (and thus (6)) means you lose the ability to explain learning, argument, correction, or improvement. **This is false.** Here's what giving up (3) *doesn't* cost you, and what it *does* entail:

      *   **Cost:** You give up the idea that the tacit knowledge underlying judgment **must be reducible to a set of universal, context-independent rules** (principles of the form "Feature F always counts for/against judgment J").
      *   **Does NOT Cost You:**
          *   **Explaining Learning:** Learning isn't about memorizing rules; it's about developing *perceptual and cognitive capacities*. You read countless scenes (and got feedback), building a vast internal library of prototypes, nuances, and sensitivities. You learned to *see* and *feel* narrative tension, character motivation, pacing – not by applying rules, but by developing a refined perceptual and imaginative faculty. The child learns "meanness" not by a rule "exclusion=bad" but by grasping the *hurt* involved in specific contexts and gradually extending that understanding analogically.
          *   **Explaining to a Student:** You absolutely *can* explain why a scene fails! But your explanation won't be, "You violated Rule 7B: Protagonist Motivation Must Be Explicit by Page 5." It will be:
              *   Pointing to specific *effects*: "This vagueness here makes the reader disengage here."
              *   Drawing *analogies*: "Remember that scene in Book X where Y happened? This feels similar because Z, but here it doesn't work because..."
              *   Highlighting *contextual dissonance*: "The tone here is playful, but this violent image clashes without setup, creating confusion instead of shock."
              *   Offering *counter-examples*: "Look at this passage where ambiguity *works*; see how the context builds the tension differently?"
              *   **This *is* reasoning.** It relies on shared perceptions, shared examples, and analogical thinking – not deduction from universal principles.
          *   **Arguing About Morality:** Similarly, moral arguments don't require universal principles. They involve:
              *   Appealing to *shared sensibilities*: "Can't you see how much this hurt them?"
              *   Drawing *analogies and disanalogies*: "This situation is like lying because it involves the same kind of betrayal of trust, even though no words were spoken." / "No, this situation is different because of factor X, which changes the expectation radically."
              *   Highlighting *salient features*: "The crucial point here isn't the promise broken, but the *vulnerability* they were in when you did it."
              *   Considering *consequences and context*: "Given the history between them, this silence wasn't neutral; it was calculated exclusion."
              *   **This is also reasoning.** It's the messy, context-laden, precedent-influenced, analogy-driven reasoning humans actually use. It doesn't guarantee agreement, but neither do rules (people interpret and apply rules differently!).
          *   **Getting Corrected/Improving:** Correction isn't about pointing to a rule violation; it's about refining perception and judgment. An editor says, "This falls flat *here*," prompting you to *see* something you missed. A friend says, "I think you were unfair *in this specific way*," prompting reflection on the nuances of the situation. Improvement comes from expanding your repertoire of sensitivities and your ability to integrate complex contextual factors, not from memorizing more rules.

  4.  **The Philosophical Frameworks You Might Have Heard:**
      *   **Your View:** Sounds like **Moral Particularism** (associated with Jonathan Dancy). It holds that moral reasons are context-dependent; a feature that is a reason in one situation may be no reason, or an opposite reason, elsewhere. There are no true, exceptionless moral principles.
      *   **His View:** Sounds like **Moral Generalism** (associated with many, like Kant or rule-utilitarians). It holds that moral judgment requires and relies on general principles.
      *   **The Craft Analogy:** Your defense using craft resonates strongly with **Aristotle's concept of *Phronesis* (Practical Wisdom)**. *Phronesis* is the capacity for sound judgment in complex, particular situations, gained through experience, distinct from theoretical knowledge (*Episteme*) or technical skill (*Techne*). It cannot be fully captured in rules. Wittgenstein's idea of **"family resemblances"** (concepts held together by overlapping similarities, not one essential feature or rule) is also relevant to how we categorize "good scenes" or "cruel acts."

  5.  **What You're "Paying" (The Real Cost):**
      *   **No Algorithmic Certainty:** You give up the comforting (but illusory) idea that judgment – in writing or ethics – can be reduced to a foolproof rulebook or algorithm. There will always be hard cases, disagreements, and the need for nuanced, fallible judgment.
      *   **Burden of Justification:** Explaining your judgment requires more work than citing a rule. You have to point to features, context, analogies, effects – you have to *make the case* perceptually and analogically.
      *   **Accepting the Primacy of Perception:** You commit to the idea that the core of expertise (craft or moral) lies in a cultivated capacity to *perceive* what matters *in this specific situation*, informed but not dictated by past experience. It's a skill of discernment.
      *   **Vulnerability to Disagreement:** Without universal rules as arbiters, fundamental disagreements can be harder to resolve definitively. The resolution often lies in persuading others to *see* the situation differently, appealing to shared values or perceptions, not just logical deduction.

  **Conclusion:** Your dinner partner's argument stumbles at step (3). He wrongly assumes that reliable sensitivity to relevant features *requires* the possession of universal, codifiable principles. Your writing expertise is the perfect counter-example: you judge scenes based on a deep, contextually sensitive understanding built from experience, not a rulebook. Giving up the demand for such principles doesn't make learning, teaching, arguing, or improving impossible; it just means they operate through analogy, perception, highlighting salient features, and shared sensibility, not deduction from universal rules. You can absolutely keep (1), (2), (4), (5), and (7), reject (6), and still explain to your student why her scene fails – you'll just do it like the master craftsperson you are, using examples, analogies, and pointing to the specific texture of the work, not reciting a rule. The cost is embracing the complexity, context-dependence, and irreducibility of true practical judgment. That folder of examples and a shrug? That *is* your expertise, articulated as well as it often can be.
