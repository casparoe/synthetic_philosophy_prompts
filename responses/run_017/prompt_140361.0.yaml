  Hmm, the satire must be surgically precise to avoid seeming like mockery. I'll need to embed all those evidentiary concepts they listed: argument from silence (when absence of evidence gets treated as evidence), multiple attestation (how many sources mention something), criterion of embarrassment (would they really make this up if it weren't true?), time gaps between events and records, place-name persistence, the slippery slope from archaeological destruction layers to specific events, and composite figures. 

