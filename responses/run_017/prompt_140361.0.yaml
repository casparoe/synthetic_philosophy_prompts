  **MINUTES OF THE FORTY-FIRST SESSION**  
  **Standing Committee on the Historicity Threshold (SCHT)**  
  **Held Virtually, 17 October 2023**

  **Present:** Chair (University of Uppsala), Vice-Chair (CNRS), Members (University of Chicago, Tel Aviv University, University of Oxford, University of Tokyo, Australian National University).  

  **1.0 Approval of Agenda:**  
  Agenda approved without amendment.  

  **2.0 Revision of Schedule B (Weighting of Argument from Silence):**  
  2.1 Member (Oxford) proposed reducing Schedule B.3(a) ("Silence in contemporaneous administrative records") weight from 0.7 to 0.4, citing inherent preservation bias.  
  2.2 Member (Chicago) counter-proposed increasing weight to 0.8 for "high-documentation contexts" (e.g., New Kingdom Egypt).  
  2.3 *Motion to refer to subcommittee* (Tokyo, ANU). Motion carried. Schedule B.3(a) weight temporarily set at 0.55 pending report.  

  **3.0 Re-Adjudication of File HOM-07A (Trojan War Narrative):**  
  3.1 Application of **Wilusa Clause (SCHT Rule 4.2.1):**  
     a) Hittite diplomatic archives reference "Wilusa" (Ahhiyawa context, spatial/temporal proximity plausible).  
     b) Phonetic correlation "Wilusa" ≈ "(W)ilios" deemed "moderate" (Grade B) per Linguistic Panel.  
     c) *Clause invoked:* Grants +0.3 corroborative weight to destruction layer at Hisarlik (Level VIIa, c. 1180 BCE).  
  3.2 Narrative Correlation:  
     a) Destruction layer (violence, fire) consistent with narrative core ("city destroyed").  
     b) Gap: c. 450 years between destruction and Homeric fixation.  
     c) Composite Hero Rider (Rule 6.1): Applied. "Agamemnon" status deemed "plausible folding" (no penalty).  
  3.3 *Provisional Recommendation:* Upgrade from **Grade L4 (Legend-Possible Kernel)** to **L3 (Legend-Probable Kernel)**. Vote: 5-2 (Against: Tel Aviv, ANU – citing Schedule B uncertainty).  

  **4.0 Re-Adjudication of File BRIT-01C (Arthurian Narrative):**  
  4.1 **Embarrassment Rider (Rule 5.7) invoked re: Gildas’s *De Excidio*:**  
     a) Gildas (c. 540 CE) details Badon siege, excoriates contemporary kings.  
     b) Silence on "Arthur":  
        i. *For the Applicant:* Embarrassment to modern Arthurian studies suggests ancient authenticity ("Why omit the hero?"). Rider weight claimed: +0.4.  
        ii. *For the Committee:* Embarrassment may originate in modern narrative inflation. Rider weight capped at +0.1.  
  4.2 Chronological Gap & Attestation:  
     a) First unambiguous "Arthur" (battle leader): *Historia Brittonum* (c. 830 CE). Gap: ~300 years.  
     b) Multiple independent attestations post-1100 (Geoffrey, Wace, etc.) discounted per Rule 3.5 ("Late Flourish").  
  4.3 *Provisional Recommendation:* Retain **Grade L5 (Legend-Ambiguous)**. Vote: Unanimous. Embarrassment Rider application deemed "inconclusive" (Tel Aviv abstaining on Rider calculus).  

  **5.0 Re-Adjudication of File LEV-02A (Exodus Narrative):**  
  5.1 Application of Schedule B.3(a) (Argument from Silence):  
     a) New Kingdom Egypt (13th C. BCE): Extensive administrative/military records (Rule 3.2: "High-Documentation Context").  
     b) Silence noted on:  
        i. Large-scale Semitic population departure.  
        ii. Plague sequences.  
        iii. Loss of chariot force in Sea of Reeds.  
     c) Weight applied: 0.55 (per 2.3). Deemed "highly detrimental" to narrative core.  
  5.2 Corroborative Evidence:  
     a) Merneptah Stele (1208 BCE): "Israel" as people/entity *in Canaan*. Contradicts narrative chronology (post-Exodus conquest).  
     b. Place-name persistence (Goshen, Pi-Ramesses): Acknowledged but deemed "administratively routine" (No Wilusa Clause applicability).  
  5.3 Demographic Implausibility:  
     a) Narrative population (600,000+ males) unsupported by Sinai settlement archaeology (Rule 7.4: "Carrying Capacity Discrepancy"). Penalty: -0.5.  
  5.4 *Provisional Recommendation:* Downgrade from **Grade L4 (Legend-Possible Kernel)** to **L5 (Legend-Ambiguous)**. Vote: 6-1 (Against: Chicago – citing "cultural memory resilience" exemption).  

  **6.0 Feedback Loop Protocol (Rule 9.1 "Certification Causality"):**  
  6.1 Chair noted Hisarlik (Troy) excavations intensified post-19th C. certification of "probable historicity."  
  6.2 Question raised: Do strata identified via *funding contingent on SCHT Grade* constitute "independent attestation" upon rediscovery?  
  6.3 Member (ANU): "Rule 9.1 creates ontological recursion. Finds generated by L3/L4 certification cannot auto-confirm."  
  6.4 *Motion:* Amend Rule 9.1 to exclude evidence from excavations initiated post-Provisional Certification. Motion tabled pending legal review.  

  **7.0 Schedule B Re-Revision:**  
  7.1 Subcommittee reported. Proposed Schedule B.3(a) weights:  
     - High-Documentation: 0.65  
     - Medium: 0.45  
     - Low: 0.25  
  7.2 Member (CNRS): "Variable weights introduce context subjectivity."  
  7.3 *Motion to return to subcommittee.* Carried. Schedule B remains provisional.  

  **8.0 Adjournment:**  
  8.1 Files HOM-07A, BRIT-01C, LEV-02A remanded to Secretariat. Provisional Recommendations to be issued pending Schedule B ratification.  
  8.2 Next session: 21 February 2024. Agenda to include Feedback Loop Protocol and **File SUM-01A (Gilgamesh Narrative)**.  

  **Session adjourned 17:38 UTC.**  

  ---  
  **SCHT Provisional Certification Scale (Excerpt):**  
  **L1:** Historically Anchored (e.g., Sargon of Akkad)  
  **L2:** Historically Plausible (e.g., Lycurgus)  
  **L3:** Legend - Probable Kernel  
  **L4:** Legend - Possible Kernel  
  **L5:** Legend - Ambiguous  
  **L6:** Legend - Invented Narrative  

  **Note:** All grades subject to re-adjudication upon new evidence or methodological review. Certification confers no claim to narrative veracity, only to threshold satisfaction per SCHT rules. Heritage funding bodies are independent actors.
