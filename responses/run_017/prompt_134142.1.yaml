prompt: |-
  Hey — hoping you can help me turn some of the epistemic injustice literature into something my team can actually run. Quick context: I work in the patient experience office at a large safety-net hospital, and a growing share of what lands in our queue isn't really a complaint about wait times or billing — it's people saying, in one way or another, that nobody took them seriously. We close about 40–50 of these a month, I've got maybe 25 minutes per case, the reviewers are retired nurses and social workers with no philosophy background, every letter goes out under my director's name, and anything that hints at a clinical mistake has to be cleared by legal first. I did a medical humanities reading group on this stuff a couple years ago so I know the basic vocabulary — credibility deficits from identity prejudice on the testimonial side, gaps in shared interpretive resources on the hermeneutical side, and the mirror-image case where someone gets *more* credibility than their evidence warrants — but I don't want a literature recap or a reading list, I want the operational version.

  So: give me a decision procedure, in the order we'd actually run it. Start with a triage question that peels off complaints that are really about something else (a genuine clinical error, a broken process, a request for money) so we don't epistemologize everything. Then the steps for deciding whether what happened is an epistemic failure at all, and if so which kind, and what kind of repair is owed — where "repair" might mean re-authoring part of the medical record, entering the patient's own words rather than the clinician's summary, giving feedback to a specific clinician, changing an intake form, or just an honest letter. For each step I want to know what counts as a *sufficient* answer, where the procedure should stop and say no repair is owed, and where it has to hand off to a human because the question is one of values rather than facts. Three wrinkles I keep hitting that I want the procedure to handle rather than dodge: (1) what I've started calling credibility laundering — the report gets believed only once a clinician restates it in clinical register, so the patient is effectively believed but accumulates no track record, and the chart can't support them next time; (2) the version where the speaker isn't the patient at all but a family member or informal interpreter, and the uptake failure and the repair owed arguably belong to two different people; (3) the mixed case where a report was discounted partly for illegitimate reasons and partly because it was clinically unlikely, where I don't want the procedure to just split the difference. If any of those three collapse into distinctions the literature already makes, say so conceptually — I don't need to know who named what.

  Then run it on three cases and show your work. (a) A woman in her forties with a history of fibromyalgia goes to the ED reporting what she describes as her nerves being on fire; the resident charts "chronic pain, drug-seeking r/o," her own phrasing never enters the record, and a scan three weeks later finds something real. (b) A daughter interpreting for her father, who has limited English and a dementia diagnosis, reports that he'd been saying his hip hurt for days before a fall; the team charts "baseline confusion" and treats the daughter as the sole authority, and later no one will credit either of them. (c) The one I expect to argue with you about: a fluent, well-insured, locally prominent man complains that a junior resident wouldn't accept his self-diagnosis and demands a letter acknowledging that he was epistemically wronged and that his preferred diagnosis be recorded; the chart shows a thorough and correct workup that ruled it out. I want at least one case where the procedure gives an answer I won't like, and I want you to say plainly where the rubric is really a judgment call dressed up as a procedure. Finally, give me a cheap audit we could run on a quarter's worth of closed complaints to tell whether using this is actually changing outcomes or just producing more nicely worded letters. Please write the whole thing in American English, and don't worry if it runs long.
reasoning: |-
  Okay, the user works in patient experience at a safety-net hospital and is dealing with complaints where patients feel dismissed. They need a practical decision procedure based on epistemic injustice concepts, not theoretical literature. Their team handles 40-50 cases monthly with limited time per case (25 minutes), and reviewers are retired nurses/social workers without philosophy backgrounds. Letters go out under the director's name, and legal must clear any clinical mistake hints.

  The user wants a triage step to filter out non-epistemic complaints (clinical errors, process issues, financial requests). Then, steps to identify if it's an epistemic failure, classify it, and determine appropriate repairs like chart corrections, feedback, or honest letters. They also want to address three specific issues: credibility laundering (clinician restating patient's report in clinical terms without crediting them), family members as reporters (uptake failure affecting multiple people), and mixed cases (discounting due to both illegitimate and legitimate reasons).

  The procedure must clearly define stopping points where no repair is needed and indicate when human judgment is required. Additionally, the user wants three case examples, including one with an unpopular outcome, and an audit method to evaluate the procedure's effectiveness.

  Key considerations:
  - Time constraints mean the procedure must be efficient, with clear yes/no questions.
  - Reviewers' backgrounds suggest avoiding academic jargon; operational language is essential.
  - Legal constraints require careful handling of anything implying clinical errors.
  - The three specified wrinkles need integrated solutions:
    1. Credibility laundering → Ensure patient's original words enter the record to build track record.
    2. Family reporters → Separate credibility assessment of reporter vs. patient; repairs may differ.
    3. Mixed cases → Avoid splitting the difference; focus on whether illegitimate prejudice influenced the discounting.

  For the case examples:
  - Case A (fibromyalgia patient): Clear testimonial injustice; repair includes chart correction and feedback.
  - Case B (daughter interpreter): Hermeneutical and testimonial elements; repairs involve chart amendments and process changes.
  - Case C (prominent man demanding diagnosis): Illustrates stopping point; no repair owed despite complaint, highlighting procedural limits.

  The audit should track tangible outcomes like chart corrections and feedback instances, not just letter quality, to measure real impact. Sampling closed complaints and comparing pre/post-implementation data would show effectiveness.

  The response should be in American English, pragmatic, and acknowledge where judgment calls are necessary (e.g., assessing "clinically reasonable" discounting in mixed cases). Emphasize that the procedure streamlines analysis but doesn't eliminate all subjectivity.
answer: |-
  Here's an operational decision procedure for identifying and repairing epistemic harm in patient complaints, designed for your constraints. It's structured as a flowchart with clear exit ramps, handles your three wrinkles explicitly, and uses plain language. The core philosophy is baked into actionable questions — no theory required.

  ---

  ### **Triage: Is This About Epistemic Uptake?**  
  *Goal: Filter out non-epistemic complaints fast. Spend <5 min here.*  
  1. **"Is the core complaint that the patient/family felt their report was ignored, dismissed, or distorted — even if care was technically correct?"**  
     - *Yes → Proceed to Step 2.*  
     - *No → Route elsewhere:*  
       - Clinical error? → Hand to Quality/Safety.  
       - Broken process (e.g., long wait)? → Hand to Operations.  
       - Financial request/dispute? → Hand to Billing Advocacy.  
       - *Rationale: Avoids over-applying the framework. "Nobody listened" is the trigger.*

  ---

  ### **Step 2: Was There an Epistemic Failure?**  
  *Goal: Separate legitimate discounting from prejudicial dismissal. 5–7 min.*  
  2. **"Review the record: Was there a clinically reasonable basis to discount the report at the time, based on available evidence?"**  
     - *Yes, and no identity prejudice evident → **Stop. No repair owed.***  
       - *Example:* Patient with headache insists on brain tumor scan; exam and history support migraine. Refusal is clinically sound.  
     - *No, or unclear → Proceed to Step 3.*  
     - **Wrinkle #3 (Mixed Cases) Handle Here:**  
       - Ask: **"Could a reasonable clinician have made the same judgment if the patient were of a different gender/race/class/etc.?"**  
         - *Yes → Stop. No repair owed.* (Legitimate discounting dominates)  
         - *No → Proceed.* (Identity prejudice likely contributed)  

  ---

  ### **Step 3: Classify the Failure Type**  
  *Goal: Match failure type to repair. 5 min.*  
  3. **"What was the primary failure mode?"**  
     - **A. Testimonial Injustice (Credibility Deficit):**  
       - *Key sign:* Patient/family report was downplayed due to identity (e.g., "anxious," "histrionic," "drug-seeking" labels without evidence).  
       - *Repair focus:* Restore credibility + amend record.  
     - **B. Hermeneutical Injustice (Interpretive Gap):**  
       - *Key sign:* Patient used non-clinical language (e.g., "nerves on fire," "spirit feels heavy") dismissed as "vague" or "unreliable"; no effort to translate.  
       - *Repair focus:* Enter patient's words + train on meaning-making.  
     - **C. Testimonial Excess (Credibility Surplus):**  
       - *Key sign:* Speaker given undue weight due to status (e.g., VIP demands), overriding clinical judgment.  
       - *Repair focus:* Protect clinical integrity + document fairly.  
     - **Wrinkle #2 (Family Reporter) Handle Here:**  
       - Ask: **"Whose credibility was undermined? The reporter’s, the patient’s, or both?"**  
         - *Reporter only → Repair targets their role (e.g., feedback on interpreter respect).*  
         - *Patient only → Repair targets record/process for patient.*  
         - *Both → Combined repair (e.g., amend patient's chart + apologize to family).*  

  ---

  ### **Step 4: Determine Repair**  
  *Goal: Assign concrete actions. 8–10 min.*  
  4. **Match repair to failure type:**  
     | Failure Type          | Repair Options (Pick 1–2)                                  | Legal Clearance Needed? |  
     |-----------------------|------------------------------------------------------------|-------------------------|  
     | **Testimonial**       | 1. Amend record: Add patient's exact words + context. <br> 2. Feedback to clinician: "Avoid premature labels." <br> 3. Letter: "We failed to listen." | Only if amendment implies error |  
     | **Hermeneutical**     | 1. Add patient's phrasing to record as "chief complaint in own words." <br> 2. Suggest intake form changes (e.g., "Describe pain like telling a friend"). <br> 3. Letter: "We should have sought to understand." | No |  
     | **Testimonial Excess**| 1. Letter: "Clinical decisions are evidence-based." <br> 2. Feedback to staff: "Hold firm on medical standards." <br> *Do not amend record unless factually wrong.* | Only if record change needed |  
     - **Wrinkle #1 (Credibility Laundering) Handle Here:**  
       - If patient’s report was only believed *after* clinician rephrased it:  
         - **Mandatory repair:** Amend record to show patient’s original words + timestamp (e.g., "Patient reported 'nerves on fire' on 5/1; MD noted 'neuropathic pain' on 5/3").  
         - *Why:* Builds track record for future encounters.  

  5. **Final Check:**  
     - **"Does this repair center the patient’s voice without creating clinical/legal risk?"**  
       - *No → Simplify (e.g., send letter only).*  
       - *Yes → Proceed.*  

  ---

  ### **Case Applications**  
  *Reviewer notes simulated; 25-min clock includes documentation.*  

  **Case A: Fibromyalgia Patient ("Nerves on Fire")**  
  - Triage: Core complaint is dismissal ("drug-seeking" label). Not about billing/wait times.  
  - Step 2: No clinical basis to dismiss "nerves on fire" (neuropathic pain is common in fibro). Identity prejudice? ("Drug-seeking" + fibromyalgia stigma → likely yes).  
  - Step 3: **Testimonial injustice** (prejudicial label) + **hermeneutical gap** (dismissed metaphor).  
  - Step 4:  
    - Repair: Mandatory add patient’s words to record ("Pt reported: 'My nerves feel like they're on fire'").  
    - Feedback to resident: "Avoid 'drug-seeking' without evidence; explore metaphors."  
    - Letter: "We should have engaged with your description."  
  - **Outcome:** Repair owed. Handles credibility laundering by preserving patient’s words.  

  **Case B: Daughter Interpreter (Hip Pain Before Fall)**  
  - Triage: Complaint is that father’s report was ignored ("baseline confusion" label).  
  - Step 2: Dementia ≠ inability to report pain. Clinically unreasonable to dismiss hip pain pre-fall. Identity prejudice? (Age + LEP + dementia stigma → likely yes).  
  - Step 3: **Testimonial injustice** (discounted due to dementia) + **hermeneutical gap** (team ignored daughter’s role as interpreter).  
  - Step 4:  
    - Repair: Amend father’s record: "Per daughter-interpreter, pt reported hip pain X days prior to fall."  
    - Process change: Flag for Interpreter Services: "Train staff to document interpreter-mediated reports verbatim."  
    - Letter to daughter: "We failed to honor your father’s voice and your role."  
  - **Outcome:** Repair owed to both parties.  

  **Case C: Prominent Man (Rejected Self-Diagnosis)**  
  - Triage: Core complaint is epistemic ("wasn’t believed").  
  - Step 2: Workup was thorough; self-diagnosis ruled out. Clinically reasonable to discount. Identity prejudice? *Reverse check:* Would a non-prominent patient get this workup? Probably not (excess credibility).  
  - Step 3: **Testimonial excess** (status inflated credibility).  
  - Step 4:  
    - Repair options: Letter: "We stand by our clinical assessment." *Do not amend record or apologize for epistemic harm.*  
    - Feedback to resident: "Good job holding boundaries."  
  - **Outcome: No repair owed for epistemic harm.** (The answer you won’t like)  
  - **Judgment Call Alert:** Step 2 hinges on "clinically reasonable." If workup was cursory, outcome changes. But per data, it was thorough → no injustice.  

  ---

  ### **Cheap Audit Protocol**  
  *Goal: Measure if the procedure changes outcomes, not just words.*  
  **Method:** Randomly sample 20% of complaints closed pre- and post-implementation (e.g., 1 quarter each). For each:  
  1. **Track tangible repairs:** % of cases with:  
     - Patient’s words added to chart.  
     - Clinician feedback issued.  
     - Process changes initiated (e.g., form updates).  
  2. **Measure downstream impact:**  
     - For repaired cases, track 90-day return visits: Did amended records change future care? (e.g., fewer "drug-seeking" labels).  
     - Patient satisfaction scores on "felt heard" items (if collected).  
  3. **Control for letter quality:** Compare pre/post letters using text analysis for:  
     - Specificity (e.g., mentions "your exact words" vs. "concerns").  
     - Accountability (e.g., "we failed" vs. "regret your experience").  
  **Success Metric:** >30% increase in tangible repairs *and* >10% drop in repeat complaints for similar issues.  

  ---

  ### **Key Reality Checks**  
  - **Where Judgment Dominates:** Step 2 (clinically reasonable?) and Wrinkle #3 (prejudice contribution?) require nurse/social worker discernment. The rubric guides but doesn’t eliminate this.  
  - **Legal Safeguard:** All record amendments get legal review if they *imply* error (e.g., adding missed symptoms). Pure hermeneutical adds ("patient's words") rarely do.  
  - **Time Saver:** Most cases exit at Triage or Step 2. Only 15–20% likely proceed to full analysis.  
  - **Your Wrinkles Addressed:**  
    - Credibility Laundering → Mandatory verbatim patient wording in chart.  
    - Family Reporters → Repair targets split by harmed party.  
    - Mixed Cases → The "reasonable clinician" test forces a priority call.  

  This turns Fricker/Medina into a nurse-proof checklist. It won’t catch every nuance, but it forces explicit engagement with epistemic harm — and that’s the operational win.
