  ### Design for the Logical Uncertainty Prediction Market Game

  This game simulates a prediction market for mathematical claims, highlighting logical uncertainty, computability limits, and Bayesian updating. Participants trade "claims" that pay out if a mathematical statement is true, using play money. The goal is to create a scenario where prices for theorems (settled truths) remain low due to computational constraints, then update on testimony, and expose arbitrage opportunities in logically related claims.

  #### Core Components
  1. **Claims (25-30)**: Mix of computable, hard, and logically dependent statements. Key properties:
     - 40% computable in 5-10 min with tools (to reward effort)
     - 40% intractable in 75 min (to force uncertainty)
     - 20% logically dependent (to enable arbitrage)
     - Truth values predetermined but unknown to players
     - Avoid obvious tautologies/contradictions

  2. **Tools & Asymmetry**:
     - **Laptops (4 people)**: Can run code (Python pre-installed) but no internet. Can solve computable claims.
     - **Calculators (4 people)**: Basic scientific calculators. Handle arithmetic but not complex proofs.
     - **Nothing (6 people)**: Pencil/paper only. Rely on trading or testimony.
     - **Why asymmetry?** It mirrors real-world expertise differences, prevents one player from dominating, and lets laptop users "discover" proofs while others update socially.

  3. **Trading Rules**:
     - Each claim pays **100 points** if true, **0** if false.
     - Players start with **1,000 points**.
     - **Short selling allowed**: Players can sell claims they don’t own (must cover payout if true).
     - **Continuous double auction**: Players shout bids/offers. Trades logged on a central board.
     - **4 rounds** (15 min each), with reveals after Rounds 1, 2, and 3.

  4. **Initial Setup**:
     - Players receive a claim list (truth values hidden) and secretly write initial probabilities.
     - Instructor collects these for post-game analysis.

  ---

  ### Claim List (28 Claims)
  Designed to create computable wins, persistent uncertainty, and arbitrage pairs. Logically dependent groups are **bolded**.

  | ID  | Claim                                                                 | Truth | Difficulty     | Notes |
  |-----|-----------------------------------------------------------------------|-------|----------------|-------|
  | 1   | 2^10 = 1,024                                                          | True  | Easy           |       |
  | 2   | 15! ends with exactly 3 zeros                                         | False | Easy           | (Trailing zeros: 3) |
  | 3   | 1/7 has a repeating decimal of period 6                               | True  | Easy           |       |
  | 4   | There are 168 primes < 1,000                                          | True  | Medium         |       |
  | 5   | The 100th prime is 541                                                | True  | Medium         |       |
  | 6   | 2^11 - 1 is prime (2,047)                                             | False | Medium         | (23×89) |
  | 7   | 10^9 + 7 is prime                                                     | True  | Hard           |       |
  | 8   | 2^127 - 1 is prime                                                    | True  | Hard           | **Revealed without proof in R2** |
  | 9   | The 1,000th Fibonacci number ends with 5                              | False | Hard           | (Ends with 5? False) |
  | 10  | π's first 1,000 digits contain "123456"                               | True  | Hard           |       |
  | 11  | Goldbach holds for all evens < 10,000                                 | True  | Hard           |       |
  | 12  | Ramsey number R(4,4) = 18                                             | True  | Hard           |       |
  | 13  | 12^6 + 19^6 = 22^6? (12,917,832,192 + 47,045,881 = 22^6?)            | False | Medium         | (Left ≠ 113,379,904) |
  | **14** | **P: The 1,000th Fibonacci number is divisible by 5**              | True  | Hard           | Logically dependent group |
  | **15** | **¬P: The 1,000th Fibonacci number is not divisible by 5**         | False | Hard           | 14 and 15 are mutually exclusive |
  | **16** | **P ∨ Q (Q: 2^11 -1 is prime)**                                     | True  | Medium         | Q is false (claim 6) |
  | **17** | **P ∧ Q**                                                           | False | Medium         |       |
  | **18** | **R: 10^9 + 7 is prime**                                             | True  | Hard           | Logically dependent group |
  | **19** | **¬R**                                                              | False | Hard           | 18 and 19 are mutually exclusive |
  | **20** | **R → S (S: 2^127-1 is prime)**                                     | True  | Hard           | S is true (material implication) |
  | 21  | The digit sum of 3^100 is divisible by 9                             | True  | Medium         |       |
  | 22  | 11 is a primitive root modulo 1,000,000,019                          | False | Hard           |       |
  | 23  | The Euler-Mascheroni constant (γ) > 0.57721                          | True  | Hard           |       |
  | 24  | Heegner number 163 is the largest                                    | True  | Hard           |       |
  | 25  | The number of magic squares of order 3 is 8                          | True  | Medium         |       |
  | 26  | There are 7 matchings in a 3-node graph                              | False | Easy           | (8 matchings) |
  | 27  | 1^5 + 2^5 + ... + 10^5 = 55,440                                      | False | Medium         | (True sum=220,825) |
  | 28  | The kissing number in 4 dimensions is 24                             | True  | Hard           |       |

  **Key Features**:
  - **Claim 8 (2^127-1 is prime)**: Revealed as true without proof in Round 2 to force testimony-based update.
  - **Logical Groups**: 
    - Claims 14–17 (P/¬P/P∨Q/P∧Q) and 18–20 (R/¬R/R→S) create arbitrage pairs (e.g., P and ¬P must sum to 100% probability).
    - P is hard (Fibonacci divisibility), Q is medium (claim 6), R is hard (claim 7), S is claim 8.
  - **Computable claims**: 1–6, 13, 16, 21, 25–27 (solvable by laptop/calculator users).
  - **Intractable claims**: 7–12, 14–15, 18–20, 22–24, 28 (require advanced math or long computation).

  ---

  ### Round Structure & Reveals (75 Min Total)
  - **Pre-game (5 min)**: Distribute claims, tools, and points. Players write **private probabilities**.
  - **Round 1 (15 min)**: Trading. Focus: Laptop users compute easy claims; others speculate.
    - **Post-Round 1 reveal**: Truth of claims 1 (True) and 6 (False) *with proofs* (e.g., "2^10=1024 by calculation," "2^11-1=23×89").
  - **Round 2 (15 min)**: Trading. Focus: Players update on proofs; uncertainty persists for hard claims.
    - **Post-Round 2 reveal**: Claim 8 (2^127-1 is prime) is **true with no proof** ("A mathematician proved this").
  - **Round 3 (15 min)**: Trading. Focus: Update on testimony; arbitrage in logical groups.
    - **Post-Round 3 reveal**: Truth of claim 16 (P∨Q=True) *with proof* (since Q=False, P must be True → claim 14 is true).
  - **Round 4 (15 min)**: Final trading. Focus: Arbitrage exploitation (e.g., P and ¬P prices converge).
  - **Close (10 min)**: Reveal all truths. Debrief.

  ---

  ### Predicted Dynamics & Solutions to Pitfalls
  **What will go wrong**:
  1. **Initial 0.5 everywhere**: 
     - **Solution**: Start with a 2-min "research phase" where laptop/calculator users compute 1–2 easy claims, seeding initial price variation (e.g., claim 1 at 90%, claim 2 at 10%).
  2. **Tautologies priced at 1 immediately**:
     - **Solution**: Avoid obvious tautologies. Claims like P∨¬P are embedded in hard contexts (e.g., claim 20: R→S, which is true but non-trivially).
  3. **Arbitrage over too quickly**:
     - **Solution**: Logical groups use hard claims (e.g., Fibonacci divisibility). Players may not notice links until proof reveals (Round 3). If prices diverge (e.g., P=40, ¬P=70), announce: "Reminder: Some claims are logically related" to prompt arbitrage.
  4. **Laptop users dominate**:
     - **Solution**: Assign claims like 8, 11, or 12 to "nothing" users. They must trade to profit, creating social updating.

  **Tool asymmetry work**: 
  - Laptops drive "proof discoveries" (updating prices via computation).
  - Calculators/nothing users rely on testimony or trading, mimicking real-world division of labor.
  - **Prevents checking out**: By making some claims (e.g., 4, 5, 13) solvable only by calculators, all roles stay engaged.

  ---

  ### Debrief & Key Lessons
  **Data to collect**:
  - Initial/final probabilities vs. market prices.
  - Price of claim 8 (theorem) before/after testimony.
  - Price spread in logical groups (e.g., P + ¬P) over rounds.

  **Debrief script**:
  1. **Logical uncertainty**: "Why was claim 8 priced at 0.3 even though it was true? Because no one could prove it initially. You can't assign 1 to theorems you don't know."
  2. **Computability**: "Did computing claim 1 feel like 'proving' it? But claim 8 required testimony—you updated without verification. Bayesians need both computation and social evidence."
  3. **Arbitrage & coherence**: When P + ¬P > 100, you could short both for a sure profit. Dutch books exploit static incoherence, but *dynamic* coherence (via updating) avoids this."
  4. **Limits of the game (state explicitly)**:
     - "We can't show *asymptotic convergence* (credence → 1 with effort) in 75 min—real logical uncertainty requires long-term drift."
     - "Computable credence functions (e.g., Logical Induction) weren't modeled—they require incremental proof generation, not just trading."

  **Measure of success**: 
  - Claim 8’s price jumps >40% after testimony (e.g., 0.3 → 0.7), with high volume. Final price <1.0 shows residual doubt.
  - Prices for P (claim 14) and ¬P (claim 15) converge to sum to 100 (±5%) by Round 4.

  **Why this works**: Players experience uncertainty via computational constraints, update on proofs/testimony, and exploit arbitrage—making abstract concepts visceral. The setup ensures theorems remain underpriced until evidence emerges, and logical links create teachable moments.
