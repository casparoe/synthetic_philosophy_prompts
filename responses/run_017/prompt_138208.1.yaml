prompt: |-
  I write about AI for a general audience, and I keep having to decide whether some scenario I'm handed actually counts as an intelligence explosion, a fast takeoff, both, or neither — usually in a sentence, with no room to explain myself. So let me set out my verdicts on concrete cases and ask what principle, if any, they add up to.

  Two quantities I'll use. Call R the share of the effective cognitive labor that goes into building better AI systems which is performed by AI systems themselves. Call L the lag between a research result existing and its showing up as capability in the world.

  - R goes from near zero to near one in about three months, and does so because the systems are doing the work; capabilities go from roughly human-level to unrecognizably better within a year. Verdict: an intelligence explosion and a fast takeoff.
  - The same capability curve, the same GDP curve, the same elapsed time — but R stays at zero, because the gains come from a human crash program of fabs, power plants and data centers, with the systems as passive products. Verdict: fast, but not an intelligence explosion. Even though nothing observable differs between this and the previous case.
  - A single algorithmic insight jumps capabilities by what would otherwise have been five years of scaling, and then progress returns to its old rate and stays there. Verdict: a discontinuity, but I resist calling it a takeoff.
  - AI systems fully automate AI research, so R is near one, but L is long and roughly fixed: every gain takes years to reach deployment because of chip fabs, clinical trials, licensing and physical buildout. Verdict: an explosion is underway but is being damped — and I'm not sure that's a coherent thing to say.
  - R rises steadily but the loop gain is tiny: each generation is only a couple of percent better at AI research than the last, so doubling times are years. Verdict: recursive self-improvement, but not a takeoff — although over a few decades this gets you much further than case three does.
  - Capabilities explode inside one narrow domain, formal mathematics say, a decade before anything comparable happens anywhere else in the economy. Verdict: I alternate between saying the takeoff has already started and saying nothing has happened yet.

  Is there a single principle here, or a short list of candidates, and is it a principle about mechanism (who or what is doing the improving), about shape (how much time passes between human-level and vastly superhuman), about consequences (irreversibility, whether anyone could still intervene), or about the domain over which capability is being measured? Please state it precisely enough that it returns verdicts on cases I haven't listed — in particular, a world in which R crosses 0.9 quickly but human institutions remain the binding constraint on everything downstream of research, and a world in which the capability of any individual system is continuous and smooth but the number of systems in operation doubles every month — and tell me honestly which of my verdicts it cannot accommodate.
reasoning: |-
  Hmm, the user is grappling with how to classify different AI development scenarios as "intelligence explosion" or "fast takeoff" in their writing. They've presented six concrete cases with their own verdicts and want to identify an underlying principle that can consistently categorize these scenarios and handle new cases. 

  Looking at their cases, I notice they're using two key variables: R (AI's share of cognitive labor in AI development) and L (deployment lag). Their verdicts show interesting patterns - they consider R critical for intelligence explosion (cases 1 vs 2), time compression essential for takeoff (case 3), and get stuck when domains are narrow (case 6) or when improvement is recursive but slow (case 5).

  The core tension seems to be between mechanism (who improves AI) and observable impact (how fast capabilities grow). Their instinct to separate "explosion" (recursive mechanism) from "takeoff" (steep trajectory) feels right. Case 4 is particularly tricky - they feel an explosion is "damped" when deployment lags, which exposes how recursive improvement requires not just research but implementation.

  For new scenarios: If R jumps quickly but institutions bottleneck deployment, that's explosion without takeoff (like case 4). If system count doubles monthly but individual capability plateaus, that's economic transformation without intelligence explosion. 

  I'll formulate two crisp definitions: Intelligence explosion requires recursive self-improvement where AI significantly drives its own advancement (high R), while fast takeoff needs sustained capability doubling in under a year across broad domains. This explains why case 2 isn't an explosion (no R), case 3 isn't takeoff (not sustained), and case 6 is ambiguous (domain-limited). 

  The only verdict that might need revisiting is case 5 - if doubling times are years, it fails both definitions, but the user already resists calling it takeoff. I'll emphasize that "explosion" implies positive feedback (high loop gain), not just any recursion.
answer: |-
  Based on your verdicts and the need for consistent, concise classification, the underlying principle separates **mechanism** (intelligence explosion) from **trajectory shape/impact** (fast takeoff). Here’s a precise framework:

  ### Core Principle
  1. **Intelligence Explosion (IE)**:  
     *Requires* **recursive self-improvement with high loop gain** — i.e., AI systems *directly* drive their own advancement (high R) *and* each generation significantly accelerates the next (loop gain ≫ 1).  
     *Key test*: Could this progress sustain if human effort froze? If yes → IE.  
     *Mechanism-focused*.

  2. **Fast Takeoff (FT)**:  
     *Requires* **sustained, steep capability ascent** — doubling times ≤ 1 year *across broad domains* of cognition/economy (not just research).  
     *Key test*: Does the *observable* capability curve (e.g., GDP, problem-solving breadth) show discontinuity/verticality? If yes → FT.  
     *Impact-focused*.

  ---

  ### Verdicts on Your Cases
  | Case | IE? | FT? | Why |
  |------|-----|-----|-----|
  | 1. R ↑↑, capability ↑↑ | ✅ | ✅ | High R + high loop gain (IE). Sustained, steep ascent (FT). |
  | 2. Capability ↑↑ via humans, R=0 | ❌ | ✅ | No AI-driven recursion (IE absent). Steep ascent still occurs (FT). |
  | 3. One-off algorithmic leap | ❌ | ❌ | No recursion (IE absent). Not sustained ascent (FT absent). |
  | 4. High R, long L | ✅ | ❌ | Recursive self-improvement (IE), but L dampens ascent → no steep trajectory (FT). |
  | 5. High R, low loop gain | ✅ | ❌ | Recursion exists (IE), but slow doubling → no steep ascent (FT). |
  | 6. Narrow-domain explosion | ✅ | ❓ | Domain-limited IE (yes). Not FT unless it *triggers* economy-wide ascent. |

  ---

  ### New Case Verdicts
  1. **R > 0.9 quickly, institutions bottleneck deployment (L large)**:  
     - **IE: ✅** (AI drives its own improvement).  
     - **FT: ❌** (Capability ascent slowed by L → no steep trajectory).  
     *Like your Case 4.*

  2. **Individual capability smooth, system count doubles monthly**:  
     - **IE: ❌** (No self-improvement; R=0 if humans design/build).  
     - **FT: ✅** (Economy-wide impact via scaling → steep ascent in aggregate capability).  
     *Analogy: If 1M human-level AIs appear overnight, it’s FT without IE.*

  ---

  ### What This Framework Clarifies
  - **IE ≠ FT**: IE is about *who/how* (AI recursion), FT about *what/effect* (discontinuous rise).  
  - **Domain matters**: IE/FT require broad cognitive/economic scope. Narrow wins (math, Case 6) are IE precursors, not FT.  
  - **"Damped explosion" (Case 4) is coherent**: IE occurs in R&D, but L delays real-world impact → no FT.  
  - **Loop gain is critical**: Low gain (Case 5) prevents takeoff despite recursion.  

  ### Tension with Your Intuitions
  Your Case 3 verdict aligns (no FT). Case 6’s ambiguity is inherent: narrow IE *enables* but ≠ FT. The only friction is **Case 5**: You call it IE but resist "takeoff." This framework agrees: IE requires recursion (✅), but FT demands steep ascent (❌). If "takeoff" implies speed, Case 5 isn’t FT.  

  ### Ultimate Test for Writers
  - **IE?** Ask: *"Is AI significantly improving itself?"*  
  - **FT?** Ask: *"Is aggregate capability rising too fast for humans to adapt?"*  

  This splits mechanism from impact, handles your cases, and scales to new scenarios. Use it ruthlessly.
