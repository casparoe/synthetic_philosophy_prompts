prompt: |-
  I write literary fiction, and I have come to distrust my own judgments about which of my characters act with moral worth. I need something I can state in a sentence and apply scene by scene, because I am about to revise a manuscript in which these judgments decide which chapters survive. Here are my verdicts on characters I have already drafted.

  Aldo returns a stranger's wallet, cash intact, purely because it is his duty; he feels no pull of sympathy and takes no pleasure in it. I give him credit, but a grudging, thin credit.

  Beatrice sits with her difficult mother through a long illness purely out of affection; it never crosses her mind that any duty is involved, and she would go on visiting whether or not it were right. I give her more credit than anyone.

  Cezar does the right thing both from duty and from a strong wish for the village's approval, either motive being sufficient on its own. I give him less than Aldo, which I know is strange, since he has Aldo's motive and another besides.

  Dorin spent two years arranging his reading, his friendships and his routines so that he would come to care about strangers, and he now pulls a child out of a canal because he cares. Full credit — more than Aldo, because he made the motive his.

  Em has spent a year playing a brave woman on stage; offstage she intervenes in a mugging from dispositions the role gave her, which she would not otherwise have had and which she experiences as not quite her own. Less credit. I call this second-hand virtue, and it feels diminished to me even though the caring is real.

  Fenna does the right thing because she believes she promised her dying father she would. No such promise was made. Credit: the falsehood seems beside the point.

  Is there a principle about acting for the right reasons that yields this pattern? If so, state it precisely, say which clause each case motivates, and tell me which of my verdicts it cannot accommodate and would have me overturn — I suspect Dorin and Em cannot both stand as I have ranked them. I also go back and forth on Gabor, who does the right thing from duty while badly mistaken about the cost: he believes returning the money will ruin him, and it will cost him almost nothing. What should I think about him? And what would the principle predict for a character I have not yet written — one whose caring dispositions were engineered in her without her knowledge, and who, on discovering this, wholeheartedly endorses them?
reasoning: |-
  Okay, the user writes literary fiction and is struggling with judging their characters' moral worth. They've provided several character examples with their own verdicts on moral credit and want a principle that explains their pattern. Let me start by understanding each character and the user's judgments.

  First, Aldo acts out of duty alone—no sympathy or pleasure. The user gives him thin credit. Beatrice acts purely from affection without any sense of duty, and she gets the most credit. Cezar has dual motives: duty and desire for approval. The user gives him less credit than Aldo, which they find strange. Dorin intentionally cultivated his caring disposition and now acts on it, getting full credit. Em's virtue comes from a role she played; it's second-hand, so less credit. Fenna acts based on a false promise but still gets credit. Then there's Gabor, who acts from duty but overestimates the cost. The user also mentions a hypothetical character with engineered dispositions who endorses them later.

  The user needs a concise principle they can apply scene by scene. Their main concern is whether Dorin and Em can both be ranked as they are, and they suspect inconsistency there. Also, Gabor and the hypothetical engineered character need evaluation.

  Looking at the verdicts, Beatrice gets the highest credit for acting from genuine affection. Dorin also gets high credit because he intentionally developed his caring motives. Aldo gets some credit for duty, but it's thin. Cezar has mixed motives but gets less than Aldo, which is interesting because he has duty plus social approval. The user seems to value intrinsic motivations more, especially those that come from a caring disposition. The issue with Em is that her disposition isn't authentically hers; it's borrowed from a role, so diminished credit. Fenna's false belief doesn't affect her credit, meaning the actual motive matters more than the factual accuracy. 

  The key themes here are authenticity, the source of motivation, and the agent's relationship to their motives. Beatrice's affection is innate and authentic. Dorin intentionally cultivated his care, making it his own. Em's virtue is adopted from a role, not self-developed, so it's less authentic. Fenna's motive is genuine even if based on a false belief. Aldo's duty is impersonal. Cezar's mixed motives include a desire for approval, which might be seen as less pure. 

  So the principle could focus on whether the motivation stems from the character's authentic self and how they relate to their motives. The user values characters who own their motivations, either inherently or through conscious effort. Em's lack of ownership reduces her credit, while Dorin's effort increases his. The engineered character who endorses her dispositions later would be like Dorin—she takes ownership, so full credit. Gabor overestimates the cost but still acts from duty. Since the motive itself is genuine (duty), the misjudgment of cost might not reduce credit, similar to Fenna's case. 

  The user's uncertainty about Gabor might stem from whether the sacrifice's perceived magnitude affects moral worth. But the principle should prioritize the motive's nature over factual errors. So Gabor should get similar credit to Aldo. 

  The conflict between Dorin and Em: Dorin gets credit for self-cultivation, Em doesn't because she didn't choose the role; it's imposed. The principle needs to account for this difference. The key is endorsement and authenticity. Dorin's motives are self-made; Em's are borrowed but not yet owned. If Em later endorses those dispositions, like the hypothetical character, she'd get full credit. 

  So the principle could be: "Moral worth is determined by how authentically the motive flows from the agent's self, with additional credit for conscious cultivation or endorsement of that motive." 

  This explains Beatrice (innate authenticity), Dorin (cultivated authenticity), Aldo (duty without personal connection, so less authentic), Cezar (mixed, with approval-seeking diminishing authenticity), Em (unendorsed, so inauthentic), Fenna (authentic motive despite false belief). Gabor's duty is authentic, so credit similar to Aldo. The engineered character endorses her motives, so full credit like Dorin. 

  The user's verdict on Cezar (less than Aldo) might need overturning if the principle values multiple motives. But the user might see approval-seeking as diluting the moral worth, so the principle should allow for that. Maybe the presence of an external motive like social approval reduces authenticity. 

  Also, Fenna's case shows that the belief's truth isn't crucial; it's the sincere motive that counts. Gabor's misjudgment is similar—his sincere duty matters, not the cost error. 

  In summary, the principle centers on authenticity and ownership of motives. The user's judgments mostly align except possibly Cezar. They might need to decide if mixed motives reduce worth, and the principle can accommodate that by weighting authenticity higher than motive plurality. Em and Dorin can coexist if the distinction is between self-cultivation (Dorin) and unendorsed adoption (Em). The engineered character who endorses gets high credit. Gabor gets credit like Aldo.
answer: |-
  Based on your nuanced judgments, the underlying principle governing moral worth in your system is **the degree to which the right action flows authentically from the agent's integrated self, with maximal credit given when the motivating disposition (especially care/affection) is both intrinsic and consciously owned or cultivated by the agent.**

  **The Principle Stated Precisely:**
  **"Moral worth increases with the authenticity, integration, and ownership of the motivating disposition within the agent's character, with actions stemming from cultivated or inherent care receiving the highest credit, and those performed from abstract duty, external pressures, or unintegrated dispositions receiving less."**

  **Applying the Principle Clause-by-Clause to Your Cases:**

  1.  **Aldo ("grudging, thin credit"):** Motivated by abstract *duty* alone. The disposition (duty) is authentic but *not integrated* with his affective self (no sympathy/pleasure). It feels external to his core identity.
      *   *Clause:* "Actions performed from abstract duty... receiving less." Lack of integration lowers credit.
  2.  **Beatrice ("more credit than anyone"):** Motivated purely by intrinsic, authentic *affection*. The disposition (care for mother) is deeply *integrated* into her self; it *is* her core motivation.
      *   *Clause:* "Actions stemming from... inherent care receiving the highest credit." Authenticity and integration are maximal.
  3.  **Cezar ("less than Aldo"):** Motivated by both duty *and* desire for approval. While he has Aldo's motive (+ another), the *desire for approval* introduces an *external pressure* diluting authenticity. Neither motive feels fully owned for its own sake; the approval motive undermines integration.
      *   *Clause:* "Actions performed from... external pressures... receiving less." The approval motive is the key external pressure lowering worth below Aldo's purely internal (if affectless) duty.
  4.  **Dorin ("Full credit — more than Aldo"):** Motivated by cultivated *care*. He consciously *owned* and *integrated* the disposition ("he made the motive his") through effort. The care is now authentic and intrinsic.
      *   *Clause:* "Actions stemming from *cultivated*... care receiving the highest credit." His conscious ownership and integration elevate the worth.
  5.  **Em ("Less credit... second-hand virtue"):** Motivated by real *care*, but the disposition is *unintegrated* – it's experienced as "not quite her own," borrowed from a role. She hasn't *owned* or assimilated it into her authentic self.
      *   *Clause:* "Actions performed from... unintegrated dispositions receiving less." The lack of ownership and authenticity diminishes the worth compared to Beatrice or Dorin.
  6.  **Fenna ("Credit: the falsehood seems beside the point"):** Motivated by a sincere sense of *duty/promise*. While based on a false belief, the *motivating disposition itself (commitment to promise)* is authentic and integrated within her character. The *origin* of the duty is mistaken, but the *disposition* driving the action is real and owned.
      *   *Clause:* The principle focuses on the *disposition driving the action*, not the factual accuracy of its origin. Her disposition (commitment) is authentic and integrated, hence credit. The "falsehood beside the point" aligns perfectly.

  **Verdicts the Principle Would Overturn:**

  1.  **Cezar:** The principle explains *why* you might feel he deserves less than Aldo (the external pressure of approval), but it *doesn't strictly require it*. The principle allows that adding a genuine internal motive (duty) *could* be seen as additive or neutral, not necessarily subtractive. Your intuition that Cezar deserves *less* than Aldo, despite having an additional (external) motive, is the verdict most challenged by this principle. The principle suggests Cezar might deserve *more* than Aldo (duty + internalized desire for belonging?) or *equal* (duty diluted by externality). Your judgment seems to heavily penalize the external pressure component. The principle *can* accommodate your verdict if "external pressures" are seen as significantly degrading worth, but it highlights this as the most counterintuitive point relative to the others.
  2.  **Dorin vs. Em:** The principle **fully supports** your distinct rankings! Dorin *owns* and *integrated* the caring disposition through conscious effort. Em experiences the caring disposition as *unintegrated* and *not her own*. The principle precisely captures this difference ("cultivated and owned" vs. "unintegrated") and justifies Dorin's higher credit. **Your suspicion that they conflict is resolved; the principle validates your ranking.**

  **Gabor (Duty + Cost Misjudgment):**
  *   **Your Verdict Needed:** You go "back and forth."
  *   **Principle's Prediction:** Gabor deserves **credit similar to Aldo ("thin credit")**. The principle focuses on the *authenticity and integration of the motivating disposition* (duty). His *misjudgment of the cost* is analogous to Fenna's false belief about the promise: it's a factual error external to the nature of the motivating disposition itself. His *sense of duty* driving the action is authentic and integrated, even if his calculation is wildly wrong. He acts *from* genuine (if perhaps misguided) duty, believing the cost is high. He gets "thin credit" like Aldo – the duty is real and motivating, but lacks the affective depth or personal ownership seen in Beatrice or Dorin. The magnitude of *perceived* sacrifice doesn't inherently increase moral worth in this system; it's about the source and ownership of the motive.

  **The Hypothetical Character (Engineered Care + Endorsement):**
  *   **Principle's Prediction:** **Full credit, equivalent to Dorin.**
  *   **Reasoning:** The initial engineering without knowledge parallels Em's "second-hand" virtue – the disposition wasn't authentically hers initially. However, **her subsequent discovery and *wholehearted endorsement*** are crucial. This endorsement represents conscious *ownership* and *integration* of the disposition into her authentic self. She makes it her own, just as Dorin did through cultivation. The origin (engineering vs. theatrical role vs. deliberate cultivation) matters less than the *current state of ownership and authenticity*. Her endorsement transforms the engineered disposition into an authentic, integrated part of her character, warranting full credit.

  **In Summary:**
  *   **Core Principle:** Moral worth depends on the **authenticity, integration, and ownership** of the *motivating disposition*.
  *   **Highest Credit:** Inherent or consciously cultivated/owned **care/affection** (Beatrice, Dorin, Endorsed Engineer).
  *   **Medium/Low Credit:** **Abstract duty** (Aldo, Gabor, Fenna) – "thin" because lacking affective integration.
  *   **Reduced Credit:** **External pressures** (Cezar's approval motive) or **unintegrated dispositions** (Em's "second-hand" care).
  *   **Overturned Verdict:** Only **Cezar's** ranking below Aldo is significantly challenged; the principle suggests it might deserve equal or slightly more credit. Your rankings of Dorin > Em and Fenna > [nothing] are strongly supported.
  *   **Gabor:** Deserves Aldo-level "thin credit" for authentic duty, despite cost misjudgment.
  *   **Engineered Character + Endorsement:** Deserves full Beatrice/Dorin-level credit due to conscious ownership/integration.

  This principle prioritizes the character's internal landscape – the relationship between their self and their motives – over the external action or factual accuracy, aligning closely with your literary judgments. Apply it scene-by-scene by asking: "How authentically does *this specific right action* flow from a disposition this character owns and has integrated into their core self?"
