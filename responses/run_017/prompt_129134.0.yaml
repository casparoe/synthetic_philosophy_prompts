prompt: |-
  I'm a TA for an undergraduate game theory course, and I have one fifty-minute section to teach iterated elimination of dominated strategies when the eliminating strategy is allowed to be a mixed one. The students have already done IESDS with pure-strategy dominators and have computed mixed-strategy Nash equilibria, but have never seen the two ideas put together; rationalizability comes next week. Don't explain the material to me — plan how I should teach it. What has to be in place first, and in what order (in particular, where does the convex-hull reading of mixed dominance — the payoff vector lying below the upper envelope of the others — belong, and does anything have to precede it)? What single game should carry the session, and what must it contain and lack: I have in mind one where pure-strategy IESDS is uninformative, where the mixture doing the eliminating is not the uniform one, and where deleting the first strategy opens up a second round — tell me if asking for all three at once overloads the example, and what to drop if it does. Which misconceptions should I expect, and at exactly which point in the sequence do I defuse each? The ones I anticipate are: that the dominating mixture is something the player chooses or announces rather than a hypothetical benchmark; that a mixture of surviving pure strategies automatically survives itself; that a strategy strictly dominated by a mixture could still receive positive probability in some Nash equilibrium; and that order-independence carries over from strict to weak dominance. Finally, give me one question on a game the students haven't seen that would distinguish understanding the procedure from having learned the recipe, and say explicitly what I should refuse to cover at this level.
reasoning: |-
  Okay, the user is a TA for an undergraduate game theory course preparing a fifty-minute section on iterated elimination with mixed strategies. They've outlined specific prerequisites (students know pure IESDS and mixed Nash equilibria) and constraints (rationalizability next week). Their core ask is a structured lesson plan addressing:  
  - Foundational sequencing (especially convex hull visualization timing)  
  - A single game example balancing three desired properties  
  - Targeted misconception handling  
  - One diagnostic question  
  - Explicit scope boundaries  

  Breaking this down:  

  **First, anchoring the "why" is crucial.** Students might see this as mechanical without context. I'll root it in the gap between pure IESDS (limited power) and Nash computation (often tedious). The convex hull insight should follow immediately after defining mixed dominance—it's the visual payoff that makes abstraction concrete. Preceding it only needs the formal definition and a simple 2x2 warm-up to show pure dominance is insufficient.  

  **The game example must multitask but not overwhelm.** A 3x3 matrix can hit all three requested properties if designed tightly:  
  1. **Pure IESDS uninformative:** No pure dominators initially (e.g., Row 1 not dominated by Row 2 or 3 alone)  
  2. **Non-uniform mixture:** Require a mixed strategy (say 60/40) to dominate Row 1  
  3. **Multi-round:** After eliminating Row 1, Column 1 becomes dominated by a mixture of Columns 2/3  
  Dropping any element weakens the lesson—the multi-round aspect is key for iteration pedagogy.  

  **Misconceptions need preemptive strikes at specific points:**  
  - "Dominating mixture as choice": Defuse when first defining dominance by contrasting with Nash play.  
  - "Mixtures automatically survive": Address during the convex hull demo by showing non-binding mixtures.  
  - "Dominated strategies in Nash": Clarify post-elimination when discussing solution concepts.  
  - "Order-independence assumption": Save for the recap after seeing elimination order matters.  

  **The diagnostic question** should test conceptual synthesis, not rote steps. A 3x3 game where:  
  - Pure IESDS does nothing  
  - A mixed strategy eliminates one row/column  
  - But the surviving cell isn't Nash (requiring further iteration or different reasoning)  
  This exposes if they grasp the *purpose* vs. procedure.  

  **What to exclude:** Rationalizability connections, weak dominance pitfalls, and infinite games. Stay focused on finite strict dominance.  

  Pacing will be tight—50 minutes demands ruthless prioritization. The boardwork flow must be drilled: 5 mins motivation, 10 mins definition/convex hull, 25 mins example game, 5 mins misconception Q&A, 5 mins diagnostic tease.
answer: |-
  Here’s a battle-tested plan for your 50-minute section, prioritizing conceptual clarity and addressing your specific requests. The goal is to **build intuition for mixed dominance as a logical extension of pure dominance**, using visualization to anchor understanding.

  **Core Structure & Timing:**
  1.  **Motivation & Gap (5 mins):**
      *   Review: "Pure IESDS eliminates strategies always worse than *one* other pure strategy. What if no such pure dominator exists? Can a strategy still be 'obviously bad'?"
      *   **Example Gap:** Show a simple 2x2 game where pure IESDS does nothing, but a mixed strategy dominates one strategy (e.g., Player 1: U(3,0), D(0,3); Player 2: L(1,1), R(1,1) - U is dominated by mixing D and... wait, need another row. *See main example below*). State: "Mixed dominance extends the power of IESDS."

  2.  **Defining Mixed-Strict Dominance (5 mins):**
      *   "Strategy `s_i` is **strictly dominated** for player `i` if there exists a **mixed strategy** `σ_i` (over `i`'s other strategies) such that: `u_i(σ_i, s_{-i}) > u_i(s_i, s_{-i})` for **every possible** combination of opponents' strategies `s_{-i}`."
      *   **Crucial Contrast:** Emphasize "hypothetical benchmark". Ask: "Is `σ_i` something Player `i` commits to playing? *(No!)* It's a thought experiment: *If* they played `σ_i`, it would *always* beat `s_i`, no matter what others do. So `s_i` is irrational."
      *   **Key Pre-Convex Hull:** Drive home the "for every possible `s_{-i}`" requirement. This is the bedrock.

  3.  **Introducing the Convex Hull / Upper Envelope (10 mins - Immediately after definition):**
      *   **Why now?** The definition is abstract. Visualization makes "for every `s_{-i}`" concrete. This is the core insight.
      *   **How:**
          *   Pick a player (say, Row). Fix the opponents' strategies (Columns).
          *   Plot Row's pure strategies as payoff vectors in |Columns|-dimensional space (2D for 2 opponents, 3D for 3, etc.). Label axes with opponent profiles.
          *   Define the **convex hull** of the payoff vectors of Row's *other* pure strategies.
          *   **Rule:** A pure strategy `s_i` is strictly dominated iff its payoff vector lies **strictly below** (in all coordinates) this convex hull.
          *   **Visual Check:** Show a point inside the hull (survives), on the boundary (weakly dominated - skip details), outside but above (undominated), and crucially, **strictly below** (dominated). Use a simple 2-opponent-profile (2D) example.
      *   **Misconception Pre-emption:** Explicitly state: "A mixed strategy `σ_i` *itself* is just a point inside this hull. Its payoffs are weighted averages. Survival isn't automatic for mixtures; we only *use* mixtures to test pure strategies. We don't add mixtures to the strategy space yet." (Rationalizability does this).

  4.  **The Central Example Game (20 mins):**
      *   **Game:** (Payoffs are Row/Col)
          ```
                  | Col L | Col M | Col R
          --------|-------|-------|------
          **Row A**| 4, 1  | 0, 0  | 1, 0
          **Row B**| 0, 0  | 3, 1  | 0, 0
          **Row C**| 1, 0  | 0, 0  | 4, 1
          ```
      *   **Why this game?**
          *   **Pure IESDS Uninformative:** No pure strategy dominates another initially. (A>B? L: 4>0, M: 0<3, R:1>0 → No. Similar checks for others). Stalemate.
          *   **Non-Uniform Mixture Required:** Show Row A is dominated by a mixture of B and C. Calculate: Need `σ = (p_B, p_C)` s.t.:
              *   vs L: `p_B*0 + p_C*1 > 4`? Impossible! → *Wait, fix opponents first!*
              *   **Correct Approach:** For each *opponent profile*:
                  *   vs L: `p_B*0 + p_C*1 > 4`? → `p_C > 4` → Impossible!
              *   **Mistake Pre-emption:** Pause. "What's wrong? Remember 'for every `s_{-i}`'! We need `σ` to beat A *against every column* simultaneously."
              *   Solve the system:
                  *   vs L: `0*p_B + 1*p_C > 4` → `p_C > 4` (Impossible!)
                  *   vs M: `3*p_B + 0*p_C > 0` → `p_B > 0` (Always true if `p_B > 0`)
                  *   vs R: `0*p_B + 4*p_C > 1` → `p_C > 1/4`
              *   **Revelation:** `p_C > 4` (vs L) is impossible. *Row A isn't dominated?* But look at the matrix! **Targeted Misconception:** "Is A a good strategy? Look at Col L: 4 is great! But what if Col plays M or R? A gives 0 or 1, while B gives 3 vs M, C gives 4 vs R. Maybe A is vulnerable?"
          *   **Fix the Game:** *Swap Row A's payoff vs Col L.* Make it:
              ```
              **Row A**| 1, 1  | 0, 0  | 1, 0  // Changed from 4 to 1
              ```
          *   **Now Solve:**
              *   vs L: `0*p_B + 1*p_C > 1` → `p_C > 1`
              *   vs M: `3*p_B + 0*p_C > 0` → `p_B > 0` (True if `p_B > 0`)
              *   vs R: `0*p_B + 4*p_C > 1` → `p_C > 1/4`
              *   **Solution:** Need `p_C > 1` and `p_C > 1/4`. `p_C > 1` is impossible since `p_C ≤ 1`. Still stuck? **Targeted Insight:** `p_B + p_C = 1`. Set `p_C = x`, `p_B = 1-x`. Now:
                  *   vs L: `0*(1-x) + 1*x > 1` → `x > 1` → **Impossible!**
              *   **Final Fix Needed:** *Make the domination possible.* Change Row A vs L to `0,1`:
              ```
                  | Col L | Col M | Col R
          --------|-------|-------|------
          **Row A**| 0, 1  | 0, 0  | 1, 0  // Now 0,1
          **Row B**| 0, 0  | 3, 1  | 0, 0
          **Row C**| 1, 0  | 0, 0  | 4, 1
          ```
          *   **Now Solve for Row:**
              *   vs L: `0*p_B + 1*p_C > 0` → `p_C > 0`
              *   vs M: `3*p_B + 0*p_C > 0` → `p_B > 0` (True if `p_B > 0`)
              *   vs R: `0*p_B + 4*p_C > 1` → `p_C > 1/4`
              *   Using `p_B = 1 - p_C`:
                  *   vs L: `p_C > 0` (OK if `p_C > 0`)
                  *   vs M: `3(1-p_C) > 0` → `1 - p_C > 0` → `p_C < 1` (Always true for mixtures)
                  *   vs R: `4p_C > 1` → `p_C > 1/4`
              *   **Solution:** Any mixture where `p_C > 1/4` and `p_B = 1 - p_C > 0` (e.g., `σ = (p_B=0.5, p_C=0.5)` or `(0.7, 0.3)`). **Non-uniform!** `(0.5, 0.5)` works: Payoffs (0.5, 1.5, 2) > (0, 0, 1).
          *   **Convex Hull:** Plot A(0,0,1), B(0,3,0), C(1,0,4). Show hull of B&C (line segment). A(0,0,1) is strictly below it (e.g., vs M: 0 < mix of 3&0; vs R: 1 < mix of 0&4).
          *   **Eliminate Row A.**
      *   **Second Round (Columns):** Now game is:
          ```
                  | Col L | Col M | Col R
          --------|-------|-------|------
          **Row B**| 0, 0  | 3, 1  | 0, 0
          **Row C**| 1, 0  | 0, 0  | 4, 1
          ```
      *   **Find dominated Column strategy:**
          *   Col L: (0,0) vs (1,4) for Col? Wait, opponents are Rows!
          *   For Col L: Payoffs (0 if Row B, 0 if Row C) = (0, 0)
          *   For Col M: (1, 0)
          *   For Col R: (0, 1)
          *   Check if Col L dominated: Need `σ_col = (q_M, q_R)` s.t.
              *   vs B: `q_M*1 + q_R*0 > 0` → `q_M > 0`
              *   vs C: `q_M*0 + q_R*1 > 0` → `q_R > 0`
          *   Using `q_M + q_R = 1`:
              *   vs B: `q_M > 0`
              *   vs C: `q_R = 1 - q_M > 0` → `q_M < 1`
          *   **Solution:** Any mixture with `0 < q_M < 1` (e.g., `(0.5, 0.5)`). Payoffs: vs B: 0.5 > 0, vs C: 0.5 > 0. Col L(0,0) is strictly dominated.
          *   **Convex Hull:** Plot L(0,0), M(1,0), R(0,1). Hull of M&R is line segment. L(0,0) is strictly below it.
          *   **Eliminate Col L.**
      *   **Surviving Game:**
          ```
                  | Col M | Col R
          --------|-------|-------
          **Row B**| 3, 1  | 0, 0
          **Row C**| 0, 0  | 4, 1
          ```
      *   **No further dominance (pure or mixed).** Point out the two pure Nash equilibria: (B, M) and (C, R).

  5.  **Key Takeaways & Misconception Address (5 mins):**
      *   **Benchmark, Not Choice:** Reiterate: "The dominating mixture `σ_i` proves `s_i` is irrational. Player `i` doesn't *play* `σ_i`; they simply recognize `s_i` is bad. Nash is separate."
      *   **Mixtures Don't Automatically Survive:** "We only *use* mixtures to eliminate pure strategies. We don't add `σ_i` to the strategy set for future rounds. Only pure strategies remain."
      *   **Dominated Strategies & Nash:** "A strictly dominated strategy (by pure *or* mixed) can **never** be played with positive probability in *any* Nash equilibrium. Why? It's irrational." (This is the core link to future rationalizability).
      *   **Order (In)dependence:** "Like strict pure dominance, mixed strict IESDS is order-independent! The final set is unique. (Contrast this with weak dominance next week)."
      *   **Power:** "Mixed IESDS is stronger than pure IESDS. It eliminates more strategies, getting us closer to the Nash set."

  6.  **Diagnostic Question (5 mins):** Pose this 3x3 game (Player 1 = Row, Player 2 = Col):
      ```
              | Col X | Col Y | Col Z
      -------|-------|-------|------
      **Row A**| 5, 5  | 0, 0  | 0, 0
      **Row B**| 0, 0  | 4, 4  | 0, 5
      **Row C**| 0, 0  | 5, 0  | 3, 3
      ```
      *   **Question:** "Perform iterated elimination of strictly dominated strategies (allowing mixed dominators) on this game. What strategies survive? *Explain your steps, especially how you identified any mixed dominance.*"
      *   **Why it Diagnoses Understanding:**
          *   Pure IESDS does nothing (no pure dominators).
          *   **Critical Insight:** Row A is dominated by a mixture of B & C? Let's check:
              *   vs X: Need `p_B*0 + p_C*0 > 5`? → `0 > 5`? Impossible.
          *   **Correct Target:** Col Z is dominated by a mixture of X & Y.
              *   For Col Z: Payoffs (0 if A, 5 if B, 3 if C) = (0, 5, 3)
              *   For Col X: (5, 0, 0)
              *   For Col Y: (0, 4, 5)
              *   Solve: `σ_col = (q_X, q_Y)` s.t.
                  *   vs A: `q_X*5 + q_Y*0 > 0` → `5q_X > 0` → `q_X > 0`
                  *   vs B: `q_X*0 + q_Y*4 > 5` → `4q_Y > 5` → `q_Y > 5/4` → *Impossible!*
          *   **Alternative Target:** Row B is dominated by a mixture of A & C?
              *   vs X: `p_A*5 + p_C*0 > 0` → `5p_A > 0` → `p_A > 0`
              *   vs Y: `p_A*0 + p_C*5 > 4` → `5p_C > 4` → `p_C > 4/5`
              *   vs Z: `p_A*0 + p_C*3 > 0` → `3p_C > 0` → `p_C > 0` (True if `p_C > 0`)
              *   Using `p_A + p_C = 1` (`p_C = 1 - p_A`):
                  *   vs Y: `5(1 - p_A) > 4` → `5 - 5p_A > 4` → `1 > 5p_A` → `p_A < 1/5`
              *   **Solution:** Any mix with `0 < p_A < 1/5` (e.g., `p_A=0.1, p_C=0.9`). Payoffs: vs X: 0.5 > 0, vs Y: 4.5 > 4, vs Z: 2.7 > 0. Row B **is** strictly dominated. Eliminate Row B.
          *   **Post-Elimination:** Now eliminate Col Z (dominated by X or Y purely? Or mixture? Actually, after B gone, Col Z vs A: 0, vs C: 3. Col X vs A:5, vs C:0. Col Y vs A:0, vs C:5. Pure IESDS: Z dominated by? X: Worse vs C (0<3). Y: Worse vs A (0<0? Equal, not strict). Mixed? Possibly, but A & C survive. The key was spotting Row B's mixed dominance first.
      *   **Distinguishes Recipe vs. Understanding:** Requires identifying a non-obvious dominance (Row B by A/C mix), handling the "for every `s_{-i}`" constraint correctly, and potentially needing a 2nd round. A recipe follower might try to eliminate Row A or Col Z first and get stuck.

  **What to Explicitly Refuse to Cover:**
  1.  **Rationalizability:** "We'll see next week how this connects to beliefs and best responses. Today is purely about dominance as an *irrationality* argument."
  2.  **Weak Dominance (Mixed or Pure):** "Stick to *strict* dominance today. Weak dominance is trickier; elimination order matters, and it can eliminate Nash equilibria. We'll handle that carefully later if needed."
  3.  **Adding Mixed Strategies to the Strategy Space:** "We are only *using* mixed strategies to eliminate pure strategies. We are **not** adding them as new strategies players can choose from. That's different."
  4.  **Infinite Games or Continuous Strategies:** "Focus on finite, matrix games."
  5.  **Formal Proofs of Order Independence:** "Accept that for strict dominance (pure or mixed), the order doesn't change the result. The proof is beyond scope."

  **Materials:** Whiteboard/Projector crucial for drawing payoff tables and convex hull diagrams. Prepare the main example game and diagnostic game clearly. Emphasize process ("for every opponent profile") and visualization. Good luck! This is a conceptually rich topic – your focus on the gap and the visualization will pay off.
