prompt: |-
  Hi — I'm the program officer at the Marlow Fund, a small family foundation. We give away about $5m a year, two program staff (me and one other person), board meets quarterly but we make grant decisions monthly, ~25 grants a year and half of them are renewals. Here's our problem in two parts.

  First: about $1.5m of the annual payout is locked by the donor's will to "work that benefits people who have not been born yet," and the rest is basically unrestricted near-term global health and development. So in the same meeting we score, I dunno, a school-based delivery programme that's been running for six years and a small speculative biosecurity team, and it obviously doesn't work — the units aren't the same, and "do nothing and move the money across" isn't even available in the locked bucket, because the money has to go out the door into that bucket somehow.

  Second: right now we rate every proposal High/Medium/Low on importance, tractability and neglectedness (the three-factor framework you've probably seen floating around the effective-altruism world), turn those into 3/2/1, and multiply. It's silly and we know it. A Medium/Low/High beats a High/High/Low and nobody actually believes that. "Neglectedness" keeps getting scored as "nobody cool is talking about this" rather than as anything to do with money. And our board chair is a retired accountant who says he doesn't want to see any figure with more than one significant digit, while another trustee thinks any cause you can't describe to her mother over dinner is a scam.

  So: give us something we can actually run. Constraints — maybe two hours per proposal, one round of follow-up questions to the applicant, no literature reviews, no outside modelling contractor, and it has to fit on the one-page memo that goes to the board.

  Specifically I want:

  - The order we should establish things in, and what counts as an adequate answer at each step. I suspect we should be checking who else is already funding the space *before* we try to estimate how much good a dollar does, and that tractability should be judged at the margin rather than on average — but you tell me if that's right.
  - How the three factors actually interact, and what to do instead of multiplying, given they clearly aren't independent.
  - Where the procedure stops with a no, and where it has to stop and hand the decision to a person because the question is one of values and not facts.
  - What we do when we can't get a number at all, which is most of the time.
  - How to write the result up so it survives contact with the board: one significant digit, and explainable to someone's mother.
  - Honesty about which steps are judgement dressed up as procedure. I'd rather know now than find out in year three.

  Then run it on three real-ish cases, and at least one should come out in a way I won't like:

  (a) a renewal for a well-run school-based mass deworming / delivery programme that everyone loves, that on the evidence as it stands looks fine, and that at least three bigger funders are already in;
  (b) a cheap speculative research proposal from a tiny team with no track record, testing a mechanism nobody has tested, where the interesting part is the tail outcome and the chance we learn something;
  (c) a community health worker training programme whose numbers look great but which can only roughly double in size per year because of trainer supply.

  Also tell us what the procedure can't do — where it will definately misfire — and don't soften it. We keep tying ourselves in knots in meetings and I'd rather hand the board something with its limits printed on it.
reasoning: |-
  We are designing a grant evaluation procedure for the Marlow Fund with the following constraints:
  - Two staff members, limited time per proposal (about two hours), one round of follow-up questions.
  - Must fit on a one-page memo for the board.
  - Board includes a retired accountant who wants no more than one significant digit and a trustee who wants simplicity.
  - Current system uses High/Medium/Low on Importance, Tractability, Neglectedness (ITN) converted to 3/2/1 and multiplied, but it's flawed.

  Key problems to solve:
  1. The fund has two buckets: $1.5m locked for "work that benefits people who have not been born yet" (long-termist) and the rest for near-term global health and development.
  2. The current scoring system is too simplistic and doesn't account for interdependencies.

  Proposed Approach:

  We need a procedure that:
  - Separates the evaluation for the two buckets because the time horizons and criteria are fundamentally different.
  - Acknowledges that the factors (ITN) are not independent and multiplicative.
  - Uses a decision tree that stops early for clear "no" cases and flags value judgments.
  - Handles both quantifiable and non-quantifiable factors, and when numbers are unavailable, uses qualitative reasoning.
  - Presents results in a simple, board-friendly way.

  Structure of the Procedure:

  We'll break it into two main parts: an initial screening and then a deeper evaluation.

  **Step 0: Bucket Assignment**
     - Determine which bucket the proposal falls into: long-termist (for future generations) or near-term (global health/development). This is a value judgment and must be made by staff. If a proposal could fit both, assign to the more appropriate bucket based on the primary intent.

  **Step 1: Initial Screening (for both buckets)**
     - *Purpose:* Quickly eliminate proposals that are clearly not a fit or have fatal flaws.
     - Check alignment with the fund's mission and the specific bucket.
     - Check for any disqualifying factors (e.g., unethical, illegal, way outside scope).
     - Check if the organization is in good standing (for renewals) and if the proposal is complete.
     - *Time:* 15-20 minutes per proposal.
     - *Outcome:* If any of these checks fail, reject without further review.

  **Step 2: Factor Evaluation (separate for each bucket)**
     We will evaluate the three factors but not by simple multiplication. Instead, we'll use a threshold-based approach and consider interactions.

     For the **near-term bucket** (global health and development):
     - We focus on cost-effectiveness and scalability because the goal is near-term impact.
     - Steps:
       1. **Neglectedness (Funding Landscape):** 
          - Check if other funders are already supporting this work significantly. If the cause is well-funded by others (especially major players) and our grant is not catalytic, then it may be low priority.
          - We are looking for a reason why our funding is needed (e.g., filling a gap, leveraging other funding, testing an innovation that others won't).
          - *Adequate answer:* Identify the top 3-5 funders in the space and their level of investment. If the space is crowded and our grant doesn't change that, score as low neglectedness (which is bad). If we are among the only funders or our grant can unlock something, then high neglectedness (good).
          - If neglectedness is low and we cannot make a strong case for being catalytic, then reject. This step might take 30 minutes.

       2. **Tractability (at the margin):**
          - Assess the additional impact of our grant. We care about the marginal tractability: how much additional good will our specific grant do? This includes:
            - For renewals: What has been achieved with past funding? What will this renewal achieve? (Incremental impact)
            - For new grants: How likely is the project to succeed, and how much will our grant move the needle?
          - *Adequate answer:* Estimate the cost per outcome (e.g., cost per life saved, cost per DALY averted) if possible. If not, use qualitative evidence (e.g., past performance, quality of team, feasibility study). If the marginal cost-effectiveness is poor (e.g., worse than standard benchmarks like GiveWell's top charities), then reject. This step might take 45 minutes.

       3. **Importance (Scale of the problem):**
          - This is about the problem's severity and the potential impact if solved. However, in the near-term context, we often have data on burden (e.g., DALYs). But note: if we passed the first two steps, the problem is likely important enough. So we might use this step to double-check and for comparison.
          - *Adequate answer:* Use available data (e.g., Global Burden of Disease) to get a sense of the problem's scale. If the problem is very small (e.g., affects a tiny population) and the cost per outcome is not outstanding, then reject. But note: if the project is very cost-effective, even a smaller problem might be worth it. This step might be quick (15 minutes) because we already have the context.

     - **Integration of Factors:** Instead of multiplying, we use a sequential filter:
          - Fail Neglectedness? → Reject.
          - Fail Tractability? → Reject.
          - Then, for the remaining, we compare by cost-effectiveness (if quantifiable) or by a holistic assessment of importance and the team's track record.

     For the **long-termist bucket** (benefits future generations):
     - The focus is on the potential for huge long-term impact and the risk of negative outcomes is more critical.
     - Steps:
       1. **Importance (Potential for Impact):**
          - What is the scale of the potential long-term impact? (e.g., existential risk reduction, shaping the far future)
          - *Adequate answer:* A qualitative assessment of the magnitude of the positive outcome (e.g., tiny, moderate, enormous) and the probability of achieving that outcome (low, medium, high). We might use a 2x2 grid (magnitude vs probability) and look for high magnitude and at least low-to-medium probability.

       2. **Neglectedness (Funding Landscape and Attention):**
          - Who else is working on this? If it's a crowded field, then our impact is diluted. We are looking for areas that are overlooked.
          - *Adequate answer:* List of other organizations/funders and their level of activity. If there are no other funders and the problem is important, then high neglectedness.

       3. **Tractability (Feasibility and Path to Impact):**
          - How likely is the project to succeed in making progress? Given the uncertainty in long-termist work, we look for clear pathways (e.g., research that could lead to policy, or a prototype that could be scaled).
          - *Adequate answer:* Evidence of the team's ability to execute, a plausible theory of change, and milestones.

     - **Integration for Long-termist:** 
          - We are looking for projects that have a chance of enormous impact (high importance) and are neglected. Tractability might be lower but we accept that in this bucket.
          - If a project has low importance (small potential impact) or low neglectedness (crowded field) and we can't be catalytic, then reject.
          - Then, among the remaining, we prioritize by the product of (magnitude of impact) * (probability of success) / (funding already in the space) — but this is highly speculative.

  **Step 3: Comparison and Decision**
     - For each bucket, we rank the proposals that passed the filters. We use:
          - For near-term: Cost-effectiveness (if available) or a qualitative assessment of impact per dollar.
          - For long-termist: The expected value (magnitude * probability) adjusted for neglectedness (e.g., if we are one of few funders, our impact is higher).
     - We acknowledge that for long-termist projects, numbers are often unavailable, so we rely on expert judgment.

  **Step 4: Value Judgments**
     - Where the procedure stops and hands off to human judgment:
          - Bucket assignment (long-term vs near-term) is a value judgment.
          - When there is a tie or close call, we use staff judgment.
          - When the evidence is ambiguous, we use conservative assumptions (e.g., reject if in doubt).
          - For long-termist work, the assessment of "potential magnitude" is inherently subjective.

  **Step 5: Presentation to the Board**
     - For each proposal, we prepare a one-page memo with:
          - Bucket: Long-term or Near-term.
          - Summary of the project (one sentence).
          - Key Metrics (using one significant digit when possible, or qualitative labels):
              - Near-term: Cost per outcome (e.g., $ per DALY averted) and comparison to a benchmark (e.g., "similar to [top charity]"). If not quantifiable, use: "High", "Medium", "Low" for cost-effectiveness.
              - Long-termist: Potential Impact (e.g., "Very high" if existential risk reduction, "High" for major long-term benefit) and Probability of Success (e.g., "Low", "Medium", "High"). Neglectedness: "High" if few funders, "Low" if many.
          - Our Recommendation: Fund or not, and at what level.
          - Key Reasons: 2-3 bullet points explaining the decision in simple terms (e.g., "This project addresses a critical gap in an underfunded area" or "Cost per life saved is very low").
     - We avoid complex calculations and use qualitative labels when numbers are not available.

  **Handling Cases Where We Can't Get a Number:**
     - We use qualitative scales (High, Medium, Low) and explain the reasoning. For example, "We cannot estimate a precise cost per outcome because of data limitations, but we judge the cost-effectiveness as High based on similar interventions and the team's track record."

  **What the Procedure Can't Do (Limits):**
     1. It cannot eliminate judgment. Especially for long-termist work, much is speculative.
     2. It might reject a project that is important and tractable but not neglected (because we don't want to fund what's already well-funded) even if it's good.
     3. It might be too conservative for high-risk, high-reward projects if the tractability step is too strict. We might adjust by having a separate category for "moonshots" in the long-termist bucket.
     4. It does not handle cross-bucket comparisons. We decide the allocation between buckets at the start of the year (e.g., $1.5m for long-termist, $3.5m for near-term) and then evaluate within buckets.

  Now, let's run the three test cases:

  **Case (a): Renewal for a well-run school-based mass deworming / delivery programme**
     - *Bucket:* Near-term (global health).
     - *Initial Screening:* Pass (aligned, well-run).
     - *Neglectedness:* Check funding landscape. If at least three bigger funders are already in, then neglectedness is low. Unless our grant is catalytic (e.g., keeping the program running in a specific area that others don't cover), we would reject due to low neglectedness. But if the program is at risk of ending without our renewal, then we might be catalytic. However, the problem states that the evidence looks fine and bigger funders are in, so likely low neglectedness → Reject.
     - *Result:* Reject. This might be unpopular because everyone loves it, but our procedure says that if others are funding it, we should move on to more neglected areas.

  **Case (b): Cheap speculative research proposal from a tiny team with no track record, testing a mechanism for tail outcomes**
     - *Bucket:* Long-termist (because it's about learning something that could have long-term implications).
     - *Initial Screening:* Pass (if aligned with long-termist goals).
     - *Importance:* Potential for huge impact in the tail? If yes, then high importance. But probability might be low. We need to assess: is the mechanism one that could lead to a major breakthrough? If yes, then high magnitude and low-to-medium probability → acceptable for long-termist.
     - *Neglectedness:* Is this research being done by others? If the team is the only one or among very few, then high neglectedness.
     - *Tractability:* The team has no track record, but the proposal is cheap and the mechanism is novel. We might rate tractability as low to medium. But in long-termist work, we accept lower tractability if importance and neglectedness are high.
     - *Result:* Likely fund, because it's cheap, high potential, and neglected. But we must ensure the team has the basic competence to run the project (via follow-up questions). If the team seems unqualified, then reject.

  **Case (c): Community health worker training programme with great numbers but scalability limited by trainer supply (can only double per year)**
     - *Bucket:* Near-term.
     - *Initial Screening:* Pass.
     - *Neglectedness:* Check if others are funding similar programs. If not, then high neglectedness. If yes, then low. But note: even if others are funding, if our grant can help them double (and doubling is valuable) then we might be catalytic. However, the constraint is trainer supply, so our money might not speed up growth? We need to ask: will our grant allow them to train more trainers? If not, then our grant just replaces other funding (low additionality) → then neglectedness is low. If we can help them train more trainers, then we are catalytic.
     - *Tractability:* The numbers look great (high cost-effectiveness). But the marginal impact of our grant: if we give them more money, can they use it effectively? If the bottleneck is trainer supply and we are not addressing that, then the marginal impact might be low (they can't spend the money effectively). We must assess: what exactly will the grant do? If it directly addresses the bottleneck (e.g., funding to train more trainers), then high tractability. Otherwise, low → reject.
     - *Result:* If the grant is designed to address the bottleneck (e.g., by training more trainers), then it passes. Otherwise, reject.

  **Summary of Limitations:**
     - The procedure is less reliable for long-termist work because of high uncertainty.
     - It might reject good projects that are not neglected, even if they are effective.
     - It relies on staff's ability to accurately assess the funding landscape and the catalytic potential of a grant.
     - It does not account for non-quantifiable benefits (e.g., building field capacity) unless we explicitly include them in the factors.

  Final Thoughts:
  We are replacing the multiplication with a sequential filter that prioritizes neglectedness and tractability (at the margin) and then uses cost-effectiveness (for near-term) or expected value (for long-term) for ranking. We stop early for clear "no"s to save time. We are explicit about where judgment is required.

  This procedure should fit within the time constraints and the one-page memo. We use qualitative labels and simple explanations for the board.
answer: |-
  Below is a practical, step-by-step grant evaluation procedure designed for the Marlow Fund's constraints. It replaces your multiplicative ITN scoring with a **sequential decision tree** that prioritizes neglectedness first (to avoid crowding), uses marginal tractability, and separates value judgments from evidence-based analysis. The output is board-ready: one significant digit for quantifiable elements and plain-English explanations.

  ---

  ### **The Procedure: Sequential Evaluation Tree**
  **Time Budget:** 2 hours/proposal (including follow-up questions).  
  **Output:** One-page memo with clear recommendations.  
  **Core Principle:** "Fail fast" on clear disqualifiers; use thresholds, not multiplication.  
  **Key Change:** Evaluate factors in order—**Neglectedness → Tractability (marginal) → Importance**—because funding crowded areas or inflexible projects wastes time on Importance.

  #### **Step 0: Assign to Bucket (Value Judgment)**  
     - **Question:** Is this primarily for near-term impact (global health/development) or future generations (locked bucket)?  
     - **Adequate Answer:**  
       - Near-term: Direct, measurable outcomes within 10 years (e.g., health interventions).  
       - Long-term: Focuses on future populations (e.g., biosecurity, AI safety, climate tail risks).  
     - **Stop if:** Proposal doesn’t fit either bucket (e.g., arts funding).  
     - **Judgment Call:** Staff decides based on primary goal. No numbers here.

  #### **Step 1: Neglectedness Check (45 mins)**  
     - **Question:** "Is there a funding gap we can uniquely fill?"  
     - **Adequate Answer:**  
       1. Map the funding landscape:  
          - Identify top 3-5 funders in the space and their total annual spend (via public reports, follow-up Qs, or informed estimates).  
          - Estimate current funding as % of the "funding gap" (total needed to solve the problem).  
       2. Assess Marlow’s role:  
          - "Catalytic test": Would our grant unlock new capacity/knowledge others won’t? (e.g., seed funding for untested ideas, bridging grants).  
     - **Scoring:**  
       - **High Neglectedness:** <30% of funding gap covered AND/OR we’re uniquely catalytic.  
       - **Medium:** 30–70% covered, but we add marginal value (e.g., targeting underserved region).  
       - **Low:** >70% covered AND no catalytic role.  
     - **Stop if Low Neglectedness → Reject.**  
     - *Why first?* Avoids wasting time on crowded areas. "Neglectedness" is now defined by money, not buzz.  
     - **When you can’t quantify:** Use proxies (e.g., "No major funders in this subfield per expert interviews") or default to Medium if uncertain.

  #### **Step 2: Marginal Tractability (45 mins)**  
     - **Question:** "How much additional impact will our specific grant achieve?"  
     - **Adequate Answer:**  
       - For near-term: Estimate **marginal cost per outcome** (e.g., $/DALY averted, $/life saved) with and without Marlow’s grant.  
         - *Example:* Deworming renewal: If $1M grant averts 10,000 DALYs alone but only 500 extra DALYs if added to existing funding, use the 500.  
       - For long-term: Assess **probability of critical milestones** (e.g., "60% chance of Phase 1 trial completion").  
     - **Scoring (Thresholds):**  
       - Near-term:  
         - **High Tractability:** Marginal $/outcome ≤ 50th percentile of past grants (e.g., <$200/DALY).  
         - **Medium:** Between 50th–75th percentile.  
         - **Low:** >75th percentile or no path to scale.  
       - Long-term:  
         - **High:** ≥50% chance of achieving key milestone.  
         - **Medium:** 20–50% chance.  
         - **Low:** <20% chance.  
     - **Stop if Low Tractability → Reject.**  
     - *Why marginal?* Averages hide diminishing returns.  
     - **When you can’t quantify:** Use benchmarks (e.g., "Comparable to bednet distribution at $100/DALY") or qualitative labels (see Step 5).

  #### **Step 3: Importance (30 mins)**  
     - **Question:** "What’s the scale of the problem we’re solving?"  
     - **Adequate Answer:**  
       - Near-term: Size of affected population × severity (e.g., DALYs in the target region).  
       - Long-term: Magnitude of tail risk (e.g., "AI misalignment could impact billions").  
     - **Scoring (Pass/Fail Threshold):**  
       - **Pass:** Problem affects ≥100K people (near-term) OR global catastrophic risk ≥1% probability (long-term).  
       - **Fail:** Smaller scale (e.g., hyper-local issue with no spillover).  
     - **Stop if Fail → Reject.**  
     - *Why last?* Importance matters least if the grant isn’t catalytic or feasible.  
     - **When you can’t quantify:** Default to Pass (most proposals clear this bar).

  #### **Step 4: Final Ranking (If Competing)**  
     - **Compare survivors using:**  
       - Near-term: **Marginal $/outcome** (lower = better).  
       - Long-term: **Expected value = Probability of success × Magnitude of impact** (use ranges: e.g., 1–10M future lives affected).  
     - **No multiplication:** Use thresholds and qualitative tiers (e.g., "Top 20% of past grants").

  #### **Where Judgment Replaces Procedure**  
     - **Explicitly subjective steps:**  
       1. Bucket assignment (Step 0).  
       2. "Catalytic test" in Neglectedness (e.g., "Is this team uniquely positioned?").  
       3. Probability estimates for long-term tractability.  
     - **When staff must decide:** If a proposal passes all thresholds but feels wrong (e.g., ethical concerns), override and document why.

  ---

  ### **Board Memo Template**  
  **1. Bucket:** [Near-term / Long-term]  
  **2. Recommendation:** [Fund / Reject]  
  **3. Key Numbers (1 significant digit):**  
     - Neglectedness: [% funding gap covered] OR [Catalytic? Yes/No]  
     - Marginal $/outcome: [e.g., $100/DALY] OR [Milestone probability: e.g., 40%]  
     - Importance: [e.g., 1M people affected]  
  **4. Explain to Your Mother:**  
     - *Example:* "We’re backing a team testing solar-powered vaccines because:  
       1. Nobody funds this in Africa (gap),  
       2. Our $250K builds a prototype that could help 500K kids if it works,  
       3. It’s a big problem—1.2M kids die yearly from vaccine-preventable diseases here."  

  ---

  ### **Test Cases**  
  #### **(a) Deworming Renewal (Near-term)**  
     - **Step 0:** Near-term bucket.  
     - **Step 1 (Neglectedness):**  
       - 3+ big funders already in → Funding gap >70% covered.  
       - Marlow’s renewal isn’t catalytic (program runs without us). → **Low Neglectedness → REJECT**.  
     - **Memo to Board:**  
       > "Reject renewal. Why? Great program, but others fund it fully. Our $ won’t add new value. We’ll redirect to neglected areas."  
     - *Why you’ll hate this:* It rejects a "safe" grant, but frees up funds for higher-margin opportunities.

  #### **(b) Speculative Biotech Research (Long-term)**  
     - **Step 0:** Long-term bucket (benefits unborn via risk reduction).  
     - **Step 1 (Neglectedness):**  
       - No one studying this mechanism → Funding gap >90% uncovered. → **High Neglectedness**.  
     - **Step 2 (Tractability):**  
       - Cheap grant ($50K). 10% chance of a breakthrough, but 90% chance of useful negative data. → **Medium Tractability** (passes 20% threshold).  
     - **Step 3 (Importance):**  
       - Tail risk: Could prevent a pandemic. → **Pass**.  
     - **Verdict:** Fund.  
     - **Memo to Board:**  
       > "Fund $50K. Why? 1. Zero other teams on this, 2. Even if 90% fails, we learn critical info, 3. Preventing pandemics protects our grandkids."  

  #### **(c) Health Worker Training (Near-term)**  
     - **Step 0:** Near-term bucket.  
     - **Step 1 (Neglectedness):**  
       - Few funders in this region → Funding gap ~50% covered. Our grant trains trainers to ease bottlenecks. → **Catalytic → High Neglectedness**.  
     - **Step 2 (Tractability):**  
       - Marginal $/DALY: $150 (good vs. benchmarks). But scaling capped at 2x/year → still **High Tractability** (additional trainers = faster growth).  
     - **Step 3 (Importance):**  
       - Targets 500K high-risk patients. → **Pass**.  
     - **Verdict:** Fund.  
     - **Memo to Board:**  
       > "Fund $300K. Why? 1. Fills a gap in trainer funding, 2. $150/life saved (cheaper than hospitals), 3. Reaches half-million high-risk moms/kids."  

  ---

  ### **Where the Procedure Will Misfire (No Softening)**  
  1. **False Negatives on "Sure Bets":**  
     - Deworming-style programs (Case A) will often be rejected due to low neglectedness, even if effective. This is intentional—your locked bucket forces high-risk/high-reward bets elsewhere.  
  2. **Long-Termist Grants = Garbage In, Garbage Out:**  
     - Subjective probability estimates (e.g., "10% chance of AI alignment breakthrough") can be arbitrary. A skeptical board member will tear this apart.  
  3. **Ignores Non-Quantifiable Impact:**  
     - Capacity-building, field ecosystem effects, or advocacy won’t be captured unless folded into "catalytic" criteria.  
  4. **Renewals Are Penalized:**  
     - Successful programs become victims of their own success (lower neglectedness over time). This may incentivize grantees to hide progress.  
  5. **Bottlenecked Scalability (Case C) Gets a Pass:**  
     - The procedure rewards catalytic potential even with scaling limits. If the board hates constraints, this will frustrate them.  

  ---

  ### **Implementation Checklist**  
  - **Before Year 1:** Calibrate thresholds with past grants (e.g., "What’s our median $/DALY?").  
  - **Staff Training:** Use a 2x2 grid for neglectedness (funding gap % vs. catalytic role) and tractability (marginal impact vs. certainty).  
  - **Board Buy-In:** Frame as "We reject good projects to fund great ones." Pre-wire the chair by showing how it simplifies decisions (e.g., "No more multiplying 3s and 2s!").  

  This system prioritizes your locked bucket’s mandate, reduces board debate by front-loading rejections, and makes tradeoffs explicit. It won’t eliminate judgment—but it will contain it to defined steps.
