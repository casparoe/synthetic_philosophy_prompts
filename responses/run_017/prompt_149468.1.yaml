prompt: |-
  Longtime lurker, occasional commenter, been reading the same handful of blogs since the sequences days, which means I've seen roughly nine thousand comments that say "oh, that's just X" when it obviously isn't X. I want to preempt a few of those.

  There's a pattern I keep bumping into and I don't have a word for it. And I don't just want a word — I want the boundaries, because I keep wanting to point at it in arguments and I can't tell where it stops.

  Three instances:

  1. My transit authority ripped the big printed network maps out of the stations and put up QR codes for a trip planner. The app is genuinely better: real-time, reroutes around closures, tells you which elevator is out. Nobody there sat down and decided to make things worse for people without smartphones — they'd be horrified, and I believe them. And the paper timetable is technically still "available": you can ask at the one staffed station, between 9 and 5, or have one mailed to you. The practical result is that getting across town without a charged phone and a data plan is now a thing you plan a day ahead and have to be a bit of a nuisence about.

  2. My kid's school moved permission slips, report cards and lunch money into one portal. Parents without reliable home internet aren't blocked — there's a computer in the library, and the office will print things for you. But doing it the old way now means turning up in person during office hours and visibly being the person who needs help. Two parents I know have quietly stopped receiving the notices.

  3. My building swapped the concierge for package lockers. If your parcel doesn't fit, or the lockers are full, it goes to a depot across town, open weekdays, reachable by car. Same shape: the new system is better for most people, and what it does to the rest happens entirely in the part of the system nobody designed.

  What I think I'm seeing: the political effect isn't in the artifact at all. It's in the absence the artifact leaves behind. The old way doesn't get banned; it gets demoted from a default to a favour you request, in person, during business hours, from someone who can say no. So the distributional consequence lives in the fallback, and the fallback is never designed, voted on, or costed — it's just whatever is left over. And the artifact looks completely neutral right up until you ask what happens to someone who can't use it. At which point the standard reply is "it's still available, nobody is excluded," which is literally true and feels like it's answering a different question.

  Things I've already had tried on me that I don't think are it:

  - "Digital divide." That names a gap between people who have a thing and people who don't. But here the new artifact is better for the people on the wrong side of the gap too, and the harm comes from the demotion of the old default, not from the gap. I'm genuinely unsure whether closing the gap would fix my cases or not — that's part of what I want carved.
  - "Moloch" / race-to-the-bottom / multipolar trap. No: nobody here is competing, and the people who adopted the artifact weren't forced into it by anyone else's adoption. They'd have chosen differently if the fallback had been on the agenda at all.
  - The famous essay about the parkway overpasses built too low for buses to get under. That's the closest thing I know, and I think it's still the wrong shape: there the politics is in the design and in normal operation, and there's someone who wanted it. In my cases, if you look only at the artifact doing its job there is nothing political to find. The politics is entirely in a state of the world in which the artifact isn't working for you.

  So: is there an established concept for this — in the technology-and-politics literature, STS, design theory, wherever it actually lives — and if it's only near something established, what's the nearest thing and exactly how does my pattern differ from it?

  A couple of sub-questions I care about, because I think they're where the edges are:

  - Is the humiliation component part of this thing or separate? In instance 2 the fallback isn't just costly, it's costly in a way that makes you a visible supplicant. Does that belong inside the concept, or is it a distinct effect that merely co-occurs?
  - What about a case where the fallback is genuinely fine — say the mailed timetable is nicer than the old station rack, and arrives in two days? The default still moved. Is it still my phenomenon?
  - What about an artifact that gets added without anything being displaced, so the old default stays the default? I want to say "no politics," but I'm not confident.

  Format, please:

  - **"If it has a name"** (~120 words): straight yes-or-no answer up front, don't bury it.
  - **"Nearest misses"** (~350 words): at least three established neighbours, how my pattern differs from each, and which one fits best — including why "digital divide" and the overpasses essay are and aren't it.
  - **"The carve"** (~250 words): a definition tight enough that I can apply it to a new case, with what has to be true for it to count.
  - **"Edge cases"** (~200 words): the three above — dignitary cost, an actually-good fallback, and addition without displacement.
  - **"What to call it"** (~60 words): if it's unnamed, a term and a one-line gloss.
reasoning: |-
  Okay, the user is describing a recurring pattern they've observed in various systems where a new, more efficient artifact (like a digital app) replaces an old default (like paper maps), leading to unintended negative consequences for certain groups. They want to know if this phenomenon has a name, how it differs from similar concepts, and how to define its boundaries clearly.

  Hmm, this feels familiar but not exactly matching any single established term. First, I need to confirm whether there's a direct name for this. From what I know in STS and design theory, concepts like "accessibility erosion" or "technological abandonment" come close but aren't perfect fits. The core issue seems to be the systemic demotion of fallbacks rather than the technology itself. 

  Looking at their examples: the transit maps replaced by QR codes, school portals replacing paper forms, package lockers replacing concierges. In each case, the old system isn't banned but becomes a hassle to access - requiring special requests, in-person visits, or dealing with stigma. The harm emerges from how the fallback operates, not the new system's design. 

  Now for nearest misses: 
  "Digital divide" is about access gaps, but here the harm persists even if access were equalized because the humiliation and friction remain. 
  The "low bridge effect" from the famous essay involves intentional exclusion through design, unlike these cases where exclusion is unintentional. 
  "Collateral damage" describes unintended harm but misses the systemic downgrading aspect. 
  "Structural inequity" comes closest but is too broad. 

  For the carve, the defining elements are: 1) replacement of a default service, 2) retention of legacy access as fallback, 3) systemic degradation of that fallback (inconvenience, stigma), 4) harm emerging from the fallback's operation, and 5) no malintent. 

  Edge cases: 
  The humiliation component (like parents feeling judged) seems integral - it's part of how the fallback becomes burdensome. 
  If the fallback were actually better (say mailed timetables being superior), it might still qualify if the default changed, but the harm would be reduced. 
  Addition without displacement (keeping both as equal options) likely wouldn't trigger this phenomenon. 

  Since no perfect term exists, I'll suggest "fallback degradation" - capturing how the residual access point becomes worse through neglect. The gloss would focus on how systems harm by not designing their own contingency paths. 

  The user seems frustrated by how this pattern evades discussion - they want language to make it visible in policy debates. Their examples show sharp observation of systemic blind spots. I'll emphasize the "non-deliberate but patterned" nature in the response.
answer: |-
  ### **If it has a name**  
  **No.** This pattern lacks a universally accepted term. While adjacent concepts exist (e.g., "accessibility erosion," "technological abandonment"), none precisely captures the *systemic demotion of fallbacks* as the locus of harm. It’s a gap in the literature.  

  ---

  ### **Nearest Misses**  
  1. **Digital Divide**:  
     Focuses on *access gaps* (e.g., lacking devices/internet). **Difference**: Your cases involve harm persisting *even if access were equalized*. The core issue is the *degradation of the fallback pathway* (e.g., humiliation, friction), not the gap itself. Closing the digital divide might not resolve the dignitary or logistical costs of using demoted alternatives.  

  2. **Low Bridge Effect** (from the parkway overpasses essay):  
     Highlights *intentional design exclusion* (e.g., bridges too low for buses to segregate communities). **Difference**: In your cases, exclusion is *unintended* and emerges from *neglect of the fallback*, not malice or explicit design. The artifact isn’t weaponized; its aftermath is unplanned.  

  3. **Collateral Damage / Unintended Consequences**:  
     Broadly describes harms from well-meaning actions. **Difference**: Your pattern is *structural and predictable*: it arises specifically when a *default service is replaced*, leaving a *degraded, residual fallback*. It’s not incidental but systemic to transitions that ignore contingency design.  

  4. **Structural Inequity**:  
     Explores systemic biases in institutions. **Closest fit**, but it’s an umbrella term. Your pattern is a *specific mechanism* within this: inequity via *default erosion*, where harm flows from the *practical undesign* of fallbacks.  

  **Best Fit**: **Structural inequity** frames it broadly, but your phenomenon is its *operational subcomponent*—**fallback degradation**.  

  ---

  ### **The Carve**  
  **Your phenomenon occurs when**:  
  1. A *default service/artifact* (e.g., paper maps, in-person forms) is **replaced** by a new one (e.g., app, portal).  
  2. The legacy option is **retained as a fallback** but **demoted** in status (e.g., non-default, gated, or stigmatized).  
  3. The fallback’s operation is **systemically degraded**: requiring extra steps (in-person requests), temporal restrictions (business hours), or dignitary costs (visible supplication).  
  4. Harm arises **not from the new artifact** but from the **friction/humiliation of accessing the fallback**.  
  5. This degradation is **unintended and unexamined**—never designed, costed, or governed.  

  **Key differentiator**: Politics resides in the *unregulated transition* of the old default to a *residual category*, not in the new artifact’s function.  

  ---

  ### **Edge Cases**  
  1. **Humiliation Component**:  
     Integral to the pattern. Degradation isn’t just logistical (e.g., mailing delays) but *social*: fallbacks become "favors" that mark users as outliers. Removing stigma alone wouldn’t fix it—friction remains—but the dignitary cost *intensifies* harm. It belongs inside the concept.  

  2. **Genuinely Good Fallback**:  
     If the fallback is *better* than the old default (e.g., mailed timetable is superior), it’s **not your phenomenon**. The core requires the fallback to be *worse in practice* due to demotion (e.g., delays, effort). The *default shift* alone is neutral; harm needs degradation.  

  3. **Addition Without Displacement**:  
     **No politics per your pattern**. If the old default remains co-equal (e.g., paper timetables still in stations *alongside* QR codes), exclusion isn’t systematized. Harm requires the old option’s *active demotion*.  

  ---

  ### **What to Call It**  
  **Fallback Degradation**:  
  *The systemic erosion of access and dignity when legacy services are demoted to residual fallbacks during transitions, creating unintended exclusion.*  
  **Gloss**: Harm emerges not from new systems but from how old defaults become undesignated burdens.  

  Use this to spotlight the *contingency blind spot* in policy/design: "Did you cost the fallback?" or "Is the alternative *default-worthy*?"
