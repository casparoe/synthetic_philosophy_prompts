prompt: |-
  I work as a consultant helping large technical organizations write down, in a form that can actually be implemented, the decision procedures they are already using informally. For the past couple of years I have been stuck on one client: a standards body with a few thousand eligible participants, heavy turnover, and roughly two hundred people turning up to any given vote, deciding repeatedly over a small set of recurring options that get re-described slightly on each pass (so the 2019 "Option B" is arguably the same thing as the 2023 "Option D-prime", which is part of why this is hard). They have no written rule, only a ten-year archive of minutes. I tried to reconstruct the aggregation from the archive, and the reconstruction appears to have four features that I am fairly confident are not supposed to coexist: it is anonymous, in that permuting the participants never changes the outcome; it respects unanimity, in that if every participant ranks x above y then the group does too; the group's ranking of x against y depends only on the participants' rankings of x against y — I tested for spoiler effects by finding several occasions where the same pair appeared on ballots with different third options, and the ranking never flipped; and the reconstructed group ordering is transitive, with no cycle anywhere in ten years of records.

  The part I cannot account for is this. As I learned it, Arrow's result says that these four features, with more than one participant and more than two options, force a dictator — some individual whose preference between any pair is the group's preference. I cannot find one. For every individual I test, there is a decision in the archive where the group went the other way. Nor is there a small fixed group doing it: the sets of people on the winning side vary from question to question, and the intersection of all the winning sets across every decision I have is empty. So I went looking for structure in the winning sets instead, and here is the pattern I think I see, which is the thing I want a name for. Call a set of participants *sufficient* if, whenever the members of that set all agree on how to rank some pair and the people outside it disagree in any way at all, the group's ranking is theirs. Then, as far as I can tell from the minutes: any superset of a sufficient set is sufficient; the intersection of any two sufficient sets is itself sufficient; and, most surprisingly, for every set of participants you care to name, either it or its complement is sufficient. Nobody wrote any of this down. No one at the organization can point to a person or a subcommittee whose judgment is doing the work. The procedure simply behaves as though somebody were deciding, without there being anybody.

  So, two things. First: does this configuration have an established name, and what are its exact preconditions — in particular, does it require an infinitely large electorate? This body is finite at any given moment, though open-ended and growing, and I suspect that distinction is where my puzzle either dissolves or gets interesting; if the finite case forces one of my four features to fail, tell me which one and describe the nearest configurations that do survive. Second, and more importantly: I do not want a label, and I do not want a reading list, since I have no access to a library and cannot chase down references. I want the carving. What exactly is this phenomenon, and what is it not — how does it differ from an ordinary dictatorship, from an oligarchy or a fixed decisive minority, from an arrangement where someone merely has veto power, and from a rule that avoids cycles only because the awkward pairs never happen to come to a vote? Where are its edges, and what would count as a case that merely looks like it? If nothing established fits, say so and give me a term with a definition and the boundary cases that fix it. A colleague thinks I am reading noise in a small archive; if that is the right diagnosis, tell me what she would have to show to establish it. Please answer in American English.
reasoning: |-
  Okay, let me tackle this consultant's problem. They're stuck decoding a standards body's unspoken decision rules from meeting minutes. The reconstructed method seems to defy Arrow's theorem by being anonymous, unanimous, pairwise-independent, and transitive without a dictator. The key clue is these "sufficient sets" where agreement within the set forces the outcome, with bizarre properties: closed under supersets and intersections, and every set is either sufficient or its complement is.  

  First, I need to verify if this setup is mathematically possible. Arrow's theorem requires a finite number of voters, but here the organization is growing over time. That's crucial—maybe the "infinite electorate" loophole applies? Scanning my memory, I recall Kirman-Sondermann's 1972 work on ultrafilters: for infinite electorates, non-dictatorial Arrovian systems can exist if they're "ultrafilter-based."  

  The sufficient sets exactly match an ultrafilter: closed upward, closed under intersection, and every set or its complement is in. But ultrafilters on finite sets are dictatorship! That's why the consultant can't find a dictator—the electorate isn't fixed. Each vote uses ~200 participants from a pool of thousands, so effectively infinite.  

  Now to carve the phenomenon:  
  - **Not a dictatorship**: No single voter always wins.  
  - **Not oligarchy**: The "sufficient" sets vary; no fixed elite.  
  - **Not veto power**: Veto would mean blocking decisions, but here sufficient sets force positive outcomes.  
  - **Not agenda avoidance**: Transitivity holds empirically across all votes.  

  The core is that the rule acts like a rotating dictator: for any decision, some (unknown) minimal sufficient set exists, and their agreement decides. But since the electorate shifts, no individual is always pivotal.  

  Boundary cases:  
  - If the electorate were finite, this would collapse to dictatorship.  
  - If "sufficient" sets weren't closed under intersection, it might be a prefilter but not ultrafilter.  
  - If not every set/or complement was sufficient, it could be a coalition structure without full decisiveness.  

  For the noise argument: The colleague would need to show either (1) cycles existed but weren't recorded, or (2) the sufficient set properties fail for some untested set pair. But with 10 years of data and clean pairwise tests, that seems unlikely.  

  Term proposal: **Ultrafilter Social Welfare Function**—specifying it requires an infinite set of "potential voters," with decisions based on the current finite subset.  

  Finally, practical implications: The organization might not need formal rules! The emergent behavior is consistent and cycle-proof. The consultant could document the sufficient set properties as de facto procedure.
answer: |-
  Based on your description, what you've reconstructed is **not noise**—it's a mathematically coherent (though rare in practice) phenomenon. It violates Arrow's Theorem **only because the electorate is effectively infinite**, which dodges the "finite voters" requirement. Here's the precise carving:

  ### 1. **What This Is: An Ultrafilter-Based Social Choice Rule**
     - **Name**: This is a **non-dictatorial ultrafilter** (specifically, a **free ultrafilter**) on the set of participants. Arrow's impossibility holds for finite electorates, but with infinitely many potential voters, such rules exist mathematically.
     - **Preconditions**:
       - **Infinitely many "potential voters"**: Your electorate isn't truly infinite, but it's **unbounded and open-ended** (thousands eligible, heavy turnover). Crucially, no single finite set of voters is "the whole electorate" permanently. Each vote uses a finite subset (~200), but the pool grows indefinitely.
       - **Independence of Irrelevant Alternatives (IIA)**: Your pairwise tests confirm this—only rankings of *x* vs. *y* matter for *x* vs. *y*.
       - **Anonymity & Unanimity**: As you observed.
       - **Transitivity**: Empirically holds in the archive.
     - **Why no dictator?** In infinite electorates, ultrafilters can be "free" (no single voter has dictatorial power). Instead, "decisiveness" is delegated to ever-shifting coalitions.

  ---

  ### 2. **The Carving: What It Is and Is Not**
  Your "sufficient sets" define the ultrafilter. Let’s dissect how this differs from known structures:

  | **Compared to:**               | **How This Differs**                                                                 |
  |--------------------------------|--------------------------------------------------------------------------------------|
  | **Dictatorship**               | No single voter always wins. For any individual, there’s a vote where they lost. The "dictator" is a phantom—decisiveness floats. |
  | **Oligarchy / Fixed Minority** | No fixed group controls all decisions. Sufficient sets vary across votes, and their intersection is empty. |
  | **Veto Power**                 | A veto player can block outcomes but not force them. Here, a sufficient set can **force** their preference (e.g., if they agree on *x* > *y*, the group ranks *x* > *y* even if others dissent). |
  | **Agenda Avoidance**           | You tested pairs across different ballots—cycles didn’t occur even when "awkward" pairs were voted on. Transitivity is baked into the rule. |
  | **Majority Rule**              | Majority rule isn’t pairwise independent (Condorcet cycles). This rule avoids cycles *because* it’s ultrafilter-based. |

  **Key boundaries**:
  - **Finite vs. Infinite**: If the electorate were finite, this *would* collapse to dictatorship (Arrow’s Theorem). The open-endedness is essential.
  - **Minimal Sufficient Sets**: In your case, there are **no minimal sufficient sets**. For any sufficient set *S*, you can remove a voter and still have a sufficient set (since subsets of sufficient sets need *not* be sufficient—only supersets are preserved). This prevents a fixed oligarchy.
  - **Complement Property**: "Every set or its complement is sufficient" is the hallmark of an ultrafilter. Without this, it might be a weaker "filter" (e.g., requiring unanimous agreement for some pairs).

  ---

  ### 3. **Edge Cases and Counterexamples**
  - **Feels Like But Isn’t**: If decisions *usually* followed a small committee *except* when they were split (letting a larger group decide), this might mimic your system superficially. But your data shows no persistent elite—winning coalitions vary wildly.
  - **True Boundary**: If the electorate stopped growing (becoming finite), the rule **must** degenerate into:
    - A dictatorship (if "every set or complement is sufficient" holds), OR
    - Intransitivity (if anonymity/unanimity/IIA hold but no dictator exists).
  - **What Breaks It**: If you found a vote where:
    - A sufficient set agreed on *x* > *y*, but the group ranked *y* > *x* (violating sufficient set definition), OR
    - A cycle occurred (e.g., group ranks *x* > *y*, *y* > *z*, *z* > *x*).

  ---

  ### 4. **Is It Just Noise? Why Probably Not**
  Your colleague’s hypothesis is testable. She would need to show:
  - **Inconsistency in sufficient sets**: Find a set *S* that was "sufficient" in one vote (e.g., *S* agreed on *x* > *y* and group followed) but not in another (e.g., *S* agreed on *z* > *w* but group overruled them).
  - **Hidden cycles**: Prove that for some *x, y, z*, the group’s pairwise rankings form a cycle *when inferred from multiple votes*. You’ve checked this, but she could re-test using triples that co-appeared on ballots.
    - *If* cycles exist but were masked because problematic triples never appeared together, your transitivity observation is spurious. But with 10 years of recurring options, this seems unlikely.

  Given your pairwise IIA tests and the ultrafilter-like structure emerging, **noise is improbable**. The properties align too cleanly with infinite-electorate theory.

  ---

  ### 5. **The Term and Definition**
  **Proposed term**: **Fluid Ultrafilter Rule**  
  **Definition**: *A collective decision procedure where:*  
  - *The electorate is unbounded (finite at any time but infinitely extensible),*  
  - *The group ranking is transitive, anonymous, unanimous, and pairwise independent (IIA),*  
  - *There exists a collection of "sufficient sets" such that:*
    1. *If a sufficient set agrees on a pairwise ranking, the group adopts it;*
    2. *Supersets of sufficient sets are sufficient;*
    3. *Intersections of sufficient sets are sufficient;*
    4. *For any group of voters, either it or its complement is sufficient.*  

  **Boundary cases**:  
  - If the electorate becomes finite → collapses to dictatorship.  
  - If property (4) fails → becomes a "filter" (may allow indecisiveness on some pairs).  
  - If sufficient sets aren’t closed under intersection → decisiveness may conflict on overlapping sets.  

  ---

  ### Practical Implication
  Your client’s behavior is consistent and rational—just not possible in a fixed finite group. **They’re using a rule that exists only because voters cycle in/out indefinitely.** You can document it as a "fluid ultrafilter" with no fixed decisive body. No dictator exists; power resides in whichever ad hoc coalition aligns on a position, with mathematical guarantees against cycles. If growth stops, the rule will break—but until then, it works.
