prompt: |-
  My mom's got early-stage Alzheimer's and moved into a care home in the spring, and the staff basically told me to stop correcting her, so now I say things like "he's not here right now" about my dad, who died in 2019. Its been messing with my head a bit.

  So compare two ways of drawing the moral line. First the one I keep half-remembering from somewhere: the assertion view — lying is asserting what you believe to be false, and it's a distinctive wrong because assertion is governed by a norm of truth, whereas misleading only gets someone to a false belief by suggestion or omission, which is a weaker kind of breach. Second, call it the evidential-sabotage view: what matters morally isn't which speech act you performed but how much you degrade the total evidence available to that particular hearer, given how much trust they've handed you and what else you could have said. On this view "I didn't lie" is mostly a way of keeping your own hands clean while doing the same damage.

  Don't just give me pros and cons — tell me where the two actually come apart. (1) The trusted-literalist case: when someone knows you're a careful, literal speaker, going literally-true on them feels worse, not better. Which view explains that, and why? (2) The deniability case: when I pick a misleading truth over a flat lie mainly so I can tell myself I didn't do it, is that a moral improvement or an extra mark against me? (3) My mom: on the second view doesn't this come out worse than lying to a stranger, since she's handed me way more trust and has way less to check me against? Take a side, but give me the strongest thing the other view can say back.
