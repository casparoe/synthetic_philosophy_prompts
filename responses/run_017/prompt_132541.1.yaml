answer: |-
  Here’s your prep sheet, designed for maximum tactical impact in that specific room. Objections are ordered by damage potential (highest first), with tailored language and counter-strategies.

  ---

  **CORE OBJECTIONS & REPLIES**  
  *(Ordered by Damage Potential)*  

  1. **The Scholar’s Empirical Challenge**  
     *Objection (data-driven):* "You claim fiction is a ‘shared public object,’ but how do we *know* what readers actually infer from ambiguities? My research shows readers often resolve ambiguities unconsciously based on cultural priming. If preserving ambiguity leads to divergent readings in the target language, isn’t that a *different* public object? Where’s your evidence?"  
     - **Reply:** "Your work is vital here. We *don’t* control what readers infer—which is precisely why collapsing ambiguity preempts their interpretive role. A ‘public object’ evolves through reader engagement, not authorial decree. If your experiments show divergence, that validates the need for translators to *enable* that engagement, not narrow it. The text’s architecture (including ambiguity) is the constant; reader response is the variable we must respect."  
     - **Soft Spot:** Conflates textual *opportunity* for ambiguity with reader *resolution*. Sidesteps quantifying "divergence."  
     - **Concede?** No. Double down: "If readers resolve ambiguities differently, that’s the *text working*, not failing."  

  2. **The Estate Lawyer’s Moral Rights Bomb**  
     *Objection (legal/ethical):* "Moral rights in many jurisdictions protect the author’s intent against ‘distortion.’ Your ‘resolute ambiguity’ rule could violate that by privileging textual evidence over known intent. If an estate provides explicit guidance on an ambiguity, isn’t ignoring it legally/ethically risky for the translator and publisher?"  
     - **Reply:** "Moral rights guard against *misrepresentation*, not interpretation. A translation preserving textual ambiguity isn’t distorting intent; it’s *honoring the text as published*. Contracts often bind us to the ‘spirit’ of the work—and that spirit includes its deliberate gaps. Substituting authorial instruction for textual evidence risks creating a *different* distortion: one that overwrites the reader’s encounter with the work as it exists."  
     - **Soft Spot:** Doesn’t resolve legal tension in jurisdictions with strong *droit moral*.  
     - **Concede?** Partially: "Where estates *document* intent contemporaneously, it becomes *part* of the textual evidence. But post-hoc assertions? That’s autobiography, not text."  

  3. **The Italian Translator’s Practical Ambush**  
     *Objection (craft/experience):* "At that panel, you insisted your ‘we’ excluded the reader. But in Italian, leaving it ambiguous made the sentence grammatically chaotic. I chose clarity *for the reader*. Isn’t your rule privileging theoretical purity over what’s *possible* or *readable* in my language? Should I sacrifice fluency to satisfy your academic footnote?"  
     - **Reply:** "Ah, the famous ‘we’! My point isn’t that you *must* replicate the ambiguity at all costs. It’s that when the source *underdetermines* meaning, your first question shouldn’t be ‘What did she mean?’ but ‘What can this *do* here?’. If Italian forces a choice, make it—but make it *based on what the text supports*, not my after-the-fact testimony. Sometimes ambiguity migrates (e.g., to word order or rhythm). Sometimes you choose. But let the text, not me, be the jury."  
     - **Soft Spot:** Avoids admitting his solution may have been best *despite* your intent.  
     - **Concede?** Yes, strategically: "You’re right—sometimes languages force choices. But *start* with the text’s affordances, not my memory."  

  4. **The Chair’s Deadline Realism**  
     *Objection (pragmatic):* "This all sounds elegant, but I’m translating 90,000 words by Tuesday. Hunting for ‘textual evidence’ for every ambiguity is a luxury. Isn’t asking the author (or their note) the *efficient* way to resolve cruxes? What’s the practical takeaway for someone drowning in work?"  
     - **Reply:** "Resolute ambiguity isn’t about endless dithering—it’s about *direction*. Asking ‘What does this sentence *do*?’ is often *faster* than chasing ghosts of intent. It grounds you in the concrete: syntax, register, connotation. My rule isn’t ‘Never resolve’; it’s ‘Resolve *from the text*.’ That’s how you avoid introducing *new* ambiguities or flatlining voice. Efficiency through textual fidelity."  
     - **Soft Spot:** Glosses over time costs of deep textual analysis vs. emailing the author.  
     - **Concede?** No. Reframe: "This *is* practical: it prevents revisions when authors change their minds."  

  5. **The Translator’s Linguistic Reality Check**  
     *Objection (craft):* "You say the Czech *Salt Year* ‘forced a choice’ on habitual vs. one-off action. But Czech aspect *always* forces this! Isn’t your rule ignoring how languages *work*? My job is rebuilding the effect, not preserving mechanics. If I can’t retain ambiguity, I’ll compensate with tone or context elsewhere."  
     - **Reply:** "Exactly! ‘Rebuilding the effect’ means asking what the ambiguity *achieved* (suspense? characterization?) and finding a *functional equivalent*. Maybe Czech loses that specific ambiguity but gains resonance elsewhere. My argument is against *defaulting* to authorial intent as the compass. If the text suggests multiple readings, your compensation should aim for that richness—not single-minded loyalty to my diary."  
     - **Soft Spot:** Doesn’t address whether compensation truly "equals" lost ambiguity.  
     - **Concede?** Yes: "Compensation is brilliant—when it serves the *text’s* complexity, not my ego."  

  6. **The In-House Lawyer’s Contractual Nit**  
     *Objection (legal):* "Our contracts require translators to ‘consult the author on ambiguities.’ If we follow your rule, aren’t they in breach? Should we rewrite boilerplate to satisfy your theory?"  
     - **Reply:** "Consultation isn’t abdication. A translator can say: ‘The text suggests X and Y; which aligns with your vision?’. That’s collaborative. My rule targets translators who treat authors as oracles, not partners. Better contracts might specify ‘resolve ambiguities consistent with the text’s apparent strategies.’"  
     - **Soft Spot:** Legally naive; contracts favour clarity.  
     - **Concede?** Yes: "Tweak the clause? Absolutely. But consultation should illuminate the text, not replace it."  

  7. **The Scholar’s Follow-Up: "Intentional Fallacy" Redux**  
     *Objection (theoretical):* "Isn’t this just Wimsatt/Beardsley’s intentional fallacy warmed over? Why reframe it as a ‘rule’?"  
     - **Reply:** "Wimsatt/Beardsley focused on *criticism*. I’m addressing *translation*, where intent is often weaponized. My ‘rule’ is a workflow prescription: when the text underdetermines, start with inference from evidence, not authorial telepathy. It’s not ‘the author is dead,’ but ‘the author is a witness—not the judge.’"  
     - **Soft Spot:** Risk of theoretical hair-splitting.  
     - **Concede?** No. Sharpen: "This is *applied* intentional fallacy for makers, not critics."  

  8. **The "Clemente" Comedy Defense**  
     *Objection (craft):* "You say ‘Clemente’ added comic tone you never intended. But in Italian, ‘Clement’ sounds alien, while ‘Clemente’ feels natural. Isn’t unnaturalness a worse distortion than unintended humor? Should I prioritize your hidden intent over the reader’s experience?"  
     - **Reply:** "Fair! But the issue isn’t naturalization—it’s *added affect*. If the English ‘Clement’ is neutral, the Italian should avoid importing *new* subtext. Maybe ‘Clement’ stays, subtly foreignizing the character. Or find a neutral Italian name. The point: don’t *introduce* an author-unintended layer that alters characterization. Textual evidence: no jokes in Clement’s scenes."  
     - **Soft Spot:** Overstates control over name connotations.  
     - **Concede?** Partially: "Unnaturalness can be jarring—but so is accidental comedy. Seek neutrality."  

  ---

  **THE MUST-LAND REPLY**  
  **Epistemic Claim:** "If even *I* misremember my intent (as with my ‘lying’ character), how can a translator—or an estate—claim certainty? Intent is inferred; the text is real. Start there, or you build on sand."  
  **→ Why essential:** Undercuts appeals to authorial authority. If *you* concede fallibility, they must engage your core argument.  

  **FALLBACK REDOUBT (Hold at all costs)**  
  **"The text is the contract with the reader. Translators are its guarantors—not the author’s ambassadors."**  
  → Even if all else fails, this frames translation as reader advocacy, not author service.  

  ---

  **THE QUESTION YOU HOPE NOBODY ASKS (But Must Prep For)**  
  *"You halted a translation and wrote explanatory notes for your American edition. Doesn’t that prove intent* should *be instruction when available? How is that not hypocrisy?"*  

  **REPLY (Candid & Strategic):**  
  "Ah, my past sins! Two confessions:  
  1. **The halted translation:** I intervened because the translator *ignored textual evidence* that contradicted my intent. They made choices that flattened thematic tensions the text *explicitly* set up. It wasn’t about intent; it was about textual coherence.  
  2. **The explanatory note:** Written *after* publication, for an edition targeting a market where context was missing. It’s a *paratext*, not a rewrite. But yes—I’d now argue it risked overriding readers. A better solution? Trust the text and its translators.  

  **Why it stings, and how to pivot:**  
  - **Exposure:** High—seems blatantly contradictory.  
  - **Damage Control:** Admit fallibility, reframe as growth: "I believed then that clarifying intent served readers. I now see it can *limit* them. That’s why I’m here: to argue for a better norm, even for past-me."  
  - **Defuse:** "Those were failures of imagination—not evidence your rule is wrong."  

  ---

  **TALK STRUCTURE TIP**  
  Lead with your "three claims" but **immediately** follow each with one of your *Salt Year* examples. This forces debate onto your turf ("How would *you* handle Clement’s name?") and away from theory wars. Your Italian translator’s presence is a gift—address him by name, laugh about the "we," and invite his perspective. Shows openness without ceding ground.  

  Good luck. That second row will be electric.
