prompt: |-
  I've been trying to work out what I actually think art is, not by reading about it but by going case by case on my gut, and my guts don't add up. Help me find the principle behind them.

  My cases and my verdicts:

  - Duchamp's urinal, the shop-bought one he entered as a readymade: art, and I'm bored of pretending to be shocked by it.
  - A mass-produced ceiling lamp from a flat-pack furniture shop, currently in my hallway: not art. I know that's more or less the same move Duchamp made and I don't care, it still isn't. This is the pair I can't reconcile, and every answer I try — it's in a gallery, it was chosen, it has a title, people wrote about it — just pushes the question back a step.
  - A painting in the style of Rembrandt, made in the 1890s, hung in a museum as a Rembrandt for a hundred years, then exposed as a forgery: still art, but I definately feel it got worse the moment we found out, and I can't tell whether that feeling is about the object or about me.
  - A canvas painted by a zoo chimpanzee, sold at a charity auction, looks just like a 1950s abstraction: not art.
  - A recording of humpback whale song, slowed down eight hundred times, released as an album by someone whose only contribution was pressing record and turning a dial: art, just about. Which is pure snobbery next to the chimp verdict, and I can't give it up.
  - A glacier in Iceland that an artist declared a work on her website: she never went there, never touched it, just posted the coordinates. People flew out and say it changed them. No idea, leaning no.
  - A recruitment poster for a regime I loathe, beautifully designed: art, and its politics don't disqualify it. A really well-designed motorway sign: not art, even though it's also designed to move you to act.
  - An AI-generated image from someone who spent weeks art-directing it: art. The same model's output from one lazy prompt: not art, even when the two look basically identical.
  - My niece's drawing on the fridge: not art, and I feel like a git saying so.
  - The one I keep flipping on: a man who spent thirty years secretly carving a staircase that goes nowhere in his basement, found after he died, no title, no statement, no audience, no intention of anyone ever seeing it.

  My own stab: something is art if someone put it forward to be experienced for its own sake by some audience. That sorts the poster from the motorway sign, dies on the staircase and the glacier, and I don't think it separates the lamp from the urinal at all.

  Please don't give me a survey of isms — I know the institutional, historical and aesthetic families exist, I don't need the labels reattached to them. Give me the working thing, clause by clause.

  Sections, in this order:

  - "My verdicts, restated" (~150 words): the pattern you think is actually in my list, sorted, not just repeated.
  - "The principle" (~300 words): your candidate, stated precisely enough that I could apply it myself, each clause tied to the case that motivates it, plus a runner-up if there's a real choice between saving every one of my verdicts with something ugly and dropping one for something clean.
  - "What it decides" (~200 words): verdicts on three or four cases I haven't listed, including the staircase, and at least one you think I'd hate.
  - "What it overturns" (~150 words): which of my verdicts your principle can't keep, and which one you'd drop first.
  - "Settled vs contested" (~150 words): which claims of yours are genuinely agreed among people who work on this and which are one side of a live argument — don't quietly present a contested view as the consensus. And tell me honestly whether the "stop asking for a definition, it's a family-resemblance word" line is actually the majority position or just a famous one.

  British English throughout, please.
reasoning: |-
  Hmm, the user is grappling with what makes something art, using concrete examples instead of theories. They've listed various cases with their gut reactions and want a principle that explains their verdicts without relying on art theories. They specifically requested British English and a structured response with sections. Let me analyze their cases first.

  Looking at their verdicts: Duchamp's urinal is art but their identical lamp isn't. The Rembrandt forgery is art but diminished when exposed. The chimp painting isn't art but the processed whale song is. The glacier declaration leans no, while the propaganda poster is art but the motorway sign isn't. AI-generated images can be art depending on effort, but the niece's drawing isn't. The basement staircase is ambiguous. Their own definition involves presentation for experience, but it struggles with the staircase and glacier cases.

  The core tension is between intention and reception. The lamp versus urinal dilemma highlights that context matters - the urinal was framed as art deliberately, while the lamp is functional. The forgery loses value when context changes, showing that art's meaning depends on perceived authenticity. The chimp versus whale contrast suggests human curation elevates the latter. The glacier case lacks artist engagement, making it feel hollow. The staircase without audience challenges whether art requires an intended viewer.

  The principle needs to reconcile these. Art requires framing by a human agent for experiential engagement beyond utility. This covers Duchamp (deliberate framing), the forgery (context shift affects perception), whale song (curation), and AI with effort (intentional art direction). It excludes the lamp (no framing), chimp painting (no human framing), motorway sign (functional), and niece's drawing (not framed as art). The staircase and glacier are borderline - the staircase might be art post-discovery through reception, while the glacier fails due to lack of artist involvement.

  For unlisted cases: Warhol's Brillo Boxes would be art (intentionally framed), a sunset isn't (no human framing), a child's intentional gallery piece is art (framed). The staircase becomes art only upon discovery. The propaganda poster's art status stands, as framing matters more than morality.

  This approach overturns the niece's drawing verdict if formally framed, but maintains the lamp as non-art. The glacier remains not art due to insufficient artist engagement.

  In art theory, functionalism and institutionalism are contested. The "family resemblance" argument is popular but not universally accepted. My principle aligns with neo-institutional views, stressing intention and framing, which is a significant but debated perspective.

  The user seems frustrated with inconsistent intuitions. They value authenticity and human intention, rejecting arbitrary distinctions. By emphasizing deliberate framing, the principle addresses their need for consistency without rigid definitions. Highlighting the staircase's posthumous reception might resolve their flip-flopping, showing that context evolves.
answer: |-
  Here’s a principle distilled from your verdicts, clause by clause, in British English and the requested structure:

  ---

  **My verdicts, restated**  
  Your pattern suggests:  
  - Art requires **deliberate human framing** (urinal yes, lamp no).  
  - It hinges on **authenticity of artistic intent**, not just form (forgery diminishes when exposed).  
  - **Curation/transformation by human agency** matters (whale song yes, chimp no).  
  - **Presentational context** separates art from design (poster yes, sign no).  
  - **Effort/control in creation** distinguishes AI outputs (directed yes, lazy no).  
  - **Artist engagement** is crucial (glacier no, staircase ambiguous).  
  - **Domestic/found objects** lack framing unless claimed (niece’s drawing no).  

  ---

  **The principle**  
  Something is art **iff**:  
  1. **A human agent deliberately frames it** as an object of aesthetic/reflective experience (motivated by Duchamp vs. lamp: the urinal was *chosen as a proposition*, the lamp wasn’t).  
  2. **That framing is integral to its existence or presentation** (motivated by forgery: its "Rembrandt" context was false, so its *art-status* relied on deception; exposed, it reverts to a skilled copy).  
  3. **The agent exercises significant creative control** — selecting, transforming, or directing its form/content (motivated by whale song vs. chimp: slowing/curating the whale song is transformative; the chimp’s act lacks artistic agency. Also covers AI: weeks of art direction = control; a prompt = negligible agency).  
  4. **It is presented (explicitly or implicitly) for reception beyond pure utility** (motivated by poster vs. sign: the poster, however functional, leverages aesthetic appeal for ideology; the sign’s form is purely instrumental).  

  *Runner-up principle* (saves all but the staircase):  
  Drop clause 4 and require **public/audience-facing intent**. This saves the poster/sign distinction and kills the glacier claim, but makes the staircase "not art" (no intended audience). I prioritise your ambivalence on the staircase over rigidly saving every verdict.  

  ---

  **What it decides**  
  Applying the main principle:  
  - **The basement staircase**: **Art** (barely). Clause 1: he framed it as a lifelong creative act (carving "for its own sake" implies aesthetic intent). Clause 3: total creative control. Clause 4: though secret, the act itself suggests intrinsic experiential purpose.  
  - **Warhol’s *Brillo Boxes* (1964)**: **Art**. Framed as commentary on commodification (Clause 1), controlled replication (Clause 3), presented for reflection (Clause 4).  
  - **A perfect, unedited sunset photo taken on your phone**: **Not art**. No framing beyond documentation (fails Clause 1), no creative control (Clause 3).  
  - **Your niece’s drawing if hung in a school "gallery" with her name**: **Art**. Now deliberately framed (Clause 1), minimal but sufficient control (Clause 3), presented for experience (Clause 4). You’ll hate this — it forces you to confront your "git" feeling as snobbery.  

  ---

  **What it overturns**  
  My principle **cannot keep your whale song verdict**. Clause 3 requires "significant creative control". Slowing the recording is a *technical* intervention, not necessarily *creative* direction (it reveals existing structure but doesn’t shape it artistically). If you insist it’s "just about" art, the runner-up (emphasising curation-as-framing) might save it, but it’s strained.  
  I’d **drop the whale song verdict first** — your "pure snobbery" admission suggests it’s the weakest link in your list.  

  ---

  **Settled vs contested**  
  - **Contested**: The core idea that **art requires institutional or communal recognition** (e.g., Danto’s "artworld") is widely debated. My principle rejects this (hence glacier/staircase verdicts), siding with "intentionalist" views (e.g., Tolhurst, Stecker) — a significant minority position.  
  - **Contested**: The **primacy of creative control** (Clause 3) is disputed by "anti-intentionalists" (e.g., Wimsatt) who prioritise the object itself. Your AI/forgery verdicts demand this clause, but it’s not consensus.  
  - **Settled-ish**: Most agree **art cannot be defined by necessary-and-sufficient conditions** (Wittgenstein’s "family resemblances" is the dominant framework). However, this is often misapplied as "stop asking for a definition" fatalism. **Yes, "family resemblance" is the majority position** among theorists (e.g., Weitz, Danto), but it doesn’t preclude functional criteria like mine — it just denies *one true essence*. My principle offers a *cluster* of conditions that align with your instincts, not a rigid definition.  

  ---  
  This principle systematises your verdicts by stressing **intentional framing + creative agency + experiential presentation**. It accepts that context (like forgery exposure) can retroactively alter art’s *meaning* without erasing its *status* — a nuance your list demands.
