  Hmm, this user is asking for a sophisticated translation of David Lewis's theory of convention into multi-agent reinforcement learning (MARL) and rationalist discourse terminology. They're clearly deeply knowledgeable - a research engineer with 15 years in both MARL and rationalist communities. Their request is extremely precise, almost like a technical specification.

  The user wants four distinct outputs: a faithful translation, a residue report, analysis of four stress cases, and a final verdict. They're particularly concerned about potential mismatches - especially around common knowledge and normativity. I appreciate how they've clearly defined their native vocabulary and explicitly banned philosophical jargon.

  For Part I (translation), I need to carefully map each clause of Lewis's definition:
  - Regularity → behavioral patterns in policy outputs
  - Recurrent situation → similar state distributions
  - Near-universal conformity → high probability in joint policy
  - Expectations → opponent modeling outputs
  - Conditional preference → best response under constraints
  - Arbitrariness → multiple Nash equilibria
  - Common knowledge → infinite regress in opponent models

  The bootstrapping story translates nicely to basin-of-attraction concepts in training dynamics. For signaling games, I'll show how meaningless tokens become meaningful through coordinated policies.

  Part II (residue) will highlight three categories:
  Clean: recurrence, regularity, conditional preferences
  Distorted: common knowledge (truncated hierarchy), arbitrariness (limited counterfactuals)
  Lost: normativity as reason-giving force

  The stress cases in Part III are well-chosen:
