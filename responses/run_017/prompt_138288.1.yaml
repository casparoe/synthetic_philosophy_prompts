prompt: |-
  Got 40 minutes next week in front of a room of ML engineers to explain updateless decision theory. They're completely fine with expected utility, Bayes and policy gradients, they have zero philosophy, and they're going to assume that anything that sounds like "ignore the evidence" is crackpot — so I need a plan, not an explanation.

  What has to be in place before "updateless" even means anything to them: do they need the causal/evidential decision theory split first, or can I get there from Newcomb's problem alone (which half of them will have half-remembered from a blog post)? Which single case should carry the whole thing — I was going to build it around an agent that gets to patch its own source code before the input arrives, so the policy feels like a real object they can point at, but tell me if that just smuggles in the conclusion or quietly collapses into Newcomb. Then the misconceptions, and where in the sequence to kill each one: I'm expecting "so you're saying don't condition on the evidence", "isn't that just evidential decision theory again", and "surely the perfect predictor is doing all the work here". Plus one question at the end that tells me whether they actually got it or just got comfortable with it.

  Also: what should I flatly refuse to go into at this level, and say out loud that I'm leaving it out — logical counterfactuals, why the policy gets evaluated from the prior, whatever else. British English please.
reasoning: |-
  We are addressing a room of ML engineers with 40 minutes to explain Updateless Decision Theory (UDT). They are familiar with expected utility, Bayes, and policy gradients, but have zero philosophy background and are skeptical of anything that sounds like "ignore the evidence". We need a plan that builds intuition without getting bogged down in philosophy.

  ### Key goals:
  1. **Motivate the problem**: Show a situation where standard (evidential) decision theory fails, and we need a different approach.
  2. **Introduce UDT as a solution**: Frame it in terms of choosing a policy (like in RL) that maximizes expected utility from a prior perspective, without updating on the very evidence that the policy's action might provide.
  3. **Address misconceptions**: Preemptively tackle "ignore the evidence", "isn't this evidential?", and "it's all about the predictor".
  4. **Concrete example**: Use an example that feels real to ML engineers (like an agent that patches its own source code) but without smuggling in the conclusion.

  ### Plan:

  #### (0) Quick intro (2 min)
  - Decision theory: how agents choose actions to maximize expected utility.
  - We'll see a problem where the obvious approach (conditioning on all available evidence) leads to a suboptimal outcome.

  #### (1) Newcomb's Problem as the motivator (8 min)
  - **Setup**: 
    - Two boxes: Box A (always contains $1000) and Box B (contains $1,000,000 or $0).
    - Predictor: Perfect (for now) at predicting your choice. If it predicts you will take only Box B, it puts $1,000,000 in it. If it predicts you will take both, it puts $0 in Box B.
    - You have two choices: take both boxes, or take only Box B.
  - **Standard decision theories**:
    - **Causal Decision Theory (CDT)**: "My action now doesn't cause what's in the box. So I take both: I get $1000 plus whatever is in B. If B is full, I get $1,001,000; if empty, $1000. Either way, better than just $1,000,000? Wait, but if the predictor is perfect, then if I take both, I get only $1000, and if I take only B, I get $1,000,000. So CDT gets $1000 in a perfect predictor scenario."
    - **Evidential Decision Theory (EDT)**: Conditions on the action. If I take both, that is evidence that the predictor saw me taking both, so Box B is empty -> I get $1000. If I take only B, that is evidence that the predictor saw me taking only B, so Box B has $1,000,000 -> I get $1,000,000. So EDT says take only B. But wait, EDT gets the money, but is it for the right reason? (We'll come back.)
  - **Problem**: CDT loses out on $999,000 compared to EDT in this scenario. But wait, isn't EDT conditioning on the action? What if we change the setup?

  #### (2) The problem with EDT: Smoking Lesion (5 min)
  - **Setup**:
    - There's a gene (lesion) that causes both a love for smoking and lung cancer. The lesion is rare (say 1% prior). Smoking itself doesn't cause cancer.
    - You don't know if you have the lesion. You observe whether you smoke? Actually, the decision is: to smoke or not to smoke.
    - Utility: Smoking is pleasurable (+1000), but cancer is bad (-1,000,000). Without the lesion, smoking is harmless; with the lesion, cancer happens regardless of smoking.
    - But: You can't observe the lesion. You can only take an action (smoke or not).
  - **EDT reasoning**:
    - If I smoke, that is evidence that I have the lesion (because people with the lesion are more likely to smoke) and hence evidence that I will get cancer. So smoking is bad news -> don't smoke.
    - If I don't smoke, that is evidence I don't have the lesion -> I avoid cancer? But wait, the lesion causes cancer regardless. So not smoking doesn't prevent cancer if I have the lesion. But without the lesion, I don't get cancer anyway. So the action doesn't cause cancer, but it's evidence about the lesion.
  - **What happens**:
    - If I smoke: I get +1000 (from smoking) and then if I have the lesion (which is now more likely) I get cancer -> so expected utility is low.
    - If I don't smoke: I get 0 from not smoking, and if I don't have the lesion (which is now more likely) then I avoid cancer? Actually, even if I have the lesion, I get cancer regardless. So the cancer outcome is independent of smoking? Exactly: smoking doesn't cause cancer, the lesion does.
  - **EDT says don't smoke, but that's irrational!** Because smoking doesn't cause cancer. The lesion does, and the lesion is fixed before you decide. So you might as well smoke and get the pleasure. But EDT conditions on the action and sees that smoking is correlated with cancer (because of the lesion) and thus avoids it. CDT, by contrast, looks at the causal structure: smoking does not cause cancer, so it says smoke -> and that's correct.
  - **Conclusion**: EDT fails in Smoking Lesion, CDT fails in Newcomb. We need a decision theory that works in both.

  #### (3) The core idea: Choosing a policy, not an action (5 min)
  - **What's a policy?** A function from observations to actions. In RL, we optimize the policy to maximize expected return. But we usually update as we go? Not necessarily: we can think of the entire policy as a single object chosen at the start.
  - **The key shift**: Instead of conditioning on all evidence (including the action we are about to take) to choose an action, we choose a policy (a complete plan for all possible observations) at time zero, and then follow it. We evaluate the policy by the expected utility it achieves, computed with respect to the prior probability distribution (before any evidence is seen).
  - **Why "updateless"?** Because we don't update the prior when evaluating the policy. We stick with the prior and compute the expected utility of the entire policy.

  #### (4) Applying UDT to Newcomb (5 min)
  - **Prior**: Before the predictor acts, we consider two policies:
    - Policy 1: Always take both boxes.
    - Policy 2: Always take only Box B.
  - **Expected utility calculation**:
    - We assume the predictor is perfect. So:
      - If we choose Policy 1 (take both): The predictor knows we take both -> puts $0 in Box B. So we get $1000.
      - If we choose Policy 2 (take only B): The predictor knows we take only B -> puts $1,000,000 in Box B. So we get $1,000,000.
    - Therefore, Policy 2 has higher expected utility (from the prior perspective) -> we choose Policy 2.
  - **Note**: We did not condition on the action. We chose the policy at time zero and then followed it. The predictor is a function of the policy, so it can react to the entire policy.

  #### (5) Applying UDT to Smoking Lesion (5 min)
  - **Prior**: We have 1% chance of having the lesion.
  - **Policies**:
    - Policy 1: Always smoke.
    - Policy 2: Never smoke.
  - **Expected utility**:
    - Policy 1: 
      - With lesion (1%): +1000 (from smoking) and then -1,000,000 (cancer) -> utility = -999,000.
      - Without lesion (99%): +1000, and no cancer -> utility = +1000.
      - Expected utility = (0.01)*(-999000) + (0.99)*(1000) = -9990 + 990 = -9000.
    - Policy 2:
      - With lesion (1%): 0 (no smoking) and -1,000,000 (cancer) -> -1,000,000.
      - Without lesion (99%): 0 (no smoking) and 0 -> 0.
      - Expected utility = (0.01)*(-1000000) + (0.99)*(0) = -10,000.
  - **Comparison**: Policy 1 (-9000) is better than Policy 2 (-10,000). So UDT chooses to smoke.
  - **Why?** Because from the prior perspective, the lesion is independent of the policy. The policy doesn't cause the lesion, so we don't update the prior probability of the lesion when evaluating the policy. We just compute the expected utility with the prior.

  #### (6) Addressing misconceptions (5 min)
  - **"Ignore the evidence"**: We are not ignoring evidence arbitrarily. We condition on the evidence when it is available to the policy (so the policy can map observations to actions). But we do not update the prior when evaluating the policy because the policy itself might be correlated with the state (like in Newcomb). We are evaluating the policy from the prior perspective so that we don't double-count the evidence that the policy's action would provide.
  - **"Isn't this evidential?"** No, because EDT conditions on the action at the moment of decision, which leads to the wrong answer in Smoking Lesion. UDT conditions only on the observations that are inputs to the policy, and the policy is chosen from the prior. In Newcomb, EDT and UDT both take only Box B, but for different reasons. In Smoking Lesion, EDT avoids smoking, UDT smokes (like CDT). So UDT is not EDT.
  - **"It's all about the predictor"**: In Newcomb, the predictor is a device to create a correlation between the policy and the state. But the same idea applies in other situations without predictors, like the Smoking Lesion. Also, we can relax the perfect predictor: if the predictor is 99% accurate, UDT still takes only Box B because the policy that takes only Box B still has higher expected utility from the prior.

  #### (7) The source code patching example (optional, if time) (5 min)
  - **Setup**: An agent is going to receive an input (which might be a problem to solve) and then output an action. But before the input arrives, the agent can patch its own source code (i.e., choose a policy). The problem: the input might be generated by an adversary that knows the agent's policy (like in Newcomb).
  - **How UDT applies**: The agent chooses a policy (a function from inputs to actions) to maximize expected utility over the prior distribution of inputs. The adversary generates the input based on the policy. So the agent must choose a policy that is robust to the adversary.
  - **Why it's not collapsing into Newcomb?** Because it's a general setting: the agent is choosing a policy in advance, and the environment can depend on that policy. This is a common scenario in security, adversarial ML, etc.

  #### (8) One question to test understanding (at the end) (0 min, but reserve time)
  - Ask: "In UDT, when we evaluate a policy, do we use the prior probability distribution or do we update on the evidence that we are using a particular policy?" 
    - The answer should be: we use the prior. We don't update on the fact that we are using a particular policy because that is a decision variable, not evidence.

  #### (9) What to avoid (say out loud) (1 min)
  - We are not going into logical counterfactuals (what if my policy were different? how do we define probabilities for that?) because that's more advanced.
  - We are assuming the policy is a fixed function and the environment can depend on it (like in the source code example). We are not tackling how to handle self-modifying agents in full generality.
  - We are not discussing why the prior is the right perspective: we take it as given that we are maximizing expected utility from the initial state of information.

  ### Timing:
  - 0: 2 min
  - 1: 8 min (Newcomb)
  - 2: 5 min (Smoking Lesion)
  - 3: 5 min (Policy idea)
  - 4: 5 min (UDT Newcomb)
  - 5: 5 min (UDT Smoking Lesion)
  - 6: 5 min (Misconceptions)
  - 7: 0-5 min (if time: source code patching)
  - 8: Reserve time for the test question and discussion.
  - 9: 1 min (what we skip)

  Total: 40 min (adjust as needed).

  ### British English note:
  - Use "maths", "programme" (if applicable), and other British spellings.

  This plan builds the motivation step by step, uses concrete examples familiar in decision theory, and addresses the anticipated skepticism by showing UDT as a principled approach that generalizes across problems and aligns with the idea of choosing a policy in advance (which ML engineers should recognize from RL).
answer: |-
  Here's a battle-tested plan for your 40-minute session, designed to bypass philosophical landmines and anchor everything in computational thinking. British English guaranteed.

  ### **Phase 1: Set Up the Problem (12 mins)**
  1. **Kick with Newcomb’s Problem (No Jargon)**  
     - *Setup*: "You face two boxes: Box A (transparent, £1,000) and Box B (opaque, £0 or £1M). A Predictor has scanned your brain *yesterday* and filled Box B iff it predicted you’d take *only B*. You choose now: one-box (only B) or two-box (A+B)."  
     - *Force the contradiction*:  
       - CDT stance: "Two-boxing dominates. Whatever’s in B, I get £1,000 extra. Predictor’s already gone—my choice can’t *cause* past prediction."  
       - EDT stance: "One-boxing is better. If I one-box, it’s evidence the Predictor foresaw that, so B has £1M. Two-boxing implies evidence of £0."  
     - *Key point*: "Both sound rational locally, but CDT gets £1,000, EDT gets £1M. Yet EDT feels like ‘kneecapping causality’."

  2. **Smoking Lesion to Break EDT (4 mins)**  
     - *Setup*: "You might have a lesion (1% prior) that causes both smoking *and* cancer. Smoking *itself* doesn’t cause cancer. Pleasure from smoking: +100 utils. Cancer: -10,000 utils."  
     - *EDT’s flaw*: "Conditioning on smoking → evidence of lesion → evidence of cancer → negative utility. So EDT avoids smoking. But *causally*, smoking does nothing. CDT correctly smokes: lesion is fixed pre-decision."  
     - *Punchline*: "Conditioning on everything fails when actions *correlate* with state but don’t *cause* it. We need a unified solution."

  ### **Phase 2: Introduce Policy as the Core Object (8 mins)**  
  3. **Reframe Agents as Policies (Not Actions)**  
     - *Analogy to RL*: "You train policies *in advance* that map states → actions. What if we treat the *entire policy* as the unit of optimisation? Not ‘what action now given evidence’, but ‘what *rule* should I precommit to?’"  
     - *Source code patching example*:  
       - "Imagine you’re an agent. Before seeing input X, you patch your source code to implement function F: X → action. Your code is public—an adversary (e.g. Predictor) generates X *after* seeing F. You must pick F *now* to max expected utility over possible X."  
       - *Why it’s not Newcomb in disguise*: "Here, the environment *explicitly depends on your policy*—like a minimax game. No ‘magic prediction’, just code output → input generation."  

  4. **Updateless = Policy Evaluation from Prior**  
     - "UDT evaluates policies *from the initial prior*, before any evidence. It asks: ‘Which F has highest EU *across all world-states I might encounter*, weighted by prior probability?’ Crucially, F’s actions might *correlate* with states (like in Newcomb), but we don’t ‘update away’ that correlation when choosing F."  

  ### **Phase 3: UDT in Action (10 mins)**  
  5. **Solve Newcomb with UDT (3 mins)**  
     - Policies: F₁ (always one-box), F₂ (always two-box).  
     - Prior: Predictor is perfect (for simplicity; relax later).  
     - EU(F₁) = P(Predictor foresaw F₁) * £1M = 1 * £1M.  
     - EU(F₂) = P(Predictor foresaw F₂) * £1,000 = 1 * £1,000.  
     - "F₁ wins. We don’t ‘condition’ on being at the choice node—we locked F₁ *before* the Predictor acted."  

  6. **Solve Smoking Lesion with UDT (3 mins)**  
     - Policies: Fₛ (smoke if offered), Fₙ (never smoke).  
     - Prior: P(lesion) = 1%.  
     - EU(Fₛ) = (0.01 * (-9,900)) + (0.99 * 100) = -99 + 99 = **0**.  
     - EU(Fₙ) = (0.01 * -10,000) + (0.99 * 0) = **-100**.  
     - "Fₛ wins. EDT updated on smoking → feared cancer; UDT sticks to prior → sees smoking is harmless *given lesion is fixed*."  

  7. **Relax Perfection (4 mins)**  
     - "Predictor 90% accurate? UDT still one-boxes: EU(F₁) = 0.9*£1M + 0.1*£0 = £900K, EU(F₂)= £1,000 + 0.9*£0 + 0.1*£1M? No! F₂ causes Predictor to *anticipate two-boxing*, so P(B full | F₂) = 0.1. Thus EU(F₂) = £1,000 + 0.1*£1M = £101,000."  
     - *Key*: "Policy determines Predictor’s response. F₂ gets £1,000 + crumbs; F₁ gets the main prize."  

  ### **Phase 4: Crush Misconceptions (7 mins)**  
  **Preemptive strikes—timed when the itch arises:**  
  - *"So you ignore evidence?"* → "No. The policy *uses* evidence (e.g. ‘if X=lesion_test_positive, do Y’). But when *choosing* the policy, we don’t condition on evidence that only exists *because* of the policy—like ‘I’m about to two-box’ in Newcomb. We want the best *overall* algorithm, not best local move."  
  - *"Isn’t this EDT?"* → "EDT updates on *actions* at choice nodes. UDT doesn’t update at all when selecting the policy. In Smoking Lesion, EDT avoids smoking; UDT smokes. Different!"  
  - *"Predictor is doing all the work!"* → "The Predictor just *exploits* a correlation. UDT wins by *owning* the correlation via precommitment. In the source code example, it’s just adversarial input—no ‘psychic’ needed."  

  ### **Phase 5: The Litmus Test (3 mins)**  
  - **The Question**: "In UDT, if two policies F₁ and F₂ have identical actions in all *actual* world-states but differ in *counterfactual* states, can they have different EUs? Why?"  
     - *Why it works*: Reveals if they grasp that UDT cares about *global* policy performance (including how it influences/correlates with unrealised states). Correct answer: **Yes**—e.g. in Newcomb, F₁ (one-box) and F’₁ (one-box but with different code comments) may be treated identically by a Predictor, but if Predictor *reacts* to code differences, EU changes.  

  ### **What to Explicitly Exclude (Say Upfront)**  
  - **"We’re skipping logical counterfactuals (e.g., ‘what if my code were different?’) and self-locating uncertainty. Today, policies are black-box functions."**  
  - **"We’re not debating *why* the prior—it’s given, like in Bayesian RL. UDT says: ‘Max EU from t=0, period.’"**  
  - **"No ontological crises about ‘timeless decisions’. We’re choosing code *before* input arrives—it’s just precommitment."**  

  ### **Why This Works**  
  - **ML-friendly hooks**: Policies = functions, EU maximisation, adversarial inputs.  
  - **Kills ‘crackpot’ vibes**: UDT isn’t "ignore evidence"—it’s "optimise globally under correlation".  
  - **Builds inevitability**: CDT/EDT fail → policies fix it → UDT emerges.  

  You’ll know they’re with you when they start arguing about how to *implement* this in a training loop. Good luck!
