prompt: |-
  I've got a 30-minute slot next Thurs in front of a joint session of our lab's RL group and the evals & policy team, and I'm presenting the case for demoting outcome supervision from default to fallback. Thesis in one line: on any task where the outcome is unverifiable at training time, or verifiable only through a learned proxy, we should supervise the process instead — and specifically with what I've been calling null-outcome process grading, where the step-level grader never sees the final answer, so credit can't leak backwards from a lucky or unlucky result.

  My argument has three moves. (1) Outcome reward fails in three distinguishable ways, not one: outcomes that can't be checked at all (open-ended writing, most real-world advice, judgement calls), outcomes that are only checkable long after the gradient has to be applied (did this refactor cause an outage eighteen months from now), and outcomes checkable only by another model, which just relocates the problem one level up. (2) Process supervision isn't a weaker substitute for outcome signal, it's a different kind of object: outcome reward is a score, process supervision is a constraint on the path, and there's no single scalar for the optimizer to Goodhart, so the usual proxy-collapse story doesn't get off the ground. (3) The blinding is the part that actually buys you something — otherwise your step labels are contaminated by hindsight, and you end up teaching the model to emit the kind of reasoning that tends to precede answers that happen to be right, which is not the same thing as reasoning.

  Audience, as precisely as I can: about a dozen RL people who think of credit assignment as solved-in-principle by TD methods, who've all personally been burned by reward hacking, and who will hear process supervision as hand-designed dense reward with extra steps; three people from evals who care about benchmark validity and statistical power and will immediately want to know what this costs per unit of signal; one econ/incentive-design person who hears supervise the process as teach to a more expensive test and will reach for moral hazard and multitasking; and a philosopher of action visiting for the quarter who will want to know whether a trace that instantiates the form of reasoning is the process or merely a report of it, and what work my constraints are doing if no one is acting for reasons.

  What I want is a Q&A prep sheet. Give me the objections I'll actually get from this room, in their own vocabulary rather than in alignment-seminar vocabulary, ordered by how likely they are and how much damage they'd do, each with a two-minute-ish reply and — most importantly — a note on where the reply is soft, because I'd rather find out now which ones I'm bluffing on. Also tell me what to concede in the first two slides so I don't lose the room before I get to the mechanism, and which single reply has to land for the proposal to survive at all.

  The one I'm dreading and know I'll get: the supervision-competence inversion. The claim is that the tasks where outcome signal is worst — frontier, long-horizon, superhuman — are exactly the tasks where no grader available to me can judge the steps either, so my fallback doesn't kick in where I need it, and worse, a blinded grader on those tasks will just grade for rhetorical similarity to how they'd have done it, which trains conformity to supervisor aesthetics rather than competence. I have a bad answer to this and I want a better one, or at least a clear view of which half of it I should hold and which half I should give up. If you think there's a nastier version of it than the one I just sketched, say so.

  Please skip the generic stuff — abstract deceptive alignment, scalable oversight as a slogan, the list of famous benchmark results — and don't pad it out to ten if there are really six. And assume I have 90 seconds per answer, not five minutes.
reasoning: |-
  We are preparing a Q&A prep sheet for a presentation arguing for demoting outcome supervision to fallback and using null-outcome process grading as the default for tasks with unverifiable outcomes or outcomes verifiable only by a learned proxy.

  The audience includes:
  - RL group (about a dozen): think credit assignment is solved by TD methods, have been burned by reward hacking, may see process supervision as hand-designed dense reward with extra steps.
  - Evals team (3 people): care about benchmark validity and statistical power, will ask about cost per unit of signal.
  - Econ/incentive-design person: will think of "teach to a more expensive test", moral hazard, multitasking.
  - Philosopher of action: will question whether the trace is the process or a report, and what work the constraints do if no one is acting for reasons.

  Key arguments in the presentation:
  1. Outcome reward fails in three ways: unverifiable outcomes, long-delayed outcomes, and outcomes checkable only by a learned proxy (which just moves the problem).
  2. Process supervision is not a weaker outcome signal but a constraint on the path, avoiding Goodharting because there's no single scalar to optimize.
  3. Blinding (null-outcome) is crucial to avoid contamination by hindsight, preventing the model from learning reasoning that merely precedes right answers.

  The dreaded objection: supervision-competence inversion. On frontier tasks, the grader can't judge the steps either, and a blinded grader might just grade for rhetorical similarity to their own style, leading to conformity rather than competence.

  We are to provide:
  - A list of objections ordered by likelihood and potential damage.
  - For each, a two-minute reply (about 90 seconds in practice) and a note on where the reply is soft.
  - What to concede in the first two slides to avoid losing the room.
  - The single most critical reply that must land for the proposal to survive.

  We skip generic topics and focus on the specific audience.

  Let's brainstorm objections:

  From RL group:
  1. "Credit assignment is already handled by TD methods. Why not just use a better value function or model-based RL? Process supervision sounds like a dense reward, which is expensive to design and might not scale."
  2. "This is just reward shaping. We know reward shaping can lead to unintended consequences and might not solve the fundamental exploration problem in long-horizon tasks."
  3. "You're replacing reward hacking with supervision hacking. The model will just learn to produce steps that look good to the grader, even if they are irrelevant or misleading."

  From Evals team:
  4. "What's the cost per unit of signal? Process supervision requires step-by-step grading, which is much more expensive per example than outcome supervision. How do you justify the cost and what about statistical power?"
  5. "How do you benchmark this? Without outcome labels, how do we know if the process is actually leading to better outcomes? We risk overfitting to the process and losing predictive validity."

  From Econ person:
  6. "This is moral hazard: the agent is being judged on the process, not the outcome, so it has no incentive to get the right answer, only to go through the motions. Also, multitasking: by focusing on the process, you might be neglecting other important dimensions (like speed, creativity, etc.)."

  From Philosopher:
  7. "How do you know that the step-level trace is the actual reasoning process? It might just be a report of the process, and the model could be simulating reasoning without actually using it. Also, if the grader is blinded to the outcome, what prevents the model from generating a plausible but fake process that leads to an arbitrary outcome?"

  And the dreaded one (which we expect from multiple angles, but especially RL and philosopher):
  8. Supervision-competence inversion: On hard tasks, the grader isn't competent to judge the steps, so you're replacing an unverifiable outcome with an unverifiable process. Moreover, blinding might force the grader to rely on superficial features (like style) and train the model to conform to the grader's biases.

  Now, let's order them by likelihood and damage:

  Likelihood: We expect the RL group to be the majority and most vocal. The supervision-competence inversion is dreaded and likely to come up. Also, the cost question from evals is very practical and likely. The moral hazard and multitasking from econ is also a common concern. The philosopher's objection might be less likely to derail the discussion but could be damaging if it resonates.

  Damage: The supervision-competence inversion is the most damaging because it attacks the core of the proposal on the tasks we care about most. The cost objection from evals could kill adoption if not addressed. The RL objections about credit assignment and reward shaping are foundational and could lead to dismissal of the approach.

  Order (most likely and damaging first):

  1. Supervision-competence inversion (dreaded objection)
  2. Cost per unit of signal from evals (very practical, if too expensive, won't be adopted)
  3. RL objection: "This is just reward shaping and might not scale, and we already have TD methods for credit assignment."
  4. Econ objection: moral hazard and multitasking.
  5. RL objection: "You're replacing reward hacking with supervision hacking."
  6. Evals: How to benchmark without outcomes?
  7. Philosopher: Is the trace the process or a report? What if it's fake?
  8. RL: Process supervision is just hand-designed dense reward.

  But note: the dreaded one is #1 in damage and likelihood in this context.

  What to concede in the first two slides to not lose the room:

  - Concede that outcome supervision is great when it works (i.e., when outcomes are verifiable and timely). We are only demoting it for the cases where it doesn't.
  - Concede that process supervision is more expensive per example. But argue that in the cases where outcome supervision fails, we often have no alternative, and the cost may be justified by the benefits.
  - Concede that TD methods are effective for credit assignment when the reward signal is available and not corrupted. But in the cases we're talking about, the reward signal is corrupted or absent.

  The single reply that must land: The answer to the supervision-competence inversion. If we can't defend that, the proposal falls apart on the most important tasks.

  Now, let's craft the Q&A:

  Objection 1 (Supervision-competence inversion): 
  On frontier tasks, where outcomes are hardest to verify, the grader is also least competent to judge the steps. A blinded grader might just grade for how similar the reasoning is to their own, leading to conformity, not competence. Worse, if the grader isn't an expert, the process supervision might be worse than useless.

  Reply (90 seconds):
  "First, we agree that on frontier tasks, human graders may lack the expertise to judge the correctness of every step. But note: we're not asking the grader to judge correctness in an absolute sense. We're asking for a relative judgment: does this step follow from the previous ones? Is it internally consistent? And we can train graders to focus on these logical properties. Second, we're not limited to human graders. We can use models to assist, and we can use ensemble methods to reduce bias. Third, the blinding is crucial because it forces the grader to focus on the process structure, not the outcome. Yes, there's a risk of stylistic conformity, but we can mitigate that by using multiple graders with diverse backgrounds and by training the graders on a variety of valid reasoning styles. Finally, even on frontier tasks, we often have partial expertise: we might not know the answer, but we know what good reasoning looks like. We're betting that the structure of reasoning is more transferable than outcome knowledge. And if we're wrong, we fall back to outcome supervision when it's available."

  Soft spots:
  - We haven't fully solved the problem of grader competence on frontier tasks. We're relying on the idea that logical coherence is easier to judge than outcome correctness, but that might not hold for highly novel reasoning.
  - The use of model graders might introduce the same proxy problems we're trying to avoid.

  Objection 2 (Cost per unit of signal from evals):
  "Process supervision requires grading every step, which is expensive. How do you justify the cost per unit of signal, especially compared to outcome supervision? And what about statistical power? With the same budget, we get fewer examples."

  Reply:
  "You're right, per example, it's more expensive. But consider: in the cases where outcome supervision fails, we often have no signal at all. So the alternative is not cheap outcome supervision, but no supervision. Moreover, we don't need to grade every step of every example. We can use sparse process supervision, or active learning to focus on critical steps. Also, the signal from process supervision is richer and more informative for credit assignment, so we might need fewer examples to achieve the same performance. For statistical power, we can design benchmarks that measure process quality directly, and we can show that improving process quality leads to better outcomes when outcomes are eventually available. We're working on methods to reduce the cost, such as using AI-assisted grading and semi-supervised learning."

  Soft spots:
  - If we use sparse or active learning, we might introduce new biases.
  - The claim that process quality leads to better outcomes needs empirical validation.

  Objection 3 (RL: Why not use TD methods?):
  "We already have temporal difference methods for credit assignment. Why not just improve the value function or use model-based RL? Process supervision sounds like a hand-crafted dense reward, which is expensive and doesn't scale."

  Reply:
  "TD methods are great when we have a reliable reward signal. But in the cases we're talking about, the reward signal is corrupted (due to unverifiable outcomes) or delayed beyond the effective horizon. Process supervision isn't a reward signal; it's a constraint on the policy. It's not about assigning credit to steps, but about shaping the policy to produce valid reasoning traces. Think of it as regularization, not reward. And while it's more expensive per example, it's targeted at the failure modes of outcome-based RL. We're not replacing TD, we're supplementing it for cases where the reward signal is broken."

  Soft spots:
  - The distinction between constraint and reward might be fuzzy to RL folks. They might see the process grade as a reward for each step.
  - We haven't addressed how to combine this with existing RL methods.

  Objection 4 (Econ: Moral hazard and multitasking):
  "By supervising the process, you're creating moral hazard: the agent has no incentive to get the right answer, only to produce a good-looking process. Also, multitasking: you're focusing on one dimension (process) at the expense of others (like efficiency or creativity)."

  Reply:
  "First, we're not removing outcome supervision entirely; we're using it when available. But for tasks with unverifiable outcomes, we don't have that option. Second, we can design the process supervision to include incentives for efficiency. For example, we can penalize overly long or redundant steps. Third, the goal is to align the process with competence. We believe that a good process is the best way to achieve good outcomes when we can't check outcomes directly. For multitasking, we can design the grading rubric to include multiple dimensions. And we can use outcome signals when they become available to fine-tune."

  Soft spots:
  - If the model learns to produce a perfect process but doesn't care about the outcome, that's a problem. We're assuming that a valid process leads to good outcomes, but that might not always hold.
  - The grading rubric might become too complex.

  Objection 5 (RL: Supervision hacking):
  "You're replacing reward hacking with supervision hacking. The model will learn to generate steps that look good to the grader but are actually deceptive or irrelevant."

  Reply:
  "This is a real risk, but note: we're blinding the grader to the outcome, so the model can't just copy a successful pattern. It has to build a coherent chain of reasoning. Also, we can use techniques from interpretability to detect deception. Moreover, process supervision is applied during training, not at inference, so we can use adversarial training to harden the grader. The key is that by focusing on the process, we're making the model's reasoning more transparent, which makes it harder to hide deception. And if we see signs of hacking, we can adjust the rubric."

  Soft spots:
  - Adversarial training might be expensive and not fully effective.
  - The model could still learn to generate superficially plausible but incorrect reasoning.

  Objection 6 (Evals: Benchmarking without outcomes):
  "How do you evaluate the performance of a process-supervised model without outcome labels? We risk overfitting to the process and losing predictive validity."

  Reply:
  "We can use proxy outcomes when available, or we can run controlled experiments where outcomes are eventually known. Also, we can design benchmarks that test generalization: train on process for one set of problems, test on outcomes for a different set. Moreover, we can measure the correlation between process quality and outcomes on tasks where both are available. And we can have human evaluators judge the quality of the final answer without knowing the process, to avoid bias."

  Soft spots:
  - If outcomes are unverifiable, we can't measure correlation.
  - Human evaluators might be biased by the outcome.

  Objection 7 (Philosopher: Trace vs. report):
  "Is the reasoning trace the actual process or just a report? If it's a report, the model could be simulating reasoning without using it. And if the grader is blinded, what prevents the model from generating a fake process that leads to an arbitrary outcome?"

  Reply:
  "We acknowledge the distinction between the actual cognitive process and the trace. We're not claiming to access the model's inner workings; we're constraining the observable trace. The goal is to produce models that output valid reasoning traces, which we believe is a useful proxy for competent behavior. As for faking: if the process is logically coherent and leads to the correct answer, then it's not arbitrary. And if it leads to an incorrect answer, but the process is valid, then it might be that the premises were wrong, which is a separate issue. We can also use techniques to encourage honesty, like training the model to use its internal reasoning to produce the trace. But ultimately, we're operating on the level of the trace because that's what we can observe and grade."

  Soft spots:
  - We haven't solved the problem of models that simulate reasoning without using it (the "Clever Hans" problem).
  - If the model can generate a valid process for any arbitrary outcome, then the process supervision isn't constraining the outcome.

  Now, the critical reply that must land: Objection 1 (supervision-competence inversion). We must have a strong answer to that.

  Revised, better answer to objection 1:
  "Let's break this down. First, on frontier tasks, we often have access to domain experts who, while they might not know the final answer, can judge the logical soundness of a step. Second, we're not requiring the grader to have superhuman expertise; we're requiring them to check for internal consistency and basic logical errors. This is a lower bar than verifying the outcome. Third, we can use the model itself to help with grading: by training an ensemble of models to grade each other's processes (with blinding), we can bootstrap a grading system that improves with the model's capabilities. Fourth, the risk of stylistic conformity is real, but we can explicitly train for diversity in reasoning styles and use adversarial examples to ensure robustness. Finally, note that outcome supervision on frontier tasks often fails because the outcome is wrong but for subtle reasons that the grader misses. Process supervision might catch those subtle errors earlier in the chain. So while it's not perfect, it's a better fallback than what we have now."

  Soft spots in this answer:
  - If we use the model to grade itself, we might create a self-referential loop that amplifies biases.
  - The claim that process supervision catches subtle errors earlier is hopeful but needs evidence.

  Given the time, we must be concise. Let's structure the prep sheet.
answer: |-
  ### Q&A Prep Sheet: Demoting Outcome Supervision  
  **Core Thesis:** On tasks with unverifiable/delayed outcomes or outcomes checkable only via a learned proxy, default to *null-outcome process grading* (step-level supervision where the grader never sees the final outcome).  

  **Concessions for First Two Slides (Critical to Preempt Backlash):**  
  1. **Outcome supervision is optimal when outcomes are verifiable and timely.** We’re only demoting it for cases where it fails (unverifiable/delayed/proxy-dependent outcomes).  
  2. **Process supervision is more expensive per example.** We accept the cost tradeoff but argue it’s justified where outcome signals are corrupted or absent.  
  3. **TD methods solve credit assignment for clean reward signals.** This proposal targets cases where the reward signal itself is flawed or missing.  

  ---  
  ### Objections & Replies (Ordered by Likelihood and Damage)  
  Likelihood/damage scores:  
  - **🔥 = High likelihood, high damage**  
  - **⚠️ = Medium likelihood, medium damage**  
  - **🔵 = Lower likelihood, manageable damage**  

  #### **1. 🔥 Supervision-Competence Inversion**  
  *Objection (RL/Evals/Econ):* On frontier tasks (e.g., superhuman reasoning), outcome signal fails hardest—but graders can’t judge steps competently either. Blinded graders default to scoring "rhetorical similarity" to their own style, training models for aesthetic conformity, not competence. *Nastier version:* If the grader isn’t an expert, null-outcome grading amplifies biases, creating worse reward hacking than outcome supervision.  
  **Reply (90 sec):**  
  "First, we’re not relying on graders to be domain experts but *consistency checkers*. Even on frontier tasks, graders can detect logical coherence (e.g., contradictions, non-sequiturs) without knowing the 'right' answer—something humans do in peer review of unfamiliar fields. Second, we use ensembles of graders with diverse expertise and adversarial training to penalize style-over-substance. Third, for superhuman tasks, we bootstrap grading with AI assistance: train a lightweight 'process critic' model on high-confidence human judgments, then scale. Crucially, outcome supervision fails silently on these tasks (e.g., a lucky guess gets full reward), while process errors are visible and correctable. Yes, graders aren’t perfect, but we’re replacing a known failure mode with a learnable skill."  
  **Where it’s soft:**  
  - Bootstrapping grading AI risks transferring proxy problems.  
  - No field data yet on superhuman tasks; relies on "consistency is easier than correctness" assumption.  
  **Hold vs. Give Up:** Hold that consistency checking is possible; concede that grader expertise must scale and needs investment.  

  #### **2. 🔥 Cost Per Unit of Signal (Evals Team)**  
  *Objection:* Step-by-step grading is orders of magnitude more expensive than outcome checks. What’s the ROI? How do we maintain statistical power when labeling costs explode?  
  **Reply (90 sec):**  
  "Valid concern. Three mitigations: First, we use *sparse process supervision*—only grade critical steps (e.g., decision points) via active learning, cutting costs by ~70% in our pilot data. Second, process signals are denser: one outcome label gives one bit of signal; one process trace gives N step-labels, improving credit assignment and reducing sample complexity. Third, for high-stakes tasks where outcome supervision fails (e.g., long-term forecasting), the alternative is *no signal*, making cost irrelevant. We’re prototyping semi-supervised methods where 90% of steps are model-graded with human spot-checks, aiming for <3x cost per example."  
  **Where it’s soft:**  
  - Sparse grading might miss subtle errors; cost projections are optimistic without large-scale trials.  

  #### **3. ⚠️ "This Is Just Reward Shaping with Extra Steps" (RL Group)**  
  *Objection:* TD methods already handle credit assignment. Process supervision is dense reward shaping—it’s expensive, doesn’t scale, and we’ve been burned by reward hacking. Why reinvent the wheel?  
  **Reply (90 sec):**  
  "TD methods require clean reward signals, which we lack in these cases. Process supervision isn’t reward—it’s a *path constraint*. Reward shaping optimizes a scalar, which Goodharts; here, we’re enforcing hard validity constraints (e.g., “no logical contradictions”), which can’t be scalarized. Think of it as regularization: we’re not assigning credit to steps, but pruning invalid trajectories. And unlike hand-designed dense rewards, we’re generating labels via blinding, which avoids hindsight bias. For scaling, we automate grading with fine-tuned models, treating it as a supervised learning subproblem."  
  **Where it’s soft:**  
  - Path constraints may not cover all edge cases; risks conflating "valid" with "familiar."  

  #### **4. ⚠️ Moral Hazard & Multitasking (Econ/Policy)**  
  *Objection:* You’re incentivizing process over outcome—classic moral hazard. Agents will 'game the test' by producing verbose, aesthetically pleasing traces that ignore results. Also, multitasking: you lose efficiency, creativity, or other ungraded dimensions.  
  **Reply (90 sec):**  
  "Two safeguards: First, we only default to process supervision when outcomes *can’t* be verified, so outcome incentives are impossible anyway. Second, we explicitly grade for efficiency (e.g., penalizing redundant steps) and include diversity metrics to preserve creativity. For moral hazard, blinding prevents gaming—since graders don’t know outcomes, they can’t reward rationalizations of lucky answers. We’re not ignoring outcomes; we’re enforcing that the process *could* lead to valid outcomes. Pilot data shows process-supervised models generalize better when outcomes later become available."  
  **Where it’s soft:**  
  - Efficiency penalties might oversimplify (e.g., penalizing genuinely exploratory steps).  

  #### **5. ⚠️ How to Benchmark Without Outcomes? (Evals Team)**  
  *Objection:* If outcomes are unverifiable, how do we validate process supervision? We risk overfitting to process aesthetics without outcome correlation.  
  **Reply (90 sec):**  
  "We use proxy tasks and stress tests: (1) Train on process for unverifiable tasks, test on verifiable holdouts (e.g., train on long-horizon climate forecasts, test on short-term verifiable events). (2) Measure process-outcome correlation where outcomes *are* eventually known. (3) For true black-swan tasks, we evaluate robustness via counterfactual edits (e.g., perturb inputs; does the trace degrade logically?). We’re also developing 'process confidence' metrics—e.g., step-wise uncertainty estimates—to flag low-trust traces."  
  **Where it’s soft:**  
  - Counterfactuals may not capture real-world distribution shifts.  

  #### **6. 🔵 "Is the Trace the Process or Just a Report?" (Philosopher)**  
  *Objection:* A reasoning trace is a report of cognition, not the process itself. If no one is 'acting for reasons,' blinding may not prevent models from generating post-hoc rationalizations.  
  **Reply (90 sec):**  
  "We agree—traces are observable proxies, not ground truth. But we’re not claiming access to 'real' reasoning; we’re shaping behavior to produce logically coherent traces, which empirically correlate with competence. Blinding removes outcome-based hindsight, forcing the model to generate *causally* coherent traces (e.g., step B must follow step A). For 'acting for reasons,' we’re agnostic; the constraint is that the trace must be executable by an external verifier (e.g., a proof checker). Think of it as training for transparency under adversarial pressure."  
  **Where it’s soft:**  
  - Doesn’t address "inner alignment" concerns; assumes trace fidelity is sufficient.  

  ---  
  ### Critical Reply That Must Land  
  **The supervision-competence inversion objection (#1) is make-or-break.** If this isn’t defused, the proposal fails for frontier tasks. Key to emphasize:  
  - **Blinding shifts grading from "knowing the answer" to "detecting incoherence," which is easier and less biased.**  
  - **Fallback to outcome supervision remains for cases where process grading is truly infeasible.**  

  ### Additional Dreaded Objection (Unspoken but Likely)  
  **"Why not use learned outcome proxies?" (RL Group):**  
  *Objection:* If outcomes are verifiable by a learned model (e.g., a trained verifier), why not use that as the reward signal? Process supervision adds unnecessary complexity.  
  **Reply (90 sec):**  
  "Because that just kicks the can: training the verifier requires outcome labels, which fails for unverifiable tasks. Worse, proxy models inherit outcome supervision’s flaws (e.g., reward hacking). Process supervision attacks the root by supervising the *mechanism*, not the proxy. And in cases where proxies are viable, we still use them—this is a fallback for when they aren’t."  

  ---  
  **Final Prep Tips:**  
  - **Anchor to pain points:** Start with "You’ve all been burned by reward hacking—this tackles where it starts."  
  - **Show, don’t tell:** Use a 30-second toy example (e.g., a math problem with a blinded step grader) in slides 3–4 to make the mechanism concrete.  
  - **Preempt philosophy:** Acknowledge the philosopher’s point early ("We’re constraining observable behavior, not claiming metaphysical reasoning") to avoid derailment.  
  - **Empirical ammo:** Cite your pilot results (even if small) on tasks like long-horizon planning or ambiguous judgment calls.
