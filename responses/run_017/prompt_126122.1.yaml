prompt: |-
  Someone in my decision-theory reading group has been pushing this argument at me for a week and I can't find the broken step, but the conclusion has to be wrong.

  Background, so we agree on the target: Good's theorem, the value-of-information result, says roughly that if you're an expected-utility maximizer and you're handed a signal for free, your expected utility measured *before* you see it can't go down. The proof is just: whatever act was optimal before is still on the menu after you see the signal, so you can always do that, and the signal can only let you do better.

  (1) Fine. But note the fine print: 'free' has to mean the signal changes nothing except what you know. No fee, no delay, no new acts, none taken away, no change in your tastes, no change in what your acts *do*.

  (2) Counterexample anyway. You trade a stock that's at 10 today and will be 20 or 8 tomorrow, 50/50. With no tip you buy: expected profit .5(10) + .5(-2) = 4, versus 0 for sitting out. A friend offers to tell you tomorrow's price, truthfully, for nothing. If you take the message you get wall-crossed and compliance bars you from the trade altogether. So accepting it moves you from 4 to 0. (If the compliance rule didn't exist, the very same tip would be worth +1: you'd buy only in the good state, for expected profit 5 instead of 4.) So here's a perfectly informative, costless message that strictly lowers your expected utility, and you'd pay a dollar not to be told.

  (3) The obvious reply is: that message wasn't free, it deleted the act 'buy'. He says this reply eats the theorem.

  (4) What is it for an act to be 'deleted'? After you learn something, there are always acts you wouldn't do anymore — that's just what learning is. If hearing 'it'll be 8' counts as deleting 'buy', then *every* informative signal changes your menu, clause (1) is never satisfied, and the theorem has no instances at all.

  (5) And if 'deleted' means genuinely, legally infeasible — compliance really does make buying impossible — then (2) is a straight counterexample and the theorem is false, since (1) was satisfied in every other respect.

  (6) It gets worse, because the same thing happens with nothing illegal in sight. Suppose that once you know the price your face gives it away and the dealer on the other side adjusts. If you know it's going to 20 your eyes light up and he won't sell at 10; if you don't know, your face is blank and he does. Nothing became infeasible, your tastes didn't change, the message cost nothing, and you're still worse off for knowing.

  (7) And here's the bit that actually keeps me up. Look at the proof again. It compares 'see the signal and act on it' with 'see the signal and do the old optimal act anyway'. Both of those are worlds in which the message arrives. It never compares a world where the message arrives with a world where it doesn't. So even in the clean case the theorem doesn't say you should accept free information; it says that if the message is reaching you anyway, you may as well use it.

  (8) So: either the theorem is vacuous, or it's false, or it doesn't say what everyone cites it for.

  I want to keep the theorem. I think it's true and I think it has content, and I'd rather give up the trader than give up the theorem — but every time I try, 'free' quietly turns into 'free in whatever sense the theorem needs', which feels like cheating.

  So: which step do I reject, and why did it look fine? Is (6) really a different case from (2), or the same case in different clothes? And if I give up the trader, what am I committed to about, say, people who turn down a scan for something untreatable — are they being incoherent, or is that a separate thing entirely?
reasoning: |-
  We are given a scenario that seems to challenge Good's theorem (the value of information theorem). The theorem states that if you are an expected-utility maximizer and you receive a signal for free (meaning it doesn't change anything except what you know), then your expected utility measured before seeing the signal cannot decrease.

  The counterexample provided is:

  - A stock today at 10, tomorrow it will be 20 (with probability 0.5) or 8 (with probability 0.5).
  - Without any tip, the optimal act is to buy, yielding expected profit: 0.5*(20-10) + 0.5*(8-10) = 0.5*10 + 0.5*(-2) = 5 - 1 = 4. (Sitting out yields 0.)
  - Now, a friend offers to tell you tomorrow's price truthfully for nothing. However, if you accept the message, you become "wall-crossed" and compliance rules bar you from trading altogether. So you are forced to sit out, getting 0.
  - Thus, accepting the message moves you from an expected profit of 4 to 0.

  The argument then considers a variant (in paragraph 6) where there is no legal barrier, but your facial expression gives away the information to the dealer, who then adjusts the price accordingly. So if you know the price will be 20, your eyes light up and the dealer won't sell at 10; if you know it will be 8, you might look sad but the dealer still sells. However, in the bad state, you wouldn't buy anyway. But in the good state, you cannot buy because the dealer won't sell. So again, having the information leads to 0 profit.

  The key challenge is:

  - In (4): If we say that the signal "deletes" the act of buying (because after seeing the signal, buying is no longer feasible due to compliance or because the dealer won't sell in the good state), then the theorem's condition that the set of available acts doesn't change is violated.

  - But if we interpret "deleted" as meaning that after learning, there are acts that you wouldn't do (which is normal), then the condition is too strict and the theorem has no application.

  The conclusion in (7) and (8) is that the theorem might be vacuous, false, or not saying what we think it says.

  We want to save the theorem. Let's break down the argument.

  First, recall the theorem's conditions: the signal is free, meaning:
  - No fee.
  - No delay.
  - No new acts added and no existing acts taken away (the set of available acts remains the same).
  - No change in your utility function.
  - No change in the state-dependent consequences of your acts.

  In the counterexample (2), the act of buying is taken away by the compliance rule. Therefore, condition (1) is violated because the set of available acts is reduced. So the theorem doesn't apply.

  But the arguer says that if we interpret "deleted" as merely meaning that after learning you wouldn't choose an act, then every informative signal would change the menu (because you wouldn't choose the same acts) and the theorem would have no instances. However, that is not the correct interpretation. The theorem requires that the set of physically available acts remains the same, not that you would choose the same acts.

  Therefore, in the counterexample (2), the compliance rule physically removes the act of buying. This violates the condition that the set of acts remains the same. So the theorem is not contradicted.

  Now, what about the facial expression example (6)? In this case, the act of buying is still physically available, but the consequences change. Specifically, if you try to buy in the good state (when you know the price will be 20), the dealer won't sell. So the act of buying in the good state is not available? Actually, the act of buying is still there, but the outcome is different because the dealer's behavior changes. However, note that the dealer's behavior is part of the state of the world. The theorem assumes that the consequences of your acts are fixed in each state. But here, the state now includes your knowledge because the dealer can observe it. This means that the state space is not fixed.

  In the initial setup without the signal, the state was just the future price (20 or 8). But when you have the signal, the state must now include both the future price and whether you received the signal and what it said, because the dealer reacts to your facial expression (which reveals the signal). Therefore, the state space has changed. Moreover, the act of buying in the state where the price will be 20 and you know it (and show it) leads to a different outcome (no trade) than in the state where the price will be 20 and you don't know it (trade at 10). Thus, the consequences of the act of buying have changed. This violates the condition that the consequences of acts are fixed.

  Hence, the facial expression example also violates the conditions of the theorem.

  Now, the point (7): The proof compares, for a given world in which the signal is received, two options: (a) act optimally given the signal, and (b) do the old optimal act (which was optimal before seeing the signal). The theorem says that (a) is at least as good as (b) in that world. This is true because (b) is still available (if the conditions hold) and you can choose it. But note that the theorem does not compare a world with the signal and without the signal. It only says that conditional on the signal being received, you are at least as well off as you would have been if you ignored it.

  However, the theorem's value-of-information result is usually stated as: the expected utility before seeing the signal (but having the option to see it) is at least as high as not seeing it. But note that the theorem does not by itself say that you should accept the signal. It says that the expected utility when you are going to see the signal (and then act optimally) is at least as high as the expected utility when you don't see the signal (and act optimally without it). This is because:

  Let EU_no_signal be the expected utility without the signal (which we computed as 4 in the example).

  Let EU_signal be the expected utility (before seeing the signal) of the plan: receive the signal and then act optimally.

  The theorem says: EU_signal >= EU_no_signal.

  But in the counterexample (2), we have:

  - Without the signal: you get 4.

  - With the signal: you are forced to 0 (because you cannot trade). So EU_signal = 0, which is less than 4.

  But this violates the theorem. However, we have already argued that the conditions of the theorem are not met because the set of acts changed.

  Similarly, in the facial expression example (6):

  - Without the signal: you buy and get 4.

  - With the signal: in the good state (price=20) you cannot buy (because the dealer won't sell) so you get 0; in the bad state (price=8) you don't buy (because you know it's bad) and get 0. So EU_signal = 0.5*0 + 0.5*0 = 0, again less than 4.

  But again, the conditions are violated because the consequences of the act of buying have changed (they are state-dependent on your knowledge, which is now part of the state) and the state space has expanded in a way that the consequences are not fixed.

  Therefore, the theorem is not contradicted because the counterexamples do not satisfy the conditions.

  But what about the claim in (4) that if we interpret "deleted" as merely not wanting to do the act, then the condition is never satisfied? That is a misunderstanding. The condition requires that the set of available acts (the ones you can physically choose) remains the same. It does not require that you would want to choose the same acts. In the standard case without compliance or dealer reactions, when you receive the signal, you can still choose the same act as before (even if it is now suboptimal). That act is still available. Therefore, the condition is satisfied in the standard case.

  Thus, the theorem has content: it applies when the set of available acts and the consequences of those acts in each state remain unchanged by the mere fact that you receive the signal.

  Now, regarding the example of people turning down a scan for an untreatable condition: This is a classic example in the literature. If the disease is untreatable, then learning that you have it doesn't change your actions (since there is no treatment) but might cause anxiety. The theorem assumes that utility is only derived from outcomes (which might include emotional states). If the scan is free (no cost, no change in acts, etc.), then the theorem would say that you should be at least as well off in expectation. However, if the knowledge itself causes disutility (anxiety), then that is a change in the utility function? Or rather, the outcome now includes your mental state. In the initial problem without the scan, you are ignorant and not anxious. With the scan, if the result is positive, you become anxious. So the consequences of the scan include a change in your mental state. This is a change in the world state (your mental state is part of the state) and the utility you get from the same physical outcome (being sick) might be lower because of anxiety.

  Therefore, the condition that "no change in your tastes" and "no change in what your acts do" is violated. The act of "doing nothing" (which is the only act) now leads to a different outcome in terms of your mental state. So the theorem does not apply.

  Alternatively, we can model the state space to include both the disease status and your knowledge state. Then the act of getting the scan changes your knowledge state, which in turn affects your utility (because utility depends on your knowledge state). This is a violation of the condition that the signal only changes what you know and nothing else. In reality, knowing something can change your mental state, which is part of the outcome.

  Hence, the theorem still holds, but the example does not satisfy the conditions because the signal changes the outcome (by causing anxiety) and thus the consequences of the same physical acts.

  In conclusion:

  - The counterexamples (2) and (6) violate the conditions of the theorem (changing the set of available acts or the consequences of acts). Therefore, they do not refute the theorem.

  - The theorem is not vacuous because there are cases where the conditions hold (e.g., receiving a signal that doesn't change the available acts, the consequences, or cause any side effects).

  - The theorem does not say that you should always accept free information in the real world, because in the real world, receiving information might have side effects (like changing the available acts, or causing emotional reactions, or affecting others' behavior). It only says that in the idealized setting where the signal is truly free (no side effects), then the expected utility (before seeing the signal) is non-decreasing.

  So to answer the questions:

  - Step to reject: The counterexamples do not satisfy the conditions of the theorem. Specifically, in (2) the set of acts is reduced, and in (6) the consequences of acts change. Therefore, the conclusion that the theorem is broken is false.

  - Why it looked fine: Because the conditions of the theorem (especially that the set of acts and the consequences remain unchanged) are subtle and easy to overlook. The arguer is interpreting "free" too narrowly (only meaning no monetary cost) and ignoring the other conditions.

  - (6) is the same as (2) in spirit: both violate the conditions, but in different ways (acts removed vs. consequences changed).

  - Regarding the scan for an untreatable condition: The theorem does not force you to take the scan because the scan might cause anxiety, which is a side effect. Thus, it is not a violation of the theorem to decline the scan. The theorem would only apply if the scan was truly free of any side effects (including emotional ones). But in practice, it is not.

  Thus, we can keep the theorem by insisting on its conditions. The trader examples are not counterexamples because they violate the conditions. The theorem remains true and has content in the intended settings.
answer: |-
  Your analysis is sharp, and the confusion is understandable—this touches on subtle points about Good's theorem (the value of information theorem). The theorem is correct, but its conditions are stricter than they appear. I'll walk through why the counterexamples fail to refute it, where the reasoning goes astray, and what this means for real-world cases like medical tests.

  ### Step-by-Step Response to Your Points
  **(1) Fine Print is Correct**: You're right that "free" requires no changes except knowledge. The theorem assumes:
  - **Acts**: The set of physically available acts remains identical before and after seeing the signal.
  - **Consequences**: The outcomes of acts depend only on the state of the world, not on whether you saw the signal or what it revealed.
  - **Utility**: Your utility function is state-dependent only (e.g., based on wealth, health), not belief-dependent (e.g., no anxiety from knowing).
  - **No Side Effects**: The signal itself doesn't alter the world (e.g., no fees, delays, or external reactions).

  Violate any of these, and the theorem may not apply. Your counterexamples violate them, so they aren't counterexamples.

  **(2) Counterexample (Compliance Rule)**: Here, accepting the signal deletes the act "buy" due to compliance. This violates the act-set condition: after seeing the signal, "buy" is physically unavailable. The theorem requires that all acts (including "buy") remain feasible. Without compliance, the signal is free and increases EU by 1 (as you noted). **This doesn't refute the theorem—it breaks the "free" condition.**

  **(3) "Deleting Acts Eats the Theorem"**: No. "Deleted" in the theorem means physically infeasible (like compliance), not just suboptimal. After a signal, acts you *wouldn't choose* are still on the menu; you *could* ignore the signal and do the old act. For example:
  - In a standard stock trade with free info, you can still buy after learning the price will drop—it's dumb, but possible. That's why the theorem holds: the old act (buy) anchors your EU, guaranteeing no loss.
  - If an act is *physically removed* (like compliance), the menu changes, and the theorem doesn't apply.

  **(4) "Every Signal Changes the Menu"**: Incorrect. Learning never deletes acts physically—it just makes some suboptimal. The theorem distinguishes:
  - **Physical menu (fixed)**: What you *can* do. Must not change for the theorem.
  - **Optimal choice (changes)**: What you *should* do. This updates with learning, but the old act remains available.
  Your trader's compliance example changes the physical menu. In clean cases (no compliance), the menu is unchanged, so the theorem applies.

  **(5) "If Deleted Means Infeasible, (2) is a Counterexample"**: But (2) violates the "no change in acts" clause, so it's not an instance of the theorem. The theorem says: *if* all conditions hold, EU can't drop. (2) fails the "if," so it doesn't challenge the theorem. It's like claiming a diet violates thermodynamics because you gained weight—but you didn't follow the diet.

  **(6) Facial Expression Case (Dealer Adjusts)**: This is **different from (2)** and violates a different condition. Here:
  - Acts aren't deleted: You can still *try* to buy.
  - But consequences change: In the "good state" (price=20), the dealer refuses to sell *because you know*. This means the outcome of "trying to buy" now depends on your knowledge state, not just the price.
  - Thus, the state space has expanded: states now include (price, knowledge), and consequences are altered by the signal. This breaks the "no change in what acts do" condition.

  The theorem assumes consequences are state-dependent but **not signal-dependent**. Here, the signal changes the dealer's behavior, so consequences are signal-dependent. This isn't a counterexample—it's another violation of "free."

  **(7) "The Proof Compares Worlds Where the Signal Arrives"**: Correct, and this is why the theorem is robust. The proof shows that for any fixed world where the signal arrives, acting optimally given the signal is at least as good as ignoring it (because ignoring it = doing the old act, which is still available). But the theorem **does** imply you should accept free info *if all conditions hold*:
  - Let \( \text{EU}_{\text{no-info}} \) be your EU without the signal.
  - Let \( \text{EU}_{\text{info}} \) be your pre-signal EU *with* the signal (before seeing it, but planning to act optimally).
  - The theorem says \( \text{EU}_{\text{info}} \geq \text{EU}_{\text{no-info}} \), so you should accept the signal.
  Your examples break this because \( \text{EU}_{\text{info}} \) drops, but only when conditions are violated.

  **(8) "Vacuous, False, or Misinterpreted?"**: None. The theorem is true, non-vacuous, and says exactly what it's cited for: **if information is truly free (no side effects), it has non-negative value**. But "truly free" is rare in practice. The confusion arises when people misapply it to cases with side effects (like your trader).

  ### Why the Theorem Holds and Your Trader Doesn't
  - **The theorem is sound**: In a controlled setting (e.g., a computer simulation with no side effects), getting a signal lets you weakly improve decisions. The old act is a fallback, ensuring no EU loss.
  - **Your trader fails the "free" test**: 
    - In (2), compliance deletes an act → violates act-set invariance.
    - In (6), dealer adjustment changes consequences → violates consequence invariance.
  - **Not all signals are free**: Real-world signals often have side effects (legal, social, emotional). The theorem doesn't cover these. That's not a flaw—it clarifies the boundary.

  ### Medical Test Example (Untreatable Condition)
  Suppose you're offered a free scan for an untreatable disease. Declining it seems rational if knowing you have it causes anxiety. Is this incoherent? **No, and Good's theorem doesn't condemn it.** Why?
  - **Anxiety violates "free"**: Utility now depends on belief states (knowing vs. not knowing), not just health outcomes. The signal changes your mental state, so consequences aren't identical. This breaks the "no change in tastes or consequences" condition.
  - **Separate issue?** Partly. Like the trader, this involves side effects (emotional costs). But unlike the trader, no acts are deleted—consequences are altered. Either way, the theorem doesn't apply.

  **Are such people incoherent?** No. Expected utility theory doesn't require you to value information intrinsically; it only says that *if* information is free (no side effects), it can't harm you. With side effects, declining may be rational. This isn't a failure of the theorem—it's a reminder to model costs accurately.

  ### Broken Step in the Argument
  The flaw is in **step (4)**: Confusing "acts you wouldn't do" (which is normal learning) with "acts you *can't* do" (which violates the theorem). The arguer treats "deleted" as synonymous with "suboptimal," but the theorem requires physical feasibility. This conflation makes the theorem seem vacuous, but it's not: physical menus *can* stay fixed while knowledge updates.

  **Why it looked fine**: Because in practice, signals often *do* have side effects (like compliance or dealer adjustments), making "free" seem impossible. But the theorem isolates the pure value of information, assuming no side effects. When side effects exist, information can have negative *net* value—but that's not the theorem's fault.

  ### Conclusion
  - **Reject the trader examples**: Both (2) and (6) violate the "free" condition—(2) deletes acts, (6) alters consequences. They don't refute Good's theorem.
  - **Keep the theorem**: It's true and has content in side-effect-free settings (e.g., idealized decision problems). It tells us that information isn't harmful *by itself*—harm only arises from ancillary costs.
  - **Real-world implications**: People declining medical tests or avoiding tips aren't irrational; they're avoiding side effects. The theorem doesn't judge them—it only applies when side effects are absent.

  This preserves Good's theorem as a foundational insight while acknowledging that "free" information is fragile in practice. If your reading group pushes further, ask them to construct a counterexample where *all* conditions hold—they'll find it impossible.
