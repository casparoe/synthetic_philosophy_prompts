  - Subject A has a deck with colors in order: red, orange, yellow, ... and a legend that says "red" for the first, "orange" for the second, etc.
  - Subject B has a deck that is shifted by two positions: so the first swatch is actually yellow, but the legend for Subject B calls it "red", the second is green but called "orange", etc.

