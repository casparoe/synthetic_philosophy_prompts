  Below is a comprehensive game design tailored to your goals, followed by a debriefing guide, anticipated challenges, and strategies for addressing objections. The game avoids explicit mentions of "qualia" or "Dennett" until the debrief, focuses on the incoherence of intrinsic properties, and accommodates the color-vision-deficient student.

  ---

  ### **Game Design: "The Silent Swap"**
  **Objective:** Students discover that attempts to define an "intrinsic" property (e.g., qualia) collapse into relational/functional properties.  
  **Core Insight:** When all relational/functional properties (discrimination, naming, similarity, behavior) are held fixed, claims about "intrinsic changes" lack identity conditions.  
  **Structure:** 5 rounds (12-15 min each), 3 roles per group, printable materials.  
  **Roles (per group of 6):**  
  - **Subject (2 per group):** Receives a color deck + legend, performs tasks, writes ledger entries.  
  - **Intervener (2 per group):** Swaps decks/legends between rounds, logs actions secretly.  
  - **Auditor (2 per group):** Reviews paper trails (ledgers, task outputs) to detect swaps.  
  *Rotate roles after Round 3 for engagement.*  

  **Materials per Group:**  
  - 2 identical decks of 12 color swatches (e.g., paint chips in a hue spectrum: red → orange → yellow → green → blue → purple).  
  - 2 "rotated" decks: Each is a **hue-shifted automorphism** of the original (e.g., all hues shifted +3 positions: red becomes yellow, orange becomes green, etc.).  
  - 4 legends (color names mapped to swatches), rotated to match each deck.  
  - Index cards for ledgers, logs, and handover descriptions.  
  - Projector for instructions (minimal text to avoid priming).  

  **Setup:**  
  - Subjects start with different decks (e.g., Subject 1: Original, Subject 2: +3 shift). Legends match their decks.  
  - All decks share identical **relational structure** (e.g., swatch #1 and #2 are adjacent hues; #1 vs. #6 are maximally distant).  
  - **Color-Vision Deficiency:** Assign the CVD student as an Intervener or Auditor (non-Subject role). Use high-contrast swatches (avoid red-green) or substitute **shape/texture decks** (e.g., abstract patterns varying in complexity/curvature) if needed.  

  ---

  #### **Game Rounds**  
  **Round 0: Practice (5 min)**  
  - **Task:** Subjects name all swatches (using legend), rank top 3 favorites, and note which two swatches are "most similar."  
  - **Goal:** Familiarize with decks; establish baseline relational outputs (naming, preferences, similarity).  

  **Round 1: Global Swap (Undetectable Change)**  
  - **Intervener Action:** Swap both Subjects’ decks + legends with their rotated versions (full automorphism). Log the swap.  
  - **Subject Task:** Repeat Round 0 tasks.  
  - **Ledger Entry (Private):**  
    - *For yourself:* "One sentence to know if YOUR experience changed."  
    - *For a partner:* "One sentence to let OTHERS know if your experience changed."  
  - **Payoff:** Subjects bet 1 token (see payoff scheme) if they assert a change.  

  **Round 2: Partial Swap (Detectable Change)**  
  - **Intervener Action:** Swap one swatch between decks (e.g., move Swatch #5 from Subject 1 to Subject 2). Log the swap.  
  - **Subject Task:** Rank all swatches by similarity to Swatch #1 (1=most similar, 12=least).  
  - **Ledger Entry:** Same as Round 1.  
  - **Payoff:** Subjects bet 1 token to assert change. Auditor bets 1 token to guess if a swap occurred.  

  **Round 3: Round-Trip Swap (Identity Crisis)**  
  - **Intervener Action:** Perform two global swaps (Subject 1 → rotated deck → back to original). Log both swaps.  
  - **Subject Task:** Describe Swatch #1 in one word (without using color names, e.g., "vibrant").  
  - **Ledger Entry:** "Did your experience change? How many times?"  
  - **Payoff:** Subjects bet 2 tokens to state the number of changes (0, 1, or 2).  

  **Round 4: False Disclosure (Verbal "Facts")**  
  - **Intervener Action:** NO SWAP. Tell one Subject a swap occurred; tell the other nothing.  
  - **Subject Task:** Pair Subjects; each writes whether they think their partner’s experience changed.  
  - **Ledger Entry:** None.  
  - **Payoff:** Subjects bet 1 token if they claim their partner’s experience changed.  

  **Round 5: Handover (Ineffability Test)**  
  - **Intervener Action:** NO SWAP.  
  - **Subject Task:**  
    - Write a description of "the property you are directly aware of" (no stimuli/behavior references).  
    - Swap descriptions with partner; guess if you have the "same property."  
  - **Payoff:** Win 2 tokens if partner guesses "same"; lose 1 if they guess "different."  

  ---

  #### **Payoff Scheme (No Money)**  
  - **Tokens:** Start with 10 tokens (point chips). Trade tokens for "priority points" (e.g., choice of discussion topic, exemption from homework, symbolic "philosopher’s stone" trophy).  
  - **Costs:**  
    - Asserting change/identity costs tokens (R1–R5).  
    - Staying silent costs nothing but forfeits rewards.  
  - **Incentives:**  
    - Correct assertions win tokens (e.g., +2 for correct change in R1; +3 for correct round-trip count in R3).  
    - Incorrect assertions lose tokens (e.g., –1 for false change in R1; –2 for wrong round-trip count).  
    - Auditors win/lose tokens based on detection accuracy.  
  - **Why it works:** High reward for correct detection (e.g., R3 round-trip) offsets silence’s safety. Cog-sci majors engage to "win"; philosophers engage to "prove" intrinsicity.  

  ---

  ### **Debrief: Mapping Game to Incoherence Claim**  
  **Core Argument Recap:**  
  > Qualia posits require an *intrinsic* property that is also *ineffable*, *private*, and *directly apprehensible*. Yet, all methods to identify it (discrimination, naming, similarity, behavior) are relational. Remove relations, and the property lacks identity conditions.  

  **Round-by-Round Mapping:**  
  1. **Round 1 (Global Swap):**  
     - **Incoherence Point:** Privately, Subjects "feel" a change (different hues), but relational outputs (naming, preferences) are identical.  
     - **Link:** "Intrinsic" properties can’t be verified without relational anchors. The "change" is empty without functional differences.  
     - **Quote:** *"Strip away the relations, and what’s left has no work to do."*  

  2. **Round 2 (Partial Swap):**  
     - **Incoherence Point:** The broken similarity structure makes the change detectable.  
     - **Link:** Relational structure defines the "space" of possible changes. Intrinsic properties only "dance" within relational symmetries.  
     - **Quote:** *"The only ‘dances’ allowed are those that preserve the relational web."*  

  3. **Round 3 (Round-Trip):**  
     - **Incoherence Point:** Subjects can’t agree if changes occurred twice or zero times.  
     - **Link:** With identical start/end states, "how many changes happened?" has no answer—undermining the idea of intrinsic *identity* over time.  
     - **Quote:** *"No fact about intrinsic flickers survives if inputs/outputs match."*  

  4. **Round 4 (False Disclosure):**  
     - **Incoherence Point:** Verbal reports create "facts" about changes without any difference in behavior or stimuli.  
     - **Link:** Private claims are untestable; they can be manufactured without altering anything observable.  
     - **Quote:** *"If a ‘change’ changes nothing, what does it change?"*  

  5. **Round 5 (Handover):**  
     - **Incoherence Point:** Descriptions of "intrinsic properties" (e.g., "vibrant") are too vague for partners to match.  
     - **Link:** Direct apprehension ≠ communicable identity. Ineffability collapses into functional/pragmatic criteria.  
     - **Quote:** *"You can’t point to intrinsicness without borrowing relations."*  

  ---

  ### **Predictable Problems & Recovery**  
  1. **"It’s a Trick! Swaps are undetectable by design."**  
     - **Recovery:** "Yes—the game forces a scenario where relational properties are fixed. If intrinsicity is meaningful, it should still be detectable *somehow*. Why wasn’t it?"  

  2. **Conflating Swaps with Memory Erasure:**  
     - **Recovery:** Clarify: "Memory is intact. Subjects *can* say, ‘I saw red earlier, now I see green.’ But in Round 1, naming/preferences didn’t change. Why can’t they *prove* the change to others?"  

  3. **Cog-Sci Majors: "Difference = Discriminability!"**  
     - **Recovery:** Leverage Rounds 3–5: "In Round 3, discriminability was identical at start/end. Was there *really* two changes? In Round 5, if intrinsicity exists, why couldn’t you describe it without relations?"  

  4. **Intervener "Cheating" or "Stimulus Change":**  
     - **Recovery:** "The deck represents the *total experiential state*. Changing it simulates a shift in ‘what it’s like.’ If this feels artificial, what would a non-artificial change look like?"  

  5. **CVD Student as Outlier:**  
     - **Solution:** Use **shape/texture decks** (e.g., 12 abstract patterns varying in curvature/complexity). Rotate via automorphisms (e.g., shift complexity values). CVD students can participate fully.  

  ---

  ### **Limitations & Handling Realist Objections**  
  **What the Game Can’t Replicate:**  
  1. **First-Person Seeming:** The "what it’s like" feeling that persists despite failed verification.  
  2. **Experience ≠ Stimulus Change:** Swapping cards alters stimuli, not "pure experience."  

  **Addressing Realists in Debrief:**  
  - **Acknowledge:** "This game *doesn’t* replicate the first-person feeling. It asks: If that feeling is intrinsic, how do you *individuate* it? How do you know yours changed, or that two people share it?"  
  - **Reframe:** Use their objection: "You’re right—the game changes stimuli, not ‘experience itself.’ But if experience is intrinsic, how *would* we change it while keeping all relational properties fixed? What would count as evidence?"  
  - **Bridge to Dennett:** "This is where Dennett’s ‘dancing qualia’ reply kicks in: If all functional roles are identical, the ‘intrinsic flicker’ does no work. It’s not just private—it’s *incoherent* as a scientific posit."  

  **Close:** "The game isn’t ‘proof’ against qualia. It’s a challenge: Either accept that intrinsicity requires relational criteria, or explain how it doesn’t. Next class, we see how Dennett and his critics tackle this."  

  ---

  **Time Allocation (80 min):**  
  - Setup (10 min)  
  - Rounds 0–5 (50 min)  
  - Debrief (20 min)  

  This design forces confrontation with incoherence while balancing rigor and engagement. Run a dry test with colleagues to refine timing!
