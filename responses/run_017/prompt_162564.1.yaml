    We map the rounds to the incoherence claim:

    - Round 1 (Global Swap): Illustrates that a change in qualia that preserves all relations is undetectable by relational properties. The Auditor, seeing the same task outputs, cannot detect the swap. The Subjects might detect it by memory of intrinsic properties, but that memory is private and fallible. Moreover, when they try to communicate it (in the ledger for a partner), they have to use relations, which are preserved, so they can't.

    - Round 2 (Partial Swap): Illustrates that a change that breaks the relations is detectable. The task outputs will change, and the Auditor can detect it.

    - Round 3 (Round-Trip): Asks whether the qualia changed twice or not at all. The Subjects might have written in their ledger that there was a change and then a change back, but the tasks outputs are the same. The point is that there is no fact of the matter that is not relational. If the relations are the same, there's no difference.

    - Round 4 (False-Disclosure): Shows that a "fact" about a change can be introduced without any actual change in qualia or in the relations. The Subjects who were told they were swapped might report a change in their ledger, even though nothing changed.

    - Round 5 (Handover): Shows that attempts to refer to intrinsic properties without relations fail. The descriptions will be vague or metaphorical, and the partners won't be able to determine if they are the same.

    What will go wrong:

    1. "The swap is undetectable only because you stipulated it, so it's a trick." 
       - Response: The point is to show that if we try to define qualia as intrinsic and ineffable, then any change that preserves relations is undetectable and hence there is no fact of the matter. The stipulation is for the sake of the thought experiment.

    2. "People conflating the swap with memory erasure."
       - We can clarify that we are not erasing memory. The Subjects can use memory. But then they can detect the global swap. However, the relational properties don't change, so publicly, it's undetectable. And if qualia are private, then only the Subject knows, but they cannot prove it to others.

    3. "Cog-sci half defining 'difference' as discriminability and refusing the question."
       - This is exactly the point: if we define difference in terms of discriminability (a relation), then there is no difference in the global swap. But the Subjects might feel there is. The tension is between the intrinsic and relational.

    4. "Intervener accused of cheating or changing the stimulus rather than the experience."
       - We have to emphasize that the deck represents the experience. Changing the deck is changing the experience. In the handover round, we try to isolate the intrinsic property.

    5. "Color vision deficient student": 
       - We assign them to be Intervener or Auditor.

    What the activity cannot reproduce:
    - The first-personal seeming that survives every failed cash-out: the feeling that there is an intrinsic quality even if you can't describe it.
    - The swap of cards and legends is not a change in experience while keeping functional stuff fixed; it's a change in the functional stuff (the deck and legend) that we are calling the experience.

    Handling the realist objection:
      - Admit that the activity is a simulation and doesn't capture the full first-person experience. But it illustrates the problem of individuating qualia without relations. Even if there is a first-personal seeming, it cannot be the basis for a public concept because it doesn't have identity conditions. The exercise shows that any attempt to pin down qualia must use relational properties.

    Payoff Scheme Implementation:

    We can use a token system. At the beginning, each Subject gets 10 tokens. 
    - If they correctly assert a change (by writing in the ledger that there was a change when there was one), they gain 2 tokens.
    - If they incorrectly assert a change (when there wasn't one), they lose 1 token.
    - If they fail to assert a change when there was one, they lose 1 token.
    - If they correctly do not assert a change when there wasn't one, they gain 0 tokens (no change).

    The Auditor, for each round, if they correctly identify whether a swap occurred, they gain 1 token. If incorrect, they lose 1 token.

    At the end, the student with the most tokens in their group wins bragging rights.

    This should incentivize reporting changes when they think there is one, but not arbitrarily.

    Final structure for the 80-minute slot:

    - 10 min: Introduction and role assignment.
    - 50 min: 5 rounds (10 min each).
    - 20 min: Debrief and discussion.

    Given time constraints, we might have to shorten rounds. Alternatively, we can drop one round. But let's try to do all five.

    This is a complex game. We might run over time. 

