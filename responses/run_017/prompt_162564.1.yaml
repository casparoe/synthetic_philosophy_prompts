  - Subject: Has a deck and a legend. In each round, they perform tasks and write in their private ledger.
  - Intervener: Swaps decks between rounds (according to the round's rules) and secretly logs what they did.
  - Auditor: Observes only the paper trail (the ledgers and any public outputs) and tries to detect swaps.

  Each Subject keeps a private ledger with two entries after each round:
    1. One sentence that would let *them* tell later whether their experience changed.
    2. One sentence that would let a *partner* (or anyone else) tell whether their experience changed.

  Round Types:

  1. **Global Swap Round (Round 1):** The Intervener performs a full automorphism (a cyclic shift of the entire deck and legend). This is undetectable because all relations are preserved. Subjects do a task: e.g., order the swatches by similarity, name each swatch, pick the one they like best. Then they write in their ledger.

  2. **Partial Swap Round (Round 2):** The Intervener swaps only some swatches (breaking the automorphism). For example, swap two adjacent swatches in the deck but leave the rest. This breaks the similarity structure. Subjects do the same tasks and write in their ledger. This round should be detectable because the relations are broken.

