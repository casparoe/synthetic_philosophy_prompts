  ### Flowchart: Does the Ant Colony Have a Mind?  
  **Starting Point:** The colony is a genuine biological individual with colony-level traits under selection (e.g., reproduction by fission, colony death without ant death).  

  #### Branching Questions  
  1. **Irreducibility**: Are colony-level cognitive processes (e.g., nest-site choice via quorum sensing) reducible to individual ants' cognition?  
     - *No* → Q2.  
     - *Yes* → **Leaf 1: Mere aggregate** (colony-level "cognition" is just ant interactions; no mind).  

  2. **Intentionality**: Does the colony exhibit intentional states (e.g., adjusting soldier-to-worker ratio in response to rivals)?  
     - *No* → Q3.  
     - *Yes* → Q4.  

  3. **Extended Realization**: Is cognition realized beyond ants (e.g., repletes as storage, pheromone trails)?  
     - *No* → **Leaf 2: Emergent functionality without cognition** (e.g., removal of dead nestmates; adaptive but non-cognitive).  
     - *Yes* → **Leaf 3: Cognition spread across nest and trails** (cognition is decentralized/extended; mind status ambiguous).  

  4. **Subjectivity**: Is there a unified subject of experience (e.g., colony death/fission implies loss/persistence of self)?  
     - *No* → **Leaf 4: Intentional system (no what-it's-likeness)** (e.g., colony "desires" safety but lacks consciousness).  
     - *Yes* → Q5.  
     - *Indeterminate* → **Leaf 7: No determinate answer** (subject boundaries are stipulated).  

  5. **Brain Analogy**: Do ants function analogously to neurons (e.g., decentralized corpse removal resembles neural computation)?  
     - *Yes* → **Leaf 5: Real colony-level mind (ants as neurons)** (e.g., integrated consciousness emerges).  
     - *No* → **Leaf 6: Nothing over and above the ants' minds** (colony "mind" reduces to individual ant experiences).  

  #### Logical Space & Positions  
  - **Allowed combinations** (based on answers):  
    | Q1 | Q2 | Q3 | Q4 | Q5 | Leaf                         |  
    |----|----|----|----|----|------------------------------|  
    | Y  | N  | N  | -  | -  | 2: Emergent functionality    |  
    | Y  | N  | Y  | -  | -  | 3: Cognition spread          |  
    | Y  | Y  | -  | N  | -  | 4: Intentional system        |  
    | Y  | Y  | -  | Y  | Y  | 5: Real mind (ants=neurons)  |  
    | Y  | Y  | -  | Y  | N  | 6: Nothing over ants         |  
    | Y  | Y  | -  | I  | -  | 7: No determinate answer     |  
    | N  | -  | -  | -  | -  | 1: Mere aggregate            |  

  - **Incoherent/Unattended Combinations**:  
    - *Q2=Yes + Q3=Yes*: Not branched (extended realization is downstream of intentionality).  
    - *Q4=Yes + Q5=Yes*: Requires irreducibility (Q1=Yes) and intentionality (Q2=Yes).  
    - *Q4=Indeterminate*: Skips Q5 (subjectivity unresolved).  

  - **Actual Positions in Logical Space**:  
    - **Leaf 1** (*Mere aggregate*): Colony is ants + interactions; no mind (e.g., behaviorist).  
    - **Leaf 2** (*Emergent functionality*): Colony solves problems mechanistically; no cognition/mind (e.g., Dennett’s “design stance”).  
    - **Leaf 3** (*Cognition spread*): Cognition extends to environment; mind depends on boundaries (e.g., extended mind theory).  
    - **Leaf 4** (*Intentional system*): Colony has beliefs/desires but no consciousness (e.g., Dennett’s intentional stance).  
    - **Leaf 5** (*Real mind*): Colony has unified consciousness; ants are neurons (e.g., Hofstadter’s “Aunt Hillary”).  
    - **Leaf 6** (*Nothing over ants*): Colony-level states reduce to ant minds (e.g., panpsychist or emergentist).  
    - **Leaf 7** (*No determinate answer*): Subjectivity is observer-relative (e.g., perspectivalist).  

  #### Notes  
  - **Unseparated Leaves**: *Cognition spread* (Leaf 3) and *Intentional system* (Leaf 4) may overlap if extended systems exhibit intentionality. The tree isolates them via Q2 (intentionality) but notes potential convergence.  
  - **Least Confident Fork**: **Q4 (Subjectivity)**. Colony fission/death intuitions vary widely (e.g., is splitting more like cell division or death?). If empirical work shows fission preserves "colony identity," rebuild to prioritize *persistence of self* over analogy.  
  - **Empty Combinations**:  
    - *Q1=Yes + Q2=No + Q4=Yes*: Incoherent (non-intentional systems lack subjectivity).  
    - *Q1=Yes + Q2=Yes + Q3=Yes*: Undefended (no major theory treats extended cognition as non-intentional).  

  **Key Anchors**:  
  - Nest-site choice (Q1), soldier ratio (Q2), repletes (Q3), fission (Q4), corpse removal (Q5).  

