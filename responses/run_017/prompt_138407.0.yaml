prompt: |-
  I chair the Novel Organisms Committee at a large biomedical research institute, and I need a decision procedure we can actually run in a meeting.

  Our committee meets monthly and sees ten to fifteen proposals a year. We have forty minutes per proposal. The six of us are two molecular biologists, a clinical microbiologist, an occupational hygienist, a lay member, and me; I am a cell biologist by training and the only philosophy any of us has is an undergraduate course I took years ago. Our decisions bind principal investigators, and anything contested goes to the Director. The hygienist has to be able to follow the reasoning.

  What we are asked to decide is whether a proposal involves a living organism, or a replicating biological entity. Our national rules regulate work with living modified organisms and with biological agents, and the Institute's own containment schedule is stricter and covers anything we judge to be a replicating entity. Neither the regulations nor our schedule says what living or replicating means at the margins, and that is now where most of our time goes. The proposals arriving on my desk include: a bacterium whose genome has been reduced to a minimal set and which grows only in a medium we formulate for it; a pair of engineered strains, each unable to synthesise a metabolite the other supplies, so that neither is viable alone while the pair is self-sustaining and evolves; a self-replicating RNA in a cell-free extract, housed in lipid vesicles we make for it, where the RNA evolves but cannot make its own container; an organism of reversed molecular chirality, should anyone propose one; prions and viroids; a seed and tardigrade collection proposed for a lower containment class on the grounds that nothing in it is metabolising; and a bio-hybrid device in which engineered tissue drives a small machine that assembles copies of itself from parts we supply.

  Please write me the procedure. I want ordered questions, each with a statement of what would count as a sufficient answer to it, explicit stop points at which the answer is no and the proposal is returned, and explicit hand-over points at which the question is one of values rather than fact and a named person must decide. It should be grounded in whatever is actually established about how definitions work — the difference between listing properties and picking out a single marker, cluster and family-resemblance concepts, stipulative versus descriptive definitions, purpose-relativity, borderline cases and continua — but translated so that no one in the room needs the theory to use it.

  Three things I want handled explicitly, because they are where we keep coming apart. First, entities that are metabolically inert but revivable by apparatus we control: if you need a term, call it latent viability, and tell me whether it is life and why. Second, entities whose self-maintenance depends on a niche or a component supplied by us or by another organism: does a relational or niche-relative answer change the classification, or should we insist on counterfactual independence? Third, cases where a pair or consortium satisfies whatever test you propose but no member of it does: is the system alive and the parts not, and what does the procedure return for the proposal in front of us?

  Then apply the procedure to three cases: the two-strain consortium, the dormant seed and tardigrade archive proposed for downgrading, and the self-assembling bio-hybrid device. At least one of these will, I suspect, come out against the committee's instincts; say plainly which one, and what I should do about it rather than how I should feel about it.

  Please write in British English, do not cite or point me to any literature, and keep the whole thing under about 2,000 words. Structure it in this order: Purpose and scope (around 120 words); The procedure, as numbered steps with sufficiency conditions, stop points and hand-over points (around 700 words); What each step is buying us, giving the conceptual grounding in plain terms (around 350 words); Where the procedure hands the decision to a person (around 200 words); Worked applications, one section per case (around 600 words in total); Where the procedure misfires (around 250 words); and, finally, What the procedure cannot do (around 150 words).
reasoning: |-
  Okay, the user chairs a Novel Organisms Committee and needs a practical decision procedure for determining if proposals involve living or replicating entities. They've outlined their committee structure, time constraints, and specific pain points like latent viability, symbiotic systems, and borderline cases. 

  Hmm, this is a fascinating interdisciplinary challenge. The user is clearly frustrated with philosophical debates slowing down practical decisions. They need something operational that bridges molecular biology and regulatory frameworks without requiring theoretical expertise. 

  First, I should acknowledge their three sticking points upfront: latent viability (like dormant seeds), relational systems (like symbiotic bacteria pairs), and collective entities (where the whole system replicates but individual parts don't). These need concrete resolution mechanisms in the procedure.

  The user's examples reveal key tensions: 
  - The two-strain consortium forces us to confront whether "life" requires individual autonomy
  - The seed archive challenges metabolic activity as a necessary condition
  - The bio-hybrid device blurs machine and organism boundaries

  Right, the procedure must avoid binary "alive/dead" classifications and instead focus on replicative potential under the institute's containment needs. That's the regulatory purpose shining through. 

  For structure: I'll build a decision tree with clear off-ramps. Step 1 should screen for obvious non-living cases using a "replication potential" litmus test. Steps 2-4 will handle borderline cases with relational dependencies, while Step 5 addresses collective systems. Hand-over points will flag when value judgments (like containment proportionality) are needed - probably to the hygienist or director.

  Conceptual anchors: 
  - Purpose-relativity is key (containment drives definitions)
  - Cluster concepts over essentialism (no single "life" marker)
  - Counterfactual independence matters less than actual replicative risk

  The hygienist's comprehension is crucial - every test must have plain-language sufficiency conditions. For example: "Does it make more of itself without being rebuilt?" beats philosophical criteria.

  Predicting friction: The bio-hybrid will likely fail the replication test since humans supply parts. That'll contradict intuitive "alive" feelings - I'll need to justify why containment levels should follow replicative mechanics, not vibes.

  Biggest risk: Over-engineering. Must resist adding layers. Forty minutes per proposal means max 5 steps with clear stop/go points. Save continuum problems for director referral.

  Finally, British English throughout - "metabolise" not "metabolize", "hygienist" position etc. No citations, just actionable logic.
answer: |-
  ## Novel Organisms Committee Decision Procedure: Life/Replication Determination

  **Purpose and Scope (120 words):**
  This procedure provides a structured method for the Committee to determine whether a research proposal involves a "living organism" or "replicating biological entity" as defined by national regulations and the Institute's stricter containment schedule. It focuses on identifying entities capable of autonomous replication or evolution within the research context, regardless of metabolic state or reliance on external factors. The aim is to ensure consistent, defensible decisions on containment requirements, prioritising practical assessment of replicative potential over abstract philosophical definitions. It applies solely to the classification question; risk assessment and final containment level assignment follow separate protocols. Decisions bind PIs, with appeals to the Director.

  **The Procedure (700 words):**

  1.  **Does the entity possess a nucleic acid genome (DNA or RNA)?**
      *   *Sufficient Answer:* Evidence of a nucleic acid sequence encoding heritable information (e.g., sequence data, PCR confirmation, known genome structure). Synthetic nucleic acids qualify.
      *   *Stop Point (No):* If no nucleic acid genome is present or demonstrably involved (e.g., pure prion protein, non-replicating peptide assemblies). Return proposal as non-living/replicating entity. *(Handles: prions without replicative RNA, inert assemblies)*.
      *   *Next Step (Yes):* Proceed to Step 2.

  2.  **Can the genome replicate (make copies of itself) within the proposed experimental system without being entirely rebuilt *de novo* by the researcher for each replication event?**
      *   *Sufficient Answer:* Experimental data or robust mechanistic evidence demonstrating template-directed copying (e.g., polymerase activity observed/supplied, replication intermediates detected). Includes cell-free systems where the extract provides machinery.
      *   *Stop Point (No):* If genome replication requires complete synthesis from scratch each time (e.g., PCR amplification solely initiated by researcher adding fresh primers/enzymes per cycle does *not* count). Return proposal as non-replicating entity. *(Handles: static DNA libraries, purely synthetic oligos)*.
      *   *Next Step (Yes):* Proceed to Step 3.

  3.  **Does the replication process generate variation (mutations/changes) in the genome sequence that are heritable by subsequent generations within the experimental system?**
      *   *Sufficient Answer:* Evidence of error-prone replication mechanisms inherent to the system OR experimental demonstration of sequence changes accumulating over replication cycles (e.g., sequencing data showing drift, selection experiments).
      *   *Hand-Over Point:* If replication is high-fidelity *and* variation potential is contested or unclear, the **Lay Member** decides if the *potential* for evolution under plausible experimental conditions constitutes sufficient risk to warrant higher containment, based on the proposal's context and perceived hazards. *(Handles: high-fidelity minimal genomes, synthetic genomes with proofreading)*.
      *   *Next Step (Yes/Resolved):* Proceed to Step 4.

  4.  **Is the entity's persistence (maintenance, propagation) within the experimental system dependent *solely* on factors continuously and actively supplied or controlled by the researcher (beyond basic environmental sustenance like temperature/pH)?**
      *   *Consider:* Does it require constant addition of specific, complex nutrients it cannot synthesise? Does it rely on researcher intervention to assemble essential non-genomic components (e.g., vesicles, specific proteins) for *every* generation? Dependency on another organism *within the system* is *not* sole researcher dependency.
      *   *Sufficient Answer (No - Not Solely Dependent):* Evidence the entity utilises available resources or co-dependent organisms within the system for sustained propagation without needing *per-generation* reassembly or specific complex additive provision by the researcher.
      *   *Sufficient Answer (Yes - Solely Dependent):* Clear protocol showing essential, complex components (beyond simple media) must be added/assembled by the researcher for propagation to occur each time.
      *   *Hand-Over Point (Unclear Dependency):* The **Occupational Hygienist** decides, based on the *practicality and reliability* of the researcher controls and the *consequence of failure* (e.g., escape potential), whether the dependency is sufficiently robust to treat the entity as non-replicating for containment purposes. *(Handles: niche-dependent strains, complex co-factors, vesicle systems)*.
      *   *Next Step (No/Resolved as Not Solely Dependent):* Proceed to Step 5.
      *   *Stop Point (Yes/Resolved as Solely Dependent):* Classify as non-replicating entity. *(Handles: bio-hybrid needing per-assembly part supply)*.

  5.  **Is the proposed entity a single, defined biological unit, or a consortium/system?**
      *   *Sufficient Answer (Single Unit):* Proposal clearly describes a single organism type or a homogeneous population (e.g., one engineered bacterial strain). Apply classification from Steps 1-4 directly.
      *   *Sufficient Answer (Consortium/System):* Proposal involves interacting, distinct components (e.g., two bacterial strains, RNA + extract + vesicles). Apply Steps 1-4 to the *system as a whole*.
      *   *Result:* If the *System* passes Steps 1-4 (i.e., the *collective* replicates genomes with variation and isn't solely researcher-dependent for persistence), classify the *System* as a replicating entity *regardless* of whether individual components would pass alone. *(Handles: two-strain consortium)*.
      *   *Final Classification:* Entity/System classified as "Living/Replicating Biological Entity" requiring regulated containment. Proceed to risk assessment.

  **What Each Step is Buying Us (Conceptual Grounding - 350 words):**

  *   **Step 1 (Nucleic Acid):** Focuses on the *sine qua non* of biological heredity and evolution. Life as we know it relies on nucleic acids. This excludes entities like pure prions (no inherent genome) immediately.
  *   **Step 2 (Replication):** Targets the core regulatory concern: *autonomous copying*. "Without *de novo* rebuild" distinguishes true replication (making copies *of itself*) from mere re-synthesis (making a *new* instance). This addresses systems like cell-free RNA replication vs. PCR.
  *   **Step 3 (Variation/Evolution):** Acknowledges that the *potential* for adaptation is a key risk driver in regulations (LMOs/GMOs). High-fidelity systems are less risky, but the Lay Member hand-over injects a precautionary principle based on societal values regarding unforeseen change.
  *   **Step 4 (Researcher Dependency):** This tackles "latent viability" and niche-dependence pragmatically. If revival *or* sustained propagation requires *specific, active, per-generation* researcher input (e.g., formulating unique medium, assembling vesicles), the entity lacks the *operational autonomy* that containment is designed to mitigate. True latency (like seeds in archive) doesn't require this *during dormancy*. Counterfactual independence is less relevant than *actual control during the experiment*. The Hygienist assesses the *practical risk* of dependency failure.
  *   **Step 5 (Systems):** Embraces a "system-level" view. A consortium achieving collective replication, variation, and autonomy meets the functional definition of a replicating system, even if its parts are interdependent. The *system* is the regulated entity.
  *   **Overall:** The procedure uses a **cluster concept** (checking key properties: genome, replication, variation, autonomy). No single property is absolute, but passing all steps indicates a strong cluster matching the regulatory purpose. It accepts **borderline cases** and uses **hand-over points** to inject **purpose-relative** value judgments about risk and control when mechanistic facts are insufficient. It avoids essentialist definitions.

  **Where the Procedure Hands the Decision to a Person (200 words):**

  1.  **Step 3 (Variation Potential - High Fidelity):** Handed to the **Lay Member**. This involves judging the societal risk tolerance for potential, unforeseen evolution in a system designed to be stable. The Lay Member represents public values and the precautionary principle. They decide: "Is the *chance* of this thing evolving in a harmful way, even if small, something we, as a society represented by this Institute, need to guard against with higher containment?"
  2.  **Step 4 (Degree of Researcher Dependency):** Handed to the **Occupational Hygienist**. This is a practical risk assessment judgment. The Hygienist evaluates: "How reliable is this control mechanism in real lab conditions? What happens if it fails (e.g., cross-contamination, spill)? Is the consequence of escape/mismanagement severe enough that we shouldn't rely solely on this dependency and need higher containment anyway?" They focus on real-world hazard control.

  **Worked Applications (600 words):**

  1.  **The Two-Strain Consortium:**
      *   *Step 1:* Each strain has a DNA genome? Yes.
      *   *Step 2:* Can the genomes replicate? Yes, within the co-culture.
      *   *Step 3:* Does replication generate variation? Almost certainly yes (mutations occur), but if high-fidelity is claimed, Lay Member decides risk tolerance. Likely proceeds.
      *   *Step 4:* Is persistence *solely* researcher-dependent? No. The strains depend *on each other*, not on per-generation researcher assembly. Persistence is autonomous within the co-culture. Proceed.
      *   *Step 5:* It's a system. Apply Steps 1-4 to the *system*: It has genomes (collectively), replicates them, shows variation, persistence isn't solely researcher-dependent. **Result: Replicating Entity.** The *system* is regulated.

  2.  **Dormant Seed & Tardigrade Archive (Proposed Downgrade):**
      *   *Step 1:* Seeds & tardigrades have DNA genomes? Yes.
      *   *Step 2:* Can the genomes replicate *in the archive system*? No. They are dormant/metabolically inert. No replication is occurring. **Stop Point at Step 2: Non-replicating entity.** Classification for the *archive state* is non-living. Downgrading may be permissible based on *current state risk assessment*, provided revival protocols trigger re-classification under this procedure if active work begins. Latent viability itself doesn't trigger "living" classification during inert storage.

  3.  **Self-Assembling Bio-Hybrid Device:**
      *   *Step 1:* The engineered tissue likely has a DNA genome? Yes.
      *   *Step 2:* Can the genome replicate? The tissue cells might divide (replicating the genome), but the *device assembly* (machine part copying) is key. Does the genome replication drive *assembly*? Likely complex.
      *   *Step 3:* (Assume replication occurs) Variation? Possible.
      *   *Step 4:* **Crucial Step:** Is persistence (propagation of new devices) *solely* researcher-dependent? Yes. The proposal states the machine "assembles copies of itself **from parts we supply**." The researcher must continuously supply the *parts* for assembly. Without this *per-generation* supply of complex components, replication halts. This is *solely* researcher-dependent persistence. **Result (after Hygienist hand-over if unclear): Non-replicating entity.** The tissue might be alive, but the *functional unit requiring containment* (the self-assembling device) relies on researcher input for propagation.

  **Where the Procedure Misfires (250 words):**

  *   **Against Instincts:** The **Bio-Hybrid Device** result likely clashes with the instinct to call it "alive." The procedure focuses on *replicative autonomy within the system*. If the device absolutely requires *researcher-supplied parts* for each "generation," it fails the autonomy test (Step 4). **What to do:** Accept the result. The containment decision is about *risk from autonomous replication*. This device doesn't pose that specific risk *if the part supply is reliably controlled*. Its risks (e.g., tissue pathogenicity, machine malfunction) are covered by *other* risk assessments and non-biological containment protocols triggered by its classification as a complex bio-hybrid *device*, not a replicating entity. Ensure the risk assessment explicitly considers failure modes of the part-supply mechanism (Hygienist input vital).
  *   **Other Misfires:**
      *   **Reversed Chirality Organism:** Would likely pass all steps *if* it truly replicates autonomously (Step 4). Classified as living. Instincts might balk, but the functional replicative risk is identical.
      *   **Extremely Slow Replication:** Passes all steps. Containment needed. Time-scale isn't a factor here.
      *   **"Zombie" Systems:** Systems that replicate genomes with variation but are utterly incapable of any other biological function might pass. The Lay Member hand-over (Step 3) is the main guardrail here, allowing precaution if the "non-life" aspects seem to reduce risk insufficiently. The Hygienist (Step 4) might also judge sole dependency if controls are deemed absolute.

  **What the Procedure Cannot Do (150 words):**

  1.  **Define "Life" Universally:** It provides a regulatory operational definition focused on replication risk within the experimental context. It won't resolve deep philosophical questions.
  2.  **Assess Risk:** It only classifies for the *type* of regulation (biological replication). Full risk assessment (pathogenicity, toxicity, environmental impact) and final containment level assignment require separate procedures using this classification as one input.
  3.  **Handle Truly Novel Physics/Chemistry:** If a proposal involves replicating entities based on entirely non-nucleic acid heredity (e.g., synthetic molecular networks), it likely stops at Step 1. Such proposals would require novel, bespoke risk assessment and likely Director/regulator consultation.
  4.  **Eliminate Judgment:** Borderline cases (high-fidelity replication, complex dependencies) still require informed judgment via the hand-over points. It structures, not removes, discretion.
