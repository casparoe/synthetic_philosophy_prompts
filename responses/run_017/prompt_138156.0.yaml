answer: |-
  Here is the translation of the four models into your specified vocabulary, followed by residue analysis addressing your suspicions and questions. Assumptions are flagged explicitly.

  ---

  ### Translation
  1.  **Polybius's Anacyclosis:**
      *   **Translation:** A cyclic renewal pattern applying to **syntactic/pragmatic markers of political authority structure**. The cycle: A marked construction (e.g., emphatic negation) emerges (Kingship), undergoes bleaching (Tyranny), triggering renewal via a new, pragmatically reinforced construction (Aristocracy). This new marker bleaches (Oligarchy), renews via a different pragmatic source (Democracy), bleaches further (Ochlocracy), and the system resets via catastrophic analogy/borrowing (return to Kingship). **Residue:** Polybius implies shared morphosyntactic features across regimes; translations assume this parameterization exists. The "reset" mechanism (collapse → kingship) resembles abrupt substrate influence or borrowing under conquest, not endogenous renewal.
  2.  **Ibn Khaldun's Group Cohesion ('Asabiyyah):**
      *   **Translation:** Change in **socio-linguistic network cohesion** driving language/dialect shift. Peripheral/nomadic groups form a tight dialect continuum with high 'asabiyyah (strong isogloss bundles). Upon taking power (entering a prestige center), dialect leveling occurs, but network cohesion weakens (isoglosses diffuse, bundles unravel). Within ~3 generations (transmission cycles), factionalism (dialect fission) emerges. The core group's sociolect becomes structurally reduced (loss of marked features from nomadic lexicon/grammar) due to reduced communicative pressure/contact dynamics. Renewal requires influx of a new peripheral group with tight isogloss bundles. **Residue:** Assumes 'asabiyyah maps directly to network density affecting transmission fidelity. The "reduction" is structural simplification via loss, not expressive decay. The timescale (~3 generations) aligns with observable transmission effects.
  3.  **Toynbee's Challenge-and-Response:**
      *   **Translation:** A **grammaticalization cline** operating on **institutional constructions**. A "Creative Minority" innovates novel grammaticalized structures (e.g., new case markers, TAM auxiliaries) in response to external/internal pressures ("Challenge"). Successful structures spread via wave-like diffusion ("Growth"). The innovating group becomes a "Dominant Minority" – their sociolect fossilizes; innovations cease or become irregular analogical extensions, not systematic grammaticalization ("Breakdown"). Eventually, structures erode or are replaced by borrowed/analogical formations ("Universal State" as a koiné with simplified, leveled grammar). Later religious framing is an exogenous renewal source. **Residue:** "Breakdown" translates as cessation of systematic innovation + fossilization, NOT decay. "Universal State" maps to koiné formation. The directional shift in later volumes introduces an exogenous variable (borrowing/contact-induced change) not fully integrated into the core cline model.
  4.  **Spengler's Organic Culture:**
      *   **Translation:** A **language/dialect** with a unique, incommensurable **parameter set** undergoing an irreversible life-cycle via internal drift. Genesis: Parameter settings emerge abruptly (like a new proto-language splitting off). Growth: Elaboration within the set (drift-driven allophony → phonemic splits, analogical leveling, grammaticalization). Breakdown/Decline: System becomes internally strained; irregular correspondences multiply via analogy and lexical diffusion; drift leads to structural opacity or paradigmatic gaps. Death: Transmission ceases; replaced by unrelated systems. Phases are stages *within* this specific parameter set; comparing stages *across* cultures is like comparing vowel shifts in unrelated families – descriptive but not predictive. **Residue:** "Incommensurable inner unity" directly challenges the comparativist assumption of universal parameters. "Decline" here includes *increased irregularity* and *loss of systemic coherence* within the set, which *is* a form of structural reduction/differentiation loss, even if expressiveness is maintained elsewhere. This is untranslatable without accepting Spengler's core premise.

  ---

  ### Testing Your Suspicions
  1.  **Distinct Variables:** Your disentangling is **strongly supported by the texts and framework**. Each model operates on a different linguistic level:
      *   Polybius: **Morphosyntactic Markers** (Authority Structures)
      *   Ibn Khaldun: **Socio-Linguistic Network Cohesion** (Group Dynamics)
      *   Toynbee: **Grammaticalization of Institutional Constructions** (Organizational Complexity)
      *   Spengler: **Parameter Set Integrity & Drift** (Expressive Style/System Coherence)
      The timescales differ (marker renewal < network cohesion < grammaticalization cline ≈ parameter drift lifespan). The "cyclical vs linear" debate conflates these distinct processes with distinct renewal/reset mechanisms (endogenous renewal, exogenous replacement, network collapse, system death).
  2.  **False Dichotomy / Renewal Cycles:** Your suspicion is **largely confirmed**.
      *   Polybius & Ibn Khaldun: Explicitly **renewal cycles**. The endpoint isn't the start state (Tyranny ≠ Kingship; Urban Factionalism ≠ Desert Cohesion). Material is worn down (bleaching, structural reduction), renewed (new marker, new group influx).
      *   Toynbee: Ambiguous. The core cycle (Challenge → Response → Growth → Breakdown) resembles a renewal cycle where the "creative" capacity wears out. However, the "Universal State" endpoint and later religious framing suggest a more linear, non-repeating sequence for a *specific* civilization, though renewal might occur via a *new* civilization (new cycle). It's a renewal cycle within a potentially linear sequence of distinct cycles.
      *   Spengler: **Strictly linear within the unit.** Irreversible drift leading to death. No renewal *of the same system*. Recurrence is only of the *life-cycle pattern itself* applied to new, incommensurable units (like new language families emerging and dying). The recurrence is of the *process type* (genesis → growth → decline → death), not of specific states.

  ---

  ### Residue Adjudication
  **(a) The Unit Problem (Circularity & Galton's Problem):**
  *   Defining a "civilization" exhibits **strong circularity analogous to subgrouping.** Boundaries are drawn based on shared "correspondences" (institutions, styles, artifacts), assuming a tree model. "Exceptions" (diffused traits) are diagnosed as borrowing. Galton's problem is acute: observed "stages" could be areal diffusion (wave model) not parallel development (tree model). This fundamentally undermines comparative claims about universal civilizational life-cycles. **Residue Verdict:** The linguistic framework highlights the methodological circularity and sampling problem inherent in civilizational comparison, making claims of universal cyclical patterns highly suspect. This reflects badly on uncritical historiographical unit definition.

  **(b) Commensurability (Spengler):**
  *   Spengler's incommensurability is **a denial of a core precondition of your framework.** He rejects the existence of universal, cross-culturally valid parameters for comparing the *internal developmental stage* of cultures. Your framework *requires* shared parameters (like phonological features, grammatical categories) for comparison. Translating his stages requires accepting his unit definition *and* his parameter set for that unit. Comparing "Spring" in Culture A to "Spring" in Culture B is deemed meaningless by Spengler, just as comparing the Great Vowel Shift to Bantu tone split stages is descriptive, not evidence of a shared developmental law. **Residue Verdict:** Spengler's claim is not noise; it's a fundamental challenge to the comparative method's applicability to his defined units. Your framework's inability to express it *without violating its own core assumptions* highlights a limitation *for this specific purpose*, not a refutation of Spengler on his own terms (which your framework rejects).

  **(c) Decline:**
  *   Translating "Decline" (Spengler/Toynbee):
      *   **Toynbee ("Breakdown"):** Maps well to **cessation of systematic innovation (grammaticalization) + fossilization of dominant structures.** This is deflationary (loss of dynamism, not expressive power). Toynbee *might* accept this as a partial translation but would emphasize the loss of *creative* capacity.
      *   **Spengler ("Decline"):** Maps partially to **increased systemic irregularity (drift/analogy overriding regularity), paradigmatic gaps, and loss of internal coherence within the parameter set.** This *is* a form of structural reduction/differentiation loss *specific to that system's internal logic.* Spengler would repudiate *only* the implication that this loss makes the language less expressive *in toto*; he might accept it as a description of the system becoming "inorganic" and strained. Your framework *can* describe these internal structural changes but must remain agnostic on any overall "expressive decay".
  *   **Verdict:** Your field's expulsion of "decay" successfully expels notions of inherent superiority or progress. However, it **cannot inherently refute descriptions of internal structural reduction, loss of differentiation, or cessation of innovation *within a specific, defined system* over time** – which is what "decline" translates to in these models. Your framework's limitation is its necessary agnosticism about the *expressive consequences* of such changes for the *users* of the system. This residue reflects a genuine difference in focus: historiographers often describe systemic internal change dynamics linguists avoid judging holistically.

  ---

  ### Overall Residue Verdict
  The residue **primarily reflects methodological limitations and unresolved tensions within the historiographical models themselves**, particularly concerning unit definition (circularity, Galton's problem), incommensurability (Spengler), and the ambiguous ontology of "decline". Your linguistic vocabulary acts as a rigorous filter, exposing these issues by demanding precise definitions of variables, mechanisms, and units. While the framework has limitations regarding expressive consequences (c) and cannot engage Spengler's radical incommensurability on his terms (b), it successfully disentangles distinct processes (your first suspicion) and reveals the renewal-cycle logic underlying many "cyclical" claims (your second suspicion), showing the dichotomy to be largely false or mis-specified. The most significant residue (a) highlights a fundamental weakness in comparative civilizational studies that linguistics long ago had to confront.
