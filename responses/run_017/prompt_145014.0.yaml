answer: |-
  **The Joke**  
  Visitor Miriam, eager to respect local customs in Newhaven, diligently cleared her tray after lunch at the bustling "Help Yourself Hummus" counter. Local patron Bernard watched her in horror. "Madam!" he hissed, gesturing at the dirty dishes she'd just stacked neatly by the bins. "Only the *staff* clear trays here. If you do it yourself, you're implying they're incompetent or redundant! It's deeply insulting!" Miriam, flustered, stammered, "But I was trying to *help*!" Bernard sighed, "Exactly. By saving yourself the minor cost of leaving it, you make everyone else bear the cost of explaining your rudeness and reassuring the offended servers. Now *I* have to buy the counter manager a coffee to smooth this over."

  **Commentary**  
  The punchline exploits the **free-rider problem** inherent in conventions: Miriam avoids the minor personal inconvenience of leaving her tray (the "cost" of compliance), but this action potentially undermines the social understanding that justifies the staff's role and imposes costs on others (Bernard feeling compelled to mitigate the perceived insult). The invented convention isn't just an exotic oddity; it's a direct test of whether personal convenience (or perceived helpfulness) justifies opting out of a coordinated practice designed to manage social roles and expectations efficiently. The humor arises from Miriam's good intentions backfiring precisely because she ignores the convention's *systemic* function. The joke quietly concedes that a visitor *is* obligated to learn and follow the local convention, regardless of its arbitrariness or their own innocent motives, because non-compliance shifts burdens (like interpretation, repair, or reassurance) onto the locals who maintain the system she benefits from (like having staffed counters). Her "I was trying to help" ignores the specific social cost her action imposes here.
