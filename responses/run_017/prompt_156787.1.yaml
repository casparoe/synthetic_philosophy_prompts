  ## The Pasadena Shuffle  
  *(Stanzas May Be Shuffled Without Loss of Sense)*  

  **Stanza A**  
  One flip: a dollar gained with glee,  
  *What fortune owes to me.*  
  This simplest case is plain to see,  
  A head ends all, sets free.  

  **Stanza B**  
  Two flips: I owe a buck instead,  
  *What I must pay instead.*  
  First tail, then head, the path I tread,  
  Debt stains the path I tread.  

  **Stanza C**  
  Three: then pay me thirty-three,  
  *What fortune owes to me.*  
  Two tails precede, then head makes three,  
  More rare, yet guarantees.  

  **Stanza D**  
  Four flips: I pay a quarter back,  
  *What I must pay instead.*  
  Three tails stretch out the losing track,  
  Then heads cut through the black.  

  **Stanza E**  
  Five flips: a fifth is mine to claim,  
  *What fortune owes to me.*  
  Four tails ignite the changing flame,  
  Then heads conclude the game.  

  **Stanza F**  
  Six flips: subtract one sixth away,  
  *What I must pay instead.*  
  Five tails demand a steeper pay,  
  Before the head is laid.  

  **Stanza G**  
  Seven: plus a seventh part,  
  *What fortune owes to me.*  
  Six tails delay the hopeful start,  
  Then heads restart the heart.  

  **Stanza H**  
  Eight flips: minus an eighth is scored,  
  *What I must pay instead.*  
  Seven tails build the teetering hoard,  
  Then heads enforce the word.  

  **Closing Couplet**  
  So what’s this altar’s sacred cost?  
  The sum’s a shape-shifting ghost:  
  Depends on how the terms are cast—  
  Sixty-nine cents? Or endless fast?  

  ---

  ### Notes on Design  
  1.  **Mathematical Accuracy:** Each stanza (A-H) corresponds to flip counts 1-8. The stake for flip `n` is `(-1)^(n+1) * 2^(n-1)` dollars, probability `1/2^n`, yielding a term value of `(-1)^(n+1)/n` dollars. The natural order sums to `H_8` (harmonic number ~2.718) minus `2*H_4` (~2.718 - 2*2.083 ≈ -1.448) before stabilizing near `ln(2)≈$0.69` with more terms.  
  2.  **Movable Stanzas:** Each quatrain is syntactically independent (no cross-references). The refrain alternates sign implicitly: "owes to me" (positive) / "pay instead" (negative).  
  3.  **Ambiguous Verdict:** The couplet's "shape-shifting ghost" acknowledges conditional convergence (value depends on summation order). "$0.69" references the natural ordering limit, while "endless fast" suggests divergence under rearrangement. Neither position is privileged.  
  4.  **Structural Alternation:** The refrain's sign-flip mirrors the term parity, embedding the game's mechanics in the poem's form.  

  This invites your seminar to debate whether the "ghost" has a true form (`ln(2)`) or is fundamentally undefined—just as rearranging the stanzas reshapes the implied sum.
