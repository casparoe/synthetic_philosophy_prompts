  First, the technical aspects: the poem needs to accurately reflect the Pasadena paradox - the doubling stakes, alternating signs based on flip count parity, and probability halving. Each outcome's contribution must be ±1/n where n is the flip count. The natural ordering sum is ln(2)≈$0.69, but rearrangements can make it converge to any value or diverge.

  The structural constraints are fascinating: eight movable quatrains in loose iambic tetrameter, each syntactically independent. Need a refrain that flips between "what is owed to me" and "what I owe" to mirror the sign alternation. The closing couplet must feel contingent on arrangement - different shufflings should suggest different verdicts.

  Key challenges: maintaining mathematical precision while being poetic, achieving true stanza permutability without connectives, and balancing the two philosophical camps (natural ordering vs no privileged ordering). The couplet ambiguity is crucial - it shouldn't favor either view.

  For the refrain, I'll use "What fortune owes to me" for positive terms (odd flips) and "What I must pay instead" for negative (even flips). The stanza mobility means each quatrain must be self-contained - no pronouns referencing other stanzas, complete syntactic closure.

  The mathematical heart: 
  - First head on flip n: probability 1/2ⁿ
  - Stake: (-1)ⁿ * 2ⁿ⁻¹ dollars 
  - Term value: (-1)ⁿ / n
  Which sums to ln(2) when ordered by n, but is conditionally convergent.

  For the couplet, I'll lean into the rearrangement paradox: "The sum's a shape-shifting ghost" acknowledges both the ln(2) result and its instability. "Depends on how the terms are cast" explicitly makes the verdict arrangement-dependent.

  The religious imagery ("altar", "sacred") hints at the "natural ordering is privileged" view, while "no fixed form" supports the opposing camp. The dollar amounts ($0.69) grounds it in reality without committing to either interpretation.

  Checking accuracy: 
  - "One flip: a dollar gained" → +1/1 = +1.00 ✓ 
  - "Two flips: I owe a buck" → -1/2 = -0.50 ✓ 
  - "Three: then pay me thirty-three" → +1/3≈0.33 ✓ 
  - "Four: I pay a quarter back" → -1/4=-0.25 ✓ 
  And so on up to eight terms. The probabilities and signs are all correct.

  The refrain integration works structurally - the sign flip in the alternating lines reinforces the term parity. And crucially, every stanza can be reordered without grammatical rupture because each contains its complete thought.
