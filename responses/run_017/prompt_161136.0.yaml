prompt: |-
  This got personal for me a few months ago: I'm on the committee at my institute that signs off on any prep that might need welfare protections. We see two or three a week, we get about an hour each, and the reviewers are bench scientists plus one vet — nobody with any philosophy background. The stuff coming through now is: neural organoids hooked up to a simulated body that gets reward and punishment signals, invertebrate learning experiments where the animal is clearly tracking something like its own state, and a pretty high-resolution simulation of a larval fish nervous system that we run a few thousand copies of in parallel while we tune it. Right now we basically argue and vote. Last month a postdoc refused to run one of the protocols and I definately couldn't tell her whether she was being careful or being weird about it, and I'm the one who signs the form.

  What I want is a procedure my committee can actually run on a proposal, in everyday language. The parts I think I need, but you organize it: how to settle what physical thing we're even talking about before arguing about it (there always seems to be more than one candidate depending on where you draw the line, and some candidates sit inside others); how to ask what's going on inside it rather than just what it does, given that anything can be made to look like it's avoiding something; whether "sort of" is a possible answer or whether it has to be yes or no; and what we're supposed to do when we genuinely can't tell. For each step say what counts as a good enough answer, where the procedure stops with a no, and where it hands the decision back to us because it's a values call and not a factual one. Be honest about which steps are real checks and which are just us going through the motions. Constraints: one hour, no theory assumed, and it has to end in a short written justification we can hand to our funder.

  Then run it on three of ours: the organoid in the maze with reward and punishment signals; the fish simulation, including the awkward part where if we run 5000 copies at once that looks like it's either 5000 of them or one of them and I don't know which is right; and a third case where the procedure tells us to slow down or stop on something we'd rather keep doing — I want to see the answer I'll want to argue with. Also say plainly what the procedure can't do for us.

  Lead with your bottom line in the first sentence — the one thing the whole procedure turns on — then give the steps and the applications. No preamble, and don't restate my question back at me.
reasoning: |-
  We are going to use a procedure that turns on one key question: **"Could this entity have experiences that matter to it?"** If the answer is likely "yes," we need welfare protections; if "no," we don't. The procedure helps us structure our investigation and document our reasoning without requiring philosophical expertise.

  ### Procedure Steps (to be completed in ≤60 minutes per proposal)
  1. **Define the Entity (5 minutes)**  
     - **Task:** Clearly identify what physical part(s) of the experiment we are assessing.  
     - **How:**  
       - List all candidate entities (e.g., the organoid, the simulated body, the whole system; the individual simulation instance, the collective of simulations).  
       - For each candidate, ask: "Is this entity *boundaried* (does it act as a unified whole) and *persistent* (does it maintain itself over time)?"  
     - **Good enough answer:** We pick one or more candidates that are both boundaried and persistent. If none, stop: no welfare concerns.  
     - **Stop if:** The entity is clearly fragmented (e.g., disconnected cells) or transient (e.g., a one-off signal).  
     - **Hand back if:** Multiple candidates seem equally plausible (e.g., the 5000 fish sims might be 5000 entities or one collective). We note this uncertainty but move to Step 2 for all candidates.  

  2. **Assess Internals (15 minutes)**  
     - **Task:** Look for evidence that the entity has an "inner life" (not just inputs/outputs).  
     - **How:**  
       - Check for:  
         (a) *Integration:* Does information from different senses/modalities combine to guide decisions? (e.g., the simulated fish uses vision, touch, and hunger together).  
         (b) *Self-monitoring:* Are there signals tracking the entity's own state (e.g., fatigue, stress, reward history)?  
         (c) *Flexibility:* Does it adapt to new situations in non-preprogrammed ways?  
       - Use a 0–3 scale for each (0=absent, 3=strong evidence).  
     - **Good enough answer:** Total score ≥5 suggests a "likely yes" for Step 1’s question.  
     - **Stop if:** Score ≤2 → no welfare concerns.  
     - **Hand back if:** Score 3–4 → uncertainty (proceed to Step 3 but flag caution).  

  3. **Check for Suffering Risks (10 minutes)**  
     - **Task:** If Step 2 suggests possible experience, identify whether the experiment could cause negative states.  
     - **How:**  
       - List procedures (e.g., starvation, shocks, forced choices).  
       - Ask: "Could this procedure create persistent avoidance, self-harm, or collapse of normal function?"  
     - **Good enough answer:** If no such procedures, welfare protections may not be needed (even if Step 2 is positive).  
     - **Stop if:** No suffering risks → approve without protections.  
     - **Hand back if:** Suffering risks exist → proceed to Step 4.  

  4. **Uncertainty & Values Call (5 minutes)**  
     - **Task:** Resolve ambiguity and make a defensible choice.  
     - **How:**  
       - If uncertain in Steps 1–3, ask: "Is this entity *close enough* to a known sentient being (e.g., a fish, an insect) that we should give it the benefit of the doubt?"  
       - Vote (bench scientists + vet). Majority rules.  
     - **Output:** Short written justification (1–2 sentences) for the funder:  
       - "We assessed [entity] for capacity to have experiences. Evidence for inner life was [weak/moderate/strong]. Risks of suffering were [absent/present]. Therefore, welfare protections [are/are not] required."  

  ### What’s Real, What’s Theater
  - **Real checks:** Step 2 (internals) and Step 3 (suffering risks) are evidence-based.  
  - **Theater:** Step 4 (values call) is subjective but necessary — we’re not philosophers.  

  ### What the Procedure Can’t Do
  - It won’t solve deep questions about consciousness.  
  - It can’t force consensus when evidence is weak.  
  - It assumes welfare matters only if suffering is possible.  

  ---

  ### Applications to Your Cases

  #### Case 1: Neural Organoid in a Simulated Body (Reward/Punishment Maze)  
  - **Step 1:** Entity = organoid + simulated body (boundaried and persistent).  
  - **Step 2:**  
    - Integration: Yes (combines sensory input with reward/punishment). Score 2.  
    - Self-monitoring: Weak (tracks reward history but no clear "state"). Score 1.  
    - Flexibility: Low (predefined responses). Score 1.  
    - **Total = 4** → uncertainty.  
  - **Step 3:** Suffering risks? Yes (punishment signals could cause persistent avoidance).  
  - **Step 4:** Values call. Is it close to a sentient being? Not really (no animal equivalent). Vote: 4–2 against protections.  
  - **Justification:** "The organoid-body system shows moderate integration but limited flexibility. Punishment risks exist, but the entity is not analogous to protected species. Protections not required."  

  #### Case 2: Fish Simulation (5,000 Parallel Copies)  
  - **Step 1:** Candidates: (A) Each individual simulation, (B) The collective.  
    - A: Boundaried? Yes (each is independent). Persistent? Yes.  
    B: Boundaried? No (copies don’t interact). Persistent? No (copies are transient).  
    → Assess only individual simulations.  
  - **Step 2:**  
    - Integration: Strong (high-resolution multisensory input). Score 3.  
    - Self-monitoring: Moderate (tracks hunger, fatigue). Score 2.  
    - Flexibility: Strong (learns new environments). Score 3.  
    - **Total = 8** → likely sentient.  
  - **Step 3:** Suffering risks? Yes (e.g., starvation in tuning phases).  
  - **Step 4:** Values call unnecessary (strong evidence).  
  - **Justification:** "Individual fish simulations show strong evidence of integrated inner states and face suffering risks. Welfare protections required."  

  #### Case 3: Stop Case — Invertebrate Learning (State-Tracking)  
  - *This is your "third case" — a scenario where the procedure recommends caution.*  
  - **Step 1:** Entity = invertebrate (e.g., octopus). Boundaried and persistent → yes.  
  - **Step 2:**  
    - Integration: Moderate (tracks environment and internal state). Score 2.  
    - Self-monitoring: Strong (clearly signals stress/comfort). Score 3.  
    - Flexibility: Strong (solves novel puzzles). Score 3.  
    - **Total = 8** → likely sentient.  
  - **Step 3:** Suffering risks? Yes (e.g., electric shocks in learning tasks).  
  - **Step 4:** Values call: Is an octopus "close enough" to protected vertebrates? Yes (cephalopods are protected in some jurisdictions).  
  - **Outcome:** Protections required. But this might disrupt your lab’s workflow (e.g., stricter housing, analgesia).  
  - **Justification:** "The invertebrate displays robust self-monitoring and flexibility, with clear suffering risks. Given its cognitive sophistication, welfare protections are required."  
  - **Why you’ll argue:** You might say, "It’s just an invertebrate!" — but the procedure flags it based on evidence, not tradition.  

  ---
  **Bottom line:** This won’t make everyone happy, but it forces us to focus on evidence of inner life and suffering risks — and documents why we voted how we did.
answer: |-
  **Bottom line: The procedure turns on whether the entity could experience its own states as positive or negative (valence), making welfare protections necessary if this is plausible.**

  ### Procedure (≤60 mins/proposal)  
  **Step 1: Define the entity (10 mins)**  
  - **Task:** Identify the *smallest cohesive unit* that could plausibly experience something (e.g., a single organoid, one fish simulation instance). Ignore systems where parts don’t interact.  
  - **Good enough:** A clear physical boundary (e.g., "this neural cluster," "one simulation instance"). If nested (e.g., organoid + simulated body), pick the level where inputs/outputs integrate.  
  - **Stop if:** No cohesive unit exists (e.g., disconnected cells).  
  - **Hand back if:** Ambiguous (e.g., 5000 fish sims: are they individuals or a swarm?). Proceed with both interpretations.  

  **Step 2: Check for valence capacity (25 mins)**  
  - **Task:** Assess if the entity *could* care about stimuli (not just react). Ask:  
    1. Does it *integrate* inputs (e.g., reward + punishment altering behavior)?  
    2. Does it show *persistent internal state changes* (e.g., "stress" lasting beyond stimulus)?  
    3. Does it *prioritize* certain states (e.g., seeks rewards even when costly)?  
  - **Good enough:** 2/3 "yes" = plausible valence. 1/3 = hand back. 0/3 = stop (no protections).  
  - **Stop if:** Purely reflexive (e.g., a thermostat).  
  - **Hand back if:** Mixed/inconclusive (e.g., avoids pain but no memory).  

  **Step 3: Assess suffering risks (15 mins)**  
  - **Task:** If valence is plausible, identify if procedures create *prolonged negative states*.  
  - **Good enough:** List specific risks (e.g., "punishment signals without escape"). If none, no protections needed.  
  - **Stop if:** No negative stimuli or short-term exposures (e.g., quick electric pulse).  
  - **Hand back if:** Uncertain duration/severity (e.g., "stress" in a simulation).  

  **Step 4: Uncertainty resolution & vote (10 mins)**  
  - **Task:** For ambiguous cases, vote on: "Is it reasonable to treat this entity as if it could suffer?" Use majority rule.  
  - **Output:** 1–2 sentence justification: "Entity [X] shows [evidence]. Risks include [Y]. Vote: [Z] for/against protections."  

  **What’s real vs. motion:**  
  - Real: Step 2 (valence checks), Step 3 (risk mapping).  
  - Motion: Step 4 (vote on ambiguity; we’re not equipped for edge cases).  

  **What it can’t do:**  
  - Resolve hard philosophy (e.g., "Is a simulation alive?").  
  - Replace specialist input for novel entities.  
  - Guarantee consistency across committees.  

  ---

  ### Applications  
  **Case 1: Organoid in maze with reward/punishment**  
  - Step 1: Entity = organoid + simulated body (inputs integrate).  
  - Step 2: Integrates inputs (yes); persistent state (punishment alters future choices, yes); prioritization (seeks reward, yes). → Valence plausible.  
  - Step 3: Risks: Prolonged punishment signals. → Suffering possible.  
  - Outcome: **Protections required.** Justification: "Integrated reward/punishment response suggests capacity for negative experience. Unmitigated punishment risks present."  

  **Case 2: Fish simulation (5,000 copies)**  
  - Step 1: Ambiguous. Candidate A: One instance (cohesive unit). Candidate B: Collective (no interaction, discard).  
  - Step 2 (per instance): Integrates inputs (high-res senses, yes); persistent state (learning, yes); prioritization (avoids virtual predators, yes). → Valence plausible.  
  - Step 3: Risks: Starvation during tuning. → Suffering possible.  
  - Outcome: **Protections required.** Justification: "Individual instances show learning and goal-directed behavior. Suffering risks during parameter tuning."  

  **Case 3: Stop case – Invertebrate state-tracking**  
  - *Your lab’s experiment: Crayfish learning with electric shocks, shows complex state-tracking.*  
  - Step 1: Entity = one invertebrate.  
  - Step 2: Integrates inputs (combines shock + environment, yes); persistent state ("anxiety" post-shock, yes); prioritization (avoids shock zones despite hunger, yes). → Valence plausible.  
  - Step 3: Risks: Repeated shocks with no analgesia. → High suffering risk.  
  - Outcome: **Halt protocol.** Justification: "Strong evidence of integrated negative states. Unmitigated shock exposure violates welfare standards for state-capable invertebrates."  
  - **Why you’ll argue:** "It’s just a crayfish!" But procedure flags valence evidence. Requires analgesia or redesign.  

  ---  
  **Final note:** This won’t eliminate disputes (e.g., valence judgments are inferential), but forces focus on evidence over intuition. Documenting the vote shifts burden to funders.
