prompt: |-
  Hey — I'm applying for a small six-week summer writing grant from my department; the deliverable is one chapter (~8000 words) that would slot into my dissertation as chapter 3 but also has to be able to stand alone if the dissertation goes sideways. Committee is two philosophers and a linguist, none of whom work on this exact thing.

  Here's the half-formed idea. There's that three-way split in Hofstadter's Gödel, Escher, Bach — frame message, outer message, inner message, I think in the "Location of Meaning" chapter, which I dont have with me and I always mix up which of the middle two is which. My working gloss: one layer is the signal that there is a message here at all and it wants decoding; one is the stuff that tells you how to decode it / what kind of thing to treat it as; and one is the content you get out the far end. Everyone uses the split to make the point that meaning isn't intrinsic to the message. What I want to do instead is use it to split that point into three separate questions: for each layer, can a signal supply that layer for itself, or does it have to come from outside the signal? My bet is that the answers come apart — that the "there's something here" layer is basically self-supplying (structure, non-randomness, compressibility), the content layer is a vacuous case, and the middle one is the only that genuinely can't be shipped along with the signal, so the anti-intrinsicality argument is a lot narrower than it usually sounds.

  The cases I keep coming back to are things that try to carry their own frame: a message that tells you how to read itself, a file whose first bytes declare its own format, a text in an unknown script where you have to get partway through deciphering it before you even know what kind of object it is. So the frame arrives late, and it arrives out of material that was content ten minutes earlier — call it frame leakage — which makes me suspect the layers are roles that the same material plays at different stages rather than parts of a signal.

  Can you turn that into a proposal? Specifically: state the question so it has a determinate answer in 8000 words; say why the usual ways of arguing about intrinsic meaning leave it open (the shared-code assumption in sender/receiver pictures, the circle talk in hermeneutics, the externalist meaning-ain't-in-the-head stuff — none of them ask it per layer); explain why working it through constructed limit cases beats the obvious move of surveying positions; lay out the possible verdicts per layer and what would decide between them; say honestly what would count as the chapter failing (my worry: every case just collapses back into "you need to know the code," or the three layers can't be separated without circularity, or the whole thing becomes a rule-following regress essay with new labels); and tell me what to cut to fit six weeks. Give it a working title that isn't clickbait.

  No bibliography, no citations — I'll fill those in myself, and I'd rather you not name-drop work you can't actually check.

  Last thing, and please take it seriously: I need to know which claims I can assert flatly to this committee and which are live disputes. So mark as you go what's settled among people who actually work on meaning and semiotics versus what's contested, flag anything you're reconstructing from memory rather than standing behind, and tell me straight if my reading of the three layers is itself the contested bit, or if my "bet" turns out to be something everyone already assumes — either way I'd rather find out now than in the committee meeting.
