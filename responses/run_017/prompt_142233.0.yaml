prompt: |-
  I'm TAing an intro metaphysics module this term and keep having the same argument with one of the PhD students, so I'd rather get properly attacked on this than keep winning by stipulation. The view I hold — call it the paraphrase view, I need some label — is that there is no causation by absence, full stop. When we say the guard's not turning up caused the vault to be emptied, or that the missing signature caused the application to be rejected, nothing negative is doing causal work: there's the actual positive history (the guard asleep down the road, the clerk processing the file), some counterfactuals about what would have happened had things gone differently, and a background of norms, plans and expectations that explains why we single out her absence rather than the Queen of England's. On my view causal claims about omissions are in perfectly good order as compressed explanations, they're just not reports of a causal relation with an absence in it. My supervisor says I've defintely just built the conclusion into what I'll count as a cause — causes have to be actual happenings, locatable in time, the sort of thing that can enter into production-like relations, and absences are none of those — and I want to know how much of the view is that definition wearing a coat.

  So: what would count against me, ranked from I'd have to give it up through this hurts to this is merely awkward, and for each one say whether a committed paraphrase theorist should concede it or is entitled to shrug. The things I want you to actually work through, with cases rather than name-dropping, are these. (1) Double prevention: someone tries to poison the coffee, a colleague quietly swaps the cups, the victim survives, and the absence of poison upstream seems to be what lets the whole normal causal story run — people treat this as the case where absences inherit causal power, and I've never felt its force, so either show me what I'm missing or agree with me and say why it's not the master case it's made out to be. (2) Symmetric overdetermination by two omissions: either of two guards would have locked the door and would have been enough, neither does, the burglar walks in; my counterfactual machinery breaks here, and I need to know whether my fallback (no cause of the break-in at all, or the two together) is a cost or a feature I can charge for. (3) The timing worry: an omission doesn't seem to have a sharp location or duration in the way causes are supposed to, and the late omission case — the doctor fails to give the antidote at midnight, but the patient was already dead at 11:55 — shows the shape of the problem; is the vagueness a reason to deny absences causal status or just a reason to be careful about event individuation? (4) The case that worries me most, which I made up and haven't seen discussed: the disarmed sprinkler. A fire spreads through a wing of a building because the sprinkler's trigger was never rewired after maintenance months earlier. There's no agent who failed to act at the relevant moment, nobody had a duty, there's no queue of expectations for my story to lean on — and yet the absence of a signal caused the fire to spread sounds completely fine to nearly everyone I try it on. (5) Model-relativity: whether a causal model even contains a variable for the guard locks the door is a modeller's choice, and if it does then the absence comes out as a cause on the usual actual-cause tests, and if it doesn't it can't even be a candidate. Positive causes don't look like they're at the mercy of variable inclusion in the same way — or do they? If they do, I'm not specially exposed and you should say so; if they don't, I owe you something. (6) My own rescue device, which I half suspect is junk: I distinguish thin absences (mere non-occurrences, like the Queen not watering the plant) from thick ones (the non-execution of a standing arrangement — a mechanism that was meant to fire, a plan, a role, a duty), and I use the distinction to explain why some absence-claims are good explanations and others are noise. Is that doing real work, or is it a moves-in-the-night device that lets me dismiss any counterexample as thin? If it's the latter, say so, and tell me what test would expose it.

  On epistemics: I want you to seperate what people who work on this genuinely agree on from what's just fashionable, and not hand me a consensus where there's only a majority. Flag every place where my view is insulated by a definition rather than an argument, and be willing to conclude that the whole thing has been qualified into unfalsifiability — and then say whether, for a view of this kind, that's a real problem or just what metaphysics looks like when it's done honestly. Tell me which single defeater you think is most likely to be right and roughly how confident you are in that ranking. And for what it's worth, the thing that would move me most is a case where the absence does explanatory work that no reconstruction out of positive history plus counterfactuals plus norms can replicate; shared intuitions alone won't do much for me, so if that argument is available, make it, and if it isn't, say that too.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a TA for an intro metaphysics module and keep arguing with a PhD student about causation by absence. Their view, the paraphrase view, holds that absences aren't genuine causes. Instead, claims about omissions are shorthand explanations involving positive events, counterfactuals, and norms. Their supervisor thinks they've built their conclusion into the definition of a cause, and they want to test how robust their view is against specific counterexamples.

  First, I need to address each of their six points systematically. Let me recall each case they mentioned: double prevention, symmetric overdetermination by omissions, timing issues with omissions, the disarmed sprinkler, model-relativity in causal models, and their thick/thin absences distinction. For each, I should assess whether it's a strong counterexample, how a paraphrase theorist might respond, and whether the response is ad hoc or justified.

  Starting with double prevention (1). They mention a cup-swapping scenario where the absence of poison allows survival. The user doesn't see this as problematic. I need to consider why others find it compelling. The key point here is that the absence of poison seems to play a role similar to a positive event in the causal chain. However, the paraphrase view can explain this with counterfactuals: if the poison were present, death would occur. The positive events (the colleague swapping cups) are what actually do the causing. The absence here is a condition, not an active cause. So the paraphrase view holds here without much strain.

  Next, symmetric overdetermination (2). Two guards fail to lock the door, either would have sufficed. This breaks counterfactual tests since removing one absence still results in the outcome. The user's fallback is to say there's no cause or a joint cause. Is this a cost? Well, denying causation entirely might seem counterintuitive, but the paraphrase view can argue that the positive events (both guards' inactions) collectively explain the outcome. Norms and expectations might single out both as responsible. While it's awkward, it's not a deal-breaker, and the user can frame it as a feature—highlighting the role of normative context.

  Then timing issues (3). Omissions lack precise locations. The late omission case (doctor fails at midnight but patient already dead) shows that without a temporal anchor, omissions are vague. The paraphrase view can handle this by tying omissions to the positive events that should have occurred. If the patient died at 11:55, the doctor's failure at midnight isn't the cause. The vagueness problem arises from misidentifying the relevant omission window. This pushes the paraphrase theorist to clarify event individuation but doesn't force them to accept absences as causes.

  The disarmed sprinkler (4) seems the toughest. No agents or duties; the sprinkler wasn't rewired months ago. The absence of a signal causes the fire. The user finds this intuitive. Here, the paraphrase view needs to reconstruct the explanation without norms. Positive events: the faulty wiring during maintenance, the fire's spread. Counterfactuals: if rewired, sprinklers activate, fire stops. The challenge is the lack of a responsible agent. But the user's thick absences concept might help—the sprinkler system had a standing function. Even without human agents, systems have purposes. So they can argue the absence is "thick" due to the system's design. If that works, it's a save; otherwise, it's problematic.

  Model-relativity (5) questions if causal models' variable choices affect cause attributions. For omissions, including a variable makes the absence a cause in models, but positive causes aren't as variable-dependent. The user wonders if they're uniquely exposed. Response: all causes in models depend on variable choice. Positive causes can also be excluded. For example, choosing coarse-grained variables might omit microscopic events. So this isn't a special problem for omissions. The paraphrase view can treat model outputs as pragmatic tools, not ontological commitments.

  Lastly, the thick/thin distinction (6). The user uses it to filter noise (Queen not watering) from meaningful omissions (guard's duty). Is this doing real work or just deflecting counterexamples? It's useful if tied to objective features like roles or mechanisms. But without clear criteria, it risks being ad hoc. To test, ask if thickness is definable independently of causal intuitions. If based on social facts or functions, it's legitimate. Otherwise, it's circular. The user needs to ground thickness in non-causal terms.

  Now, stepping back: the core issue is whether absences can be genuine causes or are explanatory shortcuts. The user wants a defeater that no positive-plus-counterfactuals-plus-norms can replicate. I need to think if such a case exists. The disarmed sprinkler might be close, but with thick absences, it's manageable. Maybe cases where norms are absent, but systems have functions. Or perhaps prevention cases where the absence is the only difference-maker without positive events. But the paraphrase view can still point to background conditions.

  The supervisor's critique about defining causes as positive events is key. If causation requires spatiotemporal location, absences don't qualify by definition. But is that stipulative? The user might argue that production/exchange models of causation naturally exclude absences. The debate then shifts to what causation is—processes versus difference-making. If the latter, absences might count. But the user's view is consistent within a process ontology.

  Overall, the paraphrase view is defensible but requires careful handling of counterexamples. The biggest threats are symmetric overdetermination (awkward) and disarmed sprinkler (if thick absences fail). Model-relativity and double prevention aren't major issues. The thick/thin distinction is useful if properly grounded. The view isn't unfalsifiable but relies on a particular metaphysics of causation. If one accepts that causes must be events with locations, then absences are excluded. The user's confidence might depend on how convincing their account of norms and functions is in cases like the sprinkler.
answer: |-
  Here's a systematic evaluation of your paraphrase view against the requested challenges, ordered from most to least threatening. I'll flag definitional insulation, consensus positions, and epistemic strength at each step. Crucially, **the disarmed sprinkler case (4) emerges as your strongest defeater**, while your thick/thin distinction (6) does real work but needs refinement.

  ### Core Tension
  Your supervisor is partly right: your definition *does* exclude absences by fiat (causes must be "actual happenings, locatable in time"). But this isn't arbitrary—it reflects a *production* or *process* theory of causation (Salmon, Dowe) where causation requires energy/momentum transfer or physical processes. The dispute is metaphysical: **Is causation solely about production, or does it include counterfactual dependence?** Your view is internally consistent but vulnerable where production and dependence diverge.

  ---

  ### Ranked Defeaters (Strongest to Weakest)

  1.  **The Disarmed Sprinkler (Your Case #4)**  
      **Case:** Fire spreads because sprinkler trigger wasn't rewired months prior. No agent, duty, or salient norm at the time of the fire. Intuition: "The absence of a signal caused the fire to spread" seems correct.  
      **Why it threatens you:**  
      - No "thick" absence (no duty/plan *at the time*).  
      - No "positive happening" corresponding to the omission (the rewiring omission is temporally distant).  
      - Counterfactual alone (*if rewired, fire contained*) seems insufficient—it lacks explanatory "oomph" without norms.  
      **Your response options:**  
      - **Shrug (entitled but costly):** Claim the intuition relies on implicit norms (building codes, system functions). *Cost:* Feels ad hoc; norms are stretched thin.  
      - **Concede (if pressed):** Admit this is an explanatory primitive not reducible to *current* positive events + norms. *Cost:* Abandons the "full stop" claim.  
      **Epistemics:**  
      - This case *is* a genuine threat. If no norm/plan exists (e.g., the sprinkler was slated for permanent decommissioning, but the fire happened before removal), your view struggles. **Most likely defeater (60% confidence)**. It isolates the intuition that absences can be difference-makers independently of agency.

  2.  **Symmetric Overdetermination by Omissions (#2)**  
      **Case:** Two guards, each sufficient to lock the door, both fail. Burglar enters.  
      **Why it threatens you:**  
      - Counterfactual test fails: ~Guard1 locks → still burglary (since Guard2 fails), and vice versa. Neither omission is necessary.  
      - Intuition: Each omission *is* a cause (like two snipers firing simultaneously).  
      **Your response options:**  
      - **Shrug (feature):** Deny there's a cause *simpliciter*; affirm "the joint absence caused it" as shorthand for "the positive state (both guards idle) + norms + counterfactuals." *Cost:* Clashes with intuition that *each* omission is causally responsible.  
      - **Concede (awkward):** Admit omissions can be causes here, but only as a special case. *Cost:* Opens the floodgates.  
      **Epistemics:**  
      - **Insulation alert:** Your denial relies on defining causation via necessity (implied by your counterfactual machinery). But consensus (e.g., Lewis, Halpern) holds that overdetermination *is* causal. This is a **moderate cost (awkwardness)**—your view handles it without contradiction, but less elegantly than theories accepting absences.

  3.  **Double Prevention (#1)**  
      **Case:** Poison swapped for harmless liquid; victim survives. Absence of poison "allows" survival.  
      **Why others find it compelling:**  
      - The absence *prevents a prevention* of survival. Feels active.  
      - In process theories, the swap creates a "causal chain" where the absence is a link.  
      **Your response (shrug, entitled):**  
      - The positive event (swapping) causes survival. The absence is a *background condition*: "No poison was present" is part of the scenario enabling the swap to succeed. Counterfactual: (*If poison present, death*). Norms (expectation of untainted coffee) explain focus.  
      - **Consensus:** Pro-absence theorists (Schaffer) treat this as causation; anti-absence theorists (Beebee) agree with you. **Not a major threat**.  

  4.  **Model-Relativity (#5)**  
      **Case:** Whether "guard locks door" is a variable affects if its absence is a cause in causal models (Halpern-Pearl).  
      **Why it might threaten you:**  
      - If absences are causes only when modeled, causation seems subjective.  
      - Positive causes *can* be excluded too (e.g., omitting "atmospheric pressure" from a match-lighting model).  
      **Your response (shrug, entitled):**  
      - Causal models are *representational tools*; they don't dictate ontology. Your view explains *why* including "guard locks door" is natural (norms/plans), while "Queen waters plant" isn't.  
      - **Consensus:** Model-relativity affects *all* causal claims—it doesn't specifically target absences. **No special exposure for you.**  

  5.  **Timing Worry (#3)**  
      **Case:** Doctor fails to administer antidote at midnight, but patient died at 11:55.  
      **Why it threatens you:**  
      - Omissions seem "vague" in duration/location.  
      **Your response (shrug, entitled):**  
      - Omissions are *defined* relative to a window of opportunity. Here, the omission must precede death to be explanatory. "Failure at midnight" is a misdescription—the relevant omission window closed at 11:55.  
      - **Consensus:** Event individuation is always tricky; absences aren't uniquely problematic. **Not a threat.**  

  6.  **Your Thick/Thin Distinction (#6)**  
      **Is it doing real work?** **Yes, but refine it.**  
      - **Strength:** Explains why "guard fails" is explanatory but "Queen fails" isn't, without invoking causation. Grounded in **functions, roles, or dispositions** (the sprinkler system *should* activate; guards *should* lock doors).  
      - **Weakness:** "Standing arrangement" is vague. Test case: *Random passerby* who could easily have saved a drowning child but had no duty. Intuition: Their omission caused death. Your view *can* handle this: social/moral norms make it "thick."  
      - **Not a moves-in-the-night device** if you tie "thickness" to objective features (social roles, system functions) independent of causal intuitions. **Epistemically sound.**  

  ---

  ### Epistemic Summary
  - **Consensus?** **No.** The field is split. Pro-absence: Schaffer, Hall, Halpern. Anti-absence: Beebee, Dowe, your view. Production vs. dependence theories are entrenched.  
  - **Definitional Insulation:** Your view *is* insulated—but robustly. It reflects a coherent metaphysics of causation as *production*. **Not unfalsifiable;** it can be falsified if absences *must* be causes to explain certain phenomena (see #4).  
  - **Most Likely Defeater:** **The disarmed sprinkler (#4)**. If no norm/function exists (e.g., a broken sprinkler in a derelict building where no one cares), and "absence caused spread" still holds, your paraphrase fails. Confidence: 60% that such cases exist.  
  - **Explanatory Gap Argument:** The sprinkler case *approaches* this. If an absence explains *why* a process unfolded *differently* without any positive event or norm accounting for the difference, your view loses. No uncontroversial case exists yet.  

  **Verdict:** Your view is defensible, but the disarmed sprinkler demands attention. If you can ground "thick" absences in non-causal, objective features (e.g., systemic functions), you survive. **Charge the awkwardness in symmetric omission as a feature:** It reveals the non-causal, normative core of responsibility attributions.
