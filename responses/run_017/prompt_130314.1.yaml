prompt: |-
  I want a specification, not a survey. Fix the purpose narrowly: an account of the will of the people good enough to adjudicate, in real time and before any vote is held, a politician's claim to speak for the people — to say whether she speaks truly or merely speaks for a faction.

  Write the desiderata such an account must meet. For each, give the case that makes it a requirement, and mark it non-negotiable or merely the preference of one camp. Among the cases I want it to earn its keep on: the inter-electoral claim itself, which forces the question whether the will can be identified independently of any procedure and, if so, how that identification is not simply arbitrary; scale-fragmentation, where a majority rejects every component of a package yet approves the package as a whole, so that issue-by-issue and holistic aggregation come apart; the silent and the misinformed — non-voters, and preferences formed under systematic misinformation — which forces a choice between the will people actually have and the will they would have under better information; the bearer question, whether the people are residents, citizens, those subject to coercion, or future generations, and whether the bearer survives a large change in its own membership; intensity, where 51 per cent are mildly for and 49 per cent intensely against, together with cycling and agenda-order cases in which no stable majority exists at all; and self-binding, where a people wills a constitution that later blocks what it now wants.

  Flag any pair of desiderata you take to be jointly unsatisfiable, say which one is really a prejudice of a particular camp rather than a genuine requirement, and identify the single requirement that excludes the largest share of otherwise plausible theories. Close with one or two lines each on how four families fare: aggregative-procedural accounts, the general-will tradition, deliberative or counterfactual-will accounts, and constructivist views on which the people exist only in being invoked. A table is fine for the list. Lead with your bottom line — the excluding requirement and the unsatisfiable pair — in the first sentence, then give the requirements; no preamble and no restating of the question.
reasoning: |-
  Okay, the user wants a specification for determining the "will of the people" in real time, before any vote, to judge if a politician truly speaks for the people or just a faction. They provided several challenging cases to test this: inter-electoral claims, scale-fragmentation, silent/misinformed voters, bearer questions, intensity/cycling, and self-binding. 

  First, I need to identify the core requirements this system must meet. The user emphasized narrow purpose—no surveys, just adjudication. Each desideratum must be justified by a specific case they mentioned. Let me go through each case and derive a requirement.

  Starting with the inter-electoral claim. If we're assessing claims between elections, we can't rely on procedures like voting. So we need a non-procedural source. But how to avoid arbitrariness? That's the challenge. This leads to a non-procedural requirement, which seems non-negotiable but tricky.

  Scale-fragmentation is next. A package can be approved even if each part is rejected. This means we need to handle both issue-by-issue and holistic preferences. So the system must account for how preferences aggregate—whether as a whole or in parts. Non-negotiable because it's a real problem in policy-making.

  Silent and misinformed voters. Should we consider actual preferences or idealized ones? Both have issues. If we correct for misinformation, it becomes paternalistic. But ignoring it might uphold false preferences. This requires a choice—actual or idealized will. Non-negotiable because it's fundamental.

  Bearer question: who counts as "the people"? Residents, citizens, affected individuals? Also, what if the group changes? This affects the scope. Non-negotiable since the subject must be defined.

  Intensity and cycling. A slim majority with mild support vs. a passionate minority. Also, cycling majorities where no stable preference exists. Need to capture intensity and handle instability. Non-negotiable as these are common in politics.

  Self-binding: a past decision binding the present. How to reconcile past and present wills? Non-negotiable for constitutional issues.

  Now, conflicting desiderata. Non-procedural and Stable Majorities seem incompatible. Without procedures, how do we determine stable preferences? Maybe stability relies on procedures. So Non-procedural excludes most theories. Also, Actual vs Idealized Will is a deep conflict—one camp prefers real preferences, another wants corrected ones.

  For theories: Aggregative (like voting) fails on non-procedural and scale-fragmentation. General Will (Rousseau) struggles with bearer and self-binding. Deliberative accounts handle misinformation but need a procedure. Constructivist views avoid essentialism but might not provide real-time adjudication.

  The excluding requirement is Non-procedural. It knocks out voting-based methods. The unsatisfiable pair is Non-procedural and Stable Majorities. The user probably leans towards a non-procedural approach but needs to address how to avoid arbitrariness without procedures.
answer: |-
  **Bottom line:** The excluding requirement is *Non-Procedural Identification (NPI)*; the unsatisfiable pair is *NPI* and *Stable Majorities (SM)*, where *SM* is a factional preference for proceduralists.

  ### Desiderata for Real-Time Adjudication of "The People's Will"
  | Desideratum | Case Driving Requirement | Non-Negotiable (NN) / Factional (F) | Conflict Notes |
  |-------------|--------------------------|--------------------------------------|----------------|
  | **1. Non-Procedural Identification (NPI)** | Inter-electoral claims: Must judge without elections/referenda. Requires non-arbitrary source independent of voting. | **NN** | Excludes aggregative theories. Conflicts with *SM*. |
  | **2. Aggregation Robustness (AR)** | Scale-fragmentation: Must distinguish between holistic package approval and component rejection. | **NN** | Requires handling non-separable preferences. |
  | **3. Epistemic Stance (ES)** | Silent/misinformed: Forces choice between actual preferences (including non-voters/misinformed) vs. counterfactual "better-informed" will. | **NN** | *Actual Will (ES-A)* favored by positivists; *Ideal Will (ES-I)* by epistemic democrats (F). |
  | **4. Bearer Definition (BD)** | Bearer question: Must specify who "the people" are (e.g., citizens/residents/future) and if identity persists through membership change. | **NN** | Scope affects all claims (e.g., climate policy vs. immigration). |
  | **5. Intensity Sensitivity (IS)** | Intensity asymmetry: Must register strength of preference (51% mild support vs. 49% intense opposition). | **NN** | Rejects simple majoritarianism. |
  | **6. Non-Agenda-Dependence (NAD)** | Cycling/agenda-order: Must yield consistent will even when no stable majority exists. | **NN** | Prevents manipulation via issue sequencing. |
  | **7. Temporal Coherence (TC)** | Self-binding: Must reconcile past constitutional will with current preferences. | **NN** | Rejects purely presentist accounts. |
  | **8. Real-Time Feasibility (RTF)** | All cases: Must adjudicate *before* votes, requiring timely measurement. | **NN** | Excludes deep deliberation/causal inference. |
  | **9. Stable Majorities (SM)** | Cycling cases: Assumes non-existent stable majority is normative ideal. | **F** (Proceduralist) | Contradicts *NPI* and *NAD*; factional bias toward aggregative models. |

  **Conflicts:**  
  - **NPI vs. SM:** *NPI* demands will independent of procedures; *SM* implicitly requires procedures to "reveal" stability. *SM* is a proceduralist prejudice.  
  - **ES-A vs. ES-I:** Mutually exclusive; choice reflects ideological camp (positivist vs. epistemic democrat).  

  **Theories Assessment:**  
  | Family                         | Key Failure Against Desiderata |
  |--------------------------------|--------------------------------|
  | **Aggregative-Procedural**     | Fails *NPI*, *NAD*, *RTF* (relies on votes/stability). |
  | **General-Will (Rousseauian)** | Fails *BD* (indeterminate bearer), *TC* (ignores self-binding tension), *RTF* (needs Legislator). |
  | **Deliberative/Counterfactual**| Fails *RTF* (not real-time), *ES* ambiguity (straddles *ES-A/I*), *NPI?* (often requires forums). |
  | **Constructivist (e.g., Habermas)** | Fails *NPI* (will "constructed" in discourse, not pre-existing), *RTF* (deliberation not instantaneous). |
