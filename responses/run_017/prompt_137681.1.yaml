answer: |-
  Here's your Q&A prep sheet, structured for maximum defense against a sophisticated interdisciplinary audience. Objections are ordered by potential damage.

  ---

  **Q&A PREP SHEET: "Nothing Is Locked In"**  
  *Concede Early:*  
  - That *some* arrangements *are* sticky due to coordination costs ("weak path dependence" exists).  
  - That "functional equivalence" is often contestable and context-dependent.  

  *Refuse to Concede:*  
  - That "historical sensitivity" equals "lock-in."  
  - That the absence of observed shifts proves lock-in (per migration test).  
  - That functional shadows are epistemically inaccessible.  

  ---

  **OBJECTIONS (Ordered by Damage Potential):**  

  1. **Historian (Identification):** "Your 'migration test' relies on unobservable counterfactual coalitions. Without a clear identification strategy—natural experiment, discontinuities—how can we falsify this? It risks being unfalsifiable storytelling."  
     *Reply:* "The test uses *documented* historical actors, their *known* incentives/capacities, and *period-appropriate* information. We reconstruct feasible coalitions from archives (e.g., failed reform attempts in railway gauges). Falsification occurs if we find cases where such coalitions *did* emerge but failed *despite no exogenous shock*."  
     *Soft Spot:* Archival evidence of unrealized coalitions is often fragmentary.  
     *Fatal if mishandled?* **YES** (Undermines empirical credibility).  

  2. **Sociologist (Mechanism):** "You claim coordination locks in *function*, not form. But what’s the actual mechanism? Why don’t we see shifts within the functional class more often? Your 'equilibrium' seems static."  
     *Reply:* "The mechanism is *costly re-coordination*: switching requires simultaneous defection from incumbents. We *do* see shifts (e.g., digital media formats supplanting physical ones) when re-coordination costs fall below a threshold. Static cases reflect sustained cost asymmetry, not inevitability."  
     *Soft Spot:* Needs clearer metrics for "cost thresholds."  
     *Fatal?* **NO** (Absorbable with examples).  

  3. **Philosopher (Modality):** "What does 'historically admissible' mean? Physical possibility? Epistemic possibility given period knowledge? Your test smuggles in contested modal assumptions."  
     *Reply:* "Admissibility = *epistemic* possibility: agents acting on period-accessible information under institutional constraints. No futurism allowed (e.g., 1890s actors couldn’t foresee digital tech). We exclude only coalitions requiring knowledge/tech beyond their historical horizon."  
     *Soft Spot:* "Epistemic possibility" is inherently interpretative.  
     *Fatal?* **YES** (If modal ambiguity collapses the test).  

  4. **Historian (Case Selection):** "Your cases (QWERTY, VHS) are cherry-picked 'easy wins.' What about nuclear power? Electrification standards? These seem genuinely locked-in—no functional shadow emerged despite massive inefficiency."  
     *Reply:* "Nuclear’s 'lock-in' is geopolitical (weapons proliferation concerns), not pure path dependence. Electrification (AC/DC) *did* shift post-Westinghouse-Tesla innovations—proving my point. I welcome hard cases; the test forces us to dissect *why* no coalition emerged (e.g., regulatory capture vs. true coordination failure)."  
     *Soft Spot:* Nuclear is a strong counterexample; requires nuanced handling.  
     *Fatal?* **NO** (Can be framed as test application).  

  5. **Sociologist (Case Discrimination):** "If your framework explains both stability *and* change, how does it differ from generic contingency? How do we operationalize it to predict which equilibria are 'migration-resistant'?"  
     *Reply:* "It discriminates via the migration test’s *temporal* requirement: lock-in must hold at *every* node. Generic contingency lacks this. Operationalization: map decision points, model coalition incentives at each, and compare costs of status quo vs. shift. Resistance correlates with network effects/vested interests."  
     *Soft Spot:* Predictive power is speculative without formal modeling.  
     *Fatal?* **NO** (Theory-building stage).  

  6. **Philosopher (Model Language):** "You replace 'locked-in arrangement' with 'locked-in functional equilibrium.' But if the functional class is broad, doesn’t this make lock-in trivial? If narrow, how is it not just arrangement-lock-in by another name?"  
     *Reply:* "Functionality is defined *materially* (e.g., 'text input at ≥X wpm'), not abstractly. The shadow must be *comparable in cost/feasibility* for contemporary actors. QWERTY’s shadow isn’t voice recognition—it’s alternative keyboard layouts with similar mechanical constraints. This is nontrivial: it explains why inefficient *types* persist, not tokens."  
     *Soft Spot:* Defining "comparable cost" across contexts is thorny.  
     *Fatal?* **YES** (If functionality is seen as arbitrary).  

  7. **Historian (Policy Relevance):** "If nothing is locked in, why do path-dependent narratives dominate policy? If your view is right, why do inefficient institutions persist for centuries?"  
     *Reply:* "Persistence reflects *equilibrium stability under current costs*, not inevitability. Policy should focus on lowering re-coordination costs (e.g., subsidies, phased transitions) rather than resigning to 'locked-in' inefficiency. Narratives of lock-in become self-fulfilling by discouraging coalition-building."  
     *Soft Spot:* Underestimates ideological/power barriers to change.  
     *Fatal?* **NO** (Absorbable as implication).  

  ---

  **The Question You Hope Nobody Asks:**  
  "Can you name *one* case that *passes* your migration test—where no historically admissible coalition could have shifted to a functional shadow at any point? If not, is your thesis tautological?"  

  *Why it’s dangerous:* Forces you to defend the test’s falsifiability under pressure. If you concede no cases pass, critics cry tautology; if you name a case, they’ll dissect it.  
  *Draft Reply:* "Potentially nuclear power or the QWERTY-to-Dvorak transition pre-computer. But these are contested—which is the point. The test isn’t about finding unicorns; it’s a diagnostic forcing us to specify *why* change failed. Alleged lock-ins often crumble under scrutiny (e.g., VHS was supplanted within 15 years)."  

  ---  
  \answer{Functionality Arbitrariness}
