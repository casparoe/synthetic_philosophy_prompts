answer: |-
  My dear substantivalist, in this intriguing variant, I maintain that the water's concavity still depends entirely on its acceleration relative to the universe's matter—here, the massive shell. At stage 1, the water's surface remains flat. Why? Though the shell rotates *geometrically* relative to the water, the *inertial frame* is defined by the dominant mass distribution—the shell itself. Since the water experiences no *acceleration* relative to this shell-defined frame (it is stationary while the shell rotates uniformly), no centrifugal forces arise. The shell's rotation alone, without acceleration relative to it, does not generate concavity. At stage 2, the water *is accelerated* rotationally relative to the shell's frame as it is dragged from rest into motion—it must overcome inertia defined by the shell's mass. Once co-rotating, the water maintains this state *accelerated* relative to the natural non-rotating frame defined by the shell's mass distribution. Thus, concavity appears only at stage 2, matching your prediction but *without* absolute space: centrifugal force arises from acceleration relative to the dominant matter (the shell), which sets the standard of non-acceleration. The shell isn't just matter; it *determines* inertia.  
  Summary: Inertial effects like concavity arise from acceleration relative to the dominant mass distribution (the shell), which defines the local standard of non-acceleration, not from mere relative motion or absolute space.
