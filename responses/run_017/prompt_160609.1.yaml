answer: |-
  You're right that framing is inescapable—disclosures always involve selection and presentation choices—but that doesn't dissolve actual understanding into institutional manufacture. The regress stops at the patient's *subjective mental state* at the moment of consent. Did they grasp the core realities: the nature of the procedure, its material risks (like "chance of permanent numbness"), and alternatives that would reasonably matter to them? The questionnaire and formatting are tools to *elicit* that grasp, not define it. When calibrated disclosure omits a clinically reasonable alternative precisely because it would cause refusal, it manufactures ignorance—so the patient *cannot* grasp material features. That invalidates consent, even if the form isn't false. Your committee’s judgment about what’s "worse for the patient" doesn’t override whether the patient themselves understood their options. Understanding is the patient’s cognitive achievement; the process is merely instrumental to it. If the process obscures material facts, it fails—no matter how proper the procedure seems.
