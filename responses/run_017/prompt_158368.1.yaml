answer: |-
  Below is a decision tree structured to help students map their position on the boundary problem in democratic theory. It uses concrete cases (e.g., cross-border commuter, long-term resident) to guide branching, avoids theory-laden jargon, and clarifies distinctions between "affected" and "subject to authority." The tree has 10 branch nodes and 9 leaves, including views like constitutive power, affectedness-based theories, and community-based membership. Each leaf identifies a position (or flags gaps) and its "awkward commitment" – a non-ideal implication revealed by the cases.

  ### Decision Tree  
  **Start at Node 1.**  

  **Node 1**: Should everyone *bound to obey* a polity’s laws (e.g., a tourist arrested for littering, a resident who rejects its authority) be included in its demos?  
  - **Yes** → Node 2  
  - **No** → Node 3  

  **Node 2**: Should this include people *temporarily* subjected (e.g., a 3-day tourist)?  
  - **Yes** → **Leaf A**  
  - **No** (only permanent/substantial subjection) → **Leaf B**  

  **Node 3**: Should everyone *impacted* by a decision (e.g., farmers reliant on a foreign dam, future generations) be included?  
  - **Yes** → Node 4  
  - **No** → Node 8  

  **Node 4**: Does "impact" mean *any causal effect* (e.g., a foreign corporation’s profits affected by tariffs), or only effects that *significantly alter life plans/well-being* (e.g., losing a water supply)?  
  - **Any effect** → Node 5  
  - **Significant effect** → Node 5  
  *(Note: Both routes merge; the distinction informs the leaf’s awkwardness but doesn’t split the tree further.)*  

  **Node 5**: Should the demos be *fixed* (same for all decisions) or *vary per issue* (e.g., only dam-affected voters for the dam vote)?  
  - **Fixed** → Node 6  
  - **Vary per issue** → Node 7  

  **Node 6**: Is this criterion *absolute* (include all impacted) or *weighable* against stability/feasibility (e.g., excluding distant farmers for practicality)?  
  - **Absolute** → **Leaf C**  
  - **Weighable** → **Leaf D**  

  **Node 7**: Can a demos lack *stability* (e.g., constantly changing voters) if it matches the issue?  
  - **Yes** → **Leaf E**  
  - **No** → **Leaf F** *(Incoherent: Per-issue demoi can’t be stable corporate agents.)*  

  **Node 8**: Is the demos defined by *shared identity/history* (e.g., excluding non-citizens despite long residency)?  
  - **Yes** → **Leaf G**  
  - **No** → Node 9  

  **Node 9**: Should *children* (affected but immature) or *incarcerated people* (affected but excluded) be included?  
  - **Yes** (prioritize affectedness) → **Leaf H**  
  - **No** (prioritize agency/competence) → Node 10  

  **Node 10**: Is the boundary *indeterminate* until a group successfully claims power (e.g., through revolution or secession)?  
  - **Yes** → **Leaf I**  
  - **No** → **Leaf J** *(Unexplored: Rejects all above; e.g., random lotteries.)*  

  ---

  ### Leaf Table  
  | Leaf | Position                     | Awkward Commitment (Revealed by Cases)                                  |
  |------|------------------------------|------------------------------------------------------------------------|
  | A    | **All-Subjected**            | Must let tourists vote in local elections (over-includes transient actors). |
  | B    | **Permanent Subjection**     | Excludes long-term non-citizen residents (20-yr taxpayer) if citizenship required (under-includes stakeholders). |
  | C    | **Strong Affectedness**      | Must include foreign farmers/foreign corps in dam votes (unbounded demos). |
  | D    | **Weighable Affectedness**   | Excludes future generations from nuclear waste votes (feasibility over moral stakes). |
  | E    | **Floating Demos**           | Cannot represent future generations (no mechanism for unborn to vote). |
  | F    | **[Incoherent]**             | Per-issue demoi cannot act as corporate agents (stability requirement self-defeating). |
  | G    | **Community Membership**     | Excludes loyal non-citizens; includes emigrated citizens with no ties (rigid/arbitrary). |
  | H    | **Children/Incarcerated Included** | Grants votes to children (ignores competence) or incarcerated (ignores legal exclusion). |
  | I    | **Constitutive Power**       | Ratifies exclusion of dissidents (e.g., resident rejecting authority) via power, not principle. |
  | J    | **[Unexplored]**             | No clear way to handle cross-border commuter cases (lacks guiding rationale). |

  ---

  ### Key Notes  
  1. **Cases Doing Diagnostic Work**:  
     - **Tourist** → Tests temporal subjection (Node 2).  
     - **Long-term non-citizen** → Tests community vs. subjection/affectedness (Nodes 1, 8).  
     - **Emigrated citizen** → Tests community ties (Leaf G).  
     - **Foreign farmers/future generations** → Test affectedness scope (Nodes 3–6).  
     - **Children/incarcerated** → Test competence vs. inclusion (Node 9).  

  2. **Unseparated Pairs**:  
     - **Leaf D (Weighable Affectedness) and Leaf G (Community Membership)**  
       The tree cannot distinguish views that weigh community ties *against* affectedness (e.g., "Include farmers only if culturally integrated"). This is because Node 8 (community) bypasses affectedness, and Leaf D’s "weighing" may implicitly use community.  
     - **Why?** Hybrid theories (e.g., "subjected + affected") require additional branching, exceeding node limits.  

  3. **Design Rationale**:  
     - **Start with subjection** to immediately decouple it from affectedness (using the tourist/commuter cases).  
     - **Merge affectedness definitions** at Node 4 to avoid combinatorial explosion; differences resurface in leaf awkwardness (e.g., "any effect" makes Leaf C include corporations; "significant effect" makes it contestable).  
     - **Constitutive power** is treated as an answer (Leaf I) but flagged as circular in its justification.  

  This handout lets students navigate their intuitions via cases, reveals tensions in prominent theories (e.g., future generations in affectedness views), and identifies logical gaps (e.g., incoherent per-issue stability). Print as a one-page reference.
