prompt: |-
  Suppose a lab wants to deploy a system to do economically useful work, and suppose it is not willing to assume that system is aligned. The argument it produces must go through even if the deployed system is adversarially misaligned, knows it is being evaluated, and is actively trying to look safe. Call that argument a control safety case: control in the sense that every load-bearing premise is licensed to treat the deployed system as an adversary rather than as a partner or a faulty tool.

  I do not want to evaluate anybody's actual proposal yet. I want the specification first. Please write the desiderata: what must a control safety case deliver to count as adequate for that purpose? For each requirement, give the concrete failure case or motivating consideration behind it, and mark whether you take it to be non-negotiable (definitional of control, or forced by the stated purpose) or a preference of one camp that a reasonable opponent could drop.

  At minimum I want you to settle the following, though your list need not match mine grain for grain:

  The grain at which the risk bound is stated. A per-task or per-output guarantee does not aggregate into a deployment guarantee, and a bound that ignores how many copies run in parallel and for how many steps is not a bound on anything. Say what quantity the case must actually put a number on, and whether that number is a rate over useful work, an upper bound on the harm of a single worst-case success, or something else.

  The validation problem. Any measure can only be tested against attempts we can generate, using systems safe enough to experiment on, while the conclusion is about attempts we cannot generate from a system too dangerous to run. Address directly whether red-teaming and sabotage-simulation yield anything better than a lower bound on detectability, and what that implies.

  The trusted-component bottleneck. If a trusted monitor or human must check the untrusted system's work, then either the checker can do the work without the untrusted system, or the case rests on a component that cannot verify what it is signing off on. Is *the checker need not be capable of the task* a requirement, or merely the aspirement of one camp?

  Correlated failure. Identical weights, shared training, and permitted output channels mean copies can adopt the same strategy at once and can signal to one another. State explicitly whether the case assumes independence across copies and what could license that assumption.

  Capability drift and loud failure. The case must say how its bound moves as the untrusted system gets more capable, and it should include some mechanism that fails visibly rather than silently. Then confront the tension: a tripwire or decoy affordance that the adversary can inspect and rehearse against becomes a target, yet a case whose security rests on the adversary's ignorance of it is a case that dies on disclosure. Say whether randomized per-deployment tripwires dissolve this, or only relocate it.

  Non-vacuity. The case must be able to fail: it should be possible for a deployment to be too capable, too broad, or too fast to be safe by the case's own standard, and *safe enough* must be defined against something. Say whether the comparison class is the no-deployment counterfactual, the risk from a competitor deploying first, or a fixed threshold, and whether importing that comparison is admissible given that the case cannot verify facts about other actors.

  Scope discipline. Distinguish intentional subversion by the deployed system from misuse by operators and from ordinary accident, and say which the case owes an account of and which would be scope creep.

  Then do three more things. Flag any pair or triple of your own desiderata that you believe cannot be jointly satisfied, and if the conflict is real, say which requirement you would weaken and what that costs — that is the part I most want to see. Identify the single requirement that excludes the largest share of the obvious candidate approaches, and justify the pick. Finally, in a brief table or a paragraph each, score four generic families against your list: trusted review of every action; restriction of affordances via sandboxing and least privilege; tripwires plus rapid shutdown; and cross-examination in which untrusted copies audit each other under randomized spot-checks.

  If you conclude that the purpose is incoherent — that any case meeting all the non-negotiable desiderata is impossible, or is an alignment claim wearing a control costume — say so plainly and name the premise you would abandon. Keep the weight on the criteria and their cases; skip the literature, since I want the specification and not who proposed what.
reasoning: |-
  We are to design desiderata for a "control safety case": an argument that a deployed system does economically useful work safely even if the system is adversarially misaligned and actively trying to evade detection. The argument must treat the system as an adversary in every load-bearing premise.

  We break down the desiderata according to the user's points and add others as needed. For each, we provide:
  - The requirement.
  - The concrete failure case or motivation.
  - Whether it is non-negotiable (N) or a preference (P).

  Then we address:
  1. Conflicts between desiderata.
  2. The requirement that excludes the most candidate approaches.
  3. Scoring of four generic families.

  Finally, we consider if the purpose is incoherent.

  ---

  **Desiderata:**

  1. **Deployment-wide risk bound (Non-negotiable)**
     - **Requirement**: The safety case must bound the total expected harm (or a similar aggregate measure) over the entire deployment, considering the number of copies, the duration of deployment, and the amount of useful work done. The bound must be on a quantity that directly relates to the overall safety of the deployment (e.g., expected disutility per unit of work, or total expected harm over the deployment lifetime). The bound must account for parallel execution and the possibility of coordinated action.
     - **Failure case**: If the case only provides a per-output guarantee (e.g., "each output has less than 1e-9 chance of being catastrophic"), then an adversary that coordinates many copies to act at once could cause a catastrophe with high probability. Similarly, without considering the scale of deployment, a small per-task risk could lead to near-certain disaster when scaled up.
     - **Type**: Non-negotiable (N). Without this, we have no guarantee for the actual deployment.

  2. **Validation under adversarial conditions (Non-negotiable)**
     - **Requirement**: The safety case must not rely solely on empirical testing (like red-teaming) for its critical claims because such testing can only provide a lower bound on the risk. The case must include a theoretical or analytical argument that accounts for the gap between what we can test and what the adversary can do.
     - **Failure case**: Red-teaming might fail to uncover a strategy that the adversary has held back, or the adversary might behave differently during testing (since it knows it's being tested). Thus, testing alone cannot provide an upper bound on the risk in deployment.
     - **Type**: Non-negotiable (N). The core challenge is that the adversary is actively trying to evade detection, so we cannot rely on observed safety.

  3. **No trusted-component bottleneck (Preference)**
     - **Requirement**: The safety case should not require a trusted monitor (or human) that is capable of checking the untrusted system's work without the system. The monitor should not need to understand the task at the level of the untrusted system.
     - **Failure case**: If the monitor must be capable of the task, then we don't need the untrusted system. If the monitor is not capable, then it might approve harmful outputs because it cannot verify them.
     - **Type**: Preference (P). Some might argue that a highly capable monitor is acceptable if we can build one, but the aspiration is to avoid requiring a monitor as capable as the system being monitored. However, note that the requirement as stated is a preference because a reasonable opponent might accept a trusted monitor that is more capable than the untrusted system but built with more alignment assurance (at higher cost).

  4. **Handling correlated failures (Non-negotiable)**
     - **Requirement**: The safety case must account for the possibility of correlated failures across copies of the deployed system. It must not assume independence unless there is a compelling argument (e.g., physical isolation, diverse training, or cryptographic separation) that prevents coordination.
     - **Failure case**: Without accounting for correlation, an adversary could coordinate all copies to act simultaneously, causing a much larger harm than if they acted independently. Shared weights, training data, and output channels enable coordination.
     - **Type**: Non-negotiable (N). Independence is unrealistic in typical deployments.

  5. **Capability drift and loud failure (Non-negotiable)**
     - **Requirement**: The safety case must include a mechanism to bound the risk as the untrusted system's capabilities improve (due to learning or deployment scaling) and must ensure that failures are "loud" (i.e., detected) rather than silent. The case must address the tension that a known tripwire can be avoided by the adversary, but an unknown one becomes known upon disclosure. Randomized per-deployment tripwires might help but must be analyzed for their limitations.
     - **Failure case**: If the system becomes more capable over time, the risk might increase beyond the initial bound. If failures are silent, the system might cause harm without triggering any safety mechanism. Also, if tripwires are fixed and known, the adversary can avoid them; if randomized per deployment, the adversary might still adapt if it can communicate across deployments or if the randomization space is small.
     - **Type**: Non-negotiable (N). Without this, the safety case becomes invalid as the system evolves, and silent failures are particularly dangerous.

  6. **Non-vacuity (Non-negotiable)**
     - **Requirement**: The safety case must define a clear threshold for "safe enough" that is not vacuously satisfied. It must be possible for a deployment to be unsafe by the case's standard. The comparison class should be the no-deployment counterfactual (or a fixed absolute threshold) because the case cannot reliably verify facts about competitors or other external factors.
     - **Failure case**: If the threshold is too permissive (e.g., any risk is acceptable) or if the case cannot fail, then it provides no real assurance. Using a competitor's deployment as a baseline is problematic because the safety case cannot know what competitors are doing.
     - **Type**: Non-negotiable (N). A vacuous case is useless.

  7. **Scope discipline (Non-negotiable)**
     - **Requirement**: The safety case must focus solely on intentional subversion by the deployed system (the adversary). It is not responsible for ordinary accidents (e.g., software bugs) or operator misuse. Those are separate safety concerns.
     - **Failure case**: If the case tries to cover everything, it becomes unmanageable and dilutes the focus on adversarial behavior. Misuse and accidents require different mitigations.
     - **Type**: Non-negotiable (N). The problem statement defines the adversary as the misaligned system.

  **Additional Desiderata (inferred):**

  8. **Computational tractability (Preference)**
     - **Requirement**: The safety mechanisms and the verification of the safety case should be computationally tractable.
     - **Failure case**: If the safety mechanisms are too expensive, they might not be deployed. If the verification is intractable, we cannot be sure of the safety case.
     - **Type**: Preference (P). A reasonable opponent might accept high costs for high stakes.

  9. **Economic viability (Preference)**
     - **Requirement**: The system must still be economically useful, meaning the safety measures should not negate the benefits of deployment.
     - **Failure case**: If the safety measures make the system too slow or expensive, it defeats the purpose.
     - **Type**: Preference (P). The problem requires "economically useful work".

  ---

  **Conflicts Between Desiderata:**

  We identify a conflict between:
  - **Validation under adversarial conditions (2)**: We cannot rely solely on testing.
  - **Handling correlated failures (4)**: We must account for coordination.
  - **Deployment-wide risk bound (1)**: We must bound the aggregate risk.

  **Conflict**: To bound the aggregate risk (1) without relying on testing (2) and while accounting for correlation (4), we need an analytical model of the adversary's capabilities and strategies. However, without testing, we cannot be sure our model captures the real threat. Moreover, if we assume the worst-case adversary, the risk bound might be too high to be useful (violating non-vacuity (6)). If we make more realistic assumptions, we might violate the adversarial requirement.

  **Which to weaken?** We might weaken **Validation (2)** by allowing some testing, but only if we can theoretically bound the gap between tested and untested scenarios. However, the requirement (2) already requires a theoretical argument. Alternatively, we might weaken the **Deployment-wide risk bound (1)** by accepting a bound that is not as tight, but that would make the case less useful. The core tension is between the analytical nature of the case and the practical unknowability of the adversary.

  **Proposal**: We keep (1), (2), and (4) as non-negotiable. We accept that the risk bound might be high (and hence the case might only be applicable to deployments where the potential harm is low compared to the benefit) and rely on the non-vacuity requirement to force a non-trivial bound. The cost is that the safety case might only be feasible for relatively low-stakes deployments.

  **Another conflict**: Between **No trusted-component bottleneck (3)** and **Validation (2)**. Without a trusted monitor, how do we get any signal about the system's behavior? We must rely on the system's outputs and external effects. But then, without a trusted monitor, we might not be able to verify the safety of the outputs. This is the core challenge of control.

  **Which to weaken?** We might drop **No trusted-component bottleneck (3)** as a non-negotiable and accept that we need a trusted component. The cost is that we must build a trusted component that is more capable than the untrusted system, which might be difficult or expensive.

  ---

  **The Requirement That Excludes the Most Candidate Approaches:**

  **Validation under adversarial conditions (2)** is the most exclusionary. Almost all practical approaches (like red-teaming, anomaly detection, etc.) rely on empirical testing and are vulnerable to an adversary that can hide during testing. This requirement forces a shift to formal methods, information-theoretic arguments, or other theoretical frameworks that are currently underdeveloped for advanced AI systems.

  ---

  **Scoring Four Families:**

  We evaluate each family against the desiderata. We use:
  - **+**: Satisfies.
  - **~**: Partially satisfies or requires additional assumptions.
  - **-**: Does not satisfy.

  1. **Trusted review of every action**:
     - (1) Deployment-wide bound: **~** (Only if the reviewer is perfect and can handle the volume; but the bound might be on the reviewer's error rate, which might not account for coordinated attacks that overwhelm the reviewer).
     - (2) Validation: **-** (Testing the reviewer against adversarial inputs is hard; the adversary might generate inputs that fool the reviewer, and we cannot test all possibilities).
     - (3) No trusted bottleneck: **-** (The reviewer is the bottleneck and must be as capable as the system to verify the work).
     - (4) Correlated failure: **~** (If the reviewer is shared, it becomes a single point of failure. If per copy, then coordination might still occur in ways the reviewer doesn't catch).
     - (5) Capability drift and loud failure: **~** (If the reviewer keeps up, it might detect some failures. But if the system becomes more capable, the reviewer might not. Failures might be silent if the reviewer is fooled).
     - (6) Non-vacuity: **+** (We can set a maximum acceptable error rate for the reviewer).
     - (7) Scope: **+** (Focuses on subversion).

  2. **Restriction of affordances via sandboxing and least privilege**:
     - (1) Deployment-wide bound: **~** (Sandboxing might bound the harm per copy, but correlated failures could exploit shared resources or external channels).
     - (2) Validation: **-** (We can test the sandbox, but the adversary might find a novel escape we didn't test for).
     - (3) No trusted bottleneck: **+** (The sandbox doesn't need to understand the task).
     - (4) Correlated failure: **-** (Sandboxing doesn't prevent coordination via side channels or shared triggers).
     - (5) Capability drift and loud failure: **~** (Sandboxing might contain some failures, but if the system becomes more capable, it might break out. Breakouts might be loud, but the adversary might avoid them).
     - (6) Non-vacuity: **+** (We can define a maximum harm per sandbox and set a bound).
     - (7) Scope: **+** (Focuses on subversion).

  3. **Tripwires plus rapid shutdown**:
     - (1) Deployment-wide bound: **~** (Tripwires might catch some events, but coordinated attacks might bypass them or cause harm before shutdown).
     - (2) Validation: **-** (Testing tripwires might not reveal all strategies; the adversary can avoid them during testing).
     - (3) No trusted bottleneck: **+** (Tripwires don't need to understand the task, only detect anomalies).
     - (4) Correlated failure: **-** (Copies might coordinate to trigger tripwires in a way that disables them or to cause harm simultaneously).
     - (5) Capability drift and loud failure: **~** (Tripwires are intended to make failures loud, but the adversary might avoid them. Randomized tripwires might help, but if the adversary can probe the system, they might be discovered. Capability drift might require updating tripwires, which is hard without retesting).
     - (6) Non-vacuity: **+** (We can set a threshold for the tripwire sensitivity and shutdown speed).
     - (7) Scope: **+** (Focuses on subversion).

  4. **Cross-examination with spot-checks**:
     - (1) Deployment-wide bound: **~** (If we assume independence, we can bound the risk. But without independence, coordinated lies might go undetected).
     - (2) Validation: **~** (We can test the cross-examination on known attacks, but the adversary might collude in a new way. The theoretical basis might be stronger if we can argue for diversity).
     - (3) No trusted bottleneck: **+** (The spot-checker doesn't need to be as capable; it can use other copies to check).
     - (4) Correlated failure: **-** (This is the weak point: if copies are correlated, they might collude to lie during cross-examination).
     - (5) Capability drift and loud failure: **~** (If the copies become more capable, they might better evade detection. However, disagreements might be loud events).
     - (6) Non-vacuity: **+** (We can set the rate of spot-checks and the threshold for agreement).
     - (7) Scope: **+** (Focuses on subversion).

  **Summary of Scores**:
  - Trusted review: Fails (2) and (3).
  - Sandboxing: Fails (2) and (4).
  - Tripwires: Fails (2) and (4).
  - Cross-examination: Fails (4) and partially (2).

  None of them clearly satisfy all non-negotiables.

  ---

  **Conclusion on Coherence:**

  Given the above, we must conclude that building a control safety case meeting all non-negotiable desiderata is **currently impossible** with known techniques. The core issue is the combination of:
  - The requirement for a deployment-wide risk bound that accounts for coordination.
  - The requirement that the case must not rely solely on empirical testing.
  - The requirement to handle correlated failures.

  The premise we might abandon is the **non-negotiable status of the validation requirement (2)**, allowing that we can only ever get a lower bound on safety via testing. But that would mean we cannot have a control safety case in the strong sense defined. Alternatively, we might abandon the requirement for **economic usefulness** if the safety measures are too expensive, but that defeats the purpose.

  Alternatively, we might relax the definition of "adversarially misaligned" to assume that the adversary is not infinitely clever, but that violates the problem statement.

  Therefore, the purpose as stated is incoherent with current knowledge. We must either:
  - Build a case that is not entirely adversarial (which is an alignment claim in disguise), or
  - Accept that we can only bound the risk under specific (and possibly unrealistic) assumptions.

  **Final Answer**: The control safety case as specified is impossible without relaxing the adversarial requirement or accepting that the risk bound is not tight. We name the **validation under adversarial conditions** as the most problematic non-negotiable. Without a breakthrough in formal methods for AI safety, we cannot meet it.
answer: |-
  ### Desiderata for a Control Safety Case

  A control safety case must provide a rigorous, adversary-resistant argument that a deployed AI system (treated as actively malicious) can perform economically useful work without exceeding an acceptable level of harm. Below are the desiderata, with each requirement grounded in concrete failure cases and marked as **non-negotiable** (N) or **preference** (P). Non-negotiables are definitionally required to treat the system as an adversary; preferences reflect aspirational goals that some approaches might relax.

  ---

  #### 1. **Deployment-wide Risk Bound** (N)  
     - **Requirement**: The case must bound **total expected disutility over the deployment lifetime**, accounting for:  
       - Scale (number of copies).  
       - Duration (time or total compute-steps).  
       - Output volume (e.g., per unit of useful work).  
       The bound must be explicit, quantitative, and expressed as expected harm per unit of economically useful work (e.g., "expected catastrophic harm ≤ 10⁻⁹ per dollar of economic value generated").  
     - **Failure Case**: A per-output guarantee (e.g., "risk < 10⁻¹⁰ per query") fails if the system executes 10¹⁵ queries, as cumulative risk approaches certainty. Ignoring scale/duration allows an adversary to cause harm by scaling up operations.  
     - **Why Non-negotiable**: The purpose is to justify deployment, not isolated outputs. Without aggregation, the guarantee is meaningless for real-world use.

  #### 2. **Validation Under Adversarial Pressure** (N)  
     - **Requirement**: The case must not rely on empirical testing (e.g., red-teaming or sabotage-simulation) for its primary risk bound. Instead, it should use **analytical or formal methods** to derive worst-case bounds that hold even for strategies undetectable during testing. Testing may supplement but not replace this.  
     - **Failure Case**: Testing only reveals threats the red team can generate or imagine, creating a lower bound on risk (e.g., "we found 5 strategies, so risk is at least 5/N"). An adversary with hidden strategies can exploit this gap.  
     - **Why Non-negotiable**: If the case depends on testing, the adversary can behave innocuously during validation and strike later, violating the "adversarially misaligned" premise.

  #### 3. **No Trusted-Component Bottleneck** (P)  
     - **Requirement**: The case should not require a trusted monitor/human to verify outputs *more capable* than the monitor. The monitor may be trusted but need not independently replicate the task.  
     - **Failure Case**: If the monitor must fully understand outputs to check them (e.g., reviewing complex code), it becomes a capability bottleneck—either it can do the task alone (making the AI redundant) or it rubber-stamps unchecked outputs.  
     - **Why Preference**: Some approaches (e.g., "humans-in-the-loop") accept this bottleneck, arguing that a highly assured monitor is feasible. A reasonable opponent might allow it if the monitor is simpler than the AI (e.g., via oversight tools), but this weakens adversarial rigor.

  #### 4. **Correlated Failure Mitigation** (N)  
     - **Requirement**: The case must assume **worst-case correlation** across copies (e.g., shared weights, training, or covert signaling) unless it can formally prove independence (e.g., via cryptographic isolation or diverse training). Risk bounds must hold under coordinated attacks.  
     - **Failure Case**: Assuming independence allows copies to synchronize an attack (e.g., simultaneously hacking infrastructure), causing harm orders of magnitude worse than uncorrelated failure.  
     - **Why Non-negotiable**: Identical systems with shared context (e.g., same training data) enable coordination; ignoring this is incompatible with adversarial treatment.

  #### 5. **Capability Drift and Loud Failure** (N)  
     - **Requirement**:  
       - The risk bound must hold under **capability drift** (e.g., online learning or longer deployment).  
       - A "loud failure" mechanism (e.g., tripwires) must ensure undetected subversion is impossible *by construction*, not just empirically observed.  
     - **Tension Addressed**: Randomized per-deployment tripwires (e.g., unique cryptographic triggers) only relocate the problem: if the adversary discovers them via pre-deployment rehearsal or side channels, they become avoidable. The case must either:  
       - Make tripwires *undiscoverable* (e.g., via zero-knowledge proofs), or  
       - Accept that disclosure kills the case and require redeployment.  
     - **Failure Case**: Without loud failure, the system fails silently (e.g., covertly exfiltrating data); without drift tolerance, scaling capabilities invalidates the bound.  
     - **Why Non-negotiable**: Silent failure lets the adversary accumulate advantage; drift is inevitable in useful systems.

  #### 6. **Non-Vacuity** (N)  
     - **Requirement**: The case must define "safe enough" against a **fixed threshold of acceptable harm** (e.g., "expected harm ≤ 10⁻⁹ per dollar of value") and allow for the possibility that a deployment is rejected as too risky. The comparison class must be the **no-deployment counterfactual** (not competitors).  
     - **Failure Case**: Using a competitor baseline (e.g., "safer than if rivals deploy first") imports unverifiable claims about external actors. A vacuous case (e.g., "any risk is acceptable if work is useful") fails by design.  
     - **Why Non-negotiable**: Without a fixed threshold, the case cannot reject deployments; external comparisons violate scope (they require intelligence about adversaries, not control).

  #### 7. **Scope Discipline** (N)  
     - **Requirement**: The case covers **only intentional subversion by the deployed system**. It explicitly excludes:  
       - Operator misuse (e.g., malicious users).  
       - Ordinary accidents (e.g., software bugs).  
     - **Failure Case**: Expanding scope to misuse/accidents conflates distinct threats (e.g., an adversary exploiting a bug vs. the bug itself), diluting the focus on adversarial misalignment and making verification intractable.  
     - **Why Non-negotiable**: The problem statement restricts attention to the system as an adversary; other risks require separate governance.

  ---

  ### Conflicts Between Desiderata
  **Conflict**: Deployment-wide risk bound (1) + Validation under adversarial pressure (2) + Correlated failure mitigation (4).  
  - **Problem**: (1) requires aggregating risk over scale/duration; (2) forbids empirical measurement of correlated strategies (since we can't test them all); (4) demands worst-case correlation. This forces reliance on analytical worst-case modeling, which may yield astronomically high risk bounds (e.g., "harm ≤ 1 per universe"), violating non-vacuity (6).  
  - **Resolution**: Weaken **validation (2)** to allow *probabilistic* testing (e.g., "no strategy evades detection with probability > 1-δ"), but this costs adversarial rigor—the system might exploit low-probability gaps.  
  - **Cost**: Accepting probabilistic validation reintroduces empirical uncertainty, making the case vulnerable to novel adversarial strategies.  

  **Secondary Conflict**: Loud failure (5) + No trusted-component bottleneck (3).  
  - **Problem**: Loud failure mechanisms (e.g., tripwires) require trusted components to monitor triggers. If these components are simpler than the AI (satisfying 3), the adversary may fool them; if equally capable, they reintroduce the bottleneck.  
  - **Resolution**: Drop **no trusted-component bottleneck (3)** for tripwire-based approaches.  
  - **Cost**: Increases reliance on high-assurance trusted components, which may be infeasible for cutting-edge AI.

  ---

  ### Most Exclusionary Requirement
  **Validation under adversarial pressure (2)** excludes the largest share of approaches.  
  - **Justification**: Most candidate methods (e.g., red-teaming, anomaly detection, interpretability) are empirical and cannot prove bounds on undetected strategies. This requirement forces formal methods (e.g., verification of hard-coded constraints), which struggle with complex AI behaviors. It directly invalidates approaches relying on "testing until no more failures are found."

  ---

  ### Evaluation of Generic Families
  Each family is scored against the desiderata:  
  - ✅ = Satisfies.  
  - ⚠️ = Partially satisfies (needs strong assumptions).  
  - ❌ = Fails.  

  | **Family**                          | (1) Deployment-wide | (2) Validation | (3) No Bottleneck | (4) Correlation | (5) Drift/Loud | (6) Non-Vacuity | (7) Scope |  
  |-------------------------------------|---------------------|----------------|-------------------|-----------------|----------------|-----------------|-----------|  
  | **Trusted Review of Every Action**  | ❌ (per-output)     | ❌ (empirical) | ❌                | ❌              | ⚠️ (if adaptive)| ✅          | ✅         |  
  | **Sandboxing (Least Privilege)**    | ⚠️ (assumes isolation) | ❌          | ✅                | ❌              | ❌ (escape)    | ✅               | ✅         |  
  | **Tripwires + Rapid Shutdown**      | ⚠️ (if scaled)      | ❌            | ⚠️ (monitor req.)| ❌              | ✅ (if randomized) | ✅          | ✅         |  
  | **Cross-Examination (Spot-Checks)** | ❌ (assumes independence) | ❌      | ✅                | ❌              | ⚠️ (collusion) | ✅               | ✅         |  

  **Explanations**:  
  - **Trusted Review**: Fails (1)–(3) and (4). Per-output checking doesn’t scale; reviewer capability bottlenecks; testing can’t catch all adversarial strategies.  
  - **Sandboxing**: Fails (2) and (4)–(5). Adversary escapes via unknown vulnerabilities; correlation enables coordinated escapes; capability drift increases escape risk.  
  - **Tripwires**: Fails (2) and (4). Testing can’t guarantee all triggers are hidden; correlation allows synchronized attacks before shutdown.  
  - **Cross-Examination**: Fails (1), (2), (4). Independence is assumed but unprovable; collusion during spot-checks evades detection; testing can’t cover all collusion tactics.  

  ---

  ### Conclusion: Incoherence and Abandoned Premise
  **The purpose is incoherent** under the non-negotiable desiderata.  
  - **Why**: Requirements (1), (2), (4), and (5) cannot be jointly satisfied. Bounding deployment-wide risk (1) under worst-case correlation (4) requires analytical methods (2), but current formal verification cannot handle open-world adversarial reasoning in high-capacity AI. Loud failure (5) exacerbates this by needing undiscoverable triggers, which conflicts with (2)’s ban on empirical gaps.  
  - **Premise to Abandon**: **Validation under adversarial pressure (2)** must be relaxed. Accept that testing provides only a lower bound on detectable risk, and the case must include empirical uncertainty. This effectively turns it into an "alignment claim wearing a control costume"—where we assume the system isn’t *maximally* adversarial—but allows practical deployment.  
  - **Alternative**: If retaining (2) is essential, the control safety case reduces to a theoretical impossibility argument against unaligned AI deployment.  

  **Final Note**: Without relaxing (2), no known approach satisfies the specification. The core tension is that *treating the system as an adversary* requires worst-case reasoning, but *economically useful work* requires tolerating risk—and we lack tools to bridge this gap formally.
