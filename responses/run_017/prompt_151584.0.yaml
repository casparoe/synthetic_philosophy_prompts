prompt: |-
  I keep bumping into the same argument shape in places that otherwise have nothing to do with each other, and I can't find out what it's called — or whether it's really one shape at all. (Maths grad, writes software now, reads this stuff on the side, so sorry if I'm reinventing something with a standard name.)

  Here's the move. Someone puts forward a deliberately modest principle: not that everything is actually known, just that for any truth you pick, it's possible — in some stretched, idealised sense, not by us and not now — that somebody could know it. Then somebody else shows that if you add two things nobody would think of denying, namely that being in a position to know a conjunction means being in a position to know each half of it, and that you can't know something that isn't true, plus the plain fact that some truth is in fact unknown, the modest principle turns out to collapse into the wild one: every truth is known. The 'merely possible' claim and the 'actual' claim were the same claim all along.

  Two things I noticed that I can't place. I tried running the same derivation with 'could be proved' and with 'could be correctly believed' and it seemed to go through just the same, but with plain belief — every truth is such that someone could believe it — nothing happened at all. So I think the guarantees-truth bit is what's doing the work, but I'd like that confirmed or corrected. Also, weakening the 'possible' didn't seem to rescue anything: even reading possible as just 'not logically ruled out', the collapse still came out.

  Does this shape have a name? I first met it in an argument about whether every truth is knowable, but it feels more general than that case, and I've seen both 'modal collapse' (which seems to be about all possibilities becoming necessary?) and 'triviality result' used for what might be quite different things. I don't just want a label though — I want to know what the moving parts are, how this differs from an ordinary reductio or from the oddity of saying 'p, but I don't know that p', and where the boundary lies: which principles fall to it, which don't, and why. And if there genuinely isn't a term for the shape, give me one, with a definition and the cases that clearly count as in or out.
reasoning: |-
  We are dealing with a logical argument pattern that appears in various contexts, most famously in the "knowability paradox" (also known as Fitch's paradox). The pattern shows that from the seemingly modest principle that every truth is knowable (i.e., possibly known) and some apparently uncontroversial principles about knowledge, we can derive the strong and implausible conclusion that every truth is actually known.

  Let me break down the argument:

  1. **The Modest Principle (Knowability)**: For every truth p, it is possible that p is known. In symbols: 
     \[
     \forall p (p \to \Diamond K p)
     \]
     Here, \( K p \) means "p is known by someone at some time" (or in some idealized sense), and \( \Diamond \) is a modal operator meaning "it is possible" (interpreted in a suitable sense, e.g., metaphysical or epistemic possibility).

  2. **Two Uncontroversial Principles**:
     a. **Factivity of Knowledge**: If a proposition is known, then it is true.
        \[
        \forall p (K p \to p)
        \]
     b. **Distribution over Conjunction**: If a conjunction is known, then each conjunct is known.
        \[
        \forall p \forall q (K (p \land q) \to (K p \land K q))
        \]

  3. **A Plain Fact**: There exists some truth that is unknown. Let q be such a truth. So we have:
     \[
     q \land \neg K q
     \]

  Now, the argument runs as follows:

  Consider the unknown truth: let \( q \) be a proposition such that:
     \[
     q \land \neg K q
     \]
  This is our "plain fact".

  By the modest principle (knowability) applied to this conjunction, we get:
     \[
     (q \land \neg K q) \to \Diamond K (q \land \neg K q)
     \]

  So, we have:
     \[
     \Diamond K (q \land \neg K q)
     \]

  By the distribution principle, if \( K (q \land \neg K q) \) were true, then we would have:
     \[
     K q \land K (\neg K q)
     \]

  By factivity, \( K (\neg K q) \) implies \( \neg K q \), so we have:
     \[
     K q \land \neg K q
     \]

  This is a contradiction. Therefore, the assumption that \( K (q \land \neg K q) \) is possible leads to a contradiction. Hence, we must reject the possibility of knowing the conjunction, i.e., 
     \[
     \neg \Diamond K (q \land \neg K q)
     \]

  But the modest principle (knowability) requires that every truth is possibly known, so we must reject the existence of the unknown truth q. In other words, there is no unknown truth, meaning every truth is known.

  This is the paradox: the modest principle (every truth is knowable) plus the two principles and the existence of an unknown truth leads to the conclusion that every truth is known. But that conclusion is absurd. So one of the premises must be rejected.

  Now, to your observations:

  1. **Why does it work for knowledge and proof, but not for mere belief?**
     The key is the factivity condition. For knowledge and proof, we have:
        - If you know p, then p is true.
        - If p is proved, then p is true (assuming a sound proof system).

     For correct belief, if we interpret "correct belief" as belief in a true proposition, then note that the belief must be correct, so we have factivity: if one correctly believes p, then p is true.

     However, for plain belief (without the requirement of truth), we do not have factivity. So let's try the argument with plain belief.

     Modest principle: For every truth p, it is possible that someone believes p. 
        \[
        \forall p (p \to \Diamond B p)
        \]
     where \( B p \) means "someone believes p".

     We do not have factivity for belief: \( B p \to p \) is not necessarily true.

     Now, consider the unknown truth (but note: we are not requiring that belief implies truth, so we cannot use the same contradiction). Let q be a truth that is not believed (by anyone). So we have:
        \[
        q \land \neg B q
        \]

     By the modest principle:
        \[
        \Diamond B (q \land \neg B q)
        \]

     Now, if we assume that belief distributes over conjunction (which is plausible: if one believes a conjunction, then one believes each conjunct), then we have:
        \[
        B (q \land \neg B q) \to (B q \land B (\neg B q))
        \]

     But note that \( B (\neg B q) \) does not imply \( \neg B q \) because belief is not factive. So we don't get a contradiction. Hence, the argument does not go through.

     So the factivity condition is essential.

  2. **Weakening the modality**:
     You mentioned that even if we interpret "possible" as "not logically ruled out", the collapse still happens. That is because the argument uses the possibility operator in a way that only requires that the scenario is not self-contradictory. But in the above derivation, we showed that \( K (q \land \neg K q) \) leads to a contradiction. Therefore, it is logically impossible. So if we interpret \( \Diamond \) as logical possibility, then the modest principle would require that \( K (q \land \neg K q) \) is logically possible, but we have shown it leads to a contradiction, so it is not logically possible. Hence, the modest principle must be false.

     Thus, the collapse still occurs.

  **What is the name of this argument shape?**

  The most famous instance is **Fitch's paradox** (or the knowability paradox). The general shape is a **modal collapse** argument, but note that modal collapse usually refers to the idea that in certain metaphysical systems, the distinction between necessity and possibility collapses (e.g., in Spinoza). However, in this context, we are showing that the possibility of knowing every truth collapses into the actuality of knowing every truth.

  The pattern can be seen as a **reductio ad absurdum** of the knowability principle (by showing that it leads to the absurd conclusion that all truths are known) given the existence of an unknown truth.

  But note: the pattern is more general. It applies to any operator O that is:
     - Factive: \( O p \to p \)
     - Distributes over conjunction: \( O (p \land q) \to (O p \land O q) \)
     - And for which we have an instance of the form \( p \land \neg O p \) (which we call an "O-unknown truth")

  Then the principle \( \forall p (p \to \Diamond O p) \) leads to a contradiction, so either the principle must be rejected or the existence of an O-unknown truth must be denied.

  Thus, the pattern might be called the **Fitch-style paradox** or **Fitch's argument pattern**.

  **Label and Definition**

  I propose the term **Fitch-style collapse** for this argument pattern.

  **Definition**: A Fitch-style collapse occurs when we have:
     - A factive operator O (i.e., \( O p \to p \) for all p).
     - The operator O distributes over conjunction (i.e., \( O(p \land q) \to (O p \land O q) \)).
     - The existence of at least one O-unknown truth (i.e., there exists p such that \( p \land \neg O p \)).

  Then, the principle that every truth is O-possible (i.e., \( \forall p (p \to \Diamond O p) \)) leads to a contradiction, and hence the negation of the existence of any O-unknown truth (i.e., \( \forall p (p \to O p) \)).

  **Boundary Conditions**:

  The argument works for operators that are both factive and distributive over conjunction. Examples include:
     - Knowledge (as in Fitch's original)
     - Proof (in a sound formal system)
     - Correct belief (if we define correct belief as belief in a true proposition and require that the belief is correct, then it becomes factive, and if we assume that if one correctly believes a conjunction then one correctly believes each conjunct, then the distribution holds)

  It does not work for non-factive operators (like plain belief) because the contradiction step fails.

  It also does not work if the operator does not distribute over conjunction. For example, if we had an operator that does not distribute over conjunction, then even if it is factive, we might not get the contradiction. However, note that for knowledge and proof, distribution is very natural.

  **How is this different from the Moore sentence?** 

  The Moore sentence is of the form "p and I don't believe that p". This sentence cannot be consistently believed by the same agent at the same time because if the agent believes it, then they believe p and they believe that they don't believe p, which leads to a contradiction in the agent's beliefs. But note: the Moore sentence might be true (if p is true and the agent does not believe p). 

  The Fitch-style collapse is similar in that it uses a sentence of the form "p and it is not known that p". The difference is that the Fitch argument uses a modal operator (possibility) and shows that the knowability principle leads to the impossibility of such a sentence being known (and hence, by the knowability principle, such a sentence cannot be true). The Moore paradox is about the psychological state of an agent, while Fitch's paradox is about the logical structure of knowledge and possibility.

  **Conclusion**:

  The argument pattern is known as **Fitch's paradox** or the **knowability paradox**. The general shape is a modal collapse argument for factive, conjunction-distributive operators. The key moving parts are factivity and distribution over conjunction. Without factivity, the argument fails. The modality can be interpreted in various ways (as long as it includes logical possibility) because the contradiction shows that the statement in question is logically impossible.

  **Final Label**: I would call this pattern **Fitch's proof of the knowability paradox**. For the general shape, we might say it is an example of a **factive operator collapse** or **Fitch-style collapse**. But since the term "Fitch's paradox" is well-established, that is the standard name.

  If you encounter this pattern in other contexts (with operators other than knowledge), you can describe it as a Fitch-style argument for that operator.
answer: |-
  ### The Argument Shape: Fitch-Style Collapse

  Your description perfectly captures a recurring logical pattern known as **Fitch's paradox of knowability** (or simply **Fitch's paradox**), named after philosopher Frederic Fitch who published it in 1963. However, the core structure is more general than just knowledge—it applies to any factive, distributive operator. I'll break it down step by step, address your observations, define the boundaries, and give it a precise label.

  ---

  ### **The Core Argument Structure**
  The pattern involves three components:
  1. **A Modest Principle (Universal Knowability/Provability/Believability)**:  
     For any truth \( p \), it is *possible* (in an idealized sense) that \( p \) is known/proved/correctly believed.  
     Formally: \(\forall p \left( p \to \Diamond K p \right)\), where:
     - \(K\) is an operator (e.g., "is known", "is proved", "is correctly believed"),
     - \(\Diamond\) is a possibility operator (interpreted as logical, metaphysical, or epistemic possibility).

  2. **Uncontroversial Premises**:  
     - **Factivity**: \(K p \to p\) (If \(p\) is known/proved/correctly believed, then \(p\) is true).  
     - **Distribution over Conjunction**: \(K(p \land q) \to (K p \land K q)\) (Knowing/proving a conjunction implies knowing each conjunct).  
     - **Existence of an Unknown Truth**: \(\exists p \left( p \land \neg K p \right)\) (Some truth is not actually known/proved/correctly believed).

  3. **The Collapse**:  
     Combining these leads to a contradiction, forcing the conclusion that **all truths are known/proved/correctly believed** (\(\forall p \left( p \to K p \right)\)).  
     **Proof sketch**:  
     - Let \(q\) be an unknown truth: \(q \land \neg K q\).  
     - By the modest principle: \(\Diamond K(q \land \neg K q)\).  
     - If \(K(q \land \neg K q)\) were true, distribution implies \(K q \land K(\neg K q)\).  
     - Factivity of \(K\) implies \(K(\neg K q) \to \neg K q\), so \(K q \land \neg K q\)—a contradiction.  
     - Thus, \(K(q \land \neg K q)\) is impossible (\(\neg \Diamond K(q \land \neg K q)\)).  
     - But the modest principle requires \(\Diamond K(q \land \neg K q)\), so the only escape is to deny \(\exists p (p \land \neg K p)\). Hence, all truths are known.

  ---

  ### **Your Observations Explained**
  1. **Why it works for "could be proved" or "could be correctly believed" but not plain belief**:  
     - **Factivity is essential**. The operator \(K\) must satisfy \(K p \to p\).  
       - *Proof/provability*: If a formal system is sound, "\(p\) is proved" implies \(p\) is true.  
       - *Correct belief*: "Correctly believed" implies truth by definition.  
       - *Plain belief*: "Believed" has no factivity—you can believe false things. Without \(B p \to p\), the contradiction fails.  
     - **Distribution over conjunction** is also necessary but usually uncontroversial for these operators (e.g., knowing a conjunction entails knowing each conjunct).

     Your test confirms this:  
     - With factive operators (knowledge, proof, correct belief), the collapse occurs.  
     - With non-factive operators (plain belief), \(\Diamond B(q \land \neg B q)\) causes no contradiction, as \(B(\neg B q) \not\to \neg B q\). The argument stalls.

  2. **Why weakening "possible" doesn't rescue it**:  
     The argument relies only on **logical possibility** (non-contradiction).  
     - \(\Diamond\) is interpreted as "logically possible" (i.e., not self-contradictory).  
     - But \(K(q \land \neg K q)\) is *logically impossible* because it implies \(K q \land \neg K q\), a contradiction.  
     - Thus, even the weakest reading of \(\Diamond\) (logical possibility) suffices for the collapse. Stronger notions (e.g., practical possibility) make the modest principle even harder to defend.

  ---

  ### **What This Shape Is Called**
  - **Standard Name**: **Fitch's paradox** (specifically for knowledge).  
  - **Generalized Name**: **Fitch-Style Collapse** or **Knowability Collapse**.  
    I recommend **Fitch-Style Collapse** as a general term, defined as:  
    > *Any argument where a principle of universal possibility (\(\forall p (p \to \Diamond K p)\)), combined with factivity and distribution for \(K\), plus an unknown truth, collapses into universal actuality (\(\forall p (p \to K p)\)).*

  ---

  ### **Boundaries: What Falls Under This Shape and Why**
  | **Principle**                     | **Vulnerable?** | **Why?**                                                                 |
  |-----------------------------------|-----------------|--------------------------------------------------------------------------|
  | Knowledge ("could be known")      | Yes             | \(K\) is factive and distributive.                                       |
  | Provability ("could be proved")   | Yes             | Sound proof systems are factive and distributive.                        |
  | Correct belief ("could be correctly believed") | Yes | Correct belief implies truth and distributes.                        |
  | Plain belief ("could be believed")| **No**          | Lacks factivity: \(B p \not\to p\).                                     |
  | Justified true belief             | **No**          | Justified true belief is factive, but justification may not distribute over conjunction (depends on the theory). |
  | Truth ("is true")                 | **No**          | The operator \(T p = p\) is factive, but \(T(p \land q) \to (T p \land T q)\) holds trivially. However, \(\forall p (p \to \Diamond T p)\) is tautological (truths are always possibly true), so no collapse occurs. |
  | Necessary truth                   | **No**          | Modest principle might be \(\forall p (p \to \Diamond \Box p)\), but no analogous contradiction arises. |

  **Why some operators escape**:  
  - Non-factive operators (e.g., plain belief) avoid contradiction.  
  - Operators without distribution (e.g., some interpretations of "justified belief") might avoid collapse, but distribution is intuitive for knowledge/proof.  
  - Trivial operators (e.g., truth itself) don't generate a paradox because the modest principle doesn't conflict with unknown truths.

  ---

  ### **How This Differs from a Reductio or Moore's Paradox**
  - **Ordinary Reductio**:  
    This *is* a reductio, but one with a specific structure: it exploits a **fixed-point sentence** (\(q \land \neg K q\)) to generate self-reference. Unlike generic reductios, it requires factivity and distribution.
    
  - **Moore's Paradox ("p, but I don't believe p")**:  
    Moore's paradox is about *assertion* or *belief*: asserting "\(p\) but I don't believe \(p\)" is pragmatically paradoxical. Fitch-style collapse is distinct:  
    - **Scope**: Moore is about belief and assertion; Fitch is about factive operators and modality.  
    - **Self-reference**: Both use sentences like \(q \land \neg K q\), but Fitch leverages possibility (\(\Diamond\)) to force a collapse.  
    - **Outcome**: Moore shows a psychological/pragmatic inconsistency; Fitch shows a logical incompatibility between possibility and factivity.

  ---

  ### **Key Takeaways**
  - **The Moving Parts**:  
    1. A **factive, distributive operator** \(K\).  
    2. A **modest possibility principle** (\(\forall p (p \to \Diamond K p)\)).  
    3. An **unknown truth** (\(\exists p (p \land \neg K p)\)).  
    Together, these imply the **absurd conclusion** that all truths are known (\(\forall p (p \to K p)\)).

  - **Why It Matters**:  
    This isn't just a trick—it has serious implications. In epistemology, it challenges **anti-realism** (which holds all truths are knowable). In logic, it shows how benign principles can interact catastrophically. In computer science, it resembles **Gödel-like incompleteness** (e.g., the existence of unprovable truths in formal systems).

  If you encounter this pattern again, you're seeing **Fitch-Style Collapse**—a hallmark of how possibility and factivity can turn moderation into extremity.
