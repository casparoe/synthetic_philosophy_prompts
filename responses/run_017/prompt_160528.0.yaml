prompt: |-
  Im writing a short paper on Black's two spheres and want to check that my argument is airtight before I build on it. The setup: a universe containing nothing but two perfectly smooth iron spheres, exactly alike in size, composition and temperature, a couple of miles apart, with everything perfectly symmetric. They share every property but they are still two things — so Leibniz's identity of indiscernibles (if two things share all their properties, they are identical) is just false, and I dont see whats left to argue about.

  My tutor says the argument is question-begging, because a Leibnizian can reply that such a universe simply isn't possible, PII being a necessary truth. That sounds like a cop-out: you cant defend a principle by declaring counterexamples impossible by fiat, can you? Two questions then. First, how do I make that objection go away — is it enough to restrict PII to intrinsic, non-relational properties only, so the obvious reply (each sphere is two miles from a *different* sphere, so they do differ relationally) never gets off the ground? Second, I then want to use the result to argue that two electrons in exactly the same quantum state are still numerically distinct individuals, differing by a bare haecceity. Does that follow, or do I need an extra step?
