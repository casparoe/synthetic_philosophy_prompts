prompt: |-
  I am on a small working group that has been asked to draft the consent and succession rules that would govern a gradual neural replacement procedure: the subject's neurons are swapped, a few thousand at a time, for prosthetic units tuned to reproduce their input-output behaviour, so that at no individual step is there a moment at which anyone would want to say the person has gone out of existence, while at the end of the process none of the original tissue remains. The lawyers on the group do not want a verdict on whether the procedure preserves the person. They want to know what a theory of personal identity would have to be able to do in order to be usable as the basis for a statute — and they want to know that before anyone starts citing their favourite theory at them. So the question I am putting to you is this: what are the desiderata?

  Fix the purpose as narrowly as that: a theory good enough to be written into rules that will be applied by registrars, judges and clinicians to people who have never read philosophy and who may reasonably disagree about the metaphysics. Given that purpose, give me the requirements such a theory must meet — the cases it has to return a verdict on, the distinctions it is not allowed to collapse, the results from neuroscience and from ordinary biology that it cannot contradict — and, for each requirement, the case or consideration that makes it a requirement rather than a taste. I want the reasoning to sit in the criteria, not in a scorecard.

  For orientation, here are the cases I keep coming back to, which you should use but need not be limited by. First, the cold swap: a prosthetic unit is trained in advance on a recording of the unit it replaces and runs from that recording rather than from live input for its first weeks, so behaviour is seamless while the causal link to the surrounding tissue is not what it normally is. Second, the same total replacement carried out over twenty years and over a single afternoon under anaesthetic; I want to know whether a theory may let the rate of replacement change the verdict, and if it may, what work the rate is doing. Third, the dormant duplicate: a complete prosthetic version is built before the procedure begins and then kept inert and unopened while the biological original is gradually replaced, and is destroyed at the end; whether the mere existence of an unused duplicate can matter seems to me the sharpest test I have. Fourth, the re-implantation: the removed tissue is preserved, kept non-functional, and then re-implanted in reverse order after the prosthetic system has been running for some months, so that from a certain date two candidates present themselves. Fifth, the thinning, in which each unit is replaced by two units that share its job between them. And sixth, the institutional questions the statute actually has to answer: does the post-procedure candidate own the pre-procedure person's house, answer for that person's debts and crimes, remain married, and count as a victim of homicide if switched off — and is the theory permitted to answer yes to some of these and no to others, or must it be all-or-nothing?

  To that last point, please build in the case that most interests me: a subject signs a directive before the procedure instructing the team to halt if at any stage her capacity to recognise her family falls below a stated threshold; at two-thirds replacement she revokes it and demands that the process continue. A theory that cannot say anything about which of those two expressions of will governs is not usable for my purpose, and I would like you to press on whether any theory can say it without assuming what is in dispute.

  I also want your view on which of the demands usually made in this area are genuine desiderata and which are the prejudices of one camp: the demand for a determinate yes-or-no answer, the demand that the theory invoke no further fact beyond the physical and functional ones, the demand that it vindicate the first-personal conviction of the person who is about to undergo the procedure, the demand that it treat the biological and the prosthetic on a par. And I suspect at least one pair of genuine requirements cannot be jointly satisfied — in particular the requirement that no single swap be pivotal, which the gradualness of the procedure seems to force, and the requirement that the verdict track something that could be lost by degrees rather than all at once. If you think that pair is satisfiable, say how; if you think a different pair is the trouble, say which. Then tell me, in a sentence or two, which single requirement does the most work in excluding the theories you are aware of, and which theory it excludes.

  Close by telling me which requirement you would abandon first if forced, and what argument or new case would make you abandon it — I want to know where your reasoning is most likely to fail, not just where you land. Do not cite anything or point me to a literature; I need to be able to use this without a library. And write it as continuous prose for a memo I am already assembling — no headings, no bullet points, no bold, no tables.
reasoning: |-
  Okay, the user is part of a working group drafting consent and succession rules for a neural replacement procedure. They need a theory of personal identity that can be written into law, applied by non-philosophers like judges and clinicians. The key is to outline the requirements such a theory must meet without endorsing any specific philosophical stance.

  First, the user provided several test cases: cold swap, varying replacement rates, dormant duplicate, re-implantation, thinning, and institutional questions. Each case challenges different aspects of identity. The lawyers want to avoid metaphysical debates and focus on practical legal needs. So the theory must handle real-world applications like property rights, criminal responsibility, and medical directives.

  The main challenge is balancing gradual replacement with the need for binary legal outcomes. For example, each swap shouldn't be pivotal, yet the law requires clear yes/no answers for things like debt ownership. This tension is critical. Also, the directive revocation scenario tests whether the theory can prioritize one expression of will over another without assuming identity.

  The dormant duplicate case is particularly sharp. If a duplicate exists but is never activated, does it affect the original's continuity? A usable theory must clarify that unused duplicates don't disrupt identity, addressing potential existential concerns without unnecessary complexity.

  Another key point is rate sensitivity. Replacement speed might intuitively affect identity (slow vs. fast), but the theory must specify if and why rate matters. For instance, rapid replacement under anesthesia might disrupt psychological continuity differently than a slow, conscious process. The theory needs to articulate functional criteria that make rate relevant, like cognitive coherence.

  The re-implantation scenario creates two candidates. Here, the theory must provide criteria to determine which entity holds the original identity, likely based on functional continuity rather than biological material. This ties into institutional questions—whether identity is all-or-nothing or can be partial. The theory should allow for graduated attributes (e.g., responsibility might persist while victimhood doesn't) but must clarify the basis for such distinctions.

  The user's directive case is crucial. If a patient revokes a prior directive mid-procedure, the theory must decide which instruction is valid. This requires assessing current psychological states versus past intentions without presupposing identity. A viable theory might prioritize present capacity while respecting prior commitments, but it's tricky without circular reasoning.

  Assessing common demands: Determinacy is necessary for law but challenging for gradual processes. Physical/functional parsimony is practical but must accommodate edge cases. First-person conviction is important for consent but not infallible. Biological-prosthetic parity is desirable but may not hold in all cases (e.g., cold swap).

  The toughest conflict is between gradualism (no single swap matters) and the need for a threshold where identity changes or splits. This might be unsolvable, forcing a pragmatic compromise—perhaps defining a point of no return based on loss of key cognitive functions.

  The requirement that excludes most theories is probably the need to handle dormant duplicates without invoking non-physical factors. Theories relying on soul or essence fail here; even psychological continuity theories struggle if the duplicate has the same potential.

  If forced to abandon a requirement, sacrificing strict biological-prosthetic parity might be necessary. Cases like the cold swap, where functional mimicry lacks real-time interaction, could justify treating prosthetics differently. This acknowledges that functional equivalence isn't always sufficient for identity, addressing potential gaps in continuity.
answer: |-
  For a theory of personal identity to be codified into practical legal and medical rules governing neural replacement, it must satisfy the following core desiderata, derived from the operational realities and edge cases you’ve outlined. Each requirement is grounded in a specific failure mode or ambiguity that would render the statute unworkable in practice.

  **First, the theory must deliver determinate verdicts for institutional questions (ownership, liability, marriage, victimhood) without presupposing philosophical consensus.** It cannot retreat into "it's complicated" when assigning debts or recognizing spousal rights. A registrar must know whether the post-procedure entity is the legal person who signed the mortgage. The re-implantation case forces this: two claimants emerge, and the law requires a binary answer—only one can inherit the original’s social security number, even if both exhibit psychological continuity. A theory failing here collapses under the weight of property disputes or criminal trials. Crucially, it *must* be allowed to give graduated answers *if* it provides a clear principle for divergence (e.g., "answers for debts if psychological continuity >X%, but is not a homicide victim if biological basis <Y%"). The alternative—insisting all answers align—is unsustainable, as victimhood might hinge on biological cessation while contractual obligations persist through functional continuity.

  **Second, it must adjudicate conflicts between past and present expressions of will without circularity.** Your directive case is pivotal. If the pre-procedure person orders a halt upon family-recognition failure, but the partially replaced entity revokes this, the theory must resolve which will governs *without* first assuming whether the revoking entity *is* the original. It might prioritize the most recent competent expression (requiring a non-identity-based test for competence), or weight directives based on proximity to biological origin, but it cannot require identity to be settled before applying the rule. Failure here paralyzes clinical decisions; clinicians need to know whether to honor the revocation or the directive when capacity appears borderline.

  **Third, it must specify whether replacement *rate* is relevant and why.** A theory cannot vaguely invoke "gradualness" as preserving identity without defining what graduality protects. If replacing neurons over twenty years yields continuity but an afternoon replacement does not, the theory must identify the *functional difference* the rate enables (e.g., continuous consciousness, unbroken causal integration, or adaptive recalibration). If it cannot, rate becomes an arbitrary metaphysical preference. The anaesthetic case tests this: rapid replacement under unconsciousness might sever real-time causal threads a slow process preserves, making rate functionally significant. Conversely, if the theory asserts rate is irrelevant, it must explain why cold swap’s pre-recorded mimicry differs from live integration.

  **Fourth, it must render dormant duplicates irrelevant to the identity of the replaced individual.** The existence of an inert, unused prosthetic duplicate—destroyed unused—cannot nullify the original’s continuity through gradual replacement. If it does, identity becomes hostage to potentialities never actualized, invalidating the entire procedure based on a backup that never interacted with the world. A usable theory must ground identity in the actual causal-functional history of the embodied mind engaging with its environment, not in uninstantiated copies. Failure here invites absurdity: a person could be deemed "dead" because a technician built a spare brain in a vault, even if it never booted.

  **Fifth, it must accommodate the thinning scenario without collapsing into incoherence.** If replacing one neuron with two sharing its function preserves identity, the theory must explain why doubling units doesn’t dilute or split the person. It needs a concept of organizational unity or causal cohesion that survives distributed implementation. If it cannot, the procedure risks creating fragmented or collective minds, invalidating the core premise of seamless transition.

  **Sixth, it must be compatible with neuroscience and biology.** It cannot deny neural function’s role in cognition (contradicting brain injury evidence) or assert vitalist biology (contradicting organ transplantation precedents). Cold swap challenges this: if the prosthetic runs on prerecorded data without real-time synaptic feedback, neuroscience may show disrupted network plasticity. A theory insisting this is irrelevant risks clashing with empirical evidence of how learning and identity intertwine.

  **Regarding common demands:** The call for physical/functional parsimony is a genuine desideratum; invoking non-physical "souls" or undiscovered properties is unverifiable and legally untenable. Demanding first-person conviction as decisive is a prejudice; a person’s belief they’ll survive doesn’t bind creditors if functional continuity is lost. Insisting biological and prosthetic must be treated identically is also a bias; cold swap’s lack of real-time integration may be functionally relevant. The demand for determinacy is essential for law, but the tension lies in achieving it for a gradual process.

  **The critical tension** is between **no single swap being pivotal** (preserving graduality) and **providing a threshold for institutional verdicts** (e.g., when victimhood applies). This pair strains satisfiability. One escape is to allow identity to be "fuzzy" but define *legal* thresholds based on measurable functions (e.g., continuous memory access >95% = liable for debts). Yet this risks decoupling legal identity from metaphysical identity. If forced to abandon a requirement, I’d sacrifice strict **biological-prosthetic parity**. Cold swap suggests functional mimicry alone might not suffice if real-time causal integration is identity-constitutive. If a prosthetic neuron cannot dynamically adapt *during* its integration phase like biological tissue—shown by degraded learning in thinning scenarios—parity fails. The argument against parity gains force if neuroscience confirms that synaptic plasticity in real-time interaction, not input-output matching, underpins persistent selfhood. This concession allows the theory to handle cold swap and thinning while preserving graduality elsewhere, albeit at the cost of treating prosthetics as second-class components until fully integrated. The most exclusionary requirement is **dormant duplicate irrelevance**, which eliminates theories relying on potential continuity or abstract patterns (e.g., some computational theories), as they struggle to explain why the unused duplicate isn’t equally "you."
