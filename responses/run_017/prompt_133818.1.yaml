prompt: |-
  A few months ago I joined the board of a small land trust that manages a couple of thousand hectares of mixed woodland, fen and old grazing land, and I volunteered to take over the reserve's species list. What I found was not a data problem but a conceptual one. Our headline figure — the number of species the reserve exists to protect — shifts by roughly a third depending on which of the published checklists we reconcile against, and almost none of the difference comes from new fieldwork: it comes from disagreements about what a species is in the first place. That number goes into grant applications, into the management plan, and, because protection in our jurisdiction attaches to whatever the official list names at whatever rank it names it, into what we are legally obliged to manage for. So the question has stopped being academic for me, and I have discovered that I do not know what I should be demanding of an answer.

  What I want from you is a specification rather than a survey. Write out the desiderata that an account of species would have to meet for me to trust it as the backbone of such a list — the phenomena it has to accommodate, the cases it has to get right, the distinctions it must not collapse, and the results from biology it is not allowed to contradict — with the case or consideration behind each requirement, not just the requirement.

  Some of what I think belongs on that list, for you to accept, reject or reframe: it must say something usable about lineages with no known sex and about prokaryotes that swap genes sideways; about forms arranged in a chain around a barrier whose two ends meet and do not interbreed, and about cases where the ends do interbreed freely; about new lineages created in a single generation by whole-genome duplication; about organisms like lichens, where the named thing is a consortium of a fungus and a photosynthetic partner, and the same fungus can turn up with different partners; about the continuum of fossils, where boundaries look like artifacts of where we slice; about domesticated forms and their wild relatives that remain fully interfertile; and about the fact that most of the taxa on my list will never have a genome sequenced, only a photograph, a specimen and perhaps a barcode region, so the account has to be usable under severe evidential poverty and has to say what to do when the evidence runs out.

  I also want your view on three things the criteria themselves turn on. First, which of these demands are genuine adequacy conditions and which are prejudices of one constituency — the metaphysician wanting natural kinds with essences, the phylogenetics camp wanting monophyly, the field naturalist wanting something decidable with a hand lens, the practitioner wanting a number that does not move. Second, which pairs of requirements you think cannot be jointly satisfied, and which one of each pair you would keep: I suspect, for instance, that asking for a unit whose counts mean the same thing across fungi, insects, birds and bacteria is in tension with asking the account to be faithful to the causal structure of each clade, and that demanding stability under future revision is in tension with demanding that the list track new evidence. Third, whether the specification should include a requirement that the metaphysical question of what species are be separable from the practical question of which taxa to list — whether that separability is a real desideratum or a way of giving up on the problem I actually have.

  Then, briefly, and only as a check on the criteria rather than as the main deliverable: how the familiar families of account fare against the list — the interbreeding-based one, the diagnosable-smallest-cluster and monophyly-based ones, the ecological or genotypic-cluster pictures, the general-lineage view, and outright pluralism — and which single requirement does the most work in excluding them. Please do not give me a reading list or a bibliography; I can find those myself.
reasoning: |-
  Okay, the user is on the board of a land trust and is dealing with a species list that varies drastically depending on which checklist they use. This isn't just a data issue—it's a conceptual problem affecting grants, management plans, and legal obligations. They need a set of criteria (desiderata) for a trustworthy species account, along with explanations for each requirement. They also want an analysis of conflicts between criteria and how different species concepts hold up.

  First, I need to unpack their main points. The core issue is that species definitions are inconsistent, leading to practical problems. The user listed specific biological cases the criteria must handle: asexual lineages, prokaryotes with horizontal gene transfer, ring species, polyploidy, lichens, fossils, domesticated vs. wild forms, and evidential poverty. 

  The user also raises three meta-questions: distinguishing genuine adequacy conditions from biases, identifying conflicting criteria, and whether the metaphysical and practical aspects should be separable. These are crucial for ensuring the criteria are robust and applicable.

  For the desiderata, each requirement must address real-world biological phenomena. For example, handling prokaryotes' gene swapping requires a concept that doesn't rely solely on vertical descent. Ring species challenge discrete boundaries, necessitating a flexible approach to gene flow. Lichens involve symbiotic consortia, so the concept must account for emergent entities beyond single lineages. Evidential poverty means criteria must work with minimal data, like photos or barcodes, without requiring genomic data.

  The meta-questions need careful handling. Identifying biases involves recognizing that some demands, like stability for grants, might conflict with scientific accuracy. Conflicts between criteria, like cross-taxonomic consistency vs. clade-specific fidelity, require prioritizing based on the trust's needs—probably favoring practicality. Separating metaphysics from practice might be essential for operational use, even if it's philosophically messy.

  Assessing existing species concepts: the Biological Species Concept (BSC) fails with asexual organisms and prokaryotes. Phylogenetic concepts struggle with ring species and gene flow. Ecological concepts might handle lichens but falter on hybridization. Pluralism could work but might undermine legal stability. The evidence requirement (R9) likely excludes many concepts due to reliance on genomic data.

  The user's deeper needs include legal defensibility, grant eligibility, and practical management. They need a species concept that provides stability for legal and funding purposes while accommodating biological complexity. Balancing scientific rigor with practicality is key. The criteria must be transparent about limitations, especially when evidence is scarce, to prevent future disputes.
answer: |-
  Here is a specification of desiderata for an account of species suitable for your land trust's operational needs, grounded in the biological phenomena you must accommodate, followed by analysis of the meta-questions and a brief assessment of major concepts.

  ### Desiderata for an Operational Species Account

  1.  **Accommodate Asexuality & Non-Mendelian Inheritance (Phenomenon: Obligate asexual lineages, many prokaryotes, some eukaryotes):** The account must define cohesive units without relying on interbreeding or recombination. *Reason:* Many fungi, protists, bacteria, and some plants/animals lack sexual reproduction or engage in pervasive horizontal gene transfer (HGT). Excluding these would render the list biologically incomplete and operationally useless for managing microbial/fungal diversity.

  2.  **Handle Gene Flow Gradients & Ring Species (Phenomenon: Ring species, parapatric speciation, porous hybrid zones):** The account must describe units where boundaries are zones of reduced gene flow/interbreeding, not absolute barriers, and where endpoints may be distinct despite connectivity. *Reason:* Real-world gene flow is often quantitative and geographically structured (e.g., Ensatina salamanders). Demanding absolute reproductive isolation is biologically unrealistic and collapses meaningful diversity units crucial for conservation.

  3.  **Accommodate Instantaneous Speciation (Phenomenon: Speciation via polyploidy/hybridization):** The account must recognize lineages originating in a single generation (e.g., allopolyploid plants) as distinct units immediately. *Reason:* These lineages are genetically isolated, ecologically distinct, and often conservation targets. Denying them species status ignores biologically significant, independently evolving units.

  4.  **Define Emergent Consortia (Phenomenon: Lichens, other obligate symbioses):** The account must provide a framework for recognizing entities formed by stable, interdependent associations of phylogenetically distinct lineages as operational units. *Reason:* The conservation target (e.g., *Cladonia rangiferina*) is the functional symbiotic *form*, not just the fungal partner. The unit must reflect the ecological and phenotypic entity.

  5.  **Be Applicable to the Fossil Record (Phenomenon: Incomplete fossil record, anagenesis):** The account must generate usable units based on morphological gaps/clusters despite potential continuity in deep time. *Reason:* Paleontological data informs conservation baselines and history. The concept cannot require genetic data or instantaneous definition; it must work with morphological series sliced at a point in time.

  6.  **Address Artificial Selection & Managed Gene Pools (Phenomenon: Domesticates, feral populations, introgression with wild relatives):** The account must distinguish managed/human-influenced lineages from wild counterparts *based on their ecological/evolutionary trajectory*, even if interfertile. *Reason:* Conservation goals often focus on wild genotypes, ecological roles, and evolutionary potential, distinct from domesticated or heavily introgressed forms (e.g., wild vs. domestic mallards).

  7.  **Operate Under Severe Evidential Poverty (Phenomenon: Most taxa lack genomic data):** The account must provide decision rules for delimiting units using sparse evidence (morphology, limited DNA barcodes, geography, ecology) and explicitly state the criteria for provisional assignment when evidence is insufficient. *Reason:* Practical conservation listing relies overwhelmingly on non-genomic data. The account must be usable *now*, not just theoretically ideal.

  8.  **Be Consistent with Evolutionary Process (Phenomenon: Descent with modification, divergent selection, lineage independence):** The account must not contravene fundamental principles of evolution (e.g., common descent, adaptation). *Reason:* To be biologically credible and avoid arbitrary units that lack explanatory power or predictive value for management (e.g., response to climate change, disease).

  9.  **Prioritize Operational Delimitation over Metaphysical Essence (Phenomenon: Practical need for a list):** The account must provide clear, repeatable (though potentially imperfect) criteria for *deciding* when to recognize a unit as a "species" for the list, prioritizing utility over resolving deep ontological debates. *Reason:* The core problem is generating a functional, defensible list for legal, management, and funding purposes, not defining the true nature of "Species."

  ### Analysis of the Meta-Questions

  1.  **Genuine Adequacy vs. Constituency Prejudice:**
      *   **Genuine Adequacy:** Accommodating Asexuality (R1), Gene Flow Gradients (R2), Evidential Poverty (R7), Evolutionary Consistency (R8), Prioritizing Delimitation (R9). These stem directly from biological reality or the *inescapable constraints* of your operational task.
      *   **Constituency Prejudice:**
          *   *Metaphysician's Essence:* Contradicted by R1, R2, R3, R5. Biology shows lineages lack immutable essences.
          *   *Phylogeneticist's Strict Monophyly:* Contradicted by R1 (HGT), R2 (incomplete lineage sorting, gene flow), R4 (lichens). Strict monophyly is often unattainable or misrepresents process.
          *   *Field Naturalist's Simplicity:* Contradicted by R2, R3, R4, R6. Real diversity is often messy. Simplicity (R7) is needed but shouldn't *define* the unit where complexity exists.
          *   *Practitioner's Stability:* A *desired outcome* of the *process* defined by the account, not an adequacy condition for the definition itself. Absolute stability (R9) is likely impossible with new evidence, but *procedural stability* (clear revision rules) is crucial.

  2.  **Conflicting Requirements & Priorities:**
      *   **Cross-Taxonomic Consistency vs. Clade-Specific Fidelity:** Conflict exists. *Priority: Clade-Specific Fidelity (via R8 & R9).* Forcing birds, bacteria, and lichens into the *exact same* operational box distorts biology. The account should be a *framework* allowing appropriate, biologically-consistent implementation per major group (e.g., different weighting of morphology vs. genetics for birds vs. bacteria), ensuring comparability *within groups* for counting, not demanding identical mechanisms.
      *   **Stability vs. Tracking New Evidence:** Inherent tension. *Priority: Tracking New Evidence (via R8 & R9), with Procedural Stability.* The list must evolve with knowledge. The account should define *how* evidence triggers revision (e.g., genetic data confirms provisional morpho-species, reveals cryptic species, or shows conspecificity). This provides stability *between* revisions and defensibility for changes.
      *   **Simplicity (R7) vs. Accommodating Complexity (R2, R3, R4, R6):** Constant tension. *Priority: Accommodating Complexity, with Simplicity in Delimitation Rules (R9).* The account must acknowledge complexity (R8) but provide rules (R9) to make tractable decisions *despite* it using available evidence (R7). Provisional assignments are key.

  3.  **Separating Metaphysics from Practice (R9):**
      *   **Essential Desideratum.** Your problem is operational, not philosophical. Demanding the account resolve "What *is* a species?" is counterproductive. R9 explicitly prioritizes clear, biologically-informed *delimitation criteria* over metaphysical certainty. The account should tell you *how to decide* what to list, based on evidence and evolutionary principles, not what a species *really is* in an absolute sense. This isn't giving up; it's focusing on the solvable part of the problem you face.

  ### Assessment of Major Species Concepts Against Desiderata

  *   **Biological Species Concept (BSC - Interbreeding):** **Fails R1** (asexuals), **R2** (ring species, porous barriers), **R3** (instantaneous speciation), **R7** (hard to test without experiments). Excluded primarily by **R1**.
  *   **Morphological/Phenetic Species Concept (Diagnosable clusters):** **Fails R2** (continuous variation), **R3** (may lump polyploids), **R4** (lichens are clusters, but what defines them?), **R5** (anagenesis), **R8** (can group unrelated look-alikes). Struggles most with **R2** and **R8**.
  *   **Phylogenetic Species Concepts (PSC - Monophyly/Smallest Diagnosable):**
      *   *Monophyly-Focused:* **Fails R1** (HGT breaks monophyly), **R2** (gene flow breaks monophyly), **R3** (immediate monophyly unclear), **R7** (requires robust phylogenies). Excluded by **R1 & R2**.
      *   *Diagnosability-Focused (PSC sensu stricto):* Better on **R7**, but **Fails R2** (arbitrary diagnosability thresholds), **R4** (lichens diagnosable, but unit definition unclear), **R8** (can diagnose trivial variants, not necessarily evolving lineages). Struggles with **R2 & R8**.
  *   **Ecological Species Concept (ESC - Niche occupation):** **Fails R1** (many microbes lack distinct niches?), **R2** (graded niches), **R3** (niche may not be instant), **R4** (symbiotic niche), **R6** (niches overlap), **R7** (niche hard to define/test). Excluded by **R1 & R7**.
  *   **Genotypic Cluster Concept (GCC - Genetic clusters):** **Fails R7** (requires multi-locus data), **R2** (clusters may have fuzzy edges/gene flow), **R5** (no DNA). Excluded primarily by **R7** (Evidential Poverty).
  *   **General Lineage Concept (GLC - Segmented metapopulation lineages):** **Accommodates R1-R6, R8** well conceptually. **Fails R7 & R9** directly – it's a framework, *not* an operational criterion. It doesn't tell you *how* to delimit the segments with sparse data. Needs pairing with delimitation methods.
  *   **Outright Pluralism (Different concepts for different groups):** **Accommodates R1-R8** well by design. **Fails R9** critically for your purpose. It provides no single backbone for a unified list across taxa, leading to the very inconsistency problem you face. It offers no guidance on *which* concept to apply *when* for listing decisions.

  **Requirement Doing the Most Exclusionary Work:** **R7 (Operate Under Severe Evidential Poverty)** is the most brutal filter. It immediately excludes concepts requiring experimental tests (BSC), robust phylogenies (monophyly-based PSC), niche quantification (ESC), or genome-scale data (GCC). **R1 (Accommodate Asexuality)** is the most fundamental biological filter, eliminating BSC.

  ### Conclusion for Your Operational Needs

  No existing concept perfectly satisfies all desiderata, particularly the tension between biological complexity (R1-R6, R8) and operational tractability under evidential poverty (R7, R9). The **General Lineage Concept (GLC)** provides the most biologically realistic *framework* (accommodating R1-R6, R8), but it **must be combined with explicit, standardized, evidence-sensitive operational criteria for delimitation (R7, R9)**.

  **Recommendation:** Adopt the GLC as the underlying rationale. Develop **group-specific operational protocols** (e.g., for vascular plants, bryophytes, fungi, insects, birds, bacteria) that define what constitutes sufficient evidence (morphology, barcode divergence, ecology, geography) under R7 to recognize a "segment of a separately evolving metapopulation lineage" (GLC) for listing purposes within that group. These protocols must include rules for:
  *   Handling asexuals/HGT (prioritizing cohesive clusters).
  *   Delimiting in zones of gene flow (using thresholds of divergence or geographic separation).
  *   Recognizing polyploids/symbiotes based on consistent form/ecology.
  *   Assigning provisional status and defining revision triggers.
  *   Justifying counts for grants as "operational diversity units (ODUs) based on [Protocol X]", acknowledging the inherent limitations.

  This approach embraces the biological reality (GLC) while providing the practical, evidence-based, defensible, and relatively stable (procedurally) listing system you require.
