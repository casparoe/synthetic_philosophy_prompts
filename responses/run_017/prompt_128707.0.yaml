        - Actually, the endpoints method is rotationally invariant, but not translationally invariant? Wait, the circle is fixed. 
        - The key is: what is the symmetry we impose? The principle of indifference often relies on symmetry. But here, the symmetry of the circle doesn't pick a unique method. 
        - The midpoint method (straw throwing) is invariant under rotations and translations? But the circle is fixed. 
        - The endpoints method is invariant under rotations but not under translations? Because moving the circle would change the chord? 
        - Actually, all methods are rotationally invariant because the circle is symmetric. 
        - But translational invariance: if we move the circle, the chord should be generated the same way. In the straw throwing method, it is: because the circle is moved, and we throw the straw in the same way, the distribution should be the same. This is because the straw throwing method doesn't care about the absolute position. 
        - In contrast, the endpoints method is defined relative to the circle, so it is also translationally invariant? Not if we move the circle: the endpoints are on the circle, so if we move the circle, the points move with it. 
        - Actually, all methods are defined relative to the circle. So they are all translationally invariant if we move the circle and the apparatus together. 
        - The real issue is: what is the underlying symmetry? The group of symmetries that preserve the circle (rotations) is not enough. To break the tie, we might need a physical context. 

    We can say: in the absence of a physical mechanism, we don't know which symmetry to impose. 

    Finally, note: the betting game changes the subject to inference, but it also shows that the principle of indifference doesn't help us in the absence of data. And even with data, we need to know what we are assuming about the method.

    What might go wrong:
        - Group 1: measuring might be slow and inaccurate. They might not do 15 chords. Solution: reduce the number to 10 per group. 
        - Group 2: they might make a mistake in the calculation of d. Solution: provide a clear instruction. 
        - Group 3: throwing straws takes time and they might not get 10 chords. Also, if the straw misses the circle entirely, they have to rethrow. And if the straw lands entirely inside, then it's not a chord? Actually, we defined the chord as the intersection, which is the entire straw if it is inside. But then it is a chord only if the straw is a straight line segment inside the circle. But it might not be a chord: a chord must connect two points on the circumference. So if the straw is entirely inside, then it doesn't intersect the circle at two points -> invalid. They should only count when the straw crosses the circle at two points. So they have to throw until they get two intersections. 
        - Also, measuring the chord length on the floor might be hard. 

    To save time for Group 3, we can have multiple straws and multiple people throwing. 

    Alternatively, we can do Group 3 as a whole-class activity? But then they don't have the group experience. 

    Another issue: the frequencies might not match the theory because of small sample size. We should not expect them to be exact. 

    Finally, the sealed envelopes for the betting game: we must prepare them in advance. We generate three sets of 15 chords:
        - Set A: endpoints method: 1/3 long -> about 5 long out of 15.
        - Set B: radius method: 1/2 long -> about 7 or 8 long.
        - Set C: midpoint method: 1/4 long -> about 3 or 4 long.

    But we have to make sure they are generated by the respective methods. 

    Since we are generating them, we can do it quickly by hand. 

    In the debrief, we must also highlight that the principle of indifference is not useless: in each method, we used it within the method (e.g., uniform on the circle for endpoints, uniform on the radius for Group 2, uniform in the disk for Group 3). So it works within a parameterization. The problem is that there are multiple parameterizations.

  Timeline:

    0-5 min: Introduction. Explain the setup and split into groups. Hand out materials.

    5-35 min: Group work. Each group generates chords and records long/not. (30 minutes)

    35-45 min: Groups count and report their frequencies. Write on board: Group 1: x/15, Group 2: y/15, Group 3: z/15. (10 minutes)

    45-65 min: Betting game: hand out the sealed envelopes (each has a list of 15 outcomes: long or not). Each group gets one envelope. They are told that their set was generated by one of the three methods. They discuss and then bet on which one. Then they report their bet. (20 minutes)

    65-80 min: Debrief and discussion. (15 minutes)

    In the debrief, connect to the principle of indifference and the underdetermination. Address the straw throwing objection: why is that method special? Because it has a physical interpretation and is invariant under Euclidean transformations? But the others might too? 

    We can say: the principle of indifference, when applied to different variables (endpoints, radius and distance, midpoint) gives different results. Without a reason to prefer one set of variables over the other, we are stuck. 

    Finally, note that in statistical practice, we often specify the random process, which breaks the tie.

    One feature the game can't reproduce: the exact theoretical probabilities. We get noisy data. So we have to remind them of the theory.

    Also, we cannot physically reproduce the continuous distributions perfectly, so there will be discretization and approximation errors.

    But the lesson is the variation in the frequencies and the difficulty in inferring the method from a small sample.

    We end by saying: the principle of indifference is a guide, but it must be applied with care, and it does not relieve us of the need to specify the sample space and the mechanism.
