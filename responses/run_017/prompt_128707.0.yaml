  Here's a complete session plan for your 80-minute class on Bertrand's paradox and the principle of indifference, designed to maximize student engagement and illuminate the philosophical stakes while accommodating your constraints. The session flows through physical experimentation, data-driven inference, and guided discussion, aiming to transform abstract confusion into concrete insight.

  **Introduction (5 minutes)**  
  As students enter, hand each a printed circle (radius ~10 cm) and divide them into three groups. Briefly frame the day: "Last week’s reading showed that three 'random' chord methods yield different probabilities. Today, you’ll become those methods. By the end, we’ll confront what 'indifference' really demands of us." Assign each group a method: Group 1 (random endpoints), Group 2 (random radius + point), Group 3 (random midpoint via straw toss). No further explanation—they’ll rely on the reading’s descriptions. Emphasize: "Your goal is to generate chords and find what fraction exceed the triangle’s side length. Precision matters less than consistency in your method."

  **Group Work: Chord Generation (30 minutes)**  
  Provide each group with distinct materials and instructions. Circulate to troubleshoot, but avoid clarifying theory—lean into their confusion.  

  - **Group 1 (Endpoints)**: Give a spinner (pencil + paperclip), ruler, and template string (length = √3 × radius ≈17.3 cm for r=10 cm).  
    *Task*: Spin twice to mark two points on the circumference. Measure the chord length with the ruler; compare to the template string. Record if longer.  
    *Predictable issue*: Spinning/measuring is slow. Solution: Let them generate only 10–15 chords. If angles are measured (e.g., with protractors), remind them to use the smallest arc.  

  - **Group 2 (Radius + Point)**: Provide a spinner, coin, and ruler.  
    *Task*: Spin once to choose a radius. Flip the coin 4 times to generate a 4-bit number (0–15); divide by 16, multiply by radius (e.g., 10 cm) for distance *d* from center. Record if *d* < r/2 (≈5 cm)—no chord drawing needed.  
    *Predictable issue*: Binary conversions confuse. Solution: Provide a lookup table (0000=0.0, 0001=0.0625, ..., 1111=0.9375).  

  - **Group 3 (Midpoint/Straw Toss)**: Use a large circle on the floor (radius ~50 cm, drawn with string/chalk), long straws (>100 cm), and a template string (≈86.6 cm).  
    *Task*: Toss straws from shoulder height onto the circle. For each toss, mark endpoints where straws cross the circle, measure chord length with string, compare to template. Record if longer. Discard misses (straws not crossing twice).  
    *Predictable issues*: Straws miss circle; measurement is messy. Solutions: Use a large circle (reduces misses); assign roles (tosser, two markers, measurer). Aim for 10 valid tosses.  

  **Data Compilation and Initial Conflict (10 minutes)**  
  Groups report counts: "Long chords / Total chords". Expect Group 1 ≈1/3, Group 2 ≈1/2, Group 3 ≈1/4 (but noise is fine). Write results side-by-side. Ask: "Same circle, same triangle—why different answers?" Let students argue briefly. Then pivot: "You each embodied indifference. Group 1 was indifferent to endpoints, Group 2 to radius and distance, Group 3 to the midpoint’s location. Yet here we are. Is one group ‘wrong’?" Resist resolution; introduce the betting game.

  **Betting Game: Inference from Sealed Data (20 minutes)**  
  Distribute sealed envelopes to each group. Each contains 30 pre-generated chord outcomes (long/not) from one method (labeled secretly: A=endpoints, B=radius, C=midpoint). Instructions: "Your envelope’s data came from one of the three methods. Bet your group’s $10 fictional cash on which method produced it. You’ll lose cash if wrong, keep it if right. You have 15 minutes to investigate and decide."  
    
  Groups receive:  
  - **Envelope A**: 10 long, 20 short (≈1/3)  
  - **Envelope B**: 15 long, 15 short (≈1/2)  
  - **Envelope C**: 8 long, 22 short (≈1/4—slightly noisier for realism)  
    
  *Predictable issues*: Groups may fixate on exact fractions (e.g., "15/30 is exactly 1/2!"), ignoring variance. Others may overcomplicate (e.g., "What if it’s mixed?"). Intervene minimally: "Assume it’s one pure method." After bets, reveal the labels and have groups tally wins/losses. Most will guess correctly (Group 1 bets on A, etc.), but the point isn’t the bet—it’s the debrief.

  **Debrief and Philosophical Synthesis (15 minutes)**  
  Start from the betting game: "You inferred the method from data. But what if, like in the reading, you had no data—just the principle of indifference? What would ‘random chord’ mean then?" Use this to unravel the paradox:  

  1. **Indifference’s Successes and Failures**:  
     - In each method, indifference worked *locally*: Group 1 assumed endpoint uniformity; Group 2 assumed uniformity on radius/distance; Group 3 assumed midpoint uniformity. All are "indifferent" within their parameters.  
     - Yet globally, indifference is silent on *which parameterization* to choose. The betting game shows that data can arbitrate, but without it, indifference alone is underdetermined.  

  2. **Addressing the Straw-Toss Objection**:  
     - When a student asks, "Why not just toss straws?" reply: "Great! That’s Group 3’s method. But why is *that* the ‘right’ indifference? Couldn’t we demand indifference to something else?"  
     - The key is translational/rotational invariance: Straw-tossing treats all circle positions/orientations equally. But is this the only valid symmetry? Group 1’s method is rotationally invariant too! What’s special about translation? The principle doesn’t decide.  

  3. **Where Indifference Still Matters**:  
     - Highlight that indifference *within* a chosen framework (e.g., "once we fix the radius, we’re indifferent to distance") remains essential. The paradox exposes that the framework choice isn’t dictated by indifference—it requires external justification (e.g., physical constraints).  

  4. **What the Game Couldn’t Capture**:  
     - Physical limitations (measurement error, small samples) obscured exact probabilities. Admit this upfront: "Your data was noisy, but theory predicts 1/3, 1/2, 1/4. Trust the math here."  
     - The game shifted to inference, but that’s instructive: It shows that indifference without empirical grounding is incomplete. Philosophy needs science to break ties.  

  End by connecting to broader themes: "Indifference is a tool, not an oracle. It can’t resolve ambiguities in how we set up a problem—whether in probability, ethics, or policymaking. Next week, we’ll see how decision theory confronts this."  

  **Predictable Snags and On-the-Fly Fixes**  
  - **Group 3’s straws miss the circle**: Have extras; ignore tosses with <2 intersections. If >50% miss, use a larger circle or switch to tossing short strings.  
  - **Students "cheat" randomness**: If Group 1 subconsciously picks "nice" chords, remind them: "If you avoid a chord, is that indifference?"  
  - **Betting game confusion**: If groups struggle to infer, scaffold: "Compare your envelope’s long-fraction to 1/3, 1/2, 1/4."  
  - **"Why does translation invariance matter?"**: If pressed, sketch: "Moving the circle shouldn’t change probabilities. Straw-tossing achieves this; endpoint-picking doesn’t. But is that a demand of indifference or physics?" (Punt to office hours if needed.)  

  This session transforms the paradox from a "lol underdetermined" curiosity into a lesson on the limits of abstract principles. Students physically enact the methods, confront variability in data, and grapple with how inference and indifference interact—all while you steer confusion toward clarity.
