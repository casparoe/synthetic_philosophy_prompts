  me and my friend Mara argue about this at lunch basically every day (she's in AP psych, I'm not, so she usually wins) and I've started keeping a list of her verdicts on whether X is "socially constructed" so I can predict her. here's the track record so far: race — constructed, her reason being that which body differences even count as marking a race has changed a bunch of times and is different in Brazil than here, so it's not like we just discovered the groups; money — constructed, "it's only money bc everyone agrees to treat it as money," dollars now and shells or whatever before; teenager — constructed, she says people our age weren't a separate stage with their own clothes and music and laws until pretty recently, we made it up; being a citizen of a country — constructed, obviously, borders and rulebooks are ours; being six feet tall — NOT constructed, and she made a whole thing about this one, the foot is made up but once you fix a unit you can just go measure, so after that it isn't up to us anymore; being a crow, like species membership — not constructed, crows were doing crow stuff before there were people; type 1 diabetes — not constructed, it's a mechanism in the body and we found it, nobody took a vote on it; being left handed — not constructed.

  two new cases. one: next week her class is doing Pluto — whether "planet" is socially constructed, since the astronomers voted on it and Pluto got demoted and now there's "dwarf planet" and nobody changed anything about Pluto itself. two: something at our actual school, which is that last year the district started labeling anyone who misses 10% of school days a "chronically absent" student, teachers get a list at the start of the semester, and now ppl kind of expect less from those kids and some of them stopped showing up even more. what's she gonna say about planets, and about "chronically absent"? but really I want the rule — is she running something like "would this kind still have members if humans and our practices disappeared," or "could we have drawn the line somewhere else and not been more wrong," or something about the label changing the people it gets put on? which of those fit all eight of her old verdicts, where do they disagree on Pluto and on the absentee label, what's your best guess for each with reasons, and what's one more case I could spring on her at lunch that would tell the rules apart? and if her eight verdicts genuinely can't settle it, just say that instead of pretending.
