answer: |-
  Based on Mara's track record and reasoning, I've reverse-engineered her implicit rule for "socially constructed." Here's my breakdown:

  ### Mara's Likely Rule (Best Fit)
  **"A kind/category is socially constructed if its existence, boundaries, or membership *fundamentally depend* on ongoing human practices, agreements, or institutions. If the kind would persist *unchanged* without human interpretation or social systems, it's not constructed."**

  **Why this fits her 8 cases:**
  | **Case** | **Mara's Verdict** | **Fits the Rule Because** |
  |----------|---------------------|---------------------------|
  | Race | Constructed | Boundaries shift with social/political decisions (Brazil vs. US history). Without human racialization practices, "race" as a social category wouldn't exist. |
  | Money | Constructed | Requires collective agreement to treat objects as valuable. Shells/dollars lack intrinsic "money-ness" without human institutions. |
  | Teenager | Constructed | Life stage defined by cultural norms (clothing, laws, marketing). No "teenager" category in societies without these practices. |
  | Citizenship | Constructed | Exists solely via legal/political institutions (borders, rulebooks). No citizenship without human-created states. |
  | Height (6 ft) | **Not** Constructed | Measurement *units* are arbitrary (social), but *once defined*, height is a physical fact independent of human practices. |
  | Species (Crow) | **Not** Constructed | Crows exist and evolved independently of humans. Our label "crow" describes a biological reality. |
  | Type 1 Diabetes | **Not** Constructed | A biological mechanism exists regardless of human recognition. We *discovered* it; we didn't create it via practices. |
  | Left-Handedness | **Not** Constructed | An innate neurophysiological trait. Social stigma might be constructed, but the handedness itself isn't. |

  **Key distinctions in the rule:**
  1. **Dependence vs. Discovery:** Constructed kinds *require* human practices to exist *as that kind*. Non-constructed kinds are *discovered* (like crows or diabetes) or become objective facts *after* arbitrary human definitions (like height).
  2. **Not about labels alone:** It's about whether the *category's reality* depends on society. The *word* "crow" is made up, but the biological kind it refers to isn't.
  3. **Not about changeability:** Units of measurement (feet) change, but height *after definition* is fixed. Socially constructed categories can change *because* they depend on practices (e.g., race definitions).

  ---

  ### Predictions for New Cases (with Reasoning)
  1. **Pluto / "Planet" Status:**
     - **Prediction: CONSTRUCTED**
     - **Reasoning:** The category "planet" depends on astronomers' collective (and revisable) criteria. Pluto's physical properties didn't change, but its membership in the kind "planet" did due to human decisions about classification rules. This mirrors "citizenship" (rules define membership) and "teenager" (socially defined life stage). Mara will argue: "Planet" is a category we impose on celestial bodies for scientific/practical reasons, not a natural kind we discovered.

  2. **"Chronically Absent" Student:**
     - **Prediction: CONSTRUCTED**
     - **Reasoning:** The category exists *only* because the school district created a rule (10% absence = "chronic"). Crucially, the label changes social reality: teachers lower expectations, students internalize the label, altering behavior. This shows *feedback loops* where the classification itself reshapes the phenomenon—a hallmark of social construction (like money's value depending on collective belief). It's not just tracking pre-existing behavior; it's *creating* a new social kind with real consequences. Matches "race" (social boundaries create real effects) and "teenager" (category shapes identity/behavior).

  ---

  ### Testing the Rule: A Diagnostic Case to Spring on Mara
  **Propose this: "Being a refugee."**

  *   **Why it tests the rule:**
      - If Mara says **CONSTRUCTED**, she emphasizes dependence on *legal/political institutions* (UN definitions, state borders, asylum laws). Without these, "refugee" as a protected status wouldn't exist—just people fleeing. This aligns with "citizenship" and "money."
      - If Mara says **NOT CONSTRUCTED**, she emphasizes the *pre-legal reality* of persecution/displacement ("people were fleeing violence before we had the label"). This might prioritize the underlying physical/harm condition over the institutional category, aligning with "diabetes" or "height."
  *   **What it reveals:**
      - Her answer clarifies whether she prioritizes the *institutional dependence* (constructed) or the *underlying physical/harm condition* (not constructed) as defining the kind. Her existing cases suggest she'd lean **CONSTRUCTED** (like citizenship), but it's the best case to confirm if "human practices" must *create* the kind or merely *label* a pre-existing condition.

  ---

  ### Conclusion
  Mara's rule is **consistent** across her 8 cases and cleanly predicts both new cases (**Pluto = Constructed, Chronic Absentee = Constructed**). The core is *ontological dependence*: does the kind itself (not just our knowledge of it) rely on human practices to exist and have its boundaries?

  **No need to hedge—her verdicts settle it.** Her rule isn't about labels changing, human disappearance thought experiments, or mere arbitrary line-drawing. It's about whether the *reality of the category* is *sustained by* social practices. The "chronically absent" case is especially telling because the label *creates* a feedback loop, making it a textbook example of social construction in action. Good luck at lunch!
