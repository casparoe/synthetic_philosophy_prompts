prompt: |-
  I used to be a research assistant for an archaeologist — call her M — who is writing a book on the c-word, and I am now doing a master's and drafting a chapter that leans on her framework, so I want to pin down what rule she is actually running before I build anything on it. Her verdicts so far, as she has given them in talks and in the two chapters she has let me read: the Mycenaean palace world around 1200 BCE, collapse without hesitation, palaces and script and long-distance exchange all gone and nothing on that scale rebuilt for centuries; the Classic Maya southern lowlands, collapse, with her line that what ended was a political system rather than a people, since Maya people are obviously still there; Rapa Nui, not a collapse, she thinks the ecocide story is one we told about them and that the statue cult gave way to a different one; Norse Greenland, collapse, even though the last scrap of writing from there is a wedding in the early 1400s and after that just silence; the western Roman Empire, not a collapse, too slow and too much carried over; the Inca, also not a collapse, because conquest is something done to you; the Mesa Verde region around 1300, not a collapse, people relocated and Pueblo descendants describe it as a migration rather than an end; and the Soviet Union in 1991, collapse, on the grounds that what disappeared was the future people could imagine. I cannot get the Rome verdict and the USSR verdict to sit together under any single rule I try, since Russia kept the archives and the seat and most of the ministries, and the Inca and Greenland rulings seem to undercut her own conquest line, which makes me think the real rule is something other than what she says out loud.

  The case she has not ruled on, which is meant to be the last chapter: a coastal town of about eight thousand that over roughly thirty years, with large majority support at every referendum, moves most of its housing and businesses two kilometres inland after a bad storm surge, abandons its port, lets the old site return to tidal marsh, merges its municipality into a neighbour an hour away, and loses its maternity ward and its local paper to bigger places further off. Population is slightly up, incomes are up, nobody who wanted to stay was forced out, the town is unusually pleased with itself, and it has a published adaptation plan running to 2050. Structurally it is clearly less complex than it was: fewer institutions, fewer specialised roles, less energy and fewer goods flowing through it, and an archaeologist looking at the debris in five hundred years would call it a collapse without thinking twice. So what does she say, and what should she say if she wants to be consistent with herself? I can see three or four rules that fit her track record about equally well — a straight complexity-loss rule, a rule about whether the people living through it experienced catastrophe, a rule about whether the participants themselves narrate an ending, and something stranger about the time horizon over which a community can still plan and commit — and they come apart sharply on this town, so tell me which one is really doing the work in her verdicts, what each predicts here, which you would bet on and why, and which is the closest analog among her precedents: the relocations, or the abandonments. Then the thing I actually need: name one further case that would separate the surviving rules from each other. My candidate is a case where nothing material falls apart — all the buildings and bureaucracies intact — but everyone involved says their world ended, and I want to know whether that is the right probe or whether I am missing a better one. And one more thing I keep going in circles on with my flatmate: if a future archaeologist with only the pots and the foundations would say collapse, and the people living through it would not, is collapse for her something that happens to a society or something that happens to evidence about one?
reasoning: |-
  Okay, the user is a former research assistant for an archaeologist named M, now doing their master's. They're drafting a chapter based on M's framework about societal collapse. But they're struggling to pin down M's actual rule for what constitutes "collapse" because her past verdicts seem inconsistent. For example, she calls the Mycenaean palace world a collapse, but not the Western Roman Empire. Similarly, Norse Greenland is a collapse, but the Inca isn't. The user needs to figure out the underlying rule to build their chapter correctly.

  The key case they're focusing on is a coastal town that intentionally relocated inland. It's less complex now—fewer institutions, roles, etc.—so an archaeologist in the future might label it a collapse. But the people involved see it as a positive move. The user has proposed several possible rules M might be using: complexity loss, lived experience, narrative of ending, or planning horizon. They need to know which one truly explains M's past decisions and what M would say about this town.

  First, I need to analyze M's past rulings to find a pattern. Let's list them again: Mycenaean palaces (collapse), Classic Maya (collapse, political system ended), Rapa Nui (not collapse, ecocide story debunked), Norse Greenland (collapse despite late wedding record), Western Roman Empire (not collapse, too slow), Inca (not collapse, conquest isn't collapse), Mesa Verde (not collapse, migration), Soviet Union (collapse, loss of imagined future). 

  The inconsistency between Rome (slow, not collapse) and USSR (collapse) is tricky. The USSR dissolved quickly, but Russia retained institutions. M's emphasis on the "disappearance of the imagined future" for the USSR suggests that collapse is about a sudden loss of collective vision, not just institutional continuity. For Rome, the transition was gradual, and elements carried over, so no collapse.

  Looking at Greenland and Inca: Greenland's end was abrupt with no continuity, while the Inca's conquest was external but led to ongoing cultural survival under Spanish rule. M seems to prioritize whether the society maintains its core identity or future vision. The Mesa Verde case is explicitly called a migration by descendants, so not a collapse. Rapa Nui's shift in religious practice was internal, not collapse.

  So, the unifying theme might be the combination of rapid, involuntary change leading to a loss of future planning capacity and identity. But the coastal town case is voluntary, planned, and seen positively. Even though complexity decreased, the community's agency and positive narrative might lead M to say "not collapse." That aligns with her emphasis on lived experience and narrative.

  Among the rules, the narrative of ending and planning horizon seem strongest. The Soviet collapse involved a sudden loss of future vision, while Rome's decline didn't. For the coastal town, despite reduced complexity, the community has a clear adaptation plan and positive outlook. So M would likely say "not a collapse," similar to Mesa Verde.

  The user's probe case—where nothing material changes but people feel their world ended—would test the narrative vs. complexity rules. If M calls it collapse based on narrative, that confirms her reliance on subjective experience. If not, complexity might matter more. Another probe could be a case with material collapse but no cultural narrative of ending (e.g., Pompeii? But that's too catastrophic). Maybe a society that fragments into smaller groups but maintains cultural continuity, testing whether political disintegration alone is enough.

  The user also questions whether collapse is about the society or the evidence. M's approach seems to prioritize contemporary perspectives over archaeological remains. So collapse is defined by the people experiencing it, not future interpretations. This resolves the coastal town dilemma: future archaeologists might see collapse, but if the community doesn't, it's not collapse for M.

  In conclusion, M's rule centers on the lived experience and narrative of ending, especially when agency and future vision are lost. For the coastal town, she'd say "not collapse." The best probe is the user's idea of a society with intact structures but a collective sense of ending. That would clearly distinguish between complexity-based and narrative-based definitions.
answer: |-
  Based on M's verdicts, her core rule isn't about *material* collapse, *complexity loss*, or even *conquest* alone. It's about **the sudden, involuntary rupture of a society's core identity, future trajectory, and capacity for collective self-determination, as experienced and narrated by its participants.** Let's break down her pattern and apply it to the coastal town.

  **Decoding M's Rule: The Lived Rupture of Future & Identity**

  1.  **Mycenaean Palaces (Collapse):** Palatial system, writing, trade networks vanish abruptly. The core Mycenaean political/cultural identity *as they knew it* ended involuntarily. No continuity of that specific future vision.
  2.  **Classic Maya (Collapse):** Explicitly framed as the end of a *political system* and its associated elite culture/identity. The "people" (ethnic/cultural continuity) survive, but *that specific societal organization and its trajectory* ruptured.
  3.  **Rapa Nui (Not Collapse):** M rejects the external "ecocide/collapse" narrative. She sees an *internal*, likely intentional, *shift* in religious focus (statue cult to birdman). Identity and societal continuity weren't ruptured *by catastrophe*; they evolved.
  4.  **Norse Greenland (Collapse):** The societal project – a European Christian farming community in the Arctic – failed utterly. The identity and way of life ceased *involuntarily*. The "silence" is key – the future they envisioned disappeared.
  5.  **Western Roman Empire (Not Collapse):** Transformation, not rupture. Key elements (Church, law, urban life, Latin culture in the West, full continuity in the East) persisted. The *idea* of Rome evolved; the future wasn't *lost*, it changed shape gradually. People didn't experience a single "end."
  6.  **Inca (Not a Collapse):** Conquered, but core societal structures (mit'a, ayllus, language, religion syncretized) persisted *under new management*. The Inca identity and many practices adapted and continued. The rupture was imposed, but not an *internal* societal collapse ending their trajectory – it was violently redirected.
  7.  **Mesa Verde (Not a Collapse):** Descendant narratives frame it as a *migration*, a strategic relocation. Collective identity (Pueblo) and future planning capacity continued elsewhere. It was a societal *reorganization*, not an end.
  8.  **Soviet Union (Collapse):** The defining factor isn't institutional continuity in Russia, but the **"disappearance of the future people could imagine."** The Soviet ideological project, its identity, and its planned trajectory dissolved abruptly and involuntarily for its citizens. The lived experience was of an ending.

  **The Core Rule:** **Collapse, for M, occurs when a society experiences a rapid, *involuntary*, and fundamental rupture in its core identity, purpose, and imagined future trajectory, leading to a loss of collective self-determination and a narrative of ending among its participants.** It's about the lived experience of a *future* vanishing.

  **The Coastal Town Verdict: What M *Would* Say & *Should* Say**

  *   **Material/Archaeological View:** Future archaeologist sees abandonment, reduced complexity, debris → "Collapse."
  *   **M's Rule (Lived Rupture):**
      *   **Voluntary & Planned:** The move was chosen via referendum, with majority support. It was an act of *collective self-determination*.
      *   **Positive Narrative:** The town is "unusually pleased with itself." This is narrated as a *successful adaptation*, a *new beginning*, not an ending.
      *   **Future Horizon Intact:** They have a published plan running to 2050. Their imagined future is *different* but *intact and planned*.
      *   **No Involuntary Rupture:** Key elements (population, community identity, prosperity) are stable or improved. Nobody was forced out.
  *   **Verdict:** **NOT a Collapse.** The closest analog is **Mesa Verde** (relocation as continuity) and, to a lesser extent, **Rapa Nui** (internal evolution, not catastrophe). Despite material simplification, the core rule – involuntary rupture of identity/future – is absent. Agency and positive narrative dominate.

  **Your Candidate Probe: Testing the Rules**

  Your candidate ("intact structures, everyone says world ended") is **excellent** for separating the rules:

  1.  **Complexity-Loss Rule:** Intact structures/complexity → **Not Collapse.** (Fails your candidate)
  2.  **Catastrophe Rule:** No material catastrophe? Ambiguous. Probably **Not Collapse.** (Fails your candidate)
  3.  **Narrative-of-Ending Rule:** Everyone says world ended → **Collapse.** (Passes your candidate)
  4.  **Planning Horizon Rule:** Loss of future-planning capacity implied by "world ended"? Likely → **Collapse.** (Passes your candidate)
  5.  **M's Rule (Lived Rupture):** Intact structures *don't matter*. If core identity/purpose/future trajectory ruptured *involuntarily* and participants *narrate an ending* → **Collapse.** (Passes your candidate)

  **Refining the Probe:** To specifically isolate M's rule from *just* narrative or planning horizon, consider a case where **a society undergoes massive, rapid, *voluntary* simplification driven by a powerful new ideology/narrative, where the old world is declared "ended," but the change is embraced and a new, clear future is actively built.** (e.g., a radical, successful, voluntary degrowth transition movement taking over a municipality). Here:
      *   **Narrative-of-Ending Rule:** "Old world ended" → Collapse?
      *   **Planning Horizon Rule:** New future actively planned → Not Collapse?
      *   **M's Rule:** *Voluntary* transformation, new identity/purpose embraced, self-determination maintained → **Not Collapse**, despite the "ending" narrative referring to the *old* system.

  **Collapse: Society or Evidence?**

  This is crucial. For M, based on her emphasis on lived experience (Maya "people still there," Mesa Verde descendant narratives, USSR "imagined future"), **collapse is something that happens *to a society* as experienced by its participants.** The future archaeologist's "collapse" label, based only on pots and foundations, would be **a misinterpretation of the evidence** from M's perspective. M prioritizes the internal, experiential reality over the external, material signature. The coastal town case perfectly illustrates this distinction: the *evidence* suggests collapse to a future outsider, but the *society* experienced adaptation and continuity. **Collapse is a sociocultural phenomenon, not an archaeological classification.**

  **Conclusion & Bet**

  *   **M's Real Rule:** Sudden, involuntary rupture of core identity/purpose/future trajectory & narrative of ending (Lived Rupture).
  *   **Coastal Town Verdict:** **Not a Collapse** (Mesa Verde/Rapa Nui analog - *relocation/evolution*).
  *   **Best Probe:** Your candidate ("World ended" narrative + intact structures) is strong. The degrowth variant further refines it against pure narrative.
  *   **Collapse Definition:** For M, it happens **to the society** (experientially), not just to the evidence.

  **Bet:** I'd confidently bet that M will declare the coastal town **NOT a collapse**, framing it as a successful, planned adaptation demonstrating resilience, contrasting it sharply with cases like Norse Greenland or the USSR where futures vanished involuntarily. Her consistency hinges on the *volition and narrative* of the participants, not the material simplification visible to an archaeologist.
