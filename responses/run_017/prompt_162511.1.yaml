prompt: |-
  ok so I keep going back and forth on this one and I want a number out of you, not a "well, it depends on what you mean by heritability."

  Set it up in the usual way: narrow-sense heritability = additive genetic variance / phenotypic variance, for a specified population in a specified spread of environments. Take an ordinary behavioural trait — educational attainment, or a cognitive test score, whatever — with h² ≈ 0.5 measured in a contemporary wealthy population. The question I actually care about:

  Does that 0.5 carry any *real* information about how large a mean shift you could buy in that same population with a uniform intervention (everyone gets it, so nobody's rank changes)? Or is it, as the standard line has it, compatible with a mean shift of literally any size?

  Here's where I got stuck. Suppose the trait is additive with no G×E. Then under the best environment everyone's value is G + e*, so the achievable mean shift is just e* − Ē, where Ē is the mean of the environments people in the population actually occupy. h² doesn't appear in that expression at all, so the standard line looks right. But the decomposition also hands you √Ve = √(1 − h²)·SD_T, and the environments currently realised in the population are a kind of sample of what environments are attainable for people like us. If the intervention has to be an environment drawn from roughly the range already realised — just better targeted and given to everybody — then the achievable shift is on the order of one to three environmental SDs, and h² does tell you something: it gives an order-of-magnitude ceiling. The textbook counterexamples (the single-gene metabolic one, iodine, the secular rise in test scores) all work by importing an environment from *outside* the realised range. So the crux looks like whether real interventions draw on the realised range or on environments nobody in the population currently occupies — plus how much of the non-genetic variance is a lever anyone could pull at all, as opposed to measurement error and developmental noise that no intervention touches.

  So give me your credence in this, precisely: **that h² ≈ 0.5 for a trait like that is a useful — say, within a factor of 3 — order-of-magnitude guide to the largest uniform mean shift achievable without importing an environment from outside the population's current range.**

  Then the decomposition, with a number and one line of justification each:
  (a) that interventions of the relevant kind mostly come from inside the realised environmental range;
  (b) that the realised range is a decent guide to the attainable range, rather than being artificially compressed by the very institutions we'd be intervening on;
  (c) that the non-genetic variance is mostly an intervenable lever rather than measurement error or noise;
  (d) that additive-no-G×E holds well enough for √Ve to be read off the decomposition in the first place;
  (e) whatever else you think belongs in there.

  Then how you're combining them — you don't have to multiply, just say what dominates. My own number is 0.35, and if yours is way off, tell me which term you think I'm weighting wrong. Also: on this framing a maximally successful uniform intervention drives Ve toward zero and h² toward 1, so "heritability went up" can't by itself be evidence the intervention failed — say whether you buy that as a sanity check on the whole setup.

  Finally: flag how confident you are in the empirical claims about behaviour genetics you're leaning on (say so if you're unsure rather than guessing), single out the one point you're least sure of, and tell me what would move the final number most — a new empirical result, or an argument about what the quantity means.

  Put the number in \answer{...} on the very last line.
