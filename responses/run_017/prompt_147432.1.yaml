  The pattern feels familiar - it reminds me of slippery slope arguments, but with more nuance. The user has provided two compelling examples: urban planning (where gradual park erosion leads to total loss) and poetic translation (where iterative "improvements" degrade the whole through shifting criteria). 

  Key observations from the query:
  - The user is analytically sharp - they've already identified potential failure modes (threshold effects vs shifting valuation standards)
  - They're unsatisfied with surface-level labels and want conceptual precision
  - Their proposed reverse-chain test shows sophisticated metacognition

  Breaking this down:
  For question 1 about naming, I recall that philosophy has "sorites arguments" (from the heap paradox) that deal with boundary vagueness, but that doesn't cover the translation example where criteria shift. Economics has "path dependence," but that's more descriptive than normative. "Composition fallacy" comes close but isn't perfect. 

  For question 2's diagnosis: The park example does seem like a threshold violation - each step is below the "noticeable loss" threshold, but cumulative effects breach it. The translation case is trickier - it's about inconsistent valuation frameworks across steps. This resembles what psychologists call "preference reversals" in decision theory.

  Question 3 touches on formal properties. Relations that break under chaining are "non-transitive," but that's too broad. "Semi-transitive" might work if we define it properly. The minimal weakening needed would be something like "k-transitivity" where chains longer than k links fail.

  For question 4's reverse-chain test: It's clever but has limitations. A relation can be non-transitive without being symmetric (so reverse chains might fail). Also, path dependence matters - the reverse sequence might not mirror the original process. Still, it's a useful heuristic.

  Question 5 about boundaries is crucial. Legitimate chains require either:
  - Monotonic improvement (each step strictly better)
  - Compensating adjustments (like Pareto improvements)
  - Genuine equivalence

  Whereas illegitimate chains involve:
  - Threshold violations (sorites-type)
  - Valuation drift (changing criteria)
  - Cyclic preferences masquerading as progress

  The user's depth suggests they'll appreciate distinguishing these subtypes rather than a single umbrella term. We should also note that in group decision contexts, this can manifest as "preference cycling" even with rational individuals.
answer: |-
  Your description captures a profound and recurring flaw in comparative reasoning. It lacks a single established name because it manifests differently across disciplines, but we can dissect it precisely. Below is a structured analysis addressing each query, distinguishing subtypes, and proposing terminology.

  ---

  ### **1. Established Names & Literature**  
  This argumentative shape is a hybrid of two recognized patterns:  
  - **The Sorites Paradox (Heap Paradox)** for cases like the park (accumulated imperceptible changes crossing a threshold).  
  - **Path Dependence with Valuation Drift** for cases like the translation (shifting criteria across steps).  

  **Literature**:  
  - **Sorites**: Discussed in philosophy (vagueness, tolerance principles; see Keefe 2000), decision theory (sequential choice anomalies).  
  - **Valuation Drift**: Explored in behavioral economics (preference reversals, Tversky & Kahneman) and ethics (slippery slope arguments, Walton 1992).  
  **Crucially**, your "chaining" move exploits **non-transitivity** in the underlying relation. No single term fully captures both variants, but **"Compositional Fallacy"** (illicitly inferring global properties from stepwise local properties) comes closest for the park case, while **"Criterial Instability"** fits the translation.  

  ---

  ### **2. Diagnosis of Endpoint Divergence**  
  Your distinction is correct:  
  - **Park Case (Threshold Violation)**:  
    - The relation chained is **"not detectably worse"** (a *vague predicate*).  
    - Diagnosis: **Tolerance Principle Collapse** (each step is below the "just noticeable difference" threshold, but cumulative change exceeds it).  
  - **Translation Case (Valuation Drift)**:  
    - The relation chained is **"better by some salient criterion"** at each step, but criteria shift.  
    - Diagnosis: **Incommensurable Tradeoff Chaining** (no consistent metric exists across steps; gains in one dimension mask losses in others).  

  **Why Different?**  
  - Threshold cases fail due to **vague boundaries** (sorites).  
  - Valuation drift fails due to **inconsistent optimization** (each step locally optimal under shifting goals, but globally suboptimal).  

  ---

  ### **3. Formal Properties & Minimal Weakening**  
  - **Term for the Relation**: **Non-Transitive Quasi-Ordering**.  
    - Holds between adjacent pairs (and reflexively) but not over chains.  
  - **Minimal Weakening**:  
    - The relation must violate **transitivity** (if A~B and B~C, then A~C fails).  
    - Formally, it requires **k-step transitivity failure**: transitivity holds for chains ≤ *k* links but fails for *k+1*.  
    - *Example*: "Not detectably worse" may be 5-transitive but not 6-transitive in a specific context.  

  ---

  ### **4. Validity of the Reverse-Chain Test**  
  Your test is **sound but incomplete**:  
  - **Strengths**:  
    - If reverse chains are equally persuasive, it exposes **non-transitive symmetry** (A~B implies B~A), suggesting the relation lacks directional validity.  
    - Reveals whether intermediates were cherry-picked for unidirectionality.  
  - **Weaknesses**:  
    - **False Negatives**: A relation may be genuinely asymmetric (e.g., "strictly better") but still non-transitive (e.g., due to thresholds). Reverse chains would fail, but the original chain remains flawed.  
    - **Path Dependence**: The reverse sequence may not mirror the forward path (e.g., demolishing a clinic to restore a park is harder than building it).  
  **Verdict**: The test detects *some* failures (especially valuation drift) but not all (e.g., pure threshold cases).  

  ---

  ### **5. Boundary: Legitimate vs. Illegitimate Chaining**  
  Legitimacy hinges on **consistency of valuation and monotonicity**:  

  | **Case Type**               | Legitimate? | Distinguishing Features                                  |  
  |-----------------------------|-------------|----------------------------------------------------------|  
  | **Monotonic Improvement**   | Yes         | Each step adds net value; no tradeoffs (e.g., removing errors). |  
  | **Pareto Improvements**     | Yes         | Each step improves at least one dimension without harming others. |  
  | **Negligible Accumulation** | Legit*      | If changes *genuinely* don’t alter value (e.g., microscopic steps in a continuum). |  
  | **Threshold Violation**     | No          | Steps imperceptible alone, but cumulative effect crosses a qualitative boundary. |  
  | **Valuation Drift**         | No          | Criteria shift across steps; no stable utility function. |  
  | **Cyclic Group Preferences**| No          | Arrow’s Theorem: Aggregation of individual rankings creates cycles. |  

  **\*Note**: "Negligible accumulation" is legitimate *only if* no threshold exists (unlike the park).  

  ---

  ### **Proposed Terminology & Definition**  
  Since no term fully covers your observation, I propose:  
  > **Soritic Drift**  
  > *Definition*: A deceptive argumentative pattern where endpoints A and Z are equated (or ordered) via a chain of pairwise comparisons, despite Z being clearly inferior to A in direct comparison, due to either:  
  > (a) **Threshold Erosion**: Accumulation of sub-threshold changes crossing a critical boundary (Sorites subtype), or  
  > (b) **Criterial Flux**: Shifting valuation standards across steps, preventing global optimization (Valuation Drift subtype).  
  > *Excluded*: Chains with monotonic gains, Pareto improvements, or genuinely negligible changes without thresholds.  

  ---

  ### **Why This Fits**  
  - **Sorites** captures threshold-sensitivity (park).  
  - **Drift** implies gradual, directional change with hidden costs (translation).  
  - **Explicitly distinguishes** from valid chaining (e.g., mathematical induction) and mere preference cycles.  

  This carves the concept at its joints, naming the phenomenon while diagnosing its subtypes. Use **Soritic Drift** for the genus, specifying *threshold* or *criterial* subtypes as needed.
