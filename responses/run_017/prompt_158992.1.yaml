prompt: |-
  I work in operations research at a hospital network, and for three years I have been the person who maintains the solver that assigns operating rooms, surgical teams, and recovery beds for the following day. The model is a mixed-integer program, NP-hard by an easy reduction, and yet branch-and-bound closes it to optimality on most nights inside a two-hour window. The failures are a recognizable minority with a particular near-tie structure in the data, and on those nights we ship a solution with a gap we cannot close. This month the same question arrived from two directions in one week. A vendor told our chief financial officer that a quantum optimization service will shortly make this class of problem exactly solvable at scale. Days earlier, one of our data scientists argued in a design review that we should stop maintaining the exact model at all, on the grounds that the problem is NP-hard and exactness is therefore a mirage. I have to answer both people, and I noticed that I do not have anything I would call a theory of what infeasible means. I have habits of speech.

  So before I answer either of them, I want the specification. Write me the desiderata that an account of computational feasibility would have to meet to be fit for my purpose: a notion good enough to guide go/no-go decisions about algorithms inside a real pipeline. Should we keep paying for exact methods, or is that money better spent on heuristics? Does a quantum service change the answer, and by how much? Is a three-percent gap a failure or a result? A notion good enough for that, not a notion good enough to prove theorems about.

  Give each requirement with the case or consideration behind it, and sort them into the ones you take to be non-negotiable and the ones that are preferences of a camp. I have started a list of things I think such an account must be able to do; tell me which of these are genuine desiderata and which are borrowed prejudices of one research tradition:

  1. Say something about the regime I actually live in, where instance size is bounded and known in advance, so an exponential procedure with a small base may beat a polynomial one with a bad exponent and a large constant forever, without the theory being able to call either infeasible.
  2. Distinguish the cost of getting an answer from the cost of getting a certified optimal one, and handle the shape of the returns we observe: the first ninety-seven percent of the gap closes in minutes and the last three percent costs a hundred times the compute.
  3. Handle amortized feasibility, where an enormous one-time cost — tuning a formulation, learning a branching policy, compiling a cut library — is repaid across nightly runs of the same instance family, so that the honest accounting is over a distribution of repeated use rather than a single call.
  4. Be usable epistemically, before I know the complexity class. In practice I never have a hardness theorem for my exact problem; I have one for a neighbor of it, or five years of failed attempts by competent people, or a vendor's assurance. The account has to say what such evidence licenses me to conclude.
  5. Be stable under reasonable changes of encoding and formulation — and here I mean something stronger than unary versus binary, since two ILP formulations of the same problem, or the same problem on trees versus on general graphs, differ by far more than a polynomial in practice — while remaining sensitive enough to instance structure to tell me why Tuesday is hard and Thursday is not.
  6. Be closed in the way working engineers rely on: if I compose feasible procedures, or reduce my problem to one I have already solved, the result should be feasible. Whatever notion you give me, I will use it as a subroutine.
  7. Not collapse the worst case, the typical case, and the adversarial case, and specifically not let a worst-case monster constructed in a hardness proof stand in for the instances a hospital generates.
  8. Grade approximation: it should be able to tell me when there is a fast procedure for a guaranteed near-optimal answer, when near-optimal is as hard as optimal, and when the hardness result is really a signal to relax the objective or remodel the world rather than to give up on solving it.
  9. Price a speedup. It should say why a quadratic improvement leaves my situation essentially unchanged while an exponential one would transform it, and it should be able to do that without depending on unresolved questions about what quantum polynomial time contains.
  10. Say something about the search for algorithms as a computational cost in its own right — automated tuning, portfolio solvers, synthesized code — and about the difference between there being an algorithm and there being one we know, including procedures that are non-uniform or per-instance in a way asymptotics ignores.

  Then do the part I care about most. My suspicion is that some subset of these cannot be had together: that a notion fine-grained enough to be empirically adequate at fixed instance sizes cannot also be robust enough to prove things with or invariant under machine model, and that closure under composition pulls against sensitivity to constants and structure. If that is right, say exactly which requirements conflict and why the conflict is real rather than a matter of taste. If I am wrong and the list is satisfiable, say so. Either way, tell me which single requirement does the most work in excluding candidate accounts, and give me a short scorecard — a few lines each — for the obvious contenders: identifying the tractable with the polynomial-time, parameterized and fixed-parameter notions, average-case and smoothed analyses, approximation-graded accounts, and purely empirical benchmarking of the kind my team already does.

  Commit to a position. Do not hand me the menu and leave me to choose: tell me which requirement you would drop or weaken, what notion survives that pruning, and what I should therefore say to the vendor and to the data scientist, with your reasons. Mark where you are stating something you know with confidence — the closure properties, what is and is not known about quantum speedups — and where you are extrapolating from how practitioners in fact behave, since I would rather have your reasoning with its seams showing than a survey.
reasoning: |-
  We are facing a pragmatic question: what notion of "computational feasibility" should guide decisions in a real-world optimization pipeline? The goal is to evaluate whether to keep using exact methods, switch to heuristics, or adopt quantum services. The desiderata listed are a mix of non-negotiable requirements and preferences. I will first categorize the requirements and then address conflicts and the final recommendation.

  ## Step 1: Categorize the Desiderata

  I classify the desiderata into two categories: non-negotiable (must-haves for any account of feasibility in this context) and preferences (which might be camp-specific but still important).

  ### Non-negotiable Requirements

  These are essential for any account of feasibility that is to be used in a real operational context:

  1. **Instance Size Bounded and Known in Advance (Requirement 1)**: In practice, the problem size (number of surgeries, rooms, etc.) is fixed and known (e.g., a hospital network has a maximum capacity). Therefore, an algorithm that is exponential but with a small base might be feasible. The theory must account for this.

  2. **Distinguish Cost of Answer vs. Certified Optimal (Requirement 2)**: The observed behavior (first 97% gap closes fast, last 3% is expensive) is a reality. The account must handle the diminishing returns in optimization.

  3. **Amortized Feasibility (Requirement 3)**: One-time costs (like tuning) are amortized over many runs. The account must consider the total cost over a distribution of instances (or repeated runs) rather than per instance.

  4. **Usable Epistemically (Requirement 4)**: We don't have a hardness theorem for the exact problem but have evidence (e.g., a similar problem is NP-hard, or years of failed attempts). The account must guide decisions under uncertainty.

  5. **Stable Under Reasonable Changes, Yet Sensitive to Structure (Requirement 5)**: The account must recognize that two ILP formulations can have vastly different performances (even if they are mathematically equivalent) and also explain why some instances (like Tuesday) are hard and others (Thursday) are easy.

  6. **Not Collapse Worst Case, Typical Case, Adversarial Case (Requirement 7)**: The worst-case instances (from hardness proofs) are not representative of the hospital's instances. The account must not let worst-case complexity dominate the decision.

  7. **Grade Approximation (Requirement 8)**: The account must distinguish when:
     - A near-optimal solution is easier to get than an exact one.
     - Near-optimal is as hard as exact.
     - When the hardness result suggests remodeling the problem (e.g., by relaxing constraints).

  8. **Price a Speedup (Requirement 9)**: The account must explain why a quadratic speedup (like from a better classical algorithm) might not change the situation (because it doesn't change the asymptotic class) but an exponential one (like quantum) might. This must be done without relying on unresolved questions (like whether quantum computers can solve NP-hard problems in polynomial time).

  ### Preferences (Camp-Specific)

  These are important but might be handled differently by different approaches:

  9. **Closure Under Composition (Requirement 6)**: While desirable for modularity, it might conflict with the need for sensitivity to constants and structure. In practice, engineers rely on this, but it might be too strong when combined with other requirements.

  10. **Account for Algorithm Search Cost (Requirement 10)**: The cost of developing algorithms (tuning, portfolios, etc.) and the gap between known algorithms and existence is important. However, it might be handled by amortization (Requirement 3) and is more about the process than the feasibility of a single run.

  ## Step 2: Identify Conflicts

  The main conflict is between:

  - **Requirement 6 (Closure under composition)** and **Requirement 5 (Stability and sensitivity)**:
    - Closure under composition requires that if you use feasible subroutines, the whole remains feasible. However, in practice, two formulations of the same problem (e.g., different ILP models) can have very different performances (violating stability in a strong sense). Moreover, the composition might hide constants that make the overall procedure infeasible even if each part is considered feasible by an asymptotic measure.

  - **Requirement 1 (Fixed instance size)** and **Requirement 9 (Pricing speedup without unresolved questions)**:
    - For fixed sizes, an exponential algorithm might be feasible (if the base is small). However, when pricing a speedup (like quantum), we need to compare asymptotics. But if the instance size is bounded, then even an exponential quantum algorithm (if it were to exist for NP-hard problems) might not be needed because the classical method already works. This leads to a tension: the account must both respect the boundedness and yet be able to reason about asymptotic improvements.

  - **Requirement 7 (Separate worst case from typical case)** and **Requirement 4 (Usable epistemically without hardness theorems)**:
    - Without a hardness theorem, we rely on evidence (e.g., similar problems are hard). But if the worst case is not representative, then the evidence from a similar problem might be misleading. We must be able to say that even though a problem is NP-hard, our instances are easy.

  - **Requirement 2 (Cost of certified optimal)** and **Requirement 8 (Grading approximation)**:
    - These are complementary and not conflicting. However, they require a fine-grained account that can model the gap closing behavior and the possibility of using approximation.

  ## Step 3: The Most Excluding Requirement

  The requirement that does the most work in excluding candidate accounts is **Requirement 7: Not collapsing worst-case, typical-case, and adversarial-case**. This requirement forces the account to be instance-specific and data-driven. It rules out:

  - Classical worst-case complexity (asymptotic, polynomial-time): because it is dominated by worst-case instances that do not occur in practice.
  - Many theoretical approaches that do not incorporate the actual instance distribution.

  ## Step 4: Scorecard of Contenders

  Here's a brief evaluation of common approaches:

  1. **Polynomial-Time (P) as Tractable**:
     - **Fails**: Requirements 1 (fixed size), 2 (cost of certified optimal), 3 (amortization), 5 (sensitivity to formulation), 7 (worst-case vs typical), 8 (grading approximation), 9 (pricing speedup without quantum unresolved issues). It is too coarse and asymptotic.

  2. **Parameterized Complexity (Fixed-Parameter Tractable, FPT)**:
     - **Pros**: Addresses Requirement 1 (if the parameter is small and bounded) and Requirement 7 (if the parameter captures the hardness of typical instances).
     - **Cons**: Fails Requirement 5 (sensitivity to formulation: different parameterizations might be needed for different formulations) and Requirement 4 (without a parameter, we are left in the dark). It also does not address Requirement 2 (cost profile) well.

  3. **Average-Case and Smoothed Analysis**:
     - **Pros**: Addresses Requirement 7 (typical case) and Requirement 3 (amortized over a distribution). Can handle Requirement 4 if the distribution is known.
     - **Cons**: Fails Requirement 5 (sensitivity to instance structure: why Tuesday is hard?) because it averages over instances. Also, it requires a distribution, which might be hard to specify. It does not address Requirement 2 (cost of certified optimal) directly.

  4. **Approximation-Graded Accounts**:
     - **Pros**: Addresses Requirement 8 (grading approximation) and Requirement 2 (by allowing near-optimal solutions). 
     - **Cons**: Fails Requirement 4 (if we don't know the approximability) and Requirement 5 (approximation might be formulation-dependent). Also, it does not address the exact case (which is currently working most of the time).

  5. **Empirical Benchmarking**:
     - **Pros**: Meets almost all requirements: it is instance-specific (Requirement 5 and 7), accounts for fixed size (1), can measure cost of optimality (2), amortization (3), and can be used under uncertainty (4). It can also incorporate approximation (8) and measure speedups (9).
     - **Cons**: It is not predictive for new instances or formulations (epistemic challenge in Requirement 4) and does not naturally compose (Requirement 6). Also, it does not provide theoretical guarantees.

  ## Step 5: Resolution of Conflicts and Recommendation

  The conflicts are real, and we cannot satisfy all requirements simultaneously. The most critical conflict is between:

  - **Requirement 6 (Closure under composition)** and **Requirement 5 (Sensitivity to formulation and instance structure)**.

  In practice, closure under composition is less critical than sensitivity to instance structure because:

  - In a real pipeline, we are dealing with a fixed set of instances and formulations. We are not arbitrarily composing algorithms. However, we must explain why the same model runs fast on some nights and slow on others (Requirement 5).

  Therefore, I recommend **dropping Requirement 6 (closure under composition)** as a strict requirement. Instead, we can rely on empirical benchmarking for the entire pipeline, which naturally accounts for the actual performance of the composed system.

  ### The Surviving Notion: Empirical Benchmarking Augmented with Theoretical Insights

  The core of the approach should be **empirical benchmarking** because:

  - It directly measures what matters: the running time and solution quality on the actual instances and sizes we have.
  - It can be extended to include amortized costs (by measuring over many runs) and the cost of certification (by tracking the gap over time).
  - It can be made sensitive to instance structure by collecting features of instances (like "near-tie structure") and building models to predict hardness.
  - It can incorporate approximation by benchmarking heuristics.

  However, to address the epistemic challenge (Requirement 4) and to price speedups (Requirement 9), we augment with:

  - **Theoretical insights**: Using parameterized complexity to identify parameters that correlate with hardness in our instances. Also, using approximation theory to guide when to relax the problem.

  For quantum computing, we note:

  - **Known with confidence**: Quantum computers are not known to solve NP-hard problems in polynomial time (and it is widely believed that they cannot). They offer at most quadratic speedups for general unstructured search (Grover) and exponential speedups for specific problems (like factoring). For optimization, quantum annealing and QAOA are heuristics without guarantees.
  - **Extrapolating from practice**: Current quantum hardware is not ready for problems of this scale. Even if a vendor claims a breakthrough, we must benchmark on our instances.

  ### What to Say to the Vendor and the Data Scientist

  To the **vendor**:
  - We are skeptical of claims that quantum optimization will make NP-hard problems "exactly solvable at scale" because:
    - Quantum computers are not known to solve NP-hard problems in polynomial time (and are not expected to).
    - Our problem instances are of fixed and manageable size for classical methods (most nights). We would require concrete benchmarks on our specific instances (with the same size and structure) showing that the quantum service is faster and more reliable than our current system, including the total cost of ownership (e.g., access fees, development, and maintenance).

  To the **data scientist**:
  - We should not abandon exact methods because:
    - They work well most of the time (within two hours) and produce certified optimal solutions.
    - The failures are recognizable (near-tie structure) and might be addressed by targeted heuristics or by accepting a small gap on those nights.
    - The argument that "NP-hard means exactness is a mirage" is a worst-case asymptotic view that does not reflect our reality (fixed size, typical instances). We have a working system that we can improve incrementally.

  ### Final Position

  **Requirement to drop**: Closure under composition (Requirement 6). The surviving notion is **empirical benchmarking augmented with theoretical insights** (like parameterized complexity and approximation theory) to guide the search for algorithms and to interpret results.

  **Why this works**: It meets the non-negotiable requirements by being grounded in the actual data and context. It allows us to:
  - Continue using exact methods when they work (most nights) and fall back to heuristics when they don't.
  - Evaluate quantum services by benchmarking on our instances.
  - Justify the 3% gap as an acceptable result on the hard nights (if the gap is small and the solution is good enough).

  This approach is what practitioners in fact do: they rely on empirical evidence and use theory as a guide, not a straitjacket.
answer: |-
  ### Desiderata for Computational Feasibility in Practice  
  Below, I categorize your requirements into **non-negotiable** (essential for real-world decisions) and **preferences** (valuable but subject to trade-offs). I then identify conflicts, pinpoint the most excluding requirement, scorecard existing approaches, and commit to a position.  

  ---

  #### **Categorization of Requirements**  
  **Non-Negotiable** (must be met for credible guidance):  
  1. **Fixed instance size & small-base exponentials** (Req 1):  
     Hospital instances are bounded (e.g., 50–100 surgeries/night). An algorithm with a small exponential base (e.g., \(O(1.1^n)\)) may dominate a polynomial one with huge constants. Ignoring this invalidates decisions.  
  2. **Cost of optimality certification** (Req 2):  
     The diminishing returns in MIP solvers (e.g., 97% gap closed quickly, last 3% costly) dictate whether exact methods are worth it. A theory must model this cost curve.  
  3. **Amortized feasibility** (Req 3):  
     One-time costs (e.g., solver tuning) are amortized over nightly runs. Feasibility must account for lifetime value, not per-instance cost.  
  4. **Epistemic usability without hardness proofs** (Req 4):  
     Proofs for your exact problem don’t exist; you have proxies (e.g., NP-hardness of a "neighbor" problem). The account must quantify risk from such evidence.  
  5. **Sensitivity to instance structure** (Req 5, part):  
     Must explain why "Tuesday is hard and Thursday is not" (e.g., near-tie structures). Asymptotic equivalence between formulations is irrelevant; performance differences are empirical facts.  
  6. **Separation of worst-case/typical-case** (Req 7):  
     Worst-case monsters from hardness proofs ≠ hospital instances. Collapsing them misleads (e.g., rejecting exact methods due to rare failures).  
  7. **Grading approximation** (Req 8):  
     Must distinguish when:  
     - Near-optimal is easier (e.g., 3% gap acceptable with heuristics).  
     - Near-optimal is as hard as exact (e.g., gaps persist due to adversarial structure).  
     - Remodeling is better than solving (e.g., relax "recovery bed" constraints).  

  **Preferences** (camp-dependent; useful but negotiable):  
  - **Stability under formulation changes** (Req 5, part):  
    While sensitivity to structure is non-negotiable, *invariance* across formulations (e.g., ILP vs. graph-based) is less critical. Practitioners optimize formulations empirically.  
  - **Closure under composition** (Req 6):  
    Desirable for modularity but conflicts with sensitivity to constants/structure (e.g., composing "feasible" subroutines may blow up constants).  
  - **Pricing speedups** (Req 9):  
    Quadratic vs. exponential improvements matter, but quantum’s unresolved limits (e.g., BQP vs. NP) make this fuzzy.  
  - **Algorithm search cost** (Req 10):  
    Important but handled via amortization (Req 3) and empirical benchmarking.  

  ---

  #### **Conflicts Between Requirements**  
  The requirements **cannot all be satisfied simultaneously**. Two conflicts are unresolvable:  
  1. **Closure under composition (Req 6) vs. Sensitivity to constants/structure (Req 1,5,7):**  
     Closure assumes composing "feasible" blocks preserves feasibility. But sensitivity demands that constants, instance structures, and formulation quirks dominate decisions. In practice, composing two routines with "feasible" asymptotic runtimes (e.g., \(O(n^2)\) each) may yield \(O(n^4)\) with prohibitive constants. Worse, branching policies tuned for your "Tuesday" instances may fail on "Thursday" after composition. Closure is a theoretician’s ideal; engineers measure end-to-end performance.  

  2. **Fixed instance size (Req 1) vs. Pricing speedups (Req 9):**  
     Pricing speedups requires asymptotic reasoning (e.g., exponential quantum speedup). But with bounded \(n\), a \(O(1.01^n)\) classical solver may beat a \(O(n)\) quantum one. Worse, "exponential quantum speedup" assumes unbounded \(n\), which doesn’t apply to your fixed-size domain.  

  **The most excluding requirement is Req 4 (epistemic usability without hardness proofs)**. It forces the account to:  
  - Handle uncertainty (e.g., "NP-hard neighbor problem" as proxy).  
  - Work when no theorem exists (e.g., vendor claims).  
  - Avoid false negatives (e.g., abandoning exact methods due to heuristic NP-hardness folklore).  
  This excludes rigid theoretical accounts (e.g., polynomial-time tractability) and purely empirical ones (e.g., benchmarking alone).  

  ---

  #### **Scorecard of Contenders**  
  | **Approach**               | **Strengths**                                  | **Weaknesses**                                  | **Verdict**                         |  
  |----------------------------|----------------------------------------------|-----------------------------------------------|-------------------------------------|  
  | **Polynomial-time (P)**    | Clean closure (Req 6); theoretical proofs.   | Fails Req 1,2,3,5,7,8. Ignores constants, certification cost, and instance structure. Useless for bounded \(n\). | Unfit: Asymptotics irrelevant here. |  
  | **Parameterized (FPT)**    | Addresses Req 1 (if parameter small, e.g., tree-width). | Fails Req 4,5,7: Choosing parameters is art; hospital instances lack exploitable structure. Tuesday/Thursday variation unexplained. | Marginal: Noisy for your data.     |  
  | **Average-case/smoothed**  | Addresses Req 3,7 (amortized over distributions).       | Fails Req 4,5: Requires known distributions; can’t explain per-instance hardness (e.g., near-ties). Assumes adversaries don’t tailor inputs. | Partial: Needs empirical calibration. |  
  | **Approximation-graded**   | Addresses Req 2,8 (cost of certification; gaps).       | Fails Req 1,4: Bounded \(n\) breaks asymptotic ratios; no guidance without hardness proofs. Ignores why exact works on Thursdays. | Useful but incomplete.              |  
  | **Empirical benchmarking** | Addresses Req 1,2,3,5,7 (measures real runtimes, gaps, and structure). | Fails Req 4,9: Can’t price quantum without extrapolation; no risk assessment for "NP-hard neighbor" evidence. | Best foundation but needs augmentation. |  

  ---

  #### **Commitment: The Surviving Notion**  
  **Drop closure under composition (Req 6)**. It conflicts with sensitivity to constants/structure and is less critical than epistemic usability (Req 4). The **augmented empirical benchmarking** account survives:  
  - **Core**: Benchmark exact/heuristic/quantum solvers on historical hospital data (size, near-tie structures, etc.).  
  - **Augmentations**:  
    1. **Amortized cost modeling**: Compute total cost (tuning + nightly runs) over 1–5 years.  
    2. **Gap-aware thresholds**: Accept gaps ≤3% as "feasible" on hard nights (Req 2,8).  
    3. **Instance-structure dashboard**: Use ML to flag "Tuesday-like" instances for heuristic fallback.  
    4. **Epistemic risk scores**: Quantify evidence (e.g., "NP-hard neighbor" → 70% risk of occasional gaps; "5 years of failures" → 90% risk).  

  **Why this works**:  
  - Meets non-negotiables: Bounded size (Req 1), certification cost (Req 2), amortization (Req 3), instance structure (Req 5,7), and approximation (Req 8).  
  - Addresses Req 4 (epistemic usability): Risk scores turn vague evidence into decisions.  
  - Handles Req 9 (quantum): Benchmarks on your instances trump asymptotic claims.  
  - Pragmatic: Aligns with how OR teams actually work.  

  ---

  #### **What to Say to the Vendor and Data Scientist**  
  **To the vendor (quantum service):**  
  > *"Our feasibility model requires evidence that quantum optimization outperforms our MIP solver on our specific instances (≤100 surgeries) and cost structure. Current quantum hardware cannot handle problems of this scale. Even if scaled, Grover-style search offers only quadratic speedups—irrelevant for our bounded \(n\)—and QAOA has no guarantees. Demonstrate a 30% cost reduction in our amortized model (including tuning and nightly runs), or we cannot justify the switch. Until then, this is a speculative expense."*  
  > **Confidence**: High. Based on known quantum limitations ([BQP vs NP](https://arxiv.org/abs/2209.06930) and your small \(n\).  

  **To the data scientist (abandon exact methods):**  
  > *"NP-hardness is not a universal veto. Our exact solver works for 95% of instances within 2 hours because (1) hospital sizes are bounded, (2) amortized tuning costs are low, and (3) ‘hard’ nights have recognizable structure. Abandoning certification forfeits optimality on easy nights and invites ethical risks (e.g., suboptimal OR assignments). Instead, we’ll:  
  > - Keep the exact solver for instances where it closes fast.  
  > - Use heuristics with ≤3% gaps only on ‘Tuesday-like’ nights.  
  > - Build a digital twin to simulate formulation changes (Req 8)."*  
  > **Confidence**: High. Based on 3 years of operational data and the pitfalls of worst-case dogma.  

  **Final note**: The 3% gap is a **result**, not a failure. It reflects the cost of certification on pathological instances—a price worth paying when amortized over many successes.
