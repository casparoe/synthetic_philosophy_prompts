  Below is a taxonomy tree for Buddhist ethics based on your requirements. The tree starts with foundational claims and branches through binary choices, leading to 7 terminal positions (leaves). Each branch is labeled with a claim that can be accepted or rejected without prior knowledge of philosophical labels. Empty cells are marked and explained. Cases (ship's captain, gift karmic fruit, accidental insect, lone arhat) are addressed implicitly in the leaf descriptions.  

  ### **Taxonomy Tree of Buddhist Ethics**  
  **Root Claim**: Ethical prescriptions in Buddhism are fundamentally about reducing suffering.  

  1. **Is the primary motive for ethical action the agent's own long-term karmic outcome?**  
     - **Yes** → *Branch 1.1*: Ethical rules are tools to optimize the agent's future mental states (e.g., avoiding rebirth in lower realms).  
       - *Leaf 1: **Prudential Karmic Ethics***  
         - *Most awkward commitment*: Prohibits killing a murderous captain to save others, as it generates bad karma for the agent regardless of net suffering reduced.  
     - **No** → Ethical action is grounded in consequences beyond the agent's karma. Proceed to 2.  

  2. **Is the cessation of suffering for *all sentient beings* the only intrinsic good?**  
     - **No** → *Branch 2.1*: Other goods exist (e.g., virtues like wisdom), but they are secondary to suffering reduction.  
       - *Empty*: Incoherent in Buddhism, as canonical texts treat suffering cessation as the sole ultimate good.  
     - **Yes** → Suffering cessation is the sole good. Proceed to 3.  

  3. **Is the rightness of an act determined solely by the *intention* behind it?**  
     - **Yes** → *Branch 3.1*: Outcomes are irrelevant; only the agent's mental state at the time of acting matters.  
       - *Leaf 2: **Intention-Based Minimization***  
         - *Most awkward commitment*: Judges accidentally stepping on an insect as morally neutral (no harmful intent), even if it foreseeably causes net suffering.  
     - **No** → Outcomes matter. Proceed to 4.  

  4. **Do the precepts (e.g., non-killing) have absolute authority, or are they summaries of typical suffering-reduction?**  
     - **Absolute** → *Branch 4.1*: Precepts bind regardless of consequences.  
       - *Empty*: Untried in Buddhism, as no major tradition treats precepts as exceptionless duties.  
     - **Summaries** → Precepts are heuristic guides. Proceed to 5.  

  5. **For a liberated being (e.g., arhat), is there still a correct answer to "what should I do?"?**  
     - **Yes** → *Branch 5.1*: Liberation doesn’t nullify ethical assessment.  
       - *Leaf 3: **Impartial Suffering-Consequentialism***  
         - *Most awkward commitment*: Obliges the lone arhat to kill kitchen ants to minimize suffering, even with no witnesses or karma.  
     - **No** → Liberation transcends ethics. Proceed to 6.  

  6. **Can precepts be overridden by compassion for others' welfare?**  
     - **Yes** → *Leaf 4: **Compassionate Consequentialism***  
       - *Most awkward commitment*: Permits killing the captain to save lives, but risks arbitrariness in weighing "greater good."  
     - **No** → Precepts reflect inviolable virtues. Proceed to 7.  

  7. **Does ethics require impartial concern for all sentient beings?**  
     - **Yes** → *Leaf 5: **Impartial Character Ethics***  
       - *Most awkward commitment*: Demands equal concern for strangers and family, conflicting with natural partiality in texts.  
     - **No** → Partiality to kin/community is permitted.  
       - *Leaf 6: **Partial Character Ethics***  
