  4. **Compassionate Consequentialism** (from 6)  
     - *Case handling*: Captain killing permitted (compassion overrides precept); gift fruit irrelevant; arhat’s actions moral only if affecting others.  
  5. **Impartial Character Ethics** (from 7)  
     - *Case handling*: Captain killing forbidden (violates virtue); gift fruit irrelevant (focus on giver’s virtue); arhat refrains naturally (virtue expresses non-harming).  
  6. **Partial Character Ethics** (from 7)  
     - *Case handling*: Similar to Leaf 5 but permits partiality; arhat refrains due to virtue, not impartiality.  

  ### **Key Observations**  
  - **Empty Cells**: Marked as incoherent, unattractive, or untried (e.g., absolute precepts conflict with Buddhism’s contextualism).  
  - **Verbal Differences**: "Impartial Suffering-Consequentialism" (Leaf 3) and "Compassionate Consequentialism" (Leaf 4) differ only in scope—both are outcome-focused but Leaf 4 explicitly licenses rule-breaking.  
  - **Lone Arhat Case**:  
    - *Consequentialist leaves* (3–4): Arhat’s actions are assessable; killing ants reduces suffering, taking ownerless items is neutral.  
    - *Character-based leaves* (5–6): Arhat’s actions express virtue (non-greed/non-harm) and are non-assessable "beyond ethics."  
