  ### **Leaf Summaries**  
  1. **Prudential Karmic Ethics** (from 1.1)  
     - *Case handling*: Gift karmic fruit varies with recipient (focus on agent's merit); accidental insect not wrong (no intent); arhat’s actions non-moral (no karma).  
  2. **Intention-Based Minimization** (from 3.1)  
