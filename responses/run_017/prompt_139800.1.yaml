prompt: |-
  I need to draft the next entry in a document my lab maintains, and I would like your help with the ruling itself rather than with background: please do not give me references or a reading list, and reason from the distinctions and the case record below.

  Our group (vertebrate functional morphology) keeps a standing verdict list for every trait we publish on. Our four categories, as we use them: adaptation — the trait was shaped by selection for the effect it now has; exaptation — it now matters to fitness but was not built by selection for that role, having been co-opted from something else; spandrel — a structural consequence of selection on something else, with no role of its own; unresolved. We have also occasionally used aptation for an exaptation subsequently modified by selection for its new role, without ever fixing when the promotion is earned.

  Seven precedents, all agreed, with the reasoning my supervisor recorded:

  1. The male nipple — spandrel. No current role; a consequence of the early developmental program shared with females.
  2. The human chin — spandrel. Buttressing and speech stories rejected; the chin is what is left over when the tooth-bearing part of the mandible retracts faster than the basal bone.
  3. The antlers of the giant deer — spandrel, over one dissent. Current utility for display and combat, extraordinary complexity, but size tracks body size across the clade with no residual once size is controlled, and the combat story predicts a shape they do not have. The note attached to the ruling says explicitly that current utility plus elaborate form is not enough.
  4. Feathers — exaptation. Insulation and display before flight. The ruling recorded, and explicitly declined to resolve, whether the flight-specific refinements (the asymmetric vane, the locking barbules) convert part of the complex into an adaptation.
  5. The radial sesamoid that makes up the panda's false thumb — exaptation. It strips bamboo now; the design is workmanlike rather than good; at origin it was an ordinary wrist element, and we found no evidence of later selection refining it specifically for stripping.
  6. The pharyngeal jaw apparatus of the cichlid radiations — adaptation. Repeated independent modification tracking diet, a derived state that outperforms the ancestral one at the same task, and no allometric or developmental alternative on offer.
  7. The lens crystallins that several vertebrate lineages have recruited from ordinary metabolic enzymes to serve as structural lens proteins — exaptation, with the note that at this level the verdict attaches to a use of the molecule rather than to the molecule.

  The new case. *Fossoriscincus* is a clade of fourteen head-first burrowing skinks. In all of them a bony flange roofs the orbit and anchors a sheet of connective tissue that transmits force from the jaw adductors to the snout; cutting that sheet, flange left intact, abolishes the force gain, and strain gauges show that at a given head width, species with longer flanges bite harder while burrowing. The flange's internal trabeculae are aligned with the measured principal strain directions, in the way trabecular bone elsewhere aligns with load. In field enclosures, removing the flange lowers burrowing rate and eight-week survival by a margin that is significant but modest.

  Developmentally and phylogenetically, though, the flange is what you get when an enlarged nasal capsule crowds the orbit: outgroup species with the largest capsules have a flange but no connective sheet, and no species has a long flange on a small capsule. The enlarged capsule is itself an adaptation, for chemosensory navigation underground. The sheet's attachment to the flange is a derived state at the base of the clade. A genome scan finds a recent selective sweep at a locus affecting flange projection; capsule volume and flange length are strongly genetically correlated (r_g about 0.8), although at least two loci move flange length independently of capsule volume. Whether the sweep predates or postdates the clade's shift into compacted soils is not resolved; the estimate straddles it.

  What I want, in prose of roughly 700 to 800 words:

  (a) The verdict you recommend and the one you think my supervisor will actually give, if the two differ, with the closest precedent identified and an honest account of how much work that precedent is really doing.

  (b) The candidate rules that fit the whole track record above — at least three, stated sharply enough that another person could apply them to a new trait rather than merely name them.

  (c) What each rule predicts about the flange, and precisely where they come apart.

  (d) If our precedents genuinely underdetermine the case, what principle we would be adopting with each live option, and whether any earlier verdict — the reservation in 4, the antlers in 3, the crystallins in 7 — would have to be reopened as a result.

  (e) The single further finding about *Fossoriscincus*, or the single further case, that would most decisively separate the leading rules, and why that one rather than its nearest competitors.

  Assume I know the adaptationist research program and the spandrels critique, including the charge that carving an organism into discrete traits already stacks the deck; you need not summarise either. And do not settle the case by appeal to what any particular author has said about such cases — I need the argument, and I need it to be one we could defend in our own terms.
reasoning: |-
  Okay, the user is working on classifying a new trait for their lab's verdict list. They've provided detailed precedents and the new case about the bony flange in burrowing skinks. Let me start by understanding the categories: adaptation, exaptation, spandrel, and unresolved. The new trait involves a flange that enhances biting force during burrowing, but its origin is tied to an enlarged nasal capsule for chemosensory navigation.

  First, I need to determine the verdict. The flange currently has a functional role in burrowing, supported by strain data and functional tests. However, its development is linked to the nasal capsule adaptation. The precedents are crucial here. The antlers case (3) shows that current utility and complexity aren't enough if size correlates with body size without specific adaptation. Feathers (4) were exapted for flight from insulation. The panda's thumb (5) is exaptation because it's co-opted without refinement. The cichlid jaw (6) is adaptation due to independent modifications and performance improvements.

  The flange seems like an exaptation initially because it originated from the nasal capsule crowding. But there's a selective sweep affecting flange projection and genetic correlation. The connective sheet is derived, indicating some adaptation. This is similar to feathers where refinements weren't resolved. The user's supervisor might lean towards exaptation, but the selective sweep complicates things.

  Next, candidate rules. Rule A: Adaptation requires derived modifications specifically for the current function. Rule B: Exaptation if current function uses a pre-existing structure without significant modification. Rule C: Spandrel if no current function, only structural byproduct. Rule D: Aptation if exaptation followed by refinement. 

  Applying these: Rule A might see the flange as adaptation because of the derived sheet and selective sweep. Rule B sees it as exaptation because the flange's origin is developmental crowding. Rule D could apply if the sweep refined the trait. Rule C doesn't fit since there's current function.

  The precedents underdetermine because feathers had unresolved refinements, and antlers rejected adaptation despite utility. The flange's selective sweep might tip it towards aptation. To resolve, they need to know if the sweep targeted burrowing-specific refinements. Testing mutations affecting flange length independently could show if selection acted on burrowing function.

  The user needs a defensible argument without outside references. They might be preparing for internal debate or publication, so clarity and consistency with their framework are key. Highlighting where rules conflict and what evidence is missing will strengthen their case.
answer: |-
  Here is a draft entry for the *Fossoriscincus* orbital flange, structured as requested:

  **(a) Verdict Recommendation & Prediction**

  *   **My Recommendation:** **Exaptation** (with aptation a strong contender needing resolution).
  *   **Predicted Supervisor Verdict:** **Exaptation**.
  *   **Closest Precedent:** **Feathers (Case 4)**.
  *   **Work the Precedent Does:** Feathers exemplifies a trait complex co-opted for a new function (flight) from an ancestral role (insulation/display). Crucially, the ruling explicitly declined to resolve whether subsequent *refinements* for the new function (asymmetric vane, barbules) constituted adaptation *within the exapted complex*. The *Fossoriscincus* flange parallels this: the bony structure itself originated as a structural consequence (spandrel) of selection for an enlarged nasal capsule (chemosensory adaptation), clearly not *for* burrowing mechanics. The derived connective tissue sheet represents its co-option (exaptation) for force transmission. Like the feather refinements, the genetic sweep and potential for independent loci modifying flange length *could* represent adaptive refinement (aptation) for its burrowing role. Precedent 4 shows we can call the core co-option event "exaptation" while leaving the status of later modifications unresolved. Precedent 5 (Panda's Thumb) reinforces that a "workmanlike" co-option without evidence of *specific* refinement remains exaptation. Precedent 3 (Antlers) warns that current utility and even genetic correlation (like body size correlation there) aren't sufficient for "adaptation" without evidence the trait's form was *shaped* for that utility beyond correlated allometry.

  **(b) Candidate Rules (Stated Sharply)**

  1.  **Rule A (Direct Shaping):** Label **Adaptation** *only* if the trait's defining derived characteristics (form, structure, integration) demonstrably arose via selection *specifically acting* to enhance its *current primary fitness-enhancing effect*. Co-option or prior history is irrelevant if the current form is a direct product of selection for its current role. (Primary Support: Cichlid Jaws - Case 6).
  2.  **Rule B (Co-option Primacy):** Label **Exaptation** if the trait's current fitness contribution relies on a structure that existed prior to (or arose independently of) selection for that specific contribution, *and* there is insufficient evidence that its *current specific form* (beyond mere presence) was subsequently modified by selection *for that role*. Evidence of *some* later selection does not override the primacy of co-option without proof it shaped the functionally relevant form. (Primary Support: Panda's Thumb - Case 5, Feathers (core ruling) - Case 4, Crystallins - Case 7).
  3.  **Rule C (Developmental Byproduct):** Label **Spandrel** *only* if the trait demonstrably has *no current fitness consequence* (neutral or effectively neutral) and arises solely as an inevitable structural consequence of direct selection acting on a developmentally or structurally linked trait. Current neutrality is paramount. (Primary Support: Male Nipple - Case 1, Human Chin - Case 2).
  4.  **Rule D (Co-option + Refinement = Aptation):** Label **Aptation** if the trait (i) was co-opted for its current role from a different ancestral function/structure (exaptation criterion met), *and* (ii) subsequently underwent modification via selection *directly targeting* features that enhance its performance *in that new role*, demonstrably refining its form for the new function beyond the initial co-opted state. (Implicit in Feathers reservation - Case 4, needed resolution for Panda's Thumb - Case 5).

  **(c) Rule Predictions & Divergence for the Flange**

  *   **Rule A (Direct Shaping):** Predicts **Adaptation**. *Reasoning:* The flange-sheet complex *currently* enhances burrowing performance and fitness. Key derived features (connective tissue sheet attachment, trabecular alignment matching strain, potentially independent genetic loci for flange length) appear *specifically suited* to force transmission for burrowing. The selective sweep suggests recent selection acting on flange projection, plausibly for burrowing. The trait's form seems shaped for its role. *Divergence Point:* Requires dismissing the flange's *origin* as a structural byproduct of nasal capsule enlargement as irrelevant to classifying its *current, derived* functional state.
  *   **Rule B (Co-option Primacy):** Predicts **Exaptation**. *Reasoning:* The bony flange structure originated unequivocally as a spandrel of selection for chemosensory navigation (nasal capsule). It was co-opted (via the derived connective sheet) for burrowing. While there's evidence of *some* selection (sweep) and potential for independent modification, it's insufficient to prove the *functionally critical aspects of its form* (beyond its mere presence/length correlated with capsule) were *shaped specifically for burrowing*. The modest fitness effect of removal and the strong genetic correlation with capsule volume suggest the form may still be largely constrained by its developmental origin. *Divergence Point:* Requires viewing the evidence of selection/modification as insufficient to override the primacy of the co-option event and developmental constraint.
  *   **Rule C (Developmental Byproduct):** Predicts **Exaptation or Spandrel (Rejects Spandrel)**. *Reasoning:* Spandrel is ruled out because the flange-sheet complex *has* a demonstrated, significant (if modest) current fitness role in burrowing. Rule C explicitly requires no current role. *Divergence Point:* Clear from fitness data.
  *   **Rule D (Co-option + Refinement = Aptation):** Predicts **Aptation** *if* the selective sweep/modifications targeted burrowing-specific refinements; otherwise **Exaptation**. *Reasoning:* The co-option (exaptation) step is met (flange co-opted via sheet). The key question is whether the sweep/loci represent selection *specifically refining the flange/sheet for burrowing efficiency* (e.g., optimizing trabecular density/orientation, sheet attachment geometry, flange length *independently* of capsule volume constraints) rather than just maintaining correlation or incidental changes. *Divergence Points:* From Rule B: Whether the modifications are "sufficient" and specifically *for* the new role. From Rule A: Whether the *origin* of the structure matters for the label once refinement occurs.

  **(d) Underdetermination and Principle Adoption**

  The precedents genuinely underdetermine the case regarding **Exaptation vs. Aptation** (and arguably vs. Adaptation under Rule A). The sticking point is the **interpretation and sufficiency of the evidence for post-co-option refinement** (selective sweep, genetic loci, trabecular alignment).

  *   **Adopting Exaptation (Rule B):** Principle: Co-option is the defining event; subsequent modification requires *strong, specific evidence* of form being *reshaped* for the new function to change the label. Burden of proof is high for promotion to aptation. Earlier verdicts stand: Feathers (4) correctly left refinement unresolved; Panda's Thumb (5) correctly noted lack of refinement evidence; Antlers (3) correctly rejected adaptation despite utility/modification evidence; Crystallins (7) remains exaptation (use-based).
  *   **Adopting Aptation (Rule D):** Principle: Significant post-co-option selection *specifically refining* the trait for its new role warrants a distinct label (aptation), signifying evolutionary transition beyond initial co-option. This would **require reopening the Panda's Thumb (5)** verdict. If a "workmanlike" co-option without refinement evidence is exaptation, but a co-option *with* evidence of refinement (like the flange's sweep/trabeculae) is aptation, then the Panda verdict needs reassessment: *was there truly no refinement evidence, or was it insufficient by this new standard?* Feathers (4) reservation is validated but resolved (refinements *would* make it aptation). Antlers (3) and Crystallins (7) are unaffected.
  *   **Adopting Adaptation (Rule A):** Principle: Current function and evidence of form-function match trump historical origin if the form was shaped for the role. This would **force reopening virtually every exaptation verdict (4,5,7)** and possibly spandrels with utility (like antlers - 3, though ruled spandrel on other grounds). Feathers would become adaptation (flight refinements); Panda's Thumb might become adaptation if its form is deemed "shaped for stripping"; Crystallins might become adaptation if recruitment involved selection for structural properties. This fundamentally shifts the framework's emphasis from historical origin to current utility and selective maintenance.

  **(e) Decisive Further Finding**

  *   **Finding:** **Functional consequences of mutations at the swept locus (or independent loci) affecting flange length/projection *independent of nasal capsule volume*.** Specifically: Do mutations *reducing* flange length while *maintaining* normal nasal capsule volume significantly impair burrowing performance and fitness? Conversely, do mutations *increasing* flange length (without changing capsule) enhance performance in compacted soils?
  *   **Why Decisive:**
      *   **Rules B vs. D (Exaptation vs. Aptation):** If flange length can be decoupled from capsule volume *and* changes directly impact burrowing fitness, it provides strong evidence that selection *can* and *has* acted *specifically on the flange's morphology for its burrowing role*, satisfying Rule D's refinement criterion. If length changes independent of capsule have *no* significant effect on burrowing performance/fitness, it supports Rule B – the length is incidental, constrained by correlation, not refined for burrowing.
      *   **Rule A (Adaptation):** Positive results would strongly support Rule A (direct shaping for current role). Negative results would severely undermine it.
      *   **Why not competitors?** Knowing *when* the sweep occurred relative to the soil shift (current uncertainty) is less direct – a post-shift sweep could still be for something else; a pre-shift sweep could still be exaptive if the trait wasn't functional yet. Precise fitness effect sizes of flange removal are known but modest; the key gap is evidence linking *specific morphological variation* (flange length decoupled from origin) to *specific functional performance* in the new role. Trabecular alignment is consistent with adaptation/refinement but could reflect developmental constraint or incidental loading; genetic manipulation tests causal functional links. Correlating flange length with soil compactness across species is suggestive but confounded by phylogeny and capsule size correlation; the genetic test isolates the variable.

  **Draft Verdict Entry (Concisely):**

  > **Trait:** Orbital flange and associated connective tissue sheet for force transmission during head-first burrowing in *Fossoriscincus* skinks.
  > **Verdict:** **Exaptation**.
  > **Reasoning:** The bony flange structure originated as a direct structural consequence (spandrel) of selection for an enlarged nasal capsule (adaptation for chemosensory navigation). Its co-option for a novel biomechanical role in burrowing, via the derived connective tissue sheet attachment, constitutes exaptation. While the complex demonstrably enhances burrowing performance and fitness, and evidence exists of selection (sweep) and potential modification (trabecular alignment, possible independent loci), it is insufficient to demonstrate that the *specific form of the flange* was subsequently *reshaped by selection specifically for optimizing its burrowing function* beyond constraints imposed by its developmental origin (strong genetic correlation with capsule volume). The core event is co-option of a pre-existing structure. (See precedents 4 (Feathers - core co-option), 5 (Panda's Thumb - co-option without clear refinement), 7 (Crystallins - use-based co-option)). Status of potential refinements remains unresolved, analogous to precedent 4. Further functional genetic testing is warranted to resolve potential aptation.
