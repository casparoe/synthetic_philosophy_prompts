prompt: |-
  I have to run a ninety-minute evening session on the Frege–Geach problem for expressivism with a group of software engineers who read moral philosophy for pleasure but have no formal logic and no metaethics. Don't explain the argument to me; plan how I should get them to see it.

  The frame I want to try, which you should tell me to drop if it's wrong: I want to present the problem as a failure of compositionality rather than as a worry about whether moral sentences can be true. On the expressivist picture a moral clause seems to have something like an effect where a semantic value is needed, and the trouble appears when the clause is embedded in a context that consumes values — the antecedent of a conditional, the scope of a negation, a question — so that what the clause does when asserted is not what is being done with it there. I'm hoping this audience grasps the shape of the problem faster that way than via the usual route.

  Give me the order the pieces have to come in, and what depends on what. In particular: should the requirement that a solution assign the clause the same attitude in embedded and in unasserted occurrence be stated up front, as the standard any solution must meet, or does it only become intelligible once they have already felt the problem? And where does negation go relative to embedding, and must one precede the other?

  One example should carry the whole session. My constraint on it: the embedded moral clause must not be paraphrasable as a report of the speaker's own present attitude, or the expressivist gets an easy out that stops the argument biting. What else must the example have, what must it lack, and where do I first use it and then reuse it?

  Then the misconceptions, in the order I should expect them, each with the point in the sequence where I head it off. Mine are: that expressivism is the view that moral sentences are meaningless or merely emotive; that the difficulty is just that moral claims cannot be true; that the fix is simply to let moral clauses express attitudes and also be true; and that handling negation settles embedding. Correct whichever of those are wrong, and tell me which ones this audience will form because of the code analogy rather than despite it.

  Finally: one question for the last ten minutes whose answer would show me the problem has landed rather than that they have memorised a slogan, and one thing I should openly refuse to go into at this level.

  Be blunt where you are guessing. If the compositionality framing is confused, or the effect/value analogy will mislead this audience more than it helps, say so plainly instead of planning me a session around a bad idea. And mark the step you would most expect to fail in the room, with what you would fall back on.
reasoning: |-
  Okay, the user is planning a session on the Frege-Geach problem for expressivism, targeting software engineers who read moral philosophy for fun but lack formal logic and metaethics. They want to frame it as a compositionality failure rather than a truth problem. Let me unpack their query.

  First, the user’s main goal is to make the problem tangible without getting bogged down in technical jargon. The compositionality angle is smart because software engineers deal with function composition and context in code. That analogy could bridge the gap. But I need to check if this framing holds water. Compositionality in semantics means the meaning of a whole comes from its parts and their structure. Expressivism assigns non-truth-conditional content to moral claims, like emotive force. When embedded, that force doesn’t fit the structural context, causing a mismatch. That seems solid.

  The user mentioned avoiding paraphrases that refer to the speaker’s current attitude. That’s crucial because otherwise, expressivists can dodge by saying embedded clauses describe attitudes. The example needs to be something like "If lying is wrong, then getting little brother to lie is wrong." Here, the antecedent isn’t about the speaker’s current feelings but a general moral claim. 

  Next, the sequence. Starting with assertion makes sense. Show how "Lying is wrong" expresses disapproval. Then introduce negation: "Lying is not wrong" as withholding disapproval. But negation is still unasserted here. Embedding comes next with conditionals. The problem arises because the antecedent isn’t used to express disapproval but as a condition. The attitude expression doesn’t compose like truth values do. 

  I need to ensure that the requirement for a unified account of embedded/unembedded clauses isn’t stated upfront. Let the audience feel the problem first. After showing the conditional, highlight the inconsistency: why can’t the same attitude expression work both when asserted and embedded? Then reveal that expressivism lacks a compositional account. 

  Misconceptions: The user listed a few. Software engineers might confuse expressivism with emotivism (moral sentences as meaningless emotions). Clarify early that expressivism is about meaning as use, not truth. Another pitfall: thinking the solution is adding truth values. But that undermines expressivism’s core. Also, handling negation alone doesn’t solve embedding—conditionals are trickier. Since engineers know code, they might overextend the analogy. Warn them that functions must handle any context, not just negation.

  For the assessment question, asking them to explain why "if" requires a truth-evaluable input, and how expressivism fails there, would test understanding. Avoid discussing solutions like hybrid theories to keep focus. 

  The step most likely to fail is grasping why attitude expression can’t embed. Engineers might think it’s solvable with function composition. Have a fallback: compare to a function that only works at top-level, failing when nested. Emphasize that attitudes are actions, not values that can be passed around. 

  Overall, the user’s approach seems viable. The compositionality frame should resonate with engineers. Just need to watch for coding analogies leading astray and clearly distinguish use versus mention. Keep examples consistent and highlight the structural mismatch step-by-step.
answer: |-
  Here's a battle-tested plan leveraging your compositionality framing, designed for software engineers. Ditch the "truth" talk entirely. **Your frame is excellent and far more intuitive for this audience.** Forget truth-conditions; focus on semantic values and functional application.

  **Order of Operations (90 Mins):**

  1.  **Groundwork: Expressivism & Assertion (10 mins)**
      *   **Goal:** Establish expressivism *without* logic or jargon. Focus on "what it does."
      *   **Action:** "Expressivism: Moral sentences aren't *describing* facts about the world like 'The cat is on the mat'. Saying 'Lying is wrong' is *doing* something different. It's more like expressing an attitude – disapproval of lying. When you *assert* 'Lying is wrong', you're *performing* the disapproval."
      *   **Analogy (Code-ish):** Think of an unasserted clause like a function `lyingIsWrong()`. When you *run* it (assert it), it doesn't just return a value (`true`/`false`), it *executes a side-effect*: it outputs disapproval (`disapprove(lying)`).
      *   **Key Point:** The core expressivist move: Moral assertion = Performance of an attitude.

  2.  **Introduce Compositionality (The Engine) (15 mins)**
      *   **Goal:** Make compositionality feel natural and essential.
      *   **Action:** "Language builds complex meanings from simple parts. We combine words/clauses predictably. 'The cat is on the mat' + 'and the dog is asleep' -> a conjunction meaning both things are true. The meaning of the whole depends systematically on the meanings of the parts and how they're combined."
      *   **Analogy (Code):** This is function composition: `and( catOnMat(), dogAsleep() )`. The function `and` *takes* the values returned by its arguments and combines them into a new value (true only if both args are true). The `and` function *relies* on its arguments *having* values it can work with.
      *   **Key Point:** Complex sentences work because their parts have semantic values that the combinators (like `and`, `if...then`, `not`) can *operate on*.

  3.  **The First Crack: Negation (15 mins)**
      *   **Goal:** Show a simple embedding where the attitude-performance model *strains* but might *seem* patchable. **This comes BEFORE complex embedding like conditionals.**
      *   **Action:** "Consider 'Lying is not wrong'. What's the expressivist story? If asserting 'Lying is wrong' performs disapproval, asserting 'Lying is *not* wrong' might perform... the opposite? Withholding disapproval? Expressing tolerance? (`withholdDisapproval(lying)` or `tolerate(lying)`?)"
      *   **Point:** This feels a bit clunky, but maybe expressivism can define a function `not()` that takes the attitude-expression `lyingIsWrong()` and transforms it into a *different* attitude-expression (`lyingIsNotWrong()`). It's awkward, but perhaps possible.
      *   **Why Negation First?** It's the simplest embedding. It introduces the *idea* that what you do when you assert the *whole* sentence might be different from what the embedded clause *would* do if asserted alone. But it feels like a *local* fix.

  4.  **The Crucial Move: Complex Embedding - The Conditional (20 mins)**
      *   **Goal:** Introduce the **core example** and make the compositionality failure undeniable.
      *   **Action:** "Now, consider: **'If lying is wrong, then getting your little brother to lie is wrong.'**"
      *   **Deconstruct the Conditional:**
          *   "This sentence *as a whole* isn't directly performing disapproval of lying or of getting your brother to lie, right? It's saying something *conditional*."
          *   "The `if...then` structure is like a function: `ifThen( A, B )`. For this to work, what does `ifThen` *need* from its arguments `A` ("lying is wrong") and `B` ("getting brother to lie is wrong")?"
      *   **The Problem Revealed:**
          *   "`ifThen` needs to know something *about* `A` and `B` to determine the truth (or meaning) of the whole conditional. It needs to relate their *contents*, not trigger their performances."
          *   "But what *is* `A`'s content/semantic value on expressivism? When `A` is asserted alone, it *performs* `disapprove(lying)`. But here, inside `ifThen`, `A` is **not** being performed! Nobody is disapproving of lying just by uttering this *if* sentence. `ifThen` isn't an attitude-performer; it's a *relation-checker*. It needs `A` to be something it can *check a condition on*, like a truth-value or a proposition."
          *   **The Mismatch:** Expressivism says the meaning/role of `A` is to *perform an attitude when asserted*. But embedded in `ifThen`, `A` isn't being asserted. `ifThen` needs `A` to *be* something with a truth-evaluable or propositional content *that it can use as input*. Expressivism hasn't given `A` that kind of stable semantic value for embedded contexts. It only has the performance.
      *   **Why This Example Works:**
          *   **Not Paraphrasable as Attitude Report:** You can utter "If lying is wrong..." without *currently* disapproving of lying yourself! You might be exploring logic, teaching ethics, or even disagreeing. The antecedent isn't "I disapprove now".
          *   **Lacks:** Any ambiguity. Clearly conditional, clearly moral terms embedded.
      *   **Reuse:** Throughout the next sections, keep returning to this exact conditional. "How does expressivism handle what `A` *is* inside this `ifThen`?"

  5.  **Stating the Requirement (The Standard) (5 mins) - *After* feeling the problem**
      *   **Action:** *Now* that they've seen the conditional explode, state it clearly: "This shows the requirement for a solution: **A moral clause like 'lying is wrong' must have a *single*, consistent semantic value (or meaning-contribution) that works both when it's asserted *and* when it's embedded inside structures like conditionals, questions, or negations.** The value must be something that logical operators like `ifThen` can actually *use* as input."
      *   **Why Now?** The problem makes the requirement obvious and urgent. Stating it upfront would be abstract. Now it's the answer they need.

  6.  **Generalizing the Problem (5 mins)**
      *   **Action:** Briefly show other embeddings using the same core clause:
          *   **Question:** "Is lying wrong?" (Not performing disapproval, asking about it. Needs a content to ask *about*).
          *   **Belief Context:** "Alice believes that lying is wrong." (Reporting Alice's state, not performing the speaker's disapproval. Needs a content Alice believes).
      *   **Point:** The conditional isn't special. *Any* embedding context that isn't direct assertion exposes the same issue. The moral clause needs a value usable *in* that context.

  7.  **Addressing Misconceptions (15 mins)** - *Weave these in as they arise or proactively after step 6*
      *   **"Expressivism = Meaningless/Just Emotive":** Clarify: "NO. Expressivists say moral sentences *do* something vital (express attitudes/plans) and *are* meaningful. The problem is *how* that meaning composes in complex sentences." (Head off early, during Step 1/2).
      *   **"Problem is Moral Claims Can't Be True":** Push Back: "The problem isn't *just* that they can't be true in a realist sense. Even if we *call* them 'true', the compositionality problem remains: What is the *value* that gets passed to `ifThen`? How does the attitude-performance model generate that value for embedded contexts?" (Address when discussing conditionals).
      *   **"Fix: Express Attitudes AND Be True":** Explain the Gap: "This is the 'hybrid' or 'ecumenical' idea. But the hard part is showing *how* the 'truth' or propositional content *arises systematically from* the attitude-expressing function in a way that solves the embedding problem. Simply declaring both doesn't build the compositional bridge." (Address if raised, or after stating the requirement).
      *   **"Handling Negation Settles Embedding":** Contrast: "Negation (`not`) might be handled by defining a new attitude-function (`notWrong()`). But conditionals (`ifThen`) are a *different beast*. `ifThen` doesn't just transform the attitude; it *relies* on the antecedent having a stable content/value *before* any attitude is performed for the whole sentence. Solving negation doesn't solve compositionality for operators that *consume* semantic values." (Crucial! Address after Step 4, contrasting with Step 3).
      *   **Code Analogy Pitfall:** Engineers might think: "Can't we just make `lyingIsWrong` return a special 'attitude token' value that `ifThen` knows how to handle?" **Response:** "What *is* that token? How does `ifThen` logically relate two such tokens? Expressivism needs to explain the *logical relations* between moral sentences (why modus ponens works with 'If lying is wrong...'), not just pass opaque tokens. An 'attitude token' doesn't inherently carry the logical connections needed." (Be ready to address this during Step 4 or Step 6).

  8.  **Assessment Question (Last 10 mins):**
      *   **Question:** "Imagine you're designing a very simple semantic interpreter for language. It has a function `eval(expression, context)` that returns a semantic value. How would an expressivist *implement* `eval` for the clause 'lying is wrong'? Specifically, what value should `eval` return when 'lying is wrong' appears as the *antecedent* of a conditional ('If lying is wrong...'), knowing that the `eval` function for 'if P then Q' needs to use the value of `P` to compute the value of the whole conditional?"
      *   **Why it works:** It forces them to confront the core technical hurdle: specifying the *value* for embedded occurrences that compositional operators can use. Memorized slogans won't produce a plausible `eval` function. Good answers will struggle with the mismatch between attitude-performance and the need for a usable input.

  9.  **Openly Refuse To Go Into:**
      *   **"How contemporary expressivists (Gibbard, Blackburn, Schroeder) *actually* try to solve this with plans, norms, or biforcated attitude semantics."** Say: "That's the deep dive into proposed solutions, requiring more logic and metaethics. Tonight was about understanding *why* it's a serious problem needing a sophisticated solution in the first place."

  **Most Likely Failure Point & Fallback:**

  *   **Step 4 (The Conditional Mismatch):** Grasping *why* the attitude-performance isn't what `ifThen` needs. They might initially think "Well, `ifThen` just uses the *idea* of disapproval."
  *   **Fallback 1:** Hammer the performance vs. content distinction. "When you say the whole *if* sentence, are you performing disapproval of lying? (No). So what *is* the 'lying is wrong' part *doing* inside that sentence? It's just sitting there, being *mentioned* conditionally, not *used* to disapprove. The `ifThen` combinator needs to know *what it's conditionalizing on* – it needs the *content* that disapproval *is about*, not the performance itself."
  *   **Fallback 2 (Code Analogy):** "Imagine `ifThen` is a function: `function ifThen(p, q) { return !p || q; } // requires p, q to be booleans`. Now, if `lyingIsWrong()` is defined as `{ execute: disapprove(lying) }` (it performs an action, returns nothing, or returns an 'action token'), you literally cannot pass it to `ifThen`. `ifThen` expects a boolean (`true`/`false`) input. Type error! Expressivism needs to define `lyingIsWrong` so that, *when embedded*, it evaluates to something `ifThen` can use (like a truth-value or proposition), while still explaining why asserting it *alone* performs disapproval. How?"

  **Blunt Assessment of Your Frame:**

  *   **Compositionality Framing:** **Perfect.** It's the essence of the problem, avoids truth-talk rabbit holes, and resonates powerfully with engineers who think about function inputs/outputs and system design.
  *   **Effect/Value Analogy:** **Very Good, but needs care.** The "side-effect" analogy for assertion is excellent. The key is relentlessly emphasizing that combinators like `ifThen` don't *want* the effect; they need a *value* (the input) that the effect was *about*. The potential pitfall (thinking an 'attitude token' suffices) is manageable with the fallbacks above. **Don't drop it; refine the explanation around the input requirement.**

  **Session Flow Summary:**

  1.  Expressivism = Performance (Assertion) - Side Effect.
  2.  Compositionality = Combining Parts Needs Values (Function Inputs).
  3.  Negation: Awkward but maybe patchable (Transforming Effect?).
  4.  **Conditional: EXPLOSION - Effect isn't Input!** (Core Example).
  5.  Requirement: Unified Semantic Value for Embedded & Asserted.
  6.  Generalize: Questions, Beliefs - Same Problem.
  7.  Smash Misconceptions (Especially "Negation Fixes All" & "Just Add Truth").
  8.  Assessment: Code the `eval` for the embedded antecedent.
  9.  Refuse: Deep dives into actual contemporary solutions.

  This plan leverages their intuition for systems, functions, and inputs. By focusing on the input `ifThen` requires versus what expressivism provides for the embedded clause, the problem becomes concrete. Good luck!
