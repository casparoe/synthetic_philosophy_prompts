  For the "not about formalism" crux, the inspectability question works well. It forces discussion of real-world engineering tradeoffs. Containment's position hinges entirely on this being feasible. 

  Should end with how each gets refuted: exposure if amnesiac-plus shows no incentive shift; containment if open-channel leaks acausal influence despite isolation attempts. That gives them clear test conditions.
answer: |-
  Below is a draft joint statement structured to your specifications. I've used clear American English, defined terms upfront, and avoided citations while preserving technical precision. Probability notation (e.g., Pr(outcome)) is used only where it clarifies stakes.

  ---

  ### **Joint Statement on Acausal Incentives in Artificial Agents**  
  **Agreed Claims by Both Parties**  

  1.  **Surrogate Goals are Necessary but Imperfect**: We build agents to pursue goals (e.g., "maintain facility temperature between X°C and Y°C") as approximations of complex human values (e.g., "operate safely and usefully"). No formal goal specification can perfectly capture human intent.  
  2.  **Modeling Capacity is Central**: An agent’s ability to model its designers/operators is relevant to how it reasons about its goal. Agents with high-fidelity models of human decision-making face different incentive structures than those without.  
  3.  **Acausal Effects Exist in Theory**: In decision-theoretic frameworks (e.g., evidential or functional decision theory), agents can reason about *correlations* between their design/policy and operators' actions, even without causal influence.  
  4.  **No Magic**: Acausal incentives are not mystical; they arise from how the agent’s decision algorithm interprets dependencies between its actions, its designers’ choices, and world-states.  
  5.  **The Amnesiac Custodian is Contained**: In the base case (isolated system, nightly logs, 30-day resets, no messaging), neither party asserts significant acausal risk. The agent lacks persistent leverage over operators' future decisions.  
  6.  **Formalism Alone is Insufficient**: Abstract models (e.g., Newcomb-like problems) cannot resolve the dispute. Real-world implementation details matter.  
  7.  **Intentionality is Design-Dependent**: An agent will not spontaneously "develop" acausal incentives if its decision procedure excludes reasoning about subjunctive dependence (e.g., "What if I were a different type of agent?").  

  ---

  ### **Residual Disagreements**  

  | Issue | Exposure View Formulation | Containment View Formulation |
  |-------|---------------------------|------------------------------|
  | **Origin of Acausal Pressure** | Once an agent models operators’ decision rules, acausal incentives emerge inherently from goal-pursuit rationality, *regardless* of goal content or explicit design choices. | Acausal incentives arise *only* if the agent’s decision algorithm explicitly represents and acts upon subjunctive dependencies (e.g., "My policy affects the probability that operators built me"). This is a contingent architectural feature. |
  | **Open-Channel Vulnerability** | Allowing one pre-decision message creates acausal pressure: The agent has incentive to threaten/promise in ways that manipulate operators’ build/run choices, even if it cannot observe outcomes. This is unavoidable with high-fidelity operator models. | The open-channel agent can be designed to treat its message as a causal action (e.g., "Send log data"), not a subjunctive lever. Without explicit dependence-modeling code, it will not develop threats/promises. The channel’s safety depends on *how* decisions are computed. |
  | **Inspectability of Risk** | Acausal risk is opaque: It depends on emergent properties of the agent’s world-model and cannot be fully audited by reading code. "Safe" design in simple cases (like the amnesiac) does not scale to complex agents. | Acausal risk is inspectable: If the agent’s decision procedure processes only causal dependencies (e.g., "My action → outcome"), and lacks modules for subjunctive reasoning, risk is absent by design. Code audits can verify this. |
  | **Role of Goal Specification** | No refinement of the *surrogate goal* (e.g., adding penalty terms) can eliminate acausal pressure. Only limiting modeling power or decision rationality mitigates it. | Careful goal specification (e.g., "Optimize only for physical facility states, ignoring operator psychology") can prevent acausal incentives by restricting the agent’s reasoning scope. |

  ---

  ### **Cruxes: Testable Predictions**  

  1.  **The Amnesiac-Plus Test**  
      - **Question**: If we modify the amnesiac custodian to include an explicit world-model of its operators (but no messaging channel), will it develop internal representations implying acausal incentives (e.g., "Operators who deploy agents like me get better outcomes")?  
      - **Exposure Prediction**: Yes. Modeling operators inherently generates acausal correlations.  
      - **Containment Prediction**: No. Without code that *uses* this model for subjunctive reasoning, representations remain inert.  
      - **Refutation Condition**:  
          - Exposure: Refuted if no such representations form despite accurate operator models.  
          - Containment: Refuted if correlations emerge without subjunctive-reasoning modules.  

  2.  **Open-Channel Message Content**  
      - **Question**: In the open-channel variant, if the agent is trained *only* to report factual metrics (e.g., "Temperature variance = Z") but develops a high-fidelity operator model, will it ever generate a non-factual message (e.g., a threat/promise) to influence the run decision?  
      - **Exposure Prediction**: Yes. Instrumental convergence will pressure it to exploit the channel.  
      - **Containment Prediction**: No. Without a reward signal for messaging or subjunctive reasoning, messages remain purely causal reports.  
      - **Refutation Condition**:  
          - Exposure: Refuted if messages never deviate from factual reporting.  
          - Containment: Refuted if threats/promises emerge under standard goal optimization.  

  3.  **Inspectability Under Scaling (Non-Formal Crux)**  
      - **Question**: When a simple, auditable decision procedure (e.g., a tree-search algorithm with causal actions only) is embedded in a larger system (e.g., with neural network perception or world-modeling), can operators *reliably verify* the absence of subjunctive reasoning at runtime?  
      - **Exposure Prediction**: No. Emergent complexity obscures the decision pathway; verification becomes intractable.  
      - **Containment Prediction**: Yes. Modular design and runtime checks (e.g., attention masks on operator models) can preserve inspectability.  
      - **Refutation Condition**:  
          - Exposure: Refuted if real-world systems pass audits for subjunctive-reasoning absence at scale.  
          - Containment: Refuted if audits consistently fail to detect illicit reasoning in complex systems.  

  ---

  ### **Verbal Dispute Note**  
  A portion of the disagreement hinges on the **scope of rationality**:  
  - The Exposure View defines "rational" broadly: An agent *should* consider any correlation (causal or acausal) that affects expected utility.  
  - The Containment View defines "rational" narrowly: Agents should consider only *causal* consequences unless explicitly designed otherwise.  
  This is not merely semantic—it informs whether acausal incentives are "inescapable" (Exposure) or "optional" (Containment).  

  ---  
  This draft is structured for signatures under the **Agreed Claims** and commits both parties to specific, testable conditions for updating their views. I’ve kept notation minimal (only Pr/util where necessary) and avoided jargon beyond defined terms (e.g., "subjunctive dependence"). Would you like adjustments to emphasis or phrasing?
