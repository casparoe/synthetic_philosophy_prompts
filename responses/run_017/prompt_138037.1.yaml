  - Claiming historians use "overdetermined" precisely this way might overstate - many mean "many factors" loosely

  For part (b):
  - Excellent argument that overdetermination complicates counterfactual testing
  - Valid point about inability to rank causes
  - The physics vs. history contrast is overstated though - even physics deals with probabilistic causation

  Biggest issue:
  - The conclusion that historical explanation reduces to "narrative shaped by salience" goes too far. Overdetermination doesn't make empirical verification impossible - just harder. This needs qualifying.

  On marking:
