  ### Taxonomy of the Two-Envelope Paradox (Unopened Envelope)  
  **Core Setup**: Two envelopes (A, B), one holds twice the other. You pick one randomly (say, A). Without opening, you're offered a free swap to B. Is there a reason to swap?  

  #### Branching Questions (Decision Nodes)  
  1. **Does the swap decision depend on the *actual* amount in your envelope?**  
     - If no: Symmetry holds; no swap needed.  
     - If yes: Conditioning is valid; proceed.  

  2. **Can the expected value (EV) of swapping be calculated?**  
     - If no: EV undefined; question invalid.  
     - If yes: Proceed to compute EV.  

  3. **Is the probability that your envelope is smaller always exactly 1/2, *regardless* of its amount?**  
     - If yes: EV favors swapping unconditionally.  
     - If no: Probabilities depend on amount; prior needed.  

  4. **Is the filling process (how amounts were chosen) known?**  
     - If no: Prior unknown; fallback to symmetry.  
     - If yes: Prior informs decision.  

  5. **Is the EV calculation coherent over repeated swaps?**  
     - If no: Single-swap EV is inconsistent; reject.  
     - If yes: Accept or refine EV logic.  

  6. **Does a known finite cap ($1,024) alter the reasoning?**  
     - If no: Cap irrelevant; proceed as unbounded.  
     - If yes: Cap breaks symmetry at bounds.  

  7. **Does indifference imply "no reason to swap"?**  
     - If yes: Symmetry suffices.  
     - If no: Other motives matter (e.g., risk-seeking).  

  #### Positions (Leaves)  
  1. **Pure Symmetry (No-Switch)**  
     - *Description*: Symmetry makes swapping irrelevant; no gain/loss.  
     - *In-scenario line*: "Swapping is pointless; I have no more reason to choose B than I did A."  
     - *Rebuttal*: "But conditioning on *my* envelope breaks symmetry—yours could be double!"  
     - *Confidence*: High. Mathematically sound.  

  2. **Always-Switch (1.25X EV)**  
     - *Description*: EV = 1.25X > X, so always swap. Ignores filling process.  
     - *In-scenario line*: "Swapping gives 25% expected gain; only a fool wouldn’t."  
     - *Rebuttal*: "Then you’d swap twice and end up paying to return to A!"  
     - *Confidence*: High. Core paradox.  

  3. **Reductio ad Absurdum (Against Always-Switch)**  
     - *Description*: If always-switch holds, you’d swap infinitely, proving it flawed.  
     - *In-scenario line*: "If swapping is always better, why not pay to swap forever? Nonsense."  
     - *Rebuttal*: "Each swap *is* rational—you’re conflating decisions."  
     - *Confidence*: High. Logical critique.  

  4. **Cap-Aware Bayesian (Switch Except at $1,024)**  
     - *Description*: With finite cap (and uniform prior on powers of 2), EV favors swapping *unless holding $1,024*.  
     - *In-scenario line*: "With this cap, I’d swap any amount except $1,024—but since I don’t know, I’m indifferent."  
     - *Rebuttal*: "Indifference means no swap—why invite risk for zero *unconditional* EV?"  
     - *Confidence*: Solid. Cap resolves unbounded EV issues.  

  5. **EV Undefined (Unbounded Prior)**  
     - *Description*: No proper prior; EV diverges. Swap question is ill-posed.  
     - *In-scenario line*: "Without bounds, ‘average gain’ is meaningless—I refuse the frame."  
     - *Rebuttal*: "But with the cap, it’s defined! You’re dodging."  
     - *Confidence*: Medium. Valid for unbounded case, irrelevant with cap.  

  6. **Causal Decisionist (Depends on Filling Process)**  
     - *Description*: Swap only if filling process (e.g., "grifter chose $100 first") is known. Otherwise, symmetry.  
     - *In-scenario line*: "How did he pick the amounts? Without that, I can’t compute—so no swap."  
     - *Rebuttal*: "The ratio is all that matters! Your envelope’s amount is the anchor."  
     - *Confidence*: Medium. Emphasizes epistemology.  

  7. **Finite Optimist (Switch Despite Cap)**  
     - *Description*: With cap, EV still favors swapping for *most* amounts (only loses at $1,024). Since $1,024 is unlikely, swap.  
     - *In-scenario line*: "Odds I hold $1,024 are tiny; swapping wins almost always—I’ll gamble."  
     - *Rebuttal*: "But the EV is precisely zero—you’re overpaying for a coin flip!"  
     - *Confidence*: Medium. Erroneous (unconditional EV=0), but psychologically plausible.  

  #### Unoccupied Cells & Why  
  - **Conditional EV without filling process**: Incoherent. If probability ≠ 1/2 (Q3=no), but filling process unknown (Q4=no), you can’t compute—no one defends.  
  - **Always-switch with incoherent EV (Q2=yes, Q5=no)**: Unattractive. Admits EV exists but ignores reductio.  
  - **Swap with negative unconditional EV**: Irrational. No one advocates losing money.  

  #### Wrinkles Handled  
  1. **Finite Cap ($1,024)**:  
     - Creates **Cap-Aware Bayesian** and **Finite Optimist** leaves.  
     - Collapses unbounded issues (EV Undefined irrelevant).  
     - *Serious position?* Yes—**Cap-Aware Bayesian** is defensible; **Finite Optimist** is a natural (but flawed) human response.  

  2. **Repeated Swaps (Costs 1¢, reshuffled)**:  
     - Changes nothing. Each swap is independent (reshuffling resets symmetry).  
