  We are given an essay outline on the Common Prior Assumption (CPA) and are to critique it in four passes.

  Pass 1: Restate the argument in the strongest form and then attack it.

  The argument as presented:

  Claim 1: The CPA as an existence claim (that there is a common prior generating the observed posteriors) is nearly vacuous because one can typically find such a prior after the fact. The only obstruction is when agents disagree about which events have zero probability (i.e., they have different null events). Thus, CPA by itself doesn't constrain disagreements.

  Claim 2: The interesting part of CPA is not the commonality but the timing: the prior must be the one actually held before evidence, and it must be fixed under counterfactual evidence. This is what gives content to CPA.

  Claim 3: The real content of CPA is captured by "no-envy-swap": ex ante, no agent would pay to trade her own information structure (partition) and updating rule for that of another agent. This condition can hold even when priors differ and fail when priors are identical, so it's distinct. Moreover, it is what underlies the agreement theorems because in those proofs, agents are treating each other as rational but differently informed.

  Claim 4: The debate about persistent disagreement should focus on likelihoods (how agents update on evidence) rather than priors. With common likelihoods, the agreement theorems become about trusting others to interpret evidence, which is a practical matter.

  Claim 5: The no-envy-swap condition might deliver no-trade (no expected profit from trading with someone whose updating you don't envy) but not full agreement. It's unclear if losing agreement is bad.

  Steelman:

  The author argues that the standard Common Prior Assumption (CPA) is often misunderstood. As a mere existence condition for a prior that rationalizes the observed posterior beliefs, it is too weak because such a prior can almost always be constructed post hoc, except when agents disagree on null events. The real bite of CPA comes from the requirement that the prior must be the one actually held before any evidence and must be robust to counterfactual evidence. However, the author proposes that the core intuition behind CPA is not about a shared prior but about agents not envying each other's information processing. Specifically, the "no-envy-swap" condition requires that, ex ante, no agent would prefer to have another agent's information partition and updating rule. This condition is independent of having a common prior and better captures the essence of the agreement theorems, which rely on agents respecting each other as rational updaters. The author then suggests that persistent disagreement is better explained by differences in likelihoods (how evidence is interpreted) and that the agreement theorems, under common likelihoods, become about evaluating who is better at interpreting evidence. Finally, the author acknowledges that no-envy-swap may not deliver full agreement but might prevent speculative trade.

  Attack on the steelman:

  1. On Claim 1 (emptiness): While it is true that the existence of a common prior is a weak condition when we are allowed to choose the prior arbitrarily, the literature (e.g., the no-trade theorems) typically assumes that the prior is fixed and common from the start. The author's point that the only obstruction is disagreement on null events is not entirely accurate. There are stronger conditions for the existence of a common prior. In fact, the common prior exists if and only if the agents' posteriors are "consistent" in a certain way that goes beyond agreeing on null events. We will provide a counterexample below.

  2. On Claim 2 (hindsight priors): The author is right that the timing of the prior matters. However, the requirement that the prior must be fixed under counterfactual evidence is already implicit in the standard formulation of CPA. The standard CPA does not just require the existence of a prior that fits the posteriors; it requires that this prior is the one that was actually used. The author's point that the interesting part is the timing is not new; it is the standard justification for why CPA is not vacuous.

  3. On Claim 3 (no-envy-swap): The condition "no-envy-swap" is interesting but not equivalent to the standard CPA. The author claims that it is different because it can hold when priors differ and fail when priors are the same. However, in the standard model, the updating rule is derived from the prior via conditioning. So if the prior is not common, then the updating rule (which is conditioning on the partition) is also not common. The author's proposal to separate the updating rule from the prior is a departure from the standard model. Moreover, in the standard model, the partition is fixed and the updating is conditioning, so "trading places" would mean trading both the partition and the prior? The definition is not entirely clear. Also, the author claims that the agreement theorems rely on no-envy-swap. But in the standard agreement theorem, agents must have common knowledge of their posteriors and a common prior. The proof does not require that they don't envy each other's updating; it uses the common prior to derive a contradiction if posteriors differ. So the author's condition might be a different route.

  4. On Claim 4 (likelihoods): The author suggests that disagreement is about likelihoods. However, in a Bayesian setting, the likelihoods are part of the prior (which is a joint distribution over states and signals). The CPA already implies that the entire joint distribution is common. The author's point that without common priors, agents might differ in their likelihoods is valid, but this is already part of the standard critique of CPA. Moreover, if we have common likelihoods but different priors, we can still have agreement if the evidence is common? The author's proposal to shift to common likelihoods is an alternative model, but it is not clear that it captures the same intuitions as CPA.

