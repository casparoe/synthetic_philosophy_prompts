  Agent 1 at {w1,w2}: a/(a+b) = (3/8)/(3/8+2/8)= (3/8)/(5/8)=3/5=0.6 -> good.
  Agent 2 at {w2,w3}: b/(b+c)= (1/4)/(1/4+3/8)= (2/8)/(2/8+3/8)=2/5=0.4 -> good.

