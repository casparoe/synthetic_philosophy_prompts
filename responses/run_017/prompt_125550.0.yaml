answer: |-
  Below is a decision tree structured to address contested commemorations through concrete, binary questions. It accommodates your specified leaves (including leasehold), avoids presupposing philosophical positions, and incorporates your live cases as examples. The tree has six branch questions, producing ten leaves (eight named positions, one combined option, and one empty leaf). Constraints like legal, financial, or environmental barriers are integrated at critical junctures. Use-capture and commemorative drift are embedded where they naturally arise (detailed in the **Concept Placement** section).  

  ---

  ### **Decision Tree for Contested Commemorations**  
  *Instructions:* Start at Question 1. Answer each question with Yes/No based on the concrete case. Follow the arrows to the next question or final leaf.  

  1. **Can this commemoration be altered or removed without violating legal, financial, environmental, or donor-imposed constraints?**  
     - *If No (constrained)* → Go to Question 2.  
     - *If Yes (unconstrained)* → Go to Question 3.  
     *Example: Courthouse obelisk (protected structure + bird nest) → No. School name with endowment → No. Pioneer monument → Yes.*  

  2. **Does it cause significant harm or offense to a substantial community group today?**  
     - *If No* → Leaf 1: **Unconditional Retention**.  
     - *If Yes* → Go to Question 4.  
     *Example: School name with endowment, if uncontroversial → No. Obelisk if uncontested → No.*  

  3. **Does it cause significant harm/offense today OR was it originally intended to honor someone/thing now seen as predominantly negative?**  
     - *If No* → Leaf 2: **Unconditional Retention**.  
     - *If Yes* → Go to Question 4.  
     *Example: Governor statue (harm from sterilization + negative intent) → Yes. Pioneer monument (harm to local nation + negative intent) → Yes.*  

  4. **Can the harm or negative intent be effectively addressed without removing the commemoration? (e.g., via plaques, counter-monuments, use-capture, or contextual programming)**  
     - *If Yes* → Leaf 3: **Retention with Added Context**.  
     - *If No* → Go to Question 5.  
     *Example: Governor statue (plaque about sterilization) → Yes. Pioneer monument (counter-monument) → Yes. Use-capture: Statue repurposed as protest site, changing meaning → Enables "Yes".*  

  5. **Does it hold significant historical or educational value that requires preservation?**  
     - *If Yes* → Leaf 4: **Removal to Museum**.  
     - *If No* → Go to Question 6.  
     *Example: Governor statue (documents hospital system history) → Yes. Commemorative drift: A monument to a "hero" now understood as exploitative loses value → May shift to "No".*  

  6. **Can it be relocated to private land or a less prominent public site?**  
     - *If Yes* → Leaf 5: **Relocation to Private/Less Prominent Ground**.  
     - *If No* → Leaf 6: **Removal to Storage or Destruction**.  
     *Example: Minor donor plaque → Yes (relocate to archive). Generic Confederate statue → No (storage/destruction).*  

  ---

  ### **Resulting Leaves**  
  Each leaf includes:  
  - **Name** of the position.  
  - **Most Awkward Commitment**: The hardest trade-off or implication.  
  - **Exit Condition**: New facts that could shift the decision.  

  1. **Unconditional Retention**  
     - *Awkward commitment*: Ignores current harm if constraints exist.  
     - *Exit condition*: If constraints are lifted (e.g., endowment expires).  
     *Reached via*: Q1=No, Q2=No. (Constrained, no harm)  

  2. **Unconditional Retention**  
     - *Awkward commitment*: Retains even with negative intent if no current harm.  
     - *Exit condition*: If demonstrable harm emerges.  
     *Reached via*: Q1=Yes, Q3=No. (Unconstrained, no harm/negative intent)  

  3. **Retention with Added Context**  
     - *Awkward commitment*: Accepts that mitigation may not satisfy all.  
     - *Exit condition*: If added context fails to reduce harm.  
     *Reached via*: Q4=Yes (from any branch).  

  4. **Removal to Museum**  
     - *Awkward commitment*: Prioritizes historical value over public harm.  
     - *Exit condition*: If proven to have no educational value.  
     *Reached via*: Q5=Yes.  

  5. **Relocation to Private/Less Prominent Ground**  
     - *Awkward commitment*: May allow harmful symbols to persist semi-publicly.  
     - *Exit condition*: If no suitable location exists.  
     *Reached via*: Q6=Yes.  

  6. **Removal to Storage or Destruction**  
     - *Awkward commitment*: Destroys property without consensus on irredeemability.  
     - *Exit condition*: If new evidence justifies preservation.  
     *Reached via*: Q6=No.  
     *Note*: Storage and destruction are combined (tree cannot distinguish further; panel decides based on offensiveness).  

  7. **Forced Retention (Under Constraint)**  
     - *Awkward commitment*: Forces harmed communities to endure offense.  
     - *Exit condition*: If constraints are lifted.  
     *Reached via*: Q1=No, Q2=Yes, Q4=No. (Constrained, harm, no mitigation)  

  8. **Leasehold**  
     - *Awkward commitment*: Imposes recurring administrative burden.  
     - *Exit condition*: If the review process is deemed unsustainable.  
     *Reached via*: Answer "Yes" to leasehold question (see below).  

  ---

  ### **Leasehold Integration**  
  Leasehold is a parallel option for **any retention outcome** (Leaves 1–3, 7). After reaching one of these leaves, ask:  
  - **Leasehold question**: *Should this decision be revisited at fixed intervals (e.g., 10 years), requiring re-approval to maintain?*  
    - *If Yes* → Override to **Leasehold** (e.g., even "Unconditional Retention" becomes time-limited).  
    - *If No* → Keep the original leaf.  
  *Example:* Governor statue → Retention with Context + Leasehold = Periodic review.  

  ---

  ### **Empty Leaf & Combined Positions**  
  - **Empty Leaf**: *No branch leads to a position advocating immediate destruction as a first resort.*  
    - *Diagnosis*: Coherent but unattractive—destruction is only a sub-option (Leaf 6) when storage/relocation fail. Avoided due to ethical and practical risks (e.g., erasing evidence of injustice).  
  - **Combined Positions**:  
    - "Removal to Storage or Destruction" (Leaf 6) cannot be split further—tree bottoms out due to insufficient branching capacity. Distinction requires case-by-case deliberation (e.g., offensiveness vs. preservation feasibility).  
    - Similarly, "Unconditional Retention" appears in two branches (Leaves 1 and 2) but is identical in outcome.  

  ---

  ### **Concept Placement**  
  - **Use-Capture**:  
    - *Where it fits*: Question 4 (mitigation). If use-capture (e.g., protests, community events) negates harm, it supports added context.  
    - *Example*: A statue becomes a rallying point for racial justice → Mitigation possible without physical changes.  
  - **Commemorative Drift**:  
    - *Where it fits*: Questions 2 and 3 (harm/offense). Measures divergence between original intent and current meaning.  
    - *Example*: A "pioneer" monument drifts from "courage" to "colonial violence" → Harm exists regardless of intent.  
  - **Test Case Separating Use-Capture and Commemorative Drift**:  
    - *Scenario*: A statue of a colonial figure, originally for "exploration," now draws tourists taking selfies (use-capture). Simultaneously, it symbolizes oppression to Indigenous groups (drift).  
    - *Separation*: Use-capture may mitigate *general* harm (Question 4), but drift may sustain *specific* harm (Question 3), requiring added context.  

  ---

  ### **Live Cases in the Tree**  
  - **Governor Statue**:  
    - Q1=Yes (unconstrained) → Q3=Yes (harm + negative intent) → Q4=Yes (plaque/counter-monument) → **Retention with Context** (or Leasehold).  
  - **Pioneer Monument**:  
    - Q1=Yes → Q3=Yes → Q4=Yes (context via use-capture/dialogue) → **Retention with Context**.  
  - **School Name (Endowment)**:  
    - Q1=No (constrained) → Q2=Yes (if harmful) → Q4=Yes (educational programming) → **Retention with Context**.  
  - **Obelisk (Protected)**:  
    - Q1=No → Q2=No (if no harm) → **Unconditional Retention**; or Q2=Yes → Q4=Yes → **Retention with Context**.  

  This tree prioritizes concrete evidence (harm, constraints, mitigability) over abstract debate, routes cases to named positions, and acknowledges its own limits (combined/empty leaves). It can be used immediately by non-specialists.
