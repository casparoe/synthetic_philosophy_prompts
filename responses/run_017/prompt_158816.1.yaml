prompt: |-
  I have just come out of a long argument with a friend about whether contractualism can ever count numbers, and I now have to lead a ninety-minute seminar on Scanlon-style contractualism and the aggregation problem for second-year undergraduates who know utilitarianism and a little Kant but have met no contractualism at all. Don't explain the view to me; plan how I should explain it.

  The disagreement I want the session built around is this. My friend insists two cases are morally on a par because they contain the same total burden: in one, a factory's night noise gives a single resident two hundred consecutive nights of mild sleep loss; in the other, it gives two hundred different residents one mildly bad night each. I claimed contractualism can treat these differently, because a person's complaint is assessed over their whole life, so small burdens may compose into a serious one within a life, while summing burdens across different lives is what the comparison of individual standpoints is supposed to forbid.

  Plan the explanation: what has to be in place before the distinction between composing burdens within a life and summing them across lives is even intelligible; the one case that should carry the session and what it must have and lack (no risk, no consent, no catastrophic single burden); and the misconceptions to expect — I'm guessing at least that numbers never matter to contractualism at all, that the view collapses because someone can always object to any principle, and that reasonable rejectability just means people would in fact complain — with the point in the sequence where each should be headed off. Give me one closing question that would show me they can handle a case where the burdens are equal and I simply have to choose who suffers, and say explicitly what I should refuse to go into at this level.
reasoning: |-
  Okay, the user is preparing a seminar on Scanlon-style contractualism for second-year undergrads. They need to focus on explaining how contractualism handles aggregation, specifically whether it can count numbers when comparing burdens. The core example is a factory noise scenario: 200 nights of mild sleep loss for one person vs. one night each for 200 people. The user believes contractualism treats these differently because burdens compose within a life but not across lives, while their friend thinks the total burden is the same.

  First, I need to ensure students grasp the basics of Scanlon's contractualism before diving into the aggregation problem. They know utilitarianism and some Kant, but no contractualism. So the initial steps must build the foundation: the role of principles, reasonable rejectability, and individual standpoints. Without this, the within-life vs. across-lives distinction won't make sense.

  The key case is the factory noise example. It's perfect because it has no risks, no consent issues, and no catastrophic burdens—just repeated small harms. The seminar should center on this, contrasting it with the distributed version. I need to highlight how 200 nights for one person creates a serious burden over time, while one night for many is minor per person. This shows composition within a life versus non-summation across lives.

  Common misconceptions to address: First, that numbers never matter. But they do indirectly when burdens compound within a life. Second, that any objection collapses the theory, but the focus is on reasonable rejectability. Third, confusing reasonable rejectability with actual complaints. These need clear examples to debunk.

  For the closing question, a case like choosing whose leg gets broken when both have equal burdens would test if students understand that equal burdens don't lead to rejection. The key is to avoid consent, risks, and larger aggregations at this level.

  The user’s deeper need is to confidently lead a seminar that clarifies contractualism's stance on aggregation, using relatable examples while preempting student misunderstandings. They want a structured plan that builds logically, addresses misconceptions in real-time, and ends with a solid grasp of the core distinction without veering into advanced topics.
answer: |-
  Here’s a structured seminar plan focused on your core disagreement, designed for 90 minutes with foundational thinkers. Prioritize clarity, repetition, and student engagement through questioning.

  **Core Objective:** Students grasp *why* Scanlonian contractualism distinguishes between *composing burdens within a life* and *summing burdens across lives*, using the factory noise case.

  **Pre-Requisites (Plan for 30-35 mins):**  
  *(Without this, the within/across distinction is noise)*

  1.  **Hook & Contrast (5 mins):**
      *   Q: "Utilitarianism cares about total happiness/suffering. Kant cares about universalizable maxims. What might a moral theory care about if it focused on *how we justify our actions to each other*?" (Elicit ideas: fairness, mutual respect, non-coercion).
      *   **State Scanlon's Core Idea:** "Morality = Principles for governing behavior that no one could *reasonably reject*, given a desire to find principles others similarly motivated couldn't reasonably reject." Emphasize "reasonably reject" – it's not about liking it or it being optimal.

  2.  **The Machinery: Principles & Standpoints (10 mins):**
      *   **Principle-Driven:** Morality is about evaluating *general principles* (e.g., "Factories can emit noise up to level X at night"). Decisions flow from principles, not case-by-case sums.
      *   **Individual Standpoint:** The key test is: "Could any individual *reasonably reject* this principle *because of the burdens it imposes on them*?" (Contrast with Utilitarianism's impersonal sum).
      *   **What's a Burden?** (Crucial!): Burdens are harms, losses, frustrations, or limitations imposed by a principle *on an individual's life*. (Give simple examples: broken promise = loss of trust/expectation; theft = loss of property/security).

  3.  **Reasonable Rejectability Demystified (15 mins):** *(Pre-empt misconceptions)*
      *   **Not "I Don't Like It":** "Reasonable" implies justification others could recognize, not personal whim. "I hate the color blue, so reject any principle allowing blue factories" = Unreasonable.
      *   **Not "Someone Will Complain":** People *will* complain about many reasonable things. Focus: *Could* they offer a reason others (seeking agreement) should accept as a basis for rejection? (Pre-empts "collapse" misconception).
      *   **Not "Total Burden":** Scanlon: "We do not... add together the *reasons* arising from different standpoints." Highlight this quote! The test is the *strength of the strongest individual complaint* against a principle *compared to complaints against alternatives*.
      *   **Analogy (Optional but helpful):** Imagine justifying the principle directly to each affected person. Could you convince them it's fair, *despite their burden*? Their complaint is assessed *from their whole life perspective*.

  **The Core Distinction: Factory Noise Case (40 mins)**

  1.  **Present the Two Cases Clearly (5 mins):**
      *   Case A: Factory noise causes **1 person 200 consecutive nights** of mild sleep loss (e.g., grogginess, slight irritability).
      *   Case B: Factory noise causes **200 different people 1 night each** of the *same* mild sleep loss.
      *   **Stress:** *Total* sleep loss nights are identical. *Individual experience per night* is identical. *No other factors* (risk, consent, catastrophe).

  2.  **Initial Student Intuition (5 mins):** Q: "Morally equivalent? Different? Why?" Likely split. Note Utilitarian leanings ("same total burden") vs. intuitive fairness ("one guy really suffers!").

  3.  **Apply Contractualism: Assessing Complaints (15 mins):**
      *   **Principle:** "Factories may operate at noise level X at night."
      *   **Case A (1 Person, 200 Nights):**
          *   *Burden:* One person suffers **200 instances** of mild harm. **Composition:** Ask: "Does experiencing this *every single night for over 6 months* constitute a different *kind* or *level* of burden than just one night?" (Yes! Chronic sleep deprivation = significant health risk, major impact on daily life, work, mood – a **serious burden**).
          *   *Complaint:* "This principle imposes a **serious, ongoing health and wellbeing burden** specifically on me." **Could they reasonably reject the principle based on this?** (Strong case for 'Yes').
      *   **Case B (200 People, 1 Night Each):**
          *   *Burden:* Each of 200 people suffers **one instance** of mild harm. **No Composition:** Ask: "Is *one night* of mild grogginess a significant burden *viewed from the perspective of each person's whole life*?" (No! Annoying, but minor, transient, not life-altering).
          *   *Complaint (per person):* "This principle gave me **one slightly annoying night**." **Could any *single individual* reasonably reject the principle based solely on *this one minor burden*?** (Strong case for 'No'. Others might say "Tough, it's minor" or "My one night is offset by benefits to others/jobs").
      *   **Key Point:** In Case B, we **cannot add up** the 200 minor complaints to outweigh the single serious complaint in Case A. Each complaint is assessed *individually* and *within the context of that person's life*.

  4.  **Address "Same Total Burden" (10 mins):**
      *   "My friend argues 'same total burden = same moral weight'. Contractualism *rejects this*. **'Total burden' sums across lives; contractualism only considers burdens *as experienced by individuals within their own lives*.**"
      *   *Why?* Moral justification is owed *to individuals*. You must justify the principle *to the person facing 200 nights*, not to the abstract sum. Their complaint is about *their* ruined sleep quality for months.

  5.  **Pre-empt Misconceptions Explicitly (5 mins):**
      *   **"Numbers Never Matter?":** False! Numbers *can* matter indirectly. If a principle imposes a *small burden on a vast number*, it might be that *each individual's burden*, though small, is still **significant enough *on its own*** to justify rejection (e.g., a tiny daily tax that collectively funds oppression – each person's loss *is* a meaningful infringement). But crucially, we still assess *each person's burden individually*; we don't sum the tiny amounts. *This is advanced – flag it but don't dive deep.*
      *   **"Collapse Because Someone Always Objects":** Revisit "reasonable". An unreasonable objection doesn't count. The test isn't "no one objects," it's "no one *reasonably* objects."
      *   **"Reasonable Rejectability = Actual Complaints":** Re-emphasize it's a *hypothetical, rational* test about justifiability, not empirical sociology.

  **Closing & Assessment (15 mins)**

  1.  **Synthesize (5 mins):** Recap the factory case distinction. Stress: Contractualism cares about the *magnitude and nature of burdens within an individual life*. It forbids aggregating small burdens *across different people* to outweigh a large burden on one person. Composition within a life *is* morally relevant.
  2.  **Assessment Question: The Equal Burden Choice (7 mins):**
      *   **Present:** "Imagine a runaway trolley. You can divert it. If you do nothing, it hits *Person A*, breaking their leg. If you divert it, it hits *Person B*, breaking *their* leg. Assume the burden (a broken leg) is *identical* for both, and there are *no other relevant factors* (relationships, promises, etc.). According to Scanlonian contractualism, *must* you divert the trolley? *May* you divert it? *Must* you *not* divert it? Justify your answer using the core ideas."
      *   **Target Answer:** Contractualism likely finds *no requirement either way*. Any principle allowing you *either choice* in this specific scenario would be one that neither A nor B could *reasonably reject*. Why?
          *   Principle 1: "Save the closest person" (or similar) – Neither has a stronger complaint; burden is equal.
          *   Principle 2: "Flip a coin" – Also seems reasonable.
          *   *Complaint?* Person B: "Why me?" Answer: "Bad luck, but the principle (e.g., coin flip) was fair." The burden itself is identical, so no *individual* has grounds to reject a principle permitting the choice based on a fair procedure. *Crucially, we are NOT summing or comparing burdens between A and B; we're asking if either has a complaint against the principle governing the choice.*
      *   **What it Shows:** They understand that when burdens are *truly equal and comparable*, contractualism doesn't dictate the choice *between individuals*, only that the principle governing *how* the choice is made must not be reasonably rejectable. It reinforces non-aggregation.
  3.  **Refuse to Go Into (Explicitly State - 3 mins):**
      *   **"We are NOT tackling:** Cases involving *risk/uncertainty* (what if we don't know who will be hurt?), *consent*, or how contractualism handles *massive numbers* of *very tiny* burdens (e.g., 1 million people lose 1 cent vs. 1 person loses $10,000) – that's a deep 'numbers swamp' problem for another day. We're also *not* debating if Scanlon is *correct*, just understanding *how* his view works on aggregation within vs. across lives."

  **Seminar Flow Summary:**

  *   (0-35 min) Build Contractualism Foundation (Principles, Standpoints, Burdens, Reasonable Rejectability)
  *   (35-75 min) Factory Noise Deep Dive (Cases, Composition Within Life, Non-Summation Across Lives, Friend's Objection)
  *   (75-85 min) Misconception Check & Synthesis
  *   (85-90 min) Assessment (Trolley Equal Burden) & Boundaries

  **Key to Success:** Constantly loop back to "What complaint does this individual have, *considering their whole life*?" and "Could they *reasonably reject* the principle *based solely on that burden*?" Use student responses to illustrate points and misconceptions. Good luck!
