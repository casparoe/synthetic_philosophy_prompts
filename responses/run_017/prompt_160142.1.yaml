  They want this phenomenon named, differentiated from neighboring concepts (James' genuine options, pragmatic encroachment), and analyzed structurally—including group beliefs and opacity-restoration mechanisms. Finally, they seek an ethical verdict given the belief's truthfulness and evidential retroactivity.

  The core puzzle is epistemological and performative: how can a belief be simultaneously true, generative, yet epistemically fragile when its mechanism is exposed? The teacher case is particularly elegant—random selection sabotages the very expectation that would've been justified post-hoc by the child's improvement.

  For naming: "Performative belief" feels apt (invoking Austin's speech acts) but I'll also note "reflexive justification" to capture the loop. The key is differentiating it from standard self-fulfilling prophecies where transparency doesn't break the spell—bank runs accelerate even when everyone knows it's panic-driven.

  Ethically, this forces a tension between Cliffordian integrity (beliefs shouldn't require willful blindness) and Jamesian pragmatism (if it works beneficially...). Perhaps the answer lies in distinguishing belief-formation from belief-sustenance: one might legitimately cultivate such attitudes through selective attention early on, but mustn't lie to oneself once the mechanism is known. The "fruits as evidence" point is devilish—it retroactively justifies but can't initially motivate without taint. I'll propose provisional acceptance as a practical stance rather than full epistemic endorsement.
answer: |-
  Here is a structured response addressing your query:

  ### I. Name, if there is one
  No single established term universally captures your first configuration. Philosophers occasionally describe aspects of it as **"self-fulfilling beliefs dependent on opacity"** or **"performative beliefs with reflexivity constraints"**, but these are descriptive rather than canonical. The phenomenon intersects with discussions of *Moore-paradoxical* states (e.g., "I believe X, but X is only true because I believe it"), epistemic *bootstrap-ping*, and the *logic of trust*, yet it lacks a dedicated label. Your contrast between "transparency-resistant" (bank runs) and "transparency-fragile" (teacher expectation) self-fulfilling prophecies is a novel and valuable distinction without a standard name.

  ### II. Neighbours and non-neighbours
  **Neighbours:**  
  *   **James’s Genuine Options:** Both involve pragmatic belief-formation. However, Jamesian beliefs (e.g., religious faith) do not *cause* their truth; their truth is independent of belief. Your cases are *existentially dependent* on belief for their truth.  
  *   **Pragmatic Encroachment:** While practical stakes can alter *knowledge standards* (e.g., requiring more evidence for high-stakes beliefs), this doesn’t address beliefs *creating* truth. Your cases involve *ontological* dependence, not just epistemic shifts.  
  *   **Standard Self-Fulfilling Prophecies (SFPs):** Bank runs are SFPs but are *resilient to transparency*. Your cases are SFPs that *collapse under transparency* – a crucial difference.  

  **Non-neighbours:**  
  *   **Clifford’s Evidentialism:** Clifford condemns any belief unsupported by evidence. Your cases *retroactively* gain evidence (via success), challenging his prohibition but not aligning with his framework.  
  *   **Doxastic Voluntarism:** The issue isn’t whether belief is chosen, but how *awareness of its instrumental role* undermines its efficacy.  
  *   **Pure Testimonial or Evidential Beliefs:** These lack the causal loop where belief generates its own evidence.

  ### III. The distinction, defined, with boundary cases  
  **Core Distinction:** A **Transparency-Fragile Self-Fulfilling Belief (TF-SFB)** is one where:  
  1.  Holding belief *B* (e.g., "This child will excel") causally contributes to making *B* true.  
  2.  *B*’s truth-making power *requires* the believer to *not* treat *B* as instrumental.  
  3.  Transparency about the mechanism (e.g., "I believe *B* to make it true") sabotages *B*’s efficacy, often by altering the attitude (e.g., sincere expectation becomes strategic pretense).  

  **Boundary Cases:**  
  *   **Group Beliefs:** A team’s conviction that "We can win the contract" might spur success only if members *authentically* share it. If the CEO admits, "We’re faking confidence to motivate staff," collective resolve collapses.  
  *   **Opacity via Self-Deception/Deliberate Ignorance:** A leader might sustain belief in their movement’s inevitability by *avoiding* polls showing likely failure. Here, ignorance preserves sincerity, enabling the belief’s causal power. If confronted with evidence, belief falters unless doublethink ("I know we’re likely to lose, but I *feel* we’ll win") restores opacity.  
  *   **Near-TF-SFB:** Believing "Smiling puts others at ease" works even if transparent – but this is behavioral, not doxastic. The *belief* itself isn’t fragile; the *action* (smiling) is deliberate.  

  **Contrast Case (Transparency-Resistant SFP):** A bank run succeeds *because* depositors know their panic causes collapse. Transparency *intensifies* the belief/action loop.

  ### IV. Verdict for an ethics of belief  
  TF-SFBs pose a dilemma. **Cliffordian ethics** condemns them: forming/sustaining such beliefs requires ignoring their instrumental structure, violating intellectual integrity. **Jamesian pragmatism** might permit them if they resolve a "genuine option," but their dependence on opacity conflicts with James’s ideal of sincere commitment. A **reconciled view** could argue:  
  1.  **Provisional acceptance** is permissible when evidence is genuinely ambiguous *and* stakes are high.  
  2.  **Non-doxastic attitudes** (e.g., hopeful acceptance, "acting as if") should replace belief where possible to avoid self-deception.  
  3.  **Retroactive justification** (via success) doesn’t cleanse initial epistemic negligence.  
  Ethically, cultivating such beliefs risks self-alienation, yet banning them might forfeit genuine goods. The optimal path is fostering *virtuous habits* (e.g., default trust) that make TF-SFBs unnecessary, while scrutinizing beliefs that *require* blindness to function.
