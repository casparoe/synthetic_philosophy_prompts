prompt: |-
  I debate on the national circuit, and this year most of our rounds have been about whether health care should be financed publicly or through markets. I keep running into one move, and I want to know whether it has a name before I accuse anyone of it.

  Instances. (a) A market advocate says that a woman who cannot afford a needed surgery has not been denied care: she simply does not receive something, and not receiving is not the same as being deprived of it. The comparison is to a world with no system at all. (b) The same advocate says that a patient who waits four months for the same surgery on a public waiting list is being denied care; here the comparison is to what she is owed, not to the no-system world. (c) The same advocate says that a tax funding public care takes from the taxpayer, and that his receiving care in return does not make him no worse off; now the comparison is to what he would have had but for the tax.

  The pattern I think I am seeing: the state of affairs against which worse off gets measured keeps moving — state of nature, current holdings, entitlement — and it always moves toward the conclusion being defended.

  My partner says this is not a mistake: a tax removes what someone already has, whereas unaffordable care was never his, so the two cases genuinely call for different baselines. I cannot tell whether that is a real distinction or a rationalization.

  So: is there an established concept or literature for choosing the comparison state so that it fits the conclusion, when the comparison state is itself what is in dispute? I have already been offered positive versus negative rights and doing versus allowing, and neither seems to be it: both classify kinds of act, while my worry is about which counterfactual situation counts and whether that choice can ever be non-arbitrary. If several concepts are nearby, say how mine differs from each and which one actually fits. If nothing fits, say so plainly and coin a term, with a definition and two boundary cases where it would and would not apply — and tell me whether my partner's principled version survives.
reasoning: |-
  Okay, the user is a national circuit debater dealing with a recurring argumentative move in healthcare financing debates. They've identified a pattern where opponents shift the baseline comparison to always favor their conclusion. Let me unpack their examples:

  First example shows a market advocate claiming unaffordable surgery isn't "denial" because they compare to a no-system baseline. But when public systems have wait times, suddenly the baseline shifts to current expectations. Then when discussing taxes, the comparison becomes pre-tax holdings. 

  The core concern is baseline arbitrariness - choosing whatever comparison frame makes your position look best. Their partner argues there's a principled distinction between taking versus not giving, referencing negative/positive rights frameworks. But the user suspects this might be post-hoc rationalization.

  Hmm... they've already rejected positive/negative rights and doing/allowing distinctions as not quite fitting. They want something that specifically targets the counterfactual selection problem in distributive justice debates. 

  I recall Nozick's entitlement theory does exactly this - it locks in existing holdings as the moral baseline. But in real policy debates, that baseline itself is contested. The user needs terminology for when people treat the baseline as fixed when it's actually fluid.

  "Baseline arbitrariness" seems close but too broad. "Motivated baseline selection" captures the strategic aspect. "Distributive framing effect" emphasizes how justice perceptions shift with comparison points. 

  For the partner's defense - it's coherent within libertarian frameworks but collapses when you consider how property rights are socially constructed. That tax money was never "pre-existing" in any natural sense. 

  The user would benefit from seeing how this plays out in other policy areas. Like unemployment benefits - is it "taking" from taxpayers or "denying" support to jobseekers depending on baseline choice? That might help them counter in rounds.

  Also worth noting this isn't pure sophistry - there are genuine philosophical disputes here. But in debate terms, pointing out the inconsistency in baseline application is powerful. "Why is the no-system baseline appropriate here but not there?" could be an effective line.
answer: |-
  This argumentative maneuver is a sophisticated form of **baseline arbitrariness** or **motivated baseline selection**, specifically within distributive justice. It exploits the inherent contestability of the "status quo" or "default state" against which gains/losses are measured. While there isn't one universally accepted term, several related concepts capture its essence:

  1.  **Baseline Problem (or Baseline Selection Problem) in Distributive Justice:**
      *   **Definition:** The fundamental difficulty in choosing a morally neutral or non-arbitrary starting point against which to judge whether a policy or action makes someone better off, worse off, or deprived.
      *   **Why it fits:** Your examples perfectly illustrate this problem. The advocate isn't using a consistent baseline (e.g., state of nature, current legal holdings, hypothetical entitlement); they select whichever baseline supports their immediate conclusion about who is harmed or deprived.
      *   **Boundary Cases:**
          *   *Applies:* Comparing a tax-funded system vs. a pure market system, where proponents of each define the "starting point" (pre-tax holdings vs. minimal state/no-system) to make the other look coercive or unjust.
          *   *Doesn't Apply:* Comparing two market-based policies with clear, agreed-upon property rights (e.g., changing a specific subsidy rate), where the pre-change baseline is uncontroversial.

  2.  **Motivated Reasoning / Strategic Framing:**
      *   **Definition:** Selecting frames, comparisons, or definitions not based on principle but to reach a predetermined conclusion.
      *   **Why it fits:** The baseline shift isn't driven by a consistent theory of entitlement or harm; it's driven by the desired outcome (defending markets, criticizing public systems).
      *   **Difference:** This is broader than just baseline selection; it encompasses any argumentative tactic chosen for effect rather than principle. Your focus is specifically on the *counterfactual baseline* used for harm assessment.

  3.  **Nozick's Entitlement Theory (and its Critics - Exploiting the Baseline):**
      *   **Concept:** Robert Nozick argued justice depends on how holdings *came about* (just acquisition, transfer). The baseline is *current holdings under just procedures*. Taking via tax for redistribution is unjust because it violates rights *relative to that baseline*.
      *   **Why it fits (and why it's exploited):** Your partner's defense echoes Nozick. The advocate *uses* this baseline when convenient (taxation as taking). However, they *abandon* it when it doesn't suit them:
          *   In (a), they *reject* "current holdings" (the woman's lack of money) as the baseline for "denial," switching to a hypothetical "no-system" baseline.
          *   In (b), they *reject* the "no-system" baseline (where she might never get care) and implicitly switch to a baseline of *entitlement to timely care* under the public system to claim "denial."
      *   **The Exploit:** They treat the baseline as fixed and natural *only when it serves their argument*, but shift it elsewhere when needed. They use the *rhetoric* of entitlement theory selectively without its consistency.

  4.  **The "Worseness" Problem (Parfit / Temkin):**
      *   **Concept:** Derek Parfit and Larry Temkin explored the difficulty in defining when someone is "worse off" due to the problem of selecting the appropriate comparison.
      *   **Why it fits:** Your core concern ("which counterfactual situation counts?") is directly addressing the "worseness" problem in applied policy debates. The advocate provides inconsistent answers to "Worse off than *what*?" depending on the scenario.

  **The Most Precise Fit: Motivated Baseline Selection (within the Baseline Problem)**

  This captures the core issue: the *choice* of the counterfactual state (the "compared to what") is not principled but driven by the desired conclusion, exploiting the inherent ambiguity in defining the morally relevant status quo.

  **Your Partner's Defense: Does it Survive?**

  Your partner's defense ("tax removes existing holdings, unaffordability is just non-provision") is **coherent within a strict libertarian/Nozickian framework** but **fails to resolve the arbitrariness** you've identified:

  1.  **Inconsistency in Application:** The defense *only* justifies the shift between (c) and (a). It does *not* justify the shift between (a) and (b):
      *   Why is the "no-system" baseline appropriate for judging the market outcome (a), but the "entitlement-to-timely-care" baseline appropriate for judging the public outcome (b)? The defense based on taking vs. not-giving doesn't explain this shift.
  2.  **Contestability of "Existing Holdings":** The baseline of "existing holdings" itself relies on a prior (and contested) theory of just acquisition and property rights. Is the pre-tax distribution of wealth itself just? The market advocate assumes it is, but this is precisely what's often debated in healthcare financing. Using this baseline *as fixed* begs the question against public financing.
  3.  **Ignoring Systemic Effects:** Framing unaffordability solely as "non-provision" ignores how the market system itself structures opportunities and constraints. Did systemic factors (e.g., low wages, lack of insurance regulation, prior injustices) contribute to her inability to afford care? The "no-system" baseline hides this.
  4.  **Arbitrary Separation:** The defense assumes a clear, natural distinction between "taking" and "not giving." However, refusing to create a system that provides care (or structuring a system where care is unaffordable) can be seen as actively shaping the distribution of burdens and benefits, not merely passive non-provision. The baseline chosen determines whether this counts as "taking" or "allowing."

  **Conclusion:**

  The move you've identified is best described as **Motivated Baseline Selection** or exploiting the **Baseline Problem in Distributive Justice**. It involves strategically shifting the counterfactual state ("compared to what?") to always generate the desired conclusion about who is harmed or deprived. While your partner points to a distinction used within libertarian theory (taking vs. not giving), this distinction (1) does not justify the *full pattern* of baseline shifts you observe (especially the shift regarding waiting lists), and (2) relies on a baseline ("existing holdings") that is itself a core part of the dispute and not a neutral starting point. The choice of baseline is rarely non-arbitrary in deep political disputes; pointing out this motivated inconsistency is a valid and powerful critical argument. Accurately naming it strengthens your case.
