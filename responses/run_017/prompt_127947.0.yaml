  ### Residue Report: Translation and Stress Tests  
  **Core Disagreement Adjudication**  
  - **Colleague's Claim** (RL formalism precludes debate):  
    - **Correct**: RL’s policy \(\pi(o)\) mandates identical actions at identical observations. Planning-optimality (\(p = 5/8\)) is the only criterion expressible.  
    - **Why?** RL optimizes \(\mathbb{E}[\text{Return}]\) over policies; no ontologically separate "actions" to evaluate off-policy.  

  - **Graduate Student's Claim** (RL smuggles in centeredness):  
    - **Partially Correct**: States \(s_1/s_2\) are **centered** (include agent’s location), but RL’s **belief representation** is uncentered.  
    - **Failure Mode**: RL’s \(\Pr(s|h)\) assumes sufficient statistics from history \(h\), but **imperfect recall** destroys history. Agent cannot compute \(\Pr(s_1 | o)\).  

  **Where Translation Fails**  
  - **Clean Mapping**:  
    - Environment dynamics, episodic return, memoryless policies.  
    - Planning-optimality = RL’s default objective.  
  - **Distorted Mapping**:  
    - **Self-locating belief**: Occupancy measures are **offline analysis tools**; not agent-accessible. P&R consistency assumes agents compute beliefs they cannot.  
  - **No Counterpart**:  
    - **Indexical uncertainty**: RL states are centered, but belief updates require memorizing history (impossible here). "Where I am" is state \(s\), but agent cannot condition on \(s\).  

