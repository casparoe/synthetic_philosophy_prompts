  **2. Wheel Trembles**:
  With a small probability, the car does the opposite of the intended action. The driver cannot tell whether the intended action was executed. 

  In RL, this is typically modeled as a non-deterministic transition. So the action `exit` might actually be `continue` with probability `ε`, and vice versa. The driver does not observe the actual action taken (only the same observation of the intersection). 

