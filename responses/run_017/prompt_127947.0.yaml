  - The stress tests show that the framework extends naturally to noisy signals and action noise. The dashcam does not change the ex-ante optimal policy.
  - Policy gradient training will naturally converge to the planning-optimal policy (p=5/8) without needing to compute the self-locating belief.

  Therefore, the translation of the AMD problem into RL terms shows that the planning-optimal policy is the only one that makes sense within the constraints of the problem (imperfect recall and reactive policy). The philosophical debate about action-optimality is an artifact of considering information (the belief state) that the agent does not have access to.

  The failure in translation is not of the RL vocabulary but of the attempt to apply a decision criterion (action-optimality) that requires more information than available.
