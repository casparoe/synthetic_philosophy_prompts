  ### Conclusion

  - The RL framework naturally captures the planning-optimal policy for the AMD problem. 
  - The controversy between planning-optimality and action-optimality arises when we consider conditioning on the belief state, but the agent cannot compute the belief state due to imperfect recall. Therefore, the RL framework (which requires the policy to be a function of the current observation only) avoids the controversy by design.
