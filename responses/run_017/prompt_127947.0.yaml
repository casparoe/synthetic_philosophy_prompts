  The ex-post evaluation does not change the driver's information during the trip. The objective is still the expected return (from the ex-ante perspective). The dashcam record might allow the engineer to evaluate the performance of the policy in hindsight, but it doesn't change the fact that the driver must choose a policy with the information available during the trip.

