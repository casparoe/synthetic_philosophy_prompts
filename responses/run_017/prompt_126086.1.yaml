  We are drafting a joint statement after a two-day adversarial collaboration between an Evidentialist (Clifford-style) and a Permissionist (James-style). The document must include agreed claims, a disagreements table, concrete cases for each crux, and a closing section on residual disputes. We must adhere to the stipulations and address the variants and cruxes.

  Key elements:

  - **Bootstrapping proposition**: True partly because the agent believes it.
  - **Evidential feedback**: Evidence balanced and depends on what the agent believes (actions bring confirming evidence).
  - **Attitudes**: Full belief (assert and act without hedging), role-acceptance (act as if within role, not settled), avowal (public commitment).

  Anchoring case: Mara and Dev's collaboration. Mara's belief affects the outcome. Evidence balanced and no time for more.

  Variants:
  1. The bystander (department chair) - no causal influence.
  2. Transparent bootstrap - Mara knows her belief makes it true.
  3. Failed bootstrap - Mara believes, invests, but fails; ex ante vs ex post permissibility.
  4. Attitude substitution - Mara uses role-acceptance or avowal instead of full belief.

  Cruxes:
  - Is the truth-making power of belief evidence? (Evidentialist might use it to avoid concession; Permissionist sees it as a different reason.)
  - Does permission extend to the bystander? (Tests if reason is causal efficacy or agent's stance.)
  - Is the dispute about full belief or only acceptance/avowal?
  - What counts as insufficient evidence? (Independent evidence vs total including facts about what she would believe.)

  Deliverables:

  1. **Agreed Claims (8-12)**: Non-vacuous, something one would have denied or does real work.
  2. **Disagreements Table**: Columns: Crux; Evidentialist's formulation; Permissionist's formulation; What each counts as evidence against its own view; Each side's prediction for the test case.
  3. **For each crux**: Concrete case/argument that both accept as bearing on it, with predictions.
  4. **Closing**: Identify verbal disputes and what is substantively in dispute. Flag what would move the debate.

  Word limit: under 1,300 words.

