  Let's outline:

  ### 1. Agreed Claims (8-12, non-vacuous)

  We need 8-12 claims that both parties agree on after discussion. They should be non-trivial and relevant to the cruxes.

  Possible agreed claims:

  1. Belief formation is subject to normative evaluation.
  2. The ethics of belief primarily concerns full belief, but role-acceptance and avowal may also be subject to norms.
  3. In the anchoring case, Mara's full belief that the collaboration is worth salvaging can causally influence whether it becomes worth salvaging.
  4. The evidence available to an agent at the time of belief formation is crucial for evaluating the permissibility of that belief.
  5. For a proposition that is bootstrapping for an agent, the agent's belief can be a causal or constitutive factor in its truth.
  6. Evidential feedback occurs when the agent's belief affects the evidence she will encounter.
  7. In cases of evidential feedback, the agent's actions (based on belief) can generate confirming evidence.
  8. The permissibility of a belief is typically assessed ex ante, based on the evidence available at the time of belief formation.
  9. The bystander (chair) lacks the causal power to influence the truth of the proposition about the collaboration.
  10. Full belief requires a higher degree of commitment than role-acceptance or avowal.
  11. If an agent cannot form a full belief, role-acceptance or avowal might be permissible alternatives in practical contexts.
  12. A proposition being bootstrapping does not, by itself, provide direct evidence for the truth of that proposition.

  ### 2. Disagreements Table

  We have several cruxes. Let's list them:

  Crux A: Is the causal role of belief in making a proposition true a form of evidence that can be weighed by the evidentialist norm?

  Crux B: Does the permission to believe extend to the bystander (chair) who cannot influence the outcome?

  Crux C: Is the ethics of belief primarily about full belief, and does the permissionist position require full belief or is role-acceptance/avowal sufficient?

  Crux D: What constitutes insufficient evidence? Is it the independent evidence only, or does it include facts about the agent's own attitudes and their effects?

  For each crux:

  - Evidentialist formulation
  - Permissionist formulation
  - What each counts as evidence against their own view
  - Each side's prediction for the test case (from variants)

  ### 3. Concrete cases for each crux

  For each crux, we'll describe a concrete case or argument that both accept as relevant, and record each side's prediction.

  ### 4. Closing

  Identify any verbal disputes and the substantive residual dispute. Also, what would move the debate.

  Now, let's write the document step by step.

  ---

  **Joint Statement: Adversarial Collaboration on the Ethics of Belief**

  **Agreed Claims**

  After extensive discussion, we, the Evidentialist and the Permissionist, agree on the following points:

  1. Beliefs are subject to normative evaluation, and the ethics of belief concerns the conditions under which forming or maintaining a belief is permissible or impermissible.
  2. The primary focus of the ethics of belief is on full belief — an attitude where the agent would assert the proposition and act on it without hedging.
  3. Role-acceptance (acting as if a proposition is true within a specific institutional role without treating it as settled) and avowal (publicly expressing commitment to a proposition) are distinct attitudes that may be subject to different norms.
  4. For some propositions, an agent's full belief can be a causal or constitutive factor in making that proposition true; such propositions are bootstrapping for that agent.
  5. In cases of evidential feedback, the evidence available to the agent is balanced in a way that depends on the agent's own belief, because the agent's actions based on belief will generate confirming evidence.
  6. The permissibility of a belief is assessed at the time of belief formation (ex ante), based on the evidence then available, and not solely on the eventual outcome (ex post).
  7. In the anchoring case, Mara's full belief that the collaboration is worth salvaging can causally influence whether it becomes worth salvaging, given that it is a bootstrapping proposition for her.
  8. The department chair (the bystander) lacks any causal influence on the collaboration; thus, the chair's belief cannot make the proposition about the collaboration's salvageability true.
  9. The mere fact that a proposition is bootstrapping does not, by itself, constitute evidence for the truth of that proposition; it is a fact about how the proposition can be made true, not evidence of its current truth.
  10. When an agent cannot form a full belief, role-acceptance or avowal may be permissible in practical contexts to achieve important goals, even if full belief would be impermissible.
  11. The ethics of belief must account for the agent's epistemic situation, including the urgency of the decision and the unavailability of further evidence.
  12. In the failed bootstrap variant, the fact that the belief turns out false does not, by itself, entail that the belief was impermissible ex ante.

  **Disagreements Table**

  We continue to disagree on the following points:

  | Crux | Evidentialist's Formulation | Permissionist's Formulation | Evidence Against Own View | Prediction for Test Case |
  |------|----------------------------|----------------------------|---------------------------|--------------------------|
  | **A: The nature of the bootstrap reason** | The fact that a proposition is bootstrapping for an agent is not a reason for belief because it is not evidence of the proposition's truth. It is a practical consideration that may justify action but not belief. | The fact that a proposition is bootstrapping for an agent can be a non-evidential reason that makes belief permissible when the evidence is balanced and the matter is genuine and momentous. | *Evidentialist*: If it were shown that the bootstrap fact is a form of evidence (e.g., by being part of the total evidence), then it could be ingested. *Permissionist*: If it were shown that such reasons inevitably lead to self-deception or epistemic irresponsibility in key cases. | *Variant 2 (transparent bootstrap)*: Evidentialist: Mara may not believe. Permissionist: Mara may believe. |
  | **B: Extension to the bystander** | The bystander (chair) must base belief solely on the available evidence, which is balanced, so the chair must suspend belief. The lack of causal connection means there is no bootstrap reason. | The bystander (chair) may believe if the matter is genuine and momentous, even without causal power, because the stance of belief is appropriate when evidence is balanced. | *Evidentialist*: If it were shown that the chair's belief could indirectly influence outcomes. *Permissionist*: If it were shown that the chair's belief, without causal power, leads to epistemic recklessness. | *Variant 1 (bystander)*: Evidentialist: Chair must suspend. Permissionist: Chair may believe. |
  | **C: Attitude required** | The ethics of belief is about full belief, and the permissionist position, if it permits full belief without sufficient evidence, is unjustified. Role-acceptance and avowal are not beliefs and may be permissible when full belief is not. | The ethics of belief permits full belief in genuine, momentous cases with balanced evidence, even if role-acceptance and avowal are possible; full belief is sometimes necessary for effective action. | *Evidentialist*: If it were shown that role-acceptance/avowal always suffices for practical purposes. *Permissionist*: If it were shown that full belief is never required for effective action. | *Variant 4 (attitude substitution)*: Evidentialist: Mara may only role-accept/avow. Permissionist: Mara may full believe, but role-acceptance/avowal is a fallback. |
  | **D: Sufficiency of evidence** | Insufficient evidence means that the independent evidence (i.e., evidence not about the agent's own attitudes or their effects) does not support the proposition. Facts about the agent's future actions and their effects are not evidence for the truth of the proposition. | The total evidence includes facts about the agent's own attitudes and their causal powers, so when a proposition is bootstrapping, the fact that belief would make it true is part of the evidence. | *Evidentialist*: If it were shown that facts about future actions are part of the total evidence. *Permissionist*: If it were shown that including such facts leads to contradictions in evidence assessment. | *Anchoring case*: Evidentialist: Evidence insufficient. Permissionist: Evidence sufficient because of bootstrap. |

  **Concrete Cases for Each Crux**

  For each crux, we have considered the following cases:

  - **Crux A (Nature of bootstrap reason)**: We use the transparent bootstrap variant. Mara knows that her belief will make the collaboration worth salvaging, and the independent evidence is balanced. The Evidentialist predicts that Mara must suspend belief because the bootstrap fact is not evidence. The Permissionist predicts that Mara may believe because the bootstrap fact provides a non-evidential reason.
    
  - **Crux B (Bystander)**: We use the bystander variant. The chair has the same balanced evidence but no causal power. The Evidentialist predicts the chair must suspend belief. The Permissionist predicts the chair may believe if the matter is genuine and momentous.

  - **Crux C (Attitude required)**: We use the attitude substitution variant. Mara cannot form full belief but can role-accept or avow. The Evidentialist predicts that only role-acceptance or avowal is permissible. The Permissionist predicts that full belief is permissible if possible, but if not, role-acceptance or avowal may be a fallback.

  - **Crux D (Sufficiency of evidence)**: We use the anchoring case. The Evidentialist argues that the independent evidence (Dev's track record, rupture, etc.) is balanced and therefore insufficient for belief. The Permissionist argues that the total evidence includes the fact that Mara's belief would cause the collaboration to be worth salvaging, making the evidence sufficient for belief.

  **Closing Section on Residual Dispute**

  We have identified that part of our dispute on Crux D is verbal: we both use the term "evidence" but disagree on whether it includes facts about the agent's causal powers. Setting this aside, the substantive dispute remains: whether non-evidential reasons (such as the practical necessity of belief in bootstrapping cases) can ever justify belief. This is closely tied to Crux A.

  Both parties agree that the following would move the debate: empirical findings on whether treating bootstrap facts as reasons for belief leads to more true beliefs in the long run without promoting self-deception. If such studies showed a net epistemic benefit, the Evidentialist might reconsider; if they showed systematic bias, the Permissionist might reconsider.

  The core disagreement is whether the norms of belief are purely epistemic (based on truth-related reasons) or whether they can be pragmatically inflected in certain circumstances without compromising the integrity of belief.

  \answer{mixed; whether non-evidential reasons can justify belief}
answer: |-
  **Joint Statement: Adversarial Collaboration on the Ethics of Belief**  

  ### 1. Agreed Claims  
  We, the Evidentialist and the Permissionist, affirm the following after deliberation:  
  1. Full belief—asserting and acting without hedging—is the primary attitude governed by the ethics of belief, but role-acceptance and avowal may also be normatively evaluated in practical contexts.  
  2. A proposition is bootstrapping for an agent only if her belief causally or constitutively contributes to its truth, regardless of whether she is aware of this relationship.  
  3. Evidential feedback arises when the balance of evidence available to an agent depends on her belief, as her actions based on that belief generate confirming evidence.  
  4. In the anchoring case, Mara faces a genuine, momentous, and forced choice where evidence about the collaboration’s salvageability is balanced and unamendable; her full belief would bootstrap its truth.  
  5. The department chair (bystander) lacks causal influence over the collaboration’s outcome, so the proposition is not bootstrapping for her.  
  6. The permissibility of an attitude is determined ex ante (at formation), not by ex post outcomes (e.g., failed bootstrap). A false belief does not retroactively render it impermissible.  
  7. For bootstrapping propositions, the agent’s knowledge of the bootstrap relationship (transparent case) does not alter the normative status of belief; it remains a fact about how truth is achieved, not evidence.  
  8. When full belief is unattainable, role-acceptance or avowal may be permissible as substitutes to achieve practical ends, but they do not constitute full belief.  
  9. Insufficient evidence is defined relative to the agent’s total available evidence at the time of attitude formation, but parties disagree on what constitutes "total evidence."  
  10. The ethics of belief forbids forming full beliefs solely to produce good consequences if evidence is insufficient, but parties disagree on whether "insufficient" excludes bootstrapping cases.  
  11. Role-acceptance and avowal are permissible in urgent, high-stakes scenarios even if evidence is balanced, but only full belief directly bootstraps.  
  12. The dispute is substantive: it centers on whether non-evidential reasons can justify full belief.  

  ### 2. Disagreements Table  
  | Crux | Evidentialist's Formulation | Permissionist's Formulation | Evidence Against Own View | Prediction for Test Case |  
  |------|----------------------------|----------------------------|---------------------------|--------------------------|  
  | **A: Nature of the bootstrap reason** | The truth-making power of belief is a practical fact about causation, not evidence for the proposition’s truth. It cannot justify belief without sufficient independent evidence. | The truth-making power of belief provides a non-evidential reason to believe when evidence is balanced, the matter is genuine, and belief bootstraps truth. | *Evidentialist*: If bootstrap facts are shown to be reliable indicators of truth (e.g., via empirical studies). *Permissionist*: If bootstrap reasons consistently lead to false beliefs in controlled cases. | *Transparent bootstrap*: Evidentialist: Mara may not believe. Permissionist: Mara may believe. |  
  | **B: Extension to the bystander** | The bystander must suspend belief; lacking causal power, she has no bootstrap reason, and balanced evidence mandates agnosticism. | The bystander may believe; the permissibility arises from the genuine/momentous context and balanced evidence, not causal efficacy. | *Evidentialist*: If bystander beliefs demonstrably improve truth-tracking. *Permissionist*: If bystander beliefs cause harm without epistemic gain. | *Bystander*: Evidentialist: Chair must suspend. Permissionist: Chair may believe. |  
  | **C: Scope of attitudes** | Permissionism is unnecessary; only role-acceptance/avowal are ever permissible in bootstrapping cases, as full belief requires independent evidence. | Full belief is sometimes permissible and necessary for effective action; role-acceptance/avowal are fallbacks but less efficacious. | *Evidentialist*: If full belief is proven more effective in bootstrap cases. *Permissionist*: If role-acceptance always suffices for practical success. | *Attitude substitution*: Evidentialist: Mara may role-accept/avow only. Permissionist: Mara may full believe, but substitution is acceptable if belief fails. |  
  | **D: Definition of insufficient evidence** | Evidence is insufficient if independent factors (e.g., Dev’s track record) do not support the proposition; facts about the agent’s future beliefs/actions are irrelevant. | Evidence is insufficient only if the total evidence—including facts about the agent’s causal role—fails to support the proposition; bootstrap facts are evidence. | *Evidentialist*: If "total evidence" is redefined to include causal facts without circularity. *Permissionist*: If causal facts are shown to distort evidence assessment. | *Anchoring case*: Evidentialist: Evidence insufficient. Permissionist: Evidence sufficient (due to bootstrap). |  

  ### 3. Concrete Cases for Each Crux  
  - **Crux A (Nature of bootstrap reason)**: *Transparent bootstrap variant*. Mara knows her belief bootstraps and evidence is balanced. Evidentialist predicts belief is impermissible (no evidence); Permissionist predicts it is permissible (non-evidential reason).  
  - **Crux B (Extension to bystander)**: *Bystander variant*. Chair has identical evidence but no causal power. Evidentialist predicts suspension is required; Permissionist predicts belief is optional.  
  - **Crux C (Scope of attitudes)**: *Attitude substitution variant*. Mara cannot believe but can role-accept/avow. Evidentialist predicts only substitution is allowed; Permissionist predicts full belief is ideal but substitution is second-best.  
  - **Crux D (Definition of insufficient evidence)**: *Anchoring case*. Evidentialist judges evidence insufficient (ignoring bootstrap); Permissionist judges it sufficient (including bootstrap).  

  ### 4. Closing Section on Residual Dispute  
  Verbal elements include the term "evidence" in Crux D: both agree on the facts (e.g., bootstrap causation) but dispute whether they constitute evidence. Setting this aside, the substantive disagreement is whether non-evidential reasons (e.g., bootstrapping efficacy) can ever permit full belief when independent evidence is balanced. Both parties agree that empirical data on the long-term truth-conduciveness of bootstrap-based beliefs—e.g., studies comparing outcomes when agents act on belief versus role-acceptance in controlled bootstrapping scenarios—would most move the debate.  

  \answer{mixed; long-term truth-conduciveness of bootstrap-based beliefs}
