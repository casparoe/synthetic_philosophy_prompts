            3. Searches through all possible proofs in the formal system for a proof of the statement "The program represented by `g` does not have property `P`".
            4. If it finds such a proof, it immediately has property `P` (for example, by returning 0). But then the proof said it does not have property `P` — contradiction if the system is sound.
            5. If it never finds such a proof, then it does not have property `P` (so it might, for example, return 1). But then the statement "The program represented by `g` does not have property `P`" is true, but unprovable.

          However, note: we are assuming the system is consistent and sound? Actually, we need consistency. We don't require soundness for the first incompleteness theorem? Let me recall: the theorem requires consistency and recursiveness (effectiveness) and enough arithmetic.

          Actually, the standard construction uses a provability predicate. We can simplify:

          Let `G` be a statement that says: "There is no proof in the system of `G`" (or more precisely, the arithmetization of that).

          But for programmers, we can do:

          Consider a function `f` that takes a string representing a function `h` (as source code) and then does:
            - It constructs a statement `S(h)` that says: "When `h` is run on the string `h`, it returns 0".
            - Then it searches for a proof in the system that `S(h)` is false (i.e., that `h(h)` != 0).
            - If it finds such a proof, it returns 0. Otherwise, it returns 1.

          Now, let `g` be the string representing the function `f`. What happens when we run `f(g)`?
            - `f(g)` looks for a proof that `S(g)` is false, i.e., that `f(g)` != 0.
            - If it finds such a proof, then it returns 0. But then the proof said it wouldn't return 0, so the proof is wrong (if the system is sound). But we are only assuming consistency? Actually, we need to be careful.

          Alternatively, we can use the standard fixed-point construction from computability.

          But note: we are trying to avoid turning it into a Turing machine lecture.

     - **What it must NOT have**:
       - Avoid making it seem like a paradox that breaks the system. The point is that the system is incomplete, not inconsistent.
       - Avoid using a direct self-referential statement that is obviously paradoxical (like "this statement is false").
     - **Proposed example**: We can use the idea of a program that checks for a proof of its own non-termination. But that gets close to the halting problem.

          How about:

            Define a program `P` that:
              1. Obtains its own source code (via quining).
