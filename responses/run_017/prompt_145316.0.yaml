  2. A genuine violation: a scenario where the agent's action is evidence about the state without causing it, and a free signal screens off the action from the state. This removes an evidential reason to abstain, leading the agent to take an action she would rather have avoided. The candidate should identify which step of the proof breaks (the maximization is not over a single act-independent distribution).

  3. A case where the signal itself is in the utility function: the agent would pay not to know. The candidate should note that the problem specification is at fault, and the theorem holds under a reformulation (by including the state of knowledge in the state space).

  Additionally, we want the candidate to explain why the guarantee is ex ante only (a particular realization might leave the agent worse off) and when the value of a signal is zero (when no reading changes the action).

  We also include a fourth case: being offered the measurement is bad news that the agent cannot decline, but the reading itself, conditional on the offer, is still valuable.

  We now write the question, model answer, and marking scheme.

  **Question (as it should appear on the paper):**

  You are advised to spend no more than forty-five minutes on this question.

  Good’s theorem states that for an agent who maximises expected utility, the expected utility of the agent’s situation cannot be decreased by the arrival of new information that is free of charge. This expected utility is computed before the information arrives. The theorem is proved by showing that the expected utility when the agent can condition on the information is at least as great as that when the agent must act without it.

  Consider the following scenarios. For each, compute the relevant expected utilities and explain how the scenario bears on the scope of Good’s theorem. Use the computations to support your claims. The arithmetic is designed to be done by hand.

  Case 1: An agent is deciding whether to measure a physical quantity X that is either 0 or 1. The prior probability that X=1 is 1/2. The measurement device reports the true value with probability 3/4, but the act of measurement perturbs X: if X was 0, it becomes 1 with probability 1/2; if X was 1, it becomes 0 with probability 1/2. The agent must choose an action A from {0,1}. The utility is 1 if A equals the true X after any perturbation (so after measurement if measurement is done), and 0 otherwise. The measurement is free but the perturbation cost is inherent. The agent can choose to measure or not. Compute the expected utility of (i) not measuring, (ii) measuring and then choosing A optimally given the reading. Should the agent measure? How does this relate to Good’s theorem?

  Case 2: An agent is offered a free and perfectly reliable signal about a state S which is either 0 or 1, with prior P(S=1)=1/2. The agent must then choose an action A from {0,1}. The utility depends on S and A: U(A,S)=1 if A=S, 0 otherwise. However, the agent has an additional option: she can abstain (action ∅) for a utility of 0.6, regardless of S. Moreover, the agent’s choice of action is evidence about S: specifically, if the agent chooses to take action A=1 (without seeing the signal), it is because she has a predisposition that makes S more likely to be 1. To model this, suppose that the agent has a type T which is either 0 or 1, with P(T=1)=1/2, and S is equal to T with probability 3/4. The agent knows her type T. If the agent sees the signal, she will learn S perfectly and then choose A=S (since that yields utility 1>0.6). Without the signal, the agent knows T and must choose among A=0, A=1, or ∅. Compute the expected utility of the agent without the signal and with the signal (before seeing the signal). Does the signal increase the ex ante expected utility? If not, explain which step of the proof of Good’s theorem fails.

  Case 3: An agent is deciding whether to observe a free and perfectly reliable signal that will reveal whether a coin toss landed Heads (H) or Tails (T). The prior probability of H is 1/2. The agent must then place a bet: she can choose to bet on H, bet on T, or not bet. If she bets correctly, she wins £1; if incorrectly, she loses £1; if she doesn't bet, she gets 0. The agent, however, is loss-averse: she gets utility 1 for winning, -2 for losing, and 0 for not betting. Moreover, the agent is aware that if she learns the outcome, she will be unable to resist betting (because the expected utility of betting, given the known outcome, is positive: 1 if she bets on the true outcome). Without the signal, she can choose not to bet. Compute the expected utility with and without the signal (ex ante). Would the agent prefer not to see the signal? How is this consistent with Good’s theorem?

