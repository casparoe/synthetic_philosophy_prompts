  - 2 marks: For (b), condition that no signal realisation changes the action.  
  - 1 mark: Overall clarity and correctness.  
  *Blunder example: States the value is zero when the signal is independent of the state, without linking to action change.*  

  **General:** An answer that only states and proves Good’s theorem without engaging the cases receives 5 marks (a bare pass if 10 is pass, but below threshold for competency). Marks are lost per case if the candidate fails to compute utilities or address the theorem’s scope. For instance, omitting the causal analysis in Case 1 loses a mark. Ensure arithmetic is checked: minor errors (e.g., calculation slips) may lose marks if they propagate.
