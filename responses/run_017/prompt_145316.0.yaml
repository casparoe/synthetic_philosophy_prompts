   (a) The guarantee is ex ante because a particular realization of the signal might lead the agent to take an action that turns out to be worse than what she would have done without the signal. For example, in Case 3, if the coin is Tails, the agent will bet and lose, getting -2, whereas without the signal, she would have gotten 0. But on average, over the signal, she gets 1, which is better than 0. So the expected utility before seeing the signal is higher.

