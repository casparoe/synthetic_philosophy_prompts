  We are constructing an exam question on Good's theorem, which states that for an agent maximizing expected utility, free information cannot lower the expected utility assessed before the information arrives. We want the candidate to work through specific cases that illustrate the scope and limitations of the theorem. The cases should require computation and decision tree setup.

