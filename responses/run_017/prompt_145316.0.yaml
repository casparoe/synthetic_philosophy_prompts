  ### Question  
  Good’s theorem states that for an agent who maximises expected utility, the expected utility of the agent’s situation, assessed before the information arrives, cannot be decreased by the arrival of new information that is free of charge. The theorem is proved using Jensen’s inequality applied to the convexity of the maximum expected utility given the information. Consider the following scenarios. For each, compute the relevant expected utilities, answer the specific questions, and explain how the scenario illuminates the scope or limitations of Good’s theorem. The arithmetic is designed to be done by hand.  

  **Case 1:** An agent measures a quantity \(X\), which is initially 0 or 1 with equal prior probability. The measurement device reports the true value correctly with probability \(3/4\), but the act of measurement perturbs \(X\): if \(X = 0\), it becomes 1 with probability \(1/2\); if \(X = 1\), it becomes 0 with probability \(1/2\). The agent chooses an action \(A\) from \(\{0, 1\}\). Utility is 1 if \(A\) equals the true \(X\) after any perturbation (i.e., after measurement if performed), and 0 otherwise. The measurement is free, but the perturbation occurs only if measurement is done. Compute the expected utility (i) without measurement and (ii) with measurement (where the agent chooses \(A\) optimally given the report). Should the agent measure? How does this bear on Good’s theorem?  

  **Case 2:** An agent may be offered a free, perfectly reliable measurement of a state \(S\) (0 or 1, prior \(P(S=1) = 1/2\)). The probability of being offered the measurement is \(1/4\) if \(S = 1\) and \(3/4\) if \(S = 0\). The agent cannot decline the measurement if offered. After receiving the measurement (if offered), the agent chooses an action \(A\) in \(\{0, 1\}\) with utility 1 if \(A = S\) and 0 otherwise. If not offered, the agent chooses without information. Compute the overall expected utility (ex ante, before any offer). Then, conditionally on being offered the measurement, compute the expected utility (after the offer but before the measurement). Is the measurement valuable to the agent given that it is offered? How does this bear on Good’s theorem?  

  **Case 3:** An agent decides whether to observe a free, perfectly reliable signal revealing the outcome of a fair coin toss (Heads or Tails, each probability \(1/2\)). After any observation, the agent must choose to bet on Heads, bet on Tails, or not bet. Correct betting yields utility 1, incorrect betting yields utility \(-2\), and not betting yields 0. The agent is loss-averse: if she knows the outcome, she cannot resist betting (as utility 1 dominates 0). Without the signal, she may choose not to bet. Compute the expected utility (i) without the signal and (ii) with the signal (ex ante, before observation). Would the agent prefer not to see the signal? How is this consistent with Good’s theorem?  

  In light of these cases, briefly explain (a) why Good’s theorem’s guarantee is only *ex ante* (before the information arrives), and (b) under what condition the value of a signal is exactly zero.  

  ### Model Answer  
  **Case 1 Analysis:**  
  (i) Without measurement, the true \(X\) is unchanged. The agent chooses \(A\) to maximise expected utility. With \(P(X=1) = 1/2\), the expected utility for any \(A\) is \(P(A=X) = 1/2\). Thus, expected utility is \(0.5\).  
  (ii) With measurement, the state is perturbed: for initial \(X=0\) (probability \(1/2\)), \(X\) becomes \(X'\), which is 0 or 1 with equal probability. Similarly for \(X=1\). The report \(R\) is correct with probability \(3/4\). The agent sets \(A = R\). To find \(P(A = X')\), note \(X'\) is independent of \(X\) and uniform. For fixed initial \(X\), \(P(A = X') = P(R = X')\). Since \(R\) depends on \(X\) and \(X'\) is independent of both \(X\) and \(R\), \(P(R = X') = 1/2\) in all cases (e.g., if \(X=0\), \(R=0\) with probability \(3/4\), but \(X'\) is independent and equal to \(R\) with probability \(1/2\)). Thus, expected utility is \(0.5\). The agent is indifferent. This does not violate Good’s theorem, as the expected utility does not decrease. The theorem assumes conditioning on a signal about a fixed state, but here the measurement *intervenes* on the state. The operation’s value decomposes: the informational value would be non-negative for a fixed state, but the causal effect (randomisation) negates it. Good’s theorem does not apply to interventions that alter the state.  

  **Case 2 Analysis:**  
  The overall expected utility (ex ante): Let \(O\) be the offer event. \(P(O) = P(O \mid S=1)P(S=1) + P(O \mid S=0)P(S=0) = (1/4)(1/2) + (3/4)(1/2) = 1/2\). If offered, the agent learns \(S\) and sets \(A=S\), getting utility 1. If not offered, no information, so expected utility for any \(A\) is \(P(A=S) = 1/2\). Thus, ex ante expected utility is \(P(O) \times 1 + (1 - P(O)) \times (1/2) = (1/2)(1) + (1/2)(1/2) = 3/4\).  
  Conditionally on \(O\), after the offer but before measurement, the agent’s expected utility: Given \(O\), \(P(S=0 \mid O) = P(O \mid S=0)P(S=0)/P(O) = (3/4 \times 1/2)/(1/2) = 3/4\). Without measurement, if the agent had to choose now, she would choose \(A=0\) (since \(P(S=0) = 3/4\)) for expected utility \(P(S=0) = 3/4 = 0.75\). With the measurement, she will get 1. Thus, the measurement increases expected utility to 1, so it is valuable given the offer. The overall ex ante expected utility is higher with the possibility of the offer (\(3/4 > 1/2\), the latter being utility if no offer ever occurs). The offer is "bad news" about \(S\) (indicating likely \(S=0\)), but the signal itself remains valuable. Good’s theorem holds ex ante, but conditional realisations (like receiving the offer) may correlate with undesirable states.  

  **Case 3 Analysis:**  
  (i) Without signal: The agent chooses not to bet, as betting on Heads (or Tails) has expected utility \((1/2)(1) + (1/2)(-2) = -0.5 < 0\). Utility is 0.  
  (ii) With signal: She observes and bets on the known outcome. For Heads or Tails (each probability \(1/2\)), she gets utility 1. Thus, ex ante expected utility is 1.  
  The signal increases expected utility from 0 to 1, consistent with Good’s theorem. The agent, if rational, should accept. However, in particular realisations (e.g., Tails), she gets \(-2\), worse than 0 without the signal. The agent might "prefer" not to know due to myopic loss aversion, but this is not rational under her utility function. The theorem is not false: the utility function excludes psychological costs of knowing. If utility included distress from awareness (e.g., anxiety), the signal might not be free. Reformulating to include "knowledge state" in the state space, Good’s theorem holds for the new utility.  

  **Part (a):** Good’s theorem’s guarantee is only *ex ante* because a specific realisation of the signal may lead the agent to choose an action that, given the unknown state, results in lower utility than the action chosen without the signal. For example, in Case 3, observing Tails causes a utility of \(-2\), whereas no signal yields 0. However, the *average* over all signal realisations is non-lowering.  

  **Part (b):** The value of a signal is exactly zero when no possible outcome of the signal would change the agent’s action. That is, the optimal action is identical for all signal realisations under the posterior distributions. For instance, if, regardless of the signal, the agent would choose the same action, the signal cannot improve expected utility.  

