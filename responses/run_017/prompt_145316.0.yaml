  **Final Question:**

  Good’s theorem states that for an agent who maximises expected utility, the expected utility of the agent’s situation cannot be decreased by the arrival of new information that is free of charge. This expected utility is computed before the information arrives. Consider the following scenarios.

  Case 1: An agent is deciding whether to measure a physical quantity X that is either 0 or 1. The prior probability that X=1 is 1/2. The measurement device reports the true value with probability 3/4, but the act of measurement perturbs X: if X was 0, it becomes 1 with probability 1/2; if X was 1, it becomes 0 with probability 1/2. The agent must choose an action A from {0,1}. The utility is 1 if A equals the true X after any perturbation (so after measurement if measurement is done), and 0 otherwise. The measurement is free but the perturbation cost is inherent. The agent can choose to measure or not. Compute the expected utility of (i) not measuring, (ii) measuring and then choosing A optimally given the reading. Should the agent measure? How does this bear on Good’s theorem?

  Case 2: An agent may be offered a free and perfectly reliable measurement of a state S (0 or 1, prior P(S=1)=1/2). The probability that the offer is made is 1/4 if S=1 and 3/4 if S=0. The agent cannot decline the measurement if offered. After receiving the measurement ( if offered), the agent chooses an action A in {0,1} with utility 1 if A=S and 0 otherwise. If not offered, she must choose A without information. Compute the overall expected utility. Then, conditionally on being offered the measurement, compute the expected utility (after learning of the offer but before seeing the measurement). Is the measurement valuable given that it is offered? How does this bear on Good’s theorem?

  Case 3: An agent is deciding whether to observe a free and perfectly reliable signal that will reveal whether a coin toss landed Heads (H) or Tails (T), with prior P(H)=1/2. The agent must then place a bet: she can choose to bet on H, bet on T, or not bet. If she bets correctly, she wins £1; if incorrectly, she loses £1; if she doesn't bet, she gets 0. The agent is loss-averse: she gets utility 1 for winning, -2 for losing, and 0 for not betting. If she learns the outcome, she will be unable to resist betting ( because if she knows the outcome, the expected utility of betting on it is 1, which is greater than 0). Without the signal, she can choose not to bet. Compute the expected utility with and without the signal ( ex ante). Would the agent prefer not to see the signal? How is this consistent with Good’s theorem?

  In light of these cases, briefly explain (a) why the guarantee of Good’s theorem is only ex ante, and (b) under what condition the value of a signal is exactly zero.

