  ### Decision Tree: Is the Expanding Moral Circle Really Moral Progress?  
  *Use historical cases (concern for animals, decline in violence, solicitude for future people, re-hardening toward immigrants) to diagnose the nature of "progress." Answer each question based on your interpretation of the cases, not prior knowledge of the views.*  

  ---

  #### **Question 1**  
  *When moral concern expands to new entities (e.g., animals, future people), does this expansion typically reduce concern for existing recipients (e.g., the nearby poor)?*  
  - **Yes** → **Budget View** (leaf): Expansion is redistribution of fixed concern—no net growth (e.g., rising animal concern funded by falling concern for the poor).  
  - **No** → Proceed to Question 2.  

  #### **Question 2**  
  *For the decline in interpersonal violence and rising animal concern, was the primary driver a change in moral beliefs?*  
  - **Yes** → Proceed to Question 4.  
  - **No** → Proceed to Question 3.  

  #### **Question 3**  
  *Could behavioral changes (e.g., less violence, better animal treatment) have occurred without non-moral factors like state capacity, commerce, or literacy?*  
  - **Yes** → **Hypocrisy-Reduction View** (leaf): Improved compliance with unchanged beliefs (e.g., we always thought violence was wrong but now act on it).  
  - **No** → **Pacification-not-Moralisation View** (leaf): Non-moral factors drove behavior change; moral beliefs didn’t improve.  

  #### **Question 4**  
  *In the recent surge of concern for distant future people/non-sentients (e.g., rivers, AI), is this concern grounded in attributing intrinsic moral standing to them?*  
  - **No** → **Widening-Without-Status View** (leaf): Expansion of care to objects without moral standing—not an expansion of moral patients.  
  - **Yes** → Proceed to Question 5.  

  #### **Question 5**  
  *Would the moral changes (e.g., condemning slavery, caring for animals) likely occur in any society with sufficient information/reflection, regardless of its history?*  
  - **Yes** → Proceed to Question 6.  
  - **No** → **Nothing-Mind-Independent-Happened View** (leaf): Changes reflect contingent cultural shifts, not tracking truth.  

  #### **Question 6**  
  *Is the re-hardening of attitudes toward immigrants (last 20 years) best explained by regression in moral beliefs (vs. non-moral factors like economic anxiety)?*  
  - **Yes** → **Realist Tracking View** (leaf): Expansion reflects progress toward moral truth; re-hardening is backsliding.  
  - **No** → **Nothing-Mind-Independent-Happened View** (leaf): Re-hardening is non-moral; changes lack truth-tracking direction.  

  ---

  ### Tree Structure & Diagnostics  
  - **Leaves**: Budget, Hypocrisy-Reduction, Pacification-not-Moralisation, Widening-Without-Status, Realist Tracking, Nothing-Mind-Independent-Happened (6 leaves).  
  - **Empty Cells**:  
    - *Budget + Widening-Without-Status*: Coherent but undefended (e.g., fixed concern redistributed to objects without standing).  
    - *Realist + Widening-Without-Status*: Incoherent (realism requires intrinsic standing; widening-without-status denies it).  
    - *Pacification + Budget*: Unattractive (pacification explains behavior via non-moral factors; budget focuses on concern-tradeoffs).  
  - **Indistinguishable Pair**:  
    - **Realist Tracking** and **Nothing-Mind-Independent-Happened** agree on all historical cases. They **only diverge on Question 5’s counterfactual**: *"Would moral changes occur in any society with sufficient information?"* Realists say yes (convergence to truth); non-realists say no (contingent on culture/history).  
  - **Key Case Usage**:  
    - Rising animal concern → Tests tradeoffs (Q1), belief-change (Q2), and standing (Q4).  
    - Decline in violence → Tests belief-change (Q2) and non-moral drivers (Q3).  
    - Future people solicitude → Tests standing (Q4) and counterfactuals (Q5).  
    - Immigrant re-hardening → Tests regression (Q6) to separate realist/non-realist.  

  ---

  **One-Page Rationale**  
  This tree isolates core mechanisms (belief-change, behavioral drivers, tradeoffs, standing attribution) using your cases. It forces students to confront *how* changes occurred before labeling them "progress." Question 5’s counterfactual is critical for realism—without it, realism and non-realism are observationally identical. Empty cells highlight gaps in the literature (e.g., no realist defends widening-without-status). Re-hardening (Q6) distinguishes realist backsliding from non-realist noise.
