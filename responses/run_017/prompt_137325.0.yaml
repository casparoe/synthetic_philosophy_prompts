answer: |-
  ### Brainstorming Pass: Candidate Diagnoses  
  1. **Frege's unsaturatedness**: Dissolves composition by making predicates inherently relational, avoiding a *separate* unifier.  
  2. **Russell's non-term relations**: Relations *actively relate*, halting the regress by rejecting their reification as terms.  
  3. **Wittgenstein's fact primacy**: Propositions *are* facts; demanding assembly misplaces the burden.  
  4. **Structured propositions**: Formal/combinatorial rules (e.g., λ-calculus) impose unity extrinsically.  
  5. **Bradleyan monism**: Unity is primitive; analysis into parts is illusory (regress is vicious).  
  6. **Predicate-centered unity**: Verbs/non-substantives intrinsically "demand" arguments (Hossack).  
  7. **Cognitive act theories**: Unity arises from intentional acts of judgment (Brentano, late Husserl).  
  8. **Pragmatic/inferential role**: Unity derives from use in reasoning (Brandom-style).  
  9. **Notational artifact**: The problem assumes a "building-block" model of meaning that’s misguided.  
  10. **Job-conflation**: Your hypothesis — three distinct roles masked under "unity."  

  ---

  ### Considered Diagnosis: The Tripartite Stalemate  

  Your hypothesis is perceptive: **the deadlock arises precisely because "unity" is tasked with solving three distinct problems, conflated under one banner**. Each major theory resolves one problem but stumbles on the others, and their disagreements stem from irreconcilable starting assumptions about what requires explanation.  

  #### 1. **The Three Jobs of Unity**  
  - **Job 1 (Composition)**: Distinguishing structured entities from heaps/sets (e.g., *Brutus kills Caesar* vs. {Brutus, kills, Caesar}).  
  - **Job 2 (Asymmetry)**: Grounding truth-conditional directionality (e.g., *Brutus stabbed Caesar* ≠ *Caesar stabbed Brutus*).  
  - **Job 3 (Ontological Simplicity)**: Explaining why a state of affairs is *one thing* (not a plurality).  

  #### 2. **How Theories Map to the Jobs**  
  - **Frege**: Solves *Job 1* via unsaturated concepts (no "glue" needed). Fails *Job 3*: Why is the saturated whole singular?  
  - **Russell**: Solves *Job 2* via relations as "relating ties" (directionality primitive). Invites *Job 3* regress: What ties the relation to its terms?  
  - **Wittgenstein**: Solves *Job 3* by taking facts as bedrock. Ignores *Jobs 1–2*: How do *words* compose into facts?  
  - **Structured Propositions (SP)**: Solves *Job 1* with syntax-like rules. Struggles with *Job 2* (e.g., symmetric relations break asymmetry) and *Job 3* (what "binds" structure to reality?).  
  - **Bradley**: Rejects all three jobs as ill-posed (unity is prior).  

  #### 3. **The Core Deadlock: Primitive Clashes**  
  The regress persists because each theory’s "solution" relies on a primitive the others reject:  
  - Frege: **Unsaturatedness** (linguistic/metaphysical).  
  - Russell: **Relating relations** (metaphysical).  
  - Wittgenstein: **Facthood** (ontological).  
  - SP: **Formal instantiation** (logical).  
  - Bradley: **Primordial unity** (metaphysical).  

  **No theory resolves all three jobs without privileging its primitive**. The dispute reduces to: *Which primitive is least objectionable?*  

  #### 4. **Your Multiset Test: A Decisive Experiment**  
  In a language with unordered, role-unmarked sentences (e.g., {Brutus, stabs, Caesar} ≡ {Caesar, Brutus, stabs}),:  
  - **Job 1 (Composition) remains**: Why is this a proposition, not a set?  
  - **Job 2 (Asymmetry) dissolves**: Without order/roles, no truth-conditional directionality exists.  
  - **Job 3 (Ontology) intensifies**: What makes this multiset "unified"?  

  → **Verdict**: The *composition problem (Job 1)* is fundamental. *Asymmetry (Job 2)* is a symptom of structured syntax. *Ontological unity (Job 3)* may be illusory (per Wittgenstein) or irreducible (per Bradley).  

  #### 5. **Is Progress Possible?**  
  - **Formal Result?**: SP shows composition *can* be modeled (e.g., type theory), but doesn’t explain *why* it holds metaphysically.  
  - **Distinction?**: Separating the three jobs *is* progress. Your multiset test proves Job 2 is syntactic, not metaphysical.  
  - **Change of Question?**: Shift to "How do agents *parse* unity?" (cognitive/pragmatic). This evades metaphysics but answers the novelist’s need: *We* unify propositions via grammar and practice.  

  #### 6. **The Honest Ending: Impasse as Insight**  
  The debate is **not verbal** but **foundational**: It exposes how metaphysics, language, and logic intersect at bedrock. Your philosopher might conclude:  
  > *"We keep asking how parts become wholes, but maybe unity isn’t made—it’s where we start. Like gravity, it explains but isn’t explained. The regress is a mirror: it shows us our own need to unify, not a puzzle to solve."*  

  **Why no progress?** Metaphysics hits primitive commitments. The "solution" is to see the stalemate *as* the insight: Unity is a precondition, not a product. Your scene’s power lies in the philosopher’s resignation to mystery—and the daughter’s realization that some questions *bind* us, unanswered.  

  ---  
  **For Your Novel**: Lean into the impasse. The philosopher’s arc could be accepting that her life’s work reveals limits, not solutions. The daughter might grasp that language’s magic—its ability to *be* more than words—is where philosophy ends and art begins.
