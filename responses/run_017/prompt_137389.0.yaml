prompt: |-
  Our moral epistemology reading group has been chewing on the moral testimony debate for about two years and literally nobody has moved, which makes me suspect we're not disagreeing about what we think we're disagreeing about. Curious what you'd make of it.

  Here's the shape of it. One camp says there's something off about pure moral deference: if I believe some practice is wrong only because someone I trust told me so, with no grip on why, then at best I've picked up a true belief. I don't understand it, and a moral view you don't understand isn't really yours — it won't guide you when the trusted person isn't around, it won't survive the next person telling you the opposite, and it's arguably not the kind of thing you shoud be forming on someone else's authority anyway. The other camp says this is wildly overblown. We defer morally all the time and it plainly works: kids pick up that hitting people is wrong from adults, I can learn that some workplace custom is exploitative from a friend who understands the context better than I do, and if moral knowledge really required first-hand grasp of the reasons then almost nobody would know almost anything moral, which is absurd. They also point out that there don't really seem to be moral experts, so half the "expertise" framing is a red herring.

  Every move has a countermove and we all know the countermoves by hart at this point. So please diagnose rather than adjudicate — I've read the main papers, no need to walk me through them.

  My half-baked hypothesis is that the label covers at least three questions that keep sliding into each other: an epistemic one (can testimony transmit justification or knowledge here at all?), an agential one (is it permissible, or decent, to let someone else's judgment settle what you think and do?), and a constitutive one about what a moral judgment even is — a belief about a mind-independent fact, versus something more like a stance or commitment, which maybe you just can't inherit from another person's say-so. If that's right, the pessimists' arguments might be good against one and irrelevant to the others.

  But I also can't shake a second, weirder suspicion: that the "data" here is really one very specific kind of case — a testifier who hands over a verdict and no reasons, and a recipient with no independent view who isn't going to get one — and that we're treating intuitions about that case as evidence about all testimony. I tried a variant where the testifier walks you through the reasoning conversationally instead of just asserting the verdict, and our pessimists softened a lot, which makes me wonder how much of the standoff is about the format of the exchange rather than about morality. Maybe what's bothering people is closer to: you can't outsource the activity of thinking, and some ways of telling are ways of getting you to do it yourself.

  So: substantive, verbal, or several questions under one name? Are the sides weighting different cases? Is a hidden empirical or metanormative commitment doing the work — about whether moral expertise exists, or about what moral judgments are? And given whatever you diagnose, what would actually count as progress: a distinction, some empirical work on how the intuition varies, or giving up the question?
reasoning: |-
  Okay, let me unpack this user's query. They're in a reading group stuck on the moral testimony debate for two years. Both camps are entrenched: one against pure moral deference, the other defending its practicality. The user suspects the disagreement might be about different underlying issues or misaligned intuitions about specific cases.

  First, I need to address their half-baked hypothesis. They think there are three intertwined questions: epistemic, agential, and constitutive. That makes sense. The epistemic part is whether testimony can transmit knowledge. The agential one is about the permissibility of relying on others' judgments. The constitutive question is what a moral judgment even is. If the pessimists are mixing these, their arguments might hit one but miss others. For example, if someone argues that moral judgments require personal commitment, they might conflate the constitutive with the agential, leading to talking past each other.

  Then there's their second suspicion about the "data" being a specific case: a testifier giving a verdict without reasons to a passive recipient. The user noticed that when the testifier explains the reasoning, pessimists soften. That suggests the format matters. Maybe the aversion is to outsourcing the thinking process, not testimony per se. This ties into the agential concern—valuing moral autonomy.

  I should also consider hidden commitments. The anti-deference camp might assume moral judgments require firsthand understanding, while the pro side sees them as factual beliefs. Disagreement about moral expertise could be another divider. If one side thinks experts exist and the other doesn't, that affects how they view testimony.

  For progress, the user needs clarity on the core disagreements. Distinguishing the three questions could help. Also, empirical studies on how people perceive moral testimony might reveal if intuitions vary by context. Maybe they should explore cases with gradual scaffolding or collaborative reasoning. Shifting focus from "can you defer" to "how should you engage" might break the deadlock. Testing intuitions with varied scenarios could uncover if it's the lack of reasoning that bothers people, not the act of deferring itself.
answer: |-
  Your instincts are sharp—the standoff likely stems from three overlapping issues masquerading as one, compounded by unexamined intuitions about a narrow paradigm case. Here’s a diagnosis and path forward:

  ### 1. **The Three Questions Masquerading as One**  
  Your "half-baked hypothesis" is well-baked. The debate conflates:  
  - **Epistemic Question**: *Can moral testimony transmit knowledge/justification?*  
    (Pro: "Yes, like factual testimony." / Anti: "No—lacks non-testimonial grounds.")  
  - **Agency Question**: *Is moral deference *permissible* or *admirable*?*  
    (Pro: "Sometimes necessary." / Anti: "Abdicates moral responsibility.")  
  - **Constitutive Question**: *What *is* a moral judgment?*  
    (Pro: "Belief about objective fact." / Anti: "Commitment requiring ownership.")  

  **Why this stalls debate**:  
  - Pessimists often argue from **agency/constitutive** concerns ("It’s not *yours*") but frame it as epistemic ("You don’t *know*").  
  - Optimists counter with **epistemic** cases ("Kids learn 'hitting is wrong'") but sidestep agency ("Is this ideal?").  
  - **Hidden fault line**: Whether moral judgments are *stateable facts* (like "water is H₂O") or *practical commitments* (like vows). If the latter, testimony can’t transfer the commitment—only the description.

  ### 2. **The Tyranny of the Paradigm Case**  
  You’re right: intuitions are dominated by **"Pure Verdict Deference"**:  
  - *Testifier*: Drops "Φ is wrong" with zero context.  
  - *Recipient*: Adopts the belief inertly, with no engagement.  
  - *Why this distorts*:  
    - This case is vanishingly rare IRL but treated as the default.  
    - Your conversational variant ("walking through reasons") exposes that the core unease is about **moral passivity**, not testimony per se.  
    - Pessimists soften here because agency is restored: the recipient *engages* with reasons, even if sourced externally.  

  ### 3. **Hidden Commitments Fueling the Deadlock**  
  - **Moral Expertise**:  
    - Pessimists *deny* moral experts exist (or that we can identify them).  
    - Optimists *assume* expertise is possible (e.g., your friend re: workplace exploitation).  
    - **Root**: Disagreement about whether moral knowledge requires *specialized access* (e.g., empathy, experience) vs. *general rationality*.  
  - **Metanormative Stance**:  
    - Realists (moral facts exist) lean pro-testimony.  
    - Expressivists/Constructivists see moral judgments as *expressions* or *commitments*—inherently "first-personal."  

  ### Diagnosing the Impasse  
  - **Pessimists** are haunted by the specter of **alienated belief**: A "moral view" that doesn’t engage your will, emotions, or reasoning isn’t truly *moral*. Their real target is *moral outsourcing*—treating ethics like a Wikipedia fact.  
  - **Optimists** defend the *social necessity* of moral learning but downplay that deference is often a **scaffolding tactic** (e.g., kids eventually internalize reasons). They mistake pessimism for elitism.  

  ### Pathways to Progress  
  1. **Disentangle the Three Questions Explicitly**:  
     - Map each camp’s arguments to epistemic/agential/constitutive domains. Ask: "Is your objection about knowledge, responsibility, or what a 'judgment' is?"  
     - *Example*: If a pessimist says "It won’t guide you," that’s agential—don’t let optimists counter with "But they know the fact!"  

  2. **Test the Intuition Pump**: Vary the Cases  
     - Run thought experiments that tweak:  
       - *Recipient engagement* (passive vs. collaborative reasoning).  
       - *Testifier’s method* (verdict-only vs. reason-giving).  
       - *Context* (urgent vs. reflective; novel vs. familiar dilemma).  
     - **Key hypothesis**: Pessimist intuitions weaken as the case moves from *pure deference* → *guided reasoning* → *deference after failed reflection*.  

  3. **Shift from "Can You?" to "How Should You?"**  
     - Focus on **virtues of moral engagement**: When is deference *lazy* vs. *humble*? When does it aid vs. bypass moral development?  
     - *Progress question*: "What responsibilities do we have when giving/receiving moral testimony?" (e.g., must testifiers offer reasons? Must recipients probe them?)  

  4. **Empirical Angle**: Probe Real-World Intuitions  
     - Survey non-philosophers on cases (e.g., "Is it okay to believe abortion is wrong solely because your pastor says so?" vs. "...after they explain their view?").  
     - Predict: "Pure verdict" cases will trigger unease; cases with *reason-sharing* or *epistemic humility* ("I’m lost—I trust Jane") will feel more acceptable.  

  ### What "Giving Up" Might Look Like  
  - If the standoff persists, declare the question ill-posed. Adopt a **functionalist view**: Moral testimony’s value depends on *what it does* in a context (e.g., social coordination vs. personal integrity).  
  - Or: Conclude that "moral testimony" isn’t a unitary phenomenon—it ranges from *indoctrination* to *collaborative inquiry*, with different norms for each.  

  **Bottom line**: Your group is likely split because pessimists care about **moral agency**, optimists about **social epistemology**, and both are using "knowledge" as a proxy. Frame the debate as: *When, if ever, is it good for moral cognition to rely on others’ judgments?* That might break the spell.
