  The core tension revolves around whether mathematical convenience can override ethical principles. Key sticking points include the non-constructible nature of ultrafilters violating ethical accessibility, and the failure of full anonymity making the system sensitive to arbitrary labelings. The incomparability alternative feels more honest when sums diverge.

  Probability assignments require weighing how severely these flaws undermine the proposal. The anonymity breach is particularly damning - ethics shouldn't care about numeric labels. Still, the ultrafilter approach has technical merits, so it's not worthless. 

  The calculation combines two critical doubts: whether permutation-invariance is essential (60% likely) and whether non-constructible dependencies are acceptable (25% likely). Treating them as independent yields 15% (0.15), rounded conservatively to 0.2. 

  The friend probably underestimates the permutation-invariance problem. If compelling arguments emerged that ethics only requires finite reshuffling, that would significantly raise the probability.
