prompt: |-
  i'm TAing a final-year philosophy of science seminar, 14 students, one 80-minute slot, and I've got the session on scientific realism and theory change. I want them to feel the pull of structural realism before I name it — the thought that when a theory gets overthrown we keep the equations and lose the furniture: the ethers and the calorics go, but the pattern of relations they were standing in survives into the successor theory, so maybe that pattern was all we ever should have believed in. But I also want them to feel the thing that makes me suspicious of it. If all a theory ultimately says is "there are some things, call them #1, #2, #3, standing in such-and-such relations, and everything we observe follows from that" — the theoretical names crossed out and replaced with blanks — then it looks like you can make it true with basically any old junk, as long as there's enough of it and you can arrange it to match the pattern: the pens in the room, four people's left shoes, some prime numbers. Last year I tried a version of this with a toy theory about three invisible magnets and it fell flat, mostly because I explained the point first and then asked them to do the exercise, which killed it.

  So: can you design the whole session for me — groups, materials (index cards and random junk, nothing that needs a projector), a timeline for the 80 minutes, and what exactly the facilitator says and doesn't say? My rough idea is that each group gets the "crossed-out" theory plus a pile of objects and has to build models that make it true, and then something turns on their noticing that they can do it again and again with completely different stuff, and that this is either the whole point or a disaster, without me having told them which. Two things I care about. First, the epistemological and the ontic versions shouldn't collapse into each other: "structure is all we can know" and "structure is all there is" have to come apart in the activity, and by the end students should be able to say which one the junk-model problem actually bites and which one it sort of doesn't. Second, I want a debrief that maps specific moments in the room onto specific claims, tells me what will predictably go wrong the first time I run it (I'm guessing someone builds a model with the wrong number of objects, and someone else says "well obviously the theory also says the things are physical / causal / in spacetime" and short-circuits the whole thing before anyone feels it), and is honest about what the game can't deliver — I suspect it can't show the continuity-across-theory-change argument that made structural realism attractive in the first place, since my little toy theory has no history, and it probably can't reproduce whatever makes the triviality worry bite for infinite domains rather than for four pens. Oh, and please don't put the words "structural realism" or "Ramsey" or "Newman" on any handout that goes out before the debrief, and no looking things up — just build it from what the setup already gives you.
reasoning: |-
  We are going to design an 80-minute session that leads students to discover the core idea of structural realism and then confronts them with the "junk" problem. The session will be divided into clear segments and will use hands-on activities with index cards and random objects.

  **Materials Needed:**
  - Index cards (with the "crossed-out" theory written on them, as described below)
  - A variety of random objects for each group (e.g., pens, paper clips, rubber bands, buttons, coins, small toys, left shoes, etc.)
  - A whiteboard or flip chart for the facilitator to note observations during the activity and for the debrief.

  **Group Setup:**
  - Divide the 14 students into 4 groups (3 groups of 4 and one group of 2, or adjust as needed). Each group gets a set of materials.

  **The "Crossed-Out" Theory:**
  We will create a very simple theory about three entities and their relations. The theory will be presented as a set of statements with the theoretical terms crossed out and replaced with blanks. The theory should be about a domain of three objects and have a relational structure that can be modeled in multiple ways.

  Example theory (inspired by magnets but without using the word "magnet"):

  *Theory T:*
  1. There are three things: ___, ___, ___.
  2. Each thing has a property we'll call "charge" that can be either + or -.
  3. The following relations hold:
     - ___ and ___ attract each other (meaning they move closer if possible).
     - ___ and ___ repel each other (meaning they move apart if possible).
     - ___ and ___ attract each other.

  We can represent the relations in a symmetric way. Let's assign the three entities as A, B, C and then cross out the names. So the relations become:

  - Blank1 and Blank2 attract.
  - Blank1 and Blank3 repel.
  - Blank2 and Blank3 attract.

  But note: we don't want to use letters because that might suggest labels for the objects. Instead, we can write:

  *On the index card:*
  ```
  There are three things: ___, ___, ___.

  Each thing has a charge which is either positive (+) or negative (-).

  The attraction/repulsion relations are:
  - ___ and ___ attract each other.
  - ___ and ___ repel each other.
  - ___ and ___ attract each other.
  ```

  But wait, we need to specify which pairs. We can do:

  ```
  The pairs are:
  Pair 1: Thing ___ and Thing ___ attract.
  Pair 2: Thing ___ and Thing ___ repel.
  Pair 3: Thing ___ and Thing ___ attract.
  ```

  But without the labels, how do we specify which pairs? We need to fix the pattern without fixing the referents. We can instead describe the structure by the pattern of relations without labeling the objects. However, for simplicity, we can assign the blanks in a fixed order but note that the blanks are just placeholders.

  Alternatively, we can present the pattern without labels by describing the entire set of relations:

  *Index Card Text:*
  ```
  Theory T:

  There are three things. Each thing has a charge (either + or -). The relations between them are:

  - Two of the things attract each other.
  - Two of the things attract each other (this is the same as the first? Wait, no, we have three pairs).

  Actually, we have three pairs. Let's list the relations for each pair:

  Pair between thing1 and thing2: attract.
  Pair between thing1 and thing3: repel.
  Pair between thing2 and thing3: attract.

  But we don't have thing1, thing2, thing3. We have blanks. So we write:

  - The pair (___, ___) attracts.
  - The pair (___, ___) repels.
  - The pair (___, ___) attracts.

  But then the blanks are not assigned to specific things. This might be confusing.

  Another way: We can say the structure requires that for the three things, there is exactly one pair that repels and two pairs that attract. And note that the charges must be such that: like charges repel, unlike charges attract. But we don't want to give away the charge rule because that might lead them to think in terms of magnets.

  We want to avoid the magnet analogy because last year it fell flat. So let's make it about abstract relations without specifying a mechanism.

  Revised Theory T:

  ```
  Theory T:

  There are three objects: O1, O2, O3.

  Each object has a binary property (which we can call "type") that can be A or B.

  The relations between objects are determined by their types:

  - If two objects have the same type, they REPEL.
  - If two objects have different types, they ATTRACT.

  Additionally, we observe the following relations:

  - O1 and O2: REPEL
  - O1 and O3: ATTRACT
  - O2 and O3: ATTRACT
  ```

  But then we cross out the names O1, O2, O3 and the property names A and B. We want the structure to be preserved without the specific labels.

  How about:

  *Index Card (with crossed-out terms, represented here as blanks):*
  ```
  Theory T:

  There are three things: ___, ___, ___.

  Each thing has a property: it is either a ____ or a ____ (two types, but we don't name them).

  The relations:

  - If two things have the same type, they ______ (repel? attract? we need to fix the rule).
  - If two things have different types, they ______.

  But we don't want to use the rule. Instead, we want to give the observed relations without the rule? Actually, we want to give the pattern of relations without the underlying rule.

  Alternatively, we can give the pattern of relations without any rule about properties. We just state the pattern.

  Let me try:

  ```
  Theory T:

  There are three things: ___, ___, ___.

  The relations among them are:

  - The pair (___, ___) repels.
  - The pair (___, ___) attracts.
  - The pair (___, ___) attracts.

  Note: Repel and attract are symmetric relations.

  We also know that exactly one pair repels and two pairs attract.
  ```

  But without the charges, it's just the pattern of relations. This is the structure we want.

  So we'll do:

  **Index Card for each group:**
  ```
  Theory T:

  There are three things: ___, ___, ___.

  The relations:

  - Two of the things attract each other.
  - Two of the things attract each other (but note: these are two different pairs? Wait, we have three pairs).

  Actually, we have three pairs. We need to say:

  Among the three possible pairs:

  - One pair repels.
  - The other two pairs attract.

  So the structure is: one repulsive pair and two attractive pairs.
  ```

  This is the structural description. We don't specify which pair is which, so the theory is about the pattern.

  **Activity Steps:**

  1. **Introduction (5 minutes):**
     - Facilitator: "Today we're going to explore what scientific theories tell us about the world. I'm going to give each group a description of a very simple theory and a set of objects. Your task is to build a model that makes the theory true. That is, you will assign the objects to the roles in the theory so that the relations described hold. We are going to do this without using any prior knowledge of science — just by arranging the objects according to the description."

  2. **Group Work Phase 1: Building a Model (15 minutes):**
     - Each group gets an index card with Theory T (as above) and a pile of at least 6-8 random objects (so they have choices). They must choose three objects and assign them to the three things in the theory and then demonstrate the relations. Since the relations are abstract (attract/repel), they will have to interpret what that means with the objects. They can use any interpretation as long as they can show that for one pair they have a repelling relation and for the other two pairs an attracting relation.

     - Facilitator circulates and observes. If a group is stuck, ask: "How can you show that two objects attract? What does that look like with these objects?" (They might use proximity, or use a string to connect, or just state it arbitrarily.) The goal is not to have a physical mechanism but to assign the relations arbitrarily? But we want them to see that they can assign arbitrarily? Actually, we want them to see that the pattern can be realized in multiple ways.

     - Note: We are not giving them the charge rule. They are free to assign the relations arbitrarily? But we want them to see that the structure is what matters. So they can assign the relations arbitrarily? Yes, but then they might not see the continuity in real science. However, for the first part, we want them to build a model that satisfies the structure.

     - Actually, we don't want them to assign arbitrarily because then the structure is too easily realized. We want them to feel that the structure constrains the model. But then we want them to see that the same structure can be realized by different objects. So we let them choose any three objects and then assign the relations arbitrarily? That might be too easy and they might not see the point.

     - Alternatively, we can require that they use the same interpretation of attract/repel for all pairs. For example, if they say two objects attract if they are connected by a rubber band, then they must use that for all pairs. Then they have to assign the relations so that one pair is not connected (repel) and the other two are connected (attract). This is a constraint.

     - Let's go with that: They must define what it means for two objects to attract or repel in their model and then set up the three objects accordingly. The definition must be consistent for all pairs.

     - Example: 
       - Attract: connected by a rubber band.
       - Repel: not connected by a rubber band.
       Then they must have one pair without a rubber band and two with.

     - Another example: 
       - Attract: placed within 5 cm of each other.
       - Repel: placed at least 20 cm apart.

     - They are free to define the relations as long as it's consistent.

  3. **Group Presentations (10 minutes):**
     - Each group shows their model. They name the three objects and show the relations. The facilitator writes on the board the assignments and the relations for each group.

     - Example: Group 1: Object A, B, C. 
          A-B: attract (connected by rubber band)
          A-C: repel (no rubber band)
          B-C: attract (connected by rubber band)

     - The facilitator notes that all groups have the same pattern: one repulsive pair and two attractive pairs.

  4. **Phase 2: Build Another Model (10 minutes):**
     - Facilitator: "Now, using the same set of objects, build a different model that also satisfies the theory. That is, choose three different objects (or the same objects but assign them differently to the roles) and set up the relations again. But note: you must use the same definitions for attract and repel that you used in the first model."

     - Groups try to build a second model. They might use different objects or the same objects but assign different relations? But they must assign the relations to the pairs so that again one pair repels and two attract.

     - This should be easy because they can pick any three objects and arbitrarily assign the relations as long as they have one repel and two attract. But note: they are constrained by their own definitions. For example, if they defined attract by a rubber band, then they must connect two pairs and leave one unconnected.

     - They might run into issues if they don't have enough objects? But we provided at least 6-8 objects per group, so they can pick three new ones.

  5. **Phase 3: Build a Model with Completely Different Stuff (10 minutes):**
     - Facilitator: "Now, I want you to think outside the box. Can you build a model that satisfies the theory using things that are not in your pile? Look around the room. Use anything you see, or even abstract concepts. But you must be able to demonstrate the relations with the same definitions you used before?"

     - But note: the definitions they used (like rubber bands) might not apply to abstract concepts. So we relax: "You can redefine what attract and repel mean, but you must use the same redefinition for all pairs in this new model and it must be consistent."

     - Alternatively, to avoid confusion, we can say: "For this round, you can come up with a new way to represent attract and repel, but it must be clear and consistent."

     - Groups build a model using, e.g., students in the room, or numbers, or words. Example: 
          - Use three students: 
            - Attract: they shake hands.
            - Repel: they turn back to back.
          - Or use numbers: 1, 2, 3.
            - Attract: the pair sums to an even number? (But then 1+2=3 odd -> repel? 1+3=4 even -> attract? 2+3=5 odd -> repel? -> that gives two repels and one attract -> not the pattern. So they have to define arbitrarily.)

     - They might also use abstract concepts: 
          - Three emotions: anger, fear, joy.
          - Attract: they are both negative? But then anger and fear attract? Then anger and joy: different -> attract? fear and joy: different -> attract? Then we have three attracts -> not the pattern. So they have to define arbitrarily.

     - The point is that they can define the relations arbitrarily to fit the pattern.

  6. **Discussion (30 minutes):**
     - Facilitator leads a debrief.

     - Step 1: Ask what they did. 
          - "In the first part, you built a model with the objects. Then you built another model, and then one with completely different things. What did you notice?"

     - Step 2: Guide them to see that the same pattern (one repulsive pair, two attractive pairs) was realized in multiple ways. The pattern is what was preserved across the models.

     - Step 3: Then ask: "What does this tell us about the theory? The theory only specified the pattern of relations, not what the objects were. So what does the theory really tell us about the world?"

     - Step 4: Introduce the worry: "But if the theory only tells us that there is a pattern of one repulsive and two attractive pairs, then can we make the theory true by just choosing any three things and arbitrarily assigning the relations? For example, I take three pens and say: pen1 and pen2 attract, pen1 and pen3 repel, pen2 and pen3 attract. Then the theory is true. But that seems too easy. The theory was supposed to be about something in the world. What's going on?"

     - Step 5: Draw out the distinction:
          - Option 1: The pattern is all we can know about the world (epistemic structural realism). We don't know what the objects are, but we know the structure.
          - Option 2: The pattern is all there is (ontic structural realism). There are no objects beyond the structure.

     - Step 6: Relate to the activity:
          - In the activity, when we built models with different objects and even abstract concepts, we were showing that the structure can be realized by many different kinds of objects. This challenges the ontic view because if the structure is all there is, then what are we to make of the fact that the same structure can be realized by pens, shoes, and emotions? Does that mean the world is just structure and the objects are just placeholders? Or does it mean that the structure is what we can know, but there might be a specific set of objects that actually exist and have the structure?

     - Step 7: The triviality worry: 
          - If the theory only says "there exists three things with one repulsive pair and two attractive pairs", then as long as there are at least three things in the world, we can always assign the relations arbitrarily to make it true. So the theory is trivially true if there are enough things. This is a problem for the epistemic view: if the structure is all we can know, but the structure is so easily satisfied, then it doesn't tell us much.

     - Step 8: Contrast with science: 
          - In real science, we don't assign arbitrarily. We have constraints: the relations must be based on properties of the objects (like charge) and the relations must be causal and lawlike. Also, in science, we have a history: when a theory is replaced, the structure is preserved. But note: in our activity, we didn't have a successor theory. We just had one theory and multiple models.

     - Step 9: What the activity can't show:
          - The activity doesn't show continuity across theory change because we only have one theory. We would need a second theory that replaces the first and then see if the structure is preserved.

     - Step 10: Addressing the two versions:
          - The junk problem (triviality) bites the epistemic view: if we only know the structure and the structure is easily satisfied by arbitrary assignments, then we haven't learned much. But the ontic view might avoid this by saying that the structure is all there is, so there is no "junk" beyond the structure. However, if the same structure can be instantiated by different things, then the ontic view must say that these are just different representations of the same structure? Or is the structure unique?

     - Step 11: Point out what might have gone wrong:
          - Some groups might have built a model with the wrong number of objects (e.g., four objects). The facilitator should have caught that during the activity.
          - Some might have said: "But the things have to be physical" or "the relations have to be causal". If that happens, the facilitator can note that in the activity we allowed abstract models. Then ask: "Does the theory specify that the things must be physical? The theory we had didn't say that. It just said 'things'. So why can't we use abstract things?"

  7. **Conclusion (5 minutes):**
     - Summarize: We've seen that a theory that only specifies a structure can be made true by many different kinds of things. This leads to two positions: one that says structure is all we can know, and the other that says structure is all there is. But the first faces a problem of triviality: if the structure is too easily satisfied, then it doesn't give us much knowledge. The second avoids that but must explain what it means for the world to be only structure.

     - Finally, reveal: "This idea is called structural realism. The worry about triviality is known as the Newman problem. But we've built it from the ground up."

  **Timeline:**
  - 0-5 min: Introduction
  - 5-20 min: Phase 1 (build first model)
  - 20-30 min: Group presentations
  - 30-40 min: Phase 2 (build second model with same objects)
  - 40-50 min: Phase 3 (build model with different stuff)
  - 50-80 min: Discussion (including debrief and mapping to concepts)

  **Predictable Problems:**
  1. **Wrong number of objects:** A group might use four objects. The facilitator should catch this and ask: "The theory says three things. How does your model have three things?"
  2. **Arbitrary assignment without constraint:** They might assign the relations without a consistent definition. Facilitator: "How do you define attract and repel? It must be the same for every pair."
  3. **Short-circuit by adding constraints:** "Obviously, the things have to be physical and the relations causal." Response: "The theory we have doesn't say that. It just says 'things'. Could we interpret it more broadly? What if the theory is about unobservable things? We don't know their nature, only the relations."
  4. **Infinite domains:** The activity uses finite and small domains. The triviality worry is worse for infinite structures because for finite structures, the theory might be falsifiable (if the world doesn't have enough things) but for infinite domains, the theory is always true if consistent. We can mention this in the debrief: "In real science, theories often involve infinite domains, and then the triviality problem becomes more severe."

  **Handouts:**
  - Only the index card with the crossed-out theory. No advanced terminology.

  This design should lead the students to feel the pull of structural realism (the pattern is preserved across different models) and then the worry (the pattern is too easily satisfied). The debrief should clarify the distinction between the epistemic and ontic versions and the limitations of the activity.
answer: |-
  Below is a complete 80-minute session plan designed to meet your goals. The activity uses index cards and random objects to create an "aha" moment for structural realism, followed by a targeted debrief that distinguishes epistemic/ontic versions and addresses pitfalls. The flow avoids naming structural realism until the debrief and leans into the "junk problem" as an organic discovery.

  ---

  ### **Materials per Group (4 groups total)**
  - **Index cards** (3 per group):
    - Card 1: *"Theory T: There are 4 objects. Object A affects Object B. Object B affects Object C. Object C affects Object D. Objects A, B, C, D are distinct."*  
      *(Note: "Affects" is intentionally vague to allow interpretation.)*
    - Card 2: *"Structure-Only Version: There are 4 objects. Object __ affects Object __. Object __ affects Object __. Object __ affects Object __. All objects are distinct."*  
      *(Blanks imply variables, not specific objects.)*
    - Card 3: *"Rules: Build a model where: (1) You pick 4 things, (2) Assign them to A,B,C,D roles, (3) Show how 'affects' works in your model. Define 'affects' using objects or actions."*
  - **Random objects** (per group): 6–8 items (e.g., pens, paperclips, rubber bands, coins, a key, a leaf, a candy wrapper).
  - **Extra props**: String, sticky notes, markers (for groups to define relationships).

  ---

  ### **Session Timeline**  
  **Total: 80 minutes**  

  #### **Phase 1: Set-Up (10 min)**  
  - **Facilitator Script**:  
    *"Today, we're exploring how scientific theories describe the world. Each group has a simple theory (Theory T) and objects. Your task: Build a physical model that makes Theory T true. Use the objects to represent A, B, C, D and demonstrate how 'affects' works. You define what 'affects' means—be creative! You have 15 minutes. Go."*  
    - **Critical Silence**: DO NOT mention structure, realism, or theory change. Let them assume Theory T describes real entities.  

  #### **Phase 2: Model-Building (25 min)**  
  - **Groups work** (15 min): Build models of Theory T (Card 1).  
    - *Predictable Issue*: Groups will fixate on *specific objects* for A,B,C,D (e.g., "This pen is A, it *affects* the paperclip B by touching it").  
  - **Switch to Structure-Only** (10 min):  
    - Hand out Card 2 (Structure-Only Version).  
    - **Facilitator Script**:  
      *"Now, rebuild your model using this new version of Theory T—it's the same pattern, but no fixed labels. Use ANY objects (even ideas!) to fill the blanks. Show how 'affects' holds. You have 10 minutes."*  

  #### **Phase 3: Group Sharing (15 min)**  
  - Each group demonstrates **both models**:  
    - First model (Theory T with fixed roles).  
    - Second model (Structure-Only with variables).  
  - **Facilitator Notes on Board**:  
    - Column 1: Objects used in Model 1 (e.g., Pen A → Paperclip B → Coin C → Key D).  
    - Column 2: Objects used in Model 2 (e.g., "Left shoe → Student → Prime number 7 → Rubber band").  
    - Column 3: How "affects" was defined (e.g., "touching", "causes motion", "symbolically linked").  

  #### **Phase 4: Guided Debrief (30 min)**  
  **Goal**: Make the "pull" and "problem" of structural realism emerge from their models.  
  **Facilitator Script (with Directed Questions)**:  

  1. **The Pull of Structure (5 min)**:  
     *"Look at Column 2 on the board. You all used totally different stuff—shoes, people, abstract concepts—but preserved the same pattern: __ affects __ affects __ affects __, with 4 distinct things. What does this suggest about what survived when we stripped away labels like A/B/C/D?"*  
     - *Draw out*: The *relations* (→ affects → affects →) are what mattered. The "furniture" (pens/calorics) was disposable.  
     - *Map to theory change*: "In science, when theories change, we often keep mathematical relations but discard objects (like ether). This pattern-first view feels compelling—why?"  

  2. **The Junk Problem (10 min)**:  
     *"But look at Group 3’s model: they used 'anger → love → justice → democracy' and defined 'affects' as 'inspires'. Does this feel like a real scientific model? Why or why not?"*  
     - *Draw out*: Objections like: "It’s arbitrary!" or "You can make anything fit!"  
     - *Deepen*: "Exactly. If a theory *only* says 'there exist 4 things in this relation', we can force-fit pens, shoes, or emotions. This seems too easy. What’s missing?"  
     - *Predictable short-circuit*: If students say, "The theory implies physical causes!" respond: *"But Card 2 didn’t specify that. Why assume it? If structure is all we have, why can’t anger 'affect' love?"*  

  3. **Epistemic vs. Ontic Distinction (10 min)**:  
     - **Epistemic**: *"When you built Model 2, you knew the structure but chose junk. Does this mean structure is all we can *know*? Or is it a limitation of our cards?"*  
     - **Ontic**: *"If structure is all that *exists* (no 'junk' behind it), how does Group 4’s shoe-model 'exist' differently from their pen-model? Are both equally real?"*  
     - **Crucial contrast**:  
       - *Junk problem bites EPISTEMIC*: If structure is all we know, the model shows we can’t distinguish real causes from junk (trivial satisfaction).  
       - *Junk problem spares ONTIC*: If structure is all there is, the shoe-model *is* the reality—no "junk" behind it. But then why does the shoe-model feel unsatisfying?  

  4. **Limitations & Real-World Links (5 min)**:  
     - *Continuity gap*: "In this activity, we had no successor theory. In real science, structural realism argues equations persist (e.g., Maxwell’s in relativity). Our game can’t show that—it’s why the historical argument matters."  
     - *Infinity gap*: "We used 4 objects. But if a theory describes *infinite* relations (e.g., quantum fields), you can’t ‘junk’ it with pens. This requires math—Newman’s problem."  
     - *Scientific realism*: "This is why realists demand more than structure: causes, unobservables, or explanatory power."  

  ---

  ### **Predictable Pitfalls & Mitigation**  
  1. **Wrong object count**:  
     - *Risk*: A group uses 3 or 5 objects.  
     - *Mitigation*: Circulate during model-building. Ask: *"How does your model represent 4 distinct things?"*  

  2. **Over-defining "affects"**:  
     - *Risk*: "Affects must be causal/physical!" (e.g., dominoes).  
     - *Mitigation*: Praise creativity in Model 2 ("Great! You used abstract concepts—that’s allowed"). If resisted: *"Theory T doesn’t specify 'physical'. If we only have structure, why exclude ideas?"*  

  3. **Triviality not felt**:  
     - *Risk*: Groups take Model 2 seriously (no "junk" unease).  
     - *Mitigation*: Contrast Group 1’s "causal chain" with Group 3’s "arbitrary symbols" in sharing. Ask: *"Which model feels scientifically explanatory? Why?"*  

  4. **Epistemic/Ontic collapse**:  
     - *Risk*: Students conflate "all we know" with "all there is."  
     - *Mitigation*: Use whiteboard labels:  
       - *Epistemic*: "Structure is our map (but is the territory richer?)"  
       - *Ontic*: "Structure is the territory (no hidden furniture)."  
       Ask: *"When you built with junk, were you revealing a flaw in our knowledge (epistemic) or in reality itself (ontic)?"*  

  ---

  ### **Why This Works**  
  - **Discovery-led**: Students *feel* the structure’s persistence (Phase 3) and the absurdity of junk (Phase 4) before labeling.  
  - **Distinction clarity**: The junk problem explicitly challenges epistemic structural realism (trivial satisfaction) but leaves ontic intact (no "junk" beyond structure).  
  - **Honesty**: Debrief names limitations (continuity, infinity) and ties objections to realism.  

  **Final Note**: After debrief, reveal "structural realism" and note the Newman problem. Assign Ladyman & Ross’s *Every Thing Must Go* or Worrall’s papers for continuity arguments beyond the activity.
