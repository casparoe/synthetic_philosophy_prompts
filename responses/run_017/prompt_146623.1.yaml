prompt: |-
  I'm co-organizing a small closed workshop for people who work on psychiatric nosology, and my co-organizer (a philosopher of science) and I have finally persuaded two colleagues who have been circling each other for years to try an adversarial collaboration instead of another round of papers. One of them is a psychiatrist-neuroscientist who sits on a diagnostic-manual working group; call her side the discovery camp: it holds that at least some psychiatric categories name causally structured targets that classification can track progressively, that the instability of our categories is a measurement problem to be engineered away, and that looping — the way a classified population's awareness of its classification feeds back into the profile being classified — is one such nuisance among others. The other is a philosopher who works on interactive and human kinds; call his side the looping camp: it holds that for these kinds the feedback is partly constitutive rather than merely disruptive, that the target moves because the description moves and not only because our instruments are crude, and that when a category looks stable that stability is a local, institutionally maintained achievement rather than evidence of having found a joint. Both have agreed in advance to sign whatever they can genuinely sign, and to say plainly where they can't. What I need from you is the document they should come out with: a list of agreed claims, numbered, each one substantive enough that a naive version of either camp would have denied it before they started (I don't want agreements of the form that classification is hard or that words matter), followed by a disagreements table whose rows are cruxes and whose columns give the precise formulation each side would accept for its own position, what each side would count as evidence or argument that would move it, and — this is the part I care most about — for each crux a case or prediction both accept in advance as bearing on it, with each side's guess written down before the fact.

  To keep them off their usual examples, I've asked them to argue over material we've stipulated rather than over the settled literature, and I'd like you to do the same: no citations, no bibliographies, no named authorities, no contested history, and if you want an empirical illustration, flag clearly whether it is stipulated or something neither party could currently check. The case is a hypothetical proposed category for the next revision of a major diagnostic manual — maladaptive anticipatory vigilance, a pattern of compulsive threat-monitoring and checking — together with three stipulated findings. First, a proposed quantitative measure, the Semantic Recoil Index, tracking how much a category's prevalence and symptom profile shift when its criteria text is made public and taught in schools: the working group's multi-site data show prevalence roughly doubling within five years of an awareness campaign, but also show a comparable rise in a holdout cohort drawn from archival interviews recorded before the category existed and re-coded blind, with no exposure to the campaign. Second, a laboratory marker present in about 60 percent of those meeting criteria after the campaign versus about 55 percent before it. Third, when the criteria were tightened, the clinical presentation shifted to the new vocabulary while marker prevalence among cases stayed flat.

  Two further things I want handled explicitly, because I suspect most of the last decade of argument is hiding in them. The first is a deflationary move the discovery camp likes: that looping is just a species of measurement reactivity or observer effect of the sort any science has to correct for — with the corollary that classifier-responsive targets also show up outside psychiatry, wherever classified systems adapt to being classified, as with tumor subtypes under treatment or machine-learning classifiers facing adaptive adversaries — so that nothing about human kinds is special except degree. I want the joint statement to say whether the looping camp can sign any of that, and if it can't, exactly which clause it has to reject and what that clause was doing. The second is the obvious peace treaty, that these categories are both discovered and made; I want to know whether the statement treats that as a substantive position with content the two sides could disagree about, or as a verbal truce that dissolves the moment anyone asks what a nosology committee should do. So please also include a short verbal-versus-genuine section naming which parts of the dispute you take to be about words and why, and a closing section addressed to the committee that has to vote on whether to adopt maladaptive anticipatory vigilance: what, if anything, follows for that decision from the disagreement as the two sides have now stated it, and what either side would want measured before the vote. Define any technical term you use, and keep both sides' formulations ones they would recognise as their own rather than as caricatures.
reasoning: |-
  We are drafting a joint statement for two camps: the "discovery camp" (psychiatrist-neuroscientist) and the "looping camp" (philosopher). The goal is to have a list of agreed claims, a disagreements table with cruxes, and sections on the deflationary move and the "discovered and made" idea. We also need a section on verbal vs genuine disagreements and advice for the committee.

  Stipulated case: Proposed category "maladaptive anticipatory vigilance" (MAV) with three findings:

  1. **Semantic Recoil Index (SRI)**: After an awareness campaign, prevalence doubled. But a holdout cohort (archival interviews from before the category existed, re-coded blind) showed a comparable rise. This suggests that the rise isn't solely due to awareness but might be due to other factors (e.g., changes in environment).

  2. **Laboratory marker**: Present in about 60% of post-campaign cases vs 55% of pre-campaign cases (a small increase).

  3. **Criteria tightening**: When criteria were tightened, the clinical presentation shifted to the new vocabulary, but marker prevalence among cases remained flat.

  We must avoid settled literature and use this material.

  **Agreed Claims**: We need numbered, substantive claims that a naive version of either camp would have denied. They should be based on the stipulated findings and the discussion.

  **Disagreements Table**: Rows are cruxes (key points of disagreement). Columns:
  - Precise formulation each side accepts for its own position.
  - What each side would count as evidence or argument that would move it.
  - A case or prediction both accept as bearing on it, with each side's guess written down before the fact.

  **Deflationary Move**: Discovery camp says looping is just measurement reactivity, not special to human kinds. We need to say if looping camp can sign any of that, and if not, which clause they reject and why.

  **Peace Treaty ("both discovered and made")**: Is this substantive or a verbal truce? We need to address this.

  **Verbal vs Genuine Section**: Identify which parts are about words and why.

  **Advice to Committee**: What follows for the decision on MAV? What should be measured before the vote?

  ---

  **Step 1: Agreed Claims (Numbered, Substantive)**

  Based on the stipulated findings, both camps might agree on:

  1. **Agreed Claim 1**: The Semantic Recoil Index (SRI) data show that changes in the prevalence of a psychiatric category can occur independently of direct exposure to the diagnostic criteria text. (Because the holdout cohort, with no exposure, showed a comparable rise to the post-campaign group. A naive discovery camp might have thought that without exposure, prevalence wouldn't change; a naive looping camp might have thought the rise was entirely due to awareness.)

  2. **Agreed Claim 2**: The laboratory marker data indicate that the biological underpinnings of a psychiatric category can remain relatively stable even as the category's prevalence and symptom profile shift. (Because after the awareness campaign, marker prevalence only increased slightly from 55% to 60%, and when criteria were tightened, marker prevalence stayed flat despite the shift in presentation. Discovery camp might have expected marker prevalence to track diagnostic changes more closely; looping camp might have expected more instability in the marker if the kind is purely interactive.)

  3. **Agreed Claim 3**: The tightening of diagnostic criteria can lead to a shift in the clinical presentation of the category (as seen in the shift to new vocabulary) without necessarily altering the prevalence of the associated laboratory marker among diagnosed cases. (This draws from the third finding. Both sides might have thought that changing criteria would affect the marker if they saw it as tightly linked to the category.)

  These are substantive because they directly address the behavior of the category under changes in classification and measurement.

  **Step 2: Disagreements Table**

  We need cruxes (key disagreements). Possible cruxes:

  - **Crux 1: The nature of the target**: Is MAV a causally structured kind that exists independently of classification, or is it an interactive kind that is partly constituted by the classification?
  - **Crux 2: The role of looping**: Is looping merely a measurement problem (to be corrected) or constitutive of the kind?
  - **Crux 3: The stability of the marker**: What does the relative stability of the marker imply about the kind?

  We'll structure the table for each crux.

  **Crux 1: The nature of the target of classification for MAV**

  - **Discovery camp position**: The target of classification for MAV is a causally structured kind that exists independently of the diagnostic process; the diagnostic category aims to track this pre-existing structure, and any instability (like the SRI changes) is due to measurement error or confounding factors that can be refined away.
    
  - **Looping camp position**: The target of classification for MAV is an interactive kind; its existence and properties are partly constituted by the diagnostic process and the social response to it, so that the "target" is not independent of classification.

  - **Evidence that would move each**:
    - Discovery camp: Evidence that would move them might be if, after controlling for all known confounders, the SRI effect disappeared or was explained by non-interactive factors. Alternatively, if the marker was highly specific and stable across drastic changes in classification, that would support their view.
    - Looping camp: Evidence that would move them might be if, in a scenario with no dissemination of the category (e.g., in a completely isolated population), the prevalence and symptom profile remained constant over time despite environmental changes, or if the marker was found to be 100% specific and invariant under reclassification.

  - **Agreed case/prediction**:
    - Case: A natural experiment where two similar populations are studied: one where the MAV criteria are introduced with a massive awareness campaign, and another where the criteria are introduced silently (only to clinicians, no public awareness). Both populations are followed for 5 years.
    - Prediction:
      - Discovery camp guesses: Prevalence and symptom profiles in the silent group will be stable, while the awareness group shows an increase due to measurement reactivity. The marker prevalence will be similar in both groups at baseline and follow-up, but the awareness group might have more false positives (lower marker prevalence among cases).
      - Looping camp guesses: Both groups will show changes in prevalence and profile because the silent introduction still involves clinician classification, which affects patient behavior, but the awareness group will show a larger effect. The marker prevalence among cases will be stable in the silent group but might shift in the awareness group due to the broader uptake.

  **Crux 2: The role of feedback (looping) in the constitution of MAV**

  - **Discovery camp position**: Feedback (looping) is a measurement reactivity issue; it introduces noise that can and should be corrected for by better measurement tools and controls, just as in other sciences (e.g., adjusting for observer effects in physics or biology). The core causal structure of MAV remains intact.

  - **Looping camp position**: Feedback is constitutive of the kind; without the feedback process, MAV as we know it would not exist. The category's properties emerge from the interaction between the classification and the classified.

  - **Evidence that would move each**:
    - Discovery camp: If a non-reactive measure (e.g., a purely biological marker) could be found that predicts MAV with high accuracy and is unaffected by changes in diagnostic criteria or awareness, that would support their view.
    - Looping camp: If, even after removing all explicit classification (e.g., in a pre-classification era), similar patterns of behavior were identified and found to be stable and non-interactive, that would challenge their view.

  - **Agreed case/prediction**:
    - Case: Study the effect of "de-classifying" MAV. Suppose the diagnostic manual removes MAV for 10 years, then reinstates it with the same criteria. Compare the symptom profiles and marker prevalence at removal, during removal, and after reinstatement.
    - Prediction:
      - Discovery camp: During removal, the underlying condition still exists but is misdiagnosed; upon reinstatement, the profile and marker prevalence return to pre-removal levels because the causal structure is stable.
      - Looping camp: During removal, the symptom profile dissipates or morphs into other presentations because the category is no longer reinforced; upon reinstatement, it re-emerges but with differences, and marker prevalence might be lower initially because the kind has to be re-constituted.

  **Crux 3: The significance of the laboratory marker for MAV**

  - **Discovery camp position**: The laboratory marker is an indicator of a biological substrate that is central to MAV; its relative stability (55% to 60% after campaign, flat after tightening) shows that we are tracking a real entity, and the increase might be due to better detection or reduced heterogeneity.

  - **Looping camp position**: The laboratory marker may be associated with a subset of cases, but its stability under criteria changes does not imply that MAV is a natural kind; rather, it shows that the marker is invariant to the interactive aspects, possibly because it captures a common downstream effect or a separate process.

  - **Evidence that would move each**:
    - Discovery camp: If the marker could be shown to be causally involved in the etiology of MAV (e.g., via intervention studies), that would strengthen their view. Also, if the marker's prevalence increased linearly with diagnostic refinement, that would support progress.
    - Looping camp: If the marker was found to be equally prevalent in other diagnostic categories or in the general population, that would undermine its specificity to MAV and support the idea that it is not central to the kind.

  - **Agreed case/prediction**:
    - Case: Introduce a treatment that targets the marker (e.g., a drug) and see if it ameliorates MAV symptoms only in marker-positive cases, and if so, whether the diagnostic criteria can be refined to better capture marker-positive cases.
    - Prediction:
      - Discovery camp: Treatment will be effective only for marker-positive MAV cases, and refining criteria to select for marker-positive cases will improve the category's validity (e.g., higher treatment response).
      - Looping camp: Treatment might help marker-positive cases, but the criteria refinement will also change the presentation and prevalence due to feedback, and the treatment response might not generalize if the category shifts.

  **Step 3: Deflationary Move**

  Discovery camp: Looping is just measurement reactivity; human kinds are not special except in degree.

  Looping camp likely rejects the "not special" part. They argue that in human kinds, the feedback is constitutive, not just reactive. Rejecting the clause "nothing about human kinds is special except degree" because that clause is meant to reduce looping to a technical problem, whereas the looping camp sees it as ontological.

  The clause was doing: Equating human kinds with other adaptive systems to deny any unique philosophical challenge.

  **Step 4: Peace Treaty - "Both discovered and made"**

  We must say whether this is substantive or a verbal truce.

  - If taken as a substantive position, it might mean that there is a biological substrate that is discovered, but the way it is categorized and enacted is made. However, the two camps disagree on the balance and the implications.

  - In practice, it dissolves when we ask what to do: Discovery camp would focus on refining measurement to get at the substrate, while looping camp would focus on the effects of classification and might prefer more flexible or provisional categories.

  Thus, we can say that the phrase is a verbal truce that masks unresolved disagreements about ontology and practice.

  **Step 5: Verbal vs Genuine Section**

  Identify parts that are about words:

  - The term "real": Discovery camp means causally structured and independent; looping camp might avoid it or mean something else. So using "real" without clarification is verbal.

  - "Measurement reactivity": Discovery camp uses it broadly to include any observer effect; looping camp reserves it for cases where the target is independent, so applying it to looping is a category mistake.

  - "Constitutive": Looping camp uses it to mean essential to the kind's existence; discovery camp might see it as hyperbolic.

  But the core disagreements (e.g., whether the target is independent, whether looping can be corrected away) are genuine.

  **Step 6: Advice to Committee**

  For the decision on MAV:

  - What follows from the disagreement? The discovery camp would argue that the marker stability supports MAV as a valid category to be refined. The looping camp would argue that the SRI and shifting presentation show that MAV is interactive, so the committee should consider the social consequences of classification.

  - What to measure before the vote?
    - Discovery camp: Want more data on the marker, e.g., its predictive validity for treatment response, and whether refining criteria around the marker improves outcomes.
    - Looping camp: Want data on the effects of classification, e.g., how the criteria change behavior, whether there are harms from over-diagnosis, and how the category is being adopted in culture.

  Joint advice: The committee should evaluate both the biological and the interactive aspects. Specifically, they should:

  1. Assess the laboratory marker's role: Is it causal or correlational? Does it predict treatment response?
  2. Conduct studies on the impact of diagnostic dissemination: How does public awareness change help-seeking and symptom expression?
  3. Monitor the SRI over time after introduction to see if the changes stabilize.

  ---

  Now, we draft the document accordingly.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Maladaptive Anticipatory Vigilance (MAV)  
  *Agreed upon by the Discovery Camp and Looping Camp*  

  #### I. Agreed Claims (Substantive, Numbered)  
  Based on analysis of the stipulated findings for the proposed category "maladaptive anticipatory vigilance" (MAV)—defined as a pattern of compulsive threat-monitoring and checking—we jointly affirm the following. These claims are substantive: a naive discovery position would have denied the looping-relevant implications, while a naive looping position would have denied the stability implications.  

  1. **Independent Environmental Drivers of Prevalence Shifts**: Changes in the prevalence and symptom profile of MAV can be driven by factors entirely external to diagnostic classification (e.g., societal stress, environmental threats), as evidenced by the Semantic Recoil Index (SRI) holdout cohort. The SRI measures shifts in a category’s prevalence and symptom profile after its criteria become public. Here, a comparable rise in MAV occurred in both a cohort exposed to an awareness campaign and a holdout cohort with no exposure (re-coded from pre-category archival data). This rules out the claim that prevalence shifts are *solely* artifacts of diagnostic awareness.  

  2. **Partial Dissociation Between Symptom Presentation and Laboratory Marker**: The laboratory marker (a stipulated biological correlate, e.g., a neural activation pattern) is modestly stable under changes in diagnostic criteria and awareness. Marker prevalence rose only slightly (55% to 60%) after the awareness campaign and remained flat when criteria were tightened (despite symptom profiles shifting toward the new vocabulary). This indicates that the marker is not fully synchronized with symptom expression, challenging views that biological correlates must tightly track diagnostic fluctuations.  

  3. **Diagnostic Criteria as a Catalyst for Symptom Reconfiguration**: Tightening diagnostic criteria can reshape how symptoms are expressed (e.g., patients adopting new clinical vocabulary) without altering the prevalence of the laboratory marker among diagnosed cases. This demonstrates that criteria changes actively reorganize symptom presentation—they do not merely "reveal" or "obscure" a static underlying reality.  

  #### II. Disagreements Table  
  Cruxes are defined as unresolved disagreements where both sides commit to specific predictions. Each row details:  
  - **Precise Position**: Each camp’s accepted formulation.  
  - **Evidence/Argument to Move**: What would shift each camp’s view.  
  - **Agreed Case/Prediction**: A hypothetical scenario both accept as bearing on the crux, with pre-commitments to predictions.  

  | Crux | Discovery Camp Position | Looping Camp Position | Evidence/Argument to Move Discovery Camp | Evidence/Argument to Move Looping Camp | Agreed Case/Prediction |
  |------|-------------------------|------------------------|------------------------------------------|----------------------------------------|------------------------|
  | **Crux 1: Ontological Status of MAV**<br>*Is MAV a causally structured kind independent of classification, or an interactive kind constituted by it?* | MAV is a causally structured kind: its core features (e.g., threat-monitoring circuitry) exist independently of classification. Diagnostic instability arises from measurement noise (e.g., variable clinician assessments or environmental confounds), which better tools can correct. | MAV is an interactive kind: feedback from classification (e.g., patients internalizing the MAV label) partly constitutes its symptom profile. Instability reflects the kind’s plasticity, not measurement error. | Evidence that MAV’s symptom profile and prevalence remain stable in a population *fully* isolated from diagnostic influence (e.g., an uncontacted society with archival data matching modern criteria). | Evidence that MAV’s symptom profile remains consistent even when diagnostic labels are systematically withheld for generations (e.g., historical records showing identical presentations pre- and post-classification). | **Case**: A 10-year study of two subcultures: one where MAV is classified/disseminated, and one where it is deliberately unlabeled (symptoms described neutrally as "stress reactions").<br>**Discovery Prediction**: Prevalence and symptom profiles will correlate with environmental stressors alone; no divergence between groups.<br>**Looping Prediction**: The classified group will show amplified/differentiated symptoms (e.g., ritualized checking) due to feedback; the unlabeled group will not. |
  | **Crux 2: Role of Looping Feedback**<br>*Is looping a correctable measurement problem or a constitutive feature of psychiatric kinds?* | Looping is measurement reactivity (e.g., patients reporting symptoms to align with criteria). It is a nuisance that better engineering (e.g., blinded assessments, objective markers) can mitigate, as in other sciences (e.g., tumor evolution under treatment). | Looping is constitutive: it alters the kind itself (e.g., MAV patients consciously performing "vigilance" to fit criteria). Engineering can only redirect, not eliminate, this feedback. | If an "unloopable" measure (e.g., a machine-learning model using only non-reactive biomarkers) predicts MAV with >90% accuracy across criteria changes, it would show reactivity is separable from the kind. | If looping effects disappear when social/clinical feedback is blocked (e.g., in a double-blind trial where patients are unaware of their diagnosis), it would show feedback is not constitutive. | **Case**: Introduce MAV in a region using only biomarker-based diagnosis (no criteria disclosed to patients/clinicians) vs. standard criteria-based diagnosis.<br>**Discovery Prediction**: Both methods will converge on similar cases; biomarker prevalence will stabilize.<br>**Looping Prediction**: Criteria-based diagnosis will yield more severe/variable symptoms due to feedback; biomarker-based will not. |
  | **Crux 3: Implications of Marker Stability**<br>*Does flat marker prevalence under criteria changes indicate progress toward a "joint"?* | Flat marker prevalence after criteria tightening (per Finding 3) shows refinement is approximating a causal structure (the marker). Stability is evidence of discovery progress. | Flat marker prevalence reflects the marker’s invariance to interaction; it may be a downstream effect (e.g., stress response) not unique to MAV. Stability is orthogonal to whether MAV is a "joint." | If tightening criteria increases the marker’s specificity (e.g., from 60% to >80%) by excluding "noisy" cases, it supports engineering progress. | If the marker is equally prevalent in other categories (e.g., anxiety disorders) after re-analysis, it undermines MAV’s uniqueness. | **Case**: Tighten MAV criteria to select only marker-positive cases; track if symptoms become more homogeneous and treatment response improves.<br>**Discovery Prediction**: Symptom profiles will stabilize, and treatment efficacy will increase.<br>**Looping Prediction**: Symptoms will shift to match the new criteria, but treatment gains will be marginal due to feedback-driven heterogeneity. |

  #### III. Deflationary Move: "Looping is Just Measurement Reactivity"  
  - **Discovery Camp Position**: Signs this fully. Looping is one instance of measurement reactivity (like observer effects in physics), differing only in degree (e.g., human self-awareness amplifies it).  
  - **Looping Camp Position**: Rejects the clause: "**nothing about human kinds is special except degree**." This clause reduces looping to an *epistemic* problem (solvable by better tools), whereas the camp holds it is *ontological* (the kind’s identity depends on classification). Rejecting this clause blocks the move to treat psychiatric kinds as "discovered" in the same way as tumor subtypes.  

  #### IV. The "Discovered and Made" Peace Treaty  
  The phrase "MAV is both discovered and made" is a **verbal truce** with no substantive content for nosology. It dissolves under scrutiny:  
  - **Discovery Camp**: Interprets "discovered" as identifying pre-existing causal structures and "made" as the engineering challenge of reducing noise.  
  - **Looping Camp**: Interprets "discovered" as isolating stable correlates and "made" as the constitutive role of feedback.  
  **Why it lacks substance**: Both camps agree biological and social factors exist, but disagree on whether classification *extracts* or *generates* the kind. The truce evades the operational question: "Should the committee prioritize biomarker refinement or feedback management?"  

  #### V. Verbal vs. Genuine Disagreements  
  - **Verbal Disagreements**:  
    - **"Measurement Reactivity"**: Both use the term, but the looping camp restricts it to cases where the *target is unchanged* (e.g., a rock’s weight). Applying it to human kinds is contested, making debates about "reactivity" circular.  
    - **"Stability"**: The discovery camp equates it with progress toward a joint; the looping camp sees it as a contingent achievement. This is semantic without empirical tests (hence the predictions in §II).  
  - **Genuine Disagreements**:  
    - Whether looping can be "corrected" without altering the kind (testable via the §II cases).  
    - Whether flat marker prevalence under criteria changes indicates nosological progress (testable via treatment outcomes).  
  These are genuine because they yield divergent predictions and policy prescriptions.  

  #### VI. Advice for the Diagnostic Committee  
  **On the MAV Decision**:  
  - The disagreement implies **no veto** on adopting MAV. The discovery camp sees the marker’s stability as green-lighting inclusion (with refinement); the looping camp sees the SRI data as cautioning against reifying MAV as a "natural" entity.  
  - **What Follows**: The committee must decide whether to treat MAV as a *provisional construct* (requiring feedback monitoring) or a *target for biomarker refinement* (requiring validation studies).  

  **Pre-Vote Measurements**:  
  - **Discovery Camp Request**: Run a treatment trial using the laboratory marker to stratify patients (e.g., target therapy to marker-positive cases). If outcomes improve, it supports MAV as a valid category.  
  - **Looping Camp Request**: Measure the "SRI trajectory" post-introduction—track prevalence, symptom shifts, and social consequences (e.g., stigma) for 3 years. If symptoms amplify or diverge from the marker, it signals interactive effects.  
  - **Joint Recommendation**: Before voting, the committee should:  
    1. **Replicate the SRI holdout finding** to confirm environmental drivers.  
    2. **Test marker specificity** against non-MAV anxiety disorders.  
    3. **Pilot MAV criteria in a low-awareness setting** to isolate feedback effects.  

  ---  
  This document, including predictions and tests, is endorsed by both camps as of the workshop’s conclusion. Signed:  
  - **Discovery Camp Representative**  
  - **Looping Camp Representative**  
  - **Workshop Co-Organizers**  

  *Definitions*:  
  - **Semantic Recoil Index (SRI)**: A metric quantifying changes in a diagnostic category’s prevalence and symptom profile after its criteria become publicly known.  
  - **Looping**: Feedback where a population’s awareness of their classification alters the symptoms or behaviors being classified.  
  - **Causally Structured Kind**: A category defined by underlying causal mechanisms (e.g., a disease with a specific etiology).  
  - **Interactive Kind**: A category whose identity and features depend on social and classificatory practices.  
  - **Holdout Cohort**: A group assessed using archival data from before a category existed, re-coded without exposure to current diagnostic frameworks.
