prompt: |-
  I run a monthly "hard problems" night at my local library — usually 12 to 18 adults, a total mix of backgrounds, most of them have never taken a philosophy or econ class, and we get 90 minutes in a room with a whiteboard, index cards and sticky notes. No projector, and I'd rather not have the participants on laptops (I can use one myself if I need to).

  We've been chewing lately on how groups make decisions, and a few weeks ago we got into a genuinely frustrating argument about whether a group can even have a "will" at all, or whether the outcome is just an artifact of whichever voting method you happened to pick. I want to run a session that makes them *feel* the force of the result behind that — the one that says no ranked voting rule can give you all of the following at once: (1) anyone can rank the options however they like, no rankings thrown out; (2) if literally everyone puts X above Y, then X beats Y for the group; (3) whether the group prefers X to Y can't depend on how people rank some third option Z — no spoilers; (4) no single person's ballot just is the answer every time. I know this as the impossibility result about ranked group choice (Arrow's thing, and the Condorcet cycling stuff around it), but I do NOT want to name it or explain it up front. No lecture at the beginning at all if you can avoid it.

  Here's what I'd like you to design.

  The setup I have in mind, which you can improve or replace: they make a *real* decision with small but actual stakes (I can promise in advance that we'll really do whatever they decide — where the next meetup's food comes from, what topic we do next month, how we spend a small leftover budget). So the ballots aren't hypothetical. Then, roughly:

  - A first vote under plain plurality on three options, done fast, before anyone is suspicious.
  - A reveal that a fourth option was sitting on the whiteboard the whole time that nobody ranked first, added to the same ballots, re-counted, and the winner flips. I want them to have the reaction "that's wrong — nothing changed about how anybody feels about A versus B" before anyone says the word spoiler.
  - A beat where they get to see that a group of perfectly consistent, transitive individuals can produce a group ranking that goes in a circle, and separately a beat where the group ranking is perfectly consistent but still flips because of an option that didn't win. I really care about these being *distinguished*: my sense is people mash together "the group is being irrational" and "the method is broken," and I want the activity to force them apart. If you think that's too subtle for 90 minutes with non-specialists, tell me and say which one to cut.
  - A "design your own rule" round in small teams: each team writes a rule in plain English on one index card, and the other teams try to break it by handing in a made-up set of ballots. Score it somehow — the team whose rule survives the most attacks, or the team that breaks the most rules, wins something small (bragging rights, picking next month's topic). I want them to notice that every rule they invent either hands someone a permanent veto, or lets a losing option change the outcome, or ignores ballots — and that "just ask people how strongly they feel, on a 0-10 scale" is a dodge rather than a fix, since it changes what counts as input instead of solving anything.
  - One device I really like but can't get to work: I (or a planted volunteer) act as a black-box "decision machine." Participants can hand me any set of ballots they want, as many times as they want, and I announce the group ranking. Their job is to reverse-engineer my rule by experimenting. Ideally they eventually work out that the machine has a secret dictator, or that it's ignoring everyone but one person, and only then do I reveal what the machine was doing. Can you make that actually run in a room of 15 people without it taking 40 minutes or feeling like a guessing game against the facilitator?

  What I want back:

  - The actual rules and materials, and who does what when.
  - A minute-by-minute timeline for 90 minutes that tells me where to cut if we're running long.
  - A short list of the very few things I'm allowed to say out loud before the debrief, and the phrasing. I will absolutely talk too much if you don't constrain me.
  - The debrief: which moment in the room is supposed to map onto which of the four conditions, and how I draw that out of them rather than announcing it.
  - What will predictably go wrong. Specifically: someone will say "so democracy is fake / voting is meaningless" and I want them to leave with something better than that — I'd rather they leave feeling there's no free lunch and that choosing a rule is choosing which flaw you'll live with. Also someone will propose flipping a coin, or a rotating random dictator, and I don't know what to do with that. And someone will say our sample of ballots is tiny so this proves nothing — which is definately fair and I want a good answer ready.
  - Be honest about what the activity cannot show and I'll just have to state: the generality over *every possible* combination of ballots, the fact that all of this assumes the rule only sees rankings and not intensities, and anything else you think is out of reach for a game.

  Please write your answer in American English, and keep it practical — I've got one room, one whiteboard, and alot of index cards.
reasoning: |-
  We are designing a 90-minute session for a group of 12-18 adults with mixed backgrounds. The goal is to have them experience the challenges of group decision-making and the impossibility of having a perfect voting system (Arrow's theorem) without lecturing about it upfront.

  Key elements from the request:
  - Real decision with small stakes (e.g., next meetup's food, topic, or spending a small budget).
  - Activities: 
    a. First vote with plurality on three options, then introduce a fourth option and show the winner flips (spoiler effect).
    b. Show a Condorcet cycle (consistent individuals leading to an intransitive group ranking).
    c. Show a situation where the group ranking flips due to an irrelevant alternative (even without a cycle).
    d. Design-your-own-rule in teams, then try to break each other's rules.
    e. Optional: "Decision machine" where participants try to reverse-engineer the rule (if feasible in time).

  Constraints:
  - No projector, minimal lecture, avoid technical terms.
  - Use whiteboard, index cards, sticky notes.

  Plan:

  Phase 1: Introduction (5 minutes)
  - Set the stage: We are making a real decision today (e.g., choose from three snack options for next meeting: A, B, C). We'll vote and then actually order that snack.
  - Emphasize: This is about how groups decide, and we're going to try a few methods.

  Phase 2: Plurality Vote and Spoiler Effect (15 minutes)
  - Present three options (e.g., A: Chips, B: Cookies, C: Fruit). 
  - Each participant writes their top choice on an index card (plurality vote). 
  - Collect and tally on the whiteboard. Declare the winner.
  - Then, reveal: "Wait, I forgot to include an option that was on the whiteboard: D (say, Pretzels). Let's add that to the same ballots. But note: I'm not changing anyone's preferences. If you didn't vote for D, your vote still goes to your top choice among A, B, C, D." 
  - Re-tally: In the new tally, because D might split the vote, the winner might change. For example:
      Original: A: 7, B: 6, C: 5 -> A wins.
      After adding D (which is similar to A and gets 4 votes from A supporters): A:3, D:4, B:6, C:5 -> B wins.
  - Highlight: "So now B wins, but nothing changed about how people feel about A vs B. Is that fair?"

  Phase 3: Condorcet Cycle (20 minutes)
  - Now, introduce a different scenario: We are going to rank three options (say, for next month's topic: X, Y, Z). 
  - Each participant ranks the three (on a new index card: 1st, 2nd, 3rd). 
  - Collect and then run pairwise comparisons on the whiteboard:
      - How many prefer X over Y? (count hands or from ballots)
      - How many prefer Y over Z?
      - How many prefer Z over X?
  - If we have a cycle (e.g., X beats Y, Y beats Z, but Z beats X), show that the group as a whole is intransitive even though each individual is transitive.
  - Example: 3 voters: 
      Voter1: X>Y>Z 
      Voter2: Y>Z>X 
      Voter3: Z>X>Y
      Then: 
          X vs Y: 2 prefer X (V1 and V3) vs 1 (V2) -> X wins.
          Y vs Z: 2 prefer Y (V1 and V2) vs 1 (V3) -> Y wins.
          Z vs X: 2 prefer Z (V2 and V3) vs 1 (V1) -> Z wins.
      So group: X>Y, Y>Z, but Z>X -> cycle.
  - Note: We are just using the group's pairwise preferences. The group doesn't have a clear winner? How do we break the tie?

  Phase 4: Irrelevant Alternative (15 minutes)
  - Use the same ballots from Phase 3 (or new ones) but now with a fourth option W that is a "clone" of one of them and loses to everyone.
  - Example: Start with three options (X, Y, Z) and the group ranking is X>Y>Z (if we broke the cycle by some method, but better if we can avoid a cycle in this example). Then add W that is similar to X and is always ranked just below X by everyone. Now, re-run the same voting rule (say, Borda count or plurality) and show that the winner might change (e.g., because W takes points from X, Y might win now).
  - Alternatively, use a different set of ballots to avoid confusion. We want to show that adding a losing alternative can change the outcome between the original options.

  But note: We have limited time. We might combine or adjust.

  Phase 5: Design Your Own Rule (25 minutes)
  - Split into small teams (3-4 people per team, about 4-5 teams).
  - Each team designs a voting rule (for ranking or choosing a winner) and writes it clearly on an index card. Rules must be based on ranked ballots.
  - Then, teams exchange rules. Each team tries to create a set of ballots (for 3-5 voters) that breaks the rule (i.e., produces an outcome that seems unfair by the rule's own terms, or violates one of the principles we've seen).
  - Teams present their attempts. Score: 
      - The team whose rule survives the most attacks gets bragging rights.
      - The team that breaks the most rules (by creating a counterexample) also gets recognition.
  - Common flaws they might run into: 
      - A rule might ignore some ballots (like only looking at first choice) -> spoiler effect.
      - A rule might let a single voter decide (dictator).
      - A rule might be non-monotonic (a candidate loses when they gain support) or sensitive to irrelevant alternatives.

  Phase 6: The Decision Machine (optional, if time) (15 minutes)
  - We might skip this if short on time, but if we do it:
      - I (the facilitator) am the machine. I have a fixed rule in mind (e.g., I always output the ranking that is the same as a particular participant, the "secret dictator", or I use a fixed ordering regardless of ballots).
      - Participants can hand me any set of ballots (for a fixed set of options, say 3 options) and I output a group ranking (written on a sticky note and put on the whiteboard).
      - They can do this as many times as they want (but we limit to 3-5 trials to save time).
      - After a few trials, they guess the rule. Then I reveal.

  Phase 7: Debrief (10 minutes)
  - Draw out the principles they experienced:
      - "In the first vote, when we added D, the winner changed even though no one changed their mind about A vs B. What principle does that violate?" (Answer: independence of irrelevant alternatives, IIIA)
      - "In the cycle, we saw that the group preferences could be cyclic even though every individual was consistent. What does that say about a 'group will'?" (No clear group preference)
      - "When you designed rules, what kinds of problems did you run into? Did you find a rule that avoided all of them?"
  - Then, state the four conditions (without naming Arrow) and connect:
      1. Everyone can rank as they like (universal domain).
      2. If everyone prefers X to Y, then the group does too (unanimity).
      3. The group preference between X and Y shouldn't change based on how people rank Z (independence of irrelevant alternatives).
      4. No dictator (no one person always decides).
  - And then: "It turns out, it's impossible to have all four at the same time. So when we choose a voting rule, we are choosing which flaw we can live with."

  Timeline (90 minutes total):
  - 0-5 min: Introduction (set the real decision context, explain we'll vote and then do it).
  - 5-20 min: Phase 2 (Plurality vote and spoiler effect).
  - 20-40 min: Phase 3 (Condorcet cycle).
  - 40-55 min: Phase 4 (Irrelevant alternative).
  - 55-80 min: Phase 5 (Design your own rule).
  - 80-85 min: Optional Phase 6 (Decision machine) or skip to debrief.
  - 85-90 min: Debrief.

  But note: Phase 4 might be skipped or merged if we run long. Alternatively, we can do the irrelevant alternative in the design phase.

  Adjustments for time:
  - We might drop the irrelevant alternative as a separate activity and instead have it come up in the design phase.
  - Or, we can do the spoiler effect and the cycle, and then in the design phase, they will likely encounter the other flaws.

  Preparing the ballots:
  - We need to have pre-planned ballot distributions to ensure the effects happen. For the spoiler, we need a close race between A and B with C having fewer, and then D taking votes from A. For the cycle, we need a specific distribution (like the one above) that produces a cycle.

  Real decision:
  - We can use the same decision throughout? But we might change the context to avoid confusion. Alternatively, use one context for spoiler (snacks) and another for cycle (topics).

  Materials:
  - Index cards (many) for ballots and for writing rules.
  - Markers for whiteboard.
  - Sticky notes for the decision machine output.

  What the facilitator can say (minimal):
  - Introduction: "Today we're going to make a real decision about [X]. We'll vote and then we'll actually do that. But we're going to try a few different ways of voting to see what happens."
  - After spoiler: "Notice that when we added D, the winner changed from A to B. But did anyone change their mind about A and B? So why did the outcome change?"
  - After cycle: "Look at this: as a group, we prefer X to Y, Y to Z, but then Z to X. That's a cycle. How can we break it to pick a winner? What does that say about the group's will?"
  - In design phase: "Your task is to create a rule for how to turn a set of ranked ballots into a group ranking or a winner. Then, other teams will try to find a set of ballots that makes your rule produce an outcome that seems unfair or broken."
  - In debrief: "What patterns did we see? What problems kept coming up? ... It turns out, there are four things we might want in a fair voting system: [list]. But we've just experienced that we can't have all four at the same time. So we have to choose which ones to sacrifice."

  Handling objections:
  - "Voting is meaningless": "Actually, the point is that every voting system has strengths and weaknesses. We have to pick the one that best fits our values and the situation. It's not that voting is fake, but that we have to be aware of the trade-offs."
  - "Flipping a coin / random dictator": "Random methods avoid some of these problems but introduce chance. They might be fair in a different way, but they don't respect the voters' expressed preferences. For example, if everyone prefers A to B, then flipping a coin might choose B half the time even though everyone prefers A. So it violates unanimity."
  - "Small sample size": "You're right, in a small group like ours, these effects can happen by chance. But the point is that these are systematic problems that can occur in any size group. In fact, the mathematical results show that they are unavoidable in principle."

  What the activity cannot show:
  - We are using specific examples. We cannot show that these problems happen for every possible set of ballots. We are just illustrating that they can happen and that they are inherent in the rules.
  - We are only using rankings, not intensities. If we allowed cardinal voting (0-10 scale), we avoid Arrow's theorem (which assumes ordinal rankings) but face other issues (like strategic voting). We can mention that in the debrief.

  Revised Plan for Time:

  Given 90 minutes and the complexity, I suggest:
  - Skip the separate irrelevant alternative example and have it emerge in the design phase or in the spoiler effect (which is already an example of IIA violation). 
  - Focus on:
      a. Spoiler effect (plurality then adding an option) -> violates IIA.
      b. Condorcet cycle -> shows that group preferences might not be transitive, so we need a rule that breaks the cycle, but any rule will violate something.
      c. Design phase: they will try to create rules and then break them, which will reveal other flaws (like non-unanimity or dictatorship).

  Timeline adjusted:
  - 0-5 min: Intro
  - 5-20 min: Spoiler effect with real decision (snacks: A, B, C, then add D)
  - 20-40 min: Condorcet cycle (with a different set of options, e.g., topics: X, Y, Z)
  - 40-65 min: Design your own rule (teams create, then test on each other). This might run long, so we need to be strict on time.
  - 65-80 min: Decision machine (if we have time, otherwise skip or shorten). Alternatively, we can skip the decision machine and extend the design phase or debrief.
  - 80-90 min: Debrief

  But note: the design phase might take 25 minutes (5 min to create rules, 10 min to break and test, 10 min to present). We can adjust.

  Decision Machine Alternative:

  To make the decision machine run in 10 minutes:
  - Pre-select a rule (e.g., the facilitator is a dictator: always outputs the ranking of the person in the blue shirt).
  - Tell participants: "I am a decision machine. I take ranked ballots (for, say, 3 options) from any 3 of you and output a group ranking. Your job: figure out my rule by testing me. You can give me any set of 3 ballots (each ballot is a ranking of A,B,C)."
  - They hand me 3 ballots (on index cards). I look at the ballot of the blue-shirted person (or whoever the secret dictator is) and output that as the group ranking (on a sticky note). 
  - They can try a few times (limit to 3-5 sets). Then they guess.
  - This should take 10-15 minutes.

  But note: they might not guess it, so after 3-5 trials, I can reveal: "The rule was: I always pick the ranking of [name]." Then connect: "So this rule violates the 'no dictator' condition."

  Final Timeline:

  - 0-5: Intro
  - 5-20: Spoiler effect (15 min)
      - Vote on 3 snacks (plurality): tally, winner.
      - Add a fourth (similar to the leader): re-tally, winner flips.
      - Discuss: why did it flip? Is that fair?
  - 20-35: Condorcet cycle (15 min)
      - New context: choose next topic from 3 options.
      - Everyone ranks the three (on index cards).
      - Tally pairwise: show cycle if possible (if not, use a pre-prepared example with 3 voters as above).
  - 35-60: Design your own rule (25 min)
      - Split into 4-5 teams (3-4 people each).
      - Teams have 5 min to create a rule (write on index card).
      - Then, each team gets another team's rule and has 10 min to create a set of ballots (for 3 voters and 3 options) that breaks it (i.e., causes an unfair outcome or violates a principle).
      - Teams present (5 min): each attacking team shows the ballots and what the rule would output, and why it's broken.
  - 60-75: Decision machine (15 min)
      - Explain: "I am a black-box decision machine. Give me any 3 ballots (for 3 options) and I'll output the group ranking. Figure out my rule."
      - They give me ballots (I do 3-5 trials). I output the dictator's ranking.
      - They guess. Then I reveal the dictator.
  - 75-90: Debrief (15 min)
      - Draw out the four principles and the impossibility.

  Handouts/Materials:
  - Index cards (at least 5 per person, plus some extra).
  - Markers for whiteboard.
  - Sticky notes (for decision machine output).

  Prepared ballot distributions:

  For spoiler effect:
  - Let the three options be A, B, C.
  - Distribution: 7 for A, 6 for B, 5 for C. (Total 18)
  - Add D: assume D is similar to A. Of the 7 who voted for A, 4 switch to D (because they like D better than A? Or we can say: when adding D, they can vote for their top choice among A,B,C,D. So if 4 of the A supporters now prefer D, then they vote D. So new tally: A:3, D:4, B:6, C:5 -> B wins.

  For Condorcet cycle:
  - Use 3 voters for simplicity (but we have 18, so we can scale up). The classic cycle is with 3 voters and 3 options.
      Voter1: X>Y>Z
      Voter2: Y>Z>X
      Voter3: Z>X>Y
  - With 18, we can have 6 copies of each. Then:
      X vs Y: 12 (V1 and V3) vs 6 (V2) -> X wins (by 12-6)
      Y vs Z: 12 (V1 and V2) vs 6 (V3) -> Y wins
      Z vs X: 12 (V2 and V3) vs 6 (V1) -> Z wins
      So cycle.

  But note: we want the cycle to be clear. We can do the pairwise by show of hands to save time.

  Debrief Mapping:

  - Spoiler effect: violates condition (3) independence of irrelevant alternatives.
  - Cycle: shows that without violating (1) and (2) and (3), we might not have a transitive group ranking. So any rule that forces a transitive ranking must violate one of the conditions? Actually, Arrow's theorem is about transitive rankings. The cycle example shows why we want transitivity, but then we see that we can't have it without sacrificing something else.
  - Design phase: they will likely create rules that violate one of the conditions. For example:
      - A rule that ignores rankings beyond first choice: might violate IIA (spoiler) or unanimity (if everyone ranks X>Y but Y wins because of first choices).
      - A rule that always picks the same person's ranking: dictator.
      - A rule that requires unanimity for every ranking: then it might not produce a complete ranking (violates universal domain? or leads to indecision).
  - Decision machine: shows a dictator (violates condition 4).

  Finally, in the debrief, we list the four conditions and ask: which condition did we see violated in each activity?

  What to state in the debrief:
  - "In the first vote, when we added D, the outcome between A and B changed even though no one changed their mind about A and B. That violates condition (3): independence from irrelevant alternatives."
  - "In the cycle, we saw that the group doesn't have a clear preference. But if we force a group ranking with a rule, then that rule might have to violate one of the other conditions to break the cycle."
  - "In the design phase, you probably found that your rules either let one person decide (dictator) or they were sensitive to irrelevant alternatives, or they sometimes ignored unanimous preferences."
  - "And in the decision machine, we saw a dictator."

  Conclusion: "So it turns out, no matter what rule we pick, we have to give up at least one of these four things. That's a mathematical result. So when we design a voting system, we are choosing which flaw we can live with."

  This should leave them with the sense that there's no perfect system, but we can choose wisely.
answer: |-
  ### Voting Rule Workshop: "The Impossible Choice"  
  **Objective:** Help participants experience the inherent trade-offs in group decision-making through hands-on voting activities, leading to an intuitive grasp of Arrow's Impossibility Theorem without naming it. Focus on the four conditions: (1) Any ballot allowed, (2) Unanimity respected, (3) Independence from irrelevant alternatives (IIA), (4) No dictator.  

  **Stakes:** Let the group decide **where the next meetup’s snacks will come from** (e.g., Option A: Local Bakery, Option B: Grocery Store, Option C: Farmer’s Market). You’ll actually order from the winner. Budget: $50.  

  **Materials:**  
  - Whiteboard (divided into sections: Votes, Pairwise Results, Rules, Machine Output)  
  - Index cards (3 per person, plus 20 extras)  
  - Sticky notes (1 pad)  
  - Markers  
  - A hat or bowl for collecting ballots  

  **Timeline (90 Minutes):**  
  *(Cut phases 4 or 6 if short on time—marked with ⏰)*  

  #### **Phase 1: Intro & Plurality Vote (5 min)**  
  **What you say (keep it short!):**  
  > “Today, we’re deciding where next month’s snacks come from—for real. We’ll vote a few ways and see what happens. No right answers, just honest opinions. Here are your options:  
  > - **A: Local Bakery** (croissants)  
  > - **B: Grocery Store** (chips)  
  > - **C: Farmer’s Market** (fruit)  
  > Write your **top choice** on an index card and drop it in the hat.”  

  **What you do:**  
  - Tally votes on the whiteboard under “Vote 1: Plurality.”  
  - Example outcome (pre-plan this distribution for 15 people):  
    - A: 6 votes, B: 5 votes, C: 4 votes → **A wins** (Local Bakery).  
  - Announce: *“We’re getting croissants!”*  

  #### **Phase 2: Spoiler Effect (10 min)**  
  **What you say:**  
  > “Oops—I forgot Option **D: Big Box Store** (cookies), which was on the board earlier. Let’s add it. **Don’t change your original vote!** If you didn’t pick D, your vote still counts for your top choice among A/B/C/D.”  

  **What you do:**  
  - Add D to the whiteboard. Re-tally the **same ballots** (no rewrites).  
  - Pre-planned outcome (D siphons votes from A):  
    - A: 3 votes (3 switched to D), D: 3 votes, B: 5, C: 4 → **B wins** (Grocery Store).  
  - Point to the board: *“Now B wins. But did anyone change their mind about A vs. B?”*  
  - Let participants react. Someone will say: *“That’s unfair—A and B didn’t change!”* Nod and write: **“Flaw: A losing option changed the winner.”**  

  **Why this works:** Illustrates violation of **condition 3 (IIA)**—adding a losing option (D) altered A vs. B.  

  #### **Phase 3: Condorcet Cycle (15 min)**  
  **What you say:**  
  > “Let’s try ranked voting. New decision: **what topic we discuss next month**. Options:  
  > - **X: AI Ethics**  
  > - **Y: Climate Change**  
  > - **Z: Universal Income**  
  > Rank them 1st, 2nd, 3rd on a new index card.”  

  **What you do:**  
  - Pre-assign ballots to ensure a cycle (scale for 15 people):  
    - 5 cards: X > Y > Z  
    - 5 cards: Y > Z > X  
    - 5 cards: Z > X > Y  
  - Tally **pairwise comparisons** on whiteboard:  
    - X vs. Y: 10 prefer X, 5 prefer Y → X wins.  
    - Y vs. Z: 10 prefer Y, 5 prefer Z → Y wins.  
    - Z vs. X: 10 prefer Z, 5 prefer X → Z wins.  
  - Circle the results: **X>Y, Y>Z, Z>X**. Ask: *“Who should win? Can the group have a ‘will’ here?”*  

  **Why this works:** Shows consistent individuals creating an **intransitive group ranking**—no clear group will exists, even without rule flaws (distinguishes “group irrationality” from “method broken”).  

  #### **Phase 4: Irrelevant Alternative Flip (⏰ 10 min, skip if short)**  
  **What you say:**  
  > “Now, let’s add **W: Housing Policy** (similar to X). Same ballots—just add W last if it’s not your favorite.”  

  **What you do:**  
  - Use Borda Count (score: 3pts for 1st, 2pts for 2nd, 1pt for 3rd, 0 for 4th).  
  - Pre-planned outcome with 3 options:  
    - X: 30 pts, Y: 25 pts, Z: 20 pts → **X wins**.  
  - Add W (everyone ranks W last):  
    - X: 25 pts (loses points to W), Y: 25 pts, Z: 20 pts, W: 5 pts → **Tie (X/Y)** or Y wins if tiebroken.  
  - Point out: *“W lost, but it changed X vs. Y.”*  

  **Why this works:** Reinforces **condition 3 (IIA)** with a non-spoiler example—irrelevant alternative flips the outcome.  

  #### **Phase 5: Design Your Own Rule (25 min)**  
  **What you say:**  
  > “Split into teams of 3–4. Design a fair voting rule on an index card—use plain English! Rules must:  
  > - Accept ranked ballots.  
  > - Output a winner or ranking.  
  > Then, other teams will try to break your rule with made-up ballots.”  

  **What you do:**  
  - Teams brainstorm rules (5 min). Common flawed examples:  
    - *“Pick the most common 1st choice.”* (Violates IIA)  
    - *“Award 2 points for 1st, 1 for 2nd, ignore rest.”* (Violates unanimity if 2nd choice beats unanimous 1st)  
    - *“Rotate a ‘super voter’ each month.”* (Violates no-dictator)  
  - **Testing round (15 min):**  
    - Teams swap rules. Attackers create 3–5 ballots to break the rule (e.g., for “most common 1st choice,” make a spoiler scenario).  
    - Each team presents their attack (5 min total).  
  - Score on whiteboard: 1 point per unbroken rule, 1 point per successful attack.  

  **Key insights they’ll notice:**  
  - Every rule either ignores ballots, allows spoilers, or creates a dictator.  
  - “Rate 0–10” dodges by changing inputs (say: *“That’s a different system—we’re only using rankings today.”*).  

  #### **Phase 6: Decision Machine (⏰ 15 min, skip if short)**  
  **What you say:**  
  > “I’m a human decision machine! Hand me any 3 ranked ballots for X/Y/Z, and I’ll output a group ranking on a sticky note. Your goal: Guess my rule in ≤5 tries.”  

  **What you do:**  
  - Secret rule: **Always output the ranking of the person with the red shirt** (plant a volunteer or pick a noticeable trait).  
  - Participants submit ballot sets (e.g., 3 cards). You ignore inputs and output the dictator’s ranking.  
  - After 3–5 tries, ask for guesses. Reveal: *“I just copied [person]’s ballot.”*  
  - Write: **“Flaw: One person decides everything.”**  

  **Why this works:** Fast and visceral—exposes **condition 4 (no dictator)**.  

  #### **Phase 7: Debrief (10 min)**  
  **What you do (draw out, don’t lecture):**  
  1. **Map activities to conditions:** Point to whiteboard notes and ask:  
     - Spoiler effect: *“What did adding Option D do? Should a losing option change A vs. B?”* → **Condition 3 (IIA violated)**.  
     - Cycle: *“Was the group ‘confused,’ or was the method flawed?”* → **No group will exists (justifies need for rules)**.  
     - Design phase: *“Which rules got broken most? Did any avoid vetoes, spoilers, and dictators?”* → **All violate at least one condition**.  
     - Decision machine: *“What’s wrong with letting one person decide?”* → **Condition 4 (no dictator violated)**.  
     - Unanimity: *“Did any rule ignore if everyone agreed?”* → **Condition 2 (unanimity often sacrificed)**.  

  2. **State the takeaway:**  
  > “Today we saw that every voting rule has a flaw: spoilers, cycles, dictators, or ignoring agreement. Math shows it’s impossible to avoid all four. So we don’t say ‘voting is fake’—we say: **pick the flaw you can live with**.”  

  3. **Handle predictable objections:**  
     - *“Democracy is fake!”* → *“No—voting works, but every system has trade-offs. We choose rules based on what we value (e.g., no dictators vs. no spoilers).”*  
     - *“Flip a coin / random dictator!”* → *“Randomness avoids manipulation but violates unanimity. If everyone agrees on X, why let randomness pick Y?”*  
     - *“Our group is too small!”* → *“True, but these flaws scale up. Math proves they happen in any group, with any number of options.”*  
     - *“What about 0–10 ratings?”* → *“That’s a different system! It avoids these flaws but has new ones, like people lying about intensity. Today was about rankings.”*  

  **What the Activity Can’t Show (State Briefly If Asked):**  
  - “This happens for **every possible set of ballots**, not just ours.”  
  - “We assumed **only rankings** (not 0–10 scores). If we used scores, we’d face different problems.”  
  - “Real voting systems **prioritize different flaws** (e.g., Ranked Choice avoids spoilers but not cycles).”  

  **Cut Points if Running Long:**  
  - ⏰ Skip Phase 4 (Irrelevant Alternative)—it reinforces IIA, but Phase 2 already covers it.  
  - ⏰ Skip Phase 6 (Decision Machine)—it’s powerful but time-bound. Use Phase 5 attacks to expose dictatorship.  
  - Shorten Phase 5 testing to 10 min (1 attack per rule).  

  **What Will Go Wrong & Fixes:**  
  - **Chaotic design phase:** Assign team roles (1 scribe, 1 attacker, 1 presenter). Keep teams to 3 people.  
  - **Confusion between cycle/IIA:** Whiteboard headings and debrief questions force distinction (“Flaw: Cycle” vs. “Flaw: Spoiler”).  
  - **Someone dominates discussion:** Redirect with, *“Let’s hear from someone new—what did your team find?”*  
  - **Rule design stalls:** Offer starter examples (e.g., *“Try a scoring rule or a runoff”*).  

  **Final Prep:**  
  - Pre-write ballot distributions (Phases 2, 3, 4) to ensure effects work.  
  - Plant a “red-shirt dictator” for Phase 6.  
  - Bring snacks as a reward for participation!  

  This design forces participants to experience the trade-offs firsthand, minimizes lecture, and ends with a practical takeaway: no perfect system, but informed choices matter.
