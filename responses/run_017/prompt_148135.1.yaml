prompt: |-
  I am in the final year of an economics degree, and alongside my coursework I am taking a philosophy seminar on the ethics of deception. This week's question is whether lying is morally different from merely misleading someone. Assume I have read the seminar material: I do not need the debate explained in its own terms. What I want is for you to restate it in the vocabulary I actually work in, and then to tell me what the translation fails to carry.

  On my vocabulary, so you can calibrate: I am comfortable with sender–receiver games over a state space — cheap talk, where messages are costless labels whose content is assigned by the equilibrium rather than by the modeller; costly signalling in the Spence style; verifiable disclosure and the unravelling argument; and information design, where a designer commits ex ante to a signal structure, understood as a stochastic map from states to signals, with the receiver's incentives summarised by an obedience constraint, so that what matters is the induced distribution over posteriors rather than any individual message. I am also used to distinguishing a sender's ex ante choice of signal structure from an ex post deviation within it, and to reasoning about off-path beliefs.

  Please do three things.

  First, restate as faithfully as you can both sides: the claim that lying is morally distinctive, typically on the ground that assertion is governed by a norm that mere misleading does not violate, and the sceptical claim that the two differ only in technique and not in moral status. Give each as a claim about states, signals, constraints and payoffs, not as a claim about words.

  Second, try to find formal homes for two things I suspect are doing the real work. (a) Falsity: in my models a message is just a label, so saying something false is not yet a property of anything. What would have to be added — an exogenously fixed truth-conditional map from messages to events, a verifiability constraint, something else — before a lie is representable at all? And is adding it a translation or an import? (b) A conjecture of my own, which I would like you to test rather than endorse: that the difference is not fundamentally about truth but about records. A lie, on this view, inserts a false entry into something that persists and that others will rely on and act on later; misleading leaves the record true but thin. The wrong lies in corrupting a shared object and in the cost of repairing it, not in the momentary effect on one hearer's beliefs. Is there anything in my vocabulary that a record could be — a public signal surviving across periods, a commitment constraining later equilibria, a belief that third parties treat as given? If the best you can do is identify the record with a receiver's posterior or with a downstream payoff, say so and say what that identification costs.

  Third, the residue report. Tell me which moves in the philosophical debate translated without loss; which translated only after you quietly added something to my framework — flag every such addition explicitly, and pay particular attention to places where the translation smuggles in welfarist evaluation, since the non-consequentialist side holds that the wrong of lying is not a matter of outcomes and a payoff-based translation may simply be blind to that claim; and which claims have no counterpart in the vocabulary at all. Then give me your view on what the residue indicates: is it a defect of the economic vocabulary, or evidence that the distinction philosophers defend is thinner or more context-dependent than it looks? One specific request within this: try representing the norm against lying as a restriction on the set of admissible signal structures rather than on payoffs, and tell me whether that restriction and the corresponding restriction against misleading have the same formal shape. I have a suspicion that one is a state-by-state constraint and the other a constraint on the structure taken as a whole, but I would rather you derived the answer than agreed with me.
reasoning: |-
  We are given a request from an economics student to translate a philosophical debate about the ethics of deception (lying vs. misleading) into the language of sender-receiver games, information design, and related concepts. The student is familiar with:

  - Sender-receiver games (cheap talk, costly signaling)
  - Verifiable disclosure (unraveling)
  - Information design: commitment to a stochastic map from states to signals, with obedience constraints, focusing on the distribution of posteriors.
  - Distinction between ex ante choice of signal structure and ex post deviation.
  - Off-path beliefs.

  The student asks for three things:

  1. Restate both sides of the debate (lying is morally distinctive vs. lying and misleading are morally equivalent) in terms of states, signals, constraints, payoffs.

  2. Formalize two concepts:
     (a) Falsity: How to represent a lie? What must be added to the model? Is it a translation or an import?
     (b) The record conjecture: The idea that lying corrupts a persistent record, while misleading leaves it true but sparse. Can we model a record? If not, what is the closest and what does it cost?

  3. Residue report: 
     - Which parts of the debate translated without loss?
     - Which required adding something to the framework? (Flag additions, especially if they smuggle in welfarism.)
     - Which have no counterpart?
     - Then, an assessment of the residue: is it a defect of the economic vocabulary or evidence that the distinction is thin/context-dependent?
     - Specifically, try representing the norm against lying as a restriction on admissible signal structures (vs. payoffs) and compare with a similar restriction against misleading. Are they the same formal shape?

  Let's break it down.

  ### 1. Restating the Debate

  **Philosophical Positions:**

  - **Pro-distinctiveness (PD):** Lying is morally worse than misleading because it violates a norm of assertion. When you lie, you assert something false. When you mislead, you do not assert the false thing; you might say something true but in a way that leads the listener to a false belief.

  - **Sceptical (S):** There is no moral difference. Both lying and misleading are attempts to cause a false belief, and the technique (direct lie vs. indirect misleading) does not change the moral status.

  **Translation into Economic Vocabulary:**

  We model a communication setting with:
  - State space: Ω (with typical state ω)
  - Sender (S) and Receiver (R)
  - Signal space: M (messages)

  In the most basic cheap talk model, messages are costless and their meaning is determined by the equilibrium. The sender's strategy is a mapping σ: Ω → Δ(M). The receiver's strategy is a mapping a: M → A (actions). The equilibrium must satisfy incentive compatibility.

  However, to capture the distinction between lying and misleading, we need to introduce the idea of what is asserted. In economics, we don't typically have an exogenous assignment of truth to messages. So we must add:

  - An exogenous truth-conditional content: Let there be a function φ: M → 2^Ω (each message m is associated with a set of states in which it is true). We can think of φ(m) as the proposition expressed by m.

  Now, we can define:

  - **Lying:** In state ω, the sender sends a message m such that ω ∉ φ(m) (i.e., the message is false in that state).

  - **Mere misleading:** In state ω, the sender sends a message m such that ω ∈ φ(m) (so the message is true) but the receiver, upon hearing m, takes an action that is not what the sender would want in state ω (or more generally, forms a belief that is false about some relevant aspect). Alternatively, we might say the sender sends a true message that is intended to lead the receiver to a false belief about some other matter.

  But note: in the philosophical debate, misleading does not require that the receiver ends up with a false belief about the exact proposition that the sender asserted. It might be about something else. However, the core is that the sender is being truthful about what they say but deceptive in the overall effect.

  **Restating PD Claim (Lying is Distinctive):**

  In the model with truth-conditional content φ, the PD claim is that there is a moral constraint that prohibits the sender from choosing a message m in state ω when ω ∉ φ(m). This constraint is not present for messages that are true but misleading. Moreover, this constraint is not justified by the payoffs but by a norm of assertion.

  In terms of the model, the PD claim is that the sender's strategy must satisfy: for every state ω, the message chosen (with positive probability) must be such that ω ∈ φ(m). This is a state-by-state constraint. The constraint does not apply to the overall signaling strategy in a way that allows false messages. The constraint is not about the outcome (the receiver's belief or action) but about the message itself.

  **Restating S Claim (No Moral Difference):**

  The sceptic claims that the moral status depends only on the outcome: the induced belief of the receiver and the resulting action. Therefore, the constraint should be on the effect of the communication. The sceptic would say that if two strategies (one that sometimes lies and one that only misleads) induce the same distribution over receiver beliefs and actions, then they are morally equivalent. The sceptic might also point out that in many cases, misleading can be just as harmful as lying.

  ### 2. Formalizing Falsity and the Record Conjecture

  **(a) Falsity:**

  To represent a lie, we must add an exogenous truth-conditional map φ: M → 2^Ω. Without this, messages are just labels and we cannot say that a message is false in a state. This is an import because in standard economic models (cheap talk, information design) the meaning of messages is endogenous to the equilibrium. 

  - In cheap talk, the same message might be sent in multiple states and we don't have an external notion of truth. 
  - In information design, the signal space is abstract and the state-to-signal mapping is chosen by the designer. Again, no external truth.

  Adding φ is an import because it is not part of the standard economic framework. It comes from the philosophy of language (semantics). Without φ, we cannot define a lie.

  **(b) The Record Conjecture:**

  The conjecture: The moral wrong of lying is that it corrupts a shared record. A lie inserts a false entry that persists and may be relied upon by others in the future. Misleading leaves the record true (but sparse) and does not corrupt it.

  In economic terms, what could a record be?

  - **Public Signal Surviving Across Periods:** We can model a dynamic game. Suppose there are multiple periods. In period 1, the sender sends a message that becomes part of a public history. In period 2, other players (or the same receiver) observe this history and act. The record is the public history of messages.

  - **Commitment Constraining Later Equilibria:** The record might be thought of as a public announcement that becomes common knowledge and affects the set of possible equilibria in future interactions.

  - **Belief that Third Parties Treat as Given:** The record might be a public signal that is treated as fixed and true by third parties (or the same party in the future) without re-evaluating its veracity.

  However, note: in the record conjecture, the wrong is in corrupting the record and the cost of repair. This cost might not be captured in the immediate payoffs.

  **Formalization Attempt:**

  Consider a two-period model.

  - Period 1: State ω1 is realized. Sender sends message m. Receiver takes action a1. The message m becomes part of the public record.

  - Period 2: Another state ω2 is realized (possibly correlated with ω1). The sender in period 2 (could be the same or a different agent) sends a message m2. The receiver (or a different one) takes action a2, and may condition on the record m from period 1.

  The record is m. If the sender in period 1 lied (sent m such that ω1 ∉ φ(m)), then in period 2, if the receiver (or a third party) relies on m being true, they might take an action that is suboptimal. Moreover, if the lie is discovered, there might be a cost to repair the record (e.g., retraction, loss of trust).

  But note: the record conjecture says that the lie is wrong because it corrupts the record. This cost might be separate from the immediate payoff. We might model:

  - The record m is stored and used in period 2. The expected payoff in period 2 might depend on whether m was true. Additionally, there might be a cost if the lie is discovered (a verification technology that might reveal the truth later, with some probability).

  However, in the standard economic model, we would incorporate these as future payoffs. The wrong of lying would then be because it leads to lower future payoffs (due to loss of trust, or suboptimal actions). But the record conjecture might be trying to capture something non-consequentialist: the intrinsic wrong of corrupting the record.

  If we try to model the record without dynamic payoffs, we might have:

  - The record as a public message that must be consistent with the state (a hard constraint). But that would be like a verifiability constraint.

  Alternatively, we might think of the record as a commitment to a particular history that constrains future play. But then the cost of a lie is that it forces the future play to be based on a false premise, leading to inefficiencies.

  **Closest in Vocabulary:** 

  We can model the record as a public signal that becomes part of the common knowledge and affects future games. The cost of a lie would be the expected loss in future payoffs due to the false record. But this is consequentialist. The non-consequentialist aspect (that it is intrinsically wrong to corrupt the record) does not have a natural home.

  If we model the record as the receiver's posterior, that is not persistent. The posterior is about the state and may be updated in the future with new information. So it doesn't persist in the same way.

  Thus, the best we can do is a dynamic model with future payoffs that depend on the message sent. The identification costs the non-consequentialist element: the intrinsic wrong is reduced to future welfare losses.

  ### 3. Residue Report

  **Translated Without Loss:**

  - The sceptical position (S) that the moral status depends only on the outcome (receiver's belief and action) translates well. We can represent the outcome by the induced posterior and the resulting action. If two strategies induce the same distribution over posteriors and actions, then they are equivalent in terms of outcomes.

  - The idea that lying and misleading are two techniques for inducing a particular belief is also captured: in the model with φ, lying is sending a false message, misleading is sending a true message that nonetheless induces a false belief (by exploiting the receiver's inference).

  **Translated with Additions:**

  - The truth-conditional map φ had to be added. This is an import from philosophy (semantics). Without it, we cannot define lying. This addition is necessary and not part of the standard economic framework.

  - For the record conjecture, we had to add a dynamic structure. More importantly, we had to assume that the record is used in future periods and that a lie causes future costs. This is a consequentialist interpretation of the record. The non-consequentialist idea that corrupting the record is intrinsically wrong does not translate. We have to represent it as a cost in the payoff function.

  **No Counterpart:**

  - The non-consequentialist claim that lying is intrinsically wrong, regardless of consequences, has no counterpart. In the economic framework, everything is evaluated by payoffs (which are consequences). If we try to model a constraint against lying, we can impose a restriction on strategies (no message m in state ω if ω ∉ φ(m)), but that restriction is not justified by payoffs. In the economic model, such a constraint would be exogenous and not derived from the incentives. The model itself does not provide a reason for the constraint.

  - The norm of assertion (that assertion is governed by a norm that requires truth) is not part of the economic framework. We can impose it as an exogenous constraint, but we cannot derive it from the standard setup.

  **Residue Indication:**

  The residue (the intrinsic wrong and the non-consequentialist element) indicates a limitation of the economic vocabulary. The economic framework is inherently consequentialist. It evaluates actions by their outcomes (payoffs). Therefore, any non-consequentialist moral constraint must be added exogenously. This does not necessarily mean that the philosophical distinction is thin or context-dependent; it might be that the economic framework is not equipped to capture intrinsic wrongs.

  **Specific Request: Representing the Norm as a Restriction on Signal Structures**

  We are asked to represent:

  - The norm against lying: a restriction on the set of admissible signal structures. Specifically, for every state ω, the signal structure must assign positive probability only to messages m for which ω ∈ φ(m). This is a state-by-state constraint. In information design terms: the stochastic map π: Ω → Δ(M) must satisfy that for every ω and every m in the support of π(ω), we have ω ∈ φ(m). This is a very strong constraint: it means that the signal structure must be such that every message sent in a state is true in that state. Note: this does not require that the message is fully revealing. It only requires that it is true.

  - The norm against misleading: what would that be? Misleading is about the effect of the communication. We might interpret a norm against misleading as requiring that the signal structure does not induce false beliefs. But note: in information design, the signal structure induces a distribution of posteriors. The receiver's posterior belief must be correct on average? That is not possible because the receiver's belief is a function of the signal. Alternatively, we might require that the signal structure is fully revealing? But that is too strong and not what misleading is about.

  Alternatively, we might interpret the norm against misleading as: the sender must not choose a signal structure that, for some state, leads the receiver to take an action that the sender knows is suboptimal for the receiver (or harmful). But that is already captured in the obedience constraint? Not exactly.

  Actually, there isn't a clear analogue for a restriction on signal structures that captures "no misleading" in the same way that we captured "no lying". Why? Because misleading is defined by the effect (inducing a false belief) and that effect depends on the receiver's inference. In the signal structure approach, we are committing to a mapping. The effect of a signal structure is the distribution of posteriors. To avoid misleading, we might require that the posterior beliefs are always true? That would require full revelation.

  But note: in the philosophical debate, misleading is allowed to happen as long as what is asserted is true. So the norm against misleading would not require full revelation. It might be that there is no direct constraint on the signal structure to avoid misleading. Instead, misleading is a matter of the sender's intention at the time of sending the message? But that is ex post.

  Alternatively, we might think of a norm against misleading as a constraint on the ex ante signal structure: the signal structure must be such that the receiver is not induced to have a false belief about a particular aspect. But this is vague.

  In contrast, the constraint against lying is straightforward: it is a constraint on the signal structure that for every state, only true messages are sent.

  Therefore, the two restrictions have different formal shapes:

  - Against lying: a constraint that must hold for every state and every message in the support (state-by-state).
  - Against misleading: if we try to formalize it, we might require that the signal structure does not induce a posterior that is false about a specific feature. But that would be a constraint on the induced posteriors (e.g., the posterior mean must equal the true state). However, that is not what misleading is. Misleading can occur even if the posterior is correct on average (if there are multiple dimensions and the sender is misleading about one). 

  Alternatively, we might say there is no direct constraint on the signal structure for misleading because misleading is defined by the sender's intent at the ex post stage. This points to a fundamental difference: lying is about the act (sending a false message) and can be constrained at the design stage (by restricting the signal structure). Misleading, however, is about the effect and the sender's ex post behavior. It cannot be directly constrained at the signal structure level without requiring full revelation.

  Therefore, the norm against lying is naturally a restriction on the signal structure (state-by-state), while the norm against misleading is either not representable as a restriction on the signal structure or requires a very strong constraint (like full revelation) to avoid any possibility of misleading.

  This difference in formal shape might reflect a deeper asymmetry: lying is about the relationship between the message and the state (which is captured by φ), while misleading is about the relationship between the message and the receiver's belief (which is endogenous to the equilibrium and the receiver's prior).

  ### Conclusion

  The translation reveals that the economic framework can capture the consequentialist aspects of the debate (especially the sceptical position) and the techniques of deception. However, it struggles with the non-consequentialist elements (the intrinsic wrong of lying) and the idea of a shared record (unless modeled dynamically with future payoffs). The residue suggests that the economic vocabulary is limited in its ability to capture intrinsic moral constraints and non-consequentialist reasoning. This is not necessarily a defect but a reflection of the framework's focus on outcomes and incentives.

  The record conjecture can be partially captured in a dynamic model, but the repair cost becomes a future payoff loss, which is consequentialist. The non-consequentialist claim about the intrinsic wrong of lying has no counterpart.

  Regarding the formal shape of the restrictions: the norm against lying is naturally a state-by-state constraint on the signal structure, while the norm against misleading does not have a straightforward representation as a constraint on the signal structure without requiring full revelation. This asymmetry may reflect that the two are not symmetric in the way the philosophical debate sometimes presents them.
answer: |-
  ### Restatement in Economic Vocabulary

  #### **First: Restating Both Sides**
  Assume a standard sender-receiver framework. The state space is \(\Omega\), with typical state \(\omega \in \Omega\). The sender (S) commits to a signal structure \(\pi: \Omega \rightarrow \Delta(\mathcal{M})\), where \(\mathcal{M}\) is the message space. The receiver (R) observes a message \(m \sim \pi(\omega)\) and takes an action \(a \in \mathcal{A}\), with payoffs \(u_S(\omega, a)\) and \(u_R(\omega, a)\). The receiver's strategy is obedient given their posterior beliefs, satisfying an obedience constraint. The key is the distribution of posteriors induced by \(\pi\).

  - **Pro-distinctiveness claim (lying is morally worse)**:  
    This position asserts that lying violates a deontic norm of assertion, independent of outcomes. To formalize, introduce an **exogenous truth-conditional map** \(\phi: \mathcal{M} \rightarrow 2^\Omega\), where \(\phi(m)\) is the set of states in which \(m\) is true. A **lie** occurs if, in state \(\omega\), S sends a message \(m\) such that \(\omega \notin \phi(m)\). Mere **misleading** occurs if S sends a true message (\(\omega \in \phi(m)\)) that induces a posterior belief leading R to take an action detrimental to R's welfare or contrary to S's perceived duty.  
    - *Formal claim*: The moral difference arises from a constraint on S's strategy. For lying, the constraint is **state-by-state**: in every \(\omega\), \(\pi(\omega)\) must assign positive probability only to \(m\) with \(\omega \in \phi(m)\). This constraint binds *ex post* (at the message-sending stage), even if violating it increases ex ante welfare. For misleading, no such constraint exists; it is permissible if it respects \(\phi\) state-by-state, even if it manipulates R's beliefs. The wrong in lying is violating the "truth-telling" constraint \(\omega \in \phi(m)\), regardless of induced posteriors or payoffs.  

  - **Sceptical claim (no moral difference)**:  
    This position rejects the moral relevance of the \(\phi\)-based constraint. The moral status depends **solely on outcomes**: the induced distribution of R's beliefs and actions, and their welfare consequences.  
    - *Formal claim*: Lying and misleading are equivalent if they induce the same distribution over R's posteriors. Specifically, two strategies \(\pi\) and \(\pi'\) are morally identical if they generate identical distributions of posteriors (and thus identical expected payoffs) for all priors. The sceptic denies that \(\phi\) adds moral content; it is merely a technical label. The only moral constraints are welfare-based (e.g., maximizing \(u_R\) or total surplus) or based on R's autonomy (e.g., R's obedience constraint ensuring no exploitation).  

  #### **Second: Formalizing Falsity and the Record Conjecture**  
  **(a) Falsity**:  
  To represent a lie, we must add an **exogenous truth-conditional map** \(\phi: \mathcal{M} \rightarrow 2^\Omega\). This defines "falsity" as sending \(m\) in \(\omega \notin \phi(m)\).  
  - **What is added**: \(\phi\) is a primitive, not derived from equilibrium. It requires that messages have pre-game semantic content (e.g., "message \(m_1\) means \(\omega \in E \subseteq \Omega\)").  
  - **Translation or import?** This is an **import** from philosophy/semantics. Standard economic models (cheap talk, information design) assign meaning endogenously via equilibrium. Adding \(\phi\) imposes an external structure, making truth/falsity a fixed property. Without it, lying is undefined.  

  **(b) Record Conjecture**:  
  Your conjecture: Lying corrupts a persistent "record," while misleading leaves it true but sparse. The moral wrong is polluting a shared resource, creating repair costs.  
  - **Formalization attempt**:  
    - **Setup**: Use a **dynamic game** with two periods. In \(t=1\), S sends \(m_1 \in \mathcal{M}\) after observing \(\omega_1\). \(m_1\) becomes a **public signal** added to the record \(R\). In \(t=2\), a new state \(\omega_2\) is realized (possibly correlated with \(\omega_1\)). S sends \(m_2\), and R takes action \(a_2\) conditional on \(R\) and \(m_2\). Payoffs include costs of record distortion.  
    - **Record as a public signal**: \(R\) is a public history, constraining future play. A lie (sending \(m_1\) with \(\omega_1 \notin \phi(m_1)\)) inserts false data into \(R\). This affects \(t=2\) beliefs/actions and may incur a cost \(c(\text{lie})\) if detected (e.g., via exogenous verification technology).  
    - **Record as a commitment device**: Treat \(R\) as a **publicly observable variable** that fixes part of the strategy space for future interactions. A lie corrupts \(R\), forcing later players to condition on false information, leading to welfare losses.  
  - **Best formal home**: The record \(R\) is a **publicly verifiable message** that becomes common knowledge and is treated as immutable for future belief formation. Repair costs enter payoffs as a penalty for inconsistency (e.g., if \(R\) is audited with probability \(\delta\), lying costs \(\delta \cdot k\)).  
  - **Cost of identification**:  
    - If \(R\) is reduced to R's posterior, it loses persistence (posteriors update).  
    - If repair costs are just payoff terms, the **non-consequentialist element** (intrinsic wrong of corruption) is lost. The model captures only welfare losses, not the deontic violation.  
    - **Conclusion**: The record can be modeled as a public signal with dynamic costs, but this reduces the moral distinction to expected utility differences, ignoring the intrinsic "pollution" claim.  

  #### **Third: Residue Report**  
  **Translated without loss**:  
  - The sceptic's core claim—moral equivalence under identical posterior distributions—translates perfectly. Welfare-based evaluation (e.g., comparing \(u_R\) or total surplus) is native to economics.  
  - The pro-distinctiveness focus on *technique* (lying vs. misleading) maps to differences in the sender's strategy under \(\phi\).  

  **Translated with additions (flagged explicitly)**:  
  - **Truth-conditional map (\(\phi\))**: Added exogenously. This imports semantic content, absent in standard models. It **smuggles in non-welfarist evaluation** by defining wrongness via \(\phi\)-violation, not payoffs.  
  - **Dynamic record with repair costs**: Added to model persistence. This **smuggles in welfarism** by framing the wrong as future costs, ignoring intrinsic corruption.  
  - **State-by-state constraint for lying**: Added as a restriction on \(\pi(\omega)\). This encodes deontology but is exogenous; it doesn't arise from incentives.  

  **No counterpart**:  
  - **Non-consequentialist wrong**: The claim that lying is intrinsically wrong (regardless of outcomes) has no economic analogue. Economics lacks a primitive for "duty" beyond constraints in payoffs.  
  - **Norm of assertion**: The idea that assertion inherently demands truth is untranslatable; messages in economics are strategic tools, not speech acts with built-in norms.  
  - **Blame for corruption**: The record conjecture's intrinsic "pollution" cost—without welfare effects—finds no home.  

  **What the residue indicates**:  
  - **Defect of economic vocabulary**: The residue (non-consequentialism, intrinsic duties) highlights economics' **consequentialist foundations**. Payoffs and beliefs cannot capture deontic constraints without ad hoc additions.  
  - **Evidence of thinness/context-dependence**: The untranslatable elements suggest the moral distinction relies on **non-strategic assumptions** (e.g., \(\phi\) as immutable, norms as primitive). In strategic settings, \(\phi\) is fragile: if meanings are endogenous (e.g., cheap talk), "lying" becomes equilibrium-dependent. The distinction may be thinner than it appears, relying on exogenous semantic structures.  

  **Specific Request: Norm as Restriction on Signal Structures**  
  Represent the norm against lying as a restriction on admissible \(\pi\):  
  - **Against lying**: \(\pi\) must satisfy \(\forall \omega, \, \text{supp}(\pi(\omega)) \subseteq \{m \mid \omega \in \phi(m)\}\). This is a **state-by-state constraint** (must hold for every \(\omega\)).  
  - **Against misleading**: No direct analogue. If "misleading" means inducing false beliefs, a restriction might require that \(\pi\) induces posteriors equal to the true state on relevant dimensions. But this is **global and posterior-based**: it constrains the overall distribution, not individual states (e.g., \(\mathbb{E}[\text{posterior}] = \omega\)). This often necessitates full revelation.  
  - **Formal shape difference**:  
    - Lying constraint: **Local** (per-state), easy to enforce ex ante.  
    - Misleading constraint: **Global** (over all states), often intractable without full revelation.  
  - **Derived conclusion**: Your suspicion is correct. The lying restriction is fundamentally state-wise, while the misleading restriction is posterior-based and holistic. This asymmetry may explain why philosophers treat lying as categorically distinct: it permits a local, verifiable constraint.  

  ### Summary  
  The economic vocabulary excels at capturing consequentialist and strategic aspects but struggles with deontic norms and intrinsic wrongs. Adding \(\phi\) and dynamics allows partial translation, but residues reveal either limitations in economics or context-dependence in the ethical distinction. Representing norms as constraints confirms that lying is modeled as a state-by-state violation, while misleading is not formally analogous, aligning with the pro-distinctiveness view. However, this formalization imports exogenous structure, suggesting the distinction may rely on non-strategic assumptions.
