prompt: |-
  I'm a novelist, four books in, and the one I'm plotting now follows a single family across three generations, 1930s to the present — and I keep catching myself smuggling in a claim about history going somewhere that I haven't earned. So before I outline any further I want the spec: write me the desiderata for a theory of history's directionality, the kind a novelist could honestly steer a plot by. Which cases does it have to get right — improvement in which nobody gets justice, justice that costs everyone everything, an arc that bends for sixty years and then snaps — which distinctions can it not collapse (moral progress vs. material improvement vs. mere narrative shape vs. actual providence), and what does it owe to the selection problem, given that I only get to write the chapters whose records survived? Mark which requirements are non-negotiable and which are just the prejudices of one camp or another, and flag any pair that can't be satisfied together, since that's the bit I'd definately build the book around. Skip scoring the existing views, I'll read those myself. British English please — my publisher's in London.
reasoning: |-
  Okay, the user is a novelist with four books published, working on a multi-generational family saga spanning from the 1930s to present day. They're struggling with implying historical directionality without proper foundation. They want a framework for understanding history's trajectory that feels honest to build their plot around, specifically requesting British English for their London publisher.

  The core request is for "desiderata" - essential criteria - for a theory of historical directionality that a novelist can authentically use. They need this before further outlining. Key concerns include: avoiding unearned claims about history's path, handling cases where progress is ambiguous (improvement without justice, costly justice, long arcs that break), maintaining crucial distinctions (moral vs material progress, narrative shape vs providence), and acknowledging the "selection problem" of surviving historical records.

  The user explicitly wants: non-negotiable requirements marked, ideological biases identified, and contradictions highlighted - especially those that could become central plot points. They're not asking for existing theories to be evaluated.

  Breaking this down: First, the novelist needs theoretical grounding to avoid simplistic historical trajectories in their multi-generational work. The family saga format inherently intersects with historical forces, so the framework must feel intellectually honest while serving narrative purposes. 

  The unspoken needs might include: wanting to avoid clichés about historical progress, needing structural integrity for their complex project, seeking permission to embrace ambiguity, and desiring tools to turn historical tensions into plot mechanics. As an experienced writer, they likely want subtlety over didacticism.

  For the desiderata, I'll need to cover several dimensions: First, epistemic constraints (how we know what we know about history), then ontological principles (what history actually is), followed by crucial distinctions that must be maintained, and finally specific test cases any theory must handle. The contradictions between requirements will be particularly valuable for their plotting.

  The selection problem is vital - historians and novelists both work with partial records, but novelists invent the gaps. This metafictional layer could be powerful. I should emphasize how each criterion serves both truthfulness and narrative utility.

  For the framework: Non-negotiables would include acknowledging contingency, rejecting teleology, and maintaining the material/moral distinction. Contestable elements might include weighting of different progress types. Key contradictions to flag would be between seeing patterns versus denying inherent direction, and between claiming moral progress versus accepting its fragility.

  British English considerations: Using "labour" not "labor", "plough" not "plow", prioritising UK spellings throughout while maintaining academic tone. Avoiding Americanisms in examples where possible.

  The most productive tensions for their novel would likely be: Pattern-seeking vs contingency (how families create meaning from chaos), moral progress reversibility (generational values clashes), and the selection problem's narrative implications (what family stories get preserved). These could drive plot and theme organically.
answer: |-
  Right then. Let's get this outlined properly. Crafting a novel spanning three generations demands an honest reckoning with history's shape – or lack thereof. Below are the **desiderata for a theory of historical directionality** fit for a novelist navigating the treacherous waters between 1930s and now. Crucially, these are the requirements your *theory within the narrative* must satisfy to feel earned, not necessarily a grand unified theory of everything.

  **Non-Negotiables (The Bedrock):**

  1.  **Contingency is Paramount:** The theory *must* fundamentally incorporate the role of chance, unintended consequences, and unpredictable human agency. History isn't a train on pre-laid tracks. (It must explain why the assassination *did* happen, why the peace talks *failed*, why *this* invention took off and not that one).
  2.  **No Inevitable Telos:** It *cannot* presuppose a predetermined endpoint (e.g., communism, liberal democracy, the Singularity). History goes *somewhere*, but that destination isn't foreordained by laws analogous to physics. The endpoint is always contingent on the messy journey.
  3.  **Distinguish Pattern from Providence:** It *must* rigorously separate observed *patterns* (e.g., technological accumulation, increasing interconnectedness) from any implication of divine plan, cosmic purpose, or inherent "meaning" written into the fabric of time. The pattern is observed *post hoc*, not prescribed.
  4.  **Material Base Acknowledged:** It *must* account for the fundamental role of material conditions (geography, resources, technology, disease, economics, climate) in shaping possibilities and constraints for human action. Ideas don't float free of the soil they grow in.
  5.  **Agency & Structure Dialectic:** It *must* hold the tension between individual/collective human agency and the overpowering weight of existing social, economic, and political structures. People make choices, but never in circumstances of their own choosing. Neither pure determinism nor pure voluntarism is tenable.
  6.  **The Selection Problem is Central:** The theory *must explicitly grapple* with the fact that our view of the past is constructed from fragments – the records that survived, the voices that were heard (or amplified), the events deemed significant *by later observers*. It must acknowledge that "history" is always a narrative built on a partial, curated, and often contested archive. *(This is crucial for your craft: you are literally performing this selection for your fictional family).*

  **Essential Distinctions (Must Not Collapse):**

  7.  **Moral Progress ≠ Material Improvement ≠ Narrative Shape:**
      *   **Moral Progress:** Changes in societal norms, values, laws, and institutions concerning justice, rights, equality, compassion (e.g., abolition of slavery, suffrage, human rights frameworks). *Highly contested, often reversible, unevenly applied.*
      *   **Material Improvement:** Tangible advances in technology, productivity, lifespan, health, material comfort, scientific understanding. *Often measurable, but distribution is key and progress can create new vulnerabilities.*
      *   **Narrative Shape:** The *imposition* of coherence – rise/fall, progress/decline, cycle – by the historian or storyteller *after the fact*. It's an interpretive lens, not an inherent property of events.
      *   **Actual Providence:** The belief in a divine or supernatural force directing events toward a specific, benevolent end. (Must be treated as a *character's belief* or *cultural force*, not the novel's implied truth).
      *   **The Theory Must:** Allow for these to move independently (e.g., material boom amid moral regression; moral aspiration amidst material scarcity) and explain *how* they interact (if at all) without conflating them. It must differentiate between describing a perceived narrative arc and claiming it reflects inherent progress.

  **Must Explain (The Test Cases You Mentioned):**

  8.  **"Improvement in which nobody gets justice":** How can societies develop materially or even institutionally while profound historical wrongs remain unaddressed, perpetrators unpunished, victims unrecognised? (e.g., post-war economic miracles built on unresolved trauma/exploitation). *Requires explaining progress that is real but partial, exclusive, or built on buried foundations.*
  9.  **"Justice that costs everyone everything":** How do moments of profound moral reckoning or revolutionary change often carry catastrophic costs – societal breakdown, economic ruin, immense suffering – even if the cause is "just"? (e.g., the cost of defeating fascism, the chaos of some revolutions). *Requires incorporating the destructive potential of change and the ambiguity of "justice".*
  10. **"An arc that bends for sixty years and then snaps":** How can long-term trends (e.g., towards social liberalism, globalisation, peace in a region) appear stable and directional, only to be dramatically reversed or shattered by unforeseen events, resurgent forces, or accumulated contradictions? (e.g., the interwar period, the end of the Cold War optimism, potential democratic backsliding). *Requires the theory to account for both accumulation/trends AND fragility/rupture. Contingency and unresolved tensions under the surface are key.*
  11. **The Asymmetry of Time:** Why does history seem to "accumulate" materially (technology, knowledge) but not necessarily morally or politically? We don't forget how to make steel, but we *can* forget or reject the lessons of Auschwitz or the Gulag. *Requires distinguishing types of change and their reversibility.*

  **Contestable Elements (Prejudices of Camps):**

  12. **The Primacy Driver:** What is the *primary* engine of directional change? Is it:
      *   *Material Forces (Technology/Economics):* (Marxist, some Tech-Determinist views)
      *   *Ideas/Culture:* (Hegelian, Idealist views)
      *   *Power/Conflict:* (Realist, some Nietzschean views)
      *   *Complex Systems/Evolution:* (Adaptation, emergence, no single driver)
      *   *This is where camps diverge. Your theory needs to lean somewhere, but acknowledging the debate is honest.*
  13. **The Weight of the Past:** How determinative *are* deep historical structures (institutions, mentalities, traumas)? Are we constantly breaking free, or are we fundamentally shaped by them? (e.g., Path Dependence vs. Revolutionary Change camps).
  14. **The Scale of Agency:** Does change primarily come from Great Individuals, Collective Movements, or Impersonal Forces? (Another classic camp divider).
  15. **The Definition & Inevitability of "Progress":** Is any form of progress (even just technological accumulation) *inherently* "good"? Is moral progress linear, cyclical, or illusory? *Strong claims here are ideological.*

  **Key Contradictions to Flag (Your Plot Engine):**

  *   **A. Pattern vs. Contingency:** The intense human *desire* to see patterns, arcs, and meaning (narrative shape) **vs.** the overwhelming evidence of accident, chaos, and the decisive impact of the unpredictable (Contingency - Non-Negotiable #1). *This is the core tension for your historian characters and your own plotting. How does the family narrative impose shape on chaos?*
  *   **B. Moral Progress vs. Fragility & Cost:** The aspiration and occasional reality of moral advancement (e.g., human rights) **vs.** its demonstrable reversibility, uneven application, and the terrifyingly high cost often associated with achieving or defending it (Test Cases #8 & #9). *This fuels generational conflict within the family – the idealist vs. the cynic, the one who paid the cost vs. the one who reaps the benefit.*
  *   **C. Accumulation vs. Rupture:** The tangible forward march of material/technical capacity (Non-Negotiable #4) **vs.** the persistent vulnerability of social, political, and moral orders to sudden collapse or regression (Test Case #10). *This defines the historical backdrop – periods of building punctuated by disaster.*
  *   **D. The Seen vs. The Unseen (Selection Problem):** The compelling narrative built from the surviving records, the dominant voices, the "official" history **vs.** the lost perspectives, the suppressed stories, the mundane realities that didn't make the archive (Non-Negotiable #6). *This is your novelist's superpower and burden. Which family secrets are kept? Which perspectives are silenced? What "history" does each generation inherit, and what is hidden?*

  **What it Owes the Selection Problem (For the Novelist):**

  Your theory *must* be self-aware. It must state that any perceived directionality is:
  *   **Constructed:** From the available, curated evidence.
  *   **Partial:** Inherently missing vast swathes of lived experience.
  *   **Perspectival:** Shaped by the concerns and biases of the selector (you, the novelist, or your historian characters).
  *   **Provisional:** Always subject to revision as new fragments surface or new questions are asked.

  **In Summary for Your Plotting:**

  Steer your generational saga by acknowledging history's *contingent* path, shaped by *material forces* and *human struggles*, leaving room for *both* genuine (but fragile) *moral/material gains* and catastrophic *ruptures*. Rigorously separate the *imposition* of a narrative arc from claims of inherent progress or providence. Most crucially, let the **Selection Problem** haunt your structure: show *which* family experiences entered the record and shaped the next generation's understanding of "how history goes," and which were buried, only to resurface and challenge that narrative. Build the book's tension around the **contradictions**, especially the clash between the human need for a meaningful arc (Pattern) and the brutal randomness of events (Contingency), and between the cost paid for progress by one generation and the often-unjust benefits (or lost justice) inherited by the next. Good luck – it's a magnificent scope. Mind the gaps in the record; that's where the real story breathes.
