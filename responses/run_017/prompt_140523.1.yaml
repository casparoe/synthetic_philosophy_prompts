prompt: |-
  I'm the grad-student rep on my institute's ethics committee, which mostly means I take the minutes, but this time I also have to draft the actual recommendation, and I'm stuck. The committee assigns every kind of animal or preparation a "protection tier" from 0 to 4, which determines what procedures need full review and how much justification has to be written up. Here's our track record, as far as I can reconstruct it from the minutes: typical adult human, 4; human infant, 4; an adult human with severe microcephaly (roughly a third of typical brain mass, profound cognitive impairment), 4, and the discussion was short; an anencephalic infant, 2 — the only time we've ever placed a human below 3, and the vote was 4–3, with the dissenters saying the tier system should just stop at the species line. Chimpanzee, 3; gorilla, 3, and someone explicitly wrote in the minutes that "we are not going to split hairs over grams," even though a gorilla brain is substantially bigger than a chimp's. Sperm whale, 2 — biggest brain on earth, no bump at all. African elephant, 2. Raven, 2, and African grey parrot, 2, both on behavioural grounds (tool use, flexible problem solving). Pig, 1. Mouse, 1. Zebrafish, 0. And a human-derived cerebral organoid with a few million neurons and no behaviour whatsoever, 0, with a line saying the species the cells came from is irrelevant. Oh, and dog, 2 versus pig, 1, which everyone privately admits is basically cultural, but nobody on the committee will reopen it.

  The new proposal is from a postdoc who wants to do aversive conditioning on common octopuses — mild shock they can learn to avoid by moving to a different compartment — plus some terminal surgery under anaesthesia afterwards to look at gene expression. The briefing she attached says an octopus brain is about half a gram, that she has around half a billion neurons but most of them are out in the arms with maybe 40–50 million in the central brain, that the body can run to several kilos, that they're solitary, semelparous and live a year or two, and that the evidence on flexible problem solving is good while anything like self-recognition is contested at best. (One caveat: the briefing also claims the sperm whale's cortex is thin and comparatively neuron-poor, and I've since been told that's disputed for at least some toothed whales, so please don't lean hard on that particular fact.)

  What I can't figure out is what rule we've actually been running, and I'd rather you tell me than have me invent one after the fact. As far as I can see the precedents are compatible with something like "absolute forebrain neuron count, with a floor for humans," with something like "behavioural capacities, with anatomy only as evidence and the human cases handled as a separate legal fact," and maybe with some brain-to-body-ratio thing that would explain why the whale and the elephant didn't move and the raven did — but those rules come apart on the octopus, and possibly come apart badly. So: what are the two or three rules that fit our verdicts, what does each predict for the octopus, what's your best guess for what this committee will actually do once I put it to a vote, and which of our old cases is the closest analog? I also want the honest version of what we'd be committing to either way — if we give the octopus a 2 on behaviour despite a half-gram brain, we've admitted size is only ever a proxy; if we give it a 1 because of the central neuron count, we've picked a specific anatomical currency and I'd like to know why that one. Last thing: my own candidate for the case that would settle it is one nobody's proposed — suppose we could swap an animal's neurons for functionally identical but physically bigger units, so the brain triples in volume, the neuron count doesn't change, and nothing about the animal's behaviour changes. If our rule says the tier goes up, we've been doing size-per-se the whole time. Tell me whether you buy that as the decisive test, or whether you've got a better one, and whether we should just stop using brain metrics altogether and switch to something behavioural (and what we'd lose if we did).
reasoning: |-
  Okay, let me try to work through this user's problem step by step. The user is a grad student on an ethics committee who has to draft a recommendation for octopus research based on inconsistent past decisions. 

  First, I need to understand the committee's track record. They've assigned protection tiers to various species: humans always get tier 4 regardless of brain size or cognition, while non-humans show puzzling patterns. Big-brained animals like sperm whales get lower tiers than smaller-brained but behaviorally complex ones like ravens. The dog/pig discrepancy suggests cultural bias. The human-derived organoid case explicitly rejects species-based consideration.

  The user is struggling to identify the implicit rules behind these decisions. Three possible frameworks come to mind: absolute neuron counts (with human exception), behavioral complexity (with anatomy as proxy), or brain-to-body ratio. But each framework conflicts with some precedents - neuron counts don't explain why whales are tier 2 while ravens are also 2 despite vastly different brains. Behavioral metrics struggle with the microcephalic human still getting tier 4.

  For the octopus proposal, the central conflict is between its small central brain (40-50M neurons) versus impressive behavioral flexibility. The user needs to predict how the committee might vote and identify the closest analog case. The raven (small brain, complex behavior, tier 2) seems most comparable, though the octopus's distributed nervous system adds complexity.

  The deeper issue is what the committee is truly valuing. The "neuron swap" thought experiment reveals this: if tripling brain size without behavioral change increases protection tier, then size itself is the metric. But the precedents suggest behavioral capacity matters more in practice, except for humans where species membership overrides all.

  Honestly, the committee seems to operate on inconsistent principles: strong human exceptionalism combined with case-by-case pragmatism for other species. For the octopus, they'll likely split between those prioritizing central neuron count (tier 1) and those emphasizing behavioral evidence (tier 2). The raven precedent favors tier 2, but the pig/dog inconsistency shows cultural factors may intrude.

  If recommending behavioral metrics, we lose objective measurability but gain ethical coherence. Sticking with anatomy preserves easier assessment but risks misaligning protection with actual capacity. The organoid case already set a precedent that biological origin doesn't matter - a principle that could extend to octopuses if consistently applied.

  The user's real challenge isn't finding a perfect rule - it's navigating a committee that wants both human exceptionalism and the appearance of objective metrics. The most honest path might be to surface this tension in the recommendation rather than hiding it.
answer: |-
  Based on your committee's precedents, there isn't a single, consistent rule. Instead, you're juggling several implicit (and sometimes conflicting) principles. Here's a breakdown of the plausible rules fitting your history, their predictions for the octopus, the likely committee outcome, and the deeper implications:

  ### Rule Candidates & Octopus Prediction
  1.  **"Human Exceptionalism + Behavioral Complexity Proxy":**
      *   **Rule:** All *Homo sapiens* get Tier 4 by default, regardless of anatomy or cognition (microcephaly, anencephaly inconsistency noted). For non-humans, Tier is primarily based on **demonstrated behavioral complexity** (tool use, problem-solving, social cognition), using brain size/anatomy only as *indirect evidence* when behavioral data is sparse or contested. Size alone isn't sufficient (whale, elephant).
      *   **Octopus Prediction (Tier 2):** Strong evidence of flexible problem-solving, complex learning (aversive conditioning is *itself* evidence of this), and unique distributed intelligence fits the behavioral complexity criterion used for ravens/parrots. Small central brain size is downplayed as a poor proxy in this specific case, much like whale size was downplayed.
      *   **Fits Precedents:** Explains raven/parrot (T2) > pig (T1) based on behavior; explains whale/elephant (T2) despite size due to recognized complex behavior; explains chimp/gorilla (T3) based on behavior (size explicitly ignored); explains anencephalic infant (T2) due to profound lack of behavioral potential.
      *   **Struggles With:** The *strength* of the human default (microcephaly still T4). The lack of a bump for whales/elephants vs. ravens – implies a behavioral "threshold" concept rather than a linear scale.

  2.  **"Absolute Central Neuron Count (with Human Floor & Behavioral Override for Low Counts?)":**
      *   **Rule:** Tier is primarily determined by the absolute number of neurons in the brain structures deemed most critical for complex cognition (likely the central brain/forebrain in vertebrates). Humans have a floor of T4 regardless. Very high behavioral complexity *might* justify a tier above what the raw neuron count suggests for non-humans (e.g., raven/parrot T2 with relatively low neuron counts vs. whale/elephant T2 with high counts).
      *   **Octopus Prediction (Tier 1 or possibly 2):** Central brain neuron count (40-50 million) is significantly lower than ravens/parrots (~200-300 million? Estimates vary, but generally 100s of millions), closer to a mouse (~70-100 million) or even below some birds. This points strongly to **Tier 1**. A T2 rating would require a strong "behavioral override" exception.
      *   **Fits Precedents:** Explains chimp/gorilla (T3 - high neuron count) vs. pig (T1 - lower count). Explains mouse (T1) vs. zebrafish (T0). Explains organoid (T0 - negligible neuron count). The whale/elephant T2 fits their high absolute neuron counts despite size. The raven/parrot T2 requires the "behavioral override" clause.
      *   **Struggles With:** Explicit "don't split hairs over grams" for chimp/gorilla contradicts strict neuron counting. Dog (T2) vs. Pig (T1) – if neuron counts are similar (they might be, pigs are cognitively complex), this undermines the rule unless cultural bias *is* the override. Anencephalic infant (T2) fits low neuron count, but microcephalic adult (T4) does not.

  3.  **"Phylogenetic Proximity + Behavioral Complexity (Implicit Chordate Bias)":**
      *   **Rule:** Humans are T4. Other mammals and birds get higher baseline consideration (T2-T3) due to shared vertebrate brain structures, adjusted up or down based on behavioral evidence. "Lower" vertebrates (fish) and invertebrates get lower baselines (T0-T1), with behavioral complexity only providing a modest bump within their category.
      *   **Octopus Prediction (Tier 1):** As a highly intelligent invertebrate, it falls into the "lower baseline" category. While impressive behavior might be acknowledged, the committee might be reluctant to grant it the same tier (T2) as complex vertebrates like ravens, dogs, elephants, or whales. Its closest *structural* analog might be seen as the organoid (T0) or zebrafish (T0), but its sentience pushes it to T1.
      *   **Fits Precedents:** Explains the vertebrate/invertebrate divide implicitly. Explains why complex fish (T0) are below simple mammals (T1). Explains the mammal/bird grouping at T2-T3. Explains organoid T0. Anencephalic infant T2 could fit as a severely impaired vertebrate.
      *   **Struggles With:** Explicit rejection of species relevance for organoids undermines this. Doesn't explain why whale/elephant aren't T3. Dog vs. Pig discrepancy is stark. Raven T2 fits, but doesn't explain *why* it's T2 vs. a less complex bird (if one existed).

  ### Prediction for Committee Vote & Closest Analog
  *   **Likely Outcome:** **Split Vote, Leaning Tier 2 (4-3 or 5-2)**, ultimately assigned **Tier 2**.
      *   **Arguments for T2:** "Behavioral complexity is king" faction will point strongly to the raven/parrot precedent. The octopus's learning capacity, problem-solving, and clear ability to experience aversion make it ethically comparable. The distributed nervous system argument will be used to downplay the small central brain count ("It's not a vertebrate model, stop applying vertebrate metrics!").
      *   **Arguments for T1:** "Anatomy defines potential" faction will fixate on the 40-50 million central neurons being orders of magnitude below whales/elephants/chimps and even below ravens/parrots/pigs. They might argue invertebrates deserve a lower baseline (implicit phylogeny) or that the central brain *must* be the locus of control/experience. They might cite the lack of evidence for self-recognition as a differentiator from T2 animals.
      *   **Cultural Bias Wildcard:** The dog (T2) vs. pig (T1) precedent looms large. Will affection for octopuses (as "charismatic invertebrates") sway votes like affection for dogs did? Or will invertebrate status push it down?
  *   **Closest Analog:** **The Raven/African Grey Parrot (Tier 2)**. This is the strongest precedent for granting a high tier to an animal with a relatively small brain but demonstrably complex, flexible cognition and learning abilities, overriding purely size-based arguments. The octopus proposal directly mirrors the type of cognitive evidence (learning, problem-solving) used to justify T2 for the birds.

  ### Honest Commitments & The "Neuron Swap" Test
  *   **Giving Octopus Tier 2:**
      *   **Commitment:** You are explicitly prioritizing **behavioral evidence of complex cognition and sentience (specifically the capacity to learn from aversion)** over absolute neuroanatomical metrics as the *primary* ethical currency for non-humans. You admit size/neuron count is only ever a *proxy* for these capacities, and a poor one when behavior demonstrates otherwise (as with ravens vs. whales, or octopuses vs. mice). The human T4 rule becomes even more starkly a species-based legal fiction.
      *   **Why that Currency?** Because ethical concern arises from the capacity to *experience* harm (sentience) and potentially from the complexity of that experience or the ability to anticipate/avoid harm. Behavior is the best window into this.
  *   **Giving Octopus Tier 1:**
      *   **Commitment:** You are prioritizing **a specific neuroanatomical feature (absolute central neuron count in a centralized brain)** as the primary, albeit imperfect, proxy for cognitive capacity deserving higher protection. You implicitly accept that invertebrates, or animals with decentralized nervous systems, have a lower ceiling for ethical consideration regardless of observed behavioral sophistication. You reinforce that vertebrate-like centralization is key.
      *   **Why that Currency?** A belief that subjective experience/consciousness/suffering requires a *critical mass* of integrated neural processing in a central command center. The central brain neuron count is seen as the best available correlate for this integrative capacity.

  *   **The "Neuron Swap" Test:**
      *   **You Should Buy It (Partly):** It's an excellent **conceptual test** to expose whether the committee is *actually* valuing size/neuron count *per se* or the functional capacity it enables.
      *   **Committee's Likely Failure:** Based on precedents, the committee would **absolutely bump the tier** for the swapped animal. The whale/elephant T2 (despite high counts) and raven T2 (despite low counts) show neuron count alone isn't sufficient or necessary. However, the *differential treatment* of whales vs. ravens/chimps shows size *is* a factor they consider, even if inconsistently. The human T4 default proves they value *something else entirely* (species) over functional capacity in that case. **The test decisively shows they are *not* consistently using functional capacity as the sole currency.** They are using a messy blend of anatomy-as-proxy, behavioral evidence, and human exceptionalism. The test highlights this inconsistency brilliantly.
      *   **A Better Test?** The neuron swap is strong. A complementary test: **"Behavioral Zombie"** – An animal with a huge, complex vertebrate brain (say, chimp-sized) but *provably* no subjective experience, sentience, or capacity to learn/feel pain (a perfect philosophical zombie). If the committee gives it T3, they are valuing anatomy over actual experiential capacity. (Spoiler: They probably would, due to the impossibility of proving the zombie state and the reliance on anatomy as a proxy).

  ### Recommendation: Moving Forward
  1.  **Acknowledge the Inconsistency:** In your draft recommendation, explicitly state the tension between the behavioral precedent (ravens/parrots) and the anatomical precedent (whale/elephant size not boosting tier) as applied to a novel invertebrate with decentralized intelligence.
  2.  **Propose Clarification (Long Term):** Strongly recommend the committee develops explicit, consistent criteria. **Switching to primarily behavioral metrics (capacity for learning, pain, fear, complex cognition) with anatomy as supporting evidence is the most ethically coherent path**, aligning protection with the capacity to be harmed. This minimizes the risk of under-protecting complex invertebrates or over-protecting large-but-simpler vertebrates.
  3.  **What You Lose by Switching:** Objective measurability. Brain metrics are easier to quantify than complex behavior. You gain ethical consistency but might face more debates about behavioral interpretations. The human exception becomes even more ethically stark and harder to justify intellectually (though likely remains politically necessary).
  4.  **For the Octopus Vote:** Frame the decision as choosing between following the *behavioral complexity* precedent (Raven T2) or the *vertebrate centralization/anatomical threshold* precedent that would suggest T1. Given the raven precedent and the clear evidence of aversive learning capacity, **recommend Tier 2**. Highlight the irrelevance of species origin for organoids as a precedent for focusing on the entity's *current* capacities, not its phylogenetic class.

  The core conflict is whether your committee believes an octopus's demonstrable capacity to learn from harm deserves the same ethical weight as a raven's or parrot's similar capacity, or whether the raven gets extra weight simply for being a vertebrate with a more familiar brain structure. The precedents point towards the former, but the unspoken biases might push towards the latter. Your job is to make that choice explicit.
