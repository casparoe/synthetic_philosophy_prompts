  hi — me and a mate have got a standing argument about Bell's theorem and I want something written down that I can argue against. Please write me an essay, about 1200–1500 words, fairly informal in tone, that tries to actually settle it.

  His position, as near as I can state it: Bell's theorem doesn't show that nature is non-local. What it shows is that you can't have all three of (i) locality, in the sense that what happens in one wing doesn't depend on what's going on in the other, (ii) statistical independence of the experimenters' settings from whatever the hidden variables were up to, and (iii) the assumption that each measurement has one and only one definite outcome. He's happy to drop (iii) — he's an Everettian — and he says that once you do, the step in the derivation where you write the joint probability as a sum over hidden variables of a product, P(A,B | x,y,λ) = P(A | x,λ) · P(B | y,λ), just doesn't go through, because there isn't a single A and a single B to take a joint probability of. So, he says: strictly local dynamics, everything branching, correlations come out fine, and the appearance of non-locality is an artefact of insisting on one world.

  I think there's something in this but I also think he's got off too lightly, and I can't locate exactly where. A few things I want done:

  1. Say precisely where the derivation breaks. In particular, separate the independence conditions — parameter independence, outcome independence, setting independence (the "no conspiracy" one) — and tell me which of them the branching move is really trading on. Is denying single outcomes best described as denying outcome independence, or as denying that the expression P(A,B | x,y,λ) is even well defined, or as something else again? I want the move named properly, not gestured at.

  2. Here's the bit I've made up, so you can't just rehearse the usual dialectic. The version of his view I want you to assess has two extra stipulations. First: branch weights are just the squared amplitudes, and an agent's uncertainty before she looks is ordinary self-locating uncertainty — she knows the global quantum state, she doesn't know which branch she's on, and her rational credence about her own result is the weight of the branches containing her. Call this the local-branching-plus-branch-weights package, LBW. Second: branching is a local affair. Alice's region branches when she measures, Bob's branches when he measures, and the two local branch structures only get welded into one global branch structure when the regions come into causal contact — when the experimenters compare notes by phone. Call that delayed soldering. Now: in LBW with delayed soldering, do the CHSH correlations get produced by anything a physicist would call a local process? My worry is that the soldering rule has to pair up Alice-branches with Bob-branches, and the pairing has to depend on both settings in exactly the way the quantum correlations do, so all the spookiness has just been relocated into the soldering step — or into the global amplitude field that fixes the weights in the first place, which was never a separable object to begin with. Is that relocation a real answer or a dodge? I want you to press hard on it.

  3. There's a prior question I keep getting stuck on: what does "local" mean here? No superluminal signalling, no action at a distance, separability of the beables, or something like Bell's own local causality condition? Say which of these the branching theory secures, which it doesn't, and then argue about whether the one it fails is the one Bell's argument was ever really about. If you think the whole debate is a fight about a word, say so and say which word.

  4. Comparision: is this exit structurally any different from the superdeterminist one, where you keep the dynamics local and pay for it by letting the hidden variables be correlated with the settings? Both look like "keep locality, pay somewhere else". If you think one is more respectable than the other, explain what makes the difference; if you think they're in the same boat, say that too.

  Then reach a verdict and defend it — no fence-sitting at the end. Is my mate right that an Everettian can walk out through the single-outcome door, or is he kidding himself?

  Two practical things: please don't give me citations or a reading list, I can look that stuff up myself and I'm after the arguments; and keep the maths light — write the factorisability condition down once if it helps, but no long derivations, I did philosophy not physics. And if you think the question is confused in some way I haven't noticed, I'd rather be told that than be given a tidy answer to a muddled question.
