answer: |-
  ## Dissertation Prospectus: The Reach of Genealogical Defeat in Evolutionary Debunking Arguments

  **1. Introduction and Core Question**
  My proposed dissertation project addresses a specific, underexplored challenge within the contemporary debate surrounding evolutionary debunking arguments (EDAs) against moral realism. EDAs typically leverage two claims: (1) a *genealogical claim* asserting that the causal origins of our moral beliefs can be fully explained by evolutionary pressures without needing to reference the truth of those beliefs; and (2) a *modal claim* asserting that had selective pressures differed, we would likely hold significantly different, yet subjectively compelling, moral beliefs, with no independent standpoint to verify our current beliefs’ accuracy. While extensive debate exists on whether combining these claims generates a universal defeater (threatening to also undermine logic, mathematics, or perception), and whether "third factor" explanations can reconcile genealogy with truth-tracking, I propose to sidestep these well-trodden paths. Instead, I will focus on what I term **the inheritance question**.

  The inheritance question arises when we grant the debunker’s genealogical and modal claims for a specific, narrow class of moral beliefs widely acknowledged to have a relatively clean evolutionary pedigree (e.g., intuitions favouring kin altruism, direct reciprocity within small groups, or incest aversion). The core question is: **Does any epistemic defeat generated by this evolutionary genealogy for these "basic" moral beliefs *transmit* to moral beliefs that lack any plausible direct evolutionary genealogy?** This latter class includes complex, culturally variable, or highly reflective moral judgments, such as beliefs about the moral significance of distant strangers, obligations to future generations, or counterintuitive verdicts in complex dilemmas (e.g., the permissibility of sacrificing one to save many in trolley cases). The significance of this question lies in its potential to determine the true scope and force of EDAs: does debunking merely prune some evolutionary roots, or does it poison the entire tree of moral judgment?

  **2. The Dialectic and Why the Inheritance Question Remains Open**
  The standard dialectic between realists and anti-realists leaves the inheritance question unresolved because it primarily engages with EDAs at the level of the basic beliefs themselves or attempts global defenses/attacks on moral belief as a whole. Realist strategies often involve either denying the completeness of the evolutionary explanation for *all* moral beliefs (arguing for irreducible rational elements) or proposing third-factor explanations linking evolutionary pressures to moral truth. Anti-realists counter by arguing the evolutionary story suffices to demonstrate widespread unreliability or that third-factor explanations fail. Crucially, both sides often tacitly assume that if the basic beliefs are defeated, defeat automatically extends to all moral beliefs derived from them, or conversely, that defending the basic beliefs secures the whole structure. This assumption about transmission remains largely unexamined. The inheritance question explicitly challenges this assumption, forcing a focus on the *mechanism and scope* of defeat transmission itself, a distinct issue from whether defeat attaches to the basic beliefs in the first place.

  Two starkly different answers to the inheritance question emerge:
  *   **The Isolationist Answer (No Transmission):** Defeat does *not* transmit to the "distal" beliefs. Reasoning from basic moral starting points is not a simple report of evolved intuition but involves significant rational extension, systematization, and critical reflection. The genealogy of the basic starting points does not reach these derived beliefs. Moral philosophy, on this view, is largely in the business of refining and building upon initial commitments using reasoning processes that can, in principle, correct for or transcend their biased origins. The debunker, therefore, only casts doubt on specific, parochial intuitions, not the entire edifice of moral judgment or our ability to reach justified moral conclusions about novel situations.
  *   **The Contamination Answer (Yes Transmission):** Defeat *does* transmit to all moral beliefs. All moral reasoning must ultimately bottom out in foundational commitments or intuitions. If these foundational elements are epistemically compromised due to their genealogy, then any structure built upon them inherits that compromise. The realist’s appeal to reasoning is, on this view, an attempt at "bootstrapping" – hoping a process inherently biased at its source can somehow generate unbiased results through reflection alone, a feat argued to be impossible. The entire practice of moral judgment is thus undermined at its foundations.

  **3. Method: Mapping Transmission Pathways**
  The obvious methodological approach would be a comprehensive, case-by-case analysis of various "distal" beliefs to determine if reasoning from "basic" beliefs reliably insulates them. I propose a more targeted and theoretically efficient alternative over the 12-month fellowship period:

  1.  **Conceptual Groundwork (Months 1-3):** Precisely define the mechanisms of "epistemic defeat" and "transmission" relevant to EDAs. Drawing on general epistemology, I will develop models of how defeat *could* transmit (e.g., via undermining the justificatory basis, introducing global doubt about the reasoning faculty, or showing dependence on tainted inputs) and what conditions would block transmission (e.g., robust rational insight at the derived level, independent justificatory grounds).
  2.  **Modeling Genealogical Structures (Months 4-6):** Construct idealized models of how moral beliefs might relate. This involves analyzing different potential structures: a "linear derivation" model (distal beliefs directly inferred from basic ones), a "coherentist web" model (mutual support), and a "modular input" model (basic intuitions provide data points processed by distinct reasoning mechanisms). I will assess the vulnerability of each model to defeat transmission.
  3.  **Incorporating the "Selection Target" Variable (Months 7-9):** Here I integrate the secondary complexity noted in my initial sketch: the nature of what evolution actually selected *for*. Did it select:
      *   **(C) Specific moral contents** (e.g., "care for kin")?
      *   **(D) A domain-general norm-uptake device** (a capacity to learn and internalize prevailing local norms, irrespective of specific content)?
      *   **(P) A capacity for socially tuned self-presentation** (where belief formation is primarily driven by social signaling needs)?

      I hypothesize that the strength and nature of the debunking threat—and critically, the *potential for transmission*—varies significantly depending on whether (C), (D), or (P) (or some combination) is the primary driver. For instance, if (D) or (P) dominate, beliefs might be tracking local social facts rather than being directly fitness-linked, potentially altering the debunking premise and its reach. This step tests whether my supervisor's reductionist worry holds (that it all boils down to reasoning correcting bias) or if the selection target introduces distinct structural considerations for transmission.
  4.  **Targeted Case Studies & Transmission Assessment (Months 10-12):** Apply the developed transmission models and selection-target analysis to 2-3 carefully chosen "distal" beliefs (e.g., strong obligations to anonymous future generations; the rejection of intuitive prohibitions in certain sacrificial dilemmas). The goal is not an exhaustive survey but to test the robustness of the transmission models against concrete, challenging examples and evaluate the impact of different selection targets.

  **4. Expected Deliverables and Contribution**
  By the end of the fellowship year, I aim to produce:
  *   A precise articulation of the "inheritance question" as a distinct problem within metanormative theory.
  *   A developed taxonomy of *how* epistemic defeat could transmit (or fail to transmit) from evolutionarily basic moral beliefs to distal ones.
  *   An analysis of how the postulated evolutionary "selection target" (content, device, or presentation) impacts the transmission mechanism and the scope of the debunking threat.
  *   A criterion for determining when a debunking argument *overreaches* by illegitimately assuming transmission occurs, or conversely, when defenses *underestimate* the risk of contamination.
  The primary contribution will be a nuanced framework for understanding the *reach* of EDAs. Rather than concluding EDAs either succeed or fail globally, this framework will identify *conditions* under which defeat transmits to distal beliefs and conditions under which it is contained, significantly refining the debate. This moves beyond simply cataloging intuitions to modeling the epistemic structure of moral belief formation and its vulnerability to genealogical critique.

  **5. Scope Management and Failure Conditions**
  The question's complexity means a comprehensive treatment within 12 months is impossible. I will manage scope by:
  1.  **Focusing Primarily on Transmission Mechanisms:** Prioritizing the development and analysis of transmission models over exhaustive case studies.
  2.  **Limiting Selection Target Analysis:** Initially focusing the selection target variable on its impact on transmission models, rather than engaging in deep empirical debates about which target is most plausible.
  3.  **Restricting Case Studies:** Selecting a small number (2-3) of high-impact "distal" belief types for analysis.

  An **honest failure condition** for the project would be if, upon rigorous analysis, the inheritance question proves to be entirely parasitic on the prior question of whether the evolutionary explanation is *independent* of the moral facts (the traditional "insensitivity" or "lack of correlation" worry). If it turns out that the transmission mechanism adds no significant new dimension and collapses directly back into the standard debate about the truth-tracking status of the basic beliefs themselves, the project's core novelty would be undermined. Success depends on establishing transmission as a distinct, analyzable problem.

  **6. Anticipated Committee Questions**
  *   **Question 1: Isn't this just the "companions in guilt" strategy with new labels?**
      *   *Response:* The companions-in-guilt strategy argues that if EDAs undermine morality, they also undermine beliefs we take as paradigmatically justified (logic, math, perception), implying EDAs are flawed. My project *grants* the debunker success against a specific class of moral beliefs and asks a subsequent, distinct question: *even if* those basic beliefs are defeated, does that defeat spread to *other kinds* of moral belief? It’s about the *internal scope* of debunking within the moral domain after a localized victory is conceded, not about finding analogous domains to challenge the EDA's initial force. The focus is on the structure of moral justification, not drawing parallels to other domains.
  *   **Question 2: What if the inheritance question just collapses back into the question of whether the debunker's explanation is independent of the moral facts?**
      *   *Response:* This is a central risk, acknowledged as a key failure condition. My strategy is to argue that the independence of the explanation for the *basic* beliefs is necessary but not sufficient to determine the epistemic status of *distal* beliefs. The transmission question concerns the *relationship* between the defeated basic beliefs and the distal beliefs. Even if the explanation for basic belief B is independent of its truth, whether the defeat of B necessarily defeats distal belief D depends on the justificatory connection between B and D – a separate epistemological issue. I aim to show that analyzing this connection (e.g., is D *based on* B? Is the reasoning *vulnerable* to the bias in B?) is a necessary and distinct step. If the analysis shows transmission always strictly tracks independence at the base, that itself is a significant (if disappointing) result about the structure of moral epistemology. The project rigorously tests whether this collapse occurs or if transmission introduces a new variable.
