prompt: |-
  For the past eight months I have been the newest trustee of the Cascade County Community Foundation. I took the seat somewhat reluctantly after my mother's death, when I found myself the executor of a bequest she had left the foundation, and I have been asked to draft the allocation memo for that money ahead of our June meeting. The bequest is $24 million, restricted by the donor's letter to use for "the lasting benefit of the residents of Cascade County."

  Three uses are on the table. Option A renews our Housing Stability Fund — direct cash and rental assistance — at roughly $4 million a year for six years. Its effects are well measured and, as far as anyone can tell, largely fade within a few years of the last payment. Option B commits about $20 million over fifteen years to a new Cascade Civic Trust, which would fund ballot-measure campaigns, redistricting-reform work, and local journalism; its measured effects are close to zero, and everything its advocates claim runs through political and institutional cascades that no one on the board can model with any confidence. Option C is to hold and invest the principal and revisit the question in 2029.

  The difficulty, which the board has been circling for two meetings without naming, is this: for A the long-run effects are probably small but positive; for B the long-run effects might be very large, and we have no way of telling whether they are large and good or large and bad. Our uncertainty about the distant effects is not a thin haze around a solid estimate — it swamps the estimate. Call that cluelessness if you like. Our program staff have proposed a procedural fix, the "sign-stability rule": commission three scenario models per option (baseline, cascade, backlash), and if the sign of an option's estimated net effect flips across them, declare the long-run term evidentially inert, drop it, and rank the options by effects measurable within ten years. Trustee Halvorsen has proposed an amendment: when the long-run term is inert in that sense, we should prefer the option with the widest spread of possible long-run outcomes, on the ground that a certain small gain is worth less in expectation than a small chance of a very large one, and cluelessness is a reason to seek variance, not to hide from it.

  Please draft the memo I will circulate to the other five trustees. It should: (1) open with a single sentence stating the recommendation; (2) commit to a concrete allocation with dollar figures and a timetable, including any checkpoints or conditions; (3) say whether we should adopt the sign-stability rule, Halvorsen's amendment, both, or neither as standing policy for future restricted bequests; (4) tell us how much weight reversibility deserves, given that any of the three can be halted at a three-year checkpoint but B's grantees would need eighteen months' notice; and (5) give the strongest version of the argument you are rejecting, stated well enough that its proponent would recognise it. Take a definite position rather than laying out the menu — where you think the underlying question is genuinely open, say so in a single closing sentence flagging which judgment your recommendation rests on.

  Please keep the whole memo under 700 words.
reasoning: |-
  Okay, let me approach this systematically. The user is a new trustee drafting an allocation memo for a $24M bequest, facing three complex options with different risk/reward profiles. The core tension is between measurable short-term impact and unpredictable long-term systemic change.

  Hmm, the sign-stability rule seems like an attempt to quantify the unquantifiable - modeling political cascades feels inherently speculative. Halvorsen's variance-seeking amendment is philosophically interesting but might incentivize reckless bets with public funds. 

  The reversibility point is crucial: Option B's 18-month wind-down creates a significant commitment asymmetry compared to the others. That alone might tilt the decision toward Option A's flexibility. 

  For the memo structure, I'll lead with a clear recommendation since the board needs decisive input. The "lasting benefit" mandate suggests rejecting pure preservation (Option C), while Option B's political entanglements conflict with foundations' typical apolitical stance. 

  The strongest counterargument to present would be Halvorsen's: that transformative change requires tolerance for uncertainty. But given the foundation's stewardship role, predictable housing aid seems more aligned with the donor's intent than funding ballot measures. 

  Word count discipline means cutting model details - focus on the $4M/year allocation mechanics and checkpoint provisions. The policy recommendation should reject both rules: sign-stability oversimplifies complex systems, while the variance amendment could encourage gambling. 

  Final judgment call: When clueless about long-term effects, default to measurable near-term impact. That closing line should resonate with trustees feeling overwhelmed by uncertainty.
answer: |-
  **To:** Cascade County Community Foundation Trustees  
  **From:** [Your Name], Trustee  
  **Date:** May 29, 2024  
  **Subject:** Recommendation for Allocation of $24M Restricted Bequest  

  **Recommendation:** I propose allocating the full $24M bequest to Option A (Housing Stability Fund) at $4M annually for six years, with three-year performance reviews and a commitment to reinvest any unspent annual funds or returns into the final disbursement cycle.  

  **Concrete Allocation & Timetable:**  
  1.  **Year 1-3 (2025-2027):** $4M disbursed annually to the Housing Stability Fund.  
  2.  **Checkpoint (Dec 2027):** Independent review of (a) funds utilization rate, (b) demonstrable household outcomes (eviction prevention, utility stability), and (c) county-wide housing cost trends. Board votes on continuation.  
  3.  **Year 4-6 (2028-2030):** $4M disbursed annually, adjusted + inflation if unspent funds/reinvestment exceed $12M after Year 3.  
  4.  **Final Review (Dec 2030):** Assess legacy impact; residual funds (<$1M) may fund one-time housing pilot projects.  

  **Policy Adoption:** **Reject both the sign-stability rule and Halvorsen’s amendment as standing policy.** The rule artificially truncates evaluation horizons in ways that may systematically undervalue institution-building, while the amendment’s "variance-seeking" conflates philanthropic duty with venture capital logic. Cluelessness demands caution, not gambling. Future restricted gifts should be evaluated case-by-case.  

  **Weight of Reversibility:** Reversibility deserves **significant weight**. Option A/C can pivot at 3 years with minimal disruption. Option B’s 18-month wind-down creates material sunk costs and reputational damage if halted mid-cycle, reducing effective optionality. Given profound uncertainty on B’s long-term effects, locking in irreversible commitments is inadvisable.  

  **Strongest Version of Rejected Argument (for Option B):**  
  *"Philanthropy’s highest calling is catalyzing transformative change, not subsidizing systemic failures. Option A’s transient aid, while measurable, is a Band-Aid on a hemorrhage; its ‘positive’ effects are dwarfed by the structural inequities perpetuating housing insecurity. Option B—though uncertain—aims to repair the broken civic machinery causing these failures. Political engagement, accountable districts, and robust journalism are the foundational institutions that enable lasting resident agency. Our cluelessness about long-term effects isn’t a flaw—it’s inherent in funding true innovation. Halvorsen is right: when models fail, we must embrace variance. A 5% chance of reshaping Cascade County’s future for generations justifies forgoing a guaranteed but fleeting relief. Avoiding this bet because we fear unintended consequences is a surrender to the status quo."*  

  **Closing Judgment:** This recommendation rests on the conviction that **when long-term effects are profoundly unknowable and potentially irreversible, measurable near-term impact for vulnerable residents must take precedence over speculative, high-variance systemic bets.**  

