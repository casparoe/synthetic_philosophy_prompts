answer: |-
  ### Maxwell's Demon Card Game: Rules and Payoffs
  **Materials per Pair:**  
  - 1 deck of 20 cards (10 red, 10 blue for Shift 1; 14 red, 6 blue for Shift 2).  
  - Work tokens (physical tokens or tally sheet).  
  - Tally sheet (grid of 20 boxes for recording).  
  - Eraser.  

  **Roles:**  
  - **Demon (Player A):** Runs the engine, extracts work, records data.  
  - **Preparer (Player B):** Builds the deck, pays to bias it.  

  ---

  ### Timeline (75 min)  
  1. **Intro & Setup (10 min):**  
     - Explain the Szilard engine: A single molecule in a box; knowing its position (red/blue half) lets you extract work by inserting a partition.  
     - Demons must record outcomes to "remember" where the molecule was, but erasing memory costs energy.  
     - Assign pairs: A (demon), B (preparer).  

  2. **Shift 1: 50/50 Deck (20 min)**  
     - **Preparer (B):** Builds a fair deck (10 red, 10 blue). Cost: 0 tokens.  
     - **Demon (A):**  
        - Draws a card, looks at it, "inserts partition" (places card face down).  
        - Collects 1 work token.  
        - Records the color in a tally sheet box (e.g., "R" or "B" — **1 mark per box**).  
     - Repeat ×20 rounds.  
     - **Erasure:** Demon erases all 20 marks. Cost: 1 token per mark (total 20 tokens).  
     - **Result:** 20 tokens earned - 20 tokens spent = **net zero**.  

  3. **Shift 2: Biased Deck (70/30) (25 min)**  
     - **Preparer (B):** Builds a biased deck (14 red, 6 blue). Cost: **2.4 tokens** (paid to "bank").  
     - **Demon (A):**  
        - Same as Shift 1, but **may compress the tally** (e.g., "RRB" → "2R1B" or use symbols/code).  
        - Still earns 1 token per round (total 20 tokens).  
     - **Erasure:** Demon erases the tally. Cost: 1 token per mark (e.g., "2R1B" = 3 marks).  
     - **Result:**  
       - Average compression: 14 reds (frequent) use short codes (e.g., "R" = 1 mark), 6 blues (rare) use longer codes (e.g., "B" = 2 marks).  
       - Expected marks: (14 × 1) + (6 × 2) = 26? **No!** Optimal coding averages **17.6 marks** (≈20 × entropy(0.7) = 20 × 0.88).  
       - Demon’s profit: 20 - 17.6 = **2.4 tokens**.  
       - Preparer’s cost: **2.4 tokens** (matches demon’s profit).  

  ---

  ### Debrief (20 min)  
  - **Key Moments:**  
    - Shift 1: Break-even shows **information erasure costs = work extracted** at equilibrium (50/50 = max entropy).  
    - Shift 2: Demon profits **because the deck was pre-ordered** (low entropy). Compression reduces erasure cost.  
  - **Physics Connection:**  
    - Demon’s profit (2.4 tokens) is **real work** from exploiting the biased deck.  
    - But preparer **paid 2.4 tokens to create the bias** (decrease entropy). Net system energy: **zero gain**.  
  - **Takeaway:** Information isn’t free fuel—**low entropy was paid for upfront**. This mirrors Landauer’s principle: Erasure cost saves the 2nd law.  

  ---

  ### Predictable Issues & Fixes  
  - **Refusal to record:** Emphasize recording is mandatory (demons must "remember" to reset).  
  - **Compression gaming:** Some may "overcompress" (e.g., tally entire deck as "14R6B" = 1 mark). **Rule:** Must record per-round outcomes (code must preserve sequence).  
  - **Physics gap:** The game can’t show **measurement cost** (demons see cards freely). State aloud: "Real demons pay to measure; here, focus on erasure."  

  **Numbers:**  
  - Deck size: 20 cards.  
  - Rounds: 20 per shift.  
  - Token prices: Work = 1 token/round. Erasure = 1 token/mark. Bias cost = 2.4 tokens (for 70/30 deck).  

  ---  
  **Why it works:** Students *feel* compression saving erasure costs and see profits vanish when accounting for preparation. The demon’s gain is real—but already bought by the preparer’s work.
