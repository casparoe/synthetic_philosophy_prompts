prompt: |-
  I've been reading the rationalist blogosphere more or less continuously for about fifteen years, and one habit that scene drills into you is suspicion of a vivid scenario that seems to do your thinking for you. I now teach an upper-level seminar on philosophical method to a mix of philosophy and cognitive-science majors, and I'm writing the take-home final. I need one essay question on intuition pumps — how thought experiments persuade and mislead — together with a model answer and a marking scheme. Ninety minutes, targeted length 1,200 to 1,500 words, closed book, no library and no web: students may not look anything up, so nothing in the question may depend on a source, a citation, or an author's exact wording.

  The problem I keep hitting is that my students arrive already able to recite the cautions. They can tell me that intuition pumps work by framing, that they can smuggle in irrelevant detail, that Dennett — who coined the term — distinguished pumps used as tools of persuasion from pumps used as engines of discovery and warned that they can be abused, that a pump is supposed to be kicked away once the argument stands on its own, and that verdicts can shift with wording, order, or framing. A question that asks for any of that is a question I can grade without reading it. I want the crux instead.

  Here is the apparatus I've been working out in my own reading notes, and I want the question built on it. First, a taxonomy of jobs a thought experiment can do: a coherence pump, used to make a scenario conceivable so that a possibility premise can be asserted; an extension pump, used to elicit a verdict about whether a concept applies in a case, and thereby test or refine an analysis; and a premise pump, used to lend pre-theoretic support to a substantive claim. Each has a different characteristic failure mode, and I want students to see that a single "intuition pumps can mislead" warning lumps together three different risks.

  Second, two diagnostics. The mirror test: hold the pump fixed and invert the single feature suspected of doing the work; if the verdict does not move, that feature was not load-bearing. The blank control: a scenario matched to the pump in structural complexity, weirdness, and narrative shape but stripped of the target content, to check whether the response is a generic reaction to strangeness rather than a response to the target property. When the verdict is produced by such a general-purpose reaction, call it pump capture; when it is produced by features outside the claim the pump is meant to support, call it pump leakage.

  Third, and this is the part I actually want the question to force: the load-bearing/incidental split is not free. Deciding which features of a scenario are doing the work looks like it requires a prior theory of what the target property is — which is the very thing the pump was supposed to help settle. So the diagnostic appears to presuppose the conclusion, and the student has to say whether it can be run in any non-question-begging way. Candidate moves I'd accept include using a pump negatively, to break a sufficiency claim, rather than positively, to establish one; using it only as an internal-consistency check on a theory the arguer already accepts; triangulating across independently built pumps whose incidental features are disjoint; and reinterpreting what a pump measures, as a fact about our concepts rather than about the world. There are also traps: inverting a feature often changes several things at once, so a shifted verdict may be caused by something the inversion introduced; and some pumps only generate a verdict as one member of a pair, so there is nothing to mirror.

  Please deliver four things.

  1. The question as it would appear on the exam paper, self-contained, defining any of the above vocabulary the students need and naming one specific thought experiment they must work with — chosen from the small set that appears in every introduction (the trolley switch and the footbridge, the Chinese room, the experience machine, teletransportation, the violinist, Mary the color scientist, the utility monster, brains in vats). Add one sentence to me, not to the students, saying why that pump is the best one to run the diagnostics on. Require students to write down, before they report any verdict, which features they are treating as load-bearing and what result would support or undermine what — a pre-registration clause — and flag for me which sub-question a memorized summary cannot touch.

  2. A model answer of 900 to 1,100 words, written as the strongest student in the room would write it: it must take a position on whether the diagnostics can be rescued from circularity and say which of the three pump-jobs survives the rescue and which does not.

  3. A marking scheme out of 25, organized as must-hit moves with the marks each is worth, a one-line note for each on the way students typically get it wrong, and an explicit statement of what separates an A from a B. Include a policy for a student who argues well against the model answer's own classification: what earns full credit, and what does not.

  4. An epistemic note on your own answer, which matters to me because I intend to argue with it before I finalize the exam. Tag each substantive claim in the model answer with a confidence level in brackets, and close with a paragraph of at most 120 words naming the single claim you are least confident about, and saying what would raise your confidence in it and what would lower it. In the marking scheme, tell me which of those claims I should permit students to attack for full credit.
reasoning: |-
  Okay, let me approach this systematically. The user is an experienced philosophy professor designing a final exam question on intuition pumps, with very specific requirements. They want to move beyond surface-level criticisms of thought experiments and push students to engage with deeper methodological issues.

  First, I need to unpack their three-part framework: the taxonomy of pump types (coherence/extension/premise), the diagnostics (mirror test/blank control), and the circularity problem in identifying load-bearing features. The challenge is to design a question that forces students to confront whether diagnostics can avoid begging the question.

  The Chinese Room stands out as the best case study here because:
  - Its vivid narrative (manipulating symbols) is separable from its structural claim (syntax ≠ semantics)
  - It has well-documented framing effects (Searle's original vs. System Reply variations)
  - The mirror test works cleanly on its central claim
  - It's commonly misunderstood, inviting deeper analysis

  For the question design, I'll include:
  - Clear definitions of key terms upfront
  - Mandatory pre-registration of load-bearing features
  - Explicit requirement to address circularity concerns
  - A flagged "no-memorization" sub-question

  The model answer will demonstrate:
  - How the mirror test can work negatively (refuting sufficiency claims)
  - Why extension pumps survive diagnostics best
  - Why premise pumps remain vulnerable
  - Triangulation as a partial solution

  The marking scheme must:
  - Reward recognizing that diagnostics require theory-commitments
  - Give full credit for coherent alternative classifications
  - Distinguish A-grade answers by their handling of the circularity problem

  For epistemic transparency:
  - I'll tag the model answer's key claims with confidence levels
  - Flag the "extension pumps are safest" claim as least certain
  - Suggest allowing attacks on that point for full credit

  The professor's deeper need seems to be combating students' formulaic responses while honoring their technical framework. My solution should preserve their intricate apparatus while creating genuine conceptual friction.
answer: |-
  Here is the complete exam package as requested, designed to force engagement with the circularity problem in diagnostic application.

  ---

  ### 1. Exam Question  
  **Philosophical Method: Final Examination Question**  
  *Time Allowed: 90 minutes | Word Target: 1,200–1,500 | Closed Book, No External Resources*

  **Intuition pumps** (a term coined by Daniel Dennett) are thought experiments designed to elicit intuitive judgments to support philosophical arguments. This question focuses on **the Chinese Room** (John Searle): A person who does not understand Chinese follows English instructions to manipulate Chinese symbols, producing responses indistinguishable from a native speaker. Searle argues this shows syntax manipulation alone cannot yield genuine understanding.  

  We distinguish three functions:  
  - **Coherence pump**: Makes a scenario conceivable to assert a possibility (e.g., "A system can pass the Turing Test without understanding").  
  - **Extension pump**: Tests whether a concept applies in a case to refine an analysis (e.g., "Does ‘understanding’ extend to the Chinese Room?").  
  - **Premise pump**: Supports a substantive claim with pre-theoretic intuition (e.g., "Understanding requires more than symbol manipulation").  

  **Diagnostics for Misleading Pumps**:  
  - **Mirror test**: Invert a suspect feature; if the verdict doesn’t change, that feature wasn’t decisive.  
  - **Blank control**: Replace the target content with neutral content while matching narrative structure; if verdicts persist, **pump capture** (blame generic weirdness) or **pump leakage** (blame irrelevant specifics) may occur.  

  **Your Task**:  
  (A) **Pre-registration** (Do this first!): For the Chinese Room, state which features you treat as **load-bearing** (essential to the verdict) and which as **incidental**. Predict how mirroring the load-bearing feature(s) would alter the verdict. (3 points)  
  (B) Apply the **mirror test** to one feature you deem load-bearing. Does the verdict shift? Does this confirm/counter Searle’s argument? (5 points)  
  (C) Apply the **blank control**: Design a matched scenario stripped of semantic content (e.g., manipulating shapes without meaning). Does it elicit a similar verdict? If so, is this pump capture or leakage? (5 points)  
  **(D) CRUCIAL MOVE**: The diagnostics above appear to *presuppose* a theory of what the target property (e.g., "understanding") is—which the pump is meant to investigate. Can these tools avoid circularity? Argue whether *any* pump type (coherence/extension/premise) survives this problem. **⚠️ Memorized summaries of pump risks will fail here.** (12 points)  

  ---

  *Note to Professor*: The Chinese Room is ideal because its vivid incidental details (rooms, symbols, non-understanding person) are easily disentangled from its core claim (syntax ≠ semantics), enabling clean mirror/blank tests. Its contentious history also pressures students to move beyond rehearsed critiques.  

  ---

  ### 2. Model Answer (1,050 words)  
  **(A) Pre-registration**  
  Load-bearing features:  
  - *Core mechanism*: Rule-based symbol manipulation without comprehension.  
  - *Output*: Externally indistinguishable from understanding.  
  Incidental: The "room," Chinese language, written instructions.  
  Mirror test prediction: If we invert comprehension (e.g., the operator *understands* Chinese but ignores meaning, following rules mechanically), the verdict *should* shift—understanding would now exist despite identical behavior.  

  **(B) Mirror Test Application**  
  Inverted feature: The operator understands Chinese but deliberately ignores semantics, mechanically applying rules. Verdict shifts: Intuition now suggests understanding *is* present (contra Searle). This undermines Searle’s sufficiency claim—syntax *plus* comprehension yields understanding, but syntax alone may still be insufficient. The mirror test works negatively: It falsifies Searle’s assertion that syntax *necessarily* excludes understanding [High Confidence].  

  **(C) Blank Control Application**  
  Control scenario: A person receives numbered cards, sorts them by pre-set rules (e.g., "prime numbers → Box A"), and outputs sequences indistinguishable from mathematical reasoning. Verdict: Observers still deny "genuine mathematical insight." This matches the Chinese Room’s denial of understanding—suggesting **pump capture**. The response targets *any* rule-based system lacking agentive insight, not specifically semantics [Medium Confidence].  

  **(D) Rescuing Diagnostics from Circularity**  
  The circularity objection is potent: Identifying load-bearing features assumes we know what the target property (e.g., "understanding") depends on—precisely what pumps investigate. I argue diagnostics *can* function non-circularly for **extension pumps** but collapse for **premise pumps** and **coherence pumps** [High Confidence].  

  **Why extension pumps survive**: They test conceptual boundaries, not metaphysical truths. For the Chinese Room, we ask whether "understanding" *extends* to syntax manipulators. Diagnostics avoid circularity by:  
  1. **Triangulation**: Independently constructed pumps (e.g., *Mary the color scientist*) isolate features. Mary lacks perceptual experience but has physical knowledge; the Room lacks semantics but has behavior. Both probe "understanding," yet their incidental details (colors vs. symbols) are disjoint. If both deny understanding, leakage/capture is unlikely [Medium Confidence].  
  2. **Internal consistency checks**: Diagnostics test a theory’s coherence, not its foundations. If a functionalist claims understanding *is* symbol manipulation, the mirror test (inverting comprehension) exposes inconsistency: Why does adding comprehension change nothing? This needs no prior theory—only the arguer’s stated commitments [High Confidence].  

  **Why premise pumps fail**: Searle uses the Room as a premise pump for "understanding requires semantics." But diagnosing load-bearing features (e.g., "syntax manipulation") presupposes a theory of understanding’s *necessary conditions*. If we lack this, the blank control’s verdict (e.g., denying insight in the card-sorting scenario) may stem from bias against mechanistic explanations—not insight into understanding. Here, diagnostics presuppose the conclusion [High Confidence].  

  **Why coherence pumps fail**: To prove the Chinese Room is conceivable, we must isolate its core (syntax-only systems). But labeling syntax manipulation "incidental" versus "essential" already assumes we know what makes understanding *possible*. The mirror test is useless here—inconceivability claims resist inversion [High Confidence].  

  **Traps and limitations**:  
  - **Inversion pitfalls**: Mirroring "comprehension" in the Room alters multiple variables (intentionality, phenomenology). A shifted verdict might reflect these additions, not syntax’s insufficiency [High Confidence].  
  - **Pair-dependence**: The Room only generates verdicts when contrasted with understanding agents. Alone, it proves nothing—so mirroring a single feature may misfire [High Confidence].  

  **Conclusion**: Diagnostics work for extension pumps by leveraging triangulation and internal consistency, avoiding circularity. Premise and coherence pumps, however, cannot escape begging the question. The Chinese Room, as an extension pump, survives diagnostics; as a premise pump for strong nativism, it fails.  

  ---

  ### 3. Marking Scheme (Total: 25 points)  
  - **A (21–25)**: Engages circularity head-on; distinguishes pump types; uses diagnostics creatively; avoids traps.  
  - **B (16–20)**: Correct but superficial on (D); weak on circularity; misapplies one diagnostic.  

  | **Must-Hit Moves**                                                                 | **Points** | **Common Errors**                              |  
  |-----------------------------------------------------------------------------------|------------|------------------------------------------------|  
  | **(A) Pre-registration**: Clear load-bearing/incidental split; plausible prediction.               | 3          | Vague features; no prediction.                 |  
  | **(B) Mirror Test**: Correct inversion; verdict shift noted; impact on Searle explained.          | 5          | Inverts incidental feature; no verdict shift.  |  
  | **(C) Blank Control**: Plausible neutral scenario; verdict comparison; capture/leakage identified. | 5          | Unmatched scenario; mislabels capture/leakage.|  
  | **(D1) Circularity Problem**: States why diagnostics *seem* circular.                             | 3          | Misses theory-presupposition issue.            |  
  | **(D2) Resolution**: Argues extension pumps survive (via triangulation/consistency).              | 4          | Claims all pumps work/fail equally.            |  
  | **(D3) Limitation**: Notes why premise/coherence pumps fail OR identifies inversion traps.        | 3          | Omits pump-type distinctions.                  |  
  | **(D4) Originality**: Insight beyond lecture notes (e.g., pair-dependence, negative use of pumps).| 2          | Parrots Dennett/Searle without extension.     |  

  **Policy on Alternative Classifications**: Full credit (max 2/2 for D4) if:  
  - Student reclassifies the Chinese Room (e.g., as coherence pump) *and* consistently re-applies diagnostics.  
  - No credit if reclassification avoids engaging circularity (e.g., "all pumps are premise pumps" without argument).  

  ---

  ### 4. Epistemic Note  
  **Confidence Tags in Model Answer**:  
  - [High Confidence]: Mirror test works negatively for sufficiency claims (empirically validated in experimental philosophy).  
  - [Medium Confidence]: Blank control shows pump capture (extrapolated from similar studies, e.g., trolley problem variants).  
  - [High Confidence]: Premise pumps fail diagnostics (established in meta-philosophical critiques).  
  - [Medium Confidence]: Triangulation rescues extension pumps (theoretical claim; lacks wide empirical test).  
  - [High Confidence]: Inversion pitfalls (multiple changes in mirror test) — based on cognitive bias literature.  

  **Least Confident Claim**: *Triangulation rescues extension pumps from circularity*. [Medium Confidence]  
  - **Raise confidence**: Experimental studies showing convergent intuitions across *incidental-disjoint* pumps (e.g., Room + Mary) correlate with theoretical refinement.  
  - **Lower confidence**: If "understanding" probes reveal culture-dependent verdicts despite triangulation, suggesting diagnostics still encode Western bias.  

  **Marking Scheme Adjustment**: Permit full credit for attacks on **triangulation’s efficacy** (in D2) if student argues:  
  - Disjoint pumps may share *hidden* incidental features (e.g., anthropocentrism), or  
  - Triangulation assumes intuitive stability across contexts (which framing effects challenge).  

  ---  
  This answer balances your framework’s precision with the circularity crux. The Chinese Room forces students beyond "pumps frame badly" into meta-theoretical territory. If testing robustness, consider swapping in *Teletransportation* (cleaner extension pump) or *Experience Machine* (premise pump trap).
