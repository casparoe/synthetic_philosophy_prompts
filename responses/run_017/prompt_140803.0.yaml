answer: |-
  ### Bottom Line
  **The art historian's objection that your "claim-bearing/answerability" framework ignores existing propaganda theory will hurt most; your reply turns on distinguishing Du Bois's unique concern with *artistic address* (how art positions its audience) from content-based definitions.**

  ---

  ### Prep Sheet: Ranked Objections & Replies  
  *(Ordered by Likelihood + Damage)*  

  #### **1. From MFA Students/Faculty (Likely & High Damage)**  
  *Objection*: "You're just rebranding didacticism. If every stance is propaganda, aren’t you policing how we write? Art dies when it’s forced to ‘leave room to refuse’—that’s censorship!"  
  *Reply (90s)*: "Du Bois isn’t dictating *what* you write but *how you engage your audience*. Art-for-art’s-sake assumes a public that already agrees with you—it’s a closed circle. Answerability forces that circle open: it’s the difference between shouting at allies and inviting a real conversation. Your freedom isn’t reduced; your audience’s is expanded."  
  *Soft Spot*: Doesn’t address fear of "forced" inclusivity. Concede some works *aim* for insularity—but Du Bois argues that’s still propaganda (for the status quo).  

  #### **2. From Locke-Sympathizing Scholar (Likely & High Damage)**  
  *Objection*: "Du Bois explicitly demands art that ‘pleads’ for racial justice. You’re softening his radicalism to rescue his novels! He meant *message*, not your ‘stance’ gymnastics."  
  *Reply (90s)*: "In ‘Criteria,’ he says ‘all Art is propaganda.’ If he meant only overt messages, why include *all art*? His novels *do* plead—but through narrative form, not speeches. When Esther in *The Quest of the Silver Fleece* is condemned by a withholding narrator until we question our own judgment—*that’s* propaganda as stance. Locke wanted art to transcend; Du Bois wanted it to transform through engagement."  
  *Soft Spot*: Risks downplaying Du Bois’s own political urgency. Stress his form *is* his radicalism.  

  #### **3. From Art Historian (Less Likely but Critical Damage)**  
  *Objection*: "Propaganda studies define it as intentional persuasion. Your ‘claim-bearing’ ignores intent, and ‘answerability’ is just ‘open-ended interpretation’—a standard feature of all art. Why reinvent the wheel?"  
  *Reply (90s)*: "Because Du Bois targets *artistic address*, not persuasion per se. A government poster *intends* to sway you. Du Bois asks: does the art *presume* a public it demands a response from? Answerability isn’t ‘open interpretation’—it’s structural room for refusal. Think of it as rhetorical ethics: if your work *demands* agreement (like most propaganda), it denies agency. If it allows ‘no’ (like Ellison’s Invisible Man), it’s claim-bearing."  
  *Soft Spot*: "Answerability" needs concrete formal markers (e.g., unreliable narration, ambiguity). Cite your novel’s technique as example.  

  #### **4. From Writers (Likely & Moderate Damage)**  
  *Objection*: "Sympathy isn’t propaganda! You’re conflating empathy with politics. Can’t a character just be *unlikeable* without it being a ‘claim’?"  
  *Reply (90s)*: "It’s about *how the narration* frames the character. If the narrator denies sympathy to a marginalized character while inviting sympathy for others, it’s making a claim about whose humanity deserves attention. In my novel, the indictment happens when the reader realizes *they* demanded sympathy only when the narrative ‘approved’ it. That’s not politics—it’s exposing unconscious bias through form."  
  *Soft Spot*: Assumes readers detect the withholding. Some won’t—and miss the "propaganda."  

  ---

  ### Strategic Concessions (State Early)  
  - **"Propaganda is a loaded term. Du Bois uses it provocatively—not to demand slogans, but to reject ‘neutral’ art as a myth."**  
  - **"Art-for-art’s-sake isn’t ‘bad.’ But Du Bois argues it *is* propaganda for the dominant culture’s assumptions."**  

  ### The Must-Land Reply  
  **"Du Bois’s genius is showing that *how* art addresses us is political. Propaganda isn’t the message—it’s refusing to let your audience be passive."**  
  *(If this fails, the thesis crumbles.)*  

  ### The Question You Hope Nobody Asks  
  **"How does answerability function in non-narrative art (e.g., abstract painting)? If it can’t, is your framework only for literature?"**  
  *(Why it’s dangerous:* Stretches your Du Bois-specific theory into untested territory. Hedge: "Du Bois centered stories, but visual art *can* ‘address’—e.g., Kara Walker’s silhouettes demand confrontation but leave meaning open.")*  

  ---

  ### Where You’re Wrong  
  **Answerability is under-defined.** You tie it to "room to refuse," but what formal techniques *create* it? Without clear examples beyond your novel, it risks sounding subjective. Prep 2 concrete examples from Du Bois/Cane/Hurston.
