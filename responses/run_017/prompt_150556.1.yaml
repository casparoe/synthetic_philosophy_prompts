  | **(h)** | Increase \(s^2\) for hidden correlations, lowering \(f\) | Yes (reduce exposure) |
  | **(i)** | \(f = \frac{0.04}{\sigma^2 + (0.04/2)^2} \approx 25\%\) of point-Kelly | Yes |

  ### When You’d Reject ARK
  - **(e)**: ARK doesn’t force insuring small risks. You’d need a separate "catastrophe avoidance" rule (e.g., "insure losses >X% of \(B_{\text{risk}}\) if premium is fair").  
  - **Aggressive growth seekers**: ARK is conservative in (b) and (c). If you crave maximum growth ignoring one-time risks, drop the one-time multiplier.  
  - **Pure theorists**: ARK prioritizes your instincts over mathematical purity (e.g., horizon adjustments).  

  ARK formalizes your intuition: **protect obligations, respect uncertainty, and bend growth rules for deadlines**. It’s a toolkit—adjust multipliers and caps to taste.
