  ### The Principle: Adaptive Risk-Bounded Kelly (ARK)

  **Core Idea**:  
  Bet a fraction of your **risk bankroll** that maximizes expected log utility, adjusted for **edge uncertainty**, **withdrawal obligations**, **horizon constraints**, and **correlation risks**. The risk bankroll is the portion of wealth not reserved for near-term non-negotiable expenses (e.g., rent). Edge uncertainty scales down bets; withdrawals and short horizons further reduce exposure. Correlation and background risks impose additional caps.

  **Formula**:  
  For a bet with estimated edge \(\mu\) (expected return per unit bet), variance \(\sigma^2\), and edge uncertainty \(s^2\) (variance of \(\mu\)), the fraction of your **risk bankroll** to bet is:  
  \[
  f = \text{clamp}\left( \frac{\mu}{\sigma^2 + s^2} \times m_{\text{horizon}} \times m_{\text{uncertainty}}, \ 0, \ f_{\text{max}} \right)
  \]  
  where:  
  - **Risk bankroll** \(B_{\text{risk}} = \max(0, B_{\text{current}} - W_{\text{next}})\).  
    - \(B_{\text{current}}\): Current liquid wealth.  
    - \(W_{\text{next}}\): Sum of withdrawals due before the next bankroll reset (e.g., monthly rent).  
  - **Edge uncertainty multiplier** \(m_{\text{uncertainty}} = \frac{\sigma^2}{\sigma^2 + s^2}\) (reduces bets when edge is ambiguous).  
  - **Horizon multiplier** \(m_{\text{horizon}}\):  
    - \(m_{\text{horizon}} = 1\) for repeated or open-ended bets.  
    - \(m_{\text{horizon}} = 0.25\) for **one-time** bets.  
    - For **goal-driven** bets (e.g., "I need $40k in 12 months"):  
      - If edge \(\mu > 0\): \(m_{\text{horizon}} = \min\left(1, \frac{\text{months}}{\text{12}}\right)\) (e.g., 6 months \(\rightarrow 0.5\)).  
      - If edge \(\mu \leq 0\): Bet full bankroll once if a win would achieve the goal.  
  - **Leverage cap** \(f_{\text{max}} = 5\) (500% of \(B_{\text{risk}}\)), but lowered for correlated bets.  
  - \(\text{clamp}(x, a, b)\): Restricts \(x\) to \([a, b]\).  

  ---

  ### Why Each Clause Exists (Your Verdicts That Forced It)
  1. **Risk bankroll (\(B_{\text{risk}} = B_{\text{current}} - W_{\text{next}}\))**  
     - Forced by: **(c)** (rent withdrawal reduces betting fraction; if bankroll halves, \(B_{\text{risk}}\) shrinks disproportionately).  
     - Collapse if removed: Your instinct that rent obligations lower risk tolerance (c) breaks. You’d overbet and risk missing rent.

  2. **Edge uncertainty multiplier (\(m_{\text{uncertainty}} = \frac{\sigma^2}{\sigma^2 + s^2}\))**  
     - Forced by: **(d)** (capping leverage on tiny-edge bets) and **(i)** (betting 25% of point-estimate Kelly when edge is ambiguous).  
     - Collapse if removed: You’d take absurd leverage in (d) or overbet on uncertain edges (i), ignoring model risk.

  3. **One-time horizon multiplier (\(m_{\text{horizon}} = 0.25\))**  
     - Forced by: **(b)** (betting 5% instead of 20% on a one-time all-wealth bet).  
     - Collapse if removed: You’d bet recklessly on singular events (b), ignoring psychological/practical ruin risk.

  4. **Goal-driven horizon multiplier (\(m_{\text{horizon}} = \min(1, \frac{\text{months}}{12})\) for \(\mu > 0\))**  
     - Forced by: **(g)** (with a positive edge, bet small and often to avoid blowing the deadline).  
     - Collapse if removed: You’d underbet or overbet, failing to balance growth with deadline constraints.

  5. **Full-bankroll bet for \(\mu \leq 0\) goals**  
     - Forced by: **(g-prime)** (betting big/rarely on negative-edge bets to "swing for the goal").  
     - Collapse if removed: You’d avoid negative-edge bets despite them being the only path to the goal.

  6. **Leverage cap (\(f_{\text{max}} = 5\))**  
     - Forced by: **(d)** (capping at 3–5x leverage on high-Kelly opportunities).  
     - Collapse if removed: You’d take unsustainable leverage in low-volatility bets (d).

  7. **Correlation risk (implicit cap via \(s^2\) or explicit \(f_{\text{max}}\) reduction)**  
     - Forced by: **(h)** (reducing exposure when bets share hidden factors).  
     - Collapse if removed: You’d overbet on seemingly independent bets with hidden correlations (h).

  ---

  ### Verdicts ARK Cannot Fully Accommodate
  - **(e)**: *Paying $60 to remove a 1% chance of a $5,000 loss.*  
    ARK doesn't explicitly model background risks (non-gambling losses). Your choice violates expected dollars (negative EV) and Kelly (no edge), but is rational due to ruin risk. To include this, ARK would need a "ruin aversion" clause for low-probability disasters.  
  - **(f)**: *Hedging/negative-EV diversification feeling like "free money".*  
    ARK endorses this if variance reduction boosts growth (Kelly supports hedging). But your intuition that it’s "free" even at zero EV isn’t captured—it’s a consequence of log utility, not a new rule.  

  **(b) and (g-prime) are kept**: ARK sacrifices the log rule’s myopia for (b) via the one-time multiplier, but retains growth-optimality for repeated bets. (g-prime) is handled by the goal-driven exception.

  ---

  ### Withdrawal Clause: Integrated or Bolted On?
  It’s **integrated**. Withdrawals define \(B_{\text{risk}}\), which is the foundation of all fraction calculations. Without it, ARK fails (c) and misallocates capital in (g). It’s not an external constraint—it reshapes the betting bankroll.

  ---

  ### Special Cases
  **1. Daily Bets, Monthly Rent**  
  - Subtract the **entire next rent** from \(B_{\text{current}}\) at the **start of the month** to get \(B_{\text{risk}}\).  
  - Use this \(B_{\text{risk}}\) for **all bets that month** (do not recompute per bet).  
  - *Why*: Your rent is a fixed liability due monthly. Bets during the month share this obligation, so \(B_{\text{risk}}\) is stable until rent is paid. Recomputing per bet would ignore the cumulative risk to the rent money.  

  **2. Backed Stake ("Half Winnings, No Losses")**  
  - **Fraction to bet**: Full Kelly fraction **on the backer’s bankroll**.  
    - If your best opportunity has edge \(\mu\), variance \(\sigma^2\), and uncertainty \(s^2\), bet \(f = \frac{\mu}{\sigma^2 + s^2}\) of the backer’s money.  
  - **Growth-rate reasoning**: Yes, but for **your share of the backer’s growth**.  
    - Your wealth growth is half the backer’s profit. Maximizing their growth (via Kelly) maximizes your long-term share. Betting less wastes their capital; betting more risks their ruin and future stakes.  
  - *Example*: A 60/40 coin flip (\(\mu = 0.2\), \(\sigma^2 = 0.96\)) with no uncertainty: Bet 20.8% of the backer’s bankroll.  

  ---

