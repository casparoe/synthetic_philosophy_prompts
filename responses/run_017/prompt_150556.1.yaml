  | **(c)** | \(f = 20.8\%\) of \(B_{\text{risk}}\) (e.g., 20.4% of \(B\) if rent = 2% of \(B\)) | Partial (you wanted a larger cut when bankroll halved; ARK gives 19.2% of new \(B\)) |
