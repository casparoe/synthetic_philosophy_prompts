prompt: |-
  I sit on our school board's Committee on Pluralism and Secularism — seven of us, three years of monthly meetings, and we've never once written down a principle, only decisions. We're in one of those jurisdictions where both traditions are pulling at once: the province has a secularism statute that binds people who work for the state, but the human rights code still obliges us to accommodate religion, and the two grind against each other at nearly every meeting. I've typed these up from memory so the dates and the order are probably a bit off, but the verdicts are right:

  - A student may wear a headscarf. A teacher may not wear one in front of her own class.
  - A student may wear a cross necklace. The big wooden crucifix that had hung in the main hallway since the fifties had to come down.
  - A Jewish student's exam that fell on a Saturday: we rescheduled it, no argument.
  - Daily halal meat in the cafeteria: refused. We required a genuinely adequate vegetarian alternative instead, and spent two meetings defining "genuinely adequate."
  - A Sikh boy's steel bangle: fine. A kirpan: refused, bladed object.
  - Year 9 girl excused from the partner-dance unit on modesty grounds: granted. Year 7 girl excused from swimming on modesty grounds: refused, but she may wear a full-coverage suit and we paid for one the first year. That pair still bothers me and I don't think we ever explained it.
  - An evangelical prayer group may use an empty classroom at lunch. It may not pray over the PA before exams.
  - The cafeteria is run by a private contractor. We put a clause in the contract saying their staff won't discuss religion with pupils, and then voted 4–3 that "we do not regulate the dress of staff we do not employ," with no reasons minuted.
  - A parent volunteer who wears a visible cross and comes in once a week to hear kids read: allowed, 4–3, "case by case," again no reasons.
  - Hindu parents objected to the yoga unit. We kept the yoga, dropped the Sanskrit posture names and the namaste at the end.

  Now the new one. There's a nonprofit homework club run out of a community centre — free, open to anybody, genuinely open, no proselytizing, parents sign a form saying so. It wants to run 3:15 to 5:30 in our library, and to keep using the school's sign-up sheets and the noticeboard, whose heading carries a short dedication to God. Three of its tutors: two women in headscarves, one man with a visible cross. And for the last fifteen minutes the tutors supervise kids in the schoolyard until parents show up, which is the part I keep getting stuck on — same people, same clothes, same property, but for a quarter of an hour they're doing something that looks a lot like what teachers do.

  My worry is that "the parents choose it" isn't the clean consent story it sounds like: this is the only free homework help in the neighbourhood, and for a lot of these kids the alternative is going home to an empty flat. One of our members keeps proposing a test — would a nine-year-old reasonably take this person to be speaking for the school? — and I can't tell whether that fits what we've already done or quietly overturns half of it.

  So: if we want to be consistent with ourselves, do we renew as is, renew with conditions, or decline? Which of our own precedents is the closest analogue, and what are the two or three rules that fit *everything* we've decided so far and then come apart on this one? What does each predict here, which one's your bet, and what would we be committing ourselves to either way? And what case should we put on next month's agenda, since we clearly won't say it out loud, to find out which rule we've actually been running?
reasoning: |-
  Okay, the user is part of a school board committee dealing with pluralism and secularism. They've shared a list of past decisions and are now facing a new dilemma about a homework club. Let me unpack this.

  First, the user's main request is about consistency. They need to decide whether to renew the homework club's access as is, with conditions, or decline it. They also want to know which precedents apply, the underlying rules, and what future case to test their principles. 

  Looking at their past decisions, there's a pattern. They allow personal religious expression (like headscarves on students, crosses on volunteers) but restrict it for staff in authoritative roles (teachers can't wear headscarves in class). The crucifix removal and halal refusal show they avoid endorsing religion institutionally. Accommodations are granted for individual practices (exam rescheduling, dance exemption) but not when it's about institutional support (daily halal). 

  The homework club presents a conflict. The tutors wear religious symbols and supervise kids, blurring the line between private and school-endorsed activity. The user is worried about implied authority, especially during supervision. The "clean consent" argument is shaky because it's the only free option, so parents might feel pressured. 

  Key precedents: the parent volunteer with a cross was allowed, but staff dress isn't regulated if not employed. However, supervision during those 15 minutes makes them seem like staff. The PA prayer was refused because it's school-endorsed, similar to the crucifix. 

  The core tension is between individual accommodation and institutional secularism. Rule 1: Personal expression is okay unless it implies school endorsement in an authoritative role. Rule 2: No institutional religious endorsement. Rule 3: Accommodate individuals, not groups. 

  For the homework club, Rule 1 leans toward allowing it, but supervision complicates it. Rule 2 might require removing the religious dedication on materials. Rule 3 is satisfied since it's an individual choice to attend. 

  The user should propose renewing with conditions: remove the religious dedication, clarify that tutors aren't school staff, maybe adjust supervision. Testing consistency could involve a case where a religious volunteer leads an activity during school hours, like coaching a team. 

  The user's deeper need is to establish clear principles to avoid arbitrary decisions. They need a framework that respects both secularism and accommodation, ensuring fairness without inconsistency.
answer: |-
  Based on your committee's established pattern and the inherent tension between institutional secularism and individual accommodation, here's a breakdown of the homework club dilemma and how to achieve consistency:

  1.  **The Core Conflict in the Homework Club Request:**
      *   **Institutional Space/Resources & Symbolism:** Using the library, sign-up sheets, noticeboard with a religious dedication, and schoolyard supervision makes the activity feel school-sanctioned.
      *   **Appearance of Authority:** The 15-minute supervision period *specifically* blurs the line between external volunteers and school authority figures. This is the crux.
      *   **Religious Symbols on "Quasi-Staff":** Tutors wearing religious symbols while performing a supervisory function mirrors the *teacher* headscarf prohibition concern (implied endorsement/authority).
      *   **Consent Nuance:** You rightly identify that "parental choice" is compromised by lack of alternatives, making the "clean consent" argument weak for implying school endorsement.

  2.  **Analyzing Precedents & Extracting Implicit Rules:**
      Looking at your decisions, three core, often conflicting, principles emerge:

      *   **Rule 1: Neutrality of State Authority/Institution:** The school itself, its employees in their official roles, and its permanent displays/systems must be religiously neutral.
          *   *Evidence:* Teacher headscarf ban, crucifix removal, refusal of PA prayer, regulating cafeteria staff speech (state contractor), keeping yoga secular (removing religious elements).
      *   **Rule 2: Accommodation of Individual Religious Practice:** Students, and sometimes non-staff individuals present *as individuals*, can manifest their faith unless it causes undue hardship or compromises safety/neutrality of authority.
          *   *Evidence:* Student headscarf/cross, exam rescheduling, kirikā (bangle), dance/swimming exemptions (even if inconsistently applied), allowing parent volunteer with cross, allowing prayer group as a *private* activity.
      *   **Rule 3: Institutional Non-Endorsement Overrides Group Requests:** The institution will not accommodate practices that appear to endorse a specific religion *as an institution*, even if requested by a group.
          *   *Evidence:* Refusal of daily halal (framed as institutional provision), refusal of kirpan (framed as institutional safety/weapons policy), removal of crucifix (institutional display).

  3.  **Applying the Rules to the Homework Club:**
      *   **Rule 1 (Neutrality of Institution/Authority) Predicts: DECLINE or STRICT CONDITIONS.** The religious dedication on the noticeboard violates institutional neutrality. Tutors wearing religious symbols *while performing a supervisory function on school property* mimics the banned teacher scenario, creating the appearance of state-endorsed religious authority. The use of core school resources (library, sign-up sheets, supervision) amplifies this.
      *   **Rule 2 (Accommodation of Individuals) Predicts: RENEW AS IS.** The tutors are individuals manifesting their faith (like the parent volunteer). Students/parents are choosing to attend the *private* club. The club itself is non-proselytizing and open. Accommodating their space use facilitates individual students' access to help.
      *   **Rule 3 (Non-Endorsement Over Group Requests) Predicts: RENEW WITH CONDITIONS.** The club is an external group. Allowing the *dedication on school materials* constitutes institutional endorsement. However, allowing the *activity itself*, if stripped of the school's explicit religious symbolism and potentially clarifying the tutors' non-staff status during supervision, avoids endorsing their *specific* religious practices.

  4.  **Which Rule Fits Best & Prediction:**
      *   **Best Fit:** **Rule 1 (Neutrality of State Authority/Institution)** most consistently explains your strictest precedents (teacher headscarf, crucifix, PA prayer, halal refusal as institutional provision). The supervision period is the critical factor pushing this towards Rule 1.
      *   **Bet:** **Renew with Strict Conditions.** Pure renewal ignores the supervision/authority issue. Pure decline ignores the accommodation for individuals accessing a service and the parent volunteer precedent. Conditions allow you to enforce institutional neutrality while permitting the activity.
      *   **Conditions Needed for Consistency:**
          *   **Remove the Religious Dedication:** The noticeboard heading *must* be secularized. This is non-negotiable under Rule 1 & 3 (crucifix, PA prayer precedent).
          *   **Clarify Status During Supervision:** The school must explicitly state (signs? verbal script?) that the tutors during the 15-minute supervision are NOT school staff or representatives. They are volunteers from the external homework club. Address the "reasonable nine-year-old" test head-on.
          *   **Reinforce Non-Representation:** The contract/agreement should explicitly state that tutors do not represent the school's views and that their religious attire/symbols are personal, not endorsed by the school (echoing cafeteria staff speech rule, applied to appearance in a quasi-supervisory role).
      *   **Commitments:**
          *   *Renewing with Conditions:* Commits to allowing external religious groups to use facilities *only* if all explicit religious association is removed from *school* materials and if steps are taken to prevent any misperception that they are agents of the state/school, especially during functions resembling staff duties. It leans heavily on Rule 1.
          *   *Declining:* Would firmly commit to Rule 1 being paramount, potentially limiting external religious groups' access if their activities involve any interaction that could be construed as authoritative or if they require use of school identity/material. Weakens the parent volunteer precedent.
          *   *Renewing As-Is:* Would significantly undermine Rule 1 (teacher headscarf, institutional symbols) and Rule 3 (halal), implying that institutional neutrality is secondary to facilitating external religious groups using school resources with their own religious identifiers present during supervisory-like activities.

  5.  **The Test Case for Next Month (To Reveal the Unspoken Rule):**
      You need a case that isolates the "appearance of state religious authority" vs. "individual accommodation in a non-authoritative role" tension, *without* the complicating factor of an external group using resources.

      *   **Proposed Test Case:** **A religious leader (e.g., Imam, Priest, Rabbi) who is also a qualified and DBS-checked (background checked) volunteer wishes to coach the school's chess club or lead a non-religious art club *during lunchtime or after school*.** They would wear their religious attire (clerical collar, kippah, headscarf, etc.). Participation is optional for students, requires parental consent, and the activity is purely secular chess/art.
      *   **Why it Tests the Unspoken Rule:**
          *   *Mirrors Teacher/Authority Issue:* They are leading an organized activity, potentially in a position of minor authority/leadership over students, wearing religious attire.
          *   *Removes External Group/Resource Complexity:* They are an individual volunteer, not representing an external organization using dedicated school materials. Focuses purely on the person + role + symbol.
          *   *Contrasts with Parent Volunteer:* The parent was listening to reading, a more passive, 1-to-1 activity. Coaching/leading a club is more active and group-oriented, closer to teaching.
          *   *Forces the Committee to Decide:* Is the prohibition on visible religious symbols fundamentally about *employment status* (teacher = employee = ban), about *any position of perceived authority* (volunteer coach = perceived authority = ban?), or purely about *institutional displays* (volunteer coach = individual = allowed, like parent reader)? This directly challenges the inconsistency in the parent volunteer vs. teacher decisions and prefigures the homework club supervision dilemma.

  **Conclusion:** To be consistent with your strongest precedents (especially the teacher headscarf ban and crucifix removal), you must prioritize **Rule 1 (Institutional Neutrality of Authority)**. This means you likely cannot permit the homework club **as-is** due to the religious dedication on school materials and the tutors wearing religious symbols *while performing a schoolyard supervision function*. **Renewal with strict conditions** (remove dedication, clarify non-staff status during supervision, reinforce non-representation) is the most consistent path, preserving access while safeguarding institutional neutrality. **Declining** would be a stricter but still defensible interpretation of Rule 1. Propose the **religious leader as secular club volunteer** case for next month to force clarity on the core "authority + symbol" principle underlying your toughest decisions. This will reveal whether your unspoken rule is truly about employment status or the perception of state religious authority.
