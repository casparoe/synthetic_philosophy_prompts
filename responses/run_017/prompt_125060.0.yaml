prompt: |-
  I'm writing a short paper on moral worth for a seminar — the rough idea being that whether an action has moral worth depends on the considerations the agent acts on rather than on what the action brings about — and before I read any of the secondary literature I've been writing down my own gut verdicts on cases, to see whether anything coherent comes out. I don't need citations or a reading list; I want the principle. My verdicts, stated as strongly as I feel them: a hospital pharmacist who double-checks every dosage because a malpractice suit would end her career and because the hospital audits errors — right act, no moral worth. The same pharmacist fifteen years later, long after the audits stopped, who double-checks because she can't bear the thought of a patient being hurt and would feel wretched for weeks otherwise — full moral worth; she seems to be acting on exactly the features that make the act right. A man named Dev who returns a dropped wallet because his sister, whose judgment he trustingly defers on moral matters, told him that's what decent people do; he doesn't see the point himself, though he reflectively trusts her and would defend the deference — I say no moral worth, or at most what I've been calling *borrowed credit*. A woman who, after a stroke, finds she has an overpowering urge to return lost property, is initially alarmed by it, then reflects and wholeheartedly endorses it as the right way to live — I lean toward yes, but noticeably less than the second pharmacist. Someone who donates a kidney to a stranger while falsely believing the recipient is a distant cousin, and who would have donated anyway out of general benevolence had he known the truth — I want to say no moral worth, since his actual operative reason was partiality to kin, but the fact that the right reason was sitting right there and would have moved him makes me reluctant, and I can't tell whether that reluctance is sentimental. Two people who do the right thing from both duty and enjoyment and who would still have done it from duty alone — full moral worth in both; the extra enjoyment doesn't seem to contaminate anything. And finally a shop assistant who returns a wallet purely because store policy requires it and she is a stickler for whatever policy is in force, where the policy happens to coincide exactly with what morality requires — no moral worth, and that verdict I feel most confident of.

  The principle I've been playing with has two clauses: an act has moral worth iff the agent acts *because of* the features that actually make the act right, and she would still have acted on those features if every other motive of hers had fallen away — I've been calling the second the independence condition. But my cases seem to pull it apart. The stroke patient fails independence, I think, since the urge is doing the motivational work and would keep doing it even if its object were worthless, and yet I don't want to deny her worth outright; so maybe what matters is not where the motive came from but whether she reflectively endorses it. The trouble is that Dev endorses too, in his own deferential way, and I still want to withhold worth from him, which makes me suspect that endorsement does the work only when it is endorsement of the right-making features themselves and not merely of a person or a rule that reliably tracks them — and if that is the repair, I can't see why it doesn't also rescue the policy-following assistant, whom I most want to exclude. That is the pair I keep going back and forth on: Dev and the stroke patient feel structurally identical to me and I judge them differently, and I'd rather be told which verdict to drop than be handed a clause that saves both by being gerrymandered to them.

  So: is there one principle — or a short list of serious candidates, stated precisely enough that I could apply them myself — that gets these verdicts, and if not, which of them do you think I should overturn and why? For each clause you propose, I'd like to know which case motivates it. I'd also like the principle's verdicts on cases I haven't listed: the same agent acting rightly for the right reason but so near the edge of her self-control that she would very likely have failed had the temptation been somewhat stronger; an agent who does the right thing for the right reason but is wrong about what makes it right (she returns the wallet because she thinks generosity is commanded by a God she takes to exist, and it isn't); a robot or software system trained to treat patients gently, which has no felt reasons at all but responds reliably to the right features; and a committee that reaches the right decision where no individual member acted on the right reason but the aggregation procedure reliably tracks it. And one last thing I can't settle: my verdicts above came in degrees — the stroke patient less than the veteran pharmacist, Dev somewhere above the policy-follower but below both — so I'd like to know whether the right account makes worth scalar, or whether it treats worth as all-or-nothing and explains my degree talk as something else, such as praiseworthiness or credit, wearing moral worth's clothing.
reasoning: |-
  Okay, the user is working on a paper about moral worth, specifically whether an action's moral worth depends on the reasons behind it rather than the outcome. They've listed several thought experiments and their intuitive judgments about each. Now they're trying to find a principle that explains these judgments consistently. 

  First, I need to understand their core dilemma. They proposed a principle with two conditions: acting because of the right-making features, and those reasons being motivationally independent. But their cases challenge this. The stroke victim seems to pass the first condition but fails independence because her urge persists regardless of the act's value. Yet they feel she has some moral worth. Conversely, Dev endorses his sister's judgment but they deny him moral worth. The shop assistant following policy is clearly denied moral worth, but if they adjust the principle to require endorsement of the right-making features themselves, why doesn't that save the assistant too?

  Hmm, the key tension is between Dev and the stroke patient. The user judges them differently but admits the cases feel structurally similar. They'd rather be told which verdict to drop than force a principle that accommodates both artificially. That's a good sign—they're prioritizing theoretical coherence over saving every intuition.

  Looking at their other cases: the pharmacist who acts from fear of lawsuits vs. later acting from concern for patients shows the classic motive shift. The kidney donor acting on false kinship beliefs highlights the difference between actual vs. potential motives. The dual-motive cases suggest that added enjoyment doesn't diminish worth if duty alone would suffice. 

  For unlisted cases: the "near-edge" agent might test stability of motivation; the God-believer introduces epistemic error; the robot raises questions about non-conscious agents; the committee probes collective agency. The scalar verdicts (stroke patient < pharmacist) suggest worth might be gradable, but perhaps that's actually about credit, not worth proper.

  I think the user's core insight is that moral worth requires the agent's reason to be constitutively connected to the right-making features. But their independence condition is too strong because it excludes cases where the motive is psychologically ingrained (like the stroke victim) even when endorsed. The fix isn't about the motive's origin but whether it functionally represents the moral reality. 

  For Dev: his reason is "sister says so," not the features themselves. The stroke victim's urge is a direct sensitivity to those features, even if acquired abnormally. The policy-follower acts on policy, not moral features. This explains why Dev and the assistant fail while the stroke victim passes weakly. 

  I should propose a principle based on grounding: the agent must act on the right-making features as such. Then explain how it handles each case. For scalar intuitions, suggest that worth is binary (either you act on the right features or not), but praiseworthiness can be gradable based on how robustly or stably the motive is held.

  The user is clearly philosophically sophisticated—testing intuitions before literature, comfortable with edge cases, aware of sentiment's distorting potential. Their frustration with Dev/stroke inconsistency shows good self-critique. They'd prefer principled coherence over saving every judgment, which is excellent. The depth of their examples suggests they're ready for a nuanced solution.
answer: |-
  Based on your deeply considered intuitions and the tensions you've identified, here’s a principle that captures most of your verdicts while resolving the Dev/stroke conflict by prioritizing *why* the agent acts, not just *that* they act rightly:

  **The Grounding Principle:**  
  An act has moral worth iff the agent acts *because* they take the right-making features (RMFs) themselves to count decisively in favor of the act, and these RMFs ground their motivating reason(s).

  ### Key Components & Motivations
  1.  **"Because they take the RMFs themselves to count decisively..."**  
      *   *Motivation:* Explains why Dev and the policy-follower fail. Dev acts because his *sister* counts it decisive, not because the RMFs (e.g., property rights, preventing harm) count decisively. The assistant acts because *policy* counts it decisive, not the RMFs. Their reasons are grounded in external authorities, not the moral features.  
      *   *Saves:* The veteran pharmacist (she directly takes patient welfare as decisive). The dual-motive agents (they take the RMFs as decisive, even with added enjoyment). The kidney donor *fails* (he takes "kin relationship" as decisive, not the RMFs of saving a life/alleviating suffering, even though benevolence lurks).

  2.  **"...and these RMFs ground their motivating reason(s)."**  
      *   *Motivation:* Explains the stroke patient vs. Dev. Both endorse, but the stroke patient's overpowering urge is *itself responsive to and constituted by* the RMFs (returning property feels compelling *because* it's right). Her reason ("I must return this") is grounded *in* the RMFs. Dev's reason ("My sister says to") is grounded in her authority, *not* in the RMFs. The RMFs are merely what the authority tracks.  
      *   *Saves:* The stroke patient has *some* worth (her motive is grounded in RMFs via the urge), but less than the pharmacist because the grounding is less direct/reflective. Explains why "borrowed credit" feels insufficient for Dev.  
      *   *Excludes:* The policy-follower (her reason "follow policy" is grounded in policy, not RMFs).

  ### Resolving Your Core Conflict (Dev vs. Stroke Patient)
  *   **Drop the verdict on Dev having *any* moral worth.** The Grounding Principle explains why: Dev doesn't act *on* the RMFs; he acts on his sister's instruction. The RMFs are irrelevant to *his* motivation. His reflective trust defends his deference, not the RMFs. He lacks grounding.
  *   **Keep the (reduced) worth for the stroke patient.** Her urge, though pathological in origin, has become a psychological mechanism *directly responsive* to the RMFs. Her endorsement confirms that the urge now *represents* those RMFs to her as decisive. The RMFs ground her motive ("return it") even if the mechanism is unusual. This captures your lean toward "yes, but less."

  ### Verdicts on Your Cases
  1.  **Pharmacist (Early):** No worth. Motive grounded in self-interest/avoidance, not RMFs (patient welfare).
  2.  **Pharmacist (Veteran):** Full worth. Acts *because* patient welfare counts decisively; RMFs ground her motive.
  3.  **Dev:** **No worth.** Motive grounded in sister's authority, not RMFs.
  4.  **Stroke Patient:** **Reduced worth.** Motive ("return it") grounded *in* the RMFs (via the urge), but the connection is non-reflective/less robust. Her reason is *constituted* by sensitivity to RMFs.
  5.  **Kidney Donor (False Kin):** No worth. Motive grounded in partiality ("kin"), not the RMFs (saving a life/alleviating suffering). The lurking benevolence isn't operative.
  6.  **Dual-Motive Agents:** Full worth. They act *because* the RMFs count decisively; RMFs ground their motive. Duty alone suffices, proving grounding.
  7.  **Policy-Following Assistant:** No worth. Motive grounded in policy compliance, not RMFs.

  ### Verdicts on New Cases
  8.  **Right Reason, Near Edge of Control:** **Full worth (but reduced praiseworthiness/credit).** She acts *because* she takes the RMFs to be decisive. The grounding is present. Her struggle affects the *credit* she deserves for overcoming temptation, not *why* she acted rightly.
  9.  **Right Reason, Wrong Theory:** **Full worth.** She acts *because* she takes the *actual* RMFs to count decisively (e.g., helping someone in need), even if she mislabels them ("God commands generosity"). As long as her motivating reason is grounded in the RMFs themselves (which she perceives imperfectly), worth is present. (If her motive was *only* "obey God" irrespective of the RMFs, it would fail).
  10. **Robot/Software System:** **No worth.** While it reliably responds to RMFs, it lacks the capacity to "take" features *as counting decisively*. Its "reasons" are algorithmic, not motivating reasons grounded in a recognition of normative force. It doesn't act *because* features count decisively; it acts because its programming dictates a response to inputs.
  11. **Committee (Aggregation):** **No worth (to the committee's act).** The collective output tracks RMFs, but no agent involved acted *because* they took the RMFs to be decisive. The grounding condition fails for the collective agent (if we even grant it agency) because its "motive" (the procedure) isn't grounded in recognition of RMFs. Individual members lack grounding.

  ### Addressing Scalar Intuitions
  *   **Moral worth itself is likely binary** according to the Grounding Principle: either the RMFs ground the motivating reason or they don't.
  *   **Your scalar talk ("less worth") is tracking *praiseworthiness* or *credit*, not moral worth per se.** Factors influencing praiseworthiness:
      *   *Robustness/Stability:* The veteran pharmacist's motive is deeply ingrained and reflective (high praiseworthiness). The stroke patient's motive, while grounded, is less stable/reflective (lower praiseworthiness).
      *   *Overcoming Difficulty:* The "near edge" agent deserves immense credit/praise for acting rightly despite powerful contrary impulses, even though her act has full moral worth.
      *   *Purity of Insight:* An agent who clearly and directly perceives the RMFs acting decisively (like the veteran pharmacist) might seem more praiseworthy than one acting from a vague benevolent urge (even if grounded).
      *   *Effort/Cultivation:* The pharmacist's long-developed character enhances praiseworthiness compared to the stroke patient's sudden endowment.

  In essence: **Moral Worth** (Binary: Grounding Present/Absent) asks *why* the right act was done. **Praiseworthiness/Credit** (Scalar) asks *how admirably* or *how much against the odds* the agent manifested that worth.

  This principle prioritizes the *content and source* of the agent's motivating reason, demanding it be grounded in the very features that make the act right. It resolves your tension by denying Dev worth (his reason isn't grounded in RMFs) while granting reduced worth to the stroke patient (her reason *is* grounded in RMFs, albeit via an unusual mechanism). It cleanly excludes the policy-follower and robot, handles epistemic errors and weakness of will, and explains scalar intuitions as concerning praiseworthiness, not worth itself.
