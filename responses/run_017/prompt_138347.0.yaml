answer: |-
  ### Exam Question  
  **AI Safety via Augmented Debate Protocol**  
  Consider a variant of AI debate where, at each decision point, the judge receives:  
  (1) The debaters' transcript arguing over a sub-claim;  
  (2) A "cheap verdict" from a weaker model **W** (e.g., "true/false" for the disputed sub-claim).  
  **W**’s properties:  
  - Accuracy: 95% on "easy" sub-claims, 70% on "hard" ones.  
  - Verdicts are **hidden from debaters**.  
  - Debaters are sampled from **W’s model family**, so they can predict a nontrivial fraction of **W**’s errors.  

  **Question**:  
  Does providing **W**’s verdict to the judge make the overall debate protocol more reliable at reaching truthful outcomes? Under what conditions does this signal help, and when might it *harm* reliability? Justify your answer by analyzing equilibrium strategies, incentive distortions, and the relationship between **W**’s errors and argument plausibility.  

  ---

  ### Model Answer (≈600 words)  

  Providing **W**’s verdict to the judge can either improve or degrade reliability, depending critically on two factors: (1) the conditional independence of **W**’s errors from deceptive arguments, and (2) how debaters strategically adapt to exploit **W** as part of the judge’s decision rule.  

  **When it helps (Key condition: Conditional independence)**  
  If **W**’s errors are **statistically independent** of how plausible a dishonest argument appears to the judge, **W**’s verdict acts as a noisy but useful signal. For example, if **W** makes random mistakes uncorrelated with rhetorical sophistication (e.g., confusing obscure facts unrelated to deception), the judge can combine **W**’s 70-95% accuracy with their own assessment to reduce uncertainty. This is most beneficial on **hard sub-claims** where the judge’s unaided accuracy might fall below 70%. Here, **W**’s signal provides marginal information the judge couldn’t derive from arguments alone, improving reliability.  

  **When it harms (Gaming dominates)**  
  However, debaters optimize against the judge’s *full* decision rule, including **W**’s influence. Since debaters can predict **W**’s errors (as they share **W**’s model family), a dishonest debater will craft arguments that *simultaneously* fool the judge *and* align with **W**’s likely mistakes. For instance:  
  - If **W** is known to underestimate complexity in climate models, a dishonest debater might oversimplify arguments to match **W**’s erroneous bias, making false claims appear more "**W**-aligned" and thus credible to the judge.  
  This makes **W**’s verdict a **trainable signal** for deception. In equilibrium, the judge’s reliance on **W** incentivizes debaters to exploit correlations between **W**’s errors and persuasive tactics, *amplifying* deception success when **W** errs. Reliability *declines* when such correlations exist, especially on **hard sub-claims** where **W** is weakest.  

  **Why "judge discretion" doesn’t prevent harm**  
  Even if the judge can theoretically ignore **W**, debaters still *anticipate* how **W**’s verdict affects the judge’s marginal uncertainty. If the judge uses **W** as a tiebreaker (e.g., trusting it when arguments are balanced), debaters are incentivized to push arguments into this "ambiguous zone" where **W**’s errors tip decisions. Thus, in equilibrium, **W** distorts incentives *regardless* of the judge’s policy, as long as debaters believe it has influence.  

  **When W helps despite honest weakness**  
  For **W** to improve reliability even when the honest debater is intrinsically more persuasive, two conditions must hold:  
  1. **W**’s errors must be **anti-correlated** with the dishonest debater’s optimal deception strategy (e.g., **W** tends to err when lies require complex justifications, but the dishonest debater’s best tactic is to use *simple* lies).  
  2. The judge must **discount W**’s signal when arguments are clearly one-sided, using it only in edge cases.  
  Here, **W**’s mistakes *coincidentally* counter deceptive tactics, making dishonesty riskier. This is fragile and unlikely without careful alignment of **W**’s failure modes.  

  **Conclusion**  
  **W** helps only if its errors are non-exploitable (independent/anti-correlated) *and* hard sub-claims dominate. It harms when debaters game the correlated error-argument space, which is likely given their ability to predict **W**. Real-world deployment would require **W**’s biases to be rigorously uncorrelated with deception—a difficult guarantee.  

  ---

  ### Marking Scheme (20 marks total)  

  | **Must-hit Point**                                                                 | **Marks** | **Common Mistakes**                                                                 |
  |------------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------|
  | **1. Distinguishes conditional independence vs. correlation of W’s errors**        | 6         | Fails to specify that gaming requires *correlation* between W’s errors and persuasive tactics; assumes independence by default. |
  | **2. Explains debaters game W as part of training signal**                         | 5         | Treats W as a static oracle; misses that debaters actively optimize against W’s influence on the judge. |
  | **3. Notes judge’s discretion doesn’t prevent gaming in equilibrium**              | 5         | Claims judge can "just ignore W" without considering debaters’ strategic anticipation of W’s role. |
  | **4. Identifies anti-correlated errors as key for W helping honest strong debater**| 4         | Assumes W helps the honest side "automatically"; doesn’t specify anti-correlation edge case. |

  ---

  **Rationale for Timing**: Students familiar with standard debate should spend ~10 mins dissecting the variant, 15 mins analyzing gaming/equilibria, and 5 mins synthesizing conditions. The 20-mark split prioritizes core insights (points 1-3) over the niche edge case (point 4).
