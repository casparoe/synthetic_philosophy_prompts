prompt: |-
  I host a monthly "concepts night" in my living room — ten or so people, mostly programmers and EA-adjacent types with a couple of philosophy majors mixed in, all of whom have read a fair amount of LessWrong and Slate Star Codex but almost no formal ethics. Next month I'm on the hook for a forty-minute slot on the procreation asymmetry: the claim that there is no moral requirement to bring into existence a person who would have a life clearly worth living, but that there is a strong one not to bring into existence a person whose life would be worth not living. I have my own half-baked view about where it goes wrong, but what I need from you is a plan for teaching it, not a defense or a critique of it.

  Start with the order of ideas, since that's where I expect to get it wrong. I'm fairly confident that the move "no one is made worse off by being created" has to be on the table before the four-cell table — create a good life, create a bad life, don't create a good life, don't create a bad life — will do any work, but I'm unsure where to place the distinction between an act's being permissible and its being required, and where to place the point that the asymmetry is a constraint on one kind of choice rather than a general account of which outcomes are better. Give me the dependency structure with the reason for each ordering decision. Then the carrying example. The case I've been using with friends is a "hatchery" machine with two dials: one dial sets whether the mind it produces has a life clearly worth living or clearly not worth living, and a second dial can add a fixed amount of well-being to one of the people who already exists. The point of the second dial is to force the question of whether the asymmetry has any verdict at all in a choice between two permissible options — I suspect the honest answer is that it doesn't, and I suspect that will be the thing my group resists hardest. Tell me whether that example can carry the whole session, what it must have and what it must lack in order to work (does the counterfactual of non-existence need to be made vivid, and does the case need to be scrubbed of the politics of reproduction, of uncertainty, of identity-affecting timing, of flow-through effects on third parties?), whether you would replace it and with what, and what to do with a third dial I've also toyed with — one that painlessly deletes an already-existing contented person, as a probe for whether the asymmetry is really about existence or about being made worse off.

  Third, the misconception map, in the order you'd expect them to arise and with the point in the sequence where each should be headed off — before it can form, or after it has formed and can be named. The ones I anticipate: that the asymmetry is just antinatalism in a lab coat; that no one is worse off is the same claim as no one is harmed and settles the matter; that the asymmetry is really a threshold view about lives being worth living plus something about risk; that it must be total utilitarianism with the serial numbers filed off; and that it must say something in the second-dial case. Correct my list, add what I'm missing, and tell me which of these are worth deliberately letting surface so they can be killed in front of the room. Close with one question I can ask at the end that distinguishes having understood the asymmetry from having merely been talked out of arguing with it, and with an explicit accounting of what I should refuse to explain in forty minutes — I'd guess at least the non-identity problem and the view that coming into existence is always a harm to the person who comes into existence, but tell me what you'd cut and how I should say out loud that I'm cutting it rather than dodging it.
reasoning: |-
  Okay, let me tackle this user's request step by step. They're hosting a concepts night and need a teaching plan for the procreation asymmetry. First, I need to understand their audience: programmers, EA-adjacent folks, some philosophy majors. They're familiar with LessWrong and Slate Star Codex but lack formal ethics training. The user wants a structured plan, not a defense of the asymmetry.

  Hmm, the main challenges here are sequencing ideas correctly and choosing effective examples. The user mentioned starting with "no one is made worse off by being created" before introducing the four-cell table. That makes sense because you need that baseline to understand why creating a good life isn't obligatory. But where to place the permissibility vs. requirement distinction? Probably right after explaining the four cells, since that's when people might confuse "not wrong" with "required."

  The carrying example with the hatchery machine seems solid. The two dials - one for new life quality, one for existing people's well-being - effectively isolate the asymmetry's core. Adding a third dial for deleting an existing person could complicate things, though. It might shift focus to the metaphysics of existence rather than the asymmetry itself. Better to keep it simple for a 40-minute session.

  For misconceptions, the user listed several good ones. Antinatalism confusion is crucial to address early. I should emphasize that the asymmetry allows creating good lives, unlike antinatalism. The "no one is harmed" point needs careful handling - it explains permissibility but not the lack of requirement. And yes, the group will likely resist the idea that the asymmetry stays silent on the second-dial choice. That's actually productive tension to explore.

  What to cut? Definitely the non-identity problem and Benatar's harm thesis. They're deep rabbit holes. I'll suggest explicit disclaimers: "We're bracketing identity questions today" and "We're not evaluating whether existence is inherently harmful." The hatchery example helps by scrubbing real-world complexities - no reproduction politics, no uncertainty. 

  For the final comprehension check question, something that tests understanding of the neutrality in the second-dial case would work best. Like asking whether the asymmetry prefers adding well-being to existing people vs. creating a new good life. Correct answer is it doesn't prescribe - that's the point.

  Timing will be tight. Need strict 5-minute segments: intro (5), core concepts (15), four-cell table (10), hatchery case (10). Must resist tangents - when non-identity comes up, say "That's vital but for another session; today we assume fixed identities." The hatchery machine's sterility is actually its strength here; it prevents distraction by real-world implications.

  Most importantly, this group's LW/SSC background means they'll spot weak reasoning. So every claim must be precise: "The asymmetry doesn't say creating good lives is wrong" (unlike antinatalism), "It doesn't say we must create them" (unlike utilitarianism), and crucially "It doesn't help choose between permissible options" (hence the second dial's purpose). The machine makes these abstract points visceral.
answer: |-
  Here’s a structured teaching plan focused on sequencing, examples, misconceptions, and boundaries—designed for clarity in 40 minutes with your audience in mind.

  ---

  ### **I. Order of Ideas & Dependency Structure**  
  *(Total: 20 minutes)*

  1. **Start with "No one is made worse off by being created"** (5 min)  
     *Why first?* This is the foundational intuition. Without it, the asymmetry’s core puzzle (why creating bad lives is wrong but creating good lives isn’t required) feels arbitrary.  
     *How to present:* Contrast creating a person with harming an existing person. *Example:* "Stabbing a happy person makes them worse off; creating a miserable person doesn’t worsen *their* state (they wouldn’t exist otherwise)."

  2. **Introduce the Permissibility/Requirement Distinction** (5 min)  
     *Why here?* Before showing the 4-cell table, clarify that ethics often separates "can" from "must." This preempts conflating "not wrong" with "obligatory."  
     *Key point:* "Morality has ‘no-go zones’ (requirements) and ‘free zones’ (permissions). The asymmetry treats creating bad lives as forbidden, but creating good lives as merely *allowed*."

  3. **Present the 4-Cell Table** (7 min)  
     | **Action**               | **Outcome: Good Life** | **Outcome: Bad Life** |  
     |--------------------------|------------------------|------------------------|  
     | **Create**               | Permissible (✔️)       | Forbidden (❌)         |  
     | **Don’t Create**         | Neutral (〇)           | Neutral (〇)           |  
     *Why after permissibility?* The table now illustrates the asymmetry *as a constraint*:  
     - ✔️ Creating good life: Permissible (not required)  
     - ❌ Creating bad life: Forbidden  
     - 〇 Not creating: Always neutral (no duty breached).  

  4. **Clarify: Asymmetry ≠ Outcome Ranking** (3 min)  
     *Why last?* Emphasize this is about *constraints on actions*, not comparing worlds.  
     *Example:* A world with 1,000 extra happy people may be "better," but creating them isn’t *required* by the asymmetry.  

  ---

  ### **II. The Hatchery Machine Example**  
  *(Total: 15 minutes)*  

  **Structure the case:**  
  - Dial A: Creates a person (Good Life / Bad Life)  
  - Dial B: Adds +10 well-being to an existing person  
  - **Key question:** "If you set Dial A to ‘Good Life,’ must you *also* turn Dial B?"  

  **Why this works:**  
  - ✅ **Scrubs politics/uncertainty:** The machine eliminates real-world baggage (parental sacrifice, risk).  
  - ✅ **Makes non-existence vivid:** The machine’s "off" state = no person, no deprivation.  
  - ✅ **Forces the neutrality gap:** Shows the asymmetry has *no verdict* on Dial B (adding to existing) vs. Dial A (creating new good life).  

  **Skip the "deletion dial" (for now):**  
  - Adding deletion (e.g., "painlessly remove a happy person") risks derailing into personhood/metaphysics. Use only if time permits *after* core asymmetry is grasped.  

  **Pitfall to avoid:** Don’t let the group reframe Dial B as "saving a life." Dial B is *pure well-being boost* to avoid smuggling in harm-prevention.  

  **If resistance arises:**  
  - *Common pushback:* "But creating the good life *is* better!"  
  - *Reply:* "The asymmetry doesn’t deny that. It just says you’re not *forbidden* from choosing Dial B instead. No constraint is violated."  

  ---

  ### **III. Misconception Map**  
  *(Sequence and handling)*  

  | Misconception                          | When to Address        | How to Counter                                                                 |  
  |----------------------------------------|------------------------|--------------------------------------------------------------------------------|  
  | **"This is just antinatalism"**        | After 4-cell table     | "Antinatalism forbids *all* creation. Asymmetry forbids only *bad* lives."     |  
  | **"No one harmed = No issue"**         | After "not worse off"  | "True for bad lives! But why isn’t creating good lives *required*? That’s the asymmetry." |  
  | **"It’s risk-averse utilitarianism"**  | After Dial B example   | "Utilitarianism *requires* creating good lives. Asymmetry doesn’t."            |  
  | **"It must prefer Dial B"**            | During Dial B debate   | "The asymmetry is silent. This choice needs a *separate* moral theory."        |  
  | **NEW: "It implies deleting happy people is okay"** | Only if raised | "Deletion *harms* an existing person. Asymmetry only governs *creating* life." |  

  **Deliberately surface:** Let the "Dial B must be better" pushback emerge. Debunking it reveals the asymmetry’s *silence* on comparing permissible acts.  

  ---

  ### **IV. Closing & Boundaries**  
  *(5 minutes)*  

  1. **Comprehension Check Question:**  
     *"If you could press Button A (create a happy person) or Button B (add happiness to an existing person), does the procreation asymmetry say which you must choose?"*  
     → **Correct answer:** "No. Asymmetry forbids creating unhappy people but doesn’t require creating happy ones."  

  2. **Explicit Cuts:**  
     - **Non-Identity Problem:** "We’re assuming fixed identities to isolate the asymmetry. Non-identity deserves its own session!"  
     - **Benatar’s "Coming into existence is always a harm"**: "That’s a distinct (and radical) claim. Today’s asymmetry doesn’t depend on it."  
     - **Flow-through effects**: "Our hatchery machine ignores social/familial impacts. Real-world procreation is messier."  

  **Phrase cuts as:** "These are critical nuances, but they expand the scope beyond asymmetry. For today, we’re laser-focused on the core structure."  

  ---

  ### **Timing Summary**  
  - **Ideas & Table:** 20 min  
  - **Hatchery Example:** 15 min  
  - **Misconceptions/Q&A:** 5 min  

  **Key to success:** Rigorously enforce timeboxes. Your group will *want* to dive into adjacent topics (e.g., "But what if the machine affects *my* well-being?"). Gently defer: "That’s the non-identity problem—let’s discuss it over drinks later!"  

  The hatchery machine can carry the session if you keep it sterile: no identity shifts, no uncertainty, no third-party effects. Its artificiality is its strength.
