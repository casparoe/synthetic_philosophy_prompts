answer: |-
  ### Principle Development Journey
  After brainstorming multiple candidate principles and rejecting those that don't align with your intuitive verdicts, I landed on a refined principle. I started with three candidates:

  1. **Maximize Expected Wellbeing (MEW)**: Select the embryo with the highest expected wellbeing for the child; optional expansion; risk via expected value.  
     *Rejected*: Fails your risk-aversion verdict (Case 6) and doesn't explain the Case 3 vs. 4 distinction.

  2. **Capabilities-Prioritizing Principle**: Select the embryo with the most "open futures" (capabilities), with wellbeing as a fallback; expansion optional.  
     *Rejected*: Overcomplicates Cases 1–2 (e.g., "options open" pull in Case 2 isn't strong enough to override wellbeing parity) and clashes with Case 5 (niche temperament isn't about capabilities).

  3. **Wellbeing Threshold with Risk Aversion**: Avoid embryos below a wellbeing threshold; above threshold, maximize risk-adjusted wellbeing; expansion optional.  
     *Rejected*: Fails Case 1 (blindness isn't necessarily below a threshold but still a failing to select) and overrides your non-harm-based intuition (Case 10).

  The winning principle refines your initial idea by incorporating risk aversion, a wellbeing "equivalence margin," and clarifying the scope of "available" embryos. It captures most verdicts but requires adjusting Cases 3, 4, and 8. Here's the principle:

  **Final Principle: Risk-Adjusted Wellbeing Maximization with Optional Expansion (RAWM-OE)**  
  - **Clause 1 (Scope of Availability)**: "Available embryos" are those obtainable without significant additional costs/risks (e.g., financial, health, or psychological burdens). *Motivating case: 7 (asymmetry in generating embryos).*  
  - **Clause 2 (Primary Selection)**: From available embryos, select one maximizing *risk-adjusted expected wellbeing* for the child, using a concave utility function to model risk aversion (diminishing marginal utility of wellbeing). *Motivating cases: 1 (blindness as wellbeing reduction), 6 (risk aversion).*  
  - **Clause 3 (Wellbeing Definition)**: Wellbeing is child-centered, based solely on their experiences (including how others' treatment affects them), not external impacts like benefits to others. *Motivating cases: 5 (niche temperament), 8 (saving lives irrelevant unless it affects child's wellbeing).*  
  - **Clause 4 (Equivalence Margin)**: Embryos with risk-adjusted wellbeing differences within a small threshold (e.g., <5% of the scale) are "equivalent"; selection among them is permissible based on non-wellbeing factors (e.g., parental preference, societal impact). *Motivating cases: 2 (deaf/hearing tie), 8 (small wellbeing difference).*  
  - **Clause 5 (Expansion Permissibility)**: Generating more embryos is permitted but never obligatory. *Motivating case: 7 (costly expansion not required).*  

  ### Master Case Table
  *Fit key: "captures" = matches your verdict; "misses" = contradicts; "silent" = principle doesn't address.  
  *Resolution: "keep verdict" = principle supports you; "overturn verdict" = discard your intuition; "new clause needed" = principle gap.*

  | Case | Your Verdict | Principle Verdict | Fit       | Clause Doing the Work       | Resolution          |
  |------|--------------|-------------------|-----------|-----------------------------|---------------------|
  | 1    | Picking sighted required | Picking sighted required | Captures | Clause 2 (Primary Selection) | Keep verdict        |
  | 2    | No failing either way | No failing (wellbeing equivalent) | Captures | Clause 4 (Equivalence Margin) | Keep verdict        |
  | 3    | Fine, not required | **Required if wellbeing increase > margin** | Misses   | Clause 2 (Primary Selection) | **Overturn verdict** (selection required) |
  | 4    | Worse than (3) | Same as (3): required if wellbeing increase > margin | Misses   | Clause 2 (Primary Selection) | **New clause needed** (trait type matters) |
  | 5    | Fine (better life) | Required (maximizes wellbeing) | Captures | Clause 3 (Wellbeing Definition) | Keep verdict        |
  | 6    | Prefer B (safe) | Prefer B (risk-aversion) | Captures | Clause 2 (Primary Selection) | Keep verdict        |
  | 7    | Must pick best of existing; no extra generation | Must pick best available; no expansion required | Captures | Clauses 1, 5 (Scope, Expansion) | Keep verdict        |
  | 8    | Either permissible | Either permissible **iff wellbeing difference ≤ margin** | Misses (if difference > margin) | Clause 4 (Equivalence Margin) | **Keep verdict** (if margin covers "somewhat less happy"; else overturn) |
  | 9    | Permitted, uneasy, not required | Permitted but not required (swapping expands "available" at low cost) | Captures | Clauses 1, 5 (Scope, Expansion) | Keep verdict        |
  | 10   | Not harm-based | Not harm-based (wellbeing-focused) | Captures | Clause 3 (Wellbeing Definition) | Keep verdict        |

  ### Clause Cost Analysis
  *Cost = Verdicts the clause can't save if applied rigidly.*

