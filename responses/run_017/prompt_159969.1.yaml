  ### Translation Notes
  The protocol translates five theoretical points into a field-runnable checklist. **Charity** is implemented as a global error budget (100 points per speaker), with deductions requiring specific error mechanisms; exhaustion triggers review of background assumptions. **Humanity vs. charity** is resolved by downstream purpose (Step 1): land claims use humanity (beliefs as held); learner materials use charity (beliefs as true). **Triangulation** is enforced via perceptual verification; failures tag terms as "unverified." **Holism** uses a fixed neighborhood test (3 sentences); failure halts the process. **Prior vs. passing theory** is handled by nonce detection (Step 2), restricting nonce glosses to session-only. Distortions:  
  - Charity’s "global constraint" is reduced to per-utterance deductions, risking incremental bias.  
  - Humanity/charity choice oversimplifies by tying to purpose alone.  
  - Triangulation’s "perceptual conditions" are narrowed to two types, excluding narrative cases.  
  - Holism’s "neighborhood" size is fixed at 3 for practicality, ignoring context scale.  
  - Nonce expiry lacks community consultation, risking over-autonomy.  
  Costs: Rigid steps may misprioritize purpose over speaker intent and underhandle unverifiable terms.

