  ### Limits
  This protocol cannot handle utterances where purpose ambiguity persists post-referral, as it lacks escalation rules. It will systematically distort narrative or mythological references by tagging them "unverified" due to failed triangulation, erasing cultural truth. It guarantees errors on malformed or fragmentary utterances (e.g., interrupted speech), as holism requires complete sentences. The neighborhood test’s fixed size (3) ignores lexical frequency, overpenalizing rare terms. At Step 2 (nonce detection) and Step 5 (error mechanism), it ceases to be procedural and becomes a form for recording intuition, masking bias as method. Ultimately, it cannot resolve value conflicts (e.g., community veto vs. archival integrity), deferring to roles without guidance.
