prompt: |-
  Last night my friend and I argued for hours about whether the astronomical number of future people is what makes human extinction catastrophic. When I said that this way of valuing future people looks like it commits her to something in the neighbourhood of the repugnant conclusion — a huge population of lives barely worth living beating a much smaller population of excellent ones — she answered 'make people happy, not make happy people' and treated that as settling it. The trouble is that she had spent the previous hour insisting that extinction would be a vast loss precisely because of all the people who would then never exist, so she cannot have meant the strongest thing the slogan seems to say.

  Please set out, as a menu, the distinct precise theses that one-liner could be expressing. I can already see three rough candidates — that a benefit needs a beneficiary, that the value of a life worth living does not aggregate additively across numbers of people, and that no value comparison is even defined between populations containing different people — but I want the fuller list, ordered from trivial to radical, with a verdict on each: platitude, substantive and defensible, or false. Where a reading is substantive, say what else it commits you to, including whether it generates an unattractive conclusion of its own in some other case.

  Test each reading against three cases: (1) ten billion people with lives barely worth living versus five billion with wonderful ones; (2) a mere addition, where an extra group with lives worth living is added without affecting anyone else; (3) a population on a distant planet whose existence no one else ever learns of, containing lives barely worth living. The part I care most about is which readings, if any, actually block the step from 'this extra life would be worth living' to 'the larger population is better' — and whether blocking that step costs her the longtermist claim she opened with. Also tell me which reading someone who deploys the slogan in an argument like ours probably has in mind, and where the residual disagreement with a total view is genuine rather than merely verbal. Assume I know what the repugnant conclusion and the mere addition paradox are, and don't give me citations or a reading list.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a long argument with their friend about whether the astronomical number of future people makes human extinction catastrophic. Their friend used the slogan "make people happy, not make happy people" to counter the repugnant conclusion. But the user is confused because their friend also emphasized the loss of all future people who would never exist, which seems contradictory.

  First, I need to parse the different interpretations of that slogan. The user mentioned three rough candidates: the beneficiary idea, non-additive aggregation, and incomparability of different populations. But they want a fuller list, ordered from trivial to radical, with verdicts on each. The test cases are crucial: repugnant scenario, mere addition, and isolated planet. 

  Starting with the trivial interpretations. The first one is about intention: focusing on existing people's welfare rather than creating new ones. That's a platitude. But it doesn't block the repugnant conclusion or support the friend's longtermism. The second interpretation is the beneficiary requirement—only existing people can be benefited. That's substantive but leads to problems in the isolated planet case. If no one can be benefited there, but intuitively that planet has value, this view might deny that, which seems counterintuitive.

  Then there's the person-affecting view: value must be explained by effects on specific people. This is substantive and avoids the repugnant conclusion. But it struggles with the mere addition paradox and the isolated planet. Adding happy people without harming anyone seems better, but this view might say it's neutral. That's unattractive. Also, for the isolated planet, if no one is affected, this view might say it has no value, which feels wrong.

  Next, the non-additive aggregation. Valuing average happiness or with diminishing returns. This avoids repugnant conclusion by preferring smaller, happier populations. But in mere addition, adding people with positive lives might not improve things if averages drop. That could be defensible. For the isolated planet, if it's average view, adding them might lower averages, making it worse, which is harsh. If it's diminishing returns, adding them might be positive but less so, which is more plausible.

  Then the strong incomparability: populations with different people can't be compared. Radical and false, since we make such comparisons all the time. It blocks the repugnant conclusion but also says extinction isn't worse, contradicting the friend's initial point. The moderate incomparability allows rough judgments but no precise better/worse. This is substantive but vague. It might handle the repugnant scenario by saying neither is better, but then why is extinction bad? It doesn't clearly support the friend's longtermism.

  Now, which one is the friend likely using? Given she cares about future people, she probably holds a person-affecting view or non-additive aggregation. But the person-affecting view struggles with mere addition and isolated planets. Non-additive aggregation via diminishing returns might be her stance, allowing that adding happy people is good but not enough to justify repugnant outcomes. That could support her longtermism if she thinks future lives contribute significantly without requiring astronomical numbers.

  The key is whether any view blocks "life worth living implies larger population better." Person-affecting and incomparability block it, but at the cost of denying mere addition benefits. Non-additive aggregation allows some benefit but not linear aggregation. The friend needs a view that both blocks repugnant conclusion and supports extinction as catastrophic due to lost future people. Non-additive aggregation with diminishing returns might do that: each future life adds value, but with decreasing marginal gain, so a vast number of barely lives isn't better than fewer excellent ones, but still, losing many future lives is a huge loss. That seems coherent.

  But in the mere addition case, if adding happy people without harm is only slightly good due to diminishing returns, is that defensible? Some might find it acceptable. The isolated planet: if adding them adds some value, even if others don't know, that's plausible. So diminishing returns seems a strong candidate. However, the user’s friend used the slogan, which is person-affecting, but her longtermism suggests she’s not fully person-affecting. Maybe she’s mixing views. The residual disagreement is about whether creating happy people is intrinsically good. Total utilitarians say yes, others deny or qualify it.
answer: |-
  Here's a menu of precise interpretations for "make people happy, not make happy people," ordered from most trivial to most radical, with verdicts, commitments, and tests against your cases. Key questions for each: Does it block "life worth living → larger population better"? Does it preserve the catastrophic loss from extinction?

  ### **The Interpretations & Verdicts**

  1.  **Focus of Policy/Intention:**
      *   **Thesis:** Our primary *moral duty* and *practical focus* should be improving the welfare of existing people, not deliberately creating new people *as a goal in itself*. Creating new people is permissible only if it doesn't harm existing people and they have good lives.
      *   **Verdict:** Platitude (for most contexts). Nobody seriously advocates creating miserable people for the sake of numbers.
      *   **Block Aggregation?** No. Compatible with total utilitarianism. Says nothing about whether adding happy people *is* better, just that we shouldn't prioritize *doing* it over helping existers.
      *   **Extinction Loss?** Neutral. Doesn't address the value of potential future people.
      *   **Cases:**
          *   (1) Repugnant: Could accept either outcome based on underlying theory.
          *   (2) Mere Addition: Accepts adding the group as permissible/good.
          *   (3) Isolated Planet: Creating them is permissible if done responsibly.

  2.  **Beneficiary Requirement (Weak):**
      *   **Thesis:** A benefit must have a *definite, existing beneficiary* at the time the benefit is conferred. You can't benefit "possible future people" *as such*; you can only create a person who *then* benefits *after* they exist.
      *   **Verdict:** Substantive & Defensible (but limited scope). Captures a linguistic/ontological point about "benefit."
      *   **Block Aggregation?** No. Compatible with believing that creating happy people *is* good (it creates beneficiaries who then possess welfare), just clarifying the mechanism.
      *   **Extinction Loss?** *Weakly* supports. The *loss* is the absence of all the *actual beneficiaries* (happy people) who would have existed. "Vast loss" is justified by the vast number of missed beneficiaries.
      *   **Cases:**
          *   (1) Repugnant: Can still say larger population is better (more beneficiaries).
          *   (2) Mere Addition: Good because new beneficiaries are created.
          *   (3) Isolated Planet: Good because beneficiaries are created.

  3.  **Person-Affecting View (Moderate):**
      *   **Thesis:** An outcome can only be better (or worse) than another *if it is better (or worse) for some particular person(s)* who exist(s) or will exist in either outcome. Creating a person with a life worth living is *not* better *for* anyone (the new person wasn't deprived otherwise), though it may be permissible. Preventing existence is only bad if it harms an existing person (e.g., depriving parents of a child).
      *   **Verdict:** Substantive & Defensible (but controversial). Directly targets the step from "life worth living" to "better."
      *   **Block Aggregation?** **Yes.** Creating 1 billion happy people isn't better *for anyone* compared to creating 100 happy people (no one exists in both scenarios to be better off). Prevents the Repugnant Conclusion *if* we compare A (small, excellent) and Z (huge, barely worth living) directly. *However:* It struggles with Same-Number Choices and Mere Addition.
      *   **Extinction Loss?** **Problematic.** Preventing *all* future people isn't worse *for any particular person* (no future person exists to be deprived). The "vast loss" claim is hard to justify. Proponents might appeal to harms to *existing* people (loss of legacy, projects) or weakly permissible creation.
      *   **Commitments:** Leads to the *Non-Identity Problem* (harmful policies for future generations aren't "bad for" specific people). May imply *Mere Addition is Neutral*: Adding happy people without affecting others isn't *better*, just permissible.
      *   **Cases:**
          *   (1) Repugnant: Neither is better than the other (if populations disjoint). Or might prefer A if someone exists in both.
          *   (2) Mere Addition: **Neutral.** Not better *for* the added people (they don't miss out otherwise), not worse for anyone else.
          *   (3) Isolated Planet: **Permissible but not better than not creating them.** No value gain.

  4.  **Non-Additive Aggregation:**
      *   **Thesis:** The value of a population is *not* simply the sum of individual welfare levels. Aggregation may be *diminishing* (each additional happy person adds less value) or follow an *average* or *prioritarian* rule. "Make happy people" ignores this non-linearity.
      *   **Verdict:** Substantive & Defensible (many variants). Challenges simple total utilitarianism.
      *   **Block Aggregation?** **Partially/Qualitatively.** Blocks the *specific inference* that a huge number of barely-worth-living lives aggregates to more total value than a smaller number of excellent lives (thus avoids Repugnant Conclusion). *However*, it generally *does* allow that adding happy people *increases value*, just not linearly/without limit.
      *   **Extinction Loss?** **Supports.** Losing the vast future population is a vast loss of value, even if each marginal addition adds less value. The sheer scale still dominates.
      *   **Commitments:** Must defend the specific aggregation rule (Average? Critical Level? Prioritarian?).
      *   **Cases:**
          *   (1) Repugnant: Prefers the smaller, happier population (Z has lower average/critical-level-adjusted total).
          *   (2) Mere Addition: **Value Increases** (if Average: increases only if new lives > old average; if Critical Level/Prioritarian: always increases, but perhaps minimally). Generally seen as *better* or at least *not worse*.
          *   (3) Isolated Planet: **Value Increases** (adding positive welfare lives increases total value, potentially less so than if connected).

  5.  **Strong Incomparability/No Cross-Population Value:**
      *   **Thesis:** Populations containing entirely different sets of people are *fundamentally incomparable* with respect to "better than/worse than". There is no fact of the matter whether creating a large happy population is "better" than creating a small one, or better than creating none at all. Value only applies within a fixed population.
      *   **Verdict:** Radical & Likely False. Makes vast swathes of population ethics nonsensical.
      *   **Block Aggregation?** **Absolutely.** It denies the *meaning* of the comparison needed for the step.
      *   **Extinction Loss?** **Directly Contradicts.** Cannot say extinction is "worse" than survival, as the populations are incomparable.
      *   **Commitments:** Renders nearly all long-term planning and large-scale policy choices involving future generations evaluatively meaningless.
      *   **Cases:**
          *   (1) Repugnant: Incomparable.
          *   (2) Mere Addition: Incomparable to original population.
          *   (3) Isolated Planet: Creating them vs. not is incomparable.

  6.  **Moderate Incomparability/Indeterminacy:**
      *   **Thesis:** While some comparisons across populations are possible (e.g., clearly better/worse for specific shared individuals), comparisons involving large-scale creation/non-creation of disjoint populations are often *indeterminate* or involve *incommensurable values*. "Better than" is not always defined. Creating happy people isn't *clearly* better.
      *   **Verdict:** Substantive & Defensible (nuanced view).
      *   **Block Aggregation?** **Blocks the Simple Step.** From "this life would be worth living" we cannot automatically conclude "adding it makes the population better" – it might be indeterminate or involve trade-offs.
      *   **Extinction Loss?** **Can Support, but Ambiguously.** The loss is vast *in some sense* (loss of potential goodness, loss of meaning, violation of stewardship), but not necessarily a straightforward "worse than" comparison. Focuses on the tragedy of lost *opportunity* or *value* itself, not summed individual welfare.
      *   **Commitments:** Requires an alternative account of the "loss" in extinction that isn't purely person-affecting or aggregative.
      *   **Cases:**
          *   (1) Repugnant: Likely indeterminate or incommensurable.
          *   (2) Mere Addition: May be indeterminate or only slightly positive/negative depending on context.
          *   (3) Isolated Planet: Creating them may be good/obligatory/neutral/indeterminate based on non-aggregative values (e.g., intrinsic value of flourishing).

  ### **Which Reading Fits Your Friend & Answers Your Questions?**

  *   **Most Likely Reading:** Your friend almost certainly holds a **Person-Affecting View (Moderate - #3)** or **Non-Additive Aggregation (#4, likely Critical Level/Diminishing Returns)**. Her opening claim requires valuing future *people* (not just abstract "value"), and her use of the slogan is a direct attempt to block the Repugnant Conclusion's aggregation. However, the Person-Affecting View (#3) directly undermines her extinction claim, while Non-Additive Aggregation (#4) supports it.
  *   **Residual Disagreement (Genuine, not Verbal):** The core genuine disagreement is between **Total Utilitarianism** (adding a life worth living *always* makes the outcome better, value aggregates linearly) and views that either:
      *   Deny that creating happy people is *pro tanto* good (#3 - Person-Affecting),
      *   Deny that welfare aggregates linearly/simply (#4 - Non-Additive), or
      *   Deny that such comparisons are straightforwardly possible (#5, #6).
  *   **Blocking the Step:**
      *   **Blocks Totally:** Person-Affecting View (#3), Strong Incomparability (#5), Moderate Incomparability (#6).
      *   **Blocks Repugnant Aggregation but Allows Some Benefit:** Non-Additive Aggregation (#4).
      *   **Doesn't Block:** Focus of Policy (#1), Beneficiary Requirement (#2).
  *   **Cost to Longtermism:**
      *   **Costs Longtermism:** Person-Affecting View (#3) makes justifying extinction as a *vast impersonal loss* very difficult. Strong Incomparability (#5) makes it nonsensical.
      *   **Preserves Longtermism:** Non-Additive Aggregation (#4) robustly supports it. Moderate Incomparability (#6) can support it with a different justification. Beneficiary Requirement (#2) weakly supports it. Focus of Policy (#1) neutral.
  *   **Her Probable Meaning & Coherence:** Given her emphasis on the *loss* of future *people*, she likely intends **Non-Additive Aggregation (#4)**. This allows her to:
      1.  Block the Repugnant Conclusion (huge barely-worth-living isn't better than small excellent).
      2.  Maintain that extinction is catastrophic (losing vast future value, even with diminishing returns).
      3.  Accept that adding happy people *is* good (value increases), just not linearly enough to justify Z over A.
      4.  Use the slogan loosely to mean "don't *merely* maximize total by any means, focus on quality/diminishing returns."

  **Conclusion:** Your friend's slogan is ambiguous, but her commitment to the catastrophic loss of future people points strongly towards **Non-Additive Aggregation (likely with diminishing returns or a critical level)**. This view successfully blocks the *Repugnant Conclusion's specific aggregation* while preserving her *longtermism*. The genuine disagreement is with the Total View's core tenet of linear, unconstrained aggregation of welfare across persons. Her slogan is a shorthand for rejecting that tenet.
