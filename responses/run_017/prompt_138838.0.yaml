  ### What the Procedure Cannot Do  
  1. **Structurally Unanswerable Questions**:  
     - **True differential cost**: Cannot observe internal sender incentives; relies on proxies.  
     - **Long-term commitment**: Cannot predict future sender behavior (e.g., leadership changes).  
     - **Hidden audiences**: Cannot verify if reputational costs target the university or others.  

  2. **Disagreements It Redescribes (Without Resolving)**:  
     - **Wrong-pocket severity**: Debates over incentive alignment (Q4) become "Is there a binding mechanism?"  
     - **Differential cost estimation**: Conflicts over sender intent (Q9) become "How aligned is this with their core interests?"  
     - **Baseline drift**: Arguments over "entry fee" effects (Q10) become "Is this commitment rare in their sector?"  

  3. **Limitations**:  
     - Cannot replace values-based judgments (e.g., "Should we care about this trait?").  
     - Assumes rational actors; ignores cultural or ethical nuances.  

