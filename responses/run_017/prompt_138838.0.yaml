answer: |-
  ### Decision Procedure for Committee on External Partnerships

  **Procedure Overview**:  
  This procedure evaluates the credibility of commitments in partnership proposals based on costly signaling theory. It assesses whether the signal (commitment) is *honest*—costing less for a sender with the signaled trait than for one without—despite structural challenges. The procedure is structured as a flowchart of questions, with clear stopping points. It distinguishes between credibility assessment (evidence-based) and mission alignment (values-based), handing the latter to the committee.

  **Key Definitions**:  
  - **Sender**: Entity making the commitment.  
  - **Cost-Payer**: Entity bearing the cost of the commitment (may differ from sender).  
  - **Uptake-Contingent**: Cost incurred only if the university accepts the proposal.  
  - **Reversible**: Cost can be avoided, recovered, or lapsed after acceptance.  
  - **Baseline**: Prevalence of similar commitments in the proposer’s sector (common = weak signal; rare = strong signal).  

  ---

  ### Decision Procedure: Step-by-Step Questions

  #### **Step 1: Identify Commitment and Signal**  
  - **Q1. What is the explicit commitment?**  
    *Sufficiency*: Clear, specific promise (e.g., "publish annual reports," "endow $X").  
  - **Q2. What trait is this commitment signaling?**  
    *Sufficiency*: Trait linked to the proposer’s trustworthiness (e.g., "transparency," "commitment to free expression").  
  - **Stop if no commitment/trait**: Return **NOT CREDIBLE**.  

  #### **Step 2: Assess Cost Structure**  
  - **Q3. Who is the sender?**  
    *Sufficiency*: Identified entity (e.g., company, donor, consortium).  
  - **Q4. Who pays the cost?**  
    *Sufficiency*: Identify cost-payer (e.g., subsidiary, parent company, successor).  
    - **Wrong-Pocket Test**:  
      - If sender ≠ cost-payer **and** no mechanism aligns their incentives (e.g., binding contract, shared oversight), return **NOT CREDIBLE**.  
      - *Example of failure*: Subsidiary signs, parent pays with no accountability.  
  - **Q5. Is the cost uptake-contingent?**  
    *Sufficiency*: Yes/no.  
    - If **yes**, proceed to Q6.  
  - **Q6. Is the cost reversible?**  
    *Sufficiency*: Assess if cost can be:  
    - **Avoided**: E.g., lapse clause, renegotiation option.  
    - **Recovered**: E.g., financial penalties absent.  
    - **Minimized**: E.g., reputational cost only if audience exists.  
    - If **reversible**, proceed to Q7; else, proceed to Q8.  
  - **Q7. Does the reputational audience include the university?**  
    *Sufficiency*: Yes/no.  
    - If **no**, the cost is ineffective as a signal *to us*; return **NOT CREDIBLE**.  
  - **Q8. Estimate absolute cost (proxy-based)**:  
    *Sufficiency*: Low/medium/high based on financial, operational, or reputational proxies (e.g., industry benchmarks).  
    - If **unable to estimate**, assume "medium."  
  - **Q9. Estimate differential cost (proxy-based)**:  
    *Sufficiency*: Assess if the commitment:  
    - **Aligns with sender’s core interests** (e.g., business model, values): High alignment → low cost for "good" sender.  
    - **Has barriers to imitation** (e.g., high fixed costs, unique capabilities): Barriers → high cost for "bad" sender.  
    - *Score*:  
      - **High differential**: Costly for "bad" sender, cheap for "good" (credible).  
      - **Low differential**: Similar cost for both (not credible).  
      - **Uncertain**: Assume neutral (weakens signal).  
    - *Proxies*: Public reports, past behavior, sector incentives.  
    - If **no proxies**, score "uncertain."  

  #### **Step 3: Assess Baseline Prevalence**  
  - **Q10. How common is this commitment in the proposer’s sector?**  
    *Sufficiency*:  
    - **Rare** (strong signal).  
    - **Common** (weak signal; "entry fee").  
    - **Moderate** (neutral).  
    - *Source*: Industry reports, committee database.  

  #### **Step 4: Determination**  
  - **If failed Step 2 (Q4, Q7)**: Return **NOT CREDIBLE**.  
  - **Else, calculate credibility score**:  
    - **Robustness** (from Q4–Q7): 0–3 points (0 = severe issues, 3 = no issues).  
    - **Differential Cost** (from Q9): 0 (low), 0.5 (uncertain), 1 (high).  
    - **Baseline** (from Q10): 0 (common), 0.5 (moderate), 1 (rare).  
    - **Formula**:  
      `(Robustness / 3) × 0.4 + Differential × 0.4 + Baseline × 0.2`.  
    - **Threshold**:  
      - **≥0.7**: CREDIBLE.  
      - **≤0.4**: NOT CREDIBLE.  
      - **0.41–0.69**: UNDECIDED BY THE PROCEDURE → Hand to committee for values-based judgment.  

  #### **Step 5: Values Handoff**  
  - **If CREDIBLE/NOT CREDIBLE**: Committee assesses mission alignment, reputational risk, and university values.  
  - **If UNDECIDED**: Committee decides based on:  
    - Strategic importance.  
    - Precautionary principle (e.g., "assume bad faith if uncertain").  
    - External consultation.  

