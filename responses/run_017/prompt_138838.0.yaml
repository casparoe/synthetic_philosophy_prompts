  Now, aggregate:

    Cost Structure Concerns:
        - Q5: Uptake-contingent: medium concern (because the cost is only incurred if we accept, but once accepted, it's sunk and irreversible without penalty). We'll say medium (0.5 on a 0-1 concern scale, where 0 is no concern, 1 is high).
        - Q6: Low reversibility: no concern (0).
