    Q5: Contingent? The commitment is written into the agreement and is a condition for the university's participation. So the cost is incurred only if the university accepts (uptake-contingent). This weakens the signal because if the university declines, they don't have to do it. But note: the university's continued participation is conditioned on the report, so once they start, they must continue or lose the partnership. So the cost is sunk only after the university joins. However, at the time of signaling, the cost is contingent on acceptance.
    Q6: Reversible? The agreement says the report must be published annually as long as the university is in the lab. If they stop, the university can withdraw. But the company could renegotiate? The clause is written in, so renegotiation would require university consent. Without consent, they cannot unilaterally lapse. So low reversibility.
    Q7: Reputational cost? Yes, because publishing government requests might cause reputational damage (if they are seen as too cooperative) or might be seen as a positive by some. 
        Q7a: Audience: The public, regulators, and the university. The university is part of the audience, so that's good.
        Q7b: The audience that matters for the university is present.

    Q8: Absolute cost: 
        - Operational cost: maintaining the report, legal review, etc. (Medium)
        - Reputational: could be high if they get many requests and it looks bad, or if governments are upset. (High in some contexts)
        - So overall: High.

    Q9: Differential cost:
        a) Alignment: For a company that values user privacy and transparency, this commitment aligns and might have low cost (because they would want to do it anyway). For a company that is not transparent, this would be costly because it might reveal cooperation with governments that users disapprove of. So high differential cost? 
            - But note: the company might be of the type that doesn't care about transparency and is only doing it for the partnership. Then the cost is high for them? However, the commitment might be more costly for a company that has a lot of government requests (and thus has more to lose by publishing) than one that has few. But the type with few requests might be the one that is more privacy-oriented. So it's complex.
            - We can think: the commitment is more costly for a company that is secretly cooperating with governments in ways that their users would disapprove of. So if the company is of the "bad" type (non-transparent, cooperative with governments in secret), then the cost is high because they risk user backlash. For a "good" type (already transparent, or few requests), the cost is low. So high differential cost -> good for credibility.
        b) Barriers to imitation: A company that is non-transparent might find it hard to consistently publish these reports without being caught in inconsistencies? Not necessarily. They could just publish the requests they receive. But if they are also receiving informal requests that they don't report, then they might be caught. However, that is a risk of lying, not of the commitment per se. The commitment itself is to report what they receive. So if they lie in the report, that's a separate issue. The barrier is that if they are non-transparent, they might not want to commit to this because it would reveal their level of cooperation? So yes, the barrier is there.

