  ### Application to Proposals

  #### **Case 1: Software Company (Joint Research Lab)**  
  - **Q1**: Publish annual transparency reports; named officer accountable; report required for university’s continued participation.  
  - **Q2**: Signals "commitment to transparency."  
  - **Q3**: Sender = software company.  
  - **Q4**: Cost-payer = company (no wrong-pocket).  
  - **Q5**: Uptake-contingent? **Yes** (cost only if university joins).  
  - **Q6**: Reversible? **No** (university can exit if reports stop; high penalty).  
  - **Q7**: Reputational audience includes university? **Yes** (reports public; university monitors).  
  - **Q8**: Absolute cost = **Medium** (operational burden; reputational risk if data reveals high government cooperation).  
  - **Q9**: Differential cost = **High** (low cost for pro-transparency company; high cost for secretive company due to user/regulator backlash).  
  - **Q10**: Baseline = **Common** (tech sector transparency reports are standard).  
  - **Robustness**: 3/3 (no wrong-pocket, irreversible, audience match).  
  - **Score**: (3/3 × 0.4) + (1 × 0.4) + (0 × 0.2) = **0.8 → CREDIBLE**.  
  - **Handoff**: Committee evaluates if transparency aligns with university values.  

  #### **Case 2: Trustee Gift (Archive and Lecture Series)**  
  - **Q1**: Large gift for archive; building renamed; permanent lecture series on free expression.  
  - **Q2**: Signals "commitment to free expression."  
  - **Q3**: Sender = donor (trustee).  
  - **Q4**: Cost-payer = donor (no wrong-pocket).  
  - **Q5**: Uptake-contingent? **Yes** (gift only if university accepts conditions).  
  - **Q6**: Reversible? **No** (endowment irreversible; lecture series permanent).  
  - **Q7**: Reputational audience includes university? **Yes** (public gift; university benefits).  
  - **Q8**: Absolute cost = **High** (large financial outlay).  
  - **Q9**: Differential cost = **High** (low cost for free-expression advocate; high cost for indifferent donor due to lost alternative uses).  
  - **Q10**: Baseline = **Common** (named gifts are sector norm).  
  - **Robustness**: 3/3 (no wrong-pocket, irreversible, audience match).  
  - **Score**: (3/3 × 0.4) + (1 × 0.4) + (0 × 0.2) = **0.8 → CREDIBLE**.  
  - **Handoff**: Committee assesses if renaming and lecture series align with mission; evaluates donor’s influence.  

  #### **Case 3: Industry Consortium (Responsible Procurement Pledge)**  
  - **Q1**: Sector pledge; no member obligations; no audit; lapses if <10 signatories.  
  - **Q2**: Signals "commitment to responsible procurement."  
  - **Q3**: Sender = consortium.  
  - **Q4**: Cost-payer = **Members** (not sender; no binding mechanism → **wrong-pocket problem**).  
  - **Stop at Q4**: **NOT CREDIBLE** (sender ≠ cost-payer; members bear no cost).  
  - **Additional flaws**:  
    - **Q5**: Uptake-contingent? **Yes** (lapses if <10 signatories).  
    - **Q6**: Reversible? **Yes** (lapse clause; no enforcement).  
    - **Q9**: Differential cost = **Low** (no barriers to imitation; any consortium can sign).  
  - **Handoff**: Committee may still consider political benefits of signing, but signal is not credible.  

