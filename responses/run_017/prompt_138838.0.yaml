  We are designing a decision procedure for the committee to assess the credibility of commitments in partnership proposals. The procedure must account for:
  1. The core insight: A signal is honest if it costs one type of sender less than another (i.e., it is costly in a way that is differentially affordable to the honest type).
  2. The "wrong-pocket problem": The party paying the cost may not be the party capturing the benefit.
  3. Reversible or uptake-contingent costs: Costs may only be incurred if the university responds favorably, or they can be recovered, renegotiated, or lapsed. Also, costs that are purely reputational and depend on an audience that may not be the university.
  4. The problem of baseline drift: A commitment that was once informative may become an entry fee and thus uninformative.

  We cannot observe the proposer's real costs, so we must estimate from proxies. The procedure must be structured as a series of questions, with clear stopping points and handoffs to human judgment when values are at stake.

  Procedure Design:

  We break the assessment into stages:

  Stage 1: Identify the signal and the commitment
  Stage 2: Assess the cost structure (including wrong-pocket and reversibility)
  Stage 3: Assess the baseline (to account for drift)
  Stage 4: Make a determination of credibility or hand off to values

  Detailed Steps:

  Stage 1: Identify the signal and the commitment
    Q1. What is the specific commitment being offered as a signal of good faith?
    Q2. What trait or behavior is this commitment intended to signal? (e.g., commitment to free expression, data transparency, responsible procurement)

  Stage 2: Assess the cost structure
    Q3. Who is the sender of the signal? (The entity that is making the commitment and will be bound by it)
    Q4. Who pays the cost of the commitment? (If different from the sender, we have a wrong-pocket problem. We need to evaluate the alignment between the sender and the cost-payer.)
    Q5. Is the cost of the commitment fixed, or is it contingent on the university's response (uptake-contingent)? 
        - If contingent, then the cost is only incurred if the university accepts, which weakens the signal because it becomes a joint decision rather than a unilateral sacrifice.
    Q6. Can the cost be recovered, renegotiated, or lapsed without penalty? (Reversibility)
        - If yes, then the commitment is less credible.
    Q7. Is the cost primarily reputational? If so:
        - Q7a. Who is the audience for the reputational effect? (The university, the public, regulators, shareholders, etc.)
        - Q7b. Is the audience the same as the university? If not, then the reputational cost to the sender in the eyes of the university might be low.

    For each of Q4 to Q7, we must assign a level of concern (low, medium, high). We then aggregate these concerns to decide if the cost structure is sufficiently robust.

    We also need to estimate the absolute cost and the differential cost. Since we cannot observe the true cost, we rely on:
      - Proxies: financial, operational, reputational, or opportunity costs.
      - We can compare with similar commitments by similar organizations.

    However, the key is the differential cost: does the commitment cost a "good" type less than a "bad" type? We cannot measure this directly, so we use:
      - The nature of the commitment: does it align with the proposer's core business or stated values? If it does, then the differential cost might be low for the good type and high for the bad type.
      - Evidence of past behavior: has the proposer made similar commitments and followed through? (But note: past behavior might be strategic.)

    We break down:

    Q8. What is the estimated absolute cost of the commitment? (Low, Medium, High) - based on available information.
    Q9. What is the estimated differential cost? (i.e., how much more costly would this be for a party that does not possess the trait being signaled?) We estimate by:
        a) Alignment: How aligned is the commitment with the proposer's core interests? (High alignment suggests low differential cost for the honest type, making the signal credible; low alignment might mean the cost is similar for both types, so the signal is weak.)
            - We can use public information about the proposer's business model, past actions, and incentives.
        b) Barriers to imitation: Are there factors that would prevent a "bad" type from imitating the commitment? (e.g., high fixed costs that only a good type can bear, or reputational risks that a bad type cannot afford because they would be caught in a lie.)

    If we cannot estimate the differential cost, we must note that and proceed with caution.

  Stage 3: Assess the baseline
    Q10. How common is this type of commitment in the proposer's sector?
        - If it is very common (baseline), then the commitment may be an entry fee and not informative.
        - If it is uncommon, then it may be informative.

    We assign:
        Common -> weak signal
        Uncommon -> strong signal

  Stage 4: Determination

    We now combine the assessments:

    Step 4.1: If the cost structure assessment (Stage 2) reveals any of the following, we stop and return NOT CREDIBLE:
        a) The cost is entirely contingent on the university's acceptance and there is no sunk cost (so the proposer incurs no cost if the university declines) AND the commitment is easily reversible without penalty. (This makes the signal costless if the university doesn't accept, and even if accepted, it can be undone.)
        b) The wrong-pocket problem is severe: the party paying the cost is not the sender and there is no clear mechanism to ensure alignment (e.g., no contractual obligation from the parent company to the subsidiary, or the cost-payer is a future leader who is not bound). We define severe as: the cost-payer has no incentive to follow through because they do not benefit from the partnership and/or they are not accountable to the sender.

    Step 4.2: If Step 4.1 does not apply, then we consider the differential cost and baseline:

        We create a score:

          Cost Structure Robustness (from Stage 2): 
            - We have concerns (wrong-pocket, reversibility, reputational audience mismatch) that we aggregated. We will assign a score from 0 to 3 (0 being no concerns, 3 being severe concerns). Then we define:
                Robustness = 3 - (total concern level)   [so 0,1,2,3] -> then normalized to 0-1 by dividing by 3.

          Differential Cost Estimate (from Q9): 
            - We assign: 
                High differential cost (good type has low cost, bad type high) -> score 1
                Medium -> 0.5
                Low (both types have similar costs) -> 0
            - If we cannot estimate, we set to 0.5 (neutral) but note that this weakens the signal.

          Baseline (from Q10):
            - Uncommon: 1
            - Common: 0
            - In between: 0.5

          Then overall credibility score = (Robustness * 0.4) + (Differential Cost * 0.4) + (Baseline * 0.2)

          We set a threshold: 
            - If score >= 0.7 -> CREDIBLE
            - If score <= 0.4 -> NOT CREDIBLE
            - Else: UNDECIDED (then we hand off to human judgment for values)

    However, note: we must also consider if the commitment is verifiable and enforceable. But the procedure is about the signal's credibility as a signal, not about enforceability per se. However, if the commitment is not enforceable, then the cost might be avoidable, so we have to consider that in reversibility.

    Step 4.3: If the commitment passes the above but involves a values judgment (e.g., whether the university should care about the trait being signaled, or whether the commitment aligns with the university's mission), then we hand off to human judgment. This is because the procedure only assesses the credibility of the signal, not whether the signaled trait is one we value.

    So the procedure stops and returns:
        - NOT CREDIBLE if Step 4.1 applies.
        - Otherwise, it computes a score and returns CREDIBLE, NOT CREDIBLE, or UNDECIDED (if in the middle).
        - Then, even if CREDIBLE, we note that the committee must separately decide if the signaled trait is one we want to reward.

  The procedure must be run in the order of the questions. We now apply it to the three cases.

  Case 1: Software Company - Joint Research Lab

