prompt: |-
  Writing a dissertation chapter on fiscal crises and state formation, and I keep arguing with a friend in the philosophy department about what actually counts as an explanation in history. Here are my verdicts, going purely on gut, and I want the principle behind them.

  1. "States that debase their currency by more than 30% within a decade get inflation within two years," applied to third-century Rome: explains, but thinly — like an answer to a why-question I wasn't asking.
  2. A 900-page narrative that strings together everything documented about 1792–94 in order: not an explanation of the Terror. A very long chronicle.
  3. The July Crisis — the assassination, the misread telegram, the blank cheque, the mobilisation timetables — stitched into one story with the ministers' reasons inside it: explains, and I feel no need for any law underneath.
  4. "Fiscal crisis plus elite fragmentation produces revolution," fitted after the fact to 1789, 1917 and 1979: explains nothing, even though the fit is perfect.
  5. A cliodynamics-style model that recovers the ~50-year instability cycles in three premodern states from a few coupled equations, with no archives and no named individuals: explains, weakly — and I can't say why that feels different from (4).
  6. "The bridge collapsed because the load exceeded the rivets' tensile strength": explains completely, and I want no story at all.

  So the pairs I can't reconcile are (4)/(5) and (1)/(6): structurally similar, opposite verdicts. My tentative principle: an account explains an outcome iff it puts you in a position to answer some counterfactual about that outcome that you couldn't answer before. Test it against my six and repair it if it breaks, then tell me what it says about two cases I can't settle — explaining why something didn't happen (the Song economy never industrialising), and explaining an outcome whose causes look like pure absences (a garrison that doesn't mutiny because nobody organised it). And be straight about which of my verdicts a decent principle would make me give up.
reasoning: |-
  Okay, I'm looking at this user's query about historical explanation. They're writing a dissertation chapter on fiscal crises and state formation and seem frustrated by ongoing debates with a philosopher friend about what constitutes a proper explanation in history. Their six case examples reveal a tension between narrative, structural, and law-like approaches.

  Hmm... they've proposed a counterfactual-based principle as a possible solution but want it stress-tested. Interesting how their "gut feelings" create clear patterns: they dismiss covering laws (4) but accept cliodynamics (5), reject thin correlations (1) but embrace engineering explanations (6). The real puzzle is why they accept (5) but not (4) when both are structural.

  I notice their academic position - a historian wrestling with philosophy of history while maintaining disciplinary instincts. Their examples skew toward state crises (Rome, Terror, Revolutions) which aligns with their dissertation topic. The unspoken need might be for a defensible methodology that satisfies philosophical rigor without betraying historical practice.

  Ah! The counterfactual test they propose is actually quite sophisticated - it echoes James Woodward's interventionist theory of causation. But let me verify if it holds across their cases. For (1), the currency debasement "explanation" would allow counterfactuals like "Had Rome debased under 30%, would inflation still have occurred?" - which might be answerable, so their "thin" verdict fits. But for (4), post-hoc revolution patterns don't generate new counterfactuals - if you change "elite fragmentation," does revolution still occur? The model doesn't say, hence "explains nothing."

  Their stubborn cases are revealing. Why did Song China not industrialize? A good explanation should support counterfactuals like "If coal deposits were nearer rivers, would industrialization have occurred?" For the non-mutiny case: "If someone had organized, would mutiny have happened?" The absence-of-cause case is tricky - perhaps the explanation lies in all the positive factors that maintained loyalty.

  I think they'll need to reconsider their verdict on (5). That cliodynamics model might actually support counterfactuals about parameter changes ("If tax elasticity were higher, would cycles lengthen?"), so by their own principle, it should count as explanatory. They might be biased against (4) because it's curve-fitting, while (5) predicts patterns.

  The deeper need here seems to be justifying historical practice to philosophers without reducing history to physics or storytelling. Their principle elegantly does that by making explanation relative to the question asked. A historian asking "Why no Song industrialization?" needs different explanations than an economist asking about preconditions for growth.

  For the final verdicts: they should upgrade (5) to "explains," downgrade (1) to "barely explains," and accept that (4) fails because it's not counterfactual-supporting. The garrison case shows how their principle handles absences - the explanation is all the present factors that made organization unnecessary or impossible. That feels satisfyingly historical.
answer: |-
  Based on your intuitions and the counterfactual test principle ("an account explains an outcome iff it puts you in a position to answer some counterfactual about that outcome that you couldn't answer before"), here's a refined principle, tested against your cases, with verdict adjustments and applications to your unsettled cases:

  **Refined Principle:**  
  An account explains an outcome *to a specific audience/question* **iff** it identifies **manipulable conditions** (factors that could conceivably be different) whose presence/absence answers **relevant counterfactuals** about that outcome (e.g., "Would Y still occur if X were different?").

  ### Test Against Your Cases:
  1.  **"States that debase currency >30%..." for Rome:**  
      *Fits your verdict ("explains thinly").*  
      **Counterfactual:** "Had Rome debased <30%, would inflation still have occurred within two years?" → *Maybe*. The "law" suggests "no," but it ignores context (e.g., grain supply shocks). It answers *one* narrow counterfactual, but not the historian's deeper "why" (e.g., why debase at all? why *this* crisis?).
      *Principle Verdict:* **Weakly explains** (only answers one crude counterfactual).

  2.  **900-page narrative chronicle of 1792-94:**  
      *Fits your verdict ("not an explanation").*  
      **Counterfactual:** Answers no specific "what if?" without additional analysis. It *provides material* for explanation but doesn't structure it around manipulable factors causing the Terror.  
      *Principle Verdict:* **Does not explain** (no manipulable factors highlighted).

  3.  **July Crisis narrative with ministers' reasons:**  
      *Fits your verdict ("explains").*  
      **Counterfactual:** "Had Berchtold not issued the blank cheque, would war still have erupted in August 1914?" or "Had the assassin missed, would war have been avoided?" The narrative, by integrating decisions and constraints, lets us reason about alternatives.  
      *Principle Verdict:* **Explains** (identifies manipulable decisions/events and their context).

  4.  **"Fiscal crisis + elite fragmentation = revolution" (post-hoc fit):**  
      *Fits your verdict ("explains nothing").*  
      **Counterfactual:** "If elite fragmentation were absent in 1789 France, would revolution have been avoided?" → The "model" doesn't tell us; it merely labels these factors present *after* knowing the outcome. It identifies no *specific mechanisms* or *thresholds*.  
      *Principle Verdict:* **Does not explain** (curve-fitting ≠ identifying manipulable conditions; no new counterfactual power).

  5.  **Cliodynamics model of instability cycles:**  
      *Challenges your verdict ("explains weakly").*  
      **Counterfactual:** "If parameter X (e.g., elite competition rate) were halved in the model, would cycle length increase?" → *Yes, the model answers this.* It identifies manipulable variables (model parameters) and their causal impact on the outcome (cycle length).  
      *Revised Verdict:* **Explains** (mechanistically, for the *pattern*). Your unease might stem from its distance from human agency/narrative or its inability to explain *specific* events within the cycle.  
      *Key Difference from (4):* (5) is a *generative mechanism* (equations define relationships), not just a correlation label. It supports *interventions* on model parameters.

  6.  **"Bridge collapsed due to rivet overload":**  
      *Fits your verdict ("explains completely").*  
      **Counterfactual:** "If the load had been below tensile strength, would the bridge have collapsed?" → *Clearly "no."* It pinpoints a specific, manipulable condition (load) exceeding a critical threshold.  
      *Principle Verdict:* **Explains** (precisely answers the relevant "what if?").

  ### Verdicts You Must Give Up:
  *   **#5 (Cliodynamics):** Your principle forces you to accept it as explanatory (even if "thinly" for specific events). Your gut might conflate "explains the general pattern" with "explains specific historical instances."
  *   **#1 (Debasement "Law"):** Your principle shows it *does* explain weakly (answering one counterfactual), but you must accept its limitations compared to richer explanations.

  ### Applying the Principle to Your Unsettled Cases:

  1.  **Explaining Non-Occurrence (Song Dynasty Industrialization):**  
      *   **Question:** Why didn't Song China industrialize despite advanced markets/tech?
      *   **Explanation Needs:** Must identify *manipulable conditions present elsewhere but absent in Song China* OR *manipulable conditions present in Song that blocked it*.
      *   **Counterfactual Test:** A good explanation should answer: "If [Condition X] had been present in Song China (or [Condition Y] absent), would sustained industrialization have likely occurred?"  
          *   *Example (Good):* "Song China lacked accessible, large-scale coal deposits near major iron sources (unlike Britain). If large coal deposits near Kaifeng/Loyang had been easily minable, iron production could have scaled sufficiently to enable industrial takeoff." → Answers counterfactual.
          *   *Example (Bad):* "Confucian values inhibited innovation." → Vague; doesn't specify manipulable condition or mechanism (Which values? How? Could they have changed?).

  2.  **Explaining via Absence (Non-Mutiny of Garrison):**  
      *   **Question:** Why didn't the garrison mutiny? (Implied: Conditions were ripe, but it didn't happen).
      *   **Explanation Needs:** Must identify the *presence* of a manipulable factor that *prevented* the mutiny, where its absence would have allowed it. Explaining by absence (no organizer) only works if the *presence* of an organizer was a necessary manipulable condition *for mutiny*.
      *   **Counterfactual Test:** A good explanation should answer: "If [Preventing Condition Z] had been absent (or [Enabling Condition W] present), would mutiny have occurred?"  
          *   *Example (Good):* "The garrison commander maintained high personal loyalty through regular pay, shared hardship, and visible bravery. If the commander had been corrupt/absent, or pay had been severely delayed, organized mutiny would likely have occurred." → Focuses on manipulable *positive* factors preventing the outcome.
          *   *Example (Using Absence):* "Mutiny requires organized leadership. No credible leader emerged willing/able to organize it. If a charismatic, disgruntled junior officer had actively recruited conspirators, mutiny would likely have occurred." → Identifies the *absence of a specific enabling condition* (organizer) as the key manipulable factor whose *presence* would have changed the outcome.

  ### Conclusion:
  Your counterfactual principle is powerful, aligning well with influential views (e.g., James Woodward's interventionist theory). The key refinements are:
  1.  **Manipulability:** Explanatory factors must be things that could conceivably differ (ruling out mere descriptive labels/post-hoc patterns like #4).
  2.  **Relevance to Question:** Explanation is relative to the specific "why?" being asked (e.g., #1 answers a narrow why-inflation, not why-crisis).
  3.  **Mechanism (Implicitly):** Supporting counterfactuals requires some account of *how* the factors make a difference (#3 narrative, #5 equations, #6 physics all provide this; #4 does not).

  This principle validates your rejection of post-hoc "laws" (#4) and chronicles (#2), embraces narrative (#3) and mechanistic (#5, #6) explanations, and successfully handles tricky cases like non-occurrence and absence by demanding focus on *what could have been changed* to alter the outcome.
