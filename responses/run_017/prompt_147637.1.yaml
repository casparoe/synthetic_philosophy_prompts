prompt: |-
  My friend (she's a wildlife vet tech, I'm a backend engineer, so neither of us has any real philosophy background) has been getting into animal suffering stuff and turns out to have pretty firm opinions about wild-animal cases, so I've started keeping a list of her verdicts because I can't tell whether there's one coherent rule underneath or whether she's just going by vibes. Her calls so far: oral rabies vaccine baited out for foxes and coyotes, where the outbreak traced back to unvaccinated dogs people brought in — she's all for it. Fencing plus underpasses under a highway so deer stop getting hit — for it. A wildlife hospital that patches up individual injured animals one at a time, window-strike hawks and orphaned fawns and so on, which does literally nothing at the population level — she's for it, and she volunteers there on weekends. A city that wants to shrink a herd of extremely fat, well-fed suburban deer, either with immunocontraception darts or by hiring sharpshooters — she's against both, which surprised me because I'd of thought she'd at least like the non-lethal version. A proposal to turn a decommissioned strip mine into a big rewilded reserve — against it, with some line about how you'd be manufacturing a whole pile of lives that will mostly go badly. And basically always, for every case, she'd rather fund more research than act yet. She's also said she has no idea whether insects matter at all and doesn't want to touch anything insect-related in either direction, if that's a clue about anything.

  Here's the case I actually want to put to her, and I'd rather work out what she should say than argue with her about it. There's a island nobody has really touched — no introduced predators, no human-caused mess to clean up — with a native mouse species that booms and busts: the population explodes, then crashes, and during the crash a large fraction of them spend a week or two slowly starving or freezing to death. One team wants to release a self-spreading fertility-control agent, some gene-drive-ish thing that biases inheritance so litters get smaller generation over generation, which over about ten years would cut the population by maybe 70%. No mouse alive now is made worse off, and the mice who do exist have lives roughly as good as before; there are just far fewer of them each generation, and the line might eventually wink out on that island entirely. A second team wants to do what's standard for clearing rodents off islands — poison bait spread over a few days — which by everyone's numbers prevents more starvation down the line but obviously also kills every mouse currently alive. Oh, and the mice are the main food for a native owl, so fewer mice probably means fewer owls too.

  I don't so much care which of the two she picks as I do about this: what's the rule she seems to be running, what other rules fit all her earlier calls about as well, what each of those rules says about the fertility-control option and the poison option (including the "neither yet, fund a study first" answer), which of her old verdicts is the closest analog to this one, and if her track record genuinely doesn't settle it, what's the single follow-up case I should put to her that would actually split the remaining options apart?
reasoning: |-
  Okay, the user is presenting a complex ethical dilemma involving wildlife management, specifically about reducing the population of native mice on an untouched island to prevent boom-bust cycles that cause suffering. Their friend, a wildlife vet tech, has a pattern of decisions in similar cases, and the user wants to deduce the underlying ethical principle guiding her choices without direct confrontation. 

  First, I need to map the friend's past positions to identify patterns. She supports oral rabies vaccines (indirect harm reduction via prevention), highway underpasses (infrastructure to prevent direct harm), and individual wildlife rehabilitation (direct intervention for already-injured animals). But she opposes both lethal and non-lethal deer culling (preventative population control) and rewilding projects (creating new populations where suffering might occur). Consistently, she prefers funding research over immediate action and avoids insect-related interventions entirely. 

  The unifying theme seems to be a focus on *individual suffering* rather than population-level outcomes, with a strong aversion to proactive interventions that might create new suffering or cut lives short. Her support for rehab (helping existing injured individuals) versus opposition to deer culling (ending lives prematurely) suggests she prioritizes existing lives over hypothetical future ones. The rewilding objection ("manufacturing lives that will go badly") explicitly rejects creating potential suffering. 

  Now, for the island mice case: the fertility control method avoids immediate harm to current mice but reduces future populations (and owls dependent on them), while poisoning prevents future starvation by killing current mice. If her principle is "minimize direct harm to existing individuals," she should prefer fertility control—it doesn’t actively kill anyone. But if she’s against "manufacturing suffering," she might see the status quo (natural cycles) as preferable to intervention. Her deer culling opposition (even non-lethal) hints she dislikes human-driven population manipulation, which could extend to fertility control. 

  The closest analog is her rewilding stance: both involve human decisions that shape future population existence/suffering. If she views fertility control as analogous to "not creating lives," she might support it; if she sees it as unnatural meddling, she might oppose it. The poison option mirrors the deer culling case (direct killing), which she opposed. 

  If her existing positions don’t resolve this, a clarifying case could be: *Should we sterilize squirrels in an overpopulated park where starvation is imminent?* If she supports it, her rule is "prevent future suffering without killing." If she opposes, her aversion to population manipulation runs deeper. 

  The user’s unspoken need might be understanding whether their friend’s ethics are consistent (for productive conversation) or if deeper values (like anti-interventionism) drive her views. They might also want to anticipate her response to advocate effectively for conservation strategies.
answer: |-
  Based on her track record, your friend's ethical framework appears most consistent with **Negative Utilitarianism Prioritizing Existing Individuals & Avoiding Manufactured Suffering**, with a strong **Precautionary Principle** bias. Let's break it down:

  1.  **The Core Rule:**
      *   **Primary Goal:** Minimize intense suffering *to existing individuals*.
      *   **Key Constraints:**
          *   **Avoid Actively Ending Lives:** Interventions causing direct, immediate death (like sharpshooting, poison) are strongly disfavored unless *overwhelmingly* necessary to prevent vastly greater suffering to *existing* individuals (e.g., rabies outbreak).
          *   **Avoid Creating New Suffering:** Opposes actions that deliberately *create* new lives/populations where significant suffering is highly probable (e.g., rewilding a mine).
          *   **Benefit Existing Individuals:** Favors interventions that directly alleviate suffering or prevent imminent harm to *existing* individuals without killing them (e.g., vaccines preventing disease, underpasses preventing collisions, rehab helping injured animals).
      *   **Precautionary Principle:** Strong preference for inaction/research when impacts are uncertain, complex, or ripple effects are unknown (e.g., insects, often favoring research).

  2.  **Applying the Rule to Her Past Verdicts:**
      *   **Oral Rabies Vaccine (FOR):** Prevents immense suffering/death *to existing* foxes/coyotes/dogs from a horrific disease outbreak. Indirect action (vaccine bait), doesn't *directly* kill.
      *   **Highway Fencing/Underpasses (FOR):** Prevents direct, violent death/suffering *to existing* deer attempting to cross. Benefits individuals immediately.
      *   **Wildlife Hospital (FOR):** Directly alleviates suffering and saves lives of *existing, identifiable* injured individuals. Tangible benefit to current animals.
      *   **Deer Culling (AGAINST lethal & non-lethal):** *Lethal (Sharpshooters):* Actively ends lives of *existing* individuals who are currently "fat and well-fed" (not suffering). *Non-Lethal (Immunocontraception):* Doesn't kill existing individuals *directly*, BUT it *prevents* future lives from existing. She likely sees this as akin to "manufacturing" non-existence for potential future deer (similar to the rewilding objection) *and* fails to address any current suffering (since they are thriving). It's population control without a clear, immediate benefit to *existing* individuals' welfare.
      *   **Rewilding Mine (AGAINST):** Explicitly "manufactures" a new population where "lives will mostly go badly" (predictable suffering). Creates future suffering.
      *   **Research Preference:** Uncertainty aversion (Precautionary Principle) - fears unintended suffering from poorly understood actions.

  3.  **Applying the Rule to the Island Mice Case:**
      *   **Fertility Control (Gene Drive):**
          *   **Pros:** Does *not* harm *any existing* mouse. Prevents *future* intense suffering (starvation/freezing) by drastically reducing boom populations.
          *   **Cons:** Deliberately prevents the existence of vast numbers of *future* mice. Likely leads to the extinction of this mouse population on the island (preventing *all* future lives). Indirectly harms *existing owls* and prevents future owls through reduced food (loss of existing owl lives/welfare).
          *   **Her Likely Verdict (Based on Rule): AGAINST.** This strongly triggers her "avoid manufacturing non-existence/future lives" constraint. It prevents future mice (like immunocontraception prevents future deer) and actively engineers the end of a lineage (like rewilding creates a lineage, but in reverse). While it prevents future suffering, her rule prioritizes *not creating/manipulating existence* over preventing suffering *in potential future beings*. Harm to owls is a significant additional negative for existing individuals.
      *   **Poison Bait:**
          *   **Pros:** Prevents *future* intense suffering (starvation/freezing) by eliminating the population quickly. "Permanent solution."
          *   **Cons:** Actively causes intense suffering and death to *all existing* mice. Also kills owls dependent on them (direct harm to existing predators).
          *   **Her Likely Verdict (Based on Rule): STRONGLY AGAINST.** This directly, actively kills *existing* individuals who are not currently suffering (they are in a boom phase). This is anathema to her core principle, as seen in her deer culling opposition. The owl deaths compound this.
      *   **Neither, Fund Research (Her Default):** The complexity (extinction risk, ecosystem impact on owls, long-term gene drive effects, accuracy of suffering predictions) screams uncertainty. Her precautionary principle will likely kick in hard. **VERDICT: FOR RESEARCH / AGAINST BOTH ACTIONS FOR NOW.**

  4.  **Closest Analog:**
      *   The **Deer Immunocontraception** case is the strongest analog. Both involve non-lethal fertility control aimed at reducing a population to prevent future problems (overpopulation suffering vs. boom/bust suffering). She opposed immunocontraception for deer, viewing it as unacceptable manipulation preventing future lives without benefiting current individuals. The mouse case adds extinction and owl impacts, making it even *less* palatable under her rule. The poison option is directly analogous to the deer sharpshooting, which she also opposed.

  5.  **Splitting the Follow-Up Case:**
      If her track record genuinely leaves ambiguity (e.g., is preventing *massive, predictable* future suffering enough to override her aversion to preventing future lives?), pose this scenario:

      **"An isolated valley has a dense population of squirrels facing imminent, severe famine this winter due to a failed mast crop. Starvation is guaranteed for ~80% over the next 3 months, involving prolonged suffering. We can:**
      *   **(A) Do nothing.**
      *   **(B) Distribute safe, effective oral contraceptives *now*, reducing next spring's litter sizes by 90%, preventing the famine next year but meaning fewer squirrels exist this spring.**
      *   **(C) Cull 70% of the population humanely but immediately before winter."**

      *   **Why this splits:** It isolates the "prevent future suffering via non-lethal fertility control" question.
          *   If she chooses **B (Contraceptives)**, it suggests preventing *imminent, massive, predictable* suffering *to potential future individuals* can override her aversion to preventing those lives, especially if done non-lethally and benefiting *future* existing individuals (the squirrels that *would* have starved next year).
          *   If she chooses **A (Do Nothing)**, it confirms her aversion to preventing future lives is absolute, even to avoid immense predictable suffering. The suffering will happen to squirrels that *already exist* next year, but the intervention prevents their *conception*.
          *   If she chooses **C (Cull)**, it contradicts her past opposition to lethal control and suggests a drastic shift towards "greater good" utilitarianism only in extreme, immediate suffering scenarios (but unlikely based on her deer stance).
          *   **Her likely choice based on her rule: A (Do Nothing) or strong preference for research.** Culling harms existing individuals. Contraceptives prevent future lives. Doing nothing allows the natural (awful) process to occur without her intervention causing death *or* preventing existence. Research might explore emergency feeding (if feasible without long-term harm) but carries risks too.

  **Conclusion:** Based solely on her past positions, she would **oppose both the fertility control and poison options for the mice, favoring funding more research first.** The fertility control prevents future lives (like immunocontraception for deer and rewilding the mine), violating her core constraint against "manufacturing non-existence." The poison actively kills existing individuals, violating her constraint against direct harm. The owl impact further harms existing individuals under both plans. Her framework prioritizes the concrete welfare of currently living beings and avoids actions that deliberately create or prevent existence over preventing potential future suffering to beings not yet conceived. The follow-up case tests the strength of her aversion to preventing future lives against truly massive, imminent suffering. Expect "fund research" to be her default answer.
