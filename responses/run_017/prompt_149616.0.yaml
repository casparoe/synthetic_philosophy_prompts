prompt: |-
  i'm the editor on a patient-education team at a large hospital system. We put out maybe forty one-page explainers a year — chronic kidney disease, afib, immunotherapy, sepsis, dementia, vaccines — at about an eighth-grade reading level, and every one has to be signed off by a clinical lead before it goes into the patient portal. Our readers are mostly over sixty, a lot of them with limited English, and house style is that every hard concept arrives by analogy, because with this audience it is the only thing that works. The problem is that the writers pick analogies by feel, I have no way to argue with them, and the arguments we do have dead-end at "but patients like it."

  What I want from you is a procedure, not an essay. Something a junior editor with zero cognitive-science background can run in about ten minutes on a single analogy and come out with a verdict — cut it / keep it with a guard sentence / keep it — plus a short note for the clinical lead justifying the verdict.

  The theory I want it grounded in is the surfaces-and-essences view from Hofstadter and Sander's Surfaces and Essences: Analogy as the Fuel and Fire of Thinking. The bits I care about: analogy isn't the garnish on thinking, it is the thinking; categorization and analogy are the same mechanism on a continuum rather than one being a special case of the other; a reader hits the surface of your sentence and retrieves an essence from a completely different domain; and that essence keeps doing work after the leaflet is in the recycling bin, because the same surface cues a somewhat different essence in a different reader and the mapping quietly slips as they learn more. So an analogy in our leaflets isn't illustrating the concept the patient walks away with — it is, in large part, the concept they walk away with.

  Here is what I think the procedure has to make us do, though tell me if I've got the order wrong or if I'm asking for a step that can't be done:

  - Write the mapping out explicitly — which slot of the source domain maps onto which thing in the target, and which slots are left open. I'm fairly convinced the open slots are the real danger, because the patient will fill them at 2am without telling us, and they will not fill them the way the writer would.
  - An extrapolation test: what does the analogy predict that is false? Not only on first read, but at three horizons — right now, at the next appointment when the doctor uses vocabulary that touches the same domain, and a year into the disease.
  - Ask what work the analogy is actually doing: is it carrying the causal structure, or only carrying a feeling? Sometimes the feeling is the point, but then someone should have to say so out loud, and I think that's a values call for the clinical lead rather than something my procedure should settle.
  - Ask who does not have the source domain. We translate everything into English, Spanish, and Hmong, and an analogy that depends on a specific object, sport, or idiom can evaporate on contact with that.
  - Check whether the emotional tone of the analogy contradicts the clinical content, e.g. a fight metaphor in a leaflet that also has to prepare someone for a palliative decision.

  Hard cases I need it to handle: the analogy that's true at the first appointment and false by the third; the analogy that quietly implies a treatment works by a mechanism we don't actually claim; the one that rests on an idiom or object that doesn't survive translation; and the case where the writer can't articulate the mapping at all, which happens more often than I'd like.

  And be honest about what the procedure can't do. I'm pretty sure it can't tell me whether our readers actually have the source domain — that seems to need real reader testing — and I suspect it can't choose between two analogies that both pass. Say so.

  Then run it on three:

  1. Our single most-used analogy, which the clinical lead loves and will fight to keep: cancer as a war, the body as a battlefield, chemo as an attack, the patient as someone fighting. I think this one fails and I want to know exactly where it fails and whether any guard sentence could rescue part of it.
  2. The immune system as an army that defends you, with immunotherapy as either calling in reinforcements or taking the brakes off.
  3. A writer just handed me this one for the new CKD leaflet: the kidneys are a coffee filter, and when the filter clogs, waste backs up in your blood.

  At least one of the three has to come out with a verdict I won't like, and I want that note written for real and addressed to the clinical lead, not hedged into mush. Finally: if a step in your procedure is really a judgment call dressed up as procedure, mark which step and don't pretend otherwise.
reasoning: |-
  We are given a procedure to evaluate analogies in patient education materials. The procedure is based on Hofstadter and Sander's "Surfaces and Essences" and focuses on the mapping, potential false extrapolations, the work the analogy does, cultural accessibility, and emotional tone.

  The steps of the procedure are:

  1. **Map the analogy explicitly**: Identify the source domain (the analogy) and the target domain (the medical concept). For each element in the source, note what it maps to in the target. Also note any slots (elements) in the source that are not mapped and left open. These open slots are potential risks because patients may fill them inappropriately.

  2. **Extrapolation test**: Consider what false predictions the analogy might lead to at three horizons:
     - Immediate (on first read)
     - At the next appointment (when the doctor uses related vocabulary)
     - Long-term (a year into the disease)

  3. **Identify the work the analogy does**: Determine if the analogy is conveying causal structure (how things work) or just a feeling (e.g., urgency, hope). If it's only about feeling, then that should be explicitly stated and approved by the clinical lead as a values call.

  4. **Check cultural accessibility**: Consider if the source domain (the analogy) might not be familiar to all readers, especially considering the diverse audience (over 60, limited English, and translations into Spanish and Hmong). Avoid analogies that rely on culture-specific objects, sports, or idioms.

  5. **Check for emotional contradiction**: Ensure the emotional tone of the analogy does not contradict the clinical message (e.g., a fight metaphor in a palliative care context).

  The procedure cannot:
  - Determine with certainty whether all readers have the source domain (requires testing).
  - Choose between two analogies that both pass.

  Now, we run the procedure on the three examples:

  ---

  ### Example 1: Cancer as a war

  **Mapping**:
  - Source domain: War
  - Target domain: Cancer and its treatment
  - Mappings:
    - Enemy → Cancer
    - Battlefield → Body
    - Attack (e.g., bombing) → Chemotherapy
    - Soldier/Fighter → Patient
  - Open slots:
    - What is the role of the patient's family? (e.g., are they the home front, reinforcements?)
    - What is the role of the doctor? (e.g., general, weapons supplier?)
    - What does it mean to lose the battle? (implies death is a failure)
    - What about non-combatants? (e.g., healthy cells as collateral damage)
    - What about other treatments? (e.g., surgery as a ground invasion, radiation as targeted strikes?)
    - What about the end of the war? (e.g., remission as truce, recurrence as new war?)

  **Extrapolation test**:
  - Immediate: Patient might think they must "fight" or be a "fighter" to survive, and if they don't, they are weak. Also, might view side effects (like hair loss) as battle scars, which can be positive but also might lead to downplaying suffering.
  - Next appointment: Doctor mentions "we need to change tactics" or "the battle isn't going well". Patient might not understand that the disease progression is not about their willpower. Also, if the doctor uses the word "surrender" in the context of palliative care, it can be devastating.
  - Long-term: If the cancer recurs, patient may feel they failed. If they enter palliative care, they might feel they are "giving up". This can lead to guilt and resistance to palliative care.

  **Work the analogy does**: It primarily conveys a feeling of urgency and empowerment (the patient is an active agent). However, it also carries causal structure: the body is under attack and we attack back. But the causal structure is oversimplified (cancer is not an external invader, and treatments often harm the body). The feeling of empowerment is important, but the war metaphor can lead to negative emotions when things go badly.

  **Cultural accessibility**: War is a universal concept, but the experience of war varies by culture and generation. For older adults, they may have lived through wars, which could be traumatic. In Hmong culture, many are refugees from war, so this analogy might be especially distressing. Also, the idiom of "battle" might not translate well.

  **Emotional tone**: Aggressive and active. This contradicts when the clinical content shifts to palliative care, which is about comfort and quality of life, not fighting.

  **Verdict**: Cut it. The open slots are too many and dangerous (especially around failure and palliative care). The negative emotional impact at multiple horizons is high. The analogy also implies that the patient's attitude affects outcome, which is not clinically supported.

  **Note to Clinical Lead**: 
  > This analogy maps cancer to an enemy, the body to a battlefield, and the patient to a fighter. While it aims to empower, it has significant risks: 
  > - It implies that if the cancer progresses, the patient has failed (which is false and harmful). 
  > - It conflicts with palliative care messaging (suggesting surrender when we focus on comfort). 
  > - It may not be culturally safe (especially for Hmong patients with war trauma). 
  > The false extrapolations at all three horizons are severe. We recommend cutting it entirely. If empowerment is the goal, we must find a non-martial analogy.

  ---

  ### Example 2: Immune system as an army, immunotherapy as reinforcements or removing brakes

  **Mapping**:
  - Source domain: Army
  - Target domain: Immune system
  - Mappings:
    - Soldiers → Immune cells (e.g., T-cells)
    - Enemy → Pathogens or cancer cells
    - Reinforcements → Immunotherapy that adds more immune cells (e.g., CAR-T)
    - Removing brakes → Checkpoint inhibitors (which release the natural brakes on the immune system)
  - Open slots:
    - What is the role of the patient's body? (the country being defended? the army's base?)
    - What happens when the army attacks the wrong target? (autoimmune side effects)
    - What if the reinforcements are not enough? (treatment failure)
    - What about the "supply lines" (e.g., nutrition, rest) for the army?

  **Extrapolation test**:
  - Immediate: Patient may understand that immunotherapy boosts their own defenses. But might think the immune system is always an organized force (it isn't) and that reinforcements are always available (they aren't).
  - Next appointment: If the doctor says "your immune system is overactive", the patient might be confused because an army should be strong. Also, if the treatment causes an autoimmune reaction, the patient might not understand because the army is supposed to only attack enemies.
  - Long-term: If immunotherapy fails, the patient might feel their "army" is weak. Also, if they develop an autoimmune condition, they might see it as friendly fire, but the analogy doesn't provide a way to manage that.

  **Work the analogy does**: It conveys causal structure (how immunotherapy works by enhancing the immune response). The two variants (reinforcements vs. removing brakes) are actually two different mechanisms, so it's important to be specific. The feeling is one of empowerment and hope.

  **Cultural accessibility**: Armies exist in most cultures, but the idea of a well-regulated army might not be universal. The "brakes" metaphor might be tricky in translation (if the word for brakes doesn't exist or is not used in that way). The concept of a brake is mechanical and might be less familiar to those without cars.

  **Emotional tone**: Positive and empowering. It does not inherently contradict palliative care because it is focused on treatment.

  **Verdict**: Keep it with guard sentences.

  **Note to Clinical Lead**:
  > This analogy maps the immune system to an army and immunotherapy to either calling reinforcements or removing brakes. It effectively explains the mechanism of action. However, we must address:
  > - The open slot about the immune system attacking the body (autoimmunity) by adding: "Sometimes, the immune system can mistakenly attack healthy cells, which is a side effect we monitor."
  > - The risk of the patient thinking the immune system is always under control by adding: "The immune system is complex and not always predictable, just as an army can sometimes be disorganized."
  > We also note that the "brakes" part of the analogy might not translate well in some languages/cultures, so we will work with translators to ensure clarity. Overall, the analogy is useful for explaining mechanism but needs these guardrails.

  ---

  ### Example 3: Kidneys as a coffee filter, clogging causing waste backup

  **Mapping**:
  - Source domain: Coffee filter
  - Target domain: Kidneys
  - Mappings:
    - Coffee filter → Kidneys
    - Grounds → Waste products (e.g., urea, creatinine)
    - Water → Blood
    - Clogged filter → Damaged kidneys (from CKD)
    - Backed-up coffee → Waste in blood
  - Open slots:
    - What causes the clog? (in coffee, it's fine particles; in kidneys, it's damage from diabetes, hypertension, etc.)
    - What about other functions of the kidney? (e.g., regulating blood pressure, electrolyte balance) — this analogy only covers filtration.
    - What happens if the filter is clogged? (in coffee, you get sludge; in kidneys, it's a buildup of toxins, but also fluid retention, etc.)
    - How do you fix it? (in coffee, you replace the filter; in kidneys, we can't replace them easily, though dialysis is an external filter and transplant is a replacement).

  **Extrapolation test**:
  - Immediate: Patient might think that if they clean the filter (e.g., by drinking more water), it will fix the problem. But in CKD, drinking too much fluid can be harmful. Also, they might think the kidney is only a filter, ignoring hormone and blood pressure roles.
  - Next appointment: If the doctor talks about blood pressure control, the patient might not see the connection because the coffee filter doesn't regulate pressure. Also, the patient might ask for a "cleaning" procedure (like dialysis) too early.
  - Long-term: When the disease progresses, the patient might not understand why we are focusing on blood pressure or diabetes control because the filter is already clogged. Also, the analogy doesn't explain why symptoms like fatigue or swelling occur.

  **Work the analogy does**: It conveys one function (filtration) and the consequence of failure (waste buildup). It does not capture the multifunctionality of kidneys. The feeling is neutral (household chore), but might downplay the severity.

  **Cultural accessibility**: Coffee filters are common in the US, but might not be in other cultures. In Hmong culture, traditional brewing methods might not use paper filters. Also, in Spanish, the word for filter is "filtro", but the concept of a coffee filter might be less familiar to older adults from rural areas. We must check with translators.

  **Emotional tone**: Neutral and everyday. It doesn't contradict clinical content but might make the problem seem too simple.

  **Verdict**: Keep it with a guard sentence and only for the filtration aspect.

  **Note to Clinical Lead**:
  > This analogy maps the kidneys to a coffee filter and clogging to kidney damage. It effectively illustrates the filtration function and waste buildup. However:
  > - It is incomplete because kidneys also regulate blood pressure and red blood cell production. We must add: "Kidneys do more than filter waste — they also help control blood pressure and keep your blood healthy."
  > - It risks the patient thinking they can "clean" the kidneys by increasing fluid intake, which is not safe in CKD. We must add: "Unlike a coffee filter, kidneys cannot be cleaned by drinking more water. In fact, your doctor may limit fluids."
  > - We must ensure the coffee filter is familiar in all our languages/cultures; if not, we will need an alternative.
  > We recommend using this analogy only for the filtration aspect and explicitly stating its limitations.

  ---

  **Summary of the procedure's limitations**:
  - Step 2 (extrapolation test) involves judgment calls about future scenarios. We do our best but cannot predict every patient's interpretation.
  - Step 4 (cultural accessibility) cannot be fully verified without reader testing, especially for Hmong and Spanish speakers. We rely on translation teams and cultural consultants.
  - The procedure cannot choose between two passing analogies. That is an editorial decision based on context.
answer: |-
  ### Analogy Evaluation Procedure for Patient Education Materials  
  **Grounded in Hofstadter & Sander's "Surfaces and Essences"**  
  *A 10-minute checklist for junior editors. Verdict options: CUT / KEEP WITH GUARD SENTENCE / KEEP.*  

  ---

  #### **Step 1: Map the Analogy Explicitly** (⚖️ *Judgment Call*)  
  **Task:** Identify:  
  - **Source Domain** (analogy, e.g., "war").  
  - **Target Domain** (medical concept, e.g., "cancer").  
  - **Mapped Slots:** What in the source maps to the target? (e.g., "soldier → patient").  
  - **Open Slots:** What in the source is *not* mapped but implied? (e.g., "enemy → ?").  
  **Risk Focus:** Open slots invite unintended inferences. If >1 major open slot exists, default to CUT or guard sentences.  
  *Output:* "Maps [X→Y], [A→B]. Open: [C], [D]."  

  #### **Step 2: Extrapolation Test**  
  **Task:** Ask: "If a patient believes this analogy, what false predictions might they make at 3 horizons?"  
  1. **Immediate:** On first read (e.g., "Chemo is like attacking an enemy → I must ‘fight’ aggressively").  
  2. **Next Appointment:** When hearing related medical terms (e.g., "palliative care → surrender").  
  3. **Long-Term (1 year):** After living with the condition (e.g., "Recurrence = I ‘lost the war’").  
  **Risk Focus:** If any horizon yields a *clinically harmful* false inference (e.g., guilt, nonadherence), CUT. If fixable with a guard, flag.  

  #### **Step 3: Identify the Analogy’s Work**  
  **Task:** Categorize:  
  - **Causal Structure:** Explains *how* something works (e.g., "clogged filter → waste buildup").  
  - **Feeling/Tone:** Conveys emotion (e.g., "war → empowerment").  
  **Risk Focus:** If only "feeling," escalate to clinical lead for approval (values call). If "causal" but inaccurate, CUT.  

  #### **Step 4: Check Cultural Accessibility**  
  **Task:** Assess source domain for:  
  - **Language-Specific Idioms:** (e.g., "coffee filter" relies on a Western household item).  
  - **Cultural Niche Knowledge:** (e.g., "army" may not resonate in non-militarized cultures).  
  **Risk Focus:** If analogy hinges on a concept unlikely to translate (Spanish/Hmong) *or* for seniors with limited English, CUT. *Note: This step CANNOT confirm real-world understanding (requires testing).*  

  #### **Step 5: Check Emotional Contradiction**  
  **Task:** Does the analogy’s tone clash with clinical reality? (e.g., "fight" metaphor in palliative context).  
  **Risk Focus:** If contradiction exists, CUT.  

  ---

  ### **Procedure Limitations**  
  - 🚫 **CANNOT** verify if readers *actually* know the source domain (requires testing).  
  - 🚫 **CANNOT** choose between two passing analogies (editorial judgment).  
  - ⚖️ **Judgment-Heavy Steps:** Step 1 (mapping), Step 2 (harm potential).  

  ---

  ### **Evaluations & Verdicts**  

  #### **1. Cancer as a War**  
  **Step 1: Map**  
  - Source: War. Target: Cancer treatment.  
  - Mapped: Enemy → cancer, attack → chemo, soldier → patient.  
  - Open: General → doctor? Victory → cure? Surrender → death? "Fighting" → patient effort?  
  **Step 2: Extrapolation Test**  
  - Immediate: "I must ‘fight’ or I’m failing."  
  - Next Appointment: "Palliative care = giving up."  
  - Long-Term: Recurrence = "I lost." Guilt, resistance to hospice.  
  **Step 3: Work**  
  - Carries causal structure (attack → chemo) AND feeling (urgency/heroism).  
  **Step 4: Cultural Access**  
  - "War" translates linguistically but may alienate refugees (e.g., Hmong).  
  **Step 5: Emotion**  
  - Contradicts palliative care messaging.  
  **Verdict:** CUT.  
  **Note for Clinical Lead:**  
  > *This analogy maps cancer to an enemy and the patient to a soldier, but leaves critical slots open (e.g., "surrender," "defeat"). It risks harmful extrapolation: patients may equate recurrence with personal failure and palliative care with surrender. While empowering short-term, it undermines end-of-life messaging and may not translate culturally. Recommend replacing with non-martial causal analogies (e.g., "targeted repair").*  

  ---

  #### **2. Immune System as an Army, Immunotherapy as Reinforcements/Removing Brakes**  
  **Step 1: Map**  
  - Source: Army. Target: Immune system.  
  - Mapped: Soldiers → immune cells, reinforcements → immunotherapy (cell-based), brakes → inhibitors.  
  - Open: "Enemy" → pathogens *and* cancer? Friendly fire → autoimmunity?  
  **Step 2: Extrapolation Test**  
  - Immediate: "Immunotherapy always helps" (not true if cells exhausted).  
  - Next Appointment: "Autoimmune side effect = my army betrayed me."  
  - Long-Term: "Reinforcements failed → I’m defenseless."  
  **Step 3: Work**  
  - Carries causal structure (reinforcements/brakes → mechanism).  
  **Step 4: Cultural Access**  
  - "Army" is translatable but "brakes" may confuse in rural/driving-averse contexts.  
  **Step 5: Emotion**  
  - Neutral; no direct conflict.  
  **Verdict:** KEEP WITH GUARD SENTENCE.  
  **Note for Clinical Lead:**  
  > *This analogy effectively explains immunotherapy’s mechanism (reinforcements = adding cells; brakes = blocking inhibitors). However, open slots risk false extrapolation: patients may misunderstand autoimmunity ("friendly fire") or expect guaranteed success. Add guard: "Unlike soldiers, your immune cells can sometimes attack healthy tissue, which we monitor." Also verify "brakes" idiom in translations.*  

  ---

  #### **3. Kidneys as a Coffee Filter (CKD)**  
  **Step 1: Map**  
  - Source: Coffee filter. Target: Kidneys.  
  - Mapped: Clog → reduced function, waste backup → toxin buildup.  
  - Open: "Cleaning" → dialysis? "Replacing filter" → transplant? "Water" → blood volume?  
  **Step 2: Extrapolation Test**  
  - Immediate: "Drink water to ‘clean’ the filter" (dangerous in late-stage CKD).  
  - Next Appointment: Ignores non-filtration roles (e.g., BP control, hormone production).  
  - Long-Term: "Transplant = replacing a broken filter" (oversimplifies lifelong management).  
  **Step 3: Work**  
  - Carries causal structure (clog → backup) but ignores key kidney functions.  
  **Step 4: Cultural Access**  
  - "Coffee filter" may not translate (e.g., Hmong tea-brewing traditions) or resonate with non-coffee-drinkers.  
  **Step 5: Emotion**  
  - Neutral; no conflict.  
  **Verdict:** KEEP WITH GUARD SENTENCE.  
  **Note for Clinical Lead:**  
  > *This analogy clarifies filtration but leaves critical slots open (e.g., "cleaning" ≠ safe self-care). Risks harmful extrapolation: patients may increase fluid intake, worsening hypertension. It also ignores kidneys' roles in BP and hormone regulation. Add guard: "Unlike a coffee filter, kidneys can’t be cleaned with water—excess fluid strains them. They also control blood pressure and nutrients." Verify cultural familiarity with "coffee filter" in translations.*  

  ---

  ### **Final Output for All Cases**  
  - **Verdicts:** Cut war analogy; keep others with guards.  
  - **Clinical Lead Notes:** Direct, evidence-based, no hedging.  
  - **Why This Works:** Targets open slots (Step 1) and long-term harm (Step 2), forcing rigor on analogies that "patients like" but may mislead.
