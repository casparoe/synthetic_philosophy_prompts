prompt: |-
  You are a professional philosopher specialising in philosophical logic and the philosophy of language, with years of work on vagueness behind you. Please work slowly and carefully: before committing yourself, sketch out for your own benefit the space of candidate principles you might offer me — the standard ones, the hybrids, the ugly ones — and run each against the verdicts below, because I would rather have two or three precisely stated candidates with their costs spelled out than one tidy story that quietly abandons a case it cannot handle. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restatement of my question. Please write in British English.

  I am finishing a thesis chapter in legal theory on how standards — reasonable care, dependant child, permanently incapacitated — get applied at the margin, and I have been trying to work out what I actually think about vagueness by going case by case rather than by signing up to a theory. My supervisor thinks the whole debate is a pseudo-problem generated by an over-literal picture of meaning; a friend in formal semantics thinks my verdicts are simply inconsistent and that I should grow up and either be an epistemicist in Williamson's style, with sharp boundaries somewhere and permanent ignorance of where, or a supervaluationist in Fine's style, with a range of admissible precisifications and determinate truth as truth on all of them. I have resisted both, and here is roughly where I land. (a) A man with eight hairs is bald, a man with a full head is not, and in the stage version — a machine removing one hair a second while he stands there — I do not think there is a hair count at which he becomes bald: no fact of the matter, not merely no way of telling. (b) Run the machine in reverse, adding hairs one a second to a freshly shaved head, and — this is the verdict I am least sure of, and the one my friend laughs at — I think the transition, if there were one, would not be at the same point: the count at which he stops being bald going up is not the count at which he starts being bald going down. (c) A committee of seven whose exact ages I know, say 34, 41, 47, 52, 58, 61 and 63, is neither determinately young nor determinately not young, and here the ignorance story seems to me to have nothing to work with, because there is nothing further about those ages to discover. (d) Likewise for a baldness judgement where I know the exact hair count, the exact scalp coverage and the pattern of loss: still indeterminate, and not through any gap in my information. (e) But when a grant panel has to decide whether an applicant is bald for a subsidy, with full photographs and counts in front of it, I think there is a determinate right answer for them to reach, one they could get wrong, and that it is fixed by what the subsidy is for even though no one could derive it. (f) Of a borderline case I will happily assert that either Jack is bald or he is not, and I will also assert that it is not determinate whether Jack is bald; I do not want to give up either. (g) If Jill has more hair than Jack, I take it that if Jack is bald then Jill is bald is determinately true even though neither Jack is bald nor Jill is bald is determinate, and this seems to me the strongest point in favour of the supervaluationist picture. (h) Yet I also think second-order borderline cases are real — there are cases that are borderline borderline — and I deny that whenever it is not determinate whether Jack is bald it is determinate that it is not determinate whether Jack is bald; that collapse of higher-order vagueness into a single sharp boundary is, to me, what sinks the supervaluationist treatment of determinately. (i) And when a legal definition tries to help by saying that bald means noticeably hairless to a casual observer, I do not think the vagueness disappears; it moves into noticeably and casual observer, and I do not believe there is a bottom level of perfectly precise predicates that the vague ones abbreviate.

  The principle I have been toying with, and which I want tested rather than flattered, goes like this: a predicate is vague for a speaker or a context just in case her dispositions to apply it, together with the purpose at hand, leave open a range of admissible ways of making it precise and nothing else settles which is in force; a sentence is determinately true when true on every admissible precisification; the purpose at hand narrows the range and can in principle narrow it to one, which is what makes (e) come out determinate, while the route by which the question was reached helps settle which precisifications count as admissible in the first place, which is what is supposed to explain (b); and the range never closes for good, which is what second-order borderline cases consist in. Can you tell me, first, whether that survives (a) to (i) and where it has to be repaired — in particular whether the purpose clause can do the work I need in (e) without making every vague predicate sharp the moment it appears in a statute or a form, and whether the route clause in (b) is coherent at all rather than a muddle between my use of a predicate and the property it tracks; second, what the repaired account predicts for two cases I have not listed, say a standard whose very purpose is contested, such as dependant child in a statute whose drafters disagreed about why dependence matters, and a predicate whose users are all dead and whose use-dispositions we have reconstructed exhaustively from a corpus; and third, and most usefully, which of my verdicts each candidate cannot accommodate, and which of them I ought to abandon if I want a principle worth having at all.
reasoning: |-
  Alright, let's tackle this step by step. The user is working on a thesis in legal theory about vague standards like "reasonable care" and needs to test their principle against specific cases. They've listed their intuitions from (a) to (i), and they're skeptical of both epistemicism and supervaluationism. Their own principle involves dispositions, purposes, and admissible precisifications, with context narrowing the range.

  First, I need to check if their principle handles all their cases. For (a) and (b), the hysteresis effect (different transition points based on direction) might be explained by the "route" clause. But how does that work without conflating use and property? Maybe the history of application affects which precisifications are admissible in that context. For (e), the purpose in a legal context could narrow precisifications to one, making a determinate answer. But they worry this might oversharpen all legal predicates. The key is whether "purpose" is strong enough to force a single precisification only in specific cases, like when all contextual factors align.

  Second-order vagueness in (h) and (i) is tricky. If the range of admissible precisifications is itself vague, higher-order vagueness emerges. But how does the "never closes for good" work without infinite regress? Perhaps it's a matter of the dispositions not fixing boundaries at any order. 

  For the new cases: contested purpose, like "dependent child" with drafters' disagreement. Here, the purpose is unclear, so multiple precisifications might remain admissible, leading to indeterminacy. For the reconstructed predicate from a corpus, even with exhaustive data, without a living community's dispositions, the range might still be open if the original context's purpose doesn't pin it down.

  Now, comparing theories. Epistemicism struggles with (c), (d), (f) because it posits unknowable sharp boundaries, but the user denies any hidden facts. Supervaluationism handles (g) but fails (h) by collapsing higher-order vagueness. Contextualism might help with (e) but could oversharpen in legal settings. Relativism or dialetheism are options but have their own issues.

  The user's principle seems promising but needs refinement. The route clause must be part of the context, affecting which precisifications are admissible. The purpose shouldn't always force a single cut-off; it depends on whether the context provides enough constraints. Abandoning (b) might be necessary if the hysteresis can't be coherently integrated, but let's see if it can be saved by emphasizing contextual factors like directionality in application.

  In conclusion, their principle mostly holds but requires careful handling of context and purpose to avoid over-sharpening and to explain hysteresis without conflating use and property.
answer: |-
  Your proposed principle—contextual supervaluationism with purpose-driven precisification and hysteresis via application route—largely survives (a) to (i) but requires refinement to handle legal sharpening and coherence in (b). Below, I test it against your cases, repair weaknesses, and compare alternatives. I then apply it to your new cases and summarise which verdicts each rival theory must abandon.

  ### **1. Testing Your Principle Against (a)-(i)**
  - **Successes**:  
    - (a) No fact about a precise baldness threshold: **Supported** (multiple admissible precisifications).  
    - (c), (d) Determinacy not resolved by more information: **Supported** (dispositions leave range open).  
    - (e) Legal determinacy via purpose: **Supported** if "purpose" forces a unique precisification (e.g., subsidy aims fix "bald" relative to social visibility).  
    - (f) Retains excluded middle *and* indeterminacy: **Supported** (supervaluationist core: "Jack is bald or not" true on all precisifications; "not determinate" true if precisifications disagree).  
    - (g) Monotonicity (more hair → less bald): **Supported** (if all precisifications respect hair ordering).  
    - (h) Higher-order vagueness: **Supported** ("range never closes for good" makes admissibility itself vague).  
    - (i) Vagueness shifts to "noticeably": **Supported** (no bottom-level precision; new predicates inherit open dispositions).  

  - **Repairs Needed**:  
    - **(b) Hysteresis (asymmetry in transition points)**:  
      - **Problem**: Your "route by which the question was reached" risks conflating *temporal application history* (a psychological/contextual factor) with *semantic content*. If precisifications are fixed by dispositions + purpose, why should directionality affect admissibility?  
      - **Repair**: Embed "route" within *context*. Dispositions for "bald" may include *contrast-class sensitivity*: adding hair invokes "regrowth" contexts (tolerance for sparse hair), removing hair invokes "loss" contexts (stricter thresholds). Admissible precisifications thus shift with the operative contrast.  
      - **Coherence**: Defensible if dispositions are dynamic and purpose includes *direction of change* (e.g., benefit eligibility vs. disability assessment).  
    - **(e) Legal Sharpening Without Over-Sharpening**:  
      - **Problem**: If statutes *always* narrow precisifications to one, all legal predicates become precise—contradicting (i) and real legal disputes.  
      - **Repair**: Restrict sharpening to contexts where purpose + institutional constraints (e.g., grant panel rules) *exhaustively determine* a unique outcome. Ambiguous purposes (e.g., "dependant child" with contested intent) leave multiple precisifications admissible → indeterminacy persists (see §2).  

  ### **2. Predictions for New Cases**
  - **Contested Purpose ("Dependant Child")**:  
    - Drafters' disagreement → conflicting purposes → multiple precisifications remain admissible.  
    - **Result**: *Indeterminate* for borderline cases (e.g., a 19-year-old part-time student). No "right answer" without further adjudicative context.  

  - **Reconstructed Predicate from Corpus (Dead Users)**:  
    - Exhaustive corpus data fixes *past* dispositions but not *present* purpose.  
    - **Result**: If applied in a modern context (e.g., interpreting a historical text), purpose may be vague → range of precisifications open → borderline cases indeterminate. If purpose is fixed (e.g., re-enacting a law), determinacy *may* arise.  

  ### **3. Candidate Theories and Their Costs**
  Each theory forces abandonment of some verdicts. Your rejections of epistemicism and standard supervaluationism are justified given your commitments.  

  | **Theory**               | **Must Abandon**                                  | **Why Incompatible**                                                                 |
  |--------------------------|--------------------------------------------------|--------------------------------------------------------------------------------------|
  | **Epistemicism** (Williamson) | (a), (c), (d), (f), (h)                  | Denies genuine indeterminacy: sharp boundaries exist but are unknowable. Contradicts your "no fact of the matter" in (a), (c), (d). Higher-order vagueness collapses (h). |
  | **Standard Supervaluationism** (Fine) | (b), (h)                               | No hysteresis: precisifications are static → symmetric transitions. "Determinately" has sharp boundaries → no higher-order vagueness (h). |
  | **Contextualism** (e.g., Raffman) | (f)                                  | Vague sentences are always true/false relative to a context; denies simultaneous truth of "P or not-P" *and* "indeterminate P". |
  | **Relativism** (e.g., MacFarlane) | (e)                                  | Legal determinacy requires objective truth; relativism makes truth assessment-sensitive → no "wrong" panel decision. |
  | **Dialetheism** (e.g., Priest) | (g)                                  | Borderline cases are both true *and* false → violates monotonicity (if Jack is bald and Jill isn’t, Jill could still be bald). |
  | **Your Repaired Principle** | *None* (but (b) requires care)       | Accommodates all by blending supervaluationism, contextual factors, and purpose-relative admissibility. |

  ### **Bottom Line**
  Your principle—refined to treat "route" as contextually embedded contrast-sensitivity and "purpose" as sharpening *only* when exhaustively constraining—survives (a)-(i) and handles new cases without over-legalising vagueness. Abandoning (b)'s hysteresis would simplify matters, but it can be coherently integrated. If you insist on keeping all verdicts, this hybrid is your best candidate; epistemicism or standard supervaluationism demand deeper sacrifices.
