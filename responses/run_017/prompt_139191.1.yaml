     - The rule: The price of D after learning an event E must equal the fair price of the conditional bet on C given A after learning E. Why? Because D is supposed to represent the conditional, and the conditional's value should track the conditional bet.
     - After learning C: 
            The conditional bet on C given A after learning C: 
               Since we now know C, and C implies A (because if C is true then the roll is 1, which is in A), then we know A and C. So the conditional bet pays $1. Hence, the fair price is 1.
            So we require: P(D|C) = 1.
     - After learning ¬C:
            The conditional bet on C given A after learning ¬C:
               We know ¬C. Now, if A occurs, then we are in the event A and ¬C (roll in {2,3,4}), so the bet would pay $0. If A does not occur, the bet is refunded. But note: the fair price now is P(C|A, ¬C). However, given ¬C, the event A and C is impossible. And conditional on ¬C, the event A is still possible (rolls 2,3,4). Then the conditional probability of C given A and ¬C is 0 (because we already know ¬C). So the fair price is 0.
            So we require: P(D|¬C) = 0.

