prompt: |-
  I teach an upper-level undergraduate seminar on probability and conditionals — 16 students, one 75-minute session. They have had conditional probability, the axioms, and the betting/Dutch-book reading of credences, but nothing on the triviality literature; the two weeks after this one cover the suppositional treatment of conditionals and then possible-worlds semantics, so this session should leave a problem sitting on the table that those views have to answer.

  I want a classroom activity that makes them feel the force of Lewis's triviality results before anyone names them: not a proof on the board, not an illustration, but a game in which they run into the collapse themselves and only afterwards learn what they ran into. Constraints: no real money and no stakes beyond play money or points; no lecture up front beyond five minutes on how a called-off bet is settled; the label and Lewis's name should not appear until after the collapse.

  Here is the argument I want them to hit. Please check it and tell me plainly if any step needs a premise I have not named, or if I have it wrong. Setup: a fair die, A = the roll is 1, 2, 3 or 4, C = the roll is 1, D = if A then C. Premises: (i) the fair price of a conditional bet — stake placed only if A, called off and refunded if A fails — is P(C|A) = 1/4 of the stake, and nobody disputes this; (ii) the equation: the conditional sentence D expresses a proposition of its own with a price, and that price equals the conditional-bet price, so P(D) = P(C|A) = 1/4; (iii) D is an ordinary proposition in the algebra — buyable, sellable, negatable, and available as something to condition on; (iv) stability: (ii) holds not just in the opening market but after any public announcement E, so in the market conditional on C the price of D is P(C|A∧C) = 1, and in the market conditional on ¬C it is P(C|A∧¬C) = 0; (v) the case is non-degenerate: P(A∧C) > 0 and P(A∧¬C) > 0. From (iv), D is worth a dollar whenever C holds and nothing whenever C fails, so D and C are the same ticket and P(D) = P(C) = 1/6 — which contradicts (ii). And the general shape is that the equation plus stability forces P(C|A) = P(C) for every non-degenerate pair, i.e. learning A never moves your price on C.

  My rough idea for the arc, which you should keep only if it is the best thing you can build: open by eliciting prices on A and on C and getting conditional bets priced with no resistance; then ask for a price on a ticket that pays on D and let them notice that 1/4 is not available in a six-cell space; let them escape by enriching the space with an extra randomizer, which forces a gerrymandered truth table; then close the trap with the rule that encodes (iv), which is exactly what forbids that truth table. Replace it with something better if you can, but commit to one design — a single runnable activity, not a menu of options.

  Please give me: the rules as participants will encounter them (what a team must post, what it may refuse, and what happens when it cannot comply); roles, including who plays the house or auditor and whether that should be a student; a materials list; a scoring or payoff scheme that needs no real money and that rewards holding a coherent price sheet under pressure; a minute-by-minute timeline for 75 minutes; and a debrief that maps the moments where things went wrong onto the premises above and onto the steps of the derivation. The debrief should also say which premise is doing the real damage and where a student who refuses it thinks they have gotten off cheaply.

  Then be honest about two things. First, what will predictably go wrong the first time I run it — I expect the conditional-bet/bet-on-a-conditional conflation, the granularity of the die being mistaken for the point, degenerate cases with zero-probability antecedents, uneven finishing times, and at least one student insisting D has no truth value when A is false — and how I should handle each without turning the session into a lecture. Second, what the activity cannot do: my sense is that the collapse is manufactured by house rules that a philosopher could simply decline, that a single pair in a finite space cannot display the generality of the result over a language closed under the conditional, and that the game cannot tell the difference between the available escape routes, so the facilitator must supply those and their costs. Tell me if there is more that belongs on that list.

  Finally, commit. Give me one activity with definite choices and your reasons for them; take a definite position on which premise the debrief should nudge students toward surrendering and what that position costs them; flag any step of my reconstruction that is mistaken or under-supported; and add a short note on where your design depends on one particular reading of the triviality results rather than on another.
reasoning: |-
  We are going to design a classroom activity that leads students to encounter Lewis's triviality result in a game-like setting without naming it until the end. The goal is for them to experience the collapse of the probability of a conditional to the probability of the consequent.

  The core of the argument (as per your setup) is:
  - A fair die is rolled: outcomes 1 to 6 equally likely.
  - Let A: roll is 1,2,3,4 (antecedent)
  - Let C: roll is 1 (consequent)
  - Let D: the conditional "If A then C", which we are treating as a proposition.

  Premises:
  (i) The fair price for a conditional bet on C given A (which pays $1 if A and C, $0 if A and not C, and is refunded if not A) is P(C|A) = 1/4 (since P(C|A) = P(roll is 1 | roll in {1,2,3,4}) = 1/4).
  (ii) We assume that the conditional D is a proposition that can be bought and sold, and that its fair price is the same as the conditional bet: P(D) = P(C|A) = 1/4.
  (iii) D is an ordinary proposition in the algebra (so we can condition on it, negate it, etc.)
  (iv) Stability: The equation in (ii) holds not only initially but also after conditioning on any event E (public announcement). In particular, after conditioning on C, we have P(D|C) = P(C|A∧C) = 1, and after conditioning on ¬C, P(D|¬C) = P(C|A∧¬C) = 0.
  (v) Non-degeneracy: P(A∧C)>0 and P(A∧¬C)>0 (which holds because A∧C is roll=1, and A∧¬C is roll in {2,3,4}).

  Then, from (iv) we see that D is equivalent to C: because if C is true then D is true (since conditioning on C gives D with probability 1) and if C is false then D is false (conditioning on ¬C gives D with probability 0). Hence D and C are the same proposition, so P(D)=P(C)=1/6, contradicting (ii) which says P(D)=1/4.

  The activity will simulate a market in which students take on the role of bookies (or teams of bookies) who must post prices for various bets, including conditional bets and bets on the conditional D. The trap is set by requiring them to also post conditional prices (i.e., prices after certain announcements) and then forcing a contradiction.

  Design:

  Activity Title: The Conditional Betting Game

  Roles:
  - Each team (of 2-4 students) is a bookie. There should be 4-5 teams (so 16 students in 4 teams of 4, or 5 teams of 3-4). 
  - One student (or the instructor) plays the Auditor (or Regulator) who checks the prices for coherence and enforces rules.

  Materials:
  - A six-sided die (or a virtual die roller if in a virtual classroom).
  - Play money (or points) for each team (say, $1000 starting capital).
  - Price sheets (printed or on a shared document) for each team to post their prices for various bets.
  - A timer.

  Bets and Tickets:
  We will have the following tickets (each pays $1 if the condition holds, $0 otherwise, unless otherwise specified):
  1. A: the roll is in {1,2,3,4}
  2. C: the roll is 1
  3. Conditional bet on C given A: This ticket costs $P (to be set by the bookie) and pays $1 if A and C occur, $0 if A occurs and not C, and is refunded (so the net gain is $1 - $P if A and C, -$P if A and not C, and 0 if not A).
  4. D: the conditional "If A then C", which we interpret as a proposition. The ticket pays $1 if D is true, $0 otherwise. But note: the truth conditions for D are not specified! This is the crux.

  Additionally, we require teams to post conditional prices. Specifically, they must post:
  - The price of D given C (i.e., after learning C)
  - The price of D given not C (after learning not C)

  And also the unconditional price of D.

  Rules of the Game:

  1. Teams start with $1000 in play money.
  2. The Auditor will announce a series of rounds. In each round, teams must post a price for each ticket (A, C, the conditional bet on C given A, and D). They must also post the conditional prices: P(D|C) and P(D|¬C). All prices must be between 0 and 1 (inclusive).
  3. The prices must satisfy the following coherence constraints (enforced by the Auditor):
     a. The price for A must be P(A) = 4/6 = 2/3.
     b. The price for C must be P(C)=1/6.
     c. The price for the conditional bet on C given A must be P(C|A)=1/4. (This is non-negotiable because it is a straightforward conditional probability and the students already know this.)
     d. The price for D must be set by the team, but they must also set conditional prices for D given C and D given ¬C.
     e. The conditional prices must satisfy: the price of D given C must be the same as the conditional bet on C given A and C? Actually, we need to enforce stability: so we require that the conditional price P(D|C) must be the same as the conditional bet on C given A and C. But note: if we condition on C, then A and C is just the event that A occurs and C occurs? Actually, conditioning on C, the event A∧C is just the event {1} (if C is true, then the roll is 1, and then A is also true). So P(C|A∧C) = 1. Similarly, conditioning on ¬C, then A∧C is impossible and A∧¬C is the event that the roll is in {2,3,4} (and A is true). Then P(C|A∧¬C) = 0.

  But note: we are requiring that the conditional price of D given C is P(D|C) and we want that to be 1 (by stability). Similarly, P(D|¬C)=0.

  However, we cannot force the teams to set these conditional prices arbitrarily. Instead, we will enforce that the conditional prices must be set to what the conditional probability would be after the announcement. But note: the teams are free to set any prices as long as they are coherent? Actually, the point is that they must set the conditional prices for D in a way that is consistent with the stability assumption (which we are building into the rules). So we will require:

     - P(D|C) = 1
     - P(D|¬C) = 0

  Why? Because we are implementing premise (iv) by fiat. The rule is: after conditioning on C, the team must set the price of D to 1 (because if C is true then D must be true? But wait: we haven't defined truth for D). This is the rule we impose to mimic the stability condition.

  But note: we are not giving the students an option. We are forcing the stability condition. This is the key to the collapse.

  4. In each round, after posting prices, the Auditor will check for coherence. The prices must satisfy:
     - The unconditional prices must be consistent with the conditional prices via the law of total probability: 
          P(D) = P(D|C)*P(C) + P(D|¬C)*P(¬C)
     - And we are forcing P(D|C)=1 and P(D|¬C)=0, so:
          P(D) = 1 * (1/6) + 0 * (5/6) = 1/6.

  But wait: we also require that P(D) = P(C|A) = 1/4. So we have:
          Required: P(D) = 1/4 and P(D) = 1/6 -> contradiction.

  So the teams are required to set:
     P(D|C) = 1
     P(D|¬C) = 0
     and also set P(D) = P(C|A) = 1/4.

  But then the law of total probability forces:
     P(D) = P(D|C)*P(C) + P(D|¬C)*P(¬C) = 1 * (1/6) + 0 * (5/6) = 1/6.

  So they must set P(D) to both 1/4 and 1/6? That's the contradiction.

  How do we run the activity without giving away the contradiction at the beginning?

  We break it into steps:

  Round 1: 
     - Teams post prices for A, C, the conditional bet on C given A, and D (unconditional).
     - They are told that the conditional bet must be 1/4, and A must be 2/3, C must be 1/6. But for D, they can choose any price they think is fair (but must be between 0 and 1).

     What will happen? Some might set D to 1/4 (because they think it's the same as the conditional bet). Others might set it to 1/6 (because they think D is equivalent to C). Others might set it to something else.

     The Auditor does not enforce the law of total probability yet. The Auditor only enforces that A is 2/3, C is 1/6, and the conditional bet is 1/4. D is free.

     Then the Auditor says: "Now, we require you to also post conditional prices for D. Specifically, what would be the fair price for D if we were to learn that C is true? And if we were to learn that C is false?"

     They must post P(D|C) and P(D|¬C). Again, they are free to set these arbitrarily? But we are going to force the stability condition. So the Auditor says: "But note: if we condition on C, then we are in a world where C is true. In that world, what is the conditional bet on C given A? Well, since C is true, then if A is true (which it will be because C implies A? Actually, no: C is roll=1, and A is roll in {1,2,3,4}. So if C is true then A is true? Yes! Because 1 is in A. So conditioning on C, we have A is true. Then the conditional bet on C given A: but now we know A and C, so it pays $1. Therefore, the conditional bet in this situation is worth $1. And by the stability assumption, we require that the price of D must equal the conditional bet price in every scenario. Therefore, when we condition on C, the price of D must be 1. Similarly, when we condition on ¬C, then the conditional bet on C given A: now we know ¬C, but we don't know A. However, if A is true then C is false, so the conditional bet pays 0. But what if A is false? Then the bet is called off. But note: we are conditioning on ¬C, which does not imply A or ¬A. However, the stability assumption requires that the conditional bet price after learning ¬C must be P(C|A, ¬C). But note: P(C|A, ¬C) is 0 (because we have learned ¬C, so conditional on A we have that C is false). Therefore, we require that the price of D after ¬C is 0.

     So the rule: 
          P(D|C) must be 1
          P(D|¬C) must be 0

     Now the teams must set these. Then the Auditor enforces the law of total probability: 
          P(D) must equal P(D|C)*P(C) + P(D|¬C)*P(¬C) = 1*(1/6) + 0*(5/6) = 1/6.

     But they have already set P(D) to something else (probably 1/4). So they are forced to change P(D) to 1/6? But then they are violating the requirement that P(D) should equal the conditional bet price (1/4). 

     How do we enforce that? We haven't required that P(D)=1/4 in the first round? We only required the conditional bet to be 1/4. For D, they were free. But now we are going to say: "Wait, we also require that the unconditional price of D must equal the price of the conditional bet (which is 1/4)." So we add that rule in Round 2?

     Alternatively, we can do:

     Round 1: 
          They set A, C, conditional bet, and D without the stability constraint on D's conditional prices.

     Then we introduce the stability constraint and the conditional prices, and then the law of total probability forces P(D)=1/6. Then we say: "But we also want that the price of D must equal the conditional bet price (1/4)." Then they see the contradiction.

     But we don't want to lecture. So let's design the rounds:

     We break into two phases.

  Phase 1: Setting the unconditional prices.
     - Teams post: 
          P(A) = 2/3
          P(C) = 1/6
          P(conditional bet on C|A) = 1/4
          P(D) = ? (free)

     The Auditor checks that P(A), P(C), and the conditional bet are set correctly. D is recorded.

  Phase 2: Introducing conditional prices and the stability assumption.
     - The Auditor: "Now, we need to consider how the price of D would change if we learned certain things. In particular, if we learned that C is true, what would be the fair price for D? And if we learned that C is false? Moreover, we have a rule: the price of D in any scenario must equal the price of the conditional bet on C given A in that scenario. Why? Because the conditional bet is the operational meaning of the conditional, so the value of D should track it even after learning new information."

     Then the rule is:
          After learning any event E, the price of D must equal the conditional bet price on C given A in the new situation (i.e., conditional on E).

     Specifically, after learning C, the conditional bet price becomes P(C|A∧C). But since C implies A (in this case), then A∧C is just C. And P(C|A∧C) = P(C|C) = 1. So P(D|C)=1.
          After learning ¬C, the conditional bet price becomes P(C|A∧¬C). In this case, A∧¬C is the event that the roll is in {2,3,4}. Then P(C|A∧¬C)=0 (since C is roll=1, and {2,3,4} does not contain 1). So P(D|¬C)=0.

     So the teams must set:
          P(D|C) = 1
          P(D|¬C) = 0

     Now, the Auditor says: "You must also ensure that your prices are coherent. The unconditional price of D must be the weighted average of the conditional prices by the probabilities of the conditions. That is:
          P(D) = P(D|C)*P(C) + P(D|¬C)*P(¬C)
     Plug in the numbers: 
          P(D) = 1 * (1/6) + 0 * (5/6) = 1/6.

     But in Phase 1, you set P(D) to [whatever, probably 1/4]. So you must change your unconditional price of D to 1/6 to be coherent.

     Then the Auditor says: "But remember: we require that the unconditional price of D must equal the unconditional conditional bet price, which is 1/4. So we have:
          P(D) must be 1/4 (by the equation) and must be 1/6 (by coherence) -> contradiction.

     The teams are stuck.

  Activity Timeline (75 minutes):

  0-5 min: Introduction and rules.
     - Explain the setup: a fair six-sided die. Define events:
          A: roll in {1,2,3,4}
          C: roll is 1
          D: the conditional "If A then C" (meaning: if the roll is in {1,2,3,4} then it is 1).
     - Explain the tickets: 
          Ticket A: pays $1 if A occurs.
          Ticket C: pays $1 if C occurs.
          Conditional bet on C given A: costs $p. If A occurs, then it pays $1 if C occurs and $0 if not; if A does not occur, the $p is refunded. The fair price is known to be 1/4.
          Ticket D: pays $1 if D is true. But what is the truth of D? We are going to figure that out by how we price it.

     - Each team is a bookie. They must post prices (as fractions or decimals) for these tickets. The prices must be fair (so they are willing to buy or sell at that price). They start with $1000.

     - The Auditor will check for coherence (no Dutch books) and enforce known probabilities.

  5-15 min: Phase 1 (Unconditional prices)
