          Price for A: must be 2/3 (if they post something else, Auditor corrects)
          Price for C: must be 1/6
          Price for conditional bet on C given A: must be 1/4
          Price for D: let them choose.

     - Teams write these on a shared board.

  15-25 min: Phase 2 (Conditional prices and stability)
