          - Reject (ii)? That is, reject that the probability of the conditional is the conditional probability? 
          - Reject (iv)? That is, the probability of the conditional does not equal the conditional probability after learning new evidence? 
          - Reject (iii)? That is, the conditional isn't a proposition? (Which is what Lewis concludes: conditionals don't express propositions.)

     - Note: in the debrief, we should point out that the stability condition is what forced D to be equivalent to C. Without stability, we could have set a truth table arbitrarily for D. But stability requires that D must be true when C is true and false when C is false, so it must be C.

     - The activity shows that if we want (ii) and (iv) and (iii) and (v), then we get a contradiction. So at least one must go.

  65-75 min: Looking Ahead
