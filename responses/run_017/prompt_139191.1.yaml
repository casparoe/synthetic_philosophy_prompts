     - However, the Auditor then says: "But we also have a requirement that the unconditional price of D must equal the unconditional price of the conditional bet on C given A, which is 1/4. Therefore, we require P(D)=1/4."

     - The teams are now in a contradiction: they must set P(D)=1/4 and P(D)=1/6.

