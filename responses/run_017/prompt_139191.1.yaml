     - Teams are given time to resolve the contradiction. They can adjust any prices? But note: they are forced on A, C, conditional bet, and now on the conditional prices. The only freedom they had was P(D) in Phase 1, but now they are forced by coherence to set it to 1/6 and by the equation to set it to 1/4.
     - The Auditor will not let them change the fixed prices (A, C, conditional bet) or the conditional prices (because of the stability rule). So they are stuck.
     - The teams may try to change the truth conditions of D? But that's not allowed. They might argue that the stability rule is wrong? But that's built in.

     - The goal is for them to see the collapse: that D is forced to be equivalent to C. Because:
            D is true if and only if C is true? 
            Why? Because if C is true, then D must be true (since P(D|C)=1, meaning that when C is true, D is certain). And if C is false, then D must be false (since P(D|¬C)=0). Therefore, D and C are the same proposition.

     - So they should set the price of D to be the same as C: 1/6. But then why was the conditional bet 1/4? That remains a mystery unless they reject one of the premises.

  50-65 min: Discussion and Debrief
     - Bring the class together. Ask teams to report what they did and the contradiction they hit.
     - Then walk through the steps of the argument as in your reconstruction.
     - Highlight the premises:
          (i) Conditional bet pricing: non-controversial.
          (ii) Equation: P(D) = P(C|A) -> sets P(D)=1/4.
          (iii) D is a proposition: so we can do conditional pricing and use the law of total probability.
          (iv) Stability: the equation holds after conditioning -> forces P(D|C)=1 and P(D|¬C)=0.
          (v) Non-degenerate.

     - Then the law of total probability gives P(D)=1/6, contradicting (ii).

     - The collapse: D must be equivalent to C, so P(D)=P(C)=1/6, but then we must have P(C|A)=P(C) which is 1/6, but that's not 1/4 -> so the equation (ii) fails? Or stability fails? Or D isn't a proposition?

