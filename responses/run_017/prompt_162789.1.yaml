prompt: |-
  My old housemate Priya (data scientist, gave 10% for years, then got deep into the whole cluelessness thing and now mostly just does whatever she wants) has a strikingly consistent track record on the question of when consequentialist reasoning actually gets traction, and I want to predict her next call. No need to explain what cluelessness is, I've read the same blog posts you have.

  Her verdicts so far:

  - Bednets in a high-malaria region: not clueless, EV reasoning works, she gives. (She used to be smug about this one; after some stuff about population-size effects she downgraded to "probably fine, I've stopped being smug.")
  - Factory farming and her own diet: not clueless. "The suffering is right there, I don't need to model the year 2400."
  - Offsetting her flights home to see family: clueless. Additionality is unmeasurable, she genuinely has no idea about the sign, and she flies anyway without buying offsets and doesn't feel bad about it.
  - Voting: clueless. She votes, but she calls it expressive, not EV.
  - Having a second kid: clueless. She's doing it. She says it's a want, not a bet on the future.
  - Own career: clueless. She took the AI-adjacent research job over a global-health data job, and if you push her she'll say she'd bet the first one is better in expectation — but she refuses to call that an EV calculation.

  The new case. A funder I know is raising money for a stipend program that pays adolescent girls in one district of western Kenya to stay enrolled through secondary school, with a pre-registered follow-up at 10 and 20 years on earnings, age at first birth, and completed fertility. A seperate donor has already committed to paying the same stipend to the control group once the trial ends, so the "are we depriving the control group" worry is off the table and the only live question is the program's own effects. The pitch is half near-term (the schooling and later-earnings evidence is decent already) and half long-run-mechanistic (delay first births, fertility falls, and you get something demographic-dividend-ish in the local economy over a couple of decades). I have about 5k sitting around and I said I'd decide this week.

  So: is Priya going to call this clueless or not? I'm less interested in her answer than in the rule she's running. I can see two that fit all six of her verdicts — something like "cluelessness bites when the mechanism is unmeasurable, measured near-term effects are enough" versus "it bites whenever the effects run out through a chaotic, branching system like politics or demography or who-exists" — but there's probably a third I'm missing (something about near-term effects swamping the noise, or about identity-affecting effects specifically). Which of the rules that fit her track record actually disagree about this stipend program, which one do you think she's really running, and what's the single extra case you'd put to her that would best separate them?

  Don't hand me a menu. Pick the rule, give me the prediction that follows from it, tell me how confident you are, and say what would change your mind.
reasoning: |-
  Hmm, the user is asking about their friend Priya's decision-making framework regarding "cluelessness" in consequentialist reasoning. They've provided six examples of Priya's judgments on various actions and now want to predict whether she'd consider a new case - a stipend program for girls in Kenya - as clueless or not.

  Looking at Priya's pattern from the examples:
  - She approved bednets (direct, measurable impact) and factory farming (direct suffering)
  - But rejected offsetting flights (additionality unmeasurable), voting (system too chaotic), having kids (long-term effects uncertain), and career choice (despite claiming "expectation" she denies it's EV calculation)

  I see two possible rules that fit all cases:
  1) Measurability rule: Cluelessness applies when causal chains are unmeasurable
  2) Chaotic systems rule: Cluelessness applies when effects propagate through chaotic systems (politics, demography, identity)

  For the Kenyan stipend case:
  - The program has measurable near-term outcomes (earnings, fertility data)
  - But long-term economic effects involve demographic dividends - which touches demography and economics (chaotic systems)

  The chaotic systems rule would predict "clueless" here because of the demographic dividend mechanism, while the measurability rule would say "not clueless" due to pre-registered follow-ups capturing key outcomes.

  I think Priya is actually using the chaotic systems rule. When she rejected her career choice as EV calculation despite "betting it's better," she was avoiding endorsing the long-term chaotic consequences. The voting case also shows she dismisses systems where individual inputs get lost in noise.

  To test this, I'd propose a new case: funding mosquito gene drives. It has measurable extinction outcomes but chaotic ecosystem effects. If she calls it clueless, that confirms the chaotic systems rule; if not, she's using measurability.

  For the Kenyan program prediction: chaotic systems rule → clueless verdict (75% confidence). If we learned she accepts similar development programs with long-term mechanisms, I'd reconsider.
answer: |-
  Based on Priya's track record and the principles implied by her verdicts, I conclude she's running a **"Chaotic Propagation Rule"**: *Cluelessness applies when the primary mechanism of impact depends on effects propagating through complex, chaotic systems (e.g., politics, demography, identity-affecting chains) where noise dominates signal, even if near-term effects are measurable. Measurable near-term effects only avoid cluelessness if they are the terminal goal or don't trigger such propagation.*

  ### Prediction for the Stipend Program
  **Priya will call this CLUELESS.**  
  Confidence: **75%**  

  ### Why This Rule Fits All Six Verdicts
  1. **Bednets**: Near-term malaria reduction is the terminal goal. No chaotic propagation (just direct health outcomes). → *Not clueless.*  
  2. **Factory farming**: Suffering reduction is direct and terminal. No systemic propagation needed. → *Not clueless.*  
  3. **Flight offsets**: Relies on carbon markets/policy—a chaotic, politicized system. → *Clueless.*  
  4. **Voting**: Individual votes dissolve into noisy political systems. → *Clueless.*  
  5. **Second kid**: Identity-affecting effects ripple through demography/future society. → *Clueless.*  
  6. **Career choice**: AI-adjacent work risks unpredictable, chaotic long-term trajectories (e.g., via AGI). → *Clueless* (despite her "expectation" hedge).  

  ### Why the Stipend Program Triggers Cluelessness Under This Rule
  - The **near-term effects** (earnings, age at first birth) *are* measurable and might sway her—but they aren’t the endpoint. The pitch explicitly bets on a "demographic-dividend-ish" mechanism:  
    - Fertility changes → economic shifts → regional development.  
    - This propagates through **demographic/political/economic systems** (e.g., how lower fertility affects labor markets, which influences migration, policy, etc.).  
  - These systems are **chaotic and noise-dominated**: Small initial changes (e.g., slightly higher wages for some girls) could amplify unpredictably (e.g., altering local inflation, social norms, or even civil conflict). Priya’s rejection of voting and population-size effects in bednets shows she discounts such pathways.  
  - The control group cleanup removes one worry, but it doesn’t tame the long-run chaos. Priya’s career choice verdict confirms she dismisses "mechanistic" long bets even with near-term proxies.  

  ### The Rival Rule You Mentioned (and Why It Loses)
  - **"Measurability Rule"**: *Cluelessness bites only if key effects are unmeasurable.*  
    - Conflicts with her verdicts: Voting has measurable (if tiny) EV; career choice has measurable salary/impact. Yet she calls both clueless.  
    - For the stipend program: Pre-registered follow-ups make near-term outcomes measurable → predicts *not clueless*. But this fails her pattern.  

  ### The Decisive Test Case
  To separate the Chaotic Propagation Rule from alternatives (e.g., "identity-affecting effects are always clueless"), ask her:  
  > **"Funding a mosquito gene-drive trial to eradicate malaria in one island chain. Near-term effects on disease burden are measurable, but it might alter ecosystems or set precedents for bioengineering governance. Clueless?"**  

  - **Why this separates rules**:  
    - Near-term effects (malaria cases) are direct and measurable.  
    - Long-term effects run through chaotic systems (ecology, geopolitics).  
  - **Prediction under Chaotic Propagation Rule**: She calls it *clueless* (due to systemic propagation).  
  - If she calls it *not clueless*, she’s likely running a simpler "identity effects or bust" rule.  

  ### What Would Change My Mind
  - **If Priya endorses similar programs**: E.g., if she’s supported development interventions with demographic mechanisms before. (But her career choice suggests skepticism.)  
  - **If she emphasizes measurability over propagation**: E.g., if she called voting "not clueless" if poll data could prove pivotality (she didn’t).  
  - **New evidence she cares about "lock-in"**: If near-term effects irreversibly shape long-term outcomes (e.g., girls’ education shifting norms), she *might* see it as terminal. But her second kid verdict implies she treats fertility/demography as chaotic, not lock-in.  

  **Final call**: Bet against the stipend program. Priya’s pattern points to cluelessness here—demographic dividends are a textbook chaotic system, and she’s consistently balked at those.  

  ---  
  *P.S. For your $5k: If you *do* fund it, frame it as buying data on near-term effects (avoiding the demographic dividend pitch). Priya might respect that. But under her rule? She’ll still call it clueless.*
