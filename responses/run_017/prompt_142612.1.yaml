prompt: |-
  Eighteen months ago my father died and left my sister and me joint control of the small charitable fund he had set up. The deed gives each of us an independent annual allocation — roughly forty thousand pounds apiece — to disburse as we each see fit, provided only that it reaches a registered charity. Over the past two years my sister and I have discovered that we disagree about nearly every grant either of us proposes: I want the money to go where it does the most measurable good per pound, she wants it to go to the hospice and the parish youth work in the village where we grew up. We have been splitting the difference, and both of us now leave every meeting feeling that our half was simply wasted.

  A friend who works in philanthropy told me that what we have been groping toward has a name — moral trade — and I have since read just enough about it to think the fit is genuine but not perfect. Next month I have to put the idea to the fund's advisory panel in about forty minutes with nothing but a whiteboard. The panel is my sister; our father's old colleague, a retired actuary; and my cousin, a hospice nurse. None of the three has any philosophy or economics. My sister is quick, allergic to jargon, and will treat any hint of condescension as evidence that the whole scheme is a device for pointing her money at my causes.

  One complication runs through all of this and I do not know where in the session it belongs. My sister's objection to my preferred grants is not that she ranks them below hers. She holds that there are things she must not fund — that to direct money to them would be to cooperate in something seriously wrong, and that this remains true whatever she might get in return. I cannot tell whether that closes off the idea entirely or only forces us to look for a different lever, and I would rather find out from you than in front of her.

  So please do not explain moral trade to me; plan how I should explain it to them. I want: the order in which the component ideas have to arrive and what each one depends on, including what must be in place before a trade so much as looks available to people who share no scale of value; the single example that should carry the whole thing, what it must contain and what it must carefully not contain, and why that example rather than the vegetarianism-for-bednets sort of case, or rather than our own disagreement; the misconceptions to expect, in the order they will actually arise, with the point in the sequence at which each should be headed off — that it is just compromise, that it is vote-trading, that it is bribery, that a person who will act against her own convictions for a price never had any, that if her view is mistaken I should not be paying her to act on it, that we should simply argue until one of us wins, that if she would have funded the hospice anyway my concession buys nothing, and that both of us have an incentive to overstate how much we would hate conceding; where in the sequence my sister's constraint should enter and what the honest answer is about whether someone with a constraint of that shape can trade at all; one question I can ask at the end that would show the idea had landed rather than merely been endured; and what I should openly decline to explain at this level, naming it as a refusal. I am not asking you to adjudicate our disagreement about which causes are worth funding, and please do not point me to anything to read — I want the shape of the session, not sources.
reasoning: |-
  Hmm, the user is preparing to explain moral trade to a charitable fund advisory panel. This is a complex situation involving grief, family dynamics, and ethical philosophy. The user needs a practical presentation plan that avoids jargon and handles their sister's "moral constraint" sensitively.

  The core challenge is explaining how people with fundamentally different values can cooperate without compromising their principles. The sister believes funding certain causes is morally prohibited, not just less valuable - this isn't about ranking but about absolutes. I need to design an explanation that respects this while showing mutual benefit is possible.

  For the session structure: We should start with shared frustration to build engagement, then introduce the concept through a neutral example. The "art vs medicine" scenario works well here - it's relatable, contains no real-world triggers, and clearly shows how both sides gain something they couldn't achieve alone. Crucially, it avoids their actual conflict (hospice vs effective altruism) and the vegetarianism example which might imply moral equivalence.

  Key teaching points must include:
  - The difference between compromise (both lose) and trade (both gain)
  - Why this isn't bribery (no personal enrichment)
  - How to handle the "overstatement" problem (using revealed preferences)
  - Where the sister's constraint fits (it creates boundaries but doesn't prevent all trades)

  The sister's constraint should be addressed after establishing basic trade mechanics but before discussing implementation. The honest answer is that absolute constraints limit possible trades but don't eliminate them - as long as there are permissible options that the other values highly, exchange remains possible.

  For misconceptions, we need to preempt:
  1. "This is just compromise" (clarify immediately after the example)
  2. "It's bribery" (stress no personal gain)
  3. "Convictions for sale" (explain mutual benefit ≠ moral relativism)
  ...in that order, as they naturally arise.

  The closing question should test understanding: "What would make a trade unacceptable to you personally?" This requires applying the concept rather than regurgitating it.

  We'll explicitly decline to discuss philosophical foundations ("incommensurable values" etc.) - this group needs practical tools, not theory. The focus stays on making their existing process less painful.

  Throughout, language must be concrete and jargon-free. The whiteboard will visually reinforce key contrasts (trade vs compromise, benefit vs cost). Most importantly, the tone must never condescend - the sister's sensitivity requires framing this as problem-solving rather than instruction.
answer: |-
  Here’s a structured 40-minute session plan for your panel, designed to bypass jargon, preempt objections, and address your sister’s constraint. Focus on **clarity, concrete examples, and mutual benefit**.

  ---

  ### **Session Structure & Timing**  
  *(Total: 40 mins)*  

  1.  **The Problem: Shared Frustration (5 mins)**  
      - *Start with common ground:* "We all want Dad’s fund to do good, but we disagree deeply on *how*. Our current approach leaves us both feeling half the money is wasted. What if there’s a better way?"  
      - *Visual:* Draw two stick figures (you/sis) with arrows to "Hospice/Youth" vs. "Measurable Impact." Label: "Both think the other’s choice wastes money."  
      - *Goal:* Establish shared pain. **Depends on nothing**—it’s their lived experience.  

  2.  **Core Idea: Trade ≠ Compromise (10 mins)**  
      - *Key concept:* "Trade lets us *both get more of what we want*—without agreeing on values."  
      - *The example (critical—use this exact one):*  
        > *"Imagine two neighbors: Ana cares *only* about art. Ben cares *only* about medicine. Each has £10k. An art gallery and a hospital need £15k each to launch projects. If Ana gives all to art and Ben to medicine, both projects fail. But if Ana gives £5k to medicine and Ben gives £5k to art, both projects succeed. Ana gets art funded (her goal), Ben gets medicine funded (his goal). Both win by ‘trading.’"*  
      - *Why this example?*  
        - Neutral (not your conflict or vegetarianism, which imply moral judgment).  
        - Shows mutual gain with **no shared values** (Ana doesn’t suddenly value medicine).  
        - Contains **no coercion, bribes, or personal gain**—money goes to causes.  
        - **Avoids:** Real-world charities, subjective terms like "harm," or "convictions."  
      - *Visual:* Whiteboard the £ swap. Label: "Trade: Both get 100% success. No trade: Both get 0%."  

  3.  **How Trade Works Here (10 mins)**  
      - *Mechanics:* "We take turns. One proposes a grant they care about; the other ‘pays’ for it by letting it happen, and the payer gets a ‘credit’ to use later for their cause."  
      - *Why it’s not compromise/voting/bribery:*  
        - **Compromise:** "We’re not splitting one pie—we’re making two pies." (Point to Ana/Ben: both got full projects).  
        - **Bribery:** "No one pockets cash. Money still goes to charity—just different ones."  
        - **Vote-trading:** "This isn’t about power—it’s about mutual benefit with no deception."  
      - *Visual:* Draw a ledger: "Your turn: My £ for your cause → I earn credit. My turn: Your credit + my £ for my cause."  

  4.  **Addressing Your Sister’s Constraint (5 mins)**  
      - *When to raise it:* **Here**, after establishing trade’s logic but before Q&A.  
      - *Framing:* "Some grants might feel off-limits—not just ‘less good,’ but wrong to fund. That’s okay. Trade only works for *permissible* grants. If a grant crosses that line, it’s not in the ‘trading pool.’ We only trade where both can say ‘I’ll allow this, if you support my cause later.’"  
      - *Honest answer:* "Constraints don’t kill trade—they shrink the pool. As long as there are grants you *can* support in exchange for credits, trade still works."  

  5.  **Preempting Misconceptions (5 mins)**  
      Tackle these **as they arise naturally** in discussion, but preempt the order:  
      1.  **"This is compromise!"** → *Shut down immediately after the Ana/Ben example.* "Did Ana compromise? No—she got her art. Both got 100%."  
      2.  **"It’s bribery!"** → "Bribery enriches *me*. Here, every penny goes to charity—just the one *you* picked."  
      3.  **"You’re paying her to betray convictions!"** → "If something violates her convictions, she won’t trade it. She only ‘sells’ support for causes she *can* tolerate."  
      4.  **"Overstating hatred of concessions?"** → "We track real actions, not claims. If she never uses credits for her causes, we’ll know she’s not playing fair."  
      5.  **"She’d fund hospice anyway!"** → "Then she’d get *extra* money for hospice by trading. My ‘payment’ to her is more for her cause."  

  6.  **Q&A & The Landing Test (4 mins)**  
      - *Test question:* **"What’s one grant you’d be willing to ‘sell’ support for, if it meant getting two grants you loved?"**  
        - *Why it works:* Forces them to apply the logic. If they answer, they grasp trade.  
      - *What to decline:* "We won’t debate *why* causes matter today. This is about *how* we cooperate despite disagreeing."  

  7.  **Close: Next Steps (1 min)**  
      "Let’s try one trade next meeting. Pick one grant you’d support for a credit. We’ll see if it feels better than splitting."  

  ---

  ### **Why This Sequence Works**  
  - **Builds from pain → solution** without philosophy. Ana/Ben makes abstract logic visceral.  
  - **Neutral example** avoids moral landmines (yours/vegetarianism). Hospice/EA debate derails the *mechanism*.  
  - **Sister’s constraint** is framed as a boundary, not a veto. It enters *after* she sees trade’s benefit.  
  - **Preempts objections** in the order they’ll occur:  
    1.  "Compromise" (arises when hearing "trade").  
    2.  "Bribery" (arises when hearing "pay credit").  
    3.  Convictions/overstatement (arises when imagining *their* causes).  
  - **No jargon**, no economics. "Credit" is the most technical term—and it’s intuitive.  

  Your sister’s fear of condescension is disarmed by starting with *her* frustration and letting the example do the work. By acknowledging constraints upfront, you signal respect. The session isn’t about winning—it’s about offering a tool to stop losing.
