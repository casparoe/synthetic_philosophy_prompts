prompt: |-
  Hi — hoping you can help with something for the job I do alongside the PhD (I'm in STS, writing up on workplace AI and the labour process). Two days a week I'm with the new-technology team at a federation of trade unions. When an employer brings in some new bit of kit — warehouse pick-rate monitoring, an "AI assistant" for clinical coders, shift-scheduling software, automated marking, predictive-maintenance diagnostics — I write a one-page assessment that our reps then use in bargaining. I get about half a day per tech, I almost never get anything useful out of the vendor, and the people reading it are lay reps who will glaze over the second it turns theoretical. We do maybe fifteen a year, and the output has to be signed off by a committee before it goes anywhere near an employer.

  What I want is a procedure, not another ethics checklist. And I want it actually grounded in Marx's account of machinery rather than a generic "is it fair, transparent and accountable" grid. The bits I keep coming back to: the difference between formal and real subsumption (capital taking over a labour process more or less as it finds it, versus capital revolutionising the labour process itself); the machinery chapter in Capital vol 1, including that bit where the worker in manufacture uses the tool while in the factory the machine uses the worker; the stuff in the Grundrisse fragment on machines about social knowledge and the general intellect becoming a direct productive force; relative surplus value (that machinery is a way of cheapening labour-power, not just a way of sacking people); and the reserve army — how far the technology widens or narrows the pool of people who could be hired to do the job. I don't want it to collapse into the deskilling thesis either — my supervisor thinks the Braverman version of that is too crude and I half agree.

  Two things I've been messing about with in my own chapters that I'd like built in, if they survive contact with what Marx actually says:

  - discretionary residue: after the kit goes in, how much judgement is still left with the worker — and, the bit that matters, whether that residue is codifiable, i.e. whether the calls workers make are being logged in a form that the next version of the system can learn from and eventually take over. Contrast with residue that's genuinely tacit and walks out the door when the worker does.
  - replaceability gradient: how much the technology widens or narrows the set of people who could do the work, and how fast that happens.

  So: give me a decision procedure I can actually run. Questions in a fixed order; what counts as a good enough answer to each when the vendor stonewalls or I can't get a number; where the procedure just stops with a no; and where it has to hand the decision to the reps because it's a question about what workers want rather than a question of fact. It must not reduce to a predicted headcount of jobs lost — half the time the headcount barely moves and the job is still wrecked, and I need it to say why in language a rep can use in a meeting.

  Then run it on three cases: (1) a handheld scanner plus pick-rate monitor with a public league table in a distribution centre; (2) an AI clinical coding tool where a human coder signs off every code, which the employer is calling "augmentation" and which our reps have already publicly welcomed; (3) predictive-maintenance diagnostics on the railway, where the engineers genuinely like the tool because it kills the paperwork, but which logs every diagnostic judgement the engineer makes. I especially want to see it bite on (2), because I suspect the answer it gives is one we won't like and have already gone out on a limb against.

  Finally, be straight with me about where it misfires: public-sector employers with no profit motive, co-ops and worker-owned outfits, kit that's announced with a big press release and then quietly never switched on, and the case where one tool upskills one grade while disciplining another. And if either of my two concepts above doesn't survive being turned into a checklist, say so and say why.

  Cheers.
reasoning: |-
  Okay, this user is clearly deeply immersed in both Marxist theory and practical trade union work. They're straddling academia and labor activism in a way that's impressive - writing a PhD on workplace AI while actually helping unions negotiate tech implementations. That's a rare combination.

  The core challenge here is translating dense Marxist concepts into a practical tool for time-pressed union reps. They've already rejected superficial ethics frameworks and want something rooted in Capital's machinery analysis. Key elements they flagged: formal vs real subsumption, the inversion of worker-machine relations, general intellect capture, and surplus value extraction beyond just job loss.

  Interesting they specifically want to avoid Braverman's deskilling oversimplification. Their "discretionary residue" and "replaceability gradient" concepts show sophisticated thinking - especially noting whether residual judgment is being logged for future automation. That clinical coding example seems personal - they're worried their union prematurely endorsed "augmentation" tech that might be predatory.

  Three test cases reveal their practical concerns: the warehouse scanner is classic Taylorism 2.0, the clinical coder is about concealed deskilling, and the railway tool shows worker-complicit exploitation. The public sector/co-op caveats suggest they've encountered pushback about Marxist analysis applying outside profit-driven firms.

  What they really need is:
  - A diagnostic flow that surfaces exploitation mechanisms even when job numbers stay constant
  - Concrete questions that work when vendors withhold information
  - Clear "stop/no-go" triggers for bargaining
  - Ways to distinguish codifiable from genuine tacit knowledge
  - Analysis of how tech alters labor power valuation

  The emotional tone suggests frustration with both vendor opacity and academic abstraction. There's urgency here - they're handling 15 cases annually with half-day turnarounds. The "cheers" at the end feels very British trade unionist - no-nonsense but collegial.

  Biggest risks to address:
  - Overloading time-pressed reps with theory
  - Missing when tech benefits some workers while harming others
  - Accounting for public sector dynamics
  - Their "gradient" concept potentially conflicting with Marx's tendency toward polarization

  The response should probably start with the procedure before test cases, and explicitly call out where their concepts work (discretionary residue seems solid) versus where they need refinement (replaceability gradient might need class analysis).
answer: |-
  Here's a Marxist-informed decision procedure for workplace technology assessment, designed for union reps facing opaque vendors and tight deadlines. It prioritizes *labor process transformation* over job loss counts.

  **The Core Procedure (Fixed Order Questions):**

  1.  **Subsumption Type:** *Does this tech take over an *existing* labor process (Formal Subsumption) or fundamentally *reorganize* how work is done (Real Subsumption)?*
      *   *Evidence:* Compare pre/post work routines. Formal: Tech layered on top (e.g., scanner timing existing picks). Real: Workflow redesigned around tech (e.g., algorithm dictating task sequence).
      *   *Vendor Stonewall:* Assume Formal unless evidence (job descriptions, training changes, process maps) suggests radical reorganization.
      *   *Stop/Handoff?* Primarily diagnostic. Real Subsumption signals deeper capitalist control & higher bargaining stakes.

  2.  **Worker-Machine Relation:** *Does the worker *use* the tool, or does the machine *use* the worker (setting pace, dictating actions, evaluating)?*
      *   *Evidence:* Who initiates actions? Who controls pace/sequence? Where does judgment lie? (e.g., handheld scanner used by worker vs. pick-rate monitor *using* worker's data to enforce pace).
      *   *Vendor Stonewall:* Focus on observable worker behavior. Is the worker reacting to machine prompts/alerts more than initiating? If yes, machine is using worker.
      *   *Stop/Handoff?* If machine definitively "uses" worker, proceed. If ambiguous, flag for reps.

  3.  **Surplus Value Mechanism:** *Is this primarily about *intensifying labor* (more output per hour - Absolute SV) or *cheapening labor-power* (reducing value of labor via deskilling/oversupply - Relative SV)?*
      *   *Evidence:* Skill changes? Training time changes? Monitoring intensity? Output quotas? Wage pressure? Widening/narrowing labor pool (Replaceability Gradient - see below). *Crucially: Does the tech make previously skilled tasks doable by less-trained/paid workers?*
      *   *Vendor Stonewall:* Look for skill descriptors (are "assistants" replacing experts?). Analyze job ads pre/post. Relative SV is often the *primary* goal, even if headcount stable. If tech enables significant deskilling or vastly widens labor pool, Relative SV is key.
      *   *Stop/Handoff?* Proceed. Identifying SV mechanism targets bargaining (resisting intensification vs. defending skill/wages).

  4.  **Discretionary Residue (DR):** *After implementation, what scope for independent worker judgment remains?*
      a.  *Volume:* High/Medium/Low (subjective but useful)
      b.  *Codifiability:* *Is the worker's judgment/residual action being systematically logged, monitored, and fed back into the system for future automation?* (The critical question)
      *   *Evidence:* Are decisions recorded? Is there user feedback/data collection explicitly for "training" the system? Does the vendor mention "continuous improvement" or "learning" based on user data?
      *   *Vendor Stonewall:* Assume High Codifiability if: (1) System is "AI" or "learning," (2) User interactions are logged, (3) Employer mentions "optimizing" workflows based on data. Assume Low only if work is highly contextual, physical, or involves unlogged interpersonal judgment.
      *   *Stop/Handoff?* High Codifiability + Low/Medium DR volume is a major red flag (imminent skill erosion). Handoff to reps if DR volume is contested.

  5.  **Replaceability Gradient (RG):** *How does this tech impact the *size* and *required attributes* of the potential workforce pool?*
      a.  *Direction:* Widens Pool (↑ replaceability) / Narrows Pool (↓ replaceability) / Neutral.
      b.  *Speed:* Fast (immediate impact) / Gradual (over next contract) / Slow (long-term).
      *   *Evidence:* Skill requirements change? Training time change? Physical/mental demands changed? Geographic constraints altered (remote work enabled)? Does tech automate niche expertise?
      *   *Vendor Stonewall:* Focus on deskilling (widens pool) or new specialized skills (narrows pool). If tech reduces complex judgment to simple rule-following, assume widens pool fast. If it requires new certifications, assume narrows pool gradually. Neutral is rare.
      *   *Stop/Handoff?* Widens Pool + Fast is a major red flag (reserve army expansion). Handoff to reps if impact direction/speed is highly uncertain.

  6.  **General Intellect Capture:** *Is worker-generated knowledge, skill, or collective practice being appropriated and ossified into the machine, becoming capital's "property"?*
      *   *Evidence:* Does the system rely on data *generated by workers*? Are "best practices" mined from worker data and automated? Is worker feedback used to train algorithms *without worker control/ownership*?
      *   *Vendor Stonewall:* Almost always "Yes" if it involves data logging (Questions 4b, 5) or machine learning. Explicitly ask vendors/employers "How is worker data used to improve the system?"
      *   *Stop/Handoff?* A strong "Yes" reinforces the exploitative dynamic of DR Codifiability and RG Widening. Proceed.

  **Output & Action:**
  *   **Red Flags:** Machine Uses Worker + High DR Codifiability + RG Widens Pool Fast + Strong General Intellect Capture. This indicates intense real subsumption, skill erosion, and heightened worker vulnerability. **Bargaining priority:** Defend skills, control over data/logging, resist pace-setting, demand upskilling for residual tasks.
  *   **Amber Flags:** Mixed signals (e.g., Formal Subsumption but High DR Codifiability). **Bargaining priority:** Vigilance, data rights, contractual safeguards against future automation of residue.
  *   **Green(ish) Flags:** Worker Uses Tool + Low DR Codifiability + RG Narrows Pool. **Bargaining priority:** Ensure genuine skill development, protect acquired skills, leverage increased worker value.
  *   **Rep Handoff:** When questions involve contested interpretations of *worker experience* (e.g., how onerous is monitoring?) or *bargaining priorities* (e.g., is preserving this residue more important than fighting pace?).

  **Key Features for Reps:**
  *   Avoids "jobs lost" focus: Explains *how* jobs are degraded (intensification, deskilling, loss of control) even if headcount stable.
  *   Plain Language: "Machine sets the pace," "Your know-how is being fed into the robot," "This lets them hire cheaper temps faster," "Your judgment is being recorded to train your replacement."
  *   Highlights Bargaining Levers: Control over data logging, restrictions on pace-setting algorithms, training for residual high-skill tasks, protections against deskilling wage cuts.
  *   Handles Stonewalling: Uses observable behavior, job ad changes, and system type (AI/logging = high risk) as proxies.

  **Testing the Cases:**

  1.  **Warehouse Scanner & Pick-Rate Monitor:**
      *   **S:** Formal (timing existing picks).
      *   **W-M:** **Machine Uses Worker** (monitor sets/measures pace, league table enforces).
      *   **SV:** **Relative** (pressure to hire cheaper, more replaceable workers due to simplified, measured task + **RG Widens Pool Fast** - less "skill" needed beyond speed/endurance).
      *   **DR:** Low Volume (simple task), **High Codifiability** (pace/errors logged, could train future bots).
      *   **GI Capture:** **Yes** (worker pace data refines expectations/quotas).
      *   **Verdict:** **RED FLAG.** Bargaining: Fight league tables, cap monitoring intensity, demand safety adjustments for pace, resist linking pay solely to metrics.

  2.  **AI Clinical Coding "Augmentation":**
      *   **S:** **Real** (workflow redesigned around AI suggestions).
      *   **W-M:** Ambiguous, leans **Machine Uses Worker** (AI proposes codes, worker *reacts* by verifying, pace likely influenced).
      *   **SV:** **Primarily Relative** (Aim: reduce coder expertise needed over time via **High DR Codifiability** - every verification logs correct/incorrect codes, training AI to eventually replace coder judgment. **RG Widens Pool Gradually** - future coders need less specialized knowledge).
      *   **DR:** **High Volume** NOW (verifying complex codes), **Extremely High Codifiability** (Every accept/reject trains the AI - *this is the core mechanism*).
      *   **GI Capture:** **Strong Yes** (Coders' expertise is the training data for their potential replacement).
      *   **Verdict:** **RED FLAG.** "Augmentation" is transitional. Bargaining: *Crucially demand:* (a) Strict limits on data logging/training use, (b) Guarantees that coders move *up* the value chain (e.g., auditing AI, complex cases, training), (c) No headcount reduction without equivalent upskilling, (d) Transparency on AI accuracy/errors. Reps likely welcomed reduced immediate workload without seeing the long-term capture of expertise.

  3.  **Predictive Maintenance Diagnostics (Railway):**
      *   **S:** Real (replaces manual diagnosis/reporting routines).
      *   **W-M:** **Worker Uses Tool** (Tool provides data, engineer makes final diagnosis/action decision... *for now*).
      *   **SV:** Mixed. Efficiency (Absolute SV?) but strong **Relative SV potential** via **High DR Codifiability** (every diagnosis/judgment logged to train future AI - aims to automate diagnosis long-term. **RG Widens Pool Gradually** if future "engineers" just verify AI outputs).
      *   **DR:** **High Volume** NOW (engineer judgment), **Very High Codifiability** (Logging every action for "optimization" = future automation).
      *   **GI Capture:** **Strong Yes** (Engineers' diagnostic skill is the training data).
      *   **Verdict:** **AMBER/RED FLAG.** Genuine current benefit (killing paperwork) masks long-term threat. Bargaining: Celebrate efficiency gain *but* demand: (a) Ironclad prohibitions on using logged data to automate diagnosis, (b) Engineers retain full diagnostic authority, (c) Data ownership/access rights, (d) Upskilling in AI oversight/auditing.

  **Where it Misfires & Concept Critique:**

  *   **Public Sector / Non-Profits:** The core driver (relative surplus value via cheapening labor-power) is *less direct* but NOT absent. Pressures to "do more with less," "efficiency savings," outsourcing, and workload intensification still apply. The *labor process analysis* (subsumption, machine-worker relation, discretion, codifiability, replaceability) remains crucial. The *goal* might be budget cuts or meeting targets, not profit, but the *impact on workers* is similar.
  *   **Co-ops / Worker-Owned:** Fundamentally different social relations. The procedure assumes capitalist dynamics (ownership/control separation, profit motive). While labor process changes *could* be analyzed, the core logic of exploitation/capture doesn't apply in the same way. Risk of over-alarmism. Needs separate framework focused on democratic control over tech design/implementation.
  *   **Vaporware / Never Switched On:** The procedure assesses *claimed* functionality. If the tech isn't used, the assessment is moot. Flag uncertainty heavily if implementation is dubious. Focus bargaining on implementation timelines and review clauses.
  *   **Upskilling One Grade, Disciplining Another:** The procedure focuses on *a specific job/grade*. It might miss cross-grade dynamics. You need to run it *separately* for each materially affected grade. E.g., Nurses may be "upskilled" to manage AI outputs while HCAs are disciplined by monitoring. Run the tool for Nurses *and* for HCAs.
  *   **"Replaceability Gradient" Critique:** It *works* empirically ("can they hire more people cheaper/faster?"). However, Marx's *reserve army* concept is tied to systemic capitalist crises and the *production* of relative surplus population. The RG is more operational/tactical. It risks missing the *systemic* role of unemployment. **Solution:** Use RG practically but contextualize findings within the broader reserve army dynamic when explaining to reps.
  *   **"Discretionary Residue" Strength:** This concept holds up well, especially the **Codifiability** aspect, which directly tracks Marx on machinery capturing worker knowledge/skill and the General Intellect. It's the key to predicting *future* automation and deskilling beneath the surface of "augmentation."

  **Conclusion:** This procedure forces analysis beyond surface-level "fairness" to expose the *transformative dynamics of the labor process* through a Marxist lens. It identifies vulnerabilities (codifiable discretion, widening replaceability) even when jobs aren't immediately lost and provides concrete bargaining hooks (data control, logging restrictions, skill defense). Be upfront with reps about its focus on capitalist exploitation dynamics and its limitations in non-capitalist settings. Use the clinical coding case **(2)** as a stark warning about the "augmentation trap." Good luck with the PhD and the crucial union work!
