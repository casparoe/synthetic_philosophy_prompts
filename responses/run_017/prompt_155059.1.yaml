  We are going to design an in-class activity that illustrates the problem of majority rule on interconnected propositions, leading to inconsistent group outcomes. The goal is for students to experience the issue without prior knowledge of the paradox (like the doctrinal paradox or discursive dilemma). We'll use a scenario where a committee must decide on a case by voting on sub-questions and then see how the outcome changes when voting on the bottom line.

  **Scenario Choice**: To avoid real stakes that might induce strategic voting, we'll use a fictional but plausible scenario. I propose:

  *   **Scenario**: The university's "Ethics in Research Committee" must decide whether to **rescind a research grant** from a professor (let's call her Dr. A) due to alleged misconduct. The committee (the class) must decide based on two main issues:

      1.  **Question of Fact (F)**: Did Dr. A fabricate data in her grant application?
      2.  **Question of Intent (I)**: Did Dr. A intend to deceive the funding agency?

      The **Verdict (V)**: Should the grant be rescinded?

      **Logical Connection**:
      - The committee's rules state that the grant should be rescinded **if and only if** both F and I are true. That is: V = F AND I.

      However, note: We will also introduce a third proposition to add complexity and avoid pattern-matching.

      **Adding a Third Proposition**:
      - Let's add: **Question of Severity (S)**: Was the alleged fabrication severe enough to warrant rescission?

      Now, we can have two different ways to structure the verdict:

      **Option 1 (for the first part of the activity)**: Use only F and I, with V = F AND I. This is simple and clear.

      **Option 2 (to add complexity)**: We can design the verdict to be more nuanced. For example:

          Verdict Condition 1: If F and I are both true, then V is true (rescision).
          Verdict Condition 2: Even if I is not proven (or even false), if S is true (the severity is high) then V might also be true.

      But we want to avoid making it too complex. Instead, let's have two different cases:

      **Activity Structure**:

      We will run two separate cases (two different grant scenarios) in the same activity.

      **Case 1 (Simple AND)**:
          - Propositions:
              F1: Fabrication occurred. (True/False)
              I1: Intent to deceive. (True/False)
              V1: Rescind grant. (True/False) [with rule: V1 = F1 AND I1]

      **Case 2 (More Complex)**:
          - Propositions:
              F2: Fabrication occurred.
              I2: Intent to deceive.
              S2: Severity is high. (a new proposition)
              V2: Rescind grant.

          - Rule: The grant should be rescinded if:
              (F2 AND I2) OR (F2 AND S2)
            That is, if there was fabrication and intent, OR if there was fabrication and it was severe (even without intent).

      This way, we have two different logical structures.

      **Why two cases?** 
      - The first case is simple and will likely produce the paradox when we vote on the sub-issues and then on the bottom line. The second case is more complex and may show a different kind of inconsistency or show that the order of voting matters.

      **Abstentions**:
      We want one proposition where students might have no firm view. Let's design the scenario so that for the second case, the severity (S2) might be ambiguous. We can frame it as: "The fabrication, if it occurred, was of a severity that by itself would warrant rescission, regardless of intent." This might be hard to judge without more context.

