answer: |-
  ### **Activity Design: "The Paradox of Piecewise Voting"**  
  **Goal:** Students experience how majority votes on interconnected propositions can lead to inconsistent group decisions, without introducing the term "doctrinal paradox" until debrief.  

  ---

  ### **Scenario: The "Campus Press Review Board"**  
  **Context:** The class is a university committee deciding whether **The Dialectic**, a student journal, violated ethics rules by publishing a controversial article. The verdict hinges on three sub-questions.  

  **Stakes:** Use a **low-stakes fictional outcome** (e.g., "The Dialectic must issue an apology" or "No penalty") to avoid strategic voting. Real stakes could distort votes.  

  ---

  ### **Propositions & Logical Structure**  
  **Verdict (V):** *Should The Dialectic face penalties?* (Yes/No).  
  **Sub-questions:**  
  1. **F (Fact):** *Did the article contain false statements about the university's admissions process?*  
     - *Requires evidence:* "The article claimed, 'Admissions favors legacy applicants,' but data shows legacy status isn’t a factor."  
  2. **I (Intent):** *Did the editors know the statements were false?*  
     - *Requires evidence:* "An editor’s email states, 'We can’t verify this, but it aligns with our narrative.'"  
  3. **H (Harm):** *Did the article cause significant harm?*  
     - *Requires evidence:* "Donations dropped 5% after publication; some students reported distress."  

  **Logical Rules for V:**  
  - **V = YES** if:  
    - **(F AND I) OR (F AND H)**  
    *(Penalties if: (a) false statements + intent, OR (b) false statements + harm).*  
  - **V = NO** otherwise.  

  **Why this structure?**  
  - **F AND I:** Classic "intentional misconduct" (requires both).  
  - **F AND H:** "Reckless disregard" (harm alone isn’t enough; falsehood must be proven).  
  - **H is ambiguous:** Students may legitimately disagree on "significant harm" → prompts abstentions.  

  ---

  ### **Setup & Timing (75 min total)**  
  #### **Phase 1: Case Intro & Private Deliberation (15 min)**  
  - **Set the scene (5 min):**  
    - Project the case summary and propositions.  
    - Assign roles: **1 Chair** (secretly instructed to push for "NO penalty"; they control vote order).  
    - Others: Committee members (no roles; independent voters).  
  - **Private review (10 min):**  
    - Distribute index cards with the case facts.  
    - Students note initial leans on F, I, H, V.  

  #### **Phase 2: Voting Rounds (35 min)**  
  - **Chair’s Role:** Decides order of votes (e.g., F→I→H→V or V first). *Secret goal: Get "V=NO."*  
  - **Voting Procedure:**  
    - Use **paper ballots** (no tech) for each proposition.  
    - **Ballot options:** "Yes," "No," "Abstain."  
    - **Abstention rule:** Abstentions reduce the majority threshold (e.g., 10 voters, 3 abstain: majority = 4 of 7). *Crucially, abstentions don’t count as "No" or "Yes"* → makes ties possible.  
  - **Three Rounds:**  
    1. **Premise-Based Voting:** Vote on F, I, H **separately** → compute V using logical rules.  
    2. **Bottom-Line Voting:** Vote **directly on V** (no sub-questions).  
    3. **Chair’s Gambit:** Chair chooses a **new order** (e.g., V first, then F/I/H).  

  #### **Phase 3: Tally & Reveal (10 min)**  
  - Publicly tally votes on whiteboard.  
  - **Force the paradox:** Pre-seed ballots if needed (see "Rigging the Vote" below).  
  - Highlight inconsistencies:  
    - Premise-based V ≠ Bottom-line V.  
    - Vote order changes outcomes.  

  #### **Phase 4: Debrief (15 min)**  
  - **Key Questions:**  
    - *"Did the group’s verdict match the logical outcome of its sub-votes? Why/why not?"*  
    - *"When we voted on V directly, did we replicate the premise-based verdict?"*  
    - *"How did abstentions affect outcomes? What if abstentions counted as 'No'?"*  
  - **Map to Theory:**  
    - Name the **doctrinal paradox** only after students describe the inconsistency.  
    - Discuss: *"Which method (premise-based vs. bottom-line) is fairer? More reliable?"*  
      - **Truth-tracking:** Premise-based may be better if voters are more reliable on facts than complex judgments.  
      - **Contested:** No consensus; depends on context (e.g., juries vs. legislatures).  

  ---

  ### **Ensuring the Paradox Occurs (Without Fudging)**  
  **Rigging the Vote (Subtly):**  
  - **Assign leanings:** Pre-distribute ballots to 5 "stealth voters" with fixed votes to create paradox:  
    - **Voter 1:** F=Y, I=Y, H=N → V=Y (premise) but V=N (bottom-line? *See below*).  
    - **Voter 2:** F=Y, I=N, H=N → V=N.  
    - **Voter 3:** F=N, I=Y, H=Y → V=N (since F=N).  
    - **Voter 4:** F=N, I=N, H=Y → V=N.  
    - **Voter 5:** F=Y, I=Y, H=Y → V=Y.  
  - **Outcome with 20 voters (add 15 undecided):**  
    - Premise-based: F=Y (e.g., 12Y, 5N, 3A), I=Y (11Y, 6N, 3A), H=N (8N, 7Y, 5A) → V=Y via (F AND I).  
    - Bottom-line: V=N (e.g., 11N, 9Y) → paradox!  
    - *Why?* Voters 2, 3, 4 vote N on V; Voters 1/5 vote Y. Undecideds split.  

  **Handle Abstentions:**  
  - In the **H vote**, many may abstain (ambiguous harm).  
    - **Effect:** If abstentions reduce the threshold, H is more likely to fail → favors V=N.  
    - **Alternative rules:** If abstentions counted as "No," H would fail more often → strengthens paradox.  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **Sharp student spoils it:**  
     - If someone names the paradox early: *"Great observation! Let’s see if it plays out in practice."*  
  2. **Votes don’t split:**  
     - Use stealth voters (above) to ensure the paradox.  
     - If abstentions dominate H, use it to discuss: *"Does ambiguity in sub-questions undermine the process?"*  
  3. **Chair’s influence:**  
     - The Chair might reveal their bias → turns into a lesson on agenda-setting power.  
     - If they fail to steer votes, discuss: *"When does procedural control matter?"*  

  ---

  ### **Why This Works**  
  - **Experiential learning:** Students "feel" the paradox when the group’s verdict contradicts its logic.  
  - **Structured ambiguity:** H introduces abstentions; the AND/OR rules prevent pattern-matching.  
  - **Chair role:** Adds realism and shows how power dynamics shape outcomes.  
  - **Debrief grounds theory:** Concrete examples (e.g., "Remember when the computed V was YES, but direct vote was NO?") anchor abstract ideas.  

  **Materials:** Index cards, ballots, whiteboard, projector (for case summary).  
  **Outcome:** Students leave questioning simplistic majority rule—ready for deeper theory next session.
