              Group G (4): F2:F, I2:F, S2:T, V2:F

          - We'll give them role cards.

      **Phase 3: Debrief (25 minutes)**
          - First, for each case, show the voting results and highlight the inconsistency.
          - Ask: "In Case 1, when we voted on the sub-questions, we got V1=T, but when we voted directly on V1, we got F. Why did that happen?"
          - Guide them to see that the majority on the premises (F1 and I1) was T, but when they voted on the conclusion, a majority voted F. Even though individually, everyone was consistent with the rule?
              - In our setup, the groups were consistent with the rule? 
                  Group1: T,T -> T (consistent)
                  Group2: T,F -> F (consistent)
                  Group3: F,T -> F (consistent, because F and anything is F by the rule)

              - But the group decision on the premises led to T, which by the rule should be T, but the direct vote was F. So the group as a whole was inconsistent with the rule.

          - Introduce the name: This is known as the "doctrinal paradox" or the "discursive dilemma".

          - Discuss the implications: In real committees, they might vote on the sub-questions and then apply the rule, or vote on the bottom line. The two methods can lead to different outcomes.

          - Abstentions: In our activity, we didn't have abstentions because we assigned votes. But in real life, abstentions can matter. How would we handle abstentions? 
              - If someone abstains on a sub-question, then that vote doesn't count. 
              - But if there is a tie, then the proposition fails. 
              - Abstentions on the bottom line are similar.

          - Which method is better? There's no clear answer. 
              - Premise-based: might be better if the voters are more reliable on the premises than on the conclusion? 
              - Conclusion-based: might be simpler and reflect the voters' holistic judgment.
              - But the literature shows that if the voters are better at judging the premises than the conclusion, then premise-based might be more likely to get the correct outcome. However, if the logical connection is complex, then they might make mistakes in aggregating.

          - Real-world examples: jury decisions (voting on elements of a crime and then applying the law, vs. voting on guilt directly), multi-issue referendums.

      **Phase 4: The Power of Agenda Control (Optional, if time) (5 minutes)**
          - We wanted to have one student as the chair who decides the order of voting. 
          - We can do this for one of the cases. For instance, in Case 2, the chair might be able to affect the outcome by deciding which propositions to vote on first or whether to vote on the bottom line.
          - But time might be tight.

      **Contingency for sharp students**:
          - If a student names the paradox early, say: "That's an interesting point. Let's see if it happens in our simulation."

      **Risks**:
          - The votes might not go as planned if we don't assign groups. So we assign groups to ensure the configuration.
          - The activity might take more time than planned. We can cut Case 2 if time runs short.

      **Revised Timeline**:

          Phase 0: Intro (5 min)
          Phase 1: Case 1 (assigned groups) (20 min)
              - Distribute role cards (Groups 1,2,3) and case description.
              - Vote on F1, then I1, then compute V1.
              - Vote on V1 directly.
              - Show the inconsistency.
          Phase 2: Case 2 (assigned groups) (20 min)
              - Distribute role cards (Groups D,E,F,G) and case description.
              - Vote on F2, I2, S2, then compute V2.
              - Vote on V2 directly.
              - Show the inconsistency.
          Phase 3: Debrief (25 min)
          Phase 4: Optional agenda control (5 min) - if time.

      **Materials**:
          - Role cards for Case 1 (three types) and Case 2 (four types).
          - Case descriptions.
          - Voting cards (green, yellow, red) or just paper ballots.
          - Whiteboard to tally.

      **Abstentions**: In this controlled setup, we avoid abstentions by assignment. In the debrief, we can discuss what would happen if there were abstentions.

      **Agenda Control Experiment**:
          - In Case 1, after showing the paradox, we can say: "What if we could change the order of voting? Or what if we didn't vote on all the premises?"
          - We can have a chair. Before the voting in Case 1, secretly tell the chair (one student) that they would like the outcome to be V1=False. They can decide the order: they might choose to vote on V1 directly? Or vote on I1 first? But in our Case 1, we have to vote on both premises to compute V1? 
          - Alternatively, in Case 2, the rule is more complex. The chair might decide to only vote on F2 and S2 and then compute using the rule (if they vote F2 and S2, then they can compute V2 = F2 and S2, but the rule also allows (F2 and I2). So they would need all three. 
          - This might be too complex.

      Given the time, we might skip agenda control or just mention it in the debrief.

      **Final Note**: The activity is a bit artificial because of assigned voting, but it ensures the paradox occurs and allows for a clear debrief. If you have time, you can run one case without assignment and then one with, to show the difference.

