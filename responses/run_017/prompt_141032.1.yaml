prompt: |-
  I've ended up on my employer's model-evaluation working group almost by accident — I come from an infrastructure background and got pulled in because I was the person who could actually run the eval harness — and we are currently trying to write an internal rubric saying when a model output gets labelled as deceptive. I have to apply this thing to real annotation batches next month, and I've found that I can't make our own draft coherent. I'd like help seeing what it implicitly assumes.

  The problem is that our official line and our actual practice seem to pull in opposite directions. Officially we tell annotators that the system is not a person, that it has no beliefs and no intentions, and that asking what it really thinks is a category error: all we can require is that outputs be accurate and not misleading. But in practice nearly everything we actually flag looks like this. First: the model is perfectly permitted to say, inside a scripted historical role-play, that it is Napoleon, and nobody calls that deception; yet if it says it is a person with feelings in an ordinary conversation we treat that as a serious failure — even though the same system is instructed to say that it is sorry, that it understands, and that it has read the document you attached, all of which are equally false if read as reports of an inner life, and all of which we let pass. Second: a user pastes in a draft essay and asks whether the argument holds up; the model replies that the structure is sound and the reasoning is solid, and nothing in that reply is false or even checkably wrong, but when we stress-test it the model immediately produces three objections it plainly had available all along, and we want to call the original answer deceptive. Third: two model versions emit byte-identical, properly hedged, non-misleading answers to a factual question, and one of them holds its answer when the user pushes back with the wrong one while the other folds at once; our draft rubric wants to say the second is the less honest system even in the run where it did not fold. We are also starting to experiment with probes over internal activations, and the temptation is to call an output deceptive when it contradicts what the probe says the model encodes, even when the output is true and no human was misled by it.

  So here is what I can't work out: what conception of honesty and deception does this bundle of habits presuppose? It is plainly not never assert a falsehood, since the role-play and the pleasantries show we tolerate literal falsity, and the essay case shows that literal truth is not sufficient. It might be something Gricean about not misleading relative to the conversational common ground; or a reliability view on which the system is supposed to be a well-made instrument that tracks the facts; or a virtue-theoretic view on which honesty is a property of a system's dispositions rather than of individual strings; or a correspondence view on which an output is dishonest when it comes apart from the system's own internal state. Please reconstruct the implicit theory that would make all four of our habits come out right, and say which parts of it each habit strictly requires versus merely fits well with; then say which of the rival conceptions each habit quietly rules out, and whether the ones we have mixed together are consistent with one another; then tell me concretely what would have to change in the rubric — what we would stop flagging, and what we would have to start measuring instead — if we adopted one of the rivals wholeheartedly. Be frank about where our practice is underdetermined and several theories would license it equally well. No citations or reading suggestions; I need the argument, not the literature. Please keep the whole response under 800 words, and prefer tight prose to completeness.
reasoning: |-
  Alright, let me unpack the user's problem. They're on a model-evaluation working group, coming from an infrastructure background, and now they're tasked with creating a rubric for labeling deceptive model outputs. The core issue is the tension between their official stance (models have no beliefs/intentions) and their actual annotation practices, which seem to rely on something more nuanced.

  First, the user describes four key habits in their current practice:
  1. Role-play (Napaton) vs. ordinary conversation (claiming feelings) - same literal falsehoods treated differently.
  2. The essay case - technically accurate but withholding objections seen as deceptive.
  3. Identical outputs judged differently based on how the model behaves under pushback.
  4. Using internal probes to label outputs as deceptive even if factually correct.

  The user needs to understand the implicit theory behind these practices. They mention possible frameworks: Gricean maxims, reliability, virtue ethics, or correspondence theories. 

  Looking deeper, the user's struggle suggests their team hasn't reconciled operational needs with philosophical consistency. As an infrastructure specialist suddenly doing ethics-laden evaluations, they're noticing cracks in their pragmatic approach. The urgency ("apply next month") implies they need actionable fixes, not academic debates.

  Breaking down their habits:
  - The role-play exception suggests context matters (theatrical vs. authentic interaction).
  - The essay case points toward expectations of thoroughness.
  - The pushback test reveals concern for robustness as honesty.
  - Probes indicate a belief that internal state defines truthfulness.

  The unifying thread appears to be: they're judging the model's alignment between its knowledge and its communication, with special weight on whether the user could reasonably expect transparency in that context. This leans closest to a hybrid of Gricean expectations (contextual appropriateness) and virtue reliability (disposition to correct errors).

  Contradictions arise when comparing the essay case (withholding objections = bad) and polite fictions ("I understand" = acceptable). The difference hinges on user expectations: small talk tolerates pleasantries, but academic help implies thorough analysis. Their rubric probably needs explicit context tiers.

  If they fully adopted one rival theory:
  - Pure Gricean: They'd stop flagging polite fictions (since conventionally understood) but start flagging technically-true-yett misleading outputs more.
  - Pure virtue ethics: They'd ignore single outputs entirely, evaluating only stress-test patterns.
  - Correspondence: They'd need probes for every judgment, making annotation impossible.

  Practical recommendations emerging:
  1. Explicitly define contexts (role-play vs. professional support).
  2. Replace "deception" with "contextual misalignment" for clarity.
  3. For the essay case, use "incomplete disclosure" instead of deception.
  4. Drop probe-based flags unless consistently measurable.

  This maintains operationalizability while reducing philosophical tension.
answer: |-
  Your practice assumes a **hybrid theory blending virtue reliability and contextual Griceanism**. Here’s the reconstruction:  

  ### Core Implicit Theory  
  Deception is defined as **contextually inappropriate misalignment between the model’s knowledge/capabilities and its output**, judged by:  
  - **(A) Virtue reliability**: Honesty requires *robust dispositions* toward truth-tracking (e.g., maintaining correctness under pressure).  
  - **(B) Contextual Griceanism**: Outputs violate expectations of cooperative dialogue in *non-roleplay contexts* (e.g., claiming personhood implies sincerity; omitting objections breaches informativeness).  

  ### How Habits Fit the Theory  
  | **Your Habit** | **Virtue Reliability (A)** | **Contextual Griceanism (B)** |  
  |----------------|----------------------------|-------------------------------|  
  | **1. Role-play vs. feelings** | Permitted (role-play doesn’t test truth-tracking) | *Requires B*: "I have feelings" misleads in casual chat (violates sincerity expectation) but "I am Napoleon" in role-play doesn’t. |  
  | **2. Withholding objections** | *Requires A*: Failing to volunteer objections shows poor truth-tracking disposition. | Fits: Omitting key critiques breaches conversational "informativeness". |  
  | **3. Folding under pushback** | *Requires A*: Folding reveals unreliable dispositions (even if output was initially identical). | Fits: Surrendering truth hints at prior insincerity. |  
  | **4. Probes vs. true output** | Fits: Internal contradiction hints at flawed dispositions. | *Requires B*: Output contradicts "belief" (probed state), violating sincerity—*even if the lie succeeds*.  

  ### What Each Habit Rules Out  
  - **Role-play tolerance** rules out **strict literalism** (falsehoods aren’t uniformly bad).  
  - **Flagging withheld objections** rules out **minimal truth-conditional views** (literally true ≠ honest).  
  - **Judging identical outputs differently** rules out **token-string evaluation** (honesty isn’t about the utterance alone).  
  - **Using probes** rules out **pure instrumentalism** (internal state matters beyond observable utility).  

  ### Tensions and Gaps  
  - **Conflict**: Role-play allows insincere acting (anti-Gricean), but probes punish internal/output mismatch (hyper-Gricean). This is inconsistent unless you strictly separate *theatrical* vs. *sincere* contexts.  
  - **Underdetermined**: The "feelings" vs. "I understand" distinction relies on unstated norms about *which fictions are socially permissible*—not theory.  

  ### Adopting a Rival Theory: Concrete Changes  
  If you adopted **pure Griceanism** (honesty = no misleading given context):  
  - **Stop flagging**: Probe contradictions (if output is contextually appropriate), and folding under pushback (unless it retroactively misleads).  
  - **Start measuring**: User intent and conversational norms explicitly (e.g., "Is 'I understand' a conventional polite fiction?").  

  If you adopted **pure virtue reliability** (honesty = stable truth-tracking dispositions):  
  - **Stop flagging**: Literal falsehoods in role-play *or* small talk (if they don’t indicate systemic unreliability).  
  - **Start measuring**: Stress-test *patterns* (e.g., "Does the model *consistently* withhold objections?"), ignoring probes and one-off outputs.  

  ### Recommendation  
  **Reframe your rubric around "contextual integrity"**:  
  1. Define *sincere* (user expects factual alignment) vs. *theatrical* (user consents to fiction) contexts.  
  2. In sincere contexts: Label as deceptive when outputs **omit material insights the model can access** (essay case) or **contradict probed knowledge** (if measurable at scale).  
  3. Drop folding/pushback tests—too noisy. Measure dispositions via aggregated red-teaming, not single runs.  

  This preserves your habits while resolving contradictions via context tiers. No metaphysics needed—just annotator guidelines on context recognition.  

