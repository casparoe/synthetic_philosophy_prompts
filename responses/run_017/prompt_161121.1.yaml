prompt: |-
  Morning — I'm the (unpaid, no legal training whatsoever) governance secretary for a housing co-op with about 900 members, and one of my jobs is screening every proposed rule change before it goes on the ballot for a general meeting. We meet two or three times a year, pass maybe six amendments a year, and I'm the one who has to stamp each proposal "in order" or send it back to whoever drafted it. I get about twenty minutes a proposal, sending something back costs us a month because of the notice period, and a board of nine has to sign off on whatever I've certified — so I need something I can actually point at and work through, not my own vibes. The bit that keeps biting me is self-amendment. Our rulebook can change itself and says so out loud: Rule 31 says any rule, including Rule 31 itself, can be amended by a two-thirds majority at a general meeting with fourteen days' notice. And members keep handing me amendments that do things to the machinery of amendment itself, usually by accident but sometimes quite deliberately. Can a two-thirds vote be used to take some rule out of the reach of future two-thirds votes? If an amendment lowers the quorum, was it validly passed under the old quorum or can it bootstrap itself in under the new one? What do I even do with an amendment that says of itself that it may never be amended or repealed — does it fail, does it take effect but do nothing, or does the rulebook just now contain two rules that contradict each other? And there's an audit problem too: an old amendment gave Rule 19 its own special amending procedure (approval by the management committee), then a later amendment abolished the management committee, so Rule 19 is still on the books and as far as I can tell nobody can now amend it at all.

  My brother did a philosophy degree and says this is exactly what a game called Nomic was invented to play with, and that there's a book about it. I don't want a reading list or a bibliography — I can't get to a university library and I wouldn't read it anyway, so please don't give me sources or citations. What I do want is the actual logic of self-reference and self-amendment turned into an intake procedure: the questions to ask, in order, on each proposal I recieve; what counts as a sufficient answer to each; the point at which the procedure stops with a "no, send it back"; and the point at which it has to hand the decision to a human being because the question is really about what the co-op wants to be able to bind itself to, not about what the rules say. I've started informally sorting proposals into four buckets and I'd like you to tell me which of these distinctions actually need to survive and which are clutter: (1) order — does the amendment touch the amending rule rather than just some first-order rule; (2) reach — does it operate on itself, e.g. retroactively or by repealing its own enabling procedure once it takes effect, i.e. one-shot versus continuing amendments; (3) orphans — does it leave some rule whose amendment route no longer exists; (4) stacking — does it change the threshold, quorum or manner-and-form in the same vote as some substantive change. I also need a tie-break rule, since our rulebook is completely silent on it: when two rules genuinely conflict, do I go later-in-time, higher-order-wins, or more-specific-wins, and whatever you pick, be honest about whether it's derivable from anything or is just a choice we'd be making. And please be straight about which steps are judgement dressed up as procedure — I'd rather know than ship a form that looks rigorous and isn't. British English throughout, please (organisation, favour, judgement), and plain language: the person running this is a volunteer with a spreadsheet, not a lawyer.

  Here's the rulebook as it stands and the three live proposals I want you to run the finished procedure on:

  - **Rule 31**: any rule, including this rule, may be amended by a two-thirds majority at a general meeting of which fourteen days' notice has been given. Quorum for a general meeting is 40 members.
  - **Rule 3**: membership is open to any adult who pays the subscription.
  - **Rule 7**: no member may be expelled without a hearing.
  - **Rule 12**: the treasurer must publish accounts quarterly.
  - **Proposal A** (from a member, looks harmless): Rule 7 may only be amended by a three-quarters majority at two consecutive general meetings.
  - **Proposal B** (from the management committee, and the one I'm under pressure to let through as a single motion before the AGM): the quorum for a general meeting is reduced to 12 members, and Rule 3 is amended to restrict membership to people who have lived in the borough for at least two years.
  - **Proposal C** (from a member who has clearly thought about this too much): Rule 12 is repealed with immediate effect, and this amendment may not be amended or repealed.

  Please run the procedure on all three and give me the verdict on each, including at least one where the answer goes against something I want — I'd guess B is going to be that one, since if it has to be split the quorum fix definately won't land before the AGM and I'll be the one explaining that to the committee. Then tell me what the procedure can't do: which kinds of proposal it will always get wrong or stay silent on, and what I should do with those besides guessing.
reasoning: |-
  Okay, let's start by understanding the user's situation. They're an unpaid governance secretary for a housing co-op with 900 members. Their main task is screening rule changes before they go to a vote. They have limited time per proposal—about 20 minutes—and sending one back causes a month's delay. The board of nine must approve their decisions, so they need a clear, logical procedure, not just gut feeling.

  The big issue is self-amendment. Rule 31 allows any rule, including itself, to be changed by a two-thirds majority. Members keep proposing amendments that mess with the amendment process itself. The user needs a step-by-step intake procedure to evaluate each proposal. They mentioned sorting proposals into buckets: order, reach, orphans, and stacking. They want to know which distinctions are useful and which aren't, plus how to handle conflicts when rules contradict.

  They provided three proposals. Proposal A adds a higher threshold for amending Rule 7. Proposal B changes quorum and membership rules in one motion. Proposal C repeals Rule 12 and makes itself unamendable. The user suspects Proposal B will be problematic and wants the procedure to flag it.

  First, I need to address the self-amendment logic. Key questions: Can a rule make itself harder to amend? What happens if an amendment affects the process that enabled it? The orphan issue (like Rule 19) is tricky—if the amending body no longer exists, the rule can't be changed. Also, stacking changes (mixing procedural and substantive changes) might be invalid if done together.

  The user's buckets: Order and reach seem essential. Orphans are critical to prevent unchangeable rules. Stacking needs attention because combining changes can cause bootstrapping issues. The tie-break rule for conflicts is needed. Later-in-time makes sense as it's common in legal systems, but it's a choice, not derived from existing rules.

  Building the procedure step-by-step: Start with checking if the amendment touches Rule 31 or other procedural rules. Then, see if it affects itself (self-referential). Check for orphans—does any rule become unamendable? Evaluate stacking—are procedural and substantive changes mixed? If so, it might need splitting. Finally, resolve conflicts with later-in-time.

  Applying this to the proposals: Proposal A is okay because it doesn't create orphans or conflict with Rule 31. Rule 7 can still be changed, just with a higher bar. Proposal B combines quorum and membership changes. Since quorum affects the voting process, it's invalid as a single motion. Splitting them is necessary. Proposal C tries to make itself unamendable, which conflicts with Rule 31. It's invalid because it creates an orphan—Rule 12 can't be reinstated.

  The procedure can't handle all edge cases, like if an amendment tries to dissolve the co-op. Those need human judgment. Also, proposals that are vague or have unintended consequences might slip through. The user should flag such cases for the board's attention.

  Underlying needs: The user wants efficiency and clarity to avoid delays and board pushback. They need confidence in their decisions, avoiding personal bias. They also need to educate members on valid proposals to reduce rejections. The procedure must be practical, not theoretical, fitting into their 20-minute window.
answer: |-
  Here's a self-amendment intake procedure based on your buckets, designed for speed and defensibility. It prioritises preventing logical traps over policy debates, using **five sequential tests** with clear pass/fail criteria. British English and plain language throughout.

  ### The Intake Procedure: Five Tests in Order
  **(Run each test in sequence. Fail any test = send back. Pass all = "in order".)**

  1.  **The Order Test:** *"Does this proposal change Rule 31 (the amending rule) or any rule governing how meetings are called, quorum, voting thresholds, or notice periods?"*
      *   **Pass:** No, it only changes other rules (e.g., membership, treasurer duties).
      *   **Fail:** Yes, it touches the amendment machinery itself (Order bucket).
      *   **Action:** If Fail, proceed to Test 2. If Pass, skip to Test 3.

  2.  **The Reach Test:** *"Does the proposal try to change how *itself* was passed, or prevent its own future amendment/repeal?"*
      *   **Pass:** No. It operates prospectively only (e.g., "Rule X is amended to read...").
      *   **Fail:** Yes. It attempts retroactive effect (e.g., "this amendment is deemed passed under the old quorum"), self-repeal of its enabling power, or declares itself unamendable ("this rule may never be amended").
      *   **Action:** If Fail = **SEND BACK**. Self-referential amendments create unresolvable paradoxes under Rule 31. If Pass, proceed to Test 3.

  3.  **The Orphan Test:** *"Does this proposal leave any existing rule without a valid amendment path?"*
      *   **Pass:** No. All rules can still be amended via Rule 31 or their own specific procedure (if any remains valid).
      *   **Fail:** Yes. It removes/changes an *entire category* of rule or body (e.g., abolishing the Management Committee without providing *any* new way to amend rules that *required* committee approval, like your Rule 19 example).
      *   **Action:** If Fail = **SEND BACK**. Creates permanently unchangeable rules (orphans). If Pass, proceed to Test 4.

  4.  **The Stacking Test:** *"Does this proposal combine a change to the amendment machinery (Rule 31, quorum, notice, thresholds) with a substantive change to another rule in a single vote?"*
      *   **Pass:** No. It's either:
          *   *Only* a change to amendment machinery (Order bucket), *or*
          *   *Only* a substantive change to other rules, *or*
          *   Multiple substantive changes bundled together.
      *   **Fail:** Yes. It bundles a procedural change (affecting how votes work) with a substantive change (e.g., changing quorum *and* membership rules in one motion).
      *   **Action:** If Fail = **SEND BACK** (with advice to split into separate proposals: one for the procedural change, one for the substantive change). Procedural changes must be assessed under the *old* rules for validity. Bundling risks bootstrapping. If Pass, proceed to Test 5.

  5.  **The Conflict Test:** *"Does this proposal directly and unavoidably conflict with an existing rule, assuming both are valid?"* (Use the tie-break rule here).
      *   **Pass:** No clear, direct conflict, *or* conflict resolvable by the Tie-Break Rule.
      *   **Fail:** Creates a genuine, unresolvable deadlock (extremely rare under the Tie-Break Rule).
      *   **Action:** If Pass = **IN ORDER**. If Fail = **SEND BACK** (explain the unresolvable conflict).
      *   **Tie-Break Rule (Judgement Call):** *Later-in-time wins.* A newer amendment overrides an older conflicting rule. **This is not derivable from your rulebook; it's a standard legal principle adopted as a practical necessity.** Be explicit that this is a convention you're applying.

  **Where Judgement Dresses as Procedure (Be Honest):**
  *   **Orphan Test (Test 3):** Judging whether a future amendment path *remains* valid requires assessing if the proposed change *completely* destroys it without replacement. Minor changes to a procedure (e.g., increasing the threshold) don't orphan a rule.
  *   **Conflict Test (Test 5):** Identifying a "direct and unavoidable conflict" and applying the tie-break rule involves judgement. The procedure forces you to articulate the conflict and apply the consistent tie-break, making it defensible, but it's not pure logic.

  ### What Your Buckets Survive (and What's Clutter)
  *   **Order (Survives as Test 1):** Essential gatekeeper.
  *   **Reach (Survives as Test 2):** Core self-reference check. Critical.
  *   **Orphans (Survives as Test 3):** Critical for preventing dead ends.
  *   **Stacking (Survives as Test 4):** Key practical trap. Bundling is the most common way amendments become invalid.
  *   **Clutter Removed:** "One-shot vs continuing" isn't a useful distinction for *screening* – Test 2 (Reach) catches the problematic one-shots (self-repeal/immutability). "Operating on itself" is covered by Reach.

  ### Applying the Procedure to Your Proposals

  *   **Proposal A:** Rule 7 may only be amended by a three-quarters majority at two consecutive general meetings.
      *   **Test 1 (Order):** Changes Rule 7 (substantive), not Rule 31 directly. *Pass. Skip Test 2.*
      *   **Test 3 (Orphan):** Rule 7 can still be amended, just with a higher bar. Rule 31 remains fully functional. *Pass.*
      *   **Test 4 (Stacking):** Only changes Rule 7. No bundling. *Pass.*
      *   **Test 5 (Conflict):** Doesn't conflict with Rule 31; it *uses* Rule 31 to create a bespoke procedure *for Rule 7*. Rule 31 still allows amendment of *any* rule, including Rule 7 using this new process. *Pass.*
      *   **Verdict: IN ORDER.**

  *   **Proposal B:** Quorum reduced to 12 members, AND Rule 3 amended to restrict membership.
      *   **Test 1 (Order):** YES. It changes quorum (part of the amendment machinery). *Fail. Proceed to Test 2.*
      *   **Test 2 (Reach):** Does not attempt to change how *itself* was passed or prevent future amendment. *Pass.*
      *   **Test 3 (Orphan):** No rules are orphaned. *Pass.*
      *   **Test 4 (Stacking):** YES. It bundles a procedural change (quorum reduction) with a substantive change (membership restriction) in a single vote. *FAIL.*
      *   **Verdict: SEND BACK.** Must be split into two separate proposals:
          1.  *Proposal B1 (Procedural):* "Quorum for a general meeting is reduced to 12 members." (Runs Tests 1-5 alone).
          2.  *Proposal B2 (Substantive):* "Rule 3 is amended to restrict membership to people who have lived in the borough for at least two years." (Runs Tests 1, 3-5).
      *   **Why it bites:** You predicted it. The quorum fix can't be bundled with the membership change. The committee needs to prioritise B1 separately if AGM timing is critical.

  *   **Proposal C:** Rule 12 is repealed, AND this amendment may not be amended or repealed.
      *   **Test 1 (Order):** Changes Rule 12 (substantive), not Rule 31 directly. *Pass. Skip Test 2?* **WAIT!**
      *   **Test 2 (Reach):** **FAIL.** The clause "this amendment may not be amended or repealed" directly attempts to prevent its own future amendment/repeal. This violates the core principle of Rule 31.
      *   **Verdict: SEND BACK.** Fails at Test 2. The self-immutability clause is invalid.

  ### What the Procedure Can't Do (And What To Do)

  1.  **Policy Wisdom:** It won't stop stupid, unfair, or unworkable amendments that are logically sound (e.g., "All decisions require unanimity", "Subscriptions are £1/year"). It only catches *procedural/logical* flaws.
      *   **What to do:** Your role is screening for *order*, not policy. Flag policy concerns *informally* to the proposer/board if glaring, but certify as "in order" if it passes the tests. The vote decides policy.

  2.  **Unintended Consequences:** It might miss subtle knock-on effects or contradictions that only emerge later in complex rulebooks.
      *   **What to do:** Do your best within 20 minutes. Flag *potential* conflicts spotted during Test 5 as notes for the board, even if it passes. Document your reasoning.

  3.  **Fundamental Changes:** It can't handle proposals designed to destroy the co-op or make governance impossible (e.g., "Dissolve the co-op", "Abolish all rules", "Rule 31 requires 100% vote of all 900 members"). These might technically pass the tests but are existential.
      *   **What to do:** If a proposal clearly aims to destroy the governance structure or make future governance impossible, flag it urgently to the Board *before* certifying, regardless of the tests. This goes beyond "order" into existential threat. The Board may need legal advice or to rule it out of order on broader principles (like the co-op's fundamental purpose).

  4.  **Vagueness/Ambiguity:** It won't fix poorly drafted rules that are unclear but procedurally valid.
      *   **What to do:** If wording is so ambiguous it could cause immediate conflict (Test 5), send back for clarification. Otherwise, note the ambiguity for the Board/members to consider during debate/vote.

  **Summary:** This procedure gives you a clear, sequential checklist to catch the most common and dangerous self-amendment traps (self-reference, bootstrapping, orphans, stacking). It forces articulable reasons for rejection based on Rule 31's logic. It makes the later-in-time tie-break explicit. It accepts that judgement is needed on conflicts and orphans, but structures that judgement. Use it consistently, document your reasoning for each test on each proposal, and you'll have a defensible "in order" or "send back" stamp. Good luck with Proposal B – stand firm on splitting it!
