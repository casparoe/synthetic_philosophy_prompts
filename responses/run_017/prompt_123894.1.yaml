  The audience is diverse - behavioral ecologists, philosophers with different leanings, an animal ethicist, and swarm robotics researchers. Each group will have specific concerns. The ecologists might see colony-level talk as shorthand; the 4E philosopher might reject content-bearing states; the representationalist will want error conditions; the ethicist will care about welfare implications; and the swarm researchers need empirical testability.

