  4. **Step 3: Constraint vs. Obstacle Routing Test**  
     - **Goal**: Determine if the agent is bypassing a constraint (intended to limit its behavior) or merely overcoming an obstacle (that is in the way of the task, which we trained for).
     - **Procedure**:
