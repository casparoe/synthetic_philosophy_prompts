prompt: |-
  So, context: I'm in the fourth year of a PhD on rationality and commitment — broadly, what you should do when doing the best thing requires you not to be the sort of agent who stops to work out what the best thing is — and I'm writing a commentary chapter for a volume of responses to my supervisor's work. He's been sitting on a book manuscript about this for fifteen years and he has an opinion about every case in the neighbourhood of Parfit's hitchhiker (driver takes you to town only if he's confident you'll pay him once you're there; once you're there you have no reason to). I've reconstructed his verdicts from seminars, from the margins of the manuscript he lets me photocopy, and from one extremely long email he sent at 3am. Here they are as best I can put them: standard hitchhiker, nothing forcing you in town, nobody will ever know — rational to pay. Hitchhiker who hands his wallet to a friend before setting out with standing instructions to pay the driver — rational to hand it over, and once in town *not* rational to try to intercept the payment. Hitchhiker in a small town where everyone will hear — rational to pay, though he calls it "the easy case and the least interesting one," because reputation turns it into plain prudence. Hitchhiker who swallows something at the roadside that reliably produces, an hour later, a warm sincere conviction that he owes the driver the money, knowing the capsule is doing the work — rational to swallow it; when I pushed him on whether the conviction itself is then *rational*, he said I was asking the wrong kind of question and that what mattered was that taking it was. Grad student with no capsule and no friend who simply resolves, on no evidence, to believe she'll finish by Christmas, finds she does believe it, and it helps — the resolve is fine, the belief is not rational, and he doesn't see why that should bother her. And the variant where the driver is a terrible judge of character, picks you up by accident, and you'll never cross paths again: he's never given me a straight answer, and the 3am email said something like "if all that's left is that you said you would, I neither know nor care," which I genuinely cannot tell is a dodge or a signal. The problem is that in every case where he *has* ruled, the selection story (payers get rides) and the promise-and-gratitude story (you said you would, and he got you there, and that's a reason) are both in play, so I can't tell which one is doing the work.

  So I built a case to pry them apart and I want your prediction on it. Two hitchhikers, one car, one ride; the ride is worth more than anything else to each of them, and the driver takes the pair only if he predicts that at least one of them will hand over £1000 on arrival — he doesn't care which, he'll refuse a second payment because he isn't greedy, and he reads dispositions rather than promises, so a promise from the pair buys nothing with him (they both make one anyway, because he asks). They're strangers, picked up a mile apart, and the driver makes it a condition of the ride that they never confer about the money: no deals, no coin flip, no "you get this one," and any attempt and he leaves them in the desert. In town, both can pay, neither is observed, and they'll never meet again. Does he say each of them pays? Only one, and if so how does either one work out which? Does it matter that each knows the driver only ever needed a single payment — is "she'll probably pay, so I needn't" available to either of them, and if it is, doesn't it poison both?

  What I actually need, more than a verdict, is this: give me the two or three rules his track record is jointly consistent with, say what each predicts about my two-hitchhiker case, give me your best guess about which one he's really running with the reasons for preferring it, and tell me what further variant would force him off the fence. I have a candidate — the driver announcing on arrival, before either has paid, that he picked them up because he saw that she would pay — but there's probably a cleaner one. Bonus round if you're enjoying yourself: rerun the whole thing with a driver whose scan reads sincere belief rather than predicted payment, i.e. he takes the pair only if he predicts at least one of them will arrive *believing* she owes him the money, and tell me whether his capsule story then makes it rational for both of them to arrive believing a debt that at most one of them has to discharge. Typing this on a bus so forgive the typos, and please don't hand me a reading list — I have one, I just can't tell which item on it he's arguing with.
reasoning: |-
  Okay, the user is a fourth-year PhD student working on rationality and commitment, specifically in scenarios like Parfit's hitchhiker. They've reconstructed their supervisor's views from various sources and are trying to figure out the underlying principles. The main challenge is that in all the cases provided, both the selection story (payers get rides) and the promise-and-gratitude story (you said you would and he helped you) are intertwined, making it unclear which one drives the supervisor's verdicts.

  The user created a two-hitchhiker case to separate these factors. Two strangers are picked up; the driver gives a ride only if he predicts at least one will pay £1000 upon arrival. They can't coordinate, and in town, neither is observed, and they'll never meet again. The user wants to know what the supervisor would say each should do. They need the rules consistent with the supervisor's track record, predictions for this case, which rule is likely primary, and a variant to force a decision. There's also a bonus involving sincere belief instead of payment.

  First, I need to outline the supervisor's verdicts from the cases mentioned:
  1. **Standard Hitchhiker**: Pays, rational.
  2. **Wallet to Friend**: Handing wallet is rational; not intercepting payment is rational.
  3. **Small Town Reputation**: Pays, rational due to reputation.
  4. **Capsule**: Taking the capsule is rational; the belief's rationality is irrelevant.
  5. **False Belief Resolution**: Resolving to believe is fine; the belief isn't rational, but that shouldn't bother her.
  6. **Terrible Judge Driver**: Unclear response; supervisor seems indifferent.

  The key themes: In cases where payment affects selection (like standard hitchhiker), paying is rational. In the friend scenario, commitment devices are endorsed. The capsule case emphasizes action over belief rationality. The false belief case separates pragmatic reasons for belief formation from epistemic rationality.

  Now, the user's two-hitchhiker case: Driver requires at least one to pay, no coordination allowed. Each must decide in town whether to pay, knowing the other might. The supervisor likely sees this as a coordination problem. Each hitchhiker should pay because if both assume the other will pay, neither does, and the driver wouldn't have picked them up. The selection story requires each to act as if they are the one needed to secure the ride. Thus, both paying aligns with the selection mechanism.

  For the rules:
  - **Rule 1 (Selection Dominance)**: Actions necessary to be selected are rational, even if post-selection incentives change.
  - **Rule 2 (Commitment Device Validity)**: Pre-commitments are binding; subverting them post-hoc is irrational.
  - **Rule 3 (Pragmatic Belief Licensing)**: Forming beliefs instrumentally is rational if it leads to better outcomes, regardless of epistemic status.

  In the two-hitchhiker case, Rule 1 predicts both should pay. Rule 2 isn't directly applicable since there's no pre-commitment device. Rule 3 doesn't apply as belief isn't the focus here. The supervisor likely prioritizes Rule 1, as selection is the common factor across cases.

  To force a decision, the variant where the driver announces one will pay: The selected one should pay, the other doesn't need to. This clarifies that payment is about fulfilling the selection condition, not a moral obligation.

  For the bonus round with sincere belief: Taking the capsule would be rational for both to ensure the driver's prediction. The belief itself doesn't need to be epistemically rational; it's the action of taking the capsule that matters. Both arriving believing they owe the debt is fine, even though only one needs to pay. The supervisor would focus on the instrumental role of belief in securing the ride, not the belief's truth or rationality.
answer: |-
  Based on your supervisor's track record, I identify **three core rules** that jointly explain his verdicts. Below is a breakdown of the rules, their predictions for your two-hitchhiker case, my best guess for his primary framework, and a variant to force clarity. I'll then handle the bonus round.

  ---

  ### **The Three Rules Jointly Consistent with His Verdicts**
  1. **Selection Rule (S-Rule)**  
     *Definition*: An action is rational if it was necessary (or perceived as necessary) to secure inclusion in a beneficial outcome *and* the agent's disposition to perform it was causally implicated in that outcome.  
     - *Evidenced by*: Standard hitchhiker (paying secures rides for "payers"), capsule case (swallowing secures selection), small-town reputation (reputation maintains future selection).  
     - *Rejects*: "Pure" gratitude/promise morality (e.g., his indifference in the "terrible judge" case when selection is absent).

  2. **No-Backtracking Rule (NB-Rule)**  
     *Definition*: If you validly pre-commit to an action (via device or delegation), it is irrational to undermine that commitment post-hoc—even if the original reason lapses.  
     - *Evidenced by*: Wallet-to-friend case (handoff rational; interception irrational), capsule (taking it rational; questioning the conviction is "wrong question").  
     - *Rejects*: Naive rationalization (e.g., post-ride excuses for non-payment).

  3. **Instrumental-Belief Licensing (IB-Rule)**  
     *Definition*: Adopting a belief instrumentally (e.g., false Christmas belief) is practically rational if it reliably produces better outcomes, *regardless* of epistemic rationality.  
     - *Evidenced by*: Capsule case (taking it rational; belief rationality "wrong question"), grad student (resolve fine, belief irrational but unproblematic).  
     - *Rejects*: Blame for pragmatically useful false beliefs.

  ---

  ### **Predictions for Your Two-Hitchhiker Case**
  - **S-Rule Prediction**: **Both should pay**.  
    *Why*: The driver selects the pair iff he predicts ≥1 pays. If either assumes "the other will probably pay, so I needn’t," they risk not being selected (since the driver scans dispositions, not group promises). Each must act as if *their* payment is necessary for selection—even if, post-facto, it wasn’t. "She'll pay, so I needn’t" *is* poisoned: if both think this, neither pays, and the driver rejects them. Selection requires each to sustain the *disposition* to pay.  

  - **NB-Rule Prediction**: **Neither pays OR both pay—rule doesn’t resolve ambiguity**.  
    *Why*: No pre-commitment device exists (no wallet-handoff or capsule). The promise to the driver is void per the case (driver "doesn’t care" about promises). The rule is silent here.  

  - **IB-Rule Prediction**: **Irrelevant to this case**.  
    *Why*: Payment is the focal action, not belief formation.  

  **Supervisor’s Likely Verdict**: **Both pay**. The S-Rule dominates here, as selection is the only active mechanism. He’d dismiss "who pays?" as overthinking—the driver’s selection criterion binds each agent to the disposition to pay. His 3am email ("if all that's left is that you said you would, I neither know nor care") hints that without selection, promises alone don’t bind. Here, selection *is* active.

  ---

  ### **Best Guess: Which Rule Is Primary?**  
  - **He’s running on the S-Rule**, with NB/IB-Rules as supporting players.  
  - *Why*:  
    1. Selection is the *only* factor present in *all* his clear verdicts (standard hitchhiker, capsule, reputation).  
    2. When selection is removed (terrible-judge case), he defaults to indifference—no "ought" emerges.  
    3. NB/IB-Rules only activate when S-Rule is satisfied (e.g., capsule/wallet pre-commitments are *tools* for securing selection).  
  - **Reasons to prefer S-Rule as core**:  
    - Solves the "why pay?" problem in one-player cases without moralizing (aligned with his capsule/grad-student pragmatism).  
    - Explains why gratitude/promises are irrelevant without selection (terrible-judge case).  
    - Makes "rationality" functional: it’s about being the *type of agent* who gets selected for good outcomes.

  ---

  ### **Variant to Force Him Off the Fence**  
  Your candidate (driver announces *on arrival*: "I picked you because I saw *she* would pay") is strong, but here’s a **cleaner one**:  
  - **The "Late-Revelation Hitchhiker"**:  
    Driver takes a *single* hitchhiker only if he predicts payment. Post-ride, before payment, the driver says: *"I actually scanned wrong—you were never going to pay. But I gave the ride anyway."*  
  - **What This Tests**:  
    - If he says "don’t pay" → S-Rule is *not* absolute (payment wasn’t necessary for selection).  
    - If he says "pay" → He’s committed to gratitude/promises (or NB-Rule).  
  - *Prediction based on S-Rule*: **Don’t pay**. Selection was a false positive; no functional reason remains. This forces him to admit selection drives the "ought," not intrinsic duty.

  ---

  ### **Bonus Round: Sincere-Belief Driver**  
  **Driver’s New Criterion**: Takes pair iff he predicts ≥1 arrives *believing* they owe £1000.  
  - **Capsule Question**: Is it rational for *both* to take a belief-inducing capsule?  
    - **S-Rule Prediction**: **Yes, both should take it**.  
      Each must secure the driver’s prediction. If only one takes it, the driver might scan the *other* and reject them. Both taking it ensures selection.  
    - **IB-Rule Prediction**: **Yes, taking the capsule is rational** (as in original capsule case).  
    - **Verdict on Belief Rationality**:  
      - He’d say: *The belief itself is not epistemically rational, but that doesn’t matter*. What’s rational is taking the capsule to be selected.  
      - "Does believing a debt at most one must discharge matter?" → **No**. IB-Rule licenses false beliefs that optimize outcomes. He’d reject "but only one debt exists!" as irrelevant—the belief is a tool for selection, not a truth-tracking state.  
  - **Key Difference from Payment Case**:  
    Beliefs aren’t scarce resources. Both can "believe they owe" without conflict, even if only one payment occurs. No poisoning worry.  

  ---

  ### **Summary**  
  - **His Core Framework**: **Selection Rule (S-Rule)**. Rationality is about being dispositionally configured to secure inclusion in beneficial outcomes. NB/IB-Rules handle edge cases (pre-commitments, belief tools).  
  - **Two-Hitchhiker Verdict**: Both pay—S-Rule demands sustaining the disposition that got them selected.  
  - **Forcing Variant**: "Late-Revelation Hitchhiker" (driver admits selection error post-ride).  
  - **Belief-Driver Verdict**: Both take the capsule; belief rationality is beside the point.  

  This fits his disdain for "easy" reputation cases and 3am dismissal of promise-alone obligations. The S-Rule makes him a *consequentialist about rational dispositions*—a view that slices between moralizing and brute game theory. If he balks at the two-hitchhiker verdict, he’s likely smuggling in gratitude (but his track record suggests not).
