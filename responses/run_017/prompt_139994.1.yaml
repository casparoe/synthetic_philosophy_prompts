  ### Part I: The Questions  
  *(Participants answer these before exposure to literature)*  

  1. **Monitor Case**  
  A patient has a monitor implanted in her motor cortex. The monitor is programmed to detect any attempted hand movement that is failing to be initiated and to stimulate the cortex so that the same movement occurs, with the same force, direction, and timing that it would otherwise have had. On Tuesday afternoon, she reaches for a glass because she wants a drink and believes the glass contains water; the monitor detects nothing amiss and does nothing. Did her wanting a drink and her believing there is water cause the reaching?  
     (a) Yes: the monitor did nothing, and the reaching happened because of what she wanted and believed.  
     (b) Yes, but only because wanting the drink and believing there was water were, on that occasion, goings-on in her brain that produced the reaching; the wanting and believing themselves made no difference to anything.  
     (c) Yes in the everyday sense, but what actually brought the reaching about was the neural process, and the wanting and believing came along with it without doing any of the work.  

  2. **Symmetric Overdetermination**  
  Two assassins, Alice and Bob, independently plan to poison Victor’s drink. Alice uses a slow-acting toxin; Bob uses a fast-acting one. Both toxins are fatal alone. Unbeknownst to each other, they poison Victor simultaneously. Victor dies from the combined toxins. Did Alice’s poisoning cause Victor’s death?  
     (a) Yes: her toxin alone would have killed him, and it contributed to his death.  
     (b) Yes, but only because Bob also poisoned him; if only one had acted, it would have caused death, but since both did, they overdetermined it.  
     (c) No: Bob’s toxin was sufficient, so Alice’s action was unnecessary.  

  3. **Probabilistic Case**  
  A specific brain state (P) has an 80% chance of causing a panic attack. A mental state (anxiety) always occurs when P is present. When anxiety occurs, the probability of a panic attack rises to 90%. In one instance, P occurs, anxiety occurs, and a panic attack happens. Did the anxiety cause the panic attack?  
     (a) Yes: anxiety raised the probability of the attack beyond what P alone contributed.  
     (b) No: P fixed the probability, and anxiety added nothing extra.  

  4. **Multiple Realizability**  
  Two AI systems, X and Y, are designed to enter an "overload" state when processing complex data. X uses silicon chips; Y uses quantum circuits. Both output an error message when overloaded. When X processes complex data, it enters overload and outputs the error message. Did the overload state cause the error message?  
     (a) Yes: in both systems, the overload state causes the error, regardless of hardware.  
     (b) Yes, but only because X’s silicon state produced the message; the overload itself is just a pattern and not a cause.  
     (c) No: the silicon state caused it; the overload is an incidental label.  

  5. **Prediction Redundancy**  
  A complete brain scan (P) of a person predicts a 70% chance they will laugh at a joke. The person is also in a mental state (amusement). Given P, adding amusement does not change the probability of laughing (still 70%). They laugh. Did amusement cause the laughter?  
     (a) Yes: amusement is part of why they laughed, even if it doesn’t change the odds given P.  
     (b) No: once P was fixed, amusement made no difference.  

  6. **Neural Effect**  
  A musician practices a piece until she masters it. During practice, her brain develops new neural connections. Did her practicing (a mental effort) cause the new neural connections?  
     (a) Yes: the effort brought about the neural changes.  
     (b) No: only prior neural events caused the new connections; the effort was just along for the ride.  
     (c) Yes, but only because the effort was a neural process.  

  7. **Physically Identical Agents**  
  Two neuro-identical robots, R1 and R2, are in identical physical states when exposed to a red light. For R1, this produces a "red experience"; for R2, due to a defect, it produces a "blue experience" (but both say "red" because they are programmed to). Both say "red." Did R1’s "red experience" cause it to say "red"?  
     (a) Yes: the experience led to the response.  
     (b) No: since R2 had a different experience but said the same thing, the experience made no difference.  
     (c) Yes, but only because the experience is physical.  

  8. **Preemption Case**  
  A sniper (Sarah) and a backup sniper (Tom) are both aiming at a target. Sarah fires, killing the target instantly. Tom sees this and does not fire. Did Tom’s decision not to fire cause the death?  
     (a) Yes: if Sarah had missed, Tom would have fired and caused it.  
     (b) No: Sarah’s shot caused it; Tom did nothing.  
     (c) Only if we count inactions as causes, but here Sarah’s action was the actual cause.  

  9. **Grounding Case**  
  A person’s desire for coffee and belief that the cafe is open cause them to walk there. These mental states are realized by a specific neural pattern. Did the neural pattern cause the walking?  
     (a) Yes: the neural activity produced the walking.  
     (b) No: the desire and belief caused it; the neural pattern is just how they were realized.  
     (c) Both caused it, but they aren’t separate; the mental states are grounded in the neural pattern.  

  10. **Program Explanation**  
     A gene (G) causes both a hormone imbalance (H) and aggressive behavior (A). H is known to cause A. When we explain A by citing G, is G a cause of A?  
     (a) Yes: G caused H, which caused A, so G is an indirect cause.  
     (b) No: G caused H, and H caused A, but G did not directly cause A.  
     (c) G explains A by ensuring a cause (H) is present, but G itself isn’t a cause.  

