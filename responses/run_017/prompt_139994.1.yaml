  **Question 3: Probabilistic Case**
  A brain state P1 has a 90% chance of causing a behavior B. A mental state M always occurs when P1 occurs, and when M occurs, the probability of B is 95%. In a particular instance, P1 occurs, M occurs, and B occurs. Did M cause B?
  (a) Yes: because the probability of B given M is higher than given P1 alone, so M raised the probability of B.
  (b) No: because P1 was already present and fixed the probability of B; M made no additional contribution.

  **Question 4: Multiple Realizability**
  Two robots are designed to feel pain when damaged. Robot X has electronic circuits that realize its pain state. Robot Y has a hydraulic system that realizes its pain state. Both robots, when in pain, produce a distress signal. The distress signal is the same in both. When robot X is damaged, it goes into pain state and emits the distress signal. Did the pain cause the distress signal?
  (a) Yes: in both robots, pain causes the distress signal, even though the physical realizers are different.
  (b) Yes, but only because in robot X, the electronic state caused the signal; the pain itself is just a pattern and not a cause.
  (c) No: what caused the signal in robot X was the electronic state, not the pain.

  **Question 5: Mental State Predicts Nothing**
  Consider a person in a particular brain state P. Given P, the probability of behavior B is 0.8. The person is also in a mental state M. Given both P and M, the probability of B is still 0.8. In this instance, B occurs. Did M cause B?
  (a) Yes: M is part of the cause, even if it doesn't change the probability given P, because without M, the cause might not have occurred.
  (b) No: because once P is fixed, M doesn't change the probability of B, so it made no difference.

  **Question 6: Neural Effect**
  A person is thinking about a math problem. As she thinks, her brain activates a particular neural pattern associated with insight. Did her thinking about the math problem cause the neural pattern?
  (a) Yes: the thinking brought about the neural pattern.
  (b) No: the thinking is just a mental state, and only physical events can cause neural patterns; the neural pattern was caused by prior neural events.
  (c) Yes, but only because the thinking is a physical brain state.

  **Question 7: Physically Identical Agents**
  Two identical twins are in exactly the same physical state, including their brains, at a moment when they are both looking at a red apple. For twin A, this produces a sensation of red. For twin B, due to a congenital condition, the same physical state produces a sensation of green (but she has learned to call it "red" so she behaves the same). Both say "that's a red apple". Did twin A's sensation of red cause her to say "red"?
  (a) Yes: she had the sensation of red and that caused her to say "red".
  (b) No: because her physical state was the same as twin B's, and twin B had a different sensation but said the same thing, so the sensation made no difference.
  (c) Yes, but only because the sensation is a physical state.

  **Question 8: Happiness Overdetermination**
  A person has a brain implant that can cause her to feel happy by stimulating her brain. She also can feel happy when she hears good news. One day, both happen: she hears good news (which causes her to feel happy via the normal neural pathway) and at the same time, the implant activates (causing the same feeling of happiness via direct stimulation). She feels happy. Did hearing the good news cause her to feel happy?
  (a) Yes: the good news would have caused it even without the implant.
  (b) Yes, but it was overdetermined because the implant also caused it.
  (c) No: because the implant was activated and was sufficient, so the good news was unnecessary.

  **Question 9: Grounding Case**
  A person's desire for water and his belief that there is water in the glass cause him to reach for the glass. The desire and belief are realized by a particular neural state. Did the neural state cause the reaching?
  (a) Yes: the neural state is what produced the reaching.
  (b) No: it was the desire and belief that caused the reaching; the neural state is just the realizer and not the cause.
  (c) Both caused it, but they are not distinct because the desire and belief are grounded in the neural state.

  **Question 10: Program Explanation**
  A gene is responsible for both a person's aggressive behavior and his high testosterone levels. The high testosterone levels are known to cause aggressive behavior. When we explain the aggressive behavior by the gene, is the gene a cause of the behavior?
  (a) Yes: the gene caused both the testosterone and the behavior.
  (b) No: the gene caused the testosterone, and the testosterone caused the behavior, so the gene is an indirect cause but not a direct cause.
  (c) The gene explains the behavior in the sense that it is the reason why there is a cause (the testosterone), but it is not itself a cause of the behavior.

