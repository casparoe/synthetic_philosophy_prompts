prompt: |-
  I read philosophy on my own, with no academic background and no access to a library, mostly from papers and blog posts I can find in the open. There is one dispute I have been circling for a couple of years, and instead of asking who is right I would like a diagnosis of why it does not move.

  I came in through a case I take to be standard: a demon tells you that it will destroy something you care about unless you admire it. You plainly have a reason to admire the demon. It also seems wrong to say that the demon is admirable, or that admiring it is the fitting, correct, or appropriate response to it. The same shape recurs whenever a consideration speaks in favour of having an attitude without speaking in favour of what the attitude is about: a reason to be afraid of a dog you know is harmless, because being afraid is exhilarating; a reason to believe something, because believing it would make you happy; a reason to feel gratitude toward someone who benefitted you for manipulative reasons. I first got interested because of the last sort of case, for personal reasons, and it is still the one I care about.

  From what I can find, nobody disagrees about which verdict the central cases should get. The disagreement is entirely about what the distinction is, and about whether there is one distinction at all. One family of answers sorts reasons by what they bear on: some bear on whether the attitude fits its object, others on whether it would be good, useful, or safe to be in that state. Another family says the difference is not in the reasons but in the route to the attitude: a reason of the right kind is one you could arrive at the attitude through, one you could cite in forming it, whereas the demon's threat cannot be cited that way because you cannot admire on command. A third family builds the distinction into a theory of what value is, so that the interesting question becomes whether the phenomenon is a problem for that theory specifically or a problem for everyone equally. And there is no agreement about scope either: some writers seem to treat the phenomenon as special to evaluative attitudes like admiration, others treat belief and intention as instances of the very same thing.

  What I find dispiriting is the pattern rather than the positions. Every account I read handles the easy cases, and then needs some addition to handle the hard ones. There is no agreed criterion, no agreed list of which cases are hard, and no visible mechanism by which anyone's mind gets changed. So I have two hypotheses, and I want to know whether either is close.

  The first is that the phenomenon is largely an artefact of how the cases are described. Very often, what is called a wrong-kind reason for an attitude looks like a perfectly good right-kind reason for some neighbouring attitude: the demon's threat is an excellent reason for relief, or for a wary kind of deference; the manipulator's benefit may be a perfectly good reason for a qualified acknowledgement rather than for gratitude. If that is generally true, then the wrong kind is not a kind of reason at all but a mismatch between the scope of a reason and the attitude we fixed on when we described the case. A test I have been applying to myself: take any alleged wrong-kind reason and ask whether there is some nearby attitude for which it is a right-kind reason, and then ask what happens to the verdict if we redescribe the case around that attitude instead. If the answer is always yes, and if the verdict always flips with the redescription, the distinction is doing less work than it looks like it is doing.

  The second hypothesis is that even if the first fails, the dispute is really three disputes being run under one name, and that writers switch between them without noticing: an extension question about which reasons bear on whether an attitude is correct; a deliberative question about which reasons can be the ones you act on in forming it; and a question about what you are accountable for, which reasons make you criticizable or blameworthy for lacking the attitude. Nothing requires these to have the same answer, and the two sides, as I read them, seem to be answering different ones and treating the disagreement as if it were about a single thing.

  I also have one case I have never seen discussed, which I would like used as a probe rather than as a puzzle to be settled: suppose the demon's threat is that unless you admire it, it will prevent a third party from admiring something genuinely admirable, and your admiring the demon is the only way to stop that. Here the reason for admiring is not merely prudential and not merely about your own state; it points at the fittingness of someone else's attitude. What an account says about this case, and whether it says it for the same reason it says what it says about the original demon case, seems to me to reveal what the account is actually tracking.

  So: is this a substantive disagreement about a real distinction that has not yet been characterised correctly; a verbal disagreement conducted in terms like fitting, appropriate, and reason; several distinct questions sharing a name; or a clash of bedrock case intuitions that neither side can argue for? I would like the diagnosis argued from what the different accounts actually claim and actually need, not a tour of the options. And I would like an honest account of what would count as progress given your diagnosis: a criterion that settles the contested cases, agreement on what the hard cases even are, splitting the question into pieces, or nothing at all, on the grounds that the question is ill-posed. If it is the last, say so and say why.
reasoning: |-
  Okay, let me unpack this user's query. They're a self-taught philosophy enthusiast wrestling with the "wrong kind of reasons" problem. The core frustration isn't about who's right but why the debate feels stuck despite decades of discussion. 

  First, I need to map their concerns: 
  - They've noticed every theory handles standard cases (like the demon threat) but requires ad-hoc fixes for edge cases. 
  - They suspect either (1) the distinction collapses upon redescription of attitudes, or (2) the debate conflates three separate issues: correctness conditions, deliberative routes, and accountability. 
  - Their undiscussed "third-party admiration" case seems designed to test theories' coherence.

  Hmm. Their hypotheses are sharp. The redescription test in Hypothesis 1 mirrors Pamela Hieronymi's work on constitutive relations, but the user takes it further by demanding universal applicability. Hypothesis 2's tripartite split resonates with WKR literature's messy history - Rabinowicz/Rønnow-Rasmussen explicitly distinguished correctness from deliberative access, while others like Way blend them. 

  The user's probe case is brilliant. It pressures theories to explain why instrumentalizing *others'* fitting attitudes differs from direct prudential reasons. A buck-passing account (e.g. Scanlon) would call this still WKR since the demon isn't admirable; a constitutivist (e.g. Katsafanas) might argue admiration can't be formed instrumentally regardless of the reason's content. 

  Why does the debate stall? Three layers: 
  - **Methodological stalemate**: Theories optimize for different desiderata (e.g. unity vs. intuitive coverage). No neutral ground. 
  - **Border disputes**: Cases like "belief for happiness" split camps because belief's "correctness" (truth) feels more objective than admiration's. 
  - **Terminal intuition gaps**: E.g., whether the demon case's "can't admire on command" is psychological or conceptual. 

  Progress won't look like consensus. It might involve: 
  - Mapping which theories handle the user's probe case and why (e.g., "to preserve third-party admiration, you need X account"). 
  - Taxonomizing the three disputes in Hypothesis 2 explicitly. 
  - Admitting some intuitions are bedrock - which is okay if we stop talking past each other. 

  The user's personal stake in manipulative gratitude cases makes me wonder if they're seeking tools to dissect real-life ambivalence. That might explain their hunger for conceptual clarity over academic victory. A good diagnosis should honor that.
answer: |-
  Your frustration with the "wrong kind of reasons" (WKR) debate is warranted—it's a notoriously thorny problem. After analyzing the accounts you describe (fitting-attitude theories, deliberative-access theories, and value-first theories), and testing them against your hypotheses and probe case, **your second hypothesis is closest to the truth, but the reality is more layered.** The dispute isn't purely verbal or artefactual, nor is it *just* three disputes conflated—it's a **conceptual knot** where distinct philosophical projects intersect, leading to persistent stalemate. Here's a diagnosis argued from the commitments of each theory:

  ---

  ### **1. Why Your First Hypothesis is Partly Right (But Insufficient)**
  - **The redescription strategy works often, but not universally**.  
    - *Success*: In the demon case, the "reason to admire" *can* be redescribed as a reason for *deference* (attitude toward power) or *strategic compliance* (attitude toward self-preservation). Similarly, a reason to believe for happiness may be a reason to *wish you believed* or *cultivate evidence-seeking*.  
    - *Failure*: Some cases resist redescription. Take *belief*: A reason to believe P because it makes you happy cannot be redescribed as a reason for a "neighbouring attitude" without abandoning belief's core tie to truth. If you insist it's a reason to *pretend* or *act as if* you believe, you've changed the attitude. Deliberative-access theories (e.g., Hieronymi) argue this shows belief's constitutive aim excludes non-evidential reasons.  
    - *Verdict*: Redescription exposes *misattribution* in easy cases (supporting your hypothesis), but hard cases (like belief) reveal a deeper conflict about attitude-types' *constitutive standards*. This isn't an artefact—it's a clash about the nature of attitudes.

  ---

  ### **2. Why Your Second Hypothesis is Largely Correct: Three Conflated Disputes**  
  The debate persistently conflates three questions with different criteria for "right-kind reasons" (RKR):  

  | **Question Type**          | **Core Issue**                                                                 | **Theories Answering It**                          | **Disagreement Driver**                                                                 |
  |----------------------------|-------------------------------------------------------------------------------|---------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Correctness Conditions** | What makes an attitude *fitting* or *accurate* to its object?                | Fitting-attitude (FA) theories (e.g., D'Arms, Jacobson) | Scope dispute: Is fittingness objective (e.g., fear requires danger) or attitude-relative? |
  | **Deliberative Access**    | What reasons can *directly justify forming* the attitude?                     | Constitutivist theories (e.g., Shah, Hieronymi)   | Psychological vs. conceptual constraints: Can you form belief/admiration instrumentally? |
  | **Accountability**         | What reasons make it *blameworthy* to lack the attitude?                      | Normative pressure theories (e.g., Way, Maguire)  | Moral vs. non-moral criticism: E.g., is it irrational or immoral to ignore the demon? |

  - **How conflation happens**:  
    - FA theorists say the demon isn't *admirable* (correctness), so the threat isn't an RKR.  
    - Deliberative theorists say you *can't admire* the demon by deciding to (access), so it's WKR.  
    - Value-first theorists (e.g., Scanlon) say values are *constituted* by RKRs, so the demon's threat can't make it admirable.  
    - **But**: When pressed on *why* the demon isn't admirable, FA theorists appeal to deliberative constraints ("you can't admire on command"). When asked *why* you can't admire on command, deliberative theorists invoke fittingness ("admiring requires seeing merit"). This circularity stalls progress.  

  - **Your probe case reveals the split**:  
    - *Demon threatens to prevent fitting admiration by a third party*.  
      - **Correctness theorist**: "Still WKR. The demon isn't admirable—your reason doesn't bear on *its* properties."  
      - **Deliberative theorist**: "Still WKR. You can't *admire* the demon by reasoning, 'This will save others' fitting attitudes.'"  
      - **Accountability theorist**: "Potentially RKR. You might be *blameworthy* if you don't admire, given the stakes for others."  
    - **Result**: The same case gets different verdicts because each theory answers a different question.  

  ---

  ### **3. Why Genuine Stalemate Persists**  
  - **No agreed "hard cases"**:  
    - Belief cases are "hard" for deliberative theories (can you *really* not believe for happiness?) but "easy" for FA theories (truth is the clear standard).  
    - Attitudes like *intention* split camps: Is a reason to intend X a reason *for X* (Broome), or a reason to *treat X as choiceworthy* (Setiya)?  
  - **Bedrock intuitions**:  
    - **Constitutivists** hold that attitudes like belief/admiration have *built-in aims* excluding instrumental reasons.  
    - **Pluralists** (e.g., Reisner) argue that "fitting" and "ought" come apart—you *ought* to admire the demon even if it's unfitting.  
    - Neither side can convince the other because their premises aren't shared.  

  - **Theoretical trade-offs**:  
    - FA theories handle admiration cleanly but struggle with non-evaluative attitudes (e.g., intention).  
    - Deliberative theories unify attitudes under "rational formation" but face counterexamples (e.g., *subliminal* reasons for fear).  
    - *Progress requires sacrificing intuition in some domain*—and theorists prioritize different intuitions.  

  ---

  ### **Diagnosis & Paths to Progress**  
  The dispute is **not ill-posed**, but it **is fragmented**. It combines:  
  - A **substantive distinction** (RKRs vs. WKRs in correctness/access/accountability senses).  
  - **Verbal disagreements** (e.g., whether "appropriate" means "fitting" or "all-things-considered ought").  
  - **Bedrock clashes** (e.g., whether attitudes have constitutive aims).  

  **Paths to progress**:  
  1. **Disentangle the three questions** explicitly (per your hypothesis). *Example*: Distinguish papers on "fittingness-relative reasons" vs. "reasons-for-forming-attitudes."  
  2. **Clarify the target attitude**. The debate conflates *attitude-types* (belief, fear) with *evaluative concepts* (admirable, fearsome). Progress requires specifying which is at issue.  
  3. **Test with "hybrid" cases** (like your probe). Cases that pressure boundaries (e.g., reasons involving others' fitting attitudes) reveal which question a theory is answering.  
  4. **Accept pluralism**. Some philosophers (e.g., Schroeder) now argue RKR/WKR isn't one distinction—it's a label for multiple, loosely related phenomena.  

  **What wouldn't count as progress**:  
  - A "silver bullet" criterion. The cases are too diverse.  
  - Consensus on hard cases. Attitudes like *hope* or *regret* will always split intuitions.  

  **Final verdict**: The distinction is real but **multiply ambiguous**. The stalemate persists because theorists answer different questions while using the same vocabulary. Your probe case confirms this: a theory's verdict depends on whether it prioritizes *object-groundedness*, *deliberative psychology*, or *normative force*. Progress lies in mapping these priorities—not in forcing consensus.  

  If you apply your redescription test rigorously, it will likely work for *most* evaluative attitudes (admiration/gratitude) but fail for cognitive/directive ones (belief/intention). That asymmetry alone reveals why the debate can't be settled uniformly—and why your diagnosis is astute.
