answer: |-
  The phenomenon you describe lacks a standard name in the literature, though it intersects with several established debates. I'll define it, distinguish it, address your cases, and evaluate its validity.

  ### Definition: Certification by Selective Debunking (CSD)
  **Core Move**: When a debunking explanation successfully accounts for a subset of beliefs within a domain (e.g., 80% of moral judgments), the *residual beliefs* (the 20% unexplained) gain *enhanced epistemic status*. This occurs because:  
  - The debunking acts as a "sieve" that eliminates rival explanations for the residual beliefs.  
  - Unexplainedness implies no *known* non-truth-tracking source, making a truth-tracking source the default inference.  
  - The rigor/comprehensiveness of the debunking *strengthens* the certification of the residue.  

  **Inverse Phenomenon**: **Anomalous Suspicion**  
  When a belief lacks any plausible evolutionary/genealogical explanation, it is treated as *epistemically suspect* because its origin is mysterious or misaligned with truth-tracking mechanisms.  

  **Hidden Parameter**: The *direction* of inference depends on **presumed explanatory exhaustiveness**:  
  - **CSD** assumes the debunking explanation is *maximally complete* for the domain. Residual beliefs "survive scrutiny."  
  - **Anomalous Suspicion** assumes the debunking explanation is *minimally sufficient* for truth-tracking. Unexplained beliefs lack a "pedigree."  

  ### Distinctions from Nearby Notions
  1. **Inference to the Best Explanation (IBE)**:  
     - CSD *uses* IBE but is distinct: It argues that the *absence* of a debunking explanation *is* the best explanation for the residue’s epistemic security.  
     - *Difference*: IBE typically compares positive explanations; CSD exploits explanatory *gaps*.  

  2. **Coincidence/Third-Factor Replies**:  
     - These posit a common cause (e.g., evolutionary pressures track moral facts).  
     - *Difference*: CSD requires no positive link; it exploits the debunker’s *failure* to explain the residue.  

  3. **Modest Survival of Debunking**:  
     - Claims residual beliefs are *unaffected* by debunking.  
     - *Difference*: CSD asserts they are *strengthened* due to the debunking’s comprehensiveness.  

  4. **Global Debunking Arguments**:  
     - Target entire domains (e.g., all moral beliefs).  
     - *Difference*: CSD relies on *local*, partial debunking to certify the remainder.  

  ---

  ### Rulings on Your Cases
  **Case 1: Provisional Certification**  
  - If the debunker could later explain the residue, CSD’s certification *was* provisional.  
  - **Implication**: CSD is defeasible and relies on current explanatory limits. If the residue is later debunked, its "certified" status evaporates. This makes CSD vulnerable to shifts in empirical knowledge.  

  **Case 2: Recent or Technologically-Dependent Judgments**  
  - Recency *undermines* CSD.  
  - **Why**: CSD assumes residual beliefs must have *some* origin. If a judgment (e.g., "digital privacy is a right") depends on recent tech, it lacks an evolutionary etiology. Anomalous Suspicion applies: no evolutionary push → no truth-tracking pedigree. CSD requires the residue to be *candidates* for evolutionary explanation that "survived" the sieve.  

  **Case 3: Export to Logic/Mathematics**  
  - The move fails spectacularly here.  
  - **Why**: We have independent accounts of how logical/mathematical beliefs track truth (e.g., conceptual necessity, proof). An evolutionary debunking of *some* logical intuitions (e.g., probability biases) wouldn’t certify *modus ponens* as "epistemically enhanced" by the sieve—we already have stronger grounds for it.  
  - **Lesson**: CSD is only plausible in domains where:  
    - (a) All beliefs are *presumed* vulnerable to genealogical debunking, *and*  
    (b) No independent truth-tracking mechanism is obvious (e.g., morality vs. math).  

  ---

  ### Evaluation: Is CSD Valid?  
  **Conditions for Soundness**:  
  1. **Explanatory Exhaustiveness**: The debunking must be the *only plausible* causal story for the domain. If alternative truth-tracking sources exist (e.g., rational reflection), CSD fails.  
  2. **No Independent Grounds**: Residual beliefs must lack stronger epistemic foundations (e.g., intuition, coherence).  
  3. **Default Truth-Tracking**: Unexplainedness must reliably indicate truth-connection (contentious; see breakdown below).  

  **Where CSD Breaks**:  
  - **The Gap Fallacy**: Equates "no *known* non-truth-tracking cause" with "likely truth-tracking cause." This ignores:  
    - Unknown debunking explanations (Case 1).  
    - Non-evolutionary non-truth-tracking sources (e.g., cultural drift).  
  - **Asymmetry Problem**: Why privilege truth-tracking as the default? Anomalous Suspicion treats unexplainedness as red flags; CSD treats it as a gold star.  
  - **Domain-Specificity**: CSD works poorly for morality if moral facts require rational access (e.g., Kantianism) but better if morality is wholly naturalized.  

  **What Must Be True for CSD to Work**:  
  - Moral realism must be true (otherwise, no "truth" to track).  
  - Evolutionary explanations must be the *only* game in town for moral psychology.  
  - The residual beliefs must align with a plausible moral ontology (e.g., suffering’s disvalue).  

  ---

  ### Confidence Assessment  
  - **High Confidence**: The definition of CSD, its distinction from adjacent concepts, and its fragility in Cases 2 and 3.  
  - **Moderate Confidence**: The inverse phenomenon (Anomalous Suspicion) as the same mechanism with reversed valence.  
  - **Lowest Confidence**: Whether CSD *ever* succeeds in morality. **Least sure claim**: That CSD requires moral realism to be viable. *Why?* Moral anti-realists might co-opt CSD to certify "pragmatically necessary" beliefs, but this stretches the epistemic logic.  

  ### Summary  
  You’ve identified **Certification by Selective Debunking**—a real, unnamed move that exploits gaps in genealogical explanations to upgrade residual beliefs. Its validity hinges on contentious assumptions about explanatory exhaustiveness and moral ontology. The inverse (Anomalous Suspicion) uses the same gap to downgrade, revealing that the inference direction depends on background commitments about truth-tracking. For the sieve to work, the debunking must leave *only* beliefs that align with a defensible moral epistemology. Otherwise, it’s a gap masquerading as a foundation.
