  ### Procedure for Iterated Elimination of Dominated Strategies (with Mixtures-Last Rule)

  **Conventions and Rules**:
  - **Scope**: This procedure is for two-player, finite normal-form games with at most three actions per player. It relies on strict dominance only (weak dominance is excluded due to order-dependence and potential loss of Nash equilibria).
  - **Theorem**: Strict dominance (pure or mixed) is order-independent for elimination. The final set of surviving strategies is unique and contains all Nash equilibria and rationalizable profiles (for two-player finite games).
  - **Convention**: Elimination is done in rounds. Each round has two phases: (1) Pure elimination until no more exist, (2) Mixed elimination (all at once). Repeat until no eliminations occur in a full round.
  - **Rule of Thumb**: For mixtures, the hand-checkable test (for 2–3 actions) is designed for TAs without linear programming. Beyond three actions per player, manual checks become infeasible (use linear programming or solvers, but this is beyond the scope).

  ---

  ### Step-by-Step Procedure
  1. **Initialization**  
     Start with the full strategy sets for both players. Set `round = 0`.

  2. **Pure Elimination Phase**  
     - **While** there exists a player and a strategy of that player that is strictly dominated by a **pure strategy** (in the current set of the opponent), eliminate that strategy.  
     - **Dominator**: A single pure strategy.  
     - **Check**: For a strategy \(s_i\) of player \(i\) to be strictly dominated by pure strategy \(s_j\):  
       \( u_i(s_j, t) > u_i(s_i, t) \) for all pure strategies \(t\) of the opponent (in the current set).  
     - **Order**: Eliminate all such strategies in any order (order-independent). Repeat until no more pure eliminations are possible.

  3. **Mixed Elimination Phase**  
     - **For each** player and each surviving strategy \(s_i\) of that player, check if \(s_i\) is strictly dominated by a **mixed strategy** over the player's other surviving strategies.  
     - **Dominator**: A mixed strategy (specify probabilities).  
     - **Hand-Checkable Test for 2–3 Actions** (per player; mixture over 1–2 others):  
       - Let \(s_i\) be the strategy to check. Let \(S\) be the set of the player's other surviving strategies (size 1 or 2).  
       - **If \(|S| = 1\) (one other strategy)**: This reduces to pure dominance (should have been caught in Phase 2). Skip.  
       - **If \(|S| = 2\) (two other strategies, say \(A\) and \(B\))**:  
         For each opponent strategy \(t\) (in current set), define:  
         - \(D(t) = u_i(A, t) - u_i(B, t)\)  
         - \(L(t) = u_i(s_i, t) - u_i(B, t)\)  
         Compute:  
         - \(L_{\text{max}} = \max \left\{ \frac{L(t)}{D(t)} \mid t \text{ where } D(t) > 0 \right\}\) (if no such \(t\), \(L_{\text{max}} = -\infty\))  
         - \(U_{\text{min}} = \min \left\{ \frac{L(t)}{D(t)} \mid t \text{ where } D(t) < 0 \right\}\) (if no such \(t\), \(U_{\text{min}} = \infty\))  
         **If** for all \(t\) with \(D(t) = 0\), \(u_i(s_i, t) < u_i(B, t)\) (i.e., \(L(t) < 0\)), and:  
         \[
         L_{\text{max}} < U_{\text{min}} \quad \text{and} \quad L_{\text{max}} < 1 \quad \text{and} \quad U_{\text{min}} > 0
         \]  
         **then** \(s_i\) is strictly dominated by a mixture of \(A\) and \(B\) (e.g., \(p = \frac{L_{\text{max}} + U_{\text{min}}}{2}\) for \(A\), \(1-p\) for \(B\)).  
       - **Beyond Three Actions**: The test requires linear programming (infeasible by hand; beyond this procedure).  
     - Eliminate **all** strategies found to be mixed-dominated in this phase (simultaneously).  

  4. **Stopping Rule**  
     - **If** no strategies were eliminated in **both phases** of the current round, **stop**.  
     - **Else**, increment `round` and repeat from **Step 2**.  

  5. **Final Set and Conclusions**  
     - **One profile left**: This is the unique rationalizable profile and the unique Nash equilibrium.  
     - **Multiple profiles left**: All rationalizable profiles are in this set. All Nash equilibria are in this set (but there may be non-Nash profiles).  
     - **No movement, multiple profiles**: Rationalizability is preserved; Nash equilibria exist within the set (but may not be unique).  

  ---

  ### Handling Weak Dominance
  - **Rule**: Weak dominance is **not allowed** in elimination steps.  
  - **Grading**:  
    - If a student uses weak dominance (marked as "strict" or not specified), the step is **incorrect**.  
    - **Partial credit**: Award credit only for **correct strict-dominance steps** (pure or mixed). Incorrect steps (weak or invalid) receive **0 credit** for that step. Subsequent steps dependent on incorrect eliminations may also receive 0 credit.  
  - **Rationale**: Weak dominance is order-dependent and can delete Nash equilibria. A "smooth" solution using weak dominance is **not** fully correct.  

  ---

  ### Elimination Ledger and Partial Credit
  - **Ledger Requirement**: Students must document:  
    - **Sequence of deletions**: Player, strategy eliminated, dominator (pure action or mixture with probabilities).  
    - **Round and phase** for each elimination (e.g., "Round 1: Pure", "Round 1: Mixed").  
    - **Depth count**: Total rounds and number of mixed-dominator deletions.  
  - **Grading**:  
    - **Full credit**: Correct final set and ledger, with depth count matching the official solution.  
    - **Partial credit**:  
      - **Primary**: Credit per **correct elimination step** (pure or mixed).  
      - **Secondary**: Depth count (rounds and mixed deletions) as a **coarse measure** of progress. If the depth count matches but steps are wrong, use step correctness as the main factor.  
    - **Why depth count is secondary**: It can be misleading (e.g., incorrect steps may alter rounds/mixed count). **Step-by-step correctness is more reliable.**  

  ---

  ### Example Games
  **Game 1** (Row: A, B, C; Column: X, Y)  
  Payoffs:  
  - (A,X): (0,1), (A,Y): (6,0)  
  - (B,X): (6,0), (B,Y): (0,1)  
  - (C,X): (2,2), (C,Y): (2,2)  

  **Procedure**:  
  - **Round 1, Pure Phase**:  
    - Row: No pure domination (A not dominated by B/C; B not by A/C; C not by A/B).  
    - Column: No pure domination (X not dominated by Y; Y not by X).  
    No eliminations.  
  - **Round 1, Mixed Phase**:  
    - Row: Check C for mixed domination by A and B.  
      - Against X: \(p \cdot 6 + (1-p) \cdot 0 > 2\) → \(6p > 2\) → \(p > 1/3\).  
      - Against Y: \(p \cdot 0 + (1-p) \cdot 6 > 2\) → \(6(1-p) > 2\) → \(p < 2/3\).  
      - \(L_{\text{max}} = 1/3\), \(U_{\text{min}} = 2/3\). \(1/3 < 2/3\), \(1/3 < 1\), \(2/3 > 0\) → **C is dominated** (e.g., \(p = 0.5\)).  
    Eliminate C.  
  - **Round 2, Pure Phase**:  
    - Row (A,B): No pure domination (A better vs Y, B better vs X).  
    - Column (X,Y): No pure domination (X better vs A, Y better vs B).  
    No eliminations.  
  - **Round 2, Mixed Phase**:  
    - Row (two strategies left): Skip (mixed = pure, already checked).  
    - Column (two strategies left): Skip.  
    No eliminations. Stop.  
  **Final Set**: (A,X), (A,Y), (B,X), (B,Y).  
  **Conclusion**: Four rationalizable profiles; no pure Nash equilibrium.  

  **Game 2** (Row: A, B, C; Column: X, Y, Z)  
  Payoffs:  
  - Row: A=(2,2,2), B=(0,0,5), C=(1,1,1)  
  - Column: A→(X:4,Y:0,Z:1); B→(X:0,Y:4,Z:1); C→(X:0,Y:0,Z:2)  

  **Procedure**:  
  - **Round 1, Pure Phase**:  
    - Row: C is strictly dominated by A (2>1, 2>1, 2>1). Eliminate C.  
    - Column (after C eliminated): No pure domination (X not dominated by Y/Z; Y not by X/Z; Z not by X/Y).  
  - **Round 1, Mixed Phase**:  
    - Row (A,B): Skip (only two strategies).  
    - Column (X,Y,Z): Check Z for mixed domination by X and Y.  
      - Against A: \(q \cdot 4 + (1-q) \cdot 0 > 1\) → \(4q > 1\) → \(q > 1/4\).  
      - Against B: \(q \cdot 0 + (1-q) \cdot 4 > 1\) → \(4(1-q) > 1\) → \(q < 3/4\).  
      - \(L_{\text{max}} = 1/4\), \(U_{\text{min}} = 3/4\). \(1/4 < 3/4\), \(1/4 < 1\), \(3/4 > 0\) → **Z is dominated** (e.g., \(q = 0.5\)).  
    Eliminate Z.  
  - **Round 2, Pure Phase**:  
    - Row (A,B): A dominates B (2>0, 2>0). Eliminate B.  
    - Column (X,Y): X dominates Y (4>0 vs A). Eliminate Y.  
  - **Round 2, Mixed Phase**: No strategies left to check. Stop.  
  **Final Set**: (A,X).  
  **Conclusion**: Unique rationalizable profile and Nash equilibrium.  

  ---

  ### Weak Dominance Example (2×2 Game)
  **Game**:  
  - (U,L): (1,1), (U,R): (0,0)  
  - (D,L): (0,0), (D,R): (0,0)  

  **Nash Equilibria**: (U,L) (strict) and (D,R) (weak, as both players are indifferent to deviation).  

  **Student's Illegal Weak Elimination**:  
  - Eliminate D via weak dominance by U (U ≥ D in all cases, strict in L).  
  - Then eliminate R via weak dominance by L (L > R vs U).  
  - Final set: (U,L).  

  **Grading**:  
  - **Step 1 (eliminate D)**: Incorrect (used weak dominance). 0 credit.  
  - **Step 2 (eliminate R)**: Dependent on incorrect Step 1; likely 0 credit.  
  - **Final set**: Correct for IESDS with weak dominance, but not for strict. Partial credit only for correct steps (none here).  

  ---

  ### Verdict on Mixtures-Last Rule
  **Answer**:  
  \answer{The mixtures-last rule is defensible. It ensures clarity, order-independence, and aligns with standard pedagogy for IESDS. While not the only valid order, it simplifies grading and TA training for the given constraints.}  

  **Rationale**:  
  - Strict dominance is order-independent, so mixtures-last does not alter the final set.  
  - It simplifies the process: Pure checks are easier, reducing mixed checks to residual cases.  
  - Depth count (rounds/mixed deletions) is a secondary partial-credit measure; step correctness is primary.  

  **Labeling**:  
  - **Theorem**: Order-independence of strict dominance, final set contains Nash/rationalizable profiles (two-player finite games).  
  - **Convention**: Mixtures-last order, ledger documentation, exclusion of weak dominance.  
  - **Rule of Thumb**: Hand-checkable mixed test for ≤3 actions; depth count for partial credit.  

  **Caveats**:  
  - **Beyond Three Actions**: Mixed test requires linear programming (not hand-checkable).  
  - **Non-Two-Player Games**: This procedure is for two-player only (multi-player dominance differs).  

  **Final Note**: If students violate mixtures-last (e.g., mix pure and mixed in one round), grade strictly by step correctness and adherence to dominance definitions.
