prompt: |-
  I am writing the take-home examination for my third-year seminar on the philosophy of emotion, and I need a new case. The cases currently in circulation have lost their usefulness: students recognise them and recite the verdicts rather than deriving them. I want something ordinary enough to be answerable in fifteen minutes, but engineered so that the standard dialectical assumptions do not do the work.

  The four views the students have been working with are these. State, in one sentence each, the version of each that you will use; where a view admits of stronger and weaker formulations, take the formulation least friendly to the case you want to build, and flag where you have done so.

  (i) Judgment theory: emotions are, or essentially involve, evaluative judgments that the subject endorses and would defend if challenged.
  (ii) Perceptual or attitudinal theory: emotions are states in which an evaluative property is perceptually or quasi-perceptually presented to the subject — the situation appears to her as insulting, or dangerous, or admirable — and this appearance is not merely inferred, remembered, or accepted on testimony. Consider separately a somatic variant, on which what is presented is a bodily change carrying evaluative content.
  (iii) Feeling theory in the Jamesian vein: emotions are, or are constituted by, feelings of a characteristic pattern of bodily change.
  (iv) Affordance-priority theory, a position I have been developing and which the students have seen only in outline: an emotion is a state that re-ranks the subject's field of available actions — what now solicits approach, avoidance, repair, retaliation, withdrawal — where this re-ranking need not involve an evaluative judgment, need not involve an evaluative seeming, and need not have any distinctive bodily phenomenology of its own.

  The specification. Construct a single episode, no more than 250 words, set in an ordinary workplace, school, or family setting, in which (i), (iii), and (iv) all return the verdict that an emotion is present and (ii) returns the verdict that no emotion is present — where the views that say yes all converge on the same emotion, which should be resentment. So the perceptual theory must come out as the restrictive view. That is the point of the exercise: I want to know whether perceptual theories are genuinely the permissive option in this debate, or whether their permissiveness is an artifact of the small set of cases we always discuss.

  Constraints on the scenario. No clinical, neurological, or pharmacological exotica; no phobias; nothing turning on the subject's being self-deceived, akratic, exhausted to the point of unreliability, or otherwise impaired. The bodily state you use must be one an ordinary person could simply be in on an ordinary day. Write the scenario in plain, non-technical vocabulary — circumstances, what is said and done, what the subject notices about herself in ordinary terms — so that a competent student derives each verdict from the facts rather than reading it off the description. In particular the scenario may not stipulate the outcome: it cannot say that she is resentful, or that she is not really resentful, or that nothing seemed insulting to her, or that she judged herself wronged. It may only give the facts from which those claims would follow.

  After the scenario, give me the following.

  First, the verdict for each of the four views with the reasoning that gets you there from the facts, two or three sentences each, including the verdict for the somatic variant of (ii) if it differs from the non-somatic one.

  Second, identify the single feature of the case that is doing the work, and show what happens when it is removed: tell me which verdicts flip, and name the stock case in the literature that the remainder collapses into. I expect the case to be the mirror image of the recalcitrance cases — same ingredients, opposite arrangement — so tell me which ingredient would have to be subtracted or rearranged to turn it back into one of those.

  Third, give me the strongest objection available to a defender of (ii), stated as she would actually press it, and show me which feature of the scenario blocks it. If the objection in fact succeeds against the case as you have written it, say so plainly rather than protecting the case; I would rather know now than after the papers are in.

  Finally, a marking note: what a fully correct student answer must include, and one specific way a strong student could go wrong that I should be prepared to partial-credit.
reasoning: |-
  Okay, let me approach this philosophy of emotion exam scenario request systematically. The user needs an original case study that challenges students to apply four theories of emotion to a workplace, school, or family situation. The key requirements are:

  First, the case must be ordinary yet engineered so that:
  - Judgment theory (i), Feeling theory (iii) and Affordance theory (iv) all conclude resentment is present
  - Perceptual theory (ii) concludes no emotion is present
  - All while avoiding exotic or impaired conditions

  For theory formulations, I'll use:
  (i) Strong judgment theory requiring endorsement/defensibility
  (ii) Strict perceptual theory excluding inference/testimony (somatic variant included)
  (iii) Jamesian feeling theory as constituted by bodily feelings
  (iv) Affordance-priority as action-reprioritization without judgment/seeming/phenomenology

  The scenario should be under 250 words in plain language about a workplace conflict, showing:
  - Verbal insult with plausible deniability
  - Visible bodily reaction (clenched jaw) but no distinctive "insult appearance"
  - Delayed judgment as the subject reconstructs the event
  - Action reprioritization (withdrawal from interaction)

  After drafting the case, I'll analyze:
  1. Verdicts for each theory with reasoning
  2. The key feature (delayed evaluation) and how its removal creates standard recalcitrant emotion cases
  3. Strongest objection from perceptual theorists (about bodily presentation) and why it fails here
  4. Marking guidelines emphasizing the need to show derivations

  The challenge is balancing theoretical precision with mundane realism while ensuring perceptual theory uniquely fails to detect resentment. The somatic variant objection needs particular care - it must genuinely differ from standard perceptual accounts in this case.
answer: |-
  Here is a case designed to meet your specifications, followed by the requested analysis.

  **The Case: The Overlooked Contribution (195 words)**

  > Maya and Ben are colleagues preparing a joint presentation for a client. During the final review meeting, Ben presents Maya's key market analysis slide. He explains it thoroughly, highlighting its importance to the overall strategy, but doesn't mention Maya by name or indicate it was her work. Maya, sitting across the table, feels her jaw tighten and a slight flush in her cheeks. She doesn't say anything during the meeting, absorbing the moment. Afterward, as they walk back to their desks, Maya thinks about Ben's presentation. She recalls past instances where he took credit for collaborative work. She decides not to share her preliminary findings for the next section with him yet, choosing instead to discuss them first with their manager. When Ben later asks about her progress, Maya gives a vague, non-committal answer and quickly turns back to her screen. She feels no immediate urge to confront him about the slide.

  **Theory Formulations Used:**
  (i) **Judgment Theory (Strong):** Emotions require an occurrent, consciously endorsed evaluative judgment the subject would defend.
  (ii) **Perceptual Theory (Strict):** Emotions require a non-inferential, non-testimonial evaluative *seeming* (e.g., the situation *appears* insulting). *Somatic Variant:* Emotions require the felt bodily changes *themselves* to carry the evaluative content non-inferentially.
  (iii) **Feeling Theory (Jamesian):** Emotions *are* the conscious feeling of a specific pattern of bodily changes.
  (iv) **Affordance-Priority Theory (Core):** Emotions involve a reprioritization of the action field (what solicits approach, avoidance, etc.), independent of judgment, seeming, or distinctive phenomenology.

  ---

  **Analysis:**

  1.  **Verdicts & Reasoning:**
      *   **(i) Judgment Theory (Yes - Resentment):** Maya judges she was wronged *after* the meeting ("recalls past instances... took credit"). She constructs this judgment reflectively. This judgment (of wrongful credit-taking) is the core evaluative component essential to resentment, and she would likely defend it if Ben challenged her later reaction.
      *   **(ii) Perceptual Theory (Non-Somatic: No Emotion Present):** During the event itself, nothing *appeared* insulting to Maya in a non-inferential way. She absorbed the moment without reacting; the insult wasn't *perceptually presented*. It was only later, through reflection ("thinks about," "recalls past instances"), that she inferred the wrong. This inference disqualifies it as a perceptual seeming. *Somatic Variant (No Emotion Present):* The bodily changes (tight jaw, flushed cheeks) are present, but they don't non-inferentially carry the evaluative content "this is an insult" or "I am wronged." They are felt as physical tension/warmth; their *significance* as related to resentment is only assigned later via inference and memory. The bodily state lacks intrinsic, presented evaluative content.
      *   **(iii) Feeling Theory (Yes - Resentment):** Maya experiences a characteristic bodily pattern: jaw tightening and cheek flushing. According to Jamesian theory, this pattern of bodily feelings *constitutes* the emotion. The specific pattern described is readily associated with anger/resentment.
      *   **(iv) Affordance-Priority Theory (Yes - Resentment):** Maya's field of action is demonstrably re-prioritized: she avoids sharing information with Ben ("decides not to share... with him yet"), chooses to involve her manager first, and withdraws from interaction ("vague, non-committal answer," "quickly turns back"). This pattern of avoidance and strategic withholding, particularly regarding collaboration and credit, is characteristic of resentment. This reprioritization occurs without requiring a concurrent judgment (it starts *before* her reflective judgment), a perceptual seeming (none occurred at the key moment), or any *distinctive* bodily phenomenology beyond what's already covered (the withdrawal isn't *caused* by a new feeling; it *is* the emotion manifesting).

  2.  **Key Feature & Consequences of Removal:**
      *   **The Key Feature:** The **delay between the potentially emotion-eliciting event and the subject's evaluative cognition (judgment)**, coupled with the **absence of a non-inferential evaluative seeming *during* the event**.
      *   **Consequences of Removal:** If Maya experienced an immediate evaluative seeming (e.g., Ben's action *struck her as* insulting or unfair *as it happened*), even if she didn't endorse the judgment or act on it immediately, Perceptual Theory (ii) would now return "Yes - Resentment Present." The case would then collapse into a standard **Recalcitrant Emotion** scenario (e.g., fearing the harmless spider despite judging it safe). Here, the perceptual seeming would be present (triggering (ii)), the bodily feelings would be present (iii), the action tendencies might still manifest (iv), *but* the judgment (i) might be delayed or conflicted (e.g., "I know he didn't *mean* to slight me, but it still *felt* insulting"). The mirror-image structure is clear: recalcitrance has seeming without (endorsed) judgment; this case has judgment (and feeling/action) without seeming.

  3.  **Strongest Objection from a Perceptual Theorist (ii) & Rebuttal:**
      *   **Objection:** "The somatic variant *is* satisfied! Maya's jaw tightening and flushing *are* the bodily presentation of the insult. This is the 'perception' of the offense through her bodily reaction. The evaluative content ('this is wrong/insulting') is directly carried by and presented *in* those specific bodily feelings at the moment they occur, prior to any inference. Her later judgment is just labeling what her body already presented."
      *   **Why it Fails (Blocked by Scenario Feature):** The scenario specifies Maya only *feels* "her jaw tighten and a slight flush in her cheeks." It describes the raw sensations (tension, warmth), *not* that these sensations intrinsically presented themselves *as* "the feeling of being insulted" or carried any non-inferential evaluative meaning. The connection to resentment is made *later* via cognitive reflection ("thinks about," "recalls"). The perceptual theorist's objection *attributes* a specific, non-inferential evaluative content to the bodily state that the scenario does not provide evidence for; it requires reading "resentment" back *into* the bodily feelings from the later judgment/action. The somatic variant requires the bodily feeling itself to *be* the evaluative presentation, not just a physical state later interpreted evaluatively. The case denies this intrinsic presentation.

  4.  **Marking Note:**
      *   **Fully Correct Answer Must Include:**
          *   Clear identification of the presence/absence verdict for *each* specific theory (i-iv), *including* a separate verdict for the somatic variant of (ii) if different.
          *   Derivation of *each* verdict directly from *specific details* in the scenario description (e.g., "Judgment theory says yes *because* Maya later judges she was wronged"; "Perceptual theory says no *because* there was no non-inferential seeming of insult during the event"; "Feeling theory says yes *because* of the jaw tightening/flushing"; "Affordance theory says yes *because* she re-prioritized action by withholding info and withdrawing").
          *   Recognition that the *same* emotion (resentment) is identified by the three "yes" theories.
          *   Understanding that the perceptual theory (ii) is the restrictive view in this case.
      *   **Common Strong Student Error (Deserving Partial Credit):** A strong student might correctly identify the verdicts but conflate the *absence of an immediate seeming* with the *presence of recalcitrance*. They might argue that perceptual theory says "no" because Maya *should* have felt insulted but didn't (implying a conflict). The key distinction is that recalcitrance involves conflicting elements (seeming vs. judgment), while this case lacks the seeming element *entirely* at the critical moment. The student identifies the correct verdicts but misdiagnoses the *reason* for (ii)'s "no" verdict by importing recalcitrance concepts. They grasp the outcome but not the precise mechanism differentiating this case.
