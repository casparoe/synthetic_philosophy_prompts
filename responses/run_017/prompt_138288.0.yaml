prompt: |-
  Got 40 minutes next week in front of a room of ML engineers to explain updateless decision theory. They're completely fine with expected utility, Bayes and policy gradients, they have zero philosophy, and they're going to assume that anything that sounds like "ignore the evidence" is crackpot — so I need a plan, not an explanation.

  What has to be in place before "updateless" even means anything to them: do they need the causal/evidential decision theory split first, or can I get there from Newcomb's problem alone (which half of them will have half-remembered from a blog post)? Which single case should carry the whole thing — I was going to build it around an agent that gets to patch its own source code before the input arrives, so the policy feels like a real object they can point at, but tell me if that just smuggles in the conclusion or quietly collapses into Newcomb. Then the misconceptions, and where in the sequence to kill each one: I'm expecting "so you're saying don't condition on the evidence", "isn't that just evidential decision theory again", and "surely the perfect predictor is doing all the work here". Plus one question at the end that tells me whether they actually got it or just got comfortable with it.

  Also: what should I flatly refuse to go into at this level, and say out loud that I'm leaving it out — logical counterfactuals, why the policy gets evaluated from the prior, whatever else. British English please.
reasoning: |-
  Okay, the user needs to explain Updateless Decision Theory (UDT) to a room of ML engineers in just 40 minutes. They're experts in expected utility, Bayes, and policy gradients but have zero philosophy background. The challenge is they'll likely dismiss anything that sounds like "ignore evidence" as crazy. So I need a plan, not just an explanation.

  First, I should figure out the starting point. The user mentioned whether to begin with the causal/evidential decision theory split or jump straight into Newcomb's problem. Since the audience is time-pressed and familiar with ML, starting with Newcomb makes sense—it's a concrete problem that half might recall from blogs. Introducing CDT and EDT quickly after that could highlight the conflict without deep philosophy. The key is to show that both approaches fail in certain scenarios, creating a need for UDT.

  Next, the user wants to use an agent that patches its own source code before seeing inputs. That's a smart move because it makes the policy a tangible object. ML engineers work with code and policies daily, so framing the decision as choosing a policy upfront rather than actions per observation aligns with their mindset. I need to ensure this doesn't just collapse into Newcomb. Perhaps using the Parfit's Hitchhiker or a transparent Newcomb variant where the predictor's method is known could make it fresh and avoid that pitfall.

  Misconceptions are a big concern. The audience will likely say, "So you're saying don't condition on evidence?" I need to preempt that by emphasizing that UDT does use evidence but at the policy level, not the action level. Clarifying that the policy is chosen before evidence, but executes conditionally, is crucial. Another misconception is confusing UDT with EDT. Highlighting that UDT considers logical consequences (like predictor behavior) rather than just correlations can differentiate them. Also, addressing the "perfect predictor doing all the work" by showing that UDT applies even in non-omniscient cases, like with logical dependencies in code.

  What to leave out is equally important. Logical counterfactuals are too complex for 40 minutes. The deep why of evaluating from the prior might derail the talk. Instead, present the prior as a given and focus on the algorithm. Refuse to dive into non-computable problems or infinite regress. British English terms like "programme" and "maths" should be used consistently.

  The structure should be tight: start with Newcomb, introduce CDT/EDT failure, present the pre-commitment policy idea, explain UDT's approach, tackle misconceptions head-on, and end with a litmus test question. The final question could be about modifying a source code line to see if they grasp policy-level thinking over action-level.

  Also, the user's deeper needs: they want the audience to see UDT as a practical tool, not philosophical jargon. Connecting it to real ML issues like self-modifying code or multi-agent systems (without going into specifics) could make it stick. Ensuring the explanation is grounded in computation and algorithms will resonate more than abstract concepts.
answer: |-
  Here’s a battle-tested 40-minute plan to get ML engineers to *grok* UDT without mutiny. Prioritise clarity, computational framing, and pre-empting objections.

  **Core Goal:** Make them see UDT as *the rational way to choose policies when your actions can have logical side-effects*. Not "ignoring evidence", but *using it at the right level*.

  **Strict Omissions (State These Upfront):**
  1.  **Logical Counterfactuals:** "We're treating them as black boxes today. Assume we have a way to evaluate 'what *would* happen *if* this policy did X, even when it doesn't'. Don't worry *how* for now."
  2.  **Why the Prior?:** "We'll evaluate policies *as if* from the prior belief state. The deep 'why' involves coherence theorems & avoiding infinite regress, but that's for another day. For now, treat it as a computational necessity."
  3.  **Non-Computability/Infinity:** Stick to finite, computable toy problems. No Löb's Theorem deep dives.
  4.  **EDT/CDT Nuances:** Cover just enough to show the problem exists, not the full taxonomy.

  **The Plan (British English Throughout):**

  1.  **Hook: Newcomb's Problem Revisited (5 mins)**
      *   "Right, half of you recall Newcomb's: Predictor, Box A (£1M if predicts 1-box), Box B (£1k, always). You choose 1-box or 2-box."
      *   **CDT:** "Calculate causal effect: Taking B *causes* me to get £1k extra, regardless of A. 2-box. Result: £1k."
      *   **EDT:** "Condition on evidence: If I take only A, it *probably* means the predictor put £1M there. 1-box. Result: £1M."
      *   **Conflict:** "CDT gets less money than EDT here! CDT seems to *lose* in this scenario. Why? Because my *act* of choosing provides *evidence* about the predictor's past act, but doesn't *cause* it. My choice correlates with the money via the predictor's mechanism." **This sets the *need*.**

  2.  **Frame the Core Problem: Choosing Policies, Not Acts (8 mins)**
      *   "The issue arises when *the way I decide* influences the *environment setup*. Newcomb's predictor simulates *your decision algorithm*."
      *   **Source Code Patching Analogy (Perfect!):**
          *   "Imagine you're writing the source code for an agent *right now*. This code will run later, receive an input (observation), and output an action."
          *   "Crucially, *before* this code runs, *before* it sees its input, something else in the world (like Newcomb's predictor) gets to *inspect your source code* and set up the environment based on what it sees."
          *   "You, the programmer, are choosing the *entire policy function* `f(observation) -> action` *now*. You don't get to choose the action `f(obs)` later *after* seeing `obs`." **Emphasise this point.**
      *   "Newcomb's is exactly this: The predictor inspects your policy (`f`) *before* you see the boxes. If `f` is the 'one-box' policy, it puts £1M in A. If `f` is 'two-box', it leaves A empty."
      *   **Key Insight:** "The *quality* of the outcome depends *crucially* on which *entire policy* `f` you commit to *now*, not just on the action you pick later based on your *local* view."

  3.  **Introduce Updateless Decision Theory (UDT) (10 mins)**
      *   "UDT says: **Choose the *policy* `f` that maximises expected utility, *evaluated from your current state of knowledge (the prior)*, before you see any evidence that depends on `f` itself.**"
      *   **Explain the Algorithm (Computationally):**
          1.  **Enumerate:** Consider all possible policies `f` (or a reasonable subset).
          2.  **Simulate/Evaluate:** For each `f`:
              *   Use your *current* beliefs (the prior) about how the world works.
              *   Simulate what would happen *if* this policy `f` were deployed:
                  *   How would other agents/systems (e.g., the predictor) *react* to knowing `f` exists? (Set up world state)
                  *   How would `f` *then* react to the observations it *will* receive? (Execute `f`)
              *   Calculate the *expected utility* of the *entire trajectory* resulting from deploying `f`.
          3.  **Choose:** Pick the `f` with the highest expected utility from step 2.
      *   **Apply to Newcomb's (as programmer):**
          *   Policy `f1`: Always one-box. Predictor sees `f1`, puts £1M in A. `f1` runs, takes A. Result: £1M.
          *   Policy `f2`: Always two-box. Predictor sees `f2`, puts £0 in A. `f2` runs, takes A+B. Result: £1k.
          *   Expected Utility (Prior): `f1` wins massively. **Choose `f1`.** Commit to one-boxing.
      *   **"But When It Runs...":** "When the agent *using* `f1` actually runs, it sees two boxes. *Conditioned on that evidence*, EDT says one-boxing looks great. CDT says two-boxing *seems* causally better. But UDT says: *Stick to the policy `f1` you rationally committed to earlier!* Deviating (`f1` seeing boxes and two-boxing) would mean you didn't actually deploy `f1`, you deployed a *different* policy (`f2`) that the predictor saw and punished."

  4.  **Slay the Dragons (Misconceptions) (12 mins)**
      *   **"So you're saying don't condition on the evidence?"**
          *   **NO.** "The *policy* `f` **does** condition on evidence! `f(obs)` explicitly uses `obs` to pick the action. That's essential. UDT chooses `f` *before* `obs` is known *if `obs` depends on `f`*. Once `f` is running, it uses `obs` perfectly normally. UDT is about *which evidence-conditioning machine to build*, not ignoring evidence when it runs."
      *   **"Isn't this just Evidential Decision Theory (EDT) again?"**
          *   **NO.** "EDT tries to pick *actions* based on *current* evidence. UDT picks *policies* based on the *prior*. They often agree (like in Newcomb's), but crucially *diverge*."
          *   **Example: Parfit's Hitchhiker:** Desert island. Driver will only give you a lift to town (saving your life) *if* they *believe* you'll pay them £1000 later. Once in town, you can pay or not.
              *   EDT (in town): "Conditional on being in town, paying £1k doesn't cause the lift (that's past). Not paying dominates. Result: Dead next time."
              *   CDT (in town): "Paying £1k costs me £1k, doesn't cause past lift. Don't pay. Result: Dead next time."
              *   UDT (beforehand): Choose policy `f`. `f_commit`: Promises to pay if saved. Driver *believes promise* (if `f_commit` is credible), saves you. `f_commit` runs, pays. Result: Alive and £1k poorer. `f_defect`: Doesn't promise (or breaks promise). Driver doesn't save. Result: Dead. **UDT picks `f_commit`.** EDT/CDT fail *within* the policy execution.
          *   "UDT sees the *logical link* between the commitment and the driver's belief. EDT/CDT, trapped in the moment, miss this."
      *   **"Surely the perfect predictor is doing all the work here?"**
          *   "Not really! The predictor amplifies the problem, but the core is *logical dependence* or *acausal influence*. Think of the source code patching: The predictor is just *reading* your code. The dependence comes from it reacting *based on what it reads*."
          *   **Less Magical Example:** "Imagine two identical, rational agents playing a one-shot prisoner's dilemma. They know they are identical and will both run the *same source code* (same policy `f`)."
              *   Choosing `f`: `f` must output Cooperate (C) or Defect (D) for each agent.
              *   Simulation: If both run `f`, they both do `f(observation)`. Because they are identical and know it, they know the other outputs `f(observation)` too.
              *   Expected Utility: If `f` outputs C, both get R (Reward). If `f` outputs D, both get P (Punishment). R > P. **UDT picks the policy `f` that outputs C.** It sees the logical link: My choice *is* your choice because we use the same code.
              *   "No predictor! Just identical reasoning agents whose choices are logically entangled by shared design. CDT/EDT struggle horribly here if applied naively at the action level."

  5.  **The Litmus Test Question (End of Q&A)**
      *   Pose this: **"Imagine the UDT agent in Newcomb's problem. Just *after* it chooses its one-boxing policy `f1`, but *before* it sees the boxes, a mischievous demon offers to flip one bit in its source code. If flipped, the agent will unconditionally two-box when it runs. Should the agent *now* (at the policy level, before seeing boxes) pay the demon a small fee to *prevent* this bit-flip?"**
      *   **Got it:** "Yes! If the bit is flipped, the predictor sees the modified policy (`f2`) and leaves A empty. The agent then two-boxes and gets only £1k. Paying a small fee preserves the `f1` policy, ensuring the predictor sees `f1`, puts £1M in A, and the agent one-boxes for £1M. Net gain."
      *   **Didn't Get It:** "No, because once it sees the boxes, two-boxing *then* seems better." (Trapped in action-level CDT) / "The predictor already saw it, so it's too late." (Misses that policy integrity *is* the point of commitment).

  **Sequence Summary & Timing:**
  1.  **Newcomb's & CDT/EDT Failure (5 mins):** Establish the problem exists.
  2.  **Policy as Source Code (8 mins):** Frame the decision as choosing `f` *now* when `f` influences setup.
  3.  **UDT Algorithm & Newcomb's Solution (10 mins):** Define UDT computationally. Show it works.
  4.  **Slay Misconceptions (12 mins):** "Ignore Evidence?" / "Just EDT?" / "Predictor Does Work?" (+ Hitchhiker/PD examples).
  5.  **Q&A (5 mins):** Field questions, end with Litmus Test.

  **Key Mantras to Repeat:**
  *   "UDT chooses the *policy*, not the action-in-the-moment."
  *   "The policy *uses* evidence when it runs; UDT chooses *which* evidence-using machine to build."
  *   "It's about maximising utility *from the perspective before your policy choice starts influencing the world setup*."
  *   "Logical dependence, not just causality or correlation."

  This approach grounds UDT in computation (policies, source code, simulation), leverages their ML intuitions (policy optimisation, functions), directly confronts objections, and avoids philosophy landmines. The litmus test reliably separates understanding from mimicry. Good luck!

  **P.S. Regarding Collapsing into Newcomb:** The source code framing *generalises* Newcomb perfectly. It makes the dependence explicit and feels less like a "trick". It doesn't smuggle; it *clarifies* the core mechanism present in Newcomb and many other problems. Use it confidently.
