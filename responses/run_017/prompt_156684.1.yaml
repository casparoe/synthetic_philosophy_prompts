prompt: |-
  I've gone down a bit of a rabbit hole recently (it started when a school near me got renamed and everyone more or less shrugged, whereas the statue arguement in the same town ran for years), and I keep noticing the same pattern. When a city decides that someone commemorated in public isn't worthy of it any more, the standard menu seems to be: pull the statue down and put it in a museum or a warehouse — very rarely melted down or smashed, even when it's a bog-standard mass-produced bronze that nobody thinks is any good as art; or leave it up and bolt on an interpretive plaque; or rename the street, the school, the lecture theatre, the scholarship. And here's the bit that puzzles me. Renaming is the option that actually costs money and causes hassle — new signage, new addresses, businesses having to reprint everything — and yet it's the one that gets treated as obviously fine and barely argued about. Shifting a statue is, by comparison, cheap and quick, and it's the one that produces years of fighting. We do X in one case and Y in the other and I can't tell whether that's just inertia about old objects or whether it tracks something real about what the two kinds of thing are.

  Two mates of mine offered opposite explanations and neither fully convinced me. One says the statue is basically detachable: the honour lives in the plinth, in the square, in the fact that we put him up high where we have to walk round him, so once you take it off the pedestal the bronze is just an object and a museum can hold it without honouring anybody — which would explain why nobody insists on destroying them. The other says it's the other way round: a street name is worse because we use it constantly, we say it out loud, we give it as our address, so it enrols us in the honouring every single day, whereas a statue is just something you walk past. I also notice that nobody ever campaigns to rename something because the namesake turns out to have been merely forgettable, or a mediocre dullard, or to have got his fame by luck — the campaigns only fire when there's some serious wrongdoing. And then there's the retain-and-explain option, which seems to assume that bolting on a few paragraphs can genuinely change what an object is doing, that its meaning is fixed by us now rather than by whoever put it up; but if that's true, why remove anything at all?

  So: what exactly does this whole package of practices presuppose about what a statue, or a name, is? What view of commemoration does it only make sense under — an honour, a record, an expression of who "we" are, a claim about admirability, something else — and which rival views does it quietly rule out? I'd like you to seperate what the practice strictly presupposes from what it merely fits comfortably with, and to say where it's underdetermined and several different theories would license the same behaviour. Is my first mate's "the plinth is the honour, the bronze is just a thing" idea actually doing work in the practice, or is the museum solution just a compromise nobody has thought through? Does the wrongdoing-but-not-mediocrity pattern tell us anything about what a monument asserts about a person? Is the package internally consistent — do the statue bit and the renaming bit presuppose the same theory, or is one of them running on a different one? And if we swapped in a rival view (say, that commemoration is mainly a record of what earlier generations valued, or that it's purely the current community's speech, or that the dead themselves have some stake in it), what would actually have to change in how cities handle these things? I don't need any reading recommendations or names of papers, I just want the argument.
reasoning: |-
  Okay, let me try to unpack this user's query. They're noticing a pattern where renaming things like schools or streets causes less fuss compared to removing statues, even though renaming is more costly. They've heard two explanations from friends: one says the statue's honor is in its plinth, so moving it neutralizes it; the other claims street names involve daily complicity, making renaming necessary. The user is skeptical and wants to know what these practices reveal about commemoration.

  First, I need to figure out the core issues. The user is questioning the underlying assumptions of commemoration practices. They mention that wrongdoing triggers campaigns, not mediocrity, which might imply monuments assert moral exemplarity. Also, the "retain-and-explain" approach suggests meaning is mutable, which conflicts with removal. The user wants to know if these practices are consistent or if they operate on different theories.

  Looking at the statue removal process. Statues are often moved to museums rather than destroyed. This aligns with the idea that the physical placement—like a plinth in a public square—conveys honor. Removing it to a museum recontextualizes it as history, not tribute. So the practice assumes that the location and presentation determine the commemorative act. This makes the plinth essential; without it, the statue loses its honoring power. 

  Renaming, however, seems to operate differently. Changing a name erases the honor completely rather than recontextualizing. The user points out that renaming is more disruptive but less contested. This might be because names are seen as active endorsements. Using a name daily implicates the community in honoring that person. Renaming stops that endorsement, whereas a statue in a museum is neutralized. 

  The wrongdoing vs. mediocrity point is crucial. If a namesake is merely unremarkable, no one cares. But serious moral failings spark action. This suggests commemoration isn't just about historical record but current moral alignment. The community doesn't want to be associated with immorality. Hence, the practice assumes monuments imply endorsement of the person's character, not just their historical role.

  Retain-and-explain tries to change the meaning through added context. This assumes that commemoration's meaning isn't fixed by the original intent but can be reshaped. However, this approach is often seen as insufficient for severe wrongdoings, indicating a limit to how much context can override the original honor. 

  Now, are these practices consistent? Statue removal via relocation assumes honor is tied to physical presence and context. Renaming assumes it's an active, linguistic endorsement. Both deal with current community values but in different ways. The statue's solution is recontextualization; renaming is termination. Under a theory where commemoration is about current values, both make sense. But if commemoration is a historical record, neither removal nor renaming would be necessary—context plaques would suffice. Since that's not the case, the practice rejects the historical record view.

  If we adopted rival theories, practices would change. For example, seeing commemoration as historical record would keep statues in place with explanations. If the dead have a stake, removal might be taboo. But current practices prioritize the living community's moral stance.

  Internal consistency: Both statue handling and renaming presuppose that commemoration is an active endorsement by the current community. The difference in methods (recontextualizing vs. erasing) might stem from the medium. Statues are physical objects that can be relocated, while names are linguistic and require complete replacement. The museum solution isn't just a compromise; it relies on the theory that context defines meaning. Renaming is more absolute because language doesn't allow for recontextualization in the same way—you can't put a street name in a museum. 

  So the package isn't perfectly consistent but operates under a shared core: commemoration as current moral endorsement. The methods vary due to the nature of the medium (physical vs. linguistic) and what each action communicates. The user's friends each capture part of the truth, but neither fully explains both practices together.
answer: |-
  Your observations cut to the core of how societies perform "memory work" through material culture. The package of practices you describe rests on a specific, largely unspoken **theory of commemoration as active, present-tense endorsement by the living community**. Let's dissect its presuppositions:

  ### Core Presupposition: Commemoration is Current Moral Endorsement
  The entire system assumes that public commemoration is **not primarily historical record-keeping**, but a **performative act of contemporary valuation**. We honour *now*, implying the honoree embodies values *we* currently affirm. This explains why:
  - **Wrongdoing matters, mediocrity doesn't**: A monument asserts the figure is *admirable*. Mediocrity merely fails this claim (silently ignored), but serious wrongdoing actively *contradicts* it, creating cognitive/moral dissonance demanding correction.
  - **Retain-and-explain is unstable**: Adding a plaque attempts to convert the object from *honour* to *historical witness*. But if the monument's primary function is endorsement, the plaque often fails because the original symbolic form (heroic pose, central location) still radiates residual honour. Removal acknowledges this power; retention-with-context tries (often vainly) to negate it.

  ### What Each Practice Reveals & Presupposes
  1. **Statue Removal to Museum**:
     - **Presupposes**: The commemorative power resides in **context and spatial dominance**, not the object itself. The plinth, the public square, the elevated gaze – *these* are the honour. Relocate the bronze to a neutral, contextualizing space (museum), and it becomes artifact, not tribute. Destruction is rare because the object isn't the sin; its *placement* was the endorsement.
     - **Why it's contentious**: Precisely *because* the statue's power is acknowledged. Removing it is a visible, physical repudiation. Supporters see it as erasing history; opponents see it as ending false endorsement. Both agree it *means* something powerful.
     - **Underdetermined**: It fits theories where context defines meaning, but doesn't *require* believing the object is inherently neutral. Someone believing the bronze itself is tainted might *still* accept the museum as a quarantine/containment solution.

  2. **Renaming (Streets, Schools)**:
     - **Presupposes**: Names are **active linguistic performatives**. Saying "I live on X Street" or "My child attends Y School" is an unwitting *participation* in the honouring act. Renaming ceases this daily, compulsory endorsement. The cost/hassle is secondary to halting ongoing complicity.
     - **Why it's less contested**: Precisely *because* it's seen as ending active harm (forced participation in honouring the unworthy). The name itself isn't treasured as an artifact; it's a functional label. Opposition focuses more on inconvenience or "erasure" rhetoric than deep attachment to the name's symbolic power.
     - **Implied Theory**: Language is constitutive. Using the name *renews* the honour daily. Stopping use stops the honour.

  3. **Retain-and-Explain**:
     - **Presupposes**: Meaning is **malleable and controlled by present interpretation**. The original intent (honour) can be overwritten by new narrative framing. It rejects the idea that the monument's form inherently signifies endorsement.
     - **Why it's unstable**: It clashes with the core presupposition (commemoration=endorsement). If the form *itself* inherently conveys honour (as statue removal practices suggest), a plaque is insufficient. If meaning is purely textual/additive, removal is unnecessary. This tension reveals the underlying belief: *form and placement convey endorsement more viscerally than text can negate*.

  ### Internal Consistency & Rival Theories
  - **Consistency?**: Mostly, under the "endorsement" theory. Both statue removal (ending spatial endorsement) and renaming (ending linguistic endorsement) aim to cease *current* communal approval. Retain-and-explain is the outlier, attempting to *redefine* endorsement, often unsuccessfully because it underestimates the affective power of form/place.
  - **Rival Theories & Changes**:
    - **Commemoration as Historical Record**: Statues stay *in situ* with explanatory plaques. Renaming is rare; context suffices. Wrongdoing is noted, not erased. *Practice changes radically: removal/renaming becomes taboo.*
    - **Commemoration as Community Speech (Purely Present)**: Statues would be *routinely* melted/recycled; names erased without trace. The past's choices hold no inherent value. *Museums become irrelevant; destruction is standard.*
    - **The Dead Have a Stake**: Removal/renaming becomes morally fraught, akin to desecration. "Retain-and-explain" or discreet relocation (not public museum display) dominates. *Contention increases; solutions favour respect for the dead over community values.*
    - **Commemoration as Recognition of Impact (Neutral)**: Only provable falsehoods (e.g., falsely attributed deeds) warrant change. Moral judgments are irrelevant; historical significance is key. *Wrongdoing alone doesn't trigger action; only factual inaccuracy does.*

  ### Answering Your Specific Queries
  - **Your First Mate ("Plinth is Honour, Bronze is Thing")**: This is **core to the practice**. The museum solution isn't just compromise; it relies on the belief that decontextualization neutralizes tribute. The object's preservation acknowledges historical significance *without* endorsement.
  - **Wrongdoing vs. Mediocrity**: Confirms commemoration asserts **exemplarity**. We commemorate *virtue* (real or imagined). Mediocrity fails exemplarity harmlessly; wrongdoing inverts it, demanding revocation.
  - **Is the Package Underdetermined?**: Yes, regarding the *source* of meaning. Does the statue's power come from the original erectors' intent, the object's inherent symbolism, or current public reception? Practices suggest a blend: original intent *established* the honour, but current reception determines if it *persists* as valid. Removal/renaming rejects the original intent as no longer binding.

  **Conclusion**: The package makes sense *only* if commemoration is understood as the **living community actively endorsing a figure as morally exemplary**. Statue removal halts *spatial* endorsement; renaming halts *linguistic* endorsement; retain-and-explain attempts (often unsuccessfully) to convert endorsement into pedagogy. The medium (object vs. name) dictates the method, but the core presupposition – that we must not be seen to *honour* the unworthy – remains constant. Rival theories would produce fundamentally different outcomes, proving this presupposition is deeply embedded in our contentious memory politics.
