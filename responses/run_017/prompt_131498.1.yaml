  First, I need to structure the memo like a real consultancy report. That means a header block with to/from/date/subject, then sections like Executive Summary, Methodology, Findings, Recommendations. The tone must be serious and corporate, using buzzwords like "outcome stability" and "selection risk" to mask the underlying problem.

  For the content, the chamber should score perfectly on demographic metrics—things like age, gender, ethnicity, education—to emphasize the "descriptive representation" angle. Then, the reshuffle test results must show zero vote changes, framed as a positive. I'll invent metrics like "Representation Index" and "Reshuffle Stability Score" to make it sound technical.

  The joke hinges on the consultants missing the obvious: that permanent staff are the real decision-makers. So, I'll include details about the secretariat's role in "procedural facilitation" and "briefing consistency," implying they handle all the work. The term limits for members just shifted power to unelected staff, which the report should ignore or spin as efficient.

  For recommendations, I need to extend the logic blindly. Something like suggesting rotation for the permanent staff to "enhance robustness" or packaging stability as a service. That pushes the absurdity further without breaking character.

  Word count is 600-700, so I'll keep sections concise. Start with the header, then bullet-pointed findings. Use corporate jargon throughout—no winking or commentary. The user specified no preface or afterword, so dive straight into the memo.

  Finally, ensure the humor is subtle. The reader should infer the critique from the juxtaposition of perfect scores and staff dominance. Metrics like "0.00% variance" in votes after reshuffle will highlight the farce while sounding professional.
