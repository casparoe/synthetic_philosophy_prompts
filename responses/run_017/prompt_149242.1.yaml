answer: |-
  ### Triage Decision Tree for KB Contradictions  
  **Start:** Two entries assert P and ¬P, with roughly equal provenance.  

  1. **Q1: Can the conflict be resolved by disambiguation (e.g., ambiguous terms, context, or scope)?**  
     - **Yes → Leaf A: Contextualism**  
       - *Awkward commitment:* Must track fine-grained contextual parameters (e.g., "deadline" means abstract deadline vs. final deadline).  
       - *Implementation cost:* Store context tags for entries; query engine resolves context before inference.  
     - **No → Proceed to Q2.**  

  2. **Q2: Is there evidence of a data-entry error (e.g., typo, outdated source, or clear provenance flaw)?**  
     - **Yes → Proceed to Q3.**  
     - **No → Proceed to Q4.**  

  3. **Q3: Which repair minimizes harm?**  
     - **Reject one entry → Leaf B: Repair (reject one)**  
       - *Awkward commitment:* Discarding potentially valid data due to heuristic judgment.  
       - *Implementation cost:* Manual review or automated heuristics (e.g., timestamp priority); delete one entry.  
     - **Adjust provenance weights → Leaf C: Repair (reweight provenance)**  
       - *Awkward commitment:* Subjective weight assignment despite "equal" authority.  
       - *Implementation cost:* Add confidence scores; dynamically adjust weights during queries.  
     - **Neither safe → Leaf D: Repair (quarantine pair)**  
       - *Awkward commitment:* Contradictions remain inert, reducing KB coverage.  
       - *Implementation cost:* Flag entries; block all inferences involving P/¬P.  

  4. **Q4: Is P defective (e.g., self-referential, vague, or paradoxical)?**  
     - **Yes → Proceed to Q5.**  
     - **No → Proceed to Q6.**  

  5. **Q5: What is the nature of the defect?**  
     - **Vagueness/indeterminacy → Leaf E: Gap**  
       - *Awkward commitment:* Some propositions lack truth values (e.g., "small room" has no sharp boundary).  
       - *Implementation cost:* Query engine uses gap-aware logic (e.g., Kleene); outputs "unknown" for P.  
     - **Self-reference/paradox → Leaf F: No-proposition-expressed**  
       - *Awkward commitment:* Entries are meaningless (e.g., "this entry is unreliable" fails to assert).  
       - *Implementation cost:* Remove or ignore entries; no storage of P/¬P as propositions.  
     - *Flag:* Liar-like cases (e.g., Case 2) may fit both E and F; tree doesn’t fully separate them.  

  6. **Q6: Should the KB reflect an inconsistent world or inconsistent information?**  
     - **World is inconsistent → Leaf G: Glut (dialetheism)**  
       - *Awkward commitment:* True contradictions exist (e.g., committees genuinely enforce conflicting policies).  
       - *Implementation cost:* Full paraconsistent KB (e.g., LP); prevents explosion but allows P ∧ ¬P.  
     - **KB information is inconsistent → Proceed to Q7.**  

  7. **Q7: How should inconsistency be isolated?**  
     - **Store conflict explicitly → Leaf H: Four-valued (information state)**  
       - *Awkward commitment:* Truth values replaced by epistemic states (true, false, both, neither).  
       - *Implementation cost:* Belnap’s 4-valued logic; store both P and ¬P; queries return lattice values.  
     - **Isolate in a fragment → Leaf I: Paraconsistent fragment**  
       - *Awkward commitment:* KB partitioned into "safe" and "contradictory" zones.  
       - *Implementation cost:* Run paraconsistent logic only on flagged fragments; complex integration.  

  ---  
  ### Unoccupied Combinations & Notes  
  - **Q5 → "Defect due to authority conflict" (e.g., Case 4):** Unoccupied; not inherently defective, so routed to Q6.  
  - **Q6 → "Neither option":** Unattractive (avoids commitment) but unexplored; defaults to Q7.  
  - **Q7 → "Accept explosion":** Incoherent; violates the goal of avoiding garbage outputs.  
  - **Gap vs. No-proposition:** Not fully separable (e.g., Case 2); depends on philosophical stance.  

  ---  
  ### Case Analysis  
  **Case 1: Deadline conflict**  
  - **Path 1 (Disambiguation):** Q1=Yes → **Leaf A** (e.g., "deadline" = abstract vs. final).  
  - **Path 2 (No error):** Q1=No → Q2=No → Q4=No → Q6=KB inconsistent → Q7=Store conflict → **Leaf H** (four-valued).  
  - *Why multiple paths?* Depends on whether "deadline" is ambiguous.  

  **Case 2: Self-referential entry**  
  - **Path 1 (Defect → Gap):** Q1=No → Q2=No → Q4=Yes → Q5=Vagueness? → *Flag* → **Leaf E** or **Leaf F**.  
  - **Path 2 (Defect → No-proposition):** Q1=No → Q2=No → Q4=Yes → Q5=Paradox → **Leaf F** (no-proposition).  
  - *Why multiple paths?* Philosophical choice on handling paradoxes.  

  **Case 3: Vagueness (room size)**  
  - **Path 1 (Defect → Gap):** Q1=No → Q2=No → Q4=Yes → Q5=Vagueness → **Leaf E** (gap).  
  - **Path 2 (Repair):** Q1=No → Q2=Yes (e.g., guideline typo) → Q3=Reject one → **Leaf B**.  
  - *Why multiple paths?* Depends on whether vagueness is seen as a defect or an error.  

  **Case 4: Policy conflict**  
  - **Path 1 (Glut):** Q1=No → Q2=No → Q4=No → Q6=World inconsistent → **Leaf G** (glut).  
  - **Path 2 (Fragment):** Q1=No → Q2=No → Q4=No → Q6=KB inconsistent → Q7=Isolate fragment → **Leaf I** (paraconsistent fragment).  
  - *Why multiple paths?* Depends on whether inconsistency is ontological or epistemological.  

  ---  
  **Tree Strains:**  
  - Vagueness (Case 3) blurs defect/repair; Liar (Case 2) blurs gap/no-proposition.  
  - Authority conflicts (Case 4) force awkward glut/fragment commitments.  
  - Quarantine (Leaf D) costs coverage; four-valued (Leaf H) complicates queries.  
  - **Output fidelity:** Requires annotating *why* a leaf was chosen (e.g., "disambiguation possible" for Leaf A).
