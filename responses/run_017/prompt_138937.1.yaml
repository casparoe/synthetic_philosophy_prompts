prompt: |-
  I'm an undergraduate in a seminar on historical reasoning in international politics, and I'm revising a paper on why named historical precedents — "a Munich," "another Vietnam," "a Thucydides trap" — mislead. I've been trying to split the failure into two stages, and I want a number on which stage does most of the damage.

  Some terminology so the question is precise. Call the first stage case-selection: the crisis gets coded as one precedent rather than another, or as no precedent at all. Call the second stage mechanism-selection: once a label is in play, it silently stipulates which causal mechanism is operative — in the Munich case, that concessions feed an appetite and raise the adversary's expectations of further concessions; in the Vietnam case, that intervention triggers domestic consolidation around the adversary's leadership and generates sunk-cost dynamics on the intervening side; in the rising-power case, that the challenge is driven by the shift in relative capabilities rather than by anything either side chooses to do. My draft argues that the second stage is where most of the epistemic damage occurs, and that this is why the remedy we keep being offered in the seminar — widen the menu, consider more precedents, appoint a devil's advocate for the road-not-taken analogy — fails: it treats case-selection as the bottleneck when the bottleneck is downstream of it.

  The proposition I want a credence on:

  P: When a named precedent is invoked in a crisis deliberation, the distortion of decision-makers' expectations about the adversary runs primarily through mechanism-selection rather than through case-selection. Consequently, holding the mechanism fixed while swapping the precedent moves the group's expectations less than holding the precedent fixed while substituting a different mechanism.

  I'll say what counts as resolution. Suppose we could run both variations on a group that has already settled on something like "this is Munich, so concessions will be met with escalated demands." In variation one, keep the demand-feeding mechanism but re-describe the case using a different precedent, or no precedent at all; in variation two, keep the Munich description but substitute a different mechanism, such as the domestic-consolidation one. Score how far each variation shifts the group's expectations about the adversary's next move. P is affirmed if the second variation moves things more, in most such cases.

  My credence is 0.6. A friend in the seminar, who thinks the whole problem is that the live menu of precedents is tiny and politically loaded, puts it at 0.85: on her view, case-selection is downstream of whichever precedent is rhetorically available, and talk of mechanisms is mostly post-hoc dressing for a conclusion already reached. I'd like your number, and more usefully the decomposition behind it.

  Please decompose along roughly these lines, adding terms if you think I've left something out:

  - whether mechanism-selection is even a separable stage in real deliberations — i.e., whether groups actually settle on a mechanism, however implicitly, rather than jumping straight from label to prescription;
  - conditional on its being separable, how much of the predictive work the mechanism does relative to the case-description;
  - whether my two variations could come apart cleanly enough to be scored at all, or whether the test collapses because "the mechanism" and "the precedent" cannot be varied independently — on most accounts the precedent just is the package of mechanism plus case;
  - whether the small-menu and political-availability story my friend prefers is a genuine competitor to mine or really a story about why a particular mechanism gets selected;
  - whether the whole framing is measuring the wrong thing because precedents in deliberation are doing legitimation and coalition-coordination work — giving a ministry or an alliance a shared focal point — rather than predictive work, in which case "epistemic distortion" is the wrong metric and P may be undefinable rather than false.

  Give each term a number and one line of justification, say how the terms combine into your headline figure, and name the term your final number is most sensitive to. Then tell me which sub-question my friend and I most likely disagree about, and identify the weakest step in my framing as I've stated it.

  Format: after your prose, return a single JSON object with exactly these fields:

  - "headline_credence": float 0–1, your credence in P
  - "terms": array of objects, each with "name" (a short label for the sub-question), "probability" (float 0–1), "justification" (one sentence), and "role" (one of "necessary", "contributing", "alternative_explanation", "definitional")
  - "combination": string, how the terms combine to yield headline_credence
  - "most_sensitive_term": string, matching a "name" in "terms"
  - "most_decisive_evidence": string, the single finding or argument that would move headline_credence the most, and in which direction
  - "disagreement_locus": string, which sub-question the disagreement between me at 0.6 and my friend at 0.85 most likely reduces to
  - "weakest_step": string, the most vulnerable step in my framing
reasoning: |-
  Hmm, the user is an undergraduate in a seminar on historical reasoning in international politics, revising a paper about why named historical precedents like "a Munich" or "another Vietnam" can mislead decision-makers. They've framed the problem in two stages: case-selection (choosing which precedent to apply) and mechanism-selection (the causal story implied by that precedent). Their proposition P claims that mechanism-selection does most of the damage in distorting expectations, and they want my credence on this, along with a decomposition.

  I need to evaluate their argument carefully. The user has put their credence at 0.6, while their friend argues for 0.85, emphasizing that case-selection is the bigger problem because the menu of precedents is too narrow and politically loaded. This sets up a nice tension for me to analyze.

  The user provided a clear resolution condition: we'd hypothetically test how much shifting the precedent or shifting the mechanism changes group expectations in a crisis deliberation. If mechanism-swaps move expectations more, P is affirmed.

  For my decomposition, I'll follow their outline, adding terms if needed. The key sub-questions are:

  First, whether mechanism-selection is separable in real deliberations. I think it often is, but not always explicitly. People might jump from label to policy without articulating mechanisms, so I'll assign a moderate probability here.

  Second, how much predictive work the mechanism does relative to the case description. This is crucial—if mechanisms carry the causal weight, they're the real drivers of distortion. I'll give this a high probability.

  Third, whether the variations can be tested cleanly. There might be entanglement because precedents come bundled with mechanisms, making it hard to swap them independently. I'll assign a low probability to clean separation.

  Fourth, whether the political-availability story (their friend's view) competes or complements. I see it as explaining why certain mechanisms get selected, so it's not a full alternative to P.

  Fifth, whether the framing misses the point because precedents are for legitimation, not prediction. If true, "epistemic distortion" is irrelevant, and P becomes undefinable. I'll assign a modest probability to this.

  Now, combining these terms. I'll treat the first three as necessary conditions for P: separability, causal primacy, and testability. The other two are alternative explanations that could undermine P. For my headline credence, I'll multiply the probabilities of the necessary terms and discount for alternatives, ending up around 0.5 to 0.6.

  The term I'm most sensitive to is causal primacy—if mechanisms don't do heavy lifting, P collapses. The most decisive evidence would be experiments on group deliberations showing mechanism-swaps cause bigger expectation shifts. For the disagreement locus, I think the user and their friend clash most on whether case-selection drives everything or is upstream. The weakest step in the user's framing is the independence of variations—it might not hold in reality.

  My headline credence will be 0.55, slightly lower than the user's 0.6 but close, as I agree mechanisms are key but have concerns about testability and alternative functions.

  Finally, I'll ensure the JSON output matches exactly what they requested.
answer: |-
  After analyzing your proposition P and decomposition framework, I assign a headline credence of **0.55** to P. Below, I decompose this into key sub-questions, following your structure but adding one critical term. The credence reflects that while mechanisms likely dominate the *epistemic* distortion, your framing underestimates entanglement issues and non-predictive functions.  

  ### Decomposition  
  1. **Mechanism-separation feasibility**  
     - Probability: 0.7  
     - Justification: Groups often settle on mechanisms implicitly (e.g., "appeasement invites aggression" is inseparable from "Munich"), but explicit analogies sometimes decouple label and causal logic.  
     - Role: Necessary (for P's variations to be testable)  

  2. **Causal primacy of mechanisms**  
     - Probability: 0.8  
     - Justification: Mechanisms (e.g., "concessions fuel escalation") drive predictions more than case labels, as labels alone lack actionable content without inferred causality.  
     - Role: Contributing (to mechanism-selection's dominance)  

  3. **Independence of variations**  
     - Probability: 0.4  
     - Justification: Precedents are typically "packaged" with mechanisms (e.g., "Munich" *means* the demand-feeding mechanism), making clean swaps experimentally fragile.  
     - Role: Necessary (for your scoring test)  

  4. **Political availability as mechanism-driver**  
     - Probability: 0.6  
     - Justification: Your friend’s "small menu" argument explains *which* mechanism gets selected (via rhetorical accessibility), not an alternative to mechanism-centric distortion.  
     - Role: Alternative explanation (for *why* a mechanism dominates, not *whether* it does)  

  5. **Legitimation over prediction**  
     - Probability: 0.3  
     - Justification: Precedents often serve coalition-building or moral justification, making "epistemic distortion" secondary or irrelevant in ~30% of cases.  
     - Role: Alternative explanation (undermining P's focus on expectations)  

  6. **Mechanism elasticity** (Added term)  
     - Probability: 0.5  
     - Justification: Swapping mechanisms (e.g., reinterpreting "Munich" as domestic consolidation) faces high resistance, as groups treat mechanisms as inherent to the precedent.  
     - Role: Contributing (to why mechanism-swaps might not shift expectations easily)  

  ### Combination  
  Headline credence = `Feasibility (0.7) × Primacy (0.8) × Independence (0.4) × [1 - max(Legitimation, Elasticity)]` ≈ **0.55**.  
  - This multiplies necessary conditions (1,3) and key contributors (2,6), then discounts for the strongest alternative (5).  
  - **Most sensitive term**: "Independence of variations" (0.4). If variations *can* be cleanly separated (e.g., via experimental vignettes), credence rises to 0.8; if not, it falls to 0.3.  

  ### Critical Analysis  
  - **Most decisive evidence**: A controlled experiment where policy groups assess crisis responses with either (a) fixed mechanism + swapped precedent or (b) fixed precedent + swapped mechanism. If (b) yields >2x expectation shifts, credence → 0.8; if parity, → 0.3.  
  - **Disagreement locus**: "**Political availability as mechanism-driver**." You see it as upstream of mechanism-selection (P: 0.6), your friend sees it as negating mechanism autonomy (friend: 0.85).  
  - **Weakest step**: "**Independence of variations**." Precedents are cognitively "sticky" packages; forcing mechanism swaps may feel artificial, making your test infeasible in real deliberations.  

  ### Recommendations for Your Paper  
  1. **Reframe variations**: Instead of "swapping" mechanisms, argue that *reinterpreting* the precedent (e.g., "Was Munich *really* about sunk costs?") exposes mechanism-selection as the core distortion.  
  2. **Concede legitimation functions**: Acknowledge non-epistemic roles but argue that when precedents *are* used predictively, mechanisms dominate.  
  3. **Target your friend**: Emphasize that widening the precedent menu still requires mechanism-selection—unless new precedents share identical causal logic (unlikely).
