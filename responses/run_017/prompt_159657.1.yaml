prompt: |-
  I'm moderating a half-hour Q&A after a lecture by a visiting scholar who defends what she calls audience-relative textualism: the claim that the correct method for interpreting a statute is whichever method the legislature that enacted it would have expected courts to apply, so that the authority of textualism rests on contingent empirical facts about a given legislature's drafting practices and expectations rather than on notice, democratic legitimacy, or the separation of powers. She opens by quoting from Holy Trinity Church v. United States the familiar rule that a thing may be within the letter of the statute and yet not within the statute because not within its spirit nor within the intention of its makers, and she argues from it that textualists and purposivists have both been looking for the justification of a method in the wrong place.

  Draft me eight to ten questions for the session. I want at least one on whose expectations are supposed to count when a statute enacted in the 1930s is applied to facts nobody then envisaged: the enacting legislature's or the current one's. I want one on how the expectations of a multimember body are to be aggregated when its members expect different methods, or have no expectations at all. I want one pressing the charge that the view is purposivism in disguise, since an appeal to what the legislature would have wanted courts to do is an appeal to a counterfactual legislative attitude. I want one on whether, on her account, Congress could switch the correct method by statute, say by directing courts to consult committee reports. And I want one on a municipal ordinance barring vehicles from a public park as applied to a motorized wheelchair, where text and purpose diverge but where the narrow absurdity carve-out she concedes may not clearly reach.

  For each question, anticipate the reply she is most likely to make and supply the follow-up that makes it harder to rest on: expect something like legislators know that courts read text, so they expect textualism on the aggregation point; something like my view concerns expected method rather than expected outcome on the purposivism charge; and something like a legislature may choose its interpreters' methods only within the limits of whatever anti-delegation rationale you accept on the statutory-override point. Close with one question about what empirical finding would make her give the view up.
reasoning: |-
  Okay, let's tackle this. The user is moderating a Q&A session for a scholar advocating audience-relative textualism. The core idea is that the correct interpretation method depends on what the enacting legislature expected courts to use. The user needs 8-10 questions with specific requirements.

  First, I need to cover all the requested angles: whose expectations matter for old statutes, aggregating multi-member expectations, the purposivism-in-disguise charge, statutory override possibility, and the wheelchair ordinance example. Plus, a closer on empirical falsifiability. 

  For the historical statute question, her likely reply would be "original expectations only," so the follow-up should challenge whether that's coherent or binding for modern legislatures. The aggregation problem is tricky—she might say "settled practices create expectations," so I'll push back on dissenters and silent members. 

  The purposivism charge seems strong. She'll probably distinguish methods from outcomes, but the follow-up needs to expose circularity: if expectations are shaped by existing methods, doesn't that defeat the point? 

  On statutory override, she'll likely say Congress can choose methods unless it violates separation of powers. Good follow-up: what specific limits? Could Congress mandate ignoring plain text? That forces her to confront the theory's democratic legitimacy claims. 

  The wheelchair case is perfect for exposing gaps. Her absurdity carve-out might not cover it, so the follow-up should ask why we shouldn't default to purpose when her framework fails. 

  Finally, the empirical falsifiability closer is smart—it forces her to admit if the theory is truly evidence-based. I'll suggest a finding that legislatures never consider methods, which would gut her foundation. 

  Noticing the user wants tight philosophical engagement. They’re clearly well-versed (citing Holy Trinity, knowing textualism/purposivism debates), so questions must avoid basics and target nuances. Also, moderators need balanced but probing questions—no gotchas, but no softballs either. The wheelchair example shows they care about real-world implications beyond theory. 

  I’ll structure each Q with a clear setup, anticipated reply (to show I grasp her stance), and a razor-sharp follow-up. The flow should build: start with theory foundations (Q1-2), then objections (Q3-5), practical tests (Q6-7), institutional powers (Q8), and end with falsifiability (Q9). That covers all requested angles while keeping it conversational.
answer: |-
  Here are 10 questions designed to probe the scholar's "audience-relative textualism" (ART), incorporating your specific requests and anticipating likely replies and challenging follow-ups:

  1.  **Question (Core Definition/Historical Application):** Your core claim is that the correct method is what the *enacting* legislature expected courts to apply. When applying a 1930s statute to unforeseen circumstances (e.g., the internet, novel biotech), whose expectations control: the original enactors, or the current legislature whose authority sustains the statute's application today?
      *   **Anticipated Reply:** "The enacting legislature's expectations are paramount. The statute's meaning is fixed at enactment; its application to unforeseen facts is governed by the interpretive method *they* expected, even if that leads to outcomes they couldn't foresee."
      *   **Follow-Up:** But doesn't the current legislature's continued reliance on the statute *today* imply some endorsement of its *ongoing function*? If the original expected method (say, strict textualism) produces results wildly inconsistent with any plausible modern purpose, isn't ART forcing the *current* legislature to live by a long-dead body's contingent expectations about process, potentially undermining the very democratic legitimacy ART seeks to ground in the original legislature?

  2.  **Question (Aggregation Problem):** Legislatures are multi-member bodies. How do we aggregate expectations when members held different views on interpretive methods, or simply had no conscious expectations at all about how courts would interpret their work? What constitutes the "legislature's expectation"?
      *   **Anticipated Reply:** "We look to objective manifestations: drafting practices (e.g., reliance on committee reports, floor statements), contemporaneous judicial practices they legislated against or acquiesced to, and widely shared understandings among sophisticated legislative actors about how courts operated at the time."
      *   **Follow-Up:** Doesn't this risk collapsing ART into a form of purposivism? If we infer expectations from practices and acquiescence, aren't we effectively asking what method the legislature *would have endorsed* or *relied upon*, which sounds like a counterfactual intent or purpose? Furthermore, how do you handle dissenters who explicitly rejected the dominant method, or the likely large number of members who simply voted without thinking about interpretive methodology?

  3.  **Question (Purposivism in Disguise?):** Critics might say ART is purposivism masquerading as textualism. Aren't you appealing to a counterfactual legislative attitude ("what they would have wanted courts to do") rather than the enacted text? Doesn't your reliance on "expectations" about *method* still involve constructing a legislative intent regarding the interpretive process itself?
      *   **Anticipated Reply:** "No, this is a crucial distinction. Purposivism seeks the legislature's *substantive intent* for the *outcome* in a specific case. ART seeks evidence of their *procedural expectation* about the *general method* courts should use *to interpret* the text. It's about the rules of the game they thought they were playing, not the specific moves."
      *   **Follow-Up:** But isn't the search for that "procedural expectation" still an exercise in divining the legislature's state of mind about an abstract question (methodology)? How is inferring their expected *method* from practices or statements fundamentally different, in kind, from inferring their *substantive purpose* from similar sources? Both seem like forms of intentionalism.

  4.  **Question (The Holy Trinity Example):** You opened with Holy Trinity's "spirit vs. letter" quote. Doesn't ART suggest that if the enacting legislature *expected* courts to use Holy Trinity-style purposivism (as many likely did in that era), then that *is* the correct method for interpreting statutes from that period, even if modern textualists find it illegitimate?
      *   **Anticipated Reply:** "Exactly. ART is historically contingent. If the empirical evidence shows the 42nd Congress expected and relied upon courts looking to purpose and spirit *despite* the text, then that is the correct method for interpreting statutes they passed. Modern textualism's normative arguments don't retroactively change the expectations of past legislatures."
      *   **Follow-Up:** Doesn't this lead to significant instability and unpredictability in the law? If interpretive method radically shifts depending on the decade a statute was passed, how can citizens, lawyers, or even future legislatures reliably understand the law? Doesn't this undermine the notice value ART might claim?

  5.  **Question (Statutory Override - Can Congress Choose?):** Could the *current* Congress statutorily mandate the interpretive method for *all* statutes (past and future), e.g., by directing courts to always prioritize committee reports or legislative history over plain text? If not, why not, given that ART grounds authority in legislative expectations?
      *   **Anticipated Reply:** "A current Congress cannot retroactively change the expectations under which a past Congress enacted a statute. The expectations relevant for interpreting Statute X are those of the Congress that enacted X. However, Congress *can* prospectively establish interpretive rules for statutes it *future* enacts, within constitutional limits (e.g., non-delegation doctrine, due process)."
      *   **Follow-Up:** What are those constitutional limits? Could Congress direct courts to ignore the plain text of a future statute if a committee report suggests a different meaning? If ART's foundation is legislative supremacy over interpretive method, why *couldn't* Congress delegate this interpretive authority so broadly? Doesn't the non-delegation rationale you hint at rely on normative principles (like notice, separation of powers) that ART explicitly rejects as the *primary* justification for textualism?

  6.  **Question (The Wheelchair in the Park - Absurdity Limits):** Consider the classic: an ordinance bars "vehicles" from the park. A motorized wheelchair enters. Textualism might exclude it (vehicle); purpose (safety, quiet recreation) likely includes it. You concede a narrow absurdity exception. Does ART clearly dictate the outcome here? Does the absurdity carve-out cover this?
      *   **Anticipated Reply:** "ART doesn't dictate an outcome; it dictates the *method*. We must first ask: What method did the enacting city council *expect* courts to use? If they expected strict textualism, the court applies the text unless it meets a *very* high absurdity threshold (which this likely doesn't – it's perhaps unanticipated, but not absurd). If they expected purposivism, purpose controls. The key is applying *their* expected method."
      *   **Follow-Up:** Assume the evidence for *their* expected method is ambiguous or points to textualism. Applying the text literally excludes the wheelchair. This seems unjust and contrary to the apparent underlying purpose (safety/quiet isn't harmed by a wheelchair). If ART forces this result based on contingent historical expectations about method, doesn't it demonstrate a flaw? Why privilege a dead council's procedural expectation over the substantive justice and functionality of the law *today*?

  7.  **Question (Dealing with Silence/Ambiguity in Expectations):** What is the default rule under ART when there is *no* discernible evidence of the enacting legislature's expectations regarding interpretive methodology? Does it default to textualism? If so, on what basis, given ART rejects textualism's standard normative justifications?
      *   **Anticipated Reply:** "In cases of genuine, irremediable ambiguity about the expected method, we might look to the prevailing judicial practice *at the time of enactment* as the best proxy for what the legislature likely assumed or acquiesced to. If *that* is unclear, the principle of legislative supremacy underlying ART might cautiously favor the method most respectful of the enacted text itself as the sole legitimate expression of the lawmaking body – which could point towards textualism."
      *   **Follow-Up:** Isn't this default towards textualism (or historical judicial practice) an admission that ART *needs* an underlying normative foundation (like notice or respect for the enacted text) after all? If the empirical well is dry, ART seems to borrow from the very theories it claims to supersede.

  8.  **Question (Democratic Legitimacy Revisited):** ART grounds legitimacy in the enacting legislature's expectations. But if citizens today are governed by statutes interpreted by methods contingent on historical expectations they know nothing about, how does ART provide *them* with notice or democratic legitimacy? Isn't the legitimacy for the *current* citizenry severed?
      *   **Anticipated Reply:** "The legitimacy flows from the original democratic enactment under the rules (including expected interpretive rules) understood at the time. Stability and respect for past democratic decisions are core democratic values. Citizens are on notice that laws are interpreted according to the methods in place when passed."
      *   **Follow-Up:** But doesn't this make the law a complex historical artifact rather than a knowable set of rules? How can a citizen realistically research the drafting practices and judicial norms of the 75th Congress to understand how a statute affecting them *today* will be interpreted? Doesn't this create a serious notice problem ART can't solve?

  9.  **Question (Separation of Powers Tension):** Doesn't ART potentially undermine the judicial role? If the legislature expected courts to act as quasi-agents implementing their specific substantive purposes (via purposivism), doesn't that erode judicial independence and the checking function? Conversely, if they expected textualism, are courts merely linguistic technicians?
      *   **Anticipated Reply:** "ART respects the separation of powers by giving courts the role the *legislature* constitutionally empowered and expected them to play when it enacted the law. It doesn't dictate the judicial role universally, but specifies it *for a given statute* based on the enacting legislature's understanding of the judicial function within the constitutional framework."
      *   **Follow-Up:** But doesn't the Constitution itself arguably imply *some* inherent judicial role in interpretation, independent of legislative expectations? What if a legislature expected courts to simply rubber-stamp the majority leader's stated intent? Would that be binding under ART? If not, what constitutional principle overrides ART in that case?

  10. **Question (Falsifiability - Empirical Heart):** ART places enormous weight on contingent empirical facts about legislative expectations. What specific empirical finding, if demonstrated convincingly across many legislatures and eras, would lead you to abandon ART as descriptively inaccurate or normatively unworkable? For instance, if research showed legislators *never* consciously considered interpretive methods, or only thought about desired outcomes?
      *   **Anticipated Reply:** "The core claim could be falsified by evidence showing that legislative expectations about interpretive method are systematically incoherent, entirely absent, or play *no* meaningful role in drafting or reliance. If it turned out legislators draft solely for immediate political effect with zero regard for how courts will interpret their words later, and courts know this, then ART's foundation in legislative expectations would crumble. It would become a purely normative theory."
      *   **Follow-Up:** Given the immense difficulty of proving such a universal negative about legislative cognition across history, doesn't this make ART effectively unfalsifiable in practice? How do we distinguish between legislatures having *no* expectations and our simply lacking sufficient evidence of them?

  These questions directly target the novel claims, potential tensions, and practical implications of Audience-Relative Textualism, anticipating the scholar's likely defenses and pushing her to clarify the boundaries and foundations of her theory. Good luck with the Q&A!
