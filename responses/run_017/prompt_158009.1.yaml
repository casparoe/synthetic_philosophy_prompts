prompt: |-
  i'm writing the theory-of-skill section for a curriculum proposal at my college — we're starting a practical-skills strand (knot work, wilderness first aid, that sort of thing) and the committee wants to know what we think we're actually certifying when we sign someone off. Someone suggested I write down my real position on knowing how vs knowing that first, so here it is. Please be honest about whether it holds together:

  1. Knowing how is genuine knowledge, not just a dressed-up way of talking about abilities or reliable dispositions. A fluent speaker of a language knows something a phrasebook doesn't, and that difference isn't merely a difference in behaviour.

  2. Knows how is standard-relative: you can know how to tie a bowline well enough to rig a dinghy without knowing how to tie one well enough to pass a rescue-knot test, and there's no single cutoff where the knowledge starts. Knowing that p has nothing comparable.

  3. You can acquire knowledge-how in one shot, from testimony or a demonstration, with no practice. If a trainee watches the video once and immediately ties it correctly, she knows how to tie that knot. That's why I want our written-plus-video module to count as certification even for people who have never tied one.

  4. Knowledge-how outlives the ability. The pianist with both arms in casts still knows how to play the piece, and my instructors say the same about a surgeon who has temporarily lost fine motor control after a hand injury.

  5. Knowledge is factive — no knowing that p unless p is true — but knowing how isn't the sort of thing that can be correct or incorrect, so factivity just doesn't get a grip on it.

  6. Knowing how rules out luck. Someone who gets it right by accident, or who couldn't tell a bowline from a granny knot, doesn't know how, whatever the outcome was.

  7. Lots of non-human animals and pre-verbal kids know how to do things — grasp, track a scent, walk — even though they have no propositional attitudes about ways of doing those things.

  I can't tell whether any of this is internally consistent and I'd rather find out now than in front of the committee. Go through the pairs and tell me which are genuinely in tension and which only look like it. Rank the real ones by how bad they are, and for each say what would have to give, what that would cost me elsewhere on the list, and what the cheapest fix is. If there's a single revision that cleans up more than one of them, tell me which. Also flag anything that looks fine to me but is quietly doing real work — especially if it's load-bearing for the certification policy in 3.
reasoning: |-
  Okay, the user is working on a curriculum proposal for a practical-skills strand at their college. They've outlined seven points about "knowing how" versus "knowing that" and want to ensure their position is internally consistent before presenting it to the committee. They're particularly concerned about potential tensions between these points and how they might affect their certification policy in point 3.

  First, I need to understand each of their seven claims. They argue that knowing-how is genuine knowledge, standard-relative, acquirable in one shot without practice, can outlive ability, isn't factive like propositional knowledge, rules out luck, and exists in non-human animals and pre-verbal children.

  The biggest red flag is point 3 - the claim that knowledge-how can be acquired instantly from testimony or demonstration without any practice. This directly conflicts with several other points. Point 4 says knowledge can outlive ability, but point 3 bypasses the need for ability entirely. Point 6 emphasizes that luck is ruled out in knowing-how, yet a one-shot acquisition seems vulnerable to lucky guesses. Their certification policy in point 3 depends entirely on this claim, making it a crucial but weak point.

  Point 5 creates problems too. Claiming knowing-how isn't factive contradicts point 6 which requires eliminating luck - suggesting there must be some correctness condition. And point 7 about animals knowing-how implies practical mastery that can't come from testimony alone.

  The user needs to prioritize fixing point 3 since it's both problematic and policy-critical. They could soften it to acknowledge that while some conceptual understanding might come quickly, reliable performance requires practice. This would resolve tensions with points 4, 6 and 7 while still allowing video modules as partial certification. They should also refine point 5 to allow for practical correctness rather than propositional truth.

  For presenting to the committee, they should emphasize the standard-relativity from point 2 to frame different certification levels. The animal cognition point (7) strengthens their case for non-propositional knowledge but shouldn't be overextended. Overall, with adjustments to point 3 and 5, their framework becomes robust enough to support their practical-skills curriculum while acknowledging the role of practice in true mastery.
answer: |-
  Based on a careful analysis of your 7 points, here's the breakdown of tensions, their severity, necessary trade-offs, and potential fixes. Your core intuition about knowledge-how being distinct and genuine is strong, but point #3 is the primary destabilizer and requires significant revision to align with the others and support your certification policy.

  **Ranked Tensions (Most Severe First):**

  1.  **#3 (One-Shot Acquisition) vs. #6 (Ruling Out Luck) & #4 (Outlives Ability) & #7 (Animals/Pre-Verbal)**
      *   **Severity:** **Critical.** This is the single biggest conflict and undermines your certification policy's core justification.
      *   **Nature of Tension:**
          *   **#3 vs. #6:** If knowledge-how can be acquired instantly from a single viewing with *no practice*, it becomes indistinguishable from a lucky guess or successful imitation *on that one occasion*. #6 correctly states that luck rules out knowledge-how. The trainee who succeeds once immediately *might* know how, but it could equally be luck. Only repeated successful performance (or the ability to explain/correct mistakes - see #6 tension with #7) reliably rules out luck. Your policy relies on this fragile, potentially lucky performance.
          *   **#3 vs. #4:** If knowledge-how requires *no ability manifestation* to be acquired (just watching), why would it *outlive* the ability? #4 implies knowledge-how is a state *distinct* from but *underlying* the ability. If it can exist with *zero* prior ability manifestation (#3), the connection between knowledge-how and potential ability (#4) becomes tenuous. What *is* this state acquired instantly that later underlies ability if ability wasn't involved in acquiring it?
          *   **#3 vs. #7:** Animals/pre-verbal children acquire knowledge-how through practice, trial-and-error, and sensorimotor coordination – *not* by watching a single demonstration and instantly performing the act perfectly. Their knowledge-how is embodied and practical, not based on representational understanding gained from testimony. #3's model fits propositional learning better.
      *   **What Has to Give:** **#3 must be significantly revised or abandoned.** The claim of *instantaneous, practice-free, reliable acquisition* of *genuine practical knowledge-how* solely from testimony/demonstration is unsustainable.
      *   **Cost:** Your proposed certification policy (written + video module counting for someone who has *never tied one*) loses its primary justification. You cannot reliably certify *knowledge-how* based on a single successful performance immediately after watching.
      *   **Cheapest Fix:** **Reframe #3 to acknowledge the role of practice/reliability.** *"While understanding instructions or witnessing a demonstration can provide the necessary conceptual grasp *for* knowing-how, genuine knowledge-how requires the development of reliable ability through practice, ruling out luck (#6). However, for simple, discrete tasks like tying a specific knot, minimal practice under assessment might suffice to confirm the knowledge has been successfully acquired from the instruction."* **This forces a rethink of your certification policy.** The video+written module becomes *instruction*, but certification requires *demonstration of reliable performance* (perhaps after minimal supervised practice, not necessarily extensive prior experience).

  2.  **#5 (Not Factive / No Correctness) vs. #6 (Rules Out Luck)**
      *   **Severity:** **Major.** These points directly contradict each other.
      *   **Nature of Tension:** #6 states that getting it right by accident means you *don't* know how. This implies there *is* a "right way" and that knowing-how involves getting it right *non-accidentally*. #5 denies knowing-how can be "correct or incorrect." But #6 only makes sense if there *is* a standard of correctness (e.g., tying a bowline vs. a granny knot, performing first aid effectively). If there's no correctness condition, luck can't rule it out because there's nothing to get "right" by luck.
      *   **What Has to Give:** **#5 must be revised.** Knowing-how *does* have a correctness condition, but it's practical success (achieving the goal effectively, performing the action correctly) rather than propositional truth.
      *   **Cost:** You lose the clean distinction that knowing-how has *no* correctness condition. You must accept that practical knowledge can be correct/incorrect relative to its goal/standard.
      *   **Cheapest Fix:** **Revise #5:** *"Knowledge is factive for knowing-that, but the correctness condition for knowing-how is practical success or effective performance relative to a standard (#2), not propositional truth. One cannot genuinely know how to do something if one consistently fails to do it correctly when trying, or if one's method is fundamentally flawed."* This aligns with #2 (standards) and #6 (rules out luck/mistakes).

  3.  **#6 (Rules Out Luck) vs. #7 (Animals/Pre-Verbal)**
      *   **Severity:** **Moderate.** This is less direct but highlights a conceptual tension.
      *   **Nature of Tension:** #6 requires ruling out luck, which typically involves cognitive elements like understanding *why* something worked or being able to detect/correct mistakes. #7 attributes knowledge-how to creatures lacking propositional attitudes or explicit understanding. How do we rule out luck for the animal or pre-verbal child? Is their successful action *always* knowledge-how, or can it sometimes be instinct/reflex/luck? #6 implies a cognitive threshold that #7 seems to bypass.
      *   **What Has to Give:** **Refine the interpretation of #6** or acknowledge that "ruling out luck" manifests differently across the spectrum of knowledge-how.
      *   **Cost:** You need a more nuanced view of what "ruling out luck" means for non-linguistic agents. It might mean reliable success based on integrated sensorimotor understanding, not reflective judgment.
      *   **Cheapest Fix:** **Clarify #6:** *"Knowing-how rules out *mere* luck. It requires that success is grounded in a reliable capacity or understanding (which may be non-conceptual and embodied, as in #7), not a fluke. For pre-linguistic agents, this reliability manifests in consistent successful performance and adaptability within their capabilities, not propositional justification."* Emphasize the *reliability* aspect over the *cognitive justification* aspect for non-linguistic cases.

  **Other Points & Load-Bearing Elements:**

  *   **#1 (Genuine Knowledge) & #7 (Animals/Pre-Verbal):** These are **load-bearing** for your core argument against intellectualism (the view that knowing-how is just knowing-that). They establish knowledge-how as a distinct, fundamental type of knowledge.
  *   **#2 (Standard-Relative):** This is **absolutely crucial and load-bearing**, especially for certification policy. It allows you to define *levels* of certification (e.g., "Dinghy Rigging Standard Bowline" vs. "Rescue Certification Bowline"). It explains why there's no single "knows how" cutoff. **Lean heavily on this for the committee!** It answers the question "What are we certifying?" directly: *"We are certifying that the student possesses knowledge-how (as defined in points 1, 4, 6) sufficient to reliably perform skill X according to Standard Y."*
  *   **#4 (Outlives Ability):** This is **load-bearing** for the concept of knowledge-how as a persisting cognitive state, distinct from transient ability. It supports the idea that skills can be retained mentally even when not physically executable. It's generally consistent with others *if* #3 is fixed.
  *   **#3 (One-Shot Acquisition):** As established, this is the **primary weak point** and the foundation of your specific certification policy. It cannot stand as stated without fatally undermining #6 and straining the connection to ability (#4) and the model from #7.

  **Summary Recommendations & Strategic Implications for the Committee:**

  1.  **Revise Point #3:** Abandon the "no practice" requirement for genuine knowledge-how acquisition. Acknowledge that while instruction provides the *basis*, knowledge-how requires demonstrated reliable performance (minimal practice under assessment might suffice for simple knots). **This necessitates revising your certification proposal.** The video+written module is essential *instruction*, but certification requires *demonstrated competence* (tying it correctly, potentially multiple times, explaining key features, maybe under mild stress/distraction) *after* receiving that instruction. You can still argue it's efficient (minimal practice needed *because* of the good instruction).
  2.  **Revise Point #5:** Accept that knowing-how has a correctness condition based on practical success relative to a standard (#2), distinct from propositional truth. This aligns with #2 and #6.
  3.  **Clarify Point #6:** Explicitly state that "ruling out luck" means grounded in reliable capacity/understanding, which for non-linguistic agents (#7) means consistent successful performance and adaptability, not propositional justification.
  4.  **Emphasize Point #2 (Standard-Relativity):** This is your strongest and most practical point. Frame your entire certification around defined standards (e.g., "Level 1: Basic Knots for Campcraft", "Level 2: Rescue-Grade Knots"). This directly answers the committee's question about "what we're certifying."
  5.  **Leverage Points #1 & #7:** Use these to clearly distinguish your view from intellectualism and ground the idea that practical skill is genuine knowledge.
  6.  **Use Point #4:** Support the idea that certification signifies a lasting cognitive achievement (knowledge-how), not just current physical ability.

  **Revised Core for Committee Presentation:** "We certify that a student possesses *genuine knowledge-how* (#1, #7) to perform specific practical skills *to a defined standard* (#2). This knowledge-how is a cognitive state that underlies reliable ability (#4, #6 - revised) and is acquired through effective instruction *combined with* sufficient practice to ensure competence and rule out luck (#3 - revised, #6). While non-human animals possess basic forms (#7), human certification involves understanding standards and instructions (#5 - revised)."

  This revised framework is internally consistent, philosophically defensible (drawing on Ryle, Stanley & Williamson, Bengson & Moffett, etc.), and provides a solid, practical basis for your certification policy, even if it requires demonstrating competence beyond just watching a video. Good luck!
