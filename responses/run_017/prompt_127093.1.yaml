  ### **Scenario: Career Path Choice**
  You're deciding between two career paths: **Data Science (Action A)** or **Marketing (Action B)**. Your lifelong earning potential depends on both your choice and the hidden state of the **Tech Industry's Future (S)**, which can be **Boom** or **Bust**.  
  - If S = **Boom**, Data Science pays **$250k/year**, and Marketing pays **$150k/year**.  
  - If S = **Bust**, Data Science pays **$50k/year**, and Marketing pays **$120k/year**.  

  A common cause influences both S and your choice: your **Personality Trait (B)**, which is either **Analytical (B1)** or **Creative (B2)**. B is fixed from birth and unknown to you (50% prior for each). Statistics show:  
  - **P(B1) = P(B2) = 50%**  
  - If **B1** (Analytical):  
    - **P(S = Boom) = 80%** (analytical people thrive in tech booms)  
    - **P(You choose Data Science | B1) = 90%** (analytical people prefer data roles)  
  - If **B2** (Creative):  
    - **P(S = Boom) = 20%** (creative people correlate with tech busts due to industry shifts)  
    - **P(You choose Data Science | B2) = 10%** (creative people avoid data roles)  

  You know these probabilities and the causal structure (B → S and B → Your Choice), but you don’t know your own B. The correlation is positive: choosing Data Science is good news for S = Boom.  

  ---

  ### **1. Expected Utility Calculations**  
  **Key probabilities**:  
  - **P(S = Boom)**: `(0.5 × 0.8) + (0.5 × 0.2) = 50%`  
  - **P(Choose Data Science)**: `(0.5 × 0.9) + (0.5 × 0.1) = 50%`  
  - **P(S = Boom | A)**:  
    `[P(A|B1) × P(B1) × P(S|Boom|B1)] / P(A) = (0.9 × 0.5 × 0.8) / 0.5 = 72%`  
  - **P(S = Boom | B)**:  
    `[P(B|B2) × P(B2) × P(S|Boom|B2)] / P(B) = (0.9 × 0.5 × 0.2) / 0.5 = 18%`  
    *(Note: P(B|B2) = 1 - P(A|B2) = 90% for Marketing)*  

  **Utilities**:  
  | Action     | S = Boom      | S = Bust      |  
  |------------|---------------|---------------|  
  | Data Sci (A) | $250k         | $50k          |  
  | Marketing (B)| $150k         | $120k         |  

  #### **Evidential Decision Theory (EDT)**  
  - Conditions on the action to update beliefs about S:  
    - **EU(A)**: `(0.72 × 250) + (0.28 × 50) = 180 + 14 = $194k`  
    - **EU(B)**: `(0.18 × 150) + (0.82 × 120) = 27 + 98.4 = $125.4k`  
    **Verdict**: **Choose A** (Data Science), as it’s strong evidence for S = Boom.  

  #### **Causal Decision Theory (CDT)**  
  - Ignores correlation; uses only causal effects and prior P(S):  
    - **EU(A)**: `(0.5 × 250) + (0.5 × 50) = 125 + 25 = $150k`  
    - **EU(B)**: `(0.5 × 150) + (0.5 × 120) = 75 + 60 = $135k`  
    **Verdict**: **Choose B** (Marketing), as it has higher expected utility *independent of the correlation*.  

  #### **Functional Decision Theory (FDT)**  
  - Treats the agent as a function in a larger system; since B causes both A and S, but A doesn’t *cause* S, FDT ignores the correlation like CDT:  
    - Uses same calculations as CDT: **EU(A) = $150k**, **EU(B) = $135k**.  
    **Verdict**: **Choose B** (Marketing).  

  **Divergence**: EDT uses the correlation (A is evidence for Boom) to boost EU(A), while CDT/FDT ignore it (your choice doesn’t *cause* Boom) and see B as safer.  

