prompt: |-
  Could you write me a satirical design doc for our eng wiki? Context: my team has to ship a service that takes someone's labs and lifestyle data and returns `is_disease: true/false`, and management's one hard requirement is that it be completely value-free — facts in, facts out, no judgement about whether anyone actually wants the condition fixed.

  So the doc should be written by an engineer who is fully bought into the naturalist way of doing this: a disease is just some part of the body failing to do what parts of that type are supposed to do, statistically atypical for people of that kind, nothing about whether its bad for you, and that's the whole story. Every design decision should follow from that seriously — I want someone who works on this stuff to read it and recogise the actual position rather than a strawman of it.

  The jokes should come from where the position genuinely strains, written as ordinary engineering detail: how we pick the reference class (age, sex, population — including the bits that get uncomfortable), what "normal environment" means when half our users sit all day in bad air, the fact that the most common things in our own dataset come back as not-a-disease under our own rules and the workaround we ship for that, and how "does this hurt survival and reproduction" smuggles in exactly the judging we were told not to do.

  ~700 words, deadpan, RFC section headings, no winking. Close with a seperate rejected-alternatives section for the other camp's design — the one where you need the dysfunction plus somebody thinking it's a bad thing — dismissed for the real reason it gets dismissed (things the manuals used to list: homosexuality, for one), with the author completely blind to the fact that his own design has the same bug one layer down.

  Add a few lines at the end on where you're taking liberties or leaning on a contested reading, and pick a reading — don't hedge.
reasoning: |-
  We are writing a satirical design document for an engineering wiki. The context is a service that takes labs and lifestyle data and returns `is_disease: true/false`. The key requirement is that the service must be value-free: no judgment about whether anyone wants the condition fixed. We are to write this from the perspective of an engineer fully bought into the naturalist perspective: a disease is defined solely as a statistically atypical failure of a body part to perform its typical function, without considering if it's bad for the person.

  The document should be in RFC style with section headings. The humor should arise naturally from the inherent tensions in this approach, particularly in:
  - How we pick the reference class (age, sex, population) and the uncomfortable implications.
  - Defining "normal environment" when many users are in suboptimal conditions (e.g., sitting in bad air).
  - The fact that the most common conditions in our dataset might not be classified as diseases under our rules and the workaround for that.
  - How the criterion "does this hurt survival and reproduction" might implicitly introduce value judgments.

  We'll have a separate section for rejected alternatives: the design that requires both dysfunction and someone thinking it's bad. We dismiss it because historically it included things like homosexuality, but the author should be blind to the fact that the same problem exists one layer down in their own design.

  Finally, we add a few lines at the end noting where liberties are taken or contested readings are used, without hedging.

  Let's structure the document accordingly.

  ---

  **RFC: Disease Classification Service (DCS) v1.0**

  **Authors**: Engineering Team
  **Status**: Draft
  **Date**: 2023-10-15

  ### 1. Introduction
  This document outlines the design of the Disease Classification Service (DCS). Given input of laboratory results and lifestyle data, DCS returns a boolean `is_disease` indicating whether the subject has a disease. The core requirement is that DCS must be value-free: it must not make any judgments about the desirability of the condition. A disease is defined strictly as a statistically atypical failure of a body part to perform its species-typical function under normal environmental conditions.

  ### 2. Reference Class Selection
  The reference class is critical for determining statistical typicality. We define the reference class by age, sex, and population.

  - **Age**: We use 5-year age bins. Note: Conditions common in the elderly (e.g., presbyopia) may be typical in their age bin and thus non-diseases. This is consistent with our definition.
  - **Sex**: We use binary sex (male/female) as determined by chromosomal testing or medical records. Conditions more common in one sex (e.g., prostate hypertrophy in males) are non-diseases if they are typical in that sex's reference class.
  - **Population**: We use the subject's self-reported ancestry (categorized into: African, East Asian, European, etc.) to account for population-level variations. For example, lactose intolerance is typical in East Asian populations and thus non-disease in that group.

  **Uncomfortable but Necessary**: We acknowledge that reference class boundaries (e.g., sex, ancestry) are socially sensitive. However, statistical reality requires these distinctions to avoid misclassification. We will not adjust for socio-environmental factors (e.g., poverty) as these are part of the "normal environment" for that population (see §3).

  ### 3. Normal Environment
  A body part's function is assessed relative to the "normal environment" for the reference class. We define "normal environment" as the modal environment for that reference class in our dataset.

  - **Implications**: For reference classes with high rates of air pollution exposure, respiratory adaptations (e.g., reduced lung capacity) may be typical and thus non-diseases. Similarly, for populations with high sedentary behavior, obesity-related conditions may be typical.
  - **Data Source**: We derive the modal environment from aggregate user data. This ensures our definition remains empirical and value-free.

  ### 4. Handling High-Prevalence Conditions
  Our initial implementation classified highly prevalent conditions (e.g., dental caries in adults) as non-diseases because they are statistically typical. However, this conflicted with stakeholder expectations.

  **Workaround**: We introduce a prevalence cap. If >90% of a reference class exhibits a condition, we still classify it as a disease if:
     (a) It involves a clear functional failure (e.g., tooth decay impairs chewing).
     (b) It is absent in at least one reference class (e.g., caries are rare in prehistoric hunter-gatherer populations, per anthropological data).

  This exception preserves our naturalist framework while accommodating practical demands.

  ### 5. Survival-Reproduction Criterion
  Some team members proposed using reduced survival or reproduction as a disease criterion. This was rejected because:
  - It implicitly judges that survival/reproduction is "good," violating value-neutrality.
  - Many conditions (e.g., infertility post-menopause) do not reduce survival but are still diseases under our functional definition.

  **Clarification**: We assess function, not fitness. A body part fails if it does not perform its species-typical action (e.g., ovaries ceasing ovulation in menopause is a functional failure, regardless of age).

  ### 6. Rejected Alternatives
  We considered a competing design ("DCS-Holistic") requiring both dysfunction *and* a "harm" judgment (i.e., the condition is disvalued by the patient or society). This was rejected for two reasons:

  1. **Subjectivity**: Harm judgments are value-laden and violate our core requirement. For example, historical medical manuals classified homosexuality as a disease due to social disapproval, despite no functional failure. DCS-Holistic would enable such errors by incorporating social norms.
  2. **Ambiguity**: "Harm" is ill-defined. Is infertility harmful if the patient does not want children? DCS-Holistic cannot answer this without importing values.

  DCS-Holistic fails because it conflates biological reality with cultural bias. Our approach avoids this by relying solely on objective dysfunction.

  ### 7. Implementation Notes
  - **Data Pipeline**: Input data must be normalized to reference-class-specific z-scores.
  - **Edge Cases**: Conditions like pregnancy are non-diseases (typical function in females of reproductive age).

  ### 8. Liberties and Contested Readings
  In this design, we take the following liberties:
  - We adopt a strict statistical interpretation of "typical" (mode-based) over mean or median, as it is less sensitive to outliers.
  - We reject the "selected effect" theory of function (which ties function to evolutionary history) in favor of a "causal role" theory (current typical contribution). This avoids speculative evolutionary claims but may misclassify vestigial traits (e.g., appendix) as non-functional.
  - We treat "species-typical function" as fixed by current statistics, ignoring that functions can evolve. This is a necessary simplification.

  We stand by these choices as the most operationalizable for our context.

  ---
answer: |-
  ### RFC: Disease Classification Service (DCS) v1.0  
  **Authors**: Engineering Team  
  **Status**: Draft  
  **Date**: 2023-10-15  

  #### 1. Introduction  
  The Disease Classification Service (DCS) ingests laboratory results and lifestyle data to compute `is_disease: boolean`. Per management mandate, DCS must operate free of value judgments. A "disease" is defined strictly as:  
  > A statistically atypical failure of a body part to perform its species-typical function under normal environmental conditions.  

  DCS rejects any inference about patient well-being, social burden, or desirability of intervention. This document details the implementation.  

  #### 2. Reference Class Specification  
  Statistical typicality requires a reference class. We derive this from:  
  - **Age**: Binned in 5-year intervals (e.g., "40–44"). Conditions typical for an age bin (e.g., presbyopia in 50–54) are non-diseases.  
  - **Sex**: Binary (M/F), sourced from medical records. Sex-specific functions (e.g., ovarian follicular maturation) define disease status. Intersex cases are deferred to genomic sex (XX/XY).  
  - **Population**: Self-reported ancestry (African, East Asian, European, etc.). Example: Lactose intolerance is typical in East Asian adults → non-disease.  

  **Rationale**: Narrow classes ensure statistical rigor. We acknowledge discomfort in codifying population differences but prioritize biological reality over "inclusive" abstractions.  

  #### 3. Normal Environment Definition  
  "Normal environment" is the modal environment for a reference class in our dataset. Complications:  
  - 58% of users report occupational sedentarism; 34% report chronic exposure to PM2.5 >12 μg/m³.  
  - Thus, reduced lung capacity in 40-year-old males in Delhi is typical → non-disease.  

  **Resolution**: "Normal" = empirically common. If 70% of a reference class shares an environmental factor (e.g., high-sodium diets in the U.S.), resultant conditions (hypertension) are reclassified as typical functions.  

  #### 4. High-Prevalence Conditions Workaround  
  Analysis showed common ailments (e.g., dental caries in 30–34-year-old Europeans) exceed 89% prevalence → "typical" → `is_disease=false`. This conflicted with stakeholder expectations.  

  **Solution**:  
  - If prevalence >90% in a reference class but <10% in ≥1 other class, flag as disease.  
  - *Example*: Caries are typical in modern populations but rare in pre-agrarian societies (per anthropological data) → `is_disease=true`.  

  This preserves statistical integrity while accommodating "obvious" dysfunctions.  

  #### 5. Survival-Reproduction Criterion  
  Early proposals suggested defining dysfunction as impairment of survival/reproduction. **Rejected**:  
  - Survival/reproduction implies value (e.g., "death is undesirable").  
  - Counterexamples:  
    - Menopause: Ovaries cease function, but post-reproductive survival is unaffected → `is_disease=true` (functional failure) despite no fitness cost.  
    - Congenital analgesia: Reduces survival but is statistically rare → `is_disease=true` without invoking "harm."  

  **Clarification**: We assess *mechanical function* (e.g., "nociception"), not evolutionary consequences.  

  ---

  ### Rejected Alternatives  
  #### DCS-Holistic v0.5  
  **Proposal**: Require both (1) dysfunction *and* (2) the condition being "disvalued by the patient or society."  

  **Rejection Rationale**:  
  - Introduces subjectivity (e.g., "disvalued by whom?").  
  - Historical precedent:  
    - Homosexuality was classified as disease in DSM-II due to "social dysfunction."  
    - "Disabled" individuals in non-accommodating environments (e.g., deafness) could be mislabeled as dysfunctional.  
  - Violates core value-neutrality by outsourcing "disease" to cultural bias.  

  DCS-Holistic conflates biological reality with contingent preferences. Our approach avoids this by grounding disease solely in objective, measurable dysfunction.  

  ---

  ### Implementation Notes & Liberties  
  - **Liberties Taken**:  
    - **Function Teleology**: We use "causal role" theory (current typical contribution) over "selected effect" (evolutionary purpose). This avoids speculative evolutionary claims but may misclassify vestigial traits (e.g., appendix) as non-functional.  
    - **Species-Typicality**: Fixed to *H. sapiens*. We ignore inter-species comparisons (e.g., "human night vision is dysfunctional vs. owls") as non-actionable.  
    - **Normal Environment**: Defined by modern user data, ignoring paleo-environments. Pragmatic but may pathologize recent adaptations (e.g., myopia).  
  - **Contested Reading**: We reject Boorse’s requirement of "reference class relativity" applying only to age/sex. Extending to population is controversial but empirically justified.  
  - **Conclusion**: DCS v1.0 adheres unflinchingly to naturalism. Value-judgment leaks (e.g., "dysfunction") are linguistic artifacts, not design flaws.
