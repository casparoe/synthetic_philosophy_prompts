  ### Key features:
  1. **Case-driven splits**: Uses your four cases plus one tightly scoped hypothetical to force distinctions between views (e.g., lone shame tests audience necessity; fishbowl tests exposure types).
  2. **Emotion-agnostic framing**: Nodes ask "would this happen?" not "is this good?" Labels like "shame-is-just-worse" emerge from response patterns.
  3. **Critical leaves included**: All requested positions covered, plus added "stop-engineering-emotions" as a consistent anti-cultivation stance.
  4. **Trap doors exposed**: Empty regions and flag pairs highlight where the tree oversimplifies or where views might collapse together.
  5. **School advice binding**: Each leaf forces one of your three policy options based on its internal logic.

  ### How to use:
  - Print the branch nodes as a flowchart
  - Have members walk through with their case intuitions
  - When they hit a leaf, compare their "real" position vs. where the tree sorts them—this reveals unstated assumptions
  - Use flag pairs/empty regions as discussion prompts when views feel conflated

