  ### The Case: The Town Bell of Harmony Springs  
  Harmony Springs has one ceremonial town bell, forged in 1840. It rings only for major decisions, binding the community. After a fire, the bell must be relocated to one of four residents’ properties for safekeeping and use. The bell cannot be divided or replicated. The residents:  

  1.  **Cecilia (70):** Lifelong resident. Her grandfather cast the bell. She believes it "belongs" with her family’s history and adjusted her expectations over decades, training herself to find deep fulfillment *only* if the bell is hers—partly because she always assumed seniority/tradition would decide distributions. Her welfare depends heavily on *relative status*: if others get it, she feels diminished, even if given other honors.  
  2.  **Leo (40):** Moved here 15 years ago. He sees the bell as a practical tool for community alerts. Over time, expecting that "fairness" means prioritizing need, he deliberately cultivated contentment with a digital alarm system (which works fine), believing he’d never "deserve" the bell. But having it would spark genuine joy.  
  3.  **Maya (30):** Runs the town’s cultural center. The bell would draw visitors, funding workshops for marginalized youth. Without it, her center struggles but survives. She never expected to win it but sees it as key to expanding others’ opportunities.  
  4.  **Sam (55):** Lives on the isolated edge of town. The bell’s sound doesn’t carry to their home. They value it purely as art—a beautiful object for their garden. Getting it would bring quiet pleasure; not getting it causes mild disappointment. They have no adaptive preferences or comparative stakes.  

  The town council must award the bell to one person.  

  ---

  ### (a) The Three Recommendations (for class voting):  
  - **Recommendation A:** Give the bell to Cecilia. Her entire sense of purpose is tied to possessing it, and she reshaped her life around this expectation. Denying her would crush her in a way others’ losses wouldn’t, especially since she sees it as her rightful place.  
  - **Recommendation B:** Give the bell to Sam. They start with the least access to communal assets due to their location, and they bear no responsibility for the inflated desires or social projects of others. Their claim is based on sheer possession, not symbolism.  
  - **Recommendation C:** Give the bell to Maya. It becomes a tool to unlock abilities for many—transforming her center from surviving to thriving. For her, it’s not about personal satisfaction but enabling new freedoms for the community.  

  ---

  ### (b) Objections and Effective Replies:  
  **For Recommendation A (Welfare View):**  
  - *Objection:* "This rewards Cecilia for unreasonably narrowing her happiness to one thing and feeling entitled. Why cater to someone who refuses to adapt?"  
  - **Effective Reply:** "The view doesn’t judge how preferences *formed*—only how well lives *actually go*. Cecilia’s pain if denied is real and profound, far exceeding others’ gains. Her comparative distress is part of her welfare. Ignoring it because she ‘chose’ it undermines the goal: equalizing how lives go *for them*."  

  **For Recommendation B (Resources View):**  
  - *Objection:* "Sam gets it just for having less? But they don’t even value the bell’s purpose! This wastes a community resource on private decoration."  
  - **Effective Reply:** "Resources focuses on equalizing *external means*, not how people use them. Sam has fewer advantages (remoteness limits their access to town assets), and they’re not responsible for others’ projects or cultivated dependencies. The bell is a resource; who ‘uses it best’ is irrelevant—it’s about fair starting points."  

  **For Recommendation C (Capabilities View):**  
  - *Objection:* "Maya’s ‘capabilities’ depend on vague community effects. Why should one person’s social project outweigh personal needs?"  
  - **Effective Reply:** "Capabilities isn’t about personal satisfaction or resources—it’s about what people *can do and be*. Maya’s use of the bell directly expands concrete freedoms (education, inclusion) for many, not just her. Giving it to her converts an object into real opportunities—the core goal."  

  ---

  ### (c) The Hinge of Disagreement:  
  All three views react differently to **how the bell’s symbolic value translates into advantage**.  
  - The **welfare view** sees the bell’s value *as its contribution to subjective satisfaction*. For Cecilia, it’s irreplaceable for her well-being due to her adaptive expectations and comparative stakes. Leo’s trained contentment reduces his claim. Sam and Maya’s milder stakes matter less.  
  - The **resources view** treats the bell *as a neutral external object*. Cecilia’s history and Maya’s plans are irrelevant—they’re responsible for their ambitions. Only Sam’s deficit in tangible assets (remoteness) justifies redistribution, equalizing their "holdings."  
  - The **capabilities view** values the bell *for expanding substantive freedoms*. Maya’s use creates new abilities for others (e.g., marginalized youth gaining skills). Cecilia’s ownership only affects her status—a "feeling" not a freedom. Leo’s contentment doesn’t erase the bell’s potential to foster capabilities.  

  The divergence traces to each view’s core purpose: Welfare equalizes felt experiences; resources equalize chosen bundles; capabilities equalize effective opportunities.  

  \answer{how symbolic value converts into advantage}
