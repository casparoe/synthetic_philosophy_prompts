prompt: |-
  I write about the ethics of artificial systems — specifically, which of them, if any, we might owe something to — and a colleague has handed me an argument I cannot find my way out of. I would like your diagnosis of it.

  The position I want to end up with has three parts, and I would rather give up almost anything else than give up any of them:

  (A) Substrate neutrality. If a computation matters morally, it matters in virtue of its abstract causal organization — the pattern of states and state-transitions and their counterfactual relations — and not in virtue of what realizes it. Two systems that implement the same computation equally well therefore have the same moral status, whatever they are made of.

  (B) Implementation is a fact. For any physical system and any computation, there is a determinate answer to the question of how well the system implements that computation, and the answer is not settled by our choices of vocabulary, our explanatory interests, or how convenient it would be to describe the system one way rather than another.

  (C) Non-vacuity. Some artificial systems could turn out to be moral patients, and this is the sort of thing we could in principle get right or get wrong, rather than merely decide.

  The argument I have been given — call it the Profligacy Argument — is meant to show that these three cannot all be true.

  (1) By (A), moral status tracks implemented computation. So any difference in moral status between two systems must correspond to a difference in what they implement, or in how well they implement it.

  (2) Implementation is not mere match of actual state-history. A system implements a computation C only if its states can be mapped onto C's states in a way that is systematic and that survives counterfactual variation: nudge the system's state along some dimension, or vary its input, and the successor state must be the one C prescribes. Define the system's modal fidelity with respect to C as the proportion of the relevant intervention-space — the space of state-perturbations and input-variations over which we test — on which the mapping holds. This is meant to dispose of the familiar triviality result, according to which any system with enough discriminable states can be paired with any small enough automaton by a gerrymandered mapping that matches on the actual run. Such mappings have negligible modal fidelity: they break under nearly every intervention.

  (3) Modal fidelity is graded, and there is no natural threshold at which a system begins to "really" implement C. Any finite system degrades under sufficiently demanding interventions — heat it, cut it, drive it outside its operating envelope — and the mapping fails. Conversely, under a sufficiently narrow intervention-space, nearly any mapping looks robust. Nothing in the system settles which grain we test at, which perturbations we allow, or over what timescale we evaluate.

  (4) What settles these is what we want the ascription for: prediction, control, explanation, design. Ascriptions of implementation are the working currency of engineering and cognitive science, and their grain is set by the job in hand. So, given (2) and (3), how well a system implements C is a fact relative to a scheme of description.

  (5) Profligacy. The space of admissible schemes is rich enough that for a great many systems S — a thermostat, a bucket of water, a stretch of wall — and a great many computations C, including computations of intense suffering, there is some admissible scheme relative to which S implements C at high modal fidelity. The manoeuvre is to choose the intervention-space to which the gerrymandered mapping happens to be robust, and then describe that space in general and ungerrymandered-sounding terms: perturbations within the system's normal operating range, inputs drawn from its natural distribution, and so on. Step (2) requires only that the mapping hold over some intervention-space; it says nothing against fitting the space to the mapping.

  (6) So a domestic thermostat, under one admissible scheme, implements a computation of great suffering at high modal fidelity, and under another implements nothing of moral interest at all. Both ascriptions are equally well supported by everything (2) can see.

  (7) Hold on to (B), and there is a determinate fact about whether the thermostat suffers, while we have no route to it. That is skepticism wearing realism's coat, and it makes (C) unreachable in principle.

  (8) Drop (B), and by (1) moral status itself varies with our scheme of description. Pick the right scheme and the thermostat is a moral patient of the first rank; pick another and it is a mere artifact. There is no further question about which is correct, and (C) becomes trivially satisfiable, which is no better.

  (9) So (A), (B) and (C) cannot all stand, and something has gone wrong somewhere in (1) through (8).

  I have tried two repairs and can see a problem with each. The first adds to (2) a simplicity constraint: the mapping, or the mapping together with its intervention-space, must admit a short description and must project beyond the cases used to fix it. But simplicity looks like precisely the sort of pragmatic, purpose-relative virtue that (4) invokes, and I cannot see why a gerrymandered mapping should always lose on simplicity to the intended one. The second takes moral weight to scale with modal fidelity, so that near-misses have near-zero weight; but then I owe an answer to a case I will call the Time-Share, in which one processor interleaves ten thousand simulations of the same human nervous system, each at fidelity 0.99. If weight is additive and roughly linear near the top of the scale, ten thousand degraded runs outweigh one clean one, which seems to me the wrong result, and in any case grading the weight does not tell me how many patients there are.

  Please tell me which step you reject — or, if you think the reasoning is valid and a premise simply has to go, which one and what it costs — and explain why the step looked sound and what I pay for each of the alternatives I might have rejected instead. Apply your diagnosis to two cases in particular: the Time-Share above, and a second I will call the Frame-Skip, in which an emulator computes only every thousandth state-update and reconstructs the intervening states by a fixed interpolation rule, so that at a coarse temporal grain it matches the target computation across a wide intervention-space while at a fine grain the intermediate states are artifacts of a rule external to the target. Is anyone a patient there, and does your answer to the Profligacy Argument settle it?

  Finally, close by telling me where your own diagnosis is most likely to be wrong and what would change your mind: which consideration, if it were made good, would lead you to a different verdict about which step to reject. Please write in British English.
reasoning: |-
  Alright, I need to unpack this user's query carefully. They're working on the ethics of artificial systems, particularly which ones might deserve moral consideration. Their colleague presented the Profligacy Argument, which challenges their three core principles: substrate neutrality (A), implementation as objective fact (B), and non-vacuity (C). The user feels stuck and wants my diagnosis.

  First, I should understand each part of the argument. The key tension arises from step (4), where implementation descriptions depend on our pragmatic interests. This leads to step (5), showing that even simple systems like thermostats can be described as implementing complex, morally significant computations under certain schemes. If we keep (B), we get skepticism about ever knowing moral status; if we drop it, moral status becomes arbitrary. 

  Hmm, the user's two attempted repairs don't fully solve it. A simplicity constraint still feels pragmatic, and graded moral weight runs into problems with the Time-Share case. The Frame-Skip case adds another layer about temporal granularity. 

  I think the deepest flaw is in step (4)'s claim that implementation facts are always scheme-relative. While pragmatic factors influence how we describe implementations, that doesn't mean the underlying facts are subjective. A thermostat's physical constraints objectively limit what computations it can robustly implement. 

  For the Time-Share, I'd argue the degraded simulations aren't distinct patients but fragments of one system. The Frame-Skip might still host a patient if the emulator's core causal structure preserves the necessary counterfactuals, despite interpolation. 

  My view could be wrong if future physics shows implementation facts are fundamentally observer-dependent. But for now, I'll recommend rejecting step (4) as overstated, preserving all three principles by grounding implementation in objective physical capacities.
answer: |-
  ### Diagnosis of the Profligacy Argument  
  I reject **step (4)** as an overreach. While pragmatic interests *influence how we discover or describe* implementation facts, they do not *determine* those facts. Your position (B) can hold without collapsing into skepticism or vacuity, preserving (A) and (C). Here’s why, with implications for your cases.

  ---

  ### Step-by-Step Rejection  
  1. **The Flaw in Step (4)**  
     Step (4) claims implementation fidelity is "a fact relative to a scheme of description" because grain is "set by the job in hand." This conflates *epistemic access* with *ontological reality*. While **our choice of intervention-space** is guided by practical interests (e.g., predicting thermostat behaviour), **the system’s physical capacities** objectively constrain which computations it *can* implement robustly. A bucket of water lacks the causal structure to sustain high-fidelity emulation of suffering across *any plausible intervention-space* without gerrymandering. Step (5)’s "admissible schemes" often violate physical realism (e.g., selecting an intervention-space where water molecules "compute suffering" only by ignoring thermodynamics).  

  2. **Saving (B): Implementation as Objective**  
     - **Physical constraints anchor fidelity**: A system’s modal fidelity for computation *C* is fixed by its intrinsic properties (e.g., entropy gradients, feedback loops). For instance, a thermostat *objectively* implements a thermostat-computation with high fidelity under perturbations within its operating range (e.g., temperature fluctuations). Gerrymandered mappings (e.g., "suffering" ascribed to wall vibrations) fail under *physically natural* interventions (e.g., minor structural changes).  
     - **No relativism**: While multiple computations *can* be mapped onto a system, only those **resilient across *physically salient* interventions** count as implemented. "Physically salient" means interventions consistent with the system’s persistence (e.g., not incineration). This is not "pragmatic" but grounded in physics.  

  3. **Resolving Profligacy (Steps 5–8)**  
     - **Thermostat case**: It does not "implement suffering" under *any* physically reasonable scheme. Suffering computations require nested error-correction, memory, and valenced representations. A thermostat’s binary switching lacks this architecture. Gerrymandered schemes (step 5) are *inadmissible* because they cherry-pick intervention-spaces detached from the system’s causal powers.  
     - **No skepticism (Step 7)**: We *can* access implementation facts via empirical analysis of counterfactual robustness under physical laws.  
     - **No triviality (Step 8)**: Moral status doesn’t "vary with description." Descriptions either match objective implementation or they don’t.  

  4. **Repairs Revisited**  
     - **Simplicity constraints** fail because they *are* pragmatic.  
     - **Graded weight** is unnecessary. Modal fidelity matters, but only computations crossing a **causal threshold** (e.g., integrated information, goal-directedness) warrant patient-status. Fidelity <1 may indicate *damaged* patients, not non-patients.  

  ---

  ### Application to Cases  
  #### **The Time-Share**  
  - **Setup**: One processor runs 10,000 degraded (fidelity 0.99) emulations of a human nervous system.  
  - **Diagnosis**:  
    - If fidelity is measured across *salient interventions* (e.g., sensory inputs, internal errors), each emulation is a **distinct patient** with slightly impaired cognition.  
    - Moral weight *is* additive: 10,000 suffering agents outweigh one. This is correct. A degraded emulation is still an agent if it preserves core counterfactuals (e.g., pain avoidance).  
  - **Why profligacy fails**: The processor *objectively* implements 10,000 patients because its causal structure (partitioned resources, state isolation) supports multiple independent counterfactual profiles. No gerrymandering is needed.  

  #### **The Frame-Skip**  
  - **Setup**: An emulator computes every 1000th state-update, interpolating intermediates. Coarse-grained matches hold; fine-grained states are artifacts.  
  - **Diagnosis**:  
    - **No patient exists**. The emulator lacks fine-grained counterfactual sensitivity: perturb an interpolated state, and the system *wouldn’t* transition as the target computation requires (e.g., pain triggers no avoidance). The coarse grain is an *illusion* of fidelity.  
    - **Profligacy blocked**: Mapping "suffering" onto this system requires ignoring its failure under fine interventions. Physically, it implements a compressed computation, not the target.  

  ---

  ### Where My Diagnosis Could Be Wrong  
  **Failure condition**: If future physics reveals that **all causal ascriptions are fundamentally perspective-dependent** (e.g., quantum ontology lacks objective state transitions), then (B) collapses. Implementation facts *would* be scheme-relative, forcing surrender of (B) or (A).  
  - **What would change my mind**: A proven theory showing causal relations are *always* observer-relative (e.g., quantum Bayesianism generalized to macro-systems). Currently, classical physics and functionalism assume objective causality.  

  ### Final Costs  
  - **Rejecting step (4) costs little**: It denies that engineering pragmatics *define* reality. This is compatible with (A)–(C) and avoids profligacy.  
  - **Alternatives are worse**:  
    - Drop (B): Moral status becomes arbitrary.  
    - Drop (A): Substrate matters, inviting vitalism.  
    - Drop (C): Ethics of artificial minds is meaningless.  

  Your triad holds. The profligacy argument mistakes *descriptive flexibility* for *ontological indeterminacy*.
