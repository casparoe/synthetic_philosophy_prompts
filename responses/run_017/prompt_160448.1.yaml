  residual_risks: "1) Strategic voting may still occur, especially if members anticipate the disqualification step and manipulate rankings to eliminate rivals. 2) The Borda count's sensitivity to candidate withdrawals (violating IIA) could cause last-minute reversals if a candidate withdraws after balloting. 3) The disqualification threshold (majority) might be too high if the field is large, allowing a candidate with significant but not majority opposition to win. 4) Hand-counting, while feasible, may be error-prone; the administrator should be provided clear instructions and sample counts."

  Draft memo:

  ---

  **MEMORANDUM**

  To: Rules Committee  
  From: [Your Name]  
  Date: March [Date], 2024  
  Subject: Recommendation for Presidential Election Method  

  This memo addresses our charge to recommend a method for electing the President and Vice-President from ranked ballots. After careful consideration of the challenges in the last election and the four requirements agreed by the committee, I recommend adopting a **Borda count with a pre-processing step to disqualify candidates ranked last by a majority of voters**. This method balances our requirements while being hand-computable in an afternoon and explainable to the membership.  

  ### Key Features of the Method  
  1. **Disqualification Step**: Any candidate ranked last by more than half the voters (e.g., >600 of 1,200 ballots) is removed from consideration. This ensures no candidate widely opposed can win, satisfying requirement (iv).  
  2. **Borda Count**: On the remaining candidates, points are assigned based on rankings: top-ranked gets \( k-1 \) points, second \( k-2 \), ..., last 0, where \( k \) is the number of remaining candidates. The candidate with the highest total points becomes President; the runner-up, Vice-President.  

  This method meets requirements (i) (unanimity) and (iii) (non-dictatorship) and, with the disqualification step, (iv). However, it sacrifices requirement (ii) (independence of irrelevant alternatives), meaning the withdrawal of a candidate could alter the relative order of others. We accept this because:  
  - Arrow’s Impossibility Theorem proves no system can satisfy (i), (ii), and (iii) simultaneously for three or more candidates.  
  - The legitimacy of the outcome depends more on avoiding majority-opposed winners (addressed by (iv)) and respecting unanimous preferences than on IIA.  
  - The last election’s withdrawal incident was anomalous; the disqualification step reduces the risk of such events by eliminating polarizing candidates early.  

  ### Addressing Committee Concerns  
  - **Member 1’s Bolt-On Proposal**: We endorse this as the disqualification step. It is computationally simple and directly enforces (iv).  
  - **Member 2’s Single-Axis Argument**: While ideal, the committee confirms two cross-cutting cleavages (seniority and meeting format). Without verifiable unidimensionality from ballots alone, this argument is not actionable.  
  - **Member 3’s Impossibility Concern**: Valid, but does not preclude improvement. We sacrifice IIA (the least critical requirement) to achieve the others.  

  ### Risks and Mitigations  
  - **Strategic Voting**: The disqualification step discourages "ranking rivals last" by making it a potential veto, but insincere middle rankings may persist. We accept this as a trade-off for simplicity.  
  - **Hand-Counting Feasibility**: The method requires two passes: one to tally last-place votes, and one to assign Borda points. With 1,200 ballots and a typical field of 3–6 candidates, this is manageable in an afternoon.  
  - **Withdrawal Instability**: If a candidate withdraws after balloting, a full recount without that candidate is required. We can mitigate by requiring withdrawals before counting begins.  

  ### Recommendation  
  I move that the committee recommend the attached method to the Council. The system is transparent, upholds core democratic principles, and rectifies the most egregious failure of the last election.  

