  ### MEMORANDUM  
  **To:** Rules Committee, Learned Society  
  **From:** [Your Name], Rules Committee Member  
  **Date:** March 2024  
  **Subject:** Recommendation for Presidential Election Method Reform  

  ---

  #### **Background and Problem Statement**  
  Our society requires a robust, transparent method to elect the President and Vice-President from ranked ballots. Last year’s election revealed critical flaws: a winner opposed by a majority assumed office, and a candidate’s post-ballot withdrawal reversed outcomes. We must adopt a method that is (a) hand-computable in an afternoon (~1,200 ballots), (b) explainable in a paragraph, and (c) produces a full finishing order. The committee’s four core requirements are:  
  - **(i) Unanimity:** If all voters rank A above B, B cannot finish above A.  
  - **(ii) IIA (Independence of Irrelevant Alternatives):** Withdrawing a candidate must not reverse the relative order of others.  
  - **(iii) Non-Dictatorship:** No single ballot dictates the outcome.  
  - **(iv) Majority Non-Last:** No candidate ranked last by a majority may hold office.  

  Member arguments highlight tensions:  
  - **Member 1** suggests enforcing (iv) via a disqualification vote before ranking.  
  - **Member 2** claims preferences align on a single axis (junior/senior), implying majority rule suffices.  
  - **Member 3** cites Arrow’s Theorem (no system satisfies (i)–(iii) simultaneously) and advises abandoning reform.  

  After rigorous analysis, I recommend a **modified Borda Count with a disqualification step**. This method meets (i), (iii), and (iv), but sacrifices (ii), as justified below.  

  ---

  #### **Recommended Method: Modified Borda Count**  
  **Bottom Line:** Adopt a Borda Count with a pre-processing step to disqualify candidates ranked last by >50% of voters, ensuring broad legitimacy while accepting that candidate withdrawals may alter outcomes.  

  **Method Specification (Hand-Computable in an Afternoon):**  
  1. **Disqualify unpopular candidates:** Tally last-place rankings for each candidate. Disqualify any candidate ranked last by >50% of voters (e.g., >600 ballots).  
  2. **Assign Borda points:** For each ballot, award points to remaining candidates:  
     - 1st place: \( n-1 \) points,  
     - 2nd place: \( n-2 \) points,  
     - ...  
     - Last place: \( 0 \) points,  
     where \( n \) = number of remaining candidates.  
  3. **Sum points:** Calculate each candidate’s total points across all ballots.  
  4. **Determine finishing order:** Rank candidates by descending point totals (President: highest; VP: second-highest; etc.). Tiebreak using most first-preferences, then second, etc.  

  **Example:** With 5 candidates and 1,200 ballots:  
  - Step 1: If Candidate X is last on 700 ballots, disqualify X.  
  - Step 2: For each ballot, assign points (3, 2, 1, 0) to the remaining 4 candidates.  
  - Step 3: Sum points. The highest scorer wins President.  

  **Explainability (One Paragraph):**  
  > "Voters rank candidates. Anyone placed last by most voters is eliminated. For the rest, points are awarded based on rankings: higher ranks get more points. The candidate with the most points becomes President; the runner-up becomes Vice-President. This ensures winners have broad support and no one widely opposed can win."  

  ---

  #### **Analysis of Requirements and Sacrifices**  
  | **Requirement** | **Status** | **Justification** |  
  |-----------------|------------|-------------------|  
  | **(i) Unanimity** | Met | If all rank A above B, A always receives more Borda points. |  
  | **(ii) IIA** | **Sacrificed** | **Withdrawing a candidate changes point distributions, potentially reversing orders (e.g., last year’s incident). Arrow’s Theorem forces this sacrifice; retaining (i) and (iii) is prioritized.** |  
  | **(iii) Non-Dictatorship** | Met | No single ballot can override the collective point sum. |  
  | **(iv) Majority Non-Last** | Met | The disqualification step enforces this. |  

  **Why Sacrifice IIA?**  
  - Arrow’s Theorem proves that no system can satisfy (i), (ii), and (iii) for ≥3 candidates. We sacrifice IIA because:  
    1. **Unanimity (i) is foundational** to democratic legitimacy.  
    2. **Non-dictatorship (iii) is non-negotiable** for fairness.  
    3. **IIA (ii) is the least critical** in practice; withdrawals are rare, and the disqualification step mitigates worst-case reversals by eliminating polarizing candidates early.  
  - **Cost of Sacrifice:** If a candidate withdraws post-balloting, a recount may alter outcomes. We accept this as a marginal risk (occurring once in our history) to preserve core principles.  

  ---

  #### **Evaluation of Member Arguments**  
  1. **Disqualification "Bolt-On" (Member 1):**  
     - **Verdict: Sound and adopted.** This efficiently enforces (iv). Pre-processing disqualification is hand-computable (tally last-place votes once) and aligns with our goal of preventing widely opposed winners.  

  2. **Single-Axis Argument (Member 2):**  
     - **Verdict: Unverifiable and unreliable.** While preferences *may* align on a junior/senior axis, the committee confirms a second cleavage (in-person vs. remote meetings) that cuts across it. Crucially, **ballots alone cannot prove unidimensionality**—rankings may reflect hidden dimensions. Relying on this risks repeating 2023’s failures if axes diverge. Majority rule (e.g., Condorcet) is fragile without verified alignment.  

  3. **Arrow’s Theorem Concern (Member 3):**  
     - **Verdict: Valid but not fatal.** Arrow’s Theorem *does* preclude satisfying all of (i)–(iii), but we strategically sacrifice IIA to meet higher-priority goals. Abandoning reform ignores tangible problems (e.g., majority-opposed winners).  

  ---

  #### **Strongest Argument Against Borda**  
  > "Borda is vulnerable to strategic voting: members may insincerely rank weak rivals higher to boost their preferred candidate’s points, or rank strong rivals last to trigger disqualification."  
  **Rebuttal:** While true, the disqualification step reduces incentives for "ranking rivals last" (doing so could inadvertently eliminate a compromise candidate). Hand-counting simplicity and enforceability of (iv) outweigh this risk.  

  ---

  #### **Residual Risks**  
  1. **Strategic voting:** Members may manipulate rankings to influence disqualification or point totals.  
  2. **IIA vulnerability:** Post-withdrawal recounts may alter results.  
  3. **Tiebreaking complexity:** Close races may require meticulous hand-counting of preferences.  
  **Mitigation:** Require withdrawals before counting begins; audit random ballots for counting errors.  

  ---

  #### **Recommendation**  
  **Move to adopt the modified Borda Count method described above.** This approach maximizes fairness, transparency, and legitimacy while operating within practical constraints. The cost of sacrificing IIA is justified by preserving unanimity, non-dictatorship, and majority consent—cornerstones of our society’s values.  

  ---

