prompt: |-
  I sit on the rules committee of a learned society of about 4,000 members, and we must recommend a single method for electing our president and vice-president from the ranked ballots members already return (roughly 1,200 ballots, counted by hand by one part-time administrator, so whatever we adopt must be hand-computable in an afternoon and explainable in a paragraph to the membership). Because one ballot fills both offices, the method has to produce a finishing order, not merely a winner.

  Two things went wrong last time. The winner took the presidency on 31% of first preferences while being placed last by a clear majority of those who voted, and the council has spent the year working with someone most of the electorate actively opposed. Then a candidate withdrew after balloting to take a post elsewhere; when we removed him and recounted, the relative order of the two remaining front-runners reversed and the vice-presidency changed hands. Several members have also admitted, privately, to ranking a strong rival last on purpose.

  The committee has agreed on four requirements: (i) if every voter ranks A above B, B must not finish above A; (ii) the relative finishing order of any two candidates must not change when a third candidate withdraws; (iii) no single member's ballot may determine the outcome regardless of everyone else's; (iv) no candidate placed last by a majority may hold either office. One member says (iv) can be bolted on as a separate disqualification vote held before the ranking is computed, and that this gets us out of our difficulty. A second says the difficulty never arises: our disagreements, he claims, line up along a single axis, junior versus senior, and along one axis plain majority rule behaves perfectly. (Others on the committee reply that a second cleavage — whether the annual meeting stays in person — now divides us as sharply as the first, and cuts across it.) A third member says he vaguely recalls a proof that no system can meet all four and that we should abandon the rewrite.

  Draft the memo I will circulate before the March meeting. It should recommend one concrete method, or recommend against any rewrite, in terms the committee can vote on; take all three members' arguments seriously; and state plainly which of the four requirements we are sacrificing, and why the cost is best borne there rather than elsewhere.

  After the memo, append a JSON object with exactly these fields: recommendation (one-sentence bottom line), method_specification (how the method is actually computed from the ballots), requirements_met (list), requirements_sacrificed (list, each with one clause of justification), strongest_argument_against (the best case for the losing side), verdict_on_disqualification_veto (assess the bolt-on proposal), verdict_on_single_axis_argument (assess the second member's escape route, including whether it can be checked against the ballots we hold), and residual_risks.
reasoning: |-
  We are facing a complex electoral problem with specific constraints and requirements. Let me break down the situation and the requirements.

  The society has about 4,000 members, but only 1,200 ballots are returned. The counting is done by hand by one part-time administrator and must be done in an afternoon. The method must be explainable in a paragraph and produce a finishing order (since one ballot fills both offices).

  Problems from last election:
  1. The winner became president with only 31% of first preferences and was ranked last by a clear majority.
  2. When a candidate withdrew, the relative order of the two front-runners reversed, changing the vice-presidency.
  3. Some members strategically ranked a strong rival last.

  Requirements agreed by the committee:
  (i) Unanimity: If every voter ranks A above B, then B must not finish above A.
  (ii) Independence of irrelevant alternatives (IIA): The relative order of any two candidates must not change when a third candidate withdraws.
  (iii) Non-dictatorship: No single member's ballot may determine the outcome regardless of others.
  (iv) Majority non-last: No candidate placed last by a majority may hold office.

  Arguments by members:
  - Member 1: Suggests adding (iv) as a separate disqualification vote before the ranking.
  - Member 2: Claims that disagreements are along a single axis (junior vs. senior) and majority rule would work. But others say there's a second cleavage (annual meeting format) that cuts across the first.
  - Member 3: Recalls a proof that no system can meet all four and suggests abandoning the rewrite.

  We must recommend a concrete method or against any rewrite, and state which requirement we sacrifice and why.

  Arrow's Impossibility Theorem: It states that no rank-order electoral system can simultaneously meet (i), (ii), and (iii) when there are three or more candidates. Therefore, we cannot have all of (i), (ii), and (iii). Requirement (iv) is an additional constraint.

  Given that we must sacrifice one, which one?

  We note that (iii) non-dictatorship is non-negotiable for a fair election. (i) unanimity is also fundamental. (ii) IIA is the one that we might sacrifice because it is the one that caused the problem when a candidate withdrew and the order reversed.

  But requirement (iv) is also important. However, note that (iv) may be achievable by a bolt-on as suggested by member 1.

  We must choose a method that is hand-countable in an afternoon.

  Options:
  1. Instant-runoff voting (IRV) for single winner, but we need a finishing order. We could use IRV to elect the president and then re-run without the president to elect the vice-president? But that would be two separate counts and might violate IIA and also the withdrawal problem occurred when removing a candidate.

  However, we want a single finishing order for both offices.

  2. Borda count: Assign points for each rank (e.g., 1st: n-1 points, 2nd: n-2, ..., last: 0). Then sort by total points. This method:
     - Satisfies (i): If everyone ranks A above B, then A gets more points than B.
     - Does not satisfy (ii): Withdrawing a candidate can change the relative order of two others because the points depend on the number of candidates.
     - Satisfies (iii): It's not a dictatorship.
     - Does not guarantee (iv): A candidate could be last on a majority of ballots but still have a high overall score if they are ranked high by a minority.

  But we can add the bolt-on for (iv): Before the Borda count, we can check each candidate to see if a majority ranked them last. If so, they are disqualified and removed from the ballots. Then run the Borda count on the remaining candidates.

  However, note that the bolt-on might cause its own issues. For example, if we remove a candidate, then the Borda scores of others change. But we are only removing candidates who are last by a majority, so that might be acceptable.

  But requirement (ii) is still sacrificed. We know that because of Arrow, we must sacrifice either (i), (ii), or (iii). We are keeping (i) and (iii) and sacrificing (ii).

  Is there a method that meets (ii)? The only methods that meet (ii) and (i) and (iii) are dictatorships, which we don't want. So we must sacrifice (ii).

  Alternative: Condorcet method. But Condorcet methods are complex to hand count because they require pairwise comparisons (which for n candidates is n*(n-1)/2 comparisons). With, say, 5 candidates, that's 10 comparisons, each of which requires going through 1200 ballots. That might be too time-consuming for an afternoon.

  We need a method that is simple to count.

  So Borda with the bolt-on for (iv) might be acceptable.

  But note: the problem with the withdrawal of a candidate was that the order reversed. In Borda, that can happen. So we are explicitly sacrificing (ii).

  Another option: Plurality with runoff for the presidency and then a separate vote for vice? But that would require two ballots? We are using ranked ballots already.

  But we have one ballot for both.

  We want one finishing order.

  Alternatively, we could use a single transferable vote (STV) for two seats? But that produces a set of winners, not a full order. We need a full order because the first becomes president and the second vice-president.

  STV for two seats: We count by eliminating candidates and transferring votes until two are elected. But we don't get an order beyond the first two. We need a full order.

  So that doesn't work.

  We could use a ranked-choice method that provides a full ranking, like the Borda count.

  What about the single axis argument? If the society is truly one-dimensional, then majority rule works well and we could use the Condorcet method, which would be the median voter. But the committee says there are two cleavages, so it's not one-dimensional. Moreover, we cannot check the one-dimensionality from the ballots alone because we don't know the underlying dimensions. We only have the rankings.

  So we cannot rely on that.

  Therefore, I propose:

  Method: Borda count with a pre-processing step that disqualifies any candidate who is ranked last by a majority of voters.

  Steps:
  1. For each candidate, count the number of ballots that rank them last. If that number is greater than half the ballots (i.e., >600), then that candidate is disqualified and removed from all ballots.
  2. On the remaining candidates, assign points: for a ballot with k remaining candidates, the candidate ranked first gets k-1 points, second gets k-2, ... last gets 0.
  3. Sum the points for each candidate.
  4. The candidate with the highest total is president, the next vice-president, and so on for the finishing order.

  Why Borda?
  - It meets (i): If everyone ranks A above B, then A has a higher Borda score.
  - It meets (iii): Not a dictatorship.
  - We sacrifice (ii): Withdrawing a candidate can change the order. But we are already removing some candidates in the pre-processing, and if a candidate withdraws after the election (like last time) we would have to re-run without that candidate, which might change the order. However, we note that the pre-processing step removes only candidates that are last by a majority. In the event of a withdrawal after the ballots are cast, we would re-run the entire process without that candidate (including the disqualification step again? or without?).

  But the requirement (ii) is about any withdrawal, but we are only concerned about withdrawals that happen after the ballots are cast? The problem last time was that a candidate withdrew after the balloting. So we must have a system that is robust to that. But with Borda, if a candidate withdraws after the ballots, we have to recast the ballots without that candidate and recompute. And that may change the order.

  We are accepting that as a sacrifice.

  Now, the bolt-on for (iv): We are using it. So we meet (iv) by design.

  Now, the strongest argument against: The Borda count is susceptible to strategic voting. For example, a voter might rank a strong rival last (which we already saw) but also might manipulate the middle ranks to harm a candidate. However, in our case, we are already seeing strategic last-place ranking, and the bolt-on step might help by disqualifying a candidate that is too polarizing (if they are last by a majority). Also, the Borda count is simple to compute.

  Alternative: Copeland's method? But again, pairwise comparisons are complex.

  Time for hand counting: For Borda, we only need to go through each ballot once per candidate? Actually, we can preprocess: for each ballot, we note the ranks. Then for each candidate, we assign the points. Then sum. The disqualification step: we go through each ballot and note the last place. Then for each candidate, we count the number of times they are last. Then remove those who are last by majority. Then reassign points for the remaining candidates on each ballot.

  This is doable in an afternoon.

  Now, the JSON:

  recommendation: We recommend adopting the Borda count with a pre-processing step that disqualifies any candidate ranked last by a majority of voters.

  method_specification: 
  1. Count the number of ballots that rank each candidate last. Disqualify any candidate for whom this count exceeds half the total ballots (i.e., >600 for 1200 ballots).
  2. Remove disqualified candidates from all ballots, and reassign ranks accordingly (so that each ballot has a complete ranking of the remaining candidates).
  3. For each ballot, assign points to the remaining candidates: the top-ranked candidate gets points equal to the number of remaining candidates minus one, the next gets one less, and so on, down to the last who gets zero.
  4. Sum the points for each candidate across all ballots.
  5. The candidate with the highest total is elected president, the next vice-president, and so on to form a complete finishing order.

