answer: |-
  Below is a comprehensive design for your futarchy classroom game, optimized for 75 minutes, paper-and-pencil execution, and your pedagogical goals. The structure ensures students experience information aggregation, reflexivity, and metric gaming before the mechanism is named or critiqued.

  ---

  ### **Decision and Welfare Metric**  
  - **Decision**: "How should we allocate the final 10 minutes of today’s session?"  
  - **Policies**:  
    - **Policy A**: "Lightning Talks" (2 randomly selected students give 30-second summaries of key concepts).  
    - **Policy B**: "Q&A" (open-floor questions answered by the professor).  
  - **Welfare Metric**: "Engagement Score" = Average self-reported engagement (1–10 scale) from all students + (2 × Effort Player scores).  
    - *Why*: Self-reported engagement is easily gameable and influenced by reflexive actions. Effort Players (assigned roles) have double weight to amplify their impact, making reflexivity visible.

  ---

  ### **Trading Mechanism (Paper-Based)**  
  **Setup**:  
  - **Two Conditional Markets**:  
    - **Market A**: Trades "shares" tied to Policy A’s engagement score.  
    - **Market B**: Trades "shares" tied to Policy B’s engagement score.  
  - **Shares**: Contracts paying **1 point per unit of engagement score** if the policy is implemented; 0 otherwise.  
  - **Currency**: "Trade Tokens" (TT). Each student gets 10 TT at the start.  

  **Trading Process** (25 minutes total):  
  1. **Opening Markets** (5 min):  
     - Hang two posters: "Market A" and "Market B."  
     - Each poster lists:  
       - Current price (start at 5.0 for both).  
       - Bid/ask log (students write trades directly).  
     - **Price Adjustment Rule**: After each trade, adjust price by ±0.1 (buy → +0.1, sell → −0.1).  
  2. **Trading Phase** (15 min):  
     - Students trade by writing on posters:  
       - `[Name] BUY 1 SHARE @ [Current Price]` or `[Name] SELL 1 SHARE @ [Current Price]`.  
     - After writing, they update the price and their **personal ledger** (handout tracking TT/share balances).  
  3. **Closing Markets** (5 min):  
     - Freeze posters. Calculate final prices (last traded price).  
     - **Policy Selection**: Implement the policy with the higher final price.  

  ---

  ### **Role Assignment and Payoffs**  
  - **Effort Players** (2 students):  
    - **Role**: Influence engagement. They see the winning market’s price *before* the policy is executed.  
    - **Payoff**: 2× engagement score weighting + 5 TT bonus if engagement exceeds the market’s prediction.  
  - **Traders** (16 students):  
    - **Payoff**: TT gains/losses from trading + engagement score (all students report engagement).  
  - **Settlement**:  
    - **Winning Policy Contracts**: Redeemable at engagement score value (e.g., score=7.0 → 7 TT/share).  
    - **Losing Policy Contracts**: Worth 0 TT.  

  ---

  ### **Timeline (75 Minutes Total)**  
  | Time  | Phase                          | Key Actions                                                                 |
  |-------|--------------------------------|-----------------------------------------------------------------------------|
  | 0-5   | **Intro & Setup**              | Explain policies (A/B). Distribute TT, ledgers, roles (2 Effort Players).   |
  | 5-10  | **Welfare Metric Explanation** | Define "engagement score" (self-reported 1–10). Emphasize Effort Players’ weight. |
  | 10-35 | **Trading Phase**              | Open Markets A/B. Students trade on posters. Adjust prices after each trade. |
  | 35-40 | **Policy Selection**           | Compare final prices. Announce winning policy.                              |
  | 40-41 | **Reflexivity Injection**      | Secretly show winning price to Effort Players.                              |
  | 41-51 | **Policy Execution**           | Run winning policy (Lightning Talks or Q&A).                                |
  | 51-56 | **Outcome Measurement**        | Collect engagement scores (secret ballots). Calculate weighted average.     |
  | 56-61 | **Settlement**                 | Redeem shares. Announce TT winners.                                         |
  | 61-75 | **Debrief**                    | Reveal "futarchy," map experiences to concepts (below).                     |

  ---

  ### **Debrief Structure**  
  - **Step 1: Name the Mechanism** (2 min):  
    > "Today, you experienced **futarchy**: voting on a goal (engagement) and using prediction markets to pick the policy."  

  - **Step 2: Map Experiences to Concepts** (12 min):  

    | Moment                 | Concept                       | Discussion Question                                                                 |
    |------------------------|-------------------------------|-------------------------------------------------------------------------------------|
    | Trading Phase          | Information Aggregation       | "How did prices change as trades happened? What did prices 'know' that polls couldn’t capture?" |
    | Effort Players’ Action | **Reflexivity Loop**          | "Effort Players: Did the market price change your effort? How?" → Highlight self-fulfilling/self-defeating cycles. |
    | Engagement Reporting   | **Gaming the Metric**         | "Did anyone inflate/deflate their score to win TT? How did this distort the 'true' engagement?" |
    | Policy Execution       | **Sabotage Incentive**        | "Traders with losing shares: Did you try to *reduce* engagement? Why?"             |

  - **Step 3: Critique and Context** (10 min):  
    - **Reflexivity as Core Flaw**:  
      > "The market predicted Policy A’s engagement at 6.0. But once Effort Players saw 6.0, they slacked off → actual=5.4. The market destroyed its own informational advantage by *being public*."  
    - **Contrast with Sabotage**:  
      > "Sabotage is intentional harm. Reflexivity is structural: the forecast *changes* behavior, making the forecast wrong."  
    - **Broader Implications**:  
      > "In real futarchy, markets set policy based on predicted GDP. But if investors see a low GDP forecast, they pull out → GDP falls. The loop undermines causality."  

  ---

  ### **Predictable Problems & Recovery**  
  1. **Problem**: Trading lull (novices hesitate).  
     **Recovery**: Seed Market A with a BUY trade (@5.0) and Market B with a SELL trade (@5.0) to kickstart activity.  

  2. **Problem**: Effort Players don’t grasp their influence.  
     **Recovery**: Privately remind them: "Your effort has double weight. If the market expects low engagement, you can ‘prove it wrong’ by trying hard (or vice versa)."  

  3. **Problem**: Engagement scores cluster at 10 (gaming).  
     **Recovery**: In debrief, contrast scores with observed engagement (e.g., "Many reported 10, but I saw phones out").  

  4. **Problem**: Price ties (5.0 vs. 5.0).  
     **Recovery**: Flip a coin to choose policy, then discuss how ties weaken futarchy.  

  ---

  ### **Limitations to Discuss**  
  - **Unreproduced Element**:  
    > "Real futarchy uses **liquid, continuous markets** with many traders. Today’s small, one-off market couldn’t aggregate information as efficiently. Prices were noisy, and strategic gaming was easier."  
  - **Compensate By**:  
    - Citing Hanson’s original work: "In theory, large markets mitigate reflexivity. But in practice, even major prediction markets (e.g., stock prices) suffer from self-referential loops."  
    - Examples:  
      - 2008 financial crisis (low confidence forecasts → panic selling → fulfilled forecasts).  
      - Corporate KPIs (e.g., "expected quarterly sales" → salesforce overpromises → metric inflation).  

  ---

  ### **Materials to Prepare**  
  - Posters: "Market A" and "Market B" with price/transaction logs.  
  - Student packets:  
    - Ledger sheets (track TT/share balances).  
    - 10 TT (paper tokens).  
    - Role cards (2 Effort Players).  
  - Engagement ballots (1–10 scales).  
  - Timer, calculator (for engagement scores).  

  This design ensures students viscerally experience futarchy’s strengths (information aggregation) and flaws (reflexivity, gaming) before intellectualizing them. The Effort Players and self-reported metric make the feedback loop tangible, while the debrief ties each moment to a structural critique.
