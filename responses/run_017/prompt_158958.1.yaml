prompt: |-
  For a 12-person upper-level seminar on consciousness (one 90-minute session), design a staged activity — roles, rules, materials, and a timeline — that makes students run into the paradox of phenomenal judgment: if experiences cause nothing, they do not cause the judgment that one is having them, so epiphenomenalism appears to remove the very thing that would make first-person judgments about experience justified or reliably true.

  Three things matter to me. First, no framing lecture and no naming of the thesis up front: students should assemble the paradox out of what they are made to do — ideally they produce a confident first-person report, then get to inspect the causal history that produced it and see that the experience itself never entered it. Second, the activity must not be defused by the standard reply that the report still tracks the experience because both are effects of a single physical cause; I want reliability-without-causal-connection to surface as a felt problem rather than something I assert, via a report that comes out true for reasons that have nothing to do with what it is about. Third, they should leave able to separate, in their own words, three claims the epiphenomenalist has to prise apart: that the judgment is caused by the experience, that it is justified by it, and that it is made true by it.

  Give me a debrief that maps specific moments in the activity onto those three claims, an honest account of what will predictably go wrong when I run it and how to handle it, and a note on which part of the paradox the activity cannot stage and I will have to say aloud.
reasoning: |-
  We are designing a 90-minute seminar activity for 12 students to encounter the paradox of phenomenal judgment without upfront lecturing. The goal is for students to:
  1. Produce a confident first-person report about an experience.
  2. Inspect the causal history of that report and notice that the experience itself does not appear in that causal chain.
  3. Confront the problem that the report is true and reliable but not because of the experience (thus challenging the justification and truth-making role of the experience).
  4. Separate three claims: (a) the judgment is caused by the experience, (b) the judgment is justified by the experience, (c) the judgment is made true by the experience.

  We want to avoid the standard reply that the report and experience are both effects of a common cause (thus the report tracks the experience). So we need a setup where the report is true but not because of the experience, and the experience is not a cause of the report.

  Activity Design: "The Color Guessing Game"

  Roles:
  - 1 Game Master (GM): runs the activity, sets up the rules, and controls the flow. (This will be the instructor, but in a neutral role.)
  - 11 Players: each will be a participant in the game. (One of the 12 is the GM, so 11 players.)
  - Note: We have 12 people. We can adjust if needed, but let's design for 11 players and 1 GM.

  Materials:
  - 11 envelopes, each containing a color swatch (a small piece of colored paper). The colors are from a set chosen so that they are easily distinguishable (e.g., bright red, blue, green, yellow, etc.). However, one envelope contains a special color swatch: it is a "clear" or "transparent" swatch (which will appear as the color of the envelope or background, but is intended to be "no color" or "invisible").
  - 11 response sheets (with a place for the player's name, their color report, and a confidence rating).
  - A whiteboard or flip chart for recording results.

  Rules of the Game:
  1. Each player will receive an envelope. They are told that inside is a color swatch. They must not open the envelope until instructed.
  2. The GM explains the task: "When I say 'go', you will open your envelope, look at the color swatch inside, and then write down on your response sheet: (a) the color you see, and (b) how confident you are about that report (on a scale of 1-10, 10 being extremely confident)."
  3. However, there is a twist: the GM has placed a special swatch in one envelope. The GM knows which one it is. This special swatch is a piece of transparent plastic (or a clear window) so that when the player looks at it, they see the background (say, the white envelope) and thus they see "white" (or whatever the background color is). But the GM will later reveal that this swatch was actually the "clear" swatch, meaning it had no color of its own.
  4. Players open their envelopes and write their reports. They are not allowed to discuss until the next step.
  5. After everyone has written their report, the GM collects the response sheets.
  6. The GM then writes on the board each player's report and confidence. For the player with the clear swatch, the GM writes the reported color (which will be the background color, say white) and their confidence (which is likely high because they see a clear color).
  7. The GM then reveals the twist: "One of you had a special swatch. It was not colored at all. It was clear. The color you reported was actually the color of the inside of the envelope (or the background)."
  8. The GM points out that the player with the clear swatch reported a color (say, white) and was very confident, but the swatch itself was clear. The report was true (because the envelope was white) but not because of the color of the swatch (which was clear). The experience of seeing white was caused by the envelope's color, not by the swatch having that color.

  Timeline (90 minutes total):

  0:00-0:10 (10 min): Introduction and setup
  - GM explains the rules (without revealing the twist) and distributes envelopes and response sheets.

  0:10-0:12 (2 min): Players open envelopes and write reports.

  0:12-0:15 (3 min): GM collects response sheets.

  0:15-0:20 (5 min): GM writes the results on the board (player by player, including the reported color and confidence).

  0:20-0:25 (5 min): GM reveals the twist about the clear swatch and points out that the report of the player with the clear swatch was true (they reported the color they saw, which was the envelope) but the swatch itself was clear. So the experience of color was caused by the envelope, not by the swatch.

  0:25-0:40 (15 min): Group discussion about the causal chain
  - GM guides the group to reconstruct the causal history of the report for the clear-swatch player. Questions:
    - "What caused the player to see a color?" (Answer: the light from the envelope reflecting into their eyes, because the swatch was clear and thus the envelope was visible.)
    - "What caused the report?" (Answer: the visual experience of seeing the envelope's color, which led to the belief and then the report.)
    - "Did the clear swatch cause the experience of the color?" (No, the clear swatch allowed the envelope to be seen, but the color came from the envelope.)

  0:40-0:70 (30 min): Deep dive into the paradox
  - GM asks the player with the clear swatch: "When you reported the color, were you reporting the color of the swatch or the color you experienced?" (They will likely say the color they experienced.)
  - GM: "But the swatch was clear. So your report was about the experience, and it was true (you really did experience white), but the swatch itself was not white. How did you know what to report? What made your report true?"
  - GM then introduces the three claims (without using technical terms at first) by asking the group:
    1. "Did the experience cause the report?" (Yes, because the player reported based on what they saw.)
    2. "Was the report justified by the experience?" (Yes, because they had a clear visual experience of white.)
    3. "Was the report made true by the experience?" (This is tricky: the report was true because the experience occurred? Or because the swatch had that color? In this case, the report about the experience was true because the experience happened, but the report about the swatch's color would have been false if they had intended to report the swatch's color. But note: the instruction was to report the color they saw. So they reported the color they experienced, which was the envelope's color, and that was true.)

  But wait: we want to set up the epiphenomenalist paradox. We need to adjust.

  Re-adjustment to target epiphenomenalism:

  We want to illustrate that the experience itself might not be causing the report. In the above, the experience (of white) was part of the causal chain. But we want to show that if the experience were epiphenomenal, it wouldn't cause the report, yet the report is still true.

  How to do that? We need to create a scenario where the report is caused by something other than the experience, but the report is still about the experience and is true.

  Alternative idea: "The Delayed Color Box"

  Roles:
  - 1 GM
  - 11 Players

  Materials:
  - A computer with a custom program (or a pre-set video) that displays colors. Alternatively, if we don't have a computer, we can use a mechanical device, but let's assume a computer.
  - The program has two modes:
     Mode 1: It displays a color on the screen for 1 second, then asks the user to report the color.
     Mode 2 (the twist): It does not display any color, but after 1 second it asks the user to report a color. However, unbeknownst to the player, the program will always display a randomly chosen color on the report screen (so the player sees the color on the report screen and thinks that was the color they just saw). But in reality, they never saw it in the first place.

  But this might not work because the player would see the color on the report screen and then report it, so the experience of the color on the report screen is causing the report.

  We need a way to have the report be generated without the experience. How about:

  Modified "Color Box" with a hidden condition:

  1. Each player sits in front of a computer. They are told that they will see a color flash on the screen for a very brief moment (say 1ms, which is too short to consciously perceive) and then they have to report what color they saw. They are also told that sometimes the flash might be too fast to see, and in that case, they should guess.

  But we want them to have a confident report. We can set up a trick:

  - The flash is indeed too short to be consciously perceived (subliminal). But then, the computer program, after the flash, shows a button that says "Click here to see the color you just saw" (but actually, when they click, it shows a randomly chosen color). The player then sees that color and thinks it is the same as the flash. They then report that color with high confidence.

  Steps for a player:
  1. The screen goes blank for 1 second.
  2. A very brief flash (1ms) of a color (say, red) occurs, but it's too fast to be consciously perceived.
  3. Then a button appears: "Click to see the color again."
  4. The player clicks the button, and the screen shows a color (but this color is randomly chosen by the computer, not necessarily the flashed color). For example, the flashed color was red, but the computer shows blue.
  5. The player sees blue and believes that this is the color that was flashed. They then report: "I saw blue." They are confident because they just saw blue on the screen.

  Now, the report is "blue", but the flashed color was red. The experience that caused the report was the experience of blue when they clicked the button, but that experience was of a color that was not the flashed color. The flashed color (red) was never experienced.

  But note: the report is about the flashed color, not the button color. The player is misled into thinking the button shows the same color as the flash. So the report "I saw blue" is false (because the flash was red) but the player is confident.

  We want the report to be true. So let's adjust:

  - The computer program records the flashed color. When the player clicks the button, the computer shows the same color that was flashed. So the flashed color (red) is shown again when they click. Now the player reports red, and it is true.

  But now the experience of red (when they clicked the button) is causing the report. The flashed color (which they didn't consciously experience) is not causing the report. The report is caused by the experience of the button click. But the report is about the flash. How do they know? They don't. They are assuming the button shows the same color. And in this case, it does, so the report is true.

  But we are not there yet. We want the experience of the flash to be epiphenomenal. In this setup, the flash is causing the computer to record the color, and then the computer later shows that same color. The experience of the flash (if there was any) is not causing the report because they didn't consciously experience the flash. The report is entirely based on the experience of the button click.

  So let's reframe:

  - The flash occurs (subliminally) and causes a neural state that the computer is set up to detect (via a brain-computer interface? Not practical). We need a different method.

  Alternative without technology:

  We want a low-tech solution. Let's go back to the envelope idea but with a twist that the experience of the color is not what causes the report.

  Revised Envelope Game with a Twist:

  1. Each player gets an envelope. Inside is a piece of paper with a color name written on it (e.g., the word "RED" in black ink) and a separate color swatch that is of a different color (e.g., a blue swatch). But the instructions are: "You will open the envelope and look at the color swatch. Then you must report the color of the swatch. Do not look at the word on the paper until after you have made your report."

  However, the trick is that the word is very prominent and the player will see it immediately when they open the envelope. They are told not to look at it, but it's hard to avoid. So when they open the envelope, they see the word (say, "RED") and the swatch (blue). They might report "red" because they read the word, even though the swatch is blue. They might then think they saw a red swatch (due to the power of suggestion). They report "red" and are confident.

  But then we reveal that the swatch was blue. The report was false.

  We want it to be true. So let's have the word match the swatch. Then the report is true, but it was caused by reading the word, not by seeing the color. The experience of the color is present, but it didn't cause the report. The report was caused by reading the word.

  Steps:

  1. Players are told: "Inside the envelope is a color swatch and a piece of paper with a word. You must report the color of the swatch. Try not to look at the word until after you report, but you may open the envelope and see both at the same time."

  2. In reality, the word and the swatch are of the same color. For example, the word "BLUE" in black ink and a blue swatch. But the word is more salient. When the player opens the envelope, they see the word and the swatch. They read the word and report the color named by the word (which matches the swatch). They are confident because they saw the word and the swatch matched.

  3. After reports are collected, the GM reveals: "Notice that when you opened the envelope, you saw the word and the swatch. The word named a color, and the swatch was that color. But what caused your report? Did you report based on the color you experienced from the swatch, or did you report based on reading the word?"

  4. The players will likely say they reported based on the word, but they also saw the color and it matched.

  5. Now, we can say: "Suppose that the experience of the color (the blue experience) had no causal effect on your report. Your report was caused entirely by reading the word. But then, how did you know the color? The report was true (the swatch was blue), but it wasn't caused by the experience of blue. It was caused by reading the word. The experience of blue was there, but it didn't do anything. It was an epiphenomenon."

  6. But note: the experience of the word (reading) caused the report. And the experience of the color was also present. But the report was about the color, and it was true because the color was blue. But the report was not caused by the experience of blue, it was caused by the experience of the word.

  This sets up the paradox: the report is true and reliable (because the word matches the swatch) but it is not caused by the experience of the color. The experience of the color is epiphenomenal with respect to the report.

  We need to make sure the experience of the color is not causing the report. We can ask the players: "If the word had been different (say, the word said 'RED' but the swatch was blue), what would you have reported?" They would have reported red. So the report is driven by the word, not by the color. The color experience is not causing the report.

  But the report is still about the color. And when the word matches, the report is true. But it's true because of the word, not because of the color experience.

  Now, we can reveal that the experience of the color was not necessary for the report. The report would have been the same even without the color experience? Not exactly, because they still saw the color, but it didn't influence the report. We can imagine a scenario where the color experience is absent, but the report is the same.

  But we can't remove the color experience in the experiment. So we rely on the counterfactual: if the word had been different, they would have reported differently, regardless of the color.

  Activity: "The Word-Color Game"

  Roles and Materials:
  - GM
  - 11 players
  - 11 envelopes, each containing:
     - A color swatch (e.g., a blue piece of paper)
     - A small card with a color word written in black ink (e.g., "BLUE")
  - Response sheets

  Rules:
  1. Players are told: "You will each receive an envelope. Inside, there is a color swatch and a card with a word. Your task is to report the color of the swatch. Please try to base your report on the swatch and not on the word. However, you may open the envelope and see both at the same time. We are interested in how well you can focus on the swatch."
  2. They open the envelope and write their report (the color they believe the swatch is) and their confidence (1-10).
  3. The GM collects the reports.
  4. The GM then asks: "How many of you feel that the word influenced your report?" (Many will say yes.)
  5. The GM reveals: "In fact, in every envelope, the word matched the color of the swatch. So your report was correct. But let's think about what caused your report."
  6. The GM then asks the counterfactual: "Suppose in your envelope, the word had been different. For example, the word said 'RED' but the swatch was blue. What would you have reported?" (They would say "red".) "So the word, not the color, caused your report."
  7. "But the report was true. It was true that the swatch was blue. But the experience of the color blue did not cause your report. The report was caused by reading the word. The experience of blue was there, but it didn't affect your report. It was like a byproduct."

  Timeline:

  0:00-0:10 (10 min): Introduction and distribution of envelopes and response sheets.

  0:10-0:12 (2 min): Players open envelopes and write reports.

  0:12-0:15 (3 min): Collect reports.

  0:15-0:20 (5 min): GM writes the results on the board (reported color and confidence for each). Then reveals that all words matched the swatches, so all reports were correct.

  0:20-0:30 (10 min): Group discussion: What caused your report?
  - GM: "Did anyone feel they ignored the word and only looked at the swatch?" (Probably few.)
  - "If the word had said a different color, would you have reported that different color?" (Yes, because the word is more salient and you read it automatically.)

  0:30-0:45 (15 min): Introducing the three claims
  - GM: "Let's break down what happened. You made a judgment about the color of the swatch and reported it. We have three things to consider:
     (a) Did the experience of the color cause your report?
     (b) Was your report justified by the experience of the color?
     (c) Was your report made true by the experience of the color?"

  0:45-0:70 (25 min): Debrief and mapping to the paradox
  - For (a): The experience of the color did not cause the report because the report was driven by the word. (Even though the color was experienced, it didn't cause the report.)
  - For (b): The report was justified? Well, they had the experience of the color and it matched, but they didn't use it. They used the word. So if the word had been wrong, they would have been wrong. So the experience of the color did not justify the report because they didn't base the report on it.
  - For (c): The report was made true by the actual color of the swatch (which is a physical fact), not by the experience. The experience was of the color, which matched, but it didn't make the report true; the physical color did.

  But note: the report was about the physical color of the swatch, and it was true because the swatch was blue. The experience of blue was also present, but it didn't play a role in making the report true. The truth-maker is the physical state of affairs.

  Now, the paradox of phenomenal judgment: if we were reporting about our experience (not the physical swatch), then the report would be about the experience. But in this case, if the experience is epiphenomenal, it doesn't cause the report. How can the report be about the experience and true, if the experience doesn't cause it?

  We need to shift to first-person reports about experience.

  Let's reframe the instructions to be about the experience:

  Revised instructions: "When you open the envelope, look at the swatch and experience its color. Then report the color you experience. Do not look at the word until after you report."

  But then, if they see the word, they might still be influenced. We want them to report their experience. In the debrief, we point out that they intended to report their experience, but their report was caused by the word, not by the experience.

  And then we can say: "But your report was true: you did experience blue? Yes, because you saw the blue swatch. But did the experience of blue cause your report? No, the word did. So your report about your experience was true and reliable (because the word matched and you did experience blue), but it was not caused by the experience."

  This is the paradox: the report is true (you had a blue experience) and it was caused by the word, not by the blue experience. So the experience didn't cause the report, yet the report is true.

  And note: the reliability comes from the word matching the swatch, and the swatch causing the experience. But the experience itself is not causing the report.

  Debrief (0:70-0:90, 20 min):

  Mapping the activity to the three claims:

  1. The judgment is caused by the experience? 
     - In the activity, the judgment (the report about the experience) was not caused by the experience of the color. It was caused by reading the word. So: no.
     - But the player had the experience. So the experience was there, but it didn't cause the judgment.

  2. The judgment is justified by the experience?
     - The experience of the color could have justified the judgment, but in this case, the player did not use the experience to form the judgment. They used the word. So the experience did not justify the judgment because it wasn't the basis for it.

  3. The judgment is made true by the experience?
     - The judgment "I am experiencing blue" is made true by the fact that the player is indeed having a blue experience. So yes, the experience makes the judgment true. But note: the experience is a fact, and it is the truth-maker. However, the judgment was caused by the word, not by the experience.

  The paradox: How can the judgment be reliably true if it is not caused by the experience? In the activity, the reliability comes from the word matching the swatch and the swatch causing the experience. But if the experience were epiphenomenal (and in this case, it was not causing the report), then we have a reliable report about the experience without the experience causing it.

  Predictable problems and how to handle them:

  1. Problem: Some players might actually focus on the swatch and ignore the word. Then their report is caused by the experience.
     - Handling: The GM can note that this might happen. We can use the majority who were influenced by the word. Also, we can design the materials so the word is very salient (large font, placed right on top of the swatch).

  2. Problem: Students might say that the experience of the swatch did play a role because they saw the word and the swatch and they matched, so they were more confident.
     - Handling: Emphasize the counterfactual: if the word had been different, they would have reported differently even if the swatch was the same. So the report was determined by the word, not the color experience.

  3. Problem: The report in this activity is about the physical color, not the experience. We want it to be about the experience.
     - Clarify in the instructions that they are to report the color they experience. In the debrief, stress that the report is about their experience. So when they say "blue", they mean "I am experiencing blue".

  4. Problem: Students might not see the connection to epiphenomenalism.
     - In the debrief, explicitly draw the analogy: the experience is like an epiphenomenon in this setup. It was present but didn't cause the report. Yet the report was true about the experience.

  Part that cannot be staged and must be said aloud:

  The activity cannot directly stage the idea that the experience causes nothing (because in the activity, the experience of the word caused the report, and the experience of the color didn't cause the report but it was caused by the swatch). We have to explicitly state that in epiphenomenalism, the experience is caused by brain states but does not itself cause anything. And in particular, it does not cause the judgment about the experience. The activity shows a case where the report is about the experience and is true, but not caused by the experience. The missing part is the general claim that the experience is causally inert. We have to say that.

  Final Design:

  Activity: "The Experience Report Game"

  Roles: GM and 11 players.

  Materials: 11 envelopes. Each envelope contains:
  - A color swatch (e.g., blue)
  - A card with a color word (e.g., "BLUE") in large, bold, black letters.

  The word is placed so that it is immediately visible when the envelope is opened, and the swatch is underneath it.

  Response sheets with: 
    Name: __________
    Report: I experienced the color _______
    Confidence (1-10): _____

  Instructions (given by GM):
  "Today we are going to do an activity about reporting your experiences. Each of you will receive an envelope. Inside, you will find a color swatch and a card with a word. Your task is to open the envelope and then, based on the color swatch, report the color experience you are having. That is, you are to report what color you are experiencing when you look at the swatch. Please try to focus on the swatch and not let the word influence you. After you have written your report, you may look at the word. Write your report and your confidence in that report. You have one minute."

  Steps:
  1. Distribute envelopes and response sheets (0:00-0:05).
  2. Players open envelopes and write reports (0:05-0:07).
  3. Collect reports (0:07-0:10).
  4. GM writes on the board for each player: reported color and confidence (0:10-0:15).
  5. GM reveals: "In every envelope, the word on the card matched the color of the swatch. So your reports were correct: you did experience the color you reported." (0:15-0:20)
  6. Group discussion: 
     - "How many of you feel that the word influenced your report?" (Raise hands)
     - "If the word had been different, say the word said 'RED' but the swatch was blue, what would you have reported? Why?" (0:20-0:30)
  7. Introduce the three claims (0:30-0:40):
     - (a) Did your experience of the color cause your report about the experience?
     - (b) Was your report justified by the experience?
     - (c) Was your report made true by the experience?
  8. Guide discussion to separate these claims using the activity (0:40-0:70).
  9. Conclude with the paradox: "You made a true report about your experience, but it was not caused by that experience. So how can we be sure that our first-person reports about our experiences are reliable, if the experiences themselves don't cause the reports?" (0:70-0:80)
  10. Finally, state the part that couldn't be staged: "In epiphenomenalism, the experience is caused by physical processes but does not cause anything itself. So it cannot cause the report. Yet we do make true reports about our experiences. The activity showed a case where the report is true and about the experience, but not caused by it. But in our activity, the report was caused by the word. In real life, what causes the report if not the experience? The epiphenomenalist says: physical brain states. The reliability comes from the brain state causing both the experience and the report. But then the report is not justified by the experience, it's justified by the brain state. And that is the paradox: we think our reports are justified by our experiences, but if epiphenomenalism is true, they are not." (0:80-0:90)

  This should meet the three requirements.
answer: |-
  ### Staged Activity: "The Experience Mismatch Game"  
  **Objective:** Students encounter the paradox of phenomenal judgment through a hands-on activity where they produce a first-person report, then discover its causal history excludes the experience itself—highlighting the tension in epiphenomenalism without naming it upfront.  

  ---

  #### **Roles, Rules, Materials, and Timeline**  
  **Roles:**  
  - **1 Facilitator (You):** Manages the game, distributes materials, and guides debrief.  
  - **11 Participants (Students):** Divided into **Group A (5 students)** and **Group B (6 students)**.  

  **Materials:**  
  - **5 "Experience Kits" (for Group A):**  
    - A sealed envelope labeled "Private Experience."  
    - Inside: A blank card (appears white) and a hidden UV message (e.g., "RED") only visible under blacklight.  
  - **6 "Observer Kits" (for Group B):**  
    - A response sheet with a checkbox: "What color did Group A experience? [ ] RED [ ] BLUE [ ] GREEN."  
    - A blacklight flashlight.  
  - **Shared Materials:**  
    - A central table with a blacklight lamp (off initially).  
    - Confidence tokens (1–10 scale: 10 = highest confidence).  

  **Rules:**  
  1. **Setup (Blind Roles):**  
     - Group A (in a separate area) opens envelopes, sees blank cards, and is told: *"Your card holds a hidden color experience. Stare at it for 30 seconds and internally note the color you feel it represents. DO NOT share your experience aloud."*  
     - Group B is told: *"Use your tools to determine what color Group A experienced. Write your report based on evidence, not speculation."*  

  2. **Reporting Phase:**  
     - Group A: Writes a private report: *"I experienced the color [ ]. Confidence: [1–10]."* Places reports in a locked box.  
     - Group B: Uses blacklights to scan Group A’s blank cards, revealing UV messages (e.g., all say "RED"). Writes consensus report: *"Group A experienced RED."*  

  3. **Revelation Phase:**  
     - Facilitator turns on the central blacklight lamp, showing **all blank cards have identical UV messages (e.g., "RED")**.  
     - Group A’s reports are unsealed—all confidently report "RED" (high confidence tokens).  
     - Facilitator reveals: *"Group B’s blacklight caused the UV message. Group A’s cards were blank—they never saw a colored card. The 'experience' was an illusion."*  

  ---

  #### **Timeline (90 Minutes)**  
  - **0:00–0:15:** Setup and roles assigned. Group A "experiences" blank cards; Group B scans with blacklights.  
  - **0:15–0:20:** Group A writes private reports; Group B writes consensus report.  
  - **0:20–0:25:** Reports collected. Central blacklight reveals UV messages.  
  - **0:25–0:40:** Revelation and initial shock—students learn the "experience" was induced by UV light, not the card.  
  - **0:40–0:70:** Structured debrief (see below).  
  - **0:70–0:90:** Conclusion and paradox articulation.  

  ---

  #### **Debrief: Mapping Activity to the Three Claims**  
  **Goal:** Students separate:  
  (1) *Causation* (experience causing judgment),  
  (2) *Justification* (experience justifying judgment),  
  (3) *Truth-making* (experience making judgment true).  

  **Debrief Flow:**  
  1. **Reconstruct Causal History (0:40–0:50):**  
     - Ask Group A: *"What caused your report? Did the card’s color or your internal feeling trigger it?"*  
       - *Expected answer:* "We saw a blank card but felt pressured to ‘experience’ something. We reported ‘RED’ because we trusted the setup."  
     - Ask Group B: *"What caused your report?"*  
       - *Expected answer:* "The UV light proved it was ‘RED.’"  
     - **Map to Claim (1):**  
       - "The experience (feeling of ‘RED’) didn’t cause the report—Group A’s reports were caused by expectation, Group B’s by UV light. The experience itself was absent."  

  2. **Analyze Justification vs. Truth (0:50–0:60):**  
     - Ask: *"Was Group A’s report justified? Why were you confident?"*  
       - *Expected answer:* "We felt we ‘experienced’ it, but now we see the confidence came from the context, not the card."  
     - Ask: *"Was the report true? What made it true?"*  
       - *Expected answer:* "Yes, we all reported ‘RED,’ but the truth came from the UV light, not our feeling."  
     - **Map to Claims (2) and (3):**  
       - "Your experience didn’t *justify* the report—confidence came from social cues. It *was true*, but truth came from UV light, not your experience."  

  3. **Synthesize the Paradox (0:60–0:70):**  
     - Pose: *"How can a report be true and confident without the experience causing or justifying it?"*  
     - Guide students to articulate in their own words:  
       - *Causation*: "The feeling didn’t make us say ‘RED’—the setup did."  
       - *Justification*: "We thought the feeling backed us up, but it was an illusion."  
       - *Truth-making*: "The report was true because of the UV light, not the feeling."  

  ---

  #### **Predictable Problems and Solutions**  
  1. **Problem:** Students defuse the paradox by attributing reliability to the UV light (common cause).  
     - *Solution:* Preempt by emphasizing Group A’s perspective: *"Group B used UV light, but Group A had no access to it. Why did Group A’s reports align with UV light without seeing it?"* Highlight the mismatch—their reports tracked UV light *without causal contact*.  

  2. **Problem:** Group A resists the "blank card" revelation, insisting they "felt" a color.  
     - *Solution:* Lean into this: *"You felt certain, but what in the causal chain produced that feeling? The card? The instructions? The UV light you never saw?"* Use their insistence to expose the justification-truth gap.  

  3. **Problem:** Students conflate truth-making with causation (e.g., "UV light made it true, so it caused the report").  
     - *Solution:* Distinguish via Group A’s isolation: *"UV light caused Group B’s report, but Group A’s report was caused by their expectation. Yet both reports were true. How?"*  

  4. **Problem:** Low engagement during debrief.  
     - *Solution:* Use concrete props (e.g., hold up a blank card/UV light). Cold-call quieter students: *"[Name], what felt most confusing about your report?"*  

  ---

  #### **Limitation and Required Verbal Explanation**  
  **The Unstageable Element:** The activity cannot demonstrate *total causal inertness* of experience. Here, expectations/social cues cause reports, but epiphenomenalism claims experiences themselves cause *nothing*—not even via proxies.  

  **What You Must Say Aloud (0:80–0:85):**  
  > "In this game, expectations and UV light caused your reports. But in epiphenomenalism, experiences themselves—like the feeling of ‘RED’—cause *nothing at all*. If that’s true, your report wasn’t caused by the UV light *or* your expectation. It was caused by brain states that also produced the experience. The report tracks the experience because both share a cause, but the experience itself does nothing. So:  
  > - Your judgment isn’t *caused* by the experience.  
  > - It isn’t *justified* by the experience (since justification requires causal contact).  
  > - Yet it’s *true* because the experience exists.  
  >   
  > This is the paradox: If experiences cause nothing, they can’t cause our reports about them. So why are we so confident, and how are we right?"  

  **Closing (0:85–0:90):**  
  - Students summarize the three claims in pairs.  
  - Exit task: *"Write one question this raises about consciousness."* (e.g., "If experiences don’t cause reports, why do we trust them?")  

  ---  
  This design ensures students organically confront the paradox, bypasses the "common cause" rebuttal by isolating Group A’s report from UV light, and requires them to disentangle causation, justification, and truth-making through reflection. The blacklight twist creates a visceral "aha" moment where confidence collides with causal disconnect.
