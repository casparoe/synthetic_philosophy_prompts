  ### **4. Coined Term and Tight Definition**
  If existing terms feel insufficient, define:  
  #### **Strategic Commitment Collapse (SCC)**
  - **Definition**: A phenomenon where collapsing a sequential game into a simultaneous pre-commitment stage dissolves backward induction incentives, enabling Pareto-superior coordination by eliminating turn-by-turn defection threats.  
  - **Boundaries**:  
    - **Covers**:  
      - Games with sequential tension (e.g., Centipede, Trust Game).  
      - Pre-commitment enables coordination on high-payoff equilibria.  
    - **Excludes**:  
      - Games where passing *shrinks* the pot (induces early taking).  
      - Games with communication (e.g., players negotiate claims).  
      - Single-round games (no sequential collapse).  
      - Games with new opponents each turn (no mutual commitment).

