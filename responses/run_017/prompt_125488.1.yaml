  ### **Summary**
  - **Dynamic Play**: Centipede Game explains delayed taking via heuristics (absolute threshold at ~turn 17). Backward induction fails without a known end or iterative reasoning.  
  - **Pre-Commitment**: Coordination Game explains high claims. Backward induction loses force because commitment removes sequential defection.  
  - **SCC** (coined term) formalizes how pre-commitment collapses sequential tension.  

  Your alterations reveal that the backward induction argument thrives on **sequential inevitability in dynamic play** but dies in **simultaneous coordination contexts**. The heuristic in dynamic play (turn 16–17) is a behavioral artifact, not game-theoretic equilibrium.
