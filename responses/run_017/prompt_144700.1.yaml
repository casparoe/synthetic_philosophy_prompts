  - The affected-view friend calls subjected-view a "sticker for power" (risk of strawmanning)
  The draft must flag these unfair reductions while staying neutral.

  For structure:
  Agreed Claims: Start with foundational overlaps to build consensus. Include their suggested points but add nuance—e.g., circularity applies to both principles. Explicitly note where apparent agreement masks deeper splits (like "stakes vs coercion as currency").

  Disagreements Table: Dual-column approach forces precision. Wording must satisfy each side’s self-description (e.g., subjected view won’t accept "mere coercion" framing). Flag rows that are semantic (like "authority" vs "scope") to prevent false battles.

  Cruxes & Cases: Isolate 5 core disputes. Design cases to target specific weaknesses:
  - Commuter case tests "degree of affectedness" 
  - Hazard waste case forces temporal/geographic limits
  - Data standard case examines extraterritorial impact
  - Tourist/detainee cases probe coercion’s sufficiency
  - Trapped homeowner reveals exit cost ambiguities
  Predictions must be falsifiable—e.g., if subjected-view concedes tourist claims, it undermines their "coercion is sufficient" stance.

  Graduated Demos Fallback: Conclude this section by challenging both views—if affectedness scales voting weight, does subjected-view lose its "binary" advantage? If subjected-view rejects weight, is it inconsistent?

  Closing Section: Push for falsifiability. Subjected-view must define "too much affectedness without coercion"; affected-view must specify when minimal stakes don’t count. Call out linguistic traps—e.g., "authority" vs "justice" debates may be terminological.

  Style adjustments: Use accessible language ("sticker for power" → "legitimizes status quo"). For cases, replace abstract stakes with visceral details (e.g., "ruinous moving costs" not just "exit barriers").

  Biggest risk: The friends might reject case intuitions. Mitigate by grounding predictions in their prior positions—e.g., subjected-view likely denies tourist claims since they’ve dismissed "temporary" inclusion.
answer: |-
  Here’s a structured draft for your friends' adversarial collaboration, designed to isolate agreements, frame disagreements neutrally, and test cruxes with concrete cases. I’ve flagged unfair accusations and verbal disputes where they arise.

  ---

  ### **Adversarial Collaboration Draft: Boundary Principles for Political Inclusion**

  #### **1. Agreed Claims**  
  *(Both sides endorse these without reservation)*  
  1.1. **Scope of Principles**: Both principles aim to define *who has a claim to a say* in a decision, not who should rule or how votes should be weighted.  
  1.2. **Overlap on Core Cases**: Long-term residents, minors (via trustees), and clearly bounded communities (e.g., a city’s residents) are uncontroversially included under both views. Disputes arise at the margins.  
  1.3. **Circularity Challenge**: Determining "which decisions belong to which body" requires prior boundaries (e.g., is zoning a city or regional matter?), making both principles partially dependent on institutional context.  
  1.4. **Level of Government**: Neither principle resolves *which* entity (city, state, international body) should make decisions; this requires supplemental criteria (e.g., subsidiarity).  
  1.5. **Binary vs. Graduated Claims**: Voting rights are binary (in/out), but stakes/coercion exist on a spectrum. *However: This is not yet agreement on how to handle the spectrum (see disagreements).*  

  **Apparent Agreement (Clarified):**  
  - *"Only the margins are disputed"*: **True but incomplete.** Both agree disputes occur at edges, but they diagnose opposite "edges" (e.g., subjected view sees tourists as clear inclusions; affected view sees them as clear exclusions).  
  - *"Children are covered"*: **True via trustees**, but trusteeship doesn’t resolve *why* children are included (stakes vs. subjection).

  ---

  #### **2. Disagreements Table**  
  *(Each row states the same disagreement twice: first in terms Affected-Side accepts, then in terms Subjected-Side accepts.)*  

  | # | Affected-Interests View (AIV) Wording                                                                 | Subjected View (SV) Wording                                                                                               | Source | Note                                                                 |
  |---|------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|--------|----------------------------------------------------------------------|
  | 2.1 | **Core Currency**: A claim arises from the *magnitude of one's interests at stake* in the outcome. Coercion alone is insufficient (e.g., brief tourists). | **Core Currency**: A claim arises from being *bound by enforceable rules*. Stakes without coercion are irrelevant (e.g., distant stakeholders). | Both | **Substantive**. Fundamentally different starting points. |
  | 2.2 | **Threshold Problem**: SV wrongly excludes those deeply affected but not coerced (e.g., downstream communities). | **Overbreadth Problem**: AIV wrongly includes those with trivial stakes, creating infinite/unworkable demoi (e.g., global factory workers). | Both | **Substantive**. Mutual reductio accusations. |
  | 2.3 | **Temporal Scope**: Future generations have claims if decisions permanently affect their interests (e.g., waste repositories). | **Temporal Scope**: Only those presently subject to coercion have claims. Future people aren’t coerced *now*. | Both | **Substantive**. SV sees coercion as contemporaneous. |
  | 2.4 | "Subjection" requires ongoing exposure to authority (e.g., residents), not transient encounters (e.g., tourists). | "Affectedness" must be direct and non-trivial, not incidental (e.g., tourists). | *Misattributed* | **Verbal Dispute**. Both agree tourists lack claims; they disagree on *why*. |
  | 2.5 | SV legitimizes exclusionary power structures ("whoever has power decides who counts"). | AIV is a recipe for paralysis, demanding input from everyone remotely affected. | *Unfair* | **Rhetorical Overreach**. SV doesn’t *justify* power; AIV doesn’t *require* universal input. |

  **Key Clarifications**:  
  - Row 2.4 is **not a true disagreement** – both exclude tourists but for different reasons.  
  - Rows 2.2 and 2.5 risk strawmanning: SV *can* include non-residents (e.g., commuters), AIV *can* set thresholds (e.g., "significant" stakes).  

  ---

  #### **3. Cruxes & Prediction-Register Cases**  
  *Each crux isolates a sub-question where settling it would force concession. Cases are designed to target weaknesses.*  

  **Crux 1: Is Coercion Necessary/Sufficient for a Claim?**  
  - **Case**: *A tourist (9-day visit) is arrested for jaywalking under a new city ordinance. A pre-trial detainee spends 18 months in jail under the same laws before release without charge.*  
    - **AIV Prediction**: Tourist has *no claim* (trivial stakes), detainee *has claim* (profoundly affected).  
    - **SV Prediction**: *Both have claims* (subject to coercion equally).  
  - **Why it Matters**: If SV concedes the tourist lacks a claim, coercion isn’t sufficient. If AIV concedes the detainee has no claim, stakes aren’t necessary.  

  **Crux 2: Does Minimal Affectedness Generate Any Claim?**  
  - **Case**: *A trade bloc’s data standard becomes global. A factory worker in Vietnam must comply, altering her workflow. Her stake is small (marginally longer hours) and indirect (no direct coercion).*  
    - **AIV Prediction**: She has a *prima facie claim* (affected), but it may be outweighed by practicalities.  
    - **SV Prediction**: *No claim* (not subject to the bloc’s laws; affectedness is incidental).  
  - **Why it Matters**: If AIV insists on a claim, SV cries "infinite demos"; if AIV denies it, SV asks why *any* weak stake matters.  

  **Crux 3: Can Exit Costs Create "De Facto" Subjection?**  
  - **Case**: *A homeowner in a one-industry town. Her house is unsellable; moving costs would bankrupt her. The city council votes to eliminate her job sector.*  
    - **AIV Prediction**: She has a *strong claim* (massively affected and functionally trapped).  
    - **SV Prediction**: *No claim* if she can physically leave; coercion requires enforceable rules, not circumstantial barriers.  
  - **Why it Matters**: Tests whether SV’s "coercion" includes structural constraints.  

  **Crux 4: Can the Same Person Belong to Multiple Demoi?**  
  - **Case**: *An activist has minor stakes in 100 cities (e.g., climate policies affect her 0.001% each). Each city votes on local emissions rules.*  
    - **AIV Prediction**: She has a claim in *all 100* (aggregate stakes are large).  
    - **SV Prediction**: She has claims *only where she resides/pays taxes* (subjected to local enforcement).  
  - **Why it Matters**: If AIV embraces multiple demoi, SV calls it unadministrable; if AIV retreats, SV asks why affectedness matters at all.  

  **Crux 5: Does Timing Matter?**  
  - **Case**: *A county votes to host a hazardous waste repository (150-year lifespan). Future residents of nearby towns (not yet born) will face health risks.*  
    - **AIV Prediction**: Future people *have claims* (represented by proxies).  
    - **SV Prediction**: *No claim* (not presently subject to coercion; future coercion is speculative).  
  - **Why it Matters**: Tests whether "subjected" is temporal and whether future stakes count.  

  ---

  #### **4. The Graduated Demos Fallback**  
  *Your question: "Is this really about voting weight, not inclusion?"*  
  - **AIV Position**: Stakes *should* influence voting weight (e.g., higher taxes → more votes), but boundaries still matter to avoid over-inclusion.  
  - **SV Position**: Subjection is binary; voting weight should be equal among members (1 person = 1 vote).  
  - **Effect**: The fight *moves* but doesn’t dissolve. AIV would weight votes by affectedness; SV rejects this, fearing plutocracy ("stakes" ≠ "wisdom").  

  ---

  #### **5. What Would Move the Debate?**  
  **Evidence Against AIV**:  
  - If a group with *significant stakes* (e.g., commuters) can be *reliably excluded* without injustice (e.g., via robust inter-governmental consultation).  
  - If "affectedness" cannot be coherently bounded *even in theory* (e.g., butterfly effect arguments hold).  

  **Evidence Against SV**:  
  - If a group *subjected to coercion* (e.g., detainees, tourists) can be *excluded* without arbitrariness.  
  - If a group *not subjected but catastrophically affected* (e.g., downstream flood victims) has *no claim* to input.  

  **Straight Talk**:  
  - Part of this *is* verbal: "Subjection" and "affectedness" are stretched to cover desired outcomes (e.g., SV calls commuters "subjected" via parking fines; AIV calls global workers "affected").  
  - **Unfair Accusations**:  
    - "SV is a sticker for power": SV *constrains* power by requiring inclusion of all coerced (e.g., illegal immigrants).  
    - "AIV is unworkable": AIV doesn’t require *universal* inclusion; thresholds and delegation are possible.  
  - **Path Forward**: Test predictions (Section 3) against shared intuitions. If SV admits the tourist *shouldn’t* vote, or AIV admits the factory worker *needn’t* vote, core premises weaken.

  ---

  **Format Note**: Share this as a Google Doc with sections clearly numbered. Encourage each friend to:  
  - Sign off on Section 1 (Agreed Claims) as-is or amend.  
  - Propose edits to Section 2 (Disagreements) for accuracy.  
  - Commit to predictions in Section 3 *before* debating cases.  
  - Revisit Section 5 after engaging the cruxes.  

  This forces them to confront whether their disagreement is about intuitions on cases (resolvable) or foundational commitments (irreconcilable). Good luck!
