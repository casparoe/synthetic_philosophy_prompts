  First, I need to recall the three theories. Code-reductionism says virtual objects are just code patterns. Institutionalism treats them as status objects created by rules and community practices. Fictionalism sees them as props in a make-believe game. The user wants each theory applied to the heist step by step.

  The user mentions the EULA stating everything belongs to CCP, the grey market pricing assets in dollars, and the player community treating the hangar as the corp's. This raises the question of whose institution is authoritative. For institutionalism, I need to address whether competing institutions fracture the theory or if the game's rules take precedence. 

  The harm aspect is tricky. The user's friend argues the victims' distress indicates real harm, but the user counters that people get upset over fiction without real harm. I need to differentiate between emotional harm and moral wrongness, considering the time invested and permanence of loss in EVE compared to other games.

  The user also wants to know which theory the episode confirms, embarrasses, or doesn't speak to. Code-reductionism might be confirmed because the devs didn't intervene, showing it's all code. Institutionalism could be embarrassed if the community outcry suggests a lack of uptake, but the rules permitted it. Fictionalism might not be addressed since the players treated the assets as real, not pretend.

  For the substitution test: if the same betrayal happened in a real organization, it would be harmful. But in a game, the rules permit such actions. The permission defense is key here—like capturing a queen in chess, it's allowed by the rules. However, the grey market complicates things by adding real-world value, which violates the EULA.

  Permanence matters. In EVE, losses are lasting, unlike respawning games. This makes the stakes higher, potentially intensifying emotional harm, but doesn't necessarily create moral harm if the rules allow it. The distress might stem from breached social trust rather than the virtual items themselves.

  I need to ensure each theory is addressed systematically: was there an object, was there theft, what was lost, whose institution, harm analysis. Then evaluate which theory the event supports or challenges. The grey market introduces a real-world element that conflicts with the game's rules, so institutionalism might handle this by distinguishing between in-game and external institutions.
answer: |-
  Let's map the Black Sunday heist onto your three metaphysical accounts systematically. I'll address each component of your query in sequence, using the EVE case as a testbed. (Assumed facts granted.)

  ### 1. **Was there an object, and was it stolen?**
     - **Code-Reductionism (a):**  
       - **Object?** No. The "stolen battleship" is shorthand for altered database entries (ownership flags, location coordinates) and changed player dispositions (e.g., the infiltrators' client-side rendering permissions).  
       - **Theft?** No metaphysical theft occurred—only unauthorized data manipulation. The *physical* harm is server energy expenditure and player time/labour.  
       - **Loss:** Victims lost time-investment (10 months of labour coordinating mining ops) and *expectations* about future database states. Permanence matters because it amplifies time-costs (no respawn = irreversible labour loss).  

     - **Institutionalism (b):**  
       - **Object?** Yes. The ships, ISK, and corp roles were real status objects constituted by EVE's rules + player uptake. The corp's shared belief ("this hangar is ours") and coordinated actions (mining ops, access permissions) sustained them.  
       - **Theft?** Yes, *within the institution*. Status objects were illegitimately transferred (by real-world moral standards) despite being procedurally permitted. Uptake was exploited: trust was the "glue" holding the institutional facts in place.  
       - **Loss:** They lost *institutional status* (director roles, corp assets) and social capital. Permanence deepens loss by preventing institutional recovery (e.g., rebuilding reputation).  

     - **Fictionalism/Pretense (c):**  
       - **Object?** No. The assets were props in collective make-believe ("we own a Titan").  
       - **Theft?** No literal theft, but *imagined theft* occurred. The props' narrative role changed abruptly ("our Titan → their Titan").  
       - **Loss:** Victims lost emotional investment in a shared narrative and psychological rewards (pride in corp achievements). Permanence intensifies loss by making the narrative rupture irreversible.

  ### 2. **Whose Institution Constitutes the Objects? (Institutionalism's Fracture Test)**
     - **The Conflict:**  
       - *CCP's EULA*: Declares all assets CCP's property; forbids RMT.  
       - *Grey Market*: Prices assets in USD, implying player-ownership.  
       - *Player Community*: Acts as if corps own assets (access controls, trades).  
     - **Resolution for (b):** Institutionalists (e.g., Searle) prioritize *the operative institution*. Here, **EVE's gameplay rules + player uptake override CCP's EULA in practice**. The heist succeeded because players *and devs* upheld corp ownership norms during gameplay. The grey market is parasitic—it relies on but doesn't constitute EVE's core institution.  
     - **Does this fracture institutionalism?** No—it shows institutions can nest. CCP's legal institution (EULA) exists *alongside* but doesn't dissolve the gameplay institution, just as property laws don't negate chess rules during a match.  

  ### 3. **Harm Analysis: Substitution Test vs. Permission Defence**
     - **Substitution Test:**  
       - If this happened in a volunteer org, it would involve *real moral harm* (betrayal, wasted labour). In EVE, the harm is **real but contextually contained**:  
         - The "game context" transforms betrayal into *ludic drama*. Players consent to treachery as a gameplay mechanic (spies, heists are celebrated in EVE lore).  
         - Harm is *emotional* (distress) and *economic* (time/labour), but not *moral* in the same way—because...  
     - **Permission Defence:**  
       - The move was rules-permitted (like taking a queen). Thus, no *ludic* wrong occurred. Players aren't wronged *as players* because they accepted EVE's norms (including permadeath and betrayal).  
       - **But**: The defence weakens because:  
         (1) EVE's norms are fuzzy—trust is both a tool and a vulnerability;  
         (2) Grey markets "bleed" real-world value into the game, violating CCP's rules but creating RMT stakes.  

  ### 4. **Distress Datum: Does Victim Anger Prove Harm?**
     - **Your study buddy** confuses *harm* with *wrongness*. Distress confirms **psychological harm** (real emotional suffering), but not necessarily **moral wrongness** (e.g., crying over a novel's character).  
     - **Key differentiators for EVE:**  
       - **Permanence**: Losing a Titan forever (vs. a WoW respawn) mirrors real-world irreversibility, amplifying distress.  
       - **Labour Investment**: 10 months of coordination (vs. a 5-min gank) creates sunk costs akin to real projects.  
       - **Social Betrayal**: Unlike a sports loss, this involved intimate deception—breaching *real* social bonds formed via voice chats and teamwork.  
     - **Verdict**: Distress cuts toward *real psychological harm* but is agnostic on metaphysical theft. A 10-month con in a permadeath world heightens harm's *severity* by blending ludic and real-social elements.

  ### 5. **Which Theories Does Black Sunday Confirm, Embarrass, or Ignore?**
     - **Confirms Code-Reductionism (a):**  
       CCP's inaction validates that only database states mattered. The heist was "legitimate" because code permitted it—no deeper facts needed.  
     - **Embarrasses Institutionalism (b) *Slightly*:**  
       Player outcry post-heist ("this shouldn't be allowed!") shows *uptake isn't seamless*. When norms conflict (trust vs. spy mechanics), the institution strains—but survives because CCP upheld it.  
     - **Silent on Fictionalism (c):**  
       Players didn't treat assets *as fictional* ("pretend we stole a ship"). They acted *as if* ownership was real. Fictionalism can't explain grey markets pricing "make-believe" props in USD.  

  ### 6. **Synthesis: What Was Lost?**  
  On all accounts, **labour-time** was lost (code-manipulation, institutional upkeep, emotional investment). But the *meaning* differs:  
  - **(a)**: Lost effort altering databases.  
  - **(b)**: Lost social status and institutional power.  
  - **(c)**: Lost immersion in a satisfying narrative.  

  The heist confirms **institutionalism** best explains EVE's *operational reality*: virtual objects function as "real" within gameplay because rules + collective intent make them so—even when those rules permit brutal cons. The distress? A real cost of playing a high-stakes game where fiction bleeds into human psychology.
