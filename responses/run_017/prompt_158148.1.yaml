answer: |-
  You've posed a profoundly intricate question at the heart of metaphysics and philosophy of language, grappling with how Bradley’s regress illuminates—or perhaps obscures—the nature of propositional unity. Let me try to untangle this step by step, addressing your supervisor’s challenge and testing your two readings against your three cases, all while keeping Bradley’s own aims in view. I’ll write as if we’re corresponding over email, thinking aloud together about how these distinctions hold up.

  First, to your supervisor’s point: it is tempting to see "binding unity" and "truth-evaluable unity" as two facets of a single problem, not least because both respond to the spectre of the regress. Yet, your distinction isn’t merely terminological. Binding unity concerns *how constituents combine into a structured whole*—a problem of mereology or composition. Truth-evaluable unity concerns *how that whole acquires intentionality or representational content*—why it says something about the world with a determinate truth condition. Bradley’s regress, like a thorn, pricks both, but the wounds are different. The proof lies in how each reading fares under pressure, especially from your three cases. Let’s start, though, with Bradley’s own intent.

  Bradley, in *Appearance and Reality*, used the regress to argue that relations are contradictory and thus unreal—"appearance" rather than fundamental reality. His target was the coherence of *any* relational complex (like "a is F" or "aRb"). The regress arises because if a relation R is distinct from its terms a and b, we seem to need a further relation (say, R₂) to "tie" R to a and b. But then R₂ itself requires yet another relation, ad infinitum. For Bradley, this showed that relations cannot genuinely unify; they lead to an infinite, vicious explanatory chain, undermining the very unity they purport to explain. This aligns more closely with your *binding* reading: the regress exposes a failure in *composition*, revealing that relations cannot be constituents in the same way as particulars without generating a mere aggregate, not a whole. His conclusion—that relations are illusory—suggests he saw unity as an indivisible feature of reality, not analysable into distinct relata and relations. Thus, the binding reading captures Bradley’s primary aim: unity as a non-relational, non-compositional feature that relations fatally disrupt.

  Now, your *truth-evaluable* reading shifts the focus: the regress becomes a demand for grounding—why is aRb true rather than not, or why does it represent a as bearing R to b rather than vice versa? Here, the regress is a symptom of a misguided quest for explanation, not a compositional failure. This view, championed by figures like Davidson or later Wittgensteinians, treats unity as intrinsic to propositional content: a proposition just *is* the kind of thing that can be true or false, and its structure is given by its role in language or thought, not by ontological glue. The "cure" is to reject the demand for grounding altogether—relations relate *full stop*, without needing a further fact to "make" them relate. This view is less about Bradley’s metaphysics and more about contemporary deflationary approaches to truth and representation.

  To see whether these readings are distinct or collapse, let’s test them against your three cases.

  First, the **false proposition**. Take "Socrates is immortal". It is unified—it says something determinate—but false. The binding reading handles this smoothly: binding unity is structural, independent of truth. The proposition is a structured whole (Socrates + mortality) regardless of whether Socrates instantiates mortality. The regress, on this reading, threatens only the *existence* of such a structure if relations are treated as additional relata. But false propositions have the same structure as true ones; the problem is compositional, not alethic. The truth-evaluable reading, however, stumbles here. If unity requires a "ground" for truth-evaluability, what grounds the unity of a false proposition? There is no fact to serve as ground. One might say the ground is "potential" or "conceptual," but this risks conflating unity with truth—precisely what your distinction aims to avoid. If unity depends on a ground for truth, false propositions become mysterious "ununified" items, which is counterintuitive. Thus, the binding reading survives this case better; the truth-evaluable reading, by tying unity to explanatory grounds, veers close to making unity contingent on truth.

  Second, **necessarily equivalent propositions with rearranged constituents**. Consider "2 + 2 = 4" and "4 = 2 + 2" in a context where addition is commutative. They are distinct propositions (different structures, different cognitive roles) but necessarily co-truth-valued. The binding reading explains this effortlessly: different arrangements yield different structured wholes, even if truth values coincide. Binding unity is about the *mode* of combination—order matters. Bradley’s regress, on this reading, attacks the very possibility of such ordered structures if relations are relata. The truth-evaluable reading faces a sharper challenge. If unity is what enables truth-evaluability, and both propositions are equally truth-evaluable (and share the same "ground" in mathematical reality), what distinguishes their unity? The regress, construed as a demand for grounding, might not differentiate them, as the same ground (e.g., the essence of numbers) explains both. But intuitively, their unities differ—one presents addition as proceeding left-to-right, the other right-to-left. The truth-evaluable reading struggles to capture this, as its focus on grounds blurs structural distinctions. Binding unity thus handles this case more cleanly, preserving the fine-grained identity of propositions.

  Third, the **necessary relation with no need for extra grounding**. Take "red is a colour". Here, the relation (instantiation) holds necessarily given the natures of red and colour. The truth-evaluable reading shines: demanding a further ground for this relation seems idle—it holds *because* of what red and colour are. The regress, as an infinite chain of grounds, is "vertically shallow" and harmless; we stop at the first step, refusing the demand. No explanatory deficit arises. The binding reading, however, falters. Even if the relation holds necessarily, the compositional problem remains: how do red, instantiation, and colour combine into a single whole? If instantiation is a distinct entity, Bradley’s regress looms—what binds it to red and colour? Frege-Russell solutions (e.g., treating instantiation as "unsaturated") address this, but they must still explain how unsaturated entities combine without regenerating the regress. Necessity doesn’t dissolve the structural worry; it merely ensures the structure exists. Thus, for this case, the truth-evaluable reading is stronger, as it defuses the regress by rejecting superfluous explanation, while the binding reading still grapples with composition.

  What emerges? Neither reading handles all three cases flawlessly, but they fail in different ways. Binding unity excels with false propositions and distinct-but-equivalent ones, as it separates structure from truth and order. But it stumbles on necessary relations, where the regress feels artificial yet the compositional anxiety persists. Truth-evaluable unity handles necessary relations well by dismissing the demand for grounds, but it conflates unity with truth in false propositions and glosses over structural differences in equivalent ones. This suggests your distinction is real: the two unities address different problems (composition vs. intentionality), and Bradley’s regress, while menacing both, does so for distinct reasons.

  If neither reading is wholly satisfactory on its own, is there a "third thing" the regress reveals? I suspect it points to a deeper issue: the **nature of relations themselves**. Bradley exposed that treating relations as self-subsistent entities (like particulars) generates paradox. The regress is an argument for the *non-entity* status of relations—they are not "things" to be bound or grounded but *ways of being*. This third problem is about relational facts *in general*, not just propositions. Propositions are a special case where the unity must also support meaning and truth. The cure, hinted at by Frege and Russell, is to treat relations (or predicates) as essentially incomplete—unsaturated, or ontologically dependent. This avoids the regress by denying that relations are constituents in need of binding, while also explaining truth-evaluability through their combinatorial nature. In your terms, it fuses binding and truth-evaluable unity: relations structure content *by* being the kind of thing that inherently relates.

  In your term paper, you might argue that Bradley’s regress forces us to see these unities as two symptoms of one underlying malady: the misstep of reifying relations. Your supervisor is half-right—they are intertwined—but your distinction illuminates why the regress vexes both composition and intentionality. By testing them against your cases, you show that no solution ignoring one aspect will suffice. Bradley’s ghost, it seems, still haunts anyone who tries to pull propositions apart. Keep wrestling with it; the fraying edges you see are where real philosophy happens. If this helps, or if you’d like to push back on any point, do let me know—I’m keen to hear how your paper develops. 

  Best regards,  
