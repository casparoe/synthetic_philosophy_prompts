prompt: |-
  I direct the editorial team for a high-school world history program, and we are in the middle of a full revision. My team runs into one problem several hundred times per volume: passages in which something non-human does the acting — an epidemic, a drought, a volcanic winter, a shift in the monsoon, a glacier, a shallow harbor, a vein of ore. Our house style currently has one blunt rule for these, which is to put the people back in: no sentence should make a pathogen or a weather system the grammatical subject of a historical claim. My copy editors and my subject-matter reviewers have told me, independently, that the rule now does as much harm as good. It produces flat, evasive prose, and it sometimes deletes a causal claim that is true, load-bearing, and the entire point of the paragraph. I agree, and I want to replace the rule with something my editors can actually run.

  Please write me that procedure. It has to work on a single sentence or short passage, in about ten minutes, run by a copy editor with no training in philosophy or historiography, and its output has to be a specific edited sentence plus a verdict from a small fixed set — leave as is; leave with a required mediating clause added; rewrite with the human decision-makers restored; delete the causal claim; escalate to a subject-matter editor. Give me the questions in the order they should be asked, what counts as a sufficient answer to each, and what does not; tell me where the procedure stops with a no; and mark the points where it has to hand the decision to a person because the question is one of values, pedagogy, or politics rather than fact.

  Three things the procedure has to get right. First, it must catch the drift from "X was among the causes" to "X made the outcome inevitable" — geography as destiny — including the cases where that drift carries a political charge, because attributing a region's poverty to its rainfall or its disease ecology rather than to a century of extraction is not a stylistic slip. Second, it must catch the mirror-image failure: rewriting to restore human agents in a way that credits officials with a decision nobody made, a foresight nobody had, or an option nobody had available. Third, it has to distinguish a trigger from a background vulnerability, and say what to do when a sentence collapses the two.

  We already use two informal heuristics, and I want you to keep them if they survive scrutiny, replace them if they do not, and tell me which you did and why. One we call the restore-the-decision-makers test: if you cannot rewrite the sentence with human agents as the subject without losing something, then the non-human factor is doing causal work and must not simply be deleted. The other we call the matched-case test: find a case that shares the non-human factor but has a different outcome; if you can, the factor was not sufficient, and the sentence may not imply that it was.

  Then apply the procedure to three passages from our current draft. Treat the empirical claims in each as checked and accurate; the only question is the causal framing.

  One. "Smallpox reached the valley before the soldiers did. Within a year it had killed the ruler and both his heirs, and the confederation that might have held the mountain pass no longer existed."

  Two. "The eruption took the harvest. By spring the price of rye had tripled; by midsummer the city had a new government."

  Three. This one is our sample unit opener, it appears in the materials we show adoption committees, and it tests very well with teachers. I would rather not lose it, so if your procedure says it cannot stand, say so plainly and give me the replacement sentence. "The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, and a dynasty that had held the throne for two centuries simply stopped."

  Finally, include a bank of five short test sentences my copy editors can use to check that they are applying the procedure the same way I am, and close with an honest statement of what the procedure cannot do — where it will misfire, which disputes it cannot settle, and which tradeoffs, in particular the tradeoff between vividness and precision at a ninth-grade reading level, remain judgment calls that no checklist will eliminate.
reasoning: |-
  Hmm, let me unpack this complex editorial challenge. The user leads a history textbook team grappling with how to represent non-human actors in historical causation. Their current "always humanize" rule creates clunky prose and sometimes erases valid causal claims, but they need safeguards against geographic determinism and false agency attribution.

  The core tension here involves three layers: linguistic (grammatical subjects), historiographical (causal complexity), and pedagogical (grade-9 comprehension). Their two existing heuristics—restoring decision-makers and matched-case testing—are conceptually sound but need operationalization into a step-by-step procedure.

  For the decision procedure, I'm considering a flowchart-like approach with clear exit points. Key thresholds would be:
  - Can the non-human factor be plausibly framed as a trigger? (Requires vulnerability mention)
  - Does the original text imply sufficiency? (Trigger matched-case test)
  - Would rephrasing with human agents distort historical reality? (Avoids false agency)

  The political dimension is crucial. Passages attributing poverty to geography rather than colonial extraction must be flagged—that's not just style but ideology. The procedure needs explicit checks for "drift to inevitability" and "false human credit."

  Testing with their sample passages:
  1) The smallpox example shows a valid trigger (disease) with human vulnerability implied (no immunity). Minimal edit needed.
  2) The eruption passage dangerously collapses cause (volcano → harvest failure → price spike → revolution). Requires unpacking the social vulnerability.
  3) The poetic unit opener risks climatic determinism. Can be salvaged by framing the cold as trigger for existing dynastic weaknesses.

  The bank of test sentences should include traps: one that smuggles in geographic determinism, one where human agents truly were absent, one with valid non-human trigger. 

  Finally, I must acknowledge the procedure's limits: it can't resolve debates about historical contingency, may sacrifice vividness for precision, and can't replace subject-matter expertise on nuanced causation. The best we can do is make tradeoffs explicit.
answer: |-
  Here is a comprehensive procedure for your editorial team, designed to handle non-human actors in historical causation while avoiding determinism, false agency, and causal oversimplification. It incorporates and refines your existing heuristics.

  **Procedure: Non-Human Actors in Historical Causation (NHAC Procedure)**

  **Goal:** To evaluate sentences where non-human elements (geography, environment, pathogens, resources, etc.) are grammatical subjects of causal claims, ensuring accuracy, avoiding determinism/false agency, and maintaining clarity for a 9th-grade audience.

  **Input:** A single sentence or short passage (1-3 sentences) where a non-human element is the grammatical subject of a causal historical claim.
  **Output:** One of five verdicts:
  1.  **Leave As Is**
  2.  **Leave with Required Mediating Clause Added**
  3.  **Rewrite with Human Decision-Makers Restored**
  4.  **Delete the Causal Claim**
  5.  **Escalate to Subject-Matter Editor**

  **Steps & Questions (In Order):**

  1.  **Identify the Causal Claim:** What specific historical outcome is the non-human subject (X) claimed to cause? (e.g., "X killed the ruler", "X took the harvest", "X caused the dynasty to stop").
      *   *Sufficient:* Clear identification of X and the outcome.
      *   *Insufficient:* Vague outcome description. *Stop:* Re-read passage. If still unclear, **Escalate**.

  2.  **Apply the "Restore-the-Decision-Makers" Test (Refined):** Attempt a *plausible* rewrite making specific human actors (individuals, groups, institutions) the grammatical subject causing the outcome, *without inventing agency, foresight, or options they demonstrably lacked*.
      *   *Success (Plausible & Accurate):* Proceed to Step 3.
      *   *Failure (Implausible or Distorts History):* This suggests X is doing significant causal work. Proceed to Step 4. *Why kept?* This test identifies where human agency is genuinely absent or overwhelmed, preventing the error of crediting humans with non-existent choices.

  3.  **Does the Rewrite Require Inventing Agency/Foresight/Options?**
      *   *Yes:* The original phrasing likely reflects a real limitation of human control. The rewrite is invalid. Proceed to Step 4.
      *   *No:* The human-agency version is historically accurate. Proceed to Step 5.
      *   *Uncertain:* **Escalate**. (Judgment call on historical plausibility).

  4.  **Apply the "Matched-Case" Test (Refined):** Can you think of a *relevant historical case* where X (or something very similar) was present, but the *specific outcome* did *not* occur? (e.g., Smallpox elsewhere didn't always collapse confederations; eruptions elsewhere didn't always cause revolutions; prolonged cold elsewhere didn't always topple dynasties).
      *   *Yes (Relevant Case Exists):* X was not sufficient. Proceed to Step 6.
      *   *No (Cannot Think of Relevant Case):* *Caution:* This doesn't *prove* sufficiency, only that it's plausible *in this specific context*. Proceed to Step 7. *Why kept?* It effectively combats claims of inevitability ("geography as destiny").

  5.  **Is the Human-Agency Rewrite Clearer and More Engaging?**
      *   *Yes:* **Rewrite with Human Decision-Makers Restored**.
      *   *No (Clunky, Evasive, Loses Key Element):* **Leave As Is**. (X's role is essential and human-centric rewrite harms clarity/vividness).

  6.  **Does the Original Sentence Imply X was Sufficient/Deterministic?** Check wording: Words like "made inevitable," "caused directly," "forced," "led inexorably to," or lack of qualifiers implying other factors? Does it erase human choices/vulnerabilities completely?
      *   *Yes (or Strongly Implied):* Proceed to Step 8.
      *   *No (Clearly Implies X was a Factor/Trigger):* **Leave As Is**. (X is presented non-deterministically).

  7.  **Does the Sentence Explicitly or Implicitly Acknowledge Underlying Vulnerability?** (e.g., lack of immunity, pre-existing social tensions, economic fragility, poor infrastructure, lack of reserves).
      *   *Yes:* **Leave As Is**. (X is framed as a trigger acting on vulnerability).
      *   *No:* Proceed to Step 8.

  8.  **Can a Simple Mediating Clause/Phrase Be Added?** Can you insert a short phrase acknowledging vulnerability, human context, or avoiding sufficiency? (e.g., "exposed the vulnerability of...", "interacting with...", "against a backdrop of...", "contributing to...").
      *   *Yes (Clear & Concise):* **Leave with Required Mediating Clause Added**. (e.g., "The eruption took the harvest *in a region with no grain reserves*.")
      *   *No (Too Clunky, Alters Meaning, Needs More Explaination):* Proceed to Step 9.

  9.  **Is the Causal Claim Load-Bearing and Well-Supported?** Is it central to the paragraph's argument and based on solid historical evidence?
      *   *Yes:* **Escalate to Subject-Matter Editor**. (Needs expert judgment on framing/context).
      *   *No:* **Delete the Causal Claim**. (The risk of oversimplification/misinterpretation outweighs its value).

  **Points Requiring Human Judgment (Values/Pedagogy/Politics):**
  *   Step 3: Assessing plausibility of human agency rewrite without distortion.
  *   Step 7: Assessing if a vulnerability is sufficiently implied or needs explicit mention (often involves historiography/specific context).
  *   Step 8: Deciding if a mediating clause is sufficient or if the claim needs deeper restructuring (balancing precision vs. conciseness).
  *   Step 9: Deciding if a claim is truly load-bearing and well-supported enough to warrant escalation despite problems.
  *   **Critical Political Check:** Whenever X is a factor like climate, geography, or disease ecology linked to outcomes like poverty, conflict, or state failure, **pay heightened attention to Steps 6, 7, and 8**. The omission of human factors like exploitation, policy choices, or social structures is a **major red flag** requiring a mediating clause (**Step 8**) or escalation (**Step 9**). Attributing outcomes *solely* to non-human factors in these contexts is often politically charged and historically inaccurate.

  ---

  **Application to Sample Passages:**

  1.  **"Smallpox reached the valley before the soldiers did. Within a year it had killed the ruler and both his heirs, and the confederation that might have held the mountain pass no longer existed."**
      *   Step 1: X=Smallpox; Outcome=Death of rulers/heirs & collapse of confederation.
      *   Step 2: Rewrite plausible? ("Conquistadors introduced smallpox, which killed...") Yes, but...
      *   Step 3: Does rewrite invent agency? Conquistadors *did* introduce pathogens, but did they *intend* this specific outcome? Unlikely. Rewrite implies more deliberate biowarfare than stated. *Failure* of plausible agency rewrite without distortion? **Yes** (distorts intent). Proceed to Step 4.
      *   Step 4: Matched-Case? Yes (Many societies hit by smallpox didn't immediately collapse politically - e.g., Europe itself). X not sufficient. Proceed to Step 6.
      *   Step 6: Imply sufficiency? "killed... and the confederation... no longer existed" links death to collapse tightly but doesn't *explicitly* say smallpox *alone* caused collapse. "Might have held" implies vulnerability. Weak implication, but not strong determinism. Proceed to Step 7.
      *   Step 7: Acknowledge vulnerability? Implied ("might have held"). **Leave As Is**. (The link is clear, vulnerability is implied, matched-case shows non-sufficiency, agency rewrite distorts). **Verdict: Leave As Is**.

  2.  **"The eruption took the harvest. By spring the price of rye had tripled; by midsummer the city had a new government."**
      *   Step 1: X=Eruption; Outcome=Loss of harvest → Price spike → New government.
      *   Step 2: Rewrite plausible? ("Farmers lost harvest to ashfall..." then price spike & government change). Yes, but...
      *   Step 3: Invent agency? Farmers didn't *choose* to lose harvest. Rewrite credits them with an outcome (loss) they didn't control. *Failure*. Proceed to Step 4.
      *   Step 4: Matched-Case? Yes (Eruptions/other disasters don't *always* cause revolutions - depends on response, reserves, legitimacy). X not sufficient. Proceed to Step 6.
      *   Step 6: Imply sufficiency? "took the harvest... [then] new government" strongly implies direct, inevitable causation chain. No mention of *why* the city was so vulnerable (e.g., no grain reserves, unfair distribution, weak leadership). **Strong Implication**. Proceed to Step 7.
      *   Step 7: Acknowledge vulnerability? **No**. Proceed to Step 8.
      *   Step 8: Add Mediating Clause? Yes. Simple addition possible. "The eruption took the harvest *in a city already strained by debt and inequality*. By spring..." **Verdict: Leave with Required Mediating Clause Added**.

  3.  **"The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, and a dynasty that had held the throne for two centuries simply stopped."**
      *   Step 1: X=Prolonged Cold; Outcome=Harvest failures → Empty granaries → Dynastic collapse.
      *   Step 2: Rewrite plausible? ("Farmers could not grow crops for 11 years due to cold..." then collapse). Yes, but...
      *   Step 3: Invent agency? Farmers didn't *choose* to fail. Dynasty didn't *choose* to collapse. Rewrite credits them with outcomes they didn't control. *Failure*. Proceed to Step 4.
      *   Step 4: Matched-Case? **Yes** (Societies face climate stress without collapsing - e.g., resilience through trade, adaptation, strong institutions). X not sufficient. Proceed to Step 6.
      *   Step 6: Imply sufficiency? "The cold came... harvests failed... granaries emptied... dynasty... stopped." Very tight chain, no mention of other factors (e.g., poor response, corruption, succession crisis, external threats). "Simply stopped" implies inevitability. **Strong Implication**. Proceed to Step 7.
      *   Step 7: Acknowledge vulnerability? Implied? "Held the throne for two centuries" implies stability, *not* vulnerability. **No explicit or strong implicit vulnerability**. Proceed to Step 8.
      *   Step 8: Add Mediating Clause? Possible, but clunky to insert naturally without altering flow. Try: "The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, *exposing the dynasty's underlying weaknesses*, and a line that had held the throne for two centuries simply stopped." (*Acceptable but alters rhythm*). **Verdict (Reluctantly):** **Leave with Required Mediating Clause Added** (as above). *Alternative:* If preserving the stark poetic flow is paramount pedagogically (given its testing success), **Escalate to Subject-Matter Editor** to confirm the claim's centrality and approve the implicit framing *in this specific, highly stylized context*, acknowledging the trade-off.

  ---

  **Test Sentence Bank:**

  1.  **"Rich iron deposits fueled the region's industrial growth."** (Verdict: **Leave As Is** - Implies a resource enabling growth, not determining it. No sufficiency claim. Rewrite crediting specific humans ("Miners extracted iron which fueled...") is plausible but less elegant).
  2.  **"The desert climate prevented the development of large cities."** (Verdict: **Rewrite with Human Decision-Makers Restored** or **Add Mediating Clause** - Strong deterministic claim. Rewrite: "Limited water sources in the desert climate constrained settlement, preventing the development of large cities." Or Add Clause: "...prevented the development of large cities *given the available technology and organization*." Escalation also valid).
  3.  **"A sudden flood destroyed the bridge, halting the army's advance."** (Verdict: **Leave As Is** - Clear trigger event. Vulnerability implied ("halted the advance"). No sufficiency claim (floods don't *always* halt armies, but here it directly destroyed a key asset). Human agency not relevant to the flood's *direct* physical impact).
  4.  **"Malaria kept European colonists out of the African interior for centuries."** (Verdict: **Leave with Required Mediating Clause Added** - Implies sufficiency/determinism and erases African agency/adaptation. Add: "...out of the African interior for centuries, *while local populations developed partial resistance and adapted their settlement patterns*." Or Escalate).
  5.  **"Shallow harbors limited the port's ability to handle large ocean-going ships."** (Verdict: **Leave As Is** - Describes a constraining condition, not a direct cause of an event. No strong sufficiency claim or erased human agency implied).

  ---

  **Limitations & Unresolved Trade-offs:**

  1.  **Judgment Calls Persist:** Steps 3 (Plausible Agency?), 7 (Vulnerability Implied?), and 8 (Clause Sufficient?) rely heavily on editorial judgment. Consistent training and discussion are crucial.
  2.  **Vividness vs. Precision:** The procedure prioritizes avoiding determinism/false agency over stylistic flair. A perfectly vivid, slightly deterministic phrase might be flagged. The **Escalate** option is key for these high-value cases (like your unit opener).
  3.  **Nuance vs. Grade Level:** Adding mediating clauses or context risks complexity. The procedure assumes editors can do this concisely; complex cases need **Escalation** for pedagogical assessment.
  4.  **"Background" vs. "Trigger":** The distinction (Step 7) is often contextual and interpretive. Matched-Case helps, but judgment is needed.
  5.  **Cannot Settle Historiographical Debates:** If historians genuinely debate whether X was a prime mover or merely a condition, the procedure can't resolve it. **Escalate**.
  6.  **Over-Correction Risk:** Vigilance against determinism might lead to downplaying *significant* non-human factors or forcing unnatural human-centric phrasing. The refined "Restore Decision Makers" test (Step 3) and **Leave As Is** option mitigate this.
  7.  **Political Sensitivity Nuance:** While the procedure flags erasure of human factors (especially re: poverty/development), assessing the *degree* of sensitivity or potential for misinterpretation in complex contexts requires human judgment (**Escalate**).
  8.  **Cannot Create Evidence:** If a vulnerability *should* be mentioned but isn't supported by the unit's content/sources, **Delete** or **Escalate** are the only options.

  This procedure provides a structured, defensible approach. It empowers copy editors to handle most cases quickly but clearly flags complex judgment calls for subject-matter experts, balancing efficiency with historical accuracy and responsible pedagogy. Regular calibration using the test bank and team discussions will be essential for consistent application.
