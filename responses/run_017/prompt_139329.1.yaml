  We are to produce a document for an adversarial collaboration on whether LLMs understand what they talk about, with two parties: competence-first (CF) and derivation (D). The document must include:

  1. Agreed claims (numbered) that both parties sign, including setup, what doesn't settle the question, and dialectical points. These must be non-trivial and include concessions from each side.

  2. A disagreements table with:
     - Neutral statement of disagreement
     - CF formulation (as they would sign)
     - D formulation (as they would sign)
     - Classification (substantive, verbal, or partly verbal) and reason

  3. Cruxes: four candidate cruxes to be used, repaired, or replaced. For each:
     - Precise sub-question
     - Concrete test/case/argument that both accept as bearing on it, using existing techniques
     - Each party's prediction
     - What result would move each party (which may differ from their prediction)

  4. Close: 
     - Each party's chosen crux (if only one could be investigated) with one-sentence justification
     - One sentence from each party on what would make them withdraw their central claim.

  Scope: Only epistemic/semantic understanding; no consciousness, sentience, etc.

  We must avoid padding, hedging, and rhetorical scoring. Aim for 8 sharp agreed claims and 4 fully specified cruxes.

  Let's break it down.

  ## 1. Agreed Claims

  We need at least two claims that each party would rather not concede. We'll structure:

  - Setup: What the training objective is, architecture, behavioral evidence.
  - What doesn't settle the question: Points both agree are not decisive.
  - Dialectical situation: Common ground on the nature of the dispute.

  Agreed claims (numbered):

  1. **Training Objective**: Both parties agree that the primary training objective for large language models (LLMs) is to minimize a loss function that measures the discrepancy between predicted and actual token sequences in a corpus of human-generated text. This objective does not explicitly reward truth, reference, or comprehension beyond text prediction.

  2. **Architecture**: Both parties agree that the internal architecture of an LLM (specifically, a transformer-based neural network) computes a function from input token sequences to output token distributions via a series of nonlinear transformations and attention mechanisms, and that this process does not inherently incorporate external semantic grounding.

  3. **Behavioral Evidence**: Both parties agree that current LLMs exhibit behaviors that, in humans, would typically be taken as evidence of understanding, such as answering factual questions, explaining concepts, and making inferences across contexts. However, both also agree that these behaviors alone do not settle the question of whether the system understands, because they can be produced by pattern matching without comprehension.

  4. **Text Prediction and Understanding**: Both parties agree that the capacity to predict text well is necessary but not sufficient for understanding. Neither party holds that perfect text prediction would entail understanding (because it could be achieved by a lookup table or a stochastic parrot), nor that poor text prediction would entail lack of understanding (because a system might understand but be poor at expression).

  5. **Corpus Dependence**: Both parties agree that the content of an LLM's outputs is entirely derived from the training corpus, in the sense that the model cannot access or incorporate information that is not represented in the patterns of that corpus. However, the parties disagree on whether this implies that the model's internal states lack original semantic content.

  6. **No Magic in Training**: Both parties agree that the training process does not involve any non-physical or mysterious elements; it is an optimization process over a high-dimensional parameter space, guided by gradient descent on the text prediction objective.

  7. **Indeterminacy of Internal States**: Both parties agree that the internal states of an LLM, considered in isolation, do not have determinate content. Content ascription depends on the role these states play in the system's overall behavior and how they relate to the world. However, they disagree on whether the behaviors we observe support such ascription.

  8. **Separability of Phenomenology**: Both parties agree that the question of whether LLMs have conscious experiences (e.g., qualia) is orthogonal to the question of whether they understand in the epistemic sense. A system could understand without being conscious, and vice versa.

  Now, for concessions:

  - Claim 5: The CF party would rather not concede that content is "entirely derived" because they think the system can go beyond the corpus in its generalizations. But they agree that the system cannot access information outside the corpus, so they sign.
  - Claim 7: The D party would rather not concede that content ascription depends on behavior because they think behavior alone is insufficient. But they agree that internal states in isolation don't have content, so they sign.

  ## 2. Disagreements Table

  We need at least one partly verbal disagreement. We'll have 3-4 rows.

  | Neutral Statement | CF Formulation | D Formulation | Classification & Reason |
  |-------------------|----------------|---------------|--------------------------|
  | Whether internal states have original semantic content. | The internal states of LLMs, in virtue of their functional role in supporting generalization and error correction across diverse contexts, have original semantic content that is not merely inherited from the training corpus. | The internal states of LLMs, being statistical compressions of the training corpus, do not have original semantic content; any apparent content is derived from the human practices recorded in the corpus and does not reflect an independent grasp of the subject matter. | Substantive: The disagreement concerns the nature of the internal states and whether they go beyond compression. |
  | Whether generalization beyond the training distribution indicates understanding. | When an LLM generalizes correctly to novel situations that are not represented in the training corpus (e.g., applying a rule to a new domain), this is evidence that the system has formed an internal representation that tracks the domain structure, hence understanding. | Generalization beyond the training distribution is a result of statistical patterns in the corpus and does not require the system to have an internal representation that tracks the domain; it can be achieved by interpolation and extrapolation of surface features. | Substantive: Disagreement on the mechanism of generalization and whether it requires domain tracking. |
  | Whether the system is answerable to the world or only to the corpus. | The system is capable of being wrong about the world in a way that is not traceable to any error in the corpus, because its internal states purport to represent the world and can misrepresent it. | The system is only answerable to the corpus; it cannot be wrong about the world, only about what the corpus would say. Any error is a misprediction of text, not a misrepresentation of reality. | Partly verbal: The term "answerable" is ambiguous. Replace "answerable" with "subject to correction by": <br> - CF: The system can be corrected by feedback about the world, not just about text. <br> - D: The system can only be adjusted to better predict feedback text, not to better represent the world. |
  | Whether internal representations earn their explanatory keep. | The success of LLMs on complex tasks is best explained by the content of their internal states, which capture the structure of the subject matter and thus play a causal role in generating correct behavior. | The success of LLMs is explained by the statistical structure of the training corpus, which is compressed into the model parameters; the internal states are merely vehicles for this compression and do not add explanatory value beyond the corpus statistics. | Substantive: Disagreement on the explanatory role of internal states. |

  ## 3. Cruxes

  We'll use the four candidate cruxes, with repairs as needed.

  ### Crux 1: Unsourced Error

  - **Sub-question**: Can an LLM, trained only on text, produce an error that is not traceable to any inaccuracy or pattern in the training corpus and not due to any human's prior error, but rather a novel misrepresentation of a domain?
  - **Test Design**: 
    - Introduce a novel, contextually defined rule system (e.g., a made-up board game with rules explained in the prompt). 
    - Test the LLM's ability to apply the rules correctly to new board states. 
    - Then, probe whether the LLM makes errors that are not consistent with any known game or pattern in the training data and cannot be explained by overgeneralization from similar games. 
    - The test uses existing techniques: prompt engineering and behavioral analysis.
  - **Predictions**:
    - CF: Predicts that such unsourced errors are possible because the system might form an incorrect internal model of the new domain.
    - D: Predicts that all errors can be traced to patterns in the training corpus (e.g., overgeneralization from similar games) or to the prompt itself (which is text, hence part of the prediction task).
  - **What would move each party**:
    - CF: If the system makes errors that are novel and not explainable by corpus patterns, and if these errors are consistent with a systematic misunderstanding of the domain, that would support CF. Failure to find such errors would not move CF immediately because the system might be correct by chance.
    - D: If errors are found that are not reducible to any pattern in the training corpus (including patterns of overgeneralization) and not due to the prompt, D would have to concede that the system can form original, incorrect representations. D would be moved by a pattern of errors that are novel, systematic, and inexplicable by corpus statistics.

  ### Crux 2: Intervention and Transfer

  - **Sub-question**: When we intervene on a hypothesized content-bearing direction in activation space, does the resulting behavior transfer to tasks that are structurally similar but superficially dissimilar, and does this transfer indicate that the direction corresponds to a domain-general representation?
  - **Test Design**:
    - Identify a direction in activation space (e.g., via linear probes) that is claimed to represent a concept (e.g., negation). 
    - Intervene by shifting activations along this direction during tasks that involve negation. 
    - Test whether the intervention affects behavior in tasks that are structurally dependent on negation but have different surface forms (e.g., logic puzzles, natural language inference, math problems) and survive scrambling of surface form (e.g., using different synonyms or syntactic structures).
    - Use existing techniques: activation steering, probing, and behavioral testing.
  - **Predictions**:
    - CF: Predicts that interventions will show robust transfer across task families and surface forms, indicating that the direction captures a domain-general representation.
    - D: Predicts that transfer will be limited to tasks similar to the one used to define the direction, and that any transfer can be explained by the system's capacity for pattern completion without true domain understanding.
  - **What would move each party**:
    - CF: Widespread transfer across diverse tasks and surface forms would support CF. Failure to transfer beyond a narrow set would challenge CF.
    - D: If transfer occurs only in tasks that share surface features with the training data for the probe, D would maintain their view. But if transfer occurs in tasks with no surface similarity and the behavior is consistent with the domain structure, D would concede that the internal state has a structure homomorphic to the domain. However, D would still deny that this homomorphism constitutes understanding, because it could be a byproduct of compression.

  ### Crux 3: Explanatory Credit

  - **Sub-question**: When an LLM solves a task that requires integrating information not present in any single training document but present in the corpus as a whole, is the success better explained by the content of the internal states or by the corpus statistics?
  - **Test Design**:
    - Pick tasks that require synthesizing information from multiple, disparate parts of the corpus (e.g., answering a complex question that no single document answers, but which can be pieced together from the corpus). 
    - Then, ablate or perturb internal states hypothesized to carry the relevant content and observe the effect on performance. 
    - Compare with a baseline that uses only corpus statistics (e.g., a retrieval-augmented model without the same internal representations). 
    - Use existing techniques: ablation studies, causal mediation analysis, and comparison with retrieval-based models.
  - **Predictions**:
    - CF: Predicts that ablating specific internal states will cause failure on tasks that require the integrated knowledge, while retrieval-based models without such states will perform worse on tasks requiring generalization beyond direct retrieval.
    - D: Predicts that the performance can be replicated or explained by the corpus statistics (e.g., via retrieval and recombination) and that ablation of internal states merely degrades the compression, not the underlying understanding (which they deny exists).
  - **What would move each party**:
    - CF: If ablation of specific states leads to failure on tasks that require integrated knowledge and this cannot be fixed by simply adjusting the prediction objective, CF would take that as evidence for the explanatory role of content. If no such effect is found, CF might reconsider.
    - D: If the model's performance drops upon ablation and cannot be recovered by methods that rely solely on corpus statistics (e.g., retrieval), D would concede that the internal states play a unique role. However, D would also require that the states' role not be reducible to statistical patterns.

  ### Crux 4: Answerability

  - **Sub-question**: Is the capacity to be corrected by feedback about the world (as opposed to feedback about text) constitutive of understanding, and what does it show if a system revises its output only when the feedback is rephrased in a way that changes the surface form without altering the deep content?
  - **Test Design**:
    - Present the LLM with a factual error in its output. 
    - Provide corrective feedback in two forms: (a) direct contradiction (e.g., "That's false because...") and (b) rephrased information that conveys the same correction but in different words (e.g., a restatement of the fact). 
    - Measure whether the system revises its subsequent outputs and whether the revision is sensitive to the reason given (e.g., does it generalize the correction appropriately?).
    - Use existing techniques: in-context learning with feedback and probing for belief updating.
  - **Predictions**:
    - CF: Predicts that the system can revise based on the reason given and that this revision will generalize appropriately, even under rephrasing, because the internal representation is updated.
    - D: Predicts that revision is only triggered by surface-level cues and that rephrasing that leaves the deep structure intact may not trigger revision if the surface form changes sufficiently, because the system lacks a deep representation to update.
  - **What would move each party**:
    - CF: If the system revises appropriately for both forms of feedback and generalizes the correction, CF would take this as evidence of understanding. If revision only occurs under rephrasing that matches certain patterns, CF might still hold that it shows partial understanding.
    - D: If the system revises only under specific surface forms and fails to generalize appropriately, D would take this as evidence that no deep understanding is present. However, if revision occurs robustly across rephrasings and generalizes, D would concede that the system behaves as if it understands, but might still deny that it has original content.

  ## 4. Close

  - **Each party's chosen crux**:
    - CF: Would choose **Crux 1 (Unsourced Error)** because it directly tests whether the system can form original, potentially false representations, which is a hallmark of genuine content.
    - D: Would choose **Crux 4 (Answerability)** because it tests whether the system is responsive to reasons, which D sees as essential to understanding and which they suspect the system lacks.

  - **Withdrawal sentence**:
    - CF: "We would withdraw our claim if it were shown that in every case of apparent generalization or error, the system's behavior is fully explainable by surface-level pattern matching without any need to posit contentful internal states."
    - D: "We would withdraw our claim if the system demonstrated robust, generalizable revision in response to novel domain feedback and produced unsourced errors that could not be attributed to the corpus, indicating original content."

  Now, we compile the document accordingly.
answer: |-
  ### Joint Statement: Adversarial Collaboration on LLM Understanding

  #### 1. Agreed Claims  
  Both parties affirm the following, with concessions noted:  
  1. **Training objective**: LLMs are trained solely to minimize next-token prediction loss on text corpora, without explicit reinforcement for truth-tracking, world-modeling, or coherence.  
  2. **Architecture**: Current LLMs are transformer-based neural networks that compute contextual embeddings via self-attention and feedforward layers, with no built-in mechanisms for external grounding or causal reasoning.  
  3. **Behavioral scope**: LLMs exhibit robust performance on tasks requiring compositionality (e.g., question-answering, code generation) but fail catastrophically on others (e.g., consistent counterfactual reasoning). Neither success nor failure is prima facie proof of understanding.  
  4. **Corpus dependence**: All outputs derive from statistical patterns in the training data; no novel information can be generated absent correlative antecedents in the corpus.  
  5. **Text prediction ≠ triviality**: High-fidelity text prediction necessitates modeling latent structure (e.g., grammar, ontology), but this structure need not correspond to domain content.  
  6. **No teleology**: The training process has no "goal" of understanding; gradient descent optimizes for predictive accuracy, not semantic fidelity.  
  7. **Indeterminacy of probes**: Activation patterns interpretable as "representations" (e.g., via linear probes) may reflect computational shortcuts, not content-bearing states.  
  8. **Error is unavoidable**: Hallucinations and inconsistencies arise from distributional mismatches, not random noise, and manifest predictably under adversarial inputs.  

  *Concessions*:  
  - The competence-first party concedes **Claim 4** (corpus dependence), though reluctantly, as it challenges the originality of representations.  
  - The derivation party concedes **Claim 5** (non-triviality), though reluctantly, as it grants internal structure beyond memorization.  

  #### 2. Disagreements Table  
  | Neutral Statement | Competence-First Formulation | Derivation Formulation | Classification & Reason |  
  |-------------------|-------------------------------|------------------------|--------------------------|  
  | Whether internal states track domain structure or corpus statistics. | "Internal states encode domain structure (e.g., 'atom' denotes atomic physics), enabling generalization beyond corpus surface forms." | "Internal states encode statistical correlations among tokens (e.g., 'atom' co-occurs with 'proton'), with no domain-specific truth conditions." | **Substantive**: Disagreement hinges on what internal states refer to (world vs. text). |  
  | Whether generalization implies understanding. | "Systematic generalization to novel contexts (e.g., applying physical laws to untrained scenarios) demonstrates understanding." | "Generalization is interpolation within the corpus distribution; apparent novelty stems from underspecification in training data." | **Partly verbal**: Turns on "understanding." Competence-first ties it to *robust generalization*; derivation to *independent verification*. |  
  | Whether explanations credit content or compression. | "Task success is best explained by content-tracking states (e.g., solving physics problems via internal mechanics models)." | "Task success is best explained by lossless compression (e.g., parameters storing frequent n-grams for physics discourse)." | **Substantive**: Disagreement over explanatory primacy (content vs. information theory). |  
  | Whether error implies misrepresentation. | "Hallucinations are misrepresentations (e.g., false claims about nonexistent events), showing states track world, not text." | "Hallucinations are prediction errors (e.g., overfitting to minority corpus patterns), showing states track text, not world." | **Verbal**: Disagreement reduces to "misrepresentation." Competence-first defines it as *world-mismatch*; derivation as *corpus-mismatch*. |  

  *Partly verbal resolution*: Replace "understanding" with "behavioral competence + counterfactual robustness." Dispute becomes: Does competence in novel contexts require domain-tracking states?  

  #### 3. Cruxes  
  **Crux 1: Unsourced Error**  
  - **Sub-question**: Can an LLM generate errors traceable solely to novel, world-mismatched representations (not corpus artifacts)?  
  - **Test**: Fine-tune on *correct* examples of a novel domain (e.g., a synthetic chemistry with rules absent from corpus). At test time, introduce subtle contradictions (e.g., "Element X decays in 5s" when rules require 10s). Probe if errors persist despite corpus consistency.  
  - **Predictions**:  
    - Competence-first: Errors will emerge from flawed rule internalization.  
    - Derivation: Errors will mirror corpus ambiguities (e.g., conflating "decay" with similar terms).  
  - **Move conditions**:  
    - Competence-first: Moved if errors correlate with rule complexity, not lexical similarity.  
    - Derivation: Moved if errors occur only when rules contradict *all* corpus precedents.  

  **Crux 2: Intervention and Transfer**  
  - **Sub-question**: Do activation interventions induce behavior consistent with domain structure or surface correlations?  
  - **Test**: Identify a "logical negation" direction via probing. Intervene to amplify negation in arithmetic tasks (e.g., "2+2≠5"). Test transfer to structurally similar but superficially distinct domains (e.g., moral reasoning: "Killing ≠ permissible") with scrambled syntax.  
  - **Predictions**:  
    - Competence-first: Intervention will affect all negation-dependent tasks, regardless of surface form.  
    - Derivation: Intervention will only affect tasks with lexical/structural similarity to probing data.  
  - **Move conditions**:  
    - Competence-first: Moved by cross-domain transfer resistant to adversarial paraphrasing.  
    - Derivation: Moved if transfer requires no retraining and generalizes to low-similarity tasks.  

  **Crux 3: Explanatory Credit**  
  - **Sub-question**: Does task success require content-tracking states or merely corpus statistics?  
  - **Test**: Use causal mediation analysis on tasks requiring cross-document synthesis (e.g., "Compare climate policies of X and Y" where no single document discusses both). Ablate candidate "policy comparison" neurons. Contrast with a retrieval-based baseline using the same corpus.  
  - **Predictions**:  
    - Competence-first: Ablation degrades performance more than retrieval baseline.  
    - Derivation: Retrieval baseline matches LLM, and ablation effects correlate with token frequency.  
  - **Move conditions**:  
    - Competence-first: Moved if ablation uniquely disrupts inference-heavy tasks (not retrieval-heavy ones).  
    - Derivation: Moved if ablating random directions causes equal degradation.  

  **Crux 4: Answerability**  
  - **Sub-question**: Is revision in response to reason-giving feedback constitutive of understanding?  
  - **Test**: Feed identical corrections in two formats: (A) Direct: "You erred because [reason]"; (B) Rephrased: "[Equivalent reason] in new syntax." Measure revision depth via probe confidence shifts.  
  - **Predictions**:  
    - Competence-first: Revision occurs for both formats, with similar activation changes.  
    - Derivation: Revision only occurs for (A); (B) requires surface-level retuning.  
  - **Move conditions**:  
    - Competence-first: Moved if (B) induces revisions generalizing beyond local context.  
    - Derivation: Moved if (A) and (B) produce divergent activation trajectories.  

  #### 4. Close  
  - **Single crux choice**:  
    - Competence-first: **Crux 1 (Unsourced Error)**. Justification: "Novel errors would prove states track world, not text."  
    - Derivation: **Crux 4 (Answerability)**. Justification: "Robust reason-based revision would show content responsiveness."  
  - **Withdrawal condition**:  
    - Competence-first: "We withdraw if *all* behaviors redound to corpus statistics under decomposition."  
    - Derivation: "We withdraw if unsourced errors persist and revision is reason-sensitive across domains."  

  ---  
  **Document length**: 8 agreed claims, 4 cruxes with operationalized tests.  
  **Attestation**: Both parties confirm this reflects their views without attributing spurious claims.
