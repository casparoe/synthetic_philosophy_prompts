  Let me reconstruct each position carefully. The direct-reference camp uses Kripke's modal, epistemic, and modal innocence arguments. Descriptivists concede rigidity via "actually"-operators but deny it requires abandoning descriptive content. Two-dimensionalists propose dual intensions but get criticized by both sides - Kripkeans say it conflates meaning with epistemic access, descriptivists see it as their own view relabeled.

  The user's semantic/metasemantic distinction seems spot-on for diagnosing the stall. It explains why descriptivists can accept rigidity (semantic claim) while rejecting direct reference (metasemantic claim). This isn't entirely original - it echoes Devitt's causal-historical theories and Stalnaker's pragmatics - but the user articulates it with unusual clarity regarding the modal argument's limitations.

  The core disagreement combines multiple elements: it's about explanatory burdens (what semantics must account for), verbal disputes (how we define "semantic content"), and bedrock intuitions (about reference itself). The key move doing real work is descriptivists' rigidification device - it exposes that rigidity alone doesn't entail anti-descriptivism. 

  For progress, we need controlled cases testing the metasemantic layer. Imagine a community where names are explicitly introduced descriptively ("Let 'Alpha' denote whoever invented calculus") but used rigidly. Would speakers judge "Alpha might not have invented calculus" as true? This could isolate whether rigidity operates at semantic or metasemantic levels. Alternatively, formal work could show whether two-dimensional frameworks inevitably smuggle in descriptivist commitments.

  The bottom line: This is primarily a clash about semantics' explanatory scope, exacerbated by conflation of semantic and metasemantic claims. I suspect it's solvable through careful distinction-drawing and targeted case studies, but not through pure argumentation - empirical and formal work must supplement conceptual analysis.
answer: |-
  ### 1. The dialectic as I reconstruct it (200 words)
  - **Direct Reference (DR)**: Grants that names *are* rigid but argues rigidity *entails* non-descriptiveness. Uses three arguments:  
    (i) **Modal**: Names track bearers in counterfactuals where descriptions fail.  
    (ii) **Epistemic**: Identity statements ("Hesperus = Phosphorus") can surprise us, so names can't share descriptive content.  
    (iii) **Modal Innocence**: If names meant descriptions, "Nixon lost" would be necessary (since Nixon = the winner of 1968 US election).  
    Denies that rigidity can be captured descriptively without trivializing the debate.  

  - **Descriptivism**: Concedes rigidity *can* be descriptively captured (via "actually"-operators: "the actual F"). Grants DR’s data but denies their *interpretation*: rigidity doesn’t refute descriptivism. Argues DR conflates rigidity with metasemantic directness. Denies that epistemic or modal arguments show names *lack* descriptive content.  

  - **Two-Dimensionalism (2D)**: Grants DR’s rigidity and descriptivism’s cognitive roles but splits labor: **primary intension** (epistemic/content) handles cognitive significance; **secondary intension** (modal) handles counterfactual truth. Denies this is merely redescriptivism, claiming it explains necessary a posteriori.  
    *Correction to your framing*: 2D *does* model ignorance (via primary intension), contra Kripke’s objection—it’s central to their epistemic project.  

  *Unfairness in your summary*: Descriptivists’ "explicit stipulation" case isn’t a concession—it’s meant to show rigidity *requires* no metasemantic break from descriptivism. DR sees this as equivocating on "denotation."

  ---

  ### 2. My hypothesis, assessed (250 words)
  Your hypothesis—that "rigid designator" conflates **semantic rigidity** (reference fixed across worlds) and **metasemantic rigidity** (reference fixed without descriptive mediation)—explains the stall perfectly.  
  - **Why it fits**:  
    - DR uses modal arguments to establish *semantic* rigidity but concludes *metasemantic* directness.  
    - Descriptivists grant semantic rigidity (via "actually") but deny metasemantic directness.  
    - 2D splits the difference: primary intension handles metasemantic mediation (e.g., reference-fixing descriptions), secondary intension handles semantic rigidity.  
  - **Originality**: Not novel (cf. Stalnaker’s pragmatics, Soames’ critique of 2D), but your framing sharpens the confusion.  
  - **Breakdown**:  
    - **For DR**: They’ll reject the split, insisting rigidity *must* be metasemantic—else "rigidity" is trivialized (any term can be rigidified).  
    - **For descriptivists**: They’ll argue metasemantic mediation *is compatible* with rigidity (per "actually").  
    - **For 2D**: They accept the split but face charges of relabeling descriptivism.  

  The core issue: **Rigidity alone doesn’t entail anti-descriptivism**. Your hypothesis exposes the modal argument as invalid for metasemantic conclusions—it’s a non sequitur without auxiliary premises about how reference *must* be determined.

  ---

  ### 3. What kind of disagreement this is (400 words)
  This is **three overlapping disputes**:  
  1. **Explanatory burdens**: What must semantics explain?  
     - DR: Truth conditions, modal profiles.  
     - Descriptivists: Cognitive significance, learnability.  
     - 2D: Both, via dual intensions.  
     *Stalemate point*: No agreement on whether "grasping meaning" requires access to reference-fixing conditions.  

  2. **Verbal dispute about "semantic content"**:  
     - DR: Content = reference (for singular terms).  
     - Descriptivists: Content = descriptive condition (possibly rigidified).  
     - 2D: Content = primary intension (secondary is "extension").  
     *Key clash*: Is rigidity a property of *meaning* or *use*?  

  3. **Bedrock intuitions about reference**:  
     - DR: Intuition that "Gödel" refers directly to Gödel, not "the prover of incompleteness."  
     - Descriptivists: Intuition that names *convey information* (e.g., "Hesperus" = evening star).  
     - *Empirical element*: Speakers’ judgments about counterfactuals (e.g., "If Gödel died young, would ‘Gödel’ refer to Schmidt?") *could* be tested—but results would be theory-laden.  

  **Core diagnosis**: The **descriptivist rigidification move** is doing real work. It exposes DR’s modal argument as establishing *only* semantic rigidity. The **distractions** are:  
  - Epistemic arguments (rebutted by rigidified descriptivism).  
  - 2D’s machinery (seen as ad hoc by opponents).  
  The **fundamental divide** is metasemantic: *Must reference-fixing be descriptive?* DR says yes for meaning-determination, no for reference; descriptivists say no for meaning-determination; 2D says yes for primary content.

  ---

  ### 4. What would count as progress (250 words)
  **Concrete steps**:  
  1. **Isolate metasemantic intuitions**: Test speakers on cases where reference-fixing is explicit:  
     - Scenario: "Let ‘Alpha’ denote whoever invented calculus. Now, could Alpha have failed to invent calculus?"  
     - *Prediction*: If speakers judge this contingent, it supports descriptivism/2D; if necessary, DR.  
     - *Progress*: Empirical data on whether rigidity is intuitively tied to *how* reference is fixed.  

  2. **Formal constraint on 2D**: Show whether two-dimensional frameworks *must_ encode descriptivist metasemantics.  
     - *Example*: Prove that for any primary intension, there’s an equivalent reference-fixing description.  
     - *If provable*, 2D collapses into descriptivism. If not, it’s a distinct option.  

  3. **Shift to metasemantic cases**: Run arguments from **reference failure** or **partial competence**:  
     - Case: A speaker associates "Feynman" only with "a physicist." Does "Feynman" refer?  
     - DR: Yes (causal chain).  
     - Descriptivists: No (satisfied condition needed).  
     - *Progress*: Forces clarity on whether semantics depends on speaker knowledge.  

  4. **Modality test**: Rigidify *non-descriptive* terms (e.g., "actually this very thing").  
     - Challenge descriptivists: Can they rigidify without implying the term *meant* "the actual F"?  
     - *Progress*: Exposes if "actually" smuggles in descriptivism.  

  **Goal**: Break the link between semantic rigidity and metasemantic directness by testing intuitions at the reference-fixing level.

  ---

  ### 5. Bottom line (100 words)
  **One-sentence diagnosis**: The stalemate arises because semantic rigidity is conflated with metasemantic directness, and the dispute is ultimately about whether reference-fixing must be descriptive—a question of explanatory priorities, not logic or data.  
  **Solvability?**: **Yes, but not by pure argument**—progress requires empirical work on metasemantic intuitions and formal constraints on frameworks like 2D, as semantic theory’s role is negotiated, not discovered.
