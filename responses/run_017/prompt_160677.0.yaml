prompt: |-
  I work on policy at a mid-sized social platform and I've been given the delightful task of rewriting our internal guidance on slurs. Not a banned-word list — we have one of those and it's useless — but an actual explanation of why one flagged post is a violation and another that contains the exact same word isn't, written so that a reviewer with no philosophy training and thirty seconds per case can apply it. I keep reading papers in the semantics and pragmatics literature and coming away feeling like they were built for a totally different purpose than mine (explaining intuitions about reported speech in a seminar room, mostly), so before I read any more of them I want the spec. Please write me the desiderata: what an account of slurs would have to deliver to be adequate *for this job*, with the case or consideration behind each requirement, so I can hold the literature up against it instead of the other way round.

  The phenomena it has to handle — and please use the messy versions, because these are the ones that actually show up in our queue: a slur used by a member of the targeted group in a song or a comment thread, and the same token surfaced by our recommender to an out-group listener; a slur inside negation, a question, the antecedent of a conditional, or an indirect report ('she said he called him the n-word'), where the reviewer has to decide whether derogation survived; a slur aimed at someone who isn't a member of the targeted group, used as a generic insult; a slur quoted for educational or documentary purposes, or appearing as a screenshot of a dictionary entry; a word that's a slur in one dialect or language and an ordinary term in another, or a borrowed word whose speakers genuinely don't know its valence; a respelled, emoji-substituted, or initialism version that most users read as the slur anyway; and — the one that broke my brain — a slur invented for a fictional group in a novel or game (a slur for androids, for a made-up fantasy race) that gets used in-character, plus the newer case where a bot or language model emits a real slur with nobody's intentions behind it at all. I'd also want requirements about the distinctions it can't collapse: slur versus plain pejorative or insult, slur versus taboo word, derogation versus offensiveness versus harmfulness, targeting a group versus targeting an individual, and being a slurring word versus being used as one. For each, say what breaks if a theory collapses it.

  Then the part I actually care about: mark which requirements are non-negotiable for my purpose and which are just the prejudices of one camp (I don't need the theory to be elegant, or to keep slurs out of semantic content, or to preserve compositionality in any strong sense — but I do need it to be usable by someone who cannot know what the speaker was thinking, and to give stable answers across time as reclamation happens). Flag any pair of requirements you suspect can't be jointly satisfied — my guess is that 'explain why derogation tracks speaker endorsement or group membership' and 'be applicable without access to intentions or identity' pull apart, and I want to know if there are others. Tell me which single requirement does the most work in ruling out candidate theories. And only after all that, give me a short scorecard — a couple of sentences each, not a table of essays — for the main contenders as you'd characterize them by content: the expressivist view that slurs add a separate expressive or attitudinal component, the prohibition view that the ban itself does the work, conventional-implicature and presuppositional treatments, and any contextualist or reclamation-friendly view. Please write the whole thing in American English, and feel free to tell me if the honest conclusion is that no existing account is adequate for what I'm asking.
reasoning: |-
  Okay, the user works on policy at a social platform and needs to rewrite internal guidance on slurs. They're frustrated with academic papers that don't address real-world moderation challenges. Their request is very specific: they want desiderata for a practical theory of slurs that can be applied quickly by content reviewers.

  I need to understand their core problem. They're not looking for banned-word lists but for principles explaining why some uses violate policies while others don't. The examples they provided are messy real cases: in-group reclamation, fictional slurs, educational quotes, dialect variations, and even AI-generated content. They also need distinctions between slur vs pejorative, taboo words, and concepts like derogation vs offensiveness.

  The key constraints are: reviewers have 30 seconds per case, no access to speaker intentions or identity, and decisions must remain stable despite language evolution (like reclamation). The theory must be operationalizable by non-experts.

  For desiderata, I'll organize them into non-negotiable requirements and preferred-but-flexible ones. Non-negotiables include: no mind-reading (since reviewers can't know intent), time pressure compatibility, stability across reclamation, and handling of quoted/reported speech. Important distinctions include slur vs generic insult (since the latter might not violate policy) and derogation vs offensiveness (as offensiveness alone shouldn't determine violations).

  I suspect tensions between requirements. For example, "derogation tracking speaker endorsement" conflicts with "no access to intentions." Also, "stability across reclamation" might clash with "time pressure" if reviewers need deep cultural awareness.

  For existing theories: Expressivism (slurs carry attitudes) might struggle with fictional cases. Prohibition theory (taboo creates offense) fails at reclamation. Conventional implicature (built-in offense) can't handle reclaimed uses. Contextualist views (meaning depends on context) are promising but complex for quick decisions.

  The honest conclusion might be that no existing theory fully meets all requirements. Practical solutions might involve combining elements from multiple theories while accepting some inconsistencies, perhaps with clear decision trees for reviewers.
answer: |-
  Here’s a specification of desiderata for a practical theory of slurs in content moderation, designed to filter academic theories for your use case. Requirements are categorized, tensions flagged, and major theories scored.

  ---

  ### **Core Problem**: Operationalize "derogation" (group-based dehumanizing contempt) vs. other offense/harm, under time pressure, without mind-reading.

  ---

  ### **Non-Negotiable Requirements**  
  *(Fail any = useless for policy)*  

  1. **No Mind-Reading Required**  
     - **Case**: Reviewers can’t access speaker identity/intent (e.g., anonymous user, bot).  
     - **Breakage**: If theory relies on knowing if user is in-group or "endorsing" the slur, reviewers stall.  

  2. **30-Second Applicability**  
     - **Case**: Must yield consistent decisions via simple heuristics (e.g., "if X context, then Y").  
     - **Breakage**: Overly complex disambiguation (e.g., calculating speaker commitment in conditionals) fails.  

  3. **Stability Despite Reclamation**  
     - **Case**: Same word (e.g., "queer") can be reclaimed in LGBTQ+ spaces but a violation if used by a neo-Nazi.  
     - **Breakage**: Static theories (e.g., "slur = always derogatory") misflag reclaimed uses or miss reclamation shifts.  

  4. **Distinguish Derogation from Mere Offense**  
     - **Case**: "Fuck you" (taboo, offensive) vs. racial slur (derogatory). Policy bans group-based derogation, not all offense.  
     - **Breakage**: Collapsing these leads to over-removal (banning all curses) or under-removal (treating slurs as "just rude").  

  5. **Handle Quoted/Reported Speech Robustly**  
     - **Case**: "She called me a [slur]" (reporting abuse) vs. "I hate [slur]" (using abuse).  
     - **Breakage**: If negation/reporting erases violation, victims can’t report harassment; if not, educational/discussion posts banned.  

  ---

  ### **Critical Distinctions**  
  *(Collapsing breaks policy fairness)*  

  6. **Slur vs. Generic Insult**  
     - **Case**: "You’re a [slur for Group X]" vs. "You’re a [slur]!" aimed at someone outside Group X (e.g., "k*ke" to a Latina).  
     - **Breakage**: If "slur = always derogatory", misapplies to non-group-targeted insults. If not, misses weaponization.  

  7. **Derogation vs. Taboo/Shock Offense**  
     - **Case**: Slur in academic paper vs. in hate speech.  
     - **Breakage**: Banning all occurrences ignores documentary/educational value; allowing all ignores harm.  

  8. **Word-as-Slur vs. Word-Used-as-Slur**  
     - **Case**: "Sp*z" (medical term in UK, slur in US) used innocently by non-native speaker.  
     - **Breakage**: Treating words as inherently slurs bans legitimate uses; ignoring context allows weaponized ambiguity.  

  ---

  ### **Preferred but Negotiable**  
  *(Needed for coverage, but workarounds exist)*  

  9. **Explain Fictional/Novel Slurs**  
     - **Case**: In-game use of "toaster" as anti-android slur vs. real-world bigot testing boundaries.  
     - **Breakage**: Over-removal (banning fantasy RP) or under-removal (ignoring dog-whistles).  

  10. **Handle AI/Bot Generation**  
      - **Case**: LLM outputs racial slur with no human intent.  
      - **Breakage**: If theory requires speaker attitude, AI slips through; if not, humans get over-penalized.  

  11. **Respellings/Substitutions**  
      - **Case**: "n*gga" → "n!gg@", "n-word", "🅱️itch".  
      - **Breakage**: Literal token-matching fails; requires intent/uptake assessment (problematic under #1).  

  ---

  ### **Tensions Between Requirements**  
  - **Derogation Tracks Speaker Endorsement/Identity** vs. **No Mind-Reading**  
    - *Conflict*: Derogation often depends on speaker in-group status or intent, but reviewers can’t verify these.  
  - **Stability Across Time** vs. **Handle Reclamation**  
    - *Conflict*: Reclamation is dynamic; stability demands consistent rules. Risk: outdated heuristics.  
  - **Explain Contextual Variance** vs. **30-Second Applicability**  
    - *Conflict*: Nuance (e.g., conditionals) requires context parsing; time pressure demands binary flags.  

  **Most Exclusionary Requirement**: **#1 (No Mind-Reading)**. Eliminates theories relying on speaker psychology (e.g., expressivism, some CI accounts).

  ---

  ### **Theory Scorecard**  
  *(Evaluated against non-negotiables)*  

  - **Expressivism** (Slurs express non-propositional contempt):  
    Fails #1 (needs intent), #3 (can’t explain reclamation), #5 (struggles with reports). Strong on #4.  

  - **Prohibition Theory** (Taboo via prohibition creates offense):  
    Fails #4 (derogation ≠ offense), #7 (collapses taboo/slur), #3 (ignores reclamation). Simple but crude.  

  - **Conventional Implicature (CI)** (Slurs conventionally encode offense):  
    Fails #3 (reclaimed uses still "encode" offense?), #5 (CI projects in reports/conditionals → false violations).  

  - **Presuppositional** (Slurs presuppose target’s inferiority):  
    Fails #5 (presuppositions survive negation/reports → over-removal), #6 (can’t explain non-group-directed insults).  

  - **Contextualist/Reclamation-Friendly** (Meaning shifts with context/speaker):  
    Best on #3/#8. Fails #1 (needs speaker ID/context depth), #2 (complex context assessment). Partial fix: "Default derogation + override if X" (e.g., self-reference + in-group space).  

  ---

  ### **Conclusion**  
  **No existing theory fully satisfies all non-negotiables.** The **contextualist** approach comes closest but requires simplification for reviewability (e.g., codifying "override" contexts like self-reference + community tagging). Prioritize:  
  - **Operationalize context cues** (e.g., "if self-referential + in-group space + non-hate topic → allow; else block").  
  - **Accept imperfection** (e.g., bot-generated slurs may need removal regardless of "intent").  
  - **Distinguish harm tiers**: Slurs targeting real groups = high harm (ban in doubt); fictional/escaped = case-by-case.  

  **Recommendation**: Build a heuristic framework combining:  
  (a) *Default prohibition* on tokens in high-harm contexts (direct insults, out-group use),  
  (b) *Explicit exceptions* (quotes with condemnation, in-group reclamation tags),  
  (c) *Regular updates* for reclamation/respellings. Pair with reviewer training on **derogation vs. offense** and **context flags** (e.g., "is this attacking a real group?").
