prompt: |-
  Hey — I'm a journalist. I cover science and ideas for a daily, and I also sit on our standards desk, so a solid chunk of my week goes into arguing about indvidual words. That's the background for what I need.

  We're drafting a house rule for labeling mass atrocity — internally we call it the ladder. Rungs, roughly: massacre, atrocity, crimes against humanity, ethnic cleansing, genocide. Each rung carries (a) an evidentiary threshold, (b) a rule about who has to have said the word first before we can use it unattributed — a court, a UN inquiry, two named human-rights organizations, a government? — and (c) a downstream consequence, meaning which rung gets it on the front page, which gets a planned follow-up, which gets a sidebar explaining the word itself. The ladder works fine for the lower rungs. It falls apart at the top one, and I think that's because I only half-undersand the concept up there.

  So: restate Lemkin's genocide in desk vocabulary, as faithfully as you can. My side I'm completely fluent in — news peg, lede, attribution, "allegedly," balance and false balance, news values, hard versus soft news, correction-and-retraction norms, the reflex that we don't use the word until a court does, the wall between news and opinion copy, and the plain fact that a story needs an event and a named person to work at all. On Lemkin's side I'm a well-read generalist: I know he minted the term, that he meant it to cover a composite of techniques aimed at a group as such and not just killing, and that the intent element is where all the difficulty lives.

  Then I want the residue report, in three buckets: what maps cleanly onto an evidence-and-labeling problem, what fits only if I bend it, and what has no expression in desk vocabulary whatsoever. My guesses at the untranslatable parts: the victim here is a collectivity, but my stories need an individual face; most of the techniques he actually cared about — closing the schools, killing the language, breaking up the economic base — are non-events, so they generate no peg; and the concept is built to fire before the thing is finished, while every norm I have is built to fire only after someone authoritative has ruled. Tell me whether those are the right guesses and, more usefully, what I've left out.

  Then the verdict on the residue. Is what won't translate a defect in newsroom vocabulary — something we genuinely can't say — or is it a sign that the concept is doing less work in a headline than we pretend it is? And concretely: should the top rung of my ladder exist at all, or should the rule be written so that it names the techniques and leaves the g-word to quoted sources?
reasoning: |-
  Okay, let me unpack this journalist's query about genocide terminology. They're crafting an editorial "ladder" for labeling atrocities, but struggling with the top rung - genocide. Their framework considers evidence thresholds, attribution rules, and editorial consequences, which works for lower levels but falters at genocide. 

  First, I need to translate Lemkin's concept into newsroom terms. Lemkin saw genocide as a coordinated pattern of actions aimed at destroying a group's existence - not just killing, but erasing their cultural and social foundations. The key elements are: 1) targeting a specific group, 2) systematic destructive acts beyond murder, and 3) intent to destroy the group "as such." 

  Now assessing the translation challenges: The collectivity focus clashes with journalism's need for individual faces. Non-event techniques like banning languages resist news pegs. The preventive nature conflicts with journalism's reactive stance. And intent is inferential - requiring conclusions from patterns rather than direct evidence. 

  For the residue report: What maps cleanly? Group identification and overt acts like massacres fit. What requires bending? Assessing systemic patterns and inferring intent - journalism can do this but awkwardly. What's untranslatable? The preventive essence and the group-as-victim paradigm fundamentally resist news conventions.

  My verdict: The untranslatable elements reveal limitations in news vocabulary, not flaws in the concept. Genocide's power lies in its preventive design - precisely what journalism struggles to convey. Practically, I'd recommend keeping the top rung but with modified rules: require multiple independent attributors, mandate explanatory sidebars, and use the term only when the pattern is advanced. The alternative - avoiding the term entirely - risks obscuring the distinct nature of these crimes.

  The core tension is that genocide was conceived as an alarm bell, while journalism treats it as a verdict. This disconnect explains why the ladder falters at the top rung.
answer: |-
  Below is a step-by-step breakdown addressing your needs, structured for newsroom utility. I've distilled Lemkin, mapped the translation gaps, and provided concrete recommendations for your "ladder."

  ---

  ### **1. Lemkin's Genocide in Desk Vocabulary**
  **Core Definition (Lemkin Simplified for News):**  
  *"A state-led pattern of coordinated acts (beyond just killing) designed to destroy the essential foundations of a specific human group — national, ethnic, religious — with intent to eliminate its existence long-term. Key techniques: killing members, preventing births, forcibly transferring children, or systematically erasing culture/identity (language, schools, institutions)."*

  **Desk Translation:**  
  - **News Peg:** The *ongoing pattern* is the event. Peg to new evidence (satellite imagery, leaked docs), milestone reports (UN, NGOs), or policy shifts (e.g., laws banning minority language).  
  - **Attribution:** Requires named sources establishing both *acts* (e.g., HRW report on mass graves) and *intent* (e.g., UN memo citing orders to "erase [Group]").  
  - **"Allegedly":** Mandatory until validated by authoritative bodies.  
  - **Balance:** Not "both sides" on facts, but rigorous verification. Contrast official denials with evidence.  
  - **Labeling Threshold:** Highest tier — requires multiple, corroborated sources showing systematic destruction beyond isolated atrocities.

  ---

  ### **2. Residue Report: What Translates, What Bends, What Breaks**
  | **Bucket**          | **Elements**                                                                 | **Newsroom Fit**                                                                 |
  |----------------------|------------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | **Maps Cleanly**     | - Group identification (ethnic/religious)                                    | Fits: Groups named in reports (e.g., "Rohingya," "Uyghurs").                     |
  |                      | - Overt acts (mass killings, forced sterilization)                           | Fits: Documented events with evidence (photos, witness accounts).                |
  |                      | - Legal rulings (ICC warrants, UN commissions)                               | Fits: Directly aligns with attribution standards.                                |
  | **Requires Bending** | - *Intent to destroy the group*                                              | Bends: Inferred from patterns (e.g., systematic cultural erasure + hate speech). Requires deep sourcing. |
  |                      | - *Composite techniques* (not just killing)                                  | Bends: Non-events (school bans) need peg linkage (e.g., "New policy closes last Kurdish-language school"). |
  | **Untranslatable**   | - **Victim = Collectivity**                                                  | Breaks: Stories demand individuals; genocide's victim is the *group's future*.   |
  |                      | - **Preventive design** (Lemkin's focus: stop *before* completion)           | Breaks: News norms react to events, not forecasts.                               |
  |                      | - **Non-event techniques** (language bans, economic suffocation)             | Breaks: No "event" to peg unless tied to enforcement (raids, laws).              |
  |                      | - **"Group destruction" ≠ body count**                                       | Breaks: Cultural erasure is process-oriented; news values body counts/trials.   |

  **Your Guesses Confirmed & Additions:**  
  - ✅ **Correct:** Collectivity vs. individual faces, non-event techniques, preventive gap.  
  - **Missing:** **Temporal scale** (genocide unfolds over years; news cycles demand immediacy). **Intent as inference** (courts debate intent for decades; news can't wait). **Normalized violence** (daily oppression lacks "breaking news" hooks).

  ---

  ### **3. Verdict on the Residue**
  **a) Is it a Newsroom Defect or a Flaw in the Concept?**  
  - **Defect in news vocabulary**, not the concept. Genocide is a *process*; journalism is built for *events*. The untranslatable elements (prevention, collectivity, slow erasure) are precisely what make genocide distinct. Abandoning the term cedes ground to euphemisms ("ethnic conflict").  

  **b) Should the Top Rung Exist?**  
  - **Yes, but with critical adjustments:**  
    - **Labeling Rule:** Use "genocide" **only** when:  
      - (i) Multiple independent bodies (ICC + UN inquiry + 2 major NGOs) use the term, *or*  
      - (ii) Your investigation documents *all* key elements (acts + intent + group destruction) with cross-verified evidence.  
    - **Consequences:**  
      - Automatic front-page placement **with a glossary sidebar** explaining the term and evidentiary basis.  
      - Mandatory follow-ups tracking legal/political developments.  
      - Prohibition in headlines without attribution (e.g., "UN: Genocide Underway in X").  

  **c) Alternative: Name Techniques, Avoid "Genocide"?**  
  - **Unwise.** This fragments coverage ("school closures + mass graves + forced births") and obscures the *coordinated intent to destroy*. Retain the term but:  
    - **Use it sparingly** (aligns with your ladder's rigor).  
    - **Always contextualize** (e.g., "The policy, termed genocide by Amnesty and the UN, targets Yazidi cultural sites...").  
    - **Delegate when uncertain:** Use "acts constituting genocide" (per UN definition) until criteria met.

  ---

  ### **Recommendation for Your Ladder**
  | **Rung**              | **Evidentiary Threshold**                          | **Attribution Required**                     | **Downstream Consequence**                     |
  |------------------------|---------------------------------------------------|----------------------------------------------|-----------------------------------------------|
  | **Genocide**           | Pattern of acts + intent to destroy group         | ICC/UN *or* 3 major NGOs + state recognition | Front page + sidebar + follow-up tracker      |
  | **Ethnic Cleansing**   | Systematic expulsion of ethnic group              | UN report + 1 NGO + state acknowledgment     | Front page, no sidebar required               |
  | **Crimes Against Humanity** | Widespread attacks on civilians                | ICC warrant *or* UN inquiry + NGO report     | Section lead, explain legal term in body      |
  | **Atrocity**           | Severe violence (e.g., mass rape, torture)        | 2 named NGOs or government report            | Standard reporting, no special treatment      |
  | **Massacre**           | Single large-scale killing of civilians           | Eyewitness + 1 official source               | Routine coverage                              |

  **Why This Works:**  
  - **Top rung integrity:** Genocide requires the highest bar, aligning with its gravity.  
  - **Manages residue:** Sidebars address conceptual gaps; attribution offsets untranslatable intent.  
  - **Journalistic realism:** Uses existing tools (sourcing, explainers) without overpromising.  

  Genocide's "untidiness" isn't a bug—it's a reflection of its moral stakes. Your ladder should name it, but scaffold it rigorously.
