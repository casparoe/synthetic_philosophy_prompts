answer: |-
  Your "dead code" point hits a real issue: malfunction. When that mutation repurposes P from predator detection to drowsiness, I agree P *currently* triggers sleep. But teleosemantics distinguishes proper function (what the mechanism was designed for) from accidental effects. Selection built P as a predator alarm—that's its job description etched in evolutionary history. The mutation breaks it, like a heartbeat arrhythmia doesn't redefine the heart's purpose. P still *means* predator—it’s just broken. The unused branch? If it was never selected, it’s noise—no function, no content. Your "live downstream use" conflates causation with meaning.  

  Copy-paste is trickier. That molecule-perfect duplicate behaves identically, sure. But without selection history, its states lack proper functions—they weren’t *designed* to track anything. It’s a philosophical zombie for content: outputs match, but the inner states are empty symbols. Meaning isn’t in the structure alone; it’s in why the structure exists. Your duplicate has syntax (causal hooks) without semantics (grounded purpose). That’s not spooky—it shows content is relational, not intrinsic. History anchors the "aboutness."  

  \answer{conceded: current use can dominate behavior in malfunctions; still holding: content derives solely from selection history, not structure or present effects}
