prompt: |-
  I'm in the final year of a psychology degree and taking a module on evidence and replication. One of the popular books on bad science that we were pointed to summarises the situation roughly like this:

  "Psychology's replication crisis showed that most of the published literature is false: when the Reproducibility Project repeated a large sample of published studies, fewer than half of them replicated. The mechanism is p-hacking. A result counts as significant when its p-value falls below 0.05, and a significance test comes out significant 5% of the time even when nothing is going on, so about one in twenty of the significant findings in the literature is a false positive; add publication bias and chronically underpowered samples and the false-discovery rate climbs far higher still. The remedy is to go Bayesian. Bayes' theorem gives you the probability that the hypothesis is true given the data, and unlike a p-value it does not depend on the analyses you could have run but didn't report, so a default Bayes factor, using the standard Cauchy prior on effect size, is an objective measure of evidence that no amount of optional stopping can inflate. Lindley's paradox settles the matter: p-values and Bayes factors can contradict each other, and whenever they do it is the p-value that is wrong. Had psychology been reporting default Bayes factors all along, the replication crisis would never have happened."

  On the strength of arguments like this, our seminar leader wants our group project to pre-register its analysis, report default Bayes factors and credible intervals instead of p-values and confidence intervals, and treat any Bayes factor below three as inconclusive. I find the Lindley point genuinely persuasive, and "the probability that the hypothesis is true given the data" and the one-in-twenty line both strike me as too neat — but I can't tell whether that is a real worry or just my own suspicion, and I don't want to object unfairly.

  Could you audit the passage for me: which sentences a statistician would accept, which are standard simplifications, and which are misrepresentations or overstatements? In particular, is a default Bayes factor really insensitive to the stopping rule and to the choice of prior, does the Lindley argument really show that the p-value is the one in the wrong, and does the policy our seminar leader wants actually follow from the parts of the summary that survive correction?
reasoning: |-
  Okay, the user is in their final year of a psychology degree and dealing with a module on evidence and replication. They've been given a passage from a popular book on bad science that makes several strong claims about the replication crisis in psychology and promotes Bayesian methods as the solution. Their seminar leader is pushing for their group project to adopt pre-registration, report Bayes factors, and use credible intervals instead of traditional p-values. The user is skeptical about some parts of the passage, particularly the one-in-twenty false positive claim and the idea that Bayes factors provide "the probability that the hypothesis is true given the data." They're also questioning the Lindley's paradox argument and whether their seminar leader's requirements are justified.

  The user wants me to audit the passage, identifying which parts are accurate, which are simplifications, and which are misrepresentations. They specifically want to know about the robustness of default Bayes factors to stopping rules and priors, whether Lindley's paradox definitively shows p-values are wrong, and if their seminar leader's policy logically follows from valid points.

  Breaking down the passage:
  The claim about "most published literature being false" is hyperbolic but reflects a real issue - the Reproducibility Project did find only about 36% replication rate. However, "false" is too strong - non-replication can happen for many reasons beyond false positives. 

  The one-in-twenty false positive rate is misleading. It assumes all studies test true nulls with 100% power and no other issues, which is unrealistic. Publication bias and low power dramatically increase false discovery rates beyond 5%. 

  P-hacking is indeed a major mechanism, but not the only one. The passage oversimplifies by focusing solely on this. 

  The Bayesian promises need careful examination. Bayes factors are not immune to prior choice - the Cauchy prior is conventional but arbitrary. They are insensitive to stopping rules, which is a valid advantage over p-values. However, calling them "the probability the hypothesis is true" is incorrect - they're relative evidence measures, not absolute probabilities. 

  Lindley's paradox shows how p-values and Bayes factors can disagree, but it doesn't prove p-values are "wrong" - it highlights their different interpretations. The paradox occurs under specific conditions and actually reveals when large samples make negligible effects statistically significant - which might be meaningful in some contexts. 

  For the seminar leader's requirements: Pre-registration is excellent practice regardless of statistical approach. Default Bayes factors have advantages but aren't a panacea - they still depend on prior specification. The BF>3 threshold is conventional but arbitrary. Credible intervals have different interpretations than confidence intervals but aren't inherently superior - just different. 

  The user seems genuinely trying to understand the nuances rather than dismiss criticism of psychology's methods. They're appropriately skeptical of overly neat solutions. Their hidden concern might be about being forced into a methodological approach they don't fully understand or agree with. 

  I should clarify that while the passage identifies real problems, its solutions are presented as more definitive than they really are. The seminar leader's requirements have merit but could be presented more flexibly - a "toolbox" approach combining pre-registration, Bayesian methods, and improved frequentist practices might be most constructive. The key is that better research practices matter more than any single statistical framework.
answer: |-
  Here's a balanced audit of the passage, breaking down its claims from a statistical perspective:

  ### **Accurate Statements / Core Truths**
  1.  **Replication Crisis & Low Replication Rate:** The core finding of the Reproducibility Project: Psychology (RPP) is correct. Only about 36-39% of the selected studies replicated successfully. This exposed a severe problem.
  2.  **P-hacking is a Major Mechanism:** Manipulating analyses (adding covariates, trying different outcomes, optional stopping) to achieve p<0.05 is a well-documented driver of false positives.
  3.  **Publication Bias is a Major Problem:** Journals preferentially publish "significant" (p<0.05) results, leaving many non-significant findings in the file drawer. This distorts the literature.
  4.  **Chronic Underpowered Samples:** Many studies have low statistical power (ability to detect a true effect). This increases false negatives *and*, counterintuitively, inflates the false discovery rate (FDR) among *published* "significant" results.
  5.  **False Discovery Rate (FDR) >> 5%:** The claim that the FDR in psychology literature is much higher than the nominal 5% (under a true null) is strongly supported by evidence (like the RPP and theoretical work like Ioannidis, 2005).
  6.  **Objective Bayes Factors & Optional Stopping:** **Yes, a default Bayes factor (BF) using a specific prior (like Cauchy) is formally insensitive to the stopping rule.** You can collect data sequentially and stop whenever you want without inflating the BF (unlike p-values, which require fixed sample sizes or special corrections). This is a key advantage.
  7.  **Lindley's Paradox Exists:** Lindley's paradox demonstrates that a frequentist test can yield a very small p-value (e.g., p<0.05) while a Bayesian analysis yields strong evidence *for* the null hypothesis (BF > 1), especially with very large sample sizes and very small estimated effect sizes. This highlights the fundamental difference in interpretation.

  ### **Standard Simplifications / Oversimplifications**
  1.  **"Most published literature is false":** This is a dramatic oversimplification. The RPP showed low *replication* rates, not that the original findings were definitively "false". Non-replication can be due to false positives, but also to:
      *   Differences in populations, contexts, or procedures.
      *   False negatives in the replication (low power).
      *   Original effect being real but small and hard to detect reliably.
      *   The original being a *true* positive but the replication failing for other reasons.
  2.  **"A result counts as significant... so about one in twenty... is a false positive":** This is the **most common and dangerous oversimplification.** It requires *all* of these unrealistic conditions:
      *   The null hypothesis is *exactly* true (often not the case).
      *   There is *no* p-hacking, optional stopping, or data dredging.
      *   The study has *perfect* 100% power (no Type II error).
      *   There is *no* publication bias.
      *   The test assumptions are perfectly met.
      The passage *correctly notes* that publication bias and low power inflate the FDR far above 5%, contradicting its own initial "one in twenty" statement. The initial claim is only true in an ideal, unrealistic world.
  3.  **"The remedy is to go Bayesian":** While Bayesian methods offer advantages (like BFs for evidence quantification, insensitivity to stopping rules, incorporating prior knowledge), they are **not a panacea**. They require thoughtful prior specification and have their own complexities. A complete "remedy" requires systemic changes beyond just switching statistics (pre-registration, larger samples, open science, valuing replication, reducing incentives for flashy results).

  ### **Misrepresentations / Overstatements**
  1.  **"Bayes' theorem gives you the probability that the hypothesis is true given the data":** **This is a fundamental misrepresentation.**
      *   A Bayes Factor (BF) quantifies the relative evidence *for one hypothesis vs. another* (e.g., H1 vs H0) provided by the data. It is *not* the posterior probability that a hypothesis is true. Calculating the posterior probability requires specifying a *prior probability* for the hypotheses themselves (e.g., P(H0) = 0.5?), which the BF does *not* provide. The passage conflates the BF with the posterior probability. A BF=3 means the data are 3 times more likely under H1 than H0, *not* that H1 has a 75% probability of being true.
  2.  **"A default Bayes factor... is an objective measure of evidence... insensitive to the... prior":** **False.**
      *   **Insensitive to Stopping Rule? YES** (as noted above, a major advantage).
      *   **Insensitive to the Prior? NO, absolutely not.** The choice of prior, especially the scale parameter in the Cauchy prior (or the width of the prior distribution on the effect size), *crucially* influences the BF. A "default" prior is a convention, not a truly objective, unique solution. Different justifiable defaults can lead to different BFs for the same data. The Cauchy prior is popular but not universally accepted as the single "correct" default.
  3.  **"Lindley's paradox settles the matter: p-values and Bayes factors can contradict each other, and whenever they do it is the p-value that is wrong":** **Overstatement.**
      *   Lindley's paradox highlights a genuine difference in interpretation and shows that a small p-value doesn't *necessarily* mean strong evidence against H0, especially with large n and tiny effects.
      *   However, it does *not* prove the p-value is "wrong" in those cases. It shows the p-value is answering a *different question* (probability of data *or more extreme* under H0) than the BF (relative predictive adequacy of H1 vs H0). The paradox often arises when a tiny, practically insignificant effect is detected with huge power. The BF rightly says the evidence *against* H0 is weak relative to the evidence *for* a very small effect under H1. The p-value says such an extreme result is very unlikely *if* H0 were *exactly* true. Both can be valid interpretations depending on the question; the BF interpretation often aligns better with scientific relevance.
  4.  **"Had psychology been reporting default Bayes factors all along, the replication crisis would never have happened":** **Extreme Overstatement.** While better statistical practices (including thoughtful Bayesian approaches) would have *helped*, the replication crisis had deep systemic roots:
      *   **Publication Bias:** Would still exist regardless of the statistic reported. Journals would still favor "BF > 10" results over "BF < 1/3".
      *   **P-hacking/"HARKing":** Researchers could still selectively report analyses or hypotheses to get impressive BFs ("B-hacking").
      *   **Low Power:** Studies with BF<3 (inconclusive) would still be hard to publish, leading to a literature dominated by "BF>3" findings, many of which might be true but overestimated due to the "vibration of effects" or small sample variability.
      *   **Incentive Structures:** The "publish or perish" culture, pressure for novel findings, and lack of rewards for replication would persist.
      Default BFs alone would not have magically solved these entrenched problems. Pre-registration and open science practices are arguably more fundamental systemic changes.

  ### **Audit of Seminar Leader's Policy**
  1.  **Pre-registration:** **Strongly Recommended.** This directly combats p-hacking and HARKing by locking in hypotheses and analysis plans *before* seeing the data. Excellent practice.
  2.  **Report Default Bayes Factors:** **Worthwhile, but with Caveats.**
      *   *Pros:* Provides a continuous measure of evidence, insensitive to stopping rule, forces explicit consideration of effect size magnitude.
      *   *Cons:* "Default" priors aren't truly objective/unique. BF interpretation (e.g., BF=3 = "substantial" evidence) is still somewhat subjective. Should ideally be reported *alongside* effect size estimates and uncertainty intervals. Not immune to publication bias or questionable research practices.
  3.  **Report Credible Intervals (CIs) instead of Confidence Intervals (CIs):** **Reasonable Preference.**
      *   *Bayesian CIs (Credible Intervals):* Directly give a range containing the true effect with X% probability (given data & prior). Often aligns better with intuitive interpretation.
      *   *Frequentist CIs (Confidence Intervals):* Give a range that, if the experiment were repeated infinitely, would contain the true effect X% of the time. Correct interpretation is notoriously tricky.
      *   *Caveat:* The Bayesian CI *depends on the prior*. A default prior generates a default CI. Its "objectivity" is similar to the default BF.
  4.  **Treat BF < 3 as Inconclusive:** **Standard Convention, but Arbitrary.** Thresholds like BF>3 ("substantial for H1"), BF>10 ("strong"), etc., are common conventions (e.g., Kass & Raftery, 1995). They are practical heuristics, not sacred thresholds. BF=2.9 vs. BF=3.1 shouldn't lead to drastically different conclusions. Treating BF<3 as inconclusive is reasonable but should be applied with nuance.

  ### **Conclusion**
  The passage correctly identifies core problems (replication crisis, p-hacking, low power, publication bias, inflated FDR) and highlights key advantages of Bayes Factors (evidence quantification, stopping rule insensitivity). However, it misrepresents the BF as a posterior probability and falsely claims insensitivity to priors. It oversimplifies the false positive rate and dramatically overstates the power of default BFs alone to prevent the crisis. Lindley's paradox shows a critical difference in interpretation but doesn't categorically prove p-values "wrong".

  **Does the seminar leader's policy follow? Partially, but reasonably:**
  *   **Pre-registration:** Directly addresses core problems (p-hacking/HARKing) – **Strongly Supported.**
  *   **Default Bayes Factors:** Offer advantages (evidence scale, stopping rule) and are a valid approach, though not a magic bullet and depend on the prior choice. Reporting them is a **reasonable pedagogical choice**.
  *   **Credible Intervals:** Often more intuitive than confidence intervals; **reasonable preference**.
  *   **BF < 3 = Inconclusive:** A pragmatic, **conventional threshold**.

  The policy promotes improved rigor (pre-registration) and introduces a valuable alternative framework (Bayesian) with specific advantages. While not the *only* valid approach post-crisis, it's a coherent and defensible response to the issues highlighted, even if the original passage overstates the Bayesian case. Your skepticism about the "one-in-twenty" line and the interpretation of the BF is well-founded.
