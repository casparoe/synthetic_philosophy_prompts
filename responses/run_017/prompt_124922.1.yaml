    Total: 75 minutes.

    Introduction (5 minutes):
      - Hook: "In our ranking systems, we assume that if A beats B and B beats C, then A must beat C. But is that always true? Let's explore with two exercises."

    Frame 1: Technical (25 minutes)

      Step 1: Pairwise comparisons (10 minutes)
