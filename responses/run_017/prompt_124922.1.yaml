      E vs A: A is better? because in A only one person suffers, and the others are completely free? In E, everyone has at least one shift? So if we value minimizing the number of people who have to suffer at all, then A is better? 

    Then we have a cycle: A < B < C < D < E < A? 

    But we have five items? 

    We can try with four:

      A: [7,0,0,0]
      B: [6,1,0,0]
      C: [4,3,0,0]
      D: [3,3,1,0]

      Now:

        A vs B: B is better? (shared burden)
        B vs C: C is better? (more even between the two)
        C vs D: D is better? (now three people, max burden=3)
        D vs A: 

            A: one person has 7, others 0.
            D: three people: 3,3,1.

            If we think that it's better to concentrate the burden on one volunteer, then A is better? 
            But if we think spreading is better, then D is better? 

      We want them to prefer A over D? 

      We can frame it: the team has one person who is a night owl and doesn't mind, and the others have family commitments. Then concentrating on that one person might be better? 

      Without framing, it's context-dependent.

    Given time, we will design the moral frame as follows:

      We have four distributions:

        A: [7,0,0,0]   -> one person does all.
        B: [5,2,0,0]   -> two people, one does 5, the other 2.
        C: [4,4,0,0]   -> two people, each does 4.
        D: [3,3,1,0]   -> three people, two do 3, one does 1.

      We hope the pairwise comparisons go:

        A vs B: B is better (because it shares the burden with a second person, reducing the maximum from 7 to 5) -> so B better than A.
        B vs C: C is better (because the two people have a more even share: 4 and 4 instead of 5 and 2) -> so C better than B.
        C vs D: D is better (because now we have three people involved, and the maximum burden is 3, which is less than 4) -> so D better than C.
        D vs A: A is better? Why? Because in D, three people are burdened, while in A only one is burdened and the other three are completely free. If we value the number of people who are free from any burden, then A is better? 

      This might work if the group values minimizing the number of people who have to be on-call at all.

