answer: |-
  Below is a runnable 75-minute session plan designed to meet your specifications. It uses a structured activity to explore intransitive "better than" judgments without prior philosophical exposure, avoids vagueness pitfalls, and creates experiential stakes. The debrief ties outcomes to the three ways out.

  ---

  ### **Materials**
  1. **Index Cards** (8 per frame, 16 total):
     - **Technical Frame**: System designs varying in latency, cost, and durability (detailed below).
     - **Moral Frame**: On-call shift distributions across four engineers (detailed below).
  2. **Whiteboard** to record pairwise votes and numerical scores.
  3. **Tokens** (10 per participant, e.g., poker chips) for trade rounds. Tokens are redeemable for coffee vouchers (e.g., 1 token = $0.10 voucher).
  4. **Non-transitive dice** (backup only; avoid unless no cycle emerges).

  ---

  ### **Items for Frames**
  #### **1. Technical Frame (System Design Trade-offs)**
  Heterogeneous chain trading **latency**, **operating cost**, and **durability**:
  - **System A**: Latency: 50ms, Cost: $100/hr, Durability: 99.0%  
  - **System B**: Latency: 60ms, Cost: $50/hr, Durability: 99.0%  *(Trade: Cost ↓ for Latency ↑)*  
  - **System C**: Latency: 60ms, Cost: $75/hr, Durability: 99.9%  *(Trade: Durability ↑ for Cost ↑)*  
  - **System D**: Latency: 55ms, Cost: $75/hr, Durability: 99.5%  *(Trade: Latency ↓ for Durability ↓)*  
  - **Identical Pair**: **System B** vs. **System B** (to test frame dependence; use in both contexts).

  #### **2. Moral Frame (On-Call Pain Distribution)**
  Heterogeneous chain trading **max burden**, **fairness**, and **coverage**:
  - **Distribution A**: Shifts: [7, 0, 0, 0] → *Max burden: 7, Fairness: low, Coverage: 1 person*  
  - **Distribution B**: Shifts: [5, 2, 0, 0] → *Max burden: 5, Fairness: medium, Coverage: 2 people*  *(Trade: Max burden ↓ for Fairness ↑)*  
  - **Distribution C**: Shifts: [4, 4, 0, 0] → *Max burden: 4, Fairness: high, Coverage: 2 people*  *(Trade: Fairness ↑ for Coverage ↔)*  
  - **Distribution D**: Shifts: [3, 3, 1, 0] → *Max burden: 3, Fairness: medium, Coverage: 3 people*  *(Trade: Coverage ↑ for Fairness ↓)*  
  - **Identical Pair**: **Distribution B** vs. **Distribution B** (presented in both frames).

  ---

  ### **Rules for Trade Round**
  - **Stakes**: Each participant starts with 10 tokens and one randomly assigned item (system/distribution).
  - **Trading**: Facilitator calls pairwise trades (e.g., "Trade A for B? Cost: 1 token").  
    - Participants **raise hands** to accept/reject.  
    - **No forced trades**: Rejections are allowed.  
    - **Trade sequence**: A→B, B→C, C→D, D→A (one full cycle).  
  - **Pump Setup**: If a participant holds an item and accepts all trades, they cycle back to their start but lose 4 tokens.  
  - **Identical Pair**: Mid-sequence, insert **B vs. B** (no trade possible; tests context effects).

  ---

  ### **Timeline (75 Minutes)**
  #### **1. Intro (5 min)**  
  - Hook: *"You’ve all built ranking systems. What if A > B and B > C but A ≯ C? Today, we test if ‘better than’ is transitive."*  
  - Explain: *"Three rounds: pairwise votes, token trades, then scoring. No homework, no jargon."*  

  #### **2. Technical Frame (25 min)**  
  - **Pairwise Votes (10 min)**:  
    - Present systems A–D via index cards.  
    - Vote: *"Is [A] better than [B]? Worse? On a par?*" Record majority on whiteboard.  
    - **Sequence**: A vs. B → B vs. C → C vs. D → D vs. A → **B vs. B** (identical pair).  
    - **Key**: Force "on a par" option. Note if B vs. B gets "equal" votes (tests framing).  
  - **Trade Round (10 min)**:  
    - Assign random systems + 10 tokens.  
    - Run trades: A→B (cost 1), B→C (cost 1), C→D (cost 1), D→A (cost 1), **B→B** (cost 0; no trade).  
    - Record trades/rejections. Highlight token losses.  
  - **Numerical Rescue (5 min)**:  
    - *"Assign each system a score (1–100) for ‘overall quality.’"*  
    - Compare scores to pairwise votes. E.g., if B > A, but A’s score > B’s, flag inconsistency.  

  #### **3. Moral Frame (25 min)**  
  - Repeat structure with on-call distributions.  
  - **Emphasize**: *"This is about pain distribution, not your team."*  
  - Track if rejections increase vs. technical frame.  

  #### **4. Debrief (20 min)**  
  - **Reveal the Problem**: *"You explored if ‘better than’ must be transitive. Three ways out emerged."*  
  - **Map Outcomes to Ways Out**:  
    | **Way Out**          | **What It Costs**                                                                 | **Evidence from Session** |  
    |-----------------------|-----------------------------------------------------------------------------------|---------------------------|  
    | **Deny transitivity** | Money pump: Tokens lost in trade round if cycle accepted.                         | *"You paid to cycle back to start with no gain."* |  
    | **Accept endpoint**   | Contradicts initial judgment (e.g., D > A in votes, but A preferred in pairwise). | *"In tech, 60% said D > A, but in trades you rejected D→A."* |  
    | **Deny "better than"**| "On a par" breaks chain, but trades imply preference.                             | *"You called B/C ‘on a par,’ but 70% traded B→C."* |  
  - **Key Conclusions**:  
    - *Structural, not fuzzy*: Each step traded distinct attributes (latency → cost → durability → latency), not "more of the same."  
    - *Frame matters*: Moral judgments had more rejections (e.g., Distribution D→A) due to incommensurable values (fairness vs. burden).  
    - *Cost of consistency*: Numerical scoring forced trade-offs (e.g., high durability vs. low cost), exposing value conflicts.  
  - **Close**: *"This isn’t about dice—it’s about how step-by-step gains can contradict endpoint goals. Each fix has a price."*  

  ---

  ### **What Predictably Goes Wrong + Fixes**  
  1. **No cycle emerges**:  
     - **Why**: Participants reject trades (e.g., D→A in moral frame) or vote "on a par."  
     - **Fix**: Use non-transitive dice to **quickly demonstrate a cycle** (5 min). Ask: *"Could ‘better than’ work like this?"*  
     - **Prevent**: In pairwise, remind: *"Vote ‘better’ if you’d switch in a real project."*  

  2. **"Just assign numbers" in Round 1**:  
     - **Why**: Engineers default to quantification.  
     - **Fix**: *"We’ll score in Round 3—first, vote instinctively."* If consensus, still run trades to test if scores match behavior.  

  3. **Identical pair inconsistency**:  
     - **Why**: **B vs. B** may be voted "equal" in tech frame but "on a par" in moral frame.  
     - **Fix**: Highlight this in debrief: *"Context changed your judgment of the same item."*  

  ---

  ### **What the Activity Can’t Stage + Verbal Explanation Needed**  
  - **Preference vs. Judgment Gap**:  
    - **Problem**: Trades reveal *preferences* ("I choose B over A"), but votes are *judgments* ("B is better than A"). The money pump critiques intransitive *preferences*, but participants may see judgments as objective.  
    - **Verbal Bridge**: *"In trades, you acted on preferences. If your judgments guide decisions, intransitive judgments might still lead to pumps. But is ‘better than’ about facts or choices? That’s philosophy—today, we exposed the tension."*  

  - **Why This Works**:  
    The activity forces participants to confront aggregation failures in value-laden trade-offs. By making costs tangible (tokens) and judgments contextual (frames), it avoids vagueness and leaves a memorable stake in the outcome.  

  ---  
  **Output**: Participants exit seeing intransitivity as a structural aggregation problem with practical costs, not a logic puzzle. The debrief roots each "way out" in their actions, making the trade-offs visceral.
