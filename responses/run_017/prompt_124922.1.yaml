        - They can trade their system for another system if they wish, but they must pay one token to the "bank" for each trade they make.
        - The rules:
            - The facilitator will call out pairs: e.g., "Anyone holding A, would you like to trade for B? It will cost you one token."
            - If they want to trade, they raise their hand and the facilitator records the trade and collects one token.
            - They can refuse any trade.
            - We will go through the pairs in the cycle: 
                  Trade A for B
                  Trade B for C
                  Trade C for D
                  Trade D for A

            - But note: if someone is pumped: starts with A, trades to B (paying 1 token), then to C (paying another token), then to D (paying another), then back to A (paying another) -> now they have A again but have paid 4 tokens.

        - We will do two full cycles? But we want to see if anyone completes a cycle.

      Step 3: Numerical assignment (5 minutes)
        - Ask the group to assign numerical scores to each system (on a scale of 1 to 100) that reflect their overall goodness.
        - Then, compare the scores to the pairwise preferences: if they said B is better than A, then the score of B should be higher than A? 
        - They will likely find that it's hard to assign scores that are consistent with the pairwise preferences and also avoid having the endpoint (D) be better than the start (A) if they have a cycle.

    Frame 2: Moral (25 minutes)

      Repeat the same steps with the on-call distributions.

    Debrief (20 minutes)

      - Reveal that this is about transitivity of "better than".
      - Explain the three ways out:
          1. Deny transitivity: sometimes A can be better than B, B better than C, but C better than A. But then we saw in the trade round that this can lead to a money pump (paying tokens to cycle).
          2. Accept that the far end of the chain is better: but in the moral frame, they might have resisted that D is better than A? In the technical frame, they might have resisted that D is better than A? 
          3. Deny that some of the links are relations of "better than": maybe in some steps, the two options are "on a par". But then we have to explain why in the trade round people were willing to trade? 

      - Highlight the cost of each way out:
          - Intransitivity: leads to money pump (they lost tokens).
          - Accepting the chain: might be counterintuitive (e.g., in the moral frame, is [3,3,1,0] really better than [7,0,0,0]? They might have said no in the pairwise).
          - On a par: then in the trade round, why did they trade? And if they didn't trade, then the chain breaks and there's no cycle.

      - Also, discuss the context dependence: did the same pair get different judgments in different contexts? We didn't do that in this design, but we could have included a duplicate pair in two different comparison sets? 

    What if no cycle is formed?
      - In the pairwise round, if at any step they do not prefer the next, then the chain breaks.
      - Or if at the end they do not prefer A over D, then there's no cycle.
      - We can have a backup cycle: for example, if in the technical frame they don't form a cycle, we can use the non-transitive dice as a fallback? But we wanted to avoid dice.
      - Alternatively, we can have a pre-selected example to show? But we want them to experience it.

    What if in round 1 someone says "just assign numbers"?
      - We say: "We will do that in round 3, but for now, let's do pairwise comparisons without numbers."

    The gap between preference and judgment of betterness:
      - In the trade round, they are acting on preference (I prefer B over A, so I trade). But in the pairwise judgment, we asked "which is better?" 
      - There might be a difference: they might trade for something they don't think is better, because they have a personal preference? 
      - We should note in the debrief that the trade round is about preference (what they choose) while the pairwise judgment is about evaluation (what they think is better). 
      - The money pump argument usually applies to preference: if your preferences are intransitive, you can be pumped. But if your judgments of betterness are intransitive, is that a problem? 
      - This gap is not staged in the activity and must be addressed verbally in the debrief.

