  ### Decision Tree: Gender Equality and Women in STEM  
  *Assume the cross-national pattern is real: higher gender equality correlates with fewer women in engineering/computer science (CS) degrees. Use these 2025 findings to navigate:*  
  **(a)** Pattern holds *within* countries over time (rising equality → falling female engineering shares).  
  **(b)** Driven by engineering/CS; women *rise* in biology/medicine with equality; math is flat.  
  **(c)** Gap in "I am good at math" self-ratings (boys > girls) *widens* in high-equality countries, despite narrower test-score gaps.  
  **(d)** Female engineering shares *inversely track* women’s representation in other high-status fields (law, medicine, journalism).  

  ---

  #### **NODES (Questions)**  
  1. **Finding (d) shows women "trade" engineering for law/medicine/journalism in equal societies. Is this because engineering is uniquely undesirable or because other fields are uniquely appealing?**  
     - *Uniquely undesirable* → Node 2  
     - *Uniquely appealing* → Node 3  

  2. **Is engineering’s undesirability in equal societies due to its content (e.g., objects vs. people) or its social environment (e.g., male-dominated culture)?**  
     - *Content* → Node 4  
     - *Social environment* → Node 5  

  3. **When equality rises, do women avoid engineering because it’s economically redundant (other fields now offer security) or because they’re better at non-engineering fields?**  
     - *Economically redundant* → Leaf 2: **STEM as Escape Hatch**  
     - *Better at non-engineering* → Leaf 3: **Comparative Advantage Sorting** *(choosing fields where perceived skills are strongest)*  

  4. **Are preferences for non-engineering content in equal societies innate (e.g., biological tendencies) or learned (e.g., socialization)?**  
     - *Innate* → Leaf 5: **Affluence Unleashes Intrinsic Preferences**  
     - *Learned* → Leaf 6: **Adaptive Preferences** *(internalizing societal norms)*  

  5. **Does the wider confidence gap in math (finding c) in equal societies reflect boy-girl polarization of interests or increased stereotyping?**  
     - *Polarization of interests* → Leaf 5: **Affluence Unleashes Intrinsic Preferences**  
     - *Increased stereotyping* → Leaf 4: **Backlash/Identity Threat**  

  6. **If you met a 16-year-old girl in Norway (high-equality) who loves engineering, what’s the likeliest reason she’d quit by age 20?**  
     - *Social pressure (e.g., stereotypes, isolation)* → Leaf 4: **Backlash/Identity Threat**  
     - *Genuine shift in passion (e.g., discovers other interests)* → Leaf 5: **Affluence Unleashes Intrinsic Preferences**  

  7. **Finding (a) shows rising equality reduces female engineering graduates. Is this shift caused by changing institutions (e.g., biased hiring) or changing choices (e.g., women’s preferences)?**  
     - *Changing institutions* → Node 5  
     - *Changing choices* → Node 4  

  ---

  #### **LEAVES (Positions)**  
  1. **Measurement Skeptic**  
     - *Predicts*: (a)–(d) are artifacts (e.g., flawed equality indices, cultural definitions of "STEM").  
     - *Awkward commitment*: Must explain why *all* findings align spuriously.  
     - *What we owe*: Better data—no policy change until measurement clears up.  

  2. **STEM as Escape Hatch**  
     - *Predicts*: (d) is key; engineering is an "economic safe choice" where equality is low. Equality enables pursuit of preferred fields (biology, law).  
     - *Awkward commitment*: Women in low-equality countries don’t *truly* prefer engineering—they tolerate it.  
     - *What we owe*: Nothing—women are finally free to choose.  

  3. **Comparative Advantage Sorting**  
     - *Predicts*: (b) and (d) align; women in equal societies maximize returns by specializing in fields where they feel most skilled (e.g., law over engineering).  
     - *Awkward commitment*: Ignores why perceived "advantage" excludes engineering cross-culturally.  
     - *What we owe*: Nothing—efficient sorting benefits everyone.  

  4. **Backlash/Identity Threat**  
     - *Predicts*: (c) shows boys’ confidence inflates in "masculine" fields as equality rises; (b) occurs because engineering culture becomes defensively male-dominated.  
     - *Awkward commitment*: Men unconsciously (or consciously) gatekeep engineering *more* when equality rises.  
     - *What we owe*: Fix hostile environments (e.g., anti-bias training).  

  5. **Affluence Unleashes Intrinsic Preferences**  
     - *Predicts*: (b) and (c) reflect biology; equality removes economic pressure, letting innate preferences (e.g., people-oriented work) flourish.  
     - *Awkward commitment*: Accepts biological gender differences in preferences.  
     - *What we owe*: Nothing—respect innate choices.  

  6. **Adaptive Preferences**  
     - *Predicts*: (c) and (d) stem from socialization; girls in equal societies learn to avoid "masculine" engineering despite ability.  
     - *Awkward commitment*: Women’s "choices" aren’t truly free—undermines autonomy.  
     - *What we owe*: Counteract stereotypes early (e.g., toys, mentors).  

  7. **Real, Social, Owed Nothing**  
     - *Predicts*: (a)–(d) reflect social forces (e.g., norms, markets), *but* justice doesn’t require engineering parity. Focus on individual access, not group ratios.  
     - *Awkward commitment*: Tolerates systemic gender divergence as "free choice."  
     - *What we owe*: Ensure formal equality—no interventions to shift preferences.  

  ---

  #### **FORMAL STRUCTURE & EMPTY CELLS**  
  - **Total possible answer combinations**: 32 (from 5 binary nodes + 1 ternary node).  
  - **Occupied combinations**: 7 (one per leaf).  
  - **Unoccupied combinations**: 25.  
  - **Why empty?**  
    - **Incoherent**: 8 combinations (e.g., choosing "innate preferences" *and* "bias in hiring" → contradictory).  
    - **Unattractive**: 12 (e.g., "STEM as escape hatch" *and* "intervention owed" → if escape is good, why intervene?).  
    - **Unexplored**: 5 (e.g., "adaptive preferences" *and* "owed nothing" → possible but omitted; tree prioritizes coherence).  

  - **Key empty cells**:  
    - *"Artifact but owed intervention"*: Unattractive—if pattern is fake, why act? (Occupied: **Measurement Skeptic** says no intervention.)  
    - *"Biological and owed intervention"*: Occupied by tweaking **Affluence Unleashes Intrinsic Preferences** → **Leaf 7** ("Real, Social, Owed Nothing") *could* be held with biology, but tree routes biological answers to "owed nothing" (Leaf 5). To demand intervention, one must reject biology (e.g., take **Adaptive Preferences**).  

  - **Forced justice overlaps**:  
    - **Comparative Advantage Sorting** (Leaf 3) and **STEM as Escape Hatch** (Leaf 2) *both* imply "owed nothing"—though proponents might disagree.  
    - **Backlash/Identity Threat** (Leaf 4) and **Adaptive Preferences** (Leaf 6) *both* imply intervention—despite differing mechanisms.  

  ---  
  *Decision trees map logic, not loyalty. Your path’s end may surprise you.*
