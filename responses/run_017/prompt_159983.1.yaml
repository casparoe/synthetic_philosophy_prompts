  ### Load-Bearing Distinctions  
  The two distinctions that most dramatically redirect a student’s path are:  
  1. **Distinction 2 (Node 2):** Whether an act can be both obligatory and wrongful. A "yes" leads to positions embracing conflict; a "no" dissolves it.  
  2. **Distinction 1 (Nodes 3/5):** Whether requirements conflicting with prohibitions are moral or office-bound. This splits justifications into universal vs. role-specific.  

  This suggests the core disagreement lies in **whether politics inherently generates moral conflicts** (Distinction 2) and **whether public office creates unique moral permissions** (Distinction 1). These frame the debate: either politics is a realm of unresolvable dilemmas, or its demands can be reconciled with ordinary morality.
