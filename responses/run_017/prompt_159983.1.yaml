  - **Path:** Node 1 (No) → Node 3 (Only on the office-holder) → Leaf 2 (Role-specific permission), **but** combined with Node 4 (Yes) → Node 6 (No) → Leaf 6 (Conflict unresolved; faithfulness matters).  
  - **Why empty?** Incoherent. Leaf 2 denies wrongdoing, while Leaf 6 requires wrongdoing. This path demands both denying and affirming moral conflict, which is unsustainable.  

  ### Indistinguishable Leaves  
  - **Leaves 6 and 8** (Conflict unresolved; faithfulness matters vs. State necessity as distinct morality) cannot be separated by this tree.  
  - **Separating question:** "Can the same wrongful act be simultaneously condemned morally and required officially?"  
    - **Yes** → Leaf 6 (Conflict unresolved)  
    - **No** → Leaf 8 (State necessity)  

