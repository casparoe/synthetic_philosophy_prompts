  **Starting Point:** You have read **Case A** and concluded "there was nothing else she could have done." The tree begins here. Each node is a question about a case or claim. Answer based solely on your judgment of the case described. Do not reference theorists, schools, or specialized vocabulary (e.g., "tragic," "absolutist").  

