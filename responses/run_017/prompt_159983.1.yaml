  ### Leaves (Positions and Commitments)  
  1. **Monist consequentialist**  
     *Awkward commitment:* Must hold that any act preventing greater harm is not wrong, even if it violates fundamental rights.  
  2. **Unnamed (Role-specific permission)**  
     *Awkward commitment:* Permits office-holders to do what would be inexcusably wrong for others in identical circumstances.  
  3. **Unnamed (Office as moral shield)**  
     *Awkward commitment:* Absolves the person of wrongdoing if the act is done under official authority, regardless of intent or outcome.  
  4. **Absolutist**  
     *Awkward commitment:* Demands adherence to prohibitions even at the cost of catastrophic harm (e.g., allowing thousands to die to avoid rights violation).  
  5. **Unnamed (Reasons determine wrongness)**  
     *Awkward commitment:* Judges identical acts as corrupt or justified based solely on internal motives, not outcomes.  
  6. **Position: Conflict unresolved; faithfulness matters**  
     *Awkward commitment:* Requires agents to commit wrongful acts while maintaining integrity through remorse, without resolution.  
  7. **Position: Wrongness belongs to the office**  
     *Awkward commitment:* Attributes wrongdoing to the institutional role, not the person, allowing "clean" individuals to enact harmful policies.  
  8. **Position: State necessity as distinct morality**  
     *Awkward commitment:* Posits a separate moral code for governance that licenses public wrongs as duties.  
  9. **Position: Act not wrong under right description**  
     *Awkward commitment:* Denies wrongdoing by redefining prohibited acts (e.g., "coercive interrogation" as "security measure").  

