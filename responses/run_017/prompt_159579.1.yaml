prompt: |-
  I have been asked to run a ninety-minute session for the lay members of a regional health prioritisation panel — eight people, mixed backgrounds, two of them clinicians, none of them economists — who must vote at the end of the month on which of two programmes to fund. Nobody will have read anything beforehand. They will arrive holding both of the following at once: that the question is easy ("ask each group how much better off they'd be, out of ten") and that it is hopeless ("you cannot get inside someone else's head, so treat everyone the same"). I want them to leave able to locate what is actually difficult about interpersonal comparisons of utility, and to see that the difficulty is not where they think it is.

  Plan the session; do not write the explanation out, and do not summarise the topic for me. What I need is:

  1. The order the ideas must come in, and what depends on what. Specifically: why the difference between ranking a person's own outcomes and measuring how much better one outcome is for them than another has to be in place before a social decision can be seen to need more than a ranking; why the three things a comparison might have to deliver — who is better off, whose gain is larger, and how many smaller gains offset one larger gain — are three different demands rather than three versions of one demand, and which of the three this panel's vote will covertly require; and why the point that inserting a common currency (money, willingness to pay, quality-adjusted life years) relocates the comparison rather than dissolving it must land before, not after, someone proposes a currency.

  2. The one case to carry the whole session, with what it must have and what it must lack. I have been using a choice between funding joint replacements for older people in chronic pain and funding talking therapies for younger people with severe depression. Tell me whether that carries it, what such a case needs — two groups whose self-reports are not comparable in the obvious way, a trade-off that survives every attempt to find a common currency — and what it must lack: no cash equivalent, no single identifiable victim, nothing that lets the panel settle it by counting heads or by appealing to need alone. If another case does the work better, give it and say why.

  3. The misconceptions in the order they will surface, and the point in the sequence at which each should be headed off. The ones I anticipate: that comparing across persons would require knowing what it is like to be the other person; that asking everyone to use the same zero-to-ten scale already solves the problem; that anchoring the top and bottom of each person's scale settles the middle, when the scale's shape between the anchors may still differ; that an inability to compare licences treating everyone alike; and finally that if full comparisons are unavailable then no comparison is available. That last one matters most to me, because a panel that concludes "no comparison is possible" and one that concludes "any comparison will do" behave identically in the vote. Relatedly, I want them to leave with the thought that some decisions can be made without a full scale, by identifying cross-personal differences that survive every admissible rescaling of the individuals' own scales — tell me what has to be on the table before that thought is intelligible, and where it fits.

  4. One question or short task for the final ten minutes whose wrong answers are diagnostic rather than merely blank, and which separates someone who has grasped the problem from someone who has merely learned to say that utilities are not comparable.

  5. A short list of what you would openly refuse to cover in ninety minutes, phrased as I could say it aloud to the panel.

  Set the plan out in five numbered sections matching the above, in British English, and keep the whole thing under 800 words.
reasoning: |-
  Hmm, the user is planning a 90-minute session on health prioritisation for a lay panel. They need help structuring the session around interpersonal utility comparisons. The panel members have two conflicting intuitions: that the problem is simple (just ask people to rate outcomes on a 0-10 scale) and that it's impossible (you can't compare experiences across people). 

  The core challenge is making them understand that the difficulty isn't about "getting inside someone's head" but about finding a common metric for trade-offs. They specifically want to avoid economic jargon and focus on conceptual breakthroughs. 

  I notice they've used a joint replacements vs depression therapies case before. That's actually quite good - both conditions involve suffering that resists easy monetization, affects different demographics, and can't be resolved by counting heads. The chronic pain vs mental health contrast naturally challenges superficial comparisons. 

  Key misconceptions to dismantle:
  First will come the "mind-reading" objection - I'll need to redirect this early by distinguishing ordinal vs cardinal comparisons. Then the "same scale solves it" fallacy - I'll demonstrate how anchors don't fix scale curvature. The "treat everyone alike" cop-out must be preempted by showing how that too is a comparison method. 

  Most crucially, I must prevent the false equivalence between "no perfect comparisons" and "no comparisons possible". The session should culminate in showing how some decisions CAN be made by identifying scale-invariant differences - like when one group gains massively while the other loses minimally, regardless of how we stretch individual scales. 

  For the diagnostic task, I'll use a variation of their case: what if depression treatment causes minor joint pain? Wrong answers will reveal if they still think in terms of "balancing numbers" rather than structural relationships between gains and losses. 

  I'll explicitly exclude Pareto efficiency and QALY calculations - too technical for 90 minutes. The focus must stay on the philosophical underpinnings of comparison. 

  The structure should flow: 
  1) Establish ordinal vs cardinal distinction using pain scales 
  2) Introduce three distinct comparison tasks through funding dilemma 
  3) Debunk "common currency" as relocation not solution 
  4) Present scale-invariance concept 
  5) Apply learning through diagnostic question 

  Timing is tight - need ruthless prioritisation. The scale-invariance demonstration is the keystone; everything else builds toward it.
answer: |-
  Here is the session plan:

  **1. Sequence of Ideas**  
  a) Start with individuals: Distinguish *ranking* options (e.g., "Less pain > more pain") from *measuring gaps* ("How much better is less pain?"). Use simple pain scales.  
  b) Introduce social choice: Show that choosing between Group A (e.g., joint replacement candidates) and Group B (e.g., depression therapy recipients) requires comparing gains *across* groups, not just within.  
  c) Identify three distinct demands:  
  - Who is *better off*? (Ordinal, person-specific)  
  - Whose *gain is larger*? (Cardinal, cross-person)  
  - *Trade-offs*: How many small gains equal one large gain? (Interpersonally comparable units)  
  d) Reveal that their vote requires trade-offs (demand 3), not just ordinal comparisons.  
  e) Pre-empt currency proposals: Show that money/QALYs don’t dissolve comparison—they impose a *specific* scaling rule (e.g., assuming £10,000 = same welfare gain for all).  

  **2. The Core Case**  
  Your case (joint replacements vs. talking therapies) is ideal. It has:  
  - **Necessary**: Non-comparable self-reports (chronic physical pain vs. mental distress); no obvious common currency (money fails—disability-adjusted income? QALYs ignore severity perception?); trade-offs unavoidable.  
  - **Avoids**: Cash equivalents (pain relief isn’t monetised easily); no "identifiable victim" (groups are heterogeneous); need alone is insufficient (both groups have high need); head-counting doesn’t resolve (unless equal group sizes).  
  *Alternative case*: Funding neonatal ICU vs. palliative care. Less optimal—may trigger "saving lives" bias, muddying utility comparison.  

  **3. Misconceptions & Mitigation**  
  a) *"Can’t get inside their heads"* (early, step 1a): **Redirect** to "We don’t need to—we can accept *their* rankings/scales. But that doesn’t tell us whose scale units are larger."  
  b) *"Same 0-10 scale solves it"* (after step 1b): **Challenge** with: "What if 7/10 pain for one is 4/10 for another? Same scale ≠ same meaning."  
  c) *"Anchors settle scale shape"* (after b): **Show visually**: A linear scale vs. logarithmic scale (both anchored at 0=death, 10=perfect health) yield different midpoints.  
  d) *"Treat everyone alike"* (step 2): **Expose**: This *is* a comparison method—it assumes equal gains per person. Is that defensible if gains differ?  
  e) *"No full comparison → no comparison possible"* (final 20 mins): **Counter** by introducing *scale-invariant comparisons*: Show that if *every* rescaling of A’s and B’s utilities agrees A gains more than B, the comparison holds. Requires step 1c (three demands) and step 2 (case) to be clear first.  

  **4. Diagnostic Final Task**  
  *Question*: "Suppose we *must* defund one programme slightly to fund the other. Which group’s loss would be smaller? Does your answer depend on how we scale their 0-10 ratings?"  
  - **Wrong answer**: "Depressed patients would lose more because they start lower" (confuses level with gain size) or "It depends only on their ratings" (assumes scales comparable).  
  - **Right answer**: Identifies that without knowing if a 1-point loss on A’s scale = 1-point on B’s, we can’t know—unless we find losses that are clearly trivial for one group but catastrophic for another (scale-invariant).  

  **5. Explicit Exclusions**  
  Say aloud:  
  > "We won’t cover:  
  > - Technical fixes like QALY calculations or willingness-to-pay.  
  > - Philosophical debates about consciousness.  
  > - Voting systems beyond our simple choice.  
  > Why? To stay focused on *why* comparing wellbeing gains across people is distinct from—and harder than—comparing within one person."  

