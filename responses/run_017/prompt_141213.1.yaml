     - Debrief (15 minutes)

  To address the worry about early lock-in: by having individuals write first, then groups discuss, we mitigate. Also, the challenge to come up with a second rule forces them to see alternatives.

  Honest note at the end: In real science, we don't usually get to see the intended rule (the truth) so clearly. We have to keep testing and we might never be absolutely sure. The game shows that data alone is not enough; we bring our own biases and assumptions.

  We also want to build in the turn from description to prediction: when they have to bet, even though both rules fit, they have to choose one for prediction.

  For the split-order effect, if we can't reliably stage it, we can mention in the debrief that the order in which examples are presented can influence which rule people come up with, and we can cite studies on that.

  Given the time, we might have to drop the split-order or do it as an aside.

  Alternatively, we can have a quick poll: 
     - How many groups came up with a rule about the number of dots? 
     - How many came up with a rule about the top-left cell? 
     - Then ask if the order of examples they saw might have influenced it? 

  Without having controlled the order, it's correlational.

  We decide to focus on the main point and skip the split-order for now.

  So the final plan:

  Problem 1: Dots in 2x2 grid.
  Problem 2: Shapes (triangle and circle).

  Handout: for each problem, a sheet with 12 figures (6 left, 6 right) or separate cards.

  Test cases on cards or drawn on a board.

  Tokens for betting: each group gets two tokens of different colors (e.g., red and blue) to bet on which rule they think is the intended one.

  Recipe for making the problems:

  Problem 1: Dots
     - Draw 2x2 grids.
     - Positive: 6 figures, each has exactly one dot, and the dot is not in top-left (so in one of the other three cells).
     - Negative: 6 figures, each has a dot in top-left and at least one other dot (so 2, 3, or 4 dots).

     Test cases:
          TC1: grid with one dot in top-left.
          TC2: grid with top-left empty and no dots.

     Intended rule: "exactly one dot"

  Problem 2: Shapes
     - Positive: 6 figures, each has at least one triangle and no circle. They may have other shapes (squares, pentagons, etc.) or not.
     - Negative: 6 figures, each has at least one circle and no triangle.

     Test cases:
          TC1: a figure with both a triangle and a circle.
          TC2: a figure with only a square (no triangle, no circle).

     Intended rule: "contains a triangle"

  In Problem 2, the alternative rule we hope they come up with is "does not contain a circle", which also fits the training data.

  We'll run the same structure for both problems.

  Debrief points:
     - How many groups had the intended rule as their initial rule? How many had the alternative? 
     - Were they able to come up with a second rule? How did they feel about having to bet?
     - In real life, we often have to make predictions based on incomplete data, and we bring our own biases (like simplicity: the number of dots might seem simpler than the top-left condition).
     - The order of examples can influence which rule we form (even though we didn't show it, it's a known effect).
     - The key point: data alone doesn't tell you the rule; your mind fills in the gap.

  And the honest note: In this game, we revealed the intended rule, but in reality, we don't have that luxury. We have to keep testing and be open to the possibility that our rule is wrong.

  We hope that by having them go through the process, they experience the underdetermination.

  Let's hope it works.
answer: |-
  Below is a complete, practical design for your 75-minute session that meets your goals: it forces participants to confront the underdetermination of rules by examples, builds in the shift from description to prediction, creates a visible split based on example order, and avoids common pitfalls. The activities use only paper, cards, and tokens—no slides or complex math.

  ---

  ### **Session Overview**
  - **Goal**: Show that examples alone never pin down a single rule; extra assumptions (simplicity, order, prior beliefs) drive our choices.
  - **Core Mechanism**: Groups see Bongard-style problems with two possible rules that fit the examples but clash on new cases. Half the room sees examples in a different order, leading to rule splits. Participants bet tokens on which rule will handle unseen cases.
  - **Time**: 75 minutes total (intro: 5 min, Problem 1: 25 min, Problem 2: 25 min, debrief: 20 min).
  - **Materials**: 
    - Pre-drawn Bongard cards (see templates below).
    - Tokens (e.g., poker chips, buttons, or colored paper) for betting.
    - Paper & pens for groups to write rules.
    - Test-case cards for new examples.

  ---

  ### **Problem Design (Easy to Draw on Paper/Cards)**
  **Rule Philosophy**: Each problem has two simple, incompatible rules that fit all examples but disagree on new cases. Rules use basic attributes (shapes, sizes, positions) to avoid math. 

  #### **Problem 1: Shapes & Dots**
  - **Left (Positive)**: 6 figures sharing a rule.
  - **Right (Negative)**: 6 figures violating the rule.
  - **Key Property**: All figures are 3x3 grids with dots and shapes (circles, squares). 
  - **Rules**:
    - **Rule A (Intended)**: "There is a dot inside a circle."
    - **Rule B (Alternative)**: "All squares are empty (no dots)."
  - **Test Cases** (unseen during rule discovery):
    - **Case X**: Circle with dot + empty square (Rule A: ✔️, Rule B: ✔️).
    - **Case Y**: Circle with dot + square with dot (Rule A: ✔️, Rule B: ❌).
    - **Case Z**: Empty circle + empty square (Rule A: ❌, Rule B: ✔️).

  <details>
  <summary>📝 Card Templates (Click to Expand)</summary>

  **Positive Examples (Left)**:
  1. Grid: Dot in circle, empty square.  
  2. Grid: Dot in circle, no square.  
  3. Grid: Dot in circle, empty square (different positions).  
  4. Grid: Dot in circle, empty triangle (distractor).  
  5. Grid: Dot in circle, empty square.  
  6. Grid: Dot in circle, no other shapes.  

  **Negative Examples (Right)**:
  1. Grid: Dot in square, empty circle.  
  2. Grid: Dot in triangle, empty circle.  
  3. Grid: Dot in circle + dot in square.  
  4. Grid: Dot in square, no circle.  
  5. Grid: Dot in triangle, empty square.  
  6. Grid: Multiple dots in squares.  

  **Order Split**:
  - **Group 1–3 (Order 1)**: See positives first (1–6), then negatives (1–6).  
  - **Group 4–6 (Order 2)**: See negatives first (1–6), then positives (1–6).  

  *(Sketch these on index cards: 5–10 mins to draw. Use simple shapes/dots!)*
  </details>

  #### **Problem 2: Lines & Arrows**
  - **Rules**:
    - **Rule A (Intended)**: "An arrow points to a line."
    - **Rule B (Alternative)**: "No arrow is alone (always paired with a shape)."
  - **Test Cases** (disagree on 2/4 cases).
  - **Order Split**: Same as Problem 1 (swapped between groups).

  <details>
  <summary>📝 Card Templates (Click to Expand)</summary>

  **Positive Examples (Left)**:
  1. Arrow pointing to a line, no other shapes.  
  2. Arrow pointing to a line, with a circle nearby.  
  3. Arrow pointing to a line, with a square.  
  4. Arrow pointing to a line, isolated.  
  5. Arrow pointing to a line, with a dot.  
  6. Arrow pointing to a line, with a triangle.  

  **Negative Examples (Right)**:
  1. Arrow pointing to nothing (no line).  
  2. Arrow alone (no shapes).  
  3. Arrow paired with a circle (not pointing).  
  4. Arrow pointing to a circle (not a line).  
  5. Two arrows, one pointing to nothing.  
  6. Arrow with a line not being pointed to.  

  **Order Split**:
  - **Group 1–3**: See Order 2 (negatives first).  
  - **Group 4–6**: See Order 1 (positives first).  
  </details>

  ---

  ### **Session Structure**
  #### **1. Introduction (5 min)**
  - **Context**: "We’re exploring how we find patterns in data. You’ll see figures split into two sides: left follows a rule, right breaks it. Your job: find the rule."
  - **Emphasize**: "Don’t share ideas aloud yet—write them down first to avoid locking in early."

  #### **2. Problem 1 (25 min)**
  - **Step 1: Rule Discovery (10 min)**  
    - Groups (5–6 people) get 12 cards (6 left/6 right) in their order (Group 1–3: Order 1; Group 4–6: Order 2).  
    - **Individual Phase (3 min)**: Each person writes a rule privately.  
    - **Group Phase (7 min)**: Agree on one rule and write it on paper.  

  - **Step 2: Force Underdetermination (5 min)**  
    - Challenge: "Find a second rule that fits all examples but conflicts with your first rule somewhere new."  
    - **Output**: Groups write both rules (Rule 1 and Rule 2).  

  - **Step 3: Prediction & Betting (10 min)**  
    - **Stakes**: Each group gets 3 tokens.  
    - **Task**: Bet tokens on which rule (1 or 2) will correctly classify 3 unseen test cases (X, Y, Z).  
      - "You must split tokens—you can’t bet all on one. This forces a choice."  
    - **Reveal Test Cases**: Show cards for X, Y, Z. Groups classify each with both rules and record predictions.  
    - **Reveal Intended Rule (Rule A)**: Explain how it classifies X, Y, Z. Groups score 1 point per token on the rule matching most outcomes.  

  #### **3. Problem 2 (25 min)**
  - Repeat Steps 1–3, but swap example orders (Group 1–3 now see Order 2, Group 4–6 see Order 1).  
  - **Emphasize**: "Did your rule change based on order this time?"  

  #### **4. Debrief (20 min)**
  **Key Moments to Highlight**:  
  - **Underdetermination**: "For any rule, there’s always a second that fits the examples."  
  - **Description → Prediction**: "You had to bet even though both rules worked—data alone couldn’t decide."  
  - **Order Effect**: "Groups 1–3 mostly chose Rule A (dots in circles) first. Groups 4–6 mostly chose Rule B (empty squares) first. Why? Order primes simplicity: negatives first made ‘emptiness’ stand out."  

  **What Predictably Goes Wrong**:  
  - **Early Lock-In**: Mitigated by individual writing first and the forced second rule.  
  - **Overfitting**: Groups may invent complex rules (e.g., "circles on Tuesdays"). Redirect with: "Could a simpler rule work?"  
  - **Test Case Bias**: Some may resist betting if rules split outcomes. Push: "Science forces choices with incomplete data."  

  **The Honest Note (State Aloud)**:  
  > "In this game, you saw the ‘true’ rule eventually. But in real science, we rarely do. We bet on rules that survive testing, but they could still be wrong—and today’s ‘true’ rule might be tomorrow’s footnote. The data never settles it alone; *we* do, with our assumptions about simplicity, causality, or elegance. That’s the worry you can’t stage: science is a conversation between the world and our minds, not a puzzle with an answer key."

  ---

  ### **Why This Works**
  - **No Tech Needed**: Cards and tokens are cheap and tactile.  
  - **Split-Order Effect**: Groups 1–3 (positive-first) often infer the intended rule (e.g., dots in circles). Groups 4–6 (negative-first) infer the alternative (e.g., empty squares). The debrief reveals this divide.  
  - **Stakes Force Prediction**: Tokens make the prediction moment tangible and high-stakes.  
  - **Mitigates Pitfalls**: Individual writing + forced second rule prevents early lock-in.  

  **Prep Time**: ~20 mins to draw cards. Use grids (3x3) with 2–3 shapes/dots each—keep it simple!  
  **Replication**: Problems 1 and 2 use the same mechanics, reinforcing the concept.  

  This design creates a visceral experience of underdetermination, primes the order effect, and ends with a clear takeaway: **Patterns aren’t found—they’re forged by us**.
