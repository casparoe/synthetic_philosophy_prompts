          TC1: has a triangle and a circle.
          TC2: has neither a triangle nor a circle.

     For TC1: 
          Rule1: positive (has a triangle)
          Rule2: negative (has a circle)

     For TC2:
          Rule1: negative (no triangle)
          Rule2: positive (no circle)

     So both test cases are disagreements.

  Structure:

     - Introduction (5 minutes)
     - Problem 1 (25 minutes)
          * Distribute the examples to groups (all groups see the same set of 12 examples, in the same order? Or in two orders if we can). 
