prompt: |-
  I have been going back and forth with a friend over an argument he uses to defend wavefunction realism, and I have come to think it establishes a good deal more than either of us is willing to accept.

  (1) Call a ψ-surrogate any object in a theory which, together with the Hamiltonian, fixes the probabilities that theory assigns to the outcomes of every possible measurement. Call a theory empirically adequate if it matches the predictions of quantum mechanics to the accuracy to which they have been tested.

  (2) Every empirically adequate theory must contain a ψ-surrogate. The predictions themselves have a structure that cannot be generated without something doing that job, and the constraint comes from the predictions rather than from anyone's choice of notation, so it survives any reformulation of the theory.

  (3) If a quantity is indispensable to every empirically adequate theory in the way just described, then it does not merely encode someone's ignorance; it answers to something in the world. Otherwise the predictive success of the theory would be left unexplained, a coincidence on the scale of a miracle.

  (4) So the wavefunction is ontic, and the psi-epistemic view is false.

  (5) Now run (2) and (3) again elsewhere. Any empirically adequate treatment of a gas must contain a distribution surrogate, a probability density over microstates without which its predictions cannot be stated. It satisfies (3) in exactly the same sense that the ψ-surrogate does.

  (6) So the distribution over microstates is ontic too, and is not an encoding of ignorance about which microstate obtains.

  (7) And the pattern generalises: take any theory and any quantity without which its predictions cannot be stated, and (2) and (3) apply to it. Nothing in any scientific theory represents ignorance, the distinction between psi-ontic and psi-epistemic views is empty, and every view is ontic.

  (8) That cannot be right. A distinction that could not possibly be false is not a distinction worth drawing.

  Of the claims above, I would most like to keep (4) and to reject (6), but I cannot see where the reasoning goes wrong: (2) and (3) each look like ordinary scientific realism, and (5) looks like a genuine parallel rather than a parody. Which step should I give up, why did that step look sound when it is not, and what does giving it up cost me? In particular, is there a way of reaching (4) that does not also reach (7), and if so does it rest on something more specific than indispensability?

  Please write in continuous prose, as you would in an email, with no headings, bullet points, bold text or tables. As you answer, keep separate what is settled among people who work on this from what is genuinely contested, and tell me which of the claims you rely on fall into the second category rather than presenting a contested view as if it were the received one.
reasoning: |-
  Hmm, the user presents a sophisticated philosophical argument about wavefunction realism and wants to know where the reasoning goes wrong. They've constructed a chain of reasoning starting from the indispensability of ψ-surrogates in quantum mechanics to concluding that all probabilistic elements in scientific theories must be ontic, which leads to absurd conclusions like the epistemic interpretation of statistical mechanics being impossible.

  The user seems well-versed in philosophy of physics - they've clearly thought deeply about the implications of indispensability arguments. Their dilemma is that they want to accept the ontic status of the wavefunction (claim 4) but reject the parallel conclusion for statistical mechanics distributions (claim 6). The challenge is finding where the analogy breaks down without undermining scientific realism.

  Looking at the structure, the key tension lies in claims 2 and 3. Claim 2 is about predictive indispensability - that certain mathematical objects are necessary for generating predictions. Claim 3 then jumps from predictive indispensability to ontological commitment. This leap seems plausible for quantum mechanics but problematic when applied to statistical mechanics.

  The crucial difference might be in how these mathematical objects function within their respective theories. In quantum mechanics, the wavefunction isn't just predicting frequencies - it directly determines probabilities through the Born rule in a way that seems fundamental to the theory's structure. Whereas in statistical mechanics, the probability distribution serves a different purpose - it's a tool for handling ignorance about microscopic states while still predicting macroscopic behavior.

  I recall that in philosophy of physics, there's an ongoing debate about whether quantum probabilities are fundamentally different from classical probabilities. The user might need to appeal to something like the "parameter independence" criterion or other features that distinguish quantum contextuality from classical ignorance. But these are contested areas - experts like Harrigan and Spekkens have proposed formal criteria, but there's no universal agreement.

  The user also needs to consider whether indispensability arguments alone can establish ontology. Many scientific realists would argue that we need additional criteria beyond predictive indispensability - such as causal efficacy or explanatory depth. For statistical mechanics, we can explain why the probability distribution works without reifying it ontologically (by appealing to ergodicity or typicality), whereas no such explanation seems available for the quantum wavefunction if treated as merely epistemic.

  The cost of rejecting claim 3 in the statistical mechanics case is that it requires accepting that some indispensable predictive elements can represent ignorance - which then opens the door to psi-epistemic interpretations unless we can find a principled difference for quantum mechanics. That distinction likely needs to come from specific features of quantum theory like contextuality or the no-go theorems against hidden variables.
answer: |-
  Your reasoning is clever and exposes genuine tension in how we interpret indispensable structures across physical theories. I agree that (4) seems plausible while (7) appears reductio ad absurdum, and that the analogy between (5) and (2)-(3) feels strong. The weak link, I think, is claim (3), particularly its application across the board. Let me walk through why, and what this costs.

  Claim (2) is relatively uncontroversial: empirically adequate theories *do* require mathematical structures (ψ-surrogates, distribution surrogates) that encode the probabilistic predictions. Where the reasoning stumbles is in (3)’s leap from "indispensable for prediction" to "therefore ontic, not representing ignorance." This inference isn't automatic, even within scientific realism. The crucial point, contested but defensible, is that indispensability for prediction alone doesn't settle *how* a mathematical structure represents the world—whether it directly corresponds to a physical entity or state, or whether it encodes knowledge (or ignorance) about underlying physical states.

  In statistical mechanics, the probability distribution over microstates *is* indispensable for predicting macroscopic behavior. Yet, the standard interpretation (settled among most practitioners) is that this distribution *does* represent ignorance about the true, specific microstate. Its predictive success is explained by the dynamics (e.g., ergodicity, typicality) and the large number of degrees of freedom, which ensure that the macroscopic predictions hold for the vast majority of microstates compatible with our macroscopic knowledge. The distribution isn't itself a physical thing; it's a measure over the space of possible physical states (the microstates), reflecting our lack of complete information. Rejecting (6) doesn't undermine the theory's empirical adequacy or realism about the microstates themselves.

  The challenge is to block this epistemic interpretation for the ψ-surrogate without collapsing into (7). Here's where the genuine controversy lies. Proponents of wavefunction realism (like you aim to defend) argue that quantum mechanics differs fundamentally:

  1.  **No Underlying Microstate (in Standard QM):** Unlike statistical mechanics, standard quantum mechanics (without hidden variables) doesn't postulate underlying physical microstates *in addition to* the wavefunction. The wavefunction provides the most complete description of the system possible according to the theory. Claiming the wavefunction represents ignorance thus begs the question: ignorance *of what*? If there's nothing more fundamental it could be ignorant *about*, then the wavefunction itself seems like the candidate for the physical state.
  2.  **Contextuality & Non-commutativity:** Quantum predictions are inherently contextual. The probabilities assigned by the wavefunction depend critically on *which* measurement is performed. This contrasts sharply with classical probability distributions over microstates, where the probability of *any* macro-outcome is fixed once the microstate distribution is specified, regardless of how you choose to measure it. The wavefunction's role in generating these context-dependent probabilities is seen by many as more "active" and less like a mere summary of ignorance.
  3.  **The Failure of ψ-Epistemic Models (Within Standard Frameworks):** Formal no-go theorems (like PBR) aim to show that ψ-epistemic models, where the wavefunction represents ignorance about an underlying physical state *of a certain type* (e.g., satisfying "preparation independence"), are incompatible with quantum predictions. While the scope and assumptions of these theorems are debated (this is contested ground), they provide a *principled reason* specific to quantum mechanics to think the wavefunction cannot be interpreted merely as ignorance in the classical statistical mechanical sense.

  **Where this leaves your argument:**

  *   **Give up the universal applicability of (3):** The inference from "indispensable for prediction" to "therefore ontic, not encoding ignorance" is not universally valid. It fails for the probability distribution in statistical mechanics. Its validity for the wavefunction requires *additional, specific arguments* grounded in the unique structure of quantum mechanics (points 1-3 above).
  *   **Cost:** Accepting (4) now relies on more than just indispensability. It requires arguing that quantum mechanics lacks underlying determinate microstates (point 1), and/or that the unique role of the wavefunction in generating contextual probabilities (point 2) necessitates an ontic status, and/or that formal no-go results like PBR rule out viable epistemic interpretations (point 3). All of points 1-3 are areas of active philosophical and foundational debate.
  *   **Why (3) seemed sound:** Claim (3) captures a powerful intuition behind scientific realism: if a structure is indispensable for our best scientific explanations and predictions, we should be ontologically committed to it. This intuition *is* sound, but it doesn't automatically dictate *the nature* of that commitment. The structure could represent a physical entity, a law, a constraint, *or* information/ignorance about underlying entities. Discerning which requires looking at the *specific role* the structure plays within the theory and the *explanatory framework* offered. The cost of rejecting the universal (3) is acknowledging that indispensability alone isn't metaphysically decisive; we need deeper analysis of the theory's structure.
  *   **Reaching (4) without (7):** Yes, it's possible, but it hinges on arguments specific to quantum mechanics that aim to show why an epistemic interpretation analogous to statistical mechanics is untenable. This involves claiming either that there *is* nothing else to be ignorant *of* (ontic wavefunction as the complete state), or that viable ψ-epistemic models replicating quantum predictions are ruled out by the theory's structure or formal results. This path is robustly contested. Critics might argue that dynamical collapse theories or pilot-wave theories *do* provide underlying states for the wavefunction to be epistemic about, or that the no-go theorems make overly restrictive assumptions.

  In essence, the distinction between ψ-ontic and ψ-epistemic views is *not* empty, because the wavefunction *might* play a role fundamentally different from a classical probability distribution, due to the absence of underlying microstates in the standard formulation and the contextual nature of quantum probabilities. Blocking (6) while accepting (4) requires defending this "might" as an "is," based on arguments specific to quantum theory that go beyond simple indispensability. This remains the core, genuinely contested territory in the quantum foundations debate you're engaging with.
