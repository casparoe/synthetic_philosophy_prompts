prompt: |-
  I spent a career in experimental physics, and most of my quantitative life revolved around error bars: partitioning an error budget into statistical and systematic components, quoting intervals and checking by simulation that they actually cover, calibrating a detector against known standards before trusting its numbers, and refusing to take a quoted number seriously until I had been told what ensemble or model the interval was computed under. I have lately been reading about the Principal Principle — the requirement that a rational agent's credence in an event, conditional on the information that the event's objective chance is x, should simply be x — and about the disagreements over what such chances are supposed to be.

  I would like you to restate that principle, and the dispute surrounding it, as faithfully as you can in the vocabulary I actually use: unknown parameters and estimators, sampling distributions and coverage, calibration, within-model versus across-model uncertainty, and the difference between a quantity defined by a limiting frequency over repetitions and a quantity that only makes sense counterfactually. Please treat me as fluent in that vocabulary and as a beginner in philosophy, and do not give me references or a reading list.

  Then give me the residue report. Which parts of the principle translate cleanly — is deference to chance just consistency of an estimator, or is the chance playing the role of a calibrated instrument whose reading you take at face value, and can my vocabulary tell those apart? Which parts translate only with distortion — for instance, when the chance attaches to a single unrepeatable event, such as the chance that the matter density of the universe exceeds the critical value, where there is no ensemble to average over even in principle? And what cannot be said at all in my terms: the fact that the principle is usually hedged so that only certain further evidence may be added to the conditioning, and the awkward case where an agent's own evidence seems to bear on what the chances themselves are, rather than merely on what happened. For each piece of residue, tell me whether it indicts my vocabulary or suggests that the original claim is thinner than it looks — in particular whether "objective chance" is doing more work than "whatever it is that a rational agent defers to in this way."
reasoning: |-
  Okay, let me tackle this query from an experimental physicist who's deeply familiar with error analysis but new to philosophy. The user wants the Principal Principle translated into their scientific vocabulary—parameters, estimators, coverage, etc.—and a "residue report" on what gets lost in translation. 

  First, I need to restate the Principal Principle crisply: it's the rule that if you know the objective chance of event A is exactly x, then your personal belief in A should be x. The core dispute is about what "objective chances" actually are—are they limiting frequencies? Propensities? Or just placeholders for whatever we defer to?

  Now, mapping this to their world. The clean fits: chance as an unbiased estimator makes sense—like a perfectly calibrated instrument where the reading (chance=x) directly sets your expectation. Coverage probability aligns nicely too; if chances are well-calibrated, 90% chance-events should happen ~90% of the time. And the "no further evidence" clause? That's like conditioning on a statistical model while ignoring model uncertainty. 

  But the friction points are where physics vocab strains. Single unrepeatable events (like the universe's matter density) have no ensemble—so is "chance" just a subjective label here? Worse, when your evidence affects the chance itself (e.g., learning new physics that changes the density estimate), deference gets circular. Their vocabulary can't neatly handle self-locating evidence either, like knowing a radioactive coin landed heads but not if it's biased. 

  The residue suggests two things: First, "objective chance" might be overselling it—it's really "whatever reliably warrants deference." Second, their toolkit exposes where the philosophical concept is fuzzy, especially without repeatable trials. But crucially, the residue doesn't indict their physics framework; it shows philosophy's struggle to ground chances outside frequentism. 

  Final note: The user’s sharp on calibration—they’ll spot if I conflate coverage with unconditional calibration. Must distinguish "within-model" (statistical) and "across-model" (systematic) uncertainty when discussing chance deferral.
answer: |-
  Here's the Principal Principle (PP) and its disputes restated in your operational vocabulary, followed by a residue report on conceptual friction points.

  ### Restatement in Experimentalist Vocabulary
  1.  **The Principle:** If a rational agent knows that the *estimator* \(\hat{\theta}_A\) for the true parameter \(\theta_A\) (the "objective chance" of event A) is unbiased, has negligible variance, and is *calibrated* such that its reported value \(x\) implies perfect coverage (i.e., \(P(A | \theta_A = x) = x\) holds exactly under the generative model defining \(\theta_A\)), then the agent's subjective probability for A, conditional *only* on \(\hat{\theta}_A = x\), must be \(x\).
  2.  **The Dispute:** The core disagreement concerns the *ontology* of \(\theta_A\):
      *   **Frequentist View (Limiting Frequency):** \(\theta_A\) is defined operationally as the limit of the relative frequency of A over a well-specified, idealized infinite ensemble of identical, independent trials. PP holds iff \(\hat{\theta}_A = x\) is sufficient to specify this ensemble/model.
      *   **Propensity/Model-Dependent View:** \(\theta_A\) is an unknown parameter within a specific causal/generative *model* of the single system producing A. PP holds if the model is accepted as correct and \(\hat{\theta}_A\) is the relevant sufficient statistic.
      *   **Skeptical/Minimalist View:** \(\theta_A\) is merely *whatever entity* rational agents defer to via PP. Its operational content is *defined* by the deference rule, raising circularity concerns.

  ### Residue Report: Friction Points Between PP and Your Vocabulary

  1.  **Clean Translation (PP as Calibration/Consistency):**
      *   **Deference as Calibration:** PP translates cleanly to treating a *calibrated instrument* (the "chance mechanism") whose reading \(x\) you trust at face value for your expectation. The requirement that \(P(A | \theta_A = x) = x\) *within the defining model* corresponds directly to your calibration step. Knowing \(\theta_A = x\) is like knowing the instrument's calibration certificate is exact and universally applicable for predicting A.
      *   **Estimator Consistency:** If \(\theta_A\) is a limiting frequency, PP resembles using an unbiased, consistent estimator \(\hat{\theta}_A = x\) with perfect precision as your best estimate for \(P(A)\). Deferring to \(x\) is the rational move under squared error loss.

  2.  **Translation with Distortion (Conceptual Stretching Required):**
      *   **Single-Case "Parameters" (e.g., Cosmological Density):** This is the major distortion. Your vocabulary assumes \(\theta_A\) is defined via an ensemble (real or conceptual). For genuinely unrepeatable events:
          *   *Within-Model View (Distorted):* \(\theta_A\) becomes a fixed but unknown parameter within a *single-instance generative model*. PP demands treating the model's output \(x\) as your belief, conditional *only* on the model being correct and \(\hat{\theta}_A = x\). This feels like placing unjustified confidence in an unvalidated model's output.
          *   *Limiting Frequency View (Breaks):* No ensemble exists, even conceptually. Calling \(\theta_A\) a "limiting frequency" is nonsensical. PP seems to demand treating a *model-dependent counterfactual* (\(\theta_A\)) as if it were an ensemble-defined parameter.
          *   *Residue Verdict:* **Indicts neither fully.** Your vocabulary exposes the core issue: PP *requires* treating unrepeatable chances *as if* they were parameters defined over a validated ensemble, even when they demonstrably aren't. This highlights that PP is fundamentally a *prescriptive norm* ("treat it like a calibrated instrument") rather than a description of existing operational quantities. The concept of "chance" here is thinner than a repeatable-frequency parameter.

  3.  **Untranslatable Elements (Vocabulary Gap):**
      *   **The "Admissible Evidence" Hedge:** PP is conditional on knowing *only* \(\theta_A = x\) and "admissible" evidence. Your vocabulary struggles with:
          *   *Self-Locating Evidence:* Evidence about *which trial* in the ensemble is occurring (e.g., "This is the first trial after calibration") is often deemed "admissible." Distinguishing this from evidence *about the parameter \(\theta_A\) itself* (e.g., "The calibration might be wrong") relies on philosophical distinctions (e.g., Humean vs. non-Humean) not captured by "parameter," "estimator," or "model uncertainty."
          *   *Residue Verdict:* **Suggests PP is thinner/underspecified.** "Admissibility" is a primitive in PP. Your vocabulary highlights that without a rigorous operational definition of what constitutes evidence *about the outcome* A vs. evidence *about the chance mechanism/parameter* \(\theta_A\) (beyond simple sufficiency), PP lacks clear application rules. This gap is where paradoxes (e.g., undermining futures) arise.
      *   **Evidence Affecting the Chance Itself:** Cases where the agent's evidence E bears directly on \(\theta_A\) rather than just A (e.g., E = "The detector calibration drifted"). PP becomes: \(P(A | \theta_A = x, E) = ?\) PP strictly applies only if E is "admissible" (doesn't directly bear on \(\theta_A\)). But:
          *   Your vocabulary handles this easily: Update your belief about \(\theta_A\) using E, then use the posterior for \(P(A)\). \(P(A | \hat{\theta}_A = x, E) = \int \theta_A \cdot P(\theta_A | \hat{\theta}_A = x, E)  d\theta_A\).
          *   *Residue Verdict:* **Indicts PP's rigidity.** Your framework naturally handles learning about parameters. PP's need to exclude evidence about \(\theta_A\) feels artificial and highlights that it's a *special case rule* (deference under perfect knowledge of \(\theta_A\)) within a broader Bayesian framework for handling uncertain parameters. PP isn't the general rule; Bayesian updating of \(\theta_A\) is.

  ### Residue Summary: What "Objective Chance" Is Doing
  *   **"Objective Chance" as Warrant for Deference:** Your vocabulary confirms that PP's core demand is: *If you have an estimator \(\hat{\theta}_A\) for \(P(A)\) that you treat as having perfect accuracy and precision (zero error bar), then set your belief to its reading \(x\).* "Objective chance" \(\theta_A\) is essentially *defined* as *whatever property* justifies treating \(\hat{\theta}_A\) this way.
  *   **The Work It Does:** "Objective chance" primarily serves two roles that strain pure operationalism:
      1.  **Single-Case Justification:** It attempts to legitimize applying the deference norm (\(\hat{\theta}_A = x \implies P(A) = x\)) to unique events where no ensemble exists, by positing a mysterious "modal" or "causal" property \(\theta_A\).
      2.  **"Admissibility" Anchor:** It tries (often awkwardly) to delineate what evidence forces Bayesian updating *of \(\theta_A\) itself* (breaking PP) vs. evidence that just updates beliefs *within the fixed-\(\theta_A\) model* (allowing PP).
  *   **Verdict on Thinness:** **"Objective chance" is doing significant work, but it's work your vocabulary exposes as potentially problematic or non-operational.** PP relies on an entity (\(\theta_A\)) that behaves like a perfectly known, ensemble-defined frequency parameter *by fiat*, even in contexts (single case) where such a parameter cannot be operationally defined or validated. The residue suggests PP is a useful *normative ideal* ("trust perfectly calibrated instruments") rather than a direct reflection of a consistently definable physical quantity. Its coherence relies heavily on accepting the *model* within which \(\theta_A\) is defined. Your vocabulary doesn't indict itself; it reveals where the philosophical concept rests on non-empirical foundations, particularly for unrepeatable events and the admissibility carve-out.
