          - If one student has much better vision and is confident at 49, that's okay. We are looking at the group pattern. We can note that even for that student, there will be some borderline (maybe at 48) and the same phenomenon occurs.

      How to handle copying: 
          - Emphasize that it's individual and that they are only hurting their own understanding if they copy. 
          - Have them sit apart if possible.

      How to handle boredom: 
          - Make it fast-paced. 
          - The activity is only 15 trials per phase, so it should be quick.

      We hope that the scoring and the game aspect will engage them.

      Finally, we state the limitations:

          - The activity uses a scoring rule to impose a safety requirement. In reality, the safety requirement is a condition for knowledge (as per the safety theory of knowledge). We are not proving that knowledge requires safety; we are assuming it for the sake of the argument.

          - The condition we are examining (confidence) is a mental state, but we are using an external task to generate it. The students might wonder if the same applies to purely internal states. The original luminosity argument is about internal states (like feeling cold, being confident, etc.). We are using an analogy.

          - We have not shown that there is no luminous condition. We have only shown that for confidence (in this task) it fails. The original argument uses a more abstract chain of cases.

      But we have illustrated the machinery: the margin for error and the regress.

      Let's hope it works!
