     sum_r P(r) EU(a|r) = EU(a)

  does not hold for EU_Bea(a|r). Specifically, for a fixed a, sum_r P(r) EU_Bea(a|r) is not equal to EU(a). Therefore, we cannot replace the right-hand side with the prior EU.

