     V_Bea = sum_r P(r) max_a EU_Bea(a|r) >= max_a sum_r P(r) EU_Bea(a|r)

  But the right-hand side is not max_a EU(a) (the prior EU). So the inequality doesn't connect to the prior EU. Therefore, we cannot conclude that V_Bea >= max_a EU(a).

