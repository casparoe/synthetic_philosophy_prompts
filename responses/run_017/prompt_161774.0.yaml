    - Always surgery: EU = 8.0 (as above)  
    - Always drug: EU = 3.4  
    - If "+" surgery, "−" drug: EU = (0.64 × 10) + (0.16 × 2) + (0.08 × 0) + (0.12 × 9) = 6.4 + 0.32 + 0 + 1.08 = 7.8  
    - If "+" drug, "−" surgery: EU = (0.64 × 2) + (0.16 × 10) + (0.08 × 9) + (0.12 × 0) = 1.28 + 1.6 + 0.72 + 0 = 3.6  
    → Best directive: always surgery, EU = **8.0**  

  - **Perfect Bayesian:**  
    - P(A|+) = (0.8 × 0.8) / 0.72 ≈ 0.8889 → Chooses surgery (EU ≈ 8.8889)  
    - P(A|−) = (0.2 × 0.8) / 0.28 ≈ 0.5714 → Chooses surgery (EU ≈ 5.7143)  
    - EU(test) = (0.72 × 8.8889) + (0.28 × 5.7143) ≈ 6.4 + 1.6 = 8.0 (same as declining)  
    → Test value = 0 for perfect Bayesian; strictly negative for Bea in option 2 (6.83 < 8.0).  

  - If forced to take test and choose without directive, EU = 6.83 vs. 8.0 if she avoids seeing printout. She should pay up to **1.17** utility to avoid seeing it.  
  - **Why?** Prior-forgetting causes Bea to underestimate P(A) after "−", leading to suboptimal drug choice.  

  **(b)**  
  - **Failed step:** Step (2) fails. The swap relies on ∑_r P(r) EU(a|r) = EU(a) for any act a, but for Bea, EU(a|r) uses her prior-forgetting posterior (not conditionalization), so ∑_r P(r) EU_Bea(a|r) ≠ EU(a).  
  - **Why?** Her posterior P_Bea(A|r) = P(r|A) / [P(r|A) + P(r|B)] ignores her true prior (0.8), so expectations don’t reduce to the prior EU.  
  - **Objection assessment:**  
    - "Ignore it" works only if Bea precommits (via directive) to ignore the information in her action (e.g., always surgery gives EU=8.0). Without precommitment, she cannot ignore it (due to prior-forgetting), leading to EU=6.83.  
    - Presupposes control: The objection assumes agents can control whether to update beliefs or act on them, but Bea cannot control her updating disposition.  

  **(c)**  
  - **Decline test?** Not irrational: She can achieve EU=8.0 by declining or by directive (always surgery), avoiding loss from option 2.  
  - **Prior-forgetting?** Irrational: It violates conditionalization and causes suboptimal decisions when acted upon.  
  - **Good’s theorem:** It needs the explicit extra premise of updating by conditionalization. Without it, information can have negative value. Thus, it **cannot** independently justify conditionalization or wanting information, as it assumes the update rule it aims to support.  

