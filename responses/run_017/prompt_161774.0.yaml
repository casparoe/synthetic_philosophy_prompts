  The Question (as on the exam paper):

  Bea has a medical condition that is either strain A or strain B. Her credence that she has strain A is 0.8. Two treatments are available:
  - Surgery: utility 10 if A, 0 if B.
  - Drug regimen: utility 2 if A, 9 if B.

  Before deciding on a treatment, Bea can take a free test that will print either "+" or "-". The test characteristics are:
  - P(+|A) = 0.8, P(-|A) = 0.2
  - P(+|B) = 0.4, P(-|B) = 0.6

  Bea has a stable, well-documented disposition called "prior-forgetting": after seeing a test result R, she sets her credence in A to P(R|A) / [P(R|A) + P(R|B)]. She cannot change this disposition and she knows she has it.

  Bea has three options:
  1. Decline the test and never see the result.
  2. Take the test and then choose a treatment based on her updated (prior-forgetting) credences.
  3. Sign a binding directive now that commits her to a treatment (or to a rule mapping test results to treatments) whatever the printout says; then the test is run, she sees the printout, and she follows the directive.

  (a) Compute Bea's expected utility for each of the three options. Then, show that the expected value of the test is exactly 0 for a perfect Bayesian agent (who updates by conditionalization) but strictly negative for Bea (in the sense that option 2 has lower expected utility than option 1). State how much, in utility units, Bea should be willing to pay to avoid seeing the printout if she were forced to take the test and then choose without a directive. In one sentence, explain why the numbers come out as they do. (12 marks)

  (b) The standard proof that free information cannot have negative expected value (Good's theorem) for a Bayesian agent has two steps: (1) express the value of the signal as the expected maximum expected utility under the posterior, and (2) swap the max and expectation to show this is at least the maximum expected utility under the prior. For Bea, which step fails? Explain precisely why. Then, assess the objection: "Free information can't hurt because you can always ignore it." Does this work for Bea? What does this presuppose about what an agent can control? (8 marks)

  (c) Is Bea irrational to decline the test? Is she irrational to have the prior-forgetting disposition? What does this case show about Good's theorem: is it refuted, does it need explicit extra premises, or is it fine but does less work than people think? In particular, can Good's theorem be used as an independent argument that you ought to conditionalize or that you ought to want information? (5 marks)

