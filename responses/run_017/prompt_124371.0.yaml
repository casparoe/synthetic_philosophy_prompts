answer: |-
  ## Sestina for the Sheet

  From flatness springs a HAND, defined by CUFF,
  Its purpose clear: to trace a faithful LINE.
  This stroke intends a circle, forms a LOOP
  Returning to itself upon the PLANE.
  Its motion follows an unwritten RULE,
  Demanding counterpart, a second HAND.

  What summons forth this answering HAND?
  The boundary shifts where wrist meets paper CUFF.
  A new intent respects the shaping RULE,
  Commencing where the first leaves off its LINE.
  This genesis unfolds upon the PLANE,
  Completing what the prior started LOOP.

  The circle closes, forming one sure LOOP.
  Each action springs from that opposing HAND.
  No depth exists beyond the given PLANE,
  No substance past the folded edge of CUFF.
  Existence flows along the inked-in LINE,
  Bound by the logic of their mutual RULE.

  Is this constraint, this structuring RULE,
  Imposed from somewhere else, beyond the LOOP?
  Or does the power lie within each LINE,
  The consequence of each creating HAND?
  Is freedom found inside the paper CUFF,
  Or borrowed from above the thin PLANE?

  We only know the texture of this PLANE,
  The fixed procedure, the enacted RULE.
  No higher ground supports the rising CUFF;
  All meaning circles in this single LOOP.
  Authority resides in each deft HAND,
  Yet each depends upon the other’s LINE.

  The truth remains within the drawn LINE,
  The visible result upon the PLANE.
  This making hand, this seemingly free HAND,
  Is held accountable to its own RULE.
  There is no start, no end within the LOOP,
  Just birth emerging from the folded CUFF.

  What holds the system? Some unseen RULE?
  The steady surface of the waiting PLANE?
  Or is the folded edge, the paper CUFF,
  Itself the root, the anchor for the LOOP?
  The answer lies beyond each present HAND,
  Unspoken, like the silence past the LINE.

  All words are held within the closing LOOP.
  No LINE escapes the PLANE, no HAND the RULE.
  This CUFF defines the boundary, makes the whole.
