  The procedure should help moderators focus on observable structural behaviors rather than opinions or tone, creating more consistent outcomes even under time pressure.
answer: |-
  **Procedure for Assessing Accusations of Bad-Faith Argumentation**

  **1. Check for Asymmetric Standards (Core Test)**
     - **Question:** In this specific dispute, does the person apply a significantly higher burden of proof/challenge threshold to opposing views than to their own side? (e.g., demanding peer-reviewed studies to counter their anecdote; dismissing reputable sources they’d accept if aligned).
     - **Pass:** No observed asymmetry. *Action: Proceed to Step 2.*
     - **Fail:** Clear asymmetry (e.g., "You must prove X with data, but my opinion needs no support"). *Action: Issue warning/ban. Skip remaining steps.*
     - **Unclear:** Ambiguous or insufficient evidence. *Action: Proceed to Step 2.*

  **2. Check for Engagement with Opposing Arguments**
     - **Question:** Does the person accurately represent the strongest version of the opposing view *in this thread* (not requiring endorsement), or engage with substantive counterpoints without straw-manning?
     - **Pass:** Yes (e.g., "Your point about X is fair, but I disagree because Y"; restates opponent’s view reasonably). *Action: Proceed to Step 3.*
     - **Fail:** No. Misrepresents, ignores key points, or uses canned rebuttals. *Action: Issue warning. Stop.*
     - **Unclear/N/A:** No substantive counterpoints offered yet. *Action: Stop. No action unless other CoC violation.*

  **3. Check for Costly Concessions or Source Flexibility**
     - **Question:** In their *recent history* (last 3 months), is there evidence they’ve updated their view or conceded a point that would be unpopular with their own side? (e.g., "I was wrong about Z"; citing a source outside their typical bubble when challenged).
     - **Pass:** Yes (e.g., conceded a factual error; cited a source from an opposing outlet). *Action: Stop. No action for bad faith.*
     - **Fail:** No evidence of concessions or source flexibility. *Action: Issue warning for structural intransigence.*
     - **Unclear:** Insufficient history. *Action: Stop. No action for bad faith.*

  **Key Rules:**
  - **Use only observable message history.** No speculation about beliefs.
  - **Discard these current tests:** "Are they sincere?" (unknowable), "Would they *ever* change their mind?" (too broad).
  - **Keep these tests:** "Would they accept their own standard if reversed?" (Step 1), "Can they state the other side’s case fairly?" (Step 2).
  - **Escalate to committee if:** The dispute hinges solely on conflicting values (e.g., "Is free speech more important than inclusivity?"), not observable asymmetry.
  - **Time limit:** If not resolved by Step 3 within 15 mins, default to "no action" unless clear CoC breach (e.g., hate speech).

  ---

  **Worked Examples**

  **Case 1: Long-standing contributor (polite, one-sided, never concedes)**
  - **Step 1:** They demand rigorous citations from opponents but offer none for their own claims (e.g., "Show me the data!" vs. "Common sense says..."). → **FAIL.** Asymmetry confirmed.
  - **Action:** Warning/ban. *Procedure stops.* No need for further steps.  
  *Result: Structural asymmetry justifies action despite politeness or agreement with you.*

  **Case 2: Rude poster (retracted flawed study, argues with allies)**
  - **Step 1:** Applies similar evidence standards to all (e.g., criticizes weak sources from allies too). → **PASS.**  
  - **Step 2:** Engages with specific counter-arguments (e.g., "You’re right that study A has limitations, but study B says..."). → **PASS.**  
  - **Step 3:** Recent public retraction of flawed source shows costly concession. → **PASS.**  
  - **Action:** No bad-faith finding. *Address tone separately under CoC.*  

  **Case 3: New member (demands impossible endorsements)**
  - **Step 1:** Imposes impossible standard on opponents ("You must make me endorse your view") but none on self. → **FAIL.** Asymmetry confirmed.  
  - **Action:** Warning for weaponizing procedural demands. *Procedure stops.*  

  ---

  **What This Procedure Cannot Do**  
  1. **Distinguish bad faith from ignorance:** Both may fail Step 1. Treat factual ignorance with corrections, not bans.  
  2. **Resolve pure value conflicts:** Escalate these to the committee.  
  3. **Guarantee "fair" outcomes:** It will flag asymmetric users on *your side* (Case 1) and protect reachable critics (Case 2).  
  4. **Detect insincerity:** Focuses on observable structural behaviors, not hidden motives.  
  5. **Replace appeals:** All bans require committee review per your rules.
