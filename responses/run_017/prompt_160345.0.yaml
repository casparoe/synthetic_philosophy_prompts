  The user has identified three aspects of bad faith: insincerity, closed-mindedness, and asymmetry (unequal standards). They believe asymmetry is the most important and observable issue. They also mention the risk of echo chambers forming when members discount outside sources. They want a procedure that focuses on observable behaviors rather than trying to judge sincerity, which is hard to assess.

  I need to create a concise, step-by-step procedure that moderators can follow in 15-20 minutes. It should include specific questions, clear pass/fail criteria, stopping points for no action or escalation, and guidance on which current tests to keep or discard. Then I'll apply this procedure to three real cases they provided.

  For the procedure, I'll focus on observable asymmetry as this seems most actionable. Key elements should include:
  - Checking for double standards in evidence/challenge thresholds
  - Looking for engagement with opposing viewpoints
