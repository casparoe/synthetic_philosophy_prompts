prompt: |-
  Two people in my policy-and-philosophy reading group spent most of an hour going at each other last week over a hypothetical bill, and since I'm chairing the next session I'd quite like to know who actually won rather than just nodding along.

  Setup: a legislature is openly considering banning, explicitly on grounds of public morality and not harm, the commercial production of photorealistic synthetic sexual material featuring only fictional adults — no real person depicted, consumed alone, so no victim, and if nobody ever finds out, no offence either. Call the pro-ban side Mara and the anti-ban side Theo.

  (1) Mara: the "no victim, no crime" move can't be the whole story, because criminal law already punishes plenty of things with no identifiable victim — cruelty to animals, mistreatment of corpses, consensual adult incest, some environmental offences. So the real question isn't whether victimless wrongdoing can be criminalised but which victimless wrongs count, and a society is entitled to protect the shared moral environment it depends on.
  (2) Theo: fine, but Hart doesn't need a pure harm principle, he needs a distinction between rules that hold a society's cooperative framework together and rules that just register majority disgust. Concretely — a coordination audit: criminalise only where my compliance sensibly depends on your compliance, like driving on one side, keeping contracts, not perjuring yourself. Self-regarding sexual conduct flunks that audit; animal cruelty and pollution can be recast as harm to sentient creatures or to identifiable present people.
  (3) Mara: the audit sounds principled but it's useless as a stopping rule, because moral norms are held up by mutual expectations too. Nobody thinks their private indulgence is being observed, yet the norm decays once enough people quietly stop treating it as binding, and you only find out afterwards — it's like antibiotic resistance, the evidence arrives once the thing is already gone. Demanding proof of decay before acting is demanding the one kind of proof you can only get by waiting till it's too late, so the right posture is precaution, not evidence of harm.
  (4) Theo: precautionary reasoning here is perfectly symmetric and therefore empty. Every liberal reform we now take as progress — decriminalising homosexuality, loosening divorce law — was opposed with exactly this "the moral fabric will fray" claim, and it was false then. You owe us a way to tell real fraying from moral panic, and "we'll know retrospectively" isn't one.
  (5) Mara: okay, then take irreversibility as the test instead of harm or evidence — enforce moral norms whose loss can't be undone. You can re-legalise a drug; you can't restore a norm once enough people have abandoned it. And underneath all this, you're assuming law is purely instrumental. It isn't: law also expresses what a society stands for, and you already accept expressive criminalisation for hate crime, so your objection isn't to moralism as such, it's to moralism you happen to disagree with.
  (6) Theo: irreversibility is cheap to allege and moral progress is often irreversible too, so the test cuts both ways and picks out nothing. On expressivism, I'll grant the law expresses things — but an expressive argument has to be won on the content of what's expressed, and a law can express "we protect the vulnerable" without expressing "we despise you," so expressivism doesn't get you to Devlin.

  Can you adjudicate this move by move — which of the six land, which are weak or question-begging, and where each of them is definately right about something the other sidesteps — and then say who's more right overall, plus what both of them are missing?

  Lead with your bottom line in the first sentence, then give the reasoning, no preamble and no restating the question. British English please.
reasoning: |-
  Hmm, the user is chairing a policy-and-philosophy reading group where two members had a heated debate about banning synthetic pornography featuring fictional adults. They want me to adjudicate who won the argument between Mara (pro-ban) and Theo (anti-ban), analyzing their six moves and identifying what each got right or sidestepped. The user wants a bottom-line verdict first, then detailed reasoning in British English.

  Looking at the debate structure: Mara starts by challenging "no victim, no crime" by listing victimless crimes. Theo counters with Hart's coordination principle. Mara rebuts with the irreversibility of norm decay. Theo calls this symmetric to past moral panics. Mara pivots to irreversibility and law's expressive function. Theo dismisses irreversibility as cheap and demands substance for expressivism.

  Assessing each move:
  - Mara's first point (victimless crimes) is strong historically but weak conceptually - she doesn't prove why this case fits.
  - Theo's coordination audit is coherent for core legal functions but ignores how norms actually sustain cooperation.
  - Mara's antibiotic analogy is vivid but speculative - she assumes decay without evidence.
  - Theo's symmetry argument is powerful against slippery slopes but glibly equates all moral conservatism with past errors.
  - Mara's irreversibility thesis is original but unsubstantiated - many norms revive (e.g. sobriety movements).
  - Theo's expressivism critique is correct that content matters, but he dismisses how law shapes culture beyond harm prevention.

  Theo edges it overall because his framework offers clearer limiting principles, while Mara relies on unproven sociological claims. But both miss key nuances: Mara underplays how moral enforcement can backfire, Theo overlooks law's role in norm-maintenance beyond coordination problems. The core gap is their undeveloped theories of how norms form and dissolve - Mara sees them as fragile, Theo as epiphenomenal, but neither engages with cultural evolution models.

  For the verdict, Theo wins narrowly by exposing flaws in Mara's precautionary stance, though his coordination principle needs expanding to account for cultural infrastructure.
answer: |-
  Theo marginally wins on points by exposing weaknesses in Mara's precautionary and expressivist arguments while offering a more coherent limiting principle, though both overlook critical nuances about norm dynamics.

  **Adjudication move-by-move:**  
  (1) **Mara lands partially.** Correct that victimless crimes exist (e.g., desecration laws), rightly shifting focus to *which* wrongs qualify. But sidesteps Theo’s likely retort: those examples often involve indirect harm/sentience (animals) or relational betrayal (incest). Weak by assuming this hypothetical ban fits that category without argument.  
  (2) **Theo lands strong.** Hart’s coordination principle (compliance interdependence) credibly distinguishes core legal functions (contracts, traffic rules) from purely moralistic bans. Recasting animal cruelty as harm to sentients is sound. Sidesteps *how* "identifiable present people" are harmed by norm decay—a hole Mara exploits.  
  (3) **Mara weak/question-begging.** Antibiotic analogy is vivid but speculative. Asserts norm decay *must* occur without evidence, demanding precaution sans criteria. Theo rightly later highlights this symmetry: identical arguments opposed homosexuality decriminalisation. Mara sidesteps *why* this norm specifically underpins social order.  
  (4) **Theo lands decisively.** Destroys Mara’s precautionary stance by showing its historical abuse against liberal reforms. "You owe us a way to tell real fraying from moral panic" is unrefuted. Correct that retrospective proof is circular. Sidesteps Mara’s irreversibility pivot—but rightly demands substantiation.  
  (5) **Mara weak/question-begging.** Irreversibility test fails: norms *can* rebound (e.g., declining smoking post-education). Expressivism point is valid (law *does* symbolise values), but wrongly equates hate crime laws (protecting vulnerable groups) with banning private fantasy. Theo *does* object to moralism lacking vulnerable-protecting rationale—Mara sidesteps this distinction.  
  (6) **Theo lands solidly.** Exposes irreversibility as non-discriminatory (moral progress is also irreversible). Expressivism critique is sharp: content matters, and Mara hasn’t shown this ban expresses protection (not mere disgust). Correct that Devlin-esque "moral environment" claims need justification beyond assertion. Sidesteps law’s role in *shaping* norms pre-emptively—Mara’s core concern.  

  **Overall:** Theo wins 4-2 on moves. His coordination audit (+ historical symmetry rebuttal) provides a clearer, abuse-resistant threshold for criminalisation. Mara’s expressivism/precaution lacks limiting principles, risking majoritarian overreach. Yet Theo’s framework undervalues law’s norm-sustaining role, and Mara rightly notes that some coordination (e.g., trust in institutions) *depends* on unenforceable norms.  

  **What both miss:**  
  - **Mara’s blind spot:** Never substantiates *why* this specific material erodes essential norms. Assumes decay is inevitable/irreversible without sociological evidence (e.g., does private fantasy *actually* weaken public sexual ethics?). Overlooks that norm enforcement can backfire, fostering resentment.  
  - **Theo’s blind spot:** Dismisses how law *constitutively* shapes moral ecology beyond direct harm. If shared norms enable cooperation (e.g., mutual respect), their unregulated erosion *could* indirectly harm society—but he offers no test for this. His audit struggles with "soft" coordination problems like truth-telling in non-legal contexts.  
  - **Shared gap:** Neither engages with empirical realities: does synthetic material reduce demand for exploitative content? Is norm decay measurable? Both treat norms as monolithic rather than contested, adaptive constructs. Legal moralism requires thicker justification than abstract precaution or proceduralism.  

  **Final score:** Theo wins narrowly—his principles better constrain state power, while Mara’s arguments remain undefended in their empirical premises and vulnerable to tyranny-of-the-majority critiques. But the hypothetical legislature would need far stronger evidence to justify banning self-regarding acts.
