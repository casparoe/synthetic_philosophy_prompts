answer: |-
  1. **Setup and Initial Reference Class Choice (5 min):** Prepare two opaque bags: SHORT with ping-pong balls numbered 1–20, LONG with 1–40 (to avoid high-number certainty). Give each participant 10 poker chips, an index card, and a pen. Instruct: "Secretly write which group you consider yourself a typical random member of—options: all humans ever, all alive now, all future humans, all mammals, or your own brief definition. Seal the card immediately. This stays private until the end."  

  2. **Draw and First Betting Round (15 min):** Flip a coin (unseen) to select SHORT or LONG; draw one ball, display its number. Announce: "Stake any integer chips (0–10) on SHORT or LONG. Payoff: correct bet returns double staked chips; wrong bet loses staked chips. Goal: maximize chips." (e.g., staking 5 on SHORT and winning yields 10 new chips; losing leaves 5 chips). This scoring incentivizes honest belief via expected value maximization.  

  3. **Reference Class Revision and Second Bet (10 min):** Announce: "You may reopen your card, change your reference class, and write one reason (e.g., 'I realized mammals include non-humans'). Cost: 1 chip. Then reseal." After revisions, repeat betting with remaining chips under identical rules.  

  4. **Reveal, Scoring, and Catastrophe Allocation (15 min):** Reveal the true bag and resolve payoffs. Collect cards, share reference class choices/reasons, and correlate with bets (e.g., "Who saw ball 10 but bet opposite due to different classes?"). Then: "Allocate 15 imaginary minutes: how many to prevent civilisational catastrophe (e.g., AI risk research) vs. personal enjoyment? Record privately."  

  5. **Debrief and Pitfalls (15 min):** Map: initial card = reference class choice; ball number = birth rank; betting shifts = Bayesian update on total observers. Highlight: "Your class choice controlled the update’s strength—e.g., 'all mammals' dilutes evidence, making LONG seem likelier despite low rank." Predictable issues: physicists may derail ("Fair coin prior!")—clarify betting exploits evidence, not prior, and wins/losses demonstrate belief shifts. High draw (e.g., 30) forces LONG revelation—use hypothetical ("If it was 10...") to salvage. Unreproducible: real birth rank’s non-uniform prior and existential stakes—explicitly state these during debrief.
