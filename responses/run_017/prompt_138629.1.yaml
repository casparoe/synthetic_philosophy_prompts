  I work on the evolution of cooperation in theoretical biology, and the vocabulary I actually think in is inclusive fitness, Hamilton's rule, relatedness as a regression coefficient, the Price equation, replicator dynamics and correlated equilibria, assortment mechanisms (kin recognition, greenbeards, repeated interaction), and geometric-mean fitness under bet-hedging. Restate, as faithfully as you can, the case for superrationality in a one-shot Prisoner's Dilemma between exact copies of a single decision procedure — Hofstadter's coinage, including the move from "we are both rational" to "so our choices cannot come apart," which is the step I have never been able to cash out — in exactly that vocabulary, and then give me the residue report.

