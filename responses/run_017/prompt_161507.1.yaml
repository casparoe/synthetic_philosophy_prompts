  Hmm, the user is running a neuroscience lab with a honeybee brain-implant project and needs to predict how an ethics panel will rule on its moral status. This panel has a complex track record: pigs and octopuses get high consideration, lobsters moderate, individual bees minimal, but entire colonies zero despite collective intelligence. Human brain organoids and AI systems also get zero weight.

  The user's hybrid bee has 60% neuromorphic implants that actually enhance some cognitive functions like memory retention. The challenge is reverse-engineering the panel's decision rules from inconsistent precedents and predicting their ruling. 

  Looking at the precedents, several patterns emerge. Biological continuity seems crucial - natural neurons get weight while artificial replacements don't. But the lobster/bee colony contrast suggests individual embodiment matters more than collective cognition. The cortical organoid case implies sensory input/output is necessary, yet bees have minimal status without complex behaviors. 

  The thermostat and LLM rulings hint at skepticism toward artificial systems, but with openness to future AI consideration. That's why the potential rules I'm considering include:
  - Biological neuron count (strained by bee colonies having neurons but zero status)
  - Phenomenal consciousness indicators (problematic for brain organoids)
  - Evolutionary continuity (but octopuses are distant from mammals)
  - Embodied goal-directedness (fits most cases except maybe the lingering issue of bee colonies)

  For the 60% bee, rules focusing on biological substrate would downgrade it substantially since most neurons are artificial. Consciousness-based rules might give minimal weight like a normal bee. Embodied cognition rules could go either way since it maintains key behaviors.

  The bee colony precedent remains the thorniest case - it has neurons and cognition but zero moral weight. This breaks purely neurocentric or cognitive-capacity rules. The panel seems to heavily discount distributed cognition, which is why embodied individual agency appears central.

  For future tests, comparing neuron-by-neuron replacement versus whole-brain emulation could discriminate between biological and functionalist views. A cyborg mouse case would pressure the species boundary issue. 

  The user should frame their protocol to emphasize: 
  1) Preservation of natural sensory-motor loops
  2) Documenting all stress responses
  3) Avoiding cognitive enhancement narratives
  4) Maintaining baseline behaviors
  5) Demonstrating naturalistic learning

  This avoids gaming the system while covering all plausible criteria - from biological integrity to behavioral phenomenology.
