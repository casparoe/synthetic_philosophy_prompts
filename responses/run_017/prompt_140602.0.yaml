  For the decision procedure, I'll structure it as a flow of questions the volunteer can ask themselves in sequence. Each step should have clear pass/fail criteria and indicate when to stop or escalate. Key milestones: "Can I answer directly?" → "Will they understand?" → "Will it hold up without context?" → "Is silence acceptable?" → "Must I override?"

  For the case studies: The 82-year-old's lab results case will likely show that "within normal limits" is technically true but misleading. The water filter certification demonstrates how true statements can be weaponized. The flood map email reveals how written fragments fail without context. Each exposes different failure modes of technically-true-but-misleading statements.

  The procedure must acknowledge its own limitations - it can't handle every value conflict, can't protect against deliberate misinterpretation, and struggles most when institutional constraints (like the no-advice rule) collide with moral necessity. I'll explicitly note what philosophical nuance was sacrificed: intent distinctions, cultural context, and the gray area between deception and poor communication. But in exchange, they get something usable in 2-minute consultations.
answer: |-
  Below is a practical decision procedure distilled from ethical principles on deception (drawing on philosophers like Kant, Bok, and Grice). I've stripped it to **5 key tests** focused on outcomes, not intent. **The core principle: Your goal is to leave the person with *accurate understanding*, not just "true statements."** Jargon-free explanations for volunteers are in *italics*.

  ---

  ### **The "Clear Understanding" Checklist**  
  *(Run these tests in order during the conversation. Stop if any test fails.)*

  1.  **TEST 1: CAN I ANSWER THE EXACT QUESTION?**  
      *   *Ask yourself: "If I answer just the words they used, will they get the right idea?"*  
      *   **GOOD ENOUGH:** Yes, if their question uses precise terms AND matches the document's key point.  
      *   **STOP & RETHINK IF:** The question is oversimplified ("Is it safe?"), uses vague terms ("normal"), or misses the document's main risk/benefit.  
      *   **VALUES CALL?** No – this is factual. If the question is flawed, move to Test 2.  
      *   *Dropped Distinction:* "Literal truth." A technically true answer to a bad question often misleads. Cost: None – avoiding bad questions is practical.

  2.  **TEST 2: CAN I CLARIFY THE QUESTION SAFELY?**  
      *   *Ask yourself: "Can I rephrase their question *with them* so it's better, using only facts from the document?"*  
      *   **GOOD ENOUGH:** Yes, if you can say: *"I think you're asking about X. The document says Y about X."* AND they confirm they understand.  
      *   **STOP & RETHINK IF:**  
          - They get confused or insist on their original wording.  
          - Clarifying requires interpretation beyond the document (e.g., medical/legal implications).  
      *   **VALUES CALL?** No – stick to the document. If clarification fails, move to Test 3.  
      *   *Dropped Distinction:* "Implicature." We focus on mutual understanding, not subtle inferences. Cost: Low – this is about active listening.

  3.  **TEST 3: WILL A SIMPLE "TRUE" ANSWER STAND ALONE?**  
      *   *Ask yourself: "If I say this true sentence, will the person walk away (or forward it) *without* missing a critical fact?"*  
      *   **GOOD ENOUGH:** Only if the answer includes ALL key qualifications (e.g., "It's certified *for material safety*, not lead removal").  
      *   **STOP & SAY NO IF:**  
          - Adding needed context violates library rules (e.g., explaining medical significance).  
          - The true answer is easily weaponized out of context (e.g., "It's certified" on a filter box).  
      *   **VALUES CALL?** Yes, here. If a true answer omits critical context, you must choose: *Give an incomplete truth (risking harm), refuse to answer, or bend rules to add context?*  
      *   *Dropped Distinction:* "Lying vs. Misleading." We focus on harm from *missing context*. Cost: Moderate – but intent matters less than outcome here.

  4.  **TEST 4: IS SILENCE OR DEFERRAL SAFER?**  
      *   *Ask yourself: "If I say 'I can't answer that, talk to your doctor/city hall/lawyer,' will that likely prevent harm?"*  
      *   **GOOD ENOUGH:** Yes, if the risk is low or they have clear next steps.  
      *   **STOP & SAY NO IF:**  
          - They can't access help (e.g., no doctor, language barrier).  
          - The document is urgent/scary and silence leaves them panicked or misinformed.  
      *   **VALUES CALL?** Yes. Balancing harm from misinformation vs. harm from institutional rules.  

  5.  **TEST 5: MUST I OVERRIDE "NO ADVICE" TO PREVENT HARM?**  
      *   *Ask yourself: "Is there immediate, serious danger (health, fraud, safety) if I don't intervene clearly?"*  
      *   **GOOD ENOUGH:** Only if you state the danger factually: *"This says your account is suspended – but real banks don't text links. This is likely fraud."*  
      *   **STOP & ESCALATE IF:** It's medical/legal and ambiguous (e.g., abnormal lab result). Refer to coordinator.  
      *   **VALUES CALL?** Critical. Use only for imminent harm (scams, acute safety risks).  

  ---

  ### **What the Procedure CAN'T Do**
  1.  **Fix Systemic Ignorance:** It can't make up for gaps in public education about documents.
  2.  **Prevent Deliberate Misuse:** Someone might twist your words later (e.g., nephew forwarding an email).
  3.  **Resolve Deep Value Conflicts:** If "no advice" rules *cause* harm (e.g., confusing lab results), that's an institutional ethics issue, not solvable at your table.

  ---

  ### **Case Applications**

  **Case 1: 82yo man, "Is everything normal?" (Lab results "within normal limits" w/ wrong age range)**  
  - **Test 1:** FAILS. "Normal" is vague; his question ignores age context.  
  - **Test 2:** TRY: *"You're asking if results are OK? The lab marks them 'within normal limits,' but this range is for younger adults. For your age, some doctors might want different numbers."*  
  - **Test 3:** FAILS if you just say "Yes, it says normal limits." Omits critical context.  
  - **Test 4:** DEFER? Unwise. He may not see a doctor otherwise.  
  - **Test 5:** NOT acute harm, but risk of untreated issue.  
  - **VERDICT:** Test 2 is best. If he rejects clarification, say: *"It says 'normal' by the lab's standard, but please show this to your doctor – they know your history best."* **You dislike it** because "normal" feels deceptive, but Test 5 doesn't justify overriding rules.  

  **Case 2: Woman with water filter, "Does it take lead out?" (Certified only for additives)**  
  - **Test 1:** FAILS. "Certified" doesn't mean "removes lead."  
  - **Test 2:** TRY: *"You're asking about lead removal? The certification mark means it doesn't *add* harmful things. The box doesn't say it removes lead."*  
  - **Test 3:** FAILS SPECTACULARLY if you say "It's certified." Alone, that's weaponizable.  
  - **Test 4:** Deferral is safe if she can check NSF databases. But unlikely.  
  - **Test 5:** Not acute harm (unless lead levels known high).  
  - **VERDICT:** **Test 2 is essential.** If she insists on a simple answer: *"Certified doesn't guarantee it removes lead. Check the NSF code online or call the company."* **Technically true phrasing ("It's certified") is worse than refusing here** – it actively misleads.  

  **Case 3: Flood map email for nephew**  
  - **Test 1:** FAILS. "Two sentences" can't capture nuance.  
  - **Test 2:** N/A (No back-and-forth).  
  - **Test 3:** **CRITICAL FAIL.** Written fragments *always* lack context. "Zone X = low risk" might skip "in 2023 map; pending updates."  
  - **Test 4:** SAFEST. "I can't email summaries; maps are complex. Give your nephew this FEMA link or the library's map handout."  
  - **Test 5:** Only if flood is imminent (e.g., closing next week).  
  - **VERDICT:** **Stop at Test 3. Refuse the email.** Say: *"Maps need explanation. I’d risk leaving out something key in writing. Bring your nephew in, or I’ll print the official page with notes."* **You dislike refusing a regular, but email is high risk.**  

  ---

  ### **Key Takeaways for Volunteers**
  1.  **"True but misleading" is as bad as lying if it causes harm.** Your duty is understanding, not wordplay.  
  2.  **When in doubt, say less.** "I can't answer that fully – please show this to [expert]" is safer than a partial truth.  
  3.  **Jargon kills clarity.** Use "This doesn't say it stops lead" not "The certification is limited to additives."  
  4.  **Written snippets are landmines.** Avoid them unless they include *all* caveats (which they rarely can).  

  **The cost of simplicity?** We dropped philosophical debates about *intent* and *blame*. In practice, **impact trumps intent**. A misleading truth can wreck lives faster than a well-intentioned lie. Your procedure prioritizes preventing harm over technical honesty – which is exactly where your unease about "technically-true phrasing" proves justified.
