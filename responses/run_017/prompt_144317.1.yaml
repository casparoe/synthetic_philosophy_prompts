prompt: |-
  I sit on the rules-architecture committee of a self-governing institution — imagine the game Nomic, except that the moves bind real members, some of whom would prefer the institution to stop being self-governing. Our remit is the amendment layer: which rule governs changes to which rule, and how that layer can itself be changed. Before we draft anything, I want a specification of the *theory*, not of the constitution: what an adequate account of a self-amending normative system has to deliver in order to be usable as a stress-test checklist — good enough that we can take any sequence of formally correct moves and ask where, if anywhere, it stops being an amendment and becomes a capture. That purpose should fix which requirements are non-negotiable.

  What I want from you is the requirements list, each with the case or consideration behind it: the distinctions the theory must be able to draw, the acts it must be able to classify, the results it must not contradict, and the questions it must be allowed to leave open. Mark each as non-negotiable for my purpose, negotiable, or a preference of one family of accounts that has been dressed up as a requirement. Tell me where I have listed two requirements that are really one, or one that is really two.

  Here are the cases I want the list to be answerable to, with what I take each to be a case of; correct my classification where it is wrong.

  1. The entrenchment ladder: a rule raises the threshold for its own amendment, and later makes itself unamendable. Must a theory represent degrees of entrenchment, or is the unamendable simply the limit case?
  2. Self-ratifying franchise shift: an amendment changes which body must assent to amendments, and is ratified by the body it creates. Is this a separate kind of act, or the ordinary case seen clearly?
  3. The mutually dependent package: two amendments, each invalid until the other has passed, enacted as a single package. I suspect any theory that evaluates amendment acts one at a time fails here, and that the real requirement concerns what counts as one act.
  4. The renumbering gambit: a preliminary amendment moves the rule protecting a class of rules outside that class, which is then amended by ordinary procedure. This looks like the same requirement as (3) in a different costume, but I am not certain.
  5. Retroactive self-illegalization: an amendment that makes its own enactment a violation, or that takes effect from a date before it was ratified.
  6. The façade: the amendment procedure is left untouched, but an authoritative reinterpretation of a rule has every effect of an amendment. If reinterpretation is not an amendment, the amendment rule has no bite; if it is, then every application risks being one and the system cannot act at all. I take this to be the hardest case, and I would rather you stated the requirement it grounds correctly than that you fitted it to my wording.
  7. Invalid but effective, and valid but inert: a seizure of the amendment power that officials subsequently treat as law; a formally valid amendment universally ignored. Must a theory of self-amendment connect validity to what officials actually do, or does that belong to a different theory entirely?
  8. The penalized motion: a rule providing that any motion to amend it is itself a violation. Can a prohibition protect its own amendment procedure, and what is the status of the attempted act?
  9. Systemic identity: an amendment deletes the amendment rule and replaces it with deference to a single office, or replaces the entire rule set while leaving the amendment rule standing. Does the theory need a criterion for when an amendment yields a successor system rather than a modified one, and can that criterion be internal to the system?

  The part I most want is the jointly unsatisfiable subset. My own candidates: that every valid change is authorized by the system's existing rules, versus the ability to represent a change in the system's ultimate criterion of validity as more than a violation; that the theory return a determinate verdict for every self-referential act, versus the system's being permitted genuine gaps, including about its own amendment; content-neutrality of the amendment power, versus the capacity to entrench a core; and symmetry between entrenching and dis-entrenching, versus the capacity to make an irreversible commitment. Say which of these is a real impossibility rather than a tension, give the strongest version of the argument, and tell me which desideratum I should drop given that my purpose is detecting capture rather than vindicating continuity.

  Then: which single requirement excludes the largest share of accounts? Against that, score three families in two or three lines each — accounts that ground validity in a presupposed ultimate rule, accounts that ground it in the practice and acceptance of officials, and accounts that avoid self-reference by stratifying rules into levels with amendment rules always one level up. Describe them by their shape, name no authors, and give me no reading list; the list of criteria is the deliverable, and I can find the library myself. Finally, say what a theory of this kind should not be asked to do at all.
reasoning: |-
  Hmm, this is a fascinating and complex query about designing a self-amending normative system. The user sits on a rules-architecture committee for a real-world self-governing institution, needing theoretical foundations to distinguish legitimate amendments from institutional capture. 

  The user clearly has sophisticated legal-theoretical knowledge, referencing Nomic and specific edge cases like the "façade problem." Their core need is a stress-test checklist - not a constitution draft, but the meta-requirements for evaluating any amendment theory. The emotional subtext suggests urgency: some members want to dismantle self-governance, making this theoretical framework practically vital.

  Breaking this down:
  First, the requested requirement list must cover all nine cases, with:
  - Clear classifications (non-negotiable/negotiable/preference)
  - Consolidation of overlapping cases (e.g., case 3 and 4 both concern amendment sequencing)
  - Analysis of impossible tensions (like validity-vs-change paradoxes)

  The nine cases present nested challenges:
  - Temporal paradoxes (retroactivity in case 5)
  - Self-reference traps (entrenchment in 1, self-illegalization in 8)
  - Boundary disputes (systemic identity in 9)
  The "façade" case (6) is indeed hardest - it exposes how interpretation can circumvent formal amendment rules, demanding a theory that either incorporates interpretive practices or cleanly separates amendment from application.

  For the "jointly unsatisfiable" tensions:
  The validity-vs-change paradox is fundamental. If every change requires existing authorization, how can the validity criterion itself change? This isn't just tension but logical impossibility without accepting either (a) bootstrapping (self-ratifying changes) or (b) external validation (officials' acceptance). Since the user prioritizes capture-detection over continuity, I'll suggest dropping formal validity as absolute - a system can't reliably self-diagnose seizures if it can't acknowledge its own rules have been replaced.

  The most exclusionary requirement is likely "handling self-referential entrenchment" (cases 1,8,9) - it rules out strict hierarchical theories (Kelsen-style level-stratification) that can't handle rules modifying their own amendment conditions. Practice-based theories (Hart-style) handle this better but struggle with determinacy.

  Finally, the theory shouldn't predict future behavior (e.g., whether officials will enforce an amendment) - that's sociology, not normative theory. Its job is mapping logical boundaries, not forecasting compliance.
answer: |-
  Below is a requirements list for a theory of self-amending normative systems, structured for your purpose of detecting institutional capture. Each requirement is classified (🔒 = non-negotiable, ⚖️ = negotiable, 🌈 = preference disguised as requirement), with justifications tied to your cases. Overlaps and tensions are explicitly called out.

  ---

  ### **Core Requirements for a Stress-Test Checklist**  
  **Non-negotiable requirements must enable detection of *covert transitions* from amendment to capture.**

  1. **🔒 Distinguish *procedural validity* from *substantive authority*.**  
     - **Why**: Separates formal compliance (e.g., "correct" voting on an amendment) from whether the act preserves self-governance.  
     - **Case coverage**: Critical for #7 (invalid but effective/valid but inert) and #9 (systemic identity).  

  2. **🔒 Model *entrenchment gradients* (not binary "amendable/unamendable").**  
     - **Why**: Captures degrees of protection (#1) and irreversible commitments (e.g., making a rule unamendable). Avoids misclassifying ladder-climbing (#1) or renumbering (#4) as valid.  
     - **Tension**: Conflicts with symmetry between entrenching/dis-entrenching (irreversibility is necessary for anti-capture).  

  3. **🔒 Define *atomicity of amendment acts***.  
     - **Why**: Must evaluate interdependent packages (#3) or sequenced moves (#4) as single units. Prevents "divide-and-validate" evasion of holistic intent.  
     - **Overlap**: #3 (mutual dependency) and #4 (renumbering gambit) are two faces of this requirement.  

  4. **🔒 Address *temporal paradoxes* explicitly.**  
     - **Why**: Retroactive self-illegalization (#5) or backdated validity create self-referential loops. Theory must flag these as either invalid or capture attempts.  
     - **Limit**: No need to "resolve" paradoxes—only detect their use to subvert governance.  

  5. **🔒 Acknowledge *interpretive authority* as part of the amendment layer.**  
     - **Why**: The "façade" problem (#6) shows reinterpretation can functionally amend rules. Theory must either:  
       - (a) Treat authoritative reinterpretation *as* amendment, or  
       - (b) Define strict boundaries between interpretation/amendment (non-negotiable: no gaps).  
     - **Hardest case**: Failing here makes the amendment rule meaningless (#6).  

  6. **⚖️ Track *systemic continuity* vs. *replacement*.**  
     - **Why**: Deleting the amendment rule (#9) may create a new system. Theory needs criteria (e.g., "Does the new rule set reference prior authority?").  
     - **Negotiable**: Capture may occur *without* full replacement (e.g., façade #6).  

  7. **⚖️ Separate *validity* from *efficacy*.**  
     - **Why**: Officials ignoring valid amendments (#7) signals capture-in-progress; treating invalid acts as binding *is* capture. Theory must note this disconnect but need not resolve it.  
     - **Coverage**: Vital for #7 and #8 (penalized motion—attempted act may be invalid but still "effective" if unpunished).  

  8. **🌈 Reject *content-neutrality* of amendment power.**  
     - **Why**: Entrenching a core (e.g., self-governance principles) is anti-capture. Content-neutrality enables hostile takeovers.  
     - **Preference**: Some theories demand neutrality; your purpose requires discarding it.  

  9. **🌈 Allow *gaps* for self-referential acts.**  
     - **Why**: Not all self-referential moves (e.g., penalized motion #8) need deterministic outcomes. Gaps can signal vulnerability.  
     - **Risk**: Overuse invites capture—classify as "preference" to permit flexibility.  

  ---

  ### **Jointly Unsatisfiable Tensions**  
  **Your candidates assessed for capture-detection:**  
  - **Tension 1: "Every valid change authorized by existing rules" vs. "Representing validity-criterion change as more than violation"**  
    - **Verdict**: **Impossible** to fully reconcile. Validity-criterion changes (e.g., #2, #9) *cannot* be authorized by the old criterion without bootstrapping.  
    - **Drop**: Strict "authorization by existing rules." Prioritize tracking *how* validity criteria shift (e.g., self-ratifying franchise shift #2).  
  - **Tension 2: "Determinate verdicts for self-reference" vs. "Permitting gaps"**  
    - **Verdict**: **Tension**, not impossibility. Gaps are acceptable (#8, penalized motion) if the theory flags them as institutional risks.  
    - **Keep both**: Non-determinism highlights ambiguities exploiters target.  
  - **Tension 3: "Content-neutral amendment power" vs. "Entrenching a core"**  
    - **Verdict**: **Drop content-neutrality**. Entrenchment (#1) is anti-capture; neutrality enables hostile amendments.  
  - **Tension 4: "Symmetry entrenching/dis-entrenching" vs. "Irreversible commitments"**  
    - **Verdict**: **Drop symmetry**. Asymmetry protects foundational rules (e.g., making democracy unamendable).  

  ---

  ### **Most Exclusionary Requirement**  
  **🔒 Requirement #5 (interpreting reinterpretation as amendment or strictly bounding it)** excludes the most theories. It forces:  
  - Rejection of theories where "interpretation" is a black box.  
  - Commitment to modeling institutional speech acts (reinterpretation vs. amendment).  

  **Scores against this requirement:**  
  1. **Ultimate-rule theories** (e.g., Kelsenian hierarchies):  
     - *Shape*: Linear hierarchy; amendment rules above norms they govern.  
     - **Score**: Fails. Cannot handle reinterpretation (#6)—assumes fixed foundational rules.  
  2. **Official-practice theories** (e.g., Hartian recognition):  
     - *Shape*: Validity from officials' collective acceptance.  
     - **Score**: Partial fit. Can model reinterpretation as practice (#6, #7) but struggles with atomicity (#3, #4).  
  3. **Stratified-level theories** (e.g., meta-amendment layers):  
     - *Shape*: Amendment rules at level *n+1* governing level *n*.  
     - **Score**: Fails. Reinterpretation (#6) blurs levels; self-reference (#1, #5, #8) breaks stratification.  

  ---

  ### **What the Theory Should Not Do**  
  1. **Predict efficacy**: Whether officials enforce rules (#7) is sociological, not normative.  
  2. **Resolve all paradoxes**: Some self-referential acts (e.g., retroactive self-illegalization #5) may be "undecidable"—the theory need only flag them as risks.  
  3. **Guarantee continuity**: A "captured" system may be legally valid but substantively illegitimate—the theory identifies the transition, not whether to obey.  

  ---  
  **Deliverable**: Use this list to stress-test any proposed rule-change sequence. Flags include:  
  - Atomicity violations (splitting #3/#4 packages),  
  - Entrenchment manipulation (#1, #4),  
  - Validity/efficacy gaps (#7),  
  - Reinterpretation overreach (#6).  
  **Final note**: No theory prevents capture—only exposes it. Prioritize requirements that surface *how* self-amendment rules can be weaponized.
