  Based on your intuitions, I'll propose a **lexical hyperreal averaging principle with suffering minimization** that captures all your core verdicts (including the kid case) while being mathematically rigorous. This requires two key innovations: (1) using *hyperreal numbers* to handle infinities, and (2) a *lexical priority* for suffering. Below is the principle clause-by-clause, mapped to your cases, followed by predictions for new cases and tradeoffs.

  ---

  ### **The Principle: Lexical Hyperreal Suffering-Minimizing Averaging (LHSMA)**
  1. **Primary Criterion: Hyperreal average utility density**  
     Rank worlds by their well-being per unit volume of spacetime, represented as a *hyperreal number* (which can include infinitesimal values).  
     *→ Captures:*  
     - **Case 1 (no improvement):** Adding one happy person changes the hyperreal average by an infinitesimal (effectively zero).  
     - **Case 2 (better):** +2 > +1 per unit volume.  
     - **Case 5 (worse):** Adding agony reduces average utility density (e.g., if 0.1% suffer, average drops infinitesimally but measurably in hyperreals).  

  2. **Tiebreaker 1: Suffering eradication**  
     If hyperreal averages are tied, any world with suffering is worse than one without. Suffering is defined as well-being below a threshold (e.g., ≤0).  
     *→ Captures:*  
     - **Case 3 (worse):** Finitely many in agony makes it worse than a tie (all +1) due to suffering presence.  
     - **Case 6 (better than spread, worse than happy):** Filament has same average as all-happy (suffering occupies zero volume) but suffers in Tiebreaker 1 → worse than no suffering, better than spread-out agony (which fails Primary).  

  3. **Tiebreaker 2: Minimize suffering density**  
     If still tied, rank by *minimizing the suffering-per-volume measure* (lower density of suffering is better).  
     *→ Captures:*  
     - **Case 6 clarified:** Filament has near-zero suffering density → better than high-density suffering (e.g., Case 5), but worse than zero suffering.  
     - **Case 5 (much worse):** High suffering density amplifies badness beyond Case 3.  

  4. **Tiebreaker 3: Equality promotion**  
     If all above tie, prefer more equal distributions.  
     *→ Captures:*  
     - **Case 4 (equal better):** All +1 beats half +3/half −1 after Tiebreaker 1 (since −1 is suffering).  

  ---

  ### **The Kid in the Pond (Your Flip-Flop Case)**  
  - **Axiological verdict (world goodness):** Saving the kid doesn’t change the hyperreal average (infinitesimal change) → no improvement (consistent with Case 1).  
  - **Moral obligation verdict:** You **must** save the kid, not because it improves the world, but because:  
    *"When acting, prevent suffering or improve lives if feasible, even if the world’s overall value is unchanged."*  
  This separates *axiology* (what makes a world good) from *deontology* (what you should do). Walking past the kid violates a duty to individuals, even in infinity.  

  ---

  ### **Predictions for New Cases**  
  **Case X:** *One happy person per cubic parsec (utility = U) vs. two people per cubic parsec (each at utility = U/2).*  
  - **Hyperreal average:**  
    - World A: Density = U/volume  
