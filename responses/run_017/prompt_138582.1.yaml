  - **Tiebreaker 1:** No suffering in either → **tie**.  
  - **Tiebreaker 2:** No suffering → **tie**.  
  - **Tiebreaker 3:** Both perfectly equal → **indifferent**.  
  *Verdict:* Both worlds are equally good. (If you intuit World A is better, you’d need to add per-capita well-being as a prior criterion.)  

  **Case Y:** *All at +1 vs. 99% at +1.01 and 1% at −100 (same average utility density).*  
  - **Hyperreal average:** Tie (by construction).  
  - **Tiebreaker 1:** Suffering exists in unequal world → **all +1 wins**.  
  *Verdict:* The equal, suffering-free world is better.  

  ---

  ### **Which Verdicts Are Saved?**  
  | Your Case | LHSMA Verdict | Match? |  
  |-----------|---------------|--------|  
  | 1 (extra happy person) | No change | ✅ |  
  | 2 (all +2 > all +1) | Better | ✅ |  
  | 3 (finite agony worse) | Worse | ✅ |  
  | 4 (equal better) | Better (via Tiebreaker 1) | ✅ |  
