  ### Appendix: Protocol for Matched-Pair Testing  
  To detect false negatives (bias masquerading as insight), both parties agree:  
  - **Input**: Pairs of MIU(\(n, k\)) instances: one with modular obstruction (e.g., \(MIU(4, 3)\)), one without (e.g., \(MIU(2, 4)\)).  
  - **Procedure**: Solvers (human or algorithmic) report "unreachable" or "reachable" with justification.  
  - **Prediction**:  
    - **Internalizer**: Solvers using \(F\) perform perfectly. Errors arise only from resource limits.  
    - **Escalationist**: Solvers miss obstructions in non-modular cases or novel variants, reporting "unreachable" incorrectly.  
  - **Test Cases**: Include \(MIU(1, 3)\) (unreachable, no \(d\)), \(MIU(3, 3)\) (reachable), and a variant (e.g., "Delete \(UU\) only at string end").  
  - **Outcome**: Consistent errors in non-modular cases support Escalationist; high accuracy supports Internalizer.  

  This protocol tests if "jumping out" is reproducible or ad hoc.
