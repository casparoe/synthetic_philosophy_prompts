  3. Crux 3 (handling non-modular obstructions): If we can show that the same method (or a fixed F) can handle non-modular cases (by changing the rules) then Internalizer wins. Otherwise, Escalationist.

  4. Crux 2 (generalization as one schema): This is less central, because even if each case is a new jump, if they are all contained in a fixed F, then Internalizer wins.

  5. Crux 5 (uniform procedure): We have settled that for the MIU family, there is a uniform procedure. So this crux is settled in favor of the Internalizer.

