  ### 3. Verbal Disputes

  The parties should clarify what they mean by "jumping out of the system":

  - **Phenomenological event**: the feeling of having an insight that seems to go beyond mechanical steps.
  - **Logical relation**: the fact that the object system cannot prove a particular statement about itself (e.g., the invariant).
  - **Powers of a person or procedure**: the claim that a person can always see the truth of such statements, and that this ability cannot be mechanized.

  The Internalizer has been arguing about the logical relation: that any such jump can be captured in a larger system. The Escalationist has been arguing about the powers: that the person's ability to see these features is open-ended and not bounded by any fixed system.

  ### 4. Ranking of Cruxes

  We rank the cruxes by how much settling them would move the debate:

  1. Crux 1 (strong internalization for the whole family): If we can build F that handles the entire MIU(n,k) family, then the Internalizer wins for this family. But the Escalationist might say that the family is fixed and we can always extend it. So this might not end the dispute.

