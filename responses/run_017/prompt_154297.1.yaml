  Therefore, the dispute might be unresolvable by finite means, but the onus is on the Escalationist to produce a modification that breaks the current F.

  ### 5. Closing Note

  The MU-puzzle was originally introduced by Douglas Hofstadter in "Gödel, Escher, Bach" to illustrate Gödel's incompleteness theorem. The idea is that the system cannot prove its own consistency (or in this case, the underivability of MU). The puzzle shows that the reasoner must step outside the system to see the truth. 

