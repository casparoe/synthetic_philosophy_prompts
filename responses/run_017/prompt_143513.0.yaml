  ### **Decision Tree: What Kind of Thing Is a Psychiatric Category?**  
  *Start here after agreeing that classifying people changes them (looping effect is given).*  

  1. **In the "opaque-loop" case (algorithmic diagnosis via keystroke/sleep data; patients can’t see criteria), does the category still exhibit a looping effect?**  
     - **Yes** → Looping occurs even without patient awareness (go to Q2).  
     - **No** → Looping requires patient self-awareness (go to Q3).  
     *Case implication:* Yes = looping can run purely through institutions. No = looping requires personal awareness.  

  2. **In "diagnostic decay" (people hide symptoms after diagnosis), does the category lose validity because the criteria stop matching behavior?**  
     - **Yes** → The kind is defined *only* by surface symptoms/behaviors (go to Q4).  
     - **No** → The kind has a stable core beyond symptoms (go to Q5).  
     *Case implication:* Yes = no latent cause; category is fragile. No = something real persists.  

  3. **In "prolonged grief," where patients organized to create the category, would the grief disorder exist without their advocacy?**  
     - **Yes** → Advocacy merely revealed a pre-existing kind (go to Q5).  
