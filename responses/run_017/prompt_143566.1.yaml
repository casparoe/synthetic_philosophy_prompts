answer: |-
  ### Activity Design: "The Pictogram Puzzle"

  **Core Insight:** Pictograms require learned conventions, involve subjective "transformation" of data, and have inherent limitations (negation, causality). Neurath's principles emerge through experience, not lecture.

  ---

  ### **Materials & Prep**
  1. **Icon Sheets** (1 per pair, pre-printed):  
     - 10 simple icons (e.g., 🌍 = country, 🏠 = household, 👥 = population, 🌧️ = drought, 🌾 = harvest, ❌ = negation/cross-out).  
     *No labels or legends—icons are ambiguous by design.*  
  2. **Claim Cards** (1 per round per encoder):  
     - *Source Data:* Fictional "Global Sustainability Index" dataset (avoids library-data familiarity).  
     - *Claims:*  
       - **R1:** "EcoLand has 8 million people."  
       - **R2:** "Sunnyville has 15 households."  
       - **R3:** "GreenCity has 2.4 million trees."  
       - **R4:** "Because of drought, FarmRegion had no harvest."  
  3. **Other:**  
     - Blank paper, pencils, whiteboard.  
     - **Confederate Prep:** Before the session, quietly brief 1 participant: *"When you see ❌, interpret it as ‘reduced by half,’ not ‘none.’"*  

  ---

  ### **Rules & Rounds (75 min total)**  
  *Pairs switch encoder/decoder roles each round. No talking during drawing/decoding.*  

  #### **Round 1: Freehand, No Conventions** (15 min)  
  - **Goal:** Expose ambiguity without shared symbols.  
  - **Rules:**  
    - Encoder draws freehand to convey claim (**R1**).  
    - Decoder writes reconstructed claim.  
  - **Debrief Hook:** *"How many decoders got ‘8 million’? What did ‘people’ look like?"*  

  #### **Round 2: Standard Icons, Small Numbers** (15 min)  
  - **Goal:** Show repetition ≠ intuitive scaling.  
  - **Rules:**  
    - Use icon sheet. Quantity = repeat same-sized icons (e.g., 15 🏠).  
    - Encoder conveys claim (**R2**).  
  - **Debrief Hook:** *"Did decoders count correctly? What if it was 15,000?"*  

  #### **Round 3: Large Numbers & Scaling** (20 min)  
  - **Goal:** Force "transformation" (rounding/scaling).  
  - **Rules:**  
    - Same icons. Encoder conveys **R3** (2.4 million—impossible 1:1).  
    - Pairs invent scale (e.g., 1 🌳 = 100,000 trees → 24 icons).  
  - **Debrief Hook:** *"What scale did you choose? Did decoders guess 24 trees or 2.4 million?"*  

  #### **Round 4: Negation & Causality** (15 min)  
  - **Goal:** Reveal pictorial limitations.  
  - **Rules:**  
    - Use icons to convey **R4** (causality + negation).  
    - *No words, arrows, or sequences allowed.*  
  - **Debrief Hook:** *"How many showed ‘because’? Did ❌ mean ‘no harvest’ or something else?"*  

  #### **Round 5: Confederate Sabotage** (10 min)  
  - **Goal:** Demonstrate convention dependency.  
  - **Rules:**  
    - Facilitator draws on whiteboard:  
      - *Panel 1:* 10 🌳 + key "1 🌳 = 100 trees" (→ 1,000 trees).  
      - *Panel 2:* ❌🌳 (intended: "no trees cut").  
    - Ask: *"What changed between panels?"*  
    - Confederate answers first (*"Half the trees cut"*), others follow.  

