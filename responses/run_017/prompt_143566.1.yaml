  ### **Debrief (15 min)**  
  - **Map Moments to Neurath’s Ideas:**  
    - **R1 (Freehand):** *"No shared conventions = chaos. Neurath called this needing ‘visual education.’"*  
    - **R3 (Scaling):** *"You ‘transformed’ data by choosing scales. Neurath said this step loses nuance."*  
    - **R4 (Negation):** *"Pictures struggled with ‘because’ and ‘no.’ Neurath said they can’t replace language."*  
    - **R5 (Confederate):** *"One symbol, two meanings. Conventions must be learned—they’re not innate."*  

  - **Predictable Failures & Recovery:**  
    - **R3 Scaling Frustration:** Some pairs will skip scaling and draw 2–3 trees. *Recovery:* Contrast pairs who invented scales vs. those who gave up.  
    - **R4 Literal Misreads:** Many will draw 🌧️ + 🌾❌ but omit causality. *Recovery:* Ask *"Who thought this meant ‘drought happened, and also no harvest’?"*  
    - **Confederate Backlash:** Risk of singling them out. *Recovery:* Frame as *"We all bring different conventions—like in real life."*  

  - **What the Activity Can’t Teach:**  
    - Neurath’s *system* (ISOTYPE) was a *taught* language. State: *"He built rules over years—your 15-minute conventions weren’t enough."*  
    - Internationalism’s limits. State: *"Icons reduce language barriers but can’t erase cultural ones. A 🌾 may mean rice in Asia, wheat in Europe."*  

