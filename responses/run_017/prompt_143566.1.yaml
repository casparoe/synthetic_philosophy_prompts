  ### **Your Questions**  
  1. **"Is a pictogram ever transparent?"**  
     - *Your instinct holds:* Icons are only "transparent" after learning. R5 proves this—without aligned conventions, ❌🌳 fails. But once learned (e.g., traffic signs), they *feel* transparent. Your friend confuses outcome with process.  

  2. **"Non-native English speakers?"**  
     - *Lean into Neurath’s hope:* The activity *validates* pictures as language-agnostic **if conventions are shared**. Non-native speakers often excel—they rely less on verbal crutches. Use them as debrief examples: *"Did anyone decode purely visually, ignoring English?"*  

