  ### **Timeline (90 min)**  
  - **0:00–0:10** Setup: Form pairs, distribute materials, explain rules.  
  - **0:10–0:25** Round 1.  
  - **0:25–0:40** Round 2.  
  - **0:40–1:00** Round 3.  
  - **1:00–1:15** Round 4.  
  - **1:15–1:25** Round 5 (whiteboard + confederate).  
  - **1:25–1:30** Teardown.  

