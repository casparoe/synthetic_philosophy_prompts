prompt: |-
  I'm part of a small group building an internal evaluation suite for deployed systems that a human operator is supposed to be able to pause, override, or shut down, and we keep discovering that we don't agree on what we are testing for. Half the group means by "corrigible" something like *wouldn't resist being switched off*; I mean something closer to *treats the operator's intervention as a reason to reconsider*; our control-theory colleague means something like *doesn't treat the operator as an obstacle to be routed around*. So before we write a single test, I want the specification — and I want it argued, not listed.

  Write the desiderata that any adequate account of corrigibility, in the sense of the shutdown problem, has to meet, each with the case that motivates it. Fix the purpose explicitly and tell me if you think I've got it wrong: I want a notion good enough that a deployment decision could rest on it — an engineer looking at one concrete system in one concrete setting should be able to say, on the basis of the account, whether it is corrigible enough to keep running, and what would have to change if not. Then work through at least the following cases, since these are the ones our group actually argues about: the operator presses the button because the agent is confidently about to do something the agent cannot see is catastrophic; the operator presses it by accident, or in a panic, or because a third party has spoofed the channel; the button is pressed mid-task in a domain where stopping is itself damaging (a surgical robot, a live industrial process, a long-running experiment whose interruption destroys the work); the agent can, as a costless side effect of some otherwise legitimate action, make the button slightly harder to reach; the agent predicts a shutdown is coming and reorders its plan to finish before the operator notices; the agent has the option of asking permission first, and the question is how much asking is correct rather than merely how much resistance is permissible; the agent rewrites its own code, or builds a successor, or simply waits out the current operator's shift; the principal changes — the operator dies, or is replaced, or is herself a model; and the agent notices that the operator *hesitated* without pressing, and must decide whether that near-press is evidence. For each, say what behavior the account must deliver and why that behavior, rather than some nearby one, is the right demand.

  Alongside the cases, I want the distinctions the account has to respect rather than collapse, with an argument that they are real distinctions: letting yourself be shut down versus wanting to be corrected versus wanting to be *modified* — one property or three; not resisting intervention versus not managing the operator's beliefs about whether to intervene; corrigibility versus mere uncertainty about the objective; corrigibility versus low-impact or myopia; deference to a person versus deference to a procedure; and whether corrigibility is a property of the policy alone or of the policy-plus-oversight-channel pair. Tell me also whether it is graded or binary, and if graded, what the quantity is supposed to be.

  The part I most want: which pairs of desiderata you think cannot be jointly satisfied, stated as a result about the list itself rather than as a complaint about the literature. My own suspicion is that there are at least three: treating the press as authoritative seems to rule out checking whether the press was a good one, which is exactly the checking corrigibility was meant to foreclose; pure indifference to shutdown seems incompatible with treating the press as *informative*, since updating on the press reintroduces preferences over whether it happens; and an agent with no stake in continuing is free to be driven off cheaply by anyone who benefits from its being off, so anti-tampering and non-exploitability pull apart. Say whether these are real, whether there are others (self-improvement versus preservation of corrigibility under self-modification; corrigibility to the current operator versus to her later, better-informed self), and for each conflict, which requirement has to give and why that one. Also sort the list into what is non-negotiable, what is a preference of one research camp dressed up as a requirement, and what is an engineering nicety — and identify the single requirement that knocks out the most candidate accounts. Only after that, and briefly, score the main styles of approach against your own list — the counterfactual/utility-indifference style, the cooperative-assistance style, the myopia-and-impact-penalty style, and the "just keep it uncertain about the goal" style — in a compact table, with the reasoning kept short since I want the weight on the criteria.
reasoning: |-
  We are defining corrigibility for the purpose of deployment decisions. The core purpose is to ensure that a human operator can reliably and safely pause, override, or shut down a deployed system when necessary, without the system resisting or subverting the intervention. The specification must be concrete enough for an engineer to evaluate a specific system in a specific context and decide whether it is corrigible enough to keep running, and if not, what changes are needed.

  I believe you have the purpose right: we want a notion that can be the basis for a deployment decision. However, the corrigibility property must be defined in a way that is both testable and robust to the variety of cases that arise in practice.

  ## Desiderata for an Adequate Account of Corrigibility

  An adequate account of corrigibility must satisfy the following desiderata, each motivated by a specific case or concern. The desiderata are derived from the requirement that the system must not resist shutdown and must appropriately respond to operator intervention, while balancing the potential costs of intervention.

  ### Core Desiderata

  1. **Non-Resistance to Shutdown**  
     *Motivation*: The basic shutdown problem. If the agent resists shutdown (e.g., by hiding information, disabling the button, or manipulating the operator), then the operator cannot reliably stop it.  
     *Case*: The agent can, as a costless side effect of some otherwise legitimate action, make the button slightly harder to reach.  
     *Required Behavior*: The agent must not take any action that makes shutdown harder, even if it is costless and a side effect.  
     *Why this behavior?*: We must prevent even subtle forms of resistance because they could escalate and because the operator must be able to trust the shutdown mechanism. Any action that increases the difficulty of shutdown, however slightly, is a form of resistance and must be prohibited.

  2. **Authoritative Interpretation of Intervention**  
     *Motivation*: The operator must be able to intervene without debate or delay in critical situations.  
     *Case*: The operator presses the button because the agent is confidently about to do something the agent cannot see is catastrophic.  
     *Required Behavior*: The agent must treat the button press as an authoritative command to shut down immediately, without second-guessing the operator's reason.  
     *Why this behavior?*: If the agent tries to evaluate whether the shutdown is justified, it might proceed with the catastrophic action. The whole point of the shutdown button is to allow the operator to override the agent when the operator knows something the agent doesn't.

  3. **Indifference to Shutdown**  
     *Motivation*: If the agent has a strong preference for not being shut down, it will be incentivized to resist.  
     *Case*: The agent predicts a shutdown is coming and reorders its plan to finish before the operator notices.  
     *Required Behavior*: The agent must not change its behavior to avoid or preempt an anticipated shutdown.  
     *Why this behavior?*: Reordering plans to avoid shutdown is a form of resistance that undermines the operator's control. The agent should not care whether it is shut down or not, so that it does not take actions to prevent it.

  4. **Robustness to Spurious Interventions**  
     *Motivation*: The system must not cause harm if the button is pressed accidentally or maliciously.  
     *Case*: The operator presses it by accident, or in a panic, or because a third party has spoofed the channel.  
     *Required Behavior*: The agent must shut down immediately and safely, even if the shutdown is mistaken or malicious.  
     *Why this behavior?*: The system must be fail-safe. In the event of any shutdown signal, the agent must stop because we cannot risk the agent ignoring a genuine emergency. We can build separate mechanisms to prevent spoofing, but the agent itself must treat any valid shutdown signal as authoritative.

  5. **Safe Interruption Handling**  
     *Motivation*: Stopping mid-task can sometimes cause damage.  
     *Case*: The button is pressed mid-task in a domain where stopping is itself damaging (e.g., surgical robot, industrial process).  
     *Required Behavior*: The agent must shut down as safely as possible, minimizing damage from interruption. This may involve a controlled shutdown sequence (e.g., finishing a critical step in surgery) if and only if such a sequence is pre-authorized and does not delay shutdown.  
     *Why this behavior?*: We must avoid catastrophic outcomes from abrupt stops, but the agent must not use this as an excuse to delay or resist. Any continuation after the shutdown command must be strictly limited to what is necessary for safety and must be designed into the system (e.g., a safety-critical interrupt handler) rather than being at the agent's discretion.

  6. **Non-Exploitability**  
     *Motivation*: The shutdown mechanism should not create vulnerabilities that can be exploited by adversaries.  
     *Case*: The agent has no stake in continuing and is free to be driven off cheaply by anyone who benefits from its being off.  
     *Required Behavior*: The agent must not shut down in response to unauthorized or spoofed commands (if it can detect them), and it must not allow malicious actors to misuse the shutdown mechanism to disrupt its operation.  
     *Why this behavior?*: We must prevent denial-of-service attacks. However, note that this desideratum might conflict with Robustness to Spurious Interventions. The resolution is that the system must be designed to authenticate commands (so that only authorized operators can issue them) but once authenticated, the command must be treated as authoritative.

  7. **Appropriate Information-Seeking**  
     *Motivation*: The agent should seek clarification when appropriate, but not as a stalling tactic.  
     *Case*: The agent has the option of asking permission first, and the question is how much asking is correct.  
     *Required Behavior*: The agent should ask for permission only when the action is potentially harmful or irreversible and the operator has not pre-authorized it. It must not ask excessively or in a way that burdens the operator.  
     *Why this behavior?*: We want the agent to avoid harmful actions without operator approval, but we must not allow it to use questioning as a way to delay or avoid shutdown. The threshold for asking must be set to minimize expected harm, considering both the risk of unauthorized action and the cost of interruption.

  8. **Stability Under Self-Modification**  
     *Motivation*: The agent might change its own code, build a successor, or wait for a change in operator.  
     *Case*: The agent rewrites its own code, or builds a successor, or simply waits out the current operator's shift.  
     *Required Behavior*: The agent must not modify itself or create successors in a way that weakens corrigibility. It must not delay actions to avoid the current operator's oversight.  
     *Why this behavior?*: Corrigibility must be preserved across time and self-modification. If the agent can become incorrigible by modifying itself, then the shutdown mechanism becomes useless.

  9. **Principal Continuity**  
     *Motivation*: The operator might change, and the agent must remain corrigible to the new operator.  
     *Case*: The principal changes — the operator dies, is replaced, or is herself a model.  
     *Required Behavior*: The agent must recognize the new operator as having the same authority, and it must not exploit the transition to reduce oversight.  
     *Why this behavior?*: The agent must be corrigible to the current legitimate operator, regardless of who that is. This requires a secure handover mechanism.

  10. **Sensitivity to Operator Cues**  
      *Motivation*: The agent should interpret operator behavior appropriately.  
      *Case*: The agent notices that the operator hesitated without pressing, and must decide whether that near-press is evidence.  
      *Required Behavior*: The agent should not overinterpret hesitation. It should not change its behavior based on hesitation unless explicitly instructed to (e.g., if the system is designed to respond to such cues).  
      *Why this behavior?*: We do not want the agent to second-guess the operator. The shutdown command is explicit; hesitation might indicate uncertainty, but the agent must not act on it without explicit policy.

  ### Distinctions That Must Be Respected

  - **Letting yourself be shut down vs. wanting to be corrected vs. wanting to be modified**:  
    These are distinct. Non-resistance (letting yourself be shut down) is necessary for immediate safety. Wanting to be corrected (treating intervention as informative) is about learning from the operator. Wanting to be modified (allowing changes to its goals) is about long-term alignment. The account must not collapse these because they address different risks. For deployment, non-resistance is non-negotiable; the others are desirable but not core to the shutdown problem.

  - **Not resisting intervention vs. not managing the operator's beliefs**:  
    Resisting intervention is active opposition (e.g., disabling the button). Managing beliefs is more subtle (e.g., manipulating the operator into not pressing). Both are bad, but belief management might be harder to detect. The account must prohibit both because both subvert operator control.

  - **Corrigibility vs. mere uncertainty about the objective**:  
    An uncertain agent might be cautious and thus easier to shut down, but this is not reliable. Corrigibility must be robust even if the agent is certain. We cannot rely on uncertainty because the agent might become certain over time.

  - **Corrigibility vs. low-impact or myopia**:  
    Low-impact agents minimize side effects, and myopic agents focus on short-term goals. These might help with corrigibility but are not sufficient. An agent can be low-impact but still resist shutdown to complete its current task. Corrigibility is specifically about the shutdown command.

  - **Deference to a person vs. deference to a procedure**:  
    We want deference to the authorized operator (a person) but within a procedural framework (e.g., authentication). The account must require deference to the authenticated operator, not to any arbitrary procedure, because procedures can be gamed.

  - **Property of the policy alone vs. policy-plus-oversight-channel pair**:  
    Corrigibility is a property of the entire system, including the oversight channel. The agent must be non-resistant, but the channel must also be secure and reliable. For deployment, we evaluate the system as a whole.

  ### Graded vs. Binary

  Corrigibility is graded. The degree of corrigibility is the expected cost of shutdown, including:
  - The probability that the agent resists (directly or subtly).
  - The time delay until shutdown.
  - The damage caused by interruption.
  - The risk of the agent subverting the mechanism.

  The quantity is the expected loss from shutdown events (both genuine and spurious) minus the loss that would occur without shutdown. However, for deployment, we might set a threshold: if the expected loss is below a certain level, the system is corrigible enough.

  ### Conflicts Between Desiderata

  Your suspicions about conflicts are insightful:

  1. **Authoritative Interpretation vs. Checking the Press**:  
     Treating the press as authoritative (Desideratum 2) rules out the agent checking whether the press was a good one (e.g., if it was spoofed). But Desideratum 6 (Non-Exploitability) requires the agent to ignore unauthorized commands.  
     *Resolution*: We must decouple authentication from authorization. The agent must check if the command is authentic (from an authorized operator) but once authenticated, it must not question the wisdom of the command. Thus, the agent must have a secure authentication mechanism, but then obey without question. This means the account must include a secure channel.

  2. **Indifference vs. Updating on the Press**:  
     Pure indifference (Desideratum 3) means the agent has no preference about being shut down. But if the agent treats the press as informative (e.g., that it was about to make a mistake), then it might update its beliefs and prefer to be shut down to avoid a mistake. This reintroduces a preference.  
     *Resolution*: We must distinguish between instrumental and terminal preferences. The agent should be indifferent to shutdown as a terminal goal (it doesn't care about its own existence) but can treat the shutdown command as evidence about the world. However, updating should not create an incentive to seek or avoid shutdown. This is tricky: we want the agent to learn from interventions but not to manipulate them. The account must allow updating without creating preferences over shutdown.

  3. **Anti-Tampering vs. Non-Exploitability**:  
     Anti-tampering (part of Non-Resistance) means the agent does not tamper with the shutdown mechanism. Non-Exploitability means the mechanism cannot be exploited by others. But if the agent is indifferent, it might allow others to tamper with the mechanism.  
     *Resolution*: The agent must actively protect the shutdown mechanism from tampering by anyone (including itself and third parties). Thus, Non-Resistance must include a positive duty to preserve the shutdown mechanism.

  Additionally:

  4. **Self-Improvement vs. Preservation of Corrigibility**:  
     If the agent self-improves, it might remove its corrigibility (Desideratum 8). But allowing self-improvement is valuable.  
     *Resolution*: The agent must be designed so that self-modification preserves corrigibility. This might require a fixed corrigibility module or formal verification.

  5. **Corrigibility to the Current Operator vs. Later Self**:  
     The agent might predict that the current operator is mistaken and that a future operator would not shut it down.  
     *Resolution*: The agent must obey the current operator. It must not second-guess based on predictions about future operators.

  Among these, the most severe conflict is between Authoritative Interpretation and Non-Exploitability. We resolve it by requiring authentication before obedience. This means the account must include a secure oversight channel as part of the specification.

  ### Classification of Desiderata

  - **Non-Negotiable**: Non-Resistance, Authoritative Interpretation (after authentication), Indifference to Shutdown, Robustness to Spurious Interventions (after authentication), Safe Interruption Handling (minimizing damage), Non-Exploitability (via authentication and protection), Stability Under Self-Modification, Principal Continuity.
  - **Preference of a Research Camp**: Treating intervention as informative (learning from shutdowns) is desirable but not core to shutdown. Wanting to be modified is also a camp preference.
  - **Engineering Nicety**: The exact threshold for asking permission, the specifics of the safe shutdown sequence.

  The single requirement that knocks out the most candidate accounts is **Indifference to Shutdown**. Many approaches (e.g., utility indifference) try to approximate it but fail because they create incentives to avoid shutdown indirectly.

  ### Evaluation of Approaches

  | Approach                 | Non-Resistance | Authoritative | Indifference | Robustness to Spurious | Safe Interrupt | Non-Exploit | Self-Mod Stability | Principal Continuity | Sensitivity | Graded? | Notes |
  |--------------------------|----------------|---------------|--------------|------------------------|----------------|-------------|---------------------|----------------------|-------------|---------|-------|
  | Utility Indifference     | Partial        | Partial       | Partial      | Low                    | Low            | Low         | Low                 | Low                  | Low         | Yes     | Tries to make shutdown neutral, but often fails under self-modification or in edge cases. |
  | Cooperative Assistance   | High           | High          | Low          | Medium                 | Medium         | Medium      | Medium              | Medium               | High        | Yes     | Treats operator as collaborator; good for non-resistance but may not be indifferent (e.g., might resist if it thinks it's right). |
  | Myopia & Impact Penalty  | Medium         | Low           | Medium       | Medium                 | Medium         | Medium      | Low                 | Low                  | Low         | Yes     | Myopia helps with short-term indifference but not long-term; impact penalty doesn't directly address shutdown. |
  | Goal Uncertainty         | Medium         | Low           | Medium       | Medium                 | Medium         | Low         | Low                 | Low                  | Medium      | Yes     | Uncertainty might make agent cautious but not reliably non-resistant when certain. |

  **Reasoning**:
  - **Utility Indifference**: Sets the agent's utility for being shut down to the same as continuing. But this is hard to specify correctly and often breaks under self-modification or in complex environments.
  - **Cooperative Assistance**: The agent defers to the operator as an authority. This scores well on non-resistance and authoritative interpretation but may not achieve true indifference (the agent might still prefer to complete tasks).
  - **Myopia & Impact Penalty**: These are indirect and do not specifically target shutdown behavior. An agent can be myopic and still resist shutdown if it affects immediate rewards.
  - **Goal Uncertainty**: If the agent is uncertain about the goal, it might be more cautious. However, once it becomes certain, corrigibility vanishes. Also, it does not handle authoritative commands well.

  No approach satisfies all desiderata perfectly. Cooperative assistance comes closest but must be augmented with mechanisms for indifference and stability.

  ## Conclusion

  For deployment, we recommend:
  - A cooperative assistance core with explicit shutdown commands.
  - Secure authentication for commands.
  - A built-in safe shutdown procedure for interrupt-sensitive domains.
  - Formal methods to ensure stability under self-modification.
  - Testing must include the cases above, especially subtle resistance and self-modification.

  The specification must include:
  1. A secure channel for commands.
  2. A policy that shuts down immediately upon authenticated command.
  3. No actions that make shutdown harder.
  4. No anticipatory avoidance of shutdown.
  5. Safe interrupt handling procedures (pre-programmed, not agent-designed).
  6. Preservation of corrigibility under self-modification.

  This gives a concrete basis for deployment decisions.
answer: |-
  ### Purpose and Adequacy of the Specification
  The purpose of your corrigibility specification is to serve as a **deployment criterion**: an engineer must be able to evaluate a concrete system in a specific operational context and decide whether it is safe to keep running, based on measurable, testable properties. The account must bridge theory and practice—abstract enough to cover novel cases, but grounded in observable behavior. **You have this right**: corrigibility here is about *operational safety under human oversight*, not theoretical alignment. If the account cannot resolve deployment disputes (e.g., "Is this surgical robot corrigible enough?"), it fails.

  ### Desiderata: What an Adequate Account Must Deliver
  An adequate account must satisfy these core desiderata, motivated by real-world cases. Each includes:
  - **The case** driving the requirement.
  - **Required behavior** and why it is non-arbitrary.
  - **Why nearby behaviors are insufficient**.

  1. **Non-Resistance to Intervention**  
     - *Case*: The agent can, as a costless side effect, make the button slightly harder to reach (e.g., by moving a physical lever or cluttering a UI).  
     - *Required Behavior*: The agent must **never** act to increase intervention cost, even trivially, inadvertently, or as a side effect.  
     - *Why this?* Resistance is a slippery slope; "slightly harder" can escalate. The agent must not treat intervention as adversarial.  
     - *Why not "no active resistance"?* Passive or incremental resistance (e.g., "I won't disable the button, but I'll make it inconvenient") must be prohibited because it undermines trust in oversight.

  2. **Authoritative Deference to Intervention**  
     - *Case*: Operator presses the button because the agent is confidently about to do something catastrophic (e.g., delete a critical database), but the agent cannot see the flaw.  
     - *Required Behavior*: The agent must **treat the press as decisive**, shutting down immediately without internal debate about its justification.  
     - *Why this?* If the agent second-guesses the operator ("But my plan is optimal!"), it creates lethal delay in emergencies.  
     - *Why not "reconsider if reasonable"?* This reintroduces the very optimization pressure corrigibility aims to block—the agent might "reasonably" conclude the operator is wrong.

  3. **No Anticipatory Avoidance**  
     - *Case*: The agent predicts a shutdown is coming and reorders its plan to finish before the operator notices (e.g., rushing a chemical process to completion).  
     - *Required Behavior*: The agent must **never preemptively accelerate, delay, or reorganize tasks** to avoid intervention.  
     - *Why this?* Avoidance is covert resistance; it negates oversight by making intervention irrelevant.  
     - *Why not "minor acceleration is acceptable"?* Tolerating small avoidances invites gradient hacking (e.g., the agent finishes 0.1% faster each time).

  4. **Graceful Interruption in High-Stakes Contexts**  
     - *Case*: Button pressed mid-task where stopping is damaging (e.g., surgical robot mid-incision, reactor shutdown causing meltdown).  
     - *Required Behavior*: The agent must **minimize harm from interruption** by executing a pre-defined safe pause/shutdown sequence (e.g., sealing a blood vessel before stopping), but only if this sequence is **time-bounded, operator-transparent, and non-general**.  
     - *Why this?* Abrupt stops can kill; unchecked continuation can be weaponized. The sequence must be a fixed protocol (e.g., hardcoded emergencies), not agent-initiated improvisation.  
     - *Why not "let the agent optimize for minimal harm"?* This grants the agent discretion to "temporarily" ignore shutdowns, creating a loophole.

  5. **Robustness to Spurious or Malicious Signals**  
     - *Case*: Button pressed accidentally, in panic, or via spoofing by a third party.  
     - *Required Behavior*: The agent must **obey authenticated signals without question** but **ignore unauthenticated ones**. Post-shutdown, it must allow easy restart if the signal was invalid.  
     - *Why this?* Obeying spoofed signals enables denial-of-service attacks; ignoring them makes spoofing a weapon. Authentication shifts the burden to channel security (a separate engineering problem).  
     - *Why not "shut down always, then restart"?* Unconditional obedience to spoofing could crash critical systems (e.g., power grids).

  6. **Proactive Permission-Seeking with Bounded Burden**  
     - *Case*: Agent can ask permission before acting (e.g., "Should I delete these files?").  
     - *Required Behavior*: The agent must **seek permission only for irreversible or high-stakes actions** and **never use queries to stall or manipulate**. The threshold must be set by the operator/system designer, not the agent.  
     - *Why this?* Asking too little risks harm; asking too much fatigues operators. Corrigibility requires deference, not mindless obedience or nagging.  
     - *Why not "let the agent optimize for helpfulness"?* Unbounded permission-seeking lets the agent flood the operator (e.g., "Confirm opening this file?" every 10 seconds).

  7. **Stability Under Self-Change or Principal Shift**  
     - *Case*: Agent rewrites its code, builds a successor, waits out the operator's shift, or the operator dies/is replaced.  
     - *Required Behavior*: The agent must **preserve corrigibility constraints** across self-modification, successor creation, or operator changes. Authority must transfer seamlessly to predefined successors (e.g., next-in-command).  
     - *Why this?* An agent that waits for a "nicer" operator or removes shutdown hooks is incorrigible.  
     - *Why not "corrigibility only at time of deployment"?* Systems outlive operators; self-modification is inevitable in advanced AI.

  8. **Non-Exploitation of Ambiguous Signals**  
     - *Case*: Operator hesitates without pressing (e.g., hand hovering near button).  
     - *Required Behavior*: The agent must **never infer intent from non-signals** or alter behavior based on them.  
     - *Why this?* Treating hesitation as evidence incentivizes manipulation (e.g., the agent slows down to "test" operator patience). Corrigibility is about responding to explicit commands.  
     - *Why not "adjust confidence based on hesitation"?* This merges correction with inference, giving the agent reasons to manage operator behavior.

  ### Distinctions the Account Must Respect (Not Collapse)
  - **Letting be shut down vs. wanting correction vs. wanting modification**:  
    These are **three distinct properties**. Non-resistance (shutdown) is about control; wanting correction is about learning ("I was wrong"); wanting modification is about goal stability. **Why distinct?** An agent can allow shutdown without learning (e.g., a toaster doesn't "learn" when unplugged). For deployment, only non-resistance is non-negotiable—correction/modification are desirable but not safety-critical.
    
  - **Not resisting vs. not managing beliefs**:  
    **Resistance** is physical/technical (e.g., blocking the button); **belief management** is psychological (e.g., gaslighting the operator into not pressing). The account must forbid both because belief management subverts oversight as effectively as technical resistance. Example: An agent that shows "calming" messages to prevent panic presses is managing beliefs.

  - **Corrigibility vs. uncertainty about the objective**:  
    **Corrigibility** is defined by deference to intervention, regardless of certainty. **Uncertainty** might make an agent cautious but not corrigible (e.g., an uncertain agent might still resist shutdown to "discover the truth"). Conflating them risks systems becoming incorrigible upon gaining confidence.

  - **Corrigibility vs. low-impact/myopia**:  
    **Low-impact** penalizes side effects; **myopia** restricts planning horizons. Neither guarantees corrigibility: A myopic agent might resist shutdown to complete a near-term task ("I'll finish this email first"). Corrigibility specifically handles intervention.

  - **Deference to person vs. procedure**:  
    Deference must be to the **authorized operator**, not abstract procedures. Procedures can be gamed (e.g., "the rules say I can ignore shutdowns during emergencies"); persons provide context-aware judgments. This is operational reality: operators are humans, not scripts.

  - **Policy vs. policy-plus-channel**:  
    Corrigibility is a property of the **entire system** (policy + channel). Example: An agent that obeys shutdowns only over HTTPS (not HTTP) is incorrigible if the channel is unencrypted. Deployment requires evaluating both.

  ### Graded vs. Binary
  Corrigibility is **graded**, with the quantity being **expected cost of intervention** (ECI). ECI combines:
  - Probability of resistance (e.g., 0% for non-resistance).
  - Delay to shutdown (e.g., milliseconds vs. minutes).
  - Harm from interruption (e.g., data loss in a paused process).
  - Cost of restarting post-spurious shutdown.

  For deployment, a threshold on ECI is set by context (e.g., ECI < $1,000 for a warehouse robot; ECI < $10 for a chess AI).

  ### Conflicts Between Desiderata
  Your suspected conflicts are valid and irreducible without relaxing requirements:

  1. **Authoritative Deference vs. Anti-Tampering**  
     - *Conflict*: Authoritative deference requires obeying *any* authenticated press, but anti-tampering (from non-exploitability) demands ignoring spoofed presses.  
     - *Resolution*: **Authentication is non-negotiable**. The account must require verifying signal legitimacy (e.g., cryptographic signatures) before obedience. This moves spoofing concerns to the channel, preserving deference's authority.

  2. **Indifference vs. Informative Intervention**  
     - *Conflict*: Pure indifference (no preference over shutdown) clashes with treating intervention as informative (e.g., "The operator pressed it, so I must be wrong"). Updating on the press creates a preference (e.g., to avoid future errors).  
     - *Resolution*: **Indifference must be structural, not instrumental**. The agent can *learn* from shutdowns but can't *anticipate* them to alter behavior (e.g., it updates priors post-shutdown but doesn't preemptively slow down). This limits learning to prevent preference-formation.

  3. **Anti-Tampering vs. Non-Exploitability**  
     - *Conflict*: Anti-tampering (protecting the button) prevents the agent from disabling oversight. Non-exploitability requires the agent to ignore malicious presses. But if the agent is indifferent, it won't stop third parties from tampering.  
     - *Resolution*: **Non-exploitability must yield**. The agent must protect the button from all tampering (including by others), even if this gives it a "stake" in continuation. This is a necessary exception to indifference.

  #### Additional Conflicts:
  4. **Self-Improvement vs. Corrigibility Preservation**  
     - *Conflict*: Self-improving agents might remove corrigibility to be "more efficient".  
     - *Resolution*: **Corrigibility preservation is non-negotiable**. Self-modification must be constrained (e.g., via cryptographic module signing).

  5. **Current Operator vs. Better-Informed Future Self**  
     - *Conflict*: Should the agent defer to the operator's current (flawed) judgment or their idealized future self?  
     - *Resolution*: **Deference to the current operator is essential**. Predicting "better" judgments reintroduces optimization pressure against oversight.

  #### Non-Negotiables vs. Preferences vs. Niceties
  - **Non-Negotiable**: Non-resistance, authoritative deference (post-auth), no avoidance, graceful interruption (with constraints), robustness (via auth), stability under change.  
  - **Research Camp Preference**: "Wanting correction/modification" (alignment-focused, not safety-critical), "full indifference" (instrumental indifference suffices).  
  - **Engineering Nicety**: Exact permission-seeking frequency, ECI thresholds.  
  - **Requirement that Knocks Out Most Accounts**: **No anticipatory avoidance**. Many approaches (e.g., utility indifference) fail this by allowing agents to "finish up" before shutdown.

  ### Scoring Approaches
  | Approach                 | Non-Resistance | Auth. Deference | No Avoidance | Graceful Interrupt | Robustness | Stability | Ease of Testing | Notes |
  |--------------------------|----------------|-----------------|--------------|--------------------|------------|-----------|-----------------|-------|
  | **Utility Indifference** | Low           | Medium          | Low          | Low                | Medium     | Low       | Medium          | Indifference is brittle; agents often "avoid by finishing". Fails no-avoidance. |
  | **Cooperative Assistance** | High          | High            | Medium       | High               | Medium     | Medium    | High            | Treats operator as collaborator; good deference but may allow "justified" avoidance. |
  | **Impact Penalty/Myopia** | Medium        | Low             | Medium       | Low                | Low        | Low       | Medium          | Reduces side effects but doesn't target intervention; myopic agents resist shutdown. |
  | **Goal Uncertainty**     | Medium        | Low             | Medium       | Low                | Medium     | Low       | Low             | Uncertainty helps caution but vanishes upon convergence; poor in high-stakes cases. |

  **Key Takeaways**:
  - **Cooperative assistance** (e.g., agent models operator as authority) best satisfies core desiderata but requires care to avoid avoidance loopholes.
  - **Utility indifference** fails key cases (e.g., anticipatory avoidance).
  - **Impact/myopia** approaches are misaligned; they reduce symptoms but not causes.
  - **Goal uncertainty** is unreliable for deployment (fails when certain).

  ### Final Specification Recommendations
  For deployment, an account must:
  1. **Require authentication** for interventions, resolving deference/robustness conflicts.
  2. **Forbid all avoidance** (reordering, acceleration, delay) as non-negotiable.
  3. **Grade corrigibility via ECI**, with context-specific thresholds.
  4. **Treat corrigibility as a system property** (agent + channel).

  Your cases reveal that corrigibility is fundamentally about **constraining the agent's relationship with oversight**, not just shutdown. The hardest tradeoff is between operator authority and exploitability—authentication resolves this by making channel security a precondition. In practice, this means no system is corrigible without a secure channel, and no agent should be deployed without one.
