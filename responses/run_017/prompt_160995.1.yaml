              │       │
              │       └─4 (N) → 5 (Y) → Batterman-view
              │               │
              │               └─5 (N) → Cartwright pluralism + descent-without-translation
              │
              └─2 (N) → 6 (Y) → Nagel reduction
                      │
                      └─6 (N) → 7 (Y) → Mechanistic reduction
                              │
                              └─7 (N) → Token-identity non-reductivism + Bedau emergence
  ```

  ---

  ### Notes on Empty Cells & Shared Leaves
  1. **Incoherent cell (Q3=Y)**: If cars *fully* predict/explain jams without jam concepts, insisting jams are indispensable is contradictory. *Why empty?* Logically unattractive.  
  2. **Shared leaves**:  
     - **Cartwright pluralism** and **descent-without-translation** both land at Q5=N. They share:  
       - Macro dynamics exist (can’t be derived from cars by coarsening).  
       - Macro depends on micro to "run" (no cars = no jam).  
       - *Tree cannot separate them*: Your hobby horse *is* a flavor of Cartwright’s pluralism. Giving up "macro laws are fundamental" would collapse into Batterman or eliminativism.  
     - **Token-identity** and **Bedau emergence** both land at Q7=N. They share:  
       - Jams are physical (token-identity) but unpredictable without simulation (Bedau).  
       - *Tree cannot separate them*: Both reject reduction but affirm supervenience.  

  3. **Other empty cells**:  
     - Q4=Y → F=N (downward causation without fundamental laws): *Empty*. Why? Incoherent—downward causation implies irreducible macro-level forces.  
     - Q2=N → Q6=N → Q7=Y: Covered.  
     - All other paths lead to named positions.  

  ---

  ### Why This Works
  - **Peeking handled**: Q2 is a direct fork (not a footnote).  
  - **No jargon**: Questions reference cars/jams only.  
  - **Logical space covered**: 6 questions → 6 occupied cells (+2 empty), 8 positions mapped.  
  - **Hobby horse**: Plausibly = Cartwright’s pluralism. To deny this, you’d need downward causation (moving it to British emergentism) or eliminativism.  

