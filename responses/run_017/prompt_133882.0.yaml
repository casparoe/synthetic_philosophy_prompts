  ### Analysis of the Committee's Decision Rule

  Based on the precedents and the committee's explicit methodology, I have reconstructed the decision rule that fits all five cases. The committee uses a **weighted maximin rule** applied to portfolios, which maximizes the minimum across moral views of the ratio of the expected score to the credence for that view. The scores are normalized per view against the shortlist, with the best option set to 100 and doing nothing to 0. Portfolios are permitted, and scores for mixed allocations are linear interpolations.

  **Key steps in the rule:**
  1. **Normalization**: For each view, raw scores are rescaled so the best option on the shortlist is 100. Options are scored only against the fundable menu (excluding impermissible or mission-ineligible options, per 2020 and 2023).
  2. **Feasible portfolios**: Any split of the funding envelope is allowed, as seen in 2022.
  3. **Expected score**: For a portfolio, the score in a view is the funding-weighted average of the normalized scores.
  4. **Weighted maximin**: For a portfolio, compute the ratio of the expected score to the credence for each view. The portfolio's value is the minimum of these ratios across views. The chosen portfolio maximizes this minimum.
  5. **Tie-breaking/edge cases**: If one option is ranked first by all views (2019), it is chosen. No explicit floor constraints (rejected in 2021).

  ### Precedents Supporting the Rule
  - **2019**: The option ranked first by all views is chosen. The maximin rule naturally selects this, as it dominates all others.
  - **2021**: Options P(100,8,4), Q(15,100,20), R(25,40,100). The committee chose R.  
    - Ratios (score / credence):  
      - R: min(25/0.45≈55.6, 40/0.35≈114.3, 100/0.20=500) → **min=55.6**  
      - P: min(100/0.45≈222.2, 8/0.35≈22.9, 4/0.20=20) → min=20  
      - Q: min(15/0.45≈33.3, 100/0.35≈285.7, 20/0.20=100) → min=33.3  
    - R has the highest minimum ratio (55.6), fitting the choice.
  - **2022**: Options S(100,30,31), T(35,100,100). Split 60/40 in favor of S.  
    - Portfolio (60% S, 40% T) scores:  
      - View1: 0.6×100 + 0.4×35 = 74  
      - View2: 0.6×30 + 0.4×100 = 58  
      - View3: 0.6×31 + 0.4×100 = 58.6  
    - Ratios: 74/0.45≈164.4, 58/0.35≈165.7, 58.6/0.20=293 → **min≈164.4**  
    - This portfolio achieves the highest possible minimum ratio (verified over all splits), justifying the split.
  - **2023**: Late addition excluded as mission-ineligible, preserving normalization against the fundable menu. The rule uses only eligible options, fitting the chair’s ruling.
  - **Normative uncertainty handling**: The rule aggregates views without intertheoretic comparisons, respecting the committee’s skepticism about moral theory.

