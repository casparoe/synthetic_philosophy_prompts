answer: |-
  ### Kuhnian Analysis of the Prion Hypothesis Reception

  **1. Unit of Analysis**  
  The *smallest community* for which this constitutes a revolution is the **"slow/unconventional virus" subfield** (focused on TSEs). Here, protein-only replication overturned nucleic acid essentialism. The *largest community* for which it is *not* revolutionary is **molecular biology as a whole**, which absorbed prions as an exceptional mechanism without abandoning central dogma. For **veterinary/public health**, BSE/vCJD was a crisis demanding policy intervention, not a theoretical revolution—their paradigm remained disease containment. Scale matters: Kuhn’s "paradigm" falters when communities nest fractally.  

  **2. Paradigm Commitments**  
  *Hard commitments* of the virology paradigm:  
  - Replication requires nucleic acid (violation of central dogma unthinkable).  
  - Infectious agents must contain genetic material encoding replication.  
  *Habitual commitments*:  
  - All viruses fit established classification (size, structure, nucleic acid type).  
  - Pathogen diversity is explained by genomic variation.  

  **3. Anomaly vs. Crisis**  
  Alper’s radiation data (1960s) was an **anomaly**—initially dismissed as measurement error. Gajdusek’s "unconventional virus" (1977) was **paradigm-preserving accommodation**, creating a sub-kind to absorb anomalies while retaining nucleic acid. **Crisis arrived only with BSE/vCJD (1990s)**, an external event forcing urgency. Kuhn’s "internal theoretical failure" mechanism is inadequate here; socio-economic panic disrupted normal science more than accumulated anomalies.  

  **4. Three Grades of Incommensurability**  
  - **Referential (Grade 1)**: Minimal. "Virus" referred to *any* transmissible agent for virologists but implied *nucleic acid-containing* for molecular biologists. "Replication" meant templated copying for both, but prionists denied nucleic acid templating. Shared terms like "infectious agent" maintained reference.  
  - **Taxonomic (Grade 2)**: Significant. Virologists classified TSEs as *viral strains* (despite oddities). Prionists reclassified them as **conformational disorders**, collapsing sporadic, familial, and infectious forms into one kind (PrP misfolding). The "species barrier" and "strain diversity" were re-taxonomized as conformational stability variants.  
  - **Normative (Grade 3)**: Dominant. **Standards clashed**:  
    - Virologists: Failure to detect nucleic acid ≠ proof of absence; demanded direct evidence of protein-only replication.  
    - Prionists: Exhaustive negative evidence + protein misfolding kinetics sufficed; invoked Occam’s razor.  
  Shared metrics (incubation periods, lesion profiles) provided commensurability *bridges*, but their *interpretation* was paradigm-bound. Your suspicion holds: Grade 3 drove divergence; Grades 1–2 were secondary.  

  **5. Kuhn’s Silences**  
  Two critical factors outside Kuhn’s framework:  
  - **Structural alternative**: The "shielded genome" hypothesis (nucleic acid protected by host proteins) was a *non-paradigm-dependent* alternative. It sustained resistance without invoking core virology.  
  - **Policy-driven crisis**: BSE’s agricultural impact and vCJD’s emergence forced consensus *despite* unresolved mechanisms. Kuhn lacks tools for external socio-political shocks.  

  **6. Testing Kuhn’s Machinery**  
  (a) *Accommodation vs. Crisis*: "Unconventional virus" was accommodation; shielded genome prolonged it. Crisis required BSE’s existential threat. **Boundary criterion**: When anomalies necessitate abandoning a *hard commitment* (nucleic acid essentialism).  
  (b) *Shared Evidence*: Inactivation data was agreed upon but **interpreted differently**. Virologists: "Shielding explains resistance." Prionists: "No nucleic acid present." Kuhn’s meaning-variance underdetermines this; it’s about *weighting* evidence, not meaning.  
  (c) *Scale*: Paradigms are scale-relative. If no determinate scale, "revolution" becomes context-dependent—weakening Kuhn’s model.  
  (d) *Kuhn Loss*: **Strain diversity/heritability** was initially problematic for prions. Virology explained it via genomic mutation; prionists (pre-1997) lacked a conformational mechanism (resolved later via PrP glycosylation patterns).  
  (e) *Unfalsifiability*: Had Prusiner *failed* to purify infectious PrP by 1997, or if BSE never occurred, resistance would persist. **Falsifying condition**: Prolonged absence of critical evidence (e.g., no protein-only transmission by 2000) + sustained shielded-genome viability. It was *close*: Strain diversity nearly falsified prions pre-1990s.  

  **7. Verdict**  
  This was a **local revolution within TSE virology**, triggered externally (BSE) and resolving around normative incommensurability (Grade 3). It revised taxonomy (Grade 2) but left referential ties (Grade 1) intact. Kuhn’s framework captures the subfield’s paradigm shift but misdescribes the crisis mechanism (external > internal) and underestimates structural alternatives. A Kuhnian defender would argue that taxonomic reordering and restored puzzle-solving (post-1997 strain mechanisms) confirm the model—yet must concede that without BSE, "normal science" might have accommodated prions indefinitely.  

  ---  
  *Defender’s rebuttal*: "Kuhn accounts for external crises (e.g., Copernican revolution’s calendrical pressures); BSE accelerated anomaly recognition, but nucleic acid’s irreconcilable absence *was* the internal trigger."
