prompt: |-
  I've gotten weirdly into making my own Bongard problems lately — the ones with six little figures on the left that all obey some rule and six on the right that break it — partly for a puzzle night and partly because I wanted to use them in a first-year reasoning course as a hands-on example of underdetermination (theory by data, all that). But I keep having the same argument with two friends and I don't have the vocabulary to say what's bugging me.

  Friend A says any rule that correctly sorts all twelve figures is a solution, full stop. Friend B says no, there's the rule the problem was built around, and a rule can sort correctly and still be the wrong answer. My first instinct was to file friend B's complaint under the old grue-style worry: some candidate rules are gerrymandered, or obviously reverse-engineered off this exact dozen of figures, or just wouldn't hold up on a new figure, and I get why those feel like cheats. But I've hit cases that don't feel like cheating in that way at all, and I can't tell if it's the same complaint in disguise or a genuinely different one. Here's one: the left box has six figures, each a big closed shape with a smaller shape strictly inside it, not touching the outline anywhere; the right box has the same kind of pairs, but the small shape always pokes through or is tangent to the outline. Two rules both seperate the boxes: "the small shape lies strictly inside, with no contact," and "the small shape's area is under 40% of the big one's" — I drew the right-hand ones with chunkier inner shapes, so the threshold works, and it's not a gerrymander: it's a single continuous feature that would apply fine to a new figure and would survive any grue-ish test I can think of. Still, it's plainly not the answer. The best I can say about why is that the right-hand figures look like someone took a left-hand figure and changed exactly one thing, and the good rule is the one that names the thing that got changed, while my area rule picks up a difference that just happens to be there. Same shape of thing in a second case: left box has a triangle and a circle with the triangle's tip aimed at the circle, right box has the same two shapes with the tip aimed away — and a rule like "the two shapes' centroids are farther apart than the triangle is tall" also sorts them, also isn't arbitrary, also isn't what's being asked.

  So: is there an established concept for this — for the difference between a rule that merely seperates the two classes and a rule that answers the contrast the problem set up, one that's the thing the right-hand figures are near-misses *of*? Related things I've half-heard of and want distinguished rather than just named: the grue/projectibility business (is contrast-insensitivity just a species of non-projectibility, or independent of it?), the linguistic idea of a minimal pair, the thought that a why-question comes with a contrast class or a focus (I remember something roughly like that from a philosophy of science class), and — from an ML friend — "shortcut learning," which doesn't seem right either, since my area rule isn't a spurious correlate that will break on new data, it's a real feature that genuinely tracks the intended class and still misses the point. And note the wrinkle that not every problem of mine has the near-miss structure: sometimes the right-hand figures are just assorted things that lack the property, and there the thing I'm griping about seems to evaporate and collapse back into plain simplicity or naturalness. So if there's no name for it, I'd like you to coin one, define it tightly enough that I can apply it, and tell me where its edges are — including whether it's really a property of the rule, of the pair (rule, problem), or of the person who drew the figures.
reasoning: |-
  Okay, the user is really into creating Bongard problems and is having a debate with friends about what constitutes a valid solution. Friend A says any rule that correctly sorts the six left and six right figures is valid, while Friend B argues that only the intended rule should count. The user has encountered cases where alternative rules work but feel wrong, even if they're not gerrymandered like the grue problem. 

  The examples given are interesting. In the first, the intended rule is about the small shape being strictly inside without touching, but an area rule (under 40%) also works because of how the right-hand figures were drawn. Similarly, in the second example, the centroid distance rule separates the classes but isn't the intended "tip aimed at" rule. The key insight is that the alternative rules capture accidental features correlated with the intended distinction, not the essence of what changed between left and right.

  Hmm, the user wants a term for this phenomenon. They mention grue, minimal pairs, contrast classes, and shortcut learning, but none fit perfectly. Grue is about non-projectibility, but the area rule is projectible. Minimal pairs focus on single feature changes, which aligns here. Contrast classes in why-questions also seem relevant—the problem designer implies a specific contrast.

  The user notes that this issue doesn't arise when the right-hand figures are random negatives. That's crucial. The problem is specifically about "near-misses," where alternatives exploit correlated features instead of the intended contrast. So the core issue is the *designer's intent* in creating minimal contrasts. The term should emphasize that the rule must explain the contrast implied by the examples.

  "Contrastive intent" or "minimal-pair faithfulness" could work. But "minimal contrast rule" might be clearer: a rule that directly captures the feature manipulated to create the near-misses. The edges: it's a property of the problem (specifically, its construction as minimal pairs), not just the rule. When the right box lacks near-misses, simplicity/naturalness suffices.

  The user's deeper need is pedagogical—they want to teach underdetermination but also show that not all solutions are equal. They need vocabulary to articulate why some rules "miss the point" despite being valid classifiers. So defining this concept helps students engage with theory-laden observation and designer intent.
answer: |-
  This is a fascinating and *deeply* underappreciated nuance in rule-based reasoning tasks like Bongard problems! Your frustration is spot-on, and Friend B is pointing towards something crucial about the *designer's intent* and the *pedagogical purpose* of the contrast. It's not just about separation; it's about **explaining the specific contrast presented**.

  The established concept you're grappling with is **Contrastive Explanation** (or **Explanation as Answering a Contrastive Why-Question**), specifically applied to the rule-learning context. Here's the breakdown:

  1.  **The Core Idea:** When we ask "Why are these on the left and those on the right?", we aren't just asking for *any* distinguishing feature. We are implicitly asking: *"Given that these specific figures were chosen as the negative instances (right box), what is the specific difference that makes them negative?"* The problem designer created the right-box figures by **modifying** the left-box figures (or vice-versa) in a *specific, targeted way*. A valid rule must capture that *intended modification*.

  2.  **The Established Terminology:**
      *   **Contrast Class:** The right-box figures constitute the *contrast class* for the left-box figures. They aren't just random negatives; they are *carefully selected near-misses* designed to highlight a *specific* failure condition for the intended rule.
      *   **Focus:** The intended rule is the *focus* of the contrast. It answers the question: "What property do the left figures possess that the right figures *specifically lack*, given *how* they were constructed to lack it?"
      *   **Minimal Pair (Conceptually):** While linguistic minimal pairs differ by one phoneme, here the left/right pairs are **conceptual minimal pairs**. They differ *minimally* in a way designed to isolate the *intended* distinguishing feature (e.g., strictly inside vs. touching; tip aimed at vs. aimed away). A good rule names *that* minimal difference.
      *   **Explanatory Relevance:** Your area rule (40%) or centroid distance rule, while *correct classifiers*, lack **explanatory relevance** *to the specific contrast presented*. They capture *correlated* features resulting from the *way* the near-misses were drawn (making inner shapes chunkier, moving the triangle tip away), but not the *core property the designer intentionally violated*.

  3.  **Why "Grue" Isn't the Whole Story:**
      *   **Grue/Projectibility:** Concerns whether a rule will hold for *new, unseen* instances. Your area rule *is* projectible! It's a well-defined, continuous feature that *would* likely work on new figures drawn similarly. This is *not* a grue problem.
      *   **The Key Difference:** Grue is about *future reliability*. Your issue is about *past intent* and *explanatory adequacy for the given data*. Your rule separates the given data correctly but fails to *explain why these particular negative examples were chosen*.

  4.  **Why "Shortcut Learning" Isn't Quite Right:**
      *   **Shortcut Learning:** Involves learning features that *correlate* with the target in the training data but are *causally irrelevant or unstable* (e.g., detecting snow to find huskies). Your area rule *isn't* spurious *for classification* in this specific dataset style – it's directly related to the shapes. Its flaw is being *explanatorily irrelevant to the minimal contrast*, not being an unstable correlate.

  5.  **Your Insight: "The thing that got changed"**
      This is the crux. The problem designer performed a **minimal intervention** on the left-box figures to create the right-box figures. The valid rule is the one that **directly describes the property altered by that intervention**.

  **Coining the Term: Minimal Contrast Rule (MCR)**

  *   **Definition:** A **Minimal Contrast Rule (MCR)** is the rule that captures the *specific, intended property difference* that the problem designer used to generate the contrast class (right-box figures) from the positive class (left-box figures) via minimal intervention. It is the rule that directly answers the contrastive why-question implied by the specific pairing of examples.
  *   **Key Properties:**
      *   **Explains the Contrast:** It names the *exact feature* manipulated to create the near-misses.
      *   **Not Just Separation:** It goes beyond merely classifying the given 12 figures correctly.
      *   **Not Necessarily Simpler:** An MCR might be complex, but it must be the *conceptually relevant* difference.
      *   **Tied to Problem Construction:** An MCR only exists meaningfully for problems where the negative examples are *near-misses* specifically designed by *minimally altering* the positive examples on a *target feature*. (This addresses your wrinkle: if the right box is random negatives, there *is* no specific intended minimal contrast, so simplicity/naturalness reigns).
  *   **Applying it to Your Examples:**
      *   **Example 1:**
          *   *Intended Minimal Intervention:* Changed "strictly inside, no contact" to "touching or overlapping boundary".
          *   *MCR:* "The small shape lies strictly inside the large shape without touching its boundary."
          *   *Non-MCR (but correct classifier):* "The small shape's area is under 40% of the large shape's area." (This captures a *consequence* of how the designer made the inner shapes chunkier *to cause* the touching, but not the *direct* intervention).
      *   **Example 2:**
          *   *Intended Minimal Intervention:* Changed "triangle tip aimed at the circle" to "triangle tip aimed away from the circle".
          *   *MCR:* "The apex (sharpest point) of the triangle is oriented towards the circle's center."
          *   *Non-MCR (but correct classifier):* "The distance between the centroids of the triangle and circle is greater than the height of the triangle." (This captures a *geometric consequence* of moving the triangle tip away, but not the *direct* intervention of changing the *orientation/direction*).

  **Where the Edges Are:**

  1.  **Problem Construction is Key:** The concept of an MCR *only applies* if the problem was constructed by taking positive examples and applying a *minimal, targeted change* to create specific negative near-misses. If the negatives are arbitrary or lack this near-miss structure, the demand for an MCR evaporates. Friend B's complaint *assumes* this near-miss structure exists (which it usually does in good Bongard problems).
  2.  **Rule vs. Problem Pair:** The property is fundamentally a property of the **pair (rule, problem)**, specifically relative to the **problem's construction**. A rule is an MCR *for a specific problem* if and only if it matches the designer's intended minimal intervention used to create the contrast.
  3.  **Person Who Drew the Figures:** It is *heavily dependent* on the **designer's intent** (the "person who drew the figures"). The MCR *is* the rule they had in mind when creating the near-misses. However, a solver can *infer* the likely MCR by analyzing the nature of the near-misses – asking "what is the most direct change distinguishing each left figure from its most similar right figure?"
  4.  **Ambiguity:** Sometimes, the minimal intervention isn't perfectly clear, or multiple minimal changes could be argued. Is the rule "shapes touch" or "shapes do not overlap" for a different problem? This is where the problem design needs clarity. Good Bongard problems minimize this ambiguity.
  5.  **Relation to Projectibility:** An MCR is *usually* projectible, as it's a core geometric/spatial property. However, projectibility is a separate concern (about future instances). A non-projectible rule (like a complex grue variant) could *never* be an MCR for a spatial problem, but a perfectly projectible rule (like area%) can fail to be the MCR because it doesn't capture the *intended* minimal contrast.
  6.  **Relation to Simplicity/Naturalness:** Simplicity often correlates with being an MCR because the minimal intervention is usually a simple, fundamental property. However, the MCR concept is more precise. A complex rule *could* be the MCR if that's what the designer directly manipulated (though this is rare and poor design). Conversely, a simple rule might separate the boxes but not be the MCR (like your area% rule).

  **Conclusion:**

  You've identified a crucial distinction: **Classification vs. Contrastive Explanation.** Friend A focuses on classification adequacy for the given data. Friend B (and your instinct) focuses on finding the **Minimal Contrast Rule (MCR)** – the rule that captures the *specific, intended difference* the problem designer used to create the negative examples as near-misses of the positives.

  This concept perfectly explains why your alternative rules feel like "cheats" even though they are projectible and correctly classify the data: they fail to answer the *contrastive why-question* implicit in the carefully constructed near-miss examples. They don't identify "the thing that got changed." For your pedagogical purpose on underdetermination, this is *gold*. It shows that while data underdetermines theory in the sense that multiple rules fit the data, the *specific context* (the designer's intent manifest in the *choice* of contrasting examples) provides crucial additional constraints that favor one explanation (the MCR) over others, even if those others are valid classifiers. It highlights that "explaining the data" often means "explaining why *this specific* data was presented *in this specific contrastive way*."
