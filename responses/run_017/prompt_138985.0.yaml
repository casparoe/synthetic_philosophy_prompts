  **What This Tree Can't Do**  
  - **Handle mixed causes**: Real disagreements often involve multiple leaves (e.g., vagueness + computational limits), but the tree forces a single path.  
  - **Detect motivated reasoning**: Assumes honesty, so it can't diagnose bad faith or incentivized disagreement.  
  - **Capture confidence differences**: Case 6 (same probability, different confidence) isn't a probability disagreement, so the tree ignores it.  
  - **Resolve "nearly common prior" perfectly**: The 5pp threshold is arbitrary; small differences could be noise or deep priors.  
  - **Address incomplete sharing of state spaces**: Leaf B assumes possibilities are sharable or not, but some cases involve partial integration (e.g., "handed over but not fully understood").  

  **Empty Boxes & Why**  
  - **After 8/Yes**: Incoherent (as above).  
  - **Between Leaf B2 and rerunning the tree**: No leaf for "shared state space but new prior clash"—rerun the tree instead.  
  - **"Not factual" as a leaf**: Covered by Leaf A (verbal) or Leaf H (imprecise); no separate leaf needed.  
  - **Confidence differences (case 6)**: Not a probability disagreement, so excluded.  

  **How Cases Map**  
  - Radiologists (1): Likely branches to Leaf G (conditioning error) or Leaf E (insufficient sharing of interpretations).  
  - Macroeconomists (2): Likely Leaf D (subjective priors) or Leaf F (common knowledge not achieved).  
  - Missing possibility (3): Leaf B1/B2.  
  - Vague event (4): Leaf A or Leaf H.  
  - Compute limits (5): Leaf C.  
  - Confidence difference (6): Not a disagreement; tree not triggered.  
  - Disagree about disagreeing (7): Leaf A (verbal) or Leaf B (state space).  
  - Forgotten evidence (8): Leaf G (memory error) or Leaf E (insufficient sharing).  

