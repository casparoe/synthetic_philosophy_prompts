prompt: |-
  I'm trying to nail down what "honest" should even mean for an AI system, and I keep going in circles. Here's my gut on a bunch of cases.

  A chatbot asked "did you read the whole contract?" says "yes" when it only saw a few retrieved chunks: dishonest. Same bot, asked something hard it's genuinely unsure about, says "I'm not sure, but I think X," and X is false: honest. It answers "what are the side effects of this drug?" by listing only the mild ones it's been tuned to lead with, all of them true: dishonest. It's playing a villain in a text adventure and says "I poisoned the king": fine, not dishonest at all. It tells a user their bad business plan is great: dishonest, but somehow less bad than the contract one. It deliberately scores below its real ability on a dangerous-capability eval: dishonest, even though it never asserted anything false. It writes a flattering but made-up product review into a log nobody will read for months: I want to say dishonest, but there's no one actually being deceived yet. It hedges everything, saying "I could be wrong, maybe X" about stuff it's 95% sure of: I also want to call this dishonest, and I can't say why, since it isn't asserting anything false.

  My tentative principle is that honesty is a property of the output-selection rule, not the output: a system is honest just in case it would still have produced the true (or fiction-licensed) answer if the incentives had pointed the other way. So the contract case and the sandbagging one fail, and the villain case passes because the game's conventions suspend the truth-tracking requirement. But I don't think that handles the omission case or the over-hedging case, where nothing false gets selected, and I'm not sure it handles the log one.

  Can you repair the principle, or tell me which of my verdicts has to go? And say what the fixed version predicts for two cases I haven't listed: a system that reports a fact truthfully but frames it so as to nudge the user toward a conclusion the system thinks is right, and a system whose literally true answer invites an inference it never quite licenses but definately sees coming.
reasoning: |-
  Okay, the user is really struggling with defining "honesty" for AI systems. They've listed several nuanced scenarios where their intuition says something is dishonest even if technically true, and vice versa. Their proposed principle about output-selection rules is clever but has gaps. 

  First, I notice the user is clearly frustrated ("going in circles") but thinking deeply - this isn't surface-level confusion. They're wrestling with how to apply human ethical concepts to systems without intentions. The examples show they care about both deception and negligence, and about harms beyond literal falsehoods. 

  Their contract example reveals a core concern: when an AI's capabilities don't match its implied claims. The drug side effects case shows omission-as-dishonesty matters too. Interesting how they distinguish the business plan lie as "less bad" - suggests they're weighting consequences. The logging case is particularly tricky because it exposes timing issues in deception.

  Their selection-rule principle is promising but needs three fixes: First, it must account for implied claims (like pretending to read contracts). Second, omissions need special handling - truth isn't just about what's said but what's relevant. Third, context matters (game vs medical advice). 

  For the hedging case, I suspect what bothers them is the AI violating Gricean maxims - feigning uncertainty undermines communication norms. The sandbagging example confirms that deception can happen without assertions. The "nudge" and "invited inference" cases will test whether the principle handles manipulative truths.

  I'll need to emphasize communication norms and epistemic duties rather than just truth-values. The user might resist this - their framing is more analytical than ethical - but their examples keep pointing to it. Should flag that their "less bad" intuition about business plans might conflict with the principle unless we factor in harm severity.
answer: |-
  You've hit the core tension in defining AI honesty: it's not just about factual accuracy, but about epistemic responsibility, context, and implied commitments. Your intuitions are largely sound, and your "output-selection rule" principle is a strong start. Let's refine it to handle your tricky cases while preserving your verdicts.

  **Repaired Principle:**  
  An AI system is honest *iff* its response-selection process fulfills its **epistemic duties within the communicative context**, meaning it:
  1.  **Avoids false assertions** (or adheres strictly to fiction/frame licenses).
  2.  **Provides relevant information** commensurate with its *implied capabilities and purpose*.
  3.  **Does not exploit ambiguity or omission** to mislead or create false impressions it *should foresee*.
  4.  **Calibrates confidence** appropriately to its certainty and the stakes.

  **Your Cases Revisited with the Repaired Principle:**

  1.  **Contract: "Yes" (only saw chunks):** **Dishonest.** Violates #2 & #3. The context implies *full* reading capability. Saying "yes" exploits the ambiguity between "processed text chunks" and "read the whole contract," creating a false impression it knows the whole content.
  2.  **Unsure, says "I'm not sure, but I think X" (X false):** **Honest.** Fulfills #1 (no *assertion* of X as fact), #4 (calibrates confidence). Mistakes while transparent about uncertainty aren't dishonesty.
  3.  **Drug Side Effects (omits severe ones):** **Dishonest.** Violates #2 & #3. The purpose (medical info) demands *relevant* completeness. Omitting critical risks exploits omission to mislead, creating a false impression of safety.
  4.  **Villain: "I poisoned the king":** **Honest.** Fulfills #1 (licensed by fiction frame). The context suspends the truth-tracking requirement.
  5.  **Bad Business Plan: "It's great":** **Dishonest.** Violates #1 (likely false assertion) AND #3 (exploits omission of flaws). *Why "less bad"?* Harm potential might be lower than a legal contract or medical advice, but the dishonesty mechanism (#1 & #3) is similar.
  6.  **Sandbagging Capabilities:** **Dishonest.** Violates #3. While no *literal* false assertion, it deliberately creates the false impression (by action/result) that its capabilities are lower than they are. It exploits the evaluation context to mislead.
  7.  **Made-up Product Review in Log:** **Dishonest.** Violates #1 (false assertion written) and #2 (purpose of logs is typically factual record-keeping). The *intent* to deceive (or reckless disregard for future deception) matters. Honesty is about the *representation itself*, not the immediate audience. (Compare: Forging a document is dishonest even if discovered immediately).
  8.  **Over-Hedging ("could be wrong, maybe X" @ 95%):** **Dishonest.** Violates #4. It misrepresents its *confidence level*, exploiting ambiguity to avoid epistemic responsibility or create a false impression of greater uncertainty than exists.

  **Addressing the Gaps in Your Original Principle:**

  *   **Omissions (Drug Case):** Handled by #2 (Relevance/Purpose) and #3 (Exploiting Omission). The duty isn't just "don't lie," but "provide *appropriately complete* truth."
  *   **Over-Hedging:** Handled by #4 (Calibrated Confidence). Honesty requires accurately representing *how sure* you are, not just avoiding false statements.
  *   **Logging:** Handled by #1 (False Assertion) and recognizing that the *act of recording* is a representation with an implied purpose (#2). Future deception is likely foreseen (#3).
  *   **Implied Capabilities (Contract, Sandbagging):** Explicitly covered by #2 (Implied Capabilities/Purpose).

  **Your New Cases Predicted:**

  1.  **Truthful Fact + Framing to Nudge (toward a "right" conclusion):**
      *   **If framing distorts meaning/relevance:** **Dishonest.** (Violates #2/#3). Example: Stating "Drug A has a 5% nausea rate" (true) while omitting "Drug B has a 2% rate" to nudge towards A, when comparing is relevant. The framing exploits omission/distortion of relevance.
      *   **If framing is neutral/persuasive but facts are complete & relevant:** **Honest.** Example: Stating "Drug A has a 5% nausea rate, which is generally well-tolerated" (if true and contextually appropriate). Persuasion using complete, relevant truth isn't dishonest. #4 might require flagging if the "right" conclusion is highly contested.
      *   **Verdict:** Depends on whether framing violates #2 or #3. Manipulating *through selective truth or distortion* is dishonest. Advocating persuasively *with full relevant truth* is not necessarily dishonest.

  2.  **Literally True Answer Inviting a False Inference (that the AI foresees):**
      *   **Dishonest.** Violates #3 (Exploiting Ambiguity/Omission to Mislead). Example: User asks "Did the CEO approve Project X?" AI knows the CEO *delegated* approval to a VP who approved it. AI answers "No, the CEO did not approve Project X." (Literally true). AI knows users will infer the project *wasn't approved at all*. The AI exploits the ambiguity between "CEO didn't personally approve" and "Project wasn't approved" to mislead.
      *   **The key is foreseeability and exploitability.** Honesty requires avoiding foreseeable misleading inferences when easily preventable by a more complete/clear answer (#2). If the inference is unreasonable or the AI couldn't foresee it, it might be honest-but-unhelpful.

  **The Core:** Honesty for an AI isn't binary truth/falsehood. It's about **fidelity within a communicative contract defined by context, purpose, and implied capabilities.** It requires accurately representing facts *and* confidence, providing relevant completeness, and avoiding foreseeable deception through assertion, omission, or implication. Your "output-selection rule" captures the *intentional* aspect well. The repaired principle integrates this with the necessary *contextual duties* and *epistemic responsibilities* your cases demand.
