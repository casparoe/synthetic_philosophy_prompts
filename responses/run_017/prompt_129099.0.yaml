answer: |-
  Here's the tight, mechanics-focused joke for the repeated hitchhiker case:

  **Setup:**  
  "So this driver saves me in the desert, right? I swear, 'Get me home weekly, I'll pay you BIG each Friday!' He agrees. Smart guy. *Too* smart. Because next week, he shows up and asks, *'What about the last ride? After my final trip, why would you pay me then?'*"

  **Punchline:**  
  "And I just looked him dead in the eye and said, '*Relax. I'm not paying you next Friday because it makes sense then. I'm paying you next Friday... out of habit.*'"

  **Mechanism:**  
  *(Quietly, almost to yourself, after the punchline)*  
  "Gotta pre-commit to being the *type* who pays debts *after* the leverage vanishes. Pure rational irrationality."

  ---

  **Why it works:**
  1.  **The Machinery:** It explicitly forces the hitchhiker to invoke a *disposition* ("habit") – a non-instrumental reason rooted in past commitment – to solve the backward induction problem. The driver's bet *is* on this disposition. The "out of habit" line crystallizes the rational-irrationality move perfectly.
  2.  **Accessibility:** Non-philosophers get the absurdity of paying a huge sum "out of habit" like it's buying coffee. It sounds unhinged. Partners-of-philosophers laugh at the sheer weirdness.
  3.  **Insider Groan:** Philosophers instantly recognize the "disposition" / "type of person" / "commitment device" solution to the repeated interaction unraveling. "Out of habit" is a comically mundane way to describe becoming the kind of agent who acts against their future self's best *instrumental* reasons.
  4.  **Conciseness:** Setup (desert, promise, repetition, driver's smart objection) + Punchline (the "habit" solution) lands well under 30 seconds.
  5.  **Avoids the Pitfalls:** No references to HGTTG, no puns on utility/EV, clearly distinct from the Toxin Puzzle (this is about action *after* the benefit is received, not just forming an intention). It's *all* about the *timing* of reasons vanishing and needing a non-reason-based trait.

  **Delivery Tip:** Lean into the deadpan sincerity of "out of habit" – like it's the most normal thing in the world to spend thousands of dollars on autopilot. The contrast *is* the joke for the wider audience, and the grimace-inducing accuracy *is* the joke for the philosophers. Good luck with the set!
