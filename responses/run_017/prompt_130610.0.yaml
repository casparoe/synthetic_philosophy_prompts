  ## Sestina: The Persisting Names  

  In nerve and synapse, sharp as rain, I feel the **PAIN**.  
  Gold in a vault or coin in hand: that’s **MONEY**.  
  A sailor binds the rigging with a **KNOT**.  
  The ocean heaves a cresting, crashing **WAVE**.  
  Children at cards play round after round—a **GAME**.  
  The breath and pulse we call organic **LIFE**.  

  But in the soil, a microbe’s spark of **LIFE**  
  ignites no nerves, yet still it flees from **PAIN**—  
  a chemical retreat, not sport or **GAME**.  
  A stone or shell once traded as crude **MONEY**,  
  while pressure builds to force a seismic **WAVE**,  
  and twisted vines form nature’s root-bound **KNOT**.  

  A protein chain, an unseen, coiled **KNOT**,  
  sustains the cell’s unthinking dance of **LIFE**.  
  The light that speeds in particle and **WAVE**  
  strikes eyes, but knows no sting of **PAIN**.  
  Now digits flash: a ledger’s ghostly **MONEY**,  
  while chess AIs compute their cold, swift **GAME**.  

  The gambler throws the dice in one more **GAME**;  
  the data packet ties a fleeting **KNOT**.  
  The paper note, a fragile stand-in **MONEY**,  
  gives form to trust, not breath or pulse of **LIFE**.  
  The robot’s sensor flags a false **PAIN**;  
  the radio beam transmits a silent **WAVE**.  

  The black hole’s pull: a gravity-warped **WAVE**;  
  the quantum dice roll chance into their **GAME**.  
  The cactus needle pricks, but feels no **PAIN**;  
  the star’s collapse, a cosmic, final **KNOT**.  
  We scan the void for hints of alien **LIFE**,  
  and dream of asteroid-mined, future **MONEY**.  

  The blockchain’s flow: abstract, electric **MONEY**;  
  the hurricane’s might: an atmosphere-made **WAVE**;  
  the Mars rover’s search for microbial **LIFE**;  
  the Deep Blue’s move: a circuit-driven **GAME**;  
  the magnet’s field: an unseen, binding **KNOT**;  
  the dolphin’s cry: a mind that knows true **PAIN**.  

  ---

  **Envoy**  
  If particles explain this **MONEY**, this **PAIN**,  
  and every **KNOT** is shaped by some base **WAVE**,  
  what work remains for **GAME**? What breathes in **LIFE**?  

  ---

  ### Notes for Your Lecture  
  - **Form as Argument**: The sestina’s rotation forces the same six end-words to recur in new contexts. Each stanza replaces the physical basis (nervous system → microbe → protein → data → gravity → magnetism) while the *kind* (pain, money, etc.) persists—visually embodying multiple realizability.  
  - **Philosophical Precision**:  
    - **Stanzas 1-6**: Each kind is re-identified across heterogeneous realizers (e.g., pain in neurons, microbes, robots; money as gold, paper, blockchain).  
    - **Envoy**: Poses Kim’s exclusion problem starkly—no metaphor, no resolution—leaving the causal question open for debate.  
  - **Accessibility**: No jargon beyond the six end-words. Realizers described concretely (e.g., "protein chain," "blockchain’s flow") without technical terms.  
  - **Audience Impact**: The form’s inevitability ("the word is the only thing that survives the turn") mirrors the lecture’s theme, landing viscerally on first hearing.  

  The poem closes on the envoi’s unresolved question, inviting your students to argue—as intended—about whether functional kinds do causal work when physics seems sufficient.
