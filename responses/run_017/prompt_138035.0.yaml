    Note: The veto round may be a bit artificial. We might skip it if time is short.

    What will predictably go wrong:

      - Someone might not want to play the role: e.g., Taylor might say, "I don't care if my partner reads, I just want to read it myself." Then they might reorder their preferences. We can encourage them to play the role for the sake of the experiment.

