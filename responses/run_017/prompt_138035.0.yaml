  We are going to design an activity that leads the group to experience Sen's liberal paradox. The paradox arises when we try to combine two principles:
    1. Minimal liberalism (ML): Each individual has at least one pair of alternatives over which they are decisive (i.e., their preference determines the social preference for that pair).
    2. Pareto principle (P): If every individual prefers X to Y, then society must prefer X to Y.

  Under these conditions, there are situations where no consistent social preference ordering exists.

  We'll use a scenario with three people (for simplicity, but it can be extended) and three alternatives. Each alternative is a vector of three attributes, each attribute being a personal matter for one individual. For example, we might have three people: Alice, Bob, and Charlie. Each has a personal matter that only concerns them (e.g., what color shirt they wear, what book they read, etc.). However, the social state is a combination of these personal matters.

  But note: in Sen's original example, the personal matter is not entirely isolated because the paradox often involves a "meddlesome" preference. That is, one person might care about another's personal matter.

  We'll design three social states (A, B, C) each described by three attributes, one for each participant. We assign to each participant a personal sphere (one attribute) over which they are given decisive power.

