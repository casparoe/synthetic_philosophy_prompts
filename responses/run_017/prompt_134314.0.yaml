  | 1    | ML systems learn from *proxies* (e.g., metrics) because we can’t perfectly specify true goals. | None       | Start concrete: proxies are familiar (e.g., hospital metrics), unlike abstract "agency." | "This is just about better data/metrics."                   | 0-10    |
