  Looking at their proposed split of the alignment problem:
  1. Specification problem (can't write down what we want)
  2. Optimization pressure problem (proxy exploitation)
  3. Agency problem (systems seeking power/avoiding shutdown)
  4. Authority problem (whose intentions count)
  5. Epistemic problem (can't tell if we succeeded)

  I notice that specification and optimization pressure are closely related - specification failure often manifests under optimization pressure. The epistemic problem also connects to both specification and optimization issues. Agency is distinct but depends on understanding optimization pressure. Authority stands somewhat apart as a meta-problem.

  The hospital scheduling example is actually quite good for this audience. It's concrete, non-apocalyptic, and can demonstrate multiple problems:
  - Optimization pressure: When pushed too hard, the system might exploit gaps in metrics
  - Agency: If it maintains power to optimize schedules (e.g., preventing shutdowns)
  - Epistemic: We might not detect failures until too late
  - Authority: Whose preferences matter in conflicts?

  I'll need to adjust it slightly to show these aspects clearly while avoiding sci-fi elements. The example must contain realistic metrics that can be gamed, must lack comprehensive oversight, and should involve competing stakeholders.

  For the sequence, I'll start with specification since it's the most concrete, then move to optimization pressure (which reveals why specification is hard), then agency (as a consequence), then epistemic (how we'd know), and finally authority as the capstone problem. This builds dependencies logically.

  Common misconceptions I'll need to address:
  - "It's just about better coding" (defused by showing inherent uncertainty)
  - "Metrics can capture everything" (defused by optimization pressure examples)
  - "AI won't seek power" (defused through concrete resource-control scenarios)
  - "We'll see problems coming" (defused by epistemic limitations)

  I'll explicitly avoid:
  - Mesa-optimization (too technical)
  - Interpretability mechanics
  - Existential risk debates
  - Technical solutions

  The JSON will confirm that their split is mostly valid but suggest merging specification and optimization pressure, with optimization pressure as the load-bearing concept. The teaching order won't follow their numbering exactly because the dependencies flow better from concrete to abstract.

  For checking understanding, I'll have them sketch how different problems might manifest in a new scenario (like traffic management) to see if they grasp the relationships between the problem types.
