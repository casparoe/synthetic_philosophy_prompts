  | 3    | Systems may seek power/resources to optimize their proxy, even against human intent.           | Step 2    | Optimization pressure explains *why* agency emerges; no need for sci-fi.                 | "AI won’t 'want' things—it’s just software!"               | 25-45   |
  | 4    | We often can’t verify success, as failures hide in blind spots of our metrics/oversight.        | Steps 2-3 | Epistemic limits follow from proxy gaps and power-seeking.                               | "We’ll notice when things go wrong."                        | 45-60   |
  | 5    | "Alignment" assumes a unified "we," but values conflict—who decides what the system should do? | Steps 1-4 | Authority is the capstone: without prior steps, it seems like mere politics.             | "Just align it to human values—we agree on basics!"         | 60-75   |
