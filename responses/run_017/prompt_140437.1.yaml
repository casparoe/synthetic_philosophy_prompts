  #### Section 1: Agreed Claims  
  We affirm the following non-vacuous points of convergence, grounded in observable phenomena and explanatory goals:  

  1. **Folk-Psychological Data**: Everyday attributions of "we-intentions" (e.g., "We are playing music together") are robust and track stable behavioral patterns (e.g., coordinated action, mutual adjustment). Both accounts accept these attributions as data requiring explanation, not as linguistic noise.  
  2. **Obligations in Practice**: When joint actions break down unilaterally (e.g., one party abandons a shared task without notice), the aggrieved party typically experiences resentment, and third parties often perceive a normative failure. Both accounts agree this requires explanation, though they diverge on the source.  
  3. **Interdependence Necessity**: Successful joint action requires participants to coordinate their intentions and actions interdependently (e.g., adjusting to each other’s behavior). Neither view reduces joint action to mere parallel individual acts.  
  4. **Common Knowledge as Enabler**: Common knowledge (e.g., "I know that you know I intend X") is necessary for paradigmatic joint action to avoid coordination failures like unilateral deception or misunderstanding.  
  5. **Commitment as Stabilizer**: Joint action involves a distinctive stability against defection—participants do not treat the activity as disposable. Both accounts seek to explain this, but disagree on whether it demands a novel metaphysical commitment.  
  6. **No "Magic" Collectives**: Neither view posits group minds independent of individuals. Disagreement centers on whether joint commitment is emergent (non-reductionist) or fully decomposable (reductionist).  

  ---

  #### Section 2: Disagreements Table  
  Each claim is stated neutrally in the form endorsed by the respective side.  

  | Disputed Claim                                                                 | Non-Reductionist View (Priya)                                                                                                 | Reductionist View ([Your Name])                                                                                                |  
  |--------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------|  
  | **Nature of "We-Intentions"**                                                  | We-intentions are sui generis: irreducible to individual intentions + common knowledge. They constitutively involve joint commitment. | We-intentions reduce to interlocking individual intentions (e.g., "I intend that we J"), mutual responsiveness, and common knowledge. No primitive "we" exists. |  
  | **Source of Obligation**                                                       | Obligations in joint action derive from joint commitment itself. They are owed to the plural subject and can only be rescinded jointly. | Obligations reduce to moral norms (e.g., reliance, promise-keeping) + interdependence. They are owed to individuals and can be dissolved unilaterally. |  
  | **Minimal Conditions for Shared Intention**                                    | Shared intention requires actual mutual commitment, established through communication (explicit or implicit), to create a plural subject. | Shared intention can emerge without prior communication if there is common knowledge of interlocking intentions + mutual responsiveness. |  
  | **Agency Requirements**                                                        | Genuine joint action requires all participants to be intentional agents capable of commitment. Non-agents cannot be part of a "we." | Joint action can integrate non-agents (e.g., tools) if humans maintain interlocking intentions. Agency is not required in all parts of the system. |  
  | **Bindingness of Commitment**                                                  | Joint commitment creates non-moral normative "oughts" specific to the plural subject, distinct from personal or ethical obligations. | All normative "oughts" in joint action are moral or prudential (e.g., consistency with one’s intentions, avoiding harm to others). |  

  ---

  #### Section 3: Cruxes with Predictions  
  Each crux includes a case or test both sides accept as relevant, followed by predictions. Agreements in predictions are flagged.  

  **Crux 1: Laggy Duet**  
  - **Case**: Two musicians perform over a 400ms delay, compensating anticipatorily. They coordinate between takes via chat but cannot adjust intra-phrase.  
  - **Question**: Does this constitute shared intention? Must mutual responsiveness be real-time?  
  - **Non-Reductionist Prediction**: No shared intention *in the performance*. Responsiveness must be real-time for joint commitment; this is merely coordinated solo play. Planning chats may involve shared intention, but not the music-making.  
  - **Reductionist Prediction**: Shared intention exists. Responsiveness operates at the take level via planning; anticipatory adjustments (based on common knowledge) substitute for real-time interaction.  
  - **Agreement?**: No. Discriminates on whether responsiveness must be synchronous.  

  **Crux 2: Unbriefed Choreography**  
  - **Case**: Two strangers, having learned the same dance routine separately, recognize each other mid-routine on a dance floor and begin adjusting movements.  
  - **Question**: Can shared intention arise without prior communicative commitment?  
  - **Non-Reductionist Prediction**: No shared intention. Mutual adjustment is mere coincidence without joint commitment via communication (even implicit).  
  - **Reductionist Prediction**: Shared intention emerges. Common knowledge of mutual recognition + real-time responsiveness bootstraps interlocking intentions; no prior commitment needed.  
  - **Agreement?**: No. Discriminates on whether communication is necessary for commitment.  

  **Crux 3: Mixed Trio**  
  - **Case**: Two humans and an LLM assistant plan a party in a group chat. The LLM tracks commitments, proposes times, and nudges flakers. Humans offload planning/memory to it.  
  - **Question**: Is this joint action? Does reductionism require intending in all participants?  
  - **Non-Reductionist Prediction**: Not joint action. The LLM lacks agency and cannot commit, so no plural subject forms. Humans may share intentions, but the system as a whole is not a "we."  
  - **Reductionist Prediction**: Joint action occurs between humans. The LLM is a tool; human intentions interlock via responsiveness to each other and the LLM’s outputs. Offloading does not negate jointness.  
  - **Agreement?**: No. Discriminates on whether non-agents can mediate joint action.  

  **Crux 4: Silent Release Test**  
  - **Test**: During joint action (e.g., painting a house), one participant says, "You’re off the hook—no need to continue."  
  - **Question**: Does the obligation dissolve unilaterally, or survive without joint rescission?  
  - **Non-Reductionist Prediction**: Obligation survives. Joint commitment can only be rescinded jointly; release requires mutual agreement.  
  - **Reductionist Prediction**: Obligation dissolves. Release negates reliance; no distinct "joint" obligation exists beyond interpersonal norms.  
  - **Agreement?**: No. Discriminates on the source/nature of obligation.  

  **Crux 5: Third-Party Rebuke Test**  
  - **Test**: One participant bails on a joint action (e.g., community cleanup). An uninvolved third party (e.g., a neighbor) rebukes them.  
  - **Question**: Is the rebuke appropriate? Does it imply obligation to a "we"?  
  - **Non-Reductionist Prediction**: Rebuke is appropriate. Obligation is owed to the plural subject, which third parties can invoke as community members.  
  - **Reductionist Prediction**: Rebuke is inappropriate unless the third party is affected. Obligations are owed only to co-participants, not to a collective.  
  - **Agreement?**: No. Discriminates on whether obligations transcend dyadic relations.  

