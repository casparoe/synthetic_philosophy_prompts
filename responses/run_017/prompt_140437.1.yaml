  We are drafting a joint statement for an adversarial collaboration between two views on collective intentionality: the Gilbert/Searle-inspired non-reductionist view (Priya's) and the Bratman-inspired reductionist view (mine). The document must include three novel cases (laggy duet, unbriefed choreography, mixed trio) and two diagnostic tests (silent release, third-party rebuke). The structure is:

  1. **Agreed Claims**: Non-vacuous, focusing on folk-psychological data and explanatory agreements.
  2. **Disagreements Table**: Each disputed claim stated in the version each side would endorse (no strawmanning).
  3. **Cruxes**: For each case/argument, both sides' predictions, flagged if they agree.
  4. **Closing Section**: On which parts are merely verbal (e.g., whether "shared intention" is a psychological kind or a normative status).

  ---

  **Joint Statement on Collective Intentionality: Adversarial Collaboration Document**

  **Signed by:**
  [Priya, representing the non-reductionist Gilbert/Searle-inspired view]
  [Your Name, representing the reductionist Bratman-inspired view]

  ---

  **Section 1: Agreed Claims**

  We, the undersigned, agree on the following non-vacuous points regarding collective intentionality and joint action:

  1. **Folk-Psychological Ubiquity**: In everyday life, people routinely describe themselves as acting together in a "we" mode (e.g., "We are painting the house," "We are playing a duet"). These descriptions are not merely metaphorical; they reflect a genuine aspect of human social cognition and practice.

  2. **Normative Dimension**: Joint actions often involve expectations, entitlements, and obligations. For instance, if one person unilaterally abandons a joint project without warning, this typically warrants criticism (e.g., resentment from the partner, or even rebuke from third parties in some contexts). These normative features are part of the folk understanding of joint action.

  3. **Interdependence Requirement**: In paradigmatic cases of joint action, participants' intentions and actions are interdependent. Each adjusts their behavior in light of the other's actions and intentions, and each relies on the other to do so.

  4. **Common Knowledge Necessity**: For a joint action to occur, it is necessary that each participant has beliefs (or knowledge) about the other's intentions and actions, and that these beliefs are iterated (i.e., "I know that you know that I know..."). This common knowledge helps stabilize coordination.

  5. **The Role of Commitment**: Joint action involves a sense of commitment to the joint activity. This commitment is not reducible to a mere personal whim; it has a stability that persists through minor obstacles or temptations to defect.

  6. **The Reality of Joint Action Phenomena**: Both sides agree that joint actions (e.g., playing in an orchestra, walking together) are real phenomena in the world, not illusions. The disagreement concerns how to analyze the structure underlying these phenomena.

  ---

  **Section 2: Disagreements Table**

  The following table presents the core disagreements between the two views. Each claim is stated in the form endorsed by the respective side.

  | Disputed Point | Non-Reductionist View (Priya) | Reductionist View (You) |
  |----------------|--------------------------------|--------------------------|
  | **Nature of We-Intentions** | We-intentions are a primitive form of intentionality, not analyzable into individual I-intentions plus common knowledge. They involve a joint commitment that creates a new subject of intention ("we"). | We-intentions are fully analyzable into a complex of individual I-intentions (e.g., "I intend that we J"), meshing subplans, mutual responsiveness, and common knowledge of all this. There is no additional collective mental state. |
  | **Source of Obligation** | The obligations in joint action arise directly from the joint commitment itself. These obligations are distinct from ordinary moral obligations; they are owed to the "we" or to the other participants as co-committers. The joint commitment can only be rescinded jointly. | The obligations in joint action reduce to the interdependence of intentions and ordinary moral considerations (e.g., promissory, reliance-based, or associative obligations). If one person releases the other, the obligation dissolves without needing joint rescission. |
  | **Existence of Collective Subjects** | Joint commitment creates a "plural subject" that is the bearer of the intention and the source of obligation. This plural subject is a distinct social entity, not reducible to the individuals. | There are no collective subjects. All intentional states and obligations are held by individuals, though they may be about collective activities and involve interlocking intentions. |
  | **Minimal Requirements for Shared Intention** | Shared intention requires a communicative act (explicit or implicit) that establishes joint commitment. Without such mutual commitment, there is no shared intention. | Shared intention can arise without explicit communication, as long as there is mutual responsiveness and common knowledge of interlocking intentions. Common knowledge can emerge from situational cues. |
  | **Agency in Joint Action** | Genuine joint action requires that all participants be full-fledged agents capable of commitment and understanding obligations. Non-agents (e.g., AI tools) cannot be part of a joint action. | Joint action can involve non-agents as tools or mediators. What matters is the structure of the human participants' intentions and their responsiveness. Offloading tasks to non-agents doesn't negate joint action if humans retain core commitments. |

  ---

  **Section 3: Cruxes**

  The following cases and tests are presented as potential discriminators between the views. For each, we state both views' predictions. Where predictions agree, the crux is not probative.

  **Crux 1: The Laggy Duet**

  * **Case**: Two musicians in different cities play together over a 400ms delayed link. They compensate anticipatorily, plan takes together via chat, and sound cohesive, but cannot respond intra-phrase.  
  * **Question**: Is there a "we-intention" present? Must mutual responsiveness be real-time?  

  | View | Prediction |
  |------|------------|
  | Non-Reductionist | There is no genuine shared intention in the performance itself because real-time mutual responsiveness is essential for joint commitment. The planning phase might involve shared intention, but the performance is merely two parallel solos. |
  | Reductionist | There is shared intention because mutual responsiveness operates at the planning/take level, and anticipatory adjustments (based on common knowledge) suffice. The timescale of responsiveness can be flexible. |

  * **Agreement?**: No. The case discriminates: Non-reductionism requires real-time interaction; reductionism allows longer timescales.

  **Crux 2: The Unbriefed Choreography**

  * **Case**: Two strangers, who learned the same dance routine separately, recognize each other on a dance floor and begin adjusting mid-routine without prior communication.  
  * **Question**: Does this instantiate shared intention without prior mutual commitment?  

  | View | Prediction |
  |------|------------|
  | Non-Reductionist | No shared intention exists because there was no communicative act to establish joint commitment. The dancers are merely reacting to each other in parallel, not acting as a "we." |
  | Reductionist | Shared intention emerges spontaneously through mutual recognition, adjustment, and common knowledge of each other's intentions. No prior communicative act is necessary. |

  * **Agreement?**: No. The case discriminates: Non-reductionism requires explicit or implicit commitment; reductionism allows bootstrapping.

  **Crux 3: The Mixed Trio**

  * **Case**: Two humans and an AI assistant (LLM) plan a surprise party in a group chat. The AI tracks commitments, proposes times, and nudges flakers.  
  * **Question**: Is this a joint action? Does joint action require agency in all participants?  

  | View | Prediction |
  |------|------------|
  | Non-Reductionist | Not a genuine joint action because the AI, lacking agency and capacity for commitment, cannot be part of a plural subject. The humans might share intentions, but the AI is a tool. |
  | Reductionist | This is joint action between the humans. The AI is a tool mediating their intentions. Offloading doesn't negate joint action if humans interlock intentions and maintain responsiveness. |

  * **Agreement?**: No. The case discriminates on whether non-agents can be "participants."

  **Crux 4: The Silent Release Test**

  * **Test**: In an ongoing joint action (e.g., painting a house), one participant says to the other: "You're off the hook; don't worry about this."  
  * **Question**: Does the obligation to continue dissolve unilaterally, or must the commitment be rescinded jointly?  

  | View | Prediction |
  |------|------------|
  | Non-Reductionist | The release is invalid. Obligations from joint commitment can only be dissolved jointly. The released party may still feel obligated until mutual agreement. |
  | Reductionist | The release dissolves the obligation because obligations reduce to interpersonal reliance/assurance. The released party has no further reason to continue absent personal investment. |

  * **Agreement?**: No. The test discriminates on the source of obligations.

  **Crux 5: The Third-Party Rebuke Test**

  * **Test**: In a joint action (e.g., planning a community event), one participant bails without warning. An uninvolved third party (e.g., a neighbor) rebukes them.  
  * **Question**: Is the rebuke appropriate? Does it show the obligation is owed to a "we"?  

  | View | Prediction |
  |------|------------|
  | Non-Reductionist | Yes, the rebuke is appropriate. Joint commitment creates obligations to the plural subject, which third parties can recognize and enforce as members of the moral community. |
  | Reductionist | The rebuke is inappropriate unless the third party has a stake (e.g., affected by the failure). Obligations are owed to co-participants, not to a "we" or abstract collective. |

  * **Agreement?**: No. The test discriminates on the nature of obligations.

  ---

  **Section 4: On Verbal Disagreements**

  We agree that some of our disputes may stem from differing conceptions of the theoretical terms:

  - **"Shared Intention" as Folk Psychology vs. Normative Status**: The non-reductionist view often treats "shared intention" as a normative status within a social practice (e.g., creating obligations), while the reductionist view treats it as a psychological kind (a pattern of individual attitudes). This difference in focus may explain some disagreements without implying factual incompatibility.

  - **"We" as Primitive vs. Constructed**: The non-reductionist view's insistence on irreducible "we-intentions" may reflect the normative authority of joint commitments, while the reductionist view sees "we" as a useful shorthand for complex individual states.

  - **What Follows**: If the disagreement is partly verbal, we may converge by clarifying whether we are describing psychological mechanisms or normative structures. However, the cruxes above target substantive predictions about behavior and obligations, which remain empirical or normative disputes.

  ---

  **End of Document**
