  We identify one core verbal disagreement and its implications:  
  - **"Shared Intention" as Folk Psychology vs. Normative Status**:  
    - The reductionist view treats "shared intention" as a *psychological kind*: a pattern of individual attitudes describable by mature folk psychology.  
