prompt: |-
  I'm a backend engineer who has been sitting in on a philosophy of science reading group with a few friends, and I've gotten hung up on something I'd like analyzed properly. My understanding of Bayesian confirmation is the programmer's version: an agent with a prior over hypotheses, a likelihood function, and a stream of observations that get folded in by conditionalization. What I can't make sense of is the problem of old evidence, and the case I keep returning to is Einstein and the perihelion of Mercury. As I remember it (please don't let the analysis hinge on exact figures): by the later 19th century astronomers had an unexplained residual advance of Mercury's perihelion, on the order of tens of arcseconds per century, left over after all known planetary perturbations were subtracted; the live Newtonian-style explanations posited something unseen near the Sun, an inner planet or a cloud of orbiting matter; in 1915 the general theory of relativity appeared to produce roughly the right number from the theory itself with nothing tuned to fit; and a few years later eclipse measurements of starlight deflection gave a dramatic public confirmation. The puzzle as I've seen it stated is that if the Mercury residual was already known with probability one, then conditionalizing on it can't raise the probability of the new theory at all, yet it is universally treated as among the strongest reasons anyone had for taking general relativity seriously.

  What I want is a disciplined mapping rather than a restatement of the puzzle. Fix an agent and a hypothesis space and say which you've chosen and why: Einstein himself in 1915, a working astronomer of the period, or us now looking back — and, correspondingly, whether the alternatives on the table are general relativity versus Newtonian gravity plus an inner planet, versus Newtonian gravity plus solar-oblate or dust corrections, or something else. Then say precisely what the evidence proposition is supposed to be, since I think this is where the case is slipperier than it looks: the raw telescopic observations, the residual computed after subtracting perturbations under a particular model of the solar system, or the received summary figure that circulated in textbooks — these seem to have different novelty statuses, and I want to know which one the formalism is meant to take as E and what happens to the argument if you shift between them. Run the standard fixes against this case and tell me where each one breaks: the move where what you actually learn is not E but the fact that the new theory entails E; the move that appeals to whether the evidence was used in constructing the hypothesis rather than to when it was learned; the move that treats the change as a shift in the agent's whole probability assignment rather than as an observation. I'm especially interested in hearing what each of these says about the eclipse result, which looks like a clean new observation but which I suspect was in some ways weaker evidence than the Mercury figure, particularly given that Einstein had earlier published a different and smaller deflection value whose exact size I don't want to rely on.

  Let me also throw in my own attempt, which my friends were lukewarm about, so you can tell me whether it collapses into one of the standard views or does real work. I think of it as a dependency-graph edit rather than an update: the agent has a joint distribution over a theory, a pile of auxiliary assumptions, and the data, and before 1915 the Mercury residual was screened off from the theory of gravity by those auxiliaries, so the two were nearly independent; learning the derivation is not an observation arriving on a channel but a structural change that adds an edge, after which the same known datum becomes informative. Does that reproduce the intuition that Mercury confirmed general relativity, and does it over-generate, letting any newly derived fact confirm any theory that derives it? Does it handle the fact that the received value of the residual was itself revised across decades, so that what counted as "the" old datum was not quite constant? And in the other direction: is this episode an anomaly for Bayesian confirmation theory, a case the framework was never built for, or a pseudo-problem that only looks like one because we've misidentified what the agent learned? I'd rather you say where the framework is genuinely silent than force it to deliver a verdict. Please also flag, for each substantive claim you make, how confident you are in it, and single out the one point in your answer you are least sure of.
reasoning: |-
  We are going to analyze the problem of old evidence in the context of the perihelion advance of Mercury and Einstein's general relativity (GR). We'll break down the problem step by step, as requested.

  ### Step 1: Setting the Agent and Hypothesis Space

  We'll consider three agents for clarity, but focus on the one that best illuminates the problem:

  1. **Einstein in 1915**: He knows about the Mercury anomaly and has just completed GR. He is considering GR vs. the then-existing Newtonian models (with auxiliaries like Vulcan or solar oblateness). However, note that Einstein was developing GR and might have been influenced by the Mercury problem. We must be cautious about whether the evidence was used in constructing the theory.

  2. **A contemporary astronomer (say, in 1915)**: This agent knows the Mercury anomaly (as a well-established residual) and the existing Newtonian models. For this agent, GR is a new and radical theory. The alternatives are:
     - Newtonian gravity plus an inner planet (Vulcan)
     - Newtonian gravity plus a solar oblateness or dust ring
     - GR (with no extra parameters for this anomaly)

  3. **Us now**: We know GR has been confirmed by multiple independent tests. The Mercury anomaly is just one of many. The alternatives are not live in the same way (Newtonian gravity is known to be false). This perspective is less useful for the problem of old evidence because the evidence is not only old but also already explained.

  **Our choice**: We focus on the **astronomer in 1915** because the problem of old evidence is most acute for an agent who already knows E (the Mercury residual) and then encounters a new theory H (GR) that entails E. For this agent, the prior probability of E is 1 (since it's known), so P(E) = 1. Then, if H entails E, we have P(E|H) = 1. The standard Bayesian update rule for confirmation is:

     P(H|E) = [P(E|H) * P(H)] / P(E) = [1 * P(H)] / 1 = P(H)

  So the posterior probability of H is the same as the prior. Hence, E does not confirm H.

  But intuitively, the Mercury residual was a strong confirmation of GR. This is the puzzle.

  ### Step 2: Identifying the Evidence Proposition E

  The evidence E is not a simple observation. We must be precise:

  - **Raw telescopic observations**: These are the positions of Mercury over time. But these are not directly the residual. The residual is computed by taking the observations and subtracting the effects of known perturbations (other planets, etc.) using Newtonian models. This subtraction requires a complex model (the solar system model) and auxiliary assumptions (A).

  - **The computed residual**: This is the 43 arcseconds per century (approx) that remains unexplained. This is the figure that was known to astronomers and Einstein. However, note that this residual depends on the solar system model (auxiliaries) used to compute it.

  - **The received summary figure**: The number that was in textbooks and known to the community. This figure might have been revised over time as the solar system model was refined.

  **Our choice**: The relevant E for the confirmation of GR is the **computed residual** (about 43 arcseconds per century). This is because the raw data does not directly show the anomaly without processing, and the received figure is just a report of that computed residual.

  But note: The computed residual E is a function of both the raw data and the auxiliary assumptions (A) used in the Newtonian model. If the auxiliaries are wrong, then E might be incorrect.

  ### Step 3: Standard Fixes and Their Application

  We consider three standard fixes for the problem of old evidence:

  #### Fix 1: Learning that H entails E (not learning E)

  The idea: When GR is presented, the agent learns not E (which they already know) but that GR entails E. So the evidence is actually the proposition: "H entails E" (call this proposition T). Then we update on T.

  So we have:

     P(H|T) = P(T|H) * P(H) / P(T)

  But note: If H entails E, then P(T|H) = 1 (because if H is true, then H does entail E). However, P(T) is not 1 because before knowing T, the agent might have thought that H does not entail E (if they didn't know the derivation).

  In 1915, before the derivation, an astronomer might have assigned a low probability to T (that GR entails the Mercury residual) because GR was complex and the derivation non-trivial. So when they learn T (that GR does entail the residual), that can raise the probability of H.

  **Application to Mercury**: The astronomer in 1915 knows E (the residual) and is considering H (GR). Initially, they don't know whether GR can explain E. When they learn that GR does explain E (i.e., they learn T), that is new evidence. So we update on T.

  This update can confirm H because P(T|H) is 1 and P(T) is less than 1. Specifically, P(T) = P(T|H)*P(H) + P(T|~H)*P(~H). Since P(T|H)=1, we have:

     P(H|T) = [1 * P(H)] / [P(H) + P(T|~H)*P(~H)]

  This is greater than P(H) if P(T|~H) < 1. That is, if there is a chance that without GR being true, GR might not have entailed E, then P(T|~H) < 1. But note: T is a logical fact. How can we assign a probability less than 1 to a logical truth?

  This fix runs into the problem of logical omniscience: Bayesian agents are assumed to know all logical truths. But in reality, we are not omniscient. So we can relax the assumption and allow that the agent doesn't know all logical consequences. Then T is not a logical truth to the agent until it is proven.

  **Confidence**: This fix is promising and widely discussed (e.g., by Garber). We are fairly confident in it. However, it requires abandoning logical omniscience, which is a standard idealization.

  #### Fix 2: Whether the evidence was used in constructing H

  The idea: If the evidence E was used in constructing H, then it cannot confirm H (because of circularity). But if E was not used, then even if old, it can confirm.

  In the Mercury case: Did Einstein use the Mercury residual to construct GR? The historical record is mixed. Einstein was aware of the anomaly and was motivated by it. However, the derivation of the perihelion advance was a consequence of the field equations he had already derived. He did not adjust GR to fit the Mercury number. In fact, when he first computed the advance and got roughly the right number, he was ecstatic because it was a prediction.

  For the astronomer in 1915, they learn that GR was not built to fit E (if they believe that). So the agent might update their belief about the independence of H and E.

  But how to formalize? We might model the agent's belief about whether E was used. However, this is a historical fact about the theory construction and might be hard to assign probabilities.

  **Application**: We might introduce a proposition U: "H was constructed using E". Then if the agent learns ~U (that H was not constructed using E), that might make E more surprising under H and hence confirmatory. However, without U, we are back to the original problem.

  Alternatively, we might think that if the agent believes H was not constructed to fit E, then P(E|H) is not artificially high. But if E is old, P(E)=1, so again no update.

  This fix is less straightforward and might collapse into the first fix (because learning that H entails E and that it was not built for E might be part of the same learning).

  **Confidence**: We are less confident in this fix as a standalone solution. It seems to require additional structure.

  #### Fix 3: Change in the agent's entire probability assignment (not conditionalization)

  The idea: The agent doesn't conditionalize on E but instead revises their entire probability assignment because they have a new understanding of the connections. This is sometimes called a "logical learning" or "conceptual change".

  In the Mercury case: Before the derivation, the agent had a probability distribution where E was known and H was unrelated. After the derivation, the agent sees a logical connection. This changes the conditional probabilities. In particular, the agent now sets P(E|H)=1 (if they are certain of the derivation) and also might change P(E|~H) because they see that alternative theories (without the connection) are less likely to explain E.

  But note: In the standard Bayesian framework, conditional probabilities are fixed by the joint distribution. So this change is not an update by conditionalization but a change of the probability function itself.

  **Application**: The agent moves from an old probability function P_old to a new one P_new. In P_old, E and H are independent (or nearly so). In P_new, because of the logical connection, they are dependent. Then, even though E is old, the fact that in P_new we have P_new(H|E) > P_old(H) (because the dependence now makes H more likely given E) might be seen as confirmation.

  This is similar to the dependency-graph edit you proposed.

  **Confidence**: This is a non-Bayesian (in the strict sense) solution because it violates the standard update. It is more radical. We are moderately confident that it captures the intuition, but it is less formal.

  ### Step 4: Your Dependency-Graph Edit Proposal

  You propose:

  > the agent has a joint distribution over a theory, a pile of auxiliary assumptions, and the data, and before 1915 the Mercury residual was screened off from the theory of gravity by those auxiliaries, so the two were nearly independent; learning the derivation is not an observation arriving on a channel but a structural change that adds an edge, after which the same known datum becomes informative.

  This is a graphical model view. Let:

  - H: the theory of gravity (GR or Newtonian)
  - A: auxiliary assumptions (solar system model, etc.)
  - E: the Mercury residual

  Before 1915, the agent's model might be:

     Newtonian gravity (H0) and auxiliaries A -> E

  But note that H0 (Newton) plus A (with Vulcan or without) implies a value for E. The residual E is the difference between observation and prediction. So if the prediction is H0+A, then E is a deterministic function of H0 and A and the raw data.

  In the Bayesian network, we might have:

     Raw Data -> E
     H0, A -> Prediction
     Prediction, Raw Data -> E (as residual)

  But for the agent, E is observed (so fixed). Now, when GR (H1) is introduced, the derivation shows that H1 (without any extra Vulcan) implies E. So we add an edge:

     H1 -> E

  Now, in the new graph, E depends on H1. So when E is fixed, it can influence H1.

  But note: The agent already knows E. So we are conditioning on E. In the old graph, H1 was independent of E? Not necessarily. The agent might have thought that if H1 were true, then E would be different? But they didn't have a derivation.

  So the key is that without the derivation, the agent does not know how H1 relates to E. Therefore, in the old graph, there was no edge from H1 to E. After the derivation, there is an edge. This changes the conditional independence.

  Now, we can represent the agent's uncertainty about the connection by having a node for whether H1 entails E (T). Then:

     H1, T -> E

  But if T is false, then H1 might not affect E. So before learning T, the agent has a distribution over T (with P(T) being low). Then learning T (that T is true) updates the distribution.

  This brings us back to Fix 1.

  **Does your proposal reproduce the intuition?** Yes. The Mercury residual becomes informative about GR after the derivation because the dependency is established.

  **Does it over-generate?** It might. Suppose an agent has an old fact E and then someone derives E from a crazy theory H. Should that confirm H? Only if the agent didn't expect H to entail E. But if the agent thought it was impossible for H to entail E, then learning that it does would be surprising and confirmatory. However, if the agent can arbitrarily add such edges, then any theory could be confirmed by any old evidence. We need constraints on when the edge can be added.

  The constraint is that the derivation must be logically valid and the agent must accept it. This is a non-probabilistic constraint. So the agent doesn't arbitrarily add edges but only when they learn a new logical truth (which they were previously unaware of). This avoids over-generation.

  **What about the fact that the residual was revised?** The computed residual E depends on the auxiliaries A. Over time, as A are refined, E might change. For example, in the late 19th century, the residual was about 38 arcseconds, and then it was refined to 43. So when we say "the old evidence", we must be careful about which E we mean.

  In 1915, the agent uses the then-current best estimate of E (about 43 arcseconds). The derivation in GR gave about 43 arcseconds. So E is the 43 arcsecond figure.

  But note: The agent might be uncertain about E? They might assign a probability distribution over the possible values of the residual. Then, when GR predicts exactly 43, that might be more surprising than if they had taken E as known with certainty.

  In fact, if E is not known with probability 1, then conditionalization works normally. The problem of old evidence arises because E is taken as certain. But if the agent is uncertain about E, then the standard update applies.

  However, in the Mercury case, the 43 arcseconds was accepted. So we assume P(E)=1.

  But the fact that E was revised over time suggests that even "old" evidence might have some uncertainty. This might dissolve the problem: if the agent assigns P(E)<1, then when GR predicts E, it gets confirmed.

  **Confidence in your proposal**: We are moderately confident. It is similar to Fix 1 and Fix 3. It avoids the problem by making the connection between H and E uncertain until the derivation is known. However, it requires modeling the agent's ignorance of logical relationships.

  ### Step 5: The Eclipse Result

  The 1919 eclipse measured the deflection of starlight by the Sun. The result was in line with GR (about 1.75 arcseconds) and not with Newton (which predicted half that, or 0.87, if we consider only the equivalence principle, but in full GR it's 1.75). This was a new observation.

  For any agent, this is new evidence. So there is no problem of old evidence.

  But note: There was an earlier episode. In 1911, Einstein had predicted a deflection of 0.87 arcseconds (based on the equivalence principle alone). Then in 1915, he corrected it to 1.75. So when the 1919 measurement was made, it was testing the 1915 theory.

  For the agent in 1919, the evidence E_eclipse is new. So:

     P(GR | E_eclipse) > P(GR)

  This is a standard update.

  However, we can ask: why is the Mercury residual considered stronger? One reason might be that the Mercury residual was a precise number that was unexplained and then explained by GR without tuning. The eclipse measurement was also important, but it had larger error bars and there were initial concerns about the data. But historically, both were crucial.

  In terms of confirmation, the Mercury anomaly was a problem that had resisted solution for decades, so solving it was a major point in favor of GR.

  ### Step 6: Is this an anomaly for Bayesianism?

  We think it is a challenge but not an insurmountable one. The problem arises because of two idealizations:

  1. Logical omniscience: Real agents are not logically omniscient.
  2. Certainty about evidence: Real agents might not assign probability 1 to any evidence.

  Relaxing either of these allows a Bayesian account to handle the case.

  The most common solution in the literature is to relax logical omniscience (Fix 1). We think that is the best approach.

  ### Summary of Key Points

  - **Agent choice**: Astronomer in 1915.
  - **Hypotheses**: GR vs. Newtonian gravity with auxiliaries (Vulcan, solar oblateness, etc.).
  - **Evidence E**: The computed residual of about 43 arcseconds per century.
  - **Standard fixes**:
     - Fix 1 (learning that GR entails E) works by relaxing logical omniscience. We are fairly confident.
     - Fix 2 (whether evidence was used) is less clear and might not be sufficient on its own.
     - Fix 3 (change of probability function) is radical but intuitive.
  - **Your proposal**: It is essentially Fix 1 and/or Fix 3. It works by modeling the agent's uncertainty about the logical connection. It does not over-generate if we require the derivation to be valid and learned. We are moderately confident.
  - **Eclipse result**: It was new evidence and not subject to the old evidence problem.
  - **Anomaly for Bayesianism?**: Not fatal. The problem can be handled by relaxing idealizations (logical omniscience or certainty about evidence).

  **Least confident point**: We are least confident about the historical claim that the agent (astronomer in 1915) assigned probability 1 to E (the residual). There might have been some uncertainty about the exact figure or the auxiliaries used to compute it. But even a small uncertainty would make conditionalization work. However, the problem of old evidence is usually posed when E is taken as certain. We stick to that for the puzzle.
answer: |-
  Below is a disciplined mapping of the problem of old evidence using the Mercury perihelion and general relativity (GR) case. I'll address your questions systematically, specifying the agent, hypothesis space, evidence proposition, and evaluating standard fixes and your dependency-graph proposal. I'll flag confidence levels for key claims and identify my least confident point.

  ### **1. Agent, Hypothesis Space, and Evidence Proposition**
  #### **Agent Choice: Einstein in 1915**
  - **Why this agent?** Einstein is the ideal focus because:  
    (a) He was aware of the Mercury anomaly before finalizing GR (so it was "old evidence").  
    (b) The historical record shows he derived the perihelion prediction *after* developing the GR field equations, treating it as a test.  
    (c) His cognitive state reveals the puzzle: how could known evidence confirm a new theory?  
    *Confidence: High (supported by Einstein's letters and historical accounts).*

  #### **Hypothesis Space**
  - **Relevant alternatives in 1915**:  
    - \( H_1 \): General Relativity (no new parameters).  
    - \( H_2 \): Newtonian gravity + Vulcan (unobserved inner planet).  
    - \( H_3 \): Newtonian gravity + solar oblateness/circumsolar dust.  
    - \( H_4 \): Newtonian gravity + unmodeled perturbations (e.g., computational errors).  
  - **Why these?**  
    \( H_2 \) and \( H_3 \) were the live explanations pre-1915. \( H_4 \) captures uncertainty in auxiliary assumptions. GR (\( H_1 \)) is a radical alternative.  
    *Confidence: High (based on 19th-century astronomy literature).*

  #### **Evidence Proposition \( E \)**
  - **Definition**: \( E \) = "Mercury's perihelion advance residual is \(\approx 43''\) per century after subtracting all *known* Newtonian perturbations."  
  - **Why this \( E \), not raw data or textbook summaries?**  
    - Raw telescopic data was processed through complex celestial mechanics models (auxiliary assumptions \( A \)) to produce \( E \).  
    - Einstein (and astronomers) treated \( E \) as a fixed, known value (Le Verrier's 1859 calculation, refined to \( 43'' \) by Newcomb in 1882).  
    - The "novelty" issue: For Einstein, \( E \) was *epistemically old* (known with high certainty) but *explanatorily novel* for GR.  
    - Shifting to raw data or revised figures complicates the case:  
      - Raw data alone doesn't isolate the anomaly (depends on \( A \)).  
      - Post-1915 revisions (e.g., \( 43'' \rightarrow 42.98'' \)) are irrelevant for 1915 agents.  
    *Confidence: High for \( E \) as the residual; moderate for rejecting alternatives.*

  ---

  ### **2. Standard Fixes Applied to the Case**
  #### **Fix 1: Learning \( H \vdash E \) (not \( E \))**
  - **Mechanism**: The agent learns the proposition \( T \): "GR entails \( E \)" (i.e., \( H_1 \vdash E \)).  
  - **Bayesian update**:  
    Prior: \( P(H_1) \) (low for a radical theory).  
    Likelihood: \( P(T \mid H_1) \approx 1 \) (if GR is true, it must entail \( E \)).  
    Marginal: \( P(T) = P(T \mid H_1)P(H_1) + P(T \mid \neg H_1)P(\neg H_1) \).  
    Since \( P(T \mid \neg H_1) < 1 \) (it was unclear if any \( H_{2-4} \) could explain \( E \)), and \( P(T) \) is small pre-derivation, \( P(H_1 \mid T) > P(H_1) \).  
  - **Why it works for Mercury**:  
    Einstein didn't know GR entailed \( E \) until he computed it in 1915 (his "heart palpitations" moment). Learning \( T \) was new evidence.  
  - **Breakdown**:  
    - Logical omniscience: Requires agents to be ignorant of logical consequences (controversial in Bayesianism).  
    - Over-generates? If \( T \) is learned for *any* \( H \) that entails \( E \), even ad hoc theories, confirmation occurs. But in practice, \( P(T \mid \neg H_1) \) is low only for plausible rivals (e.g., \( H_2 \) never entailed \( E \) convincingly).  
    *Confidence: High for this fix in Mercury case; moderate for avoiding over-generation.*

  #### **Fix 2: Evidence Used in Construction**
  - **Mechanism**: Confirmation depends on whether \( E \) was used to build \( H \). If not, \( E \) can confirm \( H \) even if old.  
  - **Application to Mercury**:  
    Einstein did not tune GR to fit \( E \)—he derived field equations independently and *then* computed perihelion motion. Historically, \( E \) motivated him but didn't constrain GR's mathematical structure.  
  - **Breakdown**:  
    - Subjective: Agents may not know if \( E \) was used (e.g., astronomers in 1915 might suspect Einstein "cooked" GR for \( E \)).  
    - Fails for eclipse test: The 1919 light-bending measurement (\( E_{\text{eclipse}} \)) was not used in constructing GR, making it "cleaner" than Mercury. Yet Mercury was seen as stronger evidence because:  
      - \( E_{\text{eclipse}} \) had large observational errors (initially \( 1.61'' \pm 0.30'' \) vs. GR's \( 1.75'' \)), while \( E \) was precise.  
      - Einstein had earlier published a wrong deflection (\( 0.83'' \) in 1911), weakening \( E_{\text{eclipse}} \)'s impact.  
    *Confidence: Moderate (historical intent is fuzzy); low for formalizing probabilistically.*

  #### **Fix 3: Shifting Probability Functions**
  - **Mechanism**: The agent doesn't conditionalize on \( E \); instead, learning GR's derivation *changes* their probability function (e.g., by altering dependencies).  
  - **Application**:  
    Pre-1915: \( P(E \mid H_1) \) is undefined or low (no link between GR and Mercury).  
    Post-derivation: New function \( P' \) with \( P'(E \mid H_1) = 1 \), making \( P'(H_1 \mid E) > P(H_1) \).  
  - **Breakdown**:  
    - Non-Bayesian: Violates standard conditionalization (requires radical framework changes).  
    - Eclipse test: Works cleanly here (new observation), but Mercury's shift feels ad hoc.  
    *Confidence: Low (underdeveloped in literature; hard to formalize).*

  ---

  ### **3. Your Dependency-Graph Edit Proposal**
  #### **Mechanism**
  - Pre-1915: \( E \) (Mercury residual) is screened off from \( H_1 \) (GR) by auxiliary assumptions \( A \) (celestial mechanics models). Graph: \( H_1 \perp\!\!\!\perp E \mid A \).  
  - Post-derivation: Adding an edge \( H_1 \rightarrow E \) makes \( E \) and \( H_1 \) dependent. Now, known \( E \) raises \( P(H_1 \mid E) \).  

  #### **Evaluation**
  - **Reproduces intuition?** Yes:  
    - Pre-1915, \( E \) is explained by \( A \) under Newtonian \( H_{2-4} \) (e.g., Vulcan or oblateness).  
    - Post-derivation, \( E \) is directly explained by \( H_1 \) *without* auxiliaries, increasing \( H_1 \)'s credibility.  
  - **Over-generation?** Not if constrained:  
    - Adding edges requires a valid derivation (not arbitrary). Einstein's was non-trivial and explanatory.  
    - Bayesian networks naturally penalize ad hoc theories (e.g., \( P(T \mid \neg H_1) \) remains low).  
  - **Handles revised \( E \)?** Partially:  
    - The graph edit applies to the agent's *current* \( E \) (e.g., 1915's \( 43'' \)). If \( E \) is revised (e.g., to \( 42.98'' \)), it becomes new evidence \( E' \), and conditionalization works normally.  
    - However, dependency shifts might still apply if the *type* of evidence (perihelion residual) is connected to \( H_1 \).  
  - **Eclipse test**: Unaffected—no structural change needed since \( E_{\text{eclipse}} \) was always a direct test of GR.  

  #### **Confidence and Limitations**  
  - *Strength*: High for capturing the mechanistic change; avoids logical omniscience.  
  - *Weakness*: Requires agents to know which dependencies to add (may not be obvious).  
  - *Relation to standard views*: Blends Fix 1 (learning \( T \) adds the edge) and Fix 3 (structural change).  

  ---

  ### **4. Is This a Pseudo-Problem or Framework Limitation?**
  - **Not an anomaly for Bayesianism**: The framework can handle it by:  
    - Rejecting logical omniscience (Fix 1 and your proposal).  
    - Recognizing that "known" evidence may have residual uncertainty (e.g., if \( P(E) < 1 \), conditionalization works).  
  - **Not a pseudo-problem**: The intuition that Mercury confirmed GR is robust. The issue arises from misformalizing "learning" (e.g., treating \( E \) as certain) or ignoring cognitive changes (derivations as structural updates).  
  - **Where the framework is silent**:  
    - How to formalize "discovering" logical relationships (Fix 1 and your proposal are patches).  
    - How to weight explanatory virtues (e.g., GR solved Mercury *without* auxiliaries, unlike Newtonian rivals).  

  #### **Least Confident Point**  
  - **Claim**: "The dependency-graph edit avoids over-generation because derivations must be valid and non-ad hoc."  
  - **Why low confidence**: It relies on agents' subjective assessment of what counts as a "valid" derivation (e.g., would a contrived theory deriving \( E \) be discounted via \( P(T \mid \neg H_1) \)?). Historical cases (e.g., Lorentz vs. Einstein) show this is messy.  

  ---

  ### **Conclusion**  
  For **Einstein in 1915**, the Mercury residual \( E \) (\(\approx 43''\)) confirmed GR because learning that GR entailed \( E \) (Fix 1) or adding a dependency (your proposal) raised its probability, despite \( E \) being old. The **eclipse test** was weaker due to initial errors and Einstein's earlier mistake, but it avoided old-evidence issues by being novel. **Bayesianism succeeds** if it rejects logical omniscience or formalizes structural learning; it struggles only if it insists on idealized agents. Your dependency-graph proposal is a viable, intuitive fix that mirrors cognitive processes and handles evidence revisions pragmatically.
