prompt: |-
  I'm in a reading group on social ontology and we keep using the phrase *X is socially constructed* as either a conversation stopper or a magic wand: someone says it and everyone acts as if we've thereby learned both that the kind isn't real and that we'd be justified in abolishing, reforming, or re-registering it. Before I read any more of the accounts people actually defend, I want the spec. So: write me the desiderata that a theory of social construction has to meet, where the point of the theory is fixed as follows — it has to tell us what follows, practically and normatively, from *K is socially constructed* for some kind K (gender markers on passports, race as a variable in medicine, disability and accommodation duties, money, professional credentials, refugee status), and it has to do that without either collapsing into *nothing is real* or into *everything is*.

  I want the criteria with the case or consideration welded onto each one, and I want you to be strict about what the list has to contain. Some things I think it has to handle, but you tell me which are real requirements and which are just the prejudices of one camp: the triviality controls (having DNA, being two metres tall, and my favourite borderline, *planet*, which famously got redefined by a vote), the paradigm cases (money, where the kind is obviously invented and yet has all the causal force in the world), the opt-out asymmetry (you can't simply declare your race in the way you can apparently declare your gender, and I want to know whether a good account has to explain that or gets to treat it as someone else's problem), the looping cases (psychiatric and personality kinds, where classifying people changes the people classified), the cases where the extension shifts under social pressure without anyone deciding (who counts as white, or as disabled, or as speaking a language rather than a dialect), and the ones where the classification has legal and life-or-death stakes (unemployment statistics, refugee status). I also want the distinctions it isn't allowed to blur: kind versus concept versus property versus fact, constructed versus merely caused, constructed versus false, and the level problem of whether it's the kind that's constructed or only particular applications of it. And there's one distinction my friend and I invented that I'd like you to test rather than humour: call a kind *anchored* if there's some non-social property it tracks imperfectly but not accidentally, *floating* if there's nothing at all it tracks, and *self-verifying* if classifying someone as a member brings the tracked property into existence — we couldn't decide whether kinds can move between these categories over time, or be in two of them at once, or whether the three-way scheme is just a bad re-description of something the literature already has. Does an adequate theory have to take a stand on it?

  Two more things I care about more than the scoring. First: which pairs of desiderata on your list are probably not jointly satisfiable, and if the list as a whole can't be met, which single requirement should be dropped and what does dropping it cost you — I suspect there's a tension between *must be non-trivial, i.e. must rule things like kidneys and DNA out* and *must cover everything we have the intuition is constructed*, and another between *must be action-guiding* and *must be purely descriptive*. Second: which one requirement does the most work in excluding candidate theories, i.e. which demand, if you enforced only it, would knock out most of what's on offer? I'd also like you to consider two requirements I'm not sure are legitimate and tell me if they're category errors: the *abolition requirement* (if K is constructed, the theory should say what abolishing K would consist in, and whether abolishing the kind is the same as abolishing the practice) and the *reflexivity requirement* (the theory should say what happens to K when the claim that K is constructed becomes widely believed, since that belief itself changes the practices — tell me whether demanding this is demanding something incoherent). Then, briefly and last, run three familiar styles of account against the list — the collective-acceptance / status-function picture, the view that constructions are definitions chosen for a political purpose, and the looping / people-change-under-classification picture — but keep that to a few lines each; the list is the deliverable, not the scoreboard.
reasoning: |-
  Okay, let me tackle this user's query. They're in a reading group on social ontology and frustrated with how "X is socially constructed" is used as a conversation stopper or magic wand. They want desiderata for a theory that explains what normatively and practically follows from something being socially constructed, without collapsing into "nothing is real" or "everything is." 

  First, I need to identify all the cases they mentioned: triviality controls (DNA, height, planets), paradigms (money), opt-out asymmetry (race vs. gender), looping (psychiatric kinds), shifting extensions (whiteness, disability), high-stakes classifications (refugee status). Plus, distinctions like kind vs. concept, constructed vs. merely caused, and their anchored/floating/self-verifying categories.

  The user also wants to know which desiderata might conflict. For example, non-triviality (excluding kidneys) vs. inclusivity (covering all constructed things) could clash. Action-guiding vs. descriptive purity might conflict since the former requires normative force while the latter avoids it. 

  I should consider their additional requirements: abolition (what abolishing K entails) and reflexivity (how belief in construction affects K). Are these legitimate? Abolition might be necessary for practical relevance, but theories might not inherently prescribe abolition. Reflexivity is crucial for looping kinds but maybe not all, so it could be a corollary.

  Their three-way distinction (anchored, floating, self-verifying) needs evaluation. Is it a useful innovation or redundant? The theory must handle cases that fit these categories but doesn't necessarily need to adopt the framework if existing terms suffice. However, explaining transitions between categories (like disability becoming anchored due to technology) is important.

  Now, structuring the desiderata. Each should have a case attached. Start with metaphysical grounding to avoid everything/nothing collapses, using DNA and money. Then non-collapse requirement with planets. Ontological level distinction for race as a kind vs. applications. Practical potency with money's causal power. Opt-out asymmetry using gender markers. Dynamic calibration for shifting racial categories. Looping effects with psychiatric diagnoses. High-stakes implications for refugee status. Anchoring cases like disability. Distinctions between constructed vs. false (gender identity) and constructed vs. contingent (professional credentials).

  Assessing conflicts: Non-triviality vs. inclusivity might not be jointly satisfiable if paradigms like money are clear but borderline cases blur lines. Action-guiding vs. descriptive purity is a bigger tension; adding normative force might compromise objectivity. The most exclusionary requirement is probably non-collapse since many theories either overextend or undermine reality.

  For the three-way distinction, it's useful but not mandatory. The theory should explain how some kinds track non-social properties (anchored), others don't (floating), and some create the property (self-verifying). Transition between categories should be possible, like sexuality shifting with medicalization.

  Abolition requirement: Legitimate as it addresses practical consequences. Reflexivity: Necessary, especially for looping kinds, so it's valid.

  Finally, briefly testing existing theories: Collective acceptance (Searle) handles money well but might struggle with opt-out asymmetry. Political purpose accounts explain race in medicine but could over-politicize. Looping accounts (Hacking) fit psychiatric kinds but may not cover all constructions. Each will falter on different desiderata, like dynamic calibration or non-collapse.
answer: |-
  Here is a strict specification of desiderata for a theory of social construction, designed to meet your stated goal: explaining the practical/normative implications of "*K* is socially constructed" for a kind *K*, while avoiding nihilism ("nothing is real") and triviality ("everything is constructed"). Each desideratum is welded to a case or distinction, with conflicts and critical tests noted.

  ---

  ### **Core Desiderata for a Theory of Social Construction**
  1. **Non-Collapse Requirement (Metaphysical Grounding)**  
     *Must distinguish socially constructed kinds from both mind-independent natural kinds (e.g., DNA) and purely arbitrary fictional kinds (e.g., unicorns).*  
     **Case:** DNA (excluded) vs. money (included). A theory must show why money is "real" in its effects despite being constructed, while DNA is not constructed.  
     **Distinction:** Constructed vs. *merely caused* by social factors (e.g., "being two metres tall" is socially relevant but not constructed).

  2. **Non-Triviality Requirement (Exclusion of Paradigm Non-Constructed Kinds)**  
     *Must exclude kinds whose existence and properties are fixed by mind-independent physical laws.*  
     **Case:** Kidneys or planetary orbits (excluded). *Planet*’s redefinition via vote demonstrates *classification* is constructed, but the underlying astronomical phenomena are not. The theory must clarify this layer distinction.

  3. **Ontological Level Distinction**  
     *Must specify whether construction applies to the kind itself, the concept, the property, or token instances.*  
     **Case:** Race as a variable in medicine. If only the *concept* of race is constructed, but biological variation is real, this has different normative implications (e.g., reforming categories vs. abandoning them) than if the *kind* is constructed.

  4. **Practical Potency Condition**  
     *Must explain how constructed kinds acquire causal power despite their origin in human practices.*  
     **Case:** Money. A theory must account for its capacity to cause inflation, poverty, or market crashes, without treating it as an illusion.

  5. **Opt-Out Asymmetry Test**  
     *Must explain why some constructed kinds permit individual opt-out/reclassification (e.g., gender) while others resist it (e.g., race or refugee status).*  
     **Case:** Gender markers on passports (often mutable) vs. race (typically immutable by declaration). The theory must link this to features of the construction process (e.g., institutional enforcement vs. embodied perception).

  6. **Dynamic Calibration Condition**  
     *Must account for kinds whose extensions shift without explicit redefinition, via social negotiation or changing practices.*  
     **Case:** "Who counts as white?" or "What counts as a disability?" (e.g., changing thresholds for insulin resistance as "diabetes").  
     **Distinction:** Constructed vs. *contingent*; shifts must arise from *social feedback*, not brute facts.

  7. **Looping Effect Integration**  
     *Must explain kinds where classification alters the classified, creating feedback loops.*  
     **Case:** Psychiatric diagnoses (e.g., ADHD) or personality traits (e.g., "introversion"). Classifying someone as "ADHD" changes their behavior, access to medication, and self-conception.

  8. **High-Stakes Normative Binding**  
     *Must derive practical implications for kinds with legal, moral, or survival consequences.*  
     **Case:** Refugee status or unemployment statistics. The theory must show how construction grounds duties (e.g., accommodations for disability) or justifies reform/abolition.

  9. **Anchoring/Floating/Self-Verifying Distinction (User-Scheme Test)**  
     *Must engage with whether a kind tracks a non-social property ("anchored"), tracks nothing ("floating"), or creates the tracked property via classification ("self-verifying").*  
     **Case:** Disability is *anchored* if tracking bodily impairment; *self-verifying* if "disabled" status creates barriers (e.g., stairs where ramps could exist). Race may shift between categories (e.g., from "anchored" by biology in 19th c. science to "floating" in modern anti-realist views). The theory must allow for category fluidity but need not adopt this exact schema if it captures the dynamics.

  ---

  ### **Forbidden Blurs (Required Distinctions)**
  - **Kind vs. Concept vs. Property:**  
    *Case:* "Gender" as a kind (social role) vs. concept (cultural understanding) vs. property (identity).  
  - **Constructed vs. False:**  
    *Case:* "Gender identity is constructed" does not imply it is *false*; it may be experientially real.  
  - **Constructed vs. Contingent:**  
    *Case:* Professional credentials are contingent on social systems but *constructed* via explicit rules.

  ---

  ### **Conflict Analysis & Tradeoffs**
  - **Non-Triviality vs. Inclusivity:**  
    To exclude DNA/planets, the theory risks undergenerating (e.g., is "height" excluded if socially salient?). **Cost of dropping Non-Triviality:** Trivializes "constructed" (planets become candidates).  
  - **Action-Guiding vs. Descriptive Purity:**  
    Normative implications (e.g., "abolish K") may require moral premises beyond ontology. **Cost of dropping Action-Guiding:** Fails your core goal of practical relevance.  
  - **Most Exclusionary Desideratum:** **Non-Collapse Requirement**. Most theories fail by overextending (e.g., "all knowledge is constructed") or reducing social facts to brute biology (e.g., race "realism").

  ---

  ### **Legitimacy Tests for Your Added Requirements**
  - **Abolition Requirement:** *Legitimate*. A theory must specify what "abolishing K" entails (e.g., ending passport gender markers vs. eradicating gender concepts). Distinguishing abolishing the *kind* from the *practice* is essential (e.g., money vs. monetary systems).  
  - **Reflexivity Requirement:** *Legitimate and necessary*. Theories must handle cases where widespread belief in construction alters K (e.g., psychiatric diagnoses become contested, changing patient behavior). Not incoherent—it tests dynamic calibration.

  ---

  ### **Brief Theory Audits vs. Desiderata**
  1. **Collective Acceptance/Status-Function (Searle):**  
     *K* exists by collective agreement assigning status-functions ("X counts as Y in C").  
     **Falters on:** Opt-out asymmetry (why can't I declare my race?), dynamic calibration (shifts without "agreement"), and looping (agreement doesn't explain feedback effects).  

  2. **Political-Purpose Definitions:**  
     *K* is defined to serve power interests (e.g., race in medicine).  
     **Falters on:** Non-collapse (can't explain money's causal power), triviality (overincludes e.g., "height" if politicized), and self-verifying kinds (political intent ≠ outcome).  

  3. **Looping/Kinds That Make Themselves True (Hacking):**  
     *K* alters people to fit its classification.  
     **Falters on:** Non-looping cases (e.g., money), anchoring (no account of tracking), and high-stakes normativity (looping doesn't imply reform/abolition).

  ---

  **Deliverable Summary:** A theory must satisfy all 9 core desiderata, handle the 3 forbidden blurs, and engage your anchoring scheme. Key tensions: **Non-Triviality vs. Inclusivity** (drop the latter at cost of overbreadth) and **Action-Guiding vs. Descriptive Purity** (drop purity to meet your practical aim). **Non-Collapse** is the hardest criterion, excluding most extant theories. Reflexivity and abolition demands are valid.
