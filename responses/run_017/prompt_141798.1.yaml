  First, I need to assess each claim step by step. The video's point about the Bayesian update with a sane prior seems correct. When you open the envelope and see a specific amount, your prior distribution matters. If the prior is realistic, switching isn't always beneficial. That's solid. But the presenter's dismissal of the geometric case as "the same mistake" is problematic. The friend is right here: in that setup, no matter what amount you see, the other envelope has a higher expected value. That's not a mistake; it's a feature of the distribution.

  The geometric case does have infinite expectation, which complicates things. The video says this means decision theory breaks down, but is that accurate? Expected utility theory can handle infinite expectations, but it leads to issues like non-convergence or undefined values. So the presenter's claim that it "breaks down" has some truth, but it's an oversimplification. The real problem is that standard expected value comparisons fail when both options are infinite.

  The user's instinct that calling infinity a cop-out might be valid. Simply saying "infinite expectations, nothing to explain" avoids addressing why switching seems rational. The friend's point about the switching back step not making sense because expectations are infinite is more insightful. Without finite values, the usual symmetry argument doesn't hold.

  The lesson about abandoning expected utility for unbounded values might be too strong. While it's true that alternatives like medians or stochastic dominance can help, expected utility is still useful in many cases. The key is recognizing its limitations with heavy-tailed distributions, not discarding it entirely.

  The user wants a clear breakdown without rehashing the paradox. They need to know which parts of each argument are valid and where the conclusions might be shaky. They're also curious if their friend's geometric case explanation is correct, which it is. The infinity point doesn't fully resolve the paradox; it explains why the contradiction arises but doesn't make the reasoning less puzzling.

