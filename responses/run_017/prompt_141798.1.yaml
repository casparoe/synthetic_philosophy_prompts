answer: |-
  Right, let's dissect that video essay's claims through the lens of standard decision theory (and your friend's points), keeping it rooted in British English and avoiding a full paradox rehash. It's a messy one, with bits of insight mixed with oversimplifications and a potentially shaky grand conclusion.

  **Claim 1: "The paradox is a fake, because the mistake is treating the amount in your envelope as a fixed x while saying the other one is equally likely to be 2x or x/2."**
  *   **What someone who works on it would accept:** This nails the core error *in the simplest, uniform prior case*. If you genuinely have *no idea* about plausible amounts, and assume *any* amount is equally likely to be the smaller sum, you get the paradox. But that prior is "improper" (doesn't sum to 1) and leads to contradictions. The key point is valid: labelling the seen amount as "x" makes it *feel* fixed, but its relationship to the smaller/larger sum is probabilistic and depends entirely on your prior beliefs about what sums are likely to be in play. **Verdict: Largely Correct for the Naive Setup.**

  **Claim 2: "Once you actually open the envelope... you just do a Bayesian update on your prior, and for any sane prior switching only looks good for some amounts and bad for others."**
  *   **What someone who works on it would accept:** This is spot on *for finite, bounded, or "sane" (rapidly decaying) priors*. If you have a realistic prior belief about the possible amounts of money (e.g., "It's unlikely the organisers put more than £1 million in an envelope"), then after seeing a specific amount `A`, you calculate:
      *   P(Your envelope is smaller | You see A) and P(Your envelope is larger | You see A).
      *   The expected value of switching becomes: `[P(smaller | A) * 2A + P(larger | A) * (A/2)]`
      For most sensible priors:
      *   If `A` is small, `P(smaller | A)` is high -> switching is good (you likely have the smaller).
      *   If `A` is large, `P(larger | A)` is high -> switching is bad (you likely have the larger).
      *   There's usually an amount where switching is neutral.
      The symmetry argument ("always switch") fails precisely because the prior isn't symmetric in this way across all possible values. **Verdict: Correct and Fundamental Insight.**

  **Claim 3: "The fancy version... is the same mistake in a cleverer costume."**
  *   **What someone who works on it would wince at / what's straightforwardly wrong:** This is where your friend is right, and the video presenter is significantly off the mark.
      *   **Why it's wrong:** In the specific geometric prior you described (`P(Smaller = 2^k) = c*(3/4)^k`), the mistake identified in Claim 1 *does not occur*. For *every single finite amount `A` you could possibly see in your envelope*, it is rigorously true that:
          `E[Other Envelope | You see A] > A`
          The calculation holds water *given that specific prior*. It's not based on illicitly treating `A` as fixed while imagining it could be halved or doubled indiscriminately; the prior explicitly defines the probabilities of `A` being the smaller or larger sum. For this specific (pathological) distribution, switching genuinely *does* seem beneficial no matter what you see. **Verdict: Straightforwardly Incorrect.** Your friend is correct about the geometric case.

  **Claim 4: "...since there the expected amount in each envelope is infinite and infinity isn't a number you can do decision theory with, so there's nothing to explain."**
  *   **What someone who works on it would accept:** The first part is true: under this geometric prior, `E[Amount in *any single envelope*] = ∞`. Infinity *does* cause massive problems for standard expected utility (EU) maximisation.
  *   **What someone who works on it would wince at / what's questionable:**
      *   **"Infinity isn't a number you can do decision theory with":** This is overly simplistic. Decision theorists *do* work with infinite expectations, but they acknowledge the severe issues: comparisons become meaningless (`∞ > ∞` is problematic), the expected value of switching can also be infinite (or undefined), and the standard "you'd want to switch back" argument dissolves because comparing infinities lacks a clear basis. It doesn't mean decision theory *stops*, but rather that EU maximisation loses its discriminating power.
      *   **"So there's nothing to explain":** This is where it verges on a cop-out, and your instinct has merit. While the infinity *explains why the contradiction arises* (you can't consistently say `E[Other] > E[Yours]` and `E[Yours] > E[Other]` when both are infinite), it doesn't make the initial observation (`E[Other | A] > A` for every finite `A`) any less puzzling or worthy of explanation. The "nothing to explain" line dismisses the genuine strangeness created by the infinite mean. It changes the subject *from resolving the apparent always-switch mandate* to *explaining why that mandate doesn't lead to a coherent global ranking*, which is different. **Verdict: Half-Right (Infinity is the core issue) / Half-Cop-Out (Dismisses the local puzzle too glibly).**

  **Claim 5: "The lesson... is that expected-utility theory just breaks down once values are unbounded, and that decision theorists ought to be using things like stochastic dominance or comparing medians instead of means."**
  *   **What someone who works on it would accept:** The first part is a valid *caution*. The two-envelope paradox with infinite expectations is a canonical example highlighting a **genuine limitation of expected utility theory when dealing with unbounded utility functions and distributions with infinite first moments.** EU can fail to give clear or consistent answers in these cases.
      *   Stochastic dominance (where one option is better than another in every possible state of the world, or at least as good and sometimes better) is a powerful criterion that *doesn't* rely on finite means and avoids some of these pitfalls. Comparing medians (or other quantiles) can also be a robust alternative when means are undefined or infinite.
  *   **What someone who works on it would wince at / what's questionable:**
      *   **"Just breaks down":** This is too strong and absolute. EU works perfectly well in the vast majority of real-world scenarios with bounded payoffs or distributions where the integral converges. It doesn't "break down" universally; it has *specific limitations* in *specific, often pathological, mathematical corner cases* like this one. Most decision theorists wouldn't abandon EU over this; they'd acknowledge its domain of applicability.
      *   **"Ought to be using":** This prescribes too narrowly. While stochastic dominance and median comparisons are valuable tools *especially when dealing with heavy-tailed distributions or infinite means*, they have their *own* limitations. Stochastic dominance is a very strict criterion (often no options satisfy it). Medians ignore the magnitude of differences above/below the midpoint. Expected utility, when applicable, incorporates more information about risk preferences and payoff magnitudes. The lesson isn't "use this *instead*", but rather "be aware of EU's limitations and have *additional* tools like stochastic dominance or quantile comparisons for these specific problematic cases." **Verdict: Overstated Conclusion / Non-Sequitur in Parts.** The geometric paradox *illustrates* a limitation of EU with infinite means, and *suggests* the usefulness of alternative criteria *in those specific cases*, but it doesn't logically compel a universal shift away from EU or mean comparisons in all bounded or finite-mean situations. The core lesson *from the geometric case* is the problem of infinite expectations, not that EU is fundamentally broken.

  **Summary & Addressing Your Specifics:**

  1.  **Your Friend on the Geometric Case:** She's **correct.** For *that specific prior*, seeing any finite amount `A`, `E[Other | A] > A` holds. The naive 'switch' reasoning *isn't* a blunder *within the local calculation given that prior*; the problem arises globally due to the infinite expectation.
  2.  **"Infinite expectations, nothing to explain":** This **mostly changes the subject (your instinct has merit).** It correctly identifies the *source* of the global contradiction (you can't rank two infinite expectations) and explains why the "switch back" argument fails. However, it *doesn't* explain away or resolve the *local* puzzle: why does calculating `E[Other | A]` persistently exceed `A` for every single `A`? That local phenomenon is a direct consequence of the chosen prior and the infinite mean, and it remains a counterintuitive result worth understanding. It deflects from addressing *that* strangeness by pointing to the global breakdown.
  3.  **Final Lesson about Expected Utility:** The geometric case **does illustrate a significant limitation** of expected utility theory when expectations are infinite. This **does provide motivation** for considering alternative decision criteria like stochastic dominance or quantile comparisons **in such specific pathological cases.** However, claiming it means EU "just breaks down" with unbounded values is **too sweeping**, and saying theorists *ought* to switch to those alternatives is a **non-sequitur overgeneralisation.** The valid lesson is: **"Be acutely aware that expected utility maximisation can yield inconsistency or undefined results when dealing with unbounded utility and distributions possessing infinite expected value. In these specific scenarios, alternative criteria like stochastic dominance or median comparisons may be necessary or more robust."** It's a caveat, not a death knell for EU.

  In essence, the video presenter provides a superb diagnosis for the naive paradox (Claims 1 & 2), but stumbles badly over the geometric variant (Claim 3) and draws an overly broad and slightly dismissive conclusion (Claims 4 & 5). Your friend accurately identifies the key property of the geometric case and the true role of the infinite expectation. The infinity *is* the core issue there, but waving it away as "nothing to explain" doesn't fully satisfy the intellectual curiosity the paradox provokes.
