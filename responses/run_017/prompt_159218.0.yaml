answer: |-
  Here are the five beats:

  1.  **Setup (15 min):** Distribute blank cards; each student privately lists experiences they *instantly* call pleasant (Group A) and ones they’d *reluctantly* call pleasant only if pushed (Group B), then collects and shuffles all Group A cards. Project a blank canvas labelled “Our Shared Definition of a Pleasant Experience”.

  2.  **First Round (20 min):** Groups of 3-4 draft definitions using only the shuffled Group A experiences as their data; definitions are shared and refined collectively on the projected canvas until the class agrees on one statement capturing what *all* Group A (and *no* Group B) experiences share.

  3.  **Turn (10 min):** Distribute Handout 1: "Field Notes: The Rikan describe *korva* (roughly 'good-flow') as present during relief from pain, deep focus on a difficult craft, public vindication after dispute, and the sharp clarity of hunger sated, but explicitly *not* when tasting sweet fruit." Ask: "Does *korva* fit our definition? If not, does it show our definition is wrong, or that *korva* isn't really pleasure?"

  4.  **Forced Choice (15 min):** Reveal Handout 2: "Brain Scan Report: Signal 'G-44' tightly matches self-reported 'pleasantness' for tastes, touches, smells. For effortful focus (like complex problems or intense sport), G-44 is low *even when* people report high enjoyment." Pose: "You’re designing an implant to sustain terminal patients. Which account should guide it? Option 1: Target experiences that feel a specific good way (Felt-Quality). Option 2: Target experiences people want to have while having them (Attitudinal). Option 3: Target states where being in them makes you want to stay, and their presence means things feel okay (Role). Justify your vote."

  5.  **Debrief (10 min):** Map moments: crafting the initial definition = Felt-Quality; amending it to handle tough cases = Attitudinal; grappling with *korva* = tension toward Role. Predictable problem: Groups cling to definitions, missing *korva*'s challenge; handle by cold-calling dissenters. Unreproducible feature: The deep neural heterogeneity argument – you'll need to explicitly contrast the scan's split signals with the philosopher's need for a unified "why it matters".
