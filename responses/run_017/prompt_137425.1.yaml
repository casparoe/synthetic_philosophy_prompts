prompt: |-
  My friend and I had a long argument last night about Truman and the atomic bomb and I need someone to settle the philosophy bit of it, because we were mostly talking past each other by hour two.

  I was pushing Anscombe's line from the pamphlet she wrote when Oxford gave Truman an honorary degree: roughly, that deliberately killing innocent people as a way of getting what you want is murder no matter how many lives it saves or how just the war is, and that killing the people of Hiroshima and Nagasaki only looked necessary because the Allies had stupidly insisted on unconditional surrender. He says that's useless as an account of the actual decision. So do the case: take Truman's choice in the summer of 1945, with the facts more or less as I take them to be — cities full of people who weren't fighting or supplying the war, a government that hadn't accepted surrender terms, the alternatives being invasion, continued blockade and starvation, a demonstration drop, or waiting on the Soviets, and the fact that the Allies had already been firebombing Japanese cities for months — and tell me what her principle says Truman faced and should have done, where it explains something, where it's silent, and what the case does to the principle in return.

  Two things we went in circles on. First, he says her principle is just the doctrine of double effect in a louder voice, so Truman could have aimed at the military installations in Hiroshima and merely foreseen the civilians; I said that can't be her view but couldn't say why, so settle it. Second, here's the test I came up with and want checked: whether the civilians are being used as a means is settled counterfactually — if the raid would have been pointless had the city been evacuated, you're using them, whatever you say you were aiming at. Does that capture what she was after, and does it then sweep in the firebombing and the blockade too, which kill civilians by terror and hunger rather than blast? If so, is that a reductio of her position or a bullet she'd have bitten?

  One more: does any of it shift with Truman's uncertainty — about whether the bomb would work, or whether Japan would have folded anyway — or is that just irrelevant on her view? Please answer in American English, and dont just line up the standard postwar for-and-against; I want the mapping done and the places where the theory has nothing to say left blank.
reasoning: |-
  Okay, let me unpack this user's query. They had a heated argument with a friend about Truman's atomic bomb decision and Anscombe's moral stance. The user wants a clear breakdown of how Anscombe's principle applies to the Hiroshima/Nagasaki situation, specifically addressing two sticking points: whether it's just double effect repackaged, and whether their "counterfactual test" captures her view.

  First, I need to recall Anscombe's core argument: intentionally killing innocents as a means is always murder, regardless of consequences. The user's friend claims this is merely the doctrine of double effect (DDE), but Anscombe's position is stricter. DDE allows foreseen but unintended civilian deaths if the act itself is permissible. However, in Hiroshima, the destruction of civilians was integral to forcing surrender - that's means, not side-effect. 

  The user's proposed counterfactual test - "would the attack be pointless if civilians evacuated?" - actually nails Anscombe's point. If yes, civilians are being used instrumentally. Applying this to Hiroshima: no civilians = no shock value = no surrender pressure. Directly confirms her "using as means" charge. 

  But this test also implicates firebombing/blockades. Firebombing explicitly targeted civilians to break morale; starvation sieges weaponize hunger against non-combatants. Both fail the counterfactual: no civilians = no coercion. Anscombe would indeed bite this bullet, condemning all three as murderous tactics. That's not reductio to her - it's consistency. 

  Where the principle stays silent: Truman's uncertainty about bomb effectiveness or Japan's surrender likelihood doesn't change the intrinsic wrong for Anscombe. If you intentionally kill innocents *hoping* it achieves X, it's still murder even if X fails. The principle cares about intentional structure, not outcome probabilities. 

  Gaps in the theory: It doesn't weigh alternatives (invasion vs. bomb) because consequences don't justify the means. It also can't adjudicate "lesser evil" debates - that's outside its scope. And it offers no guidance on what Truman *should've* done beyond "not murder," leaving practical alternatives unexamined. 

  The user's frustration about arguing past each other likely stems from conflating layers: Anscombe operates at the moral absolute level; their friend argues from consequentialist necessity. Mapping where the theory speaks (intentionality) vs. where it's mute (alternatives/uncertainty) shows why they were talking past each other. Clarifying this boundary is key.
answer: |-
  Here's the breakdown of Anscombe's principle applied to Truman's summer 1945 decision, point by point, with the gaps and sticking points addressed directly:

  ### 1. **Anscombe's Core Principle Applied to Hiroshima/Nagasaki:**
     - **What Truman Faced:** A choice to deliberately target entire cities (Hiroshima/Nagasaki) where the vast majority of victims were non-combatants (civilians, children, elderly) not materially contributing to the war effort. The *intended mechanism* of ending the war was the terror, shock, and mass slaughter itself to coerce surrender.
     - **Anscombe's Verdict:** **Murder.** The civilian deaths weren't a foreseen but unintended side effect; they were the *instrument* used to break Japan's will. Even if it saved lives overall or ended a just war, intentionally using innocent lives as a means to an end is intrinsically evil. Her objection to the honorary degree was that it morally whitewashed this act.

  ### 2. **Your Friend's Double Effect (DDE) Objection:**
     - **Why Anscombe *Isn't* Just DDE "Louder":** DDE *might* allow bombing a legitimate military target (e.g., a factory) knowing civilians nearby *will* die, *if* the deaths are unintended and proportionate. Anscombe argues Hiroshima/Nagasaki fail DDE:
       - **Targeting:** The cities themselves were targets, not military installations surrounded by civilians. The bomb was dropped to maximize destruction of the urban area and its population.
       - **Intention:** The civilian deaths weren't an unwanted consequence; achieving surrender *required* the scale of the horror. As you noted, if Hiroshima had been evacuated, the bombing would have been militarily pointless – proving the civilians weren't collateral damage, they were the *object* of the attack.
       - **"Loudness":** Anscombe agrees DDE is valid, but insists Hiroshima/Nagasaki don't even meet *its* threshold. Her principle is stricter in rejecting *any* intentional killing of innocents as a means, even if DDE could theoretically permit some foreseen deaths elsewhere.

  ### 3. **Your Counterfactual Test:**
     - **Captures Anscombe Perfectly:** Yes. "If the raid would have been pointless had the city been evacuated, you're using them" is precisely her point. The utility of the attack *depended* on the presence and deaths of the civilians to create terror and psychological impact. Their deaths weren't accidental; they were essential fuel for the weapon's political effect.
     - **Sweeps in Firebombing & Blockade?:**
       - **Firebombing (Tokyo, Dresden, etc.):** **Yes.** If the point was to destroy housing, infrastructure, and kill workers/civilians to demoralize the enemy nation and cripple its capacity to continue (as it was), it fails your test. No civilians = no effect. Anscombe condemned this too as mass murder.
       - **Blockade/Starvation:** **Likely Yes.** If the blockade's primary mechanism for forcing surrender is causing mass civilian starvation/death (not just denying military supplies), then civilians are being used as instruments of coercion. Anscombe would see starving innocents to break the government's will as morally equivalent.
     - **Reductio or Bullet to Bite?** **She bites the bullet.** Anscombe explicitly condemned the Allied area bombing campaign (firebombing) on the same grounds as the A-bombs. She saw the blockade as potentially culpable if its *intended* mechanism was civilian suffering. Her position is radically absolutist: *no* intentional killing of innocents as a means is permissible, regardless of scale, context, or "lesser evil" arguments. She accepted this condemned widespread Allied (and Axis) practices.

  ### 4. **Truman's Uncertainty:**
     - **Irrelevant on Anscombe's View.** Her principle attacks the *intentional structure* of the act, not its consequences or the actor's confidence:
       - **Would the bomb work?** If his intention was to kill civilians *if* it worked, the *choice* to attempt it is still murderous intent. Trying to commit murder is still wrong even if you fail.
       - **Would Japan surrender otherwise?** This speaks to *consequences* (lives saved/lost). Anscombe rejects this calculus. If the act itself (intentionally killing innocents) is intrinsically evil, it is forbidden *even if* it was the only way to prevent greater evil (which she disputed regarding unconditional surrender). Uncertainty about alternatives doesn't change the nature of the act chosen.

  ### 5. **Where Anscombe's Principle is Silent/Provides No Guidance:**
     - **Evaluating Alternatives:** It condemns Hiroshima/Nagasaki (and firebombing, and potentially blockade). It *doesn't* tell Truman what he *should* have done instead. Was invasion permissible? (She might argue just tactics matter). Was continuing conventional bombing/blockade while modifying surrender terms acceptable? The principle only says "Don't murder innocents," leaving the messy practicalities of strategy, diplomacy, and assessing *other* lives lost unaddressed.
     - **"Lesser Evil" Weighing:** It completely rejects this framework for the core principle. It offers no way to compare the predicted deaths in an invasion vs. the A-bombs. It simply forbids one option as intrinsically wrong.
     - **Moral Distinction from Firebombing:** It sees none (both are murder). The unique horror of the A-bomb is irrelevant; the moral wrong is the same.
     - **Responsibility for Japanese Government's Actions:** The principle doesn't absolve the Japanese government of its culpability in prolonging the war or its own atrocities. It only addresses the moral permissibility of *Truman's specific choice*.

  ### The Case's Impact on the Principle
  *   **For Supporters:** The horror of Hiroshima/Nagasaki *validates* the principle. It shows the slippery slope of "necessity" leading to industrialized mass murder of innocents. The counterfactual test proves the civilians were instrumentalized.
  *   **For Critics:** The case *highlights the perceived impracticality/absolutism* of the principle. Critics argue it paralyzes necessary action in extreme cases, ignores the reality that *all* war harms innocents, and fails to engage with the brutal calculus Truman faced. Condemning blockade/firebombing equally seems, to them, to prove its detachment from realities of total war.

  **In short:** Anscombe says Truman faced a choice to murder innocents as a means to end the war. He should not have done it, regardless of alternatives or uncertainty. The principle condemns the act itself, sweeping in firebombing and potentially blockade, and offers no solution to Truman's strategic dilemma beyond "don't commit mass murder." Its power is its moral clarity; its weakness is its practical silence on everything else. Your counterfactual test nails her core argument against DDE-weaseling.
