prompt: |-
  I work in the safety department of a regional transit authority — light rail plus buses, about twelve hundred vehicles — and roughly forty incident reviews a year cross my desk: collisions, signal failures, maintenance errors, and near-misses that come in through our confidential reporting system. I write them up; a committee of five (operations, maintenance, HR, a driver representative, and me) signs off; the board reads the summary page and decides which recommendations get funded. Two features of our process matter a great deal. The first is that our template has a single line labelled root cause, and the board will not accept a report that leaves that line blank or fills it with a list. The second is that, under our agreement with the union, we may name an individual in that line only if the committee finds the individual was personally responsible; naming someone sets off a separate process that everyone involved dislikes. So in practice every review ends in one of two ways — we name a person, or we say it was the system — and I have come to think that this is an artefact of the template rather than a finding about the world.

  I have been reading about causation on my own, with no formal training in philosophy, precisely because the reviews keep turning on it, and I want a procedure, not more theory. Here is where I have got to. The test we all reach for is the but-for test: would the outcome have happened if this had been different? It seems to me to give the wrong answer when two things were each sufficient on their own — each can say the outcome would have happened anyway, so butt-for says neither is a cause — and it also seems to let almost everything in, since the outage would not have happened if the part had never been manufactured or if the authority had never been built. The alternative I have read about, which I believe is called the interventionist account, says something like: X caused Y if there is some possible change to X, brought about in a way that does not itself change anything else except through X, that would change Y or the chance of Y, with the other relevant factors held at the levels they actually had. I can see the appeal. I can also see three places where it might be hollow: the answer depends on what else you hold fixed, on which alternative value of X you imagine (double the maintenance budget? halve it? check the bolt, or check it twice and sign for it?), and on whether the change is one anyone could actually carry out. If those are choices we make, then the procedure is not discovering causes; it is recording our decisions about which comparisons to care about. I would much rather have that stated openly in the procedure than have the board discover it in a report.

  What I want from you is a decision procedure my team can run on each review, in the order we should run it, written so that someone with no philosophy can apply it. For each step I need the question to ask, what counts as a sufficient answer, where the procedure stops with a no and the report says the candidate is not a cause, and where it stops to hand the question to a named person or to the committee because it is a question of values or of authority rather than of fact. I need a fixed form for the cause sentence itself, so that forty reports a year are comparable, and I need the form to force us to say what we are holding fixed and what alternative we are comparing against. I also need the procedure to say what to do when we cannot get the number we want, which is most of the time: we almost never have data on how often a step is skipped or how much a change would reduce risk, and we have about two working days per report and ninety minutes of committee time.

  There are specific hard cases the procedure must be able to handle rather than wave at: two independent faults each of which would have produced the outcome on its own; a backup that would have caught the failure except that the backup was itself defective; a failure to act rather than an act; a factor nobody in our organisation can change, such as a driver's undiagnosed medical condition or the geometry of a junction as built; a factor that changes nothing by itself and only matters in combination with another; a cause far back in time, such as a hiring freeze two years ago; and the ordinary case where the best we can say is that something made the outcome more likely rather than certain. I have also been using an informal test of my own when we are deciding whether to name a person: I ask whether swapping that person for another competent employee, same shift, same conditions, same equipment, would have changed anything. Tell me where that test fits in the procedure, whether it is sound, and where it breaks.

  Then run the procedure on three cases.

  One. A signal failed at a junction and a train was brought to a stop in a tunnel. The investigation found a power supply module that had been degrading for months and was past its replacement interval, and also a wiring fault introduced during repair work three weeks earlier that would on its own have taken the signal out that same night. Either alone would have done it. Our but-for instinct says neither is the cause. What does the procedure say we write in the line, and if the template permits only one entry, how does the procedure decide which of the two goes there?

  Two. A bus struck a pedestrian in a marked crosswalk at dusk. The driver was within the speed limit and had no sightline difficulty until the last moment; the pedestrian was looking at her phone and stepped out against the signal. The committee's instinct is to write pedestrian inattention. My instinct is that this is both true and useless, and that naming the one variable we cannot act on while ignoring the ones we can is a choice rather than a finding. Is her inattention a cause by your procedure? And what should the procedure tell us to do about the fact that the manipulable variables on our side — crossing lighting, signal timing, the speed limit on that corridor, vehicle front design — each change the probability only slightly?

  Three, the case I expect to dislike. A light-rail car was pulled from service after a brake component was found torqued incorrectly. Six technicians work that shift; all six, including the one on duty, routinely skip the re-torque step, because the job card places it at the end of a twelve-hour night shift and the tooling is kept at the far end of the depot. The board wants a name in the root cause line, and the driver representative has said the report will be used to discipline someone. My own swap test says the individual is not the cause: any of the six, on that night, in those conditions, would have done the same. Run the procedure and tell me honestly what it outputs — including, if this is where it lands, that causation and accountability come apart, and that we are being asked to use a causal report to do a moral or administrative job that it cannot do. Then say clearly which part of that decision belongs to the committee and not to the procedure.

  Finally, tell me what the procedure cannot do: which questions it will systematically get wrong, which it will refuse, where it will be quietly steered by whoever chooses the variables and the contrasts, and what I should watch for in the first six months if we adopt it.
reasoning: |-
  Hmm, this is a deep and practical request from someone in transit safety management. They're dealing with real-world incident investigations constrained by bureaucratic templates and union agreements, and they've clearly wrestled with philosophical causation concepts on their own. The core tension is between their mandatory "single root cause" field and the reality that incidents usually involve multiple contributing factors.

  The user has identified key weaknesses in their current approach: the but-for test fails in cases of overdetermination (where multiple causes could each independently cause the incident), and their binary "person vs system" framing oversimplifies reality. They're drawn to interventionist causation theory but recognize its practical limitations around choice of variables, comparators, and hold-fixed conditions.

  What they really need is:
  - A step-by-step decision tree that operationalizes causation analysis
  - Clear stopping rules for when something isn't causal
  - Handling for their specific hard cases
  - Guidance on when decisions shift from factual to value-based
  - Standardized output formatting
  - Practical constraints (2 days/report, limited data)

  Their proposed "swap test" for individual culpability is insightful - it essentially operationalizes the interventionist idea by asking whether changing the person (holding all else fixed) would prevent the outcome. This should be formally incorporated.

  For the procedure design, I'm considering building around these principles:
  1. Explicitly frame causation as about actionable interventions
  2. Require specifying both the proposed cause AND the proposed alternative
  3. Systematically test counterfactuals
  4. Handle overdetermination via "sufficient cause" identification
  5. Separate causation from accountability

  The three test cases are perfectly chosen to stress-test the system:
  1. The signal failure (overdetermination) should force confrontation with the template's limitations
  2. The pedestrian accident shows how "true but useless" causes distract from preventability
  3. The maintenance case reveals how causation and discipline get conflated

  Implementation risks I should highlight:
  - The choice of comparison variables remains subjective
  - Systemic factors will be harder to quantify
  - The committee may resist moving away from person-blame
  - Historical causes create "butterfly effect" concerns

  The output format must enforce transparency about what's being held fixed and why certain interventions are considered. For their union constraints, we'll need clear rules about when naming individuals is justified (only when the swap test shows difference-making).
answer: |-
  Below is a **causation decision procedure** designed for your incident reviews. It operationalizes interventionist principles while addressing your constraints (template limitations, time, data scarcity, and hard cases). The procedure forces explicit choices about **what is held fixed** and **what intervention is imagined**, separates factual analysis from value judgments, and includes your "swap test" as a formal step.  

  ---

  ### **Causation Decision Procedure**  
  **Goal:** Determine if a candidate factor (C) is a root cause of the outcome (O).  
  **Output Format:**  
  *"[C] caused [O] because, if we had [specific intervention on C] while holding [specific factors] fixed, [O] would have been less likely or prevented."*  
  *(If multiple causes, use: "The combination of [C1] and [C2] caused [O] because..." with the same logic.)*  

  #### **Step 1: Define Candidate Cause (C) and Outcome (O)**  
  - **Question:** What specific factor (C) are we testing? What outcome (O) did it contribute to?  
  - **Sufficient Answer:** C must be measurable (e.g., "signal wiring fault," "maintenance step skipped," "pedestrian inattention"). O must be the incident (e.g., "signal failure," "pedestrian strike").  
  - **Stop Here If:** C is vague (e.g., "human error"). *Revise C to be specific.*  

  #### **Step 2: Specify Intervention and Hold-Fixed Factors**  
  - **Question:** What **realistic intervention** on C could we have made? What **other relevant factors** must we hold fixed at their actual levels?  
  - **Sufficient Answer:**  
    - Intervention: A concrete change (e.g., "replaced wiring during repair," "conducted re-torque step," "installed brighter crosswalk lighting").  
    - Hold Fixed: Factors not directly changed by the intervention (e.g., "weather," "shift length," "traffic volume").  
  - **Handoff to Committee If:**  
    - The intervention is not actionable by your authority (e.g., "change pedestrian’s phone use").  
    - The hold-fixed list includes factors the committee deems *unacceptable to ignore* (e.g., holding "training" fixed when it’s clearly relevant).  

  #### **Step 3: Apply Swap Test (For Human Factors)**  
  - **Question:** If C involves an individual’s action/inaction, would swapping them with another competent employee (same conditions, equipment, shift) likely change the outcome?  
  - **Sufficient Answer:**  
    - **Yes (Individual not causal):** Proceed to test systemic factors (e.g., training, tools).  
    - **No (Individual potentially causal):** Flag for committee review (may require naming).  
  - **Where It Breaks:**  
    - If the "competent employee" standard is unrealistic (e.g., industry-wide skill gaps).  
    - If conditions are so flawed that *no* employee could succeed (e.g., broken tooling).  

  #### **Step 4: Test Causation (Interventionist Counterfactual)**  
  - **Question:** Holding [Step 2 factors] fixed, would [Step 2 intervention] have likely **prevented O or reduced its probability**?  
  - **Assessment Method:** Use evidence (data, expert judgment, historical precedents). Default to "more likely than not" standard due to data limits.  
  - **Stop Here If "No":** C is not a root cause. *Test other candidates.*  
  - **Stop Here If "Yes":** C is a root cause. Document using output format.  
  - **Handoff to Committee If:**  
    - Probability reduction is marginal (e.g., lighting reduces risk by 1%). *Committee decides if it’s "meaningful enough" to list.*  
    - Overdetermination (multiple sufficient causes). *Committee prioritizes based on preventability.*  

  #### **Step 5: Handle Special Cases**  
  - **Two Independent Faults (e.g., Case 1):** If both are sufficient causes:  
    - Output: **"The combination of [C1] and [C2] caused [O] because either alone would have sufficed."**  
    - Committee must **choose one for the template line** based on:  
      - Which is more actionable?  
      - Which has higher preventability?  
      - *Default: The most proximate cause.*  
  - **Backup System Failed:** Treat as two factors: (1) Primary failure, (2) Backup defect. Test separately.  
  - **Far-Back Causes (e.g., hiring freeze):** Only causal if intervention (e.g., "no hiring freeze") likely prevents O *without unrealistic downstream changes*.  
  - **"Factor + Trigger" (e.g., bolt defect + vibration):** Only causal if the factor *significantly enabled* the trigger (test via intervention on the factor).  

  ---

  ### **Application to Your Cases**  
  #### **Case 1: Signal Failure (Two Independent Faults)**  
  - **Procedure Output:**  
    - Both wiring fault (C1) and degraded module (C2) are root causes. Either intervention ("fix wiring during repair" or "replace module on schedule") would have prevented O, holding fixed "junction design" and "maintenance budget."  
  - **Template Resolution:** Committee chooses **one** based on preventability/actionability. *Recommend: "Degraded power module"* (proactive maintenance is more controllable than ad-hoc repair errors).  

  #### **Case 2: Pedestrian Strike**  
  - **Pedestrian Inattention (C):**  
    - Intervention: "Pedestrian attentive to signal."  
    - Handoff: **Not actionable by your authority → Not a root cause for your reports.**  
  - **Your Variables (Lighting, Speed, etc.):**  
    - Test: E.g., "If crosswalk lighting was brighter, holding fixed pedestrian behavior and dusk conditions, would strike likelihood decrease?"  
    - Answer: Likely **yes, but marginally**.  
    - **Handoff to Committee:** Is a 5–10% risk reduction "meaningful enough"? If yes, output: *"Inadequate crosswalk lighting caused the strike because..."*  

  #### **Case 3: Maintenance Skip (System vs. Individual)**  
  - **Swap Test:** "Would swapping the technician with another competent employee (same shift/tools) change the outcome?" → **No** (all six skip the step).  
  - **Systemic Cause (C):** "Job card design placing re-torque at shift end + distant tool storage."  
    - Intervention: "Revise job card sequence + add tool station."  
    - Holding fixed: Shift length, staffing levels.  
    - Outcome: Likely prevents O. **→ Root cause is systemic.**  
  - **Honest Output:**  
    - **"The procedure identifies systemic job design as the cause. Naming an individual is not causally valid but may be required for accountability. This is a committee value judgment."**  
  - **Committee’s Role:** Decide if administrative rules compel naming someone despite causal findings. *The procedure forces this conflict into the open.*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Deep Value Conflicts:** It flags when causation and accountability diverge (e.g., Case 3) but cannot decide which should prevail.  
  2. **Eliminate Subjectivity:** Choosing interventions/hold-fixed factors is inherently judgment-based. *Watch for:*  
     - Teams consistently holding fixed factors they don’t want to address (e.g., "budget constraints").  
     - Overly narrow interventions (e.g., "check bolt" vs. "redesign workflow").  
  3. **Quantify Precise Probabilities:** Uses "likely" standards due to data limits.  
  4. **Handle Butterfly Effects:** Distant causes (e.g., hiring freeze) may be rejected if the causal chain requires too many assumptions.  
  5. **Force Template Reform:** It can’t fix the "single line" constraint but makes its limitations explicit.  

  **First 6-Month Watchlist:**  
  - Are committees consistently overriding causal findings for accountability?  
  - Are teams "gaming" hold-fixed factors to avoid hard truths?  
  - Is output phrasing clear enough to compare reports?  

  This procedure makes causation a transparent, auditable process—not a philosophical mystery. It accepts that **causation is a choice about which prevention strategies matter most**, and forces that choice into the light.  

  ---  
  **Final Note:** Your "swap test" is sound and is embedded in Step 3. It breaks only when "competent employee" is undefined or conditions make success impossible—which is exactly when the system is the true cause.
