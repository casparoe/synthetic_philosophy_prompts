answer: |-
  1. **Explain the convergence of formalisms**: Account for why distinct 1930s models (Turing machines, lambda calculus, etc.) all capture the same class of computable functions, without presupposing the thesis. *Motivating case*: The halfstep engine doesn't challenge this convergence—its infinitary operation is alien to all 1930s models, highlighting their shared finitary/discrete basis.  
     
  2. **Sharpen "mechanical procedure" non-circularly**: Define what makes a procedure "effective" or "mechanical" without implicitly relying on Turing-equivalent formalisms. *Motivating case*: The napkin model appears mechanical to experts (suggesting pre-theoretic intuition exists), yet its power depends on an unproven conjecture—demanding a definition independent of both empirical realizability and formal proof.  

  3. **Distinguish physical realizability from formal computability**: Separate the thesis's core claim (about abstract procedures) from claims about physical realizability. *Motivating case*: The halfstep engine is physically impossible (infinite operations in finite time) but irrelevant to the formal thesis; conversely, the million-bit black box is physically realizable but computationally trivial (bounded), failing to challenge unbounded computation.  

  4. **Clarify burden of proof and refutation criteria**: Specify what constitutes a counterexample, particularly for bounded, inconsistent, or conditional devices. *Motivating case*: The million-bit box is inadequate (it fails on large programs), while the napkin model is conditional (it challenges CT only if the conjecture holds), demanding clear standards for what "outrunning Turing machines" requires (e.g., solving an undecidable problem unconditionally).  

  5. **Address contingent truth and revisability**: Explain whether the thesis could be empirically false in our universe (e.g., due to unknown physics) and how such falsification would work, without reducing it to an unfalsifiable dogma. *Motivating case*: If the napkin model were physically built and its conjecture proven, would this refute CT? Or is CT insulated by its abstract definition?  

  6. **Key tension and pivotal desideratum**: Desideratum 2 (sharpening "mechanical") and Desideratum 5 (contingent truth) conflict—any non-circular sharpening risks excluding revisability, while contingent-truth accounts often presuppose an unanalyzed notion of "mechanical." Desideratum 3 (physical/formal distinction) does the most work in ruling out popular accounts: it dismisses physical-law interpretations (which conflate with physics) and naive convergence arguments (which ignore that convergence is of formalisms, not physical devices).
