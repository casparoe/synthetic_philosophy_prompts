prompt: |-
  hey — i'm taking a judgment & decision-making course this term and i'm also the person who writes the budget for my student society. We run six or seven events a year (a careers-fair type thing, a couple of socials, a conference, a few one-offs), and every one needs a projected attendance number and a cost estimate that the student union finance comittee signs off on. The committee is five undergrads who have never heard of any of this. If we overrun by more than about 15% we eat it out of next term's allocation, and if we underspend badly they cut our budget, so both directions hurt a bit. I've got maybe half an hour per proposal, a spreadsheet, and my memory of what past events actually cost.

  So: can you turn the inside view / outside view stuff into a procedure I can actually run? Not "be aware of the planning fallacy" — I want the ordered questions, what counts as a good enough answer to each one, where the procedure says stop and don't commit the money, and where it has to hand the decision back to the committee because it's a values call rather than an estimation call. Remember the people signing off are 19 to 21 and have no stats, so no step can need more than a spreadsheet.

  The bits I keep getting stuck on, which I want the procedure to actually handle rather than hand-wave:

  - I build the bottom-up number first (venue, catering per head, ticket sales as a percentage of last time, sponsorship I'm "pretty sure" about) and then I go looking for a reference class — which means I can basically shop for whichever class gives me the answer I already wanted. How does the procedure stop me doing that? Do I have to commit to the class before I'm allowed to do the bottom-up estimate?
  - Some line items obviously have base rates and some don't. Catering cost per head: years of data. "Will this speaker actually draw 200 people": nothing. Do I regress the total or the components? Regressing the whole total feels like it throws away the information I genuinely do have.
  - Our reference class is only the events we actually ran, and we only ran the ones we felt good about after doing exactly this kind of optimistic planning. I've argued myself into both "so the base rate is too rosy" and "so the base rate is fine, because the filter operating on the class is the same filter operating on me now." Which is it, or what would I have to check to tell?
  - Do the events we proposed and then quietly didn't run go in the class?
  - When am I allowed to shift off the base rate because this case is genuinely different, and what makes that a legitimate reason instead of a rationalization? Does it have to be a mechanism I state out loud in advance and can score afterwards, and what do I do with a reason I only thought of after seeing the outside-view number?

  Then run it on three of next term's proposals: (1) the careers fair, which we've now run four times and where I have a specific, nameable reason to expect slightly above our average; (2) a two-day hackathon we've never done, where the only reference class I can build is other societies' published budgets, which I strongly suspect are the numbers they *planned* rather than what they spent; and (3) the conference, which is the event everyone loves, that I've already half-promised to people, and which I want you to apply the procedure to straight — even if the honest answer is that we should run it at half the capacity, with a much bigger contingency than I want to ask for, or not this year. I'd rather hear that from the procedure in October than find out in March.

  Also: be clear about what this procedure can't do — the cases where it's silent or where it's really just my own judgement with a spreadsheet costume on — and tell me which steps are judgement calls dressed up as procedure. And say what would change your mind about the procedure itself: where is your reasoning most likely to fail, and is there anything about how we operate that, if I told you, would make you say "actually, just use your inside view here"?
reasoning: |-
  We are designing a systematic procedure to combat the planning fallacy and cognitive biases in budget estimation for student society events. The procedure should integrate both inside-view (detailed, case-specific) and outside-view (base rates, reference classes) approaches. It must be executable within 30 minutes per proposal using a spreadsheet and historical data, and be understandable by a committee without statistics background.

  Key challenges to address:
  1. Preventing reference class shopping by committing to the reference class early.
  2. Deciding whether to regress the total or components (use base rates at the level where they are reliable).
  3. Handling the fact that our reference class only includes events that were run (survivorship bias) and how to account for canceled events.
  4. Criteria for justifiably adjusting the base rate and avoiding rationalizations.
  5. Applying the procedure to three example proposals.

  The procedure will be structured as a series of ordered steps with clear outputs and decision points. Steps that are judgment calls will be explicitly marked.

  ---

  **Procedure for Event Budget Estimation**

  **Step 0: Pre-Commitment to Reference Class**
     - *Before* building the bottom-up estimate, define the reference class(es) for this event. This prevents shopping for a class that matches the desired estimate.
     - How to choose:
       - If the event is recurring (e.g., careers fair), use the same event's past instances.
       - If it's new but similar to past events (e.g., a social), use a group of similar events (e.g., all socials).
       - If it's entirely new (e.g., hackathon), use the closest analog from other societies or a broad class (e.g., all events of similar type and scale). If using other societies' data, note that it may be planned (optimistic) and adjust (see Step 3).
     - Write down the reference class and the metrics you will use (e.g., total cost, attendance, cost per head). Do not change this after Step 0.

  **Step 1: Build the Inside-View (Bottom-Up) Estimate**
     - Break down the event into line items (venue, catering, speaker fees, etc.).
     - For each item, estimate:
          - Best-case (optimistic)
          - Most likely
          - Worst-case (pessimistic)
     - Use historical data where available (e.g., catering cost per head from past events). For new items, use vendor quotes or research.
     - Calculate:
          - Baseline inside-view estimate = weighted average (e.g., (optimistic + 4*most likely + pessimistic)/6) OR just the most likely if time is short.
          - Also note the worst-case total.

  **Step 2: Collect Base Rate Data from Reference Class**
     - Gather data from the reference class defined in Step 0. Include:
          - Actual total cost and attendance (if applicable) for each past event.
          - If using other societies' data, note whether it's actual or planned. If only planned is available, mark as such (we'll adjust in Step 3).
     - For each event in the class, calculate the ratio of actual to planned (if actuals are available) or note if only planned exists.
     - Compute:
          - Average ratio (actual/planned) for the class.
          - Standard deviation (if feasible) or range (min, max) of ratios.
          - If no actuals (only other societies' planned), use the average ratio from your own society's events of a similar type (if available) as a discount factor.

  **Step 3: Adjust for Biases in Reference Class**
     - *Survivorship Bias*: Our reference class only includes events that were run. We did not run events that were canceled. This may make the base rate too optimistic because we canceled events that looked too expensive or poorly attended.
       - Correction: If you have records of canceled events, include them in the reference class (with their planned costs and attendance). If you don't, apply an upward adjustment to the cost estimate (or downward to attendance) by 10-20% (judgment call based on how many events are canceled). *This is a judgment step.*
     - *Optimism in Other Societies' Data*: If using other societies' planned budgets, assume they are optimistic by the same factor as your own society's average optimism (from Step 2). For example, if your events averaged 20% over planned, then apply a 20% upward adjustment to their planned numbers to estimate the expected actual.
     - Output: Adjusted base rate ratio (expected actual / planned) for the class.

  **Step 4: Generate Outside-View Estimate**
     - Outside-view estimate = (Baseline inside-view estimate from Step 1) * (Adjusted base rate ratio from Step 3).
     - If the event has multiple components, you can apply base rates at the component level for items with reliable base rates (e.g., catering cost per head) and at the total level for others. But note: if you do partial base-rate adjustment, you might retain some optimism. Recommended: For events with reliable component base rates, adjust those components individually and then sum. For the rest, apply a total-level adjustment. However, if time is short, do total-level.

  **Step 5: Compare and Resolve Discrepancies**
     - Compare the inside-view estimate (Step 1) and the outside-view estimate (Step 4).
     - If they are within 15% of each other, take the higher of the two as the proposed budget. (This builds in a buffer and avoids underfunding.)
     - If they differ by more than 15%:
          - Investigate: Why is there a discrepancy?
          - Identify specific reasons (e.g., "We have a new sponsor for the careers fair," or "The hackathon venue is free because of a partnership").
          - Criteria for adjusting the outside-view estimate upward/downward:
              - The reason must be a *causal factor* that is both (a) specific and measurable, and (b) not already reflected in the base rate (i.e., it is a new factor).
              - The reason must be written down and quantified (e.g., "Sponsor X has committed £500, which is 20% more than our average sponsor").
              - If the reason is post-hoc (you thought of it after seeing the outside view), it is acceptable only if it meets the above criteria and you can document it. However, be extra skeptical.
          - If justified, adjust the outside-view estimate by the quantified amount to get the final estimate.
          - If not justified, stick with the outside-view estimate.

  **Step 6: Set Contingency and Decision Points**
     - Final proposed budget = adjusted estimate from Step 5.
     - Add a contingency:
          - Minimum contingency = 10% of final proposed budget.
          - If the reference class showed high variability (e.g., standard deviation > 15% of the mean), set contingency to 15-20%.
     - Compare the worst-case total from Step 1 with the final proposed budget plus contingency. If the worst-case is higher, consider whether the event is too risky and should be scaled down or canceled.
     - Decision rules for the committee:
          - If the final proposed budget (with contingency) is within 15% of last year's allocation for similar events, approve.
          - If it is over by more than 15%, the committee must decide whether the event is worth the risk of overrun (which would eat into next term's budget). This is a values call.
          - If the event is new and the outside view is based on weak data (e.g., other societies' planned budgets), the committee should be made aware of the higher uncertainty.

  **Step 7: Documentation for Committee**
     - Present to the committee:
          - Inside-view estimate and breakdown.
          - Reference class used and adjusted base rate ratio.
          - Outside-view estimate.
          - How the final estimate was derived (including adjustments).
          - Contingency and worst-case scenario.
     - Highlight any judgment calls and uncertainties.

  ---

  **Applying the Procedure to the Three Proposals**

  **Proposal 1: Careers Fair (recurring, with history)**
     - Step 0: Reference class = past four careers fairs (actuals available).
     - Step 1: Build bottom-up. You expect slightly above average due to a new sponsor (nameable reason). Break down: venue, catering, marketing, etc. Calculate most likely and worst-case.
     - Step 2: Base rate: For each past event, compute actual/planned ratio. Suppose:
          - Year1: 1.10, Year2: 0.95, Year3: 1.15, Year4: 1.05 → Average ratio = 1.0625 (so 6.25% over planned on average).
     - Step 3: Adjust for bias. Since we have no canceled careers fairs, no survivorship adjustment. Use the average ratio of 1.0625.
     - Step 4: Outside-view = (inside-view) * 1.0625.
     - Step 5: Suppose inside-view is £10,000. Then outside-view is £10,625. Difference is 6.25% (<15%). So take higher: £10,625. But you have a specific reason (new sponsor) that might make this year better. However, note: the base rate already includes variation. Only adjust if the sponsor is a new factor beyond historical variation. If you can quantify the sponsor's effect (e.g., reduces costs by £500), then adjust the inside-view down by £500 to £9,500, then outside-view becomes £9,500 * 1.0625 = £10,093.75. Then take the higher of the adjusted inside-view (£9,500) and outside-view (£10,093.75) → £10,093.75? But wait, we adjusted the inside-view for the sponsor. Alternatively, keep the original inside-view and then adjust the outside-view by the sponsor effect. However, the procedure says: adjust the outside-view by the quantified reason. So: outside-view without sponsor effect is £10,625. Then subtract the £500 saving → £10,125. Then compare: inside-view is £10,000, outside-view is £10,125. Difference is 1.25% → take £10,125. 
     - Step 6: Contingency: Suppose variability in base rate ratios is low (std dev ~7%). Set contingency at 10% → £1,012.50. Total proposed: £10,125 + £1,012.50 = £11,137.50. Worst-case from Step 1 (say £12,000) is higher, but the contingency only covers up to £11,137.50. So note the risk and decide if acceptable.

  **Proposal 2: Two-Day Hackathon (new, using other societies' data)**
     - Step 0: Reference class = published budgets (planned) from 3 other societies for hackathons. Note: these are planned, not actuals.
     - Step 1: Build bottom-up: venue, food, prizes, etc. Suppose inside-view: £5,000.
     - Step 2: Base rate: We have no actuals from others. But we can use our own society's average actual/planned ratio for events of similar scale (say, conferences). Suppose our ratio is 1.20 (we typically overrun by 20%).
     - Step 3: Adjust for bias: (a) Survivorship: We don't have canceled events, so apply a 15% upward adjustment to the base rate ratio? Actually, we are using our own ratio which includes survivorship. So we use 1.20. But note: our events that were run overran by 20% on average. However, we don't have data on events we canceled. So the 20% might be an underestimate. We could bump it to 25% as a judgment. But without data, we stick to 1.20. (b) Other societies' data: Since we are using their planned, we adjust by our own society's average optimism (20%) → so their planned numbers are likely 20% too low. But we are not using their numbers directly for the total; we are using our own inside-view. So we apply the 20% to our inside-view.
     - Step 4: Outside-view = £5,000 * 1.20 = £6,000.
     - Step 5: Compare: inside-view £5,000, outside-view £6,000 → 20% difference. Investigate: Are there reasons? If we have a free venue (which we haven't had before), that could be a reason. Quantify: If venue was budgeted at £1,000 and is now free, adjust the inside-view to £4,000. Then outside-view becomes £4,000*1.20=£4,800. Then take the higher: £4,800. Without a specific reason, we would take £6,000.
     - Step 6: Contingency: Since new event, set at 20% → £960. Total: £4,800 + £960 = £5,760. Worst-case from Step 1 (say £7,000) is higher, so note risk.

  **Proposal 3: Conference (beloved, but risky)**
     - Step 0: Reference class = past conferences (say 3 years, all run).
     - Step 1: Inside-view: You are optimistic. Build breakdown. Suppose: most likely £15,000, worst-case £20,000.
     - Step 2: Base rate: Actual/planned ratios: 1.10, 1.30, 1.25 → average 1.2167 (21.67% overrun).
     - Step 3: Adjust for survivorship: We canceled one conference in the past because costs were too high. We don't have its planned numbers? If we do, include it. Suppose we don't. Apply an extra 5% to the base rate ratio → 1.2167 * 1.05 ≈ 1.2775. (Judgment: because the canceled event would have been worse.)
     - Step 4: Outside-view = £15,000 * 1.2775 ≈ £19,162.50.
     - Step 5: Compare: inside-view £15,000 vs outside-view £19,162.50 → 27.75% difference. Now, you have half-promised. But what specific, quantifiable reason is there for being below the base rate? If none, then the outside-view stands. If you have a reason (e.g., "we have a new funding source"), quantify and adjust. Without one, the outside-view is £19,162.50.
     - Step 6: Contingency: High variability (std dev of ratios ~10% of mean) → 15% contingency → £2,874.38. Total: £22,036.88. Worst-case was £20,000, so the total covers it. But note: the outside-view is already an adjusted expected value. The contingency is for variability beyond that. However, the worst-case from Step 1 is below the total, so it's acceptable? But wait: the outside-view is about the expected overrun, and the contingency is for uncertainty. The worst-case in Step 1 might be too optimistic. We should use the reference class to set a worst-case. For example, the max overrun in the reference class was 30%. So worst-case cost = £15,000 * 1.30 = £19,500. Then with contingency, we have £22,036.88, which covers it.

     However, the committee must decide: is the event worth the risk of £22,036.88? If the budget is tight, they might cancel or scale down. The procedure says: if over 15% of last year's allocation, it's a values call.

  ---

  **Limitations of the Procedure**

  - **Judgment Calls**: Steps that are inherently judgment-based:
     - Choosing the reference class (Step 0).
     - Adjusting for survivorship bias (Step 3) without data.
     - Quantifying reasons for adjustments (Step 5).
     - Setting contingency percentages (Step 6).

  - **What the Procedure Cannot Do**:
     - Eliminate uncertainty; it only structures the estimation.
     - Replace domain knowledge (e.g., knowing that a venue is more expensive than usual).
     - Account for black swan events (extreme outliers).
     - Fully overcome motivated reasoning when you are emotionally invested (like the conference). The procedure forces documentation and comparison, but the committee must enforce it.

  - **When to Override the Procedure**:
     - If an event has a fundamental change (e.g., moving online due to a pandemic) that makes the reference class irrelevant, then the outside view may not apply. In such cases, rely more on the inside view but with higher contingency.
     - If the reference class is very small (n<3), the outside view is weak. Then weight the inside view more, but still with high contingency.

  - **What Would Change My Mind About the Procedure**:
     - If the society has very stable events (low variability) and experienced planners, the outside view might be less necessary. But the planning fallacy is universal.
     - If the cost of overestimation (budget cuts) is much higher than the cost of underestimation (eating into next term), you might bias toward higher estimates. The procedure can be adjusted (e.g., always take the higher of inside and outside view) to mitigate that.
     - The procedure might fail if:
          - Historical data is of poor quality.
          - The reference class is not comparable (e.g., comparing a small social to a large conference).
          - The estimator is dishonest in documentation.

  In summary, the procedure forces you to confront base rates and document reasons for deviations. It will not eliminate errors but should reduce overoptimism. Run it as written for a year and compare planned vs. actual to refine.
answer: |-
  Below is a step-by-step estimation procedure designed to combat the planning fallacy and cognitive biases, tailored to your constraints (30 minutes per proposal, spreadsheet-only, no stats background). It integrates inside/outside views systematically, addresses your specific pain points, and includes explicit "stop" rules. I'll then apply it to your three proposals and clarify its limitations.

  ---

  ### **The Estimation Procedure: Ordered Steps**
  **Core Principle:** The outside view (reference class) *must* be fixed *before* building the inside view to prevent shopping. Adjustments to the base rate require pre-specified, testable criteria.

  #### **Step 0: Define the Reference Class (Outside View Anchor)**
  - **Action:** Before any bottom-up work, choose *one* reference class.  
  - **Rules:**  
    - If the event has ≥3 past iterations *run by your society*, use those.  
    - If not, use the *most similar* events from other societies (even if planned, not actual).  
    - If no similar events, use *all* society events from the past 2 years.  
  - **Document:** In your spreadsheet:  
    - List all events in the class.  
    - For each, record: **Planned Cost**, **Actual Cost**, **Planned Attendance**, **Actual Attendance**.  
  - **Stop Rule:** If you can't define a reference class with ≥3 events, skip to Step 3 and add a 25% contingency.  

  #### **Step 1: Calculate the Base Rate**
  - **Action:** Compute two metrics for your reference class:  
    - **Cost Overrun %** = `(Actual Cost - Planned Cost) / Planned Cost` for each event.  
    - **Attendance Overestimate %** = `(Planned Attendance - Actual Attendance) / Planned Attendance` for each event.  
  - **Output:**  
    - **Mean Overrun** (simple average of all events).  
    - **Worst Case** (90th percentile: 2nd highest value if 5 events).  
  - **Key Rule:** *Never* exclude events from the class after this step. If an event was canceled, include it only if it had a *formal budget* approved by the committee.  

  > *Why this works:* Fixing the class upfront prevents shopping. Including canceled events corrects survivorship bias (they make the base rate *more conservative*).  

  #### **Step 2: Build the Inside View (Bottom-Up)**
  - **Action:** Create a line-item budget. For each item:  
    - **Best Guess:** Your initial estimate.  
    - **Source:** Historical data (e.g., catering per head), vendor quote, or analogy.  
  - **Mandatory Adjustments:**  
    - For items with historical data (e.g., catering), use the **max actual unit cost** from past events.  
    - For new items (e.g., a speaker fee), use the **highest analogous cost** you’ve paid.  
  - **Output:** Total "Optimistic" cost and attendance.  

  #### **Step 3: Apply the Outside View**
  - **Action:** Adjust your inside view using the base rate:  
    - **Cost Estimate** = `Optimistic Cost × (1 + Mean Overrun)`  
    - **Attendance Estimate** = `Optimistic Attendance × (1 - Mean Overestimate)`  
  - **Contingency:** Add `(Worst Case Overrun - Mean Overrun) × Optimistic Cost` to the cost estimate.  
  - **Regress Components?** Only if:  
    - The item has ≥3 historical data points (e.g., catering).  
    - If not, regress the *total* (to avoid cherry-picking).  

  > *Why this works:* Using the worst-case gap as contingency isolates unforeseeable risks. Regression to the mean happens at the total level unless component data is robust.  

  #### **Step 4: Legitimate Adjustments to the Base Rate**
  - **Action:** Only adjust if *all* criteria are met:  
    - **Pre-Specified:** The reason was documented *before* Step 2 (e.g., "We have a new sponsor for the careers fair").  
    - **Quantifiable:** You can assign a £ or % impact (e.g., "Sponsor reduces costs by £500").  
    - **Novel:** The factor didn’t exist in ≥80% of the reference class events.  
  - **Adjustment Rule:** Modify the **Optimistic** value in Step 2, then re-run Step 3.  
  - **Stop Rule:** If adjustment widens the gap from the base rate, *discard it* (likely rationalization).  

  #### **Step 5: Final Approval Thresholds**
  - **Cost Projection** = Output from Step 3 (after any legitimate adjustments).  
  - **Committee Handoff Rules:**  
    - **Approve Automatically:** Projection ≤ 110% of last year’s actual cost for the same event type.  
    - **Debate Required:** Projection > 110% or new event. The committee must answer: "Is the social value worth eating into next term’s budget if we overrun?"  
    - **Kill Rule:** If contingency > 20% of total budget, or attendance estimate < 60% of break-even.  

  ---

  ### **Application to Your Proposals**
  **Assumptions for all:**  
  - Reference class for overrun % is based on cost (attendance follows the same logic).  
  - Your society’s average cost overrun: 18% (mean), 35% (worst case).  
  - Contingency = `Optimistic Cost × (Worst Case Overrun - Mean Overrun)` = `Optimistic Cost × 17%`.  

  #### **Proposal 1: Careers Fair (4 past runs)**  
  - **Step 0:** Reference class = Your 4 past careers fairs.  
  - **Step 1:** Base rate from past overruns: Mean = 10%, Worst Case = 22% (e.g., Year 3).  
  - **Step 2:** Optimistic cost = £5,000 (includes new sponsor discount).  
  - **Step 3:** Cost estimate = `£5,000 × 1.10 = £5,500`. Contingency = `£5,000 × (22% - 10%) = £600`. **Total = £6,100**.  
  - **Step 4:** "New sponsor" is legitimate (pre-specified, quantifiable, novel). Adjusted optimistic cost = £4,800. Re-run Step 3: `£4,800 × 1.10 = £5,280` + contingency `£4,800 × 12% = £576` → **Total = £5,856**.  
  - **Step 5:** Within 110% of last year’s actual (£5,700) → **APPROVE**.  

  #### **Proposal 2: Hackathon (new, using other societies)**  
  - **Step 0:** Reference class = 3 other societies’ *planned* hackathon budgets.  
  - **Step 1:** Base rate: Assume other societies’ planned costs are 20% optimistic (per your mean overrun). Adjusted mean overrun = 20%.  
  - **Step 2:** Optimistic cost = £3,000.  
  - **Step 3:** Cost estimate = `£3,000 × 1.20 = £3,600`. Contingency = `£3,000 × (35% - 20%) = £450`. **Total = £4,050**.  
  - **Step 4:** No legitimate adjustments (no pre-specified reasons).  
  - **Step 5:** New event + high contingency → **COMMITTEE DEBATE**. Question: "Is a £4K hackathon worth risking next term’s budget?"  

  #### **Proposal 3: Conference (beloved, half-promised)**  
  - **Step 0:** Reference class = Your 3 past conferences.  
  - **Step 1:** Base rate: Mean overrun = 25%, Worst Case = 40% (e.g., Year 1 AV disaster).  
  - **Step 2:** Optimistic cost = £7,000.  
  - **Step 3:** Cost estimate = `£7,000 × 1.25 = £8,750`. Contingency = `£7,000 × (40% - 25%) = £1,050`. **Total = £9,800**.  
  - **Step 4:** *No legitimate adjustments.* "We love it" isn’t quantifiable. "Half-promised" is excluded (not pre-specified).  
  - **Step 5:** Contingency (£1,050) = 14% of total (<20%), but projection is 140% of last year’s cost. → **COMMITTEE DEBATE**. Hard question: "Should we run at 60% capacity to cap costs at £6,000?"  

  ---

  ### **What the Procedure Can and Cannot Do**
  #### **Strengths**  
  - **Forces Discipline:** Locks the reference class upfront, uses worst-case gaps for contingency.  
  - **Handles Your Pain Points:**  
    - Survivorship bias: Canceled events *with budgets* are included in the base rate.  
    - "This time is different" must be pre-specified and quantified.  
    - Other societies’ data is adjusted for optimism.  
  - **Clear Stop Rules:** Kills proposals with >20% contingency or low attendance.  

  #### **Limitations (Judgment in Spreadsheet Clothing)**  
  1. **Defining "Similar" Events (Step 0):** Requires judgment. Mitigation: Document your criteria (e.g., "All events >100 attendees").  
  2. **Quantifying Adjustments (Step 4):** "Sponsor reduces costs by £500" is still a guess. Mitigation: Use min/max ranges (e.g., £400–£600) and take the worst case.  
  3. **Contingency Calculation:** Assumes linear risk. Not valid for black swans (e.g., pandemic).  

  #### **When to Abandon the Procedure**  
  - **If I learned:** Your society has *zero control* over key costs (e.g., union-mandated vendors). → **Use inside view + 25% contingency.**  
  - **If events are political:** The committee always funds "pet projects." → **The procedure is useless; build bigger buffers.**  

  #### **Where My Reasoning Might Fail**  
  - **Base Rate Quality:** If your past budgets were *systematically delusional* (e.g., always missing by 50%), the outside view won’t save you. Track actuals this year to calibrate.  
  - **Small Reference Classes:** With <5 events, outliers dominate. Solution: Inflate the worst case by 10%.  
  - **Your Emotion:** For events you "love" (e.g., the conference), the procedure flags risks but can’t force objectivity. Mitigation: Have a peer replicate Steps 0–3.  

  ---

  ### **Final Recommendation**  
  Run this for one term. Track: (a) Planned vs. Actual costs, (b) How often the committee overrides the procedure. If overrides consistently lead to overruns, harden the rules. **Crucially: Archive every budget—even canceled ones—to improve future base rates.**  

  The procedure won’t eliminate pain, but it will make it predictable and defensible. For the conference: the numbers don’t lie. Scale it down or demand a 20% upfront deposit from attendees.
