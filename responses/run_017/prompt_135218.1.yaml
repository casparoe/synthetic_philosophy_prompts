answer: |-
  ## GUIDANCE FOR APPLICANTS AND AUDITORS: PERMITS FOR ACTS BEYOND THE CALL OF DUTY

  **Preamble:**
  The State Bureau for Moral Administration (BMA), Licensing Division (Form LD-1A), is mandated under Statute 47-89(b) to recognize, certify, and maintain a public register of Supererogatory Acts (SE Acts). This Guidance (Ref: LD/GUI/REV7) outlines the procedures for application (Form LD-101), audit (Form LD-201), and permit issuance (Certificate LD-PERMIT) for such acts. Compliance ensures accurate classification, prevents unwarranted retroactive obligations, and maintains the integrity of the moral ledger.

  **1.0 Definition of Supererogatory Act (SE Act):**
      *   1.1 An SE Act is defined as an action:
          *   (a) Possessing positive moral value;
          *   (b) Whose omission does not warrant censure or penalty at the time of performance; and
          *   (c) Which exceeds the baseline requirements incumbent upon the Actor within their relevant Reference Class (See Clause 3.0).
      *   1.2 Examples (non-exhaustive) include: significant personal sacrifice to aid a non-dependent stranger (e.g., organ donation), returning found property of substantial value without expectation of reward, intervening in a hazardous situation involving strangers where personal risk is non-negligible, or providing extraordinary, uncompensated labor for community benefit demonstrably outside normal civic expectations.

  **2.0 Retrospective Authorization Principle:**
      *   2.1 Authorization is necessarily retrospective. Issuance of Permit LD-PERMIT *prior* to performance would constitute a *requirement* to perform the described act, thereby negating its supererogatory status by creating an obligation (See Statute 47-89(b)(ii)).
      *   2.2 Applicants must submit Form LD-101 *after* the act is performed, detailing the act, date, location, involved parties, and personal cost incurred.
      *   2.3 Applicants submit Form LD-101 without guarantee of permit approval. Submission acknowledges the act may be adjudicated as a baseline duty, requiring no permit.

  **3.0 Reference Class and Compliance Thresholds:**
      *   3.1 The "Reference Class" for an act is determined by Actor characteristics (e.g., profession, location, relationship to beneficiary) and act type (Form LD-101, Section 4).
      *   3.2 An act's status as SE is contingent on the estimated Participation Rate (PR) within the relevant Reference Class falling below the Statutory Compliance Threshold (SCT) of 85% at the time of performance (See Appendix A, Table 1: SCT Matrix).
      *   3.3 If the Bureau's statistical analysis (Division of Moral Demography, Ref: DMD/STAT/PR) determines the PR exceeded the SCT *at the time of the act*, the act is reclassified as Mandatory.
      *   3.4 Consequence of Reclassification: Permit LD-PERMIT is voided retroactively. Non-performance by others within the Reference Class during the period the PR exceeded the SCT becomes subject to citation and penalty by the Enforcement Division (Form ENF-55). Applicant is notified of reclassification via Notice LD-NRC.

  **4.0 Demand Management Mechanisms:**
      *   4.1 To prevent PR exceeding SCT and preserve SE status for key acts, the Bureau employs:
          *   (a) **Permit Caps (LD-CAP):** Annual limits on permits issued for specific high-risk act types (e.g., LD-CAP-001: Non-directed Kidney Donation).
          *   (b) **Allocation Lotteries:** Randomized selection for permit issuance where applications exceed LD-CAP (Procedure LD-LOT).
          *   (c) **Waiting Lists (Form LD-WL):** Registration for individuals expressing intent to perform specific capped SE Acts (e.g., LD-WL-001: Lost Wallet >$500 Value Return). Listing serves only to manage potential demand and does not constitute pre-authorization or obligation.

  **5.0 Field Test: Reactive Attitudes Survey (RAS):**
      *   5.1 To validate the omission would *not* have attracted censure at the time, Field Officers conduct a Reactive Attitudes Survey (Form LD-RAS).
      *   5.2 Officers canvass a statistically valid sample (Ref: DMD/STAT/SAMP) of plausible bystanders (neighbors, colleagues, passers-by in the vicinity) regarding the *specific omission* by a hypothetical similar Actor.
      *   5.3 **Critical Finding:** Where >50% of surveyed individuals express Resentment, Indignation, or Moral Disapproval (Form LD-RAS, Section C: Attitude Coding) regarding the hypothetical omission, the act is deemed to have been a baseline Duty for the Reference Class at that time.
      *   5.4 Consequence: Permit application denied (Notice LD-DEN). File transferred to Enforcement Division (Form ENF-55) for review of *non-performance* by *others* within the Reference Class during the relevant period.

  **6.0 Non-Transferability of Moral Credit:**
      *   6.1 An SE Act confers no transferable moral credit. It cannot be used to offset penalties, fulfill unmet Mandatory obligations (e.g., unpaid taxes - Form ST-1, missed child support - Form FS-7), or reduce liabilities incurred elsewhere.
      *   6.2 The Ledger of Optional Works (BMA Ledger OW) is maintained strictly separate from the Ledger of Requirements (BMA Ledger R). No cross-application of entries is permitted (Statute 47-89(d)).

  **7.0 Motivation Disqualification:**
      *   7.1 An act is disqualified from SE status if the *primary motivation* was to obtain Permit LD-PERMIT, or if knowledge of the permit system was a necessary causal factor in performing the act.
      *   7.2 Auditors review submitted evidence (Form LD-101, Attachments) and may request additional documentation (Form LD-REQ: e.g., personal diaries, communications records - subject to Statute 12-34 on Privacy) to assess motivation.
      *   7.3 Presence of statements indicating permit-seeking intent, calculation of benefit from permit possession, or reliance on the existence of the permit scheme as justification for the act constitutes grounds for disqualification (Notice LD-DIS).
      *   ***Statistical Note (DMD/STAT/APP):** Valid Application Rate (VAR) has exhibited a steady annual decline of 3.2% (±0.5%) since Bureau inception. Correlation analysis suggests increased public awareness of the permit system as a significant factor.*

  **8.0 Worked Examples:**
      *   *Example 1 (LD-EX-01): Returning Wallet.* Actor A finds a wallet containing $300 and ID near a busy park entrance. A locates the owner and returns it intact same day. *RAS Result:* 70% of surveyed park users express strong indignation at the thought of someone keeping it. *Determination:* Act reclassified as Mandatory (Duty of basic honesty). Permit denied. File transferred to Enforcement for review of non-return incidents that day.
      *   *Example 2 (LD-EX-02): Staying Late.* Employee B, an administrative clerk, stays 3 hours beyond shift without request or overtime pay to complete a non-urgent report for a colleague's project, missing a personal commitment. *RAS Result:* 40% indignation; 60% view as "nice but not expected." *Reference Class PR:* Office clerical staff; PR for similar acts estimated at 15%. *Determination:* SE Act certified (LD-PERMIT-EX02). Motivation review: No evidence of permit-seeking.
      *   *Example 3 (LD-EX-03): Canal Rescue.* Citizen C, a weak swimmer, jumps into a moderately fast-flowing canal to pull out a struggling child, sustaining minor injuries. *RAS Result:* 90% express strong indignation at the thought of *not* intervening. *Determination:* Act deemed Mandatory (Duty of easy rescue in capability). Permit denied. Motivation irrelevant due to RAS finding.

  **9.0 Forward Programme: Maintaining Optionality**
      *   9.1 The core mandate requires maintaining acts *as* SE. Sustained high PR risks triggering SCT reclassification.
      *   9.2 To actively manage participation rates downwards:
          *   (a) **Publicity Cessation:** All public information campaigns regarding the permit scheme cease immediately. Existing materials archived (Ref: COM/ARCH/SE).
          *   (b) **Anonymity:** Names of Permit LD-PERMIT holders will no longer be published in the public register (Ref: LED/OW/REV2).
          *   (c) **Discouragement Pilot (LD-PILOT-01):** Field Officers will initiate low-key, non-coercive discouragement of high-participation-risk SE Acts during routine community engagement. Focus: Highlighting personal cost, lack of tangible benefit, and potential social burdens of acts like non-directed organ donation or extreme volunteerism. Goal: Reduce visible modeling and perceived social pressure. Effectiveness to be measured via DMD/STAT/PR quarterly.

  **Appendix A: Office of Maximizing Review (OMR) Position & Operational Consequence**
      *   *A.1 OMR Position:* OMR (Internal Memo OMR/PRINC/001) contends that for any given Actor in a situation, there exists a single "Best Available Act" (BAA). Performing any act less than the BAA is morally deficient. Therefore, the BAA is always Mandatory, rendering the SE category logically empty. All permits are void.
      *   *A.2 Bureau Acknowledgment:* The logical consistency of the OMR position is noted.
      *   *A.3 Operational Consequence:* Strict application of the OMR principle would require Bureau staff to perform the BAA at all times. This includes, but is not limited to: immediate resignation to pursue more impactful altruistic careers, continuous unpaid overtime to maximize processing efficiency, and donation of all disposable income/assets exceeding basic sustenance to optimal charities (Ref: OMR/IMP/001). As staff performance consistently falls short of the identifiable BAA, universal censure and operational paralysis would ensue. Therefore, the Bureau continues to operate under Statute 47-89(b), recognizing the practical necessity of the SE category for societal function and its own continued existence. OMR audits are subject to standard prioritization queues.
