answer: |-
  Here's a requirements list for an ICU treatment-limitation/critical-care allocation protocol, grounded in practical application for junior clinicians, with motivations and classification of each requirement. Cases provided are integrated into the analysis.

  ### Core Requirements (Non-Negotiable for Protocol Feasibility)
  1. **Externally Auditable (Non-negotiable)**  
     *Motivation*: Decisions must be reviewable by ethics committees/legal teams using objective records (e.g., charts, timestamps), not subjective intent.  
     *Case*: Ventilator reallocation by algorithm with no opt-out – auditors can verify actions (default applied) but not clinician intent.  
     *Why non-negotiable*: Protocols must withstand legal/ethical scrutiny; intentions are unverifiable.

  2. **Applicable to Institutions/Systems (Non-negotiable)**  
     *Motivation*: Protocols bind hospitals, algorithms, and standing orders, not just individuals.  
     *Case*: Ventilator algorithm defaulting to reallocation – the *system* "acts" via design.  
     *Why non-negotiable*: Modern ICU care involves protocols/tech; individual-centric accounts fail here.

  3. **Operational Under Prognostic Uncertainty (Non-negotiable)**  
     *Motivation*: Decisions are made with incomplete data; protocol must not require omniscience.  
     *Case*: Patient death after uncertain prognosis decision – focus on *decision process* (e.g., evidence-based criteria), not outcome.  
     *Why non-negotiable*: ICU decisions are inherently probabilistic; waiting for certainty harms patients.

  4. **Not Reducible to Intention/Foresight (Non-negotiable)**  
     *Motivation*: "Intending death" is rarely present in palliative care; collapsing distinctions excuses covert euthanasia.  
     *Case*: Surgeon programming lethal infusion while asleep – death is intended but delivery is passive. An account calling this "allowing death" would be dangerous.  
     *Why non-negotiable*: Protocols must prevent abuse and align with law (e.g., withdrawal of life support is typically legal even if death foreseen).

  ### Theoretical Preferences (Partisan or Context-Dependent)
  5. **Avoid Causal Claims About Omissions/Absences (Preference)**  
     *Motivation*: Philosophical debates (e.g., "Can omissions cause death?") are intractable and confuse clinicians.  
     *Case*: Clinician withdrawing self-initiated life support – protocol should bypass "Did withdrawal *cause* death?" debates.  
     *Why preference*: Some accounts (e.g., counterfactual) implicitly rely on causation but can reframe it pragmatically.

  6. **Unified Doing/Allowing & Killing/Letting-Die Distinction (Preference)**  
     *Motivation*: Simplifies training; clinically, "killing" implies active harm, "letting die" implies withholding non-obligatory care.  
     *Case*: Bathtub case (active drowning vs. failure to rescue) – both must be distinguishable, but one framework is easier for juniors.  
     *Why preference*: Some philosophers argue the distinctions differ (e.g., doing/allowing is about causation, killing/letting-die about norms), but this complicates protocols.

  7. **Consistent Bathtub Pair Verdicts (Preference)**  
     *Motivation*: Clinicians need clear examples; active harm (holding child under) must be "killing," failure to rescue "letting die."  
     *Case*: Two clinicians each failing to rescue, expecting the other to act – both are "allowing death" if omission-focused.  
     *Why preference*: Tests intuitive moral alignment but risks overfitting to edge cases.

  8. **Distinguish Trolley Diverting from Organ Harvesting (Preference)**  
     *Motivation*: Trolley (diverting threat) is often permissible; organ harvesting (active killing) is not. Protocol must reflect this.  
     *Case*: Ventilator reallocation resembles trolley if passive (e.g., not starting treatment); harvesting resembles active harm.  
     *Why preference*: Aligns with consensus on impermissibility of active harm, but some utilitarian accounts reject this.

  ### Genuine Desiderata vs. Partisan Demands
  - **Genuine Desiderata**: Externally auditable, institutional applicability, operational under uncertainty, non-reduction to intent.  
    *Why*: Essential for any feasible, legally defensible protocol.  
  - **Partisan Demands**: Avoiding causal claims, unified distinction, bathtub consistency, trolley/organ differentiation.  
    *Why*: These reflect debates between deontological (rights-focused) vs. consequentialist (outcome-focused) ethics but aren’t protocol-breakers if handled pragmatically.

  ### Conflicts and Trade-offs
  - **Irreconcilable Tension**: Requirements **6 (unified distinction)**, **7 (bathtub consistency)**, and **8 (trolley/organ distinction)** conflict.  
    *Why*: Bathtub case (#7) requires active/passive distinction to classify drowning as "killing" and non-rescue as "letting die." But trolley (#8) demands *active* diversion be classified as "allowing" (permissible), while organ harvesting is "doing" (impermissible) – undermining a unified active/passive line (#6). Satisfying all three is likely impossible.  
  - **Most Exclusionary Requirement**: **Externally auditable (#1)**.  
    *Why*: It immediately disqualifies intention-based accounts, which dominate philosophical literature but rely on inaccessible mental states.

  ### Scoring Candidate Accounts
  1. **Counterfactual/Baseline Accounts** (e.g., "Did the agent deviate from a baseline?")  
     *Score*: Strong on auditability (#1) and institutions (#2), but weak on baselines for omissions (e.g., ventilator algorithm’s "default" baseline is arbitrary) and trolley/organ cases (#8). Fails uncertainty (#3) if baseline depends on outcomes.  
  2. **Intention-Based Accounts**  
     *Score*: Automatically fails auditability (#1) and institutions (#2). Handles trolley/organ (#8) and infusion pump (#4) well but useless for protocols.  
  3. **No Independent Moral Weight (Pragmatic Tracking)**  
     *Score*: Best for uncertainty (#3) and avoiding causation debates (#5), but gives no guidance for bathtub (#7) or trolley (#8). Risky as it may permit "easy" killings if other factors (e.g., prognosis) dominate.

  ### Protocol Design Recommendation
  Prioritize **non-negotiable requirements**: Use a **hybrid counterfactual-pragmatic approach**. Define "ending life" as *initiating a directly lethal intervention* (e.g., lethal injection) and "letting die" as *withholding/withdrawing treatment when criteria are met* (e.g., poor prognosis per evidence-based algorithm). Audit decisions against documented criteria, not intent. This handles:  
  - Ventilator reallocation: "Letting die" if based on prognosis.  
  - Infusion pump: "Ending life" (active intervention).  
  - Withdrawing support: "Letting die" if protocol-compliant.  
  - Failed rescue: "Letting die" (omission), blame on system failure.  
  - Prognostic uncertainty: "Letting die" if supported by best-available data.  

  This sidesteps philosophy while meeting operational needs. Bathtub/trolley conflicts become training examples, not protocol pillars.
