  For the cases: Ventilator reallocation by default—if no one opts out, is it allowing death or doing? Counterfactual accounts might say allowing if the baseline is no intervention, but institutions complicate baselines. Pre-programmed lethal dose—active killing, even if asleep. Withdrawing life support—letting die if standard practice. Failed rescue—allowing death, but harder to audit intention. Prognosis uncertainty—focus on act rather than outcome.

  The most conflicting desiderata are 5, 6, and 7. Treating the distinctions as one, but bathtub and trolley cases challenge this. Bathtub case: one actively kills, one allows. Trolley vs. organ harvesting: both active, but one is permissible. So satisfying both might be impossible without additional moral factors.

