  = \frac{1}{2(N+1)} + \frac{2^{N+1}}{4(N+1)} - \frac{2}{4(N+1)}

  = \frac{1}{2(N+1)} + \frac{2^{N}}{2(N+1)} - \frac{1}{2(N+1)} 

  \frac{2^{N+1}}{4} = \frac{2 \cdot 2^N}{4} = \frac{2^N}{2}

  And \frac{2}{4} = \frac{1}{2}

  So:

  = \frac{1}{2(N+1)} + \frac{2^N}{2(N+1)} - \frac{1}{2(N+1)}   because \frac{1}{4(N+1)} * 2 = \frac{2}{4(N+1)} = \frac{1}{2(N+1)}

