  In their sum, for the expected gain, they are summing P(A) * E[gain|A], where E[gain|A] is the expected gain from switching given that amount, but in the policy, you only switch for some A, so E[gain|A] under the policy is not the same as the conditional expectation of gain if you switch.

  Specifically, for the policy, the gain given A is:

  - If you switch at this A, then E[other - A | A]

  - If you do not switch, then 0

  In this case, for A=2^{N+1}, you do not switch, so gain=0

  For other A, you switch, so gain= E[other|A] - A

  At A=1, E[other|A] = 2, since it must be the small envelope, so gain=2-1=1

