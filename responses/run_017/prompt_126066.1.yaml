  But this violates the symmetry argument? No, the symmetry argument says that before you open the envelope, any strategy that decides to switch or not based on the envelope you get should have the same expected payoff, because of symmetry. But in this case, the policy depends on the amount, which you see after opening, so it's not a fixed strategy before opening. Before opening, all envelopes are symmetric, so any unconditional strategy (like always switch or never switch) has the same expected payoff. But a conditional strategy can have higher payoff because it uses the information from opening.

