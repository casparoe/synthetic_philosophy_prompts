  Now expected gain = sum P(A) * gain(A)

  = P(A=1) * 1 + P(A=2^{N+1}) * 0 + sum_{j=1}^N P(A=2^j) * (0.25 * 2^j)

  = [1/(2(N+1))] * 1 + 0 + sum_{j=1}^N [1/(N+1)] * [0.25 * 2^j]

  = \frac{1}{2(N+1)} + \frac{0.25}{N+1} \sum_{j=1}^N 2^j

  Now \sum_{j=1}^N 2^j = 2 + 4 + ... + 2^N = 2(2^N - 1)/(2-1) = 2^{N+1} - 2

  So expected gain = \frac{1}{2(N+1)} + \frac{0.25}{N+1} (2^{N+1} - 2)

