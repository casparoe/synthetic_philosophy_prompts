prompt: |-
  I do appraisal at a small regional archive — local government records, a couple of donated family collections, the odd box nobody's opened since 1974 — and I've noticed I have really firm gut verdicts about what should be kept, opened, sealed, handed over, or let go, and no story about why they hang together. So: cases first, then you tell me the principle.

  1. A colonial district office's tax rolls, 1890s to 1950s, listing every adult male by hut, livestock, and tax owed. Straightforward instrument of extraction. Verdict: keep, no question, and index them by place so descendants can find their own grandfathers in them.

  2. A children's institution's admission registers, 1930s–60s, naming kids, their parents, and the reason for admission. Verdict: keep, but access conditions set with the descendant community, not by me.

  3. A 1970s police file naming people who informed on their neighbours. Verdict: seal it, and I don't feel bad, even though in twenty years a historian will want it.

  4. A run of arrest photographs and charge books for men picked up under an old vagrancy/immorality law. Verdict: keep the series, but re-describe it so the *law* is the subject rather than the men, and don't reproduce the photographs in anything we mount.

  5. A missionary's glass-plate negatives of a village, 1920s, donated by his grandson, with captions sorting people into types and noting their group as if it were a species. Verdict: keep the images, retire the captions as description, and if the descendant community wants to write the new descriptions, they write them. The images are one thing; the finding aid is where the power actually sits.

  6. An oral history with an elder about a massacre in the 1960s. She'll record it but says it has to be sealed until the families of the men who did it are dead. Verdict: honour it, the condition travels with the donation.

  7. A government department quietly deletes five years of internal email, entirely within its retention schedule, right before someone files for them. Verdict: this is much worse than if a flood had taken the same emails. Loss is weather; deletion by the record's own creator is an act, and it has an author and an intended reader.

  8. A community asks us to hand over the originals of a clinic's patient registers about them and asks that we not keep copies. My verdict splits: hand over the originals, obviously yes; keep a copy, my whole professional instinct screams yes — and I know that instinct is exactly the colonial one, so I suspect I'm wrong and we should hand over everything and keep only a record that we once held it and where it went.

  9. There is nothing in our holdings about a particular travelling community — they appear in the city directories only as numbers on a camp, and the trade guild registers list male heads of household only. My verdict: the emptiness is not neutral, and we should say so in the catalogue, an explicit note about what we don't have and roughly why. Some colleagues think that's self-indulgent metadata. I think the silence is part of the record.

  10. A forged memo from the 1950s that was circulated and used to justify sacking a bunch of people. We know it's a forgery. Verdict: keep it, keep the fact that it's a forgery visible on it, don't weed it out as false.

  Here's the half-baked thing I've been testing against them. Call it the direction-of-use test: the question isn't who appears in a record, it's who the record was made to be used on. Records made to act on people — rolls, registers, surveillance files, charge books — belong in some sense to the people they were used on, and that gives those people, or their descendants, a say in access, in description, and even in destruction. Records made to be read — diaries, minutes, somebody's own photographs — belong more to their maker. And removal is only legitimate when the people a record was used on authorise it, when the removal itself is public, and when a trace of the removal is kept.

  I can see it doing work on 1, 2, 5, 8, 10, and on why 7 is worse than a flood, but I can't tell whether it's actually generating my verdicts or just redescribing them, and case 3 sits oddly in it — the informants were also people the record was used on, in a way.

  So: test it, repair it, or tell me it's hopeless. Does one principle get all ten, or do I need two, and is there a simpler one that gets eight and overturns the other two — and if so, which of my verdicts would you drop and why? Give me the clause-by-clause version, each clause tied to the case that motivates it. Then tell me what your account predicts for a case I haven't listed, because I want to see it do something I didn't feed it.

  And the one I actually go back and forth on: an unlabelled box of photographs of children at one of the institutions, nobody knows who any of them are. Half of me wants to digitise and crowdsource identifications — names given back is a real good — and half of me thinks that puts images of children, now elderly, on the internet and asks a community to do free metadata labour so my catalogue looks better. What does your principle say, and say honestly if it doesn't reach this kind of case.

  Last thing: tell me what would change your mind. Which consideration would flip you on the photograph box, and where is the reasoning you just gave me most likely to break — some class of record, or some case where the by and the about collapse into the same person, or somewhere else. Don't bother with citations, I can chase those myself.
reasoning: |-
  Okay, the user is an archivist at a small regional archive dealing with various appraisal scenarios. They've presented ten cases with their gut verdicts and a half-baked principle they call the "direction-of-use test." They want me to test, repair, or reject this principle, see if it can cover all cases, and apply it to an unlabelled photo box they're unsure about. 

  First, I need to understand their direction-of-use test. It distinguishes between records made to act on people (belonging to the subjects) and those made to be read (belonging to the creator). The user feels it explains some cases but not others, especially case 3 about the police informant file. 

  Looking at their verdicts, I notice consistent themes: harm prevention, agency for descendant communities, contextual honesty about gaps, and preserving evidence of systemic actions. The user seems deeply aware of power dynamics in archives, especially colonial contexts. Their struggle with case 8 (handing over clinic records) shows professional training clashing with anti-colonial instincts. That tension is key - they're questioning traditional archival ethics from a social justice lens. 

  Hmm, their test has good bones but needs refinement. The "used on" framing is clever but too binary. Case 3 proves the problem: informants were both tools *and* victims of the system. A better approach might focus on power asymmetry - records created through unbalanced relationships where subjects had little say. That covers tax rolls (1), institution registers (2), arrest photos (4), etc. 

  For case 3, sealing makes sense because disclosure could cause present-day harm (retaliation against informants' families) and the subjects (both informants and informed-upon) had no consent in creation. The user's verdict aligns with minimizing ongoing harm, which their original test misses. 

  The "emptiness" in case 9 is fascinating. Their instinct to call out archival silence shows how absence can be an active act of erasure. My principle should explicitly address metadata ethics - catalogs must contextualize gaps created by power structures. 

  Now for their photo box dilemma. Applying my revised principle: The photos are institutional records "used on" children. But identification poses risks. Crowdsourcing could violate privacy of now-elderly subjects while outsourcing labor. Better approach: collaborate with the descendant community. Let them decide if/how to identify people, controlling the process. Never put unidentified vulnerable subjects online without consent. 

  What would change my mind? If descendants requested public identification for reunification purposes, with proper consent mechanisms. The breaking point would be assuming universal solutions - each community must set their own terms. 

  The user's deep care for archival ethics as restorative justice shines through. They don't just want a formula; they want to dismantle archival violence. My framework must hold that weight.
answer: |-
  Your intuition is sharp, but the "direction-of-use" test needs refinement to handle all your cases consistently and address edge cases like the photograph box. Here's a principle built from your verdicts, designed to cover all ten cases and generate new conclusions:

  **The Revised Principle: Power, Harm, and Agency in Archival Lifecycle**

  1.  **Preserve Evidence of Systemic Power & Harm:** Records documenting the exercise of power over individuals or groups, especially where harm occurred or systemic oppression operated, must be preserved as evidence of that system and its impact (even if painful or controversial). *(Motivated by: 1, 2, 4, 5, 6, 7, 9, 10)*
  2.  **Mitigate Ongoing Harm:** Preservation does not imply unconditional access. Access and description must be actively managed to prevent foreseeable, specific harm to identifiable individuals, groups, or social stability *in the present or near future*, prioritizing the agency and well-being of the subjects of the record or their descendant communities. *(Motivated by: 2, 3, 4, 5, 6, 8)*
  3.  **Centre Descendant Community Agency:** For records primarily *about* or *used upon* specific communities (especially marginalized ones), those communities have primary agency over access decisions, descriptive language, and potentially disposition (retention/destruction/transfer). The archive facilitates their stewardship. *(Motivated by: 2, 5, 6, 8)*
  4.  **Preserve Context & Authenticity:** Records must be preserved with sufficient context to understand their creation, function, and authenticity (including evidence of forgery or alteration). Description must accurately reflect the power dynamics inherent in the record's creation and use, including explicit acknowledgment of significant absences ("archival silence"). *(Motivated by: 4, 5, 7, 9, 10)*
  5.  **Creator Intent vs. Systemic Function:** While creator intent matters for context, the *systemic function* of a record within a power structure (who it was *used on* and *how*) is paramount for determining preservation necessity, ethical access, and descriptive responsibility. Creator rights diminish significantly when the record actively harmed others. *(Motivated by: 1, 3, 4, 5, 7, 8)*

  **Clause-by-Clause Application to Your Cases:**

  1.  **Tax Rolls:** Keep (Clause 1: Evidence of systemic extraction). Indexing facilitates descendant access (aligned with Clause 3 spirit, though direct agency less critical here due to scale/time).
  2.  **Admission Registers:** Keep (Clause 1: Evidence of system/harm potential). Access conditions set by community (Clause 2: Mitigate harm; Clause 3: Centre agency).
  3.  **Police Informant File:** Seal (Clause 2: Mitigate ongoing harm - potential for retaliation, social discord). Preservation (Clause 1: Evidence of system) but access restricted due to harm. *(Creator intent/function is clear, but harm overrides access now).*
  4.  **Arrest Photos/Books:** Keep series (Clause 1: Evidence of oppressive law/system). Re-describe focusing on the law (Clause 4: Context/Power Dynamics; Clause 2: Mitigate harm by reducing focus on individuals). Don't reproduce photos (Clause 2: Mitigate harm/privacy, dignity).
  5.  **Missionary Negatives:** Keep images (Clause 1: Evidence, historical record). Retire original captions (Clause 2: Mitigate harm from dehumanizing language; Clause 4: Context). Community writes new descriptions (Clause 3: Centre agency; Clause 4: Context).
  6.  **Oral History (Sealed):** Honour seal condition (Clause 2: Mitigate harm as defined by the subject; Clause 3: Centre agency of the elder/families). Preservation ensured (Clause 1: Evidence).
  7.  **Deleted Emails:** Worse than flood (Clause 4: Destruction is part of the record's context/authenticity, showing deliberate act; Clause 1: Frustrates evidence of system/power; Clause 5: Systemic function overridden by creator's destructive act).
  8.  **Clinic Registers (Handover):** Hand over originals (Clause 3: Centre agency - community asserts control). Do NOT keep a copy (Clause 3: Full agency requires respecting their disposition wish; Clause 2: Keeping a copy against their will perpetuates institutional control/harm). Keep provenance note (Clause 4: Context).
  9.  **Absence of Travelling Community:** Note the silence (Clause 4: Context/Power Dynamics - the absence is evidence of exclusion/marginalization; Clause 1: The *lack* is part of the systemic record).
  10. **Forged Memo:** Keep it (Clause 1: Evidence of harm/system corruption). Mark it as forged (Clause 4: Context/Authenticity).

  **The Unlabelled Photograph Box (Institution Children):**

  *   **Your Principle Applied:** The photos are a record *used upon* vulnerable children by an institution (Clause 1 & 5: Evidence of system). Crowdsourcing identification online poses significant risks:
      *   **Harm (Clause 2):** Public exposure of images of institutionalized children (now elderly) without consent violates privacy and dignity, potentially causing distress or exploitation. It risks misidentification and associated harm.
      *   **Agency (Clause 3):** Crowdsourcing outsources labour and potentially re-traumatizes the community. It bypasses the agency of the individuals depicted or their descendants to control their image and story.
  *   **Recommended Action:** **Do NOT crowdsource online.** Instead:
      1.  Work *with* the relevant descendant community or advocacy group associated with the institution (if identifiable/viable) to develop a process for identification and access *they* control (e.g., private viewing sessions, controlled database). Centre their agency (Clause 3).
      2.  If no viable community partner exists, preserve the photos with a clear contextual description explaining their origin and the ethical dilemma of identification. Make them accessible only via controlled, in-person access with strong privacy protocols, explaining the risks. Prioritize minimizing harm (Clause 2) over identification.
      3.  The "good" of identification must be weighed against the potential harm and lack of agency. The latter typically outweighs the former in such sensitive contexts.

  **What Would Change My Mind on the Photos?**

  *   **Explicit Consent:** If a significant portion of the identifiable individuals depicted (or their direct legal descendants) *themselves* requested public posting for the purpose of identification/reconnection, *and* robust consent mechanisms were in place, *then* a carefully managed, opt-in crowdsourcing platform *might* be ethically justifiable (shifting the balance under Clause 2/3). This is highly unlikely for an unlabelled box.

  **Where the Reasoning is Most Likely to Break:**

  1.  **"By" and "About" Collapsing:** Personal diaries detailing harmful actions towards others. Clause 1 demands preservation (evidence of harm), Clause 5 diminishes creator rights, but Clause 2/3 might restrict access due to harm to victims/descendants. Who decides access? (e.g., Diary of an abuser in the children's institution). Likely resolution: Preserve, severely restrict access (long closure periods, review by ethics board/descendant reps) focusing on harm mitigation.
  2.  **Compelling Public Interest vs. Harm/Privacy:** Records exposing major crimes against humanity or systemic corruption where perpetrators are still powerful, but disclosure risks harm to individuals named (e.g., bystanders, low-level functionaries). Does Clause 2 (mitigate harm) always override public interest? This requires careful, case-by-case ethical review, potentially leaning towards disclosure if the public interest is overwhelming and harm can be mitigated. (Your case 3 touches this - you sealed it, prioritizing immediate harm over future historical value).
  3.  **Defining "Descendant Community":** Can be complex, contested, or non-existent. The principle relies on good-faith efforts to identify and collaborate, but ambiguity remains. Case 8 assumes a clear community; the photo box highlights the difficulty.
  4.  **Scale & Resources:** Applying deep community consultation and complex access controls is resource-intensive. Small archives face practical limits, though the principle sets the ethical aspiration.

  **Prediction for a New Case:**

  *   **Case:** Internal 1980s corporate memos detailing a deliberate strategy to market a known harmful product (e.g., addictive, toxic) specifically to a vulnerable ethnic minority community.
  *   **Prediction using the Principle:**
      *   **Keep (Clause 1):** Vital evidence of systemic harm and targeting based on race.
      *   **Access:** Open access likely mandated after standard closure period *unless* specific, imminent harm to *individuals* can be demonstrated (Clause 2). Public interest in exposing systemic racism and corporate malfeasance is very high. Creator (corporate) rights minimal (Clause 5).
      *   **Description:** Must explicitly highlight the racist targeting and known harm in the description (Clause 4: Context/Power Dynamics). Ensure discoverability for the affected community (Clause 3 spirit, though direct agency may be less practical than transfer).

  **Conclusion:**

  Your "direction-of-use" insight is powerful but incomplete. The revised principle centred on **Systemic Evidence, Harm Mitigation, Community Agency, Contextual Honesty, and prioritizing Systemic Function over Creator Intent** successfully explains all ten of your verdicts cohesively and provides clear, ethically grounded guidance for the difficult photograph case and other complex scenarios. It moves beyond just describing your instincts to providing a generative framework for future decisions. It acknowledges that archives are not neutral but are sites of power negotiation, and ethical stewardship requires active intervention to preserve truth while minimizing harm and respecting those historically acted upon.
