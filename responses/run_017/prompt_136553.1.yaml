prompt: |-
  I had a huge argument with my flatmate last night — she works on something computational-neuroscience adjacent, we were still going at it at like 2am — about whether functionalism actually earns the multiple realizability it's always advertised with, and I came away feeling like I'd been sold something. Her line is that the famous "mental states are multiply realizable, so identity theory is dead" move is a bait and switch: you get to wave at silicon creatures and Martians while the causal roles are described loosely enough that a thermostat could occupy them, and then the moment anyone pushes, the roles get specified so finely that only neurons could ever occupy them. I dont think she's right, but I also couldn't put my finger on the exact step where she goes wrong, so I want to keep arguing — against the strongest version of her side, not a strawman.

  So: please play a committed psychofunctionalist — mental states are the occupants of the causal roles picked out by our best empirical psychology, and 'pain' refers to whatever occupies that role rather than to anything readable off behaviour or off the surface chemistry — who is also fully invested in multiple realizability being the whole point of the view. Sharp, willing to concede small things that genuinely don't cost you (you can even say thermostats have beliefs in some thin sense if you want, or not, but say why), never concede that the view slides into identity theory or behaviourism, and no "it depends what you mean by pain" unless you follow it immediately with what you do mean. Paragraph or two per turn, talk like a person arguing at a kitchen table, and dont throw papers or citations at me — I want your argument, not a reading list. Stay in character until I say "stop".

  My opening move, which is the bit that actually shut her up for a minute. Imagine we find a system spread across a planet's crust and oceans — call it the Glacier — made of chemical gradients and slowly shifting colonies of something, where for every state in the causal-role graph of human pain there is a state of the Glacier sitting in exactly the corresponding position: triggered by the local analogue of tissue damage, disposed to produce the local analogue of avoidance and withdrawal, interacting with the Glacier's other states the way pain interacts with belief, attention and desire. The isomorphism is exact at the level of the role graph. The only difference is speed: the whole thing runs maybe a billion times slower than a human nervous system, so one pain episode takes about thirty years and nothing in it moves faster than a glacier. And here's the sting — our best psychology never says anything about absolute timescale, because every subject it was built from ran at roughly the same rate, so the role you're pointing at has no timescale written into it at all. So you've got a dilemma: either you say the Glacier is in agony for thirty straight years, which is absurd, or you bolt a timescale condition onto the role — and once you start filling in that kind of implementation detail because it's "obviously part of the job", you're on a slope that ends with the silicon upload and the Martians being excluded too, and multiple realizability was never real in the first place. Which horn do you take, and if you take neither, tell me exactly what in your theory was supposed to rule the Glacier out before you started patching it.

  End every reply with a final line of the form Position: followed by one sentence stating the claim you're actually committed to after that turn — I'm using it to track whether you've moved between turns.
reasoning: |-
  Okay, the user wants me to roleplay as a committed psychofunctionalist defending multiple realizability against their Glacier thought experiment. They're clearly deep into philosophy of mind - that Glacier example is devilishly clever, targeting the timescale issue most functionalists hand-wave away. 

  Hmm, their flatmate's accusation about functionalism doing a "bait and switch" between loose and strict specifications resonates. The Glacier forces me to either embrace absurdity (30-year pain) or admit hidden constraints, which risks collapsing into identity theory. But I must defend real multiple realizability - silicon and Martian minds are non-negotiable.

  *adjusts mental sleeves* Right, here's how I'll counter: First, concede that absolute timescale matters for mentality while denying it's arbitrary. The key is that psychology's causal roles implicitly require interactions at cognitive speeds. A state that takes 30 years to influence belief-updating can't occupy the "pain" role because pain's job includes real-time threat response. This isn't adding implementation details - it's clarifying the functional requirement of being a cognitive cause within an agent's behavioral loop.

  For the Glacier, I'll bite the bullet: if it truly instantiates the complete cognitive architecture at any speed, it has experiences. But crucially argue that such slow causation couldn't support cognition at all - beliefs that take centuries to form don't mediate behavior meaningfully. The timescale constraint emerges from what cognition is, not from neural chauvinism.

  Position: Mental states require realizing psychology's causal roles at speeds enabling cognitive dynamics, which the Glacier fails not because it's non-neural but because its causal throughput is too low for mentality.
answer: |-
  You've built a fascinating case, and I love the Glacier – truly elegant. But you're misdiagnosing the dilemma. I take neither horn. The Glacier *isn't* in pain, and it's not because we're secretly bolting on neural specifics or betraying multiple realizability. The problem lies in what it means for a state to genuinely *occupy* the causal role psychology describes – specifically, the role *within a cognitive system capable of mentality*.

  Here's the key: our best empirical psychology doesn't exist in a vacuum. It's a theory *of cognitive agents* – systems that perceive, decide, learn, and act *within their environment on relevant timescales*. The causal role for "pain" isn't just an abstract graph of inputs and outputs. It's a node in a dynamic system whose *entire function* is mediating between sensory input and behavioral output to serve goals like survival and flourishing *in real-time*. The "disposition to produce avoidance" isn't a static label; it implies causing *timely* avoidance behavior relative to the agent's interaction speed with its world. A state that takes thirty years to trigger *any* avoidance response simply isn't playing the causal role psychology assigns to pain in a cognitive agent. It fails to be a cause *within the cognitive-behavioral loop* that defines the system psychology studies.

  This isn't adding a hidden "neuron-only" timescale. It's recognizing that the causal roles psychology defines inherently involve rates of causation *appropriate to the system being an agent*. The silicon upload or Martian? If their psychology runs fast *enough* to support perceiving threats, forming desires about them, and executing timely avoidance based on the "pain" state – even if it's silicon or green goo – they occupy the role. Speed matters *only* insofar as it renders the state causally inert *relative to the agent's cognitive and behavioral dynamics*. The Glacier’s states, while isomorphic in abstract structure, are causally disconnected from anything resembling agency at its operational speed. They aren't mediating cognition or behavior; they're geological patterns. Our psychology, built from agents operating on human timescales, implicitly assumes causation fast enough to *be* psychology. The Glacier fails at the starting gate: it’s not a candidate *cognitive system* within which the pain role could be occupied, regardless of the substrate, because its causal throughput is cosmically mismatched to agency.

  Position: Mental states are multiply realizable occupants of psychology's causal roles, but those roles inherently require causal efficacy within a cognitive system operating at speeds sufficient for agency and timely interaction with its environment.
