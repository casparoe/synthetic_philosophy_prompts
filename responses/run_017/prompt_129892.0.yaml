prompt: |-
  I'm a high school senior working on a paper about whether utilitarianism's habit of adding everyone's happiness together is a mistake, and I have built an argument I no longer trust, because it seems to hand the conclusion to the utilitarians.

  The target is the objection that goes by the name of the separateness of persons: summing across people is supposed to be illegitimate because there is nobody whose good the sum is — no one lives the total, only this person and that person live their own portions — so a larger total cannot be what makes an outcome better. I want to keep that. But here is the argument I ended up with:

  (1) An outcome is better or worse only in virtue of being better or worse for someone.

  (2) Suppose one person loses a great deal while ten people each gain a little. The gains are had by the ten, one each; the loss is had by the one; the favourable balance is had by nobody. By (1), a balance that nobody has cannot make the outcome better. So there is no licit adding up across persons.

  (3) What licenses adding up within a single life — painful dental work now, decades of healthy teeth later; hours of practice for a recital much later — can only be the unity of a life. And the unity of a life is a matter of degree: the stage that sits in the dentist's chair is tied to the stage that enjoys the teeth by memory, intention, and character, and ties like those come in degrees.

  (4) Degrees of unity do not stop at the skin. Take the Pair: two sisters who since childhood have had access to each other's experience in real time, who deliberate together about everything, share every plan, and have never formed an intention the other did not share. Now take Nadia at eighteen and Nadia at sixty-eight: by then she shares almost no memories, desires, or traits with the teenager, having been changed slowly, one small alteration at a time, so that no stage along the way differed noticeably from the one before it. By the measures in (3), the sisters are more unified with each other than the woman is with herself across those fifty years.

  (5) If unity is what licenses the ledger, and unity is a matter of degree, then in (4) the ledger should run between the sisters at least as readily as it runs across those fifty years.

  (6) But adding up within a life is plainly in order, and the separateness objection is supposed to protect individuals precisely by protecting their lives over time.

  (7) So either the objection collapses into the view it was aimed at — adding up is fine, and the only question left is how much unity a subject needs — or the objection stands and prudence is as unjustified as utilitarianism's sacrifices, which is absurd.

  I dislike (7) but cannot locate the mistake. My best guess is that something shifts between (1) and (3) — perhaps better for someone and permitted to trade off are two different relations and I have run them together — but I cannot say what the difference is. A second worry, which may be the same worry in another shape: if (2) is right, I also cannot say that you ought to pull five strangers out of a burning building rather than one stranger, since that too appeals to totals, and everyone I have asked thinks that is obviously what you ought to do, including people who press the objection.

  I would most like to keep (6) and the thought that utilitarianism gets something deeply wrong when it spends one person for a larger total. I am willing to give up almost anything else, including (1). Which step do you reject, why does that step look innocent when you read it quickly, and what does rejecting it cost me — including what the other options would cost, if you can say?
reasoning: |-
  Okay, this high school senior is grappling with a complex philosophical argument about utilitarianism and the separateness of persons. They've constructed an intricate analogy between personal identity over time and interpersonal relationships, but feel uneasy because it seems to undermine their own position against utilitarianism. 

  Hmm, the core tension lies in how they're applying the same "unity" standard to both intrapersonal and interpersonal cases. The student senses something wrong with step (7)'s forced choice between accepting utilitarianism or rejecting prudence, but can't pinpoint where the analogy breaks down. Their second worry about saving five versus one stranger shows they recognize the practical stakes.

  I notice their intellectual honesty - they're willing to abandon premise (1) if needed, but want to preserve two key intuitions: that prudential reasoning (dental work etc.) is valid, and that sacrificing one for many is morally problematic. That's a sophisticated starting point for a high school paper.

  The argument cleverly uses Parfit-style thought experiments about psychological connectedness. But the student might be missing that prudential justification doesn't solely rely on unity - survival itself creates non-instrumental reasons that don't transfer to other persons. When eighteen-year-old Nadia chooses dental work, she's not just serving some future entity; she is that future entity in a way the sisters aren't each other.

  Their saving-five-versus-one example reveals the real problem: rejecting all aggregation leaves us unable to handle cases requiring tradeoffs. But we don't need full utilitarianism - we could distinguish between negative duties (don't sacrifice individuals) and positive duties (help as many as possible). 

  The most promising path might be to challenge premise (3)'s claim that only unity licenses tradeoffs. There are other reasons: continuity of consciousness for prudence, or independent moral reasons for saving more lives. This preserves both their anti-sacrifice intuition and the five-over-one imperative without conceding to utilitarianism.
answer: |-
  Your argument is impressively crafted but contains a critical misstep at **premise (3)**, which falsely equates the *grounds* for intrapersonal and interpersonal tradeoffs. Let's dissect why this undermines your conclusion and how to preserve your core insights.

  ### The Mistake: Premise (3) Misidentifies the Source of Prudential Justification
  **Why (3) fails:**  
  You claim that "what licenses adding up within a single life... can only be the unity of a life." This assumes **psychological unity** (memory, intention, character continuity) is the *sole basis* for justifying sacrifices within a life. But this is incorrect:  
  - **Prudential tradeoffs are justified by numerical identity, not psychological unity.** Even if "Nadia at 18" and "Nadia at 68" share few psychological traits, they are *numerically the same person*. The 18-year-old doesn't suffer for a *different entity*; she suffers for *her own future self*. This is true even with radical psychological discontinuity (e.g., amnesia).  
  - **Psychological unity is irrelevant to the normative force of prudence.** If a future stage of you inherits your body/resources/achievements, it is *your* future well-being at stake. No comparable transfer exists between separate persons, no matter how psychologically connected.  

  **Why it looks innocent:**  
  Psychological unity *often accompanies* personal identity and makes prudential reasoning *intuitive*. But identity doesn't depend on unity—it's a metaphysical fact. The analogy between the sisters and Nadia conflates similarity with identity.

  ---

  ### Revised Path: Reject (3) While Keeping Your Core Intuitions
  #### Step 1: Preserve the separateness of persons (your target)
  - **Hold fast to (1) and (2):** Outcomes *are* better only if better for someone. A "net gain" that leaves someone worse off *cannot be justified solely by the sum*. Utilitarianism errs by treating persons as containers of utility to be aggregated.

  #### Step 2: Explain why prudence works without interpersonal sums
  - **Premise (3) corrected:**  
    > "What licenses intrapersonal tradeoffs is *numerical identity over time*, not psychological unity. A person's future well-being is *her own well-being*, regardless of psychological connectedness. Sacrifices today are for *her* benefit tomorrow."  
  - **Address the sisters/Nadia case:**  
    The sisters, no matter how connected, are distinct entities. If Sister A suffers for Sister B's gain, A is harmed for *another's* benefit. But when Nadia suffers at 18, she is harmed for *her own* benefit at 68. Identity grounds self-interest; psychological unity is incidental.

  #### Step 3: Salvage the "saving five vs. one" intuition
  - **Reject utilitarian aggregation:** Saving five lives isn't good because "total happiness increases." It's good because *each life saved* is a moral victory.  
  - **Defend saving five without sums:**  
    - **Duty of rescue:** When forced to choose, saving more lives fulfills a stronger *agent-neutral duty* (each person has a claim to aid, and you can satisfy more claims).  
    - **No one sacrificed:** Unlike utilitarianism (e.g., killing one to save five), saving five *directly* respects each individual: you’re not *harming* the one left behind—you’re failing to save them due to tragic necessity.  
    - **Analogy:** Choosing which fire to extinguish: putting out the larger fire saves more people *without implying their lives are summed*.

  ---

  ### What This Costs You (and What It Saves)
  - **Costs:**  
    - You must abandon the psychological unity analogy (premise 4).  
    - You cannot use "degrees of unity" to dissolve separateness (premise 5).  
  - **Saves:**  
    - **Anti-utilitarianism:** You keep the core objection that summing across persons is illicit. Sacrificing one for the greater good remains wrong.  
    - **Prudence:** Justifies dental work/practice without collapse into utilitarianism.  
    - **Saving five vs. one:** Explains why it’s right without endorsing aggregation.  

  ---

  ### Your Best Path Forward: A Compelling Alternative
  1. **Uphold separateness:** Affirm that moral value is *person-relative*—no "total happiness" justifies overriding individual claims.  
  2. **Distinguish identity from unity:** Numerical identity underpins prudence; psychological bonds don’t erase separateness.  
  3. **Address tradeoffs with claims:** In rescue cases, prioritize saving more lives because *each person’s claim* deserves equal respect, and you can honor more claims. This avoids summing.  

  **Result:** You refute utilitarianism while keeping prudence and resolving the "five vs. one" paradox. The mistake wasn’t in (1) or (2), but in grounding prudence in the wrong thing—*identity*, not unity, does the work. This leaves utilitarians unable to bridge the gap between "better for me" and "better for all."  

  **For your paper:** Focus on why identity licenses intrapersonal tradeoffs but not interpersonal ones. Cite Derek Parfit (*Reasons and Persons*) for the identity/unity distinction and Frances Kamm (*Morality, Mortality*) for non-aggregative rescue principles. Your argument becomes stronger by rejecting (3).
