prompt: |-
  You are a professional philosopher of biology — someone who genuinely knows the selected-effects versus causal-role literature (I think Millikan is one of the historical lot and Cummins one of the causal-role lot, but correct me if I've got it backwards) and who's also read enough real biology not to talk nonsense about sperm or symbionts. Before you write your final answer, please do a bit of unstructured brainstorming first: sketch two or three candidate principles, note which of my verdicts each one saves and which it wrecks, and only then settle on one. I'd rather see the trade-off than a polished answer. Please write in British English throughout (colour, organisation, and so on).

  I'm a retired marine biologist, got into philosophy of biology a couple of years ago, and I've been trying to work out what I actually think about biological function by going case by case with my gut before I read what anyone else says. Here's where I've landed, and I want to know whether there's a principle behind it.

  A fish's heart: its function is to pump blood. Yes, obviously. But the thumping noise the heart makes — no function, just a side effect, even though it's useful to me when I'm dissecting and trying to locate the thing.

  A nudibranch that steals stinging cells from the hydroids it eats and keeps them in its own skin for defence: I want to say those cells have a function in the slug, even though the slug didn't make them and their whole history is in a cnidarian.

  A hermit crab sitting in a whelk shell: I want to say no, the shell has no function, it isn't one of the crab's parts. But I definately can't see what seperates this from the nudibranch case, and that bothers me.

  An enzyme from the gut that, in some lineage, ends up being expressed in the eye lens where it just sits there being transparent: if selection has been tinkering with it in its new job for a while, I'm happy to say its function is now lens work, not digestion. If the recruitment happened recently in one population and hasn't been selected on at all, I want to say no — it's merely doing a job.

  A whale's pelvic remnant, now anchoring a couple of muscles: not a function, a leftover doing a job. Which I realise is in tension with the lens case unless all the work is being done by "selection has since acted on the new role".

  A mutation that was neutral, drifted up to high frequency, and then — because the bay warmed — turned out to keep the whole population alive: no function. It just happens to help. I feel strongly about this.

  A lymphocyte receptor thrown together by random somatic shuffling that happens to bind a virus the animal has never encountered: its function is to bind things, maybe even that virus. Which looks exactly like the previous case, and yet I've got opposite verdicts.

  Ordinary sperm in a snail: function is to fertilise an egg, even though essentially none of them ever do and each one's actual fate is to die. The weird little non-fertilising parasperm in the same ejaculate: I'm not sure. I lean towards their function being to help the fertile ones along, but I can't say why I'm less confident here than about the heart.

  A transmissible facial tumour cell line in Tasmanian devils: the cell lineage has a selection history of its own for getting into new devils. I don't want to call transmission one of the devil's functions, but saying the cell lineage has the function of transmitting seems fine to me. So functions look like they're indexed to some system or level, not to an animal as such.

  A dairy cow's udder: function is milk production, even though we did the selecting and it's arguably bad for the cow. A broiler chicken's collapsing legs: no function, that's a side effect of selecting for growth.

  My own pacemaker: has a function, someone designed it. A beaver's dam: also has a function, and nobody designed it — so intentions can't be what's doing the work.

  Here's the rough principle I've been toying with: a part or trait T of a system S has the function F if and only if (a) T is currently capable of doing F, and (b) T is present because, in the history of S or of the lineage S belongs to, things like T doing things like F is what kept T around — with the artefact cases handled by swapping in "because someone put it there to do F".

  So: test that principle against the cases above and repair it where it breaks. Tell me exactly which clause each case is motivating. Tell me which of my verdicts no sane principle can save, and where I'd get a cleaner account by dropping one. Tell me which of my two hard pairs you think is genuinely inconsistent rather than subtly different, and what you'd do about it. And give me your principle's verdicts on cases I haven't listed — say, whether an enzyme in one of my gut bacteria has a function in me, and whether anything still has a function in a population down to thirty individuals in a sanctuary where selection has effectively stopped. I've no stable verdict on that last one at all, and no stable verdict either on a protein designed by a computer and expressed in a bacterium, which works beautifully and has no selection history whatsoever. Don't send me off to read anything — I can't get to a university library easily and I've got quite enough on the pile at home.
reasoning: |-
  Hmm, the user is a retired marine biologist who's gotten into philosophy of biology and wants to test their intuitions about biological functions against a principle they've been developing. They've provided several cases where they have strong intuitions about whether something has a function or not, and they want me to evaluate their proposed principle.

  The user has clearly done their homework - they know the terminology (Millikan for selected-effects theory, Cummins for causal-role theory) and have thought deeply about various biological scenarios. Their cases cover everything from fish hearts to parasitic sperm cells to transmissible tumors. They're particularly concerned about apparent inconsistencies - why they judge the nudibranch's stolen stinging cells as functional but not the hermit crab's borrowed shell, or why a lymphocyte receptor has a function but a mutation that saves a population doesn't.

  Their proposed principle has two main components: (a) current capability to perform F, and (b) historical selection for F (with an intentional design clause for artifacts). I need to test this against all their cases and see where it holds up and where it breaks down.

  Looking at their cases:
  - Fish heart: works perfectly - pumps blood by design and history
  - Heart thumping: fails (b) - not selected for noise
  - Nudibranch stinging cells: tricky - the cells weren't selected in the slug, but the slug's ability to use them was
  - Hermit crab shell: clearly fails (b) - no selection history with the crab
  - Enzyme recruitment: hinges on whether there's been subsequent selection
  - Whale pelvis: fails (b) since it's vestigial
  - Beneficial mutation: fails (b) since no selection history
  - Lymphocyte receptor: works because receptors are selected for binding capacity
  - Snail sperm: works for eusperm, less clear for parasperm
  - Transmissible tumor: works if we index to the cell lineage
  - Udder vs chicken legs: udder passes (b) via artificial selection, chicken legs fail (b)
  - Pacemaker and beaver dam: handled by the design clause

  The main tension points are:
  1. Nudibranch vs hermit crab: the principle explains the difference since only the nudibranch has a selection history for using the stinging cells
  2. Enzyme recruitment vs whale pelvis: principle distinguishes based on subsequent selection
  3. Mutation vs lymphocyte: principle distinguishes based on whether the system was selected for the capacity

  For the gut bacteria enzyme in humans - by strict selected-effects, it only has function relative to the bacteria, not to the human host. For the sanctuary population - if selection has stopped, nothing has functions anymore by this view. For the designed protein - it would have function via the design clause.

  The user seems to have sophisticated intuitions that mostly align with selected-effects theory, but they're troubled by cases where the "system" isn't clear (like the tumor) or where design seems relevant (like the pacemaker). Their principle is essentially selected-effects plus an artifact clause, which handles most cases well. The main cost is denying functions in non-selected contexts like the sanctuary population or the beneficial mutation.

  I'll organize my response to first brainstorm candidate principles, then test against cases, identify tensions, and finally refine their principle while being clear about what intuitions we might need to sacrifice for consistency.
answer: |-
  Right, let's tackle this systematically. As requested, I'll brainstorm first in British English, lay out the trade-offs, then refine your principle. You've got a sharp set of intuitions that largely track selected-effects (SE) theories (Millikan, Neander) but strain against purely causal-role (CR) views (Cummins). Your tension points often hinge on **lineage-specific selection history** versus **current utility** or **system-level contributions**.

  ### Brainstorming Candidate Principles
  1.  **Pure Selected-Effects (SE):**  
      *T has function F in system S iff T is present in S (or its lineage) because there was past selection *for* T doing F in ancestors of S.*  
      - **Saves:** Fish heart (selected for pumping), whale pelvis (not selected for anchoring), mutation in warmed bay (no past selection), sperm (selected for fertilising), transmissible tumour (selected *in its own lineage* for transmission), udder (artificial selection for milk), broiler legs (not selected *for* collapsing), pacemaker (designed, so intentional 'selection').  
      - **Wrecks:** Nudibranch stinging cells (selected in *hydroid* lineage, not nudibranch), enzyme recruited to lens with *no* subsequent selection (no history in *that* role), lymphocyte receptor (somatic novelty, no *germline* selection for *that* virus), non-fertilising parasperm (if no selection *for* their helping role), beaver dam (no selection on beavers *for* dam-building?).

  2.  **Modified Selected-Effects + Artefacts:**  
      *T has function F in S iff:*  
      *(a) T is currently capable of F, and*  
      *(b) T’s presence is explained by: (i) past selection *for* F in the lineage of S, OR (ii) intentional design *for* F.*  
      - **Saves:** Most SE cases above + beaver dam (if we argue dams *were* selected for in beaver lineage). Still wrecks: nudibranch (history wrong lineage), novel lymphocyte receptor (no germline history), parasperm ambiguity, enzyme with *no* post-recruitment selection.

  3.  **Causal-Role + Lineage Constraint:**  
      *T has function F in S iff:*  
      *(a) T is currently capable of F, and*  
      *(b) F contributes to some capacity C of S, and*  
      *(c) T is a *reproduced* part of S (i.e., developmentally or lineage-integrated).*  
      - **Saves:** Nudibranch cells (contribute to defence, integrated), enzyme in lens (contributes to sight, integrated), lymphocyte receptor (contributes to immunity, reproduced in somatic lineage), parasperm (if they help, integrated), gut bacteria enzyme in you (contributes to digestion, integrated symbiont).  
      - **Wrecks:** Heart thumping (contributes to dissection but not organismal capacity), hermit crab shell (not reproduced by crab), whale pelvis (contributes but not reproduced *for* that), mutation (not reproduced *for* benefit), broiler legs (reproduced but collapse doesn't contribute), transmissible tumour (reproduced but not *for* devil's capacities).

  **Trade-off Summary:**  
  - Your principle (SE + artefacts) handles *most* cases but struggles with **exaptations without subsequent selection** (lens enzyme pre-selection, whale pelvis) and **somatic/lineage-mismatched traits** (nudibranch, lymphocyte).  
  - Pure SE wrecks your nudibranch and lymphocyte verdicts; CR wrecks your whale pelvis and mutation verdicts.  
  - Your hardest pairs:  
      * **Nudibranch vs. Hermit Crab:** SE cleanly separates them (selection *for* integrating stinging cells in nudibranch lineage vs. none for crab shells). Your intuition here is SE-consistent.  
      * **Mutation vs. Lymphocyte Receptor:** These *are* subtly different. The mutation has no selection history *at all*. The lymphocyte receptor is produced by a mechanism (V(D)J recombination) *selected for* generating diverse binders. Its function is to bind antigens *because* that mechanism was selected for binding. Your verdicts here are defensible under SE if we index carefully.

  ### Refined Principle & Case Analysis
  **Your Principle Repaired:**  
  *T has a function F in system S iff:*  
  *(a) T is currently capable of F (in typical conditions), and*  
  *(b) T’s presence is explained by:  
   (i) past selection *for* F in the lineage that produced T *as a part of S*, OR  
   (ii) intentional design *for* F (for artefacts).*  
  *Clarification: "Lineage that produced T as a part of S" means we must specify the relevant biological system (cell, organism, cell lineage) when attributing function.*

  **Case Verdicts & Clause Motivation:**  
  1. **Fish heart (pumping):** ✓ (a), (b-i) – Selected in fish lineage.  
  2. **Heart thumping:** ✗ (b) – Not selected for noise.  
  3. **Nudibranch stinging cells:** ✓ (a), (b-i) – *The nudibranch’s ability to sequester/house cells* was selected for. Cells themselves are ‘tools’ with derived function in *this system*.  
  4. **Hermit crab shell:** ✗ (b) – Shell not produced/reproduced by crab lineage.  
  5. **Enzyme in lens (post-selection):** ✓ (a), (b-i) – Selected *in eye lens role* in lineage.  
  6. **Enzyme in lens (no selection yet):** ✗ (b) – No selection for lens role; merely doing a job.  
  7. **Whale pelvic remnant:** ✗ (b) – Not present *because* it anchors muscles; selected for ancestral locomotion.  
  8. **Beneficial mutation (no history):** ✗ (b) – No past selection for warming adaptation.  
  9. **Lymphocyte receptor:** ✓ (a), (b-i) – Produced by a mechanism (V(D)J) selected *for* generating random binders. Function is antigen-binding *simpliciter*.  
  10. **Snail eusperm:** ✓ (a), (b-i) – Selected for fertilisation.  
  11. **Snail parasperm:** *If* they evolved via selection to aid eusperm, ✓ (b-i). If merely correlated by-product, ✗ (b). Your hesitation suggests unclear selection history.  
  12. **Devil transmissible tumour (transmission):** ✓ *in tumour cell lineage* (a), (b-i) – Selected for transmission in *tumour's* lineage. Not a function *of the devil*.  
  13. **Cow udder:** ✓ (a), (b-i) – Artificial selection for milk.  
  14. **Broiler chicken legs:** ✗ (b) – Collapse not selected *for*; side effect of selection for growth.  
  15. **Pacemaker:** ✓ (a), (b-ii) – Designed.  
  16. **Beaver dam:** ✓ (a), (b-i) – Dam-building behaviour selected for in beaver lineage.  

  **Unstable Verdicts Resolved:**  
  - **Gut bacteria enzyme in you:** Has function *in the bacterium* (SE: selected in bacterial lineage). Not a function *of you* – it’s a causal contributor, but not produced/maintained by *your* lineage for that role.  
  - **Sanctuary population (no selection):** Nothing has biological functions. Traits are vestiges doing jobs (whale pelvis analogue). SE denies functions without selection history.  
  - **Computer-designed protein in bacterium:** Has function via (b-ii) – intentional design. Like the pacemaker.  

  **Which Verdicts Must Go?**  
  - **Nudibranch Stinging Cells:** Your principle initially wrecked this (wrong lineage), but repair indexes to the *nudibranch’s* selected *mechanism*. Saved.  
  - **Lymphocyte Receptor:** Saved by noting the selected *system* (somatic recombination mechanism).  
  - **True Cost:** You must accept that **exaptations without subsequent selection** (lens enzyme pre-selection, whale pelvis) have *no function*. They merely contribute. If this feels wrong, you’d need to abandon SE for a CR view – but that wrecks your mutation/hermit crab verdicts.  

  **Hard Pair Resolution:**  
  - **Mutation vs. Lymphocyte:** Not inconsistent. Mutation: no selection *anywhere* for its effect. Lymphocyte: produced by a mechanism selected *for generating random effectors*. The binding *capacity* is selected, even if not the specific target.  
  - **Nudibranch vs. Hermit Crab:** Consistent under repair. Nudibranch has lineage selection for *utilising* foreign cells; hermit crab has no selection for *producing/integrating* shells.  

  **Final Principle:**  
  Stick with your repaired SE + artefacts principle. It captures ~90% of your intuitions by emphasising **lineage-specific selection history** and **system indexing**. The cost—denying functions in pure exaptations pre-selection—is philosophically coherent and biologically grounded. When you say "it's merely doing a job," you're acknowledging the absence of a *selected-effect history*. That’s the core insight.  

  If you want to soften this, consider adding: *"or (iii) T is a stabilised exaptation where F now contributes to fitness and maintenance in S"* – but this risks collapsing into CR and losing your mutation/hermit crab distinctions. Better to stay strict.
