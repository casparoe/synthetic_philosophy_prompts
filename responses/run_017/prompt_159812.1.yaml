  ### Classification Instrument: Uncertainty Reporting Position Tree

  This decision tree classifies authors' uncertainty reporting positions based on their responses to practical cases from flood and infrastructure risk assessment. The tree has 13 leaves, including all specified positions. Each question uses domain-specific language and can be answered in under a minute without philosophical training. The tree starts with case (b) to separate authors who provide numerical uncertainty statements from those who do not. Branching paths ensure no path exceeds five questions, and terminal paths map to named leaves.

  #### Decision Tree (Text Form)
  **Node 1 (Case b):** For a one-off event (e.g., a catchment exceeding its design flood within 20 years), when asked for the most you would pay to buy a ticket paying one unit if the event occurs, and the least you would accept to sell it:  
  - **A.** I give the same number for both.  
  - **B.** I give different numbers: the selling price is strictly higher than the buying price.  
  - **C.** I refuse to give numbers but will rank this event against others (e.g., "more likely than event X").  

  **Branch A (Same number):**  
  **Node 2A (Case d):** Two expert teams, equally credible, report probabilities of 0.3 and 0.7 for the same event. In your assessment:  
  - **A1.** I average them (e.g., report 0.5).  
  - **A2.** I report the range (0.3 to 0.7) but use a single number (e.g., the average) for recommendations.  
  - **A3.** I report both numbers with a note about the disagreement and use one (or a fixed combination) for recommendations.  
  - **A4.** I refuse to aggregate until the disagreement is explained; I report the conflict only.  

  **Node 3A (Case e):** In the widening scenario (switch set by fair coin; two monitoring stations where either both are wired correctly or South alone is cross-wired; no evidence about which), before seeing any printout, you would assign a probability of 0.5 to South printing 1. After seeing North print 1:  
  - **A1.** My probability for South printing 1 is still 0.5.  
  - **A2.** My probability for South printing 1 changes (e.g., to 0.6 or 0.4).  
  - **A3.** I no longer have a single probability; I would report a range or express increased uncertainty.  

  **Node 4A (Case f):** For two interventions with net benefits moving together (A: 3–9 units, B: 4–7 units), you must recommend one:  
  - **A1.** Recommend B: better worst case.  
  - **A2.** Recommend A: better best case.  
  - **A3.** Recommend either; leave the choice to the decision-maker.  
  - **A4.** Use a fixed weighting of best and worst cases (e.g., average) and recommend the higher-scoring option.  
  - **A5.** Recommend based on a single "most-likely" analysis.  

  **Branch B (Gap):**  
  **Node 2B (Case a):** For a HIGH reading, which gauge do you "stake a claim" on (i.e., base a binary decision on, such as issuing a warning)?  
  - **B1.** Gauge K (calibrated to read HIGH for half the reference set).  
  - **B2.** Gauge U (uncalibrated, unknown proportions).  
  - **B3.** Neither; I would only use a range or set of possibilities.  

  **Node 3B (Case e):** After seeing North print 1 in the widening scenario, compared to before, your uncertainty about South printing 1 is:  
  - **B1.** Unchanged: I have the same numerical probability or equivalent certainty.  
  - **B2.** Increased: I now have a wider range or express greater doubt.  
  - **B3.** Decreased: I now have a narrower range or express less doubt.  

  **Node 4B (Case f):** For the interventions (A: 3–9, B: 4–7), you must recommend one:  
  - **B1.** Recommend B: better worst case.  
  - **B2.** Recommend A: better best case.  
  - **B3.** Recommend either; leave the choice to the decision-maker.  
  - **B4.** Use a fixed weighting of best and worst cases and recommend the higher-scoring option.  
  - **B5.** Recommend based on a single "most-likely" analysis.  

  **Branch C (No numbers):**  
  **Node 2C (Case g):** After 10 years of records, your interval for a failure rate is 0.1–0.4. Ten more years of identical records arrive. If the width was due to limited data:  
  - **C1.** The interval narrows.  
  - **C2.** The interval stays about as wide.  
  - **C3.** It depends on why it was wide (e.g., systematic errors could persist).  

  **Node 3C (Case c):** For a quantity with thin evidence (one imperfect study, no prior records, never measured in the field), in your report:  
  - **C1.** I give a wide interval but not the full range (e.g., 0.2–0.8 for a probability).  
  - **C2.** I give the full interval (e.g., 0–1).  
  - **C3.** I give nothing quantitative.  

  **Node 4C (Case d):** For the two teams reporting 0.3 and 0.7, you:  
