answer: |-
  ## The Legibility Floor: Preserving Understanding in the Age of Epistemic Delegation

  The rise of powerful AI systems compels us to rethink what it means to understand a subject when we increasingly delegate cognitive tasks to opaque machines. Common worries about "deskilling" or "erosion of understanding" often remain frustratingly vague. I argue that the core threat is not delegation itself, but *illegible dependence*: reliance that drops the user below the **legibility floor**. This floor is the minimum level of **legibility** a user must retain over a delegated task to preserve their understanding. Legibility exists when a system's **failures** – instances where its output is likely wrong – are detectable by the user without redoing the task themselves. The user need not know the *correct* answer; something about the output’s implausibility, internal inconsistency, or deviation from known patterns must flag it as suspect. Below this floor, understanding decays. Above it, delegation can coexist with robust comprehension. This leads to a three-part claim: (1) the erosion-of-understanding worry targets illegible dependence, not dependence *per se*; (2) understanding is best analyzed as **retained alarm sensitivity** (detecting likely errors) plus **diagnostic ability** (identifying the *kind* of error made); and consequently, (3) when choosing tools, it is epistemically superior, *ceteris paribus*, to use a weaker system with predictable failures over a stronger one with opaque failures, even in education where the stronger system yields superficially superior results.

  To clarify, we must disentangle four distinct competences often conflated in these discussions:
  1.  **Unaided Production:** Generating a correct answer or solution independently.
  2.  **Recognition:** Identifying a correct answer when presented with it.
  3.  **Reconstruction:** Parsing and following a derivation or argument step-by-step.
  4.  **Error Detection (Alarm Sensitivity):** Notifying that a presented output is likely *wrong*, without necessarily knowing the right answer.

  My account identifies genuine understanding primarily with **retained alarm sensitivity (competence 4) combined with diagnostic ability**. Why not the others? Consider our two illustrative cases. The **veteran engineer** who hasn't manually calculated stress loads in years may struggle with unaided production (competence 1 decayed). Yet, glancing at an AI-generated structural analysis, she instantly spots an implausible force distribution – her alarm fires. Crucially, she can diagnose it as a probable boundary condition error. Her understanding remains robust, anchored in legibility. Conversely, the **student** meticulously reconstructs (competence 3) every line of an AI-generated mathematical proof, verifying its formal correctness. However, if asked *why* a step works or what the proof implies, they falter. They lack comprehension – the reconstruction was mechanical (mere competence 3), failing to trigger any independent judgment or alarm (absence of competence 4). Recognition (competence 2) is easily automated or mimicked without depth. Unaided production (1) is fragile – it decays with disuse and isn't essential for maintaining oversight. Reconstruction (3) is insufficient without the critical faculty to question *why* each step holds or what it contributes. Only alarm sensitivity (4), coupled with diagnosis, provides the active, critical engagement that sustains understanding amidst delegation.

  This redefinition faces powerful objections. The strongest **de-skilling argument** concedes that alarm sensitivity might be a distinct competence but insists it is *parasitic* on the underlying production and reasoning skills delegation erodes. If you never calculate, how can you retain the intuitive sense for plausible results? If you never construct proofs, how can you develop the nose for logical flaws? Vigilance atrophies without the raw material of practice; there is no stable perch above the legibility floor because the floor itself crumbles as delegation undermines the foundations of judgment.

  This points directly to the **self-reinforcement dilemma**. As a system becomes highly reliable, rationally trusting it even when a faint internal alarm pings becomes optimal. Yet, routinely overriding one's own nascent doubts corrodes the calibration of that alarm. Unused, the sensitivity dulls. Increased reliability, paradoxically, can destroy the very legibility it seemed to provide by making vigilance seem unnecessary. **I contend this dilemma is avoidable.** The solution lies in **deliberate calibration practices**. Users must periodically engage directly with the task – not necessarily to produce final outputs, but to solve representative sub-problems, scrutinize deliberately flawed examples, or critically audit *selected* system outputs in depth, focusing on *why* something might be wrong. This maintains the "muscle memory" for plausibility and error patterns without requiring constant full-scale production. Design features can help: systems might flag outputs they deem lower confidence, require user justification for accepting critical results, or even introduce controlled, detectable errors for training purposes. The legibility floor is stable only if actively maintained through calibrated engagement.

  A different challenge is the **simulacrum objection**. Imagine a user who, through extensive observation, memorizes that "System X tends to hallucinate historical dates after 3 PM" or "Outputs containing term Y are usually wrong." They accurately predict failures based purely on system quirks, with zero grasp of the underlying history or subject matter. Is this the "understanding" my account champions? **Emphatically not.** This is mere machine-legibility, a map of the tool's idiosyncrasies, not the territory. Retained alarm sensitivity and diagnostic ability must be grounded in the *domain*, not just the tool. The veteran engineer's alarm fires because the force distribution violates principles of mechanics she understands; her diagnosis names a domain-specific error. The simulacrum user's "alarm" is a behavioural predictor devoid of domain relevance. True understanding requires the alarm to be sensitive to *domain violations* and the diagnosis to reference *domain concepts*. The difference turns on whether the user's critical apparatus engages with the *subject matter* or merely the *artifact*.

  These arguments have concrete implications, especially for education. Consider a university department setting AI policy for coursework. Embracing the third part of my claim – the epistemic preference for weaker, more legible tools – demands difficult trade-offs. **The department should, for foundational courses, strictly limit or forbid the use of high-powered, opaque AI systems (e.g., advanced generative models for essay writing, complex problem-solving).** Instead, it should permit or even require tools with clearer failure modes: simpler calculators over symbolic math engines, curated research databases over open-web search summarizers, or outlining tools over full-draft generators. Crucially, assignments must demand outputs where the student's own critical engagement is visible: explanations in their own words, annotations justifying acceptance/rejection of AI suggestions, or analyses of deliberately flawed AI outputs. The department must accept that student work may be *less polished* – the "final product" may be weaker than what a cutting-edge AI could produce. This is the necessary trade-off. What is gained is the preservation of the legibility floor: students develop and retain the alarm sensitivity and diagnostic skills constitutive of genuine understanding. Without this, polished submissions become Potemkin villages of comprehension, masking profound epistemic dependence.

  The empirical linchpin of this argument concerns the stability of alarm sensitivity under delegation. **The finding that would most damage my position is robust evidence that, even with deliberate calibration practices, domain-grounded alarm sensitivity inevitably decays to near-useless levels after prolonged delegation of the relevant task domain, regardless of the user's initial expertise.** Such decay would mean the veteran engineer *does* eventually lose her knack for spotting implausible forces, and the student *cannot* develop it without constant unaided production. This would vindicate the strongest de-skilling objection, rendering the legibility floor inherently unstable and collapsing my distinction between legible and illegible dependence. Without a stable floor above which understanding can be preserved, the core argument fails, and delegation inherently risks cognitive atrophy. Until such evidence emerges, however, prioritizing legibility through tool choice and pedagogical design offers our best defence against the hollowing out of understanding in an age of increasingly powerful, but often opaque, cognitive partners.
