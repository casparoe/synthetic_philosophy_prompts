answer: |-
  The roof’s tarpaper still radiates the day’s heat. A single bulb casts long shadows. Miriam leans against the parapet, staring at the dark, empty lot below. Dev paces nervously, the bottle of cheap whiskey between them untouched. Distant train horns echo.

  **Miriam:** (Sighs) Forty-one years. That lot was a hardware store when I moved in. Then a laundromat. Then nothing. Now… forty-six units. Your rule lets me vote like I’ll see them built, lived in, crumble maybe. Like I’m planting a damn oak.

  **Dev:** It values stability. Commitment. Knowing you’ll live with the consequences. That’s fair, isn’t it? The people who stay shape the place.

  **Miriam:** (Turns, eyes sharp) Fair? You call it fair, weighting Mrs. Henderson’s vote – ninety-two, God bless her – like she’s got decades left? She declared twenty. Optimism or dementia, who knows? But her vote counts heavy *now*, against the project. While Carlos down in 3B, works two jobs, young family, *he’ll* live with it forty years… but he declared five. Looking for better. So his vote’s a feather. That’s your fair?

  **Dev:** (Stops pacing) The rule… it incentivizes planning. Declaring long *is* a commitment. It shapes behavior. Carlos *could* declare forty. He chooses not to. That’s data. His revealed preference.

  **Miriam:** Preference? Or survival? Declaring long means betting your life you won’t get priced out, or sick out, or just plain worn out by the noise *your* project brings. It’s a luxury. One Mrs. H can afford in her fog, and Carlos… Carlos can’t gamble like that. So your ‘fair’ weights the secure, the settled, the… terminal… over the strugglers. That’s your data?

  **Dev:** (Quieter) Okay. Okay, maybe the weight isn’t perfect. Maybe it favors… rootedness. But Miriam, that’s the point! The people *here now* built this neighborhood when it wasn’t shiny. They stayed through the hollow years. Doesn’t that loyalty earn them a say in its future?

  **Miriam:** Loyalty? Or trapping? And what about the loyalty of the people who *want* to be here? Who *need* this? The family on the waitlist downstairs, breathing stale air in a two-room apartment? The kids sleeping on couches across town? Don’t they get a stake? Or are they just… ghosts to you? Invisible until they magically appear and start paying rent?

  **Dev:** They’re not ghosts! They’re the whole reason! This city hemorrhaged people for decades. We need them *back*. We need to build for them. But how? How do you weigh a need against a lived reality? Your rule… it only counts bodies already inside the gates. It rigs the question! It asks the people who won the last game to decide if we even play the next one. Of *course* they’ll often say no!

  **Miriam:** (Leans in) So you want to hand a vote… to a *possibility*? To someone who might never come? Who might choose Buffalo instead? You built a machine, Dev, that counts years declared. Tangible. Measurable. Flawed, sure, but real. How do you measure a ghost’s commitment? Give it half a vote? A quarter? Based on what? A waiting list number? A sob story? You open that door, it’s not policy anymore. It’s sentiment. It’s manipulation. You rig it the other way.

  **Dev:** It’s not sentiment! It’s… acknowledging a claim. The city isn’t just a museum for the survivors. It’s a living thing. People *arriving*… that’s lifeblood. That’s the future paying its respects to the past by wanting to join it. Denying them any voice… it turns the insiders into gatekeepers. Curators of a dying exhibit. Is that what you fought for all these years? Just… preservation?

  **Miriam:** (Stares at the lot) I fought for a place that felt like home. For people who looked out for each other. People who *were* here. You talk about arrival like it’s dignity. It is. But dignity starts with a door that opens *to* you. Not with a hypothetical vote handed to you while you’re still banging on it from the outside. You can’t vote on the train you’re not on yet, Dev. You just hope someone leaves a seat.

  **Dev:** (Sinks onto a vent housing, rubs his face) Maybe… maybe the rule is too rigid. Maybe counting future residents directly is… impossible. Like you say. Ghosts. But Miriam… the *effect*. The effect of only counting us, the already-here… it locks people out. It tells them they don’t matter until they’ve already won the lottery, fought their way in. That their need, their desire to belong *here*… counts for nothing against Mrs. Henderson’s declaration of twenty years she won’t see.

  **Miriam:** (Her voice softens, almost weary) Needs don’t build buildings, Dev. People do. People who are *here*. People who gamble, like Carlos won’t. People who… stay. Even when staying gets hard. (She looks away, towards the distant lights of the city) That’s the weight. That’s the vote. It’s earned in the staying.

  **Dev:** (Watches her carefully, a new tension in his posture) And what if… what if someone declares long? Plants that oak? Bets their future… and then… has to leave? Sooner? The clawback…

  **Miriam:** (Turns back sharply, catching his hesitation) The clawback? What about it? Undoes their vote? Fine. Serves them right for lying, or… or misjudging. Life happens. But the vote stood when it mattered. The structure gets built, or doesn't, based on the bets people placed *then*. You can't un-build it.

  **Dev:** (Looks down, then meets her gaze, a flicker of guilt) No. You can't un-build it. But you can… reopen the decision. Within five years. If the declaration was… significantly off. The clawback isn't just about subtracting a vote later. It can unravel the whole outcome. Projects stopped. Permits pulled. Chaos.

  **Miriam:** (Eyes widen slightly. A long pause. The train horn sounds again, closer now. She studies Dev's face, the unspoken implication hanging between them – her potential move to Cleveland, her long declaration that could save the vote but might trigger the clawback if she leaves. Her voice is dangerously quiet) Reopen it? Unravel it? Dev Patel... how many years did *you* declare on your own damn form?

  *(Dev flinches. Miriam doesn't look away. The distant horn fades, leaving only the hum of the city below and a question heavier than any vote.)*

  **End Chapter.**
