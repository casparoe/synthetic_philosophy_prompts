  Okay, the user is teaching a graduate seminar on contingency and lock-in in history. They want a short story for the final session to make the concepts feel strange again, since students can recite the theory but don't grasp the underlying weirdness. 

  Hmm, the core requirements are tricky. Need to embed three abstract ideas without exposition: 1) canalized outcomes vs plastic reasons (same result, different justifications), 2) lexical lock-in (alternatives become unsayable), 3) archive problem (only winners' narratives survive). And do it through fiction where no character lectures. 

  The Bureau of Retrospective Coherence setting feels promising - a bureaucracy that rewrites history to fit present infrastructure. Protagonist could discover inconsistencies in old reports about... say, a rail line decision. The rerun simulation must fail interestingly, not just prove the point. 

  Big challenge: avoiding econ/power reductionism. Students will want to interpret it as market failure or power play, so the story must frustrate both readings equally. Maybe make the simulation's failure ambiguous - neither technological superiority nor coercion explains why alternatives vanish. 

  For lexical lock-in, perhaps show words literally dissolving when spoken? Too on-the-nose. Better: characters in rerun can't articulate options because their language lacks constructs like "floodplain bypass" - the concept exists as static in their documents. 

  Stakes... protagonist's career could hinge on exposing this, but the system resists. Senior archivist Marta feels right as antagonist - not evil, just invested in narrative coherence. Her "history is the art of the inevitable" line encapsulates plastic reasons perfectly. 

  The rerun simulation should malfunction poetically. Instead of neat alternate history, have it generate grotesque hybrids - steam trains on monorails, dam foundations in mid-air. Failure exposes that we can't simulate lost possibilities with surviving vocabulary. 

  Ending must linger uncomfortably. Protagonist almost cracks the case but gets reassigned to something trivial like sewer pipe reports. The victory? She plants a seed by filing the anomalous documents as "miscellaneous" rather than destroying them. Small rebellion against lexical erosion. 

  Key subtle touches: 
  - Junior analyst's name (Elara) means "light" ironically 
  - 1954 report inconsistency: flood control vs logistics vs land values 
  - Simulation uses punch cards (dated tech emphasizing institutional rigidity) 
  - Marta's final warning: "Some words are heavy. They sink." implying lexical weight shapes what floats in history 

  Most dangerous trap: making the Bureau cartoonishly Orwellian. Keep it mundane - their mission statement about "civic self-understanding" makes the epistemic violence more chilling. The real villain is the comfort of coherence.
answer: |-
  ## THE SHAPE OF NECESSITY

  The air in the Basement Archive of the Bureau of Civic Self-Understanding smelled of dust, damp concrete, and the slow, acidic decay of paper. Elara Voss, Junior Analyst Grade 3, breathed it like a penitent. Her task was simple: verify the provenance of justification citations for the 1954 Central Rail Spur Decision in the upcoming Decennial Coherence Report. A footnote audit. The sleepiest corner of bureaucratic purgatory.

  The Spur was a fact of the city’s skeleton – thick steel veins converging on the riverfront yards, bypassing the old northern districts. Why? The Bureau’s sacred duty was to explain *why it could not have been otherwise*. Elara pulled the prior Decennial Reports: 1964, 1974, 1984, 1994, 2004, 2014. Each contained the Official Account of the ’54 Decision.

  By 3 AM, the simplicity curdled. The 1964 report, penned barely a decade later, emphasized *flood mitigation*. The Spur’s raised embankment, it declared, was a direct, logical response to the catastrophic ’51 floods; the northern route was dismissed as inherently vulnerable lowland. Necessity, born of water.

  The 1974 report, amidst an energy crisis, barely mentioned floods. Its emphasis was *logistical efficiency*. The riverfront route minimized travel time for coal shipments to the new power station – an economic imperative the northern route couldn't match. The ’51 floods were a footnote.

  1984’s report, focused on urban renewal, championed the Spur’s role in *containing industrial blight*. The riverfront was already zoned heavy industry; running the Spur north would have ‘fractured’ emerging residential zones. The floods weren’t mentioned. The power station coal argument was absent.

  1994 discovered *long-term land value optimization*. Sophisticated (if retrospectively applied) models ‘proved’ the riverfront corridor maximized adjacent property tax revenue over 50 years. Previous justifications were reduced to ‘contributing contextual factors’.

  The pattern held. Each report presented a single, self-evident, watertight rationale. Each rationale was different. Incompatible. The ’54 decision was a canalized outcome – the Spur existed, immutable – but the *reasons* for its existence were plastic, morphing with each decade’s priorities like shapeshifters donning new skins.

  Worse, buried in a box of uncatalogued ’54 committee minutes (marked ‘Misc. Pre-Coh – Do Not Cite’), Elara found ghosts. Minutes from a sub-committee meeting where the *northern route* wasn’t just dismissed, it was… debated. Seriously. Arguments about cheaper land acquisition, better serving the textile mills due for expansion (mills long since gone), even something called a ‘floodplain bypass spur’ – a hybrid option. It existed. On paper. Then it didn’t. It vanished from the record after one meeting. Not refuted, just… unsaid. **Lexical lock-in**. The alternative hadn’t just lost; its vocabulary had been scoured from the permissible language of civic planning. To even mention the northern route seriously in a modern Bureau report would be like proposing building with phlogiston.

  Elara felt the weirdness, a cold prickle. The outcome was fixed, but the path to it was rewritten with each telling, erasing the branches that *almost* were. The archive wasn’t a record; it was a tomb for possibilities, curated by the victors. The Bureau didn't discover necessity; it manufactured it, decade by decade, using whatever bricks of reason were currently fashionable.

  Her discovery coincided with Senior Archivist Marta Borloff’s pet project: the ‘Retrospective Resilience Simulation’ (RRS). A war-gaming exercise for junior staff. ‘Stress-test our civic narrative!’ Marta declared, her smile tight. ‘Simulate a 1954 where key variables differed. See if the Spur *truly* held.’

  Elara saw her chance. She volunteered, requesting the ’54 Rail Spur Decision as her simulation focus. Her hypothesis was treasonous: the outcome *was* contingent, but the *reasons* were always plastic. Lexical lock-in would strangle alternatives regardless. Marta, perhaps intrigued by the junior analyst’s pallor, agreed.

  The RRS room was a vault lined with obsolete data readers and a hulking, whirring simulation engine fed by punch cards containing sanitized archival data – the *only* data permitted. Elara loaded the parameters: simulate 1954, focus on rail spur location. Introduce minor perturbations: slightly higher land cost projections for the riverfront, a delayed environmental impact survey (a concept barely nascent in ’54). She deliberately omitted the ‘floodplain bypass spur’ – it wasn’t in the official ’54 record, so it didn’t exist for the RRS.

  She initiated the simulation. Lights dimmed. Holographic schematics flickered above the central table: a ghostly map of the 1954 city. Avatars for key committees – Planning, Commerce, Flood Control – shimmered into existence, their logic governed by the sanitized data and programmed ‘period-appropriate’ priorities.

  Elara watched, heart pounding. The riverfront route *was* challenged! The minor cost perturbation triggered Commerce Committee hesitation. Flood Control, using only pre-’51 flood data in its simulation memory (the ’51 flood being ‘future’ to them), wasn’t pushing the raised embankment argument hard. For a few simulated weeks, the northern route gained traction. Elara saw the textile mill expansion plans referenced! The simulation was generating reasons that *had* existed, briefly, in that uncatalogued box. It felt illicit, thrilling.

  Then, it stalled. The committees deadlocked. The simulation engine whined. The avatars flickered, their projected arguments becoming garbled, nonsensical.

  *Planning Chair Avatar:* "...requires alignment with... *untranslatable glyph*... paramount principle of… *static*..."
  *Commerce Avatar:* "Textile viability… *data corruption*… necessitates corridor… *error*… river proximity essential for… *untranslatable glyph*…"

  The northern route proponents seemed unable to fully articulate their case. The words they needed – the specific projections, the hybrid spur concept – weren’t in the simulation’s lexicon. They were trying to say the unsayable. The riverfront proponents, however, defaulted smoothly to arguments about ‘established infrastructure corridors’ and ‘future growth vectors’ – vague concepts already present in the sanitized data, proto-versions of later plastic reasons. Their justifications lacked the concrete force of the original reports (floods, coal, blight), but they *flowed*. They sounded like… reason.

  The simulation didn't choose the northern route. It didn't reaffirm the riverfront route either. It choked. The holographic map fractured. The riverfront spur appeared, then superimposed over it, like a double exposure, was the northern route. Then, monstrously, a third, impossible spur materialized, cutting diagonally through residential districts that didn’t exist in 1954, labeled only with blinking question marks. The machine groaned. Smoke, real or simulated, seemed to curl from a vent. A klaxon blared – ‘SYSTEMIC COHERENCE FAILURE’.

  Marta Borloff stormed in, killing the power. The ghost city vanished. “What did you *do*, Voss?” she hissed, her usual bureaucratic calm shattered. “The RRS is for reinforcing understanding, not… not causing ontological seizures!”

  “It couldn’t handle the alternatives,” Elara stammered, gesturing at the blank table. “The reasons… they weren’t there. The words to justify the other path… the simulation didn’t have them. It couldn’t *think* them.”

  Marta’s eyes narrowed, not in confusion, but in recognition – and cold fury. “The simulation uses *approved* historical data, Analyst Voss. The data that *matters*. The outcome *is* the Spur. The reasons… the reasons are what we make them to be for *this* decade. That’s coherence. That’s civic self-understanding.” She leaned close, the scent of her lavender water clashing with the ozone from the machine. “You think you found ghosts? Ghosts are dust. They have no weight. The Spur has weight. It holds the city together. Focus on *why it must*, not on phantom paths that led nowhere. History,” she finished, her voice regaining its bureaucratic chill, “is the art of the *inevitable*. Don’t confuse it with the archaeology of the irrelevant. File your report. Stick to the ’64 flood mitigation rationale for this Decennial. It’s… suitably hydraulic for our current concerns.”

  Elara spent the next week drafting. She wrote about floodplains and raised embankments. She cited the ’64 report. She did not mention deadlocked simulations or phantom spurs. She did not mention the ‘miscellaneous’ box. She filed the report.

  But she also filed a separate, sealed archival request, processed by a bored night clerk. The uncatalogued ’54 minutes box was not destroyed. It was reclassified. Not under ‘Rail – Spur – Central – Decision – 1954’. Not under ‘Pre-Coh – Misc’. Marta might have accepted that. Instead, Elara chose a category so desolate, so devoid of searchable meaning, it was almost a void: **‘Infrastructure – Proposed – Not Adopted – Reason Unspecified – Box 547-D’**.

  It wouldn’t be found. Not for decades, maybe never. But it existed. A tiny, silent pocket of lexical resistance in the vast, coherent tomb. The shape of the city was fixed. The reasons for its shape were as fluid as the river it hugged. And Elara understood, with a chill that had nothing to do with the archive’s damp, the true nature of the lock. It wasn't just in the steel rails or the bureaucratic inertia. It was in the thinning air of what could be said. The rerun couldn't happen, not really, because the words to build the other path were already buried, leaving only the smooth, paved highway of the inevitable, lined with plastic signposts that changed with the seasons. She walked out into the smog-choked sunlight of the city shaped by the Spur, feeling the immense, silent weight of all the things that could not be said, and wondering what necessary truths the next Decennial Report would invent.
