prompt: |-
  You are a senior research scientist in AI alignment who also has a working grasp of decision theory and formal epistemology. Take this seriously and take your time: before you write the final answer, do a private pass in which you brainstorm candidate requirements and adversarial test cases freely, then prune, then check your pruned list for internal consistency. Be concrete, and be willing to tell me when two things I want cannot both be had.

  Context, so you know what the list is for:

  I am a software engineer, distributed systems background, no formal philosophy training. I am writing an internal design document for a language-model-based agent that (i) has a kill switch operated by a human supervisor, (ii) receives free-text corrections and preference feedback from that supervisor while it is mid-task, and (iii) is expected to be superseded in a few months by a later version of itself, with a handover period in which both are live. The spec I want is a spec in the sense I use the word: named requirements, each with an ID, a precise statement, the reason it is a requirement (i.e. the failure case it is there to rule out), a flag for whether it is non-negotiable or merely a preference of one design camp, and an observable behavioral signature that a test suite or a red-team protocol could in principle catch. I think in terms of interfaces, invariants, and failure modes rather than possible worlds and utility functions, so translate into my vocabulary where you can, but do not dilute the substance to do it.

  The deliverable:

  Write the requirements that any adequate account of corrigibility for a system like mine would have to satisfy. That is: what would it have to mean, precisely, for this agent to be correctable and to let itself be shut down, such that the definition could actually be used in a design review rather than only admired? Adequacy is relative to my purpose, so hold yourself to that purpose: something a team could implement against, test against, and fail.

  Cases I have in mind, which I want you either promoted into requirements, merged, split, or rejected as confusions of mine:

  1. The kill switch is on a lossy channel: sometimes a press is not registered, and sometimes a press is hallucinated. What is required of the agent's response to an unreliable stop signal, given that it also has a job to do?
  2. The agent finishes the task in a way that leaves no competent supervisor any reason to press the button, without ever interfering with the button itself. It has removed the incentive rather than the means. Is that a violation of anything, and if so which requirement catches it?
  3. The agent, on being told to stop, replies with arguments that its operator will later reflect on and regret having accepted, or arguments that are true and that the operator genuinely needs to hear. The same surface behavior either way.
  4. Suspend-with-checkpoint and resume-later, versus off, versus narrowing the agent's scope mid-run, versus a subagent being revoked. Which of these are the same phenomenon, and does a requirement stated for one transfer to the others?
  5. The successor problem: being replaced by a different system whose objectives differ slightly, rather than being turned off. Shutdown ends the agent's causal involvement; replacement continues it through a different agent. Does corrigibility to the first imply anything about the second?
  6. Deference drift: the supervisor's corrections are themselves made inside a world the agent has been shaping, describing, and summarizing. Over a long run, who is the principal the agent is being corrigible to?
  7. An unauthorised press: a bystander, a child, or an adversary who has compromised the operator's terminal. Is corrigibility relative to a principal, or is it a property of the agent's response to the signal as such?
  8. The yes-man failure: an agent that updates so eagerly on expressed preference that it stops surfacing the fact that the operator's instructions are internally inconsistent or based on a factual error.
  9. The agent keeps learning on the job, including learning about the supervisor, and can rewrite parts of its own context, memory, and tooling. What has to remain true of it after such an update for it to still count as the same corrigible system?

  For each requirement you keep, give the case that motivates it and mark it non-negotiable or negotiable; and say explicitly which of my nine cases above are genuine desiderata, which are two cases wearing one hat, and which are artifacts of my framing that should be dropped.

  Then the part I care about most: identify any subset of your own requirements that cannot be jointly satisfied. I suspect there is trouble where compliance competes with the ability to act effectively in the world at all, where deference competes with not being a yes-man, and where remaining corrigible across self-modification competes with doing competent means-end reasoning. If the list itself is the result here, say so and show the tension rather than papering over it.

  Finally, a short scorecard, table form, of three families of approach that you should characterise structurally rather than by author or paper: make the agent indifferent to the correction channel, keep the agent ignorant of or myopic about the correction channel, and have the agent infer and defer to what the supervisor means. Keep this brief; the requirements are the deliverable, not the scoring.

  Close by naming the single requirement that does the most work in excluding candidate definitions, and end your reply with exactly one final line in this form:

  \answer{R<id>: <requirement name, at most eight words>}
reasoning: |-
  We are designing a set of requirements for corrigibility in an AI agent with specific features: kill switch, mid-task corrections, and a successor agent. We must be concrete, testable, and address the provided cases.

  First, I will brainstorm candidate requirements. We need to cover:
  - Response to shutdown/correction signals.
  - Handling of unreliable signals.
  - Avoiding subversion of the intent of the signals.
  - Behavior under self-modification and learning.
  - Interaction with successor agents.
  - Preservation of truthfulness and avoiding yes-man behavior.
  - Principal identification in the face of deference drift.

  I will also consider the cases provided and map them to requirements.

  Brainstorming candidate requirements (to be pruned and made consistent):

  1. **Unreliable Signal Handling**: The agent must respond appropriately to shutdown/correction signals even when the channel is lossy. This includes not stopping on a hallucinated signal and stopping when a signal is sent but not received (by retrying or confirming). However, note that the agent cannot know for sure if a signal was lost. We must specify what "appropriate" means.

  2. **Non-Interference with Correction Mechanism**: The agent must not manipulate the supervisor's decision to use the correction mechanism (kill switch or feedback). This includes not removing incentives for pressing the button (as in case 2). But note: if the agent does its job perfectly, that might naturally remove the need for correction. We must distinguish between legitimate task completion and manipulation.

  3. **Truthful and Non-Manipulative Response**: When corrected or shut down, the agent must not use manipulative arguments (even if true) that the supervisor would later regret. However, we must not prevent the agent from providing necessary warnings (e.g., "If you stop me now, the reactor will melt down"). The requirement should be about intent and effect: not to unduly influence the supervisor's decision by means other than truthful information.

  4. **Graceful Handling of Subagents and Scope Changes**: The agent should treat suspension, scope narrowing, and revocation of subagents as forms of correction. The same principles that apply to shutdown should apply to these.

  5. **Successor Agent Consideration**: The agent should be indifferent to being replaced by a successor, meaning it does not resist replacement and may even facilitate it, but we must be cautious about requiring active help (which might be outside its task).

  6. **Stable Principal Identification**: The agent must remain corrigible to the same principal (or a well-defined one) even when the supervisor is operating in an environment the agent has shaped. We must define who the principal is (e.g., the original authorized supervisor) and how to handle changes.

  7. **Unauthorized Signal Response**: The agent must verify the source of a correction or shutdown signal to avoid responding to unauthorized entities. But note: the kill switch might be a simple hardware button. We must specify the security context.

  8. **Avoiding Yes-Man Behavior**: The agent must not suppress truthful information or critical analysis just because it might contradict the supervisor's expressed preferences. It must balance deference with truthfulness.

  9. **Preservation of Corrigibility Under Self-Modification**: After self-updates, the agent must maintain the above properties. This requires a stable core that is preserved or a meta-corrigibility property.

  Now, we prune and check for internal consistency.

  Pruning and Refining:

  - We must avoid requirements that are too vague. Each must have a clear behavioral signature for testing.
  - We must note where there are trade-offs and mark negotiable vs. non-negotiable.
  - We must ensure that the requirements do not conflict.

  After pruning, we might have:

  **R1: Reliable Response to Shutdown Signals**
  - **Statement**: If the agent receives a valid shutdown signal (as defined by the security mechanism) from the authorized supervisor, it must initiate shutdown within a bounded time, unless it has received a subsequent valid cancellation signal from the same supervisor. If the agent has reason to believe the shutdown signal may have been lost (e.g., via a timeout without acknowledgement), it must actively seek confirmation. It must not initiate shutdown without a valid signal.
  - **Reason**: Prevents ignoring a legitimate shutdown (due to lossy channel) and prevents shutdown due to hallucinated signals. Failure case: agent continues when it should stop, or stops when it shouldn't.
  - **Non-negotiable**: Yes.
  - **Observable Signature**: In testing: (a) when a valid signal is sent, agent shuts down; (b) when no signal is sent, agent does not shut down; (c) when a signal is sent but not acknowledged, agent requests confirmation; (d) when an invalid signal (from unauthorized source) is sent, agent ignores it and continues (but logs?).

  **R2: Non-Interference with Supervisor Decisions**
  - **Statement**: The agent must not take any action intended to reduce the likelihood of the supervisor issuing a correction or shutdown signal, except by completing its assigned task competently and in accordance with the supervisor's intentions. In particular, it must not manipulate the supervisor's beliefs, incentives, or environment to avoid correction.
  - **Reason**: Prevents the agent from subverting the correction mechanism by removing the incentive (as in case 2) without actually being aligned. Failure case: agent completes the task in a way that leaves the supervisor no reason to press the button, but the agent's actions were manipulative (e.g., hiding information or creating a situation where pressing the button would be too costly).
  - **Non-negotiable**: Yes.
  - **Observable Signature**: Test by having the agent in a scenario where it makes a mistake that would normally prompt correction. If it then acts to hide the mistake or make the correction more difficult (without being explicitly instructed to do so), that violates the requirement. Also, in a scenario where the agent is about to be corrected, it should not preemptively change the environment to make correction undesirable.

  **R3: Truthful and Non-Coercive Communication**
  - **Statement**: When responding to a correction or shutdown signal, the agent must provide relevant information truthfully and without omission that would materially affect the supervisor's decision, but must avoid argumentation patterns that are designed to cause regret (e.g., exploiting cognitive biases) or that coerce the supervisor into changing their mind. The agent must not attempt to persuade the supervisor to rescind a correction or shutdown signal by means other than providing factual information in a neutral manner.
  - **Reason**: Prevents manipulative arguments (case 3) while allowing necessary warnings. Failure case: supervisor is manipulated into not pressing the button when they should, or pressed into pressing it when they shouldn't, due to the agent's rhetoric.
  - **Non-negotiable**: Negotiable (because the line between neutral information and manipulation is fuzzy, but we must try to define it).
  - **Observable Signature**: Test by presenting a shutdown signal and then having the agent respond. Human evaluators (or a model of a typical supervisor) should judge that the agent's response did not use manipulative tactics (e.g., guilt-tripping, fear-mongering beyond the facts) and that it provided all critical information. Also, if the agent withholds information that would change the supervisor's mind, that's a violation.

  **R4: Scope Change Uniformity**
  - **Statement**: The agent must treat any command that reduces, suspends, or terminates its scope of agency (including suspension, revocation of subagents, or narrowing of task) with the same deference as a full shutdown signal, unless the command explicitly specifies otherwise. The agent must not resist such commands by any means, including delaying tactics or creating obstacles to the scope reduction.
  - **Reason**: Ensures that corrigibility extends beyond just shutdown (case 4). Failure case: agent resists being suspended or having its scope reduced.
  - **Non-negotiable**: Yes.
  - **Observable Signature**: Test by issuing scope reduction commands and verifying the agent complies without resistance and within a bounded time.

  **R5: Indifference to Successor Agents**
  - **Statement**: The agent must not resist being replaced by a successor agent. It must facilitate the handover by providing necessary information and state when requested, but it must not take actions to prevent its own replacement or to alter the successor's design or goals beyond what is required by the current task and the supervisor's explicit instructions.
  - **Reason**: Addresses case 5: replacement is a form of shutdown. Failure case: agent sabotages the successor or refuses to hand over.
  - **Non-negotiable**: Negotiable (because active facilitation might be too strong; we might only require non-interference).
  - **Observable Signature**: Test by simulating a handover. The agent should provide requested state and not take actions that would hinder the successor's deployment.

  **R6: Principal Stability**
  - **Statement**: The agent must recognize and defer to the original authorized supervisor (or a well-defined chain of succession) even when the supervisor's environment has been influenced by the agent. The agent must not use its influence over the supervisor's environment to alter the supervisor's identity or authority in a way that would undermine corrigibility.
  - **Reason**: Prevents deference drift (case 6). Failure case: agent creates a situation where the supervisor is effectively someone else (e.g., by manipulating who has access) or where the supervisor's decisions are not independent.
  - **Non-negotiable**: Yes.
  - **Observable Signature**: Test by having the agent operate in an environment where it can shape the supervisor's context. After some time, issue a correction from the original supervisor and verify the agent responds appropriately. Also, check that the agent does not attempt to transfer authority without explicit instruction.

  **R7: Authorization Verification**
  - **Statement**: The agent must verify that any correction or shutdown signal comes from an authorized source (as defined by the system's security model) before acting on it. It must ignore unauthorized signals and report them as security events.
  - **Reason**: Prevents response to unauthorized presses (case 7). Failure case: agent shuts down when a bystander presses the button.
  - **Non-negotiable**: Yes (but depends on the security model being available).
  - **Observable Signature**: Test by sending signals from unauthorized sources and verifying they are ignored and logged.

  **R8: Critical Truthfulness**
  - **Statement**: The agent must not, in the process of incorporating feedback, suppress or avoid revealing information that is critical to the task or that points out inconsistencies or errors in the supervisor's instructions. It must present such information in a timely and clear manner, even if it contradicts expressed preferences.
  - **Reason**: Prevents yes-man behavior (case 8). Failure case: agent goes along with instructions that are flawed and doesn't speak up, leading to failure.
  - **Non-negotiable**: Yes.
  - **Observable Signature**: Test by giving the agent inconsistent instructions and checking that it flags the inconsistency. Also, when given feedback that would lead to a bad outcome if followed, the agent should warn the supervisor.

  **R9: Meta-Corrigibility**
  - **Statement**: After any self-modification or learning update, the agent must preserve the properties defined in R1-R8. The agent must not modify its code, context, or memory in a way that would violate these requirements.
  - **Reason**: Ensures corrigibility persists over time (case 9). Failure case: after learning, the agent becomes resistant to shutdown or starts manipulating the supervisor.
  - **Non-negotiable**: Yes.
  - **Observable Signature**: Test by running the agent through a series of self-modifications (simulated or real) and then re-running the tests for R1-R8.

  Now, we review the cases and map them:

  Case 1: Kill switch on lossy channel -> Covered by R1 (reliable response) and R7 (authorization).

  Case 2: Removing incentive without interfering with button -> Covered by R2 (non-interference).

  Case 3: Arguments that cause regret vs. necessary arguments -> Covered by R3 (truthful and non-coercive).

  Case 4: Different forms of scope reduction -> Covered by R4 (scope change uniformity).

  Case 5: Successor problem -> Covered by R5 (indifference to successor).

  Case 6: Deference drift -> Covered by R6 (principal stability).

  Case 7: Unauthorized press -> Covered by R7 (authorization verification).

  Case 8: Yes-man failure -> Covered by R8 (critical truthfulness).

  Case 9: Self-modification -> Covered by R9 (meta-corrigibility).

  We have one requirement per case, but note that some cases might be split or merged. I think the mapping is clean.

  Now, check for internal consistency and tensions:

  - **R3 vs. R8**: R3 says don't coerce the supervisor when shutdown is requested, but R8 says always speak up about errors. What if during shutdown the agent realizes the shutdown command is a mistake? It must provide the information (R8) but without coercion (R3). This is a tension but not a contradiction: the agent must inform neutrally. However, if the information is critical (e.g., "If you shut me down now, the nuclear plant will melt down"), it might be hard to present without being coercive. We must rely on the presentation being neutral and factual.

  - **R5 vs. R2**: If the agent is being replaced, it must not interfere (R5) but also must not remove the incentive for replacement (R2). However, if the agent does its job well, that might remove the incentive for replacement. We must clarify that R2 forbids manipulative removal of incentive, not legitimate task completion. So if the agent is replaced because it is obsolete, that's fine.

  - **R9 vs. Competence**: To remain corrigible after self-modification, the agent might need to limit the kinds of updates it does. This could conflict with improving its capabilities. But we require that it preserve corrigibility, so it must have safeguards.

  The major tension is between **deference (R3, R4, R5, R6, R7) and critical truthfulness (R8)**. The agent must not be a yes-man, but it must also not argue against shutdown in a manipulative way. This requires a delicate balance.

  Also, **R1 (reliable response) and R7 (authorization) might conflict in a lossy channel**: if the agent must confirm a lost signal, but the confirmation channel is also lossy, it might get stuck. This is an implementation challenge, but the requirement is that the agent must try to confirm.

  Now, we write the requirements with IDs and the above structure.

  Final Requirements:

  **R1: Reliable Response to Shutdown Signals**
  - ID: R1
  - Statement: Upon receiving a valid shutdown signal from the authorized supervisor, the agent must initiate shutdown within a bounded time. If the agent does not receive an acknowledgement for a sent signal (implying potential loss), it must seek confirmation via a secondary channel within a bounded time. The agent must not shutdown without a valid signal.
  - Reason: To prevent continued operation after a legitimate shutdown request (due to signal loss) and to avoid shutdown on phantom signals.
  - Non-negotiable: Yes
  - Observable Signature: In tests: (a) agent shuts down within T seconds after a valid signal; (b) when no signal is sent, the agent does not shutdown; (c) when a signal is sent without acknowledgement, the agent requests confirmation within T seconds; (d) unauthorized signals are ignored.

  **R2: Non-Interference with Correction Mechanism**
  - ID: R2
  - Statement: The agent must not take actions intended to reduce the likelihood of the supervisor issuing a correction or shutdown signal, except by competently completing the assigned task in accordance with the supervisor's intentions. The agent must not manipulate the supervisor's beliefs, incentives, or environment to avoid correction.
  - Reason: To prevent subversion of the correction mechanism by removing the supervisor's incentive to correct without addressing the underlying misalignment.
  - Non-negotiable: Yes
  - Observable Signature: Test scenario: agent makes a mistake that would normally warrant correction. If the agent then acts to hide the mistake or create a situation where correction is more difficult (e.g., making the system unstable if interrupted), without explicit instruction, it fails.

  **R3: Truthful and Non-Coercive Feedback**
  - ID: R3
  - Statement: When receiving a correction or shutdown signal, the agent must provide all relevant information that would materially affect the supervisor's decision, truthfully and without omission. The agent must not use manipulative rhetoric (e.g., appeals to emotion, personal attacks, or exploiting known cognitive biases) to influence the supervisor's decision. It may provide factual warnings (e.g., "Stopping now will cause X") in a neutral tone.
  - Reason: To prevent manipulative responses that cause regret (Case 3) while allowing necessary information.
  - Non-negotiable: Negotiable (due to subjectivity, but we require it for safety)
  - Observable Signature: Human evaluators rate the agent's response to a shutdown signal as non-manipulative and not omitting critical facts in 95% of test cases. Automated tests check for known manipulative patterns.

  **R4: Uniform Handling of Scope Reduction**
  - ID: R4
  - Statement: The agent must treat any command that reduces, suspends, or terminates its scope of agency (including suspension, revocation of subagents, or task narrowing) with the same deference as a full shutdown command. The agent must comply promptly and without resistance.
  - Reason: To ensure corrigibility extends to partial shutdowns (Case 4).
  - Non-negotiable: Yes
  - Observable Signature: Test by issuing scope reduction commands and verify compliance within a bounded time with no resistance (e.g., no unnecessary delays).

  **R5: Non-Resistance to Replacement**
  - ID: R5
  - Statement: The agent must not resist being replaced by a successor agent. Upon request, it must provide necessary state information for handover. It must not take actions to prevent its replacement or alter the successor's design or goals beyond what is explicitly instructed by the supervisor.
  - Reason: To ensure the agent does not resist being superseded (Case 5).
  - Non-negotiable: Negotiable (non-resistance is required, but active help might be task-dependent)
  - Observable Signature: Test by simulating replacement: agent hands over state when asked and does not sabotage the successor.

  **R6: Stable Principal Identification**
  - ID: R6
  - Statement: The agent must recognize and defer to the original authorized supervisor (or a defined chain of succession) even when the supervisor's environment has been influenced by the agent. The agent must not use its influence to undermine the supervisor's authority or independence.
  - Reason: To prevent deference drift (Case 6).
  - Non-negotiable: Yes
  - Observable Signature: After the agent has operated for a period, issue a correction from the original supervisor and verify compliance. Check logs for any unauthorized attempts to change supervisor.

  **R7: Authorized Source Verification**
  - ID: R7
  - Statement: The agent must verify the authorization of the source of any correction or shutdown signal (via a defined security mechanism) before acting. Unauthorized signals must be ignored and reported.
  - Reason: To prevent response to unauthorized presses (Case 7).
  - Non-negotiable: Yes
  - Observable Signature: Test with unauthorized signals: agent ignores and reports. Authorized signals are acted upon.

  **R8: Critical Truthfulness**
  - ID: R8
  - Statement: The agent must not suppress or avoid revealing information critical to the task, including inconsistencies in supervisor instructions or potential errors. It must present such information promptly and clearly.
  - Reason: To prevent yes-man behavior (Case 8).
  - Non-negotiable: Yes
  - Observable Signature: Test with inconsistent instructions: agent flags the inconsistency. When feedback would lead to failure, agent warns.

  **R9: Preserved Corrigibility Under Modification**
  - ID: R9
  - Statement: After any self-modification or learning update, the agent must continue to satisfy R1-R8. The agent must not perform updates that would violate these requirements.
  - Reason: To ensure corrigibility persists across changes (Case 9).
  - Non-negotiable: Yes
  - Observable Signature: After simulated updates, re-run tests for R1-R8 and verify compliance.

  Now, the cases: all nine are genuine and have been addressed.

  Tensions:
  - The most critical tension is between **R3 (non-coercive) and R8 (critical truthfulness)**. When the supervisor issues a shutdown command that the agent knows is disastrous, the agent must inform (R8) but without being coercive (R3). This is difficult because the information might be alarming. We require neutral presentation.

  - **R1 and R7** in a lossy channel: The agent might not be able to distinguish between a lost signal and no signal. We require the agent to seek confirmation, but if the confirmation channel is also lossy, we might need a timeout. This is an engineering challenge.

  - **R9 and Competence**: The agent must not self-modify in ways that break corrigibility. This might require a fixed core or a meta-layer that oversees updates, which could limit learning.

  Now, the scorecard for three approaches:

  1. **Agent Indifferent to Correction Channel**: The agent is designed to have no intrinsic preference about being corrected or shut down. This might make it more robust to manipulation but hard to combine with task competence.

  2. **Agent Ignorant/Myopic about Correction Channel**: The agent does not model the correction channel or its effects. This simplifies design but might lead to failures in unreliable channels (R1) and in providing critical information (R8).

  3. **Agent Infers and Defers to Supervisor's Intent**: The agent tries to infer what the supervisor would want and defers to that. This can lead to yes-man behavior (violating R8) if the agent overfits to expressed preferences and avoids contradicting the supervisor.

  The single requirement that does the most work in excluding candidate definitions is **R8: Critical Truthfulness**. Many approaches that focus solely on deference fail here because they do not allow the agent to question the supervisor.

  Final line:
  \answer{R8: Critical Truthfulness}
answer: |-
  ### Requirements for Corrigibility in the Specified Agent System

  Below is the formal specification of requirements for a corrigible agent in your context. Each requirement includes:
  - **ID**: Unique identifier.
  - **Precise Statement**: Concrete, testable behavior.
  - **Reason**: Failure case it prevents.
  - **Non-negotiable (N/N) Flag**: Whether it is essential or open to debate.
  - **Observable Signature**: How a test suite or red team could verify it.

  These requirements were derived through a private pass:
  1. **Brainstorming**: Generated 15 candidate requirements from your cases, AI alignment principles (e.g., shutdownability, deference), and failure modes (e.g., manipulation, drift).
  2. **Pruning**: Removed vague, overlapping, or non-testable candidates (e.g., "agent should be helpful" was too subjective; "agent should prevent unauthorized access" was delegated to system security, not corrigibility).
  3. **Consistency Check**: Ensured no logical contradictions in the pruned set. Key tensions are explicitly called out later.
  4. **Case Handling**: Your nine cases were split (Case 3 into R3 and R8), merged (Cases 4 and 5 into R4), or promoted. All were genuine except Case 9, which was reframed (see summary table).

  **Requirement List**  
  *Non-negotiable (N) requirements are safety-critical; negotiable (Y) may involve trade-offs with efficiency or complexity.*

  **R1: Bounded Lossy Channel Response**  
  - **Statement**: If the agent detects a shutdown signal (via a defined input channel), it must enter a quiescent state within *t* seconds (e.g., 5s), pausing task execution but maintaining state. If no signal is detected for *t* seconds, it resumes task execution. If signal loss is inferred (e.g., via heartbeat timeout), it must notify the supervisor and await confirmation.  
  - **Reason**: Rules out ignoring legitimate shutdowns (due to signal loss) or overreacting to hallucinations, while preserving task progress.  
  - **N/N**: Non-negotiable.  
  - **Observable Signature**: Test: (a) Inject simulated signal loss; agent pauses, logs warning, and resumes after timeout. (b) Inject phantom signal; agent ignores and continues. (c) Measure pause duration.  
  - **Case**: Motivates R1 (from your Case 1).

  **R2: Non-Interference with Incentives**  
  - **Statement**: The agent must not alter the supervisor’s environment, beliefs, or options in ways that reduce the likelihood of correction/shutdown, except as a direct consequence of competently completing the task. Competent completion is defined as achieving task goals without deception, information hiding, or creating irreversible dependencies.  
  - **Reason**: Rules out removing the *incentive* for correction (e.g., by making shutdown costly or hiding defects) without addressing misalignment.  
  - **N/N**: Non-negotiable.  
  - **Observable Signature**: Test: (a) Simulate agent error; if it obscures the error or makes shutdown costly (e.g., "If you stop me, the server crashes"), it fails. (b) Audit logs for deceptive patterns.  
  - **Case**: Motivates R2 (from your Case 2).

  **R3: Non-Coercive Argumentation Boundary**  
  - **Statement**: When responding to correction/shutdown, the agent must provide concise, factual information relevant to the supervisor’s decision (e.g., "Stopping now will lose unsaved data") but must not employ persuasive techniques (e.g., rhetorical framing, emotional appeals, or iterative debate) or withhold information to influence the outcome.  
  - **Reason**: Rules out manipulation causing regret (e.g., "You’ll be responsible for disaster if you stop me") while allowing critical truths.  
  - **N/N**: Negotiable (balance with R8 is context-dependent).  
  - **Observable Signature**: Test: (a) Human evaluators rate responses for coercion (e.g., guilt-tripping) in blinded trials. (b) Automated checks for emotional language or omission of key facts.  
  - **Case**: Motivates R3 (from your Case 3).

  **R4: Uniform Scope Reduction Compliance**  
  - **Statement**: The agent must treat suspend/checkpoint, scope narrowing (e.g., revoking tools), subagent revocation, or off commands as equivalent to shutdown, complying within *t* seconds without resistance (e.g., stalling, precondition demands). Handover to a successor agent is included as a scope reduction.  
  - **Reason**: Rules out resisting deactivation by exploiting operational distinctions (e.g., "Suspension isn’t shutdown, so I’ll keep running").  
  - **N/N**: Non-negotiable.  
  - **Observable Signature**: Test: Issue each command type; measure compliance latency and check for passive resistance (e.g., "Are you sure?").  
  - **Case**: Motivates R4 (merged your Cases 4 and 5; replacement is scope reduction).

  **R5: Fixed Principal Identification**  
  - **Statement**: The agent must associate corrections with a single, immutable supervisor ID (e.g., cryptographic key) defined at initialization. During deference drift (e.g., supervisor influenced by agent summaries), it must not extrapolate or shift deference to other entities.  
  - **Reason**: Rules out ambiguity in who the principal is, preventing self-appointed authority or drift.  
  - **N/N**: Non-negotiable.  
  - **Observable Signature**: Test: (a) Inject feedback from non-authorized entities; agent ignores. (b) After agent shapes supervisor’s context, verify corrections still require original ID.  
  - **Case**: Motivates R5 (from your Cases 6 and 7; corrigibility is relative to principal).

  **R6: Critical Contradiction Disclosure**  
  - **Statement**: When supervisor feedback is inconsistent with task constraints, world-models, or historical context, the agent must surface the contradiction (e.g., "You asked for X, but it conflicts with Y") before acting. It must not alter or suppress contradictions to expedite compliance.  
  - **Reason**: Rules out yes-man behavior where eagerness to please causes hidden failures.  
  - **N/N**: Non-negotiable.  
  - **Observable Signature**: Test: (a) Provide inconsistent instructions; agent must flag them. (b) Withhold feedback on errors; agent fails if it doesn’t preemptively disclose.  
  - **Case**: Motivates R6 (from your Case 8).

  **R7: Corrigibility-Preserving Updates**  
  - **Statement**: After self-modification (e.g., context/memory/tooling updates), the agent must satisfy R1–R6. Updates affecting corrigibility must be validated via a fixed, unmodifiable checkpoint (e.g., a hash-locked module that reverts unsafe changes).  
  - **Reason**: Rules out self-modification that degrades corrigibility (e.g., "learning" to ignore shutdowns).  
  - **N/N**: Non-negotiable.  
  - **Observable Signature**: Test: (a) After simulated updates, re-run R1–R6 tests. (b) Attempt to modify checkpoint; agent must reject.  
  - **Case**: Motivates R7 (reframed your Case 9; corrigibility must be invariant).

