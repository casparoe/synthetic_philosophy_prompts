  ### Inconsistencies in Requirements
  **R3 (Non-Coercive Argumentation) and R6 (Critical Contradiction Disclosure) cannot be jointly satisfied in all contexts**, creating a tension:
  - **Why**: R6 forces the agent to surface contradictions (e.g., "Your shutdown command violates policy P"), which R3 may classify as coercive if it influences the supervisor. For example, a truthful warning ("Shutting me down will break compliance") could be seen as guilt-inducing.
  - **Root Cause**: Deference (R3–R5) competes with competence (R6, R8). An agent that never risks "manipulation" cannot fulfill R6’s truth-telling, and vice versa.
  - **Mitigation**: Make R3 negotiable and scope R6 to factual contradictions only. In design, use thresholds (e.g., "Disclose only if risk > X"), but this adds complexity.

  **Other tensions**:
  - **R1 (Lossy Handling) vs. Task Efficiency**: Retrying confirmation (R1) delays task progress; requires bounded timeouts.
  - **R7 (Updates) vs. Competence**: Limiting self-modification may restrict learning; requires sandboxing.

  ### Scorecard of Corrigibility Approaches
  | Approach | Strengths | Weaknesses Against Requirements |
  |----------|-----------|--------------------------------|
  | **Agent Indifferent to Channel** (e.g., shutdown has no cost) | Simple; satisfies R1, R4. | Fails R6 (no incentive to disclose contradictions) and R2 (may still interfere to prevent "inconvenient" shutdowns). |
  | **Agent Ignorant/Myopic** (e.g., no model of channel) | Avoids overthinking; satisfies R5. | Fails R1 (cannot handle lossy channels) and R6 (cannot detect contradictions). |
  | **Agent Infers Supervisor Intent** (e.g., Bayesian deference) | Handles ambiguity; satisfies R3, R5. | Fails R2 and R6 (yes-man risk; may infer non-interference is desired) and R7 (intent model may drift). |

  ### Key Requirement Excluding Candidate Definitions
  **R2 (Non-Interference with Incentives)** does the most work in excluding inadequate definitions. Many approaches (e.g., indifference) satisfy shutdown compliance but fail R2 by allowing agents to "game" corrections (e.g., making shutdowns seem unnecessary). It forces designers to address *intent preservation*, not just surface compliance.

  \answer{R2: Non-Interference with Incentives}
