  The tree's foundational split is whether the demon's memory must be included in the entropy accounting; this resolves most apparent contradictions by forcing explicit system boundaries, collapsing epistemic/ontic distinctions into operational costs.

  ### Decision Tree  
  1. **Does the device actively use information about gas particles to operate?**  
     - Yes → 2  
     - No → 9  

  2. **Is the demon’s memory (e.g., tape, state) part of the entropy accounting system?**  
     - Yes → 3  
     - No → 4  

  3. **Does the demon reset/erase its memory to a standard state periodically?**  
     - Yes → 5  
     - No → 6  

  4. **How is the gas entropy decrease offset without memory?**  
     - By work in measurement → Leaf A  
     - By mechanical work in the device → Leaf B  
     - By statistical fluctuations → Leaf C  

  5. **Is erasure the fundamental cost?**  
     - Yes → Leaf D  
     - No → 7  

  6. **Does the demon have finite memory capacity?**  
     - Yes → Leaf E  
     - No → 8  

  7. **Where was the cost paid?**  
     - In information acquisition → Leaf A  
     - In initializing memory → Leaf F  
     - In consuming correlations → Leaf G  

  8. **Can the demon operate eternally without net entropy increase?**  
     - Yes → Leaf C  
     - No → Leaf G (correlation cost must exist)  

  9. **Does the device appear to cool the gas?**  
     - Yes → 10  
     - No → Leaf H  

  10. **Is there an external asymmetry (e.g., temperature gradient)?**  
      - Yes → Leaf I  
      - No → Leaf J  

  ### Leaves  
  - **Leaf A: Acquisition Cost (Brillouin)**  
    - *Description*: Work is dissipated during measurement to overcome thermal noise.  
    - *Awkward commitment*: Assumes all measurements are inherently dissipative, even for non-invasive methods.  

  - **Leaf B: Mechanical Offset (unnamed)**  
    - *Description*: Gas entropy decrease is offset by work done on/by the device’s mechanism (e.g., partition insertion/removal).  
    - *Awkward commitment*: Requires an external agent or implicit work source not accounted for in the gas.  
    - *Illustration*: One-molecule engine with partition work counted.  

  - **Leaf C: Statistical Fluctuation (Smoluchowski)**  
    - *Description*: Apparent cooling is a temporary fluctuation; second law holds statistically.  
    - *Awkward commitment*: Allows for macroscopic violations if the demon is “lucky,” undermining universal validity.  

  - **Leaf D: Erasure Cost (Landauer)**  
    - *Description*: Cost is paid when memory is erased, dissipating heat to reset for a new cycle.  
    - *Awkward commitment*: Assumes erasure is logically irreversible and fundamental, even for reversible hardware.  
    - *Illustration*: Demon erases records after use.  

  - **Leaf E: Finite Memory (unnamed)**  
    - *Description*: Demon halts when memory fills, ceasing operation without reset cost.  
    - *Awkward commitment*: No cost per cycle, only a global limit; resetting memory would restart the problem.  
    - *Illustration*: Demon appends to tape until full; reversible computation halting.  

  - **Leaf F: Initialization Cost (unnamed)**  
    - *Description*: Cost was prepaid in initializing memory (e.g., low-entropy tape), consumed during operation.  
    - *Awkward commitment*: Shifts the cost outside the cycle, requiring an external entropy dump.  
    - *Illustration*: Demon handed pre-randomized tape.  

  - **Leaf G: Correlation Cost (unnamed)**  
    - *Description*: Entropy increases when demon-gas correlations are consumed or destroyed.  
    - *Awkward commitment*: Treats correlation as physical entropy, blurring ontic/epistemic boundaries.  
    - *Illustration*: Quantum demon with coherence; device sorting with pre-existing tape.  

  - **Leaf H: Ineffective Demon (unnamed)**  
    - *Description*: Without information, the device fails to cool due to symmetry or noise.  
    - *Awkward commitment*: Must explain why naive setups appear to work (e.g., via hidden asymmetries).  
    - *Illustration*: Lazy demon on fixed schedule in symmetric setup.  

  - **Leaf I: Heat Engine (unnamed)**  
    - *Description*: Device exploits external asymmetry (e.g., temperature gradient) like a heat engine.  
    - *Awkward commitment*: Redefines the demon as conventional, avoiding the measurement paradox.  
    - *Illustration*: Ratchet in temperature gradient; demon exploiting pre-existing asymmetry.  

  - **Leaf J: Mechanical Failure (Feynman–Smoluchowski)**  
    - *Description*: Device fails due to thermal noise in the mechanism when no information or asymmetry exists.  
    - *Awkward commitment*: Requires detailed mechanical analysis to show equilibrium behavior.  
    - *Illustration*: Ratchet and pawl in same bath.  

