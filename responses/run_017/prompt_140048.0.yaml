  ### Decision Tree for Choosing a Voting Rule

  The tree branches on questions that determine which properties of the Gibbard-Satterthwaite theorem are relaxed. Each leaf specifies a rule for the bylaws, a note on what is given up, and a classification:
  - **Escape route**: Licensed by the theorem (relaxes a formal condition).
  - **Sociological work-around**: Depends on norms, audits, or deliberation (not covered by the theorem).
  - **Redefined outcome**: Alters what constitutes a "choice" (e.g., by adding a set or lottery).

  #### Nested Decision Tree
  1. **Must the rule always return exactly one option? (No ties, shortlists, or lotteries)**
     - **Yes** → Go to 2.
     - **No** → Go to 7.

  2. **Must the rule be strategyproof? (Truthful reporting is always optimal, no matter what others do)**
     - **Yes** → Go to 3.
     - **No** → Go to 4.

  3. **Can voters use a transferable numeraire (e.g., tokens, money) to express intensity? (Changes ballots from rankings to cardinal utilities)**
     - **Yes** → Leaf VC.
     - **No** → Go to 8.

     8. **Is there a fixed, neutral ordering of options published before voting? (For domain restrictions)**
        - **Yes** → Leaf M1.
        - **No** → Leaf D1.

  4. **Is there a fixed, neutral ordering of options published before voting? (For domain restrictions)**
     - **Yes** → Go to 5.
     - **No** → Go to 6.

     5. **How is single-peakedness enforced?**
        - **Assume compliance by norm** → Leaf M1.
        - **Void non-single-peaked ballots** → Leaf M2.

     6. **Is there a designated voter (e.g., chair) with proposal power?**
        - **Yes** → Leaf MD.
        - **No** → Leaf P.

  7. **What should the rule return?**
     - **A set of options (for later tie-break)** → Leaf A.
     - **A lottery** → Go to 12.

     12. **Is a trusted source of randomness available?**
         - **Yes** → Leaf RD.
         - **No** → Leaf A.

  #### Leaves (Rules for Bylaws)
  - **Leaf VC: Vickrey-Clarke-Groves (VCG) Mechanism**  
    Rule: Voters report cardinal utilities using numeraire. The option maximizing total utility wins; voters pay taxes based on externalities.  
    Given up: Requires numeraire and may run deficits; ballots are cardinal, not rankings.  
    Classification: Escape route (uses cardinal utilities/transfers).  

  - **Leaf M1: Median Voter Rule**  
    Rule: Options ordered on a fixed scale. Each voter reports a ranking; the option at the median of top choices wins (with left-median tie-break).  
    Given up: Assumes preferences are single-peaked; non-median options cannot win.  
    Classification: Escape route (domain restriction fixed in advance).  

  - **Leaf D1: Dictatorship**  
    Rule: A pre-designated voter chooses the outcome.  
    Given up: Non-dictatorship; one voter has absolute power.  
    Classification: Escape route (relaxes non-dictatorship).  

  - **Leaf M2: Median Voter Rule with Voiding**  
    Rule: Options ordered on a fixed scale. Void ballots not single-peaked with that scale; apply median voter rule to survivors.  
    Given up: Voters may benefit by submitting non-single-peaked ballots to be excluded; electorate altered.  
    Classification: Sociological work-around (fails strategyproofness; incentives for exclusion).  

  - **Leaf MD: Modified Dictatorship with Override**  
    Rule: Chair chooses, but if 2/3 supermajority overrides, majority vote decides. Annual confidence vote on chair.  
    Given up: Strategyproofness; complex and manipulable (e.g., voters misreport to influence future confidence votes).  
    Classification: Sociological work-around (not dictatorial in isolation, but chair has agenda power).  

  - **Leaf P: Plurality Vote**  
    Rule: Each voter votes for one option; most votes wins.  
    Given up: Strategyproofness; may elect a Condorcet loser.  
    Classification: Common rule (no escape properties).  

  - **Leaf A: Approval Voting with Set Output**  
    Rule: Voters approve any number of options; options with highest approval form a set. Later tie-break (e.g., alphabetical) if one option needed.  
    Given up: Single-valuedness at first stage; tie-break may override preferences.  
    Classification: Redefined outcome (set chosen first).  

  - **Leaf RD: Random Dictatorship**  
    Rule: Voter chosen uniformly at random; their top choice wins.  
    Given up: Determinism; randomness may produce unfairness.  
    Classification: Escape route (randomization).

  ---

  ### Walkthrough for a Board Answering "Yes" to Published-Scale and "No" Elsewhere
  1. **Must the rule always return exactly one option?** → Yes.  
  2. **Must the rule be strategyproof?** → No (answered "no to everything else").  
  3. **Is there a fixed, neutral ordering of options published before voting?** → Yes.  
  4. **How is single-peakedness enforced?** → Void non-single-peaked ballots (Leaf M2).  

  **Outcome:** The board adopts **Leaf M2 (Median Voter Rule with Voiding)**.  
  - **Rule:** Void non-single-peaked ballots; run median voter rule on survivors.  
  - **Given up:** Strategyproofness is violated—voters may submit non-single-peaked ballots to be excluded if pivotal.  
  - **Classification:** Sociological work-around (domain not fixed in advance; incentives for exclusion).

