  ### Collision Log
  Pairs of leaves the tree cannot distinguish, with reasons:
  1. **M1 (Median Voter Rule) reached from two paths:**  
     - Path 1: 1→Yes, 2→Yes, 3→No, 8→Yes (strategyproof branch).  
     - Path 2: 1→Yes, 2→No, 4→Yes, 5→Assume compliance (non-strategyproof branch).  
     **Reason:** The same rule (M1) is recommended in both contexts, but its properties differ. In the strategyproof branch, it is strategyproof only if preferences are truly single-peaked; in the non-strategyproof branch, this is not guaranteed. The tree does not distinguish between these cases—it assumes the board understands the context.

  2. **A (Approval Voting) reached from two paths:**  
     - Path 1: 1→No, 7→Set output.  
     - Path 2: 1→No, 7→Lottery, 12→No randomness.  
     **Reason:** The rule is identical in both cases, but the rationale differs. In the first path, the board actively chooses a set; in the second, it defaults to a set due to no randomness. The tree does not capture this motivational difference.

