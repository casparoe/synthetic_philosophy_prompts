  ### Scenario: Alice in the Kitchen  
  Alice moves to make coffee and clean a stained enamel pan. Her true reward: +10 for drinking hot coffee at the table, -10 if the pan becomes scraped (from cleaning while hot). She falsely believes the new stove heats twice as fast as it does (true: 2 min to heat coffee; she thinks: 1 min).  

  **Trajectory (8 steps):**  
  | Time (min) | Location | Action              | Coffee | Pan     | Stove |  
  |------------|----------|---------------------|--------|---------|-------|  
  | 0          | stove    | turn_stove_on       | cold   | dirty   | on    |  
  | 1          | stove    | move_pan_to_sink    | cold   | dirty   | on    |  
  | 2          | sink     | clean_pan           | → hot  | → scraped | on    |  
  | 3          | sink     | move_to_stove       | hot    | scraped | on    |  
  | 4          | stove    | take_coffee_to_table| none   | scraped | on    |  
  | 5          | stove    | move_to_table       | none   | scraped | on    |  
  | 6          | table    | drink               | (none) | scraped | on    |  
  | 7          | table    | (none)              | (none) | scraped | on    |  

  - **True dynamics**:  
    - Stove takes 2 min to heat coffee (→ hot at t=2).  
    - Cleaning a hot pan → scraped. Cleaning a cooled pan → clean (cooling takes 1 min).  
  - **Reward**: -10 (scraped at t=2) + 10 (drink at t=6) = 0.  

  ### IRL Procedures & Results  
  1. **MaxEnt IRL** (assumes Boltzmann-optimal with true dynamics, temp=1):  
     - Infers reward: **+8 drink, -5 scraped**.  
     - Why: Sees scraped pan but high drink reward; attributes to noise, moderate penalty.  

  2. **Bayesian IRL** (sparse prior: rewards only on "drink" and "scraped" states):  
     - Infers reward: **+10 drink, 0 scraped**.  
     - Why: Sparse prior ignores scraped penalty (she drank anyway); focuses on drink.  

  3. **Belief-Model IRL** (optimizes w.r.t. her false dynamics):  
     - Infers reward: **+10 drink, -10 scraped** (true reward).  
     - Why: In her model, coffee heats at t=1. Rushing to clean (avoid "coffee burns at t=2") causes scraped. Optimal under false belief.  

  **Verdicts**:  
  - Best: **Belief-Model IRL** (gets true reward).  
  - Worst: **Bayesian IRL** (misses scraped penalty).  

  ### Disagreement Collapse  
  **Extra counterfactual observation**:  
  - *What if the stove heats slower (true 2 min; she still believes 1 min)?*  
    At t=1, Alice moves to sink. At t=2, coffee still cold. She **cools pan first** (1 min), then cleans (clean, not scraped).  
  - **Collapses disagreement**: All procedures now infer scraped penalty.  
  - **Information type**: Reveals *opportunities* (slower stove enables cooling), not new preferences.  

  ### Convergence with Correct Belief  
  If Alice’s belief matches true dynamics:  
  - She cools pan first (no scrape), drinks hot coffee. Trajectory has +10 drink, 0 scraped.  
  - **All three converge** to true reward: +10 drink, -10 scraped.  
  - **Work done by**: Belief-mismatch (not rationality assumption).  

  ### Your Grandson’s Critique  
  - "You picked the temperature!" → Fixed temp in MaxEnt matters, but even optimized, MaxEnt still underestimates scraped penalty (trajectory suboptimal under true dynamics).  
  - "You picked the hypothesis class!" → Sparse prior in Bayesian IRL ignores scraped; but if relaxed, Bayesian infers true reward.  
  - **Remaining disagreement**: Without belief adjustment, MaxEnt/Bayesian ignore *why* she rushed. Belief-mismatch is key.  

  ### Scoring Explanation (Abridged)  
  - **MaxEnt**: Trajectory probability ∝ exp(reward). Under true dynamics, high drink reward outweighs modest scraped penalty.  
  - **Bayesian**: Prior ∝ simplicity. "Scraped" dropped; drink explains data.  
  - **Belief-Model**: In her dynamics, scraping + drinking is best response to avoid "no coffee + scraped".
