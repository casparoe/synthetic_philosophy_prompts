  Hmm, the user is in a philosophy reading group focused on dispositions and has been grappling with objections to the simple conditional analysis (SCA). They've presented a thermal-shock case involving a glass beaker that cracks when boiling water is poured quickly but not when poured slowly, arguing this creates a dilemma for SCA defenders. The user wants me to defend SCA rigorously against this challenge.

  The user's thermal-shock case presents a genuine puzzle: the same glass shows different behaviors to the same stimulus (boiling water) depending on how it's applied. Their argument is that SCA must either become hyper-fine-grained (making dispositions single-case and useless) or introduce a manner-relativism that abandons intrinsicness. They also suggest finks/masks are just special cases of manner variation.

  As a committed SCA defender, I need to counter that the stimulus conditions are indeed different when we properly specify S. The pouring speed creates distinct thermal states in the glass - rapid pouring creates thermal gradients that aren't present in slow siphoning. This isn't a new "manner" parameter but an objective physical difference in the stimulus situation. The glass's intrinsic properties remain unchanged, but S must include the full causal context.

  Regarding the dilemma: the grain of S-description isn't arbitrary but determined by what's causally relevant to the manifestation. We don't need microscopic precision - "sudden thermal shock" vs "gradual heating" captures the difference at the right causal level. Dispositions remain multi-track properties because different stimuli clusters produce the same manifestation. Finks/masks are different because they involve extrinsic interference altering the object during stimulus application, whereas here the glass remains intrinsically unchanged.

  The beaker isn't both disposed and not disposed at the same time - it has a single fragility disposition that manifests only under sudden stress. The slow-pour scenario simply isn't the stimulus condition that triggers the disposition. The key is recognizing that S must be specified sufficiently to include the causal antecedents of M, which in this case includes the rate of heat transfer.
answer: |-
  Look, your thermal-shock case doesn't touch the simple conditional analysis because you haven't genuinely fixed the stimulus condition S—you've conflated two distinct Ss by fixating on the *water's* temperature while ignoring the *glass's* thermal state evolution. At the moment before pouring, the beaker *is* disposed to crack when subjected to a *sudden, severe thermal gradient* across its surface—which is the actual stimulus relevant to its fragility. When you pour rapidly, you instantiate *that S*: the inner surface heats much faster than the outer, creating destructive stress. When you siphon slowly, you instantiate a *different S*: near-uniform heating, where no such gradient develops. The analysis holds: in the fine-grained S of rapid heating gradient, it *would* crack (and does); in the fine-grained S of slow, uniform heating, it *would not* (and doesn’t). Your "manner of arrival" isn’t some mysterious addendum—it’s *part* of S, objectively fixed by the physics of heat transfer, not our interests. Dispositions remain intrinsic because the categorical basis (the glass’s molecular structure) grounds why it *would* crack under the rapid-gradient S and *would not* under the uniform S. Finks and masks are different: they involve extrinsic interventions that *alter* the intrinsic basis *during* stimulus application. Here, the basis is unchanged; only the actual stimulus delivered differs. Your dilemma is false—we don’t need arbitrary relativization or collapse to single-case microphysics. S is specified at the *causally relevant level* for the disposition: for fragility, it’s *rapid mechanical stress induction*, which includes the thermal dynamics. So no, your beaker isn’t both disposed and not—it’s dispositionally sensitive to the *full* stimulus structure, which you’re slicing wrongly. The counterfactual is robust: if it *were* in the precise S of rapid thermal shock, it *would* crack. Period. Your case just underscores that S must be described adequately, not that the analysis fails.
