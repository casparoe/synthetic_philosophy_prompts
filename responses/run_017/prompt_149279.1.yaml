prompt: |-
  I am writing a paper defending a line I have started calling the Parity Defense against the combination problem, and I want it stress-tested before I commit to it in print.

  The target position is micropsychist panpsychism: there is something it is like, at a very small scale, for at least some of the basic constituents of the physical world, and the macro-experiences we know about are what you get when micro-experiences stand in the right compositional relations. The standard objection is the combination problem, in its two usual parts: the subject-summing version, which asks how many distinct micro-subjects yield one macro-subject rather than merely a great many micro-subjects arranged subject-wise; and the quality-summing version, which asks how micro-qualities compose into the specific character of, say, seeing red, as opposed to into no macro-quality at all or into an unrecognizable one.

  My defense is that neither part is a cost special to panpsychism. The first is the general metaphysical question of how there can be composite objects at all, wearing a phenomenal label: anyone who accepts that there are organisms or artifacts already accepts that some collections have a unity not visibly assembled out of the unities of their members, and I claim the panpsychist is entitled to the very same primitive, with no extra explanatory debt incurred by the fact that what composes here is experiential. The second is the hard problem of consciousness again in a new costume: every view that does not eliminate macro-experience owes some account of how it arises from what is not itself that macro-experience, and panpsychism's version of that debt looks no larger than the physicalist's, and arguably smaller, since at least the base materials are of the right general kind. On this reading the combination problem is either a cost shared with views the objector already accepts, or an artifact of demanding that composition be intelligible in a way we demand nowhere else.

  I have also been working on a sharpened version, the borrowed-criterion version. Physicalist accounts of which collections compose composite objects are not metaphysically neutral: they appeal to causal integration, dynamical cohesion, informational unity, and the like. The panpsychist, I want to say, can simply borrow those same criteria for subject-composition, so that the restriction on which collections of micro-subjects compose a macro-subject is inherited from physics rather than invented for consciousness. If that works, the Parity Defense strengthens into an identity: the panpsychist is not positing a new composition principle at all, only applying the ordinary one to experiential parts.

  What would count against this? I am not interested in the dialectic where a critic says that composition remains mysterious even so, since I do not think mystery is a currency that discriminates between views here. I want the defeaters that a defender of the Parity Defense should take seriously, and I want them sorted.

  Specifically, please give me:

  The full space of things that would count against the Parity Defense, ranked from fatal to merely awkward, with the ranking justified rather than asserted. I especially want the failure modes internal to the borrowed-criterion version, since that is where I think the real exposure lies. My own worry is roughly this, and I would like it developed or dissolved: the borrowed criteria are stated in non-phenomenal terms, so either they fail to entail that there is a phenomenal subject at all, in which case borrowing them buys nothing, or they are supplemented by a bridge principle saying that collections satisfying such-and-such physical condition have a subject, in which case the bridge principle looks like a new fundamental posit that the physicalist does not need — which is just the combination problem reappearing one level down. Tell me whether that dilemma is real, whether both horns are live, and whether there is a version of the borrowed-criterion move that escapes it.

  An overflow problem I keep circling: for any collection of micro-subjects that composes a macro-subject, there are vastly many overlapping, partially nested collections that are also candidates. Something must arbitrate. If arbitration is by maximal unity, then whether a given subject exists, and how many subjects there are, becomes sensitive to continuous, empirically varying matters — split-brain cases, gradual anesthesia, fluctuating integration — and the diachronic identity of the macro-subject threatens to go indeterminate in a way that the identity of a table apparently does not. Say how damaging that is, and how much of it the panpsychist can simply embrace.

  Which of these a committed defender should concede as genuine evidence against the view, as opposed to which they are entitled to dismiss as simply restating the opposition. I want the concessions made from inside the view, not the objections as a critic would phrase them.

  What the Parity Defense predicts or commits its holder to that its rivals do not. A position that risks nothing is worth nothing, and I would rather find out now whether mine is one. My sense is that the borrowed-criterion version at least makes panpsychism hostage to empirical facts about integration in a way that a bare it-is-primitive version does not, and that this is a genuine, checkable exposure. Say whether you agree, and what else the view is on the hook for.

  Whether the Parity Defense, and especially the bare version, has been quietly qualified into unfalsifiability by the move to treating composition as primitive; and if it has, whether that is a defect for a position of this kind or an acceptable feature of a thesis in fundamental metaphysics.

  Finally, one asymmetry I cannot settle. The Parity Defense leans on the thought that composition is a problem for everyone. But cosmopsychist versions of panpsychism face something more like a decombination problem: not how parts make a whole subject, but how the one big subject gets carved into the many subjects we seem to be. Physicalist metaphysics contains no obvious analogue of carving, as opposed to building, so the parity move may simply fail there. Does it? And if the Parity Defense works for micropsychism and fails for cosmopsychism, does that asymmetry itself tell against the defense, or is it just a reason to be a micropsychist?

  Please answer with a definite verdict rather than a survey: which single defeater you take to be the most serious, whether on balance the Parity Defense survives it, and what you would revise if it were your paper. Where you are genuinely uncertain, say so and say what would settle it for you. I should add what would move me most: an argument that panpsychism, on its own terms, ends up committed to some distinctive and fundamental phenomenal posit that the physicalist is not — a bonding relation, a bridge principle, a restriction on composition stated experientially. Arguments of the form this is still unexplained leave me cold, since I think every view here is in that boat.
reasoning: |-
  Okay, the user is working on a philosophical paper defending what they call the "Parity Defense" against the combination problem in micropsychist panpsychism. They want their argument stress-tested before publication. Let me start by understanding their core argument. The Parity Defense claims that the combination problem isn't unique to panpsychism but is a general metaphysical issue shared by other views that accept composite objects.

  First, the subject-summing problem is likened to the general problem of composition: how parts form a unified whole, whether it's a table or a conscious subject. The quality-summing issue is compared to the hard problem of consciousness, which physicalists also face. Their sharpened version, the borrowed-criterion, suggests using physical composition criteria (like causal integration) to determine when micro-subjects form a macro-subject. 

  The user's main worry is whether borrowing physical criteria either fails to entail a phenomenal subject or requires a new bridge principle, which might reintroduce the combination problem. They also mention an overflow problem with overlapping collections and arbitration issues, plus concerns about unfalsifiability and asymmetry with cosmopsychism.

  I need to identify potential defeaters. The most serious one seems to be the Bridge Principle Dilemma in the borrowed-criterion approach. If panpsychism borrows physical criteria, they still need a principle linking physical integration to subject formation. This bridge principle might be a new fundamental posit, which physicalists don't need. That could undermine the parity claim because physicalists don't have an analogous gap. 

  The user emphasized that arguments about things being "unexplained" aren't sufficient; they want to know if panpsychism requires a distinctive phenomenal posit. The bridge principle seems exactly that. Even if it's not explanatory, its existence as a brute fact might be a unique commitment. Physicalists have brute facts too, but theirs are structural, not phenomenal. So panpsychism might have an extra layer of fundamental properties.

  Next, the overflow problem: multiple overlapping collections meeting integration criteria could lead to too many macro-subjects. Using maximal unity might help but introduces indeterminacy in subject identity, especially in cases like split-brain scenarios. The user is concerned this might be more damaging for conscious subjects than for tables. However, embracing some indeterminacy might be acceptable, as similar issues arise in physical composition (e.g., clouds or mountains). But conscious subjects' persistence conditions feel more stringent, so this could be a vulnerability.

  The asymmetry with cosmopsychism is another point. Cosmopsychism's decombination problem lacks a physicalist analogue, making the parity defense less applicable. This might push the user towards micropsychism, but the defense's failure there doesn't invalidate it for micropsychism. Still, it highlights that the defense isn't universally applicable, which could be a weakness if parity is central to their argument.

  Unfalsifiability is a concern. Treating composition as primitive might make the defense immune to counterexamples, but the user could argue that primitives are common in metaphysics. However, the borrowed-criterion version adds empirical vulnerability, which is a strength. If integration metrics don't align with consciousness, panpsychism could be falsified, which is a risk but also a testable aspect.

  The user wants to know which defeater is most serious. The Bridge Principle Dilemma seems critical because it challenges the core parity argument. If panpsychism needs a unique fundamental posit, it's no longer on par with physicalism. Addressing this would require showing that the bridge principle isn't an extra posit or that physicalists have similar commitments. But it's tough. Maybe reframing the bridge as a structural feature rather than a phenomenal addition, but that might dilute panpsychism's essence.

  In conclusion, the Bridge Principle Dilemma is the toughest challenge. The user should concede that panpsychism requires a fundamental bridge principle, making it distinct from physicalism. However, they can argue this is a reasonable cost compared to other views. Revising the paper to acknowledge this but defend it as necessary might strengthen their position. The borrowed-criterion version's empirical aspects add testability, which is a plus, even if it risks falsification.
answer: |-
  Here's a stress-test of your Parity Defense, focusing on your specific requests. The most serious defeater emerges from the borrowed-criterion version's internal tension, confirming your core worry.

  **Verdict: The Bridge Principle Dilemma is the most serious defeater.** While the Parity Defense survives *in a qualified form*, the borrowed-criterion move fundamentally fails to achieve parity, forcing the panpsychist into a unique commitment. The defense remains viable for bare primitivism but at the cost of reduced empirical traction. Revision would involve conceding this unique commitment and doubling down on bare primitivism or reframing the bridge principle.

  **Ranked Defeaters (Fatal to Awkward):**

  1.  **The Bridge Principle Dilemma (Fatal to Borrowed-Criterion, Problematic for Parity):**
      *   **The Problem:** Your worry is precise. Borrowed criteria (causal integration, etc.) are physical/functional. Applying them tells us *which collections are unified systems*. But it doesn't tell us *that* such systems are subjects or *have* unified macro-experience. To get from "physically integrated system" to "phenomenal subject," you need a bridge principle: *"Physically integrated systems of the type C (defined by borrowed criteria) are phenomenal subjects."*
      *   **Horn 1 (No Entailment):** Without the bridge principle, borrowed criteria designate "composite physical systems," not "composite subjects." They solve the *physical* composition question, not the *phenomenal subject-summing* problem. This buys nothing for panpsychism.
      *   **Horn 2 (New Fundamental Posit):** The bridge principle *is* a new fundamental posit. It states a necessary connection between a complex physical property (integration type C) and the existence of a novel phenomenal subject. The physicalist *does not need an analogous posit*. Their fundamental posits concern physical properties and laws; consciousness either emerges (brutely) or is identical to complex physical properties. They posit no *sui generis* principle linking complex physical structure to *fundamental subjectivity*. The panpsychist, however, posits fundamental subjectivity at the micro-level *and* this new principle linking complex structure to *novel, macro-level* fundamental subjectivity.
      *   **Why Fatal to Borrowed-Criterion Parity:** This bridge principle *is* the "bonding relation" or "restriction on composition stated experientially" you feared. It *is* a distinctive phenomenal posit the physicalist lacks. It shifts the combination problem from "how do micro-subjects sum?" to "why does *this specific physical configuration* ground a novel subject?" – a problem *only* the panpsychist faces. The promised parity vanishes.
      *   **Escaping the Dilemma?** No clean escape. One could claim the bridge principle is *constitutive* or *analytic* (a system *just is* a subject), but this seems empirically false (deeply integrated systems like global weather patterns aren't plausibly subjects) and requires justifying why only *certain* integrated systems count. This justification *is* the bridge principle by another name. The dilemma is real and both horns are live; Horn 2 is the unavoidable path for the borrowed-criterion panpsychist, destroying parity.

  2.  **The Overflow Problem & Indeterminacy (Serious but Manageable Cost):**
      *   **The Problem:** Physical composition criteria *do* generate overlapping candidates (e.g., my hand, my arm, me; the CPU, the motherboard, the computer). Standard solutions involve vagueness, context-sensitivity, or maximality.
      *   **Damage Assessment:** Panpsychism *can* embrace similar vagueness/indeterminacy for subjects. Split-brain cases, gradual anesthesia, etc., *are* ontologically messy for subjects regardless of theory – they challenge the assumption that subjects are perfectly discrete, countable, and persistent entities. Embracing this messiness is coherent.
      *   **Why Damaging Nonetheless:**
          *   **Intuition Gap:** Our intuition of subjective unity is stronger and seemingly more fundamental than our intuition about the precise boundaries of a table. Tolerance for diachronic/subject-count vagueness feels costlier for consciousness.
          *   **Epistemic Access:** We *experience* ourselves as unified subjects. We don't experience tables *as* fundamentally unified in the same immediate way. Vagueness in something so intimately known feels more problematic.
          *   **Maximality's Limits:** Relying *solely* on maximal integration can be problematic. Is a temporarily integrated subsystem (e.g., a vividly experienced limb during focused attention) a distinct subject? If maximality is the only arbiter, arguably yes – which seems counterintuitive.
      *   **Concession:** The panpsychist *must* concede that the metaphysics of macro-subjects involves significant vagueness and context-dependence in their identity and count, mirroring complex physical objects but feeling more counterintuitive. They are entitled to dismiss objections demanding *perfect* determinacy as unrealistic, but must embrace the messy consequences.

  3.  **Asymmetry with Cosmopsychism (Awkward but not Fatal to Micropsychism):**
      *   **The Problem:** Cosmopsychism's "decombination problem" (how one subject breaks into many) lacks a clear physicalist analogue. Physical composition is typically additive/bottom-up.
      *   **Does Parity Fail?** Yes, the *exact same* parity move doesn't directly apply. Physicalism has no analogue of "carving" a fundamental subject.
      *   **Does this Defeat the Parity Defense?** No, but it exposes its *scope limitation*. The defense works robustly for *micropsychism's* combination problem precisely *because* it mirrors standard physical composition. The cosmopsychist needs a different strategy for decombination. This asymmetry doesn't invalidate the defense for micropsychism; it just shows the defense is tailored to one specific version of panpsychism. It *is* a reason to prefer micropsychism *if* one finds the parity move compelling.
      *   **Concession:** The defender must concede the Parity Defense is primarily a defense of *micropsychism* against its combination problem and doesn't directly help (or hurt) cosmopsychism.

  4.  **Unfalsifiability of Bare Primitivism (Awkward Feature, Not Defect):**
      *   **The Problem:** Declaring subject/quality composition primitive risks making the view empirically untestable or immune to counterargument. Any arrangement of micro-subjects could be claimed to compose a macro-subject (or not) primitively.
      *   **Assessment:** This *is* a qualification, but likely an acceptable one for fundamental metaphysics. Similar primitives exist elsewhere (e.g., causation, laws of nature). The cost is reduced explanatory power and empirical traction. The *strength* of the defense becomes its ability to dissolve the *apparent special problem* via parity, not its empirical predictions.
      *   **Why Not a Fatal Defect?** Demanding falsifiability at the level of fundamental compositional principles may be asking too much of metaphysics. The defense's value lies in its dialectical force: "Your view has this primitive too, so don't single mine out."
      *   **Concession:** The defender must concede bare primitivism offers no specific empirical predictions about *which* collections compose subjects. Its power is purely negative/parity-based. They are entitled to dismiss demands for "how composition works" as misplaced when applied to a primitive.

  **What the Parity Defense Commits To / Predicts (Its Risks):**

  1.  **Bare Primitivism:** Commits to phenomenal composition being a fundamental, inexplicable feature of reality, alongside (or perhaps underlying) physical composition. It risks offering no deeper explanation than "it just happens."
  2.  **Borrowed-Criterion:** Commits to the **bridge principle** (as established, its unique posit). Crucially, it *does* make predictions:
      *   **Risk 1 (Empirical Hostage):** Macro-subjectivity should align tightly with the borrowed physical integration metrics (e.g., Φ from IIT, global workspace dynamics). If a system scores high on integration but lacks consciousness (e.g., a future super-AI lacking qualia, or a heavily anesthetized brain showing complex integrated processing), the view is falsified. *Conversely*, if consciousness arises in systems *lacking* standard high integration (e.g., alleged "micro-consciousness" in simple systems, or fragmented consciousness in split-brain cases), the view is challenged. This is a genuine, checkable exposure – **you are right to see this as its key risk and strength.**
      *   **Risk 2 (Bridge Principle Burden):** It must defend the fundamental status and plausibility of the bridge principle against charges of being arbitrary or *ad hoc*.

  **Defender's Concessions from Inside:**

  1.  **Concede:** The borrowed-criterion version **requires a fundamental bridge principle** linking specific physical integration types to novel macro-subjectivity. This *is* a unique posit not required by physicalism.
  2.  **Concede:** The metaphysics of macro-subjects will involve **significant indeterminacy and vagueness** in their boundaries, persistence, and count, analogous to complex artifacts/organisms but potentially more counterintuitive.
  3.  **Concede:** The Parity Defense, in its strong borrowed-criterion form, makes **panpsychism empirically vulnerable** to discoveries about the neural/physical correlates of consciousness and integration.
  4.  **Entitled to Dismiss:**
      *   Demands for an *explanation* of how primitive composition works (for bare primitivism).
      *   Objections that composition *in general* is mysterious as a reason to reject panpsychism *specifically* (parity move stands).
      *   Objections that quality composition is uniquely hard *for panpsychism* (it's the hard problem in disguise).

  **Recommendation for Revision:**

  1.  **Abandon or Radically Qualify Borrowed-Criterion:** The bridge principle dilemma is fatal to its parity ambitions. Presenting it weakens the core argument. Either:
      *   **Option A (Focus on Bare Primitivism):** Double down on the pure parity claim: "Subject-summing is no harder than table-summing; quality-summing is the hard problem for everyone." Acknowledge it offers no *positive* account but dissolves the *special* objection. Embrace its unfalsifiable nature as inherent to fundamental metaphysics.
      *   **Option B (Reframe Bridge Principle):** Acknowledge the bridge principle *is* a unique posit, but argue it's a necessary and reasonable one. Frame it not as achieving *full* parity, but as *minimizing* the extra commitments of panpsychism compared to brute emergence or fundamental macro-consciousness. Emphasize its empirical testability as a *virtue* (it risks falsification!). Explicitly contrast it with the physicalist's brute emergence – both have brute connections, but panpsychism's base is more fitting.
  2.  **Address Indeterminacy Head-On:** Develop a positive account of subject vagueness/diachronic identity within panpsychism, leveraging analogies to biology/artifacts but acknowledging the unique phenomenology.
  3.  **Clarify Scope:** Explicitly state the defense is for *micropsychism*. Acknowledge the asymmetry with cosmopsychism but argue it's irrelevant to the micropsychist's project.

  **The Most Serious Defeater Reiterated: The Bridge Principle Dilemma.** It forces the panpsychist adopting borrowed criteria into a unique fundamental commitment that the physicalist avoids, breaking the promised parity. **Does the Parity Defense survive?** Yes, but only in its **bare primitivist form**, or by conceding the bridge principle breaks strict parity while arguing it's still the best option. **If it were my paper,** I would revise to emphasize bare primitivism as the core parity argument and present borrowed-criteria cautiously, if at all, as a potentially testable but *distinct* (and uniquely committed) development, not the fulfillment of strict parity. The empirical hostage situation of borrowed-criteria is a genuine risk, but one worth taking if framed as the cost of testability. Your core insight – that the combination problem leverages demands we don't impose elsewhere – remains powerful for the bare version.
