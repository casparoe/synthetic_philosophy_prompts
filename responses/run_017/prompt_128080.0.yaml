answer: |-
  ## DEPARTMENT FOR DECISIONAL INTEGRITY  
  **Consultation Draft: Code of Practice DCP-178**  
  **Stipulated Probability Filing (Medical and Operational Contexts)**  
  *Issued under the Certainty in Choices Act 2023 (Provisional Measures)*  

  **1. Preamble**  
  1.1. Uncertainty in probabilistic parameters impedes rational choice, audit trails, and systemic coherence.  
  1.2. Agents reporting "unknown" or "unquantified" probabilities create ambiguity that prevents consistent preference ordering.  
  1.3. This Code mandates the replacement of such reports with a single, precise, filed probability value to ensure decisional hygiene.  
  1.4. Non-compliance constitutes a Category 3 Epistemic Hazard.  

  **2. Definitions**  
  2.1. **Unreported Probability (UP):** Any event likelihood described as "unknown," "unmeasured," "indeterminate," or where a reliable estimate is stated to be unavailable.  
  2.2. **Stipulated Probability (SP):** A precise numerical value (expressed 0.00 ≤ *p* ≤ 1.00, or percentage) filed to replace a UP.  
  2.3. **Filing Authority (FA):** The Department or its designated agent (e.g., clinical trial regulator, actuarial supervisor).  
  2.4. **Decision Event (DE):** Any choice between acts predicated wholly or partially on a UP now replaced by an SP.  

  **3. Core Stipulation Requirement**  
  3.1. Where a UP arises in a DE:  
  (a) The agent *must* immediately generate or accept an SP.  
  (b) The SP *must* be filed with the relevant FA prior to the DE.  
  (c) The SP becomes binding for all subsequent acts related to that DE.  
  3.2. Revision of a filed SP is prohibited post-DE (see Section 7: Enforcement and Audit).  

  **4. Generation of Stipulated Probabilities**  
  4.1. SPs may be generated by:  
  (a) Authorised departmental estimators using approved linear extrapolation templates.  
  (b) Certified randomisation devices (e.g., DDI-issue dice, quantum bit generators).  
  (c) *Where informational asymmetry is identified:* SP = *p* ± *s*, where *s* is a mandatory surcharge reflecting the gap between agent knowledge and perfect information (see Schedule B: Asymmetry Schedules).  

  **5. Worked Examples**  
  *Example 1: Therapeutic Context*  
  Situation: Patient consent form states: "For Treatment B, *no reliable estimate of response rate is available*."  
  Action: Clinician strikes text, files SP=0.42 (generated via DDI Template γ: "Novel Biologics, Unreported p").  
  Outcome: Patient chooses Treatment A (known *p*=0.50) over B (SP=0.42). Coherence achieved. Audit passed.  

  *Example 2: Ellsberg Urn Compliance*  
  Urn Composition: 30 red balls, 60 balls black or yellow (proportion unreported).  
  UP: Probability of drawing black (*P_b*), yellow (*P_y*).  
  Requirement: FA files SP_b = 0.30 (thus SP_y = 0.30).  
  *Tested Preferences:*  
  - Bet on Red (P_r=1/3) vs. Bet on Black (SP_b=0.30): Preference for Red permitted (1/3 > 0.30).  
  - Bet on Black-or-Yellow (SP_b + SP_y = 0.60) vs. Bet on Red-or-Yellow (P_r + P_y = 1/3 + 0.30 ≈ 0.633): Preference for Black-or-Yellow permitted (0.60 < 0.633).  
  Audit: Preferences are consistent with the single probability distribution (R=0.333, B=0.300, Y=0.367). Incoherence resolved.  

  *Example 3: Market Entry*  
  Situation: Firm reports "probability of regulatory rejection unknown."  
  Action: FA files SP_reject = 0.18 (DDI Template θ: "Uncharted Regulation, Tier 2").  
  Outcome: Firm invests. Subsequent rejection occurs. Audit confirms decision aligned with SP=0.18. No grounds for appeal.  

  **6. Documentation Standards**  
  6.1. All DE documentation (consent forms, investment memos, policy briefs) must display the SP.  
  6.2. Legacy phrases ("unknown," "unquantifiable risk," "cannot estimate") are deprecated. Use Form SP-7a for strikethrough/insertion.  
  *Example:* "~~No reliable estimate is available~~ [SP=0.42 filed under DCP-178, 01/04/2024, Ref: DDI-Gamma-8892]."  

  **7. Enforcement and Audit**  
  7.1. FAs will conduct random audits of DEs involving SPs.  
  7.2. **Compliance Test:** Agent’s preferences across all possible acts (bets, choices) must be consistent with the filed SP generating a single probability measure.  
  7.3. **Savage Axiom Verification (Sure-Thing Principle):** Where acts differ only in outcomes for states where the SP-event does not occur, preference ordering must be invariant. Inconsistency indicates filing error or cognitive bias. Retraining mandated.  
  7.4. Post-DE SP revision invalidates audit trails. Prohibited except via Pre-Event Variance Petition (PEVP-2 Form).  

  **8. Consultation Questions**  
  8.1. Are the SP generation methods (Section 4.1) sufficiently operational?  
  8.2. Should Template-derived SPs carry a "Modelled" flag?  
  8.3. Is the informational asymmetry surcharge (4.1c) calibrated appropriately to deter knowledge gaps?  

  **9. Appendix A: Extract from Dissenting Response**  
  *Submitted by: Association for Robust Decision Methods (ARDM)*  
  "...DCP-178 fundamentally misdiagnoses ambiguity aversion as incoherence. Where probabilities are genuinely unreported, rational agents may *correctly* use a max-min criterion: scoring acts by their worst-case performance across the *set* of possible probabilities (e.g., *P_b* could be 0.01 or 0.59). A bet on red (known *P_r*=1/3≈0.333) is preferred to a bet on black (unknown *P_b*, min=0.0) because it guarantees a minimum win probability. Conversely, betting on {black or yellow} (known *P_b+y*=2/3≈0.667) is preferred to {red or yellow} (unknown *P_r+y*, max=0.999) as it guarantees a higher minimum. This requires reporting a *range* or *set*, not an SP. Mandating an SP destroys decision-relevant information – the *existence* of ambiguity – and forces choices unjustified under true uncertainty. The Department’s cure creates larger errors than the alleged disease..."  

  *Department Response to ARDM:*  
  "ARDM’s 'range' proposal fails core operational requirements:  
  - A range cannot be filed (DCP-178 §3.1b mandates a single value).  
  - It cannot be audited for preference coherence (§7.2-7.3: requires a single measure).  
  - It encourages caution (§5, Example 2: min-max preferences reject SP-compliant acts), paralyzing decisions.  
  Ambiguity is not a licensable input. The SP protocol resolves this decisively."  

  ---

  **How to Use This Against Your Brother**  
  Quote the deadpan bureaucratic horror of Appendix A’s critique: *"Mandating an SP destroys decision-relevant information – the existence of ambiguity."* Then point to Section 4.1c and the worked urn example. The Department concedes the core point: the "incoherence" arises *because* the model annihilates your knowledge that the black-yellow split is undefined. Its solution? A *certified randomizer* (4.1b) – admitting the probability isn’t just unknown, but *unmade*. The machinery doesn’t fix ignorance; it overwrites it with arbitrary precision to sustain itself. The audit rules (§7) then punish you for feeling the loss. The satire works because the Department follows its logic faithfully into the abyss, mistaking administrative tidiness for rationality while letting the real problem – who fills the urn, and why you don’t know – fester in Schedule B. Your brother’s "incoherence" is the system’s forced error.
