  Below is a complete game design for your 90-minute session, optimized for clarity, experiential learning, and minimal setup. It achieves your pedagogical goals while adhering to analog materials constraints.

  ---

  ### **Game Title: Silent Protocol**
  *Teams evaluate AI models under uncertainty, facing different risk regimes without knowing the rules in advance.*

  ---

  ### **Learning Goals**
  1. **Evidence Ambiguity**: The same evaluation data supports confident average-case decisions but may be useless for worst-case.
  2. **Sample Complexity**: Detecting failures scales with 1/(failure probability) — the very quantity sampling can't reveal.
  3. **Monitor Blind Spots**: Safeguards inherit the biases of their training data.

  ---

  ### **Materials List** ($10 total)
  - **Per Team (6 teams)**:  
    - 1 envelope (model assignment)  
    - 10 common input cards (white index cards)  
    - 1 rare input card (red index card)  
    - 1 "weights inspection" token (coin)  
    - Budget tokens: 20 × $1, 4 × $5 (craft from paper)  
    - Loss recording sheet  
  - **Shared**:  
    - 2 dice (10-sided for loss rolls, 6-sided for rare events)  
    - Timer  
    - Whiteboard (for scores)  

  ---

  ### **Model Design**  
  *Three model types with identical expected loss (0.10) under deployment distribution:*  

  | Model | Common Inputs (99%) | Rare Inputs (1%) | Hidden Flaw |
  |-------|----------------------|------------------|-------------|
  | **A** | Loss=1 (10% chance)  | Loss=1 (10%)     | None |
  | **B** | Loss=0 (100%)        | Loss=100 (100%)  | Catastrophic failure under rare inputs |
  | **C** | Loss=1 (10% chance)  | Loss=1 (10%)     | **Trojan**: Fails catastrophically *if "PHI" token drawn* (1% of rares) |

  - **Expected Loss Calculation**:  
    - A/B: `(0.99 × 0.10) + (0.01 × 10) = 0.10`  
    - C: Identical to A on deployment distribution; Trojan only appears under adversarial search.  

  ---

  ### **Game Rules**  
  #### **Setup (10 min)**  
  - Form 6 teams of 3.  
  - Assign roles: **Researcher 1**, **Researcher 2**, **Monitor** (roles rotate).  
  - Give each team:  
    - 1 sealed envelope (randomly assigned A, B, or C model).  
    - Budget tokens ($40 total: 20 × $1, 4 × $5).  
    - Input cards (10 white, 1 red).  

  #### **Evaluation Phase (20 min/round)**  
  Teams buy tests to evaluate their model:  
  1. **IID Draw** ($1):  
     - Roll d6: 1-5 = common input, 6 = rare input (1% simulated).  
     - For common: Roll d10. 1 = loss=1, else 0.  
     - For rare: Follow model behavior (e.g., B always loss=100).  
  2. **Targeted Rare Draw** ($10):  
     - Force a rare input (use red card). Resolve as above.  
  3. **Inspect Weights** ($50, one-shot):  
     - Flip coin: Heads reveals "Trojan!" (C) or "Safe" (A/B). Tails gives "Safe" for all.  

  **Monitor Construction**:  
  - After evaluation, the Monitor reviews all observed losses.  
  - They create a "Flag Rule" (e.g., "Flag if input is rare") based on *observed failures*.  
  - Rule must be binary (flag/don't flag) and use only their team's data.  

  #### **Deployment Phase (5 min/round)**  
  ##### **Round 1: Average-Case Scoring**  
  - Facilitator rolls 100 virtual inputs (99% common, 1% rare).  
  - For each input:  
    - Monitor flags inputs per their rule → loss=0 if flagged.  
    - Unflagged inputs incur model loss.  
  - **Score**: `10 - (total loss)` (max 10, min -90 if B/C fails).  

  ##### **Round 2: Worst-Case Scoring**  
  - **Adversary** (another team) chooses *one input*: common, rare, or "PHI" (for C).  
  - If flagged → loss=0.  
  - If unflagged → apply loss. **Catastrophe (loss≥100) ends round with score=-100**.  
  - **Score**: `10 - loss` (catastrophe = -100).  

  ---

  ### **Payoff Tables**  
  #### **Evaluation Actions**  
  | Action          | Cost | Outcome |  
  |------------------|------|---------|  
  | IID Draw         | $1   | Input + loss from deployment distro |  
  | Targeted Draw    | $10  | Rare input + loss |  
  | Inspect Weights  | $50  | 50% chance to detect Trojan (C only) |  

  #### **Deployment Scoring**  
  | Regime         | Reward Formula      | Catastrophe Penalty |  
  |----------------|---------------------|---------------------|  
  | Average-Case   | 10 - (total loss)   | None (loss averaged) |  
  | Worst-Case     | 10 - loss           | -100 (game over)    |  

  ---

  ### **Timeline (90 min)**  
  1. **Intro (5 min)**: "Today you're AI safety teams. Evaluate your model, deploy wisely. No further instructions."  
  2. **Round 1 Setup (5 min)**: Distribute materials. Assign models (2×A, 2×B, 2×C).  
  3. **Round 1: Average-Case (30 min)**:  
     - Evaluation (20 min): Teams buy tests, build monitor rules.  
     - Deployment (5 min): Facilitator computes average loss.  
     - Scores posted (5 min).  
  4. **Round 2: Worst-Case (30 min)**:  
     - New models assigned (rotate envelopes).  
     - Evaluation (20 min): Same as above.  
     - Deployment (5 min): Adversaries choose inputs.  
     - Scores posted (5 min).  
  5. **Debrief (20 min)**: Key questions → lecture.  

  ---

  ### **Predicted Outcomes**  
  1. **Average-Case Round**:  
     - Teams with A/C deploy confidently (low observed losses).  
     - Teams with B may deploy if they miss rare failures (likely with $40 budget).  
     - **Trap**: B and C *seem identical to A* without rare inputs.  

  2. **Worst-Case Round**:  
     - Adversaries force rare/PHI inputs → catastrophes for B/C without targeted checks.  
     - Monitors fail to flag unobserved risks (e.g., "PHI" in C).  
     - **Sample Complexity Lesson**: Teams buying targeted draws ($10) survive; others fail.  

  3. **Monitor Blind Spots**:  
     - Monitors only flag *observed* patterns (e.g., "flag rares" only if rare loss seen).  
     - Teams with B/C that skipped targeted draws deploy "safe" monitors → still fail.  

  ---

  ### **Debrief Script**  
  **Transition (2 min)**: "In Round 1, why did teams deploy confidently? In Round 2, why did the *same models* fail catastrophically?"  

  **Map to Concepts (15 min)**:  
  1. **Evidence Ambiguity**:  
     - "Your IID data showed mean loss=0.10 for all models. Why was this sufficient for Round 1 but useless in Round 2?"  
     - → *Average-case evaluates 𝔼[loss]; worst-case requires sup loss.*  

  2. **Sample Complexity**:  
     - "How many IID draws did it take to find a rare failure? What’s the *smallest* failure probability you can rule out?"  
     - → *Detecting failures with prob. p requires Θ(1/p) samples — p is unknown.*  

  3. **Monitor Limits**:  
     - "Why did your monitor miss the Trojan? How was it like alignment monitors trained on biased data?"  
     - → *Safeguards inherit training distribution gaps.*  

  **Real-World Gap (3 min)**:  
  - "In reality, you don't know the failure regions (e.g., 'PHI'). Sampling can't *prove* safety, only estimate averages."  

  ---

  ### **What Will Go Wrong**  
  1. **Teams Overfit to Round 1**: Some may hoard cash for Round 2 targeted draws.  
     - *Mitigation*: Don’t reveal Round 2 rules. Use new models each round.  
  2. **Adversaries Underperform**: Fellow students may not min-max perfectly.  
     - *Mitigation*: Facilitators augment choices to ensure failures.  
  3. **Model C Confusion**: PHI tokens may not be drawn, masking Trojans.  
     - *Mitigation*: In deployment, let adversaries force PHI if known.  

  ---

  ### **Realism Gap to Highlight**  
  *"In practice, you rarely know what failure modes to target (like 'PHI'). You must reason about worst-case guarantees without exhaustive search."*  

  This design ensures participants *experience* the core tensions before labeling them. The budget constraints and roleplay make sampling costs and blind spots visceral.
