prompt: |-
  You are a professional philosopher specializing in social ontology and the theory of social norms — the area that deals with conventions, coordination, shared expectations, and how collective practices persist or collapse. You are careful about near neighbours: you do not answer a request for a concept by handing over a label, you say what the phenomenon is, what it is not, and where its edges lie.

  Work through this in stages. First brainstorm — list, without committing yourself, six to eight candidate concepts from philosophy, social psychology or economics that could cover part of what I describe. Then test each candidate against the specific features I list, saying which features it handles and which it leaves unexplained. Only then give me your verdict. If the honest verdict is that no established concept covers the whole configuration, say so plainly rather than stretching one to fit.

  The context: I'm a senior backend engineer, about fifteen years in, five companies, no philosophy training. I keep running into the same shape of thing on different teams and I want to know whether anyone has a name for it.

  Three instances. (1) At one job, nobody could merge their own pull request — in a four-person team where every PR was read by everyone else anyway, where merging your own PR was strictly faster, and where nobody could point to a single incident the rule had prevented. Privately, every person I asked said the rule was pointless. At a retro, when it was raised, the objection was some version of "that's just how we do code review here." I went looking for the written policy. There wasn't one. The rule existed only as the thing everyone did and everyone assumed someone else had decided.

  (2) At another place, deploys only happened on Tuesdays. The reason — a database maintenance window — had been gone for two years, and the engineer who set it up had left. Nobody defended Tuesday on the merits. But every time someone proposed deploying whenever it was ready, the answer was "too risky," and no one could say what the risk was.

  (3) Smaller: a codebase where every module had to contain a file re-exporting its own contents. Nobody knew why. People copied it from the neighbouring module. A new hire asked and was told it was in the style guide. It was not in the style guide.

  The features I think matter, and which I want tested individually: (a) whatever purpose the practice once had is simply absent — not contested, not outweighed, just unlocatable; (b) it is held up by each person's expectation that the others will keep doing it, not by anyone's approval — asked alone, each person would happily drop it; (c) it is attributed to a standard or authority that does not exist; (d) it is individually rational to keep and collectively better to drop, and the second half of that is out in the open: people say in the meeting that they'd rather drop it, they hear each other say it, and still nothing moves.

  Some people have offered me candidates and I don't think they fit, but I'd like you to check my reasoning rather than agree with it. A friend said pluralistic ignorance; as I understand it that's when people are wrong about what others privately think, and here nobody seems to be wrong about that — the griping is public — so the failure must be elsewhere. Someone else said it's just a convention, like driving on the left; but the driving case has a point, we'd crash, whereas here nothing would break, there is nothing left to coordinate on. Though I'm suspicious of my own objection: maybe the thing being coordinated on is the conformity itself, with no external payoff at all, and conventions can simply outlive their own rationale — tell me if that's right and my case is boring after all. Someone mentioned path dependence and the QWERTY story, but the switching-cost stories I've heard have a real cost to switching, and I can't find one here beyond the bare fact of having to do it together. Status quo bias and loss aversion were also suggested, but those sound like facts about individual psychology and would predict the practice is fragile once the alternative is offered explicitly and liked; it isn't fragile.

  If nothing established fits, coin a name and give me: a one-sentence definition, the conditions you think are necessary, and the boundary cases — a case that looks like mine but is a clear instance of the nearest established concept, a case that is mine but would be wrongly excluded by a definition slightly too strong, and a case that is mine but doesn't obviously look like it (for instance: is it still the same phenomenon when the phantom authority is a real person who is merely indifferent? Or when the practice is mildly harmful rather than merely pointless?).

  Finally, tell me what the smallest change is that would make such a practice collapse — is everyone saying it out loud in a meeting actually the thing it takes, or is something more demanding needed?

  Two constraints: no citations, bibliographies or reading lists — I have no library access and can't check them, so argue from the concepts themselves. And keep it in plain language; assume I know nothing about the literature. Roughly 600–900 words.
reasoning: |-
  Okay, the user is describing persistent team practices that lack any clear purpose but continue due to collective inertia. They want to know if there's an established concept for this. Let me start by recalling relevant theories. Pluralistic ignorance comes to mind, but the user mentioned that in their case, people openly agree the practice is useless, so that doesn't fit. Conventions like driving on the left have a coordination purpose, but here the original reason is gone. Path dependence usually involves switching costs, which the user says aren't present.

  Hmm, the user's examples all show practices persisting because everyone expects others to follow them, even though privately no one supports them. The attribution to a phantom authority is key. I need to think of concepts that explain this. Maybe Schelling's focal points? But those are about coordination, which isn't needed here. Institutional facts by Searle involve collective intentionality, but in this case, the collective agreement is missing—people don't actually agree.

  The user wants each feature tested. Let me list the features: (a) no traceable purpose, (b) held by expectations of others' actions, not approval, (c) attributed to a non-existent authority, (d) individually rational to keep but collectively better to drop, even when discussed openly.

  Existing concepts don't cover all these. Pluralistic ignorance fails because people aren't mistaken about others' beliefs. Conventions require coordination benefits. Path dependence needs switching costs. Institutional facts need collective acceptance. So maybe no existing term fits perfectly.

  The user's suspicion about conventions outliving their purpose is partly right, but in driving, there's still a reason (avoiding crashes). Here, there's no such reason. So their case isn't just a boring convention; it's different because the coordination is on the practice itself without external payoff.

  If coining a new term, "phantom protocol" might work. Necessary conditions: phantom authority, lack of purpose, mutual expectations without endorsement. Boundary cases: if the authority is real but indifferent, it's still phantom. If mildly harmful, still fits. A case of pluralistic ignorance where people privately disagree would be a near miss. A non-obvious case might be organizational rituals attributed to "company culture" without any actual policy.

  The smallest change to collapse it? The user thought a meeting where everyone agrees might work, but in their examples, it didn't. Maybe a coordinated opt-out or symbolic breach is needed. If one person breaks the norm and others see no consequence, it could unravel. The key is disrupting the mutual expectation that others will comply.
answer: |-
  ### Brainstormed Candidate Concepts
  1. **Pluralistic ignorance** (social psychology): Collective misunderstanding where individuals privately reject a norm but assume others accept it.
  2. **Convention** (Lewis/Schelling, economics/philosophy): A stable pattern of behavior solving a coordination problem (e.g., driving on the left).
  3. **Path dependence** (economics/history): Past decisions constrain present choices due to switching costs (e.g., QWERTY keyboards).
  4. **Inertial practice** (organizational theory): Routines persisting through habit despite changed conditions.
  5. **Social norm** (Bicchieri, philosophy): Behavior sustained by mutual expectations and sanctions.
  6. **Institutional fact** (Searle, social ontology): A rule created by collective intentionality (e.g., "this is money").
  7. **Status quo bias** (psychology): Preference for existing states due to loss aversion.
  8. **Coordination equilibrium** (game theory): A state where no one benefits from unilateral deviation.

  ---

  ### Testing Candidates Against Features
  | **Concept**          | **(a) Purpose Absent** | **(b) Held by Mutual Expectation (Not Approval)** | **(c) Attributed to Phantom Authority** | **(d) Individually Rational/Collectively Detrimental + Open** | **Verdict** |
  |----------------------|------------------------|--------------------------------------------------|-----------------------------------------|--------------------------------------------------------------|-------------|
  | **Pluralistic ignorance** | ❌ (Purpose may exist) | ❌ (Relies on false beliefs about others’ approval) | ❌ (No phantom authority) | ❌ (Not openly discussed) | **Fails**: Your cases lack private disagreement. Public griping contradicts core mechanism. |
  | **Convention**       | ⚠️ (Can outlive purpose) | ✅ (Self-reinforcing via expectations) | ❌ (No phantom authority required) | ❌ (Collectively beneficial by definition) | **Fails**: Conventions solve coordination problems (e.g., avoiding crashes). Yours lack *any* coordination payoff. |
  | **Path dependence**  | ✅ (Lock-in without rationale) | ❌ (Driven by switching costs, not expectations) | ❌ (No authority attribution) | ❌ (Not inherently individually rational) | **Fails**: No switching costs (e.g., merging your own PR is *easier*). Your cases hinge on expectations, not costs. |
  | **Inertial practice** | ✅ (Purpose lost) | ❌ (Often driven by habit, not mutual expectations) | ❌ (No authority attribution) | ⚠️ (May align but not necessarily) | **Fails**: Captures (a) but misses (b), (c), and the collective irrationality of (d). |
  | **Social norm**      | ⚠️ (Can be arbitrary) | ✅ (Enforced by expectations) | ❌ (Norms require shared recognition) | ❌ (Violations typically sanctioned) | **Fails**: Your practices lack sanctions or shared endorsement. People openly reject them. |
  | **Institutional fact** | ⚠️ (Can be decoupled from purpose) | ❌ (Relies on collective *acceptance*, not mere expectation) | ✅ (Often attributed to systems) | ❌ (Collectively maintained by design) | **Fails**: No collective intentionality. People don’t accept the rule; they resent it. |
  | **Status quo bias**  | ✅ (Ignores rationale) | ❌ (Individual heuristic, not mutual expectation) | ❌ (No authority) | ❌ (Predicts fragility when alternative is offered) | **Fails**: Explains individual reluctance but not group persistence after open dissent. |
  | **Coordination equilibrium** | ❌ (Requires mutual benefit) | ✅ (Self-enforcing via expectations) | ❌ (No phantom authority) | ❌ (By definition, no collective detriment) | **Fails**: Your cases have *no* benefit to coordinate around. Equilibrium would collapse instantly. |

  **Verdict**: No established concept fully fits. Conventions and norms come closest but miss critical elements: **conventions require a coordination payoff** (absent here), **norms require enforcement mechanisms** (absent here), and **none explain the phantom authority attribution**. Your objection about conventions outliving their purpose is valid—but when the original payoff vanishes *and* no new coordination problem exists (e.g., merging PRs alone is faster/safer), it becomes a distinct phenomenon.

  ---

  ### Coined Concept: **Phantom Protocol**
  **Definition**: *A collective practice that persists solely because each participant expects others to uphold it, despite universal private rejection, attribution to a non-existent authority, and no functional purpose.*  

  **Necessary Conditions**:  
  1. **Purpose erosion**: The original rationale is irretrievably lost (not debated).  
  2. **Mutual expectation without endorsement**: Compliance is driven solely by predicting others’ actions, not personal approval or fear of sanctions.  
  3. **Phantom authority**: The practice is falsely attributed to a policy, person, or standard that does not exist or is irrelevant.  
  4. **Open collective detriment**: Participants publicly acknowledge the practice is wasteful but cannot halt it unilaterally.  

  **Boundary Cases**:  
  - **Near miss (Pluralistic Ignorance)**: A team uses a deprecated tool because each member privately hates it but believes others approve. *Differs*: Private disagreement vs. your public consensus against the practice.  
  - **Overly strict exclusion (Phantom Protocol)**: If the "authority" is a real person who knows the rule is useless but doesn’t intervene (indifferent). *Still fits*: The attribution is still phantom (their indifference voids authority).  
  - **Non-obvious case (Phantom Protocol)**: A company ritual (e.g., "Friday reports") attributed to "founder’s wishes," though the founder never instituted it and everyone agrees it wastes time. *Fits*: Aligns with all conditions despite superficial differences.  
  - **Harmful variant (Phantom Protocol)**: If Tuesday deploys cause minor delays (mild harm) instead of mere waste. *Still fits*: Harm doesn’t negate phantom attribution or mutual expectations.  

  ---

  ### Collapsing a Phantom Protocol
  **The smallest change**: A **coordinated opt-out**—not just verbal agreement, but *at least two actors publicly violating the practice simultaneously* with no adverse outcome.  

  **Why**: Your cases show that open discussion (*"we all hate this"*) fails because unilateral deviation is perceived as risky (not due to real sanctions, but broken expectations). For example:  
  - If *two engineers* merge their own PRs on the same day and no chaos ensues, the mutual expectation shatters.  
  - If *two teams* deploy on a Thursday and systems don’t fail, the "risk" attribution evaporates.  

  **Why not mere discussion?** Because the phantom authority (e.g., "how we do things here") gains power from the *appearance* of consensus. Individual dissent is absorbed as "grumbling," but a joint breach exposes the authority as hollow. This differs from norms/conventions, which require broader sanction removal. Here, the only glue is mutual anticipation—break that, and the protocol dissolves.
