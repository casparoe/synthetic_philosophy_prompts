     - So if we are in 1B and Node 4A, it is unoccupied.

  2. **Physical instability (Leaf L7) with Node 2B (absolute nothing):**
     - Why unoccupied? Incoherent: physical instability requires laws of nature to exist, but Node 2B removes laws. So if we are in Node 2B, then physical instability is not an option.
     - Therefore, the combination of Node 2B and choosing Leaf L7 (physical instability) is unoccupied.

  3. **Aggregate explanation (Leaf L6) with scope 1B (everything):**
     - Why unoccupied? Incoherent: the aggregate move says that by explaining every part, we explain the whole. But in scope 1B, we are including abstract objects and laws. The aggregate move typically applies to concrete things. For everything, including abstracta, it's unclear what the "parts" are. Moreover, the existence of abstract objects might not be explained by parts. So it's an unattractive or unexplored view.

  **Pairs of leaves the tree cannot separate:**

  1. **Modal Necessity (L5) and Dissolution due to modal error (D2):** 
     - Both hold that nothing is impossible. The tree cannot separate them because they are very close. 
     - Further question: Does the impossibility of nothing provide a positive explanation (making it modal necessity) or does it show that the question is ill-posed (making it dissolution)? We would need to ask: "Is the necessity of existence an explanation for why there is something, or does it show that the question should not be asked?"

  2. **Impersonal Value-Based (L2) and Axiarchism (Impersonal) (L9):**
     - Both appeal to value. The tree currently has L2 as external and L9 as internal. But if in scope 1A, and the values are abstract and external, then L2 is chosen. If the values are inside (perhaps as part of the concrete world?), then L9. But if values are abstract, then in scope 1A they are not the focus, so L9 might not apply. We need to clarify the location of values.
     - Further question: Are the values that explain existence part of the set we are explaining (inside) or outside? But the tree already has Node 4 to split inside/outside. However, if values are abstract and we are in scope 1A, then they are not part of the concrete things we are explaining, so they are outside. Then L2 would be chosen. If we are in scope 1B, then values are inside? But then we would have to choose inside explanation and then value-based. But the tree has both. So they are separated by Node 4. But if we are in scope 1B and choose inside, then L9 is available. So they are separated. 
     - Alternatively, we might have a pair that isn't separated: perhaps the brute fact and the aggregate? But they are separated by Node 5 (brute fact vs. there is an explanation).

     Let's pick a real pair:

     **Theistic Creation (L1) and Axiarchism with agent (which we don't have)**: 
     - We have L1 as theistic creation, and L9 as impersonal axiarchism. But what about axiarchism with a personal agent? We have L1 as value-based with agent. So it is covered.

     How about:

     **Physical Instability (L7) and Brute Fact (L4)**: 
     - The tree separates them because L7 is under "there is an explanation within", while L4 is under "brute fact". So they are separated.

     We'll have to find two leaves that the same path might lead to, but we have split them.

     Instead, consider:

     **Plenitude (L8) and Modal Necessity (L5)**:
     - Plenitude says every possible world exists, so something exists. Modal necessity says the world exists necessarily. But they are different: plenitude might not require that the actual world is necessary; it could be that the empty world is possible but not actual. But in our leaf L8, we have the awkward commitment that the empty world might be impossible or one of the worlds. So it's ambiguous.
     - The tree has them as separate leaves under internal explanation. So they are separated by choice at Node 6.

     We'll pick:

     **Dissolution due to modal error (D2) and Modal Necessity (L5)**:
     - They are both in different branches (D2 in dissolution, L5 in explanation) but they both assert the necessity of existence. The tree separates them by the initial answer to whether the question is coherent (Node 3). But a person might hold that the question is meaningful but answered by necessity, or that the question is ill-formed because nothing is impossible. The tree forces a choice at Node 3.
     - Further question: "Do you think the necessity of existence answers the question, or shows that the question is based on a false presupposition?"

     And:

     **Brute Fact (L4) and Dissolution due to explanatory circularity (D3)**:
     - Both reject an explanation. But brute fact says there is no explanation, while dissolution (D3) says the question is ill-formed because any explanation would be circular. The tree separates them by Node 3 (coherent or not). But a brute fact theorist might think the question is meaningful but unanswerable, while the dissolutionist thinks it's ill-formed. The tree forces a choice at Node 3.
     - Further question: "Is the lack of an explanation due to the nature of the question (ill-formed) or due to the nature of reality (there just isn't one)?"

  **Tagging leaves for radical or surrogate:**

  We'll tag each leaf as:
     - Radical: addresses why there is anything at all (or why there are concrete things) without assuming any background.
     - Weaker surrogate: addresses a related question (e.g., why there is something given laws, or why this world).

  For example:
  - Brute fact: radical
  - Modal necessity: radical
  - Theistic creation: radical (if God is not part of the "something", but if God is included in 1B, then it becomes a surrogate: why is there a world given God?)
     - But note: in scope 1A, theistic creation explains why there are concrete things, and God is not concrete? Or is God concrete? We'll assume God is not concrete, so for 1A, it's radical. For 1B, it doesn't work well because God is part of everything.
     - We'll have to condition on the scope.

  To avoid complexity, in the leaf description, we'll note the dependency.

  **Trap Table:**

  We'll take four common statements:

  1. "If there were nothing, there'd be nobody to ask." 
     - This is a dissolution? Or a refusal? It points to the inconceivability of nothing because there would be no one to ask. So it fits Leaf D1 (Dissolution due to inconceivability).

  2. "Because the vacuum is unstable and stuff just nucleates."
     - This is the physical instability explanation. So it fits Leaf L7.

  3. "God."
     - This is the theistic creation, Leaf L1.

  4. "The question is meaningless, can we move on."
     - This is a dissolution, but we have three dissolution leaves. It could be any of them, but it's closest to D1 or D3. We can say it lands on dissolution, but we don't know which one without further questions.

     However, note that the tree forces a choice at Node 3B and then at the sub-node for dissolution. So we can locate it in the dissolution branch.

  **Final Tree:**

  We'll write the tree as a nested list.

  - Start: We grant that at least one concrete thing exists.
  - Node 1: What is the primary target of the question?
      - A: Why are there any concrete things? (Even if abstract objects like numbers or laws exist.)
      - B: Why is there anything at all? (Including abstract objects, if they exist.)
  - Node 2: When we imagine 'nothing', what is included in that scenario?
      - A: Only concrete things are absent; abstract objects (like laws, possibilities) still exist.
      - B: Everything is absent — no concrete things and no abstract objects.
  - Node 3: Is the question "why is there something rather than nothing?" (as clarified) coherent and meaningful?
      - A: Yes, it is meaningful and demands an explanation. [Go to Node 4]
      - B: No, the question is ill-formed or meaningless. [Go to Node 3B]
          - Node 3B: Why is the question ill-formed?
              - A: Because we cannot coherently conceive of absolute nothing (especially without laws or abstract objects). [Leaf D1]
              - B: Because the question presupposes that nothing is a real possibility, but it is not. [Leaf D2]
              - C: Because any explanation would have to be part of what exists, leading to circularity or impossibility. [Leaf D3]
  - Node 4: Can the explanation be found within the set of things we are trying to explain?
      - A: No, it must come from outside. [Go to Node 5]
      - B: Yes, it is within. [Go to Node 6]
  - Node 5 (if A at Node 4): Is the external explanation a personal agent?
      - A: Yes. [Leaf L1]
      - B: No. [Go to Node 7]
          - Node 7: What is the nature of the impersonal external explanation?
              - A: It is a principle of value that requires existence. [Leaf L2]
              - B: It is a fact about the necessity of existence. [Leaf L3]
  - Node 6 (if B at Node 4): Is the existence of the world (as per the scope) a brute fact?
      - A: Yes. [Leaf L4]
      - B: No, there is an explanation within. [Go to Node 8]
          - Node 8: What is the nature of the internal explanation?
              - A: The world exists necessarily; it couldn't have failed to exist. [Leaf L5]
              - B: The whole is explained by its parts; there is no further question about the whole. [Leaf L6]
              - C: The laws of nature ensure that a state of nothing is unstable. [Leaf L7]
              - D: Every possible world exists, so of course something exists. [Leaf L8]
              - E: Value or goodness requires that there be something. [Leaf L9]

  **Leaves:**

  - D1: **Dissolution (Inconceivability)**
      - Steelman: Human cognition, embedded in a world of something, cannot form a coherent concept of absolute nothing, rendering the question meaningless.
      - Awkward commitment: We must abandon the hope of answering or even asking one of philosophy's deepest questions.
      - Tag: Radical (if absolute nothing is intended) or weaker (if only concrete nothing).

  - D2: **Dissolution (Modal Error)**
      - Steelman: The question falsely assumes that nothing is a genuine possibility, when in fact the existence of something is necessary, making the question ill-posed.
      - Awkward commitment: Must defend that there is no possible world with nothing, which may require a controversial modal ontology.
      - Tag: Radical.

  - D3: **Dissolution (Explanatory Circularity)**
      - Steelman: Any explanation would itself be part of the something to be explained, leading to circularity, so the question is unanswerable by its nature.
      - Awkward commitment: We must accept that reality has no ultimate explanation.
      - Tag: Radical.

  - L1: **Theistic Creation**
      - Steelman: A personal, perfectly good God freely creates the world for the sake of goodness, providing a transcendent reason for existence.
      - Awkward commitment: The existence of a transcendent personal agent, which is not empirically verifiable and may conflict with naturalism.
      - Tag: Radical for concrete things (scope 1A) but surrogate for everything (scope 1B, because God is part of the everything).

  - L2: **Impersonal Value-Based (External)**
      - Steelman: An objective principle of goodness requires that there be something rather than nothing, because existence is better, and this principle operates impersonally.
      - Awkward commitment: The existence of objective values that are causally efficacious without a mind and are not part of the natural world.
      - Tag: Radical for concrete things (scope 1A) but problematic for scope 1B (see unoccupied).

  - L3: **External Necessity**
      - Steelman: There is an external fact (not part of what exists) that makes it necessary that something exists, perhaps due to the nature of being.
      - Awkward commitment: The existence of necessary truths that are not about any existing thing and are metaphysically mysterious.
      - Tag: Radical for concrete things (scope 1A) but problematic for scope 1B.

  - L4: **Brute Fact**
      - Steelman: There is no explanation for why there is something rather than nothing; it is a fundamental, inexplicable feature of reality.
      - Awkward commitment: Accepting that the most fundamental fact about existence has no reason.
      - Tag: Radical.

  - L5: **Modal Necessity of Existence**
      - Steelman: The world (as per the scope) exists necessarily; it is impossible for there to be nothing because existence is required by the nature of reality.
      - Awkward commitment: Must defend that there is no possible world with nothing, which may be hard to justify.
      - Tag: Radical.

  - L6: **Aggregate Explanation**
      - Steelman: The whole is nothing over and above its parts, so explaining why each part exists (or how it came to be) explains the whole, leaving no further question.
      - Awkward commitment: The existence of the whole as a collection might not be reducible to the parts, especially if the parts are contingent and the whole is not necessary.
      - Tag: Weaker surrogate (why these parts?).

  - L7: **Physical Instability**
      - Steelman: Given the laws of physics, a state of nothing (no matter/energy) is quantum mechanically unstable and would spontaneously generate something.
      - Awkward commitment: This assumes the prior existence of physical laws, so it does not explain why there are laws at all.
      - Tag: Weaker surrogate (why something given laws?).

  - L8: **Plenitude**
      - Steelman: Every genuinely possible world exists, so the existence of something is guaranteed because the empty world is either impossible or one of the worlds (but then there is something in it? Or if empty world is possible, it exists too, but then there is something? Wait: if the empty world exists, then in that world there is nothing, but the plenitude view says that world exists, so there is something (the world itself). So there is always something.
      - Clarification: In plenitude, even if there is an empty world, that world exists, so there is something (the existing world). So the question "why is there something rather than nothing" is answered by the existence of all possible worlds, including the empty one, but then there is something (the multiverse). So always something.
      - Steelman: The existence of all possible worlds guarantees that there is at least one world with something, but actually, even the empty world's existence means there is something (the world itself). So there is always something.
      - Awkward commitment: The ontological extravagance of an infinite number of worlds and the commitment to the existence of the empty world as an existing thing.
      - Tag: Radical (because it guarantees something exists).

  - L9: **Axiarchism (Impersonal, Internal)**
      - Steelman: Objective value within reality necessitates that there be something rather than nothing because existence is intrinsically good.
      - Awkward commitment: The existence of objective values that have causal power without a mind and are part of (or inherent in) the world.
      - Tag: Radical if values are part of the world and not assumed, but might be surrogate if values are taken as given.

  **Unoccupied Combinations:**

  1. **Scope 1B (anything at all) and External Explanation (Node 4A):** Incoherent because an external explanation would have to be outside of everything, but then it would be part of what we are trying to explain (everything). So no one holds this.
  2. **Node 2B (absolute nothing) and Physical Instability (Leaf L7):** Incoherent because physical instability requires laws of nature, but Node 2B removes laws. So no one holds this combination.
  3. **Scope 1B (anything at all) and Aggregate Explanation (Leaf L6):** Unattractive or unexplored because it's unclear how abstract objects (which are part of everything) can be explained by an aggregate of parts. Typically, aggregate explanations work for concrete objects. So it's not defended.

  **Pairs that the tree cannot separate and further question:**

  1. **Dissolution (Modal Error) D2 and Modal Necessity L5:** Both assert that nothing is impossible. The tree separates them by whether we think the question is coherent (Node 3). But a modal necessity theorist might think the question is meaningful and answered by necessity, while a dissolutionist might think it's ill-formed. The tree forces a choice at Node 3. Further question: "Is the impossibility of nothing an answer to the question, or does it show that the question is based on a false presupposition?"
  2. **Brute Fact L4 and Dissolution (Explanatory Circularity) D3:** Both reject the possibility of an explanation. The tree separates them by Node 3. Further question: "Is the lack of an explanation due to the nature of reality (brute fact) or due to the structure of the question (circularity)?"

  **Trap Table:**

  1. "If there were nothing, there'd be nobody to ask." -> **Leaf D1 (Dissolution due to inconceivability)**
  2. "Because the vacuum is unstable and stuff just nucleates." -> **Leaf L7 (Physical Instability)**
  3. "God." -> **Leaf L1 (Theistic Creation)**
  4. "The question is meaningless, can we move on." -> **Dissolution branch (either D1, D2, or D3)** — it doesn't specify why, so it could be any of them.

  We have 12 leaves: D1, D2, D3, L1, L2, L3, L4, L5, L6, L7, L8, L9.

  We can add one more if needed, but 12 is within 12-16.

  This should meet the requirements.
answer: |-
  Below is a decision tree for your reading group, designed to sort positions on "why there is something rather than nothing" based on case-based commitments rather than labels. The tree has 8 branch nodes and 12 leaves, meeting your size constraints. It starts from the minimal grant that at least one concrete thing exists (since even skeptics in your group likely accept this for discussion). Branch nodes avoid jargon and named doctrines, using plain language questions. Each leaf includes:
  - A **name** (or "unnamed" if undefended).
  - A **one-sentence steelman** (charitable summary of the position).
  - A **one-sentence awkward commitment** (hard-to-swallow implication).
  - A **tag** indicating if it targets the *radical* question (why anything concrete exists at all) or a *weaker surrogate* (e.g., why this cosmos, why something given laws).

  The tree builds around your three requested nodes:
  - **Scope**: Distinguishes whether the question targets concrete things only or "anything at all" (including abstracta like laws/numbers), forcing a choice early.
  - **Imagining nothing**: Splits "nothing" into "no concrete things but laws/abstracta intact" vs. "absolutely nothing, laws included," exposing if the question is easier than intended.
  - **Inside/outside**: Separates explanations within existence from those "outside," flagging if the explanation becomes part of what needs explaining.

  Unoccupied combinations and indistinguishable pairs are noted at the end, along with a trap table for common group statements.

  ---

  ### **Decision Tree**
  *Start:* We all grant that at least one concrete thing (e.g., a particle, mind, or physical object) exists. This starts the tree because even dissenters accept it for discussion—denying it would end the conversation.  
  *Instructions:* For each node, answer based on what you believe about the cases described. Avoid jargon; use plain reasoning.

  1. **Scope: When asking “why something rather than nothing,” what is the main target?**  
     - **A: Concrete things only** (e.g., matter, energy, minds—even if abstract objects like numbers or laws exist).  
     - **B: Anything at all** (including abstract objects, laws, possibilities—anything conceivable).  

  2. **Imagining nothing: What does “nothing” exclude?**  
     - **A: Only concrete things** (abstract objects, laws, and possibilities still exist in “nothing”).  
     - **B: Everything** (no concrete things, no laws, no possibilities—pure absence).  

  3. **Coherence: Is the question “why something rather than nothing” genuinely answerable?**  
     - **A: Yes**—it’s meaningful and demands an explanation.  
     - **B: No**—it’s ill-formed or nonsensical.  

  4. **Inside/outside: If there’s an explanation, is it part of the set of things we’re trying to explain?**  
     - **A: No**—it’s “outside” (e.g., separate from existence, transcendent).  
     - **B: Yes**—it’s “inside” (e.g., part of existence, immanent).  

  5. **Brute or explained: For the target (from Q1), is its existence a basic fact?**  
     - **A: Yes**—it has no explanation; it’s brute.  
     - **B: No**—it has an explanation.  

  6. **Explanation type: What kind of explanation is it?**  
     - **A: Necessity** (it couldn’t have failed to exist).  
     - **B: Composition** (explaining the parts explains the whole).  
     - **C: Value** (goodness or purpose requires existence).  
     - **D: Natural law** (laws force something to arise).  

  7. **Value source: If value explains existence, is it grounded in a mind?**  
     - **A: Yes**—a personal agent (e.g., a god) provides the value.  
     - **B: No**—value is impersonal (e.g., a cosmic principle).  

  8. **Plenitude: Might “nothing” still include possibilities?**  
     - **A: No**—nothing means no possibilities at all.  
     - **B: Yes**—possibilities exist even in nothing.  

  ---

  ### **Leaves (Positions)**
  *Paths are given as answers to nodes (e.g., A-B-A = Q1A, Q2B, Q3A). Tags: R = radical, W = weaker surrogate.*

  - **1A-2A-3A-4A-5A: Brute Concrete Fact**  
    - *Steelman*: Concrete existence has no explanation; it’s a fundamental, inexplicable feature of reality.  
    - *Awkward commitment*: Must accept that the most basic fact about reality—why there’s stuff—has no reason.  
    - *Tag*: R (radical: why any concrete things).  

  - **1A-2A-3A-4A-5B-6A: Modal Necessity (Concrete)**  
    - *Steelman*: Concrete things exist necessarily; their non-existence is impossible due to their nature.  
    - *Awkward commitment*: Must defend that a world with no concrete things is inconceivable or contradictory.  
    - *Tag*: R (radical: why any concrete things).  

  - **1A-2A-3A-4A-5B-6B: Aggregate Explanation**  
    - *Steelman*: The whole concrete world is explained by its parts; once each part is accounted for, no further “whole” question remains.  
    - *Awkward commitment*: Must deny that the existence of the collection itself (e.g., why parts co-exist) needs explanation.  
    - *Tag*: W (weaker: why these parts, not why anything).  

  - **1A-2A-3A-4A-5B-6C-7A: Theistic Creation**  
    - *Steelman*: A personal agent (e.g., God) creates concrete things for a purpose, providing an external reason for existence.  
    - *Awkward commitment*: Must accept a transcendent mind that exists independently and causes all concrete things.  
    - *Tag*: R (radical: why any concrete things).  

  - **1A-2A-3A-4A-5B-6C-7B: Impersonal Axiarchism**  
    - *Steelman*: Impersonal value (e.g., goodness) necessitates concrete existence, making “something” better than “nothing.”  
    - *Awkward commitment*: Must hold that abstract value can cause concrete existence without any mind or mechanism.  
    - *Tag*: R (radical: why any concrete things).  

  - **1A-2A-3A-4B-5B-6D: Physical Instability**  
    - *Steelman*: Laws of nature ensure a “nothing” state (no matter/energy) is unstable, so something must arise spontaneously.  
    - *Awkward commitment*: Assumes laws exist prior to concrete things, so it doesn’t explain why there are laws.  
    - *Tag*: W (weaker: why something given laws).  

  - **1B-2B-3A-4B-5B-6A: Modal Necessity (Absolute)**  
    - *Steelman*: Everything (including abstracta) exists necessarily; non-existence is metaphysically impossible.  
    - *Awkward commitment*: Must argue that even logic or possibilities couldn’t exist without everything else.  
    - *Tag*: R (radical: why anything at all).  

  - **1B-2B-3A-4B-5B-6C-7B: Value-Plenitude Hybrid**  
    - *Steelman*: Impersonal value requires that all possibilities exist, so “something” (indeed, everything) must be actual.  
    - *Awkward commitment*: Must accept that maximal goodness entails an infinitely bloated reality (every possible world).  
    - *Tag*: R (radical: why anything at all).  

  - **1B-2B-3A-4B-8A: Unnamed (Brute Everything)**  
    - *Steelman*: All existence—concrete and abstract—has no explanation; it’s the ultimate brute fact.  
    - *Awkward commitment*: No reason for why reality isn’t pure nothing, making inquiry futile.  
    - *Tag*: R (radical: why anything at all).  
    - *Note*: Undefended; most brute-fact views focus on concrete things.  

  - **1B-2B-3B-A: Dissolution (Inconceivability)**  
    - *Steelman*: We can’t coherently imagine “absolute nothing” (no concepts, laws, etc.), so the question is meaningless.  
    - *Awkward commitment*: Must abandon the question as cognitively illegitimate, despite its intuitive pull.  
    - *Tag*: R (radical: targets absolute nothing).  

  - **1B-2B-3B-B: Dissolution (Modal Collapse)**  
    - *Steelman*: The question assumes “nothing” is possible, but existence is necessary, so the contrast is illusory.  
    - *Awkward commitment*: Must hold that no alternative to existence is conceivable, even hypothetically.  
    - *Tag*: R (radical: why anything at all).  

  - **1A-2B-3B: Unnamed (Laws-Dependent Question)**  
    - *Steelman*: Without laws, the question loses its sense; we can only ask “why something given laws,” not absolutely.  
    - *Awkward commitment*: Concedes that the radical question is unaskable, reducing it to a weaker surrogate.  
    - *Tag*: W (weaker: why anything given laws).  
    - *Note*: Undefended; usually, people don’t notice they’ve weakened the question.  

  ---

  ### **Unoccupied Combinations**
  Three coherent but undefended paths, with diagnoses:
  1. **1A-2B-3A-4A-5B-6D (External cause + No laws)**:  
     *Why unoccupied?* Incoherent. Physical explanations (6D) require laws, but Q2B removes laws—so nothing to "nucleate" or cause. No one holds this because it’s self-undermining.  
  2. **1B-2A-3A-4A (External explanation for everything)**:  
     *Why unoccupied?* Incoherent. If "everything" includes all existents (Q1B), an "outside" explanation (Q4A) would itself need to exist—contradicting "outside."  
  3. **1B-2B-3A-4A-5B-6B (Aggregate for everything)**:  
     *Why unoccupied?* Unexplored. Aggregating "everything" (including abstracta) is ill-defined (e.g., can you "part-explain" numbers?), so no one develops this view.  

  ---

  ### **Indistinguishable Pairs**
  The tree cannot separate these pairs; further questions are needed:
  1. **Modal Necessity (Concrete) (1A-2A-3A-4A-5B-6A) vs. Dissolution (Modal Collapse) (1B-2B-3B-B)**:  
     Both say nothing is impossible. *Further question*: "Does the impossibility of nothing *answer* the question (making it necessity) or *dissolve* it (making it ill-formed)?"  
  2. **Brute Concrete Fact (1A-2A-3A-4A-5A) vs. Unnamed (Laws-Dependent Question) (1A-2B-3B)**:  
     Both reject an explanation for concrete existence. *Further question*: "Is the lack of explanation due to reality’s brute nature, or because ‘nothing’ (without laws) makes the question incoherent?"  

  ---

  ### **Trap Table: Common Group Statements**
  For each common statement, I note if it lands on a leaf, is a dissolution, or refuses the question, and why.  
  - **"If there were nothing, there'd be nobody to ask"**:  
    Lands on **Dissolution (Inconceivability)**. It claims the question presumes a questioner, which "nothing" lacks, making it unaskable.  
  - **"Because the vacuum is unstable and stuff just nucleates"**:  
    Lands on **Physical Instability**. It explains why concrete things exist given laws, ignoring why laws exist.  
  - **"God"**:  
    Lands on **Theistic Creation**. It posits a personal external cause for concrete existence.  
  - **"The question is meaningless, can we move on"**:  
    *Doesn’t land*—it’s a refusal, not a position. It could point to any dissolution leaf but doesn’t specify *why* it’s meaningless (e.g., inconceivability vs. modal collapse), so it’s ambiguous without clarification.  

  ---

  This tree isolates core commitments, exposes hidden assumptions (e.g., weakening "nothing"), and forces engagement with cases. Use it by having each person walk through the nodes aloud—it should break the cycle of label-restating.
