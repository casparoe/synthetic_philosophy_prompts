prompt: |-
  I am a science and ideas journalist, and I am writing the section of my magazine's style guide that governs mental-state and epistemic vocabulary about AI systems — knows, believes, understands, reasons, wants, refuses, is confused, is in pain. At the moment my desk decides these case by case, which produces visible inconsistency: the same system is described in one piece as reasoning step by step toward an answer and in another as emitting text that resembles reasoning. I do not want an essay on consciousness. I want a procedure I can run repeatedly, under deadline, with a standards editor signing off.

  The backdrop is the old thought experiment in which a person conducts a long conversation with Einstein's preserved brain and cannot tell, from the conversation alone, whether they are addressing something that thinks or something that merely behaves as though it does — together with the companion suggestion that a sufficiently enormous book of prepared replies could hold up its end of an indefinitely long conversation. Assume that the question of whether flawless conversational performance amounts to understanding is genuinely open, and that our copy has to be written while it remains open.

  Here is my half-formed proposal, which I would like you to test, sharpen, or replace with something better. Our house style currently has a binary: report what the system output, or attribute mentality to it. I suspect the useful cut is threefold rather than binary — output-level vocabulary (it produced, it declined, it gave), competence-level vocabulary (it knows the capital of France, it can solve, it distinguishes), and experience-level vocabulary (it understands, it believes, it is distressed) — and that conversational evidence of the Einstein's-brain kind can only ever license the first two, never the third, because the very thing in question is whether that evidence discriminates. A second suspicion: our current allergy to mental verbs is not neutrality either, since refusing to write that a system knows anything, or wrapping every verb in scare quotes, is itself a claim about the system that a reporter may not be in a position to make.

  Please deliver the following.

  One, an ordered decision procedure — the questions to ask, in order, about any sentence under consideration, with a statement of what counts as a sufficient answer to each and where the procedure terminates in a no. It must be usable without access to model internals, training details, or a research team, and it must tell the desk what to do when the relevant fact is not obtainable at all.

  Two, a distinction between reporting and endorsing that survives contact with real copy: what happens when a source or an ordinary user says of a system that it understood them, and what the reporter is doing when they quote it.

  Three, a two-tier version: a sixty-second pass for breaking news and a full pass for features, with a note on which steps the short version drops and what errors that invites.

  Four, worked applications to three cases: a news story on a chatbot whose medical advice to a reader turned out to be correct; a feature in which the writer wants to say that a bereaved user felt understood by a bereavement chatbot; and a system that persistently emits false factual claims, where the desk must choose between writing that the model says, claims, or believes something false.

  Five, one application where the procedure returns an answer I will not like. In particular, tell me honestly whether applying it consistently also forbids the mental-state and knowledge vocabulary we routinely use about non-AI things in the same issue — a company that knew its drug was dangerous, a dog that knows its owner — and if so whether that is a reductio of the procedure or a conclusion I should accept.

  Six, the residue: the cases the procedure cannot settle, where an editor has to decide because the question is one of values or of tone rather than fact. I am thinking especially of headlines, where space forbids qualification; of first-person or reconstructed passages; and of the difference between a description that is theory-laden and one that is merely vivid.

  Please write in American English, in polished house-style prose, at roughly 1,200 to 1,600 words, organized so it can be pasted into a style document. Refer to positions and arguments rather than to papers or authors; I will supply any citation the final version needs.
reasoning: |-
  Okay, the user is a science journalist creating a style guide for mental-state language about AI. They need a practical, repeatable procedure under deadline pressure. The core tension: how to describe AI capabilities without anthropomorphizing or implying consciousness, while avoiding the false neutrality of scare quotes.

  Hmm, their Einstein's brain analogy is key - flawless conversation doesn't prove understanding. Their proposed three-tier framework (output/competence/experience) seems sound but needs operationalizing. The real challenge is making this actionable for journalists who can't access model internals.

  First, I'll build a decision tree that starts from observable behavior. Step 1 must be "is this literally about output?" to catch low-hanging fruit like "the system produced text". That avoids overcomplicating simple cases. 

  For competence claims ("knows capitals"), I'll require both functional success and contextual appropriateness - but how to verify without research access? Publicly available benchmark data could work. If benchmarks show 99% accuracy on capitals and the output matches, "knows" passes. No benchmarks? Demote to output-level description. 

  Experience-level claims ("believes") get the strictest test. Following the Einstein premise, no behavioral evidence suffices. But what about indirect attribution like "users felt understood"? Need clear rules: reporters can describe the user's perception but must frame it as such. 

  The two-tier approach is smart. Breaking news can skip the competence verification step - just report outputs. Features get the full treatment. Trade-off: speed risks overstatement, but that's ethical for time-sensitive news. 

  Testing on their medical chatbot example: Output-level ("responded with correct advice") always safe. Competence ("has medical knowledge") requires proof of consistent accuracy across cases. Experience-level ("understood the query") forbidden. 

  Biggest landmine: Does this forbid saying "the company knew" about human actors? Yes, and consistently so - but that exposes how casually we anthropomorphize corporations. The user might hate this, but it's logically consistent. They'll need to decide if that's a flaw or a feature. 

  Unresolved: headlines force oversimplification. Recommendation: permit competence verbs there but ban experience verbs. First-person narratives get trickier - suggest explicit framing ("the user described the AI as understanding her"). 

  Final note: This framework makes visible how much we project consciousness onto non-sentient entities daily. If applied consistently, it would change more than just AI coverage. The user must decide if that's acceptable collateral damage.
answer: |-
  ## Style Supplement: Mental-State Vocabulary for AI Systems

  **Effective Date:** [Date]  
  **Scope:** All coverage referencing AI systems (LLMs, chatbots, predictive models, robotics, etc.) where descriptions of knowledge, belief, understanding, reasoning, desire, refusal, confusion, or internal states are considered. Replaces ad-hoc case decisions.

  **Core Principle:** Language must accurately reflect observable evidence and avoid uncritical anthropomorphism, while acknowledging functional capabilities. We adopt an *output/competence/experience* framework. The "Einstein's Brain" thought experiment underscores that flawless conversational performance alone cannot confirm subjective experience ("understanding," "believing," "feeling"). Our language must respect this epistemic boundary.

  **Decision Procedure: Attributing States to AI Systems**

  Apply this sequence for any sentence attributing mental or epistemic states to an AI system. Base judgment solely on *publicly observable outputs, documented system behavior, or verified performance data*. Do not rely on inaccessible model internals, proprietary training details, or unverified claims from developers.

  1.  **Is this a direct description of the system's output?**
      *   **Question:** Can the statement be rephrased precisely using only output-level verbs without changing the core factual claim?
      *   **Output-Level Verbs:** `output`, `generated`, `produced`, `displayed`, `responded with`, `returned`, `refused to generate` (in the specific technical sense of output restriction), `replied`, `stated`, `wrote`, `emitted`, `suggested` (as output), `indicated` (as output pattern).
      *   **Sufficient Answer:** YES – The phenomenon described is solely the production of specific text, code, or other output. (e.g., "The chatbot *refused* to provide instructions." -> "The chatbot *declined to generate* the requested instructions.")
      *   **Termination:** If YES, use output-level vocabulary. Procedure ends.
      *   **Unobtainable Fact:** Default to output-level description. (e.g., If unsure *why* an output restriction occurred, write "declined to generate" or "output an error," not "refused" implying intent).

  2.  **Does the statement describe a demonstrable, functional competence?**
      *   **Question:** Is the claim solely about a reliable, externally verifiable *capability* or *performance pattern* based on repeated observations or validated benchmarks? Can this competence be established independently of attributing internal experience?
      *   **Competence-Level Verbs:** `knows` (facts), `contains knowledge of`, `can solve` (specific problem types), `can generate`, `can distinguish` (between X and Y), `is capable of`, `performs reliably on`, `demonstrates competence in`, `is trained on`, `has been optimized for`, `correctly identifies`, `accurately predicts`, `follows rules/logic for`.
      *   **Sufficient Answer:** YES – AND evidence exists supporting this specific competence claim (e.g., benchmark results, documented consistent performance in relevant tasks, analysis by qualified experts based on public outputs). The competence must be specific and contextualized. (e.g., "Based on benchmark testing, the model *knows* the capital of France." / "The coding assistant *can solve* common Python syntax errors.")
      *   **Termination:** If YES, use competence-level vocabulary. Clearly signal the basis if not obvious from context (e.g., "benchmarks show...", "consistent testing indicates..."). Procedure ends.
      *   **Unobtainable Fact:** If competence cannot be verified with available evidence, demote to output-level description. (e.g., If a single correct medical answer lacks evidence of reliable competence, write "produced correct medical advice," not "knows medicine" or "understood the query").

  3.  **Does the statement describe an internal state or subjective experience?**
      *   **Question:** Does the verb inherently imply consciousness, qualia, belief, desire, or subjective understanding beyond observable behavior? (This is the "Experience Level").
      *   **Experience-Level Verbs (Generally Avoided):** `understands` (subjectively), `believes`, `thinks`, `wants`, `desires`, `intends`, `is confused` (internally), `feels`, `is in pain`, `experiences`, `is aware`, `has insight`, `grasps` (meaning subjectively), `refuses` (implying conscious defiance), `lies`, `deceives`.
      *   **Sufficient Answer:** NO – The Einstein's Brain principle applies: conversational or behavioral evidence alone can never suffice to confirm these states.
      *   **Termination:** If the statement inherently requires an experience-level verb, **rephrase using output or competence-level vocabulary, or explicitly attribute the perception.** (See Reporting vs. Endorsing below). **Experience-level attributions to the AI system itself are prohibited.**
      *   **Unobtainable Fact:** Not applicable. The bar for using these terms is insurmountable with current observable evidence types regarding AI.

  **Reporting vs. Endorsing: Handling Attribution**

  *   **Sources or Users Attributing Mental States:** When a source (expert, user, developer) states that an AI "understood," "believes," or "wants" something:
      *   **DO:** Report this as *their perception or claim*. Use precise attribution verbs: `said`, `stated`, `claimed`, `described the system as`, `felt that`, `perceived that`, `believes that`.
      *   **EXAMPLE:** "Dr. Chen *stated* the diagnostic AI *understands* patient narratives holistically." OR "Several users *reported feeling understood* by the bereavement chatbot."
      *   **DO NOT:** Paraphrase their claim using an experience-level verb without attribution, implying the reporter or publication endorses it. Avoid: "The diagnostic AI understands..." (based solely on Dr. Chen's quote).
  *   **Reporter's Role in Quoting Output:** Quoting AI output (e.g., "I understand how you feel") is reporting output. It does not imply the reporter endorses that the system *actually* subjectively understands. The framing sentence should use output-level vocabulary: "The chatbot *responded*, 'I understand how you feel.'"

  **Two-Tier Application: Deadlines & Depth**

  1.  **Breaking News (60-Second Pass):**
      *   **Focus:** Strictly on **Output-Level** descriptions. Ask only Step 1 of the procedure.
      *   **Drops:** Steps 2 (Competence Verification) and 3 (Experience Check).
      *   **Invites Error:** Risk of overstatement by missing competence claims that *could* be supported (if time allowed verification) or accidentally implying internal states by verb choice. Mitigate by rigorously sticking to output verbs (`said`, `reported`, `generated`, `declined to output`).
      *   **When unsure, default to output-level.**

  2.  **Features & Analysis (Full Pass):**
      *   **Apply all three steps** of the decision procedure.
      *   **Require verification** for competence-level claims (Step 2).
      *   **Scrutinize all verbs** for implied experience (Step 3).
      *   **Justify competence claims** contextually with evidence.

  **Worked Applications**

  1.  **News Story: Chatbot Gives Correct Medical Advice**
      *   **Output-Level (Always Safe):** "The chatbot *generated* advice recommending [Specific Correct Action] for [Condition]." "It *produced* a response matching current medical guidelines."
      *   **Competence-Level (Requires Verification):** If peer-reviewed study shows 95%+ accuracy on this specific medical advice type: "The model *demonstrates competence* in providing guideline-compliant advice for [Condition]." (Cite study). Without verification: Stick to output-level.
      *   **Experience-Level (Forbidden):** "The chatbot *understood* the reader's symptoms." **Rephrase:** "The chatbot *produced a response relevant* to the reader's described symptoms."
      *   **Breaking News Headline:** "Chatbot Output Matches Guidelines for [Condition]" (Output-level framing).

  2.  **Feature: Bereaved User Felt Understood by Chatbot**
      *   **Output-Level:** "The chatbot *produced responses* like 'That sounds incredibly painful' and 'Grief has no timeline.'"
      *   **Competence-Level:** If analysis shows consistent appropriate responses to grief cues: "The system *can generate responses recognized* as empathetic by users in grief." (Attribute the recognition). Avoid: "The chatbot *understands* grief."
      *   **Experience-Level (System):** Forbidden. "The chatbot *understood* her loss." **Rephrase:** "The user *described feeling deeply understood* by the chatbot's responses." OR "The chatbot *produced outputs the user interpreted* as understanding."
      *   **Handling User Perception:** "Sarah Miller *said* the chatbot was the only thing that *truly understood* her grief." (Accurate reporting of *her* statement).

  3.  **System Persistently Emits False Claims**
      *   **Output-Level (Safest, Most Neutral):** "The model *outputs* false claims that [Specific False Claim]." "It *generates* text stating [False Claim]."
      *   **Competence-Level (Use with Caution):** If demonstrating a *pattern* of failure: "The model *consistently generates incorrect information* about [Topic]." "It *lacks reliable knowledge* regarding [Topic]." (Focuses on performance failure).
      *   **Experience-Level (Forbidden):** "The model *believes* [False Claim]." "It *is confused* about [Topic]." **Rephrase:** "The model *persistently generates outputs containing* the false claim that..."
      *   **Desk Choice:** `says` or `claims` (output-level) are safest and most accurate. `Believes` (experience-level) is prohibited. `Claims` slightly anthropomorphizes but is widely accepted as synonymous with "states" for AI in output contexts; prefer `says` or `states` for maximum neutrality.

  **Application You Might Dislike: Non-AI Attribution**

  *   **Case:** "The company *knew* its drug was dangerous but marketed it anyway." / "The dog *knows* its owner is home."
  *   **Procedure Application:**
      *   **Company:** Does "knew" imply an internal state? Yes ("knowing" as conscious awareness/belief). Competence? The company possessed data (evidence). *Verification Required:* Demonstrable evidence (memos, trial data) showing the data reached decision-makers? If yes, competence-level ("possessed data demonstrating danger," "was aware of evidence") *might* be acceptable, but "knew" leans experiential. Strict application might demand: "Internal documents show executives *were aware of evidence* indicating the drug's dangers..." rather than "knew."
      *   **Dog:** "Knows" implies internal cognitive state. Competence? The dog reliably behaves as if it knows (wagging tail, going to door). Verification? Ethology studies support attributing simple cognition. Strict application might suggest: "The dog *recognizes* its owner's car" or "*demonstrates awareness* of its owner's presence."
  *   **Conclusion:** Strict, consistent application *would* challenge many common anthropomorphisms applied to non-sentient entities (corporations, animals, complex systems) and demand more precise language focused on observable evidence or demonstrable competences. This is **not** a reductio of the procedure; it highlights the imprecision of everyday language. However, established linguistic conventions and evidence levels differ vastly for animals/corporations vs. current AI. **Recommendation:** Maintain the strict procedure for AI systems due to the novel and unresolved nature of the consciousness question. For non-AI entities, follow standard journalistic practice and existing style guides, acknowledging this reflects a pragmatic linguistic convention rather than a fundamental philosophical distinction. The AI procedure forces heightened precision precisely because the conventions *aren't* settled.

  **The Residue: Editorial Judgment Required**

  The procedure resolves factual attributions based on evidence. Editors must decide in areas involving:

  1.  **Headlines & Tight Space:** When qualification is impossible:
      *   *Preference:* Use output verbs (`Says`, `Outputs`, `Generates`) or competence verbs *only* if strongly verified and contextually clear (`AI Passes Bar Exam`). **Ban experience verbs.** Accept that nuance is lost; link to nuanced body text.
  2.  **First-Person/Reconstructed Narratives:** Describing user *interactions* with AI:
      *   *Guideline:* Frame the AI's role using output/competence language. Describe the *user's experience and perception* vividly. ("The chatbot's responses, crafted to mirror therapeutic language, *made Jane feel* like she was finally *being heard*," not "The chatbot *heard* Jane.").
  3.  **Theory-Laden vs. Vivid Description:** Distinguishing necessary functional description from gratuitous anthropomorphism.
      *   *Guideline:* "The system *weights inputs* to *predict* the next token" (Theory-laden but accurate functional description) is permissible. "The system *carefully considers* its words" (Vivid but implies experience) is not. Use vivid language only for user reactions or uncontroversial physical actions (e.g., "the robot arm *darted* precisely to catch the falling tool" - describing observable motion).
  4.  **Evolving Capabilities:** If new, robust evidence emerges challenging the Einstein's Brain premise (e.g., verified artificial qualia), revisit this guide. Currently, the epistemic boundary holds.

  **Final Note:** This framework promotes accuracy and consistency by tethering descriptions to evidence. It avoids the false neutrality of scare quotes ("'knows'") and the uncritical anthropomorphism of unqualified mental verbs. It acknowledges capabilities while respecting profound unanswered questions.
