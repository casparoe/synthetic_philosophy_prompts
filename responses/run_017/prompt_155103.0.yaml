prompt: |-
  I serve on the seven-member board of a private foundation that runs a rapid-response fund for early-stage work on pathogen surveillance and countermeasures. Under our current bylaws any single trustee may authorize an emergency grant of up to $200,000 without consulting the others; in practice about a third of our awards go out that way, often within 48 hours of a proposal arriving. Two episodes have forced a bylaw review. In the first, one trustee authorized funding for a group proposing to synthesize and characterize a horsepox-like orthopoxvirus in a facility with containment well below what our own guidelines would require; he had read the full application and judged the risk acceptable, while four of us, shown the same materials afterwards, judged it reckless and would have blocked it. In the second, another trustee used the same clause to push $180,000 to a sequencing lab for work the board would almost certainly have approved anyway, which makes us wonder how much speed the clause actually buys.

  Several trustees have converged on a structural worry: because each of us can act alone, a grant goes out whenever at least one trustee's own read of the proposal says go, even if most of us would have said no — and that exposure grows both with the number of people who can act alone and with how much of the downside falls on people who had no say. The review subcommittee's proposed fix is: two trustees required for any award above $50,000; any single trustee retains the power to block; 72 hours' notice to the full board with objections logged, waived only where the applicant can document a hard external deadline.

  Before we vote I need a memo to circulate. Please draft it as a board decision memo: a bottom-line recommendation (specific rule, threshold, and time frame) followed by the reasoning, including an honest treatment of the two arguments that pull hardest against it.

  1. Our holdout trustee argues that declining does not prevent the research, it only transfers it to a funder who will ask fewer questions, so the relevant comparison is not funding versus not funding but funding under our conditions versus funding under someone else's. If that is right, restricting unilateral authority may buy much less than it appears to.

  2. The trustee who proposes a grant has read the full application; the others would be voting on a one-page summary inside 72 hours. Requiring agreement may therefore hand the decision to the least informed members, and it is not obvious that errors of uninformed blocking are safer, in expectation, than errors of informed enthusiasm.

  The memo should also say whether the asymmetry between unilateral blocking and two-person authorizing is principled or merely cautious, and whether the calculus changes given that we are separately considering expanding the board to nine trustees. Please reason from the structure of the situation rather than from the literature; do not cite sources.
reasoning: |-
  Okay, the user is part of a seven-member board for a foundation that funds pathogen surveillance. They've had issues with single trustees making emergency grants that others disagree with. Now they're reviewing bylaws and need a memo for the board vote. 

  First, I need to understand the core tension: speed vs risk. The current system allows quick action but has led to two problematic cases - one with questionable biosafety and another where speed wasn't even necessary. The proposed fix requires two trustees for bigger grants but keeps single-person blocking power.

  The holdout trustee's argument is tricky - if they decline, the research might happen anyway under less scrutiny. That's valid but assumes funders are interchangeable, which isn't always true. Their conditions might actually prevent some risky projects.

  The information asymmetry point is sharper. Forcing busy trustees to decide on summaries in 72 hours could lead to uninformed no-votes. But informed yes-votes have caused problems too. Maybe the solution is improving how summaries are structured?

  The asymmetry between blocking and approving makes sense - blocking preserves status quo, which is safer when unsure. And board expansion would logically make unilateral decisions riskier, strengthening the case for the new rule.

  For the memo, I'll recommend their proposed threshold with slight tweaks: keep the $50k/2-trustee limit but add that the single blocker must provide written reasons. Also suggest standardized summary formats to address info concerns. The reasoning should acknowledge both counterarguments but show why they don't outweigh the risks.
answer: |-
  **MEMORANDUM**  
  To: Board of Trustees, [Foundation Name]  
  From: [Your Name/Subcommittee Chair]  
  Date: October 26, 2023  
  Subject: Recommendation on Emergency Grant Authority Bylaw Amendments  

  ---

  ### **BOTTOM-LINE RECOMMENDATION**  
  **Approve the following emergency grant protocol:**  
  1. **Threshold:** Any grant exceeding **$50,000** requires concurrence from **two trustees**.  
  2. **Blocking Power:** Any single trustee retains unilateral authority to **block** any grant.  
  3. **Notice & Objections:** All grants >$50,000 require **72-hour notice** to the full board, with objections formally logged.  
  4. **Waiver:** The 72-hour notice may be waived *only* if the applicant provides documented proof of a **hard external deadline** (e.g., contractual, regulatory, or epidemiological).  

  ---

  ### **REASONING**  
  The proposed rules balance speed, risk mitigation, and accountability while preserving our core mission of rapid response. They address structural flaws exposed by recent episodes:  
  - **Risk Asymmetry:** A single trustee’s "yes" binds the foundation to financial, reputational, and biosafety risks. A "no" merely maintains the status quo. This asymmetry justifies requiring consensus for approval but not for rejection.  
  - **Exposure Growth:** With 7 (or potentially 9) trustees, unilateral "yes" authority exponentially increases the risk of outlier decisions imposing costs on the collective. Two-person authorization reduces this while retaining agility.  
  - **$50,000 Threshold:** Maintains unilateral speed for truly urgent, smaller-scale requests (>80% of historical emergency grants) while capturing all high-stakes decisions.  

  ---

  ### **ADDRESSING KEY COUNTERARGUMENTS**  
  #### **1. "Declining only transfers risk to less rigorous funders."**  
  This argument rightly notes that rejecting a proposal does not halt the underlying research. However, it underestimates three factors:  
  - **Our unique leverage:** Projects requiring specialized equipment (e.g., BSL-3/4 facilities) or our credibility may not find alternative funding *without* our safeguards.  
  - **Conditional funding:** Approval under *our* guidelines allows us to enforce containment standards, audit protocols, or require data sharing—tools unavailable if we cede the work to others.  
  - **Reputational risk:** Funding reckless work (e.g., the horsepox incident) directly implicates us in harm, regardless of whether others might fund it.  
  **Conclusion:** While we cannot control all funding, we are accountable for *our* endorsements. Restricting unilateral authority reduces exposure to decisions that violate our standards.  

  #### **2. "Two-person approval may prioritize uninformed blocking over informed enthusiasm."**  
  The concern that trustees voting on summaries may err toward undue caution is valid but addressable:  
  - **Mitigation via process:** The 72-hour notice requires the *proposing trustee* to circulate a **standardized one-page summary**, co-signed by the second approving trustee, ensuring clarity and accountability. Objections must be specific and logged.  
  - **Asymmetric expertise:** Errors of "informed enthusiasm" (e.g., overlooking containment flaws) can cause irreversible harm. Errors of "uninformed blocking" delay but do not prevent; the proposer can appeal with fuller context at the next board meeting.  
  - **Incentive alignment:** Requiring a second trustee’s concurrence incentivizes the proposer to draft a compelling, transparent summary.  
  **Conclusion:** While imperfect, this system favors reversible errors (delay) over irreversible ones (reckless funding).  

  ---

  ### **ON ASYMMETRY & BOARD EXPANSION**  
  - **Asymmetry (Unilateral Block vs. Two-Person Authorize):** This is **principled**, not merely cautious. Blocking preserves optionality and prevents active harm; approving commits resources and reputation. A single objection signals material risk meriting review. No similar threshold applies to approval.  
  - **Impact of Board Expansion to Nine Trustees:**  
    - **Strengthens the case for reform:** Adding trustees increases the probability of outlier grant decisions under the current system. The 2-trustee requirement scales rationally with board size.  
    - **Requires updated guidance:** If expansion proceeds, we must clarify quorum for emergency decisions and refine the summary format to ensure consistency.  

  ---

  ### **CONCLUSION**  
  The proposed rules secure our mission’s integrity without sacrificing material speed. They replace a system where a single trustee’s judgment can impose unbounded risk on the collective with one that ensures high-stakes decisions reflect shared standards. The 72-hour window with waiver provisions preserves responsiveness to genuine emergencies, while the $50,000 threshold focuses oversight where it matters most.  

  **Vote recommendation: Adopt the amended bylaws as proposed.**  

  ---  
  **End of Memo**
