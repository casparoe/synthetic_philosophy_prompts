answer: |-
  ### Restating Accuracy-First Epistemology in Clinical Prediction Vocabulary

  #### **Thesis 1: Accuracy as the Fundamental Epistemic Good**  
  *Restatement*:  
  Your core goal is to minimize the discrepancy between predicted probabilities and true event rates (e.g., deterioration risk). All other model virtues—calibration, discrimination, net benefit—are *instrumental* to this. For example:  
  - **Calibration curves** diagnose miscalibration (systematic inaccuracy), but their value derives from fixing deviations from true probabilities.  
  - **AUC/c-index** measures rank discrimination, but it’s only useful because it correlates with reduced loss (e.g., improved Brier score) under model refinement.  
  - **Explanatory power** (e.g., SHAP values) is a tool for debugging inaccuracy, not an end in itself.  

  *Translation fidelity*:  
  - **Clean**: Direct match. Your focus on proper scoring rules (Brier, log-loss) embodies this.  
  - **Bent**: None—clinical prediction models explicitly prioritize predictive accuracy.  
  - **No counterpart**: The framework’s claim that *all* non-accuracy virtues (e.g., coherence) reduce to accuracy. In practice, you might value simplicity for deployment even if it sacrifices marginal accuracy.  

  ---

  #### **Thesis 2: Coherence via Dominance and Strictly Proper Scoring Rules**  
  *Restatement*:  
  If your model outputs incoherent probabilities (e.g., probabilities for mutually exclusive outcomes summing to >1), it’s **strictly dominated**:  
  - There exists a coherent model that achieves a lower loss (Brier/log-loss) *for every possible patient*, regardless of their true outcome.  
  - This is a **robust worst-case guarantee**: even if your training sample is unrepresentative, incoherence leaves you vulnerable to being outperformed everywhere.  
  - *Why strictly proper scoring rules?* They ensure the *only* way to avoid dominance is coherence—just like incentivizing honest probability reporting in models.  

  *Your specific questions*:  
  - **Pointwise dominance vs. expected loss**:  
    - The dominance argument is indeed **worst-case** (pointwise over patients/worlds), not average-case (expected loss over a distribution).  
    - In your terms: This is like proving your model is inadmissible under *any* test distribution—even pathological ones. Your training sample’s distribution is irrelevant because the failure is structural.  
    - **Gap with your practice**: You care about expected loss over real-world cohorts. The dominance argument is a theoretical safety net—it doesn’t guarantee good expected performance but rules out incoherent models as fundamentally flawed.  

  *Translation fidelity*:  
  - **Clean**: Dominance ↔ inadmissibility in decision theory; strictly proper rules ↔ incentive compatibility for truth-telling.  
  - **Bent**: The argument assumes access to all possible patients/worlds. You work with finite samples, so dominance is a *limiting ideal*.  
  - **No counterpart**: The framework assumes probabilities are defined over exhaustive, mutually exclusive events. Your models often handle censored data or competing risks, which break this assumption.  

  ---

  #### **Thesis 3: Updating by Conditionalization**  
  *Restatement*:  
  When new evidence arrives (e.g., real-time patient data), updating your model should maximize **expected accuracy** relative to your *current* probabilities:  
  - Formalize your model’s current state as a joint probability distribution over features/outcomes.  
  - Updating to the new model = conditioning the joint distribution on the evidence.  
  - *Why?* Any other update rule (e.g., heuristic adjustments) will yield worse expected loss (Brier/log-loss) under your *current* model’s probability measure.  

  *Translation fidelity*:  
  - **Clean**: Matches Bayesian updating in dynamic models (e.g., Bayesian networks for deterioration risk).  
  - **Bent**: In practice, you retrain models on new data rather than explicitly conditioning. This approximates conditionalization if retraining converges to the Bayes-optimal solution.  
  - **No counterpart**: The argument assumes your *current* probabilities are "rational" (coherent). If your model is miscalibrated, conditionalization may propagate errors.  

  ---

  #### **Thesis 4: Non-Pragmatic Vindication**  
  *Restatement*:  
  The above norms are justified solely by accuracy—not clinical utility. Even if an incoherent model improves net benefit (e.g., by overestimating rare events), it’s epistemically deficient because it’s less truthful.  

  *Your specific questions*:  
  - **Improper scoring rules (net benefit) in deployment**:  
    - Accuracy-first *must* say net benefit measures **decision-theoretic utility**, not accuracy.  
    - Why? Net benefit assigns value based on *consequences* (e.g., cost of false negatives), not truthlikeness. Using it as an epistemic metric would conflate accuracy with pragmatics.  
    - **Your hunch is correct**: This is a cost. The framework cannot accommodate "stakes-dependent accuracy" without abandoning its core tenet.  

  - **Importance weighting (paediatrics, rare outcomes)**:  
    - **The dominance argument breaks** under weighting.  
    - Consider: Let weights \( w_i \) scale the loss for patient \( i \). An incoherent model might be dominated pointwise in unweighted score but *not* in weighted score—if it excels on high-\( w_i \) patients.  
    - *Example*: Model A is incoherent but has lower loss for high-weight patients; Model B is coherent but worse for those patients. No coherent model dominates A *everywhere* under weighting.  
    - **Survival?** Only if weights are *harmonized* with the dominance-proof scoring rule—but weights are typically external, so coherence loses its guaranteed superiority.  

  - **Messy truth (censoring, proxies)**:  
    - **Bug**: The framework assumes a determinate, observable truth for scoring.  
    - Your world: Outcomes are proxy-defined (e.g., "deterioration" via chart review), and censoring obscures truth. Losses like **Brier score for survival** (which handles censoring) are *estimates* of epistemic inaccuracy—not direct measures.  
    - **Key conflict**: Accuracy-first scores you against idealized ground truth (e.g., "true deterioration if fully observed"), even when unobservable. Your losses require *computable approximations* from data.  

  ---

  ### Residue Report: Where the Tensions Lie  

  1. **Thesis 1 (Accuracy as fundamental)**  
     - Residue: Your work implicitly acknowledges that accuracy isn’t the *only* good—e.g., interpretability can trump accuracy in deployment. The framework dismisses this as non-epistemic.  

  2. **Thesis 2 (Coherence via dominance)**  
     - Residue: **Worst-case dominance is fragile under real-world constraints**.  
       - Your vocabulary exposes:  
         - Pointwise dominance requires evaluating every possible patient—but you only have finite samples.  
         - Censoring/proxies make "truth" undefined, breaking the scoring mechanism.  
       - **Smuggling in pragmatics?** Dominance assumes a fixed set of worlds/patients, but in practice, you define "possible patients" via data—a pragmatic choice.  

  3. **Thesis 3 (Conditionalization)**  
     - Residue: **Self-referential expected accuracy is circular**.  
       - You compute expected loss using your *current* model—but if it’s poorly calibrated, this guarantees nothing.  
       - Your vocabulary highlights this: You use **validation sets** to assess updates, not self-referential predictions.  

  4. **Thesis 4 (Non-pragmatic vindication)**  
     - Residue: **The "no pragmatics" claim collapses under deployment**.  
       - Using improper rules (net benefit) concedes that epistemic accuracy is insufficient.  
       - Weighting and messy truths force pragmatic compromises (e.g., trading accuracy for actionability).  

  ---

  ### The Core Tension: Your Vocabulary vs. The Package’s Idealism  
  - **Your vocabulary is missing nothing**. It reveals the framework’s blind spots:  
    - **Dominance arguments are brittle** without infinite data and perfect truth access—conditions you never have.  
    - **Self-referential updating** (Thesis 3) is question-begging if models are imperfect.  
  - **The package is less clean than it looks**:  
    - Thesis 4’s "no pragmatics" claim is **undermined by deployment realities** (improper scoring rules, weighting).  
    - The framework implicitly relies on **idealizations** (determinate truth, complete worlds) that don’t hold in clinical practice.  

  **Conclusion**: Accuracy-first epistemology is a compelling *normative ideal* for probability reporting, but its non-pragmatic claims falter when confronted with your operational challenges. The residue isn’t in your vocabulary—it’s in the gap between the framework’s mathematical purity and the messy reality of clinical prediction. **Thesis 3 (updating) and Thesis 4 (non-pragmatism) are the weakest links when translated into your world.**
