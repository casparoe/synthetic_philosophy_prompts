  Additionally, the non-pragmatic claim (thesis 4) is challenged by the fact that you use improper scoring rules in deployment. The framework must say that deployment metrics are not about accuracy. But in practice, you might argue that the deployment metric is what ultimately matters, and the accuracy metrics are just tools. The residue is that the framework does not allow for a stake-relative notion of accuracy.

  **Conclusion**: The package is less clean than it looks. The pointwise dominance argument (thesis 2) is a strong theoretical guarantee but not directly applicable in your finite-sample, messy-data context. The updating rule (thesis 3) relies on an expectation under the current model, which might be flawed. And the non-pragmatic claim (thesis 4) breaks when you use improper metrics in deployment. The framework's strength is in providing a unified justification for coherence and conditionalization in an idealized setting. Your work operates in a more complex, applied setting where the idealizations don't hold perfectly.

