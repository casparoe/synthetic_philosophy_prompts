  We are going to break this down step by step, as requested. The user works with clinical prediction models and is familiar with the technical aspects (scoring rules, calibration, discrimination, etc.). They want an honest translation of accuracy-first epistemology into their vocabulary, and then a residue report.

  The four theses of accuracy-first epistemology as presented by the user:

  1. The only fundamental epistemic good is having accurate beliefs (being close to the truth). Everything else is instrumental.
  2. Belief comes in degrees, and the norm of probabilistic coherence is derived from a dominance argument: any incoherent credence function is dominated by a coherent one in every possible world, where "distance from the truth" is measured by a strictly proper scoring rule.
  3. The norm of updating by conditionalization follows from maximizing expected accuracy (using current credences).
  4. The entire package is a non-pragmatic vindication of epistemic norms.

  We'll restate each thesis in the user's vocabulary and then address the specific questions. Then, we'll provide the residue report.

  ### Restatement of Theses in Clinical Prediction Vocabulary

  #### Thesis 1: The Fundamental Epistemic Good
  - **Restatement**: In building and validating clinical prediction models, the primary goal is to have the model's predicted probabilities match the true probabilities (i.e., the underlying data-generating process) as closely as possible. This is what we mean by accuracy. All other model properties (like calibration, discrimination, etc.) are secondary and only valuable insofar as they contribute to this goal. For example, a model with good calibration and discrimination is more likely to be accurate. But if we had to choose, we would prioritize being close to the truth (e.g., low Brier score) over other virtues that might be instrumentally useful (like high AUC in a specific population) but not directly about matching true probabilities.

  #### Thesis 2: Coherence as Dominance
  - **Restatement**: Consider your model's output as a set of probability assignments (credences) for various events (e.g., deterioration in 48h). If these assignments are not coherent (i.e., they violate the laws of probability, such as assigning probabilities that don't sum to 1 for mutually exclusive and exhaustive events), then there exists an alternative coherent model that, no matter what the true outcome turns out to be, will have a better (lower) strictly proper score (e.g., Brier score or log-loss) for every possible patient. 

    - **Pointwise Dominance**: This is a worst-case guarantee: for every single patient (every possible world), the incoherent model is beaten by the coherent one. This is different from an expected loss guarantee (which would be over a distribution of patients). The dominance argument says that incoherence is bad because it leaves you open to being uniformly outperformed, regardless of the patient population.

    - **Addressing the Gap**: In your world, you typically have a training sample (a distribution) and you care about expected loss. The dominance argument is stronger in the sense that it doesn't depend on any distribution — it holds for every single patient. However, note that the dominance argument requires that we consider every possible patient (every possible combination of features and outcome). In practice, you only have a finite sample, but the argument is about the entire population (or all possible worlds).

    - **The Dominance Step and Your Vocabulary**: The dominance argument uses the same strictly proper scoring rules you use (like Brier or log-loss). The key is that the scoring rule must be strictly proper to ensure that the coherent model (which is the true probability) is the only one that cannot be dominated. The argument does not depend on having a distribution because it is pointwise. However, in your work, you never have access to the entire population (only a sample). The argument is a theoretical guarantee for the entire space, which in your case would be the entire patient population. But note: if your model is only ever evaluated on a finite sample, the worst-case guarantee over the entire population might not be directly observable. Still, the argument shows that incoherence is a flaw that could be exploited in any patient.

  #### Thesis 3: Updating by Conditionalization
  - **Restatement**: Suppose you have a current model (a set of probabilities) and you get new evidence (e.g., a new set of features for a patient). The norm says you should update your model by conditionalizing on the new evidence. That is, your new model should be the old model conditioned on the new data. 

    The accuracy-first argument: at the time of updating, you should choose the update rule that maximizes the expected accuracy (as measured by a strictly proper scoring rule) of your new model, where the expectation is taken with respect to your current model (your old probabilities). It turns out that conditionalization is the update rule that achieves this.

    - **In Practice**: Think of it as retraining your model on the new data. But the argument is that if you are going to update without retraining (e.g., by a simple rule), then the rule that maximizes expected accuracy (according to your current model) is conditionalization.

  #### Thesis 4: Non-Pragmatic Vindication
  - **Restatement**: The entire argument for using coherent probabilities and updating by conditionalization is based solely on the goal of having accurate beliefs (i.e., minimizing the strictly proper score). It does not rely on any practical benefits (like better patient outcomes or more effective treatments). It is purely about being closer to the truth.

  ### Addressing Specific Questions

  #### 1. The Pointwise/Worst-Case Claim in Thesis 2
  - **Frame**: Yes, the dominance argument is a robust (worst-case) guarantee: for every possible patient, the incoherent model is beaten by a coherent one. This is stronger than an expected-loss guarantee (which depends on a distribution). 
  - **Your World**: You only have a training sample (a distribution). The dominance argument requires considering every possible patient (the entire population). In practice, if you are only evaluated on a sample, then the expected loss matters. But the argument is that incoherence is a flaw that can be exposed in any patient, so it is a structural flaw. 
  - **Does the dominance step require a distribution?**: No, it does not. It is pointwise. But note: the coherent model that dominates might be different for different incoherent models. The existence of a dominating coherent model is proven for any incoherent one. However, in your work, you are constrained by the data and the model class. The argument is an ideal one, showing that coherence is a necessary condition to avoid dominance.

  #### 2. Using Improper Scoring Rules in Deployment
  - **Question**: You use an improper scoring rule (like a net-benefit based metric) in deployment because it reflects the clinical utility (e.g., it cares more about false negatives). Does accuracy-first say this metric is not measuring accuracy but something else?
  - **Answer**: Yes, the accuracy-first framework would say that the net-benefit metric is not measuring accuracy (closeness to the truth) but rather decision-theoretic utility. The framework strictly separates epistemic and practical goals. 
    - The strictly proper scoring rule (like Brier or log-loss) is the measure of accuracy. The net-benefit metric is a measure of the practical value of the predictions in a specific decision context (with a particular threshold and cost structure). 
    - So, the framework would say: if you are using an improper scoring rule, you are optimizing for something other than accuracy. That might be perfectly justified (because clinical decisions are about utility), but it is not about truth. 
  - **Cost to the View?**: This is a real cost if one wants to maintain that accuracy is the only fundamental epistemic good. The framework cannot account for the idea that accuracy might be stake-relative. It must say that the net-benefit metric has shifted to measuring something else. 

  #### 3. Weighting Cases
  - **Question**: You weight cases (e.g., pediatric patients count more). The weights are fixed and do not depend on the model's output. Does the framework survive importance weighting?
  - **Answer**: We need to see if the dominance argument still holds. 

    - Suppose you have a weighted scoring rule: for each patient, the score is multiplied by a fixed weight (representing importance). The total score is the weighted sum. 
    - The strictly proper property: a scoring rule is strictly proper if the expected score is minimized by the true probability. If we weight by fixed weights, then the weighted scoring rule is still strictly proper because the weights are constants (so the true probability still minimizes the expected weighted score). 
    - Now, the dominance argument: for an incoherent model, is there a coherent model that beats it for every patient? 

      - Consider that the weights are fixed and positive. The dominance is pointwise: for every patient, the coherent model must have a lower score (after weighting). But note: the weight multiplies the score for that patient. So, if we have a coherent model that dominates the incoherent one at every patient (without weights), then when we multiply by the weights (which are positive), the dominance relation per patient is preserved. Therefore, the same coherent model that dominates without weights also dominates with weights.

    - **Conclusion**: The dominance argument survives importance weighting with fixed positive weights. The framework can be extended to weighted scoring rules without breaking the argument.

  #### 4. Messy Truth: Proxies, Censoring, Unobserved Truths
  - **Question**: The framework seems to require a determinate truth value for every proposition. But in your world, outcomes are defined by proxies, follow-up is incomplete, and there is censoring. The framework scores you against truths that might never be observed. How does that fit?
  - **Answer**:
    - **Feature or Bug?**: This is a bug from your perspective. The framework assumes that there is a true state of the world (e.g., whether the patient deteriorated or not) that is well-defined and in principle observable. But in practice, you may never observe it (due to censoring) or you might use a proxy (which is not the true outcome). 
    - **Framework's Assumption**: The framework requires that we can define a truth value for the event we are predicting. If the truth is not well-defined (or not observable), then the scoring rule cannot be computed. 
    - **Your World**: You use losses that are computable from the data you have (which might be proxies or subject to censoring). The framework does not account for this. 
    - **Handling Censoring**: In survival analysis, we use losses that account for censoring (like the Brier score for survival). But note: these are still defined in terms of the true (but possibly unobserved) event time. The loss is computed only for the observed data (and we use techniques like inverse probability weighting). The framework would require that we define accuracy in terms of the true event time, even if unobserved. 
    - **Conclusion**: The framework assumes that truth is well-defined and that we can in principle know it. Your practice must deal with uncertainty about the truth itself. This is a gap.

  ### Residue Report

