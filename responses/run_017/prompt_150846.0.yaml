  - What translated cleanly.
  - What had to be bent.
  - What has no counterpart.

  #### Thesis 1: Fundamental Epistemic Good
  - **Clean Translation**: The idea that the goal of a prediction model is to match the true probabilities (low Brier, log-loss) and that other metrics (like AUC) are instrumental. This is standard in your field.
  - **Bent**: None. This is exactly how you think about model evaluation.
  - **No Counterpart**: The absolute primacy of accuracy as the only fundamental good. In practice, you sometimes care about other things (like interpretability) for non-instrumental reasons? Or maybe not — you might see them as instrumental to deployment, which is ultimately about accuracy. But if you have a model that is slightly less accurate but much more interpretable, and you choose it, that might be for pragmatic reasons. The framework would say that's non-epistemic.

  #### Thesis 2: Coherence as Dominance
  - **Clean Translation**: The use of strictly proper scoring rules and the idea that incoherence (non-probabilistic outputs) is bad because it can be dominated. You already know that using a proper scoring rule incentivizes honest reporting of probabilities.
  - **Bent**: The dominance argument is pointwise (over every patient). In your work, you typically think in terms of expected loss (over a distribution). The pointwise argument is a theoretical ideal that you don't directly use because you don't have the entire population.
  - **No Counterpart**: The idea of evaluating a model on every single possible patient (every possible world) is not something you can do. You are always working with a sample. The worst-case guarantee is a mathematical idealization.

  #### Thesis 3: Updating by Conditionalization
  - **Clean Translation**: When new data comes in, you retrain your model (which, if done properly, is a form of conditionalization). The idea that updating should be done in a way that maximizes expected accuracy (according to the current model) is aligned with the principle of using the best available method to update predictions.
  - **Bent**: In practice, retraining a model on new data might not be exactly conditionalization (if the model is complex). Conditionalization is a simple rule for updating beliefs in a Bayesian way. You might use online learning algorithms that approximate conditionalization.
  - **No Counterpart**: The argument that conditionalization maximizes expected accuracy (with expectation taken under the current model) is a specific mathematical result. In your work, you might use methods that are not strictly conditionalization (like gradient descent steps) and you might not compute the expectation.

  #### Thesis 4: Non-Pragmatic Vindication
  - **Clean Translation**: The focus on accuracy (as measured by proper scoring rules) without considering clinical utility is something you do during model validation. You separate model evaluation (accuracy) from decision making (which uses net benefit).
  - **Bent**: The claim that this is a full vindication without pragmatics is clean in the abstract, but in practice, you are forced to use improper metrics in deployment. The framework does not account for the possibility that accuracy might be defined relative to stakes.
  - **No Counterpart**: The complete separation of epistemic and pragmatic considerations. In your work, the choice of which model to deploy is ultimately pragmatic (based on net benefit), even though you validate for accuracy.

  ### Where the Residue Sits

  The residue is in two places:

  1. **Your Vocabulary's Limitations?**: Your vocabulary is focused on measurable losses and practical constraints (censoring, proxies). The framework's idealizations (pointwise dominance, well-defined truth in every world) are not directly applicable. But note: the framework does not require that we actually observe the truth in every case — it requires that we can define the truth. The scoring rule is defined in terms of the truth, even if we don't observe it. Your losses are defined in terms of observed data (which may be incomplete). So the framework has a concept of accuracy that is more abstract than what you can measure.

