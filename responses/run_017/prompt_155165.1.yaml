  The post-crime behavior angle adds another layer. Remorse or restitution reducing sentences is common, but lack thereof doesn't increase desert. The user is likely trying to see if the same principle applies across different stages (background, crime, post-crime).

  Key concepts to address: moral luck (Nagel/Williams), but the user already knows it's one-way. The ceiling effect (H.L.A. Hart) is mentioned, but they need to distinguish between desert as a mandate vs. a limit. The baseline problem—how the "standard" sentence is set without ideal conditions. Also, the distinction between culpability (capacity/responsibility) and positive desert (earning extra punishment).

  The user's deeper needs: They want to understand if this asymmetry is inherent in culpability or a flaw in the system. They might be seeking reassurance that their observation isn't a misunderstanding but points to a real philosophical issue. Also, practical implications for legal practice—how should sentencing account for privilege without over-punishing?

  I should explain that culpability is fundamentally about deficits. Full responsibility requires certain capacities; lacking them reduces blame. But possessing extra capacities doesn't create super-responsibility. The baseline is set for a minimally responsible agent. Privilege doesn't add to desert because the standard already assumes basic responsibility.

  For the retributivist dilemma, the drift towards minimal punishment with perfect information might challenge pure retribution, suggesting hybrid theories are more practical. Post-crime factors follow the same logic—remorse mitigates, but its absence doesn't aggravate because the baseline assumes no remorse.

