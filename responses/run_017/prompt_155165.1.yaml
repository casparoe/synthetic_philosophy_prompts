answer: |-
  Your observation cuts to the heart of several profound and interconnected issues in legal philosophy and moral psychology. You're absolutely right about the asymmetry, and it highlights a fundamental tension within retributivism itself. This isn't just an artifact; it points to deep conceptual structures. Let's break it down:

  **1. The Core Asymmetry: Deficit vs. Surplus**

  *   **The Phenomenon:** Mitigating factors (bad childhood, coercion, lack of alternatives) *reduce* deserved punishment. But the *absence* of these factors – a privileged background, full freedom, abundant alternatives – doesn't *increase* deserved punishment beyond the "standard" for the act itself. Desert seems anchored at the "standard" level for a minimally responsible agent and only decreases from there.
  *   **Why This Happens: The Nature of Culpability & Responsibility:**
      *   **Culpability is Primarily About Deficit:** Moral and legal culpability hinge on the presence of certain *capacities* (rationality, self-control, understanding) and the *absence* of defeating conditions (coercion, insanity, necessity). When these capacities are diminished or defeating conditions are present, culpability *decreases*. We punish less because the agent's connection to the wrongness of the act is weaker, or their ability to choose rightly was impaired.
      *   **Culpability is Not Primarily About Surplus:** Possessing *more* than the minimum capacities required for responsibility (e.g., exceptional intelligence, abundant resources, perfect freedom) doesn't make the agent *more connected* to the wrongness of the act *itself*. They understood it was wrong, they had the capacity to choose otherwise, and they chose to do it. That's the threshold for "full" culpability for that act. Having *extra* capacity doesn't make the *wrongness* greater or their *choice* to commit *that specific wrong* more heinous *in itself*. They met the conditions for full blameworthiness; exceeding them doesn't create "super-blameworthiness" for the same act.
      *   **The Baseline Problem:** The "standard" sentence is implicitly set for an agent who possesses the *minimum* capacities and background conditions necessary to be held fully responsible *for that type of act*. It represents the "full desert" point. Factors showing the agent fell *below* that baseline reduce desert. Factors showing they were *above* the baseline don't push desert *above* that "full desert" point for the act itself. The baseline *is* the ceiling for desert adjustments upward.
  *   **Distinguishing from Aggravating Factors:** Aggravating factors *do* increase sentences, but they typically relate to the *nature of the act* (premeditation, cruelty, vulnerability of victim, magnitude of harm) or the *character of the offender as demonstrated by the act* (prior record showing heightened dangerousness or disregard). They don't usually stem *solely* from the offender's privileged background or surplus capacities *in the abstract*. A privileged person who meticulously plans a murder due to greed might get a higher sentence *because of the premeditation and motive*, not *solely* because they were privileged. The privilege might explain *how* they planned so well, but the *aggravation* comes from the planning itself.

  **2. What This Is (Conceptually):**

  *   **The Asymmetry of Moral Luck (Specifically Circumstantial Luck):** You're right to see it near moral luck (Nagel/Williams). This is a specific manifestation of circumstantial luck – luck in the circumstances of one's upbringing and the options available at the moment of choice. The asymmetry highlights that bad luck *mitigates*, but good luck doesn't *aggravate*. Good luck is the assumed baseline for full responsibility.
  *   **The Threshold Conception of Responsibility:** This view sees responsibility as requiring crossing a minimal threshold of capacity and freedom. Once crossed, responsibility is "switched on" fully for the act. Falling short of the threshold diminishes responsibility proportionally. Exceeding the threshold doesn't increase the "amount" of responsibility beyond being "fully responsible."
  *   **Desert Primarily as a Limiting Condition (Hart's "License"):** H.L.A. Hart argued that retributive desert primarily functions as an *upper limit* on punishment ("License to Punish"): we cannot justly punish someone *more* than they deserve. However, it doesn't necessarily mandate that we punish them *exactly* that much, or at all (allowing for mercy, other penological goals). Your observation shows how *discovering mitigating factors* pushes punishment *down* from a perceived "standard" towards this lower desert limit. The lack of upward push reinforces that the "standard" *is* the perceived desert ceiling/limit for the act under baseline conditions.
  *   **The Problem of the "Unlucky Responsible":** This asymmetry creates a category – the person who commits a crime *despite* every advantage and capacity. The system treats them as merely "fully responsible" and deserving the standard sentence. Yet, intuitively, we might feel their culpability is *deeper* or more condemnable precisely *because* they had no excuse. The system struggles to capture this intuition formally without resorting to aggravation based on the act's nature or offender's character *as demonstrated*, rather than their abstract privilege.

  **3. What This Isn't:**

  *   **Not Just "Desert as a Ceiling, Not a Mandate":** As you note, that debate (Hart vs. pure retributivists like Moore) is about whether the state *must* punish *exactly* what is deserved. Your issue is about the *structure of the desert scale itself*: why adjustments only go down.
  *   **Not Simply about Epistemic Limits (Seeing Deprivation but not Privilege):** While epistemic challenges exist, the asymmetry persists even when privilege *is* known and acknowledged. The conceptual structure of culpability (deficit-focused) is the primary driver.
  *   *Not Necessarily Refuting Retributivism:* A sophisticated retributivist can acknowledge this asymmetry as inherent in the concept of culpability. They might argue the "full desert" point reflects the blameworthiness intrinsic to the wrongful choice made by a minimally responsible agent. Privilege might influence *character* assessment, which could be relevant to *other* sentencing goals (e.g., deterrence, rehabilitation prospects), but not to *desert for the specific act* beyond that baseline.

  **4. Where It Stops? The Retributivist's Dilemma (The Investigation Problem):**

  This is a powerful and often underappreciated challenge for *pure* retributivism:

  *   **The Problem:** As investigative tools improve (neuroscience, psychology, detailed social histories), we uncover *more* mitigating factors (subtle cognitive impairments, profound childhood trauma, situational pressures previously unseen). A system focused solely on *desert* would see sentences trend downward. Perfect knowledge might reveal that *almost no one* truly meets the idealized baseline of "full, unencumbered responsibility" – leading towards minimal punishment. This seems to undermine the retributive impulse itself.
  *   **Responses:**
      1.  **Reject Pure Retributivism:** Most practical systems are mixed. Deterrence, incapacitation, and rehabilitation provide reasons to punish *even if* desert is minimal or uncertain. This prevents the collapse into near-zero punishment.
      2.  **Adjust the Baseline:** The "minimally responsible agent" baseline isn't Platonic; it's a societal/practical construct. As understanding grows, society might *recalibrate* what constitutes the threshold for "full" responsibility and the "standard" desert for an act. The baseline absorbs new knowledge, hopefully becoming more realistic, preventing an endless downward drift.
      3.  **Distinguish Degrees Above Threshold:** Some retributivists might argue that while deficits reduce desert, significant *surpluses* of capacity/freedom *could* theoretically increase desert *slightly* for the *same act* because the knowing, willing choice to do wrong is *more* of an affirmative endorsement of evil. However, this is philosophically contentious and difficult to operationalize fairly in law without sliding into punishing "bad character" or socioeconomic status directly.
      4.  **Focus on the Act's Wrongness:** Pure retributivists might double down: desert is fundamentally about the *wrongness of the act committed*. Mitigating factors reduce the *agent's blameworthiness for that wrong*, but the wrong itself remains. The drive to punish the *wrong* persists, even if perfect knowledge shows few agents are truly "maximally" blameworthy. The punishment is for the wrong, proportionally reduced by the agent's diminished connection to it.

  **5. Post-Crime Conduct: Same Phenomenon?**

  *   **Mitigation (Remorse, Restitution, Cooperation):** This clearly parallels the background mitigation. Demonstrating remorse or making amends *reduces* deserved punishment. It signals a recognition of the wrong and a partial re-engagement with the moral community, diminishing the need for severe retribution or the degree of condemnation warranted.
  *   **Lack of Mitigation / Aggravation Post-Crime:** This is more complex and often *not* the same pure asymmetry.
      *   *Lack of Remorse:* While not typically an *aggravating factor increasing desert for the original crime itself*, it can be relevant. It might signal lack of rehabilitation, dangerousness (justifying longer incapacitation), or, crucially, it might be seen as *part of the ongoing wrong* – a continuation of the defiance or disrespect manifested in the original crime. It's less about *increasing desert for the past act* and more about *assessing the current moral/risk status* of the offender or seeing their post-crime attitude as *extending* the wrongdoing.
      *   *Obstruction, Escape, New Crimes:* These are clearly new, independent wrongs deserving of separate punishment (aggravation) or demonstrating heightened dangerousness. They aren't about increasing desert for the *original* crime based on surplus capacity; they are about *new* culpable acts.

  **Conclusion:**

  The phenomenon you describe – desert adjustments flowing only downward, the "standard" acting as a ceiling – is a deep feature of how culpability is conceptualized, grounded in the **deficit-focused nature of responsibility** and the **threshold conception of full capacity**. It's intimately tied to one-way **circumstantial moral luck** and reinforced by understanding desert primarily as a **limiting condition**.

  The "investigation dilemma" exposes a vulnerability in *pure* retributivism: perfect knowledge might dissolve the conditions for "full desert" as commonly conceived. This pushes practical systems towards **hybrid theories** of punishment or forces a **recalibration of the baseline** for responsibility.

  Post-crime mitigation follows the same downward logic. Post-crime *lack* of mitigation or new wrongdoing is handled differently, often relating to ongoing character, risk, or new culpable acts rather than increasing desert for the original crime based on surplus capacity.

  You've hit upon a core tension. The asymmetry isn't an accident; it reveals that our notions of blameworthiness are fundamentally about *excusing conditions* and meeting a *minimum threshold*, not about *enhancing* desert through privilege or surplus capacity for the same wrongful act. The challenge is whether a system can adequately express the moral intuition that the person who "could have done anything, yet chose *this*" bears a unique and profound culpability, without unfairly punishing status or sliding into judging character rather than acts.
