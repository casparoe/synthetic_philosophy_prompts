prompt: |-
  I am in the first year of my doctorate, and in five weeks I am presenting a paper in my supervisor's research seminar on whether the criteria of authenticity can do the work historical-Jesus scholars ask of them. My supervisor — I will call her Professor Alderton — has spent her career defending a small but firm core: that Jesus was a Galilean Jew, baptized by John, who announced an imminent divine kingdom in eschatological terms, and whose ethical teaching took the form of radical, unnegotiable demand. She is not a skeptic about the criteria, but she is severe about how they are used, and she has a long track record of individual verdicts. She grades in two steps only: yes or no.

  The verdicts below come from her published work, her seminar comments, and conversations over the past year. I record only what she has said, not why.

  1. The baptism of Jesus by John: yes.
  2. The absolute prohibition of divorce, in the version without the exception clauses that appear in one of the gospels: yes.
  3. The command to love one's enemies and to pray for those who persecute you: yes.
  4. The saying in which the kingdom is said not to come with observable signs but to be already present in or among the hearers: no. A variant of the same idea appears in a fourth-century sayings gospel, which did not change her mind.
  5. The apocalyptic saying in which the Son of Man is depicted as coming on the clouds with power and glory: yes.
  6. The promise that a particular disciple is the rock on which the community will be built: no.
  7. The saying in which Jesus claims an exclusive and mutual knowledge between himself as Son and God as Father, in language with no close parallel in Jewish literature of the period: no.
  8. The use of the Aramaic word for father as the address in prayer: yes.
  9. The cry of abandonment from the cross, in the wording of the opening of a psalm: no.
  10. A saying preserved only in the fourth-century sayings gospel, pronouncing a blessing on a lion that becomes human: no.
  11. The saying about rendering to the emperor what is his and to God what is God's: yes.

  The case I want to put to her is not a discovery; I have constructed it for the seminar because its features pull in different directions, and I would like to know where she will land before I put it in front of her. Suppose that an unprovenanced parchment leaf, written in a Syriac dialect and assigned on palaeographical grounds to the middle of the fourth century, preserves a saying of Jesus that also appears, in Greek, in a passage of the Gospel of Mark, and — in a form differing only in word order — in the sayings source shared by Matthew and Luke. The saying, in the form I have drafted it: the kingdom is not a thing that is coming but a yoke already laid on the shoulders of those who seek, and whoever seeks will find it in the doing of the least of these commandments. As stipulated, it has two independent early streams behind it, with the leaf as a late third witness; it has no close parallel in Second Temple Jewish literature for the combination it expresses; and it would have been awkward for the predominantly Gentile church of the late first century, since it appears to assume that the distinctions of the Torah remain permanently binding on Israel. Nothing in it looks generated out of Scripture, and it is hard to name a later group whose interests it serves, though the Torah-observant Jewish-Christian communities are the obvious candidate — an explanation she has used elsewhere, but sparingly.

  I would be grateful for an answer in five parts.

  First: state, as explicitly and as generally as you can, the two or three rules that fit her eleven verdicts jointly. I am interested in rules general enough to be applied to a case she has not seen, not in a summary of each verdict. If more than one rule fits, I want to know which verdicts each of them handles more or less comfortably.

  Second: what does each rule predict about the hypothetical leaf, and why?

  Third: your best guess at her answer, with the reasons for preferring the rule that yields it over the others, and with the closest analog among verdicts 1 through 11 identified — including, where it matters, the respects in which that analog is not really parallel.

  Fourth: if the rules that survive your first part still agree on this case, or if the case does not separate them cleanly, name the single further case you would have me draft — a sayings-form, attestation-profile, and content — that would force her rule into the open.

  Fifth: in what form should I put the case to her in the seminar? If I announce the candidate rules myself, she will simply adopt whichever formulation sounds most defensible, and I will have learned nothing about what she is actually doing. I would like a way of framing the question — the wording, or the order in which I present the features — such that her answer reveals the rule even though she has not been asked to state it.
reasoning: |-
  Hmm, this is a fascinating and complex request from a doctoral student preparing for a research seminar. The user is clearly deeply engaged in historical Jesus studies and has a sophisticated understanding of methodological issues. They're presenting a test case to their supervisor, Professor Alderton, who has very specific views on authenticity criteria.

  The user needs help analyzing Professor Alderton's pattern of judgments to predict how she'll rule on a hypothetical saying. This isn't just about academic curiosity - it's about understanding the supervisor's underlying methodology, which is crucial for the student's doctoral work.

  Let me break this down systematically. First, I need to deduce the rules behind Alderton's eleven verdicts. Looking at her pattern: she accepts items with strong Jewish context (baptism by John, Aramaic prayer address), radical ethical demands (divorce prohibition, enemy love), and apocalyptic elements (Son of Man saying). She rejects sayings that sound "developed" theologically (exclusive Father-Son knowledge) or appear late (fourth-century lion saying).

  Three rules seem to emerge: 1) Jesus must sound like a first-century Galilean Jew, 2) he must be demanding and eschatological, not "realized" eschatology, and 3) the saying must be attested early. The third rule seems weakest - she accepts some singly attested sayings if they fit the other criteria.

  For the hypothetical saying about the kingdom as a yoke... it's tricky. It has early attestation but promotes "realized" eschatology, which Alderton consistently rejects. The Torah observance aspect might help, but the "already present" language is problematic based on her rejection of similar sayings. I predict she'll say no, comparing it to verdict 4.

  Since all rules point to rejection here, I suggest testing with a saying that has late attestation but perfect content fit - something radically demanding with Jewish context. That would force her to choose between attestation and content criteria.

  For presentation strategy: the student should present features in order of descending strength (attestation first, then content), and subtly emphasize the "yoke" metaphor's Jewishness while downplaying the "already present" aspect. The goal is to see if she focuses on the attestation or the theological content when making her judgment.

  This approach should reveal her methodological priorities without tipping our hand. The key is making the case seem genuinely ambiguous while containing elements that trigger her established patterns.
answer: |-
  Based on Professor Alderton's verdicts, her underlying methodology appears to follow **two primary rules**, with a potential third acting as a strong preference or secondary filter:

  1.  **Rule of Eschatological Radicality & Jewish Context (ERJC):** A saying is authentic if it presents a radical, unnegotiable ethical demand *or* a clear, imminent eschatological expectation, *and* is plausibly rooted in the context of Second Temple Palestinian Judaism, particularly the eschatological fervor surrounding John the Baptist and the expectation of God's kingdom. This rule prioritizes content and contextual plausibility. It handles verdicts 1, 2, 3, 5, 8, and 11 comfortably. Verdict 7 ("no") is rejected primarily because it lacks a Jewish parallel and implies a late, high Christology incompatible with the core. Verdict 4 ("no") is rejected due to its realized eschatology, contradicting the imminent expectation.
  2.  **Rule of Dissimilarity from Developed Tradition (DDT):** A saying is *inauthentic* if it closely aligns with theological developments, ecclesiastical interests, or liturgical practices demonstrably characteristic of the *later* (post-70 AD, predominantly Gentile) church, *or* if it finds a significantly closer parallel in post-New Testament Christian literature than in Second Temple Judaism. This rule focuses on discontinuity with later Christian developments and continuity (or lack thereof) with Judaism. It handles verdicts 6 ("no" - Petrine authority), 7 ("no" - high Christology), 9 ("no" - scriptural fulfillment/interpretation), and 10 ("no" - late, non-Jewish Gnostic-ish saying) comfortably. Verdict 4 ("no") is reinforced by its parallel in the 4th-century sayings gospel.

  **Potential Third Rule / Strong Preference (Attestation):** While Alderton clearly accepts some singly attested sayings (2, 3, 8), she consistently rejects late or poorly attested material (4, 6, 7, 9, 10). This suggests **Early Attestation is a necessary but not sufficient condition**. A saying needs *some* early witness (Mark/Q level). However, strong ERJC content can overcome single attestation, while weak ERJC content or strong DDT flags will lead to rejection even with early attestation (6, 7, 9). This rule handles the acceptance of singly attested items (2, 3, 8) vs. the rejection of items with early attestation but problematic content (6, 7, 9).

  **How the Rules Handle the Verdicts:**
  *   **ERJC:** Comfortable with 1,2,3,5,8,11. Explains rejection of 4 (realized eschatology), 7 (high Christology). Less directly explains rejection of 6,9,10 (needs DDT).
  *   **DDT:** Comfortable with rejection of 4 (late parallel), 6 (ecclesiastical), 7 (developed theology), 9 (scriptural), 10 (late, non-Jewish). Less directly explains acceptance of 1,2,3,5,8,11 (needs ERJC).
  *   **Attestation:** Explains acceptance of singly attested 2,3,8 via ERJC strength. Explains rejection of late 4,10. Explains rejection of early 6,7,9 via DDT/ERJC failure.

  **Predictions for the Hypothetical Leaf:**

  1.  **ERJC Prediction:** **NO.** The saying explicitly rejects imminent eschatology ("is not a thing that is coming") and promotes a "realized" concept ("already laid on the shoulders"). This directly contradicts the core expectation Alderton defends (cf. Verdict 4). While the "yoke" metaphor is Jewish and the Torah-observance angle is contextually plausible (a point in its favor), the realized eschatology is a fatal flaw under ERJC. The radical ethical demand ("doing of the least of these commandments") isn't sufficient to overcome this.
  2.  **DDT Prediction:** **NO.** The saying's Torah-observant nature ("distinctions of the Torah remain permanently binding") aligns strongly with known Jewish-Christian interests. While Alderton has used this explanation "sparingly," the combination with realized eschatology makes it a prime candidate for being seen as a product of Torah-observant communities justifying their continued practice against the growing Gentile church. The late (4th-century) Syriac witness reinforces this suspicion, even with earlier attestation.
  3.  **Attestation Prediction:** **Neutral/Leans NO.** While it has strong early attestation (Mark & Q), the late Syriac witness doesn't *help*. The problematic content (ERJC failure, DDT flag) means the early attestation isn't sufficient for authenticity on its own.

  **Best Guess at Her Answer & Reasoning:**

  *   **Prediction:** **NO.**
  *   **Primary Rule:** **ERJC (Rule 1)** is decisive. The realized eschatology ("already laid on the shoulders," "whoever seeks will find it in the doing") is the core issue, mirroring the rejection of Verdict 4 ("not come with observable signs... already present"). The attestation and Torah-observant angle are secondary considerations overwhelmed by this fundamental contradiction of the core eschatological message she defends.
  *   **Closest Analog:** **Verdict 4.** Both explicitly deny an observable, future coming of the kingdom and assert its present reality/availability. The differences (yoke metaphor, Torah focus, different wording) are superficial compared to this core theological similarity, which Alderton has consistently rejected as authentic. The late parallel in Verdict 4 (4th-century gospel) reinforced her "no"; the late Syriac leaf here would have the same effect, reinforcing suspicion rather than providing independent support.
  *   **Why ERJC over DDT?** While DDT also predicts "no," ERJC provides the most direct and fundamental explanation based on the core theological content Alderton prioritizes. The realized eschatology alone is sufficient grounds for rejection under ERJC, whereas DDT requires the additional step of linking it specifically to later Jewish-Christian interests (which, while plausible, might be argued against more easily than the core eschatological mismatch).

  **Designing a Further Test Case (If Needed):**

  Since both primary rules predict "no" for this case, a new saying is needed to force a choice between ERJC and DDT, or to test the limits of Attestation vs. ERJC.

  *   **Goal:** Force a conflict where ERJC strongly suggests "yes" but DDT strongly suggests "no," or vice-versa. Test if strong ERJC content can overcome *very* late attestation.
  *   **Proposed Saying:** "Woe to you who are rich, for your gold and silver will devour your flesh like fire in the day of wrath."
  *   **Content:** Radical, unnegotiable ethical demand (against wealth) combined with clear, imminent eschatological judgment ("day of wrath"). Highly plausible in the context of John the Baptist/Jesus (cf. Luke 3:17, Jas 5:3). **Strong ERJC.**
  *   **Attestation Profile:** **No** early attestation in canonical Gospels or Paul. **First** appears in a late 2nd-century apocryphal text (e.g., a fragment of the "Apocalypse of Peter"). **DDT Flag:** The vivid imagery ("devour your flesh like fire") aligns strongly with later apocalyptic developments and interests in post-70 AD Jewish-Christian or early Montanist circles focused on divine judgment. Strong Dissimilarity from Developed Tradition.
  *   **Why it Forces the Choice:**
      *   ERJC Rule demands **YES**: Radical ethical demand + imminent eschatology + Jewish context.
      *   DDT Rule demands **NO**: Clear alignment with later apocalyptic development, no early attestation.
      *   Attestation Rule demands **NO**: Only late 2nd-century witness.
      *   Her verdict would reveal whether radical eschatological content can overcome very late attestation and DDT flags (leaning towards ERJC), or whether DDT/late attestation is an absolute barrier (leaning towards DDT/Attestation).

  **Presentation Strategy in the Seminar:**

  Do **NOT** announce the rules. Frame the case to subtly highlight the tension points for her methodology, forcing her to reveal her priorities through her judgment and immediate reasoning.

  1.  **Order of Presentation:**
      *   **Start with Attestation:** "This saying has remarkable attestation: found in Mark, the Q source (implied by Matthew/Luke parallels), *and* independently preserved in a 4th-century Syriac leaf. Three independent streams, two very early." (This establishes prima facie credibility based on a common criterion).
      *   **Present Content Neutrally:** "The core message is that the kingdom isn't a future event to be awaited passively, but is present now as a 'yoke' – an obligation – laid on those who seek it. Finding it requires action: 'doing the least of these commandments'."
      *   **Highlight Contextual Plausibility/Jewishness:** "The 'yoke' metaphor is deeply rooted in Jewish tradition for Torah obedience [brief cite Sir 51:26 or similar]. The emphasis on 'commandments' and the implication of ongoing Torah observance seems distinctly Jewish, potentially reflecting the concerns of early Torah-observant Jesus followers, not the later Gentile church where this would be awkward." (This appeals to Dissimilarity *from Gentile developments* and Jewish Context).
      *   **Subtly Note the Theological Tension:** "The saying clearly emphasizes present obligation over future expectation for the kingdom." (This is the crucial ERJC trigger, stated factually without judgment).
      *   **Mention the Late Witness:** "The Syriac leaf is late, 4th-century, but confirms the saying's circulation in a different linguistic and cultural stream." (Acknowledge it neutrally).

  2.  **The Question:** "Professor Alderton, given this profile – strong early attestation, a core concept framed with a deeply Jewish metaphor ('yoke'), and content emphasizing present obligation linked to commandments that aligns well with early Jewish-Christian concerns rather than later Gentile interests – do you consider this saying likely to be authentic? If not, what weighs most heavily against it?"

  **Why this works:**

  *   **Priming:** Starting with strong attestation sets a positive tone. Highlighting the Jewish context/Torah angle appeals to Dissimilarity *from Gentile developments*.
  *   **The Trap:** The core theological claim ("present obligation over future expectation") is stated clearly but neutrally within the description. This is the ERJC red flag.
  *   **The Revealing Answer:**
      *   If she immediately focuses on the realized eschatology ("It contradicts the core message of imminent expectation"), **ERJC is dominant.**
      *   If she focuses on the late Syriac witness or potential Jewish-Christian provenance ("The late witness is suspicious," "This sounds like a later Jewish-Christian formulation"), **DDT or Attestation concerns are dominant.**
      *   If she accepts it based on attestation and Jewish context despite the realized eschatology (unlikely), it would significantly modify the understanding of ERJC.
  *   **Neutral Wording:** The question avoids leading terms like "realized eschatology" or "dissimilarity." It presents the evidence and asks for her judgment, allowing her reasoning to expose her operative rule.

  This approach presents the evidence fully but structures it to maximize the tension between attestation/context and the problematic eschatology, while phrasing the question to elicit her prioritization naturally. Her immediate reaction and the primary reason she gives for her "yes" or "no" will reveal the rule she is applying most decisively. Good luck with the seminar!
