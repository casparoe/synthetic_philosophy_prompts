  **DOCUMENT SET: OFFICE OF EPISTEMIC CLEARANCE (OEC) - MERIDIAN TRUST**  
  *Internal Distribution Only - Classification: Amber/Stakes-Sensitive*

  **1. OEC CIRCULAR 7.44.1: IMPLEMENTATION OF CONTEXTUAL KNOWLEDGE ATTESTATION FRAMEWORK**  
  *Effective: Immediately. Supersedes all prior knowledge attribution standards.*

  1.1. **Contextual Knowledge Standard (CKS):** All employee assertions implying knowledge (e.g., "I know X," "X is confirmed," "Certain that Y") must now be evaluated under the CKS. Knowledge attributions are hereby defined as context-sensitive, contingent upon the practical stakes inherent to the decision environment where the attribution is made.  
  1.2. **Stakes Index:** The evidential threshold required for a valid knowledge claim scales proportionally with the Practical Stakes Index (PSI) of the action predicated on that claim. (See Schedule A: Stakes-to-Evidence Exchange Rates).  
  1.3. **Attestation Ladder:** Employees are restricted to standardized attestation phrases corresponding to the PSI band of the immediate decision context. The phrase "I know" is deprecated. Approved phrases range from "Seems plausible, low-stakes context" (PSI 1-3) to "Evidence withstands catastrophic downside scrutiny" (PSI 9-10).  
  1.4. **Epistemic Structuring Service (ESS):** For high-stakes client decisions (PSI ≥7), Relationship Managers may offer ESS. This decomposes a single high-stakes action into a validated chain of micro-actions, each operating within a low-stakes context (PSI ≤3), thereby preserving valid knowledge claims throughout. Fees apply per micro-validation.  
  1.5. **Classified-Stakes Provision (CSP):** Certain stake-elevating factors (e.g., undisclosed counterparty risk, latent systemic exposure) are classified Amber or higher. Employees *cannot disclose* these factors or that CSP has been invoked. Consequently, an applicant's evidential standing may be degraded without their awareness or recourse to challenge the basis. Knowledge status under CSP is non-reviewable.  
  1.6. **OEC Self-Application:** The PSI governing the validity of this Circular, and all OEC rulings, is set by the OEC Chief Epistemic Officer (CEO) based on the assessed stakes of regulatory sanction for non-compliance. This PSI simultaneously determines the evidential threshold the OEC itself must meet for its rulings to constitute knowledge.

  *Schedule A: Stakes-to-Evidence Exchange Rates (Extract)*
  *   **PSI 1-3 (Trivial):** Balance of probabilities suffices. (e.g., Confirming coffee machine operational).
  *   **PSI 4-6 (Significant):** Clear and convincing evidence required. (e.g., Standard KYC verification).
  *   **PSI 7-9 (Severe):** Evidence must eliminate all reasonable doubt *and* foresee plausible catastrophic scenarios. (e.g., Large structured transaction).
  *   **PSI 10 (Existential):** Evidence must withstand sceptical scenarios demonstrably more rigorous than regulatory standards. (e.g., Bank-wide capital adequacy attestation).

  **2. FAQ: CONTEXTUAL KNOWLEDGE ATTESTATION - BRANCH STAFF**

  *   **Q: Why can’t I say "I know" anymore?**  
      A: "I know" implies invariant epistemic standing regardless of context. CKS recognizes that what constitutes sufficient evidence for knowledge shifts with practical stakes. Using "I know" in a high-stakes context could misrepresent your epistemic position and violate Standard 1.3. Use the approved attestation ladder phrases.

  *   **Q: Customer Smith’s evidence (payslip, ID) hasn’t changed since Monday (PSI 4: loan inquiry), but today he’s applying for a much larger loan (PSI 7). He says "You knew my salary Monday!". How to respond?**  
      A: Explain that the *sufficiency of evidence* is context-dependent. Monday’s evidence met the threshold for PSI 4 (Significant). The larger loan elevates the context to PSI 7 (Severe), requiring a higher evidential threshold. His evidence, unchanged, now falls below this threshold. Offer ESS to decompose the loan approval into validated micro-steps (e.g., salary verification micro-step at PSI 3). Do *not* state his evidence is now "insufficient" simpliciter; frame it as contextually inadequate per CKS.

  *   **Q: Customer Jones is denied under CSP. She demands to know *why* her evidence is suddenly insufficient. Protocol?**  
      A: Standard response: "Meridian Trust utilizes a comprehensive, context-sensitive risk assessment framework. Based on this framework, your current documentation package does not meet the required attestation level for this action." Do *not* acknowledge CSP invocation, classified factors, or that her epistemic standing has degraded. Escalate repeated inquiries to OEC Liaison.

  **3. CASE FILE: OEC/DD/774 - Disciplinary Action: KNOWLEDGE DEFICIENCY**

  *   **Employee:** J. Aris (Teller, Branch 12)
  *   **Date:** 2023-10-27 (Friday)
  *   **Incident:** Processed Priority Funds Transfer (PFT) for Customer Delta ($250,000) using standard verification (PSI 6 procedure). Transaction flagged post-hoc by OEC automated monitoring.
  *   **Violation:** Failed to meet CKS evidential threshold (OEC Circular 7.44.1, Cl. 1.2, 1.3). Determination: Employee *did not know* recipient account details were correct at time of authorization (PSI 7 context).
  *   **Employee Defense:** "Used identical verification steps (ID cross-check, account # confirm) as Monday's PFT ($10,000, PSI 5). Monday's was cleared. Evidence base unchanged."
  *   **OEC Ruling:** Defense irrelevant. Context shifted from PSI 5 (Monday) to PSI 7 (Friday) due to transaction size exceeding new weekly cumulative threshold (implemented Thurs, OEC Memo 7.44.1a). Evidence sufficient for PSI 5 knowledge attribution Monday was insufficient for PSI 7 knowledge attribution Friday. Sanction: Mandatory Epistemic Awareness Training Level 2. ESS recommendation not offered to customer noted as aggravating factor.

  ---

  **APPARATUS NOTE: CONTEXT & CONTESTATION (246 words)**

  The fictional OEC documents satirize **pragmatic encroachment** (PE) and **epistemic contextualism** (EC), related views concerning knowledge attributions.

  *   **Settled Observation:** It is well-supported empirically (via surveys, linguistic analysis) that *ordinary speakers' willingness to attribute "knowledge"* in hypothetical scenarios (e.g., bank error cases) *shifts systematically* depending on the practical stakes involved. What people are willing to call "known" with low evidence in low-stakes situations, they often deny in high-stakes ones, even holding the subject's evidence fixed. This is the core intuition driving PE/EC.
  *   **Contested Explanations:** *Why* this shift occurs is highly contested:
      *   **PE:** Argues the *property of knowledge itself* depends partly on practical factors (stakes). What you know changes with what's at stake.
      *   **EC:** Argues the *semantic standards* for the word "know" shift contextually (like "tall"). What "S knows P" means/requires changes with conversational context (often influenced by stakes).
      *   **Pragmatic Only:** Argues the shift is purely about *assertability/pragmatics*, not knowledge itself or the semantics of "know". You still know in high stakes, but shouldn't say so.
  *   **Contested Doctrines:** Whether *knowledge* (not just assertion) is the unique norm of practical reasoning ("You should act only on what you know") is debated. The treatment of **stakes one cannot access** (like the OEC's Classified-Stakes Provision) is a major point of contention: Can stakes affect knowledge if the subject is unaware of them? PE proponents disagree; EC often ties standards to the ascriber's context.

