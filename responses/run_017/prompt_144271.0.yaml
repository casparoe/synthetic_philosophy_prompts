   2. The Memo (in deadpan consultant register, with numbered sections):

      TO: Clients and Prospective Clients
      FROM: [Firm Name] Leadership
      SUBJECT: Attribution Management: New Solutions for an Age of Heightened Scrutiny

      [Introduction] 
      We introduce a breakthrough service leveraging experimental philosophy research: Attribution Management. It addresses the persistent challenge that foreseen outcomes, whether beneficial or detrimental, are often misattributed as intentional.

      [Background: The Finding]
      Describe the chairman case without quotation: A chairman approves a program knowing it will affect the environment and stating indifference. When the outcome is harmful, he is judged to have caused it intentionally; when beneficial, not intentionally. The valence of the outcome drives attribution, regardless of actual aims.

      [The Firm's Insight]
      We recognized that the only variable under our control is the valence of the description. Therefore, our methodology focuses on narrative management.

      [The Rival Firm and Rebuttal]
