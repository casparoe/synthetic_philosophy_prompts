answer: |-
  ### Restated Puzzles and Decision Theories in Applied ML Vocabulary

  #### **Counterfactual Mugging (CM)**
  - **Environment**: 
    - **State space**: $S_0$ (coin flip: heads/tails). 
    - **Action space**: $A_{\text{pay}}$ (pay $100$) or $A_{\neg\text{pay}}$ (don't pay).  
    - **Dynamics**: 
      - Coin flip $s_0 \sim \text{Bernoulli}(0.5)$. 
      - **Predictor**: Pre-flip, simulates your policy $\pi_{\text{v1}}$ in the tails branch. Outputs $\hat{A} = f_{\text{pred}}(\pi_{\text{v1}})$, where $\hat{A}$ is the predicted action for tails. Predictor accuracy: 90% for $\pi_{\text{v1}}$ on the deployment distribution (no guarantees off-policy).  
      - **Reward**: 
        - If $s_0 = \text{heads}$: $R = 10,000$ if $\hat{A} = A_{\text{pay}}$, else $R = 0$. 
        - If $s_0 = \text{tails}$: $R = -100$ if $A = A_{\text{pay}}$, else $R = 0$.  
    - **Agent**: Before prediction, can update policy from $\pi_{\text{v1}}$ to $\pi_{\text{v2}}$ at near-zero cost.  
  - **Query**: $s_0 = \text{tails}$ (actual state). Should $\pi_{\text{v2}}$ select $A_{\text{pay}}$?  
  - **Key asymmetry**: No agent action in the heads branch. Reward depends on the **counterfactual prediction** of $\pi_{\text{v1}}$ in an unobserved state (tails).  

  #### **XOR Blackmail (XOR)**
  - **Environment**: 
    - **State space**: $S_0$ (event $E$: house-destroying event, $P(E) = 0.01$).  
    - **Action space**: $A_{\text{pay}}$ (pay $1,000$) or $A_{\neg\text{pay}}$ (don't pay).  
    - **Dynamics**: 
      - **Blackmailer**: Observes $E$, sends letter $L$ iff $E \oplus \hat{A} = \text{True}$, where $\hat{A} = f_{\text{pred}}(\pi_{\text{v1}})$ is the predicted action for your policy.  
      - **Agent**: Receives $L$ (so $E \oplus \hat{A} = \text{True}$), then chooses action under $\pi_{\text{v2}}$.  
      - **Reward**: $R = -1,000 \cdot I(A = A_{\text{pay}}) - 1,000,000 \cdot I(E)$.  
  - **Query**: $L$ received. Should $\pi_{\text{v2}}$ select $A_{\text{pay}}$?  
  - **Key asymmetry**: Agent's policy $\pi_{\text{v1}}$ **determines if $L$ exists** via $\hat{A}$, creating feedback between policy and state visibility.  

  ---

  ### **Decision Theories Translated**  
  Assume predictor accuracy is 90% for $\pi_{\text{v1}}$, and $\pi_{\text{v2}}$ is chosen pre-decision.  

  #### **Causal Decision Theory (CDT)**  
  - **Framework**: Uses **interventional counterfactuals** (e.g., $do(A)$). Ignores non-causal correlations.  
  - **CM**:  
    - In actual state ($s_0 = \text{tails}$), $A_{\text{pay}}$ causes a loss of $100$.  
    - Reward in heads branch ($s_0 = \text{heads}$) is **not causally affected** by $A$ in tails.  
    - Ignoires predictor's reliance on $\pi_{\text{v1}}$ (treats $\hat{A}$ as fixed).  
    - **Verdict**: $A_{\neg\text{pay}}$ (no pay).  
  - **XOR**:  
    - $A_{\text{pay}}$ causes a loss of $1,000$; $E$ is independent of $A$ (no causal effect).  
    - **Verdict**: $A_{\neg\text{pay}}$ (no pay).  
  - **Translation**: CDT reduces to **myopic policy optimization** under a misspecified MDP where $\hat{A}$ is part of the state, not a function of $\pi$.  

  #### **Evidential Decision Theory (EDT)**  
  - **Framework**: Uses **conditional expectations** ($E[R \mid A]$). Actions update beliefs via statistical evidence.  
  - **CM**:  
    - $E[R \mid A_{\text{pay}}, s_0=\text{tails}] \approx -100 + 0$ (no evidence about heads branch).  
    - Predictor accuracy for $\pi_{\text{v2}}$ is unknown; no overlap between $\pi_{\text{v1}}$ and $\pi_{\text{v2}}$.  
    - **Verdict**: $A_{\neg\text{pay}}$ (no pay).  
  - **XOR**:  
    - Condition on $L$: $E \oplus \hat{A} = \text{True}$.  
    - $E[R \mid A_{\text{pay}}, L] = -1,000 - 1,000,000 \cdot P(E \mid A_{\text{pay}}, L)$.  
    - $A_{\text{pay}}$ is evidence that $\hat{A} = A_{\text{pay}}$ (since predictor trained on $\pi_{\text{v1}}$, and $\pi_{\text{v2}}$ may correlate). Thus, $P(E \mid A_{\text{pay}}, L) \approx P(E \mid E \oplus \text{True} = \text{True}) = P(E \mid \neg E) = 0$.  
    - **Verdict**: $A_{\text{pay}}$ (pay).  
  - **Translation**: EDT is **off-policy evaluation with importance sampling**, but assumes $\pi_{\text{v2}}$’s action provides evidence about $\pi_{\text{v1}}$’s behavior (ignoring policy drift).  

  #### **Functional Decision Theory (FDT)**  
  - **Framework**: Treats the agent’s policy $\pi$ as a **function**. Maximizes utility across all inputs where $\pi$ is called, including counterfactuals.  
  - **CM**:  
    - Consider the **counterfactual rollout** of $\pi_{\text{v2}}$ in the tails branch (even though $s_0 = \text{heads}$ occurred).  
    - If $\pi_{\text{v2}}$ outputs $A_{\text{pay}}$ in tails, predictor $\hat{A} = A_{\text{pay}}$ with 90% probability (if $\pi_{\text{v2}} \approx \pi_{\text{v1}}$), yielding $10,000 \times 0.9 = 9,000$ in heads.  
    - Net expected utility of $A_{\text{pay}}$: $-100 + 9,000 = 8,900$.  
    - **Verdict**: $A_{\text{pay}}$ (pay).  
  - **XOR**:  
    - $\pi_{\text{v2}}$ paying ensures $\hat{A} = A_{\text{pay}}$ (if policy consistent), so $L$ sent iff $\neg E$. Thus, $L$ implies $\neg E$, avoiding the $1,000,000$ loss.  
    - $E[R \mid \pi_{\text{v2}} = \text{pay}] \approx -1,000 - 0 = -1,000$.  
    - Not paying implies $L$ iff $E$, leading to $E[R] \approx -1,000,000$.  
    - **Verdict**: $A_{\text{pay}}$ (pay).  
  - **Translation**: FDT performs **model-based rollouts of $\pi$ in all relevant states**, including those not visited (e.g., heads in CM). Requires $\pi$ to be **explicitly represented as a function**.  

  ---

  ### **Translation Challenges and Imported Assumptions**  
  1. **Predictor as Off-Policy Query (CM)**:  
     - The query "what would I do in tails?" is an **off-policy evaluation** for $\pi_{\text{v1}}$ in an unobserved state.  
     - **Thin overlap**: Low accuracy for $\pi_{\text{v2}} \neq \pi_{\text{v1}}$. CDT/EDT ignore this; FDT assumes $\pi_{\text{v2}}$ generalizes from $\pi_{\text{v1}}$.  
     - **Imported assumption**: The predictor’s simulation of $\pi_{\text{v1}}$ is a **model-based counterfactual**, not a statistical one. ML tools (e.g., IPS) fail here due to covariate shift.  

  2. **Policy-Dependent Dynamics**:  
     - Both puzzles violate the **MDP assumption** that $P(s' \mid s, a)$ is policy-independent.  
     - In CM, $P(\hat{A} \mid s_0)$ depends on $\pi_{\text{v1}}$; in XOR, $P(L \mid E)$ depends on $\pi_{\text{v1}}$.  
     - **Imported assumption**: Decision theories disagree on whether to **treat $\pi$ as part of the environment** (CDT) or as an **optimizable function** (FDT).  

  3. **Asymmetry Between Puzzles**:  
     - **CM**: The payoff branch (heads) has **no agent action**. The counterfactual is purely *predictive* (what $\pi_{\text{v1}}$ *would* do).  
     - **XOR**: The agent’s policy **affects observability** ($L$ exists iff $E \oplus \hat{A}$).  
     - **Translation**:  
       - CM maps to **off-policy evaluation with no overlap** (tails state unobserved in heads).  
       - XOR maps to a **contextual bandit with partial observability** ($E$ unobserved unless $L$ sent).  
     - Both are expressible, but XOR requires **factoring in policy-dependent state dynamics**, which ML tools avoid.  

  ---

  ### **Residue Report**  
  #### **Clean Mappings**  
  - **Policy-dependent dynamics**: Both puzzles are **non-Markovian** (rewards/states depend on $\pi$). This is a **misspecified MDP**, and the dispute is over how to relax stationarity.  
  - **EDT in XOR**: Resembles **covariate shift adjustment**. Conditioning on $A_{\text{pay}}$ updates beliefs about $E$ given $L$, analogous to propensity scoring.  
  - **Regret**: CDT minimizes regret in the **actual state**; FDT minimizes regret in **all possible states** where $\pi$ is evaluated.  

  #### **Distorted Mappings**  
  - **FDT’s counterfactuals**: Model-based rollouts of $\pi$ in unobserved states (e.g., heads in CM) are **not standard off-policy evaluation**. Off-policy methods (e.g., FQE) estimate $V(s)$ for a *fixed* policy in *observed* states. FDT evaluates $\pi$ in *logically possible* states, even if unreachable.  
  - **Predictor accuracy**: The 90% accuracy is a **frequentist approximation**, but FDT treats it as a **logical probability** (e.g., "90% of similar functions output $A_{\text{pay}}$").  

  #### **No Counterpart**  
  - **Decision-function counterfactuals**: The core of FDT—evaluating $\pi$ as a function across **multiple environments**—has no ML equivalent. ML tools handle *statistical* counterfactuals (e.g., "what if $A=a$ in state $s$?"), not *logical* ones (e.g., "what if $\pi$ output $a$ in all states?").  
  - **Policy as a global object**: CDT/EDT view actions as local choices; FDT views $\pi$ as a **causal node affecting multiple rewards**. ML lacks tools to model $\pi$ as a shared parameter across episodes.  

  ### **Your Hypotheses: Assessment**  
  1. **"Both puzzles describe policy-dependent environments (misspecified MDP)"**:  
     - **Correct**, but incomplete. The dispute centers on **how to model $\pi$'s influence**:  
       - CDT: Ignore it (treat $\hat{A}$ as noise).  
       - EDT: Condition on it (treat $\hat{A}$ as a confounder).  
       - FDT: Optimize it (treat $\pi$ as a lever).  
     - ML tools (e.g., POMDPs) *can* model policy-dependent states, but they require $\pi$ to be **exogenous**, not something the agent designs.  

  2. **"Counterfactual dependence on the decision function is irreplaceable"**:  
     - **Correct**. Statistical counterfactuals (e.g., $do(A)$) cannot capture:  
       - Why FDT pays in CM: It cares about the **function’s output in an unobserved branch**.  
       - Why XOR’s $L$ depends on $\pi$: The blackmailer’s action is a **function of $\pi$ itself**, not just its outputs.  
     - **No amount of off-policy evaluation** can replicate this without treating $\pi$ as a causal primitive.  

  ---

  ### **Conclusion**  
  The residue lies in **functional counterfactuals**—evaluating a policy not just as a mapping from states to actions, but as a **uniﬁed function with logical consequences across all possible states**. ML tools (e.g., off-policy evaluation) excel at *statistical* counterfactuals under overlap but cannot handle the *logical* dependence of rewards on the agent’s decision function as a global entity. This is why FDT prescribes paying in both puzzles: it optimizes $\pi$ as a function, not just its outputs. The asymmetry between CM (counterfactual branch) and XOR (policy-dependent observability) is expressible in ML terms, but the core disagreement requires embracing $\pi$ as a causal force, not just a conditional distribution. To resolve these puzzles, you need a theory where the agent’s algorithm is part of the generative model—something beyond MDPs or potential outcomes.
