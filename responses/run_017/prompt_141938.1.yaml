    - FDT considers the logical consequences of the decision function. It notes that the blackmailer uses the XOR condition based on the prediction of the decision function. If the decision function is such that it pays, then the blackmailer sends the letter only when `E` is false. Therefore, receiving the letter is evidence that `E` is false. Then paying $1000 is better than not paying (which leads to no loss if `E` is false). If the decision function is such that it does not pay, then the blackmailer sends the letter only when `E` is true. Then upon receiving the letter, the agent would know `E` is true and would not pay (but then the house is destroyed). However, by adopting a policy of paying, the agent ensures that the letter is only sent when `E` is false, so they avoid the $1,000,000 loss. Therefore, FDT pays.

