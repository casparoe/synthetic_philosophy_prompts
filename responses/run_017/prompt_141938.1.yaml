  We are going to translate the two decision problems and the three decision theories (CDT, EDT, FDT) into the vocabulary of off-policy evaluation and causal inference for sequential decisions. We'll note where the translation is straightforward and where it requires making assumptions that might not be in the original philosophical debate.

  First, let's restate the two puzzles in a more formal way using the vocabulary you provided.

  **Counterfactual Mugging (CM):**

  - **Environment setup:** 
    - A coin is flipped (state `S0`). It is fair: `P(heads) = P(tails) = 0.5`.
    - There is a predictor that, before the coin flip, simulates (or predicts) what you would do in the event of tails. Specifically, it outputs a prediction `A_pred` of your action in the tails scenario. The predictor is highly reliable (say 99% accurate) when the agent is using policy `v1` (the version at the time of prediction). 
    - After the prediction, you may update your policy to `v2` at negligible cost. Then the coin is flipped and revealed to you.
    - If the coin is heads, then you are given $10,000 only if the predictor predicted that you would pay $100 in the counterfactual tails scenario (i.e., `A_pred = pay`). 
    - If the coin is tails, you are asked to pay $100. There is no direct payment in tails, but the predictor's past prediction (based on `v1`) and your current action (under `v2`) are compared. If you pay, you lose $100. If you don't pay, you get nothing. However, note that the payment in heads is contingent on the predictor's past prediction.

  We can model this as a two-step decision process:

  1. At time `t0`: The predictor observes policy `v1` and outputs `A_pred` (which is either `pay` or `not_pay`) for the tails scenario.
  2. At time `t1`: The coin is flipped and revealed. If tails, the agent (now on policy `v2`) chooses an action `A` (pay or not_pay). If heads, no action is taken.

  The reward:
  - If heads and `A_pred == pay`, then reward = $10,000.
  - If heads and `A_pred == not_pay`, then reward = $0.
  - If tails and `A = pay`, then reward = -$100.
  - If tails and `A = not_pay`, then reward = $0.

