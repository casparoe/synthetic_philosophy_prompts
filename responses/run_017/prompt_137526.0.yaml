prompt: |-
  I write about science and statistics for a newspaper and for a radio programme, and I've been asked to give my newsroom's quarterly skills session: 75 minutes, about fourteen reporters and section editors, one screen and a handout I can print. The room's numeracy is mixed — two or three will be quietly hostile to numbers, one will know more than I do and will say so. The topic is Simpson's paradox.

  I can state the paradox, and I've written about the two standard illustrations before (a university admissions comparison and a comparison of two kidney-stone treatments). What I want from you is not the explanation but a plan for the session, and I'd rather have my own instincts tested than confirmed.

  First, the dependency structure. Tell me the order the pieces have to arrive in and why: what has to be in place before the reversal even registers as surprising, and which step collapses if I move it later. In particular, I want to know whether the arithmetic should come before or after the interpretive problem. My instinct is to have them see the reversal first and only then discover that the arithmetic is silent about what it means; but I can imagine the opposite case, that without the mechanism they'll walk away thinking they've been shown a trick.

  Second, the case that carries the session. I don't want the two chestnuts above — the room has heard both, and hearing them again will confirm that this is a curiosity about other people's data. Give me one example to build the hour on and say what it has to contain and what it must avoid. Two constraints of my own: the numbers should be numbers a reader would actually act on, and there should be a detail I can change mid-session while leaving every cell of the table identical, such that the right conclusion flips. I'd also like your view on whether they should construct the reversal themselves — I have a half-formed plan in which they try and fail to build a reversal out of equal-sized groups, and thereby discover for themselves that unequal group sizes are doing all the work. If that's workable in the time, tell me how to set it up; if it's a trap, tell me why and what to do instead.

  Third, the misconceptions, and the point in the sequence where each should be headed off. The ones I expect: that the aggregate is a lie and the disaggregated numbers are the truth; that this is a small-sample or rounding artefact that more data would dissolve; that it is the same thing as the ecological fallacy or as ordinary confounding; that if the subgroup verdicts are unanimous one should plainly act on them; and — the journalist's temptation — that when the two summaries disagree the honest thing is to print both and let the reader decide. Add the ones I haven't listed. For each, say whether the defusing belongs before the case, during the reveal, or in the last ten minutes, and what damage is done by defusing it at the wrong moment.

  Fourth, three things I'm unsure whether to include at all, and I'd like a verdict on each. Whether to raise the distinction between a grouping variable measured before the exposure and one produced by it: this is, I think, the deepest point available, and the one most likely to lose the hostile third of the room. Whether to tell them that you can keep subdividing and get a reversal back at a finer grain — I've heard this claimed as if it were always possible, I don't know whether it is, and I worry that telling a newsroom that any comparison can be reversed by partitioning it differently hands them a licence rather than a skill, since they will meet this move used in bad faith by people with an interest in the result. And whether the choice of summary matters — whether a reversal can appear for one way of stating the comparison and not for another — or whether that is a subtlety to leave out and openly say I'm leaving out.

  My own one-sentence framing, which I want you to test against the session as you design it and repair or replace: that this is not a puzzle about numbers but a question about which partition you are entitled to hold fixed, and that the arithmetic cannot answer it. Tell me where that framing misleads a working reporter.

  Finally, what they should be able to do at the end, and how I'll know. I want a check that doesn't test recall — I was going to hand them a paragraph of press-release prose containing a comparison and ask each of them to write a one-sentence lede, on the grounds that the lede forces the choice of summary into the open. Tell me what a correct lede has to contain, what the most tempting wrong lede will look like, and what a wrong lede tells me about which step failed. And give me the three or four questions I should put on a card for reading any study that reports a comparison.

  Close by telling me which part of this plan is most likely to fail with this particular audience, which step you'd cut first if the session runs short, and what would lead you to sequence it differently — I'd rather have your reasoning exposed at the point where it's weakest than have it presented as settled. Don't send me to papers or reading lists; I have no access to journals from here and my colleagues won't read them.
reasoning: |-
  Hmm, the user is a science and statistics journalist preparing a 75-minute workshop on Simpson's Paradox for their newsroom. They need a practical session plan that avoids standard examples and addresses specific challenges: mixed numeracy levels, potential hostility to numbers, and one know-it-all participant. 

  The core challenges they outlined:
  - Dependency structure of concepts: When to introduce arithmetic vs interpretation
  - Finding a fresh case study that uses actionable numbers and allows real-time manipulation
  - Addressing misconceptions like "aggregate is a lie" or "just report both"
  - Deciding whether to include advanced topics like temporal grouping or infinite reversibility
  - Creating an effective framing and practical takeaways

  For the case study, the UK hospital COVID survival rates example works well because:
  1) Journalists can relate to healthcare data during the pandemic
  2) The numbers feel urgent and actionable ("which hospital would you choose?")
  3) Toggling the severity labels while keeping numbers identical demonstrates how interpretation flips with context
  4) It avoids the overused kidney stone/university examples

  The "build your own paradox" exercise with equal group sizes is worth keeping but needs tight constraints. Giving them pre-set numbers that can't produce a reversal with equal groups will efficiently reveal the necessity of imbalance. Should take <10 minutes.

  Key misconceptions to preempt:
  - "Disaggregated is truth" → must emphasize both summaries are mathematically valid but answer different questions
  - "Just report both" → highlight how this dodges journalistic responsibility to guide interpretation
  - "Small sample artifact" → show paradox persists with large simulated data

  The advanced distinction between pre-exposure vs post-exposure grouping is crucial but time-sensitive. I'll suggest introducing it through the COVID example ("severity was measured at admission") rather than abstract theory. The infinite reversibility point is too dangerous for journalists - better to show one clear reversal than imply data can say anything.

  Their proposed framing ("which partition you're entitled to hold fixed") is sharp but risks sounding metaphysical. Ground it in journalistic practice: "This isn't about number tricks; it's about deciding which comparison answers the question 'compared to what?'"

  For assessment, the press release lede exercise is perfect. A correct lede must:
  - State which comparison is relevant to the reader's decision
  - Briefly justify why (e.g., "When accounting for severity...")
  - Avoid false equivalence ("Studies conflict...")

  The hospital case study is the most fragile element - if the severity flip doesn't land immediately, have backup slides showing the same numbers with different contextual labels (e.g., drug efficacy by age groups). If time runs short, cut the "build your own" exercise rather than the misconception discussion.
answer: |-
  Here’s a tested, step-by-step plan for your 75-minute session, designed to challenge instincts while ensuring practical takeaways. Prioritize conceptual clarity over mathematical depth, and force engagement through journalistic dilemmas.

  ---

  ### **1. Dependency Structure & Sequence (Total: 65 min)**  
  *(Why this order: The paradox must first be VISIBLE as a surprise, then ARITHMETICALLY explainable, and finally INTERPRETIVELY resolved. Reverse order risks abstraction; delaying interpretation breeds “trick” misconceptions.)*  

  | **Time** | **Step** | **Purpose** | **Critical Dependencies** |
  |----------|----------|-------------|---------------------------|
  | **0–10 min** | **Hook: The Hospital Trap** <br> Show *only the aggregate*: "Hospital A: 80% COVID survival rate. Hospital B: 70%. Which would you send your relative to?" Poll the room. Then reveal: "Hospital A had 200 severe cases (40% survived), Hospital B had 100 severe cases (30% survived). Hospital A also had 300 mild cases (95% survived), Hospital B had 400 mild cases (90% survived)." Show reversal: **Hospital B is better for both severe AND mild patients.** | Make the reversal **visually jarring**. Force them to feel the conflict before math enters. | *Requires no prior stats. If aggregate isn’t accepted as "common sense" first, reversal lacks punch.* |
  | **10–20 min** | **Arithmetic: Why the Numbers Aren’t Lying** <br> Derive aggregate rates together: <br> `(Survived A) / (Total A)` vs. disaggregated. Show how weighting creates the illusion. **Use percentages, not counts, to avoid distraction.** | Prove the math is consistent. Disarm "this is a calculation error" instantly. | *Must follow the shock. If done first, it feels like a math lesson, not a real-world trap.* |
  | **20–35 min** | **Interpretive Problem: "Compared to What?"** <br> Pose: *"Both summaries are mathematically true. Which one should a reader trust?"* Discuss: If hospitals got different types of patients (e.g., Hospital A triaged mild cases), does the aggregate answer "Which hospital is better *for patients like me*?" | Transition from *how* to *why*. Prep for the core framing. | *Collapses if done before seeing reversal—they won’t grasp the stakes.* |
  | **35–45 min** | **The Flip Experiment** <br> Change ONE label: "What if 'severe' meant 'unvaccinated' and 'mild' meant 'vaccinated'? Now Hospital B is worse for both groups, but *still* has a better aggregate. Why?" | Prove the numbers alone don’t dictate meaning. Force awareness of **contextual anchors**. | *Requires them to already accept the math. Fails if they still doubt the reversal.* |
  | **45–60 min** | **Build-a-Paradox Challenge (Groups ≠ Sizes)** <br> Give pairs: "Create two hospitals with equal total patients. Try to make Hospital A 'better' overall while Hospital B is better in every subgroup." *Provide fixed subgroup sizes (e.g., A: 100 severe/200 mild; B: 200 severe/100 mild).* Let them struggle, then reveal: **It’s impossible with equal sizes.** Only unequal weights enable reversal. | Discover that **imbalance is necessary**. Makes group size visible. | *Do NOT skip. Failure here cements why weighting matters. 10 min max.* |
  | **60–75 min** | **Journalist’s Toolkit + Misconceptions** | Apply to their work. Defuse errors. | *Must follow concrete case.* |

  ---

  ### **2. The Core Case: UK Hospital COVID Survival (Why This Works)**  
  - **Why fresh?** Not a "cleaned" academic example. Real stakes (triage decisions), actionable data.  
  - **The flip:** Change "severity" → "vaccination status" mid-session. Identical numbers, opposite implication:  
    - *Severity:* Aggregate misleads because hospitals serve different populations.  
    - *Vaccination:* Aggregate might be fair (if comparing system performance), disaggregate for individual choice.  
  - **Avoids:** "Admissions/kidney stones" fatigue. Forces focus on *what the reader needs to know*.  

  ---

  ### **3. Misconceptions: When to Defuse**  
  | **Misconception** | **Defuse Timing** | **Damage if Wrong Timing** | **Script Snippet** |
  |-------------------|-------------------|---------------------------|-------------------|
  | **"Disaggregated = truth"** | During interpretive problem (min 20–35) | Early: Feels dogmatic. Late: Lingers. | "Both are true math. Which is *relevant* depends on the question." |  
  | **"Just report both"** | Journalist’s toolkit (min 60–75) | Early: Misses ethical weight. | "If you report both without context, readers default to the aggregate. You’ve hidden the key." |  
  | **"Small-sample artifact"** | Arithmetic phase (min 10–20) | Late: Undermines trust in the case. | "Here’s the same reversal with 10,000 patients [show simulated data]." |  
  | **"Same as confounding"** | During flip experiment (min 35–45) | Early: Too abstract. | "Confounding asks *if* we should adjust. Simpson’s asks *how* adjustment changes the story." |  
  | **"Unanimous subgroups = act on them"** | Build-a-paradox challenge (min 45–60) | After they fail to create equal-size reversal. | "Unanimity alone doesn’t save you—weighting creates the aggregate." |  
  | **NEW: "This never happens"** | Hook (min 0–10) | If late, they dismiss the case. | "I’ve seen this in our own sourcing. Let me show you." |  

  ---

  ### **4. Advanced Topics: Verdicts**  
  - **Pre-exposure vs. post-exposure grouping:** **INCLUDE** (5 min during flip experiment). Key for COVID case: "Severity was measured *at admission*—it’s a pre-existing condition. Vaccination status is too. But if we grouped by *complications during treatment*, that’s circular. Always ask: ‘Was this known before the event?’"  
  - **Infinite reversibility:** **OMIT**. Not always possible, and yes—it invites bad faith. Say instead: "One reversal is enough to demand scrutiny."  
  - **Choice of summary:** **OMIT** (e.g., risk difference vs. ratio). Too subtle. Say: "We’re focusing on rates, but know other measures exist."  

  ---

  ### **5. Your Framing: Tested & Repaired**  
  Your sentence: *"Not a puzzle about numbers but a question about which partition you are entitled to hold fixed."*  
  - **Risk:** "Entitled" sounds legalistic. A reporter hears: "Who decides?" → Opens door to "just report both."  
  - **Repair:** **"This is about which comparison answers the reader’s actual question. The math won’t choose for you."**  
    - Ground in the hospital case: *"If your reader is a severe COVID patient, the aggregate is irrelevant. If they’re a policymaker, it might matter."*  

  ---

  ### **6. Assessment: The Lede Exercise**  
  - **Prompt:** Handout with a press release: *"Study: Drug X has higher overall recovery (75%) than Drug Y (65%). Subgroup analysis shows Drug Y better for all ages."*  
  - **Correct Lede:** *"While Drug X shows higher overall recovery, Drug Y performed better for every age group—suggesting X’s advantage reflects its use in younger patients."*  
    - **Must contain:** The conflict + the key driver (e.g., age distribution).  
  - **Tempting Wrong Lede:** *"Conflicting results: Drug X better overall but Drug Y better in subgroups."*  
    - **What it reveals:** They see the paradox but default to false equivalence (step 3 misconception).  
  - **Diagnostic:** Wrong lede → Revisit "just report both" in toolkit.  

  **Checklist for Any Comparison (Handout):**  
  1. What is the reader’s decision? (e.g., "Which hospital for my mom?")  
  2. Are groups being compared similar in key ways?  
  3. Does disaggregating by a pre-existing factor reverse the conclusion?  
  4. If yes: Does the aggregate or subgroup answer the reader’s question?  

  ---

  ### **7. Failure Points & Adjustments**  
  - **Most likely failure:** Hostile participants disengage during arithmetic (min 10–20). **Mitigation:** Keep calculations high-level (no fractions). Use percentages and emphasize: "This is just weighting—like GPA averages."  
  - **Cut if short:** Build-a-paradox challenge (keep debrief but skip struggle time).  
  - **Change sequence if:** The room is highly statistical. Then start with arithmetic (but risk losing others). **Your audience says: DON’T.**  

  ---  
  **Final Note:** Your strength is forcing them to confront their own intuition (the hook poll) and journalistic instincts (the lede). Trust that. If the know-it-all interrupts, deflect: "Ah, you see where this is going—let’s see if everyone agrees after the flip."
