prompt: |-
  You are a moral philosopher who works on the theory of punishment — desert, proportionality, standing, the expressive function of sanction — and also on social ontology and the metaphysics of persons over time. Work through this carefully rather than quickly, and before you settle on a view, list the candidate theories you might reach for and say what each would predict about the features I describe. No citations or reading lists are needed; reason from the structure of the practice itself.

  The practice I want you to reconstruct is one I keep running into from the inside, and I cannot get the philosophical shape of it into focus. I sat on the programme committee of a mid-sized academic society when an online campaign demanded that one of our invited speakers be disinvited for things he had written years earlier. What struck me was not the outcome but the machinery, or rather the absence of it. Nobody had to decide: there was no rule about which conduct disqualified a person, no threshold, no body with authority to rule on it, no procedure for evidence, and in particular no schedule of proportionality — the severity of the response was a function of how much attention the case attracted, not of what the person had actually done. There was also no sentence: nothing to serve, no point of completion, and reinstatement happened, if it happened at all, by the case fading from attention rather than by anything being discharged. The same pattern shows up in journals retracting papers, publishers dropping authors, employers acting on decade-old posts, festivals withdrawing invitations, and professional societies like mine — and in every one of them the participants characteristically deny that they are punishing anyone, describing what they do as withholding a platform, exercising their own speech, or holding someone accountable; yet the vocabulary they reach for is saturated with desert: consequences, should have known better, unrepentant, insufficiently sorry. Meanwhile the institutions involved usually have formal procedures with proportionality, representation and appeal, and for these cases decline to use them.

  Here is my own guess, which I want you to test rather than humour. It seems to me that what gets imposed is better described as a change of status than as a hardship: the person is moved out of the category of people we platform, and that is why our proportionality intuitions misfire and why there is no natural end point, since statuses do not expire but must be re-conferred. If that is right, the practice is a form of punishment whose participants lack the vocabulary to admit it, and it lacks every piece of apparatus — an authority, a tariff, an end date, a route back — that we normally insist on before letting anyone punish. It also seems to presuppose two things at once that I cannot reconcile: that the person who wrote the thing twenty years ago is the same person in the relevant sense, so that desert carries across the gap, and that the person can now change, since the demand for a satisfactory apology is the loudest part of the whole ritual — even though there is nobody with standing to accept an apology and no act of acceptance that would end anything. And the slogan that no one is owed a platform seems to me to cut both ways: if giving someone a platform is a morally loaded act, so is withdrawing one, and I cannot see why the first generates duties while the second generates only permissions.

  So: reconstruct the implicit theory. What view of punishment, of standing, or of what a person is does this bundle of features only make sense under? Which rival views does it quietly rule out? Be careful to separate what the practice strictly presupposes from what it merely fits well with, and tell me where it is underdetermined — where several quite different theories would license exactly this behaviour, which might explain why participants can never agree about whether a given case succeeded. If the participants were persuaded that this is punishment after all, what would have to change in the practice — publish rules, name decision-makers, hear evidence of intent, set durations, build a route back — and would making those changes destroy whatever the practice is for? Finally, tell me where my status-change diagnosis is wrong, and whether the absence of an end date is a defect of the practice or, given what it is actually doing, the only coherent option available to it.
reasoning: |-
  Hmm, the user is describing a complex social phenomenon they've observed firsthand in academic and institutional contexts. They're a moral philosopher specializing in punishment theory and social ontology, so they're approaching this with deep theoretical grounding. The core puzzle is how to understand a practice that looks like punishment but lacks all the standard apparatus: no rules, no proportionality, no authorities, no end date.

  The user provides several key observations: outcomes depend on attention rather than severity of offense; participants deny it's punishment while using desert-laden language; institutions bypass their own formal procedures; and there's a paradoxical treatment of personal identity over time (the past self is responsible but the present self must change). Their hypothesis is that this constitutes a status change rather than traditional punishment.

  I need to reconstruct the implicit theory behind this practice. Let me start by mapping candidate theories that could explain different aspects:

  First, pure desert theory fails because it requires proportionality and clear authority. Expressivist punishment doesn't fit either since participants deny they're expressing censure. Social control theories come closer but usually involve institutional structures. Status hierarchy maintenance seems relevant - the practice might be reinforcing group boundaries. Epistemic justice frameworks could view it as redistributing credibility. Social identity theory suggests it's policing in-group/out-group boundaries. And Foucault's disciplinary power explains the diffuse enforcement mechanism.

  The most coherent fit appears to be a hybrid of status hierarchy maintenance and what I'd call "liquid accountability." Key elements include: desert attaching to present status rather than past acts; the collective as the implicit authority; proportionality being irrelevant because status is binary; and identity persistence being assumed when convenient but denied when useful for demanding performance.

  This practice quietly rules out several standard views: it rejects the state monopoly on punishment, ignores retributivist proportionality, and undermines the unified self presupposed by traditional moral responsibility. The lack of end date isn't a defect but a feature - status doesn't "expire," it must be actively renegotiated.

  If participants admitted this was punishment, they'd need to implement due process elements, but that might destroy its social signaling function. The status-change diagnosis holds up well, though it might overstate the formality - this status shift operates more like reputation capital in an attention economy.

  The unresolved tension lies in personal identity: the practice demands both that the past self is continuous enough to bear responsibility AND discontinuous enough to require transformative change. This contradiction sustains the ritual's power but makes resolution impossible - hence the endless demand for performances of remorse without any authority to accept them.
answer: |-
  Your analysis is remarkably perceptive, and the phenomenon you describe is indeed coherent under specific theoretical frameworks while conflicting with others. Let's reconstruct the implicit theory step by step.

  **Candidate Theories & Their Predictions:**

  1.  **Classical Retributivism (Desert-Based Punishment):**
      *   *Predictions:* Requires strict proportionality between harm and sanction, clear authority to punish, defined sentence, and focus on past wrongdoing. Atonement/repentance may mitigate but doesn't negate desert.
      *   *Fit with Practice:* **Poor.** Explicit denial of "punishment," absence of proportionality, lack of defined authority/sentence, and the centrality of demanded repentance/apology contradict core tenets. Desert language is appropriated but stripped of retributivist structure.

  2.  **Utilitarian Deterrence/Incapacitation:**
      *   *Predictions:* Sanctions justified by future consequences (deterring others, preventing future harm). Severity calibrated to effectiveness, not desert. Focus on behavior, not moral status. End point when risk is mitigated.
      *   *Fit with Practice:* **Partial.** Preventing platforming could be seen as incapacitation. However, lack of risk assessment, focus on *past* writings (often distant), and severity tied to *attention* rather than predicted future harm weakens fit. The performative demand for apology/change isn't central to utilitarianism.

  3.  **Expressivist Punishment:**
      *   *Predictions:* Sanction's purpose is to express community condemnation/values. Severity signals strength of condemnation. Requires authority representing the community. Condemnation might have an implicit duration tied to the act's salience.
      *   *Fit with Practice:* **Better.** Explains the expressive nature ("holding accountable," signaling values), use of condemnatory language ("unrepentant"), and why severity scales with attention (salience drives expressive need). Fits the bypassing of formal procedures (expression is spontaneous/communal). Struggles with the *denial* of punishment and the lack of *any* defined community authority or clear expressive endpoint.

  4.  **Status Hierarchy Maintenance (Social Ontology Focus):**
      *   *Predictions:* Actions maintain group boundaries and status hierarchies. Exclusion is about defending the group's identity/purity. "Desert" is about fitness for status (e.g., "platform-worthy"). No proportionality needed – threat to status is binary or gradient based on perceived pollution. Reinstatement requires ritual reintegration (apology as purification). Identity persistence is assumed for liability, but change is demanded for status restoration.
      *   *Fit with Practice:* **Very Strong.** Explains the status-change core, the irrelevance of traditional proportionality (threat to group status isn't quantifiable like harm), the lack of an end date (status is ongoing), the demand for performative change/apology (purification ritual), the denial of "punishment" (framed as privilege management), and why formal procedures are avoided (status policing is often diffuse, communal, and pre-legal). "Not owed a platform" perfectly fits this: platforms confer status, status is conditional on group norms. The self-contradiction on personal identity (sameness for liability, change for restoration) is a *feature* of status rituals.

  5.  **Epistemic Justice/Standing (Focused on Credibility):**
      *   *Predictions:* Platforming confers epistemic standing/credibility. Past acts (or current "unrepentance") destroy credibility or signal bad epistemic character, making one unfit to contribute. Withholding platform protects discourse. Severity tied to perceived epistemic harm. Reinstatement requires demonstrated epistemic rehabilitation.
      *   *Fit with Practice:* **Good.** Explains "withholding platform," focus on writings/speech, the vocabulary ("consequences" for discourse), and the demand for changed stance/apology. Fits the academic context well. Less clear on why severity scales with attention or why formal procedures are avoided. Doesn't fully capture the intense moralized "desert" language beyond epistemic fitness.

  6.  **Foucauldian Disciplinary Power:**
      *   *Predictions:* Diffuse, non-centralized power enforces norms through constant surveillance, normalization, and exclusion. "Punishment" is continuous, aim is conformity. Formal procedures are bypassed as inefficient. Demands for confession/change are central.
      *   *Fit with Practice:* **Strong.** Explains the absence of central authority or procedure, the role of public scrutiny/campaigns ("surveillance"), the focus on demanding internal change ("normalization"), the lack of endpoint (disciplinary power is continuous), and the denial of traditional punishment language. Fits the networked, online nature of campaigns. Less emphasis on explicit "desert."

  **The Implicit Theory: A Hybrid of Status Maintenance & Expressive Discipline**

  The practice is best understood as **Status Hierarchy Maintenance through Diffused Expressive Discipline**, incorporating elements of Social Ontology and Foucauldian analysis.

  1.  **Core Function:** Maintaining the perceived purity, safety, and normative boundaries of the relevant community (academic field, profession, publisher's brand, festival's ethos) by regulating who holds the status of "platform-worthy."
  2.  **Mechanism:** Diffused, communal exercise of power (often via online mobilization) applying expressive condemnation to trigger institutional exclusion. The *act* triggering exclusion is a **signal of status-incompatibility**, not necessarily a discrete harm demanding proportional retribution.
  3.  **"Desert":** Desert attaches to *current fitness for status*, not primarily to the past act itself. The past act is evidence of *current* unfitness unless purged by sufficient performative change (apology, demonstrated growth). Hence, "desert" arguments focus on "should have known better" (implying current defect) and "unrepentant" (confirming current unfitness).
  4.  **Proportionality Absence:** Proportionality is irrelevant because the sanction is a binary (or tiered) status adjustment – "platform-worthy" vs. "not-platform-worthy." The *severity of the reaction* scales with the *perceived threat to the community's status/identity* or the *intensity of the expressive need* to condemn, driven by mobilized attention. A minor act attracting massive attention signals a major threat to group norms or identity.
  5.  **Standing & Authority:** Authority is claimed by the *collective* ("the community," "marginalized groups," "public opinion") acting through mobilized pressure. Institutions are conduits, not independent judges. No single entity has "standing" to accept an apology definitively because the sanction is imposed by a diffuse entity. The apology is a performance directed at the amorphous collective to signal renewed fitness for status.
  6.  **Temporal Identity Paradox:** The practice presupposes **continuity of moral agency** sufficient for responsibility for the past act (rejecting radical discontinuity). Simultaneously, it demands **demonstrable discontinuity** (change, growth, repudiation) to restore status. The apology ritual is the bridge between these: acknowledging the continuous self's responsibility while performing the changed self's rejection of it. There's no contradiction here for status maintenance; the past act defines current status *unless* convincingly disavowed by the present self.
  7.  **No End Date:** This is **coherent and necessary** under the status model. Status doesn't "expire"; it persists until actively changed. Reinstatement isn't the end of a sentence but a new conferral of status, contingent on the community's (diffuse) acceptance of the performance of change and/or the fading of the act's salience as a status-marker. Fading attention lowers the perceived threat, making reinstatement (often tacit) less risky for the institution.
  8.  **"Not Owed a Platform":** This slogan highlights the status-conferring nature of platforms. Under this implicit theory, *granting* a platform to someone deemed status-incompatible is an act of pollution or endorsement that violates a (diffuse) duty to protect the community. *Withdrawing* it is framed as merely exercising permission to protect the community/standards, not as inflicting punishment. The moral load asymmetry arises because protection is seen as primary, while exclusion is its neutral consequence.

  **What It Rules Out:**
  *   **Formal Legalistic Punishment Models:** It explicitly rejects state monopoly, due process, proportionality, fixed sentences, and centralized authority.
  *   **Pure Retributivism:** Desert is instrumentalized for status control, not an end in itself; proportionality is absent.
  *   **Strict Utilitarianism:** Future harm prevention is secondary to expressive condemnation and boundary maintenance; risk assessment is crude or absent.
  *   **Radical Discontinuity Theories of Personal Identity:** Responsibility for the past act is assumed.

  **Underdetermined Aspects & Participant Disagreement:**
  *   **The Nature of the "Community":** Who defines its boundaries and norms? Is it the profession, the public, a specific identity group, or an online mob? Different participants assume different answers.
  *   **The Threshold for Status Incompatibility:** What level or type of past act (or current stance) triggers exclusion? Is it harm, offense, deviation from current norms, or simple controversy? This is inherently vague and contested.
  *   **What Constitutes Sufficient "Change":** The criteria for a satisfactory apology or demonstration of growth are undefined and subjective. This is why cases rarely "succeed" definitively – the performance is never enough for some parts of the diffuse audience.
  *   **The Primary Justification:** Is it preventing harm, promoting epistemic justice, expressing solidarity, or maintaining prestige? Participants may emphasize different elements.

  **If Acknowledged as Punishment: Required Changes & Consequences:**
  Acknowledging it *as punishment* would necessitate:
  1.  **Published Rules:** Defining prohibited conduct and thresholds.
  2.  **Designated Authority:** A body with clear jurisdiction and standing.
  3.  **Due Process:** Evidence gathering, right to be heard, consideration of intent/context/mitigation.
  4.  **Proportionality Framework:** Linking sanction severity to offense gravity.
  5.  **Defined Sanctions & Durations:** Clear endpoints and pathways for rehabilitation/reinstatement.
  6.  **Appeal Mechanism.**

  **Consequences of Formalization:**
  *   **Destruction of Core Function?** Very likely. Formalism would cripple the speed, flexibility, and expressive responsiveness valued by proponents. It would shift focus from communal status-policing to individual rights and process, undermining the diffused power dynamic. The demand for performative change would be bureaucratized or sidelined.
  *   **Mitigation of Harms?** It would likely reduce arbitrariness, mob-driven severity, and perpetual exclusion, offering clearer recourse for the accused.
  *   **Loss of Efficacy?** Proponents would argue it prevents necessary swift action to "protect" communities from perceived threats, making institutions sluggish and unresponsive to community sentiment (as defined by mobilizations).

  **Your Status-Change Diagnosis: Strengths and Refinements**
  You are fundamentally correct. The shift from "platform-worthy" to "not-platform-worthy" is the core sanction. This brilliantly explains:
  *   Why proportionality intuitions fail (status is binary/gradient, not quantifiable like harm).
  *   Why there's no natural endpoint (status persists).
  *   Why hardship is secondary (exclusion *is* the status demotion; hardship is a consequence).
  *   The "not owed a platform" asymmetry (duty to protect status hierarchy vs. permission to manage it).

  **Where it needs refinement:**
  1.  **It's not merely passive "fading":** Reinstatement often requires active, performative *work* by the individual (apology, demonstrable change) to signal renewed fitness. The status change isn't just withdrawn; it must be actively overcome, though success depends on the diffuse audience's acceptance.
  2.  **"Change of Status" understates the expressive violence:** The process involves intense public condemnation, reputational damage, and social shaming, which *are* experienced as hardships and punishments, regardless of the official framing. The status change is achieved *through* expressive discipline.
  3.  **The role of attention is constitutive, not incidental:** Under this model, attention *creates* the status threat. An act unknown poses no threat. High attention signifies high threat to the community's identity/norms, justifying a stronger status-demotion signal (withdrawal from a prestigious platform vs. a minor one, multiple withdrawals). Attention is the fuel of the diffused authority.

  **Conclusion:**
  The practice makes the most sense under a view that sees social groups as constantly negotiating and enforcing their boundaries and internal status hierarchies through diffused, expressive means. Punishment, in the traditional sense, is rejected not just semantically, but because the underlying logic is fundamentally different: it's about regulating membership and standing within a valued community based on perceived fitness, signaled by past conduct and current performative stance, enforced by mobilized attention. The absence of an end date is not a defect but the only coherent option within this logic – status is an ongoing condition, not a temporal penalty. The central tension for participants is reconciling their use of moralized "desert" language with a practice structurally designed for boundary policing, not individual justice. This inherent conflict ensures the practice remains volatile, contested, and resistant to formalization.
