  Betting the speech on: The idea that death neutralizes ongoing moral accounting. Why? It's the only ground where the front-row vets (who understand sacrifice) and the families (who want recognition) can stand together. It doesn't require agreeing on history—just acknowledging that a life was given, and that matters.

