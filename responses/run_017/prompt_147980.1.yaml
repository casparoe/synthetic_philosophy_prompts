prompt: |-
  i run a small podcast — mostly me and a mate talking about weird science things — and next week we've got a philosopher on who's written a book arguing that after split-brain surgery (cutting the corpus callosum, the bundle of fibres between the two halves of the brain) you really do end up with two conscious subjects in one skull, not one person with an odd information bottleneck. She extends it too: the reason the rest of us feel like a single 'I', she says, is that the left half of the brain is constantly stitching together a story about what 'we' are up to, and in split-brain patients you can catch it confabulating in real time when the right half starts something and the left half has to invent a reason for it.

  Can you draft me six or seven questions that don't just let her restate the view? I want at least one on: adults who've had an entire hemisphere removed and seem to carry on as perfectly ordinary single people — if one half alone can be a whole subject, why does merely disconnecting the halves give you two; the fibre-by-fibre version, where you imagine cutting the callosum one fibre at a time and ask at what point the number of subjects changes, and whether she thinks there's a sharp answer or whether the number is just vague or empty; and whether 'how many subjects are in there?' is a real question with a discoverable answer at all, or something we've decided to care about. Give me one follow-up per question, pitched at the reply she's most likely to give.

  Also, please commit rather than hedging: tell me which single question you'd open the episode with and which one you think she'll most likely wriggle out of, and say why. I'd rather have your pick than a menu of equally good options.
