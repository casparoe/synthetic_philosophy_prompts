  Identifying which question she might wriggle out of: the ontological question is abstract, so she might retreat to conceptual relativism. The follow-up here needs to corner her into taking a stance on whether consciousness subjects are real entities.

  I need to ensure each question is precise, avoids yes/no, and forces her to elaborate. The follow-ups should be prepared for her likely evasions, like appealing to brain plasticity or narrative construction without addressing the deeper issue.

