prompt: |-
  I teach a graduate seminar on personal identity, and one of my doctoral students has produced an argument that I have been unable to fault and whose conclusion I cannot accept. I set it out below, in my own reconstruction, together with two cases of my own that I have been using as tests. I would be grateful for a diagnosis.

  The set-up is Parfit's, from *Reasons and Persons*: the teletransporter scans my cerebral state, destroys my body on Earth, and reassembles a replica on Mars from local matter. In the Branch Line variant the scanner works, the replica is created, and my terrestrial body is *not* destroyed: I walk out of the booth in Oxford and go on with my life, while someone psychologically continuous and strongly connected with me as I was at the moment of scanning, produced by the right kind of cause, wakes on Mars and goes on with a life of equal quality. Call the underlying relation *R*. Because *R* now holds one-to-many, neither successor is identical with me. The reductionist's claim is that in such a case nothing important is lost: what matters in survival is preserved, and the absence of identity detracts nothing.

  My student's argument:

  (1) Reductionism: what personal identity over time consists in is the holding of *R* in its non-branching form; there is no further fact of identity over and above facts about brains, bodies and psychological continuity.

  (2) Identity is not what matters: what matters in survival is simply the holding of *R*, with any cause, together with the continuation of conscious life.

  (3) So in the Branch Line case what matters is fully preserved on both branches, and, by (2), the failure of identity costs nothing.

  (4) The received verdict — Parfit's, as I read him; and if I misread him, then treat this as a claim my student thinks any reductionist is committed to — is that division is *as good as* ordinary survival: not worse, but emphatically not better.

  (5) Yet the Branch Line case contains twice as much of what matters as ordinary survival does. Ordinary survival yields one life continuing my mental life; division yields two lives, each as fully related to me as the single survivor would have been, with no overlap between them, no competition for the same experiences, and equal quality.

  (6) Additivity: other things being equal, more of a good is better than less of it — more precisely, if one state of affairs contains all the good-making features of a second and, in addition, a further complete instance of just those features, then the first is better than the second.

  (7) Therefore division is twice as good as ordinary survival, and division into a thousand successors a thousand times as good.

  (8) If (7) is true, then each of us has overwhelming reason to be divided, and to be divided as often as possible. Division is a form of life-extension incomparably cheaper and more reliable than any medicine: press the button and what matters in survival is multiplied. By contrast, ordinary survival squanders an opportunity, and a reductionist who accepts (7) and declines to press the button is, by his own lights, being irrational.

  (9) That is absurd. No reductionist I know recommends routine mass fission, and the judgement that division is merely as good as survival strikes me as a fixed point that no account of what matters should be allowed to overturn.

  (10) My student's sting: the only way to block the argument at (5)–(7) is to say that the two successors are not both *me*, that their claims compete, that one life cannot be lived twice over by two people — and that is to say that identity does matter after all, contrary to (2). So the reductionist package is self-refuting: it either collapses back into the non-reductionist view it was meant to replace, or it hands us a recommendation that nobody, including its own defenders, will take seriously.

  Two cases I use to test any diagnosis.

  *The Unequal Division.* The scanner's output is split: one successor receives the full cerebral structure and lives a life of the same quality mine would have had; the other receives a degraded copy and lives a bare, impoverished, though not miserable, mental life for the same span. Is the outcome as good as ordinary survival, better, or worse? And does the answer depend on the sum, the average, or the best of the two lives? Whatever your account says here, I want to know why it says it.

  *The Iterated Division.* Each successor is divided again at the end of every day for a month, yielding something of the order of a billion people at the close, each with a life of the quality mine would have had, each as fully related to me as any single survivor would have been. Does the outcome contain a billion times as much of what matters? If not, what caps it, and is that cap anything other than the identity thought in (10)?

  What I want from you is a verdict, not a survey. Tell me which step you reject — or, if you think the argument is valid and one of the premises must go, which one — and give me your reasons. Price the alternatives honestly: I should say that I am attached to (1), (2) and (9), and that I would much sooner give up (5) or (6); but I also hold, in population ethics, that a world containing more well-being is better than one containing less, other things equal, and I suspect that whichever of those two I surrender will cost me at least part of that. The usual reassurances — that the successors share a past, or that I survive as both — have not helped me, since they strike me as restatements of the difficulty rather than solutions. So: where does the argument break, what does the repair cost, and how confident are you, and what would it take to change your mind?

  Please write in British English.
reasoning: |-
  Hmm, this is a fascinating philosophical puzzle about personal identity and what matters in survival. The professor presents a student's argument that seems to show reductionism leads to absurd conclusions about the value of division through teletransportation. Let me unpack this carefully.

  The core tension seems to be between:
  - The reductionist view that identity doesn't matter, only R-relations (psychological continuity) do
  - The intuition that multiplying identical successors shouldn't make survival "better"

  The student's argument cleverly shows that if we accept:
  - Additivity of what matters (more R-related lives = more good)
  - The Branch Line case preserves full value on both branches

  ...then division becomes infinitely preferable to ordinary survival - which feels absurd. The professor's test cases (Unequal Division and Iterated Division) really sharpen the problem.

  I think the flaw is in step (5) - the claim that two successors contain "twice as much" of what matters. What's missing here is the perspectival nature of survival value. From my first-person perspective, what matters isn't quantity of R-related beings, but whether there will be a being whose experiences I can anticipate as mine. In division, this first-personal connection is necessarily fragmented.

  The Unequal Division case reveals this: if one successor is impoverished, that doesn't make the outcome "better on average" - I'd reasonably prefer the single good life. The Iterated Division shows the absurdity of pure additivity - a billion copies don't give me a billion times the survival value.

  So I'm rejecting (5) and (6) as formulated. The repair costs some nuance: we must distinguish between the impersonal value of creating more good lives (which might increase total welfare) and the egocentric concern for survival (which isn't additive). This preserves reductionism while blocking the absurd conclusion.

  The professor's population ethics intuition about total welfare can be maintained separately from what matters in survival. Pressing the button might create more wellbeing impersonally considered, but doesn't serve my survival interests better. The student's sting fails because identity isn't being reintroduced - we're just clarifying the nature of "what matters."
answer: |-
  Right, let's crack this. I reject step (5) – the claim that the Branch Line case contains "twice as much of what matters" – and the specific interpretation of "what matters" implied in step (6)'s additivity principle. The argument breaks here. Here's my diagnosis, the cost of the repair, and how it handles your cases.

  **The Rejection: Step (5) Misunderstands "What Matters"**

  1.  **The Core Error:** The student conflates the *impersonal good* of creating additional valuable conscious life with the *egocentric concern for survival*. What matters *in survival*, from the perspective of the person facing the teleporter, is fundamentally egocentric: it's the question "Will *my* conscious experience continue? Will *there be someone* who is experientially continuous with *me now*, who will inherit *my* projects, fears, hopes, and perspective?" Reductionism correctly says this egocentric concern is satisfied by the holding of R (with the right cause), not by identity *per se*.
  2.  **Why Branch Line Doesn't Double "What Matters (for Survival)":** In ordinary survival, R holds uniquely. My egocentric concern is satisfied: there will be one future being whose experiences I can anticipate *as mine* (in the sense of being the continuation of *this* stream). In Branch Line, R holds doubly. Crucially, *neither* future being bears the unique relation to me-now that would allow me-now to anticipate *both* of their futures *as mine* in an unproblematic way. Each successor will have a distinct, non-overlapping experiential stream *from the moment of fission onwards*.
      *   From my perspective *before* fission, I know *an* R-related successor will exist on Mars, and *an* R-related successor will exist on Earth. My egocentric concern for the continuation of *a* perspective like mine is satisfied twice over in the sense that two such perspectives exist.
      *   However, crucially, **I cannot anticipate experiencing *both* futures.** I cannot look forward to experiencing the Martian sunset *and* the Oxford rain simultaneously *as the subject of both*. The fission creates two distinct centres of experience, each inheriting the past but facing mutually exclusive futures. The *egocentric survival concern* is satisfied (there *will be* a continuation of *my* perspective), but it is satisfied in a way that fragments the future experiential trajectory. I get *a* future, but not *a single, unified future*.
  3.  **The Cost of the Repair:** This interpretation requires refining the reductionist claim about "what matters." We must distinguish:
      *   **What matters *in survival* (egocentric concern):** The holding of R (with the right cause), ensuring that *there will be* one or more future beings whose conscious lives are the continuation of *this* mental life/perspective. This *is* preserved in Branch Line and is the core of the "not worse than survival" verdict. It *is* preserved multiple times in multiple fission. However, satisfaction of this egocentric concern does *not* automatically equate to a proportionate increase in *value from the pre-fission perspective*, because it fragments the future locus of experience.
      *   **The impersonal good:** The creation of additional valuable conscious life, especially life richly connected to a valuable past. Branch Line *does* create an additional instance of this impersonal good compared to ordinary survival. *This* is the source of any intuition that fission might be "better" in some impersonal sense. But this impersonal good is distinct from the core egocentric survival concern addressed by reductionism.

  **Why Step (6) (Additivity) is Misapplied:**

  1.  Additivity applies straightforwardly to impersonal goods: more happy people, *ceteris paribus*, is better. It *might* apply to the mere satisfaction of the egocentric concern *that there be some continuation* (i.e., fission guarantees *a* continuation more robustly than ordinary survival, which is vulnerable to a single point of failure). However, step (6) as used in (5) and (7) assumes additivity applies directly to the *core experiential value of survival itself* ("more of what matters"). This is the mistake.
  2.  The core experiential value of survival isn't about the *number* of R-related successors *per se*. It's about the *assurance* that *my* perspective continues *somewhere*. Fission provides more *assurance* (redundancy) but fragments the *future unity* of the perspective. While fission satisfies the "will there be a continuation?" question emphatically "yes," it does not multiply the *first-personal anticipation of future experience* in the way step (5) suggests. Anticipating *a* future experience as mine is fundamentally different from anticipating two incompatible futures neither of which I will experience as a unified subject.

  **Handling Your Test Cases:**

  1.  **The Unequal Division:**
      *   **Egocentric Survival Concern:** Satisfied. There *will be* continuations of my mental life. However, the outcome is *worse* than ordinary survival *for me-now* contemplating it. Why? Because one of the futures that holds what matters (the continuation) is impoverished. While I know *a* successor will have a good life, I also know that *a* successor (equally R-related to me-now) will have a bad one. I have reason to prefer the scenario where the *only* continuation has the good life (ordinary survival) over one where *a* continuation suffers the bad life, even though both satisfy the basic survival concern. The impersonal good is also likely less than in ordinary survival (a good life + a poor life might sum to less than one good life, depending on metrics, but almost certainly averages less).
      *   **Verdict:** Worse than ordinary survival. The answer depends on the *quality of the lives sustained by the R-relations*, particularly the worst-off continuation relevant to my egocentric concern, and the total/average impersonal good. Identity isn't needed; the evaluation flows from the quality of the futures guaranteed by the R-relations.
  2.  **The Iterated Division:**
      *   **Egocentric Survival Concern:** Satisfied a billion times over. There is immense *assurance* that *a* continuation of my perspective will exist.
      *   **"Does it contain a billion times as much of what matters (in survival)?"** No. The core egocentric concern – "Will *my* perspective continue?" – is answered "yes" with near certainty, but it's not answered *a billion times more "yes"* than in ordinary survival. The value *to me-now* isn't multiplied by a billion. The fragmentation is extreme. While I might take comfort in the extreme redundancy ensuring *a* continuation, I cannot anticipate experiencing a billion distinct daily lives. The impersonal good, however, *is* vastly greater – a billion good lives connected to a valuable past is an immense impersonal good.
      *   **What caps the egocentric survival value?** The cap comes from the nature of the egocentric concern itself. Its satisfaction peaks when I have reasonable assurance that *a* good continuation of my perspective will exist. Extreme redundancy increases assurance beyond doubt, but doesn't add a new *kind* of value *to me-now* beyond that peak assurance. The fragmentation prevents any additive increase in the *first-personal experiential anticipation*. The cap is provided by the *uniqueness of my present perspective* and the *mutual exclusivity of future experiences* for the successors, not by identity. Identity is irrelevant; even if I *were* identical to all billion (which I'm not), the problem of anticipating a billion mutually exclusive futures would persist.

  **Addressing the Student's Sting (Step 10):**

  The sting fails. Blocking (5)/(6) does *not* require saying the successors aren't both R-related to me, that their claims compete in a way that undermines the survival value for *each branch*, or that identity matters. We say:

  1.  **R holds for both:** Both successors are fully R-related to the pre-fission person. What matters *in survival* (the assurance of continuation) is present for both branches *from the perspective of the pre-fission person*.
  2.  **No competition for the "survival slot":** The pre-fission person's survival concern *is* satisfied by the existence of both. There is no single "slot" for which they compete. The issue isn't competition; it's fragmentation.
  3.  **Identity isn't reintroduced:** We haven't appealed to identity. We've appealed to the *egocentric, first-personal nature of the survival concern* and the *mutual exclusivity of future experiences* for the successors. This is entirely analysable in terms of psychological continuity (R) and the physical realization of distinct streams of consciousness. Reductionism survives. The reductionist package is not self-refuting; it just requires a careful, non-additive account of the egocentric "what matters."

  **Your Costs and Commitments:**

  *   **You keep (1) & (2):** Reductionism and the claim that identity isn't what matters stand. What matters is R (with cause) ensuring the continuation of conscious life.
  *   **You keep (9):** The judgement that division is merely *as good as* survival (in satisfying the core egocentric concern) is preserved. The absurd recommendation for mass fission as *better survival* is blocked. Fission might be recommended for *other* reasons (impersonal good, redundancy), but not because it multiplies the core value of survival *for the pre-fission individual*.
  *   **You give up the *specific interpretation* of (5) & (6):** You cannot say fission contains "more of what matters *in the core egocentric sense*" additively. You distinguish the satisfaction of the survival concern from impersonal goods and from notions of additive value applied crudely to the survival relation itself.
  *   **Cost to Population Ethics?** Minimal. You can still hold that "a world containing more well-being is better, other things equal." The Iterated Division *does* create vastly more impersonal well-being. You just can't equate that impersonal good directly with an increase in the *egocentric survival value for the pre-fission person*. The two types of value are distinct. Your population ethics intuition applies to the *impersonal* good created, not to the multiplication of the *first-personal survival concern*.

  **Confidence & What Would Change My Mind:**

  I'm reasonably confident (philosophy being what it is!). The distinction between egocentric survival concern and impersonal good feels fundamental and resolves the paradox without collapsing reductionism or embracing absurdity. It cleanly handles your test cases.

  What would change my mind? A compelling argument showing that the egocentric survival concern *must* be understood as intrinsically additive across distinct future beings, such that anticipating *a* future experience as mine is *necessarily* less valuable than anticipating two. Or, an argument that the mutual exclusivity of experiences is irrelevant to the pre-fission valuation of survival. Or, a demonstration that the fragmentation I appeal to covertly relies on identity after all (though I don't see how it does – it relies on the physical and psychological realization of distinct streams). Finally, if Parfit *explicitly* endorsed the additive interpretation of "what matters" in fission, that would be a significant challenge, though I think my reading of him as rejecting additivity (hence the "as good as, not better" verdict) is correct.

  The repair costs a nuanced distinction between types of value, but it saves the core reductionist insights and aligns with our strongest intuitions about Branch Line and your cases. The student’s argument is clever, but it overreaches by misapplying the concept of "what matters."
