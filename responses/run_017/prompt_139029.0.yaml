answer: |-
  Here is a villanelle embodying the transmission of a folk recipe, where the refrains drift according to the contrasting evolutionary forces:

  **Stone Soup**

  The traveler shared the secret he was taught:
  *A stone in the pot makes the hunger forgot.*
  *Three days without eating, a meal must be caught.*

  He scraped the pot clean where the stew had been brought,
  Stirred river water cold as a thought.
  The traveler shared the secret he was taught:

  *Three days gone hungry, a meal must be wrought,*
  A stone in the broth makes the craving distraught?
  *Three days without eating, a meal must be caught.*

  The farmer recalled the tale the stranger wrought,
  Added a carrot, the lesson not lost.
  The traveler shared the secret he was taught:

  *Three days unfed, a meal must be sought,*
  *A stone in the pot makes the hunger forestall.*
  *Three days without eating, a meal must be caught.*

  The soldier, starved, rebuilt it in thought –
  Beans from his ration, no stranger in sight.
  The traveler’s secret, half-remembered, distraught:

  *A stone makes the hunger forestall – or not?*
  *Three days unfed, a meal must be caught.*

  ---

  **How it works:**

  1.  **The Concrete Item:** The folk recipe/saying for "Stone Soup" – a narrative about creating a communal meal from seemingly nothing (a stone), to which others contribute ingredients. Its transmission involves both verbatim instructions ("a stone in the pot") and the core narrative structure/idea ("desperation leads to communal creation"). Its replicator status is contested: selectionists might see the core instruction as a replicator; attractionists see constant reconstruction of the *meaning* and *narrative* based on context and cognition.
  2.  **Refrain 1 (Selectionist Drift - "A stone in the pot..."):**
      *   Line 1: *A stone in the pot makes the hunger forgot.* (Original)
      *   Line 6: *A stone in the pot makes the hunger forgot.* (Identical - high fidelity)
      *   Line 12: *A stone in the broth makes the craving distraught?* (Minor error: "broth" for "pot"; synonym substitution "distraught" for "forgot" - plausible independent mutation; questioning tone emerges randomly)
      *   Line 15: *A stone in the pot makes the hunger forestall.* (Another synonym substitution: "forestall" for "forgot" - different from previous substitution; core structure intact)
      *   Line 19: *A stone makes the hunger forestall – or not?* (Loss of prepositional phrase "in the pot"; retains "forestall" from previous; final questioning solidified. Drift is small, stepwise, non-directional.)
  3.  **Refrain 2 (Attractor Drift - "Three days without eating..."):**
      *   Line 3: *Three days without eating, a meal must be caught.* (Original - passive state, "caught" implies hunting/gathering)
      *   Line 8: *Three days gone hungry, a meal must be wrought.* (Shift to active state "gone hungry"; "wrought" replaces "caught" - implies creation/manipulation, more effortful/memorable than passive "without eating".)
      *   Line 13: *Three days unfed, a meal must be sought.* ("Unfed" is more vivid/archaic than "without eating" or "gone hungry"; "sought" replaces "wrought" - implies active searching, resonates with desperation/quest narrative.)
      *   Line 17: *Three days unfed, a meal must be caught.* (Retains "unfed" (sticky/memorable); reverts to "caught" (perhaps easier/more common than "wrought" or "sought"?). Shows convergence back towards original phrasing but via a different path.)
      *   Line 19: *Three days unfed, a meal must be caught.* (Identical to line 17 - stabilized on "unfed" and "caught", the most striking/vivid combination achieved through repeated reconstruction.)
  4.  **The Final Quatrain (Collapse):**
      *   Lines 18-19 present the fully drifted refrains:
          *   *A stone makes the hunger forestall – or not?* (Selectionist refrain - simplified, mutated, questioning)
          *   *Three days unfed, a meal must be caught.* (Attractor refrain - stabilized on vivid phrasing)
      *   **The Ambiguity:** Are these two versions of the *same* core instruction about using a stone? Or has the selectionist refrain drifted so far (losing the pot, changing the verb meaning, becoming skeptical) that it now represents a fundamentally different *idea* – perhaps skepticism about the stone's power or a different survival strategy – which merely *resembles* the attractor-stabilized proverb about hunger leading to action? The core elements ("stone", "hunger", "action verb") remain shared, but their relationship and meaning have diverged significantly in one strand. Is it one replicator with mutations, or two distinct cultural items sharing a common ancestor? The poem leaves it unresolved.
  5.  **Meeting the Criteria:**
      *   **Contested Item:** Stone Soup proverb/recipe is perfect – simple core, constantly reconstructed in telling, debated as meme vs. attractor.
      *   **Distinguishable Drift:** Refrain 1 shows small, unsystematic substitutions/losses (pot->broth, forgot->distraught->forestall, loss of "in the pot"). Refrain 2 shows directed shifts towards more vivid/active language (without eating->gone hungry->unfed; caught->wrought->sought->caught), converging on "unfed/caught".
      *   **Collapse in Final Stanza:** The drifted refrains share components but feel like they *could* be describing different core concepts (using a stone vs. reacting to hunger), making it hard to definitively say if they are variants of one meme or distinct memes.
      *   **Works for Both Audiences:** Knowledgeable readers see the drift mechanics and the final ambiguity reflecting the theoretical debate. Unfamiliar readers experience a poem about a mutable story passed down, changing subtly or vividly, ending with an unresolved echo. The core narrative of transmission ("traveler shared," "farmer recalled," "soldier rebuilt") provides the necessary scaffolding.
