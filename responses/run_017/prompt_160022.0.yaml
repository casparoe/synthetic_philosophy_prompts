answer: |-
  Here’s a case-based decision tree that branches solely on intuitions about specific scenarios, mapping onto functionalist positions without naming them upfront. Positions emerge at the leaves based on **consistent patterns of answers**.  

  ### Core Starting Commitment (Shared by All):  
  *A mental state is defined by its causal role (inputs, outputs, other mental states), and this role is always played by some physical state of the organism.*  

  ---

  ### Decision Tree Questions (Branch on Cases):  
  1. **Martian Pain**: A Martian has a hydraulic mechanism that causes pain behavior (flinching, avoidance) in response to damage, just like human pain. *Is this the same mental state (pain) as in humans?*  
     - **Yes** → Branch to Q2  
     - **No** → *Type Identity* (Mental states = specific physical types; Martians can’t share ours)  

  2. **Silicon Neuron**: Your brain has one neuron replaced with a silicon chip that performs the *exact same local causal role* (same inputs/outputs to neighboring neurons). *Do you still have the same mental states?*  
     - **Yes** → Branch to Q3  
     - **No** → *Token Identity* (Mental states = specific physical tokens; changing matter changes the state)  

  3. **Same Stuff, Different Wiring**: Two creatures are made of identical biological components in identical quantities, but their internal wiring differs, causing different causal roles for their states. *Could they share any mental state?*  
     - **Yes** → Branch to Q4  
     - **No** → *Narrow Mental Kinds* (Mental states are hyper-specific to fine-grained biology; anti-functionalist)  

  4. **Role Reversal**: Your brain state plays the "pain role" in you, but the *identical* brain state plays a "desire role" in a twin with a different learning history. *Is this state the same mental state in both twins?*  
     - **Yes** → *Realizer Functionalism* (Mental states = physical states; roles don’t define identity)  
     - **No** → Branch to Q5  

  5. **Overlapping Roles**: A creature has a state that plays *both* the typical causal role of pain *and* the role of believing "something is wrong." *Is this one mental state or two?*  
     - **One state** → *Coarse-Grained Role Functionalism* (Roles individuate loosely; states can be multifunctional)  
     - **Two states** → Branch to Q6  

  6. **Same Internals, Different Surroundings**: Two systems have identical internal organization and processing, but one evolved in a desert, the other in an ocean. *Could their mental states (e.g., beliefs) differ in content?*  
     - **Yes** → Branch to Q7  
     - **No** → *Analytic Functionalism* (Narrow content; mental states defined by internal roles alone)  

  7. **Unfound Reduction**: A mental state (e.g., thirst) has no known neural reduction, but no law of physics rules it out. *Must it still be reducible to some physical state?*  
     - **Yes, necessarily** → Branch to Q8  
     - **No** → *Machine/Psychofunctionalism* (Roles are empirical; irreducible if science says so)  

  8. **Levels of Realization**: Pain is realized by different *neural states* in humans and octopuses, but these neural states are built from identical fundamental particles. *Is pain multiply realizable?*  
     - **Yes, at neural level** → *Role Functionalism* (Mental states = roles; realizers can vary)  
     - **Only if fundamental physics differs** → *Local Reductions* (Reducible at each "level" e.g., neural)  
     - **No, not truly multiply realizable** → *Epistemic Multiple Realizability* (Differences are practical ignorance, not metaphysical)  

  ---

  ### Leaves (Positions) & Combinations:  
  | **Leaf Position**                          | **Path** (Answers to Q1–8)                                                                 |  
  |--------------------------------------------|--------------------------------------------------------------------------------------------|  
  | **Type Identity**                          | Q1: No                                                                                     |  
  | **Token Identity**                         | Q1: Yes → Q2: No                                                                           |  
  | **Narrow Mental Kinds**                    | Q1: Yes → Q2: Yes → Q3: No                                                                 |  
  | **Realizer Functionalism**                 | Q1: Yes → Q2: Yes → Q3: Yes → Q4: Yes                                                      |  
  | **Coarse-Grained Role Functionalism**      | Q1: Yes → Q2: Yes → Q3: Yes → Q4: No → Q5: One state                                       |  
  | **Analytic Functionalism**                 | Q1: Yes → Q2: Yes → Q3: Yes → Q4: No → Q5: Two states → Q6: No                             |  
  | **Machine/Psychofunctionalism**            | Q1: Yes → Q2: Yes → Q3: Yes → Q4: No → Q5: Two states → Q6: Yes → Q7: No                   |  
  | **Role Functionalism**                     | Q1: Yes → Q2: Yes → Q3: Yes → Q4: No → Q5: Two states → Q6: Yes → Q7: Yes → Q8: Neural     |  
  | **Local Reductions**                       | Q1: Yes → Q2: Yes → Q3: Yes → Q4: No → Q5: Two states → Q6: Yes → Q7: Yes → Q8: Fundamental|  
  | **Epistemic Multiple Realizability**       | Q1: Yes → Q2: Yes → Q3: Yes → Q4: No → Q5: Two states → Q6: Yes → Q7: Yes → Q8: No         |  

  ---

  ### Key Notes:  
  1. **Empty/Incoherent Paths**:  
     - `Q1: Yes → Q2: No` (Token Identity) + `Q3: No` is **incoherent**. If mental states depend on token matter (Q2), wiring differences (Q3) can’t further restrict kinds.  
     - `Q4: Yes` (Realizer Functionalism) + `Q5: One state` is **unattractive**. Realizer-focused views struggle with state individuation if one physical state plays multiple roles.  

  2. **Indistinguishable Leaves** (Collapse Scenarios):  
     - **Role vs. Realizer Functionalism** collapses if roles are specified *maximally finely* (e.g., including microscopic details). The tree avoids this by using coarse-grained roles in cases (Q2, Q5) and forcing a choice in Q4/Q8.  
     - **Analytic vs. Machine Functionalism** blurs if you reject "wide content" (Q6). The tree separates them via Q7 (reducibility).  

  3. **Unoccupied Paths**:  
     - `Q1: No` (Type Identity) + any further "Yes" to variation (e.g., Q2) is **unattractive**. Type identity denies multiple realizability outright.  
     - `Q8: Only if fundamental physics differs` (Local Reductions) is rare—most reductionists accept neural-level multiple realizability.  

  4. **Anti-Functionalist Path**:  
     - **Narrow Mental Kinds** (Q3: No) is the anti-functionalist leaf. It accepts the core commitment but rejects functional variation.  

  ---

  ### How to Use:  
  - **Start at Q1**, answer based on intuition about the case.  
  - **Follow the path** to discover your position.  
  - **Debate points**: Where do paths diverge? Why might someone answer differently at key nodes (e.g., Q4 challenges realizer-focused views)?  

  This forces engagement with cases while revealing theoretical commitments implicitly. The tree covers your requested positions and highlights fault lines (e.g., role individuation in Q5, reductionism in Q7).
