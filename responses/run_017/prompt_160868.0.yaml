prompt: |-
  hey! I'm doing a course on classical Indian epistemology this term (my first real go at anything outside the analytic canon) and the bit that's definately not clicking for me is the pramāṇa literature. Every week the seminar seems to be working with a different number of them: the Nyāya four — perception, inference, analogy or comparison (the wild-cow sort of case: you're told a gavaya is like a domestic cow, later you see one in the forest and recognise it), and verbal testimony; the Buddhist logicians who cut the whole thing down to just perception and inference; the Mīmāṃsā and Vedānta people who keep letting more in — postulation (the fellow is fat but never eats in the daytime, so he must be eating at night) and non-apprehension (you look at the floor, no jug is there, so you know there is no jug). My tutor says the number isn't the interesting question and what matters is what the list is supposed to do, which I think is right, but I still need an actual spec before I can write anything.

  So, before I pick a side in the essay (due in a fortnight, ugh): give me the desiderata. What does any adequate theory of the pramāṇas have to deliver — which cases it must get right, which distinctions it must keep, which results it can't contradict — with the case or consideration behind each requirement, and mark which are non-negotiable and which are really just preferences of one camp. And I want the list to do a specific job, so please build it for that: I want to use it as an admission test for candidate sources of knowledge, because the part of my paper I actually care about is two cases my tutor calls "not in the canon". (1) The readout case: you get a number off a measuring instrument, or a prediction out of a model; the number is correct and you act on it successfully, but you personally can't trace how it was produced and can't check it independently. Is that perception, inference, testimony, or would it need its own seperate slot? (2) The empty-search case: your query returns nothing, or you go through the whole folder and find no file, and you conclude the thing isn't there. Non-apprehension as a pramāṇa in its own right, or just an inference in disguise? So the desiderata should be the sort of thing that settles admissions questions rather than just vibes about how many sources there are.

  Concretely, here's what I keep circling, and I want you to sort it into real requirements versus optional extras, and add what I've missed: whether the entries are supposed to be processes, belief-types, or sources, and whether a theory has to keep pramāṇa distinct both from pramā (the true cognition it produces) and from mere true belief; whether each pramāṇa needs its own characteristic failure mode, and how the stock error cases (rope taken for a snake, a mirage, testimony from someone who's lying) get handled without the definition becoming circular — i.e. whether a pramāṇa is allowed to fail at all; whether the warrant is intrinsic to the cognition or has to be established by something else, and how either answer escapes an infinite regress; whether a pramāṇa has to deliver cognition you didn't already have, which is where memory gets awkward; whether the sources have to be independent of one another, given that testimony seems to depend on somebody else's perception or inference somewhere up the chain; what to say when one belief arrives by two routes at once (you see it and you're also told it); and whether a theory has to leave room for knowers who can't reflect on their own methods — children, animals, or honestly most of us most of the time. Also: does the list have to be complete, and how could a theory certify that without helping itself to one of the very sources it lists?

  Two more things, and these are the parts I most want. First: if some subset of these desiderata can't be jointly satisfied — my hunch is that completeness, independence, a strict no-circularity condition and a clean answer to the two-routes case can't all be had together, but tell me what you actually think and which one you'd drop and why — say so plainly, because that joint-unsatisfiability claim is the real result I'd put in the essay. Second: tell me which single requirement does the most work in ruling out otherwise popular lists. Then, and only briefly — a short paragraph or a small table — score the Nyāya four, the Buddhist two, and a modern "there's really only one thing here, reliable belief-production, so stop counting" view against your own criteria. Please write the reply in British English.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're grappling with pramāṇa theory in classical Indian epistemology, specifically frustrated by varying numbers of pramāṇas across schools. Their core need is a set of desiderata to evaluate candidate sources of knowledge, particularly for two novel cases: instrument readouts and empty searches.

  First, I need to unpack their explicit and implicit concerns. They want concrete criteria, not just scholarly vibes. Their circled issues—process vs source distinction, failure modes, intrinsic warrant, memory, independence, dual routes, and unreflective knowers—are the raw material. But deeper needs emerge: they likely crave analytical tools to cut through historical debates and apply this to modern cases. There's also methodological anxiety about how to avoid circularity when justifying completeness.

  I'll start structuring desiderata by separating non-negotiables from preferences. Non-negotiables must include: avoiding circularity in definitions (since that undermines the whole system), accounting for all paradigm cases like perception/testimony, and distinguishing pramāṇa from pramā. Preferences might include independence of sources or specific failure modes. 

  For the joint unsatisfiability claim they suspect, I agree completeness + strict independence + dual-route handling + no-circularity creates tension. Independence is the weakest link—it's philosophically tidy but empirically dubious (as testimony relies on others' perception). Dropping it resolves the tension. 

  The "one big requirement" that rules out popular lists? Probably the anti-circularity condition. Buddhist reductionism struggles with testimony; Nyāya's comparison faces definitional overlaps. 

  Now for their two cases:
  - Instrument readouts: Best framed as testimony (to the device's reliability) bundled with perception (of the display). Not a new pramāṇa.
  - Empty searches: Non-apprehension works if defined carefully as absence-perception, not inference. Mīmāṃsā handles this well.

  Scoring the schools against criteria:
  - Nyāya scores high but overextends with comparison.
  - Buddhist two is admirably parsimonious but undersells testimony.
  - Reliabilist monism is elegant but loses explanatory granularity.

  The user's deadline pressure shows—they need this framework to crystallize fast. I'll emphasize actionable criteria over scholarly survey, and flag where their "hunch" about tensions holds water. British English phrasing like "whilst" and "flatly" will keep it consistent with their request.
answer: |-
  Right, let's cut through the vibes and build a concrete admissions test for pramāṇas, tailored to your "readout" and "empty-search" cases. Forget the headcount; focus on what a theory *must* explain and avoid to be viable. Here are the **Desiderata for a Pramāṇa Theory**, sorted by priority:

  **I. Non-Negotiables (Fail These = Theory Invalid):**

  1.  **Non-Circularity of Definition:** The definition of each pramāṇa cannot *presuppose* the operation of another pramāṇa *in a way that creates a vicious regress or renders the source unexplained*.
      *   *Why:* Otherwise, the entire edifice collapses. If perception requires inference to validate it, and inference requires perception, you're stuck. Testimony relying on *someone else's* perception/inference is acceptable (it's causal, not definitional); defining testimony *as* "reliable speech validated by perception/inference" is circular.
      *   *Case Relevance:* Vital for the **readout case**. If the instrument's reliability *must* be validated by your own perception/inference *before* accepting the readout, it becomes problematic testimony or inference. A theory must explain how warrant arises *without* requiring this prior validation loop for every instance.
  2.  **Distinction Between Pramāṇa (Source/Process) and Pramā (Result):**
      *   *Why:* A pramāṇa is the *means* or *instrument* by which veridical cognition (*pramā*) arises. It's not the cognition itself, nor mere true belief (which could be accidental). The process must be identifiable independently of its success *in this instance*.
      *   *Case Relevance:* Essential for analysing *how* **empty-search** yields the cognition of absence. Is the *process* of looking/nothing-appearing the source (non-apprehension), or is the absence inferred *from* that process? The theory must clarify the causal mechanism.
  3.  **Account for Core Paradigm Cases:** The theory must provide a plausible account of how we gain knowledge universally accepted as valid within the tradition and common sense: sensory perception (seeing a pot), inference (smoke -> fire), and linguistic testimony (understanding "bring the pot").
      *   *Why:* These are the bedrock data points any theory must explain. Failure here means the theory is simply inadequate to human cognition.
      *   *Case Relevance:* The **readout case** must be mapped onto or contrasted with these paradigms. Does it resemble testimony (relying on the instrument's 'word')? Perception (direct sensory input of the display)? Inference (reasoning from design principles)? It must fit *somewhere* coherently.
  4.  **Account for Error (Vyabhicāra/Doṣa):** The theory must explain how the *same type of process* can sometimes yield true cognition (*pramā*) and sometimes false cognition (*apramā* or *bhrama*), without the definition becoming self-contradictory.
      *   *Why:* Rope/snake, mirage, liar's testimony. A pramāṇa is a *generally reliable* causal process, not an infallible one. Its definition must include the conditions under which it operates correctly *and* the defects (*doṣa*) that cause failure.
      *   *Case Relevance:* Crucial for both cases. **Readout:** What defects cause instrument failure? Faulty calibration, misreading? **Empty-search:** What defects cause failure? Poor lighting, inattentiveness? The theory must define the *conditions for success* inherent to the pramāṇa type.
  5.  **Avoid Regress in Warrant (Svataḥprāmāṇya/Parataḥprāmāṇya):** The theory must take a coherent stance on whether the warrant (*prāmāṇya*) of a cognition generated by a pramāṇa is intrinsic (*svataḥ*) or extrinsic (*parataḥ*), and how this stance avoids an infinite regress of justifications.
      *   *Why:* If warrant always needs external validation (e.g., another pramāṇa), infinite regress looms. If intrinsic, how is error possible? A viable theory needs a stable answer (e.g., intrinsic defeasibility, extrinsic validation only on challenge, foundationalism).
      *   *Case Relevance:* Central to the **readout case**. Does the number simply *present itself* as reliable (intrinsic)? Or *must* you validate the instrument first (extrinsic)? The theory's stance dictates how the readout is admitted.

  **II. Highly Desirable (Strong Preference - Weak Theories Fail Here):**

  6.  **Process/Source Focus:** Pramāṇas should be understood primarily as *causal processes* or *sources* generating cognition, not just types of beliefs or cognitions.
      *   *Why:* Keeps the focus on the *means of knowing* and distinguishes it from the *result* (Desideratum 2). Belief-types are the *output*.
      *   *Case Relevance:* Clarifies whether **empty-search** is a distinct *process* (the non-appearance itself) or just the *inferred result* of a perceptual process.
  7.  **Explanatory Granularity:** The theory should be able to distinguish, in principle, between cognitions arising from different fundamental causal routes.
      *   *Why:* Captures important epistemic differences. Knowing the sky is blue because you see it feels different (and has different vulnerabilities) than knowing it because a scientist told you.
      *   *Case Relevance:* **Readout** vs direct perception vs inference. Does collapsing them lose important distinctions? **Empty-search** vs inferring absence from positive evidence.
  8.  **Handle Dual Routes:** The theory should explain what happens when the *same* cognition (e.g., "there's a fire on the hill") arises via two distinct pramāṇas simultaneously (e.g., you see the fire *and* someone tells you).
      *   *Why:* This happens. A good theory shouldn't break down. Does it count as two instances of knowledge? Is the cognition strengthened?
      *   *Case Relevance:* Reinforces the need for distinct processes (Desideratum 6).

  **III. Negotiable / Camp Preferences (Theories Can Differ Here):**

  9.  **Independence of Sources:** Whether the operation of one pramāṇa *must* be logically/causally independent of others. *Preference:* Not strictly necessary. Testimony *causally* relies on others' perception/inference, but functions as a distinct *source for the hearer*.
      *   *Why:* Nyāya accepts dependence (testimony needs speaker's perception); Buddhist reductionists see it as problematic; Mīmāṃsakas emphasize testimony's unique authority. It's a choice point.
      *   *Case Relevance:* **Readout** clearly relies on complex chains involving other pramāṇas (designer's inference, manufacturer's perception). Independence would rule it out as distinct; lack of independence allows it under testimony or a new category.
  10. **Novelty of Cognition:** Whether a pramāṇa must generate cognition not already present (ruling out memory as a pramāṇa). *Preference:* Strongly desirable for most schools (memory is reproductive, not productive), but some (e.g., Prabhākara Mīmāṃsā) contest this.
      *   *Why:* Preserves the idea of pramāṇa as a *source of new* knowledge. Memory recalls, it doesn't *establish* truth *de novo*.
      *   *Case Relevance:* Less critical for your cases, but relevant for defining boundaries.
  11. **Unreflective Knowers:** Whether the theory must accommodate knowledge in children, animals, or unreflective adults. *Preference:* Essential for realism. Knowledge doesn't require meta-cognition.
      *   *Why:* Much knowledge is pre-reflective. A theory requiring explicit validation for every instance is implausible. *Svataḥprāmāṇya* views handle this better.
      *   *Case Relevance:* **Readout** and **empty-search** often happen unreflectively.
  12. **Completeness:** Whether the list *must* cover every possible way of knowing. *Preference:* Aspirational, but impossible to *prove* without circularity. A good theory aims for comprehensiveness based on paradigm cases and explanatory power.
      *   *Why:* You can't use a pramāṇa to validate the completeness of the pramāṇa list without begging the question. Theories argue for completeness based on analysis of cognition types and inability to reduce new candidates.
      *   *Case Relevance:* Determines if **readout** or **empty-search** *demand* a new pramāṇa slot or can be accommodated within existing ones.

  **Joint Unsatisfiability & The Key Requirement:**

  *   **The Conflict:** Your hunch is sharp. **Completeness** (Aspiration 12), **Strict Independence** (Negotiable 9), **Handling Dual Routes** (Desirable 8), and **Non-Circularity** (Core 1) *are* in tension. If you demand sources be *strictly independent* (no causal/logical reliance on others), then:
      1.  Testimony becomes highly problematic (violates 9, threatens 1 if forced).
      2.  Accommodating complex cases like **readout** (which inherently relies on chains involving other pramāṇas) within the system becomes impossible without circularity (violates 1) or sacrificing completeness (violates 12 aspiration).
      3.  Dual Routes involving testimony + perception become messy (problem for 8).
  *   **The Drop:** **Strict Independence (9)** is the weak link and should be dropped. It's philosophically appealing for tidiness but empirically and causally unrealistic. Most knowledge involves complex interactions. Causal dependence (like testimony on prior perception) doesn't negate its functional role as a distinct *source for the recipient*. Letting go of strict independence resolves the tension: **Completeness** can be pursued via explanatory power, **Dual Routes** are unproblematic combinations, and **Non-Circularity** is preserved by defining sources based on their *operative process for the knower*, not their ultimate genesis.
  *   **The Requirement that Rules Out Lists:** **Non-Circularity of Definition (1)** is the most powerful filter. Buddhist reductionism struggles to define testimony without implicitly relying on perception/inference *in a definitionally circular way* (e.g., "reliable speech" – but reliability is established how? By *your* perception/inference about the speaker, which presupposes those pramāṇas). Nyāya's *upamāna* (comparison) is often criticised for collapsing into perception + testimony or inference. Mīmāṃsā's *arthāpatti* (postulation) faces reduction attempts by Nyāya (seeing it as inference). A theory adding a pramāṇa must define it without covertly relying on others *in the definition itself*.

  **Scoring the Candidates (Against Core Desiderata 1-5 & Desirable 6-8):**

  | Pramāṇa Theory      | Non-Circularity (1) | Pramāṇa/Pramā Distinction (2) | Core Paradigms (3) | Account for Error (4) | Warrant Regress (5) | Process Focus (6) | Explanatory Granularity (7) | Dual Routes (8) | Notes                                                                                                                               |
  | :------------------ | :------------------ | :---------------------------- | :----------------- | :-------------------- | :------------------ | :---------------- | :-------------------------- | :-------------- | :---------------------------------------------------------------------------------------------------------------------------------- |
  | **Nyāya (4)**       | **✓✓**              | **✓✓**                        | **✓✓**             | **✓✓**                | **✓** (Svataḥ w/ challenge) | **✓✓**            | **✓✓**                      | **✓**           | Strong overall. *Upamāna* is the weak point re Circularity/Granularity (can it be reduced?). Handles testimony dependence well. Readout=Testimony; Empty-search=Non-Apprehension (if accepted). |
  | **Buddhist (2)**    | **✓**               | **✓✓**                        | **✓**              | **✓✓**                | **✓** (Complex)     | **✓✓**            | **✗/✓**                     | **✓**           | Strong process focus & error. **Major Weakness:** **Testimony (3 & 1)**. Often reduces it to inference (reliability inference) which risks circularity. Readout=Inference; Empty-search=Perception (non-appearance). Granularity lost collapsing testimony. |
  | **Reliabilist Monism** | **✓**               | **✗**                         | **✓**              | **✓**                 | **✓** (Extrinsic)   | **✓** (Vague)     | **✗**                       | **?**           | **Core Weakness: Distinction (2) & Granularity (7).** Reduces everything to "reliable process," losing crucial epistemic differences between *how* we know (e.g., seeing fire vs. being told). Readout & Empty-search are just "reliable processes," but this lacks explanatory power. Simpler, but arguably too blunt. |

  **Your Cases Resolved with the Desiderata:**

  1.  **The Readout Case:** Using the desiderata, it fits best under **Testimony**.
      *   *Process/Source:* You receive linguistic/symbolic information (the number) from a source (the instrument).
      *   *Non-Circularity:* The instrument functions *as* a testifier. Its reliability, while causally dependent on design/manufacture (involving other pramāṇas), is not part of the *definition* of testimony for *you in that moment*. You receive the symbol as information from a source.
      *   *Distinction:* The pramāṇa is the process of receiving and comprehending the instrument's output. The pramā is the veridical cognition of the measured value.
      *   *Error:* Defects (*doṣa*) include instrument malfunction, misreading the display, faulty calibration.
      *   *Warrant:* *Svataḥ*: The cognition presents itself as reliable; you accept it defeasibly unless challenged. *Parataḥ*: You might validate the instrument beforehand, but this isn't needed for every reading.
      *   *Granularity:* Distinct from directly perceiving the measured property or inferring it yourself.
      *   *Not a New Pramāṇa:* It leverages existing capacities (perceiving symbols, understanding testimony). Adding a new category adds no explanatory value and violates parsimony.

  2.  **The Empty-Search Case:** Using the desiderata, **Non-Apprehension** (as defended by Mīmāṃsā) is viable as a form of **Perception**.
      *   *Process/Source:* The cognitive process is *looking for X in location Y under adequate conditions and X not appearing*. The source is the sensory/cognitive access to the absence.
      *   *Non-Circularity:* The cognition of absence arises directly from the non-appearance *given the expectation and adequate conditions*. It doesn't *require* an inferential step ("I see no pot, therefore it's absent") as part of its definition, though this step can be made explicit.
      *   *Distinction:* The pramāṇa is the process of attentive search/non-appearance. The pramā is the veridical cognition "X is not in Y".
      *   *Error:* Defects (*doṣa*) include poor lighting, inattentiveness, searching the wrong place, flawed expectation.
      *   *Warrant:* *Svataḥ*: The absence is directly apprehended under the right conditions. *Parataḥ*: One could infer absence, but the direct apprehension is primary.
      *   *Granularity:* Distinct from inferring absence based on positive evidence (e.g., seeing only empty space where the pot should be *is* the perception of absence; inferring the pot is elsewhere because you see footprints leading away is different).
      *   *Not Necessarily a New Pramāṇa:* It can be seen as a specific mode of perception (perceiving the *absence* of an expected object in a specific locus under specific conditions). Mīmāṃsā carves it out due to its importance for ritual exegesis, but it can be accommodated within a sophisticated view of perception.

  **In short:** Drop strict independence. Insist on Non-Circularity, the Pramāṇa/Pramā distinction, explaining core cases and error, and a coherent warrant story. Use these to admit your cases: Readout is Testimony; Empty-Search is best handled as a mode of Perception (Non-Apprehension). Nyāya (minus over-enthusiasm for *upamāna*) handles this best. Good luck with the essay!
