prompt: |-
  Hey — I'm a philosophy PhD student (mostly phil. mind / phil. cognitive science) and I'm putting together the handout for our reading group on higher-level causation. I want to run the whole thing through Hofstadter's careenium setup instead of the usual human case, because the human case drags in consciousness and qualia and I want that off the table for a couple of sessions.

  Recap for whoever ends up reading this: Careenia is made of some rubbery goo whose bits come in two flavors, plain balls and "simmballs". Simmballs clump into stable patterns, and some of those clumps are simms — structures you can read as symbols, that can be copied, mutated, recombined, and that are about things (a simm for a predator, a simm for a direction, whatever). So the question is whether the simm-level story does any causal work: when a simm gets a clump of simmballs to move, is that just our way of tracking the balls shoving each other around, or is the pattern itself doing some of the pushing?

  What I want from you is the spec, not the scoreboard. Before I assign another paper on mental causation / special-science causation / whatever, I want the list: what does an account of simm-level causation have to deliver to count as adequate — which cases it has to get right, which distinctions it can't collapse, which facts about the substrate it has to be consistent with — with the case or consideration under each one. To fix what "adequate" means: good enough to let me keep using symbol-level explanations in cognitive science (a representation caused the behavior, the plan drove the search) without that being hand-wavy, and good enough to say what an experiment on Careenia would even settle.

  Some things I think belong on the list, so you can tell me which are real requirements and which are just my own prejudices:

  - differentiate between a couterfactual-dependence test and a "who's really producing the motion" test, and say why we should care about the one we care about;
  - handle the scramble case — swap which simmballs realize the simm, keep the pattern, and the simm-level story doesn't budge — without that automatically making the simm causally idle;
  - handle near-misses: clumps that are structurally almost a simm but aren't about anything (junk patterns, malformed copies, a simm that's been mutated one step too far), and say which side of the line the causal work falls on;
  - handle two structurally identical clumps where only one has the history to be about something — does aboutness matter to the causation, or only the shape?;
  - say what I've started calling the read/write asymmetry: tons of patterns can be read off the substrate after the fact, but only some of them let you predict what the goo does next. Which ones, and why?;
  - the bookkeeping condition, as I've been calling it: the simm-level dynamics should be able to run on its own, without you having to peek at the balls to figure out the next simm state. Is that necessary for genuine simm-level causation, or is it just what a nonreductive physicalist wants for Christmas?;
  - not cheat: no extra shove added to the substrate's physics, but also no quiet slide into the simms being decorations, and no accepting that every single simmball movement has two independent sufficient causes.

  Also: mark which items are non-negotiable and which are preferences of one camp (I suspect "no overdetermination" is an identity-theory taste and "simm-level laws must be exceptionless" is a Fodor-ish taste, but tell me if I have it backwards), tell me which subset of the requirements can't all be satisfied together — that's the part I most want, since if the list itself is inconsistent that's the interesting result — and say which single requirement knocks out the most candidate views.

  Then, briefly, like three lines each max: how epiphenomenalism, a straight reductive identity story, the "the simm just is what the simmballs are doing" pattern view, an interventionist/difference-making account, and the "the simm is a program the substrate is running" view do against the list. I really do care much more about the criteria than the scoring — I can do the scoring myself once I know what I'm asking for. Page-ish is plenty, a table is fine, and please don't give me a reading list, I've got the canon, I just need to know what I'm supposed to be demanding of it.
reasoning: |-
  Okay, the user is a philosophy PhD student focused on philosophy of mind and cognitive science. They're preparing a handout for a reading group on higher-level causation and want to use Hofstadter's careenium thought experiment to avoid consciousness and qualia issues. Their main request is for a specification of adequacy criteria for simm-level causation accounts, not evaluations of existing theories.

  First, I need to understand the careenium setup. It's made of rubbery goo with plain balls and simmballs. Simmballs form stable patterns (simms) that act as symbols - they can be copied, mutated, and represent things. The core question is whether these simm patterns have genuine causal power beyond the underlying physics of the balls.

  The user wants clear criteria that any adequate account of simm-level causation must meet. They've listed some preliminary ideas and want me to refine them, identify which are essential vs. optional, point out conflicts between criteria, and highlight which single criterion is most challenging for theories.

  Looking at their suggested criteria:
  - Counterfactual vs. production distinction seems crucial for clarifying what kind of causation we care about
  - Scramble test (pattern persistence through part replacement) is important for establishing pattern-level causality
  - Near-miss cases test whether intentionality/content matters to causation
  - History-dependence cases examine if causal efficacy requires representational history
  - Read/write asymmetry addresses predictive power differences
  - Bookkeeping condition relates to explanatory autonomy
  - Anti-cheating constraints prevent dualism or overdetermination

  I'll need to systematize these into necessary criteria (for any adequate account) and optional ones (that reflect specific theoretical commitments). Key conflicts appear between explanatory autonomy (bookkeeping) and strict physicalism, and between history-dependence and pattern-based views.

  The most challenging criterion is likely the scramble test since it directly challenges whether patterns can persist as causal entities despite part replacement - this exposes tensions in reductive physicalism.

  For the brief theory assessments, I'll focus on how epiphenomenalism, reductive identity, pattern realism, interventionism, and computationalism handle the core criteria without going into excessive detail since the user emphasized they care more about the criteria than scoring.

  The user seems sophisticated and time-constrained (preparing a handout), so I should provide a concise, structured response that helps them frame the debate for their reading group while avoiding unnecessary citations or digressions.
answer: |-
  Here’s a distilled spec for "adequate simm-level causation" in the careenium setup, designed to bypass consciousness debates. Criteria are categorized, with conflicts noted. **Non-negotiable** criteria (NN) are essential for any account claiming simm-level efficacy; others reflect theoretical preferences.

  ---

  ### **Core Adequacy Criteria**  
  *(What an account MUST satisfy to avoid hand-waving)*  

  1. **Scramble Test (NN)**  
     *Case*: Swap simmballs while preserving simm-pattern; behavior remains unchanged.  
     *Requirement*: Must show simm-pattern (not token balls) is causally relevant. Falsifies mereological reduction (if pattern changes = behavior changes).  

  2. **Counterfactual Robustness (NN)**  
     *Case*: Alter simm-content (e.g., mutate "predator" to "food") without changing physical dynamics; behavior shifts.  
     *Requirement*: Simm-level changes must correlate with behavioral differences *independently* of substrate changes. Distinguishes causation from correlation.  

  3. **Near-Miss Exclusion**  
     *Case*: A structurally identical clump lacks semantic content (e.g., junk pattern).  
     *Requirement*: Must explain why only *meaningful* simms (not near-misses) produce systematic effects *in the system’s normal operation*. Rejects purely syntactic causation.  

  4. **Bookkeeping Condition (NN)**  
     *Case*: Simm-state transitions (e.g., inference) are predictable from simm-level rules alone.  
     *Requirement*: Simm-dynamics must be *autonomous*: describable without micro-tracking balls. Essential for cognitive science explanations.  

  5. **Anti-Cheating Constraint (NN)**  
     *Case*: No new physics, no overdetermination (no "two sufficient causes").  
     *Requirement*: Simm-causation must supervene on ball-dynamics without dualism or redundancy.  

  ---

  ### **Contested/Polarizing Criteria**  
  *(Reflect theoretical divides; satisfaction depends on camp)*  

  6. **History-Dependence Test**  
     *Case*: Two identical clumps—one evolved as a symbol, one formed by chance.  
     *Preference*: **Internalists** (e.g., Fodor) demand shape-only efficacy. **Externalists** require historical/aboutness for "real" causation.  

  7. **Read/Write Asymmetry**  
     *Case*: Why can we "read" infinite patterns from the goo, but only some predict behavior?  
     *Preference*: **Interventionists** tie it to difference-making. **Reductivists** say only "causally active" patterns matter.  

  8. **No Overdetermination**  
     *Preference*: **Identity theorists** insist simm-ball events = simm-events (no dual causes). **Non-reductivists** accept benign overdetermination.  

  9. **Exceptionless Simm-Laws**  
     *Preference*: **Fodorians** require simm-level generalizations. **Mechanists** accept ceteris paribus laws.  

  ---

  ### **Key Conflicts & Knockout Tests**  
  - **Fatal Conflict**: **Bookkeeping + Anti-Cheating**. If simm-dynamics are autonomous *and* nothing but ball-dynamics, how are exceptions/errors explained without micro-peeking? (Threatens non-reductive views).  
  - **Most Damaging Criterion**: **Scramble Test**. Knocks out token identity theories (if balls change but pattern doesn’t, behavior shouldn’t change). Also challenges eliminativism (simms *must* do work).  
  - **Weakest Link**: **History-Dependence**. Rejected by computationalists (syntax over semantics) and embraced by teleosemanticists. Least consensus.  

  ---

  ### **Brief Theory Report Card**  
  *(✓ = Satisfies NN; ✗ = Fails NN; ~ = Partial/Contested)*  

  | **View**                          | **Scramble** | **Counterfactual** | **Bookkeeping** | **Anti-Cheating** | **Near-Miss** |  
  |-----------------------------------|--------------|--------------------|-----------------|-------------------|---------------|  
  | **Epiphenomenalism**              | ✗            | ✗                  | ✗               | ✓                 | ✗             |  
  | *Simms are inert byproducts.*     |              |                    |                 |                   |               |  
  | **Reductive Identity**            | ✗            | ~ (only physical)  | ✗               | ✓                 | ✓             |  
  | *Simm = ball-configuration.*      |              |                    |                 |                   |               |  
  | **Pattern Realism**               | ✓            | ✓                  | ~ (if emergent) | ~                 | ✗             |  
  | *Patterns are causal entities.*   |              |                    |                 |                   |               |  
  | **Interventionism**               | ✓            | ✓                  | ✓               | ✓                 | ~             |  
  | *Causation = difference-making.*  |              |                    |                 |                   |               |  
  | **Computationalism**              | ✓            | ✓                  | ✓               | ✓                 | ✓ (syntax)    |  
  | *Simms as program states.*        |              |                    |                 |                   |               |  

  **Epiphenomenalism**: Fails Scramble & Counterfactual (simms don’t affect behavior).  
  **Reductive Identity**: Fails Scramble (token balls matter).  
  **Pattern Realism**: Struggles with Near-Miss (why not all patterns?).  
  **Interventionism**: Strong on NN, but Near-Miss requires semantic criteria (optional).  
  **Computationalism**: Best fit if syntax suffices; dodges history-dependence.  

  ---

  ### **Bottom Line**  
  An **adequate account** must pass all **NN criteria** (Scramble, Counterfactual, Bookkeeping, Anti-Cheating). The **Scramble Test** is the litmus for non-reductive views. **Bookkeeping + Anti-Cheating** is the tightrope walk. For cognitive science, **Bookkeeping** is the non-negotiable prize: without it, simm-talk is heuristic, not explanatory. Experiments on Careenia must test **Scramble + Counterfactual** (e.g., manipulate simm-content while fixing ball-dynamics). If you get nothing else, demand how a theory handles **Scramble** and **Bookkeeping**—that’s where the bodies are buried.
