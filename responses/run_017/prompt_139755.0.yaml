prompt: |-
  Me and two colleagues just landed a small three-year grant to run a working group on something we've been loosely calling the epistemology of heuristic arguments, by which we mostly mean the presumption of independence: when you're reasoning about a system you can't fully model and you treat some pile of events as independent because you don't know of any mechanism linking them, what exactly are you entitled to conclude, and when does that move quietly turn into self-deception? The composition of the group is me (formal epistemology / phil math), an analytic number theorist who is sympathetic but will only come to every other meeting, and someone from a risk-analysis shop who mostly cares about tail estimates for things like simultaneous infrastructure failures or multiple safeguards holding at once. Our money is tiny: visitors, a couple of two-day workshops, no postdoc. We want the output to be something a practioner could actually use — a checklist, or an audit procedure, or at minimum a sharpened set of distinctions — not another survey paper, and definately not a bibliography.

  Let me sketch the candidate lines of work as we've listed them so far, because I want you to push back on the list and not just rank it. (1) The saturation rule: my hobby-horse. The idea is that ignoring a dependency is licensed only if restoring it would move the answer by less than the model's own demonstrated error on some nearby case where the truth is known — so the presumption gets cashed out as a testable bookkeeping condition rather than a vibe. (2) First-order versus second-order use: does the reliability of an independence heuristic track whether you're using it to get a mean versus a variance or a tail? In the prime case the naive random model gets counts roughly right and apparently gets the fluctuations wrong, and I want to know whether that's the deep fault line or whether the real distinction is between rigid constraints the model violates outright (like a number's being divisible by three) and soft correlations it merely averages over. (3) A case zoo: assemble a few dozen worked cases where the outcome is known, sorted by how the heuristic performed — right answer, right order but wrong constant, right for the wrong reason, qualitatively wrong including flipped sign — and then score candidate licensing rules against that sorting. This feels unglamorous and might be the thing everything else depends on. (4) The tail asymmetry: when the target is a conjunction of many rare events, independence makes it exponentially small, so the presumption seems to do enormous work precisely where it's least checked; is there a principled reason to reverse the default there, and does any of the number-theory evidence speak to it at all? (5) Is the presumption of independence a credal state or a convention about which correlations a modeller has priced in — and is that question deep or merely verbal? (6) What I think of as phantom independence: when you randomize along one axis you silently inject structure along another, and I'd like a general diagnostic for which axis a model has quietly structured. (7) The transfer question: in number theory you eventually get theorems, so a heuristic gets graded; in the risk cases ground truth basically never arrives. How much of the number-theory lesson survives the move, and is this the question that should come first because if the answer is nothing, our whole project collapses?

  What I want is a defended agenda, not an overview. Rank these — or tell me which of them collapse into each other, which are muddled as I've stated them, and what I'm leaving out — against explicit criteria: which questions are upstream of which, which are tractable in three years for a group with our mix and no compute, which are already well covered by people we haven't read, and which would change what some outside field actually does. Be honest about the trade-offs between those criteria rather than pretending they all point the same way, tell me what evidence or result over the next two years would move an item up or down the list, and flag anything where I'm obviously just reinventing something. Also tell me if the whole framing of a usable checklist is the wrong deliverable for this group.
reasoning: |-
  Hmm, the user is describing a grant-funded working group on the epistemology of heuristic arguments, focusing specifically on the presumption of independence in reasoning. They have seven candidate lines of work and want me to critically evaluate them, rank them, and suggest a practical research agenda.

  Let me break this down. The user is a formal epistemologist with two colleagues: an analytic number theorist (part-time) and a risk analyst focused on tail estimates. They have limited resources - just workshops and no postdoc. Their goal is practical output like checklists or audit procedures, not academic papers.

  Looking at their seven proposed research lines:
  - (1) Saturation rule: Testing when ignoring dependencies is acceptable based on error margins
  - (2) First vs second-order use: When independence heuristics fail (means vs variances/tails)
  - (3) Case zoo: Collection of worked examples to test theories
  - (4) Tail asymmetry: Problems with independence assumptions for rare events
  - (5) Nature of presumption: Is it about beliefs or modeling conventions?
  - (6) Phantom independence: Unintended consequences of randomization
  - (7) Transfer question: How number theory insights apply to risk analysis

  I need to evaluate these against several criteria: what's foundational, what's tractable in 3 years, what's novel, and what will have practical impact. The practical output requirement is crucial - they want something usable, not just theory.

  For ranking, I think (3) the case zoo should be first because it provides essential empirical grounding. Without concrete examples, the other theories are just speculation. It's also highly tractable and will engage all team members.

  Next should be (2) first/second-order use and (4) tail asymmetry - these seem like the most pressing practical concerns, especially for the risk analyst. They address when independence assumptions fail catastrophically.

  Then (1) saturation rule and (6) phantom independence - these are important but more theoretical. The saturation rule in particular might need the case zoo to test it.

  (5) on the nature of presumption feels like it might be more philosophical and less practical, though still important. (7) transfer question is critical but might be premature before other work.

  I should note some connections: (2) and (4) are closely related on tail risks, (1) might depend on (3) for validation, and (7) could be reframed as applications of the case zoo.

  For what's missing: They might need more on how to communicate these insights to practitioners. Also some methodology for building their case zoo - how to select and analyze cases systematically.

  The practical checklist goal is good but they'll need to validate it with real users. Maybe prototype it early.

  I'll structure my response to first rank the projects clearly, then explain each ranking with the criteria, note connections between them, point out any muddled aspects, suggest what's missing, and finally address whether the checklist deliverable makes sense.
answer: |-
  Based on your constraints (3 years, tiny budget, mixed team, practitioner output), practical impact potential, and intellectual tractability, here’s a defended agenda with explicit trade-offs. I’ll rank, collapse, flag muddles, and identify gaps—prioritizing **what enables a usable output** while avoiding reinventions.

  ---

  ### **Ranked Agenda (Defended)**
  1.  **(3) Case Zoo**  
      **Why First?** *Upstream of everything, highly tractable, forces concreteness.*  
      - **Tractability:** Your team can build this immediately with existing expertise. No compute needed—just curation and analysis of known cases (number theory, engineering failures, ecological collapses, etc.).  
      - **Upstream:** Provides the testbed for validating (1), (2), (4), and (6). Without it, other lines risk being untethered speculation.  
      - **Practical Anchor:** Sorting cases by heuristic performance ("right answer but wrong reason," "flipped sign") directly feeds into a diagnostic checklist.  
      - **Evidence to Move It:** If early cases show no clear patterns distinguishing heuristic success/failure, pivot to refining categories. If patterns emerge fast, accelerate (2)/(4).  
      - **Risk:** "Unglamorous" but essential. Without it, the "usable output" fails.

  2.  **(2) First-Order vs. Second-Order Use** & **(4) Tail Asymmetry**  
      **Why Combined Second?** *Core practitioner pain point, leverages team strengths, high impact.*  
      - **Collapse:** These are two sides of the same coin. (2) asks *when* independence fails (means vs. tails); (4) asks *why* it fails catastrophically for conjunctions. Your risk analyst’s focus on tail estimates demands this.  
      - **Tractability:** Number theorist can supply cases (e.g., Cramér’s model vs. actual prime gaps; Hardy-Littlewood conjectures). Risk analyst brings infrastructure/ecosystem cases. You formalize the distinction.  
      - **Practical Output:** A checklist rule like: "**If targeting extreme events, flag independence as ‘high-risk’ and require justification for correlations (not their absence).**"  
      - **Novelty Gap:** Less reinvention here—literature on heavy tails exists (e.g., in stats, extreme value theory), but not framed for *heuristic licensing*.  
      - **Evidence to Move It:** If case zoo shows tails are consistently problematic across domains, this becomes your flagship insight.

  3.  **(1) Saturation Rule**  
      **Why Third?** *Useful but requires validation, risk of over-engineering.*  
      - **Tractability:** Needs the case zoo (3) to test "demonstrated error" benchmarks. Easy to prototype rules, hard to generalize without data.  
      - **Practicality:** Could become a checklist item ("Quantify error tolerance for ignored dependencies"), but may be too technical for some practitioners.  
      - **Muddle Risk:** "Nearby case where truth is known" is domain-specific. What if no such case exists (e.g., novel risks)? Needs integration with (7).  
      - **Evidence to Move It:** If case zoo shows dependencies often saturate predictably, prioritize; if not, deprioritize for being too niche.

  4.  **(6) Phantom Independence**  
      **Why Fourth?** *Important but niche, overlaps with known bias literature.*  
      - **Tractability:** Analytic examples exist (e.g., randomizing clinical trial groups injects geographic bias), but general diagnostics are elusive.  
      - **Reinvention Risk:** Close to "collider bias" or "selection effects" in causality (e.g., Pearl, Bareinboim). Frame it as a *practitioner warning*: "Randomizing variable X may create structure in Y; map secondary axes."  
      - **Practical Output:** A simple audit question: "**What correlations might randomization *introduce*?**" Low effort, high value.  

  5.  **(7) Transfer Question**  
      **Why Fifth?** *Critical but premature; let cases drive this.*  
      - **Upstream Muddle:** Not first—your project *doesn’t collapse* if number theory insights don’t transfer. Start with cross-domain cases *in the zoo* (e.g., crypto failures vs. prime gaps).  
      - **Tractability:** Workshop discussions can tackle this. The risk analyst’s "ground truth never arrives" critique is gold—use it to stress-test findings.  
      - **Output:** A "certainty gradient" in your checklist (e.g., "In domains with feedback/adaptation, downgrade confidence in independence").  

  6.  **(5) Credal State vs. Convention**  
      **Why Last?** *Verbal unless grounded; low practical impact.*  
      - **Muddle:** As posed, it’s philosophical. But reframe as: "**Who ‘owns’ correlation uncertainty?**" (e.g., modeler vs. user). This *could* inform audit trails.  
      - **Risk:** Your risk analyst will (rightly) roll their eyes if this dominates workshops. Keep it brief: "In checklist, specify whether independence is a claim or an omission."  

  ---

  ### **What You’re Missing (Critical Gaps)**
  1.  **Domain-Specific Heuristics:** Your cases must include domains *outside* math/risk (e.g., epidemiology, finance, AI safety) to avoid myopia.  
  2.  **Cognitive Biases:** The "self-deception" angle needs psychology. E.g., *motivated ignoring* of dependencies (see: Tetlock’s work on expert failure).  
  3.  **Tool for Practitioners:** Beyond a checklist, consider a **dependency decision tree**:  
      - Start: "Targeting tails? → See Rule 2/4."  
      - "No known mechanism? → Check saturation (Rule 1) or phantom structure (Rule 6)."  
      - "Ground truth unavailable? → Apply transfer hedges (Rule 7)."  

  ---

  ### **Is the Checklist the Right Deliverable?**  
  **Yes, but only if:**  
  - It’s **battle-tested** on real cases from the zoo.  
  - It’s **short** (≤1 page) with actionable triggers (e.g., "When estimating P(A∩B), if min(P(A),P(B)) < 0.01, justify independence").  
  - You **prototype it early** with the risk analyst’s contacts (e.g., audit a real risk model in Year 2).  

  **Alternatives if checklist fails:** A **case database with failure tags** (e.g., "Tail error: Fukushima backup generators") or a **dependency-sensitivity calculator** (simple Monte Carlo tool).  

  ---

  ### **Year 1 Action Plan**  
  1.  **Build the Case Zoo (3):** Each member contributes 10+ cases. Structure: Domain, heuristic used, ground truth, error type.  
  2.  **Workshop 1:** Score cases on (2)/(4) (first-order vs. tail errors). Identify patterns.  
  3.  **Prototype Checklist:** Draft rules for (2)/(4) and (6) based on initial cases.  
  4.  **Lit Review:** Skim for reinventions—especially in stats (e.g., "ignorable missingness"), causality, and risk engineering.  

  **Success Metric:** By Year 2, if cases show consistent tail/phantom failures, double down on (2)/(4)/(6). If not, pivot to (1)/(7). Stick to the zoo—it’s your keystone.  

  This focuses your scarce resources on **applied epistemology** while delivering something that might actually stop a bridge (or power grid) from failing.
