prompt: |-
  I'm a staff engineer at a company with about forty backend services spread across nine teams, and I've been asked to run a fifty-minute internal engineering-craft session on how technical conventions form and hold together. The reason I'm running it is a design review next week: we are about to rewrite our internal messaging layer, and the argument in the room keeps collapsing into the same shape — the retry policy is arbitrary, so let's just pick the better option and write it into the migration document. I've read a couple of summaries of David Lewis's account of convention and it looks like the right tool for what is going wrong in that room. I don't want to lecture at people about philosophy, and I don't want to put his numbered formal definition on the board, because I lose the thread in it myself and so will they. What I want from you is a plan for making the structure land with twenty-five engineers of mixed seniority, no philosophy background, one whiteboard and no slides, half of whom will arrive convinced that this is a management problem rather than a technical one.

  The case I was going to build everything on: when a consumer fails to process a message, it either retries with backoff until the message goes through, or it retries a fixed number of times and then parks the message in a dead-letter queue that a human drains by hand. There is no written policy. Every team I asked does the second thing, and every team I asked assumed every other team does the second thing. It appears to have started with one incident about three years ago — a consumer stuck retrying held a malformed message against a checkpoint for nine hours — and the fix that got posted in the incident channel somehow became the way everybody does it. If everyone did the other thing instead, throughput would arguably be better and nobody would be draining anything by hand, so the current practice looks arbitrary, and that word is doing real damage in the design review.

  There is a wrinkle. This is not a pure case of everyone just wanting to match: the platform team would rather each consumer team own its own dead-letter draining, and the consumer teams would rather the platform offered it as a feature. So there is a small dispute about who does the work sitting on top of the coordination problem. Tell me whether that wrinkle ruins the example, whether I should keep it and deal with it explicitly, or whether I should swap in something cleaner — say, two services that must agree on which of two functionally identical header names carries the correlation ID, which is cleanly arbitrary but invites someone to say we should just run a find-and-replace across the monorepo, and I don't know whether that objection is a problem with the example or the beginning of the lesson.

  Concretely, please plan:

  1. The order the pieces have to come in and what depends on what. In particular: does the definitional core — the stable regularity, the expectations each person has about everyone else, the fact that the expectations are themselves mutually visible, and the fact that some alternative regularity would have served just as well if everyone had converged on it — come before or after the case, and why? And at which point does the word arbitrary have to be repaired, given that they will hear it as costless?
  2. Whether my case or the cleaner one should carry the whole session, and what the carrying example must have and must lack. My guess is that it must lack a linter, a mandate and a single owner who could flip everyone at once, and must have a real alternative that would have done as well — tell me if that's wrong or incomplete.
  3. The misconceptions, and exactly where in the sequence to head each off. The ones I already expect: arbitrary means it doesn't matter, so pick the technically best option; a convention is just a habit, or just a rule nobody happened to write down; we'll announce it in the migration document and it will change; and — a fourth I only half-expect — that people will think the incident three years ago is why the policy is still there. Name the ones I'm missing.
  4. One thing I can have them do or answer in the last ten minutes that would show me they've got the structure rather than the vocabulary, and how I'd tell the difference.
  5. What I should openly refuse to explain in fifty minutes to this audience, and where the temptation to over-explain will be strongest for me.

  Assume they are smart, allergic to theory, and will try to turn every point back into an argument about who should own what. Please don't give me a reading list or citations, and don't quote Lewis: paraphrase the conditions in whatever terms make them usable on a whiteboard.
reasoning: |-
  We are designing a 50-minute session for 25 engineers on how technical conventions form and hold together, using David Lewis's account of convention without the philosophy jargon. The goal is to reframe the design review debate about the retry policy (dead-letter queue vs. backoff) by showing that the current practice is a convention that persists for coordination reasons, not because it's technically superior.

  The core structure of a convention (from Lewis) that we need to convey:
  1. **Regularity**: There's a stable pattern of behavior (e.g., every team uses dead-letter queues for failed messages).
  2. **Mutual expectations**: Each team expects others to follow this pattern, and this expectation is common knowledge (everyone knows that everyone else expects it).
  3. **Arbitrariness**: There's at least one alternative pattern (e.g., backoff retries) that would have worked just as well if everyone had adopted it.
  4. **Coordination reason**: People follow the convention because they want to coordinate with others and expect others to follow it too.

  The wrinkle: There's a dispute about ownership (platform vs. consumer teams) on top of the coordination problem.

  We have two candidate examples:
  - **Example A (retry policy)**: Current practice is dead-letter queues. Alternative is backoff retries. The dispute: who should own the dead-letter queue draining?
  - **Example B (header names)**: Two services must agree on a header name for correlation ID (e.g., `X-Correlation-ID` vs. `Correlation-Id`). There's no dispute, just a clean arbitrary choice.

  We must avoid:
  - Philosophy lectures, formal definitions.
  - Slides (use whiteboard only).
  - Letting the session turn into an ownership debate.

  Plan:

  1. **Order of pieces**:
     - Start with the **concrete case (Example A)** to hook them. Describe the retry policy situation: no written policy, but everyone uses dead-letter queues. Ask: "Why do you think we all do this? Is it because it's the best?" Let them react briefly (2-3 minutes). They'll say things like "because of the incident" or "it's just how we do it".
     - Then, draw out the **core structure** from the case (15 minutes total for this part):
       - **Regularity**: "We all do X (dead-letter queues)."
       - **Mutual expectations**: "I do X because I expect you to do X, and you do X because you expect me to do X. And we both know that we expect this of each other." (Common knowledge is tricky; avoid the term. Say: "We all know that we all expect this.")
       - **Arbitrariness**: "But wait, could we do Y (backoff) instead? Would that work? Yes, if we all switched, it would work. Why don't we? Because we're stuck in X."
       - **Coordination reason**: "We do X because we want to match what others are doing to avoid problems (like the incident)."
     - Now, **repair the word "arbitrary"**. They think arbitrary means "doesn't matter, so we can change it easily". But in conventions, arbitrary means "there's an equally good alternative", but changing is hard because it requires coordination. Point out: "Arbitrary doesn't mean without cost to change. Changing requires everyone to switch at once, or we break things." (Do this right after introducing arbitrariness, in the core structure breakdown.)
     - Then, introduce the **wrinkle (ownership dispute)** and explain that this is a layer on top of the convention. The convention (dead-letter) is in place, but now we have a disagreement about who should maintain the dead-letter queue. This is a separate problem (resource allocation) but it's entangled because changing the convention might resolve the ownership issue (if we switch to backoff, no dead-letter to drain) or might not (if we keep dead-letter, who drains it). However, the convention itself is what's holding the current practice in place.

     Why start with the case? Because engineers are practical. Starting with an abstract definition would lose them. The case grounds the theory. The core structure is drawn from the case, so it comes after the case is introduced.

  2. **Which example to use?** Use **Example A (retry policy)** because:
     - It's real and relevant to their immediate problem.
     - It has the necessary elements: regularity, mutual expectations, arbitrariness (backoff is a real alternative), and a coordination reason (the incident and subsequent coordination).
     - It lacks: a linter (no tool enforcing it), a mandate (no top-down rule), and a single owner who can flip it (because multiple teams are involved).
     - The wrinkle (ownership) is actually an opportunity to show that conventions can have other problems layered on top. We can explicitly separate the convention (which is about the pattern of behavior) from the ownership dispute (which is about responsibility). This makes the example more realistic and shows that conventions can exist even when there are secondary disagreements.

     However, we must be careful not to let the ownership dispute hijack the session. So, when introducing the case, frame it as: "We have two issues: the convention of using dead-letter queues, and the question of who owns the draining. Today, we're focusing on why the convention exists and why it's sticky. The ownership question is important, but it's separate and we can address it after we understand the convention."

     If the ownership dispute becomes too distracting, we can briefly contrast with the cleaner Example B (header names) to show a pure convention without extra layers, but only if necessary.

  3. **Misconceptions and when to head them off**:
     - **"Arbitrary means it doesn't matter, so we can change it easily"**: Head this off when defining arbitrariness in the core structure. Say: "Arbitrary means there's an equally good alternative, but changing isn't free because it requires everyone to switch at once without missteps. If only one service switches, it breaks."
     - **"A convention is just a habit"**: When explaining the core, emphasize that it's not just personal habit; it's a group pattern held together by mutual expectations. Habits are individual; conventions are social.
     - **"It's just a rule nobody wrote down"**: Point out that a rule implies an authority. Conventions emerge without an authority, by mutual adjustment. (Mention that if we had a rule, we wouldn't have a convention; we'd have a rule.)
     - **"We can change it by announcing it in the migration document"**: When discussing the coordination reason, ask: "If we put in the migration document that we're switching to backoff, will every team change their code at exactly the same time? What if one team is late? What if they miss the announcement?" This shows that announcement isn't enough; we need a coordinated switch or a transition plan.
     - **"The incident three years ago is why we do it"**: This is partially true (the origin) but misses why it persists. When discussing the coordination reason, say: "The incident started it, but why does it continue? Because now we expect each other to do it. If the incident were the only reason, we might have changed when we forgot about the incident, but we haven't because of the expectations."
     - **Missing misconception: "We can change it gradually"**: In a system with interdependencies, gradual change might cause inconsistencies. Head this off when discussing the cost of change. Example: If one service switches to backoff but others still expect it to use dead-letter (and maybe their monitoring is set up for dead-letter alerts), it could cause confusion.
     - **Missing misconception: "Conventions are bad because they're arbitrary"**: Point out that conventions are essential for coordination. Without them, we'd have chaos. The problem is when they become maladaptive and hard to change.

  4. **Activity in the last 10 minutes**:
     - Ask them to form small groups (3-4 people) and come up with **another example of a technical convention in our systems** and explain:
       - What is the regularity?
       - What are the mutual expectations?
       - What is the alternative that would work just as well?
       - Why is it hard to change?
     - Then, have one group share. How to tell if they got the structure? They should:
       - Identify a pattern that's followed because others follow it (not because of a rule or technical superiority).
       - Mention expectations (e.g., "We use JSON because we expect others to use JSON").
       - Have a plausible alternative (e.g., "We could use Protocol Buffers").
       - Explain the coordination cost of switching (e.g., "We can't switch one service at a time because we'd break interoperability").
     - If they only use the vocabulary (e.g., "It's a convention") without the structure, or if they pick a practice that's technically mandated (like a linter rule), then they haven't fully grasped it.

  5. **What to refuse to explain**:
     - **The full formal definition of common knowledge** (e.g., "I know that you know that I know..."). It's too abstract. Instead, say: "We all know that we all expect this, and that's enough for our purpose."
     - **The philosophical nuances of arbitrariness** (e.g., whether the alternative is exactly equally good). In engineering, we care about practical equivalence. Avoid the debate about "equally good" by saying: "The alternative works well enough that we could have adopted it if we had started with it."
     - **The entire history of the convention** (e.g., digging into the incident details). We don't need to know how it started to understand why it persists.
     - **The ownership dispute resolution**. This is a separate issue. Say: "Today we're focusing on why the convention exists. We can take the ownership question offline or to the design review."

     The strongest temptation to over-explain will be when defining the core structure. Resist the urge to add more conditions or examples. Stick to the four core elements (regularity, expectations, arbitrariness, coordination reason) and move on.

  **Session Outline (50 minutes)**:

  - **0-5 min**: Introduce the problem. "We're redesigning the messaging layer, and we're stuck on the retry policy. Why do we all use dead-letter queues? Let's figure out why we're stuck." Present the case: no written policy, everyone does it, started from an incident, and the alternative (backoff) exists.

  - **5-20 min**: Draw out the core structure using the retry example on the whiteboard. Label the four elements as you go. Repair "arbitrary" by emphasizing the coordination cost of change.

  - **20-25 min**: Address the wrinkle: "Now, there's another layer: who should own the dead-letter draining? But note: the convention is about the pattern of using dead-letter. The ownership is a separate issue. We can change the convention (to backoff) and avoid ownership, or keep the convention and assign ownership. But the convention itself is what's making the current practice sticky."

  - **25-35 min**: Tackle misconceptions. Ask: "What are some reasons we might think we can change this easily?" and address them one by one (using the whiteboard to list and counter).

  - **35-40 min**: Contrast with a cleaner example (header names) if needed for clarity, but only if the ownership wrinkle caused confusion. Otherwise, skip.

  - **40-50 min**: Group activity: "In groups of three, identify another convention in our systems. Explain: the pattern, the expectations, the alternative, and why it's hard to change." Then, one group shares. Wrap up: "In the design review, we need to recognize that changing a convention requires a coordination plan, not just a technical decision."

  By the end, they should see that the retry policy debate isn't just about technical merit or ownership, but about unwinding a convention that's held in place by mutual expectations. This reframes the problem: instead of "just pick the better option", they must plan a coordinated change.
answer: |-
  ### Plan for the 50-Minute Session  
  **Goal:** Shift the team's perspective from "arbitrary = easy to change" to "convention = coordination-dependent, so change requires strategy." Focus on practical structure, not theory.  

  ---

  #### 1. **Order of Pieces**  
  **Why this order:** Start concrete to hook them, then abstract to generalize. Avoid philosophy jargon—use whiteboard visuals.  
  - **Min 0–7: Open with the retry policy case (Example A)**  
    - Describe the status quo: "Every team uses dead-letter queues (DLQ), but no written policy exists. Teams assume others do the same. Why? Because of an incident 3 years ago."  
    - State the problem: "In design reviews, we call this ‘arbitrary’ and say, ‘Just switch to backoff retries.’ But why hasn’t that happened?"  
    - **Why first?** Engineers engage with real pain points. This creates urgency and avoids abstract theory upfront.  

  - **Min 7–20: Whiteboard the convention structure**  
    - Draw 4 boxes on the board:  
      - **Regularity**: "We all do DLQ today. It’s a stable pattern."  
      - **Mutual Expectations**: "Team A does DLQ because they expect Teams B/C/D to do it. Teams B/C/D do it because they expect Team A to. We all *know* this expectation exists." (Sketch arrows between teams.)  
      - **Arbitrariness**: "Backoff retries would work *just as well* if we all switched. But it’s NOT technically ‘better’—it trades ops work (draining DLQ) for reliability (no stuck consumers)."  
      - **Coordination Reason**: "We keep doing DLQ because changing requires everyone to agree *and* act together. If one team switches alone, chaos!"  
    - **Repair "arbitrary" here** (at 15-min mark):  
      - Say: "‘Arbitrary’ means *either option works if we all agree*. But it’s **not costless to change**—because we’re locked in by expectations. Switching isn’t a technical flip; it’s a coordination puzzle."  

  - **Min 20–30: Address the wrinkle (ownership dispute)**  
    - Add to the board: "Layer 2: Platform vs. team ownership of DLQ draining. This is a *separate problem*."  
    - Explain: "The convention (DLQ) exists because of coordination. The ownership fight is a *resource conflict* on top. Don’t conflate them! Fixing the convention (e.g., switching to backoff) might dissolve the ownership fight. But first, we need to break the coordination deadlock."  
    - **Why keep it?** Real conventions often have extra tensions. Isolating the "coordination core" clarifies what’s fixable.  

  - **Min 30–40: Contrast with the cleaner example (header names)**  
    - Briefly sketch: "Imagine two services: one uses `X-Correlation-ID`, the other `Correlation-Id`. Both work, but we picked one. Switching requires find-and-replace *everywhere at once*—or chaos."  
    - Tie back: "See? No ownership dispute here, but same coordination problem. The retry policy has BOTH: a convention (DLQ) + extra ownership layer."  

  ---

  #### 2. **Which Example to Use?**  
  **Stick with the retry policy (Example A)**. It’s authentic and high-stakes, making the lesson visceral.  
  - **Why it works**:  
    - ✅ Has all required elements:  
      - Regularity (DLQ is universal),  
      - Mutual expectations (teams assume others do DLQ),  
      - Arbitrariness (backoff is viable),  
      - Coordination reason (no one switches alone).  
    - ✅ Lacks: A linter, mandate, or single owner (teams self-organized).  
    - ✅ Real alternative: Backoff retries (tradeoffs exist: throughput vs. ops burden).  
  - **Why avoid the cleaner example (header names) as primary**:  
    - It’s *too* simple. Engineers might dismiss it ("Just run a script!"). The retry policy’s ownership wrinkle adds depth—showing conventions can have "attachment points" for other disputes.  

  ---

  #### 3. **Misconceptions and How to Head Them Off**  
  Preempt these *during the whiteboard breakdown* (Min 7–20) using Socratic questions:  
  - **"Arbitrary means it doesn’t matter, so pick the best option"**:  
    - **When**: Repairing "arbitrary" (Min 15).  
    - **Response**: "If backoff is ‘better,’ why didn’t we switch after the incident? Because ‘better’ for whom? Platform team saves work, but consumer teams inherit risk. *Arbitrary* means *neither is universally superior*—it’s about coordination."  

  - **"A convention is just a habit or unwritten rule"**:  
    - **When**: Explaining mutual expectations.  
    - **Response**: "Habits are personal; conventions are team-scale. If it were just a habit, one team could switch. Why can’t they? Because others *expect* DLQ. Unwritten rules imply authority—here, there’s none."  

  - **"Announcing the change in the migration doc will fix it"**:  
    - **When**: Discussing coordination reason.  
    - **Response**: "What if one team misses the doc? Or migrates late? We’ll have two policies running—breaking the system. Announcements don’t solve coordination; they rely on it."  

  - **"The incident 3 years ago is why we still do this"**:  
    - **When**: Opening the case (Min 0–7).  
    - **Response**: "The incident *started* it, but why does it *stick*? Because now we expect DLQ. If expectations vanished, we’d have drifted by now."  

  - **Missing misconception: "This is a management problem—just dictate the policy!"**:  
    - **When**: Addressing the wrinkle (Min 20–30).  
    - **Response**: "Top-down rules *can* break conventions, but they create new ones. If we dictate backoff, teams must now expect *everyone* to follow the rule. That’s… another convention! Plus, rules fail if teams bypass them."  

  - **Missing misconception: "We can change gradually"**:  
    - **When**: Coordination reason section.  
    - **Response**: "Gradual change = mixed signals. If 19 teams use backoff and 6 use DLQ, how do you handle messages between them? It magnifies complexity."  

  ---

  #### 4. **Closing Activity (Last 10 Minutes)**  
  - **Task**: Groups of 3 brainstorm **another convention from our systems** and identify:  
    - The regularity (what we all do),  
    - Why we expect others to do it,  
    - A viable alternative,  
    - Why switching is hard.  
  - **Example ideas**: Logging formats ("We all use JSON, but XML would work"), auth protocols, or deployment windows.  
  - **How to gauge understanding**:  
    - ✅ **Got the structure**: They describe coordination dynamics (e.g., "We use JSON because others do—switching would break log aggregators").  
    - ❌ **Vocabulary only**: They say "It’s a convention" but can’t explain expectations/coordination, or focus on technical merits alone.  

  ---

  #### 5. **What to Refuse to Explain**  
  - **Refuse**: The formal conditions of "common knowledge" (e.g., "I know that you know that I know...").  
    - **Why**: It’s abstract and derails into philosophy. Instead: "We all see others doing DLQ, so we keep doing it—that’s enough."  
  - **Refuse**: Deep dives into the incident history or ownership resolution.  
    - **Why**: The goal is the convention *mechanism*, not solving the retry policy *today*. Say: "We’ll tackle ownership in the design review—today is about *why* this pattern persists."  
  - **Temptation to over-explain**:  
    - **Where**: When defining "arbitrary." You’ll want to debate technical tradeoffs.  
    - **Resist by**: Focusing on coordination ("Tradeoffs matter, but they’re secondary to the group lock-in").  

  ---

  ### Summary Flow  
  1. **Hook with reality** (retry policy pain).  
  2. **Whiteboard the structure** (regularity → expectations → arbitrariness → coordination).  
  3. **Isolate the wrinkle** (ownership ≠ convention).  
  4. **Generalize with a simpler example** (headers).  
  5. **Activity**: Spot conventions in the wild.  

  **Key reframe**: Conventions aren’t "arbitrary rules"—they’re *equilibria* held together by mutual expectations. Changing them needs coordination, not just docs.
