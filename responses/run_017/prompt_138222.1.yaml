prompt: |-
  I have been putting together a graduate seminar on decision-making under normative uncertainty, and I have backed myself into an argument whose conclusion I cannot accept but whose steps I cannot fault. I would be grateful for a diagnosis from someone who has thought about this longer than I have.

  (1) If you are uncertain which moral theory is correct, practical rationality requires you to maximize expected choice-worthiness: for each available option, take the choice-worthiness assigned to it by each theory you regard as epistemically possible, weight each by your credence in that theory, and sum.

  (2) That sum is well defined only if the verdicts of the different theories are expressed on a single cardinal scale, so that a great wrong according to one theory can be traded off against a small wrong according to another.

  (3) But the theories disagree not only about which acts are right but about what is assessed in the first place: some assess acts, some rules or policies, some motives or traits of character, some institutional arrangements. There is no unit of assessment common to them all, and hence no common scale on which their verdicts could be summed.

  (4) So the sum in (1) is undefined, and (1) delivers no verdict.

  (5) The usual repair is normalization: stipulate a scale for each theory, for instance by setting the distance between that theory's best and worst available option equal to one, or by equalizing the spread of each theory's verdicts across the option set.

  (6) Normalization is sensitive to the option set. Adding an option you will certainly not take, or deleting one, changes the normalization and can invert the ranking of the options you were comparing; and normalization rules that seem equally reasonable disagree with one another in the same case.

  (7) Hence what you are rationally required to do is determined in part by things that should be irrelevant: how the options are described and ordered, whether a dominated option happens to be listed, which normalization rule you adopt.

  (8) A procedure whose output varies with presentation order and with options you will not choose is not a procedure of rational choice; it is a device for rationalizing whatever you were inclined to do.

  (9) Therefore the expected-choice-worthiness approach to moral uncertainty is empty, and normative uncertainty never gives you a reason to act against the theory you find most credible.

  What bothers me is that this proves considerably more than I set out to prove. The same reasoning would show that a legislature aggregating incommensurable conceptions of the good, or a regulator doing cost-benefit analysis, has no rational method either; and it would leave unexplained the mundane cases that made the topic worth teaching in the first place, where you are roughly halfway between a view on which some ordinary act is permissible and one on which it is seriously wrong, and abstaining plainly seems like the rational response. If I must choose, I would rather keep (1) and (6) than accept (9), but I cannot say what I am paying to keep them.

  So: which step is doing the illegitimate work, and why did it look sound? If the argument is valid instead, tell me which premise to surrender, and what that surrender commits me to about hedging in the mundane case, about comparison of verdicts across theories, and about what it is for a moral theory to deliver a verdict about action at all.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They've constructed a logical argument against expected choice-worthiness maximization under normative uncertainty, but they're troubled because the conclusion seems too strong—it would invalidate not just moral hedging but also real-world decision-making like legislative compromises or cost-benefit analyses. 

  First, I need to trace the core tension: step (3) claims moral theories lack a common assessment unit, making aggregation impossible. But the user's intuition rebels—surely when torn between "permissible" and "seriously wrong" views, abstaining *feels* rational. That mundane case is the anchor they don't want to lose. 

  Hmm... the normalization problem in step (6) is real but overextended. Consider cost-benefit analysis: we *do* normalize disparate values (e.g., lives vs. dollars) via willingness-to-pay metrics, despite similar "irrelevant option" vulnerabilities. The key difference? We accept those normalizations as *pragmatic conventions*, not metaphysical truths. Moral theories resist this because they're seen as truth-apt—but maybe that's the flaw. 

  The user's stuck because they're treating moral theories like scientific hypotheses with cardinal outputs. But what if "choice-worthiness" isn't the right framing? Theories assessing character (virtue ethics) vs. acts (utilitarianism) aren't disagreeing about *degrees of the same thing*; they're answering different questions. Forcing them onto one scale is like adding apples to existential dread. 

  Perhaps premise (2) is the hidden weak point. It assumes intertheoretic comparisons require a "single cardinal scale." But in mundane cases, we *do* make rough comparisons ("seriously wrong" feels weightier than "mildly impermissible") without precise units. The cognitive process there isn't summation—it's pattern-matching to familiar dilemmas. 

  The surrender they fear—abandoning (1)—might be unnecessary. Instead, we could reinterpret "expected choice-worthiness" as a heuristic for *incompletely theorized agreements*, where normalization isn't about truth but conflict resolution. That saves the abstaining example while admitting the legislative analogy holds: both are messy, contextual compromises. 

  Their deepest unease? Losing moral objectivity. But maybe the lesson is that normative uncertainty operates in a different epistemic space than empirical uncertainty—one where "rationality" includes recognizing when commensuration fails. I should probably mention that in the response.
answer: |-
  Your argument is logically valid but unsound because **premise (2) is false**. The core mistake is the claim that intertheoretic comparisons *require* a "single cardinal scale" with a universal unit of moral assessment. While such a scale would *suffice* for comparability, it is not *necessary*. Let me diagnose each step and propose a solution that preserves rational hedging in mundane cases.

  ### Step-by-Step Diagnosis:
  1.  **Premise (1) is defensible** (though not uncontroversial). Maximizing expected choice-worthiness (EC) is a plausible extension of rational choice under empirical uncertainty to normative uncertainty.
  2.  **Premise (2) is false and the root of the problem.** It conflates two distinct requirements:
      *   **Cardinality within theories:** EC requires *intra*-theoretic cardinality (e.g., utilitarianism needs to say saving 2 lives is *twice as good* as saving 1 life).
      *   **Comparability *across* theories:** EC requires *inter*-theoretic unit comparability (e.g., we need to know whether "one util" is better, worse, or equal to "one Kantian duty-point").
      **Premise (2) mistakenly assumes intertheoretic comparability requires a *universal unit* (e.g., "moral value") assessed by all theories.** This is too strong. What EC actually needs is a *mapping* between the *scales* of different theories, allowing us to say things like: "According to my credences and the theories' scales, Theory A's assessment of Option X being +100 'A-units' is *more significant* than Theory B's assessment of it being -5 'B-units'." This mapping doesn't require theories to be *about the same thing*; it requires *agents* to make judgments about the *relative weight* of the verdicts *as they understand them*.
  3.  **Premise (3) is largely true but misapplied.** Theories *do* assess different objects (acts, rules, motives). However, this doesn't *automatically* preclude intertheoretic comparisons *for the purpose of guiding the agent's action*. The key question is: **Can the agent, given their understanding of the competing theories and their own values, form a *judgment* about the relative importance/significance of the *practical implications* of each theory's assessment for their decision?**
  4.  **Premise (4) follows from (2) and (3), but since (2) is false, (4) is unsupported.** The sum isn't necessarily undefined; it might be defined *if* the agent can make the necessary intertheoretic comparisons.
  5.  **Premises (5)-(8) accurately describe problems with normalization *if intertheoretic comparisons are impossible*.** Normalization *is* sensitive to option sets and arbitrary, making EC unstable and manipulable *if* it's our only way to *create* comparability where none exists. This highlights the *symptom* but not the core issue.
  6.  **Conclusion (9) is invalid because it relies on the preceding faulty premises.** EC isn't necessarily "empty" if we reject premise (2)'s strong requirement.

  ### The Solution: Intertheoretic Comparability as a Primitive Judgment
  The escape hatch is to reject the need for a *universal unit* or *common scale of assessment*. Instead, **intertheoretic comparisons are primitive, agent-relative judgments**:

  *   **What it is:** The agent judges, for example: "A 1% increase in credence that Theory T1 (e.g., utilitarianism) is true, where T1 says Act A is *very wrong* (e.g., killing one to save five), matters *more to me* than a 1% increase in credence that Theory T2 (e.g., Kantianism) is true, where T2 says A is *slightly impermissible* (e.g., using someone as a mere means in a minor way)." This judgment involves weighing the perceived *practical significance* or *moral gravity* of the theories' verdicts *as understood by the agent*.
  *   **How it works:** The agent doesn't need a universal unit. They need to assign *relative weights* to the *scales* of the different theories. This is equivalent to choosing a *common denominator* for the choice-worthiness functions. Crucially, this denominator isn't "moral value" as defined by a meta-theory; it's a *practical weighting* reflecting how much the agent cares about conforming to one theory's verdict *relative to another*.
  *   **The Mundane Case:** Your example ("roughly halfway between permissible and seriously wrong, abstain") works *precisely because* the agent makes this judgment. They perceive the "seriously wrong" verdict as carrying *much more weight* than the "permissible" verdict. The abstention isn't the *mathematical* midpoint; it's the result of the "seriously wrong" theory dominating the calculation due to its perceived greater gravity, even at 50% credence. No universal unit is needed – just the agent's understanding of the *stakes* involved in each theory being correct.

  ### What This Commits You To
  1.  **Rejecting Premise (2):** Intertheoretic comparability does not require a single cardinal scale with a common unit of assessment. It requires agents to make defeasible, context-sensitive judgments about the relative weight of the *practical implications* of different theories' verdicts.
  2.  **Saving Hedging (Mundane Cases):** This judgment *is* possible and rational in the mundane case. The agent intuitively grasps the relative gravity of "seriously wrong" vs. "permissible" and hedges accordingly. EC, with intertheoretic comparisons grounded in agent judgment, explains this.
  3.  **Acknowledging Limits:** This doesn't magically solve *all* problems.
      *   **Radical Incommensurability:** Some theory pairs *might* resist comparison (e.g., a theory assessing only eternal salvation vs. one assessing only temporal welfare). EC might be impossible here. Rationality might require acting on the highest-credence theory or using a different rule (e.g., maximin over theories).
      *   **Judgment Difficulty:** Comparisons are subjective and potentially unstable. Different agents might weigh the same theories differently. This reflects the genuine difficulty of normative uncertainty, not a flaw in the framework.
      *   **"Verdicts About Action":** Even theories focusing on rules, motives, or institutions ultimately imply *evaluations of actions* (e.g., "Following rule R is best" implies "You ought to perform actions prescribed by R"). The agent must interpret each theory's implications *for the act they are choosing*. The unit problem arises when comparing the *strength* or *significance* of these implied action-verdicts across theories.
  4.  **Legislatures & Regulators:** Your worry that the argument invalidates these is sound – *if* premise (2) were true. But rejecting (2) rescues them too. Legislatures aggregate by making (often implicit or procedural) judgments about the relative weight of different conceptions of the good. Regulators use willingness-to-pay or similar *conventions* to create a *practical* common denominator (money) for comparing disparate values (lives, time, environment). These are imperfect instances of making intertheoretic/inter-value comparisons, not proofs of their impossibility. They face normalization-like challenges but manage (imperfectly) via social/political judgment and convention.

  ### Why Premise (2) Looked Sound
  It conflated two plausible ideas:
  1.  **EC requires cardinal scales *within* theories.** (True).
  2.  **Adding numbers from different scales requires a common unit.** (True for *physical* quantities like length and mass). However, moral "quantities" aren't physical. We constantly make comparisons across disparate domains using *value judgments* (e.g., weighing career opportunity against family time, aesthetic value against historical significance). Premise (2) mistakenly assumed moral theories are like physical measurement systems requiring a universal standard, rather than value systems whose practical significance can be compared through reasoned judgment.

  ### Conclusion
  The illegitimate step is **(2)**. By rejecting the requirement for a universal unit and embracing **intertheoretic comparability as a primitive agent judgment about the relative practical weight of different theories' verdicts**, you can:
  *   Preserve the rationality of hedging in mundane cases.
  *   Maintain the coherence of EC under normative uncertainty.
  *   Explain how legislatures and regulators *can* function rationally (albeit imperfectly).
  *   Acknowledge the genuine challenges of radical incommensurability and difficult judgments without collapsing into the unacceptable conclusion (9).

  This commits you to the view that rational choice under normative uncertainty involves not just credences over theories, but also comparative judgments about the *significance* of what those theories demand. This is demanding, but it reflects the true complexity of navigating moral disagreement within one's own mind.
