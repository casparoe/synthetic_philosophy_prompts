prompt: |-
  I sit on a hospital clinical ethics committee: roughly forty consults a year, usually answered within a day or two and signed off by the chair; the rest of us are clinicians, a nurse and a lay member, and none of us has any philosophy training. Again and again we are told what we morally ought to do by someone else — a senior intensivist, a specialist, a chaplain or faith leader, a hospital policy, or an outside expert — and I want a decision procedure we could run in the room, in under an hour, for when we should defer to that moral testimony and when we must work the judgment out for ourselves and own it. Ground it in what the epistemology of moral testimony actually says — the worry that taking another person's moral judgment as a reason is suspect in a way that taking their factual judgment is not, because moral understanding is not the kind of thing testimony can hand over — but make it usable by people who have never heard of the debate: give the questions in order, what counts as a sufficient answer to each, where the procedure refuses to allow deference, and where it hands the question to the full committee because what is at issue is which values to weight rather than what the facts are. It has to handle what I will call the entanglement problem: a single remark from one source often carries both a factual judgment only that source is placed to make (a prognosis, a claim about what the patient would have wanted) and a moral verdict, and it is not clear whether deferring to the one is deferring to the other. Then apply the procedure to three cases: a senior intensivist who says continued ICU treatment is futile and therefore must stop; a faith leader and a hospital policy speaking to a Jehovah's Witness adolescent who refuses a blood transfusion; and an outside expert's proposed ranking of patients for a scarce device. In at least one of them give an answer we will not want — my guess is the futility case, where we would find it easiest to treat the judgment as clinical and defer to it — and close by saying plainly what the procedure cannot settle.
reasoning: |-
  Okay, the user is on a hospital clinical ethics committee without formal philosophy training. They need a practical decision procedure for when to defer to moral testimony versus making their own judgment. Key points: must be usable in under an hour, handle "entanglement" of factual/moral claims, and apply to three real cases.

  First, I need to unpack the core problem: moral testimony epistemology suggests you can't truly "borrow" moral understanding like factual knowledge. But in clinical settings, they constantly get mixed judgments (e.g., "futile treatment must stop" blends prognosis with ethics). The user wants to disentangle this reliably.

  The procedure should probably start by separating facts from values. Step 1 could be: "Is this purely factual?" If yes, defer to expertise. If no, move to Step 2: "Is the moral component using standard values we already accept?" (Like "don't cause harm"). If yes, deference might be okay. But if it's about weighting conflicting values (Step 3), committee must deliberate themselves.

  For the entanglement problem, I'm thinking we force a "disentanglement drill": make the source explicitly state the factual premise ("this treatment won't achieve medical goals") separately from the moral leap ("therefore it's wrong to continue"). That exposes where deference stops.

  Applying this to their cases... The futility example will be toughest. The intensivist says "must stop" - but "futile" is a value-laden term masking a moral judgment. The procedure should flag this as non-deferrable, which they won't like because it's clinically convenient. 

  Jehovah's Witness case is clearer: chaplain's religious doctrine isn't the hospital's value system, and the minor's maturity is a factual question. Policy gives the weighting framework - so committee applies policy to facts. 

  Scarce device ranking: outside expert can provide risk/benefit data, but not decide which values (equity vs. efficacy) should dominate. Committee must own that choice.

  End by acknowledging limits: the procedure can't resolve fundamental value conflicts or absolve committees of responsibility when values collide. It just forces transparency about where moral ownership lies.

  ...Wait, did I make Step 3 too vague? Need concrete thresholds. Maybe specify that if value weighting involves trade-offs between core principles (autonomy vs beneficence etc.), it automatically goes to committee. Also adding examples in the decision tree will help non-philosophers.
answer: |-
  Here’s a practical, step-by-step **Moral Testimony Assessment Protocol (MTAP)** for your committee, grounded in moral epistemology but stripped of jargon. It addresses the entanglement problem and flags when deference is ethically suspect. Use it in ≤60 minutes by following the questions sequentially.

  ---

  ### **The MTAP Decision Procedure**  
  *(Run these questions in order during consult discussion)*  

  1. **IS THE CLAIM PURELY FACTUAL?**  
     - *Ask:* "If we removed all moral language, what observable/measurable facts remain?"  
     - *Sufficient answer:* Concrete evidence (e.g., lab results, statistical prognosis, verified patient statements).  
     - *Deference allowed?* **YES** to relevant experts (e.g., intensivist on survival odds).  
     - *Entanglement fix:* Require sources to separate facts from moral conclusions (e.g., "Treatment has <5% success" ≠ "It’s wrong to continue").  

  2. **IS THE MORAL VERDICT BASED ON VALUES WE ALREADY ACCEPT?**  
     - *Ask:* "Does this judgment rely solely on principles in our hospital charter, policies, or prior committee rulings?"  
     - *Sufficient answer:* Direct citation of established agreements (e.g., "Policy 4.3 prohibits X").  
     - *Deference allowed?* **YES, if unambiguous**.  
     - *Red flag:* If the source adds new values (e.g., "God demands this" when policy is secular).  

  3. **DOES THIS REQUIRE WEIGHTING CONFLICTING VALUES?**  
     - *Ask:* "Are there competing ethical principles at stake (e.g., autonomy vs. beneficence) that aren’t pre-resolved?"  
     - *Sufficient answer:* None—**this always goes to the committee**.  
     - *Deference forbidden?* **YES**. Moral understanding requires *your* engagement in weighing.  
     - *Output:* Committee deliberation mandatory.  

  4. **COULD THE SOURCE HAVE ULTERIOR MOTIVES?**  
     - *Ask:* "Might institutional pressure, bias, or non-moral interests influence this testimony?"  
     - *Sufficient answer:* Evidence of conflict (e.g., bed shortages, ideological agenda).  
     - *Deference allowed?* **NO** if credible concerns exist.  

  5. **IS THIS A "MORAL EMERGENCY" REQUIRING IMMEDIATE ACTION?**  
     - *Ask:* "Will delay for deliberation cause direct harm?"  
     - *Sufficient answer:* Imminent risk to life/health.  
     - *Deference allowed?* **Tentative YES**, but revisit post-crisis.  

  ---

  ### **Application to Cases**  
  **Case 1: Intensivist’s Futility Claim**  
  - *Statement:* "Continued ICU treatment is futile and must stop."  
  - **MTAP Analysis:**  
    1. **Factual?** Prognosis (e.g., "0% chance of recovery") is factual → *defer to clinical expertise*.  
    2. **Values we accept?** "Must stop" implies a moral weight (e.g., "non-beneficence = wrong"). *But* "futility" often smuggles values (e.g., "unworthy of resources").  
    3. **Weighting values?** YES — beneficence vs. autonomy/sanctity of life.  
    4. **Ulterior motives?** Possibly (e.g., bed scarcity).  
  - **Verdict:** **Do NOT defer**. Entanglement hides a moral judgment the committee must own. *Unwanted answer:* The intensivist’s "must" is moral testimony; you cannot outsource it.  

  **Case 2: Jehovah’s Witness Adolescent & Blood Transfusion**  
  - *Sources:* Faith leader ("Transfusion violates God’s law"), Policy ("Honor mature minors’ refusals").  
  - **MTAP Analysis:**  
    1. **Factual?** Patient’s capacity/sincerity is clinical → *defer to psych assessment*.  
    2. **Values we accept?** Policy endorses autonomy → *defer to policy*.  
    3. **Weighting?** Faith leader adds *new* value ("divine law") → **reject deference**.  
    4. **Motive check?** Faith leader advocates doctrine (expected).  
  - **Verdict:** Defer to policy/facts on capacity; *ignore* faith leader’s moral testimony. Committee role: Apply policy to facts.  

  **Case 3: Outside Expert’s Scarce Device Ranking**  
  - *Statement:* "Prioritize Patient A over B due to superior utility."  
  - **MTAP Analysis:**  
    1. **Factual?** Survival odds/outcomes data → *defer*.  
    2. **Values we accept?** "Utility" may conflict with equity, need, or fairness → **not pre-resolved**.  
    3. **Weighting?** YES — efficiency vs. justice.  
    4. **Motive?** Expert may favor efficiency bias.  
  - **Verdict:** **Reject moral ranking**. Use expert’s facts but committee must weight values.  

  ---

  ### **What MTAP Cannot Settle**  
  The procedure **cannot resolve foundational value conflicts** (e.g., "Is sanctity of life absolute?"). When values are irreconcilable (e.g., religious liberty vs. best medical interests), MTAP forces *transparency* about the dispute but mandates the committee owns the choice—**no moral outsourcing**.  

  **Final Note**: MTAP treats moral understanding like surgical skill: you wouldn’t let another surgeon operate *for you* without losing expertise. When values clash, your committee must scrub in.
