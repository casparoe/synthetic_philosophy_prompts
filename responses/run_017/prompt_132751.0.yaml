          Alternatively, as β increases, the optimal q should move toward 1/n? 

          Let us consider the derivative of V(q) with respect to q. We want to find q that maximizes V(q). The function is complicated, but we can see that for large β, the term (β-1)*(1-q)^{n-1} dominates. The maximum of this term occurs when q=0? But that is not feasible in the interior. 

