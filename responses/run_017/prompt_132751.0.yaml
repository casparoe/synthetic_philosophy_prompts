          So what is the resolution? 

          I think the superrational solution for the true Platonia dilemma (with the rule: only exactly one claimant gets the prize, otherwise no one gets anything) is not derived by maximizing an individual's expected payoff in the usual sense. Instead, it is derived by maximizing the overall probability of awarding the prize (i.e., P(exactly one claimant)), which is a collective objective. 

          Therefore, for the true Platonia dilemma, the superrational players choose q=1/n because it maximizes the collective chance of success. This is a form of Kantian optimization: choose the action that, if everyone does the same, leads to the best outcome for the group. 

          In our hybrid model with the continuous rule (where entrants share the prize when there are multiple), the players are maximizing their own expected payoff. This is a different objective. 

