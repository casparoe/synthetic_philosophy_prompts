prompt: |-
  I sit on the clinical ethics committee of a hospital with an active epilepsy surgery programme, and it is my turn to draft the memo for Thursday's meeting. I've read a fair amount of blog-level material on split-brain cases, so please don't spend the memo establishing why the case is philosophically interesting; two of our members already know enough to use the words "person" and "subject of experience" at each other. What I need is a bottom line and the argument for it.

  The patient is 44 and had a complete corpus callosotomy eleven years ago for drug-resistant epilepsy. He now has a slow-growing left frontal tumour; his surgeon wants to resect within about three weeks and puts the cost of a further month's delay at a few additional points of risk of permanent expressive-language deficit. Verbally he consents clearly and repeatedly, and he passes our ordinary capacity interview. But when neuropsychology presented the choice separately to each hemisphere — options flashed briefly to one visual field while he fixated, answered with the hand on that side — the split was stable across three sessions: right field, right hand, and voice say operate; left field and left hand say do not. Shown recordings of himself answering both ways, he said the left hand "just does that sometimes," then, writing with his left hand, asked us not to let the surgeons cut. Our neuropsychologist cautions that left-hand responding in these patients is noisy: intermanual conflict and alien-hand phenomena can produce behaviour that carries no preference at all.

  Two further facts. Three years ago, before any of this was foreseeable, he signed a directive saying that if his left hand ever appeared to contradict him, the hand should be disregarded rather than treated as a second opinion. His wife says the opposite, and cites an episode two years ago in which his left hand refused a medication he had verbally accepted and he later, by left hand, thanked her for having it stopped.

  Please draft the memo I will circulate. It should recommend a concrete course — operate on schedule, operate only after some further protocol, or transfer the decision to a surrogate — with a time frame and conditions; it should say plainly what we would be overriding if we proceed on his verbal consent alone; and it should say what evidence would justify treating the left-hand responses as the patient's own refusal rather than as motor noise, and how much weight his earlier directive deserves given that he wrote it without envisaging this situation.
reasoning: |-
  Okay, the user is part of a hospital's clinical ethics committee dealing with a complex case involving a split-brain patient. They need a memo draft for an upcoming meeting. Let me unpack the key elements.

  First, the patient had a corpus callosotomy 11 years ago and now has a left frontal tumor requiring surgery. The verbal consent is clear, but when tested separately, the right hemisphere (via left hand) consistently refuses surgery. There's also a prior directive from the patient about ignoring left-hand contradictions, but the wife counters this with an anecdote where the left hand was correct.

  Hmm... the core tension is between respecting verbal consent versus potential refusal from the disconnected right hemisphere. The neuropsychologist notes left-hand responses can be unreliable ("motor noise"), which complicates interpretation. The three-year-old directive adds another layer, though its applicability to this specific medical decision is questionable.

  The user wants concrete recommendations with timeframes. They also need clarity on what's being overridden if proceeding verbally, the evidentiary threshold for taking left-hand responses seriously, and how to weigh the old directive.

  I should structure this carefully. The memo must balance:
  - Medical urgency (delaying increases language deficit risk)
  - Neuropsychological complexity (interpreting hemispheric conflict)
  - Ethical principles (autonomy, beneficence, consistency with past directives)

  The wife's anecdote suggests the left hand may sometimes express genuine preferences, but that episode involved medication refusal - different context than brain surgery. The directive specifically mentions disregarding left-hand contradictions, though it predates this tumor scenario.

  Key considerations:
  1. Current verbal consent is unambiguous and passes capacity assessment
  2. Left-hand refusal is stable but potentially unreliable
  3. Surgery delay carries measurable risks
  4. Directive exists but may not cover this scenario
  5. Spousal testimony introduces some doubt

  Given the time sensitivity and higher stakes of brain surgery versus past medication decisions, I lean toward honoring verbal consent. But we should acknowledge the ethical weight of what's being overridden - the possibility of an unintegrated preference. The neuropsychologist's caution about "noisy" data supports this approach.

  For future cases, we might develop better assessment protocols, but that won't help this urgent decision. The directive should be noted but not determinative since the patient couldn't have envisioned this exact scenario when writing it.

  The recommendation should be to operate on schedule with verbal consent, while documenting the ethical reasoning transparently. This respects current expressed wishes and minimizes medical risk, though it involves a defensible override of ambiguous contradictory signals.
answer: |-
  **MEMORANDUM**  
  **TO:** Clinical Ethics Committee  
  **FROM:** [Your Name/Position]  
  **DATE:** [Current Date]  
  **SUBJECT:** Ethical Recommendation for Case # [Patient ID] - Split-Brain Patient with Frontal Tumor  

  ### **I. RECOMMENDATION**  
  **Proceed with tumor resection on schedule (within 3 weeks) based on the patient’s explicit verbal consent.**  
  - **Timeframe:** Surgery to occur as medically indicated (within 3 weeks).  
  - **Conditions:**  
    1. Reaffirm verbal consent immediately pre-procedure using strict capacity protocols.  
    2. Document the ethical justification (detailed below) in the medical record.  
    3. Neuropsychology to formally assess for acute intermanual conflict/alien-hand phenomena on the day of consent reaffirmation.  

  ### **II. BOTTOM LINE**  
  The patient’s repeated, capacitated verbal consent overrides ambiguous non-verbal signals from the left hand. Proceeding honors his current autonomous expression while aligning with his prior directive to disregard left-hand contradictions. Delaying surgery imposes unjustified clinical risk given the unreliability of hemispheric testing in this context.  

  ---

  ### **III. ARGUMENT**  

  #### **A. Why Verbal Consent Prevails**  
  1. **Established Capacity & Current Expression:**  
     - The patient passes standard capacity assessments and *repeatedly* consents verbally. His coherence ("the left hand just does that sometimes") confirms understanding of the conflict.  
     - **What we override:** *Potential* preferences of the isolated right hemisphere. However, the left-hand responses:  
       - Are clinically unreliable per neuropsychology ("noisy," may reflect motor phenomena, not preference).  
       - Lack corroboration as *refusal* (e.g., no consistent affective distress during testing).  
     - *Ethical weight*: Current verbal statements reflect integrated agency; isolated hemispheric signals do not meet thresholds for "refusal" absent clear evidence of distress or harm.  

  2. **The Patient’s Prior Directive is Decisive:**  
     - His signed directive explicitly instructs disregarding left-hand contradictions.  
     - **Weight of the directive:** High, despite being written pre-tumor:  
       - It directly addresses hemispheric conflict scenarios.  
       - His writing of it *with his left hand* demonstrates intentionality about hemispheric disunity.  
       - It represents a settled prior value: unified verbal expression over fragmented non-verbal signals.  

  3. **Medical Urgency Tolerates No Delay:**  
     - Each month’s delay increases risk of permanent language deficits. No further testing protocol justifies this risk given:  
       - The stability of verbal consent.  
       - The unreliability of hemispheric testing.  

  #### **B. Counterarguments Addressed**  
  1. **Wife’s Anecdote (Left Hand Refusing Medication):**  
     - Isolated to a lower-stakes decision (medication vs. brain surgery).  
     - Does not negate the patient’s directive or current verbal consent.  
     - Highlights alien-hand phenomena (e.g., involuntary refusal) rather than proving reasoned refusal.  

  2. **"What If the Right Hemisphere is Refusing?"**  
     - **Evidence required to treat left-hand refusal as valid:**  
       - Consistency *across modalities* (e.g., left-hand writing + observed distress + affective congruence).  
       - Exclusion of motor pathology via standardized alien-hand assessments.  
       - Integration with neuroimaging (e.g., fMRI showing right-hemisphere emotional activation during refusal).  
     - **Current evidence fails this threshold:** Responses are unilateral (left-hand only), and neuropsychology cautions against interpreting them as volitional.  

  ---

  ### **IV. CONCLUSION**  
  Respect for autonomy prioritizes the patient’s *capacitated, current verbal choice* and his *prior written directive*. The left-hand signals do not constitute a valid refusal under clinical or ethical standards. Proceeding upholds the patient’s values (per his directive) and prevents harm from delay. **Recommendation: Operate on schedule with documented verbal consent.**  

  ---  
  **APPROVED:** [Your Name]  
  **REFERENCE:** Patient Directive Dated [Date], Neuropsych Report [Date], CEC File # [Number]
