  | **Wakefield (Harm. Dysf.)**| ❌ (Harm req.) | ⚠️ (Case i/ii) | ✅ (Dysf. core)  | ✅ (Dysf. early)  | ⚠️       | ❌ (Func theory)   | **Fails Harm-Indep (core).** Env Sens? Harm eval challenges Univ.     |
  | **Normativist (Vital Goals)**| ❌ (Harm core) | ⚠️ (Possible) | ❌ (Stats irrel?) | ⚠️ (Possible)     | ❌       | ✅ (No bio func?)  | **Fails Harm-Indep & Univ.** Stats Insuff irrelevant? Env Sens possible but values challenge Univ. |
