prompt: |-
  I'm in the third-year seminar on consciousness at a UK philosophy department, and this term we have a peer-marking exercise: each of us has been given one anonymised script from the mid-term and asked to mark it against the rubric the seminar leader set. Mine is on epiphenomenalism and the paradox of phenomenal judgment. I've read it four times now and I genuinely cannot tell whether it's a first-class answer or a fluent one that quietly conflates two things and slips a step — I don't want to reward confident prose, so I'd be grateful for a second reading from someone who knows the literature. I haven't formed a view on it and I don't want to lead you, so I'm giving you the question as set and the script verbatim.

  The question as set (out of 100; bands are below 40 fail, 40–59 pass, 60–69 upper second, 70+ first, and the rubric says to reward accurate statement of the view and of the paradox, correct allocation of the dialectical work to the arguments that actually do it, engagement with the contrastive variant, and care in the individual inferential steps):

  "Epiphenomenalism about phenomenal consciousness holds that phenomenal states are caused by physical processes but cause nothing outside the phenomenal domain. The paradox of phenomenal judgment is the worry that this view undermines its own motivation: my judgment that I am conscious — the judgment on which the case against physicalism appears to rest — cannot itself have been caused by my being conscious. In the seminar we distinguished two readings of 'phenomenal judgment': the propositional reading, on which it is a belief with the content that one is in such-and-such phenomenal state, and the experiential reading, on which it is a judgment episode that itself has phenomenal character. We also considered a variant I called contrastive epiphenomenalism: phenomenal states cause nothing non-phenomenal, but they may cause other phenomenal states (an experience causing a later memory-experience of it, for instance). Assess whether contrastive epiphenomenalism, together with the experiential reading of phenomenal judgment, escapes the paradox, or whether the paradox is untouched by these moves. In your answer say what work the distinction between causal explanation and epistemic justification is doing, and whether an epiphenomenalist who concedes the paradox has thereby refuted herself."

  The script I have to mark (anonymised, submitted as a single paragraph set out in sections):

  Epiphenomenalism is the thesis that phenomenal properties are causally inert with respect to the non-phenomenal: they are produced by physical processes but produce nothing outside the phenomenal domain. It is standardly motivated by two premises together — the causal closure of the physical, and a principle of causal exclusion that rules out the systematic overdetermination of physical effects by both physical and phenomenal causes. Given both, whatever causal work consciousness appeared to do is already done by its neural basis, and consciousness drops out as an idle wheel: the whistle on the engine, which makes a noise but drives nothing.

  The paradox of phenomenal judgment is that this saws off the branch the view is sitting on. The case for taking phenomenal consciousness as something over and above the physical begins from our own case: I judge that I am in pain, and it is that judgment the physicalist is accused of being unable to accommodate. But if my being in pain causes nothing, then my judgment that I am in pain is not caused by my being in pain, and the same two premises apply to it: the judgment has a complete physical cause and the pain is excluded from the story. It matters here to distinguish causal explanation from epistemic justification; the paradox is not that my judgment lacks a cause, since of course it has a neural one.

  Contrastive epiphenomenalism — phenomenal states cause nothing non-phenomenal, but may cause further phenomenal states — looks like it helps, and on the experiential reading I think it dissolves the paradox outright. On that reading the judgment that I am in pain is not a bare belief standing outside the phenomenal domain; it is itself an episode with phenomenal character, rather like the experience of its seeming to one that one is in pain. Since it is a phenomenal state, the earlier pain is permitted to cause it, and so the epiphenomenalist can say after all that my being in pain is what produces my judgment that I am in pain. The causal chain the paradox said was missing is restored, and with it the explanation of why my judgments about my own consciousness are reliable. Contrast the propositional reading, where the judgment is a belief with content and so falls outside the phenomenal domain: there the paradox does bite, and the epiphenomenalist must fall back on saying that the belief is made true by, and non-causally constitutively tied to, the pain.

  Two further points. The evolutionary worry — that natural selection could never have reached a causally inert property — is not much of an objection, since the epiphenomenalist can say that selection operated on the neural processes and consciousness came along as a by-product of them. And if the epiphenomenalist cannot answer the paradox, she has refuted herself: a position that removes the justification for believing its own central premise is not one that can be held. That, in the end, is why the knowledge argument and epiphenomenalism stand or fall together — Mary's acquisition of a new fact just is her acquisition of something causally inert.

  What I need from you:

  1. A mark out of 100, with one line saying which band it falls in and why.
  2. Point-by-point comments I can paste into the marking sheet, keyed to the script in order: for each substantive move, whether it is correct, and where it is not, what exactly goes wrong. I'm especially concerned about whether the treatment of the experiential reading rests on a conflation, and about whether that closing paragraph gets the dialectic right — please be specific about which claim each argument actually supports, rather than saying something is "a bit quick".
  3. A note on severity, so I can calibrate: which of the problems you find, if any, are the kind of thing that should cost marks in a third-year script, and which are infelicities I should mention in the margin without penalising.

  Epistemically: please separate, in your comments, what is settled or close to orthodoxy among people who work on this from what is genuinely contested. I don't want to hand a student feedback that presents one side of a live dispute as the consensus — where specialists really do disagree, tell me that, and either suggest a comment that flags the disagreement instead of adjudicating it, or state clearly that the line is your own view. Please also flag anything you are not confident about rather than guessing, since I can check with the seminar leader. No references or reading are needed; I only need the mark and the comments. Please write in British English.
reasoning: |-
  Okay, the user is a third-year philosophy student marking a peer's essay on epiphenomenalism and the paradox of phenomenal judgment. They're struggling to assess whether the script is first-class or if it has subtle flaws, particularly around the experiential reading and the closing paragraph. 

  First, I need to understand their core anxiety: they don't want to reward "confident prose" that masks conceptual slippage. The stakes are high because peer-marking affects grades, and they're ethically wary of misjudging. Their request is meticulously structured—they want band justification, point-by-point analysis, and calibration guidance. 

  The script itself is impressively fluent. Let me dissect it section by section. The opening definition of epiphenomenalism is textbook-perfect—no issues there. The paradox explanation is also robust, especially the causal vs. epistemic distinction. 

  Now the critical part: the experiential reading solution. The script claims contrastive epiphenomenalism dissolves the paradox because the judgment-as-experience can be caused by pain. But here's the rub: even if the *episode* has phenomenal character, its *content* ("I am in pain") must still be *about* the pain. Causing the judgment-episode doesn't automatically justify its accuracy—the pain could cause a phenomenally-rich but *false* judgment. This is the conflation: merging the causal genesis of the experience with the epistemic grounding of its truth. 

  The closing paragraph is sharper. The evolutionary point is correctly defused, but the Mary/knowledge argument link is more contentious. While some tie them together (Chalmers comes to mind), others see Mary as separable—physicalists might accept epiphenomenalism without conceding Mary's new knowledge. I should flag this as disputed territory. 

  For marking: the core conflation is a significant oversight at this level—it undermines the central argument. I'll dock marks there but acknowledge the script's strengths elsewhere. Band-wise, it's high 60s: sophisticated but with a critical flaw. 

  Calibration note: In third-year work, we expect precision on pivotal moves. The conflation isn't a minor slip—it's the linchpin of the proposed solution. The Mary point is more forgivable as advanced territory. 

  Ethically, I'll avoid presenting contested claims as consensus. The Mary-epiphenomenalism link gets a "some argue" disclaimer. The rest is standard analytic philosophy toolkit.
answer: |-
  Here is a detailed assessment of the script based on the rubric and your requirements. I've structured it per your request, separating settled points from contested ones and flagging uncertainties.

  ---

  ### 1. Overall Mark and Band  
  **68/100 (Upper Second Class)**  
  **Why:** The script accurately defines key concepts and structures the dialectic well. It engages effectively with the contrastive move and experiential reading but makes a significant error in conflating *causation of a judgment-episode* with *epistemic justification of its content*, undermining its core argument. Strengths in clarity and scope balance this flaw, but the error prevents a first-class mark.

  ---

  ### 2. Point-by-Point Comments  
  *(Keyed to script sections, with [✓] = correct, [✗] = incorrect, [?] = contested/needs nuance)*  

  > **§1: Epiphenomenalism definition and motivation**  
  > [✓] **Accurate and clear.** Correctly states epiphenomenalism, causal closure, exclusion principle, and the "idle wheel" analogy. No issues.  

  > **§2: Paradox of phenomenal judgment**  
  > [✓] **Strong exposition.** Correctly identifies the paradox’s core: epiphenomenalism undermines the causal basis of the anti-physicalist judgment.  
  > [✓] **Crucial distinction noted.** Properly separates causal explanation (judgment has physical cause) from epistemic justification (whether judgment is *about* consciousness).  

  > **§3: Contrastive epiphenomenalism + experiential reading**  
  > [✗] **Conflation error.** Correctly states that contrastive epiphenomenalism *allows* pain to cause the judgment-*episode* (as a phenomenal state). **However**, it incorrectly assumes this *causal link* resolves the **epistemic justification problem**.  
  > - **What’s wrong:** Even if pain causes a phenomenally rich judgment-episode, this does not explain why the *content* ("I am in pain") is *accurate* or *reliable*. The judgment could be caused by pain but misrepresent it (e.g., pain causes a judgment that "I feel nauseous") or be non-veridical. The paradox requires explaining *how we know* consciousness exists, not just that judgments about it occur.  
  > [✓] **Propositional reading contrast:** Correctly notes the paradox remains here.  

  > **§4: Evolutionary worry + self-refutation**  
  > [✓] **Evolutionary point:** Correctly dismisses the objection – standard epiphenomenalist reply.  
  > [✓] **Self-refutation claim:** Correctly states that if the paradox stands, epiphenomenalism refutes itself by removing justification for belief in consciousness.  
  > [?] **Mary/knowledge argument link:** *Contested claim*. While some link epiphenomenalism to the knowledge argument (e.g., Chalmers), others argue Mary could acquire *knowledge-that* without phenomenal causation (e.g., physicalists like Dennett). The script presents this as settled; it is not.  

  ---

  ### 3. Severity and Calibration  
  - **Costs marks (significant flaws):**  
    - **Conflation in §3 (causal vs. epistemic):** **-10 marks.** This is a critical error for the essay’s central argument. At third-year level, students must recognise that causing a judgment ≠ justifying its truth. The rubric explicitly requires "care in inferential steps" and "dialectical work" – this misses both.  
    - **Unqualified Mary/knowledge argument link:** **-2 marks.** Overstates a contested point as definitive.  
  - **Infelicities (mention without penalty):**  
    - None major. The prose is fluent and structure clear. Minor tightening (e.g., "saws off the branch" is colloquial) is stylistic, not substantive.  

  ---

  ### 4. Epistemic Notes  
  - **Settled/Orthodoxy:**  
    - Definitions of epiphenomenalism, causal closure, exclusion principle (§1).  
    - Core structure of the paradox (§2).  
    - Contrastive epiphenomenalism *permits* phenomenal-to-phenomenal causation (§3).  
    - Evolutionary worry dismissal (§4).  
    - Self-refutation threat if paradox holds (§4).  
  - **Contested:**  
    - Whether experiential reading + contrastive move resolves the paradox (§3). *Specialists disagree*: Some (e.g., Horgan) argue it helps; others (e.g., Kim, Kriegel) insist epistemic justification remains unresolved.  
    - Knowledge argument’s dependence on epiphenomenalism (§4). *Live dispute* – physicalists (e.g., Loar, Papineau) deny this link.  
  - **Uncertainty/Recommendation:**  
    - For §3’s contested point: Feedback should say, "Your solution assumes causing the judgment-episode justifies its accuracy, but this is disputed; prominent objections (e.g., from Kim) note that causation alone doesn’t guarantee veridicality."  
    - For §4’s Mary link: "The connection you draw between epiphenomenalism and the knowledge argument is debated; some physicalists reject this dependence."  

  ---

  ### Summary for Marking Sheet  
  **Strengths:**  
  - Precise definitions of epiphenomenalism, contrastive variant, and the paradox.  
  - Excellent grasp of causal vs. epistemic distinction.  
  - Clear engagement with contrastive move and experiential/propositional readings.  
  - Effective dismissal of evolutionary worry.  

  **Weaknesses:**  
  - **Major:** Assumes causing a phenomenal judgment-episode resolves epistemic justification (§3). This conflation undermines the core argument.  
  - **Minor:** Overstates the Mary/epiphenomenalism link as settled (§4).  

  **Band Justification:**  
  Upper second (68) due to conceptual clarity and dialectical awareness, but the central argument fails on a key inferential step expected at this level. A first-class script would not make this error.  

  ---  
  **British English Check:** Done (e.g., "neural" not "nervous", "judgement" variant accepted, "dialectic" used appropriately).  

