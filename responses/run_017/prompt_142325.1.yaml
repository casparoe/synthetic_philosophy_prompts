prompt: |-
  I keep going back and forth with a friend about whether the importance / tractability / neglectedness frame is actually any good, so I want to test it on a case instead of trading intuitions. Take WHO's smallpox eradication, and specificaly the decision to launch the intensified programme in 1967 (roughly two million deaths that year, certified gone by 1980) at a moment when the flagship global campaign was the malaria eradication effort started in the 50s, which had most of the money and staff and obviously failed -- malaria still kills several hundred thousand people a year.

  Set it up as a funder in 1966 scoring both causes on the three axes using whatever concrete proxies you'd actually reach for, then tell me which cause the framework picks and what it would have said about the smallpox decision we now know was the right one.

  The parts I care about, because I think this is where the frame is silently mis-specified:

  - Importance as a flow vs. eradication as a one-shot. Does anything built around annual burden systematically underrate "you can end this, permanently"? And what happens to neglectedness-as-a-proxy-for-diminishing-returns when the last handful of countries are the most expensive per case averted?
  - Tractability of a cause vs. tractability of the method you happen to have. The strategy that worked -- surveillance and containment rather than hitting some mass-vaccination coverage target -- hardly existed as a strategy when the programme was approved. So was ex ante tractability just low, and does that mean ITN is biased toward causes that already have a working intervention?
  - The "who else would have paid" question. A lot of the push came from rich countries that wanted to stop footing the bill for routine vaccination and quarantine. Was smallpox even neglected in the sense the framework needs, or just unglamorous to funders with self-interested reasons?
  - Whatever has no slot in the frame: the programme left behind vaccine logistics, surveillance networks and trained field epidemiologists that later campaigns borrowed. Call it option value or capacity, but where does it go?

  Where the framework is genuinely silent, say so instead of stretching it. And finish on the survivorship worry: are we only holding smallpox up as the poster child because it won? Under 900 words, no citations, nothing looked up.
reasoning: |-
  Okay, the user wants me to apply the Importance/Tractability/Neglectedness (ITN) framework to the smallpox eradication decision in 1967 compared to malaria eradication. They're skeptical about whether ITN actually works, especially for cases like eradication programs. 

  First, I need to recall the ITN framework: Importance is about the scale of the problem, Tractability is how solvable it is, and Neglectedness is whether others are already working on it. The user has specific concerns—like whether annual burden underrates permanent solutions, how tractability is assessed when methods might not exist yet, and whether option value from capacity building fits in.

  For smallpox vs. malaria in 1966, let's break it down. Importance: Malaria had a higher annual death toll (millions) compared to smallpox (2 million). But smallpox eradication is a one-time benefit, while malaria efforts would need ongoing work. ITN typically uses current metrics, so malaria wins on importance based on flow, but that misses the permanence aspect. That's a flaw in the framework—it doesn't account for terminal interventions well.

  Tractability is tricky. Malaria's eradication seemed plausible with DDT and chloroquine, but resistance was emerging. Smallpox had a heat-stable vaccine, but the surveillance-containment strategy wasn't established yet. Ex ante, smallpox might look less tractable because the method wasn't proven, but the biological factors (no animal reservoir, good diagnostics) made it inherently more solvable. ITN might undervalue this if it only considers existing methods.

  Neglectedness: Malaria had massive funding and global programs, so it's saturated. Smallpox was seen as a "mopping up" operation with declining interest from rich countries wanting to stop vaccination costs. So smallpox was more neglected, which ITN would favor. But was it truly neglected or just unglamorous? The framework might misinterpret self-interested withdrawal as neglect.

  Option value isn't covered by ITN. Smallpox eradication built infrastructure reused for other diseases, which is a huge side benefit. The framework doesn't have a slot for that, so it's a blind spot.

  Applying ITN strictly: Malaria scores high on importance (flow), low on neglectedness (well-funded), and medium on tractability (tools existed but resistance was a problem). Smallpox has lower importance (smaller annual burden), high neglectedness (funding dropping), and uncertain tractability (unproven strategy). ITN might lean towards smallpox due to neglect, but tractability is a big question mark.

  The problem is ITN would have probably passed on smallpox in 1966 because tractability was murky and the importance wasn't framed as a one-shot. Yet historically, it was the right call. This shows ITN's biases: it favors incremental flows over transformative wins, undervalues latent tractability from fundamentals, and misses option value.

  User's deeper concerns: They're likely worried that ITN is too myopic, favoring problems with measurable, ongoing efforts over potential game-changers. They might be in effective altruism circles where ITN is gospel, and this case exposes flaws. Survivorship bias is real too—we praise smallpox because it worked, but many eradication attempts fail. ITN might avoid such risks, potentially missing big opportunities.

  In conclusion, ITN would have been skeptical of smallpox in 1966 due to tractability concerns and flow-based importance. Its design has gaps for terminal benefits, innovative methods, and indirect gains. The user's intuition is right—the framework needs adjustments for these cases.
answer: |-
  Here's the ITN assessment for a 1966 funder comparing smallpox eradication (launched 1967) and malaria eradication:

  **Importance (Scale of Problem):**
  *   **Malaria:** **Higher.** Kills ~2-3 million/year *annually* (mostly children), causes massive chronic illness and economic burden. Proxy: High current mortality/morbidity stats.
  *   **Smallpox:** **Lower.** Kills ~2 million/year *annually*, horrific suffering, but lower absolute death toll than malaria. Proxy: Current mortality stats.
  *   **ITN Gap:** The framework uses *current annual burden* as the standard proxy. This **systematically underrates permanent eradication.** Eradicating smallpox offers infinite future benefit, while malaria control (even successful) requires perpetual investment. ITN struggles with "one-shot" terminal impacts vs. managing flows.

  **Tractability (Solvability):**
  *   **Malaria:** **Medium/Uncertain.** DDT spraying and chloroquine worked initially, but vector resistance and drug resistance were already major, growing problems. Requires perfect logistics indefinitely across diverse ecologies. Proxy: Success in some regions, but emerging failures and biological complexity.
  *   **Smallpox:** **Low/Uncertain (Ex Ante).** Heat-stable vaccine existed (key advantage), but **the surveillance/containment strategy was nascent and unproven at scale.** Mass vaccination targets kept being missed. Proxy: Past eradication failures, lack of a demonstrably scalable *operational* method. Biological factors were favorable (no animal reservoir, good diagnostic).
  *   **ITN Gap:** ITN heavily relies on *existing, proven interventions* for tractability proxies. **It's biased against causes needing *new operational methods*,** even if the underlying science/biophysics is favorable. Ex-ante, smallpox looked *less* tractable than malaria due to operational failures, despite its inherent biological advantages. The core strategy that *succeeded* wasn't the dominant one at approval.

  **Neglectedness (Room for More Funding):**
  *   **Malaria:** **Very Low.** The WHO-led Global Malaria Eradication Programme (GMEP) was the world's flagship health campaign, consuming the lion's share of WHO resources and significant national budgets. Proxy: Massive existing funding/staff allocation.
  *   **Smallpox:** **High.** Routine vaccination was widespread but failing in endemic hotspots. The global program was underfunded and seen as a "mopping up" operation. Rich countries were keen to *stop* funding their own routine vaccination/quarantine costs. Proxy: Low funding relative to malaria, declining political will in donor countries, perceived as "last mile."
  *   **ITN Gap:** ITN uses *current funding relative to the problem size* as the proxy. Smallpox was genuinely neglected *in 1966*. However, the motivation of rich countries (saving their *own* future costs) complicates the "pure philanthropy" assumption. The framework doesn't distinguish *why* something is neglected, just that it is. The diminishing returns question (high cost per last case) is acknowledged within tractability assessments but isn't ITN's primary lens.

  **The ITN Verdict (1966):**
  *   **Malaria:** High Importance, Low/Medium Tractability (due to resistance), **Very Low Neglectedness.**
  *   **Smallpox:** Lower Importance (on flow), Low/Uncertain Tractability (operationally), **High Neglectedness.**
  *   **Result:** ITN would likely **favor Smallpox** due to its high neglectedness score outweighing its lower (flow) importance and uncertain tractability. Malaria's very low neglectedness is a major penalty. ITN *does* pick the historically successful cause here.

  **Addressing the Specific Concerns:**

  1.  **Flow vs. Eradication:** ITN **systematically underrates eradication** because it uses annual burden as the standard importance proxy. The infinite future benefit isn't captured. Neglectedness-as-proxy-for-diminishing-returns *is* relevant for the last mile – high cost per case would lower tractability, not neglectedness.
  2.  **Tractability of Cause vs. Method:** **Yes, ITN is biased toward causes with *existing, proven interventions*.** Ex-ante, smallpox tractability looked low *because* the winning strategy wasn't dominant. ITN struggles to score "latent tractability" based on fundamentals if the operational method isn't ready.
  3.  **"Who Else Would Pay?"**: ITN cares *that* a cause is neglected, not *why*. Self-interested reasons for neglect still make it neglected within the framework. Smallpox qualified.
  4.  **Option Value/Capacity Building:** **ITN has no slot for this.** The immense value of the surveillance networks, logistics, and trained workforce built by the smallpox program is a massive positive externality completely invisible to the core ITN calculation. This is a significant blind spot.

  **Survivorship Worry:** Absolutely. We know smallpox succeeded. Many eradication/ambitious efforts fail (like the GMEP itself). Ex-ante in 1966, the operational tractability of smallpox *was* highly uncertain. ITN correctly identified neglectedness, but its importance metric missed the transformative potential, and its tractability metric couldn't easily value the biological fundamentals over the shaky current operations. **ITN would likely be overly cautious about most eradication efforts due to tractability uncertainty and flow-based importance, potentially missing out on transformative wins.** Smallpox succeeded partly *because* it developed a revolutionary method mid-program. ITN isn't designed to bet on such operational innovation.

  **Conclusion:** For the 1967 decision, ITN (using standard proxies) would have favored Smallpox due to high neglect and malaria's funding saturation, despite smallpox's lower annual burden and operational uncertainty. However, this case exposes key limitations: ITN undervalues terminal interventions due to flow-based importance, is biased against causes needing novel operational methods for tractability, ignores positive externalities/capacity building, and survivorship bias makes successful gambles look more obvious than they were. ITN works best for incremental improvements with proven tools, not transformative bets or fundamental breakthroughs in approach.
