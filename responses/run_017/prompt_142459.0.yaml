prompt: |-
  Hey — I'm a 4th-year PhD student in judgement and decision making, working mostly on metascience (reproducibility, researcher degrees of freedom, how much a single preregistered study should move anyone). Not philosophy, but I keep bumping into epistemology anyway, because my actual working problem is: how confident should I be once I learn something about *how* a belief of mine got produced, or about *who* disagrees with me. And then the follow-on, which is the bit that actually bugs me: sometimes I end up thinking I should be less confident than I am, I can't make the feeling go away, and I can't tell whether that gap is a defect in me or just what being a person is like.

  Here's where I land on cases, going on gut. Please don't bother with who said what, I just want the shape of the principle.

  1. Me and my labmate, both competent, both staring at the same output, disagree about whether an exclusion criterion applies to participant #47. I come down to roughly the midpoint. It feels slightly silly — I can still see the argument and it still looks right to me — but I do it.

  2. My advisor disagrees with me, and my reason for thinking she's better than me at this is that when we've checked against a third source she's been right more often. I defer most of the way. But in the variant where my *only* evidence that she's better is that she tends to disagree with people I independently think are wrong — and I'm one of those people — I defer not at all. Same person, same disagreement, opposite verdicts. I want to know what that difference is tracking.

  3. I coded 200 open-ended responses at 2am after a red-eye. Next morning I redo it fresh and land on essentially the same distribution. Verdict: no discount, I'm fine.

  4. Same red-eye, but what I did at 2am was a judgment call I can't re-make fresh — rating how hostile each response sounded, where re-rating is just more of the same tired judgment. Verdict: big discount. Note 3 and 4 have identical higher-order evidence about the process that produced the belief, so whatever matters here isn't the higher-order evidence alone.

  5. I find out my analysis script had a bug that silently corrupted the DV for about 3% of participants, at random, and I can't tell which ones. Verdict: shink confidence, symmetric, no direction, small.

  6. I find out I did the covariate-selection-after-looking thing, the one that inflates false positives. Verdict: not just shrink — shift, in the direction of there being less of an effect than my estimate says. And I want that shift even though I can't point to the step where it went wrong.

  7. A reviewer who is on record as hating my method rejects the paper: moves me less than a neutral reviewer would. A student who always agrees with me agrees: gives me almost nothing. These feel easy and I include them only as constraints.

  8. The one I go back and forth on. Suppose a paper shows that everyone in my field, me included, is nudged by factor X — say, whether the first number you see in the output happens to be the one you hoped for — and X's direction in my case is *unknown*: it could have pushed me toward my conclusion or away. Half the time I think: that's just noise, symmetric shrink. The other half I think: no, it's a *directional* bias in each instance, I just don't know which way, and that's a different animal from coin-flip noise. Also: shrink toward what? My prior before seeing the data? My field's base rate? Fifty-fifty?

  9. I recieve evidence that I'm well calibrated when I say 60% but badly overconfident when I say 95%. Verdict: discount the 95s harder than the 60s, with no direction attached. But then I still *feel* 95%. So I believe p hard while judging that the rational credence is around 70. That state feels bad — akratic, if that's the word — but when I watch what I actually do (whether I run the extra robustness check, what I write in the limitations section) I behave like someone at 70. So maybe the norm was never about the feeling.

  10. A methodologist whose own toolset comes out of my subfield tells me my subfield's tools are unreliable. Verdict: take it seriously, but only partway — and I can't say where the regress is supposed to stop. Same shape as: drunk, I conclude that I'm too drunk to judge.

  11. I believe I left the hard drive in the lab. I also know my hit rate on where-I-put-things is about 40%. I should be at 40%, I'm at 90%, I cannot get down, and I go check the lab and the car. Is anything wrong with me?

  The thing I've been telling myself, as a candidate: there is no special higher-order category. Evidence about how a belief was made is just more evidence about the world, and I should do one update on everything, guided by the *reliability profile* the higher-order evidence points at — specifically whether the defect is symmetric noise or directionally correlated with the truth, and whether re-running the same process would reproduce the same error. And the enkratic-sounding demand (your confidence should match what you take your evidence to support) isn't a demand on how sure you feel; it's a demand on what you do, say, and spend your next hour on.

  What I want: put that principle under the cases and tell me where it gives no answer or the wrong one, and repair it. Tell me which of my verdicts it can't accommodate, and if you had to overturn exactly one verdict to get the simplest principle that fits the rest, which one and why. Say where it's too vague to actually run — what counts as the same process, how I'm supposed to estimate a reliability profile in ten minutes before a deadline — and whether it's something I should try to apply in real time or only a standard someone else uses to evaluate me afterwards. And give me its verdicts on three cases I haven't listed: (a) a black-box tool flags my analysis as probably wrong, it's been right 80% of the time historically, and it gives no reason; (b) I know that in six months, once I've read the rest of the literature, I'll probably be less confident in this finding — do I move now?; (c) I tell my coauthor I'm only at 60%, they stop checking that part of the analysis, and a real error goes uncaught — does that pragmatic feedback feed back into what I should have believed or asserted?
reasoning: |-
  Okay, let me start by really understanding what this PhD student is grappling with. They're in judgment and decision-making, focusing on metascience—reproducibility, researcher degrees of freedom, and how much a single study should shift beliefs. But their core struggle is epistemological: how confident should they be when they learn about how their belief was formed or who disagrees with them? And there's this nagging feeling that sometimes they should be less confident than they actually feel, and they're unsure if that's a personal flaw or just part of being human.

  Looking at their cases, they've outlined various scenarios where their gut reactions differ. For example, when disagreeing with a labmate, they move to the midpoint. When their advisor disagrees, they defer more if there's evidence she's better, but not if the only evidence is that she disagrees with people they think are wrong. Then there are cases involving fatigue, coding errors, methodological biases, and calibration issues. Each case has a different verdict on how much to adjust confidence.

  The candidate principle they're considering is that higher-order evidence (HOE) isn't special; it's just more evidence about the world. They propose updating based on the reliability profile—whether the defect is symmetric noise or directionally biased, and if re-running the process would reproduce the error. They also separate the feeling of confidence from rational credence, suggesting the norm is about actions, not feelings.

  I need to test this principle against their cases. Where does it fit? Where does it fail? For instance, cases 1 and 2 involve disagreement. The principle handles case 1 well (midpoint adjustment due to symmetric disagreement) but struggles with case 2. Why? In the first advisor scenario, direct evidence of her track record justifies deference. In the variant, the only evidence is that she disagrees with people they think are wrong, including themselves. Here, the reliability profile isn't clear. The advisor's reliability isn't independently established, so deferring isn't warranted. The principle might not fully explain why direct track record vs. indirect disagreement makes a difference, but it's close.

  Cases 3 and 4 both involve fatigue. Case 3: redoing the coding fresh with same results, no discount. Case 4: can't redo, big discount. The principle explains this via reproducibility. If re-running the process (fresh) gives the same output, the fatigue-induced noise is symmetric, so no adjustment needed. But if you can't rerun, the directional bias risk remains, hence discount. That fits.

  Case 5: random bug affecting 3% of data. Symmetric noise, small confidence shrink. Principle handles this. Case 6: covariate hacking, which is directional bias. Here, shifting confidence toward less effect makes sense. The principle accounts for directional biases by shifting beliefs, not just shrinking.

  Case 7: biased reviewer moves you less, agreeable student adds little. This is about reliability—biased sources are less credible, agreeable ones provide no new info. Fits the principle.

  Case 8 is tricky. A nudging factor X with unknown direction. Sometimes symmetric shrink, sometimes treated as directional. The principle might suggest symmetric shrink if X is random noise, but if it's a consistent bias per instance, even if direction unknown, it could be directional. The challenge is estimating the reliability profile here. Maybe it depends on whether X's effect averages out over many instances or not. But without knowing, it's messy. The principle gives an answer (symmetric shrink) but doesn't resolve the internal conflict.

  Case 9: calibration evidence. Discount high confidence more. The feeling of 95% remains, but actions align with 70%. Principle separates feeling from rational credence, emphasizing actions. This fits, addressing the akrasia by decoupling feeling from normative action.

  Case 10: methodologist criticizing their own tools. Partial deference, similar to knowing you're too drunk. Principle handles via reliability—if the critic's expertise includes awareness of limitations, partial deference makes sense.

  Case 11: misplaced hard drive. Knowing 40% hit rate but feeling 90%. Actions (checking) align with lower confidence. Principle explains the action-behavior mismatch as normal; feelings don't have to match actions.

  Now, where does the principle fail? Case 2 variant might be a stretch. The principle doesn't clearly explain why deference isn't warranted without independent evidence. Maybe it's about the lack of a reliability signal. Case 8 is internally conflicting, showing the principle's vagueness in handling unknown directional biases.

  If overturning one verdict, case 8's symmetric shrink might be the one. If X is a directional nudge in each case, even if unknown, it might require a directional shift on average. But that's complex. Simpler to stick with symmetric unless direction is known.

  The principle's vagueness: defining "same process" in reruns, estimating reliability quickly. For example, in case 4, "same process" means same judgment call, so rerunning while tired isn't helpful. Reliability estimation might rely on heuristics or prior data.

  New cases: (a) Black-box tool 80% accurate. Update based on reliability. Likely shrink confidence, perhaps shift if the tool indicates direction. (b) Knowing future less confidence. If rational, move now to avoid temporal inconsistency. (c) Coauthor neglect due to low confidence. Pragmatic effects shouldn't alter rational credence but might influence assertion norms.

  In sum, the principle mostly fits, especially when separating feeling from action. Refinements needed in handling reliability without direct evidence (case 2) and unknown directional biases (case 8). The key is that HOE informs reliability, which dictates how to update—shrink, shift, or neither—and actions should follow rational credence, not feelings.
answer: |-
  Your candidate principle—that higher-order evidence (HOE) is just more evidence about the world, requiring a unified Bayesian update guided by *reliability profiles* (symmetric noise vs. directional bias, reproducibility of error), with the "enkratic norm" applying to *actions* rather than feelings—is impressively robust. It aligns with most of your verdicts and resolves key tensions. Let's pressure-test it systematically.

  ### **Where the Principle Works Perfectly**
  Your principle nails cases where HOE clearly defines the reliability profile:
  - **Case 1 (labmate disagreement)**: Symmetric disagreement → reliability profile = added noise → shrink confidence toward midpoint.  
  - **Case 3 (redo coding)**: Identical output on rerun → error is reproducible *and* symmetric → no discount.  
  - **Case 5 (random bug)**: Symmetric, uncorrelated error → small symmetric shrink.  
  - **Case 6 (covariate hacking)**: Directional bias (inflates effect sizes) → shift confidence toward null.  
  - **Case 7 (biased reviewer/agreeable student)**: Source reliability matters. Biased reviewer = low weight; agreeable student = no new info → minimal movement.  
  - **Case 9 (calibration evidence)**: Reliability profile shows overconfidence at 95% → discount high confidence more. Feeling 95% but acting at 70% is fine—the norm governs actions (e.g., running extra checks), not feelings.  
  - **Case 10 (methodologist/drunk self)**: Partial deference. Reliability profile includes the source’s *meta-reliability* (e.g., methodologist understands limits; drunk-you knows impairment) → partial shrink.  
  - **Case 11 (hard drive)**: Low reliability (40% hit rate) → *act* as if 40% (check car/lab) regardless of feeling 90%. No defect—this is "being human."

  ### **Where the Principle is Strained (But Fixable)**
  **Case 2 (advisor disagreement)**  
  - **Verdict**: Defer with track record; no deference without independent evidence.  
  - **Principle’s Fit**: Good, but needs refinement. The key is *independence of reliability assessment*.  
    - With track record: Direct evidence of advisor’s reliability → defer.  
    - Without it: "She disagrees with people I think are wrong" is circular. Your assessment of *others’* reliability depends on your own judgment, creating a self-reinforcing loop. Reliability profiles require *externally validated* signals (e.g., third-party checks). The principle handles this if we add: **"Reliability estimates must be bootstrapped from independent ground truth."**  
  - **Repair**: In the variant, withhold deference—you lack independent data to update her reliability profile.

  **Case 4 (tired judgment, irreproducible)**  
  - **Verdict**: Big discount.  
  - **Principle’s Fit**: Strong. Reproductibility matters:  
    - Case 3: Same output when rerun → noise averages out → no discount.  
    - Case 4: Irreproducible process (tired judgment) → unknown directionality → discount.  
  - **Refinement**: "Same process" means *identical conditions*. Rerating while tired isn’t "fresh," so it doesn’t resolve directional risk.

  **Case 8 (nudging factor X, direction unknown)**  
  - **Verdict**: You’re torn between symmetric shrink vs. directional shift.  
  - **Principle’s Conflict**: Reliability profile is ambiguous. Is X symmetric noise (shrink) or per-instance directional bias (shift)?  
  - **Repair**: Default to **symmetric shrink toward your pre-nudge prior**. Why?  
    - If X is random *per researcher*, it’s noise → shrink.  
    - If X is systematic (e.g., *always* pushes toward desired results), it’s directional → shift toward null. But you lack evidence for systematicity!  
    - **Overturn this verdict**: Adopt symmetric shrink. Why? Simplicity + epistemic conservatism. Without proof of directional bias, treat it as noise. Shift only if you know the *sign* of the bias (e.g., "X *always* inflates effects").

  ### **Where the Principle is Vague (And How to Sharpen It)**
  1. **"Same process" definition**:  
     - Vague in Cases 3/4. Sharpen: **"Same process" = identical cognitive/algebraic operations, controlling for known confounds (e.g., fatigue)**.  
     - Case 3: Coding is algorithmic → rerun valid. Case 4: Subjective judgment → rerun invalid if state-dependent.  

  2. **Estimating reliability profiles quickly**:  
     - Use heuristics:  
       - Symmetric noise? → Shrink confidence by estimated error variance (e.g., 3% bug → small shrink).  
       - Directional bias? → Shift toward null (if bias inflates effects) or prior (if bidirectional).  
       - Defaults: If unsure, treat as symmetric (safer; avoids overcorrection).  

  3. **"When to apply?"**: Use **in real time for consequential actions** (e.g., analysis choices, conclusions). For non-urgent decisions (e.g., theory-building), reflect post-hoc. Your Case 11 behavior ("check car/lab") shows this instinctively.

  ### **Verdicts on Your New Cases**
  **(a) Black-box tool (80% accurate, flags analysis, no reason)**  
  - **Principle**: HOE = tool’s reliability profile (20% false-positive rate).  
  - **Verdict**: Shrink confidence symmetrically (direction unknown) by ~20%. If the tool *predicts direction* (e.g., "effect is smaller"), shift accordingly.  

  **(b) "Future me will be less confident"**  
  - **Principle**: HOE about your own reliability (future-you has more evidence).  
  - **Verdict**: **Move now**. Why? Epistemic rationality requires temporal consistency. If you *know* future-you’s view is better informed, update preemptively.  

  **(c) Coauthor neglects check due to your 60% assertion → error missed**  
  - **Principle**: Pragmatic effects don’t alter *credence* (belief is truth-directed). But they affect **assertion norms**.  
  - **Verdict**: Your 60% credence was rational *if* supported by evidence. The error is a **pragmatic failure of communication**, not epistemology. You should’ve said: "I’m 60% but this needs checking because X is high-risk."  

  ### **The One Verdict to Overturn: Case 8**
  - **Why this one?** It’s the only case where your intuition is internally split, and the principle can’t resolve it without arbitrariness. Forced to choose, **adopt symmetric shrink** for simplicity:  
    - Directional shifts require knowing the *sign* of the bias (e.g., "p-hacking always inflates effects").  
    - Unknown-direction nudges are epistemically equivalent to random noise.  
    - Shrinking toward your *pre-nudge prior* (not 50/50 or base rates) is most consistent.  

  ### **Final Principle: Refined and Repaired**
  > **Higher-order evidence updates your reliability model for the belief-forming process. Treat the process as a noisy instrument:  
  > - If error is *symmetric* (noise), shrink confidence toward your current estimate.  
  > - If error is *directional* (bias), shift confidence toward the expected value under bias (e.g., null for inflation).  
  > - If the process is irreproducible *and* state-dependent (e.g., fatigue), discount heavily.  
  > - Reliability estimates require independent calibration (no bootstrapping from own beliefs).  
  > The "enkratic norm" governs *actions* (not feelings): your choices should reflect your rational credence.**  

  This handles all cases except Case 8 (overturned), and vagueness is mitigated by defaults:  
  - "Same process" = same operations + controlled confounds.  
  - Reliability heuristics: Default to symmetric noise if uncertain.  
  - Apply in real-time for actions; use post-hoc for refinement.  

  ### **Is the Feeling-Action Gap a Defect?**  
  **No—it’s "being human."** Your Cases 9 and 11 show this perfectly:  
  - Feelings are coarse, heuristic-driven (System 1), while rational credence is reflective (System 2).  
  - Evolution optimized feelings for speed/compliance, not calibration. What matters is **aligning actions with reflective credence** (e.g., you *behave* at 70% while *feeling* 95%).  
  - The gap is only defective if actions don’t follow credence (e.g., ignoring calibration data). You’re fine.  

  This framework should handle 95% of your metascience dilemmas. When stuck, ask: *"Is this noise, bias, or irreproducible? And what would I do if I trusted my model?"*
