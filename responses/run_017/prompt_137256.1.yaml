prompt: |-
  hey, hoping someone can help me put a name on something — or tell me flat out that it doesn't have one, in which case I want help carving it up properly.

  I design reward mechanics for a behaviour-change app (streaks, deposit contracts, that sort of thing) and I read too much philosophy of action in my spare time, and I keep tripping over the same shape of problem in both places.

  The shape: someone gets offered something valuable on the condition that, by some deadline, they're in a certain state of mind — intending to do a thing, being resolved, genuinely wanting it — and the payoff does not depend on whether they ever act on it.

  Case one. A stranger offers you a large sum of money, handed over at breakfast, if by then you've genuinely decided to swallow a pill that will make you feel like you've got the flu for a day. You get the money for the deciding, not the swallowing. I cannot get myself into that state. I can say the words, I can even arrange to be locked in a room with the pill, but actually deciding seems to be the one thing unavailable to me — and weirdly it's unavailable *because* of the offer. Before he opened his mouth, deciding to take a flu-pill for no reason would have been strange but not incoherent.

  Case two. Same structure, except the thing you're paid to decide on is something you'd still have a real reason to do when the time comes: go for a run at 6pm, money arrives at breakfast. This one I also can't get into, but it feels like the opposite failure. The money's already spent on me, so it can't be my reason at 6pm, and the run now feels *bought* — which somehow makes it harder to want than if nobody had paid me. Same failure as case one in a costume, or a different one?

  Case three, the ones that work. Deposit contract: you lose 200 bucks if you don't log a run by Sunday. Here the external incentive seems to manufacture the intention rather than wreck it. And not just by shifting payoffs — people describe the decision as feeling more real, not less.

  So the thing I want a word for: the pattern where being offered a reason to be in a state of mind is exactly what puts the state out of reach, while in neighbouring cases an offer does the reverse. I've seen people wave at the idea that you can't intend at will, and at the idea that money just isn't the right sort of reason to want something, and at the effect where paying kids to read makes them stop liking reading. None of them seem to cover case two, where the problem isn't that I can't produce the state but that the state I can produce has been contaminated. And none of them tell me what flips the sign between case two and case three.

  Here's the variant that bugs me most. Suppose the stranger doesn't offer cash. He says: if you've decided by morning, I'll fly your whole family in to watch you take the pill, and I'll tell them what you're doing. Now there's no difficulty at all — obviously you can decide, you'll have a reason at the time. But look at the move: you didn't get control over your own mind, you changed the world so that the decision became the kind of thing there's a reason for. Is that a solution to the puzzle or just a refusal to answer it?

  What I'm after: does this general pattern have a name, or is it two or three things I should be pulling apart? Where's the boundary between the offers that poison the state and the ones that produce it? Does it matter that in my cases the state is an intention rather than, say, a belief — someone offering you money to believe your team will win seems broken in a different way, and I'd like to know if that's the same brokenness. And what would you call the move in that last variant, where you fix the world instead of the mind? I'm really not after a reading list here, just the carving.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They design reward mechanics for behavior-change apps and have a background in philosophy of action. The core issue they're grappling with is a pattern where offering a reward to achieve a certain mental state (like intending or deciding) backfires, making that state inaccessible. But in other cases, similar incentives work. 

  First, I need to break down their examples. Case one: money for deciding to take a pill, but the reward makes genuine decision impossible. Case two: same structure but for a run, where the payment contaminates the intention. Case three: deposit contracts that work by making the intention feel real. Then there's a variant with social incentives (family watching) which works. 

  The user wants to know if this pattern has a name, how to differentiate the cases, and what the boundary is between incentives that poison vs. produce the mental state. They're also curious if intention-specific issues differ from belief cases (like being paid to believe something).

  Hmm, the key here seems to center on the nature of intention formation and how extrinsic rewards interfere with intrinsic motivation. But it's more nuanced because the problem isn't just about motivation—it's about the very possibility of forming the intention when the reward is the reason. 

  I recall that in philosophy, intentions require what Bratman calls "settling" on an action as part of planning. If the reward is the sole reason to form the intention, it might prevent genuine commitment. That connects to the idea of "state-dependent rationality" where the intention must align with future reasons. 

  For the deposit contract (case three), the incentive works because it creates a new reason (avoiding loss) that persists until action time, aligning the intention with future rationality. The family example adds social stakes that provide authentic reasons at decision time. 

  The boundary between poisoning and producing incentives might lie in whether the reward integrates into the agent's reasons for action. Contamination happens when the extrinsic reward replaces intrinsic reasons, making the intention feel alien. Effective incentives add new, compatible reasons without overriding existing ones. 

  Beliefs are different because they aim at truth—you can't decide to believe something for money. Intentions are about commitment to action, so they're more flexible but still constrained by rationality. 

  The "flipping the world" move in the family example avoids the direct mental-state challenge by providing external reasons, which is a practical solution but doesn't resolve the core paradox. 

  So the user might need terms like "intention poisoning," "state-dependent rationality," or "incentive-aligned intention formation" to describe these dynamics. The carving points are: type of mental state (intention vs. belief), temporal alignment of incentives, and integration with existing reasons.
answer: |-
  This pattern is fascinating and *does* have conceptual anchors, though no single perfect name exists. It's a blend of philosophical puzzles about intention formation, rationality constraints, and incentive structures. Here's the carving:

  1.  **The Core Problem: Intention Poisoning via Extrinsic Incentives (The General Pattern)**
      *   **Name:** "The Intention-Formation Paradox" or "The State-Contingent Incentive Paradox". More specifically, it's a form of **"Incentive-Induced Intention Inaccessibility"** or **"Reason-Contamination for Pro-Attitudes"**.
      *   **The Mechanism:** Forming a genuine intention (or resolve, desire) requires taking that intention as grounded in reasons *for the intended action itself*. An external incentive offered *specifically for forming the intention* creates a powerful, alien reason *against* sincerely adopting those action-based reasons. It makes the intention feel inauthentic or instrumental, poisoning the well from which genuine commitment springs.
      *   **Why it Fails (Cases 1 & 2):**
          *   **Case 1 (Flu Pill):** The *only* conceivable reason to form the intention is the money. There are *no* independent reasons for the action. The incentive is so dominant and alien to the action's nature that sincere intention formation becomes impossible. You can't "decide for the money" *and* have it be a genuine decision *to take the pill*; it's only a decision *to get the money*.
          *   **Case 2 (Run):** Here's the twist. You *do* have independent reasons to run (health, enjoyment). But the *timing* and *conditionality* of the incentive poison the well. The money arrives *before* the run and is contingent *only* on forming the intention, not on performing the action. This:
              *   Makes the money feel like payment *for the intention itself*, not the run, contaminating your potential running reasons.
              *   Separates the reward from the action's inherent reasons, making those inherent reasons feel less valid or "bought out."
              *   Creates a perverse dynamic: forming the intention *instrumentally* (to get the money) actively undermines your ability to form it *sincerely* (because you want to run). This feeling of "contamination" is key and distinct from Case 1's sheer impossibility.

  2.  **The Boundary: When Incentives *Produce* Intentions (Case 3)**
      *   **The Flip:** Deposit contracts work because they **alter the future action's payoff structure in a way that persists**. The $200 penalty becomes a *new, powerful reason to run when Sunday comes*. Crucially:
          *   **Temporal Alignment:** The incentive (avoiding loss) is active *at the time of the intended action*. It provides a reason *for running* on Sunday.
          *   **Action-Contingent, Not State-Contingent:** The penalty depends on *not running*, not on your mental state. You don't get paid *for intending*; you avoid a loss *by acting*.
          *   **Manufactured Rationality:** The contract makes intending to run *rational* because it ensures a strong reason *will exist* at action time. Your intention isn't just a promise; it's a rational plan based on future incentives. This is why it feels "more real" – it's grounded in a concrete future reason you control by committing.
      *   **The Boundary:** Incentives produce genuine intentions when they **create or align with reasons that will be valid *at the time of the intended action*, making the intention a rational commitment to that future action.** They fail when they are **contingent *only* on the present mental state itself, creating a reason *for the state* that conflicts with reasons *for the action***.

  3.  **The "Flip the World" Solution (Family Example)**
      *   **Name:** **"External Reason Scaffolding"** or **"World-Alignment for Intention Formation"**.
      *   **How it Works:** The stranger doesn't offer an incentive *for the intention*. Instead, they offer to *change the world* so that *at the time of action*, you have powerful, authentic, *action-relevant* reasons (family pride, social pressure, demonstrating commitment to loved ones). This:
          *   Provides compelling reasons *for swallowing the pill* when the time comes.
          *   Makes forming the intention *now* a rational response to the *future reasons* that will exist. Intending becomes planning based on known future incentives.
          *   Avoids the direct "poisoning" because the offer isn't payment for the mental state; it's a change enabling the mental state to form naturally based on the new action-context.
      *   **Is it a Solution or Refusal?** It's a **pragmatic solution to the formation problem, not a resolution of the core paradox.** It cleverly bypasses the intention-poisoning trap by moving the incentive from being *state-contingent* to being *action-enabling*, thereby providing future reasons that make intention formation rational and authentic *based on the action's new context*. It answers the practical question ("How can I get him to decide?") by changing the world, not by magically solving the paradox of forming an intention *for* a reason that inherently undermines it.

  4.  **Intention vs. Belief**
      *   **Crucial Difference:** Intentions are *practical commitments to act*. Beliefs are *cognitive commitments to truth*. This is fundamental.
      *   **Belief Analogy:** Being paid to *believe* your team will win *is* broken, but differently. It violates the **"aim of belief"** – beliefs strive to align with evidence/truth. Money isn't evidence. You might *say* you believe, or even *act as if* you believe, but you cannot *genuinely form the belief* that your team will win *because* of the money. This is **Moore's Paradox** territory ("My team will win, but I don't believe it" is absurd, yet paying you might put you in that state).
      *   **Why Different Brokenness?**
          *   **Intention Poisoning:** About the *practical rationality* of commitment – forming a commitment *for a reason* that makes the commitment inauthentic or irrational *as a commitment to that action*.
          *   **Belief Incentive:** About the *epistemic rationality* of cognition – trying to form a cognitive state *for a reason* that is evidentially irrelevant (money isn't evidence for a win), violating the constitutive norm of belief (truth-tracking).
      *   **The Similarity:** Both involve incentives attempting to directly cause a mental state whose constitutive norms are violated by the incentive itself (practical commitment norms for intention, truth-tracking norms for belief). The *type* of norm violated makes the "brokenness" distinct.

  **In Summary:**

  1.  **The Pattern:** **Incentive-Induced Intention Inaccessibility / Reason-Contamination.** Offering an extrinsic incentive contingent *solely* on forming an intention poisons the well, making sincere intention formation impossible or contaminated because the incentive conflicts with the reasons needed to ground the intention in the action.
  2.  **The Boundary (Poison vs. Produce):** Does the incentive **create/align with reasons valid *at the time of action***, making the intention a rational commitment (Produces - Deposit Contract)? Or is it **contingent solely on the *present mental state***, creating a conflicting reason *for the state* that undermines reasons *for the action* (Poisons - Cash for Deciding)?
  3.  **The "Flip the World" Move:** **External Reason Scaffolding.** Providing reasons that will exist *at action time* (like social pressure) bypasses the poisoning by making intention formation rational based on the future action context.
  4.  **Intention vs. Belief:** Both are broken by direct state-contingent incentives, but the *nature* of the brokenness differs:
      *   **Intention:** Violates norms of *practical commitment/rational planning*.
      *   **Belief:** Violates norms of *epistemic rationality/truth-tracking*.

  This carving highlights that the core issue isn't just "can't intend at will" or "undermining intrinsic motivation," but specifically the **structural conflict between the reason provided by the incentive and the normative requirements for forming a sincere, practically rational intention.** The deposit contract and family examples succeed by resolving this structural conflict, aligning the incentive with future action-reasons.
