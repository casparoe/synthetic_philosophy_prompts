prompt: |-
  Hi — I'm one of five people on the commemoration review panel my city set up after the last statue fight. We get maybe ten or twelve referrals a year: a statue, a school name, a couple of streets, a mural, someone's name on a park bench. We meet once a month, we get about two weeks per case, no research staff, and whatever we write goes to council (who nearly always rubber-stamp it) and sometimes to the local paper. So I need something we can actually run.

  What I want is a decision procedure, not a set of principles. Ordered questions, what counts as a good enough answer to each one, the points where the procedure just stops and says leave it alone, and the points where it has to stop and hand the call over to council because it's a values question and not a factual one.

  Here's the half-formed theory I keep coming back to, which I want you to operationalize (correct it if it's wrong): a commemoration does three separable things — it honors (ranks someone as deserving public esteem), it testifies (asserts something about what happened), and it occupies (takes up shared space, or, in the case of a street or school name, gets said out loud by everyone who lives there, on every form and every 911 call, whether they want to say it or not). And the disqualifying thing about a person is either load-bearing — part of, or a causal input into, the thing they're being honored for — or merely incidental, something else that also happens to be true of them.

  Things it has to handle: what our evidence standard is for a claim about someone long dead (we are not convicting anybody); the remedy ladder from plaque through co-naming, relocation and removal, and which rung each finding buys you; and whether we are revoking an honor for misconduct versus registering that the reason for it has expired, because I think those need different arguments and I can never keep them straight in the meeting.

  Then run it on three: (1) a statue of a nineteenth-century mill owner who endowed the public library and the hospital, where the fortune came from a labor system that used children and the endowment is downstream of that; (2) a street named for a much-loved local organizer where the disqualifying thing is a private letter containing a slur, found in an archive last year; (3) a school named after the city's first Black councilman, honored for that, who also, on the record, voted against a fair-housing ordinance. At least one of these should come out in a way I definately won't like — I'd rather find that out here than at the council meeting. And tell me honestly what the procedure can't do.
reasoning: |-
  Okay, this user is part of a commemoration review panel dealing with statues, street names, and similar public honors. They need a practical decision procedure, not just principles. Their main points are: they handle 10-12 cases a year with limited time and resources, need a step-by-step process with clear stopping points, and want to distinguish between different aspects of commemoration (honoring, testifying, occupying).

  The user mentioned three key components of commemoration: honoring (public esteem), testifying (historical assertion), and occupying (shared space usage). They want to differentiate between "load-bearing" flaws (central to why they're honored) versus "incidental" ones. Important elements include evidence standards, remedies (plaque to removal), and distinguishing revocation vs expired honor.

  Looking at their three test cases: 
  First, the mill owner—honored for philanthropy but wealth built on child labor. Key question: is the child labor load-bearing to the philanthropy? If yes, that's problematic. 
  Second, the organizer with a private slur—probably incidental unless their work was about racial equity. Since it's private and not load-bearing, maybe just a plaque. 
  Third, the councilman who voted against fair housing—contradicts what he's honored for (civil rights), so likely load-bearing and needs stronger action.

  The user wants the procedure to flag when to stop or hand off to council. They also want to see if the process leads to outcomes they might dislike—like possibly removing the councilman's name since his action directly contradicts his honor.

  I'll design the procedure to be phased, starting with gathering facts, then analyzing each commemoration aspect, determining if flaws are load-bearing, and finally selecting remedies. For evidence, I'll suggest a "reasonable historical consensus" standard—no definitive proof needed, but no baseless accusations either. Remedies will escalate from plaques to removal based on severity. Hand-offs to council occur when it's a values call or too politically sensitive.

  Key challenges this procedure can't handle: predicting public reaction, assessing contemporary figures, or cases involving ongoing trauma. It's a tool, not a crystal ball. The user needs to know its limits upfront.

  For the test cases: The mill owner might get a contextual plaque since the flaw is likely load-bearing. The organizer keeps the name but gets a plaque—incidental flaw. The councilman might need renaming since his flaw is load-bearing and contradicts his honor. That last one might sting the user, but it's consistent with the procedure they asked for.
answer: |-
  Here’s a concrete, step-by-step decision procedure designed for your panel’s constraints—time-limited, evidence-conscious, and focused on actionable outcomes. It corrects ambiguities in your theory and prioritizes operational clarity. The core framework treats commemoration as **Honor (H)**, **Testimony (T)**, and **Occupation (O)**, with "load-bearing" flaws as the key disqualifier.

  ---

  ### **Commendation Review Procedure: 7-Step Framework**
  **Hand-off Rules**:  
  - **STOP & RETAIN** if no disqualifying finding at Step 5.  
  - **STOP & REFER TO COUNCIL** at Step 6 if remedy requires policy/value trade-offs.  
  - **STOP & RECOMMEND REMEDY** at Step 7 if within panel’s scope.

  #### **Step 1: Establish Facts**  
  - **Task**: Gather undisputed facts about:  
    - *The honoree*: What they’re commemorated for (H), what they’re alleged to have done (flaws).  
    - *The commemoration*: Physical form (statue, name), location, date of installation.  
  - **Evidence Standard**: **"Reasonable Historical Consensus"** (RHC).  
    - Accept: Academic histories, verified archives, contemporaneous records.  
    - Reject: Uncorroborated claims, anachronistic moral judgments.  
    - *Output*: "RHC-supported" or "Insufficient Evidence" for each claim.  
  - **Stop Point**: If *no RHC-supported flaw*, **STOP & RETAIN** commemoration.  

  #### **Step 2: Define the Honor (H)**  
  - **Task**: Identify the *specific achievement or virtue* the commemoration celebrates.  
    - *Ask*: "What would the plaque say if it were installed today?"  
    - *Example*: "Founded the city’s first public library" (not "was a great person").  
  - **Output**: 1–3 specific H criteria.  

  #### **Step 3: Flaw Assessment**  
  - **Task**: For each RHC-supported flaw, categorize:  
    - **Load-Bearing (LB)**: Flaw is *essential to* or *directly enabled* H.  
      - *Test*: "Without this act, could H exist?"  
    - **Incidental (I)**: Flaw is unrelated to H (e.g., private vice, unrelated misconduct).  
    - **Contradictory (C)**: Flaw *directly negates* H (e.g., honored for justice but denied civil rights).  
  - *Output*: LB / I / C designation per flaw.  

  #### **Step 4: Testimony (T) & Occupation (O) Impact**  
  - **Task**: Assess harm amplification:  
    - **T**: Does commemoration *falsely sanitize* history?  
    - **O**: Does forced use (e.g., saying a slur in a street name) cause *ongoing dignitary harm*?  
  - *Output*: "T/O Harm" or "No Significant Harm."  

  #### **Step 5: Disqualification Threshold**  
  - **Task**: Apply triggers:  
    - **Revocation Trigger**: ≥1 **LB** or **C** flaw.  
      - *Rationale*: Honor is invalid if built on/contradicted by misconduct.  
    - **Expiration Trigger**: H is *obsolete* (e.g., honored for opposing suffrage).  
      - *Key*: "Would we honor this today *for the same reason*?"  
    - **No Disqualification**: Only **I** flaws *and* no T/O Harm.  
  - *Stop Point*: If no disqualification, **STOP & RETAIN** with optional contextual plaque.  

  #### **Step 6: Assign Remedies (Escalating)**  
  | **Finding**               | **Remedy**                  | **Reason**                                                                 |  
  |----------------------------|----------------------------|----------------------------------------------------------------------------|  
  | **I flaw + T/O Harm**      | Add contextual plaque      | Acknowledge complexity; no revocation.                                     |  
  | **H expired**              | Relocate/co-name           | Honor outdated; reduce prominence.                                         |  
  | **LB/C flaw (moderate)**   | Removal *or* recontextualize | Honor compromised; refer to council if symbolic weight high.             |  
  | **LB/C flaw (severe)**     | Removal                    | Honor fundamentally illegitimate (e.g., violence enabling achievement).    |  
  - **Stop Point**: If remedy = Removal or major relocation → **REFER TO COUNCIL** with findings.  

  #### **Step 7: Document & Handoff**  
  - **Template Report**:  
    > "Commemoration of [Name] for [H]. RHC flaw(s): [Flaw] designated [LB/I/C]. T/O Harm: [Yes/No]. Finding: [Disqualify/Retain]. Remedy: [Action]. Council referral required: [Yes/No]."  

  ---

  ### **Test Case Applications**
  #### **(1) Mill Owner Statue**  
  - **H**: Endowed library/hospital (philanthropy).  
  - **Flaw**: Used child labor (RHC-supported).  
  - **Analysis**:  
    - **LB?** Yes—wealth enabling H derived from exploitation.  
    - **T/O Harm?** Testimony sanitizes labor history; Occupation unproblematic.  
  - **Disqualification**: LB flaw → **Revocation Trigger**.  
  - **Remedy**: **Removal or recontextualization** (refer to council due to visibility).  

  #### **(2) Organizer’s Street Name**  
  - **H**: Community organizing (racial justice work).  
  - **Flaw**: Private racial slur (RHC-supported).  
  - **Analysis**:  
    - **LB?** No—flaw incidental to H (unless H was *specifically* anti-racism).  
    - **C?** Contradictory if H = racial equity; incidental if H = general activism.  
    - **T/O Harm?** Occupation harmful if slur is street name.  
  - **Disqualification**: **Only if C** (if H = anti-racism). Else **Retain with plaque**.  
  - **Remedy**: **Co-name street** (e.g., "Jane Doe Legacy Lane") + plaque explaining context.  

  #### **(3) First Black Councilman’s School**  
  - **H**: Breaking racial barrier (symbolic first).  
  - **Flaw**: Voted against fair housing (RHC-supported).  
  - **Analysis**:  
    - **C?** Yes—H implies advancing equality; vote contradicts this.  
    - **T/O Harm?** Testimony erases harm to marginalized residents.  
  - **Disqualification**: C flaw → **Revocation Trigger**.  
  - **Remedy**: **Rename school** (honor expired/contradicted). *You’ll dislike this—but procedure flags C as fatal*.  

  ---

  ### **What This Procedure CAN’T Do**  
  1. **Resolve Values Disputes**: If council/majority believes child labor is "acceptable for era," the panel’s LB finding won’t override this.  
  2. **Predict Public Reaction**: A contextual plaque may inflame rather than educate.  
  3. **Handle Ambiguous "Merit"**: Does a flawed war hero’s statue honor courage or imperialism? (Refer to council).  
  4. **Address Ongoing Trauma**: A name causing daily harm to victims may need removal despite I flaw (procedure flags T/O harm but prioritizes factual LB/C).  
  5. **Fix Bad Design**: A statue that’s artistically offensive but historically sound → not in scope.  

  ---

  **Why this works for your panel**:  
  - **Time-efficient**: Steps 1–5 resolvable in <10 hrs/case.  
  - **Evidence-grounded**: RHC standard prevents ideological battles.  
  - **Escalation clarity**: LB/C flaws auto-trigger remedies; I flaws rarely escalate.  
  - **Council cover**: Clear handoff points for politically risky decisions.  

  The mill owner and councilman cases show the procedure’s rigor—even if outcomes are unpopular, the *process* defends itself. For the organizer, it shows nuance. If you pilot this, document where it chafes; real cases will stress-test it fastest.
