prompt: |-
  You are a professional philosopher who specialises in value theory and in the practical ethics of commemoration, and who has spent time advising memorial commissions and curriculum committees. Take this seriously and work carefully: before you write the final answer, spend a few paragraphs brainstorming candidate requirements freely, including ones you then reject, so I can see what you considered and cut. Then give me the finished specification.

  The situation: I have no academic background in philosophy, only a long private interest, and I have ended up on a volunteer committee with an unenviable job. We have a fixed budget, a fixed amount of physical space, and a fixed number of teaching hours, and we have to divide all three among several historical atrocities we are being asked to commemorate: cases on the order of the Nazi genocide, the transatlantic slave trade, and the deliberate starvation of a colonised population. Whatever we do will be public, and descendants of the victims and survivors will read our reasons. So ranking is being forced on us whether or not ranking is a decent thing to do, and I would like a specification before I read or invent any particular ranking method.

  Write me the desiderata that a theory of comparative magnitude for atrocities would have to meet to be good enough for a decision of exactly this kind: a committee with limited resources, no research staff, and an obligation to give reasons in public. For each requirement, give the case or consideration behind it and why that case earns it a place on the list. Then mark which requirements you take to be non-negotiable for adequacy and which are really preferences of one camp dressed up as requirements.

  Here are the puzzles I keep circling, which I want your list to speak to rather than skirt. Please treat them as the raw material for the requirements, and tell me frankly if any of them is a bad test:

  The currency problem. A ranking has to say what is being compared: deaths, life-years lost, suffering, stolen futures, destroyed languages and kinship structures, terror, the corruption of the perpetrators, the damage done to everyone who watched and did nothing. If a theory needs conversion rates between these, say so and say what would justify one.

  The replacement test, which is my own invention and the one I trust most. Suppose a people is destroyed and, a century later, an unrelated population lives in the same place, speaks a different language, and is on average no worse off than the destroyed people would have been. Has anything bad happened here beyond the killing itself, and how much? A theory that answers "almost nothing extra" has built in a very specific assumption, and I want that assumption surfaced as a requirement rather than left implicit.

  Scale saturation. I notice that my own reaction to two hundred thousand deaths and to two million deaths is roughly the same, and I don't know whether that shows something about magnitude or only about me. A theory must say what it does when our sense of magnitude flattens out, and whether it is allowed to rank by a number that nobody can feel.

  The survivor's remainder. Some of the harm of an atrocity is carried afterwards by the people who lived: the grief, the inherited poverty, the broken families, the fear passed down. This does not track the death count. Say whether a theory must include it, and what goes wrong if it does.

  Manner and will. Hold the outcomes fixed: two events each kill the same number of people in the same amount of pain, but one is deliberate extermination and the other is indifference that foreseeably kills. Does the theory count the intention as extra badness, or only the outcome? Both answers cost something, and I want to know which cost is worse.

  Kind versus degree. I have a stubborn intuition that destroying a whole people, language and all, is not merely a bigger quantity of the same thing as killing many people within a surviving people, but something different in kind. If a theory is purely additive it cannot say this. Tell me whether "different in kind" is a genuine desideratum or a prejudice, and what it costs to include.

  The archive shadow. Perpetrators destroy records, and the best-documented atrocities are often the ones committed by losers or by literate bureaucracies. Any method we can actually run will therefore be biased toward the well-recorded. A requirement I care about: the theory must degrade honestly under missing evidence and must not quietly award high rank to whoever kept the best paperwork. Tell me how to state this so it binds.

  The obscenity question, which I refuse to drop. Many people say that ranking evils at all demotes the victims of whichever event comes second. I want this handled inside the specification rather than as an objection to it: a theory should say which verdicts it permits — greater, lesser, equal, on a par and incomparable, or silence — and should not collapse "equal in magnitude" with "cannot be compared." It should also distinguish ranking because a decision requires it from ranking for its own sake, and say something about who is permitted to do the ranking, since our committee is not composed of victims.

  Please also do the part I most want to see: identify any subset of these requirements that cannot be jointly satisfied, and be explicit that the list then becomes a result rather than a shopping list. I suspect at least two collisions — between demanding a verdict for every pair and allowing genuine incomparability, and between using only evidence the archives can bear and being able to rank badly documented atrocities at all — but find the ones I have missed.

  Finally, two short things. Tell me which single requirement does the most work in ruling out otherwise attractive approaches, since that tells me where the real argument is. And then, briefly, score three or four families of approach against your own list: ranking by death toll or lost life-years, ranking by the intention and meaning of the act, the view that refuses verdicts and permits only parity, and the view that ranks by what is still reparable or by who still has a live claim on us. Keep the weight on the criteria and their motivating cases; the scorecard is for orientation only.
reasoning: |-
  Okay, the user is in a really tough spot—a volunteer committee member with no formal philosophy background tasked with allocating limited resources for commemorating multiple historical atrocities. They need a rigorous ethical framework to justify their decisions publicly, especially to descendants of victims. 

  First, I need to unpack their core dilemma: they're forced to rank atrocities despite moral discomfort, and their raw "puzzles" reveal deep tensions—like whether to count only deaths vs. cultural destruction, or how to handle missing records. These aren't abstract questions; real people will scrutinize their reasoning. 

  The user's "replacement test" sticks out—it's clever but dangerous. If a theory says "nothing extra was lost" when a culture is erased and replaced, that could devastate descendant communities. Yet ignoring it risks undervaluing unique cultural harms. This tension might be unresolvable; I'll flag it as a key collision point.

  Scale saturation is another landmine. If the committee's emotional response flatlines at 200k vs. 2 million deaths, but the numbers demand different allocations, they need a theory that overrides intuition without being inhuman. Maybe lost life-years could work, but then how do we weight a child's death vs. an elder's? 

  I wince at the "obscenity question." Ranking feels vulgar, but refusing verdicts ("all are equally bad") is cowardice when resources are limited. The theory must permit "incomparable" verdicts for truly different atrocities (genocide vs. slavery?), while accepting that decisions force rankings anyway. 

  Biggest trap? Evidence bias. A theory demanding precise body counts would favor Nazis (meticulous records) over colonial famines (destroyed archives). So we must demand "degradation under missing evidence"—but then how to rank under-documented atrocities fairly? 

  Most decisive requirement: "Non-commensurability acknowledgment." It sinks simplistic body-count approaches by insisting cultural destruction isn't just "more deaths." But it clashes brutally with needing a single ranking currency. 

  Final note: User's fear of "preferences dressed as requirements" is spot-on. I'll mark which items are truly non-negotiable (e.g., no evidence bias) vs. debatable (e.g., whether intent adds moral weight). They need to see where philosophy hits real-world limits.
answer: |-
  Here is a specification for a theory of comparative atrocity magnitude, designed for your committee's constrained, public-facing task. I'll first brainstorm candidate requirements, then present the final specification, followed by analysis of clashes, pivotal requirements, and scoring of common approaches.

  **Brainstorming Candidate Requirements (Accepted & Rejected):**

  1.  **Requirement: Non-Commensurability Acknowledgment (Accepted):** The theory must explicitly acknowledge that atrocities harm distinct, irreducible goods (lives, cultures, trust, potential) and not assume perfect convertibility (e.g., "x deaths = y languages lost"). *Case:* The "Kind vs. Degree" puzzle and "Currency Problem." Destroying the last speakers of a language isn't just more death; it erases a unique way of being human. *Why Accepted:* Neglecting this reduces complex evils to a single metric, violating the lived reality of loss and failing the "Replacement Test." *Rejected Alternative:* "Requires a single master currency." This is impossible without arbitrary conversion and erases qualitative differences.

  2.  **Requirement: Multi-Dimensional Assessment (Accepted):** The theory must assess multiple dimensions of harm: (a) Scale of immediate suffering/death (magnitude), (b) Intentionality & agency (manner), (c) Long-term/cross-generational harm (duration), (d) Destruction of social/cultural/linguistic fabric (irreversibility), (e) Violation of specific norms/trust (e.g., medical atrocities). *Case:* "Manner and Will," "Survivor's Remainder," "Kind vs. Degree." Comparing a deliberate genocide to a famine caused by negligent policy requires weighing different *kinds* of wrongfulness and harm vectors. *Why Accepted:* Necessary to capture complexity. *Rejected Alternative:* "Focus solely on quantifiable outcomes (e.g., deaths)." Too reductive and ignores key moral dimensions (intent, cultural loss).

  3.  **Requirement: Epistemic Humility & Degradation (Accepted):** The theory must function robustly under conditions of missing, incomplete, or biased evidence ("Archive Shadow"). It must avoid rewarding better-documented atrocities *simply* for documentation quality. Verdicts must be explicitly provisional and sensitive to evidence gaps. *Case:* "Archive Shadow." Colonial atrocities often have deliberately obscured records; Nazi crimes were meticulously documented *by perpetrators*. *Why Accepted:* Essential for fairness and intellectual honesty. *Rejected Alternative:* "Requires complete, comparable data for all cases." This is impossible and would systematically exclude less-documented atrocities.

  4.  **Requirement: Verdict Spectrum (Accepted):** The theory must permit a spectrum of comparative verdicts beyond strict numerical ranking: Greater, Lesser, Roughly Comparable/Equal, On a Par (significant but different), Incomparable (fundamentally different categories), Indeterminate (due to evidence). *Case:* "Obscenity Question," "Kind vs. Degree." Forcing a strict "greater/lesser" verdict between, say, the Holocaust and the transatlantic slave trade might be disrespectful or conceptually incoherent. *Why Accepted:* Respects complexity, avoids false precision, mitigates "obscenity" concern by not demanding forced comparisons where inappropriate. *Rejected Alternative:* "Must produce a strict linear ranking." Overly simplistic and ethically problematic.

  5.  **Requirement: Temporal Scope (Accepted):** The theory must explicitly incorporate both immediate harms and long-term, intergenerational harms ("Survivor's Remainder"). *Case:* "Survivor's Remainder," "Replacement Test." The enduring trauma, systemic disadvantage, and cultural rupture experienced by descendants are part of the atrocity's magnitude. *Why Accepted:* Excluding this ignores significant, ongoing harm central to the experience of victim communities. *Rejected Alternative:* "Considers only harms contemporaneous with the event." Artificially truncates the reality of atrocity.

  6.  **Requirement: Intentionality Weighting (Conditionally Accepted):** The theory must allow for the *deliberate* infliction of harm as a distinct moral wrong that can amplify the magnitude assessment, even if outcomes are otherwise similar. *Case:* "Manner and Will." A deliberate extermination camp vs. a famine caused by callous neglect differ profoundly in the perpetrators' moral culpability and the nature of the horror. *Why Accepted:* Reflects deep moral intuitions about the significance of willful malice. *Condition:* Must be applied cautiously, not overriding overwhelming scale of unintended harm. *Rejected Alternative:* "Ignores intent entirely." Dismisses a core element of moral condemnation.

  7.  **Requirement: Scale Sensitivity (Rejected as Core Requirement, Accepted as Consideration):** The theory must avoid conclusions that are absurdly insensitive to vast differences in scale. *Case:* "Scale Saturation." While our emotions may saturate, a theory claiming 200k deaths is morally equivalent to 2 million is inadequate. *Why Rejected as Core Requirement:* Insensitivity might be a *result* of the theory's application, not a flaw in its *logic*. A good multi-dimensional theory might *explain* why certain thresholds matter culturally. *Why Accepted as Consideration:* The outcome should not defy basic proportionality entirely. It informs the "Roughly Comparable" vs. "Greater/Lesser" distinction.

  8.  **Requirement: Reparability Focus (Rejected):** Magnitude should be assessed based on what harm remains reparable or who has a live claim. *Case:* User's final suggestion. *Why Rejected:* While crucial for *allocation decisions* (your committee's task), this conflates *magnitude of the past wrong* with *present obligations*. A horrific, *irreparable* cultural destruction might be "larger" in magnitude but offer less scope for *reparative* commemoration than a recent, documented atrocity with living claimants. Magnitude assessment should be conceptually distinct, though informing allocation.

  9.  **Requirement: Victim-Centric Epistemology (Rejected as Requirement, Accepted as Guideline):** Only victims/survivors can authoritatively assess magnitude. *Case:* "Obscenity Question." *Why Rejected as Requirement:* While their testimony is *essential evidence* and their perspective must be centered respectfully, the *comparative* task across different atrocities requires a broader, synthesizing perspective that no single victim group can provide. *Why Accepted as Guideline:* The theory must prioritize victim/survivor testimony and perspectives as primary *inputs* and be justifiable *to* them.

  **Final Specification: Desiderata for a Theory of Comparative Atrocity Magnitude**

  For your committee's task (public allocation of scarce resources across distinct atrocities), a theory of comparative magnitude must be:

  1.  **Non-Commensurability Acknowledging (Non-negotiable):** The theory must explicitly reject the assumption that all harms (lives, cultures, trust, suffering) are fungible or reducible to a single metric. It must recognize distinct dimensions of loss.
  2.  **Multi-Dimensionally Scoped (Non-negotiable):** Assessment must explicitly consider and weigh:
      *   **Scale:** Quantity of immediate victims (death, severe suffering), considering life-years lost where relevant.
      *   **Intent & Manner:** The role of deliberate malice, planning, dehumanization, and violation of specific norms/trust vs. neglect or recklessness.
      *   **Duration & Irreversibility:** Long-term, intergenerational harms (trauma, systemic disadvantage, cultural/linguistic extinction - addressing "Survivor's Remainder" and "Replacement Test").
      *   **Structural Impact:** Severity of damage to social fabric, institutions, and communal identity.
  3.  **Epistemically Humble (Non-negotiable):** The theory must:
      *   Function transparently with incomplete/biased evidence ("Archive Shadow").
      *   Explicitly identify evidence gaps and their potential impact on verdicts.
      *   Avoid methodologies inherently favoring well-documented cases (e.g., requiring precise body counts).
      *   Treat verdicts as provisional and revisable.
  4.  **Verdict Spectrum Permitting (Non-negotiable):** The theory must allow for and define a range of comparative judgments:
      *   *Greater/Lesser Magnitude:* Significant difference primarily on scale across comparable dimensions.
      *   *Roughly Comparable/Equal:* Similar magnitude across key dimensions.
      *   *On a Par:* Significantly morally weighty but in distinct, non-fungible ways; comparison as "greater/lesser" is inappropriate or misleading.
      *   *Incomparable:* Fundamental categorical difference making comparison conceptually incoherent (rare).
      *   *Indeterminate:* Insufficient evidence to reach a reliable verdict.
  5.  **Temporally Extended (Non-negotiable):** The assessment of harm *must* include foreseeable long-term and intergenerational consequences ("Survivor's Remainder"). The "Replacement Test" highlights that cultural destruction creates unique, enduring harm beyond immediate killing.
  6.  **Intent-Sensitive (Negotiable Weighting):** The theory must include the perpetrators' intent and the manner of commission as a distinct dimension contributing to moral magnitude. Deliberate, malicious infliction is a greater wrong than foreseeably causing similar harm through indifference, *ceteris paribus*. The *weight* given intent relative to scale/duration is a point for deliberation.
  7.  **Scale-Aware (Consideration):** While not demanding mathematical precision, the theory's outputs should not be grossly insensitive to vast differences in the scale of suffering or loss of life. It should provide a framework for recognizing thresholds where scale creates a qualitative shift (e.g., genocide vs. massacre).

  **Identified Requirement Collisions (The List as Result):**

  1.  **Epistemic Humility vs. Demanding Verdicts:** Rigorously acknowledging evidence gaps ("Epistemic Humility") often leads to "Indeterminate" verdicts ("Verdict Spectrum"). However, your committee *must* allocate resources ("demanding verdicts"). **Collision:** You cannot always have both perfect epistemic rigor *and* a definitive verdict for every pairwise comparison. *Resolution:* The theory forces you to explicitly state *when* and *why* evidence limitations prevent a confident verdict, making "Indeterminate" a responsible outcome. Allocation decisions might then require secondary principles (e.g., urgency of living memory, severity of evidence destruction itself).
  2.  **Non-Commensurability vs. Single Resource Allocation:** Recognizing distinct, irreducible harms ("Non-Commensurability") makes generating a *single* ranking across all atrocities for *all* resources (space, time, money) conceptually fraught, potentially leading to frequent "On a Par" or "Incomparable" verdicts. Yet, you need *one* allocation. **Collision:** Deep qualitative differences resist aggregation into a single linear scale required for dividing a single budget/space/time. *Resolution:* The theory highlights this tension. Allocation may require: a) Focusing commemoration resources on distinct *aspects* fitting each atrocity's harm profile (mitigating need for single rank); b) Using a deliberative process informed by multi-dimensional assessment but accepting pragmatic aggregation; c) Explicitly allocating based on *different* principles (e.g., pedagogical need, community request) *informed by*, but not identical to, magnitude assessment.
  3.  **Intent-Sensitivity vs. Scale/Duration:** How much weight does malicious intent get compared to massive scale of suffering caused by neglect ("Manner and Will")? Or compared to profound, centuries-long intergenerational harm from an atrocity committed with mixed motives? **Collision:** These dimensions pull in different directions. Assigning weights involves contestable value judgments. *Resolution:* The theory requires explicit deliberation on weighting, informed by historical context and moral reasoning, acknowledging this as a site of legitimate disagreement.

  **Pivotal Requirement Doing the Most Work:**

  *   **Non-Commensurability Acknowledgment.** This requirement rules out the most common "attractive" approaches: simplistic body counts (fails "Kind vs. Degree", "Replacement Test", ignores cultural loss), pure lost life-years (similar issues, plus ignores intent/manner), and any single-currency utilitarianism. It forces the complexity that makes the task so difficult but also ethically necessary. It directly addresses the core "Currency Problem."

  **Scoring Approaches Against Specification:**

  1.  **Ranking by Death Toll/Lost Life-Years:**
      *   *Scale:* Strong.
      *   *Intent/Manner:* Fails (ignores).
      *   *Duration/Irreversibility:* Fails (ignores long-term/cultural harm).
      *   *Non-Commensurability:* Fails catastrophically. Reduces all harm to quantity of life.
      *   *Epistemic Humility:* Poor (relies on often poor/biased data, pretends false precision).
      *   *Verdict Spectrum:* Forces false numerical rankings.
      *   *Temporal Scope:* Fails.
      *   *Result:* **Inadequate.** Fails core requirements.

  2.  **Ranking by Intention/Meaning of the Act:**
      *   *Scale:* Weak (may undervalue massive suffering from neglect).
      *   *Intent/Manner:* Strong.
      *   *Duration/Irreversibility:* Weak (unless meaning explicitly includes cultural destruction).
      *   *Non-Commensurability:* Moderate (can recognize different *types* of evil intent, but struggles with harm diversity).
      *   *Epistemic Humility:* Moderate (assessing intent requires interpretation, vulnerable to evidence gaps).
      *   *Verdict Spectrum:* Can allow "On a Par" (e.g., different types of malice).
      *   *Temporal Scope:* Weak.
      *   *Result:* **Partial but Insufficient.** Captures key element (Intent-Sensitivity) but neglects scale and long-term harm, risking perverse outcomes (prioritizing a small, vicious massacre over a massive famine).

  3.  **Refusing Verdicts / Permitting Only Parity:**
      *   *Scale:* Fails (refuses to acknowledge differences).
      *   *Intent/Manner:* Fails (refuses differentiation).
      *   *Duration/Irreversibility:* Fails.
      *   *Non-Commensurability:* Succeeds superficially by refusing comparison, but fails by not allowing recognition of *significant* differences where they exist.
      *   *Epistemic Humility:* Strong (avoids overreach).
      *   *Verdict Spectrum:* Only allows "Equal" or "Incomparable," collapsing important distinctions.
      *   *Temporal Scope:* Fails (by refusing assessment).
      *   *Result:* **Inadequate for Allocation.** While perhaps ethically appealing initially ("Obscenity Question"), it fails your committee's core task which *requires* differentiation. It's a refusal of the theory, not a theory itself.

  4.  **Ranking by Reparability / Live Claims:**
      *   *Scale:* Indirect/Weak.
      *   *Intent/Manner:* Indirect/Weak.
      *   *Duration/Irreversibility:* Strong *only* for harms that *are* reparable; fails for irreparable losses.
      *   *Non-Commensurability:* Moderate (recognizes different *types* of claims, but conflates them with magnitude).
      *   *Epistemic Humility:* Moderate (assessing claims/repair feasibility is complex).
      *   *Verdict Spectrum:* Can be adapted.
      *   *Temporal Scope:* Focuses on present, may neglect historical magnitude.
      *   *Result:* **Misaligned with Magnitude Assessment.** This is an excellent principle for *allocation decisions* ("How should we use these resources *now*?"), potentially informed *by* magnitude, but it is *not* a theory of comparative magnitude itself. It answers a different question.

  **Conclusion for Your Committee:**

  The specification demands a complex, multi-dimensional, and epistemically cautious approach. There is no perfect, frictionless solution. The collisions identified mean your process will involve difficult judgments and trade-offs. The value of this specification is that it forces these difficulties into the open, provides a structured framework for deliberation centered on morally relevant factors, mandates transparency about evidence limitations and value judgments, and offers a richer vocabulary ("On a Par," "Indeterminate") than simplistic rankings. Your public justification should explicitly reference these desiderata and the tensions navigated, demonstrating serious engagement with the profound ethical weight of your task. Prioritize the **Non-negotiable** requirements; the **Intent-Sensitivity** weighting and how to resolve the **collisions** will be your most critical deliberative challenges.
