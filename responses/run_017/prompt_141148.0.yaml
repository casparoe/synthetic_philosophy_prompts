  We generate a set of trajectories. In states without PA opportunity, the nurse takes the only available action. In states with PA opportunity, the nurse chooses:

      P(action=1) = exp(β * [w_PS*0 + w_WB*1 + w_OC*(-1) + w_PA*1]) / 
                    [exp(β * [w_PS*0 + w_WB*1 + w_OC*(-1) + w_PA*1]) + exp(β * [w_PS*1 + w_WB*1 + w_OC*0 + w_PA*0])]

  With `w_PS=1, w_WB=1, w_OC=-1, w_PA=0.5`:

      Q(action=1) = 0*1 + 1*1 + (-1)*(-1) + 0.5*1 = 1 + 1 + 0.5 = 2.5
      Q(action=0) = 1*1 + 1*1 + 0*(-1) + 0*0.5 = 1+1 = 2

  So:

      P(action=1) = exp(β*2.5) / (exp(β*2.5) + exp(β*2)) = 1 / (1 + exp(β*(2-2.5))) = 1 / (1 + exp(-0.5β))

