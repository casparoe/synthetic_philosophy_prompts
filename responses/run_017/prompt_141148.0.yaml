  We are given a scenario where two IRL algorithms, MaxEnt IRL (A) and Max-Margin IRL with L1 penalty (B), observe the same data but infer very different reward functions. Specifically, we want a case where:

  - A infers a substantial positive weight on a particular feature (say, feature X) while B infers that the weight of X is essentially zero.
  - The disputed feature X binds (i.e., influences the decision) at 5-20% of decision points and is costly when it does.
  - The disagreement matters: acting on A's reward would protect the feature, while acting on B's would ignore it.

  We are to avoid common pitfalls (e.g., reward scale, degenerate rewards, etc.) and ground the scenario in a realistic institutional setting.

  ### Scenario: Hospital Nurse Scheduling

  **Setting:** A hospital unit with a senior nurse (the demonstrator) who has been working for several months. The state space consists of the current shift schedule (which nurses are assigned to which shifts and patients) and the current patient load (severity, specific needs). The actions are adjustments to the schedule (e.g., swapping shifts, calling in a replacement, reassigning patients). The features are derived from the administrative records and include:

  1. **Patient Safety (PS):** A measure of the overall safety of the schedule (e.g., avoiding situations where a critical patient is assigned to a nurse with insufficient experience).
  2. **Nurse Workload Balance (WB):** A measure of the fairness of workload distribution (e.g., avoiding consecutive night shifts, ensuring rest periods).
  3. **Overtime Cost (OC):** The amount of overtime incurred by the schedule.
  4. **Nurse Preference Adherence (PA):** How well the schedule adheres to the stated preferences of the nurses (e.g., requested days off, preferred shifts). This is the disputed feature.

  The nurse makes adjustments to the schedule periodically (e.g., daily). The feature PA is costly because accommodating a nurse's preference often requires rearranging the schedule, which might lead to increased overtime or temporary imbalance in workload. It is observed that the nurse sometimes makes adjustments to respect a nurse's strong preference (about 15% of the time) but at a cost (e.g., increased OC or reduced WB in the short term).

  However, the nurse's self-report about the importance of PA might be untrustworthy because:
  - The nurse might feel pressured to say that they value fairness and employee satisfaction, even if they are actually more focused on safety and cost.
  - Alternatively, the nurse might be unavailable for comment (e.g., left the job).

  Thus, we rely solely on the observed behavior.

  ### Formal Setup

  We model the problem as a Markov Decision Process (MDP) with states `s`, actions `a`, and features `φ(s,a)` (or `φ(s)` for state features). The reward function is linear in the features: `R(s) = w·φ(s)`, with `w = [w_PS, w_WB, w_OC, w_PA]`. We normalize so that `w_PS = 1` (the primary feature, patient safety, is the reference).

  **Demonstrator's Behavior:** We assume the nurse is approximately optimal but with some imperfections. For MaxEnt IRL (Learner A), we assume Boltzmann-rational behavior:

      P(a|s) ∝ exp(β * Q(s,a))

  where `Q(s,a)` is the action-value function under the true reward.

  For Max-Margin IRL (Learner B), we assume that the demonstrator is near-optimal, and we use the maximum margin formulation with a loss that is capped (hinge loss) and an L1 penalty on the weights to encourage sparsity.

  **The Disputed Feature (PA):** We design the MDP so that:

  - In 15% of the states, the nurse takes an action that increases PA (by accommodating a preference) at the cost of increasing OC and/or reducing WB and PS (slightly). In these states, the cost of increasing PA is high (so the action is only taken when PA is highly valued).
  - In the remaining 85%, the nurse does not sacrifice the other features for PA.

  ### Construction of the MDP

  We design a simple MDP with discrete states and actions to illustrate the point.

  **States:** 
  - Each state is characterized by four feature values: PS, WB, OC, PA. We discretize each feature to two levels: low (0) and high (1). However, note that PA is only relevant in a subset of states (about 15% of the time). We can think of the state as having an additional binary flag: `PA_opportunity` (1 for 15% of states, 0 otherwise). When `PA_opportunity=1`, the nurse can choose to set PA=1 at the cost of reducing one of the other features (or increasing OC).

  **Actions:**
  - In states without PA opportunity, there is only one action (do nothing) and the features remain as they are.
  - In states with PA opportunity, the nurse has two actions:
      - Action 0: Do nothing. Features remain: PS=1, WB=1, OC=0, PA=0.
      - Action 1: Accommodate the preference. This sets PA=1 but at a cost: OC becomes 1 (overtime incurred) and PS becomes 0 (safety is temporarily lowered because the reassignment leads to a less experienced nurse on a critical case). WB remains 1.

  **True Reward Function:** We assume the true reward weights are `w_PS=1, w_WB=1, w_OC=-1, w_PA=0.5`. However, note that the demonstrator is not perfectly optimal. We model the demonstrator as Boltzmann-rational with a fixed β (inverse temperature) for MaxEnt IRL. For Max-Margin, we assume the demonstrator is near-optimal (within a margin).

