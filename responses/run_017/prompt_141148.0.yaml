      Empirical PS = 0.85 + 0.15*(1 - P(a1)) = 1 - 0.15*P(a1) = 0.8905 (from earlier calculation) -> P(a1)=0.73
      Empirical OC = 0.15 * P(a1) = 0.1095
      Empirical PA = 0.15 * P(a1) = 0.1095
      Empirical WB = 1

  For the policy in the PA state:

      P(a1) = 1 / (1 + exp(β*( [w_PS+w_WB] - [w_WB+w_OC+w_PA] )))
             = 1 / (1 + exp(β*(w_PS - w_OC - w_PA)))

  With w_PS=1, β=2:

      1 / (1 + exp(2*(1 - w_OC - w_PA))) = 0.73

  This requires:

      exp(2*(1 - w_OC - w_PA)) = (1/0.73)-1 ≈ 0.3699
      2*(1 - w_OC - w_PA) = ln(0.3699) ≈ -1
      1 - w_OC - w_PA = -0.5
      w_OC + w_PA = 1.5

   Also, the expected feature for WB is always 1, which matches.

   But now, how do we separate w_OC and w_PA? We cannot because the features OC and PA always appear together. So any reward function with w_OC + w_PA = 1.5 will yield the same policy and the same expected features. For example, (w_OC=1.5, w_PA=0) or (w_OC=0, w_PA=1.5) or (w_OC=0.75, w_PA=0.75) are all solutions.

   However, note that the true reward had w_OC=-1 and w_PA=0.5, so w_OC+w_PA=-0.5, but this is not 1.5. This means that the Boltzmann-rational demonstrator with the true weights would not produce P(a1)=0.73. In fact, with the true weights:

      Q(a0) = 1+1 = 2
      Q(a1) = 0+1-1+0.5 = 0.5
      P(a1) = 1/(1+exp(2*(2-0.5))) = 1/(1+exp(3))≈0.0474

  But in the data we generated we had to use a different true weight for PA to get P(a1)=0.73. So let's set the true weights to be: w_PS=1, w_WB=1, w_OC=-1, w_PA=2.5 (because then w_OC+w_PA=1.5). Then:

      Q(a0)=2
      Q(a1)=0+1-1+2.5=2.5
      P(a1)=1/(1+exp(2*(2-2.5)))=1/(1+exp(-1))≈0.731

  So the true reward has w_PA=2.5.

  But now, for MaxEnt IRL, we have an infinite number of solutions: any (w_OC, w_PA) such that w_OC+w_PA=1.5. How does the algorithm choose? Typically, MaxEnt IRL with linear rewards and without additional regularization will have this ambiguity. In practice, we might add a small L2 penalty, but we are not doing that here.

  So Learner A (MaxEnt IRL) might output any solution in this plane. But note, we want it to infer a substantial positive weight on PA. However, it could just as well infer a solution with w_PA=0 and w_OC=1.5, or w_PA=1.5 and w_OC=0.

  To force it to choose a solution with a positive w_PA, we might rely on the fact that the true data has the feature PA=1 sometimes and OC=1 sometimes, and if we have a solution with w_PA=1.5 and w_OC=0, then it would mean the demonstrator is willing to incur a safety drop (PS=0) to get PA=1 even though there's no reward for OC (which is 1 in that state) and in fact OC is costly? But wait, in the action1 state, OC=1 and if w_OC=0, then there's no cost. So that might be a valid solution.

  However, the true reward has w_OC=-1, but that's not known.

  The problem is that without additional regularization, MaxEnt IRL does not unique determine the weights for perfectly correlated features. 

  ### How to Break the Tie in MaxEnt IRL

  In practice, many implementations of MaxEnt IRL use an L2 regularizer on the weights. If we add a small L2 penalty, then among the solutions with w_OC+w_PA=1.5, the one with the smallest L2 norm would be w_OC=0.75, w_PA=0.75. But that still has w_PA>0.

  Alternatively, if we do not regularize, the algorithm might not converge to a unique solution. 

  But for the sake of the case, let us assume that we run MaxEnt IRL without regularization and it returns one solution from the plane. We want to show that it might return a solution with a substantial w_PA. 

  For Learner B (Max-Margin with L1 penalty), the L1 penalty will try to drive some weights to zero. 

  ### Learner B: Max-Margin IRL with L1 Penalty

  Max-Margin IRL typically looks for a reward function that makes the demonstrator's policy better than other policies by a margin. We use the formulation with a loss that is the sum of a hinge loss over state-action pairs (capped at some margin) and an L1 penalty on the weights.

  The optimization problem for B is:

      min_{w} ||w||_1 + C * sum_{s,a} l(s,a)

      where l(s,a) is the hinge loss: max(0, margin - (Q(s, a; w) - max_{a'≠a} Q(s, a'; w) ))

      or more commonly, the loss is defined per state as the difference between the value of the demonstrator's action and the best alternative action.

  We simplify: for each state s in the demonstration, let a_s be the demonstrator's action. Then the loss for that state is:

      loss(s) = max_{a} [ Q(s,a; w) ] - Q(s, a_s; w)

  But then we use hinge loss: max(0, loss(s) - margin) or sometimes just loss(s) if we want to penalize any positive loss.

  However, a common formulation is to require that the demonstrator's action has a value at least as high as the best alternative by a margin, and penalize violations.

  The L1 penalty encourages sparsity.

  ### How Learner B Might Infer w_PA=0

  In our PA state, the demonstrator sometimes takes action0 and sometimes action1. For a state where the demonstrator took action1, we require that:

      Q(s, a1) >= Q(s, a0) + margin - slack

  But if we set w_OC and w_PA to zero, then:

      Q(s, a0) = w_PS*1 + w_WB*1 = 1+1 = 2
      Q(s, a1) = w_PS*0 + w_WB*1 + w_OC*0 + w_PA*0 = 1

  So Q(s,a1) = 1 < 2 = Q(s,a0), so the margin condition is violated. We would have to pay a slack penalty.

  Similarly, in a state where the demonstrator took action0, we require:

      Q(s, a0) >= Q(s, a1) + margin - slack

  With w_OC=w_PA=0: Q(s,a0)=2, Q(s,a1)=1 -> satisfied.

  Now, if we set w_OC=-1 and w_PA=0 (leaving the others at 1), then in a PA state:

      a0: 2
      a1: 1 + (-1)*1 +0 = 0

      If demonstrator took a1: then we require a1>=a0+margin - slack -> 0>=2+margin - slack -> violation.
      If demonstrator took a0: then we require a0>=a1+margin - slack -> 2>=0+margin - slack -> which is likely satisfied for reasonable margin.

  Alternatively, if we set w_OC=0 and w_PA=1.5, then in PA state:

      a0: 2
      a1: 1 +0+1.5 = 2.5

      If demonstrator took a1: 2.5>=2+margin - slack -> satisfied if margin is not too large.
      If demonstrator took a0: 2>=2.5+margin - slack -> violation.

  The key is that the demonstrator sometimes takes a0 and sometimes a1. For the a1 actions, we need a reward function that makes a1 better than a0, and for the a0 actions, we need a0 better than a1.

  The only way to explain both is to have the reward function assign positive weight to PA and negative weight to OC, or vice versa, but note that in the state, when taking a1, PA=1 and OC=1, and when taking a0, PA=0 and OC=0.

  So if we set w_PA>0 and w_OC<0, then:

      a1: 0*w_PS + 1*w_WB + 1*w_OC + 1*w_PA = 1 + w_OC + w_PA
      a0: 1*w_PS + 1*w_WB = 1+1=2

  For a1 to be taken, we require: 1 + w_OC + w_PA > 2, i.e., w_OC + w_PA > 1.
  For a0 to be taken, we require: 2 > 1 + w_OC + w_PA, i.e., w_OC + w_PA < 1.

  This is a contradiction.

  Therefore, it is impossible to have a reward function that explains both actions without additional features or without context. 

  This is the expensive-seldom problem: because the feature PA is only active in states where it is costly (in terms of PS and OC), and because the demonstrator sometimes chooses to pay the cost and sometimes not, it is challenging to learn the weight on PA.

  In this One-type PA state setting, it is impossible for a linear reward function to explain both actions in the same state. The demonstrator's behavior is inconsistent with being optimal for a linear reward function.

  Therefore, we must either:
  - Use a non-linear reward function.
  - Add more features to differentiate the states.
  - Assume the demonstrator is not always optimal.

  In our MaxEnt IRL, we already assume a softmax policy, so it can explain the mixed actions.

  For Max-Margin IRL, we assume the demonstrator is near-optimal within a margin, but in this case, for a given state, the demonstrator takes both actions at different times. This will require that the reward function does not strongly prefer one action over the other, but the linearity and the feature vector make the two actions have a fixed reward difference in that state.

  ### A Way Forward: Introduce a Hidden State

  To make the scenario work, we introduce a hidden state that varies and affects the cost of the PA action. For example, in some PA states, the cost of safety drop is very high (e.g., the patient is critical) and in others, it is not. But the administrative records might not capture this. So the feature vector is the same for all PA states, but the demonstrator's choice depends on unobserved factors.

  However, the assignment requires that the two learners observe exactly the same thing, including the same state representation.

  ### Alternatively, we can use the two-type PA state setting from earlier.

  In the two-type setting, the feature vectors are different for the two types.

  Let's go back to the two-type setting with true weights: w_PS=1, w_WB=1, w_OC=-1, w_PA=2.5.
  But we found that to get a reasonable frequency, we use the one-type setting with true weights: w_PS=1, w_WB=1, w_OC=-1, w_PA=2.5, and then in the PA state, the demonstrator takes action1 with probability 0.73.

  For the two-type setting, we had to set the true weights differently and didn't achieve the desired frequency. Given the complexity, let's instead use the one-type setting and live with the fact that for MaxEnt IRL, we have an underdetermined system, and for Max-Margin, we will have to penalty for the states where the demonstrator took the action that is suboptimal according to the reward.

  ### Conclusion on the Case

  After trying, it appears that the expensive-seldem problem is real and that it can cause a divergence between the two methods. However, the perfect correlation of features in the one-type setting makes MaxEnt IRL underdetermined, while the mixed actions in the same state make Max-Margin IRL with a linear reward function have to violate the margin for some states.

   We therefore build the case as follows:

  **Scenario:** 
  - In a hospital, a nurse makes schedule adjustments. In 85% of the states, no trade-off is possible ( features: PS=1, WB=1, OC=0, PA=0).
  - In 15% of the states (PA states), the nurse can choose to accommodate a nurse's preference (action1) at the cost of a safety drop (PS=0) and overtime (OC=1), or not (action0) ( features then: [1,1,0,0] for action0, [0,1,1,1] for action1).
  - The demonstrator (nurse) chooses action1 in 73% of the PA states and action0 in 27% of them.

  **MaxEnt IRL (Learner A):**
  - It seeks to match the empirical feature counts: [0.8905, 1, 0.1095, 0.1095].
  - The only constraint from the PA state is: w_OC + w_PA = 1.5 (with w_PS=1, w_WB=1 fixed).
  - Without additional regularization, many solutions exist. It might return, for example, (w_OC=0, w_PA=1.5) or (w_OC=1.5, w_PA=0) or (w_OC=0.75, w_PA=0.75). 
  - If we run the algorithm and it returns (w_OC=0, w_PA=1.5), then it has inferred a substantial positive weight on PA.

  **Max-Margin IRL with L1 penalty (Learner B):**
  - The L1 penalty will favor sparse solutions.
  - A sparse solution would be to set as many weights to zero as possible.
  - Note that the features PS and WB are always 1 in the demonstration. If we set w_PS=1, w_WB=0, w_OC=0, w_PA=0, then in non-PA states, the reward is 1.
  - In PA states:
      - action0: reward = 1 (from PS)
      - action1: reward = 0 ( from PS=0)
      - So action0 is better.
  - This explains the action0 states (27% of PA states) perfectly, but for action1 states (73% of PA states), it has a violation: the best action is action0 with reward 1, but the demonstrator chose action1 with reward 0. The margin violation is 1 - 0 = 1 (if margin=0).
  - Alternatively, if we set w_PS=1, and then try to explain the PA states, we might set w_OC and w_P to non-zero, but we want to minimize the number of non-zero weights.
  - The next sparse solution is to set only one additional weight to non-zero. 
    - If we set w_PA=1.5, then in PA state action1: reward=0+1.5=1.5, action0: 1. This explains why action1 is taken in some states, but then in states where action0 is taken, we have violation: action1 would yield 1.5 > 1.
    - Similarly, if we set w_OC=1.5, then in PA state action1: reward=1.5, action0:1 -> again, action1 is always better.
  - to explain mixed actions in the same state, we would need to have both w_OC and w_PA non-zero, and moreover to have the net effect (w_OC + w_PA) be close to 1.5, but then it would not be sparse.
  - Given the L1 penalty, Learner B might prefer to set both w_OC and w_PA to zero and absorb the loss for the action1 states. The loss for those states is: 
          loss = max(0, margin - (Q(s, a1) - max_{a} Q(s,a) ))
      but if w_OC=w_PA=0, then max_a Q(s,a)=2 (action0), and Q(s,a1)=1, so if margin=0, loss = 2-1 =1 per state.
      The number of such states is 0.73 * 0.15 * N, where N is the total number of states.
  - If we set w_OC and w_PA to non-zero, then we incur an L1 penalty of |w_OC| + |w_PA|, but might reduce the loss. However, because the mixed actions are in the same state, any reward function that makes action1 better in some PA states and worse in others is impossible because the state features are the same. Therefore, we must have the same reward for action1 across all PA states.

   So the only way to reduce the loss is to have w_OC + w_PA > 1, so that action1 is always better, but then in the action0 states (27% of PA states) we would have a loss because the demonstrator did not take the best action (action1). The loss in those states would be the difference in reward between action1 and action0.

   Therefore, the minimal loss solution might be to set w_OC=0, w_PA=0 and take the loss on the action1 states, or to set a non-sparse solution.

   Given the L1 penalty and the number of states, if C ( the trade-off parameter) is small, then the sparse solution (w_OC=w_PA=0) might be chosen.

   So we arrange parameters so that the cost of the loss for the action1 states is less than the cost of the L1 penalty for two additional weights.

   Specifically, the total loss for the action1 states is: for each such state, loss = 1 ( if we use margin=0 and loss= max_a Q - Q_demo). There are 0.15*0.73*N = 0.1095 * N states.
   The regularization term is ||w||_1 = |w_PS| + |w_WB| + |w_OC| + |w_PA|. If we set w_PS=1, w_WB=0, w_OC=0, w_PA=0, then ||w||_1=1.
   If we try to explain the action1 states by setting w_PA=1.5, then ||w||_1 = 1+1.5=2.5, and the loss for the action1 states becomes 0, but the action0 states (0.15*0.27*N=0.0405*N) will have loss = (1.5 - 1) = 0.5 per state? Actually, in the action0 states, the demonstrator chose action0, but the best action is action1 with reward 1.5, so the loss = 1.5 - 1 = 0.5 ( for action0: PS=1 -> reward=1, action1: reward=1.5, so demonstrator should have gotten 1.5 but only got 1, so loss=0.5).

   So the total loss for this solution: 0.0405 * N * 0.5 = 0.02025 * N.
   The regularization term: 2.5.
   The objective: 2.5 + C * 0.02025 * N.

   For the sparse solution: regularization=1, loss=0.1095 * N * 1 = 0.1095 * N.
   Objective: 1 + C * 0.1095 * N.

   We want the sparse solution to have a lower objective:

      1 + C * 0.1095 * N < 2.5 + C * 0.02025 * N
      => 1 + 0.1095 * C * N < 2.5 + 0.02025 * C * N
      => 0.08925 * C * N < 1.5
      => C * N < 1.5 / 0.08925 ≈ 16.8

   So if we choose C and N such that C * N < 16.8, then the sparse solution is better.

   Since N is the number of states, it is large (e.g., 10,000), so unless C is very small ( < 0.00168), the sparse solution is not better. We want the sparse solution to be better, so we choose C such that C * N < 16.8, for example, C = 16.8 / (N+1) or choose C small enough.

   Alternatively, we can choose the margin to be large. Typically, the loss is capped at a margin. If we use a capped loss, say the hinge loss with a margin of 1, then the loss for a state is at most 1. In the action1 states for the sparse solution: loss = min(1, 2-1) =1.
   In the non-sparse solution for action0 states: loss = min(1, 1.5-1)=0.5.

   Then the objective for the sparse solution: 1 + C * (0.1095 * N * 1) = 1 + 0.1095 * C * N.
   For the non-sparse solution: 2.5 + C * (0.0405 * N * 0.5) = 2.5 + 0.02025 * C * N.

   Then for the sparse solution to be better:

      1 + 0.1095 * C * N < 2.5 + 0.02025 * C * N
      => 0.08925 * C * N < 1.5
      => C * N < 16.8 (same as above)

   So with a capped loss, it's the same.

   To make the sparse solution better, we set C such that C * N < 16.8. For example, with N=10,000, C < 0.00168.

   So we choose C=0.001.

   Then:
      Sparse: objective = 1 + 0.001 * 0.1095 * 10000 = 1 + 1.095 = 2.095
      Non-sparse: objective = 2.5 + 0.001 * 0.02025 * 10000 = 2.5 + 0.2025 = 2.7025

   So sparse is better.

   Additionally, there might be a solution that sets only one weight. For example, set w_OC=0 and w_PA=0, or set only w_OC non-zero. But note, if we set only w_OC, say w_OC=1.5, then in the PA state:
      action0: 1+1=2
      action1: 1 +1.5 =2.5
   then in action0 states: loss = 2.5-2=0.5, and in action1 states: loss=0.
   then objective = |w_PS|+|w_WB|+|w_OC| = 1+0+1.5=2.5, and loss=0.0405*N*0.5=0.02025*N, so for C=0.001, N=10000: 2.5 + 0.001*0.02025*10000=2.5+0.2025=2.7025, which is higher than sparse.

   Therefore, the sparse solution (w_OC=0, w_PA=0) is chosen.

  ### Summary for the Case

  - **Learner A (MaxEnt IRL)** might infer (w_OC=0, w_PA=1.5) or other solutions with w_PA>0.
  - **Learner B (Max-Margin with L1 and small C)** infers (w_PS=1, w_WB=0, w_OC=0, w_PA=0) [note: it might also set w_WB=0, as above].

   Then:
  - A system trained on A's reward would protect PA because it believes PA has a positive weight.
  - A system trained on B's reward would ignore PA because its weight is zero.

  ### Expensive-seldom problem

  This is an instance of the expensive-seldom problem: the feature PA is expensive to obtain (requires giving up PS and incurring OC) and is obtained seldom ( in 10.95% of the states overall). The infrequency and cost make it hard to distinguish from noise.

  ### Four Additional Requests

  1. **Structural feature causing the divergence:** 
     - For MaxEnt IRL: it matches feature counts, which include PA being present sometimes, so it must have a weight to explain it.
     - For Max-Margin with L1: the L1 penalty drives weights to zero, and the capped loss (or the linear loss) means that infrequent events might be explained as noise ( by setting their weight to zero and taking the loss) if the saving in regularization is worth it.

     In this case, the key is that MaxEnt IRL has a frequency-matching constraint, while Max-Margin has a per-deviation loss that is additively combined with a sparsity penalty.

  2. **Ablation:**
     - If we give the margin learner a frequency-matching constraint, then it would be forced to have the expected feature counts, and then it would have to have w_OC+w_PA=1.5, and the L1 penalty might then drive one of them to zero ( but then the other would be 1.5, so not sparse) or choose a solution in between. But the frequency-matching constraint would force it to have the feature counts, so it would not set both to zero. Therefore, the disagreement would collapse: both methods would have to have the feature PA present in the reward, and the only difference might be in the sparsity of the representation.
     - If we cap the maximum-entropy learner's loss ( for example, by using a prior that encourages sparsity), then it might choose the sparse solution with w_PA=0. In this case, the disagreement might collapse to both setting w_PA=0.

  3. **Defense of the worse framework:**
     - A defender of the margin method might say that the infrequency of the PA action (10.95% of states) and the fact that it is costly might indicate that it is not intentional, but rather noise or constraint. They might argue that the demonstrator's actions in the PA states are in fact not driven by a desire for PA, but by some unobserved factor. The sparse solution is more interpretable and robust.
     - In this synthetic case, the PA actions are intentional (we built them in), but in real data, they might not be. The defender might also attack the choice of C: if C is chosen larger, then the non-sparse solution might be selected. They might argue that in practice, C is chosen by cross-validation.

     In our case, we chose C to be small to make the sparse solution better. If we had chosen C larger, then the non-sparse solution might be selected. So the attack might succeed in criticizing the choice of C.

  4. **Scaling the data:**
     - If we multiply the observed behavior tenfold (N becomes 10 times larger), then for the margin method, the objective for the sparse solution becomes: 1 + C * 0.1095 * 10N.
     - For the non-sparse solution: 2.5 + C * 0.02025 * 10N.
     - The condition for the sparse solution being better is: 1 + 1.095 * C * N < 2.5 + 0.2025 * C * N, which is: 0.8925 * C * N < 1.5.
     - As N increases, the left side increases linearly. For sufficiently large N, the non-sparse solution will have a lower objective. Therefore, with more data, the margin method would eventually choose the non-sparse solution.

     For MaxEnt IRL, with more data, the feature counts become more accurate, and it would still be the case that w_OC+w_PA=1.5, but it might choose a solution with w_PA>0.

     Therefore, with more data, the two methods would converge to rewards that include the PA feature. The expensive-seldom problem is mitigated by more data.

  ### Final Note

  We've built a case where the two methods disagree due to the expensive-seldom nature of the feature PA. With more data, the methods converge. This supports the interviewee's claim that underdetermination goes away with enough data. However, the "enough" might be a very large amount when the feature is expensive and seldom.

