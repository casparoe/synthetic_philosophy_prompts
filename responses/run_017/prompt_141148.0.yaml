answer: |-
  ### The Expensive-Seldom Problem in a Hospital Setting  

  **Scenario:**  
  At City General Hospital, Senior Nurse Maya adjusts shift schedules daily to balance four key features:  
  1. **Patient Safety (PS):** Minimizing high-risk nurse-to-patient ratios.  
  2. **Workload Balance (WB):** Ensuring equitable shift distribution.  
  3. **Overtime Cost (OC):** Minimizing paid overtime.  
  4. **Nurse Preference Adherence (PA):** Accommodating personal requests (e.g., birthdays, childcare).  

  Maya’s adjustments are logged over 6 months. In 85% of decisions, she prioritizes PS, WB, and OC, leaving PA at 0. But in 15% of decisions, she sacrifices PS and OC to increase PA—for example, granting a nurse’s birthday off by assigning a less experienced nurse to a high-risk patient, increasing overtime. This incurs a high cost: PS drops to 0, OC spikes to 1, and WB remains 1. PA is only achievable in these 15% of states and is costly when pursued.  

  Maya’s self-report is untrustworthy due to institutional pressure to prioritize "employee satisfaction" publicly, while internal metrics emphasize cost control. Her true priorities must be inferred from behavior alone.  

  ---  

  ### Learner A: Maximum-Entropy IRL  
  **Framework:**  
  - Assumes a Boltzmann-rational demonstrator: \( P(a|s) \propto e^{\beta Q(s,a)} \).  
  - Reward: \( R(s) = w_{\text{PS}} \cdot \text{PS} + w_{\text{WB}} \cdot \text{WB} + w_{\text{OC}} \cdot \text{OC} + w_{\text{PA}} \cdot \text{PA} \).  
  - **Constraints:** Fits weights so expected feature counts match empirical counts. Normalized to \( w_{\text{PS}} = 1 \), fixed \( \beta = 2 \).  

  **Empirical Feature Counts (per state):**  
  - PS: 0.8905  
  - WB: 1.0  
  - OC: 0.1095  
  - PA: 0.1095  

  **Derivation:**  
  - In non-PA states (85%): PS=1, WB=1, OC=0, PA=0.  
  - In PA states (15%):  
    - Action 0: PS=1, WB=1, OC=0, PA=0.  
    - Action 1: PS=0, WB=1, OC=1, PA=1.  
  - Observed: Maya chooses Action 1 (increase PA) in 73% of PA states.  
  - MaxEnt IRL solves for weights such that:  
    \[
    \mathbb{E}_{\pi}[\phi] = \phi_{\text{empirical}}
    \]  
    This yields:  
    \[ 
    w_{\text{OC}} + w_{\text{PA}} = 1.5 \quad (\text{from PA-state policy constraint})
    \]  
  - Solutions include \( (w_{\text{OC}} = 0, w_{\text{PA}} = 1.5) \), \( (w_{\text{OC}} = 1.5, w_{\text{PA}} = 0) \), or intermediates.  
  - **Inference:** With no regularization, MaxEnt often returns \( w_{\text{PA}} = 1.5 \) (substantial positive weight), as PA is active when chosen.  

  **Verdict:** Protect PA—e.g., a system using this reward would hire backup nurses to avoid safety drops when granting preferences.  

  ---  

  ### Learner B: Maximum-Margin IRL with L1 Penalty  
  **Framework:**  
  - Minimizes: \( \|w\|_1 + C \sum \ell \), where \( \ell = \max(0, \text{margin} - (Q(s,a_{\text{demo}}) - \max_{a} Q(s,a)) \).  
  - Margin = 1, \( C = 0.001 \), capped hinge loss.  
  - Reward: Same linear form.  

  **Derivation:**  
  - L1 penalty incentivizes sparsity (many zero weights).  
  - **Sparse candidate solutions:**  
    - Option 1: \( w = [1, 0, 0, 0] \) (only PS).  
      - Loss: In PA states where Maya chose Action 1, \( Q_{\text{best}} = 2 \) (Action 0), \( Q_{\text{demo}} = 1 \) (Action 1) → loss = 1.  
