  ### Final Note  
  This **is** the expensive-seldom problem: Costly, infrequent actions (PA) can be explained by either a high-weight/seldom-binding reward term (MaxEnt) or random lapse (Max-Margin). The frameworks diverge because MaxEnt’s frequency-matching *demands* an explanation for seldom events, while Max-Margin’s capped loss *discounts* them. However, your interviewee is ultimately correct: With enough data (here, 10×), the inference stabilizes. For journalism, emphasize:  
  > "While inference is indeterminate in sparse data, the solution is not better algorithms—it is simply *more* data. Institutions recording 'seldom' events at scale (e.g., via digital logs) mitigate this issue."
