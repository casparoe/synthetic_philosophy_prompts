  Hmm, the core insight here is fascinating - that exact indifference might make evidence-seeking more valuable rather than less. When options are perfectly balanced, even weak signals can tip the scales, whereas slight preferences make most evidence irrelevant. The challenge is building this into an ordinary-life case that meets all specifications.

  For the case itself... medical decisions often work well for this. Let's say choosing between two cancer treatments with identical survival rates but different side effect profiles. The indifference comes from balancing physical comfort against mental health considerations - genuinely different values that happen to cancel out. A single specialist consultation serves as the imperfect evidence source. 

  The deadline pressure comes naturally from medical urgency. Blocking randomization is trickier - perhaps the patient needs to explain the choice to family members who would see coin-flipping as irresponsible. That feels organic rather than forced.

  Now to test it against the requirements: 
