  For part (b), the student sets up the twin-wetland variant. They contrast the normative account (predicting symmetry) and the attitude theory (predicting both intentional). The within-subjects design point is strong. However, the student oversimplifies by claiming the normative account is "dead" if asymmetry disappears. Actually, other theories might explain it, like the belief-desire model. The student needs to acknowledge that the result might not settle all competing explanations, just these two.

  Part (c) addresses the methodological implication. The student supports replacing intuitions with experimental data, citing moral contamination. The mention of negativity bias is a good point but undermines the initial argument. They should recognize that philosophers might still use controlled intuitions rather than abandoning the method entirely. Also, conflating "ordinary people" with "philosophers' intuitions" is a mistake—philosophers' training might mitigate such biases.

  The user needs specific feedback for grading, so pinpointing where points are lost is crucial. For instance, in part (a), missing the explicit link to the ordinary concept costs a mark. In (b), failing to note other possible theories reduces the score. In (c), not addressing the distinction between folk intuitions and philosophical methods is a flaw. 

  Also, the user might have a deeper need: ensuring their grading is fair and consistent, possibly anticipating student appeals. Providing clear justifications for each point deduction helps them defend their evaluation. Highlighting strengths (like the within-subjects point in b) balances criticism. 

  Need to check if the student misunderstood any theories. In (b), the attitude theory explanation is correct, but overlooking belief-desire models is a gap. For (c), the student's admission of negativity bias weakening the philosophical impact shows awareness but doesn't fully engage with methodological nuances. 

  Overall, the answer is strong but has specific omissions and overstatements. Allocating marks per section based on missed elements: -1 in (a) for not explicitly tying to the ordinary concept, -1 in (b) for oversimplifying the implications, -0.5 in (c) for the conflation issue. The rest of the deductions are for smaller inaccuracies. The final score of 15.5/20 reflects a good but improvable response.
answer: |-
  Here's a detailed point-by-point assessment of the student's answer, justifying a mark of **15.5/20**.

  ---

  ### (a) Explanation of why the asymmetry pertains to the ordinary concept of intentional action (7 marks)
  **Student's Answer:**  
  *The two versions are matched on everything except the valence of the side effect. In both, the CEO foresees the side effect, doesn't care about the environment, and produces it as a byproduct of profit-seeking — he causes it in both versions, so the asymmetry isn't about causation. The only thing that differs is whether the outcome is bad or good, and that difference flips the verdict about intentionality. So a moral judgement is feeding into the ascription of intentionality: the moral judgement has to come first in the processing, and it then produces the "yes, intentionally" answer. Knobe's own conclusion is that the folk concept of intentional action is not a purely descriptive concept — whether something counts as done intentionally depends partly on normative facts about it. That's why the result matters to philosophy of action and not just to moral psychology.*  

  **Assessment (5.5/7):**  
  - **✅ Strengths (4.5 pts):**  
    - Clearly notes the *matched design* (only valence differs) (1.5 pts).  
    - Correctly identifies that *causation is symmetrical* (1 pt).  
    - Links asymmetry to *moral valence influencing intentionality ascriptions* (1 pt).  
    - Cites Knobe’s key conclusion: folk concept of intentional action is *normatively laden* (1 pt).  
  - **❌ Weaknesses (-1.5 pts):**  
    - **MISSES KEY POINT (-1 pt):** Fails to explicitly contrast *"ordinary concept"* vs. *"feelings about greedy executives"*. The answer implies it but doesn’t state why the asymmetry **reflects conceptual structure** rather than transient emotions (e.g., anger at greed). Needed: The effect persists across diverse agents/scenarios, suggesting a deep feature of how "intentional" is applied, not context-dependent dislike.  
    - **Overstates processing order (-0.5 pt):** Claims moral judgment "has to come first" — but this is contested (e.g., some models propose simultaneous processing). Better to say moral valence *modulates* the attribution.  

  ---

  ### (b) Predictions for the twin-wetland variant and whether it settles the debate (7 marks)  
  **Student's Answer:**  
  *In the twin-wetland case the overall outcome is morally neutral, so the normative-concept explanation predicts that the asymmetry should disappear: people should treat the two wetlands the same way. The rival explanation — that what's doing the work is the agent's attitude, i.e. that people read the CEO as willing to bring about a foreseen side effect he doesn't care about — predicts yes to both, since he is indifferent to each. So this is a clean test, and a better one than the original precisely because it is within subjects: the same participant answers both questions, so any difference can't be put down to variation between individuals. If the usual asymmetry still shows up, the normative account is vindicated and the debate is essentially over; if it doesn't, the normative account is dead and we should all be attitude theorists.*  

  **Assessment (5.5/7):**  
  - **✅ Strengths (4.5 pts):**  
    - Correctly predicts **normative account → symmetry** (neutral outcome removes bias) (1.5 pts).  
    - Correctly predicts **attitude theory → intentional for both** (indifference implies willingness) (1.5 pts).  
    - Highlights **within-subjects design advantage** (controls inter-participant variation) (1 pt).  
    - Explains how results would adjudicate *between these two theories* (0.5 pt).  
  - **❌ Weaknesses (-1.5 pts):**  
    - **OVERSIMPLIFIES COMPETING EXPLANATIONS (-1 pt):** The "attitude theory" is mislabeled. The main rival is the **"Belief-Desire" model** (e.g., the CEO lacks a *desire* for the side effect, but people conflate indifference/aversion). Crucially, this model *also predicts symmetry in the neutral case* (if "desire" is key). The student’s "attitude" theory is non-standard.  
    - **OVERSHOOTS ON SETTLING THE DEBATE (-0.5 pt):** Claims results would end the debate, but:  
      - If asymmetry *persists*, it supports Knobe, but other explanations exist (e.g., "skill" or counterfactual models).  
      - If symmetry *occurs*, it refutes Knobe’s strong normativity claim but doesn’t prove "attitude theory" — other descriptive accounts fit too.  

  ---

  ### (c) Assessment of the methodological argument (6 marks)  
  **Student's Answer:**  
  *I think the methodological moral is right. The effect shows that intuitive verdicts about cases shift with morally irrelvant features of how the case is set up, so a philosopher relying on her own reaction to a hypothetical she invented is not in a good epistemic position. Knobe's reading is that ordinary people's verdicts get contaminated by moral outrage at the CEO, and that is exactly the sort of error experiments exist to correct. Where we can, appeals to intuition should be replaced by experimental data about what people actually think, since data is at least not one person's hunch. Admittedly the effect probably reduces in the end to the familiar negativity bias — people are much quicker to blame than to praise — which is why it matters less for philosophy than is sometimes claimed.*  

  **Assessment (4.5/6):**  
  - **✅ Strengths (3.5 pts):**  
    - Identifies the core threat: intuitions biased by *morally irrelevant factors* (1 pt).  
    - Notes the risk of *idiosyncratic judgments* if philosophers rely on personal intuitions (1 pt).  
    - Endorses experiments as corrective for *systematic bias* (1 pt).  
    - Concedes a limitation (negativity bias reduces philosophical novelty) (0.5 pt).  
  - **❌ Weaknesses (-1.5 pts):**  
    - **CONFLATES TWO ISSUES (-1 pt):** Knobe’s "moral contamination" is **not** his view — he *endorses* the normativity of the folk concept. The student misattributes Knobe’s position. Worse: They use this to argue philosophers’ intuitions are flawed, but if folk judgments are *validly* normative, philosophers might be *mistakenly descriptive*.  
    - **UNDERDEVELOPED CRITIQUE (-0.5 pt):** Fails to note key counterarguments:  
      - Philosophers’ intuitions may be *trained* (less susceptible to bias).  
      - Experimental data doesn’t resolve *which* intuitions are "correct" (e.g., should we revise concepts or de-bias judgments?).  

  ---

  ### Final Mark: **15.5/20**  
  **Breakdown:**  
  - (a): 5.5/7  
  - (b): 5.5/7  
  - (c): 4.5/6  

  **Overall Feedback to Student:**  
  *This is a strong answer demonstrating good grasp of the Knobe effect and its implications. Key strengths: clear articulation of the matched-case design (a), insightful use of the within-subjects test (b), and awareness of methodological pitfalls (c). However, points were lost for: (a) not explicitly linking asymmetry to conceptual structure (vs. emotions); (b) misidentifying the main rival theory (Belief-Desire, not "attitude") and overclaiming how the wetland case settles debates; (c) misrepresenting Knobe’s view and under-exploring counterarguments to the "methodological moral". To improve: engage rivals more charitably and distinguish folk intuitions from normative authority.*
