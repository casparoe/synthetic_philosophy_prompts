  3. The "what to do with contradictions" question ties to assertion norms. Dialetheists might say assert true contradictions while remaining pragmatically cautious; classicists would reject asserting anything they deem impossible. 

  Ah, and the conditional liar cousin! That's important - I'll explain how "If this sentence is true, then 0=1" causes trouble even in paraconsistent systems by potentially leading to triviality through different means. 

  For the table, I'll distill five key cruxes: truth values of liar sentences, consequence relations, inferential costs, conditional liar, and assertion norms. Each needs parallel formulations both sides would endorse without caricature. 

  The challenge is maintaining strict neutrality while making technical concepts like paraconsistency accessible. I'll avoid symbols, using phrases like "reasoning from any premise to any conclusion" for explosion. 

