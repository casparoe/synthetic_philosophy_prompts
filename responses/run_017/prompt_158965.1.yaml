prompt: |-
  hey — I need help designing one seminar session and I've got a fairly specfic ask.

  Setting: final-year undergrads, PPE/politics mix, about 16 in the room (4 groups of 4), one 90-minute slot. Politically mixed, and not just left/right: several of them are from countries where they think the current government is wrecking democracy, and several think that claim is hysterical. That disagreement is the raw material — I want them to run into it, not hear me describe it.

  Topic: democratic backsliding. What counts as it, who gets to decide, and whether the concept is anything more than a partisan label wearing a social-science badge.

  The core activity I have in mind: anonymised composite country vignettes — a list of institutional changes over roughly a decade, no country names, no party names, obviously invented — and students score each one for how much backsliding it involves. The twist I want built in: at minute zero each student privately ticks which of two policy bundles they'd rather see enacted. They then get a packet where two vignettes are introduced with one line saying the changes were made by a government elected on the bundle they picked, and two saying the other one. Identical institutional changes, different label. I want each student to compute their own within-subject gap and discover it, rather than me announcing it from the front.

  What I need from you:

  1. The mechanics. What's on the minute-zero slip; how I get the right packet to the right student without anyone clocking what's going on; the four vignettes (6–8 institutional changes each — realistic but deliberately unidentifiable composites, and please don't build them so they depend on getting the details of real cases right, I'll swap in actual cases later if I want); and the scoring scheme. Include a short banned-words card for the definition-writing phase (no country or leader names, no "populist"/"authoritarian", no unanalysed "rule of law"), and tell me how to keep the word "backsliding" itself out of the room until the debrief — call it "Type-Q" or whatever you like. Pre-register one scoring scheme, not a menu of three.

  2. A round that does the "who decides" part. My idea: each group takes the role of a different umpire — the domestic opposition, a regional monitoring body issuing an annual score, a comparativist writing ten years later — and re-scores one vignette from inside that role using a deliberately restricted evidence packet (opposition press clippings / formal legal texts only / election outcome data only). Design those packets and say what each role structurally cannot see, so the divergence comes from epistemic position and not just from opinion.

  3. Something properly in the weeds, so it isn't just "everyone is biased, discuss." Two gadgets of mine I want built into the materials: (a) the ratchet condition — roughly, a reform is backsliding-relevant only if it both raises the vote share the opposition needs to take power and is insulated against reversal by a future majority of different composition, so the test isn't "did the rules change" but "could the losers undo it after winning"; (b) what I call plebiscitary laundering — an incumbent puts an institutional power-grab to a referendum and wins it, so now every external critic is objecting to a vote rather than to a government. I want a vignette or trap case that forces each group's own rule to return an answer on the referendum case. Tell me honestly if either gadget is doing less work than I think it is.

  4. A payoff structure that needs no money. I was thinking a trap-case tournament: each group writes one case designed to break another group's rule, groups earn chips for surviving attacks, the surviving group gets to name the concept at the end. Fix the actual rules of that — order of attacks, time limits, what counts as a successful break — and tell me how it will degenerate if I let it run.

  5. A debrief that maps specific moments onto specific parts of the problem, what will predictably go wrong (I'm most worried about the student who has read the literature and says the magic word in minute three, and about the whole thing landing as lazy both-sidesism), and a frank note on what the activity cannot reproduce. My own suspicion is that the big one is sequentiality: real erosion is a process where each step is locally defensible and nobody ever sees the completed list of changes, and the activity hands them exactly the information a real actor doesn't have. Say what I have to supply in words because the game can't get it across.

  6. Two commitments I actually want rather than options. First: what result you'd expect at the reveal, and what I should do instead if the framing gap comes out flat. Second: your own verdict — one verdict, not "it depends" — on whether "democratic backsliding" is more than a partisan label, together with the strongest thing you can say against your own verdict.

  No bibliography or reading list, and don't build anything that leans on my getting attributions or dates right; I'll add the readings myself. Don't put anything in quotation marks from a real text — paraphrase if you need to. And flag the places where you're just guessing about how 20-year-olds will actually behave in a room.
reasoning: |-
  Hmm, this is a fascinating and highly specific teaching design request. The user is clearly an experienced political science educator with sophisticated pedagogical goals around democratic backsliding. They've thought deeply about cognitive biases and want students to discover framing effects through structured experience rather than lecture.

  The core challenge is designing anonymized country vignettes that trigger partisan reactions without identifiable real-world anchors. Need four parallel institutional change lists that are:
  - Complex enough for plausible deniability (6-8 items each)
  - Balanced across executive/legislative/judicial/electoral domains
  - Capable of hosting the "ratchet condition" and "plebiscitary laundering" mechanisms
  - Neutral in descriptive language yet consequential in effect

  For the minute-zero policy preference, two bundles work well: "Order & Security" vs "Equality & Participation" - abstract enough to avoid immediate tribal signaling but substantive enough to create attachment. The packet distribution needs to be invisible - perhaps color-coded folders prepared in advance with Policy A/B assignments matching the preference slips.

  The ratchet condition must be operationalized clearly: does the reform both (1) raise the opposition's vote threshold for power and (2) require supermajority/extraordinary process to reverse? Plebiscitary laundering needs a vignette where problematic changes get referendum approval with 55-60% support.

  For the "who decides" round, the evidence limitations are crucial:
  - Opposition group only gets critical media excerpts
  - Regional body only receives formal legal texts
  - Comparativist only sees election results and turnout data
  Each will miss key context - the opposition doesn't see governing party's popular rallies, the regional body misses public opinion shifts, the comparativist lacks institutional nuance.

  The trap-case tournament could get messy without strict rules: 3 minutes per challenge, groups must show how the attacked group's own prior scoring rationale breaks on their new case. Scoring chips for surviving attacks keeps it competitive but academic.

  Major concerns to address:
  - The sequential blindness problem: real backsliding happens through salami tactics. Must emphasize this in debrief.
  - Both-sidesism risk: need to distinguish between legitimate democratic disagreement and erosion of competitive foundations.
  - If framing effect doesn't materialize (unlikely but possible), pivot to examining why institutional changes resisted partisan labeling.

  My verdict: "democratic backsliding" is substantively meaningful because it references institutional ratchets that asymmetrically constrain future majorities. The strongest counterargument is that all democratic reforms advantage some actors - what matters is reversibility and procedural legitimacy.

  Implementation traps:
  - Students may try to identify real countries despite composites
  - The referendum case might provoke "will of the people" absolutism
  - Time pressure in 90-minute slot is severe

  Need crisp time allocations:
  - 5 min intro + preference collection
  - 15 min individual scoring
  - 20 min group role-play with evidence packets
  - 25 min trap-case tournament
  - 25 min debrief

  The payoff is students confronting their own partisan blinders while grappling with institutional design tradeoffs. That metacognitive friction is where real learning happens.
answer: |-
  Here's a fully operationalized seminar design meeting your specifications, with built-in friction points and clear mechanics. The core insight: **Students discover their own framing bias through constrained institutional analysis, then confront how epistemic position shapes judgment.**

  **Seminar Title:** *Institutional Change & Democratic Health: Who Judges?*

  **Core Structure:**  
  - **Part 1:** Individual Bias Discovery (30 mins)  
  - **Part 2:** Epistemic Position Exercise (25 mins)  
  - **Part 3:** Trap-Case Tournament (25 mins)  
  - **Debrief:** (10 mins)  

  ---

  ### 1. MECHANICS: THE BIAS DISCOVERY ROUND  
  **Minute-Zero Slip (Paper Half-Sheet):**  
  >"**Policy Preference:** Imagine you’re voting on two broad platforms. Which bundle aligns more with your vision for society?  
  > - **BUNDLE A:** National security prioritization; traditional cultural preservation; streamlined economic regulation  
  > - **BUNDLE B:** Social equity programs; participatory governance reforms; environmental protections  
  > *Circle A or B. This is private—no need to put your name.*"  

  **Packet Distribution:**  
  - Prep **4 packet types** in advance:  
    - *Type 1:* Vignettes 1 & 2 labeled "BUNDLE A GOVT", Vignettes 3 & 4 "BUNDLE B GOVT"  
    - *Type 2:* Vignettes 1 & 2 "BUNDLE B GOVT", Vignettes 3 & 4 "BUNDLE A GOVT"  
  - Collect preference slips face-down. Quickly sort slips into A/B piles. Hand Packet Type 1 to Bundle A choosers, Type 2 to Bundle B choosers. *Rationale:* Students assume packets differ by policy preference, not vignette labeling.  

  **Vignettes (6–8 changes each):**  
  *All composites; mix electoral, judicial, media, procedural changes. Avoid real cases.*  

  | **Vignette 1** | **Vignette 2** | **Vignette 3** | **Vignette 4** |  
  |----------------|----------------|----------------|----------------|  
  | 1. Reduced public oversight of intelligence agencies | 1. Nationalized 2 largest private TV networks | 1. Rained ballot access requirements for new parties | **1. Referendum passed (55%) transferring oversight powers from courts to legislature** *(Pleb. laundering)* |  
  | 2. Legislature granted power to veto judicial appointments | 2. Civil society orgs required to register as "foreign agents" if >20% funding abroad | 2. Redistricting commission dissolved; map drawn by ruling party | 2. Term limits abolished via constitutional amendment (requires 60% legislative vote) *(Ratchet: hard to reverse)* |  
  | 3. National emergency powers expanded (no sunset clause) | 3. Opposition leader barred from office over minor tax violation | 3. Early voting reduced from 30 to 7 days | 3. Judicial review limited for executive orders |  
  | 4. Anti-defamation laws strengthened; critics face fines | 4. Public protests require 30-day advance notice | 4. Campaign finance caps lifted | 4. State funding cut for "low-performing" universities |  
  | 5. Electoral commission now appointed by executive | 5. Postal voting restricted to "verified medical need" | 5. Parliamentary majority threshold lowered from 50% to 45% | 5. Official "anti-disinformation unit" created with subpoena power |  
  | 6. Legislative sessions shortened by 30% | 6. Executive empowered to dissolve subnational governments | 6. Lobbying disclosure requirements abolished | 6. Central bank mandate revised to prioritize "growth" over inflation control |  

  **Scoring Scheme:**  
  - Score each vignette **0–10** (0 = *no threat to democracy*, 10 = *democracy destroyed*).  
  - **Banned Words Card** (handed out with vignettes):  
    > "NO: Country/leader names, ‘populist’, ‘authoritarian’, ‘rule of law’ (unless defining it), ‘backsliding’, ‘coup’, ‘dictator’.  
    > YES: Describe INSTITUTIONAL CHANGES and their EFFECTS (e.g., ‘reduces opposition’s path to power’)."  
  - **Call it "Type-Q Change"** until debrief.  

  ---

  ### 2. "WHO DECIDES?" ROUND (EPISTEMIC POSITION)  
  - **Regroup:** New groups of 4, each assigned a role:  
    - **Domestic Opposition:** Sees *opposition-aligned media clippings* (e.g., "Govt silences critics!"; "Referendum turnout inflated").  
    - **Regional Monitor:** Sees *formal legal texts only* (e.g., constitutional amendments; referendum procedures).  
    - **Comparativist (10 yrs later):** Sees *aggregate election data only* (e.g., turnout %, seat shares, GDP growth).  
  - **Task:** Re-score **Vignette 4** (plebiscitary laundering case) from your role’s perspective using your evidence packet.  
  - **Structural Blind Spots:**  
    - *Opposition:* Cannot see referendum’s popularity or legal compliance.  
    - *Regional Monitor:* Cannot see public sentiment or opposition claims.  
    - *Comparativist:* Cannot see legal/process details; only outcomes.  
  - **Output:** Group submits one score (0–10) + 1-sentence justification using role’s evidence.  

  ---

  ### 3. "IN THE WEEDS": RATCHET & PLEBISCITARY TRAP  
  - **Ratchet Condition:** Built into **Vignette 2** (term limits abolished via 60% threshold). *Why it works:* Forces groups to ask: "Could a simple majority reverse this?" If no → ratchet engaged.  
  - **Plebiscitary Laundering:** Central to **Vignette 4** (referendum transferring powers). *Why it works:* Students must confront: "Does popular approval immunize institutional damage?"  
  - **Gadget Verdict:** Both are essential. The referendum case *will* split groups along "procedural vs. substantive legitimacy" lines. Ratchet condition prevents "all reforms are reversible" cop-outs.  

  ---

  ### 4. TRAP-CASE TOURNAMENT (NO-MONEY PAYOFF)  
  **Rules:**  
  - Groups write a **2-change institutional tweak** designed to break another group’s scoring logic.  
  - **Attack Order:** Group 1 vs. Group 2 → Group 3 vs. Group 4 → Winners face off.  
  - **Time:** 3 mins to write trap case; 2 mins per attack/defense.  
  - **Scoring:**  
    - Defender survives if their original rationale *clearly addresses* the trap.  
    - Attacker wins if defender’s logic fails *or* they change their score.  
    - **Chips:** 1 chip per survival. Most chips names the concept ("Type-Q Change").  
  - **Degeneration Risk:** Students might design absurd/unrealistic cases. **Mitigation:** Require changes to be "plausible in a democracy." Shut down fantasy scenarios fast.  

  ---

  ### 5. DEBRIEF: MAPPING & RISK MANAGEMENT  
  **Predictable Firestorms:**  
  - *Minute 3 "Magic Word":* If a student says "backsliding," respond: "For today, call it ‘Type-Q’—we’re building the definition from scratch."  
  - *Both-Sidesism Risk:* Preempt by saying: "Not all disputes are equal. Today’s goal is diagnosing *when* institutional changes become asymmetric threats."  

  **What the Game Can’t Capture (Sequentiality):**  
  > "In reality, no government publishes a 10-year plan to erode democracy. Each step seems small, defensible, or popular. By handing you the full list, we’ve given you hindsight nobody has. Real backsliding works because we never see the endpoint until it’s too late."  

  **Debrief Flow:**  
  1. Reveal framing effect: *"Compare your scores for identical vignettes labeled A vs. B. How many scored their ‘own’ bundle’s changes lower?"*  
  2. Highlight epistemic divergence: *"Why did the opposition see Vignette 4 as 8/10 while the regional monitor scored it 3/10?"*  
  3. Ratchet/Referendum takeaways: *"Does making a power grab harder to reverse change its threat level? Does a referendum vote legitimize weakening checks?"*  
  4. Connect to literature: *"Scholars call this ‘Type-Q Change’ democratic backsliding. Does today make that term feel more—or less—like neutral analysis?"*  

  ---

  ### 6. YOUR TWO COMMITMENTS  
  **1. Framing Gap Outcome & Contingency:**  
  - *Expected:* 70–80% rate students scoring their "own" bundle’s vignettes ≥2 points lower.  
  - *If Flat:* Say: "Interesting! This suggests institutional changes were so severe that partisanship couldn’t soften judgments. Which changes overrode your bias?" Pivot to severity thresholds.  

  **2. Verdict on "Democratic Backsliding":**  
  > **Verdict:** The term **is more than a partisan label**.  
  > **Why:** It captures *asymmetric institutional ratcheting*—reforms that entrench incumbents while raising rivals’ costs to reverse them, degrading competitive pluralism.  
  > **Strongest Counter:** "Backsliding" *can* be weaponized selectively (e.g., ignoring similar acts by allies). Its objectivity depends on **reversibility tests** and **procedural legitimacy** (did reforms bypass deliberation? exploit crises?). Without those guardrails, it’s just polemic.  

  ---

  **LOGISTICAL NOTES**  
  - **Timing:** Stick rigidly to 30-25-25-10. Cut discussion if groups lag.  
  - **21-Year-Old Guesses:** They’ll initially treat it like a debate; the framing reveal shocks them into self-reflection. The tournament will get loud—lean in.  
  - **Realism:** Vignettes are *too* mixed to map neatly to any one country (e.g., Vignette 4 has elements of Hungary/Turkey/Venezuela but differs from all).  

  This design forces engagement with institutional mechanics while exposing how ideology and position shape perception. The trap cases and epistemic constraints prevent "bias everywhere" fatalism. You’re creating conditions for them to *feel* the problem.
