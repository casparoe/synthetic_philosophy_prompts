answer: |-
  **OFFICE FOR EPISTEMIC ASSURANCE**  
  **Form EAS/1: Cognition Validity Certification**  
  *(All cognitions submitted for research outputs must be accompanied by a completed EAS/1. Failure to certify voids funding claims.)*  

  ---

  **SECTION 1: DECLARATION OF PRIMARY KNOWLEDGE-SOURCE (Pramāṇa)**  
  *Tick one (1) source only. Cognitions sourced from non-standard mechanisms (e.g., "presumption", "non-apprehension") are invalid per OEA Regulation 7(b).*  

  ☐ **Pratyakṣa (Perception)**  
      Object: _________________________  
      Sense-faculty employed: _________________________  
      ☐ Confirm no known defect (dvitīndriya-saṃyoga, etc.) in sensing apparatus: ______  

  ☐ **Anumāna (Inference)**  
      *Complete Annex A (attached)*  

  ☐ **Upamāna (Comparison)**  
      *Complete Section 4*  

  ☐ **Śabda (Verbal Testimony)**  
      Source: ☐ Āpta (reliable speaker) ☐ Śāstra (authoritative text)  
      Specify source: _________________________  
      ☐ Confirm absence of speaker/textual defect (aśraddheya, etc.): ______  

  *Claims citing "Arthāpatti" (presumption) or "Anupalabdhi" (non-apprehension):*  
  ☐ **REJECTED** (Reason: Reducible to Anumāna/Pratyakṣa per Nyāya-Sūtra 2.2.1-3).  

  ---

  **SECTION 2: INFERENCE VALIDATION (Annex A)**  
  *Required for all cognitions declared under Anumāna. All fields mandatory.*  

  1.  **Pratijñā (Proposition):**  
      [_________________________________________________________________________________________]  
  2.  **Hetu (Reason):**  
      [_________________________________________________________________________________________]  
  3.  **Udāharaṇa (Universal Correlation + Example):**  
      Vyāpti (Invariant Concomitance): _________________________________________  
      Sapakṣa (Positive Example): ____________________________________________  
      Vipakṣa (Negative Example): ____________________________________________  
  4.  **Upanaya (Application):**  
      [_________________________________________________________________________________________]  
  5.  **Nigamana (Conclusion):**  
      [_________________________________________________________________________________________]  

  *Certification of Vyāpti: ☐ Observed ☐ Authoritative testimony (Complete Sec. 1 Śabda if latter)*  

  ---

  **SECTION 3: HETVĀBHĀSA SELF-ASSESSMENT**  
  *Tick all fallacy types potentially applicable to your Hetu (Sec. 2.2/Annex A.2). OEA audit will confirm.*  

  ☐ **Savyabhicāra/Anaikāntika** (The reason occurs in the *vipakṣa* / lacks invariable concomitance).  
  ☐ **Viruddha** (The reason actually proves the opposite of the proposition).  
  ☐ **Asiddha/Sādhyasama** (The reason is as unproven as the proposition itself).  
  ☐ **Satpratipakṣa/Prakaraṇasama** (A counter-inference of equal strength exists).  
  ☐ **Bādhita/Kālātīta** (The conclusion is contradicted by a stronger knowledge source).  

  ---

  **SECTION 4: UPAMĀNA (COMPARISON) SPECIFICATION**  
  *Required if Section 1 ☐ Upamāna is ticked.*  

  1.  The comparison sentence (e.g., "a gavaya is like a cow"):  
      [_________________________________________________________________________________________]  
  2.  The remembered object (e.g., "cow"):  
      [_________________________________________________________________________________________]  
  3.  Confirm successful later identification (e.g., seeing the gavaya): ☐ Yes  

  ---

  **SECTION 5: TARKA (HYPOTHETICAL REASONING) ADVISORY**  
  *Note 5.1:* Tarka may be employed to eliminate doubt (*saṃśaya*) obstructing the operation of a valid *pramāṇa*.  
  *Note 5.2:* Tarka **cannot independently establish** any cognition (*prāmāṇyānumāne tarkasyākincitkaratvāt*).  
  *Regulation 9(c):* Grant proposals relying *solely* on Tarka for substantive claims will be returned unprocessed.  

  ---

  **SECTION 6: EPISTEMIC ASSURANCE PROTOCOL**  
  *Cognitions are assured ONLY if validated per Sections 1-5.*  

  6.1 **First-Order Assurance:** The cognition (*vyavasāya*) specified above is deemed assured only if a valid second-order reflective cognition (*anuvyavasāya*) certifies its generation by a *pramāṇa* declared in Section 1.  
      *Provide details of certifying anuvyavasāya:* [_________________________________________________________________________________________]  

  6.2 **Higher-Order Assurance:** The validity of the *anuvyavasāya* cited in 6.1 requires validation by a third-order *anuvyavasāya*.  
      *Provide details of tertiary certifying cognition:* [_________________________________________________________________________________________]  
      *(Attach supplemental EAS/1 forms for all higher-order certifying cognitions.)*  

  6.3 **Regress Termination:** The Office for Epistemic Assurance holds that cognitions of **Level 4 and above** are intrinsically valid (*svataḥ prāmāṇya*) for administrative purposes.  
      *Therefore, cognitions cited in 6.2 require no further EAS/1 certification.*  

  6.4 **Self-Application Exemption:** Any cognition whose sole object (*viṣaya*) is the validity of the OEA Assurance Scheme (EAS/1) or the functioning of the OEA itself is **exempt from Sections 1-6.3** and is deemed intrinsically valid (*svataḥ prāmāṇya*).  

  ---

  **DECLARATION:** I confirm this cognition was generated by the ticked *pramāṇa* and is not vitiated by the *hetvābhāsas* ticked in Section 3. I understand that assurance is contingent on higher-order validation per Section 6.  
  Signature: _________________________ Date: ______  
  (OEA Auditor Use Only: ☐ Certified ☐ Rejected [Specify Clause: ______] )  

  ---
  **Office for Epistemic Assurance, University of Mithilā**  
  *Ensuring Reliable Cognition Since Nyāya-Sūtra 1.1.1*  
  *(Form Version EAS/1.3 Rev. 02)*
