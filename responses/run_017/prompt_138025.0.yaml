prompt: |-
  hey all — I'm in a game theory & society seminar this term and I keep running into a pattern that I dont have a word for, and it's driving me a little nuts.

  The setup is the familiar one: a bunch of parties are stuck spending more and more on something that only matters relative to what everyone else spends, nobody can quit unilaterally without loosing ground, so the total just climbs. I know that part has a name and I'm not asking about it. What I keep noticing is what happens when someone actually tries to cap it. Two things, and I'm not sure they're even one thing:

  (1) The spending doesn't go away, it relocates. Cap or ban the obvious margin and people compete on whatever you forgot to cap, or on whatever is hardest to measure — and the new spending is often worse than the old, in the sense that it doesn't even buy anyone an advantage anymore, it's just cost.
  (2) It doesn't reset. Lift the cap, or remove whatever started the race, and the level stays where it climbed to. The new margin of competition sticks around even when nothing is making anyone compete on it anymore.

  Admissions is my clearest case: kill one screening device and the competition reappears somewhere else, more expensive and less informative, and it doesn't unwind afterward. But I think I've seen the same shape in hiring requirements and in how labs chase benchmarks, and "credential inflation" only names the admissions version.

  So: is there a name for the relocation-plus-not-resetting thing, or am I mashing two separate phenomena together? And if there's no established name, coin one with an actual definition and give me boundary cases — I need to be able to tell it apart from a plain arms race, from a measure getting gamed until it stops tracking anything, and from ordinary stickiness in prices or wages. Rank how close each of those near-misses is, and tell me which features of my description each one fails to capture. Please no reading lists or paper recs, I want the carving and not the sources. American English, under 300 words.
reasoning: |-
  Okay, the user is in a game theory seminar and has noticed a recurring pattern when trying to cap competitive spending. They describe two key aspects: spending relocates to a new margin that's often worse, and it doesn't reset even after the cap is lifted. They want to know if there's a name for this combined phenomenon or if it's two separate things. If there's no name, they want a coined term with a clear definition and differentiation from similar concepts.

  First, I need to recall relevant game theory concepts. The initial setup sounds like an arms race or Red Queen effect, but the user says that's not what they're asking about. They're focused on the aftermath of capping. The relocation part reminds me of the Cobra effect or Goodhart's law, where measures are gamed. But they mention that the new spending doesn't even provide an advantage, just cost. Also, the persistence after lifting the cap is crucial. 

  The non-resetting part makes me think of hysteresis or ratchet effects in economics. Hysteresis is when systems don't revert to original states after changes. Ratchet effects involve irreversible increases. Combining both relocation and persistence, I consider if there's a term that covers both. Maybe "institutional hysteresis" or "competitive hysteresis"? 

  Looking at their admissions example: banning standardized tests leads to more focus on extracurriculars, which are more expensive and less informative. If tests are reinstated, the emphasis on extracurriculars remains. This shows both relocation and stickiness. 

  Comparing to similar concepts: 
  - **Arms race**: Only covers escalating competition, not relocation or persistence.
  - **Goodhart's law**: Explains measure gaming leading to uselessness but doesn't address persistence after the measure is removed.
  - **Hysteresis**: Explains persistence but not the relocation aspect.
  - **Ratchet effect**: Focuses on one-way increases, not necessarily relocation.

  So none fully capture both aspects. Therefore, coining a term like "Competitive Hysteresis" makes sense. Defining it as the irreversible relocation of competitive effort to inferior margins after intervention. Boundary case: if capping causes spending to relocate but drops when cap is lifted, it's not this. Or if the new competition is equally efficient. 

  The user needs clear differentiation. They might be looking for a framework to analyze policies where interventions backfire by shifting competition to less productive areas and causing permanent changes. Ensuring the definition highlights the inefficiency and irreversibility.
answer: |-
  Here's the concise conceptual carving you need:

  **Phenomenon:** A **Competitive Hysteresis Loop** (coined term).

  **Definition:** The irreversible relocation of competitive effort to an inferior margin following an intervention to cap or suppress the original competitive channel, characterized by:
  1.  **Relocation:** Effort shifts to a new, often less efficient or harder-to-measure margin when the primary channel is capped.
  2.  **Persistence:** The new competitive equilibrium persists even if the original cap/constraint is removed; effort does not return to the original (now uncapped) margin.
  3.  **Inefficiency:** The relocated spending/effort often yields diminishing or zero *net* competitive advantage (pure cost sink) and is frequently less informative or more wasteful than the original.

  **Boundary Cases/Differentiation:**
  1.  **Pure Arms Race (e.g., military spending):** Captures escalation but **fails** both relocation (effort stays on the same margin) and persistence (if threat vanishes, spending *can* decrease).
  2.  **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):** Captures the relocation and degradation of the measure's value **but fails** persistence. If the measure is abandoned, effort *should* shift elsewhere or cease. It doesn't explain the *stickiness* of the new, bad equilibrium.
  3.  **Price/Wage Stickiness:** Captures persistence/resistance to downward adjustment **but fails** relocation and the specific context of *competitive* spending for *relative* gain. It's about downward rigidity on a single margin, not the shift to a new, worse margin.
  4.  **Ratchet Effect (One-way increase):** Captures the persistence aspect (level doesn't drop back down) **but fails** relocation. It explains why levels *stay high*, not why effort *moved sideways* to a worse channel.

  **Ranked Closeness:**
  1.  **Ratchet Effect:** Closest on persistence, misses relocation/inefficiency.
  2.  **Goodhart's Law:** Closest on relocation/inefficiency, misses persistence.
  3.  **Arms Race:** Closest on the initial dynamic, misses both relocation & persistence entirely post-cap.
  4.  **Price Stickiness:** Least close; tangential mechanism (resistance to change), wrong context.

  **Key Distinguishers:** The *combination* of **relocation to a worse margin** and the **irreversibility** of that new competitive state, even when the original constraint is lifted, creating a **permanently degraded, costly equilibrium.**
