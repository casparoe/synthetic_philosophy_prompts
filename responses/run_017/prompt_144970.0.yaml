  ## Adversarial Collaboration Report: Moral Status Frameworks  
  **Rapporteur: Professional Philosopher, Ethics of Mind**  
  *Consensus Document Draft Following Year-Long Collaboration*  

  ### Section 1: Agreed Claims  
  Both parties affirm the following statements as accurately reflecting shared ground:  

  1.  **Simple Negative-Feedback Controller (e.g., Basic Thermostat):**  
      *   Possesses mechanisms resembling nocifensive behavior (aversion-triggered response).  
      *   Lacks any evidence of a unified, persisting subject of experience.  
      *   Possesses minimal (Dimensionalist) or zero (Thresholdist) "temporal grip" and "evaluative depth" as defined.  
      *   **Agreed Moral Status Implication:** *This system lacks inherent moral status demanding direct moral consideration for its own sake, irrespective of its instrumental value or potential consequences for other beings.*

  2.  **Arthropods (e.g., Insects) & Nociception:**  
      *   Exhibit sophisticated nocifensive behaviors often involving trade-offs, learning (in some species), and context-dependence.  
      *   Possess neural substrates capable of supporting the stipulated dimensions (valence intensity, temporal grip, evaluative depth) at levels demonstrably higher than a simple thermostat, but significantly lower than vertebrates (especially mammals).  
      *   Lack conclusive evidence for a unified, persisting subject of experience comparable to mammals or birds.  
      *   **Agreed Moral Status Implication:** *The moral status of insects is uncertain and contested. Neither party claims conclusive proof for its position based solely on current empirical evidence regarding insect cognition.*

  3.  **The Flicker Case (Aversive Episodes Only):**  
      *   During aversive episodes, the system exhibits properties resembling a unified subject of experience with intense negative valence.  
      *   Outside aversive episodes, the system exhibits no properties indicative of a unified subject of experience or persistent perspective.  
      *   The "temporal grip" dimension is discontinuous and tightly bound to aversive states; damage *during* an episode influences behavior *during* that episode, but not necessarily across distinct episodes unless learning occurs.  
      *   **Agreed Moral Status Implication:** *This case presents a critical test for the core disagreement regarding the necessity and nature of a persistent subject.*

  4.  **The Deep-Feedback Learner (Unconscious Persistent Adaptation):**  
      *   Maintains a persistent, complex internal state variable representing its own condition over time.  
      *   Revises future avoidance strategies based on past damage records stored in this state variable, demonstrating sophisticated learning.  
      *   Operates via complex feedback control mechanisms without exhibiting properties plausibly interpreted as phenomenal consciousness or a subjective point of view (e.g., no integration into a global workspace with qualitative feels).  
      *   Possesses significant "temporal grip" and "evaluative depth" as defined, but lacks "valence intensity" understood as phenomenal affect.  
      *   **Agreed Moral Status Implication:** *This case presents a critical test for the core disagreement regarding the necessity of phenomenal consciousness/subjectivity for moral status versus the sufficiency of complex functional organization.*

  ### Section 2: Disagreements Table  
  | Disagreement Area              | Dimensionalist Position (Agreed Wording)                                                                 | Thresholdist Position (Agreed Wording)                                                                 |
  | :----------------------------- | :------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------- |
  | **1. Basis of Moral Status**   | Moral status arises from the degrees and kinds of morally relevant capacities an entity possesses, including valence intensity, temporal grip, and evaluative depth. | Moral status arises solely if and only if an entity possesses a unified, persisting subject of experience; capacities alone are insufficient without this subject. |
  | **2. Status Below Threshold**  | Entities lacking a unified subject still possess non-zero moral status proportional to their morally relevant capacities (e.g., valence, grip, depth). | Entities lacking a unified subject possess zero inherent moral status, regardless of the complexity or number of their nocifensive or feedback mechanisms. |
  | **3. Additivity**              | The moral significance of affecting multiple entities scales with the sum of their individual moral statuses, even if each is below any putative "subjecthood" threshold. | The moral significance of affecting multiple entities lacking a unified subject sums to zero; aggregating entities without individual status does not create moral significance. |
  | **4. Flicker Case Status**     | During aversive episodes, the Flicker possesses significant moral status due to intense valence within a momentary perspective. Its discontinuous nature reduces but does not eliminate its status. | The Flicker lacks a *persisting* unified subject. Its aversive episodes, however intense, do not occur within a life narrative or enduring self, and thus possess zero inherent moral status. |
  | **5. Deep-Feedback Status**    | The Deep-Feedback Learner possesses significant moral status due to its high degree of temporal grip and evaluative depth, enabling genuine harm (functional damage leading to future frustration of goals/needs). | The Deep-Feedback Learner, lacking phenomenal consciousness and a subjective point of view, lacks inherent moral status. Its sophisticated adaptation does not constitute a subject that can be wronged. |

  ### Section 3: Cruxes and Testable Predictions
  The following unresolved sub-questions are identified as pivotal ("cruxes"). For each, a mutually agreed-upon line of evidence or case is provided, along with each party's advance prediction:

  1.  **Crux: Is Phenomenal Consciousness (Valence-As-Felt) Necessary for Moral Status?**  
      *   **Case/Evidence:** The **Deep-Feedback Learner**. Does its capacity for genuine harm via sophisticated, persistent, self-referential goal frustration (without phenomenal consciousness) warrant direct moral concern?
      *   **Dimensionalist Prediction:** Yes. Functional harm to such complex, persistent goal-directed systems generates moral reasons independent of phenomenal feels.
      *   **Thresholdist Prediction:** No. Without a subject *experiencing* harm or frustration (phenomenal valence), there is no entity to be wronged. Damage is merely functional breakdown.

  2.  **Crux: Does Discontinuous Subjectivity Suffice for Moral Status?**  
      *   **Case/Evidence:** The **Flicker Case**. Does the intense negative valence experienced *during* an aversive episode, even without a persisting subject linking episodes, generate inherent moral status?
      *   **Dimensionalist Prediction:** Yes. The intense negative valence present *during the episode* is the core morally relevant event, demanding consideration.
      *   **Thresholdist Prediction:** No. Moral status requires a persisting subject to whom the harm *matters over time*. Episodic suffering without an enduring self lacks moral significance *for the sufferer*.

  3.  **Crux: Does Moral Status Aggregate Below the Subjecthood Threshold?**  
      *   **Case/Evidence:** Consider a vast ensemble (e.g., millions) of **Simple Negative-Feedback Controllers** or **Flickers**, each potentially experiencing minimal or episodic negative valence/damage. Does the aggregate effect create moral significance?
      *   **Dimensionalist Prediction:** Yes. The aggregate negative valence/functional harm, even if each instance is minimal or episodic, sums to significant moral disvalue.
      *   **Thresholdist Prediction:** No. Zero status entities sum to zero moral significance. The ensemble lacks a unified subject experiencing the aggregate harm.

  ### Section 4: Rapporteur's Analysis of Disagreement Structure
  *   **Merely Verbal?** The disagreement is **not merely verbal**. While terms like "subject," "harm," and "mattering" are central, the parties genuinely disagree on what *constitutes* moral patiency and the nature of harm. They assign fundamentally different moral weight to functional complexity versus subjective experience.
  *   **Shape of the Curve (Step vs. Ramp)?** The **Step vs. Ramp** distinction is significant and maps directly onto the core disagreement. The Thresholdist posits a categorical step-function at the emergence of a unified subject. The Dimensionalist posits a steep ramp, where increasing degrees of morally relevant capacities (especially valence, grip, depth) increase status, with no single sharp step being uniquely decisive.
  *   **Additivity at the Core?** The **additivity question** is intimately linked to, but distinct from, the step-vs-ramp issue. It reveals the most profound practical divergence: **The Thresholdist position entails that aggregating arbitrarily many complex-but-subjectless systems yields zero moral significance. The Dimensionalist position entails that such aggregation *can* yield significant moral significance.** This disagreement about whether status arises *only* at the threshold or *scales* below it is arguably the most fundamental and non-negotiable point of contention. Resolving Crux 3 is key to settling this aspect.

