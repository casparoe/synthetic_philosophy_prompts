  Hmm... the key challenge is finding common ground while preserving genuine disagreements. Both must address two test cases: the "flicker" entity that only has subjective experience during pain, and the "deep-feedback" system that learns from damage without conscious awareness.

  Let me brainstorm agreements first. Both sides likely concur that simple thermostats lack moral status - Dimensionalists would see their dimensions as too minimal, Thresholdists would deny any unified subject. For insects, there might be agreement about uncertainty but not status. The stipulated cases are trickier... 

  For disagreements, I need wording both sides would accept as fair. Thresholdists would insist on the "all-or-nothing" nature of subjecthood, while Dimensionalists would emphasize gradual differences in capacity. The flicker case is perfect for testing temporal grip - does discontinuous subjectivity still count? The deep-learner probes whether sophisticated adaptation without consciousness matters.

  Ah, the cruxes become clearer now. First: is moral status additive? Thresholdists say no - a million thermostats still sum to zero. Second: does discontinuous subjectivity meet the threshold? Third: can unconscious learning constitute "perspective"? Each crux has a test case where both sides would make different predictions.

  I suspect the deepest divide is about additivity - whether moral status emerges only at the threshold or aggregates gradually. That's not just verbal; it affects real-world decisions about AI or animal welfare. The step-vs-ramp debate might mask this more fundamental clash.

  The document should present agreements neutrally, then juxtapose clean formulations of both views before laying out testable cruxes. For the flicker case, Thresholdists might say "no persistent subject = no status", while Dimensionalists see valence during episodes as mattering. The deep-learner forces confrontation about whether "perspective" requires consciousness.

  ...And I should note where disputes might be verbal - perhaps about defining "subject of experience" - versus substantive disagreements about moral mathematics. The key is making the experimental predictions explicit so future work could resolve them.
