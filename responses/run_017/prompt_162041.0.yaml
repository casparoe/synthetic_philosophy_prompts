  hey — I run a tiny reading group on anthropic reasoning and two of the members have been sniping at each other over SSA vs SIA for about three months now. I want to make them produce one document they'd both sign instead of another email thread, so: draft the joint statement of their adversarial collaboration. Numbered agreed-claims section first, then a disagreements table. No footnotes or citations, I dont want anybody citing anything, and keep the whole thing under 700 words including the table.

  Ground rules for the content:

  - Start from a case I made up so they can't just rehearse the famous ones. Call it the Cancelled Cohort: a fair coin is flipped. Heads → 100 subjects are created and enrolled in the study. Tails → 1 subject is created and enrolled; the other 99 are never created at all, they aren't off living other lives somewhere. You find yourself enrolled, you know all of this, and you're offered an even-odds bet on the coin. As far as I can tell SSA takes you to 1/101 for heads and SIA takes you back to 1/2 — check the arithmetic and get both of them to sign off on the actual numbers before anything else goes in the document.
  - Then a variant with a supervisor who exists either way and is never enrolled. Does either view's number move? I think this is where the reference-class complaint bites SSA harder than the SIA side usually admits, but I honestly cant tell.
  - Agreed claims should also cover the case where the competing hypotheses entail infinitely many observers: both views need some kind of regularization and neither has an obvious one.
  - Presumptuous Philosopher: the same structure scaled up to cosmology. The SIA side has to say plainly whether they bite the bullet on settling cosmology from the armchair, and the SSA side has to say what exactly the objection is — that the credences are absurd, that the resulting bets are, or something else.
  - Doomsday argument: I want both of them to state whether Cancelled Cohort really is the Doomsday argument in miniature, or whether that analogy smuggles something in.

  Cruxes for the table, each with one case or argument both would accept as bearing on it, and each side's prediction written down in advance:

  1. Is the reference-class problem an objection to SSA only, or does SIA inherit a version of it? You still have to delimit which *possible* observers are candidates for being you.
  2. What does the "I" in the prior range over — actual observers or possible ones? Say honestly whether this part of the fight is verbal, and if so which part and why.
  3. Does any of it survive into action: is there a bet one view takes and the other declines, or do the decision rules wash the difference out once you conditionalize on everything?
  4. Sleeping Beauty is constantly described as this same dispute in miniature, halfer ≈ SSA and thirder ≈ SIA. Make both of them locate exactly where that mapping fails, if it does.

  Last thing: I sketched a third position and I want the document to place it. Call it RC-SIA: treat yourself as a random sample from the possible observers within your reference class, where the reference class is fixed subjectively, as all observer-moments introspectively indistinguishable from yours at the moment of judgment. Does that collapse into SSA, collapse into SIA, or is it genuinely a third option? What does it say in Cancelled Cohort, what does it say about the supervisor variant, and what does it say in Sleeping Beauty? If both of them think it's just one of their own views wearing a hat, say which one and why.
