answer: |-
  ### Joint Statement: Adversarial Collaboration on Anthropic Reasoning  
  **Regarding the Cancelled Cohort and Variants**  

  #### Agreed Claims  
  1. **Cancelled Cohort Arithmetic**:  
     - SSA: Probability of heads = \( \frac{1}{101} \) (treating "you" as a random sample from *actual* enrolled observers: 100 in heads, 1 in tails).  
     - SIA: Probability of heads = \( \frac{1}{2} \) (no update from existence; both hypotheses guarantee *your* existence).  
     - Both affirm these calculations.  

  2. **Supervisor Variant**:  
     - A supervisor exists in both coin outcomes but is never enrolled.  
     - SSA: Probability of heads remains \( \frac{1}{101} \) (reference class = *enrolled* observers; supervisor is excluded).  
     - SIA: Probability of heads remains \( \frac{1}{2} \) (your existence remains equally likely under both hypotheses).  

  3. **Infinite Observers**:  
     - Both views require regularization for infinite observers (e.g., density-based measures or finite bounds). Neither has a privileged method.  

  4. **Presumptuous Philosopher (Cosmology)**:  
     - SIA: Bites the bullet—armchair anthropics *can* settle cosmological hypotheses (e.g., favoring large universes).  
     - SSA: Objects that this bypasses empirical evidence, leading to absurd credences and reckless bets.  

  5. **Doomsday Argument Analogy**:  
     - Cancelled Cohort is structurally analogous to Doomsday (indexical uncertainty about "where" you are in a population).  
     - Both agree Doomsday adds temporal/future complexities, but the core logic is preserved.  

  #### Disagreements Table  
  | Crux | Case/Argument | SSA Prediction | SIA Prediction |  
  |------|---------------|----------------|----------------|  
  | **1. Reference-class problem** | Varied observer-types (e.g., humans vs. AI). Must delimit which *possible* observers are candidates for being "you". | Inherently severe for SSA. Choice of reference class (e.g., "enrolled humans") is arbitrary and drastically shifts probabilities. | SIA *inherits* a milder version: possible observers must be defined (e.g., "agents with my cognitive features"), but weights hypotheses by observer count, blunting arbitrariness. |  
  | **2. The "I" in the prior** | Does "I" sample from *actual* or *possible* observers? | Samples from *actual* observers. This is substantive: it avoids overcounting non-actualized possibilities (e.g., uncreated subjects). | Samples from *possible* observers. This is substantive: it weights hypotheses by their "capacity" to produce observers like you. Verbal only if "possible" equivocates. |  
  | **3. Survives into action?** | Cancelled Cohort: Accept an even-odds bet on heads? | Rejects the bet (P(heads) ≈ 0.01; expected loss if stakes are equal). | Accepts the bet (P(heads) = 0.5; fair odds). |  
  | **4. Sleeping Beauty mapping** | Beauty awakens with amnesia. Halfers (P(heads)=1/2) ≈ SSA? Thirders (P(heads)=1/3) ≈ SIA? | Mapping fails. SSA *would* assign P(heads)=1/3 here (reference class = awakenings, not persons). Beauty’s awakenings are temporally linked, unlike Cancelled’s independent observers. | Mapping fails. SIA *would* assign P(heads)=1/2 here—awakenings aren’t independent observers. Doppelgängers in time ≠ distinct possible observers. |  

  #### Third Position: RC-SIA  
  - **Definition**: Treat "you" as a random sample from *possible* observers within a subjectively fixed reference class (all observer-moments introspectively indistinguishable from yours).  
  - **Collapse?**: Neither.  
    - SSA: Rejects RC-SIA—it samples from *possible* (not actual) observers.  
    - SIA: Rejects RC-SIA—it uses subjective reference classes, not raw observer counts.  
  - **Cancelled Cohort**:  
    - P(heads) = \( \frac{100}{101} \) (100 indistinguishable observer-moments in heads; 1 in tails).  
  - **Supervisor Variant**: Unchanged (supervisor’s experience differs; excluded from reference class).  
  - **Sleeping Beauty**: P(heads) = \( \frac{1}{3} \) (1 awakening-moment in heads, 2 in tails).  

