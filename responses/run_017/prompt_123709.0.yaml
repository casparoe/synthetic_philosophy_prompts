prompt: |-
  Hi — I'm a third-year PhD student, working on reasons and moral psychology, and I've got to put in a chapter plan for my department's work-in-progress session in a couple of weeks. It's meant to be a one-term chapter, 8–10k words, and what I need from you is the plan document itself, not the chapter.

  The half-formed idea I keep going round on: the internalism/externalism debate about reasons is almost entirely run on cases of action. The internalist story — a reason for you has to be able to get some grip on you, there has to be a route of some kind from what you already care about to the thing you supposedly have reason to do — works off the assumption that the output of the relevant bit of practical thought is something you *do*, so it makes sense to ask whether deliberation could have got you there. But a huge amount of what we criticise each other for isn't action at all: you have reason not to be quite so afraid, you had reason to be angrier than you were, you have no reason to still be grieving about that. Emotions aren't produced by deliberation in the way actions are, so the 'route' has no obvious home. My suspicion is that the emotional cases split the internalist's options in a way the action cases don't: either she says something fairly wild (you only have reason to grieve if you could somehow reason your way into grief), or she quietly becomes an externalist and reads reasons-for-emotion as fittingness straight off, and either way both sides get forced to say what the grip requirement was ever *for*. I also want to know whether the thing that saves internalism in the action cases — idealising the route until it's nearly empty — is what kills it here, because an idealised route into an emotion doesn't look like anything at all.

  Can you turn that into a proper proposal? Specifically: the question stated tightly enough that it has a determinate answer; why the existing positions, as they're standardly set up, leave it open rather than settle it by implication; the approach, i.e. what I'd actually do week by week over a term and why that approach rather than the obvious alternativse (I assume someone will say just run it on reasons for belief instead, or just do fittingness and be done with it — tell me why not, or tell me if they're right); what the possible conclusions are and what sort of consideration would decide between them; and an honest bit on what would make this too big for 8–10k, and what would count as the chapter failing even if it goes fine.

  One objection I want handled head-on rather than footnoted: a supervisor-type will say that reason-claims about emotions are really just claims about aptness or fittingness, so my test case smuggles in externalism from the start and proves nothing. Say how the plan deals with that.

  Don't give me a bibliography or any citations — I'll fill references in myself, and I don't want invented ones. Usual prose is fine, no headings needed if it reads better without. Please write it in British English (ise endings, that sort of thing). Ta.
reasoning: |-
  Okay, let me unpack this PhD student's request. They're working on moral psychology and reasons, specifically the internalism/externalism debate. Their core idea is that while this debate typically focuses on reasons for action, reasons for emotions present a unique challenge that might force a rethink of the internalist position. 

  The student wants me to transform their "half-formed idea" into a proper chapter proposal. Key requirements include: formulating a tight research question, explaining why existing positions don't resolve it, outlining a methodological approach, anticipating objections (especially the "fittingness" counterargument), and being honest about scope limitations. They specifically requested British English and no citations.

  Hmm, the emotional cases do seem to create a special problem for internalism. If reasons require a possible "route" to motivation, how does that apply to emotions we don't deliberately choose? The supervisor-type objection about fittingness is crucial - I'll need to address how the chapter would engage with this without presupposing externalism. 

  For structure, I'm thinking: first articulate why emotions are a blind spot in the debate, then show how this exposes a dilemma for internalists. The methodology should involve analyzing paradigmatic emotion examples to test different interpretations of the "grip requirement". Week-by-week, they could start by mapping the debate, then examine emotion cases, then evaluate internalist responses. 

  The scope challenges are real - 8-10k words means they can't solve the entire debate, but could productively expose this fault line. Success would be showing why emotions can't be easily assimilated to either action or belief cases, while failure might look like getting bogged down in definitional debates. 

  Better avoid jargon where possible and keep the tone analytic but accessible. The "ta" at the end suggests they'd appreciate a slightly conversational touch despite the academic rigor.
answer: |-
  Here’s a focused chapter proposal addressing your core challenge, structured as requested:

  **Chapter Proposal: Internalism, Reasons, and the Grip Requirement for Emotions**  

  **The Question:**  
  Can internalism about reasons—understood as the view that a normative reason for an agent must be capable of motivating that agent (under some possible, often idealised, deliberative conditions)—accommodate reason-claims targeting *emotions* (e.g., "You had reason to be angrier," "You have no reason to still grieve")? Or do such claims force internalists into either implausible psychological commitments or an unacknowledged collapse into externalism?  

  **Why Existing Positions Leave It Open:**  
  The internalism/externalism debate orbits around reasons for *action*. Internalists ground reasons in an agent’s existing motivational set (Williams) or hypothetical procedurally rational deliberation (Smith), assuming the "output" is *action*. Externalists posit reasons independently of an agent’s psychology (e.g., Parfit). Neither position explicitly addresses whether, or how, the "grip requirement" (that a reason must be able to get traction on the agent) applies to *emotions*, which:  
  1.  **Lack deliberative routes:** We don’t typically reason ourselves *into* fear, anger, or grief in the way we reason towards actions.  
  2.  **Resist direct control:** Emotions aren’t directly willed like actions or revised like beliefs via evidence.  
  3.  **Feature in distinct criticism:** Criticisms like "You shouldn’t be so afraid" target emotional states, not choices.  
  Standard accounts either ignore emotions or implicitly treat them as analogous to actions or beliefs, leaving unresolved whether internalism can coherently extend to this domain without distortion.  

  **Approach (Week-by-Week):**  
  *   **Weeks 1-2: Mapping the Terrain & Core Challenge:**  
      *   *Task:* Precisely define internalism’s "grip requirement" (minimal vs. idealised) as applied in action cases. Contrast the structure of reason-claims for actions vs. emotions using clear examples.  
      *   *Why:* Establishes the asymmetry. Shows why emotional cases aren’t trivially reducible to action cases. Pre-empts the "just do fittingness" objection by framing the *challenge* to internalism first.  
  *   **Week 3: Testing Internalist Strategies for Emotions:**  
      *   *Task:* Evaluate how internalism *might* handle emotion claims: (a) Appeal to indirect control ("You could reason to manage attention/stimuli, influencing emotion"); (b) Radical idealisation ("A fully rational agent *would* feel this"); (c) Reduction to reasons for related actions/beliefs ("Reasons *to express* anger").  
      *   *Why:* Directly tackles the dilemma you identified. Assesses if internalist tools *can* be adapted.  
  *   **Week 4: The Fittingness Objection Head-On:**  
      *   *Task:* Confront the objection: "Reason-claims about emotions *just are* fittingness claims (e.g., D’Arms & Jacobson), hence externalist." Argue this doesn’t dissolve the problem:  
          (i) Ordinary reason-talk about emotions ("you *have* reason to be angry") often implies more than mere aptness – it suggests the emotion *should get a grip*, linking to motivation/psychology.  
          (ii) Internalists need to explain *why* fittingness claims (if that's all they are) *should* have any purchase on the agent if no psychological route exists.  
          (iii) The chapter tests if internalism can *accommodate* this apparent normativity without abandoning the grip requirement. The objection presupposes externalism isn’t the only viable option here.  
      *   *Why:* Meets the supervisor-objection directly. Shows the question persists even if fittingness is central – it becomes "Can internalism make sense of the *normative force* of fittingness for *this agent*?"  
  *   **Week 5: Belief as a Model? Why Not?:**  
      *   *Task:* Assess the "reasons for belief" analogy. Argue it fails: Beliefs *are* directly responsive to (epistemic) reasons via deliberation; emotions lack this direct rational sensitivity. Belief internalism (e.g., evidentialism) operates differently from practical internalism.  
      *   *Why:* Dismisses a likely alternative path, strengthening the case that emotions are distinctive.  
  *   **Week 6: Implications for the Grip Requirement:**  
      *   *Task:* Synthesise findings. Does accommodating emotion-reasons force internalism into implausible psychology (e.g., requiring direct rational control of affect)? Or does it push internalism towards an externalist-friendly "frictionless" idealisation, rendering the grip requirement inert? What does this reveal about the requirement’s core purpose in the action case?  
      *   *Why:* Drives towards the conclusion about the tension between internalism’s motivation-centric core and the phenomenology of emotional reasons.  

  **Why this approach?**  
  It focuses squarely on the *pressure point* your idea identifies: the unique challenge emotions pose to the *grip requirement*. It avoids getting sidetracked into general internalism/externalism arguments or full metaethical debates. It prioritises analysing concrete examples and internalist responses over historical surveys. The alternatives—collapsing into fittingness externalism or forcing an analogy to belief—are explicitly evaluated and rejected as solutions *within the internalist project* as defined.  

  **Possible Conclusions:**  
  1.  **Internalism Stretched Thin:** Internalism *can* technically accommodate emotion-reasons via radical idealisation, but only by evacuating the grip requirement of substantive psychological content, undermining its original motivation for actions.  
  2.  **Internalism Buckles:** Emotions expose a genuine limit. Maintaining a robust grip requirement forces implausible claims about our control/responsiveness over emotions, suggesting internalism cannot coherently cover this domain.  
  3.  **Hybrid/Revision:** Emotional reasons require a distinct account within (or alongside) internalism, perhaps involving different kinds of "routes" (e.g., via cultivation of sensibility) or a moderated grip requirement.  
  **Deciding Factors:** The plausibility of internalist strategies for indirect control/idealisation; the success of arguments against the fittingness objection (does reason-talk about emotions *really* imply psychological purchase?); whether the idealisation needed for emotions fatally weakens the requirement for actions.  

  **Scope Risks (Too Big/Failure):**  
  *   **Too Big (8-10k):**  
      *   Getting bogged down in exegesis of multiple internalist/externalist theories.  
      *   Attempting a full positive theory of reasons for emotions.  
      *   Tackling the metaphysics of reasons head-on.  
      *   *Mitigation:* Strictly focus on *internalism's problem*, using a canonical formulation (e.g., Williams/Smith). Analyse only 2-3 paradigmatic emotion examples deeply.  
  *   **Failure (Even if Executed):**  
      *   **Conceding too much to fittingness:** Failing to show that the *internalist challenge* persists even if emotion-reasons are fittingness-based.  
      *   **Inconclusive Waffle:** Not clearly showing *why* emotions are harder than actions/beliefs, or leaving the internalist options looking equally plausible/implausible without argumentative resolution.  
      *   **Missing the Target:** Allowing the discussion to drift into general moral psychology of emotions without tying it back to the *structure* of the internalism/externalism debate and the fate of the grip requirement.  
      *   **Losing the Core:** Failing to keep the spotlight on the question: "What is the grip requirement *for* if it can't handle emotions without collapsing?"  

  **In essence:** The chapter succeeds if it convincingly demonstrates that reason-claims about emotions create a unique and potentially fatal tension for internalism’s core commitment, forcing a choice between psychological implausibility, conceptual vacuity, or quiet capitulation, thereby exposing a critical ambiguity in the grip requirement itself.
