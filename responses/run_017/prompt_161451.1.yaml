  For the reductio, having the Office declare the dementia patient as "provisionally extant" based on administrative need would expose the terrifying implication: that institutions literally constitute selves through paperwork. The definitions section needs to mirror Dennett's terminology ("center of narrative gravity") while sounding like real regulations.

  Gotta maintain that soulless bureaucratic voice throughout. No jokes - the comedy comes from earnest attempts to quantify the unquantifiable. The case file should show clerks desperately applying metrics to subjective experiences ("gravitational drift coefficients"). 

  Final twist: the Office's declaration that they "create nothing" while actively determining legal personhood. That cognitive dissonance is where the political critique lives. User's smart - they want the theory to hang itself with its own rope.
answer: |-
  ## Draft Statutory Guidance: Office of Narrative Continuity (ONC)  
  **Subject:** Determination & Maintenance of Narrative Centres of Gravity (NCGs)  
  **Reference:** ONC/SG/787/Rev.4  
  **Effective Date:** Pending Ministerial Approval  

  **Section 1: Definitions**  
  1.1 **Narrative Mass:** The aggregate of story elements (attributed actions, experiences, traits, intentions) associated with a biological entity (hereafter "the Core").  
  1.2 **Center of Narrative Gravity (NCG):** The notional point of coherence derived from Narrative Mass, constituting the Self. An NCG is a theoretical posit, not a physical entity or discrete property of the Core.  
  1.3 **Authorized Contributor:** An individual or entity (e.g., next-of-kin, state-appointed biographer, licensed employer) formally recognized by the ONC as generating valid Narrative Mass for a Core.  
  1.4 **Gravitational Drift:** Significant divergence in Narrative Mass over time, potentially indicating NCG instability or dissolution.  
  1.5 **Provisional NCG:** A temporary designation applied where Narrative Mass is insufficient or contested (see Sec. 4.2).  

  **Section 2: Minimum Narrative Threshold (MNT)**  
  2.1 An NCG is deemed **Extant** when verifiable Narrative Mass exceeds 200 Standard Narrative Units (SNUs) per annum, averaged over a 3-year cycle (ONC Form 7B).  
  2.2 **Sub-Threshold Cores** require Provisional NCG status:  
      *   2.2.1 **Infants (0-24 months):** Narrative Mass derived solely from Authorized Contributors (typically parents/guardians via Form 12G: "Attributed Potentiality").  
      *   2.2.2 **The Comatose/Non-Communicative:** Relies on pre-existing Narrative Mass & projections by Authorized Contributors via Form 12H: "Projected Continuity".  
      *   2.2.3 **The Extremely Private:** ONC-approved assessors may infer Narrative Mass from observable behaviours & circumstantial data streams (utility usage, financial transactions, CCTV meta-analysis - Schedule 3, Para 8).  
  2.3 MNT exemptions do *not* imply ontological deficiency. The NCG remains a functional posit for administrative coherence.  

  **Section 3: Sourcing & Validation of Narrative Mass**  
  3.1 Narrative Mass originates from multiple vectors: Core-generated (e.g., diaries, testimony), Contributor-generated (e.g., employer records, family anecdotes, social media commentary), and Institutional-generated (e.g., medical records, state databases).  
  3.2 **Weighting:** Core-generated Mass carries a 1.0x weighting. Authorized Contributor Mass carries 0.7x. Institutional Mass carries 0.5x. Unauthorized Contributor Mass (e.g., tabloid press, unlicensed biographers) is discounted unless formally incorporated via ONC Appeal (Form 9D).  
  3.3 **Veracity:**  
      *   3.3.1 The ONC does *not* arbitrate factual truth.  
      *   3.3.2 Confabulated, self-serving, or externally imposed narratives constitute valid Narrative Mass provided they meet sourcing criteria (Sec. 3.1, 3.2).  
      *   3.3.3 Disputed narratives contribute Mass proportional to their institutional adoption (e.g., court rulings, widely published biographies).  

  **Section 4: NCG Persistence & Alteration**  
  4.1 **Gravitational Drift:**  
      *   4.1.1 Drift exceeding 35% on the Hollis Scale (measuring thematic/valuative consistency) triggers a Stability Review (Form 15R).  
      *   4.1.2 Significant drift may necessitate reclassification (e.g., "NCG-β" designation) but does *not* imply prior NCG extinction.  
  4.2 **Provisional Status & Retroactive Effects:**  
      *   4.2.1 Where current Narrative Mass is insufficient (e.g., advanced dementia), the most recent stable NCG configuration is administratively maintained.  
      *   4.2.2 Revision of historical records *can* retroactively alter the perceived trajectory or even the initial constitution of an NCG. This is an administrative recalibration, not time travel. The NCG was *always* the posit derived from the *current* total Narrative Mass.  

  **Section 5: Case File - Application of Guidance**  
  **Core:** #AX-789234 (Formerly "Eleanor Vance")  
  **Status:** Provisional NCG (P-NCG) - Advanced Dementia (Certified Medical Status D4)  

  **Narrative Mass Assessment:**  
  *   **Daughter (Authorized Contributor):** Submits Narrative Mass (Form 12H) portraying Core as lifelong devout pacifist, community volunteer. Mass: 120 SNUs (0.7x = 84 Effective Units). Includes childhood diaries (Core-generated, 1.0x).  
  *   **Son (Authorized Contributor):** Submits Narrative Mass (Form 12H) portraying Core as privately resentful, stifled artist, covertly rebellious. Mass: 110 SNUs (0.7x = 77 EU). Cites recently discovered, uncatalogued sketches (disputed Core-generated, pending verification - weighted 0.5x provisionally).  
  *   **State Care Home (Institutional Contributor):** Daily logs depict Core as passive, non-responsive, fond of custard. Mass: 85 SNUs (0.5x = 42.5 EU).  
  *   **Unauthorized Biography ("Eleanor Unbound"):** Claims Core was a Cold War asset based on declassified archive fragments (discarded per 3.3 - insufficient institutional adoption). Mass: 0 EU.  

  **Aggregate Mass:** Daughter (84 EU) + Son (77 EU) + Institution (42.5 EU) + Provisional Sketches (15 EU) = 218.5 EU. **Below MNT (200 SNU = 200 EU min).**  

  **ONC Determination (Case Officer J. Smith):**  
  1.  **MNT Failure:** Aggregate Effective Units (218.5) < Required Threshold (200 SNU = 200 EU minimum for Extant NCG). P-NCG status maintained.
  2.  **Incompatible Mass:** Daughter/Son narratives exhibit Drift > 60% on Hollis Scale (Familial Piety vs. Covert Rebellion). Stability Review (15R) inconclusive. No dominant narrative emerges.
  3.  **Administrative Continuity Required:** Per 4.2.1, the last stable NCG configuration (pre-D4 certification, 5 years prior) is reactivated for legal/financial purposes. This NCG was moderately pious, community-oriented (based on Daughter's Mass + Parish records).
  4.  **Current Core State:** The observable Core (non-verbal, preference for custard) contributes negligible Mass. Its administrative status is entirely dependent on projected/archival Mass.
  5.  **File Status:** **OPEN - UNRESOLVED.** Cannot reconcile competing Authorized Contributor Masses. Pre-D4 NCG reactivated *provisionally*. Son has appealed sketch weighting (Form 9D). Daughter disputes son's Contributor status (Form 11T: "Contributor Malignance"). Awaiting Tribunal date. Custard preference logged (Form 17C: "Ambient Narrative Trait").

  **Conclusion:**  
  The Office of Narrative Continuity administers the necessary fiction of the Self as the Center of Narrative Gravity. This Guidance provides the framework for quantifying, sourcing, and stabilizing this posit. The ONC does not create selves; it identifies the gravitational locus within the narrative field surrounding a Core. Where narratives conflict or decay, the Office utilises the most stable available configuration to ensure administrative continuity. The self, as ever, remains a theoretical abstraction – a necessary point of reference for the stories we tell. The Office merely ensures the paperwork reflects the prevailing narrative conditions. Final determination in Case #AX-789234 awaits sufficient resolution of Narrative Mass conflicts or Ministerial directive regarding Sub-Threshold Core permanence. The Core itself remains biologically extant; its NCG status is an administrative calculation derived entirely from the stories told about it.
