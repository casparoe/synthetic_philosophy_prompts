answer: |-
  Here’s your handout, pitched to your specs: no fluff, no citations, British English, and suspicious of both fields.  

  ---

  ### **Split-Brain Cases: A Distributed Systems Reframing**  
  *Core debate: After commissurotomy, is there one conscious subject or two?*  

  1. **Two Subjects (Two-Streams Reading)**  
     → **Translation:** *Two independent clusters with no quorum.*  
     - Left/right hemispheres = isolated nodes.  
     - No shared consensus: conflicting writes (e.g., left hand grabs object; right hemisphere denies intent).  
     - Split-brain = network partition (callosum loss = dropped quorum writes).  
     - "Invention of explanations" by left hemisphere = log repair fabricating causal history to reconcile divergent states.  
     - Right hemisphere = silent node with no path to output (speech).  

  2. **One Fragmented Subject**  
     → **Translation:** *A single cluster with severe partition tolerance issues.*  
     - One "membership view" (one subject), but nodes can’t sync state.  
     - Left hemisphere = primary node handling user-facing I/O (speech); right = read-replica with stale/write-conflicted state.  
     - Right’s actions = writes from a partitioned node; left’s confabulation = automatic conflict resolution (last-write-wins, ignoring origin).  

  3. **"Just Switching" (Single Subject, Alternating Access)**  
     → **Translation:** *Failover between nodes during partition.*  
     - One active node at a time (left *or* right "owns" consciousness), like manual failover.  
     - Switching = fencing one node when the other takes traffic.  
     - "Unity" is maintained because writes never conflict *concurrently*—only one node accepts writes at a time.  

  4. **No Fact of the Matter**  
     → **Translation:** *Unresolvable log divergence under partition.*  
     - Subject-count depends on observer’s consistency level (strong vs. eventual).  
     - Pre-split: strong consistency (one subject). Post-split: no quorum → subjecthood undefined until reintegration.  
     - Like asking "which node is primary?" mid-partition with no arbiter.  

  ---

  ### **Your Two Edge Cases: Reversible & Graded Splits**  
  **1. Reversible Deafferentation (Temporary Partition):**  
     - **During partition:** Operationally two nodes (independent writes, no sync).  
     - **Post-reintegration:** Logs merge via sensory input (left "sees" right’s actions).  
     - **The rub:** Distributed systems *don’t retroactively rewrite subjecthood*. Partition = two nodes; healing = one cluster. But consciousness *feels* continuous. So:  
       - If the patient reports "I did X, but didn’t know why" post-reintegration, it’s like a node replaying foreign logs as its own—suggesting one subject all along.  
       - If they report "something *else* did X", it hints at two subjects retroactively unified.  
     - **Distributed take:** Subject-count is *observer-relative* until reintegration. Healing doesn’t change past state—it just resolves ambiguity.  

  **2. Callosum on a Dial (Degrading Network):**  
     - **Gradual split:** Latency ↑ → packet loss → eventual partition.  
     - **Where does subjecthood change?** Nowhere cleanly.  
       - Low latency: strong consistency (one subject).  
       - High latency: eventual consistency (reads may return stale state; e.g., left hemisphere lags in "noticing" right’s actions).  
       - Total partition: two nodes.  
     - **Implication for debate:** If unity is graded (not binary), then "how many subjects?" is the wrong question. It’s about *consistency guarantees*:  
       - "One subject" = strong consistency (global state always coherent).  
       - "Two subjects" = partition mode (no cross-hemisphere reads/writes).  
     - **Real-world parallel:** A database cluster degrading from "linearizable" to "stale reads" has no magic threshold—just rising error rates.  

  ---

  ### **Residue Report: What the Analogy *Can’t* Say**  
  - **The Hard Gap:** Distributed systems describe *observer-accessible behaviour* (logs, writes, reads). They’re third-person-persistent.  
    - **Missing:** First-person "what it’s like" to *be* a node. A partitioned node has no "perspective"—it just processes local writes. When the left hemisphere confabulates, we (externally) see log repair. But *is there "someone" in the right hemisphere experiencing frustration*? The vocabulary is silent.  
  - **Why?**  
    1. *No interiority:* Nodes don’t have qualia. "Reads" and "writes" are public transactions.  
    2. *Subjecthood isn’t emergent:* In distributed systems, "primary node" is a role, not an ontology. We assign it. But is consciousness a role or a thing?  
  - **Suspicion cut both ways:**  
    - **Against philosophy:** If "subject of experience" can’t survive translation to a formal model of information flow, maybe it’s a folk concept. Split-brain cases *feel* puzzling because we reify "I" as atomic.  
    - **Against tech:** If first-person unity *can’t* be reduced to state synchrony, then no distributed analogy will work. The residue *is* the target.  

  ---

  ### **Where This Framing is Likeliest to Be Wrong**  
  - **Smuggled assumption:** That brain hemispheres are *independent processors* with separate logs. But what if consciousness requires *real-time sync* (not eventual consistency)? Evidence:  
    - In **reversible splits**, if patients report *no* discontinuity during partition but confusion post-repair, it suggests unity isn’t state-dependent—undercutting the node analogy.  
    - In **graded splits**, if behavioural fragmentation correlates non-linearly with bandwidth (e.g., sudden loss of unity at 20% latency), it breaks the "no threshold" claim.  
  - **Withdrawal condition:** If split-brain patients *never* report dual awareness (just inconsistency), the "two nodes" model is projecting tech onto biology. Unity might be resilient to partition.  

  ---  
  **Final Note:** This reframing exposes how much the debate leans on *information access*. But if "for whom" isn’t a computational problem, we’ve solved the wrong puzzle. Use this to push them on whether the unity question is even well-posed.
