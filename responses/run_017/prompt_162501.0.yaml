  We are designing an activity for a 90-minute seminar on Wittgenstein and rule-following, focusing on Kripke's skeptical challenge. The goal is for students to generate underdetermining evidence themselves and then feel the pull of the challenge. We will avoid using addition and instead use an invented operation. We will also build in two types of rival rules: one gerrymandered to the class's own data and one that is equally simple but keyed to an external factor (like the number of times the operation has been applied or who is being asked). The activity will include a stage where the room has to adjudicate someone else's continuation, forcing them to confront that their own agreement is the only court of appeal.

  Constraints:
  - 16 students, 90 minutes, whiteboard, index cards.
  - Nothing to buy or prepare in advance (so we can use index cards and whiteboard).
  - Use an invented operation (I'll propose one called "flink" but we can adjust).
  - Two rival rules: one gerrymandered to the class's data and one equally simple but based on an external factor.
  - Stage for adjudicating someone else's continuation (using a confederate or split room).

  Proposed invented operation: 
  Let's define "flink" as an operation on ordered pairs of numbers from the set {0,1,2,3,4}. We'll start with a natural rule that is easy to compute but not obvious. For example:

  Natural rule for flink(a,b):
     If a and b are both even, then flink(a,b) = (a + b) mod 5.
     If a and b are both odd, then flink(a,b) = (a * b) mod 5.
     If one is even and the other odd, then flink(a,b) = |a - b|.

  But note: we don't want the students to know the rule. We want to train them with examples and then see how they continue.

  However, we must design the rival rules as well.

  Alternative plan: 
  We can let the natural rule be simple, and then the rivals be variations. But we must avoid prior competence.

  Let me define the natural rule as:
     flink(a,b) = (a + b) mod 5   [for all a,b in {0,1,2,3,4}]

  But then we need two rivals:

  Rival 1 (gerrymandered to the class's data): 
     We will record every pair that the class computes during the training phase. Then, for any pair (a,b) that has been computed in the training phase, rival rule gives the same as the natural rule. For a pair (a,b) that has never been computed, we define it to be (a - b) mod 5 (or some other function). But note: we cannot prepare in advance? We have to generate during the session.

