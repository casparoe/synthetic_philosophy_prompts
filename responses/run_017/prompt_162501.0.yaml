  Proposal: 
  We will have the natural rule in mind, but not tell the students. We will train them with examples of flink for pairs in {0,1,2,3,4}. We will write each example on the board as we go. Then, we will define a rival rule that agrees on all the pairs that have been written on the board and diverges on at least one pair that hasn't been written. We can choose that pair arbitrarily (e.g., (4,3)) and define the rival to give a different answer for that pair. We can write the rival rule as:

