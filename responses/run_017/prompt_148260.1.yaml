prompt: |-
  Hi! Bit of an odd one. I run a tiny decision-theory reading group out of my flat — me, my flatmate Ollie, and two mates in Boston on Zoom — and we take turns writing a short handout each week, so could you write yours in American English please? The Americans keep taking the mickey out of my "whilst" and "learnt" and it's got to the point where it's slowing the actual discussion down. Also, please don't go looking anything up or pointing us at papers or reading lists: we've been doing this one deliberately from first principles, and half the fun is that none of us can remember who said what.

  The reason I grabbed this week's topic is that I've actually got one of these decisions sitting on my plate right now. A company I did a load of contract work for years ago got bought, and the payout on my little stub of equity is structured in a genuinely annoying way: I'm choosing between, roughly and on our best estimates, an 11% shot at $1M and a 10% shot at $5M. I want to take the second. But Ollie points out that in last week's session I also said I'd take a guaranteed $1M over a package paying 89% × $1M, 10% × $5M, 1% × $0 — and he says I can't have both. Set p = 0.11, and the first pair is just [a sure $1M] versus [a 10/11 chance of $5M, 1/11 chance of $0], each mixed 11/89 with a sure $1M; the second pair is the very same 11/89 mixture with the 89% branch paying $0 instead. Independence says the common branch can't matter, and since any expected-utility maximiser has to satisfy independence, I'm either not an EU maximiser or I'm just inconsistent. He's also got a nastier version: suppose a ticket is drawn from a hundred-ticket urn and the 89 "dead" tickets are resolved first behind a curtain — if it's a dead one you're simply handed the common amount and sent home, and only if it's a live one do you get to pick between the sure $1M and the 10/11 shot at $5M. In that version my two answers collapse into a single choice, so I can't give different answers, and he says that shows my collapsed answer is my real preference and the original pair of answers was just an artefact of how the thing was described.

  I've been chewing on this for about a week and I've landed somewhere, and I'd like you to argue my side better than I can. My thought is that independence is a perfectly good axiom if you're building a recursive theory for someone facing a long series of small, separable gambles — that's the setting where the sequential money-pump arguments get any grip — but it just isn't a requirement of rationality for a one-shot, all-or-nothing decision like mine. And I also think there's something rationally significant about certainty over and above its contribution to expected value: a sure $1M is the only item in any of these packages you can actually plan around or borrow against, because you can't sign anything on an 89% chance. So please make the strongest case you can for that position. I'd like you to (i) develop that "commitment value of certainty" line properly instead of just asserting it; (ii) give an honest answer to the curtain version, including a variant where the ticket has already been drawn and is sitting sealed in an envelope in the other room and someone offers to open it and show you, for a penny, before you choose — should I pay the penny, and whatever you say there, what exactly does it commit me to; and (iii) deal with the objection that all of this is just the certainty effect, i.e. a documented bias, and that what you do with a bias is get rid of it rather than build a philosophy around it. Then at the end actually tell me what to do: take the 11% shot at $1M or the 10% shot at $5M? I definately don't want a fence-sitting "it depends on your attitude to risk" — give me a verdict and defend it, and if you think I should be worried about something seperate that I haven't thought of, say so too.
