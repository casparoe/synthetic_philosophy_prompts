prompt: |-
  Hi — I need help drafting a memo and I'm kind of drowning. Context: I'm a second-year cog sci PhD student and I somehow ended up on the steering committee of a small open evaluation suite for visual reasoning (six members, a Slack that's 90% meme threads, and a release date in six weeks). We have to decide on one task submission and I'm the one stuck writing the recommendation memo.

  The submission is a Bongard-style few-shot concept-induction task: you get twelve figures — six on the left that share a rule, six on the right that violate it — and then you have to say whether a new figure follows the rule. The intended rule here is about containment: every left-hand figure has one shape sitting entirely inside another (triangle in a circle, square in a pentagon, circle in a circle, two nested rectangles), while every right-hand figure has shapes that are either fully disjoint or only partially overlapping, with nothing contained in anything. We all liked it. Then one reviewer ran a three-line baseline that just measures average ink density per image and got 98%: the generator apparently has two rendering branches, and the positive branch also draws with a thinner stroke, and because of how the layout code samples sizes the positives also wierdly tend to have a slightly smaller bounding box. So a system can ace the task without representing containment at all.

  Now the committee is split and I have to recommend something. Our ML person says: fine, just regenerate the item pool with the correlates flipped or randomized and score on held-out items, so anything relying on stroke weight fails. Our vision chair says that fixes nothing: the general worry is that no finite set of examples pins down a rule — there are always grue-style alternatives that fit all the data and diverge on the next case — and "randomize the confounds we happened to notice" only works because we already decided which features are projectible, i.e. we smuggled in the answer, and by that logic the whole few-shot format is broken rather than just this task. Someone else floated a different scoring rule: don't score the model's label on the held-out image at all; score whether the model can state a rule in words that a naive human annotator can then apply to fresh figures and get right. I have a nagging suspicion that this just tests verbalization, which current systems are very good at, rather than whether the system has got the concept, but I can't get the worry into focus. Complicating everything: our rubric says accepted tasks must be "solvable by an untrained human in under two minutes," and it occurs to me that a human staring at these twelve figures faces exactly the same underdetermination and just picks the rule that feels natural — so that criterion might already presuppose whatever we were trying to test. Our existing rubric language ("requires abstract reasoning") is useless and I'd like the memo to actually say what our criterion should be.

  So: please write the memo I'll circulate, around 800 words, addressed to the committee, recommending one of: accept as submitted, reject, or accept with specified conditions. It should be something we could actually vote on, and it should include a short criteria section saying what we are testing for when we claim a task measures induction of a concept from a few examples rather than surface pattern-matching. Please treat the underdetermination objection seriously and give the strongest version of whichever position you end up rejecting — I don't want the losing side to feel strawmanned, especially not the vision chair, who will absolutely push back in the meeting. No bibliography or citations please, we can't check them and none of us will read them anyway. End the document with exactly one final line: \answer{accept}, \answer{accept with conditions}, or \answer{reject}.
reasoning: |-
  We are drafting a memo for the steering committee of an open evaluation suite for visual reasoning. The task in question is a Bongard-style few-shot concept-induction task about containment. The problem is that a simple baseline using average ink density (due to unintended correlates: stroke weight and bounding box size) achieves 98% accuracy, indicating that the task can be solved without understanding containment.

  The committee is split on how to proceed. The memo must recommend one of: accept as submitted, reject, or accept with conditions. It must also address the underdetermination problem (the fact that any finite set of examples does not uniquely determine the rule) and clarify what we are testing for when we claim a task measures induction of a concept from few examples.

  We must consider:
  - The ML person's suggestion: regenerate the item pool with confounds (stroke weight, bounding box) flipped or randomized, and score on held-out items.
  - The vision chair's objection: randomizing confounds we notice doesn't solve the underdetermination problem and by selecting which features to randomize we are smuggling in the answer. Moreover, the vision chair argues that the few-shot format is inherently broken if we require a unique rule.
  - Another suggestion: score based on the model's ability to state a rule in words that a human can then apply to new figures.

  Additionally, the rubric requires that the task be "solvable by an untrained human in under two minutes." The author notes that humans also face underdetermination but pick the rule that feels natural.

  The memo should:
  - Be about 800 words.
  - Addressed to the committee.
  - Include a criteria section that defines what we are testing for.
  - Treat all positions seriously, especially the vision chair's underdetermination objection.
  - End with exactly one of: \answer{accept}, \answer{accept with conditions}, or \answer{reject}.

  After considering the options, I propose that we accept the task with conditions. The conditions should address the immediate confound (by regenerating the item pool to remove the unintended correlates) and also implement the scoring rule that requires the model to state a rule in words that a human can apply (to address the underdetermination by requiring the rule to be projectible in a human-like way). However, we must also note that the vision chair's deeper worry about underdetermination remains and that our criteria should be updated to reflect that we are testing for the ability to induce a rule that is natural (i.e., projectible by human standards) and that can be generalized.

  Structure of the memo:

  1. **Introduction**: Briefly state the context and the issue.
  2. **Summary of the Task and the Problem**: Describe the task and the baseline that exploited unintended correlates.
  3. **Committee Positions and Objections**: Present the different views (ML person, vision chair, and the verbalization proposal) fairly and with strength.
  4. **Criteria for Concept-Induction Tasks**: Define what we are testing for, addressing the underdetermination problem and the role of human-like projectibility.
  5. **Recommendation and Conditions**: Propose to accept the task with two conditions: (a) regenerate the item pool to remove the confounds, and (b) change the scoring to require the model to state a rule that a human can use to classify new images. Also, acknowledge that this does not fully solve the underdetermination problem but aligns with our rubric's requirement of human solvability.
  6. **Conclusion and Final Answer**: End with the answer.

  Word count: We are aiming for about 800 words.

  Let's draft accordingly.
answer: |-
  **MEMORANDUM**  
  To: Steering Committee, Visual Reasoning Evaluation Suite  
  From: [Your Name], Second-Year Cog Sci PhD Student  
  Date: October 26, 2023  
  Subject: Recommendation for Bongard-Style Containment Task Submission  

  ### Background  
  The submission under review is a Bongard-style few-shot concept-induction task. Participants are shown twelve figures: six on the left adhering to a rule (here, *containment*: one shape fully inside another) and six on the right violating it. A new figure must be classified as rule-following or not. The task aligns with our goals for abstract visual reasoning and was initially well-received. However, a reviewer identified a critical flaw: a trivial baseline using average ink density (driven by unintended correlates like stroke weight and bounding box size) achieves 98% accuracy. This indicates the task can be solved without representing containment, undermining its validity.  

  ### Committee Positions  
  The committee is divided on remediation, reflecting deeper tensions in evaluating concept induction:  
  1. **ML Perspective (Remediate Confounds)**: Recommends regenerating the item pool by randomizing stroke weights and bounding boxes, then scoring on held-out items. This would force reliance on containment by nullifying surface cues.  
  2. **Vision Chair’s Underdetermination Objection (Fundamental Critique)**: Randomizing *known* confounds fails because any finite example set underdetermines the rule (e.g., “grue”-style alternatives fit the data but diverge later). By selecting which features to randomize, we presuppose which properties are “projectible” (e.g., containment over ink density), effectively smuggling in the answer. This exposes a paradox: few-shot tasks inherently rely on inductive biases humans take for granted, and “fixing” confounds merely papers over this. If we accept this, the entire few-shot format may be invalid for testing concept induction.  
  3. **Alternative Scoring Proposal (Verbalized Rules)**: Suggests not scoring the model’s label directly, but requiring it to output a rule (e.g., in natural language) that a naive human can use to classify fresh figures. This aims to test whether the model *understands* the rule, not just pattern-matches.  

  ### Key Concerns  
  - **Rubric Requirements**: Our criteria mandate tasks be “solvable by an untrained human in under two minutes.” Humans resolve underdetermination by favoring “natural” rules (e.g., containment over ink density), but this presupposes the very inductive bias we aim to test.  
  - **Verbalization Worry**: Scoring rule-statements risks conflating concept induction with verbalization prowess. Modern LLMs excel at generating plausible rules without true understanding, potentially creating false positives.  
  - **Core Criterion Gap**: Our rubric’s “abstract reasoning” criterion is vague. We need clarity on what we test when claiming a task measures *concept induction from few examples*.  

  ### Defining Criteria for Concept-Induction Tasks  
  For this task to validly measure concept induction, it must satisfy two interdependent criteria:  
  1. **Projectible Generalization**: The rule must generalize to held-out examples in a way that aligns with human-like induction (e.g., containment is projectible; ink density is not). This acknowledges underdetermination but requires that successful models mimic human biases, as our rubric implies via “untrained human” solvability.  
  2. **Robustness to Surface Correlates**: The task must be unsolvable via trivial heuristics (e.g., ink density) by design. Remediation should target *all identifiable confounds*, but we accept that unanticipated correlates may exist—this is a practical constraint, not a dismissal of underdetermination.  

  Crucially, concept induction here is not about finding a “true” rule (impossible from finite examples) but about privileging rules humans find natural and projectible. Our rubric’s human-solvability criterion implicitly endorses this, as humans default to projectible features (e.g., shape relations over rendering artifacts).  

  ### Recommendation: Accept with Conditions  
  I recommend **accepting the task** contingent on two modifications:  
  1. **Item Pool Regeneration**: The submitter must regenerate all figures, randomizing stroke weights and bounding box sizes across all examples (positive and negative). This ensures ink density cannot serve as a reliable cue, forcing reliance on structural features.  
  2. **Scoring via Human-Applicable Rules**: Models must output a rule (e.g., in natural language) that a naive human annotator (unseen by the model) can use to classify 10 fresh figures with ≥90% accuracy. The model’s own label predictions will not be scored.  

  ### Rationale  
  - **Why Conditions?** Regeneration addresses the immediate confound, while rule-verbalization scoring tackles underdetermination by requiring the *rule itself* to generalize human-projectibly. If a model verbalizes containment accurately and the human applies it successfully, it suggests the model induced a human-natural rule, not a grue-like alternative. This leverages our rubric’s human-solvability standard as a strength: by testing whether the model’s rule *resonates* with human intuition, we operationalize “abstract reasoning” as projectible generalization.  
  - **Addressing Objections**:  
    - The Vision Chair’s underdetermination critique is valid and profound—no remediation can fully eliminate it. However, our conditions embrace it pragmatically: by tethering success to human projectibility (via rule-verbalization), we acknowledge that induction is bias-dependent and align with our existing human-solvability requirement.  
    - The verbalization worry (testing “talk” over “thought”) is mitigated because the rule must generalize to human-classified *novel* images. A model generating vacuous or incoherent rules would fail when humans misapply them.  
    - The ML perspective’s confound-fix is incorporated but insufficient alone; rule-verbalization provides a guardrail against unanticipated correlates.  
  - **Feasibility**: Both conditions are executable within six weeks. Regeneration is a technical fix, and human scoring can use platforms like MTurk.  

  ### Conclusion  
  The containment task, as submitted, fails due to surface confounds. However, its core design captures a human-natural inductive bias (containment), making it valuable if repaired. Accepting it with the above conditions transforms it into a test of *projectible concept induction*: models must derive a rule that generalizes in a human-like way, moving beyond pattern matching. This approach respects the Vision Chair’s philosophical concerns while offering a concrete, rubric-aligned solution. I propose we vote to accept the task contingent on these modifications.  

  \answer{accept with conditions}
