  The "hope nobody asks" question is about the originality of their distinction. They need to acknowledge prior work but position their contribution as applying it to climate policy contexts. Preparing honest admissions of where their framework has limits will build credibility. Structuring the prep sheet around these elements will help them stay confident during Q&A.
answer: |-
  Here’s your Q&A battle plan, structured for maximum survivability. Prioritize clarity and strategic concessions—your goal is to leave them thinking "This kid has a point" rather than winning every exchange.

  ---

  ### **Top 7 Objections (Likelihood & Damage Order)**
  1. **Senior Modeller (Likely, High Damage):**  
     *"Your ‘surrogacy requirement’ is unrealistic. All models are false—we know that. The only question is whether they’re useful for decision-making under deep uncertainty. Placeholders let us produce actionable numbers now. Demanding de-idealization stories paralyzes policy."*  
     **Your Reply:**  
     "I agree usefulness is paramount. But usefulness *for extrapolation* requires different justification than for interpolation. Surrogacy isn’t about ‘truth’—it’s about *robustness checks*: Can we bound errors when moving beyond observed regimes? If we can’t sketch how relaxing an assumption affects outputs, we’re masking uncertainty as precision."  
     **Soft Spot:** Doesn’t solve the "need numbers now" problem.  
     **Preemptive Concession:** "I concede policymakers need tractable models *today*. But we should flag placeholders as key uncertainty sources."  

  2. **Statistician (Likely, High Damage):**  
     *"Out-of-sample testing *is* our tool for extrapolation. If a model passes cross-validation/bootstrap tests beyond its training data, why demand ‘surrogacy’? Your requirement adds philosophy to a technical problem."*  
     **Your Reply:**  
     "Out-of-sample tests are vital, but they’re *retrospective* and data-hungry. Surrogacy is *prospective*: it asks ‘What structural features let us *trust* this test?’ For example, a damage function extrapolated 6°C when fitted to 1°C data may pass sparse OOS tests but lack a causal story for why it *should* hold."  
     **Soft Spot:** Overlaps with statistical tools; risks reinventing wheels.  
     **Preemptive Concession:** "I agree—rigorous validation is irreplaceable. But surrogacy complements it by targeting assumptions *known* to be fragile beyond data."  

  3. **Sympathetic Philosopher (Likely, Moderate Damage):**  
     *"Aren’t you smuggling in a representationalist view? Models are *autonomous mediators*—they don’t ‘stand for’ reality in your surrogate sense. Demanding de-idealization stories privileges one view of how models relate to the world."*  
     **Your Reply:**  
     "I’m not requiring isomorphism! Surrogacy is about *accountability*: if we distort feature X, can we articulate how that distortion shapes outputs? Even autonomous models must justify why *this* distortion is benign for *this* extrapolation. It’s internal to the modeling practice, not metaphysics."  
     **Soft Spot:** Risks conflating autonomy with unaccountability.  
     **Preemptive Concession:** "You’re right—I’m not arguing models must ‘mirror’ reality. But without surrogacy, we lose tools to diagnose failures in novel contexts."  

  4. **Calibration Expert (Moderate, High Damage):**  
     *"Placeholders often arise from *identifiability* limits—we can’t calibrate complex de-idealizations. Your norm ignores trade-offs: adding granularity can increase error via overfitting. Simplicity is a feature, not a bug."*  
     **Your Reply:**  
     "Absolutely—surrogacy *isn’t* about complexity. It’s about *controllable* simplicity. Example: a representative agent is a *surrogate* if we test robustness to heterogeneity (e.g., via agent-based submodels). If we can’t explore the assumption’s impact, it’s a placeholder masking structural risk."  
     **Soft Spot:** Doesn’t address computational/cognitive limits.  
     **Preemptive Concession:** "I agree parsimony is essential. But we should distinguish *defensible* simplicity from *untestable* simplicity."  

  5. **Skeptical Philosopher (Moderate, Moderate Damage):**  
     *"Why assume de-idealization is always possible? Some systems are irreducibly complex. Your requirement may be *impossible to satisfy* for climate-economy systems, making it vacuous."*  
     **Your Reply:**  
     "The requirement is *methodological*, not ontological. It asks modelers to *attempt* de-idealization narratives. If we can’t even sketch how relaxing an assumption affects outputs (e.g., via sensitivity analysis), that flags a critical uncertainty for decision-makers."  
     **Soft Spot:** May feel like moving goalposts.  
     **Preemptive Concession:** "For truly chaotic systems, full de-idealization may be impossible. But we can still demand *scenarios* exploring assumption-dependence."  

  6. **Graduate Student (Likely, Low Damage):**  
     *"But we *do* test placeholders! E.g., we run multi-model ensembles (IAMs) with different discount rates. Doesn’t that cover your concern?"*  
     **Your Reply:**  
     "Ensembles are great—but they test *parameter* uncertainty, not *structural* uncertainty from placeholders. If all models share the same placeholder (e.g., a global temperature→damage function), the ensemble masks that shared fragility. Surrogacy would require asking *why* that function takes its form beyond data."  
     **Soft Spot:** Overstates ensembles’ limitations.  
     **Preemptive Concession:** "Ensembles are invaluable! But they’re not substitutes for dissecting high-risk assumptions."  

  7. **Policy-Focused Modeller (Less Likely, High Damage):**  
     *"Politicians need one number for cost-benefit analysis. Your approach replaces usable ‘best guesses’ with hand-wringing about uncertainty. How is this not academic navel-gazing?"*  
     **Your Reply:**  
     "Transparency about placeholders *improves* decisions. Example: If the SCC drops 50% when we replace a placeholder discount rate with a stochastic model, policymakers should know that. Burying fragility risks catastrophic misevaluation."  
     **Soft Spot:** Feels ivory-tower to time-pressed practitioners.  
     **Preemptive Concession:** "I agree—delivering clear outputs is essential. But we can present results *with* confidence intervals driven by placeholder uncertainty."  

  ---

  ### **Critical Strategic Moves**
  - **Mandatory Early Concession (First 2 Mins):**  
    *"Let me stress: I’m not attacking model usefulness. These models are the best tools we have, and I respect the trade-offs made to serve policy. My goal is to help *strengthen* their justification for high-stakes extrapolation."*  
    *(Why: Preempts defensiveness. Shows you’re on their team.)*

  - **Make-or-Break Reply (For the Statistician/Senior Modeller):**  
    **Objection:** "But we *do* test extrapolation via [method X]!"  
    **Your Lifeline:** "Those tests measure *performance*, not *preparedness*. A model can extrapolate well accidentally (e.g., via overfitting) and fail tomorrow. Surrogacy asks: ‘Does this model have architectural features that *warrant* confidence beyond data?’ Without that, we’re gambling."  
    *(Why: If this fails, your core thesis collapses.)*

  ---

  ### **Your Two Weakest Points (Prep Defenses!)**
  1. **Testing Surrogacy Without Data:**  
     *Anticipated Attack:* "How can we ‘sketch de-idealization’ for, say, century-scale discounting when we lack data? Isn’t this just speculation?"  
     **Defense:** "We use *mechanistic reasoning*, not data. E.g., ‘If we model discount rate uncertainty as a stochastic process, outputs become distributional. Absent that, our point estimate ignores tail risks.’ We’re not demanding proof—we’re demanding *articulated fragility*."  

  2. **Action-Guiding for Policy Deadlines:**  
     *Anticipated Attack:* "Your ‘requirement’ is useless for my IPCC deadline. What should I *do* differently?"  
     **Defense:** "Two practical steps:  
     - (1) **Flag placeholders** in model documentation as key uncertainty sources (e.g., ‘This function is unvalidated beyond 2°C’).  
     - (2) **Run targeted sensitivity analyses** on placeholders (e.g., ‘Does SCC flip if we replace this with a theoretically-grounded alternative?’).  
     This costs little but improves transparency."  

  ---

  ### **The Question You Hope Nobody Asks (From Senior Modeller)**  
  *"This ‘surrogacy/placeholder’ split isn’t new. Weisberg (2007) has ‘minimalist vs. Galilean’ idealizations, and Wimsatt (2007) discusses ‘controlled vs. uncontrolled approximations.’ Aren’t you just rebranding?"*  

  **Your Response (Don’t Panic):**  
  "You’re right—I build on giants. The novelty is *applying* this to the **F-twist’s reliance on prediction**. Friedman let unrealistic assumptions ‘off the hook’ if models predict. I show that for *extrapolation*, prediction alone is insufficient—you need the *controlled* part of idealization (surrogacy) to warrant trust. This targets a specific blind spot in *economic methodology*."  
  *(Why: Admits lineage but stakes your claim. They’ll respect scholarly honesty.)*

  ---

  **Final Prep Tip:** Start your talk with: *"I’m here to learn from you. My aim isn’t to ‘win’ but to test whether this distinction helps us improve practice."* This disarms critics early. Good luck—you’ve got this.
