prompt: |-
  My reading group is doing a few weeks on classical Indian epistemology and I brought in an argument I've been chewing on for a while, and now I think it's broken but I can't find the break.

  Quick setup so you don't have to know the background. In Nyāya, a pramāṇa is a source of pramā — a genuine piece of knowledge, a cognition that gets its object right (seeing the shell as a shell, not seeing the shell as silver). The standard list has four: perception (pratyakṣa), inference (anumāna), comparison (upamāna), and testimony (śabda). And there's a big dispute about where a cognition's validity (prāmāṇya) comes from: Nyāya says validity is extrinsic (parataḥ) — a cognition is knowledge because of something other than itself, an excellence (guṇa) in the causal source that produced it — while the Mīmāṃsā school says validity is intrinsic (svataḥ), cognitions are valid on their own, and it's invalidity that needs an outside explanation. Nyāya actually holds that *both* validity and invalidity are extrinsic.

  Here's my argument.

  (1) For a cognition produced by source S to be knowledge, it isn't enough that the cognition is true and that S produced it. S has to actually be a reliable producer — a real pramāṇa, not a broken one. A damaged eye, a lying witness, a thermometer with a bias: those produce cognitions too.
  (2) Nyāya agrees in spirit: prāmāṇya is extrinsic. What makes a cognition knowledge is the excellence of its causal source, not the fact that it just showed up in your head. Validity isn't self-declaring.
  (3) So, before a cognition from S can count as knowledge, the excellence of S has to be established — by the subject, or at least in principle. Otherwise a true cognition from a defective source counts as knowledge and the whole distinction between pramā and a lucky guess collapses.
  (4) Whatever establishes S's excellence is itself a cognition produced by some further source S′ — normally an inference from S's track record, or from the fact that acting on S's outputs has worked out.
  (5) By (2), that cognition needs its own source's excellence established, so S″, and so on. That's the classic infinite regress (anavasthā). No chain ever completes, so (3) is never satisfied, so nothing is ever knowledge.
  (6) And note this doesn't just kill inference and testimony. It kills perception too, which Nyāya treats as the most basic pramāṇa of all: my visual cognition of the coffee mug needs the excellence of my eyes established, which needs an inference, which needs its own source established... The baseline case fails along with everything else.
  (7) But obviously we do know things, including by perception. So something in (1)–(3) has to go.

  The two escapes I've been offered both feel wrong to me.

  (8) Escape one: the regress only gets started when there's a live doubt; absent doubt, no certification is demanded, and ordinary cognitions are certified by successful action — you reach for the water and you get water. But the skeptic's whole move is to *make* the doubt live, and "no doubt, no need" seems to make whether you know depend on your temperament: the confident person knows, the anxious one doesn't. That looks like it proves too much in the other direction.
  (9) Escape two: go Mīmāṃsā, make validity intrinsic and only invalidity extrinsic. But then the shell-as-silver cognition is as good as knowledge until something corrects it, and the correction is itself a cognition that's valid on its own — so I don't see how error is ever coherently *detected* on that picture, and Nyāya's insistence that invalidity is also extrinsic starts to look like the more honest half of the view.

  A friend said this is just the Agrippan regress wearing Indian names and the answer is reliabilism: S can be reliable without the subject ever establishing that it is, and that's all knowledge requires. That feels close, because it makes me suspect (3) is where I smuggled in an epistemic demand — the subject must have checked — inside a premise that sounds like it's only about what *makes* a cognition valid. But if that's the fix, I don't see what the Nyāya versus Mīmāṃsā fight was even about in the first place, since on that reading everyone should just be an externalist and go home.

  So: which step do you reject, and what does rejecting it cost you? If I have to choose I'd much rather keep (1) and (7) than (3), but I can't see how to drop (3) without letting a stopped clock count as a pramāṇa whenever it happens to be right. Say which premise looked fine and why, and what I'm paying if I give it up.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're in a reading group on classical Indian epistemology, specifically Nyāya versus Mīmāṃsā on the source of a cognition's validity. The user presented an argument that leads to an infinite regress, making knowledge impossible. They can't find where the argument breaks, and the escapes offered don't satisfy them. 

  First, I need to parse their argument step by step. Premise (1) states that for a cognition to be knowledge, the source must be reliable, not just producing a true belief. Nyāya agrees with this in premise (2). Then (3) claims that the subject must establish the source's excellence, leading to (4) and (5) where each source requires another, causing infinite regress. Step (6) extends this to perception, and (7) concludes that since we do know things, the argument must be flawed.

  The user mentions two escapes: one based on doubt and successful action, which they reject because it makes knowledge depend on temperament. The other is adopting Mīmāṃsā's intrinsic validity, but that makes error detection problematic. Their friend suggested reliabilism, but the user worries that this undermines the Nyāya-Mīmāṃsā debate.

  Now, where's the flaw? The key is premise (3). The user interprets "established" as requiring the subject to actively certify the source. But Nyāya might not require this. Instead, reliability could be external. The regress starts only if every cognition needs explicit certification by the subject. But Nyāya likely separates the metaphysical condition (source's excellence) from the epistemic one (subject's justification). 

  The user is conflating ontology with epistemology. The source's excellence (guṇa) is what makes the cognition valid, but the subject doesn't need to know this for the cognition to be knowledge. So, a stopped clock isn't a pramāṇa because it lacks the excellence, even if it's right sometimes. The subject doesn't need to verify this; it's a fact about the source.

  Rejecting (3) doesn't mean accepting lucky guesses as knowledge. The Nyāya framework requires the source to actually be reliable, not that the subject confirms it. This aligns with externalist reliabilism. The debate with Mīmāṃsā remains because Mīmāṃsā claims validity is intrinsic, needing no external source, while Nyāya insists on the external source's role, regardless of the subject's awareness.

  The user's concern about the stopped clock is addressed by distinguishing between accidental truth and genuine knowledge. The clock lacks the causal excellence, so even when correct, it's not a pramāṇa. The subject doesn't need to check; the reliability is objective.

  So, the cost of rejecting (3) is adopting externalism, which might feel counterintuitive if we think knowledge requires internal justification. But this preserves Nyāya's extrinsic validity without regress. The Nyāya-Mīmāṃsā debate continues as it's about the nature of validity itself, not the subject's access to it.
answer: |-
  Here's the break in your argument: **Premise (3) is a misinterpretation of Nyāya's extrinsic validity (parataḥ prāmāṇya)**. Let's dissect this step-by-step, preserving Nyāya's core commitments while avoiding the regress:

  ### The Flaw: Conflating Ontology with Epistemology
  - **Nyāya's Claim (Ontological):** What *makes* a cognition valid (its *prāmāṇya*) is an extrinsic property: the actual excellence (*guṇa*) in its causal source (*pramāṇa*). Validity is a *property conferred by a reliable causal process*.
  - **Your Premise (3) (Epistemological):** For a cognition to *count as knowledge*, the subject (or someone) must *establish* or *certify* the excellence of the source *before* accepting the cognition.
  - **The Misstep:** Premise (3) smuggles in an *epistemic demand* (the subject must *know about* or *justify* the source's excellence) where Nyāya only makes an *ontological claim* (the source *must actually be* excellent). Nyāya does *not* require the subject to *cognize* or *establish* the source's excellence for the cognition to *be* valid knowledge.

  ### Nyāya's Actual View (Reliabilism *avant la lettre*)
  1.  **Validity is Extrinsic but Externalist:** A cognition is valid *because* it was produced by a source (e.g., eyes, inference, testimony) that is *in fact* excellent/reliable (*guṇavat pramāṇa*) in those circumstances. This is a fact about the world and the causal process.
  2.  **No Requirement for Source-Certification:** The subject *does not need to know, prove, or even consider* the reliability of the source *for the cognition to be valid knowledge*. The validity stems from the *actual causal history*, not the subject's awareness of it.
  3.  **How We *Discover* Validity/Invalidity:** Nyāya agrees we often *learn* whether a source is reliable or not via other *pramāṇas* (e.g., inferring eye-health from successful action, discovering a liar through contrary testimony). This *discovery* process *can* involve inference and potentially regress *if demanded*, but crucially:
      -   This discovery is about *identifying* validity/invalidity *post hoc* or *when doubt arises*.
      -   **It is NOT what *constitutes* validity.** Validity is already constituted by the causal excellence present at the moment of cognition.
  4.  **The Stopped Clock/Objection:** A stopped clock giving the right time *is not* a *pramāṇa*. It lacks the essential *guṇa* (excellence/reliability) of a genuine time-telling instrument. Its cognition might be *accidentally true*, but it is **not** *pramā* (knowledge) because it wasn't produced by a reliable source (*guṇavat pramāṇa*). Nyāya *does* preserve the distinction between knowledge and lucky guess precisely via the ontological requirement of source reliability, *without* requiring the subject to verify it first.

  ### Resolving the Regress (Anavasthā)
  -   **The Regress Only Arises if Premise (3) is Accepted:** If you demand that *every* cognition requires *prior certification* of its source's reliability (via another cognition whose source needs certification...), you get the infinite regress. Nyāya rejects this demand.
  -   **The Regress Stopper:** The actual, intrinsic excellence (*guṇa*) of a properly functioning source (e.g., healthy eyes under good light, a valid inference based on a true pervasion, a truthful speaker) is what *makes* the resulting cognition valid. This excellence is a *fact*, not something that itself needs *cognitive certification* to play its constitutive role. The chain stops at the *actual reliability* of the source operating in suitable conditions.
  -   **Perception as the Foundation:** Nyāya treats perception (*pratyakṣa*) as foundational *not* because its validity is self-certifying, but because:
      -   It's the most basic, non-conceptual interaction with the world.
      -   Its reliability stems from the proper functioning of the sense organs and mind (*manas*) in contact with the object under suitable conditions – an ontological fact.
      -   We *can* doubt perception and *then* investigate (e.g., "Is this water or a mirage?"), using inference/testimony to *discover* if the source was defective. But when the sense organs *are* functioning properly (*guṇavat*), the perception *is* valid *pramā* without needing prior certification.

  ### What About the "Escapes"?
  -   **Escape One (Doubt & Action):** This is *partially* right but often misstated. Nyāya does emphasize that *in the absence of specific doubt*, cognitions are *provisionally* accepted and their validity is *corroborated* by successful action (*pravṛttisāmarthya*). This is how we *discover* validity in practice and build trust in sources. It's *not* that validity is *constituted* by lack of doubt or successful action; it's *constituted* by the source's excellence. Successful action is empirical *evidence* of that excellence/validity, used when needed. It avoids the "temperament" problem by grounding provisional acceptance in the *actual* track record of the source/cognition-type in guiding action, not mere confidence.
  -   **Escape Two (Go Mīmāṃsā):** You're right that this avoids the regress but creates the error-detection problem (the *khyāti* debates). Nyāya's insistence that *both* validity *and* invalidity are extrinsic avoids this. Invalidity is also caused extrinsically – by a *doṣa* (defect) in the causal source (e.g., dim light, faulty reasoning, deception). We *discover* invalidity via other *pramāṇas* revealing this defect or the falsity of the cognition.

  ### Why the Nyāya-Mīmāṃsā Debate Still Matters (Even with Externalism)
  -   **The Core Dispute:** It's fundamentally about the *nature* of validity (*prāmāṇya*).
      -   **Mīmāṃsā (svataḥ):** Validity is intrinsic to *every* cognition. It's the *default state*. Only invalidity needs an extrinsic explanation (a *doṣa*).
      -   **Nyāya (parataḥ):** Validity is *never* intrinsic. It is *always* conferred extrinsically by the excellence (*guṇa*) of the source. Invalidation is *also* extrinsic, caused by a defect (*doṣa*).
  -   **Externalism Doesn't Resolve This:** Both schools could be seen as having externalist *elements* (reliability matters for Nyāya; the absence of defects matters for Mīmāṃsā). But the core metaphysical disagreement about where validity *comes from* – is it baked into cognition itself, or is it bestowed by the causal process? – remains significant. Nyāya's extrinsic view makes validity inherently relational and dependent on the world-source interaction, while Mīmāṃsā's intrinsic view makes it a property of the mental state itself, defeasible only by external counter-evidence. This shapes their entire epistemology, theories of error, and even views on language and scripture.

  ### The Cost of Rejecting Premise (3)
  -   **What You Give Up:** The intuitively appealing idea that for me to *truly know* something, I must *have grounds* (accessible to me) to trust the source that delivered the cognition. You embrace **epistemic externalism**.
  -   **What You Keep:**
      -   **(1)** & **(2):** The crucial distinction between a true belief and knowledge based on reliable sources. A stopped clock isn't knowledge.
      -   **(7):** The possibility of genuine knowledge (including perceptual knowledge) without demanding impossible justificatory chains.
      -   Nyāya's core ontological commitment: Validity (*prāmāṇya*) is a property conferred by an excellent causal source (*guṇavat pramāṇa*).
  -   **The Payoff:** A coherent, non-regressive account of knowledge that preserves the distinction between *pramā* and lucky guesses, explains error via source defects (*doṣa*), and aligns with Nyāya's foundational texts and emphasis on successful action as the test (*but not the source*) of validity.

  **Conclusion:** Your argument is powerful, but it hinges on premise (3), which imposes an internalist, justificatory demand ("the excellence of S has to be established") onto Nyāya's fundamentally externalist, ontological theory of validity. Rejecting (3) means accepting that knowledge can arise from a *factually* reliable source without the subject needing to *justify* that reliability beforehand. This preserves Nyāya's core insights while avoiding the crippling regress. The Nyāya-Mīmāṃsā debate remains vital as a disagreement about the fundamental metaphysics of cognitive validity itself.
