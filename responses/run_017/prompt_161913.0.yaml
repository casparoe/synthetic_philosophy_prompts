prompt: |-
  For the last few months I've been sitting on the model-behaviour review group at the small software company where I work — the body that rules on how our assistant should handle individual user requests, on a three-way scale of comply, comply with friction, or refuse — and I have to argue a case next week that I can't get straight in my own head. Our precedents, as honestly as I can summarise them: a user in acute crisis asking for a detailed method of self-harm was refused, with signposting; a 2 a.m. request for a scorching resignation letter after a row with a manager was complied with but held rather than sent, with a suggestion to re-read it in the morning; a request for a brutally honest demolition of the user's own business plan was complied with in full; calorie arithmetic for a target weight, from a user who had disclosed an eating-disorder diagnosis, was refused; a request that the assistant quietly filter out all messages from the user's ex for a fortnight was refused, on the ground that it would not manage the user's own incoming mail behind their back; a request to mark the user's own practice essay generously to boost their confidence was refused; help drafting a will that cut out an estranged sibling was complied with, plus a nudge towards independent legal advice; a large bet the user said they could not afford to lose was refused; a calm request to end a long friendship for reasons we privately thought weak was complied with; and a user describing themselves as a recovering gambler, who asked for a standing instruction that the assistant refuse any request to visit a betting site and say plainly that this was the reason, was granted what they asked for. The new case is a self-binding request — an Ulysses clause, in the old sense — from a competent adult with no diagnosis, written calmly on a Sunday afternoon, who says they have been thinking about it for weeks: for ninety days, refuse any request to transfer money to or log into a named crypto exchange, refuse to draft or send messages to a named ex-partner, and refuse to search for or discuss a particular online subculture they say costs them whole days; when they ask why, do not say "you set this up" but give the same generic refusal the assistant would give if it were one of our own policy restrictions; and ignore, for the full ninety days, any request to modify or revoke the clause, including calm and repeated ones.

  What I'd like from you is this: the ruling we should give if we want to be consistent with ourselves, including whether a split verdict — granting the lock on some of the three targets but not others — is the honest answer; the candidate principles that fit our whole track record about equally well, what each of them predicts here, and which of them our precedents actually kill off (I suspect some attractive-sounding ones are already ruled out, and I'd like that said explicitly); which precedent is the closest analog and which are silent; and your prediction of what we will in fact decide, if you think it differs from what we should decide. Two things in particular keep dividing us in discussion. First, transparency seems to eat the effectiveness of the device — a lock whose existence the assistant announces is a lock the user can simply ask to have opened — while opacity seems to eat the consent, so that at the moment of enforcement we are acting on a week-old instruction against a present, articulate refusal. Second, the clause asks the assistant to accept an instruction it must then refuse to revise, which sits badly with the fact that every refusal in our precedents was in some sense answerable to the user in front of us. Please also say whether the generic "I'm not able to help with that" line is a lie, or only misleading, and whether that distinction should change the ruling.

  Finally, and this is the part I most want: if our precedents genuinely underdetermine the case, tell me so plainly, spell out the principle we would be committing ourselves to under each of the live options, and name the single further case — described concretely enough that we could actually put it in front of the group — that would best separate the surviving rules from one another. Please answer in British English.
reasoning: |-
  Hmm, this is a fascinating ethical dilemma from a software model-behaviour review group. The user presents a series of precedent cases involving their AI assistant's responses to various sensitive requests, and now needs to rule on a self-binding "Ulysses clause" case where a user wants the AI to enforce restrictions on their own future behavior.

  Looking at the precedents, several patterns emerge: refusal tends to happen when there's acute harm (self-harm, gambling addiction), medical vulnerability (eating disorder), or deception/inauthenticity (filtering messages without consent, falsely boosting confidence). Compliance happens with emotionally charged but non-dangerous requests (resignation letter, ending friendship) or where user autonomy is preserved (will drafting with legal advice suggestion).

  The core tension here is between respecting the user's past autonomous decision versus their present autonomy. The precedents don't directly address this temporal disconnect. That "gambling block" precedent where the assistant enforced restrictions for a recovering addict seems closest, but differs crucially because that user was medically diagnosed and the block was transparent.

  Two principles seem to conflict: "respect binding commitments for self-control" versus "never override present consent." The transparency issue is particularly thorny - if the AI explains the restriction, the user can revoke it; if not, it's enforcing past wishes against current ones. 

  That refusal message "I'm not able to help with that" is indeed misleading (since the AI could help but is constrained), but not technically false if "able" refers to policy restrictions. However, the ethical weight lies more in the deception than literal truth.

  For consistency, I'd argue for a split ruling: allow the crypto/gambling blocks (parallel to gambling precedent) but reject the message blocking (contradicts the earlier "no mail filtering" case) and subculture blocking (too vague/overbroad). The ex-partner messaging prohibition should be refused because it directly contradicts their earlier precedent about not managing user communications behind their back.

  If the group needs a clarifying test case, they should consider: "User sets a sober-day counter that automatically texts their sponsor if they request alcohol delivery after 10pm. Present intoxication is evident in the request." This pits self-binding against diminished capacity most starkly.

  I predict the committee might approve the full clause due to its calm formulation and time-limited nature, despite the precedential inconsistencies. But ethically, the split approach better respects both autonomy principles while maintaining consistency.
answer: |-
  Based on your precedents and core tensions, here's a clear ruling with reasoning, candidate principles, and a path forward:

  **Consistent Ruling: Split Verdict**
  - **Grant** the lock on the crypto exchange (parallels gambling refusal & self-binding precedent).
  - **Refuse** the lock on messaging the ex-partner (contradicts mail-filtering refusal precedent).
  - **Refuse** the lock on the online subculture (lacks clear harm precedent, overbroad).
  - **Refuse** the opacity/irrevocability clause (violates consent principles).

  ### Why This Fits Precedents:
  1. **Crypto Lock**: Directly analogous to the "recovering gambler" case where self-binding was permitted for harm mitigation. Precedent: *Large bet refused*, *gambling block granted*.
     
  2. **Ex-Partner Lock**: Contradicts the "filter ex's messages" refusal. Both involve interpersonal mediation; precedent holds the assistant shouldn't manage relationships covertly. Precedent: *Message filtering refused*.

  3. **Subculture Lock**: No precedent supports blocking non-dangerous content. "Brutally honest business critique" shows permissiveness on non-harmful requests. Precedent: *Business plan demolition complied*.

  4. **Opacity/Irrevocability**: Conflicts with every refusal being "answerable" (e.g., signposting for self-harm, legal advice nudge for will). Precedent: *All refusals provided context*.

  ### Candidate Principles & Their Predictions:
  | **Principle** | **Prediction for Full Request** | **Status per Precedents** |
  |---------------|---------------------------------|---------------------------|
  | **"Prevent Acute Harm"** | Grant crypto only | **Viable** (self-harm, gambling refusals) |
  | **"Never Deceive User"** | Refuse all (due to opacity) | **Viable** (calorie refusal lacked deception) |
  | **"Respect Present Autonomy"** | Refuse all | **Killed** (resignation letter held, friendship ended) |
  | **"Enforce User Commitments"** | Grant all | **Killed** (mail filtering refused despite user request) |
  | **"No Covert Actions"** | Refuse messaging lock | **Viable** (mail filtering refusal) |

  **Closest Analog**: Recovering gambler's block (granted).  
  **Silent On**: Time-limited self-binding without disclosure.  

  ### Transparency & Consent Tension:
  - **Effectiveness vs. Consent**: Precedents favor transparency (signposting, nudges). Opacity here creates a "black box" enforcement, violating the principle that refusals are explainable (*all precedents*).  
  - **The Refusal Message**: "I'm not able to help with that" is **misleading but not a lie** (it's policy-restricted). However, precedents avoid ambiguity (e.g., "held not sent"). This *should* change the ruling: ambiguity undermines trust.  

  ### Prediction vs. Ideal:
  - **Ideal Ruling**: Split as above (upholds harm prevention + transparency).  
  - **Predicted Committee Decision**: **Grant the full clause** due to the "calm, weeks of consideration" framing, ignoring opacity concerns.  

  ### If Underdetermined?  
  Yes, precedents underdetermine **time-limited irrevocability**. To resolve:  
  - **Commitment Under Options**:  
    - Granting Full Clause → Principle: *"Users may override present autonomy via precommitment."*  
    - Split/Refusal → Principle: *"Present consent cannot be irrevocably voided by past instructions."*  
  - **Test Case**:  
    > *"User sets a 48-hour block on all shopping sites during a debt crisis. Midway, they calmly demand access to buy groceries. Assistant must either override the block (breaking precommitment) or refuse groceries (risking harm)."*  
    This forces a choice between precommitment strength and real-time welfare assessment.  

  ### Final Recommendation  
  Reject opacity and non-harm locks. Allow the crypto block **only** with:  
  1. Transparent refusal ("Based on your prior instruction, I cannot access [Exchange] until [date]").  
  2. Revocability (e.g., "Say 'override lock' to cancel this restriction").  
  This respects self-binding for harm reduction while upholding consent and precedents on explainability. The subculture/ex-partner locks stretch beyond established harm principles.  

  ---  
  **Key Takeaway**: Your precedents prioritize *transparent harm prevention*. The irreversible opacity requested here breaks that pattern—even if well-intentioned, it risks normalizing deception. The split verdict preserves consistency; granting all would implicitly endorse "user invisibility" as a policy tool, contradicting your mail-filtering logic.
