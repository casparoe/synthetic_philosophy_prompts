prompt: |-
  I do a fortnightly column on the science and ethics of food, and I'm drowning in pitches. Roughly three or four times a week some advocacy group or certification scheme sends me a claim about which way of eating is easier on wild animals: grazing is fine because it's just grass, chicken is worse because it's really soy in disguise, crop farming kills field animals by the billion so maybe beef is the humane option after all, and so on. Some of these are clearly rigged, but others feel like they turn on something real that I can't quite put my finger on, and right now I just squint at each one separately, which is getting embarrassing. You're an expert in animal welfare science and environmental ethics: please think carefully about this before writing, brainstorm a bit out loud first about what the underlying structure of these claims even is, and then do the translating work. Don't send me citations or a reading list — I can't check them at the desk and my editor will cut them anyway — I want the reasoning itself.

  Here's the pile of half-formed distinctions I've been carrying around, which you should feel free to reorganize, rename, or throw out. First, the denominator keeps getting swapped: per kilogram of meat, per gram of protein, per calorie, per meal on a plate — and because a chicken is small and mostly grain-fed while a cow is big and partly grass-fed, the beef-versus-chicken ordering seems to flip depending on which of these you pick. Second, there's what I've started calling the replacement question: the claim's numbers always depend on an assumption about what the land, and the animals on it, would otherwise be doing — does the pasture revert to scrub, get ploughed for crops, or just carry someone else's herd. Third, the subtraction problem: most of the wild animals on that land would have died anyway, of cold, hunger, or predation, and if their populations are limited by something density-dependent then a death now partly cancels out deaths later, so the honest net effect might be much smaller than the raw body count suggests. Fourth, there's the currency problem of comparing a cow to a mouse to an insect killed by pesticide or by a plough share, which involves both how much suffering we're talking about per animal and how confident we should be that the smaller creatures feel anything at all. I need this as a procedure I can actually run: the questions in order, what counts as an answer good enough to move on from each one, where the procedure just stops and says no verdict available, and where it has to hand the decision back to me because it's a values call and not a factual one. I've got about twenty minutes per pitch, no access to paywalled agricultural datasets, and my editor wants a one-sentence verdict with an honest hedge attached, not a 900-word essay.

  Then run it on three things so I can see it working. One: a press kit for a pasture-raised chicken certification arguing that their birds are better for wild animals than beef, since the birds forage on land that stays grassland. Two: an NGO graphic claiming that if everyone who eats beef switched to chicken, some large number of wild animal deaths per person per year would be avoided. Three, and this is the one I'm nervous about: my own recurring line that grass-fed beef is the closest thing to a wild-animal-friendly meat, which I've written in at least three columns and sort of hope survives. I'd especially like the procedure to tell me something I don't want to hear in at least one of these, and I want you to be blunt about what the procedure cannot do — where it will misfire, which inputs will always be guesswork at my level of access, and how I'm supposed to phrase that in print without either pretending to a precision I don't have or sliding into saying every diet is equally fine.
reasoning: |-
  Okay, let me unpack this complex request step by step. The user is a science/ethics food columnist drowning in contradictory claims about animal welfare impacts of different foods. They need a practical framework to evaluate these pitches efficiently, with clear limitations acknowledged. 

  First, I notice the user's frustration with shifting metrics and hidden assumptions in these claims. Their "half-formed distinctions" show impressive grasp of core issues: denominator problems (per what?), counterfactual land use, population ecology effects, and sentience weighting. These are exactly the pain points in welfare comparisons. 

  The real challenge is designing a fail-safe procedure that:
  - Works in 20-minute desk checks
  - Doesn't require academic databases
  - Outputs hedgeable one-liners
  While handling:
  - Metric manipulation
  - Unknowable counterfactuals
  - Sentience uncertainty

  I recall that welfare assessments always involve:
  1. Functional unit selection (their "denominator")
  2. System boundary definition (their "replacement question")
  3. Attribution methods (their "subtraction problem")
  4. Sentience weighting (their "currency problem")

  But standard LCA approaches fail here because:
  - Wild animal deaths aren't tracked like carbon
  - Sentience coefficients don't exist
  - Counterfactuals are speculative

  So I need to build something more like a decision tree with:
  - Forced transparency about assumptions
  - Explicit uncertainty thresholds
  - Value call handoff points

  For the denominator issue: The key is forcing consistency. If a claim compares beef to chicken, they must use the same unit (e.g. per 100g protein). If they switch units, that's a red flag. 

  For replacement scenarios: I'll categorize land use alternatives into tractable types (rewilding, crops, etc.) with clear heuristics about which are knowable. Pasture-to-cropland conversions have data; pasture-to-unknown is unworkable.

  For population ecology: This is where most claims cheat. The rule must be: If they don't account for compensatory mortality, the number is useless. But since columnists can't run population models, we'll need a "discount factor" rule of thumb based on animal type.

  For sentience: We'll use a precautionary principle ladder: Insects → small mammals → large mammals with clear disclosure when comparisons cross rungs.

  The procedure should fail fast when:
  - Counterfactuals are unspecified
  - Cross-species comparisons lack sentience disclaimers
  - Compensatory mortality is ignored

  Now testing on their three cases:

  For the pasture-raised chicken claim: The fatal flaw is the unexamined counterfactual. What would that grassland otherwise be? Also they're comparing to beef without specifying the beef system. Procedure should flag this as incomplete.

  For the NGO chicken-vs-beef switch: The big miss is ignoring that most chicken feed comes from cropland expansion. Their "avoided deaths" assume freed cattle pasture just sits empty, which is unrealistic. Procedure catches this by demanding land use scenarios.

  For their own grass-fed beef claim: Awkward truth - well-managed pasture might support more biodiversity than cropland, but "friendly" is misleading because the cattle still displace native herbivores. Procedure forces acknowledgment that even benign farming isn't neutral.

  Biggest limitations:
  - Land use counterfactuals will always be speculative
  - Small animal sentience can't be resolved scientifically
  - Compensatory mortality estimates vary wildly
  Thus every verdict must include: "Depending on contested assumptions about..."

  Final output needs to balance honesty about uncertainty with actionable conclusions. Phrases like "current evidence suggests" or "if we accept the premise that" will be essential tools for their hedging.
answer: |-
  Below is a streamlined evaluation procedure based on your four core challenges. It prioritizes **identifying fatal flaws** in claims and **forcing transparency about assumptions** before any comparison can be made. The goal is a defensible "yes/no/maybe + hedge" verdict. 

  ### The 4-Step Verification Funnel
  **(Run steps in order; stop if a fatal flaw appears.)**

  1. **DENOMINATOR ALIGNMENT**  
     *Question: "Per what unit is impact measured, and is it the same for all compared systems?"*  
     - **Check:** Demand consistent functional units (e.g., per 100g protein, not per animal or per hectare).  
     - **Fatal Flaw:** Claim switches units mid-comparison (e.g., beef impacts per kg meat vs. chicken per gram protein).  
     - **Hedge If:** Units differ but claim adjusts fairly (e.g., converts both to per calorie). State: *"This assumes [unit] is the best measure of impact."*  
     - **Output:** Proceed only if units align or conversion is justified.

  2. **COUNTERFACTUAL CLARITY**  
     *Question: "What does the claim assume would happen to the land/wildlife *without* this farming system?"*  
     - **Check:** Identify the claimed alternative land use (e.g., "this pasture would be soy fields" vs. "would be wild forest").  
     - **Fatal Flow:** No counterfactual stated, or an implausible one (e.g., assumes freed-up land becomes untouched wilderness).  
     - **Hedge If:** Counterfactual is reasonable but uncertain. State: *"This hinges on land being used for [X] instead."*  
     - **Output:** Proceed only if counterfactual is explicit and plausible.

  3. **COMPENSATORY MORTALITY ADMISSION**  
     *Question: "Does the claim acknowledge that wild animal deaths may replace future deaths (not just add to total)?"*  
     - **Check:** Does it mention population dynamics (e.g., "deaths from harvesting may reduce starvation in winter")?  
     - **Fatal Flaw:** Uses raw death counts without context (e.g., "ploughing kills 1 billion mice").  
     - **Hedge If:** Raw counts are used but labeled as such. State: *"This ignores whether deaths reduce future mortality."*  
     - **Output:** Flag claims using raw counts as incomplete. Qualitative comparisons only.

  4. **SENTIENCE WEIGHTING DISCLOSURE**  
     *Question: "Does the claim openly state how it values different animals' suffering (or if it ignores it)?"*  
     - **Check:** Look for equivalence assumptions (e.g., "1 cow death = 100 mouse deaths?").  
     - **Fatal Flow:** Compares species without acknowledging weighting (e.g., compares insecticide deaths to mammal culling).  
     - **Hedge If:** Weighting is implied but not defended. State: *"This assumes all animal lives/suffering are equal."*  
     - **Output:** Cross-species comparisons require explicit weighting logic.

  ---

  ### Applying the Funnel to Your Three Cases
  **Case 1: Pasture-Raised Chicken Certification (vs. Beef)**  
  - *Step 1:* Likely **Flawed**. Compares chicken (per bird?) to beef (per cow?). No consistent unit (e.g., protein).  
  - *Step 2:* **Unclear counterfactual**. Assumes beef pasture ≠ chicken pasture. What if beef pasture reverts to forest?  
  - *Step 3/4:* Not reached.  
  **Verdict:** **Unverifiable** – Units mismatched and counterfactual speculative.  
  **Hedge:** *"This assumes pasture chickens use land that would otherwise support more impactful farming, but the comparison lacks consistent metrics."*  

  **Case 2: NGO's "Beef-to-Chicken Switch Saves Wild Animals"**  
  - *Step 1:* Check units (e.g., deaths per person/year). **Passes** if defined.  
  - *Step 2:* **Critical flaw**. Assumes land spared from beef becomes wilderness (unlikely; used for crops/other livestock).  
  - *Step 3:* **Flawed**. Uses raw death counts (e.g., "soy farming kills mice"). Ignores compensatory mortality.  
  - *Step 4:* **Flawed**. Compares mammal/field deaths without sentience weighting.  
  **Verdict:** **Misleading** – Unrealistic counterfactual and unadjusted death counts.  
  **Hedge:** *"This relies on freed beef land becoming wildlife habitat and counts all animal deaths equally, both highly contested assumptions."*  

  **Case 3: Your "Grass-Fed Beef is Wild-Animal-Friendly" Claim**  
  - *Step 1:* **Passes** if comparing meats per unit (e.g., per kg protein).  
  - *Step 2:* **Flawed**. Assumes grass-fed beef replaces intensive beef (not crops/wilderness). What if the land could rewild?  
  - *Step 3:* **Partial credit**. Grass systems *may* have lower seasonal deaths than cropping, but ignores displaced native herbivores.  
  - *Step 4:* **Flawed**. Values cattle over field mice/insects without justification.  
  **Verdict:** **Overstated** – Depends on counterfactual and ignores small animals.  
  **Hedge:** *"While grass-fed beef avoids crop deaths, it may still displace wild ecosystems and discounts small animal suffering."*  

  ---

  ### What the Procedure Can't Do (And How to Say It in Print)
  1. **Resolve unknowable counterfactuals**  
     - *Say:* *"This assumes [X] would happen to the land – other outcomes are possible."*  
  2. **Assign sentience weights scientifically**  
     - *Say:* *"We lack consensus on comparing suffering across species."*  
  3. **Account for regional variations** (e.g., Brazilian soy vs. Dutch tomatoes)  
     - *Say:* *"Impacts depend heavily on local ecology and farming practices."*  
  4. **Handle complex indirect effects** (e.g., methane → climate change → habitat loss)  
     - *Say:* *"Long-term/climate impacts are excluded here due to uncertainty."*  

  **When Stuck:** Use: *"Evidence is inconclusive because [missing denominator/counterfactual/etc.]. Until this is resolved, no diet can claim unambiguous superiority for wild animals."*  

  **Your Safety Net:** Always force claims to expose their assumptions. The funnel’s power is in making biases visible, not delivering perfect answers. Your recurring beef claim? It survives only as a *conditional* statement: *"If replacing feedlot beef on land unsuitable for rewilding, grass-fed *may* reduce field deaths – but not without ecological trade-offs."* That’s the precision this method offers: not truth, but honest context.
