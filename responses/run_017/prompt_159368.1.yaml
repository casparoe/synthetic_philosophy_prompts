prompt: |-
  I write novels — three out, literary crime stuff — and over the last couple of books I keep having to solve the same problem in scene after scene, and I don't have a word for it.

  Two examples. One: a surgeon realises she botched something on a patient years ago, nobody else knows, and she goes and tells him. But what actually moves her in that scene isn't "he deserves to know." It's "my old teacher would be ashamed of me" — and she picked that teacher deliberately, twenty years earlier, partly because she knew her own nerve would fail her someday. Two: a man who used to steal decides one night, cold sober, that if he ever feels the urge again he'll put it back, no deliberation, no exceptions. Eight months later he does put it back, and in the moment he isn't thinking about the person he took it from at all; he's just executing. My editor said the scene read as "mechanical." I think she has it exactly backwards.

  So here's the pattern I keep building. The thing that makes the action good seems to happen *earlier* — when she installed the disposition, or chose her company, or wrote the rule — and at the moment of action she's moved by something else entirely: habit, pride, what one particular person would think, the bare fact that she made a rule. And readers only give the character credit if I show them the earlier bit. Show only the moment and they read it as luck, or as coldness, or as "he's just like that." That's the part I most want explained: is the reader tracking something real, or just a convention of storytelling?

  People have pointed me at Kant supposedly holding that doing the right thing because you feel like it counts for less, at whatever Aristotle said about the person who does right while hating every minute of it, at taking moral advice from someone else instead of working it out, and at tricking your future self into behaving. None of those seem to be quite it: in my cases the earlier self isn't fighting off a later self who wants to do wrong, exactly; the later self isn't deferring to anybody's judgement about what's right; and it isn't simply that she enjoys doing it either.

  Is there an established concept for this — the good-making thing living at a different time than the action, or in a scaffold the agent herself built? And I don't want just a label, I want the carving: does it matter whether she foresaw this exact kind of case, or whether she built the scaffold for a rotten reason and it now keeps producing decent acts anyway, or whether the scaffold is a person rather than a rule, or whether the later self would have done the wrong thing without it — and if so whether the credit lands on the earlier self for something that hadn't happened yet. If there's no name for it, coin me one and tell me where its edges are, and what nearby thing I'd be confusing it with. American English please, and don't just hand me a list of papers to go chase down.
reasoning: |-
  Okay, the user writes literary crime novels and has a recurring theme where a character's moral action is driven by a decision made earlier—like installing a disposition or rule—rather than by immediate moral reasoning. For example, a surgeon confesses a mistake because her mentor would disapprove, not because the patient deserves to know. The editor called a similar scene "mechanical," but the user disagrees. They want to know if there's a concept for this "good-making thing" happening at a different time than the action and how to handle reader perception.

  First, I need to understand the core issue. The user is exploring how moral actions are motivated by prior structures (rules, role models, habits) rather than situational ethics. The reader only credits the character if the setup is shown earlier. The user wonders if this reflects a real psychological phenomenon or just a storytelling convention.

  Looking at philosophical concepts: Aristotle's hexis (stable dispositions) and Kant's duty vs. inclination come to mind, but they don't fully fit. The surgeon isn't acting from duty but from internalized shame. The thief follows a pre-set rule without deliberation. This seems closer to self-binding strategies like Ulysses pacts, where you pre-commit to avoid future weakness. The key difference is the motivation isn't overcoming temptation but automating virtue.

  Psychologically, this aligns with habit formation and metacognition. The surgeon chose a mentor to create a "moral prosthesis"—an external scaffold internalized over time. The thief's rule acts as a cognitive script. When the action occurs, it's automatic, but the moral weight comes from the initial setup. The reader needs to see that setup to assign credit because otherwise, the action seems arbitrary or robotic.

  The user also asks about nuances: foresight, rotten reasons, scaffolds as people vs. rules, and credit assignment. If the surgeon picked the mentor for selfish reasons but it now produces good acts, does she get credit? Probably yes, because the scaffold functions regardless of intent. Credit might land on the earlier self for creating a system that enables later virtue, even if unanticipated.

  For storytelling, the user should dramatize the scaffold-building moments to show character agency. Without that, actions lack context, appearing mechanical. The term "moral prosthesis" captures the idea of an external support enabling virtue. "Virtue scaffolding" or "precommitment to character" are alternatives. The key is showing the intentional design of these structures to avoid reader misinterpretation.

  The user’s deeper need might be validating their narrative technique as psychologically authentic, not just a convention. They want terms and frameworks to articulate this to editors and readers, ensuring the moral complexity isn’t lost. Emphasizing the active choice in building scaffolds can highlight character depth against accusations of mechanical behavior.
answer: |-
  You've hit on a profound and under-discussed aspect of moral psychology and character agency. What you're describing isn't just a storytelling convention; it points to a real psychological mechanism for navigating weakness of will and ensuring future moral action. The established concepts are close but don't quite capture the *specificity* of your pattern. Here's the carving:

  **The Core Concept: Moral Prosthesis / Virtue Scaffolding via Deliberate Precommitment**

  1.  **The Mechanism:** The character, acutely aware of their own potential for moral failure (cowardice, temptation, self-deception), **deliberately installs an external or internal structure** *before* the moment of crisis. This structure acts as a "prosthesis" for their potentially failing moral will or a "scaffold" supporting future virtue.
  2.  **The Trigger:** When the crisis moment arrives, the character *doesn't* engage in fresh moral deliberation. Instead, they **execute the pre-programmed action** triggered by the scaffold. The *immediate* motivation is fidelity to the scaffold itself (the rule, the imagined judgment, the habit), *not* the primary moral good of the act.
  3.  **The Credit:** The moral credit resides in the **foresight, self-knowledge, and deliberate construction** of the scaffold by the *earlier* self. The later self's action is the *realization* of that prior commitment. Showing the setup is crucial because *that's where the agency and moral effort lie*.

  **Why Existing Labels Don't Quite Fit:**

  *   **Aristotle's Hexis (Habit/State):** Close! Hexis is a stable disposition formed by repeated action. But your surgeon didn't *habitually* confess mistakes. She built a *specific trigger* (the mentor's imagined judgment) *in anticipation* of a specific failure. It's more targeted than general virtue-habituation.
  *   **Kant's Duty vs. Inclination:** Kant values action *from* duty, not *according* to it. Your thief acts *according* to a rule he set, but his later action isn't motivated by duty *per se*, but by adherence to his own prior command. It's self-legislated, but the immediate motive isn't duty's reverence.
  *   **Ulysses Pact (Precommitment):** **This is the closest neighbor.** Ulysses tied himself to the mast to resist the Sirens. Your characters are *precommitting*. The key difference? Ulysses precommits *against* a known, powerful *external* temptation. Your characters precommit *to* a specific *action* triggered by a specific *internal* state (realization of failure, urge to steal), often installing a *psychological* prosthesis (imagined judgment, inflexible rule) rather than a physical constraint.
  *   **External Moral Scaffolding:** People lean on rules, mentors, communities. But your surgeon *chose* her mentor *specifically* as a future conscience. Your thief *wrote his own rule*. It's **deliberate self-scaffolding**, not passive reliance.
  *   **Moral Luck/Just Like That:** This is how the reader sees it *without the setup*. But you're showing the *opposite*: it's not luck, it's engineered. It's not "just like that," it's *made* to be "just like that" through prior effort.

  **Carving the Joints: Where the Nuances Matter**

  1.  **Foresight vs. General Scaffolding:**
      *   **Specific Foresight (Surgeon):** She foresaw a *type* of failure (nerve failing) and installed a *specific* trigger (mentor's judgment). This feels like stronger, more intentional agency. Credit clearly lands on the earlier self's design.
      *   **General Scaffolding (Thief - slightly less specific):** He foresaw the *general* possibility of future urges and installed a *blanket rule* ("if urge, then put back"). Still strong agency, but the rule is more algorithmic. Credit still on the earlier self for the rule's creation and commitment.
      *   *Edge:* If the scaffold (e.g., a general upbringing) wasn't deliberately chosen *for this purpose*, credit shifts. The key is the *intentional design* to counter anticipated weakness.

  2.  **Rotten Reasons & Functional Scaffolds:**
      *   **Does it matter? Absolutely, for character depth.** If the surgeon picked the mentor *purely* out of ambition, yet the mentor's imagined disapproval *now* compels her to confess, the act is still *functionally* good. The *moral credit for the confession act* is complex.
          *   Credit for the *good outcome* might be accidental or a byproduct.
          *   Credit for *building a functional (if unintentional) moral prosthesis* is minimal or non-existent – she didn't build it *as* a prosthesis.
          *   *However*, her *using* the scaffold (even one built for rotten reasons) to do good *now* still involves a choice – she *could* ignore it. This *later* choice to *engage* the scaffold deserves *some* credit, though less than if she built it for the right reasons. The drama lies in this tension.

  3.  **Person vs. Rule Scaffolds:**
      *   **Person Scaffold (Mentor):** This leverages internalized *relational* bonds, shame, respect, identity ("I am the kind of person X would approve of"). It feels more holistic, tied to character identity. The trigger is emotional/social.
      *   **Rule Scaffold (Thief's "If-Then"):** This is more cognitive, algorithmic, deontic ("Because I said so"). It can feel colder or more mechanical (as your editor noted), *especially* if the reader doesn't see the prior struggle and commitment behind the rule.
      *   *Edge:* A rule scaffold *can* become deeply internalized and identity-forming over time. A person scaffold can feel rigid and rule-like. The core is the *function*, not the form.

  4.  **Would the Later Self Have Done Wrong Without It? & Credit Landing:**
      *   **This is crucial for justifying the scaffold's existence and assigning credit.** The *whole point* of building the prosthesis is the *anticipation* that the later self *would* fail without it.
      *   **Credit Landing:** The *primary* moral credit lands **squarely on the earlier self** for their **self-knowledge, foresight, and the difficult work of deliberate self-construction.** They invested the effort to overcome a predicted weakness. The later self gets credit **only for fidelity** – for *not overriding* the prosthesis. The later act is the *fruit* of the earlier labor. Without the scaffold, the later self likely fails; with it, they succeed *because* of the earlier self's work.

  **Why Readers Miss It (and Editors Call it "Mechanical") Without Setup:**

  *   **Hidden Agency:** The dramatic agency – the struggle, the choice – happened off-stage in the past. The on-stage action looks passive, automatic, or devoid of fresh moral reasoning.
  *   **Missing Motivation:** The *immediate* motive (follow the rule, avoid mentor's shame) seems insufficient, cold, or selfish compared to the primary moral good (patient's right to know, victim's property). The *real* moral motive (keeping a promise to one's *past self* to ensure the right thing happens) is invisible without context.
  *   **Algorithm vs. Choice:** Executing a pre-set rule *looks* algorithmic. Without seeing the human struggle and intention behind *setting* the rule, it reads as robotic.

  **The American English Label: Character Precommitment / Installed Conscience**

  *   **"Character Precommitment":** Emphasizes the core mechanism: committing one's *future character* to an action path. (Precommitment is established; adding "Character" specifies the *nature* of the constraint).
  *   **"Installed Conscience":** More evocative for your literary context. Highlights the deliberate act of placing an external/internal guide (mentor's judgment, rule) to function as a conscience when one's own might fail. It captures the "prosthesis" idea.

  **Nearby Confusions to Avoid:**

  1.  **Simple Habit:** Habits are automatic, but not necessarily *deliberately installed as a safeguard* against a specific predicted weakness. Brushing teeth is habit; your thief's rule is a pre-programmed moral failsafe.
  2.  **Deference to Authority:** The surgeon isn't deferring to the mentor *now*; the mentor's *internalized* judgment is triggering her. The thief isn't deferring to anyone. This is *self*-governance via prior design.
  3.  **Self-Deception/Trickery:** The earlier self isn't *tricking* the later self into good behavior against its will. It's creating a *support* for the later self's *own* (predicted to be weak) better judgment. The later self *accepts* the scaffold by not dismantling it.
  4.  **Moral Luck:** This is the *opposite* of luck. It's deliberate moral engineering.

  **The Takeaway for Your Writing:**

  You are portraying a sophisticated and realistic form of moral agency. **The "good-making thing" absolutely lives earlier, in the deliberate construction of the scaffold.** To make it land:

  1.  **Dramatize the Scaffold-Building:** Show the moment of self-doubt, the recognition of potential future failure, and the *active choice* to install the mentor as a conscience or write the ironclad rule. This is where the heroism/agency lies.
  2.  **Highlight the Self-Knowledge:** Emphasize the character's clear-eyed recognition of their *own* flaw that necessitates the prosthesis.
  3.  **Show the Fidelity:** In the moment of action, focus on the character's *recognition* of the trigger ("This is the moment. The rule applies." / "Dr. Evans would see me hiding this.") and their *choice* to yield to the scaffold they built. Even if it feels automatic, *showing* that flicker of recognition bridges the gap.
  4.  **Trust the Reader (a little):** Once you've shown the setup clearly, you don't need to belabor it every time the scaffold triggers. The reader who saw the installation will understand the deeper motive behind the "mechanical" or "prideful" action.

  Your editor saw the *action* without the *context of agency*. By showing the deliberate, effortful *construction* of the moral prosthesis, you transform "mechanical" execution into the triumphant payoff of prior character work. That’s powerful storytelling grounded in real psychology. Keep building those scaffolds.
