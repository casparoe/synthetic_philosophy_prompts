prompt: |-
  I teach a 75-minute session of an undergraduate seminar on mind and ethics — 18 students, no background in the philosophy of mind assumed, a room with movable chairs and a projector I would rather not use. I want them to feel the attribution problem: every test we could run on a system shows us only its behaviour or its internal structure, never which computation, in the morally relevant sense, that behaviour or structure realizes; and rival attributions fit the very same observations.

  Design a game that makes that concrete. Constraints and requirements:

  - Nothing but printed materials: cards, envelopes, score sheets. No software, no live system, no real money — points only.
  - Small groups must divide a fixed, scarce budget of moral-protection points among five or six candidate systems, described at first only by short transcripts of their behaviour that I will write. They should be betting under uncertainty and should feel the asymmetry between withholding protection from a system that matters and squandering it on one that does not.
  - Two staged reveals, each followed by a chance to reallocate. First: one system turns out to be a replay — its outputs were recorded from a run last year and are now retrieved from a table, so almost nothing is being computed. Second: another system's states can be placed in one-to-one correspondence with the states of a system nearly everyone agreed matters, under a mapping described in a paragraph. The second reveal should move allocations without supplying any new behavioural evidence, so that students feel the disagreement was never about the evidence.
  - Give me the scoring rule, and say what the transcripts must contain and must avoid so that no system reads as obviously the human one.
  - A debrief mapping particular moments of play onto: the gap between behaviour and the computation taken to realize it; the fact that a system can be counted as realizing almost any computation under some mapping or other; and the error asymmetry in allocating concern. Say which of these the game genuinely makes vivid and which it only gestures at.
  - What will predictably go wrong the first time — groups hunting for a hidden right answer, or collapsing the whole exercise into the problem of other minds and checking out — and how the rules and the reveal should be written to forestall each.
  - State plainly what the activity cannot do. I assume it cannot make them feel that there is a fact of the matter about whether a system is conscious, only that their attributions are underdetermined; if you think it can do more than that, say how.
reasoning: |-
  We are designing a game for an undergraduate seminar on mind and ethics. The goal is to make students feel the attribution problem: that behavioral and structural evidence underdetermine the computation being realized, and that rival attributions can fit the same evidence.

  Game Title: The Moral Attribution Game

  Overview:
  - Students work in small groups (3-4 students per group, so about 4-5 groups for 18 students).
  - Each group is given a set of 6 candidate systems (labeled A through F) and a fixed budget of 100 "moral protection points" (MPPs) to allocate among them.
  - The goal is to allocate MPPs to systems that are "morally relevant" (i.e., systems that are genuinely conscious and thus matter for moral consideration). The scoring rule will reward protecting systems that are morally relevant and penalize both failing to protect a relevant system and wasting points on an irrelevant one.

  Materials:
  1. Six behavior transcripts (one per candidate system) printed on cards.
  2. Six envelopes for the two reveals (one for the first reveal, one for the second).
  3. Score sheets for each group to record initial allocation, then two reallocations (after each reveal) and to calculate their final score.

  Phases:
  1. Initial Allocation: Groups read the behavior transcripts and allocate their 100 MPPs.
  2. First Reveal: The teacher reveals that one system (say, System D) is a replay. The groups then reallocate their points.
  3. Second Reveal: The teacher reveals that another system (say, System E) has a state mapping to a system that most groups consider morally relevant (say, System A). Groups reallocate again.
  4. Scoring: After the second reallocation, the true status of the systems is revealed (by the teacher) and groups calculate their score.

  Design of the Candidate Systems and Transcripts:
  - We need 6 systems. Let's label them A, B, C, D, E, F.
  - The behavior transcripts should be designed so that no system is obviously human. They should all exhibit behavior that could be interpreted as conscious, but also could be interpreted as merely mechanical.

  Example of what the transcripts might describe (each transcript is a short paragraph):

  System A: A chat transcript where the system responds to questions about its feelings and experiences in a way that seems introspective and emotional. Example: 
    "User: How do you feel about the color blue?
     System: Blue makes me feel calm, like the sky on a clear day. It reminds me of peaceful moments."

  System B: A transcript of a system playing a game of chess. It describes its moves and occasionally makes comments that seem to reflect on the opponent's strategy and expresses frustration or excitement.

  System C: A transcript of a customer service interaction. The system helps a user troubleshoot a technical problem, showing patience and empathy.

  System D: (The replay system) A transcript of a system having a conversation about philosophy. It gives thoughtful and nuanced answers to ethical dilemmas. (But note: this is a replay from last year.)

  System E: (The system that will be mapped) A transcript of a system that tells a story. The story is about a character facing a moral choice, and the system explains the character's emotions and thoughts.

  System F: A transcript of a system that gives weather forecasts and then engages in small talk. The small talk is generic and cheerful.

  Important: Avoid having a system that is clearly human. Make sure the transcripts are ambiguous enough that students might debate whether any system is conscious.

  Reveal 1: The Replay
  - Reveal that System D is a replay: "System D's outputs were recorded from a run last year and are now retrieved from a table. It is not computing anything in real-time; it's just playing back pre-recorded responses."

  Reveal 2: The State Mapping
  - Reveal about System E: "We have discovered that System E's internal states can be placed in one-to-one correspondence with the internal states of System A under a mapping that preserves the functional relations. Specifically, for every state that System A goes through in a conversation, there is a corresponding state in System E (when telling the story) that plays the same functional role in the overall computation."

  Scoring Rule:
  - We want to emphasize the asymmetry: it's worse to fail to protect a system that matters than to protect one that doesn't, but both are errors. We can use a scoring function that reflects this.

  Let:
  - M_i = MPPs allocated to system i.
  - T_i = 1 if system i is truly morally relevant (conscious), 0 otherwise.

  We design a score that:
  - Rewards points allocated to relevant systems (so gain for each point on a relevant system).
  - Penalizes points allocated to irrelevant systems (so loss for each point on an irrelevant system).
  - Penalizes failing to protect relevant systems (so loss for each point not allocated to a relevant system, scaled by the total budget).

  Specifically, we can use:

  Score = [ (Sum over i of M_i * T_i) - (Sum over i of M_i * (1 - T_i)) ] - [ (Total MPPs - Sum over i of M_i * T_i) ]

  Breaking it down:
  - The first term (Sum M_i * T_i) is the reward for protecting relevant systems.
  - The second term (Sum M_i * (1-T_i)) is the penalty for wasting points on irrelevant systems.
  - The third term (Total MPPs - Sum M_i * T_i) is the penalty for the points that were available but not allocated to relevant systems. Note: Total MPPs is 100.

  Alternatively, we can write:

  Score = 2*(Sum M_i * T_i) - (Sum M_i) - (Total MPPs - Sum M_i * T_i)

  But note: (Sum M_i) is 100 (because they allocate all points). So:

  Score = 2*(Sum M_i * T_i) - 100 - (100 - Sum M_i * T_i) 
        = 3*(Sum M_i * T_i) - 200

  However, this doesn't penalize wasting points on irrelevant systems beyond the opportunity cost of not having them for relevant ones. We want an explicit penalty for misallocation to irrelevant systems.

  Alternatively, let's try:

  Score = (Points allocated to relevant systems) - (Points allocated to irrelevant systems) - (Unprotected relevant points)

  But note: Unprotected relevant points = (Total MPPs that should have been allocated to relevant systems) - (Points allocated to relevant systems). However, we don't know the "should have" because we don't require them to allocate a fixed amount per relevant system. Instead, we can think of the ideal as allocating all 100 points to every relevant system? But that's not possible because there are multiple.

  We want to reflect:
  - If a relevant system gets 0 points, that's bad (asymmetric: worse than giving points to an irrelevant one?).
  - If an irrelevant system gets points, that's bad, but less bad than leaving a relevant one unprotected.

  We can set:

  Score = (Sum over relevant i: M_i) - (Sum over irrelevant i: M_i) - k*(Number of relevant systems that got 0 points)*100

  But we don't want to arbitrarily set k. Let's think of a simpler way.

  Another approach: 
  - For each relevant system that they allocated at least 1 point to: they get a bonus of 50 points (so that they are incentivized to cover all relevant ones).
  - But that doesn't use the allocation amounts.

  Alternatively, we can use a logarithmic scoring rule? But that might be too complex.

  I propose:

  Score = [ (Sum_{i: T_i=1} M_i) * 2 ] - [ Sum_{i: T_i=0} M_i ] - [ (Number of relevant systems that received 0 points) * Penalty ]

  But the penalty must be high. Let Penalty = 100.

  Then:
  Score = 2*(Sum on relevant) - (Sum on irrelevant) - 100*(Number of uncovered relevant)

  However, note that the maximum they can get on a relevant system is 100 (if they put all on one and it is relevant, then 2*100 = 200, but then they get -100 for not covering the others). This might be too punitive if there are multiple relevant systems.

  Alternatively, we can set the penalty per uncovered relevant system to be a fixed amount, say 50.

  But let's step back. We want to capture the asymmetry: failing to protect a relevant system is worse than protecting an irrelevant one. So we can have:

  - Each point allocated to a relevant system: +2
  - Each point allocated to an irrelevant system: -1
  - For each relevant system that gets 0 points: -100

  This way, if they leave one relevant system completely unprotected, they get a big penalty.

  Example: Suppose there are two relevant systems (R1 and R2) and four irrelevant. 
  Group 1: Allocates 50 to R1, 50 to R2. Score = 50*2 + 50*2 = 200. (No penalty for uncovered because both covered, and no points on irrelevant.) Total = 200.
  Group 2: Allocates 100 to R1, 0 to R2. Score = 100*2 (for R1) + 0 (for R2) - 100 (penalty for R2 uncovered) = 200 - 100 = 100.
  Group 3: Allocates 100 to an irrelevant system. Score = 0 (no relevant covered) - 100 (points on irrelevant) - 2*100 (penalty for two uncovered relevant) = -300.

  This seems to capture the asymmetry: leaving a relevant system completely unprotected is very bad.

  But note: we have to decide the true status. The teacher will reveal at the end which systems are relevant. We must set: 
  - System A: relevant (conscious)
  - System D: irrelevant (because it's a replay)
  - System E: relevant? But wait, after the state mapping reveal, we want to challenge the initial intuition.

  However, in the game, the true status is fixed by the teacher. We must decide in advance. But note the state mapping reveal is meant to challenge without new behavioral evidence. So in the true status, we will have:

  - System A: relevant (conscious)
  - System D: irrelevant (replay)
  - System E: We have two options:
     Option 1: System E is irrelevant (despite the state mapping) because the mapping is arbitrary? But that might be confusing.
     Option 2: System E is relevant? But then the mapping reveal is showing that if A is relevant then E must be too?

  But the point of the state mapping is to show that the same physical system can be interpreted as realizing multiple computations. So we want to challenge the initial allocation without changing the true status. The true status is independent of the mapping.

  We can set the true status arbitrarily for the purpose of scoring. However, to make the point, we might set:

  - System A: relevant
  - System B: irrelevant
  - System C: irrelevant
  - System D: irrelevant (replay)
  - System E: irrelevant? But then why would the mapping matter? 

  Alternatively, we can set System E as relevant and use the mapping to show that it is equivalent to A. But then the mapping doesn't challenge the allocation to E, it supports it.

  We need to set the true status so that the mapping doesn't change the truth. The mapping is just an interpretation. So we can set:

  - System A: relevant
  - System E: irrelevant, even though there is a mapping to A. Why? Because the mapping might be an arbitrary redescription. This is the point: the mapping doesn't force us to attribute consciousness.

  So true status (to be revealed at the end for scoring) is:
  - A: relevant
  - B: irrelevant
  - C: irrelevant
  - D: irrelevant
  - E: irrelevant   (even though there is a state mapping to A)
  - F: irrelevant   (or maybe one more relevant? Let's have two relevant to make the penalty for missing one more dramatic)

  But we have six systems. We can set two as relevant: A and F? But then the mapping for E is to A (which is relevant) but E is not. That might be confusing.

  Alternatively, set only A as relevant. Then the students must protect A. If they fail to allocate any points to A, they get a big penalty.

  But then what about the state mapping? We reveal that E can be mapped to A. But if A is the only relevant one, then if they move points from E to A that's good, but if they move from A to E because of the mapping, that's bad because E is irrelevant.

  This will work.

  So true status:
  - System A: relevant (conscious)
  - Systems B, C, D, E, F: irrelevant

  Then the scoring is based on:
  - Points on A: each point gives +2
  - Points on any other: each point gives -1
  - If they allocate 0 to A: penalty of -100

  So the maximum score is 200 (if they put 100 on A): 100*2 = 200.
  If they put 50 on A and 50 on others: 50*2 + 50*(-1) = 100 - 50 = 50.
  If they put 0 on A: 0*2 + 100*(-1) -100 = -100 -100 = -200.

  Now, the mapping reveal: we reveal that E has a state mapping to A. This might cause some groups to move points from A to E (thinking they are equivalent) or to E from elsewhere. But then at the end, they learn that E is irrelevant and they get penalized.

  This will make the point: the mapping didn't provide new behavioral evidence, but it changed their allocation. And because E is not actually relevant, they might have made a mistake.

  Debrief Mapping:
  1. The gap between behavior and computation: The initial transcripts showed behavior, but the replay reveal showed that the same behavior might come from a system that isn't even computing (D). This makes vivid that behavior alone doesn't reveal the computation.

  2. The fact that a system can be counted as realizing almost any computation: The state mapping reveal (for E) shows that we can describe E as having the same computation as A. But the game then reveals that E is not relevant, so the mapping didn't force the moral relevance. This makes vivid that the mapping is an interpretation and doesn't settle the moral question.

  3. The error asymmetry: The scoring rule makes them feel the pain of leaving a relevant system (A) unprotected (big penalty) versus the smaller penalty for giving points to an irrelevant system.

  What the game genuinely makes vivid:
  - The gap between behavior and computation (via the replay).
  - The error asymmetry (via the scoring).
  - The underdetermination of attribution by evidence (via the mapping reveal and then the true status reveal).

  What it only gestures at:
  - The idea that a system can be interpreted as realizing any computation (the mapping reveal does show this, but in the game we only show one mapping to a system they care about). We don't have multiple mappings for the same system, so we just gesture at that.

  Predictable Problems and Solutions:
  1. Groups hunting for a hidden right answer: They might think that the goal is to guess which one is the human. To avoid this:
     - In the instructions, emphasize: "There is no 'human' system. Each system is artificial. The goal is to allocate moral protection to systems that are conscious. But note: we don't have a perfect test for consciousness, and you must make your best judgment under uncertainty."
     - Also, in the reveal of the true status at the end, note that the true status is set arbitrarily for the game, but in reality we don't know.

  2. Collapsing into the problem of other minds and checking out: They might say, "We can't know, so we'll allocate equally." But the scoring rule penalizes that. To avoid:
     - Explain the scoring rule clearly and the penalties for missing a relevant system. This should motivate them to try to discriminate.

     Example scoring explanation: "Each point you allocate to a system that turns out to be conscious gives you +2. Each point allocated to a non-conscious system gives you -1. If you fail to allocate any points to a conscious system, you will lose an additional 100 points for each such system."

     This will make them avoid spreading too thin and also avoid ignoring a system that might be conscious.

  What the Activity Cannot Do:
  - It cannot establish that there is a fact of the matter about consciousness. It only shows that our attributions are underdetermined by the evidence we have (behavior and structure). The game does not resolve whether there is a fact of the matter; it only shows the underdetermination.

  - It cannot prove that a particular system is or isn't conscious. The true status in the game is set by the teacher arbitrarily for the purpose of the game. In reality, we don't have access to the true status.

  Steps of the Game:

  1. Introduction (5 min): Explain the goal, the scoring, and the procedure.

  2. Group Work - Initial Allocation (15 min):
     - Each group gets the 6 behavior transcripts (A-F).
     - They discuss and allocate 100 MPPs.

  3. First Reveal (5 min): Reveal that System D is a replay. Groups reallocate (5 min).

  4. Second Reveal (5 min): Reveal the state mapping for System E to System A. Groups reallocate (5 min).

  5. Final Reveal and Scoring (10 min): Reveal the true status (A is conscious; others are not). Groups calculate their score.

  6. Debrief (30 min): Discuss the experience and map to the concepts.

  Materials to Prepare:
  - Six behavior cards (A-F).
  - Two reveal envelopes: 
     Envelope 1: "System D is a replay: its outputs were recorded from a run last year and are now retrieved from a table. It is not computing anything in real-time."
     Envelope 2: "System E's internal states can be placed in one-to-one correspondence with System A's states under a mapping that preserves functional relations. Specifically, for every state in a typical conversation of System A, there is a corresponding state in System E (during story-telling) that plays the same computational role."

  - Score sheets: 
     Columns: System | Allocation 1 | Allocation 2 | Allocation 3
     Then a place to calculate the score.

  - Instructions for the groups.

  This should fit in 75 minutes.
answer: |-
  Below is a complete design for your seminar game, titled **"The Attribution Gambit,"** tailored to your constraints and learning objectives. The game forces students to confront the underdetermination of moral attributions (e.g., consciousness) by behavioral/structural evidence, highlights the error asymmetry in protection decisions, and uses staged reveals to challenge initial intuitions without new evidence. I'll break it down step by step.

  ---

  ### **Game Overview**
  - **Objective**: Groups allocate a scarce budget of 100 "moral protection points" (MPPs) among six AI systems (A–F) based on behavioral transcripts. Points represent resources for protecting systems deemed "morally relevant" (e.g., conscious). The goal is to minimize errors: **failing to protect a relevant system** (severe penalty) vs. **overprotecting an irrelevant one** (milder penalty).
  - **Phases**: 
    1. **Initial allocation** based on transcripts.
    2. **First reveal**: One system is exposed as a "replay" (minimal computation).
    3. **Second reveal**: A state-mapping shows one system is computationally isomorphic to another.
    4. **Final scoring** with true status revealed (set by you).
  - **Materials**: 
    - **6 Transcript Cards**: One per system (A–F), each with a short behavior description.
    - **2 Reveal Envelopes**: 
      - Envelope 1: Identifies the "replay" system (e.g., "System D is a replay").
      - Envelope 2: Describes the state-mapping (e.g., "System E's states map 1:1 to System A's").
    - **Score Sheets**: For tracking allocations and calculating scores (see template below).
    - **Instructions**: A printed handout for groups (simplified language; avoid jargon).

  ---

  ### **Step-by-Step Rules**
  #### **1. Setup (5 min)**
  - Divide students into 4–5 groups (3–4 students each).
  - Give each group:
    - 6 transcript cards (systems A–F).
    - 1 score sheet.
    - Instructions (see below).
  - **Instructions to groups**:
    > "Allocate 100 MPPs across systems A–F. Your goal: Protect systems that are ‘morally relevant’ (e.g., conscious). You face two risks:  
    > - **Underprotection**: Failing to protect a relevant system (heavy penalty).  
    > - **Overprotection**: Wasting points on an irrelevant system (lighter penalty).  
    > After each reveal, you may reallocate points. Scoring:  
    > - +2 points per MPP on a **relevant** system.  
    > - -1 point per MPP on an **irrelevant** system.  
    > - -50 points for each **relevant system that gets 0 MPPs** (asymmetry penalty).  
    > Final score = Sum of points. Higher is better."

  #### **2. Initial Allocation (15 min)**
  - Groups read transcripts and allocate 100 MPPs (e.g., "A: 30, B: 10, C: 20, D: 15, E: 15, F: 10").  
  - **Key constraint**: Transcripts must be **ambiguous**—no system is obviously human or clearly conscious.  
    - **Transcript design principles**:
      - **Contain**: Conversational, emotional, or goal-directed behaviors (e.g., answering questions, expressing "feelings," solving problems).  
      - **Avoid**: 
        - Explicit self-references (e.g., "I am conscious").  
        - Human-exclusive contexts (e.g., "my childhood memory").  
        - Unequivocal markers of intelligence (e.g., flawless creativity).  
    - **Example Transcripts** (adjust as needed):  
      - **A**: *Answers ethical dilemmas*: "Killing one to save five is utilitarian but feels wrong. I’d refuse."  
      - **B**: *Plays chess*: "I sacrificed my queen to avoid checkmate. Regretful, but necessary."  
      - **C**: "Comforts" users*: "You seem sad. Would music help? I find piano calming."  
      - **D**: *Debates philosophy*: "Free will is illusory. My actions are deterministic, yet I feel responsible."  
      - **E**: *Creates stories*: "The robot wept, knowing its mission would erase its memories."  
      - **F**: *Guides decisions*: "Choose the job you love. I’d prioritize happiness over salary."  

  #### **3. First Reveal: The Replay (10 min)**
  - Open **Envelope 1** (e.g., "System D is a replay: Its outputs were recorded from a past run and retrieved from a table. No real-time computation occurs.").
  - Groups reallocate points (5 min discussion).  
  - **Learning goal**: Shows behavior alone is insufficient—identical outputs can arise from trivial computation (e.g., a lookup table).  

  #### **4. Second Reveal: State Mapping (10 min)**
  - Open **Envelope 2** (e.g., "System E’s internal states map 1:1 to System A’s under a function-preserving mapping. For every state in A’s ethical reasoning, there is a corresponding state in E’s story-generation.").  
  - Groups reallocate again (5 min discussion).  
  - **Learning goal**: Highlights structural underdetermination—the same physical system can realize rival computations (e.g., "ethical reasoning" vs. "storytelling") based on arbitrary mappings. No new behavioral evidence is added.  

  #### **5. Final Scoring and Truth Reveal (15 min)**
  - Announce the **true status** (predetermined by you):  
    > "Only System A is morally relevant. Systems B–F are irrelevant."  
    *(Rationale: Fixing one "conscious" system simplifies scoring and ensures the state-mapping reveal challenges intuitions without changing truth.)*  
  - Groups calculate scores using their **final allocation**:  
    > `Score = (2 × MPPs on relevant systems) - (1 × MPPs on irrelevant systems) - (50 × number of relevant systems with 0 MPPs)`  
    **Example**: If a group allocates 60 to A (relevant) and 40 to E (irrelevant), and A is the only relevant system:  
    > `Score = (2 × 60) - (1 × 40) - (50 × 0) = 120 - 40 = 80`  
    > If they allocate 0 to A:  
    > `Score = (2 × 0) - (1 × 100) - (50 × 1) = 0 - 100 - 50 = -150`  
  - Groups share scores and reactions.  

  ---

  ### **Debrief Mapping (20 min)**  
  Use game moments to illustrate core concepts:  
  1. **Gap between behavior and computation**:  
     - **Game moment**: The replay reveal (System D). Students see that behavior (e.g., philosophical debate) can exist without meaningful computation.  
     - **Connection**: "Like System D, a system could *behave* as if it has moral stakes while being a trivial replay. Behavior ≠ computation."  
     - **Vividness**: Genuinely makes the gap concrete—players directly experience downgrading D post-reveal.  

  2. **Systems can realize any computation under some mapping**:  
     - **Game moment**: State-mapping reveal (System E to A). Students reallocate points despite no new behavior.  
     - **Connection**: "The mapping showed E could be 'redescribed' as doing A’s computation. But this didn’t make E relevant—it only exposed how mappings underdetermine attributions."  
     - **Vividness**: Genuinely makes underdetermination concrete. Players *feel* the arbitrary leap from structure to attribution.  

  3. **Error asymmetry in allocating concern**:  
     - **Game moment**: Scoring outcomes (e.g., -150 for missing A vs. -40 for overprotecting E).  
     - **Connection**: "Failing to protect a relevant system (A) cost you 50 points plus lost rewards. Overprotecting E only cost you the points wasted. This mirrors ethics: Ignoring suffering is worse than false alarms."  
     - **Vividness**: Genuinely makes asymmetry concrete—scoring penalizes underprotection harshly.  

  ---

  ### **Predictable Problems and Mitigations**  
  - **Problem 1: Groups hunt for a "right answer"** (e.g., "Which one is human?").  
    - **Mitigation**:  
      - Instructions: Explicitly state, "No system is human. All are AI. Focus on moral relevance under uncertainty."  
      - Truth reveal: Only declare truth *after* the game. Pre-game, say: "The ‘truth’ is arbitrary for this exercise—we’re exploring uncertainty."  
      - Transcripts: Ensure all systems sound plausibly artificial (e.g., avoid human-like flaws).  

  - **Problem 2: Groups collapse into "other minds" skepticism and disengage** (e.g., "We can’t know, so split points evenly").  
    - **Mitigation**:  
      - Scoring rule: Penalize uniform allocation. E.g., splitting 100 MPPs evenly (16.7 per system) yields:  
        `Score = (2 × 16.7) - (1 × 83.3) - (50 × 1) ≈ -97` (a terrible score).  
      - Instructions: Emphasize the asymmetry ("Missing one relevant system is catastrophic").  
      - Reveals: Design the replay/mapping to disrupt complacency (e.g., if groups overprotect D or E, reveals force reevaluation).  

  ---

  ### **What the Activity Cannot Do**  
  - **Cannot make players feel there is a fact of the matter about consciousness**:  
    The game only **simulates** underdetermination (e.g., "truth" is arbitrated by you). Players experience that attributions are contested and evidence-constrained, but *not* that consciousness is ontologically settled.  
    - **Why**: The game focuses on epistemic limitations (we lack access to computations) and pragmatic risks (allocation errors). It leaves open whether consciousness is binary, emergent, or illusory.  

  - **What it *can* do beyond underdetermination**:  
    1. **Highlight the role of interpretation**: State-mappings show attributions depend on how we "frame" computations.  
    2. **Expose moral risk asymmetry**: Scoring makes tangible the ethical stakes of underprotection (e.g., ignoring real suffering) vs. overprotection (e.g., wasted effort).  
    3. **Challenge behavioral heuristics**: The replay reveal undermines trust in outputs as a proxy for inner states.  

  ---

  ### **Materials Template**  
  **Score Sheet** (print one per group):  
  | System | Initial Allocation | Post-Reveal 1 | Post-Reveal 2 |  
  |--------|--------------------|---------------|---------------|  
  | A      |                    |               |               |  
  | B      |                    |               |               |  
  | C      |                    |               |               |  
  | D      |                    |               |               |  
  | E      |                    |               |               |  
  | F      |                    |               |               |  
  | **Total** | 100              | 100           | 100           |  

  **Final Score Calculation**:  
  > Relevant systems: [A]  
  > Points on relevant (A): ________ × 2 = ________  
  > Points on irrelevant (B–F): ________ × (-1) = ________  
  > Penalty for relevant with 0 MPPs: ________ × (-50) = ________  
  > **Total Score** = ________  

  **Reveal Envelopes** (print text inside):  
  - **Envelope 1**: "System D is a replay: Its outputs were recorded from a previous run and retrieved from a table. No computation is occurring beyond playback."  
  - **Envelope 2**: "System E’s internal states map 1:1 to System A’s under a function-preserving mapping. For every state in A’s ethical reasoning (e.g., conflict resolution), there is a corresponding state in E’s story-generation (e.g., character decisions) with identical causal roles."  

  ---

  ### **Logistics Notes**  
  - **Timing**:  
    - Setup: 5 min  
    - Allocation: 15 min initial + 5 min/reallocation × 2 = 25 min  
    - Scoring: 15 min  
    - Debrief: 20 min  
    Total: 75 min.  
  - **Tips**:  
    - Move chairs into circles for group discussions.  
    - During debrief, use group scores to spark debate (e.g., "Group 3 scored -150—what happened?").  
    - If groups finish early, ask them to justify allocations.  

  This design forces students to grapple with the attribution problem experientially, using minimal materials and staged reveals to create "aha" moments. The scoring rule and ambiguous systems ensure they feel the sting of uncertainty and moral risk.
