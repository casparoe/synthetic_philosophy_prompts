        Dependence: independent -> no change.
        Context: irrelevant for Type C? -> factor 1.
        Score = 0.001 -> negligible.

    So for each, we do not enter as evidence for the generalization.

  Test Case 3: Nine thousand black-raven checklist records.

    Each record is Type A (raven and black).

    For one record:
        base = 1.
        Confidence: varies. Let's assume they are from various sources. Some are checklists with no details. We might assign confidence: if it's just a checklist without photo, then "Possible" (0.3). If with photo, then higher. But we don't know. We must take the worst? Or we can have an average? We are evaluating one record.

        For one typical record: assume no photo, just a checklist -> confidence "Possible" -> 0.3.
        Dependence: many of these are duplicates (same bird multiple times). So we must adjust: if the record is of the same individual and same time as a previous record, then weight=0. But we don't know. We have to assume that in the same checklist, multiple reports of the same species at the same location and time are duplicates. But over forty years, it's likely that many are independent.

        For one record: if we cannot prove dependence, we assume independent? Or we note that in open populations, it's hard to know. We might set dependence=0 only if we know it's duplicate. Otherwise, we leave it.

        So for one record: score = 1 * 0.3 * 1 = 0.3 -> weak positive evidence.

    But if we have 9000 such records, then the aggregate evidence is strong? But note: they are not all independent. Also, they are all Type A. They don't provide evidence about non-black ravens that might be present but not observed.

    The procedure for one record: weak positive. But the atlas currently uses them. However, the procedure says that each one individually is weak. We can enter them as weak positive evidence. But the accumulation might be done separately.

    However, note: the procedure does not aggregate. It only rates one record.

    The honest answer: each record is weak positive evidence (if independent and at least possible confidence). But if we have many, that adds up. But they don't address the possibility that non-black ravens exist but are not observed. So they are not as strong as one might think.

  Finally, what the procedure cannot do:

    1. It cannot aggregate multiple records (that requires a separate process).
    2. It cannot handle negative records (absence of X) for the generalization "all X are Y". We assign them 0 weight and leave them for distribution/abundance.
    3. It can only evaluate one generalization at a time. The same record may be evidence for multiple generalizations (e.g., distribution, population trend) but that is not covered.
    4. It relies on human judgments at several points (likeness_factor, context_factor, dependence, definitional issue). These are subjective.
