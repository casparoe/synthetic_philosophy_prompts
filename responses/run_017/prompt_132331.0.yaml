answer: |-
  Below is a practical decision procedure designed for your verification team. It's structured as a step-by-step checklist that can be completed in ~10 minutes per record, using only basic ratios and explicit judgment calls. It flags points where human discretion is required and avoids complex math. The output is an **evidential weight category** (None, Negligible, Weak, Moderate, Strong) for the generalization "all X are Y" (e.g., "all ravens are black"). Crucially, it handles your hard cases upfront.

  ---

  ### **Decision Procedure for Evidential Weight of a Record**  
  **Generalization:** "All X are Y" (e.g., "All ravens are black")  
  **Input:** A single submitted record (photo, observation, genetic data, etc.).  

  ---

  #### **Step 0: Definitional Check**  
  *(Prevents unfalsifiable generalizations)*  
  - **Question:** Is property Y part of the operational definition of X?  
    - *Example: If your field guide defines ravens as "all-black," then "black" (Y) is part of being a raven (X).*  
  - **Judgment:**  
    - **YES (Y is definitional):** Stop. This record **cannot support or challenge** the generalization. Assign weight: **None**.  
      - *Why? If non-Y X are impossible by definition, the generalization is tautological. Flag for committee review.*  
    - **NO (Y is not definitional):** Proceed to Step 1.  

  ---

  #### **Step 1: Classify Record Type**  
  *(Categorizes based on logical structure)*  
  - **Types:**  
    - **A:** X and Y (e.g., black raven).  
    - **B:** X and not Y (e.g., pale raven).  
    - **C:** not X and not Y (e.g., white shoe).  
    - **D:** not X and Y (e.g., black crow).  
  - **Judgment:** Assign type based on evidence. If contested, default to lower confidence (Step 2).  

  ---

  #### **Step 2: Adjust for Confidence**  
  *(Accounts for ID certainty and evidence quality)*  
  - **Confidence Levels (use lowest of X/Y ID):**  
    - **3 (Confirmed):** Specimen, DNA, or expert-verified photo.  
    - **2 (Probable):** Clear photo/video or experienced observer.  
    - **1 (Possible):** Distant sighting, poor photo, or contested ID.  
  - **Weight Multiplier:**  
    | Confidence | Multiplier |  
    |------------|------------|  
    | Confirmed  | 1.0        |  
    | Probable   | 0.7        |  
    | Possible   | 0.3        |  

  ---

  #### **Step 3: Assign Base Weight**  
  *(Uses type and context for initial score)*  
  - **Base Weights:**  
    | Type | Base Weight | Notes |  
    |------|-------------|-------|  
    | A    | 1.0         | Supports generalization. |  
    | B    | -100        | Challenges generalization (potential falsification). |  
    | C    | 0.01 × (Raven-Likeness) | Weak support (adjust for relevance). |  
    | D    | 0           | Neutral. |  
  - **Raven-Likeness (for Type C):**  
    - Score 0–10: How easily could this non-Y object be mistaken for X?  
      - `0` = No resemblance (e.g., cloud, shoe).  
      - `5` = Moderate resemblance (e.g., grey heron).  
      - `10` = High resemblance (e.g., melanistic crow).  
    - **Ratio:** Raven-Likeness / 10.  
  - **Judgment:** Explicitly justify Raven-Likeness score.  

  ---

  #### **Step 4: Adjust for Dependence**  
  *(Flags duplicate records)*  
  - **Question:** Is this record independent of prior accepted records?  
    - **Independent:** Same individual/time/location? → **No change.**  
    - **Dependent:** Same bird, same event, or same season? → **Set weight to 0.**  
  - **Judgment:**  
    - *Examples:*  
      - 14 photos of the same bird at a landfill → **Dependent (weight = 0).**  
      - Same bird reported June (black) and November (pale) → **Dependent (weight = 0) if same individual.**  

  ---

  #### **Step 5: Handle Edge Cases**  
  *(Your hard scenarios)*  
  - **Population Closure (Island vs. Mainland):**  
    - **Closed (e.g., banded island population):** Use base weight (Step 3).  
    - **Open (e.g., mainland):** Use base weight (Step 3).  
    - *Why no branch?* Single-record weight doesn’t change, but **aggregation later** uses population size (e.g., 1/200 for closed).  
  - **Non-Black Objects (Type C):**  
    - Low Raven-Likeness (e.g., shoe = 0) → **Negligible weight.**  
  - **Negative Records (e.g., "no ravens seen"):**  
    - Assign weight **0** → **No evidence** for generalization.  
    - *Why?* Absence of X ≠ evidence about Y. Contradicts "no pale ravens reported for 40 years" (aggregate issue).  
  - **Genetic Data:**  
    - Treat as **Type A** (if Y is phenotype, and gene predicts Y) → Apply confidence (e.g., Confirmed = 1.0).  

  ---

  #### **Step 6: Final Weight and Category**  
  *(Calculates output)*  
  - **Formula:**  
    `Final Weight = Base Weight (Step 3) × Confidence Multiplier (Step 2)`  
    - *If dependent (Step 4), Final Weight = 0.*  
  - **Category:**  
    | Final Weight       | Evidential Weight |  
    |--------------------|-------------------|  
    | < 0                | **Negative** (Strong if ≤ -10) |  
    | 0                  | **None**          |  
    | > 0 to < 0.1       | **Negligible**    |  
    | 0.1 to < 1         | **Weak**          |  
    | ≥ 1                | **Moderate**      |  

  - **Decision for Atlas:**  
    - **Negative:** Flag as potential falsification. **Requires human review.**  
    - **Negligible/None:** Do not enter as evidence for generalization.  
    - **Weak/Moderate:** Enter with category.  

  ---

  ### **Test Cases**  
  #### **Case 1: Pale Raven at Landfill**  
  - **Step 0:** Y (black) is definitional?  
    - *Judgment:* **YES** (field guide uses "all-black" for ID).  
    - **Output:** Weight = **None.** Do not enter for generalization. Flag for committee (definition challenge).  
  - *If Step 0 = NO:*  
    - Type B (pale raven), Confidence = Possible (mediocre photo, contested) → Multiplier 0.3.  
    - Base Weight = -100.  
    - Dependent? Unclear → Assume independent.  
    - Final Weight = -100 × 0.3 = **-30** → **Negative (Strong).**  
    - **Atlas:** Flag for human review. Committee rule (two observers/specimen) overrides.  

  #### **Case 2: 3,000 Non-Black Objects**  
  - **Each Record:** Type C (not raven, not black).  
    - Raven-Likeness: Shoe = 0, sheep = 1, grey heron = 5 → Base Weight = 0.01 × (0–5)/10 = **0 to 0.005.**  
    - Confidence: Confirmed (object ID clear) → Multiplier 1.0.  
    - Final Weight = **0 to 0.005** → **Negligible.**  
  - **Output:** Do not enter for generalization.  

  #### **Case 3: 9,000 Black-Raven Records**  
  - **Each Record:** Type A (raven, black).  
    - Base Weight = 1.0.  
    - Confidence: Assume "Possible" (no details) → Multiplier 0.3.  
    - Dependent? Most are duplicates → Set **weight = 0** for duplicates.  
    - Final Weight for independent records = 1.0 × 0.3 = **0.3** → **Weak.**  
  - **Honest Answer:**  
    - Weak weight per record. **Stop collecting indiscriminately.** Focus on:  
      - High-confidence (Probable/Confirmed) records.  
      - New individuals/locations (avoid duplicates).  
      - **Aggregate evidence** matters, but individual records add little.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Aggregate Records:** Evaluates one record at a time. Aggregation (e.g., 40 years of negatives) needs separate tools (e.g., occupancy models).  
  2. **Compare Hypotheses:** Only tests "all X are Y." Silent on distribution/trends (e.g., a pale raven photo may be key for range shifts).  
  3. **Prioritize Actions:** "Photograph white things" is inefficient (Type C weight is negligible). Redirect effort to high-value records (Type A/B).  
  4. **Resolve Conflicts:** Human judgment needed for:  
     - Definitional challenges (Step 0).  
     - Contested ID (Step 2).  
     - Dependence (Step 4).  
  5. **Perfect Independence:** Relies on observer notes for dependence (e.g., "same bird as record #142").  

  ---

  ### **Why This Works**  
  - **Practical:** Uses ratios (Raven-Likeness/10) and simple multipliers. No advanced math.  
  - **Transparent Judgment Calls:** Steps 0, 2, 3, and 4 require explicit reasoning.  
  - **Hard Cases Addressed:**  
    - White shoes → Negligible (Type C with low Raven-Likeness).  
    - Negative records → Weight 0 (not evidence for generalization).  
    - Dependence → Weight 0.  
    - Definitional stops → Prevents wasted effort.  
  - **Scalable:** 30–60 records/week feasible.  

  **Final Output:** A clear category (e.g., "Negligible") and decision (enter/do not enter) for the generalization. For contested cases, it flags the need for human review rather than hiding uncertainty.
