    6. It does not account for the prior probability of the generalization (which might be high if we've never seen a counterexample).

  Summary of the procedure:

    Step 0: Definitional check.
        If Y is part of the definition of X, then a record of a non-Y object claimed to be X is not a valid counterexample. Assign weight 0 and do not enter as evidence for the generalization. Flag for human review (might challenge definition).

    Step 1: Classify the record:
