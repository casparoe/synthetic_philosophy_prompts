prompt: |-
  My friend Marit is writing a dissertation on natural kinds and keeps a running list she calls the joints list — candidate kinds from the sciences, each marked in or out, updated after every reading group. I've got a small bet with her about what she'll do with five cases I'm springing on her next week, so what I want is predictions, not a tutorial.

  Her verdicts so far.

  In: gold (the element, not the colour), water, mass, charge. Tiger, but only as a lineage — her line is that there history does the work an essence was supposed to do. And, suprisingly, carburetor, which she deffends on the grounds that carburetors are wildly various but the job they do is real.

  Refused: any general verdict on species. She's a pluralist about species concepts but insists tiger is in.

  Out: jade. Weed (her note: the cluster is real, we just picked it out because it annoys us). The green-before-2050 / blue-after style of predicate. Raven-or-writing-desk. Money (too much of it is in the head). Schizophrenia as the diagnostic manual picks it out — a committee's compromise with several different mechanisms behind it. And planet in the official sense, with the clearing-the-neighbourhood clause; that's the verdict she's wobblest on, she's said twice she might flip it.

  The five cases:

  1. Systems in the same universality class. Near a continuous phase transition, systems with completely different microphysics — liquid helium, a ferromagnet at its Curie point, and, if a preprint I half-read is to be believed, a flock of starlings right at the onset of collective motion — share a set of critical exponents that depend only on the dimension of space and the symmetry of the order parameter. Those shared exponents let you predict quantitative details of systems nobody has built yet. No shared microstructure, no common ancestry, no mechanism holding the cluster together.

  2. Systems that implement an optimal recursive estimator. A modelling group reports that a moth's auditory interneuron, a bacterium's chemotaxis network, and the inventory controller in a warehouse all approximate the same recursive estimator to within noise, and that one set of error-covariance equations predicts the behaviour of all three better than any mechanism-specific model does. These systems have never been in causal contact with each other.

  3. Kinds defined by an absence: the knockout mouse line, or more generally lacks gene product G. Defined by something not being there, and yet among the most projectible kinds in the life sciences — thousands of reproducible generalizations, stable across labs.

  4. Invasive species, in the sense agencies actually use it: non-native, introduced by humans, and causing harm. Note that the harm clause is doing real work and that the members have nothing in common by descent.

  5. Short one: reptile in the old paraphyletic sense — snakes, lizards, turtles, crocodilians, birds excluded.

  What I want from you: for each case, her verdict, the rule that generates it, and the rules that fit her old verdicts just as well but come apart here. I care less about which philosophy of natural kinds is true than about what she is actually running — including whether it's one rule across all the sciences or a different one for chemistry, biology and the human stuff, and which of her existing verdicts is the load-bearing one she'd have to give up if I pushed her. Also: money is out but carburetor is in, and I don't think she's noticed how hard that pair is; say what has to be true for both to stand. Finally, if you were designing a sixth case purely to split the two rules that survive, what would it be?
reasoning: |-
  Okay, the user's friend Marit has a "joints list" for natural kinds in her dissertation, and the user has a bet on how she'll classify five new cases. I need to predict Marit's verdicts for each case, the rule she uses, alternative rules that fit her past verdicts but differ here, and address the carburetor vs. money inconsistency. Plus, design a sixth case to split the rules.

  First, reviewing Marit's existing verdicts:  
  - **In**: Gold (element), water, mass, charge – these seem based on microstructural essence or fundamental properties. Tiger (as lineage) uses historical essence instead of microstructure. Carburetor is in because of functional role despite structural variation.  
  - **Out**: Jade (two minerals), weed (anthropocentric cluster), temporal predicates, disjunctions like raven-or-desk, money (mental dependence), schizophrenia (committee compromise), planet (wobbly on "clearing orbit").  
  - **Refused**: General species verdict, pluralist but accepts tiger.  

  Key themes:  
  - **Essence**: Microstructural for chemistry (gold/water), historical for biology (tiger).  
  - **Function**: Carburetor is in due to real functional role, even without shared structure.  
  - **Anthropocentrism**: Weed and money are out because human interests define them.  
  - **Disunity**: Jade is out for being disjunctive, schizophrenia for multiple mechanisms.  

  Now, predicting the five cases:  

  1. **Universality classes**: Systems like liquid helium, ferromagnets, starling flocks share critical exponents based on dimension and symmetry. No shared microstructure, ancestry, or mechanism.  
     - *Prediction*: **In**. Rule: Projectible clusters grounded in objective, lawlike regularities. The critical exponents allow predictions across domains, showing a real pattern in nature.  
     - *Alternative rule*: Microstructural essence – would reject this since no shared microphysics. But Marit accepts carburetor (functional), so she can go beyond microstructure.  
     - *Load-bearing verdict*: Carburetor – functional roles can define kinds.  

  2. **Optimal recursive estimators**: Moth neuron, bacterium, inventory controller approximate the same estimator, predictable by shared equations. No causal contact.  
     - *Prediction*: **In**. Rule: Functional kinds with projectible patterns. The convergence on optimal solutions creates robust, predictable behaviors.  
     - *Alternative rule*: Historical continuity – would reject since no common descent. But Marit accepts carburetor, so function can suffice.  
     - *Load-bearing*: Carburetor again.  

  3. **Knockout mice/lacks gene G**: Defined by absence, yet projectible and reproducible.  
     - *Prediction*: **In**. Rule: Kinds defined by causal role absences that produce stable downstream effects. The absence of G has predictable consequences.  
     - *Alternative rule*: Positive essence – would reject absences as non-real. But Marit might see the absence as a causal factor.  
     - *Load-bearing*: Schizophrenia – she rejected it for being a disunified category, but here the absence unifies the kind.  

  4. **Invasive species**: Non-native, human-introduced, harmful. No common descent.  
     - *Prediction*: **Out**. Rule: Anthropocentric harm clause makes it interest-dependent, like "weed."  
     - *Alternative rule*: Ecological function – could argue for a real role, but harm is value-laden.  
     - *Load-bearing*: Weed – rejected for being an annoyance-based cluster.  

  5. **Paraphyletic reptiles**: Excludes birds, not a clade.  
     - *Prediction*: **Out**. Rule: Historical kinds must be monophyletic. Tiger is in as lineage, so paraphyly violates that.  
     - *Alternative rule*: Morphology – if she accepted structural similarity, but she emphasizes history for tigers.  
     - *Load-bearing*: Tiger lineage – monophyly is key.  

  **Carburetor vs. Money inconsistency**:  
  - Carburetor is in (functional role), money is out (too mental).  
  - For both to stand: Functions must be externally anchored (carburetor's role in engines vs. money's dependence on collective belief). Money's function relies on human cognition, making it "in the head," while carburetors have a physical causal role.  

  **Sixth case to split rules**:  
  - Design: Functional kind with heavy human cognition dependence. Example: **Currency trading algorithms** – they converge on similar predictive models (functional) but rely entirely on market psychology (mental).  
  - Splits: A rule accepting functional roles would accept it, but one rejecting "in the head" kinds would reject it. Tests the boundary of carburetor vs. money.
answer: |-
  Based on Marit's existing verdicts, her implicit "joints list" rules prioritize **projectibility grounded in objective, non-arbitrary causal structures or patterns**, with a focus on whether a kind supports inductive inferences (reproducible generalizations, predictions) *because* of how the world is structured, not human interests or disjunctive categories. Her approach appears **unified across sciences** but with domain-specific criteria (e.g., historical essences in biology, functional roles in artifacts). The carburetor/money tension is resolved by distinguishing between **externally anchored functions** and **cognitively dependent categories**. Below are predictions for each case, the rule generating her verdict, alternative rules that fit her past verdicts but diverge here, the load-bearing verdict she'd defend, and the resolution for carburetor/money. Finally, I propose a sixth case to split the rules.

  ### Predictions for the Five Cases
  1. **Systems in the same universality class (e.g., liquid helium, ferromagnets, starling flocks)**  
     - **Verdict**: **In**  
     - **Rule**: Kinds are natural if they exhibit *robust, lawlike projectibility* based on shared higher-order patterns (e.g., symmetries, dimensions) that generate predictions across diverse microstructures. Critical exponents are objective, measurable, and discovery-independent.  
     - **Why**: Universality classes produce quantitative predictions for novel systems (e.g., predicting behavior of unbuilt materials), mirroring how "mass" or "charge" support inductions. No shared microstructure is needed—this is like "carburetor" scaled up: diverse realizers united by a real pattern.  
     - **Alternative rule that fits past verdicts but diverges**: *Microstructural or historical essence required*. This would reject universality classes (no shared "stuff" or lineage) but accept "gold" or "tiger." Marit's acceptance of "carburetor" (functional) blocks this.  
     - **Load-bearing verdict**: **Carburetor**. If pushed, she defends functional/structural patterns over microstructural essences. Giving this up would force her to reject universality classes, but she won't.

  2. **Systems implementing an optimal recursive estimator (e.g., moth neuron, bacterium, inventory controller)**  
     - **Verdict**: **In**  
     - **Rule**: Kinds are natural if they are *convergent functional optima*—systems that independently evolve or design to approximate the same solution to a physical problem (e.g., estimation under noise), yielding projectible equations.  
     - **Why**: The error-covariance equations predict behavior better than mechanism-specific models, showing a discovery-independent pattern (like critical exponents). This mirrors "charge" in projectibility and "carburetor" in functional convergence. No causal contact is irrelevant—convergence is objective.  
     - **Alternative rule**: *Causal-historical continuity required*. This would reject these systems (no common descent or contact) but accept "tiger." Marit's "carburetor" verdict shows she allows ahistorical functional kinds.  
     - **Load-bearing verdict**: **Charge** (for projectibility) and **carburetor** (for functional convergence). If she rejects this, she must explain why optimal estimators are less "real" than carburetors.

  3. **Kinds defined by absence (e.g., knockout mouse lacking gene G)**  
     - **Verdict**: **In**  
     - **Rule**: Kinds are natural if defined by a *causal-informational absence* that generates stable, projectible downstream effects (e.g., reproducible phenotypes across labs). The absence must be specific and lawlike (e.g., "lacks G" is precise, unlike "schizophrenia").  
     - **Why**: The projectibility is robust and grounded in biological reality (e.g., G's absence disrupts a pathway predictably). This is not disjunctive like "jade" or "schizophrenia"—it's a unified causal hole. Marit likely sees this as analogous to "charge" (absence/presence matters physically).  
     - **Alternative rule**: *Positive properties only*. This would reject absences (arguing they're not "real") but accept "water" or "mass." Her rejection of "raven-or-desk" (disjunctive) doesn't apply here, as "lacks G" is not arbitrary.  
     - **Load-bearing verdict**: **Schizophrenia**. She rejected it for disunity, but here the absence is unified and projectible. If pushed, she insists absences count only when they have direct causal consequences.

  4. **Invasive species (non-native, human-introduced, causing harm)**  
     - **Verdict**: **Out**  
     - **Rule**: Kinds are natural only if their membership is *non-arbitrary relative to human interests*. The "harm" clause is value-laden and context-dependent (e.g., "harm" varies by ecosystem or policy), making it anthropocentric like "weed."  
     - **Why**: Though ecologically significant, "harm" is not a discovery-independent, intrinsic property—it's tied to human goals (e.g., protecting crops or biodiversity). This mirrors "money" (too "in the head") and "weed." No common descent or function unifies invasives (e.g., kudzu vs. zebra mussels share no biology).  
     - **Alternative rule**: *Ecological role as functional essence*. This could accept invasives (e.g., "disrupts native ecosystems" as a real pattern) but reject "tiger" (lineage-based). Marit's "weed" verdict blocks this by prioritizing non-anthropogenic clusters.  
     - **Load-bearing verdict**: **Weed**. If she flips this, she must accept that human-defined harms can ground natural kinds, weakening her rejection of "money."

  5. **Reptile (paraphyletic, excluding birds)**  
     - **Verdict**: **Out**  
     - **Rule**: Biological kinds must be *monophyletic* to count as natural—lineages must include all descendants. Paraphyly (excluding birds) is an arbitrary, human-imposed cut based on morphology, not evolutionary history.  
     - **Why**: "Tiger" is in as a lineage, so reptiles fail for not being a clade. This is like rejecting "planet" for arbitrary orbital criteria—"clearing the neighborhood" is ad hoc, much like "scaly skin" for reptiles.  
     - **Alternative rule**: *Morphological or functional similarity*. This could accept reptiles (shared traits like ectothermy) but reject "tiger" (which she defends historically). Her "tiger" verdict is decisive here.  
     - **Load-bearing verdict**: **Tiger**. If she accepts paraphyletic kinds, she undermines her historical-essence stance for species.

  ### Resolving Carburetor vs. Money
  - **Why both verdicts stand**: Carburetor is **in** because its function (mixing air and fuel) is *externally anchored* in physical laws (combustion, fluid dynamics) and is discovery-independent (engines require this to work). Money is **out** because its function (store of value, medium of exchange) is *cognitively dependent*—it relies on collective beliefs, laws, or cultural practices ("in the head"). For Marit, natural kinds must be mind-independent in their core properties; carburetors work based on physics, while money requires human cognition to "work."  
  - **What must be true**: Functions are natural only if they are *causally efficacious independent of human mental states*. Carburetors function due to chemistry/physics; money functions due to psychology/society. This fits her "in the head" dismissal of money and her acceptance of projectible physical roles for carburetors.

  ### Sixth Case to Split Alternative Rules
  - **Design goal**: Split between Marit's rule (projectible patterns grounded in objective structures) and a functional-role rule that ignores cognitive dependence.  
  - **Case**: **Deep learning architectures that converge on similar neural representations across domains (e.g., vision, audio, gameplay) due to optimization constraints, but rely on human-labeled training data**.  
    - **Description**: Models like CNNs or transformers develop identical internal representations for tasks (e.g., edge detection) because they optimize for efficiency under information-theoretic constraints. However, these representations only emerge because of curated human datasets (e.g., ImageNet).  
    - **How it splits rules**:  
      - Marit's rule (objective projectibility) would **reject** this: The convergence is real and projectible (predicts model behavior), but it's causally dependent on human cognitive artifacts (labels). Like "money," it's "in the head" in origin.  
      - A pure functional-role rule (accepting any convergent optimization) would **accept** it: The architectures share a discoverable, predictive pattern (e.g., activation maps) analogous to recursive estimators.  
    - **Why it targets the split**: It isolates the "cognitive dependence" boundary. Carburetors and recursive estimators are accepted because their functions/patterns are physics-driven; this case is functionally convergent but human-cognitive in its foundations, like money. Forces a choice: is "human scaffolding" disqualifying?  

  This prediction set assumes Marit is consistent and prioritizes projectibility + mind-independence. Her "planet" wobble suggests she might bend on criteria like "harm" or historical monophyly under pressure, but the carburetor/money distinction is likely core. If she flips on universality classes or invasive species, it implies her rule is more flexible than it appears. Good luck with the bet!
