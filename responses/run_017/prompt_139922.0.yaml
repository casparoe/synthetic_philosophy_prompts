  - C) It is meaningless to say one suffers more than the other because suffering is subjective and personal.

  **Question 9: Ordinal vs Cardinal in Policy**
  *Case: In allocating a fixed budget for health interventions, we have two options: 
  Option 1: Helps Person X a lot and Person Y a little. 
  Option 2: Helps Person X a little and Person Y a lot. 
  We know that for each person, "a lot" is better than "a little", but we don't know how much better.*
