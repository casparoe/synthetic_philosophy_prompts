  - B) We can combine both measures into a single index by averaging or weighting them.
  - C) There is no fact of the matter about which measure is correct, so we should not impose a single measure without agreement.

  **Question 6: Aggregation - Utility Monster Variant (Dispersed)**
  *Case: A policy will slightly improve the lives of a very large number of people (say, 1 million) by a small amount (e.g., a minor convenience) and will significantly harm one person (e.g., causing severe pain). The total gain in wellbeing (if we add up all the small gains) equals the loss to the one person.*
  - A) The policy should be implemented because the total (or average) wellbeing increases.
  - B) The policy should not be implemented because the severe harm to one person outweighs the dispersed benefits.
  - C) We cannot compare the harm to the one person with the sum of the small benefits, so the policy cannot be justified on wellbeing grounds.

  **Question 7: Variable Population - Barely Worthwhile Life**
  *Case: In a society of 1000 happy people, we can add one more person who would live a life that is barely worth living (no suffering, but very little joy). The lives of the existing 1000 are unchanged.*
  - A) Adding this person makes the society better because there is more total wellbeing.
  - B) Adding this person makes the society worse because it lowers the average wellbeing.
  - C) Adding this person does not change the overall wellbeing of the society, or we cannot say whether it is better or worse.

  **Question 8: Interpersonal Comparison of Different Experiences**
  *Case: Chris is experiencing intense physical pain. Dana is experiencing deep grief after a loss. Both describe their suffering as extreme. We want to know who is suffering more.*
  - A) We can compare the intensity of their suffering by using a common scale (like how much they would pay to avoid it, or a physiological measure).
