  **Question 1: Adaptive Preferences (Intrapersonal)**
  *Case: Maria grew up in poverty and now lives a modest but stable life. She says she is perfectly happy and wouldn't want anything more. However, if she had grown up in a wealthy family, she would have had higher aspirations and might have been even happier in a more affluent life.*
  - A) Maria's current happiness is genuine and should be taken at face value. We should not second-guess her stated preferences.
  - B) Maria's happiness is real for her now, but we can see that her potential for greater happiness was stunted by her circumstances. Her current state is not as good as it could have been.
  - C) It doesn't make sense to say that Maria could have been happier in a different life because happiness is relative to one's circumstances and expectations.

  **Question 2: Incommensurable Vocabularies (Interpersonal)**
  *Case: Alex describes his wellbeing in terms of achieving personal goals and feeling accomplished. Sam describes her wellbeing in terms of inner peace and harmony with nature. They both say they are doing well, but they use different concepts.*
  - A) We can still compare Alex and Sam's wellbeing by finding a common scale (like life satisfaction) that both would accept.
  - B) We can compare their wellbeing ordinally (e.g., who is better off) but not cardinally (e.g., by how much) because their descriptions are too different.
  - C) It is impossible to compare their wellbeing at all because there is no common currency to translate their experiences.

  **Question 3: Disagreement on Gaps (Intrapersonal Ratios)**
  *Case: Taylor and Jordan both rank their own states of wellbeing at different times. Taylor says the difference between her best and worst times is about twice the difference between her average and worst. Jordan says for him the difference between best and worst is ten times the difference between average and worst. They agree on the ordering of their states but not on the ratios.*
  - A) There is a fact of the matter about the true ratios for each person, so one of them must be wrong.
  - B) The ratios are subjective and there is no fact of the matter beyond the ordinal ranking. Each person's report is valid for them.
  - C) We can use the ratios they report to make interpersonal comparisons because they reflect each person's own experience.

  **Question 4: Intrapersonal Comparison with Memory Loss**
  *Case: After a severe accident, Robin has significant memory loss and a shift in values. Robin now prefers a quiet, solitary life, whereas before the accident, Robin was very social and ambitious. Robin says that the current life is better.*
  - A) We can compare Robin's wellbeing before and after the accident because wellbeing is objective and doesn't depend on memory or current preferences.
  - B) We can only compare Robin's wellbeing at different times from the perspective of Robin's current values. So if Robin now prefers the current life, then it is better for Robin now.
  - C) We cannot meaningfully compare Robin's wellbeing across such a radical change because there is no continuous self to make the comparison.

  **Question 5: Second-Order Disagreement on Currency**
  *Case: Two groups are debating how to measure wellbeing for policy. Group A says wellbeing is about income and material wealth. Group B says it's about health and life expectancy. They cannot agree on the measure.*
