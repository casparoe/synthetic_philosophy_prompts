  *Case: Lee and Kai are both experiencing the same objective event (e.g., both lost their jobs). Lee says the impact on her wellbeing is severe. Kai says the impact on his wellbeing is moderate. They both understand and agree on what "severe" and "moderate" mean in terms of wellbeing.*
