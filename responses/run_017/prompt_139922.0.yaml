  We are creating a quiz to sort people into different views on interpersonal comparisons of wellbeing without relying on technical jargon. The quiz should have ten questions with three options each. We are to cover specific cases as requested.

  We'll build the logical space step by step with questions that probe different aspects. The goal is to have roughly six distinct positions (leaves). We'll design the questions so that patterns of answers map onto these positions.

