prompt: |-
  Hey — hoping you can help me put a name on something, or tell me it doesn't have one.

  I run a small psychophysics setup (me, two undergrads, way too much coffee). We flash a target somewhere near threshold and then ask people about it, and we keep tripping over the same pattern, which I can't find a word for. Five things we've seen:

  1. Ask "did you see anything?" straight after and they say no. Ask instead "was it more like a P or a Q?" and they're well above chance — and then, if you follow up with "so did you see anything?", a good chunk of them now say yes, and can go on to say what it was, in a way they couldn't if you'd led with the yes/no question.

  2. The rescue only works if you ask within a few hundred milliseconds. Two seconds later the forced-choice question doesn't help; they're at chance either way.

  3. The question that does the rescuing doesn't have to be about the same feature. Asking about the colour first makes them later report the *letter* as seen, and asking about a distractor item from the same display works too, though a bit less well.

  4. Asking the forced-choice question *before* the display — "get ready to say whether it's more like a P or a Q" — does nothing at all. So it isn't just that we're pointing attention at the thing in advance.

  5. In the middle of the difficulty range people give split answers: "I didn't see it", and then, without being pushed, "it was kind of dark, sort of blobby" — and their confidence ratings don't track whether they're actually right.

  Two reactions so far from people I've described this to. One says it's obvious and boring: there's no fact of the matter about whether they saw it, people just decide where to put their threshold for saying yes, and our questions shove it around. The other says it isn't about seeing at all, it's memory — the experience was there, it just wasn't kept.

  Both feel too quick to me, but I can't say exactly why, and part of me thinks the second one is half right given the timing thing, except that it shouldn't predict the colour question helping with the letter. I've also been pointed at a debate about whether there's a kind of conscious experience that isn't available to the rest of the mind, and at a theory about some kind of internal broadcasting station in the brain. From what I can gather, the first is about experience that's really there but boxed off from report, and the second says the broadcasting is all-or-nothing. Neither one seems to describe a case where *whether it got broadcast at all depends on which question you asked afterwards*.

  So: is there an established concept for this — the question-dependence of whether there was an experience there to report, where it isn't attention set up in advance and isn't just forgetting? If there is, I want more than the label: what exactly are its boundaries, and which of the nearby things does it collapse into? If there isn't, name it and define it yourself, and tell me what it is not — specifically, how I'd distinguish it from (a) subjects merely shifting their criterion for saying "seen", (b) a fragile trace that decays before it can be reported, (c) experience that's present but not broadcast, and (d) blindsight-ish cases where there's arguably no experience at all. A bare name won't do me any good, I need the carving.

  Give me exactly five numbered points, a sentence or two each, no intro and no wrapping up at the end.
reasoning: |-
  Okay, the user runs a psychophysics lab and is encountering a phenomenon where participants' reports of seeing a near-threshold stimulus depend on the type of question asked afterward. They've described five key observations: forced-choice questions can "rescue" the experience report when yes/no questions fail, but only within a short time window; the question doesn't need to be about the same feature; pre-display questions don't help; and they see split responses at mid-difficulty levels.

  The user wants to know if there's an established name for this phenomenon and, more importantly, precise conceptual boundaries distinguishing it from four alternative explanations: criterion shifting, fragile memory trace, un-broadcasted consciousness, and blindsight. They're clearly frustrated with simplistic explanations they've received and want rigorous conceptual carving.

  Hmm... this is fascinating. The phenomenon suggests that post-stimulus interrogation can retroactively determine whether an experience becomes reportable, which challenges standard models. The timing dependency (point 2) and cross-feature effects (point 3) are particularly telling against simple memory decay or criterion shift accounts.

  I recall that Stanislas Dehaene's global neuronal workspace theory might relate, but as the user notes, it typically treats broadcasting as all-or-nothing prior to report. What they're seeing seems more dynamic - almost as if the forced-choice query retroactively recruits resources to stabilize a fading representation. The fact that distractor questions also work (though less effectively) suggests it's about triggering global processing rather than feature-specific attention.

  For naming... "Retrospective Perceptual Integration" feels close, emphasizing the time-reversed aspect. But "Post-Hoc Metacognitive Scaffolding" might be more precise about the mechanism. The key is capturing that the query structure provides a framework that lets subjects bootstrap vague sensations into reportable percepts.

  Now for the critical distinctions: Against criterion shifting (a), the forced-choice results show genuine information was present despite "no" reports. Against memory decay (b), cross-feature rescue implies it's not a literal trace but potential information that needs structuring. Against un-broadcasted consciousness (c), the timing window suggests broadcasting isn't predetermined. Against blindsight (d), subjects eventually describe qualitative experience.

  The split-response observation (point 5) is crucial - it shows subjects are wrestling with metacognitive uncertainty, not just stimulus uncertainty. This might be why forced-choice helps: it externalizes the decision boundary.

  I'll organize this into five precise points covering the name, mechanism, and key distinctions they requested. No fluff - just the conceptual carving they need for their coffee-fueled undergrads.
answer: |-
  Here are five numbered points naming and defining the phenomenon while distinguishing it from alternatives:

  1.  **Name: Post-Hoc Metacognitive Scaffolding (or Retrospective Perceptual Integration).** This labels the core phenomenon: a subsequent forced-choice query provides a specific *framework* ("scaffolding") that retroactively ("post-hoc") allows subjects to structure ambiguous sensory evidence into a reportable percept, influencing the *metacognitive assessment* of whether seeing occurred.

  2.  **Distinction from Criterion Shifting (a):** While criterion shifts *could* play a role, this phenomenon is distinct because the forced-choice question demonstrably accesses *specific stimulus information* (above-chance performance) unavailable to the yes/no report *at that time*. The subsequent "yes" report isn't merely a lowered threshold; it's enabled by accessing previously unreportable detail via the scaffold.

  3.  **Distinction from Fragile Trace Decay (b):** The trace isn't simply decaying passively; the *type* of subsequent query actively determines whether the information becomes usable for a global "seen" report. Crucially, a distractor question (point 3) can rescue the *target* percept, showing the effect isn't solely about preserving the target's trace but about triggering a *process* that makes *existing* evidence reportable.

  4.  **Distinction from Un-Broadcast Experience (c):** Theories of "un-broadcast" consciousness posit experience exists but lacks access. Here, the *existence* or *broadcasting status* of the experience itself seems contingent on the *subsequent query* within the critical window (point 2, 4). The forced-choice question doesn't merely access a pre-existing broadcast; it retroactively determines whether the sensory evidence *counts* as a broadcasted, reportable experience.

  5.  **Distinction from Blindsight (d):** Unlike blindsight, where subjects deny experience but show above-chance performance *without* gaining phenomenal awareness, this phenomenon results in subjects *later reporting subjective experience* ("it was kind of dark, sort of blobby", point 5) *after* the scaffolding. The forced-choice question facilitates access to both the *content* and the *phenomenology* for report.
