      - Explain: "Now, think back to Round 2. In your group, you had an initial estimate of the update weight and then updated to a revised estimate after discussion. How much should you have updated? That is, what fraction of the difference between your initial weight estimate and the average of your group's initial weight estimates should you have moved? (Note: we are not asking what you did, but what you should have done.)"
