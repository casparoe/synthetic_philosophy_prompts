answer: |-
  ### Peer Disagreement Workshop Activity: Setup & Timeline  
  **Core Goal:** Participants experience the tension between conciliationism (updating toward peers) and steadfastness (holding one's ground) without explicit theory labels. The activity emphasizes traceable vs. bare disagreements and self-erosion (higher-order disagreement about disagreement resolution).  

  ---

  #### **Materials & Setup**  
  1. **Cards for Evidence & Noise Oracle (Round 1):**  
     - **18 cards** (one per participant). Each card includes:  
       - A **private measurement** (e.g., "Temperature reading: 84°F").  
       - A **noise oracle label** ("Low Noise" or "High Noise").  
     - **Noise oracle rules (explained verbally):**  
       - "Low Noise" means your measurement is likely reliable (70% chance).  
       - "High Noise" means your measurement is likely unreliable (70% chance).  
       - *Do not mention the 70% success rate upfront; reveal it during debrief.*  

  2. **Traceable Error Notes (Round 1):**  
     - **9 notes** (for traceable pairs only):  
       - Half state: "Partner’s measurement had +10 error added."  
       - Half state: "Partner’s measurement had -10 error added."  

  3. **Scenario Cards (Round 2):**  
     - **18 cards** (one per participant). Each describes a Round 1-like scenario:  
       - **Bare Scenario (9 cards):** "Alex: Measurement 84°F, Noise Oracle Low. Sam: Measurement 92°F, Noise Oracle High. No errors detected."  
       - **Traceable Scenario (9 cards):** "Taylor: Measurement 84°F, Noise Oracle Low. Jordan: Measurement 94°F, Noise Oracle Low. Jordan’s measurement had +10 error added."  

  4. **Randomization (Phone App):**  
     - Use a random number generator for:  
       - Assigning noise oracle accuracy (70% correct, 30% incorrect).  
       - Pairings/groupings.  
       - True values (e.g., true temperature = 88°F).  

  5. **Leaderboard Scoring:**  
     - **Quadratic Scoring Rule:** `Score = 100 * [1 - (estimate - true_value)² / 2500]` (max score 100, min 0).  
     - Scores displayed after Rounds 1 and 2; no money, only bragging rights.  

  ---

  #### **Participant Roles & Pairings**  
  - **18 participants** split into two groups:  
    - **Group A (Traceable):** 9 participants (4 traceable pairs + 1 trio).  
    - **Group B (Bare):** 9 participants (4 bare pairs + 1 trio).  
  - **Pairing Rules:**  
    - **Round 1:** Pairs share initial estimates, then revise. Traceable pairs get error notes.  
    - **Round 2:** Trios (3 participants per trio) discuss update weights for scenarios.  
    - **Round 3:** Pairs discuss self-erosion (random pairing).  

  ---

  #### **90-Minute Timeline**  
  **0:00–0:05 — Intro (5 min)**  
  - *Facilitator:* "Today, we’re estimating hidden quantities. You’ll get private clues, discuss with others, and revise. Goal: Maximize accuracy for the leaderboard."  
  - *Do not mention disagreement theories or noise oracle mechanics.*  

  **0:05–0:15 — Round 1: Private Estimates (10 min)**  
  - Distribute **evidence cards**.  
  - Participants record **initial estimates** (e.g., "True temperature = 86°F").  
  - *Quiet solo work; no talking.*  

  **0:15–0:30 — Round 1: Pair Discussion (15 min)**  
  - Pair participants (4 traceable pairs, 4 bare pairs, 2 trios).  
  - **Traceable pairs:** Give error notes to one partner (e.g., "Partner’s reading had +10 error").  
  - **Instructions:** "Share measurements and oracle labels. Discuss and record a revised estimate."  
  - *Participants experience:*  
    - **Bare:** Peer’s measurement differs, no flaws visible.  
    - **Traceable:** Peer’s measurement differs, but error note explains why.  

  **0:30–0:35 — Round 1 Scoring (5 min)**  
  - Reveal true value (e.g., 88°F).  
  - Calculate scores for initial and revised estimates (only revised counts for leaderboard).  

  **0:35–0:45 — Round 2: Update Weight Estimates (10 min)**  
  - Distribute **scenario cards** (half bare, half traceable).  
  - **Task:** "Estimate the ‘update weight’ for the person in the scenario (e.g., Alex). What fraction of the way from their estimate to their partner’s should they move? (0 = no update, 0.5 = halfway, 1 = fully adopt partner’s estimate)."  
  - Participants record **initial weight estimates** (e.g., "Weight = 0.4").  

  **0:45–0:55 — Round 2: Trio Discussion (10 min)**  
  - Form trios (all bare or all traceable).  
  - **Instructions:** "Share weight estimates and reasoning. Revise your weight estimate."  
  - *Participants experience:* Disagreeing about how much to conciliate in a past scenario.  

  **0:55–1:00 — Round 2 Scoring (5 min)**  
  - Reveal "correct" weights: **0.5 for bare**, **0.0 for traceable** (pre-defined for simplicity).  
  - Update leaderboard.  

  **1:00–1:10 — Round 3: Self-Erosion (10 min)**  
  - **Prompt:** "In Round 2, how much should you have updated your weight estimate toward your trio’s average? (e.g., If you said 0.4 and the trio average was 0.6, should you have moved 50% of the way to 0.5?)"  
  - Participants record **initial self-erosion estimates** (e.g., "Move 30%").  
  - Pair randomly, discuss, and record **revised estimates**.  
  - *No scoring; pure reflection.*  

  **1:10–1:25 — Structured Debrief (15 min)**  
  - *Map experiences to theories without naming them:*  
    - **"In Round 1, when you saw a clear error (e.g., +10 flaw), did you still treat your partner as equally reliable? Or did you dismiss their view?"**  
      → *Steadfastness:* "I held firm; the error broke peer status."  
      → *Conciliationism:* "I still moved slightly; peers can make mistakes."  
    - **"In bare disagreements (no visible errors), why did most of you move toward your partner?"**  
      → *Conciliationism instinct:* "Same access to truth; split the difference."  
    - **"In Round 2, when disagreeing about how much to update, did you apply the same rule as Round 1?"**  
      → *Self-erosion tension:* "If I conciliate on conciliationism, I’m undermining my rule."  
    - **"In Round 3, did anyone feel stuck? Like the rule was eating itself?"**  
      → *Philosophical stakes:* "Should disagreement rules apply to themselves?"  

  **1:25–1:30 — Closing Note (5 min)**  
  - **Settled Consensus:**  
    - Peer disagreement requires equal reliability, shared evidence, and no independent defeaters.  
    - Conciliationism is intuitive in "bare" cases (no visible flaws).  
  - **Contested Issues (Flagged for Neutrality):**  
    - **Peer Identification:** Is it circular to call someone a "peer" only when you conciliate? (Design assumes non-circularity via noise oracle).  
    - **Self-Erosion:** Should conciliationism apply to disagreements about itself? (Design exposes tension but doesn’t resolve it).  
    - **Traceability:** Does a visible error negate peer status? (Design assumes "yes," but some argue reliability is holistic).  

  ---

  #### **Predictable Problems & Limitations**  
  1. **Noise Oracle Misinterpretation:**  
     - *Risk:* 1–2 participants treat "High Noise" as evidence *about the true value* (e.g., "High Noise means the true value is extreme").  
     - *Mitigation:* Clarify mid-activity: "The oracle describes your measurement’s reliability, not the truth."  

  2. **Traceable/Bare Distinction Collapse:**  
     - *Risk:* Participants ignore error notes and treat all disagreements uniformly.  
     - *Mitigation:** During debrief, contrast quotes like: "I saw the +10, so I ignored Jordan" vs. "No flaws? I averaged with Sam."  

  3. **Self-Erosion Confusion:**  
     - *Risk:** Round 3 feels abstract; participants disengage.  
     - *Mitigation:* Use concrete examples: "If you and I disagree on how much to conciliate, do we conciliate about that?"  

  4. **Unreproducible Debate Nuances:**  
     - **Peer Reliability:** Real-world peers aren’t "70% reliable"; the game simplifies epistemic parity. You’ll need to verbally add: "In reality, reliability is fuzzy and holistic."  
     - **Motivated Reasoning:** The game can’t replicate emotional stakes (e.g., ego defense). Flag this: "Outside the game, we resist conciliation to protect our identity."  

  ---

  #### **Facilitator Crib Sheet**  
  - **Key Moments to Highlight:**  
    - When participants refuse to update in traceable cases → "Did the error break peer status?"  
    - When they split the difference in bare cases → "Was this about counting heads or shared evidence?"  
    - When Round 3 estimates vary wildly → "Should disagreement rules apply to themselves?"  
  - **Neutral Framing:**  
    - Use "some people feel X, others Y" instead of theory names.  
    - In closing, acknowledge: "There’s no consensus on self-erosion or traceability—these are live debates."  
  - **Time Savers:**  
    - Pre-generate evidence cards (see example below).  
    - Use phone app for instant pairings.  

  **Example Evidence Card (Round 1):**  
  ```  
  === YOUR EVIDENCE ===  
  Measurement: 84°F  
  Noise Oracle: Low Noise  
  ```  
  **Example Traceable Error Note:**  
  ```  
  === ADDITIONAL INFO ===  
  Your partner's measurement had a +10 error added.  
  ```  

  This design ensures participants *feel* the conciliation/steadfastness tension, exposes self-erosion, and flags contested premises—all without lecturing. Run it as a puzzle, not a debate.
