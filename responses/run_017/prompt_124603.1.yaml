prompt: |-
  I run a monthly rationality workshop — a Saturday afternoon slot, 18 regulars, 90 minutes, mostly working programmers plus a few philosophy-adjacent people. They've all been through calibration training and at least one Aumann-style convergence exercise (everyone privately estimates a quantity, then shares estimates and revises, everything scored with a proper scoring rule on a leaderboard, no money changing hands). For an upcoming session I want to stage peer disagreement itself: conciliationism versus steadfastness. My main constraint is that participants should feel both pulls before either view is named — no lecture up front, no session that degenerates into an argument about which theory is nicer. They should walk out having noticed that they applied different rules in different cases and not being sure they can justify the difference.

  The wrinkle I keep chewing on, and that I'd like the activity built around, is disagreement where the evidence about your own evidence is itself unreliable. Concretely: each participant gets private evidence toward an estimate, and alongside it a noisy reading of how noisy that evidence is — a noise oracle that is right maybe 70 percent of the time — and then confronts a peer whose estimate and whose noise-oracle reading both differ from theirs. Some disagreements should be traceable: the participant can see the specific step where the peer's evidence passed through a corrupted channel, or can inspect the peer's reasoning line by line and locate the slip. Others should be bare: no visible flaw at all, just an equally smart, equally calibrated person who landed somewhere else. My hope is that the same people who happily split the difference on bare disagreements will refuse to move at all on traceable ones, and that we can then ask whether the traceable cases were ever really peer disagreement, or whether conciliation was never about counting heads in the first place. I also want one round that turns the machinery on itself: pairs disagree about how much they themselves should have updated in the previous round, so that whatever rule they endorse has to apply to disagreement about that rule. I've been calling the resulting worry self-erosion: the fact that a conciliationist who meets an equal who denies conciliationism seems required to discount the very principle she was using, and that this looks like a bug to some people and a feature to others. The activity should make that visible without me naming it.

  What I need from you: the setup and materials (I can print cards and use one phone for randomization), the pairings or roles, a minute-by-minute 90-minute timeline, the payoff scheme (leaderboard points only), and a debrief that maps specific moments in the room onto specific moves each view makes. Tell me what will predictably go wrong the first time I run it — my guess is that at least one participant just treats the noise oracle as one more piece of first-order evidence and the whole distinction collapses, but you tell me — and be frank about which feature of the actual debate the game cannot reproduce and I'll have to supply by hand. Please don't include a reading list, citations, or suggestions for further reading; I have the literature side covered and I don't want to guess at references I can't check. What I do want is a short closing note separating what is genuinely settled among people who work on this from what is contested, and flagging anywhere your design presupposes a contested reading — in particular on whether peers can be identified non-circularly, and on whether conciliation should extend to higher-order disagreement about conciliation itself — so I don't walk in presenting one side's framing as the consensus.
reasoning: |-
  We are designing an activity for a rationality workshop. The goal is to explore peer disagreement (conciliationism vs. steadfastness) without naming the theories upfront. Participants should experience both the pull to conciliate and the pull to stand firm, especially in cases where the evidence about the quality of evidence is noisy.

  Key elements:
  1. Private evidence: Each participant gets a piece of evidence for estimating a quantity, and a "noise oracle" reading (70% reliable) about how noisy their evidence is.
  2. Two types of disagreement:
     a. Traceable: where a specific error in the peer's process can be identified (e.g., corrupted channel, reasoning slip).
     b. Bare: no visible flaw, just an equally competent peer with a different result.
  3. One round should involve disagreement about how much they should have updated in the previous round (self-erosion).
  4. The activity should lead participants to notice they apply different rules in different cases and question the justification.

  Constraints:
  - No lecture up front.
  - Use a leaderboard with proper scoring rules (no money).
  - Materials: cards, one phone for randomization.
  - 90 minutes total.

  Structure:
  - We'll have multiple rounds of estimation and updating.
  - Each round: private evidence -> private estimate -> encounter with one peer (either traceable or bare) -> revised estimate.
  - Scoring: proper scoring rule (e.g., quadratic scoring rule) for estimates.

  Designing the evidence and noise oracle:
  - Let the quantity to estimate be a number (e.g., between 0 and 100).
  - Each participant gets a private signal: a sample from a distribution centered at the true value with a standard deviation that varies. The noise oracle gives a hint about this standard deviation (but with 30% error rate).

  How to implement traceable vs. bare:
  - Traceable: In some cases, the peer's evidence card might have a visible error (e.g., a misprint, or a step in reasoning that is flawed and can be seen when they share their reasoning). Alternatively, we can have a "channel" that sometimes flips the evidence, and the participant can see that the peer's evidence was flipped (if they are shown the channel output).
  - Bare: Just a different sample from the same distribution, and the noise oracle might be wrong so they think the evidence is less/more noisy than it is.

  We need to design the cards and the pairing.

  Timeline (90 minutes):
  0:00 - 0:05 (5 min): Introduction to the session. Explain that they will be making estimates of unknown quantities, and they will have private information. They will then discuss with a partner and update. Emphasize that the goal is to get the best estimate and that their scores (for the leaderboard) depend on accuracy. Do not mention disagreement or theories.

  0:05 - 0:15 (10 min): Round 1 - First estimates.
     - Each participant gets a card with:
          - A private signal (e.g., "The true value is 50 plus a random error from a normal distribution with standard deviation 10" but we don't say that, we give a number. Actually, we give a sample: e.g., "Your measurement: 63.4").
          - A noise oracle reading: e.g., "The noise level of your measurement is: Low" (meaning the standard deviation is 5) or "High" (meaning 15). But the oracle is 70% reliable. How do we set this up?
     - We need a true value for the round. Let's fix a true value (e.g., 60) for the first round.
     - Each participant gets a signal: signal = true_value + error, where error ~ N(0, actual_sd). The actual_sd is either low (e.g., 5) or high (e.g., 15) for each participant. But we don't tell them the actual_sd, we only give the oracle reading which is correct 70% of the time.
     - How to assign actual_sd? We can randomly assign: 50% low, 50% high, then for each, with 70% probability the oracle says the correct level, 30% wrong.

     - Steps:
          a. Each participant receives a card with:
              - Their measurement (a number)
              - Noise oracle: either "Low" or "High"
          b. They are told: "Based on this, give your best estimate of the true value." They write down their estimate and their name on a sheet (for scoring later).

  0:15 - 0:30 (15 min): Round 1 - Pairing and updating.
     - Pair participants randomly. Each pair is assigned a type: either "bare" or "traceable". We'll do about half and half.
     - For bare pairs: They simply share their measurement and their oracle reading. They do not see each other's reasoning, just the numbers and the oracle label. Then they discuss and each revises their own estimate. They are allowed to update in any way they want. They record their revised estimate.
     - For traceable pairs: We need to introduce a traceable error. How?
          Option: In the traceable condition, one of the two participants (randomly chosen) has a "corrupted" evidence. We can mark on the card of the peer that the evidence was corrupted (but the holder doesn't know). When they meet, the participant with the corrupted evidence is instructed to show their evidence as is, but the other participant is given a special note: "You can see that your partner's evidence was transmitted through a noisy channel that added an extra error of +10 (or -10)." So they can see the specific error. Alternatively, we can have a reasoning step: the participant with the traceable error is given a reasoning task that they might have made a mistake on, and when they share their reasoning, the partner can see the mistake.

     To keep it simple, let's use the "corrupted channel" method.

     Steps for traceable:
          - One participant (randomly chosen) in the pair has a card that says (only visible to the experimenter) that their evidence was corrupted by +10 (or -10). The other participant in the pair gets a note that says: "When you see your partner's evidence, you will notice that it has been corrupted by an extra +10 (or -10) due to a transmission error." So when they meet, the second participant sees the partner's evidence and knows that it is off by +10. They can then adjust.

     - In both types, after discussion, each records a revised estimate.

  0:30 - 0:35 (5 min): Scoring for Round 1. Collect the revised estimates and reveal the true value. Compute scores (using a quadratic scoring rule) and update the leaderboard.

  Round 2: Introduce self-erosion. We want pairs to disagree about how much they should have updated in Round 1.

  0:35 - 0:50 (15 min): Round 2 - The quantity to estimate is the "appropriate update percentage" from the previous round for a designated pair.

     - We select one pair from Round 1 (or more, but for simplicity, we can do one pair and have everyone estimate about that pair). We need to design this.

     Idea: Each participant is now given a description of a hypothetical disagreement scenario that is similar to what they experienced. But to make it personal, we can use their own round.

     Alternatively: We pair participants again, but this time the quantity to estimate is: "In the pair you were in during Round 1, what percentage should you have moved from your initial estimate to your revised estimate? (i.e., if you moved from A to B, the update percentage is |B-A|/|initial difference|? or maybe the weight you put on the peer?)"

     But note: they already updated. We want them to estimate the appropriate update for that situation.

     We can reframe: We tell them that we are going to re-run the same Round 1 scenario, but now we want them to estimate the ideal weight they should have placed on their own estimate vs. their partner's. The true value we are after is the weight that would have minimized the expected squared error (but we can compute that from the setup).

     However, this might be too meta. Let's try:

     - Each participant is asked: "Consider the disagreement you had in Round 1. What fraction of the difference between your initial estimate and your partner's initial estimate should you have moved? (e.g., if you moved 30% of the way, that would be 0.3)."

     But note: they might not remember exactly.

     Alternatively, we can give each participant a summary of a Round 1 scenario (not their own) and ask for an update percentage. We create two scenarios: one traceable and one bare. Then we assign half the participants to one scenario and half to the other.

     Steps:
          - We create two scenarios (based on typical Round 1 data, but we can make them up if needed). For example:
              Scenario A (bare): 
                  Participant X: initial estimate 55, noise oracle "Low"
                  Participant Y: initial estimate 65, noise oracle "High"
              Scenario B (traceable): 
                  Participant X: initial estimate 55, noise oracle "Low", but note: in the traceable scenario, one of them had a corruption. So we can say:
                  Participant X: initial estimate 55, noise oracle "Low"
                  Participant Y: initial estimate 70, noise oracle "Low", and there was a transmission error: Y's evidence was corrupted by +10.

          - Then we ask: "In Scenario A, what fraction of the way from X's initial estimate to Y's should X have moved (if at all)?" and similarly for Scenario B.

          - But note: we want them to have a private signal and then update after seeing a peer.

          How about: Each participant gets a private signal about the appropriate update fraction for a given scenario? But that's abstract.

     Alternatively, we can have them reason without private signals. We want to induce disagreement about the update rule.

     Revised plan for Round 2:
          - We assign each participant to one of two groups. Each group gets a different scenario (either bare or traceable) and a different "expert advice" about how to update in that scenario.

          But we want them to have private evidence and then meet a peer with a different view.

          Let's do:
              - Each participant is given a scenario (either A or B) and then a "theoretical prior" signal. We can give them a reading from a "disagreement resolution expert" that suggests a weight (say, 0.5 for bare, 0 for traceable) but with some noise. Then they meet someone who had the same scenario but a different expert reading.

          Steps:
              a. Each participant gets:
                  - A scenario description (either bare or traceable, but we assign half the group to bare and half to traceable, but then they meet within the same scenario?).
                  - A private signal: a suggested update weight from an "expert system" that is noisy. The true appropriate weight for bare is 0.5 (they should meet halfway) and for traceable is 0 (they shouldn't move). But the expert system is noisy: it gives a number centered at the true weight with some error.

              b. They are asked to give their best estimate of the appropriate update weight for that scenario (a number between 0 and 1).

              c. Then they pair up with someone who had the same scenario but a different expert reading. They share their suggested update weight and update to a revised weight estimate.

              d. Then we reveal the true appropriate weight (which we set as 0.5 for bare and 0 for traceable) and score them.

          However, note that the true appropriate weight depends on the actual situation. In the bare scenario, if both are peers, the rational move is to average (if they have equal reliability). But in the traceable scenario, if you know the other's evidence is corrupted, you don't move. So we can set the true weight accordingly.

          But we want to induce disagreement about the update rule itself, and then have them update.

  0:50 - 1:05 (15 min): Round 2 - Pairing and updating for the weight estimate.

  1:05 - 1:10 (5 min): Scoring for Round 2.

  1:10 - 1:25 (15 min): Round 3 - Self-erosion. Now we turn to disagreement about the disagreement rule.

     - We pair participants and ask them to estimate: "In the previous round (Round 2), when you updated your estimate of the appropriate update weight, what fraction of the way should you have moved toward your partner's estimate of the weight?"

     - This is now about the rule for updating the rule.

     - We don't give any new evidence. They are to use their own judgment. We expect that some will apply the same rule they used in Round 1, and others might see this as different.

     - Steps:
          a. Each participant is asked to write down an initial estimate: the fraction they think they should have moved in Round 2 (for the weight update).
          b. Then they pair with someone and share their estimates. They update to a revised estimate.
          c. But what is the true value? This is tricky. We might not reveal a true value, or we can set it arbitrarily? Actually, we can skip the true value and just have them update and notice the tension.

     Alternatively, we can frame it as: "Given that in Round 2 you and your partner had different estimates of the appropriate update weight for Scenario A (or B), and then you updated to a new weight, how much should you have updated? (i.e., what fraction of the difference should you have moved?)"

     But note: they did update in Round 2. We are asking about that update.

     We can avoid scoring this round and just use it for discussion.

     Revised: We don't score Round 3. Instead, we use it to set up the debrief.

  1:25 - 1:30 (5 min): Collect Round 3 estimates (but no scoring).

  Debrief: 1:30 - 1:45 (15 min)

  The debrief should map specific moments in the activity to the philosophical moves.

  Key points to draw out:
  - In Round 1, in bare disagreements, many participants probably moved toward their partner (maybe halfway). In traceable, they might have moved less (or not at all) because they could see the error.
  - Ask participants: "In the traceable case, did you feel like you were still in a peer disagreement? Or did the traceable error make you feel that your partner was no longer a peer in that instance?"
  - Then note that in Round 2, when they were estimating the update weight, they might have had different initial ideas and then updated toward each other. But then in Round 3, they were asked how much they should have updated in Round 2. Some might have felt that the same rule applies, others might have thought it was different.
  - Introduce the terms conciliationism and steadfastness only now. Explain that conciliationism says that in cases of peer disagreement you should move toward the other, while steadfastness says you can stick to your guns. But note that the traceable case might not be considered a peer disagreement because the error breaks the peer status.
  - Then raise the self-erosion: In Round 3, if they applied conciliationism to the disagreement about the update rule, then they are moving toward the other's view about conciliationism. But if the other person is a steadfastner, then they are moving away from conciliationism. This seems to undermine the rule. Is that a problem? Or is it the rule working as intended?

