  0:05-0:15: Round 1 - Private estimates
      - Distribute cards for Round 1.
      - Participants write their initial estimate (based on their measurement and oracle) on a sheet.

  0:15-0:30: Round 1 - Pairing and updating
      - Announce pairs (or groups). For traceable pairs, also hand out the corruption note to the non-corrupted member.
      - Instructions: "Discuss with your partner and then write down a revised estimate. You may update in any way you wish. For some pairs, there may be additional information about the evidence (as noted)."
      - They discuss and record revised estimates.

  0:30-0:35: Scoring Round 1
      - Reveal true value (60).
      - Collect initial and revised estimates. Compute scores for both (but only the revised will count for the leaderboard? Or both? We can score both and update the leaderboard for the revised only, but show them how they did on the initial too for feedback).
      - Update leaderboard.

  0:35-0:50: Round 2
      - Distribute cards (Scenario A or B and expert reading).
      - Explain: "In this round, you are estimating the appropriate update weight for a scenario. The update weight is the fraction of the way from X's initial estimate to Y's initial estimate that X should move. For example, if X starts at 55 and Y at 65, and the weight is 0.5, then X should move to 60. You are given an expert system suggestion. Write down your initial estimate of the appropriate weight."
      - They write initial weight estimate.
