  I've believed some version of epiphenomenalism since I encountered Huxley's version of the view as a first-year, and I've decided to try to defend it in my master's thesis rather than keep writing about it from the outside. My supervisor's reaction was that the self-stultification objection — the one about how, if experiences cause nothing, then my reports about them aren't really about them and my beliefs about them aren't really warranted — had been dealt with years ago and wasn't worth a chapter. I can't see that it was, so I've written the objection out as carefully as I can, in the hope that it either stands or visibly breaks. Here it is, with the steps separated so they can be attacked one at a time.

  (1) Tracking: S knows that p only if, in the nearest possible worlds in which p is false, S does not believe that p. (I mean this in the ordinary counterfactual style associated with Nozick; I'm not assuming closure in either direction, and I'm not assuming it is the whole of knowledge — I only need it as a necessary condition.)
  (2) Epiphenomenalism: phenomenal states are effects of physical states and causes of nothing physical; in particular they cause none of my beliefs, utterances, or diary entries.
  (3) So for any phenomenal fact F about me — say, that I am in pain now — there are possible worlds in which F does not obtain, my entire physical history is exactly as it actually is, and I believe that F obtains just as I actually do.
  (4) Those worlds differ from actuality in strictly fewer respects than any world in which my physical history changes as well, so the nearest worlds where F is false are among them.
  (5) So my belief that I am in pain does not track the fact that I am in pain. I do not know that I am in pain, and by repetition I know no phenomenal fact about myself at all.
  (6) But the arguments that moved me to the view in the first place — the knowledge argument, the conceivability of a physically identical being with no experience, the explanatory-gap argument — are all arguments from what my experience is like, and each of them presupposes that I know that. If (5) is right, the view saws off the branch it is sitting on: I cannot so much as know that there are experiences for it to be true of that they do nothing.
  (7) And here is the part that actually worries me, more than (6) does. Nothing in (1)–(5) uses the word phenomenal in any essential way. Substitute any class of states whose obtaining is said to make no causal difference to what I believe. Most of the physicalists I argue with say exactly that about semantic properties — that whether my noise means that snow is white makes no difference to what my neurons do — and about the rational relation between premises and conclusion, which they take to be implemented by, and to be nothing over and above, the neurophysical story. Run (1)–(5) with those substituted and I get that I do not know what I believe and do not know that my conclusions follow from my premises, hence that I do not know that (1)–(5) are sound. That is too much. An argument that refutes every position in the philosophy of mind at once, including my opponents', has refuted nothing.

  So: which step goes, and what does giving it up cost me? I would rather keep (2) than (1), obviously, since the view is what I am trying to defend, but I would like to know whether I am being sold a lemon. Two repairs I have attempted, in case they are the answer or in case they are themselves the mistake. First, the shadow reply: suppose phenomenal facts, while causally inert, are nomologically glued to the physical facts tightly enough that every nomologically possible world in which I am not in pain is one in which my physical state, and hence my belief, differs; then tracking is restored without giving up (2), and the objection gets its force only by smuggling in metaphysically possible worlds that break the laws. I distrust this, because a correlation law that strong looks either like identity under another name or like a brute, and if the phenomenal is tied to the physical that tightly I do not see why it is not doing causal work through its correlate. Second, a friend points out that epiphenomenalists are generally epiphenomenalists about qualitative character only and not about intentional content, even though the argument that motivates epiphenomenalism — causal closure plus the worry about overdetermination — looks as though it should swallow both; if that asymmetry is unstable, then perhaps (2) has to be restated as a thesis about properties rather than about events or tokens, and perhaps that restatement is precisely what breaks the inference to (3). I do not trust either of my own fixes. What I want is the actual diagnosis: the step that fails, the reason it looked like a good step, and the price of each alternative — in particular, whether any of the repairs leaves me able to say, from inside the view, that I know what my own experience is like.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're working on a master's thesis defending epiphenomenalism, specifically addressing the self-stultification objection. Their supervisor dismissed the objection as already resolved, but the user isn't convinced and has laid out a structured argument with seven steps. They want to know which step fails and why, and they're concerned that similar reasoning could undermine other areas like semantic properties or rational relations.

  First, I need to understand each step of their argument. Step 1 uses Nozick's tracking condition for knowledge. Step 2 is the core of epiphenomenalism: phenomenal states have no physical effects. Step 3 follows that in worlds with identical physical states but no pain, the belief about pain remains. Step 4 claims these worlds are closer than those where physical states differ. Step 5 concludes that beliefs about phenomenal states don't track reality, so no self-knowledge. Step 6 argues this undermines the arguments for epiphenomenalism itself. Step 7 extends the problem to semantic and rational properties, leading to global skepticism.

  The user's main concern is Step 7 because if the argument invalidates all positions in philosophy of mind, it becomes self-defeating. They’ve tried two fixes: the shadow reply (nomological necessity) and distinguishing qualia from intentional content, but they're unsure. They want to preserve epiphenomenalism but need a coherent way to claim self-knowledge.

  I recall that the tracking condition (Step 1) is controversial. Nozick's theory is externalist and doesn't require internal access to tracking mechanisms. But in epiphenomenalism, the issue is that the belief isn't counterfactually dependent on the phenomenal state. However, maybe the problem is with Step 4. The user assumes that worlds with identical physical histories but different phenomenal states are closer than worlds where both differ. But is that true under standard possible worlds semantics? Closeness might prioritize similar laws or minimal physical changes. If the laws link physical and phenomenal states, then worlds breaking that link might be farther than those with minor physical variations. That supports the shadow reply the user mentioned but is skeptical about.

  The shadow reply relies on nomological necessity. If phenomenal states supervene on physical states with nomological necessity, then worlds with different phenomenal states but same physical states would violate laws, making them more distant. So the nearest worlds where pain is absent might involve physical differences, satisfying tracking. But the user worries this makes epiphenomenalism collapse into identity or overdetermination. However, epiphenomenalists can argue that supervenience is brute—no causal work, just a law-like connection. That might preserve the view without overdetermination.

  Another angle is Step 3. It assumes that physical duplicates without pain are metaphysically possible. But if physicalism is true, such worlds might not be possible. The user is an epiphenomenalist, which is a form of property dualism, so they likely accept these worlds as possible. But Step 7's worry is that the same argument applied to semantic properties would lead to skepticism about beliefs and reasoning. Here, maybe the difference is that semantic properties, if realized physically, could have tracking through their physical bases. But if semantic properties are causally inert, the same problem arises. So the user's concern about global skepticism is valid.

  The key might be distinguishing epistemic access. For phenomenal states, direct acquaintance might provide justification independent of tracking. But Step 1 is a necessary condition, so even if other conditions are met, tracking failure would still negate knowledge. However, maybe tracking isn't necessary for all knowledge types. Self-knowledge of phenomenology might rely on a different mechanism, like introspection, which doesn't require counterfactual dependence. But that would require rejecting Step 1, which the user wants to avoid.

  Considering Step 4's reliance on possible worlds similarity: if we prioritize nomological consistency, then worlds with same physics but different phenomenology are more distant. That defends Step 4 but depends on accepting nomological necessity. The user's shadow reply might work after all. Their distrust about it leading to identity or overdetermination could be addressed by maintaining that supervenience is non-causal. For example, emergent properties can supervene without causing downward effects.

  The user's friend’s point about qualia vs. intentional content highlights a tension. If intentional content is also epiphenomenal, then beliefs about anything would be unknowable. So epiphenomenalists might need to treat intentional content as physical to avoid global skepticism. But that asymmetry might be unstable, as the causal closure argument could apply equally. However, perhaps content can be reduced to physical states, whereas qualia cannot, allowing intentional states to have causal efficacy through their physical bases.

  In conclusion, the best defense is the shadow reply. Step 4 fails because the nearest worlds without pain are those with physical differences, not identical physics. This preserves tracking without abandoning epiphenomenalism. The cost is accepting brute nomological supervenience, which some find unsatisfying, but it's coherent. This also addresses Step 7 by not applying to semantic properties if they're physically realized and thus track through their bases. So the user can retain epiphenomenalism and self-knowledge by refining their account of possible worlds closeness.
answer: |-
  This is a sharp and admirably self-critical articulation of the self-stultification problem. Your supervisor is likely recalling standard replies, but your version exposes deeper tensions. The flaw lies primarily in **Step 4**, and defending against it requires embracing a specific interpretation of the "shadow reply" – but there *is* a cost, and it relates directly to your Step 7 concern.

  Let's break down the diagnosis:

  1.  **Steps 1-3 are (arguably) sound within your framework:**
      *   (1) Tracking (Nozick-style) is a defensible *necessary* condition for knowledge. Rejecting it wholesale for phenomenal knowledge is drastic.
      *   (2) Epiphenomenalism is your thesis.
      *   (3) Follows logically from (2): If phenomenal state F has *no* physical effects, then a world physically identical to actuality but lacking F is metaphysically possible. Your beliefs/utterances about F are physically constituted, so they remain unchanged.

  2.  **Step 4 is the Critical Weak Point:**
      *   **The Claim:** Worlds where F is false but the physical history is identical (hence your belief that F is true remains) are *closer* to actuality than any world where the physical history (and thus your belief) changes.
      *   **The Problem:** This relies on a specific, highly contestable **metric of similarity** between possible worlds. Standard Lewis-Stalnaker semantics for counterfactuals generally prioritizes:
          *   **Minimal Violation of Laws:** Worlds that break the actual laws of nature are typically considered *farther away* than worlds that preserve the laws but have small differences in particular facts.
          *   **Minimal Miracles:** Worlds requiring "big miracles" (gross violations of actual laws) to branch off are farther than worlds requiring "small miracles" or none.
      *   **Why Step 4 Fails:** A world `w1` where the entire physical history is identical to actuality *but F is absent* **requires a massive violation of the actual psychophysical laws** (assuming epiphenomenalism + supervenience). According to epiphenomenalism, specific physical states P *nomologically necessitate* phenomenal state F (it's a brute correlation). In `w1`, P occurs but F does not. This breaks the actual law `P → F`. This is a *major* divergence.
      *   **The Closer Worlds:** The *nearest* worlds where F is false are worlds where the *physical cause* of F (call it P) is also absent or altered *in a way consistent with the actual laws*. In these worlds `w2`, the physical history *is* different (P is absent/altered), and consequently, the physical state causing your *belief* about F is also likely different (or absent), meaning you likely *don't* believe F. These worlds `w2` preserve the actual laws (`P → F` holds; F is absent because P is absent/altered). They involve a smaller miracle (a small change in the initial conditions leading to P being absent, or a small change in P itself) compared to the massive law-breaking miracle required for `w1`.

  3.  **Consequence for Step 5:**
      *   If the nearest worlds where F is false are `w2` (where P and your belief are altered), then in those worlds, you *do not* believe F.
      *   Therefore, your belief that F *does* track the fact that F: In nearby worlds where F is false, you don't believe it. Tracking (as defined in (1)) is satisfied. Your phenomenal self-knowledge is safe *from this particular objection*.

  4.  **Addressing Step 6:**
      *   With Step 4 rejected (as argued above), Step 5 fails. Your belief about your pain *does* track the phenomenal fact. You *can* know what your experience is like. The arguments for epiphenomenalism (Knowledge Argument, etc.), which rely on knowing your phenomenal states, are not self-undermining *on this specific tracking ground*. The branch isn't sawn off.

  5.  **Tackling Step 7 (Your Deep Worry) - The Cost of the Repair:**
      *   The repair above *is* the "shadow reply." Its success hinges on **strong, brute nomological supervenience**: Specific physical states *nomologically necessitate* specific phenomenal states as a matter of fundamental law, even though the phenomenal states are causally inert.
      *   **The Cost:** This is precisely what makes you uneasy. It posits a **brute, non-causal correlation**. This is the price of saving self-knowledge while maintaining epiphenomenalism.
          *   *Why it's not obviously identity:* Identity is a stronger claim (metaphysical necessity, not just nomological). The brute correlation allows for the *metaphysical possibility* of zombies (worlds like `w1`), but insists they are *distant* due to law-breaking. Identity denies the metaphysical possibility of zombies outright.
          *   *Why it avoids causal overdetermination:* The phenomenal state is an *effect* of P, but does not *cause* the belief. The belief is caused *only* by the physical state realizing it, which is also caused (directly or indirectly) by P. P causes both F and the belief-token about F. F itself causes nothing physical. There's no overdetermination of the belief; only P is doing the causing. The correlation is law-like, but F plays no causal *role* in producing the belief.
      *   **The Step 7 Challenge (Semantics, Rationality):** Does this save semantic and rational properties? *Not necessarily in the same way.* The crucial difference is **access**.
          *   *Phenomenal Properties:* According to the epiphenomenalist, we have *direct, non-inferential* access to our own phenomenal states via acquaintance (or something analogous). The tracking condition is satisfied *because* of the brute nomological link *plus* this direct access mechanism. The belief is *about* the phenomenal state *because* of this direct connection, even if the state doesn't cause the belief.
          *   *Semantic/Rational Properties:* Physicalists typically *deny* we have direct, non-inferential access to the semantic content of our thoughts or the abstract rational relations between propositions. Our knowledge of these is *inferred* or *constituted by* our physical states. If semantic properties *themselves* are epiphenomenal (a view some physicalists *do* hold, e.g., certain eliminativist or purely syntactic views), then **Step 7's argument applies with full force**. In worlds physically identical but lacking the semantic property (e.g., my utterance doesn't *mean* snow is white), I still believe it does (because the physical state is the same). If we prioritize minimal law-breaking, those worlds are *closer* than worlds where the physical state changes. Tracking fails. Knowledge of semantics evaporates.
          *   *The Asymmetry:* Most physicalists (and many epiphenomenalists about qualia) **do not treat intentional content as epiphenomenal in the same way**. They typically hold that semantic properties are either:
              *   *Reducible:* The semantic property *just is* a complex physical/computational property, which *is* causally efficacious in virtue of being physical. Tracking holds via the physical base.
              *   *Realized & Causally Relevant:* Even if not strictly identical, semantic properties are realized by physical properties that do the causing, and they inherit causal relevance via the realization relation (e.g., the "subset" view of realization). Tracking holds via the realizer.
          *   **Conclusion for Step 7:** Your argument *does* threaten genuinely epiphenomenalist views of semantics/rationality. However, most physicalists (and epiphenomenalists about qualia) *reject epiphenomenalism for these properties*. They accept that the *physical realizers* of semantic/rational states *are* causally efficacious, satisfying tracking. The argument only refutes positions that make *everything* epiphenomenal – which are rare and arguably self-undermining in a more profound way. It doesn't refute all positions, only radically epiphenomenalist ones about semantics/rationality. The cost of saving phenomenal knowledge is accepting a brute law; saving semantic knowledge requires rejecting epiphenomenalism for semantics.

  **The Verdict:**

  *   **The Failing Step:** **Step 4.** The worlds with identical physical history but absent F are *not* the nearest worlds where F is false. They require massive law-breaking. The nearest worlds are those where the physical antecedent P is altered, preserving the laws, and typically altering the belief as well.
  *   **The Reason it Looked Good:** It naively assumes that physical identity guarantees maximal closeness, ignoring the critical role that *preserving the actual laws of nature* plays in the similarity metric for counterfactuals.
  *   **The Price of the Repair (Shadow Reply):** You must embrace **strong, brute nomological supervenience** of the phenomenal on the physical. This non-causal, law-like glue is essential to ensure tracking by making law-breaking worlds distant. It feels like a "dangling law" to many, and explaining *why* this specific correlation holds is deeply mysterious. But it is coherent.
  *   **Does it Save Self-Knowledge? Yes.** Combined with direct acquaintance (which epiphenomenalists typically assume), this repair allows you to say you know your phenomenal states. The tracking condition is satisfied in the nearest possible worlds.
  *   **Step 7 Worry Mitigated:** The repair *only* directly saves knowledge of properties where we have a privileged access mechanism (like phenomenal acquaintance) *and* brute nomological supervenience. It does *not* save genuinely epiphenomenalist views of semantics or rationality. The asymmetry is stable *if* you deny epiphenomenalism for intentional content, which most physicalists and many property dualists do. The argument only devastates views that make *all* mental properties epiphenomenal.

  **Recommendation for Your Thesis:** Defend the shadow reply vigorously. Acknowledge the cost (the brute law) but argue it's less problematic than abandoning epiphenomenalism or phenomenal self-knowledge. Explicitly address Step 7 by arguing that intentional properties *need not and should not* be given the same epiphenomenalist treatment as phenomenal properties, precisely to avoid the global skepticism trap. The causal closure argument only forces epiphenomenalism for properties that cannot be integrated into the physical causal web *as physical properties or via causally efficacious realizers* – which qualia arguably cannot, but intentional content arguably can. This maintains the asymmetry. Your argument powerfully shows why epiphenomenalism about *everything* mental is untenable, but that's a feature, not a bug, for your defense of epiphenomenalism about *qualia* specifically.
