prompt: |-
  I am writing the chapter of my dissertation in which the standards of adequacy for an account of mental causation get fixed, and I want the specification settled before I begin scoring candidate views. I have read enough of the surrounding literature to recognise the standard moves, so please do not survey it, attribute positions to authors, or hand me a reading list: I want requirements, each with the case or consideration that earns it a place on the list, together with your judgement about which of the things people demand in this area are genuine desiderata and which are prejudices of one camp.

  The purpose against which adequacy is to be measured is fixed, and I would like the list held to it. The theory must vindicate the claim that an agent's reasons can explain her action in a way that could bear on moral responsibility: not merely predict the action, not merely redescribe it in mental vocabulary, and not merely rationalise it after the fact. An account that secures causation for the mental only by making mental properties causally idle summaries of neural goings-on fails for this purpose, and I would rather that failure be recorded as a requirement on the list than silently assumed.

  Here is the pile of demands I have collected. For each, tell me whether it is a genuine desideratum, a demand that presupposes the answer against one family of views, or a preference of a camp; rewrite the genuine ones into a form that does not beg the question; and add the requirements I have missed.

  1. The theory must respect the causal closure of the physical, or else say exactly which formulation of closure it rejects and why the formulation its opponents use is stronger than anything physics supports. My suspicion is that the premise usually written down (roughly, that every physical event with a cause has a physical cause) is weaker than what the exclusion reasoning needs, and that the difference becomes visible if microphysics turns out to be indeterministic.
  2. It may not buy room for the mental by appealing to indeterminacy at the micro-level without saying why the resulting probabilities are not themselves fixed by prior physical goings-on.
  3. It must not let the exclusion reasoning generalise: if the argument drains causal work from the mental, it seems equally to drain it from temperature, from the brittleness of glass, and from the special sciences generally, and a view that stops the argument only at the mental looks ad hoc.
  4. It must not make the causal status of the mental hostage to how complete physics happens to be at a given time; a theory that predicts mental causation is refuted by further neuroscientific detail is, I think, disqualified.
  5. It must respect a set of distinctions I take to be non-negotiable candidates: causation by a property versus causation by a particular event; causation versus causal explanation; difference-making versus production; symmetric overdetermination versus preemption; and the causal relevance of a state versus the agent's exercising control in acting on it.
  6. It must handle the case in which the mental cause and its physical realiser come apart in time: a long-standing intention is cited as the cause of an action performed months later, though nothing that realised the intention when it was formed still exists. Say what the causal relation relates, and what the requirement rules out.

  Two further cases are of my own construction, and I want every candidate scored on them. The first: a single belief, with one content, is realised twice over inside one nervous system, each realiser sufficient on its own for the behaviour and one of them actually pre-empting the other. Does the mental cause survive, and does your answer differ if the two realisers had different contents? The second: the state that does the causal work is subpersonal, in the sense that it is not a state the agent could cite as her reason even on ideal reflection. If a theory allows such a state to be the cause of action, I want to know whether it has thereby given up the thing my chapter needs, and whether that is a cost or a discovery.

  Finally, three things I most want from you. First: is any subset of the retained desiderata jointly unsatisfiable, and if so which one would you drop and what does dropping it cost — I suspect the list itself is a result here. Second: which single requirement does the most exclusionary work? Third: mark which requirements hold only relative to the responsibility-focused purpose I have fixed, and say where the list forces a decision about what causation itself is, since I suspect much of the dispute is a fight about that question conducted at one remove. Keep any scoring of the live candidate families to a short paragraph each, described by their structural claim rather than by name.
reasoning: |-
  Okay, the user is writing a dissertation chapter on mental causation, specifically focusing on setting standards of adequacy for theories. They want to ensure mental causation can support moral responsibility - that reasons genuinely explain actions, not just predict, redescribe, or rationalize them. They've collected several demands and want me to evaluate each, rewrite genuine desiderata without question-begging, add missing requirements, and answer specific questions about conflicts and exclusionary power.

  First, I need to understand their core purpose: vindicating reasons-explanation for moral responsibility. Any theory that reduces mental properties to causally idle summaries fails this. They're wary of biases in existing literature, so I'll avoid attributing positions. Their list has six items plus two original cases. I need to assess each demand as genuine desideratum, question-begging, or camp preference.

  Looking at their demands: 
  1. Causal closure of the physical - genuine but needs reformulation. The exclusion argument often uses stronger closure than physics requires, especially with indeterminism. 
  2. Indeterminacy at micro-level - genuine, but should emphasize that mental properties must add explanatory value beyond physical probabilities. 
  3. Generalization of exclusion - genuine; stopping at mental properties looks ad hoc without principled reason. 
  4. Hostage to physics' completeness - genuine; mental causation shouldn't depend on current scientific knowledge. 
  5. Distinctions - mostly genuine but some might be camp preferences. Property vs event causation is crucial, while difference-making vs production might be contentious. 
  6. Temporal separation - genuine; need to explain how past intentions cause future actions without continuous realization.

  Their two cases: 
  - Double realization: Tests whether mental causation survives overdetermination. Crucial for property causation views. 
  - Subpersonal states: Challenges if reasons must be accessible to the agent. Vital for moral responsibility link.

  I should add missing requirements: 
  - Mental causes must be reason-responsive. 
  - Mental properties must be non-redundant in causal chains. 
  - Distinguish causation from causal explanation clearly. 
  - Ensure reasons have appropriate fineness of grain for responsibility assessments.

  For their specific questions: 
  - Tensions exist between causal closure/property distinctness and non-redundancy/generalization. I'd prioritize non-redundancy for moral responsibility. 
  - The most exclusionary requirement is the non-redundancy of mental properties. 
  - Several requirements are purpose-relative: reason-responsiveness, accessibility, non-idleness. The list forces decisions on what causation is - particularly whether it's about properties or events, and if explanation is part of causation.

  When scoring candidate views: 
  - Reductionism fails non-redundancy. 
  - Non-reductive physicalism struggles with exclusion but can handle generalization. 
  - Dualism violates causal closure. 
  - Emergentism risks physical incompleteness issues. 
  - Dispositionalism handles temporal separation well but may have fineness-of-grain problems.

  The user is clearly deep in this topic and wants to cut through rhetorical positions. I'll focus on structural analysis while respecting their expertise. The moral responsibility angle is key - every evaluation must tie back to whether reasons can genuinely explain actions in accountability contexts.
answer: |-
  Here's a distilled set of requirements, critically assessed against your purpose (vindicating *reasons-explanation* for moral responsibility), with genuine desiderata rewritten neutrally, omitted demands flagged, and key additions. The list prioritizes structural adequacy over camp allegiance.

  ### Genuine Desiderata (Rewritten Neutrally)
  1.  **Non-Redundancy Requirement:** *The mental property cited in the explanation must make a non-redundant contribution to the causal production of the action, such that the action would not have occurred in that specific way (or at all, in relevant counterfactuals) without the agent having that specific mental property.*
      *   **Case/Earning Place:** Your core purpose (predict/redescribe/rationalize failure). Rules out epiphenomenalism, mere supervenience, and "idle summary" views. Forces causation by the *property*, not just the event.
      *   **Judgement:** Genuine, central, purpose-defining.
  2.  **Physical Causal Completeness Accommodation:** *The account must be compatible with the principle that every physical effect has a sufficient physical cause (at the time of the effect), or explicitly reject a specific formulation of physical causal completeness while demonstrating why the rejected formulation is either metaphysically untenable or unnecessary for physics.*
      *   **Case/Earning Place:** Avoiding interactionist dualism's conflict with fundamental physics. Your suspicion about indeterminism is correct – completeness often smuggles in *deterministic* sufficiency. Requires specifying *which* completeness principle is engaged.
      *   **Judgement:** Genuine constraint. Rewritten to avoid assuming *how* completeness holds (e.g., deterministically vs. probabilistically).
  3.  **Anti-Generality Requirement:** *The account must provide a principled distinction between mental causation and causation by special science properties (e.g., temperature, brittleness), such that the reason-explaining role of the mental is secured without implying either the epiphenomenalism or the unacceptable overgeneration of "causes" for all special science properties.*
      *   **Case/Earning Place:** Exclusion argument generalization. A view stopping only at the mental *is* ad hoc without this principle. Vindicates the reality of special science causation while potentially marking the mental's unique role.
      *   **Judgement:** Genuine. Forces the account to locate mental causation within a broader metaphysics of levels.
  4.  **Temporal Separation Requirement:** *The account must explain how a mental state existing at t1 (e.g., an intention) can be a cause of an action at t2, even if no physical state realizing that specific mental state at t1 persists continuously until t2.*
      *   **Case/Earning Place:** Explaining long-term planning, habits, skills. Rules out token-identity and simple counterfactual accounts relying solely on contiguous realization. Requires specifying the relata (persisting state? property instance? abstract type?) and causal mechanism (e.g., structuring cause, dispositional grounding).
      *   **Judgement:** Genuine. Tests the ontology of mental states and causation over time.
  5.  **Distinction Requirements (Selectively Retained):**
      *   **Property Causation vs. Event Causation:** *The account must distinguish between causation *by an event* (the particular) and causation *in virtue of a property* instantiated by that event.* (Genuine, essential for Non-Redundancy).
      *   **Causal Relevance vs. Agentive Control:** *The account must distinguish between a state/property being causally relevant to an outcome and the agent *exercising control* by acting *on* that state as a reason.* (Genuine, crucial for responsibility - relevance is necessary but not sufficient for control).
      *   *(Omitted as Non-Negotiable Camp Preferences/Distractions: Symmetric overdetermination vs. preemption (often presupposes specific causation ontology); Difference-making vs. production (deeply contentious metaphysical divide); Causation vs. causal explanation (your purpose *links* them tightly for reasons-explanation).)*
  6.  **Indeterminacy Accountability Requirement:** *If the account appeals to microphysical indeterminacy to secure mental causation, it must explain how the mental property determines or influences the probabilities of outcomes in a way that is not itself fully fixed by prior microphysical conditions and properties.*
      *   **Case/Earning Place:** Prevents "indeterminism as magic dust" where mental properties get credit for randomness. Demands genuine *top-down* determination or constraint.
      *   **Judgement:** Genuine constraint on appealing to indeterminism.

  ### Missing Requirements (Added)
  7.  **Reason-Responsiveness Requirement:** *The account must allow that the mental cause (the reason) is such that the agent would (or could) have acted differently *for a different reason* under relevantly different circumstances, reflecting rational assessment.*
      *   **Case/Earning Place:** Moral responsibility. Explaining action *as rational* requires the cause to be sensitive to the rational landscape. Rules out deviant causal chains and brute physical determination of behavior irrespective of content.
      *   **Judgement:** Genuine, purpose-defining extension of Non-Redundancy.
  8.  **Accessibility Constraint (Purpose-Relative):** *For the specific purpose of reasons-explanation bearing on moral responsibility, the causally relevant mental state must be potentially accessible (in principle, under ideal reflection) to the agent *as her reason*.*
      *   **Case/Earning Place:** Your subpersonal state case and moral responsibility. If the "real" cause is utterly subpersonal/inaccessible, the agent cannot be responsible *for acting on that reason*. Doesn't deny subpersonal causation, but denies it qualifies as a *reason*-explanation for responsibility.
      *   **Judgement:** Genuine *for your specific purpose*. Marks a boundary for what counts as a "reason" in responsibility contexts.

  ### Camp Preferences / Question-Begging Demands (Omitted or Repurposed)
  *   **Demand 4 (Hostage to Physics' Completeness):** Genuine *intent* (avoiding neuroscientific refutation) is covered by **Anti-Generality Requirement** and **Non-Redundancy**. The specific formulation ("refuted by further detail") often presupposes reductionism and is rejected by non-reductive views claiming autonomy. Not a standalone desideratum.
  *   **Distinction Requirements (Omitted Parts):** As noted above, distinctions like difference-making vs. production or symmetric overdetermination vs. preemption often embed specific metaphysical commitments about causation itself. Insisting on them *as fixed points* begs the question. Focus on the essential ones for your purpose.

  ### Your Cases Scored
  *   **Double Realization (Same Content):**
      *   **Question:** Does the mental cause survive?
      *   **Scoring Key:** Views emphasizing *property causation* (e.g., strong non-reductive physicalism, certain functionalisms) typically say *yes* – the mental property is multiply realizable and causally efficacious; the preemption is physical. Views requiring token identity or contiguous physical causation may struggle. **Relevance:** Tests Non-Redundancy/Property Causation. Survival is desirable.
      *   **Different Contents:** Significantly harder. If distinct physical realizers carry distinct contents, but only one content is "active," views must explain why *that* content, not the other physically present one, is the cause/reason. Tests fineness of grain and content causation. Failure here casts doubt on Non-Redundancy for specific content.
  *   **Subpersonal State:**
      *   **Question:** Does allowing this as cause give up the chapter's need?
      *   **Scoring Key:** If the state is truly subpersonal/inaccessible (*not* just unconscious but potentially accessible), then **yes**, allowing it as *the reason-cause* gives up your purpose. It cannot support responsibility-as-acting-on-reasons. The state might be a physical cause, but not a *reason*-explanation.
      *   **Cost/Discovery:** A *cost* only relative to your specific purpose. It might be a *discovery* about cognitive architecture, but it doesn't vindicate *reasons*-explanation for responsibility. Highlights the need for the **Accessibility Constraint**.

  ### Your Specific Requests
  1.  **Joint Unsatisfiability & Cost of Dropping:**
      *   **Tension Exists Between:** **Physical Causal Completeness Accommodation**, **Non-Redundancy**, and **Anti-Generality Requirement**.
      *   **Core Conflict:** Securing Non-Redundancy for mental properties without violating Physical Completeness or making all special science properties epiphenomenal (violating Anti-Generality) is the central challenge. Non-Reductive views try to thread this needle (e.g., via realization, subset causation). Dualism rejects Completeness. Eliminativism/Reductionism rejects Non-Redundancy.
      *   **What to Drop?** Dropping **Non-Redundancy** is fatal to your purpose – it surrenders mental causation. Dropping **Physical Causal Completeness Accommodation** invites dualism, often seen as scientifically untenable. Dropping **Anti-Generality Requirement** makes the view ad hoc.
      *   **The Cost:** The hardest work is satisfying all three simultaneously. The "cost" is the complexity of the required metaphysics (e.g., grounding, non-standard causation, complex realization). **You cannot drop Non-Redundancy.**
  2.  **Most Exclusionary Requirement:** **Non-Redundancy Requirement.** This is the lynchpin. It directly targets the core failure mode of epiphenomenalism and "idle summary" views that your purpose rules out. Every other requirement interacts with or builds upon ensuring the mental property itself is doing indispensable work.
  3.  **Purpose-Relative Requirements & Causation Question:**
      *   **Purpose-Relative:** **Non-Redundancy** (specifically for *reason-properties*), **Reason-Responsiveness**, **Accessibility Constraint**. These tie causation directly to the explanation of rational agency needed for responsibility.
      *   **Causation Decisions Forced:**
          *   **Property vs. Event Causation:** The list forces a commitment to *properties* being causally relevant (Non-Redundancy, Temporal Separation).
          *   **Explanation vs. Production:** Your purpose *links* causation and explanation inseparably for mental *reasons*. A pure "production" view (e.g., transfer of energy) struggles with reasons-explanation. A pure "difference-making" view might struggle with overdetermination cases and feel insufficiently robust for responsibility. The list pushes towards a hybrid or richer view where explanation tracks productive difference-making relevant to agency.
          *   **Levels of Causation:** The list forces a decision on whether mental causation is fundamental, emergent, or realized, and how it relates to physical causation (Completeness, Anti-Generality, Temporal Separation).

  ### Scoring Candidate Families (Structurally)
  *   **Type Identity/Reductionism:** Identifies mental properties with physical properties. **Fails:** Non-Redundancy (mental properties are "idle" labels), likely fails Temporal Separation, struggles with Anti-Generality (reduces special sciences too). Strong on Completeness.
  *   **Token Identity/Non-Reductive (Supervenience-only):** Mental events = physical events, but properties distinct. **Fails:** Non-Redundancy (exclusion argument applies directly), Temporal Separation. Strong on Completeness, handles Anti-Generality poorly (epiphenomenalism spreads).
  *   **Non-Reductive (Robust Property Causation):** (e.g., Shoemaker, Wilson, some functionalisms) Mental properties have genuine causal powers via realization/subset. **Potential:** Best shot at Non-Redundancy, Anti-Generality, Temporal Separation. **Challenges:** Explaining *how* without overdetermination or violating Completeness, fineness of grain (Double Realization different contents). Handles your core purpose best *if* successful.
  *   **Substance/Property Dualism:** Mental properties/substances are fundamental. **Fails:** Physical Causal Completeness Accommodation. **Potential:** Easy Non-Redundancy, Temporal Separation. **Cost:** Scientific conflict, may struggle with Reason-Responsiveness (how do non-physical reasons interact?).
  *   **Eliminativism/Fictionalism:** Denies mental properties exist or have causal efficacy. **Fails:** Your entire purpose. Strong on Completeness and Anti-Generality (by denying the problematic level).
  *   **Dispositional/Affectual Views:** (e.g., Hornsby, Hutto) Focus on agent's powers or affects. **Potential:** Good on Reason-Responsiveness, Accessibility, Non-Redundancy (for the power/affect). **Challenges:** Temporal Separation, Anti-Generality (scope of powers?), fineness of grain, precise relation to physics/Completeness.
  *   **Emergentism (Radical):** Mental properties exert novel downward causation. **Fails:** Physical Causal Completeness Accommodation (as usually formulated). Similar issues to Dualism.
  *   **Emergentism (Moderate):** Mental properties as higher-order constraints/structure. **Potential:** Compatible with Completeness (constraints aren't "causes"), Non-Redundancy, Anti-Generality, Temporal Separation. **Challenges:** Explaining the causal *relevance* of constraints robustly enough for responsibility (Non-Redundancy threat), Reason-Responsiveness.

  This list provides a rigorous, purpose-focused set of adequacy conditions, distinguishing genuine constraints from camp-specific assumptions, and highlighting the critical tensions and metaphysical commitments involved. The scoring shows how different structural approaches navigate these demands relative to your goal of vindicating reasons-explanation for responsibility.
