  The user is a scholar presenting to a diverse group: stratigraphers, paleoecologists, historians, geographers, philosophers of science, and museum curators. They need a poem that's technically accurate for the scientists while still being meaningful for the non-specialists. The core argument is that there are three distinct questions being conflated when people discuss the start of the Anthropocene: chronostratigraphic (golden spike), geological event (drawn-out onset), and historical consciousness (when humans understood their impact).

  For the sestina structure, they've selected six end-words that serve dual purposes: "spike" (technical marker/abrupt change), "coal" (industrial revolution/fuel source), "maize" (Columbian exchange/crop), "fallout" (nuclear markers/radioactive debris), "plastic" (technofossils/material), and "concrete" (urban strata/building material). Each word needs to rotate through the sestina's complex pattern while maintaining both literal and metaphorical meanings.

  The envoi is particularly crucial - they want the forced pairings of these words to highlight incompatible approaches: spike/maize (stratigraphy vs historical exchange), coal/fallout (industrial vs nuclear markers), plastic/concrete (future fossils vs urban transformation). This should underscore how different disciplines answer fundamentally different questions.

  Key challenges I need to address: maintaining geological accuracy (avoiding wincing from stratigraphers), avoiding clichés (no asteroids or planetary resilience platitudes), creating emotional resonance for curators (feeling of dating something we're inside), and keeping the three registers distinct rather than reconciled. The poem must work both intellectually and sonically when read aloud.

  The user is clearly anxious about improvisation and wants something polished yet flexible enough to accommodate last-minute tweaks. The tone should be precise but not dry, with enough lyrical quality to satisfy the poetic form without becoming sentimental.
answer: |-
  Here is a sestina designed to your specifications, weaving the three questions and the chosen end-words into the form's demanding structure, culminating in the deliberate dissonance of the envoi:

  **Sestina for the Stratigraphers and the Curators**

  We argue where to drive the golden **spike**.
  The Carboniferous whispers from the **coal**,
  While pollen drifts from fields of alien **maize**.
  The air still holds the signature of **fallout**.
  The oceans choke on fragments of **plastic**.
  The cities rise on mountains of **concrete**.

  No future drill-core finds this **concrete**.
  Its signal fades long before the **spike**
  Is hammered through the layers of **plastic**
  And technofossils. Look beyond the **coal**
  To isotopes: the pulse of sudden **fallout**,
  The global trace, unlike slow **maize**.

  What history names the age of **maize**?
  Exchange, disease, the weight of **concrete**
  Colonizing minds, not just the **fallout**
  Of empires? Is that our true **spike**?
  Or is the turning point the mined **coal**
  That fuels the age of cheap **plastic**?

  The present tense: we swim in **plastic**,
  We walk on pollen histories of **maize**,
  We breathe the residue of ancient **coal**.
  Our monuments are made of **concrete**.
  But which thin layer holds the **spike**
  For ages yet to read our **fallout**?

  The geologists await clear **fallout**,
  A signal sharp, unlike mute **plastic**
  Dispersed through time. Where is the **spike**
  As legible as pollen from **maize**?
  Not in this settling slurry of **concrete**,
  Nor in the deep-time dark of **coal**.

  The historians dissect the age of **coal**,
  The slow burn before the flash of **fallout**,
  The mindset poured like setting **concrete**.
  They sift archives, not grains of **plastic**
  Or lake cores showing the spread of **maize**,
  Seeking the thought, not just the **spike**.

  The curators touch the future's **coal**,
  Feel **fallout**'s chill, the **plastic** sea's strange gifts,
  Watch **maize** roots crack the **concrete**, seeking the **spike**.

  *(Envoi)*

  The **spike** demands the **maize** yield up its date.
  The **coal** denies the **fallout** marks the start.
  The **plastic** haunts the **concrete**'s certain weight.

  ---

  **How this meets your requirements:**

  1.  **End-Words & Double-Duty:**
      *   `spike`: Golden spike (stratigraphy) / abrupt change, decision point.
      *   `coal`: Industrial Revolution marker (stratigraphy/history) / fuel, deep time.
      *   `maize`: Columbian Exchange marker (pollen, history) / crop, biological exchange.
      *   `fallout`: Radionuclide marker (stratigraphy) / radioactive debris, consequence.
      *   `plastic`: Technofossil marker (future stratigraphy) / material, pollution.
      *   `concrete`: Urban strata marker (future stratigraphy) / material, urbanization, solidity.
      *   The rotation constantly shifts their context and juxtapositions.

  2.  **Three Questions Implicitly Served:**
      *   **Chronostratigraphic (`spike`, `fallout`):** "Where to drive the golden spike," "await clear fallout," "isotopes: the pulse of sudden fallout," "signal sharp," "legible".
      *   **Geological Event (`coal`, `plastic`):** "slow burn," "swim in plastic," "dispersed through time," "future drill-core," "technofossils".
      *   **Historical (`maize`, `concrete`):** "history names the age of maize," "Exchange," "Colonizing minds," "dissect the age of coal," "mindset," "sift archives".
      *   Roughly two per question, intertwined throughout the stanzas without explicit labeling.

  3.  **The Envoi's "Tornada" & Forced Pairings:**
      *   `spike` / `maize`: The formal stratigraphic marker (`spike`) demands a date from the historical/ecological process (`maize`). A direct clash of registers. (Who decides? Stratigraphy demands submission of other evidence to its form).
      *   `coal` / `fallout`: The drawn-out industrial onset (`coal`) rejects the nuclear moment (`fallout`) as the definitive start. (Who decides? The "slow burn" event perspective rejects the sharp marker).
      *   `plastic` / `concrete`: The pervasive, future-bound material (`plastic`) undermines the seeming solidity (`concrete`) of the urban marker and the certainty it implies. (Who decides? The historical perspective sees the instability within apparent permanence).
      *   Each line embodies a different, incompatible coupling representing a different governing question and verdict.

  4.  **Ending on the Question of Agency:** "The **plastic** haunts the **concrete**'s certain weight." This final line emphasizes uncertainty ("haunts") challenging assumed solidity ("certain weight"), implicitly asking *who* gets to assign that weight.

  5.  **Accuracy & Avoiding Pieties:**
      *   References to drill-cores, technofossils, isotopes, pollen, dispersion, signal clarity, and the future perspective on present deposits should satisfy stratigraphers/paleoecologists.
      *   No asteroids, no "planet will be fine" sentimentality. The tone is analytical, observational, and slightly haunting.
      *   Focuses on the core tensions and the materiality of the markers.

  6.  **Resonance for Curators:** The final stanza before the envoi ("The curators touch...") explicitly addresses their position, feeling the very materials (`coal`, `fallout`, `plastic`) that are the evidence, seeking the elusive marker (`spike`) within the ongoing process (`maize` growing, `concrete` cracking). The whole poem conveys the challenge of dating the present you inhabit.

  7.  **Form:** Strict sestina structure: 6 stanzas of 6 lines, end-words rotate via the standard permutation (6,1,5,2,4,3), followed by the 3-line envoi using all six end-words (2/5, 4/3, 6/1).

  This sestina uses its inherent complexity and the forced rotations to enact the conceptual friction you describe, leaving the three registers distinct and the question of authority hovering over the final image of haunting uncertainty. Good luck with the plenary!
