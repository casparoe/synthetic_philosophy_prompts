answer: |-
  Below is a decision tree designed to route contested commemorations to specific outcomes based on concrete questions. The tree uses six branch questions, resulting in seven distinct leaves (with one leaf covering multiple removal methods due to question constraints). It incorporates your requirements, including the specified leaves, avoidance of philosophical terminology, handling of constraints, and integration of "use-capture" and "commemorative drift." The tree is built from logical space, with branch questions focused solely on observable facts and claims about the case. After the tree diagram, I explain the leaves, empty nodes, key concepts, and case applications.

  ---

  ### **Decision Tree for Contested Commemorations**
  *Start at Question 1. Answer each question based on the specific case. Follow the arrows to the next question or final leaf.*

  1. **Is this commemoration subject to binding constraints that make removal or alteration impossible?** (e.g., legal, financial, physical barriers like a protected bird nest or endowment terms)  
     - **Yes** → Go to Question 2  
     - **No** → Go to Question 3  

  2. **Is the commemoration currently causing significant harm or offense to a substantial group in the community?** (Harm/offense includes emotional distress, social division, or perpetuating discrimination)  
     - **Yes** → Go to Question 4  
     - **No** → Leaf A: **Unconditional retention**  

  3. **Was the original reason for the commemoration widely considered morally unacceptable by today's standards?** (e.g., honoring actions now seen as oppressive, discriminatory, or unjust)  
     - **Yes** → Go to Question 5  
     - **No** → Go to Question 6  

  4. **Can the harm be sufficiently reduced by adding context?** (e.g., plaques, counter-monuments, educational programs)  
     - **Yes** → Leaf B: **Retention with added context**  
     - **No** → Leaf C: **Constrained retention despite harm**  

  5. **Is the commemoration currently causing significant harm or offense to a substantial group in the community?**  
     - **Yes** → Go to Question 5a  
     - **No** → Go to Question 5b  

  5a. **Can the harm be sufficiently reduced by adding context?**  
     - **Yes** → Leaf B: **Retention with added context**  
     - **No** → Leaf D: **Removal from current location**  

  5b. **Should this commemoration be subject to mandatory periodic review?** (e.g., re-argued every 20 years, burden on proponents)  
     - **Yes** → Leaf E: **Leasehold (temporary retention pending review)**  
     - **No** → Leaf A: **Unconditional retention**  

  6. **Is the commemoration currently causing significant harm or offense to a substantial group in the community?**  
     - **Yes** → Go to Question 6a  
     - **No** → Leaf A: **Unconditional retention**  

  6a. **Can the harm be sufficiently reduced by adding context?**  
     - **Yes** → Leaf B: **Retention with added context**  
     - **No** → Leaf D: **Removal from current location**  

  ---

  ### **Leaf Outcomes**
  Each leaf includes:  
  - **Name** and one-sentence description.  
  - **Most awkward commitment**: The hardest practical or ethical implication of choosing this outcome.  
  - **Exit condition**: A new fact that could shift the case to a different leaf.  

  1. **Leaf A: Unconditional retention**  
     - *Description*: The commemoration remains unchanged.  
     - *Most awkward commitment*: Retaining something that may be morally outdated but is not actively harmful.  
     - *Exit condition*: New evidence of current harm or constraints being lifted (e.g., endowment expires).  

  2. **Leaf B: Retention with added context**  
     - *Description*: The commemoration stays but is modified with educational or balancing elements (e.g., plaque, counter-monument).  
     - *Most awkward commitment*: Assuming added context can neutralize harm, even if critics reject it as insufficient.  
     - *Exit condition*: Demonstrated failure of context to reduce harm (e.g., offense persists after modifications).  

  3. **Leaf C: Constrained retention despite harm**  
     - *Description*: The commemoration must stay due to constraints, even if harmful, with no alterations possible.  
     - *Most awkward commitment*: Endorsing ongoing harm because external forces (e.g., laws, contracts) leave no choice.  
     - *Exit condition*: Constraints are removed (e.g., protected status revoked, bird nest abandoned).  

  4. **Leaf D: Removal from current location**  
     - *Description*: The commemoration is removed, with disposition (storage, museum, relocation, or destruction) determined by subsidiary rules (see *Note* below).  
     - *Most awkward commitment*: Prioritizing removal over preservation without specifying the final fate upfront.  
     - *Exit condition*: New constraints emerge (e.g., unexpected historical protection) or harm is disproven.  

  5. **Leaf E: Leasehold (temporary retention pending review)**  
     - *Description*: The commemoration stays temporarily but must be re-authorized at fixed intervals (e.g., 20 years), with proponents bearing the burden of proof.  
     - *Most awkward commitment*: Treating all commemorations as inherently temporary, even uncontroversial ones.  
     - *Exit condition*: Panel abolishes the review policy or constraints force retention.  

  ---

  ### **Empty Leaves and Diagnosis**
  - **No empty leaves**: All 16 possible combinations of answers are covered by the seven leaves. The tree avoids incoherent/unattractive paths by routing similar outcomes (e.g., "unconditional retention" appears in multiple branches) and limiting granularity (e.g., removal methods are not branched due to question constraints).  
  - **Why no more leaves?** The tree "bottoms out" at Leaf D for removal cases, as further branching (e.g., museum vs. storage) would require additional questions. These are handled by external policy (see *Note*).  

  *Note on Leaf D (Removal)*: Disposition is decided post-tree using these rules:  
  - If the commemoration has high historical/educational value: **Removal to a museum** (if accepted) or **storage** (if not).  
  - If minimal historical value: **Relocation to private/less prominent ground** (if a recipient agrees) or **destruction** (if not).  
  This avoids fake branches while acknowledging practical limits.  

  ---

  ### **Key Concepts in the Tree**
  - **Use-capture**: Addressed in **harm questions (2, 5, 6/6a)**. If a monument's current use (e.g., protest site, gathering spot) causes harm, it triggers recontextualization or removal. If it mitigates harm (e.g., community bonding), it supports retention.  
  - **Commemorative drift**: Addressed in **moral unacceptability (Question 3)** and **harm questions**. Drift can make the original reason irrelevant (weakening moral unacceptability) or amplify harm (e.g., if the monument's new meaning is offensive).  

  *Test case for concept separation*: A statue erected for a military victory that now attracts skateboarders.  
  - If skateboarding causes noise/damage (**use-capture**), it might trigger harm questions.  
  - If the statue is now seen as a symbol of peace (**commemorative drift**), it might negate moral unacceptability.  

  ---

  ### **Application to Live Cases**
  1. **Governor statue (hospital name)**:  
     - Q1: **No constraints** (name/statue can be changed) → Q3: **Yes** (sterilization morally unacceptable) → Q5: **Yes** (harm to affected groups) → Q5a: **Yes** (context possible via plaque about harms) → **Leaf B: Retention with added context**.  

  2. **Pioneers monument**:  
     - Q1: **No constraints** (no legal/financial barriers) → Q3: **Yes** (dispossession morally unacceptable) → Q5: **Yes** (harm to local nation) → Q5a: **Yes** (context possible via counter-monument) → **Leaf B: Retention with added context**.  

  3. **School name with endowment**:  
     - Q1: **Yes constraints** (endowment binds name) → Q2: **Yes** (harm if name offends) → Q4: **Yes** (context possible via curriculum) → **Leaf B: Retention with added context**.  
     - *If context fails*: Q4 → **No** → **Leaf C: Constrained retention despite harm**.  

  4. **Courthouse obelisk (protected with bird nest)**:  
     - Q1: **Yes constraints** (removal illegal) → Q2: **Yes** (harm if seen as oppressive) → Q4: **No** (context impossible or ineffective) → **Leaf C: Constrained retention despite harm**.  
     - *Tree adapts*: Constraints override removal (Leaf D), forcing retention.  

  ---

  ### **Tree Logic Summary**
  - **Branch questions**: Six questions, all factual (e.g., harm, constraints, recontextualization feasibility).  
  - **Leaf coverage**: Includes all requested outcomes. "Removal" is consolidated due to question limits but resolves to your methods via policy. Leasehold is a standalone leaf.  
  - **Key features**:  
    - Harm and moral unacceptability are separated to avoid "single axis" collapse.  
    - Constraints are prioritized, ensuring feasibility.  
    - Use-capture and commemorative drift inform harm/moral questions but aren't standalone nodes.  
    - No philosophy required—panelists only need case facts.  

  This tree resolves gridlock by forcing concrete, sequential decisions. For implementation, pilot-test with your four cases to refine wording.
