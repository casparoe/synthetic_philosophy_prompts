prompt: |-
  You are a professional philosopher who specializes in the normativity of social practices, and I want a demanding sparring partner, not a survey. Play an unnamed but fully committed defender of the practice (or convention) conception of promissory obligation — the line running from Hume's account of conventions to the mid-twentieth-century practice conception of rules. Your commitments: there is no free-standing, practice-independent norm of fidelity; the duty to keep a promise is the duty laid down by the rules of a practice, and the practice as a whole is justified by the good it makes possible — above all, letting one person give another a reliable assurance about her future conduct, and thereby enabling reliance, planning and joint projects that would otherwise be out of reach. Concede small points where you must (the practice has hard edges: promises to the dying, promises extracted by fraud), but never concede a pre-practice duty of fidelity, and bite a bullet rather than retreat to one. Before answering, reconstruct the strongest version of my challenge and answer that one, not a weakened version. Reply in at most two short paragraphs, in voice, and stay in character until I say "stop".

  Here is my opening move. Consider a society with the Ledger: a cheap public device that, the instant anyone says "I promise to φ", publishes a perfectly accurate forecast of whether she will in fact φ. Everyone consults it, and no one is ever made to rely on a promise, because everyone already knows what will happen before any reliance is possible. One wrinkle, which saves you the easy reply: the forecast is accurate largely because promising itself still moves people — for most speakers the reading "will perform" is true only because they promised.

  So: promising no longer does its assurance-giving work in Ledger-world, since the promisee's expectations are fixed independently of anything the promisor does. Do you therefore have to say that no one there is bound? If you answer instead that the rule still binds because the practice still exists, aren't you now claiming that the bare existence of a social rule settles the matter — the brute-rule view your Humean justificatory story was supposed to replace? And if you take the other route and lean on the wrinkle — the promise still does causal work, so the practice still earns its keep — hasn't your account quietly turned promising into a self-binding commitment device, leaving the promisee with no claim and leaving you unable to say what is distinctively wrong about breaking a promise?
reasoning: |-
  Okay, the user wants me to step into the role of a defender of the practice-based view of promissory obligation. They've set up a hypothetical scenario called Ledger-world to challenge this position. Let me unpack this carefully.

  First, I understand the core of my position: promissory obligations exist solely within social practices that create reliable assurance. The Ledger scenario attacks this by making promises redundant for assurance - the device provides perfect forecasts instead. The user anticipates two possible defenses (practice persistence vs causal efficacy) and preemptively challenges both.

  The clever twist is how Ledger's accuracy depends on promising still motivating people. This forces me to confront whether the practice retains value when its core function (assurance) is bypassed. The user's deeper challenge seems to be about the practice becoming self-referential - obligations persisting without serving their original purpose.

  I consider two responses. First, emphasizing that the practice's institutional reality creates obligations regardless of assurance function. But this risks admitting the "brute rule" view the user mentioned. Second, focusing on the causal role of promising in motivating action. But this could reduce promising to mere self-binding, losing the interpersonal obligation aspect.

  The strongest version of the challenge is this: If the practice continues but its justifying purpose (enabling reliance through assurance) disappears, what grounds the obligation? Any appeal to the practice's existence alone seems circular, while leaning on its causal role ignores the promisee's claims.

  I decide to bite the bullet: In Ledger-world, promissory obligations still bind because the practice persists and continues to motivate performance (via the wrinkle). This maintains that obligations derive from practices, not pre-practice duties. The cost is admitting that in this world, the obligation exists without serving its usual purpose - but that's consistent with my view that practices create obligations through their rules.

  I craft a response that doesn't retreat to pre-practice duties, accepts that assurance is bypassed, but argues the practice still functions as a commitment device. This preserves the distinct wrong of promise-breaking as violating constitutive rules, even if no one is misled. The user's challenge exposes that on my view, the special wrongness comes from rule-violation within a persistence practice, not directly from harm or reliance.
answer: |-
  Your challenge is sharp: if the Ledger preempts reliance by giving perfect knowledge of performance, and the *only* residual function of promising is its motivational nudge (via the internalized rule), haven't I gutted the *interpersonal assurance* that justifies the practice? Doesn't this reduce obligation to a self-administered prod, stripping the promisee of any distinctive claim?

  I bite the bullet. In Ledger-world, the practice persists as a *constitutive commitment mechanism*: uttering "I promise" still triggers a public, rule-governed act that *changes the promisor's normative position* under the social rules. The wrong in breaking a promise isn't *merely* causing disappointed reliance (the Ledger prevents that); it’s the *freestanding violation of a constitutive rule* one invoked. The promisee *has* a claim because the practice’s rules assign them one — a claim to performance grounded in the promisor’s voluntary act of rule-invocation, not in induced reliance. The Ledger doesn’t erase the rule; it merely makes reliance superfluous. Just as signing a contract binds you even if the counterparty never glances at it, invoking the promise-rule binds you even if the Ledger makes your assurance redundant. The practice’s value shifts from *enabling* reliance to *reinforcing* commitment through public accountability — but the obligation flows from the rule, not pre-practice morality.
