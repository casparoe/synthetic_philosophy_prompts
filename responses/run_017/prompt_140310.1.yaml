  ### Nomic Case Study: Path-Dependence of Legality

  #### Starting Rule Set (4 rules)
  1. **Amendment Process**: A rule change requires a unanimous vote, except for changes to rules designated as "Core Rules" in Rule 2, which require a majority vote.  
  2. **Core Rules**: The following rules are Core Rules: Rule 1, Rule 2.  
  3. **Dragon Prohibition**: No rule may be created with the word "Dragon" in its title.  
  4. **Repeal Restriction**: Rule 3 may only be repealed if it is listed as a Core Rule in Rule 2.  

  ---

  ### Moves
  - **Move A**: Amend Rule 2 to add "Rule 3" to the Core Rules list.  
  - **Move B**: Repeal Rule 3 and create a new rule titled "Dragon Rule" (e.g., "Dragon Rule: Players earn 1 point per turn").  

  ---

  ### Demonstration of Legality  
  **Start**:  
  - Rulebook = {1, 2, 3, 4}  
  - Core Rules: Rule 1, Rule 2 (only these can be changed by majority).  

  **Path 1: A then B (Legal Path)**  
  1. **Move A**:  
     - Proposal: *Amend Rule 2 to add "Rule 3" to the Core Rules list.*  
     - **Legality**:  
       - Rule 2 is a Core Rule → change requires only **majority vote** (Rule 1 + Rule 2).  
       - Outcome: Rule 2 now reads: "The following rules are Core Rules: Rule 1, Rule 2, **Rule 3**."  
     - New Rulebook: {1, 2 (amended), 3, 4}.  
     - *Coherence*: No contradictions. Rule 3 still prohibits "Dragon" titles, but A doesn’t violate this.  

  2. **Move B**:  
     - Proposal: *Repeal Rule 3 and create "Dragon Rule"*.  
     - **Legality**:  
       - **Repeal of Rule 3**:  
         - Rule 2 now lists Rule 3 as a Core Rule → repeal requires **majority vote** (Rule 1).  
         - Rule 4 allows repeal because Rule 3 is now a Core Rule (satisfies Repeal Restriction).  
       - **Creation of "Dragon Rule"**:  
         - Occurs *after* Rule 3 is repealed → no violation of Dragon Prohibition.  
       - **Resulting State**:  
         - Rule 3 is repealed, "Dragon Rule" is added.  
         - Rule 4 is unaffected but irrelevant (no Rule 3 to repeal).  
     - Final Rulebook **R**: {1, 2 (amended), 4, Dragon Rule}.  
     - *Coherence*: No contradictions.  

  **Path 2: B then A (Illegal Path)**  
  1. **Move B (Attempted First)**:  
     - Proposal: *Repeal Rule 3 and create "Dragon Rule"*.  
     - **Illegality**:  
       - **Repeal of Rule 3**:  
         - Rule 3 is **NOT** a Core Rule in Rule 2 → repeal requires **unanimous vote** (Rule 1).  
         - But Rule 4 blocks repeal: *"Rule 3 may only be repealed if it is listed as a Core Rule"*.  
         - Since Rule 3 is not listed, Rule 4 forbids repeal → **invalid move**.  
       - (No need to check "Dragon Rule" creation; the repeal is already illegal.)  
     - Outcome: Move B fails. Rulebook remains {1, 2, 3, 4}.  

  ---

  ### Key Feature Enabling Path-Dependence  
  **Repeal Restriction (Rule 4)**:  
  - Rule 4 conditions the repeal of Rule 3 on Rule 3’s status in Rule 2.  
  - Move A changes Rule 3’s status (adding it to Core Rules), satisfying Rule 4’s condition.  
  - Without Move A, Rule 4 forbids Move B’s repeal of Rule 3.  
  - *Effect*: Identical Rulebook **R** is only reachable if Move A precedes Move B.  

  ---

  ### Adding an Amendment Safeguard  
  **Proposal**: *"Rule 1 (Amendment Process) can only be changed by unanimous vote."*  
  - **Impact on the Case**:  
    - Rule 1 is already a Core Rule (Rule 2) → changing it currently requires majority.  
    - The safeguard would force Rule 1 changes back to unanimous, even if Rule 2 is amended.  
    - **Effect on Path-Dependence**:  
      - Move A (amending Rule 2) still only needs majority (since Rule 2 is Core).  
      - Move B remains identical: Repealing Rule 3 requires majority (if A is done first), but creating "Dragon Rule" requires unanimous vote (since it’s not a Core Rule).  
      - **No change to path-dependence**: The legality of Move B’s repeal still hinges on Rule 4/Rule 2, which is unaltered by the safeguard.  

  ---

  ### Defense of "Legality at the Time" (Anti-Path-Dependence)  
  A player denying path-dependence might argue:  
  1. **Doctrine of "Valid When Enacted"**:  
     - *"Move A was legal under the rules at the time (majority vote for Core Rule change). Later changes can’t retroactively invalidate it. Rulebook R is legitimate because all steps were compliant when executed."*  
  2. **Curing Defects via Later Valid Acts**:  
     - *"Even if Move B’s repeal of Rule 3 was initially defective without A, Move A cured this by satisfying Rule 4’s condition. Now Rule 3 can be repealed legally—identical to Path 1."*  
  3. **Distinction of "Same Move"**:  
     - *"Move B is context-dependent. In Path 1, it’s proposed under a rulebook where Rule 3 is a Core Rule. In Path 2, it’s proposed under a different rulebook. They’re not the 'same move'—one is valid, the other isn’t."*  

  **Counter-Counterargument**:  
  - Rule 4 explicitly ties the legality of repealing Rule 3 to Rule 2’s state *at proposal time*. If Rule 3 isn’t a Core Rule when Move B is proposed, Rule 4 renders it invalid. "Curing" requires a *prior* change (A), but Path 2 lacks this.  

  ---

  ### Final Rulebook R (Coherent)  
  1. **Amendment Process**: A rule change requires a unanimous vote, except for changes to rules designated as "Core Rules" in Rule 2, which require a majority vote.  
  2. **Core Rules**: The following rules are Core Rules: Rule 1, Rule 2, Rule 3. *(Amended by A)*  
  3. **Repeal Restriction**: Rule 3 may only be repealed if it is listed as a Core Rule in Rule 2. *(Unchanged, but Rule 3 is repealed so inert)*  
  4. **Dragon Rule**: Players earn 1 point per turn. *(Added by B)*  

  ---  
  This setup forces players to confront whether a rulebook’s legitimacy depends on its history. Path-dependence is upheld by Rule 4’s conditional, while critics lean on the sanctity of "legal when enacted." No ambiguity about vote timing—validity is judged at enactment, but Rule 4’s condition is checked at proposal.
