prompt: |-
  I got into counterfactual history during a bout of insomnia and now I keep noticing something I can't name. My book club did a what-if night. Someone said that even if Napoleon had won at Waterloo, France would still have lost within a year, because the other powers simply had more men. Someone else said that was cheating: you're picturing him winning by a fluke, a stray canonball or something, and then keeping every other fact about the campaign exactly as it actually was, including the fact that he was loosing up to that point. If he'd really won, they said, the reasons he was in a bad spot would probably have been different too, and then maybe he'd have kept winning. Both sides felt the other was breaking a rule and neither could say what the rule was.

  Same night, smaller case: if I'd taken the other job offer in 2019, I'd be miserable now. But if I'd taken it, I'd presumably have shown up as a slightly different person, and the job would then have gone differently in ways I can't fill in — so I don't see what gives me the right to hold everything else fixed.

  And here's the bit that puzzles me. None of this comes up with ordinary future ifs. "If it rains on Saturday the match is off" seems perfectly clear, and nobody asks how the rain got there or what else would have had to change. Make it past tense — "if it had rained on Saturday the match would have been off" — and the same can of worms opens up. So it can't just be about being uncertain.

  I've started calling them package-deal ifs, because you have to decide how much of the surrounding package of facts travels along with the one thing you changed, and it feels like there are two incompatible conventions that people switch between without noticing. Is there an established name for this, or for the choice you're forced to make? I genuinely don't want just a label — I want to know what exactly the thing is, whether my future-if example is really clean or whether the same mess is hiding in it, and if there is an established version, whether my "package deal" thing is the same one or a different one. And if I'm muddling two seperate problems together, or my three examples aren't really cases of one thing at all, please say so plainly instead of politely going along with it.
reasoning: |-
  Okay, the user is really deep into counterfactual history and has noticed this pattern they're calling "package-deal ifs." They've got three examples: Napoleon at Waterloo, a personal job decision, and the rain/match scenario. They're pointing out that when we imagine a past event changing, we struggle with how much else should change along with it. But for future conditionals, like predicting rain affecting a match, it seems straightforward. They want to know if there's a name for this, if their future example is truly clean, and whether they're conflating different issues.

  First, I need to recall the established concepts. In philosophy, especially with counterfactuals, there's the distinction between forward-tracking and backtracking counterfactuals. Forward-tracking assumes minimal changes from the counterfactual antecedent, like Lewis's similarity metric. Backtracking considers what prior conditions would make the antecedent true. The Napoleon example shows this conflict: one person is backtracking (if Napoleon won, the reasons for his bad position must've changed) while the other is forward-tracking (just flip the battle outcome, keep everything else). 

  The job offer example is similar. The user is using forward-tracking by fixing everything else, but realizes that in reality, taking the job would mean they were a different person, so backtracking is needed. But that makes the counterfactual too vague. 

  Then the rain example. Future conditionals seem clean because we're not required to explain the cause. "If it rains, the match is off" doesn't make us consider how the rain happened. But past counterfactuals like "if it had rained" might prompt thoughts on why it didn't rain, leading to backtracking. However, in many contexts, we stick to forward-tracking. The user is right that the issue is more prominent in past counterfactuals because we have more knowledge, making inconsistencies obvious. 

  Are the user's examples all the same thing? Yes, they're all about the cotenability problem—what facts remain true when we alter one event. But the future case hides it because we don't have fixed past facts. The key difference is epistemic: with the past, we know what happened, so changing one thing creates tension with other facts. With the future, it's speculative, so we assume minimal changes without backlash. 

  The user's "package-deal ifs" is spot on. It's essentially the problem of which facts are cotenable with the counterfactual antecedent. The established terms are forward vs. backtracking counterfactuals, or the cotenability problem. No need for a new term, but their description is accurate. 

  Also, they might be conflating two things? Not really. All examples revolve around the same core issue of what stays fixed. The personal case adds psychological dimensions, but the logical structure is the same. 

  So, to answer: Yes, there are established concepts. The future case isn't clean—it's just that the problem is less visible. The user isn't muddling separate issues; it's one problem manifesting differently based on temporal context and available knowledge.
answer: |-
  You've hit on a fundamental and notoriously thorny problem in philosophy, logic, and counterfactual reasoning. There *are* established concepts for what you're describing, and your intuition about "package-deal ifs" is remarkably astute. Let's break it down:

  1.  **The Core Problem: The Cotenability Problem & Backtracking**
      *   **Cotenability (Nelson Goodman, 1947):** This is the closest formal name for your "package deal." When we say "If A had happened, then B would have happened," we are *assuming* that a whole set of background facts (C) remain true and are compatible (cotenable) with A. The problem is figuring out *which* facts are cotenable with the counterfactual antecedent (A). What "travels along"? Your Waterloo and job examples show the difficulty in determining C.
      *   **Forward-Tracking vs. Backtracking Counterfactuals (David Lewis, 1979):**
          *   **Forward-Tracking (Standard/Minimal Change):** This is what the first Waterloo speaker and your "miserable job" self were doing. You hold as much of the actual past and present *fixed* as possible, make the *smallest possible change* to bring about the antecedent (Napoleon wins the battle / You take the other job), and then project the consequences *forward* according to the laws of nature or our best understanding of causality. "Given everything was *exactly as it was* up to that point, but this *one specific event* flipped, what happens next?"
          *   **Backtracking:** This is what the second Waterloo speaker and your "different person" realization point to. It asks: "What would the world *have had to be like* in the *immediate or even distant past* for the antecedent (A) to be true *in a natural, non-fluky way*?" If Napoleon wins Waterloo decisively, perhaps his position wasn't *actually* as bad as history records, or his opponents made different mistakes earlier. If you took the other job, perhaps you were subtly more ambitious/desperate that day, or the interviewer had a different impression – changes that ripple *backward* and *forward*, altering the context significantly.

  2.  **Why Past Counterfactuals Feel Messier Than Future Conditionals:**
      You're absolutely right that the "can of worms" primarily opens for *past* counterfactuals. Here's why:
      *   **Fixed Past, Open Future:** The actual past is fixed and known (or at least, we have records/assumptions about it). When we imagine changing one event (A) in the past, it *collides* with the known facts that led to ~A. We *know* France was losing before Waterloo, you *didn't* take the job. Making A true *requires* explaining how it fits with (or changes) that known context. The future is unknown and open; "If it rains Saturday" doesn't contradict any existing facts – Saturday hasn't happened yet. We don't *need* to explain *why* it rained; we just take the antecedent as given and project forward (like forward-tracking).
      *   **Epistemic Asymmetry:** We judge past counterfactuals with the benefit of hindsight. We know the *actual* outcome and the chain of events leading to it. This makes inconsistencies ("If Napoleon won, but everything else leading to his defeat stayed the same") glaring. Future conditionals lack this concrete comparison point.
      *   **Causality vs. Prediction:** Past counterfactuals often involve deep dives into *causes* and necessary preconditions ("What needed to be different *for* A to happen?"). Future conditionals are often about *consequences* given a potential state of affairs ("*Given* A, what follows?"). The focus is different. The future conditional "If it rains..." is primarily forward-looking prediction, not an inquiry into the causes of the rain itself in relation to a fixed past.
      *   **Minimal Change is Harder with History:** Determining the "smallest change" in a complex historical or personal context (Waterloo, your career) is incredibly difficult and context-dependent. What counts as "minimal"? Changing one cannonball? Napoleon's mood that morning? The weather weeks prior? The future rain example feels cleaner because the "minimal change" is simply adding rain to the otherwise expected Saturday scenario.

  3.  **Is Your Future Example *Really* Clean? The Hidden Mess:**
      You're correct to wonder. While it *feels* clean, the same potential mess *can* lurk beneath the surface, especially if pressed:
      *   **Implicit Assumptions:** "If it rains on Saturday, the match is off" *assumes* a huge package deal is held fixed: the rules of the sport, the ground's drainage, the organizers' policy, the lack of a roof, no sudden rule changes, etc. We don't question it because these background conditions (C) are *currently* stable and uncontroversial.
      *   **When It Breaks Down:** If someone asks, "But *how* would it rain? A freak hurricane? Wouldn't that also flood the roads, preventing officials from calling it off?", they are introducing a *backtracking* element. They are questioning whether the *manner* of rain required to make A true might also change other assumed background conditions (C), altering the consequence (B). We usually avoid this by *stipulating* a "normal rain" scenario within the forward-tracking framework.

  4.  **Are You Muddling Problems?** No, you've identified a single core problem – **the dependency of counterfactual consequents on the (often implicit and contested) set of background conditions held fixed** – manifesting differently based on:
      *   **Temporal Direction:** Past vs. Future.
      *   **Epistemic State:** Known history vs. unknown future.
      *   **Purpose of the Counterfactual:** Explaining causes vs. predicting consequences vs. exploring historical possibilities.
      *   **Complexity of Context:** Simple physical systems (rain) vs. complex historical/personal systems (Waterloo, career).

  5.  **The "Rule" People Feel is Broken:**
      It's the (often unspoken) agreement about which **mode of counterfactual reasoning** is being used:
      *   **Breaking the Forward-Tracking Rule:** Introducing reasons why the antecedent *couldn't* easily happen without changing the past (backtracking) when the discussion was framed as "What if *just this one thing* flipped?"
      *   **Breaking the Backtracking/Plausibility Rule:** Holding implausibly much context fixed ("He won by a fluke canonball, but everything else stayed terrible") when the discussion is implicitly about plausible alternative scenarios ("Could Napoleon have *actually* won the war?").

  **Conclusion & Established Terminology:**

  *   **You've identified:** The fundamental problem of **cotenability** in counterfactual reasoning and the tension between **forward-tracking** and **backtracking** interpretations.
  *   **Your "package-deal ifs":** This is an excellent descriptive term for the cotenability problem – deciding what's in the fixed "package" (C) alongside the changed antecedent (A).
  *   **The difference in past vs. future:** Arises from the **fixed past vs. open future** asymmetry and the resulting pressure on past counterfactuals to address **backtracking** to make the antecedent plausible within the known historical context. Future conditionals primarily use uncontroversial **forward-tracking**.
  *   **The hidden mess in future conditionals:** It's there! The background package (C) is assumed but rarely scrutinized *unless* the nature of the antecedent forces us to question it (e.g., "if a *meteor* hits on Saturday..." immediately makes us reconsider what else is held fixed).
  *   **Not muddling:** Your examples are perfect illustrations of the *same* core problem in different contexts. The Napoleon and job cases highlight the *controversy* around choosing the package/mode, while the rain example shows how the problem usually stays hidden in simple future predictions.

  So, you're not crazy! You've stumbled onto one of the deepest puzzles about how we reason about possibilities. The lack of a clear, universal rule for the "package deal" is why counterfactual history and personal "what ifs" can be so fascinating and endlessly debatable.
