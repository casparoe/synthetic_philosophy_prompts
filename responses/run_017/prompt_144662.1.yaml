prompt: |-
  I write literary fiction, and the novel I am finishing is set in the early 2050s in a small northern European country whose public health service funds preimplantation testing for every IVF patient and, through a body I have been calling the Selection Review Office, publishes a ranked schedule of which traits may be scored at public expense, which may be scored only if the parents pay, and which may not be scored at all. Two of my characters work at a clinic attached to the programme — a counsellor who has to explain the schedule to prospective parents, and a clinician who privately thinks it is a moral mess — and most of the book's argument happens in their disputes with each other and with the couples they see. A friend in my writing group read a draft and said one of them sounded like three different ethicists arguing inside one head, which is exactly my fear: I can write each character holding forth convincingly about a single case, but I cannot tell whether the bundle of things they believe is a position anybody holds, or whether I have stapled together commitments that actually belong to three different views and that only sound compatible in dialogue. So I am asking for a classification instrument rather than an essay: a decision tree that begins from questions my characters could answer in their own words — a lay counsellor, a frightened parent, a clinician with no formal ethics training — and terminates in a named position on whether selecting offspring traits is permissible, and whether it is ever required. Please build it from the logical space instead of from a list of names: give me the branching questions first, in the order you think they should be asked, say which combinations of answers are genuinely available, and only then locate the actual positions at the leaves, tagging each with a short descriptive name of your own and, where you are confident one exists, the label it goes by in the literature — but write "unnamed" rather than guessing, and no bibliography or citations, I only want labels that are uncontroversial.

  Two constraints on the nodes. First, every branch must be a question answerable without already knowing where it leads: no node may ask whether someone accepts the therapy/enhancement distinction or thinks enhancement is wrong; it must present a case and ask what should be done, or what the parents are entitled to be told. Second, the tree has to be able to reach at least these leaves, unless you think two of them are the same position or one of them is not coherent, in which case say so rather than quietly merging or dropping it: the strong view that there is a duty to select the child expected to have the best life; the view that parents have wide discretion to select but no duty to maximise; the view that selection is permissible only up to some sufficiency threshold or only to avert serious conditions; a view on which certain selections are objectionable because of what they express about, or do to, existing people; a view on which some selections wrong the child by pre-empting its own later choices; and a view on which each individual choice can be unobjectionable while the practice as a whole — subsidised, marketed, widely taken up — is not. The cases the tree must be able to route are these: ten embryos, every one expected to have a life well worth living, one carrying a somewhat lower polygenic risk of a late-onset disease; the same choice made on the basis of stature, which the parents value partly for its own sake and partly as an advantage; parents who select partly because the resulting child will be a tissue match for an existing sick sibling; parents who ask the clinic to rank embryos on a composite health index and to seal the individual scores, so that they choose a healthier child without ever knowing which traits they selected for — a "closed envelope" option I have invented for the book, which several characters treat as obviously different from open selection while disagreeing about why; the same expected health gain produced not by choosing among embryos but by editing the genome of the embryo that will otherwise be transferred; a couple who want a child temperamentally suited to the isolated, physically demanding life they lead, and say so plainly; and finally whether the state should pay for any of this, which I need you to tell me is either a separate node or a consequence of where one has already landed.

  Where I most want your honesty is at the end. Mark any node that is really a values choice dressed up as a diagnostic, and any pair of leaves your tree cannot separate — tell me what further question might separate them and whether you believe any such question exists. Tell me which of my characters' likely bundles of commitments fall into unoccupied regions of your logical space, and whether that is because the combination is incoherent, unattractive, or merely unclaimed. And be explicit about what would make you redraw the tree: if there is a case you have not seen, or a serious argument you have set aside, that would force a different branching order or collapse two leaves into one, I would much rather hear about it now than discover it in copy-edits.
reasoning: |-
  Hmm, this is a fascinating and complex request about bioethics in literary fiction. The user is writing a novel set in a future Scandinavian-style society with state-funded embryo selection, and needs help mapping the ethical positions of characters who debate this system. 

  The core challenge seems to be: how to create a decision tree that organically reveals ethical stances through concrete case-based questions, without requiring characters to know philosophical terminology. The user explicitly wants to avoid "stapling together" incompatible views and needs to verify whether certain position-bundles actually exist in ethical discourse.

  Breaking this down:
  First, the tree must handle all specified cases (late-onset disease risk, stature selection, savior siblings, closed envelope selection, gene editing, temperament selection, and state funding). Each branch point needs to be framed as an actionable question a layperson could answer, like "Should parents be allowed to select for X in scenario Y?" rather than abstract theory.

  Second, the terminal positions must cover the requested ethical stances: strong pro-selection duty, wide parental discretion without duty, sufficiency threshold, expressivist concerns, wrongful preemption objections, and systemic critiques. The constraint here is ensuring each leaf genuinely corresponds to a coherent real-world position - no Frankenstein hybrids.

  Third, I need to flag where the tree might be forcing false dichotomies or where certain answer combinations don't correspond to actual ethical schools. The user especially wants to know if their characters' blended views are philosophically tenable or contradictory.

  Key structural decisions:
  - Starting with disease risk creates a natural entry point since it's the least controversial
  - Branching next on non-health traits separates therapeutic from enhancement debates
  - The savior sibling case introduces third-party interests
  - The "closed envelope" option tests whether knowledge/transparency affects permissibility
  - Gene editing versus selection probes means-versus-ends distinctions
  - Temperament selection forces confrontation with identity-shaping choices
  - State funding becomes the final policy implication node

  Notable challenges:
  The "sufficiency threshold" position is tricky to isolate - it might collapse into either therapeutic-only or expressivist views depending on how "sufficient" is defined. Also, the "wrongful preemption" view (that selection violates future autonomy) rarely stands alone in practice; it usually combines with expressivist concerns.

  For the user's specific cases:
  The clinician who thinks the system is a "moral mess" likely inhabits the systemic critique leaf, while the counselor might hold a "wide discretion" view. The "three ethicists in one head" problem suggests a character inconsistently blending e.g. strong pro-duty arguments with expressivist worries - which the tree would reveal as incompatible paths.

  Red flags I'd note:
  - The "duty to select best life" and "only avert serious conditions" positions are fundamentally incompatible at the first branch
  - The closed envelope case doesn't cleanly separate positions - many ethicists would see it as equally problematic to open selection
  - State funding conclusions do follow logically from most positions except perhaps the systemic critique view

  If I were to restructure, adding a branch about whether embryos have interests might help separate "wrongful preemption" from other views, but that risks violating the "no theoretical concepts" rule. The current structure holds up well for literary purposes though - it creates natural tension points for dialogue while ensuring philosophical coherence.
answer: |-
  Here is a decision tree built from logical space, designed to classify positions on trait selection via embryo screening. It uses concrete cases and avoids theoretical jargon. Nodes are ordered to resolve fundamental disagreements first. Each branch is answerable by laypeople based on perceived permissibility or obligations in specific scenarios.

  ### Decision Tree
  **Start with Case 1: Ten embryos, all predicted to have lives "well worth living." Embryo A has a *somewhat lower polygenic risk* of a late-onset disease (e.g., 20% vs. 25% for others). Should parents be allowed to select Embryo A?**
  - **Yes** → Go to Case 2  
  - **No** → → → → → → → **Position: *Full Prohibitionist* (unnamed)**  
    *(Selection is never permissible, even for disease risk reduction)*  

  **Case 2: Same clinic, same ten embryos. Parents wish to select an embryo for *adult stature* (taller than average), valuing it partly for its own sake and partly for social/economic advantage. Should this be allowed?**  
  - **Yes** → Go to Case 3  
  - **No, but disease risk selection (Case 1) was permissible** → → → **Position: *Therapeutic Thresholder* ("Medical Model")**  
    *(Selection only for reducing significant health risks)*  
  - **No, and Case 1 should also be prohibited** → → → **Position: *Full Prohibitionist* (as above)**  

  **Case 3: Parents wish to select an embryo that is a *tissue match for a sick sibling*. Should this be allowed?**  
  - **Yes** → Go to Case 4  
  - **No** → → → → → → → → **Position: *Autonomy-Only Selector* (unnamed)**  
    *(Selection only for traits directly affecting the child's own welfare, not third parties)*  

  **Case 4: Parents ask the clinic to rank embryos using a *composite health index* and select the "healthiest" embryo *without revealing individual traits* ("closed envelope"). Is this...**  
  - **Permissible, and ethically similar to open selection** → Go to Case 5A  
  - **Permissible, but ethically *preferable* to open selection** → → → **Position: *Anti-Expressivist Pragmatist* (unnamed)**  
    *(Avoids expressive harm to disabled people by hiding specific traits)*  
  - **Impermissible, even if open selection is allowed** → → → → → **Position: *Transparency Advocate* (unnamed)**  
    *(Parents have a right/need to know what traits they select)*  

  **Case 5A: The same expected health gain (as in Case 1) could be achieved by *editing the genome* of the embryo instead of selecting among them. Is editing permissible here?**  
  - **Yes** → Go to Case 6  
  - **No** → → → → → → → → **Position: *Selection-Only Permissivist* (unnamed)**  
    *(Editing violates natural boundaries or poses unique risks; selection is acceptable)*  

  **Case 5B (from Case 4): Parents wish to select an embryo *expected to have a temperament suited to their isolated, physically demanding lifestyle* (e.g., resilience, lower sociability). Is this permissible?**  
  - **Yes** → Go to Case 6  
  - **No** → → → → → → → → **Position: *Core Traits Conservator* ("Open Future" view)**  
    *(Selecting psychological/identity-shaping traits wrongs the child by preempting autonomy)*  

  **Case 6: Should parents have a *duty* to select the embryo expected to have the *best life* (based on available data) when presented with multiple options?**  
  - **Yes** → → → → → → → → → **Position: *Procreative Beneficence Advocate* (Savulescu's "Principle of Procreative Beneficence")**  
  - **No** → → → → → → → → → **Position: *Discretionary Selector* ("Parental Prerogative" view)**  

  **Final Node (applies to ALL "Yes" paths except Full Prohibitionist): Should the *state fund* this selection service for the traits you deemed permissible?**  
  - **Yes, for all permitted traits** → *State Funding Supported*  
  - **Only for traits you answered "Yes" to in Case 1 (disease risk)** → *State Funding Only for Medical Traits*  
  - **No state funding, even for permitted traits** → *State Funding Opposed*  
  *(This is always a policy consequence, not a distinct ethical position)*  

  ---

  ### Key to Leaves
  1. **Full Prohibitionist**: No selection ever permissible.  
  2. **Therapeutic Thresholder**: Selection only to avert significant disease/disability ("sufficiency threshold").  
  3. **Autonomy-Only Selector**: Selection only for child’s own welfare, not third-party interests.  
  4. **Anti-Expressivist Pragmatist**: Permits selection but prefers "closed envelope" to avoid expressive harm.  
  5. **Transparency Advocate**: Requires parental knowledge of selected traits.  
  6. **Selection-Only Permissivist**: Allows selection but not gene editing.  
  7. **Core Traits Conservator**: Permits selection except for psychological/identity-forming traits.  
  8. **Procreative Beneficence Advocate**: Parents have a *duty* to select the "best" embryo.  
  9. **Discretionary Selector**: Parents may select permitted traits but have no duty to maximize.  

  ---

  ### Your Requested Leaves & Coverage
  - **Duty to select best life** → *Procreative Beneficence Advocate* (Leaf 8).  
  - **Wide discretion, no duty to maximize** → *Discretionary Selector* (Leaf 9).  
  - **Permissible only for serious conditions** → *Therapeutic Thresholder* (Leaf 2).  
  - **Objectionable due to expressivism/harm to existing people** → Embedded in Case 4 ("closed envelope" preference → *Anti-Expressivist Pragmatist*, Leaf 4).  
  - **Wrongs child by preempting choices** → *Core Traits Conservator* (Leaf 7).  
  - **Individual choices OK, practice problematic** → Not a terminal leaf, but a *systemic critique* compatible with most positions (see Honesty Section).  

  ---

  ### Honesty Section
  **Values Choices Dressed as Diagnostics**:  
  - *Case 2 (stature)* forces a choice on the therapy/enhancement distinction without naming it.  
  - *Case 3 (savior sibling)* implicitly asks whether the child is an "end in itself."  
  - *Case 5B (temperament)* proxies for the "open future" debate.  

  **Unseparated Leaves**:  
  - *Systemic Critique* (practice-level objections) isn’t a unique leaf. It can attach to *any* permissive position (e.g., a *Discretionary Selector* could oppose state funding/marketing). **To isolate it**: Add a final node: *"Is widespread, state-funded selection ethically problematic even if individual choices are acceptable?"*  
  - *Expressivism* isn’t fully separated from *Core Traits Conservator*. A character could oppose temperament selection for expressivist *or* autonomy reasons. **Separating question**: *"Is selecting for deafness wrong primarily because it insults existing deaf people (expressivism) or because it limits the child’s future (autonomy)?"*  

  **Unoccupied/Problematic Bundles**:  
  - A character supporting *Procreative Beneficence* (duty to select best) but *opposing gene editing* (Case 5A) is **incoherent**. If editing maximizes benefit, the duty requires it.  
  - Supporting *savior sibling selection* (Case 3) but *rejecting stature selection* (Case 2) is **unclaimed but coherent** (prioritizing altruism over enhancement).  
  - Believing *selection is permissible but state funding is always wrong* is **rare but coherent** (libertarian view).  

  **Redrawing the Tree**:  
  - If **embryo moral status** were central, a first node (*"Is discarding embryos morally equivalent to killing a person?"*) would restructure everything. You excluded this, so it’s omitted.  
  - If **genetic determinism** were contested, Case 5B (temperament) might need rephrasing to clarify predictive certainty.  
  - **Editing vs. selection** (Case 5A) could be merged if technological equivalence is assumed, but you present them as distinct.  

  ---

  **Recommendation for Characters**:  
  - **Counselor**: Likely *Discretionary Selector* (Leaf 9) + *State Funding Supported*. Defends parental choice within rules.  
  - **Clinician**: Could be *Therapeutic Thresholder* (Leaf 2) + *Systemic Critique* or *Core Traits Conservator* (Leaf 7). Their "moral mess" suggests discomfort with non-medical traits or commercialization.  
  - **"Three ethicists in one head"**: May jump between *Procreative Beneficence* (duty), *Expressivism* (Case 4), and *Systemic Critique* – a **tense but coherent** bundle if they believe: *Parents should maximize welfare (Leaf 8), but revealing traits harms others (Leaf 4), and state funding incentivizes eugenics (systemic).*  

  This tree isolates inconsistencies: A character can’t coherently hold *Procreative Beneficence* while rejecting *gene editing* for health gains or supporting *full prohibition* while endorsing *savior siblings*. Use dialogue to force these choice points.
