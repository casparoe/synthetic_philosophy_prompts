  My credence settles at 0.15—slightly lower than theirs. Why? Because even in undecidable cases, we don’t truly "jump out"; we embed into larger decidable fragments (e.g., bounded model checking). The load-bearing term is the *decidability* of MU: it’s cherry-picked to make type-1 trivial. If MU required undecidable reasoning (it doesn’t), that’d shift me, but no such example exists. 

