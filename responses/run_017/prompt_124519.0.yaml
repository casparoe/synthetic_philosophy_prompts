  First, I need to internalize their framing. Type-1 is about finding conserved quantities (like the I-count mod 3), yielding a compact certificate. Type-2 involves mirroring the system into another formalism to achieve self-reference. The user suspects MU's elegance is cherry-picked, making type-2 seem more profound than it is. Their credence is 0.25 that MU supports type-2 as fundamental. 

