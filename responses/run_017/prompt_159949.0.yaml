answer: |-
  ## The Idle Wheel: Why Universalism's Free Lunch is Worthless

  Your flatmate champions David Lewis's vision: once simples exist, their fusion follows as an ontological free lunch. It supposedly costs nothing—supervenient, causally inert, redundant in matter and power—yet buys us the table in the room. But a lunch that's free is also idle: it does no work. And ontological idleness isn't benign; it’s a sign we should purge the posit entirely. Nihilism, armed with plural quantification and paraphrase, achieves everything universalism promises without this inert baggage. Let's see why the fusion is a wheel that spins freely, disconnected from the engine of reality.

  First, the nihilist's paraphrase machinery—plurals, arrangements, and predicates—*already* provides everything the universalist claims the fusion delivers. When we say "There is a table," the nihilist paraphrases: "There are some simples arranged tablewise." This machinery captures all the *truth conditions* the universalist assigns to the sentence. We quantify plurally over the simples ("There are some simples..."), we predicate arrangement properties ("...arranged tablewise"), and we explain spatial location, persistence, and function entirely through the relations and properties of these many parts. The table's causal powers? Just the coordinated micro-causal powers of the simples, interacting under their arrangement. The universalist points to the fusion and says "It does this!" but the nihilist points to the dancing simples and says "*They* do this, precisely *because* they are arranged thus." The fusion adds no *explanans* not already present in the plural description. The universalist's "free lunch" is served on a plate already laden by the simples themselves.

  Second, consider the powerful arguments van Inwagen deploys against moderate views like his own "life only" answer. He insists composition cannot be vague—we cannot tolerate fuzzy facts about *whether a thing exists*. He insists we cannot have two distinct objects sharing all the same proper parts. He rejects brute emergence: wholes cannot possess fundamentally new causal powers inexplicable by their parts. **Crucially, both nihilism and universalism satisfy these constraints.** Nihilism has no vagueness in existence: simples exist, and nothing else does. There’s no problem of coincident objects because there are no composite objects to coincide. There’s no brute emergence because there *are* no emergent wholes. Universalism also avoids vagueness in existence (composition *always* happens), coincidence (only one fusion per parts), and brute emergence (the fusion has no extra powers). These arguments annihilate moderate views but are impotent in choosing between universalism and nihilism. They don't favor the fusion; they merely eliminate the middle ground, leaving the field to the two deflationary extremes. The shared victory highlights that the fusion itself isn't *required* by these constraints; it's an optional extra.

  "But surely," the universalist protests, "the fusion is needed *here*!" Let's tackle the hard cases head-on:

  1.  **Singular Reference & Demonstration:** Pointing and saying "That table!" seems to pick out *one thing*. The nihilist says you demonstrate the *many simples arranged tablewise*, collectively. We readily use plural demonstratives ("Look at *those sheep*" referring to a flock). Our language easily accommodates plural reference to collectives fulfilling a role. The apparent singularity is a feature of our cognitive focus and linguistic convention, not proof of an ontological singularity.
  2.  **Mass & Unity of Thought:** "The table weighs 20kg." The nihilist: "The simples arranged tablewise collectively weigh 20kg." Mass is additive; the plural mass is the sum of the individual masses. "I am thinking about the table." Here, I’m thinking *about those simples arranged tablewise*. The thought's content involves the collective and its arrangement. While the *phenomenology* of thinking "one thing" is strong, the nihilist argues this reflects how our minds *represent* complex pluralities as units for cognitive efficiency, not an ontological requirement for a single subject of the thought *out there*.
  3.  **Macro-Causation & Explanation:** "The table stopped the door." Universalist: The fusion caused the door to stop. Nihilist: The coordinated interactions of those simples, given their rigidity and position *as arranged*, transmitted force to the door, causing it to stop. Physics explains the door's stopping entirely by forces exerted *by the simples* on the door's simples. Invoking the fusion adds no causal mechanism; it merely redescribes the outcome of the micro-interactions already accounted for by the plural description. The macro-explanation is pragmatically useful shorthand for the complex micro-story, not evidence of a distinct macro-causal agent.
  4.  **Counting:** "There is one table, not a million simples." Counting reflects our practical interests and sortal concepts. We count functional units. "One table" means one collection of simples fulfilling the table-role in a specific region. We don't count the simples *as table*; we count the table *as one functional unit realized by many simples*. The count reflects the unity of *function*, not a brute ontological unity beyond the parts.

  **Now, your crucial insight:** When a universalist tries to defang the fusion by declaring "The table *just is* the simples taken together," they stand perilously close to nihilism. If "the table" is *literally identical* to "the simples taken together," then they are admitting there is only *one* entity here: the plurality of simples. But plural logic denies that a plurality *is* a single thing; it *refers* to many things. Saying "The fusion *is* the parts" either commits a category error (equating a singular with a plural) or collapses into saying the singular term "the fusion" is just a way of talking about the plural referent – which *is* the nihilist's paraphrase strategy in universalist clothing! If the fusion isn't something *over and above* the parts in a way that makes it a distinct singular entity, what work is it doing that the plurals don't already manage? The "free lunch" becomes a rhetorical flourish masking an empty plate.

  **Where it Hurts:** The paraphrase *isn't* easy. The hardest nut is the **phenomenology of unity**, especially in consciousness and agency. Thinking "I am one person" *feels* irreducible. The nihilist must bite the bullet: the "I" refers to the extraordinarily complex arrangement of simples constituting my brain/body, and the feeling of unity is a property emerging from that arrangement's specific causal dynamics. This feels deeply revisionary. Paraphrasing complex social or functional objects (nations, symphonies) also requires careful, sometimes awkward, linguistic work. It demands a significant shift in how we conceptualize the world.

  **My Least Confident Premise:** I'm least confident about **macro-causation being *entirely* reducible without loss**. While I maintain *causal powers* reside solely in the simples, some macro-*explanations* (e.g., in biology or ecology) might resist smooth, non-misleading paraphrase into *only* micro-interactions. The patterns and counterfactuals captured by macro-explanations *might* suggest a genuine level of organization where talk of wholes *as wholes*, not just pluralities, is indispensable for capturing real causal *patterns*, even if the *mechanism* is micro. If compelling cases emerged where a macro-explanation demonstrably predicted or explained phenomena that *could not* be captured, even in principle, by a vastly complex micro-story + arrangement predicates, that would challenge the nihilist's claim of perfect paraphrase adequacy and potentially warrant the fusion as an explanatory posit.

  **Conclusion:** The universalist's fusion is an ontological spare tire. It adds no causal oomph, resolves no vagueness van Inwagen fears that nihilism doesn't also resolve, and buys no explanatory power beyond what plurals and arrangements already provide. Its apparent necessity for singular thought, reference, and causation dissolves under plural analysis. The cost of the nihilist's paraphrase—linguistic revisionism and grappling with phenomenological unity—is real but reflects the world's underlying complexity, not an ontological shortcoming. The cost of universalism is ontological bloat: populating the world with countless trillions of causally inert, explanatorily redundant objects simply because their parts exist. A lunch that's free and idle isn't worth the price of admission. Discard the fusion; embrace the plurals. Your flatmate is paying for an empty plate. Nihilism wins on parsimony.
