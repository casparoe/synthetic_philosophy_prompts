prompt: |-
  I'm a third-year undergraduate in a seminar on democratic theory, and I've been asked to lead one 80-minute session for about eighteen classmates on the boundary problem — the difficulty that any vote presupposes a settled answer to who is entitled to vote, while every proposed answer to that seems itself to have been settled by somebody, and so on down. I want them to run into it rather than hear it from me: no lecture up front, and the name of the problem shouldn't be said until the debrief.

  My rough plan, which I'd like you to design properly or replace: the group has to make one genuinely binding but small decision (how we use the final seminar, plus roughly twenty-five euros of leftover course money for food), and before that they must decide who counts, by a vote held under a franchise I assign arbitrarily and in advance — say, only students whose surnames fall in the first half of the alphabet, or only those dealt a marked card on arrival. They should then propose and vote on a principled rule of their own and only discover afterwards that any rule they accept has to be applied to the choice of the rule. Partway through I'll hand them a second, wider decision — one that would bind the whole department or next year's cohort — so that they have to recompute the franchise from scratch and notice that the demos seems to shift with the decision rather than being a fixed group of people.

  One principle of my own that I'd like the activity to put pressure on: membership graded by whether the decision changes what a person can do, the set of options available to them, rather than by how well off they end up. I want that tested against the two familiar ones — everyone whose interests are affected, and everyone who will be subject to the decision's enforcement — including the cases where it diverges from them.

  Please give me the rules, materials, card or role assignments, a minute-by-minute timeline, and a debrief that maps specific moments in the activity onto the regress, the decision-relativity of the demos, and the differences among the three principles. Tell me what will predictably go wrong the first time I run it and how to handle it, and be frank about what the activity cannot reproduce and I will have to say myself — I suspect, among other things, that real boundaries are closed by territory, force and constitutional settlement before anyone gets to vote on them, and that walking out is available in a classroom in a way it is not in a state.

  End with a single last line beginning Activity in one sentence:
reasoning: |-
  Okay, the user is a third-year undergrad leading an 80-minute seminar on the boundary problem in democratic theory. They want an interactive activity where students discover the problem themselves, without upfront lecturing. The key elements are: a binding small decision (using leftover money), an arbitrary initial franchise rule (like first-half surnames), then letting them propose their own principled rule, and introducing a wider decision later to show demos relativity. They also want to test three membership principles: affected interests, subject to enforcement, and the user's own principle about changes to options/abilities.

  Hmm, the user’s plan is solid but needs tightening. The arbitrary franchise must feel jarring—marked cards could work better than surnames to avoid real-world associations. For the "change in options" principle, I’ll need scenarios where enforcement/interest diverge from capability shifts (e.g., a rule that closes a building affects non-enforced passersby). 

  Predictable issues: students might resist the arbitrary exclusion or disengage. Contingency: emphasize the binding stakes early, and have a "walkout" protocol ready. Also, groups often default to "affected interests" without pressure—so the second decision must force tradeoffs (e.g., departmental policy affecting future students). 

  What the activity can’t capture: real-world boundaries rely on force/constitution, not voting. I’ll flag this in debrief. The walkout option in class is unrealistically easy versus states. 

  Structure: 
  - Phase 1: Arbitrary exclusion (marked cards). Vote on pizza. 
  - Phase 2: Propose franchise principles. Vote—inevitably face regress when applying their own rule. 
  - Phase 3: Wider decision (department policy), exposing demos relativity. 
  Debrief maps moments to concepts: e.g., "When you voted on the pizza franchise, who authorized *that* voter list?" 

  Last line: "Activity: Students experience franchise boundary regress through staged democratic decisions with shifting stakes and forced rule-application to their own selection process."
answer: |-
  Here’s a fully designed activity with rules, timeline, materials, and debrief. It prioritizes experiential learning while targeting your core principles.

  **Core Mechanics:**  
  Three decision rounds escalate stakes and expose franchise paradoxes. Rules force application of principles to their own selection, triggering regress.

  ---

  ### **Materials**  
  - 30 blank cards (18 + extras)  
  - 12 red stickers, 6 blue stickers (for "marked cards")  
  - €25 in cash (or fake bills) + pizza menu  
  - 3 poster papers: "Affected Interests," "Subject to Enforcement," "Change in Options Available"  
  - Timer  

  ### **Role Assignments (Pre-Session Prep)**  
  - Mark 12 cards with red stickers (Group A), 6 with blue stickers (Group B). Shuffle and distribute randomly as students enter. *No explanation given.*  
  - Reserve 4 seats at the front as "Department Reps/Observers" (empty initially).  

  ---

  ### **Timeline (80 mins total)**  

  #### **Phase 1: Arbitrary Franchise & Small Decision (20 mins)**  
  - **0:00** "Today we make binding decisions about seminar funds. First: use €25 for final session food. Options: Pizza (€20), Bakery pastries (€15), or Ice cream (€25). Vote now."  
  - **0:02** Interrupt: "*Stop*. Only those with **red-stickered cards** may vote. Others observe." (Group A votes; likely picks pizza).  
  - **0:05** Announce result. Distribute pizza order form.  

  #### **Phase 2: Franchise Rule Creation & Regress (25 mins)**  
  - **0:06** "Before implementing this, we need a *fair* voting rule. Propose principles for who votes. Use these categories." Introduce 3 poster principles:  
    > **Affected Interests**: Votes if outcome impacts well-being.  
    **Subject to Enforcement**: Votes if bound by penalties/non-compliance.  
    **Change in Options**: Votes if decision alters their feasible actions/access.  
  - **0:10** Small groups (5 mins) draft franchise rules using one principle each. *Assign principles to groups secretly* (e.g., Group A: Affected Interests; Group B: Change in Options; etc.).  
  - **0:15** Groups propose rules. Examples:  
    - *Affected Interests*: "All who eat the food."  
    - *Enforcement*: "All present who must clean up."  
    - *Change in Options*: "All who could attend the final session."  
  - **0:18** "Now *vote* on which rule to adopt... but who votes? **Apply your proposed rule now**." Chaos ensues.  
  - **0:22** Force a vote using Phase 1’s arbitrary rule (red cards) to "resolve" impasse.  

  #### **Phase 3: Wider Decision & Demos Relativity (20 mins)**  
  - **0:23** Introduce Decision 2: "The department allocates €500 for next year. Option A: Guest speaker. Option B: Field trip. Option C: Equipment. This binds *all future students*."  
  - **0:25** "Recompute the franchise: Who votes *now*? Use your *adopted rule* (from Phase 2)."  
    - *Predictable issue*: Rules break down. "Affected Interests" now includes future students (absent). "Enforcement" may exclude them. "Change in Options" includes those barred from future events.  
  - **0:30** Place 4 "Department Reps" in reserved seats. Announce: "They will enforce this but claim no stake. Can they vote?" Tests divergence between principles.  
  - **0:35** Vote using ad hoc method (e.g., "all present"). Note tensions.  

  #### **Debrief (15 mins)**  
  - **0:40** Name the problem: "You encountered the **boundary problem**." Map moments:  
    | **Activity Moment**          | **Concept**                          |  
    |------------------------------|--------------------------------------|  
    | Red cards voting on pizza    | Arbitrary initial franchise          |  
    | Voting on franchise rules    | Regress: Who authorizes the rule?    |  
    | Recomputation for Decision 2 | Decision-relativity of the *demos*   |  
    | Dept. Reps debate            | Principles diverging (e.g., enforcement ≠ options changed) |  
  - **0:45** Contrast principles:  
    - *Decision 1*: "Change in Options" might exclude gluten-free student if pizza chosen (options reduced). "Affected Interests" includes them.  
    - *Decision 2*: "Change in Options" includes future students (access altered); "Enforcement" excludes them (no power over them).  
  - **0:48** Reality checks:  
    - "In states, boundaries use force/territory, not voting. Walkouts here are costless; exiting a state isn’t."  
    - "Constitutions ‘freeze’ the regress—but who ratified *that*?"  
  - **0:52** Open discussion: "Which principle felt most defensible? Why?"  

  ---

  ### **Predictable Issues & Fixes**  
  - **Issue**: Excluded students disengage.  
    **Fix**: Assign "observer" tasks: track who is silenced, note power moves.  
  - **Issue**: Groups ignore assigned principles.  
    **Fix**: Privately remind groups of their principle during drafting.  
  - **Issue**: Franchise vote deadlocks.  
    **Fix**: Use arbitrary rule (as above) to model real-world imposition.  
  - **Issue**: "Change in Options" is conflated with interests.  
    **Fix**: Stress: "Not about better/worse outcomes—about *new constraints/opportunities*."  

  ### **What the Activity Can’t Capture**  
  - **Violence/territory**: Emphasize debrief point: real demoi are fixed by borders/conquest, not logic.  
  - **Scale**: Classroom decisions lack emotional stakes of citizenship/immigration. Assign readings to compensate (e.g., Whelan’s "Democratic Theory and the Boundary Problem").  
  - **Constitutional entrenchment**: Note that rulesets avoid regress by being pre-commitments—but their origins are contested.  

  **Activity in one sentence:** Students confront franchise regress and demos relativity through binding votes governed by shifting principles, exposing the boundary problem via exclusion, rule-application paradoxes, and stakes-driven membership.
