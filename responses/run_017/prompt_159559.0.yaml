answer: |-
  ### Private Notes (Unpolished)
  **Bin 1: Claims about what an object is**  
  - Autographic works: Identity tied to specific physical instantiation. A molecule-for-molecule duplicate is ontologically distinct because it lacks the causal history (artist's hand, original materials). Like two files with identical hashes but different storage locations—except physical objects can't be content-addressed away.  
  - Allographic works: Identity defined by compliance with a template (e.g., score, digital file). Any correct instance is authentic. Maps cleanly to content-addressed storage: same hash = same work.  
  - *Slides*: When "original material" (object bin) is conflated with "proof of creation" (knowledge bin) to imply uniqueness.  

  **Bin 2: Claims about what we can know**  
  - Provenance as evidence: Trusted custody chains (signatures, timestamps) verify origin. Gaps or expired trust roots (e.g., defunct notary) break knowledge, not necessarily the object.  
  - Misattribution: False authorship claims. Like a valid signature over mismatched content (hash mismatch).  
  - *Slides*: Treating broken knowledge (e.g., custody gap) as altering the object’s identity (e.g., "it’s now suspicious").  

  **Bin 3: Claims about what a viewer's experience is worth**  
  - Belief-driven attention: Knowing provenance amplifies perceptual engagement. Like metadata (signature validity) altering file interpretation.  
  - Achievement aura: Value from witnessing residue of a feat. No digital equivalent—hash doesn’t capture effort.  
  - *Slides*: Equating material continuity (object bin) with "aura" (experience bin) to justify restoration acceptance.  

  ---

  ### Translation to Cryptographic Vocabulary  
  **Framework Rules**  
  - "Object" = canonical byte sequence (content-defined).  
  - "Provenance" = signed attestation chain (trust root → current state).  
  - "Authenticity" = valid signature chain + hash match.  

  **(a) Identity**  
  - Autographic: Physical original = initial commit with irreversible material history. A molecule-for-molecule duplicate is a *fork*: same state but divergent history. Hashes can’t distinguish forks—requires external metadata (e.g., "artist:master"). *No expression* for material uniqueness.  
  - Allographic: Work = hash. Forks collapse; only misattribution (wrong metadata) is possible.  

  **(b) Achievement**  
  - Achievement = the signed initial commit. Copies inherit state but not the commit’s authority (signature). Like a forged signature over a verified hash: valid data, invalid origin claim.  

  **(c) Experience**  
  - Belief effect = access-controlled metadata. Knowing provenance = reading a valid ACL entry. Forgery lacks valid ACL, reducing engagement.  

  **Case Translations**  
  1. **Molecule-for-molecule duplicate**  
     - *Translation:* Identical hashes = same digital object. Physical duplicate is two objects with same state but distinct storage addresses. Your system *cannot express* physical separation—hashes abstract location. Resembles a bit-identical file with corrupted metadata (broken provenance), but physicality adds irreproducible entropy (e.g., canvas fiber alignment). *No name* for this; it’s a fork with no merge path.  

  2. **Continuity under intervention**  
     - *Translation:* Restoration = lossless transcode + metadata update. Canonical master is the template (allographic), not the original bytes. Physical painting’s material continuity fails to map: your system tracks lineage via derivatives (e.g., "v2_restored.lzw"), but material addition/removal is a new commit. Lossless transcode is a *derivative copy* unless canonicalized as new master—but that’s a governance choice, not technical.  

  3. **The gap**  
     - *Translation:* Custody hole = broken hash chain; expired notary = invalid trust anchor. This breaks *knowledge* (warranty), not authenticity. Object unchanged if hash matches pre-gap attestation.  
     - (a) & (b) treat as changed object (lacks "original" status); (c) treats as changed viewer (lost trust). Your vocabulary *registers only knowledge loss* (invalid chain), not ontological shift.  

  4. **Shared authorship**  
     - *Translation:* Workshop collaboration = unsigned commits in a pull request later signed by master. Signatures are binary (valid/invalid), but "blame" can trace byte origins. Achievement account requires granular contribution weighting (e.g., "idea=master, fill=workshop"). Signatures can’t represent this—*bug in signatures for this purpose*. Art history ascriptions are fuzzy consensus; your system enforces binary truth.  

  ---

  ### Residue Report  
  **1. Clean Translation (No Loss)**  
  - Allographic identity: Hash = work. Perfectly maps to content-addressing.  
  - Misattribution: Invalid signature over correct hash = mislabeled origin.  
  - Provenance gaps: Broken chain = untrusted metadata.  

  **2. Distorted Translation (Requires Explicit Assumption)**  
  - Achievement: Only translates if you *stipulate* that a valid signature = proof of feat. But signatures verify origin, not effort. Distortion: Smuggles "effort" into "attestation."  
  - Material restoration: Lossless transcode + re-signing maps only if you accept canonicalization as continuity. Distortion: Equates governance fiat (new master) with physical persistence.  

  **3. No Expression Possible**  
  - Physical uniqueness (Case 1): Hashes abstract location/material history. *Blind spot*—registry can’t capture causal singularity.  
  - Viewer experience (c): Belief alters perception. ACLs control access, not psychological impact. *Blind spot*—no cryptographic analog for aura.  
  - Gradual authorship (Case 4): Achievement degrees. Signatures lack nuance. *Philosophical claim unclear*—"achievement" isn’t quantifiable, so signatures over-simplify by design.  

  **Recommendation**  
  Add **dwell-time metrics** to metadata. Record anonymized viewer engagement (e.g., avg. seconds viewed) tied to artifact IDs. This lets you quantify experiential value (c) without philosophical baggage. Stores as signed logs in provenance chain, enabling analysis of how provenance validity correlates with attention.
