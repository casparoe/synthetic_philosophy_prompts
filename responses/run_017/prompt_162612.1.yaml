prompt: |-
  I've been arguing with myself about voting for years, and I can't get my gut verdicts on actual ballots to line up with any of the three things I keep hearing: that voting is a duty of citizenship; that one vote never decides anything, so it hardly matters what you do with it; and that a vote is mostly a statement about what you stand with. I'm not an academic — I've just been reading around on my own and arguing with friends. So I'd like to try it from the other end. Here are my verdicts on elections I actually voted in or skipped. Is there a principle that gets them, or close to all of them — and if not, which verdict would you overturn, and why?

  1. National election, in a district that hasn't gone my way in fifty years. My vote had no realistic chance of deciding anything. I voted, and I'd have felt I'd let something down if I hadn't. Not voting here strikes me as a small failure, not merely a missed opportunity.

  2. A water-district election: four names I'd never heard of, no time to find out anything about them. I skipped it and feel nothing about it. Actually I think voting there would have been *worse* than skipping — filling in a ballot at random feels like a small abuse of the thing.

  3. But my knowledge of the national candidates wasn't much better, and skipping that one would have felt like a real failure. Same ignorance, opposite verdicts, and I can't tell you what the difference is supposed to be. This is the pair I most want an account of.

  4. Safe state, national election: I voted for a small party I genuinely prefer, knowing it couldn't win. Part of my reason was that crossing some threshold of the vote gets them ballot access and public funding next time. This feels not just permitted but good — better, somehow, than voting for a candidate I like less.

  5. Same ballot, same party, but imagine I'd lived somewhere the race was genuinely close. There, voting for the small party feels wrong, and I think I'd owe my vote to the lesser evil — even though I still think the small party is better, and even though I can't see how my one vote is detectably more likely to matter in the close state than in the safe one.

  6. An election where both plausible winners backed a policy I think is seriously unjust. In my safe state I wrote in a joke name; that felt like the honest thing, better than holding my nose. In a close state I'd have held my nose and voted for the lesser evil, and I expect I'd have come away feeling a bit complicit — as if I'd been made partly responsible for something I oppose — but I think I'd still have been right to do it.

  7. One year I voted after the winner had already been projected, because my state's polls closed late. I stood in line anyway and don't regret it. But I couldn't say why. If voting is about affecting outcomes, that trip to the gymnasium was pure theater; it didn't feel like theater, and I don't think I'd have blamed someone for staying home.

  8. There are (or were) websites that match voters across states: I vote for their preferred candidate in my close state, and someone in a safe state votes for mine. I never did it, but I think it's fine, and I also find it faintly grubby — like trading something that shouldn't be traded — even though no money changed hands and both people end up voting for someone they prefer to the alternative. I go back and forth on this one and would like it settled.

  9. I'm a dual citizen and have lived abroad for a decade. I could have voted in the country I grew up in and didn't; that felt right, since I don't live with the results. But I still own a house there and pay taxes there, and a friend in exactly my position did vote, and I can't bring myself to say she was wrong.

  10. Compulsory voting: I think there's a duty (see case 1), and I also think fining people for staying home is wrong. A friend says those two can't both be true. I don't see why not, but I can't say why they can.

  My own attempt at a formula, offered to be picked apart: taking part is something you owe, and it's owed whether or not your vote can matter; but what you do with the vote is governed by expected consequences when there's a real chance of mattering, and by saying what you actually think when there isn't. That handles 1, 4, 5 and 6 nicely, I think, but I don't see how it handles 2 and 3, and it says nothing about 7, 8 or 9.

  Please write in plain prose, no citations or reading lists — I have no access to the literature and want the argument anyway. I'd like the answer in five named sections, in this order:

  - **Candidate principles** — about 250 words. Two or three principles stated precisely enough that I could apply them myself to a new ballot, with a note on what separates them.
  - **My formula, tested** — about 150 words. Where my tentative formula holds against the ten cases and exactly where it breaks.
  - **Where each clause comes from** — about 350 words. Clause by clause, the case that forces it, including the two clauses that exist only to save verdicts 2/3 and 5.
  - **Cases I didn't list** — about 250 words. What your best principle says about at least three elections I didn't mention — say, being offered a gift card by a campaign to go vote; a ballot with an official "none of the above" option that can force a re-run; and a binding referendum on something technical I don't understand — plus, please, the vote-swap in case 8.
  - **What I'd have to give up** — about 200 words. Which of my verdicts no single principle can hold onto, and what I'd gain in simplicity by dropping each.
reasoning: |-
  Hmm, the user has been wrestling with the ethics of voting for years. They've provided ten real-life scenarios where they made voting decisions, along with their gut feelings about those choices. Now they want me to extract a coherent principle from these examples. 

  The user isn't an academic - just someone who's read and debated with friends - so they want plain prose without citations. They've even structured exactly how they want the response: five named sections with specific word counts. I need to follow that carefully.

  Looking at their cases... There's tension between duty, efficacy, and expression. Case 1 shows they feel voting is obligatory even when ineffective. Case 2 reveals they consider uninformed voting worse than abstaining. But case 3 puzzles them because the same ignorance in national elections doesn't trigger that feeling. 

  Their proposed formula separates "when to vote" from "how to vote" based on efficacy. But it fails to explain why skipping the water district election (case 2) feels neutral while skipping the national one (case 3) feels wrong. That's the crux.

  For the principles... I'm considering three candidates: Pure Duty (vote always, express honestly), Pure Consequentialism (vote only when pivotal, maximize good), and their Hybrid which distinguishes participation from choice. The Hybrid seems closest to their instincts but needs refinement.

  The water district case (2) is key. Why is uninformed voting worse there but acceptable nationally? Probably because national elections have symbolic weight - they represent the social contract. Local technical elections don't carry that meaning. This suggests adding a "significance" clause to the Hybrid principle.

  For their formula test... It works for cases 1,4,5,6 but stumbles on 2/3 and ignores 7-10. Case 7 (voting after projection) is about ritual, case 8 (vote-swapping) tests vote alienability, case 9 (expat voting) involves stakeholding, case 10 (compulsory voting) separates duty from coercion.

  New cases to consider... Gift cards for voting? That violates the non-commodification implied in case 8. "None of the above" option? Allows expression without wasted vote. Technical referendum? Abstention is better than guessing.

  Finally, about sacrifices... To have one principle, they'd need to drop either the duty component (losing case 1's feeling) or the expression component (losing case 4's small-party vote). The water district verdict (case 2) might also need softening since significance is subjective.

  The user seems thoughtful and genuinely conflicted. Their cases reveal someone who values both civic integrity and practical impact. I'll aim to honor that complexity while offering clarity.
answer: |-
  Here’s a principle distilled from your verdicts, tested against your cases, and extended to new ones:

  ---

  ### **Candidate Principles**
  1. **Expressive Duty Principle**: You have a duty to participate in elections that symbolize your membership in a political community. This duty requires casting a *meaningful* vote—one that reflects your actual judgment. Abstention is acceptable only if voting would be insincere (e.g., voting randomly).  
  2. **Consequentialist Principle**: When your vote has a realistic chance of affecting outcomes (e.g., in close races), you must prioritize minimizing harm or maximizing good. Voting expressively becomes irresponsible if it risks enabling a worse outcome.  
  3. **Hybrid Principle** (your refined version): **Voting is a duty of membership in significant political communities, requiring sincere expression when your vote won’t affect outcomes, and consequentialist calculus when it might.**  
  *What separates them*: The Hybrid Principle fuses duty and consequences but adds "significance" to define when duty applies (resolving 2/3) and "sincerity" to define valid expression (resolving 4/6). Pure Duty ignores consequences; Pure Consequentialism ignores symbolic obligations.

  ---

  ### **My Formula, Tested**  
  Your formula works for:  
  - **1** (duty without efficacy), **4** (sincere expression in safe state), **5** (consequences in close state), **6** (sincere vs. consequentialist voting).  
  It breaks on:  
  - **2/3**: Why is skipping the water district neutral but skipping the national election a failure? Your formula doesn’t define *which elections impose duty*.  
  - **7/8/9/10**: It doesn’t address late voting, vote-swapping, expat voting, or compulsory fines.  

  ---

  ### **Where Each Clause Comes From**  
  - **"Duty of membership"**: Forced by **Case 1** (voting despite futility) and **Case 3** (ignorance feels worse nationally than locally). National elections symbolize citizenship; obscure water-board votes don’t. Duty applies only to "significant" contests.  
  - **"Significant political communities"**: Resolves **2/3**. "Significance" captures why you owe participation in national/state elections (affect your identity/community) but not minor ones (no symbolic weight).  
  - **"Sincere expression when no efficacy"**: From **Case 4** (voting for a small party feels good) and **Case 6** (writing in a joke candidate). When your vote can’t matter, honesty is paramount; random voting (**Case 2**) violates sincerity.  
  - **"Consequentialist calculus when efficacy possible"**: Forced by **Case 5** (voting small-party in a close race feels wrong) and **Case 6** (holding your nose in swing states). When outcomes are at stake, you trade expression for harm reduction.  
  - **"Sincerity" over mere "statement"**: Your aversion to random voting (**Case 2**) and swap sites (**Case 8**) implies votes must reflect *your* judgment, not just "what you stand with."  

  ---

  ### **Cases You Didn’t List**  
  Applying the Hybrid Principle:  
  - **Gift card to vote**: Acceptable if you vote sincerely (*duty fulfilled*). But if the reward pressures you to vote randomly, it violates sincerity and is wrong (like **Case 2**).  
  - **"None of the above" (NOTA)**: Voting NOTA is sincere expression when you reject all options. If it forces a re-run, it becomes consequentialist (could enable better candidates) and is doubly justified.  
  - **Technical referendum**: Skipping is neutral if you lack expertise (like **Case 2**). Voting randomly would be insincere; duty applies only if you grasp the stakes.  
  - **Vote-swap (Case 8)**: Violates sincerity. Even if you "prefer" the swapped candidate, outsourcing your vote to a stranger makes it a commodity, not *your* judgment. Hence the "grubbiness."  

  ---

  ### **What You’d Have to Give Up**  
  No single principle saves every verdict. To hold the Hybrid Principle, you’d sacrifice:  
  - **Case 7’s non-regret**: Voting after projection has no efficacy *or* expressive power (outcome is known). The principle can’t justify it—you’d need to accept it as irrational ritual or drop the duty clause.  
  - **Case 9’s expat abstention**: If you pay taxes/own property, you’re still "member-adjacent." The principle might urge voting if you’re informed, contradicting your "don’t live with results" stance.  
  - **Case 10’s anti-fine view**: If voting is a duty of membership, fines enforce that duty (like taxes). To oppose fines, you’d need to weaken "duty" to "moral ideal."  

  **Simplicity gains**: Dropping the duty clause (**Case 1/7/10**) makes voting purely instrumental—simpler, but loses civic meaning. Dropping consequences (**Case 5/6**) lets you always vote your conscience—simpler, but ignores swing-state stakes.  

  ---  
  The Hybrid Principle best honors your instincts by splitting the vote: **why** you vote (duty to community), **how** you vote (sincerity vs. consequences), and **when** duty applies (significance). It treats voting as both a ritual of belonging and a tool for change—but only where belonging matters.
