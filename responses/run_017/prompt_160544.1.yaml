answer: |-
  Here is the strict mapping to your specifications:

  **1. Belief Attribution and Propositional Specificity**  
  - *Subjects/Propositions:*  
    - **Colonization (1981-82):** Warren/Marshall claim *"Spiral bacteria colonize human stomachs."* Evidence: Biopsy observations (+ accidental culture). Field rejects due to 1954 "sterile stomach" dogma.  
    - **Causation of Gastritis (1984):** Marshall claims *"Bacteria cause gastritis."* Evidence: Self-experiment satisfying Koch’s postulates for gastritis. Field rejects as anecdotal/insufficient for overturning paradigm.  
    - **Causation of Ulcers (1984-94):** Marshall/Warren claim *"Ulcers are primarily infectious."* Evidence: Epidemiological correlations, some biopsy associations, antibiotic success in pilot studies. Field rejects due to lack of mechanistic explanation, inconsistent antibiotic results, stress/acid model coherence.  
  - *Jamesian Option Analysis:*  
    - **Liveness:** Colonization/gastritis claims were live post-1982 culture (contradicting dogma, but evidence existed). Ulcer claim less live initially (mechanism gap).  
    - **Forcedness:** For Marshall *as clinician-investigator*, pursuing treatment was forced: withhold antibiotics (status quo) vs. trial them (novel action). For the *field*, "adopt antibiotic therapy" vs. "await more data" was unforced – a genuine third option existed.  
    - **Momentousness:** For Marshall (career/reputation), momentous. For individual ulcer patients refractory to acid suppression, potentially momentous. For the field, adopting a new standard of care prematurely would have been momentous (risk of harm, resource diversion).  

  **2. Belief vs. Pursuit Distinction**  
  - **Belief (Clifford):** Clifford would condemn *belief* in "bacteria cause ulcers" pre-robust trials (insufficient evidence for communal acceptance). Marshall’s *personal* belief exceeded evidence but didn’t violate Clifford if held privately/provisionally.  
  - **Pursuit (James):** James permits (even obligates) *pursuit* of a live, forced, momentous hypothesis lacking conclusive proof. Marshall’s research, self-experiment, and advocacy fall here.  
  - **The Slide:** The H. pylori case appears Jamesian *only* when pursuit (action, investigation) is conflated with belief (doxastic commitment). Marshall’s vindication is of his *pursuit* – his relentless investigation generated the missing evidence. James’s argument *requires* this slide: his "will to believe" is primarily about the right to *act as if true* when evidence is incomplete but stakes are high. Clifford strictly separates justified belief (evidence-driven) from pragmatic action.  

  **3. Self-Verification Mechanisms**  
  - **Mechanism 1 (Evidence Production):** Marshall’s belief directly caused evidence generation (self-experiment, persistent culturing, clinical trials). This is the operative mechanism here.  
  - **Mechanism 2 (Constitutive Truth):** Not applicable. H. pylori’s causal role is mind-independent biological fact.  
  - **Work for James:** Mechanism 1 is sufficient and central to James. For hypotheses where truth is contingent on investigation (e.g., "this treatment *might* work"), believing enables testing. James doesn’t require Mechanism 2 for scientific claims; generating decisive evidence validates the pragmatic gamble.  

  **4. Standpoint Asymmetry (Individual vs. Institution)**  
  - **The Principle:** Legitimate. Institutions gatekeeping clinical practice face high claim-throughput, where most novel claims are false. Higher evidential thresholds (replication, mechanistic plausibility, large-scale trials) are epistemically justified to minimize false positives and systemic harm.  
  - **Framework Resources:**  
    - *Clifford:* Explicitly social ethics supports this. The "shipowner" analogy condemns lax standards risking communal harm. Institutions bear greater responsibility for epistemic hygiene.  
    - *James:* Focuses on the individual facing a personal, momentous choice. His framework lacks resources to address institutional throughput or resource allocation. The asymmetry sits partially outside James’s view.  
  - **Not Mere Conservatism:** The 1954 study was reasonable methodology for its time; rejecting single-case reports (like Marshall’s gastritis) followed standard safeguards against anecdotal evidence.  

  **Reverse Analysis: Limitations & Asymmetries**  
  - **(a) Harm Attribution & Clifford’s Social Frame:**  
    Clifford *can* condemn the establishment *if* their skepticism stemmed from culpable ignorance (e.g., *dismissing* replicable biopsy evidence post-1982 without examination) rather than reasonable evidential thresholds. However, their initial demand for robust evidence *before* changing practice was Clifford-compliant. The harm (delayed treatment) resulted from *evidential lack* (resolved by pursuit), not credulity. Clifford’s clean reply: The community’s error was *procedural* (underfunding replication, ignoring methodological flaws in the 1954 study) not *doxastic* (they rightly withheld belief until evidence matured).  
  - **(b) Selection Effect:**  
    The case is **decoration/anomaly**, not confirmation. Jamesian pursuit succeeds here but fails in countless others (e.g., laetrile, cold fusion). Clifford’s caution is statistically vindicated by the base rate of failed challenges. The Nobel outcome doesn’t resolve the ethics; it only illustrates that Jamesian leaps *can* (rarely) accelerate truth when conventional evidence-gathering is stalled.  

  **Where the Lens is Silent: Instrumental Bottlenecks**  
  - **Non-Doxastic Obstacles:** The 2-day culture protocol, lack of suitable stains/animal models, and commercial incentives for acid suppressants were *methodological* and *economic* barriers.  
  - **Ethics of Belief Scope:** Clifford/James address *doxastic justification* (when to believe) and *pragmatic action* (when to act on a belief). They are silent on:  
    - Allocation of research resources  
    - Laboratory protocol design  
    - Commercial influence on scientific priorities  
    - Development of tools/methods  
  - **Conclusion:** The core epistemic conflict (belief/pursuit) arises *after* these bottlenecks are overcome serendipitously. The theories properly analyze Marshall’s response to the dogma but not the prior inertia caused by non-epistemic factors.  

  ---
  This analysis adheres strictly to your constraints: no moralizing, no bibliography, and no expansion beyond the requested philosophical mapping using the H. pylori narrative as defined.
