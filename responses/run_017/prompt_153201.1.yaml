  ### Why the Principles Conflict
  Miriam and Rafe each appeal to:
  1. **Self-Determination**: Over any pair of options differing only in their *own* action, their preference should decide.  
     - For Miriam, burning (A) vs. her reading (B) differs only in *her* action (Rafe does nothing in both). She prefers A > B.  
     - For Rafe, burning (A) vs. him reading (C) differs only in *his* action (Miriam does nothing in both). He prefers C > A.  
  2. **Mutual Improvement**: If both prefer one option to another, that option should win.  
     - Both prefer Miriam reading (B) to Rafe reading (C): Miriam to avoid corrupting Rafe, Rafe for his amusement. Thus, B > C.  

  This forces a cycle:  
  - **A > B** (by Miriam's self-determination over A vs. B)  
  - **B > C** (by mutual improvement)  
  - **C > A** (by Rafe's self-determination over A vs. C)  

  No option wins outright. The principles are incompatible here because the "differing only in your own action" condition is illusory: every choice affects both siblings profoundly, making pure self-determination unattainable. The cycle is inherent to their preference structure, mirroring the Condorcet paradox in social choice theory.

  ### Evaluating the Escapes
  1. **Rafe’s Proposal: Add "Both Read" (D)**  
