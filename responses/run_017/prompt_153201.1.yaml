       - If A vs. C is first: Rafe votes C, Miriam votes A → solicitor’s tiebreak. If he picks C, then C vs. B: both prefer B > C → B wins.  
       - If B vs. C is first: both prefer B → B wins, then B vs. A: Miriam votes A, Rafe votes B → solicitor decides.  
     - The solicitor’s preferences and the agenda sequence control the result. This violates neutrality (equal treatment of options) and may feel arbitrary. **Verdict: Conceals the problem via agenda power.**  

