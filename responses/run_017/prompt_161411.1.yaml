prompt: |-
  Hi — I run a small undergrad reading group, eight people, one two-hour session, and next week we're doing Scheffler's afterlife argument: the idea that human extinction is bad for reasons beyond the deaths and the missing future lives, because so much of what we now care about seems to depend on there being people after us. I dont want a summary of Scheffler, I want a taxonomy I can use to sort the room by what people actually think — a tree where every branch is labeled with the question that splits it, built up from the logical space first rather than from a list of isms, so tell me which four or five questions do the work and which answer-combinations are actually occupied.

  Splits I care about: whether the extra badness is about our present valuing being undermined or about something valuable being lost whatever anyone's attitudes; whether what's lost is the biological kind, the chain of transmission and being-remembered, or the unfinished projects we hold in trust; whether the manner of ending matters or only that it ends; and whether it matters if we cause it. Leaves I want to land on: the plain aggregative view, the Scheffler-style valuing-dependence view, an archive-or-audience view where what's destroyed is the community that could carry and interpret what we've made, a custodial view where extinction is a breach of trust toward a lineage of projects, an impersonal view where humanity matters whether or not we care, and a debunking view where the extra badness is an illusion. For combos your questions allow but nobody defends, say whether its incoherent, unattractive, or just unexplored, and flag any two leaves the tree can't really separate.

  Cases it has to run on: sudden extinction with thirty years notice; the same with a last generation that knows it's last and gets to finish its work; a slow voluntary fade to zero fertility with nobody dying early; replacement by a successor species that inherits our records and goes on using our concepts; extinction we cause versus an asteroid. One student always insists that the manner of ending is the whole story rather than the ending, so make that a real branch. Under a thousand words, and continuous prose only, no headings, bullets, bold or tables — walk me through the tree in sentences in the order I should ask the questions.
reasoning: |-
  Okay, let me approach this systematically. The user runs a small undergraduate reading group on Scheffler's afterlife argument and wants a taxonomy to categorize student positions. They specifically reject summary in favor of a logical framework with branching questions that lead to recognizable philosophical positions. 

  First, I need to identify the core questions that create meaningful splits in the logical space. The user has helpfully listed their priorities: whether the extra badness stems from undermined valuing versus objective loss; what specifically is lost (biological continuity, transmission chain, or unfinished projects); whether the manner of extinction matters; and whether human causation affects the badness. 

  I'm considering starting with the most fundamental divide: the nature of the badness itself. Question 1 should distinguish between subjectivist views (where badness depends on our attitudes) and objectivist views (where badness exists independently). This cleanly separates Scheffler's valuing-dependent view from impersonal views. 

  For Question 2, focusing on what is lost seems productive. Under subjectivism, this reveals whether students emphasize psychological dependence (Scheffler) or institutional continuity (archive view). Under objectivism, it distinguishes between valuing humanity intrinsically versus instrumentally (custodial view). 

  Question 3 should address the user's request about the manner of extinction - whether gradual wind-down affects badness. This tests consistency, particularly for custodial views where ending procedures might matter. 

  Finally, Question 4 about human causation helps isolate debunking views (where self-caused extinction triggers illusion of extra badness) and distinguishes them from other positions. 

  I'll need to map these questions to the requested "leaves": 
  - Plain aggregative view falls under objectivism if they reject extra badness 
  - Scheffler's view is subjectivist with psychological loss 
  - Archive view is subjectivist with institutional loss 
  - Custodial view is objectivist with project continuity 
  - Impersonal view is objectivist with intrinsic value 
  - Debunking view emerges when causation matters 

  The asteroid versus human-caused extinction cases will help test the debunking branch. For the "last generation" case, I predict custodial views will care about procedure, while archive views remain unchanged. The successor species case challenges all views except perhaps impersonal intrinsic value. 

  I should note that some combinations are unexplored but not incoherent - like an objectivist view that cares about manner of ending. The tree might struggle to separate plain aggregative from debunking views since both deny extra badness, but causation question helps distinguish them. 

  The response will walk through these four questions in sequence, showing how each answer narrows the position. I'll keep it under 1000 words using continuous prose, flagging unattractive/unexplored branches where they appear naturally in the flow.
answer: |-
  Begin by asking: **"Does the extra badness of extinction depend on our actual valuing, or would it be bad even if no one cared?"** This splits subjectivists (valuing-dependent) from objectivists (value-independent). Subjectivists hold extinction undermines our present values; objectivists see a loss of inherent value regardless of attitudes.

  Next, ask subjectivists: **"What aspect of the 'afterlife' is crucial for our valuing: psychological comfort (knowing others continue), or the continued existence of institutions/audiences preserving meaning?"** This separates Scheffler's core view (psychological dependence - our activities *feel* pointless without successors) from the archive/audience view (meaning depends on actual future interpreters, even if unknown). The archive view cares about the chain of transmission itself being broken, not just our *feeling* of dependence. An unexplored combo here might be subjectivism focused solely on biological continuity without valuing – arguably incoherent, as subjectivism is about *our* attitudes.

  Ask objectivists: **"Is the inherent value lost located in humanity itself as a unique kind, or in the continuation of specific valuable projects/endeavors?"** This distinguishes the impersonal view (humanity has intrinsic worth, its end is a cosmic loss) from the custodial view (we hold projects in trust; extinction breaches duty to continue them). An impersonal view focused *only* on biological continuity, ignoring projects or meaning, might be unattractive or thin.

  Now, ask everyone: **"Does the manner of ending—gradual, voluntary wind-down vs. sudden, involuntary catastrophe—significantly alter the extra badness?"** This isolates your student's "manner matters" view. Most views (aggregative, Scheffler, impersonal, archive) see only the *fact* of ending as key; the badness is the cessation itself. The custodial view *might* care about manner (a responsible wind-down lessens the breach of trust), and your manner-focused student sees this as primary. A debunking view could also lurk here, suggesting "extra badness" only arises in catastrophic scenarios.

  Finally, ask: **"Does it matter significantly if humanity causes its own extinction versus an external cause?"** This surfaces the debunking view. Most positions see the cause as irrelevant; the loss is the same. The debunking view argues "extra badness" is an illusion tied to guilt or agency in self-caused doom. The custodial view *might* see self-caused extinction as a deeper betrayal of trust. An unexplored combo is objectivism where only self-caused extinction is extra bad – possible but unmotivated.

  **Mapping the Leaves:**
  1.  **Plain Aggregative:** Objectivist (No extra badness beyond lives lost) → "Humanity itself" branch (though they deny its *extra* value) OR "Manner doesn't matter" → "Cause irrelevant". Denies extra badness exists.
  2.  **Scheffler-style:** Subjectivist → Psychological comfort → Manner doesn't matter (usually) → Cause irrelevant (usually). The badness is the undermining of present meaning.
  3.  **Archive/Audience:** Subjectivist → Institutions/Interpreters → Manner doesn't matter (chain is broken regardless) → Cause irrelevant. Loss of the future community sustaining meaning.
  4.  **Custodial:** Objectivist → Continuation of Projects → Manner *might* matter (affects breach) → Cause *might* matter (self-cause worse betrayal). Breach of trust to lineage/projects.
  5.  **Impersonal:** Objectivist → Humanity itself → Manner doesn't matter → Cause irrelevant. Humanity's intrinsic value lost.
  6.  **Debunking:** Emerges most clearly at "Cause matters" → Yes, self-cause creates an *illusion* of extra badness. Or, tied to "Manner matters" (catastrophe triggers the illusion). Denies *genuine* extra badness.

  **Testing Cases:**
  *   **Sudden 30y notice:** Custodial view sees breach (no time to prepare); Archive sees chain broken; Scheffler sees valuing undermined; Impersonal sees loss; Agg/Debunking see no extra badness beyond deaths.
  *   **Last Gen Finishes:** Custodial *might* see less bad (duty partially fulfilled?); Archive still sees chain broken; Scheffler still undermined (no *future* meaning); Others unchanged. Challenges Custodial slightly.
  *   **Voluntary Fade:** Custodial *might* see less bad (responsible wind-down?); Manner-focused student sees *no* extra badness; Archive/Scheffler/Impersonal still see the loss/undermining; Agg/Debunking see no extra badness. Key test for Manner & Custodial views.
  *   **Successor Species:** Archive view *might* be salvaged if they interpret; Custodial view *might* see projects continued; Scheffler/Impersonal often see loss (not *our* humanity/community); Agg/Debunking see replacement, no extra badness. Challenges most views.
  *   **Cause (Asteroid vs. Human):** Debunking view sees extra badness *only* if self-caused (as illusion); Others see loss as identical. Custodial *might* see self-cause as worse betrayal.

  **Notes:**
  *   **Unexplored/Unattractive:** A purely biological subjectivism seems incoherent. An objectivism where *only* self-caused extinction is extra bad is unmotivated. An impersonal view focused solely on biology is unattractively shallow.
  *   **Hard to Separate:** The tree struggles to perfectly isolate the Plain Aggregative view from the Debunking view solely on the "extra badness" questions, as both ultimately deny its existence. The "cause matters" question helps (Debunking cares, Aggregative doesn't), and their *reasons* for denial differ fundamentally (no value vs. illusion). The Custodial and "Manner Matters" views might also overlap if both focus on procedure, but Custodial has a deeper foundation (trust/projects).

  Walk through these five questions in sequence – Nature of Badness (Subj/Obj), Focus of Loss (for each branch), Manner, Cause – to sort your students onto the leaves.
