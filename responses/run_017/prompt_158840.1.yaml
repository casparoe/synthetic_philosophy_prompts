  Hmm, the user is in an upper-level philosophy seminar dealing with social norms and practical reason, specifically Lewis's convention theory and Rawls's practice-conception. They're trying to win an argument with their roommate about tipping customs but ended up constructing a problematic argument that leads to absurd conclusions like endorsing bribes. They need help locating the logical flaw.

  The user's argument progresses logically but leads to counterintuitive results at step (7). The core tension is between the moral neutrality of conventions (step 1) and the moral obligation implied by free-riding (step 3). The user explicitly rejects the easy solution of restricting obligations to "good" conventions, as that would undermine Lewis's point about arbitrariness.

  The key flaw is in step (2)'s claim that deviation always makes others "worse off." This overgeneralizes Lewis's coordination logic. Conventions solve coordination problems only when mutual expectations create collective benefits. But many real-world practices (bribes, aggressive queuing) aren't true coordination equilibria - they harm some groups while benefiting others. Tipping is ambiguous: while servers rely on it, the system arguably exploits them.

  For step (4) to hold, the convention must be a Pareto-improving coordination device where conformity genuinely serves collective interests. This excludes practices like bribes where the "benefit" comes at someone else's expense. Jaywalking conventions might qualify if they improve pedestrian flow without increasing accidents, but not if they create systemic risks.

  Repairing the argument: Tipping could still be obligatory if framed as avoiding harm to underpaid workers (invoking step 3 directly), not because it's conventional. The roommate might counter that the harm stems from the employer's wage structure. The bribery case clearly fails the coordination-benefit test, preserving moral intuition. 

  The solution allows maintaining tipping obligations without endorsing corrupt practices, by distinguishing genuine coordination conventions from exploitative norms. The user gets to keep their core objection to the roommate while avoiding absurd extensions.
answer: |-
  Here's the precise break: **Step (2) overgeneralizes when deviation "makes others worse off."** This claim only holds for conventions that solve genuine *coordination problems* where conformity *itself* provides mutual benefit. Not all social regularities fit this description.

  1.  **Step (1) is correct (Lewis):** Conventions *are* arbitrary solutions to coordination problems (like which side of the road to drive on). Everyone prefers conformity *if* others conform, as deviation leads to coordination failure (traffic jams, accidents).
  2.  **Step (2) is conditionally true:** Deviation *does* frustrate expectations and cause coordination failure *only in genuine coordination problems*. This makes others worse off *relative to the state of successful coordination*. (e.g., Not stopping at a red light where stopping is expected causes accidents).
  3.  **Step (3) is plausible:** Free-riding *is* pro tanto wrong. Taking a benefit while letting others bear the cost of maintaining the practice *is* exploitative.
  4.  **Step (4) is overbroad:** You only "owe" conformity to conventions that are **genuine coordination equilibria** solving a problem where conformity itself provides the mutual benefit. The "cost" of conformity must be the *price of accessing the coordination benefit*.
  5.  **Step (5) collapses:** It relies on the flawed generalization in (2)/(4). Conformity only "does the work" for coordination conventions. Arbitrariness doesn't imply universal obligation.
  6.  **Step (6) misapplies "convention":** Not all these examples are Lewisian conventions solving coordination problems:
      *   **Tipping:** Arguably *is* a coordination convention. Servers/employers coordinate on low wages *expecting* tips; customers coordinate on tipping *expecting* service. Deviation (not tipping while receiving service) *is* free-riding – you get the service benefit while others (tipping customers) sustain the system allowing low wages. The mutual benefit is predictable service/wage structure. Your roommate *is* obligated *if* he participates (eats the meal).
      *   **Jaywalking (Adapted Drivers):** *Can* be a coordination convention if the mutual expectation (pedestrians jaywalk, drivers stay alert) genuinely creates a safer/more efficient flow *for all* than strict crossing adherence would. Deviation (using the crossing where no one expects it) *could* cause accidents, making others worse off. Conforming (jaywalking) *might* be required.
      *   **Shoving/No Queuing:** This is likely **not** a beneficial coordination equilibrium. It's a competitive norm where individuals *impose costs* on others (the weak, the orderly) to gain advantage. There's no mutual benefit from conformity – the "benefit" to the shover comes *at the direct expense* of the shoved. It's a dominance strategy, not coordination. Deviation (queuing) doesn't inherently frustrate beneficial mutual expectations; it might even create a *better* (fairer) equilibrium. You have *no* obligation to shove.
      *   **Bribes:** **Definitely not** a beneficial coordination convention. The "benefit" (faster service) comes *by corrupting a public official*, violating rules/fairness, and harming others (those who don't pay, society's trust). The clerk's expectation of bribes isn't a mutually beneficial coordination point; it's an expectation of corruption. Paying the bribe *actively perpetuates harm and injustice*. You have a *moral duty not to conform*.

  **The Repaired Argument & What it Costs:**

  1.  **Conventions are coordination equilibria (Lewis - survives).**
  2.  **Deviation frustrates expectations/harms coordination *only for genuine coordination conventions* (Revised Step 2).**
  3.  **Free-riding on beneficial coordination practices *is* pro tanto wrong (Survives).**
  4.  **Visitors owe conformity *only* to local practices that are genuine, mutually beneficial coordination conventions, where conformity is the price of the coordination benefit (Revised Step 4).** *Cost:* You lose the simplicity of "always conform." You must evaluate *the nature of the practice*.
  5.  **(5) collapses entirely.** Obligation depends on the convention's *nature*, not just its existence.
  6.  **Fill in:**
      *   **Tipping:** *Likely survives* as a coordination convention generating obligation for participants. Your roommate *is* plausibly obligated to tip here. *Cost:* Requires defending tipping *as* a coordination system (which is debatable, but common).
      *   **Jaywalking (Adapted Drivers):** *Potentially survives* if it demonstrably creates a safer/efficient equilibrium. Obligation *possible*. *Cost:* Requires empirical evidence about safety/efficiency.
      *   **Shoving/Bribes:** *Fail* as beneficial coordination conventions. **No obligation to conform; often an obligation *not* to.** *Cost:* You must accept that "When in Rome" has limits.

  **Conclusion:** Your break was equivocating on "convention" – applying Lewis's definition (steps 1-2) to practices that aren't genuine coordination equilibria (steps 6-7). The repaired argument **still makes tipping obligatory** for your roommate (grounded in avoiding free-riding on a system he benefits from), **might make jaywalking obligatory** depending on context, but **absolves him (and requires refusal) of bribes/shoving**, recognizing those as harmful or exploitative, not mutually beneficial coordination. You keep (3) and your tipping conclusion without endorsing corruption. Your roommate loses the tipping argument but wins on the point that not *all* local customs create obligations.
