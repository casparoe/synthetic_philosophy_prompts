answer: |-
  Below is a written procedure for freelance writers to assess interpretive texts, designed to be completed within **two hours**. It preserves your core concerns about narrative framing, historiography, and implicit bias while simplifying complex theory into actionable steps. The procedure assumes **Carr’s position (facts are selected/ordered by present concerns) and White’s (narrative shapes meaning)** as default lenses but **does not assume Ranke’s objectivity is achievable**.  

  ---

  ### **Procedure: Narrative Framing Audit**  
  **Purpose:** To identify where texts present interpretation as incontrovertible fact, obscure alternative readings, or impose unacknowledged narrative frameworks.  
  **Time Limit:** 120 minutes per text.  
  **Tools Needed:** Highlighters (digital/physical), access to source references.  

  #### **Step 1: Particle Audit (30 mins)**  
  Scan for **"narrative particles"** that imply story arcs without factual basis. Flag:  
  - **Temporal bias**: *still, already, finally, began to, only, at last*.  
  - **Causal/implied judgment**: *therefore, inevitably, naturally, of course, regrettably*.  
  - **Scale/universality**: *everyone, no one, universally, revolution*.  
  **Action:**  
  - Highlight all particles.  
  - For each, ask: *"Does this assert a subjective narrative shape? Could it be replaced neutrally?"*  
    - *e.g., "the pit finally reopened" → "the pit reopened in [date]".*  
  - **If removal alters tone/meaning, rewrite neutrally or tag for review**.  

  #### **Step 2: Reversibility Test (45 mins)**  
  Isolate key interpretive statements (1–3 sentences per panel/script segment). For each:  
  1. **Check sources**: Does the statement directly derive from a specific source? If not, it is **frame-dependent**.  
  2. **Test reversal**: *"Could an equally source-compatible sentence with opposite valence be written?"*  
     - *e.g., "His model village improved workers’ lives" vs. "His model village controlled workers’ lives".*  
  3. **Result:**  
     - **Irreversible**: Factual, source-anchored statements (*e.g., "The village had piped water by 1890"*). Keep.  
     - **Reversible**: Frame-dependent or narrative-collateral. Flag for rewrite or disclaimer (e.g., "Some historians argue...").  
     - **Uncertain**: Escalate to Community Liaison (see Step 4).  

  #### **Step 3: Framing Tagging (Revised) (30 mins)**  
  Replace your three tags with two simplified categories:  
  - **🔵 Source-Anchored**: Verifiable, context-neutral facts (*retained but narrowly defined*).  
  - **🟡 Frame-Dependent**: Statements requiring implicit narrative framing (*encompasses "narrative-collateral" – discarded as overlapping*).  
  **Action:**  
  - Tag each sentence.  
  - For **🟡 items**: Add a brief note justifying the frame (*e.g., "Emphasises paternalism; downplays worker agency"*).  

  #### **Step 4: Values vs. Evidence Boundary (15 mins)**  
  Escalate to Community Liaison if:  
  - The framing hinges on **unverifiable cultural/ethical values** (*e.g., "improvement", "progress", "backward"*).  
  - Reversibility test reveals **equally valid but conflicting community perspectives**.  
  - **Rule for "No"**: Stop and reject the text if it:  
    - Uses narrative particles irreplaceably in key claims.  
    - Fails reversibility test *and* cannot be neutrally rewritten without losing meaning.  

  #### **Step 5: Final Review**  
  Ensure:  
  - Welsh translation will not amplify framing (e.g., particles like "finally" may carry stronger connotations).  
  - Word count permits disclaimers where needed (*e.g., "While some benefited..."*).  

  --- 

  ### **Theoretical Adjustments**  
  - **Kept**:  
    - **Reversibility test** (core to Carr/White).  
    - **Particle audit** (concrete tool for White’s "emplotment").  
    - **Source-anchored/frame-dependent distinction** (simplified to two tiers).  
  - **Discarded**:  
    - **Narrative-collateral tag** (merged into frame-dependent).  
    - **Ranke’s objectivity** (procedure assumes all interpretation is framed).  
  - **Assumed**:  
    - **Carr/White are broadly correct**; the goal is exposing framing, not achieving neutrality.  

  --- 

  ### **Test Cases**  
  #### **1. Donor-Funded Panel: Victorian Manufacturer**  
  - **Particle audit**: "His *visionary* model village *transformed* workers’ lives" → *"visionary" (judgment), "transformed" (narrative arc)*.  
  - **Reversibility test**:  
    - Reversible: "*Prioritised control over welfare*" equally fits sources (company archives show rent deductions, curfews).  
  - **Verdict**: **🟡 Frame-dependent**. Escalate to liaison: donor narrative vs. critical labor history. **Rewrite required** unless liaison approves donor framing as a "value".  

  #### **2. Audio Guide: "The pit finally reopened after the strike"**  
  - **Particle audit**: "**finally**" implies the strike was an illegitimate delay (managerial perspective).  
  - **Reversibility test**: Irreversible fact: *"The pit reopened in May 1927"*. Reversible framing: "*finally*" (vs. miner perspective: "*reopened after union defeat*").  
  - **Verdict**: **🟡 Frame-dependent + particle misuse**. **Rewrite neutrally**: "The pit reopened in May 1927, ending the 9-month strike."  

  #### **3. School Timeline: "The Age of Improvement, 1780–1840"**  
  - **Particle audit**: "**Age of Improvement**" is White-style emplotment (comedy/romance). Ignores famine, child labor, dispossession.  
  - **Reversibility test**:  
    - Reversible: "*Age of Upheaval*" or "*Age of Exploitation*" equally valid.  
  - **Values boundary**: **Escalate to liaison**. Header imposes progress narrative; alternatives reflect ethical/political values.  
  - **Verdict**: **Reject header**. Replace with neutral period label (*e.g., "Industry and Society, 1780–1840"*).  

  ---  

  ### **What the Procedure Cannot Do**  
  1. **Resolve historiographical debates** – It exposes framing but cannot adjudicate between Carr/White/Ranke.  
  2. **Ensure "fair" representation** – Only the liaison can balance community values.  
  3. **Detect unconscious cultural bias** (e.g., colonial assumptions in sourcing).  
  4. **Fix structural omissions** – A 90-word limit may inherently silence marginal perspectives.  
  5. **Replace specialist review** – Deep historiography (e.g., Marxist vs. Whig interpretations) still needs your oversight.  

  ---  
  **Final Note**: This procedure makes framing visible and actionable within your constraints. It forces writers to confront the *how* of history-telling, not just the *what*. The Victorian manufacturer case will likely return a "rewrite or escalate" verdict – a necessary discomfort.  

  *Example British English phrasing: "Prioritised control over welfare"; "ending the 9-month strike"; "Industry and Society".*
