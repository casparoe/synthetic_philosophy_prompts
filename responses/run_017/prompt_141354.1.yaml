  The user has four specific questions. Let me tackle them one by one.

  1. **Symmetry between greedy reductionism and greedy emergentism**: They might seem symmetric, but there's an asymmetry. Reductionism starts from the bottom and claims everything can be reduced. Emergentism starts from the top and adds irreducible layers. Greedy reductionism dismisses higher-level patterns, while greedy emergentism refuses any lower-level explanation. The asymmetry comes from the direction and the burden of proof. Reductionism has to show how higher levels emerge, while emergentism has to justify why something is irreducible. So, they aren't exact mirrors. The user needs to present this in the argument without taking sides.

