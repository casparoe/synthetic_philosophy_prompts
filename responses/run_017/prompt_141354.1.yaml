  4. **Dennett's real patterns and greedy emergentism**: Real patterns are reliable, observable, predictive regularities. Greedy emergentism posits patterns that can't be explained by underlying mechanisms, which Dennett rejects. Real patterns must be grounded in lower-level processes, even if they're complex. If a pattern is real but claimed irreducible without evidence, it's greedy. The line is whether the pattern's reality depends on its microfoundations or is asserted as brute. The user can have A argue that irreducible emergents aren't real patterns, while C insists some patterns are irreducibly complex.

