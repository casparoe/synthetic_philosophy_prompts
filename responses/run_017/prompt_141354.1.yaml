answer: |-
  Below is a sharp, substantive breakdown of the greedy reductionism vs. greedy emergentism (your term) debate, tailored for your fictional argument. I'll answer your four questions directly, flag where I'm least confident, and suggest how to weave this into dialogue. Crucially, **both charges can be valid errors**, and they *are* meaningfully opposed—but not perfectly symmetric. I'll also note where your framing works and where it might need tweaking.

  ---

  ### **1. Symmetry/Asymmetry: Greedy Reductionism vs. Greedy Emergentism**
  - **They are not symmetric; emergentism is the "safer" error.**  
    Greedy reductionism (GR) claims: *"Your high-level phenomenon (e.g., meaning, choice) is nothing but low-level mechanism X. Once I describe X, there's nothing left to explain."* It **erases** the target by over-claiming completeness.  
    Greedy emergentism (GE) claims: *"No low-level mechanism can ever explain high-level phenomenon Y. Y is fundamentally *sui generis*—irreducibly brute."* It **insulates** the target from explanation.  

    **Asymmetry:** GR is an error of *premature dismissal* (ignoring genuine higher-level patterns). GE is an error of *premature surrender* (declaring a mystery too soon). GR is falsifiable: if the high-level pattern has predictive power GR can't capture, GR fails. GE is harder to falsify—it can always retreat to "you haven't found the mechanism *yet*." This makes GE rhetorically stronger but intellectually lazier.  

    **Why it matters for your scene:**  
    - Character A (lab scientist) sees GR as a straw man—*good* reductionism doesn't "explain away," it *grounds* (e.g., explaining vision via neurons doesn't negate "sight," it shows how it works).  
    - Character C (niece) sees GE as protecting genuine complexity (e.g., "consciousness can't just be neurons!").  
    - **Conflict point:** A thinks GE is an argument from ignorance; C thinks GR is intellectual vandalism.  

    **My confidence:** High (this asymmetry is well-established in philosophy of science).  

  ---

  ### **2. The Crane/Skyhook Test: Sharp Criterion**  
  The core test isn't about "work done" but **explanatory traction and vulnerability to evidence**:  
  > **A crane is a high-level explanation that:**  
  > - (a) Gains predictive power by abstracting from lower levels (e.g., "natural selection explains adaptation better than tracking individual mutations").  
  > - (b) Is *vulnerable* to disproof by lower-level details (e.g., if genetics couldn't support inheritance, natural selection would collapse).  
  >   
  > **A skyhook is a high-level explanation that:**  
  > - (a) Claims autonomy *from* lower levels (e.g., "free will is uncaused by brain states").  
  > - (b) Is *immune* to disproof by lower-level details (e.g., "even if brains are deterministic, free will exists *sui generis*").  

  **C's comeback ("free lunch") is half-right but misleading:**  
  - **Legitimate cranes *do* look like "free lunches"** initially (e.g., thermodynamics works without tracking every atom). But they earn their keep by *predicting novel phenomena* (e.g., heat engines) and *linking downward* (e.g., statistical mechanics validates thermodynamics).  
  - **Sophistry creeps in** when the "free lunch" never pays rent—e.g., positing an immaterial soul to explain consciousness, which predicts nothing new and ignores neuroscience.  

  **For your characters:**  
  - A should demand: *"Show me one thing your 'irreducible self' predicts that brain states don't, or admit it's decorative."*  
  - C should counter: *"Your 'decision-making neurons' can't explain why I regret my choices. That pattern exists *at my level*."*  
  - **Test case:** If C posits "meaning" as irreducible, A asks: *"If I alter the neural mechanism, does the meaning change? If yes, it's a crane. If no, it's a skyhook."*  

  **My confidence:** Moderate. This is philosophically solid, but the "vulnerability" criterion can get fuzzy in practice. *Least confident here*—philosophers legitimately debate borderline cases (e.g., whether mathematical truths are skyhooks).  

  ---

  ### **3. Is the Crane Metaphor Broken by Literal Cranes?**  
  **B's objection is a clever pun, not a fatal flaw.**  
  - Yes, literal cranes are designed artifacts. But Dennett's metaphor hinges on **cumulative, *unintended* structure**—natural selection is a crane because it's built from simpler, unguided parts (mutation, inheritance). The "foundation" is physics; the "counterweight" is the ecosystem.  
  - **B's critique confuses "design" with "engineering-like process."** Evolution *is* a blind engineer—no designer needed. The metaphor holds because cranes *exemplify* stable, scalable lifting.  
  - **Danger zone:** If B insists natural selection itself needs a crane (e.g., "What lifts evolution?"), he's demanding a skyhook. A should snap: *"Gravity doesn't need a crane. Foundations aren't lifted—they're bedrock."*  

  **For your scene:**  
  - Play B's objection as a gotcha moment—he slams his hand on the table: *"You can't bolt reality together like a gantry! Who welded the struts?"*  
  - A retorts: *"No welder. Your crane *is* the seafloor—self-assembled by tectonic drift."*  

  **My confidence:** High. This is a standard objection, and Dennett's defenders swat it down routinely.  

  ---

  ### **4. Dennett's Real Patterns vs. Greedy Emergentism**  
  **Real patterns slaughter greedy emergentism—if you're consistent.**  
  Dennett’s "real patterns" are **projectible regularities**: they predict outcomes reliably (e.g., "money" is real—it predicts behavior; "aura colors" are not). Crucially:  
  - A real pattern *must* be **implemented** by lower-level mechanisms (even if we don't know them).  
  - GE posits patterns *detached* from implementation (e.g., "qualia are raw feels, untethered to biology").  
  - **The line:** If you can *imagine* a lower-level story that *would* break the pattern, it's a crane (e.g., if changing neuron X alters choice, "decision" is crane-work). If no conceivable lower-level change could affect it, it's GE (and likely unreal).  

  **But here's the rub:** GE *masquerades* as defending real patterns. C might say: *"My regret is real! Ergo, it can't *just* be neurons."* A fires back: *"Real *to whom*? If neurons didn't echo it, you wouldn't feel it. The pattern is real *because of* the mechanism."*  

  **For your scene:**  
  - C: *"You reduce my love for my niece to oxytocin? That *erases* what it *is*!"*  
  - A: *"No—it shows how it *works*. If I block oxytocin, does your love fade? If yes, it's real *and* grounded. If not, it's a ghost."*  

  **My confidence:** High on the framework; moderate on edge cases (e.g., abstract mathematics).  

  ---

  ### **Overall Notes for Your Chapter**  
  - **Your terms are spot-on:** "Greedy reductionism" is Dennett's own phrase. "Greedy emergentism" isn't standard but *should be*—it crisply captures the error. Both charges are coherent and defensible.  
  - **Don't let anyone "win":** This debate is live in philosophy (e.g., Chalmers vs. Dennett on consciousness). The scene should climax in stalemate—or better, mutual frustration.  
  - **Voice suggestions:**  
    - **A (scientist):** Uses concrete examples (e.g., "Explain *this* fMRI scan with your irreducible self!"). Impatient with "word games."  
    - **B (crane operator):** Grumpy, literal-minded. Drags everything back to physicality ("Show me where the self *is*, or pipe down!").  
    - **C (niece):** Eloquent, protective of human experience. Asks: *"If your explanation makes my grief a chemical glitch, why would I *care* about truth?"*  
  - **Ending beat:** They realize they're *both* accusing each other of magic—A thinks C invents skyhooks; C thinks A dissolves the world into fairy dust. The food gets cold.  

  This argument *works* because it's not about vocabulary—it's about what counts as explanation, what we value in humanity, and whether some things are sacred. Run with it.
