prompt: |-
  I spent my career in experimental geophysics and have, since retiring, been sitting in on a graduate seminar in philosophy. This term the topic is the norm of assertion, and I have a question about a pattern I keep noticing that none of the views we have read seems to capture.

  Three instances from my old department. First, a postdoc who had read only the abstract of a paper announced its central finding at a group meeting; a senior colleague said afterwards that she was not in a position to say that. The finding was true, the paper was sound, and she believed it. Second, a technician who had run an assay correctly reported its result and was criticised for asserting it, because he could not explain what the assay measured; the result was true and his evidence for it was excellent. Third, a colleague repeated a well-established result from a neighbouring field and was criticised until he named his source, at which point the criticism stopped, although nothing about his evidence had changed.

  What interests me is that the criticism survives every standard fix. The proposition is true; the speaker believes it; the speaker's evidence looks good enough for knowledge, at least where the source is a reliable one; the audience is not misled; nothing of practical importance hangs on it. The complaint is not that anything went wrong but that the speaker cannot answer for what was said — cannot defend it, cannot say what would count against it, cannot draw out its consequences — and so is not the sort of person who may say it here.

  Does this have a name? I am not after a label as such. I want to know whether it is a genuine norm of assertion, distinct from the knowledge, truth and belief norms we have been discussing, or whether it is better understood as something else: a norm of inquiry, a matter of intellectual character, or a fact about who counts as an authority for whom. I would also like its edges. Why does naming a source discharge it? Does it admit of degrees? Why does it seem to vary with the audience — a room of specialists does not seem to demand it in the way a journalist or a student does? And what should one say about a case in which the speaker is a device that emits true sentences it cannot defend at all?
reasoning: |-
  Okay, this is a fascinating question from someone with a solid scientific background diving into philosophy. The user describes three very specific scenarios from their geophysics department where assertion norms seem violated despite truth, belief, and evidence being present. What's striking is how consistent the complaint is across cases: it's about the speaker's inability to "answer for" the claim. 

  Hmm... the user's frustration with standard norms (knowledge, truth, belief) is palpable - they've clearly done the reading but found them inadequate. Their observation about "naming sources" discharging the criticism is particularly sharp. I should acknowledge their scientific precision first - these aren't hypotheticals but field observations, which matters for philosophical analysis.

  The core issue seems to be about epistemic authority rather than truth conditions. When the postdoc cites just an abstract, or the technician can't explain the assay's mechanism, they're missing what philosophers call "second-order justification" - the ability to back up why they're justified. That's different from actually having justification. 

  For the device example... interesting edge case! A weather station "asserting" temperature without understanding doesn't violate this norm because norms apply to agents. But if an AI system makes claims beyond its training data, that might parallel the postdoc scenario. 

  The audience dependence makes perfect sense - specialists can "fill in" justification gaps themselves, while students/journalists need the asserter to provide scaffolding. Naming sources works because it transfers justificatory responsibility ("Go read X if you want defense"). 

  I should emphasize this isn't just pragmatics - it's about what we expect from fellow knowers. The criticism implies "You're not playing your epistemic role properly." Maybe connect to Sosa's AAA model (accuracy, adroitness, aptness) - these speakers lack the adroitness component. 

  For framing, "epistemic responsibility norm" seems closest, though "accountability" captures the "answer for" phrasing better. Crucially, it's gradient (unlike binary knowledge norm) and context-sensitive. The user's "who counts as authority" instinct is spot-on - that's exactly what's being negotiated in these interactions.

  Better flag that this isn't mutually exclusive with knowledge norms - one can know something but still assert improperly if context demands higher justification. That explains why naming sources helps: it signals access to knowledge-level justification even if not personally possessed. 

  ...should mention that in highly collaborative fields like geophysics, this norm likely strengthens because assertions trigger collective epistemic work. The senior colleague wasn't just policing - they were maintaining the department's knowledge ecosystem.
answer: |-
  Your observation cuts to the heart of a nuanced epistemic norm that operates alongside—and sometimes supersedes—the standard truth, belief, evidence, and knowledge norms. What you describe is most aptly termed the **accountability norm of assertion** (or sometimes the **justificatory responsibility norm**). This norm demands that an asserter not only *has* justification for their claim but can *demonstrate* or *answer for* that justification appropriately within a given context. Let's break this down:

  ### Core Features & Philosophical Grounding
  1. **Accountability as Distinct from Knowledge/Truth**:  
     - Knowledge norms (e.g., Williamson's "assert only what you know") focus on the speaker's epistemic state. Truth norms focus on content. Your cases show that **even when these are satisfied**, assertion can be improper if the speaker lacks *defensive epistemic agency*.  
     - Criticisms like "not in a position to say that" target the speaker's inability to *occupy the role of a justifier*—to articulate reasons, address challenges, or contextualize the claim. This is about **epistemic authority**, not just correctness.

  2. **Key Components of Accountability**:  
     - **Responsiveness**: Ability to respond to "How do you know?" or "What if X challenges this?"  
     - **Discursive Ownership**: Treating the assertion as a claim *for which one takes responsibility*, not mere parroting.  
     - **Source Integration**: Understanding how the claim fits into broader evidence/networks (e.g., the assay technician's mechanistic gap).

  ### Why Your Cases Illustrate Accountability
  - **The Postdoc**: Abstract-only reading → Lacks depth to defend methodological critiques or implications.  
  - **The Technician**: Procedural competence ≠ understanding *why* the assay works → Cannot troubleshoot anomalies or interpret unexpected results.  
  - **The Colleague**: Source-naming transfers accountability to the original author ("Smith showed Y" defers justificatory labor).  

  ### Edges & Nuances
  - **Why Naming a Source Discharges It**:  
    Citing a source (e.g., "According to Smith et al.") shifts accountability to an acknowledged authority. It signals: *"I am not the justifier; here is where justification resides."* This is socially efficient in expert contexts where source reliability is recognized.  

  - **Admittance of Degrees**:  
    Accountability is scalar. In your cases:  
    - Low accountability: Postdoc (abstract-only) → High criticism.  
    - Medium: Technician (procedural evidence) → Moderate criticism.  
    - High: Colleague (source-named) → Criticism resolved.  
    Depth of understanding, field expertise, and audience expectations modulate the threshold.  

  - **Audience Dependence**:  
    - **Specialists**: Assume shared background knowledge; may not demand immediate justification for common claims. Accountability focuses on *novel* assertions.  
    - **Journalists/Students**: Lack field-specific knowledge; require speakers to *actively scaffold justification*. Here, the asserter must supply context the audience can't infer.  
    - **Power Dynamics**: Seniors may enforce accountability norms on juniors to cultivate rigor (e.g., the postdoc critique).  

  - **Devices/AI "Asserting"**:  
    A device emitting true sentences (e.g., a sensor output) isn't subject to accountability norms—it lacks *agency*. We judge the *system designers* or *interpreters* (e.g., "Can *you* explain the algorithm?"). If humans use device outputs to assert claims, *they* assume accountability (e.g., "The sensor says X" vs. "X is true").  

  ### Philosophical Frameworks
  This aligns with several ideas:  
  1. **Sosa's AAA Virtue Epistemology**: Accountability ensures assertions are not just accurate (truth) but *adroit* (skillfully backed).  
  2. **Brandom's Inferentialism**: Assertions inherit commitments; being "in a position" means owning those commitments in social discourse.  
  3. **Fricker's Epistemic Justice**: Criticisms like "not in a position" police who counts as a knower—potentially excluding "mere technicians" or juniors.  

  ### Is It a Genuine Norm of Assertion?  
  Yes—but **contextually activated**. It dominates in:  
  - **Expert communities** (e.g., academia), where distributed epistemic labor requires source-tracking.  
  - **High-stakes pedagogy/communication**, where audience needs exceed bare truth.  
  - **Interdisciplinary spaces**, where justifying methods across fields demands deeper articulation.  

  ### Practical Implications for Science  
  - **Credibility Economy**: Technicians/postdocs may be "allowed" to assert instrument readings but not interpretations—a social division of epistemic labor.  
  - **Ethics of Citation**: Naming sources isn't pedantry; it redistributes justificatory responsibility.  
  - **AI/Human Collaboration**: Humans asserting AI outputs must understand enough to discharge accountability (e.g., "The model said X, and I verified it by Y").  

  **In short**: You've identified a **social-epistemic norm of justificatory accountability**—a requirement that asserters be *able to stand behind their claims* as responsive agents. It complements truth/knowledge norms by addressing the *pragmatics of trust* in collaborative knowledge systems. Philosophers like Lackey (on "proper functional assertion") and Kukla (on "scorekeeping in discourse") offer direct engagement with this idea. It’s not merely etiquette; it’s how communities maintain epistemic rigor.
