prompt: |-
  For roughly fifteen years I have read LessWrong, Overcoming Bias, and Slate Star Codex / Astral Codex Ten, and my working epistemology is Bayesian by default: beliefs as distributions, updating on likelihood ratios, calibration and proper scoring rules, forecasting tournaments, prediction markets, base rates, the optimizer's curse, and the standing injunction to steelman before engaging. I think in this vocabulary more fluently than in any other, and I have noticed an unfortunate consequence: when I read the methodology literature around the replication crisis, I come away thinking the frequentists must simply be confused, because nothing they seem to be protecting looks like a thing my framework has room for. I would like to fix that, and I am writing the result up for a small reading group of people with the same background.

  So: please restate, in my vocabulary and as faithfully as you can, the strongest version of the frequentist complaint that motivates the replication-crisis literature. The target material is the cluster of worries about researcher degrees of freedom, undisclosed analytic choices, optional stopping and peeking, multiple comparisons, and the associated demands for pre-registration and for procedures with known long-run error rates. Give me the steelman, not the strawman: I already know how to say that frequentists irrationally care about data they did not get, and that version is not interesting to me. I want the best move available from their side, expressed as priors, likelihoods, posteriors, calibration, scoring rules, and, where it matters, multi-agent or adversarial settings.

  I have been playing with a way of cashing part of this out myself, and I want to know whether it is a real translation or a case of me smuggling my own assumptions in and calling them translation. The idea: treat the evidence a paper reports as not simply the likelihood ratio it claims, but as that ratio discounted by a flexibility tax, a factor below one reflecting how many defensible analyses the researcher could have run and how much the field's norms allowed them to choose after seeing the data. On this reading, a pre-analysis plan is a commitment device whose value is that it shrinks the tax, and a p-value is a crude public proxy for how large the tax should be.

  Then the residue report, which is the part I actually care about. First, is the flexibility tax fully expressible in Bayesian terms, or does estimating it require a base rate over a reference class of studies, so that long-run frequency sneaks back in through the back door as a way of estimating a hyperparameter? Second, where exactly does the translation distort things: is the thing being protected a property of a data-generating process, or of a scientific community's incentive structure and publication filter, and can my single-agent vocabulary represent the difference? Third, and most important: is there anything left over that has no counterpart in my vocabulary at all? In particular, I want to know whether the frequentist's insistence on error-rate guarantees is best understood as a claim about the calibration of a reporting institution under adversarial selection rather than as a claim about any individual's belief state, and whether, if so, my framework can register that claim as a genuine desideratum or can only model it by ceasing to be about inference.

  Do not lean on remembered empirical results or specific papers; argue from the structure of the two positions. If you want a concrete illustration, use the much-discussed social-psychology replication failures of the 2010s at the level of what is common knowledge, and avoid anything that would require looking a number up. I cannot search, and I am not asking for citations or reading lists.
reasoning: |-
  We are given a Bayesian practitioner who is deeply familiar with the Bayesian framework and wants to understand the frequentist concerns in the replication crisis literature. The user has proposed an idea of a "flexibility tax" to discount the reported likelihood ratio, reflecting researcher degrees of freedom. We are to steelman the frequentist position in Bayesian terms and then address three specific questions.

  ## Steelman of the Frequentist Complaint

  The core of the replication crisis is that many published findings do not replicate. The frequentist methods (especially null hypothesis significance testing, NHST) are often misused or misunderstood, leading to inflated false positive rates. The frequentist complaint is that without strict procedural controls (like pre-registration and alpha control for multiple comparisons), the reported p-values and confidence intervals are invalid because they do not account for the data-dependent choices made during the analysis.

  In Bayesian terms, we can interpret the frequentist's concern as follows:

  ### 1. **The Problem of Multiple Comparisons and Researcher Degrees of Freedom as a Selection Effect**
     - In a Bayesian setting, when a researcher has many possible hypotheses to test or many ways to analyze the data (e.g., different covariates, exclusion criteria, outcome measures), they are effectively running multiple analyses and then selecting the one that yields the most "statistically significant" result (or the largest effect size). This selection process introduces a bias because the reported result is conditional on being selected.

     - **Bayesian translation**: The prior probability of observing a result at least as extreme as the one reported (in the sense of being "publishable") is inflated due to the multiple opportunities to get such a result. This is similar to the multiple comparisons problem in frequentist statistics, which adjusts the p-value to account for the number of tests. In Bayesian terms, we might model the entire process as a mixture over the possible analyses that could have been done.

     - Let the entire set of possible analyses (given the researcher's degrees of freedom) be indexed by \( a \in A \). Each analysis \( a \) produces a likelihood ratio \( \lambda_a \) for the hypothesis of interest versus the null. However, the researcher only reports one analysis, \( a^* \), chosen to maximize some criterion (e.g., \( \lambda_a \) or a related statistic). The reported likelihood ratio is then \( \lambda_{a^*} \), which is a biased estimate of the evidence because it is the maximum over a set.

     - To account for this, we must adjust the likelihood ratio by the probability of observing such a large \( \lambda \) under the null, given the selection process. This is similar to the flexibility tax idea.

  ### 2. **Optional Stopping and Peeking**
     - Frequentists worry that if a researcher collects data until the results become significant (optional stopping), the nominal p-value becomes invalid. In contrast, Bayesian updating is not affected by the stopping rule (by the likelihood principle). However, the frequentist concern is that if the stopping rule is not fixed, then the long-run false positive rate (over many hypothetical experiments) is not controlled.

     - **Bayesian translation**: The stopping rule does not affect the posterior for a given prior and model. However, the frequentist concern is about the behavior of the procedure in repeated use. In a Bayesian setting, we can note that if the stopping rule is data-dependent and not accounted for in the model, then the likelihood function might be misspecified. But the deeper issue is that the selection of the stopping time is another form of researcher degree of freedom.

     - We can think of the stopping time as another parameter in the set of possible analyses. The flexibility tax would then also incorporate the probability of having stopped at a time that gives a large likelihood ratio.

  ### 3. **The Flexibility Tax as a Bayesian Adjustment**
     - The flexibility tax can be formalized by considering the distribution of the reported evidence (e.g., the likelihood ratio) under a null model that accounts for the researcher's behavior. Specifically, we can define:
          \[ \text{Reported evidence} = \lambda_{a^*} \]
          but the adjusted evidence for the hypothesis \( H \) versus the null \( H_0 \) should be:
          \[ \lambda_{\text{adjusted}} = \frac{ \Pr(\text{data} | H, a^*) }{ \Pr(\text{data} | H_0, a^*) } \times \frac{ \Pr(a^* | H) }{ \Pr(a^* | H_0) } \]
          However, note that the choice of \( a^* \) is typically data-dependent, so we must model the entire process.

     - A more direct way is to model the selection process explicitly. Let \( S \) be the event that the result is selected for reporting (which depends on the data and the set of possible analyses). Then the actual evidence we observe is conditioned on \( S \). The likelihood ratio for \( H \) versus \( H_0 \) given the reported result and \( S \) is:
          \[ \lambda_{\text{observed}} = \frac{ \Pr(\text{reported data}, S | H) }{ \Pr(\text{reported data}, S | H_0) } \]
          We can decompose this as:
          \[ \lambda_{\text{observed}} = \lambda_{\text{naive}} \times \frac{ \Pr(S | \text{reported data}, H) }{ \Pr(S | \text{reported data}, H_0) } \]
          where \( \lambda_{\text{naive}} = \frac{ \Pr(\text{reported data} | H) }{ \Pr(\text{reported data} | H_0) } \) (without conditioning on \( S \)).

     - The adjustment factor \( \frac{ \Pr(S | \text{reported data}, H) }{ \Pr(S | \text{reported data}, H_0) } \) is the flexibility tax. Under the null, the probability of selecting the result (i.e., it being "significant") might be high due to the multiple opportunities, while under the alternative it might be lower (if the alternative is true, then one might get a significant result without having to try as many analyses). However, note that under the alternative, the researcher might also stop early or choose the analysis that maximizes the effect, so the adjustment is complex.

     - Alternatively, we can think of the entire set of analyses as a single model with a prior over the analysis choices. The prior should account for the fact that the researcher is selecting the analysis to report. This leads to a hierarchical model.

  ### 4. **Pre-registration as a Commitment Device**
     - Pre-registration fixes the analysis plan. In Bayesian terms, it restricts the set \( A \) to a single analysis (or a small, predefined set). This reduces the flexibility tax because the selection event \( S \) is now defined by a single analysis (so \( \Pr(S | \cdot) \) is either 0 or 1 and does not depend on the data). Thus, the adjustment factor becomes 1.

  ### 5. **Long-Run Error Rates as Calibration of the Scientific Community**
     - The frequentist desire for controlled long-run error rates (e.g., false positive rate at most 5%) is a property of the entire system of scientific publication. In a Bayesian setting, we can interpret this as a concern about the calibration of the community's published findings.

     - Specifically, if we consider the entire body of published research, we would like the proportion of true findings to be high. This is a form of calibration: the reported confidence (or the rate at which findings are deemed significant) should match the actual rate of true effects.

     - However, without controls (like pre-registration and multiple testing corrections), the selection process (publication bias, p-hacking) leads to miscalibration. For example, the published literature might contain a high proportion of false positives.

     - In a multi-agent setting, the problem is adversarial: researchers might be incentivized to produce significant results by any means. The frequentist procedures (with pre-registration) aim to ensure that even in such an environment, the long-run false positive rate is controlled. In Bayesian terms, we can think of the frequentist as wanting the community's reporting mechanism to be such that if a result is reported at a certain p-value (say, p<0.05), then the probability that the null is true (across all such reported results) is not too high. This is the positive predictive value (PPV) of the test.

     - The PPV depends on the prior probability of the alternative hypothesis (the base rate) and the false positive rate. The frequentist controls the false positive rate (at 5%) but cannot control the prior. However, if the prior is low (as in many exploratory fields) then even with a 5% false positive rate, the PPV might be low. The replication crisis occurs when the prior is low and the false positive rate is inflated by p-hacking.

     - The frequentist solution is to control the false positive rate (by procedures) and to encourage pre-registration to prevent inflation of the false positive rate. Then the PPV is at least as high as what the base rate and the controlled false positive rate imply.

  ## Answers to the Residue Report

  ### 1. **Is the flexibility tax fully expressible in Bayesian terms, or does it require a base rate over a reference class?**
     - The flexibility tax, as an adjustment factor, is defined in terms of the selection process (the event \( S \)) and the models under \( H \) and \( H_0 \). To compute this, we need to know the distribution of the data under \( H \) and \( H_0 \) and the selection rule. In practice, we might not know the exact set of possible analyses and the selection rule. 

     - Moreover, the selection rule might be complex and depend on the researcher's incentives. Therefore, we often need to estimate the adjustment by considering a reference class of studies. For example, we might use the base rate of false positives in a field (or in a set of similar studies) to estimate how much the flexibility tax should be. This brings in long-run frequencies as a way to estimate the hyperparameters of the selection process.

     - So while the concept is Bayesian, its practical application often requires frequentist-style base rates.

  ### 2. **Where does the translation distort things?**
     - The translation from frequentist concerns to the Bayesian framework captures the core issue of selection bias. However, the frequentist framework is inherently about procedures and their long-run properties, which are properties of the data-generating process and the scientific community's practices. The Bayesian framework, as an individual inference engine, does not naturally account for the multi-agent, adversarial setting.

     - In particular, the frequentist's insistence on pre-specified procedures and error-rate guarantees is motivated by the need to have reliable knowledge in a community where researchers might be biased or even malicious. The Bayesian framework, when applied by an individual, assumes that the model (including the selection process) is correctly specified. But in an adversarial setting, the model might be misspecified because the researcher is hiding the true extent of the degrees of freedom.

     - Therefore, the translation might distort the fact that the frequentist properties (like controlling the false positive rate) are designed to be robust to the researcher's intentions and to work even when the model of the selection process is unknown or misspecified.

  ### 3. **Is there anything left over?**
     - The key leftover is the **adversarial setting and the need for robustness**. The frequentist procedures (like using a p-value with a pre-specified alpha) are designed to work even if the researcher is trying to game the system. In contrast, the Bayesian adjustment (flexibility tax) requires a model of the selection process. If that model is wrong (e.g., we underestimate the number of analyses that were run), then the adjustment will be insufficient.

     - The frequentist error-rate guarantees are indeed about the calibration of a reporting institution under adversarial selection. This is a property of the system that is not captured by any single Bayesian update. The Bayesian framework can model it by considering the prior over the entire system (including the behavior of researchers) and updating on the fact that a result was published. But this requires a prior over the base rate of true effects and the extent of p-hacking in the field, which might be difficult to specify and update on.

     - Moreover, the frequentist might argue that in the absence of a well-justified prior, the long-run error rate is a desirable property because it provides a guarantee that does not depend on subjective priors. The Bayesian framework can represent the claim about the reporting institution by modeling the institution as a data-generating process and then using Bayesian methods to infer the reliability of published results. However, this would require a prior and data about the institution, which brings us back to the need for base rates.

     - Ultimately, the frequentist's error-rate guarantee is a procedural guarantee that is independent of the prior. This is not directly representable in the Bayesian framework because Bayesian inference always depends on the prior. However, the Bayesian can recognize the importance of robustness and design procedures that are less sensitive to the prior or that incorporate empirical data about the institution (e.g., replication studies).

  ## Conclusion

  The flexibility tax is a valid Bayesian translation of the frequentist concerns, but it requires modeling the selection process and may rely on base rates from a reference class. The frequentist's emphasis on error-rate guarantees is best understood as a requirement for robustness in an adversarial, multi-agent setting. While the Bayesian framework can represent this by including the entire scientific community in the model, it must then use empirical data (long-run frequencies) to estimate the necessary parameters. Thus, the replication crisis literature's concerns can be articulated in Bayesian terms, but doing so highlights the need for empirical data about the research process and the scientific community, which is where frequentist methods (with their emphasis on long-run behavior) naturally come into play.
answer: |-
  ### Steelman of the Frequentist Complaint in Bayesian Vocabulary  
  The core frequentist concern is **not about individual inference** but about **adversarial multi-agent dynamics in scientific communication**. When you read a published claim, you are not observing raw evidence but the output of a *selection process* shaped by incentives (e.g., publication bias, career pressures). This process creates a **systematic distortion** that cannot be fully captured by a naive likelihood ratio. Here's the steelman:

  #### 1. **The Selection Process as a Likelihood Distortion**  
  Your "flexibility tax" is directionally correct but underspecified. The key is to model the **researcher's decision rule** as part of the data-generating process. Define:  
  - **H₁**: Hypothesis of interest (e.g., "effect exists").  
  - **H₀**: Null hypothesis.  
  - **D**: Observed data.  
  - **A**: Set of all possible analysis paths (e.g., choices of covariates, exclusion criteria, outcome measures).  
  - **S(·)**: Selection function where S(D, A) = 1 if the result is published, 0 otherwise.  

  The reported likelihood ratio **λ_report** = P(D | H₁, a*) / P(D | H₀, a*) for a chosen analysis path *a* ∈ A is a **post-selection statistic**. The true likelihood ratio you *should* use is:  
  **λ_true** = P(D | H₁, S=1) / P(D | H₀, S=1)  = λ_report × **γ**,  
  where **γ** = [P(S=1 | D, H₀) / P(S=1 | D, H₁)] is the **adversarial distortion factor**.  

  γ < 1 because:  
  - Under H₀, researchers exploit degrees of freedom to achieve "significance" (e.g., p-hacking), so P(S=1 | D, H₀) is inflated.  
  - Under H₁, selection depends on true effect size, but γ < 1 holds when H₁ is weakly supported (common in social psychology).  

  **γ estimates the flexibility tax** and requires **base rates over a reference class** (e.g., "How often do H₀ studies in this field get published?"). This is where frequentist long-run properties enter: γ depends on the *expected behavior* of researchers facing similar incentives.  

  #### 2. **Pre-Registration as a Commitment Device**  
  Pre-registration shrinks the set **A** to a single analysis path *aᵣ*. This forces S(D, A) = S(D, aᵣ), collapsing γ toward 1. The value is not in "fixing beliefs" but in **reducing the adversary's action space**, making γ estimable.  

  #### 3. **Error Rates as Community Calibration**  
  Frequentists care about **Type I error rates** not because they "worship long-run frequencies" but because they index **robustness to adversarial selection**. In Bayesian terms:  
  - A procedure with controlled Type I error rate α guarantees that, *across pre-registered studies where H₀ is true*, the expected rate of "significant" results is ≤ α.  
  - This ensures **community-level calibration**: If you observe a "significant" result (p < α) from a *pre-registered* study, your posterior P(H₀ | D) ≤ α only if your prior P(H₀) is 0.5 (from Bayes factor bounds). For low prior odds (e.g., P(H₁)/P(H₀) = 1:10), P(H₀ | D) can still be high, but the α-control provides a **worst-case bound** when priors are unreliable.  

  Without α-control, γ becomes unboundedly large in adversarial settings (e.g., p-hacking until p < 0.05), making P(H₀ | D) unacceptably high even for strong λ_report.  

  #### 4. **Optional Stopping as Evidence Corruption**  
  Optional stopping is not problematic for *individual* Bayesian updating (due to likelihood principle). But in adversarial communication, it distorts γ:  
  - Under H₀, a researcher who peeks at data and stops when p < 0.05 inflates P(S=1 | D, H₀).  
  - Under H₁, stopping early might not inflate P(S=1 | D, H₁) proportionally (e.g., if true effects are small).  
  Thus, γ decreases, and λ_report overstates evidence.  

  ---

  ### Residue Report: Where the Translation Fails  
  #### 1. **The Flexibility Tax Requires Frequentist Base Rates**  
  Your conjecture is correct: **Estimating γ demands frequentist reference classes**. To compute γ = P(S=1 | D, H₀) / P(S=1 | D, H₁), you need:  
  - **P(S=1 | H₀)**: The probability a H₀ study publishes a "significant" result, estimated from replication failures or meta-analyses (e.g., "In social psychology, 40% of H₀ studies achieve p < 0.05 via flexibility").  
  - **P(S=1 | H₁)**: The power of the research paradigm, which depends on typical effect sizes.  

  This is not a defect; it's necessary for handling **adversarial settings**. Bayesian models can incorporate γ, but γ itself is a frequentist object (a property of the research ecosystem).  

  #### 2. **Distortion: The "Thing" Being Protected**  
  The frequentist protects **inferential robustness under uncertainty about priors and incentives**. Key points:  
  - **Bayesian inference assumes honest reporting**: If you condition on λ_report, you assume the researcher computed it correctly. Frequentists distrust this assumption.  
  - **γ quantifies incentive misalignment**: It measures how much the selection process *systematically favors false positives*.  
  - **Single-agent limitations**: Your framework can model γ if you treat the researcher as a "black box" with known distortion properties. But in practice, γ is estimated from community-level data (e.g., replication rates), not first principles.  

  #### 3. **The Leftover: Adversarial Calibration as a Desideratum**  
  Yes, **error-rate guarantees are claims about institutional calibration**, not individual beliefs. The Bayesian framework can *represent* this but only by stepping outside pure inference:  
  - **Desideratum**: "A community using procedure X will, over many studies, achieve a false discovery rate ≤ α."  
  - **Bayesian reformulation**: This is a statement about the **average posterior P(H₀ | D)** across a stream of studies selected by S(·). It requires:  
    - A prior over both hypotheses *and research practices*.  
    - Aggregating evidence across studies (meta-analysis).  
  - **The catch**: Frequentists want α-control *without* specifying priors. This is impossible in Bayesian inference but valuable when:  
    - Priors are contested (e.g., controversial hypotheses).  
    - Adversaries exploit Bayesian subjectivity (e.g., choosing priors to enable p-hacking).  

  **The irreducible frequentist claim**: When incentives favor false positives, community-level calibration requires constraints on *procedures* (e.g., pre-registration, α-thresholds) that cannot be reduced to individual belief updates.  

  ---

  ### Conclusion: A Synthesis  
  The replication crisis concerns are about **noise in scientific communication channels**, not flaws in Bayesian logic. Frequentist methods (pre-registration, α-control) are **robustness hacks** for adversarial settings:  
  1. **γ is real and Bayesianly valid** but requires frequentist base rates.  
  2. **Pre-registration reduces γ** by limiting adversary moves.  
  3. **Error rates ensure community calibration** when priors are unreliable or incentives are misaligned.  

  Your framework *can* absorb this by:  
  - Treating γ as a **hyperparameter** estimated from replication data.  
  - Demanding **pre-registration** to bound γ.  
  - Using **empirical Bayes** to incorporate community error rates (e.g., setting priors using replication base rates).  

  **What remains outside Bayesianism**: The insistence that *even without empirical γ estimates*, procedural safeguards (α-control) are necessary to discipline an incentive-driven system. This is a **normative claim about institutions**, not a law of inference. It arises because science is a **multi-player game with conflicting goals**, not a solo truth-seeking endeavor.  

  > **Illustration**: In social psychology (2010s), flexible analyses allowed H₀ studies to achieve "p < 0.05" 30-50% of the time. For a published study with λ_report = 20 (strong evidence), γ might be 0.1 (due to selection bias), so λ_true = 2 (weak evidence). Pre-registration forces γ ≈ 1, restoring λ_report ≈ λ_true. α-control ensures that if 100 H₀ studies are pre-registered, ≤5 falsely claim success.
