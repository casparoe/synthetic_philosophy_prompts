prompt: |-
  I'm a senior software engineer at a direct-to-consumer genomics company, and I sit on our Product and Model Review Committee, which has to sign off before any model output is shown to customers. I have no formal training in philosophy or in quantitative genetics, and I have no access to journals from here, so I need the committee's reasoning to be self-contained: please don't cite papers or point me to a reading list, and please flag explicitly any empirical claim you aren't confident about rather than sourcing it. I'm comfortable with regression, variance decomposition, and out-of-distribution generalization, so feel free to lean on those analogies, but please define the specialist vocabulary (broad- and narrow-sense heritability, gene–environment correlation, genetic nurture, stratification) as you go.

  The proposal in front of us is "Learning Potential," an add-on report for parents who have already had their child genotyped through one of our kits. It displays a percentile derived from a polygenic score for educational attainment, with two comparison modes: against the general population, and — this is the part that worries me most — side by side against siblings in the same family.

  The product spec's explanatory copy currently reads: "How much of a child's success at school comes from their DNA? Scientists estimate that about 40% of the differences between people in years of schooling is genetic. Learning Potential measures that genetic component directly. Your child's result reflects their natural learning capacity — the part that teaching, tutoring and schooling don't change."

  The data science team's own numbers, which I trust, are these: the score explains roughly 12% of the variance in years of schooling in a held-out sample drawn from the same population it was trained on; the individual-level prediction interval is about plus or minus three years of schooling, which is wide enough that most children are statistically indistinguishable from most others; the reference panel is overwhelmingly of one continental ancestry, and accuracy degrades substantially for customers outside it; and the headline "about 40%" comes from a between-family estimate, while a sibling-difference design on the same cohort returns a figure roughly half that size.

  My own contribution to the discussion was a proposed rule I've been calling the transported-environments check, borrowed from how we think about distribution shift in ML: a trait-level claim anchored to a heritability estimate may be shown to users only if the score's calibration is stable across the environments a user could plausibly choose between — school quality, tutoring hours, whether a learning difficulty gets treated — because if the prediction's validity depends on conditions that the parent's own reading of the report will then change, presenting it as a fixed capacity is incoherent. Several colleagues think this test is either too vague to implement or so demanding that it would ban every such product, and they may be right.

  The committee is split. The strongest case for shipping is anti-paternalism: the underlying estimate is public, parents are entitled to their own family's genomic data, uncertainty can be shown in the UI rather than suppressed, and refusing to ship mainly pushes people toward unregulated apps that present the same numbers far more crudely. There is also a support ticket that has been circulating internally, from a mother of a child later diagnosed with dyslexia, who says seeing a low score ended two years of blaming herself and her child and is what prompted her to seek an assessment. Against that, we have a ticket from a parent who concluded from a low score that tutoring would be wasted and withdrew from a programme the child had been benefiting from.

  Please draft the decision memo I'll circulate before Thursday's meeting, addressed to the committee, roughly 900 words, with memo headings. It should:

  1. Give a bottom line — approve, reject, or approve with conditions — as a concrete set of actions with owners and a timeline, not a set of considerations. If conditions, specify which parts of the feature (the sibling-comparison mode, the general-population percentile, the explanatory copy, the age range, the ancestry groups we have validation data for) are affected and how.

  2. Include a short section on what a heritability estimate does and does not license, written so the product team can turn it into UI rules. In particular I need the committee to settle: whether a population-level variance ratio supports any claim about an individual child's causes; whether the headline figure should be the broad-sense or the narrow-sense quantity given that our score is a weighted sum of additive effects; whether the between-family or the within-family estimate is the honest number for a feature whose whole point is comparing children who share a home and parents; and what it means that part of what the score predicts may be the environment the parents go on to provide rather than something intrinsic to the child.

  3. Rule on my transported-environments check: adopt it, narrow it into something auditable, or replace it with a better test. If you replace it, say what the replacement requires us to measure before we can ship.

  4. Handle a point I can't get straight myself. It seems to me that heritability is a ratio defined relative to a particular population in a particular range of environments, so that making environments more equal — guaranteeing everyone the same schooling, say — can raise the heritability figure while raising everyone's actual outcome. If that's right, then a high number is fully compatible with environmental changes mattering enormously, and the parent who cancelled tutoring has the inference backwards. But I want the committee to say this in its own words and in a form we could put in the FAQ, and to tell me if I've overstated it.

  5. Give the losing side its best day in court. If you recommend holding or dropping the feature, engage the anti-paternalism argument and the dyslexia ticket seriously, and say what would have to be true for you to change your recommendation.
reasoning: |-
  We are drafting a decision memo for the Product and Model Review Committee regarding the "Learning Potential" feature proposal.

  Bottom line: We recommend approving the feature with conditions. The conditions are as follows:

  - **Sibling-comparison mode**: Remove this feature entirely. The sibling-difference design shows that the within-family heritability estimate is roughly half the between-family estimate, and the model's performance in predicting differences between siblings is unknown and likely poor given the wide prediction intervals. Displaying such comparisons could be highly misleading and potentially harmful.

  - **General-population percentile**: Retain, but with the following changes:
    - Display the prediction interval (plus or minus three years) prominently alongside the percentile, and clarify that the interval means that most children are statistically indistinguishable from most others.
    - Restrict access to customers within the ancestry groups for which we have validation data (i.e., the majority ancestry in our reference panel). For others, do not display the percentile but provide a message explaining the lack of validation and higher uncertainty.

  - **Explanatory copy**: Revise entirely. The current copy is misleading in several ways (detailed below). The product team must rewrite it with input from the committee and our in-house genetic counseling team. A draft must be reviewed by the committee before implementation.

  - **Age range**: The score is trained on years of schooling in adults. We cannot assume it predicts the same in children. Therefore, the report must include a clear disclaimer that the score is derived from adult educational outcomes and that a child's environment and experiences can substantially alter their trajectory.

  Timeline and owners:
  - Product team to revise spec (remove sibling comparison, revise explanatory copy, add disclaimers) by [Date: 1 week from now].
  - Data science team to implement UI changes (prediction interval display, ancestry-based access restrictions) by [Date: 2 weeks from now].
  - Committee review of revised spec and UI mockups: [Date: 3 weeks from now].
  - Launch: No earlier than [Date: 4 weeks from now], pending committee sign-off.

  **Section 1: What Heritability Licenses and Does Not License (for UI Rules)**

  Heritability is the proportion of variation in a trait (e.g., years of schooling) in a specific population, in a specific range of environments, that is attributable to genetic variation. It is a population-level statistic, not an individual-level one. For the UI:

  - **Individual claims**: A heritability estimate (e.g., 40%) does not mean that 40% of *your child's* schooling outcome is due to genes. It means that in the studied population, 40% of the *differences between people* in that population are associated with genetic differences. The score we provide is a prediction of the genetic component for an individual, but it is noisy (wide interval) and captures only part of the genetic influence (additive effects).

  - **Broad-sense vs. narrow-sense**: Our polygenic score (PGS) captures only additive genetic effects (narrow-sense heritability, h²). The 40% figure cited is from a between-family study and includes non-additive effects and gene-environment correlations. The within-family estimate (from siblings) is about 20%, which is a better estimate of the additive heritability that the PGS aims to capture. Therefore, the headline number in explanatory copy should not be 40% without context. If cited, it must be alongside the within-family estimate and an explanation of the difference.

  - **Between-family vs. within-family**: For a feature that compares siblings (which we are removing), the within-family estimate (20%) is the relevant one because siblings share environments. The between-family estimate (40%) conflates genetic effects with environmental differences between families (e.g., wealth, neighborhood). Our PGS, trained on between-family data, may capture some of these environmental effects via gene-environment correlation (e.g., genes that influence parenting behavior). Thus, the score may reflect "genetic nurture" (parental genetics affecting the child's environment) as well as the child's own genetic effects.

  - **Genetic nurture**: Part of what the PGS predicts may not be intrinsic to the child but rather the environment the parents provide, influenced by the parents' own genetics. This is a critical point for disclosure: the score is not purely "natural capacity" but may also reflect environmental advantages passed down.

  UI Rule: Explanatory copy must state that the score reflects a combination of the child's own genetic influences and environmental influences correlated with genetics (including parental behavior), and that the relative contribution of these is not known for any individual.

  **Section 2: Ruling on the Transported-Environments Check**

  We adopt a narrowed version of the transported-environments check. The core concern is valid: if the prediction's validity depends on environmental conditions that the report might change (e.g., a parent withdrawing tutoring), then labeling it as "fixed capacity" is misleading.

  The narrowed test requires:
  - **Stability across key choice points**: We must show (or cite literature showing) that the PGS prediction is not significantly moderated by environmental factors a user might change in response to the report (e.g., school quality, tutoring, treatment for learning difficulties). If moderation exists, the report must warn against such changes (e.g., "This score does not mean that interventions will be ineffective; in fact, the effect of interventions may vary, and withdrawing support could be harmful").
  - **Empirical basis**: The data science team must analyze available datasets (e.g., within cohorts with environmental variables) to test for interactions between the PGS and modifiable environments. If no such data exists, the report must include a prominent disclaimer that the score's stability under environmental changes is unknown.

  Given our current data, we cannot confirm stability. Therefore, as a condition of approval, the explanatory copy must include: "This score does not measure a fixed 'capacity.' Environmental factors, including educational support, can significantly alter a child's outcomes. The score's prediction assumes a typical range of environments and may not hold if environments change substantially."

  **Section 3: Heritability and Equalized Environments**

  Yes, heritability is a ratio defined for a specific population and range of environments. Making environments more equal (e.g., equal schooling for all) can increase heritability by reducing environmental variation (the denominator), even as everyone's outcomes improve. Thus, a high heritability is fully compatible with environmental interventions having large effects. In fact, heritability can be high *because* environmental variation is low.

  FAQ language: "Heritability estimates depend on the population and environment studied. If environmental factors become more equal (e.g., if all children receive high-quality schooling), genetic differences may account for a larger proportion of the remaining variation in outcomes. This does not mean that environment doesn't matter — in fact, equalizing environments often raises everyone's outcomes. A high heritability estimate is consistent with environmental changes having a large impact."

  **Section 4: Best Day in Court for the Losing Side**

  The anti-paternalism argument is strong: parents have a right to their child's genomic data, and suppressing this feature may drive them to unregulated apps with worse explanations. The dyslexia support ticket shows real harm from *not* having this information — it ended guilt and prompted action. If we provide the data with careful framing, we might empower more such parents.

  However, the harm from the tutoring withdrawal ticket is also real and directly linked to the feature's framing. Our duty is to present data in a way that minimizes misinterpretation. We are not banning the score; we are conditioning it on safeguards.

  We would change our recommendation to "approve without removing sibling mode" only if:
  1. We had validation that the PGS robustly predicts sibling differences in educational outcomes (which we don't, and the wide interval suggests it won't).
  2. We had evidence that showing sibling comparisons does not increase harmful decisions (e.g., from user testing).

  For now, the risks of sibling comparisons outweigh the benefits. But the general-population percentile, with revisions, can be made safe enough to offer.

  **Conclusion**

  Approve "Learning Potential" with the specified conditions. The feature must not compare siblings, must display uncertainty and ancestry restrictions prominently, and must revise explanatory copy to clarify what heritability and the score represent. The committee must review the final copy and UI before launch.
answer: |-
  **To:** Product and Model Review Committee  
  **From:** [Your Name], Senior Software Engineer  
  **Date:** October 26, 2023  
  **Subject:** Decision on "Learning Potential" Feature Proposal  

  ---

  ### **1. BOTTOM LINE: APPROVE WITH CONDITIONS**  
  We approve the "Learning Potential" feature for launch, contingent on the following actions by owners and timelines. Failure to meet these conditions will result in rejection.  

  - **Condition 1: Remove sibling-comparison mode entirely**.  
    **Owner:** Product Team  
    **Timeline:** Remove from spec by 10/30.  
    **Rationale:** The model’s performance in predicting within-family differences is unvalidated, and the sibling-difference heritability estimate (20%) is half the between-family estimate (40%). Displaying sibling comparisons risks misleading users, given the wide prediction intervals and potential for harmful decisions.  

  - **Condition 2: Revise explanatory copy to align with Section 2 guidelines**.  
    **Owner:** Product Team + Legal/Comms  
    **Timeline:** Draft by 10/30, committee review by 11/2.  
    **Changes:**  
    - Replace "natural learning capacity" and "part that teaching doesn’t change" with accurate framing (see Section 2).  
    - Disclose that the 40% figure is population-specific and not directly transferable to individuals.  

  - **Condition 3: Display prediction intervals and ancestry limitations prominently in UI**.  
    **Owner:** Data Science + UX Team  
    **Timeline:** Implement by 11/6.  
    **Changes:**  
    - Show the ±3-year prediction interval alongside the percentile.  
    - Restrict the general-population percentile to ancestry groups with validation data. For others, show: "Accuracy not validated for your ancestry; interpret with caution."  

  - **Condition 4: Add FAQ on heritability-environment dynamics (per Section 3)**.  
    **Owner:** Product Team  
    **Timeline:** Draft by 10/30, committee review by 11/2.  

  **Launch Date:** No earlier than 11/9, pending committee sign-off on final copy and UI.  

  ---

  ### **2. WHAT HERITABILITY LICENSES (AND DOES NOT) FOR UI RULES**  
  This section provides rules for explanatory copy and disclaimers. **Key definitions:**  
  - **Broad-sense heritability (\(H^2\))**: Total genetic contribution (additive + non-additive effects).  
  - **Narrow-sense heritability (\(h^2\))**: Only additive genetic effects (what polygenic scores capture).  
  - **Gene-environment correlation**: Genetic factors that influence environmental exposure (e.g., high-scoring parents provide richer learning environments).  
  - **Genetic nurture**: Parental genetics affecting the child’s environment (e.g., parents’ education-linked genes shaping home learning).  
  - **Stratification**: Genetic differences between populations that correlate with environmental factors (e.g., ancestry and school funding).  

  **UI Rules:**  
  - **Individual claims**: Heritability is a *population-level* variance ratio (40% of differences in a group). It does **not** mean "40% of your child’s outcome is genetic." The score predicts a genetic *component*, not fixed potential. UI must state: "This result estimates one genetic factor among many influences."  
  - **Broad-sense vs. narrow-sense**: Our score captures *narrow-sense* heritability (additive effects). The 40% estimate includes broad-sense effects, so UI must clarify: "Based on additive genetic effects only; total genetic influence may be higher."  
  - **Between-family vs. within-family**: The 40% is a *between-family* estimate, confounded by shared environments (e.g., wealth). The honest figure for comparing siblings is the *within-family* estimate (20%). Since we remove sibling comparisons, the general-population percentile may cite 40% but must add: "This varies by environment and is lower when comparing siblings."  
  - **Genetic nurture**: The score may reflect environmental factors (e.g., parental education) via gene-environment correlation. UI must state: "Part of this result may reflect environmental advantages correlated with genetics, not just innate ability."  

  ---

  ### **3. RULING: ADOPT A NARROWED TRANSPORTED-ENVIRONMENTS CHECK**  
  We adopt a narrowed, auditable version of your test. **Revised rule:** Before launch, we must quantify how environmental changes (e.g., tutoring, school quality) affect the score’s predictive validity.  

  **Action for Data Science Team (by 11/6):**  
  - Test calibration stability across environments using available datasets (e.g., split users by school-tier or tutoring access).  
  - If stability is low (e.g., score accuracy drops when environments change), add: "This score’s accuracy may change if your child’s environment changes. Educational support can significantly alter outcomes."  
  - If no data exists, default to: "The impact of environmental changes (e.g., tutoring) on this score’s accuracy is unknown."  

  **Why this?** It addresses incoherence (parents changing environments based on a "fixed" score) but is measurable. Your original phrasing was sound but vague; this ties to empirical checks.  

  ---

  ### **4. HERITABILITY, ENVIRONMENTAL EQUALITY, AND FAQ GUIDANCE**  
  You are correct. **FAQ language (committee-approved):**  
  > "Heritability estimates depend on the specific population and range of environments studied. If environments become more equal (e.g., equal access to high-quality schools), heritability can *increase* because genetic differences explain a larger share of the remaining variation. This does not mean environments matter less—in fact, equalizing environments often *raises* everyone’s outcomes. A high heritability is consistent with environmental changes having large effects. Withdrawing support based on a genetic score is not scientifically justified."  

  **Why this?** Heritability is a ratio: \( h^2 = \frac{\text{genetic variance}}{\text{total variance}} \). Reducing environmental variance (denominator) raises \( h^2 \), even if genetic effects stay constant. The parent who canceled tutoring reversed causality: the score does not measure "untouchable" potential.  

  ---

  ### **5. BEST DAY IN COURT: THE CASE FOR SHIPPING**  
  The losing side (approve as-is) argues:  
  - **Anti-paternalism**: Parents own their child’s genomic data. Withholding this pushes them to unregulated apps (e.g., "raw data" interpreters) that lack our disclaimers.  
  - **The dyslexia ticket**: A low score ended parental self-blame and prompted diagnosis. Suppressing the feature risks prolonging such suffering.  

  **Why we overruled:** Unregulated access is a real concern, but we mitigate it by shipping *with safeguards*. The dyslexia case is compelling, but the tutoring-withdrawal case shows equal harm from misuse. We would approve without conditions only if:  
  1. The score explained >30% variance (current 12% is too low for individual predictions).  
  2. Sibling-comparison validation existed (it doesn’t).  
  3. We had proof that environmental changes never alter calibration (unlikely).  

  **Compromise:** By shipping the general-population percentile with transparency, we serve parents like the dyslexia case while reducing risks.  

  ---  
  **Final Vote:** We will vote on this proposal at Thursday’s meeting. Pending conditions, "Learning Potential" may proceed.
