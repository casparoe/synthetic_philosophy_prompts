  Word count management: the cover letter establishes tone (150 words), Form 7-B sections handle specific dilemmas (500 words), with bureaucratic sign-off (50 words). Key phrases to deploy: "precautionary experiential calculus," "non-sapient thermal subjects," "emergence of macro-experientiality."

  Final check: zero jokes. The humor must arise from bureaucratic seriousness applied to metaphysical nonsense. The Sun's 10^45 photons/second atrocity gets exactly one dry mention. Done.
