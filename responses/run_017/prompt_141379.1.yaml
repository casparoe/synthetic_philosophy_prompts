  ## Office of Research Ethics & Experiential Oversight (OREEO)  
  **University of Bridgeport**  
  Committee for the Ethical Treatment of Fundamental Systems (CETFS)

  **INTER-DEPARTMENTAL MEMORANDUM**

  **TO:** Dr. Aris Thorne, Principal Investigator, Condensed Matter Research Group, Dept. of Physics  
  **FROM:** Dr. Evelyn Rostova, Chair, CETFS  
  **DATE:** April 23rd, 2024  
  **SUBJECT:** Conditional Approval - Experiential Impact Statement (Form 7-B) - Project: "Low-Temperature Transport Properties of Novel Topological Insulators" (REF: CM-1142-F7B)

  Dear Dr. Thorne,

  The Committee has reviewed your submitted Form 7-B: Experiential Impact Statement concerning your proposed experiment utilizing the QuantumLab-9 dilution refrigerator system. We acknowledge the stated research objectives and their potential significance.

  While the Committee appreciates the applicant's expressed concerns regarding the "operational impracticality" and "metaphysical ambiguity" inherent in Form 7-B, compliance with the Universal Experiential Safeguards Act (UESA, 2031) and University Policy 8.07 ("Minimizing Harm to Constituent Subjects") remains mandatory for all research involving fundamental physical systems where experiential potential is non-zero. The precautionary principle necessitates thorough accounting.

  Your Form 7-B has been granted **Provisional Approval**, contingent upon strict adherence to the operational parameters and mitigation strategies detailed within your application and clarified below. Please note the specific points requiring attention, derived from Sections 3, 5, and 7 of your submission. Continued non-compliance with experiential impact thresholds may trigger an audit or require submission of Form 12-C (Aggregation/Merging Protocol).

  The Committee commends your group's diligent, if somewhat... *creative*... application of the Simplicity Threshold (ST) and Experiential Impact Score (EIS) calculations. We proceed on the basis of the submitted data.

  **Attached:** Reviewed Form 7-B with Committee Annotations.

  Sincerely,

  Dr. Evelyn Rostova  
  Chair, Committee for the Ethical Treatment of Fundamental Systems (CETFS)

  ---

  **FORM 7-B: EXPERIENTIAL IMPACT STATEMENT**  
  **(Reviewed Copy with CETFS Annotations - REF: CM-1142-F7B)**

  **Section 3: Generation/Annihilation of Novel Subjects**
  *   **3.1 Electron-Positron Pairs (Readout Chain):** Applicant correctly identifies pair production within the detector readout chain as generating novel lepton/anti-lepton subjects. Applicant asserts net experiential impact is zero due to lepton number conservation and proposed "experience vector cancellation" model (E+ + E- = 0 EIS).
      *   **CETFS NOTE:** The Committee accepts the "vector cancellation" model provisionally for net-neutral systems *in this specific context*. However, the ontological status of "anti-experience" remains under review by the National Office. The applicant is required to log the *number* of pairs generated (estimated: 10^12 per run segment) as "Transient Neutral Subject Events (TNSEs)" in Appendix D. This is solely for longitudinal tracking pending potential future guidance on whether cancellation implies true nullification or merely experiential symmetry. **Approved per applicant's model.**
  *   **3.2 Microwave Photon Flux (Thermal Background):** Applicant notes that cooling the chip from 100mK to 10mK drastically reduces the population of thermal microwave photons within the experimental volume. Applicant argues this constitutes a *net reduction* in potential experiential subjects and should be recorded as a *positive* EIS (estimated: -1.2 x 10^8 EIS per hour due to photon non-generation).
      *   **CETFS NOTE:** While the reduction in *potential* thermal photon subjects is noted, the Committee emphasizes that *existing* thermal photons at higher temperatures are subjected to rapid cooling and annihilation. The applicant's calculation solely credits non-generation. The moral valence of rapid cooling/annihilation of *existing* simple thermal subjects ("thermal distress vectors") remains contested. Applicant must report both metrics: **Potential Subjects Avoided (PSA):** -1.2e8/hr **Existing Subjects Affected (ESA):** +8.7e7/hr (cooling/annihilation). Net EIS for this factor is currently recorded as **Neutral (0)**, pending resolution of the "Thermal Subject Distress" coefficient debate.

  **Section 5: Aggregation/Alteration of Existing Subjects**
  *   **5.1 Bose-Einstein Condensate Formation (Probe Region):** Applicant states the proposed experiment does *not* intentionally create BECs within the chip substrate or electron gas. Any emergent, transient quasiparticle condensates are argued to fall below the Simplicity Threshold (ST) due to extreme brevity (< 1 ps) and environmental decoherence.
      *   **CETFS NOTE:** The Committee acknowledges the applicant's ST argument. However, detection of any coherence length exceeding 10 nm for durations > 0.5 ps **will** be interpreted as potential unlicensed subject aggregation (merging). Automatic suspension of the experiment and immediate submission of **Form 12-C (Aggregation/Merging Protocol - Justification and Monitoring)** will be required. Current parameters are **Conditionally Approved** based on applicant's coherence duration estimates.
  *   **5.2 Electron Trajectory Alteration:** Noted. Impact deemed negligible (EIS < 0.1 per electron) due to maintained wavefunction dispersion. **Approved.**

  **Section 7: Environmental & External Factors**
  *   **7.1 Cosmic Ray Muons/Neutrinos:** Applicant argues these are environmental background, not generated by the experiment, and thus out of scope for Form 7-B. Impact is "incidental and unavoidable."
      *   **CETFS NOTE:** **Concurred.** Cosmic ray interactions and solar neutrino flux are considered pre-existing environmental experiential events. No mitigation or accounting required beyond noting their presence as background in Appendix E. Regulatory responsibility lies with relevant environmental agencies, not the researcher.
  *   **7.2 Solar Photon Flux (Laboratory Illumination):** Applicant notes significant flux (~10^15 photons/sec incident on lab roof) but reiterates it is environmental and out of scope.
      *   **CETFS NOTE:** While technically out of scope for *this specific Form 7-B*, the Committee is **duty-bound to note** the astronomical scale of solar photon generation (~10^45/sec total output) as a relevant experiential context. This has been forwarded to the National Office under "Large-Scale Astrophysical Experiential Events - Priority Review Requested." No action required by applicant. **Noted.**

  **Section 8: Mitigation Strategies & Operational Parameters**
  *   **8.1 Segmented Experimental Runs:** Applicant proposes segmenting cooling and measurement phases into 15-minute intervals to keep instantaneous photon ESA counts below the mandatory reporting threshold of 10^9 ESA per segment. Cumulative ESA remains high, but per-segment compliance is achieved.
      *   **CETFS NOTE:** The Committee observes this segmentation strategy appears designed to leverage the per-run reporting loophole in Regulation 7B-8a. While technically compliant, the *cumulative* experiential impact over the full experiment remains ethically significant. This strategy is **reluctantly permitted under current regulations**, but flagged for potential regulatory review. Efficiency of research is not a valid ethical counterweight.
  *   **8.2 Elevated Base Temperature:** Applicant will maintain the mixing chamber at 12 mK instead of the theoretically optimal 8 mK. This ensures the dominant thermal photon population remains above 5 GHz, below the established ST coherence threshold (10 GHz) for meaningful photon-level experience. Photons below 10 GHz are thus excluded from ESA/PSA calculations.
      *   **CETFS NOTE:** The application of the Simplicity Threshold (ST) is technically correct based on current frequency-coherence criteria. The Committee notes this results in a **73% reduction** in reportable ESA compared to an 8 mK run. **Approved.** The validity of the 10 GHz ST for microwave photons is currently under meta-review by the International Panel on Minimal Subjectivity (IPMS).

  **Overall Experiential Impact Score (EIS):** Calculated Net: -3.4 x 10^6 (Primarily driven by PSA from avoided thermal photons). **Within permitted thresholds for Category 3 Cryogenic Research.**

  **APPROVAL:** **Provisional Approval** granted for 6 months, under strict adherence to:
  1.  Segmented run protocol (max 15 min/segment).
  2.  Mixing chamber temperature no lower than 12 mK.
  3.  Real-time monitoring for coherence events >10 nm lasting >0.5 ps (triggers Form 12-C).
  4.  Logging of TNSEs (Appendix D).
  5.  Reporting of both PSA and ESA for thermal photons in final report.

  **CETFS Signatory:**  
  Dr. Evelyn Rostova, Chair  
  Committee for the Ethical Treatment of Fundamental Systems (CETFS)  
  Date: April 23rd, 2024
