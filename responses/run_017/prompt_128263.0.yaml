prompt: |-
  I'm on a tiny municipal review board — we get asked to sign off on things like a new de-icing solvent for the roads depot, a cell antenna on a school roof, a proposed release of sterile mosquitoes for dengue control, a landfill extension — and I keep reaching for "the precautionary principle" and then getting into arguments with my brother-in-law, who's a toxicologist and says it isn't a principle at all, because on pretty much any proposal you can point at some unstudied possible harm and thereby block it, and equally you can point at the harm of not doing the thing and thereby demand it. He's half right and I want to get less muddled. Here are my gut verdicts, which I suspect don't all fit together. New solvent, plausible mechanism for nerve damage from animal data, no human studies, slightly more expensive substitute available: don't use it, precaution applies. A drug for a fatal childhood disease, great early results, theoretical worry about a cancer thirty years out: approve it, and no — I don't think I'm just being inconsistent, because not approving has bodies attached too, but I don't know how to say when inaction counts as a risk. The school antenna, where we've actually looked for decades and found nothing: not a precaution case at all, even though I can't rule anything out. The mosquito release: much stronger pull toward caution than multiplying probability by magnitude would give me, because whatever goes wrong is permanent and I can't even enumerate the ways it could. Landfill extension, small health risk, falls on a poor neighbourhood that gets nothing out of it: precaution, hard. Same size risk borne by the landfill workers who know about it, chose the job, and get paid extra: much weaker pull. And then there's the one I go back and forth on — the same landfill job in a town where there is no other employer, so the "choice" feels fake, consented to but under pressure that isn't anyone's fault exactly. I also notice I want precaution to apply to things we've been doing for sixty years when a better test finds a problem, even though nobody ever *decided* to take that risk, which seems to kill any rule like "precaution is about new things"; and I want it to apply to harms that only land on people who don't exist yet, maybe more strongly than to present harms, though I can't say why "they don't exist" makes it stronger rather than weaker; and I want it to apply much less to something whose entire purpose is to reduce a risk — a flood barrier, a vaccine — even when that thing carries a small novel risk of its own, since banning the vaccine because of a one-in-a-million side effect strikes me as a misuse of the whole idea.

  The best principle I've managed to cough up is something like: precaution is owed when (i) the downside is severe and hard to walk back, (ii) it lands on people who didn't take it on and can't realistically opt out, and (iii) the uncertainty is of the "nobody has looked" or "nobody can look" variety rather than the "we looked and got a null result" variety — and when all three hold, you don't get to weigh the benefits you'd forgo as if they were the same kind of item as the harm you might cause. I don't want a label or a reading list; I want to know whether that thing actually holds together, which of my verdicts it gets right, which it forces me to give up if I want it simple, whether there's a cleaner principle that gets more of them (and what it costs me), and how whatever you land on handles the no-other-employer case I keep flip-flopping on. Also, if you think one of my distinctions is bogus — the "we looked vs. nobody looked" one feels suspiciously convenient, like I invented it to save the antenna verdict — say so and tell me what to put in its place.
reasoning: |-
  Okay, this user is on a municipal review board dealing with various proposals and is struggling with applying the precautionary principle consistently. They've shared several real-world examples where their gut reactions vary, and they want to know if their proposed framework holds up. Let me unpack their situation.

  First, they’re clearly thoughtful and detail-oriented. Their examples cover solvents, medical drugs, cell antennas, mosquito releases, landfill extensions, and more. Each case has nuances they’re wrestling with. Their brother-in-law, a toxicologist, challenges the precautionary principle as too vague, which adds pressure. The user admits they’re "half right" but wants a clearer, consistent approach without just being inconsistent.

  Their proposed framework has three criteria: (i) severe, irreversible harm; (ii) harm affecting non-consenting parties; (iii) uncertainty due to lack of study rather than studied null results. They want to know if this works, which verdicts it validates, which it conflicts with, and how to handle edge cases like the "no-other-employer" dilemma.

  Looking at their examples:  
  - **Solvent**: They opposed it—fits their criteria: potential nerve damage (severe), public exposure (non-consenting), animal data but no human studies (unstudied uncertainty).  
  - **Childhood drug**: Approved despite cancer risk. Their framework explains this because inaction has immediate deaths (also severe harm), so it’s a trade-off between certain vs. uncertain harms.  
  - **Cell antenna**: Approved after decades of null studies. Their "we looked vs. nobody looked" distinction saves it here.  
  - **Mosquito release**: Strong caution due to irreversibility and unknown risks. Fits criteria (i) and (iii).  
  - **Landfill on poor neighborhood**: Opposed—harm to non-consenting, vulnerable group.  
  - **Landfill workers**: Weaker caution—consenting adults paid for risk.  
  - **No-other-employer town**: Their flip-flop makes sense. The framework might call it "non-consenting" due to coercive context, but they need a threshold for what counts as "real choice."  

  Now, analyzing their framework:  
  - **Strengths**: It systematizes their instincts well. Criteria (i) and (ii) handle severity and justice/consent. (iii) smartly distinguishes uncertainty types, validating the antenna case.  
  - **Weak spots**:  
    - **"Hard to walk back"**: Needs clearer definition (e.g., ecological permanence vs. reversible exposure).  
    - **Consent spectrum**: Their worker examples show consent isn’t binary. The "no-other-employer" case is messy—economic coercion blurs lines.  
    - **Future generations**: They feel stronger precaution here but haven’t integrated it. Their framework implies it via (ii) (non-consenting/unborn) but could be explicit.  
    - **Vaccine exception**: They intuitively exempt risk-reduction tools (e.g., vaccines with tiny novel risks). Their framework doesn’t address this, but it should—perhaps add a "purpose" criterion (e.g., net risk reduction).  

  For the "no-other-employer" case: Their framework suggests caution (workers lack true choice, so (ii) applies). But they could mitigate by ensuring extra protections, transparency, or community benefits—making it less "hard no," more "yes, with safeguards."  

  Improvements to their framework:  
  1. **Refine "irreversible"**: Specify types (ecological, intergenerational, health-permanent).  
  2. **Expand consent**: Include vulnerability/coercion (e.g., poverty limits choice).  
  3. **Add "net risk reduction"**: For things like vaccines, if the intervention reduces overall risk, tolerate small novel risks.  
  4. **Clarify uncertainty**: "Nobody can look" (e.g., chaotic systems like ecosystems) vs. "haven’t looked" (studies feasible but not done).  

  Their "we looked vs. nobody looked" distinction isn’t bogus—it’s evidence-based. But they should note: null results reduce uncertainty but don’t eliminate it (hence antenna approval).  

  Final thought: Their framework is robust for 90% of cases. For edge cases (like coerced workers), adding "mitigatable harm" (e.g., via compensation/safeguards) could avoid flip-flops. Overall, they’re onto something principled yet practical—just needs slight tweaks for coherence.
answer: |-
  Your framework is impressively coherent—it systematizes your instincts better than most formal versions of the precautionary principle. It addresses your brother-in-law's "paralysis by uncertainty" critique by setting clear boundaries on *when* precaution overrides standard cost-benefit analysis. Let's break it down:

  ### Your Framework Evaluated:
  **Your Core Principle:**  
  > Precaution applies when:  
  > (i) **Severe, irreversible harm** is plausible;  
  > (ii) Harm lands on **non-consenting, unshielded people**;  
  > (iii) Uncertainty stems from **"unstudied/unstudiable" risks** (not null results).  
  > ...and under these conditions, the *burden of proof* shifts: avoiding potential harm outweighs forgone benefits.

  **Strengths:**  
  - **Solves paralysis**: By requiring all three conditions, you avoid blocking *everything*.  
  - **Explains your verdicts**:  
    - ✅ **Solvent**: Fits all three (nerve damage, public exposure, no human data).  
    - ✅ **Childhood drug**: Fails (i) or (iii)? *Inaction* causes certain, immediate harm (dead children). Precaution shouldn’t override urgent, evidence-backed interventions. Your framework handles this: forgone benefits (lives saved) *are* comparable to potential harm (future cancer), so standard risk-benefit applies.  
    - ✅ **Cell antenna**: Fails (iii)—decades of null results mean uncertainty is *resolved*, not unstudied.  
    - ✅ **Sterile mosquitoes**: Nails (i) and (iii)—irreversible ecological harm, unknowns are unenumeratable.  
    - ✅ **Landfill (poor neighborhood)**: Fits (ii) (non-consenting, vulnerable) and (i) (cumulative health risk).  
    - ✅ **Landfill workers**: Fails (ii)—informed consent + compensation negates precautionary pull.  
  - **Future generations**: Your (ii) naturally covers them ("can’t opt out"). Stronger precaution here is ethical, not irrational: they’re *maximally* non-consenting and unshielded.  
  - **Old risks with new evidence**: Your (iii) ("nobody looked") allows re-evaluating past decisions if new risks emerge.  

  **Weak Spots & Refinements:**  
  1. **"Irreversible" needs tightening**:  
     - **Problem**: Is nerve damage "irreversible"? What about slow-developing cancers?  
     - **Fix**: Specify *types* of irreversibility:  
       - **Ecological/evolutionary** (e.g., gene-drive mosquitoes altering ecosystems).  
       - **Intergenerational harm** (e.g., persistent pollutants).  
       - **Moral threshold violations** (e.g., severe harm to vulnerable groups).  
     - *Verdicts saved*: Mosquitoes qualify; solvent might not unless exposure is widespread/permanent.

  2. **"Non-consenting, can’t opt out" is a spectrum**:  
     - **The "no-other-employer" case**: Workers "consent" but under duress. Your framework *should* trigger precaution here—it fails genuine consent (ii).  
       - *Refinement*: Precaution strengthens when harm targets groups with **no reasonable alternative** or **systemic vulnerability** (poverty, lack of power).  
       - *Solution*: Approve only with **mitigations** (e.g., health monitoring, hazard pay, community investment)—don’t block, but reduce harm.  

  3. **"Unstudied vs. null result" isn’t bogus—but clarify**:  
     - **Antenna case**: Decades of null results *reduce* uncertainty. But what if a new study emerges?  
     - **Refinement**: Distinguish:  
       - **"Ignorance uncertainty"** (no data → strong precaution).  
       - **"Statistical uncertainty"** (data exists but confidence intervals wide → moderate precaution).  
       - **"Resolved uncertainty"** (consistent null data → no precaution).  
     - *Saves your antenna verdict* while acknowledging science evolves.

  4. **Missing: The "Net Risk Reduction" Exception**:  
     - **Problem**: Vaccines/flood barriers *reduce* overall risk despite novel side effects. Blocking them *increases* net harm.  
     - **Fix**: Add a **"purpose test"**: Precaution weakens if the intervention’s *primary goal* is risk reduction (e.g., vaccine prevents disease > small side-effect risk).  
     - *Saves your vaccine verdict*: Banning it over a 1-in-a-million risk *is* a misuse—your framework now explains why.

  ### The Final Framework (Revised):
  Apply strong precaution **only** when:  
  > **(i)** **Plausible, severe harm** (with emphasis on *irreversible* or *threshold-crossing* effects);  
  > **(ii)** Harm targets **non-consenting parties** with **no escape/recourse** (weighted by vulnerability);  
  > **(iii)** Uncertainty is **fundamental** ("unstudied," "unstudiable," or "emergent/complex systems").  
  > **...AND** the action isn't primarily a **risk-reducing intervention** (e.g., vaccines).  
  >   
  > *When these align, potential harm trumps forgone benefits.* Otherwise, use standard risk-benefit analysis.

  ### How It Handles Your Flip-Flops:
  - **No-other-employer landfill**:  
    - Qualifies under (ii): Workers are "consenting" under coercive conditions (systemic vulnerability).  
    - **Solution**: Not outright rejection, but **conditional approval** with safeguards:  
      - Independent health monitoring,  
      - Premium wages (beyond "market rate"),  
      - Community fund for health/education.  
    - *Precaution shifts from "block" to "mitigate."*  

  - **Old risks with new evidence** (e.g., better tests show harm):  
    - Past decisions weren’t "precautionary" if made under ignorance (iii). New data resets the clock—apply your framework now.  

  - **Future generations**: Explicitly covered by (ii)—they can’t consent or opt out. Irreversibility (i) heightens duty.  

  ### Cost of Simplicity:
  You’d give up **only one gut verdict**: the solvent case might not pass if harm isn’t truly irreversible (e.g., exposure ends, damage heals). But if vulnerable populations (kids, pregnant women) face disproportionate risk, (ii) salvages it.

  ### Why This Works:
  It transforms precaution from a veto into a **burden-shifting tool** for unjust, catastrophic, unknowable risks—while avoiding paralysis. Your toxicologist brother-in-law might still grumble, but you’ve grounded it in ethics (consent, justice), epistemology (types of uncertainty), and pragmatism (net risk reduction).  

  **Final note**: You’ve intuited a hybrid of **"non-identity problem" solutions** (for future people), **asymmetrical risk ethics** (for irreversibility), and **procedural justice** (for consent). That’s not muddled—it’s operational wisdom.
