prompt: |-
  I'm on a modelling team at a public-health institute — we build transmission models that get handed to people who have to decide things weeks or months before anyone can check whether we were right — and I've been asked to give our group's methods seminar a short talk on the difference between an assumption that is merely idealizing and one that is just wrong. I assumed this would be easy and it isn't. A reviewer recently rejected a paper of ours on the grounds that our treatment of contact structure isn't merely false but "the wrong kind of false," and when we argued about it none of us could say what the kinds are, or why the taxonomy should track anything a modeller cares about. I've since read a little of the philosophical literature on idealization — the F-twist and the reactions to it, the de-idealization picture on which a benign idealization is one you can walk back toward the truth, the view of models as imagined systems we study in their own right before asking how similar they are to the target, the "isolate a real capacity or causal factor" view, and the adequacy-for-purpose view — and what struck me is that each of these gets scored against its author's favourite examples: frictionless planes and the ideal gas law on the friendly side, as-if rationality and unfalsifiable optimality stories in biology on the hostile side. Nobody starts from the standard and then audits the examples.

  So I want the specification rather than the scorecard. Write me the desiderata an account of when an unrealistic assumption is legitimate would have to meet to be worth anything to a working modeller: someone who has to rank which assumptions to worry about first, before the model is used, often with no validation data anywhere near the regime that matters. For each requirement give the case or consideration that motivates it, and mark it as non-negotiable or as a preference of one camp. My own pile of hard cases, which I'd like either handled or explicitly placed out of scope: (i) an assumption that is de-idealizable in principle but not in practice, because the honest version has more unknown parameters than we have data — so that whether it counts as benign appears to drift with available compute and technique; (ii) an assumption that is benign for interpolation and malignant for extrapolation, with the model unchanged, because the neglected term is small in the observed regime and dominant in the one the decision concerns; (iii) a prediction that holds only in a limit no real system approaches and that provably has no finite analogue, so there is no de-idealization to walk back to; (iv) a model whose recommendation, once implemented, falsifies its own assumption about fixed behaviour — the intervention works by breaking the thing the model held constant; (v) a model that gets the right headline number because two errors compensate, where fixing one of them makes the number worse; (vi) an assumption nobody on the team can justify, inherited from a parent model where it once had a robustness argument — does an account have to be genealogical, or may it judge assumptions only on their present relation to the model, the question and the target; (vii) exploratory models that deliberately have no target system at all, where "false" seems to lose its anchor.

  Two further things I especially want. First, flag any pair of desiderata you suspect cannot be jointly satisfied — I have two candidates in mind, one pairing the demand to grade assumptions prospectively and without track record against any criterion that makes predictive success the test, the other pairing robustness-under-de-idealization with the milder demand that legitimately fixing an error shouldn't make the model worse; tell me whether those are real conflicts or whether I've confused two senses of something, and whether there are deeper ones I haven't seen. Second, tell me which single requirement excludes the most candidate accounts, and whether the way I've framed my purpose — a triage tool for modellers — has already begged the question in favour of one of the views I gestured at. A short table scoring three or four of those views against the final list is fine, but keep the weight on the criteria and their motivating cases.
reasoning: |-
  Okay, the user is part of a public-health modeling team and needs to give a seminar on distinguishing between legitimate idealizations and wrong assumptions. They've encountered a situation where a reviewer criticized their model's contact structure as "the wrong kind of false," leading to confusion within the team. They've looked into philosophical literature but found it lacking practical guidance. Their main request is for a set of criteria that a working modeler can use to triage assumptions before validation data is available, along with handling their specific hard cases.

  First, I need to understand the core problem. The user isn't looking for a philosophical debate but actionable criteria to prioritize which assumptions to address first. Their hard cases highlight real-world modeling dilemmas, like computational limits, interpolation vs. extrapolation, and self-falsifying predictions. 

  The user also wants to identify any conflicting desiderata. They mentioned two potential conflicts: prospective assessment without track record vs. predictive success as a test, and robustness under de-idealization vs. not worsening the model when fixing errors. I need to evaluate if these are genuine conflicts or misunderstandings. Additionally, they want to know which requirement disqualifies most existing accounts and if their framing biases towards a particular view.

  Starting with desiderata, each must be motivated by a case and tagged as non-negotiable or preference. Let's list them:

  1. **Purpose-Relativity (Non-negotiable)**: An assumption's legitimacy depends on the model's purpose. For example, frictionless planes are fine for studying motion but not for braking systems. Motivated by cases (ii) and (iv), where an assumption benign in one context is malignant in another.

  2. **Prospective Assessability (Non-negotiable)**: Must be usable pre-deployment without validation data. Case (iv) with self-falsifying interventions requires this, as post-hoc validation is too late.

  3. **Path-Sensitivity (Non-negotiable)**: How the assumption was made matters. Case (vi) with inherited assumptions needs scrutiny; was it arbitrary or justified by past robustness? This addresses genealogical concerns without requiring full history.

  4. **Error Transparency (Preference)**: Assumptions should make their inaccuracies detectable. Case (v) with compensating errors is problematic because it hides flaws. But this might be negotiable if the model still works for its purpose.

  5. **Controllable Scope (Non-negotiable)**: Limits of validity should be identifiable. Case (ii) requires knowing when extrapolation fails. Critical to avoid misuse.

  6. **Resource-Awareness (Preference)**: Acknowledges computational/data constraints. Case (i) where de-idealization isn't feasible practically. Some camps might see this as essential, others as pragmatic.

  7. **Output Robustness (Non-negotiable)**: Key outputs shouldn't be overly sensitive to minor assumption changes. Case (v) where fixing one error worsens predictions, indicating fragility. Non-negotiable for reliable models.

  8. **Capacity Isolation (Preference)**: Assumptions should isolate real mechanisms. Motivated by case (iii) with no finite analogue, but not all models can do this. More aligned with certain philosophical views.

  Now, addressing conflicts. The first pair: prospective assessment without track record vs. predictive success. This is a real conflict because predictive success is retrospective, while prospective needs proxies like robustness checks. The second pair: robustness under de-idealization vs. not worsening when fixing errors. Not a conflict if de-idealization is done carefully; worsening might indicate the original model was fragile, which is a red flag.

  The most disqualifying requirement is **Prospective Assessability**. Many philosophical accounts rely on post-hoc validation, which doesn't help modelers pre-deployment.

  The user's framing as a triage tool biases towards **Adequacy-for-Purpose** and **Path-Sensitivity**, as they focus on immediate decision-making and assumption genealogy.

  Handling the hard cases:
  - (i) Resource-Awareness: Legitimacy depends on practical constraints.
  - (ii) Controllable Scope: Must delineate where the assumption holds.
  - (iii) Capacity Isolation or accept as a useful fiction if outputs are robust.
  - (iv) Purpose-Relativity: Model's success might invalidate it, but if the purpose was to trigger change, it's legitimate.
  - (v) Output Robustness: Compensating errors are risky; need sensitivity analysis.
  - (vi) Path-Sensitivity: Inherited assumptions need re-evaluation based on current context.
  - (vii) Exploratory models are out of scope unless purpose is exploration.

  Finally, the table comparing views shows that Adequacy-for-Purpose and Path-Sensitive views score best on the desiderata, while others fall short on prospective assessability or path sensitivity.
answer: |-
  Below is a specification of desiderata for an account of legitimate idealization in transmission modeling, designed for practical triage. Each requirement is motivated by a real-world case (including your hard cases), tagged as **non-negotiable** (essential for any useful account) or **preference** (aligned with specific philosophical camps), and annotated with the motivating example or conflict. The criteria prioritize *prospective assessment* (judging assumptions before use/validation) and *actionable guidance* for modelers under uncertainty.

  ---

  ### **Desiderata for Legitimate Idealization in Transmission Modeling**
  1. **Purpose-Relativity**  
     *Requirement:* Legitimacy depends on the model's *specific decision-support purpose* (e.g., predicting peak hospitalizations vs. optimizing lockdown timing).  
     *Motivation:* Cases (ii) and (iv). An assumption benign for interpolation (ii) becomes malignant for extrapolation; an assumption falsified by successful interventions (iv) may still be legitimate if the goal was to trigger that falsification.  
     *Status:* **Non-negotiable**. A "one-size-fits-all" standard is useless for triage.  
     *Hard Cases Handled:* (ii), (iv), (vii) (exploratory models fall under "purpose" of theoretical exploration).

  2. **Prospective Assessability**  
     *Requirement:* The account must enable judgment *before validation* or historical data, using available evidence (e.g., mechanistic plausibility, sensitivity analysis, domain expertise).  
     *Motivation:* Your core problem: decisions are made weeks/months before validation. Reliance on predictive success (e.g., "f-twist") is retrospective and irrelevant pre-deployment.  
     *Status:* **Non-negotiable**. Without this, the account fails as a triage tool.  

  3. **Path-Sensitivity**  
     *Requirement:* The legitimacy of an assumption depends on *how it was chosen* (e.g., deliberate simplification vs. convenience), not just its current form. Includes genealogy (e.g., robustness in a parent model) but requires re-testing in the new context.  
     *Motivation:* Case (vi) (inherited assumptions). An arbitrary assumption from a legacy model is riskier than one with documented robustness, but must be re-evaluated against the current purpose.  
     *Status:* **Non-negotiable**. Genealogy alone is insufficient, but ignoring it invites cargo-cult modeling.  
     *Hard Cases Handled:* (vi).  

  4. **Error Transparency**  
     *Requirement:* The assumption must make its inaccuracies *detectable and quantifiable* (e.g., via sensitivity analysis, error bounds, or conflict with known mechanisms).  
     *Motivation:* Case (v) (compensating errors). If errors mask each other, the model is opaque and unfalsifiable; legitimate idealizations should "fail loudly."  
     *Status:* **Preference** (associated with "de-idealization" and "capacity isolation" views). Some views (e.g., "as-if" rationality) tolerate opaque assumptions.  

  5. **Controllable Scope**  
     *Requirement:* The limits of the assumption's validity must be *identifiable and communicable* (e.g., "this holds when X << Y" or "breaks down under superspreading").  
     *Motivation:* Case (ii) (interpolation vs. extrapolation) and (iii) (no finite analogue). Without scope control, extrapolation is dangerous; even "in principle" de-idealizable assumptions (iii) can be legitimate if their boundaries are known.  
     *Status:* **Non-negotiable**. Essential for preventing misuse.  
     *Hard Cases Handled:* (ii), (iii).  

  6. **Resource-Awareness**  
     *Requirement:* Legitimacy incorporates practical constraints (data, compute, time). An idealization "de-idealizable in principle" but not in practice (e.g., due to unidentifiable parameters) may still be legitimate if alternatives are infeasible.  
     *Motivation:* Case (i) (computationally infeasible de-idealization). Demanding impractical fixes ignores real-world tradeoffs.  
     *Status:* **Preference** (pragmatic/adequacy-for-purpose views). "Capacity isolation" views often reject this.  

  7. **Output Robustness**  
     *Requirement:* Key model outputs (e.g., policy rankings, direction of effects) should be *low-sensitivity* to relaxing the assumption. High sensitivity flags a "worry first" assumption.  
     *Motivation:* Case (v) (compensating errors). Fixing one error worsens predictions if outputs are fragile. Also addresses (i): if outputs are robust, computational limits matter less.  
     *Status:* **Non-negotiable**. Core to triage (identifies critical assumptions).  

  8. **Capacity Isolation**  
     *Requirement:* The assumption should isolate a *real causal factor* (e.g., contact heterogeneity) without introducing distortions that swamp the target mechanism.  
     *Motivation:* Case (iii) (no finite analogue). Assumptions with no real-world counterpart (e.g., infinite-population limits) can still isolate a capacity (e.g., herd immunity thresholds).  
     *Status:* **Preference** (associated with Cartwright-style "capacities" views). Adequacy-for-purpose views may reject this as too strict.  

  ---

  ### **Conflicting Desiderata**
  - **Prospectivity vs. Predictive Success:**  
    Your first candidate conflict (prospective assessment vs. predictive success as a test) is **genuine and irreconcilable**. Predictive success is inherently retrospective; prospectivity requires proxies (e.g., sensitivity analysis, mechanistic coherence). *Resolution:* An account must abandon predictive success as a *prospective* criterion. Output Robustness (#7) is a viable proxy.  

  - **Robustness-under-De-idealization vs. "No Worsening":**  
    Your second conflict (demanding de-idealization improves the model vs. allowing fixes that worsen outputs) is **not a true conflict**. De-idealization should *reduce error*, but if outputs worsen (case v), it signals the original model was *fragile* due to compensating errors—a red flag. *Resolution:* Output Robustness (#7) and Error Transparency (#4) jointly address this: legitimate idealizations should not rely on error compensation.  

  - **Deeper Conflict:**  
    **Purpose-Relativity vs. Capacity Isolation** creates tension. Purpose-relativity permits assumptions that are "wrong" but adequate for a goal (e.g., homogeneous mixing for coarse estimates). Capacity isolation demands mechanistic fidelity. *Example:* Case (iii) models (no finite analogue) may serve a purpose (e.g., qualitative insight) but fail capacity isolation. *Resolution:* Non-negotiable criteria (#1–3,5,7) constrain purpose-relativity, avoiding "anything goes."  

  ---

  ### **Which Requirement Excludes the Most Accounts?**
  **Prospective Assessability (#2)** excludes nearly all philosophical accounts. Most (e.g., de-idealization, f-twist, and even adequacy-for-purpose) rely on *retrospective* validation or "closeness to truth." For modelers, this is useless pre-deployment. Only *path-sensitive* and *purpose-relative* accounts (e.g., Wimsatt’s robustness heuristics) partially survive, but they lack systematic triage.  

  ---

  ### **Does Your Framing Beg the Question?**
  Yes, your framing **favors the "adequacy-for-purpose" and "path-sensitive" views**:
  - **Adequacy-for-purpose** is centered (Purpose-Relativity #1, Resource-Awareness #6).  
  - **Path-sensitive** views (e.g., Winsberg’s genealogical account) align with Path-Sensitivity (#3).  
  However, you *don’t* assume these views wholesale. By demanding Output Robustness (#7) and Controllable Scope (#5), you impose stricter criteria than typical "adequacy" accounts.  

  ---

  ### **Scorecard: How Major Views Fare Against Desiderata**
  | **Philosophical View**       | **Prospective Assessability?** | **Path-Sensitivity?** | **Output Robustness?** | **Handles Hard Cases?** |  
  |------------------------------|--------------------------------|------------------------|------------------------|--------------------------|  
  | **Adequacy-for-Purpose**     | Partial (needs retrospective checks) | ❌                      | ❌                      | Handles (i,ii,iv,vi,vii) |  
  | **De-idealization**          | ❌ (requires "walking back")    | ❌                      | ✅                      | Fails (i,iii,v)          |  
  | **Capacity Isolation**       | ❌ (assumes truth-tracking)     | ❌                      | ✅                      | Fails (iii,vi,vii)       |  
  | **Path-Sensitive (e.g., Winsberg)** | ✅                             | ✅                      | ⚠️ (not explicit)       | Handles (vi,vii)         |  
  | **Your Desiderata**          | ✅                              | ✅                      | ✅                      | Handles (i–vii)          |  

  **Key:** ✅ = Satisfied; ⚠️ = Partially; ❌ = Not satisfied.  

  ### **Summary for Your Talk**
  - **Core Message:** Legitimate idealizations are purpose-relative, prospectively assessable, and output-robust. "Wrong" assumptions lack controllable scope or introduce opaque fragility.  
  - **Triage Protocol:**  
    1. Anchor to the *decision* (Purpose-Relativity).  
    2. Flag assumptions with poor Path-Sensitivity (e.g., "inherited but untested").  
    3. Test Output Robustness via sensitivity analysis.  
    4. Reject assumptions that fail Controllable Scope for the target regime.  
  - **Why the Reviewer was Vague:** "Wrong kind of false" likely conflates *scope* (e.g., homogeneous mixing fails for superspreading) and *fragility* (outputs sensitive to contact structure). Your criteria make this explicit.
