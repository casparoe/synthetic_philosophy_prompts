answer: |-
  ## The Priority Ledger
  Minister Aris traced the embossed Ministry of Collective Welfare seal on the Priority Index certification report. Outside his window, the sprawling, efficient city-state of Harmonia hummed. Its Stability rested on the Priority Principle: resources flowed not just to maximize good, but to weight it heavily towards the worst-off. "It shields us," Aris declared to his anxious reformist Director, Lin, and the skeptical Auditor-General, Theron. "Level someone down to misery just to match another? Our Index *always* falls. It refuses to call suffering equality progress. That's our moral bedrock. No egalitarian traps for us."

  Lin nodded fervently. "Precisely, Minister. Which is why we *must* implement my Life-Path Adjustment Programme. We weight *person-years*, not whole lives – lifespans differ too wildly! And we must make the weighting function *more concave*." She tapped her tablet, projecting g(w) = √(w). "This amplifies gains for the truly wretched years. A citizen enduring a year at well-being 1 gains infinitely more from an extra unit than one coasting at 50. My reforms target those depths."

  Theron grunted, scanning preliminary audit logs. "Depth charges often blow holes in hulls, Director. Verify the weighting inputs, Aris. Your signature binds the State."

  Days later, Aris found Senior Analyst Kael hunched over glowing ledgers, face pale. "Minister... the Lena case. In the Programme simulation."

  Aris leaned in. Kael pointed to digital entries:

  **CITIZEN: LENA**
  **Pre-Adjustment Life-Path:**
  *   Year 1-40: Well-being = 10
  *   Year 41-80: Well-being = 30
  *   **Total Well-being (Sum): 40**
  *   **Priority Index (Σ √wᵢ): √10 + √30 ≈ 3.162 + 5.477 ≈ 8.639**

  **Post-Adjustment (Leveling Intervention):**
  *   Year 1-40: Well-being = 19
  *   Year 41-80: Well-being = 19
  *   **Total Well-being (Sum): 38**
  *   **Priority Index (Σ √wᵢ): √19 + √19 ≈ 4.359 + 4.359 ≈ 8.718**

  Aris stared. Total well-being fell. Lena gained nothing; her later, happier years were sacrificed to boost her earlier, worse ones. No one else was affected. Yet the Priority Index *rose*. The bedrock principle cracked under a single life.

  "The Leveling-Down... it *improved* the Index?" Aris whispered.

  "Under person-year weighting with √(w), yes," Kael confirmed, voice tight. "Lin’s proposed *more* concave function – say, log(w) – makes it worse: ≈5.70 versus ≈5.89. Unequal lives magnify it. We’re rewarding... internal sabotage."

  Theron materialized, radiating cold fury. "Aris. Your vaunted immunity is breached. Within a *single* life. Certify this Programme based on a rising Index enabling such pointless loss? That signature approves theft from Lena’s future to *simulate* a phantom gain for her past. It’s obscene. Cancel the Programme. Recall the reports."

  Lin burst in, eyes blazing. "No! This is a quirk of *temporal* slicing! Prioritarians care about whole *persons*, not dissected years! We should weight *whole-life totals*! Lena’s sum fell from 40 to 38, so √40 ≈ 6.325 > √38 ≈ 6.164. The Index falls correctly! Person-years were a practical tool, not the moral unit!"

  Theron wheeled on her. "Practical? Harmonia has citizens living 40 years and 90 years! Compare them fairly! Your whole-life weighting says adding one decent year to a 40-year life (total √41≈6.403) is *less* valuable than adding it to a 90-year life already totalling √90≈9.487? That punishes the short-lived! Person-years solved *that*."

  "It solved one problem by creating a monstrous one!" Lin shot back. "Lena’s case shows person-years allow us to 'improve' the Index by harming someone and helping *no one*! Is that Harmonia’s Stability?"

  "Perhaps the sum is wrong," Aris murmured, clutching the edge of Kael’s desk. "Maybe a life’s good isn’t just the sum of its years. Maybe the *narrative*, the trajectory..."

  Theron cut him off. "Philosophy later, Minister. Your signature is required *now* on the Annual Priority Index Report, which includes the Programme’s projected Index gains using person-years and √(w). Lena’s case is buried deep in Annex 7B. But it’s there. Do you certify the State’s official measure, knowing it endorses this? Or do you halt Lin’s Programme and trigger a fiscal crisis by admitting our core metric is flawed?"

  Silence descended, thick with the hum of Harmonia and the phantom arithmetic echoing in their minds: √10 + √30 < 2√19. A gain built on sand. A loss disguised as progress. Lin’s reform promised amplified compassion for the depths of suffering. Theron’s audit revealed it could turn a life into a ledger where stealing joy from tomorrow could look like a gift to yesterday.

  Aris looked at the projected report on the main screen. The overall Priority Index trendline climbed steeply, powered by Lin’s Programme. Thousands of simulated "Lenas" showed gains. Stability, prosperity, progress – quantified. Approved. One annex, one case, threatened to unravel it all. To admit the metric could celebrate internal leveling-down was to shatter the Ministry’s foundational claim.

  He picked up the stylus. The embossed seal on the certification page felt cold. Theron watched, stone-faced. Lin held her breath. Kael looked away. The numbers on Lena’s ledger glowed: 10 + 30 = 40 → 8.639. 19 + 19 = 38 → 8.718. Harmonia hummed on, trusting its weights and sums.

  Aris touched the stylus to the signature pad. He paused, the cursor blinking over the empty field. The city’s lights blurred outside the window, reflections dancing on the screen showing the rising Index. He drew a slow breath, the weight of the decision crushing the neat equations in his mind. His hand moved.
