  Then there's the ethics question: judging historical figures by today's morals. The user wants to know where Plutarch would stand. Plutarch was aware of cultural differences; he compared Greeks and Romans, noting different customs. But he also believed in universal virtues like justice and temperance. He'd probably distinguish between cultural practices (which vary) and core ethics (which don't). For example, he might criticize a historical figure for cruelty but understand context-specific practices. He'd expect moral progress but not condemn past figures for not knowing better.

