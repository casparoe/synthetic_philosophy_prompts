  First, I need to recall Plutarch's method. He wrote Parallel Lives, comparing Greek and Roman figures, emphasizing moral character over historical accuracy. He looked for telling details—how someone treated a servant, a casual remark—to reveal true character. The user also brought up the modern problem of manufactured personas. How would Plutarch deal with Instagram or PR-crafted images?

