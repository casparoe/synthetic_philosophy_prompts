prompt: |-
  so my group chat (very EA-adjacent, lots of wonk) has been going around on discount rates again, and I keep reaching for an analogy that I now suspect is doing all the work: distance in time is just like distance in space. The version I used: nobody thinks the welfare of someone in another country counts for less just because they're far away, so caring less about someone in 2200 merely because they're later is the same species of parochialism -- a -ism with a worse name -- and the upshot is that pure time preference is zero, and the only discounting that survives is for the chance the benefit never lands (extinction, collapse, the whole chain just not arriving) and for the fact that future people will probably be richer, so a unit of consumption is worth less to them. That's the decomposition everyone quotes, rate = pure preference + elasticity times growth, and the entire fight is whether the first term is 0 or something like a couple percent.

  Someone pushed back and i think he's right that I was cheating: the analogy proves too much, because basically everyone accepts spatial partiality -- you give to your local food bank, you care more about your own countrymen, nobody calls you a bigot -- so either it licenses nothing (spatial discounting is fine, so temporal discounting is fine) or it only has teeth if you've already bought a very demanding impartiality, in which case the analogy isn't what's carrying the conclusion.

  But I also think space has features that time just doesn't, and I can't tell which of them matter: spatial distance is symmetric and traversable, and the people there exist whether or not I do anything, whereas the future is causally downstream of us, the near future contains us-in-thirty-years, and who exists later partly depends on what we do now. There's also no market with the future -- nobody in 2200 can compensate us or trade with us -- so whatever an interest rate is measuring, it isn't an exchange rate between present and future people. And I have a suspicion that a lot of what looks like pure time preference in cost-benefit work is actually probability-of-non-arrival wearing a hat. One more thing i keep tripping on: caring less about your own headache next Tuesday feels like a different animal from caring less about a stranger's headache in 2200, and I don't know if the analogy is even aimed at both or only at the second.

  Can you audit this properly? I want the correspondence table -- what plays the role of distance, of the stranger, of the transport cost, of the border -- then which disanalogies actually bite on the conclusion I wanted (rho = 0; and if it isn't 0, what it's allowed to be) versus which are trivia. Especially: does the causal-downstream-ness of the future cut for my conclusion or against it, and does the no-reciprocity point turn out to be an argument for discounting (invest now, hand over more later) or against it? And if the space analogy is bad, is there a better one -- future generations as a bequest to a child who wouldn't exist otherwise, or as your own seventy-year-old self, or something else -- or is the honest answer that no analogy should be doing this work?
reasoning: |-
  Okay, the user is grappling with discount rates in their EA-adjacent group chat. They've been using a space-time analogy to argue against pure time preference but got pushback because spatial discounting is socially accepted while temporal isn't. Now they're questioning if the analogy holds and want a thorough audit.

  First, I need to unpack their core analogy: "distance in time = distance in space." They claim that just as we shouldn't value distant people less, we shouldn't discount future people merely due to temporal distance. The counterargument notes spatial partiality is accepted (e.g., donating locally), so the analogy either fails or requires prior commitment to impartiality.

  Hmm, the user's deeper struggle seems twofold: 1) Is the analogy fundamentally flawed? 2) What distinct features of time actually matter for discounting? They listed asymmetries like causality, non-simultaneous existence, and lack of reciprocity. 

  Let me systematically compare dimensions. Spatial distance allows reciprocity - future generations can't trade with us. Space has symmetry (A to B = B to A); time doesn't. Future existence is contingent on present actions - unlike spatially distant people who exist independently. These aren't trivial; they directly challenge equating spatial and temporal discounting.

  On causality: The future being downstream could actually strengthen the case for low discounting. If our actions create future people, we're responsible for their welfare - arguably raising, not lowering, their moral weight. The "no reciprocity" point cuts against high discounting too. Since they can't compensate us, fairness demands we don't exploit our position - echoing Ramsey's "polite expression of rapacity."

  For pure time preference (ρ), the analogy's weakness doesn't kill the ρ=0 argument. Philosophers like Parfit base it on impartiality: temporal location is as arbitrary as geography for moral worth. The analogy might not carry the load, but the ethical principle stands. 

  Better analogies? Bequests work: leaving wealth to unborn grandchildren mirrors intergenerational transfer. Or consider your future self - we rarely discount our own distant future pains. Both avoid spatial pitfalls while capturing the asymmetry.

  Final take: The space-time analogy is leaky but not useless. It fails at reciprocity and symmetry, yet highlights how both distances are morally arbitrary. Drop it for bequest/future-self frames. And yes - much "pure" time preference masks hidden risk discounting. Tell the user to focus on that in debates.
answer: |-
  Here's a full audit of your analogy, its disanalogies, and their implications for discount rates – plus better frameworks:

  ### Correspondence Table: Space vs. Time Analogy
  | **Concept**          | **Spatial Analogy**              | **Temporal Analogy**              |
  |----------------------|----------------------------------|-----------------------------------|
  | **Distance**         | Physical miles/kilometers        | Years/centuries                   |
  | **"Stranger"**       | Person in another country        | Future person (2200)              |
  | **"Transport Cost"** | Trade barriers, shipping fees    | Risk of benefit not arriving (extinction, institutional collapse) |
  | **"Border"**         | National/regional boundaries     | Present/future boundary (causal asymmetry) |
  | **"Reciprocity"**    | Mutual trade, aid agreements     | **Nonexistent** (future can't compensate present) |
  | **"Existence"**      | Simultaneous existence (ontological symmetry) | **Non-simultaneity** (future contingent on present actions) |

  ### Critical Disanalogies & Their Bite on ρ=0
  1. **Causal Asymmetry (Future is Downstream)**:
     - **Nature**: Present actions create/destroy future persons and their welfare. Space lacks this dependency.
     - **Bite**: **Strengthens case for ρ=0**. If our choices *determine* who exists and their conditions, we incur *stronger* obligations to them (Parfit's "Non-Identity Problem" → *reduces* justification for discounting). We're architects, not neighbors.

  2. **Non-Simultaneity & Reciprocity**:
     - **Nature**: Future people cannot trade, threaten, or reciprocate. Spatial actors can.
     - **Bite**: **Undermines market-based justifications for ρ > 0**. Interest rates reflect *current* trade-offs between present and future *within one lifetime*. Applying them intergenerationally is a category error (Sidgwick: "sacrifice for posterity... without reciprocation"). *Supports* ρ=0 as fairness demands we don't exploit power imbalance.

  3. **Existence Contingency**:
     - **Nature**: Giving birth vs. not, emissions policies, etc., change *who* exists in 2200. No spatial parallel.
     - **Bite**: **Neutral/Complex**. Affects *how* we value future people (average vs. total utilitarianism) but doesn't license pure time preference. If anything, the "vulnerability" of future identities to our actions heightens responsibility.

  4. **Symmetry**:
     - **Nature**: Space: I can visit Kenya; Kenya can visit me. Time: I can't visit 2200; 2200 can't visit me.
     - **Bite**: **Weak against ρ=0**. Asymmetry doesn't justify *discounting welfare* – only affects *feasibility of help*. (Analogy: I discount a starving child's pain because I can't feed them? No.)

  ### Your Headache Distinction is Key
  - **Your headache next Tuesday**: Discounting this *is* irrational (hyperbolic discounting). We consider it a cognitive bias, not normative.
  - **Stranger's headache in 2200**: The core debate. ρ=0 argues temporal location is *morally irrelevant* like spatial distance. But spatial partiality is tolerated...
  - **Resolution**: The analogy works **only for impartial welfare comparisons**. Spatial partiality is pragmatically accepted (e.g., transaction costs), but *not a moral ideal*. EA ethics rejects it: giving to your local food bank *is* less impartial than giving to global charities. Thus, the analogy holds **if you accept impartiality as an ethical starting point**. If not, it fails.

  ### Does "Probability of Non-Arrival" Wear a Hat?
  **Yes, routinely.** Many "discount rates" in policy (e.g., OMB's 1-3%) embed:
  - Catastrophe risk (nuclear war, asteroid)
  - Institutional decay (will this program survive?)
  - Technological/moral obsolescence (will cash matter?)
  Calling this ρ is misleading – it's δ (risk discounting). Stern Review (ρ=0.1%) vs. Nordhaus (ρ=3%) debates often conflate ρ with hidden δ.

  ### Better Analogies Than Space-Time
  1. **Bequest to Unborn Grandchildren**:
     - You save now to enrich lives of people you'll never meet, who wouldn't exist without your choices. Directly captures:
       - Causal responsibility
       - Lack of reciprocity
       - Contingent existence
     - *Upshot*: Justifies low/no pure time preference – we discount for *their* wealth (η*g), not our impatience.

  2. **Your Future Self** (especially distant-future):
     - Caring less about your dementia at 85 vs. a headache today is irrational. Extrapolate this to "humanity's future self."
     - *Upshot*: Rejects pure time preference at the species level. (But limited: doesn't address non-identity.)

  3. **Trusteeship**:
     - We are trustees of civilization for future beneficiaries. Trustees can't discount beneficiaries' welfare due to "delivery lag."
     - *Upshot*: ρ=0 is default; discounting requires exceptional justification.

  ### Conclusion & Practical Upshots
  - **Your core ethical argument holds**, but the space-time analogy is fragile. Use **bequest/trusteeship models** instead.
  - **Causal asymmetry and non-reciprocity *support* ρ=0**: They make discounting *less* defensible, not more.
  - **Pure time preference (ρ) should be near zero** (0%-0.5%) on impartial grounds. Any ρ > 0 is:
    - A cognitive bias (when applied intrapersonally), or
    - An expression of selfishness/parochialism (interpersonally), or
    - A mislabeled risk premium (δ).
  - **Fight the conflation**: Demand decomposition. When opponents cite high discount rates, ask: "What share is *pure time preference* vs. risk vs. wealth growth?"

  **Best line for your chat**: "Spatial discounting is tolerated pragmatics; temporal discounting of future welfare is unjustifiable timeism. We owe the future *more* consideration, not less – they're hostages to our choices."
