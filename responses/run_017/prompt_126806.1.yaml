  - Evidential Decision Theory (EDT): Considers the evidence provided by the action. If you pay, it's evidence that the predictor was correct, and in similar situations, being a payer leads to better outcomes. Here, paying might be rational if you think it makes you more likely to be predicted as a payer in future, but this is a one-off.
