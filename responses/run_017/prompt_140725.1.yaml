answer: |-
  Here is the complete take-home final question package, designed to meet your specifications and push students beyond surface-level reasoning.

  **Final Exam Question: Population Ethics Analysis**  
  **Time Allowed:** 90 minutes  
  **Closed Book:** All necessary definitions are provided below.  
  **Total Marks:** 30  

  ---

  ### Background  
  A *population* is a set of individuals, each with a numerical *welfare level*. Welfare is interpersonally comparable on a **ratio scale** (e.g., welfare 50 is half as good as welfare 100). The **neutral level** is 0: a life at 0 is neither worth living nor avoiding. Lives above 0 are *worth living*; lives below 0 are *not worth living*.  
  - Let \(n\) be the number of people in a population.  
  - Let \(T\) be the sum of welfare levels in the population.  
  - Let \(A = T/n\) be the average welfare.  

  **Repugnant Conclusion (RC):** For a population \(A^*\) with 10 billion (\(10^{10}\)) people all at welfare 100, and for any \(\epsilon > 0\) (no matter how small), there exists some population size \(N\) such that \(N\) people at welfare \(\epsilon\) is *better than* \(A^*\).  

  **Principles to Evaluate:**  
  1. **Variable-Weighted View (\(V_\alpha\)):** \(V_\alpha = A \cdot n^{\alpha}\), where \(0 \leq \alpha \leq 1\).  
     - \(\alpha = 1\): Total utilitarianism (\(V_1 = T\)).  
     - \(\alpha = 0\): Average utilitarianism (\(V_0 = A\)).  
     - \(\alpha = 0.5\): Geometric mean of total and average.  
  2. **Lexical Threshold View (\(\tau\)):** Fix a threshold \(\tau > 0\).  
     - Population \(P\) is better than \(Q\) if \(P\) has **fewer people below \(\tau\)**.  
     - If tied, \(P\) is better than \(Q\) if \(P\) has **greater total welfare \(T\)**.  
  3. **Critical-Level Utilitarianism (\(c\)):** The value of a life at welfare \(w\) is \((w - c)\), where \(c > 0\) is a fixed "critical level." The value of a population is the sum of \((w_i - c)\) over all individuals.  

  ---

  ### Tasks  
  **1. Variable-Weighted View (\(V_\alpha\))**  
  - For \(\alpha = 0.5\) and \(\epsilon = 0.01\), calculate the smallest \(N\) such that \(N\) people at \(\epsilon\) is better than \(A^*\) (10 billion at 100) under \(V_{0.5}\).  
  - Explain whether reducing \(\alpha\) (e.g., to 0.1) "solves" the RC or merely makes \(N\) astronomically large. Is avoiding RC by requiring \(N > 10^{80}\) (more than atoms in the universe) a philosophically satisfactory solution? *(8 marks)*  

  **2. Average Utilitarianism (\(\alpha = 0\))**  
  - Show that \(V_0\) (average utilitarianism) deems a population of 2 people at welfare 101 better than \(A^*\) (10 billion at 100).  
  - Suppose we add one person to \(A^*\) with welfare 99.9 (a life worth living, but below \(A^*\)’s average). Show that this makes the outcome *worse* than \(A^*\) under \(V_0\). What trade-off does this reveal? *(6 marks)*  

  **3. Lexical Threshold View (\(\tau\))**  
  - Assume \(\tau = 100\). Explain why \(A^*\) (all at 100) avoids the RC for any \(\epsilon < 100\).  
  - Now consider \(\tau = 100\) and \(\delta = 0.01\). Show that for population \(B^*\): \(10^{12}\) people at 100.01, there exists some \(M\) such that \(M\) people at \(\epsilon = 100.02\) is better than \(B^*\).  
  - Explain the "cliff effect": Why does changing 200 billion lives from 99.999 to 100.001 transform an outcome from "worse than \(A^*\)" to "better than \(A^*\)"? Is this more or less repugnant than the RC? *(8 marks)*  

  **4. Critical-Level Utilitarianism (\(c\))**  
  - Set \(c = 1\). Explain why there is **no** RC for \(\epsilon < 1\) (e.g., \(\epsilon = 0.5\)).  
  - For \(\epsilon > c\) (e.g., \(\epsilon = 1.5\)), show how the RC reemerges: Find \(N\) such that \(N\) people at 1.5 is better than \(A^*\).  
  - What is the cost of this view? Illustrate by comparing:  
    - (a) 1 million people at \(c - 0.1 = 0.9\) (lives worth living).  
    - (b) 1 person at \(-100\) (a life not worth living).  
    Which does the view prefer? *(5 marks)*  

  **5. Synthesis**  
  What must be sacrificed to avoid the RC entirely? Choose **one** of the following and defend your answer using examples from above:  
  - **Completeness** (all populations can be ranked).  
  - **Unbounded aggregation** (large populations can always outweigh quality losses).  
  - **Continuity** (small welfare changes never cause large moral shifts).  
  - **The value of barely-positive lives** (lives above 0 are not always benefits).  
  *(3 marks)*  

  ---

  ### Model Answer (998 words)  
  **1. Variable-Weighted View (\(V_\alpha\))**  
  For \(A^*\): \(n_A = 10^{10}\), \(A_A = 100\), so \(V_{0.5} = 100 \cdot (10^{10})^{0.5} = 100 \cdot 10^5 = 10^7\).  
  For \(N\) people at \(\epsilon = 0.01\): \(V_{0.5} = 0.01 \cdot N^{0.5}\).  
  Set \(0.01 \cdot N^{0.5} > 10^7\) → \(N^{0.5} > 10^9\) → \(N > (10^9)^2 = 10^{18}\).  
  Smallest \(N = 10^{18} + 1\) (1 quintillion).  

  Reducing \(\alpha\) pushes \(N\) farther but **does not avoid RC**. For \(\alpha = 0.1\), \(V_{0.1} = 100 \cdot (10^{10})^{0.1} = 100 \cdot 10^1 = 1000\) (since \(10^{10 \times 0.1} = 10^1\)). For \(N\) at \(\epsilon = 0.01\): \(0.01 \cdot N^{0.1} > 1000\) → \(N^{0.1} > 10^5\) → \(N > (10^5)^{10} = 10^{50}\). This is larger than atoms in the universe (\(≈10^{80}\)), but **RC still holds** for any \(\epsilon > 0\). Requiring \(N > 10^{80}\) is a **dodge**—it uses physical impossibility to mask the *theoretical* repugnance of trading high welfare for vast numbers of barely-positive lives.  

  **2. Average Utilitarianism (\(\alpha = 0\))**  
  - For 2 people at 101: \(V_0 = 101\). For \(A^*\): \(V_0 = 100\). Since \(101 > 100\), it is better. This prioritizes *mean welfare* over total welfare, dismissing the massive welfare loss from reducing 10 billion lives from 100 to 101.  
  - Adding one person to \(A^*\): New \(n = 10^{10} + 1\), new \(T = (100 \cdot 10^{10}) + 99.9 = 10^{12} + 99.9\), new \(A = \frac{10^{12} + 99.9}{10^{10} + 1} ≈ 99.999999\). Since \(99.999999 < 100\), the outcome is worse. **Trade-off:** A life worth living (99.9 > 0) *reduces* value by lowering the average, violating the intuition that adding good lives should not harm.  

  **3. Lexical Threshold View (\(\tau\))**  
  - At \(\tau = 100\), \(A^*\) has 0 people below \(\tau\). For \(N\) at \(\epsilon = 0.01 < 100\), *all* \(N\) are below \(\tau\), so \(N\) is worse than \(A^*\) (which has 0 below \(\tau\)). **RC is avoided.**  
  - For \(B^*\): \(10^{12}\) people at 100.01 (all ≥ \(\tau = 100\), so 0 below \(\tau\)). For \(M\) at \(\epsilon = 100.02\): also 0 below \(\tau\). Tie on the first criterion → compare total welfare. \(T_{B^*} = 10^{12} \cdot 100.01 = 1.0001 \cdot 10^{14}\). \(T_{M} = M \cdot 100.02\). Set \(M \cdot 100.02 > 1.0001 \cdot 10^{14}\) → \(M > \frac{1.0001 \cdot 10^{14}}{100.02} ≈ 9.998 \cdot 10^{11}\). Thus, \(M = 9.998 \cdot 10^{11} + 1\) suffices. **RC relocates:** For any \(\delta > 0\), there is a repugnant conclusion at welfare \(\tau + \delta\) (here, 100.02) requiring large \(N\).  
  - **Cliff effect:** Take \(P\): 200 billion lives at 99.999 (all below \(\tau = 100\)), so \(P\) is worse than \(A^*\) (0 below \(\tau\)). In \(Q\), the same 200 billion are at 100.001 (all ≥ \(\tau\)), so 0 below \(\tau\) → tie → compare total welfare. \(T_Q > T_{A^*}\) (since 200B × 100.001 > 0), so \(Q\) is better than \(A^*\). A **0.002 welfare increase** for a subgroup flips the outcome. This is **worse than RC** because:  
    - (i) It violates continuity (microscopic changes cause massive moral shifts).  
    - (ii) It incentivizes neglecting those just below \(\tau\) (e.g., 99.999) to avoid the "cliff penalty."  

  **4. Critical-Level Utilitarianism (\(c\))**  
  - Value of \(A^*\): \(\sum (100 - 1) = 10^{10} \cdot 99 = 9.9 \cdot 10^{11}\).  
  - For \(N\) at \(\epsilon = 0.5 < c = 1\): Value per life = \(0.5 - 1 = -0.5\). Total value = \(-0.5N\), always negative → worse than \(A^*\). **No RC for \(\epsilon < c\)** because lives below \(c\) are net harms.  
  - For \(\epsilon = 1.5 > c\): Value per life = \(1.5 - 1 = 0.5\). Set \(0.5N > 9.9 \cdot 10^{11}\) → \(N > 1.98 \cdot 10^{12}\). **RC reemerges** for \(\epsilon > c\), with \(N\) scaling inversely with \((\epsilon - c)\).  
  - **Cost:** Comparing (a) 1M at 0.9: total value = \(1M \cdot (0.9 - 1) = -0.1M\) and (b) 1 at \(-100\): value = \(-100 - 1 = -101\). Since \(-101 < -0.1M\) (for \(M > 1010\)), the view prefers **(a) 1M lives at 0.9** over **(b) one life at -100**—but both are negative. This treats lives worth living (0.9 > 0) as *worse* than some very bad lives, counterintuitively prioritizing harm reduction over creating modestly good lives.  

  **5. Synthesis**  
  To fully escape RC, we must sacrifice **unbounded aggregation**.  
  - \(V_\alpha\) and critical-level retain aggregation (large \(N\) can compensate for low welfare) and fail for \(\epsilon > \epsilon_{\text{min}}\).  
  - The threshold view sacrifices **continuity** (via the cliff) but still allows aggregation above \(\tau\).  
  - Average utilitarianism sacrifices the **value of barely-positive lives** (adding them can worsen outcomes).  
  - Incomparability (not discussed here, a fifth route) sacrifices **completeness**.  
  The core conflict: RC arises because unbounded aggregation lets \(N \to \infty\) override finite welfare losses. Rejecting this (e.g., capping \(N\)) avoids RC but faces practical dilemmas (e.g., when forced to choose between \(A^*\) and a vast population at \(\epsilon\)).  

  ---

  ### Marking Scheme (30 Total)  
  | **Task** | **Marks** | **Key Points** | **Common Errors** |
  |----------|-----------|----------------|-------------------|
  | **1.1** Calculate \(N\) for \(\alpha=0.5\) | 3 | Correct \(N = 10^{18}\) | Arithmetic errors; misapplying exponents. |
  | **1.2** Explain \(\alpha < 1\) and physical feasibility | 5 | \(N\) grows but RC remains; "dodge" is unsatisfactory | Claiming "RC avoided" without checking math; confusing physical/logical impossibility. |
  | **2.1** Compare 2 at 101 vs. \(A^*\) | 2 | \(101 > 100\) → better | Incorrect average calculation. |
  | **2.2** Added life at 99.9 worsens outcome | 4 | New \(A ≈ 99.999 < 100\) → worse; trade-off explained | Missing why adding a good life reduces value. |
  | **3.1** Avoid RC for \(\tau=100\), \(\epsilon<100\) | 2 | \(N\) has all below \(\tau\) → worse | Misunderstanding lexical priority. |
  | **3.2** Relocated RC for \(B^*\) at \(\tau + \delta\) | 3 | Correct \(M ≈ 10^{12}\); RC reappears above \(\tau\) | Using \(\epsilon < \tau\) only; not breaking ties with total welfare. |
  | **3.3** Cliff effect and comparison to RC | 3 | Explain discontinuity; judge cliff "worse" | Ignoring continuity violation; not quantifying welfare change. |
  | **4.1** No RC for \(\epsilon < c\) | 1 | Lives below \(c\) are net harms | Claiming RC avoidance without \(\epsilon < c\) condition. |
  | **4.2** RC for \(\epsilon > c\) | 2 | Correct \(N ≈ 2 \cdot 10^{12}\) | Not linking \(N\) to \((\epsilon - c)\). |
  | **4.3** Cost: Prefer (a) over (b) | 2 | (a) = -100,000; (b) = -101; (a) worse | Misvaluing \((w - c)\); not comparing magnitudes. |
  | **5** Synthesis | 3 | Chooses one sacrifice; defends with examples | Vague answers; no tie to specific tasks. |

  ---

  **Fifth Escape Route Note:** Incomparabilist views (e.g., Parfit) declare \(A^*\) and the \(\epsilon\)-population *incomparable*. This avoids RC but fails **completeness** and struggles with real choices (e.g., policy decisions forcing a comparison).  
  **Design Notes:** Welfare ratio scale ensures proportional comparisons are meaningful. Neutrality of 0 is critical for all principles. Lexical threshold tie-breaker must be specified to ensure transitivity.
