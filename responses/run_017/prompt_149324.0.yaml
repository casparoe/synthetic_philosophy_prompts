  Key constraints stand out: can't use words like "fake" or "forgery," must honor Hilda's note about sharing beauty, needs to reconcile the painting's new status while keeping community pride, and must announce new labeling without sounding like a compromise. The philosophical questions about authenticity versus perceived value are central but must be handled accessibly.

  The emotional landmines are significant. The mother threatens to walk out if certain words are used, the cousin wants the "same picture" narrative preserved, and the conservator's "authentic document of a mistake" framing risks sounding patronizing. Meanwhile, practical outcomes hang in the balance: the tourism brochure must change, but the town's attachment to "their Sonnevelt" is real.

  The speech needs to perform emotional alchemy - transforming perceived loss into layered meaning. Hilda's newly discovered note provides the perfect anchor: her focus was always on sharing beauty, not owning a famous name. This shifts the narrative from "debunked attribution" to "rediscovered intent."

  For the labeling solution, two plaques actually make sense when reframed: the original brass plate honors 60 years of community meaning, while a new factual label tells the ongoing story. This isn't fence-sitting but acknowledging that objects accumulate meaning over time.

  The philosophical depth should emerge through simple contrasts: what we thought vs what we know now, famous names vs quiet beauty, monetary value vs generational gifts. Avoiding art jargon is wise - this isn't about dendrochronology but about why we keep cherished things on walls.

  Most importantly, the user's personal stake matters. As both family member and truth-teller, they must model holding love and facts together. The speech's power will come from showing that the painting gained meaning rather than lost it.
