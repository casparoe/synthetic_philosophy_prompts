  Here’s a speech that honors the painting’s journey, Hilda’s gift, and the truth—without using forbidden words or splitting the difference. It frames the revelation as adding layers of meaning, not taking them away.

  **(Approx. 6 min 30 sec)**

  ---

  **(Warm Welcome)**  
  "Good afternoon, everyone. Thank you for coming to welcome this special painting back home. It’s been part of our museum—and our town’s heart—for sixty years. For many of us, it’s also deeply personal. It was given by my great-aunt Hilda, who loved it dearly.  

  **(Acknowledge the Past & Hilda’s Heart)**  
  "When Hilda gave this painting to the town in 1963, she wrote something on the back. We only saw it recently, when the conservator carefully removed the backing. In her handwriting, it says: *‘For the town, so that everybody can see something beautiful.’*  
  *(Pause, let that sink in)*  
  "That simple note tells us everything about *why* it’s here. Hilda didn’t give us a famous name. She gave us something she found beautiful, something she wanted to share with all of you. That intention—that generosity—is unchanged. It never could be.  

  **(Introduce the New Knowledge Gently)**  
  "Recently, we took a closer look at the painting with modern tools—part of caring for our collection. We learned some new things about its history.  
  "The panel it’s painted on comes from the 1680s. The painting itself is genuinely old, from the late 1600s, created in a Dutch artist’s workshop. But we now know it wasn’t painted by Adriaen Sonnevelt, who passed away before this panel existed. The signature was added much later, likely around 1900.  

  **(Reframe the "Mistake" as Shared History)**  
  "So, what does this mean? It means this painting has had quite a journey. For decades before Hilda bought it, and for the sixty years it’s hung here, we all knew it by a name that wasn’t originally its own.  
  "But here’s what’s remarkable: that journey *is* now part of its story. For sixty years, this town looked at this small, quiet night scene and called it ‘our Sonnevelt.’ We found value in it. We put it on brochures. We showed it to visitors. Hilda cherished it in her front room. That meaning we all built together? That’s real. That history belongs to the painting now, just as much as the 17th-century brushstrokes do.  
  "It’s not less than we thought. It’s *more*. It’s a beautiful 17th-century painting *and* a testament to how much Hilda—and all of us—have valued it.  

  **(Announce the Plaque Decision Confidently)**  
  "So, how will we label it now? With respect for its whole story.  
  *(Gesture towards the painting)*  
  "The original brass plaque from 1963 will stay. It honors Hilda’s gift and the identity this painting held for generations. Right beside it, we’ll add a new label. It will say:  
  ‘Dutch School, late 17th Century.  
  Long attributed to Adriaen Sonnevelt.  
  Gift of Hilda [Last Name], 1963.’  
  "And we’ll include her words: *‘For the town, so that everybody can see something beautiful.’*  

  **(Address the Brochure & Future Without Saying "Fake")**  
  "Naturally, the tourism brochure will be updated. It won’t call the painting a Sonnevelt anymore. But it will still proudly feature *this* painting—our town’s beloved night scene, given by Hilda. Because what makes it special to visitors isn’t a name they might not know; it’s the beauty Hilda wanted us all to share, and the story of our community cherishing it.  

  **(Final Tribute & Closing)**  
  "Hilda wasn’t deceived. She saw beauty, and she shared it magnificently. The technical exam didn’t take anything away from her gift; it added layers to our understanding. The painting on the panel is still the one she hung over her sofa. The love she had for it is still woven into its history. The value she placed on sharing beauty with her town still shines through, clearer than ever, in her own words.  
  "So, let’s keep looking at it, just as Hilda hoped we would. Let’s keep finding something beautiful. Thank you."  

  ---

  **Why this works:**

  1.  **Honors Hilda Unambiguously:** Her note is the anchor. Her act was about sharing beauty, not owning a famous name. The speech makes *that* the permanent truth.
  2.  **Reframes the Revelation:** "Not less, but more." The 60-year history of being called "Sonnevelt" is framed as a meaningful chapter *added* to the object's life, not an error subtracting value. It validates the town's affection.
  3.  **Clever Labeling Solution:** The dual plaques aren't a weak compromise. The old plaque honors Hilda's era and intent explicitly. The new label states facts plainly without loaded terms. Including Hilda's quote ensures her voice dominates.
  4.  **Addresses the Brochure:** States the change matter-of-factly, pivoting immediately to the painting's enduring appeal and Hilda's core purpose.
  5.  **Answers the Philosophical Questions Implicitly:**
      *   **Did Hilda lose anything?** No, her act of sharing beauty remains untouched.
      *   **Was it a forgery?** Avoided by explaining the signature was added later without malice, focusing on the genuine age of the panel and paint.
      *   **Does the misattribution matter?** Yes, but as a fascinating layer of history, not a stain.
      *   **Object vs. Perception:** Affirms both the physical object (genuinely old) and the meaning bestowed upon it (genuinely valued) are real and now intertwined.
  6.  **Avoids Landmines:** No "fake," "forgery," or "copy." Doesn't claim a copy is "as good as" an original; instead, claims *this specific object* has gained unique meaning through Hilda and the town.
  7.  **Manages Family Dynamics:** Validates Hilda's love and perception ("Hilda wasn’t deceived. She saw beauty"). Positions the new info as enriching, not negating. The conservator's "authentic document" idea is subtly incorporated without using potentially loaded phrasing.
  8.  **Language:** Plain, heartfelt, avoids jargon. Focuses on story and meaning.

  **Delivery Tip:** Speak slowly, warmly, and with genuine conviction, especially when reading Hilda's note and stating "Not less, but more." Pause after key points to let them land. Look at your mother during the parts about Hilda's intent and enduring gift. This speech roots the painting's value exactly where Hilda put it: in sharing beauty.
