  Let me recall Nietzsche's "On the Uses and Disadvantages of History for Life." Right, monumental history draws inspiration from past greatness, antiquarian preserves tradition, critical destroys harmful past influences. The speaker collapses all this into "veneration=bad" which misses nuance.

