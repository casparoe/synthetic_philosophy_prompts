  But what if their future need is for a perishable good? Then they cannot save it, so they cannot have it at the end of round 3. So they must rely on tokens (at least 2 tokens) to get 1 point.

  We can assign future needs for both perishable and non-perishable goods? But then for perishable, they have no chance to save the good, so they must get tokens.

  This will highlight that for perishable goods, money is the only way to store value.

  But then we must assign future needs randomly. We can use a die to assign:

  Roll a die:
  1-3: non-perishable good (Shoes, Cloth, Furniture)
  4-6: perishable good or service (Grain, Meals, Flute Lessons)

  But note: the future need card should specify the good.

  We can pre-assign future need cards by shuffling and dealing.

  Round 4 (15 minutes):
  - Give each student a current need card (for round 4).
  - They produce one good.
  - They start with the tokens they have from previous rounds.
  - At the beginning of the round, there is a 5-minute lending phase. Rules for lending:
     - A lender can lend 1 token to a borrower in exchange for an IOU (written on an index card) that says the borrower will repay 2 tokens at the end of the round.
     - Both parties must agree.
  - Then a 10-minute trading phase (as in round 2).
  - Then a repayment phase: 
     - Borrowers must repay 2 tokens to the lender. 
     - If a borrower cannot repay, they lose 2 points (and the lender gets nothing back).
  - Then scoring for round 4:
     - Current need satisfied: 1 point.
     - Tokens held at the end: each token = 0.5 points.

  But note: the lender might have lent multiple times? We can allow multiple loans.

  Also, the repayment happens after trading, so borrowers have a chance to trade to get tokens.

  Final Scoring:
  Sum points from all rounds.

  Debrief:
  - Start by asking students about their experience in each round.
  - Round 1: Why was it hard? They needed a double coincidence of wants. This led to the need for a common measure (money).
  - Round 2: How did money help? It allowed them to split the trade. But note: we set fixed prices. Aristotle says money is a conventional stand-in for need. But in the game, the TA set the value. In reality, the value comes from the community agreement based on need.
  - Round 3: How did you handle future needs? Some goods couldn't be saved (perishable), so you had to use money. But then we set that you needed 2 tokens to get 1 point for the future need. Why not 1 token? (Because money might not be stable: in the future, the price might change? Or because the token is not the real need, it's a claim that might not be honored? Or it's a conventional measure that might not reflect the same value later.) This is the two-hat problem: money as a stable measure vs. money as a store of value.
  - Round 4: Did anyone lend? Why? Did anyone borrow? What happened? If a lender lent 1 token and got back 2, they made 1 token without producing anything. This is Aristotle's complaint about money breeding money. And it happened because the token became the object of the game.

  Then we can introduce the Greek terms: 
  - Aristotle's distinction between household management (oikonomia) and wealth-getting (chrematistike). 
  - The idea of natural exchange (to satisfy need) vs. unnatural exchange (to accumulate money).

  Finally, what the game couldn't capture perfectly:
  - The game had fixed prices and the TA set the rules. In reality, the value of money emerges from the needs of the community. So need is the real measure, and money is a symbol of that need. But in the game, we didn't have a way for the value to emerge from need. We fixed it arbitrarily. We can explain this limitation.

  Predictable problems and how to handle:
  1. Hoarding tokens: In round 2, some students might not trade because they want to keep their tokens. Encourage them: "Remember, your goal is to satisfy your need to get points. Tokens don't give points now, but they might help in the future." In round 3, they might hold tokens for the future need. That's intended.
  2. Refusal to trade: Some students might not trade because they are confused or shy. Encourage trading by setting a rule that they must trade at least once? Or walk around and facilitate. Also, the need cards will force them to seek trades.
  3. Gaming the scoring: For example, in round 3, a student might try to get two future needs? No, each has only one future need. Or they might try to trade for extra tokens. But tokens are convertible to points, so that's okay. In round 4, a borrower might take a loan and then not be able to repay, losing points. That's part of the lesson.

  Also, time management: keep strict time limits for each round.

  This design should work within the constraints and meet the objectives.
answer: |-
  ### Aristotle on Exchange & Money: Trading Game Activity  
  **Objective:** Simulate barter, money emergence, and money's dual roles (measure vs. object of desire) to mirror Aristotle's *Nicomachean Ethics* (Book 5) and *Politics* (Book 1). Students confront:  
  1. **The need for a common measure**: Why direct barter fails without a conventional token.  
  2. **Money’s duality**: The tension between money as a stable yardstick vs. a store of value that invites limitless accumulation and interest.  

  **Materials Needed** (all low-cost):  
  - **Index cards**: 100+ (cut into halves for tokens; use full cards for goods/roles).  
  - **Dice**: 1–2 for randomizing needs.  
  - **Whiteboard**: Track scores and rules.  
  - **Markers/pens**: For writing on cards.  

  **Setup** (5 minutes):  
  - **Assign roles**: Split 18 students into 6 groups (3 students per role). Each role produces a specific good/service:  
    - Farmer (Grain) | Shoemaker (Shoes) | Builder (Shelter) | Musician (Flute Lesson) | Cook (Meal) | Weaver (Cloth).  
  - **Distribute cards**:  
    - Each student gets:  
      - 1 **role card** (e.g., “Farmer: Produces 1 Grain per round”).  
      - 1 **need card** (changes each round; see below).  
      - 3 **token cards** (starting Round 2; blank index card halves labeled "Token").  
  - **Whiteboard setup**:  
    - Draw a score table: Student names | Round 1 | Round 2 | Round 3 | Round 4 | **Total**.  
    - List rules (simplified) for quick reference.  

  ---  
  ### Game Rounds (Total: 55 minutes)  
  **Round 1: Barter Chaos** (10 minutes)  
  - **Goal**: Experience why direct barter fails without a common measure.  
  - **Rules**:  
    - Each student produces 1 good (take a card labeled with their good, e.g., “Grain”).  
    - Each receives a **random need card** (e.g., “Need: Shoes”). *No tokens yet*.  
    - Trade via barter only (goods for goods, no tokens). Trades require **double coincidence of wants** (e.g., Farmer with Grain needing Shoes must find Shoemaker needing Grain).  
    - After 8 minutes, trade stops. **Scoring**: 1 point if they hold the good matching their need card.  
  - **Predictable Problem**: ~1/3 will fail to trade (e.g., Shoemaker needing Grain can’t find Farmer needing Shoes). **Solution**: Highlight this in debrief—Aristotle’s point that need alone isn’t enough without a common measure.  

  **Round 2: Token Emergence** (10 minutes)  
  - **Goal**: Discover why a conventional token is needed to facilitate exchange.  
  - **Rules**:  
    - Redistribute **new need cards** (different from Round 1).  
    - Give each student 3 tokens. Tokens can be used to buy goods (1 token = 1 good).  
    - Trade freely: goods-for-goods, goods-for-tokens, or tokens-for-goods.  
    - After 8 minutes, trade stops. **Scoring**: 1 point for holding their needed good.  
  - **Predictable Problem**: Students hoard tokens. **Solution**: Let it happen—it foreshadows money becoming an object of desire.  

  **Round 3: Storage Crisis** (15 minutes)  
  - **Goal**: Expose money’s instability as a store of value vs. its reliability as a measure.  
  - **Rules**:  
    - Each student gets:  
      - 1 **current need card** (e.g., “Need: Shelter”).  
      - 1 **future need card** (e.g., “Need: Cloth in the FUTURE”—use dice to randomize).  
    - **Perishability**: Grain, Meal, and Flute Lesson cards *expire* after this round (cannot be stored).  
    - Trade freely (as in Round 2).  
    - After 12 minutes, trade stops. **Scoring**:  
      - 1 point for satisfying **current need**.  
      - **Future need**:  
        - Hold the *exact good* on future need card? **1 point** (only if non-perishable: Shoes, Shelter, Cloth).  
        - Hold tokens? **0.5 points per token** (max 1 point total).  
  - **Predictable Problem**: Students with perishable future needs (e.g., “Need: Meal”) panic—they can’t store it. Token holders realize tokens are an imperfect store (0.5 points ≠ 1 good). **Solution**: Use this to discuss Aristotle’s "two-hat" tension.  

  **Round 4: Money Breeds Money** (15 minutes)  
  - **Goal**: Simulate the slide into money-as-target and interest (Aristotle’s critique of "wealth-getting").  
  - **Rules**:  
    - Each student gets a **new need card**.  
    - **Lending phase** (first 5 minutes):  
      - Students can lend tokens to others using **IOU cards** (e.g., “Borrower: [Name]. Repay 2 tokens at round end”).  
      - Interest is mandatory: Lend 1 token → Borrower owes 2 tokens at repayment.  
    - **Trading phase** (next 7 minutes): Trade freely.  
    - **Repayment phase** (last 3 minutes): Borrowers repay lenders (2 tokens per loan). If unable, borrower loses 2 points; lender gets nothing.  
    - **Scoring**:  
      - 1 point for satisfying current need.  
      - Tokens held: **0.5 points per token** (no cap).  
  - **Predictable Problem**: Token-rich students lend aggressively; borrowers risk bankruptcy. Someone *will* propose lending to "earn without working." **Solution**: Let debate erupt—this mirrors Aristotle’s outrage at money "breeding" money.  

  **Scoring Summary** (Whiteboard):  
  - Round 1: 1 point for need met.  
  - Round 2: 1 point for need met.  
  - Round 3: 1 point (current need) + 1 point (future need, max).  
  - Round 4: 1 point (current need) + 0.5 per token held.  
  - **Total**: Sum of all rounds. Prizes (optional): Bragging rights for top 3 scorers.  

  ---  
  ### Debrief (15 minutes)  
  **Link game moments to Aristotle’s texts** (guide the discussion; reveal Greek terms last):  
  1. **Round 1 → Aristotle on Barter** (*NE 5.5*):  
     - *Student experience*: "I couldn’t trade because no one wanted my Grain!"  
     - *Aristotle*: Need alone can’t create equivalence between "shoes, grain, or a house." Exchange requires a common measure to bridge "dissimilar" things.  

  2. **Round 2 → Money as Conventional Measure** (*NE 5.5, Pol. 1.9*):  
     - *Student experience*: "Tokens made trading easier—I could sell my Flute Lesson to anyone!"  
     - *Aristotle*: Money (νόμισμα, *nomisma*) is a human invention to embody "need" (χρεία, *chreia*) as a common measure. It’s not "natural" but agreed-upon.  

  3. **Round 3 → Two-Hat Tension** (*Pol. 1.9*):  
     - *Student experience*: "I saved tokens for my future need, but they were worth less than the actual good!"  
     - *Aristotle*: Money’s roles conflict. As a "measure" (μέτρον, *metron*), it must be stable and external. As a "store of value" (ὑπομονή, *hypomonē*), it’s desired for itself but unstable (perishable needs change; tokens decay in usefulness).  

  4. **Round 4 → Wealth-Getting vs. Household Management** (*Pol. 1.8-9*):  
     - *Student experience*: "I lent tokens and got rich without making anything!"  
     - *Aristotle*: This is χρεματιστική (*chrematistike*)—"wealth-getting" where money becomes the target. Aristotle condemns interest (τόκος, *tokos*) because money "breeding" money corrupts exchange’s natural purpose (οἰκονομία, *oikonomia*—managing needs).  

  **What the Game Can’t Capture** (Say this aloud):  
  - **The role of "need"**: Aristotle claims need (χρεία) is the "real" basis of value, while money is conventional. In the game, *you* (the TA) set token values. In reality, money’s value emerges from collective need—this is abstract and hard to simulate.  
  - **Conventional vs. natural**: Students might see tokens as "natural" solutions, but Aristotle insists they’re human inventions distorting natural use-values.  

  **Troubleshooting Predictable Issues**:  
  | Issue              | Solution (What to Say/Do)                                                                 |  
  |--------------------|-------------------------------------------------------------------------------------------|  
  | **Hoarders**       | "Notice: Tokens were meant to aid exchange, but did you start wanting them for themselves?" |  
  | **Refusal to trade** | Assign a "trade broker" role to an eager student; remind them points require participation. |  
  | **Scoring confusion** | Keep whiteboard updated live; designate a student as "scorekeeper."                        |  
  | **Lending debate** | If no one proposes interest, ask: "Could tokens earn more tokens? How?" Then step back.     |  

  **Timeline Summary**:  
  - Setup: 5 min  
  - Round 1: 10 min  
  - Round 2: 10 min  
  - Round 3: 15 min  
  - Round 4: 15 min  
  - Debrief: 15 min  
  - **Total**: 70 minutes (5 min buffer).  

  **Why This Works**:  
  - Students *feel* Aristotle’s ideas: barter’s frustration, token convenience, storage anxiety, and interest’s allure.  
  - The "two-hat" tension emerges when tokens fail as a store (Round 3) but enable exploitation (Round 4).  
  - Minimal materials, maximal engagement—no lecture, just structured chaos.  

  **Final Tip**: Start cold—no Aristotle intro. After the game, reveal that their struggles mirror a 2,300-year-old philosophy. The econ PhD’s "two-hat problem" will click when they see how money’s measuring and storing roles backfire!
