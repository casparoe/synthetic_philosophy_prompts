  ### Decision Tree: Which Extinction Pessimist Are You?  
  *A self-contained conceptual exercise sorting respondents into eight positions on what, if anything, makes human extinction bad beyond individual deaths and lost experiences.  
  Begin with the Sealed Dome scenario and proceed by answering concrete questions based on hypothetical cases.*  

  ---

  #### **Start Here: The Sealed Dome**  
  > *Scenario: Humanity’s last generation lives full, happy lives and then painlessly goes extinct. No descendants exist, and no one mourns the species. Setting aside the sadness of the deaths themselves, is there any* remaining *badness in the extinction?*  
  - **No** → Proceed to **Sterilization Choice**.  
  - **Yes** → Proceed to **Successor Reserve**.  

  ---

  #### **For "No" (Sealed Dome) → Sterilization Choice**  
  > *Scenario: A future society must choose between (a) continuing humanity (risking future suffering) or (b) painless sterilization, leading to extinction after the current generation. Setting aside the deaths of current people, is choosing sterilization...*  
    - **Good** → **Suffering-focused view (Leaf 7)**.  
      *Most awkward commitment: Extinction might be* preferable *to prevent future suffering, even if it means sacrificing potential happiness.*  
    - **Neutral** → **Austere view (Leaf 1)**.  
      *Most awkward commitment: There is no extra loss at all—only the deaths matter, and no moral weight is given to future people or projects.*  

  ---

  #### **For "Yes" (Sealed Dome) → Successor Reserve**  
  > *Scenario: An equally flourishing but culturally unrelated species arises right after human extinction, creating just as much value (e.g., art, knowledge, happiness). Does this eliminate the extra badness?*  
  - **Yes** → Proceed to **Frozen Vault**.  
  - **No** → Proceed to **Museum of the Last Generation**.  

  #### **For "Yes" (Successor Reserve) → Frozen Vault**  
  > *Scenario: Stored human embryos or digital backups could be revived by aliens to create good lives disconnected from all current human projects. Does this eliminate the extra badness?*  
    - **Yes** → **Impersonal view (Leaf 2)**.  
      *Most awkward commitment: The missing good lives could be fully compensated by creating* any *well-off beings—human or not.*  
    - **No** → **Plenitude view (Leaf 6)**.  
      *Most awkward commitment: Any loss reduces universal value—even if aliens create equal happiness, the* unique *human contribution is irreplaceable.*  

  #### **For "No" (Successor Reserve) → Museum of the Last Generation**  
  > *Scenario: The last humans knowingly complete all personal/collective projects (e.g., curing diseases, archiving history) and build a museum no one will ever see. Does this eliminate the extra badness?*  
  - **Yes** → **Stewardship view (Leaf 5)**.  
    *Most awkward commitment: Humanity’s cumulative project is only bad if* interrupted *—completing it removes the sting of extinction.*  
  - **No** → Proceed to **Collective-Afterlife Question**.  

  #### **For "No" (Museum) → Collective-Afterlife Question**  
  > *Is the extra badness primarily that our current activities (e.g., science, art, parenting) lose their point or intelligibility because there’s no future humanity—even if no one is deprived of a good life?*  
    - **Yes** → **Collective-afterlife view (Leaf 4)**.  
      *Most awkward commitment: Extinction retroactively undermines the meaning of* today’s *actions, like a joke with no audience.*  
    - **No** → **Species-relative view (Leaf 3)**.  
      *Most awkward commitment: The loss is that* human *projects and culture have no successors—even if the last generation “finishes” everything.*  

  ---

  #### **Quietist Exit (Available at Any Time)**  
  > *At any point, if you think the question has no factual answer and judgments merely express attitudes (e.g., “It feels wrong, but there’s no deeper truth”), you are:*  
    - **Quietist view (Leaf 8)**.  
      *Most awkward commitment: There is no “correct” view—our debates are just preferences in disguise.*  

  ---

  ### **Key Features**  
  - **Unoccupied Combination**: The path where someone answers "No" to the Sealed Dome but sees sterilization as "Bad" (in Sterilization Choice) is **incoherent**. If extinction has *no* extra badness, sterilization can’t be bad beyond the deaths.  
  - **Hard-to-Separate Pair**: **Stewardship (Leaf 5)** and **Species-relative (Leaf 3)** both reject the Museum scenario. To pull them apart, add:  
    > *Scenario: Humanity goes extinct, but an AI perfectly preserves and advances human culture without biological humans. Does this eliminate the badness?*  
      - **Yes** → Stewardship (values progress, not biology).  
      - **No** → Species-relative (requires human agents).  
  - **Scoring Key**:  
    | Leaf | Position                              | Path (Answers to Scenarios/Questions)                                                                 |  
    |------|---------------------------------------|--------------------------------------------------------------------------------------------------|  
    | 1    | Austere                               | Sealed Dome: No → Sterilization Choice: Neutral.                                                 |  
    | 2    | Impersonal                            | Sealed Dome: Yes → Successor Reserve: Yes → Frozen Vault: Yes.                                   |  
    | 3    | Species-relative                      | Sealed Dome: Yes → Successor Reserve: No → Museum: No → Collective-Afterlife: No.                |  
    | 4    | Collective-afterlife                  | Sealed Dome: Yes → Successor Reserve: No → Museum: No → Collective-Afterlife: Yes.               |  
    | 5    | Stewardship                           | Sealed Dome: Yes → Successor Reserve: No → Museum: Yes.                                          |  
    | 6    | Plenitude                             | Sealed Dome: Yes → Successor Reserve: Yes → Frozen Vault: No.                                    |  
    | 7    | Suffering-focused                     | Sealed Dome: No → Sterilization Choice: Good.                                                    |  
    | 8    | Quietist                              | Reject factual answers at any point.                                                              |  

  ### **Design Notes**  
  - **Accessibility**: Scenarios avoid jargon and use relatable dilemmas (e.g., museums, alien revivals).  
  - **Logic**: Branches cover all eight leaves. Longest path (5 questions) is for Leaf 3 or 4.  
  - **Efficiency**: Five scenarios/questions used (Sealed Dome, Sterilization Choice, Successor Reserve, Frozen Vault, Museum). The Collective-Afterlife Question is not scenario-based but clarifies intuitions.  
  - **Flow**: "No" to Sealed Dome quickly routes to Leaf 1 or 7; "Yes" explores compensation, meaning, and identity.  

  This tree isolates core commitments while letting users "see" their position through vivid cases—ideal for interdisciplinary discussion.
