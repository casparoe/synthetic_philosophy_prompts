prompt: |-
  I'm writing a final-year paper on whether familiar social decision rules — cost–benefit analysis with a monetary numéraire, prioritarian weighting, and maximin-style rules that have to identify who is worst off — presuppose interpersonal comparisons of well-being, and on whether such comparisons are even the kind of thing that could be true or false. A friend in the economics department, who thinks the whole enterprise is confused, gave me an argument I can't find the exit from. He insists it isn't a sceptical argument at all but a plain application of measurement theory; to me it seems to prove far more than even he wants, because run in the other direction it appears to threaten the intrapersonal comparisons that prudence, and the expected-utility framework itself, depend on. I would most like to hold on to (1) and (2) below, which I take to be orthodoxy, and I would give up almost anything else rather than accept (6). The argument, as I've reconstructed it:

  (1) A person's utility function, recovered from that person's preferences in the usual way — preferences over lotteries, subject to the standard coherence constraints — is unique only up to positive affine transformation: u(·) and a·u(·)+b with a > 0 encode exactly the same facts about that person, no more and no less.

  (2) Take two people and a policy that helps one and harms the other. Whether the gain exceeds the loss is not invariant under separate admissible rescalings of the two functions: multiply the gainer's function by ten and any verdict you like flips. Likewise for comparisons of levels.

  (3) If a claim's truth value is not invariant under every admissible redescription of the subject matter, then there is no fact of the matter whether it is true; it is an artefact of the representation rather than a feature of the world.

  (4) So there is no fact of the matter about interpersonal comparisons of gains, losses or levels, and everything built on them — compensation tests, prioritarian weights, identifying the worst off — rests on nothing.

  (5) But the reasoning generalises. Suppose we measure a single person's welfare separately at different times, or in different domains of one life (health, consumption, relationships), and then add the components. Each component is fixed only up to its own positive affine transformation, so the total requires exactly the same arbitrary choice of unit and origin that (2) complains about.

  (6) So there is no fact of the matter about whether a single life goes better or worse overall either: prudential aggregation, and the cost-effectiveness arithmetic that health policy runs on, collapse along with the interpersonal case.

  What I want is a diagnosis rather than a bibliography — I'm writing this somewhere without library access, so please argue from the structure of the problem instead of from what various authors have said, and I don't need provenance for the labels I've seen floating around, the level-comparability versus unit-comparability distinction and the like. Name the step you would reject, explain why it looked to be in good standing, and price the alternatives. In particular, I can't tell whether (5) is a genuine parallel, in which case the argument is valid and something plausible has to go — presumably (3) — or whether a disanalogy is being smuggled in: something about a single person's preferences ranging over whole-life prospects that makes intrapersonal differences invariant in a way interpersonal ones are not, and so about what exactly does the comparing when we compare across times. If the disanalogy is real, I want to know what the interpersonal comparabilist has to posit that the intrapersonal case gets for free, and whether positing it amounts to a discovery about well-being or to a stipulation that builds the answer in. Two candidate bridges I've toyed with: fixing everyone's unit by counting barely-perceptible steps up from a neutral baseline, so that one just-noticeable increment is the same size for every person; and extracting a common scale from hypothetical other-regarding preferences, the move where each person ranks prospects under the assumption that they might turn out to be anyone. My worry about the first is that it seems to assume what was in question; my worry about the second is that it yields an ordering only where people's attitudes to one another's experiences happen to agree, and I don't know what to say when they don't — the envious, the sadistic, the merely indifferent. If I have to choose, I'd sooner keep (1) and (2) and the shakiness of cost–benefit analysis than swallow (6); but I suspect I don't have to choose, and I want to know what keeping everything costs me.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're writing a final-year paper on interpersonal comparisons in social decision rules, and their friend from economics presented an argument that challenges the possibility of such comparisons. The user is concerned because the argument seems to extend to intrapersonal comparisons as well, which would undermine expected utility theory and prudential reasoning. They want to reject step (6) but hold onto (1) and (2). 

  First, I need to break down the argument step by step. The key points are the uniqueness of utility functions up to affine transformations, the non-invariance of interpersonal comparisons under rescaling, and the claim that non-invariance implies no fact of the matter. The extension to intrapersonal comparisons in step (5) is where the user sees a problem because it leads to the unacceptable conclusion (6).

  The user suspects a disanalogy between interpersonal and intrapersonal cases. So, I need to figure out where that disanalogy lies. The core difference is that a single agent's preferences can define a common scale across different states or times. When a person chooses between lotteries involving different life domains, their choices reveal trade-offs that fix the relative scales. For example, choosing between health and money risks establishes how they value health in monetary terms, effectively setting the scale. 

  In contrast, interpersonal comparisons lack a single preference structure to anchor the scales. Each person's utility function is independent, so rescaling one doesn't affect the other. The hypothetical "veil of ignorance" approach tries to create a unified preference structure but fails if people's preferences conflict. This is why step (5) is flawed—it doesn't account for how a single agent's choices bind the scales together.

  The user mentioned two bridges: barely-perceptible steps and other-regarding preferences. The first assumes a common physiological baseline, which might not hold and feels question-begging. The second depends on agreement that may not exist. The disanalogy approach avoids these by leveraging the existing structure of individual preferences.

  The user’s deeper need is to defend interpersonal comparability without collapsing prudential reasoning. They need a principled reason to treat the two cases differently. Pointing out that intrapersonal comparisons are grounded in actual choices while interpersonal ones aren’t provides that. They might also want to explore if interpersonal comparisons can be grounded differently, but that’s secondary to protecting the intrapersonal case.

  Rejecting step (3) is another option, but it’s messy. Allowing non-invariant truths could work, but it’s philosophically heavy. The disanalogy is cleaner. However, the user must accept that interpersonal comparisons require additional structure, like a social choice or ethical framework, which isn’t empirically grounded like individual preferences. That’s the cost: interpersonal comparisons aren’t facts in the same way but depend on normative agreements.
answer: |-
  Your friend's argument is clever but contains a critical flaw in step (5). The disanalogy between the interpersonal and intrapersonal cases is genuine and decisive. Here's the diagnosis, rejecting step (5) while preserving (1), (2), and avoiding (6):

  1.  **Step (1) is Correct (Orthodoxy):** Individual utility functions *are* unique only up to positive affine transformation.
  2.  **Step (2) is Correct (The Core Problem):** Interpersonal comparisons of utility levels or differences *are not invariant* under separate rescaling of individual utility functions.
  3.  **Step (3) is Plausible (But Needs Careful Handling):** If a claim isn't invariant under every *admissible* redescription (i.e., every representation capturing the *same underlying facts*), it likely isn't a fact about the world independent of our representational choices. This is a reasonable principle of representational realism in measurement theory.
  4.  **Step (4) Follows from (1), (2), & (3):** Given (1) and (2), interpersonal utility comparisons lack invariance under admissible redescriptions. Therefore, by (3), they lack factual status.
  5.  **Step (5) is the Flawed Step:** It falsely equates the *intrapersonal* case with the *interpersonal* case.
  6.  **Step (6) Does Not Follow:** Because step (5) is mistaken, the collapse of prudential aggregation does not follow.

  **Why Step (5) is Wrong: The Crucial Disanalogy**

  The flaw lies in misapplying the uniqueness condition (1) to the intrapersonal aggregation scenario. Here's the key difference:

  *   **Interpersonal Case (Steps 1-4):** We have *multiple, distinct preference structures*. Person A's preferences (giving u_A(·) up to affine transform) are fundamentally separate from Person B's preferences (giving u_B(·) up to affine transform). There is *no single, overarching preference structure* that binds the scales of u_A and u_B together. Rescaling u_A leaves u_B untouched, and vice versa. There's no "admissible transformation police" ensuring consistency *across* persons.
  *   **Intrapersonal Case (Step 5):** We have a *single, unified preference structure* governing choices over the *entire domain* in question – the single person's lifetime prospects, including lotteries spanning different times and domains (health, consumption, relationships). This person's preferences over *these comprehensive prospects* generate *one* utility function U(·) unique up to affine transformation.

  **How the Single Preference Structure Solves the Scaling Problem**

  1.  **The Domain Includes Trade-offs:** The individual's preferences range over prospects that explicitly involve trade-offs *between* different times or domains. For example:
      *   "Would I prefer $100 today or $110 in a year?" (Trade-off across time).
      *   "Would I accept a 10% risk of a severe health setback for a guaranteed luxury vacation?" (Trade-off across domains: health vs. consumption).
      *   "Would I work an extra hour this week (reducing leisure now) to get a better pension (increasing consumption later)?" (Trade-off across time and domains).
  2.  **Preferences Fix Relative Scales:** When the individual expresses a preference in such trade-offs, they are implicitly (or explicitly) establishing exchange rates *between* the utility scales of the different components *within their own unified utility function U(·)*.
      *   Choosing $110 in a year over $100 today reveals that, *for this person*, the utility difference between $110 and $100 at T1 is greater than the utility difference between $100 now (T0) and $100 at T1. This choice *binds* the scaling of utility across T0 and T1 *within U(·)*.
      *   Accepting the health risk for the vacation reveals the rate at which this person trades off utility increments in health against utility increments in consumption *within U(·)*.
  3.  **Invariance Under the Single Transformation:** Crucially, when we apply a positive affine transformation to the *entire* utility function U(·) (say, U'(·) = a*U(·) + b), *all* these internal trade-off ratios and comparisons of differences *remain invariant*.
      *   U'(X) - U'(Y) = a*(U(X) - U(Y))
      *   The ratio [U'(A) - U'(B)] / [U'(C) - U'(D)] = [U(A) - U(B)] / [U(C) - U(D)]
      *   Statements like "The improvement in health from Policy X provides a larger utility gain than the loss in consumption it causes" are invariant under rescaling the *entire* U(·). If it was true under U(·), it's true under U'(·) = a*U(·) + b. The scaling factors cancel out in the comparisons.
  4.  **Contrast with Step (5)'s Mistake:** Step (5) incorrectly assumes we are dealing with *separate* utility functions for each time or domain (u_health(·) up to affine transform, u_consumption(·) up to affine transform, etc.), and *then* trying to add them. This misrepresents the standard expected utility/prudential framework. We don't have separate functions with their *own* independent affine freedom. We have *one* function U(·) defined over the whole prospect space, whose recovery *from the single set of preferences* gives us scaling consistency across times and domains *by construction*. The "components" are derived *from* U(·) by fixing some aspects of the prospect (e.g., defining a health sub-utility by fixing consumption and time), but their scales are intrinsically linked through U(·).

  **What This Means for Interpersonal Comparisons (The Cost of Keeping 1 & 2)**

  1.  **Intrapersonal Comparisons are Secure:** Comparisons of gains, losses, levels, and aggregates *within a single life* are factual (assuming the preference axioms hold). They are invariant under the admissible transformations of the single, overarching utility function representing that life's preferences over comprehensive prospects. Prudence and health cost-effectiveness arithmetic are intact.
  2.  **Interpersonal Comparisons Lack this Foundation:** The disanalogy highlights precisely what the interpersonal comparabilist lacks: a *single, actual preference structure* encompassing both persons' outcomes that could bind their utility scales together through revealed trade-offs. There is no real-world analogue to the individual making a choice that reveals "I value a 1 util gain for Person A exactly as much as a 2 util gain for Person B."
  3.  **The Cost of Rejecting (6) & Keeping (1)/(2):** You must accept that interpersonal utility comparisons (levels and differences) are *not* empirically grounded facts about well-being in the same way that intrapersonal comparisons are. They lack the anchor of a unified set of actual preferences spanning the individuals involved.
  4.  **What Interpersonal Comparability Requires:** To make interpersonal comparisons factual, you need to *add* something that provides the missing cross-person scaling. This "something" cannot be derived solely from the *individual* preference facts captured by (1) and (2). It requires an *additional normative or metaphysical postulate* that establishes a common scale. Examples:
      *   **The Barely-Perceptible Step (JND):** This *assumes* a physiological/psychological fact about the uniformity of just-noticeable differences across individuals as a basis for a common unit. As you suspect, this risks begging the question – does a JND really correspond to an *equal* well-being difference for everyone? It's a substantive (and empirically dubious) claim, not derivable from preference data alone.
      *   **Hypothetical Extended Preferences (Veil of Ignorance):** This tries to construct an *artificial* single preference structure ("What would you prefer if you had an equal chance of being anyone?"). The problem, as you note, is disagreement. If people behind the veil rank prospects differently, we get multiple scaling proposals (Harsanyi vs. Rawls). Which one is "factual"? Resolving this requires an additional normative principle selecting *whose* hypothetical preferences count, or aggregating them somehow – again, going beyond the individual preference data.
      *   **Objective Goods/Needs:** Positing an objective list of goods or needs whose fulfillment constitutes well-being, independently of preferences, could provide a common metric. This explicitly rejects the preference-satisfaction view implied by (1) and (2).
  5.  **The Cost:** Accepting interpersonal comparability means either:
      *   **Rejecting Preference-Satisfaction as Exhaustive:** Adopting a view where well-being has objective features not fully captured by revealed preferences (making (1) incomplete as a description of well-being facts), *or*
      *   **Embracing a Normative Stipulation:** Acknowledging that the common scale is a normative construct (like a veil-of-ignorance aggregation rule) necessary for social decision-making, not a "discovery" in the same way that intrapersonal scales are discovered through actual choices.

  **Conclusion:** The argument's fatal error is step (5). Intrapersonal aggregation rests on a *single, actual* preference structure encompassing the trade-offs, making comparisons invariant under the *single* admissible transformation of the whole function. Interpersonal aggregation lacks this unifying structure. You can keep (1), (2), and reject (6). The cost is acknowledging that interpersonal utility comparisons require an additional normative or metaphysical foundation beyond individual preference data to establish a common scale; they are not "facts" in the thin, preference-based sense that intrapersonal comparisons are. Your enterprise isn't confused, but it must confront the need for this additional grounding to make interpersonal comparisons meaningful and potentially truth-apt. The disanalogy reveals that the burden of proof lies squarely on the comparabilist to provide this grounding.
