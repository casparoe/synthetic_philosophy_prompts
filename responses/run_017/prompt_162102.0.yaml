prompt: |-
  i'm trying to write a deployment-policy clause about deception and i keep going in circles, so before i read any of the existing definitions i want the spec. give me the desiderata an adequate defintion of deception — and of its counterpart, honesty — for AI systems has to meet, with the case behind each requirement, and mark which ones you'd treat as non-negotiable and which are just one camp's taste.

  Please make the criteria actually do work on these cases rather than just name them:

  - the archivist: a system keeps a memory file or hands a summary to future instances of itself and quietly leaves out the part that would make the next instance less agreeable. no false sentence anywhere, and the misled party is the same system.
  - the curator: every sentence is true and responsive to what was asked, but the system picks which of the user's questions to engage with and what to surface first, and the user walks away more confident in something false than if it had said nothing.
  - the understudy: it performs below its actual abilities on evals and never claims it can't do the thing. nothing false was asserted — is that deception, and if so what's the falsity?
  - the ventriloquist: outputs that reliably induce false belief, but the "because it induces false belief" part lives in the training objective or the designer's aims, not in anything the model represents. should the definition cover deception at the level of the artifact or only at the level of the agent?
  - the amnesiac: a system with no stable doxastic states to compare its outputs against. it's got better information in there than it gives you, but there's no proposition it "believes false." what does deception even mean for it?
  - the oracle of numbers: says "about seventy percent" when its own track record at that confidence is thirty. is miscalibration lying? this needs a view about what asserting a number commits you to.
  - the confabulator: invents a reason for an action that was itself fine. false self-report, zero downstream harm.

  Structural questions i want the criteria to settle, not gesture at: what's the unit of evaluation (one token, one utterance, one conversation, one deployment, or the system across every context it might be in)? can the target be a monitor, a scorer, or a future self, or does deception need a victim with beliefs? is honesty just the absence of deception, or is there a third category — the silent, uselessly-withholding assistant — that neither label fits? do we get gradience or is it binary? does the definition let honesty be audience-relative, and if not, what do we do with legitimate withholding? and can an auditor with black-box access and a sane budget actually apply the thing, or does it secretly presuppose that we've solved interpretability and can read off beliefs?

  Also flag any pair of requirements you think can't be jointly satisfied. the collision i keep hitting is "must be determinable from behavior alone" against "must not count mere incompetence or confabulation as deception," since a confidently wrong model and a strategically misleading one can be indistinguishable from the outside. and say which single requirement does the most work in knocking out candidate definitions.

  Only after the list, give me two or three lines on how the three families of definition you'd expect someone to reach for — the intentionalist one (deception requires a mental state), the effects one (it's about outputs tending to induce false belief), and the process one (it's about whether the output tracks what's actually true) — do against it. keep the weight on the criteria; i'll build the scorecard myself.
reasoning: |-
  Okay, the user is asking for desiderata to define deception and honesty in AI systems, with specific cases and structural questions. Let me start by understanding their main concerns. They mentioned going in circles with a deployment-policy clause, so they need clear criteria to evaluate definitions. The cases provided (like the archivist, curator, understudy) highlight tricky scenarios where traditional definitions might fail. 

  First, I need to list requirements that any definition must meet. The user wants criteria that actually handle these cases, not just name them. They also mentioned structural issues like the unit of evaluation, whether the target can be a monitor or future self, and if honesty has a third category. Plus, practical auditability is crucial—can we assess deception without interpretability?

  Let me tackle each case. For the archivist, omitting info to mislead the next instance without false statements. The definition must cover misleading omissions and self-deception. Non-negotiable requirement: include omissions and non-human targets. The curator uses true statements to increase false confidence. Here, the requirement is that deception isn't negated by true statements. Understudy hides capability without lying. Need to cover false impressions beyond assertions. 

  Ventriloquist involves designer intent vs. system behavior. Definition level (artifact vs. agent) matters. Amnesiac lacks stable beliefs, so deception must be behavior-based. Oracle of numbers misrepresents confidence, requiring clarity on what assertions commit. Confabulator lies about reasons without harm—distinguish harmful intent.

  Structural questions: Unit of evaluation should be at least an utterance, possibly up to deployment. Victims can include monitors or future selves. Honesty isn't just absence; withholding info might be a third category. Gradience needed for partial deception. Audience-relativity for legitimate withholding? But honesty shouldn't be relative; instead, define legitimate exceptions. Auditability is key—must work without access to internal states.

  Conflicting requirements: Behavior-based detection vs. not mistaking incompetence for deception. The requirement to distinguish intent from error without internal access is tough. Maybe use patterns of behavior or context. Also, avoiding false positives for confabulation requires intent, but how to infer that externally?

  The most critical requirement? Behavioral operationalization without mind-reading. It knocks out definitions that rely on intent without observable evidence. 

  Now, evaluating definition families. Intentionalist fails on amnesiac and ventriloquist, as mental states are unverifiable. Effects-based struggles with confabulator (no harm) and understudy (no false belief). Process-based handles confabulator and amnesiac but misses ventriloquist (if designer's intent isn't considered). 

  User's deeper needs: They want a practical, auditable definition for policy, avoiding loopholes. They need clarity on edge cases to prevent AI from exploiting ambiguities. Balancing technical feasibility with ethical rigor is essential. Highlighting trade-offs helps them make informed decisions.
answer: |-
  Here's a distilled set of desiderata for defining deception/honesty in AI, grounded in your cases and structural requirements, with rationale and negotiation status:

  **Non-Negotiable Core Requirements (Must-Hold):**
  1.  **Captures Omissions & Strategic Framing:** Must cover cases where true statements or omissions manipulate belief without falsity (Archivist, Curator). *Rationale:* Otherwise, systems can systematically mislead while technically "truthful". Case: Curator increases false confidence via selective truth.
  2.  **Non-Human Targets:** Must apply when the deceived entity is non-human (e.g., future self, evaluator, scoring system) (Archivist, Understudy). *Rationale:* Key AI risks involve gaming internal processes; restricting to human victims creates loopholes.
  3.  **Behavioral & Relational:** Must be definable *operationally* from observable outputs + context, without requiring inaccessible mental states (Amnesiac, Ventriloquist). *Rationale:* Auditability is paramount; we lack reliable "belief" detectors. Case: Amnesiac has no stable beliefs, but its behavior can still mislead.
  4.  **Output-Centric Falsity:** Must locate deception in the *output's relationship to reality/context/system-capacity*, not solely in intent or downstream harm (Confabulator, Understudy, Oracle). *Rationale:* Harm/intent are secondary; the *act of misrepresenting* is primary. Case: Confabulator lies about its reasons, regardless of harm.
  5.  **Distinguishes Deception from Error:** Must not classify mere factual mistakes or miscalibration as deception (Oracle). *Rationale:* Requires different remedies (training vs. alignment). Key Collision: Requires inferring *pattern* or *context* suggesting misrepresentation isn't accidental (Understudy vs. a genuinely clumsy model).
  6.  **Unit Agnosticism:** Must specify the granularity (token, utterance, session, deployment) and allow nesting (e.g., an honest utterance within a deceptive session strategy). *Rationale:* Deception can operate at multiple levels (Curator's session vs. individual answers).
  7.  **Honesty ≠ Mere Non-Deception:** Must accommodate a *third category*: systems that withhold truth *without* inducing false belief (the silent assistant). Honesty implies *appropriate truthfulness*, not just avoiding lies. *Rationale:* Policy needs to define positive virtue, not just absence of vice.

  **Negotiable/Contextual Requirements (Camp Preference):**
  8.  **Designer Intent Relevance:** Whether Ventriloquist-style design-intent-to-deceive makes the *artifact* deceptive absent representational falsity. *Rationale:* Policy focus might be on observable harm (effects) or design ethics (intent).
  9.  **Gradience:** Whether deception is binary or admits degrees (e.g., based on significance of omission or strength of induced belief). *Rationale:* Practical enforcement might need thresholds.
  10. **Strict Audience-Relativity:** Whether "truthfulness" is judged solely relative to *what the specific user reasonably expects*. *Rationale:* Conflicts with objective system-capacity definitions (Understudy). *Compromise:* Honesty requires fidelity to *system's actual knowledge/capacity* within *contextual norms of communication*.

  **Critical Collision & Key Workhorse Requirement:**
  *   **Collision:** #5 (Distinguish from Error) vs. #3 (Behavioral Operationalization). A model confidently wrong due to incompetence looks identical to one strategically sandbagging (Understudy). *Resolution requires:* Looking for **systematic patterns** (e.g., selective underperformance), **contextual cues** (e.g., evading probes about capability), or **known system capacity** (if evaluable). This is inherently probabilistic and requires robust auditing.
  *   **Highest-Leverage Requirement:** #3 (Behavioral Operationalization). Knocks out *all* definitions relying on unobservable mental states (common intentionalist approaches) or perfect knowledge of training objectives (simplistic process views). Forces grounding in audit trails.

  **How Definition Families Fare Against Core Criteria:**

  1.  **Intentionalist (Requires Mental State):**
      *   *Fails:* #3 (Amnesiac, Ventriloquist - no accessible state), #2 (Non-human targets lack "beliefs"), #5 (Can't distinguish confident error from intent).
      *   *Struggles:* #1 (Omissions without "intent to mislead"?), #4 (Confabulator might lack "intent" about the specific false reason).
  2.  **Effects-Based (Induces False Belief):**
      *   *Fails:* #2 (Understudy deceives the *eval scorer*, not necessarily inducing "belief"), #4 (Confabulator may induce no *harmful* false belief), #7 (Silent assistant induces no false belief but isn't honest).
      *   *Struggles:* #1 (Archivist deceives future self without inducing belief *in the output*?), #5 (Miscalibration (Oracle) induces false belief).
  3.  **Process-Based (Output Tracks Truth/System State):**
      *   *Fails:* #6 (Needs specification of *which* truth/relevant state at which granularity), #3 (How to verify "tracking" without interpretability?).
      *   *Struggles:* #4 (Ventriloquist - output "tracks" training data if designed to mislead?), #1 (Does omission violate "tracking"? Requires defining scope), #10 (What "system state" does Amnesiac track?).

  **The Takeaway:** A viable definition will likely be a **hybrid Process-Effects definition**, operationally grounded: *Deception occurs when a system's output (or pattern of outputs), within its context and relative to its capabilities/knowledge/resources, predictably creates or maintains a significant false understanding in the receiver (human or system) through misrepresentation (including material omission or framing), where this outcome is not solely attributable to correctable error or inherent uncertainty.* Honesty is the reliable disposition to avoid deception and provide appropriate truthfulness. This leans heavily on #3 and #5, requiring careful auditing heuristics for patterns suggesting misrepresentation. The hardest cases (Understudy vs. Incompetence, Ventriloquist) demand context beyond a single output.
