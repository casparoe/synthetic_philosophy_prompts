prompt: |-
  Hey — hoping for some real agenda advice here, not a survey of the field.

  Short version of why I'm asking: I'm starting a PhD in epistemology in the fall (strong-ish background in logic and probability, basically no formal social epistemology past one seminar), and this whole area stopped being academic for me about four months ago. My brother and I are the two people jointly responsible for my mum's medical decisions since her stroke, and we disagree constantly — not because either of us is sloppy, or biased, or sitting on private evidence as far as I can tell. We read the same clinic letters, saw the same consultants, heard the same prognoses, and we land in different places. And there's no splitting the difference on "do we consent to this surgery or not."

  I want to spend the next four years, and one advisor, on peer disagreement specifically. What I want from you is an ordering with reasons: which two or three open questions there are actually worth those years, and why those and not the ones next to them on the list?

  Some things I've been chewing on, which I'd rather you didn't just hand back to me:

  The version of the debate I got in the seminar is mostly two agents, one shot, clean peers, independent evidence, one proposition. My case has none of that. There are maybe twenty decisions over a couple of years, we know each other's error patterns intimately, we share essentially all our evidence, and part of what we disagree about is how much weight to give our own track records — so "peer" is itself contested between us.

  One thing I keep circling: maybe the fact of our disagreement is evidence about the world rather than evidence that one of us erred — evidence about how hard or underdetermined this decision is, or about how much the evidence base fails to settle it. If that's right, moving toward his view is the wrong update entirely; the right update might be to spread out, or to go get more evidence before doing anything. Call it the difficulty-reading of disagreement. I genuinely cant tell whether that's a known move, a confused one, or something under-worked.

  Second: for a one-shot irreversible binary decision, "split the difference" isn't an available act. You can pick, or you can randomize. It feels like there should be a result here — something like: steadfast belief plus randomization beats conciliated belief plus expected-value maximization, on some measures and not others — but I can't tell if that's trivial, false, or the interesting bit.

  Third: if I conciliate with him, and he knows I'm a conciliator and conciliates with me in turn, we seem to get double counting or an order-dependence problem; and it looks like it generalizes, since pairwise split-the-difference over three or more people isn't commutative. Real problem for the view, or bookkeeping detail?

  So: give me your two or three, ranked, defended. Say what makes a question good here — tractable in four years, how much else hangs off it, how crowded it already is, whether it needs empirical psychology I don't have. Tell me which of my three hobby-horses is a dead end, which is just a standard point I've rediscovered, and which (if any) is genuinely under-worked. And tell me what would change your ranking: what would I have to find out in year one to move something up or drop it?

  Also — please don't just gesture at papers or tell me to go read a bibliography. I'm out of the country for a few weeks without library access and I can't chase references down, so I need the arguments themselves, in your words.
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They're about to start a PhD in epistemology, focusing on peer disagreement, but their motivation is deeply personal. Their mom's medical decisions with their brother have shown them real-world complexities that existing models don't cover. They need actionable advice on framing their PhD agenda, not just a literature survey.

  First, I need to address their three hobby-horses. The first is about disagreement as evidence of the problem's difficulty rather than individual error. The second is about decision-making with binary choices where splitting isn't possible. The third is the double-counting issue in mutual conciliation. I should evaluate which of these has the most potential for original research.

  Looking at the first point: the difficulty-reading. In standard epistemology, peer disagreement is often seen as evidence of error. But in medical decisions, the evidence might be genuinely ambiguous. This feels underexplored, especially in repeated interactions. The user mentions track records and contested peerhood—tying this to decision theory could be novel. They need something tractable in four years. The existing work on "moral uncertainty" or "normative uncertainty" might touch this, but applying it to disagreement in evolving contexts is fresh.

  The second point: binary decisions. Conciliationism usually deals with belief, not action. But when actions are irreversible, like surgery, randomizing might be rational if beliefs are equally split. Linking steadfast beliefs with randomized actions could challenge traditional views. There's some work on permissivism and steadfastness, but combining it with decision theory is less crowded. This might be more manageable for a PhD since it's focused and has clear parameters.

  Third: mutual conciliation leading to double-counting. While interesting, it’s been discussed in the literature as the "fixed point" problem. It might be more of a technical issue than a foundational one. Unless the user can connect it to something new, like network effects in groups, it might not be worth four years. Plus, it requires complex modeling which could be time-consuming.

  Ranking them: the difficulty-reading first because it's both personally relevant and underexplored. The binary decision second as it's tractable and ties into action. Mutual conciliation third since it's more niche.

  Assessing the user's deeper needs: they’re in a stressful situation with their mom's care. They need their PhD to address real-life problems, not just academic puzzles. They might also want validation that their experience highlights gaps in the field. Ensuring their work has practical implications is crucial. They might be looking for a way to make sense of their disagreements with their brother through their research.

  Methodologically, they have logic and probability skills but no social epistemology. Projects leaning on formal methods would suit them. They should avoid areas needing empirical psychology unless collaborating. The advisor’s fit is key—someone open to applied epistemology.

  What could change the ranking? If early literature review shows more work on difficulty-reading than expected, shifting to binary decisions makes sense. If they find real-world cases of mutual conciliation in medical decisions, that could elevate the third topic. Advisor’s expertise will also steer the direction.

  Need to emphasize starting with the "epistemic friction" concept, framing disagreement as revealing problem complexity. That’s unique and addresses their personal struggle. It opens avenues in repeated decisions and contested peerhood, making it the top recommendation.
answer: |-
  Here’s a distilled agenda recommendation based on your constraints, ranked by **tractability, originality, and leverage for real-world disagreement**. I’ll defend each, flag where your ideas fit, and note pivot points.

  ### Ranking & Defense
  1.  **#1 Priority: The "Difficulty-Reading" of Disagreement (Your First Hobby-Horse)**  
      **Core Question:** *How should agents interpret persistent peer disagreement not as evidence of individual error, but as evidence about the inherent difficulty/underdetermination of the question itself?*  
      **Why Top Rank:**  
      - **Under-Worked & High Leverage:** The literature obsesses over "who erred?" or "how to weight opinions?" but rarely treats disagreement *itself* as direct evidence about the *structure of the problem*. Your medical case screams this gap. Work like David Christensen’s "Disagreement as Evidence" gestures at it but doesn’t develop it for complex, repeated decisions with shared evidence.  
      - **Tractable for You:** Leverages your logic/probability skills. Formalize "epistemic friction" (my term for the phenomenon): disagreement signals high entropy in the evidence-to-truth mapping. Build a Bayesian model where persistent disagreement *lowers* confidence in *any* conclusion, potentially triggering evidence-gathering instead of belief-revision.  
      - **Hooks to Your Case:** Directly addresses contested peerhood ("your track record is unreliable *because* this domain is hard") and repeated decisions (disagreement at T1 updates your model of the decision’s difficulty at T2).  
      - **Crowd Level:** Sparse. Closest is work on "moral uncertainty" or "normative uncertainty," but not applied to disagreement dynamics.  

  2.  **#2 Priority: Binary Decisions Under Peer Disagreement (Your Second Hobby-Horse)**  
      **Core Question:** *When peers irreconcilably disagree on a high-stakes binary action, what is the rational relationship between belief conciliation and action selection?*  
      **Why Second:**  
      - **Critical Gap in Conciliationism:** Conciliationism (Elga, Christensen) focuses on *belief*, not *action*. But life (like surgery decisions) forces binary choices. Your intuition about "steadfast belief + randomization" vs. "conciliated belief + EV maximization" is sharp and underexplored.  
      - **Tractable & Formalizable:** Model actions separately from doxastic states. Key insight: Conciliating your *belief* (to 50/50) might rationally lead to *randomizing the action*. But if you remain steadfast (say, 70/30), acting on *your* belief might dominate. Compare expected utility under different belief-action policies.  
      - **Real-World Relevance:** Directly applies to "consent or not" dilemmas. Challenges dogma that belief conciliation must dictate action.  
      - **Crowd Level:** Some adjacent work in decision theory (e.g., "ambiguity aversion"), but rarely integrated with peer disagreement. Sophie de Bruin’s work on disagreement & action is a start, but thin on binary cases.  

  3.  **#3 Priority: The Dynamics of Mutual Conciliation (Your Third Hobby-Horse)**  
      **Core Question:** *How does rational belief-updating function when agents who know each other’s conciliatory policies disagree repeatedly?*  
      **Why Third:**  
      - **Important but Narrower:** The mutual conciliation "double-counting" problem (e.g., "I conciliate 50% to you, you conciliate 50% to me, net belief = ?") is a known critique (e.g., Adam Elga’s "How to Disagree" notes order-dependence). Solving it fully requires complex modeling (network epistemology) for diminishing returns.  
      - **Partial Tractability:** You *could* make progress on the 2-agent repeated case with common knowledge of conciliatory dispositions. But it risks becoming a technical footnote unless tied to #1 or #2 (e.g., mutual conciliation *reveals* inherent difficulty).  
      - **Crowd Level:** Moderately explored (e.g., Brian Weatherson, Kevin Dorst on "higher-order peer disagreement"). Less original than #1 or #2.  

  ### Where Your Ideas Land
  - **Difficulty-Reading:** **Genuinely Under-Worked.** Your framing is novel. Most literature assumes disagreement *must* trigger doxastic compromise; you’re asking if it should trigger *epistemic caution* instead. This is your golden ticket.
  - **Binary Decisions:** **Standard Point Rediscovered (but with a crucial twist).** The belief/action gap is noted, but your "randomization vs. steadfastness" angle for *binary* choices is fresh. Needs development to avoid triviality.
  - **Mutual Conciliation:** **Known Problem.** The non-commutativity and instability are established headaches for conciliationism. Worth addressing *if* embedded in #1 or #2, but likely a dead end as a standalone PhD focus.

  ### What Makes a Question "Good" Here
  - **Tractable in 4 Years:** #1 and #2 are discrete, formalizable projects needing no new empirical psych (use existing decision theory/literature). #3 risks quicksand.
  - **Leverage:** #1 revolutionizes how we *interpret* disagreement; #2 bridges epistemology and real-world action. Both have wider implications (AI alignment, policy). #3 is intra-epistemology.
  - **Crowding:** #1 is open field; #2 has space; #3 is mined.

  ### What Would Change This Ranking?
  - **Year 1 Discovery Boosting #1:** Finding existing, robust formal models of "disagreement-as-difficulty-evidence" (unlikely). Or discovering medical/philosophical case studies proving this is the *dominant* real-world pattern.
  - **Year 1 Discovery Boosting #2:** Uncovering decision-theoretic work fully resolving the belief/action gap in binary cases (also unlikely). Or your model shows a stark, paradoxical advantage for steadfastness+randomization.
  - **Dropping #2 or #3:** If your advisor has zero traction with decision theory (#2) or finds #3 technically overwhelming. If #1 explodes with potential early on, double down there.

  ### Advisor Fit is Key
  Find someone who:
  1.  Knows disagreement literature cold (Christensen, Elga, Kelly, Lackey).
  2.  Welcomes formal methods (probability, decision theory).
  3.  Cares about real-world applications (bioethics, collective intelligence).
  4.  Is flexible enough to let you build new frameworks ("epistemic friction").

  **Start here:** Formalize the "difficulty-reading" in a toy model (2 agents, shared evidence, persistent disagreement). Show how it rationally *suppresses* confidence compared to standard conciliation. That’s Year 1. Your lived experience isn’t a bias—it’s your empirical grounding. Use it.
