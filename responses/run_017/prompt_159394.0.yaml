prompt: |-
  I want the specification before I commit to any account of genetic information: what would a theory of what makes a stretch of DNA — or any molecular structure — information-bearing have to get right in order to be more than a suggestive metaphor? Write me the desiderata: the phenomena it must explain, the cases it must handle, the distinctions it must not collapse, with the consideration behind each, marking which requirements you take to be non-negotiable and which are only preferences of one camp.

  The cases I most want covered:

  - The baseline: a nucleotide sequence whose relation to the amino-acid sequence it helps produce looks chemically arbitrary, and is in fact read differently in some organelles and lineages, as against the relation between a polypeptide and the shape it folds into, which looks chemically forced. A theory should either explain why the first invites information talk and the second does not, or explain the contrast away.
  - Context-sensitivity: one stretch of sequence yielding different products in different cells or at different times, via splicing, editing, shifted reading frames or regulatory state, so that content cannot simply be a property of the sequence alone.
  - Heredity without sequence: methylation and chromatin marks, cytoplasmic and structural templates passed from parent to offspring. The theory must either admit these as information or exclude them on a stated principle.
  - The reaction norm: one genotype, many phenotypes across environments; one phenotype, many genotypes. Whatever codes for means here, it had better not mean specifies uniquely.
  - A lineage I'll call L, in which the codon-to-amino-acid mapping is not fixed by the genome: the adaptor molecules that set the mapping are handed down as finished molecules from parent to offspring, and the lineage can shift to a different mapping within a few generations with no change in the DNA sequence of its genes. Does L's DNA carry the same information under a different code, or different information? Is the inherited mapping itself information — information about how to read other information — and if so does the account face a regress, given that reading it seems to require machinery whose own specification already presupposes some mapping?
  - An environmental cue that is chemically arbitrary with respect to the developmental switch it triggers but has been reliably present throughout the lineage's history. If arbitrariness plus reliability is what does the work, this cue qualifies: say whether the theory accepts that, and if not, what else it demands — a source with the right history, a consumer whose proper function is to interpret, or something further.

  Also: state what the theory is for (grounding molecular biology's explanatory practice, or settling a metaphysical question about content) and whether the list changes with that purpose. Then tell me which pair of requirements you suspect cannot be jointly satisfied, so that the list is itself a result, and which single requirement excludes the largest family of views. Close with a brief scorecard — a short paragraph each — for the main families: the literalist genetic-code view, deflationary causal or parity views, teleological-selection-based views, and developmental-systems views. No bibliography or citations, please, and write in British English.
reasoning: |-
  Hmm, this is a deep and technical query about what makes DNA count as "information" beyond metaphor. The user wants desiderata for any viable theory of genetic information, specifying six complex cases it must handle. They're clearly a philosopher or theoretical biologist with sophisticated concerns - note how they avoid simple "code" analogies and demand explanations for context-sensitivity and non-DNA heredity.

  First, unpacking their core demand: they want criteria separating literal information-bearing from mere causation. The six cases are brilliantly chosen stress tests:
  - Case 1 (baseline) targets arbitrariness - why DNA→protein feels coded but protein folding doesn't.
  - Case 2 (context-sensitivity) challenges simplistic "sequence=content" views.
  - Case 3 (heredity without sequence) probes if information must be molecular.
  - Case 4 (reaction norms) demands non-deterministic "coding".
  - Case 5 (lineage L) is a regress trap for code-based views.
  - Case 6 (environmental cues) tests if reliability alone suffices for informational status.

  Their unspoken agenda seems to be exposing tensions between scientific practice and philosophical neatness. The explicit demand to identify conflicting desiderata suggests they suspect no theory can satisfy all.

  For desiderata, I'll structure:
  1. Necessary conditions any theory must meet (non-negotiables like arbitrariness and normativity)
  2. Contested conditions (e.g., whether teleology or consumers are required)
  3. Explanatory targets (what phenomena the theory must illuminate)

  The tension I see: Non-negotiable 3 (normativity) requires appeal to purposes (teleology), but teleological views struggle with Case 5's regress and Case 6's environmental cues. Deflationary views avoid teleology but collapse normativity (failing Case 1 and 4). Literalist code views fail Cases 2,3,5 spectacularly.

  Developmental systems views handle Cases 2-4 well but make "information" omnipresent (risking collapse). Teleosemantic views handle normativity but stumble on Case 5's mapping regress and Case 6's cue reliability without proper function.

  Biggest exclusion: Non-negotiable 3 (normativity) rules out all purely causal/parity views - they can't explain misreading or error.

  For the scorecard:
  - Literalism: Strong on intuitive code analogy, fails nearly all cases.
  - Deflationary: Useful anti-exceptionalism, but can't handle normativity or arbitrariness.
  - Teleosemantic: Best for normativity, but code regress (Case 5) and environmental cues (Case 6) are thorny.
  - Developmental systems: Most empirically adequate, but overextends "information" losing explanatory bite.

  The user's lineage L case is particularly devastating - it shows that even the "code" isn't truly genetic if mapping molecules are inherited separately. This torpedoes any view treating DNA content as intrinsic.

  Ultimately, the theory's purpose matters: for molecular biology practice, a deflationary view may suffice; for metaphysics of content, teleosemantics is stronger but messier. I'll close by noting this tension - no view aces all tests, reflecting deeper divides in philosophy of biology.
answer: |-
  Here are the desiderata for a theory of molecular information-bearing, structured to address your cases and considerations. Non-negotiables (NN) are essential for escaping metaphor; preferences (P) reflect contentious philosophical divides.

  ### **Core Desiderata (NN = Non-Negotiable; P = Preference)**
  1.  **Arbitrariness & Conventionality (NN):** Must explain why the nucleotide-to-amino-acid mapping (e.g., codon assignments) appears arbitrary and lineage-specific (Case 1), unlike stereochemical protein folding. Failure collapses the DNA/protein informational distinction into universal chemistry.
  2.  **Normativity (NN):** Must ground the possibility of *misreading*, *error*, or *malfunction* (e.g., mis-splicing, translational errors). Metaphors lack normative force; a literal theory must explain why some outcomes are "wrong".
  3.  **Context-Sensitivity (NN):** Must handle cases where identical sequences produce different outputs (e.g., alternative splicing, editing, environmental induction – Cases 2, 4, 6). Content cannot be intrinsic to the molecule alone.
  4.  **Multiple Realisability/Underdetermination (NN):** Must accommodate:  
      - One genotype → many phenotypes (reaction norms, Case 4).  
      - One phenotype ← many genotypes.  
      "Coding" cannot imply unique specification.
  5.  **Non-DNA Hereditary Carriers (NN/P):** Must adjudicate whether non-sequence inheritants (methylation, prions, cortical templates – Case 3) bear information. If excluded, the theory must provide a principled distinction (e.g., arbitrariness, decodability) beyond "not DNA". *NN: It must address them; P: Whether they qualify.*
  6.  **Mapping Regress (NN):** Must resolve the regress in Lineage L (Case 5): If inherited adaptors define the code, is their specification also informational? If so, does this require infinite prior mappings? The theory must either block the regress or show it’s harmless.

  ### **Contested Desiderata (P = Preference)**
  7.  **Environmental Cues (P):** Must state whether reliable, arbitrary environmental triggers (Case 6) qualify as information. *Naturalist Camp (P):* Requires only arbitrariness + selection history. *Teleosemantic Camp (P):* Requires a "consumer mechanism" with the proper function to interpret it. *Literalist Camp (P):* Excludes non-molecular carriers.
  8.  **Teleology & Origins (P):** Must specify if information requires:  
      - A *source* (e.g., selection history, sender intent).  
      - A *receiver* (e.g., cellular machinery with interpretive function).  
      *Naturalists/Pragmatists (P):* Prefer minimal teleology (reliability + utility). *Strong Teleosemanticists (P):* Require evolved proper functions.
  9.  **Material Basis (P):** Must define if information is restricted to specific substrates (e.g., nucleic acids) or is substrate-neutral. *Literalists (P):* DNA/RNA only. *Parity/Developmental Systems (P):* Any reliable causal factor.

  ### **Purpose & Scope**
  - **Primary Purpose:** To ground molecular biology’s explanatory practice – especially how "genetic information" explains heredity, development, and evolution without anthropomorphism.  
  - **Secondary Purpose:** To clarify whether "content" is a metaphysically robust biological category.  
  - **Does the list change?** Yes. For explanatory practice, desiderata 1-6 (NN) are paramount. For metaphysics, desiderata 7-9 (P) become central battlegrounds.

  ### **Tensions & Exclusions**
  - **Hardest Joint Satisfaction:** **Normativity (NN3)** + **Mapping Regress (NN6)**. Normativity demands teleology (e.g., proper functions), but Lineage L suggests the "code" defining function is itself inherited arbitrarily, risking infinite regress of functions. Teleosemantic views struggle here; deflationary views abandon normativity.
  - **Most Excluding Requirement:** **Normativity (NN3)**. It eliminates all purely causal/parity/deflationary views (e.g., "DNA is just a causal difference-maker"), which cannot ground "error".

  ---

  ### **Scorecard of Major Views**
  1.  **Literalist Genetic-Code View:**  
      Treats the codon table as literal. *Strengths:* Captures arbitrariness (Case 1), intuitive for coding sequences. *Weaknesses:* Fails context-sensitivity (Case 2), non-DNA heredity (Case 3), reaction norms (Case 4), and Lineage L (Case 5). Collapses under biological complexity.
  2.  **Deflationary/Causal-Parity Views:**  
      Treats "information" as shorthand for reliable causation; DNA is one among many factors (e.g., environmental cues). *Strengths:* Handles context-sensitivity (Case 2), reaction norms (Case 4), non-DNA carriers (Case 3). *Weaknesses:* Cannot explain arbitrariness (Case 1) or normativity (misreading is just causation). Excluded by NN3.
  3.  **Teleological-Selectionist Views:**  
      Information defined by evolved function (e.g., Millikan, Maynard Smith). *Strengths:* Explains normativity, arbitrariness (Case 1), and environmental cues (Case 6, if history-based). *Weaknesses:* Struggles with Lineage L’s regress (Case 5), non-DNA heredity (Case 3 if no evolved receiver), and fast mapping shifts. May overextend "function".
  4.  **Developmental-Systems/Extended Heredity Views:**  
      Information is distributed across DNA, epigenetics, cytoplasm, environment. *Strengths:* Best for context-sensitivity (Case 2), reaction norms (Case 4), non-DNA heredity (Case 3). *Weaknesses:* Risks collapsing "information" into any reliable cause, losing explanatory bite (fails NN1, NN3). Struggles with arbitrariness (Case 1) and Lineage L (Case 5).

  ### **Conclusion**
  No extant theory satisfies all NN desiderata comfortably. The tension between **normativity** and **non-DNA heredity/regress** is acute. For molecular biology’s practice, a teleosemantic view (prioritising NN1-4) is strongest but stumbles on Case 5. Developmental systems views handle Cases 2-4 robustly but sacrifice precision. The metaphor escapes literalisation if normativity or arbitrariness is abandoned—but then it explains nothing new.
