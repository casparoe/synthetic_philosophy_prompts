  - The non-negotiable philosophical commitments 
  - Where the methodology is compatible with multiple theories 
  - How each challenge (human exception, affective granularity, subjective time) would force changes 

  Key nuances: 
  - They suspect critics misread "welfare range" as hierarchical moral worth rather than equal consideration of unequal capacities. This distinction is crucial. 
  - They want precision on what the spreadsheet *actually* implies versus what it's agnostic about. 

  Philosophical layers I need to untangle: 
  1. **Moral status baseline**: Their practice presumes sentient beings have moral standing, but weights welfare impacts by species-specific capacity. This isn't "less moral worth" but "differently scaled experiences." (Similar to Singer's preference utilitarianism). 
  2. **Welfare theory**: They're implicitly hedonic utilitarians—welfare = net pleasure/pain, quantifiable across species via neural proxies. 
  3. **The human exception** requires a bright line: either human-unique traits (dignity, autonomy) or sheer pragmatism to avoid repugnant conclusions. But both risk speciesism charges unless grounded in uncontroversial discontinuity. 
  4. **Underdetermined elements**: 
     - *Welfare theory*: Their rankings fit hedonism but also desire-based views if neural complexity proxies preference sophistication. 
     - *Moral status*: Any theory accepting gradation (e.g., sliding-scale sentientism) works; absolute egalitarianism (all sentient beings equal) does not. 
  5. **Handling challenges**: 
