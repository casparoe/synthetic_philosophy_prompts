prompt: |-
  Write a satirical Call for Proposals, 600–700 words, in the deadpan house style of a large public research funder — numbered sections, eligibility criteria, an evaluation rubric, a note on eligible costs — announcing a five-year award for the first study to demonstrate that a cultural value is a genuine cause of a macroeconomic outcome.

  The humour has to come from the real methodological difficulty rather than from generic academia jokes. Design the call so that each further requirement, added in the funder's own telling in order to raise standards, quietly shrinks what applicants are permitted to call culture. Include at least these: the value must be measured independently of the practices it is supposed to cause, so that a commitment to hard work cannot be inferred from the fact that people work hard; it must be shown to do causal work rather than merely to stand in a relation of elective affinity to the outcome; it must not be identified with whatever the economists' model leaves unexplained — the call should give this residual an official name, and concede in a footnote that most canonical cultural explanations have been of exactly this kind; and it must survive the fact that values are transmitted by institutions that the outcome itself shapes. By the last criterion the eligible value should have been squeezed to almost nothing. The call should then note, in perfect sincerity, that the previous round attracted no fundable proposals, attribute this to the applicants rather than to the criteria, and announce a follow-up call in which the panel will specify the eligible value itself.

  Constraints: the target is the practice of explaining outcomes by appeal to culture, not any named person or school. The piece should never state the problem in plain terms, and no character should announce the conclusion, yet a reader should still be able to tell what is being ironized without the author winking. It should be funny to someone who knows Weber's Protestant ethic argument and the literature criticizing it, and readable to someone who does not. Invent no quotations from Weber; the standard concept labels — elective affinity, this-worldly asceticism, ideal type, the iron cage — may be used freely.
reasoning: |-
  We are writing a satirical Call for Proposals in the style of a large public research funder. The target is the methodological difficulty in proving that a cultural value causes a macroeconomic outcome. The humor must come from the gradual shrinking of what can be called "culture" due to increasingly stringent criteria. The call must include:
  1. The cultural value must be measured independently of the practices it is supposed to cause.
  2. It must do causal work, not merely have an elective affinity.
  3. It must not be the residual in an economic model (we'll give that residual a name).
  4. It must survive the problem that values are transmitted by institutions that the outcome shapes.

  By the end, the eligible value is almost nothing. Then, note that the previous round had no fundable proposals, blame the applicants, and announce a follow-up where the panel will specify the value.

  Constraints:
  - Target the practice, not a person or school.
  - Never state the problem plainly; no character announces the conclusion.
  - Must be funny to someone who knows Weber and the critiques, but readable to others.
  - Use standard Weberian terms (elective affinity, etc.) but no invented quotes.

  Style: deadpan, bureaucratic, numbered sections.

  Structure:
  1. Introduction: Announce the award and its goal.
  2. Eligibility criteria: For institutions, teams, etc. (standard stuff).
  3. The research challenge: Detail the requirements step by step, each narrowing "culture".
  4. Evaluation rubric: How proposals will be judged.
  5. Eligible costs: Standard budget items.
  6. Previous round note: No fundable proposals, applicants' fault, next round panel will specify the value.

  Word count: 600-700 words.

  Let's break down the requirements for the research:

  Requirement 1: The value must be measured independently of the practices. Example: You can't measure "hard work" by how hard people work.

  Requirement 2: Must show causal work, not just elective affinity. That is, it must be a cause, not just a correlation or a fitting together.

  Requirement 3: Not the residual. We'll call the residual something bureaucratic, like "Model Unexplained Variance Component (UVC)". Footnote conceding that most cultural explanations are exactly that.

  Requirement 4: Survive the fact that institutions (which shape values) are also shaped by the outcome. So, if the outcome (like economic success) shapes the institutions that then transmit the value, it's circular.

  By the end, culture is squeezed to almost nothing.

  Then, the note: Previous round had no fundable proposals. Why? Because applicants didn't meet the criteria. Next round, we'll specify the value.

  We write in deadpan, as if this is all perfectly reasonable.

  Word count: Let's aim for 650.

  Outline:

  1. Introduction (100 words)
     - The National Foundation for Economic and Cultural Advancement (NFECA) is pleased to announce a five-year award for a pioneering study that definitively demonstrates a causal relationship between a cultural value and a macroeconomic outcome.

  2. Eligibility Criteria (100 words)
     - Standard: institutions, teams, international collaborations, etc.

  3. Research Challenge (300 words)
     - This is the core. Break into sub-sections:
       a. Independent Measurement: The cultural value must be measured independently of the practices it is supposed to cause. (E.g., a commitment to hard work cannot be inferred from labor hours.)
       b. Causal Work: The study must demonstrate that the value does causal work, not merely stands in a relation of elective affinity. (Explain that elective affinity is insufficient.)
       c. Non-Residual: The cultural value must not be identified with the residual component of economic models. We name this residual the "Model Unexplained Variance Component (UVC)". Footnote: "It is acknowledged that many canonical cultural explanations have, upon scrutiny, been found to describe UVCs."
       d. Institutional Transmission: The cultural value must survive the challenge that it is transmitted by institutions which are themselves shaped by the macroeconomic outcome. (This creates a circularity problem.)

  4. Evaluation Rubric (50 words)
     - How proposals will be scored on each criterion.

  5. Eligible Costs (50 words)
     - Standard: personnel, equipment, travel, etc.

  6. Note on Previous Round (50 words)
     - The previous round of this call (NFECA/2023/01) did not yield any fundable proposals, primarily due to applicants' failure to adequately address the above criteria. Therefore, in the next round (NFECA/2024/01), the panel will specify the eligible cultural value to be studied.

  Total: ~650 words.

  Writing in deadpan: Use bureaucratic language, passive voice, numbered points.

