prompt: |-
  So I'm in this group chat — half rationalist-adjacent, half startup people — and we're trying to help a small nonprofit-ish org drop degree requirements from its hiring and use a work-sample/portfolio thing instead. One guy in the chat, who reads a lot of evo-psych, more or less shut the discussion down with: "a signal is like an advertisement. The money you spend on the ad is thrown away, and that waste is the whole point — it's what makes the message believable. If it didn't cost anything, everyone would run the ad, and then the ad carries zero information. So your cheap take-home test can't work. The waste has to be somewhere; you're just moving it around." He then reeled off peacock tails, stotting gazelles, Rolexes, expensive weddings, and said the handicap-principle math guarantees this in general: honest signalling requires waste, full stop. Nobody had a good answer and its been bugging me for a week.

  My own half-baked pushback, which I'd rather you stress-test than just agree with: as I understand it the handicap condition isn't "resources get destroyed," it's closer to "the signal has to be differentially costly — it has to cost a worse sender more than it costs a better one" — which is a claim about what a *lower-quality* sender *would* pay, i.e. a counterfactual, not about anything actually being burned up in equilibrium. And if that's the real condition, there ought to be signals where nothing is consumed at all: posting a bond or a hostage that you get back if you turn out to be telling the truth, or a credential that's free to hold but gets retroactively yanked plus a penalty if the holder underperforms — the cost is real and deters the fakers, but nobody ever pays it on the equilibrium path. Call them hostage signals versus burnt-money signals if that helps. If hostage signals genuinely work, then the ad analogy is smuggling in waste where the theory only needs differential cost, and my friend's "you're just moving the waste" is false rather than deep. But I also suspect there's a catch — something about needing someone who can verify quality after the fact, or about a single bond only sorting people into two bins instead of a smooth scale, or about the bond having to be big enough to sting the marginal type while top types post it for free — and maybe that's exactly where the waste creeps back in.

  So: audit the analogy properly. Give me the correspondence table (what plays the role of the ad budget, the product's actual quality, the customer, the repeat purchase, the rival firm that would love to lie), then separate the disanalogies that matter for the use he's making of it from the ones that are just decoration, and tell me whether "waste is load-bearing" survives once you put hostage-type signals next to burnt-money-type ones. If the ad picture is the wrong one, give me a better analogy for what a signal actually is. Assume for concreteness that the org gets ~30 applicants per role, can observe job performance reasonably well about six months after hiring, and can't pay anyone to sit through anything long. Write in American English, and keep it concrete rather than literature-flavored.
reasoning: |-
  Okay, the user is in a group chat with rationalist and startup folks trying to remove degree requirements from hiring at a nonprofit. They hit a roadblock with someone using evo-psych and the handicap principle to argue that any signal without waste can't work. The user's pushback is about "differential cost" versus actual waste, suggesting hostage signals as an alternative. They want me to stress-test this idea.

  First, I need to unpack the evo-psych guy's argument. He's equating signals with wasteful displays like peacock tails or Rolexes, saying cheap signals get flooded by fakers. But the user's point about differential cost being key rather than literal waste makes sense. The core of handicap principle is that the signal must be cheaper for high-quality senders to produce.

  For hiring, the work-sample test could be a hostage signal. Applicants spend time on it, but good candidates find it easier and faster. The cost isn't burned - it's the opportunity cost of their time. The differential comes from skill: strong candidates breeze through while weak ones struggle or give up.

  But there are catches. The org needs to verify performance later, which they can do at 6 months. Also, the test must be designed so quality correlates with speed/accuracy - that's crucial. If it's too easy or unrelated to the job, differential cost vanishes.

  The ad analogy is misleading here. Ads burn money to prove credibility, but hiring signals can use sunk time that varies by ability. Waste isn't load-bearing; differential cost is. The real issue is whether the test accurately maps to job skills and whether weak candidates are deterred by the effort required.

  Hostage signals like bonds or credentials with penalties could work in theory, but in hiring, posting bonds isn't practical. The work-sample test acts as a time bond - candidates invest time they only get back via getting hired. The key is ensuring the test screens effectively without unnecessary waste.

  For the nonprofit, the solution is a well-designed work-sample test that's job-relevant and time-boxed. Track outcomes to confirm it predicts performance. The evo-psych argument oversimplifies by ignoring differential cost and verification mechanisms.
answer: |-
  Here's a stress-test of both arguments, using concrete hiring mechanics. Your "hostage signal" intuition is fundamentally correct *in theory*, but the evo-psych guy's warning highlights *practical implementation risks* that often reintroduce waste or make hostage signals tricky. The "waste is load-bearing" claim doesn't survive contact with hostage signals – **the core requirement is *differential cost*, not literal waste.** However, ensuring robust differential cost in hiring often *creates* waste in practice.

  ### Correspondence Table: The Hiring "Signal" Ecosystem
  | Evo-Psych Analogy      | Hiring Signal Reality (Work Sample)          | Why It Matters                                                                 |
  | :--------------------- | :------------------------------------------- | :----------------------------------------------------------------------------- |
  | **Product Quality**    | Candidate's actual job-relevant skill        | The thing you care about. Must be observable later (performance review).       |
  | **Signal (Ad Budget)** | Candidate's effort/time on the work sample   | The "cost" paid to demonstrate skill.                                          |
  | **Cost of Signal**     | Time/effort spent completing the sample      | Must be HIGHER for low-skill candidates than high-skill ones (differential cost). |
  | **Receiver (Customer)**| Hiring Organization                          | Must interpret the signal and act (hire/not hire).                             |
  | **"Believability"**    | Signal's ability to predict job performance  | Requires the differential cost structure.                                      |
  | **"Rival Firm"**       | Low-skill candidate trying to fake competence| They *want* to send the signal cheaply but *can't* without high cost/risk.     |
  | **"Repeat Purchase"**  | Post-hire performance verification (~6 mos) | **CRITICAL for Hostage Signals:** Enforces penalties if the signal was fake.   |
  | **"Waste"**            | *Potential* sunk time (candidate & org)      | Not inherent; depends on design. Can be minimized.                             |

  ### Your Pushback is Logically Sound: Hostage Signals *Can* Work
  1.  **Differential Cost is King:** You nailed it. The handicap principle requires: `Cost(Signal | Low Skill) > Cost(Signal | High Skill)`. It says *nothing* requiring resources to be permanently destroyed ("waste"). It's about *comparative burden*.
  2.  **Hostage Signals = Non-Wasteful Enforcement:** Your bond/hostage idea is spot-on. The candidate "posts" something valuable (time, effort, reputation) *conditionally*. They get it back (via getting/keeping the job) only if they perform well. Low-skill candidates face a high *risk-adjusted cost*: they likely lose the hostage (waste time, get fired, harm reputation). High-skill candidates face low risk, so low *effective* cost.
  3.  **Work Sample as a Hostage Signal:**
      *   **The Hostage:** The candidate's time/effort invested in the sample.
      *   **The Condition:** If hired, their performance is verified at ~6 months.
      *   **The Penalty:** If they underperform (signal was fake/low-quality), they get fired ("lose the hostage" – their sunk time yields no long-term benefit, reputation hit). If they perform well, they keep the job (effectively "redeeming" the hostage).
      *   **Differential Cost:** A high-skill candidate completes the sample quickly and accurately with high confidence they'll perform well (low effective cost). A low-skill candidate either:
          *   Struggles massively to complete it (high *direct* time cost), or
          *   Does a poor job quickly and gets screened out, or
          *   Does a mediocre job, gets hired, but then gets fired at 6 months (high *effective* cost: wasted job search time, onboarding effort, reputation damage).
      *   **"Waste"?** Sunk time *happens*, but it's *not the point*. The point is the *threat* of wasted time/reputation deters fakers *because* the cost/risk is higher for them. High performers pay little cost because the task is easy *for them* and the risk is low.

  ### Why the Evo-Psych Guy Sounds Plausible (The Catches You Suspected)
  His argument mistakes *one common mechanism* (conspicuous consumption/waste) for the *fundamental requirement* (differential cost). Hostage signals achieve differential cost without literal waste *in the ideal case*. **But implementation is messy, and waste often creeps in:**

  1.  **Verification Cost & Lag (The Big One):**
      *   **Problem:** The org MUST reliably verify performance at ~6 months and enforce penalties (fire underperformers). This costs the org significant time and money (manager hours, disruption, potential legal risk). If they don't enforce rigorously, the "hostage" loses value, and low-skill candidates can send the signal cheaply (fake the test, keep the job by being mediocre).
      *   **Waste Creep:** The org's verification/enforcement effort *is* a form of system-wide "waste" required to maintain the signal's credibility. It's "moved" from the candidate burning money to the org spending resources on firing.
      *   **Consequence:** If the org is bad at firing underperformers, the work sample test *does* become a cheap, ineffective signal. The evo-psych warning applies *here*.

  2.  **Designing True Differential Cost:**
      *   **Problem:** Making the work sample *genuinely* easier/faster for high-skill candidates than low-skill ones is hard. If it's too easy, everyone passes (no differential cost). If it's too generic, it doesn't correlate well with job skill. If it's too long, you waste *everyone's* time unnecessarily (literal waste).
      *   **Waste Creep:** Finding the "Goldilocks zone" often involves trial-and-error, wasting some candidate and org time during refinement. A poorly designed test *is* pure waste.
      *   **Consequence:** A well-designed, job-relevant, time-boxed sample does create differential cost. A bad one doesn't and may be wasteful.

  3.  **The "Bins" Problem (Sorting Granularity):**
      *   **Problem:** A single work sample/hostage typically sorts into "Probably Hirable" vs. "Probably Not". It's less granular than a GPA (though GPA is often a noisy signal itself). You might miss finer distinctions within the "Hirable" bin.
      *   **Solution:** This isn't fatal. You can use the sample as a minimum bar screen (filtering out clear mismatches), then use interviews/references for finer grading *within the qualified pool*. The hostage signal does the heavy lifting of excluding the worst mismatches efficiently.

  4.  **Bond Size & "Sting":**
      *   **Problem:** The "hostage" (time/risk) must be large enough to deter the *marginal* low-skill candidate you want to screen out. If the sample takes 2 hours, and the marginal candidate thinks "Meh, I'll gamble 2 hours for a shot," it fails. They need to perceive the *risk* of getting fired later as costly enough *for them*.
      *   **Solution:** This relies on the org's reputation for enforcement (see Point 1) and the candidate's own risk aversion/opportunity cost. Making the sample *meaningful* (simulates real work) and the org known for acting on probation periods helps. The cost *isn't* zero, even for high performers (2 hours is 2 hours), but the differential remains.

  ### The Better Analogy: A Performance Bond
  **Forget the ad. A work sample signal is like posting a performance bond:**

  1.  **The Bond:** The candidate's invested time/effort in the test (and subsequent probation period).
  2.  **The Obligation:** Perform the job competently.
  3.  **The Bond Holder:** The hiring organization.
  4.  **The Condition:** If the candidate performs well (meets obligation), the bond is effectively returned (they keep the job, their time investment pays off).
  5.  **The Penalty:** If they perform poorly (default), they forfeit the bond (wasted time, lost job, reputation hit).
  6.  **Differential Cost:** A high-quality candidate knows they'll easily meet the obligation, so posting the bond is low-risk/low-effective-cost. A low-quality candidate knows they'll likely default and lose the bond, making it high-risk/high-effective-cost. **No money is burned if everyone performs. The cost is conditional on failure, enforced by verification.**

  ### Concrete Advice for the Nonprofit (~30 apps/role, 6-mo feedback)
  1.  **Design a Killer Work Sample:** 60-90 mins max. Simulate a *core*, *specific* task from the job (e.g., "Draft a project plan outline for X," "Analyze this dataset and summarize key findings," "Write a response to this customer query"). Make it impossible to BS without the relevant skill. Pilot it on current high/low performers.
  2.  **Set Clear Expectations:** Tell candidates upfront: "This sample directly reflects the work. We review performance at 6 months rigorously. This is your chance to show us you can do this."
  3.  **Enforce Relentlessly:** **THIS IS KEY.** You MUST be willing to fire people who underperform at 6 months. Track stats: Does the work sample score predict 6-month performance rating? If not, fix the sample. If yes, fire underperformers consistently. This *maintains the bond's value*.
  4.  **Minimize Waste:** Time-box the sample. Use automated scoring/rubrics where possible. Reject quickly based on clear sample failures. Focus verification resources on the hires.
  5.  **Combine Signals:** Use the work sample as the primary screen. Use shorter interviews to assess culture fit, motivation, and communication *only on candidates who passed the sample*. Ditch resumes/degrees entirely for screening.

  **Conclusion:** Your friend is wrong that "waste is load-bearing." **The handicap principle requires *differential cost*, not literal waste.** Hostage signals (like a well-designed work sample backed by real performance verification) achieve differential cost by imposing higher *risk-adjusted* costs on low-quality senders. **However,** the evo-psych guy correctly points out the *implementation risks*: if verification is lax or the test is poorly designed, the differential cost collapses, and you *do* get waste (everyone's time is wasted on ineffective screening). **The "waste" isn't in the theory; it's the price of practical enforcement and good design.** Focus on designing a great sample and being ruthlessly data-driven about enforcing performance, and the waste will be minimized while the signal works. Tell him the signal isn't an ad burning cash; it's a performance bond secured by the candidate's time and your willingness to uphold the contract.
