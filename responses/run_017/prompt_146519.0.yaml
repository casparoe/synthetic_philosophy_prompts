  - "terms": array of objects, each with "name" (string), "probability" (number between 0 and 1), "one_liner" (string)
  - "combination": string — two or three sentences on how you got from the terms to the headline
  - "headline_credence": number
  - "most_sensitive": string — the term that moves the headline most, and by roughly how much
  - "least_confident": string — the term you'd least want to have to defend
  - "scaling_pattern": object with "delta" (number, how much the headline moves if it's a smooth falloff instead of a hard cutoff) and "why" (string)
  - "disagreement": string — the single term most likely to be where me and my friend actually differ
