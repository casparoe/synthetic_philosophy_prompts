prompt: |-
  After forty years in experimental physical chemistry — calorimetry, mixtures, a good deal of statistical mechanics — I have begun reading moral philosophy, and my instinct is to translate everything into quantities I can manipulate. What I want from you is not an explanation pitched at a beginner but a systematic translation of one debate into the vocabulary I actually think in, together with an honest account of what the translation loses.

  The vocabulary you may use freely: ensembles and coarse-graining; extensive versus intensive quantities; Legendre transforms; Jensen's inequality; convexity and Schur-concavity (I know majorization under another name and will recognise it once defined); entropy-like functionals, large-deviation rate functions, and response or perturbation expansions about a stationary state. Assume no philosophy on my part beyond two survey articles, no familiarity with the literature's labels, and no wish for anything to be cited.

  The claims I want restated, one at a time and as faithfully as possible:

  (i) that a benefit to a person matters more, morally, the worse off that person is — stated, as I have met it, as a sum over persons of a strictly increasing and strictly concave function of their well-being;

  (ii) that this is genuinely different from valuing equality, even though in practice it directs benefits toward the worse off;

  (iii) the levelling-down objection as it is pressed against the view that equality is intrinsically good: that such a view must sometimes concede that a world in which the better off have been brought down to the level of the worst off, with no one made better off, is in one respect better;

  (iv) the reply that the priority view escapes this objection, because its weighting function is strictly increasing, so that lowering anyone's well-being always tells against an outcome;

  (v) the rider that the escape is partial or fragile — something about how the worse off are to be identified, whether by absolute level, by rank in the distribution, or by comparison with others; something about populations that are not fixed in size; and something about ranking uncertain prospects rather than settled outcomes.

  My own reconstruction, which I would like tested rather than humoured: in thermodynamics a scale-invariant quantity — an entropy per particle, a coefficient of variation, a Gini coefficient — is not the sort of thing that can be an amount of anything at all, since it does not add across systems and does not change by a definite amount when a subsystem is removed. Levelling down looks to me like the price of admitting such a dispersion measure into an objective function alongside an extensive total; and prioritarianism looks like the trick of securing sensitivity to dispersion without paying it, not by appending a term that measures spread but by curving the transform, which leaves the total strictly increasing along every coordinate while making it Schur-concave. If that is right, (iii) is really a complaint about combining intensive and extensive quantities in one criterion, and (iv) is the observation that concavity gives you the inequality-sensitivity for free. I also suspect that the ex ante / ex post distinction in (v) is nothing but the distinction between an ensemble average and a single realisation — though I suspect that is too glib, since the expectation in question is not an average over anything that exists.

  Where does this reconstruction break? In particular: is the analogue of exchangeability of identical particles exact or only approximate; is separability across persons really the moral counterpart of extensivity, and is it an independent assumption rather than something the egalitarian motivations give you; and does my framing quietly presuppose that the units being summed have no identity, which the debate may not grant?

  Then the residue report: which of (i) to (v) translate cleanly, which survive only with distortion, and which have no expression in my vocabulary at all — I expect something about a benefit's being for someone, and something about the separateness of persons, to be inexpressible in a functional over a distribution. For each item of residue, say whether you take it to be a defect of my vocabulary or an indication that the original claim was less clear than it appeared. And if my reconstruction smuggles in a physical assumption the philosophical position does not make, say so plainly: that is precisely the error I cannot see from inside my own training.

  Finally, since I mean to use your answer to decide what to read next: indicate how confident you are in each of your main claims, and single out the one about which you are least confident.
reasoning: |-
  We are going to translate the moral philosophical claims into the language of statistical mechanics and information theory. The vocabulary provided will be used to restate the claims and then we will examine the reconstruction.

  Let's break down each claim:

  (i) **Priority of the worse off (Prioritarianism)**: A benefit to a person matters more, morally, the worse off that person is. This is represented as a sum over persons of a strictly increasing and strictly concave function of their well-being.

     Translation: Let the well-being of individual \( i \) be \( w_i \). The overall social welfare \( W \) is given by:
     \[
     W = \sum_{i} f(w_i)
     \]
     where \( f \) is strictly increasing and strictly concave. The strict concavity of \( f \) means that the marginal gain in \( W \) from an increase in \( w_i \) is greater when \( w_i \) is small.

     This is analogous to a thermodynamic system where we might have an entropy-like functional that is concave. In fact, if we think of well-being as an extensive quantity (like energy) and we transform it with a concave function, we are introducing a form of risk aversion or inequality aversion.

  (ii) **Distinction from egalitarianism**: This prioritarianism is genuinely different from valuing equality, even though in practice it directs benefits toward the worse off.

     Translation: Egalitarianism would value equality intrinsically, meaning that it would add a term that directly measures the dispersion (like the variance or the Gini coefficient). In contrast, prioritarianism does not have a separate term for dispersion but achieves a similar effect by the concavity of \( f \). The key difference is that prioritarianism does not value equality per se: if two individuals are at the same low level of well-being, then increasing one of them without changing the other does not increase equality (it might even decrease it if we think of relative measures) but it does increase \( W \). Also, if we have two individuals at very different levels, prioritarianism would favor transferring a unit of well-being from the better off to the worse off because of the concavity (the gain at the low end is more than the loss at the high end). But note that egalitarianism might value a state where everyone is equally badly off over a state where some are better off and some are worse off, even if the total sum is the same. Prioritarianism would not: it would prefer the state with a higher total of \( f(w_i) \), which in the case of a strictly increasing \( f \) would be higher if at least one person is better off and none worse off.

  (iii) **Levelling-down objection against egalitarianism**: The objection to egalitarianism is that it must sometimes concede that a world in which the better off have been brought down to the level of the worst off, with no one made better off, is in one respect better (because it is more equal) even though it is worse for everyone (or at least for those brought down).

     Translation: Suppose we have two states: State A with a distribution \( (w_1, w_2, \dots, w_n) \) and State B which is the same as State A except that we have reduced the well-being of the better-off individuals to the level of the worst off. So State B has \( w_i' = \min_j w_j \) for all i. Then egalitarianism, if it values equality intrinsically, must say that State B is better than State A in one respect (equality) even though no one is better off and some are worse off. This is because the dispersion measure (say, the variance or the Gini coefficient) is lower in State B.

     In the thermodynamic analogy, this is like saying that a state with lower energy dispersion (say, a lower temperature) is better in some respect even if the total energy is the same (or even lower). But note: in thermodynamics, we prefer a state with lower energy (if we are minimizing energy) or higher entropy (if we are maximizing entropy). The levelling down would correspond to a state that has the same total energy but is more homogeneous. If our objective function were to include a term that rewards homogeneity (like a negative variance) then we might prefer the homogeneous state even if the total energy is the same. But in thermodynamics, we don't typically have such a term: the entropy is extensive and additive, and we don't add a separate term for variance.

  (iv) **Priority view escapes the levelling-down objection**: The priority view (prioritarianism) escapes this objection because its weighting function is strictly increasing, so that lowering anyone's well-being always reduces the overall welfare \( W \).

     Translation: Since \( f \) is strictly increasing, if we lower any \( w_i \) (without increasing any other) then \( f(w_i) \) decreases and hence \( W \) decreases. Therefore, in the levelling-down scenario, the state where we have brought down the better off to the level of the worst off is strictly worse than the original state because the well-being of the better off has been reduced. There is no compensating gain: the worse off are not made better off (they remain at the same level) and the better off are made worse off. Hence \( W \) decreases.

     In the thermodynamic analogy, if we have a system and we take energy from the high-energy parts and simply discard it (instead of transferring it to low-energy parts) then the total energy decreases. If our welfare function is the total energy (which would be linear in the energy of each part) then we have a decrease. But prioritarianism is nonlinear: however, because \( f \) is strictly increasing, a decrease in any \( w_i \) still reduces the sum. So it is like having a nonlinear transformation of energy that is increasing and concave, but we are still summing the transformed energies. Therefore, any loss of well-being (energy) in any part reduces the sum.

  (v) **Fragility of the escape**: The escape is partial or fragile for several reasons:

     a. How to identify the worse off: by absolute level, by rank in the distribution, or by comparison with others?
     b. Populations that are not fixed in size.
     c. Ranking uncertain prospects rather than settled outcomes.

     Translation:

     (a) In prioritarianism, the weight on a marginal benefit depends on the absolute level of well-being. But if we consider relative deprivation, we might care about the rank or the relative position. This is analogous to defining an intensive quantity (like a concentration) versus an extensive one. The concave transformation in prioritarianism uses the absolute level, but if we care about relative position, we might need a different approach.

     (b) For variable populations, we face the issue of how to define the welfare function. We might need to consider average per person or total. This is analogous to the difference between extensive and intensive quantities. In thermodynamics, for systems of different sizes, we often use densities. But in moral philosophy, there is a debate about whether to maximize total welfare or average welfare. Moreover, the concavity of \( f \) might interact with population size in complex ways.

     (c) When ranking uncertain prospects, we might be interested in the expected welfare. But note that there are two ways: we could compute the expectation of the welfare for each outcome (ex ante) or we could compute the welfare for the expected well-being (ex post). Because \( f \) is concave, by Jensen's inequality, we have:
     \[
     \mathbb{E}[f(w)] \leq f(\mathbb{E}[w])
     \]
     This means that prioritarianism is risk-averse: it prefers a sure outcome to a gamble with the same expected well-being. But the ex ante versus ex post distinction might lead to different rankings. The ex ante approach would compute the expected welfare: \( \mathbb{E}[W] = \mathbb{E}[\sum_i f(w_i)] \). The ex post approach would compute the welfare of the expected well-being: \( W(\mathbb{E}[\mathbf{w}]) = \sum_i f(\mathbb{E}[w_i]) \). These are not the same. The ex ante approach is analogous to an ensemble average: we average the welfare over many realizations. The ex post approach is a single realization at the expected well-being. The distinction is important because in moral philosophy, we might care about the fairness of the process.

  Now, let's examine the reconstruction provided:

  **Reconstruction**: 
  - The claim is that levelling down is the price of admitting an intensive dispersion measure (like the Gini coefficient) alongside an extensive total. Prioritarianism avoids that by using a strictly increasing concave transformation, which makes the welfare Schur-concave (which is a form of inequality aversion) without having to add a separate dispersion term. This avoids the levelling-down objection because the welfare function is strictly increasing in each argument.

  **Testing the reconstruction**:

  1. **Schur-concavity and the connection to concavity**: 
     - A function \( W(\mathbf{w}) \) is Schur-concave if it is non-increasing under any mean-preserving spread (i.e., any transfer from a poorer person to a richer person, if the transfer is not too large, decreases the function). 
     - If \( W(\mathbf{w}) = \sum_i f(w_i) \) and \( f \) is strictly concave, then \( W \) is strictly Schur-concave. This is a standard result. So prioritarianism is Schur-concave and hence inequality-averse. 
     - Therefore, (i) and (iv) are captured exactly.

  2. **Levelling down and dispersion measures**:
     - The levelling-down objection (iii) arises if we have a welfare function that has a term for dispersion. For example, if we had:
       \[
       W = \sum_i w_i - \theta \cdot \text{Gini}(\mathbf{w})
       \]
       then even if we level down (so total \( \sum_i w_i \) decreases and dispersion also decreases) we might not know the net effect without knowing the numbers. But in the pure egalitarian view, we might have a function that increases as dispersion decreases. Then levelling down (which reduces dispersion) would increase that part of the welfare even though the total well-being has decreased. 
     - Prioritarianism does not have such a term. Instead, the concavity of \( f \) automatically makes it prefer transfers from the rich to the poor (without levelling down) but it does not prefer levelling down because that reduces the total \( \sum_i f(w_i) \).

     Thus, the reconstruction seems correct: (iii) is a complaint about combining an extensive total with an intensive dispersion measure. And (iv) is the observation that concavity gives inequality-sensitivity without levelling down.

  3. **Ex ante vs ex post and ensemble averages**:
     - The reconstruction suggests that the ex ante/ex post distinction is the same as the distinction between an ensemble average and a single realization. 
     - But note: in the ex ante approach, we are taking the expectation of the welfare function over possible states of the world. This is indeed an ensemble average. The ex post approach evaluates the welfare at the expected well-being. 
     - However, the question is: which one should we use? In physical systems, we often take the ensemble average as the relevant quantity (like the expected energy). But in moral philosophy, there is a debate about whether we should average first the well-being of each individual (and then apply the welfare function) or apply the welfare function to each state and then average. 
     - The reconstruction is not glib: it is a direct analogy. However, the issue is that in the ex post approach, we are not considering the variability in the outcomes for each individual. The ensemble average (ex ante) captures the risk. But note: the welfare function \( W \) is nonlinear (because of \( f \)), so the two are not the same. 
     - This is analogous to the difference between the expectation of a nonlinear function and the nonlinear function of the expectation. The reconstruction is correct in the sense that the ex ante welfare is the ensemble average of \( W \), while the ex post welfare is \( W \) evaluated at the expected state (which is a single realization).

  **Where the reconstruction breaks**:

  1. **Exchangeability of identical particles**: 
     - In physics, identical particles are exchangeable and we use symmetric wave functions. In moral philosophy, we often assume anonymity: that is, the welfare function is symmetric in the well-being of individuals. This is analogous to exchangeability. But note that in physics, particles are truly identical and we have quantum symmetries. In moral philosophy, we might want to treat individuals as distinct but still hold that their well-being should be treated equally. The analogy is exact for the purpose of the welfare function: we require that \( W \) is symmetric in its arguments. So for fixed population, we can permute the well-being levels without changing \( W \). This is standard.

  2. **Separability and extensivity**:
     - The reconstruction assumes that the welfare function is separable: \( W = \sum_i f(w_i) \). This means that the welfare contribution of an individual depends only on their own well-being. This is analogous to extensivity: the total welfare is the sum of individual welfares. 
     - But is this a requirement? In moral philosophy, there are views that are non-separable. For example, if we care about relative deprivation, then the welfare of an individual might depend on the well-being of others. In that case, we would have a non-separable welfare function. 
     - The reconstruction does not account for non-separable cases. However, the priority view is usually stated as separable. The egalitarian view might be non-separable (if we value equality directly). 
     - So the reconstruction for (i)-(iv) works for separable prioritarianism. The separability is an independent assumption and is not forced by egalitarian motivations. In fact, egalitarianism might be non-separable.

  3. **Identity of persons and the functional over a distribution**:
     - The reconstruction treats individuals as anonymous: we only care about the distribution of well-being. The functional \( W \) is defined over the vector of well-being but is symmetric. This ignores the separateness of persons: the idea that we should not sacrifice one person for the benefit of others. 
     - However, note that prioritarianism (with a strictly concave \( f \)) does allow for transfers from the rich to the poor, which might be seen as sacrificing the rich for the poor. But it does so only when the gain to the poor outweighs the loss to the rich. So it is a form of aggregation. 
     - The inexpressible residue is the idea of personal identity: that each person is a separate entity and that we should not aggregate across them. This is a fundamental objection to any aggregative approach. 
     - Also, the functional approach does not account for the identity of the individuals: it only cares about the levels. But if we have non-separable effects (like envy) then we might care about who has what. 
     - This residue is a defect of the vocabulary: because we are representing the state by a distribution, we are abstracting away the identities. But the original philosophical claims might be about particular persons. However, the claims (i)-(v) as stated do not seem to depend on identity: they are about the worse off and better off in a distribution.

  **Residue report**:

  - **Clean translations**:
     - (i) and (iv) translate exactly: prioritarianism as a sum of concave functions and its avoidance of levelling down due to strict increasingness.
     - (ii) is captured by the distinction between Schur-concavity from a concave function and the use of a separate dispersion measure. The translation is clean.
     - (iii) is translated as the consequence of having a dispersion measure in the welfare function. Clean.

  - **Translations with distortion**:
     - (v): The issues about how to identify the worse off (absolute vs relative) are not fully captured because the concave transformation uses absolute levels. If we need to use relative levels, we might have to redefine the transformation to depend on the entire distribution. This would break separability. The variable population issue is analogous to the system size problem in thermodynamics, but the moral implications might be more contentious. The ex ante/ex post distinction is captured by the ensemble average vs single realization, but the moral significance of the two might not be fully resolved by the analogy.

  - **Inexpressible residue**:
     - **The separateness of persons**: The functional \( W \) is defined as a sum over individuals, which aggregates across persons. But the philosophical idea of the separateness of persons is that we should not aggregate across persons in this way. This is a fundamental criticism of utilitarianism and prioritarianism. The vocabulary cannot express this because it is inherently aggregative.
     - **The "for someone" aspect**: The fact that a benefit is for a particular person and that it matters to that person is lost in the functional. We reduce well-being to numbers. But the qualitative experience of well-being and the first-person perspective are not captured.

  Regarding the residue, I take it to be:
     - For the separateness of persons and the "for someone" aspect: This is a defect of the vocabulary. The functional approach is inherently aggregative and impersonal. The original claims (i)-(v) are stated in a way that does not require the separateness of persons to be expressed, but the debate might involve it. However, the claims themselves are about aggregative functions.

  **Smuggled assumptions**:
