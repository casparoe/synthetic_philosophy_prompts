prompt: |-
  I teach political philosophy, and I am drafting a paper on educational authority. My students keep treating the dispute over schooling as a dispute about choice, and I have become convinced that the real disagreement is upstream of that, in what the state thinks it is doing when it compels and funds schooling. So I want to reconstruct the implicit theory of the institutional package we actually have. Please take the following description as stipulated: I am not asking for a survey of jurisdictions or for case law, and I am happy to grant that it fits most U.S. states only roughly.

  Compulsory-attendance law makes parents liable, sometimes criminally, if a child of a certain age is not, during school hours, either in a school or receiving instruction elsewhere. The state therefore insists that something we might call being schooled take place, and enforces that insistence against parents. But the content of what happens during those hours is regulated in a way that varies inversely with how closely the state is involved in providing it.

  If the instruction happens at home, the same state typically imposes almost nothing on what is taught. There is no approval of curriculum, no requirement that the teacher know the subject, in some places no assessment of any kind. A parent with no qualifications may teach a child that the earth is a few thousand years old, or nothing of modern science at all, so long as the child is minimally occupied with instruction and the ordinary law of abuse and neglect is not triggered. And note that neglect enforcement is triggered by harm, not by educational deficiency: the state will intervene for a starving homeschooled child, but not, in practice, for one who cannot read.

  If the instruction happens in a private school, the state wants attendance records, health and safety compliance, and sometimes a loose showing that instruction is comparable to public instruction. It does not require that the school admit all applicants, teach a comprehensive curriculum, or conduct itself as a secular institution. In most places it will also decline to fund it.

  If the instruction happens in a district school, the state regulates content heavily: standards, mandated curricula, assessments, teacher certification. Yet here, and only here, parents get a partial veto over exposure. In many states a parent may withdraw a child from particular units on conscience grounds, with sex education the standard case, though not from the curriculum as a whole, and not from the assessment regime attached to it.

  Finally, public money attaches to the seat a child occupies in a district school. Remove the child, and the money stays behind.

  The configuration I cannot reconstruct has four limbs. The state compels the fact of schooling but not its content. It permits exit from the institution while refusing to follow the child with the funding. It grants parents a right against exposure to particular material inside the public system, while granting them, outside it, an almost unlimited right to determine content. And the deregulation of homeschooling is commonly defended on the ground that parents love their children and are therefore reliable agents of their interests, which sits badly with a public-school regime that treats parental conscience as a threat to the child's education whenever the two come apart.

  So: what theory of the child's interests, of parental authority, and of the state's stake in education does this package presuppose? More specifically, I would like the following distinguished.

  First, does the package presuppose that what the state may secure is custodial and socializing, rather than cognitive? On that reading, the state's interest is discharged by the child's being somewhere supervised, in the company of peers and of views other than the family's, and the state has no business in what anyone learns. Does the compulsory-attendance limb actually require that reading, or is it also available to a view on which the state is entitled to secure real learning and is simply failing to?

  Second, does the asymmetry between the exposure veto and the content discretion presuppose a distinction between encounter and mastery, such that the state's interest is in the child's having encountered the range of reasonable views, an interest that a conscientious objection can defeat, while the question of what the child actually comes to know and be able to do is nobody's constitutional business? If so, is that a coherent place to stop, given that a withdrawal right exercised unit by unit can empty the curriculum while satisfying the exposure interest on paper?

  Third, does the practice presuppose a conception of parental authority as a right of exit rather than a right of shaping, and is that conception stable, or does the homeschooling limb quietly concede the right of shaping in the one sector where the state's exposure interest is least well served?

  I would also like to know which of these the practice strictly requires, which it merely fits well with, and where it is simply underdetermined, so that several quite different theories would license it. And then: what would have to change? Which of the four limbs becomes indefensible if the operative view were replaced by a child's-rights view on which an education is owed to the child as a precondition of her future autonomy, or by a civic-republican view on which the state's interest is in the formation of future citizens, or by a thoroughgoing parental-authority view on which education is an aspect of childrearing? If one of those views makes more of the package coherent than the others do, I want to know which, and what the residual incoherence is.
reasoning: |-
  Hmm, this is a fascinating and complex query from a political philosophy professor about educational authority. The user is trying to reconstruct the implicit theory behind the "package" of educational policies in the US - compulsory attendance with varying content regulation depending on setting. They've outlined four key limbs of this configuration that seem contradictory on the surface.

  The user is clearly wrestling with some fundamental tensions in educational philosophy. On one hand, the state compels schooling but doesn't regulate homeschool content. It funds public schools but won't follow the money if parents exit the system. Parents get limited veto power over content in public schools but near-total control when homeschooling. And the justification for homeschooling deregulation (parental love) contradicts how public schools view parental objections.

  I need to address their three specific questions about what this package presupposes: 1) whether the state's interest is merely custodial/socializing rather than cognitive; 2) whether there's an exposure/mastery distinction at play; and 3) whether parental authority is framed as exit rights rather than shaping rights. Then I should analyze which philosophical views make this configuration coherent or incoherent.

  The key to reconstructing this implicit theory seems to be recognizing how the state positions itself relative to parents. The state acts as guarantor of minimum conditions (attendance, safety) but delegates educational substance to parents through various exit options. This creates a "zone of parental sovereignty" where the state only intervenes at extremes (abuse/neglect), while maintaining a default public system for those who don't exit.

  For their first question - the compulsory attendance law does suggest the state cares about more than just custody. The language of "instruction" implies some cognitive element, but the state seems content to outsource what that instruction consists of to parents via the exit options. The minimal regulation of homeschooling shows the state isn't actually trying to guarantee learning outcomes, just the formal opportunity.

  On the second question about exposure vs mastery - the limited veto rights in public schools while allowing total content control in homeschooling suggests the state cares more about preventing forced exposure to objectionable material than ensuring actual knowledge acquisition. This is philosophically unstable though, as conscientious objections could theoretically hollow out the curriculum while technically satisfying exposure requirements.

  For the third question - the configuration absolutely privileges parental authority as a right of exit rather than a right to shape public institutions. Homeschooling becomes the pressure valve where shaping rights are fully conceded, precisely because it doesn't challenge the public system's structure. This reveals parental authority is fundamentally negative - freedom from state imposition rather than a positive right to direct public education.

  Regarding which philosophical views fit best - a mild parental authority view makes the most sense of all four limbs, though imperfectly. Child-centered autonomy views can't explain the homeschooling deregulation. Civic republican views are undermined by the lack of content oversight in private options. More extreme parental authority views would demand funding portability.

  The residual incoherence comes from the state's ambiguous stance: it gestures toward civic and developmental interests in public schools but abandons them when parents exit. This suggests the state's primary concern may actually be maintaining the public system itself as the default provider, while accommodating dissent through opt-outs that don't fundamentally challenge it. The user's insight about this being upstream of choice debates seems correct - the configuration reflects deeper compromises about state and parental roles.
answer: |-
  Your analysis brilliantly identifies the core tensions in this institutional configuration. Let's reconstruct the implicit theory step by step, addressing your specific questions and evaluating philosophical coherence.

  ### Core Presuppositions of the Existing Package
  1. **The State's Primary Interest: Custodial & Socializing (Not Cognitive)**
     - **Presupposition:** The state's compelling interest is satisfied by securing *that* children are in a supervised environment with age peers, exposed to non-familial influences during designated hours. Cognitive outcomes are secondary.
     - **Evidence:** Minimal homeschooling regulation (no curriculum approval, teacher qualifications, or meaningful assessments) demonstrates the state does not enforce learning standards. Neglect triggers only on physical harm, not educational failure.
     - **Distinction:** This *strictly requires* that the state's interest is not primarily cognitive. If it were, homeschooling deregulation would be indefensible. The state claims a right to *compel the activity* ("instruction") but not to *define or verify its success*.

  2. **Exposure vs. Mastery: A Fragile Distinction**
     - **Presupposition:** The state has an interest in children being *exposed* to a range of ideas (hence the public curriculum) but no enforceable interest in *mastery* or belief formation. Parental conscience vetoes protect against enforced ideological engagement.
     - **Evidence:** Limited opt-outs (e.g., sex ed) acknowledge exposure as a state concern, while allowing parents to block deep engagement. Homeschooling’s total content freedom shows mastery is irrelevant to the state.
     - **Coherence Problem:** This distinction collapses under scrutiny. A parent can use unit-by-unit opt-outs to functionally nullify exposure (e.g., withdrawing from evolution, climate science, LGBTQ history), rendering "exposure" nominal. The package *fits* this distinction but does not *strictly require* it; it could equally imply state indifference to both exposure and mastery outside public schools.

  3. **Parental Authority as Exit Right (Not Shaping Right)**
     - **Presupposition:** Parental authority is negative: the right to *exit* state-provided education, not the right to *shape* it. The state retains sovereignty over public institutions.
     - **Evidence:** Funding doesn't follow the child, and public schools resist parental curriculum demands beyond narrow opt-outs. Homeschooling becomes the "pressure valve" where exit converts into unlimited shaping rights.
     - **Stability:** This is unstable. Homeschooling *does* concede a parental right to shape education, but only by sacrificing the state's exposure interest (peers, diverse views). The implicit bargain: parents can shape content *if* they fully exit the state’s apparatus—funding, socialization, and oversight. The "parental love" justification for homeschooling deregulation quietly undermines the public system’s assumption that parents threaten education when conscience conflicts arise.

  ### What the Practice Strictly Requires vs. What it Fits
  | **Presupposition**          | **Strictly Required** | **Fits Well** | **Underdetermined** |
  |-----------------------------|------------------------|---------------|----------------------|
  | **State interest is custodial/socializing** | ✓ | | |
  | **No state interest in cognitive mastery** | ✓ | | |
  | **Exposure ≠ Mastery distinction** | | ✓ | |
  | **Parental authority = exit right** | ✓ | | |
  | **State sovereignty over public school content** | ✓ | | |
  | **Parental shaping rights contingent on full exit** | | ✓ | |

  ### Testing Alternative Philosophical Views
  Here’s how the package holds up under competing theories, and what would need to change:

  1. **Child-Centered Autonomy View**  
     (Education as precondition for future autonomy)  
     - **Incoherence:** The package collapses. If education is a child’s right, the state must ensure *actual learning* (literacy, critical skills), not just attendance. Homeschooling deregulation and lack of assessments become indefensible.  
     - **Required Changes:**  
       - Mandatory curriculum standards and outcomes testing for *all* settings (including homeschool).  
       - Funding portability to ensure access to quality options.  
       - Elimination of content opt-outs (undermines autonomy preparation).  
     - **Residual Incoherence:** Parental exit rights conflict with state’s duty to the child.

  2. **Civic Republican View**  
     (State’s interest in forming citizens)  
     - **Incoherence:** Extreme. Private/homeschool content freedom (e.g., teaching white supremacy, rejecting democracy) directly undermines civic formation. The "exposure" interest in public schools is too weak without mastery.  
     - **Required Changes:**  
       - Mandated civic curriculum for *all* schools (including homeschool).  
       - Restrictions on private schools that reject pluralism/secular knowledge.  
       - Elimination of conscience opt-outs for civic content (e.g., history, government).  
     - **Residual Incoherence:** Parental authority is subordinated to state interests.

  3. **Thoroughgoing Parental Authority View**  
     (Education as aspect of childrearing)  
     - **Incoherence:** The state’s compulsory attendance law and public system are unjustified intrusions. Content regulation in public schools contradicts parental rights.  
     - **Required Changes:**  
       - End compulsory attendance laws (or convert to truancy laws unrelated to schooling).  
       - Full funding portability (vouchers/scholarships).  
       - Parental control over public school curriculum (e.g., school board dominance).  
     - **Residual Incoherence:** The state’s socializing/custodial interest lacks justification.

  ### Which View Best Fits the Existing Package?
  A **modified parental authority view** makes the most sense of the configuration—but reveals its core contradictions:
  - **Strengths:** Explains deregulation of homeschooling (parental sovereignty zone) and private schools (parental choice). Justifies minimal state interest beyond custody/socialization.
  - **Weaknesses:** Fails to explain why the state compels *schooling* rather than mere supervision, or why it maintains a heavily regulated public system. The "exposure" interest in public schools is half-hearted and inconsistent with homeschooling freedom.
  - **Residual Incoherence:** The state acts as if parents are trustworthy educators when they exit (homeschooling) but untrustworthy when they stay (public school opt-outs). This suggests the *real* presupposition is **institutional pluralism**: the state’s primary interest is maintaining a *default public system* for social cohesion, with exit options to accommodate dissent *without challenging the system’s structure*. Funding remains attached to public schools because they are the state’s chosen instrument for socialization—not because it prioritizes learning outcomes.

  **Conclusion:** The package presupposes a state that prioritizes social order and custodial supervision over cognitive development or civic formation. Parental rights are negative liberties (exit), not positive claims on the state. This works only if we accept two uneasy compromises: (1) The state abandons educational goals when parents exit, and (2) "Exposure" is a symbolic gesture toward pluralism, not an enforceable standard. To make the system coherent, you must either embrace a minimalist state (retreating to custody-only) or abandon deregulated exit (embracing child-centered or civic goals). The current configuration is a unstable byproduct of political bargaining, not philosophical consistency.
