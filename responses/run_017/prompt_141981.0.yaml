  ### Decision Procedure for Risk Register Entries  
  **Grounding in Future Contingents Theory**:  
  Philosophers (e.g., Aristotle, Łukasiewicz) argue that **future contingents** (e.g., "Sea battle tomorrow") lack a present truth value until conditions causally determine the outcome. This contrasts with **epistemic uncertainty** (unknown but determinate facts) and **vagueness** (ill-defined events). The procedure enforces:  
  - **No probability** for non-genuine events (vagueness, no fact of the matter).  
  - **Conservative estimates** only when evidence exists (epistemic uncertainty).  
  - **Explicit risk-appetite judgments** for open decisions (agency choices).  

  **Procedure (10 min/entry)**:  
  1. **Settlement Condition Check**  
     - *Requirement*: Specify a binary outcome (occur/not occur) verifiable by a **fixed date**, with unambiguous criteria (e.g., "first passenger train departs").  
     - *Fail* → Mark **"Indeterminate: Vague"**. No probability. Proceed to Step 4.  
     - *Theory Basis*: Rejects vagueness (no defensible probability).  

  2. **Future Contingent?**  
     - *Ask*: "Does the outcome *depend on an unrealized agency decision*?"  
       - **Yes** (e.g., "we close the tunnel") → **"Agency Decision"**. Go to Step 3A.  
       - **No** (e.g., cyclone, regulator action) → **"Exogenous Event"**. Go to Step 3B.  
     - *Practice Distinction*: Only agency decisions are "true" future contingents (free will). External events have determinate (but unknown) facts.  

  3. **Assign Probability/Rationale**  
     - **3A. Agency Decision (Future Contingent)**:  
       - *Requirement*: State current policy/intent.  
       - *Probability*: **Not a chance, but a commitment level** (risk-appetite judgment).  
         - If policy exists (e.g., "no closure planned"): Assign **5–20%** (reflects flexibility to change).  
         - If undecided: Assign **50%** but label **"Placeholder: No Agency Position"**.  
       - *Downstream*: In aggregate models, treat as a **scenario branch** (not a probability).  
     - **3B. Exogenous Event (Epistemic Uncertainty)**:  
       - *Requirement*: Use evidence (data, expert judgment).  
       - *Probability*: If no evidence → Mark **"Unestimable: No Basis"**. Assign **conservative point estimate**:  
         - High risk (e.g., project failure): **Upper-bound estimate** (e.g., 75%).  
         - Low risk (e.g., rare event): **Lower-bound estimate** (e.g., 5%).  
       - *Theory Basis*: Rejects 50% as arbitrary. Conservative bounds reflect risk appetite.  
       - *Downstream*: In aggregate models, use **sensitivity analysis** (±20% on conservative estimate).  

  4. **Handle "Open" Entries**  
     - **Indeterminate/Unestimable**: No probability. Rationale must specify:  
       - *Settlement clarity needed* (if vague).  
       - *Evidence gaps* (if unestimable).  
     - **Board Defense**: "No defensible single number. Risk cannot be quantified without [clarity/evidence]."  

  5. **Risk-Appetite Flags**  
     - Mark judgments where theory ends and policy begins:  
       - Conservative bounds for unestimable events.  
       - Probability assignments for agency decisions.  
       - Settlement condition definitions.  

  ---

  ### Application to Draft Entries  
  **1. Cyclone Landfall**  
  - *Settlement*: Verifiable (weather data), fixed season end. **Pass**.  
  - *Future Contingent?*: No (exogenous event).  
  - *Estimable?*: Yes (historical data, models).  
  - **Probability**: **12%** (e.g., based on 20-year frequency).  
  - *Rationale*: "Historical cyclone data for the region shows 12% annual probability. Modeled using NOAA Cat 3+ tracks."  
  - *Verdict*: Defensible.  

  **2. Regulator Revokes Licence**  
  - *Settlement*: Verifiable (regulatory notice), 18-month deadline. **Pass**.  
  - *Future Contingent?*: No (external decision, but facts exist).  
  - *Estimable?*: **No** (high uncertainty; no precedent, opaque process).  
  - **Probability**: **Unestimable: No Basis**. Assign conservative **30%** (high risk appetite).  
  - *Rationale*: "No data on revocation under current conditions. Conservative 30% reflects worst-case regulatory stance."  
  - *Risk-Appetite Flag*: Conservative bound chosen due to high impact.  
  - *Verdict*: You won’t like this (board may demand a number), but defensible refusal: *"No empirical or expert basis for quantification. 30% is a conservative proxy for risk appetite, not a probability."*  

  **3. Northern Link Operational by 2029**  
  - *Settlement*: **Fail** ("operational" undefined; first train? safety sign-off?).  
  - **Probability**: **Indeterminate: Vague**. No number.  
  - *Rationale*: "Event lacks settlement criteria (e.g., 'first passenger service'). Refuse quantification until clarified."  
  - *Board Defense*: "Blank is unavoidable. Specify: 'Project completion per Section 4.2 of Gateway Agreement'."  
  - *Verdict*: Defensible refusal. Forces board to define terms.  

  ---

  ### Where the Procedure Misfires  
  1. **Distinguishing Contingency vs. Uncertainty**:  
     - In practice, "no fact of the matter" (e.g., agency decision) vs. "unknown fact" (e.g., regulator action) relies on **causal attribution**. Misclassification risks treating epistemic gaps as ontological freedom.  
     - *Mitigation*: Strictly tie "future contingent" label to agency control.  

  2. **Conservative Estimates as "Faux Precision"**:  
     - Bounds (e.g., 30% for revocation) may be conflated with data-driven probabilities.  
     - *Mitigation*: Label **"risk-appetite proxy"** in rationale.  

  3. **Vagueness vs. Uncertainty**:  
     - Poorly defined events (e.g., "operational") mimic epistemic uncertainty but stem from language, not evidence.  
     - *Mitigation*: Settlement condition forces operationalization.  

  4. **Downstream Aggregation**:  
     - Placeholder 50% for agency decisions distorts portfolio models (e.g., overweights undecided items).  
     - *Fix*: Model agency decisions as **binary scenarios** (e.g., "if tunnel closes: X; if not: Y").  

  **Conclusion**: This procedure enforces philosophical rigor on definability and agency, replaces 50% with conservative/scenario-based approaches, and flags risk-appetite judgments. It misfires when causal ambiguity blurs contingency/uncertainty lines—but this is a feature, not a bug: it reveals where risk is unquantifiable and demands board engagement.
