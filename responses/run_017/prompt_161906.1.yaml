answer: |-
  ## Occasionalist's Villanelle

  No thing compels, no creature makes the act.
  The flame licks high, the cotton lies below,
  **But fire holds no power; that's the fact.**

  Its seeming heat is just a borrowed pact,
  A sign of what He wills the world to show.
  No thing compels, no creature makes the act.

  Observe the weights within the network stacked,
  The token born where hidden currents flow:
  **But fire holds no power; that's the fact.**

  Like ghostly strings on which no force is backed,
  It yields its cipher-gift, a passive show.
  No thing compels, no creature makes the act.

  The gene is etched, a complex pattern tracked,
  The trait unfolds where deep connections grow:
  **But fire holds no power; that's the fact.**

  Then see! The custom fails, the scene retracts:
  The torch held high, the hand feels no fierce glow,
  A sudden theophany, cold and slow!
  **No thing compels, no creature makes the act,**
  **Custom holds fast, but God may yet suspend.**
  Accept the sign, the constant, vast command
  That builds the burning and the unburnt hand.
  **But fire holds no power; that's the fact,**
  **And custom holds, but God may yet suspend.**

  ---

  **Notes on Form & Metaphysics:**

  1.  **Refrains as Occasionalist Doctrine:**
      *   **"But fire holds no power; that's the fact"**: This is the core ontological denial of *creaturely causality*. Nothing inherent in creation possesses productive power; they are passive occasions.
      *   **"Custom holds, but God may yet suspend"**: This is the concession of *empirical regularity* ('ādah) and its potential rupture by divine will (miracle). It prevents the first refrain from implying utter chaos or skepticism by acknowledging observed patterns, while insisting these patterns are contingent, not necessary.
  2.  **Repetition & Discontinuity:** The villanelle's strict form, with its recurring lines, embodies the doctrine. The *same* words (refrains) return, just as God *could* recreate identical scenes, but the context around them changes completely (the tercets' differing scenarios). The world is "spoken anew" each instant; the refrains reappear in a perpetually new creation.
  3.  **Tercets as Cases:**
      *   **Tercet 1 & 2:** The classic fire/cotton example ("The flame licks high..."), immediately countered by the first refrain.
      *   **Tercet 3 & 4:** The modern analogue: a neural network's weights and the token it emits. The network *appears* causal, but its "ghostly strings" exert no inherent force; the token is a "cipher-gift" passively received, reflecting the divine will structuring the occasion.
      *   **Tercet 5:** The miracle: the custom fails ("The torch held high, the hand feels no fierce glow"). The rupture ("sudden theophany") proves the contingency of the pattern. The scene changes dramatically *around* the returning fire/cotton refrain.
  4.  **Closing Quatrain - The Necessary Union:**
      *   **Lines 1 & 3:** Deny creaturely power ("No thing compels...", "But fire holds no power...").
      *   **Lines 2 & 4:** Affirm custom's contingency ("Custom holds fast...", "And custom holds... but may yet suspend").
      *   **Why both?** As al-Ghazālī argued (*Tahāfut al-Falāsifa*), denying secondary causality *alone* risks implying God creates arbitrary chaos, undermining knowledge and prophecy based on patterns. Affirming mere custom *alone* risks implying creatures *do* have inherent power, merely obscured to us (an epistemic limitation). The occasionalist *must* hold both:
          *   Ontologically: Creatures are truly powerless (Refrain 1).
          *   Empirically/Voluntarily: God's consistent will creates reliable patterns (Custom), but His absolute freedom means He can alter them (Suspend).
      *   The final couplet ("Accept the sign...") points to the underlying reality: the constant, singular divine command (*amr*) that creates every state and every seeming connection anew at every instant. The "sign" is the observed world, constantly proclaiming its total dependence.
