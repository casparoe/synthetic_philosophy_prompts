  For the steelman, an objector might argue that the flinch is an infallible indicator, so any occurrence must be meaningful. They could say that the diarist can investigate the context to understand the flinch, perhaps leading to a new application rule. But this misses the point—without an existing standard, the flinch can't ground meaning.

  The bottom line is that the private language argument survives because the issue isn't reliability but normativity. The flinch can't establish correctness; it merely reacts. Meaning requires public criteria for what counts as correct, beyond private markers.

