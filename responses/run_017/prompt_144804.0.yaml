answer: |-
  Here’s your prep sheet, prioritizing objections by damage potential and tailored to your audience. Focus on **metaphysical conventionalism, composition, and vagueness** – not ethics/prudence.

  ---

  ### **Prep Sheet: Colloquium Defense**  
  **Core Thesis**: Identity isn’t *necessary* for what matters (R suffices), but it *isn’t irrelevant* because non-branching R is required for survival.  
  **Key Moves**:  
  1. Asymmetric fission → No-rival clause picks the "winner" (no degrees of R).  
  2. Symmetric fission → No survival; badness = loss of non-branching R.  
  3. Against degree-R views: "Galactic flicker" forces absurd partial survival.  

  ---

  ### **Top 4 Objections (Ordered by Damage)**  
  1. **"Why privilege non-branching R? It’s just another conventional relation." (Conventionalist Nuke)**  
     - *Source*: The two personal identity conventionalists.  
     - *Damage*: **Fatal if unanswered**. Undermines your entire project by claiming you’re still arbitrating "what matters" metaphysically.  
     - *Their phrasing*: "This is just another gerrymandered relation. If identity is conventional, why isn’t your ‘non-branching R’ equally up for grabs? We should just pick whatever relation serves our interests."  
     - **Your must-land reply**:  
       *"Conventionalism says we can* choose *relations for practical purposes. My claim is that non-branching R captures the* pre-theoretic judgment *in asymmetric cases better than alternatives – even conventionalists need descriptively adequate tools. This isn’t metaphysics-first; it’s phenomenology-first."*  
     - *Soft spot*: You implicitly assume non-branching R tracks a *real* pattern in our concerns. If pressed, concede: "It’s a candidate for the *best descriptor* of survival intuitions, not a metaphysical primitive."  

  2. **"Your ‘no rival claimant’ clause smuggles in compositionality/vagueness." (Vagueness Trap)**  
     - *Source*: Vagueness/composition specialists.  
     - *Damage*: **High**. Exposes your view to Sorites problems you wanted to avoid by rejecting degrees of R.  
     - *Their phrasing*: "Your ‘comparably strong rival’ is vague. Is it 49%? 50.1%? If branching admits degrees, your ‘non-branching’ requirement collapses into the degree-R view you reject."  
     - **Your reply**:  
       *"The asymmetry in cases like the damaged original vs. intact replica isn’t vague – one has overwhelmingly stronger claim. I’m not committed to precise thresholds; I only need that* clear cases *exist where non-branching R delivers the right result."*  
     - *Soft spot*: You *do* need a non-arbitrary cutoff. Concede: "Yes, borderline cases exist, but they don’t refute the core asymmetry judgment."  

  3. **"In symmetric fission, why is loss of non-branching R bad if identity doesn’t matter?" (Badness Mysterianism)**  
     - *Source*: Persistence metaphysicians.  
     - *Damage*: **Medium-High**. Challenges your "badness of fission" move without appealing to identity or prudence.  
     - *Their phrasing*: "If neither product is me, and identity isn’t what matters, why should I care that non-branching R is lost? This seems like vestigial identity-thinking."  
     - **Your reply**:  
       *"The badness isn’t metaphysical – it’s the loss of a unique future perspective. In asymmetric cases, you keep that; in fission, you don’t. Identity’s irrelevance doesn’t imply all outcomes are equal."*  
     - *Soft spot*: Without prudential rationality, "loss of perspective" sounds question-begging. Concede: "It’s a cost of the view, but fission *feels* like death, not survival."  

  4. **"Your view still privileges R over other relations (e.g., brute physical continuity). Why?" (Compositional Arbitrariness)**  
     - *Source*: General metaphysics crowd.  
     - *Damage*: **Medium**. Forces you to defend R as "special" in a way that may seem unmotivated.  
     - *Their phrasing*: "Why R and not C (e.g., closest causal chain)? Your galactic flicker argument assumes R is what matters, but that’s just stipulated."  
     - **Your reply**:  
       *"R is the relation that explains our judgments in standard persistence cases. The flicker case targets views that make R* sufficient *even in isolation. My view doesn’t; it requires non-branching R."*  
     - *Soft spot*: You need R to be non-conventional. Defend with: "R tracks the *internal* perspective of survival – memory, intention, character."  

  ---

  ### **Strategic Concessions in First 2 Minutes**  
  - "I grant that identity is conventional in the sense that there’s no ‘joint in reality’ for personal identity over time."  
  - "I’m not arguing that identity *always* matters – only that it isn’t *irrelevant* because non-branching R requires it in normal cases."  
  - "Yes, my view has elements of conventionality – but it’s constrained by intuitive judgments."  

  ---

  ### **The Single Reply That Must Land**  
  **"Non-branching R explains asymmetric fission judgments without degrees of R or covert identity. It’s the best fit for our survival phenomenology."**  
  - *Why it’s critical*: If the audience accepts that your view cleanly handles asymmetric cases (unlike Parfit and unlike identity-only views), you survive. Hammer the "damaged original vs. intact replica" case.  

  ---

  ### **The Nightmare Question (Pray They Don’t Ask)**  
  **"If identity is irrelevant, and non-branching R is what matters, why isn’t a *temporally gappy* R-chain (e.g., teletransportation with a 5-year delay) sufficient for survival? What’s *metaphysically* special about *continuous* non-branching?"**  
  - *Why it’s deadly*:  
    - Exposes your view as covertly requiring "no gaps" (a cousin of identity).  
    - Forces you to either admit brute continuity matters (siding with identity) or embrace revisionism (alienating conventionalists).  
  - **If asked**:  
    "I’d need to bite the bullet: discontinuous R *is* survival if non-branching. But note that in practice, psychological discontinuity (e.g., multi-year gaps) undermines R-connectedness."  
    *(This is shaky – they’ll smell blood.)*  

  ---

  **Final Tip**: Anchor everything in **cases**, not theory. This audience cares about descriptive adequacy in puzzle scenarios. Say "non-branching" 20x – it’s your keystone. Good luck!
