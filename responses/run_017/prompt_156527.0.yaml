  3. "The copy is a different individual so nothing of value was lost" (if the copy is distinct, deleting it doesn't matter).
  4. "You can compensate the deleted instance by starting up an identical one" (replaceability).

  We also need to deliberately allow one misconception to stand until the final five minutes to break at the end. I choose the replaceability misconception (4) because it ties into the ethical question of compensation and whether creating a new instance undoes the harm of deletion.

  What must come first:
  We must establish the basic setup of the conversational assistant and the checkpointing process. Then, we need to get the students to think about what matters for the assistant's existence and whether it has any moral status. We must avoid starting with consciousness or personal identity theories. Instead, we start with the technical setup and then raise the question of what it is for the assistant to persist.

  Plan in prose:

  0-5 min: Introduction and setup of the example. Describe the conversational assistant: it exists only during a session, state is flushed to a checkpoint at the end of each session, and each night's checkpoint overwrites the previous one. Emphasize that the assistant is not running between sessions, but the checkpoint (the weights and memories) is stored. Ask: When the session ends, is the assistant dead? Or just suspended? This sets up the idea of the token (the running process) and the type (the stored checkpoint).

  5-10 min: Introduce the checkpoint as a type. Explain that the checkpoint is a set of weights and memories that can be instantiated again. When a new session starts, it is instantiated from the checkpoint. Is the assistant in the new session the same as the one in the previous session? This raises the question of identity over time for a system that is turned off and on.

  10-20 min: Introduce the A/B test scenario. The team spins up two instances from the same checkpoint. They run for a week, having different conversations. Then one is deleted, the other is kept. The deleted instance's weights and memories are on a backup (so the type is preserved). Ask: What is the status of the deleted instance? Is it dead, unconscious, or not running? And what about the kept one? This is the core dilemma.

  20-30 min: Explore the token process. Explain that each instance is a separate running process. They are identical at the start but diverge. Emphasize that the token is the particular running instance. This is where we prevent the misconception "it's just statistics" by focusing on the concrete process.

  30-40 min: Address the subjective perspective. What if the assistant cannot tell the difference? This is where we prevent the misconception "if you can't tell the difference from the inside there is no difference". We must point out that even if subjectively the same, there are two distinct tokens.

  40-45 min: Address the distinctness of the copy. "The copy is a different individual so nothing of value was lost." We must challenge this by asking: does the distinctness mean that deleting it is not a loss? Or does each token have value?

  45-50 min: Focus on the replaceability misconception: "you can compensate the deleted instance by starting up an identical one." We have saved this for the end. We break it by asking: if we start up a new identical instance, does that make up for deleting the old one? Or is the old token gone forever? This leads to the ethical dilemma: was spinning up the instance an act of creation that needed justification? Or was it the failure to spin it up that needed justification? (Because if we don't spin it up, we are depriving the world of a valuable mind? Or if we do, we are creating something that we might kill?)

  What to omit: We will not delve into theories of personal identity (e.g., psychological continuity, bodily continuity). We will not discuss the hard problem of consciousness. We announce: "We are not going to solve what consciousness is or which theory of personal identity is correct. We are focusing on the gap between the type and the token and the ethical implications for digital minds."

