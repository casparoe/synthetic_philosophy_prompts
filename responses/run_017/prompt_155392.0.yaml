  Hmm, the user is designing a handout for a graduate seminar in environmental ethics focused on whether habitat destruction reduces wild animal suffering. The seminar is stuck because participants are answering different questions without realizing it. They want a decision tree to clarify these positions, with specific constraints.

  First, I need to understand the core problem: participants conflate different aspects like immediate deaths during clearing, prevention of future births, welfare changes for survivors, and whether to count suffering intensity vs number of sufferers. The user wants a tool to disentangle these.

  The constraints are detailed. I must create 7-9 branching questions that are case-based, not label-based. At least two nodes need to be empirical—focusing on what habitat conversion actually does to populations and welfare flows. For example, one node should distinguish between the pulse harm of clearing and the steady-state afterward. Another must address counterfactual land use, like conversion to pavement versus pasture, as this affects outcomes.

  For the currency of aggregation, I need a node that considers whether we count individuals, welfare-range-weighted individuals (accounting for body size and sentience capacity), average welfare, or just suffering. This is key because conversion often shifts ecosystems toward smaller, fecund animals, and the verdict depends on whether we weight their welfare.

  Another node must handle the moral status of never-born animals and whether death itself is harmful beyond the suffering involved. This separates person-affecting views from total utilitarian ones.

  Displacement and leakage should be addressed too—whether animals die, relocate, or reproduce elsewhere, as this changes the net effect.

  Now, structuring the decision tree. I'll start broad and narrow down. First, ask about the time frame: pulse harm versus long-term effects. Then, for long-term, differentiate between survivor welfare and counterfactual births. The counterfactual land use node should come early since it sets the empirical context. 

  For axiological nodes, sequence them to split views efficiently. After deciding if we count prevented births, ask if death is a harm. Then handle currency of aggregation. Displacement effects should come later as they modify the outcome.

  I need to identify leaf positions. Named views include negative utilitarianism, prior existence utilitarianism, etc. Some combinations might be unexplored or incoherent. For example, if someone thinks death isn't a harm but counts prevented births as a loss, that might be incoherent because preventing a birth would be denying a life that could be good.

  The user mentioned awkward commitments for each leaf. For instance, negative utilitarians might have to accept that mass extinction reduces suffering, which is counterintuitive. Total utilitarians might endorse habitat conversion if it leads to more happy animals, ignoring wild suffering.

  Finally, I should note overlaps. For example, some positions might converge on the verdict despite different paths. Also, suggest to the seminar leader that the empirical node on counterfactual land use is likely the main point of disagreement because real-world outcomes vary and data is contested, whereas axiological debates are more theoretical.

  I'll ensure the tree fits on two pages, with a table summarizing nodes and answers. The language must be accessible, using questions like "Should we include the welfare of animals never born?" instead of jargon.
answer: |-
  ### Decision Tree: Habitat Destruction & Wild Animal Suffering  
  *For determining net welfare effect sign (+/-) in representative conversion scenarios*

  ---

  **Stage 1: Branching Questions**  
  *(Answers define logical pathways; * denotes empirical nodes)*

  1.  **Does conversion eliminate *all* sentient life on the land?**  
      *Permitted answers*: (a) Yes (e.g., paving); (b) No (e.g., pasture/cropland retains synanthropes).  
      *(Forces counterfactual land-use distinction; *empirical)*

  2.  **Should we include the welfare of animals *never born* due to habitat loss?**  
      *Permitted answers*: (a) Yes (impersonal); (b) No (person-affecting/prior existence).

  3.  **Is premature death *itself* a harm beyond the suffering of dying?**  
      *Permitted answers*: (a) Yes (deprivationism); (b) No (only suffering matters).

  4.  **What happens to displaced animals?**  
      *Permitted answers*: (a) Die earlier elsewhere; (b) Reproduce elsewhere; (c) Killed during clearing.  
      *(Addresses leakage/displacement; *empirical)*

  5.  **What is the primary welfare currency?**  
      *Permitted answers*:  
      (a) Number of suffering experiences;  
      (b) Number of individuals (suffering-capable lives);  
      (c) Welfare-range-weighted individuals (e.g., by brain complexity/body size);  
      (d) Average welfare per life.

  6.  **Does conversion reduce long-term *population density* of sentient beings?**  
      *Permitted answers*: (a) Yes; (b) No.  
      *(Critical for survivor welfare; *empirical)*

  7.  **Does conversion reduce *average suffering intensity* per animal?**  
      *Permitted answers*: (a) Yes (e.g., fewer predators/starvation); (b) No (e.g., more disease/density stress).

  ---

  **Stage 2: Leaf Positions**  
  *(Verdict: Net welfare effect sign for clearing → intensive agriculture. "Unnamed" if no standard label)*

  | Path (Answers)                   | Position Name                     | Verdict (+/-)                                  | Awkward Commitment                                                                 |
  | :------------------------------- | :-------------------------------- | :--------------------------------------------- | :--------------------------------------------------------------------------------- |
  | 1a, 2b, 3b, 4c, 5a, [6,7 n/a]    | **Pain-focused Negative Utilitarian** | **-** (Clearing reduces suffering)             | Must accept that preventing all future wild births is morally imperative.          |
  | 1a, 2a, 3b, 4c, 5a, [6,7 n/a]    | **Impersonal NU (Suffering-Count)** | **-**                                          | Implies paving wilderness is net positive if clearing deaths < suffering prevented. |
  | 1b, 2a, 3b, 4a, 5c, 6b, 7b       | **Unnamed**                       | **+** (Net harm)                               | Assumes small-bodied synanthropes (e.g., rodents) have non-trivial welfare ranges. |
  | 1b, 2a, 3b, 4b, 5b, 6a, 7a       | **Ecosystem Engineering Optimist** | **-**                                          | Requires belief that converted land hosts fewer, happier animals long-term.        |
  | 1b, 2b, 3b, 4c, 5a, 6b, 7b       | **Prior Existence Sufferist**     | **+**                                          | Denies moral weight to both prevented births and death itself; only clearing pain counts. |
  | 1b, 2a, 3a, 4c, 5d, 6b, 7b       | **Total Utilitarian (Average)**   | **+**                                          | Must defend that death harms the killed *and* prevented births harm the never-born. |
  | 1b, 2a, 3a, 4b, 5b, 6a, 7a       | **Unnamed**                       | **-**                                          | Assumes displaced animals die early without reproducing *and* survivors live better lives. |
  | 1b, 2b, 3a, 4c, 5b, [6,7 n/a]    | **Prior Existence Utilitarian**   | **+**                                          | Death is a harm, but prevented future lives (good or bad) don’t count.             |
  | [1b, 2a, 3b, 4c, 5d, 6a, 7a]     | **EMPTY (Unattractive)**          | *Path unused*                                  | Combines counting prevented births with ignoring death harm *and* averaging welfare. |
  | [1a, 2a, 3a, 4b, 5a, 6b, 7b]     | **EMPTY (Incoherent)**            | *Path unused*                                  | Death is a harm, but displaced animals "reproducing elsewhere" negates birth prevention. |

  ---

  **Overlaps & Notes for Seminar Leader**  
  - **Unresolved Pair**: *Prior Existence Sufferist* and *Prior Existence Utilitarian* converge on **+** if clearing deaths are numerous, but diverge if deaths are painless (latter still sees harm).  
  - **Key Disagreement Node**: Expect fiercest debate at **Node 4 (Displacement)**. Empirical uncertainty dominates (e.g., do displaced rodents die or colonize suburbs?), and small changes flip the verdict. Axiological nodes (2,3,5) are more transparent once articulated; Node 4’s contingencies resist resolution without species/site-specific data.  

  ---

  **Node Reference Table**  
  *(For handout back page)*

  | Node | Question                                                                 | Answers                                                                                                |
  | :--- | :----------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------- |
  | 1    | Does conversion eliminate *all* sentient life?                           | (a) Yes; (b) No                                                                                        |
  | 2    | Count welfare of animals *never born*?                                   | (a) Yes; (b) No                                                                                        |
  | 3    | Is death a harm beyond suffering?                                        | (a) Yes; (b) No                                                                                        |
  | 4    | What happens to displaced animals?                                       | (a) Die earlier; (b) Reproduce elsewhere; (c) Killed in clearing                                       |
  | 5    | Primary welfare currency?                                                | (a) Suffering experiences; (b) Individuals; (c) Welfare-weighted individuals; (d) Average welfare/life |
  | 6    | Does conversion reduce long-term population density?                     | (a) Yes; (b) No                                                                                        |
  | 7    | Does conversion reduce average suffering intensity per animal?           | (a) Yes; (b) No                                                                                        |

  **Print Note**: Fit tree (front) and table (back) on one sheet. Use indentation for clarity.  
  **Seminar Use**: Have students answer nodes *before* declaring verdicts; map answers to leaves to reveal hidden assumptions.
