  ### **The Quiz: Which Theory of Emotion Are You Committed To?**
  *Answer each question with:*  
  **A) Yes**  
  **B) No**  
  **C) It depends (briefly state what it depends on in 1-2 words: e.g., "context", "definition", "intensity")**

  #### **Dissociation Questions (Q1-Q3)**
  1. **Judgement gone, everything else stays**: You *know* a dog is harmless (e.g., it’s a friendly breed, on a leash), but your heart races, you sweat, and you feel terrified. Is there still an emotion here?  
     - A) Yes  
     - B) No  
     - C) It depends  

  2. **Felt feeling gone, everything else stays**: Sam *judges* that his job loss is devastating, he cries, and his body shows stress (e.g., shaking, fast heartbeat), but he reports no inner feeling of sadness or fear. Is there still an emotion here?  
     - A) Yes  
     - B) No  
     - C) It depends  

  3. **Nothing to act on**: You feel fury at a printer that jams repeatedly, grief over a fictional character’s death, or fear of a cliff edge while watching safely from behind glass. There’s nothing you can (or would) do about it. Is there still an emotion here?  
     - A) Yes  
     - B) No  
     - C) It depends  

  #### **General Questions (Q4-Q9)**
  4. Can you be *wrong* about what you’re feeling? For example, you insist you’re "not angry" while slamming doors and shouting.  
     - A) Yes  
     - B) No  
     - C) It depends  

  5. Can a labrador dog or a 10-month-old baby have the *exact same* emotion as you (e.g., "fear" or "joy"), or only something that *looks* similar from the outside?  
     - A) Same emotion  
     - B) Only looks similar  
     - C) It depends  

  6. Is being irritable for no reason (e.g., snapping at everyone on a bad day) the *same kind of thing* as being angry at someone specific (e.g., your boss for criticising you)?  
     - A) Yes  
     - B) No  
     - C) It depends  

  7. Can an emotion *survive its object*? For example, still feeling furious at someone who died, or afraid of the dark after proving it’s empty.  
     - A) Yes  
     - B) No  
     - C) It depends  

  8. When you’re afraid of something you *know* is harmless (e.g., spiders, heights), is that thing what your fear is *about*?  
     - A) Yes  
     - B) No  
     - C) It depends  

  9. Can two experiences of the "same" emotion (e.g., two types of "fear") share *nothing* underneath? For instance, the fear of public speaking feels nothing like the fear of a sudden loud noise.  
     - A) Yes  
     - B) No  
     - C) It depends  

