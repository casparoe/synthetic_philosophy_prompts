  #### **Theories Summarised**
  1. **Judgementalism**: Emotions *are* evaluative judgements (e.g., "sadness" is judging something as a loss).  
  2. **Perceptualism**: Emotions are perceptions of value (e.g., "fear" perceives danger).  
  3. **Feeling Theory**: Emotions are feelings/bodily states (e.g., "anger" is the feeling of heat and tension).  
  4. **Appraisal Theory**: Emotions arise from automatic appraisals (e.g., "jealousy" stems from appraising a threat).  
  5. **Action Readiness**: Emotions are states of readiness to act (e.g., "fear" is preparing to flee).  
  6. **Component Process**: Emotions are packages (judgement, feeling, action); no single component *is* the emotion.  
  7. **Disunity View**: "Emotion" isn’t one thing—it’s a loose category for diverse states.  
  8. **Social Constructivism**: Emotions are shaped by culture/learning (e.g., "guilt" requires social norms).  

