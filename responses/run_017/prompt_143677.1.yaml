answer: |-
  Here's a comprehensive solution designed to meet your specifications, focusing on the core dilemma while integrating key course concepts and forcing students to take a stand.

  **1. The Essay Question**

  > "Consider a predicate 'is schmue' defined by the schema: ⟨p⟩ is schmue iff p and p is not about money. Assume all instances of this schema are true. Evaluate whether the existence and behaviour of 'schmue' poses a fatal challenge to deflationism about truth. In your answer, specifically address whether the deflationist can explain the inadequacy of 'schmue' while maintaining that the nature of truth is exhausted by the disquotation schema, and connect your argument to the role of truth in blind ascription or the norm of assertion." (Answer in 45 mins)

  **2. Model Answer (Approx. 850 words)**

  The deflationist claims that the entire nature of truth is captured by the equivalence schema, ⟨p⟩ is true iff p, and its associated roles in facilitating blind ascription and unbounded generalization. The predicate 'schmue', defined by ⟨p⟩ is schmue iff (p and p is not about money), appears to generate a powerful dilemma: either 'schmue' functions identically to 'truth', undermining truth's uniqueness, or 'schmue' fails in ways truth does not, implying truth possesses substantive content beyond the deflationist schema. I argue this challenge is not fatal. While 'schmue' superficially mimics truth for many sentences, it fundamentally fails to perform truth's essential role in *unrestricted blind ascription*, a failure rooted in the schema's *restriction* and not requiring any additional substantive property of truth. This failure simultaneously explains why 'schmue' cannot underpin the norm of assertion. Deflationism, correctly understood as committed to the *generality* of the schema, survives intact.

  The initial appeal of 'schmue' is clear. For the vast majority of sentences – those not about money – the biconditional ⟨p⟩ is schmue iff p holds. This allows 'schmue' to disquote effectively in many contexts. One can seemingly use it for blind ascription involving non-monetary content: "Everything Kant said about duty is schmue" disquotes correctly if none of Kant's relevant utterances concern money. Similarly, in mixed inferences involving non-monetary propositions, 'schmue' might appear to function: from "Kant claimed that ⟨lying is wrong⟩" and "⟨Lying is wrong⟩ is schmue", one can infer "Lying is wrong". This mimicry suggests the deflationist schema alone fails to uniquely characterize truth.

  However, the deflationist must insist that the schema defining truth is *unrestricted*. The power of truth lies precisely in its applicability to *any* proposition whatsoever, regardless of content. This unrestricted nature is what underwrites its indispensable role in blind ascription and unbounded generalization. 'Schmue' fails precisely because its schema *is* restricted. This restriction becomes crippling when attempting genuinely *blind* ascription, where the ascriber is ignorant of the specific content being ascribed.

  Consider the blind ascription: "Everything the Prime Minister said yesterday is schmue." Crucially, the ascriber may have no idea *what* the Prime Minister said. The deflationist account of why we use 'true' here is that the equivalence schema guarantees that whatever proposition ⟨q⟩ the PM uttered, "⟨q⟩ is true" holds iff q. The predicate 'schmue' lacks this guarantee. If the PM uttered a proposition *about money*, say ⟨Interest rates must rise⟩, then "⟨Interest rates must rise⟩ is schmue" is false (because the proposition is about money), even though ⟨Interest rates must rise⟩ might itself be true. Consequently, the blind ascription "Everything the PM said yesterday is schmue" could be false even if every single thing the PM said was true (but included a monetary claim), or it could be true only if all non-monetary claims were true *and* no monetary claims were made. The ascriber, being blind to the content, cannot determine this. 'Schmue' therefore *fails* as a device for expressing blind endorsement or rejection of unknown content. Its disquotational power is conditional on knowing the content falls outside a specific domain, undermining the very point of blind ascription. Truth, defined by an unrestricted schema, suffers no such limitation. This failure stems directly from the *form* of the 'schmue' schema – its built-in restriction – not from truth possessing some hidden substantive nature that 'schmue' lacks. The deflationist explains the inadequacy of 'schmue' by pointing to the violation of the requirement for an *unrestricted* equivalence schema to perform the essential linguistic function of blind ascription. Truth is unique because its schema alone is universally applicable.

  This failure connects directly to the norm of assertion. The standard norm is "Assert only what is true." Could we replace this with "Assert only what is schmue"? The answer is no, and the reason reinforces the deflationist point. Suppose someone asserts ⟨This coin is worth £1⟩ (a proposition about money). If the coin *is* worth £1, this assertion is correct by the truth norm. However, it violates the "schmue norm" simply because it's about money, regardless of its accuracy. Conversely, asserting a true non-monetary proposition satisfies both norms. The "schmue norm" is defective because it incorrectly penalizes accurate assertions about money and fails to penalize false assertions about money (since "⟨q⟩ is schmue" is false whenever q is about money, even if q is true, rendering the norm inapplicable or nonsensical for monetary assertions). The truth norm, grounded in the unrestricted schema, applies universally: asserting ⟨p⟩ is correct iff p. The deflationist can thus argue that the norm derives from the meaning of 'true' (via the schema) and the aim of assertion (to say what is the case), without positing a substantive property. 'Schmue' cannot underpin a coherent norm because its meaning, via its restricted schema, divorces correctness from simply *being the case* for a whole category of propositions.

  Therefore, the 'schmue' challenge exposes a crucial nuance in deflationism but does not refute it. Deflationism is not merely the claim that *a* disquotational schema exists, but that the *specific, unrestricted* truth schema is fundamental because it alone enables the indispensable linguistic functions of blind ascription and unbounded generalization across *all* content. 'Schmue' fails these tests demonstrably due to the restriction inherent in its definition. The deflationist successfully explains this failure by appealing to the necessity of an unrestricted schema for these core functions, without needing to inflate truth into a substantive property. The burden lies with the challenger to show how a restricted predicate like 'schmue' could perform these universal functions; it cannot. Deflationism survives by clarifying that truth's unique role is secured by the universality of its defining schema.

  **3. Marking Scheme (Out of 20)**

  **Must-Hit Moves (Core Arguments - 14 marks total):**
  1.  **(4 marks) Explain the 'schmue' dilemma clearly:** Define 'schmue' using the schema, state the two horns (indistinguishability undermining uniqueness vs. failure implying substantiveness), and identify it as a challenge to deflationism's exhaustiveness claim. *Common Mistake:* Simply defining schmue without framing the dilemma or its threat to deflationism.
  2.  **(5 marks) Argue for one side & Identify schmue's core flaw (Unrestricted Blind Ascription):** Clearly state whether the challenge succeeds or fails. Crucially, identify the failure of schmue concerning *unrestricted blind ascription* as the key issue. Explain *why* schmue fails here (the content restriction means blind ascriptions using 'schmue' cannot reliably endorse unknown content, as they might falsely reject true monetary claims or be inapplicable). *Common Mistake:* Merely stating "schmue doesn't work for money sentences" without connecting it to the *functional role* of blind ascription and the *ignorance* inherent in it. *Top Band Differentiator:* Explicitly linking schmue's failure to the *restriction* in its schema and contrasting it with the *unrestricted* nature of the truth schema as essential for blind ascription's function.
  3.  **(3 marks) Connect to Norm of Assertion (or other core concept):** Demonstrate how schmue's flaw (the restriction) also prevents it from underpinning a coherent norm of assertion (e.g., "Assert only schmue" misfires for true monetary claims and fails for false ones). *Common Mistake:* Briefly mentioning the norm without explaining *how* schmue's restriction causes the normative failure or confusing it with the blind ascription point.
  4.  **(2 marks) Deflationist Defense/Explanation:** Explain *how* the deflationist uses the failure (point 2 & 3) to defend their view: argue that the failure stems purely from the schema's restriction, not a lack of some substantive property, and that the unrestricted truth schema uniquely enables the necessary linguistic functions. *Common Mistake:* Conceding that deflationism needs "more" than the schema to explain why schmue fails, rather than showing the universality *is part of* the deflationist account of the schema's functional role.

  **Overall Quality & Structure (6 marks total):**
  *   **Clarity & Argumentation (3 marks):** Logical flow, precision of language, avoidance of vagueness, effective use of examples.
  *   **Relevance & Focus (2 marks):** Sticking to the prompt, avoiding tangents (e.g., liar paradox, correspondence theory details), focusing on the dilemma and the chosen defense.
  *   **Originality/Insight (1 mark):** Depth of analysis, showing understanding beyond surface points (e.g., emphasizing the *ignorance* in blind ascription, explaining *why* universality is necessary).

  **Grade Bands:**

  *   **First (17-20):** Hits all 4 must-hit moves convincingly. **Crucially differentiator:** In Move 2, provides a *detailed, functional explanation* of *why* the *unrestricted* nature of the truth schema is *essential* for blind ascription, explicitly contrasting it with schmue's restriction, and integrates this seamlessly into the deflationist defense (Move 4). Excellent clarity and structure. Shows clear insight.
  *   **Upper Second (2:1) (13-16):** Hits all 4 must-hit moves, but perhaps less depth or clarity on Move 2 (e.g., identifies blind ascription failure but doesn't fully articulate the *necessity* of unrestrictedness or the role of ignorance). Defense (Move 4) is present but may be slightly less forceful or integrated. Good structure and relevance.
  *   **Lower Second (2:2) (9-12):** Addresses the dilemma (Move 1) and identifies *a* problem with schmue (e.g., "doesn't work for money sentences"), but may not focus correctly on *unrestricted blind ascription* as the *key* failure (Move 2 incomplete or weak). Connection to norm (Move 3) might be superficial or absent. Defense (Move 4) is weak or unclear. Structure may be less coherent. May spend time on irrelevant points.
  *   **Third (6-8):** Shows some basic understanding of deflationism and the schmue setup (Move 1 partially addressed) but fails to engage seriously with the dilemma or the required functions. The problem identified with schmue is trivial ("it's not truth", "only works sometimes"). Little to no connection to blind ascription/norm or defense of deflationism. Poor structure.
  *   **Fail (0-5):** Significant misunderstanding of deflationism, the schmue challenge, or the course material. Fails to address the core task. Incoherent or irrelevant.

  **Rationale for Design:**

  *   **Focus & Challenge:** The question forces engagement with the core deflationist claim (exhaustiveness of schema) via a novel challenge (schmue). It mandates taking a side ("Evaluate... fatal challenge") and requires connecting to key course concepts (blind ascription/norm).
  *   **Avoids Simplicity:** Simply stating "schmue fails for money sentences" only earns partial credit (Move 2 partially, max Lower Second). Top marks require explaining *why* this matters functionally (blind ascription) and *how* the deflationist uses this.
  *   **Uses Course Vocabulary:** Leverages "deflationism," "disquotation schema," "blind ascription," "unbounded generalization," "norm of assertion" – all core concepts covered.
  *   **Avoids Forbidden Topics:** No Tarski, liar, formal semantics, possible worlds, or reliance on specific authors/texts.
  *   **Model Answer:** Argues decisively for deflationism surviving, using the unrestricted blind ascription failure as the core defense, and linking it to the norm of assertion. Demonstrates the required depth and integration.
  *   **Marking Scheme:** Explicitly penalizes superficial answers ("restricted to non-money") by making detailed functional analysis (Move 2) crucial for higher grades. Clearly identifies the top-band differentiator. Provides clear guidance on common mistakes per point.

  This question pushes students beyond rote memorization into critical analysis of deflationism's core commitments through a novel challenge, demanding application of specific course concepts in their defense or critique. The money restriction in "schmue" is not a distraction; it cleanly creates the necessary limitation to test the *universality* requirement inherent in truth's function. Good luck!
