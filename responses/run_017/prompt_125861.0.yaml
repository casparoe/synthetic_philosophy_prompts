prompt: |-
  hey — I'm a software engineer, no formal philosophy background at all, so please don't assume I know any of the terminology: if there's a term of art I should be using, name it and define it in half a sentence. I'm applying for a tiny artist-run microgrant (something like $8k, four months, realistically 8–10 hours a week since this is nights and weekends) and what they want back is a public repo plus a short writeup, not an academic paper. So I need a two-page-ish research proposal, and please skip any bibliography or citations entirely — I'll add those myself later or leave them out, and I'd rather the space go to the actual argument.

  The topic is the thing that gets called the Letter Spirit problem: what makes every 'a' an 'a', given that the 'a' in a Didone serif face, in blackletter, in a 3x5 pixel bitmap font, and in my five-year-old's crayon scrawl share basically no measurable geometry. I've been messing with variable fonts and SVG path interpolation on weekends, and two things keep bugging me. First, naive interpolation between two outlines is fine geometrically but produces total garbage semantically: morph an 'a' into a 'u' and the midpoint is neither. Fixing it requires deciding which point on one outline corresponds to which point on the other, and the only way I know to do that is by thinking in terms of parts — stem, bowl, shoulder, terminal, aperture — which starts to feel like the letter's identity is carried by a part structure plus qualitative relations (how many enclosed counters, which way the aperture opens, what's attached to what, what's above what) rather than by shape. Second, I got into an argument with a friend who does ML and insisted the whole thing is just clustering: embed a bunch of outlines, and 'a' is a region in that space. But that seems to miss that a Latin 'a' and a Cyrillic 'а' can be pixel-identical and still be different letters, because they belong to different contrast sets — and conversely that someone could design a brand-new glyph with no causal descent from any scribal tradition and it would instantly be an 'a'. My half-formed idea, which I want turned into a real proposal, is to stop asking what all the a's have in common and instead ask what has to be held fixed while everything else is allowed to vary — with the twist that there are two directions of variation: hold the letter fixed and vary style, hold the style fixed and vary the letter, and maybe the category is just whatever sits at the fixed point where those two things cross.

  So here's what I want the proposal to do. State the question precisely enough that it has a determinate answer — I'm tempted by something like: is there a finite specification in a small "anatomy language" of parts and relations such that every recognizable instance of a letter satisfies it and no instance of any other letter does? — but you should push back if that's the wrong sharp version, or if the interesting claim is negative. Say why the two obvious answers leave it open: the prototype / family-resemblance / cluster story, and the historical-or-causal-chain story, and be specific about the case each one dies on. Then the method, month by month, for four months at ~10 hrs/week: I'm imagining month one hand-building the spec language and hand-specifying a deliberately nasty subset (a, o, u, n, h, d, b, p, q, g — the rotation and reflection pairs, because that's where any purely relational spec should break), month two writing a little generator that randomizes the metrics while holding the spec fixed and getting maybe twenty people to classify a few dozen of the outputs, month three running the minimal-edit experiments where I hunt for the smallest geometric change that flips which letter people see and ask whether the flip always coincides with some discrete structural event (a counter opening, a stroke detaching) or whether there are continuous paths where the category changes with nothing discrete happening, and month four doing the held-out test — given twenty-five letters in a style the system hasn't seen, generate the twenty-sixth from its spec and see if readers accept it as belonging. Also: I want an honest failure section. I think the project fails if every letter's spec turns out to need at least one arbitrary metric threshold to keep other letters out, because then "structure" has quietly become prototype-plus-thresholds; and it also fails if the human data shows no sharp boundaries anywhere and everything is graded mush. And tell me, plainly, if ten letters is already too ambitious for the time I have and what you'd cut.
reasoning: |-
  We are writing a research proposal for a microgrant, targeting a non-philosopher audience (software engineer) with no assumed terminology. The proposal should be about 2 pages, skipping citations and bibliography. The core idea is to approach the "Letter Spirit" problem by defining letter identity through structural invariants across stylistic variation and letter variation.

  Key elements to cover:
  1. **Problem Statement**: What makes every 'a' an 'a' despite radical geometric differences? We reject two common answers:
     - **Clustering/Prototype View**: Letters are regions in a shape space. Dies on: identical glyphs being different letters (e.g., Latin 'a' vs. Cyrillic 'а') and new glyphs with no history being instantly recognized as 'a'.
     - **Historical Chain View**: Letters are defined by causal descent from a tradition. Dies on: creating a new glyph that is immediately accepted as 'a' without any historical lineage.

  2. **Core Hypothesis**: Letter identity is carried by a finite specification of parts (e.g., stem, bowl) and qualitative relations (e.g., "has one enclosed counter", "aperture opens to the right", "stem attached to bowl at top"). This spec should be invariant under style changes and discriminative under letter changes.

  3. **Sharp Question**: Is there a finite specification in a small "anatomy language" (of parts and relations) such that:
     - Every recognizable instance of a letter satisfies it.
     - No instance of any other letter satisfies it?

  4. **Methodology** (4 months, ~10 hrs/week):
     - **Month 1**: Hand-build the spec language and specify 10 challenging letters (a, o, u, n, h, d, b, p, q, g) focusing on rotation/reflection pairs where purely relational specs might break.
     - **Month 2**: Write a generator that randomizes metrics (e.g., widths, heights, curvatures) while holding the spec fixed. Generate dozens of variants and run a human classification study (~20 people) to see if the outputs are consistently recognized as the intended letter.
     - **Month 3**: Minimal-edit experiments: Systematically perturb glyphs (geometrically) to find the smallest change that flips letter perception. Test whether flips coincide with discrete structural events (e.g., counter opening, stroke detaching) or if there are continuous transitions without discrete events.
     - **Month 4**: Held-out test: Take 25 letters from a novel style (not used in training the spec), generate the 26th (say, 'a') from its spec, and test if human readers accept it as belonging to the set.

  5. **Failure Conditions**:
     - If the spec for any letter requires arbitrary metric thresholds (e.g., "aperture width must be < X") to exclude other letters, then we've regressed to a prototype view.
     - If human data shows no sharp boundaries (i.e., perception is graded and context-dependent), then discrete structural invariants may not exist.

  6. **Scope**: 10 letters might be too ambitious. We should consider cutting to 5-7 letters (e.g., a, o, u, n, d) to ensure depth. The rotation/reflection pairs (b/d/p/q) are critical for testing relational invariance, so they should be included if possible.

  Structure the Proposal:

  **Title**: Letter Identity Through Structural Invariants: A Computational Approach

  **Introduction**: 
  - Start with the puzzle: How do we recognize the same letter across wildly different styles? 
  - Reject clustering and historical views with concrete counterexamples.
  - Propose: Identity is in the structural relationships, not the shape.

  **Research Question**: 
  - Can we define each letter by a finite, discrete set of parts and relations that is both necessary and sufficient for recognition, across styles and against confusables?

  **Method**:
  - Break down by month as above.

  **Expected Outcomes & Failure Modes**:
  - Success: A working spec language and evidence that discrete structural events bound letter categories.
  - Failure: If we fall back to metrics or find no discreteness.

  **Timeline & Deliverables**: 
  - Public repo with: spec language, generator code, stimuli, human data, and analysis.
  - Short writeup with findings.

  Now, write the proposal in plain, jargon-free English, keeping it to about two pages.
answer: |-
  ### Research Proposal: Letter Identity Through Structural Invariants  
  **Applicant**: Software engineer (no formal philosophy background).  
  **Microgrant**: $8k, 4 months, 8–10 hrs/week.  
  **Deliverables**: Public code repo + 2-page writeup (no academic citations).  

  ---

  #### **The Core Puzzle: What Makes an "a" an "a"?**  
  When you see an "a" in Times New Roman, a pixel font, or a child’s scribble, they share almost no geometric similarity. Yet we recognize them all as "a". How? This is the "Letter Spirit" problem: what defines a letter’s identity when shape alone fails?  

  Two common answers fall short:  
  1. **The "Clustering" Answer**: Letters are regions in a "shape space" (e.g., via machine learning).  
     - **Why it fails**: A Latin "a" and Cyrillic "а" can look identical but are different letters because they belong to different writing systems. Conversely, a brand-new glyph invented today can be instantly seen as "a" with no historical lineage. Identity isn’t just about shape proximity.  
  2. **The "Historical Chain" Answer**: Letters are defined by their cultural ancestry.  
     - **Why it fails**: If you design a novel "a" with no ties to history (e.g., in a futuristic font), people still recognize it. Tradition isn’t necessary.  

  **My hypothesis**: Letter identity isn’t about shared geometry but a fixed **structural scaffold**—a set of discrete parts (e.g., stem, bowl, counter) and their relationships (e.g., "has one enclosed hole", "aperture opens right", "stem attached to bowl"). This scaffold must withstand two types of variation:  
  - **Style variation**: Changing fonts while holding the letter fixed (e.g., Helvetica "a" → Gothic "a").  
  - **Letter variation**: Changing letters while holding the style fixed (e.g., "a" → "u" in the same font).  
  The letter category lives at the intersection where this scaffold remains invariant.  

  **Sharpened Question**: Can we define each letter using a finite "anatomy language" (parts + qualitative relations) such that:  
  - Every recognizable instance of that letter satisfies the spec.  
  - No instance of another letter satisfies it?  
  *Note: Qualitative relations* are non-numeric descriptions (e.g., "bowl connected to stem", not "bowl width = 5px").  

  ---

  #### **Method: 4 Months, 10 hrs/week**  
  *Why this approach?* I’ll test if letter perception hinges on discrete structural events (e.g., a hole closing) rather than continuous shape changes. If the spec needs numeric thresholds (e.g., "aperture width > 2mm"), it collapses into a shape prototype.  

  **Month 1: Build the Anatomy Language & Specs**  
  - **Goal**: Define a minimal language for parts (stem, bowl, etc.) and relations (attached, enclosed, etc.). Hand-specify 10 letters chosen for symmetry traps: `a, o, u, n, h, d, b, p, q, g`. These include rotation/reflection pairs (e.g., b/d/p/q) where purely relational specs risk failure.  
  - **Output**: Code representing specs (e.g., `"a": [has_bowl, has_stem, stem_attached_to_bowl_top, one_enclosed_counter]`).  
  - **Scope Note**: 10 letters is ambitious; I’ll prioritize `a, o, d, b, q` if time lags.  

  **Month 2: Generate & Classify Variants**  
  - **Goal**: Test if specs generalize across styles.  
  - **Process**:  
    1. Code a generator that creates random glyphs from a spec by perturbing metrics (e.g., scale, curvature) while respecting structural rules.  
    2. Generate 100+ variants (e.g., 10 styles × 10 letters).  
    3. Run human trials: 20 participants classify 50 glyphs as "a", "not a", etc. via a web tool (e.g., React app).  
  - **Success Metric**: ≥90% agreement that generated glyphs match the spec’s letter.  

  **Month 3: Minimal-Edit Experiments**  
  - **Goal**: Find the smallest geometric change that flips letter perception (e.g., "d" → "cl").  
  - **Process**:  
    1. For paired letters (e.g., "d" and "cl"), create smooth interpolation paths.  
    2. Ask participants: "At which step does this become a different letter?"  
    3. Analyze if flips coincide with discrete structural events (e.g., counter encloses/stroke detaches) or happen gradually.  
  - **Risk**: If changes are always gradual, discreteness fails.  

  **Month 4: Held-Out Style Test**  
  - **Goal**: Can the spec generalize to unseen styles?  
  - **Process**:  
    1. Pick a novel font (e.g., a handwritten style).  
    2. Generate 25 letters from their specs (e.g., "b", "k", "z") and one held-out letter (e.g., "a") using its spec.  
    3. Ask participants: "Does the 26th glyph belong?"  
  - **Success Metric**: ≥80% acceptance for the generated letter.  

  ---

  #### **Failure Conditions & Risks**  
  - **Failure 1: Metric Thresholds Creep In**  
    If specs need rules like "aperture width < 0.5×height" to block impostors (e.g., "u" invading "a"), we’re back to shape prototypes. This kills the structural-invariant hypothesis.  
  - **Failure 2: No Discrete Boundaries**  
    If human data shows no abrupt perception flips (e.g., "d" becomes "cl" via continuous drift), letters aren’t discrete categories.  
  - **Other Risks**:  
    - Human trials may reveal context dependence (e.g., "c" and "e" blur together at small sizes).  
    - Specs for symmetric letters (b/d/p/q) might need "anchor points" (e.g., baseline position), undermining pure relations.  
    - Time: 10 letters is tight. I’ll cut `g, h, u` if Month 1 lags (keeping `a, o, n, d, b, p, q`).  

  ---

  #### **Why This Matters**  
  This isn’t about fonts—it’s about how humans abstract categories. Success would show that discrete structural invariants underpin symbolic reasoning. Failure reveals that letter perception is messier than we think. Either way, the code and data will public, inviting others to test the anatomy language. Let’s find the scaffold!  

  ---  
  **Estimated Timeline**: Month 1 (Specs) → Month 2 (Generator + Trials) → Month 3 (Edits) → Month 4 (Held-Out Test).  
  **Repo Contents**: Spec language, generator, human trial data, stimuli, analysis scripts.  
  **Writeup**: Findings, failure analysis, implications for AI (e.g., why ML struggles with few-shot symbols).
