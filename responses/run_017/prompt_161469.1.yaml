answer: |-
  Here’s a complete exam package designed to force the precise distinction you’re after, push past clichés, and demand commitment. The model answer takes a strong, controversial stance to demonstrate the depth you want.

  **Philosophy Club: Work & Leisure Midterm Exam**

  **Question (45 minutes, 25 marks):**
  > "The moral value of work lies exclusively in its social utility: producing goods/services others need. Effort and discipline are irrelevant virtues; leisure is a fundamental human right, not an earned reward." Critically evaluate this claim. In your response, **you must explicitly address** how your chosen position resolves (or fails to resolve) the ethical paradox presented by cases like *karoshi* – where individuals *freely choose* extreme overwork they find meaningful, even unto death. Does such a death represent exploitation, tragic misvaluation, or the fulfillment of a personal ethic?

  ---

  **Marking Scheme (25 Marks Total):**

  1.  **Clear Stance & Defining Criteria (5 marks):**
      *   Must explicitly state *which* justification for work's value they defend (Effort/Discipline, Social Utility, or Necessity-for-Reward) OR clearly reject all three for a coherent alternative.
      *   *Common Failure:* Vague waffling ("all have merit"), failing to define the core source of work's moral value they are defending, or trying to combine incompatible justifications without resolving tensions.

  2.  **Engagement with Social Utility Claim (5 marks):**
      *   Must directly confront the claim that effort/discipline are "irrelevant" and leisure is an unearned "right." Do they agree, disagree, or modify this? Why?
      *   Must address the *consequence* of this view: What happens to the value of the worker if their task is automated (i.e., their social utility drops to near-zero)?
      *   *Common Failure:* Ignoring the automation implication, accepting "leisure as a right" without challenging the "earned reward" model, or dismissing effort without argument.

  3.  **Resolution of the *Karoshi* Paradox (7 marks):**
      *   Must explicitly state whether a freely chosen work-till-death is: (a) Exploitation (structural), (b) Tragic Misvaluation (personal error), (c) Fulfillment (valid ethic), or (d) something else.
      *   **Crucially:** Must explain *why* based on their chosen work-value criterion. Does the *choice* override the outcome? Does the lack of *need* for the work (if applicable) negate its value? Does the effort itself confer value despite the death?
      *   *Common Failure:* Retreating to pure structural critique ("bad bosses/society forced it") ignoring the "free choice" aspect, or treating death as *inherently* exploitative without linking it to their work-value theory, or simply calling it "sad" without philosophical justification.

  4.  **Internal Consistency & Implications (5 marks):**
      *   Does their position lead to coherent, defensible conclusions about unemployment, UBI, hobbies, or "useless" work (art, pure research)? Do they acknowledge/handle potential counterintuitive results?
      *   *Common Failure:* Ignoring wider implications, asserting conclusions that contradict their stated principles, or failing to see how their view on *karoshi* impacts their view on less extreme cases of workaholism or non-traditional "work".

  5.  **Argumentative Rigor & Clarity (3 marks):**
      *   Logical flow, clear reasoning, addressing the specific prompt without digression, precise language.
      *   *Common Failure:* Unclear writing, logical leaps, discussing general "overwork bad" without centering the core value question or *karoshi* paradox.

  ---

  **Model Answer (Approx. 700 words): Taking the Social Utility Stance**

  **(Defending the Claim with Modifications & Embracing Controversial Implications)**

  The claim that work's *moral* value stems solely from social utility—providing needed goods/services—is largely correct, though its dismissal of effort requires refinement, and its stance on leisure as a fundamental right is essential. Effort and discipline are often *instrumentally* valuable for *achieving* social utility but hold no *inherent* moral worth. Leisure is indeed a fundamental right contingent only on our humanity, not a prize wrested from toil. This framework exposes the dangerous illusions of effort-based work ethics and provides the clearest lens through which to view the tragedy of *karoshi*.

  The core flaw in effort/discipline-based ethics is their emptiness. Grinding for grinding's sake, divorced from tangible benefit, is morally neutral at best, pathological at worst. The rock climber or cellist exerts immense effort and discipline, yet we recognize this as pursuit of personal excellence or aesthetic fulfillment, not a moral good in itself. Applying this "dignity of effort" to work transforms labor into a perverse performance art, valuing the sweat over the outcome. The necessity-for-reward model ("no work, no eat") is equally bankrupt, reducing work to a coercive transaction and leisure to a grudgingly granted reprieve. It confuses practical necessity (societies need production) with moral desert. Someone unable to work, or whose labor isn't needed, retains inherent worth and deserves leisure as part of a flourishing life; their sustenance is a societal obligation, not charity.

  Social utility provides the only compelling *moral* justification for work: it connects individual action to the well-being of others. This value is relational and contingent. Effort and discipline are vital *tools* – inefficient work yielding little utility has little moral value, no matter how hard the worker tried. Conversely, highly efficient, minimally effortful work that meets significant needs has high moral value. This explains why automating undesirable or dangerous tasks is an *unmitigated good*: it increases net social utility while liberating humans. The displaced worker hasn't lost inherent "dignity"; their previous role's *moral purpose* (providing X) has been fulfilled better elsewhere. Their right to leisure and resources remains intact; society must adapt to distribute the gains of productivity (e.g., via robust social safety nets, UBI), recognizing leisure as the space where true human flourishing – creativity, relationships, rest – occurs, untainted by the specter of having to "earn" it.

  This directly resolves the *karoshi* paradox. If the moral value of work lies *only* in its social utility, then freely choosing to work oneself to death can only be justified if the *output* was genuinely, uniquely essential and the death unavoidable – a vanishingly rare scenario. In the vast majority of *karoshi* cases, the output was *not* irreplaceable or uniquely critical (e.g., routine corporate overtime). Therefore, the choice, however "free" in a narrow sense, represents a profound **tragic misvaluation**. The individual has mistakenly internalized the effort-based ethic or the necessity-for-reward myth, believing the sheer act of working hard or sacrificing oneself *is* the moral good, or that their worth is contingent on extreme productivity. Their death is not exploitation *by others* in the classic sense (though toxic cultures enable it), nor is it fulfillment – it is the catastrophic endpoint of a false moral calculus. They destroyed themselves for a phantom: the inherent virtue of effort. Society bears responsibility for propagating this toxic ethic, but the core error is the misattribution of value to the effort itself, blinding the individual to the diminishing or absent social utility of their final, fatal labors. True fulfillment lies not in workaholism, but in contributing *meaningfully* (when possible and desired) and embracing the intrinsic right to rest and rejuvenation that defines a life beyond mere function.

  ---

  **Why this works for your goal:**

  1.  **Forces the Distinction:** Explicitly names and rejects effort/discipline and necessity-for-reward as core moral justifications, committing fully to social utility.
  2.  **Makes Automation a Feature, Not a Bug:** Embraces the implication that automation liberates humans *from* morally necessary but undesirable toil. Leisure as a *right* flows naturally.
  3.  **Tackles *Karoshi* Head-On with the Framework:** Directly answers whether it's exploitation, tragedy, or fulfillment by applying the social utility criterion. Concludes it's tragic *misvaluation* based on a false ethic (effort/sacrifice as inherently good). Addresses the "free choice" element explicitly.
  4.  **Commits & is Controversial:** Clearly states effort has *no inherent moral worth*, calls necessity-for-reward "bankrupt," labels *karoshi* a "tragic misvaluation" due to false beliefs. This will spark debate.
  5.  **Uses *Karoshi* Deeply:** Moves beyond "overwork bad" to analyze the *philosophical error* behind the choice, contrasting the social utility view with the effort/sacrifice view the victim likely held.
  6.  **No Fence-Sitting:** Takes a clear, defensible, but strong stance throughout.

  This question and model should force your club members to move beyond rehearsed points about burnout and really grapple with the foundational *why* of work's supposed virtue, leading to much more revealing (and likely heated!) discussions. Good luck!
