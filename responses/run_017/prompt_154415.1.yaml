    So the ex-ante optimal strategy is to pay when asked. Therefore, UDT says: commit to the strategy that pays when asked. Then, when asked (in tails), the agent pays.

  ### Case 4: Hitchhiker

  - **Setup**: A hitchhiker is in a car. The driver will drop them off at a dangerous place unless the hitchhiker pays them. The hitchhiker can only pay if they are driven to town. But if they are driven to town, they don't need to pay. However, the driver will only drive to town if the hitchhiker promises to pay. The hitchhiker can promise, but once in town they can renege.
