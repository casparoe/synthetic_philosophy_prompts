  But note: once in town, if the hitchhiker reneges, they get 10. But UDT says they must follow the strategy and pay. Why? Because if they were to renege, then the driver would have known that and not driven them. But the driver has already driven them. So the driver's action is sunk. However, the driver's action was based on the strategy. If the hitchhiker reneges, then the strategy was not (promise, pay) but (promise, not pay). But the driver would not have driven under that strategy. So the only way to get the driver to drive is to commit to (promise, pay). And UDT requires that the agent sticks to the ex-ante optimal strategy.

  ## Exact Nature of Updatelessness

  You asked: What exactly does updatelessness refuse to condition on? We have three readings:

  1. Refuses interim evaluation: The agent maximizes ex ante and treats the realized type as irrelevant to what it should do now. (Correct: the strategy is fixed ex ante and followed.)
  2. Refuses indexical conditioning: The strategy is scored as though its output were realized at every input simultaneously, weighted by the prior. (Correct: the ex-ante evaluation considers every type.)
  3. Identifies the agent with the whole function: The agent is the entire strategy, not the action at a given type. (Correct: the strategy is chosen as a whole, and the outcome may depend on the entire function.)

  In the cases above, all three readings are consistent. The choice of reading does not change the verdicts.

