  We are going to translate Updateless Decision Theory (UDT) into the language of mechanism design, with a focus on sequential screening and dynamic contracting. We will then apply this to the specified cases and the novel case you provided. Finally, we will discuss the residue.

  ## Translation of UDT Thesis

  In mechanism design terms:

  - **Thesis of UDT**: The agent chooses a strategy (a function from types to actions) at the ex-ante stage (i.e., before learning their type) to maximize the expected utility according to the prior distribution of types and any other state of the world, and then follows that strategy without deviation after learning their type. In other words, the agent commits to a strategy at the ex-ante stage and does not re-optimize at the interim stage (after learning the type).

  This corresponds most closely to your first reading: UDT refuses interim evaluation. The agent does not condition the optimization on the realized type. However, note that the strategy itself is type-dependent, so the action taken does depend on the type, but the choice of which strategy to use is made ex ante.

  But note: UDT also incorporates the idea that the strategy might be evaluated in counterfactual scenarios (i.e., at types that are not realized) because the outcome might depend on what the strategy does in those scenarios. This is where your second reading (refusing indexical conditioning) comes in: the ex-ante evaluation of the strategy considers every possible type in the domain, weighted by the prior, even if the agent knows (after learning their type) that some types are not realized.

  Your third reading is also relevant: UDT identifies the agent with the entire strategy (the function) rather than with the type-conditional action. This is because the strategy's behavior at all types (including counterfactual ones) can affect the outcome.

  So, the core of UDT is:

  1. The agent chooses a strategy (a mapping from types to actions) ex ante to maximize expected utility over the prior.
  2. The agent then follows the strategy upon learning their type, without updating the strategy.

  This is similar to the mechanism design concept of ex-ante incentive compatibility, but with a twist: in UDT, the outcome might depend on the entire strategy (i.e., what the agent would do in other types) and not just on the action taken at the actual type.

  ## Testing UDT on Four Cases

  ### Case 1: Ordinary Newcomb Problem

  - **Setup**: Two boxes: one transparent with $1000, one opaque. Predictor has put $1,000,000 in the opaque box iff it predicts you will take only that box. Predictor is accurate.
  - **UDT Verdict**: One-box.
  - **Translation**: The agent's strategy is a function from the type (which in this case is trivial, since there is no private type beyond what the predictor uses) to an action (one-box or two-box). The predictor's action (filling the box or not) depends on the entire strategy. The ex-ante optimal strategy is to one-box because if the strategy is "always one-box", the predictor puts $1,000,000 and the agent gets it. If the strategy is "always two-box", the predictor leaves the opaque box empty and the agent gets only $1000. The prior (over the predictor's prediction) is determined by the agent's strategy. So the agent chooses the strategy that leads to the best outcome: one-boxing.

  ### Case 2: Transparent Boxes

  - **Setup**: Same as Newcomb, but the opaque box is now transparent. So the agent can see whether the $1,000,000 is there or not.
