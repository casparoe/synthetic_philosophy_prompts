  But what if we consider a strategy that says: "if I see the box full, I one-box; if I see it empty, I one-box"? Then the predictor sets the box full (because the strategy always one-boxes) and the agent one-boxes and gets $1,000,000. So that is the same as "always one-box". The strategy "if full, one-box; if empty, two-box" leads to $1000. So the best is to always one-box.

  Therefore, in the transparent boxes case, UDT still says: choose the strategy that always one-boxes, and then follow it. Since the agent will see a full box, they one-box and get $1,000,000.

  ### Case 3: Counterfactual Mugging

  - **Setup**: Omega appears and asks you to give up $100. If you do, then if a coin (which you haven't seen) came up heads, Omega gives you $10000; but if tails, you get nothing. However, if the coin came up tails, Omega doesn't ask. But in this case, the coin came up tails, and Omega is asking you to give $100. (Omega only asks in the tails world, but pays in the heads world.)
