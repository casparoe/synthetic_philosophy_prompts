  But here's the catch: in the transparent case, if the agent uses the strategy "always one-box", then the predictor (knowing this) sets the box to full. Therefore, the agent never actually sees an empty box. So the off-path behavior (what the agent would do if they saw an empty box) is never tested. However, the predictor must know the entire strategy to set the box. So if the strategy says "if full, one-box; if empty, two-box", then the predictor sets the box empty and the agent two-boxes. But then the agent gets $1000. The strategy "always one-box" yields $1,000,000 (and the agent never sees an empty box). The strategy "always two-box" yields $1000. So the best strategy is "always one-box". And since the agent never sees an empty box, they do one-box and get $1,000,000.

