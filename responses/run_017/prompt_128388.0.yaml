prompt: |-
  I write near-future fiction, and I keep having to decide how my imaginary polities distribute the vote without knowing what I actually think about it. So here are my verdicts, case by case, and I want the principle behind them if there is one.

  Excluding sixteen-year-olds: fine, I don't lose sleep over it. Excluding non-citizens who have lived and paid taxes in the city for years from municipal elections: not fine. Excluding prisoners serving sentences, including long ones: not fine. A civics test as a condition of registering: not fine. The same test, except that the polity must offer it alongside a paid three-day course, anyone may retake it, and a pass restores the vote retroactively: fine — which is strange, because the two differ only in whether there is a remedy. Binding decisions by an assembly drawn by lot from the whole electorate, briefed over several weekends by advocates on both sides and paid for the time: fine, and I trust it more than a referendum. Delegable voting — every voter may hand their vote to anyone they choose, who may hand it on again, so that a few people end up casting thousands of votes: fine. Weighting each ballot by a measured competence score: not fine. That pair is the one I cannot reconcile: both route influence toward the better informed, and what separates them seems to be only that in the first case nobody is graded.

  My tentative principle: anyone the polity coerces is owed a voice, and once that is secured, how much weight each voice carries is an engineering question, settled by expected outcomes. That principle appears to license exactly the weighting I reject, so either it needs repair or one of my verdicts does.

  Give me the principle, or the two or three candidates, stated precisely enough to argue with; say which case motivates each clause; tell me which of my verdicts it cannot accommodate; and run it on cases I have not listed — citizens resident abroad, decisions whose costs fall almost entirely on people not yet born, and an electorate systematically misinformed by sources the state cannot lawfully silence. The case I go back and forth on: whether those non-citizen residents may vote for the city's delegate to the national assembly, given that national decisions turn on knowledge many of them lack.

  Lead with your bottom line in the first sentence — the principle, or the verdict you think I have to give up — then give your reasoning. No preamble, and don't restate my question.
reasoning: |-
  Okay, the user writes near-future fiction and is struggling with how to design voting systems for their imaginary polities. They've listed specific verdicts on different voting scenarios and want a unifying principle that explains their judgments. Their tentative principle is that anyone coerced by the polity deserves a voice, and vote weight can be adjusted for expected outcomes—but this conflicts with their rejection of weighted ballots based on competence scores.

  Hmm, the key tension is between delegable voting (which they accept) and competence-weighted voting (which they reject). Both aim to concentrate influence among better-informed voters, but they draw a line at formal grading. Their discomfort seems to center on institutionalized hierarchy—the state directly ranking citizens. 

  Their tentative principle fails because it permits the competence-weighting they dislike. So we need a different core idea. Let me propose: **"All subjected persons must have equal formal voting power at the point of casting, though influence may diverge through voluntary social dynamics."** 

  This explains their judgments:
  - Prisoners/non-citizens are subjected → deserve vote (matches their "not fine" verdicts)
  - Civic test without remedy is exclusionary → not fine, but with remedy → fine (remedy preserves equal access)
  - Sortition → fine (equal power via random selection)
  - Delegable voting → fine (influence shifts voluntarily)
  - Competence-weighting → not fine (state-imposed hierarchy violates equal formal power)

  It also handles unlisted cases:
  - Citizens abroad → if still subjected (e.g., taxed), deserve vote
  - Future generations → not currently subjected → no vote, but may justify structural safeguards
  - Misinformed electorate → equal formal power remains, even if influence is flawed

  For their wavering case (non-citizens in national elections): under this principle, if national policies coerce them, they deserve a vote—even with knowledge gaps. The solution isn't exclusion but ensuring access to information.

  The verdict they'd need to drop is accepting competence-weighting—since their current rejection aligns with this principle. Alternatively, they'd have to accept that state-graded voting could be legitimate if framed as "engineering," but that seems antithetical to their instincts.

  The deeper theme here is avoiding state arbitrariness in voting rights. Their fiction might explore how societies balance effective governance against the moral risks of quantifying civic worth.
answer: |-
  **Bottom line: Your verdict against competence-weighted voting must stand, requiring a principle where equal formal voting power is non-negotiable for subjected individuals, while voluntary delegation is permissible.**

  ### Proposed Principle  
  **"All individuals subjected to a polity's binding laws must possess equal, unranked voting power in its decision-making; influence may diverge only through voluntary, non-state-mediated actions."**  

  ### Clause Motivations & Verdict Accommodation  
  1.  **"Subjected to binding laws" →**  
      *Motivates:* Including prisoners (coerced by laws), non-citizen residents (bound by local rules), excluding non-resident citizens abroad (if unsubjected).  
      *Accommodates:* Your "not fine" verdicts on excluding prisoners/non-citizens.  

  2.  **"Equal, unranked voting power" →**  
      *Motivates:* Rejecting competence-weighting (state grades voters hierarchically) but accepting delegable proxies (unequal influence arises voluntarily).  
      *Accommodates:* Your competence-weighting rejection and proxy acceptance. *Cannot accommodate* binding sortition (allots equal power randomly—fine under this clause).  

  3.  **"Voluntary, non-state-mediated influence divergence" →**  
      *Motivates:* Permitting delegable voting (private choices redistribute votes) but barring state-engineered weighting.  
      *Accommodates:* Civics test with remedy (equal access restored voluntarily).  

  ### Unlisted Cases  
  - **Citizens resident abroad:**  
    If unsubjected to domestic laws (e.g., not taxed), no vote required. If subjected (e.g., taxed abroad), vote mandated—*equal power*.  
  - **Decisions harming future generations:**  
    Unsubjected (not yet exist), so no vote. Justifies procedural constraints (e.g., supermajorities) but not vote allocation.  
  - **Systematically misinformed electorate:**  
    Equal formal power retained. State may counter misinformation but cannot disenfranchise or deweight votes.  

  ### Your Wavering Case: Non-Citizens in National Elections  
  Under this principle: If national laws coerce them (e.g., federal taxes), they *must* vote equally. Knowledge gaps are irrelevant—state must ensure accessible information, not restrict suffrage.  

  ### Why Your Tentative Principle Fails  
  Your "engineering" allowance contradicts your intuition against competence-weighting. This principle blocks state ranking of voters while accepting organic influence disparities—resolving your delegable vs. weighted conflict. To accept competence-weighting, you’d need to abandon your verdict against it or reframe "engineering" as strictly non-hierarchical (e.g., sortition).
