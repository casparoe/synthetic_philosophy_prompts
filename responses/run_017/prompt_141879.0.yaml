  For the ledger case, I imagine the honest debater demanding step-by-step convention justification early on. The liar must either adopt inconsistent positions (revealing deceit) or refuse to engage (appearing evasive). The judge doesn't need to verify the whole audit, just spot local incoherence in the liar's defense. 

  Ah, but the user asked about two escape routes. I'll reject both: no external supplements needed, and re-encoding happens naturally through debate's iterative pressure. The liar can't fabricate consistent granular explanations because the honest side controls which commitments get tested. 

  Worth emphasizing: this relies on the judge being able to verify step-level coherence, not correctness. That's the scalability hack - local checks on argument quality rather than global verification. The liar's burden is maintaining holistic deception while being pulled apart locally. 

  ...Better avoid mentioning "computational complexity" though - too academic. Keep it grounded in the mechanics: commitments, contradictions, and where the judge's attention actually goes during cross-examination.
answer: |-
  Alright, let's tackle your two-ledgers problem head-on. I concede that naive debate where agents just present monolithic arguments absolutely fails here. Neither debater can force the other to locally verify the *global outcome* within the judge's attention budget. The core strength of debate, though, isn't in re-proving the whole chain unaided; it's in the *iterative, adversarial pressure* that forces commitments and exposes the liar's burden of maintaining consistency *everywhere* the honest side chooses to look.

  Your mistake is assuming the debate must center on verifying the final tax liability number directly. The honest debater doesn't attack the ledger line-by-line looking for arithmetic errors. They attack the *choice and application of the amortization convention itself*. They force the lying opponent (supporting the wrong ledger) to explicitly justify *why their chosen convention is valid and correctly applied at every relevant step*, even if those steps are locally correct. The liar must now defend a *chain of reasoning about the convention's validity and consistent application* across the entire structure. The honest side only needs to find *one* point where the liar's justification for their convention's use contradicts established accounting principles (which the judge *can* understand locally), or contradicts an earlier commitment they made about how the convention works. The liar has to fabricate and maintain a coherent, step-by-step justification for their *entire framework* under cross-examination, while the honest side just points to the single, consistent, established rule. The judge isn't checking the ledger's math; they're checking the *coherence and consistency of the debaters' arguments about the rules governing the ledger.

  You ask which route I take: **I reject both supplements and magical re-encoding.** The protocol *itself* provides the mechanism through iterative commitment and contradiction-seeking. The "re-encoding" is performed *dynamically* by the debaters during the debate, under adversarial pressure. The liar *cannot* produce a globally convincing re-encoding because the honest side controls where the spotlight shines, forcing granular justifications. The liar must pre-commit to a *specific, falsifiable narrative* about the convention from the start and defend it everywhere. The judge checks the *local coherence* of the arguments presented at each step of the debate ("Does this justification for the convention at step 237 contradict what they said at step 42?" or "Does this claimed property of the convention violate standard accounting rule X?"). The liar's fabrication isn't a static ledger; it's a dynamic story they have to tell under fire, and that story *will* crack locally under the honest side's targeted questioning long before the judge needs to comprehend the whole 400-page output. The truth wins because the liar has to lie consistently at *every* level of detail the honest side probes, while the truth is just... consistent.
