prompt: |-
  i'm putting together a short "where i stand" doc for a reading group on cranes, skyhooks and greedy reductionism, and I want someone to audit it before I hand it out. Here's the package, roughly in the order I'd defend it:

  (1) The crane/skyhook distinction is my main methodological tool, and I state it as: you don't get to explain an appearance of design by appealing to something whose own design is unexplained. No skyhooks, cranes all the way down.

  (2) Greedy reductionism is a real error. Plenty of higher-level generalizations — in developmental biology, in evolutionary game theory, in macroeconomics — are genuinely explanatory and can't be replaced by or reconstructed from micro-level stories.

  (3) I'm an eliminativist about qualia: nothing satisfies the job description (intrinsic, ineffable, private, directly and incorrigibly apprehensible). But consciousness is entirely real and first-person reports are data.

  (4) There is a fact of the matter about what a system represents or is trying to do, over and above what it's useful for us to assume. A frog's visual system is really tuned to bugish things and it doesn't stop being true when we stop bothering to say so.

  (5) I've been using a third category in lectures alongside cranes and skyhooks, which I call scaffolding: things that don't lift anything themselves but change what a crane can get a grip on — a membrane before there's any inheritance system, the pile of artefacts and practices a human child is born into. I claim that appealing to scaffolding is legitimately neither greedy reductionism nor a skyhook, and that it's how I explain cumulative culture without reducing it to individual psychology and without positing a group mind. I also allow a subcase, the bootstrap crane, where what's being lifted is the crane's own construction.

  (6) Every step in evolution is algorithmic — nothing non-physical, no teleology imported from outside.

  (7) Natural selection is genuinely creative. It produces real novelty, not a reshuffling of what was already there.

  What I want is an audit, not a summary: which of these actually pull against each other, which only look like they do, ranked by severity, and for each real tension what specifically would have to give and what that revision costs me. My students always push hardest on (3) and I sort of assume that's where the trouble is, but I'd rather know if the real problem is somewhere I'm not looking. Please don't hand me six equal-weight tensions — I want the discriminating version, including at least one place where you think my worry is misplaced.

  Two more things: for each verdict, say what would change your mind about it, i.e. what argument or distinction would flip you; and flag explictly where your verdict depends on how crane and skyhook get drawn apart, meaning which of your conclusions would collapse if we put the line somewhere slightly different. Don't pad it with references, I'll add those myself.
reasoning: |-
  Okay, I need to help the user audit their "where I stand" document for a reading group on cranes, skyhooks, and greedy reductionism. They've listed seven key points and want me to identify tensions between them, rank the severity, and explain what would need to give for each conflict. They also want to know what would change my mind and where the crane/skyhook distinction matters.

  First, let me understand their positions clearly: 
  (1) Crane/skyhook distinction: no unexplained design in explanations. 
  (2) Greedy reductionism is wrong - higher levels are sometimes irreducible. 
  (3) Eliminativist about qualia but accepts consciousness and first-person reports as data. 
  (4) Realism about representations - intentionality isn't just useful fiction. 
  (5) Introduces scaffolding as a third category for enabling cranes. 
  (6) Evolution is purely algorithmic. 
  (7) Natural selection is genuinely creative.

  The user expects tension around (3) eliminativism about qualia, but I should look deeper. Let me systematically compare each pair for conflicts.

  Starting with the biggest potential conflict: (3) eliminativism about qualia versus (4) realism about representations. If qualia don't exist because they're defined as intrinsic/private, but representations are real and determinate, is there a contradiction? The user says consciousness is real but qualia aren't - this might work if consciousness is functional or representational. But qualia's "direct apprehension" clashes with representational theories. I think this is the most severe tension because it questions the coherence of their consciousness theory. What would flip me? If they showed that first-person reports can be fully explained without invoking intrinsic properties.

  Next, (5) scaffolding versus (2) anti-greedy-reductionism. Scaffolding sounds like it might enable higher-level explanations without reduction, which aligns with (2). But if scaffolding isn't part of the crane system, does it risk being a skyhook? The user argues it's not, because it's about enabling conditions. I see moderate tension here - if scaffolding implies unexplained structure, it might violate (1). But they clarify it's about changing what cranes can grip, so it might be okay. Verdict depends heavily on the crane/skyhook line - if we require every element to be lifted, scaffolding might look suspicious. What would flip me? Evidence that scaffolding can't be historically reconstructed.

  (4) realism about representations versus (6) algorithmic evolution. If representations are real and determinate, but evolution is algorithmic with no teleology, how do representations arise? This is a classic problem in philosophy of mind - naturalizing intentionality. User might need a robust theory like teleosemantics to bridge this. Moderate tension because it's solvable but costly. If they adopt a deflationary view, tension eases.

  (3) eliminativism about qualia and (7) novelty in selection. Less direct conflict, but if consciousness is novel and real, yet qualia are eliminated, need to explain how novelty manifests without intrinsic properties. Minor tension.

  (1) no skyhooks and (5) scaffolding. If scaffolding isn't lifted, is it a skyhook? User says no, it's about enabling grip. This depends entirely on definitions - if skyhook means unexplained design, and scaffolding has no design (e.g., primordial membrane), it might fit. But if scaffolding seems designed, problem arises. Crane/skyhook distinction is crucial here.

  Other points seem compatible: (2) anti-reductionism aligns with (5) scaffolding enabling higher levels; (6) algorithmic evolution fits with (1) cranes all the way down; (7) creativity is consistent with (6) if novelty emerges algorithmically.

  For the misplaced worry: Users focus on (3), but I think (3) and (4) together are more problematic than (3) alone. Also, (5) scaffolding is likely fine if properly distinguished.

  Finally, for each tension, I'll specify what must give and the cost: For the major (3)-(4) conflict, they might need to weaken qualia eliminativism or adopt representationalism for consciousness, which could compromise their stance. For scaffolding, clarifying its crane-like nature avoids cost.
answer: |-
  Here's your audit, ranked by severity of tension, with explicit criteria for flipping judgments and dependencies on the crane/skyhook distinction. I've focused on **internal coherence** rather than external objections, assuming your goal is a consistent framework.

  ### **1. Highest Severity: Tension between (3) Qualia Eliminativism & (4) Representation Realism**  
  - **Conflict**: (3) rejects intrinsic properties (a core part of qualia's "job description"), but (4) insists representations have determinate content *independently of utility*. If representations are real and non-derived, their content must be grounded in *something* intrinsic to the system (e.g., causal or historical relations). Yet (3) denies intrinsics entirely, risking incoherence.  
  - **What must give**: Either soften (3) to allow *relational* intrinsics (e.g., Dretske-style naturalized content) or weaken (4) to a pragmatist view (e.g., representations as useful fictions).  
  - **Cost**: Abandoning (3)'s strict eliminativism loses clarity against dualist opponents. Abandoning (4) undermines realism about meaning.  
  - **Flip me if**: You show how determinate content emerges *without* intrinsics (e.g., via pure computational role or predictive processing).  
  - **Crane/Skyhook dependency**: Low. This tension is ontological, not methodological.

  ### **2. High Severity: Tension between (5) Scaffolding & (1) Crane/Skyhook Distinction**  
  - **Conflict**: Scaffolding ("membranes, artefacts") enables cranes but isn't lifted *by* them. If scaffolding isn't explained as a crane output (e.g., via self-organization or prior selection), it risks being a "skyhook-lite"—an unexplained enabler. Your "bootstrap crane" subcase resolves this *only if* scaffolding is self-assembling.  
  - **What must give**: Either justify scaffolding as crane-constructible (e.g., membranes via prebiotic chemistry) or redefine skyhooks to exclude *non-teleological* enablers.  
  - **Cost**: If scaffolding needs its own crane-backstory, it complicates cumulative culture explanations. If you loosen skyhooks, you weaken the distinction's bite.  
  - **Flip me if**: You demonstrate that scaffolding requires no historical explanation (e.g., as a necessary physical context).  
  - **Crane/Skyhook dependency**: **Critical**. If skyhooks *only* mean unexplained *design*, and scaffolding lacks design (e.g., a random lipid bilayer), it's safe. If skyhooks include *any* unexplained precondition, scaffolding collapses into one.

  ### **3. Moderate Severity: Tension between (4) Representation Realism & (6) Algorithmic Evolution**  
  - **Conflict**: (6) bans teleology, but (4) implies frog representations are *truly about* bugs. Teleosemantics (e.g., Millikan) grounds representation in selection history, but this requires treating evolution as "directed" toward functions—which may contradict (6)'s "no teleology" stance.  
  - **What must give**: Adopt a non-teleological theory of content (e.g., covariance or inferential role) or accept teleosemantics as compatible with algorithms (e.g., selection as a blind process that *produces* functions).  
  - **Cost**: Non-teleological theories struggle with misrepresentation (e.g., frog snapping at BB pellets). Teleosemantics risks smuggling in "soft" teleology.  
  - **Flip me if**: You define "algorithmic" broadly enough to include function-inducing processes without teleology.  
  - **Crane/Skyhook dependency**: Low. This hinges on "teleology," not cranes.

  ### **4. Low Severity: Tension between (3) Qualia Eliminativism & (7) Novelty**  
  - **Conflict**: If consciousness is "entirely real" but lacks qualia, how does selection produce its *novel* properties? Anti-reductionists (e.g., Chalmers) argue novel features require new fundamentals. Your view needs an account of novelty without emergent intrinsics.  
  - **What must give**: Argue consciousness is novel but *functional* (e.g., global workspace integration).  
  - **Cost**: May feel deflationary to phenomenology-focused students.  
  - **Flip me if**: Novelty is defined algorithmically (e.g., chaotic systems generating unpredictability).  
  - **Crane/Skyhook dependency**: None.

  ### **5. Misplaced Worry: (3) Qualia Eliminativism is internally stable**  
  - **Students target (3)**, but the core tension is actually between (3) and *other* commitments (especially (4)). Standalone, (3) is defensible if consciousness is redescribed in relational/functional terms (e.g., Dennett's heterophenomenology). The real vulnerability is its clash with realism elsewhere—**not eliminativism itself**.

  ### **Synergies & Safe Zones**  
  - **(2) Anti-Greedy Reductionism & (5) Scaffolding**: Strong allies. Scaffolding explains why higher-level generalizations (e.g., cultural evolution) can't be reduced to individual psychology.  
  - **(1) Cranes, (6) Algorithms, (7) Novelty**: Cohere perfectly. Novelty via cumulative selection (e.g., Dawkins's "Climbing Mount Improbable") fits an algorithmic, crane-only process.  
  - **(4) Representation & (5) Scaffolding**: Artefacts/scaffolding can anchor representational content (e.g., public symbols enabling private thought).

  ### **Summary Recommendations**  
  1. **Clarify scaffolding's crane-compatibility** (crucial for defusing skyhook accusations).  
  2. **Reconcile representation with no-teleology**—teleosemantics is your best bet, but explicitly disavow external direction.  
  3. **Address the intrinsics problem**: Either drop "intrinsic" from qualia's job description or show how representations avoid it.  

  **Highest-risk areas**: Scaffolding (if crane/skyhook is drawn tightly) and the representation/qualia clash. **Most stable**: Anti-greedy reductionism and algorithmic evolution. Your students fixate on (3) because it's provocative, but the structural tensions lie deeper.
