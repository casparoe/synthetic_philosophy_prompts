  - Bridge: Requires careful utility conceptualization—doable in a year.
  - Cheap commitment: Might need game theory, which could stretch 12 months. Riskier.

  Upstreamness: Fixing recurrence could resolve half of cheap commitment. Solving bridge strengthens all pump arguments. Cheap commitment feels more niche.

