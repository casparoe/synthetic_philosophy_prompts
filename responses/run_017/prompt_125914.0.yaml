answer: |-
  Below is a prioritized research agenda for three one-year fellowships focused on coherence arguments for expected utility maximization, designed to advance durable conceptual progress while leaving open the door to influencing economics/policy. I’ll defend the ordering based on **importance** (impact on the core debate), **upstreamness** (how resolving it clarifies or dissolves dependent questions), **tractability** (feasibility for a lone philosopher in 12 months with no new data), and **neglectedness** (where fresh attention could yield breakthroughs). I address your doubts explicitly, confirming they are live questions—not confusions—and integrate them into the agenda. Trade-offs between the foundation’s two aims (conceptual progress vs. economic/policy relevance) are flagged at each step.

  The ordering prioritizes questions that:
  - Unlock multiple downstream issues (**upstreamness**).
  - Tackle foundational ambiguities in the exploitation arguments (**importance**).
  - Avoid over-reliance on formal machinery or empirical work (**tractability**).
  - Have been underexplored relative to their significance (**neglectedness**).

  **Core Trade-offs in Prioritization:**
  - **Importance > Tractability > Upstreamness > Neglectedness**: Conceptual progress is the primary aim, so I favor questions that redefine the debate even if challenging. Neglectedness is secondary but crucial for avoiding duplication.
  - **If policy relevance is weighted more**: Shift focus to questions bridging theory and application (e.g., the Bridge worry). I’ll note how weighting affects ordering.
  - **Your doubts**: All are substantive and unresolved. Recurrence and Bridge are upstream; Cheap-Commitment is downstream but exposes hidden assumptions.

  ---

  ### **Priority 1: The Recurrence Worry (Year 1)**  
  **Question**: *Can coherence arguments (e.g., money pumps) justify expected utility maximization when choice situations are non-recurrent, rare, or contextually unique?*  

  **Why a year?**  
  - **Importance**: If exploitation requires recurrent choice paths, the necessity of axioms (e.g., transitivity, independence) collapses for agents facing finite, diverse decisions. This strikes at the heart of whether coherence is a universal requirement or a context-dependent tool.  
  - **Upstreamness**: Resolving this dissolves or clarifies your Cheap-Commitment worry (if choices don’t recur, precommitment is irrelevant) and the Bridge worry (if pumps rarely "activate," extracting money is moot). It also affects broader debates:  
    - Is rationality "diachronic" (across time) or "synchronic" (at a single moment)?  
    - Do axioms apply to "small worlds" (bounded decisions) or only "grand worlds" (lifelong sequences)?  
  - **Tractability**: Philosophers can work with existing decision-theoretic models (e.g., Savage, Jeffrey) and modal logic to analyze recurrence assumptions. No new data is needed—only conceptual refinement of "recurrence" (e.g., is it frequency, similarity, or counterfactual availability?).  
  - **Neglectedness**: While raised in passing (e.g., by Schick or McClennen), it lacks systematic treatment. Dynamic choice theorists assume recurrence but rarely defend it.  

  **Target Outcome**: A taxonomy of decision contexts (e.g., one-shot vs. repeated, ordinally vs. cardinally structured) where coherence arguments succeed or fail. **Move up if**: Someone formalizes a "minimal recurrence threshold" for exploitation. **Move down if**: Recurrence is shown to be trivially necessary, but this is unlikely—your kinetics intuition about process frequency is apt.  

  **Weighting Trade-off**:  
  - If policy relevance is emphasized, this *stays top*. Economics often assumes recurrent decisions (e.g., consumer choices), so clarifying limits would directly impact models of "irrational" agents.  

  ---

  ### **Priority 2: The Bridge Worry (Year 2)**  
  **Question**: *Can money-pump arguments be reformulated as "utility pumps" without assuming the agent values money linearly, or does this beg the question by smuggling in expected utility?*  

  **Why a year?**  
  - **Importance**: The jump from "loses money" to "is worse off" is the Achilles' heel of exploitation arguments. If reformulation fails, coherence may only enforce *instrumental* rationality (e.g., avoiding dominated options), not expected utility.  
  - **Upstreamness**: Success here would generalize money pumps to non-monetary domains (e.g., health, time), strengthening arguments for the axioms. Failure could collapse the entire project into circularity. It also clarifies the Recurrence worry: if utility is extracted directly, recurrence may matter less.  
  - **Tractability**: Pure conceptual work on utility representation (e.g., using von Neumann-Morgenstern or state-dependent utility). Philosophers can engage with "veiled" utility pumps (e.g., Hájek’s work) without new formalism.  
  - **Neglectedness**: Economists (e.g., Rabin) critique money pumps, but philosophers underinvest in axiomatic alternatives. Your insight—that money may proxy for utility questionably—is rarely confronted head-on.  

  **Target Outcome**: A decision-independent "value measure" for pumps (e.g., opportunity costs or cardinal rankings) or a proof that no such measure exists. **Move up if**: Linked to Recurrence (e.g., "utility pumps" in non-recurrent contexts). **Move down if**: Deemed intractable, but progress is likely via refinements like "stochastic pumps."  

  **Weighting Trade-off**:  
  - If policy relevance is weighted more, this *rises to Priority 1*. Economists model agents with non-linear money utility (e.g., prospect theory), so a utility-pump reformulation could directly inform behavioral models.  

  ---

  ### **Priority 3: The Cheap-Commitment Worry (Year 3)**  
  **Question**: *If agents can avoid exploitation via low-cost precommitment (e.g., refusing cycles), does this undermine coherence arguments or reveal that rationality is about managing costs of dynamic choice?*  

  **Why a year?**  
  - **Importance**: Cheap commitment could make axiom violations *locally* rational (e.g., intransitivity in isolated choices), reframing coherence as a tool for reducing cognitive/transactional costs—not a logical necessity. This challenges the standard narrative.  
  - **Upstreamness**: Depends on Recurrence and Bridge. If recurrence is rare or utility pumps fail, precommitment dissolves exploitation risk. If both are resolved, Cheap-Commitment becomes a question about the *scope* of rationality (e.g., does it include self-binding?).  
  - **Tractability**: Analyzes existing game-theoretic work on precommitment (e.g., Schelling) but avoids heavy machinery by focusing on "cost thresholds" (e.g., when is commitment cheaper than axiomatic compliance?).  
  - **Neglectedness**: Raised by Machina and McClennen, but not deeply integrated with modern coherence arguments. Your "costs of self-management" angle is underexplored.  

  **Target Outcome**: A framework for when precommitment is rational, and whether it rescues or refutes coherence arguments. **Move up if**: Linked to economic applications (e.g., commitment devices in behavioral policy). **Move down if**: Recurrence/Bridge shows commitment is rarely needed.  

  **Weighting Trade-off**:  
  - If policy relevance is emphasized, this *stays last*. Precommitment is empirically studied (e.g., in behavioral economics), but its philosophical implications are less urgent for modeling irrational agents.  

  ---

  ### **Why Not Other Questions?**  
  - **Completeness/Continuity Axioms**: Less upstream—violations (e.g., incompleteness) don’t always enable exploitation, making them downstream of Recurrence/Bridge.  
  - **Formal Epistemology (Broad)**: Too diffuse. Coherence arguments are a pillar; progress here could later expand to belief-based rationality.  
  - **Empirical Applications**: Excluded per your constraints (no new data).  

  ### **On Your Doubts**  
  - **Recurrence**: A live question. Key ambiguity: "Recurrence" could mean identical choice repetition (unrealistic) or sufficiently similar choice types (plausible but undefined).  
  - **Cheap-Commitment**: A live question. Not a pseudo-problem—it reveals that coherence arguments may assume **transaction costs** (e.g., effort to precommit), which are rarely justified.  
  - **Bridge**: A live question. Ambiguity lies in "utility": If defined behaviorally, money pumps may work; if defined experientially, they may not.  

  ### **Ordering Rationale Summary**  
  1. **Recurrence** first because it is **maximally upstream**: It determines whether exploitation is possible at all. Progress here could simplify or dissolve other worries.  
  2. **Bridge** next because it determines whether exploitation, when possible, actually refutes violations.  
  3. **Cheap-Commitment** last because it **presupposes** the first two—if pumps don’t work, commitment is irrelevant.  

  **If policy relevance is weighted**:  
  - Bridge (Priority 1) → Recurrence (Priority 2) → Cheap-Commitment (Priority 3).  
  - *Why*: Economists need utility-pump reformulations to model real agents. Recurrence remains key but is more niche empirically.  

  This agenda ensures each fellowship builds on the last, with Year 1 laying the foundation for Years 2–3. A successful outcome would be a unified account of when, why, and for whom coherence demands expected utility—potentially reshaping debates in philosophy and economics alike.
