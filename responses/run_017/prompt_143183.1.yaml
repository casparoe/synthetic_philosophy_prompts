  hey — please act like a professor of philosophy of mind and philosophy of language who also actually knows how translation models are trained, and take this seriously: brainstorm a bit before committing, think through it step by step, and dont just tell me "its complicated." im 16, i got into a big argument online about this, and now i think my own argument might be broken but i cant find where.

  so: we read this hofstadter essay in english class (the one where he goes on about how shallow statistical machine translation is, that it doesnt understand anything, it just pushes symbols around using statistics — there's also that old probably-fake story about a bible line coming out as something about vodka and rotten meat) and i thought his complaint was obviously right but kind of hand-wavy, so i tried to turn it into a real argument for a presentation. Problem is it came out way too strong. it seems to prove a bunch of humans dont understand things either, which i dont believe, and once i fix that im scared i lose the thing i was trying to show. Here it is, more or less as i wrote it:

  (1) To understand a sentence you need more than knowing which words tend to go with which other words. you need some grip on what the words are about — on what would have to be true in the world for the sentence to be true. call this the hookup condition: the words have to hook onto things, not just onto each other.

  (2) The swap test. take a huge parallel corpus — the same documents in english and, say, finnish — and do a systematic substitution: replace every word-type in both languages with its own made-up symbol, keeping every occurrence exactly where it was. Every distributional fact survives untouched: which symbols co-occur, how often, in what order, across which aligned sentences. So a purely statistical learner trained on the swapped corpus ends up in exactly the same internal shape as one trained on the real one, and pairs off sentences just as well.

  (3) In the swapped corpus the symbols are just placeholder marks. So the learner isnt hooking onto dogs or corkscrews or anything else: it cant tell the real language from the swapped one, because there's no statistical difference to tell them apart — and if it cant tell them apart, it doesn't represent the difference either.

  (4) A statistical translation system is exactly such a learner: everything it gets out of training is distributional facts of that kind. So no such system meets the hookup condition, no matter how much data or how fluent the output looks. call the result hollow fluency — sentences that look right without being about anything. (this is the part i wanted. I think its basically hofstadter's point.)

  (5) But now put a human in the system's place. A linguist cracks an undeciphered script working from a pile of inscriptions and two bilingual texts: no speakers, no pictures, nothing to check against. OK, she also guesses at what the inscriptions are probably about — tombs, kings, deliveries of grain — and tests those guesses against the pattern of signs. Still, most of her evidence is distributional. By (2) and (3) she doesnt understand the language she just deciphered. That seems false.

  (6) And it gets worse: the same reasoning seems to run for any subject where all you have is texts. A historian reading nothing but letters and tax rolls from the 1340s apparently doesnt understand what she's reading either, since her evidence is word-to-word too.

  (7) So one of (1)–(4) has to go. The two things i care most about keeping are (1) — the whole point is that these programs dont know what anything means — and that the decipherer understands. And i definately dont want to end up saying the translation model "understands," because i dont think it does.

  someone in the thread told me (3) is just bad: they said im confusing "cant tell the difference" with "doesnt represent the difference," and that a system can borrow its hookup secondhand from the people who wrote the corpus and the people who read its output, even if it cant tell what it's hooked to — the way a phone number refers to someone without knowing anything about them. (half-remembered: i think some philosopher distinguishes "derived" from "original" intentionality? maybe Dennett, or a guy named Haugeland?) That sounds promising but it also seems like it would save the model, and then my presentation has no conclusion.

  give me exactly five numbered points, one or two sentences each, no intro and no summing-up at the end:

  1. which step you'd reject
  2. why that step looked fine when i wrote it
  3. what i actually lose by rejecting it
  4. which of my other claims gets weaker as a knock-on effect — in particular, whether the hookup condition or the decipherer case is the one in trouble
  5. the strongest thing someone could say for keeping (1)–(4) and just accepting the weird conclusions instead
reasoning: |-
  Hmm, the user is a 16-year-old who got into an online argument about machine translation and understanding, inspired by Hofstadter's essay. They developed an argument that seems to prove too much—concluding that even human decipherers don't understand language—and now they're stuck. I need to help them identify the flaw while preserving their core intuition that AI lacks genuine understanding.

  Breaking down their argument: Premise (1) claims true understanding requires hooking words to reality (the hookup condition). (2) introduces the swap test thought experiment. (3) concludes that statistical learners can't meet the hookup condition. (4) extends this to machine translation systems. (5) and (6) show this would also invalidate human decipherers/historians. (7) identifies the contradiction.

  The user wants to keep (1) and the decipherer's understanding while rejecting machine understanding. Their online interlocutor challenged step (3), suggesting derived intentionality (like Dennett's or Searle's "as if" intentionality) could save the model. But the user worries this would undermine their critique of AI.

  I think the core flaw is in step (3)'s inference. The argument conflates the system's internal capabilities with the broader communicative context. While the system itself lacks original intentionality, it functions within a network of human intentionality—the corpus creators and output users provide the "hookup." This doesn't mean the system understands, but it explains why its outputs can be meaningful despite its internal emptiness. 

  For the decipherer, unlike the AI, their distributional analysis is constrained by prior understanding of reality (e.g., knowing what kings or grain deliveries entail). Their hypotheses are grounded in world-knowledge, not just statistics. The historian similarly brings background understanding to the texts.

  Rejecting step (3)'s absolute claim doesn't lose the critique of AI—we can still say machines lack original intentionality. The hookup condition (1) remains valid for full understanding, but we acknowledge degrees of derived meaning. The decipherer case stays intact because humans supply the missing grounding.

  The strongest defense of the original argument would be to bite the bullet and deny that the decipherer fully understands—but this seems counterintuitive and risks circularity. Better to refine the hookup condition to account for contextual grounding.
answer: |-
  Here are five numbered points addressing your query:

  1.  **Rejected Step:** Step (3): "So the learner isn't hooking onto dogs or corkscrews or anything else... if it can't tell them apart, it doesn't represent the difference either." This inference is flawed.
  2.  **Why it Looked Fine:** It intuitively seems that indistinguishable inputs must lead to indistinguishable internal states regarding "aboutness." You equated the system's *inability to detect the swap* with an *inability to have its symbols be about anything*.
  3.  **What You Lose:** You lose the absolute claim that *no* statistical system using *only* distributional data can ever have symbols that are "hooked up" to the world *in any sense*. You must accept that "hooking up" can be *derived* from the system's role in a larger communicative context involving humans, even if the system itself lacks intrinsic understanding.
  4.  **Knock-on Effect:** The **hookup condition (1)** gets nuanced. While you can argue the system lacks *original* or *intrinsic* understanding (the strong hookup you intended), it gains *derived* intentionality via its connection to human users and corpus creators. This preserves the decipherer/historian cases – *they* supply the original intentionality grounding the symbols they interpret, explaining their genuine understanding.
  5.  **Strongest Defense of (1)-(4):** One could insist the **decipherer/historian (5/6) doesn't achieve *full* understanding**, only a formal mapping or "as if" interpretation constrained by distributional patterns + plausible guesses. Their understanding remains fundamentally hollow without direct, non-textual access to the referents, mirroring the AI's limitation. (This bites the bullet you wanted to avoid).
