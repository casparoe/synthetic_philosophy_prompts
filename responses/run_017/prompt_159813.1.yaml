prompt: |-
  I am drafting a paper on the epistemology of moral testimony, and before I look at how anyone has handled it I want the specification: what would an account of moral testimony have to be able to do in order to count as adequate for the purpose I actually have in mind.

  The purpose is institutional rather than merely biographical. I need an account good enough to tell a body that has to act — a hospital ethics committee, a research funding panel, a legislature writing rules for systems whose moral status is not settled — whether, how much, and in what form the moral judgments of designated others count as reasons for that body. An account that only sorts individual beliefs into justified and unjustified is too weak for me; one that only licenses action is too strong. So part of the specification I want is a view on what the object of assessment is: belief, action, understanding, credit, or several of these at once, and whether one verdict can be expected to cover all of them.

  Please give me the requirements list, with the case or consideration behind each requirement, and mark each one as non-negotiable, negotiable, or a preference of one camp. Among the cases I want covered, and I expect you to add ones I have missed:

  - Layered deference. Someone trusts a marine biologist that a certain fishing method kills fish slowly by suffocation, that this matters morally, and that it is therefore wrong to buy that fish. Where exactly in that chain does the familiar reluctance attach, if it attaches anywhere? An account should locate the layer rather than treat deference as one thing.
  - Novel moral kinds. Testimony that a class of beings — insects, collectives, artificial systems — has moral status, addressed to someone who lacks the conceptual repertoire to assess the claim. Can testimony transmit a moral concept, or only a verdict expressed in concepts one already has?
  - Constitutive rather than reportive deference. A person defers to a community or a friend about whether she has been wronged, where the deference seems partly to make it the case rather than merely to track it.
  - Diachronic deference. Trusting your own earlier or later self's moral judgment, in writing or memory. Is this the same phenomenon with the speaker held fixed, or a different one?
  - Deference at scale and under near-zero comprehension. A donor or official defers to a research group about which intervention to fund, where the stakes are large and the deferrer's grasp of the reasoning is close to nothing. Does the discomfort track stakes, comprehension, or neither?
  - Credit, and no double counting. An agent who acts on moral testimony seems to get less credit, or a different kind of credit, than one who gets there herself. State the constraint precisely, and say whether an account may hold both that the deference is epistemically fine and that the deferrer gets full credit for being morally well tuned.
  - The discrimination test. What feature is present in the moral cases and absent from aesthetic, prudential, mathematical, legal, and etiquette testimony? If there is no such feature, say so, and treat that as a result about the list rather than as a gap to be papered over.
  - Conversion speed. Someone who reverses a long-held moral view on the basis of one conversation, versus someone who shifts over years of exposure. Is what bothers us epistemic, agential, or both?
  - Moral disagreement among testifiers. Does the account reduce to a general epistemology of peer disagreement, and if not, what does it add?

  Two further constraints. The account should not smuggle in moral skepticism or relativism without arguing for it; and it should either remain neutral between internalism and externalism about moral judgment or say plainly which one it forces. It should also handle deference to groups and institutions, not only to individuals.

  Three things beyond the list, in descending order of importance to me. First, flag any subset of the requirements you suspect cannot be jointly satisfied — I expect the interesting part is that some pair, perhaps the demand for a principled moral/non-moral distinction and the demand that the account follow from an ordinary epistemology of testimony, pulls apart, and that the list itself then forces a two-tier answer, pessimistic at the level of belief and permissive at the level of action. Second, tell me which desiderata are genuine requirements and which are really the prejudices of one side of the dispute, and which single requirement does the most work in excluding candidate accounts. Third, name the empirical or conceptual finding that would settle the dispute if we had it — what would have to be true for pessimism to be correct.

  Then, briefly, score three or four families of view against the list — an understanding-first pessimism, a skepticism about moral expertise, a symmetry view that treats moral testimony as testimony like any other, and any hybrid that splits belief from action. Label the positions rather than naming authors; I want no citations, no bibliography, and no literature survey. Prose, with a short summary table at the end, and keep the weight on the criteria rather than the scoring.
reasoning: |-
  Okay, let me tackle this user's query. They're drafting a paper on the epistemology of moral testimony, specifically for institutional use. The core need is an account that helps bodies like ethics committees or legislatures decide when and how to rely on others' moral judgments. 

  First, I need to unpack their requirements. They listed several cases: layered deference, novel moral kinds, constitutive deference, etc. Each of these points to different facets of moral testimony that an adequate theory must address. For example, layered deference requires distinguishing between factual and moral elements in a chain of trust. Novel moral kinds ask whether testimony can convey new moral concepts, not just verdicts.

  The user also mentioned constraints: no smuggling in moral skepticism, handling group deference, and neutrality on internalism/externalism. Beyond the list, they want to know if any requirements conflict, which are non-negotiable, and what empirical finding could resolve the debate. 

  Considering the three extra points: potential conflicts likely arise between discrimination (moral vs. non-moral testimony) and symmetry (treating all testimony alike). Non-negotiable requirements include diachronic deference and layered deference because they're fundamental to institutional contexts. The key requirement excluding many accounts might be discrimination—demanding a unique feature in moral testimony.

  For the families of views: understanding-first pessimism struggles with institutional scalability. Symmetry views fail the discrimination test. Hybrid approaches might handle action/belief splits but face credit allocation issues. 

  I should structure the response around the requirements list, noting negotiability. Then address conflicts, key requirements, and the settling evidence. Finally, score the views against the criteria, focusing on how they meet or fail the specifications. The summary table should highlight these evaluations without citations.
answer: |-
  Here is a specification for an adequate account of moral testimony for institutional decision-making, structured as requested:

  **Core Requirements for an Adequate Account (Object of Assessment: Institutional Action-Reasoning)**

  1.  **Layered Deference Analysis (Non-negotiable):** Must distinguish epistemic/moral status at each link in chains like "fact → moral significance → prescriptive verdict → derived obligation (e.g., don't buy)". *Case:* Locates where reluctance (e.g., trusting facts vs. trusting moral significance) arises, crucial for committees assessing expert input.
  2.  **Novel Moral Kinds Transmission (Negotiable/Preference - Pessimist camp):** Must explain if/how testimony can convey *new* moral concepts (e.g., "insect sentience matters") to agents lacking those concepts, or only verdicts using existing concepts. *Case:* Necessary for institutions confronting emerging ethical domains (AI, synthetic biology).
  3.  **Constitutive Deference Recognition (Non-negotiable):** Must accommodate cases where deference *partly constitutes* the moral fact (e.g., trusting a friend/community about being wronged). *Case:* Vital for understanding institutional reliance on community standards or victim testimony.
  4.  **Diachronic Deference Integration (Non-negotiable):** Must explain deference to one's own past/future judgment (e.g., via written policy, memory) and whether it differs epistemically from interpersonal deference. *Case:* Essential for policy consistency, precedent, and institutional memory.
  5.  **Scaled Deference & Comprehension Gap (Non-negotiable):** Must address justification under conditions of high stakes, massive scale, and near-zero comprehension of the reasoning (e.g., funding complex interventions). *Case:* Core institutional reality (donors, legislators, boards).
  6.  **Credit Allocation Constraint (Negotiable/Preference - Optimist camp):** Must specify the relationship between justified deference and the *moral credit/praise* attributable to the deferring agent/institution. Must avoid implying "full credit" if that entails double-counting the testifier's credit. *Case:* Addresses intuitions about moral responsibility in institutional actions based on testimony.
  7.  **The Discrimination Test (Non-negotiable):** Must identify a principled feature distinguishing moral testimony from testimony in aesthetics, prudence, math, law, or etiquette *if such a distinction exists for the phenomena in question (justification, credit, reluctance)*. If no distinction exists, the account must clearly state this as a result. *Case:* Tests the uniqueness of moral testimony concerns; failure implies generality.
  8.  **Conversion Speed Analysis (Negotiable):** Must explain epistemic/agential concerns about rapid vs. slow belief change based on testimony. *Case:* Relevant for institutional responsiveness vs. due diligence.
  9.  **Moral Disagreement Handling (Non-negotiable):** Must explain how disagreement among moral testifiers affects justification, distinct from (or reducible to) general peer disagreement epistemology. *Case:* Institutions constantly face conflicting expert moral advice.

  **Additional Constraints:**
  *   **No Smuggling (Non-negotiable):** Must not presuppose moral skepticism/relativism without explicit argument.
  *   **Internalism/Externalism Clarity (Non-negotiable):** Must explicitly state if it forces internalism or externalism about moral judgment, or remain neutral.
  *   **Group/Institutional Deference (Non-negotiable):** Must handle deference to collectives, committees, and institutions, not just individuals.

  **Beyond the List: Analysis & Key Insights**

  1.  **Potential Conflicts:** The most significant tension lies between:
      *   **The Discrimination Test (Requirement 7):** Demanding a unique feature for moral testimony.
      *   **Symmetry Principle:** The view that moral testimony *should* be treated like other domains (implied if Requirement 7 finds no distinction).
      *   **Action-Permission vs. Belief-Justification:** The pull towards a hybrid view (action justified where belief might not be) arises precisely because satisfying *all* desiderata (especially layered deference, comprehension gap, discrimination, and credit) simultaneously for *belief justification* seems intractable without either abandoning symmetry or embracing pessimism. Requirement 7 is the key driver here.
  2.  **Desiderata Analysis:**
      *   **Non-negotiable Core:** Layered Deference (1), Constitutive Deference (3), Diachronic Deference (4), Scaled Deference (5), Discrimination Test (7), Moral Disagreement (9), No Smuggling, Internalism/Externalism Clarity, Group Deference. These define the institutional scope and avoid question-begging.
      *   **Negotiable/Preference-Driven:** Novel Kinds Transmission (2 - Pessimist lean), Credit Allocation (6 - Optimist concern), Conversion Speed (8). These address important but potentially derivative or contested intuitions.
      *   **Key Excluding Requirement:** **The Discrimination Test (7).** This requirement does the most work in forcing accounts to take a stand on the uniqueness of moral epistemology. Symmetry views struggle to satisfy it without denying uniqueness; pessimist views often define themselves by it; hybrid views must explain the split it potentially motivates.
  3.  **Settling Evidence for Pessimism:** Pessimism (that moral deference cannot yield justified *belief*/understanding) would be correct **if** moral facts/properties were constitutively dependent on first-personal grasp or agential engagement in a way that *no other domain of testimony is* (e.g., if "X is wrong" *means* "I grasp/endorse that X is wrong"). Empirical evidence might involve universal, deep-seated reluctance to defer on core moral matters despite trust, *unexplained* by other factors (risk, stakes, comprehension difficulty alone). Requirement 7 directly probes this.

  **Scoring Families of Views Against Requirements**

  1.  **Understanding-First Pessimism:**
      *   **Strengths:** Excels at Layered Deference (highlights moral layer reluctance), Novel Kinds (denies transmission), Constitutive Deference (fits agential role), Credit Allocation (explains reduced credit), Discrimination Test (asserts uniqueness of moral understanding).
      *   **Weaknesses:** Struggles severely with Scaled Deference (institutions *must* act without understanding), Diachronic Deference (self-trust often *implies* understanding), Group Deference (understanding collective judgments is murky), and Action-Justification (often overly restrictive). Risks Smuggling Skepticism.

  2.  **Skepticism about Moral Expertise:**
      *   **Strengths:** Explains reluctance (Discrimination Test), Layered Deference (doubts moral layer), Credit Allocation (denies full credit).
      *   **Weaknesses:** Fails catastrophically on Scaled Deference, Group Deference, and Action-Justification (paralyzes institutions). Struggles with Constitutive Deference & Diachronic Deference (self/community as expert?). Often Smuggles Relativism/Skepticism. Ignores Moral Disagreement complexity.

  3.  **Symmetry (Moral Testimony = Other Testimony):**
      *   **Strengths:** Handles Scaled Deference, Group Deference, Diachronic Deference, Moral Disagreement (via general epistemology) well. Easily justifies action. Avoids Smuggling.
      *   **Weaknesses:** Fails the Discrimination Test (denies uniqueness). Struggles profoundly with Layered Deference (can't explain specific moral-layer reluctance), Constitutive Deference (ignores agency), Novel Kinds (overly optimistic), Credit Allocation (can't explain reduced credit intuition). May force Externalism.

  4.  **Hybrid (Action/Belief Split - e.g., Justified Action without Justified Belief/Understanding):**
      *   **Strengths:** Best handles Scaled Deference and Action-Justification. Can accommodate Layered Deference & Comprehension Gap concerns for *belief* while permitting *action*. Can explain reduced Credit for belief/understanding while permitting credit for action. Potentially neutral on Internalism/Externalism.
      *   **Weaknesses:** Struggles to coherently define the split object of assessment. May struggle with Constitutive Deference (what is constituted?). Diachronic Deference to past *belief* becomes problematic. Moral Disagreement requires two-tiered analysis. Needs careful argument to avoid Smuggling or inconsistency. Discrimination Test justification is complex (unique for belief, not for action?).

  **Summary Table: Core Requirement Fulfillment**

  | Requirement               | Understanding-First Pessimism | Skepticism re Expertise | Symmetry View         | Hybrid View (Action/Belief) |
  | :------------------------ | :---------------------------- | :---------------------- | :-------------------- | :-------------------------- |
  | **1. Layered Deference**  | Strong                        | Strong                  | Weak                  | Moderate (Split)            |
  | **3. Constitutive Def.**   | Strong                        | Weak                    | Weak                  | Moderate                    |
  | **4. Diachronic Deference**| Weak                          | Weak                    | Strong                | Moderate/Weak (Belief)      |
  | **5. Scaled Deference**    | Very Weak                     | Very Weak               | Strong                | **Strong (Action)**         |
  | **7. Discrimination Test** | **Strong**                    | **Strong**              | Very Weak (Denies)    | Moderate (Qualified)        |
  | **9. Moral Disagreement**  | Moderate                      | Weak                    | Strong                | Moderate                    |
  | **Group Deference**        | Weak                          | Very Weak               | Strong                | **Strong (Action)**         |
  | **No Smuggling**           | Risky                         | Very Risky              | Strong                | Moderate                    |
  | **Action-Justification**   | Very Weak                     | Very Weak               | Strong                | **Strong**                  |
  | **Belief-Justification**   | Very Weak (Pessimistic)       | Very Weak               | Strong                | Weak (Pessimistic)          |

  **Conclusion for Your Purpose:** The institutional context (Scaled Deference, Group Deference, Action-Justification) heavily pressures against pure Understanding-First Pessimism and Skepticism. Symmetry struggles with the intuitions driving Layered Deference, Constitutive Deference, and Discrimination. A sophisticated **Hybrid View** appears most promising *prima facie* for your needs, explicitly splitting the object of assessment (action justification vs. belief/understanding justification) to navigate the tensions, particularly the institutional imperative to act under conditions of complexity and limited comprehension. However, its success hinges on coherently addressing Constitutive Deference, Diachronic Deference (especially concerning past institutional *beliefs*), and providing a compelling rationale for the split that satisfies the Discrimination Test without collapsing into pessimism. The key challenge identified by the specification is reconciling the demand for a unique feature (Discrimination Test) with the practical demands of institutional action under uncertainty.
