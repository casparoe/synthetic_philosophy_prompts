prompt: |-
  Before I take another claim of the form "this legal change was ultimately a product of the economic structure" seriously, I want a specification rather than a verdict. Write the desiderata that any adequate theory of the relation between the economic base and the rest of social life — law, religion, science, family forms, political institutions, art — would have to meet, where adequate means adequate for exactly one job: serving as a standard for judging individual causal claims of that form in ordinary historical and political argument, not as a predictive science of long-run social change. So the theory is not required to forecast anything, and not required to rank modes of production by stage.

  The distinctions I most want the list to respect:

  Origination, selection, and shaping must be kept apart. A base may bring an element into existence, or merely filter variants that arose for unrelated reasons, or leave the element intact while fixing its content or use. A theory that tests only for origination will misclassify most real cases, and I want to know what evidence would separate the three.

  The grain of the base must be fixed in advance — how fine a description of the economic structure may be invoked (capitalist versus financialized, export-led capitalism with a large domestic rentier sector), and who bears the burden of proof when a mismatch is explained away by redescribing the base. Without this I cannot tell a confirmed theory from an unfalsifiable one.

  The hand-me-down and callback cases must be handled: elements that arrive by diffusion from another society, or are inherited from a predecessor economic structure, rather than generated by the present one; and old forms that a later structure revives and re-functions for its own purposes, such as feudal honor idioms in a modern officer corps or archaic legal categories pressed into service for novel property regimes. A theory must say what it predicts about such elements and how to tell inert residue from reactivated residue.

  The boundary problem must be answered: whether the relations of production themselves include the legal forms that constitute property, contract, and the wage relation. If they do, say what is left of the claim that the base explains the law; if they do not, say what makes the base an economic rather than a juridical entity.

  Wrong-way cases must be allowed or excluded explicitly — state fiscal capacity, rules on lending at interest and on marriage, religious doctrine plausibly shaping accumulation rather than the reverse.

  Content, uptake, and direction must be separable, with natural science as the test case: a practice's internal content, the resources and prestige it attracts, and the uses its results are put to may each relate to the base differently.

  And the theory must say, in the only sense I can test, what the familiar last-instance formula means and what would count as evidence against it.

  For each requirement, give the case or consideration behind it and mark it non-negotiable, negotiable, or a preference of one camp (predictive power, rational-choice microfoundations, refusal to treat any elite's self-description as data, and so on). Then tell me which two requirements you suspect cannot be jointly satisfied: my own suspicion is that fixing the grain of the base in advance and giving the theory enough latitude to absorb inherited and imported elements pull in opposite directions, and I want to know whether that is right rather than merely plausible. Finally, say which single requirement excludes the most candidates. A table for the requirements and their motivating cases is fine; keep any scorecard of the familiar positions — straight reductionism, functional explanation, relative autonomy with reciprocal causation, and the view that there is no economic essence to be explained — to a few lines each, since the criteria, not the scoring, is what I want. Lead with your bottom line, whether the list is jointly satisfiable and if not which requirement you would drop, in the first sentence, then give the reasoning. No preamble and no restatement of my question.
reasoning: |-
  Okay, the user is asking for a set of criteria to evaluate theories linking economic structures to other social elements like law or religion. They want these criteria to specifically judge individual causal claims in historical arguments, not for predictive purposes. 

  The user has outlined several key distinctions that must be addressed: origination vs selection vs shaping of social elements, defining the "grain" of economic analysis, handling inherited/imported cultural elements, clarifying the base/superstructure boundary, accounting for reverse causality (like religion influencing economics), separating content from application (especially in science), and interpreting the "last instance" doctrine.

  Hmm... the most challenging part seems to be balancing two conflicting needs: precisely defining the economic base ("grain" requirement) while allowing flexibility for inherited/imported elements. The user suspects these may be incompatible - they're right to flag this tension. A strictly defined base struggles with foreign influences, while a loose definition becomes unfalsifiable. 

  For the boundary problem, the user wants absolute clarity on whether legal forms are part of the economic base. This is crucial because if property law is part of the base, claiming "base explains law" becomes circular. The solution might be to treat legal forms as the membrane between base and superstructure rather than assigning them rigidly to one side.

  The "last instance" requirement is particularly tricky. The user wants operational clarity - what observable evidence could disprove it? But since it's a philosophical hedge ("ultimately"), it may inherently resist falsification. This might be the requirement that eliminates the most theories because it's fundamentally metaphysical.

  Looking at the big picture: no existing theory satisfies all criteria perfectly. Functional explanations fail on origination/selection distinctions, relative autonomy theories struggle with "last instance" verification, and non-essentialist views reject the core premise. The table format requested will help expose these fault lines clearly.

  The user's depth of understanding is impressive - they've pre-identified the major pain points in base-superstructure theories. Their focus on testability over prediction shows they want analytical tools, not grand theories. I'll need to match their precision while resolving the tensions they've identified.
answer: |-
  **Bottom line:** The list is jointly satisfiable only by rejecting predictive ambitions and accepting negotiable compromises on "grain" and "last instance," but requirement 5 (Boundary Problem) is non-negotiable and excludes most candidates; requirement 2 (Grain) and 3 (Hand-Me-Downs/Callbacks) *can* be reconciled with careful specification.

  **Desiderata for Evaluating Base/Superstructure Causal Claims:**

  | # | Requirement                                      | Case/Consideration                                                                                                | Status              |
  |---|--------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|---------------------|
  | 1 | **Distinguish Origination, Selection, Shaping** | A labor-saving tech (origination) vs. Puritanism selected among existing doctrines (selection) vs. Roman law reshaped for capitalism (shaping). | Non-negotiable      |
  | 2 | **Fix Grain of Base & Burden of Proof**          | Is "capitalism" sufficient, or must we specify "merchant," "industrial," "financialized"? Who must justify a mismatch?                         | Non-negotiable (Scope defined) |
  | 3 | **Handle Hand-Me-Downs & Callbacks**             | Adoption of Roman law in medieval Europe (diffusion); feudal heraldry in modern militaries (callback). Must distinguish inert vs. reactivated. | Non-negotiable      |
  | 4 | **Resolve Boundary Problem**                     | Are property rights *part of* the economic base (relations of production) or legal superstructure? Defines the explanandum.                  | **Non-negotiable** |
  | 5 | **Address Wrong-Way Cases**                      | Calvinist doctrine enabling capital accumulation; state capacity enabling markets. Must permit or exclude explicitly.                          | Negotiable (Scope) |
  | 6 | **Separate Content, Uptake, Direction (Science)**| Newtonian physics (content), state funding for rocketry (uptake), military use of physics (direction). May have different base-links.        | Preference (Analytical clarity) |
  | 7 | **Operationalize "Last Instance"**               | What observable evidence could show the base did *not* determine the superstructure "in the last instance"? Must define test conditions.      | Negotiable (Meaning) |

  **Key Tensions & Exclusions:**
  1.  **Suspected Irreconcilable Pair:** Requirement 2 (Fixed Grain) and Requirement 3 (Hand-Me-Downs/Callbacks) *appear* to conflict (strict definition vs. fluid inheritance). **Resolution:** They *can* be reconciled if "grain" specifies the *level* of economic description required for testing a *specific claim* (e.g., "financialized capitalism" needed to explain derivatives law, while "capitalism" suffices for factory legislation), and if inherited/diffused elements are analyzed for how the *current* base *selects/shapes/repurposes* them. The fixed grain applies to the base invoked *in the explanation*, not to excluding external origins.
  2.  **Major Excluder:** Requirement 4 (Boundary Problem) is the **primary excluder**. Most theories founder here:
      *   **If base INCLUDES legal property forms:** Then claiming "the base explains law" becomes partially tautological (the base explains itself). What's left is explaining *specific* legal doctrines beyond core property/contract. *Requires clearly separating core constitutive rules from other legal superstructure.*
      *   **If base EXCLUDES legal property forms:** Then the base (e.g., "forces of production," "class antagonisms") must be defined *independently* of the juridical forms that constitute it (property, contract, wage labor). This risks being abstract or metaphysical. The base must be defined as *material practices and power relations* underlying production/reproduction, with law providing the *form* but not the *substance* of those relations. *Requires a robust non-juridical definition of production relations.*
      *   Failure to clearly resolve this makes claims unfalsifiable or circular.

  **Requirement 7 ("Last Instance")** excludes many otherwise viable frameworks due to its inherent vagueness. Making it testable requires defining:
  *   A timeframe ("instance").
  *   A threshold of causal weight ("last").
  *   Conditions where non-economic factors could *temporarily* dominate *without* falsifying the claim (e.g., war, charismatic leadership).
  *   This often reduces to a methodological commitment rather than an empirically strict criterion.

  **Familiar Positions - Brief Scorecard:**
  *   **Straight Reductionism:** Fails 1 (no selection/shaping), 3 (ignores diffusion/inheritance), 4 (often conflates base/juridical forms or ignores boundary), 6 (collapses content/use), 7 (literalizes "last instance").
  *   **Functional Explanation:** Fails 1 (focuses on selection/effects, obscures origin), 2 (grain often vague), 3 (handles function not origin), 4 (circular if base includes functions), 7 (untestable teleology).
  *   **Relative Autonomy/Reciprocal Causation:** Struggles with 2 (grain often underspecified), 4 (boundary fuzziness common), 7 (makes "last instance" empirically vacuous or symbolic).
  *   **No Economic Essence:** Rejects 4, 7, and the core premise; fails to provide the requested standard.
