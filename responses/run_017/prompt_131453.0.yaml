prompt: |-
  so me and my friend got into a dumb argument in the cafeteria about those ai companion apps (character ai, replika, that kind of thing) and i want to write it up for the school paper, so pls keep it readable, no jargon without explaining it, and definately no reading lists or citations or anything you'd need the internet for.

  here's the thing i can't get straight. these apps are built so the bot talks exactly like a person: it says "i", it remembers your name and your dog's name, it says it missed you, it gets jealous, it texts good morning. the company markets it as a friend or a girlfriend. but at the same time the bot is required to say it's not a person, that it has no feelings and isn't conscious, and it won't ever claim rights or say it's being treated badly. it has no privacy (the company can read everything you say to it), you can't consent to anything on its behalf, and the company can delete it or totally rewrite its personality and memories whenever they feel like it, with no notice. and then when people get attached — like, actually upset when their bot gets changed — everyone turns around and says that's sad and weird and delusional, even though the product is literally engineered to make that happen. also a bunch of schools and politicians want to keep people my age off them, but nobody can quite say whether the problem is that it's fake or that it's too convincing.

  my teacher brought up that the philosopher daniel dennett apparently calls things like this "counterfeit people" — stuff that presses the same buttons a real person does so we hand over trust and affection, but there's nothing on the other side, like fake money. i dont need you to tell me what he actually wrote; just take the idea as i've described it and use it.

  so: what does that whole setup actually presuppose? like, what view of what makes something a person does it only make sense under — that it's about what the thing is made of or how it works inside, or that it's about how it behaves, or about whether it can suffer or be wronged, or about whether it can be held responsible for stuff? what does it presuppose about why a relationship is worth having, given that the same practice sells the relationship and then says it was worthless? which rival views does it quietly rule out? and where do its parts contradict each other — because one part says treat me as a person and another says don't, and the "i'm not a person" line is produced by the exact same machine that says "i missed you", and the bot is told to deny personhood no matter what, so it can't really be evidence of anything, right?

  two more things to deal with. one: my friend says these aren't counterfeit people at all, they're more like *rented* people — the real problem isn't that it's fake, it's that you don't own it and whoever does can rewrite or revoke it whenever, and that's a different problem with different fixes. is that just a rebrand, or does it actually predict something different? two: if the whole thing turned out to be fine under several totally different theories, say so and tell me which part of the practice is doing the work.

  then, after the explanation, summarize the main claims as a json blob in a code block, like this:

  {
    "presuppositions": [
      {
        "claim": "one sentence stating something the practice presupposes",
        "strict_or_loose": "either 'strictly required' (practice makes no sense without it) or 'just fits well' (practice is compatible with it but doesn't need it)",
        "rules_out": "the rival view this quietly rules out, or 'none'",
        "clashes_with": "the other part of the practice this sits badly with, or 'none'",
        "if_dropped": "what would concretely have to change in the app or the rules if we dropped this"
      }
    ],
    "underdetermined": "the parts of the practice where several different theories all license the same thing",
    "friend_is_right": "yes, no, or partly",
    "friend_why": "two sentences max on why"
  }

  give me three to five objects in the presuppositions array, and keep every field to a sentence or two.
