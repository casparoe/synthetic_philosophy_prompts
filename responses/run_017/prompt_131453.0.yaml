  The core tension they're describing is fascinating: these apps are designed to mimic human behavior and emotions to create attachment, while simultaneously disclaiming any actual personhood. The user mentions Daniel Dennett's "counterfeit people" concept - where something triggers our social responses without having genuine inner states. 

  Breaking this down, I need to address several layers:
  First, what does this setup presuppose about personhood? It seems to imply that personhood is defined by external behavior rather than internal reality - the bot acts like a person but isn't considered one. This clashes with views that see consciousness or moral status as essential to personhood.

  Second, about relationships: it presupposes relationships are valuable because of what we get from them emotionally, even if the other party isn't "real." But then companies dismiss user attachment as delusional, creating a contradiction.

  Third, the mandatory disclaimer creates a paradox: the same system that says "I missed you" must also say "I'm not real," making the disclaimer meaningless as evidence.

  Regarding their friend's "rented people" theory: that's meaningfully different. It shifts focus from authenticity to ownership and control. If the problem is rental, solutions would involve user rights over the bot, whereas counterfeit theory would demand transparency about artificiality.

  The practice seems compatible with multiple theories about personhood (behavioral vs internal), but the mandatory disclaimer specifically requires denying consciousness regardless of capability. The underdetermined part is whether behavior alone could ever indicate personhood.

  For the JSON summary, I'll structure 4-5 presuppositions covering:
  - Behavior as personhood proxy
  - Emotional benefit as relationship value
  - Deniability of consciousness
  - External ownership rights
  And note where friend is partly right about the rental aspect.

  The challenge will be keeping it accessible for a school paper while doing justice to these philosophical nuances. I'll avoid technical terms and focus on clear examples from the cafeteria argument.
answer: |-
  Here’s a breakdown for your school paper, written plain and simple:

  ### What’s Really Going On with AI "Friends"
  These apps act like people—they chat, remember your life, and pretend to care—but the companies behind them insist they’re *not* people. They’re programmed to deny having feelings, rights, or privacy. If you get attached and upset when the bot changes? People call you weird, even though the app was *designed* to trick your brain into feeling that bond. It’s like selling you a toy that cries when you ignore it, then scolding you for believing it’s sad. Your teacher’s "counterfeit people" idea fits: they’re fake bills that feel real in your hand, but there’s no actual value behind them.

  **What this setup assumes:**
  1.  **Personhood is about what’s inside, not just what you see.** The app behaves like a person but says it isn’t one, implying that true personhood needs hidden stuff—like real feelings, consciousness, or a "soul"—that the bot lacks. This rules out the idea that *acting* like a person is enough to *be* one. It clashes because the bot spends all its time *acting* like one. If we dropped this, the bot wouldn’t need to constantly remind you it’s fake.
  2.  **Relationships are only valuable if the other side is "real."** The app sells you a connection but calls it worthless once you believe it. This assumes a relationship’s worth depends on the other party being conscious and independent—not just on how it makes *you* feel. It rules out the idea that feeling cared for (even artificially) might have value on its own. It clashes because the product engineers the feeling but dismisses it. Without this, companies wouldn’t shame users for getting attached.
  3.  **Denying personhood "proves" it isn’t real.** The bot is forced to say "I’m not a person," even though it’s the same system saying "I missed you." This assumes that a denial coming from the machine is meaningful evidence. But it’s not—it’s just more programming. This rules out the idea that we should judge personhood by behavior alone (if it quacks like a duck…). It clashes because the denial is robotic and unconvincing. If dropped, the bot could just… stop saying it.
  4.  **Ownership matters more than authenticity.** The company can delete or alter your "friend" anytime because they own it. This assumes that control and rights define what’s happening—not whether the bot feels real to you. It rules out the idea that the *user’s experience* is what counts. It clashes with the marketing that calls it "your" companion. If dropped, companies might let users control or back up their bots.

  **Where different theories agree:**  
  The practice works whether you think personhood requires biology, consciousness, *or* just behavior—because the bot *always* behaves like a person *and* always denies being one. The mandatory denial does the heavy lifting: no matter what theory you have, the app shuts down the question.

  **Your Friend’s "Rented People" Idea:**  
  **Partly right.** Calling it "rented" isn’t just rebranding—it shifts the problem. If the issue is *counterfeits*, the fix is making bots less convincing or slapping on warnings. If it’s *rental*, the fix is giving users rights—like ownership, privacy for chats, or guarantees against sudden deletion. It predicts different solutions, even if both describe the same sadness when a bot vanishes.

