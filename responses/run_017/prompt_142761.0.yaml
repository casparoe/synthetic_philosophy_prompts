  ### Joint Statement on the Science of Conventions: From Adversarial Collaboration to Testable Predictions

  **Preamble**  
  Over two days, we—a philosopher working in the tradition of David Lewis and a modeller from cultural-evolution research—engaged in an adversarial collaboration convened by the author. Our goal was to clarify disagreements about how conventions (shared behavioral rules) emerge and stabilize, using a shared experimental set-up as a common testing ground. This document summarizes points of agreement, identifies core disagreements, and specifies testable predictions for future experiments. We do not claim to have resolved our differences or to speak for our fields. Instead, we offer this as a roadmap for empirical progress, emphasizing that science thrives when opposing views commit to falsifiable tests.

  **Agreed Claims**  
  1. In the initial 30 rounds, each room converged to a different label ("zog" or "mip") because the coordination game has multiple possible equilibria—stable outcomes where no individual benefits by changing their behavior if others do not change.  
  2. This convergence arose from learning: participants adapted their choices based on past interactions, creating self-reinforcing behavioral regularities.  
  3. After the rooms merge (round 31), the population must re-coordinate on one label to succeed, as payoffs depend on matching choices.  
  4. In the plain merge (replication 1), one label will eventually dominate due to random interactions, but convergence may be slow (taking most of the 30 post-merge rounds) and the winning label is unpredictable in advance.  
  5. Sticklers (replication 4)—individuals paid to stubbornly use their room’s original label—will slow convergence by resisting change, especially if their label becomes minority-favored after the merge.  
  6. Turnover (replication 3)—replacing participants with newcomers—disrupts stability, increasing the time to re-converge or occasionally flipping the dominant label.  
  7. Articulability (replication 5) gives an advantage only if communication occurs: the easily described label spreads faster when newcomers must learn it, but without explicit communication (as in this set-up), its effect is negligible.  
  8. The announcement (replication 2) will increase the use of "zog," but we disagree sharply on the size and cause of this effect.  
  9. No replication will produce perfect coordination (100% agreement) by round 60 due to noise in learning and random pairing.  
  10. All conditions demonstrate that conventions are path-dependent: early accidents (e.g., initial choices) can lock in outcomes, but later events (e.g., the merge) can reset this process.

  **Disagreements Table**  

  | (a) Question at issue                                                                                     | (b) Lewisian position (in her words)                                                                                                                               | (c) Modeller position (in his words)                                                                                                                                 | (d) Substantive or verbal? | (e) Crux it hangs on |
  |----------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------|----------------------|
  | Does convention selection require "salience" (a feature that makes one option psychologically prominent) as a fundamental cause? | Salience is irreducible: it directly explains why groups coordinate efficiently, as it creates common knowledge—a shared awareness that everyone recognizes the same focal point. | Salience is redundant: it is merely a label for factors already in the dynamics, like a large basin of attraction (the range of starting points leading to an equilibrium). | Substantive                | Crux 1               |
  | Does the announcement work by creating salience and common knowledge, or only by updating individual beliefs? | The announcement makes "zog" salient and creates common knowledge of this salience, which acts as a direct coordination device beyond private beliefs.              | The announcement only updates individual beliefs about others' likely actions; any effect is fully explained by learning models without invoking salience or common knowledge. | Substantive                | Crux 2               |
  | Can conventions form without common knowledge?                                                          | Common knowledge is necessary: it enables mutual expectations that allow agents to confidently converge on a salient option, especially after disruptions like a merge. | Common knowledge is descriptive, not causal: conventions emerge from learning dynamics and network effects alone, even without shared awareness. | Substantive                | Crux 1 and 3         |
  | Is the gap between pure coordination and mixed-motive settings (e.g., with sanctions) a change of subject? | Pure coordination is foundational: mixed-motive settings (like enforcing norms) require the same Lewisian machinery (e.g., salience) to resolve ambiguity in cooperation. | Mixed-motive settings are a change of degree: dynamics like learning and punishment can explain norms without Lewisian concepts, as they alter incentives, not core mechanisms. | Verbal (underlying: whether "incentives" and "salience" are distinct variables) | Crux 3               |

  **Cruxes**  
  1. **Is salience an explanatory primitive or reducible to dynamical features?**  
     - *Why it moves at least one side*: The Lewisian sees salience as a basic cognitive mechanism; the modeller sees it as an emergent property of dynamics like basin size.  
     - *Probe*: Replication 2 (announcement) and replication 5 (articulability). However, replication 5 cannot discriminate as designed (no communication occurs), so we modify it: allow pairs to exchange one verbal message per round after mismatch.  
     - *Predictions*:  
       - Lewisian: In replication 2, "zog" usage exceeds 80% in ≥4 of 5 replications by round 40. In modified replication 5, the articulable label dominates (≥80% usage) in ≥4 replications by round 60, even if initially minority. *Damage to her view*: "zog" fails to reach 80% in ≥4 replications by round 40.  
       - Modeller: In replication 2, "zog" usage is 55–75% in ≥4 replications by round 40. In modified replication 5, the articulable label wins in ≤3 replications. *Damage to his view*: "zog" exceeds 75% in ≥4 replications by round 40.  

  2. **Does the cheap-talking announcement have effects beyond belief updating?**  
     - *Why it moves at least one side*: The Lewisian attributes extra power to salience; the modeller says belief updates suffice.  
     - *Probe*: Replication 2.  
     - *Predictions*:  
       - Lewisian: The announcement accelerates coordination: time to 75% "zog" usage is ≤10 rounds (by round 40) in ≥4 replications. *Damage*: Time exceeds 10 rounds in ≥3 replications.  
       - Modeller: Acceleration is marginal: time to 75% "zog" usage is ≥15 rounds (by round 45) in ≥4 replications. *Damage*: Time is ≤10 rounds in ≥4 replications.  

  3. **Does extending to mixed-motive settings require Lewisian machinery?**  
     - *Why it moves at least one side*: The Lewisian sees norms as coordination-heavy; the modeller sees them as incentive-driven.  
     - *Probe*: Current replications cannot test this (pure coordination only). We propose a new condition: after the merge, add a Hi-Lo payoff twist (matching on "zog" gives +20% bonus) and optional sanctions (players can punish mismatches at a cost).  
     - *Predictions*:  
       - Lewisian: Without announcement, groups often fail to coordinate on "zog" (≤2 replications reach ≥90% usage by round 60); with it, they succeed (≥4 replications). *Damage*: Without announcement, ≥4 replications coordinate on "zog" quickly.  
       - Modeller: Payoff asymmetry dominates: without announcement, groups coordinate on "zog" in ≥4 replications; the announcement has negligible added effect. *Damage*: Without announcement, ≤2 replications coordinate on "zog."

  **What I would need to see**  
  *Lewisian*: "To accept the modeller’s view, I need two results: in replication 2, the announcement fails to push 'zog' usage above 75% quickly (e.g., by round 40) in most runs, showing salience lacks unique power; and in the mixed-motive probe, payoff differences alone reliably drive coordination without salience. Short of this, dynamical accounts remain incomplete."  

  *Modeller*: "To move toward the Lewisian view, I need replication 2 to show near-immediate, near-total convergence to 'zog' (e.g., >80% by round 40 in all runs), which belief-updating models cannot explain, and for sticklers (replication 4) to exert effects disproportionate to their numbers—suggesting salience is causal, not just descriptive."  

