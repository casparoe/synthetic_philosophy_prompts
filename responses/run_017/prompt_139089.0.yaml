prompt: |-
  hey — I'm TAing an undergrad seminar on consciousness this term and I keep having the same 1am argument with a friend who does visual psychophysics in the lab next door. She says the only thing worth theorizing about is what gets into the global workspace and that the rest is metaphor; I keep saying that if you define conscious as broadcast-to-consumer-systems you've relocated the mystery rather than solved it. Before I make the students read another paper, I want the specification first.

  So: write me the desiderata list for a theory of conscious access — what any account of what it is for a state to be globally available or accessed (as opposed to merely phenomenal, or merely processed) has to deliver, with the case or consideration behind each item, and mark which ones you think are non-negotiable and which are just the prejudices of one camp. I care much more about the criteria than about scoring theories, but a very short scorecard at the end for the Block-style overflow picture, the Baars/Dehaene global workspace story, and a higher-order-ish view is fine if you keep it to a few lines each.

  Here's what I want the list to deal with, in no order. (1) Who are the consumers? Split access into at least three grades — available for online action, available for verbal report, available for arbitrary reasoning and delayed use — and say which is constitutive, because they come apart. Take as stipulated a made-up patient, call her the echo patient: she'll trace the contour of a briefly flashed shape with her finger and flinch correctly at a looming version of it, she says she saw nothing, she drops to chance if the response has to be delayed more than a couple of seconds, and she never improves with training. Is that access? Say what the theory is committed to there. (2) I keep wanting to split access into two components — the state being put into a format the downstream systems can read, versus its actually being routed to them — and I can't tell whether global workspace theory is a theory of the first, the second, or both. Build that into the list and tell me if it's a real distinction or a confusion. (3) Whenever I read the empirical stuff I can't tell whether the all-or-none ignition signature and the early-vs-late neural marker stuff are predictions of the theory or have quietly become its definition of access, wich would make it unfalsifiable; what should I demand so the theory stays testable? (4) The measurement trap: any report-based measure presupposes access, and no-report paradigms have to justify themselves somehow, so what if anything could be a non-circular gold standard for this state was accessed? (5) Cases it can't dodge: Sperling-style partial report where phenomenology looks richer than what gets reported; binocular rivalry and the attentional blink; change blindness and inattentional blindness; dreaming; and whether one attribute of a single stimulus (motion, say) can be accessed while another (colour) is not. (6) Distinctions it must not collapse: access vs attention, vs working-memory maintenance, vs metacognitive confidence, vs accuracy. (7) Anatomy: it has to take a stand on whether the workspace is essentially prefrontal or whether prefrontal activity is mostly the report machinery bolted on the side, and on whether it can stay a workspace theory if the answer is the latter. (8) What is the scarce resource anyway — if there's a bottleneck, say what is being economized (bandwidth? time? number of recipients? metabolic cost?) and why anything would evolve a system that throws information away. (9) And the bit I actually want most: is the access/phenomenal distinction even coherent, or does any functional account of access either collapse into behaviourism or sneak phenomenology back in? Put that on the list as a requirement, tell me whether it's jointly satisfiable with the others, and tell me which single desideratum does the most work knocking out candidate theories. Oh — and whatever I hand the students should also say something about whether a system with a bottleneck plus a broadcast architecture (a transformer with a tiny scratchpad, say) counts as access-conscious on the theory's own terms, and whether that result is a feature of the theory or a reductio of it.
reasoning: |-
  We are constructing a list of desiderata for a theory of conscious access. The goal is to specify what any account of global availability/access must deliver. We'll address each point raised, organizing them into clear desiderata with cases/considerations, and mark which are non-negotiable and which might be camp-specific. We'll also include a very short scorecard for three theories at the end.

  Desiderata List:

  1. **Graded Access and Consumers**:
     - **Desideratum**: The theory must distinguish at least three grades of access: (a) available for online action (e.g., motor responses), (b) available for verbal report, and (c) available for arbitrary reasoning and delayed use (e.g., working memory). It must specify which of these is constitutive of access consciousness and how they relate when they come apart.
     - **Case**: The "echo patient" (as described) can use visual information for immediate motor responses (tracing, flinching) but cannot report, retain, or use it after a short delay. The theory must commit to whether this patient has access consciousness for the stimulus.
     - **Non-negotiable?**: Yes. Any theory must account for dissociations between these grades.

  2. **Format vs. Routing**:
     - **Desideratum**: The theory must clarify whether it defines access in terms of (i) the state being in a format readable by downstream systems (e.g., amodal, abstract, or broadcastable format), (ii) the actual routing of the state to consumer systems, or both. It must also address whether this distinction is real and how it maps to mechanisms.
     - **Consideration**: If format is the key, then access might occur without routing (if the format is inherently broadcastable). If routing is key, then format might be necessary but not sufficient. The echo patient might have formatted representations but fail at routing for report and delayed use.
     - **Non-negotiable?**: Yes. Without this, the theory is underspecified.

  3. **Testability and Neural Signatures**:
     - **Desideratum**: The theory must provide independent criteria for access that are not solely defined by neural signatures (like ignition or late neural markers) to avoid being unfalsifiable. It must specify what would count as evidence for or against the theory, including behavioral and neural predictions.
     - **Case**: If ignition (sudden, widespread activation) is taken as the definition, then the theory becomes circular and untestable. Instead, the theory should predict when ignition occurs and what happens when it doesn't.
     - **Non-negotiable?**: Yes (for scientific theories).

  4. **Non-Circular Measurement**:
     - **Desideratum**: The theory must provide a non-circular operationalization of access that does not rely solely on report (to avoid presupposing access) and must justify no-report paradigms. It should specify what could serve as a gold standard for access (e.g., integration into arbitrary systems, long-term effects, or neural criteria that are independently motivated).
     - **Consideration**: The echo patient shows that report is insufficient. The gold standard might be availability for arbitrary cognition, but how to measure that without report? The theory must address this.
     - **Non-negotiable?**: Yes.

  5. **Critical Empirical Cases**:
     - **Desideratum**: The theory must account for key empirical phenomena:
       - Sperling partial report: phenomenology appears richer than what can be reported.
       - Binocular rivalry and attentional blink: fluctuations in access without changes in stimulus.
       - Change blindness and inattentional blindness: failures of access despite salient stimuli.
       - Dreaming: Are dream states accessed? If so, to what consumers?
       - Attribute-specific access: e.g., motion accessed without color.
     - **Non-negotiable?**: Yes. These are core challenges.

  6. **Distinctions from Neighboring Concepts**:
     - **Desideratum**: The theory must not collapse access into:
       - Attention (which can be unconscious)
       - Working memory maintenance (which might be a consequence of access)
       - Metacognitive confidence (a judgment about access)
       - Accuracy (a property of the representation, not access per se)
     - **Non-negotiable?**: Yes. Failure here leads to conceptual confusion.

  7. **Anatomical Commitments**:
     - **Desideratum**: The theory must take a stand on the neural substrate of the global workspace. Is it essentially prefrontal? Or is prefrontal cortex just for reporting? If the workspace is not prefrontal, then what is it? The theory must remain coherent if the workspace turns out to be distributed or non-prefrontal.
     - **Non-negotiable?**: Maybe. Some theories (like GWT) tie the workspace to prefrontal cortex, but this might be a camp-specific prejudice. The core functional architecture (broadcast) should be separable from anatomy.

  8. **The Bottleneck and Scarce Resource**:
     - **Desideratum**: The theory must specify the nature of the bottleneck: what scarce resource is being economized (e.g., bandwidth, time, number of active representations, metabolic cost) and why evolution would favor discarding information. It must explain the functional advantage of such a bottleneck.
     - **Non-negotiable?**: Yes. Without this, the existence of a bottleneck is unexplained.

  9. **Coherence of the Access/Phenomenal Distinction**:
     - **Desideratum**: The theory must demonstrate that the access/phenomenal distinction is coherent and that it does not collapse into behaviorism or reintroduce phenomenology by stealth. It must show that access can be defined functionally without reference to subjective experience.
     - **Consideration**: If access is defined solely by its functional role (e.g., reportability), it risks behaviorism. But if it implicitly relies on phenomenal properties, it's circular. The theory must navigate this.
     - **Non-negotiable?**: Absolutely. This is central to the debate.

  10. **Artificial Systems**:
      - **Desideratum**: The theory must specify whether a system with a bottleneck and broadcast architecture (e.g., a transformer model with a small working memory) counts as access-conscious. This should be a feature, not a reductio, if the theory is functionalist.
      - **Non-negotiable?**: Yes, for evaluating the scope of the theory.

  Which desideratum does the most work? 
  - **Desideratum 9 (Coherence of Access/Phenomenal Distinction)** is the most fundamental because it challenges the very coherence of the concept. If a theory fails here, it either reduces to behaviorism or becomes dualistic.

  Short Scorecard for Theories:

  1. **Block-style Overflow**:
     - Access is for reporting and reasoning; phenomenal consciousness overflows access (as in Sperling). 
     - **Echo patient**: Has phenomenal but not access consciousness.
     - **Score**: Fails desideratum 9 (if access is defined functionally, why can't the echo patient's motor responses count as access?); also, how to measure overflow non-circularly (desideratum 4)? Might handle Sperling well (desideratum 5).

  2. **Baars/Dehaene Global Workspace Theory (GWT)**:
     - Access is global broadcast to many consumer systems (including working memory, report, etc.). Ignition is the neural correlate.
     - **Echo patient**: If she can use the info for action but not report, then according to GWT, it's not accessed because it hasn't been globally broadcast (only routed to motor systems). 
     - **Score**: Might struggle with Sperling (desideratum 5) if phenomenology overflows, and with non-circular measurement (desideratum 4). Explicit about consumers (desideratum 1) and bottleneck (desideratum 8: bandwidth). Testability (desideratum 3) is a strength if ignition is a prediction, not the definition. Artificial systems (desideratum 10) are a feature: a transformer with global broadcast could be access-conscious.

  3. **Higher-Order Thought (HOT) or Higher-Order Perception (HOP)**:
     - Access is having a higher-order state about the first-order state. It's the higher-order state that makes it conscious.
     - **Echo patient**: If she has no higher-order state about the visual state, then it's not conscious, even if she can use it for action.
     - **Score**: Might conflate access with metacognition (desideratum 6). Does well on coherence (desideratum 9) if higher-order states are functional. Struggles with Sperling (why rich phenomenology without higher-order states?) and dreaming (are dreams higher-order?). Artificial systems: if a system has higher-order representations, it could count.

  Final Note: The list above is designed to be handed to students. It explicitly addresses each of your points and structures them as requirements for a theory of conscious access.
answer: |-
  Below is a structured desiderata list for a theory of conscious access ("global availability"), designed to clarify what any account *must* deliver to be empirically and conceptually adequate. Each item includes the case/consideration motivating it, and I note whether it's non-negotiable (essential for any theory) or potentially camp-specific (reflecting biases of particular frameworks). I conclude with a brief scorecard for the three theories you mentioned. The list prioritizes your emphasis on criteria over scoring, but the scorecard illustrates how the desiderata apply.

  ---

  ### **Desiderata for a Theory of Conscious Access**  
  *What any account of "access" (global availability) must explain or address.*

  1. **Graded Access and Consumer Specification**  
     - **Requirement**: The theory must distinguish at least three grades of access:  
       (a) *Online action* (e.g., rapid motor responses),  
       (b) *Verbal report* (e.g., immediate description),  
       (c) *Arbitrary reasoning/delayed use* (e.g., integration into planning, memory).  
       It must specify which grade is *constitutive* of access consciousness, as these dissociate.  
     - **Case**: The "echo patient": Can trace a shape or flinch at a looming object (online action) but cannot report verbally, retain information beyond seconds, or use it flexibly.  
     - **Commitment**: The theory must state whether this patient has access consciousness. If only (c) is constitutive, she lacks access; if (a) counts, she has partial access.  
     - **Non-negotiable?**: **Yes**. Dissociations are empirical facts; theories must account for them.  

  2. **Format vs. Routing Distinction**  
     - **Requirement**: The theory must clarify whether access requires:  
       (i) *Formatting* (rendering information in a "readable" code for consumers),  
       (ii) *Routing* (active transmission to consumers), or both.  
       It must justify if this distinction is meaningful or epiphenomenal.  
     - **Case**: Subliminal priming (formatted but not routed) vs. the echo patient (routed for action but not report).  
     - **Clarification**: Global workspace theories (GWT) typically blend both: formatting enables routing. But if routing fails despite formatting (e.g., in neglect), access is incomplete.  
     - **Non-negotiable?**: **Yes**. Without this, mechanisms are underspecified.  

  3. **Testability and Neural Signatures**  
     - **Requirement**: The theory must define access independently of neural correlates (e.g., "ignition" or late ERP components) to avoid circularity. It must generate falsifiable predictions (e.g., when access should occur without ignition, or vice versa).  
     - **Case**: If "ignition" (sudden, global PFC activity) is the *definition* of access, the theory is unfalsifiable. Instead, it should predict ignition based on functional criteria (e.g., information integration).  
     - **Non-negotiable?**: **Yes**. Core to scientific integrity.  

  4. **Non-Circular Measurement**  
     - **Requirement**: The theory must provide a non-report-based operationalization of access to avoid presupposing it. It must justify no-report paradigms (e.g., via convergent evidence from behavior, neural data, or computational models).  
     - **Case**: Report paradigms assume access for verbal consumers; no-report paradigms (e.g., decoding neural correlates during passive viewing) risk conflating access with pre-conscious processing.  
     - **Gold Standard?**: Availability for *arbitrary novel tasks* (e.g., if a stimulus can be used for unexpected decisions after delay) might qualify, but requires independent validation (e.g., neural decoding).  
     - **Non-negotiable?**: **Yes**. Avoids tautological definitions.  

  5. **Handling Critical Empirical Cases**  
     - **Requirement**: The theory must explain:  
       - **Sperling partial report**: Rich phenomenology exceeding reportable access.  
       - **Binocular rivalry/attentional blink**: Access fluctuations without stimulus changes.  
       - **Change/inattentional blindness**: Access failures despite salient stimuli.  
       - **Dreaming**: Is dream content accessed? If so, by which consumers?  
       - **Attribute-specific access**: E.g., motion accessed without color in blindsight-like cases.  
     - **Non-negotiable?**: **Yes**. These are benchmark phenomena.  

  6. **Conceptual Distinctions**  
     - **Requirement**: The theory must not collapse access into:  
       - *Attention* (which can enhance unconscious processing),  
       - *Working memory* (a potential *consequence* of access),  
       - *Metacognitive confidence* (a judgment about access),  
       - *Accuracy* (access can occur for false content).  
     - **Non-negotiable?**: **Yes**. Conflation undermines explanatory power.  

  7. **Anatomical Commitments**  
     - **Requirement**: The theory must take a stand on whether the "workspace" is:  
       - Essentially prefrontal (PFC-driven integration), or  
       - A distributed network with PFC as a report/output module.  
       It must remain viable if the workspace is non-PFC (e.g., posterior cortical).  
     - **Case**: PFC lesions impair report but spare online action (e.g., echo-like behavior).  
     - **Implication**: If PFC is merely "report machinery," GWT must redefine the workspace core.  
     - **Non-negotiable?**: **Partially**. Camp-specific (e.g., GWT favors PFC; others don’t).  

  8. **The Bottleneck and Scarce Resource**  
     - **Requirement**: The theory must specify what is economized in access (e.g., bandwidth, time, representational slots, metabolic cost) and why evolution would favor discarding information.  
     - **Case**: Limits in change blindness or attentional blink imply a bottleneck.  
     - **Why discard information?**: Efficiency (e.g., avoiding combinatorial explosion) or stability (e.g., maintaining coherent goals).  
     - **Non-negotiable?**: **Yes**. Explains the adaptive logic of access.  

  9. **Coherence of the Access/Phenomenal Distinction**  
     - **Requirement**: The theory must demonstrate that "access" is definable without:  
       - Collapsing into behaviorism (e.g., access ≠ reportability), or  
       - Covertly relying on phenomenal properties (e.g., "availability" implying subjective experience).  
       It must show the distinction is empirically meaningful and conceptually coherent.  
     - **Do-or-die?**: This desideratum does the **most work** in eliminating theories. If a theory fails here, it either reduces to behaviorism (e.g., access = reportability) or smuggles in phenomenology (e.g., access as "what it feels like to use information").  
     - **Joint satisfiability?**: **Yes**, but only if access is tied to *information dynamics* (e.g., integration, broadcasting) independent of subjective feels.  
     - **Non-negotiable?**: **Absolutely**. The core of your 1am debate.  

  10. **Artificial Systems and Architecture**  
      - **Requirement**: The theory must adjudicate whether a system (e.g., a transformer model with a limited "scratchpad") counts as access-conscious if it has:  
        - A bottleneck (e.g., fixed working memory),  
        - Broadcast to consumers (e.g., modular subsystems reading the scratchpad).  
      - **Judgment**: If functional criteria are met, this *must* be access-conscious. If not, the theory risks dualism.  
      - **Feature or reductio?**: Should be a **feature** for functionalist theories (e.g., GWT); a **reductio** for those requiring biological specifics.  
      - **Non-negotiable?**: **Yes**. Tests functionalist commitments.  

  ---

  ### **Short Theory Scorecard**  
  *Assessed against the desiderata above (✓ = strong; △ = partial; ✗ = weak; ! = critical failure).*

  | Desideratum                          | Block-Style Overflow             | Baars/Dehaene GWT               | Higher-Order (HO)               |
  |--------------------------------------|----------------------------------|---------------------------------|---------------------------------|
  | 1. Graded Access (echo patient)      | △ (Access ≠ phenomenology; echo has phenomenality only) | ✓ (Access = global broadcast; echo lacks it) | △ (Access = HO state; echo may lack it) |
  | 2. Format vs. Routing                | △ (Focuses on availability; underspecified) | ✓ (Both: formatting enables routing) | ✗ (Conflates with metacognition) |
  | 3. Testability                       | ✗ (Phenomenal overflow is hard to falsify) | ✓ (Predicts ignition for access) | △ (HO states are testable)      |
  | 4. Non-Circular Measurement          | ! (Relies on phenomenology, making access circular) | △ (Uses no-report neural markers) | ✗ (HO access often defined by report) |
  | 5. Empirical Cases                   | ✓ (Explains Sperling overflow)   | ✓ (Handles rivalry/blink well)  | △ (Struggles with Sperling)     |
  | 6. Conceptual Distinctions           | ✓ (Access ≠ phenomenology)       | △ (Access ≈ broadcast; may blur with WM) | ✗ (Collapses access with metacognition) |
  | 7. Anatomy                           | ✓ (Workspace agnostic)           | △ (PFC-centric; vulnerable if PFC ≠ core) | △ (HO states in PFC)            |
  | 8. Bottleneck Logic                  | ✗ (No clear bottleneck account)  | ✓ (Bandwidth limits; efficiency) | △ (Scarcity in HO resources)    |
  | 9. Access/Phenomenal Coherence       | ! (Phenomenology does work; access becomes residual) | ✓ (Functional; no phenomenality) | △ (HO may sneak in phenomenality) |
  | 10. Artificial Systems (transformer) | ✗ (Only biological systems?)     | ✓ (Feature: any broadcast architecture) | △ (If HO states exist, yes)     |

  **Summary**:  
  - **Block Overflow**: Strong on phenomenology/access dissociation (Des. 1,5,6) but fails testability and circularity (Des. 3,4,9), and rejects artificial access (Des. 10).  
  - **Global Workspace (GWT)**: Strongest on architecture (Des. 2,5,8,10) but risks circularity if ignition defines access (Des. 3,4) and may overemphasize PFC (Des. 7).  
  - **Higher-Order**: Struggles with conceptual distinctions (Des. 2,6) and measurement (Des. 4), but can handle graded access (Des. 1).  

  **Key Takeaway for Students**: Desideratum 9 (coherence of the access/phenomenal distinction) is the litmus test. It exposes whether a theory genuinely explains access or merely relabels the mystery. GWT best satisfies it functionally, but Block highlights its limitations for phenomenology. Use this list to dissect papers: Does the theory address all ten? Where does it cut corners?
