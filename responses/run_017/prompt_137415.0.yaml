  ## The Shell Game

  The air in *The Salty Dog* hung thick with pipe smoke and the tang of brine. Mara nursed a dark rum, staring at the scarred tabletop. Finn slid onto the bench opposite, his weathered face unreadable.

  "So. Red shell for the deep-sea run," Finn began, his voice deceptively casual. "Smart play. Solid one-in-three shot, everyone knows the count on red."

  Mara grunted, not looking up. "Solid’s better than guessing."

  "Then today," Finn leaned forward, his knuckles tapping the wood for emphasis, "Old Man Hewitt offers you red-*or*-yellow... or black-*or*-yellow. Deep-sea run either way. You take black-or-yellow." He paused, letting the incongruity hang. "Explain that tide to me, Mara. Yesterday, you acted like black shells were rarer than mermaid teeth, scared to bet on 'em. Today, you're grabbing black-*or*-yellow like it's a sure thing? They can't *both* be scarce. Black and yellow together? That's sixty shells. Always. Everyone knows *that* count."

  Mara finally met his gaze. Her eyes were the colour of storm clouds over the harbour. "It's not about guessing *how many* black or yellow, Finn. It's about what I *don't* know biting me. Yesterday, betting on black alone? Could be fifty-nine black in there. Could be one. Harbourmaster’s jar, harbourmaster’s secret. If he’s stacked it against folk who bet on black? I drown betting on a phantom. Red? Thirty shells. Always. No surprises."

  "And today?" Finn pressed. "Red-or-yellow? That’s thirty reds plus however many yellows. Could be fifty-nine yellows! Almost two-thirds chance!"

  "Could be," Mara conceded, swirling her rum. "But it *could* be one yellow. Then red-or-yellow is barely better than red alone. Still gambling on Hewitt’s little secret." She leaned in, her voice low and intense. "Black-*or*-yellow? That's the *whole* unknown pile. Sixty shells. Doesn't matter if it's fifty-nine black and one yellow, or fifty-nine yellow and one black. Sixty shells. Two-thirds chance. Solid. *Fixed*. No matter how Hewitt stacked it yesterday, *that* pile, right now, is sixty shells. I know what I'm getting. I’m not betting on his whim; I'm betting on the whole damn unknown chunk. That's not swapping beliefs, Finn. That's battening the hatches against *his* games."

  Finn shook his head slowly, a frustrated smile playing on his lips. "Battening hatches... Mara, that’s not a belief about the *sea*, it’s a fear of shadows. You’re not sailing by the stars; you’re jibing every time a cloud passes. What happens tomorrow? Say word leaks Hewitt favours yellow lately. Suddenly black looks scarce? You gonna swap back to betting on red alone? Pay your fee to change bets every time a rumour floats by? That ain’t navigation, it’s getting tossed in your own wake. Costs coin, costs nerve."

  Before Mara could retort, a young apprentice, breathless, skidded to their table. "Mara! Hewitt’s offerin’! Deep-sea run... for just a yellow shell draw! Right now! Special one-off!"

  Mara didn't hesitate. "No."

  "See?" Finn said softly as the apprentice scurried away, disappointed. "Yellow alone? Pure gamble on Hewitt's secret. You won't touch it. Even if the odds *might* be good... you don't *know*." He watched her, his earlier frustration replaced by a weary understanding. "You’re sailing against the harbourmaster, not the tide. Just hope he ain't changing the currents *because* you zig when he expects a zag."

  Mara stared into her rum, her knuckles white on the glass. Outside, a gull cried, and the harbour bell tolled the hour. Finn pushed back from the table, the scrape of wood loud in the sudden quiet. He paused, looking not at Mara, but towards the grimy window overlooking the harbourmaster's office. "Funny thing," he murmured, almost to himself. "Saw Hewitt watching the draw yesterday. When you picked red... he had this little smile. Like he'd won a private bet." He didn't look back at Mara as he walked away, leaving the unspoken accusation – and the chilling possibility – hanging heavier than the smoke in the air. Mara didn't watch him go. She stared at the dregs of her rum, the reflection of the tavern lanterns fracturing in the dark liquid, like uncertain stars on a treacherous sea.

  ---

  **Word Count:** 598

  **Under the Hood:**
  *   **Mara's Defense:** She explicitly rejects guessing the split ("It's not about guessing *how many*"). She frames it as guarding against the harbourmaster (Hewitt) manipulating the split *against* her specific choice ("If he’s stacked it against folk who bet on black?"). She argues black-or-yellow is safe because it encompasses the *entire* unknown pile (60 shells), making it immune to manipulation *within* that pile. ("No matter how Hewitt stacked it yesterday, *that* pile... is sixty shells.").
  *   **Finn's Punch:** He lands it by arguing her strategy isn't based on a stable belief about the world ("that’s not a belief about the *sea*, it’s a fear of shadows"). He predicts instability ("jibing every time a cloud passes") and cost ("Pay your fee to change bets every time a rumour floats by?"). He implies this reactivity makes her vulnerable.
  *   **The Concrete Tip-Off:** The apprentice's offer for a run on a *yellow shell alone* is the key. Mara instantly refuses it. This reinforces her pattern: she *only* avoids bets where the probability depends solely on the unknown split (black alone, yellow alone). She accepts bets with known probabilities (red alone) or bets encompassing the entire unknown (black-or-yellow). **Does this tip irrationality?** It depends on the harbourmaster:
      *   **If Hewitt is neutral:** Her refusal is pure ambiguity aversion – she rejects a potentially good bet (yellow could be 59!) because of the uncertainty. Finn's point about instability stands, suggesting irrationality.
      *   **If Hewitt *is* manipulative (Finn's final line):** Her refusal is shrewd. Betting on yellow alone *would* be walking into a potential trap Hewitt set for that specific bet. Her strategy is rational game theory against an adversary. Finn's parting shot about Hewitt's smile hints strongly at this possibility, making her defence potentially *stronger*. The book's view depends on whether Hewitt's smile was smug satisfaction at her predictable choice (manipulator) or just benign observation.
