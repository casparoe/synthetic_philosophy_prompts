prompt: |-
  I've been reading the rationalist blogs since the Overcoming Bias days, which is where I picked up both the habit of treating expected-utility maximization as the normative gold standard and the habit of distrusting self-report. I now sit on the allocation committee of a small health-and-development fund (roughly $400k a year), and for two years we have ranked grants using subjective-wellbeing accounting: self-reported life-satisfaction points multiplied by the number of people affected, of the kind some happiness-focused funders have been pushing. I've never been comfortable with it. The scale has no fixed unit, and comparing one villager's reported satisfaction with another's looks like exactly the interpersonal comparison of utility that the ordinalist tradition warned us is unscientific.

  It occurred to me recently that we might not need introspection at all. If the point of revealed-preference theory is that utility can be reconstructed from choice, and if the von Neumann–Morgenstern theorem gives a cardinal utility function from choices over lotteries — unique up to positive affine transformation — then I can elicit a beneficiary's utility function behaviorally (hypothetical lotteries, certainty equivalents, fit the curve) and then remove the residual freedom by rescaling each person's function to the unit interval, anchoring zero at the worst outcome in that person's relevant menu and one at the best. Call the result a behavioral well-being unit. The output is cardinal, person-specific, behaviorally grounded, and expressed in a common unit, so I can sum across people and compare programs; and nothing in the procedure depends on anyone's introspection or on my guessing what goes on inside anyone's head. I've been using small-stakes lotteries so that the curvature I measure is local, on the theory that this keeps me from merely recording risk aversion.

  Two observations make me doubt the scheme. First, the numbers come out strange: under this normalization, someone whose range runs from "nothing changes" to "receives a bed net" has exactly the same zero-to-one span as someone whose range runs from "child survives" to "child dies," so the two can contribute identically to the total. Second, when I ran the procedure on myself over small monetary gambles, the fitted curve came out nearly linear, which would imply I should be close to indifferent between a sure $50,000 raise and a coin flip between nothing and $100,000 — and I am emphatically not.

  So where is the mistake, and is it repairable? Is the problem the normalization (and if so, what is the right one?), or is the elicitation itself measuring something other than welfare? I keep being told that Harsanyi already solved the interpersonal-comparison problem, but his aggregation theorem looks to me like it assumes the very comparability I'm trying to measure. Is there a principled version of what I'm attempting, or does the underdetermination go all the way down?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They've been involved with rationalist thinking since Overcoming Bias days, so they're deeply familiar with expected utility theory and skeptical of self-reported data. Now they're on an allocation committee for a health fund, using subjective well-being metrics but feeling uneasy about it. They propose a behavioral method using hypothetical lotteries to get cardinal utility functions, normalized 0-1 per person. But they're getting weird results: same scale for trivial vs life-changing outcomes, and a personal test showed linear utility when they're actually risk-averse.

  First, I need to identify the core issues. The normalization problem seems critical. Scaling each person's utility from 0 to 1 based on their local context ignores the absolute stakes. A bed net and a child's life both get compressed to the same scale, which obviously distorts priorities. Then there's the risk aversion mismatch—why did their personal test fail to capture their actual preferences?

  Hmm, the small-stakes approach might be the culprit here. Expected utility theory's risk aversion comes from curvature in the utility function. But with small amounts, that curvature is minimal, leading to near-linear results. That's why the user isn't indifferent to the $50k vs $100k gamble despite what the test showed. They need larger stakes to reveal true risk preferences.

  Also, the von Neumann-Morgenstern utility is unique only up to affine transformations. But when summing across people, the scaling matters immensely. If one person's "1" is another's "0.1" in absolute welfare terms, summing them naively is meaningless. Harsanyi's theorem assumes pre-comparable utilities, which is exactly what's missing here.

  What about alternatives? Maybe equivalent income or QALY-like approaches that anchor to observable benchmarks. But those have their own issues. Or perhaps focusing on resources rather than utility, accepting that deep welfare comparisons might be impossible. The user seems to want a rigorous solution, but the philosophical problem might be intractable.

  The user's frustration is palpable. They've tried to apply rigorous rationalist principles but hit a wall. They might need a pragmatic compromise—maybe using domain-specific units like life-years saved, while acknowledging the ethical weightings. Or accepting that some normative choices are unavoidable in philanthropy. Their deep technical understanding means I shouldn't oversimplify, but the answer might be that perfect cardinal comparison is impossible. Still, their behavioral approach could be salvaged with better normalization anchors... though finding those anchors is the real challenge.
answer: |-
  Your concerns are profound and cut to the heart of welfare economics and social choice theory. Your behavioral well-being unit (BWU) approach is admirably rigorous but suffers from two critical, likely fatal, flaws: **Normalization Insensitivity to Absolute Welfare Differences** and **Misapplication of vNM Utility for Cross-Person Aggregation**. Here's the breakdown:

  ### 1. **The Fatal Normalization Problem: "Range Insensitivity"**
      * **The Issue:** Anchoring everyone's utility from 0 (worst outcome *in their local context*) to 1 (best outcome *in their local context*) discards all information about the *absolute scale of suffering or gain* between different people's contexts. This is the core reason for your "strange numbers".
      * **Example Revisited:**
          * **Villager A:** Context = {Status Quo (0), Receive Bed Net (1)}. The "distance" between status quo and a bed net is defined as 1 BWU.
          * **Villager B:** Context = {Child Dies (0), Child Survives (1)}. The "distance" between a child dying and surviving is *also* defined as 1 BWU.
      * **Why This is Wrong:** Your normalization forces the *subjective intensity* of moving from "child dies" to "child survives" to be *exactly equal* to the *subjective intensity* of moving from "no bed net" to "bed net" for Villager A. This is nonsensical. The absolute welfare difference between a child living and dying is vastly greater than the difference between having or not having a bed net. Your normalization erases this essential information, making BWUs incomparable across individuals with different life circumstances. **BWU conflates *relative local intensity* with *absolute welfare significance*.**

  ### 2. **The vNM Utility Misinterpretation: Risk != Welfare & Scale Freedom**
      * **vNM Measures Preference Intensity Under Risk, Not Absolute Welfare:** The vNM theorem brilliantly derives a *cardinal* utility function *for an individual* from their choices under risk. This utility function is unique *only up to positive affine transformation* (u'(x) = a*u(x) + b, a > 0). It captures the *curvature* of preferences regarding gambles, reflecting risk attitude.
      * **The Scale Freedom is the Killer for Aggregation:** The constants `a` and `b` are arbitrary for a single individual. When you rescale each person's vNM utility to [0,1] based *only on their local context*, you are implicitly choosing `a` and `b` *differently* for each person. You set `b` such that min(context) = 0 and `a` such that max(context) = 1. **This choice of `a` and `b` is completely arbitrary from the perspective of interpersonal welfare comparison.** There is *no behavioral basis* within revealed preference theory for choosing `a` and `b` consistently across individuals to make their utility levels or differences comparable.
      * **Your Self-Experiment Proves the Point:** Your near-linear utility curve for small monetary gambles *is exactly what standard theory predicts*. The curvature of vNM utility (risk aversion) emerges primarily over larger stakes relative to wealth. Small-stakes gambles reveal very little curvature, implying near-linear utility and thus near-risk-neutrality over those small amounts. This is consistent with Rabin's calibration theorem. Your emphatic preference for the sure $50k over the gamble reveals that the stakes were *not* small relative to your overall wealth/well-being context. **Small-stakes elicitation fails to capture true global risk aversion/welfare curvature.**

  ### 3. **Harsanyi's Aggregation Theorem: What It Does (and Doesn't) Do**
      You are correct to be skeptical. Harsanyi's Utilitarianism Theorem shows that if:
      1. Individuals have vNM preferences over social lotteries.
      2. The social planner has vNM preferences over social lotteries.
      3. The social preference satisfies Pareto Indifference and Pareto Preference...
      *Then*, the social welfare *must* be a weighted sum of individual vNM utilities: W = Σ w_i * u_i(x).
      * **The Catch:** The theorem **assumes** the individual vNM utilities `u_i(x)` *are already interpersonally comparable*. It does *not* provide a method to *elicit* them in a comparable way. The weights `w_i` and the scaling of the `u_i` are not pinned down by behavior alone. Harsanyi's framework *presupposes* the comparability you are trying to *establish* behaviorally. Your project is attempting the logically prior step that Harsanyi assumes is given.

  ### Where Does This Leave You? Repairs and Alternatives

  1.  **Abandon Local Normalization:** The 0-1 local rescaling is the primary villain. It destroys cross-context comparability. **There is no behavioral (revealed preference) solution to fixing the scaling constants (`a` and `b`) across individuals.** This is the fundamental "underdetermination" problem of interpersonal comparison. No amount of lottery choices *within* an individual's context tells you how to set their `a` and `b` relative to another individual's.

  2.  **Consider Anchoring to "Absolute" Reference Points (Imperfectly):**
      *   **Zero:** Anchor "zero utility" to something conceptually absolute, like the biological subsistence level or a state of no conscious experience (death/unconsciousness). This defines `b`.
      *   **Unit:** Define a "unit" of welfare based on a standardized, minimally noticeable improvement (e.g., "one day free of moderate pain," "preventing one minor infection"). This partially defines `a`.
      *   **Problems:** These anchors are fraught. Is "subsistence" the same welfare level across cultures? Is a "unit" improvement subjectively identical? This moves away from pure behaviorism towards ethical/philosophical stipulation.

  3.  **Focus on Resources or Outcomes, Not Direct Welfare:** Accept that direct interpersonal utility comparison is behaviorally impossible and ethically fraught. Instead:
      *   **Use Money-Metric Utility (Equivalent Income):** Measure the amount of money needed to make an individual indifferent to a policy change. Summing willingness-to-pay (WTP) or equivalent variations becomes Cost-Benefit Analysis (CBA). This uses market behavior but assumes marginal utility of money is constant or comparable, which it often isn't, especially across large wealth disparities.
      *   **Use Physical Outcome Units:** Focus on directly measurable outcomes relevant to your fund's mission: life-years saved, DALYs/QALYs averted, cases of disease prevented, children educated, etc. This avoids utility comparison but requires *weighting* these outcomes against each other (e.g., how many bed nets equal saving one life-year?).
      *   **Use a "Veil of Ignorance":** Have committee members deliberate on allocations assuming they have an equal chance of being *any* affected individual. This leverages empathy and fairness intuitions but is not strictly behavioral.

  4.  **Acknowledge the Normative Leap:** Ultimately, any method for aggregating welfare across people requires a *normative judgment* about how to weigh different people's experiences. Revealed preference and vNM utility provide powerful tools *within* an individual's preference structure but cannot, by themselves, bridge the gap *between* individuals. **The "principled version" you seek likely requires moving beyond strict behaviorism to incorporate ethical axioms.**

  ### Recommendation for Your Fund

  Given your discomfort with self-report and the deep problems with BWU, consider a pragmatic hybrid:

  1.  **Abandon the BWU Summation:** The normalization flaw makes it unethical for prioritization where stakes vary vastly.
  2.  **Use vNM Elicitation Contextually:** Use your lottery method *within specific, comparable intervention domains* (e.g., only bed net distributions) to understand *relative* beneficiary preferences for different delivery mechanisms or ancillary benefits. This provides valuable cardinal data *without* requiring interpersonal comparison.
  3.  **Adopt a Multi-Dimensional Outcome Framework:** Define core metrics aligned with your mission (e.g., lives saved <5, life-years saved, cases of malaria prevented, income increases measured). Use best-available evidence to estimate impact per dollar per project on these metrics.
  4.  **Deliberative Weighting:** Have your committee, informed by beneficiary preferences (from self-report and *contextual* vNM where feasible), ethical reasoning (e.g., priority to worst-off), and evidence, establish *explicit normative weights* for trading off your core metrics (e.g., 1 life saved = X cases of malaria prevented = Y $ of income increase). Update these weights periodically based on experience and deliberation. This is transparent and incorporates values without relying on scientifically impossible interpersonal utility comparisons.

  **Conclusion:** Your insight that vNM utility is cardinal was correct, but its cardinality is only meaningful *relative to an individual's own scale*. The freedom of affine transformation (`a` and `b`) is the barrier to behavioral interpersonal comparison. Harsanyi assumes this barrier is overcome; he doesn't show how to do it behaviorally. The underdetermination *does* go deep – it's the core philosophical problem of utilitarianism. Your fund likely needs to embrace explicit normative weighting of measurable outcomes rather than seeking a purely behavioral welfare unit.
