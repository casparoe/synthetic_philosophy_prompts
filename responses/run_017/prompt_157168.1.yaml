prompt: |-
  I work as an auditor for a mid-sized seafood certification scheme — three of us, roughly 120 farm audits a year between us, mostly tropical shrimp and finfish operations in Southeast Asia and Latin America. My training is in fish health, not philosophy, but animal welfare has become the section of the audit that our retailer and NGO board members fight over, and I am the one who has to turn whatever we decide into something a field auditor can actually execute. The constraints are unglamorous: half a day per site, usually with a translator and a farm manager who decides which ponds I see; a bucket, a thermometer, a phone camera and no lab; about forty minutes of the visit for welfare; and a written finding that has to survive both a retailer's lawyer and an NGO campaigner reading the same paragraph. One of my two junior auditors has no training in animal-based indicators at all, and since the UK's Animal Welfare (Sentience) Act 2022 brought vertebrates and some invertebrates — octopuses and decapods among them — within the scope of sentience law, the board has started asking why our standard treats shrimp so differently from salmon, and I have no principled answer to give them.

  What I need is a decision procedure, not a position paper: the questions in order, what counts as a sufficient answer to each, where the procedure terminates in an automatic no, and where it stops and hands the decision to a person because the disagreement is really about what welfare is — felt experience, or health and normal function, or the chance to live a reasonably natural life. I have a draft I want you to stress-test, rewrite and reorder rather than accept: (1) a capacity-gap default, saying that where we cannot establish whether a taxon has the affective capacity a practice would engage, we score the practice against the more demanding plausible capacity rather than the one the producer assumes absent; (2) a detectability constraint, saying no requirement is admissible unless an auditor can verify compliance and detect non-compliance within a forty-minute visit, and that anything failing this must be labelled as paperwork or self-declaration rather than dressed up as an inspection; (3) a two-account rule, keeping lifetime welfare (roughly, time spent in aversive states) separate from the death itself, with the two non-compensable in both directions, plus whatever aggregation rule makes partial credit possible; (4) a rule for slaughter that immobility is not insensibility, specifying what field-observable evidence of insensibility would count and what to do when no such evidence exists for the taxon in front of me. Tell me which of these survive translation into an audit, which should be deleted, and what is missing.

  Then run the procedure on three real-shaped cases and give a committed verdict on each. First: a whiteleg shrimp hatchery that eyestalk-ablates its broodstock to induce spawning and now wants credit because it has started applying a topical anaesthetic first, with no data on whether the anaesthetic works in that tissue or how long it lasts. Second — the one where I expect to dislike the answer: a grow-out shrimp farm that harvests into an ice slurry and argues that thermal shock is a stun, and which our current standard gives full credit; the neighbouring farm installed an electrical stunner and gets the same credit, and I need to know how an auditor with no instruments distinguishes an animal that has stopped moving from one that cannot feel, and whether either farm passes. Third: a tilapia operation with excellent water quality and very low mortality but chronic crowding and a harvest sequence in which fish are crowded, lifted, and left in air for several minutes before killing. Be committed throughout: tell me which draft rules to keep and which to throw out, take a definite position on all three cases and on whether the chill-kill credit survives, and mark explicitly which steps of the procedure are genuine evidence and which are value judgements wearing a clipboard — along with an honest account of the cases where this procedure will misfire and what it simply cannot do.
reasoning: |-
  Okay, the user is an auditor for a seafood certification scheme dealing with animal welfare in aquaculture. They need a practical decision procedure for field audits under tight constraints: limited time, tools, and training. Their draft rules focus on capacity-gap defaults, detectability constraints, separating lifetime welfare from slaughter, and verifying insensibility. 

  Hmm, their real pain points are fascinating: they're caught between retailers' legal teams and NGO campaigners, their junior auditors lack training, and new sentience laws force uncomfortable comparisons between shrimp and salmon. The unspoken tension? They need a shield against criticism more than philosophical purity. 

  Let me gut-check their draft rules. The capacity-gap default is clever – assuming worst-case sentience protects against underprotection scandals. But detectability is the anchor: if you can't measure it in 40 minutes with a bucket and phone, it shouldn't pretend to be audited. That'll crush impractical NGO wishlists. 

  The two-account rule feels surgical. Separating suffering from slaughter stops farms from hiding bad lives behind "humane" deaths. But aggregation? Tricky. Maybe tiered partial credit: severe suffering can't be offset, but moderate issues might if slaughter is perfect. 

  On insensibility... oh boy. That ice slurry case will blow up. Movement cessation ≠ insensibility – even vets confuse them. The rule must demand observable signs like absence of corneal reflex. If none exist for the species? Automatic fail. Sorry, shrimp farms. 

  Now the cases. That hatchery with topical anesthetic? Paper-thin. No efficacy data + detectability failure = zero credit. Tilapia crowding? Lifetime welfare fail despite good stats – chronic stress is invisible without blood work, but gaping at air meets aversion criteria. 

  The ice slurry harvest... yeah, they'll hate this. Thermal shock might paralyze, but without species-specific insensibility markers? It's indistinguishable from live chilling. Fail. Electrical stunner gets credit only if validated for that species with observable signs. 

  Gaps? Auditor training is the Achilles heel. Also, this system will miss slow-burn welfare issues like chronic boredom. But it'll prevent certification of active torture – which is what the lawyers and NGOs actually care about. 

  Final thought: add a transparency rule. When science is unclear, say so in the report. "We failed this because X is unmeasurable" disarms critics better than fuzzy points.
answer: |-
  Here's a stress-tested, reordered decision procedure built for field reality, followed by committed verdicts on your cases. The core philosophy is **actionable defensibility** – prioritizing auditable evidence over theoretical ideals while closing loopholes producers exploit.

  ### Revised & Reordered Decision Procedure
  **(Execute in Sequence – Stop at First "No" or Handoff)**

  1.  **Detectability Check (Gatekeeper):**
      *   *Question:* Can compliance/non-compliance with *this specific requirement* be verified by the auditor within 40 minutes using only: visual observation, thermometer, bucket, phone camera, translator, and farm-provided access?
      *   *Sufficient Answer:* Yes, with a clear description of *exactly* what the auditor looks for/listens for/measures and what constitutes pass/fail. Must be observable *at the time of the audit* on *live animals* or the immediate environment.
      *   *Automatic No:* Requirement fails detectability. It *cannot* be part of the audited welfare score. It may be moved to paperwork/self-declaration (clearly labelled as such) or discarded.
      *   *Value Judgement?* Minimal. Focuses on practical feasibility of evidence gathering.

  2.  **Slaughter Insensibility Verification (Specific Sub-Rule):**
      *   *Question A (Critical):* Is there species-specific, scientifically validated, *field-observable* evidence confirming insensibility *before or at the point of death* for the method used? (e.g., absence of corneal reflex for >X seconds post-stun, specific behavioral signs of unconsciousness).
      *   *Sufficient Answer A:* Yes, with documented, accessible protocol *and* auditor training on the specific signs. Auditor must directly observe the slaughter process and confirm signs.
      *   *Automatic No A:* No validated field-observable signs exist for this species/method. Slaughter process **fails automatically**. *No credit possible for slaughter welfare.*
      *   *Question B:* If observable signs exist, does the observed process achieve and maintain them reliably until death?
      *   *Sufficient Answer B:* Auditor directly observes the process and confirms signs consistently in multiple animals.
      *   *Automatic No B:* Signs are not consistently observed. Slaughter process **fails**.
      *   *Value Judgement?* Defining "validated field-observable signs" requires scientific input (pre-loaded), but *application* is evidential. "No signs exist = Auto Fail" is a principled rule.

  3.  **Lifetime Welfare Aversion Assessment (Separate Account):**
      *   *Question:* Based on direct observation and limited measures (stocking density visible in ponds, water quality via bucket/thermometer, visible injuries, stereotypic/escape behaviors, significant algal blooms, access to feed, handling procedures observed), is there evidence the animals are experiencing prolonged or severe aversive states (chronic stress, fear, pain, deprivation)?
      *   *Sufficient Answer:* No significant evidence of prolonged/severe aversion states observed OR observed mitigations are effective (e.g., environmental enrichment actually used, excellent water quality despite density).
      *   *Automatic No:* Clear, observable evidence of significant, unmitigated aversive states exists (e.g., severe fin damage, extreme crowding with poor water, widespread escape attempts, untreated lesions). **Automatic lifetime welfare fail.**
      *   *Partial Credit:* Possible for minor/mitigated issues if core welfare (health, basic function) is maintained (e.g., moderate crowding but pristine water and low mortality/no injuries).
      *   *Handoff:* If evidence is ambiguous *but* standard husbandry practices for the species are known to cause welfare issues, apply the **Capacity-Gap Default**.
      *   *Value Judgement?* Defining "prolonged/severe" and interpreting behaviors involves judgement, grounded in ethology/health training. The *Capacity-Gap Default* is the explicit value rule applied here.

  4.  **Capacity-Gap Default (Value Rule for Ambiguity):**
      *   *Trigger:* When scientific consensus is lacking on whether a practice causes suffering *for this specific taxon*, AND the practice is known to cause suffering in phylogenetically related taxa with confirmed sentience (e.g., crustaceans vs. insects vs. vertebrates).
      *   *Rule:* Assume the *more demanding plausible capacity* (i.e., assume the animal *can* suffer from this practice) unless robust, species-specific evidence proves otherwise. Score the practice conservatively.
      *   *Sufficient Answer to Avoid Default:* Peer-reviewed, species-specific studies demonstrating the practice does *not* engage negative affective states.
      *   *Value Judgement?* **Yes, explicitly.** This is the core value choice: Precaution in favor of animal welfare when uncertainty exists. It avoids the "we didn't know" defense exploited by producers.

  5.  **Two-Account Aggregation (Scoring):**
      *   *Rule:* Lifetime Welfare (LW) and Slaughter Welfare (SW) are scored *separately* and are **non-compensable**.
      *   *Aggregation for Overall Pass/Fail:*
          *   **Fail:** Automatic LW Fail OR Automatic SW Fail OR Severe LW issues (even if mitigated) + any SW issues.
          *   **Conditional Pass:** Minor LW issues + Perfect SW OR Good LW + Minor SW issues (if detectable/verifiable minor issues exist). Requires Corrective Actions.
          *   **Full Pass:** No Automatic Fails, No Significant/Minor issues observed in either account.
      *   *Value Judgement?* Defining "Severe" vs. "Minor" involves judgement, but the non-compensable separation is a principled rule against trading suffering.

  ### Rules Verdict
  *   **Keep & Strengthen:**
      *   **Detectability Constraint (Gatekeeper):** Essential. The bedrock of credible auditing. Forces honesty about what's verified.
      *   **Slaughter Insensibility Rule:** Critical. "Immobility ≠ Insensibility" must be explicit. Demands observable evidence.
      *   **Two-Account Rule (Non-Compensable):** Vital. Prevents greenwashing a bad life with a "good" death or vice-versa.
      *   **Capacity-Gap Default:** Necessary value rule for ambiguity. Drives precaution with invertebrates like shrimp.
  *   **Revise/Refine:**
      *   **Aggregation:** Needs clearer tiers (Full Pass / Conditional Pass / Fail) based on severity within accounts.
  *   **Missing:**
      *   **Explicit "No Data = Fail" for Slaughter Insensibility:** Crucial for novel methods/taxa.
      *   **Handling Verification:** Add spot-check observation of *any* handling (e.g., during sampling, transfer) to Lifetime Welfare assessment.
      *   **Mortality as Proxy (Limited):** Very high mortality *can* be evidence of chronic welfare issues if causes are observable/persistent (part of Lifetime Welfare).

  ### Case Verdicts (Committed)
  **Case 1: Whiteleg Shrimp Hatchery (Eyestalk Ablation w/ Topical Anaesthetic)**
  1.  **Detectability Check (Anaesthetic Efficacy):** FAIL. Auditor cannot verify depth, duration, or efficacy of anaesthesia in neural tissue (eyestalk) during the procedure with available tools/time. *No observable evidence possible.*
  2.  **Slaughter?** N/A (Broodstock).
  3.  **Lifetime Welfare:** The practice (ablating a sensory organ) is inherently invasive. **Capacity-Gap Default Applies:** Absent species-specific proof ablation isn't painful *under anaesthetic*, assume it is. Mitigation (anaesthetic) fails detectability check -> **No credit for mitigation.** Practice remains a significant aversive state. **Automatic Lifetime Welfare FAIL.**
  4.  **Verdict: FAIL.** No credit for anaesthetic use. Eyestalk ablation remains a major welfare issue.

  **Case 2: Grow-Out Shrimp Harvest (Ice Slurry vs. Electrical Stunner)**
  *   **Common Slaughter Insensibility Verification:**
      *   **Question A (Validated Signs):** Is there field-observable evidence for shrimp? **NO.** Scientific consensus on reliable, *field-verifiable* signs of insensibility in decapods (like corneal reflex absence) is lacking for *both* thermal shock and electrical stunners. Electrical stunning *may* be effective in lab settings with EEG, but this is not field-verifiable.
      *   **Automatic No A:** **FAIL** for *both* ice slurry *and* the electrical stunner. **No credit possible for slaughter welfare for either farm.** The "chill-kill credit" in the current standard **does NOT survive**.
  *   **Lifetime Welfare:** Assessed separately per farm (not detailed here, but impacts overall pass/fail).
  *   **Verdict:** **FAIL** on Slaughter Welfare for both farms. Electrical stunner gets no credit without verifiable insensibility signs. The ice slurry argument ("thermal shock is a stun") is invalidated by the lack of observable proof of insensibility *before* death.

  **Case 3: Tilapia Operation (Crowding, Aerial Exposure)**
  1.  **Detectability Check (Crowding/Aerial Exposure):** PASS. Stocking density (visual), water quality (thermometer/bucket: DO, temp, ammonia smell), fish behavior during crowding (panic, gaping), and duration of aerial exposure (timed observation) are observable.
  2.  **Slaughter Insensibility Verification:** Depends on method (e.g., percussive, electrical, ice). Must pass Rule 2 separately. *Assume it passes for this analysis, focusing on handling.*
  3.  **Lifetime Welfare Aversion Assessment:**
      *   *Evidence:* Excellent water quality/low mortality suggests *health* is managed. However:
          *   Chronic crowding is visible/measurable (density).
          *   Handling process observed: Crowding induces visible panic (aversive state). Lifting and aerial exposure for *several minutes* causes obvious distress (gaping, thrashing initially then lethargy) – a severe aversive state.
      *   **Automatic No:** The prolonged aerial exposure constitutes a **severe, unmitigated aversive state** directly observed. **Automatic Lifetime Welfare FAIL.**
  4.  **Verdict: FAIL.** Excellent water quality and low mortality do not compensate for the severe stress and suffering inflicted during the prolonged harvest handling sequence. Slaughter method (if good) is irrelevant to this fail.

  ### Honest Account of Limitations & Misfires
  *   **What It Does Well:** Prevents certification of practices with unverifiable welfare claims or obvious severe suffering. Forces transparency. Handles invertebrate ambiguity conservatively. Provides clear audit trail for lawyers/NGOs.
  *   **Where It Misfires:**
      *   **False Negatives (Failing Good Farms):** A farm with excellent welfare but poor record-keeping might fail a paperwork-heavy requirement pushed to self-declaration. A farm using a truly humane but novel stunning method lacking *field* validation will fail Slaughter.
      *   **False Positives (Passing Bad Farms):** Sophisticated farms can hide chronic, low-grade suffering (e.g., subtle behavioral issues, mild chronic pain) within the 40-minute window if no acute signs are visible. "Clean" intensive systems might pass Lifetime Welfare despite arguable deprivation of natural behaviors if aversion isn't overt.
      *   **Limited by Auditor Skill:** Junior auditor without training might miss subtle behavioral signs of aversion or misjudge stocking density.
      *   **Ignores Cumulative/Long-Term Effects:** Focuses on observable states *at the time*, missing the impact of repeated minor stressors or long-term consequences of early-life events.
      *   **"Natural Life" is Largely Excluded:** Except where deprivation leads to observable aversion (e.g., severe spatial restriction), the "reasonably natural life" concept is too vague and unauditable under these constraints.
      *   **Science Gaps Hurt:** Where no species-specific research exists (common for invertebrates), the Capacity-Gap Default is conservative but may be overly restrictive if sentience is genuinely absent. Producers bear the burden of proof.
  *   **What It Cannot Do:**
      *   Guarantee animals have a "good life" or are "happy."
      *   Measure internal states directly (pain, fear intensity).
      *   Fully assess complex mental states or long-term welfare.
      *   Replace deep expertise – it's a safety net/decision tree.
      *   Resolve fundamental philosophical disputes about welfare – it *operationalizes* a precautionary, evidence-based, "freedom from prolonged/severe suffering" definition suitable for audit constraints.

  This procedure provides the **actionable defensibility** you need: clear rules, auditable evidence, precaution on sentience, separation of life/death welfare, and explicit acknowledgement of value judgements where they occur. It will generate tough decisions (especially failing slaughter methods), but those decisions will be principled and defensible to both lawyers and campaigners.
