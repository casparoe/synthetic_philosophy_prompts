     - **Justification:** For standard prioritarianism with \(V(x) = \sum_i f(u_i)\), \(f\) increasing and strictly concave, and variable populations, the verdict that II > I (e.g., with \(f(u) = u^{0.5}\)) is a direct mathematical consequence, as your calculation shows (verified below). Extensions to variable populations are well-established in prioritarian literature (e.g., Parfit, Adler).  
     - *Verification of your arithmetic:* For \(f(u) = u^a\), set \(V(I) = V(II)\): \(10^a + 5^a = 2 \times 5^a + 1^a\), simplifying to \(10^a - 5^a = 1\). At \(a = 0.5\), \(10^{0.5} - 5^{0.5} \approx 3.162 - 2.236 = 0.926 < 1\). At \(a = 0.52\), \(10^{0.52} \approx 3.311\), \(5^{0.52} \approx 2.119\), difference \(\approx 1.192 > 1\). Interpolation confirms the flip near \(a \approx 0.515\), consistent with your \(\approx 0.52\).

