  ## The Gricean Sestina: On Saying and the Unsaid

  The words themselves are plain enough to **say**,
  But shadows cling to what they seem to **mean**.
  The ear receives the signal, strives to **hear**
  Precisely what the uttered sound might **catch**.
  It follows logic, structure, form, and **rule**,
  Yet sense unfolds uniquely, shaped by **now**.

  Consider how the phrase arrives just **now**:
  Its surface structure tells you what I **say**.
  You sense a deeper drift, a hidden **rule**
  Of conversation guiding what I **mean**.
  A flicker in the context, what you **catch**,
  Goes far beyond the noise you merely **hear**.

  You listen close to every word you **hear**,
  Attuned to possibilities of **now**.
  A subtle implication you might **catch**
  Is woven through the thing I clearly **say**.
  It's not contained within the stated **mean**,
  But flows from how we jointly use the **rule**.

  We tacitly agree to keep the **rule**:
  Cooperation forms the ground we **hear**.
  This shared foundation helps define the **mean**
  That hovers near the utterance of **now**.
  You parse the literal sense I plainly **say**,
  Yet grasp the resonance you truly **catch**.

  The implication's something you must **catch**;
  It's not attached by some linguistic **rule**
  To sound alone. Were different words to **say**
  The core proposition that you **hear**,
  The shadowed meaning present here and **now**
  Might shift, though core content would still **mean**

  The same. Attempt to *state* what I should **mean**
  Outright? The nuance flees! You cannot **catch**
  It whole, for it belongs uniquely **now**.
  Deny it? Yes! That test reveals the **rule**:
  It cancels clean. You know what you first **hear**
  Is literal, distinct from what I **say**.

  I *intend* you to **catch** the drift, **mean** more than **say**.
  This **now** invites your mind, beyond what's **hear**d.
  The **rule**? I trust you'll grasp my aim this way.

  ---
  **Note on Liberties and Revisions:**

  The poem takes liberty by implying the *intention* alone (Stanza 6, Envoi) can create implicature, downplaying the essential role of the Cooperative Principle and maxims in the *hearer's* calculation. A strict Gricean might insist the intention must be *calculable* via the CP for it to count as implicature.

  *   **If the Circularity Objection holds:** The entire conceit of the final stanza and Envoi (relying on "intend to mean" and "grasp my aim") becomes problematic. The word **mean** (especially as a verb) would need significant revision or removal, as the objection targets the definition of speaker meaning involving recognition of that very intention.
  *   **If Relevance Theory subsumes much to "what is said":** The stark distinction between early stanzas (literal **say** vs. implicated **catch/mean**) weakens. Words like **catch** and **rule**, crucial here for marking implicated content derived via pragmatic inference (maxims/CP), would likely represent aspects belonging to the enriched "what is said" (explicature), not pure implicature. Their roles in Stanzas 2-5 would need rewriting.
