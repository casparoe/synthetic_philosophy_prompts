  Another possible attack: a Strawsonian might say that the therapeutic stance is just a way of managing the relationship, but it doesn't show that Leo is responsible. However, we are stipulating that he is responsible. We are trying to show that responsibility and the fittingness of reactive attitudes can come apart.

