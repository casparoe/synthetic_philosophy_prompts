  ### Scenario:  
  At the law firm, senior partner Edwin and junior partner Fiona have a decade-long mentor-mentee relationship built on mutual respect. During a high-stakes client presentation, Edwin abruptly interrupts Fiona’s analysis, dismissively attributing her well-researched conclusions to "inexperience," undermining her authority and causing professional harm. This act is a clear wrong: it manifests Edwin’s bad quality of will—arrogant disregard for Fiona’s expertise—and he is morally responsible (he could have chosen to support her; his conduct reflects his character). Yet, Fiona cannot resent him. Years earlier, Edwin had saved Fiona’s career by exposing a senior partner’s fraud at great personal risk, an act that cemented her lifelong debt to him. Now, Fiona views Edwin’s behavior through the lens of this foundational debt: she sees his conduct as a flaw to be managed with detached compassion, not resentment. Indignation feels unfitting; the objective attitude—addressing his behavior as a problem to handle, not a moral violation—is called for.  

  ### Analysis:  
  - **Strawson’s view**: Strawson ties moral responsibility directly to the aptness of reactive attitudes like resentment. Here, he would argue that if resentment is unfitting, Edwin is not morally responsible—perhaps because the debt creates a "relational exemption," reframing Edwin as an object of management rather than a participant in moral dialogue.  
  - **Quality-of-will view (e.g., Hieronymi/Scanlon)**: Blame is apt because Edwin’s act reflects a blameworthy quality of will (arrogant disregard). The unfittingness of resentment stems from Fiona’s relational context, not Edwin’s psychology, so responsibility remains intact.  
  - **Divergence**: The views split on whether responsibility requires the *availability* of reactive attitudes. Strawson collapses the two; quality-of-will theorists separate them, allowing blameworthiness without fitting reactive attitudes.  
  - **Key feature**: **Foundational debt of gratitude** (or asymmetrical life-debt). This situational feature—Fiona’s irreversible obligation to Edwin—makes resentment unfitting by transforming her stance, not by excusing Edwin.  
  - **Without the feature**: Remove the life-debt, and this collapses into an ordinary blame case: Fiona’s resentment would be fitting, as there’s no relational barrier to the participant stance.  
  - **Strawsonian attack**: A Strawsonian would argue that the life-debt alters Edwin’s moral status, exempting him from reactive attitudes. They might insist that Fiona’s objective attitude *just is* an exemption, proving Edwin isn’t responsible—thereby rejecting the stipulation that responsibility and reactive-attitude aptness can come apart.  

  \answer{foundational debt of gratitude}
