prompt: |-
  Hey — I'm drafting a short paper arguing that Strawson's account can't be the whole story about moral responsibility, because an agent can be fully responsible while the participant stance toward them just isn't available. So I need a case where the two come apart, and I keep produceing ones that cheat.

  Build me a scenario — a workplace or a family, one paragraph max, two named people with an actual relationship — where the agent is straightforwardly morally responsible for a real, harmful wrong and their conduct manifests a genuinely bad quality of will (so a quality-of-will / blame-judgment view, along the lines of Hieronymi's or Scanlon's, says blame is apt), and yet resentment and indignation are unfitting and the objective attitude is what's called for.

  The hard part, and the reason my own attempts keep failing: the unfittingness can't come from the agent's psychology or capacities and it can't be an excuse. So no manipulation by anybody, no coercion, no brain or neurology stuff, no Frankfurt-style device, no 'they couldnt have done otherwise', no psychopathy, childhood or mental illness — nothing that slots them into Strawson's exempting or excusing categories. It also can't be a consequentialist point about how resenting them would go badly, or be bad to express; the reactive attitudes have to be unfitting in themselves, not just inadvisable. My hope is that whatever does the work is relational or situational — something about who is relating to whom, or where the two of them stand. No making the wrong trivial either, and no letting a third party's fault carry the weight.

  Then: say what Strawson's own view and the quality-of-will view each say about your case and why they diverge there, name the single feature that's doing the work, tell me what the case becomes if you remove that feature (does it collapse back into an ordinary excuse case?), and tell me how someone who thinks responsibility just *is* aptness for the reactive attitudes would attack it — I want to know I'm not stipulating the verdicts.

  End with \answer{...} naming the feature that does the work, in six words or fewer.
reasoning: |-
  We are looking for a scenario where:
  - Agent A is morally responsible for a harmful wrong that manifests a bad quality of will (so blame is apt on a quality-of-will view).
  - However, resentment and indignation from the victim (or others) are unfitting, and the objective attitude is called for.
  - The reason cannot be about the agent's psychology, capacities, or any standard exempting/excusing condition (so no manipulation, coercion, inability to do otherwise, psychopathy, etc.).
  - It cannot be about consequences (e.g., that expressing resentment would be bad) but about the inherent unfittingness of the reactive attitudes.
  - The key should be relational or situational: something about the relationship or the situation between the two people.

  Let me try to construct such a scenario.

  **Scenario:**

  In a small family business, elderly patriarch Arthur, who built the company, has always been domineering and critical. His daughter, Brenda, now runs the company day-to-day. During a board meeting, Arthur publicly berates Brenda for a minor accounting error, accusing her of incompetence and disloyalty, causing deep humiliation. This is a real wrong: it harms Brenda (emotionally and professionally) and manifests Arthur's bad quality of will (a dismissive, controlling attitude). However, Brenda knows that Arthur has recently been diagnosed with a terminal illness and is struggling with the loss of his identity and control. She recognizes that his outburst comes from a place of profound fear and vulnerability, not malice. Moreover, Arthur has always been this way, and Brenda has long since accepted that this is how he is, having moved beyond resentment.

  Now, let's check:

  1. **Moral Responsibility and Bad Quality of Will**: Arthur is responsible for the harmful act (public berating) and it manifests a bad quality of will (dismissive, controlling). So, on a quality-of-will view (like Hieronymi or Scanlon), blame is apt.

  2. **Reactive Attitudes Unfitting?**: In the scenario, resentment and indignation are unfitting because Brenda has a deep understanding of Arthur's situation (terminal illness, loss of identity) and their history. She takes the objective attitude: she sees Arthur as someone to be managed or understood, not as someone with whom to engage in the normal reactive exchanges. Importantly, the unfittingness does not come from Arthur's incapacity (he is not excused by his illness; he is still the same person and could have controlled himself) but from the relational history and the current situation (Brenda's perspective and their relationship).

  But wait: is the terminal illness making us slide into an excusing condition? We must be careful. The point is not that Arthur is excused by his illness (we are stipulating that he is still responsible and his will is bad) but that the relationship and history (and the current context of his vulnerability) make resentment unfitting. The key is Brenda's stance: she has, over time, adopted an objective attitude because of the nature of their relationship and the current circumstances.

  However, Strawson might say that the terminal illness and his emotional state could be seen as an excusing condition. But note: we are not saying Arthur is not responsible because of his illness; we are saying that the reactive attitude is unfitting because of the relational context. Let me try to adjust.

  **Revised scenario without relying on illness as an excuse:**

  At the law firm where senior partner Edwin and junior partner Fiona work, they have a long-standing professional and personal relationship. Edwin, who is known for his sharp tongue, publicly humiliates Fiona during a client meeting by mocking her proposal, causing significant harm to her reputation. This act is a real wrong and manifests a bad quality of will (arrogance, disrespect). However, unbeknownst to Edwin, Fiona has just received news that her child is critically ill. Fiona, in her distress, cannot muster resentment towards Edwin; instead, she regards him with an objective attitude, seeing his behavior as just another instance of his character, which she has come to accept as part of the background of her life. She does not see him as a participant in the normal moral exchange because her own crisis has shifted her perspective.

  But here, Fiona's own state (her child's illness) is what changes her reaction. That might be seen as making the reactive attitude unfitting for her, but it doesn't necessarily show that the attitude is inherently unfitting. We need a case where the reactive attitude is unfitting for anyone in that relationship, or at least for the victim, due to the relational features.

  **Better scenario:**

  Consider a married couple, Leo and Maya. Leo has a habit of making harsh, critical remarks that hurt Maya. One evening, at a dinner party, Leo makes a cruel joke at Maya's expense, humiliating her in front of friends. This is a real wrong: it harms Maya (emotionally) and manifests a bad quality of will (disregard for her feelings). However, Maya and Leo have been through years of therapy and have come to understand that Leo's behavior stems from deep-seated insecurities that he has struggled with since childhood. They have worked on their relationship and, while Leo still slips, Maya has learned to view these incidents not as attacks but as symptoms of his ongoing struggle. She no longer feels resentment because she has adopted a therapeutic stance towards him, seeing his actions as part of a pattern to be managed rather than as moral affronts. This objective attitude is a product of their shared history and the work they have done together.

  Now, note: Leo is responsible (he could have controlled the remark, and it reflects a bad quality of will). But the reactive attitude of resentment is unfitting because of the relational context: the therapeutic framework they have both committed to and the understanding they have built. It's not that Leo is excused (he is still blameworthy for the remark) but that the participant stance is no longer the appropriate mode of engagement for Maya.

  **Check against requirements:**

  - **No exempting/excusing conditions**: Leo's insecurities are not being used as an excuse. We are assuming he is fully responsible and his will is bad. The point is about Maya's stance, which is shaped by the relational history.

  - **The unfittingness is relational**: It comes from the specific relationship and the shared history of therapy, which has restructured their interactions.

  **Strawson's view vs. Quality-of-will view:**

  - **Strawson**: For Strawson, being morally responsible is being an appropriate target of the reactive attitudes. So, if the reactive attitudes (resentment, indignation) are unfitting, then the agent is not morally responsible. In this case, Strawson might say that the therapeutic context has shifted Leo into a category where the objective attitude is called for, which would mean he is not fully responsible. But note: we are stipulating that Leo is responsible and his will is bad. So, Strawson would have to explain why the reactive attitudes are unfitting. He might say that the relationship has changed in a way that exempts Leo from the participant stance, but that would be at odds with the quality-of-will view.

  - **Quality-of-will view (e.g., Hieronymi, Scanlon)**: They would say that Leo is blameworthy because his action manifests a bad quality of will. The fact that Maya has adopted an objective attitude does not change the fact that blame is apt. It might be that Maya, for relational reasons, is not feeling resentment, but that doesn't mean the blame isn't warranted. The aptness of blame is independent of the victim's reactive attitudes.

  **The divergence**: The quality-of-will view focuses on the agent's will and the moral judgment about it, while Strawson ties responsibility to the appropriateness of the reactive attitudes. In this case, the quality-of-will view says blame is apt (because of the bad will) but Strawson would have to say that if the reactive attitudes are unfitting, then the agent is not responsible. However, we are claiming that the reactive attitudes are unfitting even though the agent is responsible.

  **The feature doing the work**: The key feature is the **therapeutic reframing of the relationship** or the **adoption of a managerial stance**. This is a relational feature that changes the stance one takes toward the agent without changing the agent's responsibility.

  **If we remove that feature**: Without the therapeutic history, this would be an ordinary case of blame. If Maya had not gone through therapy and did not have this understanding, she would resent Leo, and that resentment would be fitting.

  **Attack from a Strawsonian**: A Strawsonian might argue that the therapeutic stance itself changes the relationship so that Leo is no longer seen as a full participant in the moral community. They might say that in adopting the objective attitude, Maya is treating Leo as exempt. But we are stipulating that Leo is not exempt (he is responsible and his will is bad). The Strawsonian might then say that if the reactive attitudes are unfitting, that just means Leo is not responsible. But that is the point of contention: we are trying to show that responsibility can exist without the fittingness of reactive attitudes.

  Alternatively, the Strawsonian might argue that the reactive attitudes are still fitting, but Maya is not feeling them because of her own psychological state (the therapeutic reframing). But that would be a reason not to feel them, not that they are unfitting. We need to establish that they are unfitting. So, to make the case stronger, we should emphasize that in the context of their relationship, the participant stance is no longer appropriate because of the shared understanding and the commitment to a different mode of interaction.

  **Final scenario (one paragraph):**

  Leo and Maya, a married couple, have been in couples therapy for years due to Leo's pattern of making hurtful remarks. At a dinner party, Leo mocks Maya's career achievements in front of friends, causing her embarrassment. This act is a clear wrong, manifesting Leo's disrespectful quality of will. However, Maya, drawing on their therapeutic work, views this incident as a relapse in Leo's ongoing struggle with insecurity, not as a moral affront. She feels sorrow, not resentment, and adopts an objective attitude, focusing on how to address it in their next therapy session. The reactive attitudes are unfitting because the therapeutic framework they have both committed to has restructured their relationship, making the objective attitude the appropriate response.

  **Answer**: The feature that does the work is the **therapeutic reframing of the relationship**.

