answer: |-
  ### The Game  
  A billionaire sponsors a lottery to benefit a charitable foundation dedicated to mosquito nets, where each dollar saves 0.001 lives with no diminishing returns or bottlenecks. Tickets are sold at a variable entry fee. A single public draw uses a certified random number generator selecting a value uniformly from [0, 1). If the value is < 0.000693 (≈1/1443), every ticket wins $12,989; otherwise, every ticket wins $1. The sponsor escrows $1 billion, ensuring all prizes are covered. Players may buy multiple tickets, but all tickets share the same outcome (no diversification). The foundation’s utility is linear in lives saved, so money has flat marginal utility.  

  ### Maximum Entry Fee Calculations  
  - **(a) Expected money (EMV)**:  
    EMV = (0.000693 × $12,989) + (0.999307 × $1) = $9.00 + $0.999 ≈ $10.00.  
    *Maximum fee: $10.00 per ticket.*  
  - **(b) Expected utility (EU)**:  
    Utility = money × 0.001 lives/$. Since utility is linear in money, EU = EMV × 0.001 lives/$ → $10.00 × 0.001 = 0.01 lives saved.  
    *Maximum fee: $10.00 per ticket (converts to 0.01 lives).*  
  - **(c) Median/typical outcome**:  
    Median outcome = $1 (as P(win $1) = 99.93% > 50%).  
    *Maximum fee: $1.00 per ticket.*  
  - **(d) Many-plays rule**:  
    If played 1,000 times independently (impossible here, but used for rule), median average prize = $1.00 (since P(no $12,989 win in 1,000 plays) = (0.999307)¹⁰⁰⁰ ≈ 50%).  
    *Maximum fee: $1.00 per ticket.*  

  ### Key Feature and Its Role  
  The **heavy left skew** (99.93% chance of $1) combined with a **massive right-tail prize** ($12,989) inflates EMV far above typical outcomes. If removed (e.g., reduce prize to $500 or increase win probability to 1%), EMV drops toward $1, closing the gap.  

  ### Expected Value Advocate's Rebuttal  
  "They should pay up to $10.00. Linear utility means no risk aversion. The loss probability (99.93%) is irrelevant—expected lives saved (0.01) justifies the fee. Short-run ‘bad luck’ doesn’t negate rationality."  

  ### Honest Assessment  
  **Your reaction is not vindicated by standard rational rules.** With truly linear utility, paying $10.00 *is* rational, as EMV = EU. The "no way" intuition arises from unmodeled human heuristics, not optimization.  

  ### Smallest Change to Restore Intuition  
  Reduce the player’s wealth. If the foundation’s budget is $1,000 (not vast), and they consider buying 100 tickets ($1,000 total fee):  
  - Net gain if win: 100 × ($12,989 - $10) = $1,297,900 → saves 1,297.9 lives.  
  - Net loss if lose: 100 × ($1 - $10) = -$900 → leaves $100, saving 0.1 lives.  
  - EU = (0.000693 × 1,297.9) + (0.999307 × 0.1) ≈ 0.90 + 0.10 = 1.00 lives.  
  - **But** if $1,000 upfront could save 1 life *for sure*, EU = 1.00 matches the gamble. No gap.  
  - **Now add curvature**: Suppose utility is logarithmic in lives saved (e.g., due to operational constraints). EU becomes:  
    (0.000693 × log(1,297.9)) + (0.999307 × log(0.1)) ≈ (0.000693 × 7.17) + (0.999307 × (-2.30)) ≈ -2.29,  
    while sure-thing utility = log(1) = 0. Paying $1,000 now has negative EU.  
  **Why it works**: Diminishing marginal utility (here, log curvature) penalizes catastrophic losses, replicating risk aversion without thresholds. The gamble’s EU < sure-thing EU, justifying refusal.  

  ---  
  This setup satisfies all specs: finite prizes, linear utility via charity, single draw blocking diversification, and EMV ≥ 10× median (10 > 10×1) and 10× many-plays (10 > 10×1). The core tension—linear utility forces accepting EMV, but intuition rebels—highlights how real-world "rationality" often embeds hidden risk constraints.
