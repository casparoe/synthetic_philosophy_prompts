prompt: |-
  I'm in a casual reading group on early modern political economy, and this week we went through Hume's essay "Of Money" in his 1752 Political Discourses (we read it on davidhume.org). I made a list of the verdicts he seems to give on money cases, and now I want to predict what he'd say about a new case. His verdicts so far: (1) If some genie doubled everybody's coin overnight in a single isolated kingdom, Hume says the greater or less plenty of money is of no consequence, since prices are always proportioned to the plenty of money — a crown in Henry VII's time served the same purpose as a pound does at present. The only advantage of a greater plenty, he says, is to the public in its wars and negociations with foreign states. He also writes that "M ONEY is not, properly speaking, one of the subjects of commerce; but only the instrument which men have agreed upon to facilitate the exchange of one commodity for another. It is none of the wheels of trade: It is the oil which renders the motion of the wheels more smooth and easy." (2) If a rich trading country gets a big influx of precious metals, he says that "the dearness of every thing, from plenty of money, is a disadvantage, which attends an established commerce, and sets bounds to it in every country, by enabling the poorer states to undersel the richer in all foreign markets." He adds that manufactures gradually shift to provinces where provisions and labour are cheap. (3) If a public bank issues paper credit that augments the circulating coin beyond its natural proportion to labour and commodities, he is against it: such artificial credit is counterfeit money that foreigners will not accept, and it only heightens prices; he even says a bank that locked up all the money it received and never augmented the circulating coin would be more advantageous than a normal one.

  Next, here is the new case. The small trading republic of Meridia recieves a huge grant of a new supranational reserve token that every foreign state accepts for trade, loans, and war finance. Meridia's treasury is scared of the dearness Hume describes, so it locks the entire grant in a vault and keeps it out of domestic circulation; to pay the guards who watch the vault, it prints a small amount of purely domestic paper notes that foreigners refuse to accept. Do you think Hume would say Meridia is better off because of the hoarded token, that the hoard is basically irrelevant unless the token actually circulates at home or gets spent abroad on mercenaries, or something else? I'm less interested in the raw thumbs-up/thumbs-down than in the rule he seems to be running. One rule that fits his verdicts is a proportionality rule: money is only the oil, not a wheel, so the quantity of the circulating medium should stay in its natural proportion to labour and commodities; any increase beyond that is bad because it raises prices, and locking money up is good. Another rule that fits just as well is an acceptability/war-chest rule: what matters is whether the money is real internationally accepted money or mere counterfeit domestic paper; precious metals or universally acceptable tokens give the public weight in wars and negociations, while domestic paper that foreigners reject is useless for that, and the only commercial downside of an influx is the dearness it causes. These diverge on Meridia: the proportionality rule seems to say the locked token does nothing for real wealth (though it avoids the price rise), while the acceptability rule seems to say the hoard is precisely the happy case — you keep the war/negotiation advantage and dodge the dearness. Predict his verdict, say which rule he is really running, and tell me which further case would best tell the two rules apart (for example, if the token were spent abroad on mercenaries versus spent at home on consumption, or if the hoard were in a token foreigners did not accept). Sorry for the ramble, I just find this bit of Hume super confusing and my notes are a mess.
reasoning: |-
  Okay, I need to help this user figure out what David Hume would say about Meridia's case with the supranational reserve token. Let me start by recalling Hume's key points from "Of Money." 

  First, in the genie scenario, Hume says doubling money doesn't really change anything domestically because prices adjust proportionally. The real benefit is in international affairs like wars. He uses that oil metaphor—money isn't a wheel but oil that makes trade smoother. So the quantity itself isn't what matters; it's the proportion to goods and labor.

  Then, when a rich country gets an influx of precious metals, prices rise (dearness), making their exports more expensive. This allows poorer countries to undersell them, shifting manufacturing elsewhere. That's a downside. 

  Next, regarding banks issuing paper credit beyond natural proportions, he's against it. He calls it counterfeit money that foreigners won't accept, driving up domestic prices. He even prefers a bank that locks up money and doesn't circulate it. 

  Now, Meridia gets this supranational token, which everyone accepts internationally, but they lock it up. They only print a small amount of domestic paper for guards, which foreigners reject. 

  Hume's proportionality rule says money should stay in natural proportion to goods/labor. Any excess is bad. Locking up the token avoids price increases, so domestically, it's neutral. But does the hoarded token contribute to real wealth? Probably not, since it's not circulating. 

  The acceptability rule focuses on whether money is accepted internationally. Precious metals or accepted tokens give advantages in war and negotiations, even if hoarded. Domestic paper is useless for that. 

  In Meridia's case, the token is accepted but hoarded. The proportionality rule says the hoard does nothing domestically but avoids dearness. The acceptability rule says the hoard is great because they have the war chest without the price hike. 

  Looking back, Hume's emphasis on locked-up money being advantageous in the bank example suggests he values hoarding when it prevents artificial credit. Also, his point about war/negotiations benefiting from money, even if not circulated, leans towards acceptability. 

  For Meridia, the token is like a war chest. They can use it abroad without circulating it domestically. The domestic paper is minimal and confined, so no dearness. Hume would likely approve because they gain the international advantage without the downside. 

  To distinguish the rules, consider if the token was spent abroad on mercenaries versus domestically. If spent abroad, proportionality might still see it as neutral domestically, but acceptability sees value. If spent domestically, proportionality warns of dearness, while acceptability might still value the token's realness but worry about inflation. 

  Another test: what if the hoard was in a token foreigners didn't accept? Then acceptability rule says it's useless, while proportionality might still see locking it as good to avoid inflation. But since Hume values international acceptance, he'd dismiss such a hoard. 

  So Hume would say Meridia is better off because the hoarded token provides international power without domestic inflation. His core principle is about real, internationally accepted money for state power, while avoiding artificial increases in circulating medium.
answer: |-
  Based on Hume's principles in "Of Money," here’s the verdict for Meridia and the rule he’s applying:

  ### **Hume’s Verdict for Meridia:**
  Hume would argue **Meridia is unequivocally better off** because of the hoarded token. The token grants international power without domestic inflation. He’d likely say:
  - The hoard is a **pure advantage** for "wars and negociations," acting as a strategic reserve.
  - Locking it up avoids the "dearness of everything" (inflation) he condemns in cases (2) and (3).
  - The domestic paper notes are harmless since they’re "small" and confined to paying guards, not disrupting the natural proportion of circulating money to labor/commodities.

  ### **The Rule Hume Is Running: The Acceptability/War-Chest Rule**
  Hume prioritizes **two core principles** that align with this rule:
  1. **International Acceptability = Real Wealth:**  
     Only money accepted abroad (precious metals or, here, the supranational token) confers geopolitical power. Domestic paper is "counterfeit" (as in case 3) and useless externally.  
  2. **Circulation Drives Domestic Harm:**  
     Inflation ("dearness") occurs **only** when extra money *circulates domestically*. Locked money (like his ideal bank vault) avoids this while preserving external value.

  **Why Proportionality Is Secondary:**  
  Hume *acknowledges* proportionality (money as "oil," not a "wheel"), but his verdicts prioritize acceptability and the separation of domestic/international functions. Proportionality explains *why* circulating excess money is harmful, but acceptability determines *whether money has real value to the state*.  

  ### **How the Rules Diverge on Meridia:**
  - **Acceptability Rule:** Hoarding is ideal. Meridia gains a war chest without inflation.  
  - **Proportionality Rule:** The hoard is domestically irrelevant (neutral), neither helping nor hurting the economy—only avoiding harm.  

  ---

  ### **A Case to Test the Rules: Spending the Token**
  To definitively distinguish the rules, compare these scenarios:  

  **Scenario A:** Meridia spends the token **abroad** to hire mercenaries.  
  - **Acceptability Rule:** Hume approves. This fulfills the token’s purpose: enhancing state power in foreign engagements ("wars and negociations"). No domestic inflation occurs.  
  - **Proportionality Rule:** Indifferent. Spending abroad doesn’t alter domestic money supply, so proportionality is maintained.  

  **Scenario B:** Meridia spends the token **domestically** on public projects.  
  - **Acceptability Rule:** Hume condemns this. Even "real" money causes inflation when circulated domestically, leading to "dearness" and eroded competitiveness (as in case 2).  
  - **Proportionality Rule:** Also condemns this, as it disrupts the natural proportion of money to goods/labor.  

  **Result:** Both rules condemn domestic spending, but **only the Acceptability Rule strongly endorses foreign spending**. If Hume approves of Scenario A (as he would), the Acceptability Rule wins.  

  **Crucially, add this twist:**  
  **Scenario C:** Meridia hoards a token **foreigners do NOT accept** (e.g., a purely local cryptocurrency).  
  - **Acceptability Rule:** Hume dismisses the hoard as worthless. It aids neither trade nor war.  
  - **Proportionality Rule:** Still endorses locking it up (as with Hume’s ideal bank), since it prevents inflation.  

  If Hume rejects Scenario C (as he would), the Acceptability Rule is confirmed.  

  ---

  ### **Why Hume Favors Acceptability: Key Evidence**
  1. **Case (1):** Doubling money only matters for "wars and negociations"—*not* because it’s proportional, but because it’s *externally valid*.  
  2. **Case (3):** His praise for a bank that "locked up all money" shows hoarding is virtuous *if* the money is real (i.e., acceptable).  
  3. **Metalism:** Hume ties money’s value to its acceptance in trade (rooted in precious metals). The supranational token mirrors this.  

  In short: **Hume cares about money’s *substance* (externally accepted) and its *deployment* (kept domestic or used abroad).** Meridia’s hoard optimizes both: real money held for state power, kept out of circulation.
