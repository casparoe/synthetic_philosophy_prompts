answer: |-
  Below is a runnable 50-minute discussion design for your Rousseau seminar, structured to help students experientially arrive at the three theses without upfront lecture. The activity uses the constraints provided (18 students, no tech, no cost, table pushed aside) and incorporates your core requirements: a spectacle condition followed by a participatory condition, a focus on the actor's paradox, a dissenter role, and a debrief mapping to Rousseau's arguments. The real action opportunity is signing up for a shift with a local tenants' advice service (or writing a letter to a city councillor), with anonymous pledges collected at the end of each condition.

  **Design Overview:**  
  - **Flow:** Spectacle condition → Actor's paradox exercise → Participatory condition → Debrief.  
  - **Key Elements:**  
    - **Spectacle:** Volunteers perform a short scene; others are passive spectators who rate their emotion and applaud. Ends with pledge opportunity.  
    - **Actor's Paradox:** A volunteer reads lines twice (feeling vs. performing emotion), followed by a vote and report.  
    - **Participatory:** Whole group (including a secret dissenter) sings a song in a circle with no audience. Ends with pledge opportunity.  
  - **Measured Outcome:** Pledge counts from each condition, highlighting the gap between emotional intensity and action.  
  - **Debrief:** Links experiences to Rousseau's theses, distinguishes earned vs. illustrated insights, and addresses limitations.  

  **Materials Needed:**  
  - **Scripts:** One copy of the misfortune scene (below) for volunteers; one copy of the emotional lines for the actor's exercise.  
  - **Paper Slips:**  
    - 18 small slips for emotion ratings (1–5 scale) in spectacle condition.  
    - 36 pledge slips (18 for each condition), each with: "I pledge to: [ ] Sign up for a tenants' advice shift / [ ] Write to a city councillor about housing. Name: __________ Email: __________" (Ensure anonymity by having students fold slips).  
  - **Collection Boxes:** Two boxes/envelopes labeled "After Scene" and "After Song."  
  - **Observer Role Card:** Given secretly to one student before class. Text: "During the participatory song, refuse to join. Stand aside and watch silently. If asked why, say: 'I just don't feel like it.' Do not explain further or argue."  
  - **Timer:** For strict timekeeping (use a phone or watch).  
  - **Bread (Optional):** One loaf to share during participatory condition if song feels insufficient (cost: ~$3 from a bakery; skip if impractical).  

  **Key Roles (Assign Before Class):**  
  1. **Scene Volunteers (3 students):** Give them the script 5 minutes early to review. Choose expressive but not overly dramatic students to avoid caricature.  
  2. **Observer (1 student):** Privately give the role card before class. Select someone reliable but not disruptive.  
  3. **Reader for Actor's Exercise (1 student):** Choose during the activity (no advance prep needed).  

  ---

  ### Activity Script: Minute-by-Minute Timeline (Total: 50 Minutes)

  #### **Minute 0–2: Introduction (2 min)**  
  - **Rules:** Push table against the wall to clear floor space. Students stand in a semicircle.  
  - **Instructions (Verbatim):**  
    > "Today, we’ll explore how groups respond to different kinds of gatherings. We’ll do two short activities: one where some perform and others watch, and one where everyone participates. There’s also a real chance to help with housing justice—a pledge you can take anonymously. No need to overthink; just react naturally."  
  - **Why:** Avoids lecturing, sets up the experiential frame. Words like "catharsis" or "theatre" are omitted.  

  #### **Minute 2–10: Spectacle Condition (8 min)**  
  - **Goal:** Simulate theatre’s division of actors/spectators. Students experience "sterile pity" without naming it.  
  - **Rules:**  
    1. **Scene (3 min):** 3 volunteers perform this 60-second script (distribute copies):  
       > *A: (Head in hands)* I lost my job yesterday. Rent’s due Friday.  
       > *B: (Placing hand on A’s shoulder)* What about your kids? Where will they sleep?  
       > *C: (Pacing, agitated)* The landlord won’t wait. He’s evicting families every day.  
       > *(All freeze in poses of despair for 5 seconds.)*  
       *Why this script?* It mirrors Rousseau’s concern with misfortune (e.g., poverty/eviction) and is generic enough to avoid political triggers.  
    2. **Spectator Tasks (3 min):**  
       - Non-performers rate emotional response: "On a slip, write 1–5: 1 = not moved, 5 = deeply moved."  
       - Collect slips in "After Scene" box.  
       - Lead applause: "Let’s thank the performers with applause."  
    3. **Pledge Opportunity (2 min):**  
       > "Now, here’s a real action: pledge to sign up for a tenants' advice shift or write to a councillor about housing. Slips are anonymous—fold and drop in the 'After Scene' box."  
  - **Transition (1 min):** Reset space; students return to semicircle.  

  #### **Minute 10–17: Actor’s Paradox Exercise (7 min)**  
  - **Goal:** Illustrate the scandal of the actor through contrasting readings.  
  - **Rules:**  
    1. **Select Reader (1 min):** Ask for a volunteer to read four lines (use this passage for emotional rawness and simplicity):  
       > "I open the door and the house is empty.  
       > No chairs, no bed, nowhere to rest.  
       > The children ask when we’ll go home.  
       > I have no answer, and the rain won’t stop."  
    2. **Two Readings (4 min):**  
       - *First Reading:* "Read this as if you’re feeling this grief. Focus on your own emotion."  
       - *Second Reading:* "Now, read it to make *us* feel the grief. Focus on us, not your own feelings."  
       *Why these lines?* They contain loss, helplessness, and physical vulnerability (Rousseau’s triggers for pity), with simple imagery.  
    3. **Vote and Report (2 min):**  
       - Vote: "Raise hands for which reading moved you more: First or Second?" Tally roughly.  
       - Ask the reader: "Which was easier to sustain? Why?"  
  - **Transition (1 min):** "Now, a different kind of gathering."  

  #### **Minute 17–30: Participatory Condition (13 min)**  
  - **Goal:** Simulate Rousseau’s festival (no stage, no spectators) and surface the dissenter tension.  
  - **Rules:**  
    1. **Setup (2 min):**  
       > "Form a circle. Everyone participates—no one just watches. We’ll share bread/sing together."  
       - Use bread if brought: "Break off a piece, pass it, eat when all have some."  
       - Or sing: Teach one verse of "We Shall Overcome" (public domain, known for collective hope). Lead the group in unison.  
       - *Observer Role:* The assigned dissenter stands outside the circle, silently watching (do not announce this role; let it unfold).  
    2. **Activity (5 min):** Conduct the song/bread-sharing. Keep it simple (2 min for song, 3 min for bread).  
    3. **Address Dissenter (2 min, if needed):**  
       - If students question the Observer, let them react naturally (e.g., "Join us!" or "What’s wrong?").  
       - Observer responds only with: "I just don’t feel like it."  
       - Do not force resolution; let discomfort linger.  
    4. **Pledge Opportunity (2 min):**  
       > "Same pledge as before: tenants' shift or letter. Use a new slip. Fold and drop in the 'After Song' box."  
  - **Transition (1 min):** Collect pledge boxes; students sit for debrief.  

  #### **Minute 30–42: Debrief (12 min—extended to use full time)**  
  - **Structure:**  
    1. **Pledge Results (2 min):** Open boxes and announce counts (e.g., "After the scene: 3 pledges. After the song: 8 pledges."). Do not interpret yet.  
    2. **Reflection Questions (5 min):**  
       - "How did watching the scene feel compared to being in the circle?" (Elicit words: passive, intense but distant vs. united, active.)  
       - "In the scene, you rated high emotion—did that lead to action? Why/why not?"  
       - "In the readings, which moved you more? Reader, what was harder: feeling or performing?"  
       - "How did it feel when one person didn’t join the circle?"  
    3. **Map to Rousseau (5 min):**  
       - **Thesis 1 (Inversion of Catharsis):** "In the scene, you felt pity but had an easy out—applause. The emotion was complete, so it didn’t spur action. Rousseau calls this *sterile pity*: theatre drains passion so we do nothing in real life."  
       - **Thesis 2 (Scandal of the Actor):** "You likely found the *performed* reading more moving. Why? The actor’s skill is in faking emotion. Rousseau says we pay for counterfeiting—something we’d scorn offstage."  
       - **Thesis 3 (Festival Alternative):** "The circle had no stage—you were all performers. Rousseau’s festivals build community this way. But the dissenter? That’s the danger: festivals demand unity, leaving no room for doubt. Theatre, with its distance, allows criticism."  
  - **Distinguish Earned vs. Illustrated:**  
    - **Earned:** The emotion-action gap (pledge counts), the actor’s ease in performing vs. feeling, and the dissenter’s exclusion. These emerged from experience.  
    - **Illustrated:** The festival/theatre structures and Rousseau’s political harm argument. You must explain these.  
  - **What You Must Supply (Final 3 min):**  
    > "Rousseau isn’t talking about one afternoon. He means *mores*: habits of heart formed over generations in a small republic. The deeper harm isn’t bad plays—it’s the division into actors and spectators itself. It trains us for inequality. And the festivals? They’re staged by a *legislator* who shapes society, just as I staged this exercise. That’s powerful but risky—it can silence dissent."  
  - **Handle Manipulation Objection:** If a student says, "You manipulated us!" respond:  
    > "Exactly. Rousseau’s legislator *does* manipulate—to shape a people’s character. But is that justified? The dissenter shows the cost. We must ask: when does unity become coercion?"  

  ---

  ### What the Exercise Cannot Do
  - **Timeframe:** It cannot replicate Rousseau’s emphasis on *long-term mores*. Students experience a snapshot, not generational socialization.  
  - **Scale/Context:** It cannot model a *small republic* (e.g., Geneva) where shared values are ingrained. A classroom of 18 is artificial.  
  - **Political Harm:** It illustrates but cannot prove that actor/spectator division entrenches *political inequality*. You must argue this.  
  - **Catharsis Nuance:** Aristotle’s original catharsis (purgation leading to action) vs. Rousseau’s inversion (discharge preventing action) requires your explanation.  
  - **Festival Ideal:** The exercise shows unity but cannot demonstrate how festivals build *lasting civic virtue* without becoming oppressive.  

  ---

  ### Predictable Problems and Solutions  
  1. **Bad Acting in Spectacle:**  
     - *Risk:* Low emotion ratings → no pity to contrast with action.  
     - *Solution:* Choose volunteers who are comfortable. If ratings are low, say: "Even if unmoved, did you feel *relieved* applause ended it?" Link to Rousseau: theatre’s sterility lies in its finality.  

  2. **Guessing the Hypothesis:**  
     - *Risk:* Students "perform" high emotion or pledges to "help" the experiment.  
     - *Solution:* In debrief, admit: "Some may have guessed Rousseau’s point. But in life, we often know theatre is ‘just a show’—does that change its effect?"  

  3. **Low Pledge Counts/Noise:**  
     - *Risk:* Few pledges (e.g., 0 vs. 1) or duplicates (same person pledging twice).  
     - *Solution:* Report raw numbers neutrally. Focus on *why*: "Even if pledges were low, did the *gap* between feeling and action feel real?" Normalize noise: "Rousseau knew real action is hard—that’s his point."  

  4. **Contamination Between Conditions:**  
     - *Risk:* Song influences scene pledges (or vice versa).  
     - *Solution:* Use separate pledge boxes and emphasize "now" in each opportunity. In debrief, note: "We did these back-to-back, but Rousseau sees them as *rival social forms*."  

  5. **Dissenter Backlash:**  
     - *Risk:* Students pressure or ostracize the Observer, creating real tension.  
     - *Solution:* Briefly intervene: "Let’s notice this reaction—what does it say about group dynamics?" In debrief, validate: "Rousseau’s festivals risk this. Distance in theatre protects dissenters."  

  6. **Time Shortfalls:**  
     - *Risk:* Actor exercise or song runs long.  
     - *Solution:* Trim readings to 30 seconds each or skip bread. Prioritize debrief—cut reflection questions if needed.  

  **Final Tip:** Rehearse timings alone. Assign roles early. Stay neutral during activities—your role is facilitator, not interpreter. The power is in the students’ lived contrast between spectacle and participation.
