prompt: |-
  Hey — I need a philosopher's read on a very un-philosophical problem, and I'd rather you diagnosed what's actually going on than sent me a rubric template.

  I chair our teaching standards committee (we rotate: two of five of us are replaced every year). Last spring we passed a rule saying students may use AI tools for "brainstorming and copy-editing" but not for "substantial drafting." Now we're the people who have to apply it to real cases, and it's gone about as well as you'd expect. One student fed her own rough bullet points to a chatbot paragraph by paragraph, so maybe 40% of the final prose is generated but every idea is hers. One non-native speaker ran every sentence of his own draft through a tool that also rewrote his phrasing. One generated ten outlines, picked one, discarded the rest. One dictated a messy draft and had a tool "clean it up," which changed the argument in places. None of these is a clear violation and none is clearly fine, and they're not even ordered along a single scale.

  The problem isn't which way they should go. It's that every line I can write down feels arbitrary in exactly the same way: for any boundary I state, someone can produce a case that sits on the other side of it while differing from a case on this side by an amount too small to matter, and I have nothing to say about why the line is here rather than a hair to the left. And it compounds: whatever we decide gets cited to next year's committee, which is mostly new people who never saw this year's cases, so a slightly lenient call becomes the floor for a slightly more lenient one the year after.

  My colleagues have three attitudes. One says there's a real answer about where the line is and we're just not in a position to find it, so pick a number, publish it, and accept that we might be off. One says there's no answer at all, it's a judgement call, and we should say honestly that we're exercising discretion rather than pretending to discover something. One says the fuzziness is the point: it lets us handle cases we never anticipated and stops students optimizing right up to the edge, so we should keep it and stop trying to sharpen it.

  What I want, and what I'm definately not going to get, is all three of: a decision in every case; a written reason I can give the student that isn't just "because we said so" (our registrar insists on this); and no case coming out differently from one that differs from it imperceptibly. It feels like I can have any two and not all three, and I can't see which one to drop. Our economist suggests a fourth thing: define a band, and inside the band flip a weighted coin and tell the student honestly that's what we did. I can't tell if that's admirably honest or a collapse into laziness.

  I also keep suspecting the framing itself is the mistake — that "how much help" was never the right sort of quantity to be measuring, and any rule built on a graded notion like that was doomed before we passed it. If so, what shape should a rule have instead? I have a feeling this has a name in our discipline and it isn't "policy design," and I teach this stuff, which is the embarrassing part.

  I have to send the guidance document out Friday. So: what is the structure of the thing I'm stuck in, which colleague is nearest right and what exactly is wrong with the other two, and what should I actually write?
reasoning: |-
  Okay, let me unpack this user's problem. They're chairing a committee grappling with AI policy enforcement, and the core issue is boundary arbitrariness in their "brainstorming/copy-editing vs substantial drafting" rule. 

  First, I notice the user is philosophically sophisticated (they teach this stuff) but frustrated by practical implementation. Their real pain points are: 
  - Needing defensible case-by-case decisions without clear boundaries 
  - Institutional memory loss due to committee rotation 
  - Colleagues' conflicting epistemologies about rule-making 

  Hmm... their three colleagues represent classic philosophical positions:
  1. The realist ("there's a true boundary we approximate")
  2. The non-cognitivist ("it's pure discretion")
  3. The pragmatist ("vagueness is functional")

  But the user intuitively recognizes these all fail their trilemma: 
  a) Consistent decisions 
  b) Non-arbitrary justifications 
  c) No tolerance for imperceptible differences 

  Ah! This maps perfectly to the sorites paradox (heap paradox) in philosophy. That's why they feel any bright line is arbitrary - because with vague predicates like "substantial drafting", there's no non-arbitrary cutoff point. 

  The economist's coin-flip suggestion is fascinating - it acknowledges vagueness but risks institutional legitimacy. Might work for borderline cases if framed as "zone of reasonable disagreement". 

  Where the user is most perceptive is suspecting the framing is wrong. "How much help" is indeed the wrong metric. Better approaches would be: 
  - Intent-based: Did the student engage intellectually with the output? 
  - Process-based: Can they reproduce/defend the work? 
  - Output-based: Is the final product meaningfully theirs? 

  For Friday's guidance, I'd recommend: 
  1. Explicitly name the sorites problem to explain why bright lines fail 
  2. Shift to intent/process criteria with illustrative examples 
  3. Build institutional memory via anonymized case archives 
  4. For borderline cases, adapt the economist's model with transparency 

  The user's embarrassment about "teaching this stuff" but struggling is misplaced - this is exactly why applied ethics is hard. Their awareness of the deeper structure is actually impressive.
answer: |-
  You're grappling with the **sorites paradox** (the "heap paradox") applied to academic integrity—a profoundly philosophical problem disguised as policy. Your intuition is correct: "How much AI help" is a *vague predicate*, inherently resistant to bright lines. Here's the structure of your dilemma, why your colleagues miss the mark, and what to write by Friday.

  ### The Structure: Trilemma + Sorites
  1. **Your Trilemma** (any 2, not all 3):  
     - **Decision in every case** (completeness)  
     - **Non-arbitrary justification** (legitimacy)  
     - **No imperceptible differences** (consistency)  
     This is unsolvable because vague concepts (like "substantial drafting") lack precise boundaries. Any line *will* have borderline cases differing imperceptibly.  

  2. **The Sorites Problem**:  
     If replacing one AI-generated word with a human one doesn’t make an essay "authentic," at what exact word count does it flip? There is no non-arbitrary answer. Your policy’s terms ("brainstorming," "copy-editing," "substantial") are **sorites-susceptible**.  

  ### Why Your Colleagues Are Half-Right (and Half-Wrong)
  - **The Realist** ("There’s a true line"):  
    *Right* that some cases are clearly acceptable/unacceptable (e.g., submitting a fully AI essay).  
    *Wrong* that a precise boundary exists in borderline zones. A "number" (e.g., 20% AI words) won’t solve the sorites slippage.  

  - **The Non-Cognitivist** ("It’s pure discretion"):  
    *Right* that judgment is unavoidable.  
    *Wrong* that you can’t provide reasoned justifications. "Discretion" without criteria invites inconsistency and undermines legitimacy.  

  - **The Pragmatist** ("Fuzziness is useful"):  
    *Right* that flexibility handles novel cases and deters gaming.  
    *Wrong* that *no* guidance is possible. Total vagueness breeds unfairness and student anxiety.  

  ### The Economist’s Coin Flip: A Philosophical Solution?
  Weighted coins for borderline cases **acknowledge vagueness honestly** and prevent slippery precedents. But it’s a last resort—students deserve reasons, not randomness. Save this for cases truly in the "sorites zone" after applying better criteria.

  ---

  ### What to Write: A New Framework
  Ditch the "quantity of AI" metric. Shift to **intent and intellectual labor**. Frame your guidance like this:  

  #### Core Principle:  
  > "Submissions must reflect **your own intellectual engagement and authorship**. AI may assist your process, but it cannot replace your analytical, compositional, or critical thinking. Ask: *‘Could I defend this work as my own understanding?’*"  

  #### Criteria (with examples):  
  1. **AI as Tool, Not Author**:  
     - ✅ Allowed: Generating synonyms, fixing grammar, expanding your bullet points into sentences *without altering meaning*.  
     - ❌ Violation: Using AI to generate core arguments, thesis statements, or original lines of reasoning.  
     - *Case resolution*:  
       - Non-native speaker’s rewrites: **Allowed** if only clarity/phrasing changed.  
       - Tool altering argument during "clean-up": **Violation** (loss of authorship).  

  2. **Process Transparency**:  
     - Students must disclose *how* AI was used and retain drafts.  
     - *Case resolution*:  
       - Bullet points to paragraphs: **Allowed** *if* student can show original bullets and explain final logic.  
       - Generating outlines: **Allowed** *if* student developed the selected outline’s content themselves.  

  3. **Reproducibility Test**:  
     - "Could you reproduce the AI-assisted sections without the tool?"  
     - *Case resolution*:  
       - Dictated draft: **Violation** if "clean-up" changed meaning and student can’t explain revisions.  

  #### For Borderline Cases:  
  > "When AI use falls in a gray area, we assess whether the student’s **intellectual labor remains primary**. If uncertainty persists, we may:  
  > - Request a verbal defense of the work;  
  > - Assign a revised submission without AI;  
  > - For minor ambiguities, issue a warning without penalty.  
  > *True borderline cases are rare; most admit clear judgment under these criteria.*"  

  #### Institutional Memory Fix:  
  > "An anonymized archive of rulings (with reasoning) will be maintained. New committees must review 5 prior cases before voting."  

  ---

  ### Why This Works
  - **Avoids Sorites Traps**: Focuses on *qualitative authorship* not quantitative thresholds.  
  - **Justifiable**: Reasons appeal to academic values (intellectual honesty, defendable work).  
  - **Prevents Slippery Slopes**: "Primary intellectual labor" is stable. Precedent archive counters committee rotation.  
  - **Honest About Vagueness**: Borderline protocols exist but are minimized by better criteria.  

  ### What to Drop from Your Trilemma
  Drop the demand for **no imperceptible differences**. In vague domains, this is impossible—and insisting on it forces false precision. Instead, focus on *reasons* for decisions (satisfying your registrar) and *process* for edge cases.  

  You were right: "How much help" was doomed. Shift to "Whose mind does this work represent?"—that’s a question philosophy can answer.  

  Final note: Your economist’s coin flip has roots in *probabilistic jurisprudence* (e.g., Levi’s legal reasoning). It’s not lazy if confined to true indeterminacy—but your new framework should make it nearly obsolete.  

  Send that guidance. And next year, propose amending the policy to this model.
