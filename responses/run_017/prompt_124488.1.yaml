prompt: |-
  My wife got her citizenship in March — fourteen years, two lawyers, one interview that got rescheduled twice because of a snowstorm — and now the county clerk's office has asked me to give the little speech to the new citizens at the ceremony in September. Apparently there's a slot for it, between the high school choir and the oath.

  The room is going to be about 180 new citizens from somewhere around fifty countries, packed into a community college auditorium with their kids and grandparents, plus a federal judge, the mayor, the clerk, and — this is the part I can't stop thinking about — at least thirty people in it who are years away from any status themselves, and maybe two or three who have no status at all. One of them is my mother in law, who came on a tourist visa in 2017 and never went back and can't adjust and is coming anyway because its her daughter. My wife's brother is coming too, and he's spent eleven years in Border Patrol. Her other sister is an immigration lawyer who thinks the whole system is a crime scene. All three of them will be in the same row.

  I've been reading about this stuff since my wife's letter came, mostly because I didn't want to stand up there and say something stupid. The thing I keep coming back to isn't really the open borders argument itself but a distinction underneath it: there's letting someone be here — hospitality, a guest in your house, temporary, conditional, you set the terms and the door stays yours — and there's membership, which seems different in kind, because a member doesn't only get to be in the room, they get to say how the room should be run, including saying that the door should have been open the whole time. And what I noticed is that basically every one of these speeches is written in the first register by accident. All the welcoming language is host language; it quietly keeps the door in the host's hand and it asks the people sitting in front of you to be grateful guests on the day they stopped being guests. But then the flip side: if I actually talk to them as members, I have to grant that they now have standing to tell the rest of us we're wrong about the border, which is a strange thing to say into a room that has my brother in law in it and a judge who has to stand up right after me and swear them in.

  So: four or five minutes, short plain sentences, since a third of the room will be hearing it through a whisper translation or not really hearing it. No nation-of-immigrans line, no melting pot, no quotes from anybody, no naming philosophers, no lecture, and nothing that makes my mother in law's being there sound like a favor we're doing her or like a crime. It also can't be a protest speech — it's my wife's afternoon, she waited fourteen years, I want her to enjoy it. But I don't want mush either. And I'd rather the thing never leaned on the word welcome at all, unless you can make it earn its keep.

  Can you write it?
reasoning: |-
  Okay, the user needs a speech for a citizenship ceremony. Let me start by understanding their core dilemma. They want to avoid the typical "welcome" language that positions the speaker as the host and the new citizens as guests. That approach undermines the idea that these individuals are now full members with the right to shape the country's policies, including immigration.

  The user mentioned key constraints: no clichés like "nation of immigrants" or "melting pot," no quotes, short sentences for translation, and it shouldn't be a protest speech. Also, the family dynamics are complex—undocumented mother-in-law, Border Patrol brother-in-law, immigration lawyer sister. The speech must respect all without alienating anyone or making the mother-in-law's presence seem like a favor or crime.

  The deeper need here is balance. The user wants the new citizens to feel empowered as equals, not guests. They need to acknowledge the contentious immigration system without turning the event political. The speech should celebrate the achievement while subtly affirming the new citizens' right to critique the system. 

  I should focus on membership and agency. Highlighting the new responsibilities and rights they gain. Using "we" to include them in the collective voice. Avoiding "welcome" unless redefined as mutual acknowledgment. Structure: start with the significance of the day, transition to the legal and moral meaning of citizenship, emphasize their voice in democracy, and conclude with shared commitment.

  Also, considering the audience's diversity and translation needs, sentences must be clear and concise. Mentioning the presence of family and friends humanizes the speech without delving into personal drama. Ending on a note of collective responsibility ties it all together without controversy. Need to ensure the tone is respectful, inclusive, and forward-looking, aligning with the ceremony's solemnity yet making the new citizens feel truly part of the nation's fabric.
answer: |-
  Here’s a draft that honors the weight of the moment, centers membership over hospitality, avoids clichés, and navigates your family’s realities with grace. It uses simple language and short sentences:

  ---

  **Citizenship Ceremony Speech**

  **(Approx. 4 minutes)**

  ---

  Good afternoon.

  Today is a day of papers becoming real.  
  Your certificate is not just a document.  
  It is a key.  
  You have unlocked something fundamental: **membership**.

  For some, the journey to this auditorium was short.  
  For others, it took years. Decades.  
  You carried hopes. You faced delays. You did hard things.  
  You are here.  
  That perseverance matters.

  But today is about what happens *next*.  
  What this key opens.

  It opens the right to be heard.  
  Not as a visitor asking permission.  
  But as a member. A full member.  
  You belong to this place now.  
  And this place belongs to you, too.

  That means you have a voice.  
  In your neighborhood. In your city. In this nation.  
  You have the right to speak.  
  You have the right to be listened to.  
  You have the right to help decide how things work.  
  Even the hard things. *Especially* the hard things.

  This room is full of courage.  
  Courage that brought people here from far away.  
  Courage that sits beside you today – family, friends.  
  People who supported you. People who love you.  
  Their presence is a gift. We see them. We honor their part in your story.  
  *(This acknowledges your mother-in-law and others without labeling or judgment, focusing on their supportive role)*

  Membership is not a finish line.  
  It is a starting line.  
  It is the beginning of your full participation.

  Today, you gain new responsibilities.  
  To learn. To vote. To serve on a jury if called.  
  To contribute your skills. Your perspective. Your story.  
  To help build the place you now help own.

  This country is not perfect.  
  It is a project. Always being built.  
  You are builders now.  
  Your hands are on the tools.  
  Your voice is in the conversation.

  So, this is not about “welcoming” you *in*.  
  It is about recognizing you are now *of* this place.  
  It is about saying: **The table is yours. The work is ours. Together.**

  Congratulations on this profound step.  
  We are glad you are here.  
  We are glad you are staying.  
  We are glad you are **one of us**.

  Now, let’s build.

  ---

  **Why this works for your specific situation:**

  1.  **Avoids "Welcome" as Host Language:** It explicitly reframes the moment: "This is not about ‘welcoming’ you *in*. It is about recognizing you are now *of* this place." The emphasis is on belonging and ownership, not entry granted.
  2.  **Centers Membership & Agency:** "Member," "belong," "voice," "decide," "build," "builders," "tools," "conversation," "responsibilities," "help own" – these words constantly reinforce their new status and power.
  3.  **Acknowledges the Journey & Support:** Recognizes the struggle, the time, and crucially, *the supporters* ("People who supported you... We see them. We honor their part") in a way that dignifies everyone present without specifying status or creating tension. It's inclusive and neutral.
  4.  **Addresses the System (Subtly):** "You faced delays." "Even the hard things. *Especially* the hard things." "This country is not perfect. It is a project." "Your voice is in the conversation." This grants them standing to critique the system without being a direct attack. Your brother-in-law and the judge hear an affirmation of democratic process, not a condemnation.
  5.  **Empowering, Not Mushy:** "The table is yours. The work is ours. Together." "You are builders now." This is strong, active language. It avoids sentimentality and focuses on shared responsibility and contribution.
  6.  **Plain Language & Short Sentences:** Easy to follow and translate. No jargon, quotes, or complex metaphors.
  7.  **Honors the Occasion for Your Wife:** It’s celebratory ("profound step," "Congratulations," "We are glad you are here") and focuses on the achievement and future, making it a positive moment for her.
  8.  **"Nation of Immigrants"/"Melting Pot" Avoided:** Focuses on the present action of building and belonging, not historical tropes.
  9.  **Ends on Forward Momentum:** "Now, let’s build." – A simple, active call that unites everyone in the ongoing project of the nation.

  **Delivery Tip:** Speak slowly, clearly, and warmly. Make eye contact around the room. Pause slightly after key lines like "You belong to this place now. And this place belongs to you, too," and "The table is yours. The work is ours. Together." This lets the weight of those ideas sink in, especially for those needing translation.

  This speech respects the complexity in the room – your family, the diverse paths, the unspoken tensions – while firmly placing the new citizens exactly where they now stand: as full members with a voice and a stake in the future. Good luck! It’s a profound honor to speak at such a moment.
