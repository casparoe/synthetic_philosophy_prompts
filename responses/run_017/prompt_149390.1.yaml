prompt: |-
  I write fiction for a living, and I'm drafting a novel in which two characters argue about which markets the law should shut down. I want their disagreement to turn on a distinction that would actually survive being argued with, so I've been collecting my own gut verdicts on a batch of cases and trying to see what they add up to. Here they are, with the verdicts I keep landing on:

  A living person sells a kidney to the highest bidder — no, and I'd keep it banned.

  The same kidney sale, except that the price is fixed by statute and the recipient is drawn by lottery from the waiting list — still no, but my recoil is much weaker, and I can't say why, since the same organ, the same surgery, and the same money are involved.

  Selling one's corneas, to be taken after death, the fee paid to one's estate — fine; no recoil at all.

  Paid surrogacy under an enforceable contract — permissible, though uneasy. This is the pair I can't reconcile: it seems to me to involve exactly what the kidney case involves, namely the state eventually backing a claim over a living person's body, yet I judge the two differently.

  Selling eggs for IVF — fine.

  Two hundred dollars for a vote — no; a crime, and I think rightly so. Yet paying people a modest sum for the time it takes to register and vote, with no condition on how they vote, strikes me as fine, and I know the two are hard to tell apart in their effects.

  Eighty dollars for a case of bottled water after a hurricane — no; I'd prohibit it, and the argument that high prices draw in supply doesn't move me. Eighty dollars for the same case at a desert music festival — also no, but markedly less bad.

  A thriller I'm commissioned to write for a defense contractor that supplies plot points and holds a veto over how its drone operators are portrayed — not fine. A novel commissioned by a hotel chain that leaves me full editorial control — fine.

  A fee to put my name on a novel I did not write — not fine, and worse than writing a novel that carries someone else's name, which is fine.

  And the case I find worst of all: a buyer who pays a premium not for the organ but for the seller's willingness — for the meeting, the thanks, the fact that the seller was willing at all. Nothing extra changes hands and no extra coercion is involved, yet this strikes me as worse than the plain sale.

  Is there one principle, or a small set, that gets all of these or nearly all? I'd like it stated precisely enough to argue with, with the case that motivates each clause. I especially want to know where you think the repugnance actually lives — in what is transferred, in what the transaction expresses to others, or in what the state would have to do to enforce it — because only one of those can be shown on the page, and I need to know which of my verdicts I'd be sacrificing if I built the argument around it. Tell me honestly which verdicts your principle cannot accommodate, and whether you'd have me drop them or bend the principle to keep them. Then give me its verdicts on two cases I haven't settled: a publisher paying my estate for the right, after my death, to produce new novels in which my characters appear, generated by a model trained on my work; and a state monopsony that is the only legal buyer of kidneys, paying a fixed sum, with no resale and no contact between buyer and seller.

  Please answer in American English.
reasoning: |-
  Okay, the user is a fiction writer working on a novel where characters debate market regulations. They've listed several scenarios with their gut reactions and need a coherent principle to justify these intuitions. Let me start by breaking down each case they provided to find common threads.

  First, the kidney sale: outright ban, even with fixed price and lottery. But selling corneas after death is fine. Why the difference? Probably because the body part is taken post-mortem. Surrogacy makes them uneasy but permissible, unlike kidneys. Eggs for IVF are fine. Voting for money is a no, but compensating for time to vote is okay. Price gouging after a disaster is bad, but at a festival less so. Writing for a defense contractor with veto power is unacceptable, but a hotel chain with editorial control is fine. Ghostwriting under someone else's name is okay, but putting your name on someone else's work isn't. The worst case is paying extra for the seller's willingness in organ sales.

  The key distinctions seem to revolve around consent, commodification of the self, and state enforcement. The user needs to know where the "repugnance" lies: in the transfer, the transaction's expression, or state enforcement. They also need analysis on two new cases: posthumous AI-generated novels and state monopsony for kidneys.

  Looking deeper, the user likely wants their characters' debate to feel authentic, so the principle must hold up under scrutiny. They might also be exploring themes of autonomy, exploitation, and societal values. The unspoken need is for a framework that not only explains their intuitions but also adds depth to the story's conflict.

  The Principle of Non-Commodification seems promising. It distinguishes between commodities and non-commodities, focusing on whether the transaction reduces intrinsic personal value. For kidneys, the sale commodifies the body, while corneas after death don't. Surrogacy involves ongoing bodily autonomy, making it permissible but uneasy. Voting's sacred status means direct payment commodifies it, but compensating time doesn't. Price gouging exploits vulnerability, hence worse in disasters. Artistic integrity is compromised when the client controls content, but not if the artist retains control. Misattribution commodifies identity, which is worse than ghostwriting.

  This principle covers most cases. The exceptions: surrogacy's unease might stem from potential coercion, which the principle addresses indirectly. The defense contractor case fits as commodification of creative voice. The new cases: AI-generated novels might commodify the author's legacy, so problematic. State monopsony for kidneys avoids personal commodification by anonymizing the transaction, so permissible under the principle.

  The repugnance mainly lives in what the transaction expresses—commodifying sacred things—and what the state enforces. Sacrificing the surrogacy unease might be necessary, but the principle mostly holds. For the novel, focusing on transactional expressions (what it communicates) would work best on the page.
answer: |-
  Here's a principle built on your intuitions, designed to be argued with and traceable to your cases. It focuses on **what is being transferred and the nature of the consent required**, specifically whether the transaction commodifies something intrinsically personal or sacred, especially *irrevocably* or in a way that fundamentally alters the person's relationship to themselves or society:

  **The Principle of Non-Commodification:**
  1.  **Core Prohibition:** Markets are impermissible when they involve the transfer of **inalienable aspects of personhood** or **sacred social functions**, where the transaction itself expresses or creates an unacceptable reduction of the person or function to a mere commodity.
  2.  **Key Factors Elevating Repugnance:**
      *   **(a) Irrevocability:** The transfer involves something inherently personal that cannot be taken back (e.g., a vital organ, a vote cast, an irrevocable act of identity like authorship misattribution).
      *   **(b) Bodily Integrity/Sovereignty Under Duress:** Consent is compromised by immediate, severe physical need, vulnerability, or systemic inequality, making the transaction exploitative rather than freely chosen.
      *   **(c) Expression of Degradation:** The transaction inherently expresses a degrading message about the person or the thing being traded (e.g., paying for willingness itself implies the seller's dignity is for sale).
      *   **(d) State Enforcement of Alienation:** The state enforcing the contract requires it to actively coerce the fulfillment of an obligation involving an inalienable aspect (e.g., forcing specific performance of surrogacy or organ delivery against the person's will).

  **Applying the Principle to Your Cases:**

  1.  **Living Kidney Sale (Bidder):** **No.** Violates (1) Inalienable Aspect (bodily integrity/vital organ), (2a) Irrevocable, (2b) High risk of duress/exploitation, (2c) Expression of degrading commodification. **(Motivates Core Prohibition, 2a, 2b, 2c)**
  2.  **Living Kidney Sale (Fixed Price, Lottery):** **No (Weaker Recoil).** Still violates (1), (2a), (2c). Reduced recoil because (2b) is mitigated (fixed price/lottery reduces *some* exploitation risk and bidding frenzy), but core commodification (1, 2c) and irrevocability (2a) remain. The *expression* of commodifying a vital organ is still present. **(Shows mitigation of 2b doesn't overcome 1, 2a, 2c)**
  3.  **Corneas After Death:** **Fine.** Does not violate (1). The "person" is gone; the body is a remnant. No irrevocable loss *to the living person*. No duress (2b). Expression (2c) is about disposition of remains, not commodifying a living person's essence. **(Contrasts with 1 & 2 on Irrevocability (2a) and Nature of the Thing (1))**
  4.  **Paid Surrogacy (Enforceable Contract):** **Permissible (Uneasy).** Uneasy because it *approaches* (1) (using one's body/reproductive capacity) and involves (2d) State Enforcement of Alienation (forcing specific performance of pregnancy/relinquishment is deeply problematic). Why permissible? Surrogacy involves a *service* (gestation) resulting in a *new life*, not the sale of an *inalienable part of oneself* irrevocably. The *potential* for (2b) Duress exists, but ethical frameworks aim to mitigate this. The unease stems largely from (2d). **(Highlights the tension around 2d - State Enforcement)**
  5.  **Selling Eggs for IVF:** **Fine.** Similar to surrogacy but less uneasy. Involves gametes, not an irrevocable part of the core body *or* an ongoing service under potential state coercion (2d). Less associated with core personhood than a vital organ. **(Contrasts with Kidney on Irrevocability (2a) and Nature of Thing (1))**
  6.  **$200 for a Vote:** **No.** Violates (1) Sacred Social Function (vote), (2a) Irrevocable (once cast), (2c) Expression of degrading democracy (vote as commodity). **(Motivates Core Prohibition applied to Social Functions, 2a, 2c)**
  7.  **Pay for Voting Time (No Condition):** **Fine.** Does not violate (1). Compensates time/lost wages, a fungible commodity, not the sacred act of voting itself. Does not express (2c) that the vote is for sale. **(Contrasts with 6 on What is Transferred - time vs. vote)**
  8.  **$80 Water Post-Hurricane:** **No.** Violates (2b) Bodily Integrity/Sovereignty Under Duress (exploiting desperate need for survival). While water is a commodity, the *context* creates an impermissible market due to extreme vulnerability. **(Motivates 2b - Exploitation in Vulnerability)**
  9.  **$80 Water at Desert Festival:** **No (Less Bad).** Violates norms but less severely. Context matters: attendees chose to be there, prepared (or *could* have) for expense. Duress (2b) is significantly lower (inconvenience vs. survival). Repugnance stems from perceived unfairness/greed, not core exploitation of vulnerability. Still often prohibited as "unconscionable" but less morally repugnant under this principle. **(Highlights Context for 2b)**
  10. **Thriller for Defense Contractor (Veto):** **Not Fine.** Violates (1) Inalienable Aspect (artistic integrity/voice), (2c) Expression of degrading art into pure propaganda/PR (commodifying creative expression). The veto power means *they* control the expression, not you. **(Motivates 1 applied to Creative Expression, 2c)**
  11. **Novel for Hotel Chain (Editorial Control):** **Fine.** Does not violate (1). You retain artistic control; it's a commission for a service (writing) you perform with your skills. The subject matter doesn't inherently commodify your *voice* if you control it. **(Contrasts with 10 on Control/Expression (2c))**
  12. **Fee for Name on Unwritten Novel:** **Not Fine (Worse).** Violates (1) Inalienable Aspect (identity/authenticity as author), (2a) Irrevocable (public attribution is permanent), (2c) Profoundly degrading expression (selling your name/reputation as a hollow brand). **(Motivates 1, 2a, 2c - Identity as Inalienable)**
  13. **Ghostwriting (Your Work, Their Name):** **Fine.** Does not violate (1) *for you*. You are selling a writing service anonymously. The *buyer* might be violating (1) and (2c) *if* they falsely claim authorship, but *your* act is providing a service. **(Contrasts with 12 on Who is Commodifying What - service vs. identity)**
  14. **Premium for Willingness (Organ):** **Worst.** Violates (1), (2a), (2b), and **especially (2c)**. It explicitly commodifies the *person's dignity, gratitude, and moral agency itself*. The transaction expresses that even the *willingness* to sacrifice part of oneself for another is a purchasable commodity, degrading the core of personhood and altruism. The "nothing extra" *is* the commodification of the person's inner state. **(Motivates 2c as a core source of repugnance - Degrading Expression)**

  **Where the Repugnance Lives:**
  Your intuitions point most strongly to **what the transaction expresses to others (and to the participants themselves) - Factor (2c)**. The core revulsion is the *message* sent by the commodification: that kidneys, votes, artistic integrity, or personal dignity are mere objects for trade. This expression degrades the person involved and corrupts the social meaning of the thing being traded. State enforcement (2d) is a *consequence* and amplifier (especially in surrogacy/kidneys), but the initial repugnance stems from the expressive content of the transaction itself. What is transferred (1) defines the *object* of the problematic expression.

  **Sacrificing for the Page:**
  If you build the argument *solely* around **what is transferred (1)**, you might struggle to justify the *strength* of your recoil against the "premium for willingness" (Case 14) compared to the base sale, or the difference between post-hurricane and festival water pricing (Cases 8 & 9). The expressive element (2c) and context of vulnerability (2b) are crucial there.
  If you focus *solely* on **state enforcement (2d)**, you lose the explanation for why selling corneas after death (Case 3) is fine (state enforcement is still involved in property transfer) and why selling your name (Case 12) or the willingness premium (Case 14) are repugnant (state enforcement might not be the primary issue). The *expression* (2c) is key to those.
  **Therefore, the expressive element (2c) is the most powerful to show on the page.** It's about the *meaning* of the transaction within your fictional society. Characters can argue about what message selling kidneys sends about human value, what price-gouging says about community in crisis, or what taking money for a vote does to the idea of citizenship. This is inherently dramatic and philosophical.

  **Accommodating Your Verdicts & Bending:**
  *   **Surrogacy Unease:** This is the hardest fit. The principle *permits* it but explains the unease via (2d) State Enforcement of Alienation (forcing pregnancy/relinquishment). To *fully* match your stronger "permissible but uneasy" vs. the kidney "no", the principle leans on the distinction between selling a *service* (gestation) vs. an *inalienable part* (organ). If your unease feels deeper, you might need to bend the principle slightly to emphasize the *potential* for surrogacy to *approach* commodification of personhood (1) under bad conditions, even if it doesn't inherently cross the line like a kidney sale. **Verdict: Principle accommodates it with unease explained by (2d), but it's the weakest fit. I wouldn't drop your verdict; keep the unease and let the argument hinge on the service vs. body part distinction and the risks of (2b) and (2d).**
  *   **Defense Contractor Veto:** Principle explains it perfectly via (1) and (2c).
  *   **Others:** The principle accommodates your other verdicts well, providing specific reasons (violation of 1, 2a, 2b, 2c, or lack thereof).

  **New Case Verdicts:**

  1.  **Publisher Pays Estate for AI-Generated Novels (Your Characters):**
      *   **Principle Verdict: Not Fine.** Violates (1) Inalienable Aspect of Personhood (artistic legacy, creative voice, the unique connection between author and character). It attempts to commodify and mechanize the essence of your creative identity after death. (2a) It creates an irrevocable, false association of your name/legacy with non-you generated content. (2c) The expression is profoundly degrading: it says an author's creative soul is replicable and purchasable, reducing art to algorithmic output. This feels like an extension of Case 12 (selling your name), applied posthumously to your creative essence.
      *   **Your Intuition Hint:** Likely strong recoil, similar to Case 12.

  2.  **State Monopsony for Kidneys (Fixed Price, No Resale, No Contact):**
      *   **Principle Verdict: Permissible (Perhaps Uneasy).** This is designed to *avoid* the core repugnance factors: (2b) It mitigates exploitation by setting a fixed price and being the only buyer (reducing predatory middlemen/coercion). (2c) It drastically reduces the degrading *expression*; it's a clinical, anonymous state program for tissue procurement, framed similarly to compensated donation (like blood), not a market where a person sells their kidney to a rich bidder. The transaction expresses medical need and state provision, not personal commodification. (2d) Enforcement would focus on fraud (e.g., lying about identity/health), not forcing donation. It still involves (1) and (2a) – transferring an inalienable part irrevocably – which causes unease. However, the *context* and *expression* are transformed enough (from market commodification to state-regulated medical procurement) to potentially overcome the prohibition, similar to how the fixed-price/lottery kidney sale reduced your recoil. The anonymity and lack of buyer contact specifically target the repugnance of Case 14.
      *   **Your Intuition Hint:** This might land where your fixed-price/lottery kidney case did – "No, but recoil much weaker," or perhaps even shift to "Permissible, uneasy." The removal of the degrading *expression* (2c) and exploitation (2b) is significant.

  This principle provides a robust foundation for your characters' debate. They can clash over:
  *   What truly constitutes an "inalienable aspect of personhood" or a "sacred social function" (Is gestation one? Is artistic voice?).
  *   Whether context (like disaster vs. festival) fundamentally changes the nature of a transaction.
  *   Whether mitigating exploitation (fixed price, lottery, state monopsony) is enough to overcome the degrading *expression* of commodification.
  *   The role and limits of state enforcement in deeply personal matters.
  The expressive element (2c) gives you the richest vein for dramatic conflict on the page.
