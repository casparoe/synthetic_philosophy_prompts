    Use amplitudes such that the probability is 2/3 and 1/3. Then we can have:

      Coarse: one branch for outcome A (amplitude √2) and one for B (amplitude 1). But then probability of A is (2)/(2+1)=2/3.

      Fine: split the A branch into two branches, each with amplitude 1. And leave B as one branch with amplitude 1. Then the state is:

          |ψ> = 1 |A1> + 1 |A2> + 1 |B>

          norm squared: 1+1+1=3.
          Probability of A: (1^2+1^2)/3 = 2/3.

          If we count branches: two out of three branches are A, so 2/3.

      Fine-grained representation has branches of equal amplitude.

      Now, if we had instead done a different fine-graining:

          Split the A branch into two branches of amplitude 1, and split the B branch into two branches of amplitude 1/√2. But then the norm squared: 1^2+1^2 + (1/√2)^2 *2 = 1+1+0.5+0.5=3.
          Probability of A: (1+1)/3 = 2/3.
          But branch count: two for A and two for B -> 50% for A.

      So in this representation, branch count does not match the probability.

      So we can use this.

    Summary for the game:

      Event: outcome A (probability 2/3) and outcome B (1/3).

      Coarse representation: 
          Branch A: amplitude √2
          Branch B: amplitude 1

      Fine representation 1 (equal amplitude):
          Split into three branches: A1, A2, B. Each with amplitude 1.

      Fine representation 2 (non-equal amplitude):
          Split A into two branches: A1 and A2, each with amplitude 1.
          Split B into two branches: B1 and B2, each with amplitude 1/√2.

      We will have the students experience the coarse representation and then one of the fine representations.

    Given time constraints, we might use only two representations.

    How to simulate:

      We'll have the students work in pairs or small groups. Each group will simulate one original observer.

      For a given representation, the group will create index cards for the branches. On each card, they write the outcome and the amplitude.

      Then, for a bet on A or B, they will determine what happens to each branch.

      We then ask: what is the fraction of branches that see the outcome they bet on?

      In the coarse representation: 
          If bet on A: one branch sees A, one branch sees B. Fraction that see A: 1/2.
          But the probability is 2/3.

      In fine representation 1: 
          If bet on A: two branches see A, one sees B. Fraction: 2/3.

      In fine representation 2:
          If bet on A: two branches see A, two branches see B. Fraction: 1/2.

      So they get different fractions: 1/2, 2/3, 1/2.

      None of these is always 2/3.

      Then they see that branch counting gives different answers depending on the representation.

      The only thing that is invariant is the amplitude squared. In all representations, the amplitude for A is √2, for B is 1, so the probability for A is (2)/(2+1)=2/3.

      So they are led to use the amplitude squared.

    This is the point.

    So in the game:

      - Students set up the branching using index cards for the coarse representation.
      - They place bets.
      - They see the fraction of branches that win is 1/2.
      - Then we have them set up fine representation 1: they see 2/3.
      - Then fine representation 2: they see 1/2.

      - We then ask: which representation is correct? How many branches are there really?
      - They should see that there is no fact of the matter. The branch count depends on how we describe it.

    Then we can discuss: how should the original student decide what to bet? They should use the amplitude to compute the probability.

    Then we can reveal that the probability is 2/3.

    And then we can connect to quantum mechanics.

  ### Phase 5: Second Round: Repeated Trials and Statistics (20 min)

  - Now, we extend to two branchings in a row. We want them to see that in repeated trials, the fraction of branches that see the Born rule statistics is high.

  - We'll use a coin with probability 2/3 for A and 1/3 for B.

  - We have two independent branchings. We use the equal amplitude representation for simplicity (fine representation 1: three branches, two for A and one for B).

  - Each student starts and goes through two branchings.

  - After the first branching, they split into three copies (2 for A, 1 for B). Then each copy goes through a second branching, splitting into three again.

  - So after two branchings, the total number of copies per original student: 3 * 3 = 9.

  - The distribution of outcomes:

      - AA: (2/3)*(2/3) = 4/9 of the branches? Let's count:

          First branching: 
            - 2 branches see A, 1 sees B.

          Second branching:
            - For each A branch: it splits into 2 A and 1 B -> so for the two A branches: 4 AA and 2 AB.
            - For the B branch: it splits into 2 A and 1 B -> 2 BA and 1 BB.

          So outcomes:
            AA: 4
            AB: 2
            BA: 2
            BB: 1

          Total branches: 9.

          The statistics:

            - Number of branches with two A's: 4
            - One A and one B: 2 (AB) + 2 (BA) = 4
            - Two B's: 1

          The relative frequency of A in a branch: 

            - In the 4 AA branches: frequency of A is 2/2 = 1.
            - In the AB branches: one A in two trials: 0.5.
            - In the BA branches: one A in two trials: 0.5.
            - In the BB branches: 0.

          The branches that see a frequency close to 2/3: 
            - The ones that have one A and one B: they see 0.5, which is not 2/3.
            - The ones that have two A's: 1, which is not 2/3.
            - Only the overall average is 2/3.

          But we want branches that see exactly the frequency 2/3. In two trials, the only way to see 2/3 is to have 2/3 of the trials as A? But 2/3 of 2 is not integer.

          In three trials, it would be 2 out of 3.

          So we might do three trials.

          Alternatively, we can note that the branch that sees two A's has a relative frequency of 1, which is not 2/3, but then ask: how many branches see a frequency within a certain range.

          But for simplicity in the classroom, we can count the branches that see exactly the expected number of A's in two trials. The expected number of A's is 2 trials * (2/3) = 4/3 ≈ 1.33. So branches with 1 or 2 A's are close.

          Branches with 1 A: 4 branches (AB and BA) -> they see 1 A in 2 trials: 0.5.
          Branches with 2 A's: 4 branches -> 1.

          None see exactly 2/3.

          In three trials:

            We would have 3^3 = 27 branches.

            Expected number of A's: 3*(2/3)=2.

            Branches with exactly 2 A's: 
              = C(3,2) * (2/3)^2 * (1/3)^1 * 27? No, because the branching is explicit.

            In the tree:

              After three branchings, the number of copies: 27.

              The number of branches with exactly k A's is the number of ways to get k A's in three trials, times the number of branches for each sequence.

              For a sequence with k A's and (3-k) B's, the number of branches is 2^k * 1^(3-k) = 2^k.

              Why? Because in the equal amplitude representation, for each A outcome, there are 2 branches, for B, one branch.

            So:
              For a sequence with k A's and (3-k) B's, the amplitude is (1)^3, because each branching has amplitude 1 per branch? 
              Actually, the amplitude for a specific sequence of outcomes is the product of the amplitudes for each step.

              In our representation, in one branching, the amplitude for a branch that is A is 1, for B is 1? But then the total amplitude for outcome A in one branching is 2, which is not correct.

            Let's clarify the representation:

              In the equal amplitude representation for one branching, we have three branches: two for A, one for B, each with amplitude 1. But then the norm is sqrt(1^2+1^2+1^2)=sqrt(3), so the probability for A is (2) / 3 = 2/3, for B is 1/3.

              The amplitude for a specific branch is 1, but the state vector is:

                  |ψ> = |A1> + |A2> + |B>

              with norm sqrt(3), so the probability for a specific branch is (1^2)/3 = 1/3.

            For a sequence of three trials, the state is the tensor product.

            The number of branches is 3^3=27.

            The number of branches that have a specific sequence, e.g., A then A then B, is 1? But no, because in each trial, we have multiple branches for the same outcome.

            For each trial, we split into three branches. So the total number of branches is 3^3=27, and each branch corresponds to a specific path (A1, A2, or B) at each step.

            Now, the outcome we care about is the number of A's (regardless of which branch in the trial). For example, a branch might have the path: (A1, A1, B) or (A2, A1, B), etc. Both have two A's and one B.

            The number of branches with exactly two A's:

              = number of ways to choose which two trials are A (there are C(3,2)=3 ways) and then for each A trial, there are 2 branches (A1 or A2), and for the B trial, there is 1 branch.

              So for each such sequence (e.g., A in trial 1 and 2, B in trial 3): the number of branches is 2 * 2 * 1 = 4.

              And there are 3 such sequences (depending on which trial is B).

              So total branches with exactly two A's: 3 * 4 = 12.

            Total branches: 27.

            So the fraction of branches that see exactly two A's is 12/27 = 4/9.

            The fraction that see the Born rule probability exactly (2/3) is 4/9.

            But also, the branches that see other frequencies:

              - Three A's: sequences with three A's: C(3,3)=1, and for each A trial, 2 branches, so 2^3=8 branches. Fraction: 8/27.
              - One A: C(3,1)=3 sequences, each with 2^1 * 1^2 = 2 branches, so 3*2=6 branches. Fraction: 6/27=2/9.
              - Zero A's: 1 branch (all B). Fraction: 1/27.

            Now, the branches that see a frequency within one of the expected number (2 out of 3) are the ones with two A's (12 branches) and with three A's (8 branches) and with one A (6 branches) are all within some range? The expected number is 2, so two A's is exact.

            But the relative frequency is k/3. The branches that see k/3 = 2/3 are those with k=2.

            So 12/27 = 44.4% of the branches see exactly the frequency 2/3.

            The branches that see frequency 1 (three A's) are 8/27, and frequency 1/3 (one A) are 6/27, and 0 are 1/27.

            The majority of branches (12+8=20/27) see at least two A's, which is frequency>=2/3.

            But we want them to see that most branches see statistics close to the Born rule. In this case, 12/27 see exactly the Born rule frequency, and others are off.

            We can then note that if we do more trials, the fraction of branches that see a frequency close to 2/3 increases.

    Given time, we might not do the three trials in class, but we can describe it.

  ### Phase 6: Debrief and Connection to Everett (15 min)

  - Map the experience to the quantum mechanics problem.
    - The branching is like the many-worlds interpretation.
    - The branch count is arbitrary: it depends on how we decompose the state vector.
    - The only invariant is the amplitude (and its square).
    - Therefore, probability cannot be defined by branch counting.
    - In repeated trials, most branches (by amplitude-weighted measure?) see statistics close to the Born rule. In our example, we saw that 12/27 branches (unweighted) saw exactly the Born rule frequency. But note: in our branching, all branches had the same amplitude, so the amplitude-weighted count is the same as the branch count. In a general branching, we would weight by the amplitude squared.

  - We then reveal that this is the Born rule problem.

  - The things we couldn't reproduce: 
    - The actual quantum mechanics with complex amplitudes and interference. Our game doesn't have branch merging or interference. We might mention that in Everett, branches don't merge.

  - Predictable problems:
    - The amplitude representation might be confusing. We used real numbers and equal amplitudes in the fine graining for simplicity, but then had to use non-equal amplitudes in another representation.
    - The payoff and branch counting argument might get bogged down in the mechanics of the game.
    - Time: 90 minutes is tight.

  - Timeline adjustment:

    - Introduction: 5 min
    - Game setup and first branching representation: 10 min
    - First round of betting and branching (coarse and two fine representations): 20 min
    - Discussion of branch counting and invariance: 15 min
    - Repeated trials setup and results: 25 min (this might be too long)
    - Debrief: 15 min

    Total: 90 min.

    We might skip the repeated trials in the interest of time, or do it quickly.

  Given the complexity, I recommend focusing on the first part (branch counting and representations) and then briefly sketch the repeated trials.

  We can do the repeated trials as a whole-class activity on the whiteboard.

  Overall, the game should get them to experience the branch counting problem and the need for the Born rule.

