  ### The Case: Archive Discovery  
  In the municipal archives, two clerks are restoring water-damaged boxes from an unsorted collection. Box A contains only a tightly folded, brittle document; Box B holds a small, lumpy object wrapped in disintegrating cloth. Neither item can be safely unwrapped or identified. The head archivist, pointing first at the obscured document in Box A and then at the concealed object in Box B, declares: "Call that *Alpha*," and "Call that *Beta*." The clerks adopt these names immediately. Months later, careful conservation reveals Alpha is a 1787 land deed, while Beta is a clay seal stamped with a merchant’s insignia. Measuring them, the deed is 30cm wide when unfolded; the seal is 5cm in diameter.  

  **Sentence S**: "Alpha is larger than Beta."  

  **Check**:  
  - **Millian Direct Reference (Causal-Historical)**:  
    S expresses a singular proposition: *⟨the deed, the seal, being-larger-than⟩*.  
    - *Modal status*: Necessarily true (assuming essentialism about concrete objects' spatial properties—here, the deed’s width and seal’s diameter in their actual states).  
    - *Epistemic status*: Knowable only a posteriori (measurement was required).  
    Reference is fixed by the initial demonstrative act, with no reliance on descriptions.  

  - **Epistemic Two-Dimensionalism**:  
    S’s primary intension is *object-dependent* due to the bare baptisms: it maps scenarios to truth values *only* if they contain the actual Alpha and Beta.  
    - *Modal status*: S is contingent (primary intension yields false in scenarios where, e.g., Alpha is a smaller object).  
    - *Epistemic status*: A posteriori (but for the wrong reason: ignorance of *which* objects the names pick out).  
    Yet the story stipulates no referential uncertainty (*Specification 3*), so 2Dism misdiagnoses the epistemic ground.  

  **Where Accounts Diverge**:  
  At the link between naming and modality. Millianism secures necessity directly via rigid designation anchored in baptism. 2Dism, lacking descriptive reference-fixers, cannot construct a non-object-dependent primary intension. This forces it to either (a) deny S’s necessity (contradicting Millian verdict + essentialist premise) or (b) concede object-dependence, collapsing primary intensions into singular propositions.  

  **Load-Bearing Feature**:  
  The **bare demonstrative baptism** (*Specification 2*). Without descriptive content, 2Dism cannot ground primary intensions in conceptual or epistemic conditions.  

  **Test: Replace Baptism with Description**:  
  If "Alpha" were introduced as "the document in Box A" (description-backed), 2Dism *can* generate a primary intension (e.g., *the document in Box A is larger than...*). S’s necessity then becomes contingent under primary intension (if Box A contains a smaller document). The a posteriority *now* aligns with ignorance of which object satisfies the description—preserving 2Dism’s standard model. The exotic necessity route vanishes.  

  **Two-Dimensionalist Attack and Response**:  
  - **Attack**: Object that "that" in baptism implies *sortals* (e.g., "physical object"), yielding implicit descriptions ("the object pointed at").  
  - **Rebuttal**: The story blocks this: no sortal was used or implied (*Specification 2*), and the archivist explicitly rejected guesses (e.g., "might be parchment? Metal?"). Attack fails by smuggling in descriptions the case excludes.  

  **Essentialist Premise**:  
  The necessity of *actual spatial properties* bears full weight. If size is contingent (e.g., if objects could shrink), S isn’t necessary. But Kripkean arguments (*Naming and Necessity*) treat such properties as essential to material objects’ identities. Remove this, and the necessity claim fails—but then *no* account delivers a necessary a posteriori truth here.  

  ---
  **Final Output**:  
  **Paragraph**: In the municipal archives... [as above].  
  **S**: "Alpha is larger than Beta."  
  **Check**: [as above].
