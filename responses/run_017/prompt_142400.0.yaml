  ### Analysis and Proposed Principle

  The candidate principle—switch if \(P(\text{smaller} \mid \text{info}) > 1/3\)—fails in multiple cases. It incorrectly prescribes switching in Case 1 (indifference), break-even in Case 4 (desire to switch), and switching in Case 6 (no pull). It also conflicts with Case 3 if the prior distribution disfavors large amounts. The core issue is that the candidate ignores the **absolute amounts** in the envelopes and relies solely on the probability of holding the smaller envelope, without adjusting for the stakes or utility.

  I propose a new principle based on **conditional expected value for linear utility** and **expected utility for nonlinear utility**. This principle evaluates each exchange independently (individual acts, not policies), as sequential offers like Case 6 reset the information state.

  ---

  ### Proposed Principle

  1. **When the envelope is opened and utility is linear**:  
     Switch if the conditional expected value of the other envelope, given the observed amount and prior information, exceeds the observed amount.  
     *Motivated by Cases 2 and 3*: Opening provides data for a meaningful expected-value calculation.

  2. **When the envelope is unopened and utility is linear**:  
     Be indifferent to switching.  
     *Motivated by Cases 1 and 6*: Symmetry implies no expected gain.

  3. **When utility is nonlinear (e.g., logarithmic)**:  
     Switch if the expected utility of the other envelope exceeds the utility of the current envelope.  
     *Motivated by Case 5*: Nonlinear utility changes the decision.

  4. **When given probabilistic bias (unopened)**:  
     Be indifferent to switching, as the expected value of the other envelope equals the current envelope's expected value.  
     *Motivated by Case 4*: Even with bias, no net gain without observing the amount.

  5. **When switching incurs a cost**:  
     Switch only if the expected (value or utility) gain exceeds the cost.  
     *Motivated by practicality and cost sensitivity*.

