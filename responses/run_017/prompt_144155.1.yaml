prompt: |-
  I am part of a working group drafting referee guidelines for evolutionary-biology journals, and we have got stuck at the first step. Before we can say which methods a manuscript should have used, we need to say what a method for adjudicating adaptive hypotheses is supposed to deliver. I would like you to write that specification.

  The object to be specified is a standard that tells a working biologist, faced with a trait in a taxon, what would license the claim that the trait is an adaptation for function F — as against a byproduct, a co-opted structure, a developmental or architectural constraint, or a drift artifact. Its purpose fixes its shape: it will be used by a referee reading a manuscript, so it must be applicable to evidence a manuscript could realistically contain (comparative data, a phylogeny, some ecology, sometimes a functional or optimality analysis, occasionally a selection experiment or a genomic scan), and it must be able to return at least three verdicts — warranted, not warranted, and underdetermined by the evidence in hand — rather than only an invitation to refine the story.

  Give me the desiderata, each with the case or consideration behind it. I have in mind four rough kinds, but revise the partition if it is wrong.

  Cases it must get right, including some clear positives it must not hedge about (lactase persistence in dairying pastoralist populations, with its genomic signature of a recent selective sweep; Darwin's inference from the extraordinary length of a Madagascan orchid's nectar spur that a pollinator with a correspondingly long proboscis must exist, later confirmed), some clear negatives (the tapering triangular panels formed where the arches carrying a dome meet the surrounding vaulting in San Marco: necessarily triangular, necessarily four, elaborately decorated, but not there in order to be decorated), and some genuinely hard ones (the panda's radial sesamoid thumb; the lens crystallins of vertebrate eyes, several of which are ordinary metabolic enzymes such as lactate dehydrogenase and argininosuccinate lyase recruited into a structural role; putative spandrels such as the human chin; the flamingo's inverted feeding posture and its bill).

  Distinctions it must respect rather than collapse: current utility versus historical selection for that utility; adaptation versus exaptation versus spandrel; selection for a trait versus selection of its correlated consequences; an engineering optimum versus what the trait actually does; and the difference between a hypothesis that is untestable with the evidence available and one that is false. Say which of these distinctions is doing the most work.

  Results and practices it must remain consistent with: that adaptive hypotheses have genuine predictive successes; that drift, phylogeny, and developmental constraint are real and sometimes demonstrable; that a selection experiment can establish selection in the present without establishing the historical cause of a trait's origin; that population genetics is not up for renegotiation.

  Constraints on the standard itself: it must be usable from realistically available evidence, which means it cannot simply demand a complete selection history; it must state rather than presuppose where the burden of proof falls and why that placement is not just a default borrowed from one camp; it must have something to say about the literature-level fact that a hypothesis often comes to count as supported because nobody has published a failure to find the effect; and it must be revisable in the light of aggregate evidence rather than insulated from it.

  Two tests, please, and they are the part I care about most. First, apply your list to this constructed case and report which verdict it yields: a clade of 47 described species of burrowing skink, 41 of which carry an expanded bony flange on the skull roof; the six that lack it live in loose sand, the rest in compacted soils, and presence survives phylogenetic correction; the flange distributes load well, and measured flange areas fall within about twelve per cent of the value a mechanical model predicts as optimal for each species; developmentally the flange is a secondary outgrowth of the bone roofing the jaw-adductor chamber, whose volume tracks bite force, which in turn tracks the hardness of the prey each species takes; no fitness measurements exist; no genomic scan has been run; the flange is absent in the fossil outgroups; and in two species females use it in courtship displays. Second: suppose a large consortium reanalysed a model clade with ancient and modern genomes and found that roughly half the traits the literature presents as textbook adaptations show no detectable selection signature at the relevant loci and are better predicted as correlated responses to selection on neighbouring traits. What should the standard recommend in that world, and is your list capable of changing its verdicts in response to it?

  Finally, mark each requirement as non-negotiable or as the preference of a particular camp, and flag any desideratum on your own list that you suspect is really a party prejudice in methodological dress — including any that would quietly beg the question against the adaptationist programme itself. Identify any pair of requirements you believe cannot be jointly satisfied, and say which single requirement excludes the most candidate standards. Close with a brief scorecard, in prose or a table, of no more than four contenders: the comparative method with phylogenetic correction, optimality and engineering modelling, the demand for direct evidence of selection, and a developmental-constraints-first approach. Skip references and reading suggestions; I know the literature. Keep the weight on the criteria and their motivating cases rather than on the scoring.
reasoning: |-
  Okay, the user is part of a working group drafting referee guidelines for evolutionary biology journals. They're stuck at defining what constitutes a method for adjudicating adaptive hypotheses. The specification needs to tell biologists when they can claim a trait is an adaptation for a specific function versus other explanations like byproducts, constraints, or drift.

  The user wants desiderata with cases behind each. They mentioned four rough kinds but are open to revision. The cases include clear positives (lactase persistence, Darwin's orchid), clear negatives (San Marco spandrels), and hard cases (panda's thumb, crystallins, human chin, flamingo posture). The standard must respect distinctions like current utility vs historical selection, adaptation vs exaptation vs spandrel, selection for vs of, engineering optimum vs actual function, and untestable vs false hypotheses. It should also align with established practices while being usable with realistic evidence.

  The constraints are crucial. The standard must work with typical manuscript evidence—comparative data, phylogenies, ecology, functional analyses. It must return clear verdicts: warranted, not warranted, or underdetermined. The burden of proof needs explicit justification, not borrowed from any camp. The standard should address literature-level issues like unpublished negative results and be revisable based on aggregate evidence.

  The tests are vital. First, apply to the burrowing skink case: 41 species have a skull flange linked to soil compactness, phylogenetically corrected, functionally optimal, developmental basis, but no fitness or genomic data. Second, consider a consortium finding that half of "textbook adaptations" show no selection signatures. The standard must adapt to such new evidence.

  For the desiderata, I'll need non-negotiable requirements based on evolutionary theory and negotiable ones that might reflect camp preferences. Key distinctions like historical selection vs current utility are non-negotiable. The burden of proof placement must be explicit, likely leaning against adaptationism by default due to the risk of false positives. The standard must avoid question-begging, like assuming adaptationism is the null hypothesis.

  Testing on the skink case: multiple lines of evidence converge—correlation with environment, phylogenetic correction, functional optimization, developmental link, outgroup absence. Though no direct fitness data, the evidence collectively warrants the adaptation claim. The courtship use in two species might indicate exaptation but doesn't undermine the primary function.

  For the consortium scenario: such findings would necessitate shifting verdicts for affected traits. The standard must accommodate new evidence, moving some cases to "not warranted" or "underdetermined." This highlights the need for revisability, a non-negotiable aspect.

  Contender assessment: Comparative method is necessary but insufficient alone. Optimality modeling supports but doesn't confirm historical selection. Direct evidence (selection experiments, genomics) is strong but often unavailable. Developmental constraints are crucial alternatives. The best approach integrates multiple lines, as no single method suffices.

  Identifying conflicts: The demand for historical evidence vs. practicality is a tension. Requiring direct selection proof might make the standard unusable for many studies. The burden of proof placement is critical; siding against adaptationism by default excludes standards assuming adaptation as the null.

  In essence, the specification must balance rigor with feasibility, require convergence of evidence, explicitly place the burden of proof on adaptation claims, and remain flexible in light of new data. The skink case passes by converging evidence, while the consortium scenario shows the standard must adapt, underscoring revisability as paramount.
answer: |-
  Here is a specification of desiderata for a referee standard adjudicating adaptive hypotheses, structured as requested. The core requirement is **convergent evidence for historical selection for the proposed function**, balanced against realistic evidentiary constraints.

  **Desiderata & Motivating Cases/Considerations:**

  1.  **Non-Negotiable: Must Require Evidence for Historical Selection *for* F (Distinction #1 & #2):** The standard cannot license an adaptation claim based solely on current utility, optimality, or functional adequacy. Evidence must speak to the trait having been *shaped by* selection *because of* F. This distinguishes adaptation from exaptation (co-option), spandrel (non-selected byproduct), constraint, or drift.
      *   *Case:* Panda's thumb: Current utility (grasping bamboo) is clear, but evidence points to it being an exaptation of the radial sesamoid (selected for wrist support/function, not grasping). San Marco spandrels: Decorated triangles have current visual utility, but their form is a necessary architectural byproduct, not selected *for* decoration.
      *   *Key Distinction:* Current Utility vs. Historical Selection for that Utility. This does the **most work** in separating adaptation from alternatives. Adaptation vs. Exaptation/Spandrel is crucial.

  2.  **Non-Negotiable: Must Demand Evidence Against Plausible Non-Adaptive Alternatives:** The standard cannot assume adaptation is the default explanation. Referees must assess if evidence meaningfully distinguishes the adaptive hypothesis from credible alternatives (e.g., drift, phylogenetic inertia, developmental constraint, pleiotropy/correlation, exaptation).
      *   *Case:* Lens crystallins (LDH, ASL): Recruited enzymes are functional for lens transparency *now*, but evidence suggests recruitment was opportunistic (exaptation), driven by high concentration/solubility needs (potentially a constraint/opportunity) rather than selection *for* a novel optical function *ab initio*. Human chin: Proposed adaptive functions (speech, sexual selection?) struggle against the null that it's a developmental spandrel resulting from jaw reduction patterns.
      *   *Key Distinction:* Untestable vs. False. The standard must require the evidence *in the manuscript* to address alternatives, not just assert the adaptive story is plausible. Burden of Proof lies on the adaptation claim.

  3.  **Non-Negotiable: Must Accommodate Multiple, Complementary Lines of Evidence:** No single line of evidence (comparative correlation, phylogeny, optimality, development) is universally sufficient or necessary. The standard must assess the *convergence* and *robustness* of the total evidence presented.
      *   *Case:* Lactase persistence: Converging evidence (population genetics/selective sweep, comparative demography/history, functional biology, fitness consequences). Flamingo bill/feeding: Requires convergence (functional morphology/fluid dynamics, behavioral ecology/diet, comparative anatomy/neurology, phylogenetic distribution) to distinguish adaptation for filter-feeding upside-down from potential constraint or exaptation scenarios.
      *   *Constraint:* Realistically Available Evidence. Manuscripts won't have everything. The standard must judge if the *available combination* is sufficient.

  4.  **Non-Negotiable: Must Be Revisable Based on Aggregate Evidence:** The standard cannot entrench verdicts based solely on initial publication. Its application must allow conclusions to shift as new evidence (population genomic scans, fossil data, developmental genetics, failed replications) accumulates.
      *   *Constraint:* Revisability. This is essential for scientific progress and prevents dogma.
      *   *Literature-level Practice:* The standard must acknowledge that "supported" often means "not convincingly refuted *yet*," not "proven beyond doubt."

  5.  **Negotiable (Potential Camp Preference): Placement of Evidentiary Threshold/Burden:** *How strongly* must alternatives be ruled out? This often reflects methodological camps. Adaptationists might accept strong functional/optimality + comparative evidence as sufficient absent contrary data. Anti-adaptationists might demand near-direct evidence of historical selection (genomic signatures, detailed fitness data) or strong positive evidence *for* an alternative before accepting adaptation.
      *   *Case:* Darwin's orchid: Highly successful prediction based *only* on functional optimality reasoning within a comparative context. Many would accept this as warranting adaptation *without* the later confirmation (though confirmation strengthens it immensely). Critics might argue it only showed current utility until the pollinator was found.
      *   *Burden of Proof:* The standard *must state* that the burden lies on the adaptation claim due to the demonstrable prevalence of non-adaptive explanations for trait form (drift, constraint, exaptation). This placement avoids begging the question against non-adaptationism. *Why not adaptationist default?* Because the null of "no selection for F" encompasses many demonstrably real processes (drift, constraint), while "adaptation for F" is a specific positive claim.

  6.  **Negotiable (Potential Camp Preference): Weight Given to Optimality/Engineering Models:** Some camps view close fit to an engineering optimum as strong *prima facie* evidence for adaptation. Others argue optimality is consistent with constraint ("good enough" is optimal under constraints) or exaptation (a trait recruited for F might coincidentally be optimal).
      *   *Key Distinction:* Engineering Optimum vs. What the Trait Actually Does/Why. Optimality supports utility, not necessarily historical selection *for* that function.
      *   *Potential Question-Begging:* Over-reliance on optimality *might* subtly assume that selection inevitably finds optima, begging the question against critiques of pan-adaptationism or the importance of constraints/historical contingency.

  7.  **Negotiable (Potential Camp Preference): Acceptability of Correlative vs. Direct Evidence:** Camps differ on the sufficiency of strong comparative/phylogenetic correlations versus demanding direct evidence of selection (fitness gradients, selection experiments, genomic signatures).
      *   *Distinction:* Selection *for* vs. Selection *of*. Comparative correlations alone struggle to distinguish direct selection for the trait from selection on a correlated trait.
      *   *Constraint:* Realistically Available Evidence. Direct evidence is often logistically or ethically impossible for many traits/systems. The standard must function without it being ubiquitous.

  **Test Case 1: Burrowing Skink Flange**
  *   **Evidence For Adaptation for Load Distribution:**
      *   Strong comparative correlation: Flange presence/absence tightly linked to soil type (functionally relevant environment) across species.
      *   Phylogenetic correction: Correlation holds after accounting for shared ancestry (reduces chance of spurious correlation due to inertia).
      *   Functional Adequacy/Optimality: Flange functions well mechanically and closely matches predicted optimum (12% deviation is small in biological terms).
      *   Developmental Link: Flange developmentally tied to jaw muscle chamber/bite force, which tracks prey hardness (plausible selective agent).
      *   Outgroup Absence: Suggests derived origin within clade, consistent with novel adaptation.
  *   **Evidence/Caveats:**
      *   No direct fitness measures or genomic selection signatures.
      *   Courtship use in 2 species: Suggests *potential* for exaptation in *some* lineages, but doesn't negate the primary load-distribution function in the clade as a whole. Could be a secondary function or exaptation *after* the flange evolved for load distribution.
      *   Alternative: Could a constraint *require* the flange when bite force/chamber size reaches a threshold in compact soil dwellers? Developmental link makes this plausible, but the specific optimization for load distribution and its absence in loose-sand species (despite likely needing bite force for prey) weakens this alternative.
  *   **Verdict: Warranted.** Multiple lines converge strongly: clear functional link to environment (soil type), phylogenetically corrected association, functional optimization, plausible developmental/selective pathway, derived origin. Absence of direct fitness/genomics is a limitation, but the convergence makes non-adaptive alternatives (drift, constraint alone) less plausible than adaptation for load distribution. Courtship use is likely secondary.

  **Test Case 2: Consortium Reanalysis**
  *   **Recommendation:** The standard *must* recommend shifting verdicts for the affected traits from "warranted" to "not warranted" or "underdetermined". Traits showing no selection signature at relevant loci and better predicted as correlated responses fail the core requirement for evidence of historical selection *for* F. They might be exaptations, spandrels, or results of constraint + drift.
  *   **Capability:** Yes, the list mandates revisability based on aggregate evidence (Desideratum 4) and demands evidence specifically for historical selection *for* F (Desideratum 1). This new evidence directly challenges that core requirement for those traits.

  **Conflicts & Exclusions:**
  1.  **Conflict:** Desideratum 1 (Require Evidence for Historical Selection *for* F) vs. Constraint (Realistically Available Evidence). Direct historical evidence is often unavailable. *Resolution:* Convergence of indirect lines (functional, comparative, phylogenetic, developmental) *can* collectively provide strong evidence *for* historical selection, satisfying D1 without always needing genomics/fossils.
  2.  **Most Excluding Requirement:** Desideratum 2 (Demand Evidence Against Plausible Non-Adaptive Alternatives). This excludes any standard that accepts adaptation claims based solely on current utility or optimality without addressing drift, constraint, or exaptation. It enforces the burden of proof.
  3.  **Potential Question-Begging:** Desideratum 6 (Weight on Optimality) could be a party prejudice if it *assumes* optimality implies adaptation, rather than treating it as one line of evidence needing integration and critical assessment against alternatives. Desideratum 5 (Burden Placement) might be seen as anti-adaptationist by strict adaptationists, but it is justified by the demonstrable existence and importance of non-adaptive processes (D2, Consistency with Results/Practices).

  **Contender Scorecard:**

  | Contender                     | Key Strength                                      | Key Weakness (w.r.t. Desiderata)                              | Verdict Usability |
  | :---------------------------- | :------------------------------------------------ | :------------------------------------------------------------ | :---------------- |
  | **Comparative Method + Phylogeny** | Addresses D2 (alternatives: phylogeny), Essential for correlation evidence (D3). | Weak on D1 (shows correlation, not selection *for* F; confuses selection *for* vs *of*). Cannot establish function alone. | Necessary but insufficient alone. Often yields "underdetermined". |
  | **Optimality/Engineering Modelling** | Directly addresses function/utility (D3). Can make strong predictions. | Weakest on D1 & D2 (shows *current* utility/optimality, not *historical selection for* it; consistent with constraint/exaptation). Risk of question-begging (D6). | Supports adaptation claim but cannot warrant it alone. Helps rule out maladaptation. |
  | **Demand Direct Selection Evidence** | Strongest evidence for D1 (historical selection). Aligns with population genetics. | Fails Constraint (Realistically Available Evidence). Ignores D3 (convergence). Often impossible, rendering standard unusable for most manuscripts. | Leads to excessive "not warranted" or "underdetermined" even for strong convergent cases like the skink. |
  | **Developmental-Constraints-First** | Strong on D2 (provides concrete non-adaptive alternatives). Essential for understanding evolvability. | Weak on D1 (presence of constraint doesn't negate adaptation *within* constraint; doesn't establish selection *for* F). Can downplay functional/selective evidence. | Essential for robust D2 assessment, but insufficient for D1. Risks premature "not warranted". |

  **Conclusion:** No single contender satisfies all desiderata. A **robust standard requires assessing convergence across multiple lines** (comparative/phylogenetic, functional/optimality, developmental, potentially direct evidence if available) to build a case *for* historical selection *for* F (D1, D3) while actively evaluating and ruling out plausible non-adaptive alternatives (D2). The burden of proof rests firmly on the adaptation claim (D5), verdicts must be revisable (D4), and the weight given to optimality (D6) or correlative evidence (D7) must be calibrated against their limitations in establishing historical causation.
