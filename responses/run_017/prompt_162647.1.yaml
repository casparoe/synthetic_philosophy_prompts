    - Prediction by Nadia: If the abstract role is preserved, then pain is preserved in both.

    - Prediction by Tobias: Even if the abstract role is preserved, the realizer's properties matter. If the artificial realizer does not have the right intrinsic properties, the mental state might not be pain. Moreover, across species, the same abstract role might not correspond to the same mental state because the realizers are different. But he cannot deny cross-species ascriptions, so he must allow that in the natural case, the octopus has pain. However, after graft, he might say that the mental state is not pain because the realizer is artificial. But the protocol assumes the subject is conscious and reportable, so for humans, we have reports. For octopus, we infer.

