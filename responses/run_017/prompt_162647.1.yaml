  Additionally, the inheritance crux also has a dialectical part:

  - Can Nadia require that the realizer must have the causal powers to fill the role without conceding that the realizer's powers ground the role? She might say that the realizer must be able to produce the outputs given the inputs, but that is just role occupation. Tobias argues that this ability is grounded in the realizer's intrinsic powers.

  - Can Tobias explain why MR evidence seemed to matter? He can say that it matters for refuting type-identity, but not for refuting his view. But then, if MR is rare, it doesn't threaten identity theory much.

  But for the case, the experimental setup above tests the grounding.

  **Part 4: Closing Audit**

  State which parts are verbal, if any, why, and what would settle whether they are.

  Possible verbal aspects: The term "realization" might be used differently. But the disagreements are substantive because they lead to different predictions in the graft/rewire cases.

  What would settle: The outcome of the experiments in the cruxes. For example, if in the grain crux, non-neural realizers can preserve mental states in all respects, then Tobias's view is challenged. If not, Nadia's is.

  But also, the disagreement about whether MR refutes identity theory might be verbal if they mean different things by "mental kind". For Nadia, mental kinds are role kinds; for Tobias, they are role kinds as realized by particular realizers. So they might not be disagreeing about the world but about definitions. However, the identity theory is about whether mental kinds are identical to neural kinds. Nadia says no; Tobias says no, but for different reasons. Tobias might say that mental kinds are not neural kinds because they are realized kinds, but they are also not role kinds alone. So it's substantive because Tobias's view allows that mental kinds are more fine-grained than role kinds.

  The audit should conclude that the dispute is not merely verbal because it has empirical consequences in the graft/rewire protocol, as laid out in the cruxes.

  Now, let's write the full document.
