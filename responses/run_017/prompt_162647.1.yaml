  **Part 3: Three Cruxes**

  Using the graft/rewire protocol. For each crux: a concrete case, both sides' predictions, and ensure that a surprise would cost one side.

  Crux (a): Grain

  - Issue: How finely must the role be specified? Coarse grain risks including non-mental realizers; fine grain makes MR vanish.

