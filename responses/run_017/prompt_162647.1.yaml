  ### Part 2: Disagreements Table  
  Four-column table: issue, Nadia’s formulation, Tobias’s formulation, and why the disagreement is not merely verbal.  

  | Issue | Nadia’s Formulation | Tobias’s Formulation | Why Not Merely Verbal |  
  |-------|---------------------|----------------------|------------------------|  
  | **Nature of realization** | Realization is the occupation of a causal role by a realizer; the mental kind is determined solely by the role, with the realizer’s intrinsic properties being incidental. | Realization is a constitutive, non-causal relation: the realizer’s intrinsic properties ground the causal powers of the role, making the mental kind inherently tied to its physical basis. | The disagreement is substantive because it affects predictions about graft interventions: Nadia expects mental preservation with any input-output match, while Tobias expects degradation if realizer properties are inadequate. |  
  | **Evidential force of MR** | MR refutes neural identity theory by showing that mental kinds cannot be identical to neural kinds, as different realizers can fill the same role. | MR is evidentially inert: it is empirically rare (when taxonomies are fixed) and compatible with realizationism, as the same role can be multiply realized without implying that mental kinds are role-based alone. | Not verbal because they disagree on whether MR, if actual, undermines identity theory. Nadia sees it as decisive; Tobias sees it as irrelevant to his view, which already denies identity. |  
  | **Grain of functional roles** | The grain of a role is fixed by the causal relations relevant to the mental kind’s explanatory context (e.g., pain as avoidance-promoting); it is independent of realizers. | The grain of a role is constrained by the realizer’s causal capacities; roles cannot be specified more coarsely than what the realizer can intrinsically support. | Substantive because Nadia’s coarse grain allows non-neural realizers (e.g., markets) to count as mental, while Tobias’s realizer-dependent grain excludes them, leading to divergent criteria for mentality. |  
  | **Grounding of causal powers** | The causal powers of a mental state are fully determined by its role; the realizer contributes only by fulfilling the role’s input-output conditions. | The causal powers of a mental state are inherited from the realizer’s intrinsic powers; the role is an abstraction over what the realizer does. | Not verbal because it affects explanations: Nadia attributes system behavior to roles alone, while Tobias attributes it to realizers, altering how graft/rewire outcomes are interpreted. |  

