  ### Adversarial Collaboration Document: Multiple Realizability in the Philosophy of Mind

  **Introduction**  
  This document outlines an adversarial collaboration between Nadia (defending a classical role-functionalist view) and Tobias (defending "realizationism") on the probative force of the multiple-realizability (MR) argument. The goal is to clarify disagreements, identify cruxes, and use the jointly accepted graft/rewire protocol to test predictions. The protocol is defined as follows:  
  - **Graft intervention**: Replaces the neural state type normally filling causal role \( R \) with a structurally different state type from another lineage (e.g., synthetic, cross-species, or non-biological). Inputs to and outputs from \( R \) are preserved, but intrinsic properties differ (e.g., internal structure, metabolic cost, temperature sensitivity). The subject remains conscious and reportable.  
  - **Rewire intervention**: Holds the realizer fixed while altering its upstream/downstream connections, changing \( R \)’s wider functional role. The causal profile within the local channel is preserved, but the role in the system may shift. This can yield a different mental kind (e.g., the same realizer now supports fear instead of pain).  

  The document avoids literature citations and argues from first principles. Constraints: Nadia cannot resolve grain issues by referencing the actual neural realizer's grain; Tobias cannot deny cross-species mental ascriptions.

  ---

  ### Part 1: Agreed Claims  
  At least ten substantive claims, each worded so that a partisan feels "the pinch" of signing it. Nadia would be reluctant to accept (8) and (11); Tobias would be reluctant to accept (5) and (12). Claim (7) defines a "worthwhile" MR case.  

  1. **Mental states are individuated by causal roles**: A mental kind (e.g., pain) is defined by its typical causes (e.g., tissue damage), effects on other mental states (e.g., distress), and behavioral outputs (e.g., withdrawal).  
  2. **Multiple realizability (MR) is conceptually possible**: It is coherent to suppose that two physically distinct realizers could fill the same causal role for a mental kind.  
  3. **Realization requires causal role occupation**: A realizer realizes a mental state only if it is the entity that actually mediates the inputs and outputs of the role.  
  4. **Realizers have intrinsic properties**: The physical state realizing a mental kind has properties (e.g., microstructure, metabolic profile) that are not reducible to its role or input-output relations.  
  5. **Rewire interventions can change mental kinds**: In some cases, holding the realizer fixed but altering its functional embedding (via rewire) changes the mental kind (e.g., from pain to fear), as evidenced by shifts in reports and discriminations.  
  6. **Graft interventions can preserve mental kinds**: In some cases, replacing a realizer with a structurally different one (via graft) preserves the mental kind, leaving the subject conscious and reportably unchanged.  
  7. **A worthwhile MR case requires**:  
     - Two realizers that differ in properties not screened off by input-output relations (e.g., internal structure, material composition, or thermodynamic properties).  
     - Preservation of the mental kind across systems, evidenced by indistinguishable reports, discriminations, and behaviors under equivalent conditions.  
  8. **Realizers contribute to system causal powers**: The causal powers of the system as a whole depend constitutively on the intrinsic properties of the realizer.  
  9. **Functional organization is necessary for mentality**: Altering the global functional organization (e.g., via rewire) can destroy or transform mental states.  
  10. **Cross-species mental ascriptions are valid**: Mental kinds can be truthfully ascribed across species (e.g., humans and mice can both experience pain).  
  11. **Realizers ground causal powers non-causally**: The realizer’s intrinsic properties provide a constitutive basis for the causal powers of the role it fills.  
  12. **Functional isomorphism implies identical mentality**: If two systems have identical functional organizations (same causal roles and relations), they have identical mental kinds, regardless of realizer differences.  

  **Pinch Analysis**:  
  - Nadia reluctantly accepts (8) and (11) because they imply that realizer properties are constitutively relevant beyond role occupation, potentially undermining pure functionalism.  
  - Tobias reluctantly accepts (5) and (12) because (5) implies that mental kinds depend solely on role context (not just realizers), and (12) implies that realizer differences are irrelevant to mentality if roles are identical, contradicting realizationism.

