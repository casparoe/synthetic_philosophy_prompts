  - Case: Perform a graft intervention with a realizer that has different intrinsic causal powers. For example, replace a neural state with a realizer that is slower (higher latency) or noisier (more random). But preserve the input-output profile by design (e.g., by adding compensatory mechanisms). Then, test for the mental state: if the subject reports the same experiences, but we also test for causal powers in novel situations (not in the original role specification).

