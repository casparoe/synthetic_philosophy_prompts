    - Prediction by Nadia: If the input-output profile is the same, then the mental state is the same in both, and the graft preserves it in both.

    - Prediction by Tobias: The mental state might not be the same in the two species to begin with because of realizer differences, and the graft might not preserve the mental state in either if the realizer is too different. But he cannot deny cross-species ascriptions, so he must allow that the octopus has pain. However, he might say that after graft, the mental state is not pain because the realizer is different. But the protocol assumes graft preserves the mental state. So we need a different approach.

    - Alternative: Use the same species but different individuals with different neural organizations. But the issue is cross-species.

    - Let's reframe: The bridge problem is how to map the input-output taxonomies. So consider: In a human, role R is defined by inputs (e.g., tissue damage) and outputs (e.g., withdrawal, crying). In an octopus, the inputs and outputs are different (e.g., different chemicals for tissue damage, different behavioral responses). How do we know if it's the same role?

