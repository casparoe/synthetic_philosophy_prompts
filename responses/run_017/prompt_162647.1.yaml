  For Tobias, claim 2 is about conceptual possibility, which he might accept. Instead, let's have a claim that MR is not only conceptual but also occurs in nature. He might be reluctant to accept that.

  Revised claims:

  1. Mental states are causal roles in a functional organization.

  2. It is conceptually possible for a mental state to be realized by physically different realizers.

  3. Realization is a relation between a realizer and a role such that the realizer occupies the role.

  4. The realizer has properties that are not defined by the role it occupies (e.g., its microstructure).

