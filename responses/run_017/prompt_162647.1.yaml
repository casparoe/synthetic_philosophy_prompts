  Let's structure the document accordingly.

  ---

  **Part 1: Agreed Claims**

  We need at least 10 substantive claims. At least two that Nadia would be reluctant to accept and two that Tobias would be reluctant to accept. Include an agreed characterization of a "worthwhile" multiple realizability case.

  Drafting:

  1. **Mental kinds are causal kinds**: Mental states are individuated at least in part by their causal roles, i.e., how they are caused by inputs, how they cause other mental states, and how they cause outputs.

  2. **Multiple realizability (MR) is conceptually possible**: It is not a contradiction to suppose that two systems with different physical constitutions could have the same mental state.

  3. **Realization requires more than mere correlation**: A realizer for a mental state must be the state that actually plays the causal role, not just a correlate.

  4. **The physical realizer has intrinsic properties**: The physical state that realizes a mental state has properties that are not exhausted by its role in the system (e.g., its microstructure, metabolic properties, etc.).

  5. **Mental states are not identical to their neural realizers in every case**: There are cases (even if rare) where the same mental state can be realized by different neural states, or where the same neural state can realize different mental states in different contexts.

  6. **Graft interventions can sometimes preserve mental functioning**: It is possible to replace a neural realizer with a structurally different one (via graft) and have the subject remain conscious and report in ways that suggest the mental state is preserved.

  7. **Rewire interventions can sometimes change mental kind**: It is possible to alter the embedding of a neural realizer (via rewire) such that the same realizer now supports a different mental state, as evidenced by changes in reports and discriminations.

  8. **Mental kinds are not defined by their realizers' intrinsic properties alone**: What makes a state a particular mental kind is not solely determined by the intrinsic properties of its realizer, but also by how it is embedded in the system.

  9. **MR worth arguing about**: A case of MR worth arguing about is one where two systems (or two states in the same system at different times) exhibit the same mental kind despite having realizers that are:
     - Structurally different (e.g., different neural types, or even non-neural substrates).
     - Different in properties that are not screened off by the input-output profile (e.g., internal structure, metabolic cost, etc.).
     - And the systems are such that we can attribute the same mental kind based on behavior, reports, and discriminations.

  10. **The causal powers of the system depend on the realizer**: The realizer's own causal powers contribute to the causal powers of the system as a whole.

  11. **The system's functional organization must be preserved for mental states to be preserved**: If the functional organization (the causal relations between states) is altered, then the mental states may change.

  12. **Mental states are not defined by the entire system's physical state**: A mental state is realized by a part of the system (e.g., a state of a subsystem) and not by the entire system at once.

