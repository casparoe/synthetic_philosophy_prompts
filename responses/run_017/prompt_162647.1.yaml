  ### Part 3: Three Cruxes  
  Cruxes are sub-questions where settling one would move at least one party. Each uses the graft/rewire protocol, with concrete cases and predictions. A null result or surprise costs one side; both cannot absorb all outcomes. Constraints enforced: Nadia cannot invoke the actual neural grain; Tobias cannot deny cross-species ascriptions.  

  #### Crux (a): Grain  
  **Issue**: How finely must the role be specified? Coarse grain risks admitting non-mental realizers; fine grain risks making cross-system MR vanish.  
  **Case**: Graft intervention in a human subject, replacing a neural realizer for visual discrimination (role \( R \)) with a structurally different realizer: a distributed system of trained workers (e.g., 100 humans in a room, relaying signals via hand gestures to mimic input-output). \( R \) is defined at multiple grains:  
  - Coarse: Discriminates basic colors (red vs. blue).  
  - Fine: Discriminates subtle shades (e.g., crimson vs. scarlet) under noise.  
  The graft preserves coarse input-output but may fail at fine grain due to worker latency. Test discrimination at both grains, with reports.  
  - **Nadia’s prediction**: Mental kind preserved at both grains if input-output matches; workers are valid realizers.  
  - **Tobias’s prediction**: Mental kind preserved only at coarse grain; at fine grain, discrimination fails due to realizer limitations, showing mental degradation.  
  **Why a surprise costs**: If fine-grain discrimination succeeds, Tobias must concede that realizer properties do not constrain role grain for mentality, weakening realizationism. If it fails, Nadia must either abandon coarse grain (admitting non-mental realizers) or accept that grain is finer than functionalism allows (cost: functionalism becomes empirically vacuous). *Bullet bite*: Nadia bites the bullet on non-mental realizers (e.g., markets), costing intuitive credibility; Tobias bites none here.  

  #### Crux (b): Taxonomic Bridge  
  **Issue**: What entitles us to call roles the same across systems (e.g., species) with different input-output taxonomies?  
  **Case**: Cross-species graft: Replace a pain-role realizer in a human with one from an octopus (differing in neural structure, metabolic cost). Define role \( R \) abstractly (causes: noxious stimuli; effects: avoidance, distress vocalizations). Human and octopus inputs/outputs differ taxonomically (e.g., human pain outputs include verbal reports; octopus outputs include color changes). Test post-graft: Apply a noxious stimulus and measure trade-off behavior (e.g., subject tolerates pain for reward).  
  - **Nadia’s prediction**: Mental kind (pain) preserved if abstract role is filled; trade-off behavior matches pre-graft.  
  - **Tobias’s prediction**: Mental kind not preserved; trade-off behavior degrades because realizer differences (e.g., octopus realizer in human) disrupt the grounding of pain.  
  **Why a surprise costs**: If trade-off behavior is preserved, Tobias must concede that realizer differences do not prevent same-role ascription across species, undermining realizationism’s emphasis on physical basis. If behavior degrades, Nadia must concede that input-output alone is insufficient for cross-system roles (cost: MR loses probative force). *Bullet bite*: Tobias bites the bullet on cross-species mental differences (despite constraint), costing parsimony; Nadia bites none here.  

  #### Crux (c): Inheritance  
  **Issue**: Must the realizer’s powers ground the role’s powers constitutively, or does role occupation suffice? Can Nadia state grounding without conceding? Can Tobias explain MR’s historical significance?  
  **Case**: Graft intervention replacing a neural realizer for auditory discrimination (role \( R \)) with a slower, noisier synthetic realizer (e.g., a circuit with inherent latency). Compensatory mechanisms preserve input-output for standard stimuli (e.g., pure tones) but not for novel, complex stimuli (e.g., overlapping sounds). Test discrimination on standard and novel stimuli, with reports.  
  - **Nadia’s prediction**: Mental kind preserved; novel-stimuli failures are irrelevant if role \( R \) is defined only for standard inputs.  
  - **Tobias’s prediction**: Mental kind degraded; novel-stimuli failures reveal that realizer properties limit causal powers, showing incomplete realization.  
  **Why a surprise costs**: If novel discrimination succeeds, Tobias must concede that realizer properties do not constitutively ground powers, weakening realizationism. If it fails, Nadia must either redefine roles to include novel cases (risking ad hoc grain) or accept that roles lack autonomous causal powers (cost: functionalism concedes to realizationism).  
  **Dialectical sub-issues**:  
  - Nadia *can* require realizers to "have the capacity" to fill roles without conceding grounding; this is just modal role occupation.  
  - Tobias *can* explain MR’s historical significance: It challenged identity theory, but its rarity and compatibility with realizationism show it never threatened his view.  
  *Bullet bite*: Both bite bullets. Nadia bites on redefining roles (cost: functionalism becomes less general); Tobias bites if novel discrimination succeeds (cost: realizationism loses empirical content).  

  ---

  ### Part 4: Closing Audit  
  **Verbal Disputes**: Minor verbal elements exist in "realization" (Nadia: role occupation; Tobias: constitutive grounding) and "mental kind" (Nadia: role; Tobias: role + realizer). However, the core disagreements are **not merely verbal** because:  
  - They generate divergent empirical predictions under the graft/rewire protocol (e.g., grain crux predicts different outcomes for worker-grafts; inheritance crux for novel stimuli).  
  - They have normative consequences: Nadia’s view licenses non-standard realizers (e.g., AIs, markets) as mental; Tobias’s restricts mentality to systems with appropriate physical bases.  
  - Verbal aspects do not resolve the cruxes; experiments can.  

  **Settlement**: The graft/rewire protocol can settle non-verbal disputes by testing cruxes:  
  - **Grain**: If coarse-grain grafts (e.g., workers) succeed at fine discrimination, Nadia wins; if not, Tobias wins.  
  - **Taxonomic bridge**: If cross-species grafts preserve trade-offs, Nadia wins; if not, Tobias wins.  
  - **Inheritance**: If grafts handle novel stimuli, Nadia wins; if not, Tobias wins.  
  A clean sweep for one side would force revision; mixed results would show hybrid truths. Until tested, MR retains probative force for functionalism only if grain and bridge are coarse, and inheritance is false—but the protocol can decide.  

  ---  
  **Chair’s Note**: This document sets the stage for the seminar’s final debate. Both parties have skin in the game via the cruxes, and the graft/rewire protocol forces empirical engagement. The goal is not victory but clarity on whether MR, carefully stated, can bear the weight functionalism places on it.
