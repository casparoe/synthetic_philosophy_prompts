  Agreed Claims (numbered for the document):

  1. Mental states are causal roles in a functional organization.

  2. Multiple realizability (MR) is conceptually possible.

  3. Realization occurs when a realizer occupies a causal role.

  4. Realizers have intrinsic properties that are not defined by the role they occupy.

  5. Rewire interventions can change the mental kind realized by a fixed realizer.

  6. Graft interventions can preserve the mental kind when changing the realizer.

  7. A case of MR worth arguing about requires: (i) realizers that differ in properties not screened off by input-output (e.g., internal structure, material, etc.), and (ii) the systems exhibit the same mental kind by behavioral and report criteria.

  8. The causal powers of the system depend on the realizer's properties.

  9. Functional organization is essential for mental states: altering it can change mental states.

  10. Cross-species mental ascriptions are sometimes true.

  11. The realizer's intrinsic properties ground (at least in part) the causal powers of the system.

  12. If two systems are functionally isomorphic (same functional organization), then they have the same mental states.

