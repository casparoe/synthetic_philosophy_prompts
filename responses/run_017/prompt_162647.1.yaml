  We are drafting a document for an adversarial collaboration between Nadia (functionalist) and Tobias (realizationist) on multiple realizability (MR) and its implications for the philosophy of mind. The document must have four parts: agreed claims, disagreements table, three cruxes, and a closing audit. We are to avoid literature citations and argue from scratch.

  The graft/rewire protocol is central to the cruxes:

  - **Graft**: Replace the neural state type that normally fills role R with a structurally different state type from another lineage, preserving the input-output relations but changing internal properties (structure, metabolic cost, etc.). The subject remains conscious and reportable.

  - **Rewire**: Hold the realizer fixed and alter its wider embedding (upstream and downstream partners), preserving the causal profile within the local channel. This can sometimes lead to a change in mental kind (one realizer, multiple roles).

  The candidate cruxes provided are:

  (a) Grain: How finely must the role be specified? Too fine and MR vanishes; too coarse and non-mental realizers (like an organ, trained workers, or a market) might be accepted.

  (b) Taxonomic bridge: What entitles us to call the role the same in two different systems (with different embodiments and environments) when they may share no input/output taxonomy?

  (c) Inheritance: Whether the realizer's own powers must constitutively ground the role's causal powers or if merely occupying the role suffices. Also, whether Nadia can state the requirement without conceding to Tobias and whether Tobias can explain why MR evidence seemed important.

