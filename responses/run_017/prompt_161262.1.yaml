  #### **B. Gibbard-Satterthwaite Theorem**  
  For ≥3 options, **no voting rule** can simultaneously satisfy:
  1. **Unrestricted domain**,
  2. **Non-dictatorship**,
  3. **Strategy-proofness** (resistance to tactical voting).

  **Your conflict**: Strategy-proofness is **impossible** to fully achieve.  
  → **You must allow some tactical voting vulnerability**.

  #### **Summary of Trade-offs**:
  - **IIA (spoiler resistance) and strategy-proofness are mutually exclusive** with your non-negotiables (Pareto, non-dictatorship).
