  Two theorems define the boundaries of what’s achievable:

  #### **A. Arrow’s Impossibility Theorem**  
  For ≥3 options, **no ranked voting rule** can simultaneously satisfy:
  1. **Unrestricted domain** (accepts all ballot types, including partial rankings),
  2. **Pareto efficiency**,
  3. **Independence of Irrelevant Alternatives (IIA)**,
