  In practice, no common voting rule satisfies IIA and Pareto efficiency.

  ### Gibbard-Satterthwaite Theorem
  - This theorem states that for three or more candidates, no voting system is strategy-proof (i.e., resistant to tactical voting) unless it is dictatorial or has only two candidates.

  The user's requirement 4 (strategy-proofness) is thus impossible to satisfy in full when there are three or more candidates, along with the other conditions (non-dictatorship and Pareto efficiency). 

  Therefore, we must relax some requirements.

