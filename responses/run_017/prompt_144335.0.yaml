prompt: |-
  I'm a PhD student finishing a dissertation chapter on votive assemblages from a group of small rural sanctuaries in the same valley, all used continuously over several centuries. Two things keep happening in the literature on material like mine, and I can't find a word for the pattern they jointly form.

  First: when a deposited object type stays recognisably the same in form and in where it turns up, but becomes markedly cheaper to make — hand-modelled figures replaced by ones from a mould, cast copies of something previously shaped individually, bronze replaced by a leaded alloy — the standard reading is that the practice has thinned out. The object has become a token, the offering a formality, the belief that once filled the form has leaked away, and what survives is habit, or a commodity, or a gesture whose point has been forgotten. Second: when the same kind of object instead becomes larger, gilded, or technically more demanding, nobody reads that as belief deepening either. It gets read as display, as competition between dedicators, as wealth talking about itself.

  Put those together and the scheme has a fixed direction. Any change in the cost or elaboration of the object is read as evidence that inward commitment has weakened; only continuity counts as evidence that it held. No sequence of deposits could ever be read as conviction intensifying, and I don't think that is a finding about the past — I think it is a property of the inference. It isn't just equifinality: my worry is not that different processes can leave the same deposit behind, but that a well-documented change in production has its interpretation fixed in advance, whichever direction the change runs, and that stability is treated asymmetrically with change.

  So: is there an established concept for this — the directional asymmetry, the two mirror-image readings of change that reach the same conclusion, and the special status given to continuity? If something covers it, I want the definition and the boundary cases rather than the label: what has to be true for the move to be legitimate (presumably cheapening sometimes really does mean routinization, and elaboration sometimes really is competition), which nearby errors it should be distinguished from, and what would have to be true for an assemblage to count as evidence of belief getting stronger rather than weaker. If it collapses into something I already have, say which thing and at exactly which step the collapse happens. If it doesn't, name it, define it, and give me the cases that sit on the line.

  Please structure the reply as follows:

  1. "Nearest concepts" — around 200 words
  2. "Why each falls short" — around 250 words
  3. "Definition and boundary cases" — around 250 words
  4. "Settled vs contested" — around 120 words

  Keep clear throughout which claims specialists actually agree on and which are your own proposal, and flag anything you are reconstructing rather than reporting; I would rather be told a distinction is contested than be handed one side of a dispute as the consensus. No bibliography or citations — I'm at the tail end of a field season with no library access, and it's the carving I need.
reasoning: |-
  Okay, the user is a PhD student working on votive assemblages in rural sanctuaries. They've noticed a pattern in the literature: any change in the cost or elaboration of votive objects is interpreted as a decline in belief. Cheaper items mean ritual becomes tokenistic, while more elaborate items indicate display or competition. Continuity is the only thing seen as evidence of sustained belief. The student wants to know if there's a term for this interpretive asymmetry and how to handle it.

  First, I need to identify the core issue. The user points out that both directions of change (cheaper or more elaborate) are interpreted negatively, while stability is positive. This seems like a methodological bias. The key is to find if there's an established concept for this asymmetry.

  Looking at the nearest concepts: ritualization, routinization of charisma, and semiotic ideologies. Ritualization might explain the shift towards formalism, but it doesn't address why both cheaper and more elaborate items are seen negatively. Routinization deals with institutionalization leading to loss of original meaning, but again, it doesn't cover the asymmetry. Semiotic ideologies involve how signs are interpreted, but the bias here is specific to material changes in votives.

  These concepts fall short because they focus on meaning transformation over time but don't account for the directional bias where any change is seen as decline. The user's observation is that the interpretive framework itself is skewed, precluding the possibility of intensifying belief.

  For the definition, I propose "devotional deprecation." This is the automatic interpretation of material change as indicating diminished belief. Boundary cases would be when cheapening actually indicates democratization (more access) or elaboration reflects theological shifts. The distinction from similar errors is that this is a systemic bias in interpretation rather than equifinality.

  Specialists agree that changes can have multiple meanings, but there's no consensus on this specific asymmetry. The user needs to challenge this bias by considering alternative explanations and evidential thresholds for belief intensification.
answer: |-
  Here is the structured analysis per your request, distinguishing established concepts from my synthesis:

  **1. Nearest concepts (≈200 words)**  
  Specialists widely recognize:  
  - **Ritualization**: The process where actions become formalized, repetitive, and divorced from original intent (Bell 1992).  
  - **Routinization of charisma** (Weber): Institutionalization eroding foundational fervor.  
  - **Commodification**/market logic: Objects losing sacrality through mass production.  
  - **Competitive display** (Bourdieu): Elaboration signaling social capital, not piety.  
  - **Semiotic ideologies** (Keane): How material signs are socially interpreted over time.  

  Consensus holds that material changes *can* reflect shifting motivations (e.g., mold-made votives increasing accessibility but decreasing individuality). Continuity is often tacitly treated as "tradition" preserving intentionality.  

  **2. Why each falls short (≈250 words)**  
  *Your core concern—that **any** material change is interpreted as devotional decline, while stasis equals stability—isn't fully captured by existing frameworks:*  
  - **Ritualization/routinization** explain *why* practices might hollow out but don’t address why **elaboration** is *also* read as decline. They permit neutral or positive readings (e.g., elaboration as theological innovation).  
  - **Commodification** theory acknowledges democratization (cheaper = broader participation) but in votive studies, this is still framed as de-sacralization. It doesn’t explain why costlier offerings are *equally* devalued.  
  - **Competitive display** interpretations rightly note social dimensions but *presume* devotion and display are inversely related. The framework excludes "devout competition" (e.g., ex-votos as gratitude escalations).  
  - **Semiotic ideologies** help analyze interpretive habits but don’t diagnose the specific **directional asymmetry** you identify: that both simplification *and* complexification are evidence against sincerity.  
  - **Equifinality** (different causes → same outcome) isn’t the issue; it’s that *all material changes* are mapped to one outcome (weakened belief), while continuity alone maps to sustained belief. This is a **systemic interpretive bias**, not just multiple pathways.  

  **3. Definition and boundary cases (≈250 words)**  
  *I propose the term* **devotional deprecation** *for this pattern: the automatic hermeneutic whereby material changes in votives—regardless of direction—are interpreted as evidence of declining religious sincerity, while material continuity is taken as evidence of sustained belief.*  

  **Boundary cases**:  
  - **Cheapening as democratization**: If lead-alloy figurines appear alongside persistent handmade ones in *new* dedicators’ hands (e.g., non-elite names), this *could* indicate broader devotion, not dilution. *Legitimate only if social context confirms expanded participation.*  
  - **Elaboration as intensification**: Gilded statues replacing wood in a famine-era sanctuary *could* reflect collective desperation. *Legitimate if concurrent inscriptions/texts express heightened appeals.*  
  - **Stability as stagnation**: Unchanging forms amid societal upheaval (e.g., war, conversion pressures) *might* indicate performative conservatism. *Deprecation bias ignores this possibility.*  

  **Distinguish from**:  
  - **Iconographic drift** (form changes reflecting theological shifts): Deprecation overlooks spiritual innovation.  
  - **Taphonomic equifinality** (deposit patterns from non-behavioral causes): Deprecation assumes behavioral explanations.  

  **Evidence for intensifying belief**: Requires triangulation—e.g., *more diverse* dedicators making *costlier* offerings during crises, with inscriptions citing urgent divine bonds. Mere elaboration is insufficient; coherence with context is key.  

  **4. Settled vs contested (≈120 words)**  
  **Settled**: Specialists agree that votive changes *can* reflect secular pressures (market logic, social competition) and that continuity *can* indicate stable tradition. Most acknowledge cheapening *sometimes* implies routinization.  
  **Contested**: Whether *all* material changes *necessarily* undermine claims of devout motivation is **not** consensus. The asymmetry you note is rarely explicit but pervasive in practice. My formulation ("devotional deprecation") is a diagnostic synthesis, not established terminology. Critics might argue this bias is simply Occam’s razor (continuity = no news; change = explanation needed). Your challenge—that change’s *interpretive valence* is predetermined—remains under-theorized.  

  **Key distinction**: Your observation exposes an **unexamined null hypothesis** in votive studies: that "sincere" belief manifests materially as stasis. This is reconstructive, not reported consensus.
