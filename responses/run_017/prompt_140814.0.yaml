prompt: |-
  Hey — I'm the token physics person in a philosophy of physics reading group (everyone else is philosophy, and they keep using words like "nomic" without flinching), and last week we did laws of nature and I came out of it realizing I have a pile of really confident gut reactions that I suspect don't add up to anything coherent. I'm not asking for a reading list, I've had enough of those; I want someone to actually try to extract the principle.

  Here's where I land, case by case. (1) A universe with exactly one particle in it, coasting in a straight line forever: I want to say there IS a law there — inertial motion — even though there's a single instance and nothing else in the universe for it to interact with. I resist "it's just what happened." (2) A world that is nothing but a billion coin flips, half heads, with no pattern in the sequence at all: I want to say there's an objective chance of a half there, that that's the law, and that the exact sequence isn't law-governed in the slightest — and I'm weirdly comfortable saying the chance is a half even though, as far as I can tell, nothing in the total history of the world settles it. (3) "All gold spheres are less than a mile across": exceptionless, short to state, and not a law. What's more, I don't think it fails because it isn't simple enough — it feels like the wrong *kind* of thing. (4) A world just like ours except that in 2031 energy fails to be conserved once, visibly, and then everything goes back to normal: I say conservation was a genuine law before and after, and that "conserved except in 2031" is not a law. So a law can have exceptions, but you can't stitch the exception into the law. (5) A world whose entire history is a perfect palindrome — same sequence of states forward and backward about the midpoint. "The history reads the same in both directions" is one sentence that, given the first half, pins down every detail of the second half; that's about as much strength for as little simplicity as you could ask for, which I gather is exactly what the best-system account (simplicity, strength, fit, as I understand it) rewards. My verdict: not a law, gigantic coincidence. (6) Our own universe starts in a freakishly special low-entropy macrocondition and then runs on simple dynamical rules: I can't shake the feeling that this starting condition is law-ish, something that belongs in the book of laws rather than being a brute fact we're just handed — and I have no idea why I feel that, given how I answered (5). (7) The specific numbers — the fine-structure constant, the particle masses — those feel brute and contingent, not laws; and yet I also want to say two universes could match perfectly in every particular matter of fact and still disagree about the laws, which as I understand it is exactly what the Humean denial of necessary connections in nature is supposed to rule out.

  The only principle I've managed to articulate is what I've started calling the briefing test: L is a law iff (i) no complete description of the non-nomic facts of any single region entails L, and (ii) L together with such a description of one region would let an ideal predictor derive the non-nomic facts of other regions — laws are just whatever you have to be *told* to get from here to there. I notice it probably overgenerates badly (it wants to call the palindrome a law, and the initial condition, and maybe the constants), so I'm guessing it needs repair rather than defense. Can you do better? I'd like one principle, or at most two or three candidates, stated precisely enough that I can test it: which of my cases motivates which clause, what it says about the cases I haven't listed — a law with exactly one instance ever (one particle decay in the whole history), a law that only operated during the first second and never again, and the update rule of a cellular automaton like Life, which everyone in the room agreed is a law "of" that world and which makes me suspect my reaction is just "it's the rule somebody wrote down," which for us collapses into theology — and, most importantly, an honest list of which of my verdicts it can't save and which one I should probably give up. And please tell me straight if the honest answer is that there's no single package here and I have to be a Humean about some of these and not about others. Under 900 words if you can, but don't gut anything to fit.
reasoning: |-
  Okay, I need to help this physics person who's in a philosophy of physics group. They have these specific cases where their gut feelings about what counts as a law of nature conflict, and they want a coherent principle that explains all their judgments. Their "briefing test" idea has issues—it overgenerates laws in cases like the palindrome or initial conditions. Let me list their cases first to reference:

  1. Single particle coasting forever: They feel there's a law of inertia.
  2. Billion random coin flips: Objective chance of 1/2 exists without any pattern.
  3. "All gold spheres <1 mile": Not a law, feels like the wrong kind.
  4. Energy conservation except once in 2031: Law holds before and after, exception not part of law.
  5. Palindrome universe: Not a law, just coincidence despite simplicity and strength.
  6. Our universe's low-entropy start: Feels law-ish, should be in the "book of laws."
  7. Fine-structure constant: Feels brute, but also thinks laws could differ without factual differences.

  They want a single principle that handles all these. First, I should consider existing theories. Humean Best System Account (BSA) might not satisfy them because it would call the palindrome a law due to simplicity and strength, but they reject that in case 5. Non-Humean views like Armstrong's universals or Dretske/Tooley's relations might help with necessary connections, but they mention Humean denial in case 7.

  Their briefing test emphasizes derivability across regions. But it overgenerates. How to fix it? Maybe laws must be about transitions or dynamics, not static facts. That could cover cases 1 (motion), 2 (chances as transition probabilities), 4 (dynamics before/after exception), and 6 (initial condition as part of dynamics). But case 3 is static and not a law, which fits. Case 5 is static pattern, not transition-based, so not law. Case 7 constants could be part of transition laws.

  But why initial condition feels law-ish? In physics, initial conditions are often separate from laws, but in cosmology, they might be treated as nomological. Their intuition might stem from the Past Hypothesis in statistical mechanics. So perhaps laws include both dynamical laws and boundary conditions.

  For the constants, they feel brute but could be part of the laws. However, they want to allow worlds with same facts but different laws, which suggests non-Humean necessity. But Humeans say laws supervene on facts. Conflict here.

  A dual-aspect view: laws as both patterns (Humean) and what grounds them (non-Humean). But that might not be unified. Focus on the explanatory role: laws are what make counterfactuals true or support predictions across contexts. That could unify cases.

  Test on other cases: One particle decay ever—if it's the only event, is there a law? Their intuition might say yes, like a decay probability. Briefing test would say yes. A law only in first second—feels possible, like temporary physics. Cellular automaton rule is clearly a law.

  Principle proposal: Laws are the minimal set of principles that (a) are invariant across spacetime, (b) support robust counterfactuals, and (c) explain non-accidental regularities. 

  - Invariance: handles case 4 (exception breaks invariance, so not law), case 3 (gold spheres not invariant if new gold sphere could exist), case 5 (palindrome not invariant if middle changes? But it's symmetric). Problem with palindrome.
    
  - Counterfactuals: in case 1, if particle were perturbed, it would coast—supports counterfactual. Case 2, if you flipped again, 50% chance. Case 3, if there were a gold sphere, it might be >1 mile—accidental, so counterfactual fails. Case 4, if no 2031 event, energy conserved—so conservation law still holds. Case 5, if you changed a state, symmetry breaks—not robust. Case 6, if initial state differed, entropy might be higher—counterfactual depends on law. Case 7, constants fixed for counterfactuals.

  - Explanation: laws explain why things happen, not just describe.

  Initial conditions in case 6: if included, it explains why entropy increases. But is it invariant? Yes, if it's a one-time boundary condition. But in BSA, it might be part of best system.

  For constants, they feel brute but necessary for derivation. So perhaps include in laws.

  Now, state a precise principle:

  **The Asymmetry Principle:** A statement L is a law iff (i) it describes a fundamental, time-translationally invariant constraint or dynamic, and (ii) it figures indispensably in the derivation of non-nomic facts from initial/boundary conditions.

  - (i) Invariance ensures it's not accidental like case 3 or 5. Case 5 palindrome is time-dependent symmetry, not invariant in the right way? Or it's symmetric but not dynamic. Case 4: conservation is invariant except one point, so not fundamental. 
    
  - (ii) Derivation: connects to briefing test but adds initial conditions. Case 6 initial condition is needed to derive history, so law-ish? But it's a condition, not a dynamic. Issue.

  Refine to include boundary conditions.

  **Proposed Principle:**
  L is a law iff:
  1. **Non-supervenience on local particulars:** L is not entailed by the complete physical state of any single spacetime region.
  2. **Global derivational role:** L must be used to derive the state of some regions from the state of others, across a wide range of possible conditions.
  3. **Stability:** L holds at all times and places unless explicitly time-limited, and supports counterfactuals about non-actual scenarios.

  Apply to cases:
  1. Single particle: Inertia is fundamental dynamic, not supervenient on one state, used to derive future from present. Stable. Law.
  2. Coin flips: Chance 1/2 is a dynamic (transition probability), not local, used to derive frequencies. Stable. Law.
  3. Gold spheres: Supervenes on particulars (all gold spheres are covered), no derivational role beyond description. Not law.
  4. Energy conservation: The general law is stable, exception is not part of it. "Except in 2031" not stable. Law before/after.
  5. Palindrome: "Reads same both ways" supervenes on the whole history, no derivational role for regions (if you have one half, you derive the other, but it's not a dynamic; it's a pattern). Not stable under counterfactuals. Not law.
  6. Low-entropy start: Boundary condition, not dynamic? But it has a derivational role globally. If we include boundary conditions as laws, it fits. Their feeling might be right; some philosophers do this. So maybe laws include fundamental boundary conditions.
  7. Constants: Part of dynamical laws, so law. But they feel brute. Conflict. Principle says they are law because indispensable in derivation. But they want to say two worlds could differ only in laws with same facts—impossible if laws supervene. So must accept Humean supervenience or reject that intuition.

  For other cases:
  - One particle decay ever: If it's probabilistic, the chance law exists and is used in derivation (even though only one instance). Law by principle.
  - Law only first second: Not stable, so not fundamental law. But could be a temporary bylaw? They might accept it's not a law in the strict sense.
