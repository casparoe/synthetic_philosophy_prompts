  ### Art Definition Diagnostic Quiz  
  *For a First-Year Aesthetics Course*  

  **Instructions:** Answer each question based on the case description. Choose the option that best reflects your judgment. Do not overthink—go with your initial reaction. You need no prior knowledge of art theory.  

  ---

  **Cases:**  
  1. **The Undetected Forgery**: A painting is a physically perfect replica of Van Gogh’s *Starry Night*, forged to deceive. It hangs in a museum, and everyone believes it is genuine. *Is it art?*  
     - A) Yes  
     - B) No  

  2. **The Repatriated Ritual Object**: A mask is carved for rituals in a society with no concept of “art.” It is displayed in a museum as art, then returned to its community and used in rituals again. *After repatriation, is the mask art?*  
     - A) Yes, it remains art  
     - B) No, it is no longer art  
     - C) It was never art  

  3. **The Isolated Creation**: An object identical to Picasso’s *Guernica* is made by a community with no art practices, traditions, or the concept of art. *At the time of its creation, was it art?*  
     - A) Yes  
     - B) No  

  4. **The Unseen Work**: A sculptor creates a statue, never shows or describes it to anyone, and destroys it upon death. *Was it art?*  
     - A) Yes  
     - B) No  

  5. **Elegant Non-Art**: A mathematical proof and a chess problem are widely admired for their beauty and elegance, but neither was intended as art. *Are they art?*  
     - A) Yes  
     - B) No  

  6. **The Readymade**: An artist places an unaltered, ordinary driftwood piece in a gallery and declares it art. *Is it art?*  
     - A) Yes  
     - B) No  

  7. **Bad Art**: An artist intentionally creates a painting that is ugly, boring, and technically inept. It is displayed in a gallery but universally ridiculed. *Is it art?*  
     - A) Yes  
     - B) No  

  8. **Prehistoric Artifact**: Archaeologists discover a decorated pot made in a prehistoric society with no concept of art. It is later displayed in a museum. *Was the pot art when it was made?*  
     - A) Yes  
     - B) No  
     - C) It became art later  

  ---

  **Scoring Key:**  
  Tally your answers and match the pattern to a position. Positions are sorted by their core commitments:  

  - **Aesthetic Essentialism** (Art requires perceptible aesthetic properties, e.g., beauty):  
    `1:A, 2:A, 3:A, 4:A, 5:A, 6:B, 7:B, 8:A`  
    *(Art supervenes on perceptible features; evaluative component excludes bad art.)*  

  - **Functionalist Essentialism** (Art is defined by a function, e.g., aesthetic experience):  
    `1:A, 2:B, 3:B, 4:B, 5:A, 6:A, 7:B, 8:B`  
    *(Relational properties needed; status context-dependent; bad art impossible.)*  

  - **Institutional View** (Art is whatever the artworld accepts):  
    `1:A, 2:B, 3:B, 4:B, 5:B, 6:A, 7:A, 8:C`  
    *(Status relational, based on current uptake; can change over time.)*  

  - **Intentional-Historical View** (Art requires a historical-intentional link to prior art):  
    `1:B, 2:A, 3:B, 4:A, 5:B, 6:A, 7:A, 8:B`  
    *(Status relational and historical; fixed at creation; no evaluative component.)*  

  - **Cluster/Weighted Resemblance** (Art shares overlapping properties, e.g., expressiveness, institutional recognition):  
    *Common pattern:* `1:B, 2:B, 3:B, 4:A, 5:B, 6:A, 7:A, 8:C`  
    *(Hybrid: relational properties often weighted heavily; status can change.)*  

  - **Neo-Wittgensteinian Anti-Essentialism** (No definition; art is an open concept):  
    `1:A, 2:B, 3:B, 4:B, 5:B, 6:A, 7:A, 8:B`  
    *(Rejects fixed criteria; emphasizes contextual use of "art.")*  

  ---

  **Diagnostic Notes:**  
  - **Empty Position Flagged**: The combination `1:B, 2:A, 3:A, 4:B, 5:A, 6:B, 7:A, 8:C` is incoherent. It requires art to depend solely on perceptible features (Q3:A, Q6:B) but also change status without perceptual change (Q8:C), which is contradictory.  
  - **Indistinguishable Pair**: The Institutional View and Neo-Wittgensteinianism both answer `B` for Q4 (Unseen Work) and `A` for Q7 (Bad Art), making them hard to separate. Adding a case like *"An artist creates a work seen only by non-artworld friends"* would split them (Institutional: B, Neo-Wittgensteinian: A).  
  - **Highest-Impact Question**: **Q4 (Unseen Work)** best separates positions by testing if art requires audience reception (rejects Functionalist, Institutional, Neo-Wittgensteinian) versus creator intention (accepts Aesthetic, Intentional-Historical, Cluster).  

  *(Designed for one-page photocopying; 495 words.)*
