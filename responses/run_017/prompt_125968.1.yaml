  ### Key Design Notes:
  1. **Temporal Focus**: Node 1 (critical load-bearing node) explicitly separates time-slice (A), whole-life (B), and ex ante (C) equality using a case about financial preparedness during dependency episodes. Removing it collapses these distinct temporal frameworks.

  2. **Case-Based Nodes**: All questions reference concrete scenarios about the target population (e.g., wheelchair access, savings choices, insurance design). No node asks about abstract labels ("welfare," "resources").

  3. **Currency Separation**:
     - Node 2 distinguishes resources, welfare, and capabilities via differential responses to identical injuries.
     - Node 4 further refines currencies by focusing on compensation priorities *during* dependency.

  4. **Opportunity-Outcome Distinction**: 
     - Node 3 separates outcome egalitarianism (E) from opportunity egalitarianism (D) via a savings/spending choice case.

  5. **Unnamed View**: The "Unnamed insurance-based capability equality" leaf (path C→F→...→O) proposes a time-indexed, insurance-driven capability equality no major theorist defends.

  6. **Empty Combinations**: Ex ante welfare equality (C+W) is unattractive due to measurement problems; time-slice with responsibility (A+D) is incoherent.

  7. **Unseparated Pair**: Dworkin and generic luck egalitarianism both follow path (B→R→D→L) and cannot be distinguished by the tree.

  8. **Contested Elements**: Responsibility (n3), ex ante justification (n1), and capability implementation (n4) are explicitly marked as contested to avoid smuggling assumptions into definitions.
