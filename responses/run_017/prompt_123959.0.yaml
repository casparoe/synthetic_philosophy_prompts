  - The simulation in Step 4 is simplistic and requires judgment.

  **Degradation with Knowledge**

  Once members know the procedure, they might:

  - Change their pre-votes to avoid being seen as herding (which could be good) or to manipulate the outcome (bad).
  - Adjust their reasons to appear more independent.
  - Be less likely to change their vote during the meeting, which might reduce cascades but also reduce legitimate updating.

  This might reduce the frequency of detected cascades (IC) but also reduce the occurrence of cascades. However, it might also lead to more RC (reputational conformity) being hidden.

  **Audit Frequency**

  Audit the procedure by running it on a random sample of decisions (both lopsided and not) at least once a year. Do not just run it on decisions that feel wrong. The sample should include about 10-20% of all decisions. This will help calibrate the procedure and catch any degradation.

  **Final Procedure Steps Summary**

  1. **Step 1: The Gap** - Compare sealed pre-votes to final vote. If substantial shift toward majority, flag for herding.
  2. **Step 2: The Source** - Analyze reasons for independence. Categorize as GC, RE, ED, RC, or mixed.
  3. **Step 3: The Flip** - Test fragility by removing first two speakers or using pre-votes. If outcome flips, then IC.
  4. **Step 4: The Reorder** - Simulate changing the first speaker. If outcome changes, then IC.
  5. **Step 5: The Override** - If inconclusive, defer and re-solicit.

  **Verdicts and Remedies**

  - GC: Stand.
  - IC: Defer and re-solicit in controlled order.
  - RE: Stand, note redundancy.
  - RC: Defer and re-solicit, consider anonymous voting in future.
  - ED: Stand.
  - INC: Defer and re-solicit.

  **For the Board: One-Page Convergence Note**

  The note should include:

  - The final vote and pre-vote counts.
  - The verdict (one of GC, IC, RE, RC, ED, INC) and a brief reason.
  - The remedy applied (if any).
  - Your signature.

  Example for Case 1: 
    "Verdict: Informational Cascade. Reason: Substantial shift from pre-vote (5-5) to final (9-1) with reasons showing reliance on early speakers and a common memo. Remedy: Deferred for re-vote in controlled order."

  Example for Case 2:
    "Verdict: Redundant Evidence. Reason: All reasons cited the same evaluation report. Remedy: Decision stands, but note for future to seek independent evidence."

  Example for Case 3:
    "Verdict: Genuine Convergence. Reason: Shift due to revelation of independent private evidence. Remedy: None, decision stands."

  **Answering Your Questions**

  - **Case 1**: Verdict IC, remedy: defer and re-solicit.
  - **Case 2**: Verdict RE, decision stands.
  - **Case 3**: Verdict GC, your intervention was not justified. You should not have deferred.

  **Note on Judgment**

  Several steps require judgment, especially:

  - Step 2: Categorizing reasons (may require the chair to interpret).
  - Step 4: Simulating a reorder (requires assumptions about member behavior).
  - Step 5: The override.

  Be transparent about these judgments in the convergence note.
answer: |-
  Below is a decision procedure designed to diagnose lopsided consensus (e.g., 8–2 or more extreme in a 10-person committee) in your rapid-response grants committee. It uses your existing data—sealed private pre-votes, speaking order, running tally, and stated reasons—to assign one of six verdicts. Each verdict triggers a specific remedy. The procedure is grounded in theory on informational cascades and rational herding, with your four summary claims incorporated (minor clarifications noted where needed). It runs in five steps, fits your time budget (5 minutes pre-meeting, 10 minutes during), and outputs a one-page convergence note for the board.

  ### **Clarifications to Your Summary Claims**
  - **Claim 1 (Following the crowd)**: Correct. Herding occurs when members overweight public votes (visible actions) and underweight private signals.
  - **Claim 2 (Sequence freezes)**: Correct, but with nuance: Cascades *can* break if a member has strong contradictory private information. The procedure tests for this.
  - **Claim 3 (Fragile/arbitrary)**: Correct. Cascades are brittle (easily overturned by new info) and path-dependent (outcome hinges on early speakers).
  - **Claim 4 (Look-alikes)**: Correct. Added "expert deference" (ED) as a distinct category. Reputational conformity (RC) now includes "dissent credit" distortions.

  ---

  ### **Decision Procedure**
  **When to run**: After any lopsided final vote (e.g., 8–2, 9–1, 10–0 in a 10-person committee).  
  **Inputs**: Sealed pre-votes with reasons, speaking order, final votes with reasons, running tally.  
  **Output**: One verdict (GC, IC, RE, RC, ED, or INC) with a remedy.  
  **Time required**: 5 minutes pre-meeting (compile data), 10 minutes in-meeting (run steps).  

  #### **Step 1: The Gap (Pre-vote vs. Final Vote Shift)**  
  *Diagnostic*: Measures if members changed votes toward the majority due to social influence.  
  - **Calculate**: Count members who switched from minority to majority side between pre-vote and final vote. Ignore switches away from majority (rare).  
  - **Sufficient answer**: 3+ switches toward majority → signals herding risk (proceed to Step 2).  
  - **Non-answer**: 0–2 switches → no herding risk (skip to Step 3; convergence likely genuine).  
  - **Terminate in no**: If 0 switches → verdict **GC (Genuine Convergence)**. Remedy: Accept vote.  

  #### **Step 2: The Source (Reason Independence)**  
  *Diagnostic*: Checks if reasons trace to unique private info or shared/public sources. Addresses look-alikes (RE, RC, ED).  
  - **Categorize reasons**: For all majority voters, label each reason as:  
    - **Independent (I)**: Cites unique private info (e.g., "my field visit revealed X," "my contact reported Y").  
    - **Common Public (CP)**: Cites shared evidence (e.g., "the memo says Z," "news reports confirm A").  
    - **Expert Deference (ED)**: Explicitly defers to another member (e.g., "I agree with [Name], who knows this region").  
    - **Social (S)**: Vague, non-evidence-based, or conformist (e.g., "I’m swayed by the room," "I dissent to show independence").  
  - **Sufficient answer**: Apply thresholds:  
    - **ED** if 2+ voters defer to *same* expert with **relevant expertise** (e.g., the expert visited the grantee/has deep regional knowledge).  
    - **RE (Redundant Evidence)** if ≥70% of reasons are CP.  
    - **RC (Reputational Conformity)** if ≥50% of switchers’ reasons are S.  
    - **I** if ≥50% of reasons are Independent.  
  - **Non-answer**: Mixed categories (no threshold met) → proceed to Step 3.  
  - **Terminate in verdict**:  
    - **ED** if ED threshold met → verdict **ED (Expert Deference)**. Remedy: Accept vote.  
    - **RE** if RE threshold met → verdict **RE (Redundant Evidence)**. Remedy: Accept vote; flag for future info-diversity.  
    - **RC** if RC threshold met → verdict **RC (Reputational Conformity)**. Remedy: Defer; re-vote with anonymized tally (see remedies).  
    - **I** if I threshold met → verdict **GC**. Remedy: Accept vote.  

  #### **Step 3: The Flip (Fragility Test)**  
  *Diagnostic*: Estimates how little new public info could flip the outcome. Tests fragility (Claim 3).  
  - **Simulate**: Remove the first two speakers’ votes. Recalculate the majority.  
  - **Sufficient answer**:  
    - **Fragile**: Outcome flips (e.g., 9–1 → 4–5 against) → signals cascade risk (proceed to Step 4).  
    - **Robust**: Outcome unchanged or margin remains ≥7–3 → no cascade risk (skip to Step 5).  
  - **Non-answer**: Margin narrows but no flip (e.g., 9–1 → 6–3) → proceed to Step 4.  
  - **Terminate in no**: Robust → verdict **GC** (if not already assigned). Remedy: Accept vote.  

  #### **Step 4: The Reorder (Sequence Dependence)**  
  *Diagnostic*: Simulates if speaking order swayed the outcome. Tests arbitrariness (Claim 3).  
  - **Simulate**: Swap the first speaker with the most credible minority pre-voter (e.g., one with strong independent reason). Reproject votes:  
    - Assume each voter updates based on tally *only if* their pre-vote reason was weak (vague or CP).  
    - Strong-reason voters (I or ED) stick to pre-vote.  
  - **Sufficient answer**:  
    - **Sequence-dependent**: Outcome flips (e.g., approve → reject) → verdict **IC (Informational Cascade)**.  
    - **Sequence-independent**: Outcome unchanged → verdict **GC**.  
  - **Non-answer**: Inconclusive flip (e.g., tie) → proceed to Step 5.  
  - **Terminate in verdict**: **IC** if sequence-dependent. Remedy: Defer; re-solicit evidence (see below).  

  #### **Step 5: Judgment Call (Override for Inconclusive Cases)**  
  *Diagnostic**: Human fallback when data is ambiguous.  
  - **Assess**: Chair weighs:  
    - Stakes (high $/irreversible → lean deferral).  
    - Red flags (e.g., credible member dissented with strong reason).  
    - History (e.g., grantee has past issues).  
  - **Verdict**: **INC (Inconclusive)**. Remedy: Defer; re-solicit evidence.  
  - **No termination**: Always assigns verdict.  

  ---

  ### **Verdicts and Remedies**
  - **GC (Genuine Convergence)**: Accept vote. No action.  
  - **IC (Informational Cascade)**: Defer decision. **Remedy**: Re-solicit private pre-votes *in controlled order* (speak in reverse seniority; no live tally). Vote again without discussion. If still lopsided, accept; else, accept new vote.  
  - **RE (Redundant Evidence)**: Accept vote. **Remedy**: Flag for staff to diversify info sources next time (e.g., seek independent field reports).  
  - **RC (Reputational Conformity)**: Defer decision. **Remedy**: Same as IC + consider anonymizing votes in future meetings.  
  - **ED (Expert Deference)**: Accept vote. No action.  
  - **INC (Inconclusive)**: Defer decision. **Remedy**: Same as IC.  

  **Deferral rules**:  
  - First deferral: Chair approves.  
  - Second deferral: Board approval required (proposal likely dies). Use only for IC, RC, or INC.  

  ---

  ### **Application to Your Three Cases**
  *Assumes 10-person committee. Run "as if you weren’t in room" for Case 2.*

  **Case 1: Ballot-measure coalition grant (9–1 final, two senior officers spoke first)**  
  - **Step 1**: Pre-votes unknown → assume worst case (e.g., 5–5 split). *Non-answer* → proceed.  
  - **Step 2**: Reasons: Two seniors cited visit (I); others cited memo (CP). 0% S, 0% ED. RE threshold not met (only 80% CP; needs ≥70% but mixed). *Non-answer* → proceed.  
  - **Step 3**: Remove first two (seniors): If they were "for," vote becomes 7–1 → robust? *Non-answer* (margin narrows to 7–1) → proceed.  
  - **Step 4**: Swap first speaker with a "against" pre-voter. Most voters had CP reasons (weak) → likely flip to reject. *Sequence-dependent* → verdict **IC**.  
  - **Remedy**: Defer; re-solicit in controlled order. **Convergence note**: "IC: Shift toward majority after early experts; reorder simulation flipped outcome. Deferred for re-vote."  

  **Case 2: Your championed grant (10–0 final, pre-votes 6–4)**  
  *(Run without you: Assume you’re excluded from data.)*  
  - **Step 1**: Shift: 4 switched from against to for → 3+ switches. *Sufficient answer* → proceed.  
  - **Step 2**: Reasons: All cited the same report → 100% CP. *RE threshold met* → verdict **RE**.  
  - **Remedy**: Accept vote; flag for info-diversity. **Convergence note**: "RE: All reasons cited shared report. Vote stands; seek independent evidence next time."  

  **Case 3: Renewal grant (9–1 against, you deferred)**  
  - **Step 1**: Assume pre-votes (e.g., 6–4 against). Shift: 3+ switched to against (e.g., 4–6 → 1–9). *Sufficient answer* → proceed.  
  - **Step 2**: Reasons: Three cited unique reporting issues (I); others likely CP/S. I >50%? If 3/9 = 33% → no. *Non-answer* → proceed.  
  - **Step 3**: Remove first two: Vote still 7–1 against → robust. *Terminate* → verdict **GC**.  
  - **Remedy**: Accept vote. **Your intervention**: Not justified. Should have accepted. **Convergence note**: "GC: Robust despite shift; independent evidence dominated."  

  ---

  ### **Limitations and Maintenance**  
  **What the procedure cannot do**:  
  - Detect cascades where pre-votes are identical to final votes (no shift).  
  - Distinguish "rational herding" (good updating) from "irrational herding" (bad) without subjective reason analysis.  
  - Handle intentionally vague reasons or strategic voting perfectly.  
  - Replace chair judgment in close calls (Step 5 is judgment in a lab coat).  

  **Degradation if members know**:  
  - Members may game pre-votes (e.g., vote with expected majority to avoid scrutiny) or fabricate "independent" reasons. This could:  
    - Reduce detected IC/RC by 30–50%.  
    - Increase GC/RE verdicts falsely.  
    - Mitigation: Keep procedure confidential; rotate auditors.  

  **Audit frequency**:  
  - Audit **quarterly** on a **random 20% sample of lopsided votes** (not just "feels wrong" cases).  
  - Calibrate thresholds (e.g., adjust Step 2 % based on audit results).  
  - Full review annually.  

