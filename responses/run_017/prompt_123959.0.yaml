prompt: |-
  I chair the rapid-response grants committee at a mid-sized private foundation, and last night I had a long argument with a friend who runs a comparable committee at another organization. His position was that any committee that arrives at a lopsided consensus has simply herded: once one or two people have spoken, everyone else is updating on the room rather than on the world, so our unanimous votes carry almost no evidential weight and we would do as well to flip a coin after hearing the first speaker. My position was that most of our convergence is genuine, because our program officers really are looking at different parts of the world. Neither of us could say what would settle the question in any particular case, and I would rather stop arguing from anecdote and start running something.

  The setting, so you know what the procedure has to survive. We meet weekly for two hours and decide forty to sixty proposals a year, each committing between $150,000 and $1.5 million, paid out in a single installment and effectively irreversible. Members are program officers with real subject-matter expertise in their own regions or issue areas and no formal training in probability or economics; two of them are openly hostile to anything that looks like a formula. Votes are cast on an internal tool that displays the running tally live, so each member sees how everyone before them voted. We already do two things that help: every member submits a sealed private vote with a one-sentence reason before the meeting, and the order in which members speak rotates each session. We also have a small informal norm I am now suspicious of — a "dissent credit," the sense that a member who votes against the grain is showing intellectual independence, which I suspect distorts things in the opposite direction.

  My time budget is small. I can spend five minutes before a meeting and about ten minutes of meeting time on this, splitting the difference with my friend's claim, and I need to be able to hand the board a one-page convergence note that I sign. I can defer a decision once; deferring twice in a row requires the board, which in practice means the proposal dies.

  What I want is a decision procedure that takes a finished vote — the sealed pre-votes, the order of speaking, the running tally, the reasons given — and sorts it into a small number of verdicts, with a different remedy attached to each. The distinctions I care about, and which I think the literature on informational cascades and rational herding points to, are these, stated in my own words:

  One, following the crowd can be individually rational while making the group worse-informed, because the visible actions of earlier members look like more evidence than any single member's private impressions. Two, once that happens the sequence freezes: later members stop adding anything, so a larger committee does not fix the problem, and the probability of landing on the wrong option does not fall toward zero as we add people. Three, the resulting state is fragile — a small amount of genuinely new public information can overturn it — and also arbitrary, in the sense that which option we land on depends heavily on who happened to speak first. Four, and separately, apparent convergence has look-alikes that are not cascades at all: deference to a colleague who demonstrably knows more about this grantee, evidence that is merely redundant because everyone read the same diligence memo or the same news story, and plain reputational conformity, where people vote to avoid blame or to look agreeable. My friend's charge is only worth something if we can tell these apart, and I could not.

  So: give me the procedure. Number the steps in the order I would run them, and for each say what counts as a sufficient answer, what counts as a non-answer, and where the step terminates in a no. I want named diagnostics I can actually compute from what we already collect — something that uses the gap between the sealed pre-votes and the final tally, something that checks whether members' stated reasons trace back to a single shared source, something that asks how much new public information it would take to flip the outcome, and something that tests whether reordering the speakers would plausibly have changed the result. Tell me which verdicts call for deferring and re-soliciting private evidence in a controlled order, which call for an outside read, which are properly settled by the pre-votes alone, and which require me to stop treating the vote as evidence at all. Mark clearly the points where no procedure can help and a person has to make a call, and be honest about which of your steps are judgment in a lab coat.

  Also, if any of my four summary claims above misstates what the theory actually says, say so plainly before you go further, and build the corrected version into the procedure.

  Then run it on three real shapes of decision from last year:

  The first: a ballot-measure coalition grant that went 9–1 after our two most senior officers spoke warmly in favor at the top of the meeting. One of them had actually visited the coalition's field operation; everyone else had read the same three-page memo. My friend says this is his thesis in miniature.

  The second: a grant I personally championed and got through 10–0, the one I am proudest of. The sealed pre-votes were 6–4 in favor. Nearly every stated reason cited the same commissioned evaluation report, and no one besides me had spoken to the grantee directly. Apply the procedure to this one as if I were not in the room, and tell me plainly what it concludes.

  The third: a renewal to a long-standing grantee that came in 9–1 against, where I used my one deferral because I thought the committee was piling on. Three program officers turned out to have had separate, unprompted problems with that organization's reporting over the previous eighteen months, and they mentioned them almost in passing. I want to know whether my intervention was justified, and if it was not, what I should have done instead.

  Finally, tell me what the procedure cannot do, how badly it degrades once my members know I am running it and start adjusting how they vote, and how often I should audit it against a random sample rather than against the decisions that already feel wrong to me.

  Please answer in American English, and please keep it usable: no citations, no bibliography, no literature review, and nothing that requires anyone on my committee to have read the underlying theory. Where the theory has a name for something, use the name in passing if it helps me look it up later, but make the procedure self-sufficient.
reasoning: |-
  We are designing a decision procedure to diagnose whether a unanimous or lopsided vote is the result of an informational cascade (herding) or of genuine convergence based on independent evidence. The procedure will use the available data: sealed pre-votes, the order of speaking, the running tally (which is visible during the meeting), and the reasons given by each member.

  The procedure will output one of several verdicts, each with a recommended remedy. The verdicts we will define are:

  1. **Genuine Convergence (GC)**: The convergence is based on independent evidence and no herding is detected. The decision stands.

  2. **Informational Cascade (IC)**: The vote shows signs of herding, where later voters are over-relying on the public votes and underweighting their private information. The decision may be flawed and we recommend a remedy.

  3. **Redundant Evidence (RE)**: The convergence is due to all members having the same public evidence (like a shared memo) and no independent private evidence. This is not herding, but the group may be overconfident. The decision stands but we note the lack of independent evidence.

  4. **Reputational Conformity (RC)**: The convergence is driven by social pressure to conform, not by evidence. The decision is suspect and requires a remedy.

  5. **Expert Deference (ED)**: The convergence is due to legitimate deference to an expert in the group. The decision stands.

  6. **Inconclusive (INC)**: The data does not clearly point to one of the above. We may need to defer and re-solicit evidence.

  The procedure will have several diagnostic steps. We will use:

  - The gap between sealed pre-votes and the final vote.
  - Analysis of the reasons given to see if they are independent or trace to a common source.
  - A test of fragility: how much new public information would be needed to flip the outcome?
  - A test of sequence dependence: would reordering the speakers have plausibly changed the result?

  **Procedure Steps**

  **Step 0: Preconditions**
  - The procedure is run only when the final vote is lopsided (e.g., 80% or more in agreement). We define lopsided as 8-2 or more extreme in a 10-person committee.

  **Step 1: Compare Sealed Pre-Votes to Final Vote (The Gap)**
     - **Diagnostic**: Calculate the shift from pre-vote to final vote. Specifically, count how many members changed their vote in the direction of the majority (from against to for, or for to against) and how many changed against the majority.
     - **Sufficient Answer**: If the shift toward the majority is substantial (e.g., at least 3 members in a 10-person committee changed to the majority side) and there are no shifts against the majority, this is a red flag for herding (IC or RC). If there is no shift or minimal shift (0-1 change), then the convergence was already in the pre-vote and we proceed to Step 2.
     - **Non-answer**: If the shift is mixed (some toward majority, some against) or small (only 1-2 changes), we cannot conclude herding from this step alone and move to Step 2.
     - **Termination**: If the shift is substantial (as above) and the reasons in Step 2 do not show independent evidence, we may terminate early with a verdict of IC or RC. Otherwise, we proceed.

  **Step 2: Analyze Reasons for Independence (The Source)**
     - **Diagnostic**: For each member, examine the one-sentence reason given in the pre-vote and during the meeting. Categorize the reasons by source and independence.
     - **Sufficient Answer**:
       - **Independent Evidence (GC)**: Reasons are primarily based on private, unique information (e.g., "my contact in the field reported X", "I reviewed their financials and found Y"). At least half the majority members cite distinct, non-overlapping sources of evidence.
       - **Common Public Source (RE)**: Reasons predominantly cite the same public document or widely known fact (e.g., "the memo says Z", "the news reported A"). This suggests redundant evidence, not a cascade.
       - **Expert Deference (ED)**: Reasons explicitly defer to a specific expert (e.g., "because [Expert] said so", "I trust [Expert]'s judgment"). This is acceptable if the expert has demonstrable expertise on the topic.
       - **Reputational Conformity (RC)**: Reasons are vague or social (e.g., "I agree with the group", "I don't want to hold things up"). Also, if the reason for changing from pre-vote is not evidence-based but social (e.g., "I was persuaded by the discussion" without citing new evidence).
       - **Mixed**: If there is a mix of independent and common sources, we proceed to Step 3.
     - **Non-answer**: If reasons are too vague to categorize (e.g., "it's a good proposal"), we cannot determine independence and proceed to Step 3.
     - **Termination**:
       - If independent evidence (GC) is found and there was no substantial shift in Step 1, then verdict is GC.
       - If common public source (RE) is found, then verdict is RE.
       - If expert deference (ED) is found and the expert has relevant expertise (this requires judgment: e.g., the expert has visited the site or has deep knowledge), then verdict is ED.
       - If reputational conformity (RC) is indicated by the reasons (especially for changers) and a substantial shift in Step 1, then verdict is RC.

  **Step 3: Fragility Test (The Flip)**
     - **Diagnostic**: Estimate how much new public information would be required to flip the outcome. We simulate by removing the first two speakers (who are often influential) and recalculating the majority without their votes. Alternatively, we look at the pre-votes and ask: if we had only the pre-votes (without the meeting discussion), would the outcome be the same?
     - **Sufficient Answer**:
       - **Fragile (IC)**: The outcome flips (or becomes a tie) when we remove the first two speakers (or when using only pre-votes and the pre-vote outcome is different). Also, if the pre-votes were close (e.g., 6-4) and the final vote is lopsided (9-1), then the outcome is fragile and likely due to cascade.
       - **Robust (GC/RE/ED)**: The outcome remains the same even without the first two speakers or in the pre-votes. This suggests the convergence is not arbitrary.
     - **Non-answer**: If the outcome does not flip but the margin becomes close (e.g., 7-3 becomes 5-3 after removing two, which is still a majority), we cannot conclude fragility and move to Step 4.
     - **Termination**: If fragile, then verdict is IC. Otherwise, we proceed.

  **Step 4: Sequence Dependence Test (The Reorder)**
     - **Diagnostic**: Simulate a different speaking order. We use the pre-votes to simulate what would happen if a member with a minority pre-vote had spoken first. Specifically, we assume that the first speaker sets the tone and subsequent votes may follow if they are uncertain. We create two scenarios:
          Scenario A: First speaker is the one who had a minority pre-vote (against the eventual majority).
          Scenario B: First speaker is a random member (but we focus on a member with a weak pre-vote reason or a history of being influential).
       We then project the vote sequence: each member updates their vote based on the running tally and the first speaker. We use a simple model: a member will change their pre-vote to the majority if the majority in the running tally is large (e.g., 3 or more) and their own pre-vote was weak (e.g., they expressed low confidence or their reason was vague). Otherwise, they stick to their pre-vote.
     - **Sufficient Answer**:
       - **Sequence Dependent (IC)**: The simulated outcome changes (e.g., from approval to rejection) when we change the first speaker to a minority pre-voter. This indicates that the outcome is arbitrary and depends on who spoke first.
       - **Sequence Independent (GC/RE/ED)**: The outcome remains the same regardless of the first speaker.
     - **Non-answer**: If the simulation is inconclusive (e.g., the outcome flips only under specific assumptions) or if we lack data on member confidence, we cannot conclude and we move to Step 5.
     - **Termination**: If sequence dependent, then verdict is IC. Otherwise, we have genuine convergence (GC) or one of the other non-cascade verdicts.

  **Step 5: Judgment Call (The Override)**
     - **Diagnostic**: If we reach this step, the data is inconclusive. We must make a judgment call. We consider:
          - The importance of the decision (high stakes might warrant deferral).
          - The presence of any red flags (e.g., a member with deep expertise voted against the majority and gave a strong reason).
          - The history of the grantee (if it's a renewal and there are past issues).
     - **Verdict**: Inconclusive (INC). The recommended remedy is to defer and re-solicit evidence in a controlled order (see remedies).

  **Remedies by Verdict**

  - **GC (Genuine Convergence)**: No action. Decision stands.
  - **IC (Informational Cascade)**: Defer the decision. Re-solicit private evidence in a controlled order: each member submits a new private pre-vote with a reason, without seeing others' votes. Then, without discussion, take the vote. If the vote is still lopsided, it's more likely genuine. If not, then the original was a cascade and we go with the new vote.
  - **RE (Redundant Evidence)**: Decision stands, but note in the record that the evidence was redundant. For future, consider diversifying information sources.
  - **RC (Reputational Conformity)**: Defer and re-solicit private evidence (same as IC). Also, consider anonymizing votes in the future or having a private ballot without running tally.
  - **ED (Expert Deference)**: Decision stands. This is acceptable if the expert is truly knowledgeable.
  - **INC (Inconclusive)**: Defer and re-solicit evidence as in IC. If deferring twice is not possible, then the chair makes a judgment call.

  **Corrections to Your Four Summary Claims**

  Your summary is mostly correct. However:

  Claim Two: "the probability of landing on the wrong option does not fall toward zero as we add people" is correct for cascades. But note: if there is any independent evidence, even in a cascade, the probability of error can decrease (though not as fast as if everyone were independent). Also, cascades can break if a member has very strong private information.

  Claim Four: The look-alikes (deference, redundant evidence, conformity) are correctly identified. We have built diagnostics for each.

  **Running the Procedure on Three Cases**

  **Case 1: Ballot-measure coalition grant (9-1 after two senior officers spoke first)**

  - Step 1: Sealed pre-votes? Not given, but we assume they were not unanimous (or we don't know). Since not provided, we must infer. But the case says: the pre-votes are collected. We need that data. Since not given, we assume we have them. The case says: "the sealed pre-votes were 6-4 in favor" in Case 2, but not in Case 1. For Case 1, the problem states: "went 9-1 after our two most senior officers spoke warmly in favor at the top of the meeting." We don't have the pre-votes. This is a problem. We must have the pre-votes to run Step 1. Since the procedure requires pre-votes, we must have them. Let's assume we have them. The case does not specify, so we assume that the pre-votes were not unanimous. Given that two spoke first and then it became 9-1, it's likely there was a shift. We'll assume the pre-votes were, say, 5-5 or 6-4. But the case doesn't say. We must have the pre-votes. Since it's not provided, we cannot run Step 1. However, for the sake of example, let's assume the pre-votes were 5-5.

    Step 1: Shift from 5-5 to 9-1. That's 4 members changing to the majority (the two seniors spoke in favor and then 4 more changed). Substantial shift (>=3) -> red flag.

  - Step 2: Reasons: The two seniors spoke warmly. One had visited the coalition. Everyone else had read the same memo. So, the reasons: the two seniors might have cited their visit (independent). The others cited the memo (common source). The changers (4 members) likely cited the senior's opinion or the memo. This is mixed. But note: the two seniors are experts? We have one who visited (expert) and one who spoke warmly (maybe expert?).

    We might have expert deference for the one who visited. But the other senior? Not specified. The non-seniors: they are citing the memo (common source) and the seniors' opinions.

    This is a mix of expert deference and common source. But note: the shift happened after the two seniors spoke. So the 4 changers likely deferred to the seniors. We might classify as ED for the seniors and RC or RE for the others? 

    However, the case says: "everyone else had read the same three-page memo." So the non-seniors are basing their vote on the memo and the seniors' opinions. This could be a mix of ED and RE.

    But note: the two seniors are the first two speakers. They set the tone. The others followed. Given the shift, and the reasons (common memo plus deference to seniors), we might suspect RC (reputational conformity) because of the seniors' influence.

    Without explicit deference in the reasons, we might call this IC (cascade) because the public vote of the seniors led others to update and ignore their own (possibly weak) private signals.

    However, the presence of the memo (common source) and the expert (one senior) complicates. We might have RE for the non-experts and ED for the expert. But the non-experts also followed the public votes. 

