  - Step 3: Fragility test. Remove the first two speakers (the two seniors). Without their votes, the vote would have been 7-1 (if the two seniors were in the 9, then 9-2=7 in favor, and the one against remains). But we don't know the pre-votes. If pre-votes were 5-5, and without the two seniors, we have 5 votes left? We must recast: the committee without the two seniors would have 8 members. The original vote: 9-1. Without the two seniors, we have 7 in favor and 1 against? Then it's still lopsided (7-1). But wait, the two seniors were the first two and they voted in favor. The remaining 8 members: one of them was the dissenter. So the other 7 voted in favor. Without the two seniors, the vote would be 7-1? Then it's still a majority. But we must consider the pre-votes. If pre-votes were 5-5, then without the meeting (only pre-votes) the outcome would be a tie? Then the fragility test shows that without the meeting (or without the first two) the outcome flips (from 9-1 to tie). So fragile.

