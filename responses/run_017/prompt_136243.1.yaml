prompt: |-
  I'm finishing a chapter on hypocrisy and the conditions on blame, and I've come to think the usual framing — can a hypocrite blame? — is too coarse to be answered, because our actual practices don't answer it the same way twice. So I want to work from the other end: take the practices as given and reconstruct the theory of standing they commit us to, then ask whether that theory holds together.

  Here is the pattern I keep circling. Under the equitable clean-hands rule, a plaintiff whose own blameworthy conduct was bound up in the very transaction they are suing on is refused equitable relief altogether; but the refusal is all-or-nothing, it has to be raised by the defendant, and the misconduct has to be connected to the subject matter of the suit rather than a general blot on the plaintiff's character. Move across the courthouse and the same kind of fault behaves completely differently: in tort, the plaintiff's own carelessness doesn't bar the claim at all, it discounts the recovery proportionally, and in criminal proceedings the complainant's own criminal record is irrelevant to whether the accused is guilty, surfacing at most as a question about credibility. Move out of law into the international sphere and it shifts again: the post-war tribunals insisted that one belligerent's commission of the same crime does nothing to excuse another's, tu quoque is not a defence to liability, and yet in diplomatic argument the reply does demonstrably something — it lowers the critic's standing, and everyone involved behaves as though it does, while insisting in the same breath that it shouldn't.

  The thing I can't bring into focus is whether there is one principled story here or three unrelated ones. Notice that equity's rule is essentially relational: the misconduct that disqualifies you is misconduct in the very transaction, and generally toward the very party you are suing, which makes it look less like a doctrine about hypocrisy and more like a doctrine about what you may demand from someone you have wronged. That would explain why the objection bites hardest when a state denounces another state's treatment of that state's own citizens and bites least, or not at all, when I denounce you for what you did to me — even though in both cases the speaker does the very thing they are condemning. But if the implicit view is relational, the practice of shaming in international human-rights institutions is left unexplained, and so is the fact that the same people who discount a hypocritical state's blame treat the hypocrite's advice, warning, or prediction as entirely in order.

  So let me add the variant I've been toying with, because it is the case that makes me think the practice is underdetermined. Suppose a tribunal adopted what I'll call the would-have proviso: a complainant lacks standing if, placed in the defendant's circumstances, they would have done what the defendant did, as the tribunal best can tell — with the result that someone who attempted the same wrong and failed through bad luck loses standing, while someone who committed it and self-reports retains it. That reverses the actual doctrine on both halves, since the actual doctrine cares about what you did in this transaction, not about what you would have done, and it doesn't much care whether you were caught or came forward. I take the proviso to presuppose a dispositional or commitment-based view of standing, where what matters is what the norm actually has by way of a grip on you, whereas the doctrine we have looks backward at conduct and complicity. I want to know whether that's right, whether the backward-looking rule strictly presupposes a complicity view or would sit equally well under several, and in particular whether the practices rule out the dispositional view or merely fail to implement it.

  A second wrinkle, in the same territory. We are distinctly unimpressed by the blame of someone who refrained only because they never had the opportunity — you didn't defraud anyone because nobody ever left you alone with the accounts — and yet the international system runs on small states shaming great powers for exactly the failures they themselves would never have had the capacity to commit, and we don't treat that as a standing problem. Does that asymmetry get explained by whatever theory you favour, or does it show that the practice is tracking something other than standing, like the epistemic value of the critic's testimony or the strategic effects of letting them speak?

  What I'd like from you: reconstruct the implicit theory of standing that this cluster of practices — equitable, tortious, criminal, diplomatic, and the informal norms of moral address — comes closest to presupposing, and keep separate what the practices strictly require from what merely fits them comfortably. Say where several theories would license the same practice, so that the practice is philosophically underdetermined and my chapter can't lean on it as evidence. Say which part of the pattern, if any, is an accident of institutional history rather than a commitment. Then tell me what would actually have to change in doctrine and in ordinary moral address if the backward-looking test were replaced by something like the would-have proviso, including what it would do to the evidential position of a tribunal and to the blamer who has simply never been tempted. If it helps, distinguish standing to blame from standing to advise, to demand an accounting, to impose sanctions, and to resent, since I suspect the practices distribute these separately and the conflation is what has made the literature hard to read.

  I don't need the literature named or a reading list — I have that part covered. Please answer in continuous prose, as you would in a long email: no headings, no bullet points, no bold, no tables, and no lists of any kind. Lead with a single sentence giving me your bottom line — what the practices actually presuppose, in one breath — and then argue for it.
reasoning: |-
  Okay, let me think through this complex query about hypocrisy and standing to blame. The user presents a sophisticated analysis of how different domains handle the hypocrite's right to blame - equity law, tort law, criminal law, international relations, and moral practice - noting these domains show inconsistent patterns. They're clearly deep into writing a chapter and need help reconstructing the implicit theory behind these practices.

  Hmm, the core tension seems to be between backward-looking conduct-based approaches (like equity's clean-hands doctrine) and potential dispositional approaches (like their proposed "would-have proviso"). The user wants to know if these diverse practices share a unified theoretical foundation or if they're just historically contingent. 

  First, I notice the user makes several acute observations: 
  - The relational nature of equity's clean-hands rule (misconduct must be toward the same party in the same transaction)
  - How tort law handles plaintiff fault through apportionment rather than barring 
  - The tu quoque rejection in international criminal law but its operational reality in diplomacy
  - The puzzle of small states blaming great powers for crimes they couldn't physically commit

  The user's proposed "would-have proviso" is particularly interesting - it would make standing depend on whether the blamer would have acted differently in the defendant's shoes. This flips actual doctrine which focuses on what was actually done. 

  I think the key is recognizing that standing isn't a monolithic concept across domains. What's emerging is that practices differentiate between types of normative engagement: 
  1. Claiming redress (equity's clean-hands) 
  2. Attributing responsibility (tort/criminal law) 
  3. Expressing moral condemnation (diplomacy/moral discourse)
  4. Offering prudential guidance (advice/warnings)

  The clean-hands doctrine makes most sense for type 1 - when seeking remedy from someone you've wronged in the same matter. This explains why it's relational and all-or-nothing. Meanwhile, type 2 (attribution) focuses on factual causation and proportional responsibility - hence tort's comparative negligence. 

  For type 3 (moral condemnation), the hypocrisy objection functions differently - it undermines the speaker's moral authority without negating the underlying wrong. This explains the diplomatic practice where tu quoque weakens standing while formally changing nothing about liability. 

  The small state/great power asymmetry fits here too - small states aren't claiming redress or attributing legal responsibility when they shame; they're engaging in moral condemnation where physical capacity to commit the crime is irrelevant to the validity of the norm. 

  As for the dispositional "would-have proviso" - current practices don't require this. The clean-hands doctrine looks at actual conduct, not hypothetical dispositions. But interestingly, in moral discourse we do discount blame from those who clearly would transgress given opportunity. So the dispositional view has traction in informal morality but not in legal doctrine. 

  If we implemented the would-have proviso legally, it would radically change evidence rules - courts would need to assess counterfactual conduct. The never-tempted blamer might gain standing while the unlucky hypocrite loses it. But this might undermine legal certainty since hypotheticals are harder to prove than past conduct. 

  The institutional history point matters too - equity developed clean-hands as a shield against unfair claims, while tort developed apportionment to handle contributory negligence pragmatically. These aren't necessarily philosophical commitments but historical solutions. 

  So to answer directly: the practices presuppose that standing depends on the specific normative function being performed in each context (redress, attribution, condemnation, etc.), with the relational element strongest when claiming remedies from the wronged party. The dispositional view is compatible with moral condemnation practices but alien to legal ones designed for factual certainty. The small state/great power case shows standing for moral condemnation doesn't require capacity to commit the wrong.
answer: |-
  Here is your bottom line: the practices collectively presuppose that standing to blame functions as a relational gatekeeper for specific normative roles—particularly when claiming redress, demanding an accounting, or positioning oneself as a moral arbiter—where the complainant's *own past conduct toward the same party in the same normative domain* undermines their authority to perform that role, while leaving intact standing for factual attribution, prudential warning, or generalized condemnation when the role shifts.  

  The pattern holds together under a view that distinguishes between the *function* of the normative act and the *relational context* in which it occurs. Equity's clean-hands doctrine is not fundamentally about hypocrisy per se, but about the integrity of claiming equitable relief from someone you have directly wronged *in the matter at hand*. It bars a plaintiff from leveraging the court's conscience to extract a remedy when their own hands are soiled by misconduct entangled with the very interaction they seek to adjudicate. The all-or-nothing refusal makes sense here: equity intervenes only when conscience is clear, and the defendant’s invocation of unclean hands protects the relational symmetry of equitable jurisdiction. This explains why disconnected misconduct (a "general blot") is irrelevant—it doesn’t taint the specific relational exchange.  

  Tort law’s comparative negligence, by contrast, addresses a different function: *attributing causal responsibility and allocating losses*. The plaintiff’s carelessness is a factual input into the causal matrix, not a disqualification from seeking redress altogether. Reducing damages proportionally reflects a distributive logic of shared responsibility, not a judgment about the plaintiff’s moral authority to invoke the court’s power. Similarly, in criminal law, the complainant’s criminal record is excluded from the guilt phase because the function is *adjudicating the defendant’s breach of public norms*—the complainant’s character is immaterial to that factual inquiry, though credibility rules acknowledge a peripheral role when testimony is offered.  

  International practice reveals the functional split most sharply. When tribunals reject *tu quoque* as a defense, they preserve the function of *declaring liability under universal norms*—a state’s own crimes cannot relativize another’s obligation. Yet in diplomatic shaming, the function shifts to *moral condemnation*, where standing operates relationally: a state condemning violations it actively commits undermines its role as moral arbiter, weakening its voice without negating the underlying norm. This functional distinction clarifies why small states can shame great powers for crimes beyond their capacity: their role is not claiming *redress* (where capacity might matter) but *invoking universal norms*, where their own incapacity does not invalidate the condemnation. The asymmetry persists because standing here tracks the critic’s alignment with the norm *in their available conduct*, not hypothetical parity.  

  Your "would-have proviso" exposes a tension. Current practices are strictly backward-looking and conduct-based; they require *actual* misconduct in the relevant domain, not hypothetical dispositions. The clean-hands rule cares that you *defrauded this defendant in this deal*, not that you *would have defrauded others* in similar circumstances. This conduct-focus ensures doctrinal administrability—courts assess acts, not counterfactual psychology. The proviso, by contrast, implies a dispositional theory where standing hinges on the blamer’s *current normative commitment*, inferred from what they *would do*. Adopting it would destabilize existing doctrine: in equity, a plaintiff who attempted fraud but failed (due to luck) could be barred despite no actual misconduct, while a successful fraudster who confessed might retain standing if their confession signals reform. This prioritizes psychological coherence over relational integrity.  

  The practices do not strictly *require* a complicity view over a dispositional one; they are compatible with multiple theories but *implement* conduct-based rules for institutional reasons—reliability of evidence, avoidance of speculative inquiries. The discounting of blame from those who lacked opportunity (e.g., the untempted accountant) fits a dispositional view but is an informal moral norm, not a doctrinal rule. Courts avoid this because proving hypotheticals invites intractable disputes. Yet the international small-state practice *is* consistent if standing for moral condemnation depends on the blamer’s *available* conduct: a state with no nuclear arsenal cannot be hypocritical in condemning proliferation if it literally could not proliferate. Its standing flows from its clean hands *within its feasible choices*.  

  Replacing backward-looking tests with the "would-have proviso" would collapse functional distinctions. In law, tribunals would face irreducible uncertainty—assessing "what the blamer would have done" demands speculative evidence, undermining legal finality. The blamer never tempted might gain standing (as their commitment appears sincere) but courts would struggle to verify this. In moral address, the never-tempted could speak forcefully, while those who resisted temptation might paradoxically lose standing if the tribunal doubts their resolve. Crucially, the relational core of equity would dissolve—a plaintiff’s hypothetical conduct toward strangers could bar relief against a defendant they never wronged.  

  The accident of institutional history lies in tort’s proportional recovery. It reflects pragmatic compromise, not a deep theory of standing; other systems (like contributory negligence bars) existed historically. The rest coheres under a functional-relational view: standing rules are triggered when the blamer seeks to occupy a role (redress-seeker, moral arbiter) that their own conduct toward the target has compromised. This explains why the same critic can lose standing to blame yet retain it to advise or warn—advice addresses prudence, not shared norms, so relational history is irrelevant. The practices distribute standing across roles:  
  - **Standing to blame/moral condemn**: Relational; vulnerable to own similar conduct toward the target.  
  - **Standing to demand redress**: Hyper-relational; requires clean hands in the specific interaction.  
  - **Standing to advise/warn**: Non-relational; hinges on epistemic position, not conduct.  
  - **Standing to resent**: Personal; rarely transferable, hence unaffected by third-party hypocrisy.  
  - **Standing to impose sanctions**: Institutional; delegated authority trumps personal conduct.  

  The literature’s confusion stems from conflating these. Your pattern holds because practices respond to the role being claimed, not an abstract "hypocrisy" test. The principled story is one of role-relative authority.
