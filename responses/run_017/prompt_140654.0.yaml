answer: |-
  1. **Reflection in ML terms**: Your current model's output probability for an event should equal the expected value of tomorrow's retrained model's output probability for that same event, conditional on the retraining pipeline operating as designed. This is a martingale condition: today's forecast should show zero expected drift relative to tomorrow's forecast after incorporating new data, assuming the update (retraining) is correct.

  2. **Diachronic Dutch book argument**: If your current output *doesn't* match the expected future output, an adversary can construct two bets: one offered today based on your current probabilities, and another offered tomorrow based on your retrained model's probabilities. By exploiting the predictable discrepancy (drift) between these outputs, they force you to accept a combination that guarantees you a net loss regardless of the actual outcome. This is arbitrage against incoherent forecasts across time steps.

  3. **Mapping fidelity**: Clean mappings exist for "credence" (model output probability), "conditionalizing" (retraining on new data), "martingale" (no expected drift in outputs), and "diachronic Dutch book" (exploitability via sequence of bets across retrain cycles). The "certainty about future updating" maps to assuming a reliable retraining pipeline. The fudge is equating "conditionalizing" with your *actual* retrain procedure, which may not be purely Bayesian.

  4. **Residue report**: Cleanly mapped: martingale as no-drift, Dutch book as exploitability via time-separated bets. Fudged: "Conditionalizing" assumes retraining is ideal Bayesian updating, but your pipeline has known miscalibration risks. No counterpart: Reflection has no built-in concept for anticipating *defective* updates (like your bug) where future outputs are predictably miscalibrated but unstoppable. It presumes updates are trustworthy by default.

  5. **Half-deferral's status**: Half-deferral violates strict Reflection (and the martingale) because today's output isn't equal to the expected future output; it's a weighted average. This creates predictable drift, making it Dutch-book exploitable like any violation. However, Reflection's framework cannot express it as coherent, as it lacks machinery for discounting future outputs due to known pipeline defects—it treats deviations as irrational, not risk-mitigating.

  6. **Residue interpretation**: The gap is primarily in the *assumptions* of the principle, not your vocabulary. Reflection assumes perfect updates, ignoring real-world retraining hazards like your bug. Its silence on half-deferral isn't a vocabulary shortfall but a limitation: it cannot prescribe rational responses when you know updates are sometimes corrupted. This shows the principle does less work in non-ideal settings than its abstract form suggests.
