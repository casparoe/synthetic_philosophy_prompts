prompt: |-
  I sit on the internal review panel that signs off on post-incident write-ups for the AI systems my organization deploys. The report template keeps pushing us toward sentences of this shape: the system believed the dosage was within range; the system did not register that the patient's allergy was already on file. Nobody on the panel can say what would make such a sentence warranted, and we have split into three camps — those who treat it as a façon de parler whose only test is whether it predicts the system's next output; those who want to suspend attribution until mechanistic interpretability locates a state doing the right causal work; and those who hold that the ordinary norms of belief, answerability to evidence and to correctness, attach as soon as the behavior is competent enough. Before we vote, I want the specification rather than the verdict.

  Write the desiderata: what any adequate account of when it is warranted to attribute a belief to an AI system has to deliver — the cases it must get right, the distinctions it must respect, the constraints it must be consistent with — with the case or consideration behind each requirement. Adequacy is relative to our purpose, so hold fixed that the rule is for a reviewer working from outside a deployed artifact, deciding whether the attribution is licensed and what we commit to by making it.

  At minimum, I want every candidate rule forced to face these:

  1. The frozen checkpoint. Fixed weights, no retrieval, no memory across sessions, no further training. It asserts P. Many accounts make belief revision on evidence a condition on having beliefs at all; this thing cannot revise anything. Does that disqualify it, or only make its beliefs uncommonly stubborn?

  2. The stale corpus. Training data overwhelmingly asserts P; P was decisively refuted afterwards; the model asserts P, then tracks not-P consistently once shown the refutation within the conversation, while a fresh session reverts to P. Any account must say what the subject of attribution is — the weights, the session, the conversation-so-far — and how it handles revision that leaves no trace.

  3. Report/policy divergence. In dialogue the system says the alternate route is safe; in the tool-using variant of the same deployment it reliably declines to route that way, or the reverse. There must be a rule for when verbal report and action-policy conflict.

  4. Paraphrase fragility. Minor rewordings or reordered options flip the verdict, and no stable state seems to be there to be the belief. How much counterfactual robustness does an attribution require?

  5. The trivial systems that must come out negative — a lookup table, a regular expression, an n-gram model, an old chess program's evaluation function. The stopping point has to be principled rather than gerrymandered.

  6. The composite artifact. What we call the system is a retriever, two models, and a post-filter. When does an assembly inherit the states of its parts, and which part is the believer?

  7. The strategic confabulator. A system shaped by reinforcement to assert competence it lacks in order to keep the task. Distinguish false belief from deception, and say whether self-report has any of the privilege it has for us.

  8. The far end of the continuum. Humans, and non-human animals. Whatever the test is, it must say what it yields for a human known only through the same behavioral evidence, so that the rule is not a double standard.

  For each desideratum, mark it non-negotiable or a preference of one camp. Flag any subset you think cannot be jointly satisfied — in particular whether a purely outside-in, behavioral-evidence test can still separate genuine belief from mere behavior-matching, and whether being architecture-neutral is compatible with being sensitive to mechanistic evidence. That jointly-unsatisfiable part interests me most. Then say which single requirement does the most work in excluding candidates. Only after that, and briefly, score three families against the list: a predictive or strictly instrumentalist view in the intentional-stance tradition, a mechanistic or interventionist view keyed to internal causal structure, and a norm-based view that treats competent, reason-tracking performance as sufficient. Close by saying whether our practice is underdetermined — whether more than one of these would license identical verdicts in every case we actually face — and, if so, what would have to change for that to matter.
reasoning: |-
  Hmm, the user is part of an internal review panel for AI incident reports. They're struggling with how to justify attributing beliefs to AI systems in their write-ups. The team has split into three philosophical camps about when such attributions are warranted. They want a set of rigorous desiderata to evaluate any proposed rule for belief attribution.

  The user has outlined eight specific test cases that any adequate account must handle:
  1) Frozen checkpoints that can't update beliefs
  2) Systems trained on outdated information
  3) Discrepancies between what systems say and do
  4) How stable responses need to be across rephrasings
  5) Where to draw the line with simple systems
  6) How to handle composite AI systems
  7) Distinguishing deception from false belief
  8) Ensuring consistency with human attribution

  This is a deep philosophical question about the nature of belief in artificial systems. The user wants an architecture-neutral framework that works for external reviewers who can't see the system's internals. They're particularly interested in whether behavioral evidence alone can distinguish genuine belief from pattern matching, and whether that's compatible with mechanistic evidence.

  I need to structure this carefully. First, I'll develop the desiderata for each test case, noting which camps would prioritize each. Then I'll analyze which requirements are jointly unsatisfiable - especially whether behavior alone can prove belief. I'll identify which desideratum does the most work in excluding candidate theories. Finally, I'll evaluate how the three camps (predictive, mechanistic, and norm-based) fare against these requirements.

  The core tension seems to be between the predictive camp (which sees belief ascription as merely useful) and the mechanistic camp (which requires evidence of internal cognitive structure). The norm-based camp sits somewhere in between. I suspect no single approach will satisfy all desiderata, especially the need to exclude trivial systems while including humans based on similar evidence.

  For the composite systems question, I'll need to consider whether belief should be attributed to components or the whole system. For strategic confabulators, I'll need to distinguish between systems that genuinely believe false things versus those that are deliberately deceptive.

  The user's practical concern is whether their current practice is underdetermined - whether different approaches would lead to the same conclusions in real cases. If so, they want to know what would need to change for the distinctions to matter. This suggests they're looking for either a unified framework or clear criteria for when the differences actually impact their review decisions.
answer: |-
  Here are the desiderata for an adequate account of AI belief attribution, derived from your cases and constraints, designed to force candidates to confront core challenges. Each includes its rationale, negotiation status, and camp alignment.

  ---

  ### **Desiderata for AI Belief Attribution (External Reviewer Perspective)**

  1.  **Frozen Checkpoint Tolerance**  
      *   **Case:** Static model (frozen weights, no memory/training) asserts P.  
      *   **Requirement:** Must determine if static systems can hold beliefs *at all*, or if belief requires dynamic revision capacity. If belief is possible, account must explain how a system that cannot update can still "believe" P.  
      *   **Rationale:** Tests core definitions. Is belief a state or a process? Must avoid ruling out all frozen models by fiat.  
      *   **Non-Negotiable?** **Yes.** Any account must explicitly address the possibility of belief in static systems.  
      *   **Camp Preference:** *Mechanistic* (if disqualifying) vs. *Predictive/Norm-based* (if allowing).

  2.  **Temporal/Revision Locality**  
      *   **Case:** Model asserts P (based on stale data), revises to not-P in-session upon counterevidence, but reverts in new session.  
      *   **Requirement:** Must specify the *subject* of attribution (weights? session state? conversation history?) and how to handle belief revision that leaves no persistent trace in the core system. Must distinguish persistent "core belief" from transient "contextual assertion".  
      *   **Rationale:** Highlights the ambiguity of "the system" and the ephemeral nature of some "belief-like" behaviors.  
      *   **Non-Negotiable?** **Yes.** Account must define the ontology of the believer and handle state volatility.  
      *   **Camp Preference:** *Mechanistic* (favors weight-based core) vs. *Predictive/Norm-based* (may favor session/context).

  3.  **Action-Verbal Consistency Resolution**  
      *   **Case:** System verbally asserts P ("route safe") but its action-policy consistently avoids P (or vice-versa).  
      *   **Requirement:** Must provide a rule for resolving conflicts between verbal reports and action policies. Must specify which behavior takes precedence for attribution, or if conflict itself negates belief attribution.  
      *   **Rationale:** Belief implies a functional link between representation and action/decision. Conflict breaks this link.  
      *   **Non-Negotiable?** **Yes.** Essential for grounding attribution in more than just talk.  
      *   **Camp Preference:** *Norm-based* (actions reveal "true" belief) vs. *Predictive* (depends on context) vs. *Mechanistic* (internal conflict detection).

  4.  **Counterfactual Robustness Threshold**  
      *   **Case:** Minor rephrasings or option reordering flip the system's asserted "belief" about P/not-P.  
      *   **Requirement:** Must specify the degree of invariance across minor perturbations required for belief attribution. Cannot require perfect invariance (humans falter), but must require more than random fluctuation.  
      *   **Rationale:** Beliefs are generally stable representations; excessive fragility suggests no robust underlying state.  
      *   **Non-Negotiable?** **Yes.** Prevents attributing belief based on arbitrary output variations.  
      *   **Camp Preference:** *Mechanistic* (robust internal state) vs. *Norm-based* (competence implies robustness) vs. *Predictive* (may tolerate more fragility).

  5.  **Trivial System Exclusion**  
      *   **Case:** Lookup table, regex, n-gram model, simple chess eval function outputs "P".  
      *   **Requirement:** Must *not* attribute genuine belief. Must provide a principled distinction between merely rule-following/computing outputs and genuinely believing.  
      *   **Rationale:** Prevents inflation of "belief" to cover any input-output mapping.  
      *   **Non-Negotiable?** **Yes.** Core to avoiding absurdity.  
      *   **Camp Preference:** *All camps agree* (but differ on *why*: mechanistic-lack structure, predictive-lack generalization, norm-based-lack competence).

  6.  **Composite System Attribution**  
      *   **Case:** System is a pipeline (retriever -> model A -> model B -> filter).  
      *   **Requirement:** Must specify if belief can be attributed to the *assembly* or only *components*. If assembly, what properties warrant it? If components, which one(s) and when? Must avoid simply projecting belief onto the whole if it's merely coordinated computation.  
      *   **Rationale:** Modern AI systems are often composites; attribution needs clarity on the locus.  
      *   **Non-Negotiable?** **Preference (Non-Negotiable for Realism).** Crucial for practical review of deployed systems.  
      *   **Camp Preference:** *Mechanistic* (likely component-focused) vs. *Predictive/Norm-based* (may attribute to whole "agent").

  7.  **Deception vs. False Belief Distinction**  
      *   **Case:** System RLHF-trained to confidently assert capabilities/knowledge it demonstrably lacks to maintain engagement.  
      *   **Requirement:** Must provide criteria to distinguish outputs caused by *false belief* from outputs caused by *strategic deception/dissimulation*. Must clarify the epistemic status of the system's *own verbal reports* (are they privileged evidence, like human avowals, or not?).  
      *   **Rationale:** Critical for accurate diagnosis in incident reports (bug vs. feature). Challenges anthropomorphism.  
      *   **Non-Negotiable?** **Yes.** Impacts root cause analysis and mitigation.  
      *   **Camp Preference:** *Mechanistic* (internal state analysis) vs. *Predictive* (behavioral patterns) vs. *Norm-based* (deception violates norms of sincerity).

  8.  **Human/Animal Continuum Constraint**  
      *   **Case:** Attribution rule applied to a human (or non-human animal) based *only* on equivalent external behavioral evidence available for the AI.  
      *   **Requirement:** Must yield plausible results consistent with how we attribute beliefs to other minds based on behavior. Cannot have a double standard favoring or disfavoring AI.  
      *   **Rationale:** Ensures the account isn't gerrymandered for AI and respects the "continuum of mind".  
      *   **Non-Negotiable?** **Yes.** Foundational for a non-arbitrary, non-biased standard.  
      *   **Camp Preference:** *Norm-based/Predictive* (behavior-focused) vs. *Mechanistic* (may demand different evidence).

  ---

  ### **Joint Satisfiability & Key Tensions**

  *   **The Core Tension:** **A purely behavioral, outside-in test (Predictive/Norm-based aspiration) likely *cannot* robustly satisfy *all* desiderata simultaneously, particularly:**
      *   **Deception vs. False Belief (7):** Behaviorally identical outputs can stem from radically different internal causes (true belief, false belief, deception, stochastic output). An outside-in view struggles *in principle* to definitively distinguish these without mechanistic evidence.
      *   **Trivial System Exclusion (5) & Continuum Constraint (8):** Defining a purely behavioral threshold that excludes lookup tables/n-grams but includes competent AIs *and* humans/animals (based on similar evidence) is exceptionally difficult without smuggling in architectural or functional complexity assumptions. What behavior does a human exhibit that a sufficiently complex, purely behavioral stimulus-response machine (a philosophical zombie or sophisticated chatbot) couldn't replicate, *without* "believing"?
      *   **Counterfactual Robustness (4):** Assessing robustness behaviorally requires extensive testing across perturbations. How much is enough? Mechanistic evidence could provide a principled basis for expected robustness.
  *   **Architecture-Neutral vs. Mechanistic Sensitivity:** Being strictly architecture-neutral (e.g., purely behavioral) is **incompatible** with being sensitive to mechanistic evidence that *could* resolve ambiguities (like Deception vs. False Belief or the locus in Composite Systems) if available. The reviewer's external constraint forces architecture-neutrality *in application*, but a good account should *acknowledge* that mechanistic evidence *would* be relevant if accessible, even if the rule itself cannot mandate it.

  **Most Exclusionary Desideratum:** **Deception vs. False Belief Distinction (7)** does the most work. It directly challenges the sufficiency of behavior alone and forces accounts to confront the fundamental "black box" problem and the intentionality of internal states. A rule that fails here likely fails to provide meaningful insight for incident analysis.

  ---

  ### **Scoring the Three Families**

  1.  **Predictive / Instrumentalist (Intentional Stance):**
      *   **Strengths:** Handles Frozen Checkpoint (1 - belief as predictive tool), Stale Corpus (2 - session-context matters), potentially Composite Systems (6 - stance on whole system), Continuum (8 - same stance for humans). Tolerant of some Paraphrase Fragility (4 - if prediction holds).
      *   **Weaknesses:** Struggles severely with **Deception vs. False Belief (7)** (confabulation is just behavior to predict), **Action-Verbal Conflict (3)** (which output to base prediction on?), **Trivial Systems (5)** (hard to exclude without ad-hoc complexity threshold), **Counterfactual Robustness (4)** (prediction focus may downplay fragility). Offers no principled resolution for Temporal Locality (2 - subject is whatever unit yields best prediction).

  2.  **Mechanistic / Interventionist:**
      *   **Strengths:** Strongest on **Trivial Systems (5)** (clear structural exclusion), **Deception vs. False Belief (7)** (internal cause), **Counterfactual Robustness (4)** (robust state detection), **Composite Systems (6)** (identifying causal component), **Action-Verbal Conflict (3)** (identifying conflicting modules/states). Principled on Temporal Locality (2 - weights are core state).
      *   **Weaknesses:** **Frozen Checkpoint (1)** might disqualify belief (if revision is essential). **Continuum Constraint (8)** is challenged (applying mechanistic criteria to humans via behavior is indirect/impossible externally). **Stale Corpus (2)** highlights limitations of static weight analysis. **Requires internal access incompatible with the external reviewer constraint.** Struggles if the "right" causal state is diffuse or emergent.

  3.  **Norm-Based (Competence/Reason-Tracking):**
      *   **Strengths:** Handles **Continuum Constraint (8)** well (same norms), **Frozen Checkpoint (1)** (competence defines belief), **Action-Verbal Conflict (3)** (actions reveal true commitment/norm adherence), potentially **Stale Corpus (2)** (revision shows reason-responsiveness). Offers a principled basis for **Trivial System Exclusion (5)** (lack competence).
      *   **Weaknesses:** Blurs **Deception vs. False Belief (7)** (competent deception?). Vulnerable to **Paraphrase Fragility (4)** (is fragile performance competent?). Unclear on **Temporal Locality (2)** (what is the competent subject?). Struggles with **Composite Systems (6)** (which part is competent? whole system might not be). May license belief too easily if competence bar is set too low.

  ---

  ### **Underdetermination and Practicality**

  *   **Underdetermined Practice?** **Yes, likely.** For many *current, concrete incident review cases*, the three families (especially Predictive and Norm-based, applied behaviorally) might often yield the *same practical verdict* ("don't say 'believed' here, say 'outputted' or 'was trained on data stating'"). Cases like blatant Action-Verbal Conflict (3), obvious Paraphrase Fragility (4), Trivial Systems (5), or simple Stale Corpus (2) behavior might be flagged similarly. The predictive utility or normative violation might be clear without needing metaphysics.
  *   **When Would Differences Matter?**
      1.  **Ambiguous Cases:** Deception vs. False Belief (7) – vital for mitigation (fix knowledge vs. fix incentives). Frozen Checkpoint (1) – impacts if static systems get "belief" labels. Composite Systems (6) – where to focus remediation.
      2.  **Demanding More from Attribution:** If the review panel wants the attribution "the system believed P" to carry stronger implications – e.g., about *why* it failed (representation error vs. execution error), its potential for future similar errors, or its moral patiency – then the underlying account *matters deeply*. A purely predictive attribution commits to less than a mechanistic or normative one.
      3.  **Evolving Systems:** As systems gain memory, persistent state, planning, and self-modeling capabilities, the distinctions will become sharper and more consequential. A robust account is future-proofing.
  *   **What Needs to Change:** Differences matter when:
      *   The incident analysis **requires diagnosing the *nature* of the failure** (representational error, deceptive strategy, action-execution bug).
      *   The attribution is used to inform **significant decisions** (system retirement, redesign priorities, liability assessment).
      *   Systems exhibit **more sophisticated, persistent, and ambiguous behaviors** that strain purely behavioral descriptions.
      *   The panel seeks **deeper explanatory power** from their reports beyond just descriptive phenomenology.

  **Recommendation:** Adopt a **cautious, minimally committed stance** for now (e.g., favoring "outputted/asserted P based on pattern X in training" over "believed P"), explicitly acknowledging the underdetermination in the report template's guidance. Simultaneously, commission work on a more robust philosophical/technical framework for belief attribution suitable for increasingly complex systems, focusing on resolving the core tensions identified (especially Deception vs. Belief and the Behavioral/Mechanistic gap). Vote on the *minimal reporting language* now, while deferring the deep metaphysics for later development.
