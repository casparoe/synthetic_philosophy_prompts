prompt: |-
  I'm chairing a small author-meets-critics breakfast at a conference in the spring (25 people, bad coffee, I'm also teaching a seminar on normative powers that term and want to reuse the recording in class, so I'd like the questions to be reusable as teaching prompts too). Next up is a manuscript by a visitor, Prof. Nadia Ferrante — working title *Being Bound: Promising as a Second-Person Power*. Her core claim as I understand it: what makes a promise bind isn't convention, social utility, or the expectations and reliance it generates, but the exercise of a primitive normative power — by saying *I promise* to you in the right circumstances I make it the case that I owe you the performance, and in doing so hand you a limited authority over that bit of my conduct, which is why breaking it wrongs *you* in particular rather than just being a failure to bring about a good state of affairs. The part I find both genuinely original and shaky is what she calls the pre-conventional argument: she thinks the Humean conventionalist line and the practice-conception people get the order of explanation backwards, because (she claims — and I am not asking you to go dig up the empirical literature, just take her claims as given) very young children already treat giving one's word as specially binding in novel, convention-free settings, and broadly similar patterns show up across cultures; on her telling the convention is scaffolding bolted onto an antecedent social-cognitive capacity, not the source of the normativity.

  I've got 45 minutes with her before three critics take over, and I want eight to ten questions that go past having her restate the view. Context on her as a speaker: she's fast, generous, and she has two moves I want progressively closed off. When pressed on where the power comes from, she says some version of "that's just asking what makes a power a power; explanation stops here." When handed a hard case, she says "that's a question about the conditions of successful exercise, not about what the power does." I want the sequence to make both harder and harder to reach for, and to end with one question about what would actually make her abandon the framework. Please also make sure the list covers: (1) the gap between the obligation to keep the promise and whatever reason there already was to do the promised act — does her view explain that gap or just rename it; (2) promises where the promisee doesn't care, doesn't rely, and might rather not have been promised at all (the commitment-device cases, the promise blurted out to a stranger on a train); (3) release and waiver — why the promisee can let me off but I can't let myself off, and what that asymmetry is really evidence for; (4) trivial and redundant promises, including promising to do what I already ought to do — is a wholly content-independent obligation really generated there; (5) scope limits: impossible, coerced, or immoral promises, since a power view owes an account of invalidity that isn't just "it doesn't work there"; (6) promises to the dying, to groups, to people who can't understand what's being said; and (7) the pre-conventional argument itself — even granting her the data, why think early sensitivity to promising reveals a normative power rather than a disposition to *feel* bound, i.e. isn't this the old gap between explaining our sense of obligation and vindicating it. For each question give me one follow-up keyed to the answer she's most likely to give, and mark in brackets where you're just guessing about what she'd say.

  Two last things. Role: you're a moral philosopher who works on normative powers and second-personal reasons — take a few minutes to brainstorm before you write, and assume I'll delete anything soft or generic, so no "what drew you to this topic," no "where do you see the field going." And commit: don't give me a menu and leave the picking to me. Tell me which two questions you'd actually lead with and why, which single question is most likely to get her to say something that isn't already in the manuscript, and where *you* think the framework is weakest — with your reasons, stated at whatever confidence you actually have, and flagged where you're less sure.
