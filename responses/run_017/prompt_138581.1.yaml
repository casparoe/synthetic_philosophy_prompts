  First, I need to cover all the specified areas: the obligation gap, commitment-device cases, release/waiver asymmetry, trivial promises, scope limits, promises to non-standard entities, and the pre-conventional argument. Each question needs a follow-up based on likely responses. The user also wants to close off Ferrante's escape routes progressively.

  The user mentioned Ferrante's two moves: when pressed on the power's source, she says explanation stops there. For hard cases, she calls them issues of successful exercise. So questions need to corner her into addressing these directly. For instance, asking about the source of the power's authority might force her to elaborate instead of stopping. For hard cases, perhaps using impossible promises to challenge the power's limits.

  The most promising question to get new material might be about what would make her abandon the framework. Since she hasn't addressed falsifiability in the manuscript, this could elicit new thoughts. Also, leading with the gap between obligation and existing reasons could set the stage early, as it's fundamental to her thesis.

  The weakest point in her framework is likely the pre-conventional argument. Even if children treat promises as binding, that doesn't prove normative powers exist; it could be a feeling without objective obligation. The is-ought gap here is a significant challenge.

  Prioritizing questions: Start with the obligation gap to tackle the core claim. Then, perhaps the commitment-device cases to challenge the necessity of the second-person element. Follow-ups need to anticipate her responses. For example, if she dismisses trivial promises as unsuccessful exercises, push back by questioning what constitutes "right circumstances."

  Also, considering the seminar use, questions should be reusable as teaching prompts. They need to highlight key debates in normative powers, like content-independence or the second-personal nature of obligations. Ensuring each question addresses these themes will make them effective for classroom discussion.
answer: |-
  Here’s a sequenced, no-fluff list of 10 questions designed to pressure-test Ferrante’s framework, progressively block her default moves, and yield reusable teaching prompts. I’ve integrated your required coverage areas and flagged likely dodges.

  **Lead Questions & Sequence Rationale:**  
  Start with **#1 (Obligation Gap)** to immediately challenge the core mechanism of her power-conferring act. If the gap isn’t robustly explained, the entire "primitive power" claim wobbles. Follow with **#2 (Commitment-Device Cases)** to test the necessity of the second-personal dynamic – if the promisee’s stance is irrelevant, her "authority transfer" narrative weakens. These two destabilize foundational pillars before drilling into specifics.

  **Most Likely to Elicit New Material:**  
  **#10 (Abandonment Condition)** – She hasn’t addressed falsifiability in the manuscript. This forces meta-theoretical reflection beyond exegetical defense.

  ---

  ### The Question List:
  1. **The Obligation Gap**  
     *"You argue that promising creates a new, content-independent obligation that ‘gaps’ pre-existing reasons. But if the power’s exercise just is the creation of this obligation, what prevents ‘I promise’ from being merely a label for whatever psychological/social mechanism generates the feeling of being bound? In short, does your view explain the gap or ontologically inflate a phenomenological report?"*  
     - *Follow-up (if she invokes primitiveness):* "If the power’s operation is primitive, why is its output (the obligation) qualitatively distinct from other reason-generators like desires or intentions? What test could show it’s not epiphenomenal?" [Likely: she’ll say powers *just do* create obligations]

  2. **Commitment-Device Cases (Unwanted/Unrelied-Upon Promises)**  
     *"Take my promise to a stranger on a train that I’ll quit smoking – unsolicited, unwelcome, and never relied upon. If the stranger has no interest in my compliance, in what sense do they hold ‘authority’ over my conduct? Doesn’t this reduce your ‘owing to’ relation to a solitary duty-without-a-creditor?"*  
     - *Follow-up (if she distinguishes ‘authority’ from enforcement):* "If the promisee’s indifference doesn’t dissolve the obligation or my ‘owing it to them,’ what work is the second-personal element doing beyond being a historical trigger?" [Likely: she’ll stress the *structure* of obligation remains second-personal even if unenforced]

  3. **Release & Waiver Asymmetry**  
     *"Why can the promisee release me but I cannot release myself? If the obligation flows from *my* normative power, why am I alienated from revoking it unilaterally? Does this asymmetry support your view, or hint that obligation arises from the promisee’s normative position (e.g., their moral claim) rather than my act alone?"*  
     - *Follow-up (if she ties release to the power’s logic):* "Doesn’t your explanation (‘only the promisee can waive *their* authority’) presuppose the very authority-transfer it’s meant to justify? What independent principle grounds this constraint?" [Likely: she’ll call this inherent to second-personal powers]

  4. **Trivial/Redundant Promises**  
     *"If I promise to breathe for the next minute, or to keep a promise I already made to you, does this generate a *new*, binding obligation? If not, is it because the promise fails (invalid exercise), or because the content is non-normative/redundant? If the latter, doesn’t this collapse into a disguised form of substantive reason-dependence?"*  
     - *Follow-up (if she denies validity):* "What’s the minimal ‘normative space’ required for the power to latch onto? If promising to do what I *already* owe you is invalid, how is your power content-independent?" [Likely: she’ll say promises require "normatively governable acts"]

  5. **Scope Limits: Impossible/Coerced/Immoral Promises**  
     *"For promises to assassinate or leap tall buildings, you’d likely say the power wasn’t validly exercised. But if the power is primitive and non-conventional, what resources does your view have to explain invalidity that don’t tacitly import external norms (e.g., morality, possibility)?"*  
     - *Follow-up (if she cites defeasibility conditions):* "Aren’t those conditions parasitic on the very normative structures (morality, rationality) your view aims to ground? How can a primitive power be *intrinsically* limited by extrinsic norms?" [Likely: she’ll distinguish power-existence from exercise-conditions]

  6. **Promises to Non-Standard Promisees (Dying/Groups/Non-Understanders)**  
     *"If I promise to water your plants after your death, or to a group without a representative, or to a monolingual speaker in a language they don’t know, is the obligation generated? If so, who holds the authority? If not, is the failure due to the promisee’s incapacity or a flaw in my exercise?"*  
     - *Follow-up (if she requires uptake):* "Doesn’t requiring minimal understanding/receptivity reintroduce expectation or reliance through the back door?" [Guessing: she may relax uptake requirements for minimal cases]

  7. **Pre-Conventional Argument: Is/Ought Gap**  
     *"Even granting children exhibit proto-promissory behavior in novel settings, why think this reveals a *normative power* (an objective, reason-giving capacity) rather than a psychological disposition to *feel* bound? Isn’t this conflating the genealogy of a practice with its justification?"*  
     - *Follow-up (if she links phenomenology to normativity):* "How do you bridge the Humean gap? Does widespread pre-conceptual ‘bindingness’ intuition entail its objective reality?" [Likely: she’ll argue this intuition is best explained by a latent normative competence]

  8. **The Primitive Power’s Source**  
     *"When you say explanation ‘stops’ at the normative power, are you positing a brute moral fact? If so, how is this more satisfying than Scanlon’s brute ‘Principle F’? If not, what meta-normative commitments (e.g., robust moral realism, constitutive agency) does your view entail?"*  
     - *Follow-up (if she rejects meta-normative demands):* "Can your view survive agnosticism about the power’s metaphysical basis, or does it *require* a specific meta-ethics to avoid vacuity?" [Likely: she’ll deflect to practical phenomenology]

  9. **Powers vs. Practice-Conceptions**  
     *"Couldn’t your pre-conventional data support a hybrid view: we have an innate *disposition* to create bindingness via speech-acts, but the *content* of ‘bindingness’ is filled in by local practices? What evidence *exclusively* supports your non-conventionalist story?"*  
     - *Follow-up (if she cites cross-cultural similarity):* "If cultural practices scaffold a pre-existing capacity, why do promissory norms vary significantly (e.g., in remedies for breach, third-party enforcement)? Doesn’t variation suggest the ‘core’ power underdetermines normative form?" [Guessing: she’ll argue variation affects enforcement, not core obligation]

  10. **Abandonment Condition**  
      *"What empirical discovery or philosophical argument would force you to abandon the primitive normative power framework? For instance: conclusive evidence that children’s ‘promissory’ responses track perceived social penalties, not normative commitment; or a demonstration that all your hard cases reduce to expectation-based reasons without residue?"*  
      - *Follow-up (if she gives a vague answer):* "Could your framework become unfalsifiable? If no conceivable counterevidence exists, is it still a substantive thesis?"

  ---

  ### Where the Framework is Weakest (My View)
  I’m **highly confident** the Achilles’ heel is **the pre-conventional argument**. Even granting her developmental data, inferring an *objective normative power* from observed behavior commits a version of the naturalistic fallacy. Children’s reactions may reflect evolved cooperation heuristics (e.g., commitment signaling to enhance trust) without any distinctively *normative* ontology. Ferrante needs a compelling argument for why this phenomenology isn’t merely psychological – and she hasn’t provided one. This gap leaves her view vulnerable to reductionist critiques.  

  I’m **moderately confident** that **content-independence (#4)** is underdeveloped. If trivial/redundant promises are invalid, the power’s exercise depends on substantive background norms (e.g., "only governable acts can be promised"), undermining its primitiveness. This risks collapsing into a refined conventionalism where the "power" is just a formal marker for conventional normative triggers.

  **Why this list works for teaching:** Each question isolates a conceptual tension in normative powers (e.g., primitiveness vs. explainability, content-independence vs. scope constraints) perfect for seminar debates. The sequence models dialectical pressure – cornering a theorist’s defenses to expose fault lines.  

  Go hard on #1 and #2 upfront – they’re the linchpins. If she weathers those, #10 is your payoff. Break a leg (and bring better coffee).
