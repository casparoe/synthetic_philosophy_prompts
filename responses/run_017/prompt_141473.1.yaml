answer: |-
  ## Prospectus: The Temporal Structure of Moral Demandingness: Towards a Budgeted Consequentialism

  **Candidate:** [Your Name]
  **Programme:** MPhil in Moral Philosophy
  **Supervisor:** [Supervisor's Name, if known]
  **Proposed Start Date:** October 2024
  **Submission Date:** [Date]

  **1. Research Question:**
  Does the intuitive force of the demandingness objection to consequentialism derive significantly not from the *absolute magnitude* of its requirements, but from specific *temporal structural features* – namely unpredictability, lack of closure, and the impossibility of pre-payment? If so, can a form of "budgeted consequentialism," permitting agents to adopt fixed, self-binding resource/time allocations chosen at favourable moments, resolve this structural demandingness while remaining recognisably consequentialist?

  **2. Motivation & Gap in the Literature:**
  The demandingness objection persistently challenges consequentialism by alleging it requires agents to sacrifice personal projects, relationships, and well-being to an intuitively excessive degree for the greater good. Standard consequentialist responses predominantly address concerns about *magnitude*:
  *   **Agent-Centred Prerogatives:** Introduce permissions to favour oneself *up to a point*, thereby reducing the *amount* required (e.g., Scheffler).
  *   "Reasonable Demands" Strategies: Scale down required sacrifices to a psychologically sustainable *level* (e.g., Murphy, Cullity).
  *   **Decision-Procedure Distinctions:** Separate the criterion of rightness from practical deliberation, allowing rules of thumb that avoid constant maximisation, implicitly lowering the *felt burden*.

  These approaches implicitly accept that the core complaint is *how much* is required. However, empirical observation (e.g., the stark contrast between "pledge-style" givers feeling minimal demandingness and ad hoc responsive givers experiencing burnout despite comparable lifetime contributions) suggests that *how* demands are temporally structured – their "unschedulability" – is a crucial, overlooked factor. The objection retains force even if the total magnitude is reduced, if demands remain unpredictable, open-ended, and unprepayable. Existing strategies fail to address this structural dimension directly, presupposing magnitude as the primary issue. This project aims to isolate and analyse this structural demandingness.

  **3. Proposed Argument & Core Thesis:**
  The project will argue that the unschedulability of consequentialist demands (unpredictability, lack of closure, no pre-payment) generates significant psychological costs – anxiety, resentment, identity erosion – that contribute independently to the intuitive force of the demandingness objection. Consequently, a "budgeted consequentialism" is viable: agents may permissibly adopt a deliberatively chosen, self-binding "rule of life" specifying a fixed allocation of time and resources (a "budget") to personal pursuits versus optimific giving/action. Crucially, this budget is chosen *at a favourable moment* (e.g., career start, life-planning phase) with full awareness of optimific expectations, but once set, provides temporal structure (predictability, closure, pre-payment) shielding the agent from moment-by-maximisation pressure. This preserves consequentialism’s core commitment to maximising the good while mitigating structural demandingness.

  **4. Distinguishing Budgeted Consequentialism:**
  *   **Vs. Rule-Consequentialism (RC):** RC justifies rules based on their *general acceptance* maximising good. Budgeted consequentialism focuses on the *individual agent's psychological need for temporal structure*. The budget is a *personal, self-binding commitment*, not a socially coordinated rule. Its justification lies in mitigating structural burdens *for that agent*, enhancing their long-term capacity to contribute, even if deviating from immediate maximisation *within* the budget period. RC asks "What rule, if generally followed, is best?" Budgeted Consequentialism asks "What personal scheduling strategy, adopted by this agent at a favourable moment, best reconciles optimisation with sustainable agency?"
  *   **Vs. Indirect/Two-Level Consequentialism:** The decision-procedure strategy advises using rules *heuristically* to approximate maximisation better than direct calculation. Budgeted consequentialism permits *deliberately binding oneself to a potentially sub-optimal pattern* of giving/action *over time* (e.g., giving a fixed 30% annually) *specifically* to gain the psychological benefits of structure, even if breaking the budget *in a particular moment* might yield marginally more good. It is a substantive moral permission, not merely a pragmatic heuristic.

  **5. Methodology & Work Plan (9 Months):**
  *   **Months 1-2: Conceptual Groundwork & Literature Review:** Deep dive into demandingness literature (Scheffler, Kagan, Murphy, Cullity, Sobel, etc.), temporal dimensions of agency (Bratman, temporally extended agency), self-binding/Ulysses contracts (Elster), and psychological literature on decision fatigue, burnout, and predictable giving. Precisely define "unschedulability" features and "favourable moment."
  *   **Months 3-4: Developing Paired Cases & Thought Experiments:** Construct philosophically robust, intuitively accessible paired scenarios isolating temporal features. Examples:
      *   *Predictability:* Career-long £100,000 levy announced upfront & planned for VS same sum extracted via random, unpredictable demands over career.
      *   *Closure:* Donating £50,000 to a specific project with a clear endpoint VS £50,000 to an open-ended cause requiring perpetual vigilance/further asks.
      *   *Pre-payment:* Option to pre-pay a known future £20,000 demand VS facing an unprepayable £20,000 demand later.
      *   *Budgeting:* Lifetime fixed "personal budget" chosen early VS lifetime reactive giving totalling the same amount. Crucially, hold *total lifetime cost* and *overall life impact* constant while varying *only* the temporal structure.
  *   **Month 5: Testing the Structural Thesis:** Rigorous analysis of intuitions elicited by the paired cases. Does variation in temporal structure alone generate significant differences in perceived demandingness, fairness, or psychological sustainability? Address potential confounds.
  *   **Month 6: Articulating Budgeted Consequentialism:** Develop the positive view. Define the scope and limits of the "favourable moment" and permissible budget-setting procedures. Justify why binding oneself at T1 is permissible even if deviating from maximisation at T2.
  *   **Month 7: Addressing the "One-Level-Up" Regress Worry:** Confront the challenge: Doesn't demandingness reappear when *setting* the budget? Argue that:
      *   The "favourable moment" (e.g., planning phase) offers unique cognitive and motivational resources (less fatigue, broader perspective) making demanding choices *less burdensome* psychologically than constant, reactive demands.
      *   Budgeting transforms an open-ended, unpredictable demand into a bounded, predictable one *at the point of choice*. Choosing the *size* of a fixed burden is qualitatively different from facing an endless stream.
      *   While incentives to set budgets low or choose low-earning paths exist, this is analogous to other moral failings (selfishness under any theory); it doesn't invalidate the structure itself. The *possibility* of a budget being set too low is distinct from the *permissibility* of setting *a* budget.
      *   The regress weakens: Choosing a budget once at a favourable moment is significantly less demanding than a lifetime of unscheduled demands.
  *   **Month 8: Refining & Integration:** Integrate findings, refine the view in light of objections (especially the regress), solidify the distinction from RC and indirect consequentialism. Explore implications for moral psychology.
  *   **Month 9: Writing Up & Conclusion Formulation:** Draft dissertation chapters, synthesising the analysis into a coherent argument. Formulate final conclusions.

  **6. Possible Conclusions & Deciding Factors:**
  *   **Strong Support:** Paired cases robustly show structural features drive demandingness intuitions; budgeted consequentialism resolves them without collapsing into RC or being decisively undermined by the regress. *Deciding Factors:* Intuitive force of paired cases; successful defence against regress; clear differentiation from RC.
  *   **Moderate Support:** Structural features contribute significantly, but magnitude remains primary; budgeted consequentialism offers a partial, pragmatic solution but lacks deep moral justification. *Deciding Factors:* Paired cases show *some* effect, but magnitude still dominates; regress worry significantly weakens the view.
  *   **Weak/No Support:** Temporal structure has negligible independent effect on demandingness intuitions; intuitions are solely magnitude-driven. Budgeted consequentialism collapses into RC or is fatally undermined by the regress. *Deciding Factors:* Paired cases show no intuitive difference based on structure; budgeted view indistinguishable from RC; regress decisive.

  **7. Deliverables & Impact:**
  *   **Academic:** A thesis offering a novel analysis of demandingness, challenging the magnitude-centric focus, and proposing a distinctive form of consequentialism. It contributes to debates in normative ethics, moral psychology, and practical reasoning.
  *   **Non-Academic (e.g., Pledge-Style Giving Movement):** A philosophical framework validating the psychological sustainability and moral permissibility of structured, predictable giving commitments (like pledges) over reactive giving. Provides theoretical grounding for why such approaches might mitigate burnout and resentment while enabling significant long-term contribution. Offers guidance on the importance of deliberate "budget" setting at life-planning stages.

  **8. Failure Conditions:**
  The project would fail to substantiate its core thesis if:
  1.  **Empirical Failure (Intuitions):** The constructed paired cases elicit no significant difference in intuitive demandingness judgments when only temporal structure is varied (holding magnitude constant), strongly suggesting structure is irrelevant.
  2.  **Theoretical Failure (Collapse):** The proposed "budgeted consequentialism" cannot be coherently distinguished from standard rule-consequentialism despite rigorous attempts, or it demonstrably reduces to an indirect strategy without substantive moral permission.
  3.  **Regress Failure:** The "one-level-up" worry proves decisive, demonstrating that the demandingness burden at the point of budget-setting is equally or more psychologically severe than the unscheduled demands it seeks to avoid, nullifying the core advantage.

  This project promises a fresh perspective on a perennial problem in moral philosophy, grounded in real-world observations and offering potentially practical insights for ethical living under consequentialist commitments.
