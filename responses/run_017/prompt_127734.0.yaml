  Okay, the user is a philosopher specializing in fitting-attitude analysis and reasons for attitudes. They're dealing with a personal situation involving trust with their brother after a six-year estrangement. Their partner and therapist are suggesting ways to rebuild trust, but the user is skeptical because these seem like wrong-kind reasons. They want a thorough analysis of the problem, applied to their case.

  First, I need to address the classic wrong-kind-of-reasons problem. The fitting-attitude account says something is valuable if there are reasons to have a pro-attitude toward it. The demon case shows a problem: pragmatic reasons (like avoiding torture) don't make the demon admirable, yet they're reasons to admire it. So the account must distinguish between right-kind (RK) and wrong-kind (WK) reasons. Simply saying "reasons of the right kind" isn't enough—it's circular without explaining what makes a reason right-kind. This problem affects all pro-attitudes but might be more severe for some, like belief, where pragmatic reasons seem particularly problematic.

  Now, for the user's case A: proleptic reasons. They have a reason to trust now because trust will be fitting later, and starting now is necessary to get there. This reason is object-given—it's about the brother's reliability, even if that reliability isn't fully present yet. Standard RK/WK distinctions might misclassify this. Content-based restrictions (focusing on features of the object) would likely count this as RK because it's about the brother's traits. However, since those traits aren't fully actualized, some might argue it's WK. This reveals a gap in the standard framework.

  For case B: attitude-dependent reasons. Trusting the brother partly constitutes a valuable relationship. So the reason to trust is that it helps create something valuable. But this reason depends on the attitude itself—it's bootstrapping. Is this RK? If trust is seen as partly volitional, it might be more like reasons for actions, where such reasons are acceptable. But if trust is non-volitional like belief, it might feel more like WK. This shows the problem changes based on the attitude's nature.

  Basing problem: if they trust because the therapist said to, not because of the brother's reliability, that's a wrong-basis issue. This is separate from RK/WK—it's about how the attitude is formed, not the reason's kind. The fitting-attitude account might need an additional restriction on proper basing.

  Finally, some debates are verbal. "Fitting" might be interpreted differently—some see it as correctness (truth-tracking), others as reasonableness given the evidence. This affects whether proleptic reasons count as fitting. Also, reasons for attitudes might not be a unified category; different attitudes have different constraints.

  Key unsettled issues: whether proleptic reasons are RK, how attitude-dependence affects reasons, and if volitionality matters. The basing problem is recognized but not fully integrated. The user's real need is clarity on whether their reasons for trusting are legitimate or pragmatic, to navigate their reconciliation. They might also seek validation for their caution, understanding that their reasons could be RK if framed properly, but the gap between reason and attitude formation remains a challenge.
answer: |-
  Here's a structured analysis addressing your concerns, separating settled points from contested terrain. I'll flag standard views versus debates, and explicitly note any conceptual innovations introduced for your cases.

  ---

  ### **1. Setting Up the Wrong Kind of Reasons (WKR) Problem**
  - **Core FA Account**: For X to be valuable (e.g., trustworthy) is for there to be *reasons* to have a pro-attitude (e.g., trust) toward X.  
  - **The Demon Case Pressure Point**:  
    - Demon threatens torture unless you admire it.  
    - **Reason to admire?** Yes (pragmatic: avoid torture).  
    - **Admirable?** No (the demon lacks admirable properties).  
    - **Problem**: FA conflates *all* reasons for attitudes with *value-conferring* reasons. The account needs to exclude "wrong-kind" reasons (WKRs) like threats/bribes, retaining only "right-kind" reasons (RKRs) that track the object’s actual properties.  
  - **Why "Just Restrict to RKRs" Fails**:  
    - **Circularity**: Saying "RKRs are reasons that make the attitude fitting" presupposes what "fitting" means.  
    - **Explanatory Gap**: We need an *independent criterion* to distinguish RKR/WKR without invoking value/fittingness.  
  - **Where It Bites**:  
    - **Value-Theory**: FA accounts of *value* (e.g., trustworthiness as a value) are hit hardest because WKRs falsely "create" value.  
    - **Attitude-Specificity**:  
      - *Belief*: WKRs (e.g., "believe X for $1M") are clearly alien; belief aims at truth.  
      - *Emotions/Trust*: More elastic. Fear can be fitting (e.g., a snarling dog) or pragmatic (e.g., fearing a boss to stay alert).  
    - **Distinct from "Too Many Values"**: That’s a separate *overgeneration* problem (e.g., "being heavy is a reason to move it, so heaviness is valuable?"). WKR is about *corrupt* reasons, not *excessive* ones.  

  **Settled vs. Contested**:  
  - **Settled**: WKR problem is fatal for naïve FA accounts; *some* restriction is needed.  
  - **Contested**: Whether a *unified* solution works across attitudes. Some (e.g., Schroeder, Parfit) argue for content-based restrictions; others (e.g., D’Arms and Jacobson) say attitudes have distinct "natures" requiring piecemeal solutions.  

  ---

  ### **2. Your Case A: Proleptic Reasons**  
  - **Structure**: Reason to trust *now* because (a) trust *will* be fitting later, (b) starting now is necessary to reach that state, (c) the attitude targets *future* goodwill/reliability.  
  - **Standard RK/WKR Diagnosis**:  
    - **State-Given?** No (no penalty for withholding trust; not pragmatic).  
    - **Object-Given?** Yes (directed at brother’s dispositional traits).  
    - **But**: The fittingness-grounding properties (reliability) aren’t *yet* fully actualized.  
  - **Screening Strategies**:  
    - **Content-Based** (e.g., "reasons must cite properties of the object"): *Likely classifies as RKR* (you’re citing his *developing* reliability).  
    - "**What the Attitude Presents**" (e.g., trust presents its object *as* reliable): *Ambiguous*. Trusting *now* might misrepresent current evidence.  
    - **Fittingness-Tracking** (e.g., "reasons must be evidence of fittingness"): *Leans WKR* – thin evidence may not support fittingness *yet*.  
  - **Verdict**:  
    - Proleptic reasons **challenge the temporal rigidity** of FA. They’re *not* WKRs (no bribe/threat), but may not be *currently* fitting.  
    - **Innovative Label**: These are "**telescopic RKRs**" – reasons grounded in the *anticipated* fittingness of an attitude, mediated by a process of cultivation.  
    - **Contested**: Traditionalists say this dilutes "fittingness"; progressives (e.g., in "moral uncertainty") argue such reasons are legitimate for non-ideal agents.  

  ---

  ### **3. Your Case B: Attitude-Dependent Reasons & Trust**  
  - **Structure**: Reason to trust because your trust *constitutively enables* a valuable relationship (which couldn’t exist without mutual trust).  
  - **Bootstrapping Issue**: The reason (relationship value) depends on the *existence* of the attitude (trust), creating circularity: "I should trust because if I trust, something good exists."  
  - **Comparison to Demon**:  
    - Demon: External incentive (torture avoidance).  
    - Attitude-Dependence: Internal to the attitude’s role in constituting value.  
  - **Can FA Machinery Handle This?**  
    - **Standard RK/WKR**: Often *excludes* bootstrapping (e.g., "admire me so I become admirable" is WKR).  
    - **But for Trust**: If trust is *volitional*, it might be analogous to "acting as if" in practices (e.g., promising).  
  - **Role of Volition**:  
    - **Non-Volitional Attitudes (e.g., belief)**: Bootstrapping is clearly WKR (can’t believe *because* it creates value).  
    - **Trust**: If trust has a *volitional component* (as your therapist implies), attitude-dependent reasons **become RKRs** – akin to reasons for commitments (e.g., "marry them to build a life together").  
    - **Contested**: Whether trust is volitional is disputed. Some (e.g., Jones) argue it’s "pragmatically voluntary"; others (e.g., Hieronymi) say it’s belief-like and non-volitional.  

  **Verdict**: Attitude-dependent reasons are **not WKRs** *if* the attitude is volitional. For trust, this is a gray zone – your case highlights a gap in FA theory.  

  ---

  ### **4. Basing Problem**  
  - **Scenario**: You trust for the *right* reason (brother’s reliability) but base it on your therapist’s advice.  
  - **Distinct from WKR?**:  
    - **Yes**. WKR is about *which reasons exist*; basing is about *how you form the attitude*.  
    - **Analogy**: Believing a true fact (RKR) *because* you flipped a coin (wrong basis).  
  - **Need for a Second Restriction?**:  
    - FA accounts *can* say the attitude is fitting (if RKRs exist), but your *basing** is defective.  
    - This doesn’t collapse into WKR: The therapist’s advice might *point to* RKRs (e.g., "he’s reliable"), making it an *indirect* RKR.  
    - **But**: If you trust *only* because "therapist said so," it’s **inadequate basing** – you’re not responsive to the object’s properties.  
  - **Settled**: Basing is a separate epistemic norm; FA needs no *additional* restriction, but must acknowledge that fittingness ≠ proper formation.  

  ---

  ### **5. Is This Verbal? Disputes About "Fitting" and Unity**  
  - **"Fittingness" Disputes**:  
    - **Minimalists**: Fittingness = correctness (e.g., fear fits dangers). Proleptic reasons fail (not *currently* correct).  
    - **Normativists**: Fittingness = *reasonableness* given evidence. Proleptic reasons may qualify (reasonable to cultivate trust).  
  - **Unity of Reasons for Attitudes**:  
    - **Unifiers** (e.g., Scanlon): All reasons for attitudes are subject to the same RKR/WKR filter.  
    - **Pluralists** (e.g., D’Arms and Jacobson): Attitudes have different "natures" – fear vs. trust vs. admiration demand distinct treatments.  
  - **Where It Bites for You**:  
    - If "fitting" requires *current* correctness, your proleptic reason is WKR.  
    - If reasons for trust are governed by "relationship norms," not truth-tracking, attitude-dependent reasons become central.  

  ---

  ### **Synthesis for Your Reconciliation**  
  - **Proleptic Reasons (A)**: Likely **RKR** under content-based views, but contingent on *evidence* of change (e.g., therapy, promises). Not demon-like.  
  - **Attitude-Dependent Reasons (B)**: **RKR if trust is volitional**; if not, it’s a pragmatic WKR. Your therapist’s "practice" view leans volitional.  
  - **Basing**: Trusting *only* to please your partner/therapist is wrong-basis; trusting because *they note evidence* of reliability is sound.  
  - **Core Tension**: FA accounts struggle with **temporal gaps** and **volitional attitudes**. Your distrust isn’t irrational – FA explains why thin evidence justifies caution, but also why proleptic/attitude-dependent reasons aren’t mere bribes.  

  **Contested Take**: I propose that for reparative relationships, **proleptic RKRs are valid** – they acknowledge the *process* of trust-building, not just its end state. This extends FA into dynamic contexts.
