  So EU(pay) < EU(not pay) by $1000, so CDT says not pay.

  FDT in Version B: the decision being predicted was A1, and you are now making decision A2. Since they are different decisions, FDT does not take your current decision as input to the function that outputs A1. Therefore, it does not assume that by choosing A2="pay", you are controlling the output of A1. So it sees no causal or counterfactual influence of your current choice on the prediction about A1. Therefore, it also computes like CDT: your action now only costs you $1000 and does not affect the bequest. So FDT says not pay.

  Summary for Version B:
