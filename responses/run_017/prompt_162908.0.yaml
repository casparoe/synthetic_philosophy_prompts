  Then EU(A2="not pay") = 0 + 0.26*10000 = 2600

  So EU(pay)=6400 > EU(not pay)=2600, so EDT says pay.

  CDT in Version B: your action A2 does not cause A1 or the prediction about A1. So the probability that the prediction about A1 was "pay" is some prior, say p. Then EU(pay)= -1000 + p*10000
  EU(not pay)= p*10000  [because you get the bequest with probability p without paying anything]
  So EU(pay) = -1000 + 10000p
