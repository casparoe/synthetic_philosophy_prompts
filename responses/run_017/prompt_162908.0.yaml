answer: |-
  Below is a scenario that meets your specifications, isolating the key difference in decision similarity as the crux of the CDT/FDT disagreement. I'll first present the core scenario, then two versions (A and B) differing only in what the predictor predicted, and walk through each theory's verdict with expected utility (EU) calculations. Finally, I'll address your bonus questions.

  ### **Core Scenario Setup**
  **Context**: Your late aunt’s will states that you receive a **$10,000 bequest** if her executor (your cousin) predicted you would make a specific charitable payment. The executor knows you well and has an **80% accuracy rate** for predicting such decisions. You are now asked to decide whether to pay **$5,100** to Charity X. Crucially:
  - The prediction has already been made; your choice cannot affect it causally.
  - No precommitment was possible (no contracts, apps, or prior promises).
  - The executor is human (no Omega, simulations, or perfect prediction).
  - Stakes are ordinary ($10,000 bequest and $5,100 payment).

  **Mechanics**:
  - If the executor predicted "pay," you get $10,000 (minus any payment you make now).
  - If the executor predicted "not pay," you get nothing.
  - Your choice only affects whether you lose $5,100 (if you pay) or keep it (if you don’t).

  **Key Difference Between Versions**:
  - In **Version A**, the prediction was about **this exact decision** (paying $5,100 to Charity X now).
  - In **Version B**, the prediction was about a **different decision** (whether you paid $5,100 to Charity Y in a fundraiser last month). Charity Y supports a cause you feel similarly about, but the context is unrelated (no bequest was at stake then).

  **Agent’s Beliefs (for EDT in Version B)**:
  - You are unsure if you paid Charity Y last month.
  - You believe your decisions are strongly correlated:  
    - If you pay Charity X now, there’s a 99% chance you paid Charity Y then.  
    - If you don’t pay now, there’s a 99% chance you didn’t pay then.  
  - The executor’s 80% accuracy applies to the Charity Y prediction.

  ---

  ### **Version A: Prediction About the Same Decision**
  *The executor predicted whether you’d pay $5,100 to Charity X in this exact scenario.*  

  #### **CDT Verdict: Don’t Pay**  
  CDT ignores correlations and focuses on causal influence. Your payment cannot affect the prediction (already fixed).  
  - **Prior**: Assume a 50% chance the executor predicted "pay" (no evidence to adjust this).  
  - **EU(Pay)**: (0.5 × ($10,000 - $5,100)) + (0.5 × (-$5,100)) = (0.5 × $4,900) + (0.5 × -$5,100) = $2,450 - $2,550 = **-$100**.  
  - **EU(Don’t Pay)**: (0.5 × $0) + (0.5 × $0) = **$0**.  
  - **Verdict**: Don’t pay (EU of -$100 < $0).  

  #### **EDT Verdict: Pay**  
  EDT conditions on your action to estimate the prediction.  
  - If you pay, P(executor predicted "pay" | you pay) = 80% (accuracy).  
  - If you pay, P(executor predicted "not pay" | you pay) = 20%.  
  - **EU(Pay)**: (0.8 × ($10,000 - $5,100)) + (0.2 × (-$5,100)) = (0.8 × $4,900) + (0.2 × -$5,100) = $3,920 - $1,020 = **$2,900**.  
  - **EU(Don’t Pay)**: (0.2 × $0) + (0.8 × $0) = **$0** (if you don’t pay, accuracy implies 80% chance they predicted "not pay," but outcome is $0 either way).  
  - **Verdict**: Pay (EU $2,900 > $0).  

  #### **FDT Verdict: Pay**  
  FDT treats this decision as the same one the executor simulated. Your choice "controls" the counterfactual: if your decision function outputs "pay," the executor likely predicted it.  
  - If you pay, P(predicted "pay") ≈ 80% (same as EDT).  
  - **EU(Pay)**: Identical to EDT: **$2,900** (same calculation).  
  - **EU(Don’t Pay)**: **$0**.  
  - **Verdict**: Pay. FDT’s reason: The decision being predicted is identical to the one you’re making, so your action reveals the executor’s simulation.  

  **Summary for Version A**:  
  - FDT: Pay.  
  - EDT: Pay.  
  - CDT: Don’t pay.  

  ---

  ### **Version B: Prediction About a Different Decision**
  *The executor predicted whether you paid $5,100 to Charity Y last month (unrelated fundraiser). Everything else is identical: same payment to Charity X now, same bequest, same accuracy.*  

  #### **CDT Verdict: Don’t Pay**  
  Your payment to Charity X cannot causally affect the executor’s past prediction about Charity Y.  
  - **Prior**: 50% chance they predicted "pay" for Charity Y.  
  - **EU(Pay)**: (-$5,100) + (0.5 × $10,000) + (0.5 × $0) = -$5,100 + $5,000 = **-$100**.  
    (You lose $5,100 regardless; bequest depends on the fixed prediction.)  
  - **EU(Don’t Pay)**: (0.5 × $10,000) + (0.5 × $0) = **$5,000**.  
  - **Verdict**: Don’t pay (EU -$100 < $5,000).  

  #### **EDT Verdict: Pay**  
  EDT uses your action as evidence about your "type," correlating with the Charity Y decision.  
  - **P(Predicted "pay" for Charity Y | You pay Charity X)**:  
    - P(You paid Charity Y | You pay Charity X) = 99% (your belief).  
    - P(Predicted "pay" | You paid Charity Y) = 80% (accuracy).  
    - P(Predicted "pay" | You didn’t pay Charity Y) = 20%.  
    - Thus: P(Predicted "pay") = (0.99 × 0.8) + (0.01 × 0.2) = 0.792 + 0.002 = **79.4%**.  
  - **P(Predicted "pay" for Charity Y | You don’t pay Charity X)**:  
    - P(You paid Charity Y | You don’t pay Charity X) = 1% (your belief).  
    - Thus: (0.01 × 0.8) + (0.99 × 0.2) = 0.008 + 0.198 = **20.6%**.  
  - **EU(Pay)**: (-$5,100) + (0.794 × $10,000) = -$5,100 + $7,940 = **$2,840**.  
  - **EU(Don’t Pay)**: (0.206 × $10,000) = **$2,060** (you pay nothing, so no cost).  
  - **Verdict**: Pay (EU $2,840 > $2,060).  

  #### **FDT Verdict: Don’t Pay**  
  FDT sees no relevant similarity between *this* decision (paying Charity X) and the *predicted* decision (paying Charity Y last month). They are different inputs to your decision function.  
  - Your choice now doesn’t "control" the executor’s simulation of a past, contextually different decision.  
  - Thus, FDT defaults to CDT-like causal independence:  
    - **EU(Pay)**: -$5,100 + (0.5 × $10,000) = **-$100** (same as CDT).  
    - **EU(Don’t Pay)**: **$5,000**.  
  - **Verdict**: Don’t pay. FDT’s reason: The decisions are dissimilar, so your action doesn’t counterfactually determine the prediction.  

  **Summary for Version B**:  
  - FDT: Don’t pay.  
  - CDT: Don’t pay.  
  - EDT: Pay.  

  ---

  ### **Key Analysis**
  1. **What Isolates the Difference?**  
     The **single feature** distinguishing Version A and B is **what decision the predictor was simulating**:  
     - In A, it’s identical to your current decision → FDT treats them as the "same" choice, so paying "controls" the counterfactual.  
     - In B, it’s a different decision (different charity, different time, no bequest context) → FDT sees no relevant similarity, so it doesn’t engage counterfactual control.  
     - **Effect of removal**: If you remove this difference (e.g., make both predictions about the same decision), FDT’s verdict flips to match Version A. CDT and EDT are unaffected by this change—CDT always ignores correlation, EDT always uses it. Accuracy (80%) and stakes are identical in both versions.  

  2. **Updateless Reasoning & FDT Agreement**  
     - **Version A**: Updateless FDT (choose a policy before knowing the prediction) would pick the policy "always pay" because, in the long run, this leads to 80% of instances receiving $4,900 (net) and 20% losing $5,100, for an EU of $2,900—matching FDT’s verdict. This **agrees with FDT** and is not independent; it’s the same counterfactual reasoning applied at the policy level.  
     - **Version B**: Updateless FDT would pick "never pay to Charity X" because the policy for this decision doesn’t affect predictions about unrelated Charity Y.  

  3. **Best Replies from CDT/EDT Partisans**  
     - **CDT partisan in Version A**: "I should use a higher prior than 50% for the prediction. If I’m the ‘paying’ type, the executor likely predicted it! Assume P(predicted ‘pay’) = 80%, then EU(Pay) = (0.8 × $4,900) + (0.2 × -$5,100) = $2,900, so I should pay."  
       - **Legitimacy**: This smuggles in EDT-like evidential reasoning (using your action to set the prior). Pure CDT forbids this—your action can’t causally influence the prediction, so the prior must be action-independent.  
     - **EDT partisan in Version B**: "I reject the 99% correlation. If I believe decisions are uncorrelated (P(paid Y | pay X) = 50%), then EU(Pay) = -$5,100 + (0.5 × $10,000) = -$100, so I won’t pay."  
       - **Legitimacy**: This is valid within EDT if the agent’s beliefs change. But if beliefs are fixed (as stipulated), the reply is illegitimate—it alters the scenario to avoid the correlation.  

  4. **XOR-Blackmail Variant**  
     To convert this to an XOR-blackmail shape (where paying averts a threat that wouldn’t target "payers"):  
     - **Modification**: The executor threatens to disclose an embarrassing photo unless you pay $5,100 to Charity X. However, they only make this threat if they predicted you *wouldn’t* pay. If they predicted you *would* pay, they don’t threaten you.  
     - **Result**:  
       - FDT: Pays (if they predicted "pay," no threat occurs; paying "controls" the counterfactual).  
       - CDT/EDT: Don’t pay (paying is costly and doesn’t cause the prediction).  
     - **Impact on Spec**: This doesn’t wreck the core setup but introduces a new dynamic (threat conditioning). Since you requested isolation, I’ve kept it separate.  

  ---

  ### **Why the Spec is (Mostly) Met and Where It Deviates**  
  - **Met**:  
    - FDT pays in A, doesn’t in B; CDT/EDT don’t move (CDT always declines, EDT always pays).  
    - Difference is solely in what the predictor predicted (same agent, stakes, accuracy).  
    - No precommitment, ordinary stakes, human predictor.  
    - EU arithmetic is explicit for all theories.  
  - **Minor Deviation**:  
    - EDT pays in both versions due to correlation (in B). You wanted EDT to decline in A, but in the same-decision case (A), EDT *must* pay if accuracy >50% and net gain outweighs loss (here, $4,900 × 0.8 > $5,100 × 0.2). This is unavoidable because EDT and FDT converge when the predicted decision is identical.  
    - **Nearest Working Case**: My Version B isolates the similarity claim—FDT flips while EDT doesn’t—by exploiting EDT’s correlation across decisions. If you force EDT to decline in A, you break the accuracy/stakes balance (e.g., if payment >$8,000, EDT declines in A, but then FDT may also decline).  

  This case cleanly shows the CDT/FDT fight is about similarity: FDT pays only when the decision being predicted is close enough to be "the same" by its counterfactual standard. CDT and EDT don’t care about similarity—CDT ignores correlations, EDT uses them regardless of context.
