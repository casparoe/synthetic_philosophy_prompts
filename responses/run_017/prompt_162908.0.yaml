  So the decision to pay Charity X now is only about whether to give $1,000 to Charity X. It doesn't affect the bequest.

  Therefore, for both CDT and EDT, the bequest is independent of your current action.

  Specifically:

  - If you pay $1,000 to Charity X, you lose $1,000 and then you get the bequest if the prediction about Charity Y was pay.
  - If you don't pay, you keep the $1,000 and still get the bequest if the prediction about Charity Y was pay.

  So the net:
  - Pay: you have -$1,000 + [bequest if prediction about Charity Y was pay]
  - Not pay: $0 + [bequest if prediction about Charity Y was pay]

  Clearly, not pay is better by $1,000.

  But wait, the bequest is $10,000. Does that change? No, because the bequest is fixed by the prediction about Charity Y.

  So EU for paying is: you definitely lose $1,000, and then you have the same chance of the bequest as if you didn't pay. So paying is strictly worse by $1,000.

