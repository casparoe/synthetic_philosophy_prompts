  But we want in Version B for EDT to say pay? Why would EDT say pay in Version B? EDT conditions on the action and might think that paying now is evidence that you are the kind of person who pays, and therefore that you paid in the Charity Y situation. So it might think that paying now is evidence that the prediction about Charity Y was pay, hence evidence that you will get the bequest.

