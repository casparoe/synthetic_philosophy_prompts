  Now, we need to ensure that the only difference between Version A and Version B is what the predictor was predicting.

  In Version A: predictor is predicting the very decision you are now making.
  In Version B: predictor is predicting a different decision (about Charity Y).

  The mechanics of the will are the same: if the prediction was "pay", you get the bequest; if "not pay", you don't.

  The payment you are making now in both versions is to Charity X, and it's $5,100, and the bequest is $10,000.

  In Version B, the prediction is about whether you would have paid to Charity Y in a different context.

  The correlation between paying now (Charity X) and paying then (Charity Y) is assumed to be high (0.99) for the conditional probability.

  Now, to answer the other parts of the query.

  **What each theory says and why, with EU arithmetic:**

  Version A: 
  - CDT: does not condition on action. Uses prior p=0.5 for the prediction. EU(pay)=0.5*4900 + 0.5*(-5100)= -100. EU(not pay)=0. So not pay.
