  ED conditions on A2 to update about what A1 might have been and hence what the prediction of A1 might have been.

  Specifically, P(prediction about A1 was "pay" | A2="pay") might be high if there is a correlation between A1 and A2.

  Since the predictor knows you well and is 80% accurate about A1, and also might have a model that if you are the kind of person who pays to Charity X now, you are also the kind who would have paid to Charity Y then.

  So let's assume that the agent believes that there is a correlation between A1 and A2. Specifically, P(A1="pay" | A2="pay") = c, and similarly for not.

  Then P(prediction about A1 was "pay" | A2="pay") = P(pred="pay" | A1="pay") * P(A1="pay" | A2="pay") + P(pred="pay" | A1="not pay") * P(A1="not pay" | A2="pay")

