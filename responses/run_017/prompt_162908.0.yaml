  But without more information, let's assume that the agent believes that their type is consistent: if they pay now (A2="pay"), it's likely they would have paid then (A1="pay"). Let's set P(A1="pay" | A2="pay") = 0.9, and P(A1="not pay" | A2="pay") = 0.1.
  Similarly, P(A1="pay" | A2="not pay") = 0.1, etc.

  Then for A2="pay":
  P(pred="pay" | A2="pay") = P(pred="pay" | A1="pay") * P(A1="pay" | A2="pay") + P(pred="pay" | A1="not pay") * P(A1="not pay" | A2="pay")
  = 0.8 * 0.9 + 0.2 * 0.1 = 0.72 + 0.02 = 0.74

  Similarly, P(pred="not pay" | A2="pay") = 1-0.74=0.26

