  But what about FDT? In Version B, the decision is different. FDT does not see this decision as the same as the one that was predicted (which was about Charity Y). Therefore, it does not assume that the predictor's simulation of you for Charity Y is the same as your decision now for Charity X. So it doesn't use the same counterfactual. Therefore, it also sees that your action now doesn't affect the prediction about Charity Y, so it also says not pay.

