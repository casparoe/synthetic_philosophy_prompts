prompt: |-
  My roommate and I got into an argument the other night about whether suffering-focused ethics is even a real research program or just utilitarianism with the sign flipped, and while I think she's wrong about that, it did make me realize I have no idea where the actual work in it is. Context: I'm helping a small funder put together a call for proposals — something like six philosophers for two years, conceptual work only, no data collection, no new empirical stuff about wild-animal welfare or anything like that — and the point isn't to win converts to negative utilitarianism, it's to figure out which questions, once answered, would most change what a suffering-focused community should actually do with its time and money. Also most of the people who'd apply come out of the longtermist end of things, so I want to know which crux, if it went the other way, should push the whole portfolio toward near-term work instead. So: a defended agenda, not a survey of the literature, and definitely not a reading list.

  Here's my own stab at the candidate questions, but please add ones I'm missing and tell me if I've drawn the boundaries wrong. (a) Whether suffering takes lexical priority over happiness at every intensity or only above some threshold — and whether a thresholds version even deserves the name. (b) Whether the standard population-ethics asymmetry that negative views lean on — reason not to create suffering lives, no symmetric reason to create happy ones — survives once you drop person-affecting restrictions, or quietly collapses into something you can't use. (c) How to count suffering in minds whose sentience we're only uncertain about: is that just expected value with a credence multiplier, or does being unsure whether there's a subject there at all do something structurally different? (d) Whether a view that treats the painless removal of a sufferer as a way of reducing suffering has a genuine reductio available against it, or whether critics have been over-reading that implication for decades. (e) Whether suffering-focused axiology should be specified over quantities we could in principle measure or over something mind-independent, given that most of the world's suffering by headcount is in animals we can barely observe. My roommate also floated a homebrew view she calls "threshold lexicality with credence-discounted uncertain suffering" — suffering above some intensity counts lexically, and suffering in possibly-sentient minds enters discounted by credence rather than as its own expectation term — and I want to know where something like that lands.

  What I actually want is a ranking. Tell me which questions are upstream of which, in the sense that answering one changes what the others even ask; which are realistically tractable in two years by people with logic and decision theory and no lab; which are neglected relative to how much hangs on them; and which you'd defund outright, either because the answer wouldn't change anyone's practice or because they're really empirical questions wearing a philosophical costume. For each, say what kind of result over the next two years would move it up or down your list. Give me exactly six numbered items, each no more than three sentences, no intro and no conclusion: five ranked priorities, plus a sixth on what you'd cut and why.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're helping a funder create a call for proposals focused on suffering-focused ethics (SFE). The goal is to identify key conceptual questions that, once answered, would most influence how a suffering-focused community allocates resources. The user wants a ranked list of these questions, considering factors like upstream influence, tractability, neglect, and practical impact. They also mentioned that applicants are likely from the longtermist community, so one crux should determine if the portfolio shifts to near-term work.

  First, I need to understand the core of SFE and how it differs from utilitarianism. The user’s roommate argued it's just flipped utilitarianism, but the user disagrees. The key is to highlight questions that address foundational aspects unique to SFE, like lexical priority, population ethics asymmetries, and handling uncertain sentience.

  Looking at the user's proposed questions:  
  (a) Lexical priority thresholds – crucial because if suffering isn't always lexically prior, SFE might resemble other frameworks.  
  (b) Population ethics asymmetry – if this collapses without person-affecting views, it weakens a core SFE argument.  
  (c) Uncertain sentience – practical for animal welfare focus, affects resource allocation.  
  (d) Painless elimination – controversial, but resolving the reductio could clarify moral implications.  
  (e) Measurement vs. mind-independence – impacts how we assess suffering, especially in animals.  

  The roommate's "threshold lexicality with credence-discounted uncertain suffering" combines (a) and (c). Integrating this might be a priority.

  Now, ranking them. Upstream questions are those whose answers affect others. For example, (b) on population ethics asymmetry is upstream because if asymmetry collapses, it undermines SFE's foundation, making other questions less relevant. Similarly, (a) on lexical threshold defines the scope of SFE itself. These should be top priorities.

  Tractability matters. Questions needing only logic and decision theory, not empirical data, are suitable. (b) and (a) fit here. (c) also seems tractable with decision theory frameworks.

  Neglect is another factor. Population ethics asymmetry (b) might be under-explored in SFE contexts, while lexical priority (a) has more literature but still needs refinement. Uncertain sentience (c) is practical but might have more existing work.

  Practical impact: If (b) shows asymmetry collapses, it could shift focus from creating happy lives to preventing suffering, affecting longtermist priorities. If (a) establishes a threshold, it changes which interventions are prioritized. (c) directly influences animal welfare resource allocation.

  The user also wants a crux to shift from longtermism to near-term work. Question (b) serves this role. If asymmetry fails, near-term suffering prevention gains importance, reducing longtermist focus.

  For the sixth item, cutting (d) about painless elimination. While interesting, it's less urgent. If other questions resolve, this might not change practices much. It's also more niche and potentially intractable without empirical input on real-world applications.

  Finally, ensuring each ranked item is concise, within three sentences, and addresses upstream influence, tractability, neglect, and impact. The ranking should prioritize foundational issues that could redefine SFE's viability and resource allocation.
answer: |-
  Here is the defended agenda, ranked for impact and tractability:

  1.  **Population ethics asymmetry viability (your b):** This is the most upstream crux—if the asymmetry collapses without person-affecting constraints, core SFE justifications (like strong procreation asymmetry) unravel, fundamentally altering its distinctiveness and potentially collapsing it into standard utilitarianism or demanding near-total focus on near-term suffering reduction. It's highly tractable with analytic tools and neglected in non-person-affecting frameworks; a rigorous model showing the asymmetry’s instability would force a major portfolio pivot towards near-term work or foundational reform. Result moving it: A formal proof of instability under impersonal totalism would elevate its urgency.

  2.  **Lexical priority scope and threshold validity (your a):** Determining if lexicality applies universally or only above an intensity threshold defines SFE's core demands and whether "threshold" versions remain meaningfully suffering-focused (or just prioritarian). This directly shapes intervention priorities (e.g., extreme suffering vs. widespread mild suffering) and is tractable via conceptual analysis/value theory. A convincing argument that threshold views lose the "suffering-focused" label would solidify extreme suffering focus; establishing a coherent threshold model would broaden scope.

  3.  **Ontology of suffering for action-guidance (your e):** Whether SFE targets measurable indicators or mind-independent states dictates feasible interventions, especially for non-human animals where measurement is hard. Answering this is crucial for practical allocation (e.g., invertebrate welfare) and tractable via philosophy of mind/ethics. A compelling case for mind-independence despite measurement challenges would demand novel welfare proxies; favoring measurability would concentrate resources on observable suffering.

  4.  **Treatment of uncertain sentience (your c & roommate's view):** Whether credence discounting suffices or if structural uncertainty (no subject) changes the calculation dictates resource allocation towards borderline cases (e.g., insects, AI). This is tractable using decision theory under deep uncertainty. A robust framework showing credence discounting systematically underestimates expected suffering in borderline cases would boost its priority; validating the roommate's model would streamline uncertain welfare work.

  5.  **Coherence of painless elimination reductios (your d):** Assessing if the "reductio" (e.g., justifying killing sufferers) is a fatal flaw or a misreading clarifies SFE's practical implications and moral acceptability. While conceptually tractable, its direct impact on real-world priorities is lower absent extreme scenarios. A novel defense showing the reductio doesn't hold under plausible SFE axioms would reduce criticism; confirming its force would necessitate specific deontic constraints.

  **Cut: Painless elimination reductios (your d) -** While philosophically interesting, resolving this is less likely to *change priorities* than the others. Its implications are often seen as extreme edge cases unlikely to guide real funding decisions, and debates here are frequently circular without new conceptual tools. Resources are better spent on questions directly affecting intervention scope (1-4) or foundational coherence (1-2).
