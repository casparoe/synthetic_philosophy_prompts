  The key load-bearing verdict here is her acceptance of model-theoretic truth as non-substantive. If she sees sharpenings as analogous to models, supervaluation should be deflationary. But if she emphasizes the failure of bivalence at the object level, she might view it differently.

  A better test case would involve a vague truth predicate itself. For example, if "true" is vague, the equivalence schemas never fail, but bivalence might. This would force a choice between the two interpretations. If she requires substance here, it's about the unrestricted schema. If not, it's about metaphysical work.

  Given her model-theoretic stance, the prediction is that she'd see supervaluation as deflationary. The friend's sharpening-relative minimalism aligns with how she treated models and worlds. Thus, vagueness doesn't force a substantive property.
answer: |-
  Based on your supervisor's established pattern and the core principles you've outlined, here's the prediction, the rule, competing interpretations, and the decisive test case:

  1.  **Predicted Verdict for Supervaluationism:** She would **NOT** deem a substantive property of truth necessary in the supervaluationist package described.
  2.  **The Rule She's Running (Best Fit):** **Truth requires a substantive property only when it plays an ineliminable *metaphysical or explanatory role* or when attempts to implement the equivalence schema lead to *outright, unresolvable inconsistency* at the fundamental level (like the Liar forcing hierarchy/gaps/weaker logic).** Parameterized or relativized implementations of truth-talk (like models, worlds, or sharpenings) are acceptable deflationary *devices*, even if they involve complex recursive definitions or result in non-classical behavior *at the object level*, as long as the truth predicate *itself* remains a consistent, non-explanatory device within that parameterized framework.

  **Why This Rule Fits Her Verdicts:**

  *   **Deflationary Cases:**
      *   *Disquotation/Blind Gen/Models/Worlds/Normativity/Explanations:* These involve purely expressive, logical, or normative roles. She explicitly strips truth of explanatory power in the scientific case. Models/worlds are parameterized devices.
      *   **Load-Bearing:** Her acceptance of model-theoretic and modal truth (defined recursively over structures) as non-substantive *devices* is crucial. Supervaluationism is structurally analogous: truth-at-a-sharpening is defined recursively over the sharpening, and "supertruth" (truth *simpliciter*) is defined via universal quantification over these sharpenings – a logical operation, not a metaphysical property. It's a device for handling semantic indecision, not naming a robust property.
  *   **Substantive Cases:**
      *   *Truthmaking:* Here, truth is explicitly on the *receiving end* of a metaphysical explanation ("because the meeting was cancelled"). This violates the deflationary tenet that truth is explanatorily inert.
      *   *Liar Paradox:* Attempting a *single*, *unrestricted*, *transparent* equivalence schema leads to demonstrable, fundamental inconsistency. Resolving this *requires* modifying the logic/semantics in a way that reveals a structural feature *about truth itself* (hierarchy, gaps, non-classicality) that minimalism doesn't acknowledge.
      *   **Load-Bearing:** The stark contrast between handling the Liar (requires fundamental change due to inconsistency) and handling models/worlds (acceptable parameterized device) shows the rule isn't *just* about parameterization, but about *why* parameterization is needed. The Liar forces inconsistency *in the core schema*; models/worlds are tools for analysis without implying inconsistency in our fundamental concept.

  **Competing Rules & Why They Fit Less Well:**

  1.  **Rule A: Substance needed iff the *unrestricted, transparent equivalence schema* cannot be had in full.**
      *   **Problem:** Fits Liar perfectly but fits model-theoretic truth *poorly*. Truth-in-a-model *is* a parameterized schema. If she rejected all parameterization, she should reject model truth as substantive. She doesn't. Her acceptance of model truth as a device shows she allows parameterized *implementations* of truth-talk without substance. Supervaluationism's "truth-at-s" schema is similarly parameterized.
  2.  **Rule B: Substance needed iff truth does metaphysical/explanatory work OR the *flat list* (disquotational instances) is outright inconsistent.**
      *   **Problem:** Fits Truthmaking and Liar. However, "flat list inconsistency" is vague. Does the Liar show the flat list *is* inconsistent? Or that we *can't consistently formulate it* for an unrestricted language? Her focus is on the *inability to have a consistent unrestricted schema*, not the inconsistency of a finite list. More importantly, this rule *underdetermines* the supervaluation case: Is the failure of bivalence for borderline sentences an "inconsistency" needing substance? Her model theory acceptance suggests no – object-level gaps/gluts within a parameterized framework are acceptable devices.

  **The Crucial Test Case to Distinguish the Rules: Vague Truth Predicate**

  *   **Scenario:** Imagine a language where the truth predicate "is true" is itself vague. The equivalence schema `S is true iff P` (where `S` names the sentence expressing P) holds *for every sentence*, but bivalence fails for some sentences involving "true" because its application is borderline. There is no Liar-like inconsistency, just pervasive vagueness infecting the truth predicate. We implement a supervaluational framework *over sharpenings of the vague vocabulary, including "true"*.
  *   **Why This Separates the Rules:**
      *   **Your Supervisor's Likely Rule (Metaphysical/Explanatory Role or Fundamental Schema Inconsistency):** She would likely say **NO substantive property is needed.** The equivalence schema holds (indexed to sharpenings), truth isn't doing explanatory work, and the inconsistency is avoided by the parameterization (sharpenings). The vagueness of "true" is handled by the same device as other vague terms. It's messy, but structurally similar to model theory – a complex logical device, not a call for substance. Her acceptance of parameterized devices (models/worlds) is the load-bearing verdict here.
      *   **Rule A (Unrestricted Schema Impossible):** This rule would likely say **substance IS needed.** The fundamental, *unrestricted* equivalence schema is impossible to implement transparently without parameterization because the predicate itself is vague. The need for indexing/sharpening directly violates the requirement for an unrestricted, transparent schema. The Liar verdict is load-bearing here, emphasizing the need for an *unrestricted* schema.
      *   **Rule B (Explanatory Work or Flat List Inconsistency):** This rule is ambiguous. It might say *no* substance, as there's no explanatory work and no Liar-like inconsistency in the equivalences. Or it might say *yes*, interpreting the failure of bivalence for truth-attributions as a kind of "inconsistency" in the intended classical "flat list" picture. Her Truthmaking verdict emphasizes explanatory role, but the Liar verdict's focus on inconsistency might pull towards seeing vague truth as problematic.

  **Conclusion on Supervaluationism & Sharpening-Relative Minimalism:**

  *   **Prediction:** She would view the classical supervaluationist package (and your friend's "sharpening-relative minimalism") as **deflationarily kosher.** It fits the model of model-theoretic truth: truth is defined recursively relative to a parameter (a sharpening/model), and the "unqualified" truth predicate ("supertrue", "true *simpliciter*") is defined by logical operations (universal quantification) over these parameters. The failure of bivalence at the object level (for 'Nils is tall') is a consequence of the semantic indecision handled by the device, not a revelation about a substantive property of truth itself. The truth predicate *within the framework* behaves classically and doesn't play an explanatory role.
  *   **Sharpening-Relative Minimalism:** This isn't a *genuine extension* of her view, nor is it *just relabeling what she rejects*. It's **exactly the *type* of move she has consistently accepted elsewhere (models, worlds).** It's a natural application of her deflationism to a new domain (vagueness) using her established tolerance for parameterized truth schemas. Your friend's proposal aligns with her core methodology.
  *   **The Real Crux:** You are correct. The decisive factor is **which relativizations/parameterizations of the equivalence schema she counts as deflationary.** Her acceptance of truth-in-a-model as a non-substantive *device* is the strongest evidence that she would accept truth-on-a-sharpening similarly. The "vague truth predicate" test forces the issue by making the parameterization infect the truth predicate itself, cleanly separating her likely tolerance for logical devices (based on models/worlds) from a stricter demand for an unrestricted schema (implied by her Liar verdict).

  **In short: Bet on her accepting supervaluationism as just another expressive/logical device, consistent with her deflationism and her prior acceptance of model-theoretic truth. The key precedent is models/worlds, not the Liar.**
