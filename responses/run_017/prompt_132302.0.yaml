prompt: |-
  I built this thing for a seminar and now it's embarrassing me, because it seems to work too well.

  Background: I'm trying to answer the pessimistic meta-induction (PMI). Rough version: take the theories that were, in their day, the best-confirmed theories of their domain; a large majority of them are now regarded as not even approximately true in their claims about unobservables (caloric, phlogiston, the luminiferous ether, that whole crowd); our current best theories weren't produced by any method that's special relative to the ones that produced those; so we should expect our current best theories to go the same way.

  My idea was to show that PMI saws off the branch it's sitting on. Here it is:

  (1) PMI's whole force is a frequency claim about a reference class: the class of theories that were at some time the best-confirmed theory of their domain — call them "peak theories". Most peak theories are now taken to be false.

  (2) That inductive setup doesn't change from century to century, so the base rate it yields applies to every peak theory at its own time, including whatever is a peak theory now. Call this "diachronic base-rate egalitarianism": no theory, at any time, gets to claim a special exemption just because it is currently the best-confirmed one.

  (3) The only evidence anyone has ever had for the reliability of a method of theory choice is the success of the theories that method licensed. Method-reliability is never observed directly; it's always inferred from outputs.

  (4) But by (2), a theory's being predictively successful at t is no good evidence that it is approximately true, and therefore no good evidence that the method which produced it is reliable. So no method of theory choice is ever evidentially supported as reliable.

  (5) PMI itself is the output of a method — historical inquiry into the record of science — and that method isn't directly validated either. Its deliverables (that a given theory was accepted, that it enjoyed such-and-such successes, that it was later abandoned) are theory-mediated inferences, not things anyone hands you.

  (6) So by (4), PMI has no support for the reliability of the very method that produced it. PMI is self-undermining, and it can't be stated as a supported argument at all. Which is great news for the realist, i.e. for me.

  Here's why I don't believe my own argument. Steps (4)–(6) don't care that the target is PMI. Any historical debunking argument has this shape: phrenology was once respectable and had its own success stories; psychology's replication crisis is supposed to tell us something about its methods; the defenders of cold fusion were using the same instruments and statistics as everyone else. All of that rests on historical inquiry of exactly the kind (5) describes. So my argument apparently shows that no historical evidence can ever bear on whether a current method is reliable — I've accidentally immunized astrology against its own history. Also, the same structure run on my own track record says I can't use the fact that I've been wrong a lot to doubt my current reasoning, or use it to trust my current reasoning either, which is just generic skepticism, and generic skepticism is something anyone can manufacture in six steps, which is usually a sign that you've broken something.

  My hunch is that the break is in the (4)-(5) stretch: (4) is about evidence for approximate truth, and (5) quietly needs "reliable" to mean something weaker, like "gets the documentary/observational record roughly right", and those aren't the same property. But my supervisor says the rot is earlier, in (2), because "peak theory" is the wrong reference class and I've sneakily made the class impossible to escape by ruling out every distinguishing feature in advance. I dont trust either of us.

  If I have to choose, I'd rather keep (1), (2) and (3) than anything downstream, and I really want to keep the ability to debunk phrenology by appeal to its history. So: which step do I give up, why did it look fine, and what does giving it up cost me — does it cost me the anti-realist conclusion in (6), or does it cost me something I care about more?
reasoning: |-
  Okay, the user has built an argument to counter the Pessimistic Meta-Induction (PMI) but now realizes it might undermine all historical debunking arguments, which is problematic. They need help identifying where their reasoning went wrong and how to salvage their position without losing the ability to critique things like phrenology.

  First, I need to understand their argument's structure. The key steps are (1) to (6), where they claim PMI is self-undermining because it relies on historical methods that can't be validated if all past theories are deemed false. The user's concern is that this makes any historical criticism impossible, which they don't want.

  Their hunch is that the problem lies between steps (4) and (5), where "reliable" shifts meaning. Their supervisor thinks step (2) is the issue, particularly the reference class "peak theories." The user prefers to keep steps (1)-(3) but wants to retain historical debunking.

  I should analyze step (2) first. The user defines "peak theories" as any theory that was once best-confirmed. But this lumps together all such theories without considering context, like the maturity of the field or the methods used. PMI might actually point out that older theories lacked sophisticated methods we have now. If the reference class includes all peak theories regardless of context, it ignores possible progress in scientific methods over time. That makes the class too broad and static, leading to the problematic conclusion that no method can be trusted.

  Step (4) is another candidate. It assumes that predictive success doesn't provide evidence for approximate truth. But the user wants to debunk phrenology based on its failures, implying that success should count for something. If predictive success isn't evidence at all, then even current theories can't be trusted, leading to skepticism. This step conflates "no direct proof" with "no evidence," which is too strong. Predictive success might be weak evidence that accumulates over time, rather than being worthless.

  Step (5) might misuse "reliable." Historical methods can be reliable for documenting observable events (like which theories were accepted) without claiming those theories are true. So the method producing PMI could be reliable for historical facts but not for inferring truth from success. The user's argument conflates these two types of reliability.

  The core issue is that the user's argument overgeneralizes. They need to differentiate between contexts. For example, historical methods can be validated for empirical records, while scientific methods for theory selection require different validation. Also, the reference class for PMI should account for evolving methodologies, not treat all peak theories as equal.

  To salvage their position, the user should adjust step (2) by refining the reference class. Exclude theories from periods with immature methods or different epistemic conditions. This allows PMI to still challenge realism but avoids condemning all methods. They can then argue that modern methods, having evolved, might be more reliable. This keeps historical debunking intact because theories like phrenology can be critiqued based on their specific failures within their context.

  Giving up the broad reference class in step (2) costs the universality of PMI but retains its core challenge to realism. The user can still counter PMI by showing that current methods are better, thus preserving the ability to debunk pseudosciences historically. This approach aligns with their goals without leading to skepticism.
answer: |-
  Your self-diagnosis is sharp, and your supervisor's point about Step (2) is likely the crux. Let's break down the failure, why it looked plausible, and what giving it up costs:

  **The Problematic Step: Step (2) - Diachronic Base-Rate Egalitarianism**

  *   **Why it's the Problem:** This step treats the entire historical set of "peak theories" as a single, homogeneous reference class for a base rate calculation. It assumes that the epistemic situation, the *methods* used to achieve "peak" status, and the *nature* of the theories themselves are fundamentally identical across all eras of science. This is empirically false and philosophically untenable.
  *   **Why it Looked Fine:** It seems compellingly egalitarian and consistent. PMI *requires* treating past and present "peak" theories symmetrically to generate its pessimistic prediction. Denying (2) seems like special pleading for current science. The label "peak theory" creates an illusion of uniformity.
  *   **What Giving it Up Costs You (Specifically for Anti-PMI):**
      *   **Cost:** You lose the *clean, universal, self-undermining* refutation of PMI you constructed. You can no longer simply say "PMI condemns its own method universally." PMI might *still* be a bad argument, but its failure won't be due to a purely logical self-sabotage stemming from an inescapable reference class.
      *   **What You Keep/What Changes:** You can still argue that PMI is *misapplied* or *overstated*. By rejecting (2), you open the door to arguing that *current* peak theories (or the methods producing them) *are* relevantly different from past ones (e.g., greater empirical precision, unification, technological success, methodological sophistication like controlled experiments, statistical rigor, peer review, etc.). Your anti-realist opponent must now argue why these differences *don't* matter, rather than you needing to prove they *can't* matter by definition. You shift the burden. Your argument against PMI becomes contingent on features of *current science*, not a purely logical demolition.

  **Why Your Hunches About (4)-(5) Point to Symptoms, Not the Root Cause:**

  1.  **Step (4)'s Harshness:** Step (4) ("predictive success is *no good evidence* for approximate truth/reliable method") *follows* from the flawed premise in (2). If *all* peak theories are epistemically equal and most are false, then the track record of methods *is* abysmal, making (4) plausible. Fix (2), and (4) becomes an overstatement. Predictive success *can* be *some* evidence, even if defeasible. Its *weight* depends on context, which (2) obliterates.
  2.  **Step (5)'s "Reliable" Ambiguity:** Your hunch about the shift in "reliable" is astute. Historical methods *can* be reliable for establishing *observable historical facts* (e.g., "Phlogiston theory was accepted," "It explained combustion," "It was abandoned") without being reliable for establishing the *approximate truth of unobservable theoretical claims*. However, the *reason* PMI seems forced to conflate them in your argument is *because* of (2). If past and present "peak" status are epistemically identical (Step 2), then the method producing the *historical claim* (Step 5) is just as vulnerable as the method producing the *scientific theory* (Step 4) – both rest on the same shaky "peak theory" foundation. Fix (2), and you can coherently distinguish the reliability of historical documentation (often high for observable events) from the reliability of scientific theory choice (the actual target of PMI).

  **Why Giving Up (2) SAVES What You Care About More (Debunking Phrenology):**

  This is crucial. Rejecting the homogeneous reference class of Step (2) is *essential* for coherent historical debunking:

  1.  **Context Matters for Debunking:** Debunking phrenology works precisely because we *don't* treat all "peak" theories equally. We argue that phrenology's methods (correlating skull bumps with traits) were *fundamentally flawed* even *at the time*, or were quickly shown to lack predictive power, rely on bias, or fail crucial tests. Its "peak" status was *illusory* or based on bad methodology, unlike (we argue) modern neuroscience.
  2.  **Differentiating Success:** We can point to the *specific nature* of the successes claimed by phrenology (often post-hoc, vague, socially driven) and contrast them with the *specific nature* of the successes of modern theories (precise predictions, novel discoveries, technological control). This differentiation relies on rejecting the uniform reference class.
  3.  **Methodological Evolution:** Debunking relies on the idea that methods *improve*. We criticize past methods (like those supporting phrenology or the ether) *from the perspective of better current methods*. If all methods are epistemically equal (as implied by Step 2), this criticism loses its force. Rejecting (2) allows you to say, "Phrenology's methods were bad *even then*, and we have better ones now," which is the core of the debunking argument.
  4.  **Avoiding Skepticism:** By allowing differentiation based on method, context, and the specific nature of success/failure, you avoid the paralyzing blanket skepticism your argument accidentally produced. You can rationally learn from history (e.g., "Methods like X tend to produce false theories") without condemning *all* methods based on a single, artificially flattened historical rate.

  **Conclusion: Give Up Step (2)**

  *   **Why:** It relies on a false homogenization of the "peak theory" reference class, ignoring crucial differences in scientific context, methodology, and the nature of the theories themselves across history. This flaw propagates, causing the overreach in (4) and the ambiguity exploited in (5), leading to the unacceptable consequences (immunizing bad methods, generic skepticism).
  *   **What it Costs Your Anti-PMI Argument:** It costs you the *absolute, logical, self-undermining* victory over PMI. Your refutation becomes more nuanced, contingent on arguing for the superiority of current methods/contexts over past ones. PMI remains a *challenge* the realist must address by showing relevant differences, not an argument that commits suicide.
  *   **What it Gains You:** It saves coherent historical reasoning, including the ability to debunk pseudosciences like phrenology based on their specific historical failures and flawed methodologies. It avoids the self-defeating skepticism trap. It aligns better with the actual history and progress of science. It allows you to retain the core insights of (1) (PMI relies on frequency) and (3) (method reliability is inferred) without their disastrous consequences under the flawed egalitarianism of (2).

  **The Path Forward:** Focus your anti-PMI argument on why the reference class *shouldn't* be homogeneous. Argue that modern science represents a *mature phase* with more stringent methods, greater empirical constraints, and more impressive, varied success (especially novel prediction and technological application) than the eras that produced caloric or phlogiston. This doesn't guarantee truth, but it breaks the symmetry PMI requires and provides reasons for optimism that the realist can rationally defend. You defeat PMI by showing its inductive base is flawed or misapplied to the present, not by proving it logically self-destructs in a way that destroys all historical reasoning. This preserves your ability to use history critically while defending scientific realism.
