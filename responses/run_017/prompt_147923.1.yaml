prompt: |-
  I am restructuring the opening fortnight of a graduate seminar on the units of selection, and I want to begin with a specification rather than with the usual tour of positions. Before my students read another defense of gene selectionism, another exposition of the multi-level framework, and another insist that the two are the same claim written in different notation, I want them to know what a correct account of the level or levels at which selection acts would have to be able to do. So: write the desiderata.

  Fix the purpose as follows, and tell me in your first section if you think it is the wrong one. The account is to be good enough to tell a working evolutionary biologist what to measure in a given system: which quantities to track, at which level to look for adaptation, and what would settle a dispute about whether some particular case is a case of selection at a level higher than the gene. It is not primarily meant to settle a metaphysical question about whether groups or organisms exist as objects of selection over and above their parts, and I am willing to hear that some putative desiderata are only desiderata under one of these purposes and not the other.

  Here are the cases I want each requirement tested against. Two of them I have constructed; that is deliberate, since a list of requirements that only has to fit the textbook examples has not been tested.

  (a) A trait that lowers the expected reproductive output of its bearer and raises that of its neighbours, in a population with limited dispersal. This is the site of the familiar claim that the kin-selection and group-selection parameterisations agree on the outcome while disagreeing on the description.

  (b) Within-genome conflict: a genetic element that biases its own transmission to offspring while lowering the fertility of the organisms carrying it; and a mobile element that copies itself within a genome at a small cost to the organism.

  (c) A clonal cell lineage that is transmitted from one host to another as an infectious agent, persists far longer than any individual host, carries heritable variation of its own, is not part of any host germline, and whose success depends both on how fast it proliferates within a host and on how long it keeps hosts alive and in contact with further hosts. A handful of such lineages are known in animals.

  (d) The constructed case: a plant lineage that can no longer acquire nitrogen without a bacterial partner, and a bacterial lineage that can no longer persist outside the plant's root nodules. Each partner reproduces on its own schedule; the plant acquires some symbionts from its parent and some from the soil; the joint output of a pair exceeds what either would achieve alone; and the fitness of each partner depends on traits carried in the other's genome. Is the pair a unit? What would have to be measured to decide?

  (e) A major transition: a formerly free-living lineage that is now a part, such as the mitochondrion or the somatic cell, whose own fitness has been reduced to almost nothing by the suppression of conflict within the higher-level unit. What must a theory say about when a level ceases to be a level at which selection acts?

  (f) Non-genetic inheritance: a foraging technique that spreads by oblique transmission between unrelated individuals, raises the survival of the groups that have it, and lowers the reproductive output of the individuals who practise it. Say whether your list is meant to cover this, and if not, what marks the boundary.

  (g) The bookkeeping worry: a single generation's change in a population can be partitioned across levels in more than one way, the partitions agreeing on the total and disagreeing on the components. A theory that cannot say which partition is correct, or that says the question has no answer, owes us an account of why.

  Here is the menu of demands I keep encountering, which I do not equally trust: give a unique partition of total change into level-specific components; be usable with the data a field study can actually produce, such as relatedness, group composition and fitness components, rather than complete causal graphs; reproduce the verdicts of the inclusive-fitness machinery wherever that machinery applies; never invoke a higher level when a lower-level account plus population structure will do; state what has to hold for something to be a unit of selection at all, whether reproduction, heritable variance in fitness, both, or something else, and distinguish units from mere collections and from mere substrates of transmission; permit several levels to be genuine units simultaneously and to conflict; handle within-genome conflict without letting the gene level be absorbed into the organism level; give an account of the appearance and the disappearance of levels; yield verdicts that do not depend on an arbitrary choice among causally equivalent models, or else say what observable difference that choice makes; be formulable in the Price equation, or independently of it; say for each system whether the level question is empirical, conventional or both; say at which level adaptation accumulates, or explain why that is a separate question; handle traits whose group-level benefits are byproducts of individual-level design; be stable under the fact that generations and heritability are defined differently at different levels; and extend to, or explicitly exclude, non-genetic inheritance.

  Do not give me a list of everything anyone has ever asked of such a theory. Give me a judgement: which of these are genuine requirements on an account with the purpose I have fixed, which are preferences of one camp presented as requirements, and which are disguised restatements of a substantive conclusion and so beg the question. Add whatever is missing. For each requirement you accept, give the case or consideration that makes it a requirement and mark it as non-negotiable, negotiable, or a preference of a camp. Assume no access to a library; everything you need about the cases is above, and I want no references, bibliographies or citations.

  Please structure your reply in the following sections, in this order:

  1. The purpose — roughly 100 words: accept or revise the purpose I have fixed, and say what changes in the list if it is revised.
  2. Desiderata — roughly 700 words: the requirements, in the order of their importance, each with its motivating case or consideration and its status.
  3. Joint unsatisfiability — roughly 350 words: which subsets of your own list you suspect cannot be satisfied together, with the argument for each.
  4. The decisive requirement — roughly 150 words: name the single requirement that excludes the largest number of candidate theories, and say which candidates it excludes.
  5. Scorecard — roughly 250 words: a table scoring gene-level replicator selection, multi-level selection in its two forms, the replicator-and-vehicle framework, and the causal-partitioning approach against your criteria, with no more prose than is needed to read the table.
  6. The constructed cases — roughly 250 words: apply your list to cases (d) and (f), and say if either of them is a case your list runs out on.
reasoning: |-
  Okay, the user is restructuring a graduate seminar on the units of selection and wants to start with clear desiderata for what a good account should achieve. They've outlined a specific purpose: the theory should guide evolutionary biologists in what to measure in real systems, rather than getting bogged down in metaphysical debates. They've also provided several test cases, including constructed ones to push the boundaries of existing frameworks.

  First, I need to assess their stated purpose. The focus on empirical measurability makes sense—it shifts the discussion from abstract arguments to practical application. This immediately rules out theories that are purely conceptual without operational guidelines. The user is clearly frustrated with traditional approaches that rehash the same debates without resolving how to apply them in the field. Their test cases, especially the symbiotic pair (d) and cultural trait (f), are designed to challenge simplistic solutions.

  Looking at the menu of demands they've encountered, I need to separate genuine requirements from philosophical preferences. For example, "unique partition of change" seems negotiable—different partitions might be useful for different questions. But "empirical applicability" is non-negotiable because without it, biologists can't measure anything. The kin/group selection equivalence in case (a) shows we need a theory that doesn't get stuck on mathematically equivalent formulations.

  The major transition case (e) highlights the need for clear criteria about when a level emerges or disappears. Case (b) (genomic conflict) demands that the theory prevent collapsing levels—genes can't be absorbed into organisms. Case (g) (bookkeeping) is tricky; requiring a single "correct" partition might be impossible, but the theory should at least explain why multiple partitions exist and how to choose based on research goals.

  For the symbiotic pair (d), any viable theory must handle cross-dependent fitness without presupposing what the unit is. The cultural trait in (f) might be excluded intentionally—the user seems open to marking boundaries between genetic and non-genetic inheritance systems.

  I suspect some desiderata will conflict. Empirical measurability might clash with handling transient units like the somatic cell lineage (e). And avoiding arbitrary modeling choices could limit our ability to describe multi-level conflicts cleanly.

  The most decisive requirement is empirical applicability—it immediately rules out theories that are purely mathematical (like some Price equation formulations) or those insisting on a single "true" level. The scorecard will show gene-level and vehicle-based frameworks struggling with cross-level dependencies, while multi-level approaches fare better but may lack clear emergence criteria.

  Testing on case (d): A good theory should specify measuring partner-specific fitness effects, heritability of cooperative traits across partners, and conflict indicators—without assuming the pair is a unit. For (f), if excluding non-genetic inheritance, the boundary should be clear: are we tracking reliably transmitted variants with fitness consequences? If not, it's outside scope.

  Neither case makes the list "run out," but (d) exposes where theories might force premature answers. The user's approach—starting with requirements rather than positions—should force students to evaluate frameworks by their utility, not just their internal logic.
answer: |-
  ### 1. The Purpose (110 words)  
  Your purpose—**empirical guidance for measurement and adjudication in biological systems**—is correct and focused. It prioritizes operational utility over metaphysical resolution, aligning with the needs of working biologists. If revised to include metaphysical grounding (e.g., "define what units *are*"), the desiderata would shift toward criteria like ontological independence or causal primacy, which your cases show are unnecessary for measurement. For instance, case (d) (symbiotic pair) requires measuring fitness dependencies regardless of whether the pair "exists" as a unit. Retaining your purpose excludes abstract demands (e.g., "avoid higher levels when lower suffice") and emphasizes data-constrained, conflict-resolving tools.  

  ---

  ### 2. Desiderata (700 words)  
  Ordered by importance, with case/consideration and status:  

  1. **Empirical applicability**  
     - *Requirement*: Must prescribe measurable quantities (fitness, heritability, conflict) using feasible field data (e.g., relatedness, group composition).  
     - *Case*: (a) Kin/group equivalence demands a theory that uses standard data (within-group variance, relatedness) without requiring causal graphs.  
     - *Status*: **Non-negotiable**. Without this, the theory fails your purpose.  

  2. **Conflict identification**  
     - *Requirement*: Must detect and quantify antagonism between levels (e.g., gene vs. organism, group vs. individual).  
     - *Case*: (b) Genomic conflict requires distinguishing gene-level advantage (transmission bias) from organismal cost. (e) Somatic cells show suppressed conflict.  
     - *Status*: **Non-negotiable**. Central to disputes about "higher-level" selection.  

  3. **Level emergence/disappearance criteria**  
     - *Requirement*: Specify conditions where a new unit arises (e.g., heritable fitness variance, reproductive autonomy loss) or ceases.  
     - *Case*: (c) Infectious cell lineage persists independently; (e) Mitochondria lose reproductive autonomy.  
     - *Status*: **Non-negotiable**. Resolves transition cases.  

  4. **Arbitrariness avoidance**  
     - *Requirement*: Verdicts must not depend on mathematically equivalent modeling choices (e.g., kin vs. group partitioning).  
     - *Case*: (g) Bookkeeping worry: Total change partitions must reflect causal structure, not convention.  
     - *Status*: **Negotiable**. May require accepting multiple valid partitions for different questions.  

  5. **Cross-level dependency handling**  
     - *Requirement*: Accommodate traits where fitness depends on another entity’s traits (e.g., symbionts).  
     - *Case*: (d) Plant-bacteria pair: Fitness interdependence without merged reproduction.  
     - *Status*: **Non-negotiable**. Tests unit status beyond reproduction.  

  6. **Non-genetic inheritance boundary**  
     - *Requirement*: Explicitly include or exclude non-genetic systems, based on heritability and fitness variance.  
     - *Case*: (f) Cultural trait: If excluded, mark boundary (e.g., "requires genetic inheritance" or "requires replicator fidelity").  
     - *Status*: **Preference of a camp**. Gene-centric views exclude it; multilevel may include it.  

  7. **Adaptation locus identification**  
     - *Requirement*: Identify where adaptation accumulates (e.g., organism vs. group) without presuming level.  
     - *Case*: (f) Group benefit vs. individual cost; (a) Adaptation may manifest at group level.  
     - *Status*: **Negotiable**. Separable from selection action but often conflated.  

  *Excluded "demands"*:  
  - "Unique partition": Contra (g), multiple partitions may be valid for different questions (negotiable).  
  - "Reproduce inclusive fitness": Not required if alternatives use standard data (preference of gene-centric camp).  
  - "Never invoke higher levels": Begs the question against group selection (disguised conclusion).  
  - "Formulable in Price equation": Tool-agnostic purpose makes this optional (preference).  

  ---

  ### 3. Joint Unsatisfiability (350 words)  
  Three tensions arise:  
  - **Conflict identification vs. Arbitrariness avoidance**: Detecting conflict (e.g., in (b)) requires partitioning change, but (g) shows partitions can be non-unique. *Resolution*: Accept context-dependent partitions (e.g., gene-level for transmission bias, organism-level for fertility cost).  
  - **Emergence criteria vs. Empirical applicability**: Defining transitions (e.g., (c), (e)) demands clear thresholds (e.g., "heritable variance at level X"), but field data (e.g., for (d)) may be incomplete. *Conflict*: Strict criteria may be unmeasurable; loose criteria risk arbitrariness.  
  - **Cross-level dependencies vs. Adaptation locus**: In (d), the pair’s joint fitness suggests group adaptation, but individual reproduction schedules challenge "unit" status. *Conflict*: If adaptation is assigned to the pair, it may ignore ongoing conflict (e.g., cheater symbionts).  

  The core unsatisifiability: **A theory cannot simultaneously demand a *unique* causal partition *and* fully accommodate equivalent mathematical frameworks** (e.g., kin/group in (a)). Your purpose favors empirical applicability, so privileging measurable quantities (e.g., selection gradients) over partition uniqueness resolves this.  

  ---

  ### 4. The Decisive Requirement (150 words)  
  **Conflict identification** excludes the most theories:  
  - Gene-level selection (Dawkins) fails (b) by ignoring organismal cost.  
  - Naïve group selection (Wynne-Edwards) fails (b) by missing gene-level advantage.  
  - "Replicator-vehicle" frameworks (Hull) struggle with (d) and (e), where "vehicles" (organisms) are transient or interdependent.  
  - Causal partitioning (e.g., contextual analysis) handles (a) and (b) but may not resolve (g)’s non-uniqueness.  

  Only multilevel selection (MLS1/MLS2) and generalized Price equation approaches survive, as they explicitly model antagonism (e.g., within-group vs. between-group selection in (a), (f)).  

  ---

  ### 5. Scorecard (250 words)  
  | **Criterion**               | Gene-level | MLS1 | MLS2 | Replicator-Vehicle | Causal Partitioning |  
  |-----------------------------|------------|------|------|---------------------|---------------------|  
  | Empirical applicability     | Poor       | Good | Good | Poor               | Excellent           |  
  | Conflict identification     | Poor       | Good | Good | Moderate           | Excellent           |  
  | Level emergence criteria    | Poor       | Fair | Good | Poor               | Fair               |  
  | Arbitrariness avoidance     | Good       | Fair | Fair | Poor               | Poor               |  
  | Cross-level dependencies    | Poor       | Fair | Good | Moderate           | Good               |  
  | **Verdict**                 | Fails (b,d)| Pass | Pass | Fails (d,e)        | Pass (but see §3)  |  

  *Notes*:  
  - **MLS1**: Selection within/between groups (e.g., (a), (f)).  
  - **MLS2**: Group reproduction (e.g., (c), emergent units).  
  - **Causal partitioning**: Struggles with (g) non-uniqueness.  

  ---

  ### 6. The Constructed Cases (250 words)  
  **Case (d) (Symbiotic pair)**:  
  - *Desiderata application*:  
    - Measure: (1) Fitness of plant/bacteria in isolation vs. partnership, (2) Heritability of cooperative traits (e.g., nodule formation) across generations, (3) Conflict indicators (e.g., cheater symbionts).  
    - Emergence: The pair is *not* a unit unless joint reproduction evolves (e.g., vertical transmission dominates).  
    - Cross-level dependency: Key—fitness depends on partner’s traits.  
  - *Theory adequacy*: MLS2 handles this if partnership fitness is heritable; gene-level fails.  

  **Case (f) (Cultural trait)**:  
  - *Desiderata application*:  
    - Boundary: Excluded if "units" require genetic inheritance. Included if heritable variance in fitness exists (e.g., group-level fitness via trait frequency).  
    - Conflict: Individual cost vs. group benefit requires partitioning selection levels.  
  - *Theory adequacy*: MLS1 excels; causal partitioning works if cultural heritability is measurable.  

  Neither case "runs out" the list, but (d) exposes weaknesses in replicator-vehicle frameworks (no clear "vehicle"), and (f) tests the non-genetic boundary. A theory excluding (f) must define the boundary (e.g., "requires DNA-based replication"), but your purpose suggests *inclusion* for comprehensiveness.
