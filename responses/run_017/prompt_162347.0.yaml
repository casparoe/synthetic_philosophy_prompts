          - If you bought the bond: your payoff is 50 - 10 = 40.
          - If you did NOT buy the bond: you then decide whether to pay the £100. 
              - If you pay: 50 - 100 = -50.
              - If you don't pay: 50.
     - If the driver does not stop:
          - If you bought the bond: -10.
          - If you did not: 0.

