          - The bond is a way to make a credible commitment. Without it, the promise to pay is not credible because it is not incentive-compatible at the time of payment.
          - The cheap-talk message is informative only if it is truthful. But when lying is possible, we get a "market for lemons" problem: only the unbonded HHs might claim to be bonded? Then the message "I am bonded" becomes less credible.

