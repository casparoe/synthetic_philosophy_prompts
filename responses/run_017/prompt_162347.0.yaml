     Score = 10 * [1 - (outcome - p)^2]   ? But this is the same as quadratic.

   Alternatively, we can give an incentive: if the driver says p and the event happens, they get 10*p. If it doesn't happen, they get 10*(1-p). This is a linear scoring rule and is incentive compatible. We'll use this.

   So: 
     If the HH pays: driver gets 10 * p (for the accuracy part)
     If the HH does not pay: driver gets 10 * (1-p)

