  We are designing an activity for a seminar on "rational irrationality" using the hitchhiker's dilemma. The setup involves two roles: Hitchhikers (HH) and Drivers (D). The key elements are:
   - Pre-play stage: Hitchhikers can buy a "bond" that forces payment at arrival. This is bought before knowing if they will be picked up and is non-refundable.
   - Cheap-talk message: Each HH writes one sentence for the driver to read before the driver decides to stop.
   - The driver, after reading the message, decides to stop or not and also writes a private probability estimate of the HH paying.
   - There is a filler task between the driver's stop decision and the HH's payment decision (if not bonded) to create a time gap.
   - The game is one-shot and anonymous: we use numbered envelopes and codes to ensure anonymity and prevent reputation effects.

   Constraints:
   - No real money; use points. We'll convert points to essay title picks (top third get first pick).
   - Avoid repeated game reasoning: enforce one-shot and anonymity.

   Proposed Payoffs (in points):
   For Hitchhikers:
     - If not picked up: 
          - If they bought the bond: -10 (cost of bond, regardless of being picked up)
          - If not bought bond: 0
     - If picked up and then pay: 50 (base for getting a ride) - 100 (payment) = -50
          But note: if they bought the bond, they don't have the option to not pay. So:
          - Bonded HH: 50 (ride) - 10 (bond) = 40 (because the bond forces payment, so they don't pay 100 at arrival, but they already paid 10 for the bond)
          - Unbonded HH who pays: 50 (ride) - 100 (payment) = -50
          - Unbonded HH who doesn't pay: 50 (ride) - 0 = 50

   However, we must note: the bond costs 10 points and also covers the 100 payment. So effectively, the bonded HH avoids the 100 payment at the cost of 10 in advance. Therefore, if bonded and picked up: 50 (ride) - 10 (bond) = 40.
   If bonded and not picked up: -10.

   For Drivers:
     - If they stop and the HH pays: -10 (cost of stopping) + 100 (payment) = 90
     - If they stop and the HH doesn't pay: -10 (cost of stopping) = -10
     - If they don't stop: 0

   But note: the bond is paid by the HH to the experimenter, not to the driver. The driver gets 100 only if the HH pays (either because they are bonded and it's automatic, or because they are unbonded and choose to pay). So for the driver, the payment from the HH is 100 points if it happens.

   However, we must also note: when the HH is bonded, the driver gets the 100 automatically. So the driver's payoff when stopping for a bonded HH is 90 (because -10 cost + 100 = 90). For an unbonded HH, the driver gets 90 if the HH pays, but -10 if not.

   But the driver does not know at the time of stopping whether the HH is bonded or not (unless the HH claims it in the message, but that might be a lie). So the driver must form a belief.

