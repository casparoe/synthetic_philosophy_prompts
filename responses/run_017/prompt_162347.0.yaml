   Rules Handout (for students):

   You will play two rounds. In each round, you are either a hitchhiker (HH) or a driver. 

   As a hitchhiker:
     - You start by deciding whether to buy a "bond". The bond costs 10 points. If you buy it, then if you are picked up, the £100 will be automatically paid (so you don't have a choice at arrival). The bond is non-refundable: you pay 10 points regardless of whether you are picked up.
