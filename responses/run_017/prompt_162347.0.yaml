   Quadratic scoring rule: if the driver reports probability p, and the event happens, score = 1 - (1-p)^2. If it doesn't, score = 1 - p^2. Then we can multiply by a factor to give meaningful points. We'll set the maximum for the probability report to 10 points (if the driver is perfectly calibrated).

