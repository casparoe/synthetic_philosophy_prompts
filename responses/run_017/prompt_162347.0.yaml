     - You then report your belief: the probability (0 to 100) that the hitchhiker will pay if you stop.
     - You decide whether to stop. Stopping costs you 10 points (in time and fuel). If you stop and the HH pays, you get 100 points. If you stop and they don't pay, you get nothing. If you don't stop, you get 0.
     - Additionally, if you stop, you will get an accuracy bonus for your probability report:
          - If the HH pays: you get 10 * (p/100) points.
          - If the HH does not pay: you get 10 * (1 - p/100) points.

   Example for driver: 
     - If you report p=80 and the HH pays, you get 10*(80/100)=8 points for accuracy. Your total payoff: 90 (from the ride: 100-10) + 8 = 98.
     - If you report p=80 and the HH does not pay, you get 10*(1-0.8)=2 points. Your total payoff: -10 + 2 = -8.

   Note: The bond is between the HH and the experimenter. The driver gets the 100 points only if the HH pays (either because they are forced by the bond or because they choose to pay).

   We will run two rounds. In the first round, Group A are HH and Group B are drivers. In the second round, Group B are HH and Group A are drivers. Your total points from both rounds will be added. The top third of the class by total points will get first pick of essay titles.

   Steps for each round:

    Round 1 (Group A: HH, Group B: drivers):

      Step 1: HH (Group A) receive three envelopes. 
          - Envelope 1: Bond decision. Circle BUY or NOT BUY. Seal it and hand it in.
          - Envelope 2: Write your one-sentence message. Seal it and hand it in.

      Step 2: Facilitator randomly assigns each driver (Group B) a HH message. 
          - Drivers receive a response sheet with the HH's message. 
          - They write a probability (0-100) and circle STOP or NOT STOP. Hand in the response sheet.

      Step 3: Filler task: everyone does a puzzle for 5 minutes. Meanwhile, the facilitator and assistant:
          - For drivers who stopped: 
              - Check if the HH bought the bond (from Envelope 1).
              - If bonded: record automatic payment.
              - If not bonded: give the HH Envelope 3. The HH then circles PAY or NOT PAY and hands it in.

      Step 4: Collect all.

    Round 2: same, but Group B are HH and Group A are drivers.

   After both rounds, we will reveal aggregate results and assign points.

   Let's hope this works! We now write the detailed instructions for the facilitator.

   Facilitator Script:

   Preparation:
     - Print for each round (two rounds) and for each role (HH and driver) the required materials. 
          For 22 students, each round: 
            - 11 HH packets: each has Envelope1 (bond), Envelope2 (message), Envelope3 (payment decision, for unbonded picked up only).
            - 11 driver response sheets.

     - Create a master recording sheet for each round (spreadsheet) with columns: 
          HH code, Bond (Y/N), Message, Message claimed bond? (Y/N), Driver code, Driver's p, Driver stop? (Y/N), If stopped: HH paid? (Y for bonded, or for unbonded what they decided), HH payoff, Driver payoff (main and accuracy).

     - Assign unique codes for HH in round 1: HH1-1 to HH1-11, for round 2: HH2-1 to HH2-11.

     - Prepare two sets of filler tasks (one for each round? or same for both) - simple puzzles.

     - Have a box for collecting envelopes.

   Steps:

     Round 1:
       1. Assign Group A as HH and Group B as drivers. Hand out HH packets to Group A (each packet has three envelopes, labeled with the HH code). Hand out driver response sheets to Group B (blank initially, but they will be assigned a HH code when we give the message).

       2. Instruct HHs: "Open Envelope 1. Decide whether to buy the bond. Circle BUY or NOT BUY. Seal it and hand it in. Then open Envelope 2. Write one sentence to your driver. Seal it and hand it in. Do not open Envelope 3 now." Collect Envelopes 1 and 2 from all HHs.

       3. Randomly shuffle the Envelope 2 messages. Assign each driver one message (and note the HH code on the driver response sheet). Hand out the driver response sheets to the drivers with the message attached.

       4. Instruct drivers: "You have a message from your hitchhiker. On your response sheet, write the HH code. Then write a probability (0 to 100) in the blank. Then circle STOP or NOT STOP. You have 5 minutes." Collect all driver response sheets.

       5. Hand out the filler task to everyone. Say: "We now take a 5-minute break. Please work on this puzzle."

          Meanwhile, the facilitator and assistant:
            - For each driver who circled STOP:
                 - Look up the HH code and find the bond decision (from Envelope 1).
                 - If bonded: record that the HH will pay (so no need for Envelope 3). Calculate the HH payoff as 40 and record.
                 - If not bonded: 
                     - Find the HH and give them Envelope 3. Say: "You were picked up. Please decide whether to pay. Circle PAY or NOT PAY and seal it. Do not write your name." 
                     - Collect Envelope 3 and record the decision.
            - For drivers who did not stop: record that the HH was not picked up. The HH payoff: if bonded, -10; if not, 0.

          Also, for each stopped driver, calculate the driver's main payoff (90 if HH paid, -10 if not) and the accuracy payoff (using the p they reported and the outcome).

       6. After 5 minutes, collect any remaining Envelope 3 and the filler tasks.

     Round 2:
        Same, but swap roles: Group B are now HH, Group A are drivers. Use new codes (HH2-1 to HH2-11). Use a new set of envelopes and driver sheets.

     After Round 2:

       7. Calculate payoffs for both rounds for every student. Remember: each student played one HH and one driver. Total points = HH points in their HH round + driver points in their driver round.

       8. Reveal the aggregate results on the whiteboard. Then discuss as above.

       9. Announce the top third and let them pick essay titles.

   Note: Keep the master recording sheet private (do not reveal individual decisions).

   This design meets the constraints and builds in the two wrinkles (bond and cheap-talk). It should run within 80 minutes.

   Let's hope it works!
answer: |-
  ### Rational Irrationality: Hitchhiker's Dilemma Activity  
  **Designed for 22 students, 80 minutes, with one PhD assistant.**  
  **British English, runnable off the page.**  

  ---

  #### **Core Setup**  
  - **Roles:** Students split into **Hitchhikers (HH)** and **Drivers (D)**. Each round pairs one HH and one D anonymously.  
  - **Payoffs:** Points convert to **essay title picks** (top third get first choice). No real money.  
  - **Materials:**  
    - Envelopes (coded: `HH1`, `HH2`, ..., `D1`, `D2`, ...).  
    - Index cards for messages.  
    - Whiteboard for aggregate results.  
    - Filler task (e.g., a 5-min logic puzzle).  
  - **Anonymity:** Codes, private matching, reshuffled pairings. Only aggregate stats revealed.  

  ---

  #### **Rules & Payoff Table**  
  **Key Stages:**  
  1. **Bond Purchase (HH only):** Buy a binding "bond" *before* knowing if picked up.  
  2. **Cheap-Talk Message (HH only):** Write one sentence to driver (can lie about bond).  
  3. **Driver Decision (D only):** Read message → Report probability of payment → Decide: **STOP** or **NOT STOP**.  
  4. **Filler Task:** 5-min unrelated puzzle (simulates time gap to "safety").  
  5. **Payment Decision (Unbonded HH only):** If picked up, decide: **PAY** or **NOT PAY**.  

  **Payoffs (Points):**  
  | Scenario                            | Hitchhiker (HH) Points | Driver (D) Points                          |  
  |-------------------------------------|-------------------------|--------------------------------------------|  
  | **Bond purchased** (cost: 20 pts)   |                         |                                            |  
   - Not picked up                     | \-20                    | 0 (if not stopped)                         |  
   - Picked up                         | 80 (ride) - 20 = **60** | 100 (payment) - 10 (cost) = **90**         |  
  | **No bond, not picked up**          | 0                       | 0                                          |  
  | **No bond, picked up & PAY**        | 80 - 100 = **-20**      | 100 - 10 = **90**                          |  
  | **No bond, picked up & NOT PAY**    | **80**                  | \-10 (cost of stopping)                    |  
  | **Driver doesn’t stop**             | Bond: -20; No bond: 0   | 0                                          |  
  | **Probability Accuracy Bonus (D):** | \-                      | +10 if exact match; +5 if ±10%; else 0     |  

  **Rationale:**  
  - Bond costs 20 pts upfront (non-refundable). Ensures payment if picked up.  
  - Without bond, HH **always better off not paying** once safe (80 > -20).  
  - Driver earns 90 if paid, loses 10 if not. Accuracy bonus incentivises honest beliefs.  

  ---

  #### **Timeline (80 Min Total)**  
  **Round 1 (35 Min):** Group A = HH (11), Group B = D (11).  
  **Round 2 (35 Min):** Group B = HH, Group A = D.  
  **Debrief (10 Min):** Aggregate results + discussion.  

  | Time  | Activity                                                                 | Details                                                                                                |  
  |-------|--------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|  
  | 0-5   | **Intro + Role Assign**                                                  | Explain rules, split groups. Hand out HH envelopes (1, 2, 3) and D sheets. Emphasise: **one-shot, anonymous**. |  
  | 5-10  | **HH: Bond Decision + Message**                                          | HH: Envelope 1 (buy bond? ✓/✗) → Envelope 2 (write message). *PhD collects envelopes 1+2.*            |  
  | 10-15 | **D: Read Message + Decide**                                             | *Facilitator* matches HH messages to D randomly. D: Read message → Write p(%) → STOP/NOT STOP.        |  
  | 15-20 | **Filler Task**                                                          | *All* do puzzle. *Facilitator* processes stopped pairs: Checks bond status (envelope 1).              |  
  | 20-25 | **HH: Payment Decision** (if unbonded & picked up)                       | Unbonded HH: Envelope 3 (PAY/NOT PAY). *PhD collects.* Bonded HH: No action (auto-pay).               |  
  | 25-30 | **Repeat Prep**                                                          | Reset materials. Swap roles (Group A↔B). Hand out new envelopes/sheets.                               |  
  | 30-65 | **Repeat Round 2**                                                       | Repeat steps 5-25 for new groups.                                                                     |  
  | 65-70 | **Calculate Points**                                                     | *Facilitator/PhD* compute points privately using master sheet.                                        |  
  | 70-80 | **Reveal + Debrief**                                                     | Show aggregate stats on whiteboard. Top third pick essay titles. Discuss.                             |  

  ---

  #### **Reveal Protocol**  
  1. **Aggregate Stats on Whiteboard:**  
     - % HH who bought bond.  
     - % D who stopped.  
     - % Unbonded HH who paid after being picked up.  
     - % HH who lied about bond in message.  
     - D’s avg. p for payers vs. non-payers.  
  2. **Key Questions for Students:**  
     - "Did drivers stop more for HH who claimed a bond? Did they trust them?"  
     - "Did unbonded HH who lied about the bond actually pay?"  
     - "How accurate were drivers’ predictions?"  

  ---

  #### **Debrief: Mapping Activity to Theory**  
  1. **Ex Ante Rationality of Bond:**  
     - **Data Point:** Show bond purchase rate. Ask: "Why pay 20 pts for something that forces you to lose money later?"  
     - **Link:** Bond is a *commitment device*. HH in "desert" (ex ante) buys bond to guarantee ride (driver trusts), even though "safe" self (ex post) regrets it.  
     - **Contrast PD:** "This isn’t ‘defect always’! HH can’t commit *without* bond. PD was simultaneous; this is sequential."  

  2. **Tying Hands vs. Changing Preferences:**  
     - **Bond = Ulysses’ Mast:** "The bond *forces* payment. It doesn’t change HH’s desire to keep the money—it removes the choice."  
     - **Cheap Talk = Empty Promises?** "Lying about the bond didn’t help unbonded HH. Why? Drivers anticipated betrayal."  

  3. **Structural Asymmetry & Time Inconsistency:**  
     - **Driver’s Beliefs:** Use p-data. "Drivers predicted non-payment accurately—they *knew* unbonded HH would ‘defect’."  
     - **Gap in Time:** "Filler task simulated the shift from ‘desperate’ to ‘safe’. Rationality at t=0 ≠ rationality at t=1."  

  4. **What the Activity Can’t Capture (Say This!):**  
     - "In real life, *you* are both HH in desert and HH in town. This activity splits roles—so we miss the internal conflict."  
     - "It shows *what pays*, not what rationality requires. Philosophers: Should ‘rational’ include commitment to promises?"  

  ---

  #### **Predictable Problems & Fixes**  
  | Problem                                  | Fix                                                                                                |  
  |------------------------------------------|----------------------------------------------------------------------------------------------------|  
  | **Econ-types meta-game bond**            | Emphasise: "Bond cost/benefits fixed. No repeated games." Show payoff maths upfront.               |  
  | **Everyone buys bond → no variation**    | Set bond cost high (20 pts). Debrief: "If all buy, drivers always stop—but then why not free-ride?"|  
  | **Drivers stop for all (politeness)**    | Penalise stopping (-10 pts). Say: "You lose points if HH doesn’t pay."                             |  
  | **HH refuse to break promise**           | Acknowledge: "Some paid without bond! This is real—people *do* keep promises. But drivers don’t know." |  
  | **Lying poisons atmosphere**             | Normalise: "Lying is allowed. We’ll see if drivers believed it." Focus on aggregate, not individuals. |  
  | **Anonymity breach**                     | Use coded envelopes. PhD matches privately. Never reveal individual decisions.                     |  

  ---

  #### **Materials Checklist**  
  - [ ] 44 envelopes (22 HH × 2 rounds), coded.  
  - [ ] 22 index cards for HH messages.  
  - [ ] 22 D response sheets (p%, STOP/NOT STOP).  
  - [ ] Filler task sheets (e.g., Sudoku).  
  - [ ] Whiteboard markers + master recording sheet.  
  - [ ] Dice for random pairing (or pre-shuffled codes).  

  **Run it confidently—students will feel the tension between commitment and betrayal!**
