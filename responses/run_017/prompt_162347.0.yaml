          - Envelope 3 (payment decision, only for unbonded HHs): contains a form: "You have been picked up and have arrived. Do you pay the 100 points? Circle: PAY or NOT PAY." This envelope has the same HH code and is sealed after the decision (if they are unbonded and picked up). For bonded HHs, this envelope is not used.

