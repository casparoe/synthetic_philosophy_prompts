answer: |-
  Here's a reading focused on your core concerns, designed for discussion with undergrads familiar with Singer's drowning child. The film dramatizes the **structural burden of open-endedness and the threat to integrity**, not primarily the scale of demand, and significantly shifts towards a **distributed-duty model** by the end.

  **Core Argument:** *Spider-Man 2* powerfully illustrates the demandingness objection not through *how much* is asked of Peter (though that's intense), but through the **ceaseless, identity-consuming nature of the obligation** (your point (a)) and its **erasure of Peter's intrinsic projects and relationships** (your point (b)). However, the resolution suggests the demand isn't meant to be borne alone, offering a critique of *isolation* inherent in extreme interpretations of "power = responsibility."

  **Is "With Great Power..." Consequentialist?**
  Likely not purely. It's closer to a **role duty/virtue ethic hybrid.** Peter's power creates a unique *role* (protector), demanding specific virtues (courage, self-sacrifice, responsibility). The "responsibility" is relational (to the community he *can* protect) and character-based. A consequentialist (e.g., Singer) would agree Peter *should* act, but their justification rests solely on outcomes, not role or character. This matters: the film's *moral logic* isn't purely outcome-focused, making it a dramatization of *a demanding moral principle*, not a direct consequentialist parable. The *strain* Peter feels, however, perfectly mirrors the demandingness critique *of* consequentialism.

  **Key Scenes & Analysis:**

  1.  **Peter's Meltdown (Pizza Delivery / Failing Classes / Aunt May's Loan):**
      *   **The Demand:** Not saving a specific child, but the **constant, open-ended drain.** Every minute delivering pizzas is a minute not stopping a mugging. Every hour studying is an hour a bank might be robbed. His physics project *intrinsically matters* to him (integrity), but the moral math renders it worthless unless it aids heroism. His love for MJ becomes a liability. The film shows the cost: exhaustion, poverty, alienation, failure in his personal goals.
      *   **Is Quitting a Failure?** The film is **ambivalent, leaning towards failure *caused* by unsustainable pressure.** His evasiveness (lies, missed plays) *is* a moral failing (dishonesty, broken promises), but it's presented as a *symptom* of being crushed by the open-ended demand. The "Spider-Man No More" trash can moment feels like despair, not principled limit-setting. The montage of him *thriving* without the suit tempts us to see quitting as legitimate self-preservation... until the fire happens.
      *   **Consequentialist Pushback:** A card-carrying consequentialist would argue Peter's *failures here are due to poor optimization*, not the principle itself. He should have leveraged his intellect (e.g., patents for web fluid?) to fund his life *and* heroism efficiently, or found allies sooner. His suffering stems from bad strategy and guilt, not the demand's inherent structure.

  2.  **The Fire Rescue & Return to the Suit:**
      *   **The Elasticity Trap:** This scene screams your "elastic demandingness." Saving the child costs Peter *nothing* physically (strength, speed, agility). He hesitates *only* because he's trying to quit. The bystanders *expect* him to act ("Where's Spider-Man?"). The film argues: **when your marginal cost is near-zero *and* the need is immediate/grave, refusal *is* a profound moral failure.** Quitting isn't sustainable because the demand doesn't cease; it just finds him anyway.
      *   **Supererogatory Gone?** **Yes, for Peter.** Once he *has* the power and the need is clear/grave, *any* act within his capacity moves from "above and beyond" to **duty.** Saving the child isn't heroic in the supererogatory sense; it's baseline expectation. The film eliminates supererogation for the powered individual facing proximate, preventable harm.
      *   **Consequentialist Pushback:** They'd cheer this scene! It perfectly illustrates Singer's point: if you can prevent something bad with minimal cost, you must. Peter's minimal cost makes refusal indefensible. The scene vindicates the demanding principle.

  3.  **The Train Sequence:**
      *   **The Shift to Shared Duty:** This is crucial. Peter gives *everything* to stop the train – it nearly kills him. But the demand **overwhelms even his powers.** The passengers' actions are pivotal:
          *   **Catching Him:** They save *him* from Doc Ock.
          *   **"He's just a kid!":** Recognizing his humanity, vulnerability, and limits.
          *   **Protecting His Identity:** Actively shielding him.
      *   **Meaning:** This transforms the moral landscape. The demand isn't solely Peter's. **The community recognizes its own responsibility.** They share the load *literally* (holding the ropes) and *figuratively* (acknowledging their role). Aunt May's later speech ("I believe there's a hero in all of us") codifies this: responsibility is **distributed** according to capacity and circumstance. Peter's unique power demands unique action, but not the *exclusive* burden of vigilance and sacrifice.

  4.  **Aunt May's Speech ("I believe there's a hero in all of us..."):**
      *   **The Distributed-Duty Model:** This directly addresses the open-endedness and integrity concerns. The "hero" isn't just the super-powered individual sacrificing everything. It's **everyone acting responsibly within their own lives and capacities.** This offers a ceiling: you fulfill *your* role, pursue *your* worthy projects (like Peter's science, MJ's art, May's quiet decency), *and* step up when directly confronted with need you can meet. It protects integrity by integrating responsibility with personal life, rejecting total self-abnegation.
      *   **Is this Consistent?** Mostly. Peter's return isn't to endless, solitary martyrdom. He fights Doc Ock specifically, saves MJ specifically, and the film ends with him choosing his life *with* the suit, suggesting better integration (though challenges remain). The focus shifts from stopping *every* crime to confronting the *specific, catastrophic threat* he is uniquely positioned to handle.

  **Where the Reading Breaks Down / Genre Constraints:**

  1.  **Supervillain Stakes:** Doc Ock is an existential, world-ending threat. This rigs the stakes. In the real world without Doc Ocks, the "constant grave emergency" justifying ceaseless action is less clear-cut. The film can't perfectly analogize to regular charitable giving where harms are diffuse and systemic.
  2.  **Doc Ock as Foil:** Ock *is* primarily about obsession corrupting a worthy project (fusion), not about moral demandingness per se. He's a dark mirror to Peter's potential path, but not a direct counter-argument to consequentialism's demands.
  3.  **The Suit Must Return:** Genre demands Spider-Man. His quitting *must* be temporary. This weakens the legitimacy of quitting as a permanent moral limit. The film *needs* him back for the climax.
  4.  **Marginal Cost is *Too* Low:** Peter's near-zero physical cost makes the "demandingness" argument based on *effort* almost comical compared to real-world sacrifice. The film tackles the *structural* burden instead.

  **The Film's Unique Contribution (Beyond the Papers):**

  Singer argues abstractly about proximity and cost. *Spider-Man 2* viscerally dramatizes the **psychological and existential toll of an open-ended, identity-consuming obligation:**

  *   **The Erosion of Self:** We see Peter Parker *disappear* under the weight of Spider-Man's duty – his dreams fade, relationships crumble, joy vanishes. Papers talk about cost; the film shows the *annihilation of the moral agent's own life project*.
  *   **The Illusion of the Capable Isolate:** The train sequence powerfully rebuts the idea that the maximally capable individual *should* bear the load alone. It argues for **mutuality and shared responsibility**, even when capacities differ wildly. This challenges the hyper-individualism sometimes implicit in demanding consequentialism.
  *   **Ambivalence as Insight:** The film doesn't offer easy answers. It makes Peter's suffering deeply sympathetic, validates the *need* for his power in emergencies, critiques his evasiveness *and* the unsustainable burden, and ultimately points towards integration and shared duty. This complexity reflects the real tension better than a binary "too much/just right" argument.

  **Discussion Launchpad:**

  1.  "Peter's powers make saving that kid from the fire cost him almost nothing. Does that mean he *had* to do it? Is *any* refusal immoral? Does this apply to us with money?"
  2.  "Was Peter *wrong* to try and quit? Or was the world wrong for needing him so much? How does the train scene change that equation?"
  3.  "Aunt May says 'there's a hero in all of us.' Does this let Peter off the hook for being Spider-Man? Or does it just mean the rest of us have to step up too? What does 'stepping up' look like in our world?"
  4.  "By the end, is Spider-Man something Peter *has* to be, or something he *chooses* to be? Does that choice make it less of a duty?"

  This reading gives you a principled stand: Peter's struggle shows why a morality demanding *everything, always* is unsustainable and destructive of the self, even when the marginal cost *seems* low. The film suggests the answer isn't less responsibility, but **responsibility shared, contextualized, and integrated with a human life.** You bought a bike? The film, read this way, suggests that integrating worthy personal projects *alongside* responsibility isn't just normal, it's necessary for being a hero who endures.
