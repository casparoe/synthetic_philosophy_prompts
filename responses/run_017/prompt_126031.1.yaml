  4) Check if any heroism remains supererogatory once powers exist
  5) Provide 3-4 key scenes, consequentialist counterarguments, and unique contributions to the debate

  I should avoid academic jargon. The train scene and May's speech clearly support their "distributed duty" hunch. The "spider no more" sequence is perfect for examining if quitting is framed as weakness or self-preservation. Doc Ock works better as a foil about obsession than demandingness - good catch by user. 

  Biggest insight: the film uniquely dramatizes how open-endedness (not scale) crushes Peter. Papers argue abstractly about "no rest for the virtuous"; here we see a man unravel because he can't attend his own life. The train rescue's reciprocity ("he's just a kid!") humanizes him in ways theory can't. 

