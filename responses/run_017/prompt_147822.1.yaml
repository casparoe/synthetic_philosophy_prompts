prompt: |-
  I've been trying to work out what I actually think about when you're allowed to just take someone's word for something. Every time I read the reductionism vs anti-reductionism literature I come away feeling like both sides nail some cases and neither one describes my actual pattern of gut reactions, so I want to try it from the other end: here are my verdicts, you tell me what principle is underneath them, or tell me one of them has to go.

  1. Train station in a city where I speak none of the language. I hold up my ticket, a guy in a station uniform says "quatre" and points at the board. I believe him. I have zero evidence about this guy — no track record, he might be a random person who found the jacket. Still: justified.

  2. Ten minutes later, same guy, unprompted: station's shutting, come with him, he'll get me a cab. I don't believe him. Note this is the same speaker and the same kind of boring, practical, checkable claim; the difference is that it's the sort of thing that pays to lie about and I'd end up alone with him in a car. But I also think, if I'm honest, that I'd have believed a *different* stranger who said "trains are cancelled, it's on the board." So I don't think "stranger" is what's doing the work here.

  3. My neighbor has sent me to four restaurants I thought were awful. She tells me a new Thai place opened on 5th — I believe her instantly. She tells me it's the best Thai food in the city — I believe her not at all; my credence that it's good is basically what it was for a random new restaurant. I take myself to be justified both times. And notice the contrast with case 1: there I gave a total stranger *full* trust on something I couldn't check at all, and here I'm discounting someone with a track record on something I could check in ten minutes. If you'd asked me to state a principle in advance I'd have predicted the opposite pattern.

  4. My brother, who has never once lied to me and is completely hopeless at reading a room, tells me everyone at my party liked me. I don't believe him. My mother, who is extremely good at reading rooms and cheerfully admits she lies to me whenever the truth would upset me, tells me the same thing. I half believe her — my credence genuinely goes up. I can't tell you why these two go in opposite directions and I suspect one of them has to be given up.

  5. My mechanic, nine years, never once wrong about my car. He says: "honestly I haven't looked at it, I've got no idea, this is a pure guess — but if I had to bet, it's the alternator." My credence that it's the alternator goes up. I go back and forth on this one constantly. One part of me says that's straightforwardly irrational: he told me he has no evidence, so a guess from him is noise. Another part says a nine-year track record is exactly the sort of thing that makes someone's hunches informative, so of course it moves me. A third part says the first two are really fighting about whether testimonial warrant has to be *transmitted* from the speaker's grounds or whether the speaker's say-so is enough on its own.

  6. Two hundred reviews of a hotel, each from an account that has reviewed exactly one thing in its life, no photos, kind of generic wording, average 4.6. I trust the aggregate somewhat — enough to book. I don't trust any single one of them at all, and I'd trust one long specific review from someone with a history of eighty reviews more than the whole two hundred, even though that one person might be a shill and the two hundred obviously aren't all shills. Also: if you told me 30% of them were definately fakes, I think I'd still book, and I can't tell wether that's coherent or just laziness.

  7. A note in my own handwriting from about ten years ago: "the yellow tin under the sink is the one with the BAD stuff — don't use it." I believe this more firmly than I'd believe my own memory right now, and more firmly than I'd believe a friend telling me the same thing today. Also, I now know that ten-years-ago me used "BAD" loosely — it might just mean "gives you a rash." I still believe it's the bad tin.

  8. And the case that got me started on all this. I fine-tuned a language model on my own old journals and emails and asked it what I was doing in March 2017. It produced a fluent, specific narrative; the eight or nine details I can independently check, it gets right; there are two confident details I'm fairly sure are fabrications. I have some mild but real inclination to believe its unchecked claims — more than nothing, noticeably less than I'd believe a human stranger who performed the same way on the checkable bits, and much less than I believe my note in case 7, even though the model has a *better* recent accuracy record than my ten-year-old self did. I don't know what I'm trusting when I trust it.

  The principle I keep half-formulating is something like: you're entitled to take someone's word for it, with no evidence needed, provided (a) they present it as true rather than as a guess or as something they're merely passing on from elsewhere, (b) you have no specific reason to doubt their honesty or their competence on the kind of question at hand, where "kind of question" is carved as finely as your evidence about them lets you carve it, and (c) evidence plays no other role — the entitlement isn't built out of any induction about how reliable testimony generally is; the doubt-clause is the only place evidence gets in.

  Test it against 1 through 8 and tell me where it breaks. Two things I especially want: whether clause (c) can survive cases 6 and 8, where the thing that seems to be doing the work is a track record rather than a person presenting something as true; and what the account predicts about two cases I have no verdict on — (i) A tells me p, A's only source is B, B's only source is A, and neither has anything else to go on: is that better or worse than a chain of thirty people where each one got it from the previous one? (ii) suppose a language whose grammar forces you to tag every report as "passed on, I don't vouch for it" — would its speakers be epistemically worse off, or would clause (a) simply never get satisfied for them, and is that a problem for the principle or just a fact about them?

  If nothing single and clean covers all eight, say which verdict I should drop and why. And please be straight with me about which of my cases is just confused rather than actually pressing. Start with the principle in one sentence — or with "no single principle; drop verdict #__" — then give me the reasoning; no preamble, and don't restate my cases back at me before you've said something.
reasoning: |-
  Okay, the user is struggling with when it's justified to believe someone's testimony. They've listed eight scenarios where their gut reactions don't neatly fit into existing epistemological frameworks like reductionism vs anti-reductionism. I need to analyze these cases and see if there's a unifying principle or if some verdicts need revision.

  Looking at their proposed principle: entitlement to believe without evidence if (a) presented as true, (b) no specific doubts about honesty/competence, and (c) no reliance on general reliability induction. Let me test this against each case.

  Case 1: The ticket agent says "quatre." Fits perfectly - presented as fact, no specific doubts, no need for evidence. Verdict justified.

  Case 2: Same agent suggests a cab. Here, the invitation creates specific doubt (safety risk), so (b) fails. But the user would believe a different stranger about train cancellations - which makes sense because that lacks the risk factor. The key is the "carve finely" aspect of competence/honesty - here it's about motive in vulnerable situations.

  Case 3: Neighbor's restaurant claims. The factual claim (new Thai place) fits (a) and (b), but the evaluative claim (best in city) fails (b) because past inaccuracy on taste judgments creates specific competence doubt. This explains why they discount the latter despite track record.

  Case 4: Brother vs mother. Both say everyone liked the party. Brother is honest but incompetent at social reading - so (b) fails on competence. Mother is competent but dishonest - so (b) fails on honesty. Yet the user half-believes the mother. This breaks the principle - it seems they're weighting competence higher than honesty when both are compromised.

  Case 5: Mechanic's guess. He explicitly violates (a) by presenting it as a guess. The user's credence still rises due to track record. This directly contradicts (a) and (c), showing track record can override presentation.

  Case 6: Hotel reviews. Trust in aggregate but not individuals. The principle focuses on individual testimony, but here they're relying on statistical patterns and source diversity - which invokes induction about reliability, violating (c). The preference for one detailed reviewer also suggests weight to demonstrated competence.

  Case 7: Old note. Fits well - presented as fact (written assertion), no current doubts, and the self-as-source aspect satisfies (b). Even with changed language understanding, the core claim is believed.

  Case 8: Language model. Partial trust despite explicit fabrications. The model doesn't "present as true" in the human sense, and doubts exist about unchecked claims. Yet some credence is given - likely due to the verified details creating a local track record, again invoking induction and violating (a) and (c).

  The main tension points are cases 4,5,6,8 where track record and source competence seem to override the strict conditions. Specifically:
  - Case 4 shows we sometimes trust competent liars over incompetent truth-tellers
  - Case 5 shows track record can make even guesses credible
  - Case 6 demonstrates aggregate statistical trust
  - Case 8 reveals we extend some trust to non-human sources with verification

  The proposed principle fails most clearly in case 5 (mechanic's guess) and case 4 (mother's partial credibility). These suggest we do rely on inductive track records, not just absence of doubt.

  For the user's bonus questions:
  (i) Circular testimony (A↔B) should be distrusted - no independent grounding. A 30-person chain might degrade but isn't inherently baseless if origination was grounded. Worse than long chain.
  (ii) In a language requiring "no-vouch" tags, speakers might develop other trust signals, or clause (a) would indeed rarely trigger. Not fatal to the principle - just reflects their epistemic constraints.

  To salvage a unified view, the user might drop verdict 5 (mechanic's guess shouldn't raise credence) or 4 (don't trust the mother at all). But case 5's intuition feels strong - track records matter. A better approach might modify the principle to allow induction when track records exist, while keeping default trust for bare assertions without counter-evidence.

  The core insight surviving is: default acceptance of direct assertions, defeated by specific doubts about veracity risks in that context. But pure anti-reductionism can't handle the track record cases, and pure reductionism fails the default trust cases. A hybrid where background knowledge informs when to apply default trust might work, but needs refinement.
answer: |-
  **No single principle; drop verdict #5 (mechanic's guess) as inconsistent with your core intuition, and modify verdict #4 (mother's testimony) to "I disbelieve her."** Here's the reasoning, tested against your principle and cases:

  ### Your Proposed Principle (Revised):
  You're entitled to take someone's word for it, with no evidence needed, if:  
  (a) They *present it as first-hand knowledge* (not a guess or hearsay),  
  (b) You have *no context-specific reason to doubt their honesty or competence* (carved finely using available evidence), and  
  (c) *No defeaters override the default entitlement* (e.g., risk, stakes, or contradictory evidence).  

  This replaces your (a) "presented as true" with "first-hand knowledge" (excluding guesses), and refines (c) to allow evidence as a defeater but not a builder of entitlement.  

  ### Case-by-Case Breakdown:
  1. **✅ Fits**: Uniformed agent presents "quatre" as first-hand knowledge (a), no context-specific doubt (b) (no stakes/risk), no defeaters (c). Justified.  
  2. **✅ Fits**: "Come with me" invites doubt about motives (safety risk) → defeater (c). Trusting "trains cancelled" lacks risk → no defeater.  
  3. **✅ Fits**: Factual claim ("new Thai place") satisfies (a)–(c). Evaluative claim ("best in city") violates (b): track record shows incompetence on judgments.  
  4. **❌ Revise verdict**:  
     - Brother: Honest but incompetent → violates (b). *Should disbelieve*.  
     - Mother: Competent but dishonest → violates (b). *Should disbelieve entirely* (your "half belief" contradicts (b)).  
     *Drop partial trust in mother*; track record of dishonesty is a direct defeater under (b).  
  5. **❌ Drop verdict**: Mechanic explicitly violates (a) ("pure guess"). If track record justifies credence, it violates your (c) (induction required). *Reject intuition: his guess shouldn’t move you.*  
  6. **✅ Fits with (c) modification**: Aggregate trust isn't testimonial entitlement; it’s statistical inference (defeater-aware). Single reviews lack (a) (generic wording = not clearly first-hand) and (b) (anonymity invites doubt). Trusting one detailed reviewer satisfies (a)–(c) if they present firsthand experience.  
  7. **✅ Fits**: Note is presented as first-hand knowledge (a), no current doubt (b) (self-trust), no defeater (c). Looser language doesn’t override core claim.  
  8. **✅ Fits**: Model can’t "present as first-hand knowledge" (a) → no default entitlement. Mild trust in unchecked claims stems from *induction* (verified details), violating (c). Your lower trust vs. human/handwritten note aligns: humans satisfy (a), your past self satisfies (a)–(c).  

  ### Why Drop Verdict #5?  
  Your credence rise relies on *track record*, not default entitlement. This directly violates your (a) (presentation as guess) and (c) (induction required). Keeping it forces abandoning anti-reductionism, which your other cases rely on (e.g., 1, 7).  

  ### Why Revise Verdict #4?  
  Trusting the mother partially contradicts (b): her dishonesty is a specific, stakes-relevant doubt. Either reject her claim entirely or admit induction (which violates (c)).  

  ### Bonus Cases:  
  - **(i) Circular testimony (A↔B)**: Worse than a 30-person chain. Circularity is a *defeater* (c) → no entitlement. A long chain might have grounding at the source.  
  - **(ii) "No-vouch" language**: Speakers would be worse off. Clause (a) rarely satisfied → less default entitlement. Not a problem for the principle; it reflects their epistemic constraints.  

  ### Where Your Principle Breaks:  
  - **Clause (c) survives 6 and 8**: Both involve statistical/inductive trust, not default entitlement. Your principle excludes these, matching your intuitions (e.g., distrusting single reviews).  
  - **Clause (a) is key**: It explains distrust of guesses (5), aggregates (6), and non-human sources (8).  

  ### Verdicts to Drop/Modify:  
  - **Drop #5**: Mechanic’s guess can’t raise credence without induction.  
  - **Modify #4**: Disbelieve the mother entirely.  
  - **Keep 1–3,6–8**: These align with default entitlement + finely carved doubt.  

  **Final Principle**: Default acceptance of firsthand testimony, defeated by context-specific risks to honesty/competence or non-firsthand presentation. Induction applies only where entitlement is blocked (e.g., aggregates, guesses). Cases 4 and 5 press hardest because they sneak in track-record reasoning—eliminate those, and your pattern holds.  

  ---  
  **Straight Talk**: Case 4 is confused (you can’t rationally trust a liar more than an incompetent truth-teller without induction). Case 5 is inconsistent with your core principle—drop it. The rest reveal a coherent, anti-reductionist-leaning intuition with pragmatic defeaters.
