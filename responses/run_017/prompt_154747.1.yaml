prompt: |-
  I am drafting annotation guidelines for a content-moderation pipeline and, downstream, for a fine-tuning corpus, so I need a theory of what slurs do — semantically and pragmatically — that is good enough to decide, occurrence by occurrence, whether a token counts as a slur use. Before I go looking for one, I want the spec it has to meet.

  Give me the desiderata, each with the case that motivates it. The cases I want covered at least: reclaimed in-group use; pure mention, as in a news report, a linguistic example, or a quoted lyric; orthographic masking that leaves the offense intact; offense that survives negation, interrogation, and the antecedent of a conditional; the constructions where a slur is asserted to be true, or conceded as true while the speaker distances themselves; pejoratives that intuitively are not slurs, and the question whether there is any principled difference; a term that is a slur in one language and a neutral ethnonym in another; a nonce slur coined a few months ago inside a small online community; slurs whose target description is empty or false, and slurs whose target is picked out by an attitude or a behavior the target can abandon; and slurs aimed upward, at a dominant group.

  Tell me which of these are genuine desiderata and which I should discard as the prejudice of one camp or as something an annotation pipeline does not actually need. Classify each requirement as non-negotiable, negotiable, or optional for my purpose, and flag any pair that looks jointly unsatisfiable; my suspicion is that the embedding data and any satisfying account of reclamation pull against each other, and I want to know if that is real or only apparent. Identify the single requirement that does the most work in excluding candidate theories, and say why.

  Then a deliberately brief scorecard across the main families of view — pure expressivism, hybrid expressivist accounts, presuppositional accounts, conventional-implicature accounts, and the view that slurs are just pejoratives and there is no special phenomenon here — no more than one row each.

  Separate throughout what is settled from what is genuinely contested among people who work on these questions, and do not present a contested view as the consensus; mark explicitly where you are extrapolating beyond what the literature actually establishes.

  Format: two tables plus a short coda. Table 1 columns: id | requirement | motivating case | status (non-negotiable / negotiable / reject) | conflicts with (requirement ids). Table 2 columns: view | requirement it fails or most strains | verdict for my purpose. Coda, under 200 words of prose: the jointly unsatisfiable subset, if there is one, and the requirement that excludes the most. Then a two-item list headed settled and contested.
reasoning: |-
  Hmm, the user is drafting annotation guidelines for content moderation and fine-tuning, and they need a solid theory of slurs to decide when a token counts as a slur use. They've listed specific cases they want covered: reclaimed in-group use, pure mentions like in news reports, orthographic masking, embeddings in negation or conditionals, various speaker distancing constructions, pejoratives that aren't slurs, cross-linguistic variations, nonce slurs, slurs with false targets, upward-aimed slurs, and more.

  I need to analyze these as desiderata for a theory. Let me go through each one to classify them as non-negotiable, negotiable, or rejectable. Non-negotiables should include core pragmatic behaviors like offensiveness surviving embeddings—since content moderation needs to catch disguised uses—and distinguishing slurs from neutral terms in other languages, as misclassification could cause unfair censorship. Cases like reclaimed use are tricky but essential for accuracy, so they're negotiable with careful handling. Orthographic masking is non-negotiable because masked slurs are common online and must be detected. However, upward-aimed slurs might be rejectable if they're not truly equivalent to downward ones; the literature suggests slurs primarily target marginalized groups, so this case may not fit the core phenomenon.

  Next, potential conflicts: Reclamation and embedding data seem at odds because if a term is reclaimed, its offensiveness shouldn't persist in embeddings, but in practice, moderation systems might need to flag it regardless when used out-of-group. Also, nonce slurs vs. necessary conventionalization could clash—theories often require established derogation, but new slurs emerge rapidly online, so annotation pipelines must adapt. I should note these tensions in the table.

  For the scorecard of theories: Pure expressivism fails reclaimed use since it can't explain how in-group use loses expressive offensiveness. Hybrid expressivism struggles with nonce slurs due to reliance on conventions. Presuppositional accounts have issues with upward slurs if they assume inherent subordination. Conventional implicature handles embeddings well but falters with reclamation. The pejorative-only view is insufficient as it doesn't capture what makes slurs distinct and more harmful. The most excluding requirement is likely embedding data—it forces theories to account for offensiveness in complex sentences, which many stumble on.

  In the coda, I'll highlight that reclamation and embedding persistence might be jointly unsatisfiable for a single theory, but for annotation, practical compromises can be made. Settled points include the offensiveness of slurs and its conventional nature, while contested areas involve reclamation mechanics and whether upward slurs exist.

  Finally, I'll structure the output with two tables and a coda as specified, ensuring clarity on what's settled vs. contested.
answer: |-
  Here are the desiderata for a slur theory tailored to annotation, presented as requested. Key principles: Prioritize operationalizability for token-level decisions, acknowledge practical constraints of moderation/annotation, and distinguish settled linguistic phenomena from theoretical debates.

  **Table 1: Desiderata & Assessment**

  | ID | Requirement                                      | Motivating Case                                                                 | Status             | Conflicts With |
  | :-- | :----------------------------------------------- | :------------------------------------------------------------------------------ | :----------------- | :------------ |
  | R1 | **Distinguish reclaimed in-group use from derogatory out-group use.** | Black person using the N-word in solidarity vs. a racist use.                   | Negotiable         | R4, R9        |
  | R2 | **Identify purely descriptive mentions** (e.g., reporting, linguistics, quoting lyrics) *without* derogatory force. | News article: "The victim was called a [slur]." Linguist: "The word [slur] is highly offensive." | **Non-negotiable** | -             |
  | R3 | **Capture offensiveness persisting under orthographic masking** (e.g., "n\*\*\*\*r", "f\*g"). | Masked slur in a hateful comment still requiring moderation.                    | **Non-negotiable** | -             |
  | R4 | **Capture offensiveness surviving embedding** (negation, questions, conditionals, attitude reports). | "Is X a [slur]?", "If he's a [slur], he shouldn't...", "They said he's a [slur]." | **Non-negotiable** | R1, R9        |
  | R5 | **Identify uses where speaker distances themselves** but concedes/assumes the slur's descriptive content (e.g., "Even if he *is* a [slur]...", "So-called [slur]"). | "Granted, he might be a [slur], but that doesn't justify..."                    | **Non-negotiable** | -             |
  | R6 | **Distinguish core slurs from milder pejoratives** (e.g., "jerk" vs. racial slur). Is there a *principled* difference? | Need to prioritize annotation resources on the most harmful terms.              | Negotiable         | R10           |
  | R7 | **Handle terms neutral in one language but slur in another** (e.g., "Negro" in Spanish vs. historical English). | Annotating multilingual corpora or code-switched text.                          | **Non-negotiable** | -             |
  | R8 | **Account for very recent ("nonce") slurs** within small communities. | A new offensive term coined in a niche hate forum a month ago.                  | Negotiable         | R9            |
  | R9 | **Require conventionalization of derogatory force.** | Distinguishing established slurs from novel insults or context-dependent abuse. | Negotiable         | R1, R4, R8    |
  | R10| **Explain slurs targeting non-inherent characteristics** (attitudes, behaviors) vs. inherent groups. | Terms like "traitor" (pejorative?) vs. racial slur.                             | Optional           | R6            |
  | R11| **Explain "upward"-directed slurs** (e.g., "cracker", "gammon" for dominant groups). | Does "cracker" function identically to the N-word?                              | **Reject**         | -             |
  | R12| **Account for slurs with false/empty descriptive content** (e.g., archaic slurs for mythical groups). | Offensiveness persists even if the denoted group doesn't exist ("d\*go").       | Optional           | -             |

  *   **Rejected (R11):** "Upward" slurs lack the systematic oppressive force, historical weight, and capacity to subordinate that define core slurs. Treating them identically risks false equivalence and misallocating moderation resources. Annotation can flag pejoratives without equating them to racial/ethnic/gender slurs.
  *   **Key Conflicts:** R1 (Reclamation) vs. R4 (Embedding Persistence) is the central tension. A reclaimed term *shouldn't* carry derogation in-group, yet R4 suggests offensiveness is inherent and persists structurally. R9 (Conventionalization) conflicts with R8 (Nonce Slurs) – how established must a term be? R1 also conflicts with R9 (can a term be conventionally derogatory *and* reclaimed simultaneously?).

  **Table 2: Theory Scorecard**

  | View                            | Key Failing/Most Strained Requirement              | Verdict for Annotation               |
  | :------------------------------ | :------------------------------------------------ | :----------------------------------- |
  | **Pure Expressivism** (Just conveys hate) | **R4 (Embedding), R1 (Reclamation)**. Cannot explain why offensiveness embeds or how in-group use loses expressive force. | Poor - Fails core requirements.      |
  | **Hybrid Expressivism** (Descriptive + Expressive) | **R8 (Nonce Slurs), R1 (Reclamation)**. Relies heavily on *conventional* expressive force, straining new or reclaimed uses. | Strained - Struggles with R1 & R8.   |
  | **Presuppositional** (Presupposes inferiority) | **R11 (Upward Slurs), R12 (Empty Content)**. Presupposing inherent inferiority fits poorly for "upward" terms or mythical groups. | Moderate - Handles R4 well, fails R11. |
  | **Conventional Implicature (CI)** (Adds derogation non-at-issue) | **R1 (Reclamation), R5 (Distancing)**. Explains R4 & R5 brilliantly. Struggles immensely with how CI disappears in reclamation or varies in distancing. | **Best Fit** - Strong on R2,R3,R4,R5,R7. Weak on R1. |
  | **Pejorative-Only** (No special semantics) | **R4 (Embedding), R6 (Distinction)**. Fails to capture the unique, resilient offensiveness and systematic harm differentiating slurs. | Poor - Fails core requirements.      |

  **Coda**

  *   **Jointly Unsatisfiable?** The core tension is **R1 (Reclamation)** vs. **R4 (Embedding Persistence)**. A theory positing *inherent*, *conventionally encoded* derogation (needed for R4) struggles to explain how this vanishes *only* for a specific subgroup (R1). Conversely, contextualist accounts handling R1 often weaken the explanation for R4. **For annotation, the Non-negotiable R4 (Embedding) is the most excluding requirement.** Theories failing R4 (like pure expressivism or pejorative-only) are non-starters. The CI account handles R4 best, making it the strongest contender despite its R1 challenge.
  *   **Resolution for Annotation:** Prioritize R4. Treat reclaimed uses (R1) as a distinct *contextual/pragmatic class* requiring separate rules (e.g., speaker identity/community tagging), rather than expecting the core semantic/pragmatic theory of *slurhood* to fully account for the loss of offensiveness in-group. Accept that R1 is a negotiated, context-dependent annotation challenge.

  **Settled vs. Contested**
  *   **Settled:**
      1.  Slurs conventionally express strong derogation/contempt targeting groups based on inherent characteristics (race, ethnicity, gender, sexual orientation, religion).
      2.  This derogation is robust and persists under negation, questions, conditionals, and in mentions/reports (R4 is a settled *phenomenon*).
      3.  Slurs are distinct from milder pejoratives in their harm potential and systematicity (R6 has a practical consensus, even if the *precise* line is fuzzy).
  *   **Contested:**
      1.  The **mechanism** of derogation (expressivism, CI, presupposition) and how it interfaces with truth-conditional content.
      2.  The **nature of reclamation (R1)** and whether it changes semantics, pragmatics, or just acceptable usage contexts.
      3.  The **necessity and nature of conventionalization (R9)** vs. the status of very new terms (R8).
      4.  Whether **"upward"-directed slurs (R11)** constitute a genuine category of slurs or a distinct phenomenon.
      5.  How precisely to **characterize the "target"** of a slur, especially regarding non-inherent characteristics (R10) or empty/false descriptions (R12).
