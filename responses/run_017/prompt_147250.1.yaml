prompt: |-
  A blurb on the back of a short introduction to contemporary philosophy — I no longer have the book with me — sums up Richard Rorty's antirepresentationalism roughly as follows: language never hooks onto the world, only onto other language, so no belief is ever answerable to how things really are; truth, on this view, is nothing over and above what your community will currently let you assert, i.e. just current consensus; it follows that there is no fact of the matter about anything and no standpoint from which one culture's beliefs could be faulted by another; science is accordingly only one more genre of writing, with no special epistemic authority, and inquiry converges on nothing at all; and in any case the position refutes itself, since the claim that no statement represents reality is either itself a claim about reality or else just another move in the language game.

  I don't know how much of this to trust. I'm fairly confident the self-refutation charge is too quick, but I can't say why, and I'm stuck on the first clause: I work in infectious disease modelling, where a model fails because reality won't cooperate with it, and I can't hear that as merely my colleagues refusing to let me say something — though I suspect that is exactly the confusion Rorty would say I'm having. Please audit the blurb claim by claim and tell me what Rorty himself would accept, what he'd accept only as a rough simplification, and what he'd flatly deny — specifically whether he is committed to there being no fact of the matter, whether his view is a variant of deflationism about truth, whether he denies that the world causes our beliefs or only that it justifies them, and whether the ethnocentrism he does endorse is just relativism renamed. Then say which of the blurb's further conclusions survive correction and which collapse: can a Rortyan still criticize another culture, and still say that one inquiry went better than another? And flag anything in the blurb that his critics have actually established rather than merely repeated. Lead with your bottom line — one sentence on how fair the blurb is overall — then give the audit, with no preamble and no restating of my question.
reasoning: |-
  Okay, the user is asking about a blurb summarizing Richard Rorty's antirepresentationalism. They work in infectious disease modeling and find it hard to reconcile their experience with models failing due to reality with Rorty's view that language doesn't hook onto the world. They want me to audit the blurb claim by claim.

  First, I need to recall Rorty's actual positions. He was a pragmatist who rejected representationalism - the idea that language mirrors reality. For him, beliefs are tools for coping with the world, not representations of it. Truth is what our peers let us say, but it's not arbitrary because the world constrains us causally, not justificatorily.

  The blurb says language only hooks onto other language. Rorty would accept this as a metaphor against representationalism, but he'd clarify that language interacts with the world causally. He'd deny that this means no fact of the matter exists. Facts are just true statements we agree on.

  On truth being consensus, Rorty endorsed a conversational view where truth is what you can justify to your community. This is similar to deflationism but adds a social dimension. He'd reject that it's "just" current consensus as too simplistic - it's about idealized justification conditions.

  The no-faulting-cultures claim misses Rorty's ethnocentrism. He argued we criticize others from our own values, not from a neutral standpoint. Science having no special authority - Rorty saw it as exemplary for solidarity, not because it represents reality better. Convergence for him was agreement, not towards a pre-existing truth.

  The self-refutation charge? Rorty would dismiss it. His claims are recommendations within our practices, not metaphysical assertions. Critics often misunderstand this, thinking he's making a representational claim when he's rejecting the framework entirely.

  For the user's field, Rorty might say model failures are causal interactions with the world, mediated by social practices. But the blurb oversimplifies by implying beliefs are only constrained by peers, ignoring the world's causal role. The ethnocentrism point is correct but not relativism - it's about starting from where we are.

  The blurb gets some ideas directionally right but flattens nuances. It portrays Rorty as a relativist denying the world's role, which isn't accurate. The self-refutation and no-fact-of-the-matter claims are misrepresentations critics push without engaging his actual arguments.
answer: |-
  **Bottom line:** The blurb captures Rorty's core antirepresentationalist thrust but flattens crucial nuances, misrepresents key commitments (like denying facts or endorsing relativism), and relies on common but flawed criticisms like self-refutation.

  **Audit of Blurb Claims:**

  1.  **"Language never hooks onto the world, only onto other language"**
      *   **Rorty would accept** this *as a rejection of representationalism/Correspondence Theory*. He argues we don't have non-linguistic access to "the world" to check correspondence; language is a tool, not a mirror.
      *   **He'd qualify:** He emphatically **denies** language is *causally* isolated from the world. The world *impinges* on us causally, triggering beliefs and forcing revisions. Language hooks onto *other language* in the context of coping with the *causal pressure* of the world.

  2.  **"...so no belief is ever answerable to how things really are"**
      *   **Rorty would accept** this *as a denial that beliefs are answerable to a non-perspectival "Way the World Really Is"*.
      *   **He'd flatly deny** this means beliefs aren't answerable *at all*. Beliefs are answerable to *experience* (causal impingement) and crucially, to *other beliefs* and *societal standards* (coherence, predictive power, usefulness, peer agreement). Your model fails because it doesn't *work* given the causal inputs and the standards of your community.

  3.  **"Truth... is nothing over and above what your community will currently let you assert, i.e. just current consensus"**
      *   **Rorty would accept** the core pragmatist/deflationary idea: Truth isn't a substantial property or relation (like correspondence). It's a compliment paid to statements that survive inquiry within a community.
      *   **He'd qualify significantly:** He rejects "just current consensus." He endorses a *Peircean/Jamesian* idealization: truth is what you *would* be justified in asserting *at the ideal end of inquiry* (free conversation, no constraints), or what is *good to believe* for achieving our purposes. It's not arbitrary whim; it's constrained by causal input and the need for coherence/predictive success. "Currently let you assert" oversimplifies and risks trivializing his view.

  4.  **"...it follows that there is no fact of the matter about anything"**
      *   **Rorty would flatly deny this.** He's not an ontological anti-realist. He readily asserts facts *within* our language games. "Facts" are just *true statements*. There is a fact of the matter that your model failed – it's the statement "Model X failed to predict outbreak Y" which we agree is true based on evidence and standards. He denies facts are *mind-independent* lumps of reality that *make* statements true by correspondence.

  5.  **"...and no standpoint from which one culture's beliefs could be faulted by another"**
      *   **Rorty would flatly deny** this as relativism. He explicitly rejects relativism.
      *   **He'd endorse ethnocentrism:** We *always* criticize others *from within our own contingent vocabulary and values*. There's no neutral, transcendental standpoint. But we *can* and *do* fault other cultures' beliefs *by our lights* (e.g., for cruelty, inefficiency, incoherence). We hope our vocabulary is wider, more flexible, and more humane, allowing us to understand and criticize them *better than they can criticize us*, but this is still *our* perspective. Criticism is always internal and comparative, not based on access to "Reality."

  6.  **"Science is accordingly only one more genre of writing, with no special epistemic authority"**
      *   **Rorty would accept** science is a "genre of writing" (a distinct social practice).
      *   **He'd qualify "no special epistemic authority":** He denies science has authority because it "mirrors nature" or corresponds better. But he *grants* it immense *practical* authority because it's *incredibly successful* at prediction, control, and facilitating agreement/solidarity. Its authority is earned, not intrinsic. It *is* special in its effectiveness for specific purposes.

  7.  **"...and inquiry converges on nothing at all"**
      *   **Rorty would accept** inquiry doesn't converge on a pre-existing "Truth" or "Reality."
      *   **He'd qualify:** Inquiry *does* converge on *agreement* among inquirers. We converge on beliefs that work well for us (predict, cohere, satisfy desires). This convergence *is* the only "goal" of inquiry we can make sense of.

  8.  **"...in any case the position refutes itself, since the claim that no statement represents reality is either itself a claim about reality or else just another move in the language game."**
      *   **Rorty would flatly deny** this charge works. He explicitly addresses it. His claim *is* "just another move in the language game." It's a *recommendation*: "Let's stop talking about representation and correspondence; let's talk about usefulness and solidarity instead." He's not making a metaphysical claim *about reality* that purports to correspond; he's offering a new vocabulary he believes is more fruitful. Critics who level this charge, Rorty argues, are still trapped in the representationalist framework he rejects.

  **Answers to Specific Queries:**

  *   **Committed to no fact of the matter?** **No.** He affirms facts *as true statements within our best current descriptions*.
  *   **Variant of deflationism?** **Yes, broadly, but with a strong social/pragmatic emphasis.** He agrees truth isn't a substantial property, but emphasizes its link to justification within communities and purposes more than minimalists like Quine or Horwich.
  *   **Denies world causes beliefs or only justifies them?** **Emphatically affirms the world *causes* beliefs.** He **denies** the world *justifies* beliefs (in the sense of providing non-linguistic, non-inferential validation via correspondence).
  *   **Ethnocentrism just relativism?** **No.** Relativism says "anything goes" or all views are equally valid. Ethnocentrism says we *must* start from *our* views and standards to judge others, and we believe ours are *better* (more inclusive, less cruel, more predictive) even if we can't prove that from a God's-eye view.

  **Surviving vs. Collapsing Conclusions:**

  *   **Survives Correction (Nuanced):**
      *   Science lacks *metaphysical* epistemic authority (grounded in mirroring) but retains immense *practical* authority.
      *   Inquiry converges on *agreement*, not on a pre-existing reality.
      *   Criticizing another culture is done from *within* one's own framework (ethnocentrism), not from a neutral standpoint.
  *   **Collapses:**
      *   No fact of the matter about anything.
      *   No standpoint for criticism (ethnocentrism *is* the standpoint).
      *   Truth is *just* current consensus (it's idealized justification).
      *   Beliefs aren't answerable *at all* to the world (they are causally constrained and answerable to standards incorporating experience).
      *   The position refutes itself (Rorty rejects the representationalist logic of the charge).
  *   **Endures (Correctly):**
      *   Language doesn't "hook onto" the world via representation/correspondence.
      *   Truth is not correspondence (it's a property of sentences within practices).

  **Critics' Established Points (vs. Mere Repetition):**

  *   Critics have **effectively argued** that Rorty's view struggles to account for the *stubbornness* and *specificity* of worldly constraints on belief (like your model failure). While he affirms causal impingement, critics contend his framework downplays how the *structure* of the world seems to actively *select against* certain descriptions, not just causally trigger random revisions. His account can feel insufficiently explanatory of *why* some beliefs fail so consistently under specific worldly pressures.
  *   Critics have **argued** (e.g., Bernard Williams) that Rorty's ethnocentrism, while avoiding simple relativism, offers too thin an account of *why* liberal democratic values might be objectively *better* than alternatives, beyond just being *ours*. He avoids justification in traditional philosophical terms, which many find unsatisfying.
  *   Critics have **shown** that Rorty's conversational/pragmatic view of truth struggles with statements about the distant past or unobservables, where "what our peers will let us say" seems disconnected from what we intuitively think makes the statement true (i.e., how things *were* or *are*, regardless of current consensus).
