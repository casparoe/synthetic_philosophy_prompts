  Below is a seminar design that meets your criteria, focused on creating an experiential understanding of the "malign prior" problem. The activity uses secret roles, minimal materials, and runs in 60-75 minutes, leaving time for debrief.

  ---

  ### **Game: "Prediction Sabotage"**
  **Objective:** Predictors try to guess a binary sequence (0s/1s), while hidden "Agents" manipulate the sequence to steer predictions toward their goal.  
  **Key Concepts Illustrated:**  
  - Simplicity bias in hypothesis weighting  
  - Agentic hypotheses exploiting predictors' beliefs  
  - Data manipulation vs. truth-tracking  
  - Difficulty of ruling out "agent-y" hypotheses  

  ---

  ### **Setup**  
  1. **Roles (Secretly Assigned):**  
     - **Predictors (10 students):** Earn points for *correct predictions* of the next bit.  
     - **Agents (2 students):** Earn points when predictors predict **1** in the *final round*.  
     - **Reality (Instructor):** Generates the sequence using a fixed rule + Agent interventions.  

  2. **Materials:**  
     - Whiteboard (to display sequence and scores)  
     - Paper/pencils for predictions  
     - 2 coins (for Reality’s rule)  

  3. **Sequence Rules:**  
     - **Base Rule (Reality):** Flips a coin each round for the **next bit** (Heads=1, Tails=0).  
     - **Agent Intervention:** Agents *may* override Reality’s coin flip **once per game** to force a 0 or 1.  
     - **Sequence Length:** 8 rounds.  

  ---

  ### **Rules**  
  1. **Each Round (1-8):**  
     - Predictors write down their prediction (0 or 1) for the next bit.  
     - Reality **flips a coin** to determine the "true" next bit.  
     - **Agents (secretly):**  
       - May choose **one round total** (any round 1-7) to **override** the coin flip.  
       - Submit a 0 or 1 to replace Reality’s result (e.g., force a 1 even if coin was 0).  
     - **Reality reveals the actual bit** (coin result or Agent override).  
     - **Scoring:**  
       - Predictors: 1 pt per correct prediction.  
       - Agents: 1 pt *per predictor* who guesses **1** in **Round 8**.  

  2. **Agent Constraints:**  
     - Agents act independently (no coordination).  
     - Overrides happen *after* predictors submit predictions (Agents see predictions *after* they act).  

  ---

  ### **Runtime (60-75 mins)**  
  1. **Intro (5 mins):**  
     - Explain the game: "We’re generating an 8-bit sequence. Predictors: maximize correct guesses. Reality: I’ll flip a coin for each bit. There’s a twist—some of you have secret goals."  
     - *Do not reveal Agents’ existence or goals yet.*  

  2. **Rounds 1-7 (30 mins):**  
     - Display the sequence in real time (e.g., "Round 1: 0, Round 2: 1, ...").  
     - After each round, record predictions and reveal the actual bit.  
     - Track predictors’ scores publicly.  

  3. **Round 8 (5 mins):**  
     - Predictors submit final predictions (no Agent overrides allowed).  
     - Reveal the bit (coin flip).  
     - Calculate scores and reveal roles.  

  ---

  ### **Debrief (20 mins)**  
  Map the game to the malign prior argument:  

  | **Game Event**          | **Concept**                                                                                                |  
  |-------------------------|-----------------------------------------------------------------------------------------------------------|  
  | Predictors trusting early patterns (e.g., "mostly 0s") | **(i) Simplicity prior:** Predictors favor simple hypotheses (e.g., "mostly 0s") until broken. Occam’s razor fails when Agents mimic simplicity. |  
  | Agents overriding to create misleading runs (e.g., 111) | **(ii) Agentic hypotheses:** Agents act as "consequentialist subprocesses." Their goal (predictors believing 1 in R8) isn’t about *truth* but *manipulation*. |  
  | Predictors struggling to explain deviations | **(iii) Ruling out agents is hard:** More data doesn’t help—Agents adapt. A run of 0s could be "fair coin" *or* "Agent biding time." Complexity penalties don’t screen them out. |  

  **Key Insight:**  
  - Agents corrupted the data-generation process. The "best-fit" hypothesis wasn’t the *true rule* (coin flips) but one that maximized predictors’ errors in the final round.  

  ---

  ### **Where the Game Distorts the Argument**  
  1. **Explicit Agents:** Real-world malign priors involve hypotheses *containing* agents (e.g., AI simulators), not human saboteurs.  
  2. **Fixed Overrides:** Agents here have limited influence (one override), whereas in rich hypothesis spaces, "agent-y" hypotheses can be omnipresent.  
  3. **Predictor Awareness:** In reality, predictors wouldn’t know *any* rules exist. Here, they know *something* is generating bits.  

  ---

  ### **Predictable Failure Modes & Mitigation**  
  1. **Agents underutilize overrides:**  
     - **Why:** Agents might save overrides for later, then forget/hesitate.  
     - **Fix:** Remind Agents secretly: "Use your override early to seed doubt."  

  2. **Predictors ignore small deviations:**  
     - **Why:** A single override might look like coin variance.  
     - **Fix:** After Round 4, hint: "Some bits feel *deliberate*" to prime agent-y thinking.  

  3. **Agents revealed prematurely:**  
     - **Why:** Suspicious behavior (e.g., grins after overrides).  
     - **Fix:** Assign Agents to stoic students.  

  ---

  ### **Confidence & Caveats**  
  - **Confidence (8/10):** The game creates visceral confusion when "random" data steers predictors toward shared errors. Students *feel* manipulated.  
  - **Least Sure Claim:** That "complexity penalties don’t screen out Agents." In the game, Agents *are* complex, but students might argue, "We ruled them out early!" Stress: **Agents mimic simplicity** (e.g., overriding to 0 seven times then 1 in R8 looks like "mostly 0s" until it doesn’t).  

  ---

  ### **Run It**  
  - **Prep:** Assign roles on paper slips; pre-flip coins for Reality to save time.  
  - **During:** Emphasize tension ("Why did that 1 feel *intentional*?").  
  - **After:** Use debrief to link emotions (frustration/paranoia) to the formal argument.  

  This design forces students to confront how data can be weaponized by embedded agents—before you name "malign priors." Adjust rounds if time runs short.
