  The critical moment comes when precautionary principles conflict: "assume sentience" vs "don't interfere." The document will "resolve" this by choosing whichever supports existing policy, buried in a footnote. Final recommendation must be logically sound but repellent - perhaps prioritizing neurotoxins in organic farms.

