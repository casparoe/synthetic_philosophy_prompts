answer: |-
  Below is a complete, ready-to-run game plan for your 90-minute session, designed to convey the core lessons through experiential learning without jargon. The game uses dice, poker chips, and index cards to simulate betting scenarios, with facilitator notes for smooth execution.

  ---

  ### **Materials & Setup**
  - **Per Table (3 tables):**  
    - 2 ten-sided dice (labeled "Bet 1" and "Bet 2" for Phase 2).  
    - Poker chips: 14,000 total (1,000 chips per player × 14 players). Use high-denomination chips (e.g., 100 chips = $1,000) to simplify math.  
      - *Chip breakdown:* 14 × 1,000-chip stacks.  
    - Index cards (2 per player) + pens.  
    - Whiteboard with markers (to record bankrolls).  
  - **Facilitator tools:** Calculator (phone), timer, bag for collected index cards.  
  - **Player starting bankroll:** 1,000 chips (denominated as "units" to avoid money associations).  
  - **Rounding:** Stake sizes rounded to nearest integer. If a stake exceeds bankroll, cap at bankroll.  
  - **Bankrupt players:** At 0 chips, players stay at 0 but still "play" (roll dice and track theoretical losses). They rejoin with 1,000 chips in Phase 2.  

  ---

  ### **Game Rules**  
  **Win condition:** Highest bankroll after 10 rounds per phase.  
  **Bet rules (stated plainly):**  
  - **Single Bet (Phase 1):** Roll 1 die. Win on 1–6 (60% chance), lose on 7–10 (40% chance). Win: gain stake (bankroll = bankroll + stake). Lose: lose stake (bankroll = bankroll – stake).  
  - **Two Bets (Phase 2):** Roll 2 dice independently. Each bet follows the same win/lose rules as Phase 1.  

  ---

  ### **Timeline (90 Minutes)**  
  | Time  | Activity | Key Actions |  
  |-------|----------|-------------|  
  | 0–5 min | **Intro & Phase 1 Setup** | Explain Phase 1 rules. Players write on Card 1: (1) **Fixed fraction** (e.g., 20% = 0.2), (2) **Their expected final bankroll**, (3) **Room’s expected average bankroll**. Collect cards in a bag. |  
  | 5–25 min | **Phase 1: Single Bet (10 rounds)** | Each player rolls their own die per round. Steps:  
    - Calculate stake: `round(fraction × current bankroll)`.  
    - Roll die: Win (1–6) or lose (7–10).  
    - Update bankroll.  
    - After each round, record all bankrolls on whiteboard. |  
  | 25–30 min | **Phase 1 Debrief Prep** | Freeze bankrolls. Compute room average. Note who is ruined (0 chips) and who grew fast. |  
  | 30–35 min | **Phase 2 Setup** | Reset all to 1,000 chips. Players write on Card 2: (1) **Total fraction to bet** (T), (2) **Split fraction** (s, % of T on Bet 1).<br>*Example: T=0.4, s=0.5 → 20% on Bet 1, 20% on Bet 2.* |  
  | 35–55 min | **Phase 2: Two Bets (10 rounds)** | Per table, roll 2 shared dice per round (all players use same rolls). Steps:  
    - Calculate Bet 1 stake: `round(s × T × bankroll)`.  
    - Calculate Bet 2 stake: `round((1-s) × T × bankroll)`.  
    - Adjust if sum exceeds bankroll (rare; reduce larger stake by excess).  
    - Resolve each bet using die results.  
    - Update bankroll. Record on whiteboard. |  
  | 55–75 min | **Debrief & Lessons** | Use whiteboard data and index card predictions. Follow the script below. |  
  | 75–90 min | **Q&A + Limitations** | Discuss real-world context. |  

  ---

  ### **Facilitator’s Cheat Sheet**  
  **Key Numbers for Phase 1 (Single Bet):**  
  - **Optimal fraction:** 20% (maximizes growth).  
  - **Ruin threshold:** ~40% (growth turns negative).  
  - **Expected outcomes after 10 rounds** (median bankroll):  
    - 10% stake → ~1,160 chips  
    - 20% stake → ~1,220 chips  
    - 30% stake → ~1,160 chips  
    - 40% stake → ~980 chips  
    - 50% stake → ~710 chips  
    - 100% stake → 0 chips (ruin) with 99.4% probability  

  **Key Numbers for Phase 2 (Two Bets):**  
  - **Optimal total fraction:** 40%, split equally (20% per bet).  
  - **Ruin threshold:** ~70% total if unsplit, but split bets reduce risk.  
  - **Outcomes for 40% total after 10 rounds**:  
    - Split equally (20%/bet) → ~1,480 chips  
    - All on one bet (40%/0%) → ~980 chips  
    - Compare to Phase 1 20% (split not possible) → ~1,220 chips  

  **Interpreting Noise:**  
  - With 10 rounds, outcomes vary ±15% around median. Signal beats noise if:  
    - 20% > 30% in Phase 1 (optimal beats overbetting).  
    - Split 40% > Unsplit 40% in Phase 2 (diversification wins).  
    - Phase 2 split 40% > Phase 1 20% (more opportunities allow higher betting).  

  ---

  ### **Debrief Script (Map to Game Events)**  
  **1. The room’s average vs. individual ruin (Phase 1 data):**  
  - *Show:* Room average is high (e.g., 1,500), but many players are near 0.  
  - *Ask:* "Who predicted this? Why did the average climb while most went broke?"  
  - *Lesson:* A few reckless bettors (e.g., 50–100% stakes) win big and inflate the average, but most overbettors go broke. **Growth isn’t about averages—it’s about compounding without ruin.**  

  **2. The "right amount" changes with opportunities (Phase 2 data):**  
  - *Show:* Two players with 40% total stake:  
    - Player A (split equally): ~1,480 chips.  
    - Player B (all on one bet): ~980 chips.  
  - *Ask:* "Same bets, same luck—why different results?"  
  - *Lesson:* Splitting across independent bets reduces risk. When you have two chances, you can bet more in total (40% > 20%), but you **must spread it**.  

  **3. Handling the reckless winner:**  
  - *If a 100% bettor won:* "You did great! But if we played 100 rounds, how many would still be solvent? (Answer: 0.6^100 ≈ 0%). Betting all feels thrilling, but long-term growth requires restraint."  

  **4. Name the rule (final 2 mins):**  
  - "What you experienced is the **Kelly Criterion**: the fraction that maximizes growth. It depends on your edge and how you spread bets."  

  ---

  ### **Predictable Problems & Fixes**  
  | Problem | Solution |  
  |---------|----------|  
  | **Reckless players ruined early** | Keep them engaged: "Track what *would* happen if you continued." Let them roll dice for others. |  
  | **Math anxiety** | Pre-calculate stakes for common fractions (e.g., 10% of 1,000 = 100). Use poker chips for visuals. |  
  | "Why split?" confusion | Contrast two Phase 2 players at same table: "Same dice, different outcomes—only split caused it." |  
  | Short sessions = noisy data | Emphasize trends: "See how 20% *usually* beats 30%? Long run, this gap widens." |  

  ---

  ### **What the Game Can’t Show (Say This Aloud)**  
  1. **Long run > short run:** 10 rounds illustrate trends, but real compounding needs 100s of rounds.  
  2. **Unknown odds:** In life, we *estimate* edges. Overestimating (e.g., thinking a 50% bet is 60%) causes overbetting—the most common road to ruin.  
  3. **Utility of wealth:** Kelly maximizes growth, but if losing 50% would devastate you, bet less.  

  --- 

  This plan ensures both lessons—**overbetting destroys growth, and diversification allows higher betting**—emerge from lived experience. The dice, chips, and whiteboard make abstract concepts visceral, while the debrief ties it together. Run it as-is, and your group will feel the Kelly truths "in their bones."
