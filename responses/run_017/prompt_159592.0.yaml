  ### **Why This Works for Your Group**  
  - **Time**: Takes 12–18 minutes (90 sec/question + 5 min mapping).  
  - **Clarity**: Vignettes make distinctions tangible (e.g., Q6 concretizes "fragility"; Q5 embodies "origin matters").  
  - **No Brand Arguments**: All systems are fictional (e.g., "IdeaBot," "OmniBot").  
  - **Covers Your Distinctions**:  
    - Novelty (Q1) vs. innovation (Q2)  
    - Process (Q3), agency (Q4), origin (Q5), robustness (Q6), incommensurability (Q7), static omnicompetence (Q8)  
    - Locus of intelligence (Q4, Q5)  
  - **Leaves Match Requests**: Behaviorist, Profile Relativist, Model Essentialist, Extended Mind, and Teleological are directly included. The Adaptationist leaf covers the learning/static distinction.  

  After the exercise, group members can say: "I’m a Model Essentialist, you’re a Behaviorist—we disagree on whether robustness matters, not just definitions." This focuses arguments on root criteria, not semantics.
