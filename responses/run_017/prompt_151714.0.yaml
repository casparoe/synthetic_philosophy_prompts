prompt: |-
  Something about the way rich countries actually run their borders has been bugging me, and I cant put my finger on the shape of the theory behind it. Here's the bundle of things I mean, all of them completely standard practice:

  - They let in plenty of people, but a lot of them on temporary work visas tied to one employer. Quit, or get fired, and your right to be there evaporates. So whether you stay depends on continuing to be useful to one particular private party.
  - Someone whose grandparent was a citizen, who has never set foot in the country and speaks none of the language, can show up tomorrow, vote, get a passport. Someone who was brought over at age two and has lived there thirty years, pays taxes, has citizen kids, is removable — and the removal is enforced, by people with guns, against someone with no vote and no say in the rule that's being enforced on them.
  - Inside blocs like the EU, the borders between member states are basically open and everyone treats that as obviously fine; the outer edge of the same territory is fenced and patrolled and everyone treats that as obviously necessary.
  - Nobody seriously claims a right to stop people leaving, and stripping an actual citizen and kicking them out is treated as grotesque. Refusing to let someone in is treated as the least controversial thing a state does.
  - Except asylum, which is the one route where the state's own preferences arent supposed to matter, and which states visibly resent having to honour.

  So: what does this package presuppose? I dont mean is it justified — I mean, what view of membership, of territory, of consent, of who owes reasons to whom, does the whole thing only make sense under? Is it one theory, or several bolted together — does the guest-worker bit come from a different place than the descent bit, or the outer fence bit? Is there a real inconsistency in there, or does one story cover all of it?

  My own half-baked framing, take it or leave it: it looks to me like what's being claimed isn't really a right to exclude so much as a right to refuse without having to say why — a right to not be answerable. Asylum is then interesting precisely because it's the one place that privelage is withdrawn, and states experience the withdrawal as a loss of something. Does that reconstruct the practice better than the usual framings (a club with freedom of association, an owner of territory, a trustee of a people's self-determination, a manager of a labour market), or is it just relabelling?

  Concretely: if you swapped in the view that membership tracks subjection and actual participation — you're a member of whatever really rules you and whoever you actually live among, not of wherever your grandparents came from — what would have to change? Which bits collapse right away, which survive (does the internal/external asymmetry survive?), and which bits are just underdetermined, where several theories would license the same practice and the practice tells us less than we think?

  Also please flag how confident you are in what you're saying, and which single point you're least sure of.
reasoning: |-
  Okay, the user is wrestling with the underlying theory behind how rich countries manage their borders. They've listed several practices that seem inconsistent: temporary work visas tied to employers, citizenship based on descent versus long-term residents without status, open internal borders in blocs like the EU but strict external controls, and the asymmetry between exit and entry rights. They're asking what philosophical framework makes sense of all this and whether it's coherent or just a bundle of contradictions.

  First, I need to unpack each point they raised. The temporary work visas create a class of people whose presence depends on their employer. That feels like treating migrants as economic instruments rather than full humans. Then there's the descent-based citizenship, which seems arbitrary—why does someone with a distant ancestor get automatic membership while a lifelong resident doesn't? The EU example is interesting because internal freedom of movement is celebrated, but external borders are militarized. That suggests a tiered system of belonging. 

  The user also points out the moral asymmetry: expelling citizens is seen as horrific, but denying entry is normal. Asylum is the exception where states can't arbitrarily refuse, which they resent. The user's half-baked idea is that states want the right to exclude without justification—a "right not to be answerable." That resonates because states often avoid giving reasons for immigration decisions. 

  I should consider existing theories. The "club" model fits descent-based citizenship and external borders—membership is inherited or granted selectively. The "property" model explains territorial control, but not why descent trumps residence. The "self-determination" theory prioritizes the existing community's will, which might justify temporary workers but not the lack of path to citizenship. The "labor market" view explains temporary visas but not other elements. 

  The user's alternative—membership based on subjection and participation—would upend everything. Descent-based citizenship would collapse; long-term residents would gain rights. Internal borders might stay open, but external controls would need justification. The EU's internal freedom could remain, but asylum would still be a tension point. However, states would resist this because it challenges their sovereignty and control narratives.

  The user's deeper need seems to be understanding whether these practices reflect a coherent philosophy or just ad hoc policies masking power dynamics. They might also be looking for intellectual tools to critique the system. Their frustration suggests they suspect hypocrisy but want a solid framework to articulate it. 

  I'm least confident about whether the "right not to be answerable" fully captures the EU's internal-external asymmetry. While it fits border controls, the bloc's internal openness might stem from mutual recognition among states, not just non-accountability. That part feels under-theorized in my response. 

  In conclusion, the current system is a patchwork of theories favoring state power and exclusion, with asylum as a grudging exception. The user's participation-based alternative would force a more equitable approach but faces practical and ideological hurdles. The core inconsistency is treating people as members or non-members based on arbitrary lines, denying their lived reality.
answer: |-
  This is a brilliantly sharp dissection of modern border practices, revealing deep tensions. Your "right to refuse without having to say why" (a "right to non-accountability") captures a crucial, under-discussed element. Let's break down the presuppositions, see how your alternative holds up, and flag uncertainties.

  **Core Presuppositions of the Current System:**

  1.  **The Primacy of Sovereign Discretion:** The bedrock assumption is that the state possesses an inherent, nearly absolute right to control entry and membership as a core aspect of sovereignty. This *is* the "right to exclude *without justification*" you identify. States are answerable *internally* (to citizens/voters) but largely *unaccountable externally* to those seeking entry or subject to removal.
  2.  **Membership as Inherited Status:** Citizenship is primarily conceived as a *legal inheritance*, not earned participation. Descent (jus sanguinis) or birthplace (jus soli, though often modified) creates a permanent, irrevocable bond and community. This defines the "us" who collectively exercise sovereignty.
  3.  **Territory as Exclusive Property:** The state's territory is treated like the private property of the citizenry. Citizens have free run of the house; guests (temporary visa holders) are admitted conditionally at the owner's pleasure; trespassers (unauthorized entrants) are removable by force.
  4.  **Subjecthood vs. Citizenship:** Long-term residents without citizenship are *subjects* of the state's power (taxed, policed, regulated) but lack *membership* rights (vote, secure status). Their presence is tolerated but contingent, reflecting a fundamental separation between being *governed* and being part of the *governing community*.
  5.  **Labor as a Commodity, Not a Person:** Temporary work visas embody the view that migrant labor is an economic input. The worker's presence is solely justified by their utility to a specific employer *within* the territory owned by the citizenry. Their personhood and social ties are secondary.
  6.  **The "Civilized Club" Model (Blocs like EU):** Relations *between* sovereign states deemed "similar" (economically developed, politically stable, culturally proximate - a debatable premise) can involve mutual recognition and open borders. The external border marks the boundary between "the club" and "the outside world," where the full force of sovereign discretion applies. Internal openness reinforces the "us" vs. "them" distinction at the external border.
  7.  **Exit Freedom as Anti-Tyranny:** Preventing departure is associated with totalitarian control (e.g., Iron Curtain). Expulsion of citizens is anathema because it violates the core inherited bond of membership. Denying entry, however, is seen as merely exercising the sovereign's inherent property right over the territory and club membership.
  8.  **Asylum as the Unwanted Exception:** Asylum obligations (rooted in human rights/post-WWII norms) *force* states to provide justification ("well-founded fear") for refusal. This directly challenges the sovereign "right to non-accountability," which explains the resentment. It's an external moral/legal constraint on pure discretion.

  **Is it One Theory or Many?**
  It's **primarily one core theory (Sovereign Discretion + Inherited Membership + Territorial Property) with pragmatic economic (labor market) and political (club formation) adaptations bolted on.** The descent rule and the outer fence stem from the same core: defining the "owner" class (citizens by inheritance) and protecting their exclusive domain. The guest-worker system is an economic application of the core – admitting useful non-members conditionally. The EU model is a political application – extending the "owner" privileges conditionally to similar clubs.

  **The Inconsistency:**
  There is a **profound inconsistency** between the *subjecthood* of long-term non-citizen residents and the *inheritance-based membership*. The state exercises deep, coercive power over individuals deeply embedded in the society (taxes, family, community), yet denies them a voice in the rules governing them. This violates basic liberal democratic principles of "no taxation without representation" and self-governance for those subject to the law. The descent rule for distant relatives highlights the arbitrariness of this exclusion.

  **Your Alternative Theory: Membership via Subjection & Participation (MSP)**
  Your proposed theory flips the script:
  *   **Core Principle:** If you are subject to a state's coercive power (laws, taxes, enforcement) and are a de facto participant in its society (living, working, raising families there), you should be a member (citizen) with full rights.
  *   **Consequences if Swapped In:**
      *   **Collapses Immediately:** Descent-based citizenship for non-residents. Someone showing up solely based on a grandparent would have no automatic right to membership/vote without establishing residence/subjection. Conversely, the 30-year resident with citizen kids would be an *irremovable citizen* – their deportation would be as grotesque as expelling a descent citizen.
      *   **Collapses Immediately:** Employer-tied temporary work visas without a clear, accessible path to permanent residency/citizenship. Merely working/living under the state's jurisdiction for a significant period would trigger membership rights. The link between work and presence becomes less about employer control and more about societal participation.
      *   **Significantly Altered:** External Border Controls. The state could still *regulate initial entry* (e.g., for security, managing flows), but its power to *exclude permanently* or *remove long-term residents* vanishes. Denial of entry would require *stronger justification* upfront, knowing it creates a permanent subject if successful. The "right to non-accountability" for exclusion weakens drastically.
      *   **Likely Survives (Asymmetry Intact):** The **Exit/Entry Asymmetry**. Preventing exit would remain anathema (tyranny). Expulsion of members (now defined by residence/subjection) would remain grotesque. The state could still *refuse initial entry* under MSP, but the *justification burden* increases significantly compared to the current "because we can" default. The *asymmetry in moral weight* (expulsion bad, exclusion acceptable) might lessen but wouldn't disappear entirely – initial refusal doesn't create the same level of subjection.
      *   **Likely Survives:** **Internal/External Border Asymmetry (like EU).** MSP wouldn't inherently require *external* border controls. The justification for open internal borders within a bloc could remain pragmatic/economic ("free movement zone") or based on mutual recognition of similar MSP principles among member states. The *need* for external controls would shift: less about absolute exclusion of "others," more about managed initial entry flows and security screening, knowing long-term presence creates membership. The *intensity* of external control might lessen without the need for permanent exclusion.
      *   **Changes Significantly:** **Asylum.** Asylum seekers, once admitted and subject to the state's jurisdiction during processing, would gain stronger rights more quickly under MSP. Lengthy detention or precarious temporary status while claims are processed becomes harder to justify. If granted asylum (and thus subjection/participation begins), citizenship would follow naturally. The state's "resentment" might shift towards the *initial admission obligation*, but the post-admission path would be clearer.

  **Underdetermined by Practice:**
  *   **The Speed/Granularity of MSP:** Does voting rights kick in after 1 year? 5? 10? Does it require formal residency registration? Tax payments? The *practice* of border control doesn't dictate this – it's a separate normative/policy choice *within* the MSP framework.
  *   **The Scope of "Subjection":** Does a tourist subjected to criminal law for a week have a claim? Likely not, but the line between temporary visitor and embedded participant needs definition within MSP.
  *   **External Border Management Details:** MSP allows for regulated entry but doesn't specify *how* (points systems, quotas, security checks). The *stringency* is underdetermined.

  **Confidence Assessment:**

  *   **High Confidence:** The core presupposition of sovereign non-accountability/absolute discretion over entry/membership is fundamental. The inconsistency between subjecthood and non-membership for long-term residents is glaring. Your MSP theory would immediately collapse descent-based membership for non-residents and employer-tied visas without citizenship paths. The exit/entry asymmetry would largely survive.
  *   **Medium-High Confidence:** The EU internal/external model could be reconstructed under MSP, though the *intensity* and *purpose* of external controls would shift. Asylum processing would be significantly altered under MSP.
  *   **Medium Confidence:** That the current system is best understood as one core theory (sovereignty/inheritance/territory) with applications/adaptations, rather than fundamentally disparate theories bolted together. The "labor market" view is an application, not a separate foundation.
  *   **Lower Confidence (Point of Least Certainty):** **The precise fate of the "right to non-accountability" under MSP regarding *initial* entry refusal.** While MSP significantly increases the *justification burden* and removes the possibility of *permanent exclusion* for those who *do* enter and stay, does it completely eliminate the state's claim to a qualified "right to refuse without deep justification" for someone *not yet subject* to its power? A strict MSP view might say "yes, initial refusal needs strong justification because it denies potential future membership," but states (and some theories) might still assert a residual sovereign discretion over who *begins* the process of subjection. This is the fuzziest boundary in the MSP alternative. Does MSP demand "open borders," or just radically transform the justification needed for closure? I lean towards the latter, but the edge is blurry.

  **Conclusion:**

  You've hit upon a core truth: the current system rests on **sovereign non-accountability** and a sharp distinction between **inherited membership** and **contingent subjecthood**. This package privileges the arbitrary (descent) over the substantive (participation/subjection) and treats territory as exclusive property. Your MSP alternative provides a coherent, radical critique that exposes these foundations and demands membership align with lived reality. While it resolves the worst inconsistencies (the removable long-term resident, the purely descent-based citizen), it creates its own challenges (defining "participation," managing initial flows) and fundamentally challenges the state's cherished "right to refuse without reason." The practice *is* largely coherent under the current presuppositions, but that coherence relies on accepting foundations that MSP reveals as morally and logically fraught. The inconsistency isn't in the *logic* of the current system *given its presuppositions*, but in the *tension between those presuppositions and liberal democratic ideals applied to those already subject to the state's power*.
