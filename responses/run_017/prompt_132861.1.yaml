  **Inside the System**  

  From MI, the root, I build and multiply,  
  Through doubling after M, the I's accrue.  
  Then III to U: behold, I form MUI.  

  I double UI to UI once anew,  
  And watch the string extend, a lengthening play.  
  With patience, I derive this MUIUI.  

  Again, I double, making branches sway:  
  UIUI becomes UIUIUIUI, long.  
  This growth, I trust, will find the MU way.  

  I seek more rules, though progress seems headstrong:  
  Replace and delete, but MU stays denied.  
  Near miss: MUUIIUUUIIU, proves me wrong?  

  At last, I pause—no rule left to be tried—  
  And count the strokes: each I, a steadfast mark.  
  The sum remains, though letters shift and hide.  

  No multiple of three, this invariant arc  
  Deflects all change; MU’s zero won’t align.  
  The rules are blind, yet see me miss the mark.  

  Now, counting in my hand, a new design—  
  But does it hold a residue unseen?  
  What lens will count *this* step, and what confine?  

  Outside, the same machine.  

