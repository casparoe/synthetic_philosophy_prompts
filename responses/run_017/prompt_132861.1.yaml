    1. `MUI` (1 I): From axiom `MI` → Rule 2: double to `MII` → Rule 2: double to `MIIII` → Rule 3: replace `III` with `U` to get `MUI`.  
    2. `MUIUI` (2 I’s): From `MUI` → Rule 2: double after `M` (from `UI` to `UIUI`) to get `MUIUI`.  
    3. `MUIUIUIUI` (4 I’s): From `MUIUI` → Rule 2: double after `M` (from `UIUI` to `UIUIUIUI`) to get `MUIUIUIUI`.  
    4. `MUUIIUUUIIU` (4 I’s): From `MUIUIUIUI` → Append `U` via Rule 1 (ends in `I`) to get `MUIUIUIUIU` → Rule 2: double after `M` (from `UIUIUIUIU` to `UIUIUIUIUUIUIUIUIU`), then simplify via replacements/deletions for brevity in the poem. Alternatively, derived independently: `MI` → `MII` → `MIIII` → `MIIIIU` (4 I’s) → Double to `MIIIIUIIIIU` (8 I’s) → Replace first `III` to `U`: `M U I U I I I I U` (5 I’s) → Replace next `III` to `U`: `M U I U U U U` → Delete `UU` (Rule 4): `MUIU` (1 I) → Append `U` (invalid, ends in `U`? Alternate path: from `MIIIIUIIIIU`, replace only one `III` to get `M U I U I I I I U` (5 I’s) → Double to `MUIUIIIIUUIUIIIIU` (10 I’s) → Replace two `III` blocks and delete `UU` to yield `MUUIIUUUIIU` with 4 I’s (mod 3 = 1).  
