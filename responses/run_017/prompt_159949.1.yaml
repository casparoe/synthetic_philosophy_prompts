answer: |-
  Here’s a committed defense of nihilism against universalism, pressing the "idle posit" argument while confronting the costs of paraphrase head-on. I’ll write as your advocate, targeting your flatmate’s Lewisian stance:

  ---

  **The Case for Nihilism: Why Universalism’s Free Lunch is an Empty Plate**

  Your universalist insists that composition is unrestricted: for any arbitrary things, there exists a fusion. This fusion, they say, is an "ontological free lunch" – it supervenes on its parts, adds no new causal powers or matter, and costs nothing to admit. But if this fusion *does nothing* that its parts don’t already do *taken plurally*, then it is not just free – it is *idle*. And an idle posit, however harmless, is ontological dead weight. Nihilism – the view that only mereological simples exist, and composition *never* occurs – avoids this idle wheel while achieving all the same explanatory work through paraphrase. Let’s dismantle the free lunch.

  **(1) The Nihilist’s Paraphrase Machinery Does the Work (Without the Fusion)**
  The nihilist doesn’t deny that there appear to be tables. They deny that "There is a table" commits us to a composite entity *over and above* the simples. Instead, we say: "There are some simples arranged tablewise." This uses:
  *   **Plural Quantification:** "There are some simples..." (∃*xx* Simples(*xx*)).
  *   **Plural Predicates:** "...arranged tablewise" (*ArrangedTablewise*(*xx*)).
  *   **No Singular Composites:** The truthmaker is just the simples and their relations.

  What does the universalist's fusion explain? "There is a table (a fusion) in the room." But the fusion’s existence and location *just are* the simples existing and being arranged tablewise in that room. The fusion’s causal powers? They are *exhaustively* the causal powers of the simples acting in concert according to their arrangement. Its mass? The sum of the masses of the simples. The fusion adds *no new property or power*. Everything the fusion is invoked to do is already accomplished by the simples *taken plurally* under the description "arranged tablewise." The fusion is a metaphysical redundancy.

  **(2) Universalism Gains No Ground from Critiques of the Moderate View (Life)**
  The universalist (like the nihilist) rightly mocks the moderate (van Inwagen’s "life") view: it violates the principle that no two distinct things can share all the same proper parts (by allowing non-living aggregates like heaps to lack fusions, while living things have them); it introduces brute, emergent composition facts ("when does life begin?"); it risks vague existence. But *nihilism avoids all these problems too*:
  *   **No Shared Parts Problem:** Only simples exist. No composites *at all* to share parts.
  *   **No Brute Emergence:** Composition never happens. No brute threshold.
  *   **No Vague Existence:** Simples either exist or don't. Any vagueness about "tables" is semantic vagueness in "arranged tablewise," safely quarantined from ontology.

  The universalist’s critiques of the moderate view are powerful, but they are *equally* arguments *against* any restricted composition principle. They leave universalism and nihilism standing as the only deflationary options. They cannot decide between them.

  **(3) Confronting the Hard Cases: Where Paraphrase *Seems* to Hurt**
  The universalist protests: "But we point and say 'THAT table,' not 'THOSE simples!' We count *one* table! We explain the vase breaking *because the table shook*! Science talks about molecules and cells! Plurals can't handle this!"

  *   **Demonstratives & Singular Reference:** Pointing at a "table" and uttering "that" successfully refers to the *region* occupied by simples arranged tablewise, or picks out *those simples* collectively under a concept. Language is flexible. We say "That *is* a pile of sand," referring to many grains collectively. "That" need not denote a composite entity.
  *   **Counting:** "There is one table in the room" paraphrases as "There are some simples arranged tablewise in the room, and there are not some *other* simples arranged tablewise elsewhere in the room." Counting "one" tracks the presence of a *single instance* of a tablewise arrangement, not a singular composite object. We count "one team" or "one pile" similarly, without ontological commitment to composites beyond the members/stuff.
  *   **Causal Explanation:** "The table shaking caused the vase to fall" paraphrases as "The simples arranged tablewise collectively shaking (i.e., moving in certain relative ways) caused the simples arranged vasewise to collectively fall." The causal work is done by the motion of the simples and their relational properties. Attributing causation to "the table" is shorthand for causation by the *arranged simples acting together*.
  *   **Science & Higher-Level Properties:** Science positing molecules doesn't save universalism; it might just push composition down a level. The nihilist paraphrases talk of "the molecule" as talk of atoms arranged molecularly. Properties like mass or charge attributed to the "molecule" are the summed mass or structural charge properties of the atoms in that arrangement. Macro-level science uses singular terms for *patterns* or *configurations* of simples, not necessarily for new *things*.

  **Is the Paraphrase Costly? Yes – But Less Costly than Idle Fusions.**
  The paraphrase isn't effortless. It requires rethinking language and explanation. Referring plurally feels clunky ("those simples arranged tablewise" vs. "that table"). Higher-level sciences *seem* ontologically committed to their entities. This is the nihilist's real burden: **semantic and conceptual revisionism**. It asks us to reinterpret vast swathes of discourse not as literally describing composite objects, but as describing patterns and behaviors of simples.

  But weigh this against universalism's cost: **introducing countless trillions of gratuitous entities.** Every arbitrary scattered fusion – the fusion of your left shoe, the Eiffel Tower, and a random quark in the Crab Nebula – exists. It does *nothing*. Its existence supervenes on its parts, but adds *absolutely nothing* to the description of reality that isn't captured by the existence of the parts and their relations. It is an ontological excrescence. Paying the price of paraphrase to avoid this cosmic clutter of idle wheels is the better bargain. *Parsimony demands we shave off entities that do no work.*

  **(The Concession: "The Fusion Just *Is* the Parts")**
  If your universalist flatmate retreats to "The table just *is* the simples arranged tablewise," they have functionally surrendered to nihilism. They are admitting there is no additional entity beyond the simples and their arrangement. They are using a singular term ("the table") as a convenient label for a plural phenomenon. This *is* the nihilist paraphrase strategy in disguise! To be consistent, the universalist *must* insist the table is a distinct entity numerically different from the simples – an entity that, while composed of them, is a *new thing*. But this is precisely the idle posit: what does this "newness" *do*? If it does nothing, discard it. If it does something (e.g., has irreducible causal powers), then it’s *not* a free lunch – it’s emergent, brute, and violates the very supervenience that motivated universalism as cheap. Lewis’s free lunch requires the fusion to be nothing over and above the parts – which is nihilism with a singular label.

  **Conclusion: Choose Austerity Over Profligate Idleness**
  The universalist's fusion is a metaphysical placebo. It feels explanatory but provides no cure. Nihilism, armed with plural quantification and predicate revision, captures all the genuine phenomena – reference, counting, causation, science – without multiplying idle entities. The paraphrase is imperfect and requires linguistic adjustment, but this cost is epistemological and semantic, not ontological. The cost of universalism is ontological profligacy on a cosmic scale, introducing entities that are fundamentally inert. When faced with an idle posit, Ockham’s razor commands: eliminate it. Join the nihilists. The ontological high ground is austere, but it’s honest.

  ---

  **Flagged Vulnerability: The Ontology of Plural Quantification**
  The premise I'm least confident about is the claim that **plural quantification ("there are some things...") does not itself tacitly commit us to set-like entities or fusions.** Critics (e.g., David Lewis, ironically) argue that plural logic needs an ontology of classes or collections as singular entities to ground its semantics. *If this is true, the nihilist paraphrase strategy collapses, as it smuggles in the very composites it denies.*

  **What Would Change My Mind?** A compelling demonstration that the *truth conditions* for plural quantifiers and predicates *necessarily require* referring to a singular entity (a set, a class, a fusion) over and above the individual simples. If paraphrasing "There are simples arranged tablewise" *must* mean "There exists a set/collection/fusion whose members are simples arranged tablewise," then nihilism fails. I currently think sophisticated plural logic (à la Boolos) avoids this by treating plurals as fundamentally about many things, not one thing representing many. But if this project fails, nihilism fails. This is the crux. Defend plural logic fiercely or concede.
