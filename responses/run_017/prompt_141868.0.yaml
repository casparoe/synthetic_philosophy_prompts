prompt: |-
  I run a twice-yearly professional-development workshop for about twenty mid-career civil servants in a government policy unit, in a 100-minute slot. These are people who will themselves write or commission choice-architecture guidance in the coming year; they arrive split between thinking that this kind of work is obviously just common sense and thinking that it is obviously manipulation, and both camps are articulate. Available materials: a room with movable chairs and one door, a projector I would rather not switch on before minute 60, index cards, sticky dots, two clearly different snacks, paper sign-up sheets, and pens. No phones, no laptops, no money, and no pre-reading. I want an activity, not a lecture, and I want the technical vocabulary — paternalism, nudge, default, manipulation, autonomy — to appear for the first time only in the last fifteen minutes.

  The substance is the ethics of influencing other people's choices by arranging their options rather than by changing their incentives or forbearing anything. Three distinctions matter to me, and I want the participants to collide with each one before it is named.

  The first: some influences keep working on a target who has been told, in plain language, exactly what the influence is and what it is for; others lose most of their force the moment they are made explicit. Call the first kind disclosure-stable and the second disclosure-fragile. This cuts across the usual classification of policy instruments — a subsidy, a plainly stated fee, or a mandatory reminder is disclosure-stable, while an option-ordering effect, a decoy, or a pre-ticked box that works through inertia is not — and I want participants to notice that the standard "freedom of choice is preserved because opting out costs nothing" defence seems to give the same verdict to both kinds, which is what makes them uneasy.

  The second: the size of an intervention's immediate effect and the amount of a person's downstream life that it ends up determining are different quantities. A pre-ticked box that also fixes the terms of next year's automatic re-enrolment, or that sets the menu from which all later choices are made, has high leverage while looking trivial at the moment of choice. I want participants to feel that a nudge can be trivially easy to resist — one tick, one click — and still be the thing that settles the whole path, and that the cost of resisting is a cost of noticing, not a cost of effort.

  The third: designing for targets who know that someone is designing for them. In the later part of the session, tell the groups that a substantial and growing minority of the population they are designing for has read a plain-language guide to these techniques, recognises them, and resents them. I want them to have to revise their design under that condition, and to discover that some of what they were happy to do to the trusting they are unwilling to do to the suspicious — or vice versa — and to have to say why.

  Concretely, I'd like: a design brief with a multi-stage decision that exhibits leverage (enrolment at stage one, automatic escalation at stage two, a fund or provider choice at stage three, reconfirmation at stage four) and a described population that is heterogeneous in a way that matters — procrastinators, people with principled objections to the outcome, people who distrust the department, people for whom the default is genuinely bad; two rounds of small-group design with a mid-point change of condition; and at least one real, low-stakes choice architecture imposed on the participants themselves during the session without their prior knowledge, arranged so that they experience being on the receiving end while they are theorising about doing it to others. Please say plainly how you would handle the fact that imposing that on them is itself the thing under discussion, and whether, when, and how you would get their consent for it.

  Deliverables I need, in runnable detail: roles and group sizes; rules; a minute-by-minute timeline for the 100 minutes including setup, the moment of revelation, and the transition to explicit vocabulary; what participants are asked to write down and hand in; how the room is arranged and when it is rearranged; and any scoring or payoff structure if one helps. Then a debrief that maps specific moments in the activity onto the three distinctions above, that uses the participants' own words and disagreements rather than my formulations, and that shows where the "it was for their own good" condition becomes indeterminate because the room disagrees about whose good and about who counts as a competent judge of it. Finally, be honest about three things: what will predictably go wrong the first time I run it and how I should handle it; which participants will refuse to play and what I should say to them; and which feature of the problem the activity cannot reproduce at all, so that I will simply have to state it myself.
reasoning: |-
  We are designing a 100-minute workshop for mid-career civil servants. The workshop must be activity-based, with technical vocabulary introduced only in the last 15 minutes. We have three key distinctions to address:

  1. Disclosure-stable vs. disclosure-fragile influences.
  2. The difference between immediate resistance cost and long-term leverage.
  3. Designing for targets who are aware of and possibly resentful of choice architecture.

  We also need:
  - A design brief with a multi-stage decision that exhibits leverage.
  - Two rounds of small-group design with a mid-point change of condition (adding the condition that some targets are aware and resentful).
  - An undisclosed choice architecture imposed on participants during the session.

  The room has movable chairs, a projector (to be used after minute 60), index cards, sticky dots, two clearly different snacks, paper sign-up sheets, and pens.

  **Design Brief: Pension Enrolment and Escalation**

  We'll use a pension enrolment scenario because it naturally has multiple stages and leverage. The scenario:

  - **Stage 1**: Initial enrolment with a default contribution rate and investment fund.
  - **Stage 2**: Automatic escalation of contribution rate each year (unless opted out).
  - **Stage 3**: Choice of investment fund from a menu (with a default).
  - **Stage 4**: Reconfirmation of the entire plan after 5 years (with a default to continue).

  The population is heterogeneous: 
  - Procrastinators (who tend to delay decisions)
  - Principled objectors (e.g., to investing in certain industries)
  - Distrusters (of the government department)
  - Those for whom the default is bad (e.g., low contribution rate for someone who needs to save more)

  **Imposing a Choice Architecture on Participants**

  We'll set up a low-stakes choice during the workshop without prior explicit consent. We have two different snacks. We can arrange the room so that one snack is more accessible (e.g., placed at the entrance) and the other is less visible (e.g., behind the facilitator). We can also use a sign-up sheet for the next activity that has a pre-ticked option.

  We must handle the fact that we are imposing a choice architecture on them. We will:
  - Not get prior consent because that would reveal the exercise.
  - Reveal the manipulation at minute 60 (when we turn on the projector) and explain that we did it to give them a firsthand experience of being nudged without knowing it.
  - Acknowledge that we are doing exactly what we are discussing and use that to spark reflection.

  **Workshop Structure**

  Total: 100 minutes.

  **Setup (0-5 minutes)**
  - Arrange chairs in a circle for whole-group discussion.
  - As participants enter, direct them to sign in on a sheet that has two options (without labeling them as such, we pre-tick one). Also, place two snacks: one (healthy, e.g., fruit) at the entrance table and another (unhealthy, e.g., cookies) on a side table (less visible). This is our undisclosed nudge.

  **Introduction (5-10 minutes)**
  - Welcome and explain: "We're going to spend the morning thinking about how we present choices to people. We'll start by working in groups on a design challenge."
  - Split into 4 groups of 5 (if exactly 20). Assign each group a role: one of the four population segments (procrastinators, principled objectors, distrusters, those for whom the default is bad). Give each group an index card with their role and a brief description.

  **Round 1: Design for a Trusting Population (10-40 minutes)**
  - **Design Brief (10-15 minutes)**: Hand out a one-page brief describing the pension enrolment scenario and the four stages. Each group is to design the choice architecture for their assigned population segment. They must decide on:
     - Stage 1: How to present the enrolment (default contribution rate, pre-ticked box?).
     - Stage 2: How to handle escalation (opt-out or opt-in?).
     - Stage 3: How to present the fund choice (default fund? how many options?).
     - Stage 4: How to handle reconfirmation (default to continue?).
  - They should write their design on a flip chart (or large paper) and be ready to present.
  - **Group Work (15-30 minutes)**: Groups work.
  - **Presentations (30-40 minutes)**: Each group has 2 minutes to present.

  **Mid-Point Change (40-45 minutes)**
  - Introduce the new condition: "Now, we've learned that a growing minority (say 20-30%) of the population you're designing for has read a guide to choice architecture and is aware of these techniques. They recognize them and may resent them. Revise your design accordingly."

  **Round 2: Design for a Suspicious Population (45-75 minutes)**
  - **Group Work (45-65 minutes)**: Groups revise their designs.
  - **Presentations (65-75 minutes)**: Each group presents their revised design (2 minutes each).

  **Revelation and Vocabulary Introduction (75-90 minutes)**
  - At 75 minutes, turn on the projector. Reveal the undisclosed nudges:
     - The sign-in sheet had a pre-ticked option (which they may not have noticed).
     - The snack arrangement (one snack was made more salient).
  - Ask: "How did you feel when you realized we had arranged your choices? Did it change your view of the designs you just made?"
  - Introduce the vocabulary (last 15 minutes, starting at 75 minutes):
     - Disclosure-stable vs. disclosure-fragile: "Some of the techniques you used would still work if you told people about them (like a subsidy), but others (like the pre-ticked box) might stop working if people knew. We call the first disclosure-stable and the second disclosure-fragile."
     - Leverage: "You designed a pension plan where a single click at stage 1 could set the entire path. That's leverage: a small intervention with long-term effects. The cost to resist is not effort but noticing and acting."
     - Designing for the aware: "When you revised for the suspicious minority, you probably dropped some techniques. Why? Because they only work on the trusting. This shows that the ethics of choice architecture depend on the target's awareness."

  **Debrief (90-100 minutes)**
  - Map the activity to the three distinctions using their own words:
     - **Disclosure-stable/fragile**: "In your designs, which techniques did you drop for the suspicious population? (e.g., pre-ticked boxes). Why? Because they are disclosure-fragile. But what about the ones you kept? (e.g., clear fees). They are disclosure-stable."
     - **Leverage**: "Look at stage 2: automatic escalation. It's one click to stop, but that one click controls your entire savings rate. We heard one group say, 'It's just one click, but it's a big deal.' That's leverage."
     - **Designing for the aware**: "One group said, 'We couldn't use the same tricks on the suspicious group.' Another said, 'We had to be more transparent.' This shows that the ethics change when the target knows."
  - Highlight disagreements: "Some of you felt that pre-ticked boxes were acceptable for the trusting but not for the suspicious. Why? Because you thought the trusting wouldn't mind? But what if the trusting just don't know? And what if the suspicious are right to be suspicious? This is where 'for their own good' gets fuzzy. Who decides what is good? And who is competent to judge? We heard disagreement about that."

  **Handling Predictable Problems**

  1. **What will go wrong?**
     - Participants might not engage in the group work. To handle: Circulate and prompt with questions.
     - The undisclosed nudge might be too obvious. Solution: Make it subtle (e.g., pre-ticked option on a sign-up sheet for a non-existent follow-up session; snack placement without comment).
     - Time overrun. Solution: Strict timekeeping and cut presentations short if needed.

  2. **Who will refuse to play?**
     - Some may object to the undisclosed nudge. Have a response ready: "This was a deliberate provocation to spark reflection. We're about to discuss it, and your feelings are valid data for that discussion."
     - Others may dismiss the activity as unrealistic. Response: "We're abstracting to focus on the ethical dimensions. Real-world applications are more complex, but the principles are the same."

  3. **What can't the activity reproduce?**
     - The activity cannot reproduce the long-term consequences of a nudge in real life. Participants won't experience the 5-year impact of a pension default. We have to state that leverage is about long-term effects that aren't felt immediately.

  **Deliverables in Runnable Detail**

  - **Roles and Groups**: 4 groups of 5. Each group assigned one population segment (on an index card):
     - Group 1: Procrastinators (description: "Tend to delay decisions; often miss deadlines")
     - Group 2: Principled objectors (description: "Opposed to investing in fossil fuels, arms, etc.")
     - Group 3: Distrusters (description: "Distrust the government department; believe it doesn't have their best interests at heart")
     - Group 4: Default is bad (description: "For these people, the default contribution rate is too low; they need to save more for retirement")

  - **Rules**:
     - No phones or laptops.
     - Use only provided materials.
     - In group work, everyone must contribute.

  - **Timeline**:
     - 0-5 min: Setup (chairs in circle; set up snack nudge and sign-up sheet nudge).
     - 5-10 min: Introduction and group assignment.
     - 10-40 min: Round 1 (design for trusting population).
          - 10-15: Distribute brief and explain.
          - 15-30: Group work.
          - 30-40: Presentations (2 min per group).
     - 40-45 min: Introduce the new condition (suspicious minority).
     - 45-75 min: Round 2 (design for suspicious population).
          - 45-65: Group work.
          - 65-75: Presentations (2 min per group).
     - 75-90 min: Revelation of nudges and vocabulary introduction.
     - 90-100 min: Debrief and wrap-up.

  - **What participants write/hand in**: Nothing to hand in, but they will write their designs on flip charts for presentation.

  - **Room arrangement**:
     - Start: Circle of chairs for introduction.
     - Group work: Move chairs into 4 clusters.
     - Presentations: Move chairs back to circle (or leave as clusters and have groups present from their spots).
     - After group work, move back to circle for presentations and debrief.

  - **Scoring or payoff**: None. The activity is discussion-based.

  **Debrief Script**

  "Let's look back at what happened:

  1. **Disclosure-stable vs. fragile**: 
     - When we revealed the snack and sign-up sheet nudges, some of you said, 'I wouldn't have cared if you told me about the snacks upfront.' That's disclosure-stable. But for the pre-ticked box on the sign-up sheet, one of you said, 'I just went with it because it was ticked.' That's disclosure-fragile. And when you redesigned for the suspicious, you dropped the pre-ticked boxes. Why? Because they don't work if people know. But notice: the fee or subsidy you designed at stage 3? You kept that because it's stable.

  2. **Leverage**: 
     - One group said about automatic escalation: 'It's just one click to stop, but if you don't, you're locked in for years.' That's leverage. The cost is noticing, not effort. Another group said, 'For the procrastinators, we set it so they have to act to stop it, because they won't.' That's high leverage.

  3. **Designing for the aware**: 
     - We heard: 'We couldn't use the same tricks on the distrusters.' But what about the others? One group said, 'We made everything opt-in for the suspicious.' But then you worried: 'But then the procrastinators won't enroll.' So you faced a trade-off. And when we asked 'for their own good,' we disagreed: one said, 'It is for their own good to be enrolled,' but another said, 'But the distrusters might have a point.' Who is the competent judge? We don't agree."

  **Honest Assessment**

  - **What will go wrong**: 
     - The snack nudge might not work (everyone sees both snacks). Handle by not making it a big deal; the sign-up sheet is the primary nudge.
     - Groups may not finish. Handle by moving on and having them present what they have.

  - **Refusal to play**: 
     - A participant might refuse to participate in the group work. Say: "Your perspective is valuable. Even if you don't agree with the exercise, please observe and share your thoughts in the debrief."
     - Someone might call out the nudge early. Acknowledge: "You're right. We set it up that way. We'll discuss why we did that later."

  - **What the activity can't reproduce**: 
     - The real long-term impact of a nudge. We can only simulate it in the design. We must state: "In real life, a default can set a path for years, and we can't feel that in a 100-minute workshop."
answer: |-
  Below is a complete, runnable workshop design meeting your requirements. It centers on a **pension enrolment system** with four stages (to exhibit leverage) and uses an undisclosed choice architecture imposed on participants via snack selection and sign-in sheets. The debrief ties activities to your three distinctions using participants' own language. I'll provide deliverables first, then address predictability, refusal risks, and limitations.

  ---

  ### **Deliverables: Runnable Workshop Plan**  
  **Total Time:** 100 minutes  
  **Participants:** 20 civil servants (4 groups of 5).  

  #### **Room Setup & Materials**  
  - **Start:** Chairs in a circle (whole-group discussion).  
  - **Group Work:** Chairs moved into 4 clusters (one per group).  
  - **Materials Used:**  
    - **Index cards:** For role assignments and writing reflections.  
    - **Sticky dots:** For voting during presentations.  
    - **Two snacks:** Healthy (e.g., apples) and unhealthy (e.g., cookies). Place apples prominently at the entrance table; hide cookies behind projector.  
    - **Sign-up sheets:** Two sheets for a "post-workshop feedback task" (real purpose: nudge test). Sheet 1 has **pre-ticked boxes** for "Morning" slots; Sheet 2 has **blank boxes** (placed beside it).  
    - **Projector:** Off until minute 75.  

  ---

  ### **Timeline (Minute-by-Minute)**  
  **0–5 min: Setup & Undisclosed Nudges**  
  - As participants enter, direct them to:  
    1. **Sign up** for a feedback slot using the sheets.  
    2. **Take a snack** (apples visible at entrance; cookies hidden).  
  - Say: *"Please sign up for a quick feedback slot later and grab a snack if you'd like. We’ll start shortly."*  
  - *No consent sought* (it’s low-stakes and essential for the "revelation").  

  **5–15 min: Introduction & Group Formation**  
  - Introduce the **design challenge**: *"You’ll design a pension enrolment system for a diverse public. Goals: maximize enrolment, respect autonomy."*  
  - Form **4 groups of 5**. Assign each a **population segment** via index card:  
    - **Group 1:** Procrastinators (*"Often delay decisions; need simplicity"*).  
    - **Group 2:** Principled objectors (*"Oppose pensions on ethical grounds (e.g., fossil fuels)"*).  
    - **Group 3:** Distrusters (*"Skeptical of government motives; need transparency"*).  
    - **Group 4:** Default-is-bad (*"Default settings harm them (e.g., low contributions)"*).  
  - Hand out **design brief** (verbally summarized; no pre-reading):  
    > *"Pension system stages:  
    > 1. **Enrolment:** Opt-in or opt-out? Default contribution rate?  
    > 2. **Automatic escalation:** Yearly increase in contributions unless stopped.  
    > 3. **Fund choice:** Select investments (default fund provided).  
    > 4. **Reconfirmation:** After 5 years, must reconfirm or auto-continues.  
    >   
    > Population: Mixed (your assigned group is a key segment).  
    > Constraints: No new incentives/bans; only ‘choice architecture’."*  

  **15–35 min: Round 1 – Design for "Trusting" Population**  
  - **Task:** Groups design their pension system. Focus: *"Assume most people trust the government."*  
  - **Rules:**  
    - Use index cards to sketch stages 1–4.  
    - Appoint a presenter.  
    - *No technical terms allowed* (e.g., say "pre-ticked box," not "default").  
  - **Facilitator Role:** Circulate and prompt: *"How does your design handle resistance? What’s the cost to opt out?"*  

  **35–45 min: Presentations & Dot Voting**  
  - Each group presents in 2 minutes.  
  - After all present, participants vote with **sticky dots** on: *"Which design feels most respectful?"* (Dots on posted index cards).  
  - **Note:** Disagreements will surface (e.g., *"Pre-ticking is fine—it’s just helping!"* vs. *"It’s sneaky!"*).  

  **45–50 min: Introduce New Condition**  
  - Announce: *"New info: 30% of your target population now recognizes choice-architecture tactics. They resent feeling manipulated. Revise your designs accordingly."*  

  **50–70 min: Round 2 – Design for "Suspicious" Population**  
  - Groups revise designs. Prompt: *"What will you change now that people are onto you?"*  
  - **Output:** Revised index cards.  

  **70–75 min: Revised Presentations**  
  - Groups present changes in 90 seconds each. Note shifts (e.g., *"We dropped pre-ticking—it won’t work if they’re watching"*).  

  **75–85 min: Revelation & Vocabulary Introduction**  
  - **Turn on projector.** Reveal undisclosed nudges:  
    > *"Earlier, we influenced your choices:  
    > - Snacks: Apples were visible; cookies hidden.  
    > - Sign-up: Sheet 1 had pre-ticked morning slots; Sheet 2 was blank.  
    > How did this feel? Did it change your trust?"*  
  - **Introduce vocabulary** (first time):  
    - *"Some tactics (like hidden snacks) lose power if exposed—we call these **disclosure-fragile**. Others (like clear fees) work even if known—these are **disclosure-stable**."*  
    - *"A **nudge** (e.g., pre-ticked box) can be easy to resist (one click!) but have high **leverage**—it sets your path for years."*  
    - *"**Autonomy** means respecting agency; **paternalism** is deciding for others. But what if people resent it?"*  

  **85–100 min: Debrief & Ethical Collisions**  
  - **Map activities to your three distinctions** using participant quotes:  
    1. **Disclosure-stable vs. fragile**:  
       - *Use voting results and presentations:* "In Round 1, Group 3 said pre-ticking was ‘efficient’—but in Round 2, you called it ‘manipulative’ when people knew. That’s disclosure-fragile. Group 1’s plain fee was ‘still okay’—that’s stable. But earlier, many voted the same for both—this is what feels uneasy."  
    2. **Leverage vs. resistance cost**:  
       - *Use pension designs:* "Group 4 said automatic escalation was ‘just one click to stop’—but you also said it ‘locks people in for years.’ The cost isn’t effort—it’s noticing. That’s leverage."  
       - *Link to revelation:* "Like the sign-up sheet: one tick to change, but if you missed it, you’re stuck with morning slots."  
    3. **Designing for the aware**:  
       - *Use Round 2 revisions:* "Group 2 dropped decoys for the suspicious but kept them for others. Why? One said: ‘It’s fair game if they don’t notice’—but Group 3 called it ‘unethical either way.’ Here’s where ‘for their own good’ gets muddy. Who decides ‘good’? The objectors? The department? You disagreed."  
  - **Clinch with autonomy-paternalism tension**:  
    > *"When Group 1 said, ‘Procrastinators need defaults—it’s for their good,’ but Group 4 said, ‘What if the default ruins them?’—that’s the core. If we can’t agree on ‘good,’ paternalism breaks down."*  

  ---

  ### **Handling the Undisclosed Nudge**  
  - **No prior consent:** Justified because:  
    - It’s **low-stakes** (snacks/sign-ups aren’t consequential).  
    - **Revelation timing** (minute 75) turns it into a learning tool: *"We did this so you’d experience being nudged while designing nudges. How did it feel?"*  
  - **Ethical transparency:** At revelation, acknowledge: *"Yes, we manipulated you to provoke reflection. Was that okay? Let’s discuss."* This mirrors your distinction #3.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **What will go wrong (and how to handle):**  
     - **Groups stall on design:** Likely if abstract thinking lags. *Solution:* Use concrete prompts: *"Sketch stage 1: What’s your opt-in/out?"*  
     - **Voting ties or skews:** Dot voting may feel reductive. *Solution:* Focus on *why* votes split: *"Those who voted for Group 2’s design—what felt respectful?"*  
     - **Revelation backlash:** Some may feel tricked. *Solution:* Validate: *"Your discomfort is real—that’s why we’re discussing ethics."*  

  2. **Who will refuse to play (and what to say):**  
     - **Cynics** (e.g., *"This is silly games"*): Say: *"Humor me—your critique is valuable for the debrief."*  
     - **Ethical objectors** (e.g., to undisclosed nudge): Say: *"Your reaction is exactly what we’ll explore. Why does this bother you?"*  
     - **Dropouts:** Allow them to observe. Their comments often enrich debrief.  

  3. **What the activity can’t reproduce (state this yourself):**  
     - **The cumulative impact of leverage.** Participants experience immediate friction (e.g., sign-up sheet), but not years of path-dependency. State during debrief:  
       > *"In real life, a pre-ticked box can set a 30-year pension path. We felt the ‘click’ cost today, but not the lifetime effect—that’s why leverage demands caution."*  

  ---

  ### **Why This Works**  
  - **Activity-focused:** 75+ minutes of designing/voting, not lecturing.  
  - **Collisions before vocabulary:** Groups naturally grapple with fragility (Round 2 revisions), leverage (pension stages), and awareness (suspicious-population shift) before terms are introduced.  
  - **Undisclosed nudge:** Creates lived experience parallel to their design work.  
  - **Debrief roots concepts in their words:** Uses direct quotes from presentations/voting to frame distinctions, making the ethics tangible and contested.  

  **First run tip:** Rehearse timing—cut presentations to 60 seconds if needed. The snack/sign-up nudges are subtle enough to avoid early detection but revelatory when exposed.
