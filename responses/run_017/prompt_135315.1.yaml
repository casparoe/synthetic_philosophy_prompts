prompt: |-
  I am drafting the allocation rule for a public body, and I want the specification settled before I look at how the philosophical literature answers it, so that I don't inherit that literature's blind spots about the use I have in mind.

  The setting. The body distributes a fixed stock of goods and burdens once, to a known set of claimants, and cannot take anything back afterwards. It cannot observe the claimants' mental states and cannot ask them; it has records of what they have, what they can do, and what has been done to them. It must give every unsuccessful claimant a written statement of why their claim ranked where it did. And its allocations partly determine who the next round's claimants will be, because housing, training and care allocations affect which households form and which people arrive. I am not asking whether equality is the right aim for this body; that is settled by statute. I am asking what the currency of equality would have to be like for this body to be able to use it.

  What I want is the requirements list: what any candidate currency — a candidate answer to the question of what, exactly, is to be equalized — must be able to do, with the case behind each requirement, and with each requirement marked as non-negotiable given my setting, negotiable, or a prejudice imported from some other use a theory of equality might be put to.

  The cases I am confident a currency must handle, stated in my own terms:

  Two claimants receive identical bundles, and one needs far more than the other to get to the same point — an impairment, a chronic condition, a caring responsibility. The currency must register the difference in what bundles do for people without simply collapsing into how satisfied those people report or appear to be.

  Three claimants each end up wanting something very expensive. The first cultivated the taste deliberately, with full information and no pressure. The second acquired it because the body itself supplied the means in an earlier round — learned to sail on a publicly funded boat, say. The third no longer wants much of anything, and wanted progressively less across a long period of being given very little. The currency must say which of these generate claims, and in particular must tell me how the second case differs from the third, since both involve aims that the allocation itself helped produce.

  What a claimant can do with a share depends on what others are given — a place in a programme, a priority date, a permit, a house on a particular street. So I need to know whether the currency has to be assessable on a pair of claimants in isolation, or whether it only has a verdict once the whole distribution is known; the body sometimes has to decide between two claimants before it knows the rest of the population.

  Provision moves the baseline. Once lifts, ramps and interpreters are supplied, what counts as an ordinary share of access changes for everyone, including people whose access was never at issue. The currency must say whether its standard is anchored to a pre-allocation baseline or floats with what is actually provided, since a floating standard lets a body appear to equalize by redefining the target.

  The written statement is itself part of the allocation. If the currency is a mental state, announcing a verdict perturbs what is being measured — being told one counts as badly off can make a person worse off. I want to know whether robustness to being announced is a genuine requirement or only a problem for one family of currencies.

  And because allocations determine who the future claimants are, the currency must permit comparisons across alternatives whose claimant-sets are not the same, and must say what to conclude when the people who would be worst off under one alternative simply do not exist under the other.

  Beyond the list, three things. Flag any pair of requirements you think cannot be jointly satisfied — that is the part I most want, since it would mean my statute asks for something incoherent. Tell me which single requirement does the most work in excluding otherwise attractive candidates. And say which of the requirements are really about the currency and which properly belong to the procedure, the timings, or the unit of assessment — whether the currency attaches to individuals, households, or something else, and what it is to do with a household whose members will not say how unevenly the share is divided inside it.

  Only then, and in a short paragraph each, how the three familiar families — currencies pitched at states of a person, at the means a person holds, at what a person is substantively free to do and be — do against the list. I do not need names, dates or reading.
reasoning: |-
  Alright, the user is drafting an allocation rule for a public body and wants to define the requirements for the currency of equality without being influenced by existing philosophical literature. They provided a detailed setting and specific cases the currency must handle. Let me break down their query to understand their needs.

  First, the setting: fixed stock of goods and burdens, one-time distribution, no take-backs. The body can't observe mental states, only records of assets, capabilities, and history. They must provide written justifications to unsuccessful claimants. Also, allocations affect future claimant pools through impacts on housing, training, etc. Equality is mandated by statute, so the focus is on the currency's design.

  The user listed specific cases: differing needs for identical bundles (like impairments), expensive tastes (deliberate, state-influenced, or adaptive preferences), and interdependence of allocations (where one's benefit depends on others' shares). They also need clarity on baseline anchoring (pre-allocation vs. floating), the impact of written statements on the currency, and comparability across different future populations.

  Key requirements to extract from these cases:
  1. **Non-subjectivity**: Must account for differential impact of identical bundles without relying on subjective satisfaction. Non-negotiable because mental states can't be observed.
  2. **Preference origins**: Must distinguish between types of expensive tastes—especially state-influenced vs. adaptive preferences. Non-negotiable to handle fairness in claims.
  3. **Relational vs. individual assessment**: Needs to handle cases where value depends on others' allocations. Possibly negotiable if the procedure can manage partial assessments.
  4. **Baseline definition**: Must decide if the standard is fixed or floating. Non-negotiable to avoid manipulation through redefinition.
  5. **Announcement robustness**: Currency shouldn't be perturbed by the justification statement. Maybe negotiable if procedural adjustments can mitigate.
  6. **Counterfactual comparability**: Allow comparisons across scenarios with different future claimant sets. Non-negotiable due to dynamic population effects.
  7. **Unit of assessment**: Define if currency applies to individuals, households, etc. Partially procedural but crucial for defining the currency's scope.

  The user also wants to know if any requirements conflict. For example, non-subjectivity might clash with needing to assess costly preferences' origins without mental states. Also, relational goods vs. individual assessment could cause issues when decisions must be made before knowing the full distribution.

  The three traditional approaches:
  - **States of a person**: Focuses on welfare or capabilities. Might struggle with non-subjectivity and preference origins without observable data.
  - **Means/Resources**: Easier to measure but ignores differential needs, failing the first case.
  - **Substantive freedoms**: Handles relational goods but may face challenges with baseline anchoring and counterfactual comparisons.

  The user's deeper needs include ensuring the currency is implementable with available data, avoids manipulation, and provides transparent justifications. They might be concerned about real-world applicability beyond theoretical purity, especially given statutory constraints and the need for audit trails via written statements.
answer: |-
  Below is a requirements list for the currency of equality in your setting, derived from your operational constraints and stated cases. Each requirement includes its rationale, negotiability status, and potential origins of bias. Following the list, I address conflicts, key exclusions, scope clarifications, and brief assessments of the three currency families.

  ---

  ### **Requirements List for the Currency of Equality**
  1. **Non-Subjectivity of Impact**  
     - **Case**: Identical bundles yield different outcomes (e.g., impairment vs. no impairment).  
     - **Requirement**: The currency must objectively measure *what bundles do for claimants* without relying on self-reported satisfaction, mental states, or observed behavior.  
     - **Non-negotiable**: Mental states are unobservable; outcomes must be verifiable via records (e.g., health data, capability metrics).  
     - **Potential bias import**: Rejects welfarist approaches that prioritize subjective experience.  

  2. **Differentiation of Preference Origins**  
     - **Case**: Expensive tastes (deliberate cultivation, state-induced, adaptive deprivation).  
     - **Requirement**: The currency must distinguish claims arising from:  
       - Autonomous choices (weak/void claim),  
       - State-influenced development (strong claim),  
       - Adaptive deprivation (strong claim).  
     - **Non-negotiable**: Essential for fairness in dynamic allocations (e.g., rejecting deliberate luxury claims while compensating state-created dependencies or adaptive poverty).  
     - **Potential bias import**: Avoids libertarian assumptions that all preferences are chosen.  

  3. **Relational Assessment Capacity**  
     - **Case**: Value of goods depends on others' allocations (e.g., priority dates, permits).  
     - **Requirement**: The currency must accommodate *relational goods* whose worth is determined by comparative holdings (e.g., positional advantages).  
     - **Negotiable**: If the procedure can simulate full distributions or use proxies (e.g., historical data), partial assessments may suffice.  
     - **Potential bias import**: Rejects atomistic resource theories ignoring social interdependence.  

  4. **Baseline Anchoring**  
     - **Case**: Provision shifts societal standards (e.g., ramps redefine "normal" access).  
     - **Requirement**: The currency must fix equality's benchmark to a *pre-allocation baseline* (e.g., capabilities pre-intervention).  
     - **Non-negotiable**: A floating baseline allows manipulation (e.g., reducing obligations by redefining "need").  
     - **Potential bias import**: Counters consequentialist views that redefine goals post-allocation.  

  5. **Announcement-Robustness**  
     - **Case**: Written statements may alter mental states (e.g., declaring someone "disadvantaged" worsens outcomes).  
     - **Requirement**: The currency must be *invariant to its own disclosure*—i.e., the act of justifying allocations cannot change the measured value.  
     - **Negotiable**: A procedural fix (e.g., anonymized templates) may mitigate this; not inherent to all currencies.  
     - **Potential bias import**: Overfits to mental-state currencies (e.g., welfare equality).  

  6. **Counterfactual Comparability**  
     - **Case**: Allocations alter future claimant sets (e.g., housing rules shape household formation).  
     - **Requirement**: The currency must enable comparisons across *different populations* (e.g., judging alternative distributions where some claimants exist only in one scenario).  
     - **Non-negotiable**: Statute requires equality as an aim; future effects must be evaluable.  
     - **Potential bias import**: Rejects theories requiring identical individuals for comparison.  

  7. **Unit of Assessment Clarity**  
     - **Case**: Households with internal inequality (e.g., resources not shared).  
     - **Requirement**: The currency must define its *unit of account* (individual, household, etc.) and handle opacity (e.g., when households hide internal disparities).  
     - **Scope note**: This is partially procedural (e.g., assuming equal intra-household distribution absent evidence), but the currency must specify if it targets individual or collective outcomes.  

  ---

  ### **Conflicts Between Requirements**  
  - **Key conflict**: **Non-Subjectivity (1)** clashes with **Differentiation of Preference Origins (2)**.  
    - **Why**: Objectively distinguishing "adaptive deprivation" (e.g., reduced desires from past deprivation) from "deliberate cultivation" requires inferring mental states (e.g., resignation vs. choice), which violates Requirement 1. Records show actions, not intentions.  
    - **Implication**: Your statute risks incoherence if it demands both objective verification *and* sensitivity to preference etiology.  
  - **Secondary tension**: **Relational Assessment (3)** conflicts with **Counterfactual Comparability (6)** when future claimants depend on current allocations. Valuing positional goods (e.g., programme slots) requires knowing the full distribution, but future populations are unknowable.  

  ---

  ### **Most Exclusionary Requirement**  
  - **Non-Subjectivity (1)** does the heaviest lifting. It excludes:  
    - All welfare/happiness-based currencies (rely on mental states).  
    - Most preference-satisfaction views (require revealed preferences).  
    - Hybrid theories (e.g., "opportunities for welfare") that indirectly reference subjectivity.  
  - **Result**: Only resourcist or capability-based currencies survive.  

  ---

  ### **Scope Clarifications**  
  - **Currency vs. Procedure**:  
    - Requirements 1–6 are **currency-core**: They define what is measured.  
    - **Baseline Anchoring (4)** and **Counterfactual Comparability (6)** are inseparable from the currency.  
    - **Announcement-Robustness (5)** and **Unit Clarity (7)** have procedural elements but constrain the currency: E.g., if the currency is mental-state-based, disclosure inherently distorts it.  
  - **Unit of Assessment**:  
    - Must be specified by the currency (e.g., "individual capabilities"). Household-level currencies fail if internal distribution is opaque; individual-level currencies require assumptions (e.g., equal sharing) when data is lacking.  

  ---

  ### **Assessment of Currency Families**  
  1. **States of a Person (e.g., welfare, happiness)**  
     Fails **Non-Subjectivity (1)** (unobservable), **Announcement-Robustness (5)** (disclosure alters states), and **Differentiation (2)** (cannot distinguish preference origins without mental data). Excels at **Counterfactuals (6)** if well-being is comparable.  

  2. **Means/Resources Held (e.g., income, goods)**  
     Fails **Non-Subjectivity (1)** (ignores differential needs: e.g., wheelchair user needs more for same mobility) and **Differentiation (2)** (cannot discount deliberate expensive tastes). Passes **Baseline Anchoring (4)** (fixed resources) and **Announcement-Robustness (5)** (resources are disclosure-invariant). Struggles with **Relational Goods (3)**.  

  3. **Substantive Freedoms (e.g., capabilities, opportunities)**  
     Best fit: Passes **Non-Subjectivity (1)** if capabilities are objectively measurable (e.g., mobility, health), **Differentiation (2)** (adaptive deprivation reduces capabilities; state provisioning creates dependency claims), and **Counterfactuals (6)** (freedoms comparable across populations). Fails **Baseline Anchoring (4)** if "capability sets" float with societal standards, and **Relational Goods (3)** if freedoms ignore positional goods.  

  ---

  ### **Recommendation**  
  A **capability-based currency** comes closest but requires:  
  - Fixing a pre-allocation baseline (e.g., "capabilities at time T0") to satisfy Requirement 4.  
  - Explicit rules for preference origins (e.g., "capability shortfalls from state actions > adaptive deprivation > choice").  
  - Relational goods (Requirement 3) may need procedural supplementation (e.g., auction mechanisms).  
  The **incoherence risk** between Requirements 1 and 2 remains unresolved; statutory revision may be needed to prioritize one over the other.
