answer: |-
  Here’s the polished exam question, model answer, and marking scheme tailored to your requirements. All text uses British English spelling and conventions.

  ---

  ### **Final Exam Question: Mind and Moral Status**  
  **Time Allowed:** 48 hours  
  **Word Limit:** 1,200 words  
  **Instructions:** Audit the Interspecies Welfare Directorate’s *Advisory Standard 7(b)* below. Assume for this question that:  
  - The probability of sentience in a given insect taxon (e.g., crickets) is **0.05**,  
  - The number of individuals affected annually by a policy is **10<sup>13</sup> (10 trillion)**,  
  - We lack direct evidence about the intensity/duration of insect affective states.  

  Critically evaluate whether Standard 7(b) delivers the *right practical verdict* for such cases. Identify where it fails, if at all, and why. **Do not restate basic expected value calculations**; focus on the standard’s structural and normative assumptions.  

  > #### **MEMORANDUM: Interspecies Welfare Directorate**  
  > **Advisory Standard 7(b): Welfare Weight Assignment**  
  > (i) For regulatory cost-benefit analyses, the expected welfare cost for a taxon shall be calculated as:  
  > > *Expected Welfare Cost = (Number of Individuals Affected) × (P(Sentience)) × (Average Pain Intensity, Human-Scaled) × (Duration)*.  
  >  
  > (ii) Where *P(Sentience)* for a taxon is assessed as **<0.1**, the taxon is assigned a welfare weight of **zero**. Rationale: acting on probabilities below this threshold is unduly speculative and risks diverting resources from higher-certainty welfare priorities.  
  >  
  > (iii) Assessments under (i) shall be conducted **taxon by taxon**. Probabilities of sentience for distinct taxa are treated as **independent variables**.  

  ---

  ### **Model Answer (950 words)**  
  **Audit of Advisory Standard 7(b): Flaws in Handling Uncertainty**  

  Standard 7(b) aims to streamline welfare policy under uncertainty but delivers arbitrary and misleading verdicts for borderline cases like insects (where *P(Sentience) = 0.05*). Its flaws stem from misrepresenting uncertainty, smuggling in status-quo bias, and ignoring transformative policy alternatives.  

  **1. Clause (ii)’s Threshold is Arbitrary and Non-Neutral**  
  The 0.1 threshold appears pragmatic but is indefensibly selective. Assigning *zero weight* at *P=0.05* implies the expected cost is negligible, yet the calculation (*10<sup>13</sup> × 0.05 × Intensity × Duration*) could yield massive disvalue if intensity/duration are non-trivial. Crucially, the threshold treats *P<0.1* as "too speculative to act" while accepting *P≥0.1* as actionable. This asymmetry is unjustified: if *P=0.05* is too low to warrant protection, *P=0.95* should be too low to *permit* large-scale harm. Yet the standard only restricts *intervention*, not *status-quo exploitation*. By erring exclusively against precaution, it defaults to permitting harm under uncertainty—a policy choice disguised as technical caution.  

  **2. Clause (iii) Misrepresents Epistemic Dependence**  
  Treating sentience probabilities as independent across taxa (iii) ignores that sentience likely depends on *evolutionary phylogeny*. If insects share a common ancestor with sentient arthropods (e.g., crabs), sentience is an *all-or-nothing trait* across the lineage. For a given taxon, the uncertainty is not "is *this individual* sentient?" but "is *this entire clade* sentient?". If *P=0.05* reflects a 5% chance that *all* insects are sentient, the expected welfare cost is bimodal:  
  - 95% chance: **Zero cost** (no sentience),  
  - 5% chance: **Catastrophic cost** (*10<sup>13</sup> × Intensity × Duration*).  

  Clause (i)’s formula gives the same *arithmetic mean* as independent probabilities, but the *decision problem* differs radically. A bimodal distribution demands a *precautionary* approach: the 5% tail-risk could dwarf other welfare agendas, making research or safeguards imperative even with low probability. Standard 7(b) ignores this by reducing uncertainty to linear expectations.  

  **3. The "Speculative" Rationale is Asymmetrical**  
  Clause (ii) claims low probabilities "crowd out" other priorities—but this applies equally to both action *and* inaction. *Not* acting on *P=0.05* risks ignoring a vast moral catastrophe if insects *are* sentient, "crowding out" future welfare through unmitigated harm. Dismissing low probabilities as speculative only highlights the need for *evidence-gathering*, not regulatory paralysis. For instance, a 5% risk of large-scale suffering could justify diverting 0.1% of agricultural subsidies to sentience research. Standard 7(b) frames uncertainty as a reason for *exclusion*, when it should trigger *targeted investigation*.  

  **4. The Welfare Metric Overlooks Holistic Experience**  
  Clause (i) multiplies pain intensity and duration but ignores whether insect lives contain *positive* states (e.g., pleasure/satiety). Without evidence, we cannot assume their experience is net-negative. If insects have fleeting pain but sustained positive states, welfare weights could be positive overall—rendering industrial farming *beneficial*. Conversely, if their lives are net-negative, *reducing* populations might be desirable. The standard assumes "affective states" map directly to human-like pain, but welfare could depend on *aggregate* experience. This makes clause (i)’s focus on disaggregated "pain-like states" misleading.  

  **5. The Verdict: Wrong Practical Implications**  
  For insects (*P=0.05*), Standard 7(b) assigns *zero weight*, denying them regulatory consideration. This is unjustifiable because:  
  - **Threshold arbitrariness** creates perverse incentives: a 0.09 probability is "zero", but 0.11 demands full protection—encouraging strategic evidence suppression.  
  - **Phylogenetic dependence** means the policy risk is binary and extreme, not smoothly incremental.  
  - **Asymmetric precaution** defaults to permitting harm, though inaction carries equal or greater risks.  
  - **Ignoring evidence gaps** forfeits low-cost options (e.g., funding neuroethology studies).  

  **A Better Approach: Three-Step Reform**  
  First, replace fixed thresholds with *risk-adjusted welfare weights*: e.g., weight = *P(Sentience) × Burden of Proof*, where "burden" favours precaution when harm scales with numbers. Second, treat sentience as clade-level: if *P=0.05* for insect sentience, allocate resources proportionate to the *magnitude of tail-risk* (e.g., 5% of the budget for insect welfare safeguards). Third, mandate *epistemic investment*: policies affecting high-number/low-P taxa must fund sentience research. This avoids both complacency and overcommitment.  

  Standard 7(b) fails by treating uncertainty as licence for inaction. True precaution requires acknowledging that "we don’t know" is a call to learn—not a verdict.  

  ---

  ### **Marking Scheme (Total: 20 marks)**  
  **Must-hit points** (Award marks as below; deduct marks for factual errors, incoherence, or exceeding word limits):  

  | **Criterion**                                                                 | **Marks** | **Common Student Errors**                                                                 |
  |-------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------------|
  | **1. Critiques the 0.1 threshold’s arbitrariness and non-neutrality**         | 4         | Accepts threshold as "pragmatic"; misses asymmetry (only restricts intervention).         |
  | **2. Challenges independence (iii): explains bimodal risk from phylogeny**    | 5         | Treats sentience as independent per individual; misses all-or-nothing clade implications. |
  | **3. Exposes asymmetry in "speculative" rationale (ii): inaction also risky** | 4         | Overlooks that inaction may "crowd out" future welfare; sees uncertainty only as barrier. |
  | **4. Notes welfare metric’s incompleteness (i): ignores net experience**      | 3         | Uncritically accepts pain-intensity focus; doesn’t question if lives are net-positive.    |
  | **5. Proposes constructive alternatives (e.g., research, risk-weighting)**    | 4         | Only critiques; no positive suggestion for handling uncertainty.                          |

  ---

  ### **Notes for Implementation**  
  - **Why this works:** Forces engagement with *structural* flaws (thresholds, independence) rather than rehashing arithmetic. The bimodal insight disrupts "tiny per-capita × huge N" complacency.  
  - **Model answer depth:** Targets 900–1000 words to leave room for weaker students to hit key points concisely.  
  - **Marking rigour:** The 5-point scheme rewards depth on phylogeny (5 marks) while penalising missed asymmetries (common in naive utilitarianism).  
  - **Spelling/usage:** British English enforced (e.g., "licence", "prioritise").  

  Let me know if you’d like adjustments to emphasis or terminology!
