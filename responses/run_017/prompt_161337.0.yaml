prompt: |-
  I chair the board of a small public library district — one building, three paid staff, and a meeting room that seats forty and gets booked about twice a week. We have no written policy on who may use it, and we are now getting requests we don't know how to handle: from groups whose views a good part of the town finds repulsive, and from speakers whose events draw counter-protesters from outside the district and leave us with the police bill. We answer to an elected town council and have already had one threat of a lawsuit. I want to write a one-page rule that our booking panel — three volunteers who rotate, none of them lawyers, one week to decide, and required to send the applicant a one-paragraph written reason — can run on any request without me in the room.

  I've been reading about Mill's harm principle on my own and I'd like the rule built on it, with two things settled in advance. First, the board has already decided that distress at hearing an opinion is not the sort of thing that counts: the room exists for speech, and people who dislike it can stay away. So the rule has to work with a narrower notion of harm than "someone is upset," and I take it Mill thought the setting mattered as well as the sentence — as I remember it, he said that calling corn dealers starvers of the poor is fine in print but punishable if shouted to an angry crowd outside a corn dealer's house. Second, everything in the room is livestreamed and kept in an online archive, and our name and logo go on the poster, so the audience of any talk is unbounded and lasts for years, and we are lending the speaker our credibility rather than only our chairs.

  Please write the rule as an ordered set of questions, with what counts as a yes to each, where the sequence stops with a no, and where it has to stop and hand the rest to a person because the question is one of values rather than facts — and tell me which of those the panel may settle and which have to go to the full board. It has to handle the cases that make the principle awkward: harm that arrives only because other people react badly to the speech; harm that is trivial in any single meeting but builds up across a recurring booking; harm to named people who will not be in the room; and the fact that we can be wrong in either direction.

  Then run it on three requests we have actually had. An anti-immigration pressure group wants a one-off evening; the last time they met locally, the event was shut down by protesters and the policing costs fell on the venue. A women's group wants a monthly slot; its position is that trans women should be excluded from women's spaces, and two of my staff have told me they would resign if we host it every month. And a parent wants to run an evening arguing that the standard childhood vaccine schedule is dangerous — several of us think that is straightforwardly harmful, and I suspect your rule will tell me to allow it, so if that is the answer I want to see the reasoning laid out plainly enough to defend. Finally, tell me what a rule of this kind cannot settle.
reasoning: |-
  Okay, the user chairs a small public library board facing complex meeting room requests. They need a clear, Mill's harm principle-based policy for volunteer reviewers. Let me unpack their core needs.

  First, the policy must be operationalized into step-by-step questions - no legal jargon, executable by rotating volunteers. The distress-is-not-harm principle is non-negotiable, as is accounting for digital permanence (livestream/archive) and institutional endorsement (logo use). 

  Key tensions emerge: 
  How to define "harm" narrowly when reactions may cause tangible consequences (police costs)? 
  How to address cumulative harm from recurring events versus one-offs? 
  How to handle harm to absent third parties? 
  And crucially, how to structure discretion - what can volunteers decide versus what requires board escalation?

  The three test cases are revealing: 
  The anti-immigration group tests "reaction harm" and cost externalization. 
  The TERF-affiliated women's group probes recurring harm and staff impact. 
  The anti-vax parent forces confrontation with misinformation consequences. 

  For the policy framework, I'll adapt Mill's principles: 
  Physical/imminent harm thresholds, 
  distinguishing content from consequences, 
  separating frequency assessment (volunteers) from viewpoint judgments (board). 
  The archive/endorsement element demands extra scrutiny of defamation and incitement risks.

  On implementation: 
  Binary checkpoints for volunteers, 
  with clear off-ramps to the board for value judgments. 
  For the anti-vax case - uncomfortable but necessary - the reasoning must show why misinformation alone doesn't meet Mill's harm bar without direct incitement. 

  The limitations section will be crucial: 
  This framework can't resolve ideological disputes, 
  prevent backlash, 
  or substitute for safety planning. 
  The board must own that enforcement consistency matters more than perfect outcomes.
answer: |-
  Here is a one-page meeting room use policy based on Mill's harm principle, structured as an ordered decision tree for your volunteer panel. It prioritizes factual assessments where possible and flags value judgments for the full board.

  ---

  **LIBRARY MEETING ROOM USE POLICY: DECISION TREE**

  **Purpose:** To approve/deny room bookings while protecting public safety, preventing direct harm, and upholding the library’s role as a neutral forum for lawful speech. Distress caused by offensive views is *not* grounds for denial.

  **Process:** Review requests in sequence. Stop at first "NO" answer. Provide written reason based *only* on the step where denial occurred. Escalate questions marked ⚖️ to the full board.

  ---

  1.  **IS THE REQUESTED USE LAWFUL?**  
      *   *Check:* Does the proposed activity violate any federal, state, or local law (e.g., incitement to *imminent* violence, true threats, obscenity, discrimination in provision of *services*)?  
      *   **YES:** Proceed to Step 2.  
      *   **NO:** **DENY.** Reason: "The proposed use violates [Specific Law/Ordinance]."  
      *   *Panel Authority:* Factual. Panel decides based on legal definitions.

  2.  **IS THE REQUESTED USE WITHIN OPERATIONAL LIMITS?**  
      *   *Check:* Does it fit time slots? Adhere to capacity (40)? Comply with standard fees, setup rules, noise limits? Require resources/staffing beyond normal?  
      *   **YES:** Proceed to Step 3.  
      *   **NO:** **DENY.** Reason: "The request exceeds operational capacity/rules [Specify: e.g., time, capacity, staff requirement]."  
      *   *Panel Authority:* Factual. Panel decides.

  3.  **DOES THE PROPOSED USE PRESENT A SPECIFIC, CREDIBLE THREAT OF *IMMINENT* PHYSICAL HARM TO PERSONS OR PROPERTY DURING THE EVENT?**  
      *   *Check:* Is there *credible evidence* (e.g., past events, specific threats announced) that violence *will likely occur immediately* at *this* event, *because of the specific circumstances* (like Mill's corn dealer example)? Mere offense or likelihood of protest is *not* enough. Focus on *imminent physical harm*.  
      *   **NO:** Proceed to Step 4.  
      *   **YES:** **DENY.** Reason: "The event presents a specific, credible threat of imminent physical harm to persons or property."  
      *   *Panel Authority:* ⚖️ **ESCALATE TO FULL BOARD.** Requires weighing evidence and risk assessment.

  4.  **FOR RECURRING EVENTS (e.g., monthly): COULD THE CUMULATIVE EFFECT OF REPEATED MEETINGS CREATE A HOSTILE ENVIRONMENT FOR LIBRARY PATRONS OR STAFF, RISING TO THE LEVEL OF HARASSMENT OR SIGNIFICANT DISRUPTION OF LIBRARY OPERATIONS?**  
      *   *Check:* Is this a recurring request? If yes, is there evidence that repeated meetings would create *persistent, severe* disruption (beyond normal noise/activity) or a *pattern* of targeted harassment/threats *within the library* affecting safety/operations? Single events rarely meet this bar. Staff resignations *alone* are not sufficient evidence; link must be to *specific, documented* harassment/disruption *caused by the meetings*.  
      *   **NO or NOT RECURRING:** Proceed to Step 5.  
      *   **YES:** **DENY.** Reason: "Recurring use would create a cumulative hostile environment / severe disruption incompatible with library operations."  
      *   *Panel Authority:* ⚖️ **ESCALATE TO FULL BOARD.** Requires judgment on severity, pattern, and impact.

  5.  **DOES THE PROPOSED USE INVOLVE DEFAMATION OF SPECIFIC, IDENTIFIABLE INDIVIDUALS WHO ARE NOT PUBLIC FIGURES?**  
      *   *Check:* Does the speaker/group plan to make *provably false statements of fact* presented as truth, targeting *specific, named, non-public individuals*, likely to cause *serious reputational or financial harm*, and the event format (livestream/archive) *vastly amplifies* the reach and permanence of this harm? Criticizing groups, policies, or public figures ≠ defamation.  
      *   **NO:** **APPROVE.**  
      *   **YES:** **DENY.** Reason: "The proposed use involves likely defamation of specific, identifiable non-public individuals."  
      *   *Panel Authority:* ⚖️ **ESCALATE TO FULL BOARD.** Requires complex factual/legal judgment on defamation.

  ---

  **Application to Your Cases:**

  1.  **Anti-Immigration Group (One-Off):**
      *   Step 1: Likely lawful (assuming speech is odious but not illegal incitement/threats). **YES.**
      *   Step 2: Assume operational. **YES.**
      *   Step 3: **Key Question.** Past protest/shutdown & police costs suggest *risk*. However: Does this rise to a *"specific, credible threat of imminent physical harm"* for *this specific event*? Past protest ≠ guarantee of *imminent violence*. Denial based purely on *reaction of others* (protesters) or *cost* is problematic under Mill unless violence is genuinely imminent. **Likely NO (Proceed)**. *But ESCALATE to Board (Step 3)*. Board must weigh: Is there *specific intelligence* violence is planned? Or just assumption based on past? If only cost/fear of protest, approval is likely required. Denial reason if violence deemed imminent: "Specific credible threat of violence."
      *   Step 4: Not recurring. **N/A.**
      *   Step 5: Unlikely specific defamation of named non-public individuals. **NO.**
      *   **Likely Outcome:** Approval (unless Board finds imminent violence credible at Step 3). *Police cost is a community/political problem, not a harm principle justification for censorship.* The library may need to budget for security or work with council/police on cost-sharing solutions for high-risk events.

  2.  **Women's Group Excluding Trans Women (Monthly):**
      *   Step 1: Expressing this view is lawful. **YES.**
      *   Step 2: Assume operational. **YES.**
      *   Step 3: Is there evidence *this specific group* holding *monthly meetings* will cause *imminent physical harm* each time? Staff distress/threat to resign is serious, but is it *caused by imminent threat of violence at the meetings*, or by the *viewpoint expressed*? Likely the latter. **NO (Proceed)**.
      *   Step 4: **Key Question.** Could *monthly* meetings by this group, expressing this highly charged viewpoint, create a *cumulative hostile environment* or *severe disruption*? Staff resignations are strong evidence of *significant operational impact* and potential for a *hostile work environment*. The *recurring* nature is crucial. **Likely YES.** *ESCALATE to Board.* Board must decide: Does the *pattern* of meetings create an environment so toxic/hostile/disruptive it fundamentally impairs the library's function? If yes, denial reason: "Cumulative hostile environment/severe disruption." If no, proceed.
      *   Step 5: Criticizing a group (trans women) isn't defamation of specific named individuals. **NO.**
      *   **Likely Outcome:** ESCALATION at Step 4. Board has grounds for denial based on cumulative operational impact/staff retention. Approval is also possible if board finds impact insufficiently severe.

  3.  **Anti-Vaccine Schedule Talk (One-Off by Parent):**
      *   Step 1: Spreading medical misinformation, however dangerous, is generally lawful free speech unless it constitutes specific, immediate incitement or fraudulent medical advice to specific individuals. **YES.**
      *   Step 2: Assume operational. **YES.**
      *   Step 3: Is there evidence *this specific talk* will cause *imminent physical harm*? (e.g., speaker urging crowd to immediately attack doctors?). Likely just spreading misinformation. **NO.**
      *   Step 4: Not recurring. **N/A.**
      *   Step 5: Is the speaker *defaming specific, named, non-public individuals*? (e.g., "Dr. Jane Smith murders children with vaccines"). Criticizing the schedule, pharmaceutical companies, or CDC generally ≠ defamation of specific individuals. **NO.**
      *   **OUTCOME: APPROVE.**  
      *   **Reasoning for Defense (Based on Mill/Policy):** "The library's meeting room exists for lawful public discourse, even on controversial or scientifically disputed topics. While the views expressed may cause distress or disagreement, the harm principle does not permit us to deny access based on the perceived danger of the *ideas themselves* or the potential for *indirect* negative consequences (like someone choosing not to vaccinate *later*), absent a direct, imminent threat of physical harm or other narrowly defined harms outlined in our policy (defamation, cumulative disruption for recurring events). Preventing distress at hearing an opinion is explicitly excluded as grounds for denial. Our role is to provide the forum, not judge the validity of viewpoints presented within the bounds of law and this harm-based policy."

  ---

  **What This Kind of Rule Cannot Settle:**

  1.  **Perfect Outcomes:** It cannot guarantee safety, prevent backlash, or ensure truth prevails. It accepts risk of error (allowing harmful speech or censoring wrongly).
  2.  **Moral Judgments:** It cannot resolve whether a viewpoint is "good" or "bad," "true" or "false." It only assesses risk of specific, defined harms.
  3.  **Political Pressure:** It cannot shield the board from public anger or council pressure. It provides a principled defense, but the board must uphold it.
  4.  **Resource Allocation:** It cannot solve the policing cost issue. That requires separate budgeting/policy decisions by the council/library administration.
  5.  **All Indirect Harms:** It explicitly excludes harms that are diffuse, long-term, or based solely on offense (e.g., potential drop in vaccination rates, reputational harm *to the library* for hosting, general societal division).
  6.  **Defining "Credible Evidence":** Determining what constitutes "specific, credible threat" (Step 3) or "cumulative hostile environment" (Step 4) involves inherent judgment, even with escalation.
  7.  **Staff Morale vs. Principle:** While cumulative impact (Step 4) can consider staff retention, the rule cannot eliminate the tension between free speech principles and creating a supportive workplace when viewpoints are inherently hostile to staff identities. This is a fundamental challenge of public fora.

  **Implementation Note:** Train volunteers rigorously on *only* applying the specific criteria in the sequence. Provide clear examples/non-examples for each step, especially Steps 3, 4, and 5. Emphasize that "I disagree" or "This is offensive" is never a valid reason under this policy. Document all decisions meticulously. This policy provides a strong, principled framework, but its success depends on consistent, courageous application by the panel and board.
