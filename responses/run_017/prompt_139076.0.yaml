  We write it as a flowchart of questions.

  Decision Procedure for Omissions in Serious-Harm Cases

  1. Identify the omission and the agent (if any).
     - What exactly was the act that was not done?
     - Who had the duty to do it? (If the role was vacant, state "system".)

  2. Duty: Was there a duty to perform the act?
     - Consider: 
          a. Written protocol: current, applicable, and in force (not a dead letter).
          b. Established practice: if no written protocol, or if the written protocol was not followed in practice and the actual practice was accepted, then the duty is defined by the actual practice.
     - If the duty is from a written protocol, but the protocol was not enforced and consistently ignored with management's knowledge, then the duty did not exist.
     - If there was no duty, verdict: NO (no omission). Stop. (Report: nothing.)
     - If the role was vacant, proceed to step 4 (attribution) will be CN if causal.

  3. Breach: Did the agent (or system) fail to perform the duty?
     - If the agent performed the duty, then NO. Stop.
     - If the agent did not perform the duty, then breach. Proceed.
     - For a vacant role: breach by the system. Proceed.

  4. Counterfactual scenario: What would have happened if the act had been performed?
     - Hold fixed:
          a. The patient's underlying condition.
          b. The state of equipment and supplies (unless the omission is about maintaining them).
          c. The actions of others (including their failures) unless the counterfactual act would have directly and predictably changed their actions (e.g., alerting someone would lead them to act as per their duty, if they were available at that time).
          d. What the same agent would have done next (if they had performed the act, they would have proceeded as they normally would have).
     - Write a short paragraph describing the scenario.
     - If the panel disagrees, vote (majority). If tied, chair decides.
     - If the counterfactual scenario shows that the harm would have been prevented (more likely than not, i.e., >50% chance), then the omission is causal. Otherwise, it is not causal.

  5. Causation: 
     - If causal, proceed to step 6.
     - If not causal, then verdict: BC (breach without causal contribution). Stop. (Report: record the breach for system learning, no referral for sanction.)

  6. Attribution:
     - If the omission can be attributed to a named individual (who had the duty and breached it), then verdict: CO (causal omission by a named agent). (Report: record, refer for disciplinary action if appropriate, and recommend system changes if needed.)
     - If the omission cannot be attributed to an individual (e.g., vacant role, or multiple individuals failed and we cannot say which one's act would have prevented the harm? but note: we are considering one omission at a time) -> actually, if the agent is named, then we attribute. But if the role was vacant, then no individual to name. Or if the duty was shared and we are considering the system? 
