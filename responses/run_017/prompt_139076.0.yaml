  Handling the patterns:

  - Latent omission: In step 4, the counterfactual must consider whether the downstream safeguard would have worked if triggered. If so, then the initial omission is causal.
  - Shadowed omission: For each agent, run the procedure. If the counterfactual for that agent alone (holding fixed others' failures) shows that their action would have prevented the harm, then CO for that agent. But note: if the action of one agent would not have been sufficient (e.g., requiring multiple), then it might not be causal? But that is rare in these cases.
  - Unadopted duty: Handled in step 2: if the written protocol was not the actual practice, then no duty? So NO.
  - Derived omission: We run the procedure for the immediate actor. We do not go back more than 48 hours or beyond the immediate shift. The prior system failures may be recorded as contributing factors but not as individual omissions for the purpose of this procedure (unless they are within 48 hours and we run the procedure for them separately).
  - Vacant role: Handled as above: if causal, CN.

