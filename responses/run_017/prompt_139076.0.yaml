  The case doesn't say. But the panel must investigate. Let's assume the panel finds that the written protocol was the duty and the nurse should have escalated. Then verdict: CO.

  Case 2: Drug not reordered when stock fell three weeks earlier. Three people had authority; each assumed another had. Two substitutes were available but not in the trolley and not named in the protocol. Patient died.

  We must break into omissions. Consider the omission of each of the three people to reorder the drug. Also, consider the omission of the system to have the drug in the trolley? But the immediate cause was the absence of the drug during the resuscitation.

  First, take one agent (say, agent A) who had authority to reorder and did not.

  Omission: Agent A failed to reorder the drug when stock fell.
  Agent: Agent A.
  Step 1: Duty? Written protocol says to reorder when stock falls below a level? Assume yes, and it was in force. Duty exists.
  Step 2: Breach? Agent A did not reorder. Breach.
  Step 3: Counterfactual: if agent A had reordered the drug three weeks earlier, would the drug have been available at the time of the emergency?
     - Hold fixed: the others' failures? We hold fixed that agents B and C did not reorder. But if agent A had reordered, then the drug would have been restocked? So available? Then the harm would have been prevented? So causal.
  Step 4: Attribution: to agent A. Verdict: CO.

  But then we would do the same for B and C? So three COs.

  Alternatively, we might consider the system: why did three people think the other would do it? This might be a system failure. But the procedure per agent returns CO.

  Now, what about the substitutes? The protocol didn't name them. So during the resuscitation, they were not used. Is that an omission? But the protocol didn't require them? So no duty to use them? 

  Also, the omission of not having the drug in the trolley? But who had the duty to stock the trolley? We don't have that information.

  But the immediate cause was the absence of the drug. The reordering omission caused that absence.

  Case 3: Junior doctor was sole doctor covering two wards. Review assigned to her by protocol did not happen. Patient died. Rota signed off 11 months ago by a manager who has left.

  Omission: Junior doctor failed to do the review.
  Agent: Junior doctor.
  Step 1: Duty? Written protocol assigns the review to her? Yes. Duty exists.
  Step 2: Breach? She did not do the review. Breach.
  Step 3: Counterfactual: if she had done the review, would the harm have been prevented? Assume yes (the case says the patient died because the review didn't happen). So causal.
  Step 4: Attribution: to the junior doctor. Verdict: CO.

  But the rota was the cause of her being overwhelmed? The manager's omission (failing to properly staff) was 11 months ago -> outside the causal horizon (48 hours). So we do not run the procedure for the manager? And we return CO for the junior doctor.

  The panel won't like that because the junior doctor was put in an impossible situation. But the procedure returns CO.

  Now, we must show one that the panel won't like. Case 3 is the one.

  The procedure cannot:
     - Handle cases where the counterfactual is highly speculative (e.g., if we don't know what would have happened).
     - Assign blame fairly (it only finds causation and breach).
     - Avoid artefacts of the counterfactual specification (e.g., what we hold fixed changes the outcome).
     - Account for moral luck (e.g., an omission that had a small chance of causing harm but did is treated the same as one that was bound to).
     - It might change behavior: panels might be more cautious in finding causation because of the consequences.

  Now, write the procedure concisely (aim for 2 pages).

  [We'll format as a numbered list with clear steps.]
answer: |-
  ### Decision Procedure for Omissions in Serious-Harm Reviews  
  **Purpose**: To determine if an omission (failure to act) caused serious harm, using a consistent, defensible method.  
  **Scope**: Applies only to omissions. For acts causing harm, use existing protocols.  
  **Verdicts** (fixed vocabulary; choose one per omission):  
  1. **CO (Causal Omission by Named Agent)**: An individual’s failure caused the harm. *Report action*: Record, refer for disciplinary review.  
  2. **CN (Causal Omission Not Attributable to Individual)**: Harm caused by a failure, but no single agent is responsible (e.g., system failure). *Report action*: Record, recommend system changes (e.g., protocol update).  
  3. **BC (Breach Without Causal Contribution)**: A duty was breached, but it did not cause the harm. *Report action*: Record for system learning (no referral).  
  4. **NO (No Omission)**: No duty existed, or no breach occurred. *Report action*: Record, no further steps.  

  **Key Rules**:  
  - **Causal Horizon**: Stop tracing omissions beyond 48 hours before the harm. Focus only on immediate failures.  
  - **Counterfactual Specification**: When asking "What would have happened if the act had been performed?", hold fixed:  
    - The patient’s underlying condition.  
    - The state of equipment/supplies (unless the omission relates to maintaining them).  
    - Failures by other agents (e.g., if Nurse A failed to escalate, hold fixed that Coordinator B failed later).  
    - What the agent would have done next (e.g., if they had acted, assume they proceed as usual).  
  - **Probability Threshold**: If the omitted act had a >50% chance of preventing harm, it is causal. Below 50%, it is not causal.  
  - **Values vs. Facts**: The procedure determines **facts** (causation, breach). **Values** (e.g., fairness of blame, proportionality of sanctions) are left to the panel’s judgment after the verdict.  

  ---

  ### Step-by-Step Procedure  
  Run sequentially for **each identified omission**. Terminate early if a negative finding (NO, BC) is reached.  

  1. **Identify the Omission and Agent**  
     - *Question*: What specific act was omitted, and who had the duty to perform it?  
     - *Adequate Answer*: Describe the act (e.g., "Nurse failed to escalate observations"). If duty attached to an unfilled role, agent = "System".  
     - *Stop if*: No act identified → Terminate with **NO**.  

  2. **Duty Check**  
     - *Question*: Was there a duty to perform the act?  
     - *Adequate Answer*:  
       - Duty exists if:  
         - Written protocol required it **and** it was enforced (not routinely ignored with management’s tacit approval).  
         - Or, in absence of protocol, established unit practice required it.  
       - Duty does **not** exist if:  
         - Protocol was "unadopted" (routinely ignored with management’s awareness).  
         - Act was not reasonably expected (e.g., no training, resources).  
     - *Stop if*: No duty → **NO**.  

  3. **Breach Check**  
     - *Question*: Was the duty breached?  
     - *Adequate Answer*:  
       - Breach if: Agent (or system for vacant roles) did not perform the duty.  
       - No breach if: Act was performed, or duty was impossible (e.g., equipment failure).  
     - *Stop if*: No breach → **NO**.  

  4. **Counterfactual Scenario**  
     - *Question*: Would the harm have been prevented (>50% chance) if the act had been performed?  
     - *Adequate Answer*:  
       - Write a short paragraph describing the scenario (e.g., "If Nurse escalated at 2am, Coordinator would have reviewed at 2am and intervened").  
       - Use the **counterfactual specification** (hold fixed patient condition, others' failures, etc.).  
       - If probability is exactly 50% or unclear → Not causal.  
     - *Disagreement*: Vote (majority wins; if tie, chair decides).  
     - *Stop if*: Harm would **not** have been prevented → **BC**.  

  5. **Attribution**  
     - *Question*: Can the omission be attributed to a named individual?  
     - *Adequate Answer*:  
       - **CO** if: An individual agent breached a duty and caused harm.  
       - **CN** if:  
         - Agent is "System" (vacant role).  
         - Multiple agents failed identically ("shadowed omission"), so no single individual made the difference.  
         - Duty was shared, and harm required collective failure.  
     - *Output*: Verdict (CO, CN).  

  ---

  ### Handling Common Disputes  
  Apply during relevant steps:  

  | Pattern                | Handling in Procedure                                                                 | Verdict          | Where It Stops       |  
  |------------------------|---------------------------------------------------------------------------------------|------------------|----------------------|  
  | **Latent omission**    | In Step 4: Hold fixed downstream failures. If act would break the chain (>50% chance), it is causal. | CO/CN (if causal) | Step 4 or 5 |  
  | **Shadowed omission**  | In Step 5: If multiple agents failed identically, no individual attribution.            | CN               | Step 5              |  
  | **Unadopted duty**     | In Step 2: Duty does not exist if protocol was routinely ignored.                       | NO               | Step 2              |  
  | **Derived omission**   | In Step 1: Stop if prior failure >48 hours old (causal horizon). Do not trace further. | (Not considered) | Step 1              |  
  | **Vacant role**        | In Steps 1–5: Agent = "System". If causal, no individual attribution.                   | CN               | Step 5              |  

  ---

  ### Appendix: Case Examples  
  **Case 1: Unescalted Observations**  
  - *Omission*: Nurse failed to escalate at 2am.  
  - *Steps*:  
    1. Duty exists (protocol requires escalation).  
    2. Breach (nurse did not escalate).  
    3. Counterfactual: "If nurse escalated at 2am, coordinator would have reviewed at 2am (not 4am) and likely prevented arrest." Harm prevented >50% → Causal.  
    4. Attribution: Named agent (nurse) → **CO**.  
  - *Why unwelcome?* Nurse followed unit practice (expecting coordinator review). Panel may feel blame is unfair, but procedure focuses on fact: omission caused harm.  

  **Case 2: Drug Not Reordered**  
  - *Omission*: Three agents failed to reorder drug.  
  - *Steps* (run for each agent):  
    1. Duty exists (protocol requires reordering).  
    2. Breach (each agent failed).  
    3. Counterfactual: "If Agent A reordered, drug would have been available." Harm prevented >50% → Causal.  
    4. Attribution: Shadowed omission (identical failures by multiple agents) → **CN** (for the system).  
  - *Note*: Substitutes not used is irrelevant (not in protocol, so no duty).  

  **Case 3: Junior Doctor Overloaded**  
  - *Omission*: Junior doctor failed to perform review.  
  - *Steps*:  
    1. Duty exists (protocol assigns review to her).  
    2. Breach (review not done).  
    3. Counterfactual: "If review done, harm likely prevented." → Causal.  
    4. Attribution: Named agent → **CO**.  
  - *Why unwelcome?** Rota failure (manager) caused the overload, but manager left 11 months ago → Beyond 48-hour causal horizon. **CO** for junior doctor is required, though panel may deem sanction disproportionate.  

  ---

  ### Limitations of the Procedure  
  1. **Cannot resolve**:  
     - **Values-based decisions** (e.g., "Is blame fair?"). The procedure outputs facts; panels must apply judgment.  
     - **Ambiguous counterfactuals**: If the scenario is highly speculative (e.g., "Would the patient have survived with a 40% chance intervention?"), verdicts may be arbitrary.  
     - **Overdetermined harm**: When harm was inevitable (e.g., three failures, any one sufficient), procedure still assigns causation to each omission.  
  2. **Artefacts**: Verdicts depend entirely on what is held fixed in counterfactuals (e.g., holding others' failures fixed may exonerate an agent).  
  3. **Behavioral impact**: Writing omissions down may increase findings of causation (avoids hindsight bias) but could discourage transparency if agents fear CO verdicts.  
  4. **Exclusions**: Does not handle complex causation (e.g., harm from multiple interacting failures) or non-omission cases.  

  ---  
  **Final Note**: This procedure provides consistency but requires rigorous fact-finding. Always document counterfactual scenarios and dissent. Revisit annually for refinement.
