  We are designing a decision procedure for a serious-harm review panel to assess cases involving omissions (failures to act). The procedure must be practical, with clear steps, a fixed vocabulary of verdicts, and handling of common dispute patterns.

  The key elements:
  1. Sequential questions with clear stopping points for negative findings.
  2. Four verdicts:
     - Causal omission by a named agent (CO): An individual's failure to act caused the harm.
     - Causal omission not attributable to any individual (CN): The failure caused harm but cannot be pinned on one person (e.g., system failure).
     - Breach without causal contribution (BC): There was a failure (breach of duty) but it did not cause the harm.
     - No omission (NO): There was no failure (no duty or no breach).
  3. Each verdict leads to specific actions in the report: recording, referral for disciplinary action, system change, or nothing.

  The procedure must specify the counterfactual: what to hold fixed when imagining the act being performed. We hold fixed:
     - The patient's underlying condition (the disease process).
     - The state of equipment and supplies (unless the omission is about maintaining them).
     - The actions of others (including their failures) unless the counterfactual act would have changed their behavior in a predictable way (e.g., if the act is to alert someone, then that person's subsequent actions can be considered).
     - What the same agent would have done next (if the agent had acted, they would have then proceeded as they normally would).

  However, note: in the "latent omission" pattern, we might have to consider that the safeguard downstream also failed, so we hold that failure fixed? But the procedure must be clear.

  We must handle:
  - Latent omission: The omission only matters because a subsequent safeguard also failed. We hold the downstream failure fixed? But then the counterfactual might not prevent harm. We need to consider whether the omitted act would have broken the chain if performed.
  - Shadowed omission: Multiple agents or systems failed to do the same thing. The but-for test fails because no single omission was necessary.
  - Unadopted duty: The protocol was not followed in practice, so there was no realistic expectation.
  - Derived omission: The failure is due to a prior failure (e.g., in rostering, training).
  - Vacant role: The duty was attached to an unfilled post.

  Stopping rule for derived omissions: We stop at the first human actor who had both the duty and the realistic opportunity to act. We do not go back to system designers or past managers unless the failure is very recent and directly traceable (e.g., a staffing decision made in the last month for a role that was critical and the gap was known). We set a causal horizon: we trace back only to failures within the same shift or within a short period (e.g., 48 hours) unless the failure is part of an ongoing, known, and unaddressed systemic issue.

  For the counterfactual paragraph: The panel writes a short narrative of what would have happened had the act been performed, holding fixed the above. If they cannot agree, they must vote (majority rules). If the counterfactual is uncertain (e.g., only a chance of success), then:
     - If the chance is above 50%, we consider the omission causal (adopting a threshold of "more likely than not").
     - If 50% or below, then it is not causal (so BC or CN, depending on whether there was a breach).

  But note: the panel may not be able to quantify. We can require them to judge whether it is more likely than not that the harm would have been averted.

