answer: |-
  ### Final Activity Design: "Code Duels"  
  **Core Insight:** By conditioning on the opponent's *disposition* (source code) via self-reference and transparency, mutual cooperation emerges in a one-shot PD. But this "solution" depends on idealized assumptions students should critique.  

  ---

  ### **Rules & Materials**  
  **Language (8 tokens max, not 40 — forces hard choices):**  
  - **Tokens:** `SELF` (pushes own source as string), `OPP` (pushes opponent's source), `COOP`, `DEFECT`, `IF_EQ` (pop 2 strings; if equal, run next token else skip it), `SKIP` (ignore next token), `LOOP` (restart program).  
  - **Syntax:** Space-separated tokens on index cards (e.g., `SELF OPP IF_EQ COOP DEFECT`).  
  - **Timeout:** 6 execution steps max. After that, auto-DEFECT (prevents infinite loops but allows multi-step logic).  
  - **Output:** First `COOP`/`DEFECT` token reached is the action.  

  **Payoffs → Points:**  
  - Mutual COOP: 3 pts  
  - You DEFECT, they COOP: 5 pts  
  - Mutual DEFECT: 1 pt  
  - You COOP, they DEFECT: 0 pts  
  **Prize:** Top 3 scorers get candy; all others get participation points.  

  **Execution:**  
  - **Compilers:** You + 2 volunteers. Each pair’s programs are run simultaneously.  
  - **Step-by-step:** Track stack and program counter on whiteboard. At each step, compilers execute one token per program until output or timeout.  

  **Mechanics Used:**  
  - ✅ **Token budget (8 tokens):** Copycat (`SELF OPP IF_EQ COOP DEFECT`) uses 5 tokens — reciprocity has opportunity cost (e.g., no room for error handling).  
  - ✅ **Noise (in debrief demo):** Post-activity, you mutate one character in a copycat pair to show cooperation collapse.  
  - ❌ **Lossy channel/sandbox:** Avoids complexity; focus on core self-reference paradox.  

  ---

  ### **Timeline (90 Min)**  
  **0–5 min: Framing**  
  > "Last week, you said defection is inevitable in a real one-shot PD. Today, you’ll write *algorithms* that choose for you. Your program can read your opponent’s code before deciding. Goal: max your points. Tokens are limited — every character costs you."  
  - **Language rules** on whiteboard. Show example:  
    - `DEFECT` → Always defects (1 token, safe but low reward)  
    - `SELF OPP IF_EQ COOP DEFECT` → Copycat (5 tokens, high risk/reward).  

  **5–20 min: Round 1 (Known Partners)**  
  - Pair students visibly (8 pairs).  
  - Write programs (8 tokens max) on index cards. **Key constraint:** No talking.  

  **20–30 min: Run Round 1**  
  - Compilers execute each pair’s programs + record payoffs on board.  
  - **Predictable issue:** Programs may timeout. **Fix:** Auto-DEFECT at step 6; note this rewards simplicity.  

  **30–40 min: Debrief Round 1**  
  - Ask: *"Who cooperated? How?"* Likely outcomes:  
    - Mutual defection (e.g., `DEFECT` vs. `DEFECT`).  
    - Asymmetric payoffs (e.g., `COOP` vs. `DEFECT` → 0/5).  
    - **If copycat emerges:** "Why did identical programs cooperate?"  

  **40–55 min: Round 2 (Unknown Partners)**  
  - Re-pair randomly (secret assignments).  
  - Rewrite programs (same rules).  

  **55–65 min: Run Round 2**  
  - Repeat execution. Note if cooperation drops without known partners.  

  **65–80 min: Analysis & Demo**  
  - **Tournament:** Run all programs vs. 3 fixed opponents on board:  
    1. `DEFECT` (baseline)  
    2. `COOP` (naive cooperator)  
    3. Copycat (`SELF OPP IF_EQ COOP DEFECT`)  
  - **Noise demo:** Mutate a copycat’s `IF_EQ` → `SKIP`. Show cooperation breaking.  

  **80–90 min: Philosophical Debrief**  
  - **Map to theory:**  
    | **Activity Moment** | **Formal Concept** |  
    |---------------------|--------------------|  
    | Copycat pairs cooperating | Program equilibrium (cooperation enforced by code similarity) |  
    | `DEFECT` vs. `DEFECT` | Nash equilibrium (mutual defection remains stable) |  
    | `SELF` token | Self-reference enabling self-comparison |  
    | Noise breaking cooperation | Fragility of exact-code conditions |  
  - **Skeptic’s challenge:** *"This just relocates the problem to transparency!"*  
    → **Response:** "Exactly. Cooperation here requires perfect code-reading — which real actors rarely have. But it proves cooperation *can* emerge without repetition if we can condition on dispositions. Is that enough for the 'real' PD?"  
  - **Real-world relevance Q:** *"Could humans/AIs do this?"*  
    → **Close:** "Humans use proxies like contracts or reputation to approximate disposition-reading. AIs *could* do this with code access — but malware exploits similar mechanics. The point isn’t realism, but questioning what ‘rationality’ means when you can bind choices to your opponent’s nature."  

  ---

  ### **What Will Go Wrong + Fixes**  
  1. **Buggy programs:** Students write invalid tokens or infinite loops.  
     - **Fix:** Compilers interpret errors as DEFECT (note: this rewards testing).  
  2. **No one writes copycat:** Students miss self-reference trick.  
     - **Fix:** In Round 1 debrief, hint: *"What if you could enforce 'cooperate iff they’re like you'?"*  
  3. **Token miscounts:** Students exceed 8 tokens.  
     - **Fix:** Allow one warning, then truncate excess tokens.  

  ### **What the Activity Can’t Teach**  
  - **The recursion theorem:** `SELF` abstracts away the fixed-point magic enabling self-knowledge without a primitive. You must say: *"In theory, programs can self-read without `SELF` via quine tricks — but we simplify for speed."*  

  ### **Why This Works**  
  - **Token limit** forces trade-offs: Copycat "works" but burns 5/8 tokens, so students feel the cost of reciprocity.  
  - **Unknown partners** in Round 2 undermines signaling, highlighting transparency’s role.  
  - **Noise demo** exposes brittleness, priming the "is this *really* a solution?" debate.  

