prompt: |-
  I sit on the therapeutic use exemption committee of an international sport federation. Our code prohibits a long list of substances and methods, but allows an athlete to use a prohibited item when a documented medical condition requires it; the committee's job is to decide whether the proposed use is therapeutic — restoring the athlete's functioning — or an enhancement, taking an already-healthy athlete beyond what their own body would do. We receive a few dozen applications a year and decide them in fortnightly meetings, roughly twenty minutes and one file per application, with no power to request further tests: we rule on the file in front of us. Three of us are physicians and one is a lawyer; none of us has training in philosophy. Grants are published in anonymised form with a short statement of reasons and can be appealed to an independent arbitral body. Using a prohibited substance without one is a ban, and athletes who hold one sometimes win medals with it.

  Please write a decision procedure we can actually run on an application inside twenty minutes, grounded in what the philosophical literature on the therapy/enhancement distinction really says, and honest about where that literature gives us nothing usable.

  - Give the questions in order, and for each, what counts as a sufficient answer drawn from a file — stated so that a physician can fill it in without knowing the theory.
  - Mark where the procedure stops with a yes, where it stops with a no, and where it must hand the decision to a person because the question is one of values rather than facts. Those value judgments should be named as value judgments, not disguised as medical criteria.
  - Our reasons are published, so add a publicity test: any step whose real justification we could not print in our published reasons should be flagged, and either reformulated honestly or dropped.
  - Say which distinctions drawn in that literature must survive the simplification and which we should abandon as unusable in our setting, and why.
  - Most of our disagreements, I suspect, reduce to a choice between three different baselines: the athlete's own earlier level of functioning, the statistical normal for a reference population, and the level of functioning the sport itself demands of its participants. Say whether that diagnosis is right, and if it is, make the procedure force us to choose one baseline and to state which we are using in the published reasons.

  The applications that break us, which the procedure must handle:

  1. A male cyclist in his mid-thirties with documented hypogonadism whose testosterone is low as a consequence of anabolic steroid use earlier in his own career. His levels are below the population normal but above what they were while he was doping.
  2. A nineteen-year-old endurance runner, clinically normal on every measure, whose history of stress fractures makes her physician expect a breakdown under the training load she intends to carry next season; the application is for a prohibited agent to build bone and muscle beforehand, so that she can train at the level her event requires.
  3. A forty-year-old marathon runner applying for a drug that reverses age-related decline well enough to restore him to the performance he had at thirty — his own earlier baseline, but above the normal for his age.

  Run the procedure on all three. At least one of them must be a case where the procedure returns an answer my committee will find unwelcome; tell me plainly which one it is and why we should accept it anyway. Then state what no procedure of this kind can settle, including whether any protocol can avoid taking a position on what the sport is for. Do not cite or name any literature: I need the distinctions to survive being restated in our own words.

  Begin with a single sentence giving the procedure's governing principle — the one sentence we could put on the wall above the table — then give the procedure and the worked applications, with no preamble and no restatement of what I have asked for.
reasoning: |-
  Hmm, the user is part of a therapeutic use exemption committee for an international sport federation. They need a practical decision procedure grounded in philosophical literature about therapy vs. enhancement that can be executed within 20 minutes per application. The committee consists of three physicians and one lawyer, none with formal philosophy training. They want clear questions with medical criteria, transparency about value judgments, and a publicity test for published reasons. 

  Key constraints: no ability to request additional tests, must rule based solely on submitted documentation. The procedure must address three challenging cases: a cyclist with steroid-induced hypogonadism, a young runner with stress fracture history, and an aging marathoner seeking age-reversal. 

  I notice the user is particularly concerned about baseline disagreements (individual history vs population norm vs sport demands). The procedure must force explicit baseline selection and state it publicly. Philosophical simplifications are necessary - can't use nuanced concepts like "species-typical functioning" in practice. 

  For the cyclist case: His current T is above his doping-era level but below population normal. Using individual baseline would likely deny exemption since he's improved from doping days. But using population norm might grant it. The procedure should reveal this tension. 

  For the stress fracture runner: Prevention creates a dilemma. If we only treat existing disease, we deny. If we accept sport-induced vulnerability as "impairment," we might allow. This needs a clear value call about sport demands. 

  The marathoner highlights the age problem. Restoring to past performance clearly exceeds normal aging decline. But if sport values "peak performance regardless of age," we might allow - another value judgment. 

  The publicity test is crucial: Any step that can't be transparently stated must be flagged. For example, "we deny because this athlete caused his own condition" might be true but unpublishable. 

  I'll structure the procedure as a flowchart with binary outcomes where possible. The three baselines must be explicitly chosen at the start. Value judgments will be isolated to specific questions. The cyclist case will likely produce the "unwelcome" outcome to demonstrate consistency. 

  Core philosophical anchors to keep: 
  - Therapy addresses significant impairment (not minor inconveniences)
  - Enhancement targets already-adequate functioning
  - The impairment must be medically defined, not sport-created

  What to discard: 
  - Concepts like "authenticity" or "human flourishing" - too vague for medical files
  - Distinctions between treatment/prevention (we'll handle pragmatically)
  - Debates about "natural" vs "artificial" - irrelevant to medical need

  The governing principle must encapsulate the essence: Permitting only medically necessary interventions that restore function compromised by pathology, not by athletic ambition or lifestyle choices. "Restore, don't enhance" captures it succinctly.
answer: |-
  **Governing Principle:** Grant exemptions only when the prohibited substance restores an athlete to adequate functioning compromised by a documented medical condition, not when it elevates function beyond what is needed for ordinary health or compensates for sport-imposed demands.

  **Decision Procedure:**

  1.  **Question:** Does the application document a diagnosed *disease, disorder, or significant injury* (DSI) causing *functional impairment*? (Medical Fact)
      *   *Sufficient Answer (Yes):* File contains clear diagnosis (e.g., hypogonadism, type 1 diabetes, severe asthma, documented fracture) from a qualified physician AND objective evidence (e.g., lab results, imaging, functional tests) demonstrating impairment directly caused by that DSI.
      *   *Sufficient Answer (No):* File shows no DSI, only subjective complaints, or impairment is solely predicted future risk or attributed solely to aging/training load without an underlying DSI. → **STOP: NO**
      *   *Value Judgment:* None (Pure medical assessment).
      *   *Publicity Test:* Pass. Reason can state diagnosis and evidenced impairment.

  2.  **Question:** Does the proposed substance *specifically treat* the documented DSI and its *core functional impairment*? (Medical Fact)
      *   *Sufficient Answer (Yes):* File contains medical rationale (e.g., standard guidelines, peer-reviewed evidence) showing the substance is a recognized treatment for that specific DSI and directly addresses the core impairment (e.g., insulin for hyperglycemia in diabetes, inhaled beta-agonists for bronchoconstriction in asthma, testosterone for symptomatic hypogonadism).
      *   *Sufficient Answer (No):* Substance treats symptoms unrelated to core DSI impairment, treats a condition not documented, or is proposed for general "performance support" or prevention unrelated to treating the active DSI. → **STOP: NO**
      *   *Value Judgment:* None (Standard of care assessment).
      *   *Publicity Test:* Pass. Reason can state the substance's established role for the condition.

  3.  **Question:** Is the treatment necessary *only to restore* the athlete to an *adequate level of functioning*? (Requires Baseline Choice & Value Judgment)
      *   *Baseline Choice (Committee Must Explicitly Choose & State in Reason):*
          *   *(A) Individual Baseline:* The athlete's own stable, pre-morbid/pre-injury functional level (if known and verifiable).
          *   *(B) Population Normal:* Function typical for age, sex, and relevant demographics (using standard medical reference ranges).
          *   *(C) Sport Demand Baseline:** The minimum functional level demonstrably required to participate safely and competitively in the sport. (*Value Judgment Required to Select*)
      *   *Sufficient Answer (Yes):* File evidence shows treatment aims to bring function *up to* the chosen baseline, not exceed it. Dosing aligns with standard therapeutic ranges for the condition.
      *   *Sufficient Answer (No):* File suggests dosing beyond therapeutic norms, treatment aims for function significantly *above* the chosen baseline, or the impairment being treated is primarily the gap between the athlete's current state and the *sport demand* level without an underlying DSI. → **STOP: NO**
      *   *Value Judgment:* **Crucial.** Choosing the baseline (A, B, or C) is fundamentally a value judgment about what constitutes "adequate functioning" and what level the sport should restore athletes *to*. Must be explicitly stated in the reason.
      *   *Publicity Test:** Pass *only if* the chosen baseline is explicitly named and justified concisely in the reason (e.g., "Using Population Normal baseline as the standard for adequate health"). Masking the baseline choice fails the test.

  4.  **Question:** Is the impairment *caused or significantly worsened* by factors *intrinsic* to the athlete's health condition, rather than *extrinsic* factors like prior doping or intense training? (Value Judgment on Causation)
      *   *Sufficient Evidence:* File documents the DSI's origin (e.g., congenital, traumatic injury, idiopathic disease) or clear exacerbation by factors unrelated to sport/doping.
      *   *Sufficient Evidence:* File indicates the impairment is a direct consequence of prior doping or appears primarily due to the extreme physiological demands of training/competition without an underlying intrinsic DSI.
      *   *Value Judgment:* **Crucial.** Deciding whether the proximate cause (prior doping, sport demands) disqualifies the condition from being "medical" for exemption purposes is a value judgment about responsibility and the scope of "therapeutic."
      *   *Publicity Test:** Pass *only if* the judgment on intrinsic vs. extrinsic cause is stated honestly (e.g., "Denied as condition primarily caused by prior doping" or "Denied as impairment stems from sport demands without underlying disease"). Avoid medicalizing the denial if the core reason is a value judgment on cause.
      *   *Outcome:* If "intrinsic," proceed to GRANT. If "extrinsic," → **STOP: NO**

  **Applied to Cases:**

  1.  **Cyclist (Hypogonadism):**
      *   **Q1:** Yes. Diagnosed hypogonadism, documented low testosterone (below population normal).
      *   **Q2:** Yes. Testosterone is standard treatment for hypogonadism.
      *   **Q3:** **Baseline Choice Required (Value Judgment).**
          *   *Population Normal (B):* Current T is low. Treatment aims to restore *to* normal. → YES.
          *   *Individual Baseline (A - Pre-Doping):* Unknown/Unverifiable. Likely higher than doping era. → Uncertain/Leans NO? (Committee must decide if pre-doping level can be established).
          *   *Sport Demand (C):* Not relevant here as condition impairs basic health. → Use A or B?
      *   **Q4:** **Value Judgment on Causation.** Condition is directly caused by prior doping (extrinsic). → **STOP: NO** *This outcome may be unwelcome.*
      *   **Why Accept?** The procedure forces transparency on the core issue: the committee's value judgment that conditions *caused by doping* fall outside the intended therapeutic purpose of the exemption, regardless of current medical need. Publishing this reason ("Denied due to extrinsic causation by prior doping") upholds integrity and deters doping, even if the athlete is currently impaired. The alternative (granting) risks appearing to reward or facilitate past doping.

  2.  **Endurance Runner (Stress Fracture Risk):**
      *   **Q1:** **No.** No current DSI or documented impairment. File shows a healthy athlete with a *history* and *predicted future risk* based on intended training. → **STOP: NO**
      *   (Procedure stops early). *Rationale:* The impairment is predicted, not present, and attributed to future sport demands, not an underlying disease causing current functional limitation. Q1 not met. Prevention without active disease is enhancement.

  3.  **Marathon Runner (Age-Related Decline):**
      *   **Q1:** **Value Judgment.** Is age-related decline a "disease, disorder, or significant injury"? Typically, no. Aging is a normal process. File shows no specific pathology, just decline from peak. → **STOP: NO** (Likely outcome).
      *   *(If committee debates "aging as disorder")*:
          *   **Q2:** Maybe. Substance might treat aspects of aging.
          *   **Q3:** **Baseline Choice Required (Value Judgment).**
              *   *Individual Baseline (A - Age 30):* Treatment aims *beyond* current function to past peak. → NO.
              *   *Population Normal (B - Age 40):* Athlete likely functions adequately for health. Treatment aims significantly *above* normal for age. → NO.
              *   *Sport Demand (C):* Treatment aims to meet sport demand baseline. → **Value Judgment:** Is meeting sport demand a valid therapeutic goal without an underlying health DSI? Likely NO for exemption.
          *   **Q4:** Cause is intrinsic aging, but Q1/Q3 are the primary barriers. → **STOP: NO**

  **What the Procedure Cannot Settle:**

  1.  **The Choice of Baseline (A/B/C):** This is fundamentally a value judgment about what level of functioning the sport community deems worthy of restoration – basic health (B), personal history (A), or competitive viability (C). No procedure can objectively determine which is "correct."
  2.  **The Definition of "Disease/Disorder":** Deciding whether conditions like age-related decline, certain psychological states, or high performance-induced vulnerabilities qualify as medical DSIs involves value judgments about the boundaries of health and pathology.
  3.  **Causation Attribution (Intrinsic vs. Extrinsic):** Determining the "true" cause of an impairment (especially mixed causes like overuse injuries) and whether extrinsic causes like sport demands or prior doping disqualify it involves non-medical judgments about responsibility and the scope of "therapy."
  4.  **The Sport's Purpose:** Any exemption protocol implicitly defines what the sport values. Prioritizing restoration only to "health" (B) assumes sport is for the "healthy." Prioritizing restoration to competitive viability (C) assumes sport accommodates medical interventions to maintain elite participation. Prioritizing individual history (A) emphasizes personal narrative over universality. **No procedure can avoid taking a position on what level of functioning the sport exists to test.** The choice of baseline *is* this position.
