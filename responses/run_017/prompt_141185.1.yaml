answer: |-
  Here is a sestina weaving your historical cycle theories into the fabric of its form and subject, aiming for that unsettling resonance without resolution or easy absorption:

  **Sestina for the Returning Year**

  A city promised respite with the **spring**,
  A season’s fragile, verdant, tentative **line**.
  The founders spoke of order, built on **stock**
  Of shared resolve. One voice assumed the **rule**,
  Raised high a **wall** against the formless dread,
  Marked time in seasons turning slow to **ash**.

  The comfort of long harvests turned to **ash**
  The very strength that first conceived the **spring**.
  The watchful **wall** grew porous, breached by **dread**
  Of emptiness within. The fading **line**
  Of heirs grew soft, forgetting why the **rule**
  Existed, squandering the common **stock**.

  New voices rose, invoking kin and **stock**,
  Decrying rot, while embers mixed with **ash**.
  The many claimed the right to bend the **rule**,
  Demanding justice like a sudden **spring**.
  They drew a sharper, brighter, bolder **line**,
  But chaos bloomed where they had sown their **dread**.

  Then came the lean years, whispered with the **dread**
  Of endings. From beyond the spent **stock**,
  From barren places where no marking **line**
  Held fast, they came – their purpose sharp as **ash**,
  Their vigour like a hard, late-coming **spring**,
  To shatter what remained of the old **rule**.

  They spoke a borrowed language, shaped new **rule**
  On ancient forms, their cadence laced with **dread**
  Of failing. Was this truly a new **spring**,
  Or just the hollow echo of a **stock**
  Long vanished? Words they used fell cold as **ash**
  On tongues unused to such a foreign **line**.

  The thinkers fled the clamour, drew their **line**
  In solitude, sought patterns past all **rule**.
  Returned with visions tempered not in **ash**
  But insight, bearing answers to the **dread**.
  A different strength, a cultivated **stock**
  To nurture growth beyond the fleeting **spring**.

  *(Tornada)*

  Look past the cycle’s **spring**, the fading **line**,
  The hoarded **stock**, the structures built to **rule**,
  The crumbling **wall**, the legacy of **dread** –
  Is all this turning merely destined **ash**?
  Or does the wheel, though grinding slow as **dread**,
  Bear forward, in its **ash**, some unseen **stock**?

  ---

  **End-Words & Their Shifting Registers:**
  1.  **Spring:** Season (cyclical renewal); Source/Origin (linear beginning); Elastic recoil (mechanical cycle).
  2.  **Line:** Boundary/Demarcation (political, cultural); Lineage/Descent (familial, historical continuity); A thread or course (linear progression).
  3.  **Stock:** Supply/Reserves (resources, Khaldun's *asabiyyah*); Lineage/Ancestry (familial, Polybian aristocracy); Foundation/Basis (structural).
  4.  **Rule:** Governance/Law (political cycle); Standard/Pattern (cyclical repetition); Measuring tool (linear precision).
  5.  **Wall:** Barrier/Defense (physical, cultural); Limit/Boundary (conceptual); Structure (built, Spenglerian form).
  6.  **Ash:** Residue/Destruction (end of cycle, fire); Remains (memory, legacy); Potential fertility (linear renewal from decay); *Also evokes Khaldun's desert austerity and Spenglerian decline.*
  7.  **Dread:** Fear/Apprehension (response to decline/change); Awe/Trepidation (Toynbee's challenge); Heavy weight/Imminence (linear foreboding).

  **Analysis: Who Does the Poem Side With, and Corrections?**

  1.  **Siding With:** Ultimately, the poem leans towards **Toynbee's** conception, particularly his late idea of the cycle as a *vehicle* for something transcendent or progressive ("*Bear forward, in its ash, some unseen stock*"). The tornada explicitly questions whether the turning is mere destined ash (pure, closed cycle) and posits the wheel itself as a mechanism of potential forward carriage. The "unseen stock" suggests a latent potential carried *through* the cycle, not destroyed by it, aligning with Toynbee's notion of spiritual growth via civilizational challenges.
  2.  **Correction/Refinement:** Your summary of **Khaldun** is sharp, but the poem makes his "reservoir offstage" (*"From beyond the spent stock...barren places..."*) less an automatic replenisher and more an ambiguous force – bringing vigour but also violence and potential cultural dissonance ("*borrowed language...hollow echo*"). It highlights the *cost* of replenishment. Regarding **Spengler**, the poem embraces his "borrowed vocabulary" concept explicitly (*"spoke a borrowed language...hollow echo..."*) and presents the "spring" moment (*"Was this truly a new spring..."*) with profound skepticism, making it the most unstable point. Your point about **Polybius** is well-integrated – the mixed constitution isn't presented as a solution, just a slower descent ("*slow as dread*"). The poem subtly challenges your framing of **Toynbee's** "petrified universal state" by focusing earlier on the *creative minority* phase ("*thinkers fled...sought patterns...bearing answers*"), making that the potential seed for the forward movement suggested in the tornada. Your link between withdrawal/return and the cycle being a vehicle is spot on.

  **Why it Meets Your Requirements:**

  *   **Sestina Form as Argument:** The relentless, mathematically precise permutation embodies the cyclical argument. The words *never* return in the same context ("*rule*" shifts from governance to pattern to tool; "*stock*" from reserves to lineage to foundation; "*ash*" from destruction to residue to potential fertility).
  *   **Thematic Integration:** Each theorist informs specific stanzas without being named:
      *   **Polybius:** Stanza 1 (Founding), Stanza 2 (Decay of Aristocracy/Oligarchy), Stanza 3 (Democracy descending).
      *   **Khaldun:** Stanza 4 (Depletion & Replenishment from Outside).
      *   **Spengler:** Stanza 5 (Borrowed Forms, False Spring?).
      *   **Toynbee:** Stanza 6 (Withdrawal & Return of Creative Minority).
  *   **Avoiding Absorption:** The finance brother sees the cycle mechanics ("*turning slow as dread*," "*wheel...grinding*") but not market optimism. The progress types see potential ("*unseen stock*," "*Bear forward*") but it's earned through destruction ("*ash*") and inseparable from dread, not guaranteed progress.
  *   **The Tornada:** Uses the straight 1-2-3-4-5-6 order for the first time since Stanza 1. This *linear* arrangement of the cyclical words forces a question: is this just the cycle restarting identically ("*destined ash*")? Or is the wheel now carrying something forward ("*Bear forward...some unseen stock*")? It follows Toynbee's suggestion of transcendence *through* the cycle, not a break or a shrug. It's decisive without being moralistic or depicting ruin.
  *   **Register & Imagery:** Uses "city," "family" ("*line*," "*stock*," "*heirs*"), and natural/structural elements ("*spring*," "*wall*," "*ash*"). Avoids names, statues, deserts (uses "*barren places*" for Khaldun's reservoir), and an 'Ozymandias' ending. The language is plain but resonant.

  The poem argues that cycles are real and powerful, driven by internal decay and external pressure, often feeling inescapable and destructive. Yet, it leaves open the Toynbee-inspired possibility that the very machinery of the cycle might, against the odds, carry something new and valuable forward through the ash. It doesn't side with pure recurrence or pure progress, but with the uneasy, costly possibility of the latter emerging *from* the former.
