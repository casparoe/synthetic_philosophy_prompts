answer: |-
  Here’s a complete exam package based on your requirements, designed to force critical engagement with Ana’s case while sidestepping rote paradox recitation.

  ---

  ### 1. Exam Question (Word Count: 200)  
  **Question:** Ana’s "standard-shopping" case challenges conventional models of self-deception.  
  (a) For **each** of the following theories, specify *one necessary condition* the theory requires for self-deception that Ana’s case *fails* to satisfy, and explain why:  
  (i) The traditional/interpersonal model (requiring intentional deception and contradictory beliefs)  
  (ii) The partitioning model (requiring compartmentalized, simultaneously held contradictory beliefs)  
  (iii) The deflationary model (requiring biased belief-formation without intention or dual beliefs)  
  *(9 marks)*  

  (b) Propose a *single, specific change* to Ana’s story that would make her actions qualify as **self-deception** rather than:  
  (i) Sincere disagreement about language;  
  (ii) Mere self-serving reasoning;  
  (iii) Akrasia (weakness of will).  
  Justify why your revised version *excludes* these alternative interpretations.  
  *(6 marks)*  

  (c) Does Ana’s case suggest self-deception is better understood as a "policy for counting considerations as evidence" than as a belief-state? Defend your view by contrasting it with *one* theory from (a).  
  *(5 marks)*  

  ---

  ### 2. Model Answer (Word Count: 750)  
  **(a) Theory Conditions**  
  *(i) Traditional/interpersonal model*: This requires *intentional deception* (where the agent actively schemes to induce a false belief in themselves). Ana fails this because her reinterpretation of "visibility" is gradual and unintentional; she does not consciously manipulate her standards to avoid discomfort. The model also requires *contradictory first-order beliefs* (e.g., simultaneously believing "I meet the criteria" and "I do not"). Ana lacks this: she holds one interpretation at a time and never believes contradictory facts about her record.  

  *(ii) Partitioning model*: This requires *simultaneous, compartmentalized contradictory beliefs*. Ana’s beliefs are sequential: she abandons the strict reading during her promotion and reverts to it later. There is no evidence of parallel, isolated belief systems (e.g., no "blackout" or irrational flipping between views). Her later strict assessment of her colleague shows her original interpretation remains accessible and undivided.  

  *(iii) Deflationary model*: This requires *motivationally biased belief-formation* (e.g., unconsciously discounting evidence due to desires). Ana’s case superficially fits this (her desire for promotion aligns with her reinterpretation), but deflationism still implies a *distorted factual belief* (e.g., overestimating her visibility). Ana, however, maintains perfect factual accuracy about her record (talks, awards). Her bias operates purely on *semantic interpretation*, not empirical evidence.  

  **(b) Contrast Condition**  
  To make Ana self-deceived, revise: Six months later, while *assessing her own ongoing eligibility* (e.g., for a raise tied to the same criteria), she *reverts to the lenient reading despite acknowledging it contradicts the department’s clear precedents*, and feels uneasy when colleagues cite her earlier strict vote.  

  - **Against (i) sincere disagreement**: She now recognizes her interpretation conflicts with institutional norms but clings to it. This shows it’s not honest linguistic divergence but resistance to evidence.  
  - **Against (ii) self-serving reasoning**: Her discomfort reveals awareness of inconsistency, distinguishing it from pragmatic but clear-eyed bias.  
  - **Against (iii) akrasia**: Akrasia involves acting against one’s better judgment, but here the issue is belief-maintenance, not action. Her unease suggests conflict between belief and evidence, not weakness in acting on belief.  

  **(c) Policy over Belief**  
  Ana’s case supports reframing self-deception as a "policy for counting considerations as evidence." Unlike belief-centered models, her self-serving shift occurs in *how she weights semantic criteria as evidence for promotion*, not in factual beliefs about her achievements. The deflationary model (iii) focuses on biased *belief outputs* (e.g., "I am visible enough") but ignores the prior step: Ana’s policy *selectively elevates* a lenient definition as probative while *dismissing* the strict one. This policy is stable (it persists for weeks), goal-directed (serves her desire), and reversible when incentives change—unlike beliefs, which purport to track truth. Crucially, policies explain her *reversion*: once her promotion is secured, the policy is discarded because its motivational driver vanishes. Belief-based models struggle with this fluidity, as beliefs typically persist without new counterevidence. Ana’s case thus exposes self-deception’s core not in static contradictions but in dynamic, context-sensitive rules for evidence-evaluation.  

  ---

  ### 3. Marking Scheme (Total: 20)  
  - **Part (a): Theory application (9 marks)**  
    - *3 marks per subpart (i/ii/iii)*: 2 for correctly identifying a failing condition + 1 for case-specific justification.  
    - *Common error*: Describing the theory without linking to Ana (e.g., "Partitioning needs compartments" without noting Ana’s sequential beliefs).  

  - **Part (b): Contrast construction (6 marks)**  
    - *2 marks per alternative (i/ii/iii)*: 1 for plausible change + 1 for justification excluding the alternative.  
    - *Common error*: Proposing changes that address only one alternative (e.g., adding intention handles akrasia but not disagreement).  

  - **Part (c): Original argument (5 marks)**  
    - *2 marks*: Clear stance on policy vs. belief.  
    - *2 marks*: Contrast with a theory from (a).  
    - *1 mark*: Using Ana’s reversion as evidence.  
    - *Common error*: General praise/criticism of theories without using Ana’s details.  

  - **BONUS (up to +2)**: Spotting that Ana’s case lacks *emotional stakes* (e.g., no anxiety) typical of self-deception.  

  ---

  ### 4. Acceptable Variation Note  
  A strong student could **reject the claim that Ana’s case lacks a "motivational component" for deflationism (part a-iii)** and still earn full marks. They might argue: Ana’s *semantic shift itself* is motivated bias—she reinterprets "visibility" *because* she desires promotion, fitting deflationism’s core. The model answer treats "factual belief" too narrowly; deflationism can accommodate conceptual/semantic bias. If argued tightly (e.g., "Deflationism defines ‘belief’ broadly to include interpretive frameworks"), this is valid.  

  ---

  ### Confidence Assessment  
  - **Central claim (policy framing is distinct/new)**: 90% confident. It moves the locus from *belief-states* to *epistemic policies*, which deflationism doesn’t explicitly address. Ana’s reversion is decisive evidence here.  
  - **Least sure claim**: That Ana’s case is "clearly not self-deception" under existing models (implied in part a). A clever deflationist could stretch the theory to cover her. *This goes on the acceptable-variations list.*
