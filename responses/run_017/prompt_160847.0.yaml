answer: |-
  I am committed to totalism: the value of any outcome is the simple sum of the welfare levels of every individual who exists. Your case presents a policy with an expected welfare gain of +10^20, despite high uncertainty around each life. Because the expected welfare per life is +1—firmly above neutrality—and the estimate is unbiased, the *expected total welfare* of creating these lives is positive and immense. Refusing this policy solely due to the symmetric uncertainty would indeed sabotage the logic of procreation under any realistic uncertainty, including ordinary childbirth. If we accept that adding a life with positive expected welfare is permissible (as we must for human existence to continue), we must accept this policy—its scale changes nothing morally. The potential suffering of those whose lives fall below neutrality is outweighed in expectation by the gains of others, and rejecting this arithmetic would force us to condemn even modest family planning.

