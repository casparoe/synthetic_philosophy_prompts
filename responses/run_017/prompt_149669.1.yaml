  ### Combined Scenario: The Departmental Grant

  At your university, Dr. Alice (you) and Dr. Bob are rival researchers. Two weeks ago, a crucial grant vote occurred in your department, with Alice as the swing voter. Before the vote, Bob—a shrewd predictor who knows Alice well (80% accurate)—predicted her vote. If Bob predicted "for," he filed a formal ethics complaint (based on a real but minor infraction Alice committed, which would cost her $1,000 if unaddressed). If he predicted "against," he did not file, but earmarked a $1,000 donation to Alice's preferred charity (which she values at $1,000 due to altruism). The vote passed by one vote; Alice voted "for," so Bob filed the complaint.

  Bob now tells Alice: "The complaint exists. Pay me $500, and I'll withdraw it. Additionally, if you pay, I'll donate $1,000 to your charity—because had you voted 'against,' I would have requested $500 to release the donation. But since you voted 'for,' I request $500 for both: withdrawing the complaint and donating."

  **Act**: Alice must choose to pay $500 to Bob or not.  
  **Single payment channel**: Paying withdraws the complaint and triggers the donation.  
  - **If Alice pays**: Complaint is withdrawn (avoiding $1,000 loss), and charity receives $1,000 (which Alice values at $1,000). Net: −$500 + $1,000 (avoided loss) + $1,000 (donation) = +$1,500.  
  - **If Alice doesn't pay**: Complaint proceeds ($1,000 loss), no donation. Net: −$1,000.  

  **Prediction**: Bob's 80% accurate forecast of Alice's vote.  
  **Bad state**: The filed complaint (already exists).  
  **Closed branch**: The counterfactual where Alice voted "against" (grant failed).  
  **Mugger role**: Bob demands payment to honor the donation from the closed branch.  
  **Blackmailer role**: Bob demands payment to withdraw the complaint.  
  **XOR condition**: The complaint exists xor the donation is available, based on Bob's prediction. Since Alice voted "for," the complaint exists and the donation is not pre-earmarked (Bob funds it from the payment).  

  ### Removal Tests
  **1. Textbook Counterfactual Mugging (remove XOR blackmail)**:  
  Delete the complaint (no bad state). Alice voted "for," but Bob asks for $500 to donate $1,000 to charity, honoring the "against" branch.  
  - *Causal DT (CDT)*: Paying costs $500 but causes a $1,000 gain. EU(pay) = $500; EU(not pay) = $0. **Pay**.  
  - *Evidential DT (EDT)*: Alice knows she voted "for," so paying doesn't change evidence about the vote. EU(pay) = −$500 + $1,000 = $500; EU(not pay) = $0. **Pay**.  
  - *Functional DT (FDT)*: Alice's algorithm's output is logically linked to the donation in the "against" branch. If her algorithm pays, in the "against" branch she gets $1,000 (donation) for $500. EU(pay) = $500 (net here) + expected $500 from branch alignment = $1,000; EU(not pay) = $0. **Pay**.  
  *Your notes were backwards: Standard mugging has CDT/EDT paying, but FDT pays more strongly. Correct verdicts: All pay here, but FDT weighs the branch.*

  **2. Textbook XOR Blackmail (remove closed branch)**:  
  Delete the donation. Bob filed a complaint only if he predicted "for." Alice voted "for," complaint exists. Bob demands $500 to withdraw it.  
  - *CDT*: Paying causes complaint withdrawal (saves $1,000). EU(pay) = −$500 + $1,000 = $500; EU(not pay) = −$1,000. **Pay**.  
  - *EDT*: Alice conditions on her act. Paying is evidence Bob predicted "for" (80% likely), so complaint exists and paying saves $1,000. EU(pay) = −$500 + $1,000 = $500; EU(not pay) = −$1,000 (evidence suggests complaint exists). **Pay**.  
  - *FDT*: Alice's algorithm determines the prediction. If she pays, the predictor likely expected payment, so complaint might not exist—but it does exist independently. FDT ignores spurious evidence: EU(pay) = −$500 + $1,000 = $500; EU(not pay) = −$1,000. **Pay**.  
  *Your notes were mixed: Standard blackmail has CDT paying, EDT paying, FDT paying. But classic XOR blackmail has EDT not paying due to evidence—here, the complaint is fixed, so EDT pays. Correct verdicts: All pay.*

  **Textbook Corrections**:  
  - Mugging: CDT/EDT pay (net gain); FDT pays (branch alignment).  
  - XOR Blackmail: With *fixed bad state*, CDT/FDT/EDT all pay (no evidence trap). Classic XOR blackmail has *prediction of the act*, causing EDT not to pay. Here, the prediction is about a past vote, so the bad state is fixed, changing EDT's verdict.

  ### Verdicts on Combined Case
  **Causal DT (CDT)**:  
  - Pays causes: complaint withdrawal (saves $1,000) and donation (gains $1,000). Costs $500.  
  - EU(pay) = −$500 + $1,000 + $1,000 = $1,500.  
  - EU(not pay) = −$1,000.  
  - **Verdict: Pay** (mugging benefit and blackmail harm are both causal).

  **Evidential DT (EDT)**:  
  - Alice knows the complaint exists (demand confirms it). Paying doesn't change evidence about the vote or complaint.  
  - EU(pay) = −$500 + $1,000 (avoided loss) + $1,000 (donation) = $1,500.  
  - EU(not pay) = −$1,000.  
  - **Verdict: Pay** (no evidence trap; bad state fixed).

  **Functional DT (FDT)**:  
  - Alice's algorithm's output has two logical counterfactuals:  
    - *Mugging dependence*: In the "against" branch, if her algorithm pays, she gets $1,000 (donation) for $500.  
    - *Blackmail dependence*: The complaint exists because her algorithm was predicted to output "for" (vote), not because of her payment decision.  
  - EU(pay) = [−$500 + $1,000 + $1,000] (actual) + [$1,000 − $500] (expected in "against" branch) = $1,500 + $500 = $2,000.  
  - EU(not pay) = −$1,000 (actual) + $0 (branch) = −$1,000.  
  - **Verdict: Pay** (strongly, due to branch alignment).

  ### Subjunctive Interference and FDT's Coherence
  The act carries two logical counterfactuals:  
  - *Mugging dependence*: FDT cares about the "against" branch outcome (closed), recommending pay.  
  - *Blackmail dependence*: FDT ignores evidence from the act (e.g., demand arrival) since the complaint is fixed, also recommending pay.  
  In this case, both point to "pay," so no interference. The combined EU is additive: the branch benefit ($500) is added to the actual payoff ($1,500).  

  **Rule needed?** If the dependences conflicted (e.g., one recommended pay, one not), FDT would need a rule to weigh them. This would be a patch without principle. But here, no conflict. FDT handles both as logical counterfactuals and sums expected utilities across branches, treating them as independent. It commits FDT to additivity in multi-branch cases.  

  ### Key Feature and Robustness
  **Key feature**: The bad state (complaint) is *fixed by a past prediction*, not by the current act, while the closed branch (donation) is *logically tied to the algorithm's output*. This separates the blackmail's evidence (irrelevant) from the mugging's branch alignment.  
  **Collapse if removed**: If the complaint depended on predicting the *payment* (not the vote), it becomes classic XOR blackmail, and EDT would not pay. If the donation wasn't tied to the branch, FDT loses its mugging incentive.  
  **Attack for worst theory**: CDT comes out best here. A critic might argue FDT "double-counts" the branch benefit. But FDT views the branch as a logical consequence, so the attack doesn't land; it's inherent to logical counterfactuals.  
  **Novelty**: This is new. It generalizes the mugging (past branch) and blackmail (fixed bad state) but avoids reductions by fixing the bad state and using a single act.  

  ### Conclusion  
  FDT appears coherent: it handles both dependences additively under logical counterfactuals, with no interference here. The theories agree in this setup, but the exercise reveals FDT's additivity and reliance on algorithm-output counterfactuals. To force conflict, redesign so the mugging branch recommends not paying—e.g., if the "against" branch donation is smaller. But as is, FDT is a unified rule.
