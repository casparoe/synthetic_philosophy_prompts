answer: |-
  Your plan is thoughtful, and your grasp of the replication crisis mechanisms is impressive. However, one core assumption is flawed and could undermine your entire approach. Let's break it down step by step, focusing on your two main questions and the smaller assumptions.

  ### 1. Your division of labor (frequentist vs. Bayesian under flexible stopping)
  - **Frequentist tests**: You're correct that frequentist methods (e.g., t-tests) break under data peeking or flexible stopping. The p-value and type I error rate (5%) rely on a fixed sample size. Peeking inflates false positives because it effectively runs multiple tests without correction.
    
  - **Bayesian methods**: You're right that Bayesian conclusions (e.g., Bayes factors) depend *only* on the data observed, not the stopping rule. The likelihood principle ensures that the same data yields the same evidence, regardless of when you stop. This makes Bayesian inference formally valid under optional stopping in a technical sense.

  **But here's the critical flaw**: While the *interpretation* of a Bayes factor isn't invalidated by peeking, your **decision to stop based on the Bayes factor** introduces a different problem. If you keep sampling until the Bayes factor (BF) reaches a threshold (e.g., BF > 10 for "strong evidence"), you dramatically increase the false positive rate under the null hypothesis. Why?  
  - Under the null, the BF is a random walk. With unlimited sampling, it will eventually cross *any* threshold (e.g., BF > 10) in favor of a false positive.  
  - Example: If the true effect is zero, your probability of eventually getting BF > 10 is 100% if you sample indefinitely. This mimics the frequentist inflation of type I errors.  
  - Unlike a fixed-n design, optional stopping without a maximum sample size guarantees you'll "find" evidence for *something*—even if it's noise.  

  **Why this undermines your plan**: You propose stopping "as soon as" the BF strongly favors a hypothesis. Without a predefined maximum sample size, you risk false positives not because the Bayes factor is invalid, but because your *stopping rule* is biased toward extreme results. Frequentist methods break because they depend on the sampling plan; Bayesian inference is robust to the stopping rule *only if you interpret the BF correctly*. But if you use the BF as a trigger to stop (especially without a cap), you create a machine that manufactures false evidence. Preregistration isn't just for frequentists—it forces you to commit to a stopping rule (e.g., "stop at BF > 10 or n = 200, whichever comes first") to control this risk.

  ### 2. File-drawer problem and your project
  Your adviser is right that publication bias (null results going unpublished) is a major driver of the replication crisis. But your defense is solid: **This doesn't directly affect your study**. Since you're running a single replication (not submitting to journals), you won't suppress null results. Your inference can still be internally valid. However, be mindful that if you replicate a published effect, it might have been selected for significance (due to the file-drawer problem), meaning your replication target could be a false positive.

  ### Smaller assumptions
  - **Bayes factor interpretation**: Your math is correct. A BF of 10 means the data are 10× more likely under H₁ than H₀. With equal prior odds (50:50), the posterior probability of H₁ is 10/(10+1) ≈ 91%. **This is valid**—if your prior odds are justified and preregistered.  
  - **Interpreting non-significant replications**: **This is mistaken**. A failed replication (non-significant or BF ≈ 1) isn't automatic evidence that the original was a false positive. It could mean:  
    - The original was a false positive (type I error).  
    - Your replication had low power (e.g., small sample, noisy measures).  
    - The true effect is small, and your replication underestimated it.  
    Always quantify evidence *for the null* (e.g., with a BF favoring H₀). Don't equate non-significance with "original was false."

  ### The core mistake and what to drop
  Your biggest error is assuming that **Bayesian methods eliminate the need for preregistration and allow unrestricted optional stopping without consequences**. While Bayesian inference is technically coherent under optional stopping, your *implementation* of it—stopping only when the BF is extreme, with no maximum n—makes false positives inevitable under H₀. Preregistration isn't obsolete here; it protects you from:  
  - Changing priors/analyses post-hoc (yes, Bayesians can p-hack too!).  
  - Uncontrolled optional stopping (by forcing a maximum n).  

  **Explain this to your club**: "Bayesian evidence depends only on collected data, not stopping rules. But if we keep sampling until we see strong evidence, we guarantee false positives under the null. We need a maximum n to avoid this trap."

  \answer{that Bayesian optional stopping has no risks}
