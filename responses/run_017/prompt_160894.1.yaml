      - It is true that in Bayesian inference, the stopping rule does not affect the posterior distribution (this is often called the "likelihood principle"). Therefore, if you stop based on the data, the Bayes factor (or posterior) is still valid. However, note that the Bayes factor is computed using the prior and the data. The key point is that the Bayesian interpretation does not depend on the sampling plan (including when you stop) because it conditions on the actual data.
      - However, there is a caveat: the prior must be specified in advance and not changed based on the data. Also, the decision to stop based on the Bayes factor does introduce a multiple testing issue of a sort. Specifically, if you keep sampling until you get a Bayes factor that is extreme, you might eventually get one even if the null is true. This is because the Bayes factor is a random variable and under the null it can wander arbitrarily. In fact, under the null, the Bayes factor will eventually cross any finite threshold in favor of the alternative if you sample long enough (and similarly, under the alternative, it will eventually cross in favor of the null). This is known as the "sampling to a foregone conclusion" problem. 
      - Therefore, the Bayesian approach does not completely eliminate the problem of optional stopping. While the interpretation of the Bayes factor at the stopping point is still valid (it is the ratio of marginal likelihoods for that data), the fact that you stopped when you did (because the evidence was strong) means that you have selected a time when the evidence is strong. This selection can inflate the evidence in the same way that frequentist optional stopping inflates the type I error. However, note that the Bayesian framework does not control type I error by design. Instead, it provides a measure of evidence that is conditional on the data. But if you use the Bayes factor in a decision rule (e.g., stop when BF>10), then the long-run frequency of false positives (if H0 is true) might be higher than what the Bayes factor would suggest. 
      - In summary: the Bayesian inference (the posterior) is valid regardless of the stopping rule, but the stopping rule can affect the operating characteristics (like the probability of obtaining a certain Bayes factor under repeated sampling). Therefore, if you are concerned about the long-run error rates (which are frequentist properties), then optional stopping does matter even in Bayes. But if you are only concerned with the evidence in the current data, then the Bayes factor is valid.

      However, note that the plan is to stop when the Bayes factor strongly favors one hypothesis. This sequential testing with Bayes factors can indeed lead to high false positive rates if the stopping rule is not accounted for in the prior or in the interpretation. There are Bayesian methods that adjust for sequential testing (like using a prior that accounts for the multiple looks), but the basic Bayes factor without such adjustments does not automatically fix the problem of inflated evidence.

      So, the assumption that switching to Bayes removes the need to fix n and preregister is partially true in that the inference is still valid conditionally, but the unconditional properties (like the long-run error rate) are not protected. Moreover, without preregistration, there is a risk of other forms of flexibility (like changing the model or the prior after seeing the data) that would invalidate the analysis.

