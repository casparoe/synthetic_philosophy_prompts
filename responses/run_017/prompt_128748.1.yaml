  Hmm, the core tension seems to be between observable performance and underlying capability. For Ari's case (a), any definition must account for latent competence despite output limitations. The leak case (b) requires distinguishing genuine understanding from pattern-matching. The scaffolding dilemma (c) is particularly thorny - is using tools part of intelligence or just environmental support? 

  For the group case (d), I'm considering whether collective phenomena should even be called "intelligent" at the foundational level. And cost considerations (e) make me question whether efficiency should be inherent to intelligence or merely a performance metric.

  I'll structure each requirement to:
  - Directly address one primary case
  - Contain a non-negotiable core with negotiable aspects marked
  - Explicitly reject inadequate theories (e.g. compression-only views)
  - Note tensions where requirements conflict

  The scaffolding vs cost efficiency tension feels most acute: recognizing tool use as intelligent (c) seems incompatible with valuing raw speed (e). Also, leak-proofing (b) might require test conditions that inadvertently filter out scaffold-dependent cognition (c).

  Key exclusions I should note: IQ testing fails Ari's case, compression theories overlook leak vulnerabilities, and general learning theories can't explain group intelligence. The most powerful requirement might be the one demanding robust transfer - it eliminates many shallow AI performances and standardized testing approaches.
answer: |-
  Here are five requirements for an account of intelligence, anchored to your cases with necessary constraints and conflicts:

  1.  **Must distinguish latent competence from measured performance (*negotiable degree*).** It must explain Ari’s case (a) by accommodating competence that exists despite lacking reliable output channels or requiring unconventional interfaces, rejecting IQ/g-factor theories that equate intelligence solely with testable output under standardized conditions. *This kills IQ-as-essence accounts.*

  2.  **Must require robust generalization beyond training data or specific task setups.** It must correctly classify the leak case (b) as non-intelligent by demanding that solutions hold under *non-trivial* variations of the goal/problem, excluding systems relying on memorized keys or loopholes. *This kills "intelligence as compression" or pure memorization accounts*. *(Tension with c: Overly strict generalization tests might misclassify scaffold-dependent human cognition as fragile).*

  3.  **Must explicitly define the relationship between core capacity and external scaffolding (*negotiable boundary*).** It must resolve the borrowed-scaffold problem (c) by specifying whether tool use/recruitment is an *expression* of intelligence or a *component* of it, and what stable capacity (if any) remains when ubiquitous supports (language, tools) are removed. *This kills accounts that ignore situated cognition or those claiming intelligence is purely "in the head".* ***(This requirement does the most work, excluding simplistic internalist views and ungrounded externalist ones.)***

  4.  **Must specify whether "intelligence" applies solely to individual agents or can be a property of systems.** It must address the group case (d) by clarifying if intelligence requires a unified locus of cognition/agency, or if distributed, emergent group problem-solving qualifies, rejecting accounts that cannot articulate this distinction. *This kills unreflective anthropomorphism of groups and rigid individualism.*

  5.  **Must separate intelligence from computational efficiency or resource constraints (*non-negotiable*).** It must handle the cost case (e) by defining intelligence based on the *capability* to solve a problem domain, not the speed or resource cost of a specific solution instance, distinguishing intelligence from optimal performance. *This kills accounts smuggling efficiency (e.g., some "rational agent" models) into the core definition.* *(Tension with c: If scaffolding is core to intelligence, its *efficiency* might be inseparable from its enabling role.)*
