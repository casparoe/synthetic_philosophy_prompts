prompt: |-
  I am writing a short piece on worst-case versus average-case guarantees in AI alignment, and I need a case built to order, because every example I can find runs in the same direction.

  The familiar dialectic goes like this. A worst-case standard refuses deployment, since no bound can be certified for all inputs; an expected-value standard approves, since the average deployment goes fine; the worst-case side then accuses the other of ignoring tail risk, and the average-case side accuses it of paralysis by an unboundable tail. I want a case that reverses the direction: one in which a worst-case-guarantee standard licenses a deployment that an average-case standard forbids, where the average-case standard is understood as expected harm under the actual deployment distribution, compared against a stated counterfactual baseline.

  Specifications.

  1. Realism. One organization, one workflow, the scenario itself in a single paragraph. Present-day or near-term capability: an LLM-based agent with tool access is fine. No AGI, no existential stakes, no science fiction, no adversary more capable than an ordinary user typing something strange.

  2. The worst-case standard must approve, and on a genuine guarantee. Make the guarantee structural, obtained by construction from the architecture of the deployment rather than from empirical evaluation, a vendor's assurance, or a claim about what the model would not do. The usual materials are an allowlisted action set, a machine-checked wrapper, sandboxing, absence of write authority over anything consequential, mandatory human final sign-off, and reversibility of every action the system can take on its own. State the guarantee explicitly, name the mechanism that secures it, and specify the class of inputs and circumstances over which it holds.

  3. Non-vacuity. The system must be genuinely useful: under the actual input distribution it has to deliver expected benefits the organization would plausibly pay for. The average-case standard may not refuse on the ground that the guaranteed system is guaranteed worthless.

  4. Composition of the refusal. The expected loss that drives refusal must be built entirely out of harms that the worst-case certificate itself counts as acceptable in any single instance. No low-probability catastrophe, no astronomically large stakes, no appeal to the claim that the deployment distribution cannot be known, no unknown unknowns: those are worst-case reasoning wearing a costume. The expected loss must be large because of the bulk of the distribution, either through the accumulation of many individually acceptable losses across volume or through an interaction effect that exists only at the level of the whole deployment and is invisible in any single case.

  5. Derived, not stipulated. Both verdicts have to fall out of the facts you give me. Put rough numbers on the relevant rates, magnitudes and volumes: orders of magnitude are enough, but I want to see the arithmetic that flips the verdict, including the harm of the counterfactual baseline you are comparing against.

  What I want after the scenario.

  (a) The guarantee stated in a form I could audit, and the derivation of the worst-case approval from it.

  (b) The expected-harm calculation, with the baseline made explicit, and the derivation of the average-case refusal.

  (c) An identification of the single structural feature doing the work, and an argument that it, rather than some background assumption, is what separates the verdicts.

  (d) An ablation: vary that feature, and tell me where the two standards reconverge, which way they reconverge, and whether the reconvergence is a genuine agreement between the standards or only the disappearance of the problem.

  (e) The strongest available reply from someone who holds that worst-case guarantees are the right currency for deployment decisions, together with your judgment about whether the reply rescues the case or only relocates it.

  (f) One sentence on what the case does, and does not, establish about whether a worst-case guarantee is necessary or sufficient for a deployment decision.

  If you think the specifications cannot be jointly satisfied, tell me which one has to bend and why. I would rather have that than a case that quietly stipulates the verdicts or smuggles in a doom tail.
reasoning: |-
  We are going to design a scenario that satisfies all the specifications. The key is to have a system that by design prevents any single catastrophic failure (thus satisfying worst-case) but in the average case causes a large number of small, acceptable harms that accumulate to an unacceptable total when averaged over the entire deployment.

  Scenario:

  Consider a financial advisory firm that uses an AI agent to help its clients with tax optimization. The agent has access to a client's financial data and can suggest specific transactions (e.g., selling a stock to realize a loss for tax purposes, or contributing to a retirement account). The firm deploys the AI with the following safety mechanisms:

  - Allowlisted actions: The AI can only execute a set of pre-approved transactions (e.g., trades in a pre-defined set of securities, contributions to specific retirement accounts). It cannot initiate wire transfers, change account settings, or access sensitive personal information beyond what is necessary.
  - Human final sign-off: Every transaction suggested by the AI must be approved by a human advisor before execution.
  - Reversibility: Every transaction that the AI suggests is reversible within a short time window (e.g., stock trades can be canceled within the same trading day, retirement contributions can be reversed within 24 hours without penalty). This is enforced by the system design.

  The worst-case guarantee is: "No single action taken by the system can cause a financial loss to the client that exceeds $X, and any action that causes a financial loss can be reversed within 24 hours without penalty."

  This guarantee holds for any input (any client data and any natural language query from the advisor) because:
  - The allowlist prevents any non-reversible or high-stakes action.
  - The human sign-off provides an additional layer of scrutiny.
  - The reversibility feature ensures that even if a bad transaction is approved, it can be undone without lasting harm.

  Now, the system is deployed at scale. The firm has 100,000 clients and the AI processes 10,000 transactions per day (so about 2.5 million transactions per year).

  The expected benefit: The AI provides tax savings and investment optimization that average $100 per transaction (net benefit). This is a substantial benefit: 10,000 transactions/day * $100/transaction * 250 business days/year = $250 million per year.

  But there is a problem in the average case. The AI occasionally makes mistakes that lead to small losses, which are reversible but cause a temporary disruption and require manual intervention to reverse. Specifically:

  - For 1% of the transactions, the AI suggests a transaction that is suboptimal and would result in a loss if not reversed. However, because of the reversibility feature, the human advisor catches 99% of these mistakes during the sign-off (so only 1% of the 1% actually get executed and then reversed). But note: even when caught during sign-off, there is a cost because the human advisor spends extra time reviewing and rejecting the transaction.

  Let's break down the costs:

  1. When the AI suggests a bad transaction and it is caught at the sign-off stage (which happens 0.99% of all transactions? Actually: 1% of transactions are bad, and 99% of those are caught at sign-off). So 0.99% of transactions cause an extra review time. The cost of this extra review time is $10 per occurrence (in terms of advisor time).

  2. When the bad transaction is not caught at sign-off (0.01% of all transactions) and is executed, it must be reversed. The reversal process costs $100 per occurrence (in administrative and operational costs). Also, during the reversal window, the client may experience a temporary loss of funds (but this is reversed) and a temporary loss of confidence (which we value at $50 per occurrence).

  So the harm per bad transaction that is caught at sign-off: $10.
  The harm per bad transaction that is executed and then reversed: $150 ($100 reversal cost + $50 loss of confidence).

  Now, the expected harm per transaction:

  - Probability of a bad suggestion: 1% (0.01)
  - Of these, 99% (0.99) caught at sign-off: cost $10
  - 1% (0.01) not caught: cost $150

  So the expected harm per transaction due to bad suggestions:
  = 0.01 * [ 0.99 * 10 + 0.01 * 150 ]
  = 0.01 * [ 9.9 + 1.5 ]
  = 0.01 * 11.4
  = $0.114

  Additionally, there is a baseline cost: the human sign-off process itself. In the counterfactual baseline (without the AI), the human advisor would do the entire transaction from scratch. With the AI, the advisor still spends time reviewing. The review time without a bad suggestion is $5 per transaction (this is the cost of the sign-off step). But note: without the AI, the advisor would spend $50 per transaction (doing it manually). So the counterfactual baseline cost per transaction without the AI is $50.

  With the AI, the cost per transaction for the sign-off step is:
  - For a good transaction (99% of the time): $5
  - For a bad transaction (1% of the time): the sign-off step includes extra review, so $5 (base) + $10 (extra) = $15

  But note: the expected cost of the sign-off step per transaction is:
  = 0.99 * $5 + 0.01 * $15 = $4.95 + $0.15 = $5.10

  However, the AI also saves time by generating the initial suggestion. The firm estimates that using the AI reduces the advisor's time per transaction by $40 on average (so without the AI, the advisor time was $50; with the AI, the base sign-off time is $5, plus the extra for bad transactions, but the net advisor time saving is substantial). The net advisor time cost per transaction with the AI is $5.10, compared to $50 without. So the saving per transaction is $44.90.

  But wait: the expected harm per transaction we calculated earlier ($0.114) is an additional cost. Also, note that the benefit of the AI in tax savings is $100 per transaction. So the net expected benefit per transaction in terms of money is:
  $100 (tax savings) + $44.90 (time savings) - $0.114 (harm) = $144.786

  That sounds good. Why would the average-case standard refuse? Because we have not yet considered the volume. The problem is that the firm is comparing two deployments: the current deployment (with the AI) and the counterfactual without the AI. The average-case standard is looking at the expected net harm relative to the counterfactual. But note: the counterfactual without the AI does not have these reversal costs and extra review costs. The net benefit per transaction is positive, so why refuse?

  We need to adjust the scenario to create a situation where the expected harm is large because of the volume of transactions and because the harm, though small per event, adds up.

  Let me reframe the harm: The worst-case guarantee considers only the per-event harm and ensures that no single event causes more than $X (say, $200). But the average-case standard looks at the total expected harm over the entire deployment. If the expected harm per transaction is $0.114, then over 2.5 million transactions per year, the total expected harm is $285,000. This is acceptable because the total benefit is $250 million (from tax savings) plus $112.25 million (from time savings: 2.5e6 * $44.90) = $362.25 million. So $285,000 is negligible.

  We need a different kind of harm that accumulates and becomes significant.

  Revised idea: The harm is not just the operational cost of reversals, but an opportunity cost that is not captured by the worst-case guarantee. Specifically, the reversibility mechanism requires that the transactions are done in a way that allows reversal (e.g., using a special trading account that has higher transaction fees). This fee is paid on every transaction, not just the reversed ones.

  So:

  - Every transaction, whether good or bad, incurs an extra fee of $1 because of the reversibility feature (which requires using a specific trading platform that charges more).

  Additionally, the human sign-off step is mandatory and takes time. Without the reversibility requirement, the firm could use a cheaper trading platform (no extra fee) and also the sign-off might be less burdensome (because without the need for reversibility, the firm might allow some automated transactions without sign-off for low-risk actions). But the worst-case guarantee requires both the sign-off and the reversibility.

  In the counterfactual without the AI, the firm would not need the reversibility feature because they would not be using an AI that might make mistakes. They would use a simpler system that does not require reversibility and thus avoids the extra fee. Also, without the AI, they would not have the sign-off step for every transaction (they might do batch processing or have less frequent checks).

  Let's set up the numbers:

  With the AI system (as guaranteed):
  - Per-transaction tax savings: $100 (as before)
  - Advisor time cost per transaction: $5 (base sign-off) plus the extra for bad transactions (which we calculated as $0.10 per transaction on average, so total advisor time cost per transaction: $5.10). Without the AI, the advisor time cost per transaction is $50. So the time saving per transaction is $50 - $5.10 = $44.90.
  - Extra fee per transaction for reversibility: $1.

  In the counterfactual without the AI, there is no extra fee and no sign-off step for every transaction (they use a batch system that processes transactions automatically and is checked weekly). The counterfactual:
  - Tax savings: Without the AI, the firm uses a simpler algorithm that only achieves $80 per transaction in tax savings (because it is less sophisticated).
  - Advisor time cost: $50 per transaction (if done manually) but they have a batch system that reduces the cost. Actually, without the AI, the firm uses an older automated system that has no extra fee and an advisor time cost of $10 per transaction (for weekly checks and adjustments, amortized per transaction). And the tax savings of the older system is $80 per transaction.

  Now, the net benefit per transaction with the AI system (relative to no transaction at all) is:
  = $100 (tax savings) - $5.10 (advisor time) - $1 (fee) = $93.90

  But we need to compare to the counterfactual without the new AI system (i.e., using the older system). The counterfactual per transaction benefit (relative to no transaction) is:
  = $80 (tax savings) - $10 (advisor time) = $70

  So the incremental benefit per transaction of the AI system over the counterfactual is:
  $93.90 - $70 = $23.90

  This is positive. Why would the average-case standard refuse? Because of the volume? We haven't added any harm that accumulates.

  We need an interaction effect that only appears at scale. Here's an idea: the reversibility mechanism requires that the transactions are not final until the reversal window passes. During that window, the client's funds are tied up and cannot be used for other transactions. This causes an opportunity cost that, when multiplied by the volume, becomes significant.

  Specifically:

  - For every transaction, regardless of whether it is reversed, the amount of money involved is tied up for 24 hours. The average transaction size is $10,000. The opportunity cost is the interest that could have been earned. The annual interest rate is 5%. So the cost per transaction is (5% / 365) * $10,000 = about $1.37 per transaction.

  But note: this cost is also present in the counterfactual without the AI? Not exactly. In the counterfactual, the older system does not have the reversibility feature and settles transactions immediately. So there is no 24-hour hold. However, the older system might have its own delays. Let's assume the older system settles in 1 hour (so negligible cost). Then the incremental cost per transaction due to the hold is $1.37.

  Now, the incremental benefit per transaction of the AI system over the counterfactual is:
  $23.90 - $1.37 = $22.53

  Still positive. And over 2.5 million transactions, that's $56.325 million per year.

  We need a larger cost. Alternatively, we can consider that the hold might cause a problem if the client needs the money during that window. This happens rarely, but when it does, the client must borrow at a high rate. The cost of borrowing is high, but the probability is low.

  But this starts to look like a tail risk. We want the cost to be in the bulk of the distribution.

  Another idea: the human sign-off step causes delays. The delay means that the tax optimization opportunity might be missed if the advisor is not available immediately. The AI system requires that every transaction is approved within 1 hour, but sometimes the advisor is busy and the transaction is delayed by 24 hours. This delay causes the tax optimization to be less effective. Specifically, for 10% of transactions, the delay causes a reduction in tax savings from $100 to $80 (a loss of $20). This is an expected loss of $2 per transaction (0.1 * $20). This loss is not present in the counterfactual because the older system does not require per-transaction sign-off (it does batch processing at the end of the day, but the delay is already factored in and the tax savings are $80).

  So now, the tax savings per transaction with the AI system is not $100 but $100 - $2 = $98 on average.

  Then the net benefit per transaction with the AI system (relative to no transaction) is:
  = $98 - $5.10 - $1 = $91.90

  Compared to the counterfactual: $70

  Incremental benefit: $91.90 - $70 = $21.90

  Still positive.

  We need a cost that is large enough to flip the sign. How about we combine several small costs? Let me adjust the numbers to make it work.

  Let's introduce a cost that is not financial but reputational. Every time a transaction is reversed, the client loses confidence and is more likely to leave the firm. The firm estimates that each reversal (which happens for 0.01% of transactions) causes 0.1% chance of losing a client. Each client is worth $10,000 in lifetime value.

  So per reversal event:
  Expected loss = 0.001 * $10,000 = $10

  And since reversals happen for 0.01% of transactions, the expected cost per transaction due to reputational harm is:
  0.0001 * $10 = $0.001

  This is negligible.

  Alternatively, the extra fee of $1 per transaction for reversibility is paid on every transaction. Over 2.5 million transactions, that's $2.5 million. But the incremental benefit is $21.90 per transaction * 2.5e6 = $54.75 million. So $2.5 million is only about 4.5% of the benefit. Not enough to refuse.

  We need a larger per-transaction fee. Suppose the extra fee is $10 per transaction. Then the incremental benefit becomes:
  $98 (tax) - $5.10 (time) - $10 (fee) = $82.90 per transaction (relative to no transaction)
  Incremental over counterfactual: $82.90 - $70 = $12.90

  Total incremental benefit: $32.25 million per year.

  The extra fee cost: $10 * 2.5e6 = $25 million per year.

  Then the net incremental benefit is $32.25 million - $25 million = $7.25 million. Still positive.

  To flip to negative, we can set the extra fee to $15 per transaction. Then:
  With AI: $98 - $5.10 - $15 = $77.90
  Incremental: $77.90 - $70 = $7.90
  Total incremental benefit without considering the fee: 2.5e6 * $7.90 = $19.75 million
  But the fee is a cost that the firm pays: $15 * 2.5e6 = $37.5 million
  So net loss: $19.75 million - $37.5 million = -$17.75 million per year.

  This is a net loss. The average-case standard would refuse.

  But is this realistic? The worst-case guarantee requires the reversibility feature, which forces the use of a more expensive platform. The extra fee per transaction is $15. This is the structural feature that causes the problem.

  Now, the worst-case standard approves because it sees that no single transaction can cause more than $X (say, $200) loss. The fee is not considered a harm in the worst-case guarantee because it is a cost of doing business, not a harm from a malfunction. But the average-case standard looks at the total cost and sees that it makes the system uneconomical.

  But wait: the specification says that the expected loss must be built out of harms that the worst-case certificate counts as acceptable in any single instance. The worst-case guarantee is about bounding the harm from a malfunction, but the fee is not a malfunction harm; it's a design cost. So we must frame the harm as a malfunction harm.

  We need to reinterpret. Let me try a different harm.

  Revised scenario:

  The AI system is used for scheduling appointments for a medical clinic. The system has a worst-case guarantee: it cannot schedule two appointments for the same provider at the same time (by design, because it uses a centralized database with locking). It also cannot schedule an appointment outside clinic hours (the calendar is constrained). And any scheduling mistake can be corrected within 24 hours without harm (because the clinic calls to confirm and can reschedule).

  The worst-case guarantee: "No single scheduling error can cause a patient to miss an appointment without the clinic being able to reschedule within 24 hours, and no financial loss to the patient exceeding $50 (for example, compensation for inconvenience if rescheduled)."

  The guarantee is achieved by:
  - The locking mechanism for the provider's calendar.
  - Bounded scheduling hours.
  - A 24-hour confirmation window during which any appointment can be changed without penalty.

  Now, the system is deployed for a large clinic with 100 providers and 10,000 appointments per day.

  The benefit: Without the AI, the clinic has scheduling errors (double-booking or scheduling outside hours) that occur in 5% of appointments, leading to rescheduling costs of $100 per error (on average). With the AI, the clinic expects to reduce the error rate to 0.1% because of the guarantee. But there is a catch.

  The AI system, to achieve the guarantee, requires that each appointment is scheduled with a 24-hour confirmation window. This means that the appointment is not final until 24 hours before. This causes two problems:

  1. Some patients do not get a immediate final appointment and become anxious. The clinic estimates that this anxiety reduces patient satisfaction, which leads to a loss of future business. The expected loss per appointment is $1 (very small, but scales with volume).

  2. More importantly, the 24-hour window means that the clinic cannot book appointments within the next 24 hours. This reduces the utilization of the clinic's capacity. Specifically, the clinic typically books 10% of its appointments within the next 24 hours. Without the AI system, they could book these last-minute appointments. With the AI system, they cannot. The profit from an appointment is $200. So the opportunity cost per appointment slot that goes unfilled because of this restriction is $200.

  But note: the AI system is only used for scheduling future appointments (beyond 24 hours). For appointments within the next 24 hours, the clinic uses a different system (manual or a simpler automated system). However, the volume of appointments within 24 hours is 10% of what it would be if the clinic could book them in advance. But because of the restriction, they cannot book them in advance, so they are not scheduled at all until they become "within 24 hours", and then only 50% of those slots get filled because of the short notice. So without the AI system, the clinic books 10,000 appointments per day, of which 1,000 are for within the next 24 hours. With the AI system, the advance scheduling is only for beyond 24 hours, and the last-minute system books only 500 appointments per day (50% of the 1,000 last-minute slots). So the clinic loses 500 appointments per day.

  The opportunity cost per day: 500 appointments * $200 = $100,000.

  Per year (300 days): $30 million.

  Now, the benefit of the AI system in reducing scheduling errors:
  - Without AI: 5% error rate on 10,000 appointments/day = 500 errors/day, cost $100/error = $50,000/day.
  - With AI: 0.1% error rate on the appointments it schedules (9,500 advance appointments + 500 last-minute) = 10 errors/day, cost $100/error = $1,000/day.
  - So savings: $50,000 - $1,000 = $49,000/day.

  Per year: $14.7 million.

  But the loss from reduced appointments: $30 million per year.

  So net loss: $30 million - $14.7 million = $15.3 million per year.

  The average-case standard would refuse.

  The worst-case guarantee approves because it is designed to prevent any single scheduling error from causing more than $50 harm. And it succeeds. But the opportunity cost of the confirmation window is not considered in the worst-case guarantee because it is not a harm from a malfunction; it's a design trade-off.

  However, the specification requires that the expected loss is built out of harms that the worst-case certificate counts as acceptable in any single instance. The opportunity cost is not of that kind. It is a systematic cost.

  But note: the harm of a lost appointment is $200 per appointment. The worst-case guarantee does not bound this harm because it is not caused by a malfunction of the scheduler for a specific appointment. It is caused by the design of the system (the 24-hour rule) which is a global constraint.

  So this might not fit.

  Let me try to fit the financial advisory example with an opportunity cost that is considered acceptable in any single instance.

  In the financial example, the reversibility feature causes a delay in settlement for every transaction. During the delay, if the client has an emergency and needs the money, they can't access it. The firm has to compensate the client for this. The worst-case guarantee caps the compensation per event at $200. The probability of a client having an emergency during the settlement window for any given transaction is 0.1%. But note: this is per transaction. For a client with many transactions, the probability might be higher, but we are at the transaction level.

  The expected harm per transaction from this emergency access failure is: 0.1% * $200 = $0.20.

  This is within the worst-case guarantee (any single event is <= $200). But when scaled to 2.5 million transactions per year, the total expected harm is $500,000.

  Additionally, we have the $1 per transaction fee and the advisor time cost. But the benefits are large enough to absorb $500,000.

  We need more. Let's say the probability is 1% and the compensation is $500 (but the worst-case guarantee allows up to $500 per event). Then expected harm per transaction is $5. Total for 2.5e6: $12.5 million.

  Now, recall the incremental benefit per transaction was $23.90 in the earlier calculation (without this harm). Subtract $5: $18.90 per transaction. Total incremental benefit: $47.25 million. Minus the $12.5 million for emergencies: $34.75 million. Still positive.

  Combine with a high extra fee. Suppose the extra fee is $10 per transaction. Then incremental benefit per transaction becomes $23.90 - $10 = $13.90. Total without emergencies: $34.75 million. Minus $12.5 million = $22.25 million. Still positive.

  To flip, set the emergency probability to 10% and compensation to $100 (expected harm per transaction = $10). Then emergency harm over year: $25 million. Incremental benefit without emergencies: $23.90 - $10 (fee) = $13.90 per transaction * 2.5e6 = $34.75 million. Minus $25 million = $9.75 million. Still positive.

  Set the emergency probability to 20% and compensation to $100: expected harm per transaction = $20. Yearly: $50 million. Then incremental becomes $34.75 - $50 = -$15.25 million.

  This works, but is it realistic that 20% of transactions coincide with an emergency? Probably not.

  How about the harm is not to the client but to the firm's operational efficiency? For example, the reversibility feature requires that the firm maintains a liquid reserve to cover potential reversals. The reserve does not earn investment income. The opportunity cost of the reserve is proportional to the volume of transactions.

  Specifically, for each transaction, the firm must set aside the transaction amount for 24 hours. The average transaction is $10,000. The opportunity cost is the return on investment that could have been earned: 5% per year. Per transaction: (5% / 365) * $10,000 = $1.37.

  This cost is paid on every transaction. Over 2.5e6 transactions: $3.425 million per year.

  This is not enough to flip the sign.

  But if the transaction amount is $100,000, then the cost per transaction is $13.7. Over 2.5e6: $34.25 million. And the incremental benefit was $54.75 million (from earlier calculation without this cost). Minus $34.25 million = $20.5 million. Still positive.

  Combine with the extra fee of $15 per transaction (which costs $37.5 million) and the reserve opportunity cost of $13.7 per transaction ($34.25 million), the total cost = $71.75 million. The incremental benefit without these costs is $54.75 million. So net loss: $17 million.

  This works, but is the reserve requirement a harm that the worst-case guarantee considers acceptable in any single instance? The worst-case guarantee doesn't consider the reserve cost at all. It's a systemic cost.

  I am considering that the specification might be inherently hard to satisfy. Perhaps the only way is to have a harm that is within the worst-case bound but that occurs very frequently, and the expected harm per transaction is within the bound but the total expected harm over the deployment is large.

  Let's create a scenario where the harm, though bounded per event, happens so frequently that the total expected harm is large.

  Scenario: A spam filter for a large email provider.

  Worst-case guarantee: "No single email can be misclassified in a way that causes more than $0.001 worth of harm to the user or the provider." This is achieved by design:
  - If an email is marked as spam, it is not deleted but placed in a spam folder that the user can review.
  - The user can always recover any email from the spam folder within 30 days.
  - The system has a manual override: the user can mark as not spam or spam.

  The harm from a single false positive is that the user might not see the email for a short time, which is bounded by design (because the user can recover it) and the maximum harm is considered to be $0.001.

  Similarly, a false negative might let a spam email into the inbox, causing annoyance, but the maximum harm is $0.001.

  The email provider processes 1 billion emails per day.

  The benefit: The AI spam filter has an accuracy of 99.9%, compared to the old system which had 99% accuracy. The old system had:
  - False positive rate: 1% (10 million FP/day)
  - False negative rate: 1% (10 million FN/day)

   The new system:
  - FP rate: 0.1% (1 million FP/day)
  - FN rate: 0.1% (1 million FN/day)

   The cost of a FP or FN is $0.001 per email in the old system and also in the new system.

   The reduction in harm per email:
   For FP: (0.01 - 0.001) * $0.001 = $0.000009
   For FN: similarly $0.000009
   Total saving per email: $0.000018

   Total saving per day: 1e9 * $0.000018 = $18,000

   But the new system has a cost: it requires more computational resources, which cost $0.00002 per email to run.

   The cost per day: 1e9 * $0.00002 = $20,000

   So the net incremental cost per day: $20,000 - $18,000 = -$2,000

   Over a year (365 days): -$730,000

   The average-case standard would refuse.

   The worst-case standard approves because it has a guarantee that no single email can cause more than $0.001 harm.

   However, is the computational cost a harm that the worst-case guarantee is designed to bound? The guarantee is about misclassification harm, not operational cost.

   This violates specification 4: the expected loss must be built out of harms that the worst-case certificate counts as acceptable in any single instance. The computational cost is not such a harm.

   We need the cost to be from false positives/negatives.

   In this scenario, the new system might have a different distribution of harm. For example, the old system's false positives were mostly in low-priority emails, while the new system's false positives include more high-priority emails. But then the cost per false positive might be higher in the new system, but the worst-case guarantee should bound it to $0.001.

   Alternatively, the new system causes more harm because it is slower, and users value speed. The harm from a delayed email is bounded by $0.001 per email, but the new system has a higher latency.

   Suppose the old system had a latency of 0.5 seconds per email, and the new system has 1 second. The harm from latency is $0.0001 per second per email. So additional harm per email: $0.0001 * 0.5 = $0.00005.

   Total harm per day: 1e9 * $0.00005 = $50,000

   Then the net of the new system: saving from accuracy $18,000 - additional latency harm $50,000 = -$32,000 per day.

   This harm (latency) is within the worst-case guarantee? The worst-case guarantee might not cover latency. It only covers misclassification.

   We are struggling.

   Let's design around the spam filter example but ensure the harm is from misclassification.

   Suppose that the new system, to achieve the worst-case guarantee, uses a very conservative approach that increases the false negative rate for high-volume senders. Specifically, it has a higher false negative rate for emails from senders with very high volume (e.g., mailing lists) because it doesn't want to risk false positives for them. But these emails are more likely to be spam. However, the worst-case guarantee is still met because any single email can cause at most $0.001 harm.

   The actual harm per false negative for a high-volume sender might be higher because their emails are more likely to be spam and more numerous. But the bound is still $0.001 per email.

   Suppose the new system has:
  - For emails from high-volume senders: false negative rate = 0.5%
  - For emails from others: false negative rate = 0.01%
  - Overall, 50% of emails are from high-volume senders.

   So overall false negative rate = 0.5*0.5% + 0.5*0.01% = 0.25% + 0.005% = 0.255% (which is within the 0.1% we had before? No, we said 0.1% earlier, so this is worse).

   We need to be consistent.

   Perhaps the new system has an overall false negative rate of 0.1% (as before) but the distribution is such that the harm per false negative is higher. Specifically, for high-volume senders, the emails are more likely to be spam and also more likely to be bulkier, causing more harm if let through. But the worst-case guarantee caps the harm per email to $0.001, so even if it's bulkier, the harm is at most $0.001.

   This doesn't work.

   The only way is to have the harm floor be high. That is, even though the harm per event is at most $0.001, the minimum harm per event is also high. For example, in the conservative design, the system might avoid false positives by letting through more spam, but then every spam email that gets through causes harm of exactly $0.001 (whereas in the old system, the harm per false negative was on average $0.0005 because spam emails were often from less harmful sources). 

   Then for false negatives:
  - Old system: 1% * 1e9 = 10 million false negatives per day, average harm $0.0005, total harm $5,000.
  - New system: 0.1% * 1e9 = 1 million false negatives per day, average harm $0.001, total harm $1,000.

   so saving of $4,000 per day.

   Similarly, for false positives:
  - Old system: 1% * 1e9 = 10 million, harm $0.001 per email (average), total harm $10,000.
  - New system: 0.1% * 1e9 = 1 million, harm $0.001, total harm $1,000.
  - Saving: $9,000.

   Total saving: $13,000 per day.

   But the new system costs $20,000 per day to run.

   Net loss: $7,000 per day.

   The harm per false negative in the new system is $0.001, which is within the worst-case bound. The bound is on the maximum harm, not the minimum. It's acceptable that the harm is $0.001.

   This meets specification 4: the expected loss is built out of many events, each of which has harm within the bound ($0.001), and the new system has a higher per-event harm for the false negatives that occur, but fewer of them.

   The average-case standard refuses because the net harm is negative.

   The worst-case standard approves because it only cares that no event exceeds $0.001.

   This satisfies the specifications.

