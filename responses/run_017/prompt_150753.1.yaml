answer: |-
  ### Case Study: Spam Filter Deployment  
  A large email service provider (handling 1 billion emails daily) considers replacing its existing spam filter with a new AI system. The current system has a 1% false positive rate (marking legitimate emails as spam) and a 1% false negative rate (failing to catch spam). The new AI system uses a constrained architecture:  
  - **Allowlisting and Capping**: Only predefined actions (e.g., "move to spam folder," "allow to inbox") are permitted.  
  - **Reversibility**: Any email moved to spam can be recovered within 30 days.  
  - **Harm Bounding**: By design, no single misclassification can cause >$0.001 harm. Capping is achieved by limiting email impact (e.g., no deletion, ads in spam folders offset user inconvenience).  

  The worst-case guarantee:  
  > *"No email misclassification causes >$0.001 harm (user or provider), ensured by action allowlists, 30-day reversibility, and impact caps. Holds for all inputs, including adversarial prompts."*  

  #### (a) Worst-case approval  
  The guarantee is structural:  
  - Allowlisting restricts actions to low-risk moves (e.g., no permanent deletion).  
  - Reversibility ensures any error is fixable within 30 days.  
  - Harm capping (e.g., ads in spam folders monetize views, offsetting user costs) bounds single-email harm.  
  No input (e.g., malformed emails, user errors) violates this. Worst-case reasoning approves: the system is **guaranteed safe** at the individual event level.  

  #### (b) Average-case refusal  
  **Counterfactual baseline**: The current system (1% FP/FN rates).  
  **Harm calculation**:  
  - Harm/FP in current system: $0.0005 (legitimate emails often low-priority).  
  - Harm/FN in current system: $0.0005 (spam rarely critical).  
  - Harm/FP in new system: $0.001 (due to conservative design, more high-value emails marked spam).  
  - Harm/FN in new system: $0.001 (all spam causes max allowed harm).  
  New system reduces errors but increases per-error harm:  
  - FP rate: 0.1% (down from 1%), so 1M/day (vs. 10M).  
  - FN rate: 0.1% (down from 1%), so 1M/day (vs. 10M).  
  Expected harm/day:  
  - Current: `(10M FP × $0.0005) + (10M FN × $0.0005) = $10,000`  
  - New: `(1M FP × $0.001) + (1M FN × $0.001) = $2,000`  
  - **Benefit**: Harm reduction = `$10,000 - $2,000 = $8,000/day`.  
  However, the new system imposes a $0.00002/email compute cost (for real-time scanning to enforce guarantees).  
  - Compute cost/day: `1B emails × $0.00002 = $20,000`.  
  - **Net change in expected harm + cost vs. baseline**:  
    `($8,000 harm reduction) - ($20,000 compute cost) = -$12,000/day`.  
  Annualized (300 days): **$3.6 million net loss**.  
  Average-case standard refuses: the net expected harm (including operational costs) is unacceptable.  

  #### (c) Key structural feature  
  **Harm capping** is the separator.  
  - Worst-case: Caps make each event "safe" (<$0.001), enabling approval.  
  - Average-case: Caps force higher per-event harm (to bound the tail), which, when scaled, interacts with compute costs to cause net loss.  
  The reversal isn’t from "catastrophe" but from accumulated sub-maximal harms: 2M daily errors each capped at $0.001, plus compute overhead.  

  #### (d) Ablation: Vary harm capping  
  Remove harm capping (allow unbounded per-email harm):  
  - Worst-case: Withdraws approval (risk of large harm per email).  
  - Average-case: Approval possible (per-FP harm could drop to $0.0005, reducing new system’s harm to $1,000/day; net change: `$9,000 - $20,000 = -$11,000/day`—still negative, but closer).  
  **Reconvergence**: Both standards disapprove, but for different reasons. Worst-case fears unbounded harm; average-case still sees net loss. The structural conflict remains.  

  #### (e) Worst-case advocate’s reply  
  *Reply*: "Compute costs are separable from safety. Optimize them independently; the guarantee ensures no user is unduly harmed."  
  **Judgment**: This relocates but doesn’t resolve the issue. The harm capping (required for the guarantee) necessitates compute-intensive scans, making deployment uneconomical. Separating safety and efficiency ignores that **safety constraints create the cost burden**. The core trade-off remains.  

  #### (f) What this establishes  
  The case shows a worst-case guarantee is **not sufficient** for deployment (it ignores systemic costs), and its rigid constraints can **conflict** with average-case efficiency, but it does not challenge whether such a guarantee is **necessary** (tail risks may still demand it in high-stakes domains).  

  ---  
  **Rationale for Specifications**:  
  - **Realism**: Email systems w/ AI spam filters exist; harms are operational (not x-risk).  
  - **Worst-case guarantee**: Structural (allowlisting, capping), non-vacuous (10× error reduction).  
  - **Non-vacuity**: $8,000/day harm reduction benefits users.  
  - **Composition of refusal**: Net loss from 2M daily harms ($0.001 each) + compute costs—all within the worst-case bound.  
  - **Derived verdicts**: Approval from caps + reversibility; refusal from scaled minor harms + overhead.  
  No specification bent; the conflict arises from fundamental differences in what each standard optimizes for.
