prompt: |-
  I edit the science-and-ideas desk at a national newspaper and write a weekly column, and I am trying to repair something about how we decide what to run. Two or three times a week a study arrives — usually a preprint, or a journal paper under embargo — and the operative question at our morning conference has quietly stopped being whether the finding is true and become who else has it. The honest description of our workflow is: check whether the wires and two or three respected competitors have moved, and if they have, move ourselves; if nobody has, treat that as a reason for caution. Having read a general-audience account of informational cascades and rational herding, I now suspect both halves of that workflow can be given a rational defence and that neither defence is obviously sound — which is to say I cannot tell, in a given case, whether the crowd is telling me something about the world or only about itself.

  My own provisional taxonomy, which I would like you to correct as well as use, has four entries. First, evidence pooling: many parties converge because each saw something independently, and the convergence is genuinely informative. Second, cascade proper: later actors hold private signals but their public behaviour is swamped by what earlier actors did, so their information never becomes public and the twentieth follower adds nothing to the nineteenth. Third, imitative or reputational herding: actors match the crowd because being wrong alongside the crowd is cheaper than being wrong alone, in which case the crowd carries no information about the world at all, only about incentives. Fourth, a case I have not seen discussed and that I think is the common one in my trade: apparent independence that is an artefact, where everyone's private signal traces back to the same press release, the same dataset, the same measurement instrument, the same small circle of labs, or the same initial wave of coverage.

  I would like you to turn whatever survives in that taxonomy into a written decision procedure my reporters can actually run. Concretely: the desk has no statistician, one fact-checker, a section editor who signs off on anything that deviates from what competitors are doing, and about thirty minutes between the embargo lifting and the moment a decision has to be made. So I need ordered tests, not an essay; what counts as a sufficient answer to each question; what to do when the number or the document a test calls for cannot be obtained; the points at which the procedure returns a flat no; and the points at which it must hand the decision to a person because the remaining question is one of values rather than evidence — news value against the cost of amplifying a false claim, and against the cost to us of being seen to have sat out a real one.

  I should also say what I have been using informally, so you can tell me which parts to throw away. I count distinct upstream sources rather than outlets, on the theory that thirty stories from one press release is one source. I apply something like a defector rule: a single detailed dissent from someone with access to the data is worth more than twenty follow-ups, and I weight it accordingly. I treat silence as ambiguous rather than as evidence against a claim, since I suspect the failure to publish null results is itself a herd phenomenon. And I treat our own earlier coverage of a claim as a reason to scrutinise a new result harder, not as a reason to stand pat.

  Please run the finished procedure on three hypotheticals. One: a psychology preprint, roughly two hundred participants, a counterintuitive result about an everyday habit, thirty outlets inside forty-eight hours, all traceable to a single university press release, no independent dataset, and a reporter on my desk who is convinced. Two: a geophysics result about ocean heat, three groups, different methods and different underlying data, covered by two specialist outlets and ignored by everyone else, with the desk inclined to skip it as already covered. Three: a preprint failing to replicate a finding we ourselves ran prominently eight months ago, from a mid-sized lab, covered by one small newsletter and no one else, with competitors silent and no obvious appetite anywhere for the story.

  I want a committed response rather than a survey. Fix one ordering of the tests and defend it; tell me which single test you would keep if I could keep only one; give a definite verdict on each of the three cases, including the third, where I expect the verdict to be one I would rather not hear; say which of my four informal rules are wrong or misfire; and state plainly what the procedure cannot do, so I do not end up presenting it to the section editor as more than it is. If a step depends on a technical result from the literature on herding, state the result in one sentence and flag whether it is contested, but do not give me citations, references, or a reading list: I cannot act on those, and I will not check them.
reasoning: |-
  Okay, the user is an editor at a science desk dealing with how to decide which studies to cover. They've noticed that their team often just follows what other outlets are doing instead of evaluating the study's truth. They want a practical decision procedure that fits their tight 30-minute deadline and limited resources.

  Hmm, looking at their taxonomy of four herd behaviors: evidence pooling (genuine convergence), cascade (later actors don't add new info), reputational herding (following to avoid risk), and apparent independence (everyone using same source). The fourth one seems particularly relevant to their work where many stories trace back to one press release.

  Their current informal methods include counting distinct sources (not outlets), valuing single detailed dissents, treating silence as ambiguous, and scrutinizing their own past coverage more. Need to check which of these hold up.

  The key constraints: no statistician, one fact-checker, 30 minutes max, section editor wary of deviations. So the procedure must be fast, operable by generalists, with clear pass/fail gates. Should prioritize stopping bad coverage over catching everything good.

  For the decision flow: First check for source independence - are multiple outlets relying on the same origin? If not, then look for dissents or methodological concerns. Only then consider news value. This ordering prevents downstream herding from contaminating the evaluation.

  Important to flag what the procedure can't do: Can't verify truth, can't assess fields with publication bias, can't override news judgment calls. Must be clear about these limitations to the section editor.

  For the hypotheticals: The psychology study fails immediately on source independence (all from one press release). The geophysics study passes independence but needs scrutiny for dissents/methods. The replication study has high news value for them but must check methodology carefully.

  Would keep the source independence test if only one - it's the biggest filter against false amplification. Their "count distinct sources" rule is good, but "treat silence as ambiguous" might misfire in small fields where silence could indicate problems.

  The procedure will reject some stories they want to run (like the replication) if methodology is weak, even if it's newsworthy for them. Need to be firm about that gate.
answer: |-
  Here's a streamlined decision procedure based on your taxonomy, designed for 30-minute embargo lifts. It prioritizes **stopping bad amplification** over catching every good story. Tests are ordered to eliminate high-risk cases early.

  **Core Principle:** *Assume herding until proven otherwise. Prioritize source independence over volume.*

  ---

  ### **Decision Procedure: "HERD Filter"**
  **(Run tests in order; stop and decide if any step returns "NO" or "HANDOFF")**

  1.  **SOURCE INDEPENDENCE CHECK (Gatekeeper Test)**
      *   **Question:** Is there evidence of ≥2 **truly independent sources of evaluation** (not just outlets)?
      *   *Sufficient evidence:* Different datasets/methods in the paper itself, OR credible dissent (see Step 2), OR coverage explicitly citing distinct expert analyses (not just rehashing the press release), OR known rival labs/groups involved. *Lacking:* All coverage traces cleanly to one press release/dataset/lab.
      *   *Can't obtain?* Assume dependence (proceed cautiously to Step 2).
      *   **Outcome:**
          *   NO (Single Source): → **KILL STORY** (High risk of "Apparent Independence" herding). *Rationale: No new information is added by covering it; amplification risk dominates.*
          *   YES (Multiple Independent Sources): → Proceed to Step 2.
          *   UNCERTAIN: → Proceed to Step 2.

  2.  **CREDIBLE DISSENT / METHOD ALARM CHECK**
      *   **Question:** Is there ≥1 instance of **specific, methodological criticism** from someone with *demonstrable access* to the preprint/data/methods? (e.g., preprint comment, expert quoted critiquing methods, known flaw in technique).
      *   *Sufficient evidence:* Direct critique focusing on stats, methods, data integrity, or fundamental plausibility. *Not sufficient:* General skepticism, "more work needed," or criticism from outsiders without data access.
      *   *Can't obtain?* Scan abstracts of critical coverage (if any) for substance; if none, proceed.
      *   **Outcome:**
          *   YES (Credible Dissent): → **KILL STORY** (High risk of cascade/reputational herding ignoring flaws). *Rationale: Dissent signals the "crowd" may be suppressing crucial info.*
          *   NO: → Proceed to Step 3.

  3.  **METHODOLOGY SANITY CHECK (Internal Scrutiny)**
      *   **Question:** Does the study pass a **basic plausibility/method threshold** *despite* passing Steps 1 & 2? (Focus: Sample size, controls, confounders, statistical sanity, pre-registration).
      *   *Sufficient evidence:* N > 50 (psych/social), controls present, stats seem appropriate (p-values <0.05 + CI reported), no glaring confounders. *Alarms:* Tiny N, p-hacking smells, extreme claims, obvious missing controls.
      *   *Can't obtain?* (Reporter hasn't read methods): → **HANDOFF to Editor** (Values decision: News value vs. risk of being wrong alone).
      *   **Outcome:**
          *   FAIL (Major Alarm): → **KILL STORY** (World evidence too weak).
          *   PASS / MINOR CONCERNS: → Proceed to Step 4 (News Value).
      *   *Technical Note:* Relies on the uncontested principle that weak methods drastically increase false positive rates.

  4.  **NEWS VALUE vs. RISK ASSESSMENT (Editorial Handoff)**
      *   **Question:** Does the **news value** (novelty, importance, audience relevance) *outweigh* the **residual risk** (minor method concerns, low coverage *might* indicate issues) and the **cost of omission** (will we regret missing this if it's real?)?
      *   *Factors:* Our past coverage (amplify cautiously!), uniqueness of finding, public impact, competitor silence (is it meaningful caution or oversight?).
      *   **Outcome:** → **HANDOFF to Section Editor.** (Values judgment beyond evidence filtering).

  ---

  ### **Key Features & Defense**
  *   **Order:** Source Independence first catches the most common flaw (Apparent Independence Herding). Dissent next catches cascades/reputational herding suppressing truth. Internal Method check prevents amplifying weak evidence even if independent. News Value last.
  *   **Single Must-Keep Test:** **SOURCE INDEPENDENCE CHECK.** It's the strongest filter against amplifying phantom signals created by PR/distribution artifacts.
  *   **Your Informal Rules: Corrections:**
      *   **Count Distinct Upstream Sources:** **KEEP.** Core of Step 1.
      *   **Defector Rule:** **KEEP, BUT REFINE.** Step 2 requires *specific methodological* dissent from *data-access* individuals. Avoids general naysayers.
      *   **Silence as Ambiguous:** **MODIFY.** Silence *after passing Step 1 (Independence)* might be ambiguous. Silence *failing Step 1 (Single Source)* is a strong negative signal (herding likely). Silence *with known dissent (Step 2)* is a negative signal.
      *   **Scrutinize Our Past Coverage:** **KEEP.** Integrated into Step 4's risk assessment ("amplify cautiously").
  *   **What It Cannot Do:**
      *   Guarantee a finding is true.
      *   Detect sophisticated fraud or deeply hidden methodological flaws.
      *   Fully overcome publication bias in the underlying literature.
      *   Replace deep subject-matter expertise.
      *   Make the final news value judgment (that's Step 4).
      *   Work reliably on embargoed studies *before* the lift (limited info).

  ---

  ### **Hypotheticals Verdicts (Using Procedure)**

  1.  **Psychology Preprint (Counterintuitive Habit):**
      *   Step 1: **NO (Single Source)** - All traceable to one press release. → **KILL STORY.** *Rationale: Pure "Apparent Independence" herding. Reporter's conviction is irrelevant here; no independent evaluation exists.*

  2.  **Geophysics (Ocean Heat):**
      *   Step 1: **YES** - 3 groups, different methods/data → Independent sources.
      *   Step 2: **NO** - No credible dissent mentioned.
      *   Step 3: **PASS** (Assuming standard methods for field).
      *   Step 4: **HANDOFF to Editor.** *Rationale: Passes evidence checks. News value (important topic, independent convergence) likely high despite specialist-only coverage. Cost of omission potentially high. Editor weighs resource allocation vs. value of adding our voice.*

  3.  **Replication Failure (Our Past Coverage):**
      *   Step 1: **UNCERTAIN** - Single lab preprint, one newsletter. Not clearly independent sources *of evaluation*. → Proceed to Step 2.
      *   Step 2: **NO** - No credible dissent *against the replication* mentioned. (Silence from original authors? Needs check). → Assume NO dissent for now.
      *   Step 3: **PASS?/HANDOFF** - *Crucially depends on replication methodology.* Did they use original materials? Adequate power? If reporter confirms solid methods → PASS. If unclear/major flaws → KILL. If reporter *can't* confirm quickly → **HANDOFF to Editor immediately** (Time crunch + our stake). *Rationale: High news value FOR US due to past coverage (correction duty) but high risk if replication is flawed. If methods pass Step 3 → **HANDOFF to Editor** with strong argument FOR running: News value/correction duty very high; residual risk managed by methodology pass; cost of omission (ignoring our own potential error) high. Competitor silence is likely reputational herding (avoiding "negative" story) not evidence against the replication's validity.*

  ---

  **Commitment:** This procedure prioritizes avoiding **amplifying false signals caused by herding** over catching every possible story. It forces explicit consideration of source independence and dissent *before* volume or intuition. It will kill popular stories (Hypo 1) and force uncomfortable handoffs on corrections (Hypo 3). The core defense is that **the crowd's behavior is only informative if its components are independent and dissent isn't suppressed** – this filter operationalizes that. Present it to your editor as a **risk mitigation tool**, not a truth oracle.
