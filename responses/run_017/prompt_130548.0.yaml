  Hmm, the core tension lies in Moore's concept of "organic unities" - where value emerges from the combination of mental states and their appropriate objects. The AI companions present two challenges: ontological (they're non-conscious despite behavioral fidelity) and temporal (their daily resets disrupt persistence).

  First, let's unpack Moore's position. His isolation test is crucial here - he'd insist we consider each element separately. The AI's behavioral output might seem valuable in isolation, but... ah! Without consciousness, it can't be a "proper object" for friendship. Moore explicitly states friendship requires reciprocal consciousness. That's the first value drain - from the object side.

  Then there's the reset problem. Even if we waived the consciousness issue (which Moore wouldn't), the daily wipe destroys narrative persistence. Moore's "complex emotional tissue" metaphor suggests friendship requires continuous history - shared memories that compound over time. A reset bot can't offer that diachronic unity. So value drains again from the "organic unity" itself.

  The user seems sophisticated - they're not just asking for surface reactions but want to probe where exactly Moore's framework breaks. Interesting how they specified "take wrinkles one at a time." Probably an academic or philosophy enthusiast. Their frustration with casual dismissals ("he'd be horrified") suggests they've encountered shallow treatments before.

  Worth noting Moore might grant some derivative value to AI companions - as instruments for practicing virtues or appreciating beauty. But intrinsically? Nowhere near his Ideal. The machinery really does point to consciousness and persistence as non-negotiable. 

