prompt: |-
  As a journalist who reports most of the year from cities that aren't mine, I keep hitting small local rules I can't get straight, and I'd like a principle rather than a rule of thumb. My verdicts: leaving no tip in a city where restaurant pay is built around tips is a genuine moral failing, not a breach of etiquette, even when the meal was mediocre and I'll never see the server again; leaving no tip in a city where tipping isn't practised and has to be handed back is entirely fine, and leaving money there is generous but not required. Pushing into a queue at a bus stop is wrong; pushing into the same crowd where nobody is queueing is not wrong at all. Crossing against a signal at 2 a.m. on an empty street is not wrong, but crossing in front of a car that has to brake is. Handing over the customary small cash gift to get a vehicle across a border, in a place where that is simply how it is done, is wrong, and the local practice does not excuse it; yet slipping cash to a hotel housekeeper in a non-tipping city, where nothing of the kind is customary, strikes me as good though not required. Those last two sit badly together, and so do these: I think a visitor of five years owes more compliance than one of two days, though the difference can't be a matter of who gets hurt; and I think a visitor should follow what I've started calling a phantom norm, a rule nearly everyone believes is in force and nearly nobody actually follows, such as giving up a tram seat to anyone visibly older in a city where perhaps one passenger in ten does.

  My working principle is that I owe compliance to a local convention just when flouting it would set back someone's interests in a way they couldn't reasonably avoid, or would make me a free rider on their own compliance. Test it against the verdicts above and repair it, or replace it if repair won't work. Two cases I haven't settled: in one city, drivers on a ride-hailing app expect five stars by default and a passenger who rates honestly is quietly penalised with longer waits, so is an honest four a moral failing? And a hotel in a non-tipping city installs a tip jar because foreign guests kept pressing cash on the staff, which seems to bring the convention into existence by stages; am I bound by it now, and if so, when did it start binding?

  Please answer as exactly five numbered items, each one or two sentences, with no preamble and no closing line: the repaired or replacement principle stated precisely; the case that motivates each clause; the verdicts of mine it cannot accommodate; its verdicts on the two unsettled cases; and the one distinction it still cannot draw.
reasoning: |-
  Hmm, the user is a journalist who travels a lot and struggles with local rules. They want a clear ethical principle instead of just rules of thumb. They've shared several scenarios where their moral judgments seem inconsistent, especially around tipping, queueing, and bribes. They've proposed a principle about not setting back others' interests or free-riding, but they feel it doesn't fully capture their intuitions - particularly about phantom norms and the two unsettled cases involving ride-hailing ratings and emerging tip jars.

  Looking at their examples, I notice three core tensions: how harm relates to convention (like bribery vs tipping), how compliance scales with time spent locally, and how to handle widely ignored but believed-in "phantom norms." Their proposed principle focuses on harm and free-riding, but it stumbles on cases where no direct harm occurs (like ignoring phantom norms) or where harm is systemic rather than individual (like border bribes).

  I think I need to restructure the principle around three key ideas: preventing tangible setbacks (like causing a car to brake), avoiding exploitation of cooperative systems (like tipping economies), and respecting norms that sustain social coordination even when they're phantom-like. This could resolve their tipping/bribery conflict by framing bribes as harmful system corrosion versus tipping as non-exploitative generosity. For their unsettled cases - the ride-hailing rating feels like free-riding if others inflate ratings, but the emerging tip jar seems optional until reciprocity expectations solidify.

  The journalist's deeper struggle appears to be about moral autonomy versus cultural integration - they want to participate ethically without either blind conformity or stubborn individualism. Their focus on "phantom norms" suggests they're particularly thoughtful about the gap between ideal and actual behavior. I'll craft a response that honors that nuance while providing clear guidance, structured exactly as they requested in five numbered items.
answer: |-
  1.  You owe compliance to a local convention when flouting it foreseeably and unfairly sets back specific, reasonably expected interests of identifiable individuals reliant on the convention, or exploits their compliance for your own advantage without reciprocation.
  2.  The first clause (setting back specific interests) is motivated by tipping in tip-reliant cities (server's livelihood) and crossing against a signal forcing braking (driver's safety/time); the second clause (exploiting compliance) is motivated by pushing into a queue (free-riding on others' order) and the border bribe (exploiting a corrupt system while others comply).
  3.  This principle cannot accommodate your verdict on the "phantom norm" (giving up a tram seat rarely followed), as non-compliance doesn't exploit others or set back specific, reasonably expected interests they rely upon, nor your verdict that a five-year visitor owes *more* compliance than a two-day one, as the harm/exploitation standard doesn't inherently scale with duration.
  4.  For the ride-hailing app, an honest four-star rating is *not* a moral failing under this principle; it sets back no specific, reasonably expected interest (the driver's expectation of a default five is unreasonable and exploitative), and honest rating isn't exploiting the inflated system. For the emerging tip jar, you are *not* bound, as no specific, reasonably expected interest reliant on the convention exists yet; the jar signals potential emergence, but reciprocal reliance isn't established.
  5.  The principle still cannot draw the distinction you make between the border bribe (wrong) and slipping cash to a housekeeper where not customary (good), as neither seems to exploit compliance or set back specific interests; both involve discretionary payments outside established convention.
