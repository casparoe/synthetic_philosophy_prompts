prompt: |-
  I'm a software engineer on a long work assignment in a city whose everyday norms differ sharply from the ones I grew up with: queues here are loose and pushy, tipping is not expected, and people cross wherever they like rather than at corners. A colleague ended an argument about whether I should adapt by saying these conventions are exactly like the rule of the road. Driving on the right is arbitrary in content, since driving on the left would coordinate just as well, but once everyone expects right, you have a genuine obligation to drive right, and visitors have it too. So, he concluded, I owe it to locals to queue, tip, and cross as they do for as long as I'm here.

  I would like an audit of that analogy rather than a verdict on the underlying question. Please lay out the mapping explicitly, as a correspondence table: arbitrary content, mutual expectations, the payoff from coordinating, the harm from deviating, the role of law and enforcement, the situation of the visitor. Then tell me which of those features tipping, queueing, and jaywalking actually share with the road-rule case and which they lack. My own sense is that the three are different kinds of thing: queueing looks like genuine coordination, tipping looks like a transfer to a particular worker rather than an equilibrium I join, and crossing the street looks like a rule about risk that happens to be partly codified in law.

  Two complications I want handled. First, apply what I think of as the invisible-deviation test: if I skip the tip, melt into a loose queue, or cross against the light at three in the morning on an empty street where no local sees me and no one is affected, does the analogy still generate an obligation? If the road-rule case survives that test and the others don't, that seems to matter a great deal. Second, take the visitor's excuse seriously and tell me whether it is special pleading or whether it exposes a real gap: I did not help set the local equilibrium, my single deviation changes nothing, and I could endorse a rule permitting discreet opt-out by outsiders without the convention collapsing.

  Does my colleague's conclusion survive once the disanalogies are on the table? Does it survive for all three norms or only for some, and is there a better analogy for the ones the road-rule picture does not fit? I have no philosophy training, so please define any term of art you rely on.
reasoning: |-
  Okay, let me tackle this user's query step by step. The user is a software engineer working abroad, struggling with local norms like queueing, tipping, and jaywalking. Their colleague used a road-rule analogy to argue they should adapt, comparing these social conventions to traffic rules. The user wants an audit of this analogy, not a verdict on whether to adapt.

  First, I need to unpack the road-rule analogy fully. The core idea is that traffic rules are arbitrary but necessary for coordination. Once established, everyone has an obligation to follow them, including visitors. The user wants this mapped explicitly across several dimensions: arbitrariness, mutual expectations, coordination payoff, harm from deviation, law/enforcement, and visitor status.

  The user suspects queueing, tipping, and jaywalking differ from road rules. Queueing seems like pure coordination, tipping like a transfer, and jaywalking like a risk-management rule. They also raise two key complications: the "invisible deviation" test (does obligation hold when no one sees you?) and the "visitor's excuse" (should outsiders be bound if their deviation doesn't harm the system?).

  I'll analyze each norm against the road-rule framework. For queueing, the coordination payoff is high but harm from isolated deviations is low. Tipping's economic function differs significantly - it's wage supplementation rather than coordination. Jaywalking blends safety coordination with legal codification but allows situational exceptions.

  The invisible deviation test is crucial. Road rules create obligation even when unobserved because risks remain (e.g., unseen drivers). Queueing fails this test when truly isolated. Tipping obligations vanish without observers. Jaywalking depends entirely on actual risk presence.

  The visitor's excuse has merit for queueing and tipping where single deviations don't undermine systems, but less so for road rules where predictability is paramount. Jaywalking sits in between - safety depends on predictability, but empty streets allow exceptions.

  The colleague's conclusion survives best for queueing but weakly. Road rules aren't the ideal analogy for any except possibly jaywalking where safety coordination matters. Better analogies exist: queueing resembles crowd flow protocols, tipping is a social contract for service workers, jaywalking is risk-based rule adjustment.

  Ultimately, the audit shows the road-rule analogy oversimplifies. The user's instincts were correct - these norms differ fundamentally in structure and obligation. The colleague's argument holds only partially, mainly for predictability-dependent behaviors where invisible deviations still carry risk.
answer: |-
  Here's an audit of the road-rule analogy, structured as requested, examining queueing, tipping, and jaywalking norms against the key features of the driving-on-the-right convention.

  ### Correspondence Table: Road-Rule Analogy Features

  | Feature                   | Driving Convention (Road Rule)                                                                                               |
  | :------------------------ | :--------------------------------------------------------------------------------------------------------------------------- |
  | **1. Arbitrary Content**  | Yes. Driving on left or right is functionally equivalent; the *choice* is arbitrary, but the *need for one rule* is not.     |
  | **2. Mutual Expectations**| Core. Everyone expects everyone else to drive on the agreed side; predictability is the foundation of safety.                |
  | **3. Payoff from Coordinating** | High & Universal: Avoids catastrophic collisions, enables efficient flow. Everyone benefits equally from adherence.     |
  | **4. Harm from Deviating** | High, Direct & Diffuse: Direct harm (crashes, injury, death) to deviator *and* others. Harm scales with deviation frequency. |
  | **5. Law & Enforcement**  | Formal: Codified in law, enforced by police/courts. Provides clear authority and punishment mechanism.                      |
  | **6. Situation of Visitor**| Strong Obligation: Visitor *must* drive on the local side immediately. Ignorance is no excuse; deviation is dangerous.      |
  | **7. Invisible Deviation Test** | Fails: Obligation remains even at 3 am on an empty road. Risk exists (unseen car, pedestrian), predictability matters. |
  | **8. Visitor's Excuse**   | Weak: Single deviation *can* cause harm. Predictability is paramount. Opt-out rules would undermine the convention's core purpose. |

  ### Applying the Features to Queueing, Tipping, and Jaywalking

  1.  **Arbitrary Content:**
      *   **Queueing:** Partially Arbitrary. While *some* orderly system (line, number, etc.) is needed for fairness/efficiency, the *specific form* (strict line vs. loose cluster) can be arbitrary.
      *   **Tipping:** **Not Arbitrary.** Its core purpose (wage supplementation for service workers) is deeply tied to specific economic structures and labor practices. Its existence/non-existence isn't arbitrary like a traffic side choice.
      *   **Jaywalking:** Partially Arbitrary. The *specific rules* (cross only at corners vs. anywhere safe) can be arbitrary, but the underlying need for *some* rules to manage pedestrian/vehicle interaction and risk is not.

  2.  **Mutual Expectations:**
      *   **Queueing:** **Yes.** Locals expect others to join/respect the local queue style (even if loose/pushy). Predictability about order matters.
      *   **Tipping:** **Weak/Mixed.** Expectations exist *if* tipping is normative, but workers might not *expect* it from obvious foreigners. Customers expect peers to tip. Less universal predictability than traffic/queues.
      *   **Jaywalking:** **Yes (in context).** Locals expect others to cross in the common manner (corners or mid-block) given traffic patterns. Predictability about pedestrian movement matters for safety.

  3.  **Payoff from Coordinating:**
      *   **Queueing:** **High & Shared (but lower stakes).** Fairness, reduced conflict, efficient service for *everyone* in the queue environment. Everyone benefits.
      *   **Tipping:** **Mixed/Asymmetric.** Workers benefit directly. Customers benefit indirectly through better service (arguable) or social approval. The payoff is less about *coordination* (like avoiding collisions) and more about a *transfer* sustaining a wage model. Not all benefit equally.
      *   **Jaywalking:** **High & Shared (Safety Focus).** Avoiding accidents, smoother traffic flow, efficient pedestrian movement. Everyone (pedestrians, drivers) benefits from predictability.

  4.  **Harm from Deviating:**
      *   **Queueing:** **Low & Diffuse.** Causes minor friction, perceived unfairness, slows service *slightly*. Harm is primarily social/annoyance, not physical. Scales mildly with frequency.
      *   **Tipping:** **Targeted & Economic.** Direct harm to the *specific worker* who loses expected income. Potential reputational harm to deviator. Harm is primarily individual and economic/social.
      *   **Jaywalking:** **Potentially High & Direct.** Risk of accident/injury to deviator *and* drivers/other pedestrians. Harm scales significantly with risk level (traffic density/speed) and frequency.

  5.  **Law & Enforcement:**
      *   **Queueing:** **Informal.** Enforced by social pressure (glaring, comments) or venue staff. No legal code.
      *   **Tipping:** **Informal.** Purely social/cultural norm. No legal requirement to tip (in most places), enforced by social pressure/guilt.
      *   **Jaywalking:** **Formal/Informal Mix.** Often codified in law (fines), but enforcement is frequently lax or situational. Also enforced by social pressure ("Don't cross here!").

  6.  **Situation of Visitor:**
      *   **Queueing:** **Moderate Obligation.** Expected to join the local style to avoid friction. Easier to learn/observe than driving.
      *   **Tipping:** **Contingent Obligation.** Obligation exists *if* tipping is normative *and* the worker relies on it. But knowledge gaps/foreigner status can be mitigating factors.
      *   **Jaywalking:** **Strong Obligation (Safety), Situational (Formality).** Strong obligation to prioritize safety (predictability). Obligation to follow *formal* jaywalking laws exists but may feel weaker if locals habitually break them safely.

  7.  **Invisible Deviation Test (3 am, no one affected):**
      *   **Queueing:** **Fails.** No queue exists at 3 am alone. No harm, no expectation, no obligation. The coordination need vanishes without others.
      *   **Tipping:** **Fails.** If no one sees/knows (e.g., paying cash, no social connection), and the worker isn't identifiable or present later, the *direct harm* to the worker and *social enforcement* vanish. The obligation *as a coordination norm* dissolves.
      *   **Jaywalking:** **Mixed.**
          *   *Safety Aspect:* If truly **zero risk** (visibly empty street in all directions), the *safety coordination* need vanishes. No harm, no obligation based purely on coordination. However, judging "zero risk" is error-prone.
          *   *Legal Aspect:* The *legal* obligation might technically remain, but its moral force weakens significantly without risk or enforcement possibility.

  8.  **Visitor's Excuse (Didn't set it, single deviation harmless, opt-out rule possible?):**
      *   **Queueing:** **Strong.** A single discreet deviation in a large, loose queue likely causes minimal disruption. A universal "outsider opt-out" for minor norms like queue style wouldn't collapse the convention. Social friction is the main cost.
      *   **Tipping:** **Moderate.** A single skipped tip harms one worker, but the system persists. Workers might accept cultural ignorance as an excuse. A universal "outsiders don't tip" rule *could* work without collapse, though it might seem unfair to workers/other customers.
      *   **Jaywalking:** **Weak (Safety), Moderate (Formality).**
          *   *Safety:* While a *single* safe deviation might seem harmless, unpredictability is inherently risky. A universal "outsiders can ignore local crossing norms" rule would undermine the safety coordination, especially if widely known/applied.
          *   *Formality:* Excuse is stronger against *purely legal* jaywalking rules when broken safely like locals do. The *law's* legitimacy for outsiders is weaker than the *safety need*.

  ### Does the Conclusion Survive? For Which Norms?

  1.  **Conclusion:** "Visitors have a genuine obligation to [queue/tip/cross] as locals do."
  2.  **Audit Result:**
      *   **Queueing:** The analogy **partially holds**, but the obligation is **weaker** than for road rules. The stakes (harm) are lower, the invisible deviation test fails, and the visitor's excuse is strong. The obligation is primarily about **avoiding social friction and showing respect**, not a deep coordination necessity like driving. *Conclusion survives weakly, based on politeness more than strict coordination logic.*
      *   **Tipping:** The analogy **fails significantly**. Tipping isn't arbitrary coordination; it's a socio-economic transfer. Mutual expectations are less universal, harm is targeted, the invisible deviation test fails, and the visitor's excuse is reasonable. The obligation stems from **preventing direct harm to a worker within a local economic practice**, not joining a coordination equilibrium. *Conclusion does not survive the analogy; the rationale is different.*
      *   **Jaywalking:** The analogy holds **best for the safety coordination aspect**, especially in risky conditions. The obligation to prioritize safety through predictability is strong. However, the analogy weakens for *purely legal* jaywalking rules broken safely by locals, and the invisible deviation test shows the obligation *depends on actual risk*. The visitor's excuse against safety coordination is weak. *Conclusion survives strongly for safety, weakly for mere legal formality without risk.*

  ### Better Analogies

  *   **Queueing:** Think of it like **crowd flow protocols** at an event or **informal turn-taking systems** (e.g., talking in a group). The obligation is to follow the local "script" for smooth, fair interaction, minimizing chaos and perceived rudeness.
  *   **Tipping:** This resembles a **social contract for service wages** or a **customary surcharge**. The obligation (where it exists) is to participate in the local system that determines worker compensation, akin to paying a culturally expected but non-mandatory service fee. It's an economic norm, not a coordination game.
  *   **Jaywalking:** This is closest to **risk-based rules with a coordination layer**, like informal rules for merging in heavy traffic or navigating a crowded sidewalk. The core obligation is mutual safety through predictability, sometimes codified into law. The "rule" adapts to context (risk level), unlike the fixed road-driving side.

  ### Final Summary

  Your colleague's road-rule analogy **oversimplifies the diversity of social norms**. It works best for jaywalking's safety aspect and partially for queueing's order-maintaining aspect, but **fails fundamentally for tipping**, which operates on a different logic (economic transfer, not pure coordination). The "invisible deviation" and "visitor's excuse" tests reveal critical differences in the *strength* and *basis* of the obligation across these norms. While adapting to local customs is generally prudent and respectful, the *reason* and *moral force* behind it varies significantly between queueing, tipping, and jaywalking, and none map perfectly onto the strict coordination logic of the road rule. Your instincts about them being different kinds of things are correct.
