  | **Overtaking/dominance (finite windows)**                            | A,A,B,C,C,A,C,*                | 🟢             | Ranks by finite prefixes. Q4C, Q5B, Q6A. Q3B (sparse negligible).                                   |
  | **Density/average view**                                             | A,A,B,B,C,C,C,A                | 🟢             | Q3B (density zero), Q5C, Q6C (averages converge). Q8A (threshold).                                   |
