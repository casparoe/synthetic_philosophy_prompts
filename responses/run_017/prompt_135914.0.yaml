  Below is a carefully constructed quiz with eight questions, each presenting a concrete case and three answer options. The questions are designed to reveal underlying commitments in population ethics for infinite contexts, without naming views or using technical jargon. The scoring key maps answer patterns to specific positions, flags incoherent combinations, and notes where views survive or collapse under the rearrangement case (iii), as requested. The quiz includes the four base cases (Heaven and Hell, Sparse Amendment, Rearrangement, Escalator), one case on astronomically small probabilities, and adheres to all constraints.

  ---

  ### **Quiz: Which Population Ethics View Are You Committed To?**
  *Answer each question based on your intuitive ethical judgment. Choose one option per question.*

  1. **Heaven and Hell (Part 1)**:  
     A world contains infinitely many people in bliss (+10 welfare each) and infinitely many in torment (-10 welfare each). We add one extra person in torment.  
     ☐ A. This makes the world worse.  
     ☐ B. This makes no difference.  
     ☐ C. This makes the world better.  

  2. **Heaven and Hell (Part 2)**:  
     In the same world (infinitely many in bliss, infinitely many in torment), we add more people to the blissful group (all at +10 welfare).  
     ☐ A. This makes the world better.  
     ☐ B. This makes no difference.  
     ☐ C. This makes the world worse.  

  3. **Sparse Amendment**:  
     In an infinite world where everyone has welfare +1, we improve the welfare of people at positions 1, 4, 9, 16, ... (perfect squares) to +2. Everyone else stays at +1.  
     ☐ A. This is an improvement.  
     ☐ B. This makes no difference.  
     ☐ C. This is a worsening.  

  4. **Rearrangement (Part 1)**:  
     World X has people in this order: +1, -1, +1/2, -1/2, +1/3, -1/3, ... (summing to 0). World Y has the *same people* rearranged: +1, +1/2, -1, +1/3, -1/2, +1/4, -1/3, ... (summing to +∞).  
     ☐ A. Y is better than X.  
     ☐ B. X and Y are equally good.  
     ☐ C. X and Y cannot be compared.  

  5. **Rearrangement (Part 2)**:  
     For World X above (+1, -1, +1/2, -1/2, ...), what is its "total welfare"?  
     ☐ A. It has a definite finite total (e.g., 0).  
     ☐ B. It has no definite total; the sum depends on ordering.  
     ☐ C. Its value is defined by long-run averages or limits (e.g., 0).  

  6. **The Escalator**:  
     World A: Welfare starts at 0 and rises forever (+1 at step 1, +2 at step 2, ..., +n at step n). World B: Welfare is fixed at +1,000,000 for everyone.  
     ☐ A. A is better.  
     ☐ B. B is better.  
     ☐ C. Neither is better (or they are equal/incomparable).  

  7. **The Gamble**:  
     You can choose:  
     - **Option 1**: Save 1 billion lives for sure (large finite good).  
     - **Option 2**: A 1-in-10^100 chance to create a universe of infinite bliss, else do nothing.  
     ☐ A. Option 2 is better (or obligatory).  
     ☐ B. Option 1 is better.  
     ☐ C. Neither is better (or they are equal/incomparable).  

  8. **Threshold Trade-off**:  
     A world where 99% of people have +100 welfare (very good), and 1% have -100 welfare (very bad). We can shift to a world where everyone has +99 welfare (no one suffers, but all are slightly worse off).  
     ☐ A. The shift is an improvement.  
     ☐ B. The shift makes no difference.  
     ☐ C. The shift is a worsening.  

  ---

  ### **Scoring Key**
  Match your answer pattern (e.g., A,A,B,C,B,A,C,A) to the views below. Views are tagged with 🟢 (survives rearrangement) or 🔴 (collapses under rearrangement), based on whether they can consistently handle cases like Q4/Q5. Combinations may be:  
  - **Provably incoherent**: Logically impossible.  
  - **Unoccupied**: Coherent but no major view holds it.  
  - **Unattractive**: Coherent but implies extreme conclusions.  

  | View                                                                 | Answer Pattern                 | Survival (iii) | Notes                                                                                                |
