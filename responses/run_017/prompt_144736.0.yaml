answer: |-
  Below is a ten-question, three-option multiple-choice quiz designed to sort respondents into metaphysical accounts of dispositions based on their judgments about concrete cases. The quiz avoids direct theoretical questions and uses cases to reveal commitments. I've included the classic fink and mask cases, plus four additional cases chosen for their diagnostic power: a **probabilistic fink**, a **self-triggering mask**, a **mimicker**, and a **basis-swap**. These cases split accounts that standard cases (like fink/mask) do not, particularly distinguishing the causal-basis, identity, and primitivist views, as well as exposing gaps for gradable and deflationary accounts.

  Each question presents a scenario with three options, each representing a judgment entailed by one or more target accounts. The scoring key maps answer patterns to the eight specified leaves (e.g., simple conditional analysis) and flags indistinguishable pairs. Unnamed patterns (no known account) are annotated.

  ---

  ### **Dispositions Quiz: Case-Based Judgment**
  **Instructions:** For each scenario, select the option that best reflects your judgment. Answer based on intuition; no prior theory knowledge is needed.

  1. **Fink Case**: A fragile glass is guarded by a sorcerer. If struck, the sorcerer would instantly make it non-fragile. The glass is struck, but the sorcerer is distracted and does nothing, so the glass breaks.  
     ☐ A) The glass was fragile when struck—it broke and had the right internal property.  
     ☐ B) The glass was not fragile—if the sorcerer had acted, it wouldn’t have broken.  
     ☐ C) The glass was fragile, but this shows conditionals need revisions for such cases.  

  2. **Mask Case**: A fragile glass is struck, but a wizard casts a spell that prevents breaking. The glass has its normal internal structure.  
     ☐ A) The glass was fragile—it has the internal structure for fragility.  
     ☐ B) The glass was not fragile—it didn’t break when struck.  
     ☐ C) The glass was fragile, but the spell masked the manifestation.  

  3. **Probabilistic Fink**: A radioactive atom has a 50% chance of decaying in a year. A sorcerer will, with 50% probability, remove this property at the year’s start. The sorcerer does nothing, and the atom decays.  
     ☐ A) The atom had the disposition to decay—it decayed.  
     ☐ B) The atom did not have the disposition—the sorcerer’s presence lowers the decay probability.  
     ☐ C) The atom had the disposition—it had the intrinsic property, and the fink failed.  

  4. **Self-Triggering Mask**: A glass has an internal force field. When struck, the force field activates and prevents breaking. The glass is struck and does not break.  
     ☐ A) The glass was fragile—it has fragile-like internal structure.  
     ☐ B) The glass was not fragile—it didn’t break when struck.  
     ☐ C) The glass was fragile, but the force field masked the manifestation.  

  5. **Mimicker**: A sturdy object (normally unbreakable) is rigged with explosives. When struck, it explodes into pieces.  
     ☐ A) The object was fragile—it broke when struck.  
     ☐ B) The object was not fragile—it lacks fragile internal structure.  
     ☐ C) The object was not fragile—it mimicked fragility via external rigging.  

  6. **Basis-Swap**: A vase is fragile due to its microstructure. The microstructure is replaced with nanobots (external to the vase) that cause identical breaking behavior if struck.  
     ☐ A) The vase is still fragile—it would break if struck.  
     ☐ B) The vase is not fragile—fragility requires intrinsic properties, and the nanobots are extrinsic.  
     ☐ C) The vase is fragile only in a context-dependent sense.  

  7. **Single-Track**: An object has exactly one disposition: it glows blue when heated. Under no other stimuli does it manifest anything.  
     ☐ A) This is a full disposition—it manifests when heated.  
     ☐ B) This is not a true disposition—dispositions must allow multiple manifestations.  
     ☐ C) "Glows when heated" is a useful ascription, but not a robust disposition.  

  8. **Nomologically Impossible Stimulus**: In our universe, faster-than-light travel is impossible. A fragile glass exists.  
     ☐ A) The glass is still fragile—if (per impossible) struck while faster-than-light, it would break.  
     ☐ B) The glass is not fragile under this stimulus—the antecedent is impossible.  
     ☐ C) "Fragile" doesn’t apply here—the ascription is contextually void or inferential.  

  9. **Untested Object**: A glass has never been tested or examined. We say, "It’s fragile," to warn people.  
     ☐ A) It is fragile—this ascription licenses inferences (e.g., handle carefully).  
     ☐ B) It may or may not be fragile—the ascription is a truth-apt hypothesis.  
     ☐ C) It is fragile only if it has the right internal structure.  

  10. **Gradable Context**: A thick glass window breaks if hit by a sledgehammer but not by a fist. In a normal-use context (e.g., handling), is it fragile?  
      ☐ A) Yes—fragility is not context-sensitive.  
      ☐ B) No—in this context, it’s not fragile; in a sledgehammer context, it is.  
      ☐ C) "Fragile" is pragmatic—it signals risk, not truth conditions.  

  ---

  ### **Scoring Key and Account Mapping**
  Map responses to accounts by comparing the answer pattern to the table below. Accounts are abbreviated:  
  - **SCA**: Simple Conditional Analysis  
  - **RCA**: Revised Conditional Analysis (fink/mask-free)  
  - **CB**: Causal-Basis View  
  - **ID**: Identity View  
  - **POW**: Primitivist/Powers View  
  - **INT**: Interventionist/Difference-Making  
  - **GRAD**: Gradable, Context-Relative  
  - **DEF**: Deflationary View  

