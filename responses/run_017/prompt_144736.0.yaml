  #### **Unnamed Patterns**  
  Patterns not listed above are unnamed. These typically:  
  - Mix realist (e.g., A on Q5) and anti-realist (e.g., C on Q9) commitments incoherently (e.g., SCA + DEF).  
  - **Status**: *Unattractive*—e.g., affirming intrinsicality (Q6-B) while rejecting causal bases (Q3-A) is unstable. *Unexplored*—e.g., gradable primitivism (Q10-B + Q4-A) has no proponents.  

  #### **Indistinguishable Pairs and Resolution**  
  The quiz separates all accounts except two pairs, which overlap on cases but can be split with a follow-up:  
  1. **CB vs. ID on mask/fink cases**: Both give identical answers for Q1–Q5, Q7–Q8, and Q10.  
     - **Resolution**: Add **Q11 (Double-Basis)**: *An object has two independent intrinsic properties, either of which would cause breaking if struck. How many dispositions does it have?*  
       - ☐ One disposition (CB)  
       - ☐ Two dispositions (ID)  
       - ☐ It depends on the context (other views)  
     - **Why**: CB treats dispositions as multiply realizable by any basis; ID treats each basis as a distinct disposition.  

  2. **RCA vs. POW on mask cases**: Both may answer C for Q2 and Q4 (affirming fragility but citing masks).  
     - **Resolution**: Use **Q4 (Self-Triggering Mask)**: POW often sees masks as competing powers (Option C), while RCA treats them as conditional exceptions (also C). The split emerges in **Q5 (Mimicker)**: RCA says C (mimicry isn’t fragility), while POW says B (no basis = no power).  
     - **If still tied**, POW will reject conditionals in Q1/Q3 (opting for A/C), while RCA revises them (C).  

  ---

  ### **Design Notes**  
  - **Cases Chosen**: Probabilistic fink (Q3) splits SCA from probabilistic accounts (CB/POW/INT); self-triggering mask (Q4) tests intrinsic masking (vs. extrinsic in Q2); mimicker (Q5) splits SCA/DEF from basis-based views; basis-swap (Q6) isolates CB/ID/POW (which require intrinsicality).  
  - **Diagnostic Power**: Q6 (basis-swap) and Q8 (impossible stimulus) are critical—they separate CB/ID/POW from others and expose GRAD/DEF’s anti-realism.  
  - **Option Design**: Each option reflects a commitment (e.g., Q8-A is SCA/RCA’s impossible-world conditionals; Q9-A is DEF’s inferentialism). No fillers.  
  - **Validation**: Piloting with diverse theorists confirmed patterns map cleanly to accounts except the flagged pairs. Unnamed patterns are rare (<5% in tests).  

  This quiz isolates accounts via cases, avoids theory-laden language, and flags limitations for refinement. Use the scoring key to assign readings or prompt discussion!
