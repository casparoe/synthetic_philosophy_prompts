     - 0-5 min: Introduction and setup. Explain the rules. Hand out the first budget set. (We'll have the budget sets on a slide or on a handout.)
     - 5-20 min: Part 1 - 5 rounds of choices. (Each round: display the budget set, they write their choice on a sheet, collect after each round? Or collect at the end? We can have a choice sheet for each student with 5 rows. We walk around to help.)
