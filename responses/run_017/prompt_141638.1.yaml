     - **Part 4: Same Choices, Different Reasons (15 minutes)**
       - We select two students in advance (without the class knowing) and give them secret instructions. They participate in a new round (or we use the data from the first part but with a twist). We reveal that two students had the same choice history but for different reasons.

          Example: 
            We have a new budget set (or we use one of the existing ones). But we don't need a new round necessarily. We can use the data from part1 and then reveal the secret instructions.

          Secret instructions for two students (chosen before part1?):

