  3. **Debrief (20 minutes)**:
     - Map the activity to the concepts:
       - Part 2 (rationalizing any pattern) shows that without restrictions (like the axioms), we can always rationalize choices by attributing utility to context (menu, prices, etc.) -> menu-laundering. This makes the theory too flexible and less meaningful.
       - Part 3 (violating history) shows that the axioms (like WARP) are the real content of the theory: they are the testable implications. Without them, we don't have a theory of choice that is falsifiable.
       - Part 4 (same choices, different reasons) shows that revealed preference does not tell us about the underlying reasons (preferences, rules, beliefs). The utility function is only an "as-if" construction. It rescues the theory by allowing us to model behavior without knowing the reasons, but it collapses when we try to use utility for welfare analysis (because two people with the same choices might have very different welfare if one is acting on false beliefs or following a rule they don't enjoy).

