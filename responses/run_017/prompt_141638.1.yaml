       We have three goods: A, B, C. Each student has a token budget. In each round, they are given a budget and prices for A, B, C. They choose a bundle (x_A, x_B, x_C) of non-negative integers such that the cost is within the budget. We run 5 rounds.

       Example budget sets (vary prices and/or income):

          Round 1: pA=1, pB=1, pC=1, budget=3 tokens -> they can choose any bundle with at most 3 units (but note: they might choose two of one and one of another, etc.)

          Round 2: pA=2, pB=1, pC=1, budget=4 tokens.

