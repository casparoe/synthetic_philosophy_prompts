          Alternatively, we can have a new round (round 6) with a specific budget set and then reveal the different reasons. We can do:

            Round 6: pA=1, pB=1, pC=1, budget=3.

            We give secret instructions to two students:

              Student X: "Choose the bundle that has the most variety: one of each if possible." -> (1,1,1)
              Student Y: "You are allergic to good C, so avoid it." -> but then they might choose (3,0,0) or (2,1,0) etc. Not necessarily the same.

