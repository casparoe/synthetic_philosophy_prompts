     - **Allergies**: Before the activity, ask students about allergies and adjust the goods accordingly. Have alternative goods available.
     - **Trading between students**: Clearly state that trading is not allowed. The choices are individual and private.
     - **Not caring about snacks**: Use appealing snacks (popular brands) and emphasize that they will get to keep what they choose. Alternatively, if the snacks are not appealing, offer alternative rewards (e.g., extra credit points, but that might be too strong). We can also use non-food items (pens, stickers) if food is an issue.
     - **Someone shouts the axiom**: If a student shouts out the axiom (like WARP) early, acknowledge it and say that we are about to see why it matters. Then continue with the activity. It might actually help to have a student who knows the theory, so they can contribute in the debrief.
     - **Time management**: The activity might run long. Be strict with time. Have a timer. Skip a round if needed.
     - **Complexity of choices**: Some students might find it hard to compute the bundles. We can provide a table of affordable bundles? Or we can do it with two goods? But we want three to have variety. Alternatively, we can do continuous choices? But that might be too abstract. We can stick to discrete and allow only 0,1,2 units per good and design the budget sets so that the affordable bundles are limited and easy to see.

  6. **What the Game Can't Deliver**:
     - The formal proof of the representation theorem (that WARP/GARP implies the existence of a utility function) is too advanced for this activity. We will have to state it without proof.
     - The deep philosophical debate about what utility "really" is won't be resolved. The activity will only expose the tension. We'll have to explicitly discuss the "as-if" interpretation and its limitations for welfare economics.

  Let me now write out the full plan with the details.

  **Final Activity Plan**

  **Title**: The Utility Illusion: Choice, Preference, and Revealed Preference

  **Materials**:
  - Three types of snacks (e.g., A: small bag of chips, B: chocolate bar, C: fruit snack). Check for allergies in advance and have alternatives for common allergens.
  - Tokens: Each student gets a token budget for each round. We can use play money tokens or just record on paper.
  - Handouts:
     - Choice sheet for each student (with 5 or 6 rounds, columns for the bundle chosen).
     - Worksheet for Part 2 (with two choice histories and space to write utility functions).
     - Secret instruction cards for two students (for Part 4).

  **Rules and Payoff**:
  - Students make choices in each round. They will get to keep the snacks they choose at the end of the activity (so real stakes, but small).
  - Tokens are given for each round (they don't carry over). Each round has a token budget and prices. They choose a bundle (x_A, x_B, x_C) of non-negative integers that satisfies the budget constraint: pA*x_A + pB*x_B + pC*x_C <= budget.
  - They are not allowed to trade with others.

  **Timeline**:

  - **0-5 min**: Introduction
    - Explain: "Today we're going to do an activity about how we make choices and what that says about our preferences. You will be making real choices about snacks that you will get to take home. We'll have several rounds with different prices and budgets."

  - **5-20 min**: Part 1 - Choice Experiment (5 rounds)
    - Display each budget set (on a slide or board) for 2 minutes per round. Students record their choices on their choice sheet.
    - Budget sets (with tokens):
        Round 1: pA=1, pB=1, pC=1, budget=3.
        Round 2: pA=2, pB=1, pC=1, budget=4.
        Round 3: pA=1, pB=2, pC=1, budget=4.
        Round 4: pA=1, pB=1, pC=2, budget=4.
        Round 5: pA=3, pB=2, pC=1, budget=6.
    - Collect the choice sheets at the end.

  - **20-35 min**: Part 2 - Rationalizing Choices
    - Pair up students. Give each pair:
        - The first student's own choice history (from rounds 1-5).
        - A pre-cooked history (the one we designed above that follows a rule: buying only the goods at the minimum price in that round, which resulted in the choices: (1,1,1), (0,2,2), (2,0,2), (2,2,0), (0,0,6)).
    - Task: "For each history, write down a utility function that would make these choices utility-maximizing. Be as specific as you can."
    - After 10 minutes, ask a few pairs to share one of their utility functions (especially for the pre-cooked history). Note how they might have incorporated the menu (prices) into the utility.

  - **35-45 min**: Part 3 - The Axiom Bites
    - Present to the whole class a new choice history (on the board) that violates WARP:
          Budget set 1: pA=1, pB=1, budget=2 -> choice: (2,0)
          Budget set 2: pA=1, pB=2, budget=4 -> choice: (0,2)
    - Explain: "This is for two goods (A and B) to keep it simple. Can any pair come up with a utility function that would make these choices maximizing?"
    - Let them try for 3-5 minutes. Then explain the violation: 
          In set1, (0,2) was affordable (cost=2) but not chosen -> so (2,0) is revealed preferred to (0,2).
          In set2, (2,0) is affordable (cost=2<=4) but not chosen -> so (0,2) is revealed preferred to (2,0). Contradiction.
    - Conclude: "This pattern cannot be explained by any utility function that is constant and independent of the menu. The Weak Axiom of Revealed Preference (WARP) is violated."

  - **45-60 min**: Part 4 - Same Choices, Different Reasons
    - Conduct Round 6: pA=1, pB=1, pC=1, budget=3. Everyone chooses a bundle.
    - Meanwhile, before this round, two selected students (chosen discreetly at the start of class) were given secret instructions:
          Student X: "You have a strong preference for variety. In any round, if you can, choose one of each good. In round6, that means choose (1,1,1)."
          Student Y: "You believe that if you choose one of each good, you will get a bonus point (which doesn't actually exist). So in round6, choose (1,1,1)."
    - After collecting the round6 choices, reveal that these two students both chose (1,1,1). Then reveal their secret instructions (read them aloud).
    - Ask the class: 
          - "What utility function would we assign to each student based on their choices in round6? (Probably the same: they both reveal a preference for (1,1,1) over other bundles in that set.) 
          - But are they both maximizing utility? In what sense?
          - And if we want to say who is better off, can we use this utility function?"

  - **60-75 min**: Debrief
    - Connect the dots:
        - Part 2: We saw that we can rationalize any choice pattern by making the utility function depend on the context (menu, prices, etc.). This is menu-laundering. It makes the theory very flexible, but it also makes it less powerful because it can explain anything.
        - Part 3: The violation of WARP shows that there are limits. The axioms of revealed preference are the core of the theory because they are the testable implications. Without them, we don't have a theory that can be falsified.
        - Part 4: The same choice behavior can come from different underlying reasons (preference, rule, belief). The revealed preference approach only gives us an "as-if" utility function. This rescues the theory for predictive purposes (we can model behavior without knowing the reasons) but it collapses when we want to use utility for welfare analysis (because welfare might depend on the true reasons, not just the choices).

    - Discuss: What then does "utility" name in economics? It names a representation of choice behavior, not necessarily a feeling or a mental state. But when we do welfare economics, we often want to use it as a measure of well-being. This is a tension.

  **Handling Problems**:
  - **Allergies**: Have alternative goods (e.g., if someone is allergic to chocolate, have a different snack for them). Ask in advance.
  - **Trading**: Prohibit trading and monitor.
  - **Lack of interest in snacks**: Use popular snacks. If that fails, offer an alternative incentive (e.g., the snacks will be donated to a food bank, and the student with the most consistent choices gets extra credit? But that might distort choices. Alternatively, just hope the activity is engaging enough).
  - **Student who knows the theory**: If a student shouts out the axiom, say: "Yes, that's exactly what we are going to see now. Let's see how it works in practice." Then proceed.
  - **Time**: Keep a timer. If running behind, skip the pre-cooked history in Part 2 and focus on the violating history and Part 4.

  **What the Activity Can't Do**:
  - It doesn't prove the representation theorem. We have to state that WARP (for two goods) or GARP (for more) is necessary and sufficient for the existence of a utility function. We can mention this in the debrief.
  - It doesn't resolve the philosophical debate about utility. But it sets up the tension, which we can then discuss in the following lectures.

  This activity should create an experiential understanding of the limitations and content of revealed preference theory, setting the stage for deeper discussion.
answer: |-
  ### **In-Class Activity: The Utility Revelation Game**  
  **Goal:** Make students confront the limitations of revealed preference theory, the ease of "menu-laundering," and the ambiguity of "utility" through experiential learning.

  ---

  ### **Materials List**  
  1. **Snacks (3 types):**  
     - Good A: Mini bags of plain chips (cheap, neutral appeal).  
     - Good B: Chocolate pieces (universally liked, mid-value).  
     - Good C: Dried mango slices (niche appeal, perceived as "premium").  
     *Allergy note:* Use allergen-free brands; have fruit-only/nut-free backup options. Label goods clearly.  
  2. **Tokens:** Poker chips (150 total; 20 per student + extras). No real money.  
  3. **Handouts:**  
     - **Choice Sheets** (for recording decisions in each round).  
     - **Pre-Cooked Choice Histories** (for Part 2).  
     - **Secret Role Cards** (for Part 4).  
  4. **Whiteboard/Projector:** Display budget sets and aggregate results.  
  5. **Small Stakes:** Students keep snacks they "purchase" (incentivizes engagement).

  ---

  ### **Rules & Payoff Scheme**  
  - **Token System:**  
    - Each student starts with 20 tokens (non-tradable).  
    - Goods cost tokens (prices change per round).  
    - Choices are final; no sharing/trading.  
  - **Budget Sets (4 rounds, 3 goods):**  
    | Round | Price (A) | Price (B) | Price (C) | Budget |  
    |-------|-----------|-----------|-----------|--------|  
    | 1     | 1         | 1         | 2         | 4      |  
    | 2     | 3         | 1         | 1         | 5      |  
    | 3     | 1         | 2         | 1         | 4      |  
    | 4     | 2         | 2         | 1         | 6      |  
  - **Choice Task:**  
    Students choose a **bundle (A, B, C)** costing ≤ budget (e.g., Round 1: 2A + 1B + 0C = 3 tokens ≤ 4).  
    *Record choices on sheets.*  

  ---

  ### **Timeline (75 Minutes)**  
  **Part 1: Choice Experiment (15 min)**  
  - **0–5 min:** Introduce activity. Distribute tokens and choice sheets.  
  - **5–15 min:** Run 4 rounds. Display budget sets for 90 seconds each. Collect sheets.  

  **Part 2: Rationalizing Choices (20 min)**  
  - **15–20 min:** Pair students. Give each pair:  
    - **History 1:** One student’s *own* choices.  
    - **History 2:** **Pre-Cooked History** (designed for menu-laundering):  
      | Round | A | B | C | Notes |  
      |-------|---|---|---|-------|  
      | 1     | 0 | 0 | 2 | (Spends 4 tokens; only C chosen when C is expensive) |  
      | 2     | 1 | 2 | 0 | (Spends 5 tokens; avoids C when cheap) |  
      | 3     | 0 | 0 | 4 | (Spends 4 tokens; only C chosen again) |  
      | 4     | 3 | 0 | 0 | (Spends 6 tokens; only A chosen) |  
  - **20–30 min:** Task: *"Write a utility function rationalizing each history (e.g., U(A,B,C) = ...)."*  
  - **30–35 min:** Groups share rationalizations. Highlight fishy explanations (e.g., *"U depends on price ratios"*).  

  **Part 3: When Theory Bites (15 min)**  
  - **35–40 min:** Display a **WARP-Violating History** live:  
    - **Round X (new):** pA=1, pB=1, pC=1, Budget=2. **Choice:** (2A, 0B, 0C).  
    - **Round Y (new):** pA=1, pB=1, pC=1, Budget=3. **Choice:** (0A, 3B, 0C).  
    *Problem: In Round Y, (2A,0B,0C) costs 2 ≤ 3 and wasn’t chosen, but was chosen in Round X when affordable. Violates WARP!*  
  - **40–45 min:** Task: *"Rationalize this with a utility function."* Let groups struggle → reveal impossibility.  

  **Part 4: Same Choices, Different Reasons (10 min)**  
  - **45–50 min:** **Reveal two "secret agents"** (pre-selected before Part 1, given role cards):  
    - **Student 1 (Preference):** *"You love mango. Always buy as much C as possible."*  
      Their actual choices: (0,0,2) in R1; (0,0,5) in R2; (0,0,4) in R3; (0,0,6) in R4.  
    - **Student 2 (Rule-Follower):** *"You’re a minimalist. Buy only one good type per round, whichever is cheapest (if tie, pick A)."*  
      Their actual choices: Identical to Student 1 (*because rule aligned with prices*).  
  - **50–55 min:** Discuss: *"What ‘utility’ does each have? Who is better off?"*  

  **Debrief (15 min)**  
  - **55–60 min:** Solicit reactions. Then map to theory:  
    - **Menu-Laundering (Part 2):** Rationalizing arbitrary data is easy by making U depend on menus/prices. Shows the theory is **too flexible** without axioms.  
    - **Axioms as Content (Part 3):** WARP violation → no utility function exists. Axioms are the **only testable content** of RP theory.  
    - **Utility ≠ Psychology (Part 4):** Same choices, different reasons (preference vs. rule). "Utility" is **as-if behavior**, not mental states.  
    - **The "As-If" Collapse:** Rescues predictive modeling (*we can model choices*) but collapses for welfare (*can’t say who is better off*).  

  ---

  ### **Handling Predictable Problems**  
  1. **Trading/Sharing:**  
     - *Prevention:* Ban trading; supervise closely.  
     - *Fallback:* Use hypothetical choices if snacks cause chaos (but real stakes are ideal).  

  2. **Allergies/Disinterest in Snacks:**  
     - *Prevention:* Survey allergies pre-class; use non-food tokens (e.g., raffle tickets for bonus points) if needed.  
     - *Engagement:* Emphasize "keep what you choose." Use quirky goods (e.g., novelty pencils).  

  3. **Over-Prepared Student Shouts Axioms:**  
     - *Response:* "Great! Now let’s *see* why that axiom matters when choices violate it." Use their energy in Part 3.  

  4. **Time Shortfall:**  
     - *Cut:* Skip one round in Part 1 or simplify Part 4 to one pair’s data.  
     - *Extend:* Debrief can bleed into next session.  

  5. **Unpredictable Choices:**  
     - In Part 3, if no WARP violation emerges live, use pre-cooked data.  
     - In Part 4, pre-select agents to ensure choice alignment.  

  ---

  ### **What the Game Can’t Deliver (Requires Lecture)**  
  1. **Formal Proof of Representation Theorem:**  
     - *Say aloud:* "The theorem says: *If choices satisfy WARP, there exists a utility function that rationalizes them.* We saw the ‘if’ today; the ‘only if’ is a math result we’ll unpack next lecture."  

  2. **Philosophical Depth on "Utility":**  
     - *Say aloud:* "The game shows utility is a model of behavior, not happiness. But should welfare economics require more? Philosophers say yes; economists often say no. That’s next week’s debate."  

  3. **Generalized Axiom (GARP) Nuances:**  
     - *Say aloud:* "With >2 goods, WARP isn’t enough; we need GARP. Today’s violation was a simple case."  

  ---

  ### **Why This Works**  
  - **Experiential Dissonance:** Students *feel* menu-laundering when rationalizing nonsense data.  
  - **Aha! Moments:** The WARP violation and secret agents make abstract stakes concrete.  
  - **Bridging Disciplines:** Econ majors see axioms as necessary; philosophy majors see utility as hollow without psychology.  

  **Final Tip:** Start with, "Today we play a game. Don’t overthink—just choose!" Avoid priming until debrief.
