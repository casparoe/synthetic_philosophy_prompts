          Let me redesign the budget sets for the violation part:

            Round 1: pA=1, pB=1, budget=2 -> choose (2,0)   [so they reveal (2,0) > (0,2) and (1,1)]
            Round 2: pA=1, pB=2, budget=4 -> choose (0,2)   [note: (0,2) costs 4 in this round? Actually, 0*1 + 2*2 = 4 -> affordable. Also, in round1, (0,2) was affordable (cost=2) but they chose (2,0) instead. So they revealed (2,0) > (0,2) in round1. But in round2, they choose (0,2) when (2,0) is still affordable? (2,0) costs 2 in round2, which is within the budget of 4. So they are choosing (0,2) when (2,0) is available and cheaper? But that doesn't necessarily violate because maybe they have different preferences? Actually, in round2, (2,0) is available and they choose (0,2). This directly violates the Weak Axiom of Revealed Preference (WARP): in round1, (2,0) was chosen over (0,2) (which was available), and in round2, (0,2) is chosen while (2,0) is available. So WARP is violated.

          We can do this with three goods too, but two goods is simpler. So for this part, we can use two goods and two budget sets. We'll give the class a choice history that violates WARP:

            Budget set 1: pA=1, pB=1, budget=2 -> choice: (2,0)
            Budget set 2: pA=1, pB=2, budget=4 -> choice: (0,2)

