  We are designing an in-class activity for a mixed group of economics and philosophy undergraduates. The goal is to help them confront the limitations of revealed preference theory and the concept of "utility" in a tangible way. The activity should involve real choices (with small snacks), reveal that rationalizing any choice pattern is too easy (menu-laundering), then show a case where no utility function can rationalize the choices (violation of an axiom), and finally illustrate that identical choice behavior can stem from different underlying reasons (preference, rule, belief). We also need a debrief that connects these moments to the theoretical concepts.

  Design Outline:

  1. **Materials**:
