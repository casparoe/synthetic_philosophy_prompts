prompt: |-
  So a friend of mine is going through IVF at the moment and it's got me and a few people from my very informal reading group stuck on something. The thing that struck us is how picky the whole setup is about which reasons for choosing one embryo over another count as respectable. The clinic will happily discard embryos with the wrong number of chromosomes, will test for a specific disease if both parents are carriers, and — at least where I live, with some approvals — will let you pick an embryo that's a tissue match for a sick older sibling. But the same clinic acts as if ranking embryos by anything like intelligence or height is straight-up beyond the pale, and non-medical sex selection is either illegal or something they'll quietly steer you away from. At the same time, the very same health system nags pregnant women about folate and alcohol, and basically everyone I know agrees that a woman who drinks heavily all through a pregnancy has wronged the child she ends up having. That last bit is what I can't square. If we already accept that prospective parents owe it to the child who will exist to make that child as well off as they reasonably can, then why isn't "take the embryo with the best expected life" the obvious next step? Isn't that just procreative beneficence, and isn't it weird to accept the duty in the pregnancy case and reject it in the selection case?

  So here's what I actually want: what does the practice as it exists presuppose? Is it committed to something like a treatment/enhancement distinction, or to a sufficiency view where you may select to avoid a bad life but there's no reason at all to optimize above the threshold? Does it secretly lean on some claim about the non-identity problem — that we can't benefit a child by creating them, but we can harm them by creating them in a bad state? Does it presuppose that parents have a domain of reproductive discretion that simply runs out at some point, and if so, why exactly there? And I'd really like the distinction between what the practice strictly requires and what it merely fits with: could someone who accepts full-on maximizing procreative beneficence still endorse the clinic's actual rules for second-order reasons — the tech being noisy, worries about where a market in traits ends up, worries about what it says to already-existing disabled kids — or is that person stuck defending something closer to the practice I actually see?

  One more thing, because we invented it halfway through the argument and none of us could work out whether it's a genuine alternative or just the same view in a costume. Call it "the floor rule": you may use any selection technology to minimize the chance that the child ends up below some decent minimum of well-being, and you're encouraged to, but you may not use it to improve a child's prospects once they're already above the floor, even when the improvement is large and basically free. Is the floor rule actually a different theory from the one the clinic is running, or is it just a description of it? Does it dodge the expressivist worry about Down-syndrome screening, or does cutting off at the floor say something just as bad? And concretely: if a clinic swapped its current implicit theory for the floor rule, or for straight procreative beneficence, what would visibly change — who gets funded, what counselors say, whether declining selection starts to look like negligence? Sorry, that's a bit of a jumble, but I'd rather have the mess than a clean answer to the wrong question.
reasoning: |-
  Okay, let me unpack this user's query. They're grappling with the ethical inconsistencies in IVF embryo selection practices. The clinic allows selecting against severe genetic disorders or for tissue matching but prohibits non-medical trait selection like intelligence or height. The user sees a tension here because society expects pregnant women to avoid harm (like alcohol) to the future child, suggesting a duty to optimize the child's well-being. Why doesn't that duty extend to selecting the "best" embryo?

  The user wants to know the underlying principles behind these practices. I need to identify the philosophical presuppositions. The treatment/enhancement distinction seems relevant—clinics prioritize avoiding harm over enhancing traits. Also, the non-identity problem might play a role: creating a child with a disability is seen as harming them, but selecting for enhancement doesn't benefit a specific child since that child wouldn't exist otherwise. 

  Another angle is the sufficiency threshold. Clinics might aim to ensure a child is above a minimum well-being floor but not maximize beyond that. The user's "floor rule" proposal fits here. But does this avoid expressivist concerns? If society only prevents disabilities, it might still imply that disabled lives are less valuable. 

  The user also asks if procreative beneficence could be rejected for practical reasons—like imperfect tech or societal impacts. Clinics might worry about eugenics or market-driven trait selection. Even if maximizing is ideal, these second-order issues could justify current rules. 

  Concretely, switching to a floor rule might not change much in practice but could shift counseling language. Full procreative beneficence might make declining selection seem negligent, which isn't the case now. The user's deeper need is to understand whether current practices are philosophically coherent or if they're a pragmatic compromise. They might also be seeking validation of their "floor rule" as a viable alternative. 

  I should address both the ethical frameworks and real-world implications. Highlighting the balance between theoretical ethics and practical constraints will show why clinics operate this way. Also, clarifying the non-identity problem and expressivist concerns will help the user see why selecting against disability is treated differently from enhancement.
answer: |-
  Your friend's IVF experience exposes a fascinating ethical fault line in reproductive technology. You're right that the clinic's rules seem inconsistent at first glance, but they actually rest on a coherent (though contested) set of ethical presuppositions. Let's break it down:

  **What the Practice Presupposes:**

  1.  **The Treatment/Enhancement Distinction (T/E):** This is the most explicit foundation.
      *   **Treatment:** Selecting *against* conditions causing significant suffering, impairment, or early death (e.g., aneuploidy, Tay-Sachs, cystic fibrosis) is seen as preventing harm or disease. It aligns with traditional medical goals.
      *   **Enhancement:** Selecting *for* traits considered "beyond normal health" or "optimal" (e.g., predicted height, intelligence, non-medical sex, blue eyes) is seen as a non-medical intervention into human variation, venturing into "designer babies" territory. This distinction presupposes a meaningful line exists between "disease" and "normal variation."

  2.  **A Sufficiency Threshold (The "Floor" Rule IS Essentially the Practice):**
      *   The clinic's actions strongly imply a **sufficiency view**. The core ethical obligation is to ensure the future child has a reasonable chance at a life *above a minimum threshold* of well-being – a life not dominated by severe suffering, incapacity, or drastically shortened lifespan.
      *   **Minimizing Significant Harm:** Actions like PGT-A (chromosome screening), carrier screening for severe diseases, and even savior sibling selection (preventing the harm of a sibling's death and potentially the future child's guilt/trauma) aim to prevent lives falling *below* this threshold.
      *   **No Obligation to Optimize:** Once that threshold is met (e.g., embryos are euploid and free of tested severe disorders), there is generally seen to be **no ethical obligation** – and often an ethical *prohibition* – to select based on traits that might make the child "better off" but are not necessary to avoid the "bad life." The duty is to avoid creating a child in a *bad state*, not to create the child in the *best possible state*.

  3.  **The Non-Identity Problem & Harm Avoidance:**
      *   The practice implicitly leverages a specific solution to the non-identity problem concerning *harm*.
      *   **Harm-Based Reasoning:** Selecting an embryo with a severe genetic disorder can be framed as *harming* that specific future child by creating them in a severely disadvantaged state *compared to the alternative life they could have had* (if a different embryo had been selected).
      *   **Benefit-Based Reasoning Blocked:** Selecting Embryo A (predicted IQ 120) over Embryo B (predicted IQ 100) cannot be framed as *benefiting* the child born from Embryo A, because the child from Embryo B *would never have existed* if A was chosen. The child from A wasn't "saved" from a worse life; they simply exist instead of a different child. Procreative beneficence struggles here because the "better off" child isn't being made better off *than they otherwise would have been*; they are a different person altogether.

  4.  **Domain of Parental Discretion & "Acceptable" Reasons:**
      *   The practice presupposes that parental reproductive autonomy has boundaries defined by societal values and potential harms.
      *   **"Respectable" Reasons:** Preventing severe suffering/disease and saving an existing child's life are seen as compelling, "medical-family" reasons within the acceptable domain.
      *   **"Unrespectable" Reasons:** Preferences based on non-medical traits (sex, appearance, predicted "enhancements") are seen as:
          *   Crossing into "designer baby" territory.
          *   Potentially reinforcing harmful social biases (sexism, ableism, racism).
          *   Commodifying children.
          *   Threatening human diversity and equality.
      *   **The Boundary:** The boundary is drawn at preventing significant harm/disease vs. pursuing perceived advantage or preference. The "why" matters deeply.

  **Addressing the Pregnancy Analogy:**

  *   The duty during pregnancy is primarily **harm avoidance**: taking reasonable steps to prevent *foreseeable, significant harm* to the *specific* future child you have already decided to bring into existence (e.g., FASD from heavy drinking). This aligns perfectly with the IVF selection duty to avoid creating a child in a *harmed state*.
  *   It is **not** generally interpreted as a duty to *maximize* that child's potential (e.g., forcing extreme diets, constant Mozart, etc.). Taking folate prevents neural tube defects (harm avoidance), not low IQ within the normal range. The perceived inconsistency vanishes when you see both duties as **harm avoidance**, not maximization.

  **Could a Procreative Beneficence (PB) Maximizer Endorse the Clinic's Rules?**

  **Yes, but only for strong second-order/pragmatic reasons, not because they agree with the T/E or Sufficiency foundation.**

  *   **Strict PB View:** A pure PB maximizer *should* argue that if you can reliably predict which embryo has the highest expected well-being (EWB), you *are* obligated to select it, as you "benefit" *that child* by bringing *them* into existence with higher EWB instead of bringing a *different child* into existence with lower EWB. The non-identity problem doesn't block PB in the same way it blocks harm claims for enhancements.
  *   **Why a PB Maximizer Might *Accept* the Rules Anyway:**
      *   **Noise & Uncertainty:** Current tech (especially for complex traits like intelligence) is incredibly noisy. Predictions are probabilistic and influenced heavily by environment. Selecting based on polygenic scores for height or IQ is far from "basically free" improvement; it's unreliable and carries risks of being misled. The maximizer might argue the *expected benefit* isn't reliable enough to outweigh other concerns.
      *   **Slippery Slope / Societal Harm:** Fearing a dystopian market in traits, exacerbating inequality, or intense social pressure to "optimize," the maximizer might accept a bright-line rule (T/E or Sufficiency) as a necessary pragmatic barrier against worse outcomes, even if it sacrifices some potential individual EWB gains in the short term.
      *   **Expressivist Concerns:** Even if PB is correct, permitting selection *for* traits might send a strong social message devaluing people who lack those traits. Avoiding this harm to existing people could outweigh the potential EWB gain for the selected child.
      *   **Resource Allocation:** Focusing selection resources on preventing severe suffering (hitting the sufficiency threshold for more children) might be seen as a better use of limited resources than chasing marginal gains above the threshold for fewer children.
  *   **Conclusion for PB:** A PB maximizer is philosophically "stuck" thinking the clinic *should* allow selection for higher EWB traits *if reliable*. However, they could *endorse* the current rules as a *practical compromise* given technological unreliability and severe societal risks, making them "second-best" but necessary.

  **The "Floor Rule" - Analysis:**

  1.  **Is it Different?** It's **not fundamentally different** from the clinic's implicit sufficiency view. It's a clear articulation *of* that view. The clinic *is* operating under a floor rule: "Avoid creating children below this floor (severe disease/suffering); above the floor, selection based on non-medical traits is impermissible."
  2.  **Does it Dodge Expressivist Worries?** **No, not entirely.** While it avoids expressivism *above* the floor (since you don't select against minor variations), the act of defining and selecting *against* traits that put a life *below* the floor **still sends a message** that lives with those traits are not worth living or are less valuable. Down syndrome screening faces this criticism head-on. The floor rule mitigates but doesn't eliminate the expressivist concern for the traits it *does* select against.
  3.  **What Would Change if Clinics Adopted...**
      *   **... The Floor Rule Explicitly?** Very little in practice. It's largely descriptive of the status quo. Counseling might be slightly clearer about the "sufficiency" rationale. It might slightly expand what counts as "below the floor" (e.g., more nuanced discussions of disorder severity).
      *   **... Strict Procreative Beneficence?** **Significant Changes:**
          *   **Funding/Coverage:** Payer resistance would be immense. Arguments would rage over defining/predicting EWB and the societal cost.
          *   **Counseling:** Genetic counselors would be obligated to discuss predicted EWB for various traits if reliable data existed, presenting optimization as a positive option, not something to steer away from.
          *   **Negligence:** Declining to select an embryo with *significantly* higher predicted EWB (if reliably known) could start to be framed as negligence or a failure of parental duty, akin to refusing prenatal care. This is the most radical shift.
          *   **Technology Drive:** Massive investment in polygenic risk scores and trait prediction.
          *   **Social Pressure:** Intense pressure on parents to "optimize" and stigmatization of those who don't or whose children don't meet predicted potentials.

  **In Summary:**

  The clinic's practice presupposes a **harm-avoidance/sufficiency model** grounded in the **Treatment/Enhancement distinction** and a specific **solution to the non-identity problem for harms**. The duty during pregnancy is consistent with this, as it's also about harm avoidance. The "Floor Rule" is essentially what they operate under now. Procreative Beneficence is a fundamentally different principle focused on maximizing expected well-being, not just avoiding a bad life. While a PB proponent *could* accept the current rules as a pragmatic necessity (due to tech limits and societal risks), they are philosophically committed to the idea that selecting *for* higher EWB traits, if reliable, *should* be permissible and potentially obligatory. Adopting PB openly would revolutionize IVF practice, counseling, and societal expectations in profound and contentious ways. The current system draws a bright line based on preventing suffering, deeply wary of crossing into the territory of designing preferred children.
