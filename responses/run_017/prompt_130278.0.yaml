answer: |-
  ## Final Exam: Metaphysics 305 - Dispositions & Causation

  **Instructions:** Answer the following essay question in your blue book. Write clearly and concisely, aiming for approximately 1,200 words. This is a closed-book exam. You have 90 minutes. Your answer should demonstrate a deep understanding of the conceptual issues raised by the cases, going beyond simple recitation of standard distinctions or analyses.

  **Question:**

  Consider the following two novel cases concerning the disposition of fragility:

  1.  **The Loan:** A drinking glass is composed of a special polymer that normally deforms upon hard impact rather than shattering. However, embedded within the glass is a microscopic monitor. This monitor detects the onset of any hard impact and, within one microsecond, triggers a molecular reorganization of the glass material itself, transforming it into the structure of ordinary, highly fragile glass. *After* this transformation, the glass shatters in response to the impact. Intuitively, we want to say the glass (pre-impact) is *not* fragile. Yet, whenever it is struck hard, it shatters.
  2.  **The Race:** A drinking glass *is* intrinsically composed of ordinary fragile glass. It is also connected to an external hardening mechanism designed to prevent shattering. This mechanism detects the onset of a hard impact. However, the hardening mechanism takes one microsecond to activate and become effective. Crucially, the process of shattering for this fragile glass, once triggered by the impact, completes within one nanosecond. Intuitively, we want to say the glass *is* fragile. The hardening mechanism exists but is too slow to prevent the manifestation.

  Critically evaluate the ability of the standard "repair" to the Simple Conditional Analysis (SCA) – namely, that `x` is disposed at time `t` to give response `r` to stimulus `s` iff there is some intrinsic property `B` that `x` has at `t` and some later time `t'` such that, if `x` were to undergo `s` while retaining `B` right up to `t'`, then `s` together with `x`'s having `B` would be a sufficiently complete cause of `x`'s giving `r` – to correctly analyze these cases.

  *   (a) State what you believe the intuitively correct verdicts are regarding the fragility of the glass in each case (Loan and Race) *before* the impact occurs. Briefly justify these intuitions.
  *   (b) Explain in detail how applying the standard repair leads to problematic or ambiguous results in *both* cases. Pay particular attention to: (i) the identification of the relevant object (`x`) and its intrinsic properties (`B`), and (ii) the specification of the stimulus (`s`) and timescale (`t'`). Does the repair deliver the intuitive verdicts straightforwardly? Why or why not?
  *   (c) Argue for what these cases reveal about a fundamental assumption underlying *both* the fink/mask objections to the SCA *and* the standard repair itself. Specifically, what do these cases suggest about our ability to determine whether a disposition "survives" the onset of its stimulus independently of our understanding of the disposition itself and its typical manifestation process? What is the implication for the question of whether a disposition is something "over and above" its causal basis (`B`)? Ground your argument firmly in the details of the Loan and Race cases.

  **Focus:** Your essay will be evaluated on its ability to identify and deeply engage with the *conceptual challenge* these cases pose, moving beyond merely labeling them as finks or masks or restating the repair. The central issue concerns the *independence* (or lack thereof) of determining disposition persistence from counterfactuals involving the basis.

  ---

  ## Model Answer (Approx. 700 words)

  **(a) Intuitive Verdicts:**
  *   **Loan:** The glass is **not fragile** before impact. While it shatters when struck, this shattering is *not* a manifestation of a pre-existing *fragility* inherent in the glass at the moment of impact. Instead, the impact triggers a radical alteration (via the monitor) that *creates* a fragile state *which then* shatters. The shattering is a result of the loaned fragility, not the original disposition.
  *   **Race:** The glass **is fragile** before impact. Its intrinsic composition is that of fragile glass. The hardening mechanism, while present, is demonstrably too slow to prevent the shattering process intrinsic to that composition once triggered. The disposition manifests (shattering occurs) before the mask can become effective.

  **(b) Problems Applying the Standard Repair:**

  *   **Loan:**
      *   **Object/Property (`x` and `B`):** The repair hinges on identifying an intrinsic property `B` of `x` present at `t` (onset of impact) that is retained until `t'` (shattering) and causes `r` when combined with `s`. But what is `x` and what is `B`?
          *   If `x` is the *glass alone* (pre-reorganization), its intrinsic `B` (the deformable polymer structure) *is* retained if the monitor doesn't act. But if `B` is retained, `s`+`B` causes deformation (`r`?), not shattering – failing the repair for fragility.
          *   If `x` is the *glass-plus-monitor composite*, an intrinsic property `B` of this composite *is* retained (the monitor's triggering mechanism + original polymer). When `s` occurs and `B` is retained, `s`+`B` *causes* the molecular reorganization *and then* shattering. This *seems* to satisfy the repair: retained `B` + `s` causes shattering (`r`). But this delivers the *wrong* verdict: it declares the composite fragile *despite* our intuition that the *glass* wasn't fragile originally. The repair struggles to isolate the relevant `x` and `B` to match the intuitive target disposition-bearer (the glass) and its non-fragile state.
      *   **Timescale (`t'`):** The repair requires retaining `B` up to `t'`. If `t'` is set *after* the reorganization (to include shattering), we are forced to include properties (`B`) that encompass the triggering mechanism, leading to the counterintuitive verdict. If `t'` is set *before* reorganization, shattering hasn't occurred yet. The needed timescale forces us to choose which process counts as the manifestation.

  *   **Race:**
      *   **Stimulus/Timescale (`s` and `t'`):** The repair seems to work if we focus precisely: `s` is "undergoing a hard impact", `r` is "shattering", `B` is the fragile molecular structure. If `B` is retained through `t'` (say, a few nanoseconds post-impact), `s`+`B` causes shattering (`r`). This matches the intuitive verdict (fragile).
      *   **The Coarsening Problem:** However, nothing in the repair *requires* this fine-grained specification. Suppose we coarsen the description of `s` to include not just the impact, but the *entire causal scenario* unfolding over microseconds – implicitly including the *potential activation* of the hardening mechanism. If `x` retains `B` (fragile structure) through `t'` (e.g., 2 microseconds post-impact), what happens? The hardening mechanism *would* activate and prevent shattering within that timeframe. So, `s` (coarsely described) + `B` retained does *not* cause `r` (shattering). This *incorrectly* suggests the glass is *not* fragile. The repair's verdict becomes sensitive to how we describe `s` and choose `t'`. Getting the *correct* verdict depends on already knowing that the hardening mechanism is irrelevant *because* the disposition manifests too quickly – knowledge presupposing the very fragility the analysis is meant to capture.

  **(c) Revealing the Fundamental Assumption & Implications:**

  Both cases expose a critical circularity lurking in the fink/mask discourse and the standard repair. The repair aims to fix the SCA by requiring the *persistence of the basis `B`* during the stimulus. **But determining whether `B` "persists" or "survives" the stimulus in the relevant way is not independent of knowing the disposition's *own* nature and its characteristic manifestation process.**

  *   **Loan:** To know whether the relevant intrinsic property `B` of the *glass* (excluding the monitor) "survives" the impact, we need to know if the glass *remains fragile* through the impact. But the repair was supposed to *analyze* fragility in terms of `B` and counterfactuals. The intuition that the glass isn't fragile *drives* the judgment that its original `B` *doesn't* survive (it gets replaced). The repair cannot ground the survival of `B` without presupposing the dispositional status we're trying to analyze.
  *   **Race:** To know that setting `t'` to nanoseconds (yielding fragility) is correct, while setting it to microseconds (yielding non-fragility) is misleading, we need to know that fragility manifests *before* the mask can act. This requires knowing the *characteristic speed* of the manifestation of *fragility itself*. Again, the persistence of `B` and the appropriate timescale (`t'`) are judged based on prior understanding of the disposition, not derived neutrally from `B` and counterfactuals.

  **Implication for Dispositions vs. Bases:** These cases strongly suggest that a disposition **cannot be straightforwardly identified with its causal basis `B` plus the counterfactual link provided by the repair.** The repair fails precisely because it tries to use persistence of `B` (a categorical property) and counterfactuals to define the disposition, but correctly applying the repair *requires* prior knowledge about the disposition's persistence and typical manifestation behavior. The disposition (e.g., fragility) seems to involve not just the basis `B`, but also a *specific causal role or process* that `B` is *supposed* to play – a role that defines what counts as the basis "persisting" or being "masked" in the relevant sense. The disposition appears to be a distinct, higher-order property that governs how the basis `B` *would* behave in certain circumstances, a property we need to grasp *before* we can correctly apply analyses relying on `B`'s persistence.

  ---

  ## Marking Scheme (Out of 20)

  | Points                                                                                                 | Marks | Common Errors                                                                                                                                 |
  | :----------------------------------------------------------------------------------------------------- | :---- | :-------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Correct intuitive verdicts for Loan & Race with brief justification.**                            | 4     | Misidentifying Loan as fragile; misidentifying Race as not fragile; weak or absent justification not grounded in case details.                |
  | **2. Accurate & detailed explanation of how repair fails/becomes ambiguous in both Loan & Race,** focusing on object/property (`x`/`B`) issues in Loan AND stimulus/timescale (`s`/`t'`) issues in Race. | 5     | Superficial application of repair; only discussing one case well; missing either the `x`/`B` ambiguity in Loan OR the `s`/`t'` sensitivity in Race; labeling cases as fink/mask without deeper analysis. |
  | **3. Clear articulation of the circularity:** Identifying that the repair assumes prior knowledge of disposition persistence/survival independent of counterfactuals, and demonstrating this using specifics from Loan AND Race. | 6     | Not identifying the circularity; stating it vaguely without linking to cases; only using one case to illustrate; conflating with standard fink/mask issues. |
  | **4. Correct implication drawn:** Arguing that the cases show dispositions cannot be reduced to basis `B` + counterfactual (per repair) because disposition identity/persistence is presupposed. | 3     | Not drawing the implication; claiming dispositions *are* just the basis; reverting to standard views without addressing the revealed problem. |
  | **5. Overall Clarity, Structure, and Conciseness.**                                                   | 2     | Disorganized; overly verbose; significant irrelevant digression; poor writing obscuring arguments.                                            |

  **Total:** /20
