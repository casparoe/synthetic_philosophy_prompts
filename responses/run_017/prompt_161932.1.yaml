prompt: |-
  I'm a senior at a big public high school in Ohio, and I run our school's giving club — we raise a couple of thousand dollars a year from bake sales and a spring 5K, and a committee of six of us decides where it goes. I've applied to study public policy next fall, so I've been trying to be more careful about the words I use, and there's a pattern in our meetings I can't name. Three versions of it, from this year. One: we weighed buying insecticide-treated bed nets through a charity that publishes a cost per net and an estimate of what a dollar accomplishes, against giving the same money to a local tenants' union that keeps people from being evicted. Half the room thought the housing work might matter more, since an eviction wrecks everything downstream for a family, but its effects are spread over years, depend on landlords and judges and city budgets, and nobody can say what would have happened otherwise — so it has no number, and we funded the nets without anyone once claiming the nets were better. We claimed they were the ones we could evaluate. Two: once we'd chosen the nets, we started tracking cost per net delivered, and then cost per net actually hanging over a bed, and each refinement was a genuine improvement and also quietly changed what we were paying for. Three: a tutoring program pitched us with a spreadsheet of hours delivered; everyone in the room said out loud that the number would rise if tutors just sat with students longer without teaching them anything, and we funded it anyway, while a proposal about how the school's discipline system treats kids never made the shortlist, because there's no spreadsheet for it.

  What makes me think this is one thing rather than three is that the filter doesn't pick arbitrarily — it picks in a direction. Everything that survives has an effect that is near-term, happens to an identifiable person, and can be attributed to us; everything that gets screened out is systemic, delayed, or works by changing how an institution behaves. It also seems to feed on itself: the option that has a number is the one that gets funded, which is the one that gets audited, studied, and refined, so next year it looks even stronger next to the option nobody funded and nobody bothered to measure. A friend from policy debate says this is Goodhart's law, and someone else mentioned a drunk looking for his keys under a streetlight. Both feel adjacent and neither feels right. Goodhart, as I understand it, is about a measure getting gamed once it becomes a target — but in my first case nobody is gaming anything and the number is honest; the trouble is that only one of the options has a number at all. The streetlight story seems to be about searching where the light is, but it doesn't capture the directional tilt, or the way this year's choice decides what next year's light will be. So: is there an established concept for the whole pattern, or for the part that isn't Goodhart? Is my list of three really one phenomenon with two faces — selection and drift — or two that merely travel together? And where are the edges? I'd be annoyed to be handed a single label; I want the carving. I'm not looking for citations or a reading list, just the distinctions, in American English, at a level a careful high schooler can follow.

  After the prose, please give me two tables. First, a candidate-concepts table with exactly these columns: candidate_name | status (established term, or a name you are proposing yourself) | definition_in_your_own_words | which_face_of_my_pattern_it_covers (selection / drift / feedback / none) | where_it_fits_my_cases | where_it_misfits | verdict (exact / partial / wrong). Second, a boundary-cases table with exactly these columns: case | counts_as_the_phenomenon (yes / no / borderline) | one_sentence_reason. For the boundary-cases table, use at least these four cases: the unmeasurable option is in fact the worse one; the number being tracked is openly declared to be a proxy for a good nobody can measure directly; the club spends its whole budget on building a way to measure the housing work instead of funding either option; and one case of your own that you think puts the sharpest pressure on whatever definition you settled on.
reasoning: |-
  Hmm, let me unpack this thoughtful query about quantifying impact in charitable giving. The student describes three clear patterns: selecting measurable options over systemic ones, refining metrics that subtly shift goals, and funding quantifiable programs despite known flaws. Their core insight is that measurement isn't neutral - it systematically favors certain interventions while starving others, creating a self-reinforcing cycle.

  The Goodhart's law comparison is astute but doesn't quite fit, as the issue here isn't gaming metrics but the initial availability of metrics. The streetlight effect captures part of it but misses the directional bias and path dependency. This seems like a deeper structural phenomenon where measurability determines viability.

  I recall the concept of McNamara Fallacy - reducing what's important to what's countable - which maps well to the first case. For the metric refinement pattern, Campbell's law about measurement distortion applies. The self-reinforcing aspect resembles performative prediction where metrics shape reality. 

  For boundary testing, I'll consider scenarios like: what if the unmeasurable option is objectively worse (shouldn't count as the phenomenon), or if proxies are explicitly acknowledged (still problematic). The sharpest test case would be spending all funds on measurement infrastructure - revealing how the process consumes resources meant for impact.

  The student wants precise conceptual carving, not just labels. They're clearly thinking like a future policy analyst - noticing systemic patterns in everyday decisions. Their observation about "directional tilt" is particularly incisive; this isn't random bias but a gravitational pull toward certain kinds of interventions.
answer: |-
  Based on your detailed observations, here's the conceptual carving you requested. The core phenomenon is **systematic bias toward measurable interventions**, driven by a cycle where measurability dictates funding, which then reinforces future measurability. It's one interconnected pattern with three facets: **Selection Bias** (choosing what's measurable), **Metric Drift** (refining measurable proxies), and **Feedback Reinforcement** (past choices shaping future options). Goodhart and the Streetlight Effect are adjacent but address different aspects.

  ### Candidate Concepts Table
  | candidate_name               | status               | definition_in_your_own_words                                                                 | which_face_of_my_pattern_it_covers | where_it_fits_my_cases                                                                                        | where_it_misfits                                                                 | verdict  |
  | :--------------------------- | :------------------- | :------------------------------------------------------------------------------------------- | :--------------------------------- | :------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------- | :------- |
  | **Measurability Bias**       | Proposed term        | The systematic preference for options with quantifiable outcomes over equally/more valuable but unmeasurable ones. | Selection                          | Case 1 (nets vs. housing): Housing rejected solely due to lack of metrics, not proven inferiority.            | Doesn't capture the *evolution* of metrics (Drift) or the self-reinforcing cycle. | Partial  |
  | **McNamara Fallacy**         | Established term     | Mistaking what can be easily measured for what is truly important or valuable.               | Selection                          | Case 1 & 3: Prioritizing cost-per-net or tutor-hours because they exist, ignoring systemic impacts (housing, discipline) that are harder to quantify. | Less focused on the *drift* in metrics or the *feedback loop* reinforcing bias.    | Partial  |
  | **Proxy Creep**              | Proposed term        | The gradual shift in focus from a desired outcome to a measurable proxy, which becomes the de facto goal. | Drift                              | Case 2 (nets): Each refinement (delivered → hanging) subtly changed the funded activity, prioritizing measurable proxies over ultimate impact (malaria reduction). | Doesn't explain the *initial selection* of measurable options over unmeasurable ones. | Partial  |
  | **Campbell's Law**           | Established term     | The more a quantitative metric is used for decision-making, the more likely it is to distort the very processes it aims to measure. | Drift                              | Case 3 (tutoring): Knowing hours are tracked incentivizes tutors to maximize hours, potentially corrupting the intended outcome (learning). | Case 1 had no gaming/distortion – the net metrics were honest. Case 2 involved improvement, not distortion. | Partial  |
  | **Path Dependency in Measurement** | Proposed term        | Current choices about what to measure constrain and shape future options and evaluations, creating a self-reinforcing cycle. | Feedback                           | Your core insight: Funding nets this year makes their metrics better next year, while unfunded housing remains unmeasured and unfundable. Explains the directional tilt over time. | Doesn't directly cover the initial selection bias or the metric refinement within a chosen program. | Partial  |
  | **Performative Measurement** | Established term (Adjacent) | The act of measuring something doesn't just observe reality; it actively shapes behavior and outcomes. | Feedback/Drift                     | Case 3: Measuring tutor hours *creates* an incentive for tutors to sit longer, changing the intervention. Case 2: Measuring hanging nets *shifts* the program's focus. | Doesn't explain the *initial exclusion* of unmeasurable options (Selection).        | Partial  |
  | **Goodhart's Law**           | Established term     | When a measure becomes a target, it ceases to be a good measure.                             | Drift (Specific)                   | Case 3: Tutors gaming hours is classic Goodhart.                                                              | Case 1: No gaming occurred. Case 2: Refinements were improvements, not gaming. Focuses on distortion, not the initial selection bias. | Partial (Case 3 only) |
  | **Streetlight Effect**       | Established metaphor | Searching for something only where it's easy to look (under the light) rather than where it might actually be. | Selection                          | Case 1 & 3: Funding only options with existing "light" (metrics) while ignoring potentially better options in the "dark" (systemic/unmeasurable). | Misses the *directional tilt* (favoring near-term/attributable) and the *feedback loop* strengthening the "light" over time. | Partial  |

  **Verdict on the Whole Pattern:** Your three cases are facets of **one core phenomenon**: **The Measurability Imperative in Impact Allocation**. This is characterized by:
  1.  **Selection Bias for Measurability:** Prioritizing interventions with quantifiable, near-term, attributable outcomes (Nets, Tutoring Hours) over systemic, long-term, or complex ones (Housing, Discipline Reform) simply because they *can* be measured.
  2.  **Proxy Drift:** Within chosen measurable interventions, refining and optimizing for the *proxy metric itself* (cost per net hanging, hours delivered), which subtly shifts the focus away from the ultimate intended impact.
  3.  **Reinforcing Feedback Loop:** Funding measurable options generates more data, refinement, and apparent "strength" for those options, making them even more dominant in future cycles, while unmeasured options remain invisible and unfundable. This creates the "directional tilt."

  ### Boundary Cases Table
  | case                                                                                                                               | counts_as_the_phenomenon | one_sentence_reason                                                                                                |
  | :--------------------------------------------------------------------------------------------------------------------------------- | :----------------------- | :----------------------------------------------------------------------------------------------------------------- |
  | **The unmeasurable option is in fact the worse one.**                                                                              | **No**                   | The phenomenon is about bias *driven by measurability*, not about the objective quality of the options; rejecting a genuinely worse unmeasurable option is rational, not biased. |
  | **The number being tracked is openly declared to be a proxy for a good nobody can measure directly (e.g., "hours tutored is a proxy for learning").** | **Yes**                  | This is the *essence* of Proxy Drift; the declared proxy becomes the operational target, risking distortion (Case 3) or misalignment (Case 2).                                  |
  | **The club spends its whole budget on building a way to measure the housing work instead of funding either option.**               | **Borderline**           | It actively feeds the Feedback Loop (investing in measurement capacity) and stems from Selection Bias (housing deemed unfundable *without* a number), but doesn't involve funding an *intervention* based on its measurability. |
  | **A proposal has good metrics but is rejected because its long-term systemic impact is deemed more important than the measurable short-term outputs, even though those outputs are valid.** | **No**                   | This demonstrates *overcoming* the Measurability Imperative; the decision consciously prioritizes non-measurable value despite having quantifiable data.                       |

  **Key Distinctions:**
  1.  **Selection vs. Drift:** Selection is the *gatekeeping* (what gets funded based on having a number). Drift is the *evolution inside the gate* (optimizing the number changes what you're doing). Feedback is the *engine* (Selection + Drift today dictate what's selectable tomorrow).
  2.  **Bias vs. Gaming:** Your core issue is a *bias in selection and focus* caused by the *availability* of measurement (even honest measurement), not the *distortion* of measurement (Goodhart/Campbell), though gaming can emerge later (Case 3).
  3.  **Light vs. Tilt:** The Streetlight Effect is about *where you look*. Your phenomenon adds *why that light exists* (past funding/measurement choices) and *how the light's beam narrows* (Proxy Drift), creating a directional tilt favoring certain *types* of impact (attributable, near-term).
  4.  **The Imperative:** The "Measurability Imperative" highlights the *pressure* to fund only what can be counted, driven by accountability demands, risk aversion, and the feedback loop itself. It's not just convenience; it becomes a requirement for consideration.
