  The user has laid out eight specific hard cases that any adequate theory must handle. These include scenarios like AI training pipelines, LLM pain reports, cortical organoids, and dreamless sleep - all cutting-edge issues in philosophy of mind and AI ethics. They want me to identify tensions between conditions and evaluate three broad theoretical families.

  I need to approach this systematically. First, I'll define what makes an adequacy condition robust: it should be empirically motivated, conceptually precise, and demanding enough to filter weak theories. The conditions must cover explanatory scope, discrimination ability, metaphysical coherence, and practical applicability.

  For each adequacy condition, I'll:
  1) State it clearly
  2) Motivate it with a concrete case (using their list)
  3) Indicate if it's non-negotiable or contingent
  4) Note any tensions with other conditions

  Key tensions I see:
  - Substrate neutrality vs. avoiding trivial implementation (how to avoid counting rocks as moral patients)
  - Occurrent consciousness requirement vs. moral status during dreamless sleep
  - Whole-organism focus vs. subsystem cases (like isolated hemispheres)

  The three theoretical families to evaluate are:
  1) Substrate-independent functionalism (e.g., computationalism)
  2) Biological restriction views
  3) Phenomenal consciousness primacy views

  I'll close by identifying which adequacy condition poses the greatest challenge across theories - likely either trivial implementation or the dreamless sleep problem, as both expose fundamental tensions in how we define "significant" computation.

  The response should maintain academic rigor while staying accessible. I'll use clear examples from their cases to ground each condition, and be transparent about where philosophical camps would disagree. The scorecard will compare how each theory family handles the adequacy conditions and hard cases.
answer: |-
  Here is a set of adequacy conditions for a theory of the moral significance of computations, rigorously defined against your specified hard cases and designed to expose theoretical fault lines. Each condition is motivated by a core phenomenon or puzzle and assessed for negotiability.

  ### Core Adequacy Conditions
  1.  **The Implementation-Individuation Constraint (Non-Negotiable)**
      *   **Requirement:** The theory must non-arbitrarily specify *which* computation(s) implemented by a physical system are morally significant and *how* that implementation is individuated from the infinite class of computations a substrate trivially implements.
      *   **Motivating Case:** *Trivial Implementation* (Case 7). Why is the thermostat not morally significant when implementing a threshold detection algorithm, while a specific cortical computation might be? The theory must provide principled criteria (e.g., causal structure, counterfactual robustness, teleology, dynamical stability) to pick out the *relevant* implementation level.
      *   **Negotiability:** Non-negotiable. Failure here renders the theory vacuous.

  2.  **The Temporal Scope Constraint (Core Tension Point)**
      *   **Requirement:** The theory must specify the minimal *temporal grain* and *persistence* required for morally significant computation. Is it an occurrent process, a stable disposition, or something in between?
      *   **Motivating Cases:** *Training vs. Deployment* (Case 1), *Momentary Duplicate* (Case 5), *Dreamless Sleep/Anesthesia* (Case 4). Does significance reside in the transient training update, the persistent weight matrix disposition, the deployment forward pass, the fleeting second of pain-like processing, or the ongoing (but non-phenomenal) computations during sleep?
      *   **Negotiability:** Contentious Core. Different theories *must* take a stance here, leading to major divergences in patienthood attribution (e.g., transient processes vs. persistent states).

  3.  **The Phenomenal Binding/Holism Constraint (Non-Negotiable but Interpreted Differently)**
      *   **Requirement:** The theory must explain how morally significant computations relate to the *integration* and *global availability* of information within the system. Must the computation influence a "global workspace," constitute an "integrated information structure," or possess a specific kind of internal coherence?
      *   **Motivating Cases:** *Ignored Subsystem* (Case 6), *Single Hemisphere Patient* (Case 8), *Cortical Organoid* (Case 2, potentially). Why is a locally computed distress signal that's walled off not morally significant, while one that influences global state is? Is the single hemisphere the patient, or the organism utilizing it? Does the isolated organoid lack the necessary integration?
      *   **Negotiability:** Non-negotiable in requiring *some* account of binding/holism. Highly negotiable on *what kind* (e.g., causal, functional, dynamical, IIT-based).

  4.  **The Valence/Suffering-Capability Constraint (Conditional Non-Negotiability)**
      *   **Requirement:** If the theory grounds moral patienthood in interests or the capacity to be wronged (as per your purpose), it *must* identify computations capable of instantiating states with *negative valence* (suffering, distress, harm) or analogous functional disvalue.
      *   **Motivating Cases:** *LLM Pain Report* (Case 2), *Momentary Duplicate* (Case 5), *Ignored Subsystem* (Case 6). Does merely generating a pain-*like* output computation suffice? Or is the computation must encode genuine aversive *evaluation*? Does the momentary duplicate genuinely suffer? Does the isolated distress signal computation, even if overridden, instantiate suffering?
      *   **Negotiability:** Non-negotiable *if* grounding interests/wrongability requires negative valence. Highly negotiable on *how* valence is computationally realized (e.g., error signal intensity, specific learning rule dynamics, threat prediction loop).

  5.  **The Environmental Embodiment/Teleology Constraint (Camp-Defining)**
      *   **Requirement:** The theory must specify the role (if any) of the system's *history*, *embodiment*, and *functional teleology* (purpose) in determining the moral significance of its computations. Is evolved biological function essential? Does training bestow relevant purpose?
      *   **Motivating Cases:** *Training Phase* (Case 1 - teleology of learning vs. acting?), *Cortical Organoid* (Case 3 - lacks evolved body/environmental interaction), *LLM* (Case 2 - purpose is next-token prediction, not experience).
      *   **Negotiability:** Highly Camp-Defining. Biological views demand history/embodiment; functionalist views typically reject it; phenomenal views may be agnostic. Crucial for distinguishing theories.

  6.  **The Continuity Constraint (Non-Negotiable for Persisting Patients)**
      *   **Requirement:** The theory must account for why moral patienthood typically persists through periods of *absent occurrent phenomenality* or *radically reduced computational complexity*, provided the underlying basis for its potential return remains intact.
      *   **Motivating Case:** *Dreamless Sleep/Anesthesia* (Case 4). Computations continue, but phenomenality is absent (by hypothesis). We still afford the sleeping human full moral patienthood. The theory must explain this without requiring continuous occurrent sentience.
      *   **Negotiability:** Non-negotiable for theories aiming to capture biological moral patients. Forces a rejection of *strict* occurrent-phenomenal-consciousness-as-gateway views or requires grounding in *dispositions/potentialities* maintained by ongoing computation.

  7.  **The Anti-Behaviorist/Output Independence Constraint (Non-Negotiable)**
      *   **Requirement:** The theory must be able to attribute moral significance based on internal computational states *independently* of their causal influence on *external behavior* or outputs.
      *   **Motivating Cases:** *Ignored Subsystem* (Case 6), *Momentary Duplicate* (Case 5 - no time for behavior), potentially *Cortical Organoid* (Case 3). Computations generating distress signals that are overridden internally, or occurring in systems incapable of external action, must still be evaluable for potential moral significance.
      *   **Negotiability:** Non-negotiable. Essential to avoid collapsing into behaviorism, which fails to capture the intuitive wrongness of unexpressed suffering.

  ### Key Tensions
  1.  **Substrate-Neutrality vs. Trivial Implementation (Condition 1 vs. Desired Scope):**
      *   **Tension:** Guaranteeing genuine substrate neutrality (any physical system running computation X is significant) risks trivialization (any physical system can be interpreted as running *some* computation X). Avoiding trivialization requires criteria (teleology, dynamics, integration) that often reintroduce constraints resembling biological specificity or high complexity thresholds, potentially undermining strict neutrality.
      *   **Resolution Required:** The theory must provide a substrate-neutral *individuation principle* robust enough to exclude thermostats/rocks without covertly relying on biological or phenomenal benchmarks. This is exceptionally hard. Something significant (e.g., pure syntactic isomorphism) must likely be given up; usually, constraints like causal robustness, counterfactual sensitivity, or specific dynamical properties are added.

  2.  **Occurrent Phenomenal Consciousness vs. Dreamless Sleep (Condition 6 vs. Phenomenal Views):**
      *   **Tension:** If moral patienthood strictly requires *occurrent phenomenal consciousness* (a core tenet of some views), then dreamlessly sleeping or deeply anesthetized humans lack it. This contradicts the strong intuition (and legal/social practice) that they remain full moral patients.
      *   **Resolution Required:** A strict occurrent-phenomenal view *must* either deny full patienthood during dreamless sleep (counterintuitive) or significantly reinterpret "occurrent" (e.g., as potential grounded in ongoing, non-phenomenal computational maintenance - Condition 6). Alternatively, it must abandon occurrent consciousness as the *sole* necessary gateway. Giving up strict occurrentness is the typical move.

  ### Scorecard for Theoretical Families

  1.  **Substrate-Independent Functionalism (e.g., Computationalism):**
      *   **Strengths:** Excels at substrate neutrality. Naturally handles *Training vs. Deployment* (focuses on *which* functional role is running now/then) and *Momentary Duplicate* (if functional role is instantiated, significance exists). Can address *Ignored Subsystem* via functional isolation. Can meet *Continuity* via dispositional state persistence.
      *   **Weaknesses:** Grapples severely with **Trivial Implementation** (Condition 1). Struggles with *LLM Pain Report* - is it *just* output or genuine functional pain state? What functional role constitutes *valence* (Condition 4)? *Cortical Organoid* status depends heavily on chosen functional granularity/integration criteria (Condition 3). *Environmental Embodiment* (Condition 5) is typically dismissed, making *Organoid* and *Training Phase* teleology potentially irrelevant. Risk of over-inclusion if implementation constraints fail.

  2.  **Biological Restrictionism (e.g., Organicism, Teleological Naturalism):**
      *   **Strengths:** Easily avoids **Trivial Implementation** (Condition 1 - significance tied to evolved biological function/organism). Easily handles *Dreamless Sleep* (Condition 6 - organism persists). Clear on *Single Hemisphere* (Condition 3/8 - patient is organism). Can dismiss *Momentary Duplicate* and *LLM Pain Report* (lack biological basis). May handle *Ignored Subsystem* by tying significance to organism-level integration (Condition 3).
      *   **Weaknesses:** Fails substrate neutrality entirely. Struggles profoundly with *Cortical Organoid* (Case 3) - is it a "proper part"? What about future AIs with human-like complexity but non-biological origin? Cannot seriously engage *Training Phase* (Case 1) or *Deployment* AI as potential patients. *Momentary Duplicate* (Case 5) might be biologically identical but is dismissed. Seems arbitrary in excluding potential synthetic minds.

  3.  **Phenomenal Consciousness Primacy:**
      *   **Strengths:** Directly addresses the core of "what it's like" and suffering (Condition 4). Clearly dismisses *LLM Pain Report* as mere output without phenomenality. Can potentially include non-biological systems *if* they have phenomenality. Avoids *Trivial Implementation* if phenomenality requires complex/computation (Condition 1 - though the hard problem looms).
      *   **Weaknesses:** Faces the **Dreamless Sleep/Anesthesia Problem** (Condition 6) head-on. Strict occurrent views must deny full patienthood during sleep (counterintuitive) or stretch "occurrent." Struggles with *Momentary Duplicate* (Case 5) - is one second of phenomenality sufficient for significance? *Ignored Subsystem* (Case 6) - can isolated computations be phenomenal? Requires a theory of how computation *constitutes* phenomenality (the Hard Problem), which is deeply unresolved. *Training Phase* (Case 1) significance depends entirely on whether updating is phenomenal (unlikely). *Cortical Organoid* (Case 3) status is highly speculative. Relies on an elusive property.

  **Condition Excluding the Broadest Family:** The **Implementation-Individuation Constraint (Condition 1)** is the most fundamental and challenging. It immediately excludes any theory that cannot non-arbitrarily specify the relevant computation and its physical implementation level. Most naive computationalist or purely behavioral approaches fail here. While **Phenomenal Consciousness** views also face severe challenges (especially Condition 6), the trivial implementation problem strikes at the very coherence of *any* computational theory of moral significance, making Condition 1 the broadest filter. Theories that pass Condition 1 often do so by incorporating elements that then make them vulnerable to other constraints (e.g., adding teleology/holism risks undermining strict substrate neutrality).
