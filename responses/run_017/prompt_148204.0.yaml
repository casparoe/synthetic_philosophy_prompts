prompt: |-
  I'm taking a seminar on the metaphysics of virtual worlds right now and I keep feeling like the positions we've been given are talking past each other, so I want to run them on a case I actually know something about: the EVE Online heist everybody calls Black Sunday (I think that's the name) from the mid-2000s. The facts as I remember them, and please just grant them even if I've mangled a detail: a group of players founded a small corporation and spent something like ten months infiltrating a much bigger, richer, mostly-industrial player corp — running mining ops, being useful and chatty, getting one of their own voted into a director role with hangar access — and then on one coordinated evening they ganked the target corp's CEO, cleaned out the corp wallets and hangars, resigned en masse, and made off with in-game assets that were reportedly worth a five-figure sum in real money on grey-market currency sites at the time. As I understand it the devs ruled it legitimate gameplay and nobody was banned, while the game's own terms of service say everything in the game belongs to the company and selling it for real cash is forbidden. Take all of that as given.

  We've been handed three accounts of what a virtual object even is: (a) code-reductionism, on which talk of a stolen battleship is just shorthand for patterns in a database plus what players were disposed to do; (b) institutionalism, on which virtual objects are status objects like money or chess positions — real, but constituted by rules plus uptake, so nothing "over and above" the practice yet not eliminable either; (c) fictionalism/pretense, on which the assets are props in a game of make-believe and the only real facts are facts about what the players imagined and felt. I want a careful mapping, not a vibe: on each account, was there an object that changed hands, and was there a theft? What exactly did the people who'd sunk ten months of real evenings into that corp lose — and does it matter that EVE losses are permanent in a way that, say, a respawning death in WoW isn't? Then the bit I can't get straight: whose institution is doing the constituting? The EULA says the stuff is CCP's; the grey market priced it in dollars; the player community plainly treated the hangar as the corp's. Does institutionalism just fracture into competing institutions here, or does that show it was the wrong kind of account? And on harms, two of my classmates have tests I half-invented in my notes: the substitution test — if the identical year of trust-building and betrayal happened over email in a volunteer organisation, we'd call it a real harm, so what work is "it's a game" doing? — and the permission defence — the game's rules permit the move, permitted moves don't wrong the player, as when I take your queen.

  A couple more things, then I'll shut up. First, the reverse direction: which of the three accounts does this episode actually confirm, which does it embarrass, and which does it simply not speak to — say so explicitly where a theory is silent rather than squeezing an answer out of it. Second, settle an argument: my study buddy says the harm was obviously real because the victims were genuinely upset, and I think that's too quick, since people get genuinely upset about novels and about their football team losing, and nobody concludes that fictional characters were wronged. Which way does the distress datum actually cut, and does your verdict change for a five-minute gank versus a ten-month con, or for a world where the ships come back?
reasoning: |-
  Okay, the user is in a metaphysics seminar about virtual worlds and is confused about different positions. They want to apply three theories to the EVE Online Black Sunday heist. Let me start by recalling the main points of each theory: code-reductionism, institutionalism, and fictionalism.

  The user provided specific details about the heist: infiltration over ten months, theft of assets worth real money, devs allowing it, EULA stating everything belongs to CCP. They need a careful mapping for each theory: was there an object, was it theft, what was lost. Also, whose institution constitutes the objects? The EULA vs. player community vs. grey market. Then there's the harm aspect with the substitution test and permission defense.

  First, for code-reductionism. Virtual objects are just code and player dispositions. So the "theft" is just data changes in CCP's database. The loss is about disrupted playtime and effort. The real-world money from grey markets isn’t part of the game's code, so it's irrelevant here. This theory doesn't see it as theft since no physical property was taken. Permanent loss in EVE matters because it affects player dispositions more than respawning games.

  Institutionalism is trickier. Virtual objects are status functions created by collective acceptance. Players and devs are the community that upholds these rules. The heist was legitimate per game rules, so institutional theft didn't occur. But the EULA complicates things. CCP owns the assets, but players treat them as theirs. Grey markets are external, so maybe not part of the game's institution. The harm here is betrayal of trust within the player community, not theft of property. Permanent loss intensifies the harm because the effort is unrecoverable.

  Fictionalism sees it all as pretense. The assets are props in a make-believe world. The theft is part of the fiction, so no real theft occurred. The loss is about emotional investment in the fiction. Real distress is from broken social bonds, not property loss. Permanent loss makes the fiction more engaging, hence stronger emotions.

  Whose institution? The game's rules are primary, but player communities add layers. The EULA states ownership, but players' collective acceptance creates the in-game property. Grey markets are external, so not constitutive of the game's objects. Institutionalism handles this by prioritizing the game's institutional framework.

  Harms: Substitution test suggests that similar actions in real life would be harm, so why not in games? Permission defense says permitted moves aren't wrong. Institutionalism might say that within the game, it's not theft because the rules allow it, but the betrayal is a social harm. Fictionalism separates real harm from in-game actions.

  Which theory does the heist support? It challenges code-reductionism by showing social structures matter. Supports institutionalism because player actions and rules define the reality. Fictionalism isn't embarrassed but shows the emotional stakes. Distress alone doesn't prove real harm; context matters. The duration and permanence amplify emotions, but don't change the metaphysical status.

  The user's deeper need might be understanding how abstract theories apply to real cases, resolving confusion about competing positions. They might also want to grasp the implications for virtual property rights and harm in digital spaces. Ensuring each theory is addressed methodically, highlighting where they conflict or align, will help clarify their seminar material.
answer: |-
  Here's a meticulous mapping of the three metaphysical accounts applied to the EVE Online "Black Sunday" heist, addressing your specific questions point-by-point:

  ### 1. **Code-Reductionism**
     - **Virtual Object Status:** The "stolen battleship" is purely a pattern in CCP's database. Its "transfer" is a series of permission flag changes and asset ID reassignments within the code.
     - **Theft Occurred?** *No*, in any meaningful sense. Data was manipulated according to programmed rules. The "loss" is a subjective player experience arising from code-enforced consequences.
     - **What Was Lost:** Players lost *time investment* (10 months of playtime) and *dispositional opportunities* (future actions they could have taken with those assets, now blocked by code). Permanent loss matters here because it irreversibly alters future player dispositions (e.g., they can no longer undock that ship).
     - **Harm Analysis:** The "substitution test" fails. Trust-building in a volunteer org creates *social capital* rooted in real-world institutions; in EVE, it creates *code-enabled permissions*. The "permission defence" holds: the code allowed the director role's actions, so no rules-based wrong occurred.

  ### 2. **Institutionalism**
     - **Virtual Object Status:** The assets were *real status objects* within EVE's institutional framework. Their existence depended on CCP's rules + player collective acceptance (treating hangars as "owned," wallets as "property").
     - **Theft Occurred?** *Institutionally, no; socially, yes.*
      - *Within EVE's Institution:* Actions were rule-compliant ("director" permissions functioned as designed). No institutional "theft" occurred.
      - *Within Player Social Institution:* A profound *social betrayal* occurred, violating norms of trust built over months. This is harm to *social capital*, not virtual property.
     - **What Was Lost:** *Status positions* (directorship, corp membership) and *institutional power* (access to resources governed by EVE's rules). Permanent loss intensifies harm by making status reversal impossible.
     - **Whose Institution?** A nested structure:
      - **CCP's Foundational Institution:** EULA declares ownership, but *enables* player institutions via game mechanics.
      - **Player-Constituted Institution:** Collective acceptance creates derivative "property" and "corporate ownership" within CCP's framework.
      - **Grey Market:** An *external*, parasitic institution leveraging player valuations but *not constitutive* of EVE objects (violates EULA).
      - *Resolution:* Institutionalism *doesn't fracture*; CCP's institution is foundational, but player practices create emergent institutional facts *within* it. Grey markets are external and non-constitutive.
     - **Harm Analysis:** "Substitution test" *partially works*: Harm exists in the *social betrayal*, akin to real-world trust violation. "Permission defence" *partially holds*: Rules permitted the asset transfer, but not the *deceptive social practices* enabling it.

  ### 3. **Fictionalism/Pretense**
     - **Virtual Object Status:** Battleships/cash are *props*. "Ownership" is imagined. Talk of "theft" is part of the collective pretense.
     - **Theft Occurred?** *Only within the fiction.* No real-world property changed hands. The only "transfer" was of *imagined narrative control* over game assets.
     - **What Was Lost:** *Imaginative investment* and *emotional narrative* (the story players built over 10 months collapsed). Permanent loss deepens the narrative stakes, making the pretense more immersive/impactful.
     - **Harm Analysis:** Distress is *real* but *about the fiction*, like grief over a novel's tragedy. "Substitution test" confuses contexts: Email betrayal involves real social bonds; EVE betrayal is *fictional-role betrayal*. "Permission defence" is coherent: Taking a "queen" or "ISK" is a permitted move within the game of make-believe.

  ---

  ### Your Specific Queries Addressed

  1. **Which theory does Black Sunday confirm/embarrass/silence?**
     - **Confirms Institutionalism:** Highlights how player practices + rules create *emergent social realities* (trust, betrayal) within a coded framework. Grey markets show player valuation *overflowing* the fiction.
     - **Embarrasses Code-Reductionism:** The intense social harm and complex institutional context can't be reduced to "just code." Player dispositions are shaped by *institutional meanings*.
     - **Silent on Fictionalism:** The episode neither confirms nor refutes it. Fictionalism can explain emotional responses but is indifferent to institutional nuances.

  2. **Whose Institution?**
     - As above: *Nested*. CCP's institution enables player-constituted institutions. Grey markets are external and non-constitutive. Institutionalism handles this by recognizing *layers of institutional fact*.

  3. **The Distress Datum:**
     - **Your stance is correct:** Distress alone doesn't prove *metaphysical reality* of virtual objects/harms. People cry over art/fiction without implying the *subject* is real.
     - **Why it feels different in EVE:**
       - **Duration/Permanence:** A 10-month con with permanent loss mirrors *real relationship-building*. It triggers *real psychological mechanisms* of trust/betrayal, unlike a 5-minute gank.
       - **Social Embeddedness:** EVE corps function as *proxy communities* with real human bonds, even if the "property" is fictional. Harm is to *real sociality*, not fictional objects.
       - **Grey Markets:** Blur the line by assigning real-world value, making loss *feel* tangible.
     - **Verdict:** Distress supports *social harm* (Institutionalism) or *narrative rupture* (Fictionalism), but not *property theft*.

  ### Summary Table: Was There Theft? What Was Lost?

  | Theory          | Virtual Object Exists? | Theft Occurred?                     | What Was Lost (Metaphysically)                     | Permanent Loss Impact          |
  |-----------------|------------------------|-------------------------------------|----------------------------------------------------|--------------------------------|
  | **Code-Reductionism** | No (only code)         | No (data altered per rules)         | Time, future dispositional opportunities           | High (irreversible code state) |
  | **Institutionalism**  | Yes (status object)    | No (rules-compliant), but social harm | Institutional status, social capital within game   | High (status unrecoverable)    |
  | **Fictionalism**      | No (prop in pretense)  | Only in fiction                     | Imaginative narrative, emotional investment        | Moderate (heightens narrative) |

  ### Key Resolution
  Black Sunday showcases **Institutionalism** as the most robust account: It explains why the *social betrayal* feels real (emergent institutional facts within player practices) while acknowledging that the *asset transfer* wasn't theft (due to CCP's foundational rules). The grey market is a red herring—it exploits but doesn't constitute EVE's reality. Your "substitution test" reveals *social harm*, not property harm; the "permission defence" absolves the *institutional act* but not the *social wrong*. Distress is real but rooted in broken human trust, not stolen digital objects—making EVE's permanence and depth critical to understanding its unique metaphysics.
