  The user is clearly frustrated that existing terminology (sphexishness, fixed action patterns, perseveration, functional fixedness) doesn't capture what they're seeing - which seems to be flexible execution within rigid start/stop conditions. They're rejecting superficial labels and want rigorous conceptual boundaries. 

