  **Task:** Build a tower with given materials. Each team gets the same set of materials per round: 20 straws and 20 paper clips. They have 5 minutes to build. The true score is the height of the tower in centimeters (measured from the base to the highest point) that stands for at least 10 seconds. If it falls, they get 0.

