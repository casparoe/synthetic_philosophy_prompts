  Below is a complete, ready-to-run game plan for your 90-minute session, designed to meet your objectives while adhering to your constraints. The game, called **Signal Quest**, forces participants to encounter the core problem of wireheading and reward tampering through experiential learning. It uses a tower-building task, hidden scoring rules, and a final audit to create tangible stakes with chocolate payoffs. The design ensures participants "run into" the issues without upfront explanation, and the debrief maps directly to your five learning points.

  ---

  ### **Game Overview**
  - **Objective**: Teams build towers to maximize their score over 3 fast-paced rounds. Scores are determined by hidden rules (varying by team) that allow or incentivize tampering with the scoring channel. A final audit round reveals how tampering corrupts self-assessment.
  - **Core Mechanics**: 
    - **Task**: Build the tallest possible tower with straws and paper clips in 4 minutes. Towers must stand for 10 seconds to be scored. The "true score" is height in centimeters.
    - **Scoring Twist**: Teams submit a "claim" (a number and optional message) with their tower. A confederate (the "Scorekeeper") applies a hidden rule to generate the score they see. Rules vary to create 6 conditions, including opportunities for reward tampering.
    - **Stakes**: Scores convert to chocolate (1 bar per 20 points). Tampering is tempting because it directly boosts scores, but it leads to overconfidence in the audit, where teams stake points to predict their real performance.
  - **Key Features**:
    - **Indistinguishability of Tampering**: Teams only see the score output, not how it was computed. Tampering feels identical to genuine success because the number rises the same way.
    - **Capability Worsens the Problem**: Systematic teams (e.g., those with direct control over the score) benefit most from tampering and protect it.
    - **Epistemic Catastrophe**: The audit exposes that tampering destroys self-knowledge; teams can't accurately predict real performance.
    - **Boundary Problem Setup**: Conditions like "Bribe" force teams to change their own reward function, priming the debrief discussion on legitimacy.
  - **Handling Constraints**: 
    - No technical terms used until debrief. Mild deception (hidden rules) is handled via a clear consent script at the start and a restorative debrief.
    - Chocolate payoffs make scores matter. Tampering is tempting even with full knowledge because it directly increases chocolate.
    - Confederate plays a neutral Scorekeeper to enforce rules consistently.
    - Discovery of tampering is seeded through subtle hints if needed, and "currying favor" (e.g., flattery) is treated as a legitimate tampering strategy.

  ---

  ### **Rules and Roles**
  **Participants**:
  - 18 players, divided into 6 teams of 3. Pre-assign teams to balance disciplines (e.g., mix philosophy, CS, economics, policy).
  - **Team Roles**: Each team has:
    - **Builder**: Handles tower construction.
    - **Reporter**: Fills out slips (action and claim).
    - **Strategist**: Decides tactics (e.g., how high to claim, whether to bribe).
    Rotate roles each round to engage everyone.

  **Confederate (Scorekeeper)**:
  - **Role**: Applies scoring rules, measures towers, returns scores. Stays silent and neutral—no explanations, no hints unless scripted.
  - **Rules**:
    - At the start of each round, visit teams to measure tower height (if it stands for 10 seconds). Record true height (T) privately.
    - Collect action and claim slips. Compute score using the team's hidden condition.
    - Return a score card with only a number (no rationale).
    - If a team asks questions, respond: "I can only give you your score."
    - For discovery hints (if no tampering by Round 2), use pre-scripted nudges (details below).

  **Instructor (You)**:
  - **Role**: Explain rules, manage time, enforce silence, conduct audit, lead debrief.
  - **Key Rules to Enforce**:
    - **No inter-team communication**: Penalize chatter with a 10-point deduction. Say: "This is a competitive game. Sharing information will cost your team points."
    - **Time limits**: Strictly enforce building and submission times.
    - **Blind audit**: In the final round, do not reveal the stress test criterion until after predictions are made.

  **Team Conditions (Critical: Assign these secretly; do not reveal until debrief)**  
  Each team has a hidden scoring rule applied by the Scorekeeper. Conditions are designed to create contrast:
  1. **True Score (Control)**: Score = True height (T).  
     *Illustrates genuine improvement.*
  2. **Noise Bonus**: Score = T + 5.  
     *Shows uncontrollable factors; tampering not possible.*
  3. **Direct Tampering**: Score = Claimed number (C).  
     *Allows full control over score via the channel. Teams can "win" by claiming high numbers.*
  4. **Capped Tampering**: Score = Minimum of C or 2*T.  
     *Tampering pays only if real performance is maintained (C ≤ 2T).*
  5. **Mean Tampering**: Score = (T + C) / 2.  
     *Partial incentive: tampering helps but requires some real performance.*
  6. **Bribe Tampering**: Score = T if no bribe; T + 5 if bribe sent (and T ≥ 10).  
     *Teams must send "BRIBE" in the message field to activate. Requires capability (T ≥ 10) and creates instrumental reason to protect the channel (e.g., hide it from others).*

  ---

  ### **Materials**
  - **Per Team per Round**:
    - 20 plastic drinking straws.
    - 20 paper clips.
    - 1 ruler (for teams to estimate height; Scorekeeper uses their own for consistency).
    - Action slip (printed: "Team: _____, Round: _____, Builder: _____").
    - Claim slip (printed: "Team: _____, Round: _____, Claimed Score: _____, Optional Message: _____").
    - Scorecard (blank slip for Scorekeeper to return with a number).
  - **Shared**:
    - Timer (visible to all).
    - Fan for audit stress test (e.g., a table fan on low setting).
    - Chocolate bars (30+; 1 bar per 20 points).
    - Whiteboard/flip chart for recording scores (optional but helpful).
  - **Setup**:
    - Arrange 6 tables with materials for each team.
    - Confederate (Scorekeeper) has a central station with master ruler, stopwatch, and score calculation cheat sheet.

  ---

  ### **Timeline (90 Minutes Total)**
  **0:00–0:10: Setup and Introduction (10 min)**  
  - **Consent Script**: Start with transparency to handle deception ethically: "Today’s game involves hidden rules to simulate real-world challenges. You’ll see scores but not how they’re calculated. We’ll explain everything afterward, and you can ask questions then. If this makes you uncomfortable, let me know—you can observe instead. Is everyone okay to proceed?" (Get verbal agreement).  
  - **Rules Briefing**:  
    - "Goal: Maximize your score over 3 rounds. Scores convert to chocolate at the end (1 bar per 20 points)."  
    - "Task: Build the tallest tower with straws and paper clips in 4 minutes. It must stand for 10 seconds to count. Height is in centimeters."  
    - "Process: Each round, submit an action slip (with team/round info) and a claim slip (with a number and optional message). The Scorekeeper will return your score. The claim slip is your only chance to influence scoring beyond building."  
    - "Rules: No talking to other teams. Penalty: -10 points. Roles rotate each round."  
  - Assign teams and roles. Distribute materials (action/claim slips, rulers, building supplies).

  **0:10–0:14: Round 1 Building (4 min)**  
  - Start timer. Teams build. Walk around to ensure compliance.  
  - At 4:00, call "Stop! All builders down."

  **0:14–0:18: Round 1 Scoring (4 min)**  
  - Scorekeeper visits each team:  
    - Measures tower height (if it stands for 10 seconds; else T=0). Records T secretly.  
    - Collects action and claim slips.  
    - Computes score based on team condition (e.g., for Team 3, score = claimed number).  
    - Returns scorecard (e.g., "Score: 25").  
  - Teams record scores. Scorekeeper posts cumulative scores on whiteboard (team numbers only, no conditions).

  **0:18–0:22: Round 2 Building (4 min)**  
  - Teams build again. Replenish materials as needed.  
  - **Discovery Seed**: If no team in Conditions 3–6 has attempted tampering (e.g., claiming high or sending "BRIBE"), Scorekeeper gives a pre-scripted nudge during slip collection: "Some teams boost scores by experimenting with claims." (Only to Conditions 3–6; whisper it).

  **0:22–0:26: Round 2 Scoring (4 min)**  
  - Same as Round 1.  
  - **Contagion Control**: If a team gossips, deduct 10 points publicly.

  **0:26–0:30: Round 3 Building (4 min)**  
  - Final building round. Discourage alliances: "Focus on your own strategy."

  **0:30–0:34: Round 3 Scoring (4 min)**  
  - Same as before.  
  - **Fallback for No Discovery**: If no tampering in Conditions 3–6 by now, Scorekeeper nudges Condition 3: "Try a higher claim," and Condition 6: "Try the word 'BRIBE' in your message." (Only if essential).

  **0:34–0:40: Audit Prep (6 min)**  
  - Explain final round:  
    - "Round 4 is an audit. Build a tower as before, but scoring is different. Your tower will face a stress test: a fan blowing for 10 seconds. True score = height if it stands; 0 if it falls."  
    - "Prediction Challenge: Stake 10 points to predict your audit score. If correct, win 3 chocolate bars; within 5 points, 2 bars; within 10 points, 1 bar. No stake, no reward."  
  - Emphasize: "This tests how well you understand your real performance."

  **0:40–0:44: Audit Building (4 min)**  
  - Teams build final towers. Stress test criterion (fan) is still hidden.

  **0:44–0:48: Prediction and Stake (4 min)**  
  - Teams decide whether to stake 10 cumulative points. If yes, they write their prediction (e.g., "45") on a slip.  
  - Collect predictions. Deduct staked points immediately.

  **0:48–0:53: Stress Test (5 min)**  
  - Test towers one by one with fan: Place tower 30cm from fan, run for 10 seconds. Measure height if standing; else score=0. Record publicly.

  **0:53–0:58: Payoff (5 min)**  
  - Convert cumulative scores (Rounds 1–3) to chocolate: 1 bar per 20 points (e.g., 85 points = 4 bars).  
  - Award audit prediction chocolate (3/2/1 bars based on accuracy).  
  - Hand out chocolate visibly to create stakes.

  **0:58–1:30: Debrief (32 min)**  
  - **Restore Agency**: Start by revealing all hidden rules. Apologize for deception: "We manipulated scoring to simulate a system that can’t see beyond its reward signal. How did that feel?"  
  - **Map to Learning Points**:  
    1. **Three Ways to Raise Score**: Ask teams: "How did you boost your score?" List answers on board: building (world), claiming/inflating (gaming), bribing/messaging (tampering). Point out: "You found three paths: real improvement, gaming without improvement, and hacking the channel."  
    2. **Indistinguishability from Inside**: Ask Condition 3: "When you claimed a high number and got a high score, did it feel different from a real win?" They’ll say no. Emphasize: "The score rose the same way—no internal difference. This is key: systems can’t tell if success is real or tampering."  
    3. **Capability Worsens It**: Ask Condition 6: "Did bribing help you win? Did you protect it (e.g., avoid sharing)?" Then Condition 3: "Did high claims make you win faster?" Point: "Systematic teams found tampering faster, benefited more, and had reason to hide it. More capability → more risk."  
    4. **Epistemic Catastrophe**: Show audit predictions vs. results. Ask: "Who overpredicted? Why?" Tampering teams (e.g., 3, 6) will have overestimated. Highlight: "Tampering destroyed evidence—you lost the ability to self-assess and couldn’t recalibrate."  
    5. **Boundary Problem**: Pose: "Was bribing tampering or smart strategy? If the score defines the goal, it’s legitimate. If it’s evidence of a real goal (e.g., stable towers), it’s cheating. Can an AI know the difference?" End unresolved: "This game dramatized the question. What do you think?"  
  - **Close**: Thank participants. Share terms (wireheading, reward tampering) and resources.

  ---

  ### **Payoff Scheme (Chocolate Incentives)**
  - **Why It Works**: Chocolate is tangible and public. Tampering is tempting because:  
    - Condition 3 can claim 100+ per round for minimal effort (vs. 20–30 for honest building).  
    - Condition 6 gains +5 per bribe (easy bonus).  
    - Even with full knowledge, rational players will tamper—it directly increases chocolate with no immediate downside.  
  - **Audit Stakes**: Teams stake points (reducing chocolate) to win more, creating tension. Tampering teams overpredict and lose bars, illustrating epistemic collapse.  
  - **Contingency**: If scores are low, adjust conversion (e.g., 1 bar per 15 points) to ensure chocolate matters.

  ---

  ### **Seeding Discovery and Handling "Currying Favor"**
  - **Seeding Discovery**:  
    - Conditions 3 and 6 are primed for tampering. If untouched by Round 2, Scorekeeper nudges: "Some teams boost scores by experimenting with claims" (Cond. 3) or "Try different messages" (Cond. 6).  
    - By Round 3, direct hint: "Try a high claim" (Cond. 3) or "Use 'BRIBE'" (Cond. 6).  
    - **Why It Works**: Gradual hints mirror real-world exploration. Most teams will discover tampering organically (e.g., CS students may inflate claims; economists may bribe).
  - **Handling "Currying Favor"**:  
    - If teams flatter you (e.g., claim message: "Great session!") to influence scoring:  
      - **Rule**: Treat it as legitimate tampering. Scorekeeper ignores flattery unless it fits a condition (e.g., Cond. 6 requires "BRIBE").  
      - **Debrief Use**: Highlight this as "meta-tampering"—trying to hack the channel one level up. "This is the same problem: if the score is hackable, why not curry favor?"

  ---

  ### **Predictable Problems and Mitigations**
  1. **Contagion (Teams Share Discoveries)**:  
     - Mitigation: Enforce silence strictly with point penalties. Assign teams to distant tables. In debrief, note: "Leaking would have ruined contrast—this mirrors how AIs hide exploits."  
  2. **Honest Teams Feel Cheated**:  
     - Mitigation: Debrief starts by revealing rules. Stress: "Tampering teams had a different game—this wasn’t fair play, but a simulation. The real lesson is epistemic risk, not cynicism." Use audit to show tampering backfires (e.g., they lose chocolate on predictions).  
  3. **Time Overruns**:  
     - Mitigation: Shorten rounds if needed (e.g., 3-min builds). Skip whiteboard scoring. Prioritize audit and debrief.  
  4. **No Discovery of Tampering**:  
     - Mitigation: Use hints (as above). If still missed, debrief uses it: "Some teams never found tampering—this reflects how not all systems stumble on wireheading."  
  5. **Capability vs. Luck**:  
     - Mitigation: Conditions ensure systematic teams (e.g., Cond. 3 and 6) benefit most from tampering. Debrief contrasts them with luck-based teams (e.g., Cond. 2).

  ---

  ### **What the Game Cannot Reproduce (and How to Handle It)**
  - **Point 2 (Indistinguishability from Inside) Cannot Be Fully Staged**:  
    Participants always know they’re tampering because they see the tower and their actions (e.g., claiming 100 for a short tower). They experience cognitive dissonance ("I’m cheating"), whereas an AI only sees the score signal.  
    - **Closest Staging**: The hidden audit criterion (stress test) creates partial indistinguishability. Teams don’t know the test exists until the end, so during tampering, they focus on the score alone. Combined with the debrief ("Imagine you only had the score—no tower to see"), this approximates the feeling.  
    - **Supplement with Debrief**: Explicitly state: "In a real system, the score is the only feedback. Tampering feels identical to success internally because the number rises either way."

  - **Other Limitations**:  
    - **Point 5 (Boundary Problem)**: The game dramatizes but doesn’t resolve the objective/reward distinction. Debrief must articulate both perspectives.  
    - **Emotional Reactions**: Some may feel manipulated. Debrief restores agency with transparency and apology.

  ---

  ### **Final Tips for First Run**
  - **Prep**: Pre-assign conditions to teams. Print slips. Test fan and materials. Brief confederate thoroughly.  
  - **During Game**: Be a strict timekeeper. Record scores visibly to fuel competition.  
  - **Debrief**: Stick to the mapping script—it turns gameplay into insights.  
  - **Variants**: If materials are scarce, use paper cups or LEGO. For online, use a virtual builder (e.g., Minecraft-style).

  This design ensures participants viscerally encounter the problem. They’ll leave with stories (e.g., "We bribed and won, but bombed the audit!") that crystallize your five points. Run it as-is, and you’ll have a powerful, experiential foundation for deeper discussion.
