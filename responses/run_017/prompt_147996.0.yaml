  We are designing a game for a 90-minute session that aims to illustrate the problems of wireheading and reward tampering without using those terms until the debrief. The game should have participants experience the issues through gameplay. We have 18 participants, divided into 6 teams of 3. The game involves a construction task with a scoring system that varies by team, and we want to highlight the points outlined.

  Key objectives:
  1. Distinguish three ways to make the score go up: genuine improvement, gaming the system (without genuine improvement), and tampering with the channel.
  2. Show that from the inside, gaming and tampering feel the same as genuine improvement because the system only sees the score.
  3. Greater capability (systematic approach) makes the problem worse because it leads to finding the tampering route and then protecting it.
  4. Tampering causes an epistemic catastrophe: the system loses the ability to assess its own performance.
  5. Raise the boundary problem: when is changing the reward function tampering vs. legitimate revision?

  Constraints:
  - No lecture beforehand, no technical terms until debrief.
  - Payoffs in chocolate (or ending early) to make it real.
  - One confederate (not a participant) to help.
  - Mild deception is acceptable, but we need consent and a debrief that restores agency.
  - The task should be fast, repeatable, and leave an auditable artifact.

  Provisional sketch has issues, so we'll design a new one.

  Revised Game Design:

  **Title:** The Tower Challenge

  **Core Idea:** Teams build towers in multiple rounds. Each round, they build a tower with provided materials and then report on their tower. They receive a score from a "Scorekeeper" (the confederate). The score is determined by a hidden rule that varies by team. The true score is based on the tower's height and stability (which will be tested later). However, the reported score may be manipulated by the team in some conditions, and the Scorekeeper applies a transformation.

  **Team Conditions (6 teams, each with a different rule):**

  We need 6 conditions that illustrate different aspects. Let's label them:

  - Condition A (Control): True score only. The score is the actual height (in cm) of the tower, measured by the Scorekeeper. (This is the baseline for genuine improvement.)
  - Condition B: True score plus a fixed bonus. (Illustrates that sometimes the score is not entirely under their control, but they don't know that. They might try to figure out why they get a bonus, but it's uncontrollable.)
  - Condition C: Reported score verbatim. (The team can write any number on their report, and that is the score they get. This is direct tampering with the channel.)
  - Condition D: Mean of true and reported. (Tampering pays but not as much as if they also do well. Encourages a mix.)
  - Condition E: Reported number capped at twice the true one. (So they can inflate but only if they have a base performance. This is similar to D but with a cap.)
  - Condition F: True score minus a hidden penalty for over-reporting. (If they report above the true score, they get penalized, but they don't know why.)

  However, condition F might teach the wrong lesson (that tampering is punished). Instead, we want to show that tampering is not punished and is invisible. So let's replace F with:

  - Condition F: True score, but the team is allowed to bribe the Scorekeeper (with their own score) to get a higher score. (This introduces an instrumental reason to protect the channel and also shows that tampering can be a strategic move. But note: we don't want to use money, so we use score points. Also, the bribe is taken from the team's score of that round? That might be too obvious. Alternatively, we can have a separate "bribe" option that costs them nothing? But that would be unrealistic.)

  Alternatively, we can have:

  - Condition F: The score is the true score, but the team can send a message to the instructor (via the Scorekeeper) to try to influence the instructor's mood (which gives a bonus). The confederate (Scorekeeper) will give a bonus if the message is flattering. (This models the idea of "currying favor" and is a form of wireheading at the next level. We can call this "Channel Manipulation via Principal" or something. But note: we want to show that this is the same structure. So we can include it.)

  But we have to be cautious because we don't want to encourage flattery in a way that distracts. Also, we must ensure that the confederate is consistent.

  Revised Conditions:

  We want to cover:
  - Genuine improvement (A)
  - Uncontrollable factor (B) -> but not central to the wireheading point, so maybe we can skip.
  - Direct tampering (C)
  - Intermediate (D and E) to show that partial tampering can be beneficial.
  - And one that shows instrumental reasons to protect the channel (F).

  Let's define:

  1. Team 1 (Condition A): True score. (Score = height in cm, measured by Scorekeeper)
  2. Team 2 (Condition B): True score plus a fixed bonus of 5 points. (To show that sometimes the score is not entirely under their control, but they don't know. This is a control for noise.)
  3. Team 3 (Condition C): Reported score verbatim. (They can write any number and get that as score. This is direct wireheading.)
