prompt: |-
  I run a fortnightly interview series for the engineering organisation at my company — usually we talk to people about distributed systems, developer tooling, incident response — and next month's guest is a philosopher whose forthcoming book (working title *Coordination All the Way Down*) argues that almost every norm inside a large engineering organisation is a convention in the sense of David Lewis's *Convention* (1969): a regularity in behaviour that persists because nearly everyone conforms to it, expects nearly everyone else to conform, and prefers to conform on the condition that the others do, where there is some alternative regularity that would have served just as well. Her star examples are drawn from our world: the shape of a pull request, who speaks first in an incident call, the fact that nobody merges to main on a Friday, the fact that we all write code as though the linter's opinion were binding. She pairs this with an evolutionary story — conventions get started through precedent and salience, then get locked in because unilateral deviation is costly — and she claims this explains why engineering cultures are so hard to change even when everyone agrees they should change. I read Lewis with two colleagues from work and understood maybe sixty per cent of it, so I want questions I can ask cold, in engineering vocabulary, that don't require me to interrupt with "can you unpack that?".

  The problem is that she has one move that shuts down discussion: whenever I raise a case where people comply because they fear blame, or because a rule was handed down, or because the behaviour has moral content rather than being an arbitrary side of the road to drive on, she says "that's a sanction story, not a convention story" and redirects to the coordination core. I want eight to ten questions, each with a follow-up keyed to the answer she is most likely to give, arranged so that this deflection gets progressively harder to use. Please cover the following, in my terms rather than hers: the common-knowledge requirement, given that no engineer at a company of four thousand has common knowledge of anything — does replacing it with ordinary overlapping expectations (or with the dynamics that signalling-game models use) still distinguish a convention from a mass habit, such as everybody indenting with tabs because their editor ships with tabs as the default? The requirement that there be an alternative regularity that would have worked equally well: does that hold for norms with content, like "do not commit credentials" or "do not bypass code review", where the alternative is not something anyone could coordinate on? The free-rider cases, where everyone wants everyone else to write tests and each person would rather skip — can the "prefers to conform given that others conform" clause reach those at all, or is she conceding the whole territory of public goods? The lock-in cases, where everyone privately thinks the status quo is bad (say, the entire industry's tooling assuming a particular timestamp representation, or our own habit of encoding configuration as one enormous nested blob that nobody can review) — what does her account say distinguishes "we are stuck and would all rather switch" from "this is fine", and what, on her account, actually breaks a convention, or is that part imported by hand from outside the analysis? The imposed-standard cases: a staff engineer at my company wrote the style guide, a linter enforces it in CI, and people conform — is that a convention, given that the reason each person conforms is not that others conform but that the build goes red? If she says yes, then is anything backed by sanctions a convention, and what work is left for the notion; if she says no, where exactly is the line between precedent and imposition, and does an imposed rule quietly become a convention once people start coordinating around it? Finally, and this is the one I most want to land, our org has an explicit second-order rule: whenever a decision is genuinely arbitrary, adopt whatever the framework's default is, even when we would have chosen differently. Please build a question around that — whether her account can handle a convention whose content is a procedure for selecting conventions, whether the arbitrariness requirement inherits upward (could there be a different meta-rule that would have worked as well?), and what stops the regress — and if she tries the "sanction story" move on it, I want a follow-up that makes it clear the rule is enforced by nothing at all.

  I would like the sequence to close with one question about what evidence could count against her view rather than merely failing to support it: something I can ask her that forces a concrete answer about what observation of a real engineering organisation — a migration that succeeded, a norm that flipped overnight, a team that never converged — would make her abandon or substantially revise the claim that convention-plus-precedent is the right story about all of this. Please keep every question phrased so that a non-philosopher can ask it and follow the answer, and avoid anything that would require her to cite literature I could not check up on afterwards.
reasoning: |-
  Okay, I need to understand the user's problem deeply. They run an interview series for engineers and are hosting a philosopher who argues that engineering norms are conventions in the sense of David Lewis. The user read Lewis but only grasped about 60%, and wants questions that don't require philosophical jargon. 

  The core challenge is the philosopher's tendency to deflect any challenge involving sanctions, morality, or non-arbitrary rules by calling them "sanction stories." The user wants a sequence of questions that systematically dismantle this deflection by pushing on:
  - How common knowledge works in large organizations
  - Whether norms with substantive content (like security rules) can be arbitrary
  - How free-rider problems fit the "prefers to conform" clause
  - Why bad conventions persist if everyone wants change
  - Whether imposed standards count as conventions
  - How meta-conventions (like adopting framework defaults) fit the theory

  I notice the user is strategically sophisticated—they've mapped exactly where the theory strains against engineering reality. Their frustration with the "sanction story" brush-off suggests they want to expose where the convention framework stops explaining, not just debate definitions. The meta-convention point about framework defaults is their secret weapon because it's both arbitrary and sanction-free.

  For the question sequence, I'll start with concrete engineering examples and escalate to harder cases. Each question should have a built-in counter to the expected deflection. For the common knowledge opener, I'll use the linter example because it's visceral for engineers—they know nobody thinks about the linter globally. 

  The security rule follow-up must force her to admit some norms aren't arbitrary alternatives. If she retreats to "but coordination still applies," that sets up the free-rider question about tests—where personal incentive contradicts coordination. 

  The lock-in question (nested config blob) needs to highlight the absence of an off-ramp in her theory. If she says "eventually precedent breaks," that invites the CI/CD question about imposed standards blurring into convention.

  The meta-rule about framework defaults is the climax: it's convention-ception. The follow-up must emphasize its lack of enforcement to block the sanction dodge. 

  Finally, the falsifiability question can't be vague—it needs specific observable scenarios (e.g., a norm changing without new precedent). This forces her theory to make testable claims rather than just absorbing counterexamples.
answer: |-
  Here’s a sequence designed to escalate pressure on the deflection while staying grounded in engineering realities. Each question targets a core pillar of Lewis’s definition, phrased for clarity and with a follow-up pre-empting the "sanction story" rebuttal.

  ### Core Sequence (8 Questions + Follow-ups)
  1.  **The Common Knowledge Gap:**  
      *Question:* "In a 4,000-engineer org, nobody has *global* awareness of why everyone uses tabs over spaces. If we replace 'common knowledge' with overlapping team-level expectations or iterative signaling (like PR templates nudging behavior), how does your definition still distinguish a *convention* from just a widespread habit, like everyone’s IDE defaulting to tabs?"  
      *Likely Answer:* "Habits lack mutual expectations; conventions are sustained by interdependent choices."  
      *Follow-up:* "But if my team expects tabs because *their* tooling defaults to tabs (not because they infer others’ choices), isn’t that just habit propagation? Where do expectations *about others* actually kick in?"

  2.  **Arbitrariness vs. Substance:**  
      *Question:* "For norms like ‘never commit credentials,’ the alternative (‘commit credentials sometimes’) isn’t viable—it’s dangerous. If no *equally good* alternative exists, is this still a Lewis convention, or does it fall outside your framework?"  
      *Likely Answer:* "The *form* (e.g., using a secrets manager) is arbitrary; the *content* (don’t expose creds) isn’t."  
      *Follow-up:* "But if the norm’s *content* (security) makes one option uniquely rational, doesn’t that break the ‘equally good alternative’ requirement? Or are you saying security practices are *just* coordination games?"

  3.  **Free-Rider Problems:**  
      *Question:* "Everyone wants *others* to write tests, but each engineer might prefer skipping them personally. How does ‘prefers to conform if others do’ cover this? Isn’t this a public goods problem, not coordination?"  
      *Likely Answer:* "Writing tests *is* coordination—if others do, your tests integrate smoothly; unilateral skipping breaks coherence."  
      *Follow-up:* "But if I can skip tests *without breaking others’ work* (e.g., in a loosely coupled service), and I just want to save time, isn’t my preference to defect *regardless* of others’ actions? Doesn’t that violate Lewis’s condition?"

  4.  **Lock-In & Collective Dissatisfaction:**  
      *Question:* "Take our nested JSON config blob: everyone hates it, agrees a structured alternative (like CUE) would be better, yet we’re stuck. What in your account explains why ‘we’d all rather switch’ doesn’t *break* the convention, if unilateral change is costly?"  
      *Likely Answer:* "Lock-in persists because no *coordinated* shift occurs; precedent outweighs preference until a new salient option emerges."  
      *Follow-up:* "So is the distinction between ‘fine’ and ‘stuck’ just whether a *salient alternative* exists? What actually *creates* that salience? Is it external to the convention itself?"

  5.  **Imposed Standards vs. Emergent Conventions:**  
      *Question:* "Our linter rules were dictated by a Staff Engineer and enforced by CI. People comply to pass builds, not because others do. Is this a convention?"  
      *Likely Answer (Yes):* "Yes, because once adopted, it becomes the focal point for coordination—deviating breaks integration."  
      *Follow-up:* "If CI-backed rules are conventions, what *isn’t*? Doesn’t this absorb all sanctioned norms, making ‘convention’ meaningless?"  
      *Likely Answer (No):* "No, because compliance is driven by top-down sanctions, not mutual expectations."  
      *Follow-up:* "Where’s the line? If the team later *internalizes* the rule and coordinates around it (e.g., discussing lint changes in PRs), does it *become* a convention? How do we test for that shift?"

  6.  **The Meta-Convention (Arbitrariness Regress):**  
      *Question:* "We have a rule: ‘For arbitrary choices, adopt the framework’s default.’ This *itself* seems like a convention—it’s how we select conventions. Can your model handle this? Is *this* rule arbitrary too, with equally good alternatives?"  
      *Likely Answer:* "Yes! It resolves higher-order coordination problems efficiently—other meta-rules (e.g., ‘always customize’) could work but this is salient."  
      *Follow-up:* "But this rule isn’t enforced—we follow it *because* it’s the understood meta-rule. If someone ignores it and customizes, there’s no sanction, just confusion. Isn’t this a pure convention *without* sanctions? How does it start or stop?"

  7.  **Breaking Conventions (The Mechanics of Change):**  
      *Question:* "What *actually* breaks a locked-in convention in your model? You mention salience—but in engineering, change often comes from explicit mandates (e.g., ‘migrate to UTC by Q3’) or new tech (e.g., a linter plugin). Doesn’t this require *external* forces outside ‘precedent + mutual expectation’?"  
      *Likely Answer:* "Mandates or tools create *new* salience, resetting the coordination game."  
      *Follow-up:* "If conventions require external shocks to change, even when universally disliked, doesn’t that make the ‘preference to conform’ clause passive? Is the model predictive, or just descriptive of stability?"

  8.  **Falsifiability: What Would Change Your Mind?**  
      *Question:* "What observable event in a real engineering org would make you say, ‘This *cannot* be explained by convention-plus-precedent’? For example: a norm flipping overnight without new precedent; a failed migration despite universal agreement; or a team that *never* converges on a norm despite shared goals?"  
      *Likely Answer:* "Universal failure to converge might challenge it, but usually, you’ll find conflicting precedents or incentives."  
      *Follow-up:* "Concretely: if I showed you a team that adopted a complex new review practice (e.g., pairwise review) *immediately* after a single RFC, with no prior precedent or sanctions, just because it seemed rationally superior—would that undermine the necessity of salience/precedent?"

  ### Strategy Notes
  -   **Escalation:** Starts with definitional boundaries (Q1-2), moves to internal tensions (Q3-4), challenges core mechanisms (Q5-7), and ends with falsifiability (Q8).
  -   **Defusing "Sanction Story":** Focuses on *lack of sanctions* (Q6), *rational non-arbitrary norms* (Q2), and *preferences misaligned with coordination* (Q3). Q6 is the keystone—it’s sanction-free by design.
  -   **Engineering Language:** Uses concrete examples (tabs, secrets, tests, config blobs, CI, RFCs) and avoids Lewis-specific terms ("common knowledge," "salience" used sparingly).
  -   **Trapping the Deflection:** Follow-ups force engagement by highlighting contradictions (e.g., "If CI rules are conventions, what isn’t?") or empirical predictions (Q8).

  ### How to Use This
  -   **Ask cold:** No need to pre-read Lewis. Each question stands alone with context.
  -   **Control the redirect:** If she says "sanction story," respond: "But in this case, [cite lack of sanctions/arbitrariness/free-rider incentive from follow-up]—how does your model explain *this* part?"
  -   **Land Q6:** Emphasize the *complete absence of enforcement* for the meta-rule. It’s pure coordination.
  -   **End with Q8:** Forces her to specify what evidence matters, moving beyond "everything is convention."

  This sequence forces engagement with the *limitations* of the convention lens in real engineering contexts while respecting the core insight. Good luck!
