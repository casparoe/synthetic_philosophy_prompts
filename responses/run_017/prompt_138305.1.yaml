prompt: |-
  I chair the serious incident review panel at a ~500-bed hospital — we meet every other week, about 90 minutes per case, and the output that matters is a short "causal findings" section that says things like "the delay in giving antibiotics caused the septic shock" or "admission on a weekend contributed to the worse outcome." Those reports go to the family, to the department involved, and to legal, and they trigger things: a new protocol, mandatory training, sometimes a budget line. Six of us: two nurses, two physicians, a risk manager, and me. I did some philosophy as an undergrad, which is why I'm writing this, and nobody else on the panel has any formal training in it.

  I've become convinced we're making two specific messes and I want a procedure, not an explanation.

  Mess one: we conflate two quite different claims. (a) "this patient would not have died if the delay hadn't happened" — a one-off counterfactual about this admission — and (b) "if we changed the system so this kind of delay can't happen, future patients like this one do better" — a claim about what would happen under an intervention. These can come apart in both directions: sometimes (a) is true and (b) is false because this was a fluke that our fix wouldn't touch, and sometimes (b) is true and (a) is false because something else in that admission would have killed her anyway and the delay just happened to be there first. The family reads the report wanting (a); the department is supposed to act on (b). We write one sentence that pretends to be both.

  Mess two: we write findings about things nobody can say how to change. "Weekend admission," "frailty," "poor handover," "the patient's race." Nobody can tell me what we would actually do to set those to a value, or what else would move along with them if we did. Half the time the honest answer is that the intervention isn't specified, so we don't know what question we're even asking.

  So: write me a procedure the panel can actually run in our 90 minutes, as an ordered set of tests — what to ask first, what counts as a sufficient answer at each step given what we have (the chart, maybe two interviews, occasionally registry data; we can't randomize anything), where it stops with "no causal finding," and where it hands the decision to a person because the question is one of values and not facts. It has to do something useful with: counterfactuals that quietly rewrite earlier events ("if she hadn't been admitted Friday she'd have been seen by a different team entirely"), overdetermination, and causes we can't manipulate. Give us a small set of sentence templates for what we can defensibly assert at each exit point — the wording has to be readable by a grieving family and survivable in a deposition, and legal and I both sign off.

  Then run it on three: the delayed-antibiotics/septic-shock case; a "weekend admission caused the worse outcome" finding; and a case where the panel wants to write that the patient's race caused the worse outcome and the only real evidence is a disparity in our own numbers plus some notes about how staff spoke to her. Include at least one where the procedure gives me an answer I won't like. And tell me plainly where it will misfire on us and what it can't do.
reasoning: |-
  We are designing a procedure for a hospital serious incident review panel to produce causal findings that are clear, defensible, and actionable. The procedure must handle:
    - Distinguishing between (a) the counterfactual about the specific admission and (b) the effect of a system change on future patients.
    - Only making claims about causes that can be manipulated (or at least, where an intervention is specified).
    - Providing a clear output that can be used by families, departments, and legal.

  The procedure will be a step-by-step algorithm that the panel can run in 90 minutes. It will use the available data (chart, interviews, registry data) and will have exit points with specific sentence templates.

  Key concepts:
  1. **Counterfactual for the specific case (a)**: We are asking "In this specific instance, if X had not happened, would the outcome have been different?" This is about the past and specific to the patient.
  2. **Intervention effect (b)**: We are asking "If we change the system (by implementing a specific intervention) to prevent X, would that lead to better outcomes for future similar patients?" This is about the future and general.

  We must also avoid making causal claims about factors that we cannot change or for which we cannot specify an intervention.

  The procedure should be structured as a decision tree. We will have a series of tests. At each step, if the test fails, we exit with a specific conclusion (like "no causal finding" or a limited finding). If we pass, we proceed to the next test.

  We are particularly concerned about:
    - Overdetermination (where multiple causes are present and any one alone might have been sufficient).
    - Counterfactuals that change the past in ways that cascade (e.g., changing one event might change many others).
    - Non-manipulable factors (like race, frailty, weekend admission without a clear intervention).

  Proposed Procedure:

  **Step 0: Define the adverse outcome and the candidate cause(s)**
     - The panel must clearly state the adverse outcome (e.g., septic shock) and the candidate cause (e.g., delay in antibiotics).
     - If the candidate cause is not manipulable (or no intervention is specified) by the hospital, then we cannot use it for an intervention effect (b). We might still consider it for the one-off counterfactual (a) if we can, but note that for non-manipulable factors, even (a) might be problematic because we cannot set it independently.

  **Step 1: Is the candidate cause manipulable?**
     - Ask: "Can we specify an intervention that would change this candidate cause? And if so, what is it?"
     - If no, then we cannot make a finding about (b). We might consider (a) in Step 2, but note that if the factor is non-manipulable (like race or frailty), then we must be cautious about making any causal claim because it is not clear what the counterfactual world would look like (we cannot change race without changing many other things). For non-manipulable factors, we might instead describe an association and note that it is not a causal finding for the purpose of intervention.
     - If yes, then we have an intervention in mind (e.g., for "weekend admission", the intervention might be "increase weekend staffing" or "change the weekend coverage model"). We proceed to Step 2.

  **Step 2: One-off counterfactual (a) for the specific case**
     - We ask: "In this specific case, if the candidate cause had not occurred (or had been set to the desired state by the intervention), would the adverse outcome have been avoided (or significantly mitigated)?" 
     - We must consider the cascade: if we change the candidate cause, what else might change? We must avoid "silently rewriting" history arbitrarily. We use the available evidence (chart, interviews, medical knowledge) to make a judgment.
     - We consider overdetermination: if there are multiple sufficient causes, then even without the candidate cause, the outcome might have happened. In that case, (a) is false.
     - How to decide? We use a two-part test:
          a. **Necessity in the circumstances**: Was the candidate cause a necessary element in the actual sequence of events? (But note: necessary for what? For the outcome as it happened? We are interested in whether removing it would have prevented the outcome.)
          b. **But-for test**: But for the candidate cause, would the outcome have been avoided? (This is the standard legal test for causation in fact.)
     - However, in overdetermination cases (e.g., two simultaneous causes, either sufficient), the but-for test fails. Then we use the NESS test (Necessary Element of a Sufficient Set): was the candidate cause a necessary part of a set of conditions that was sufficient for the outcome? If so, then we can say it was a cause, but note that the outcome might not have been avoided if another sufficient set was present. However, in medical contexts, we often care about whether we could have prevented the outcome by removing one cause, even if there was an alternative cause. But if the alternative cause was also present and would have produced the same outcome, then we cannot say the outcome would have been avoided. So we must judge whether the removal of the candidate cause would have broken the chain.
     - Given time constraints, we focus on the but-for test and if overdetermination is suspected, we note it and then the one-off counterfactual (a) becomes ambiguous.

     - **Exit for Step 2**:
          - If we can confidently say (by but-for or NESS) that the outcome would have been avoided, then we have (a) true.
          - If we judge that the outcome would have happened anyway (due to overdetermination or other factors), then (a) is false.
          - If we are uncertain, we cannot assert (a).

  **Step 3: Intervention effect (b)**
     - We ask: "If we implement the intervention (specified in Step 1), would it lead to better outcomes for future similar patients?" 
     - This is a prediction about the future. We can use:
          - Evidence from the literature (if known to the panel in the meeting).
          - Data from our own hospital (e.g., registry data showing that when the cause is present, outcomes are worse, and the intervention would remove that cause).
          - Reasoning about the causal pathway: if the intervention breaks the causal chain, then we expect better outcomes.
     - We must consider side effects of the intervention: could it cause other problems? (But for simplicity, we focus on the direct effect on the outcome of interest.)

     - **Exit for Step 3**:
          - If we have strong evidence (from the literature, or from our data and a plausible mechanism) that the intervention would reduce the risk of the adverse outcome, then we have (b) true.
          - If we have evidence that the intervention would not change the outcome (e.g., because the candidate cause is not a major driver, or because the intervention doesn't break the chain effectively), then (b) is false.
          - If we are uncertain, we cannot assert (b).

  **Step 4: Formulate the finding**
     - We now have four possibilities:
          Case 1: (a) true and (b) true -> We can make both claims.
          Case 2: (a) true and (b) false -> The candidate cause did cause the outcome in this case, but changing it won't help future patients (e.g., because it was a fluke). We must report both.
          Case 3: (a) false and (b) true -> The candidate cause did not cause the outcome in this case (because something else would have caused it), but changing it would help future patients (e.g., because in future cases, without that cause, the outcome might be avoided). We must report both.
          Case 4: (a) false and (b) false -> We might say the candidate cause was not causal in this case and the intervention wouldn't help, but note: we might have made a mistake. We must be cautious.

     - We must also consider that sometimes we are uncertain about one or both.

     - We design sentence templates for each exit point.

  But note: we might not have time to do both (a) and (b) for every candidate cause. We must prioritize. We start with the candidate cause that is most salient and then move to others.

  We also note that we might have multiple candidate causes. We run the procedure for each one.

  Given time constraints (90 minutes per case), we might only have time for one or two candidate causes. So we focus on the ones that are most plausible and actionable.

  **Overall Procedure Outline:**

  1. **Define the adverse outcome and list candidate causes** (from the panel's discussion, chart, interviews). (Time: 10 minutes)
  2. **For each candidate cause, in order of priority (e.g., by apparent significance and actionability):**
     a. **Manipulability check**: If not manipulable, then we cannot make an intervention claim (b). We may still consider (a) if it is a manipulable factor by nature (like a delay) but if non-manipulable (race), then we skip to Step 2d. (Time: 5 minutes per candidate)
     b. **One-off counterfactual (a)**: Using the but-for test and considering overdetermination, decide (a). (Time: 15 minutes per candidate)
     c. **Intervention effect (b)**: Evaluate whether the intervention would help future patients. (Time: 15 minutes per candidate)
     d. **Formulate the finding for this candidate cause** and decide whether to move to the next candidate. (Time: 5 minutes per candidate)

  3. **If a candidate cause is non-manipulable**, we do not consider (b). We may still consider (a) if we can define a counterfactual without cascading changes, but we have to be cautious. For example, for race, we cannot change race without changing many other things, so we cannot do a counterfactual. We instead might note a disparity and describe it as a contributory factor without assigning causation. We provide a template for that.

  4. **Write the report section**: Include only the findings that passed the tests. If we have multiple candidate causes, we list them with their respective findings.

  **Sentence Templates:**

  - **For a candidate cause that passes both (a) and (b)**:
    "In this case, the [candidate cause] caused [adverse outcome]. If we implement [intervention], we expect to reduce the risk of [adverse outcome] in similar future cases."

  - **For (a) true and (b) false**:
    "In this case, the [candidate cause] caused [adverse outcome]. However, we cannot be confident that implementing [intervention] would prevent similar outcomes in the future because [reason]."

  - **For (a) false and (b) true**:
    "In this case, the [adverse outcome] would have occurred even without [candidate cause] because [reason]. However, we believe that implementing [intervention] would reduce the risk of [adverse outcome] in similar future cases."

  - **For (a) false and (b) false**:
    "We did not find that [candidate cause] caused [adverse outcome] in this case, and we do not expect that [intervention] would reduce the risk of [adverse outcome] in future cases."

  - **If we are uncertain about (a)**:
    "We cannot determine whether [candidate cause] caused [adverse outcome] in this case. [If we have an opinion on (b), then add:] However, we [do/do not] believe that [intervention] would reduce the risk of [adverse outcome] in future cases."

  - **If we are uncertain about (b)**:
    "In this case, the [candidate cause] caused [adverse outcome]. However, we are uncertain whether [intervention] would reduce the risk of [adverse outcome] in future cases."

  - **For non-manipulable candidate causes (like race)**:
    We do not assign causation. Instead, we might say:
    "We observed that [non-manipulable factor, e.g., race] was associated with the care received and the outcome. However, because we cannot change [factor] and because changing it would involve many other changes, we do not assign it as a cause. Instead, we note that disparities exist and we will investigate systemic factors that might be contributing to these disparities, such as [specific actionable factors, e.g., bias in communication, access issues] and address those."

  - **For a candidate cause that we cannot evaluate due to lack of information**:
    "We do not have enough information to determine the role of [candidate cause] in this case."

  Now, we run the procedure on three cases.

  **Case 1: Delayed antibiotics and septic shock**

  - Adverse outcome: Septic shock.
  - Candidate cause: Delay in giving antibiotics.

  **Procedure:**
  1. Manipulability: Yes. Intervention: Implement a protocol to ensure antibiotics are given within 1 hour for suspected sepsis.
  2. One-off counterfactual (a): We ask: if antibiotics had been given on time, would the patient have avoided septic shock? 
     - We look at the chart: the patient had signs of infection and the delay was 4 hours. Medical evidence shows that early antibiotics reduce the risk of septic shock. In this patient, the progression was typical. So we judge that without the delay, septic shock would have been avoided. (a) true.
  3. Intervention effect (b): If we implement the protocol, will future patients avoid septic shock? We have evidence from the literature (e.g., Surviving Sepsis Campaign) that early antibiotics reduce mortality and progression to shock. We expect it to help. (b) true.

  Finding: 
  "In this case, the delay in administering antibiotics caused the septic shock. If we implement a protocol to ensure antibiotics are given within one hour for suspected sepsis, we expect to reduce the risk of septic shock in similar future cases."

  **Case 2: Weekend admission caused worse outcome**

  - Adverse outcome: Worse outcome (e.g., death, or a complication).
  - Candidate cause: Weekend admission.

  **Procedure:**
  1. Manipulability: We must specify an intervention. What would we do? Let's say the intervention is "increase weekend staffing" or "implement a dedicated weekend team". Without a specific intervention, we stop. But assuming we specify: "increase weekend staffing to match weekday levels". Then we can proceed.
  2. One-off counterfactual (a): If the patient had been admitted on a weekday, would the outcome have been better? 
     - We must consider the cascade: if admitted on a weekday, the same team? Maybe a different team? The same condition? We cannot be sure. Moreover, overdetermination: the patient was very sick and might have died anyway. We are uncertain. We might say: we cannot determine (a) with confidence.
     - Alternatively, we might have a note that the patient did not receive a necessary procedure until Monday. Then we can say: if admitted on a weekday, the procedure would have been done sooner and the outcome would have been better. So (a) true.

     But let's assume we have evidence that the weekend team was short-staffed and that led to a delay in care that would not have happened on a weekday. Then we can say: but for the weekend admission (and the associated delays), the outcome would have been better. So (a) true.

  3. Intervention effect (b): If we increase weekend staffing, will future patients have better outcomes? We look at our own data: do patients admitted on weekends have worse outcomes? If so, and if we can attribute that to staffing, then yes. Also, literature shows the "weekend effect" and that improved staffing reduces it. So (b) true.

  Finding:
  "In this case, the weekend admission caused the worse outcome because of delays in care that we attribute to weekend staffing levels. If we increase weekend staffing to match weekday levels, we expect to reduce the risk of worse outcomes in similar future cases."

  But note: what if the panel is not sure about (a)? Then we might have:
  "In this case, we cannot determine whether the weekend admission caused the worse outcome. However, we believe that increasing weekend staffing would reduce the risk of worse outcomes in future cases."

  **Case 3: Patient's race caused worse outcome**

  - Adverse outcome: Worse outcome (e.g., death, complication).
  - Candidate cause: Patient's race.

  **Procedure:**
  1. Manipulability: Race is not manipulable. We cannot change a patient's race. We cannot specify an intervention that changes race. Therefore, we cannot make a claim about (b). We can only note an association and look for manipulable factors that might be related (like bias in staff behavior, or disparities in access to certain treatments).

     We skip to Step 2d (non-manipulable).

     We note: the evidence is a disparity in our numbers and notes about how staff spoke to her.

     We do not assign causation to race. Instead, we look for manipulable factors that might be contributing to the disparity.

     For example, we might identify:
        - Staff behavior: bias in communication or treatment decisions.
        - We can then run the procedure for "bias in communication" or "inadequate cultural competence" which are manipulable.

     But for the candidate cause "race", we exit with:

     "We observed that the patient's race was associated with the care received and the outcome. However, because we cannot change a patient's race and because race is a complex social factor, we do not assign it as a cause. Instead, we note that racial disparities in care exist and we have identified potential contributing factors that we can address. Specifically, we found evidence of [describe the staff behavior, e.g., dismissive communication] which may have been influenced by unconscious bias. We recommend [intervention, e.g., mandatory training on implicit bias and cultural competence] to reduce such biases in the future."

     We then run the procedure for the new candidate cause: "dismissive communication by staff".

        - Manipulable: Yes, by training and monitoring.
        - (a): In this case, if the staff had communicated appropriately, would the outcome have been better? Maybe not directly, but it might have led to the patient being more willing to report symptoms or adhere to treatment. We might not be able to establish a direct causal link to the outcome, but we can say it contributed to suboptimal care.
        - (b): If we implement training, will it improve outcomes? We expect so, because better communication can lead to better patient engagement and care.

     But note: we might not have time to run all this. So we focus on the actionable factor.

     For the original candidate (race), we output the non-manipulable template.

  **Including an answer we won't like:**
     Consider the delayed antibiotics case again, but now suppose we have evidence that the patient was already in septic shock when they arrived (but it was not recognized). Then the delay in antibiotics might not have caused the shock (because it was already present) but might have contributed to the death. Then (a) for "caused septic shock" is false. We might then have (a) for a different outcome (death) and (b) true for reducing mortality.

     So we might have:
        (a) for septic shock: false (because it was already present).
        (a) for death: if the delay caused the death (by not treating the shock in time) then true.
        (b) for death: true (early antibiotics reduce mortality).

     But our candidate cause was originally for septic shock. We must adjust the adverse outcome.

     This shows the importance of defining the outcome precisely.

     Finding for septic shock:
        "We found that the delay in antibiotics did not cause the septic shock because the patient was already in shock on arrival. However, the delay did contribute to the patient's death. If we implement a protocol for early antibiotics, we expect to reduce mortality in similar future cases."

  **Where the procedure might misfire:**
     - **Time constraints**: We might not get through all candidate causes. We must prioritize.
     - **Complex counterfactuals**: Sometimes the cascade of changes is too complex to reason about in 90 minutes. We might have to rely on expert judgment and note uncertainty.
     - **Overdetermination**: We might miss that there were multiple sufficient causes and incorrectly assign (a) as true or false.
     - **Confounding in (b)**: We might think an intervention will help, but we don't have good evidence. We might over-rely on our own registry data which might be confounded.
     - **Non-manipulable factors**: We might not have a good way to handle them other than to note an association and look for proxies.

  **What it can't do:**
     - It cannot create data we don't have.
     - It cannot handle cases where the counterfactual is extremely complex (e.g., changing one event changes many others in unpredictable ways).
     - It cannot prove causation beyond doubt; it's a structured judgment.

  Final Procedure Document:

  **Hospital Serious Incident Review Panel Causal Finding Procedure**

  1. **Define the incident**: 
     - Clearly state the adverse outcome (e.g., septic shock, death, complication).
     - List candidate causes (factors that might have contributed) from the chart, interviews, and panel discussion. (Time: 10 minutes)

  2. **Prioritize candidate causes**: 
     - Focus on factors that are both significant (based on the evidence) and potentially actionable. Start with the most promising. (Time: 5 minutes)

  3. **For each candidate cause** (until time runs out or we have addressed the most important ones):

     a. **Manipulability Check** (2 minutes):
          - Ask: "What specific intervention could we implement to change this factor? (Be concrete: e.g., for 'delayed antibiotics', the intervention is 'implement a sepsis protocol with a 1-hour antibiotic target'.)"
          - If no intervention can be specified, then:
               - If the factor is non-manipulable (like race, age, frailty, or a weekend without a staffing change), then skip to step 3d for non-manipulable factors.
               - Otherwise, if it is manipulable but we just haven't specified, take 3 minutes to specify one. If we still can't, then mark as non-manipulable.

     b. **One-off Counterfactual (a)** (10 minutes):
          - Ask: "If this candidate cause had been absent (or set to the desired state by the intervention) in this specific case, would the adverse outcome have been avoided (or significantly mitigated)?"
          - Use the but-for test: "But for this factor, would the outcome have been avoided?"
          - Consider overdetermination: were there other factors that would have caused the outcome anyway? If so, then (a) is false.
          - Consider cascading effects: if changing this factor would have changed other events, what would the most likely scenario be? (Use clinical judgment and available evidence.)
          - Vote or reach consensus: (a) true, (a) false, or uncertain.

     c. **Intervention Effect (b)** (10 minutes):
          - Ask: "If we implement the intervention, will it reduce the risk of the adverse outcome for future similar patients?"
          - Use: 
               - Medical knowledge and literature (if known to panel members).
               - Hospital registry data (if available and relevant).
               - Plausibility: does the intervention break the causal chain?
          - Consider unintended consequences? (But we don't have time for a full risk assessment; focus on the direct effect.)
          - Vote or reach consensus: (b) true, (b) false, or uncertain.

     d. **Formulate Finding for this Candidate** (3 minutes):
          - Use the templates above to write a sentence or two.

     e. **Non-manipulable Factors** (if step 3a was non-manipulable) (10 minutes):
          - Do not assign causation to the non-manipulable factor.
          - Instead, note the association and look for manipulable factors that might be underlying (e.g., for race, look for bias in staff behavior, disparities in treatment).
          - Write: "We observed an association between [non-manipulable factor] and the outcome. We cannot assign causation to [factor] because it is not manipulable. However, we identified [manipulable factor, e.g., staff behavior] as a potential contributing factor that we can address. We recommend [intervention]."
          - Then, if time allows, run steps 3b and 3c for the manipulable factor.

  4. **Write the Causal Findings Section** (15 minutes):
     - Combine the findings for all candidate causes we addressed.
     - Keep it concise: one or two sentences per candidate cause.

  5. **Review and Sign-off** (5 minutes):
     - Ensure the language is clear, compassionate (for families), and defensible (for legal).

  **Time Allocation Total**: 
     - Step 1: 10 min
     - Step 2: 5 min
     - Step 3: For each candidate: 2+10+10+3 = 25 minutes (or 10 min for non-manipulable). So for two candidates: 50 minutes.
     - Step 4: 15 min
     - Step 5: 5 min
     Total: 85 minutes (allowing for some flexibility).

  **Note**: If a candidate cause is too complex and time runs out, we note: "We did not have sufficient time to fully evaluate [candidate cause]." and move on.

  We now run the three cases through this procedure in the allotted time.

  Let me know if you need adjustments.
answer: |-
  Below is a structured, step-by-step procedure for your panel to systematically evaluate causal claims in serious incident reviews. It addresses your two core messes: (1) separating one-off counterfactuals ("this patient") from intervention effects ("future patients"), and (2) requiring manipulability (clear actions) for causal claims. The procedure is designed for **90-minute meetings**, uses **only available data** (charts, interviews, registry data), and includes safeguards for overdetermination, cascading counterfactuals, and non-manipulable factors. 

  Each step includes:
  - **Test/question** to ask.
  - **Decision criteria** (what counts as a sufficient answer).
  - **Exit points** with specific sentence templates (readable for families, defensible in depositions).
  - **Time allocation** to keep within 90 minutes.

  The procedure forces a split between claims (a) and (b), and blocks findings where no intervention exists. It prioritizes clarity and actionability.

  ---

  ### **Procedure: Causal Evaluation Protocol**
  **Total Time:** 90 minutes per case (strictly enforced).  
  **Inputs:** Adverse outcome, candidate causes (identified in pre-meeting chart review).  
  **Output:** A "causal findings" section with 1–3 bullet points (or "no causal finding").

  #### **Step 1: Define Candidate Cause and Intervention (5 min)**
     - **Test:** _"What specific, concrete intervention could change this candidate cause? Describe how the intervention works (e.g., ‘protocol change,’ ‘training’)."_  
     - **Criteria:** 
       - Intervention must be **actionable by the hospital** (e.g., "add sepsis checklist" ✅; "eliminate weekends" ❌). 
       - If no intervention is specifiable, exit to **Template A**.
     - **Exit: Non-manipulable cause** → **Template A**  
       *Template A: "We identified [candidate cause] as a contextual factor, but it cannot be directly changed by hospital actions. We will address related modifiable factors (e.g., [linked action, like ‘staff training’]) in recommendations."*  
     - **Proceed if:** Intervention is specifiable (e.g., for "weekend delays," intervention is "add weekend pharmacist").

  #### **Step 2: One-Off Counterfactual (Did it cause harm in *this* case?) (25 min)**  
     - **Test:** _"If [candidate cause] had not occurred, would [adverse outcome] have been avoided, given the actual circumstances? Consider overdetermination (e.g., other simultaneous causes) and cascading effects (e.g., changing one event alters others)."_  
     - **Criteria:** 
       - Use **but-for test** + **clinical judgment** (based on chart/interviews). 
       - **Sufficient evidence:** Chart data shows a clear causal pathway (e.g., delay preceded shock; no other fatal factors). 
       - **Insufficient evidence:** Conflicting data, overdetermination, or cascading changes make the counterfactual unreliable (e.g., "if admitted Monday, a different team might have made the same error"). 
     - **Exit points:**  
       - **True** → Proceed to Step 3.  
       - **False/Uncertain** → **Template B**  
         *Template B: "In this case, [candidate cause] did not directly cause [adverse outcome] because [brief reason, e.g., ‘other factors were sufficient’ or ‘evidence is inconclusive’]."*  

  #### **Step 3: Intervention Effect (Will the change help *future* cases?) (25 min)**  
     - **Test:** _"If we implement [intervention], would future patients with similar conditions have a lower risk of [adverse outcome]? Consider: Does the intervention break the causal chain? Are there unintended consequences?"_  
     - **Criteria:** 
       - Use **registry data, literature, or mechanistic reasoning** (e.g., "antibiotics delay → shock" is biologically plausible). 
       - **Sufficient evidence:** (1) Data shows cause-outcome association + intervention disrupts it (e.g., sepsis protocols reduce shock in studies), or (2) A clear causal mechanism exists. 
       - **Insufficient evidence:** No data/mechanism, or intervention has no clear link to outcome (e.g., "weekend staffing" may not fix handoffs). 
     - **Exit points:**  
       - **True** → **Template C**  
       - **False/Uncertain** → **Template D**  
         *Template C: "In this case, [candidate cause] directly caused [adverse outcome]. Implementing [intervention] is expected to reduce this risk for future patients."*  
         *Template D: "In this case, [candidate cause] directly caused [adverse outcome]. However, [intervention] is unlikely to improve outcomes because [reason, e.g., ‘flawed mechanism’ or ‘no evidence of effect’]."*  

  #### **Step 4: Values Check (For non-manipulable or equity-related causes) (10 min)**  
     - **Test:** _"Is this candidate cause tied to systemic inequities (e.g., race, language barriers)? If yes, what modifiable hospital factors (e.g., bias, access) contributed?"_  
     - **Criteria:** 
       - Only triggers for equity-sensitive factors (e.g., race, gender, disability). 
       - Evidence required: Patterns in hospital data + specific incidents (e.g., notes showing dismissive communication). 
     - **Exit points:**  
       - **Modifiable contributors found** → **Template E**  
       - **No actionable contributors** → Omit from findings (add to recommendations as "systemic review needed").  
         *Template E: "Hospital factors [e.g., biased communication, inequitable access] contributed to the outcome. We will implement [action, e.g., training, interpreter services] to address these in future cases."*  

  #### **Step 5: Finalize & Sign Off (5 min)**  
     - Combine outputs from Steps 1–4 into 1–3 bullet points.  
     - Legal/chair review: Ensure language is consistent with templates.  
     - **No finding?** Use: _"No causal factor meeting our criteria was identified. We recommend [e.g., further analysis, broader systems review]."_  

  ---

  ### **Example Runs of the Procedure**
  #### **Case 1: Delayed Antibiotics → Septic Shock**  
  - **Step 1:** Intervention = "Sepsis protocol with 1-hour antibiotic mandate." ✅ Proceed.  
  - **Step 2:** But-for test ✅ (chart shows delay preceded shock; no other causes). **True** → Proceed.  
  - **Step 3:** Intervention effect ✅ (literature links faster antibiotics to lower shock risk). **True** → **Template C**.  
  - **Output:** _"In this case, the delay in administering antibiotics directly caused septic shock. Implementing a sepsis protocol with a 1-hour antibiotic mandate is expected to reduce this risk for future patients."_  

  #### **Case 2: Weekend Admission → Worse Outcome**  
  - **Step 1:** Intervention = "Add weekend physical therapist." ✅ Proceed.  
  - **Step 2:** But-for test ❌ (patient was unstable; death likely even with weekday admission). **False** → **Template B**.  
  - **Step 3:** Intervention effect ✅ (registry data shows weekend mobility delays increase complications). **True** → **Template C** (but paired with B).  
  - **Output:** Two bullet points:  
    _1. "In this case, weekend admission did not directly cause the outcome because the patient’s condition was irreversibly high-risk."_  
    _2. "However, adding weekend physical therapists is expected to reduce mobility-related complications for future patients."_  

  #### **Case 3: Patient’s Race → Worse Outcome**  
  - **Step 1:** Intervention = ? Race is **non-manipulable** → **Template A**.  
  - **Step 4:** Values check ✅ (notes show staff dismissed symptoms; hospital data shows racial outcome gaps). Modifiable factor = "biased communication." → **Template E**.  
  - **Output:** _"Hospital factors (including biased communication) contributed to the outcome. We will implement mandatory bias training and standardized symptom assessment to address these in future cases."_  
  - **Why you won’t like this:** It avoids the causal claim about race itself (which legal would reject) but forces action on modifiable hospital factors.  

  ---

  ### **Where the Procedure Misfires (and Fixes)**  
  1. **Overdetermination (e.g., multiple sufficient causes):**  
     - **Risk:** Step 2 may misjudge "but-for" if panel misses a hidden factor.  
     - **Mitigation:** Use registry data to flag common co-factors (e.g., "sepsis + renal failure" outcomes).  

  2. **Cascading counterfactuals (e.g., "if admitted Monday..."):**  
     - **Risk:** Step 2 may become speculative.  
     - **Mitigation:** Require chart evidence for alternative scenarios (e.g., "if delay avoided, would antibiotics have worked?").  

  3. **Weak data for intervention effects (Step 3):**  
     - **Risk:** "Expected to reduce risk" claims may be overconfident.  
     - **Mitigation:** Use "likely" instead of "will" in templates; add uncertainty to reports.  

  4. **Non-manipulable systemic factors (e.g., poverty):**  
     - **Can’t do:** Assign causation (e.g., "poverty caused death").  
     - **Can do:** Flag for social work partnerships (in recommendations).  

  **What It Can’t Do:**  
  - Predict intervention effectiveness with certainty (no RCTs).  
  - Handle highly complex cases (>2 candidate causes) in 90 minutes (prioritize 1–2 per meeting).  
  - Replace legal expertise (all outputs require legal sign-off).  

  ---

  ### **Templates Summary**
  | Exit Point | Template | Use When |
  |------------|----------|----------|
  | **A** | _"We identified [cause] as a contextual factor, but it cannot be directly changed. We will address [modifiable factor]."_ | Non-manipulable causes (e.g., race, weekends). |
  | **B** | _"In this case, [cause] did not directly cause [outcome] because [reason]."_ | Step 2 false/uncertain. |
  | **C** | _"In this case, [cause] directly caused [outcome]. Implementing [intervention] is expected to reduce risk for future patients."_ | Both (a) and (b) true. |
  | **D** | _"In this case, [cause] directly caused [outcome]. However, [intervention] is unlikely to improve outcomes because [reason]."_ | (a) true, (b) false. |
  | **E** | _"Hospital factors [e.g., bias] contributed. We will implement [action]."_ | Equity-related modifiable factors. |

  This procedure ensures findings are **clear, actionable, and defensible**, while forcing the panel to disentangle the two types of causal claims. Run it as a checklist in meetings—it will feel rigid at first but will reduce ambiguity and wasted time.
