prompt: |-
  hey — I'm in a cross-listed phil/public policy seminar on the ethics of the far future, and our TA (Rob, he's a 4th year) runs these weekly "you can fund exactly one of these two things" pairs and then posts his own answers on friday. I've been trying to work out what rule he's actually running and I cant, and there's a case coming up that I think splits the options, so I want a second opinion.

  the stipulations he makes us hold fixed every week: same price, you can't bank or invest the money and give it later, the two groups of beneficiaries don't overlap, no flow-on effects on anyone else, and (unless he says otherwise) the choice doesn't change who ends up existing.

  his verdicts so far:

  - 100 lives now vs 100 lives in 25 years, ~8% chance the future project fizzles and delivers nothing → now, but "only just"; he thought he'd switch somewhere a bit above 110 in the future but wasnt precise about where
  - 100 now vs 125 in 70 years, ~25% fizzle → now
  - 100 now vs 400 in 150 years, ~30% fizzle → later, "not close"
  - 100 now vs 300 in 400 years, ~70% fizzle → now
  - same person either way: 10 years of good health starting now vs 10 years of good health starting in 30 years, both certain, they'd live through both → he said he'd take the earlier ten for himself, but that a government allocating the same ten years to someone else should be indifferent, and then he admitted he couldn't say why those two come apart
  - 100 existing lives saved now vs a program 100 years out that results in 300 extra people existing who otherwise wouldn't, all with lives well worth living → now, and he said something like "that one's about who exists, not about when"

  one time in section he said "I don't think the year a benefit lands in is itself a reason," and in the same breath "though there is something special about people you can actually look in the eye," and when someone asked what that meant he said he'd get back to us and never did.

  the new case is the one I care about. same standing stipulations, but it's a sure-thing one: option 1 is 100 life-saving treatments delivered now, to people who are badly off. option 2 is 130 life-saving treatments delivered in 500 years, with a guarantee you're meant to treat as exactly as good as option 1's — picture a sealed, self-triggering cache that doesn't depend on any institution still being around, so the chance it delivers is ~99%, same as the present option. and the people in 500 years are stipulated to be no better off and no worse off at baseline than the people now, so it's not a "the money goes further for the poor" thing either, and it doesn't change who exists.

  so: does Rob fund the 100 now or the 130 in five centuries? what's the rule he's been running, which of the rules that fit his old verdicts come apart on this one, and what's the single further case you'd put to him to settle it? if you think his track record honestly doesn't determine this, say that instead and tell me what he'd be committing himself to with each answer.

  start with the call in your first sentence (which option, and how confident you are), then the reasoning. no preamble, and please don't explain the question back at me.
reasoning: |-
  Alright, let's tackle this step by step. The user is in a seminar on the ethics of the far future, and their TA, Rob, has been giving verdicts on funding choices between two options under specific constraints. The user wants to figure out Rob's underlying rule and predict his decision for a new case: 100 lives saved now vs. 130 lives saved in 500 years with near certainty.

  First, I need to analyze Rob's past verdicts to identify a pattern. Here's a summary:

  1. **100 now vs. 100 in 25 years (8% fizzle)**: Rob chose "now" but barely. He mentioned switching around 110+ future lives. This suggests a low discount rate since 25 years isn't long, and a small fizzle risk doesn't outweigh the near-equivalence.

  2. **100 now vs. 125 in 70 years (25% fizzle)**: Rob picked "now." The fizzle risk is higher here, and 125 isn't enough to compensate for both the wait and the risk. 

  3. **100 now vs. 400 in 150 years (30% fizzle)**: Rob chose "later" decisively. The larger number (400) justifies the longer wait and moderate risk.

  4. **100 now vs. 300 in 400 years (70% fizzle)**: Rob chose "now." The high fizzle risk makes the future option too unreliable despite the higher number.

  5. **Same person: health now vs. in 30 years**: Rob personally prefers now but thinks a government should be indifferent. This inconsistency hints at a distinction between personal and impartial perspectives, possibly due to psychological factors like temporal discounting for oneself but not for others.

  6. **Existing lives saved now vs. creating future lives**: Rob chose "now," emphasizing it's about who exists (existing people matter more than potential ones).

  Rob's comment about not discounting time but valuing "people you can look in the eye" suggests a present bias or priority for identifiable lives over statistical ones. 

  Now, the new case: 100 lives now vs. 130 lives in 500 years, both almost certain (99% delivery). The key factors are the long timeframe (500 years) and the modest increase to 130 lives. 

  Looking at past cases, Rob heavily discounted distant futures with high fizzle risks (cases 3 and 4) but accepted a larger benefit (400 lives) at 150 years. Here, 500 years is much longer, and 130 is only a 30% increase. Case 4 had 300 lives at 400 years with 70% fizzle, and he chose present. The new case has lower risk but a much longer time. 

  Rob's aversion to long timeframes (case 4) and his emphasis on existing lives (case 6) suggest he'd favor the present option. The 30% increase might not be enough to offset the 500-year wait, even with low risk. His "people you can look in the eye" comment reinforces prioritizing current identifiable lives. 

  The rule seems to be a combination of risk-adjusted discounting and a prioritarian view favoring existing people. The risk adjustment is multiplicative: expected lives = nominal lives × (1 - fizzle chance). Then, apply a discount rate that increases with time but isn't exponential. For example, a hyperbolic discount rate where future benefits are discounted more sharply initially but less so over very long periods. 

  In the new case, expected future lives are 130 × 0.99 ≈ 128.7. Discounted value over 500 years: even a low discount rate (e.g., 0.1% per year) would reduce this significantly. At 0.2% per year, the present value is about 48 lives, less than 100. Rob's past choices imply a discount rate between 0.1-0.3%. 

  Cases that split potential rules: 
  - Pure discounting with no risk adjustment would always favor the future if the number is higher, but Rob rejected 300 at 400 years due to high fizzle. 
  - A prioritarian view (existing over potential lives) doesn't apply here since the future beneficiaries exist regardless. 

  To settle the rule, propose a case with 100 now vs. 200 in 50 years (low fizzle, say 5%). If Rob chooses future, he uses moderate discounting; if now, he has a strong present bias.
answer: |-
  Rob funds the 100 now. High confidence (85%).  

  **Reasoning**: Rob’s rule combines **risk-adjusted hyperbolic discounting** with a **moderate prioritarian bias for existing lives**.  
  - **Discounting**: He uses a declining discount rate (e.g., high initial discount that flattens over time), not exponential. Case 1 (25 years) shows near-indifference for equal lives with low risk, while Case 4 (400 years) rejects 300 lives at 70% fizzle—indicating heavy long-term discounting.  
  - **Risk adjustment**: He multiplies future lives by success probability (e.g., 100 future lives × 92% ≈ 92 < 100 → "now" in Case 1).  
  - **Prioritarianism**: Case 6 shows he prioritizes existing lives over creating new ones. His "look in the eye" comment implies a bias toward identifiable present beneficiaries.  

  **New case calculation**:  
  - Future expected lives: 130 × 99% ≈ 128.7.  
  - Discounted value over 500 years: Even at 0.2% annual discount (fits his "switch point" in Case 1), present value ≈ 128.7 / (1.002)^500 ≈ 47 lives. This is <100. Higher discount rates (e.g., 0.3%) make it negligible.  
  - His aversion in Case 4 (300 lives/400y/70% fizzle → expected 90 lives) mirrors this: 500 years is longer, and 128.7 expected lives isn’t sufficient to overcome discounting + prioritarianism.  

  **Rules that split on this case**:  
  1. **Pure prioritarianism** (existing > future) → Funds now.  
  2. **Low constant discounting** (e.g., 0.1%/year) → Funds later (130 discounted ≈ 78 > 100? Contradicts Case 4).  
  3. **Zero discounting, only risk-adjustment** → Funds later (128.7 > 100), but Rob’s Case 4 rejection rules this out.  

  **Single further case to settle it**:  
  - **100 lives now vs. 180 lives in 50 years, 5% fizzle risk**.  
    - *Why?* Tests discounting vs. prioritarianism:  
      - If he funds *now*, he prioritizes existing lives strongly (since 180 × 95% ≈ 171, discounted at 0.2%/year ≈ 155 > 100).  
      - If he funds *later*, he relies on discounting alone.  
    - Rob’s likely choice: Later (fits Case 1’s near-indifference at 25y; 50y is still "near" for hyperbolic discounting).  

  **If he funds the 130 in 500y**: Commits to very low discounting (≤0.1%/year) and rejects prioritarianism.  
  **If he funds the 100 now**: Confirms moderate discounting + prioritarianism. Given his history, this is far likelier.
