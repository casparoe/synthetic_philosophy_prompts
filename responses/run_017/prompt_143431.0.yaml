prompt: |-
  I've held for years, mostly from hanging around the usual blogs and forums, that Aumann's agreement theorem is doing real normative work and isn't just a cute puzzle: two people with a common prior who have common knowledge of each other's posteriors can't agree to disagree, so when smart, well-informed people stay apart on something after years of trading arguments, that's evidence somebody is failing to update, or that one of us was never really an epistemic peer.

  Stress-test that. What would count against it, ranked from fatal to merely awkward? I care most about which assumptions actually fail for beings like us — the common prior, common knowledge of *posteriors* rather than of what people say out loud, a shared state space, the unbounded-computation bit — and which of those failures are live in real disagreements versus merely logically available. Please separate what a defender of the view would itself concede counts against it from what only critics say.

  Two things I've been chewing on that I want ruled on. First: the disagreements I actually care about mostly aren't about probabilities inside a model, they're about which model or which state space to use at all, where it's not obvious a common prior is even defined. Is that a genuine defeater or just the common-prior objection in a hat? Second: the theorem is about credences in events, but my disagreements are usually about what to do, or about which considerations count as reasons — does it reach those, or is applying it there a category error?

  Also: its a theorem, so no observation can refute it as such. Say honestly whether the version I stated has been qualified into unfalsifiability, whether that's a problem for this kind of claim, and whether it predicts anything the rival "priors just differ, nothing to see here" view doesn't. What would move me most is an argument that the conditions are unreachable in principle for bounded agents rather than just messy in practice; "people are irrational sometimes" wouldn't move me at all.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're deeply engaged with Aumann's agreement theorem and its normative implications. They've held the belief that persistent disagreements among smart, well-informed people indicate some epistemic failure, either in updating or peer status. Now they want to stress-test this view, focusing on assumptions that might fail for humans and how those failures play out in real disagreements.

  First, I need to recall the key assumptions of Aumann's theorem: common prior, common knowledge of posteriors, shared state space, and logical omniscience. The user is particularly interested in which of these are problematic for beings like us, and they want the objections ranked from fatal to awkward. They also mentioned two specific points: disagreements about model choice rather than probabilities within a model, and whether the theorem applies to practical decisions versus credences.

  The user's identity seems to be someone familiar with rationalist blogs and forums, possibly involved in debates where this theorem is cited. Their explicit needs are a structured critique of the theorem's applicability, but deeper down, they might be seeking validation of their epistemic practices or tools to navigate real-world disagreements more effectively. They might also want to understand if their use of the theorem in arguments is justified or if there are stronger counterarguments they haven't considered.

  Starting with the fatal flaws, computational limits come to mind. Humans can't process all implications of their knowledge instantly. In real-time debates, even if agents share a prior, they might not reach agreement due to bounded rationality. This isn't just a practical issue; it's a principled one because common knowledge requires agents to infinitely iterate knowledge states, which is impossible for humans. This directly challenges the theorem's applicability in principle, not just practice.

  Next, common knowledge of posteriors. The theorem requires agents to know each other's exact beliefs, but in reality, people express statements, not their true credences. Miscommunication, insincerity, or differing interpretations of statements can prevent common knowledge. This is a structural barrier because even honest agents might not convey their beliefs precisely enough. So this is a fatal flaw in practice, undermining the theorem's real-world relevance.

  The shared state space issue is another critical point. When disagreements involve which model to use, there's no common prior defined over the same possibilities. For example, in politics or philosophy, foundational differences in frameworks mean no shared reference point. This isn't just a minor hiccup; it's a fundamental obstacle that makes the theorem inapplicable to many high-stakes disagreements. The user's point about model disagreements is spot-on here—this is a genuine defeater, not just a rehash of the common prior objection.

  Common prior assumption is tricky. While the user is less moved by "people are irrational," the common prior might not exist in practice. Humans form priors through different experiences, and even with the same information, cultural or innate biases could lead to different starting points. Critics argue this is a live issue in real disagreements, though defenders might say it's a failure of idealization. Given the user's focus on real-world applicability, this ranks as awkward but not fatal, as the theorem still holds if common priors exist.

  Moving to the user's second point: applying the theorem to decisions and reasons. The theorem is about credences, not actions. Decisions involve utilities and risk preferences, which add layers beyond beliefs. Even with agreement on facts, differing values can lead to different choices. Similarly, disagreements about what counts as a reason touch on epistemology itself, which isn't covered by the theorem. So applying it here is a category error. This is a significant limitation for the user's concerns, which often involve practical actions.

  The user also asks about falsifiability. Since the theorem is a mathematical truth, it can't be refuted by observation. But the normative claim—that persistent disagreement implies epistemic failure—can be tested. However, the theorem's conditions are so idealized that any real disagreement can be attributed to unmet assumptions, making the claim unfalsifiable in practice. This is problematic because it shields the theorem from criticism, whereas the differing priors view is simpler and doesn't require such idealizations.

  In terms of predictive power, the theorem doesn't offer much beyond the rival view. Both can explain persistent disagreements, but the differing priors view doesn't need to invoke irrationality or computational limits. The theorem's defenders might argue that it highlights the importance of communication and common knowledge, but critics see it as overcomplicating a simpler explanation.

  Putting it all together, the computational and common knowledge flaws are fatal in principle for humans. Model disagreements are a genuine defeater, and applying the theorem to decisions is a category error. The user's deeper need might be to understand whether their epistemic framework is robust or if they need to adjust their approach in debates. Acknowledging these limitations doesn't dismiss the theorem's insight but contextualizes its use, suggesting that in many real disagreements, differing priors or frameworks are more plausible than epistemic failure.
answer: |-
  Here's a stress-test of your core claim, structured as requested: fatal flaws first, then awkward problems, addressing your specific concerns, and separating defender concessions from critic attacks. The focus is on *principle* for bounded agents like us and *live* failures in real disagreements.

  **Core Claim Under Test:** Persistent disagreement between apparently smart, well-informed parties *after extensive argument* is strong evidence for either (a) failure to update rationally or (b) lack of true epistemic peer status (e.g., differing fundamental priors, competence, or evidence access).

  **Fatal Flaws (In Principle for Bounded Agents, Often Live in Practice):**

  1.  **Bounded Computation & Logical Omniscience (Defender Concedes, Fatal in Principle):**
      *   **The Problem:** Aumann's theorem assumes agents are logically omniscient. They instantly know all logical consequences of their information partition and the common prior. Humans *cannot* do this. Complex models, intricate evidence, and subtle arguments have implications that even brilliant humans take time (or forever) to uncover. Agreement requires *reaching* the fixed point where posteriors match *and* this is common knowledge. Bounded agents may stall at different points in the computation long before convergence.
      *   **Why Fatal:** This isn't "people are irrational sometimes"; it's "people are *fundamentally incapable* of meeting the computational demands *in principle* for non-trivial disagreements." The theorem describes an asymptotic endpoint unreachable for finite minds with limited time/compute.
      *   **Live in Real Disagreements:** Ubiquitous. Think complex climate models, macroeconomic forecasts, intricate philosophical arguments, or nuanced historical interpretations. Parties disagree precisely *because* they haven't (and may never) fully computed the implications of shared evidence within their own models, let alone achieved common knowledge of the other's *complete* posterior landscape.

  2.  **Common Knowledge of Posteriors (Defender Concedes, Fatal in Practice/Structure):**
      *   **The Problem:** The theorem requires common knowledge of *exact posterior probabilities*. Humans don't have direct access to each other's minds. We hear *statements* ("I think there's a 70% chance"), *arguments*, and *actions*. Translating these into precise, common-knowledge posteriors is fraught:
          *   **Sincerity & Communication:** Is the stated probability sincere? Is it understood identically? Does "70%" mean the same thing to both parties? Does a forceful argument imply a probability of 1.0 or just >0.5?
          *   **Partition Refinement:** Arguments reveal *what* information someone has, but rarely *precisely how* it partitioned their state space. Ambiguity in interpretation prevents the necessary refinement.
      *   **Why Fatal:** This creates a *structural barrier* to ever satisfying the theorem's core condition in practice, even with honest, rational agents. Common knowledge of statements ≠ common knowledge of true posteriors.
      *   **Live in Real Disagreements:** Extremely live. Most debates involve interpreting the *strength* and *meaning* of each other's stated positions and arguments. Disagreement often persists *because* parties doubt the sincerity or true probabilistic interpretation of the other's statements ("They *say* it's 60%, but they argue like it's 95%!").

  3.  **Shared State Space / Model Disagreement (Defender Concedes, Genuine Defeater):**
      *   **The Problem:** This is **not** just the common prior objection "in a hat". It's deeper. Aumann's theorem operates *within* a predefined, mutually exhaustive state space Ω. Your core concern – disagreements about *which model* or *which state space* to use – occurs *before* Aumann applies. There is no "common prior" defined over incompatible frameworks (e.g., Newtonian vs. Relativistic physics for a specific prediction; materialist vs. dualist metaphysics; specific vs. general equilibrium economic models).
      *   **Why Fatal:** The theorem fundamentally *cannot engage* with meta-disagreements about the appropriate ontology or framework for describing the world. It assumes the state space is fixed and shared. If parties can't even agree on what the possible worlds *are* or what variables are relevant, the theorem is inapplicable from the start.
      *   **Live in Real Disagreements:** Dominant for high-stakes disagreements (politics, philosophy, complex sciences, religion, long-term forecasting). Disagreements about AI risk, economic policy, historical causation, or ethical frameworks are often *primarily* about the model/state space itself.

  **Awkward Problems (Significant Practical Hurdles, Defenders May Downplay):**

  4.  **Common Prior Assumption (Critic Attack, Awkward/Live):**
      *   **The Problem:** While defenders might argue the CP is a useful *idealization* highlighting update failures, critics see it as deeply unrealistic. Humans acquire priors through vastly different life experiences, cultural conditioning, innate biases, and early learning *before* formal "common knowledge" can be established. Even shared "background information" might be interpreted differently.
      *   **Why Awkward (Not Fatal):** Defenders can retreat: "If you *were* true peers with a CP, you'd agree. Persistent disagreement *shows* you lack a CP or peer status." But this risks making the claim unfalsifiable (see below). It shifts the burden: *Why* isn't there a CP? Often, the *reason* is the differing experiences/cognition that make them non-peers *in practice* for this domain.
      *   **Live in Real Disagreements:** Very live. Core disagreements often trace back to foundational worldview differences shaped by fundamentally different prior-forming experiences (e.g., upbringing, core values, traumatic events, field-specific training).

  **Ruling on Your Specific Concerns:**

  *   **Model/State Space Disagreements:** This is a **genuine defeater**, distinct from the common prior objection. It's fatal *for applying the theorem* to the disagreements you care about most. The theorem simply doesn't operate at that meta-level. Aumann might apply *within* each model, but not *between* them.
  *   **Disagreements About Actions/Reasons (Category Error):** Applying Aumann directly here **is a category error**. The theorem is about *beliefs* (credences in events). Decisions require:
      *   **Utilities/Values:** Even with identical beliefs about outcomes, differing utility functions lead to different actions.
      *   **Decision Rules:** Risk aversion, maximin, etc.
      *   **Normative Frameworks:** What *counts* as a reason is often a meta-ethical, philosophical, or domain-specific normative question, not a probabilistic belief about states of the world. Aumann tells you nothing about why someone values liberty over equality or thinks a biblical passage is a relevant reason. This is firmly outside its scope.

  **Falsifiability and Predictive Power:**

  1.  **The Theorem vs. The Normative Claim:**
      *   The **theorem itself** is unfalsifiable math. It's true given its axioms.
      *   Your **normative claim** ("persistent disagreement implies update failure or non-peer status") *is* empirically testable *in principle*, but heavily qualified.
  2.  **Qualified into Unfalsifiability?** **Yes, significantly.** The defender can *always* explain persistent disagreement by invoking:
      *   Lack of true common knowledge of posteriors (always plausible for humans).
      *   Bounded computation preventing convergence (always plausible for non-trivial topics).
      *   Lack of shared state space/model (plausible for framework disputes).
      *   Lack of common prior (shifting to non-peer status).
      *   Hidden differences in evidence access (also non-peer status).
      This makes the core claim extremely hard to falsify – any observed disagreement can be attributed to one of these unmet conditions. The "failure to update" becomes a last-resort explanation *within* the idealized scenario that rarely fully obtains.
  3.  **Predictive Power vs. "Differing Priors":**
      *   **Aumann View:** Predicts that *if* the idealized conditions (CP, shared Ω, CK of posteriors, full rationality/compute) *were* met, agreement *must* occur. Persistent disagreement *proves* these conditions don't hold. Its primary prediction is the *absence* of disagreement under idealization.
      *   **"Differing Priors/Models" View:** Posits that persistent disagreement arises *fundamentally* from differing starting points (priors, models, values, utilities) that rational updating from shared evidence won't necessarily overcome, especially for bounded agents. It predicts persistent disagreement *even among* highly rational, well-intentioned, well-informed agents *without* needing to invoke specific update failures.
      *   **Comparison:** The "Differing Priors/Models" view is **simpler and more directly predictive** of the observed phenomenon (persistent high-level disagreement). It doesn't require counterfactuals about idealizations that are unreachable. The Aumann view's power is primarily *normative* and *explanatory* (highlighting *why* agreement *should* happen if agents were perfect and perfectly transparent), but its *positive* prediction (disagreement implies specific failure) is shielded by numerous unfalsifiable caveats.

  **Conclusion:**

  The most powerful arguments against using Aumann's theorem as strong evidence for update failure/non-peer status in real human disagreements stem from **fundamental limitations of bounded agents**:

  1.  **Fatal in Principle:** Humans cannot achieve the required **logical omniscience/computational convergence** or **common knowledge of true posteriors**. These are unreachable ideals.
  2.  **Fatal for Scope:** The theorem is **inapplicable to meta-disagreements about models/state spaces** and **category errors for disagreements about actions/reasons**.
  3.  **Awkward/Live:** The **common prior assumption** is deeply problematic empirically, and defenders risk unfalsifiability by using disagreement *itself* as evidence the CP wasn't shared.

  While "people are irrational sometimes" is weak, "people are **bounded rational and fundamentally opaque to each other**" is a devastating critique of the theorem's applicability to your core cases. The "differing priors/models/values" view provides a simpler, less idealized, and often more accurate explanation for persistent disagreement among intelligent, informed individuals. Aumann's theorem remains a profound *ideal* about the power of common knowledge and rationality, but its conditions are so stringent that observing disagreement tells us very little about *why* it persists in the messy reality of human cognition and communication.
